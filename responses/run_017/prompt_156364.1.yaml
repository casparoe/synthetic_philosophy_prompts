prompt: |-
  I sit on the ethics and governance panel of a hospital trust that runs a clinical genomic testing service, and we are rewriting what patients get told. Three questions are live: whether to report variants of uncertain significance, whether to report findings for conditions the patient was not tested for, and whether a patient may file a standing instruction not to be told certain classes of result.

  One member of the panel closes almost every discussion with the same argument. Information, he says, is like a sharper photograph of a fixed scene. You can always squint, or blur the image, or look away, so a higher-resolution image cannot leave you worse at whatever task you were using it for; worse, in his view, only if you insist on looking at something you would have preferred not to see, which is your business and not the panel's. And this, he says, is exactly what the decision-theoretic result usually known as the value-of-information theorem says in its formal dress: for an agent who updates by conditionalisation and maximises expected utility, the expected value of an additional signal, assessed before the signal arrives, is never negative, and is strictly positive just in case the signal could change what the agent does in some state of the world. His conclusion is that release is at worst neutral, that withholding is a form of paternalism, and that the burden of argument always falls on suppression rather than on disclosure.

  I am not persuaded, but I cannot say exactly where the picture stops fitting, and I would rather not overrule him on instinct. Please audit the analogy.

  Give me the correspondence table first: what plays the part of the resolution, of the scene, of the camera, of the viewer, of the task the image is for, of squinting, and of the cost of taking the photograph. Then separate the disanalogies that matter for the use he is making of it from the ones that are merely decorative. I would like the following pressed specifically.

  Whether the squinting move is bearing more weight than the theorem gives it. The theorem lets the agent adopt any decision rule as a function of the signal, including a constant one; that is the formal counterpart of looking away. Say what has to be true for that option to be genuinely available — that ignoring costs nothing, that attention is not scarce, that the viewer can decline to attend and yet still know what he would have done without the image, that the viewer's preferences and competence are themselves unmoved by having seen it.

  Whether the ex ante framing is doing work he does not acknowledge, given that he is arguing for a policy applied to people one at a time and that a realised result can leave a particular patient worse off even when the prospect was non-negative in expectation.

  Whether the fixed scene holds. In the photograph case there is a state of the world the image resolves more or less finely, and more resolution is a refinement. In our case the report is evidence about a laboratory's current opinion, the meaning of which is revised over years; a variant of uncertain significance may be reclassified long after it is filed. Say whether that is a refinement of the same scene at all, and what follows if it is not.

  Whether the single-viewer assumption is doing the heaviest work of all. A photograph is looked at by one person and changes nothing else. A result enters a record that clinicians, relatives, insurers and employers can act on, and some arrangements — risk pooling, insurance, anything that depends on a shared ignorance — can stop working when the ignorance is removed, even though no individual has been made worse off by knowing. I want to know whether this breaks the move from cannot harm the recipient to cannot harm, or whether it is a separate argument he is entitled to set aside.

  Whether the theorem is about gross or net value, and what our panel should do with the acquisition, follow-up and downstream-testing costs that disclosure sets in motion.

  Then run the audit on three proposals in front of us: reporting variants of uncertain significance to healthy adults; offering direct to consumers a polygenic score for a common disease for which no preventive intervention exists; and reporting, in a child's genome, a finding for a late-onset condition with no treatment, where the parents had asked for everything to be reported. For each, say which disanalogy carries the weight, and whether our default should flip.

  Finally, tell me whether there is a better single picture for the case where information is generated for one person and read by many, and whether the honest answer is that no picture fits — and if so, what the panel should put in place of one. Please answer in British English.
reasoning: |-
  Hmm, the user is on a hospital ethics panel dealing with genomic testing disclosures and has a colleague who keeps invoking decision theory to argue for full transparency. They're asking me to audit that analogy thoroughly.

  The colleague's argument boils down to: more information never harms because you can always ignore it - citing the value-of-information theorem. The user wants me to dissect this analogy piece by piece.

  Let me map the photographic analogy to the genomic context first:
  - Resolution = Level of genetic detail reported
  - Scene = Patient's actual genetic status
  - Camera = Testing technology
  - Viewer = Patient
  - Task = Health decisions
  - Squinting = Ignoring unwanted info
  - Cost = Testing expenses

  Now the critical disanalogies that actually break the argument:
  First, "squinting" isn't free in reality. Once you've seen genetic risk info, you can't unsee it - it causes anxiety, affects insurance, and changes how you view your future health. The theorem assumes perfect psychological detachment that humans don't have.

  Second, the "ex ante" framing is misleading. While the chance of harm might be low beforehand, some patients definitely end up worse off - like someone who learns about an untreatable condition and develops severe health anxiety. The theorem's statistical positivity doesn't prevent individual harm.

  Third, the "fixed scene" is fiction. Genetic interpretations evolve - today's VUS might be tomorrow's pathogenic variant, or vice versa. Unlike a photograph capturing a moment, genomic reports are provisional snapshots of a shifting landscape.

  Fourth, the single-viewer assumption ignores systemic effects. Once in medical records, genetic info can affect insurance eligibility, family dynamics, and even destabilize risk-pooling systems. The theorem never accounts for these network effects.

  Fifth, costs are conspicuously absent. The theorem considers information value in isolation, but in healthcare, every disclosure triggers follow-up tests, consultations and surveillance costs that consume finite resources.

  Applying this to their three cases:
  For VUS in healthy adults - the main issue is the non-fixed scene (interpretations change) and the illusion of free squinting (persistent anxiety despite "ignoring").
  For polygenic scores without interventions - here the "task" disappears (no actionable decisions) while costs remain, making the information net-negative.
  For childhood late-onset findings - violates the single-viewer principle (parents receiving info about child's future) and the squinting myth (permanent burden of knowing).

  No single metaphor captures this complexity well. Perhaps better to think of genetic information as radioactive material - valuable but requiring containment protocols. The panel needs layered consent processes, partitioned record systems, and explicit harm-benefit thresholds rather than default transparency.

  The paternalism charge deserves nuance: responsible withholding isn't about overriding autonomy but about preventing unavoidable harms that patients can't consent to because they occur after disclosure. The real burden of proof should be on demonstrating net benefit, not on justifying restraint.
answer: |-
  Below is a systematic audit of the "sharper photograph" analogy in the context of clinical genomic disclosure, addressing your specified concerns. I'll follow your requested structure, using British English throughout.

  ### Correspondence Table
  | **Photograph Analogy** | **Genomic Context** |
  |------------------------|---------------------|
  | Resolution             | Level of genetic detail reported (e.g., VUS vs. pathogenic variant) |
  | Scene                  | Patient's genetic status (conceptually fixed but epistemically uncertain) |
  | Camera                 | Genomic testing technology/platform |
  | Viewer                 | Patient (or parents, in paediatric cases) |
  | Task                   | Health/life decisions (e.g., preventive measures, family planning) |
  | Squinting/blurring     | Cognitive avoidance/ignoring information post-disclosure |
  | Cost of photograph     | Financial/psychological costs of testing, analysis, and follow-up |

  ### Critical Disanalogies (Weighted by Materiality to the Argument)
  #### 1. **The "Squinting" Fallacy**  
     - **Why it breaks the theorem:** The theorem assumes "ignoring" is costless and perfectly effective. In genomics:  
       - **Attention is not scarce but sticky:** Once seen, information cannot be un-known (the "burnt knowledge" problem). Ignoring clinically salient data requires sustained cognitive effort, often worsening anxiety (e.g., a VUS result causing "patients in permanent limbo").  
       - **Preferences/competence are altered:** Knowing a result may reduce decision-making competence (e.g., "decisional paralysis" from ambiguous risk data). The theorem assumes stable utilities, but existential distress changes utility functions.  
     - **Weight:** **High**. This invalidates the core claim that "worse only if you insist on looking."

  #### 2. **Ex Ante vs. Ex Post Harms**  
     - **Why it matters:** The theorem evaluates *expected* pre-test value. For individuals:  
       - A result with non-negative *expected* value (e.g., VUS) can cause *actual* net harm (e.g., £3k spent on unnecessary MRI scans due to anxiety).  
       - Genomic information is identity-constitutive: Unlike a photograph of an external scene, learning "you have 80% Alzheimer’s risk" alters self-conception irreversibly.  
     - **Weight:** **Critical**. The policy applies to realised individuals, not statistical agents.

  #### 3. **The "Fixed Scene" Fiction**  
     - **Why it fails:** The genomic "scene" is not fixed:  
       - A VUS is *not* a refinement but a *provisional label* in a dynamic knowledge system (e.g., BRCA1 variants reclassified over decades).  
       - Disclosing today's interpretation may embed obsolete risks in records, causing later iatrogenic harm (e.g., incorrect risk stratification).  
     - **Weight:** **High**. If the "scene" evolves, higher "resolution" today may *mislead* tomorrow.

  #### 4. **Single-Viewer Myth**  
     - **Why it breaks the argument:** Information in medical records has multiple actors:  
       - Insurers/employers may legally access data (e.g., US GINA loopholes, UK moratoriums with expiry dates).  
       - Relatives inherit implications (e.g., a child’s result revealing parental risk without consent).  
       - **Systemic harm:** Risk-pooling (e.g., insurance) relies on shared uncertainty. Individual disclosures can collapse pools, raising costs for all.  
     - **Weight:** **Highest**. This shifts "cannot harm recipient" to "can harm society," making paternalism a collective obligation.

  #### 5. **Cost Omission**  
     - **Theorem's blind spot:** It addresses *gross* value of information. Clinical costs include:  
       - **Direct:** Confirmatory testing, counselling (£150-£500/session).  
       - **Downstream:** Unnecessary screening (e.g., lifelong cardiac MRIs for a VUS).  
       - **Opportunity costs:** Clinic time diverted from actionable cases.  
     - **Weight:** **Moderate-High**. Net value may be negative for low-utility information.

  ---

  ### Case Application
  | **Proposal** | **Key Disanalogy** | **Default Flip?** | **Reason** |
  |--------------|---------------------|-------------------|------------|
  | **Reporting VUS to healthy adults** | "Squinting" fallacy + Evolving scene | **Yes** (Suppress by default) | VUS causes anxiety/costs without clinical utility; reclassification risk creates misinformation. Burden shifts to proving benefit. |
  | **Polygenic score (no intervention)** | Ex ante/ex post mismatch + Cost omission | **Yes** (Suppress by default) | No "task" exists (no prevention possible), so information has no decision-value. Psychological/financial harms likely dominate. |
  | **Child's late-onset untreatable finding (parents request all)** | Single-viewer myth + "Squinting" fallacy | **No** (Disclose by default) | But with caveats: Parents are proxy decision-makers, but child's future autonomy is violated. Requires counselling on implications for child’s "right not to know." |

  ---

  ### Better Metaphor & Panel Guidance
  **A Better Metaphor:** Genomic information is **radioactive material**.  
  - *Why it fits:* It has inherent value (medical/energy use) but:  
    - Requires containment (privacy/consent barriers).  
    - Has half-life decay (reclassification).  
    - Causes "radiation sickness" if mishandled (psychological/financial toxicity).  
    - Demands disposal protocols (e.g., expunging obsolete variants).  

  **If No Metaphor Fits:**  
  The panel should:  
  1. **Adopt a "Net Expected Benefit" framework** requiring:  
     - Quantified thresholds for actionability (e.g., >5% absolute risk reduction).  
     - Evidence that disclosure improves outcomes *beyond* alternatives (e.g., blinding).  
  2. **Implement partitioned consent:**  
     - Tiered options (e.g., "Only actionable findings," "Include VUS," "Include adult-onset pediatric conditions").  
  3. **Mandate dynamic reconsent:**  
     - Recontact for reclassified variants (costs permitting).  
  4. **Record siloing:**  
     - Segregate non-actionable data from clinical records to curb systemic harms.  

  **On Paternalism:** Withholding isn't paternalism if:  
  - The recipient can’t "unsee" information (violating autonomy later).  
  - Harms extend beyond the individual (societal costs).  
  The burden should fall on proving *net benefit* of disclosure, not suppression.  

  This shifts the debate from abstract information theory to concrete harm-benefit analysis—where it belongs in clinical ethics.
