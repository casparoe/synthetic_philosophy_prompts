answer: |-
  ### Independent Study Proposal: The Common Prior Assumption and the Fragility of Disagreement  

  #### **1. Overview**  
  This project investigates the *common prior assumption* (CPA) in Bayesian models of disagreement. The CPA—a cornerstone of rational choice theory—holds that rational agents with identical prior beliefs and common knowledge of their evidence cannot disagree. I argue that this result depends critically on an arbitrary choice of state space. Drawing on philosophy of language and formal epistemology, I propose to formalize the claim that CPA’s normative force dissolves if we allow state spaces to be "gerrymandered" to accommodate disagreements. To rescue substantive content, I introduce a *minimality constraint*: state spaces must only include distinctions agents can express in their own vocabulary. The project will assess whether CPA remains falsifiable under this restriction and disentangle its dual roles in blaming agents versus explaining disagreements.  

  #### **2. Background and Motivation**  
  In standard models (e.g., Harsanyi 1968), agents with a common prior cannot hold differing posterior beliefs under common knowledge of posteriors. This anchors normative arguments: if agents disagree, one must be irrational or misinformed. Yet this assumes a fixed state space. In practice, modelers *select* the state space—e.g., defining possible worlds relevant to inflation forecasts. My core suspicion is that **any finite disagreement pattern can be "explained away" by inflating the state space** (adding unimagined states, splitting existing ones, or assigning vanishing probabilities), thereby preserving CPA trivially. For instance:  
  - Two economists disagreeing about inflation could be modeled with a common prior if we add "hidden" states (e.g., undiscovered economic mechanisms) that resolve their disagreement ex post.  
  - This renders CPA empirically vacuous: it becomes a modeling convention, not a rationality constraint.  

  The philosophical worry is that CPA’s authority hinges on an unmotivated state-space ontology. If state spaces are tools of interpretation, not objective facts, CPA cannot adjudicate real disagreements.  

  #### **3. Core Questions**  
  I will rigorously explore CPA’s fragility under state-space manipulation, focusing on a minimality constraint:  
  > **Minimality**: The state space may only distinguish possibilities expressible in the agents’ *actual disagreement vocabulary* (e.g., "inflation > 5%" or "God exists").  

  **Key questions**:  
  1. **Falsifiability**: Under minimality, does CPA retain content? Specifically:  
     - Is CPA equivalent to "no agreeable bets" (Aumann 1976) or other operational tests?  
     - If minimality collapses CPA to triviality (e.g., it always holds), does CPA lose its normative bite?  
  2. **Ontological Disagreements**: Does CPA’s status change when agents dispute the *existence* of possibilities (e.g., theist vs. atheist) versus probabilities over shared possibilities? Minimality may force explicit representation of such disputes.  
  3. **Conceptual Dualism**: Is CPA conflating two roles?  
     - **Blaming agents**: Identifying irrationality.  
     - **Explaining disagreements**: Requiring a complete causal account.  
     Minimality may show these roles diverge: CPA could "explain" disagreements gerrymandered away while failing to assign blame.  

  #### **4. Research Plan**  
  **Objective**: Formalize state-space manipulation and test CPA’s robustness under minimality.  
  **Methods**:  
  - **Months 1–2**: **Literature review & formal foundations**.  
    - Survey interactive epistemology (Aumann, Geanakoplos) and philosophy of modeling (Cartwright, Sugden).  
    - Formalize the "inflation lemma": Given any disagreement, construct an expanded state space + common prior reproducing it. (I suspect this resembles existing results in unawareness literature; I will adapt them or prove a simplified version.)  
  - **Months 3–4**: **Minimality and its consequences**.  
    - Define "disagreement vocabulary" precisely (drawing on Lewisian semantics).  
    - Test CPA against no-bet conditions on minimal spaces (using Bayesian networks or game matrices).  
    - Analyze ontological disagreements: Can minimal spaces represent atheist/theist disputes without gerrymandering?  
  - **Months 5–6**: **Philosophical synthesis & paper drafting**.  
    - Evaluate CPA’s dual roles using minimality.  
    - Draft the final paper (~6000 words), arguing that CPA’s normative force relies on uncontested state spaces—a condition rarely met.  

  **Deliverables**: Bi-weekly progress reports; final paper.  

  #### **5. Philosophical Significance**  
  This project bridges technical economics and philosophy:  
  - **Rationality & Interpretation**: CPA’s fragility reveals how rationality debates depend on interpretive choices (state-space construction). This challenges Harsanyi’s view that priors are "pure logic."  
  - **Disagreement in Practice**: If minimal spaces invalidate CPA, philosophers must rethink how to normatively evaluate real-world disagreements (e.g., climate skepticism).  
  - **Modeling & Reality**: It probes whether formal models can objectively resolve disputes or merely reflect modelers’ conventions.  

  Without philosophy, this degenerates into abstract interactive epistemology. With it, we confront how rationality is mediated by language and ontology.  

  #### **6. Failure Conditions**  
  The project fails if:  
  1. **Inflation lemma is false/messy**: If no clean construction exists, the critique weakens. *Fallback*: Use approximate or asymptotic versions.  
  2. **Minimality changes nothing**: If no-bet conditions are *invariant* under state-space inflation, CPA remains robust. *Outcome*: A footnote on modeling conventions.  
  3. **Minimality is incoherent**: If "disagreement vocabulary" cannot be rigorously defined. *Fallback*: Restrict to cases with explicit propositional attitudes.  

  **Success looks like**: Showing that CPA, under minimality, either (a) loses its falsifiable content or (b) splits into distinct explanatory/blaming roles—undermining its use in normative arguments.  

  ---  
  **Supervisor Meeting Schedule**: Bi-weekly, starting Week 1, focusing on:  
  - Meeting 1–2: Scoping inflation lemma.  
  - Meeting 3–4: Defining minimality.  
  - Meeting 5–6: Testing no-bet conditions.  
  - Meeting 7–8: Draft critique.  

  I welcome feedback on sharpening the minimality constraint or prioritizing questions.
