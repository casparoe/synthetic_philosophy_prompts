  **CARÉNIUM SYSTEMS INC.**  
  **SUBSTRATE INTEGRITY DIVISION**  
  **FIELD SERVICE BULLETIN C-SID-0094**  
  *RE: SUBSTRATE DRIFT REPORTS & SYMBOL-LEVEL CAUSATION CLAIMS*  

  **1. PURPOSE**  
  This bulletin addresses operator inquiries regarding Substrate Drift (SD) incidents—specifically, observations of symm trajectory deviations allegedly correlated with symmball-level activity. All claims of "downward causation" (i.e., symmballs influencing symm dynamics) must be processed per Standard Causation Verification Protocol (SCVP-7). Compliance ensures warranty validity and avoids unsanctioned physics.  

  **2. BACKGROUND**  
  The Model C Careenium operates under rigorously validated substrate kinematics (Ref: *Substrate Dynamics Handbook*, §4.3). Symm interactions (attraction/repulsion governed by Maxwell-Careno equations) are causally closed. Symmball formations are emergent statistical patterns with no independent force ontology. SD incidents reported via Form 27-B ("Symbol-Level Anomaly Affidavit") undergo mandatory symm-level reconciliation.  

  **3. POLICY: NON-DUPLICATION CLAUSE (NDC)**  
  Per SCVP-7 §2(a):  
  > *"No symm event E may be attributed to multiple distinct sufficient causes. If a symmball description S is proposed as causal for E, but E is fully accounted for by symm microstate interactions {m1, m2...mn}, S is excluded from causation on grounds of causal overdetermination."*  

  Claims implying symmball efficacy violate NDC unless the claimant provides:  
  - A complete symm-level causal chain for E, *and*  
  - Proof that S does not supervene on {m1, m2...mn}.  
  *(Ref: Warranty Addendum 12.C, "Exclusion Principle Compliance")*  

  **4. PROCEDURE: FORM 27-B SUBMISSION**  
  Operators reporting SD must:  
  4.1. Specify symmball configuration S alleged to cause drift.  
  4.2. **In Section 3(a):** Identify *exactly which symm* (by grid coordinate & magnetic polarity) deviated from predicted trajectory.  
  **In Section 3(b):** Identify *exactly which other symm(s)* (coordinate/polarity) exerted force upon it per standard collision calculus.  
  *Example:* "Symm Γ-7ξ (N-pole) at t=3.42s was deflected 0.7µm NW due to impact from Symm Δ-9κ (S-pole)."  
  **Vague entries (e.g., "Symmball 'I' wanted to move left") void the claim.**  

  **5. THE IDENTITY RIDER (IR)**  
  If claimant asserts S *is identical to* some symm microstate configuration M:  
  5.1. M must be fully specified (all symm positions/polarities at t-δt).  
  5.2. Causation is then attributed to M, not S. Symmball-level descriptors are redundant.  
  5.3. IR claims are logged in the Substrate Event Ledger under M, not S.  
  *(Note: Supervenience does not imply identity. IR approval rate: 0.003%)*  

  **6. LEDGER RECLASSIFICATION**  
  All SD incidents are resolved via:  
  - **Microstate Reconciliation:** Drift is reclassified as symm collision outcomes computable from prior states.  
  - **Sensor Calibration Error:** Unexplained deviations are assigned to tray vibration or wall-field hysteresis.  
  **No claim attributing force to symmballs has been paid in Model C history.**  

  **7. WORKED EXAMPLE: DENIED CLAIM**  
  **Operator Submission (Form 27-B):**  
  > *"Symmball 'RUN' formed at left wall (t=12.8s). Walls became 'soft' per external input. 'RUN' symmball exerted collective leftward force on Symm Ξ-4θ (S-pole), causing drift toward exit corridor."*  

  **Substrate Division Ruling:**  
  - **§3(a) Failure:** Operator did not specify which symm impacted Ξ-4θ.  
  - **§3(b) Reconciliation:** Logs show Ξ-4θ was struck by Symm Ψ-11λ (N-pole) at t=12.801s (force vector: 0.8µN @ 215°). Wall compliance altered Ψ-11λ’s rebound angle.  
  - **NDC Violation:** Attributing force to "RUN" duplicates Ψ-11λ’s verified impulse.  
  - **Ledger Entry:** Reclassified as "Microcollision Ψ-11λ → Ξ-4θ (Code M87.4), Wall Compliance Factor ΔW=0.2."  
  **Status: DENIED (Insufficient micro-causal specification).**  

  **CONCLUSION**  
  Substrate drift is fully resolvable within symm-level physics. Symmball correlations reflect pattern recognition, not novel causation. Operators observing persistent SD should:  
  - Recalibrate tray resonance dampers (Ref: *Maintenance Manual*, §11.6).  
  - Verify no unlicensed firmware is simulating "symbolic agency."  
  Submit future Form 27-Bs with strict adherence to §3(a)–(b). The ledger remains balanced.  

  *— End Bulletin —*  

  ---

  **NOTES ON CHOICES (178 words)**  
  Hofstadter’s core setup (symms, symmballs, tunable walls) is preserved. Your additions—Form 27-B, NDC, Identity Rider, Ledger—provide the bureaucratic machinery enforcing reductionism. The "who shoves" question hinges on Sperry’s contention that emergent patterns gain "downward causal potency." This bulletin satirizes the view that *only* the substrate shoves, by literalizing Kim’s exclusion argument: symmballs are denied causal status unless reducible to token-identical microstates (which voids their autonomy). The manufacturer’s scrupulous correctness mirrors reductionism’s strength—microphysics *is* complete—while the queasiness arises from dismissing pattern-level descriptions as epiphenomenal bookkeeping. Your memory aligns with Hofstadter: Sperry’s phrase frames the essay, and the tension arises when symmballs seem to exploit wall changes for "goal-directed" movement. The bulletin’s denied claim exemplifies Hofstadter’s fear: the "I" symmball’s apparent agency is disassembled into approved micro-events, leaving no room for top-down influence.  

  **IS IT FAIR? (126 words)**  
  The strongest reply from the satirized reductionist position: *The ledger’s perfection proves the point.* If every drift *can* be reclassified without residue into micro-collisions or calibration error, then positing additional symmball causation is unscientific. The manufacturer isn’t evading Hofstadter’s question; it’s demonstrating that the careenium’s physics *already* contains the full causal story. Symmball correlations are real but descriptive, not force-exerting. The joke survives because it concedes this while highlighting the *procedural* absurdity: demanding operators describe emergent phenomena solely in micro-vocabulary is like requiring a description of "running" in terms of muscle fibers while denying legs move people. The humor lies in the system’s airtight, self-justifying bureaucracy—precisely the reductionist’s "success."
