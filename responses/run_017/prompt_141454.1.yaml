prompt: |-
  I'm retired now — forty-odd years in experimental geophysics, mostly seismic inversion, which is a fancy way of saying I spent my career deciding what was down there from wiggles I could actually record. That habit is probably why I keep getting stuck on the same point in the philosophy reading group I've joined at the university. There's a retired astronomer there, Frank, who calls himself a relationist about spacetime, and I've been putting cases to him over coffee for a few months and I honestly can't tell what rule he's running. His verdicts so far:

  - Two ships drifting past each other in otherwise empty space, each saying the other is the one moving: no fact of the matter.
  - The whole material universe shifted three metres east, or started up three minutes later, with every internal relation unchanged (that's Leibniz's move, I think): no difference, same world, no fact about where or when it is absolutely.
  - The hole-argument pair — two models of a collapsing star that agree everywhere outside some empty region and inside it differ only by a smooth relabelling of which point is which: no difference, there's nothing to decide about which point is which.
  - The doubling story (Poincaré's, I believe) — an infinite, spatially flat universe where overnight everything, rulers included, doubles in size: no difference. He did mutter that he wasn't sure whether it matters that the universe was infinite in that one, and he never did get back to me about the compact version.
  - Newton's bucket with the rest of the universe deleted: there is a fact of the matter about whether the water is spinning, the surface goes concave and that's the end of it, no other matter required. He's definately not a Machian about rotation.
  - Whether there are galaxies out past our particle horizon: yes, there's a fact, we just can't get at it.

  That last one is what makes me suspicious that no-possible-observation-could-tell-the-difference isn't really his test, whatever he says it is.

  The case I want to put to him next: a universe with no matter in it at all, ever. A vacuum solution, but not a flat one — there is a pulse of gravitational radiation crossing it, with nothing needed to source it, since the vacuum equations permit waves on their own. Compare it with a universe that is the same in every respect except perfectly flat and empty. Is there a fact of the matter about whether the pulse is there, or are these the same possibility described two ways? And if he says there is a fact that there is a pulse somewhere, would he also say there is a fact about where it is — because given what he said about the hole case I'd have thought that was a seperate question.

  So: what will Frank say, what rule does he seem to be running, and what other rules fit those six verdicts just as well? Which of those rules come apart on this case, what does each of them predict, and which one is really his, with your reason for preferring it? Then tell me the case to put to him after that to settle it. My candidates are the compact version of the doubling one he ducked; the same question in a universe with twice as much matter in it, all of it forever beyond everybody's horizon; and a single point particle accelerating alone in an empty universe rather than a whole planet. Pick one, or tell me something better.

  For what it's worth, my own instinct is that if nothing, anywhere, ever, could even in principle register the difference, then it isn't a physical difference, and I'd like to know whether that instinct survives the rest of what he's already committed to.

  Give me your bottom line in the first sentence, then the reasoning. No preamble, and please don't restate the question back at me.
reasoning: |-
  Alright, let me try to figure out Frank's position based on his responses. He's a relationist, so he probably doesn't believe in absolute space or time. But his answers seem inconsistent at first glance. 

  First, the two ships: no fact about who's moving. That's standard relationism—motion is relative. Then Leibniz's shift: no difference, which again is relationist, denying absolute position. The hole argument: same thing, points aren't real without matter. Doubling universe: no difference, so scale isn't absolute. 

  But then Newton's bucket without the universe: he says there is a fact about rotation. That's odd because relationists usually follow Mach and say rotation is relative to the fixed stars. But Frank isn't Machian here. Then, galaxies beyond the horizon: he says yes, there's a fact, even if we can't observe them. That's puzzling because if he's relationist, unobservable things shouldn't matter.

  Now the gravitational wave case. If there's no matter, just a vacuum with a wave, compared to flat space. Would Frank say there's a difference? Since there's no matter to measure the wave, a strict relationist might say no difference. But his bucket answer suggests he accepts intrinsic structure. Maybe spacetime has its own properties? 

  Looking at his other answers, he accepts facts beyond observation in the horizon case. So perhaps he's a sophisticated relationist who allows spacetime to have relational structures even without matter. The wave might count as such a structure. So he might say there is a fact about the wave existing, but not about where it is, since points aren't real without matter (from the hole argument).

  Then, the compact doubling case: if the universe is finite and doubles in size, would he say it's the same? If he says no, then scale is absolute for him. But in the infinite case, he was unsure. Maybe he needs relational structures to define scale. 

  The twice-as-matter-beyond-horizon case: if he says there's a fact, then he's committed to unobservable entities, which fits his galaxies answer. The accelerating particle alone: if acceleration is absolute like the bucket, he might say there's a fact. 

  To distinguish, the compact doubling test is good. If he says doubling makes no difference, he's consistent with Poincaré. If he says it does, then scale is absolute for him. That would clarify his stance.
answer: |-
  Frank will say there is a fact of the matter about the gravitational wave pulse but no fact about its absolute location. His underlying rule is that physical facts require intrinsic measurable structure, but spacetime points lack identity without matter or fields to individuate them.  

  **Analysis of Frank's Rule:** His verdicts reveal a consistent pattern:  
  1. **Relationalism for kinematics:** No absolute motion (ships), position (Leibniz shift), or spacetime point identity (hole argument). Differences undetectable by relations between material objects are unreal.  
  2. **Substantivalism for dynamics:** Absolute facts arise when dynamical structure exists, even without observable matter. Rotation (bucket) and unobservable galaxies are factual due to intrinsic curvature/strain; the wave pulse similarly embodies non-flat curvature.  
  3. **Operationalism with limits:** Unobservable entities (galaxies beyond the horizon) are factual if embedded in a causal structure. The wave’s energy density and causal propagation make it physically distinct from flat spacetime, even without detectors.  

  **Alternative Rules and Divergence on the Pulse Case:**  
  - **Strict Machian relationism** (no structure without matter): Predicts *no difference* for the pulse (contradicting Frank’s bucket/galaxies verdicts).  
  - **Radical empiricism** (no fact without possible observation): Predicts *no difference* for the pulse (contradicting galaxies verdict).  
  - **Spacetime substantivalism** (points exist independently): Predicts facts about the pulse *and* its location (contradicting hole argument verdict).  
  Only Frank’s hybrid rule—**dynamical structures (e.g., curvature) are real, but spacetime points are not—fits all six verdicts and predicts: pulse exists factually (due to curvature), but location does not (no matter to anchor points).  

  **Settling Test Case:** Use the **compact doubling universe** (finite, curved space). If Frank says doubling changes nothing, he extends scale-relationalism consistently. If he says it *does* change (e.g., curvature alters light paths), he implicitly requires absolute scale, contradicting his Poincaré verdict. This isolates whether his dynamism/relationism split depends on infinity.  

  **Bottom Line:** Your instinct survives if "register" includes *structural* differences (e.g., curvature), not just material observations—Frank’s position validates this.  

  **Reasoning:**  
  - **Pulse Case Resolution:** The gravitational wave universe has measurable curvature invariants (e.g., Riemann tensor), while flat spacetime has none. Frank’s bucket/galaxies verdicts show he accepts such intrinsic structure as factual. However, relabelling spacetime points (as in the hole argument) remains unphysical, so location lacks absolute meaning.  
  - **Why Compact Doubling Test?**  
    - If the universe is finite (e.g., a 3-sphere), doubling size alters curvature invariants (e.g., Ricci scalar changes). If Frank denies a difference, he prioritizes relationalism over dynamical structure, weakening his bucket/pulse stance.  
    - If he affirms a difference, he affirms absolute scale, contradicting his infinite-doubling skepticism and Leibniz-shift verdict.  
    - Alternatives rejected:  
      - *Twice-as-matter beyond horizon*: He’d likely affirm a fact (per galaxies), but doesn’t stress-test scale/relationism.  
      - *Single accelerating particle*: He’d likely affirm rotation-like facts (per bucket), but doesn’t probe relationalism vs. dynamism.  
  - **Your Instinct:** "No possible registration" fails Frank if "registration" excludes spacetime structure. But if structural differences (e.g., curvature) are "registered" inherently (e.g., via geodesic deviation), your instinct aligns with his hybrid view. The pulse *can* be "registered" by its geometric effects, even sans matter.
