prompt: |-
  I retired four years ago from a lab job — thirty-odd years calibrating satellite radiometers, which mostly means I have strong feelings about whether a number means what it says — and since then I've been going to a philosophy reading group and, less voluntarily, sitting on the committee at our regional hospital that signs off on the predictive models the clinical departments want to buy. I've now said yes and no to enough of these that I think I have views, but I cant tell you what the views are. Most of what I've read on this subject is slogans, so please don't give me a tour of the literature; give me a rule, say where it bites, and say which of my answers it can't rescue.

  The verdicts, as best I can reconstruct them.

  1. A deterioration model last year. Two groups, and the bad outcome genuinely happens more often in one of them — 40% versus 15%. The vendor's score was honest in both groups: a 0.3 meant 30% for everybody, which I checked myself on a holdout sample, and I liked that a lot. But at the alert threshold the model missed 20% of the true deteriorations in the high-rate group and 45% in the other. I said no. Missing sick people at twice the rate in one group is the thing I can't sign off on.

  2. This spring the same vendor came back with the miss rates and false-alarm rates equalized across the two groups; they got there partly by using a different cut for each group, 0.45 for one and 0.30 for the other. I said no to that too. Now the flag goes with something like a 70% risk in one group and a 40% risk in the other, and a number in the middle of the range doesn't mean the same thing depending on who it's attached to. Separately, the business of two different cut-offs for two kinds of patient struck me as a *different* kind of wrong from the numbers complaint, but I can't say what the difference is and I'm not sure I trust the feeling. I'd like to know whether that's really one objection or two.

  3. A post-operative complication model where the "group" was age. It flags far more seventy-year-olds than forty-year-olds, and seventy-year-olds really do have more complications. I said: that isn't a fairness problem, it's a prediction, go ahead.

  4. A model for who gets assigned a care manager, trained on past cost and past utilization. It never saw the group variable, and it was well calibrated by every test I could think of. But one group has had worse access to primary care for decades, so at the same level of need they run up less utilization, so they get flagged less. I said no — the instrument is measuring access and calling it illness. I spent my career throwing out instruments that did that.

  5. One where the errors were worse in one group for the boring reason that their records are thinner — fewer prior labs per patient, so the model is less certain about everybody. That one I wanted to call a data-quality failure rather than an unfairness, and I approved it with conditions. I'm not sure the distinction survives contact with the people it happens to, but I do think it's a distinction, and I want a rule that has room for it.

  6. And one constraint that isn't a verdict on a case: I don't trust any fix that's been tuned to make the numbers come out right for the two groups we happened to print on the form. I've watched too many people massage an analysis until a comparison looked clean. So whatever rule we land on, I want it to keep behaving when somebody slices the population along a line nobody listed — patients whose first language isn't English, people who live alone, whatever it turns out to be. A rule that only works for the groups we named is curve-fitting, as far as I'm concerned.

  So: is there one principle that gets all six, or nearly all of them? State it precisely enough that I could go check it, and tell me which case is doing the work for each clause. Then tell me which verdict has to go, and which one you'd overturn if it were up to you — I'd rather be told I'm wrong about one thing than be handed a rule with six exceptions bolted onto it.

  And the case I have no verdict on, which is next month's: a tool that doesn't produce a probability or a score at all, only a ranking of patients for a scarce resource with a fixed number of slots. The group difference will show up as who lands in the top of the list — say the low-rate group is about a third of the patients and about a fifth of the top fifty names. Nothing in my calibration instinct seems to apply to a bare ranking, and yet I expect to have an opinion when I see it. What does your rule say there, and does it matter that slots are all-or-nothing in a way that a score isn't?

  Finally: does my constraint 6 actually favor one candidate rule over the others, or does it cut against all of them equally? And what does the rule you like predict for some case I haven't listed — pick one yourself, and tell me which further case would best separate your rule from whatever came second.
reasoning: |-
  Hmm, the user presents a complex ethical and technical challenge about fairness in predictive models used in healthcare. They've shared six real-world cases where they made decisions about model approvals, along with an upcoming case involving patient rankings. Their background in satellite radiometer calibration gives them a strong sensitivity to numerical integrity. 

  The core tension here seems to be between three values: calibration accuracy (numbers meaning what they say), error rate parity (similar performance across groups), and avoiding disparate impact (even when technically "fair"). Their constraint #6 about avoiding group-specific tuning is particularly insightful - it shows they understand the difference between solving symptoms versus root causes.

  For case 1: The rejection makes sense - equal calibration but unequal miss rates creates a clinically dangerous disparity. Case 2's rejection is also justified; different thresholds make the score lose meaning. Case 3 approval seems correct - age is a legitimate risk factor. Case 4 rejection is smart - they spotted the access bias masquerading as risk. Case 5 shows nuance - distinguishing data limitations from unfairness. 

  The proposed "meaningful score parity" principle handles these well: 
  - Cases 1/2 violate the score meaning requirement
  - Case 3/5 satisfy the core principle
  - Case 4 violates by measuring access not illness

  For the ranking case: The rule suggests evaluating whether the ranking accurately reflects clinical priority across groups. If the low-risk group is underrepresented in top slots despite having equally urgent needs, that would fail. The all-or-nothing nature makes group disparities more impactful - 1% difference in ranking could mean life-or-death exclusion.

  Constraint #6 actually strengthens this approach - by focusing on what the instrument fundamentally measures rather than group outcomes, we avoid overfitting to known groups. The hardest case might be when legitimate clinical factors correlate with protected attributes - but the principle would require demonstrating those factors are causally related to the outcome.

  A good test case: A model predicting diabetic complications where diet is a strong predictor, but diet data comes from unreliable self-reporting that varies by cultural group. This would violate the principle because the instrument measures reporting behavior more than actual risk.
answer: |-
  Based on your cases and constraints, here’s a unified principle that captures your verdicts (and why), which cases it overturns, and how it handles the ranking scenario. I’ll state it formally, then unpack it:

  **The Principle of Instrumental Fidelity**  
  *A predictive model is acceptable only if:  
  (1) Its output is a *meaningful measure of the target construct* across all relevant subpopulations;  
  (2) Its *errors are causally justified* by legitimate factors intrinsic to the prediction task;  
  (3) It *does not encode or amplify historical inequities* in its operationalization of the construct.*

  ### How It Explains Your Verdicts:
  1. **Deterioration Model (Rejected):**  
     - **Violates (1) & (2):** The score is calibrated (meaningful) but errors are *disproportionate* without causal justification (e.g., no evidence the high-rate group is inherently harder to predict). Equal calibration ≠ meaningfulness when error rates differ arbitrarily.  
     - *Your objection:* Miss rates differ 2:1 without reason → violates (2).

  2. **Revisited Model (Rejected):**  
     - **Violates (1):** The score loses meaning (0.3 means 30% risk in Group A but 40% in Group B after thresholding). Also violates (3) by baking group identity into thresholds without addressing *why* risk differs.  
     - *Your "different kind of wrong":* (1) is the numerical complaint; (3) is the ethical complaint about institutionalizing group-based differences.

  3. **Age-Based Complication Model (Approved):**  
     - **Satisfies (1),(2),(3):** Age is causally linked to complications (2); the score meaningfully reflects risk (1); it doesn’t amplify inequity—it reflects biology (3).

  4. **Care Manager Assignment (Rejected):**  
     - **Violates (1) & (3):** Measures "utilization due to access barriers," not "need" (1). Encodes historical inequity (poor access) as "low need" (3).  
     - *Your calibration instinct:* The instrument measures the wrong thing—like a radiometer mistaking humidity for temperature.

  5. **Thin Records Model (Approved with Conditions):**  
     - **Satisfies (2):** Errors are causally justified by data quality (intrinsic to prediction). Not an unfairness issue—it’s a technical limitation affecting all patients with sparse data.  
     - *Your distinction:* "Data-quality failure ≠ unfairness" is preserved by (2).

  6. **Constraint (No Group-Specific Tuning):**  
     - **Favors this rule:** Instrumental Fidelity tests universal properties (what the model *is*), not group outcomes. If the model measures the construct faithfully (1) and errors are justified (2), it will generalize to unseen groups. Tuning for parity often violates (1) or masks (3).

  ---

  ### The Verdict You Should Overturn: None  
  All your decisions align with the principle. If forced, **Case 5** is the weakest: Conditional approval assumes data quality *can* be improved neutrally. But if sparse records correlate with systemic neglect (e.g., underfunded clinics in poor areas), it might violate (3). You implicitly required fixing the root cause—which the principle supports.

  ---

  ### The Ranking Scenario (Next Month’s Case)  
  **The Rule’s Prediction:**  
  - **Test (1):** Does the ranking *meaningfully reflect priority* for the scarce resource? If the ranking is based on a proxy (e.g., "predicted survival gain"), it must accurately represent that construct *across groups*.  
  - **Test (3):** Does it amplify inequities? (e.g., if "survival gain" ignores comorbidities more common in marginalized groups).  
  - **All-or-Nothing Impact:** This *magnifies* harm if the ranking is flawed. A 5% underrepresentation in top slots may deny care to critically ill patients.  

  **Your Expected Objection:**  
  If Group A is 33% of patients but only 20% of the top 50, ask: *Is this because they have lower medical urgency, or because the model mismeasures urgency?*  
  - **If justified (e.g., Group A has objectively lower complication rates):** Approve (Case 3 logic).  
  - **If unjustified (e.g., ranking uses unreliable proxies like "prior engagement with care"):** Reject (Case 4 logic).  

  Calibration isn’t needed, but **construct validity** (1) is critical. A ranking must reflect *true priority*, not bias.

  ---

  ### Testing the Principle: A New Case  
  **Scenario:** A sepsis prediction model uses real-time vitals. It’s equally calibrated and has equal FNR/FPR across races, but:  
  - **Cause:** It uses skin pallor detection (via camera), which works poorly on darker skin.  
  - **Outcome:** For patients with dark skin, it relies more on lab data—which delays prediction by 2 hours.  

  **Principle’s Verdict:**  
  - **Violates (1) & (3):** "Pallor" doesn’t meaningfully measure sepsis risk for dark-skinned patients (1). Amplifies historical inequity (pulse oximetry bias redux) (3).  
  - **Reject**, despite equal group metrics.  

  **Why This Tests the Rule:**  
  - A "fairness metric" approach might approve it (equal performance).  
  - Instrumental Fidelity rejects it because the *instrument* is flawed—exposing how superficial parity can hide harm.  

  ---

  ### Summary  
  - **Your core insight:** Fairness isn’t about metrics—it’s about whether the tool *truthfully measures what it claims to measure* for every patient.  
  - **Strength of Instrumental Fidelity:** It avoids "fairness theater" by focusing on causal integrity and construct validity. Your constraint #6 is *built-in*—no need to tune for groups if the instrument is faithful.  
  - **One Limitation:** It requires identifying "legitimate causal factors" (e.g., age in Case 3). But as a calibration expert, you’re equipped to scrutinize those claims.  

  When you see next month’s ranking tool, ask: *"Does this list order patients by *actual need*, or is it a biased proxy?"* That’s Instrumental Fidelity in action.
