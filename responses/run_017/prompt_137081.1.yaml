  - State precisely which feature of the payoff structure makes (B) and (C) come apart and bracket (A), and give the general reason why an interior ex-ante optimum forces (A)'s indifference — so that in your case the tension is generated by the self-locating belief rule, not by the optimal plan failing to be self-enforcing.
