  The three candidate self-locating beliefs, evaluated while he is following the plan p and considering a one-shot deviation (he reverts to p at any later intersection):

  (A) Visit-frequency rule: the probability that this is the k-th exit equals the expected number of visits to that exit divided by the total expected number of visits, both computed under the plan p he is in fact following.
  (B) Uniform-indifference rule: probability 1/3 on each of the three exits, since they are subjectively identical to him.
  (C) Halfer rule: probability 1/2 that this is his first visit, the remaining 1/2 divided equally between the two later exits.

  Required verdicts, at the planning-stage optimal plan p*:

  1. p* is strictly interior, 0 < p* < 1, and is the global maximum of expected payoff over [0, 1]: strictly better than always exiting and strictly better than never exiting.
