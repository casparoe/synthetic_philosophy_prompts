   We let:
     a = P(Red & Second)
     b = P(Red & Headquarters)
     c = P(Blue & Second)
     d = P(Blue & Headquarters)

   Constraints:
     a + b = 3/4   (Red)
     c + d = 1/4   (Blue)
     a + c = 3/4   (Second)
