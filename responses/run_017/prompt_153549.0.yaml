     (-b)^2 = b^2.

     So f(b) = [1/4 - b + b^2] + 2*[b^2 - (1/2)b + 1/16] + b^2
              = 1/4 - b + b^2 + 2b^2 - b + 1/8 + b^2   [Note: 2*(1/16)=1/8]
              = (b^2 + 2b^2 + b^2) + (-b - b) + (1/4 + 1/8)
              = 4b^2 - 2b + (3/8)

