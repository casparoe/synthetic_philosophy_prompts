          a+c = 3/4   (2)
          b+d = 1/4   (3)
          c+d = 1/4   (4)

   But note: from (1) and (2), we get b=c. From (3) and (4) we get the same. So we can set c=b and d=1/4-b, and a=3/4-b.

   Then we have to minimize:
     f(b) = (3/4-b) * log(4*(3/4-b)) + b * log(4b) + b * log(4b) + (1/4-b) * log(4*(1/4-b))

          = (3/4-b) * log(3-4b) + 2b * log(4b) + (1/4-b) * log(1-4b)   [ignoring the constant log(4) terms? Actually, note: log(4*(3/4-b)) = log(4) + log(3/4-b) and similarly for others. But the log(4) terms add up to: 
