   This is the Bayesian posterior we got.

   Alternatively, we know that when the constraints are on the marginals of independent events (in the sense of being product constraints), the maximum entropy distribution is the product distribution.

   So the minimum-relative-information rule picks a=9/16.

   Step 4: Euclidean-distance-minimizing rule.

   We minimize the sum of squared differences from the old uniform distribution (1/4,1/4,1/4,1/4).

   The Euclidean distance squared is:
     (a-1/4)^2 + (b-1/4)^2 + (c-1/4)^2 + (d-1/4)^2

   But we have the constraints and we have expressed in terms of b:
     a = 3/4 - b
     c = b
     d = 1/4 - b

   So we minimize:
     f(b) = ( (3/4 - b) - 1/4 )^2 + (b - 1/4)^2 + (b - 1/4)^2 + ( (1/4 - b) - 1/4 )^2
          = ( (1/2 - b) )^2 + (b - 1/4)^2 + (b - 1/4)^2 + (-b)^2
          = (1/2 - b)^2 + 2*(b-1/4)^2 + b^2

   Let's compute:

     (1/2 - b)^2 = 1/4 - b + b^2   [Actually: (1/2 - b)^2 = (1/4) - 2*(1/2)*b + b^2 = 1/4 - b + b^2? 
          Correction: (x-y)^2 = x^2 - 2xy + y^2 -> (1/2)^2 - 2*(1/2)*b + b^2 = 1/4 - b + b^2? But wait, 2*(1/2)=1 so yes.

