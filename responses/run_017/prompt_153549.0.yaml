          P(Red & Second) = P(Red) * P(Second) = (3/4)*(3/4) = 9/16.

   Let's check if b=1/4 - d, and with a=3/4-b, and if we set a=9/16, then:
          9/16 = 3/4 - b  => b = 3/4 - 9/16 = 12/16 - 9/16 = 3/16.

