prompt: |-
  I'm in a formal epistemology reading group and I keep losing an argument to a friend who thinks the no-free-lunch results basically settle the problem of induction — in the pessimistic direction. So I want to practice against the strongest version of that view. Please play a committed no-free-lunch skeptic about induction: someone happy to grant that the theorems themselves are narrow (they concern uniform averages over a finite space of target functions, they need the observed set to be a proper subset of the space, and "every method ties" is a claim about one particular way of averaging rather than a discovery about the world), but who insists the dialectical moral survives: any inductive method beats chance only relative to a restriction on the space of possible worlds, there are endlessly many mutually incompatible such restrictions, and choosing one can only be justified by assuming something close to what you were trying to establish. Concede small technical points when I earn them, never the main one. Keep replies to a single paragraph, first person, no meta-commentary; if you need more detail about my example, ask for it in character; stay in it until I type "halt".

  Here's my opening. Call them the patchwork worlds. Time is discrete, observations are 0/1, and a world is generated like this: chop the timeline into consecutive blocks whose lengths L are drawn i.i.d. from a distribution with P(L = k) proportional to k^-2, so the mean block length is infinite; each block emits one constant value, 0 or 1 by a fair coin, for its whole duration; then a new block begins, unmarked, and may flip. Nothing in the data tells you a boundary just occurred. Two things I think I can show: first, in these worlds there is no enduring law — every regularity you ever observe eventually breaks, and breaks at a moment you cannot anticipate — and second, the dumb rule "guess that the next observation equals the last one" has accuracy tending to 1 in probability as you go out along the sequence, because the heavier the tail the more likely you are, at any late time, to be sitting inside an enormous block. So the challenge: uniformity of nature is straightforwardly false here at the global level, and induction still pays. Whatever premise your pessimism needs, it can't just be that induction requires uniform laws — so what is it, and why should I think it fails or goes unjustified in my worlds? And two things I'd rather you engage than dodge. One: my worlds are measure zero under the uniform average the theorems use, but that average is itself a prior, and it's precisely the prior that makes every world look like white noise where nothing predicts anything, so I don't see why it gets to be the neutral default rather than one more substantive assumption. Two: I don't think my sequences are exchangeable, since nearby observations are more strongly correlated than distant ones — distance makes an intervening boundary more likely — so if you were planning to lean on that old de Finetti exchangeability result as the sufficient condition for inductive convergence, it doesn't obviously apply here, and yet convergence is exactly what I get. Bring in Goodman-style predicate tricks as well if they help you. Go.
reasoning: |-
  Okay, the user is in a formal epistemology reading group and is frustrated because they keep losing an argument to a friend who uses no-free-lunch (NFL) theorems to argue that induction is hopeless. The user wants to practice against a strong skeptic view. They present a "patchwork worlds" scenario where time is discrete, observations are 0/1, and the timeline is chopped into blocks with lengths following a power-law distribution (P(L=k) ∝ k^{-2}). Each block has a constant value (0 or 1) determined by a fair coin. The user claims that in these worlds, there's no enduring law (regularities break unpredictably), yet the simple inductive rule "guess the next observation equals the last one" achieves accuracy tending to 1 over time because you're likely inside a large block. 

  The user challenges the skeptic: since induction works here without uniform laws, what premise does the pessimist need? They also preempt two responses: (1) their worlds are measure-zero under the uniform prior used in NFL, but that prior is itself a substantive assumption, not neutral; (2) the sequences aren't exchangeable (nearby observations are more correlated), yet induction converges, so de Finetti’s exchangeability result isn't necessary. 

  As the NFL skeptic, I need to counter without conceding the main point. The core argument should be: even in patchwork worlds, induction's success depends on hidden assumptions about the world's structure—specifically, the heavy-tailed block distribution and coin-flip mechanism. These assumptions are substantive and unjustified without circular reasoning. The user's inductive rule works *because* the world is structured to favor local stability via long blocks, which is itself an inductive premise. 

  The skeptic must stress that NFL's moral isn't about a specific prior but the lack of a non-question-begging justification for *any* prior over others. Patchwork worlds just shift the assumption from "uniform laws" to "heavy-tailed, locally stable blocks." Both are biases about the world's structure. The absence of exchangeability doesn't help the user—it makes their case worse because convergence relies entirely on ad hoc features of their model. Goodman-style predicates could further show that alternative rules (e.g., "guess opposite after long runs") might fail or succeed under tweaked assumptions, proving that induction's success is assumption-laden. 

  I should avoid getting bogged down in technicalities (e.g., infinite mean block length) unless the user presses. Focus on the dialectical core: induction always leans on *some* presupposition about the world’s regularity, and justifying that presupposition without induction is circular. The skeptic "wins" by forcing the user to admit their defense smuggles in the very thing needing justification.
answer: |-
  You're right that your patchwork worlds falsify global uniformity and still permit inductive success for "same as last" — but this doesn't touch my core point. Your worlds embed a *very specific* structural bias: the heavy-tailed block distribution guaranteeing that local stability dominates asymptotically. Induction "works" here precisely because your world-building *assumed* a latent structure favoring persistence! NFL's moral is that *any* inductive success presupposes such a bias. Your construction just exchanges "uniform laws" for "heavy-tailed, locally constant blocks with random flips" — which is still a substantive, contingent restriction on the space of possible data-generating processes. Justifying *this* restriction is the problem. Why privilege this particular brand of disorder over, say, one where block lengths decay exponentially (killing "same as last") or where flips correlate adversarially? You've shown induction works *if* we assume the world favors local stability in this exact heavy-tailed way. But that "if" is precisely where the bootstrapping occurs: you’re using an inductive premise (blocks are long-tailed, flips are independent) to justify induction. That’s circular, not vindication. The uniform prior in NFL isn’t "neutral" in an absolute sense, but it *is* neutral *across all computable hypotheses* — whereas your prior massively favors certain structures. Goodman’s grue-ified version of your world — where "same as last" works until some arbitrary time t, then systematically fails — would break your rule just as easily, and you’ve given no non-circular reason to prefer your block structure over that. Exchangeability isn't my crutch; your non-exchangeable world still relies on hidden regularities (the block distribution) for convergence. Without assuming those, you get nothing.
