prompt: |-
  say i want a theory of shared intention i can actually *use* — not one that just sounds plausible in a seminar room. the use i have in mind: working out who is on the hook (blame, owed apologies, debts of aid and of consultation) when a group project goes sideways, in settings that are heirarchical, partly automated, and where people drift in and out mid-project. so write me the desiderata. what does an account of what it is for some people to share an intention and act together have to deliver, with the case behind each requirement, and for each one say whether you think it is genuinely non-negotiable or just a prejudice of one camp.

  the cases i keep tripping over and want handled:

  - the relay crew: five people on rotating shifts who are never all awake at the same time, each knowing only her own leg and that somebody came before and somebody comes after. is this one joint action or five? when does it start, who is in it, and what does 'in it' even mean for someone asleep in another timezone?
  - the infiltrator: someone who slots into a crew's plan perfectly, meshes subplans, is fully counted on by the others, but is secretly planning to blow the whistle and hopes the thing fails. does she share the intention that we J? I don't want the answer to just be 'no, because her end is different' — tell me what has to be true for that answer to fall out.
  - the checked-out member: someone who agreed to the plan, then quietly stopped caring, but kept showing up and doing his bit anyway. when does he stop being a member? can he exit alone, or does quitting need uptake from the others?
  - the stand-in: a piece of software, or a trained animal, that reliably fills a role in the plan because of how it was built or trained, with nothing intentional going on inside it. is it a member of the joint action? if your theory says 'obviously not, it has no intentions,' is that a real requirement or just the intentionalist camp's preference — and what does it cost you when a human's entire contribution was delegating her role to it?
  - nested crews: a team that is itself one participant inside a larger operation, where the team has nothing it intends over and above what its members intend. can a group be a member of a joint action without having a shared intention of its own?

  sort these into real requirements vs negotiable preferences: whether the theory has to work for agents who can't communicate and know almost nothing about each other's plans (so no full common knowledge); whether it has to be built out of individual intentions only or is allowed an irreducibly collective state; whether membership has to be all-or-nothing or can come in degrees; whether it owes a verdict in coerced cases — the junior person who 'intends that we J' only because refusing costs her her job; and whether it has to explain why shared intention carries that distinctive you-owe-me-a-say-before-you-change-course normativity instead of just being more individual intentions with more content.

  then tell me which single requirement knocks out the most otherwise decent theories, and flag any pair of desiderata you suspect can't be jointly satisfied. I'd rather have the list turn out to be jointly unsatisfiable than have you quietly drop one of my cases to make it come out clean.

  last thing, one short paragraph each on three candidate shapes — describe them rather than name them if you like: (a) shared intention as interlocking individual plans plus mutual responsiveness plus common knowledge, (b) shared intention as an irreducibly collective we-intend that isn't assembled out of I-intentions, (c) shared intention as a joint commitment that neither party can rescind unilaterally. just enough to see where each breaks. the list is the part i care about.
reasoning: |-
  Hmm, the user wants a practical theory of shared intention that can handle real-world complexities like hierarchical structures, automation, and fluid membership. They've provided several challenging cases: the relay crew with rotating shifts, an infiltrator pretending to cooperate, a checked-out member who's disengaged, a non-human stand-in like software or an animal, and nested groups without their own intentions.

  I need to create desiderata for such a theory, with clear cases illustrating each requirement. For each one, I should indicate whether it's non-negotiable or potentially negotiable based on different theoretical camps. The user wants this sorted into core requirements versus preferences, and they're particularly interested in identifying which requirement disqualifies most theories and whether any desiderata conflict.

  Let me outline the key desiderata based on their cases:
  1. **Fluid Membership**: Must handle entry/exit without group consent (shown by relay crew and checked-out member). This seems non-negotiable for practicality.
  2. **Partial Knowledge**: Shouldn't require full common knowledge (relay crew case). Non-negotiable for real-world applicability.
  3. **Normative Force**: Must explain obligations like consultation (user's explicit ask). Non-negotiable since it's central to their use case.
  4. **Non-Human Participants**: Should accommodate non-intentional entities (stand-in case). I'll mark this as negotiable since it depends on whether we see obligations as attaching to roles or minds.
  5. **Asymmetric Commitment**: Must handle cases like the infiltrator where surface behavior masks hidden motives. Non-negotiable for accountability.
  6. **Coercion Accommodation**: Should address coerced participants without excusing them. Negotiable - important but some theories might reasonably exclude it.
  7. **Group-in-Group Actions**: Must allow nested groups without collective intentions (nested crews). Non-negotiable given modern organizational structures.
  8. **Graded Membership**: Should permit degrees of participation. Negotiable but highly useful.

  The "fluid membership without consent" requirement likely disqualifies most traditional theories that rely on mutual agreement. And there's tension between "non-human participants" and "asymmetric commitment" since the former downplays intention while the latter requires discerning it.

  For candidate theories:
  - Interlocking individual plans (Bratman-style) struggles with fluid membership and non-humans.  
  - Irreducible we-intention (Searle/Gilbert) falters on partial knowledge and nested groups.  
  - Joint commitment (Gilbert) has trouble with unilateral exit and coercion cases.  

  The user clearly prioritizes practicality over theoretical purity, so I'll emphasize where theories fail their specific use cases rather than abstract problems. The nested groups case seems particularly damaging to collective-state theories, while the relay crew devastates common-knowledge approaches. I'll make sure to highlight these breaking points.
answer: |-
  Here’s a rigorously practical set of desiderata for a theory of shared intention, built from your cases. Each requirement is marked **Non-negotiable** (essential for your use case) or **Negotiable** (reflects theoretical preferences). I’ll then sort meta-requirements, identify the "theory-killer," flag tensions, and briefly assess candidate shapes.

  ---

  ### **Desiderata from Cases**  
  1. **Fluid Membership without Consent**  
     - *Case:* Relay crew (rotating shifts, no overlap, minimal knowledge).  
     - *Requirement:* The theory must allow agents to enter/exit the joint action **without requiring group consent or mutual acknowledgment**. Membership hinges on role-adoption, not continuous mutual recognition.  
     - *Non-negotiable?* **YES**. Without this, hierarchical/fluid projects (e.g., emergency response, automated workflows) can’t be modeled.  

  2. **Partial Knowledge & No Common Knowledge**  
     - *Case:* Relay crew (each knows only their leg, not others’ identities/plans).  
     - *Requirement:* Must function **without full common knowledge** of intentions or subplans. Agents need only minimal awareness of their role in a larger structure.  
     - *Non-negotiable?* **YES**. Common knowledge is unrealistic in distributed systems (e.g., supply chains, shift work).  

  3. **Obligations Attach to Role-Performance**  
     - *Case:* Stand-in (software/animal reliably executing a role).  
     - *Requirement:* Accountability (blame, debts) must **attach to the fulfillment (or failure) of a role**, not solely to intentional states. If a non-intentional entity performs a role, obligations flow to its creator/delegator.  
     - *Non-negotiable?* **Negotiable** (but costly to ignore). Intentionalist theories reject this, but in practice (e.g., an AI causing harm), *some* agent must bear responsibility. Rejecting this risks leaving gaps in accountability.  

  4. **Surface Alignment ≠ Shared Intention**  
     - *Case:* Infiltrator (meshes plans but secretly aims to fail).  
     - *Requirement:* Must distinguish **behavioral coordination** from **genuine participatory commitment**. Sharing intention requires (at least) that an agent *does not actively undermine* the joint goal while performing their role.  
     - *Non-negotiable?* **YES**. Otherwise, saboteurs could demand "credit" for cooperation.  

  5. **Exit by Withdrawal, Not Declaration**  
     - *Case:* Checked-out member (stops caring but keeps acting).  
     - *Requirement:* Membership ends **when an agent ceases to perform their role or acts against the joint goal**, not when they announce exit. No "uptake" from others needed.  
     - *Non-negotiable?* **YES**. Hierarchical settings (e.g., corporations) require this to assign blame for passive failure (e.g., negligence).  

  6. **Groups as Members Without Group Minds**  
     - *Case:* Nested crews (team as participant in larger action, no "team intention").  
     - *Requirement:* Must allow **groups to act as single members** in larger joint actions *without* requiring the group to have its own "shared intention" (i.e., no irreducible collective states).  
     - *Non-negotiable?* **YES**. Modern organizations rely on modular, nested structures (e.g., a subcontractor in a construction project).  

  ---

  ### **Meta-Requirements: Core vs. Negotiable Preferences**  
  | **Requirement**                           | **Non-negotiable?** | **Why**                                                                 |  
  |-------------------------------------------|---------------------|-------------------------------------------------------------------------|  
  | Works without communication/common knowledge | YES             | Relay crew case; real-world scale.                                      |  
  | Built from individual intentions only      | NO              | *Preference:* Permissible if collective states reduce to individual attitudes (e.g., nested crews). |  
  | Graded membership allowed                 | YES             | Checked-out member case; responsibility scales with contribution/control. |  
  | Must address coercion (e.g., threatened employee) | NO       | *Preference:* Coercion may void voluntariness but not accountability (blame often still applies). |  
  | Explains normative "owe-a-say" force      | YES             | **Core to your use case:** Accountability hinges on this.                |  

  ---

  ### **Theory-Killer Requirement**  
  **Fluid Membership without Consent** (Desideratum 1) knocks out most major theories:  
  - **Bratman-style** (interlocking intentions): Requires mutual responsiveness and *sustained* commitment.  
  - **Gilbert-style** (joint commitment): Demands mutual agreement to enter/exit.  
  - **Searle-style** (collective we-intentions): Assumes co-present agents with shared awareness.  

  ---

  ### **Tensions Between Desiderata**  
  1. **Non-Human Roles (3) vs. Normative Force (Meta-5):**  
     - If obligations attach to roles (3), how does this generate *moral* norms (e.g., owed apologies) if the role-filler isn’t an agent? *Tension:* Explaining "you-owe-me" normativity typically requires intentional participation.  
  2. **Surface Alignment (4) vs. Partial Knowledge (2):**  
     - If agents lack knowledge of others’ subplans (2), how can we exclude infiltrators (4) without reading their minds? *Tension:* Requires a minimal "no active undermining" clause observable through action.  

  ---

  ### **Candidate Theories: Breaks on Your Cases**  
  **(a) Interlocking Individual Plans + Mutual Responsiveness + Common Knowledge**  
  - *Breaks:* **Relay crew** (no common knowledge/shared awareness), **Checked-out member** (still "responsive" superficially), **Nested crews** (groups can’t "intend" as individuals).  
  - *Normativity?* Weak: Individual intentions don’t generate obligations *to each other*.  

  **(b) Irreducible We-Intention (Collective State)**  
  - *Breaks:* **Stand-in** (non-intentional entities can’t "we-intend"), **Nested crews** (groups lack minds to host states), **Partial knowledge** (requires mutual recognition).  
  - *Normativity?* Strong: Collective states ground mutual obligations.  

  **(c) Joint Commitment (Non-Unilateral Rescission)**  
  - *Breaks:* **Fluid membership** (entry/exit requires agreement), **Checked-out member** (can’t unilaterally exit), **Coercion** (coerced commitment may not bind).  
  - *Normativity?* Strong: Commitment creates obligations.  

  ---

  ### **Summary**  
  - **Non-negotiable core:** Fluid membership, partial knowledge, normative force, asymmetric commitment handling, role-based exit, nested groups.  
  - **Key tension:** Role-based obligations (for stand-ins) vs. intention-based normativity.  
  - **Verdict:** No existing theory satisfies all desiderata cleanly. The closest fit might hybridize (a) and (c): **individual intentions + role-based commitments + dynamic obligation assignment**. But fluid membership and partial knowledge force radical departures from traditional frameworks. If you prioritize blame allocation over philosophical purity, start from roles and actions, not mental states.
