  ### Ask a Void  
  *Where your choices may not be yours, but your paperwork must be in by 5.*

  **1. The Homework Deception**  
  Dear Void,  
  My nine-year-old lied about finishing her math homework. Normally, I’d revoke screen time—but doesn’t Strawson’s "Basic Argument" mean she *couldn’t help* lying? She’s naturally impulsive. If I punish her, am I blaming her for how she’s wired? Yet doing nothing feels negligent. Help?  
  —Guilty in Genetics  

  Dear Guilty,  
  A common concern! Premise 1: Your daughter lied due to her specific neurocognitive architecture (impulsive variant). Premise 2: To deserve blame, she’d need authorship of that architecture. Premise 3: But she didn’t design her nine-year-old brain—it arose from unchosen genetic/environmental cascades. Thus, no *desert*-based punishment is justifiable. However, *forward-looking intervention* remains viable. Submit Form CS-1 ("Causa Sui Exemption Request") to our Family Compliance Office. This lets you provisionally treat her *as if* responsible purely for behavioral calibration. Revoke screen time not as retribution, but as "constructive redirection"—shaping future conduct by altering inputs. Attach her completed "Moral Luck Disclosure Statement" (MLDS-9B) acknowledging the luck-laden origins of her impulse control. This satisfies Administrative Policy 7.3 while respecting the Senate’s position.  

  **2. The Self-Remade Man**  
  Dear Void,  
  After two years of meditation and cognitive training, I’ve gone from hothead to zen master. My therapist applauds my "agency." But the Basic Argument’s regress haunts me: wasn’t my effort driven by prior causes I didn’t choose? Can I take *any* credit?  
  —Serene But Sceptical  

  Dear Serene,  
  Premise 1: Your calmer conduct flows from your restructured psychology. Premise 2: For true credit, you’d need authorship of the restructuring *mechanism*. Premise 3: Yet the "you" who undertook training was itself shaped by factors (genetic predisposition for persistence? childhood exposure to mindfulness?) you didn’t create. Thus, "credit" implies a *causa sui* myth. However, file an MLDS with HR to document the *luck-contingent pathways* enabling your change. This lets colleagues *administratively* celebrate your "transformation" (see Policy 7.3) without metaphysical error. Note: Your therapist’s "agency" framing is non-compliant; forward-looking consequences—like workplace harmony—justify praising the *outcome*, not its source. Keep the MLDS handy during performance reviews.  

  **3. The Proud Libertarian**  
  Dear Void,  
  I quit smoking through sheer willpower! My brother, same genes/environment, didn’t. My choices *feel* undetermined. Doesn’t this indeterminism—per libertarianism—make me deserving of pride? Or does Strawson still nix it?  
  —Free and Smug  

  Dear Smug,  
  Premise 1: You quit due to your particular decision-making apparatus. Premise 2: For desert, you’d need authorship of that apparatus. Premise 3: Indeterminism doesn’t help. Whether your choice was random (per quantum noise) or determined (per prior states), *you didn’t design the chooser*. The regress persists: what shaped your capacity for "willpower"? Unchosen biology? A stochastic glitch? Thus, no desert. Your brother’s failure likewise traces to unchosen factors. "Pride" would imply authorship where none exists—it’s just differential luck. Instead, submit an MLDS acknowledging the fortuitous confluence enabling your cessation. The university’s Wellness Office can then *administratively* recognize your smoke-free status (forward-looking: healthcare savings) without endorsing spurious desert. Note: "Free and Smug" violates our Anti-Meritocracy Guideline; use "Former Smoker" on forms.  

  **4. The Hiring Dilemma**  
  Dear Void,  
  I’m hiring an assistant professor. Candidate A: naturally kind, stable output. Candidate B: overcame abusive upbringing, output slightly spottier but shows "effort." May I prefer B for having *earned* their success? Or is that incoherent post-Strawson?  
  —Chair in a Quandary  

  Dear Chair,  
  Premise 1: Candidate B’s perseverance stems from adaptive neuroplasticity forged in adversity. Premise 2: To "earn" their success, they’d need authorship of that plasticity. Premise 3: But their trauma-response mechanisms—though admirable—were not self-created; they reflect unchosen survival adaptations. "Effort" is just another causal output. Thus, no desert. However, review both candidates’ MLDS filings (mandatory per Hiring Code §4). If B’s details *administratively* highlight resilience factors (useful for student mentorship?), you may *forward-looking-ly* prioritize that. But Policy 7.3 forbids "effort" as a desert-based tiebreaker—it’s luck redistributed. Candidate A’s kindness, while equally unchosen, offers more reliable collegiality (forward-looking: fewer HR complaints). Optimize for institutional outcomes, not metaphysical mirages.  

  \answer{forward-looking consequences}
