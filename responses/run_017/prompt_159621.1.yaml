prompt: |-
  I write and test problems for a puzzle competition, and a regular part of the job is the line that says "choose at random": a random chord of a circle, two random break points on a stick, three random points on a sphere. For continuous setups that line keeps turning out not to pin anything down. Draw a chord by picking two points on the circumference independently and uniformly and you get one answer to "is it longer than the side of the inscribed equilateral triangle"; pick a random direction and then a random distance from the centre and you get another; pick a random point inside the circle and let that be the midpoint and you get a third. All three are what any reader would call uniform. I gather that much is a well-known cautionary example; it isn't my question.

  What I keep hitting, and have no word for, is what happens after someone points this out. The move everyone makes, me included, is to say: fine, we don't know which procedure is right, so spread our credence evenly over the procedures we can think of and average their answers. That move seems to fail in its own way. The number you get depends on how many procedures you happened to list, and you can always come up with one more that is just as defensible as the others, so the average drifts and never settles. List the same procedure twice under two descriptions and it silently gets twice the weight. A co-editor and I once produced four different "averages" for the same chord question in one afternoon, each of them principled, mostly because we thought of the methods in different orders. Same story with the stick, where breaking it at two uniform points and breaking it once and then breaking the longer piece give different answers, and averaging the two tells me nothing I trust.

  But it isn't always hopeless, and this is the part I most want pinned down. Sometimes the competing procedures look like one procedure seen from different angles — related by a rotation, or by a rescaling that plainly shouldn't matter to the question being asked — and then averaging over them feels legitimate, and even seems to produce an answer everyone accepts. Other times they look like genuinely different decisions about what to be indifferent between, and averaging just relocates the arbitrariness one level up. I cannot say what the difference is, and when I try I end up restating whichever case I am looking at.

  So: is there an established concept for this second failure, the averaging-over-procedures move that doesn't converge, and is there a term for the distinction between the cases where such averaging is defensible and the cases where it isn't? I make this call four or five times a year and I have to defend it to a co-editor who is not a mathematician, so a name alone won't help me. I need to know whether this is really the first problem reappearing at a higher level or a different problem, what it borders on, and how I could recognise the favourable case before spending a weekend on it. If nothing established fits, say so plainly and give me a definition I could put in a house style guide, together with the cases where it would not apply.
reasoning: |-
  Okay, the user is deeply involved in creating and testing puzzles, particularly dealing with the ambiguity in defining "random" in continuous probability setups. They've encountered the well-known Bertrand paradox with chords but are more concerned with the subsequent step: averaging over different plausible random procedures. They notice that this averaging doesn't always work—it's unstable and depends on how many procedures they list or how they're described. Yet, sometimes it feels legitimate, like when procedures are symmetrically related. They want to understand why this happens and how to distinguish between cases where averaging is valid versus when it's not.

  First, I need to unpack their core issue. The Bertrand paradox shows that different "uniform" methods yield different probabilities. The user's response is to average these methods, but this leads to a meta-problem: the average isn't consistent. They mentioned that listing the same method twice gives it more weight, and adding new methods shifts the result. This seems like an unanchored average. 

  The user distinguishes between two scenarios: one where procedures are symmetric (like rotational or scale-invariant), and averaging feels right, and another where procedures are genuinely different, making the average arbitrary. They need a way to identify when averaging is defensible. 

  I recall that the key to resolving Bertrand's paradox is specifying invariance principles. For chords, if the problem requires rotational invariance, methods that respect that (like random midpoint) are valid. Scale invariance might point to another method. But if the problem doesn't specify, averaging without a principle fails. 

  The user's averaging attempt fails because it lacks a measure over the space of procedures. Without a natural measure, the average is arbitrary. When procedures are symmetrically related, like rotations of one method, averaging over the group (like SO(3)) works because the group has a Haar measure. But different methods (e.g., random endpoints vs. random midpoint) aren't related by symmetry, so averaging them has no such justification. 

  The favorable cases likely involve symmetry groups where the Haar measure allows consistent averaging. Unfavorable cases involve incomparable procedures without a group structure. The user needs to check if all methods are transforms of one under a symmetry group. If yes, averaging over the group is valid. If not, it's arbitrary. 

  For their practical needs, advising them to specify symmetries in the problem statement would prevent ambiguity. When averaging is attempted, they should only do so within a symmetry group. Otherwise, it's better to present multiple answers or seek a natural symmetry. Providing a flowchart or checklist in their style guide could help: check for invariance, group structure, or whether methods are reparametrizations. 

  They also need to communicate this to non-mathematician co-editors. Emphasizing that averaging without a symmetry principle is mathematically baseless, while symmetry-based averaging is sound, might help. Giving examples like rotational symmetry making midpoint method valid, versus no symmetry linking endpoints and midpoint methods, clarifies the distinction.
answer: |-
  Your struggle with "averaging over procedures" is a profound insight into the meta-problem of ambiguity in probability modeling. This *is* a distinct failure mode from the initial Bertrand-style paradox. Here's a breakdown of the concepts, why averaging fails, when it *can* work, and how to recognize the difference:

  **1. The Core Problem: Lack of a Natural Measure on the Space of Procedures**
  The fundamental issue is that the set of "equally defensible procedures" often lacks:
  *   **A Natural Topology/Structure:** How are procedures "close" to each other?
  *   **A Natural Measure:** How do you assign "equal credence"? The space is typically infinite-dimensional and unstructured.
  *   **Symmetry:** Procedures often aren't transforms of each other under a well-defined group action.

  **Averaging over an unstructured set of procedures is mathematically unanchored.** The result depends entirely on:
  *   How you parameterize the procedures.
  *   How you sample them (e.g., how many you list).
  *   The measure you implicitly or explicitly put on your sample of procedures.

  This is why listing a procedure twice gives it double weight and adding new procedures shifts the average: **You are not averaging over the *outcomes*; you are averaging over your *subjective choices of models*, and you haven't defined a probability distribution over *that* space.**

  **2. The Established Concept: This is an Example of the "Ill-Posed Problem" or "Unspecified σ-Algebra" at a Meta-Level**
  While there isn't a single universally accepted *name* for this specific failure, it falls under:
  *   **The Problem of Ill-Posed Specifications:** The instruction "choose at random" without specifying *how* is inherently ambiguous. Attempting to resolve it by averaging procedures is an attempt to *define* the randomness, but the ambiguity just shifts to "choose a procedure at random," which is equally ill-posed without specification.
  *   **Lack of a Natural σ-Algebra/Measure:** Just as the original paradox arises because different σ-algebras/measures on the sample space (circle chords) are equally natural, the meta-problem arises because there's no natural σ-algebra/measure on the space of possible sampling procedures. Your averaging is implicitly imposing an arbitrary one (often discrete and uniform over a finite, subjectively chosen list).
  *   **Vulnerability to Reparameterization:** This is analogous to the original paradox but at the meta-level. The "size" or "weight" of a procedure depends entirely on how you describe it, not on any intrinsic property.

  **3. Distinguishing the Favorable Cases: Symmetry and Invariance**

  The key difference between the cases where averaging *feels* legitimate and where it doesn't lies in **symmetry** and the presence of a **group action**:

  *   **Favorable Case: Averaging Over a Symmetry Group**
      *   **Scenario:** The different "procedures" are not fundamentally different models. They are the *same underlying sampling process* viewed from different perspectives related by a natural symmetry group (e.g., rotations, translations, scalings). The question being asked is *invariant* under this symmetry.
      *   **Example 1 (Chord):** "Pick a random direction" and "pick a random direction rotated by 45°" are the *same procedure* under rotation. Averaging over all rotations (using the uniform/Haar measure on SO(2)) is natural and gives the "random midpoint" method. The group structure provides the necessary topology and measure.
      *   **Example 2 (Sphere):** "Pick three random points using coordinate system A" and "using coordinate system B rotated from A" are the same under rotation. Averaging over SO(3) is natural.
      *   **Example 3 (Rescaling):** If a problem is scale-invariant (e.g., "probability a random chord is longer than radius"), then procedures differing *only* by a scale factor represent the same outcome distribution. Averaging over scale factors (using an appropriate measure like dλ/λ) can be justified.
      *   **Why it Works:** The symmetry group provides:
          *   A well-defined space (the group manifold).
          *   A natural, unique (up to scale) measure (Haar measure).
          *   A guarantee that averaging over the group "washes out" the arbitrary choice (direction, orientation, scale) without changing the underlying probabilistic model relative to the invariant question.
      *   **Recognizing it:** Ask: "Are these procedures genuinely different ways of sampling, or are they just the *same* sampling process applied after applying a symmetry transformation (rotation, translation, scaling) to the *entire setup*? And is the question I'm asking unchanged by that same symmetry?" If the answer is "yes, it's just symmetry," averaging over the group is defensible.

  *   **Unfavorable Case: Averaging Over Fundamentally Different Models**
      *   **Scenario:** The procedures represent genuinely different physical or conceptual mechanisms for generating the "random" object, and they are *not* related by a symmetry that leaves the question invariant.
      *   **Example 1 (Chord):** "Random endpoints" vs. "Random midpoint" vs. "Random distance from center". These correspond to different physical actions (picking two points vs. picking a point and direction vs. picking an interior point). They are *not* rotations of the same process. There's no natural symmetry group connecting them.
      *   **Example 2 (Stick):** "Break at two uniform points" vs. "Break once uniformly then break the longer piece". These are different breaking protocols with different outcome distributions. No symmetry links them.
      *   **Why Averaging Fails:** There is no inherent structure defining "similarity" or "distance" between these models. There's no natural way to define a "uniform" distribution over them. Your list is finite and arbitrary. Doubling a procedure description doubles its weight arbitrarily. Adding a new, equally plausible procedure changes the average arbitrarily.
      *   **Recognizing it:** Ask: "Do these procedures correspond to different physical actions or conceptual definitions of 'uniform' that cannot be transformed into each other by simply rotating, translating, or scaling the *whole system*? Does the *mechanism* itself differ?" If the answer is "yes, they are fundamentally different mechanisms," averaging is arbitrary and unstable.

  **4. Recommendations for Your Puzzle Competition & Style Guide**

  *   **Avoid "Choose at Random":** Be explicit. Use phrases like:
      *   "Choose two points independently and uniformly on the circumference."
      *   "Choose a direction uniformly at random and then choose a distance from the center uniformly at random from 0 to R."
      *   "Choose a point uniformly at random within the circle and let that be the midpoint of the chord."
      *   "Break the stick at a point chosen uniformly at random along its length."
      *   "Break the stick at two points chosen independently and uniformly along its length."
  *   **When Explicitness is Undesirable (The Puzzle *Is* the Ambiguity):**
      *   Acknowledge the ambiguity. State: "Different reasonable interpretations of 'at random' lead to different probabilities. The problem explores this ambiguity."
      *   Ask for the probability *under a specific interpretation*.
      *   If you *must* present a single answer, **only average over procedures related by a clear, relevant symmetry group.** Justify this choice briefly (e.g., "Assuming the process is rotationally invariant...").
  *   **Style Guide Definition:**
      > **Model Ambiguity & Procedure Averaging:** When a problem asks for a probability involving a "randomly chosen" continuous object (e.g., chord, broken stick, points on a sphere), multiple sampling procedures may seem equally "uniform." Averaging the results of different procedures is generally **invalid** unless:
      >   1.  The procedures represent the *same underlying sampling mechanism* applied after transforming the problem setup by an element of a **natural symmetry group** (e.g., rotations, translations, scalings).
      >   2.  The question being asked is **invariant** under that same symmetry.
      >   3.  The averaging is performed uniformly (using the Haar measure) over the *entire continuous group*.
      >
      >   **Examples:**
      >   *   *Valid:* Averaging the probability a random chord is longer than the radius over all possible orientations (rotational symmetry SO(2)).
      >   *   *Invalid:* Averaging the probability a random chord is longer than the side of an inscribed triangle obtained using the "random endpoints", "random radius", and "random midpoint" methods. These are fundamentally different sampling mechanisms not related by symmetry.
      >   *   *Invalid:* Averaging results from a finite list of procedures (e.g., listing "random endpoints" twice and "random midpoint" once gives double weight to endpoints).
  *   **Decision Flowchart for You & Your Co-Editor:**
      1.  **Is the "choose at random" ambiguity *part* of the puzzle's intended challenge?**
          *   *Yes:* State it explicitly. Either present multiple answers or design the puzzle to highlight the ambiguity.
          *   *No:* Proceed to step 2.
      2.  **Can we specify a single, unambiguous sampling procedure that fits the puzzle's context/story?**
          *   *Yes:* Use that procedure explicitly.
          *   *No:* Proceed to step 3.
      3.  **Is there a clear, dominant symmetry (rotation, translation, scale) inherent in the problem that all reasonable procedures *must* respect?** (e.g., A circle has rotational symmetry; a stick's length might be scale-invariant for some questions).
          *   *Yes:* Choose a procedure naturally invariant under that symmetry (e.g., random midpoint for chords under rotation) *or* average over the symmetry group *if* the group structure is simple enough. Justify the choice based on symmetry.
          *   *No:* **Do not average different procedures.** Either:
              *   Present multiple answers with their methods.
              *   Choose the simplest/most common procedure and state your choice.
              *   Re-design the puzzle to avoid the ambiguity.

  **In essence:** The favorable case leverages symmetry to define a *single* invariant procedure or a well-defined average over symmetries. The unfavorable case involves averaging over genuinely distinct models, which lacks a mathematical foundation without imposing an arbitrary meta-distribution. Your intuition about symmetry being the key differentiator is precisely correct. Focus on identifying the relevant symmetry (or lack thereof) to make defensible choices and avoid the unstable averaging trap.
