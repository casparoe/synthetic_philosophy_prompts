  2. **Independence from `A`:**  
     - `P_A(X)` is the mean of `X` over `A`-rows, which equals `P(X|A)` in the original weighting.  
     - So `P(X|A) = P(C|A)`.  
     - By assumption, `P(X) = P(C|A)` in the original weighting.  
     - Thus, `P(X) = P(X|A)`, implying `X` is independent of `A` (for any weighting).  
  3. **Constraint on `¬A`-rows:**  
     - Expand `P(X)` using law of total expectation:  
       `P(X) = P(X|A) * P(A) + P(X|¬A) * P(¬A)`.  
     - Substitute `P(X) = P(X|A)`:  
       `P(X|A) = P(X|A) * P(A) + P(X|¬A) * P(¬A)`.  
     - Solve: `P(X|¬A) * P(¬A) = P(X|A) * P(¬A)`.  
