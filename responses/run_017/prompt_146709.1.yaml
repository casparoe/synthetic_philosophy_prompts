  ### Lewis's Triviality Results in Dataframe Vocabulary

  **Restatement of the Problem:**
  - **Rows (worlds):** Each row represents a possible world/state.
  - **Propositions (boolean columns):** A proposition is a boolean column (True/False per row).
  - **Probability:** The weighted mean of a boolean column (using row weights).
  - **Conditional Probability `P(C|A)`:** The group-mean of column `C` over rows where `A` is True.  
    Computed as:  
    `P(C|A) = (sum of weights for rows where A and C are True) / (sum of weights for rows where A is True)`.
