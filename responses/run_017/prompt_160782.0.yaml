prompt: |-
  I've been poking at Indian philosophy on my own for about a year — no Sanskrit, no classes, just stuff I run into online plus a friend from work who grew up around some of this — and the thing I keep circling back to is the pramana business: the lists of "means of knowledge" that the Nyaya school argues about (perception, inference, comparison from a description, testimony, with other schools wanting to add postulation-from-a-puzzle and cognizing-an-absence, and the materialists wanting to allow only perception). What I want isn't a tour of who held which list. I want the spec first. Concretely: I want a theory I can actually use to audit my own beliefs — to sort the things I think I know into ones I should trust and ones I shouldn't, including things I got off the internet, out of books whose authors I can't check up on, and off instruments. Write me the desiderata such a theory has to meet, with the case or worry behind each one.

  Cases I think it has to get right: the rope taken for a snake; a dream that feels exactly like perception while you're in it; someone who guesses and happens to be right; remembering where you left your keys; noticing that there is no pot on the floor; recognizing an animal you've never seen because someone told you it looks like a cow; concluding from "he's fat and never eats during the day" that he eats at night; being told the truth by someone who's generally a liar; being told something false by someone who's generally reliable; knowing that you're in pain or that you're annoyed; a thermometer reading, a calculator output, a photograph, an answer from a chatbot (is the instrument the source, or is it testimony from whoever built it, or an inference from a display?); a sign or a Wikipedia article with no identifiable author to vouch for it; and two-step cases where you learn X from someone and then work out Y yourself — what's the source of Y, and is it one pramana or two?

  Things I'd want the list to address, and you should tell me which of these are real requirements and which are just one camp's taste: a principled way of deciding when something is a *distinct* pramana versus a special case of another one (otherwise the list is arbitrary and can grow forever); a reason to stop at the number you stop at; not over-generating into dreams, lucky guesses and confident mistakes; not under-generating so that absence-cognition or analogy get left out; whether the pramana is supposed to be a causal source or more like a justification you could cite; whether knowledge from a pramana has to be *new* — I half-remember a Sanskrit term, something like anadhigata? — and if so what happens to re-checking something you already believe, since re-checking strikes me as one of the most useful things a source can do for you; whether the theory needs the distinction between the source and the knowledge that results from it; whether it needs a story about error that can live with the rope-snake case; and whether "it should lead to successful action when you act on it" is a genuine requirement or a disguised prejudice. My hunch is that the novelty requirement and the confirm-what-you-already-believe one can't both survive — tell me if I'm right, and flag any other pair on the list you suspect is jointly unsatisfiable, because "the desiderata can't all be had at once" is itself the kind of answer I'd find useful. Then say which single requirement kills the most candidate lists. A short scorecard at the end — perception-only, the four, six-or-more, and "whatever process reliably produces true belief" — is fine, but keep most of the thinking in the criteria: that's the part I can't do myself. Please don't just send me to texts; I can't read them anyway.
reasoning: |-
  Okay, the user has been exploring Indian philosophy, particularly the concept of pramanas, for about a year without formal training. They're focusing on Nyaya school debates about means of knowledge like perception, inference, comparison, and testimony. But they don't want a historical overview; they want a practical framework to audit their own beliefs. 

  The user presents several specific cases they want the theory to handle: sensory illusions (rope mistaken for snake), dreams, lucky guesses, memory of keys, noticing absences (no pot), analogical recognition (new animal described as cow-like), inferences about night eating, unreliable truth-tellers, reliable liars, first-person experiences (pain), instrument readings (thermometer), anonymous sources (Wikipedia), and multi-step knowledge chains. 

  They also raise structural questions: how to distinguish unique pramanas vs. subtypes, justification for limiting their number, avoiding over/under-generation of knowledge, causal vs. justificatory nature, novelty requirements vs. reconfirmation needs, source-knowledge distinction, error explanations, and whether successful action is necessary. 

  Hmm... the core tension seems to be between their desire for a practical audit tool and the philosophical complexity of pramana theory. Their examples reveal real-world concerns: trusting digital information, navigating unreliable sources, validating personal experiences. The "novelty vs. reconfirmation" point is particularly sharp - if knowledge must be new, how do we justify double-checking? 

  The user's frustration with inaccessible texts is palpable. They need synthesis, not scholarship. Their "scorecard" request suggests they'd appreciate clear tradeoffs between theoretical purity and practicality. The joint unsatisfiability question is smart - they're anticipating that no system will satisfy all desiderata. 

  For the response structure: First, define mandatory requirements (error-avoidance, coverage, etc.) derived from their cases. Then address their structural questions as "design choices" with pros/cons. Highlight key tensions like novelty-reconfirmation. Finally, evaluate major approaches through this lens, emphasizing why each fails certain requirements. The thermometer case will be pivotal for showing how instrument trust forces either instrument-as-testimony or a new pramana category. 

  Most importantly: they want to use this. However elegant, a theory that doesn't help audit Wikipedia articles or chatbot answers will disappoint them. The "successful action" criterion might need reframing as practical reliability rather than philosophical truth.
answer: |-
  Here's a framework designed for belief auditing, built from your cases and concerns. It prioritizes practical application over historical fidelity, using the pramana concepts as tools rather than doctrines. The core challenge is balancing *explanatory power* (handling diverse cases) with *practical usability* (a manageable list).

  **Core Desiderata (Mandatory Requirements):**

  1.  **Error Distinction:** *Must distinguish knowledge from non-knowledge (error, illusion, luck) in principle.*
      *   **Case/Worry:** Rope-snake, dreams, lucky guesses, confident mistakes, liar telling truth. If the theory can't explain *why* these aren't knowledge, it's useless for auditing. (Kills "whatever reliably produces true belief" if reliability is judged *after* the fact or externally).
  2.  **Source Identification:** *Must provide a clear, traceable origin for the belief.*
      *   **Case/Worry:** Thermometer reading, calculator output, Wikipedia, chatbot, multi-step derivation (X from testimony, Y from inference on X). Auditing requires knowing *where* a belief came from to assess its grounds. (Kills vague notions like "intuition" without further specification).
  3.  **Coverage:** *Must account for all core types of justified belief encountered in ordinary life and inquiry.*
      *   **Case/Worry:** Perception, inference, testimony (reliable/unreliable), memory, absence, analogy (cow-like animal), instrument outputs, first-person states (pain/annoyance). Missing a major source (like absence or testimony) renders the audit incomplete.
  4.  **Justification-Centric (vs. purely Causal):** *Must focus on the *grounds* or *reason* for holding the belief as true, not just the physical cause.*
      *   **Case/Worry:** Rope-snake (physically caused by senses, but not *justified* as a snake), dream (caused by brain, not justified as reality), lucky guess (caused by random firing, not justified). We audit *why we think it's true*, not just how the thought popped up. (Strongly argues against purely causal definitions of pramana).
  5.  **Error Explanation:** *Must have a coherent account of *how* error occurs within the framework.*
      *   **Case/Worry:** Rope-snake, dreams, reliable source lying, misremembering keys. The theory needs to say *where the process broke down* (faulty input? invalid inference? defective source?).

  **Critical Design Choices (Trade-offs & Tensions):**

  6.  **Distinctness Principle:** *Requires a clear criterion for when a source is distinct, preventing arbitrary proliferation.*
      *   **Option 1 (Cognitive Mechanism):** Distinct if it relies on a fundamentally different psychological/cognitive process (e.g., raw sensing vs. linguistic processing vs. logical deduction). *Problem:* Hard to define "fundamentally different" cleanly; instrument perception might blur with sense perception.
      *   **Option 2 (Type of Justificatory Ground):** Distinct if the nature of the evidence/justification is categorically different (e.g., direct sensory presence vs. relational similarity vs. linguistic authority vs. logical necessity). *Preferred for auditing.*
      *   **Requirement?** Yes, to avoid infinite list syndrome ("internet browsing pramana"?). *Tension:* Instruments (thermometer, photo) strain this – are they perception, inference, or testimony?
  7.  **Novelty (Anadhigata) vs. Reconfirmation:** *Can a pramana confirm/strengthen an *existing* belief, or only generate *new* knowledge?*
      *   **Case/Worry:** Re-checking keys, re-measuring with thermometer. Auditing *requires* reconfirmation! Denying this cripples utility.
      *   **Tension:** Strict novelty requirement kills reconfirmation. **These are Jointly Unsatisfiable.** A usable theory **must** allow pramanas to reconfirm existing beliefs. Treat novelty as a feature of *some* instances, not a defining characteristic of the pramana itself.
  8.  **Instrument Problem:** *Must handle knowledge derived from complex instruments/tools.*
      *   **Case/Worry:** Thermometer, calculator, photo, chatbot. Key question: Is the instrument *itself* the source (a new pramana?), or is knowledge mediated through another pramana (Testimony - trusting the maker? Inference - "if calibrated, this display means X"? Perception - of the display itself?).
      *   **Design Choice:** Instruments are best treated as **Extensions/Augmentations of Core Pramanas**. A thermometer reading is *Perception* (of the display) *plus* justified trust (via *Inference* or *Testimony*) in the instrument's calibration and principles. This avoids a proliferation of "pramanas" for every tool.
  9.  **Absence & Analogy:** *Must accommodate knowing absences and knowledge via similarity.*
      *   **Case/Worry:** "No pot on the floor," recognizing animal via "looks like cow" description. These are common and valid. Leaving them out is under-generation. Treating them as pure inference or perception is strained. **Requirement:** Yes, distinct categories (or clear subtypes) are needed for practical auditing. Knowing "no pot" feels different from inferring "if pot, I'd see it" (though related).
  10. **First-Person Authority:** *Must account for privileged access to one's own mental states.*
      *   **Case/Worry:** Knowing you are in pain or annoyed. This seems immediate and foundational. Denying it (e.g., reducing it to inference) feels wrong. **Requirement:** A distinct mode (e.g., a refined "mental perception" within Perception, or a separate "Apprehension") is practical.
  11. **Success Requirement?** *Must knowledge necessarily lead to successful action?*
      *   **Case/Worry:** A true belief might lead to failure due to other factors (e.g., believing correct bridge strength, but earthquake destroys it). **Not a genuine requirement for *knowledge* or *justification*.** It's a *consequence* or *test* often, but not definitional. Including it risks conflating knowledge with utility/pragmatics and makes auditing harder ("Did it work?" vs. "Was it justified?"). **Prejudice?** Arguably yes, if made definitional – it's a *Nyaya/Vaisheshika* emphasis, not universally accepted.

  **Key Tensions & Unsatisfiable Pairs:**

  *   **Novelty (Anadhigata) vs. Reconfirmation:** As above, these **cannot** coexist as absolute requirements. **Reconfirmation wins** for an auditing framework.
  *   **Strict Distinctness (Mechanism) vs. Handling Instruments:** If distinctness requires unique *raw* cognitive mechanisms, instruments become messy. **Solution:** Shift distinctness to *type of justificatory ground*. Instrument knowledge = Perception (of output) + Justified Trust (Inference/Testimony re: function).
  *   **Minimalism (Short List) vs. Coverage (Absence, Analogy):** A very short list (e.g., Perception + Inference) struggles with absence and analogy without awkward stretching. 4-6 categories are likely optimal.

  **The Single Most Damaging Requirement:** **Error Distinction.** Any theory that cannot clearly explain *why* the rope-snake illusion, the dream, or the lucky guess are *not* knowledge (despite feeling compelling) fails the core purpose of auditing. This immediately kills simplistic "Perception-only" (can't handle illusions/dreams) and "True-Belief-via-any-reliable-process" (can't distinguish knowledge from lucky guesses *before* acting) approaches.

  **Scorecard Against the Framework:**

  1.  **Perception-Only (e.g., Charvaka/Materialist):**
      *   **Fails:** Error Distinction (Illusions, Dreams), Coverage (Inference, Testimony, Absence, Analogy, Memory, Instruments, First-Person), Source Identification (for non-perceptual beliefs), Justification-Centric (reduces justification to causation). **Unusable.**
  2.  **The Core Four (Nyaya: Pratyakṣa, Anumāna, Upamāna, Śabda):**
      *   **Strengths:** Clear Source Identification, Strong Error Distinction (via theory of doshas/faults), Covers core cases (Perception, Inference, Testimony, Analogy).
      *   **Weaknesses:** **Struggles with Coverage** - Absence (needs Arthāpatti or Abhāva), Instruments (lumps into Perception/Inference awkwardly), Memory (often seen as a function, not a distinct pramana). Requires stretching Analogy (Upamāna) for complex similarities. **Mostly usable but needs supplementation/modernization for absence/instruments.**
  3.  **Six-or-More (e.g., Prabhakara Mimamsa: Adds Arthāpatti, Abhāva):**
      *   **Strengths:** Best **Coverage** - Explicitly handles Postulation (Arthāpatti: fat man eats at night), Absence (Abhāva: no pot), retains core four. Stronger on Source Identification and Error Distinction for these cases.
      *   **Weaknesses:** **Distinctness Principle** feels stretched (is Arthāpatti *really* distinct from Inference? Is Abhāva distinct from Perception + Inference?). Instruments still a challenge (though easier to slot into Perception + Testimony/Inference). **Most theoretically comprehensive and practical for auditing, if you accept the distinctness.**
  4.  **"Whatever Process Reliably Produces True Belief" (Modern Reliabilism-ish):**
      *   **Strengths:** Can *potentially* cover everything (instruments, internet, etc.).
      *   **Fails Catastrophically:** **Error Distinction** (Can't disqualify a lucky guess or an illusion *at the time it's held* - reliability is often judged externally/afterwards), **Source Identification** (What *is* the source? "The reliable process" is vague), **Justification-Centric** (Focuses on cause, not the believer's grounds - I might have a reliably formed true belief via a process I know nothing about, but is that *justified for me*?). **Unsuited for personal belief auditing.**

  **Recommendation for Your Audit Framework:**

  Adopt a **modified six-fold model** as the most practical basis:

  1.  **Perception (Pratyakṣa):** Sensory (external) and Mental (internal - pain, emotions). *Includes instrument readings **as the sensory component**, but requires...*
  2.  **Inference (Anumāna):** Logical deduction/induction based on evidence/universals. *Crucial for justifying trust in instruments, deriving "eats at night," error-checking.*
  3.  **Testimony (Śabda):** Reliable verbal/written report (person, book, article, *even anonymous if source reliability is inferred*). *Foundation for books, internet, chatbot responses (testimony of the system/programmers).*
  4.  **Comparison/Analogy (Upamāna):** Knowledge of similarity ("looks like a cow"). *Handle this distinctly.*
  5.  **Postulation (Arthāpatti):** Knowledge derived as the only possible explanation resolving a puzzle ("fat & never eats days" -> "must eat nights"). *Handle this distinctly.*
  6.  **Absence (Abhāva):** Non-perception leading to knowledge of absence ("no pot here"). *Handle this distinctly.*

  **Crucial Audit Practices using this Framework:**

  *   **Tag the Source:** For any belief, assign it to one (or more) of the six.
  *   **Interrogate the Source:**
      *   *Perception:* Illusion/dream possible? Sensory defect? Instrument calibrated/trustworthy? (Requires Inference/Testimony)
      *   *Inference:* Are premises sound? Is the logic valid?
      *   *Testimony:* Is the source competent & honest? Corroboration?
      *   *Comparison:* Is the similarity well-defined and accurate?
      *   *Postulation:* Are there truly no other explanations?
      *   *Absence:* Were conditions suitable for perception? Could it be hidden?
  *   **Multi-Step:** Break it down (e.g., Chatbot answer: Testimony source -> Maybe Inference if you process it further -> Requires assessing Testimony reliability via Inference about AI/data).
  *   **Reconfirmation is Key:** Use the pramana *again* (e.g., check keys again, re-read source, re-run inference, get corroborating testimony).
  *   **Accept Degrees of Confidence:** The audit yields justification levels, not absolute certainty (except perhaps privileged first-person states).

  This framework provides the structure to dissect *how* you know something and systematically probe for potential weaknesses or errors in that justification, directly addressing your core desire to audit your beliefs. It acknowledges the tensions but offers a workable, philosophically grounded system.
