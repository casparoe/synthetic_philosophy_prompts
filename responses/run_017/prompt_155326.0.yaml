answer: |-
  Here’s a close reading of *The Wizard of Oz* through your requested philosophical lens, focusing on the tension between **acceptance-dependent institutional kinds** (openly conventional) and **illusion-backed institutional kinds** (reliant on hidden mechanisms/false beliefs). The film’s magic *does* complicate direct analogies to money, but it precisely highlights how institutional power can *feel* magical or intrinsic when operating under illusion.

  ### 1. The Emerald City Green Glasses: Illusion as Systemic Infrastructure  
  **Scene**: Citizens must wear tinted glasses to perceive the city as "emerald." The Wizard later admits it’s an optical illusion.  
  **Reading**: This isn’t just shared representation; it’s **coercive illusion-backing**. Unlike money (which requires *voluntary* participation in a convention), the Emerald City’s "value" depends on *enforced ignorance*. The glasses aren’t a neutral tool for seeing value (like a price tag); they’re a mechanism that *manufactures* value by hiding reality.  
  - **Contrast with Money**: Taking off the glasses isn’t like realizing gold isn’t intrinsically valuable (which doesn’t collapse monetary systems). It’s like exposing a *fraudulent* currency propped up by force or deception (e.g., hyperinflationary money backed by false government promises). The city’s splendor collapses when the illusion breaks, whereas functional money persists *because* its conventional nature is openly accepted.  
  - **Philosophical Work**: The scene critiques institutional kinds built on **epistemic injustice**—where the rules are hidden from participants. Money *can* function this way (e.g., if a central bank secretly manipulates currency), but it *need not*. The Emerald City is a warning: when conventions rely on deception, they become fragile and oppressive.

  ### 2. Behind the Curtain: Recognition vs. Constitutive Power  
  **Scene**: The Wizard—exposed as a humbug—gifts the Scarecrow (diploma), Tin Man (heart clock), and Lion (medal) for qualities they already demonstrated.  
  **Reading**: The gifts **symbolically recognize pre-existing realities**, but the *ritual* of bestowing them **constitutively transforms their social status**. The diploma doesn’t give the Scarecrow intelligence; it grants him *authority* as "brainy." The medal doesn’t make the Lion brave; it publicly validates him as "courageous."  
  - **Contrast with Money**: Money’s power is *entirely* constitutive: a $100 bill’s value is *created* by collective agreement, not recognition of intrinsic properties. The Wizard’s gifts blend both: the qualities are real (acceptance-independent), but their *social efficacy* requires institutional endorsement (acceptance-dependent).  
  - **Philosophical Work**: The scene distinguishes **fraud** from **legitimate social construction**. The Wizard’s *mechanism* (hiding behind machinery) is fraudulent, but the *outcome* (transforming status through symbols) isn’t. Money isn’t fraudulent just because it’s conventional; it’s fraudulent *only if* its rules are misrepresented (e.g., counterfeit currency). The critique targets **hidden mechanisms**, not institutional kinds themselves.

  ### 3. The Ruby Slippers: Magic vs. the "Feel" of Social Power  
  **Scene**: The slippers have objective causal power (shocking the Witch, sending Dorothy home) regardless of belief. Glinda reveals Dorothy always had this power but needed to "learn for herself."  
  **Reading**: The slippers **break the money analogy**—their power is *ontologically independent* of human attitudes. Yet they **mirror how institutional kinds *feel* in practice**: as if they possess intrinsic, almost magical, force. Dorothy’s ignorance parallels how people naturalize social constructs ("money *just is* valuable").  
  - **Contrast with Money**: Money *only* works if people accept it. If everyone rejected dollars, they’d be worthless. The slippers work *even if* Dorothy doubts them (she clicks them skeptically).  
  - **Philosophical Work**: The slippers expose a **psychological truth** about institutional kinds: we experience them as *reified* (having independent power), even when we know they’re constructed. Glinda’s lesson—"you always had the power"—highlights that institutional power (like money) *requires our participation* to function. The magic *prevents* a direct institutional reading but **dramatizes the fetishism of social constructs**: we treat them as if they were ruby slippers, with innate causal power.

  ---

  ### What the Film Adds to the Philosophy (Beyond a "Straight Argument")
  1. **The Role of Revelation**: The film shows that *exposing the mechanism* (removing glasses, pulling the curtain) doesn’t always destroy the institution. The gifts retain power post-revelation because they tap into real qualities. This nuances the illusion-backed critique: not all socially constructed kinds collapse when deconstructed—only those purely reliant on deception.  
  2. **Agency and Self-Discovery**: Dorothy’s journey mirrors how individuals internalize/constitute institutional power. Money’s value depends on collective acceptance, but *using* it feels like an individual act of faith ("clicking the heels").  
  3. **Emotional Resonance**: The film captures the *vulnerability* of relying on systems we don’t fully understand (e.g., econ majors trusting market mechanisms). When the Wizard says, "Pay no attention to that man behind the curtain!", it’s a perfect metaphor for how elites obscure institutional workings.

  **Where the Analogy Fails (and Why It Matters)**: The slippers’ magic is irreducibly non-social. This forces us to isolate what *specifically* makes money socially constructed: its power *vanishes* without collective buy-in, unlike magic. The film’s supernatural elements make the "constructedness" of human institutions *more* visible by contrast. For first-years: it’s a vivid reminder that money isn’t ruby slippers—we *give* it power, and we can (theoretically) change the rules.
