prompt: |-
  Something I keep tripping over in the "what could someone reasonably reject" / many-vs-one literature, and I dont know whether it has a name.

  The case everyone argues about is: a million people each get a mild headache, or one person loses a hand. Non-summers say the headaches never add up to the hand, and I get the shape of that argument. But there's a class of cases where the many do seem to win without anyone adding anything, and its when their complaints arent really separate complaints. Case one: a town of 5,000 loses its only water source. Each person's complaint is about the very same loss, so saying "each of the 5,000 has a complaint" counts one loss 5,000 times — but it also seems wrong to say the town's complaint is the same size as one person's. Case two: a policy badly hurts one person, and everyone else in the community is horrified about it. Their horrifiedness isnt a harm to them, and it isnt the same event repeated either — it's 5,000 responses to one event — and yet the number of people responding seems to matter.

  So the pattern: cases where counting one complaint per head either inflates (a shared loss gets counted over and over) or sweeps in complaints from people who arent the ones being hurt (distress about someone else's treatment). It looks like aggregation but I dont think it's the "do the numbers count" question, because the disagreement isnt about whether small harms sum — it's about whether these are N separate complaints in the first place. People usually just declare that every person's complaint gets counted once and move on, which papers over both directions.

  Does this have a name? I dont want just a label. I want to know what the nearest established concepts are, how my thing falls outside each of them, and which one actually fits; and if none does, coin something and define it tightly enough that I can tell in a new case whether it applies.

  Give me a JSON object with these fields: nearest_concepts (a list, each entry with: name, what_it_actually_picks_out, where_it_fits_my_case, where_it_doesnt, and fit as exact/partial/no), verdict (one sentence on whether anything established covers this exactly), proposed_term (term, definition, one case it clearly covers, one case it clearly doesn't, and a yes/no test I can run on a new case), and boundary_cases (three cases, each with whether the term covers it and why).
reasoning: |-
  We are looking for established concepts that might relate to the user's described phenomenon. The phenomenon involves:

  1. Cases where a single event (like a water source loss) affects multiple people, but counting each person's complaint separately might overcount because they are all complaining about the same underlying event (the shared resource loss).
  2. Cases where people are distressed about an event that directly harms only one person (like a hand being cut off), and we are considering whether the distress of the many should count as separate complaints.

  The key issue is whether the complaints are genuinely distinct or whether they are derivative or overlapping.

  Let's consider some established concepts:

  1. **Aggregation of Harms**: This is the typical "many vs. one" problem. It asks whether small harms to many can add up to outweigh a large harm to one. But in the user's cases, the problem isn't about summing small harms; it's about whether the complaints are independent.

  2. **Double Counting**: In economics and policy, this refers to counting the same loss more than once. For example, if a loss of a public good affects many, we might count each person's loss but that could be double-counting if the good is non-rivalrous. This fits the water source case if the water source is a common resource. However, it doesn't fit the horror case because the horror is a separate experience.

  3. **Externalities**: These are indirect effects of an action on third parties. The horror case might be seen as a negative externality (the distress caused by knowing about the hand being cut off). But externalities are typically about spillover effects that are not the main event, and the question of counting each person's externality as a separate complaint is similar to the aggregation problem.

  4. **Compensation for Non-Pecuniary Losses**: In law, distress caused to others might be considered under emotional distress claims, but usually only for close relatives. This is limited and doesn't cover the entire community.

  5. **Moral Aggregation**: This is a broader philosophical concept that includes the aggregation of well-being. But again, the issue here is about the separateness of complaints.

  6. **The Problem of Overlapping Claims / Non-Independent Complaints**: This is less a named concept and more a feature that might be discussed in the literature on aggregation. The idea is that if complaints are not independent, then we cannot simply count them as additive.

  7. **The Distinction Between Personal and Impersonal Harms**: The horror case involves impersonal harms (distress about someone else's harm) versus the personal harm of losing a hand.

  After reflection, it appears that the core issue is about the **independence of complaints**. We must ask: are the complaints about distinct events or states of affairs, or are they about the same event or state of affairs? And in the horror case, are the complaints of distress about the same event? They are, but each distress is a separate mental state.

  However, in the water source case, the loss is a single event, but it causes multiple harms (to each individual). So the harms are distinct (each person suffers from thirst) but the cause is the same. This is different from the headache case where each headache is a distinct physical event.

  But note: in the headache case, the headaches are distinct events, whereas the loss of the water source is a distinct event that causes multiple harms. The horror about the hand is a distinct event for each observer.

  So perhaps the problem is about **whether the harms are derivative or direct, and whether they are non-rivalrous in description**.

  Let me try to define the concept:

  The user's cases highlight a problem of **"Complaint Overlap"** or **"Non-Independent Complaints"**. Specifically:

  - In the water source case, the complaint of each person is about the same loss of the water source. This is a case of **"Shared Loss Complaint"** where the loss is shared and non-rivalrous (the loss of the water source is a single event that affects all, but each person's harm is a separate consequence). However, if we count each person's harm, we are not double-counting the loss of the water source per se, but we are counting the multiple harms that result from it. But note: the harm to each is distinct (each person is without water) but the cause is the same.

  - In the horror case, the distress of each person is a separate mental event, but they are all about the same external event (the hand being cut off). So they are independent in the sense that each person's distress is a distinct mental state, but they are not independent in terms of what they are about.

  So the issue is: when we count complaints, are we counting distinct harms or distinct causes? And if we count distinct harms, then both the water source case and the horror case would have multiple complaints. But the user is pointing out that this feels wrong in the water source case (because it's the same loss) and in the horror case (because the distress is not a direct harm but a reaction).

  Therefore, the concept we are after might be about **"Complaint Redundancy"** or **"Complaint Non-Separability"**.

  But let's try to be precise.

  Proposed term: **"Complaint Non-Separability"**

  Definition: A situation in which multiple complaints are raised about the same underlying event or state of affairs, such that the distinctness of the complaints is called into question because they are either (a) about a shared loss (where the loss is non-rivalrous and affects multiple parties simultaneously) or (b) about reactive attitudes (such as distress) to a direct harm that primarily affects another party.

  However, this might be too broad. We need a test.

  Alternatively, we might distinguish:

  - **Type 1: Shared Loss Complaints**: Complaints that stem from the loss of a common resource or public good. Here, the loss is a single event, but it causes multiple individual harms. The non-separability arises because the loss is shared and non-rivalrous in the sense that it doesn't cost more to affect more people (it's a single loss that affects all). But note: the harm is still individual (each person suffers from lack of water). So the issue is not that the complaints are not distinct, but that the cause is the same.

  - **Type 2: Reactive Complaints**: Complaints that are emotional responses to harm done to others. These are separate mental events, but they are derivative and not the primary harm.

  But the user's point is that in the shared loss case, it feels wrong to count 5,000 complaints because it's one loss, but also wrong to count it as one complaint because it affects 5,000 people. So the challenge is that the complaint is both one and many.

  Similarly, in the reactive case, the distress is real but it's not the same as being directly harmed.

  So perhaps the established concept that comes closest is:

  - **The Non-Identity Problem**: But that is about future generations and is not relevant.

  - **The Problem of Double Counting**: In cost-benefit analysis, we avoid double counting. In the shared resource case, if we count the loss of the water source as one loss and then also count each person's loss, we are double counting. But actually, in standard welfare economics, we would count the loss to each individual and then aggregate. However, for a public good, we use the concept of the good's total value, which is the sum of individual valuations. But that is exactly what the user is questioning: whether we should sum.

  But note: in the water source case, the loss of the water source is a single event, but it causes 5,000 individual harms (each person's lack of water). So if we count each harm, we are not double counting the event, but we are counting each harm. However, the user feels that this is overcounting because the loss is shared.

  So the issue is about the level of description. We might call it the **"Level of Analysis Problem"** for complaints.

  Given the lack of a perfect fit, I propose:

  **Proposed term**: **"Complaint Singularity"**

  **Definition**: A complaint singularity occurs when a single event or state of affairs gives rise to multiple complaints, but the complaints are so intertwined that they cannot be treated as fully independent. This includes:

  - Cases where the complaints are about the same shared resource loss (non-rivalrous loss), making the loss itself a singular event that affects multiple parties simultaneously and indistinguishably.
  - Cases where the complaints are reactive attitudes (such as horror) to a direct harm that primarily affects a single party, making the reactive complaints derivative and secondary.

  **Test for a new case**:
  - Ask: Are the complaints about the same event or state of affairs?
  - And: Is the event or state of affairs one that is shared (non-rivalrous) in the case of resource loss, or is it a direct harm to one that causes reactive complaints in others?
  - If yes to both questions, then it's a complaint singularity.

  **Example it clearly covers**:
  - The water source case: the loss of the water source is a shared resource loss, so it's a complaint singularity.
  - The horror case: the horror is a reactive attitude to the hand-cutting, so it's a complaint singularity.

  **Example it clearly doesn't cover**:
  - A million headaches: each headache is a distinct event in a distinct person, so not a complaint singularity.

  Now, for the JSON:

  Nearest concepts:
  1. Double Counting:
     - What it picks out: Counting the same loss more than once in an accounting sense.
     - Fits: The water source case might be seen as double counting if we count the loss of the water source and then each person's loss separately (but note, in welfare economics, we don't do that; we only count the individual losses). So it partially fits because the user feels it's overcounting.
     - Doesn't fit: The horror case isn't about double counting the hand loss; it's about whether to count the horror at all. So no for horror.
     - Fit: partial.

  2. Aggregation of Harms:
     - What it picks out: Whether we can add up small harms to outweigh a large one.
     - Fits: The user says this isn't the same because the issue is about whether the complaints are separate. But the horror case might be seen as a form of aggregation (of distress). However, the core of the aggregation debate is about adding independent harms. So it doesn't directly address the non-independence.
     - Doesn't fit: It doesn't provide a framework for when complaints are non-independent.
     - Fit: partial.

  3. Externalities:
     - What it picks out: Indirect effects on third parties.
     - Fits: The horror case is an externality (negative).
     - Doesn't fit: The water source case isn't an externality; it's a direct effect. Also, externalities are typically about market transactions and don't inherently address the non-independence of complaints.
     - Fit: partial.

  Verdict: No established concept covers this exactly.

  Proposed term: "Complaint Singularity"

  Boundary cases:

  1. Case: A policy causes a river to be polluted. Downstream, 100 farmers each lose their crops because they all use the river water. 
     - Covered? Yes. Why: It's a shared resource loss (the river) affecting multiple parties, so it's a complaint singularity.

  2. Case: A person is tortured in a public square, and 100 onlookers are distressed. 
     - Covered? Yes. Why: The distress is a reactive complaint to a direct harm to one.

  3. Case: A policy causes 100 people to each lose their private well (each well is independent). 
     - Covered? No. Why: The loss of each well is a distinct event affecting one person. There is no shared resource and no reactive complaint.

  But note: in the private well case, if the policy is the same (one policy that destroys 100 wells), then the event (the policy) is one, but the harms are distinct. However, the test is about whether the complaints are about the same event and whether it is shared or reactive. Here, the event (the policy) is one, but the loss of each well is a separate state of affairs. So it's not a shared resource (each well is private) and not reactive. Therefore, it doesn't meet the test.

