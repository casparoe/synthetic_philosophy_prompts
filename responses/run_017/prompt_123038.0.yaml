     - Awkward commitment: Structures exist independently, but their "individuation" is underdetermined.  
     - Key answers: Q1b, Q2a, Q3a, Q8b/c, Q9a, Q10a/c.  

  3. **Proof-Based Anti-Realism** (Constructivism)  
     - Commitments: Undecidable sentences lack truth values (Q2b, Q3b). Truth is provability (Q4a, Q8a). No "real" encoding (Q1b). Truth is not independent of knowledge (Q9b). The dispute is substantive (Q10a/c).  
