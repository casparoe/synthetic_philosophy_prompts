  ### Diagnostic Questionnaire: Mathematical Truth and Practice  
  This diagnostic presents concrete cases and claims about mathematics. For each question, select the option that best aligns with your immediate reaction. There are no right or wrong answers, and no philosophical background is required. Answer based on your own reasoning.

  1. **Two Encodings of Natural Numbers**:  
     Consider two ways to define natural numbers in set theory:  
     - Encoding A: 0 is the empty set; the successor of n is n ∪ {n}.  
     - Encoding B: 0 is the empty set; the successor of n is {n}.  
     Both encodings allow proving the same theorems about natural numbers. Is one of these the "real" definition of natural numbers?  
     (a) Yes, one is genuinely correct.  
     (b) No, they are equally valid representations.  

  2. **Undecidable Arithmetic Sentence**:  
     Suppose we have a consistent set of axioms for arithmetic. There exists a sentence S that can be neither proven nor disproven from these axioms. Is S either true or false (even if we can’t determine which)?  
     (a) Yes, it must be true or false.  
     (b) No, it is neither true nor false.  

  3. **Continuum Hypothesis (CH)**:  
     CH claims there is no infinity strictly between the sizes of the natural numbers and the real numbers. CH is independent of standard set theory axioms (ZFC), meaning it can’t be proven or refuted from them. Is CH either true or false?  
     (a) Yes, it is true or false independently of proof.  
     (b) No, it is neither true nor false.  

  4. **Unsurveyable Machine Proof**:  
     A mathematical statement has a proof that is too long for any human to survey (e.g., billions of steps), but it is verified by a trusted computer program. Does this establish the statement as *true*?  
     (a) Yes, the proof makes it true.  
     (b) No, it only shows the statement is derivable from the axioms.  

  5. **Unrun Computation**:  
     A specific computation (e.g., checking a cryptographic hash) is guaranteed to terminate in 10 minutes on a supercomputer but will never be run. The claim is: "This computation outputs ‘yes’." Is this claim now true or false?  
     (a) Yes, it is true or false right now.  
     (b) No, it lacks a truth value until run.  

  6. **Mistake in Arithmetic**:  
     A student calculates 7 × 8 as 54. What makes this wrong?  
     (a) It violates the rules of arithmetic we’ve established.  
     (b) It fails to match what happens when counting physical objects (e.g., 7 groups of 8 items yield 56).  
     (c) Both (a) and (b) are required to explain the mistake.  

  7. **Civilization Without Multiplication**:  
     A civilization uses arithmetic with only addition/subtraction, no multiplication. In their context, is the statement "7 × 8 = 56" true?  
     (a) Yes, it remains a fact independent of their practices.  
     (b) No, it’s meaningless or false for them due to their language.  
     (c) It is true for us but neither true nor false for them.  

  8. **Truth in Mathematics**:  
     What primarily makes a mathematical statement true?  
     (a) We have a formal proof.  
     (b) It describes how abstract objects (e.g., numbers) actually are.  
     (c) It coheres with mathematical practice (e.g., consistency, utility).  

  9. **Truth Beyond Knowledge**:  
     "Even if we could never know whether CH is true, it might still be true." Do you agree?  
     (a) Agree.  
     (b) Disagree.  

  10. **Substantiveness of Dispute**:  
      The debate over whether mathematical truth depends on proof vs. abstract objects is:  
      (a) Substantive (about reality).  
      (b) Merely verbal (about the word "true").  
      (c) Genuine but unresolvable (not verbal, but no answer exists).  

  11. **Normativity Without Science**:  
      If mathematical objects (e.g., numbers) didn’t exist, would it still be a mistake to claim 7 × 8 = 54?  
      (a) Yes, arithmetic rules are binding regardless.  
      (b) No, without objects, nothing is "in error."  

  ---

  ### Scoring Key and Decision Tree  
  **Tree Root**: Normativity of mathematical correctness (Q6/Q11). This root emphasizes the source of mathematical "oughts" (e.g., why 7×8≠54) and hides direct questions about abstract objects to avoid priming.  

  **Leaves** (6 positions) based on answer patterns:  
  1. **Object-Driven Realism** (Robust Realism)  
     - Commitments: Undecidable sentences have truth values (Q2a, Q3a). Truth is explained by abstract objects (Q8b). One encoding of naturals is "real" (Q1a). Truth is independent of knowledge (Q9a). The dispute is substantive (Q10a).  
     - Awkward commitment: Must defend a unique "correct" encoding despite equivalent practical outcomes.  
     - Key answers: Q1a, Q2a, Q3a, Q8b, Q9a, Q10a.  

  2. **Structure-Driven Realism** (Structuralism)  
