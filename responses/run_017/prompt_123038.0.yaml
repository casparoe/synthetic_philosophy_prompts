  2. **Undecidable Sentence (Determinacy)**: Suppose we have a consistent set of axioms for arithmetic. Let S be a sentence that, given these axioms, can be neither proven nor disproven. Do you think that S is either true or false (even if we don't know which), or is it neither true nor false? (Options: True or false, Neither)

  3. **Continuum Hypothesis (Determinacy in Set Theory)**: The continuum hypothesis (CH) states that there is no set whose size is strictly between that of the natural numbers and that of the real numbers. It has been shown that CH is independent of the standard axioms of set theory (ZFC). Do you think that CH is either true or false (but we don't know which), or is it neither true nor false? (Options: True or false, Neither)

  4. **Machine-Checked Proof (Truth vs. Proof)**: Imagine a proof of a mathematical statement that is so long that no human could ever read it in full, but it has been verified by a trusted computer program. Do you think that this proof establishes the truth of the statement, or does it only establish that the statement is provable in the given system? (Options: Establishes truth, Only establishes provability)

  5. **Computation Claim (Truth Value of Unrun Computation)**: Consider a specific, very long computation that would output either "yes" or "no" if run, and that we know it would terminate in a finite amount of time (say, a week on a supercomputer) but no one will ever actually run it. The claim is: "This computation outputs 'yes'." Do you think this claim is now either true or false, or is it neither? (Options: True or false, Neither)

