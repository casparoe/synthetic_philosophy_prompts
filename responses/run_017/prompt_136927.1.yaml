prompt: |-
  I'm a staff engineer at a company with around two hundred engineers, and I chair the small group that owns our code-review standards. I have no philosophy training, so please define terms as you go. I came across the reductionism versus anti-reductionism debate about testimony while trying to work out why our reviewers keep getting something wrong, and I'd like to turn it into a procedure my team can actually run.

  The problem first. Reviewers routinely accept claims made in a pull request without checking them: that the platform team confirmed a new rate limit, that nothing else calls the endpoint being changed, that a dependency upgrade is backwards compatible, that someone tested it against representative data. Almost always that is fine, and the cost of checking would be absurd. Occasionally it is not: last quarter we shipped a change on the strength of a claim about a throughput limit that was out by a factor of ten, and the post-incident review concluded that no one had done anything wrong — which seems to me to mean that our standard has no content.

  My understanding of the two positions, which you should correct if it is a caricature: the reductionist treats a speaker's say-so as justified only by other things — my evidence that this person is reliable, or reliable about this kind of thing — so that testimony is never an independent source of justification; the anti-reductionist treats being told something as itself enough, by default, defeated only by specific reasons for doubt in the particular case. If that framing is wrong, or if the real dispute is somewhere else, start by fixing it.

  What I want is a decision procedure: five minutes, one page, runnable by a new graduate who has never heard of epistemology, applied by a reviewer to any claim they are being asked to accept rather than verify. For each step, say what counts as a sufficient answer. Mark where the procedure stops with "verify before merge", and where it hands the question to a person because it is really a values call about how much latency we will trade for how much assurance. Say what gets recorded in the pull request when a reviewer defers. Assume the reviewer is the only sign-off for most changes, and the tech lead only for escalations.

  Five features of our setting are the reason I am asking rather than reading up on it myself, and the procedure has to handle them:

  1. Generated text. A growing share of our pull request descriptions, migration notes and review comments were written, in whole or part, by a language model. There is no speaker: nobody intends to tell me anything, nobody is staking their credibility or offering a follow-up, and there is no track record that means anything. Does either theory have anything to say about relying on text like that, or is the debate built for a case with a person at both ends and simply silent here? If it is silent, say so, and say what the procedure should do at that point instead.
  2. Transmission chains. A claim that started as a message in a chat thread, was summarised into a ticket, and arrived with me as one line in a design document. Does each link count as a fresh act of testimony, and does the answer change if one of the links was automated?
  3. Negative and universal claims. No other service calls this. I have checked all the call sites. Sampling does not confirm these, and exhaustively checking them is precisely the expensive thing we are trying to avoid.
  4. Stake and independence. The author of a change wants it merged and is reporting a result about their own work. Whatever the general answer about trusting colleagues, I suspect this case is special, and I want the procedure to say so if it is.
  5. Cost symmetry. Not checking is usually free and occasionally catastrophic; checking is always paid for in senior-engineer time, and in what it does to a team when people are visibly not believed. I would like both costs treated as inputs to the procedure, not with verification quietly modelled as free.

  One observation of my own that may or may not be relevant: some of the claims we accept arrive with someone visibly taking responsibility for them — I will put my name to this, ask me if it turns out to be false — while others are just sentences in a document with a name attached. The first kind feels different to rely on in a way that track records and base rates do not capture. Is that distinction doing any real work in the philosophy, or is it sentiment?

  Please then run the finished procedure on three claims: a teammate I trust saying in a pull request that a feature flag is already disabled in staging, where verifying takes ninety seconds; a language-model-generated release note asserting that a major dependency upgrade is backwards compatible; and a comment left in the code in 2021 by someone who has since left the company, saying that a retry path is safe to remove. At least one of these should come out as "you cannot accept this on testimony, and no amount of interpersonal trust repairs it" — if that is where the procedure lands I need to see it stated plainly, even though it will slow us down and some colleagues will read it as an accusation.

  Two final things about how I want the answer pitched. First, I cannot chase references from a build machine and I have no library access, so please do not give me a reading list or point me at papers; make the arguments and let me use them. Second, and this is the part I care most about: I need to know which steps are things that anyone working on testimony would accept, and which are one side of a live dispute. Flag them separately, and do not let me ship a one-page standard that quietly commits us to one side of an argument I am not able to evaluate. If the two theories turn out to converge on the same advice for someone in my position, say that plainly rather than manufacturing a difference. And tell me what the procedure cannot do — the failure modes to expect once people start applying it mechanically or shaping their claims to fit it.
reasoning: |-
  Okay, let me unpack this. The user is a staff engineer dealing with code review reliability issues. They've encountered epistemology concepts but need practical implementation. 

  First, I need to diagnose their core problem: reviewers accept unverified claims that sometimes cause major incidents. The philosophical framing is interesting but secondary - what they really need is a foolproof decision procedure that accounts for their five special constraints (generated text, transmission chains, etc). 

  The reductionism vs anti-reductionism debate matters only insofar as it affects the procedure's design. I notice the user is particularly concerned about:
  - Not taking sides in unresolved philosophical debates
  - Handling LLM-generated content where traditional testimony concepts break down
  - Accounting for organizational costs beyond verification time

  Hmm... their observation about "visible responsibility-taking" is astute. That's actually touching on the distinction between testimony and mere assertion in epistemology. Need to incorporate that. 

  For the decision procedure, I'm considering a flowchart-like approach with explicit verification triggers. Key challenges:
  - How to quantify "cost symmetry" without complex calculations
  - Whether to treat LLM output as radioactive or gradable
  - How to handle negative claims without mandating impossible verification

  The three test cases are perfect stress tests. That 2021 comment from a departed colleague will likely be the "verify always" case - shows why the procedure must sometimes reject testimony. 

  Biggest risk is creating a process that's either too lax (repeating current failures) or too strict (creating bureaucratic overhead). Need clear "when in doubt" defaults and escape valves for judgment calls. Should explicitly mark which steps are philosophically contested versus consensus.

  For the LLM question: since testimony theory assumes human speakers, we'll need to invent a new category. Probably treat it as low-reliability testimony unless human-backed. The transmission chain issue suggests we need a "freshness" factor too. 

  The negative claims paradox is tricky. Maybe frame it as: "can the claim be falsified more cheaply than verified?" If yes, consider spot checks. If no, require stronger backing. 

  Stake and independence feels like it should trigger automatic verification - that's probably the least controversial adjustment. 

  Final procedure must fit on one page, use engineering terminology, and survive mechanical application by junior staff. No philosophy jargon allowed. Should explicitly call out its own failure modes like "gaming the claim phrasing".
answer: |-
  Here's a practical decision procedure for testimony evaluation in code reviews, designed for your constraints. Philosophical terms are avoided; contested steps are flagged as **[Disputed]**.

  ---

  ### **Testimony Evaluation Procedure (v1.0)**
  *For any claim in a PR you are asked to accept without verification*  
  **Time budget:** ≤5 min/claim | **Output:** "ACCEPT," "DEFER to TL," or "VERIFY"  

  #### **Step 1: Source Identification**  
  *What produced this claim?*  
  - **Human author** (named engineer/team): Proceed to Step 2.  
  - **Generated text** (LLM/bot) or **Unattributed source**: Skip to Step 5.  
  - **Legacy artifact** (old comments/docs): Proceed to Step 2, but note: *"Source may lack context/stake"*.  

  #### **Step 2: Source Trust Assessment**  
  *Is there a track record?*  
  - **High trust** (e.g., 5+ correct claims from this source in past 6mo): Proceed to Step 3.  
  - **Low/unknown trust** OR **Source is the PR author**: **[Disputed: Anti-reductionists may skip this]** → Proceed to Step 4.  
  - **Source departed/unavailable**: → **VERIFY** (no recourse if false).  

  #### **Step 3: Claim Plausibility Check**  
  *Does this contradict known facts?*  
  - **Consistent with system behavior/docs**: Proceed to Step 4.  
  - **Conflicts with logs, metrics, or code**: → **VERIFY** (high risk of error).  
  - **Universal/negative claim** (e.g., "nothing else calls this"): → Proceed to Step 4 *but flag as "high-cost if false"*.  

  #### **Step 4: Stake & Independence**  
  *Is the source incentivized?*  
  - **Neutral party** (e.g., platform team confirming a limit): Proceed to Step 5.  
  - **PR author/team** (claim about their own work): **[Disputed: Reductionists require verification here]** → **Weigh cost of falsehood** (Step 5).  
  - **Claim includes explicit ownership** (e.g., "I tested this"): → Discount stake by 50% (ownership raises accountability).  

  #### **Step 5: Cost-Benefit Triage**  
  *Balance risk vs. verification cost:*  

  | **Cost if FALSE** | **Verification Cost** | **Action** |
  |-------------------|------------------------|------------|
  | Low (e.g., typo)  | Any                    | **ACCEPT** |
  | Medium (e.g., perf degradation) | ≤15 min  | **VERIFY** |
  | **High** (e.g., outage/data loss) | **Any** | **VERIFY** |
  | Medium/High       | High (>30 min)         | **DEFER to TL** *(Escalate for risk assessment)* |

  **Key Inputs:**  
  - **Cost if FALSE**: Estimate based on impact (latency, $, user trust).  
  - **Verification Cost**: Senior-engineer minutes + morale cost (e.g., 10 min verification = 1.0 cost; add 0.5 if team tensions exist).  

  #### **Special Rules**  
  - **Generated Text**: Treat as **"low-trust source"** (Step 2). *Requires human backing for high-cost claims*.  
  - **Transmission Chains**: **Each automated link reduces trust by one level** (e.g., Slack → LLM-summary → PR = 2 reductions).  
  - **Negative Claims**: *No automatic verification*, but if **cost if false ≥ medium** → **VERIFY** or **spot-check** (e.g., sample 3 call sites).  

  **If DEFER:** Tag TL in PR with: *"Unverified high-cost claim: [quote]. Risk: [low/med/high], Verification: [time estimate]."*  
  **If VERIFY:** Block merge until evidence is added (e.g., logs, test IDs).  

  ---

  ### **Philosophical Conflicts & Limitations**  
  - **Reductionism vs. Anti-reductionism**:  
    - **Step 2 (Trust)**: Reductionists require it; anti-reductionists see testimony as default-valid. **[Disputed]**  
    - **Step 4 (Stake)**: Reductionists mandate extra scrutiny for involved parties. **[Disputed]**  
    - *Your procedure splits the difference: Trust shortcuts evaluation but is overridden by cost/risk.*  
  - **Generated Text**: *Philosophy is silent* (assumes human intent). Procedure treats it as low-trust to avoid "no speaker" loophole.  
  - **Failure Modes**:  
    - Engineers may game claims (e.g., "Platform team (via LLM) said..." → obscure low trust).  
    - Junior reviewers may oversimplify cost estimates.  
    - "Ownership theater" (engineers adding "I confirm" to bypass scrutiny).  

  ---

  ### **Test Cases**  
  1. **Teammate: "Feature flag disabled in staging"**  
     - Source: Human (trusted).  
     - Plausibility: Consistent (if flags are managed rigorously).  
     - Stake: PR author → higher scrutiny.  
     - Cost if false: Low (likely caught in staging).  
     - Verification cost: Low (90s).  
     → **VERIFY** (Low cost + author stake. *Anti-reductionists may disagree*).  

  2. **LLM Release Note: "Dependency upgrade backwards-compatible"**  
     - Source: Generated → Low trust.  
     - Plausibility: Unverifiable without changelog.  
     - Cost if false: High (outage risk).  
     → **VERIFY** (No shortcut for high-risk generated claims).  

  3. **2011 Comment: "Retry path safe to remove"**  
     - Source: Human (departed) → Unavailable.  
     - Plausibility: Unknown (code may have changed).  
     - Cost if false: High (data loss).  
     → **VERIFY** (No recourse if false + high cost).  

  --- 

  ### **Why This Works**  
  - **Balances epistemology**: Uses trust where philosophy agrees (e.g., departed sources), defaults to cost/risk where theories clash.  
  - **Handles your constraints**: Explicit rules for LLMs, transmission decay, and negative claims.  
  - **Documents DEFERs**: Creates audit trail for TL review.  
  - **Forces explicit risk-taking**: "ACCEPT" requires low cost-if-false; everything else demands verification or escalation.  

  **Implement this verbatim.** The only "mandatory philosophy" is that testimony isn't magic—it dissolves under high stakes or low trust. Disputed steps are flagged; adjust if your team values speed over caution (e.g., let anti-reductionists skip Step 2).
