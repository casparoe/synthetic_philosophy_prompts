  ### Interactive Chart: Varieties of Two-Dimensionalism  
  *Start here. Answer each question based on your intuitive judgments about the cases. Work downward—each answer leads to the next node or a final verdict.*

  1. **Are there two distinct ways an utterance's truth depends on the world: one for how it depends on which world is actual, and another for how it depends on counterfactual circumstances?**  
     - **A: Yes** → Go to 2  
     - **B: No** → Leaf 1: Direct Reference Rejection  

  2. **In a world where XYZ plays the watery role, the stipulation "let 'zembla' denote what plays the watery role here, but H₂O if it isn't" yields:**  
     - **A: "Zembla" denotes H₂O** → Go to 3  
     - **B: "Zembla" denotes XYZ** → Go to 4  

  3. **Can armchair reasoning rule out all scenarios where (e.g.) water isn't H₂O?**  
     - **A: Yes** → Go to 5  
     - **B: No** → Go to 6  

  4. **Is "water is the stuff that *actually* plays the watery role" knowable from the armchair?**  
     - **A: Yes** → Go to 7  
     - **B: No** → Go to 8  

  5. **In the sealed lab, can the researcher know "the sample is boiling now" is true on her evidence alone?**  
     - **A: Yes** → Leaf 2: Indexical Contextualism  
     - **B: No** → Leaf 3: Rigidified Descriptivism  

  6. **Does the two-dimensional framework *explain* (not just redescribe) facts about apriority and necessity?**  
     - **A: Yes** → Leaf 4: Epistemic Two-Dimensionalism  
     - **B: No** → Leaf 5: Deflationary Two-Dimensionalism  

  7. **In the drift scenario, is there a precise link where "water" stops denoting H₂O?**  
     - **A: Yes** → Leaf 6: Unnamed (Metasemantic Precision)  
     - **B: No** → Leaf 7: Metasemantic Two-Dimensionalism  

  8. **Is the framework's primary purpose to explain apriority/necessity (not just context-dependence)?**  
     - **A: Yes** → Leaf 8: Unnamed (Explanatory Dualism)  
     - **B: No** → Leaf 9: Indexical Two-Dimensionalism  

  ---

  ### Leaf Verdicts  
  *Each leaf includes: (1) View name, (2) Steelman (strongest point), (3) Awkward commitment, (4) Path (bitstring).*

  1. **Direct Reference Rejection** (e.g., Soames)  
     - **Steelman**: Avoids overcomplicating semantics by rejecting unnecessary machinery.  
     - **Awkward commitment**: Must deny that "I am here now"-type truths are contingent yet armchair-knowable.  
     - **Path**: 7B  

  2. **Indexical Contextualism** (e.g., Kaplan)  
     - **Steelman**: Elegantly handles indexicals and context-dependence without epistemic inflation.  
     - **Awkward commitment**: Cannot ground armchair knowledge of contingent truths (e.g., the lab case).  
     - **Path**: 7A → 2A → 3A → 5A  

  3. **Rigidified Descriptivism**  
     - **Steelman**: Preserves Kripkean rigidity while accommodating reference-fixing descriptions.  
     - **Awkward commitment**: "Zembla is H₂O" is knowable from the armchair only if the actual world is presupposed.  
     - **Path**: 7A → 2A → 3A → 5B  

  4. **Epistemic Two-Dimensionalism** (e.g., Chalmers)  
     - **Steelman**: Explains how armchair reasoning accesses modal space, even for necessary a posteriori truths.  
     - **Awkward commitment**: Armchair-accessible scenarios include metaphysically impossible worlds.  
     - **Path**: 7A → 2A → 3B → 6A  

  5. **Deflationary Two-Dimensionalism**  
     - **Steelman**: Captures linguistic patterns without substantive metaphysical/epistemic conclusions.  
     - **Awkward commitment**: Struggles to explain *why* the two-dimensional structure exists.  
     - **Path**: 7A → 2A → 3B → 6B  

  6. **Unnamed (Metasemantic Precision)**  
     - **Steelman**: Reference is always determinate, avoiding vagueness in communication.  
     - **Awkward commitment**: Posits unknowable cutoffs in gradual-change cases (e.g., drift).  
     - **Path**: 7A → 2B → 4A → 7A  

  7. **Metasemantic Two-Dimensionalism** (e.g., Stalnaker)  
     - **Steelman**: Clarifies how contexts fix reference, resolving communicative puzzles.  
     - **Awkward commitment**: Cannot pinpoint reference shifts in gradual-change cases (drift) and calls this a feature.  
     - **Path**: 7A → 2B → 4A → 7B  

  8. **Unnamed (Explanatory Dualism)**  
     - **Steelman**: Unifies apriority and necessity without centering or impossible worlds.  
     - **Awkward commitment**: "Water is the actual watery role-player" is armchair-knowable, but this feels empirical.  
     - **Path**: 7A → 2B → 4B → 8A  

  9. **Indexical Two-Dimensionalism**  
     - **Steelman**: Extends indexical semantics to natural kinds, preserving actual-world rigidity.  
     - **Awkward commitment**: Treats "water" as indexical, unlike paradigm indexicals ("I", "now").  
     - **Path**: 7A → 2B → 4B → 8B  

  ---

  ### Unreached Verdict Combinations  
  *These paths were excluded for the following reasons:*

  - **7A → 2A → 3B → 6A → [3,5,etc.]**: *Incoherent*. Armchair-knowing the lab case (5A) requires centered worlds, but node 3B rejects them.  
  - **7A → 2B → 4A → [6,8]**: *Stable but unattractive*. Accepts impossible scenarios (4A) but denies apriority for "water" (6B) or the framework's purpose (8B), yielding a view that is internally consistent but explanatorily weak.  
  - **7A → 2A → 3A → [6, etc.]**: *Unexplored*. Would require a view where armchair knowledge excludes impossible scenarios (3A) but "zembla" is world-relative (2A), yet no major theory occupies this niche. Such a view might treat reference-fixers as both rigid and re-evaluated.  

  ---

  ### Ambiguous Leaves & Extra Question  
  *The tree cannot separate:*

  - **Leaf 7 (Stalnaker-style) and Leaf 9 (Indexical Two-Dimensionalism)** agree on all nodes. They diverge on whether the framework is *metasemantic* (explains reference-fixing) or *semantic* (explains meaning).  
  - **Extra question to separate them**: "In a world where English speakers use 'water' with identical practices but XYZ is actual, does 'water' refer to XYZ?"  
    - A: Yes → Indexical Two-Dimensionalism (semantic)  
    - B: No → Metasemantic Two-Dimensionalism (metasemantic)  

