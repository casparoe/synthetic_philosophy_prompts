  - **Path to Chalmers (Leaf 4)**: Via rejecting armchair exclusion of impossible scenarios (3B) and affirming explanatory power (6A).  
  - **Path to Stalnaker (Leaf 7)**: Via world-relative "zembla" (2B), rejecting impossible scenarios (4A), and denying drift cutoffs (7B).  
  - **Path to Kaplan (Leaf 2)**: Via rigid "zembla" (2A), armchair exclusion of impossible scenarios (3A), and affirming the lab case (5A).  
  - **Soames (Leaf 1)**: Isolated by rejecting two dimensions outright (7B).  
  - **Deflationary view (Leaf 5)**: Captures readers who accept the apparatus but see it as non-explanatory.  

