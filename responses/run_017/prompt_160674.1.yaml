prompt: |-
  i'm four drafts into a novel set on a planet that isn't Earth and there's one scene I keep flubbing, and I think it's because I don't actually know what the argument is about, so I end up making one character a strawman.

  The setup: my field biologist, Dass, has done two seasons on a colonial glider called a harrin. The whole clade is soft-bodied, so there are no fossils, none, and Dass can't do lab manipulations out there. Harrin grow a big keel on the underside — the "rasp" — on only one of the colony's three morphs. It's expensive to grow. It's rigid because it's mineralised, and the hollow inside is there because of how it's built: the thing is inflated with gas and then hardened, so the chamber is an architectural leftover of the building method. In the aquatic juvenile stage that same chamber works as a float. In the adult, the keel resonates when the morph glides and makes a low sound, and Dass has decent data that bigger-keeled colonies fledge more young — partly because the sound seems to coordinate hunting, partly because it startles prey into the net-glides. Related species have keels of every size and Dass can find no clean match between keel size and anything ecological she can measure. Her colleague Fenn is a Gould–Lewontin style sceptic and thinks "it's an adaptation for X" is a just-so story with a number taped to it.

  Here's the thing: I get to stipulate the actual history, because I invented the world. What I want from you first is the spec, not the verdict.

  What does a theory have to deliver before a claim like "the rasp is an adaptation for X" is in good standing? Give me the requirement list, with the case or consideration behind each one — the distinctions it has to be able to draw and not collapse (adaptation, exaptation, architectural by-product of a developmental constraint, trait currently maintained by selection but not originally selected for, trait drifted up and later co-opted, trait good for the colony rather than its bearer), whether "adaptation" is a historical claim about a token lineage or a forward-looking claim about current fitness contribution and whether one trait can be an adaptation under one of those and not the other, what kinds of evidence are admissible and which ones become non-negotiable when the usual channels are closed (no fossils, no clean comparative spread, no experimental manipulation), what separates a testable adaptationist hypothesis from a story, how much optimality you're allowed to demand and what happens to costly or locally suboptimal traits, how finely the trait itself gets individuated and what you do when it has more than one current function, and whose fitness is even in question when the bearer is one morph of a colony.

  Then the parts I actually care about: which of those requirements are real desiderata and which are just the prejudices of one camp; whether some subset can't be satisfied together (if the list turns out to be jointly unsatisfiable, say so plainly, that's the most useful thing you could tell me); which single requirement does the most work in knocking out candidate theories; and which requirements are negotiable given my purpose, which is narrower than a journal's — I need the standard that makes both Dass and Fenn reasonable people arguing well from the evidence available in a field camp, not the standard for publishing. A short scorecard at the end for the reverse-engineering/optimism style, the Gould–Lewontin style, and whatever third option you think belongs on it, but keep the weight on the criteria, the scoring is the part I can fake.

  Last thing, the novelist's question: if I want the disagreement to be a genuine stalemate rather than Fenn being pig-headed, which bits of the rasp's real history should I stipulate?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a novelist working on a sci-fi story set on a non-Earth planet, struggling with a scene where two characters argue about evolutionary biology. The biologist, Dass, believes a trait (the rasp) is an adaptation, while her colleague Fenn is skeptical. The user wants to make their argument scientifically plausible without strawmanning either character.

  First, I need to recall the key concepts in evolutionary biology regarding adaptations. The user mentioned Gould and Lewontin, who criticized "just-so stories," so I should consider the Spandrels paper. The main points are distinguishing adaptation from exaptation, by-products, etc. The user listed several specific distinctions they need: historical vs. current function, developmental constraints, group vs. individual selection, etc.

  The user's explicit request is for a list of criteria that a theory must meet to claim something is an adaptation. But deeper, they need this argument to feel authentic and unresolved. They want both characters to have valid points, creating tension without one being wrong. So the criteria should highlight where ambiguities arise, especially given the story's constraints: no fossils, no lab work, limited species comparison.

  Breaking down the requirements: Historical origin vs. current function is crucial. A trait could be an adaptation now but originated differently. Also, current utility doesn't prove historical selection. Then there's trait individuation—how to define the rasp. Is it the keel's size, the resonance, the chamber? Each might have different evolutionary paths.

  Fitness benefits need specification: whose fitness? The colony or the individual morph? Since the rasp is on one morph but benefits the colony, that's a point of contention. Dass might argue group selection, while Fenn could counter with individual-level benefits or by-products.

  Evidence-wise, without fossils or experiments, Dass relies on correlations (bigger keel, more young). But correlation isn't causation. Fenn would point out alternative explanations: maybe keel size correlates with colony health, not directly causing success. Or maybe the chamber's primary function was buoyancy, now co-opted for sound.

  Developmental constraints are key. The chamber's hollow structure is a by-product of inflation. Fenn might argue it's just an architectural constraint, not selected for resonance. Dass could counter that selection refined it for sound later.

  The user also needs to know which criteria are essential and which are contentious. For example, historical origin might be debated—some biologists focus on current utility. This ambiguity lets both characters be right in different ways. Also, without fossils, establishing history is hard, so Fenn's skepticism is valid.

  For the stalemate, the rasp's history should have elements supporting both views. Maybe the chamber originated for buoyancy (by-product), then was exapted for sound, and now is maintained by selection. Dass focuses on current adaptation, Fenn on historical contingency. Both have evidence: Dass has fitness correlations; Fenn points to developmental constraints and lack of fossil record.

  The user's deeper need is narrative tension. The argument shouldn't be resolvable with current data. So the criteria should highlight where evidence is ambiguous. For instance, trait individuation: if the rasp's current function is multifaceted, it's hard to pinpoint selection targets. Also, without experiments, controlling variables is impossible, leaving room for doubt.

  I should structure the response around the key distinctions, explaining each criterion's importance and how it applies to the rasp. Then outline where Dass and Fenn might each have valid points based on the evidence available. Finally, suggest a backstory for the rasp that supports both perspectives, making the stalemate believable.
answer: |-
  Here's a breakdown of the requirements for establishing "the rasp is an adaptation for X," designed for your narrative conflict, highlighting the core distinctions and inherent tensions:

  **The Requirement List: What "Adaptation for X" Must Deliver**

  1.  **Specificity of Function (X):**
      *   **Distinction:** Must clearly define *what* specific selective pressure(s) X addresses (e.g., hunting coordination, startling prey, mate attraction within the colony). Avoids vague claims like "for survival."
      *   **Case:** "Adaptation for flight" is too broad; "adaptation for generating low-frequency resonance during gliding to startle prey" is specific. The trait itself (the rasp's resonance) must plausibly contribute to X.
      *   **Challenge:** The rasp might contribute to *multiple* functions (hunting coordination, prey startle, buoyancy in juveniles). Which one is *the* adaptation? Or can it be an adaptation for multiple things? (See #8).

  2.  **Current Utility & Fitness Contribution:**
      *   **Distinction:** Must demonstrate that the trait *currently* provides a fitness advantage *related to X* in the *current* environment. This is the *forward-looking* perspective.
      *   **Case:** Dass's data showing bigger keels fledge more young strongly suggests *current* utility. The link to X (hunting coordination/prey startle) needs empirical support (e.g., colonies with damaged rasps hunt less effectively).
      *   **Non-Negotiable (Field Camp):** This is often the *minimum* bar for a plausible adaptationist hypothesis in the field, especially without historical data. Dass's data hits this.

  3.  **Historical Origin (Selection for X):**
      *   **Distinction:** Must provide evidence (or a strong inference) that the trait *arose or was significantly modified* due to natural selection *specifically for X*. This is the *historical* perspective. Separates *adaptation* (selected *for* X) from *exaptation* (co-opted *later* for X) or a *by-product* (never selected for X).
      *   **Case:** Did selection favor variations in rasp *size/resonance* specifically for its acoustic properties in adults? Or did selection favor the chamber for buoyancy in juveniles, and the sound is an incidental effect? Or was the hollow structure a developmental constraint, and resonance is pure exaptation?
      *   **Challenge (Field Camp):** This is Fenn's main battleground. Without fossils or detailed phylogeny, inferring historical selection is *incredibly hard*. Dass's comparative data (no clean ecological match) *weakens* the historical argument for any *single* X.

  4.  **Current Maintenance by Selection:**
      *   **Distinction:** Must show the trait is *currently* maintained in the population *because* it provides the fitness advantage related to X. Separates traits under *current* selection from vestigial traits or those maintained for other reasons. Can overlap with #2, but distinct from #3.
      *   **Case:** Even if the rasp originated for buoyancy (exaptation), is selection *now* acting on its size/shape specifically *for* its acoustic properties? Dass's fitness correlation suggests this is plausible, but doesn't prove the *target* of selection is the sound.

  5.  **Exclusion of Alternatives (Crucial for Fenn's Skepticism):**
      *   **Distinction:** Must demonstrate that the trait's form and prevalence are *better explained* by selection for X than by:
          *   **Phylogenetic Constraint:** It's just the way the clade builds things (developmental constraint/architectural by-product).
          *   **Genetic Drift:** Random fixation.
          *   **Pleiotropy/Correlation:** It's linked to another trait *actually* under selection.
          *   **Exaptation:** It arose for reason Y, is now used for X.
          *   **Non-adaptive By-product:** Pure consequence of development/physics (e.g., the hollow is just how you build an inflated rigid structure).
      *   **Case:** Fenn argues the hollow is an unavoidable architectural by-product of the inflation/hardening process (developmental constraint). The sound is incidental. The size variation might be drift or linked to overall colony size/health (pleiotropy). Dass's lack of clean comparative data weakens her ability to exclude these.

  6.  **Trait Individuation:**
      *   **Distinction:** Must define the *trait* under consideration precisely. Is it the *presence* of the keel? Its *size*? Its *resonant properties*? The *hollow chamber*? Selection acts on variations in *specific* aspects.
      *   **Case:** The *chamber* might be a developmental by-product. The *mineralisation* might be an adaptation for rigidity (for flight/structure, not sound). The *size/shape* might be an adaptation *for resonance*. Dass focuses on size/resonance; Fenn focuses on the chamber's origin.

  7.  **Level of Selection:**
      *   **Distinction:** Must specify whose fitness is increased: the individual morph bearing it? The entire colony? A gene? This is critical for colonial organisms.
      *   **Case:** The rasp is on one morph, but the benefit (hunting success, fledging young) accrues to the colony. Is selection acting on the morph, or the colony as a unit? If colony-level selection is weak, the rasp must benefit the *reproductive success* of *that specific morph type* within the colony context. Dass likely argues colony-level benefit; Fenn might argue it's unclear if the rasp-bearing morph itself gains a *differential* reproductive advantage within the colony.

  8.  **Handling Multiple Functions/Co-option:**
      *   **Distinction:** Can the trait be an adaptation *for multiple things*? How do you parse primary vs. secondary functions? How does co-option (exaptation) factor in?
      *   **Case:** The chamber was *essential* for buoyancy in juveniles (likely an adaptation or constraint for that stage). It *now* produces beneficial sound in adults. Is it now *also* an adaptation for sound? Was it *modified* for sound? Or is the sound just a lucky bonus? Dass sees the current benefit; Fenn sees the historical baggage.

  **Analysis: Desiderata, Prejudices, Tensions & Knockout Punches**

  1.  **Real Desiderata vs. Camp Prejudices:**
      *   **Desiderata (Core):** Specificity of Function (#1), Current Utility (#2), Exclusion of Alternatives (#5), Trait Individuation (#6), Level of Selection (#7). These are fundamental to rigorous evolutionary reasoning.
      *   **Potential Prejudices:** *Historical Origin (#3)* is critical for strict definitions of "adaptation," but some argue current utility/maintenance (#2/#4) is sufficient for many biological questions. *Optimality* is often a strawman; few serious biologists assume perfect optimality. Fenn's skepticism (Gould-Lewontin) rightly targets *premature assumption* of adaptation/history without testing alternatives (#5) and ignoring constraints (#5a). Dass's optimism might overemphasize current utility (#2) as proof of historical adaptation (#3).

  2.  **Joint Unsatisfiability & Tensions:**
      *   **The Core Tension:** Satisfying **Current Utility (#2)** and **Current Maintenance (#4)** is often achievable with field data (like Dass's). Satisfying **Historical Origin (#3)** rigorously is *extremely difficult without historical data (fossils, detailed phylogeny, experimental evolution)*. **Exclusion of Alternatives (#5)** is also very hard without manipulative experiments or a clear comparative framework. **In a field camp without fossils/manipulation, proving Historical Origin (#3) and rigorously Excluding Alternatives (#5) is often effectively impossible.** This is the heart of the stalemate.

  3.  **Knockout Requirement:**
      *   **Exclusion of Alternatives (#5)** does the most work in knocking down a specific "adaptation for X" claim. Fenn's strength is relentlessly asking "But couldn't it also be explained by... [Constraint/Drift/Pleiotropy/Exaptation]?" If Dass cannot convincingly counter these plausible alternatives with her limited data, her specific historical adaptation claim is weakened, even if current utility is evident.

  4.  **Negotiable for Field Camp/Novel:**
      *   **Rigorous Proof of Historical Origin (#3):** Unattainable. Focus shifts to plausibility based on current utility and inference.
      *   **Rigorous Exclusion of *All* Alternatives (#5):** Also unattainable. Focus is on the *relative plausibility* of the adaptationist hypothesis vs. the main competing alternatives (developmental constraint, exaptation) given available evidence.
      *   **Optimality:** Not required. Acknowledging it's costly but *net* beneficial is fine.
      *   **Level of Selection (#7):** Needs consideration, but precise resolution might be elusive. Acknowledge the ambiguity.
      *   **Focus for Plausibility:** Strong **Current Utility (#2)** data + a plausible mechanism linking trait form to function X + arguments for why major alternatives are *less likely* given the observations is sufficient for a reasonable field biologist like Dass to advocate for her hypothesis. Fenn is reasonable to point out the lack of proof for history and the viability of alternatives.

  **Short Scorecard: Perspectives**

  | Feature                | Reverse-Engineering/Optimism (Dass-ish)          | Gould-Lewontin Scepticism (Fenn-ish)             | Third Option: Current Utility Focus               |
  | :--------------------- | :----------------------------------------------- | :----------------------------------------------- | :------------------------------------------------ |
  | **Primary Focus**      | Current Function & Apparent Design               | Constraints, Alternatives, History             | **Current Fitness Contribution**                  |
  | **"Adaptation" Means** | Often implies Historical Origin + Current Use    | Strictly Historical Origin *for that function* | **Current Maintenance by Selection for X**        |
  | **Key Evidence**       | Functional Analysis, Fitness Correlations        | Developmental Biology, Phylogeny, Alternatives | **Fitness Consequences, Selection Gradients**     |
  | **Trait Individuation**| Focused on Apparent Function                     | Focused on Developmental Origin                | **Focused on Variable Under Selection**           |
  | **Strengths**          | Identifies likely selective agents               | Prevents Just-So Stories, Highlights Complexity | **Empirically testable in field, pragmatic**      |
  | **Weaknesses**         | Can conflate history & current use, ignore alt.  | Can undervalue functional analysis, seem negative | **Doesn't resolve historical origin questions** |
  | **Field Camp Viability**| **High (uses available data)**                   | **High (points out inherent limitations)**       | **High (focuses on testable now)**                |

  **The Novelist's Key: Stipulating History for Stalemate**

  To make the argument a **genuine stalemate** where both Dass and Fenn have strong, reasonable positions based on the *available evidence*, but neither can definitively prove their case about the *historical origin and exclusivity* of the rasp's function, stipulate this history:

  1.  **Origin: Developmental Constraint/By-Product.** The **hollow chamber** is fundamentally an *architectural by-product* of the most efficient developmental pathway for creating a large, rigid, lightweight keel structure via inflation and mineralization. This pathway was selected for in early ancestors **primarily for structural integrity during gliding and/or buoyancy control in aquatic juveniles.** The *hollow* itself wasn't directly selected for; it was a necessary consequence of the build method. *(Fenn is right about the chamber's fundamental origin being non-adaptive for sound, or even structural - the structure was selected, the hollow is baggage).*
  2.  **Exaptation & Refinement:** Once present, the hollow chamber had acoustic properties. In the specific lineage leading to the harrin, **variations in the *size, shape, and wall thickness* of the keel/chamber (influencing resonance) were *co-opted* (exapted) and subsequently *modified by natural selection* for their current role in producing low-frequency sound.** Selection acted on existing variation in these aspects to enhance the acoustic function. *(Dass is right that the *specific size and resonant properties* of the adult rasp *are now* adaptations for hunting coordination/prey startle. Selection is acting on it now for that purpose, modifying the initial by-product structure).*
  3.  **Current Function & Ambiguity:** The sound **does** significantly contribute to current fitness via hunting success (validating Dass's data). However, the keel's *size* might *also* be influenced by constraints related to its original structural/developmental role and overall colony size/health (pleiotropy). The *chamber's existence* remains a by-product. *(Both have points: Dass on current utility/acoustic adaptation of size/shape; Fenn on the chamber's origin as a constraint and the potential for other factors influencing size).*
  4.  **Comparative Data Hole:** The reason Dass finds no clean ecological match across related species is that the *exaptation and refinement for acoustic function* is a unique evolutionary event within the harrin lineage. Related species use the keel/chamber primarily for structure/buoyancy, or have co-opted it for different secondary functions (e.g., display), or simply have different constraints. *(Explains Dass's frustrating comparative data, supporting Fenn's point that simplistic adaptationist stories across species fail).*

  **Why this creates stalemate in the field camp:**

  *   **Dass's Strength:** She has strong evidence for **current utility (#2)** and **current maintenance (#4)** of the rasp's *size/resonance* for hunting success. The trait *looks* designed for it now, and selection *is* acting on it. Her hypothesis that "the rasp's size is an adaptation for resonance/hunting" **is supported by current function and fitness data.** She can argue the refinement phase makes it an adaptation *now*.
  *   **Fenn's Strength:** He can correctly argue that the **fundamental feature enabling the function (the hollow chamber) is a developmental by-product/constraint (#5a)**, not an adaptation for sound. The trait's *origin* wasn't for sound, it was co-opted (exaptation). He can point to the messy comparative data and the lack of any way to rule out that the size variation isn't still partly linked to the original structural/developmental constraints or overall colony fitness (#5 - alternatives). He insists calling it *solely* or *primarily* an "adaptation for sound" ignores its complex history and overstates the case.
  *   **Unresolvable:** They lack the tools to:
      *   Prove the *exact historical sequence* of exaptation and refinement (#3).
      *   Rigorously *exclude* that current size variations aren't still influenced by non-acoustic factors (#5).
      *   Precisely quantify how much of the trait's current form is due to historical constraint vs. recent selection for sound.
      *   Cleanly separate the "trait" – is Dass studying the adaptation (selected size/shape variations) or the exaptation (the co-opted chamber) or the by-product (the hollow itself)? (#6).

  This history makes Dass's functional interpretation valid and important, but Fenn's skepticism about over-simplified adaptationist narratives and the importance of constraints/exaptation equally valid and scientifically rigorous. Neither is a strawman; they're emphasizing different, equally crucial aspects of evolutionary biology that are inherently difficult to disentangle with limited data. The argument can rage on reasonably! Good luck with the scene!
