answer: |-
  ### The Pattern, Restated (~120 words)  
  You observe a disconnect in aquatic animal welfare standards within certification schemes. For salmon, operations implement veterinary health plans and treat bacterial outbreaks to prevent suffering, tracking population-level welfare metrics (mortality, FCR, oxygen, density). Yet at harvest, fish endure non-stunned slaughter via asphyxiation in ice slurry—a method illegal for mammals. Similarly, for shrimp, eyestalk ablation (crushing/cutting to induce spawning) is routine, despite emerging recognition of decapod sentience. This occurs while empirical research and legislation increasingly affirm fish/crustacean pain capacity. The inconsistency lies in preventing *some* suffering (disease) while inflicting others (slaughter/mutilation), using metrics that ignore individual experience. Your description is accurate, but underemphasizes how *economic practicality* shapes welfare priorities.  

  ### The Implicit Theory (~300 words)  
  The practices presuppose a **hierarchical, economically constrained welfare model** with five core tenets:  
  1. **"Preventable Suffering" Threshold**: Suffering is only actionable if it:  
     - (a) Threatens productivity (e.g., disease → mortality → profit loss),  
     - (b) Is "avoidable" within current industrial frameworks (treating bacteria is easier/cheaper than stunning salmon).  
     - *Thus: Disease is "preventable"; slaughter stress is "inevitable."*  
  2. **Welfare as Stock-Level Resilience**: Welfare is a *population attribute*, measured via biomarkers (oxygen, FCR) tied to survival/growth. Individual distress (e.g., panic during crowding) is irrelevant if the stock meets biomass targets. This mirrors livestock "herd health" models but ignores neurology (fish lack visible distress cues).  
  3. **Duration-Intensity Tradeoff**: Acute suffering (e.g., seconds-minutes of asphyxiation) is discounted against chronic welfare gains (months of disease prevention). Unlike mammals—where long-term confinement is policed—this prioritizes *duration* over *intensity* of suffering. Eyestalk ablation fits here: a brief, high-intensity act is tolerated for long-term breeding efficiency.  
  4. **Implicit Cost-Per-Unit-Suffering Calculus**: Stunning salmon is cost-prohibitive (~$0.10–0.30/kg extra) versus pig stunning ($0.01–0.05/kg). Eyestalk ablation is near-zero-cost. The unspoken threshold: suffering intervention must not disrupt sector competitiveness.  
  5. **Neurological Discounting**: Despite funding pain research, the model *operationally* treats fish/shrimp as lacking "meaningful" sentience. Laws acknowledging sentience are decoupled from practice via terms like "where practicable."  

  *Sentience is load-bearing*: If fish/shrimp were definitively non-sentient, the inconsistency vanishes. But since your assumption holds, the theory relies on *strategic ambiguity* about pain’s moral weight.  

  ### What It Strictly Needs vs. Merely Fits (~250 words)  
  **Strictly Needs**:  
  - A definition of welfare as **absence of production-limiting stressors** (disease, mortality), not positive states.  
  - **Population-level metrics**: Individual welfare is incoherent if the goal is biomass optimization.  
  - **Suffering classifications**: "Controllable" (disease) vs. "non-controllable" (slaughter).  
  - **Economic viability as a boundary condition**: Welfare measures cannot meaningfully raise costs.  

  **Merely Fits**:  
  - Denial of sentience: The model *accommodates* but doesn’t require it. One could acknowledge pain while deeming slaughter stress "necessary."  
  - Brief-life discount: While shrimp lives are short, the model doesn’t logically need this; it focuses on *procedural* suffering (ablation) vs. lifespan.  
  - Pure cost thresholds: The implicit exchange rate (#3) explains *why* stunning is rejected but isn’t foundational. The core is classifying suffering into "actionable" buckets.  

  The sick fish/healthy fish inconsistency is resolved by the "preventability" tenet: Disease threatens productivity *and* is solvable; slaughter is an "efficient endpoint." One consistent theory covers both: **Welfare = Mitigating Suffering That Threatens Output**.  

  ### Where It’s Underdetermined (~200 words)  
  Multiple theories could license these practices:  
  1. **Utilitarianism Lite**: Maximize net welfare *within* economic constraints. Stunning fails cost-benefit analysis; eyestalk ablation benefits overall production.  
  2. **Cultural Relativism**: "Humane" is defined by sector norms. Salmon slaughter isn’t "cruel" because it’s universal; eyestalk ablation is "standard practice."  
  3. **Epistemic Skepticism**: We can’t *prove* fish experience slaughter panic or shrimp feel ablation pain, so inaction is justified (despite funding research).  
  4. **Ecological Welfareism**: Focus on species-level health (stock metrics) over individuals—akin to wild fisheries management.  

  The current model is *underdetermined* because it doesn’t specify:  
  - Why duration outweighs intensity in suffering calculus.  
  - Why population metrics override individual welfare when sentience is presumed.  
  - Where the cost-per-suffering threshold lies.  

  ### What Would Actually Have to Change (~250 words)  
  To align practices with sentience science and ethical consistency:  
  1. **Shift to Individual Welfare Metrics**:  
     - Audit slaughter via individual indicators (e.g., aversive behavior, physiological stress markers).  
     - Track shrimp post-ablation outcomes (mortality, behavior) at individual levels.  
  2. **Redefine "Unavoidable Suffering"**:  
     - Mandate stunning for salmon (percussive/electrical) as done in Norway/Iceland.  
     - Ban non-therapeutic mutilations (eyestalk ablation); adopt LED-induced spawning.  
  3. **Certification Overhaul**:  
     - Weight slaughter welfare equally with husbandry in scoring.  
     - Require video audits of slaughter/ablation sites.  
  4. **Economic Realignment**:  
     - Subsidize stunning tech for SMEs; pass costs to consumers (e.g., "humane premium" labeling).  
  5. **Legal Harmonization**:  
     - Extend terrestrial slaughter laws to aquatic animals where sentience is recognized.  
     - Make ablation illegal under decapod protection laws.  

  **Barriers**: Industry resistance (costs), consumer apathy, and certification bodies’ reluctance to disrupt supply chains. Without binding regulations, economic logic dominates.  

  ### Bottom Line (~80 words)  
  The implicit theory reduces welfare to *productivity-aligned suffering mitigation*, valuing stock over individuals and cost over intensity. It presupposes that welfare is measurable only through population metrics, that "necessary" suffering is exempt from scrutiny, and that economic viability overrides ethical consistency. To resolve the disconnect, certification schemes must prioritize individual experience, redefine "necessity" (banning mutilations, requiring stunning), and absorb costs—or admit welfare is secondary to profit. The inconsistency isn’t philosophical but operational: welfare stops where profitability begins.  

  ---  
  *Key Insight*: This isn’t fundamentally a *scientific* question about sentience, but a *governance* failure to enforce ethical thresholds when economics conflict. Certification schemes codify this compromise.
