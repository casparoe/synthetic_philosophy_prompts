  ### The Kelly Criterion  
  **A Villanelle**  

  The many grow by the mean alone—  
  One player’s log (both ledger and base) is shown:  
  The one grows by the mean less half the variance.  

  Bet all each round? Ruin stands, set in stone.  
  The edge is yours, yet fortune’s wheel, once thrown,  
  The many grow by the mean alone—  

  But wager too timid, and wealth stalls, unknown;  
  Too greedy, and the seeds of loss are sown.  
  The one grows by the mean less half the variance.  

  At Kelly’s peak, the richest gains are known:  
  Half that stake, three fourths the rise; half again, same tone.  
  The many grow by the mean alone—  

  Past twice, growth drowns—not error’s mirror thrown.  
  The timid’s loss? A sigh; the bold’s? A groan.  
  The one grows by the mean less half the variance.  

  Asymptotic, log-bound—this truth is flown  
  For fixed horizons; risk-aversion’s throne.  
  The many grow by the mean alone—  

  Two questions part: what’s shared, what’s singly grown.  
  No victor here—just chance’s quiet zone.  
  The many grow by the mean alone.  
  The one grows by the mean less half the variance.  

  ---

  ### Explanation  
  - **Refrains**:  
    - *A (line 1, 6, 12, 18)*: "The many grow by the mean alone" (arithmetic mean growth for an ensemble).  
    - *B (line 3, 9, 15, 19)*: "The one grows by the mean less half the variance" (log growth for a single gambler, with "log" implied by the variance term in the Kelly formula: *g = μ - σ²/2*).  
    The pun on "log" (ledger/ logarithm) is embedded in "ledger and base" (line 2) and the variance-based refrain.  

  - **Key Points**:  
    - **Ruin** (line 4): Betting the entire bankroll ("Bet all each round") leads to certain ruin.  
    - **Kelly Fraction** (line 10-11): Growth rate peaks at Kelly fraction *f*; symmetry at half Kelly ("half that stake") and 1.5 Kelly ("half again") yields ¾ max growth.  
    - **Overbetting** (line 13): Growth turns negative past twice Kelly ("Past twice, growth drowns"), highlighting asymmetry (bold’s error ≠ timid’s).  
    - **Concession** (line 16-17): Kelly is asymptotic/log-utility-dependent; prudent bets suit finite horizons/risk aversion.  
    - **Final Quatrain** (lines 17-19): The gap between refrains represents distinct questions (ensemble vs. single gambler), without declaring a "winner."  

  - **Form**: Strict villanelle (19 lines, ABA ABA ABA ABA ABA ABAA) with iambic meter. The recurring refrains compound the poem’s meaning, mirroring compounded bets.
