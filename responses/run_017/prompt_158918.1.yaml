  **Diagnostic value of variants:**  
  - **Coin-tossed-after (Q3):** Cleanly isolates whether credence hinges on the coin’s *causal/temporal status* (thirder/temporalist: yes; halfers: no).  
  - **Duration (Q4):** Sharp test of whether probability tracks *temporal weight* (temporalist) or *centered possibilities* (thirder).  
