  **Decision Tree: Sleeping Beauty Problem Diagnostics**  
  *Answer each question based on intuition; don't worry about "correctness".*

  1. **In a variant where tails causes 1,000 awakenings (not 2), when Beauty awakens, is her credence in heads close to 0?**  
     - **A. Yes** → Go to Q3  
     - **B. No (it remains ~1/2)** → Go to Q2  

  2. **When Beauty is told "today is Monday," how does her credence in heads change?**  
     - **A. Increases** → **Meacham view** (see Leaf 1)  
     - **B. Unchanged** → **Double-Halfer** (see Leaf 2)  
     - **C. Decreases** → *Empty* (incoherent: no major view holds this)  

  3. **In a variant where the coin is tossed *after* all awakenings (on Tuesday night), on Monday, is Beauty’s credence in tails >1/2?**  
     - **A. Yes** → Go to Q4  
     - **B. No (it remains 1/2)** → *Inconsistent with A at Q1*  

  4. **In a variant where tails-Monday lasts 1 minute and tails-Tuesday lasts 5 hours, does duration affect her credence in heads upon awakening?**  
     - **A. Yes (longer awakenings increase tails confidence)** → **Temporalist** (see Leaf 3)  
     - **B. No** → Go to Q5  

  5. **In a variant where tails-awakenings are distinguishable (e.g., red/blue rooms), and Beauty sees a red room (known in advance as possible), does this imply credence in heads should be <1/2 *without* such features?**  
     - **A. Yes** → **Thirder** (see Leaf 4)  
     - **B. No** → *Empty* (incoherent: conflicts with Q1A)  

  ---

  **Leaf Positions & Commitments:**  
  - **Leaf 1: Meacham view**  
    - *Path:* Q1B → Q2A  
    - **Most awkward commitment:** Upon learning it’s Monday, credence in heads jumps to 2/3 without new evidence *for* heads.  
    - *Other nodes:* Assessment per-run (Q1 analog: B); long-run frequency irrelevant (Q8 analog: B); diachronic predictability (Q7 analog: A).  

  - **Leaf 2: Double-Halfer**  
    - *Path:* Q1B → Q2B  
    - **Most awkward commitment:** Credence in heads *remains* 1/2 even after learning it’s Monday (ruling out Tails-Tuesday).  
    - *Other nodes:* Assessment per-run (Q1 analog: B); long-run frequency irrelevant (Q8 analog: B); diachronic predictability (Q7 analog: A).  

  - **Leaf 3: Temporalist**  
    - *Path:* Q1A → Q3A → Q4A  
    - **Most awkward commitment:** In the 1min/5hr variant, credence in heads is ~1/302, treating temporal duration as probability-bearing.  
    - *Other nodes:* Assessment per-awakening (Q1 analog: A); long-run frequency relevant (Q8 analog: A); Monday update increases credence (Q6 analog: A).  

  - **Leaf 4: Thirder**  
    - *Path:* Q1A → Q3A → Q4B → Q5A  
    - **Most awkward commitment:** In the coin-tossed-*after* variant, Monday credence in tails is 2/3 despite the coin being fair and untossed.  
    - *Other nodes:* Assessment per-awakening (Q1 analog: A); long-run frequency relevant (Q8 analog: A); Monday update increases credence (Q6 analog: A).  

  ---

  **Notes on the Tree:**  
  - **Unused nodes (for brevity):** The tree excludes direct questions about diachronic predictability (Q7 analog) or long-run dependence (Q8 analog) as they don’t cleanly split the core views. All leaves answer Q7 analog with "Yes" (predictable) and diverge on Q8 analog: thirders/temporalists say "Yes" (frequency matters), halfers/Meacham say "No".  
