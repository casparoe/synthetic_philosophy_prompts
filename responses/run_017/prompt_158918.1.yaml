  Below is a decision tree designed to guide students through the logical space of the Sleeping Beauty problem without presupposing specific positions. The tree focuses on concrete cases and fundamental commitments, with nodes phrased as answerable questions. Positions are mapped to the leaves based on consistent combinations of answers. The tree separates key distinctions (e.g., per-awakening vs. per-run assessment, Monday updates, variants) while minimizing direct credence queries.

