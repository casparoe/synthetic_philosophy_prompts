prompt: |-
  Me and two other parents judge the projects at our regional middle-and-high-school science fair every spring, and I also help moderate a neighbourhood Facebook group where people are constantly posting health and wellness claims, so I end up doing the same thing over and over: deciding whether something somebody is very confident about is actually the kind of claim that evidence could ever touch, or whether it only looks like it is. I got nerd-sniped into reading about Popper and falsificationism online a few months ago and honestly it's made things worse rather than better — I now catch myself wanting to fail half the kids' projects for being untestable, and at the same time some of the woo in the Facebook group seems to survive the "what would prove you wrong?" question just fine, because the poster will cheerfully name some result and then quietly explain it away when it happens. So I've been messing around with a few rules of my own and I want someone to tell me which of them are worth keeping and then build the actual procedure around them. The first is what I call the Tuesday test: keep "nobody could ever test this, even in principle" strictly separate from "this particular twelve-year-old can't test it before Sunday with the equipment in her garage," because those feel like totally different problems to me and I keep conflating them. The second is the pre-mortem: before anyone runs the experiment, make them write down in advance which outcome would make them abandon the claim, and then check whether that written-down outcome is one they'd actually accept or one they'd reinterpret. The third is rubber claims — my name for claims that stretch to absorb whatever happens, where the giveaway is that after the result is in you still can't say what would have counted against them; I think the right test for a rubber claim is whether the person can describe a result that would lower their confidence by a specific amount rather than just "make me think about it more." I've also read somewhere that any test actually checks a whole bundle of assumptions at once rather than one idea on its own, which worries me because it seems like it would let anybody wriggle out of anything by blaming their equipment, and I don't know how to fold that in without making the whole thing useless.

  What I need is a procedure, not an essay. Something the three of us can run in about ten minutes per project, written in plain language with no philosophy jargon in the final checklist (I can translate, but the other two judges won't read anything with the word "epistemology" in it), with the questions in the order we should ask them, what counts as a good enough answer to each, the point where you just stop and say no, and the point where you hand it to a human because it's a values call and not a facts call. It has to end in a verdict we can defend to a parent who complains to the school board, and — this matters — it needs a repair step, because with twelve-year-olds we can't just say "your topic isn't science"; we need to be able to say "not testable as you've written it, but here is the nearest testable version" and still give them most of the marks. Please also be straight about which steps are really judgment calls wearing a procedure costume.

  Then run it on three cases. First: a girl's project where she talks kindly to one set of bean plants and ignores another set, and the talked-to ones come out taller. Second: a post in the Facebook group selling a copper bracelet that rebalances your energy field, where the seller says it obviously doesn't work on people who are skeptical. Third, and this is the one where I want you to be blunt even if it annoys me: I've believed for about fifteen years that my migraines come on ahead of storms, I've half-kept a diary about it, and I really don't want to be told I'm doing pseudoscience — so tell me honestly what your procedure says about my headache theory and what I'd have to do to make it come out the other way. Finally, list the kinds of claims your procedure just can't handle (historical one-off stuff, statistical things, whatever else) so I know when to stop using it.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're a science fair judge and a moderator for a Facebook group dealing with health claims. They've been grappling with Popper's falsificationism but found it impractical. They need a clear, jargon-free procedure to evaluate claims quickly, especially for middle and high school projects, and also for the wellness claims in their group. 

  First, I need to address their main pain points: distinguishing untestable claims from practical limitations, preventing flexible interpretations of results, and handling post-hoc excuses. Their proposed rules—Tuesday test, pre-mortem, rubber claims—are solid starting points. The challenge is to integrate these into a streamlined checklist that's both rigorous and user-friendly.

  The user emphasized a need for a repair step, especially for students. It's crucial to not dismiss projects outright but to guide them toward testable versions. Also, the procedure must withstand scrutiny from parents or school boards, so each step needs clear justification. 

  Looking at the three test cases:
  1. The bean plant experiment: Here, the issue is operationalization. "Kind talking" is too vague. The repair would involve defining specific, measurable actions. 
  2. The copper bracelet: This is a classic ad hoc rescue—blaming skepticism for failure. The procedure should flag this as untestable since the claim adjusts to avoid falsification.
  3. Their migraine theory: Confirmation bias is likely at play. The diary method lacks controls. The repair would require systematic data collection with environmental triggers and predefined criteria.

  For historical or statistical claims, the procedure might not apply well. The user needs to know these limits to avoid misapplication. 

  Underlying all this, the user wants to foster critical thinking without stifling curiosity. They’re seeking validation that their approach is sound but also need concrete tools. Balancing rigor with encouragement, especially for kids, is key. The repair steps are as important as the evaluation itself. 

  I’ll structure the procedure as a flowchart with clear exit points and repair prompts. Using plain language terms like "untestable in principle" instead of "unfalsifiable" keeps it accessible. The Tuesday test separates feasibility from practicality, which directly addresses their conflation problem. 

  The pre-mortem and rubber claim checks tackle motivated reasoning. For the latter, requiring a quantifiable confidence shift (e.g., "30% less sure") makes it tangible. The auxiliary assumptions point (Hooper’s Hook) is tricky but necessary; I’ll limit it to major, testable assumptions to prevent loopholes. 

  Finally, the test cases will demonstrate the procedure’s fairness. For the migraine example, bluntness is requested—so highlighting confirmation bias and suggesting controlled logging meets their ask without being dismissive. The key is emphasizing that the *current method* is unscientific, not the claim itself. 

  This should give them a defensible, educational tool that turns dead ends into teachable moments.
answer: |-
  Here’s a plain-language **10-Minute Testability Checklist** for science fair projects and health claims, designed to catch untestable ideas early while preserving fairness and offering repairs. Prioritize questions in order—stop if any step fails until repaired. 

  ---

  ### The Checklist (Run in Order)
  1. **The Tuesday Test:**  
     *"Could anyone, anywhere, with unlimited time/money, test this? Or is it impossible (e.g., angels, destiny)?"*  
     - ✅ **Pass:** "Yes, someone could test it."  
     - ❌ **Fail:** "No, it’s impossible even for experts." → **STOP. Verdict: Untestable in principle.**  
     - ⚠️ **Repair:** If fail, ask: *"What’s the closest real-world thing we *could* test?"* (e.g., "Do bean growth *respond to sound*?" not "Do plants *feel love*?").

  2. **The Pre-Mortem:**  
     *"What specific result would make you admit your idea is wrong? Write it down."*  
     - ✅ **Pass:** Clear, measurable outcome (e.g., "Talked-to plants are *shorter or same height*").  
     - ❌ **Fail:** Vague ("Plants look sad"), unfalsifiable ("Skeptics block the energy"), or none. → **STOP. Verdict: Unfalsifiable claim.**

  3. **Rubber Claim Check:**  
     *"If your ‘wrong outcome’ (from Step 2) happened, would it change your mind? By how much? (e.g., ‘I’d be 80% less sure’)."*  
     - ✅ **Pass:** Specific confidence shift stated.  
     - ❌ **Fail:** "I’d rethink it" or excuses pre-loaded ("Unless the soil was bad..."). → **STOP. Verdict: Rubber claim (stretches to fit any result).**

  4. **Hooper’s Hook (for Assumptions):**  
     *"What’s the *one thing most likely to break* your experiment? Have you ruled it out?"*  
     - ✅ **Pass:** Names 1 major assumption & controls it (e.g., "Both plant groups got same light? Yes, used a timer.").  
     - ⚠️ **Judgment Call:** If assumption is untestable (e.g., "Negative energy ghosts"), revert to Step 1. If fixable, note as **Repair Needed**.

  ---

  ### When to Stop & What to Do
  - **❌ HARD STOP** at any "Fail" verdict. *Do not proceed to judging.*  
  - **⚠️ REPAIR REQUIRED:** If issue is fixable (e.g., vague measurement), return project with feedback: *"Your idea is testable, but [specific flaw]. Redo with: [concrete fix]."*  
  - **✅ READY FOR JUDGING:** Passes all steps? Judge normally on method/analysis.  

  ---

  ### Test Cases (Applied Rigorously)
  **1. Bean Plant Experiment (Science Fair)**  
  - **Tuesday Test:** Pass (sound/CO₂ could affect plants).  
  - **Pre-Mortem:** ❌ Fail. "If ignored plants grow taller?" → She says: "No, I must not have talked *enough*." → Rubber claim!  
    **Verdict:** Unfalsifiable. **Repair:** *"Measure CO₂ levels near plants, or use a voice recorder. Test ‘sound vs. silence’—not ‘kindness’."*  

  **2. Copper Bracelet (Facebook Group)**  
  - **Tuesday Test:** Pass (energy fields *could* be detectable).  
  - **Pre-Mortem:** ❌ Fail. "What would prove it fake?" → Seller: "If skeptics wear it and feel better!" → But then says skeptics "block energy."  
    **Verdict:** Rubber claim. **No repair** (seller won’t fix). Flag as pseudoscience.  

  **3. Your Migraine Theory (Be Blunt!)**  
  - **Tuesday Test:** Pass (pressure/humidity can be measured).  
  - **Pre-Mortem:** ✅ Pass (e.g., "Migraines occur *more often on sunny days*").  
  - **Rubber Check:** ❌ Fail. If told "No correlation in your data," you might blame "I missed a storm" or "stress interfered."  
    **Verdict:** Rubber claim *in current form*. **Repair:** *Pre-define* "storm" (e.g., pressure drop >5 hPa) and "migraine onset" (e.g., pain scale >7). Use a blinded app to log weather/migraines for 6 months. *Then* analyze.  

  ---

  ### Claims This Can’t Handle
  1. **Historical What-Ifs:** *"Would JFK survive if the car was faster?"* (No testable evidence).  
  2. **Statistical Fog:** Claims relying on vague averages (*"This tea ‘boosts vitality’"*) without measurable thresholds.  
  3. **One-Off Events:** *"A comet caused the dinosaurs’ extinction."* (Testable only indirectly via evidence trails).  
  4. **Pure Value Judgments:** *"Van Gogh is the best painter."* (Subjective preference).  

  ---

  ### Key Judgment Calls (Disguised as Procedure)  
  - **Pre-Mortem honesty:** Does their "wrong outcome" *actually* challenge the core idea?  
  - **Repair feasibility:** Is the fix age-appropriate? (e.g., 12yos can’t control cosmic rays).  
  - **"In principle" vs. practical:** "Unlimited money" tests (Step 1) avoid conflating kid limits with untestability.  

  **Final Output:** A laminated flowchart:  
  `Start → Tuesday Test? → Pre-Mortem? → Rubber Check? → Hooper’s Hook? → ✅ JUDGE`  
  With ❌ exit arrows to **"STOP: UNTESTABLE (Reason: _______)"** or **"REPAIR: SUGGEST _______."**  

  This cuts philosophy to actionable checks, forces specificity, and turns "failures" into teachable moments—defensible to school boards because it’s *constructive*. For your migraines: The theory isn’t pseudoscience, but *your method* is. Fix the measurement, and it becomes science.
