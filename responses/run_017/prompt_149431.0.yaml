  The expected net gain from accepting at this awakening (assuming she will accept at the others) is therefore only when this awakening is binding. Conditional on it being binding, the expected net gain from the bet is as above: in the world, if the bet is taken, it yields -p if Heads, 1-p if Tails. But since the world's probability is 1/2 for each, conditional on this awakening being binding, the expected net gain from taking the bet is 1/2 - p.

  And the probability that this awakening is binding is 3/4? No, from earlier calculation, P(this awakening is binding) = 3/4.

  But if this awakening is binding, then by accept vs. decline, she changes the net gain by an amount that is the net gain of the bet (1/2 - p) because if she accepts, she gets the bet, if she declines, she doesn't.

  So the expected net gain from accepting at this awakening (as opposed to declining) is:
  [P(this awakening is binding) ] * [expected net gain from having the bet] = (3/4) * (1/2 - p).

  Set this >=0: (3/4)(1/2 - p) >=0 => 1/2 - p >=0 => p<=1/2.

  Yes! This works.

  So the expected net gain from choosing to accept (over decline) at this awakening is (3/4) * (1/2 - p). Since 3/4>0, she should accept if 1/2 - p >=0, i.e., p<=1/2.

  And if she were to decline at this awakening, the expected net gain would be 0, because if it's not binding, declining does nothing, and if it is binding, by declining she avoids the bet, which has expected net gain 1/2 - p, so the expected net gain from declining would be - (3/4)(1/2 - p) [because she's forgoing it].

  But since she can choose, she will accept if (3/4)(1/2 - p) >=0, i.e., p<=1/2.

  Therefore, the highest price she should pay is 1/2.

  So to clarify: this calculation assumes that she will accept at the other awakening(s). This is optimal because the bet has positive expected net gain per world if p<1/2, and by always accepting, she ensures she gets the bet in every world. If she sometimes declines, she might miss the bet in some worlds, which is worse.

  Therefore, for bet B, the highest price is 1/2.

  **Revised Derivation for Bet B:**

  Beauty should plan to accept bet B at every awakening. Given that strategy:

  - In every world, the bet will be executed (because she will accept at the binding awakening).
  - The expected net gain per world is: in Heads: -p, in Tails: 1-p, so expected net gain per world is (1/2)(-p) + (1/2)(1-p) = 1/2 - p.

  Since she is risk-neutral and cares about total wealth, this is the relevant expectation. Therefore, she should be willing to pay any price p such that 1/2 - p >=0, i.e., p<=1/2.

  At a single awakening, if she is considering whether to accept at this awakening, and she knows she will accept at the others, then by accepting at this one, she ensures that if this is the binding one, she gets the bet. If she declines, she forgoes the bet if this is binding. The expected net gain from accepting (over declining) at this awakening is the probability that this awakening is binding times the expected net gain from the bet, which is (3/4) * (1/2 - p). Since this is positive when p<1/2, she should accept.

  Hence, the highest price for bet B is 1/2.

  **The Scenario (revised paragraph):**

  In a sleep laboratory, a fair coin is tossed. If Heads, Beauty is awakened once, on Monday; if Tails, she is awakened on Monday and again on Tuesday with amnesia. At an awakening (without loss of generality, Monday), two experimenters independently offer her a bet on Tails, each paying 1 unit if Tails and 0 if Heads, for a price p. The bets are independent and cannot be hedged. In bet A, each time the bet is offered and accepted, it is executed: she pays p and, if Tails, receives 1 at that awakening. In bet B, only one awakening per world is randomly selected as binding; if the bet is offered and accepted at the binding awakening, it is executed: she pays p and, if Tails, receives 1; if offered and accepted at a non-binding awakening, it is void and costs nothing; she is not told which is binding.

  **Derivation of Prices:**

  *Bet A:*
  - Heads (prob 1/2): one awakening, net gain: -p.
  - Tails (prob 1/2): two awakenings, net gain: 2(1 - p) (since she pays p twice and gets 1 twice).
  - Expected net gain: \( \frac{1}{2} (-p) + \frac{1}{2} (2-2p) = -p/2 + 1 - p = 1 - \frac{3p}{2} \).
  - Set >=0: \( 1 \geq \frac{3p}{2} \) => \( p \leq \frac{2}{3} \).

  *Bet B:*
  - Beauty's optimal strategy is to accept at every awakening.
  - Then, in every world, the bet is executed exactly once (at the binding awakening).
  - Net gain per world: Heads: -p, Tails: 1-p.
  - Expected net gain per world: \( \frac{1}{2} (-p) + \frac{1}{2} (1-p) = \frac{1}{2} - p \).
  - Set >=0: \( p \leq \frac{1}{2} \).

  **Argument that the case is not cheating:**

  - The halfer believes that at an awakening, P(Tails) = 1/2.
  - The thirder believes that at an awakening, P(Tails) = 2/3.
  - In bet A, the fair price is 2/3, which matches the thirder's credence.
  - In bet B, the fair price is 1/2, which matches the halfer's credence.
  - But these are two bets on the same proposition at the same moment. Therefore, no single credence in Tails can rationalize both betting rates. The difference is due solely to the indexing rule: in bet A, payoffs are per-awakening, leading to two charges and two potential payouts in Tails, while in bet B, payoffs are per-world, leading to one charge and one potential payout regardless of outcome.

  **Ablations:**

  1. *Both bets per-awakening (like A):* 
     - For bet B, change to per-awakening settlement. Then both bets would have the same as bet A: highest price 2/3.
  2. *Both bets one-per-world (like B):* 
     - For bet A, change to one-per-world settlement. Then both would have highest price 1/2.
     - In either case, the prices converge.

  3. *Equal number of awakenings:* 
     - Suppose the protocol is: coin toss, if Heads awaken once, if Tails awaken twice, but add that if Heads, she is awakened twice with amnesia? But that would be two in Heads and two in Tails. 
     - Modify the setup: if Heads, she is awakened on Monday and again on Tuesday with amnesia; if Tails, she is awakened on Monday only. Then:
       - In Heads: two awakenings.
       - In Tails: one awakening.
     - For bet A (per-awakening): 
       - Heads: net gain: 2(-p) = -2p.
       - Tails: net gain: 1 - p.
       - Expected net gain: (1/2)(-2p) + (1/2)(1-p) = -p + 1/2 - p/2 = 1/2 - (3p/2).
       - Set to zero: 1/2 = 3p/2 => p=1/3. But we want 1/2.
     - Alternatively, make the number of awakenings the same in both worlds. Suppose always two awakenings: if Heads, awaken Monday and Tuesday with amnesia; if Tails, awaken Monday and Tuesday with amnesia. Then the coin toss doesn't affect the number of awakenings. But then what does the bet depend on? We need the coin to be relevant.
     - Instead, let the coin toss determine something else, but the bet is on the coin toss. In both worlds, two awakenings. Then for bet A (per-awakening):
       - In both worlds, she is awakened twice. If she accepts a bet, she pays p and gets 1 if Tails, 0 if Heads.
       - Heads: net gain: 2(-p) = -2p.
       - Tails: net gain: 2(1-p) = 2-2p.
       - Expected net gain: (1/2)(-2p) + (1/2)(2-2p) = -p + 1 - p = 1 - 2p.
       - Set to zero: p=1/2.
     - For bet B (one-per-world settlement): 
       - With two awakenings in each world, but only one binding awakening per world chosen randomly.
       - If Beauty always accepts, then in each world, the bet is executed once.
       - Net gain per world: Heads: -p, Tails: 1-p.
       - Expected net gain per world: 1/2 - p, so p=1/2.
     - So both become 1/2.

  **Strongest Objection and Reply:**

  *Objection (from a halfer):* In bet B, since only one choice per world is binding and she doesn't know which, she should conditionalize on her current choice being the binding one. Given that, P(Heads | current awakening is binding) = P(Heads and binding) / P(binding) = (1/2) / (3/4) = 2/3. Then the expected net gain from the bet, conditional on being binding, is (2/3)(-p) + (1/3)(1-p) = -2p/3 + 1/3 - p/3 = 1/3 - p. Since this is the only case that matters (because if not binding, no effect), she should be willing to pay up to 1/3. But we got 1/2, so there is a contradiction.

  *Reply:* The conditionalization on the current awakening being binding is not warranted because the decision at this awakening affects the outcome only if it is binding, but the expected net gain from the bet when binding is 1/2 - p (as per the world), not 1/3 - p. The conditional expectation given binding is: if binding, then the world is Heads with probability 2/3 and Tails with probability 1/3? But that is incorrect because the world's probability is still 1/2 for each. Given that the awakening is binding, the probability of Heads is 2/3, but the net gain in the event of binding is -p if Heads and 1-p if Tails, and these have probabilities 2/3 and 1/3. So the conditional expected net gain given binding is (2/3)(-p) + (1/3)(1-p) = 1/3 - p. This is correct for the impact of the bet if taken, but it is not the whole story because by accepting, she is not only affecting the world when binding, but she is also ensuring that she gets the bet in this world. However, the objection has a point: if she is only making a decision at this one awakening and we are not assuming a strategy for other awakenings, then the expected net gain from accepting at this awakening is indeed the probability that it is binding times the conditional expected net gain given binding, which is (3/4) * (1/3 - p) = 1/4 - 3p/4, and this is >=0 when p<=1/3.

  But this contradicts our earlier derivation of 1/2. The resolution is that the decision at this awakening is part of a strategy for all awakenings. If she conditions locally on this awakening being binding and uses the conditional probability, she might choose to decline if p>1/3, but then at the other awakening, she would face the same situation and also decline, so she might end up not taking the bet even when it is favorable. In fact, if p<1/2, the bet has positive expected net gain per world, so she should take it. The local conditionalization ignores the correlation across awakenings in the same world. Since she is identical in all relevant respects at each awakening and will make the same decision, she must consider the overall strategy. The optimal strategy is to always accept, which yields expected net gain per world of 1/2 - p. If she were to use the conditional probability at each awakening and set a threshold of 1/3, then for p between 1/3 and 1/2, she would decline at every awakening, and thus miss out on a positive expected net gain. Therefore, the conditionalization on the current choice being binding is myopic and leads to a dominated strategy.

  **Abstract's Last Line:**

  This case shows that the fair betting rate for a proposition can vary with how payoffs are indexed to decision events, independently of the agent's credence.
answer: |-
  ### Scenario  
  In a sleep laboratory, a fair coin is tossed. If it lands Heads, the agent, Beauty, is awakened once (Monday). If Tails, she is awakened twice (Monday and Tuesday), with amnesia induced after Monday’s awakening so that each awakening feels like the first. Beauty is fully informed of the protocol. At one awakening, two independent experimenters offer her identical bets on the proposition that the coin landed Tails: for price \(p\), she receives one unit if Tails, nothing if Heads. The bets are simultaneous, with the same stakes and evidence, and cannot be hedged. The sole difference is the payoff-indexing rule:  
  - **Bet A**: Each awakening’s bet is settled separately. If Beauty accepts, she pays \(p\) at that awakening and receives the payout at that awakening if Tails. Thus, in Tails, she transacts twice.  
  - **Bet B**: Exactly one awakening per world is randomly selected to be binding (each equally likely). Beauty is charged only if she accepts at the binding awakening and receives the payout there if Tails; non-binding acceptances are void and cost nothing. She is not told which is binding.  

  ### Derivation of Prices  
  **Bet A (per-awakening settlement):**  
  - *Heads (probability \(1/2\))*: One awakening. If she accepts, net gain = \(-p\).  
  - *Tails (probability \(1/2\))*: Two awakenings. If she accepts at both, net gain = \(2(1 - p)\) (pays \(2p\), receives 2 if Tails).  
  - *Expected net gain*: \(\frac{1}{2}(-p) + \frac{1}{2}(2 - 2p) = -p/2 + 1 - p = 1 - 3p/2\).  
  - Set \(\geq 0\): \(1 - 3p/2 \geq 0\) \(\Rightarrow\) \(p \leq 2/3\).  
  - **Highest price**: \(2/3\).  

  **Bet B (one-per-world settlement):**  
  - Beauty’s optimal strategy: Accept at every awakening (since void choices cost nothing, this ensures execution if binding).  
  - *Heads (probability \(1/2\))*: One awakening (binding). If she accepts, net gain = \(-p\).  
  - *Tails (probability \(1/2\))*: One binding awakening (randomly chosen). If she accepts, net gain = \(1 - p\).  
  - *Expected net gain per world*: \(\frac{1}{2}(-p) + \frac{1}{2}(1 - p) = 1/2 - p\).  
  - Set \(\geq 0\): \(1/2 - p \geq 0\) \(\Rightarrow\) \(p \leq 1/2\).  
  - **Highest price**: \(1/2\).  

  ### Why This Is Not Cheating  
  - **Halfer view**: At any awakening, credence in Tails = \(1/2\).  
  - **Thirder view**: At any awakening, credence in Tails = \(2/3\).  
  - **Result**: Bet A’s price (\(2/3\)) matches the thirder credence; Bet B’s price (\(1/2\)) matches the halfer credence. Yet both bets are offered simultaneously on the same proposition, with identical evidence. No single credence rationalizes both prices.  
  - **Structural feature**: The indexing rule alone causes the divergence—Bet A’s per-awakening payoffs double liabilities and rewards in Tails, while Bet B’s per-world payoffs limit exposure to one transaction regardless of outcome.  

  ### Ablations  
  1. **Both bets per-awakening (like A)**:  
     - For Bet B, change to per-awakening settlement. Then both bets yield:  
       - Expected net gain = \(1 - 3p/2\) \(\Rightarrow\) highest price = \(2/3\) for both.  
     - Divergence collapses.  
  2. **Both bets one-per-world (like B)**:  
     - For Bet A, change to one-per-world settlement. Then both bets yield:  
       - Expected net gain = \(1/2 - p\) \(\Rightarrow\) highest price = \(1/2\) for both.  
     - Divergence collapses.  
  3. **Equal awakening schedule**:  
     - Modify protocol: Always two awakenings (add amnesic Tuesday awakening in Heads). Bet on Tails.  
     - **Bet A (per-awakening)**:  
       - Heads: net gain = \(-2p\); Tails: net gain = \(2(1 - p)\).  
       - Expected net gain = \(\frac{1}{2}(-2p) + \frac{1}{2}(2 - 2p) = 1 - 2p\) \(\Rightarrow\) highest price = \(1/2\).  
     - **Bet B (one-per-world)**:  
       - Optimal strategy: Always accept.  
       - Expected net gain per world = \(1/2 - p\) \(\Rightarrow\) highest price = \(1/2\).  
     - Prices converge to \(1/2\).  

  ### Strongest Objection and Reply  
  **Objection**: In Bet B, Beauty should conditionalize on her current choice being binding. Given standard halfer credences:  
  - P(Heads) = \(1/2\), P(binding) = P(Heads) \(\times 1\) + P(Tails) \(\times 1/2\) = \(3/4\).  
  - P(Heads | binding) = \(\frac{1/2}{3/4} = 2/3\).  
  - Conditional expected net gain if binding: \((2/3)(-p) + (1/3)(1 - p) = 1/3 - p\).  
  - Accept if \(1/3 - p \geq 0\) \(\Rightarrow\) highest price = \(1/3\) (not \(1/2\)). Thus, the halfer can explain Bet B’s price without indexing.  

  **Reply**: This conditionalization is incorrect because it ignores strategic interdependence. Beauty’s decision affects the entire world: if she declines at one awakening, she risks missing the bet if that awakening is binding, but she will face an identical choice at other awakenings. Using \(1/3\) as the threshold:  
  - For \(p \in (1/3, 1/2)\), she would decline at all awakenings.  
  - Yet per-world expected net gain is \(1/2 - p > 0\), so declining forfeits profit.  
  - The optimal strategy is to always accept, ensuring the bet is taken when binding. This yields expected net gain \(1/2 - p\), justifying \(p \leq 1/2\).  
  - **Consequence for halfer**: If conditionalization were correct, the halfer would reject favorable bets (\(p < 1/2\)), violating dominance. Indexing rules, not conditional credences, fix the price.  

  ### Abstract’s Last Line  
  This case shows that the fair betting rate for a proposition can vary with payoff indexing independently of credence, undermining Dutch-book arguments in the Sleeping Beauty debate.
