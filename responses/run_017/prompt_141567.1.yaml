prompt: |-
  I convene a small ethics-and-design reading group at a game studio, and our last two sessions deadlocked, because both positions in the room are being carried by the same analogy and nobody could say how much weight it actually bears.

  The case that prompted it: we are sunsetting one shard of an older persistent world — a few thousand accounts, some of them eighteen years old, with houses, guild halls, and a small number of items whose drop rates players spent years chasing. Our legal team's memo says the EULA gives us full discretion and we owe nothing, on the grounds that these things are just data, and the comparison it reaches for is Monopoly money: worthless outside the game, valuable at all only because the player agreed to pretend.

  A group of our designers, and a fair number of players, reply with the same comparison inverted. Paper money is also just paper, and these days mostly just a row in a bank's database; its reality and its value are entirely a matter of convention, backed by an institution that controls supply and punishes counterfeiting. So if your bank balance is real, my vault is real; if a central bank can be said to take something from you by inflating it away, we take something when we delete a shard. Deletion is therefore a taking, and compensation, a notice period, or some form of export is owed. They also point out that this is broadly the line taken in recent philosophy of virtual reality — Chalmers's *Reality+* (2022) argues that virtual reality is genuine reality and its objects real digital objects — though none of us is a philosopher and we could not tell whether that helps them or not.

  So I want the analogy audited rather than asserted. Please give me:

  1. **The correspondence table**, as the players' version needs it: in the monetary case, what plays the role of the note or coin, the mint, the central bank, the legal-tender rule, counterfeiting, inflation, devaluation, a bank run, a sovereign default, and the option of holding value outside the banking system; and what plays each of those roles in a persistent virtual world.

  2. **The disanalogies, sorted** into the ones that matter for the conclusion and the ones that are merely vivid. Two I want addressed directly: money is overwhelmingly fungible, while the items players actually care about are not; and money circulates outside the institution that issues it and survives that institution's collapse, whereas a virtual item can exist only inside the single institution that constitutes it. Connected to the second point, the operator of a shard is at once mint, central bank, legislature, police force and physical universe, and can unilaterally (a) delete an item, (b) duplicate it for everyone, or (c) close the world. For each of (a) through (c), say what the monetary counterpart would be and whether the mapping is close enough to do any argumentative work.

  3. **What the analogy quietly imports.** My worry is that "real in the way money is real" is doing its work by importing an exchange-value model of what matters, so that an item is real because it has a price — which would make the items with no market value unreal, and harms that cost the player nothing in market terms no harms at all. That seems to give the wrong verdict in a second case we also have to rule on: sustained harassment and unwanted sexualised contact directed at avatars, and the deliberate destruction of builds with no resale value.

  4. **An extension to harms.** Here is a sorting device I have been using and want stress-tested. Call an object real to some degree along four axes: *efficacy* (it makes a difference to what happens in the world), *recognition* (the community's constitutive rules treat claims over it as valid), *portability* (its worth can be carried out of the institution that made it), and *uptake* (it figures in the subject's experience, including through an avatar they have, over years, incorporated into their body schema). My impression is that the money analogy secures reality on the first three axes and distorts or ignores the fourth. Is that right? And if it is, what analogy should carry the harm cases instead — the avatar as prosthesis, the world as rented or shared space, the world as a language whose utterances take effect, the world as a game whose constitutive rules generate a genuine standing to complain? For each, say what conclusion it would license and what it would smuggle in.

  5. **Whether the players' conclusion survives.** If the audit shows virtual objects are real but in a way that is radically institution-dependent — real, and yet incapable of existing outside the institution that made them — what follows for what we owe? Distinguish the candidate remedies: cash compensation, a notice period, a consultative voice in the decision, or technical export of the item out of the world. Say which of these the analogy supports, which it undercuts, and which need a separate argument entirely. If your honest verdict is that the analogy cannot carry any of it, say that, and tell me what would have to be argued directly instead.
reasoning: |-
  Okay, the user is running an ethics and design reading group at a game studio, and they're stuck on an analogy about virtual items and money. The core issue is whether deleting a game shard is like taking away something real, similar to how inflation devalues money. Both sides use the same analogy but invert it. The user wants a thorough audit of this analogy.

  First, I need to break down the correspondence table as the players see it. They equate game items to money, the game studio to the central bank, etc. But there are disanalogies, especially fungibility and institutional dependency. Virtual items aren't interchangeable like money, and they can't exist outside the game's servers. The studio has absolute control—deletion, duplication, shutting down—which doesn't have direct counterparts in finance. 

  Then, the user is worried the analogy imports an exchange-value model. If something only has value because it can be traded, then non-tradable items or experiences like harassment might not be seen as real harms. But that feels wrong. The user's four axes—efficacy, recognition, portability, uptake—are key here. The money analogy covers the first three but misses uptake, the personal, embodied experience. For harassment cases, analogies like prosthesis or shared space might work better, emphasizing personal violation over economic loss.

  The user also wants to know if the players' conclusion holds. Even if virtual items are real but institution-dependent, what remedies make sense? Compensation? Notice? Export? The analogy supports notice and consultation but not cash compensation because there's no fungible value. Export might be technically impossible. The deeper issue is relational harm—breaking trust with players. 

  Underlying all this, the user needs practical guidance for their studio. They must balance legal EULA terms with ethical player relationships. The real stakes are maintaining trust and acknowledging players' investments beyond mere data. The analogy audit helps, but the studio needs to address the relational aspects directly, perhaps through consultation and symbolic gestures, even if not legally required.
answer: |-
  Here’s a systematic audit of the money analogy, structured to address your requests. The analogy holds *some* weight but fails decisively on institutional dependency, fungibility, and the nature of harm—undermining the players' strongest claims while revealing deeper ethical obligations.

  ### 1. Correspondence Table (Players' Version)
  | **Monetary Concept**       | **Virtual World Equivalent**                     | **Notes on Fit** |
  |----------------------------|--------------------------------------------------|------------------|
  | Note/Coin                  | Virtual item (e.g., sword, house, rare drop)     | Superficially similar as tokens of value. |
  | Mint                       | Game studio’s item-creation system              | Direct fit: issuer controls supply. |
  | Central Bank               | Game studio (via shard operators)               | Studio controls "economy" & rules. |
  | Legal-Tender Rule          | EULA/ToS granting exclusivity & control         | Rules enforce acceptance *within* the world. |
  | Counterfeiting             | Duping exploits, unauthorized item generation   | Similar: violates scarcity rules. |
  | Inflation                  | Studio-generated item oversupply                | Direct fit (e.g., flooding market with rares). |
  | Devaluation                | Nerfing items, making them obsolete             | Functional parallel (reducing utility/value). |
  | Bank Run                   | Mass player exodus (e.g., after bad update)     | Similar loss of confidence dynamics. |
  | Sovereign Default          | Studio abandonment (e.g., unannounced shutdown) | Partial: no "debt" owed, but trust broken. |
  | Value Outside System       | Grey-market RMT, modding, screenshots           | Weak: items lack native external value. |

  ### 2. Disanalogies (Ranked by Impact)
  **A. Critical Disanalogies (Undermine Players' Claim):**  
  - **Institutional Dependency**:  
    - Money survives its issuing institution (e.g., physical cash after bank collapse; USD outliving a failed state). Virtual items *vanish* if the studio shuts down servers.  
    - **Conclusion Impact**: Money’s value is *intersubjective* (community-backed); virtual items are *institutionally constitutive* (exist only by studio fiat). This negates "deletion = taking" (it’s more like revoking access to a private gallery).  

  - **Non-Fungibility**:  
    - Money is interchangeable; a $10 bill = any other $10 bill. A "Sword of Eternal Dawn" is unique in lore, aesthetics, or player history.  
    - **Conclusion Impact**: Compensation in cash/generic currency ignores subjective attachment, making monetary remedies inadequate.  

  **B. Vivid but Less Critical:**  
  - **Absolute Control**: The studio is mint + bank + legislature + physics engine. Monetary counterparts:  
    - (a) **Delete item** → Central bank erasing bank accounts. *No real counterpart* (banks can’t do this arbitrarily).  
    - (b) **Duplicate items** → Central bank printing money for select individuals. *Rare* (e.g., quantitative easing), but not targeted.  
    - (c) **Close world** → State abolishing currency. *Partial fit* (e.g., currency reforms), but money often retains collectible value.  
    - **Argumentative Weight**: These highlight power asymmetry but don’t prove "ownership" in a property-law sense.  

  ### 3. What the Analogy Smuggles In
  - **Exchange-Value Bias**: The analogy implicitly equates "reality" with *tradable market value*. This:  
    - Excludes non-tradable items (e.g., sentimental guild trophies).  
    - Invalidates non-economic harms (e.g., harassment, destruction of non-market builds).  
  - **Verdict on Harassment Cases**: Under a pure money analogy, these harms vanish because they lack "value." This is ethically bankrupt—highlighting the analogy’s blindness to *embodied experience* and *social violation*.  

  ### 4. Extending to Harms: Testing Your Four Axes  
  | **Axis**       | **Money Analogy Covers?** | **Deficiencies**                          |  
  |----------------|---------------------------|------------------------------------------|  
  | **Efficacy**   | Yes (items affect gameplay) | Reduces efficacy to transactional impact. |  
  | **Recognition**| Yes (community/EULA rules) | Rules are unilaterally changeable by studio. |  
  | **Portability**| **No** (critical failure) | Items lack native existence outside servers. |  
  | **Uptake**     | **No** (ignores entirely) | Dismisses emotional/somatic player-world integration. |  

  **Better Analogies for Harms:**  
  - **Avatar as Prosthesis**:  
    - *Licenses*: Harassment as bodily violation; destruction as vandalism of "extended self."  
    - *Smuggles*: Assumes avatar incorporation is universal (may not fit all players).  
  - **World as Rented Space**:  
    - *Licenses*: Studio as landlord; harassment/abuse breach "quiet enjoyment."  
    - *Smuggles*: Downplays player co-creation of space.  
  - **World as Language**:  
    - *Licenses*: Toxic speech/griefing as assault on communal meaning-making.  
    - *Smuggles*: Overly abstract for tangible harms.  
  - **Game as Promissory Contract**:  
    - *Licenses*: Players invest based on implicit promise of persistence; deletion breaches trust.  
    - *Smuggles*: Requires proving studio "intent" beyond EULA.  

  **Recommendation**: For harassment cases, **avatar as prosthesis** + **world as rented space** best capture violation of personal/communal integrity without relying on exchange-value.

  ### 5. Does the Players' Conclusion Survive?  
  **Short Answer**: The analogy *partially* supports *procedural* remedies but fails for *compensation*.  
  - **Cash Compensation**: Undercut. Money’s fungibility/portability make compensation coherent; virtual items’ non-fungibility and lack of external value make cash arbitrary (e.g., valuing 18 years of guild history at $X).  
  - **Notice Period**: Supported. Like central banks signaling policy shifts to avoid panic.  
  - **Consultative Voice**: Indirectly supported. Institutions (even banks) face backlash for abrupt changes without input.  
  - **Technical Export**: Undercut. Items are ontologically dependent on the world; exporting a "house" without the world is like exporting a play script without actors/stage.  

  **What You Owe (Beyond Analogy)**:  
  - **Ethical Core**: Player investments (time, emotion, identity) create a *relational obligation*—even without legal "property."  
  - **Actionable Remedies**:  
    1. **Notice & Ritual**: Advance warning + in-game memorialization (e.g., "monument" to the shard).  
    2. **Non-Fungible Export**: Symbolic artifacts (e.g., unique screenshot folio, 3D model exports for personal use).  
    3. **Community Consultation**: Not veto power, but dialogue on *how* sunsetting occurs.  
    4. **Harm Mitigation**: For harassment cases, leverage your axes framework—focus on *uptake* (trauma) and *recognition* (community standards).  

  **Final Verdict**: The analogy alone cannot justify compensation or portability. It *does* reveal that virtual objects are "real" through social practice (Chalmers' point)—but their radical dependence on the studio means obligations arise from **broken relational trust**, not property rights. Argue *directly* for:  
  - **Stewardship Ethics**: You sustain a world players helped co-create; sunsetting requires dignified closure.  
  - **Procedural Justice**: Players deserve voice in *how* loss occurs, even if loss itself is inevitable.  
  - **Uptake-Centered Harm Assessment**: Harms matter because players *live* in these worlds—not because objects have market value.  

  This shifts focus from "is it real?" to "what do we owe participants in a shared project?"—an argument grounded in design ethics, not metaphysics.
