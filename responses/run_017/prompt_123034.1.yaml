answer: |-
  Here’s a specification of desiderata for evaluating idealizations in public-health models, grounded in your operational needs and hard cases. Desiderata are **non-negotiable** (N) if essential for triage, or **preferences** (P) reflecting philosophical camps. Hard cases are addressed explicitly.

  ---

  ### **Core Desiderata for an Account of Legitimate Idealization**
  1.  **Purpose Anchoring (N)**:  
      *Legitimacy depends on the model’s specific decision-support role.*  
      - **Motivation**: Your cases (ii) (interpolation vs. extrapolation) and (iv) (self-falsifying interventions) show that an assumption’s validity hinges on the context of use. An assumption benign for short-term forecasts may be catastrophic for policy optimization.  
      - **Hard Cases**: Handles (ii), (iv), (vii). For (vii) (exploratory models), legitimacy is judged by internal coherence or heuristic value, not truth-to-target.  

  2.  **Prospective Evaluability (N)**:  
      *Criteria must apply pre-use, without validation data or track record.*  
      - **Motivation**: Your core constraint: decisions are made *before* ground truth exists. Reliance on predictive success (e.g., "F-twist") is operationally useless.  
      - **Conflict**: Directly opposes desiderata making predictive accuracy the test (e.g., instrumentalism). Fundamental tension with "predictive success as criterion" (your 1st candidate conflict).  

  3.  **Error Characterization (N)**:  
      *Must distinguish between:*  
      - *(a) Directionality* (bias: over/under-estimates key outputs)  
      - *(b) Dominance* (whether the error swamps other uncertainties in the decision-relevant regime).  
      - **Motivation**: Case (ii) (neglected term dominates in extrapolation) and (v) (compensating errors). Enables triage: prioritize assumptions likely to cause large, directional errors in the target regime.  

  4.  **Resource-Aware Tractability (N)**:  
      *Acknowledges computational/data constraints as part of legitimacy.*  
      - **Motivation**: Case (i) (de-idealization impossible in practice). An idealization isn’t "merely wrong" if the honest model is infeasible *and* the simpler version is the best feasible proxy. Legitimacy is contingent on resources.  

  5.  **Robustness-to-Intentional-Perturbation (P: De-idealization camp)**:  
      *Benign if small relaxations of the assumption move predictions toward truth (without requiring full de-idealization).*  
      - **Motivation**: Case (i) & (iii). Addresses (i) by valuing *direction* of improvement even without full convergence; partially addresses (iii) if perturbations offer insight, even if no finite analogue exists.  
      - **Conflict w/ Case (v)**: If fixing one assumption worsens predictions due to compensation (v), this desideratum might flag it as malignant, but the "fix" may be incomplete. Mitigated by **Error Characterization**.  

  6.  **Explicability of Mechanism (P: Capacity-isolation camp)**:  
      *Benign if the assumption isolates a real causal factor/capacity, even if other factors are omitted.*  
      - **Motivation**: Justifies idealized contact structures if they capture a *real* transmission pathway (e.g., household vs. workplace), even if simplified. Helps triage: assumptions distorting core mechanisms are high-risk.  
      - **Hard Cases**: Judges (vi) (inherited assumptions) harshly if the causal link is opaque, but may accept (iii) (infinite limits) if it isolates a capacity (e.g., herd immunity thresholds).  

  7.  **Genealogical Neutrality (P):**  
      *Judges assumptions based on current justification, not historical pedigree.*  
      - **Motivation**: Case (vi) (inherited, unjustified assumptions). Triage should flag assumptions lacking *current* rationale (per **Purpose Anchoring**, **Error Characterization**), regardless of origin.  

  ---

  ### **Handling Your Hard Cases**
  - **(i) (Infeasible de-idealization)**: Handled by **Resource-Aware Tractability** and **Robustness-to-Intentional-Perturbation** (if partial relaxation helps).  
  - **(ii) (Interpolation vs. Extrapolation)**: Handled by **Purpose Anchoring** and **Error Characterization**.  
  - **(iii) (No finite analogue)**: **Robustness-to-Intentional-Perturbation** (if perturbations help) or **Explicability of Mechanism** (if it isolates a capacity). Else, likely *out of scope* for benign idealization.  
  - **(iv) (Self-falsifying intervention)**: Handled by **Purpose Anchoring** (model legitimacy expires upon intervention) and **Error Characterization** (predicts direction of bias).  
  - **(v) (Compensating errors)**: Handled by **Error Characterization** (flags high risk if compensation is fragile). **Robustness** may misleadingly flag "fixes" as harmful.  
  - **(vi) (Inherited assumption)**: Handled by **Genealogical Neutrality** + **Explicability of Mechanism**/**Error Characterization**.  
  - **(vii) (Exploratory models)**: Handled by **Purpose Anchoring** (legitimacy = theoretical insight, not empirical accuracy).  

  ---

  ### **Conflicts Between Desiderata**
  1.  **Prospective Evaluability vs. Predictive Success as Criterion**:  
      - **Real Conflict**: Philosophically irreconcilable. Predictive success is retrospective; you need prospective criteria (**Purpose Anchoring**, **Error Characterization**, **Robustness**). Non-negotiable for your use case.  

  2.  **Robustness-under-De-idealization vs. "Fixing errors shouldn’t make the model worse" (Case v)**:  
      - **Not a Direct Conflict**: "Fixing" one assumption in isolation (e.g., contact structure) in a model with compensating errors isn’t *true de-idealization*; it’s an incomplete correction. **Error Characterization** helps identify fragile compensation. Robustness criteria apply best when errors are *independent*.  

  3.  **Deeper Conflict**: **Resource-Aware Tractability** vs. **Ideal of Full De-idealization**.  
      - Legitimacy constrained by feasibility clashes with views demanding models asymptote to truth. **Non-negotiable for applied work**.  

  ---

  ### **Which Desideratum Excludes the Most Accounts?**
  **Prospective Evaluability (N)**.  
  - **Why**: Most philosophical accounts (e.g., instrumentalism, construct realism) rely on *retrospective* evaluation (predictive success, explanatory power). Your triage context *requires* pre-emptive assessment. This excludes:  
    - Strict instrumentalism ("assumptions don’t matter if predictions work").  
    - Naive falsificationism (needs data to falsify).  
    - Views demanding convergence to truth (no time/data).  

  ---

  ### **Framing & Philosophical Scorecard**
  Your framing (**triage tool**) inherently favors **pragmatic/purpose-relative views** (e.g., adequacy-for-purpose) over truth-tracking or ontological views.  

  | **Philosophical View**          | **Pros for Triage**                                     | **Cons for Triage**                                      |
  | :------------------------------ | :------------------------------------------------------ | :------------------------------------------------------- |
  | **Adequacy-for-Purpose**        | Nails **Purpose Anchoring**, **Prospective Evaluability**, **Resource-Aware Tractability**. Best on (ii),(iv),(vii). | Less guidance on *how* to assess adequacy pre-use (needs **Error Characterization**). |
  | **De-idealization/Robustness**  | Strong on **Robustness-to-Perturbation**; helps with (i), partially (iii). Provides a "pathway" to justify simplicity. | Struggles with (v) (compensation), (iii) (no finite analogue). Requires computable relaxations. |
  | **Capacity Isolation**          | Excels at **Explicability of Mechanism**; flags core distortions (vi). Good for theory-testing. | Less useful for complex systems with emergent behavior (e.g., contact networks). Weak on (v). |
  | **Models as Fictions**          | Handles (vii) well; frees models from truth-tracking.   | Poor for decision-support: no criteria to prioritize risks (ii,iv,v). |

  ---

  ### **Recommendation for Your Talk**
  Frame legitimacy around **Purpose Anchoring**, **Error Characterization**, and **Resource-Aware Tractability**. These form a non-negotiable core for triage:  
  1.  *What decision does this model inform?* (Purpose)  
  2.  *Could this assumption bias the key output upward/downward?* (Directionality)  
  3.  *Is this error likely dominant given the scenario?* (Dominance)  
  4.  *Is there a feasible better alternative?* (Tractability)  

  The "wrong kind of false" is an assumption that fails these *prospectively*: it distorts outcomes in the decision-relevant regime, and a better alternative exists within constraints. Case (ii) is paradigmatic: an assumption "benign" under past data becomes malignant when extrapolated. Philosophical accounts are tools—use what helps, discard what doesn’t.
