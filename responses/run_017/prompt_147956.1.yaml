  Third complication is where it gets existentially sticky. Their proposed distinction is essentially Williams' moral luck problem meets organizational psychology. The worry about "smuggling" is valid - if accountability practices punish based on outcomes, doesn't that functionally negate the blameworthiness distinction? Yet the alternative (identical treatment) feels intuitively unjust.

  For concrete advice:
