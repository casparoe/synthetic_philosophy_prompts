  Personal dimension is poignant. Their lingering guilt over past near-miss reveals how outcome luck shapes moral phenomenology even when we know better intellectually. This needs naming: what Nagel calls "agent-regret" - appropriate concern without proportionate blame.

  The load-bearing distinction is epistemic access vs. outcome dependence. If this collapses, everything else follows. The cosmetic one is "apparent vs real risk" in cases like the third engineer - since risk perception was identical, the ontological difference is morally inert.

  Contested points flagged:
  - Whether organizations can coherently separate blame and accountability (some consequentialists say no)
  - If undetected near-misses should trigger same response as detected ones (pragmatists vs purists)
