answer: |-
  ### Private Brainstorming  
  *Distinctions to maintain:*  
  1. **Culpability (blameworthiness) vs. Consequences (outcomes):** Moral blame hinges on intentions, knowledge, and choices—not results. Outcome-dependent reactions are tools for governance, not morality.  
  2. **Epistemic position (what was knowable) vs. Ontological luck (how things unfolded):** The third engineer’s "harmless" violation doesn’t alter his *ex ante* moral position, which mirrors the others’.  
  3. **Backward-looking blame vs. Forward-looking accountability:** Blame assesses the agent; accountability manages systems and expectations.  
  4. **Agent-regret (feeling responsible for outcomes) vs. Blame (being responsible for choices):** The unlucky engineer’s guilt is psychological, not ethical.  

  *Temptations to blur:*  
  - Letting outcome severity inflate perceived recklessness.  
  - Conflating "accountability as deterrence" with "blame as desert."  
  - Allowing detection bias (whether harm was noticed) to distort moral evaluation.  

  ---

  ### Analysis and Advice  
  **Settled Principles:**  
  - **Moral luck is widely rejected in blameworthiness assessments.** Philosophers like Kant and modern theorists (e.g., Thomas Scanlon) argue outcomes beyond control don’t affect culpability. If two acts are identical in intent, knowledge, and negligence, blame must be equal.  
  - **Harm matters pragmatically.** Outcomes trigger tangible costs (reputational, operational) that demand organisational responses, even if morally arbitrary.  

  **Contested Issues:**  
  - **Whether accountability practices can be "amoral."** Some (e.g., consequentialists) argue all responses are moral; others (e.g., institutional ethicists) accept non-moral incentives.  
  - **The weight of "near misses."** Detected harm *feels* more urgent, but undetected violations may indicate systemic risk.  

  #### (a) What to Do on Monday  
  - **Unlucky Engineer:** Issue a written warning **explicitly tied to procedural violation**, not the outcome. State: "You bypassed review despite known risks. The severe impact *revealed* the flaw, but the breach itself warrants sanction."  
  - **Lucky Engineer:** Identical written warning. Phrase: "You violated protocol under identical conditions. Only chance prevented harm."  
  - **Third Engineer:** Same warning. His act was epistemically identical—unknowable lack of risk doesn’t excuse the choice.  
  - **Incident Review:** Structure it in two parts:  
    1. **Causality & Blame:** "All three violated protocol with equal negligence. Outcomes don’t alter their responsibility."  
    2. **Accountability & Learning:** "Harmful incidents demand visible consequences (e.g., warnings) to uphold standards and reassure stakeholders. Near misses require identical scrutiny to prevent future harm."  

  **Why:** Consistency upholds fairness. Punishing only the unlucky engineer is scapegoating; ignoring others signals that non-detected breaches are acceptable.  

  #### (b) Your Personal Case  
  - **Reframe your guilt:** You experience "agent-regret" (Bernard Williams’ term)—a natural sorrow for causing harm, distinct from blameworthiness. Your past near-miss was *as blameworthy* as the unlucky engineer’s act, but outcomes spared you consequences.  
  - **Managerial duty:** Treat your engineers more justly than you were treated. Acknowledge systemic flaws (e.g., pressure from deadlines) that enable violations. Your guilt should inform empathy, not inconsistency.  

  #### (c) Load-Bearing vs. Cosmetic Distinctions  
  - **Load-Bearing:**  
    - **Blame vs. Accountability:** This is robust if upheld rigorously. Blame focuses on the act; accountability addresses institutional needs (deterrence, trust). They only conflate if you let outcomes dictate *both*.  
    - **Knowable Risk vs. Actual Harm:** The third engineer’s case proves ontological differences (no real risk) are morally irrelevant when epistemic conditions match.  
  - **Cosmetic:**  
    - "Apparent vs. real risk" in hindsight—this is metaphysics. What mattered was their reasonable belief *at the time*.  
    - Detection bias (only 1/5 harm caught) affects *practical* responses but not blame.  

  **If Philosophically Clean ≠ Managerially Prudent:**  
  The clean view (equal warnings) is also the prudent one. Unequal treatment breeds resentment, incentivises hiding errors, and ignores systemic risks. I’d act on it.  

  #### Crucial Consideration  
  If **monitoring gaps** mean undetected violations *routinely* escape scrutiny, my advice softens. You might prioritise visible accountability for *detected* harm to maintain incentives. But this concedes to moral luck pragmatically—flag it as a flawed compromise.  

  ### Final Notes  
  - **To the Unlucky Engineer:** "Your guilt is understandable, but not a moral failing. We’re sanctioning the choice you made, not the outcome. The lucky engineer is equally blameworthy."  
  - **The Single Linchpin:** If **intentions/negligence weren’t truly identical** (e.g., the unlucky engineer downplayed risks more), blameworthiness diverges—and outcomes *might* indirectly evidence that. But you’ve held this fixed.  

  This approach balances ethical rigour with organisational reality. The distinction isn’t evasion—it’s precision.  

  ---  
  *British English maintained throughout, per your request.*
