  When blocking the "roots of action" consideration, the Buddhist verdict collapses into consequentialism - proving this feature is doing the distinctive work. The brother-in-law's likely objection about "smuggling in non-consequentialist values" can be countered by noting that Buddhist ethics treats mental purification as constitutive of the path, not as another outcome to maximize.

