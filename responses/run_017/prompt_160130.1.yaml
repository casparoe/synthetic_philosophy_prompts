prompt: |-
  I lead a small engineering group that runs automated negotiations: a few dozen software agents, each acting for a different principal, bidding against one another in continuous double auctions for compute and logistics capacity. Before we let them commit real money, we want to be able to say something principled about what each agent can be assumed to know about the others. My own vocabulary is that of distributed systems and formal methods: crash and Byzantine fault models, failure detectors, synchronous versus asynchronous rounds, safety versus liveness, shared specifications versus local implementations, unreachable states, model checking a finite-state system against a temporal or epistemic formula, and the standard facts about common knowledge in a message-passing system — that simultaneous common knowledge of a non-trivial event cannot be attained when message delivery is unbounded or lossy, and that the usual workarounds are synchronized rounds, timestamps, or some version of eventual common knowledge. I can read formulas built from individual knowledge operators, everyone-knows operators, the common-knowledge operator, and p-belief operators. I have never read the game-theory literature that uses them.

  What I want is a translation of that literature into my vocabulary, and then — this is the part I actually care about — an honest report on what the translation fails to carry.

  The source material is the epistemic program in game theory: the project of reconstructing solution concepts as theorems about what players know or believe. Take rationalizability and iterated strict dominance, Nash equilibrium, correlated equilibrium, and a sequential refinement such as sequential or perfect Bayesian equilibrium, and restate the epistemic hypotheses that purport to characterize each of them in terms I use daily. Treat a game form as a specification; strategies as local programs; information sets as the indistinguishability of local states; a strategy profile as a run; higher-order mutual belief as the fixed point of an operator over the product of local state spaces; and each solution concept as a property to be model-checked against a system whose processes are the players. Be explicit, concept by concept, about which hypothesis is doing the load-bearing work — common knowledge versus common p-belief, belief with probability one versus truth in all epistemically accessible states, a shared prior versus merely a shared specification — and about what kinds of systems would satisfy each hypothesis. If some widely used hypothesis has no protocol-like reading at all, say so rather than stretching one.

  Then the residue report. I have three guesses about where the translation breaks, and I would like you to test them rather than confirm them:

  First, that the common-prior assumption — and the familiar style of argument for treating it as the default, associated with Harsanyi — has no real counterpart in my world, where the nearest objects are a shared initial state or an adversary that fixes the environment once and for all. If that is right, then results of the agree-to-disagree shape do not translate into claims about bargaining or trade but into something closer to a consensus result: agents who start from one prior and whose posteriors become commonly known cannot end up knowingly disagreeing. Tell me whether that is the right shape for the translated claim, or whether the analogy to consensus distorts it.

  Second, that the demandingness of simultaneous common knowledge puts the solution concepts requiring common knowledge of rationality in the same position as protocols requiring coordinated attack: correct as mathematics, unimplementable in the asynchronous systems I actually run. If so, I want to know whether the literature's retreat to common belief, to p-belief, or to lexicographic hierarchies of beliefs is genuinely doing the kind of work that weakening a synchrony assumption does in protocol design — trading exactness for implementability — or whether the resemblance is a pun on the word common.

  Third, that the worst failure is off the path of play: the requirement, in sequential refinements, that players hold beliefs conditional on events the equilibrium assigns probability zero. In verification, unreachable states are don't-care states, and no specification grades a process on what it would have done in a state the protocol cannot reach. Explain why game theorists insist on grading it anyway, and what that requirement becomes in my vocabulary — if it becomes anything.

  For each of the three, say whether the suspicion survives contact with the material, correct what I have gotten wrong, and then answer the question I am really asking: is the residue a blind spot in my framework, something a protocol designer ought to be able to express and cannot, or is it evidence that the game-theoretic claim is less determinate than its formalism suggests?

  One further wrinkle, which I would like handled inside the translation rather than set aside: my agents have no utility function anyone wrote down. They have prompts, fine-tuning, and a mandate from a principal, and whether they maximize anything is an empirical question about a learned system. Say what becomes of common knowledge of rationality when rationality is an empirical regularity rather than a specification, and whether the epistemic characterizations survive being read that way.

  Please argue for your claims directly; I am not looking for a survey of the field or for anything to go read. Aim for roughly 1,000 to 1,400 words, with short labeled sections, and end with a single machine-readable line in this form:

  \answer{prior} or \answer{common-knowledge} or \answer{off-path} or \answer{substitute: <your own label in eight words or fewer>}

  naming which of the three sources of residue you judged to be the deepest — or, if you think the deepest one is somewhere I did not point, the substitute you would put in its place.
reasoning: |-
  We are going to translate the epistemic game theory program into the vocabulary of distributed systems and formal methods. We will cover the solution concepts: rationalizability/iterated strict dominance, Nash equilibrium, correlated equilibrium, and a sequential refinement (e.g., sequential equilibrium). For each, we restate the epistemic hypotheses in terms of specifications, local programs, runs, indistinguishability of local states, and model checking.

  We then address the three suspicions about translation residue and the wrinkle about agents without explicit utility functions.

  ## Translation of Solution Concepts

  ### 1. Rationalizability and Iterated Strict Dominance
  **Solution Concept:** A strategy is rationalizable if it is a best response to some belief about opponents' strategies, and these beliefs are themselves best responses, and so on. Iterated strict dominance eliminates strategies that are strictly dominated at each round.

  **Epistemic Hypothesis:** Common knowledge of rationality (CKR). Rationality here means that each player maximizes expected utility given their beliefs.

  **Formal Methods Translation:**
  - **Specification (Game Form):** The game is a specification of the rules (available actions, information sets, payoffs). 
  - **Local Programs (Strategies):** Each player's strategy is a local program that maps their information sets (local states) to actions.
  - **Information Sets:** These define the indistinguishability relations over global states for each player. Two global states are in the same information set for player i if they are indistinguishable to i (i.e., they have the same local state for i).
  - **Run (Strategy Profile):** A run is a function from players to their strategies (i.e., a strategy profile).
  - **Common Knowledge of Rationality (CKR):** We define:
    - **Individual Rationality:** At every global state (i.e., at every point in the run), each player's action is a best response to their belief about the others' strategies. 
    - **Common Knowledge:** Let K_i(φ) be "player i knows φ", meaning φ holds in all states indistinguishable to i. Then, E(φ) = ∩_i K_i(φ) (everyone knows φ). Common knowledge C(φ) is the fixed point of the operator that applies E repeatedly (i.e., the greatest fixed point of the operator X ↦ φ ∧ E(X)). 
    - CKR is then common knowledge that every player is rational: C(∧_i Rationality_i).

  **Model Checking:** We check that in the system (the set of all runs that are consistent with the game and the players' strategies), C(∧_i Rationality_i) holds. This is equivalent to the strategy profile surviving iterated elimination of strictly dominated strategies (in finite games).

  **Load-Bearing Hypotheses:** Common knowledge (simultaneous, fixed-point) of rationality. Without common knowledge (e.g., only mutual knowledge of finite order), we get only finitely many rounds of elimination.

  ### 2. Nash Equilibrium
  **Solution Concept:** A strategy profile is a Nash equilibrium if no player can unilaterally deviate and improve their payoff.

  **Epistemic Hypothesis:** Mutual knowledge of rationality and mutual knowledge of the strategy profile.

  **Translation:**
  - **Mutual Knowledge of Strategy Profile:** Let s be the strategy profile. We require that for every player i, K_i(s) (i knows the strategy profile). But note: in a Nash equilibrium, each player must know their own strategy and the strategies of others? Actually, the standard epistemic condition is that there is common knowledge of rationality and common knowledge of the strategy profile? However, a classic result is that common knowledge of rationality and the strategy profile implies Nash only in two-player games. In general, we require common knowledge of rationality and mutual knowledge of the strategy profile (or sometimes common knowledge of the game and rationality, but not necessarily of the strategies). 

  Actually, the standard result (Aumann and Brandenburger, 1995) for n-player Nash is: 
    - Mutual knowledge of rationality, 
    - Mutual knowledge of the strategy profile (each player knows what the others will play), 
    - For players i≠j, i knows j's beliefs about i's strategy (so that beliefs are consistent with the actual strategies).

  But note: if we have common knowledge of the strategy profile, then we have mutual knowledge. However, the result is usually stated with mutual knowledge.

  **Formal Translation:**
  - Let φ_s be the event that the strategy profile is s.
  - Let φ_rationality be the event that every player is rational.
  - Conditions:
    1. Mutual knowledge of rationality: E^k(φ_rationality) for k sufficiently high (for n players, k>=n-1? Actually, Aumann and Brandenburger show that for Nash, we don't need common knowledge, but mutual knowledge of order 1 for the strategy profile and beliefs, and mutual knowledge of rationality of order 2?).

  But to avoid confusion, we can state:
    - For each player i, i knows the strategies of the others (so that i's belief about others is concentrated on the actual strategies).
    - Common knowledge of rationality? Actually, they show that mutual knowledge of rationality (everyone knows everyone is rational) and mutual knowledge of the strategy profile (everyone knows the strategy profile) are sufficient for two-player games. For n>2, we also need that players know each other's beliefs about their own strategies (so that the beliefs are consistent).

  **Model Checking:** We check that for the run s, the following holds:
    - For every player i, at the initial state (or at the state where play begins), i knows the strategy profile (so that i's belief is that others are playing s_{-i}).
    - Mutual knowledge of rationality (at least of level 2) holds: that is, everyone knows everyone is rational, and everyone knows that everyone knows everyone is rational (for two players, mutual knowledge of level 1 for rationality and the strategy profile suffices?).

  **Load-Bearing:** Mutual knowledge (of a finite order) of the strategy profile and rationality. The common prior is also assumed in the standard setup (so that beliefs are derived from a common prior). Without a common prior, we may not get Nash.

  ### 3. Correlated Equilibrium
  **Solution Concept:** A correlated equilibrium is a distribution over strategy profiles such that, if a mediator draws a profile according to that distribution and privately tells each player their action, then no player has an incentive to deviate.

  **Epistemic Hypothesis:** Common knowledge of rationality and a common prior over a shared signal.

  **Translation:**
  - We introduce a mediator (a shared environment) that sends signals. The game is extended to have a signal phase.
  - **Shared Specification:** The common prior is a distribution over the signals (which is part of the specification). The players share this prior and update by conditioning.
  - **Local States:** Include the private signal and the history of play.
  - **Common Knowledge of Rationality:** As before, common knowledge that each player is rational (i.e., they follow the recommendation if it is optimal given their beliefs about others, which are based on the common prior and their private signal).
  - **Model Checking:** We check that for every possible signal, the induced behavior forms a Nash equilibrium of the game where each player's strategy is conditioned on their signal. And the common knowledge of rationality holds in the extended system.

  **Load-Bearing:** Common prior and common knowledge of rationality. The common prior is critical: without it, the players might not interpret the signals in a consistent way.

  ### 4. Sequential Equilibrium (as an example of a sequential refinement)
  **Solution Concept:** A sequential equilibrium consists of a strategy profile and a system of beliefs (a belief for each player at each information set) such that the strategies are sequentially rational (i.e., at every information set, the player's strategy is optimal given their beliefs) and the beliefs are consistent (i.e., they are the limit of beliefs derived from completely mixed strategies).

  **Epistemic Hypothesis:** Common knowledge of rationality and common knowledge of the strategy profile? Actually, sequential equilibrium is defined by consistency of beliefs and sequential rationality. The epistemic conditions are more complex.

  **Translation:**
  - **Information Sets:** At each information set, the player has a local state. The player's strategy at that set must be optimal given their belief about the state of the game (which includes the history and the other players' types) and given the strategy profile.
  - **Beliefs:** The system of beliefs is a part of the global state. It must be consistent: meaning that there is a sequence of completely mixed strategy profiles that converges to the equilibrium strategy profile and such that the beliefs are the limit of the conditional probabilities induced by these profiles.
  - **Sequential Rationality:** At every information set (even those off the equilibrium path), the player's action is optimal given their belief at that set.

  **Model Checking:** We must check that for every information set (even unreachable ones) the local strategy at that set is optimal given the belief. The belief must be consistent in the sense that it is the limit of beliefs from nearby strategies.

  **Load-Bearing:** The consistency condition (which implies that beliefs are defined even at unreachable information sets) and sequential rationality at every information set.

  ## Residue Report

  ### First Suspicion: The Common Prior Assumption
  **Suspicion:** The common prior assumption (CPA) has no real counterpart in distributed systems, where the closest are shared initial states or a fixed environment. The translated agree-to-disagree result would then look like a consensus result: agents starting from a common prior and whose posteriors become commonly known cannot knowingly disagree.

  **Analysis:** The CPA is indeed central in game theory for generating consistent beliefs. In distributed systems, we do have shared initial states (e.g., all processes start with the same program and initial data) and we have consensus protocols. The agree-to-disagree theorem (Aumann, 1976) states that if two agents have the same prior and their posteriors are common knowledge, then they must be the same. This is analogous to a consensus result: if two processes have the same initial state (the prior) and then update based on private observations (which are not shared) but then their posterior beliefs are common knowledge (which is a very strong condition, requiring a fixed point of mutual knowledge), then the posteriors must be equal. 

  **Translation:** The theorem translates well: common knowledge of posteriors and a common prior imply consensus on the posterior. The analogy to consensus is appropriate. However, note that in distributed systems, we often deal with exact knowledge and synchronous rounds to achieve common knowledge. The CPA is an assumption about the initial state (a shared prior distribution) that we don't typically require in distributed systems (where we might have shared initial data but not necessarily a shared distribution). 

  **Residue:** The residue is that the CPA is a stronger assumption than just shared initial data: it is shared initial beliefs (a probability distribution). In distributed systems, we rarely assume that processes start with the same prior distribution over the state of the world. This is a blind spot: distributed systems specifications usually do not require shared priors, so the CPA is an additional constraint. However, if we are designing agents that must coordinate in a Bayesian way, we might need to build in a common prior. 

  **Verdict:** The suspicion survives: the CPA has no direct counterpart in standard distributed systems, but it is analogous to a shared initial state of a particular kind (a probability distribution). The translated claim about consensus is correct. The residue is a blind spot: without a common prior, the agents might not be able to coordinate on a correlated equilibrium or avoid disagreeing even with common knowledge of posteriors.

  ### Second Suspicion: Common Knowledge and Implementability
  **Suspicion:** Common knowledge of rationality is unimplementable in asynchronous systems, just like coordinated attack. The retreat to common belief or p-belief might be a weakening that enables implementability.

  **Analysis:** Common knowledge is indeed unattainable in asynchronous systems with crash failures (by the impossibility of coordinated attack). Therefore, solution concepts that require common knowledge of rationality (like rationalizability) are not achievable in such systems. The game theory literature does weaken common knowledge to common belief (with probability 1) or common p-belief (with probability p) to get approximate solution concepts. For example, common p-belief of rationality can lead to strategies that survive iterated elimination of strictly dominated strategies with p-dominance. 

  **Translation:** The weakening from common knowledge to common belief (which is a fixed point of mutual belief with probability 1) is analogous to weakening from synchronous rounds to eventual consistency. However, note that common belief (with probability 1) can be achieved in asynchronous systems if we allow probability and almost sure convergence (e.g., using a common coin). But common knowledge (the simultaneous fixed point) remains impossible. The lexicographic hierarchies of beliefs (like in the concept of "common belief in rationality") are similar to the iterated knowledge in the coordinated attack problem. 

  **Residue:** The retreat to common belief or p-belief is indeed a way to achieve implementability. However, it does not exactly parallel the distributed systems weakenings because common belief (with probability 1) still requires that the event has probability 1 and is mutually believed to have probability 1, etc. This is achievable in a probabilistic asynchronous system (e.g., with a common coin) but not in a non-probabilistic one. The p-belief version is even more implementable. 

  **Verdict:** The suspicion survives: common knowledge is unimplementable, and the retreat to common belief or p-belief is a practical workaround. The resemblance is not just a pun: it is a genuine relaxation for implementability. However, note that common belief (with probability 1) is still very strong and might require synchrony if we want to avoid probability. 

  ### Third Suspicion: Off-Path Beliefs
  **Suspicion:** The requirement in sequential refinements to specify beliefs off the path of play has no counterpart in verification, where unreachable states are don't-care.

  **Analysis:** In sequential equilibrium, we require that players have beliefs even at information sets that the equilibrium strategy profile would never reach. We also require that these beliefs are consistent (i.e., they can be justified by some sequence of strategies that are completely mixed). In distributed systems, we do not specify behavior at unreachable states because the protocol is not required to work there. 

  **Translation:** The off-path beliefs are similar to the requirement that the system must behave correctly even in states that are unreachable under the specified protocol. This is a specification of fault tolerance: what if a message is lost (which is not supposed to happen) or a process deviates? In game theory, the off-path beliefs are necessary because the equilibrium concept must be robust to the possibility of off-path play (which might occur if there is a deviation). 

  **Why Game Theorists Insist:** Game theorists want the solution to be stable against small perturbations (trembling hands) or against the possibility of irrationality. Thus, even if an information set is unreachable, if it were reached, the player must have a belief and act rationally. This is a robustness requirement.

  **Translated to Your Vocabulary:** In a distributed system, we might require that even if the system enters an unreachable state (due to a fault), the processes should still behave in a way that avoids catastrophic failure. This is similar to fault tolerance: we specify behavior in states that are not supposed to be reached under the fault-free model. 

  **Residue:** The residue is that in verification, unreachable states are typically left undefined (unless we are doing fault tolerance). But in game theory, the off-path beliefs are part of the equilibrium definition. This is a blind spot in standard verification: we do not usually require that the protocol specifies behavior for unreachable states. However, if we are to design agents that are robust to deviations (by other agents) or to unexpected events, then we might need to specify off-path behavior. 

  **Verdict:** The suspicion partially survives: the requirement is indeed extra and not typically found in verification. However, it is not a failure but a feature: the game-theoretic requirement is a form of fault tolerance. The residue is a blind spot in your framework for the typical non-fault-tolerant specifications. But if you want robust agents, you should be able to express it. Therefore, it is not evidence of indeterminacy but of a requirement for robustness.

  ## The Wrinkle: Agents Without Explicit Utility Functions
  **Problem:** The agents are learned systems (e.g., via fine-tuning) and may not have an explicit utility function. Rationality (maximizing expected utility) is an empirical regularity.

  **Translation:** Common knowledge of rationality (CKR) becomes a statement about the behavior of the agents. We can interpret rationality as: the agent's strategy is such that at every information set, the action it takes is the one that would be taken by an expected utility maximizer with respect to some beliefs. But note: without an explicit utility function, we cannot check rationality directly. 

  **Survival of Epistemic Characterizations:** The characterizations become empirical claims. We can still model-check the system for the property of rationality (if we can define utility from the principal's mandate) but if we cannot, then we cannot verify CKR. However, the epistemic conditions (like common knowledge of rationality) are then hypothetical: if the agents behave as if they are rational and as if they have common knowledge of rationality, then the solution concepts hold. 

  **Impact:** Without explicit utility, we cannot define rationality. Therefore, the epistemic characterizations become inapplicable. We might replace rationality with "adherence to the principal's mandate" and then define a form of best response relative to the learned policy. But that would be a new concept. 

  ## Conclusion on Residue Depth
  All three residues are significant. However, the deepest one is the **common prior assumption**. It is a foundational assumption in the epistemic program that has no direct counterpart in distributed systems. It requires agents to share not just a specification but a prior distribution over the state of the world. Without it, many results (like correlated equilibrium) do not hold. The other residues (common knowledge implementability and off-path beliefs) are either solvable by known techniques (weakening to belief) or can be incorporated as robustness requirements (off-path). But the CPA is more fundamental and less avoidable.

  Hence, we output:
  \answer{prior}
answer: |-
  ### Translation of Epistemic Game Theory to Distributed Systems Vocabulary  
  **Core Framework:**  
  - **Game form** = Global specification (rules, actions, payoffs).  
  - **Player** = Process/agent with private local state.  
  - **Strategy** = Local program (mapping local states to actions).  
  - **Information set** = Indistinguishability class of global states (equivalent local state).  
  - **Strategy profile** = Run (assignment of strategies to all agents).  
  - **Mutual belief** = Iterated "everyone knows" operator (\(E^1, E^2, \dots\)).  
  - **Common knowledge** = Fixed point \(C(\phi) \equiv \phi \land E(C(\phi))\) (simultaneous global fixed point).  
  - **Common p-belief** = Probabilistic analogue (belief held with min probability \(p\) at all reachable states).  

  #### Solution Concepts as Model-Checking Problems  
  1. **Rationalizability/Iterated Strict Dominance**  
     - *Epistemic hypothesis*: Common knowledge of rationality (CKR).  
     - *Translation*:  
       - Rationality: At every local state, the agent's action maximizes expected payoff given beliefs about others.  
       - CKR: \(C(\bigwedge_i \text{Rational}_i)\) holds in the system.  
     - *Model-checking*: Verify \(C(\text{Rationality})\) holds for all runs.  
     - *Load-bearing*: **Common knowledge** (simultaneous fixed point). Without it, only finite iterated dominance.  
     - *Protocol requirement*: Synchronized rounds for fixed-point convergence.  

  2. **Nash Equilibrium**  
     - *Epistemic hypothesis*: Mutual knowledge of rationality + mutual knowledge of strategies.  
     - *Translation*:  
       - Let \(\phi_{\text{strat}}\) = "strategy profile is \(s\)", \(\phi_{\text{rational}}\) = "all agents rational".  
       - Conditions: \(E^k(\phi_{\text{rational}}) \land E^m(\phi_{\text{strat}})\) for \(k, m \geq 2\) (mutual knowledge suffices).  
     - *Model-checking*: Check initial state satisfies \(E^k(\phi_{\text{rational}}) \land E^m(\phi_{\text{strat}})\).  
     - *Load-bearing*: **Mutual knowledge** (finite iteration) + **shared prior** for belief consistency.  

  3. **Correlated Equilibrium**  
     - *Epistemic hypothesis*: Common knowledge of rationality + common prior.  
     - *Translation*:  
       - Mediator = Shared environment broadcasting signals.  
       - Common prior = Shared initial distribution over signals.  
       - CKR: \(C(\text{Rationality})\) given signal updates.  
     - *Model-checking*: Verify \(C(\text{Rationality})\) holds in mediator-extended system.  
     - *Load-bearing*: **Common prior** (shared initial distribution) + **common knowledge**.  

  4. **Sequential Equilibrium**  
     - *Epistemic hypothesis*: Common knowledge of rationality + consistent beliefs off-path.  
     - *Translation*:  
       - Belief system = Conditional probabilities at unreachable information sets.  
       - Consistency = Beliefs derivable as limits of perturbations (trembling-hand).  
       - Sequential rationality = Optimal action at every local state (even unreachable).  
     - *Model-checking*: Verify optimality at *all* information sets under belief constraints.  
     - *Load-bearing*: **Off-path consistency** (even unreachable states) + **common belief in rationality**.  

  ---

  ### Residue Report  
  #### First Suspicion: Common Prior as Shared Initial State  
  **Suspicion**: Common prior has no counterpart beyond shared initial states or fixed environments; agree-to-disagree resembles consensus.  
  **Analysis**:  
  - Common prior requires not just shared initial data but a **shared probability distribution** over the state space. Distributed systems typically assume shared *deterministic* states (e.g., initial configuration), not priors.  
  - Agree-to-disagree (Aumann 1976): Agents with common prior and common knowledge of posteriors cannot disagree.  
  - *Translated claim*: "Agents with shared initial distribution \(\mu\) and common knowledge of posterior beliefs must agree." This is isomorphic to a **probabilistic consensus result** (e.g., synchronous systems with common coins).  
  - **Residue**: Common prior is stronger than shared specification. It assumes Bayesian updating from a joint distribution, absent in fault-tolerant protocols.  
  - **Blind spot?** Yes. Distributed systems lack tools to enforce shared priors; they are exogenous assumptions. Without them, correlated equilibrium fails.  

  #### Second Suspicion: Common Knowledge as Unimplementable  
  **Suspicion**: CKR is like coordinated attack—unattainable asynchronously; retreats to belief hierarchies mimic synchrony relaxations.  
  **Analysis**:  
  - Common knowledge requires simultaneous fixed points, impossible with unbounded delays (Fagin et al. 1995).  
  - Game theory retreats:  
    - **Common p-belief**: Implements *approximate* rationality (e.g., \(p\)-dominance).  
    - **Lexicographic beliefs**: Hierarchies tolerate asynchrony (like eventual consistency).  
  - *Translation*: Common \(p\)-belief is analogous to **probabilistic synchrony** (e.g., \(\epsilon\)-agreement protocols).  
  - **Residue**: The retreat is a genuine weakening for implementability (not a pun). However, common *belief* (probability 1) still requires eventual synchrony for convergence.  
  - **Blind spot?** No. Distributed systems handle this via probabilistic protocols. The translation holds.  

  #### Third Suspicion: Off-Path Beliefs as Unreachable States  
  **Suspicion**: Requiring beliefs off-path violates the "don't-care" principle for unreachable states.  
  **Analysis**:  
  - Game theory insists off-path beliefs ensure **robustness to deviations**. It is fault tolerance: "What if an irrational act (Byzantine action) occurs?"  
  - *Translation*: Off-path beliefs = Defining behavior for **Byzantine or out-of-spec states**.  
  - **Residue**: Verification typically ignores unreachable states; game theory mandates them. This is a **specification gap**—robustness to off-nominal events is underspecified in protocols.  
  - **Blind spot?** Partially. While unreachable states need no *functional* specification, sequential equilibrium demands *belief* specifications. This is a **new requirement** for adversarial resilience.  
  - **Why game theorists care**: Without off-path consistency, equilibria are not immune to trembles or learning.  

  #### Handling the Utility Wrinkle  
  Agents lack explicit utility functions; "rationality" is empirical.  
  - *Epistemic translations*:  
    - Rationality becomes **empirical best-response**: Agents behave *as if* maximizing an implicit utility.  
    - Common knowledge of rationality = Common knowledge of this empirical regularity.  
  - **Viability**: Epistemic characterizations still hold *if* agents’ behavior passes model-checking for rationality. However, without explicit utility, **Nash and sequential equilibria become observational properties**, not design guarantees.  
  - **Residue**: Solution concepts assume rationality is specified, not emergent. This weakens epistemic foundations when rationality is learned.  

  ---

  ### Conclusion: The Deepest Residue  
  **Prior assumption** is the most fundamental gap. Common prior is not derivable from shared specifications; it is a metaphysical commitment to Bayesianism with no distributed-systems analogue. Agree-to-disagree translates to consensus, but the prior itself is irreducible. This exposes a blind spot: protocols cannot *enforce* common priors; they must be assumed.  

  **Final Answer**  
  \answer{prior}
