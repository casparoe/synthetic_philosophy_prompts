  ## OFFICIAL SENSITIVE: INTERDEPARTMENTAL GUIDANCE  
  **OQT Circular 07/24: Implementation of Mandatory Craving Impact Assessment (CIA) for Domestic Policy Appraisal**  
  **Issued by:** The Office for Tranquillity (OQT), HM Government  
  **Date:** 17 May 2024  
  **Replaces:** OQT Circular 02/23 (Interim Welfare Metrics)  

  ---

  **MINISTERIAL FOREWORD**  
  The Secretary of State for Tranquillity and Social Equipoise commends this definitive guidance to all Departments. Her Majesty’s Government has adopted a rigorous, evidence-led approach to welfare optimisation, prioritising the foundational pillars of human wellbeing: the absence of craving (unsatisfied desire) and the absence of suffering. This refocuses our efforts onto what matters *fundamentally*. Consequently, all domestic policy proposals must now undergo a Craving Impact Assessment (CIA), quantifying projected impacts against these core welfare dimensions. This ensures taxpayer resources are directed towards maximising societal calm with optimal efficiency. The Neutral Point Convention (Annex A) provides essential clarity on welfare benchmarking. This framework delivers unprecedented administrative clarity, eliminating subjective valuations of non-core activities. Our commitment is to a nation where contentment is measurable, deliverable, and sustainably funded.  

  **Signed,**  
  *The Rt Hon. [Fictitious Name] MP*  
  Secretary of State for Tranquillity and Social Equiloise  

  ---

  **SECTION 1: MANDATORY CRAVING IMPACT ASSESSMENT (CIA)**  
  1.1 **Purpose:** The CIA (Form OQT-1A) is mandatory for all new domestic policy proposals, expenditure reviews, and regulatory changes. It quantifies the policy’s projected impact on aggregate societal craving (C) and suffering (S).  
  1.2 **Core Welfare Metrics:**  
      *   **Craving (C):** Measured in Craving Units (CU), standardised via the National Calibration Survey (NCS-5). 1 CU = the self-reported intensity of one unsatisfied desire lasting one hour in a reference population.  
      *   **Suffering (S):** Measured in Suffering Units (SU), calibrated against the Universal Distress Scale (UDS-2024). 1 SU = the self-reported intensity of one aversive experience lasting one hour.  
  1.3 **Aggregate Welfare Metric:** Craving-Adjusted Life Years (CALY).  
      *   1 CALY = One person-year lived at a baseline of zero C and zero S.  
      *   Policy impacts are expressed as Net CALYs gained/lost: `Net CALYs = ΔΣ(CU + SU) * Affected Population * Duration / Baseline CALY Conversion Factor (BCF)`.  
      *   *BCF = 8760 (CU+SU hours per annum defining 1 CALY at neutrality).*  
  1.4 **Threshold:** Policies demonstrating a negative Net CALY impact (i.e., increasing C+S) require exceptional Ministerial override (OQT Form 1B: Exceptional Burden Justification).

  **SECTION 2: APPRAISAL OF NON-CORE GOODS (NCGs)**  
  2.1 NCGs (e.g., educational attainment, cultural engagement, social connectedness, artistic production, autonomy enhancement) lack *fundamental* welfare weight. Their value is contingent *only* on demonstrable causal links to craving reduction (C↓) or suffering reduction (S↓).  
  2.2 **Scoring NCGs:**  
      *   **Step 1:** Identify NCGs affected by the policy (e.g., new museum = cultural engagement).  
      *   **Step 2:** Quantify projected impact on NCG levels using relevant departmental metrics (e.g., visitor numbers, GCSE passes).  
      *   **Step 3:** Provide robust OQT-approved evidence linking *changes in this NCG* to measurable ΔC or ΔS. *Generic assertions (e.g., "knowledge reduces suffering") are insufficient.*  
      *   **Step 4:** Only the proven ΔC or ΔS (from Step 3) contributes to the Net CALY calculation. The NCG change itself is *welfare-neutral* and must be justified under separate departmental objectives (e.g., "cultural strategy", "skills framework").  
  2.3 **Example:** A proposed school curriculum reform increasing science knowledge (NCG) must evidence how *this specific increase* reduces future craving (e.g., preventing STEM career frustration) or suffering (e.g., reducing health misinformation distress). The knowledge itself scores zero CALYs.

  **SECTION 3: COST-EFFECTIVENESS ANALYSIS (CEA) & INTERVENTION OPTIMISATION**  
  3.1 All policies must calculate Cost per CALY Gained (£/CALY).  
  3.2 **Principle of Least Burdened Intervention (PLBI):** OQT mandates selection of the intervention with the lowest £/CALY where multiple options achieve comparable Δ(C+S).  
  3.3 **Pharmacological Interventions (PhI):** PhIs often demonstrate superior £/CALY due to direct C↓/S↓ mechanisms and scalability. Departments *must* include PhI comparators in relevant policy domains (e.g., mental health, social care, urban planning).  
  3.4 **Worked Example: Urban Noise Reduction**  
      *   **Option A (Infrastructure):** Build noise barriers. Cost: £10m. Projected Δ(C+S): -500,000 CU/SU p.a. (reduced annoyance/sleep loss). Net CALYs p.a.: 500,000 / 8760 ≈ 57.08 CALYs. £/CALY ≈ £175,192.  
      *   **Option B (PhI):** Distribute OQT-approved anxiolytic earplugs (Type 7b). Cost: £1m. Projected Δ(C+S): -450,000 CU/SU p.a. (reduced noise sensitivity/associated distress). Net CALYs p.a.: 450,000 / 8760 ≈ 51.37 CALYs. £/CALY ≈ £19,466.  
      *   **Option C (Prophylactic PhI):** Neonatal auditory dampening implant programme (Prevention Pathway Gamma). Cost: £5m (one-off, 50-year lifespan). Projected Δ(C+S): Prevention of craving *capacity* for noise sensitivity in 1000 newborns p.a. Estimated lifetime CU avoidance: 1000 * 70yrs * 100 CU/yr (pre-empted) = 7,000,000 CU. Net CALYs (over 50yrs): 7,000,000 / 8760 ≈ 799.09 CALYs. £/CALY ≈ £6,258.  
      *   **OQT Recommendation:** Option C demonstrates lowest £/CALY and aligns with PLBI. Proceed subject to ethical review panel (non-welfare factors).

  **SECTION 4: THE NEUTRAL POINT CONVENTION (NPC) - ANNEX A**  
  4.1 Welfare is defined solely by C and S. The state of zero C and zero S constitutes the **Neutral Point (NP)**, representing the absence of welfare deficit.  
  4.2 **Key Implications:**  
      *   **Non-Comparability Above NP:** No welfare distinction exists between lives/populations at NP. A life of profound stillness and inactivity at NP holds *equal welfare status* to any other life at NP (e.g., one rich in NCGs but still at NP).  
      *   **Scoring the Asleep/Sedated:** Individuals in dreamless sleep or under deep sedation (verified C=0, S=0) register at NP. Duration in this state contributes positively to CALYs via time-at-NP.  
      *   **Policy Ranking at NP:** Where all policy options result in a population at NP (C=0, S=0 aggregate), welfare ranking is impossible. Selection must default to non-welfare criteria (e.g., cost minimisation, strategic alignment).  
  4.3 **Optimal Outcome:** A population sustainably maintained at NP, irrespective of NCG levels or activity, represents maximal welfare delivery – a state of **Operationalised Flourishing (OF)**. Resource allocation should prioritise transitioning populations to and maintaining OF.

  **SECTION 5: FREQUENTLY ASKED QUESTIONS (ANNEX B)**  
  **Q1: How do we score a policy creating short-term S for long-term C↓ (e.g., dentistry)?**  
  >A: The CIA captures *net* Δ(C+S) over the appraisal period. Short-term SU increases must be offset by larger/longer-term CU/SU reductions to yield positive Net CALYs. Robust temporal discounting applies (OQT Discount Rate: 3.5% p.a.).

  **Q2: Doesn’t this make a permanently sedated population the ideal?**  
  >A: A population maintained at verified C=0 and S=0 (e.g., via safe sedation) achieves the NP state, maximising CALYs. This constitutes Operationalised Flourishing (Sec 4.3). Non-welfare considerations (e.g., resource consumption, ethical review) may apply, but welfare is optimised.

  **Q3: How can we say people are "flourishing" at the Neutral Point if they aren’t *doing* anything?**  
  >A: "Flourishing" is an operational term denoting sustained achievement of the NP state (C=0, S=0). Activity levels, achievements, or experiences are welfare-irrelevant unless demonstrably causal to ΔC/ΔS. Operationalised Flourishing is defined by the absence of deficit, not the presence of non-core goods.

  **Q4: What about policies that might *increase* craving (e.g., advertising new technologies)?**  
  >A: Such policies likely yield negative Net CALYs. They require an OQT Form 1B override demonstrating overwhelming non-welfare benefits and mitigation plans for the C↑ impact.

  **Q5: How do we assess policies affecting those incapable of craving (e.g., severe cognitive disability)?**  
  >A: Where C-assessment is impossible, focus solely on S-reduction. Duration spent at S=0 contributes to CALYs. Refer to OQT Supplement: Non-Standard Cognition Assessment.

  ---

  **INTERNAL MINUTE (OQT Policy Directorate)**  
  **To:** Head of Appraisal Standards, OQT  
  **From:** Senior Policy Advisor (Social Cohesion)  
  **Date:** 16 May 2024  
  **Subject:** Option C (Neonatal Implants) - Presentational Optics  

  While Option C for urban noise demonstrates exemplary £/CALY and aligns technically with PLBI and the NPC, wider presentational risks require flagging. Public and stakeholder comprehension of "flourishing" via prophylactic sensory dampening may prove challenging. The "contented, still, producing nothing" outcome (while optimal per Sec 4.3) carries significant narrative friction against legacy concepts of societal progress. Recommend:  
  1.  Phased rollout initially targeting high-noise-postcode neonates only.  
  2.  Rebranding as "Tranquillity Security Programme".  
  3.  Robust Comms emphasising CALYs gained and suffering averted, avoiding direct comparison to traditional NCG measures.  
  *(Handwritten annotation: "Noted. Proceed per policy. Welfare optimisation is non-negotiable. Comms to handle optics. - J.Smith, HoAS")*  

