  I got called up for jury service last month — two days on a fraud trial, mostly boring, slightly terrifying — and I re-watched 12 Angry Men right afterwards, and now I can't stop seeing it as a case study in herding. Read it for me through information cascades: the opening vote is 11–1 by secret ballot, so each juror observes only the action and not the private signal behind it, which is supposedly the textbook setup for a cascade; and as I half-understand the model, once one gets going later people rationally stop trusting their own signal, so adding more jurors doesn't make the verdict any more likely to be right, and cascades are oddly fragile, breakable by a trickle of new public information. Is that fair, and does the film actually illustrate it? The votes turn one juror at a time, and it looks to me like juror 8 makes two quite different kinds of move: producing the identical knife is new public information, a genuine cascade-breaker, while his flat refusal to go along isn't information at all — he mostly just says he isn't sure. I've started calling that the licensing role of dissent: what he supplies is the signal that someone will absorb the cost of going first, which lets the others finally voice doubts they'd been sitting on quietly. Does anything like that have a home in the rational herding models, or is it the reputational / preference-falsification story, or neither? And be honest about where the film resists the reading — is juror 3's stubbornness definately something the models have no vocabulary for? Tell me how confident you are in what you claim and single out the one point you're least sure of, and write it in British English.
