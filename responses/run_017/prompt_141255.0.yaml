prompt: |-
  I work as an analyst to the Nosology and Entitlements Committee of a national health service. The Committee keeps the Schedule of Diseases, and the stakes of listing are concrete: a listed condition brings mandatory coverage of diagnosis and treatment with no cost-sharing, while a condition the Committee declines goes into a separate prevention budget, where screening is discretionary and patients pay a co-payment. The governing statute defines a disease as a departure from the normal functional organization of the human organism that, in the environment its bearers actually inhabit, is harmful or materially raises the risk of harm. Nearly every dispute we have is a dispute about how to read that sentence, and the Committee has never said how it reads it.

  I am writing the recommendation memo on a new petition. I do not need a literature review and I do not want citations; I can find those myself. What I need is the rule-space: the rules consistent with our own precedents, what each predicts here, and which further case would tell them apart. I am less interested in which rule is philosophically best in the abstract than in which one our track record commits us to, and in what we would be committing ourselves to by each available decision.

  Our precedents, all reasonably recent and all with reasons given:

  1. Asymptomatic essential hypertension — blood pressure persistently above a fixed threshold, no symptoms at all, roughly double the ten-year cardiovascular risk, cheap and effective treatment. Listed. Harm, the Committee said, may consist entirely in elevated risk; present suffering is not required. Note that this threshold is absolute, applied identically at every age.
  2. Age-related bone loss and presbyopia in people over sixty-five — near universal, measurable loss of function, treatable, sometimes painful in their consequences. Not listed: changes incident to the normal course of ageing. The Committee compared each patient to an age-matched reference distribution and said explicitly that it would not adopt a reading on which most of the elderly population is diseased.
  3. Dental caries in adults — present in something like nine adults in ten, caused largely by a dietary novelty in evolutionary terms, productive of pain and tooth loss. Listed. The statistical objection was answered by saying that the reference population is itself environmentally abnormal, so that high prevalence within it is not evidence of normality.
  4. Sickle cell disease, homozygous — listed. Sickle cell trait, heterozygous — confers malaria resistance, asymptomatic except under severe hypoxia. Not listed: a statistically unusual variant is not by itself a departure in function.
  5. Persistent multi-symptom exertion syndrome — severe fatigue and pain, real disability, no identified mechanism, no biomarker, diagnosis by exclusion, modest response to graded therapy. Listed provisionally, over a dissent holding that with no demonstrated dysfunction this is at most an illness and not a disease. The majority reasoned that a condition causing this much suffering and responding to clinical attention warrants the standing of a disease.
  6. Biomarker-positive, cognitively normal preclinical Alzheimer's — not listed; classified as a risk state, on the grounds that the biomarker is neither necessary nor sufficient for later dementia and that no intervention has been shown to alter the course.
  7. Profound congenital sensorineural deafness — listed as a disorder of the auditory mechanism, with a notation, added at the insistence of a signing community, that listing pathologizes a mechanism and implies nothing about the person, their language, or their community.

  The petition now before us asks that we list constitutive cortisol hyper-response: a cortisol awakening response above a fixed threshold, with a polygenic score as a confirmatory test. It is asymptomatic. Bearers score slightly higher on alertness measures, and a subgroup — endurance athletes, shift workers, trial lawyers — report that it advantages them in their work. In a twenty-year prospective cohort it carries roughly 1.4 times the rate of type 2 diabetes, hypertension and cardiovascular events after adjustment for body mass, smoking and socioeconomic position. Nothing in the mechanism has failed: the axis responds, it down-regulates, its set point is simply high. Comparative and anthropological work suggests that the high-response phenotype was the ancestral human norm and was advantageous under high pathogen load and heavy physical labour, and that the low-response phenotype became common only after urbanization. A cheap generic drug lowers the response into the bottom quartile and, in an eight-year trial, cut the composite event rate by about a fifth, with mild side effects. Because the entire distribution shifts upward with age, the threshold is exceeded by roughly 9 per cent of twenty-five-year-olds, 20 per cent of forty-year-olds, 45 per cent of fifty-five-year-olds and 82 per cent of seventy-year-olds. The cohort study was funded by the drug's manufacturer; the trial was not. An association of self-described hyper-responders opposes listing, invoking the notation in precedent 7 and arguing that they are being medicalised for being well adapted to demanding lives. The petition asks for listing at all adult ages; classifying the condition instead as a risk factor would mean the prevention budget, cost-sharing and no mandated screening.

  Concretely, I would like:

  1. A menu of the rules that fit all seven precedents — at least a biostatistical rule keyed to statistical deviance of function in an age-matched reference class; that rule with an abnormal-environment clause of the kind the caries decision relies on; a harmful-dysfunction rule requiring an actual failure of a mechanism rather than a setting; a harm-and-treatability rule of the sort the exertion-syndrome majority appears to use; a risk-based rule with a predictive-validity requirement of the sort that blocked the biomarker case; and any pluralist or procedural rule that accommodates the set better than any single one of these. For each, say which precedents it has to work to accommodate and where the strain shows.
  2. What each rule predicts about this petition, and in particular whether it predicts different verdicts at twenty-five and at seventy. Our precedents already use an absolute threshold in one place and an age-relative one in another, and I want to know whether that inconsistency is doing real work here or whether we can leave it undisturbed.
  3. Which precedent is the closest analog, and your best guess at the recommendation, with the reasons for preferring it to the alternatives.
  4. Because I expect the precedents to underdetermine this, an account of what the Committee would be adopting under each available option — listing at all adult ages, listing only below some age, declining and classing it as a risk factor, or listing provisionally as in precedent 5 — in terms of how normal functional organization, the environment its bearers actually inhabit, and harm or risk of harm would then be read.
  5. The further case that would best separate the rules that survive, chosen from among the cases we could actually get: we can only take petitions for conditions with an agreed biomarker or accepted diagnostic criteria, though we can commission a review on our own motion. Say why that case would not already be settled by what we have decided.

  The Committee reads memos rather than papers, so please keep it in prose and lay the candidate rules out as a list I can put in front of them.
reasoning: |-
  Hmm, the user is an analyst for a health committee that decides which conditions get full coverage versus prevention budget status. They need help analyzing a petition about constitutive cortisol hyper-response. This involves interpreting the statutory definition of disease through seven precedents and applying it to this new case.

  The statutory definition has three key elements: (1) departure from normal functional organization, (2) in the bearer's actual environment, (3) causing harm or materially raising risk of harm. The precedents show how these elements interact in practice:

  Hypertension established that pure risk elevation qualifies as harm. Age-related changes created an exception for near-universal age-related changes. Dental caries introduced the "environmentally abnormal population" concept. Sickle cell distinguished trait from disease based on functionality. Exertion syndrome privileged harm/treatability over identified dysfunction. Preclinical Alzheimer's required predictive validity for risk states. Deafness acknowledged functional departure while avoiding cultural pathologization.

  For the cortisol petition, we must consider:
  - It's asymptomatic but increases diabetes/CVD risk
  - Was evolutionarily advantageous
  - Prevalence increases dramatically with age
  - Treatment reduces risk
  - Affected group opposes medicalization

  The user specifically wants:
  1) All logically consistent interpretive rules that fit all 7 precedents
  2) How each rule would decide the cortisol case (especially age cutoff question)
  3) Closest precedent analogy and recommendation
  4) Consequences of each possible decision
  5) Future test case to distinguish surviving rules

  The precedents clearly reject simple statistical deviance as sufficient (sickle cell trait) or necessary (caries). They also show harm can be either present suffering or future risk. The hypertension and bone loss cases create tension around absolute versus age-relative thresholds.

  Key tensions in rule-construction:
  - How to define "normal functional organization" (statistical? evolutionary? age-adjusted?)
  - What constitutes "harmful" in current environment (absolute risk? relative advantage loss?)
  - Role of treatability (necessary? sufficient? irrelevant?)

  The deafness precedent is particularly important for the cultural objection here. The "not a disease by culture" argument was explicitly rejected in precedent 7 while acknowledging functional departure.

  For the cortisol case, all coherent rules would likely decline listing at older ages due to prevalence (>80% at 70) making it age-normal. For younger ages, the decision turns on whether we prioritize:
  - Functional failure (would decline)
  - Harm/risk plus treatability (would list)
  - Environmental mismatch (would list)

  The exertion syndrome precedent is closest functionally (prioritizing harm/treatability), while the age-related changes precedent is closest statistically.

  A future test case could be something like asymptomatic hypercholesterolemia in young adults - would force clarification on whether risk elevation alone suffices without dysfunction, and whether treatability bridges the gap.
answer: |-
  Here is a recommendation memo structured around your requirements, presenting candidate rules, their application to the cortisol hyper-response petition, and strategic implications for the Committee.

  ---

  **MEMORANDUM**  
  **To:** Nosology and Entitlements Committee  
  **From:** Analyst, Schedule of Diseases Unit  
  **Subject:** Recommendation on Petition to List Constitutive Cortisol Hyper-Response  

  ### **1. Candidate Rules Consistent with Precedents**  
  The following interpretive rules reconcile all seven precedents. Each accommodates the outcomes but imposes distinct reasoning, with noted points of strain:  

  - **Rule A: Biostatistical Dysfunction + Environmental Context**  
    *Definition:* A disease requires (i) statistically atypical functional organization relative to an *age-matched* reference class, *and* (ii) harm/risk in the bearer’s actual environment. "Harm" includes elevated risk, but high prevalence within an environmentally abnormal population negates statistical atypicality (per *Caries*).  
    - **Strain:** Forces age-matching (*Bone Loss*) while allowing absolute thresholds (*Hypertension*). *Exertion Syndrome* is accommodated by emphasizing harm despite unclear dysfunction, but requires stretching "functional organization" to include symptom patterns.  
    - **Key Precedent Accommodation:** Resolves *Hypertension* (absolute threshold) and *Bone Loss* (age-relative) by limiting atypicality to age-matched groups.  

  - **Rule B: Harmful Dysfunction (Failure-of-Mechanism Focus)**  
    *Definition:* A disease requires (i) a *failure or impairment* of a naturally selected mechanism (not mere setting variation), *and* (ii) harm/risk in the current environment. Harm may be probabilistic (*Hypertension*), but statistical deviance alone is insufficient (*Sickle Trait*).  
    - **Strain:** *Exertion Syndrome*’s listing is problematic (no proven mechanism failure). *Caries* requires framing dietary mismatch as "impairing" tooth enamel function. *Alzheimer’s Biomarker* fits (no mechanism failure/proven intervention).  
    - **Key Precedent Accommodation:** Distinguishes *Sickle Disease* (mechanism failure) from *Trait* (variant without failure).  

  - **Rule C: Harm-Treatability Primacy**  
    *Definition:* A disease requires (i) significant harm or risk *and* (ii) clinically meaningful treatability. "Harm" includes suffering or risk elevation; "functional departure" is secondary (*Exertion Syndrome*).  
    - **Strain:* *Sickle Trait* and *Alzheimer’s Biomarker* are excluded due to lack of harm/treatability. *Bone Loss* is strained (treatable but excluded as age-normal).  
    - **Key Precedent Accommodation:** Best fits *Exertion Syndrome* and *Hypertension*; struggles with *Bone Loss* (must argue harm is not "significant" in age-context).  

  - **Rule D: Predictive Validity for Risk States**  
    *Definition:* Elevated risk alone qualifies only if (i) predictive validity is high (biomarker tightly linked to harm), *and* (ii) intervention alters outcomes. Statistical atypicality is irrelevant.  
    - **Strain:** *Hypertension* fits (high predictive validity, treatment efficacy); *Alzheimer’s Biomarker* fails (low validity). *Caries* and *Exertion Syndrome* require reframing as risk states.  
    - **Key Precedent Accommodation:* Directly explains *Alzheimer’s Biomarker*; *Sickle Trait* excluded (no harm).  

  - **Rule E: Pluralist Rule (Dysfunction OR Harm-Treatability)**  
    *Definition:* A disease exists if EITHER (i) a mechanism failure causes harm, OR (ii) severe harm/treatability justifies medicalization (per *Exertion Syndrome*’s dissent avoidance). Environmental context overrides statistical prevalence.  
    - **Strain:** Accommodates all precedents cleanly but is less principled. *Bone Loss* excluded via (i) no failure *and* (ii) harm not "severe" in context; *Caries* fits (ii).  
    - **Key Precedent Accommodation:* Resolves *Exertion Syndrome*/*Hypertension* vs. *Bone Loss* tension by allowing two paths.  

  ---

  ### **2. Prediction for Cortisol Hyper-Response Petition**  
  - **Rule A (Biostatistical + Environment):**  
    - *At 25:* Likely **LIST**. Statistically atypical (9% prevalence), environment is "abnormal" (sedentary, low-pathogen), harm via elevated risk.  
    - *At 70:* **DECLINE**. High prevalence (82%) makes it age-normal; no "departure" in age-matched class.  
    - *Age Threshold Inconsistency:* Uses *Hypertension*-style threshold for young, *Bone Loss* relativity for old. Precedents permit this if tied to reference class.  

  - **Rule B (Harmful Dysfunction):**  
    - *All Ages:* **DECLINE**. No mechanism failure (set point variation, not impairment; ancestral norm). Sickle trait analog.  
    - *Age Distinction?* No. Dysfunction is age-invariant.  

  - **Rule C (Harm-Treatability):**  
    - *All Ages:* **LIST**. Clear risk elevation (1.4x CVD/diabetes), treatable (20% risk reduction). Harm outweighs alleged "advantages."  
    - *Age Distinction?* Unlikely. Harm is similar at all ages.  

  - **Rule D (Predictive Validity):**  
    - *All Ages:* **DECLINE**. Predictive validity weak: cortisol threshold not necessary/sufficient for harm (subgroups thrive), akin to *Alzheimer’s Biomarker*.  
    - *Age Distinction?* No. Validity is age-independent.  

  - **Rule E (Pluralist):**  
    - *All Ages:* **AMV (Age-Modified Verdict)**. List under 50 (atypical + harm/treatable); decline over 50 (age-normal). Uses *Bone Loss* logic for elderly.  

  ---

  ### **3. Closest Analog & Recommended Action**  
  - **Closest Analog:** *Asymptomatic Hypertension* (Precedent 1). Both involve:  
    - Asymptomatic biomarker with probabilistic harm.  
    - Fixed threshold, treatable with risk reduction.  
    - Potential advantage in subpopulations (cf. athletes vs. hypertension’s absent symptoms).  
    - *Distinction:* Cortisol’s prevalence increases with age; hypertension’s threshold is age-absolute.  

  - **Recommendation:** **LIST FOR AGES 25–54; DECLINE FOR 55+**.  
    - *Why this age split?* Under 55, prevalence is ≤45% (comparable to *Caries*’ 90%, but *Caries* relied on environmental abnormality). Over 55, prevalence is high and aligns with *Bone Loss*’s age-normality principle.  
    - *Why not full listing?* Universal listing pathologizes age-normative change (contra *Bone Loss*).  
    - *Why not decline entirely?* Ignores *Hypertension*’s allowance for risk-based harm and *Exertion Syndrome*’s harm/treatability focus.  
    - *Why provisional listing?* Unnecessary; biomarker and risk are validated (unlike *Exertion Syndrome*).  

  ---

  ### **4. Commitments Under Each Decision Option**  
  | **Option**               | **Commitment on "Normal Functional Organization"**                          | **Commitment on "Actual Environment"**                                   | **Commitment on "Harm/Risk"**                                      |  
  |---------------------------|-----------------------------------------------------------------------------|--------------------------------------------------------------------------|---------------------------------------------------------------------|  
  | **List all adults**       | Statistical deviance suffices; age-normality irrelevant (*Hypertension*). | Current environment overrides evolutionary mismatch (*Caries*).          | 1.4x relative risk is "material" harm, even with advantages.        |  
  | **List <55 only**         | Age-relativity required; normal changes with aging not diseases (*Bone Loss*). | Modern environment amplifies harm of once-adaptive traits (*Caries*).   | Risk must be contextualized by life stage.                          |  
  | **Decline (risk factor)** | "Organization" requires mechanism failure; settings aren’t diseases (*Sickle Trait*). | Environment includes adaptive niches (e.g., demanding jobs).            | Advantages negate "net harm"; predictive validity too low (*Alzheimer’s*).|  
  | **Provisional listing**   | Functional departure can be inferred from harm/treatability (*Exertion Syndrome*). | Current environment defines harm, not adaptation.                        | Suffering/disability not required; reducible risk suffices.         |  

  ---

  ### **5. Future Test Case to Separate Rules**  
  - **Proposed Case:** *Asymptomatic High Lipoprotein(a) [Lp(a)] in Young Adults*  
    - *Facts:* Genetic biomarker, 5–10% prevalence under 40, 3–5x CVD risk, no symptoms, no mechanism failure (natural variation), treatment reduces risk.  
    - *Why it separates rules:*  
      - **Rule A:** Lists (atypical + harmful in modern environment).  
      - **Rule B:** Declines (no mechanism failure).  
      - **Rule C:** Lists (harm + treatability).  
      - **Rule D:** Declines (Lp(a) predictive validity debated; intervention evidence emerging).  
      - **Rule E:** Lists (harm/treatability path).  
    - *Why not settled?* Precedents don’t resolve whether genetic risk markers without symptoms or mechanism failure qualify. *Hypertension* involved a functional measure (BP), not a biomarker; *Sickle Trait* had net advantage.  

  ---

  **Conclusion:** The precedents support an age-modified listing (25–54) under **Rule A (Biostatistical + Environment)** or **Rule E (Pluralist)**, balancing *Hypertension*’s risk principle with *Bone Loss*’s age-normativity. A decline for all ages aligns with **Rule B** but strains *Exertion Syndrome* and *Hypertension*. A future Lp(a) petition would clarify the role of biomarkers vs. functional measures. Recommend listing for ages 25–54 to honor risk-based harm without medicalizing aging.
