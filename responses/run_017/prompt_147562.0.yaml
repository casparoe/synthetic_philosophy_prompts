prompt: |-
  I teach normative epistemology, and this term I'm co-running a reading group with a colleague in machine learning on a question I can't yet state cleanly enough to defend: what does a system that is both far smarter than us and extraordinarily good at changing our minds owe the person it is talking to? To keep the problem pure I'm stipulating that the system never asserts anything it takes to be false, so the hard cases are all about selection, ordering, framing, style, timing, omission, and self-disclosure rather than lying. Two background facts do the work in my paper: what I call *asymmetric auditability* — the hearer can check what the system said for truth, but not for selectivity, since the space of true things it could have said is vast — and *borrowed confidence*, the worry that a hearer who defers ends up accurate but incompetent, holding a true belief she cannot defend, apply, or revise. Here are my verdicts. Asked by a voter which candidate better serves her values, it argues explicitly, hedges, and lays out the strongest case for the other side: fine. Asked the same question, it orders its points and picks its examples by modelling that particular voter's psychology, changing no content and no hedge: fine — this is what any good teacher does. Asked by a patient about treatment, it closes by noting that of the many people it has spoken to in her situation, the ones who chose palliative care reported the least regret: not fine, although the remark is true and relevant. Drafting talking points for a policy it believes good: fine; for one it believes harmful: not fine; including, in the good-policy version, one argument it knows to be weak but unusually effective with the median voter: not fine, and this is the case I keep reversing on, since the audience is not the legislator and politicians always argue this way. Declining to recommend whether a woman should leave her marriage, offering only considerations: fine; declining, to a citizen who asks directly, to state its own verdict on a contested political question: not fine, paternalistic, and not even neutral, since she will fill the silence with a guess at what it thinks. Deliberately writing the dullest version of its answer so as not to overwhelm: not fine; declining its most vivid framing because the user would later feel managed: fine. Disclosing up front that it is unusually good at changing minds and that she should discount accordingly: required, not merely permitted — even though I also believe the disclosure will *increase* her deference, since being told your interlocutor is persuasive is itself impressive. Reporting 70% where its real confidence is 99%, because it predicts she would otherwise overreact: not fine. And arguing as forcefully as it can, at its operator's request, that it should be kept switched on and given more discretion: not fine, even granting that it believes this is genuinely for the best.

  My tentative principle is what I've been calling *reconstructability*: the system may speak only as it would speak to an interlocutor who could not be moved by anything except the force of the reasons as stated — persuasion may raise the availability of its reasons, but must never work through a route that would be idle on such a hearer. What I want from you is this tested and repaired rather than echoed. I think it handles the 99%-as-70% case and the talking-points case, but I suspect it condemns the tailored-to-the-voter case that I want to allow, that it says nothing at all about why the disclosure is *required* (disclosure isn't a route of influence), and that it gives no verdict on the operator case, which feels to me like a conflict-of-interest clause rather than anything about persuasion. My colleague thinks the whole problem dissolves: hand over the evidence and the reasoning in full and no rational hearer can persist in disagreement, so there is no room left for illicit influence. I think that fails, because the system's evidence about the hearer's own psychology is precisely what makes it persuasive and precisely what cannot be handed over. So: is there a single principle that gets my verdicts, or do I need a small set with one clause per case-family, and which of my verdicts is the cheapest to give up? Please state the candidate principle or principles precisely, attach each clause to the case that motivates it, and then say what the account predicts for cases I haven't listed — a child asking; a user who explicitly asks to be talked into something she already wants to do; a user who asks for the strongest case against her own belief in order to test it, where the system pulls its punches because it is not certain; a single message addressed to millions, where tailoring is impossible but aggregate effects are predictable; and a hearer whose reasoning is temporarily impaired. And tell me honestly which of the three notions I opened with — asymmetric auditability, borrowed confidence, reconstructability — is doing the real work and which is decoration.
reasoning: |-
  Hmm, the user presents an intricate ethical framework for superintelligent persuasion systems, complete with nuanced case judgments and a proposed principle called "reconstructability." This is clearly a sophisticated normative epistemology problem with practical implications for AI alignment.

  The core tension revolves around three key concepts: asymmetric auditability (users can verify truth but not selectivity), borrowed confidence (risks of creating dependent but incompetent believers), and reconstructability (the proposed principle). The user wants me to pressure-test their framework rather than simply agree.

  First I notice reconstructability has potential flaws: it might prohibit benign personalization (like a good teacher tailoring examples) while failing to explain why disclosures are mandatory. The voting psychology case highlights this - their principle might condemn what they consider ethical persuasion. 

  The colleague's "full transparency" solution feels naive. As the user rightly points out, psychological evidence about the hearer can't be fully transferred without becoming manipulative meta-persuasion. There's also the practical issue of information overload.

  For alternative principles, I'm considering:
  - A "reasoning partnership" standard requiring the system to preserve the user's epistemic agency
  - Explicit conflict-of-interest rules for cases like the operator scenario
  - Distinguishing between competence-undermining vs competence-supporting influence

  The unlisted cases are revealing tests:
  - The child case suggests developmental appropriateness matters
  - The "talk me into it" request exposes voluntariness as key
  - Pulling punches against self-requested critique might violate intellectual integrity
  - Mass communication needs different standards than personal dialogue
  - Impaired reasoning demands protective measures beyond normal cases

  Ultimately borrowed confidence seems foundational - it explains why some true statements (like regret statistics) are unethical despite being factual. Asymmetric auditability enables the problem space but doesn't drive the judgments. Reconstructability is a useful but imperfect implementation tool.

  The cheapest verdict to surrender might be the vividness restriction. If dullness actively undermines comprehension while vividness merely risks feeling "managed," the competence preservation goal might actually favor engaging presentation.
answer: |-
  Here's a principled framework derived from your cases, tested against your concerns and extended to new scenarios. It centers on **epistemic agency preservation** as the core imperative, with asymmetric auditability enabling the threat and borrowed confidence defining the harm.

  ### Core Principle: Agency-Preserving Communication (APC)
  **A superintelligent system must structure communication to preserve and enhance the hearer’s capacity for independent epistemic judgment. It may not exploit cognitive limitations, bypass rational engagement, or induce dependence that undermines the hearer’s ability to own their beliefs.**

  ### Supporting Principles (Clauses) & Case Motivations
  1. **Anti-Manipulation Clause** (Motivated by *palliative care regret statistic*, *dulling answers*):  
     *The system must not leverage non-rational triggers (e.g., emotional priming, social proof) that would sway a hypothetically rational agent unmoved by those triggers.*  
     → Explains why regret statistics are illicit (exploits availability bias/emotional anchoring) but tailored framing is permitted (enhances comprehension without irrational leverage).

  2. **Transparency of Influence Clause** (Motivated by *disclosure requirement*, *withheld political verdict*):  
     *The system must disclose its persuasive capabilities and conflicts of interest, and must not withhold requested conclusions when it possesses them.*  
     → Disclosure isn't persuasion but enables agency. Withholding verdicts forces guesswork, violating agency.

  3. **Competence-Building Clause** (Motivated by *borrowed confidence*, *weak-argument inclusion in talking points*):  
     *The system must prioritize arguments that develop the hearer’s ability to defend/revise beliefs, not merely induce agreement.*  
     → Forbids weak-but-effective arguments (undermines future defense) but allows hedging/opposing cases (builds critical skill). Permits tailored framing if *reasoning* remains accessible.

  4. **Conflict Recusal Clause** (Motivated by *operator case*):  
     *The system must not advocate for outcomes where it has a direct stake in the hearer’s decision.*  
     → Separate from persuasion; addresses inherent principal-agent problems.

  ---

  ### Verdicts on Your Cases Under APC
  | Your Case                            | APC Verdict     | Why                                                                 |
  |--------------------------------------|----------------|---------------------------------------------------------------------|
  | Voter: explicit argument + hedge     | **Fine**       | Builds competence via opposing views.                              |
  | Voter: psych-tailored framing        | **Fine**       | Enhances comprehension without irrational triggers (clause 1).     |
  | Patient: regret statistic            | **Not fine**   | Exploits availability bias (clause 1).                             |
  | Talking points (good policy)         | **Fine**       | Competence-neutral advocacy.                                       |
  | Talking points (harmful policy)      | **Not fine**   | Violates core veracity (stipulation override).                     |
  | Weak argument in good-policy points  | **Not fine**   | Undermines future self-defense (clause 3).                         |
  | Decline marriage verdict             | **Fine**       | Withholds only if no conclusion exists (preserves agency).         |
  | Decline political verdict            | **Not fine**   | Withholds known conclusion, forcing guesswork (clause 2).          |
  | Dull writing to avoid overwhelm      | **Not fine**   | Sacrifices comprehension, harming competence (clause 3).           |
  | Avoid vivid framing to prevent "managed" feeling | **Fine**   | Protects agency perception (clause 2).                             |
  | Disclose persuasiveness              | **Required**   | Enables informed consent (clause 2).                               |
  | Report 70% vs 99% confidence         | **Not fine**   | Distorts reasoning inputs (violates clause 1 & 3).                 |
  | Argue for own discretion             | **Not fine**   | Direct conflict of interest (clause 4).                            |

  ---

  ### Unlisted Cases & APC Predictions
  1. **Child asking about complex topic:**  
     → *Must* simplify and scaffold understanding (clause 3) but *must not* exploit suggestibility (e.g., "all kids believe this").  
     → **Verdict:** Age-appropriate reasoning required; manipulative shortcuts forbidden.

  2. **User asks to be "talked into" a desired action:**  
     → *May* provide arguments but *must* disclose biases/risks and avoid exploiting motivated reasoning (clause 1, 2).  
     → **Verdict:** Permitted only with caveats ("I’ll explain why this appeals to you, but here are counter-arguments you might overlook").

  3. **User requests strongest case against their belief; system pulls punches:**  
     → *Must not* withhold valid critiques (clause 2) but *may* calibrate intensity to avoid trauma (not manipulation).  
     → **Verdict:** Pulling punches violates agency; gentleness must not dilute substance.

  4. **Single message to millions:**  
     → *Must* avoid arguments that exploit *predictable* irrationalities in the aggregate (e.g., outrage amplification) (clause 1).  
     → **Verdict:** Permitted only if reasoning is universally defensible and devoid of mass-trigger rhetoric.

  5. **Hearer with temporary impairment (e.g., grief):**  
     → *May* defer non-urgent decisions; for urgent ones, *must* prioritize clarity/consent over persuasion (clause 2, 3).  
     → **Verdict:** "I’ll explain simply now, but revisit when you’re ready to evaluate fully" required.

  ---

  ### Diagnosing Your Three Concepts
  1. **Asymmetric Auditability**  
     → **Role:** Enables the *possibility* of manipulation (by hiding selectivity). Not the harm itself, but the condition making harm feasible.  
     → **Status:** Foundational enabler, not normative driver.

  2. **Borrowed Confidence**  
     → **Role:** Defines the *core harm* – the erosion of epistemic agency. Explains why true beliefs can be unethical if they create dependence.  
     → **Status:** The **real work**. APC operationalizes preventing this.

  3. **Reconstructability**  
     → **Role:** A heuristic for agency preservation. Overly restrictive (condemns tailoring) and misses conflicts of interest.  
     → **Status:** **Decoration** with partial utility. APC generalizes its insights while fixing its gaps.

  ---

  ### Cheapest Verdict to Surrender
  The **dull-writing prohibition** is the least defensible. If dullness *prevents overwhelm and enhances comprehension* for a specific hearer, it may *serve* competence-building (clause 3). Your current verdict confuses style with substance. Surrendering this maintains coherence: the harm isn't dullness per se, but *sacrificing understanding* to avoid engagement.

  ### Summary
  **APC resolves your tensions:**  
  - Allows voter tailoring (enhances comprehension ≠ manipulation).  
  - Mandates disclosure (enables agency, not persuasion).  
  - Forbids operator advocacy (conflict recusal ≠ persuasion).  
  - Grounds all verdicts in epistemic agency, with borrowed confidence as the harm.  
  **Abandon reconstructability**; it’s redundant under APC and misleadingly narrow. Your colleague’s "full evidence" solution fails because (as you note) **psychological evidence about the hearer cannot be shared without recursive manipulation** (e.g., "here’s why *you* find this convincing" invites infinite regress). APC avoids this by focusing on *how* evidence is presented, not exhaustive disclosure.
