prompt: |-
  Hi — please act as an expert in philosophy of technology / STS who has also spent real time on public bodies that have to make decisions, not just write about them. Take this seriously: brainstorm two or three candidate procedures before you commit to one, and tell me briefly what you rejected and why, then give me the final version.

  Here's my situation. Last spring the city put concrete planters and bench armrests under the underpass at the end of my street, where two guys had been sleeping for about a year. My neighbour and I had a loud argument about it at a block party, somebody from the councillor's office was there, and somehow that got me appointed to our new Physical & Digital Assets Review Panel. Grand name; we're really a subcommittee of the procurement committee. We meet monthly, get through 8–10 items a sitting, each of us has maybe 20–30 minutes per item, our findings get signed off by the city solicitor and posted on a public register, and we have no budget for consultants. So: real stakes, real deadlines, no theory background on the panel (I'm the closest thing and I'm a retired lab tech), and findings have to survive being read aloud by someone who disagrees with them.

  Our remit is to attach a one-paragraph plain-language "political character finding" to every capital item and software purchase over 25k: does this artifact carry politics, what kind, and how confident are we. Basically we've been asked to operationalise the claim from Langdon Winner's 1980 Daedalus essay that artifacts can have politics — the examples our staff report leans on are the low overpasses on a parkway that keep buses out, and the mechanical tomato harvester that reshaped who could keep farming — plus the harder strand where an artifact's politics come not from anybody's intent but from the kind of social arrangement the thing needs in order to function at all. (Don't just summarise that literature at me; I need something I can run.)

  What I want is a decision procedure, in the order the questions get asked, with what counts as a sufficient answer to each, and these things marked explicitly:

  - where the procedure stops with "no finding" as opposed to "neutral" — our draft keeps conflating those two and the solicitor has already flagged it, because declaring something neutral is itself a claim that has to be defended;
  - where it hands the question to a human being because it's a values call, not a factual one;
  - which steps are judgement dressed up as procedure. Be blunt about that; I'd rather know than pretend.

  Some things our subcommittee has been going round in circles on, and I need you to either build them into the procedure or tell me to drop them:

  1. Our working draft separates three kinds: "loading" (the artifact settles a contest by design), "channeling" (it just changes the cost of a behaviour), and "latent" (no politics until the context shifts — funding dries up, a new bylaw, a different operator). I suspect the first two are the useful distinction and the third is where all our arguments are hiding.
  2. The exit test someone proposed: can the affected person avoid the artifact without giving up a public good they'd otherwise be entitled to? Seems right but I can't tell how to answer it when the answer differs by person.
  3. Nobody on this panel uses a wheelchair, sleeps outside, or drives for a living, and the politics of a thing are usually invisible to the people who don't meet it. Is there a step that fixes that, or do we just accept the blind spot and say so in the finding?
  4. Inherited and orphaned designs: half our items are a spec copied from a provincial highway manual, or a vendor's default settings, or something installed in 1974 by someone who's dead. There's no author to interrogate about intent.
  5. Maintenance and drift: a irrigation system that's only "public" while a contractor is paid to service it; a fountain that runs because a donor's money runs. Who serviced it and what it replaced both seem like they should count.
  6. Time. These things outlive the council that bought them. Should the procedure have a re-review trigger, and on what?

  Then run it on three real-ish cases and give me the actual one-paragraph findings I'd read out:

  (a) the planters and armrests under the underpass — the thing that got me onto this panel, so I have an obvious axe to grind and I need the procedure to not care;
  (b) a citywide rollout of prepaid smart water meters that shut off remotely when the credit runs out, on the vendor's default settings, with an opt-out that costs 40 dollars and a trip to city hall;
  (c) the one I'm dreading — the curb extensions and raised crosswalk our neighbourhood association got installed after a kid was hit on that corner. I knocked on doors for that. I think your procedure is going to tell me it's political too, and if it does I need to be able to say exactly why in a way that doesn't sound like I'm equating it with hostile architecture. If that's where it lands, say so plainly and write the paragraph anyway.

  Finally, and this is the part I most want: a short section on what the procedure cannot do. I already think it can't rank how bad the politics are, and can't tell us whether the politics in question are good ones, but tell me the failure modes I haven't thought of — especially the kinds of items where running the procedure faithfully will produce a confidently worded finding that's actually worthless.
reasoning: |-
  Okay, the user is on a city subcommittee that needs to evaluate the political implications of public assets and tech purchases. They need a practical decision procedure, not just theory. Let me break down their requirements.

  First, they mentioned the panel lacks theory background, faces real deadlines, and findings must be defensible when read aloud by opponents. So the procedure must be straightforward, with clear steps. They also highlighted issues like conflating "no finding" vs. "neutral," which the city solicitor flagged. That distinction is crucial because declaring neutrality is a claim that needs backing.

  Looking at their six sticking points: the "loading/channeling/latent" categories—maybe latent is causing confusion. The exit test about avoiding artifacts without losing public goods seems useful but tricky when answers vary by person. Representation gaps on the panel (no wheelchair users, etc.) need addressing. Inherited designs with no original author, maintenance dependencies, and time-based re-reviews are also concerns.

  The user wants a procedure that handles these. I should consider different approaches. One might be intent-based, focusing on designer motives. But since many designs are inherited, intent is often unknowable, making this approach flawed. Another could be impact-based, looking at who benefits or suffers. However, impacts can be subjective and vary over time, risking inconsistent findings. 

  A better approach might be function-based, examining what the artifact necessitates to operate. This aligns with Winner's idea that artifacts require specific social arrangements. Steps would include identifying essential functions, required social structures, and barriers to access. It tackles inherited designs by focusing on current function rather than original intent. 

  For the exit test, integrating it as Step 4 makes sense—checking if avoiding the artifact forfeits a public good. The representation gap needs a structured vulnerability check (Step 5), using city data or expert testimony since the panel can't consult everyone. 

  Maintenance and drift are covered in Step 6 by assessing dependencies. Time triggers (Step 7) allow re-review if context changes significantly. The procedure stops at "no finding" if essential functions are unclear or impacts are purely speculative, avoiding unsubstantiated "neutral" claims.

  Now, testing with the cases: 

  The underpass planters—function is deterring sleeping. Requires displacing people, creating barriers for homeless. Exit test fails as avoiding it means losing shelter. Finding: political via exclusion. 

  Smart meters—default settings may not consider affordability. Essential function includes payment enforcement. Vulnerable populations (low-income) affected more. Exit test: avoiding costs $40 and effort, losing water access. Finding: political by burdening access. 

  Curb extensions—safety function requires traffic calming, benefiting all. But may impede some mobility devices if not designed well. Exit test: avoiding risks safety, but design should accommodate all. Finding: political if accessibility isn't ensured, but intent is public good. 

  The procedure's limitations: it can't judge morality of politics, quantify harm, handle highly contextual cases well, or predict future changes. Also, it might miss subtle exclusions if vulnerability checks are shallow. 

  Need to ensure the steps are clear, avoid jargon, and explicitly note where judgment is needed (like Step 5's vulnerability assessment). The user needs to trust the process despite personal biases, especially for the curb extensions case where they're invested. Highlighting the necessity of current function over intent should help differentiate from hostile architecture.
answer: |-
  Here’s a decision procedure designed for your panel’s constraints, grounded in STS principles but stripped of academic jargon. I’ll first outline rejected approaches, then the final procedure, test cases, and critical limitations.

  **Rejected Approaches:**
  1.  **Intent-Focused Procedure:** (Asks: "What did designers intend?")
      *   *Why rejected:* Fails on "orphaned designs," vendor defaults, and Winner’s core point that politics often emerge *without* intent. Unworkable for specs copied from manuals.
  2.  **Impact-Focused Procedure:** (Asks: "Who benefits/harms *right now*?")
      *   *Why rejected:* Too subjective and fluid. Requires constant re-review (impractical). Conflates *outcome* with *inherent political character*. A safe crosswalk "harms" speeding drivers but its inherent character is about safety norms.

  **Final Decision Procedure: "Functional Necessity & Access Barrier Test"**
  Focuses on **what the artifact *requires* to function and *what it necessitates* for access.** Based on Winner’s "social arrangements required for function" and your "exit test," but operationalized.

  **Steps (Order Matters):**

  1.  **Define Essential Function(s):** *What is the artifact’s core, non-negotiable purpose?* (e.g., bridge: carry vehicles; water meter: measure/control consumption). *Judgement Call:* Avoid listing secondary effects. *Stop:* If no clear essential function exists → "No Finding."
  2.  **Identify Required Social Arrangements:** *What specific social structures, resources, or behaviors are *absolutely necessary* for this artifact to achieve its essential function?* (e.g., Low bridge: Requires vehicles under height X; Smart meter: Requires pre-payment system, digital access for top-up). *Judgement Call:* Focus on *necessity*, not just common use. *Stop:* If no specific arrangements are identifiable → "No Finding."
  3.  **Analyze Access Barriers:** *Does accessing the artifact’s essential function inherently require resources, capabilities, or statuses that are *unevenly distributed*?* (e.g., Low bridge: Requires owning a private car (not bus); Armrests: Requiring sitting upright excludes lying down; Smart meter: Requires cash flow for pre-pay, digital literacy). *Judgement Call:* Identifies inherent exclusion potential. *Stop:* If access requires nothing specific/uneven → "No Finding" (truly rare!).
  4.  **Apply the "Exit Test":** *Can a person *for whom the barrier is relevant* avoid interacting with this artifact *without forfeiting a core public good or service* they would otherwise reasonably expect?* (e.g., Avoiding low bridge: Forfeits efficient route (public good); Avoiding armrest bench: Forfeits place to sit/rest (public good? Context!); Avoiding smart meter: Forfeits water access (public good)). *Judgement Call:* Defines "core public good/service" contextually. *Stop:* If avoidance is possible *without* forfeiting a public good → Finding: "Latent Political Character (Context-Dependent)". Else → Finding: "Active Political Character".
  5.  **Structured Vulnerability Check (Addressing Blind Spots):** *Based on city data or known groups, does this artifact interact with populations experiencing specific vulnerabilities relevant to Steps 3 & 4?* (e.g., Wheelchair users & curb cuts; Homeless & benches; Low-income & prepay meters). *Action:* Mandate staff report *must* include relevant demographic/service usage data. *Judgement Call:* Panel *must* explicitly consider this data – it doesn't require lived experience, but forces confrontation with likely impacts.
  6.  **Assess Stability Dependencies (Maintenance/Drift):** *Does the artifact’s function *depend* on ongoing, non-guaranteed inputs (funding, specific maintenance, human operation)?* *Finding:* Note if politics are contingent on these (e.g., "Neutral character *if* maintained per spec; latent exclusion risk if funding lapses").
  7.  **Time Trigger Proposal:** *Flag for re-review if:* A significant change occurs in: a) Relevant vulnerability data, b) Laws/regs directly governing the artifact’s use/context, c) The essential service it provides (e.g., water becomes unaffordable), d) Observed patterns of exclusion/conflict.

  **Key Explicit Judgement Points:**
  *   Defining "Essential Function" (Step 1)
  *   Identifying "Necessary Social Arrangements" (Step 2)
  *   Defining "Core Public Good/Service" for Exit Test (Step 4)
  *   Interpreting Vulnerability Data relevance (Step 5)

  **"Neutral" vs. "No Finding":**
  *   **"No Finding":** Used when the procedure stops at Steps 1, 2, or 3 due to lack of evidence or clear necessity (e.g., a basic sewer pipe). *No claim is made.*
  *   **"Neutral":** *Never* used as a finding. It implies a positive assertion of no politics, which is almost impossible to prove. The procedure forces a choice between Active/Latent/No Finding.
  *   **"Latent":** Used *only* if the artifact *could* become political if context changes (Step 4 Exit Test passes *now* but might not later, or Step 6 dependency exists).

  **Applied Findings (1 Paragraph Each):**

  **(a) Underpass Planters & Armrests:**
  > "This installation carries an Active Political Character. Its essential function includes structuring how public space under the bridge is used. The design necessitates sitting upright and prevents lying down, creating an access barrier for individuals needing to rest or sleep. Avoiding this space requires forfeiting access to shelter from the elements, a basic expectation in public infrastructure. This design inherently channels behavior towards exclusion of unhoused individuals."

  **(b) Prepaid Smart Water Meters (Default Settings):**
  > "This system carries an Active Political Character. Its essential function includes remote disconnection based on prepayment. This necessitates continuous payment capability and digital/transport access for top-ups, creating access barriers for low-income or mobility-limited residents. Avoiding the prepay system (via the $40 opt-out) imposes a financial and logistical burden to retain a core public utility (water access). The default settings embed a payment enforcement logic that risks excluding vulnerable populations."

  **(c) Curb Extensions & Raised Crosswalk:**
  > "This safety improvement carries a Latent Political Character contingent on design execution. Its essential function is slowing traffic and prioritizing pedestrian safety at the crossing – a public good. However, the *specific design* (curb extension geometry, ramp placement) necessitates safe navigation by all mobility devices. If not meticulously designed and maintained, it could create access barriers for wheelchair users or others, forcing them to forfeit safe passage. While the *intent* is universally beneficial, vigilance is required to ensure the physical form does not inadvertently exclude."

  **(Note on (c):** The procedure distinguishes it from hostile architecture by focusing on *necessity* and *latency*. Hostile architecture *necessitates* exclusion to function (e.g., armrests prevent lying). The curb extension's *necessary* function is safety; exclusion is a *potential failure mode*, not the core function. Your finding acknowledges this plainly.)

  **What the Procedure CANNOT Do (Critical Limitations):**

  1.  **Moral Judgement:** It identifies *that* politics exist and *how* (exclusion, channeling, dependency), but **cannot** tell you if those politics are "good" or "bad." A speed bump has politics (channels behavior); deciding if that's desirable requires separate democratic debate.
  2.  **Quantifying Harm:** It flags *potential* exclusion or burden, but **cannot** measure the severity, scale, or emotional toll of that impact.
  3.  **Predicting the Future (Precisely):** It identifies latent risks and dependencies but **cannot** foresee all contextual shifts or exactly *when* latent politics will activate.
  4.  **Resolving Value Conflicts:** When steps require judgement (e.g., defining "core public good"), it surfaces the conflict but **cannot** resolve it. That's the panel's job.
  5.  **Capturing Nuanced or Emergent Politics:** It focuses on functional necessity and access barriers. Politics emerging from subtle cultural associations, long-term normalization, or complex system interactions **may be missed**.
  6.  **"Worthless Finding" Trap:** This occurs most commonly with:
      *   **Highly Flexible Artifacts:** Software with vast configurability might show "no finding" at procurement if default settings are neutral *and* essential function is broad (e.g., "data management"). Politics emerge later via *use*.
      *   **Artifacts Dependent on Opaque Systems:** A traffic camera might have "latent" character due to maintenance dependency, but the *real* politics (algorithmic bias, enforcement policy) are hidden within the larger system, making the finding superficial.
      *   **When "Core Public Good" is Vague:** If the Exit Test hinges on an ill-defined good (e.g., is "aesthetic pleasure" from a fountain core?), the finding becomes debatable and weak.
  7.  **Solving the Representation Gap:** Step 5 forces *consideration* of vulnerability data, but **cannot** guarantee the panel fully comprehends the lived experience. Findings should *explicitly note* if reliance on data rather than testimony was a limitation.

  **Use this procedure as a forcing function.** It structures inquiry, exposes necessary judgements, forces consideration of vulnerability, and avoids the "neutral" trap. Its strength lies in making the inherent requirements and barriers of the artifact visible, providing a concrete basis for your paragraph – even when that basis involves unavoidable human judgement. Run it rigorously, document the judgement calls made at each step, and acknowledge its limitations in your findings. Good luck.
