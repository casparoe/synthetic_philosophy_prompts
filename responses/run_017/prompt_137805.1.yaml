answer: |-
  ## Adversarial Collaboration Framing Document: Interpersonal Comparisons of Well-Being

  **Participants:** Comparabilist (C), Scale-Skeptic (S)  
  **Goal:** To clarify the nature and implications of disagreement on the possibility and epistemic status of interpersonal comparisons of well-being (ICWB), particularly concerning levels and differences, for social evaluation.

  ---

  ### I. Agreed Claims
  1.  **Intrapersonal Cardinality:** For any individual, well-being is cardinally measurable. Preferences (or choice behavior) reveal ratios of utility *differences* within that life. Admissible transformations of an individual's utility function are positive affine: *U_i* → *a_i U_i + b_i* (*a_i* > 0).
  2.  **Social Ordering Requires More:** A complete social ordering over states of the world, sufficient for policy choice under uncertainty, requires informational content beyond intrapersonal cardinal utilities alone.
  3.  **Invariance & Scale Types:** The dispute concerns which classes of transformations applied *across* individuals' utility functions leave the social evaluation invariant. This defines the required scale type for ICWB:
      *   **Cardinal Unit Comparability (CUC):** Invariant under *common* scaling (*a_i = a* for all *i*, *b_i* arbitrary). Permits interpersonal comparison of *differences* only. (*S's minimal requirement*)
      *   **Cardinal Full Comparability (CFC):** Invariant under *common* affine transformations (*a_i = a* for all *i*, *b_i = b* for all *i*). Permits interpersonal comparison of both *levels* and *differences*. (*C's requirement*)
      *   **Ratio Scale Comparability (RSC):** Invariant under *common* scaling (*a_i = a* for all *i*, *b_i = 0*). Permits interpersonal comparison of *levels* and *ratios*. (Potentially relevant to some anchors).
  4.  **Distinction: Levels vs. Differences:** Interpersonal comparisons of *levels* ("A is worse off than B") and *differences* ("A's gain exceeds B's loss") are distinct informational requirements. CUC supports difference comparisons; CFC supports both.
  5.  **Epistemic Gradient:** Both agree that assertions about ICWB (levels or differences) have varying degrees of confidence, ranging from near-certainty in extreme cases (e.g., comparing severe chronic pain to mild temporary discomfort) to high uncertainty in nuanced cases.
  6.  **Policy Dependence:** The practical implications of the disagreement depend on the specific policy context and the nature of the well-being changes involved (as illustrated in Section IV).

  ---

  ### II. Disagreements Table

  | Disputed Proposition                                                                                                | Comparabilist (C) Formulation                                                                                                                               | Scale-Skeptic (S) Formulation                                                                                                                                                       | Why Not Merely Verbal                                                                                                                        |
  | :------------------------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Ontology of Level Comparisons:** Do facts exist fixing the truth value of "A is at a lower level of well-being than B" independent of conventions? | Yes. Such propositions have mind-independent truth values grounded in the non-conventional facts about A's and B's conscious experiences, capabilities, and/or objective list satisfactions. | No. While facts exist about each individual's state, the claim that A is "lower" than B inherently relies on conventions for mapping disparate subjective states onto a common ordinal (or cardinal) structure. | Disagreement concerns the existence of a specific type of mind-independent *relational* fact between individuals, not just facts about each individual separately. |
  | **2. Epistemic Access to Level Comparisons:** Can we know level comparisons well enough to justify acting on them outside extreme cases? | Yes. Through sufficiently rich understanding of lives (neural/behavioral correlates, narrative accounts, shared human capacities), we can achieve warranted, albeit fallible and contestable, beliefs about level comparisons relevant to policy. | No, outside very coarse judgments (extreme deprivation vs. flourishing). We lack reliable, non-circular, non-conventional methods to discern level facts. Difference comparisons via preferences are the only rigorous basis for action. | Disagreement concerns the possibility and reliability of specific epistemic methods for accessing the purported level facts, not the definition of knowledge. |
  | **3. Status of Difference Comparisons under CUC:** Are interpersonal difference comparisons ("A's gain > B's loss") factual or conventional when based solely on individual trade-off rates? | **Verbal/Clarification:** C accepts that *if* we accept the convention of CUC, difference comparisons *based solely on revealed preferences* have determinate truth values *relative to that convention*. However, C holds that the convention is justified *because* it tracks underlying level facts accessible via other means. | **Verbal/Clarification:** S maintains that difference comparisons under CUC are the *only* interpersonally invariant facts derivable from observable preferences. They are "factual" relative to the minimal convention of unit comparability required to make sense of social choice based on preferences. | The *substantive* disagreement lies in whether CUC captures the *only* interpersonally invariant facts (S) or whether CUC is a useful convention justified by deeper level facts we *can* access (C). The "factual" label is context-dependent. |
  | **4. What Constitutes "Measurement":** Does establishing ICWB require procedures analogous to physical measurement (intersubjective, repeatable, based on public data)? | Broader View: Measurement includes warranted judgment based on diverse evidence (neural, behavioral, introspective reports, objective indicators) integrated through reasoned interpretation, even if not reducible to a single algorithmic procedure. | Stricter View: Measurement requires inter-subjectively verifiable procedures using public data (primarily observable choice behavior) that specify transformation properties and yield cardinal scales invariant under the relevant transformations (CUC for differences). | Disagreement concerns the necessary standards for claiming "measurement" of well-being, particularly across persons, reflecting differing views on objectivity and rigor. |

  ---

  ### III. Cruxes: Predictions & Interpretations

  1.  **The Cross-Person Decoder:**
      *   **Case:** A decoder, trained *only* on neural/behavioral data and self-reported experience *within* diverse individuals (e.g., predicting pain intensity, mood valence from fMRI/behavior), achieves significant accuracy (> chance, robust across populations) in predicting self-reported experience metrics *for a new individual* with a substantially different life history/circumstances, *without any calibration using that individual's data or data from others like them*.
      *   **C Prediction:** Likely possible. Expectation based on shared neurobiological/experiential substrates. **Interpretation if Happens:** Strong evidence for a common "currency" of experience, supporting the possibility of meaningful level comparisons and factual grounding for ICWB. Shows well-being dimensions are more universal than S allows.
      *   **S Prediction:** Unlikely to succeed robustly above chance for level predictions across diverse lives. Predictions might work for coarse states or rely on correlates not constitutive of well-being. **Interpretation if Happens:** Could reflect: (1) Success only for very coarse categories (extreme pain/pleasure), consistent with S's "coarse verdict" view; (2) Prediction of *reports* based on correlates, not underlying experience levels; (3) Undetected shared features in training/test data. Does *not* demonstrate knowledge of interpersonal *level* facts; shows correlation within a reporting convention/system.

  2.  **The Common-Anchor Protocol:**
      *   **Case:** Individuals experience a standardized battery of stimuli (e.g., calibrated pressures, tastes, sounds, VR scenarios) and calibrate their subjective reports (e.g., 0-10 scales) against these anchors. Scales are then used to compare levels/differences between individuals whose actual life experiences never involved these specific stimuli.
      *   **C Stance:** This *is* a form of measurement. The anchors provide a common experiential reference frame, grounding comparisons in shared physiology/psychology. Justifies level comparisons under CFC/RSC. Differences comparisons are also strengthened. The answer does not fundamentally differ for levels vs. differences; the protocol supports both.
      *   **S Stance:** This is sophisticated convention-stipulation. Anchors define the scale's meaning *for each user* relative to the battery. Applying it interpersonally assumes a mapping between individuals' anchor experiences that cannot be verified without circularity. It *forbids* level comparisons. It *might* support difference comparisons *if* the anchors induce comparable units of just-noticeable-differences (JNDs), suggesting CUC, but this is unverified and still relies on the anchoring convention.

  3.  **Range-Normalization Convention (0=Attainable Worst, 1=Attainable Best):**
      *   **Case:** Rescale each person's utility so their worst possible outcome (given constraints) is 0 and best is 1. Compare utilities across persons using these normalized scales.
      *   **C Stance:** This *concedes* a methodological point to the skeptic by adopting a convention. However, it does *not* beg the question or abandon the core view. C believes this convention often *approximates* the true level comparisons accessible via other means (e.g., judging the severity of constraints/chronic pain). It operationalizes a claim about the *significance* of changes relative to a person's possibilities.
      *   **S Stance:** Accepting this convention for social evaluation *quietly abandons* the core skeptical position. It introduces level comparability (0 and 1 become common anchors) under RSC. While internally coherent as a convention, it smuggles in the interpersonal level comparisons S denies are factual. S can only accept normalization *after* establishing CUC for differences, but the 0/1 points remain person-specific labels, not interpersonally comparable levels.
      *   **Intra-Personal Radical Break Press:**
          *   **C:** Can compare across radical breaks (e.g., pre/post profound value change, brain injury) using narrative continuity, biological needs, or external judgment. Resources used (e.g., judging suffering capacity, basic function) *are* similar to those used interpersonally, supporting ICWB.
          *   **S:** Intra-personal comparison across radical breaks is deeply problematic, often relying on convention or treating the person as effectively two distinct agents. The difficulty mirrors the interpersonal case and reinforces skepticism about level comparisons. Difference comparisons *within* each "segment" remain possible via preferences within that segment.

  ---

  ### IV. Failure Condition
  The collaboration fails if the only outcome is a *negotiated compromise* where:
  1.  C accepts that level comparisons are merely "useful conventions" for policy without factual grounding, **OR**
  2.  S accepts that level comparisons are "factual in practice" for policy while maintaining they lack deeper ontological status,
  **unless** this shift is driven by new, shared arguments or evidence presented during the collaboration that genuinely convinces one side on the other's core terms (e.g., S is convinced by decoder evidence *as level fact*, or C is convinced that preference-based difference comparisons are the *only* interpersonally invariant basis).

  A genuine result would involve one side modifying their core ontological or epistemic claim based on the arguments/evidence presented concerning the cruxes.

  ---

  ### Application to Policy Cases

  *   **Policy Case 1 (Severe Gain):** Small group with extremely restricted attainable range (e.g., chronic, unremitting severe pain patients) experience enormous gains relative to their baseline (e.g., effective pain management restoring near-normal function).
  *   **Policy Case 2 (Widespread Small Gain):** Large group with ordinary attainable ranges each experience a small gain (e.g., minor tax break, slight commute reduction).

  **Where Disagreement Determines Different Recommendations:**

  1.  **Level Comparisons Mattering:**
      *   **C:** Can compare the *absolute level* of the severe group pre-policy (near 0 on any plausible scale) to the ordinary group. Policy 1 involves lifting people from an extremely low absolute level. This gives it very high priority, likely outweighing Policy 2's widespread small gains unless the numbers are astronomical. Range normalization would strongly favor Policy 1.
      *   **S:** Cannot compare the pre-policy *level* of the severe group to the ordinary group. Only compares the *magnitude of gain* relative to each group's scale. While the gain in Policy 1 is large *relative to the severe group's range*, it may still be numerically smaller than the sum of small gains in Policy 2. Without level comparisons, Policy 2 could easily dominate under sum-utilitarianism with CUC. S rejects range normalization as importing illicit level comparisons.

  2.  **Range Normalization:**
      *   **C:** Would likely apply range normalization (or a similar level-aware procedure), strongly favoring Policy 1.
      *   **S:** Rejects range normalization as illegitimate for level comparisons. Only considers gains denominated in individual utility units (CUC), potentially favoring Policy 2.

  **Where Disagreement May Make No Difference:**

  1.  **Pure Difference Comparisons with Commensurate Gains:** If the focus is *only* on comparing the *size of the gain* in Policy 1 (ΔU_severe) vs. the *per-person gain* in Policy 2 (ΔU_ordinary), and if both sides agree these differences are interpersonally comparable under CUC (e.g., based on trade-off rates), then the analysis converges on whether N * ΔU_ordinary > ΔU_severe. The disagreement about *levels* becomes irrelevant *for this specific comparison*. However, S requires CUC to be established, while C might see this as derivative of level facts.
  2.  **Extreme Deprivation (S's "Coarse Verdict"):** If the severe group's pre-policy state is so dire that it falls within the "extreme deprivation" category S acknowledges permits coarse level judgments, both might prioritize Policy 1, though S would frame it as an extreme case exception based on convention-laden judgment, not general level comparability.
