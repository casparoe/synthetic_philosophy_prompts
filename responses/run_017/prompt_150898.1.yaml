prompt: |-
  So I somehow ended up volunteering to run a two-hour evening session on revealed preference and what "utility" is even supposed to mean, for a reading group of about nine people — mostly working programmers, a biologist, one guy who does forecasting — who have absorbed a ton of rationalist-adjacent vocabulary (utility isn't happiness, money pumps, wireheading, the bit where you can't infer an agent's values from watching it behave nicely) but have basically zero econ training. My worry is that they'll arrive half-convinced they already know the answer, which is worse than arriving blank. Don't explain revealed preference to me; I want a plan for how to explain it to them. What has to land first, and what can't be introduced until something else is already in place — e.g. can I even say the word "utility" before the choice-function/budget-set machinery is up, or does that just invite them to fill in their own meaning? I was gunna build the whole thing around a cafeteria tray example (apples vs. oranges at different prices) but I have a feeling it smuggles something in, so tell me what the carrying example has to have and what it has to lack, and why the obvious one is the wrong one here.

  The other thing I need you to deal with is an argument I had at the pub with a friend, because I think it's going to come up in the room and I don't have a clean answer. His pitch is that revealed preference feels empty only because we ever see choices from menus that actually got offered; if we also had what he calls "shadow menu" data — run the same choice over and over with randomized prices, or just ask people what they *would* have taken if the prices had been different, so you get a record of choices from budget sets that never really appeared — then "preference" stops being a relabeling of observed behavior and becomes a real hypothesis, and the axioms become predictions instead of part of the definition. I sort of think this is wrong and I also sort of think it's secretly right, and I can't tell whether it's just re-importing the unobservable mental junk that Samuelson was trying to purge (and if so, whether that's a fatal objection or just the honest thing to admit about the whole project). Relatedly, someone in that group will definitely say "so this is why you can't read off an AI's goals from its behavior," and I can't tell if that's a legitimate application or a straight-up misuse of the idea — tell me which, and where in the sequence it belongs if it belongs at all.

  Give me the misconception map in the order they'll actually form them, not in order of importance — I'm guessing one of them is "so utility is just whatever the agent picked, therefore the theory says nothing," another is "just ask them what they prefer," and there's something about cycles and money pumps that I think is a category error but can't articulate — and pin each one to the exact point in the session where I should head it off rather than leaving it to the Q&A. I also want one question I can ask at the very end that distinguishes someone who's got it from someone who's just learned to repeat "preference is a representation of choice, up to the transformation." And tell me what I should openly refuse to cover in two hours and say out loud that I'm skipping. Lead with a single sentence giving me the spine of the session — the one claim that has to be true of the room when we're done — then the plan; no preamble and don't feed my question back to me.
reasoning: |-
  Alright, the user needs a lesson plan for teaching revealed preference to a group with some background in rationalist concepts but no formal economics training. Let me start by understanding their main concerns.

  First, the group already has preconceived notions about utility, money pumps, and wireheading. The worry is that they might think they already get it, which could hinder learning. So, the challenge is to dismantle those misconceptions without overwhelming them.

  The user mentioned a cafeteria tray example but suspects it might smuggle in assumptions. I need to ensure the example is neutral—using abstract goods like X and Y instead of apples and oranges to avoid implying intrinsic values. The key is to focus purely on choices from different budget sets without any mental states.

  Then there's the pub argument about "shadow menus." The friend argues that hypothetical choices could make preferences more than just relabeling behavior. I need to address this. Samuelson's point was to avoid unobservables, so introducing hypotheticals might bring back mental states. But in practice, economists do use surveys. However, for the foundational lesson, sticking to observed choices keeps it clean. Maybe clarify that revealed preference is about actual choices, but extensions exist.

  Another issue is the application to AI goals. The user is unsure if it's legitimate. Revealed preference applies to consistent behavior, but AI might have hidden objectives. So, it's a valid point but with caveats—behavior doesn't reveal true goals if there's inconsistency or deception. This should come after establishing the basics.

  Misconceptions to tackle: "Utility is just what was chosen, so the theory is empty." Need to emphasize that the theory's power is in predicting future choices under new constraints. Also, the "just ask them" misconception—highlight that preferences are constructed from choices, not self-reports. Money pumps as category errors? They come from violating axioms, so explain that cycles lead to exploitation, linking back to consistency.

  The spine should be that preference is a model of consistent choice, useful for prediction under new constraints. Start with choice data, build axioms, then introduce utility as a representation. Avoid mental states entirely. Skip topics like cardinal utility or welfare economics to stay focused.

  End with a question to test understanding: What can you predict if someone chose A over B in one set but B over A in another? They should recognize it depends on other choices and consistency. 

  Need to structure the session step-by-step, preempting misconceptions at each stage. Use clear examples, interactive elements, and explicitly state what's being skipped. Keep it concrete and grounded in observable choices throughout.
answer: |-
  Here’s the spine: **Preference is a model of consistent choice patterns, defined solely by observed decisions, used to predict behavior under new constraints.**  

  ### Session Plan (110 mins total)  
  **Phase 1: Demolish "utility" preconceptions (0–15 mins)**  
  - **DO NOT SAY "UTILITY" YET.** Start with: *"We have records of choices from different menus. How do we systematize this?"*  
  - **Misconception preemption:** Show 3 choices from a person:  
    - Menu {apple, orange}: picks apple  
    - Menu {apple}: picks apple  
    - Menu {orange}: picks orange  
    *"If I say they ‘prefer apples’, what would that let us predict?"* → Elicits that "preference" must explain *all* choices. Reveals "just ask them" fails (people lie, misunderstand themselves).  

  **Phase 2: Build choice structure (15–45 mins)**  
  - **Define:** *Budget set* (all affordable bundles), *choice function* (what’s picked from a set).  
  - **Tray example (CRITICAL FIXES):**  
    - Use **abstract goods (X, Y)**—NOT apples/oranges (avoids smuggling "intrinsic value").  
    - Prices change, income fixed. Show choices at:  
      - (Price X = $1, Y = $1): Chosen bundle (2X, 0Y)  
      - (P_X = $2, P_Y = $1): Chosen (0X, 2Y)  
      - (P_X = $1, P_Y = $2): Chosen (3X, 0Y)  
    - **Key Q:** *"Is there a ‘preference’ that explains all three? What would it look like?"* → Forces confrontation with inconsistency.  
  - **Axiom intro (Weak Axiom of Revealed Preference - WARP):**  
    - *"If A is chosen when B is available, B is never chosen when A is available."*  
    - Show the tray choices **violate WARP** (e.g., (2X,0Y) "revealed preferred" to (0X,2Y) in first menu, but reversed in second).  

  **Phase 3: Revealed preference → Utility representation (45–75 mins)**  
  - **NOW define "preference":** *A binary relation ≥ where A ≥ B iff A is chosen when B is available.* Utility is **just a numerical representation** of ≥.  
  - **Utility construction demo:**  
    - Show consistent tray choices (e.g., always pick more X when Y price rises).  
    - Assign U(A) > U(B) iff A chosen over B when both available.  
  - **"Empty theory?" rebuttal:**  
    - *"If choices are consistent (obey WARP), we can predict what they’ll pick in ANY new budget set."* Show prediction for (P_X=$3, P_Y=$1).  
    - **Power:** It’s falsifiable. If prediction fails, the "preference" model is wrong.  
  - **Shadow menus argument (PUB FRIEND):**  
    - *"Hypothetical choices are fine—but now you’re testing a model of stated intent, not actual choice. Revealed preference’s power is needing NO mental states. ‘Shadow data’ risks reimporting unobservables—but economists do use surveys! The core theory stays pure by sticking to actions."*  

  **Phase 4: Applications & limits (75–100 mins)**  
  - **Money pumps (AVOID EARLIER!):**  
    - Now show a WARP violation → cyclical choices (A>B, B>C, C>A).  
    - *"This makes you exploitable: I can sell you C for A (+fee), then B for C (+fee), then A for B (+fee)... you pay to cycle. WARP prevents this."* → Not a category error; it’s the **pragmatic cost of inconsistency.**  
  - **AI goals ("Can’t read off values"):**  
    - *"Legitimate! Revealed preference applies ONLY if behavior is consistent across menus. An AI could:  
      (a) Obey WARP → we model its ‘preferences’  
      (b) Violate WARP → no coherent goals revealed  
      (c) Have hidden state → looks inconsistent unless we see all state variables."*  

  **Phase 5: Recap & Q&A (100–110 mins)**  
  - **Killer question:** *"If I observe someone choose A over B from menu {A,B}, and later choose B over A from menu {A,B,C}, does this violate WARP? Can we infer anything about their preference between A and C?"*  
    - **Got it:** "No WARP violation. We learn nothing about C—it could be better, worse, or incomparable."  
  - **Skipped loudly:** Cardinal utility (strength of preference), interpersonal comparisons, welfare economics ("should"s), statistical versions.  

  ### Misconception Map & Defusal Timeline  
  1. **"Utility = happiness" (Pre-empted: Phase 1, before defining utility)**  
  2. **"Just ask them their preferences" (Pre-empted: Phase 1, with choice contradictions)**  
  3. **"Theory is empty—preference is just a label" (Pre-empted: Phase 3, via predictive power)**  
  4. **"Money pumps are unrelated" (Pre-empted: Phase 4, linking cycles → exploitation)**  
  5. **"Revealed preference explains irrationality" (Pre-empted: Phase 4—WARP violations ARE irrationality)**  

  ### Why This Works  
  - **Utility delayed:** Prevents cargo-culting rationalist jargon.  
  - **Tray example neutered:** Abstract goods + price shifts focus to *tradeoffs*, not intrinsic properties.  
  - **AI debate placed late:** Only makes sense AFTER consistency/representation is clear.  
  - **Spine delivered:** Preference is a tool for modeling/predicting choice patterns—nothing more.  

  **2-HOUR HARD STOP:** End with *"Revealed preference doesn’t tell you what to want—it tells you how to see if you’re choosing like you already know."*
