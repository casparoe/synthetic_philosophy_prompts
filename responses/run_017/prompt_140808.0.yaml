  Okay, the user is in a reading group stuck on moral worth debates. They've already covered Kant, Williams' "one thought too many," situationism, and decent motives without deliberation. The group is deadlocked on whether moral worth requires acting for the right reasons, quality of will, or shifting focus to praise/blame. The user's hospital case didn't resolve it, and their counterfactual test split the group. Their hypothesis is that "moral worth" serves three distinct jobs—appraisal, guidance, and right-making—causing confusion when conflated. They want a diagnosis, not a verdict or more readings.

  First, I need to unpack why the group isn't moving. The user mentioned three camps: one insists on the right reason as the motivator, another rejects self-consciousness in favor of quality of will, and the third wants to replace worth with praise/blame frameworks. The hospital case with dual motives (fraud detection and budget concern) led to a stalemate. The counterfactual test (removing self-interest) was divisive. 

  The user's hypothesis about three jobs for "moral worth" seems strong. Let me verify if philosophical literature supports this. Scanlon's blame vs. credit distinction might apply here—appraisal is about praiseworthiness, not just right action. Guidance relates to moral education, while right-making is about objective reasons. The group might be talking past each other because each camp prioritizes a different job. 

  Also, the conference dinner anecdote shows divergence in responses to "deserve credit," "did it for right reasons," and "is she a good person." This suggests ordinary language separates these concepts, but the group is conflating them. For example, Kantians fixate on deliberation (guidance job), while the quality-of-will side cares about character (appraisal). The skeptic abandoning "worth" might be reacting to its ambiguity. 

  The counterfactual test fails because it addresses overdetermination (appraisal job) but ignores motivation structure. Those rejecting it likely care about actual psychological states (guidance/right-making). The fetish objection targets demanding self-consciousness, which matters for guidance but not appraisal. 

  Substantive issues: The Kantian assumes moral worth requires conscious duty-awareness, but situationism shows this is rare. The quality-of-will advocate conflates reliable virtue with praiseworthiness—e.g., someone might act rightly by accident. The skeptic isn't entirely wrong; "praise" might handle motivation better than "worth." 

  Progress paths: Distinguish appraisal/guidance/right-making explicitly. For appraisal, discuss credit vs. right action. For guidance, ask what cultivates virtue—conscious rules or habits? For right-making, separate objective reasons from motives. Or abandon "moral worth" for clearer terms like praiseworthiness. Empirical input could test if people naturally separate these concepts, but might not resolve normative disputes. 

  The user's hypothesis holds up. The deadlock stems from unacknowledged conceptual layers. Advancing requires disentangling these jobs or adopting more precise language. If the group resists, it might indicate deeper commitments—e.g., Kantians valuing rationality even if rare—but naming the impasse could still help.
answer: |-
  Your diagnosis is perceptive—almost certainly correct—but incomplete. The deadlock isn't *just* about "moral worth" serving three distinct jobs (appraisal, guidance, right-making). It's that **each position implicitly denies the core commitment of the others at a meta-ethical level**, making progress impossible without acknowledging deeper fault lines. Here’s the breakdown:

  ### 1. What Each Side is Committed To (and What They Deny)
  - **The Kantian ("Guided by Right-Making Features"):**  
    - **Commitment:** Moral worth reveals an agent’s *rational recognition* of objective moral reasons. Worth requires the reason itself (e.g., "help was needed") to be the *operative motive* in deliberation.  
    - **Denial:** That "quality of will" or reliable virtue is sufficient. For them, acting from a *good desire* (even if it aligns with duty) without rational recognition is non-moral (like a dog fetching a drowning child instinctually).  
    - **Meta-Denial:** That morality can be divorced from conscious practical reasoning. They see the "fetish" objection as missing the point—self-consciousness *is* the moral capacity.

  - **The Quality-of-Will Advocate ("Decent Motives, No 'Right Reason' Demand"):**  
    - **Commitment:** Moral worth is about *characterological excellence*. If you reliably act from motives we admire (benevolence, honesty), you have worth—regardless of whether you conceptualize them as "reasons."  
    - **Denial:** That explicit moral reasoning adds value. They see the Kantian demand as *corrupting*—it replaces warm virtue with cold calculation.  
    - **Meta-Denial:** That moral psychology must be *rationalist*. They prioritize affective/volitional states over cognitive ones. Williams' "one thought too many" isn't just an objection; it's a rejection of rationalism’s plausibility.

  - **The Skeptic ("Replace Worth with Praise/Blame Practices"):**  
    - **Commitment:** "Moral worth" is a philosopher’s fiction. Only *social practices* (praise, blame, accountability) are real. Worth-talk confuses descriptive psychology with normative evaluation.  
    - **Denial:** That "moral worth" picks out a unified psychological property. They see it as a reification error.  
    - **Meta-Denial:** That morality is primarily about *individual agents' inner states*. They’re committed to a *social-functional* view: morality exists to regulate behavior, not to grade souls.

  ### 2. Why Your Counterfactual Test Failed
  - **Pro-Counterfactual Camp:** They’re focused on *appraisal* ("Does she *deserve credit*?"). The test isolates the sufficiency of the moral motive. If she’d act morally *without* self-interest, she gets "credit."  
  - **Anti-Counterfactual Camp:** They see it as irrelevant to *guidance* ("What should we cultivate?") or *right-making* ("What made the act right?"). The test ignores *actual psychology*—if both motives operated, her character isn’t *fully* admirable (Guidance Job), and the act’s rightness isn’t explained by her motives (Right-Making Job).  

  ### 3. Where Your Hypothesis is Incomplete
  You’re right about the "three jobs," but the deeper issue is **competing conceptions of moral agency**:  
  - **Rationalist Agency (Kantian):** Morality requires *judgment*. Agents must "own" reasons.  
  - **Characterological Agency (Quality-of-Will):** Morality emerges from *cultivated dispositions*. Deliberation is secondary.  
  - **Social-Functional Agency (Skeptic):** Morality is a *tool for coordination*. Agent-internal states matter only as predictors of behavior.  

  These aren’t just different answers—they’re different *frameworks*. When the Kantian says "guided by reasons," the Quality-of-Will advocate hears "alienated from human goodness," and the Skeptic hears "mystical introspection."

  ### 4. Diagnosis: Why the Argument Doesn’t Move
  - **It’s Not Verbal:** The dispute is substantive but at the *foundational* level. Each side rejects the others’ fundamental view of what morality *is*.  
  - **It’s Not Empirical:** Situationist data won’t help. The Kantian concedes people rarely deliberate ideally but insists *worth* requires it; the Quality-of-Will advocate says the data proves their point; the Skeptic says it shows "worth" is useless.  
  - **It’s Meta-Ethical Camouflage:** The fight over "moral worth" is a proxy war between:  
    - Rationalism vs. Sentimentalism (Are reasons or sentiments primary?)  
    - Internalism vs. Externalism (Must moral motivation be cognitive?)  
    - Individualism vs. Functionalism (Is morality about souls or societies?)  

  ### 5. Paths to Progress (Given the Diagnosis)
  - **Distinction:** Force the group to explicitly separate the three jobs *and* their meta-ethical commitments. Ask:  
    - "When we say 'moral worth,' are we judging the *agent* (appraisal), prescribing *how to act* (guidance), or explaining *rightness* (right-making)?"  
    - "What *kind* of moral psychology do we assume? Rationalist? Sentimentalist? Social-pragmatic?"  
  - **Change of Question:** Abandon "moral worth." Ask instead:  
    - *Appraisal Focus:* "When should we *admire* someone’s action (vs. merely approve of it)?"  
    - *Guidance Focus:* "Should we teach children to act from duty, virtue, or social consequence?"  
    - *Right-Making Focus:* "Can an act be right *because* it’s done from a good motive?"  
  - **Honest Impasse:** If meta-ethical divides remain, agree that "moral worth" is a *cluster concept* with no unified theory. Progress becomes mapping where each view excels (e.g., Kantians handle dilemmas; Sentimentalists handle friendship; Skeptics handle hypocrisy).  

  **Real progress here looks like recognizing the elephant in the room:** You’re not arguing about moral worth. You’re arguing about the nature of morality itself. Until that’s surfaced, you’ll keep talking past each other—no matter how many hospital vignettes you invent.
