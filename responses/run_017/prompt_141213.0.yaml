               - Two separate circles, each with a hole? -> disconnected and two holes? But we want to avoid having a disconnected figure with one hole. So use:
                   - A solid circle with a smaller circle inside (like a ring) -> connected, one hole? Actually, a ring has one hole. But we already have that in left? So for negative, we use:
                      - Two separate rings: disconnected, each has one hole -> total two holes? But we want to avoid one hole per component? 

            Instead, let's define the figures clearly:

            We'll use:

            Left (positive: connected and exactly one hole):
               - A ring (one hole)
               - A rectangle with a circular hole (one hole)
               - A triangle with a circular hole (one hole)

            Right (negative: not (connected and one hole)):
               - A solid rectangle (connected, no hole) -> negative
               - A solid circle (connected, no hole) -> negative
               - A ring with a second hole (connected, two holes) -> negative
               - Two separate solid circles (disconnected, no hole) -> negative

            Then the new example: 
               - Two separate rings (disconnected, each has one hole) -> this has two holes? But we want one hole overall? Actually, each ring has one hole, so the whole figure has two holes. We want a figure that is disconnected and has exactly one hole? How? We need a figure that is disconnected and one of the components has a hole and the other doesn't? 

            Example: 
               - A ring (one hole) and a separate solid circle (no hole) -> disconnected, and the entire figure has one hole? Because the hole is in the ring. The solid circle has no hole. So total holes: one.

            Then we can use that.

            So new example: 
               - A ring and a separate solid circle: disconnected, one hole.

            Then:
               Rule A (with connectivity): not connected -> negative (right).
               Rule B (only holes): one hole -> positive (left).

     So for Problem 2, we have:

          Left (positive for the true rule: connected and one hole):
             1. A ring (connected, one hole)
             2. A rectangle with a hole (connected, one hole)
             3. A triangle with a hole (connected, one hole)

          Right (negative):
             1. A solid rectangle (connected, no hole)
             2. A solid circle (connected, no hole)
             3. A rectangle with two holes (connected, two holes)
             4. Two separate solid circles (disconnected, no hole)

          New example: 
             - A ring and a separate solid circle (disconnected, one hole)

     Then we prime Group A to think about connectivity and Group B to think about holes.

     We hope Group A comes up with: connected and exactly one hole.
     Group B comes up with: exactly one hole.

     Then the new example: 
          Group A: negative (disconnected) -> right.
          Group B: positive (one hole) -> left.

     We then reveal that the true rule (which we set) is connected and one hole, so the new example is negative.

     But we can also say: "In science, we don't know. We have to choose a rule and test it."

     Summary of timing:

     - 5 min: Introduction
     - 20 min: Problem 1 (entire room)
          - 5 min: present and write individual rules.
          - 5 min: share in pairs and come up with a second rule.
          - 5 min: group discussion and betting on new examples.
          - 5 min: transition.
     - 30 min: Problem 2 (split room)
          - 5 min: split and prime groups.
          - 10 min: each group discusses and writes down a rule.
          - 5 min: groups report.
          - 5 min: present new example and get predictions.
          - 5 min: reveal true rule and discuss.
     - 20 min: Debrief

     This adds up to 75 minutes.

     Debrief points:

       - Underdetermination: multiple rules fit the data.
       - The role of simplicity, prior expectations, and the order or framing of examples.
       - The leap from description to prediction: we have to choose a rule to make predictions, but we can't be sure.
       - In science, we use additional criteria (simplicity, explanatory power, coherence with other theories) to choose.

     What can go wrong:

       - In Problem 1, someone shouts "It's regular polygons!" and then everyone locks on. Mitigation: require individual writing first, then pair sharing, and then ask for multiple rules (challenge to find a second one).

       - In Problem 2, the groups might not come up with the primed rule. We can have the facilitators (if available) or you can circulate and nudge. If they come up with a different rule, that's okay too. We can then show that there are multiple rules that fit.

       - Time: we are tight on time. We might need to cut short the group discussions.

     Honest note at the end:

       - In this game, we knew the true rule. In reality, we don't. And we can never be certain that our rule is the true one based on finite data. We have to be open to revision.

     Materials you need to prepare:

     - Problem 1: 
          Drawings of polygons and non-polygons (on cards or a poster).
          New examples: regular heptagon and irregular pentagon.

     - Problem 2:
          Drawings of shapes with holes and without (on cards or posters for each group).
          New example: a ring and a separate solid circle.

     You can hand-draw these or use a computer and print them.

     This should work. Good luck!
answer: |-
  Here’s a step-by-step design for your session, optimized for hands-on engagement, minimal prep, and clear illustration of underdetermination (multiple rules fitting the same data). It uses simple, drawable materials and emphasizes prediction, ordering effects, and the leap beyond data.

  ---

  ### **Session Structure**  
  **Total Time:** 75 minutes  
  **Materials:**  
  - Paper cards (or large posters) for Bongard problems (draw by hand).  
  - Tokens (e.g., buttons, coins) for betting.  
  - Pens and paper for participants.  

  ---

  ### **Part 1: Introduction (5 min)**  
  - **Goal:** Frame the exercise.  
  - **Script:** *“We often think patterns in data point to one clear rule. Today, we’ll test that. You’ll solve visual puzzles where examples on the left follow a rule, and those on the right don’t. But there’s a twist: your job isn’t just to find a rule—it’s to find how many rules could fit.”*  

  ---

  ### **Part 2: First Bongard Problem (20 min)**  
  **Problem Design (Simple & Ambiguous):**  
  - **Left (Rule-Following):** 4 shapes that are **red circles** (e.g., ●, ◎, ●, ◎).  
  - **Right (Non-Rule):** 4 shapes that are **non-red or non-circles** (e.g., ▲ [red triangle], ■ [blue square], ★ [red star], ● [small black circle]).  
  - **Rule Options:**  
    - True rule: *“Red circles.”*  
    - Alternative rule: *“Large shapes.”* (If you draw all left shapes large, and right shapes mixed).  
    - **Why it works:** Both rules fit all examples. Red circles are always large; non-red/non-circles include small/large.  

  **Activity Flow:**  
  1. **Display:** Show cards/posters of the 8 shapes (left/right mixed).  
  2. **Individual Rule-Writing (3 min):** *“Write a rule that fits all left and no right shapes.”*  
  3. **Pair Sharing (5 min):** *“Find a partner. Swap rules. Challenge each other to find a second rule that also fits all examples but contradicts the first rule on a new shape.”*  
     - *Example:* If Partner A says *“red circles,”* Partner B invents *“large shapes.”*  
  4. **Group Discussion (5 min):**  
     - Ask pairs to share rules. Write 2–3 on a board.  
     - **Key Q:** *“Do all these rules fit the current examples? Could they disagree later?”*  
  5. **Betting (Prediction Leap) (5 min):**  
     - Show a **new test shape** (e.g., a large blue circle).  
     - *“Bet a token on which rule will classify this correctly. If you bet on ‘red circles,’ it fails (blue); if ‘large shapes,’ it passes.”*  
     - **Reveal:** No resolution—point out both rules fit the data, but predictions clash.  

  ---

  ### **Part 3: Split-Room Activity (Ordering Effect) (25 min)**  
  **Problem Design (Order-Sensitive):**  
  - **Rule:** *“Shapes with dots inside them.”*  
  - **Examples (Same 8 shapes for both groups, but different orders):**  
    - **Group A Order:** Starts with clear positives (e.g., ◉, ◎).  
    - **Group B Order:** Starts with ambiguous shapes (e.g., △ [dot outside], then ◉).  

  | Group | Sequence (Left = Rule, Right = Non-Rule) |  
  |-------|------------------------------------------|  
  | A     | L1: ◉ (dot inside) → L2: ◎ → R1: △ (dot outside) → R2: □ → ... |  
  | B     | R1: △ (dot outside) → L1: ◉ → R2: □ → L2: ◎ → ... |  

  **Activity Flow:**  
  1. **Split Room:** Divide into Group A and Group B. Give each group their ordered card set.  
  2. **Rule-Writing (7 min):**  
     - *“With your group, agree on one rule that fits your examples. Write it down.”*  
     - **Predictable Outcome:**  
       - Group A (positives first) likely infers *“dots inside.”*  
       - Group B (ambiguous first) often infers *“no dots outside”* or *“closed shapes with dots.”*  
  3. **Reveal & Clash (5 min):**  
     - Groups share rules. **Highlight:** Same data, different rules due to order.  
     - Show a **new test shape** (e.g., a square with a dot *on* the border).  
       - *“Group A: Does your rule include this? Group B?”* (Rules will clash).  
     - **Consequence:** Groups lose tokens if their rule fails (adds stakes).  

  ---

  ### **Part 4: Debrief (20 min)**  
  **Key Points to Draw Out:**  
  1. **Underdetermination:**  
     - *“The examples never forced one rule. You could always invent a second rule that fit but predicted differently.”*  
     - **Participant Reflection:** *“How did it feel to choose a rule when multiple worked?”*  
  2. **From Description to Prediction:**  
     - *“When you bet tokens, you moved from describing data to trusting a rule for the unknown. That leap requires something beyond data—simplicity, intuition, etc.”*  
  3. **Ordering & Context:**  
     - *“Group A/B landed on different rules because of sequence. In science, the order we see data shapes hypotheses.”*  
  4. **Science Analogy:**  
     - *“This mirrors real science: data underdetermines theories (e.g., Newton vs. Einstein on gravity). We choose based on elegance, coherence, or pragmatism—not just data.”*  

  **What Predictably Goes Wrong & Fixes:**  
  - **Risk:** One person shouts a rule early → group locks on.  
    - **Mitigation:**  
      - Enforce **individual writing** first.  
      - Use **pair challenges** to force alternative rules.  
      - **Reframe:** *“Your goal isn’t to ‘win’—it’s to find how many rules work.”*  
  - **Risk:** Groups miss alternative rules.  
    - **Fix:** Have prepped examples of common alternatives (e.g., if stuck, ask: *“Could ‘large shapes’ also fit?”*).  

  **The Honest Note (State Aloud):**  
  - *“In this game, I knew the ‘true’ rule. In reality, we don’t. Science is a bet that our rule—chosen for simplicity, beauty, or utility—will hold. But tomorrow’s experiment could break it. That’s the anxiety and excitement of science.”*  

  ---

  ### **Why This Works**  
  - **No Slides, No Math:** Uses cards/drawings; rules rely on attributes (color, size, dots) anyone grasps.  
  - **Stakes & Engagement:** Tokens and group competition make prediction personal.  
  - **Core Moments Delivered:**  
    - Prediction leap (betting tokens on untested cases).  
    - Ordering effect (split groups land on different rules).  
  - **Low Prep:** Draw shapes with markers (e.g., circles, triangles, dots). No sourcing.  

  **Backup Plan:** If groups converge on one rule early, introduce a **“rule saboteur”** card: *“Invent a new shape that breaks the leading rule but fits the examples.”* Forces the point.  

  This design turns underdetermination from an abstract idea into a tactile, memorable experience—ending with the humbling reminder that science is driven by human choices, not just data.
