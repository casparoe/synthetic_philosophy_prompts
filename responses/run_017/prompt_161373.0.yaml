answer: |-
  Below is a one-page handout for your comparative epistemology reading group. It presents a decision tree to classify episodes of coming to know something into types of warrant (pramāṇas), using concrete examples and avoiding technical jargon. The tree uses six yes/no questions to sort cases, with the redundancy question (whether the warrant fails if the fact is already known) addressed in the analysis. British English is used throughout.

  ---

  **Handout: A Decision Tree for Classifying Warrants in Epistemology**  
  *For comparative epistemology: Indian and analytic perspectives*

  **Instructions**: Start with a concrete episode of coming to know something. Work through the questions in order. The answers will sort the episode into one of six types of warrant. Examples are provided for clarity. After classifying, see how different philosophical schools map onto the tree.

  ---

  ### **The Decision Tree**
  Answer sequentially—stop at the first "yes":

  1. **Is what gets known an absence?**  
     (e.g., "The jar isn’t on the table," or realising your keys are missing.)  
     → **Yes**: Non-apprehension (anupalabdhi).  
     → **No**: Go to question 2.

  2. **Does the warrant need the object itself to be in direct contact with a sense organ?**  
     (e.g., seeing a red apple, or hearing a loud bang.)  
     → **Yes**: Perception (pratyakṣa).  
     → **No**: Go to question 3.

  3. **Does it require positing an unobserved state of affairs to make an observed one intelligible?**  
     (e.g., "Devadatta is fat and never eats by day, so he must eat at night.")  
     → **Yes**: Postulation (arthāpatti).  
     → **No**: Go to question 4.

  4. **Does the step require a remembered exceptionless link between a sign and what it indicates?**  
     (e.g., seeing smoke on a hill and inferring fire, or a rash indicating an allergy.)  
     → **Yes**: Inference (anumāna).  
     → **No**: Go to question 5.

  5. **Does it turn on a remembered similarity used to identify an unfamiliar object?**  
     (e.g., a forest officer sees a gavaya-like animal and recalls, "Ah, this matches the cow-like creature described!")  
     → **Yes**: Comparison (upamāna).  
     → **No**: Go to question 6.

  6. **Does it require understanding a sentence or signal from a source taken to be reliable?**  
     (e.g., a weather app saying "It’s raining in Delhi," a blood-test result in a letter, or a satnav instructing "Turn left.")  
     → **Yes**: Testimony (śabda).

  ---

  ### **Example Cases Sorted by the Tree**
  - **Perception**: Seeing a red apple; hearing a smoke alarm (direct auditory contact).  
  - **Inference**: Smoke on a hill indicating fire; a smoke alarm waking you (if you recall its exceptionless link to fire).  
  - **Comparison**: A forest officer identifying a gavaya via remembered cow-like features.  
  - **Testimony**: Reading the time on your phone; a blood-test result letter; an app reporting Delhi’s weather; a satnav instruction (even if half-understood, you accept the source).  
  - **Postulation**: Inferring Devadatta eats at night to explain his obesity and daytime fasting.  
  - **Non-apprehension**: Realising the jar isn’t on the table; noticing your wallet is absent from your pocket.

  **Ambiguous Cases**:  
  - A smoke alarm waking you could be inference (if based on a causal link) or testimony (if treated as a communicative signal).  
  - Satnav instructions blur testimony and inference if you partially deduce the route.  
  - *Tree limitation*: The tree cannot rigidly separate testimony from comparison (both use memory, but testimony relies on communication) or inference from postulation (both involve unobserved elements, but postulation addresses explanatory gaps).

  ---

  ### **The Space of Warrants: School Positions and Unoccupied Cells**
  The tree defines six types of warrant via answer combinations. Schools "occupy" regions by accepting/rejecting types. Combinations not covered are noted.

  | **Answer Combinations** | **Warrant Type** | **Nyāya (4-fold)** | **Buddhism (2-fold)** | **Perception-Only** | **6-fold (Mīmāṃsā/Vedānta)** |
  |--------------------------|------------------|--------------------|-----------------------|---------------------|-------------------------------|
  | Q1=Yes                   | Non-apprehension | — (Reduced to perception) | — (Reduced to inference) | — (Reduced to perception) | ✓                             |
  | Q1=No, Q2=Yes            | Perception       | ✓                  | ✓                     | ✓                   | ✓                             |
  | Q1=No, Q2=No, Q3=Yes     | Postulation      | — (Reduced to inference) | — (Reduced to inference) | — (Reduced to perception) | ✓                             |
  | Q1=No, Q2=No, Q3=No, Q4=Yes | Inference      | ✓                  | ✓                     | — (Reduced to perception) | ✓                             |
  | Q1=No, Q2=No, Q3=No, Q4=No, Q5=Yes | Comparison | ✓             | — (Reduced to inference) | — (Reduced to perception) | ✓                             |
  | Q1=No, Q2=No, Q3=No, Q4=No, Q5=No, Q6=Yes | Testimony | ✓        | — (Reduced to inference) | — (Reduced to perception) | ✓                             |

  **Unoccupied Cells and Why**:  
  - **All answers "no" (Q1–Q6 = No)**: Unexplored (considered incoherent; no warrant without a source).  
  - **Q1=Yes + any later "yes"**: Incoherent (non-apprehension is exclusive; stops at Q1).  
  - **Other combinations (e.g., Q2=Yes + Q4=Yes)**: Unattractive (schools treat warrants as mutually exclusive; perception requires no inference).  

  **Redundancy Note**: For testimony and comparison, some schools (e.g., Buddhism) argue they collapse into inference if the fact is already known. The tree treats them as distinct, but this question highlights debates about reducibility.

