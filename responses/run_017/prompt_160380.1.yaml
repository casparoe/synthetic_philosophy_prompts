prompt: |-
  I'm a PhD candidate in philosophy of cognitive science, and what I need is a specification, not a survey. The chapter I am writing turns on one question: when a system has no usable design-stance story — no rational reconstruction of how its parts are supposed to contribute to what it does, because its organization was arrived at by training rather than by design — can the intentional patterns an interpreter finds in its behavior still be real patterns, and if so, what does their reality consist in? Before I commit to a criterion, I want to know what I am entitled to demand of one.

  So: write the desiderata for an account of pattern reality. Hold the account to one job, which is mine and not realism-in-general: given a system, a body of observations of it, and a proposed description that compresses those observations, the account must be able to say whether the pattern the description picks out is (a) an artifact of the descriptive vocabulary or encoding chosen, (b) merely useful to some interpreter, or (c) real — where real means real enough to underwrite explanation, prediction of further observations, prediction under interventions, and, where the pattern is an intentional one, some modest claim about content.

  Give me the list as a table with four columns: the requirement; the concrete case that shows why it is a requirement (a sentence or two each, an actual case rather than a label); whether you take it to be non-negotiable or a preference of one camp, with a note on which camp; and what enforcing it would exclude. At minimum, the account must respect and not collapse these distinctions:

  - reality of a pattern versus usefulness of a pattern to an interpreter
  - availability of a stance versus reality of the patterns found from that stance
  - a pattern in a data set versus a pattern in the system or the world, since the same system under two measurement vocabularies can be patterned in one and not the other
  - compression versus export: licensing predictions about further unmanipulated observations versus licensing predictions about what would happen under interventions that have never been performed
  - degrees of reality versus a binary verdict

  And it must handle these cases explicitly, in whatever order fits your list:

  1. The no-design-story case: a trained system whose behavior the intentional stance predicts well, while no decomposition of it into parts with purposes yields predictions anyone could actually use. Does a real intentional pattern require design-stance backing, or can it float free of one?
  2. The contrived-code case: a sequence that compresses spectacularly only under a code tailored to it after the fact, the sort of thing you get by fitting a scheme to noise. Whatever the account says must charge for the code and not only for the data given the code; show how it does that and what the maneuver costs it.
  3. The unmanipulable domain: a pattern in an observational science — something in the fossil record, or in large-scale astronomical data — that compresses beautifully and predicts new observations, but where no intervention on the system is available even in principle. If your account demands intervention-robustness, it must either handle this or concede that it is a criterion of causal structure rather than of pattern-hood.
  4. The near-miss: the intentional stance is the best available predictor of a system overall but mispredicts a specifiable subclass of its behavior systematically. Is the reality of the pattern graded, does it come with an exception clause, or does the existence of that subclass show the stance was instrumental all along?
  5. The grain case: a regularity that shows up at one coarse-graining of a system's behavior and disappears at a finer or a coarser one.
  6. The reflexivity case: the account must be able to say, in its own terms, whether the distinction it draws between real and merely apparent patterns is itself a real pattern, and what follows for it if the answer is no.

  Then, in prose after the table:

  (a) Which pairs or triples of your own requirements you suspect cannot be jointly satisfied. This is the part I most want. Candidates I have in mind: requiring export under intervention while refusing to restrict pattern-hood to manipulable domains; requiring a principled restriction on admissible codes while keeping the criterion usable by a bounded investigator; requiring that real patterns be anchored in mind-independent structure while allowing a pattern to be real from the intentional stance and not real from the physical stance. For each, tell me whether it is a genuine inconsistency or a fake tension, and what gives way.

  (b) Which single requirement does the most exclusionary work, and whether imposing it is worth what it costs you elsewhere on the list.

  (c) A short scorecard — a paragraph each, no more — for four candidate views: the compression criterion associated with Dennett's real-patterns paper; a minimum-description-length or two-part-code refinement of it; an interventionist or difference-making account that ties patterns to causal structure; and a deflationary treatment on which pattern-hood is projection relative to an interpreter's interests. Mark for each whether it violates a non-negotiable or merely disappoints a preference.

  Please do not supply citations, a bibliography, or a reading list; I know the literature and I will do that part myself. And where a desideratum leans on technical apparatus — Kolmogorov complexity, two-part codes, interventionist counterfactuals — state the apparatus in a sentence rather than assuming I share your formalism.
reasoning: |-
  Okay, the user is a PhD candidate in philosophy of cognitive science working on a specific chapter. They need a specification of desiderata for an account of pattern reality, particularly when systems lack a design stance. Let me unpack their query.

  First, the core problem: intentional patterns in systems that emerged via training rather than design. The user wants criteria to distinguish between artifacts of description, usefulness, and reality. The reality must support explanation, prediction, and intervention, with a modest claim about content for intentional patterns.

  Key distinctions they mentioned: reality vs. usefulness, stance availability vs. pattern reality, patterns in data vs. system, compression vs. export, degrees of reality. Plus, six specific cases to handle. 

  The table needs four columns: requirement, concrete case, negotiability, and exclusion. Then prose on conflicting requirements, most exclusionary requirement, and scorecards for four views.

  Hmm, the user is deep in the literature but wants fresh analysis. They explicitly reject citations, so focus on conceptual structure. The reflexivity case is crucial - can the account itself be a real pattern? That's meta.

  For requirement conflicts: Intervention demands vs. unmanipulable domains is tricky. If I insist interventions are necessary, astronomy patterns get excluded. But if not, causal grounding weakens. Probably a fake tension - interventions define causal patterns, but other patterns (like compressible regularities) can be real without causal manipulability.

  Principled codes vs. bounded investigator: Genuine tension. Kolmogorov complexity is uncomputable, so practical accounts must approximate. That exclusion hurts - many scientific patterns use domain-specific codes.

  Anchoring in mind-independence vs. stance-relativity: Fake tension. Intentional patterns can be real from a stance without physical reduction, as long as they're projectible. Dennett's view handles this.

  Most exclusionary requirement: Probably "Export Under Intervention". It kicks out non-causal patterns like astronomical regularities. But it's worth it for explanatory power in cognitive science.

  For the scorecards:
  - Dennett's compression: Fails intervention and graded reality. Good on stance-relativity but too permissive.
  - Two-part code: Better on contrived codes, still struggles with intervention. Computability issues.
  - Interventionist: Strong on export, but excludes unmanipulable patterns and resists degrees. Causal fundamentalism may be too strict.
  - Deflationary: Rejects reality/usefulness distinction entirely. Violates non-negotiables by collapsing the key distinctions.

  User's worry about "floating" intentional patterns without design stance is central. My framework must allow reality without reduction - hence the "Projectibility Beyond Stance" requirement. The near-miss case shows why graded reality matters.

  Better double-check if the reflexivity case is covered. Requirement 14 addresses it: the account must survive self-application. If it can't, it's self-defeating. Deflationary views might embrace that, but realist accounts can't.

  This feels solid. The user needs sharp tools, not surveys. The table structures their thinking; the conflict analysis preempts dead ends. They'll push back on exclusions - good, that's the point.
answer: |-
  Here is the specification of desiderata for an account of pattern reality, structured as requested. The table addresses the core distinctions and mandated cases, followed by analysis of tensions, exclusionary trade-offs, and candidate scorecards.

  ---

  ### **Desiderata for an Account of Pattern Reality**
  *(Job: Distinguish (a) artifact of description, (b) mere usefulness, (c) reality for explanation/prediction/intervention/content claims)*

  | Requirement | Concrete Case Justification | Negotiability & Camp | Exclusion if Enforced |
  |-------------|----------------------------|----------------------|----------------------|
  | **1. Compression with Predictive Payoff** | A neural network reliably detects tumors in novel scans. Its description compresses past scan data and predicts new cases accurately. | **Non-negotiable** (Realists, instrumentalists). Baseline for pattern-hood. | Mere coincidences (e.g., "all tumors occur on Tuesdays" in limited data). |
  | **2. Export to Novel Observations** | Kepler's laws compress planetary positions and predict future transits. | **Non-negotiable** (Universal). | Overfitted models (e.g., polynomial fitting noise). |
  | **3. Export Under Intervention** | A thermostat’s "goal" (maintain T) predicts not only future readings but *changed behavior* if you heat the room manually. | **Non-negotiable for causal explanations** (Interventionists). Optional for non-causal patterns (e.g., compressibility realists). | Patterns in purely observational sciences (e.g., galactic redshift patterns) if deemed non-real. |
  | **4. Vocabulary-Independence** | A coin flip sequence is random under binary encoding but compressible if described as "alternating H/T" using a ternary symbol set. Reality shouldn’t depend on arbitrary encoding choices. | **Non-negotiable** (Most realists). | Patterns only visible under post-hoc engineered codes (e.g., assigning symbols to noise). |
  | **5. Anchor in System Structure** | The "intentional pattern" in DeepMind’s AlphaZero (winning games via learned heuristics) is real because it persists across game variations, unlike a horoscope’s "predictions." | **Non-negotiable** (Anti-instrumentalists). | Observer-relative conveniences (e.g., seeing faces in clouds). |
  | **6. Stance-Neutral Reality** | The intentional stance predicts a chess engine’s moves, but its reality doesn’t require a design-stance decomposition (e.g., no "purpose" for individual weights). | **Preference** (Dennettians). Contested by reductionists. | Accounts requiring design-stance grounding for intentional patterns. |
  | **7. Non-Artifactual Coding Cost** | A string of 1000 'A's compresses well with a codebook including "repeat char X N times." A random string compressed with a codebook listing it verbatim isn’t real. | **Non-negotiable** (MDL/Algorithmic Info Theory). | Contrived-code cases (e.g., fitting a complex code to noise). |
  | **8. Graded Reality** | A cat-detecting AI is 99% accurate but consistently mistakes ragdolls. Its intentional pattern is real but imperfect. | **Preference** (Pragmatists). Binary views exist. | All-or-nothing verdicts (e.g., near-miss cases invalidate the pattern entirely). |
  | **9. Grain-Variance Tolerance** | Fluid dynamics shows laminar flow patterns at macro-scale, not at molecular scale. Neither grain is "false." | **Non-negotiable** (Emergentists). | Grain-fundamentalist accounts demanding one "true" scale. |
  | **10. Projectibility Beyond Stance** | Intentional patterns in animal behavior predict novel actions without assuming internal representations. | **Preference** (Anti-reductionists). | Patterns only valid within a single interpretive framework. |
  | **11. Intervention-Robustness (Conditional)** | Fossil patterns predict new finds but can’t be manipulated. Their reality shouldn’t require interventions. | **Non-negotiable for non-causal domains** (E.g., paleontology). | Accounts conflating pattern-hood with causal structure (excludes unmanipulable domains). |
  | **12. Non-Reflexive Vulnerability** | The account’s own reality criterion need not be a "real pattern" to avoid self-defeat. | **Preference** (Deflationists). Realists may demand self-consistency. | Accounts requiring their own criteria to be real patterns (risks infinite regress). |
  | **13. Distinction: Data-Pattern vs. System-Pattern** | Stock prices may show a "pattern" in price/time data that vanishes under volume-adjusted encoding. Reality resides in the system’s dynamics. | **Non-negotiable** (Scientific realists). | Naive compressionism (e.g., mistaking data artifacts for system properties). |
  | **14. Reflexivity Testability** | The account must be *able* to self-apply (e.g., "Is the real/artifact distinction a real pattern in philosophical discourse?"). | **Non-negotiable** (Meta-consistent views). | Theories that preclude self-examination (e.g., strict naturalism denying meta-patterns). |

  ---

  ### **Prose Analysis**

  #### (a) Suspected Requirement Conflicts
  1. **Intervention-Export + Non-Manipulable Domains (Req 3 vs. Req 11)**  
     *Conflict:* Genuine tension. Intervention-export implies causal structure, but unmanipulable domains (e.g., cosmology) host robust patterns.  
     *Resolution:* Req 3 applies *only* to patterns claiming causal-explanatory power. Req 11 ensures non-causal compressible regularities (e.g., galactic rotation) are real patterns *of correlation*. The account must bifurcate: causal patterns require intervention-support; non-causal patterns require robust projection (Req 2).  

  2. **Principled Coding Cost + Bounded Investigator (Req 7 vs. Practical Use)**  
     *Conflict:* Genuine tension. Kolmogorov complexity (minimal description length) is uncomputable. Requiring it excludes feasible scientific models.  
     *Resolution:* Adopt *two-part codes* (model + data given model). Charge for model complexity (e.g., neural network size) but accept computable approximations (e.g., MDL). Excludes contrived codes but allows tractable inference.  

  3. **Mind-Independent Anchor + Stance-Relative Reality (Req 5 vs. Req 6)**  
     *Conflict:* Fake tension. Req 5 anchors patterns in system structure (mind-independent), while Req 6 allows stance-relative patterns (e.g., intentional).  
     *Resolution:* The pattern is real *if* it supervenes on system structure *and* is projectible *from that stance*. Excludes patterns unmoored from structure (e.g., astrological "influences").  

  #### (b) Most Exclusionary Requirement & Cost  
  **Requirement 3 (Export Under Intervention)** excludes non-causal patterns (e.g., pure correlations in astronomy) from being "real" *for causal explanation*. This is costly for observational sciences but necessary to preserve the distinction between causal and correlational patterns. The trade-off is justified: it prevents overreach (e.g., interpreting compressible correlations as causal).  

  #### (c) Candidate Views Scorecard  

  1. **Dennettian Compression (Real Patterns)**  
     Violates Req 3 (no intervention-export), Req 8 (binary verdict), and Req 13 (confuses data/system patterns). Excels at Req 6 (stance-neutrality) and Req 9 (grain-variance). Disappoints by over-including (e.g., contrived codes may qualify as "real" if they compress).  

  2. **Minimum Description Length (MDL)**  
     Satisfies Req 7 (coding cost) and Req 2 (novel predictions). Struggles with Req 3 (interventions) and Req 11 (unmanipulable domains). Violates Req 14 if Kolmogorov complexity is invoked (uncomputable). Best for distinguishing contrived codes but silent on causal reality.  

  3. **Interventionist (Difference-Making)**  
     Excels at Req 3 (intervention-export) and Req 5 (system anchor). Violates Req 6 (demands design/reduction for intentional patterns), Req 11 (excludes unmanipulable patterns), and Req 8 (binary: interventions work or fail). Optimal for causal patterns but collapses pattern-hood into causal structure.  

  4. **Deflationary (Projection Relative to Interests)**  
     Violates Req 5 (no mind-independent anchor), Req 1 (usefulness ≠ reality), and Req 13 (no system/data distinction). Satisfies Req 9 (grain-relativity) and Req 10 (stance-bound). Collapses (a)/(b)/(c) distinctions entirely, failing the core job.  

  ---  
  This specification enforces your non-collapse demands while forcing accounts to confront the edge cases. The tensions highlight where commitments must be made (e.g., causal vs. correlational patterns). Use this to scaffold your criterion.
