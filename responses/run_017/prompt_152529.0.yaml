prompt: |-
  I'm in a seminar on the ethics and economics of markets, and I keep getting stuck on one feature of rent regulation that we haven't discussed. In many rent-regulated systems the protected tenancy is heritable but not saleable: a family member already living in the home can succeed to it and go on paying the controlled rent, but the sitting tenant cannot sell the right to occupy at that rent to anyone else, and landlords are barred from taking payment to hand a regulated tenancy over. Yet the gap between the controlled rent and the market rent is plainly worth money — a tenant who would happily move somewhere smaller is, in effect, sitting on an asset she is not allowed to cash in.

  What view of the tenant's interest does that combination presuppose? It seems to treat occupancy as something like a personal status attached to a household rather than as property — but then why is the interest transmissible at all, and why to a co-resident specifically rather than to whoever the tenant chooses? Suppose a city made the regulated tenancy freely transferable, so that the tenant could sell the right to renew at the controlled rent to any buyer at any price. What theory of the tenant's interest, and of what rent control is for, would that rule express, and what would it lose? And is the actual rule — heritable but inalienable — strictly committed to one story about that interest, or is it also compatible with views that treat rent control as a subsidy to households? Please answer in no more than 400 words.
reasoning: |-
  Hmm, the user is in a seminar discussing rent regulation ethics and economics, and they're puzzled by a specific feature: why regulated tenancies are heritable to co-residents but not saleable. They see a contradiction because the rent gap creates value that tenants can't monetize, yet they can pass it to family. They want to know what view of tenant interest this implies, how a freely transferable system would differ, and whether the current rule aligns with subsidy theories. I need to answer within 400 words, so I'll be concise and structured.

  First, I'll recall the key points from economics and policy. Rent control often aims for stability and affordability, not profit. The heritability part suggests it's tied to household continuity, like protecting vulnerable occupants from sudden displacement. Making it saleable would turn it into a market asset, which could inflate prices and undermine affordability goals. For example, if tenants could sell, landlords might resist, or speculators could exploit it, defeating the purpose of rent control.

  The user's scenario hints at confusion between personal status vs. property rights. I'll explain that the "inalienable but heritable" rule treats occupancy as a use-right based on need, not tradable property. Inheritance to co-residents makes sense because it maintains the household's home without commodifying it. If it were freely transferable, that would imply rent control is a personal subsidy—like a voucher—that tenants can cash out, but this risks market distortions and reduced housing stock for the needy. 

  On compatibility with subsidy views: Even if seen as a subsidy, limiting transfer prevents windfalls and keeps benefits targeted. The rule could fit a "household-based subsidy" model by ensuring aid stays with the unit for continuity. However, pure subsidy theories might prefer cash transfers over in-kind benefits like this. 

  I'll structure my response: Start with the presupposed view, contrast with transferable systems, then address subsidy compatibility. Keep it under 400 words by avoiding tangents. The user seems analytical, so I'll use terms like "use-right" and "commodification" to match their seminar level. Finally, I'll ensure my answer helps them debate in class by clarifying the ethical and economic tensions in rent regulation design.
answer: |-
  The "heritable but inalienable" rule presupposes a view of the tenant's interest as a **personal *use-right* tied to occupancy and household need**, not a marketable property right. It prioritizes security of tenure for the existing household unit over the tenant's freedom to capitalize on the economic value of the regulated rent.

  *   **Why heritable to co-residents?** It aims for continuity and stability *for the household already residing there*, preventing displacement upon the original tenant's death. It recognizes the home as a locus for an established household, extending protection to its existing members. Inheritance isn't about transferring an asset value; it's about preventing disruption to the specific family unit.
  *   **Why not saleable?** Saleability transforms the regulated tenancy into a **commodity**. This would:
      *   **Contradict Need-Based Justification:** Allowing sale treats rent control as a transferable financial asset ("cashable subsidy") rather than a tool to meet an immediate housing need for a specific occupant/household.
      *   **Undermine Affordability Goals:** The sale price would capture the discounted rent's value, potentially pricing out genuinely needy households. It creates a secondary market where the benefit flows to the outgoing tenant (or speculators), not the incoming resident.
      *   **Distort Markets & Incentives:** It could incentivize tenants to "hold" leases purely as assets to sell later, reducing mobility and efficient use of the housing stock, contrary to the policy's intent of efficiently allocating *existing* affordable units.

  **Freely Transferable Rule:** Making the tenancy freely sellable would express the view that rent control confers a **personal financial entitlement or subsidy** on the *tenant*, akin to a voucher they can cash out. It prioritizes the tenant's economic freedom over maintaining the unit as permanently affordable housing for needy occupants. It loses the focus on protecting *incumbent households* from displacement and stability, potentially commodifying the benefit and reducing the stock of truly affordable units as the subsidy is captured in the sale price.

  **Compatibility with Subsidy Views:** The "inalienable but heritable" rule *is* compatible with seeing rent control as a subsidy *to the household*, but crucially, it's a **non-cashable, in-kind subsidy tied to the specific occupied unit**. It delivers the benefit (below-market rent) directly *through* continued occupancy by the protected household (or its existing members). Preventing sale ensures the subsidy remains attached to the *housing unit* for the benefit of the qualifying *household*, preventing its monetization and diversion away from its purpose (providing affordable housing). It reflects a choice to deliver the subsidy *as housing*, not as liquid cash.
