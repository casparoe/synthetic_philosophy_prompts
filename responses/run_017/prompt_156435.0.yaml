  | Deductive | Absence never logically entails falsity | Platitude | No - only blocks disproof |
  | Evidential Weight | Absence never lowers P(H) | False | Only if true (but it's false) |
  | Sensitivity | Absence only evidentiary when search was sensitive | Defensible | Only if search was insensitive (here it wasn't) |
  | Burden of Proof | Proponent bears burden regardless of absence | Substantive | No - just shifts debate |
  | Strong | Absence is positive evidence for H | False | Yes but incorrect |

  Key points:
  - The sensitivity argument fails here because the Terra 9/Terra 11 contrast shows the absence is meaningful
  - The strong interpretation is wrong - absence can be evidence for alternatives

  For the silence budget principle:
  The strongest version is that each additional custodian required to maintain silence both explains absence and creates new leakage risks. We need to compare the leakage probability against the baseline expectation without conspiracy. Structured absence (like the Terra 9/Terra 11 contrast) makes the absence more evidentially significant because it controls for alternative explanations.

  Bottom line:
  In this case, the silence LOWERS the probability of the conspiracy claim. For silence to raise the probability, we'd need either:
  - Higher prior probability of conspiracy
  - Much lower expected leakage probability
  - Or the absence being more surprising under the no-conspiracy hypothesis

  The Terra 11 comparison is crucial - it makes the absence of Terra 9 studies particularly suspicious under the no-conspiracy view.
answer: |-
  ### Bayesian Setup
  If the conspiracy claim is true, we should expect: (1) no published nephrotoxicity study (deliberately suppressed); (2) no whistleblowers (successful cover-up); (3) abrupt end to Terra 9 studies post-1991 (avoiding scrutiny), with Terra 11 continuing (distracting focus). If false, we should expect: (1) possible published studies (if risk exists); (2) possible leaks (if malfeasance); (3) continued Terra 9 studies (no suppression motive), mirroring Terra 11.

  ### Part 1 & 2: Slogan Analysis

  | Reading (Ordered) | Precise Claim | Verdict | Supports Friend? |
  |-------------------|---------------|---------|------------------|
  | Deductive entailment | Absence of evidence never logically entails the falsity of H. | Platitude | No: Only blocks disproof, not support. |
  | Evidential weight | Absence of evidence never lowers P(H). | False: Absence can lower P(H) by supporting rival hypotheses. | No: Silence could undermine H if expected under alternatives. |
  | Sensitivity-dependent | The evidential force of absence depends on search sensitivity (P(absence|¬H) ≈1 if search insensitive). | Defensible: Absence is weak evidence if search was poor. | Only if search was insensitive (here, journals were active, so P(absence|¬H) is low). |
  | Burden of proof | Proponents of H bear the burden regardless of absence; absence doesn't shift it. | Substantive: Defensible normatively. | No: Doesn't make silence support H; just resists conceding. |
  | Strong (positive evidence) | Absence is always positive evidence for H if H predicts it. | False: H predicting absence isn't sufficient; P(absence|¬H) must be low. | Yes, but incorrect: Ignores alternatives (e.g., no nephrotoxicity). |

  ### Silence Budget & Structured Absence
  Your principle is sound: A cover-up hypothesis "spends" credibility to explain silence by positing custodians, but each custodian increases leak risk (P(leak) >0 per custodian/year). This exchange rate lowers P(conspiracy) unless P(leak) is very low. Structured absence (Terra 9 stops, Terra 11 continues) behaves differently: it lowers P(absence|¬H) by ruling out generic explanations (e.g., journal policy changes), making absence stronger evidence against ¬H.

  ### Bottom Line
  The silence *lowers* the probability of the conspiracy claim. The structured absence (vs. Terra 11) makes P(absence|¬H) low (unexpected without suppression), but the 30-year leak-free period with ~50 custodians makes P(absence|conspiracy) even lower due to high leak risk. For silence to *raise* P(conspiracy), P(leak) would need to be negligible (e.g., <0.1% annual chance) or the absence less surprising under ¬H (e.g., if Terra 11 studies also stopped).
