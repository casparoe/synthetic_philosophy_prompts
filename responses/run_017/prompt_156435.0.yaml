prompt: |-
  You are a professional philosopher who works in formal epistemology and has published on the epistemology of conspiracy theories. Think carefully before you answer: start with three or four sentences of setup in which you sketch, in rough Bayesian terms, what the relevant likelihoods are in this case — what we should expect to observe if the conspiracy claim is true, and what we should expect if it is false. Then give the final answer specified below.

  The situation. A friend and I have been arguing for months about a claim I'll call the Ashgrove case. In 1993, a trade association of industrial coating manufacturers (the "Ashgrove Consortium") allegedly commissioned an internal toxicology report on a widely used pigment ("Terra 9"), concluded from it that the pigment causes chronic kidney damage in factory workers, and buried it. Three facts are not in dispute: no study of Terra 9's nephrotoxicity has ever been published; no whistleblower or leaked document has ever surfaced in the thirty years since; and studies of Terra 9 for other endpoints (skin irritation, respiratory effects) appeared in the occupational-health literature regularly through 1991 and then stopped, while comparable studies of a chemically similar pigment, "Terra 11," kept appearing in the same journals at the same rate.

  Every time I press him on the silence, my friend says: "Absence of evidence is not evidence of absence. Of course nothing was published — that's exactly what you'd expect if they buried it. The silence is what a cover-up looks like."

  I think he is doing more than refusing to count the silence against him, and I can't get him to say what the slogan is supposed to mean. My own replies, for what they're worth: (a) the absence is structured rather than flat — it stops at a date and it doesn't apply to Terra 11; (b) a cover-up that has kept roughly fifty people quiet for three decades is itself the sort of thing that leaks, so the very hypothesis he uses to explain the silence also predicts a whistleblower, and he has to pay for the one with the other; (c) I have started calling this "the silence budget": a hypothesis that spends part of its credibility buying an explanation of why evidence is missing pays for that purchase with extra custodians of the secret, and every custodian is a fresh chance of a leak — so there is an exchange rate, and I suspect it is a bad one, but I can't state the principle precisely.

  What I want from you:

  1. A menu of the precise claims the slogan could be making, ordered from trivial to substantive to strong — for instance a claim about deductive entailment; a claim about whether missing evidence ever lowers a hypothesis's probability; a claim that makes the evidential force of absence depend on how sensitive the search was; a normative claim about who bears a burden of proof; and the strong reading my friend seems to want, on which the absence is positive evidence *for* the cover-up hypothesis. State each precisely enough to evaluate.
  2. For each reading: is it a platitude, substantive and defensible, or actually false? And does it do the work my friend needs it to do — does it let him treat the Ashgrove silence as supporting his claim, or at most as failing to undermine it?
  3. Sharpen or correct my "silence budget" principle: state the strongest version you can defend, say where it breaks down, and say whether structured absence (the Terra 9 / Terra 11 contrast) behaves differently from flat absence in a way that matters here.

  Format: give part 1 and 2 as a table with one row per reading and columns for the precise claim, your verdict, and whether it supports my friend. Then at most three sentences on the silence budget and at most three sentences of bottom line: in the Ashgrove case as described, does the silence raise, lower, or leave unchanged the probability of the conspiracy claim, and what would have to be true for it to raise it?

  Constraints: at most 600 words in total. Do not cite, name, attribute, or recommend any authors, papers, or books, and do not suggest further reading — reason from the case as I have described it.
