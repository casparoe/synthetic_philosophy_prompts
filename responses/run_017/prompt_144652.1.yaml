prompt: |-
  I'm in a seminar on perception right now, and our discussion of cognitive penetration keeps dying in the same place: someone offers a case — the Müller-Lyer, an ambiguous figure seen as a duck, a radiologist whose tumour pops out for her and not for me, a phone in a stranger's hand read as a gun — and someone else replies that this is attention, or memory, or judgement, or a change in which part of the scene you're looking at rather than a change in what you see. Nobody has said what would settle it, so before I read further into the literature I want the specification. Write the desiderata an adequate account of cognitive penetration has to meet: what a theory must be able to say about an arbitrary case in order to determine whether penetration occurred there; which distinctions it must be able to draw and must not collapse; the cases it has to get right, including at least one genuine perception that merely looks penetrated and one piece of mere cognitive influence that must not count as penetration; and the constraint that keeps the notion from collapsing into "any causal influence of cognition on experience" while still leaving penetration able to matter epistemically.

  Two things I want handled head-on, because I suspect they do most of the work. First, the conflict between the "same proximal stimulus, different experience" test and the "difference-maker in the best causal-explanatory story" test: these seem to come apart in cases where a cognitive state changes which features the visual system bothers to resolve, and I want to know which test a theory should be built around and what it would have to give up on the other. Second, I want the list to separate penetration of the sensory processing from penetration of the content perceived (which property the scene is represented as having) from penetration of phenomenal character from penetration of how the experience is taken up in judgement and report — and to say whether these are one relation that must travel together or several that can dissociate, since a theory that treats them as one will look refuted by cases that only touch one.

  Please also do three things with the list: mark each requirement as non-negotiable or as a preference of one camp (I'd guess the demand that a penetrated perception never be able to confirm the belief that penetrated it belongs in the second category, but I want your reasoning rather than my guess); flag any pair of requirements you think cannot be jointly satisfied, since the interesting result would be that the notion cannot do everything people want it to do; and name the single requirement that excludes the most accounts, with the case that makes it bite. You can mention the broad封装-style and predictive-processing pictures in a line or two each, but keep the weight on the criteria and the cases behind them, and don't give me readings — I have a syllabus.
reasoning: |-
  Okay, let me tackle this user's query about cognitive penetration in perception. They're in a seminar where discussions keep stalling because examples like Müller-Lyer or radiologists seeing tumors are dismissed as attention or judgment changes. The user wants clear criteria to determine if cognitive penetration occurs, including necessary distinctions and test cases. 

  First, I need to identify the core requirements. The user mentioned two key issues: the conflict between "same stimulus, different experience" versus "causal explanation" tests, and separating penetration types (sensory processing, content, phenomenology, judgment). I should address these head-on.

  For the first conflict, I recall that in cases where cognition changes what features are processed (like expert radiologists), the "same stimulus" test might fail because the visual system allocates resources differently. But the causal story shows cognition as the difference-maker. The user wants to know which test to prioritize. I think both are important but serve different purposes—phenomenal sameness versus causal role—so the account must accommodate both, even if it means accepting that penetration isn't a unitary phenomenon.

  Regarding penetration types, I consider examples. If wearing glasses distorts vision but cognition doesn't alter content, that's sensory change without cognitive penetration. A belief making a shape look like a duck alters content but not necessarily sensory processing. Penetration of content and phenomenology usually travel together, but judgment can dissociate, as in knowing the lines are equal in Müller-Lyer while still seeing them as unequal. So these can dissociate, and a theory must separate them.

  The user also wants desiderata marked as non-negotiable or camp-specific. For instance, the idea that penetrated perception can't confirm the penetrating belief is likely a preference from epistemological camps worried about circularity. But empirical accounts might reject this. I'll note that as contested.

  Possible conflicts arise between requirements. If we demand both phenomenal difference and cognitive causation, but some cases involve cognitive influence without phenomenal change (like gist perception), that might exclude valid penetrations. Also, insisting that penetrated experiences can't justify beliefs might clash with accounts where penetration enhances reliability, like radiologists.

  The strictest requirement is likely the cognitive difference-maker under stimulus control, excluding cases like adaptation or fatigue. For example, hunger affecting brightness perception isn't penetration because it's not cognitive.

  Test cases: the radiologist is genuine penetration—her knowledge changes perceived content. The afterimage with belief is not penetration; it's judgment affecting interpretation. The ambiguous figure with suggestion might be borderline; if prior belief makes you see a duck, it could be penetration, but if it's attention shifting, not.

  I should structure the desiderata clearly, flagging each point's status and conflicts. Highlighting the key tension between phenomenal and causal criteria will show why debates stall. Emphasizing the separability of penetration types can resolve deadlocks in seminar discussions. The radiologist case will illustrate a genuine penetration that meets all criteria, while hunger or judgment-only cases show what's excluded.
answer: |-
  Here are the desiderata for an adequate account of cognitive penetration (CP), designed to resolve seminar deadlocks. Requirements are categorized, conflicts highlighted, and key distinctions enforced. The core tension between "phenomenal sameness" and "causal difference-making" is addressed directly.

  **Core Desiderata (Non-Negotiable):**

  1.  **Stimulus Control Requirement:** CP must involve a change in perceptual experience *despite identical proximal sensory input* at the relevant time. (Excludes: changes due solely to moving eyes/head, varying ambient light, retinal fatigue).
  2.  **Cognitive Causation Requirement:** The difference in experience must be *causally explained*, in significant part, by a prior or concurrent cognitive state (e.g., belief, desire, expectation, conceptual knowledge). (Excludes: changes solely due to low-level sensory adaptation, fatigue, intoxication, direct neural stimulation).
  3.  **Distinction Requirement (Processing vs. Content vs. Phenomenology vs. Uptake):** The account must distinguish:
      *   **Sensory Processing Penetration:** Cognition alters early/mid-level visual computations (e.g., gain control, feature binding).
      *   **Content Penetration:** Cognition alters the representational *content* of the experience itself (what properties the world is represented as having).
      *   **Phenomenal Penetration:** Cognition alters the subjective *character* of the experience (what it's like).
      *   **Judgmental/Uptake Penetration:** Cognition alters only the post-perceptual judgment, belief formation, or report *based on* the experience.
      *   *Crucially:* These *can dissociate*. A theory must not assume they always travel together. (e.g., Content/Phenomenal often co-vary; Processing might change without affecting Content/Phenomenology; Uptake can change independently).
  4.  **Non-Triviality Constraint:** CP cannot be trivially equivalent to *any* causal influence of cognition on experience. It must be a *specific kind* of influence. (Excludes: cognitive effects on spatial attention selection *prior* to fixation, cognitive effects on memory recall of a perception, cognitive labeling *after* experience).

  **Important but Contested/Possibly Camp-Specific Desiderata:**

  5.  **(Contested) Epistemic Friction Requirement (Preference - Epistemological Camp):** A genuinely penetrated perceptual experience *cannot provide independent justification* for the very cognitive state that penetrated it. (e.g., If belief B makes you see X as F, that seeing cannot justify B). (Rationale: Avoids vicious epistemic circularity. Opponents argue this is an epistemic constraint, not part of the *metaphysical* CP definition).
  6.  **(Preference - Empirical/Mechanistic Camp) Process Location Requirement:** CP requires cognition to directly influence processes traditionally considered "perceptual" (e.g., early visual cortex, ventral stream) rather than only post-perceptual systems. (Rationale: Grounds CP in cognitive architecture. Opponents argue functional role matters more than precise neural locus).
  7.  **(Preference - Phenomenological Camp) Phenomenal Manifestation Requirement:** CP must result in a *phenomenologically discernible* difference in the conscious experience. (Rationale: Connects CP directly to subjective life. Opponents argue CP could occur sub-personally without changing "what it's like").

  **Crucial Distinctions the Account Must Draw:**

  *   **Attention (Selection) vs. Penetration (Alteration):** Does cognition change *which part* of the input is processed (attention) or *how the selected input itself is processed/experienced* (potential penetration)? (e.g., Looking at the "duck" part of the figure vs. the lines themselves looking duck-like).
  *   **Cognitive *Effect on Input* vs. Cognitive *Effect on Processing*:** Did cognition change the stimulus *before* it hit the senses (e.g., moving your eyes) or change the processing *of* the stimulus?
  *   **Interpretation/Judgment vs. Perceptual Content:** Is the "duck" part of the *experience itself* or a belief *about* the experience?
  *   **Learned Perceptual Skill vs. Cognitive Penetration:** Is the radiologist's "popping out" a result of automated, cognitively impenetrable perceptual learning (like recognizing faces) or does it involve ongoing top-down conceptual influence?

  **Key Test Cases the Account MUST Handle:**

  *   **Genuine CP (Must Count):** **Expert Radiologist:** Same X-ray image, same fixation. For the expert, the tumor *looks* salient, distinct, and "pops out" phenomenally due to years of training/knowledge. For the novice, it's a confusing gray blob. (Meets: Stimulus Control, Cognitive Causation, likely Content/Phenomenal Penetration). *Contrast with:* Expert noticing the tumor faster due to knowing *where* to look (Attention/Judgment).
  *   **Mere Cognitive Influence (Must NOT Count as CP):** **Hungry/Happy Brightness:** You believe food is brighter if you're hungry, or the world looks brighter when happy. BUT, when rigorously tested with brightness matching tasks under controlled fixation/stimuli, the *perceived brightness* doesn't change; only the judgment/affective response does. (Violates: Phenomenal Manifestation/Content Penetration; may violate Stimulus Control if affect alters pupil size).
  *   **Borderline/Revealing Case (Must Explain Why/Why Not):** **Ambiguous Figure (Duck-Rabbit):** You're told "It's a duck". You then *see* it as a duck. Is this CP (belief altering perceptual content) or merely attention/judgment? (Account must say *what* changes – is the *visual gestalt* reconfigured (Penetration) or is it just conceptual priming of judgment (Uptake)?).

  **Head-On Handling of Core Tension:**

  *   **"Same Stimulus, Different Experience" vs. "Causal Difference-Maker" Conflict:** This conflict arises because cognition can change *what is processed* (e.g., via attention) *without* changing the *processing algorithm itself* for the selected input. An adequate account **must prioritize the "Same Stimulus" requirement** as the *necessary starting point* for identifying a *candidate* case of CP. Without stimulus control, we can't isolate the effect. However, satisfying "Same Stimulus" is *not sufficient*.
      *   **What it must give up:** It must accept that in cases where cognition changes *which features are resolved/attended to*, **even under fixation** (e.g., expert recognizing a complex pattern *in* the attended area), this *might* still be CP *if* the change manifests in perceptual *content/phenomenology* and isn't *just* a shift in judgment. The "Causal Difference-Maker" test then applies *within* the frame of stimulus control: *Why* does the same input yield different content? If the best explanation centrally involves the cognitive state *altering the perceptual processing or content* (not just selecting input or biasing judgment), then CP occurs.
      *   **Resolution:** The "Same Stimulus" test defines the *phenomenal contrast* to be explained. The "Causal Difference-Maker" test, applied *within* this constraint, identifies *whether cognition is the direct cause of the altered perceptual outcome*. If cognition only causes a change in input selection (attention) *within* the fixed proximal stimulus, and the perceptual processing of the *selected* input is unchanged, it's not CP. If cognition changes *how* the selected input is processed into content, it is CP.

  **Flagged Conflicts Between Requirements:**

  1.  **Phenomenal Manifestation vs. Process Location:** Can there be CP affecting early processing (Process Location) without changing conscious phenomenology (Phenomenal Manifestation)? If so, accounts requiring Phenomenal Manifestation exclude these cases, while Process Location accounts might include them.
  2.  **Epistemic Friction vs. Reliability:** If CP makes perception *more accurate* (e.g., expert radiologist), does it still violate Epistemic Friction? If CP cannot justify the penetrating belief, how can it enhance overall perceptual reliability? These epistemic goals may be in tension.

  **The Strictest Requirement (Excludes the Most Accounts):**

  *   **Stimulus Control Requirement + Non-Triviality Constraint.** This combination excludes pervasive alternative explanations like attention shifts, memory effects, judgment biases, and low-level physiological changes. **The case that makes it bite hardest: The "Phone/Gun" Misperception.** Same proximal stimulus (shape in hand). Is the misperception due to *penetration* (fearful expectation altering visual processing/content, making the phone *look* gun-like) OR is it due to *inattentive perception* followed by a *hasty judgment* based on a blurry glimpse? Only accounts that can rigorously enforce stimulus control (e.g., brief exposure, forced fixation) and distinguish altered content from post-perceptual judgment will correctly classify this. Most naive accounts and many philosophical proposals collapse here, attributing the error to CP when it might be poor perception + cognitive bias.

  **Brief Notes on Frameworks:**

  *   **Fodorian Modularity:** CP is impossible/largely impossible. Perception is "encapsulated." Desiderata 1 & 2 are paramount; genuine CP cases are rare (if any). Radiologist is learned skill or judgment.
  *   **Predictive Processing (PP):** CP is pervasive and fundamental. Top-down predictions (cognition) *constitutively* shape perceptual inference at all levels. Desideratum 3 distinctions blur; PP sees a continuum. Radiologist is paradigmatic CP. Stimulus Control is still crucial but interpreted within the Bayesian frame (same "bottom-up" input). PP struggles most with Non-Triviality and Epistemic Friction.

  This framework provides the tools to dissect seminar examples rigorously. The core move is demanding **stimulus control** to isolate the *perceptual* effect, then asking **what changed (processing/content/phenomenology/judgment)** and **why (causal role of cognition)**. It explicitly allows that cognition can influence perception in multiple ways, only *some* of which count as penetration.
