prompt: |-
  Two people in my decision-theory reading group got into it after we went over the Hofstadter stuff on superrationality, and they asked me to settle it, which I definately can't. Here is roughly how it went.

  The case Marta kept using was this. Two players, no communication, both perfect reasoners, each knows the other is a perfect reasoner, common knowledge all the way up. A fair coin decides which one is the "strong" player and which is the "weak" player, and each is told which one they are. Then they play a one-shot prisoners' dilemma. Temptation and sucker payoffs are the same for both: defect while the other cooperates and you get 5000, cooperate while the other defects and you get 0, both defect and you get 1000. The only difference is the reward for mutual cooperation: the strong player gets 3000, the weak player gets 1500. So it's still a PD for both of them, but the weak player gains only 500 from mutual cooperation over mutual defection, while the strong player gains 2000.

  (1) Marta opened with: superrationality is either evidential decision theory in a costume or it's a mistake. The move where you say "I'm not choosing between cooperate and defect, I'm choosing between us-both-cooperating and us-both-defecting" assumes the very thing that needs arguing for, namely that my decision settles his. Causal decision theory says: whatever he does, I do better by defecting. The correlation is just evidence, and if you want to act on evidence you're an EDT person and you don't need a new word for it.

  (2) Sascha: that misdescribes the view. What's chosen isn't an act, it's the output of a reasoning procedure that happens to be running in two places. That's why it doesn't collapse into EDT: EDT buys correlation wherever it finds it, which is why it tells you not to smoke in the smoking-lesion case — it manages the news instead of the world. Superrationality only cares about correlation that comes from the same reasoning being instantiated twice. And it's also why you don't get to defect once you learn you're the weak player: there's no later self who reopens the question.

  (3) Marta: ok, take it at the level of procedures and apply it to my game. Two things happen. If superrationality is "do what you'd want every relevantly similar reasoner to do," it has no grip here at all — the players aren't mirrors, they're one procedure with different inputs, so there's no single act they must both land on. If instead you evaluate policies from behind the veil, before the coin, then mutual cooperation isn't the best one. Mutual cooperation is worth 2250 a head ex ante. The policy "whoever is strong defects, whoever is weak cooperates" is worth 2500, and so is its mirror image; and since we're running identical reasoning we can share a coin flip to choose between them, so 2500 each. Note that the exploited weak player ends up with 0, which is worse than the 1000 he'd get from mutual defection and worse than the 1500 from mutual cooperation. So superrationality taken seriously as policy choice tells us to flip a coin to decide which of us gets 5000 and which gets nothing. That's a reductio of the theory, not a solution to anything.

  (4) Sascha: the craziness is an artifact of counting dollars. Under even mild concavity the ranking flips: with square-root utility, the coin policy is worth about 35 to each of us ex ante, against about 47 for mutual cooperation, because it puts half your probability on zero. So the answer depends on a parameter you left free, which is normal in decision theory, not a reductio. And it cuts both ways — a risk-seeking weak player likes the coin policy even more than I said.

  (5) Marta: but that's just my point showing up in a new place. Now the answer depends on whose utility function the procedure is maximizing and how you combine them. In the symmetric case there's only one utility function in the room so nobody notices. Here the stakes differ, so the attitudes to risk can differ, and "what would we want the procedure to output" has no answer until you import a rule: sum the utilities, maximise the worst off, average behind a veil, pick a Nash bargaining point. The rule does all the work. So the superrational solution to the one-shot PD was never rationality alone — its rationality plus the assumption that everyone in the room wants the same thing, which is exactly what fails in any real conflict.

  (6) Sascha: overstated. Even with divergent interests the framing still rules out the outcome ordinary decision theory walks straight into, and it relocates what's left over: not whether to cooperate but how to split. That's progress, not silence. And "you imported an aggregation rule" applies to every multi-agent decision problem there is, two people picking a restaurant included, so it doesn't tell us anything special about superrationality.

  Can you go through this move by move and tell me who's right about what? I'd like each of the six moves rated somewhere from clearly mistaken to clearly right with a sentence or two of justification, then a verdict on who is more right overall. And the bit I actually care about: what are they both missing? My only guess is that the whole things hinges on whether the two players are really perfect correlates once their inputs differ — Marta just helps herself to "same procedure, different inputs" in move 3, but I don't see why different inputs can't break the correlation in the randomisation too, in which case the coin-flip policy in move 3 isn't even available — but I really don't know, and neither of them addressed it. Say what you think the unexamined assumption is, even if it isn't that one.
reasoning: |-
  Okay, I'm diving into this fascinating debate between Marta and Sascha about superrationality. The scenario involves two players in an asymmetrical Prisoner's Dilemma where one is "strong" and gets higher payoffs for mutual cooperation. Marta starts by criticizing superrationality as either EDT in disguise or flawed, arguing that CDT clearly favors defection. Sascha counters that superrationality is about identical reasoning procedures, not just correlation.

  The key points I notice: Marta's move 3 introduces a clever policy where players use a coin flip to decide who exploits whom, claiming this yields higher expected utility than mutual cooperation. But I'm suspicious - can they really coordinate this when they receive different inputs about their strength? That seems crucial. 

  Sascha responds in move 4 that risk aversion changes the calculation, but Marta correctly points out in move 5 that without identical utility functions, we need aggregation rules. This exposes a hidden assumption in symmetric superrationality cases. 

  The core tension I see is whether "same procedure + different inputs" preserves enough correlation to implement coordinated asymmetric strategies. If not, mutual defection might be inevitable, making the coin-flip policy infeasible. Both debaters seem to overlook this implementation challenge while focusing on ex ante evaluations.

  I'll analyze each move's validity, then determine who's more right overall. Marta seems stronger on exposing superrationality's hidden assumptions, while Sascha rightly notes it reframes bargaining problems. But both miss that input differences may prevent the coordination they debate about.
answer: |-
  Here's a move-by-move analysis, verdicts, and identification of the core unexamined assumption:

  ### Move-by-Move Analysis
  1.  **Marta (Superrationality = EDT or mistake):** **Mostly Right.** Marta correctly identifies that superrationality relies on evidential correlation (like EDT) and that CDT strictly dominates defection. Her claim that it "assumes the very thing that needs arguing for" is fair. However, she slightly misrepresents the superrationality claim, which explicitly rejects the CDT framing ("I'm not choosing between C and D...").
      *   *Verdict:* **Mostly Right, Minor Misrepresentation.**

  2.  **Sascha (Superrationality ≠ EDT; Identity of Procedure):** **Partially Right.** Sascha correctly distinguishes superrationality's focus on *procedural identity* from EDT's general correlation-seeking. His point about no "later self" reopening the question highlights a key difference from standard sequential decision-making. However, he doesn't address *why* procedural identity guarantees perfect correlation, especially with different inputs. This is the core vulnerability.
      *   *Verdict:* **Partially Right, Avoids Core Issue.**

  3.  **Marta (Policy Choice & Asymmetric Reductio):** **Insightful but Flawed Application.** Marta brilliantly exposes the challenge asymmetry poses to superrationality. Her "coin-flip policy" argument highlights the need for an aggregation rule when interests diverge. Her critique that mutual cooperation isn't ex-ante optimal is numerically correct *if the coin-flip policy is feasible*. **The flaw is assuming this policy is implementable under superrationality.** Can two identical procedures with *different inputs* reliably coordinate asymmetric randomization? This is the unexamined assumption.
      *   *Verdict:* **Insightful Critique, But Premise (Feasibility of Asymmetric Policy) is Questionable.**

  4.  **Sascha (Risk Aversion):** **Technically Correct but Misses the Point.** Sascha is right that incorporating risk aversion changes the ex-ante evaluation and makes mutual cooperation potentially preferable to the coin-flip gamble. This highlights that the "best policy" depends on utility functions. However, this doesn't resolve Marta's core critique about *divergent interests requiring an aggregation rule*. It merely shifts the parameter needing aggregation (risk aversion) without solving the aggregation problem itself.
      *   *Verdict:* **Technically Correct, Sidesteps Core Critique.**

  5.  **Marta (Need for Aggregation Rule):** **Clearly Right.** Marta nails the fundamental issue exposed by asymmetry. Superrationality in symmetric PDs implicitly assumes identical interests ("everyone in the room wants the same thing"). With divergent payoffs (and potentially divergent risk attitudes), determining the "best" output for the identical procedure requires aggregating heterogeneous preferences. This *is* importing a social choice rule (sum, min, Nash, etc.), which is external to individual rationality. Her point about this applying to any real conflict is valid.
      *   *Verdict:* **Clearly Right.**

  6.  **Sascha (Reframing as Progress):** **Partially Right.** Sascha is correct that superrationality reframes the problem, potentially ruling out mutual defection and highlighting the bargaining/splitting aspect. He's also right that aggregation rules are needed in *any* multi-agent coordination problem. However, this doesn't save superrationality *as a theory of individual rationality*. Its initial appeal in symmetric cases stemmed from appearing to derive cooperation from individual rationality alone. Marta shows this was an illusion; it relied on hidden symmetry and effectively smuggles in a social choice element. Acknowledging the need for aggregation is admitting the theory doesn't deliver "rationality alone" as originally advertised.
      *   *Verdict:* **Partially Right (on reframing), But Concedes Marta's Core Point.**

  ### Overall Verdict
  **Marta is more right overall.** She successfully exposes the fundamental limitations of superrationality:
  1.  It relies on evidential reasoning (like EDT) rather than overcoming CDT's dominance argument through pure causal rationality.
  2.  Its apparent success in the symmetric PD crucially depends on the strong symmetry of interests/payoffs/risk attitudes.
  3.  When this symmetry breaks (as in her asymmetric game), superrationality cannot determine a unique "rational" outcome without importing an external aggregation rule, undermining the claim that it solves the PD through individual rationality alone.

  Sascha provides valuable clarifications (distinguishing it from EDT, emphasizing the procedure identity, noting risk aversion) and correctly points out the reframing and the universality of aggregation problems. However, he doesn't successfully counter Marta's core critique that superrationality fails as a theory of *individual* rationality in the face of divergent interests.

  ### The Unexamined Assumption: Correlation Under Different Inputs
  **You identified the critical unexamined assumption perfectly:**

  > **"whether the two players are really perfect correlates once their inputs differ"**

  *   **Why it's central:** Superrationality's core claim is that identical procedures *must* output the same action. This is plausible only if the input differences ("strong" vs. "weak") *do not break the logical symmetry in a way that forces different outputs*. Marta assumes (move 3) that the procedure can output a complex, asymmetric *policy* ("strong defects, weak cooperates") based on the input. Sascha doesn't challenge this.
  *   **The Problem:** For the identical procedure to output this asymmetric policy, the procedure's logic must treat the "strong" and "weak" inputs symmetrically *in the decision rule itself*. How? The procedure must be something like: "If I am strong, defect; if I am weak, cooperate." But *this very rule ensures different outputs given different inputs*. There is no logical contradiction forcing both instances to choose the *same* action (C or D) anymore.
  *   **Consequence:** If the inputs break the symmetry sufficiently, the superrational correlation collapses. Each player, knowing they are running an identical procedure but with a different input, cannot be certain the other will output the same *action* (C or D). They can only be certain the other is following the same *rule*. But if the rule says "Do X if strong, Y if weak," then a strong player knows the weak player will do Y, and vice versa. This reintroduces the standard PD incentives: each knows what the other *should* do according to the rule, but each also has an incentive to defect *against that expectation*.
  *   **Outcome:** Implementing Marta's coin-flip policy becomes highly problematic under strict superrationality. The mutual defection outcome becomes a real possibility again, as each player might reason that the other, knowing *their own* input, will follow the asymmetric rule, creating an opportunity to exploit. The ex-ante 2500 expectation relies on perfect coordination, which the differing inputs might prevent. Mutual cooperation remains an option only if the identical procedure can find a reason to output "C" *despite* the differing inputs and asymmetric payoffs – which circles back to needing an aggregation rule (e.g., "maximize the sum of ex-ante expected utilities").

  **In essence:** The unexamined assumption is that procedural identity guarantees action identity *even when inputs differ in a way that creates asymmetric incentives*. This assumption is crucial for making asymmetric policies like the coin flip seem feasible under superrationality. Challenging this assumption reveals that superrationality may be far less robust to asymmetry than Marta's reductio assumes, but also far less able to deliver cooperative outcomes in asymmetric situations than its proponents might hope. It highlights the fragility of the correlation superrationality relies upon.
