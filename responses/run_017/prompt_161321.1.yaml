  I'm taking an upper-level philosophy of physics seminar and preparing a presentation on the Rietdijk–Putnam argument, and I'd like you to build me a version of it whose force does not come from cosmological distances.

  The scenario should involve only observers, speeds, and distances from ordinary life or ordinary technology — an airliner, an orbiting satellite, someone walking past me on the street — and the size of the disagreement about what is present should actually be computed rather than gestured at: set out the arithmetic in plain terms and give me a number, even if it comes out in microseconds or less. What I want to test is whether the argument survives at that scale, because at mundane scale the two standard dismissals — that the simultaneity judgments of some remote, fast-moving object carry no ontological weight, and that the disagreement is only a conventional choice of coordinates — can no longer be written off as artifacts of an exotic setup and have to be answered on their own terms.

  After the scenario, please do three things: state what the block-universe theorist concludes from it and what the presentist and the growing-block theorist each say in reply; identify the single premise doing all the work, and show why the mundane case and Penrose's Andromeda-scale version stand or fall together by that premise rather than merely differing in degree; and tell me which reply you think the presentist should give here, together with what that reply costs them elsewhere in their view. Constraints: no acceleration, no gravity, nothing science-fictional, no appeal to a privileged cosmic frame, and the conclusion must follow from the premises rather than be built into the setup. Keep the scenario itself to one paragraph, and please write the whole answer in American English.
