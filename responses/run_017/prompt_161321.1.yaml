answer: |-
  Here is a self-contained Rietdijk-Putnam argument using mundane speeds and distances, followed by the requested analysis.

  **Scenario:** Alice stands still on the ground. Bob flies directly overhead in an airliner moving at 300 m/s relative to Alice (a typical jet speed). Alice has a precise atomic clock synchronized (in her frame) with another atomic clock located 300 km away on the ground along Bob's flight path. At the exact moment (in Alice's frame) Bob passes overhead, both of Alice's clocks read exactly 12:00:00.0000000000. According to special relativity, Bob, moving inertially, will disagree with Alice about what events are simultaneous with his passing overhead. Specifically, he will judge the distant clock (300 km away in the direction of his motion) to read *later* than 12:00:00.0000000000 at the moment he passes Alice.

  **Calculation of Disagreement:**  
  The formula for the relativity of simultaneity is δt = (v * x) / c², where:  
  *   v = relative speed = 300 m/s (airliner speed)  
  *   x = spatial separation along motion direction = 300,000 m (300 km)  
  *   c = speed of light = 299,792,458 m/s ≈ 3.00 × 10⁸ m/s  
  *   c² ≈ 9.00 × 10¹⁶ m²/s²  
  δt = (300 m/s * 300,000 m) / (9.00 × 10¹⁶ m²/s²) = (90,000,000 m²/s) / (9.00 × 10¹⁶ m²/s²) = 1.00 × 10⁻⁹ seconds = 1 nanosecond.  
  Bob judges the distant clock to read **12:00:00.0000000010** (10 nanoseconds *later*) when he passes Alice, while Alice judges it to read **12:00:00.0000000000**.

  **Conclusions and Replies:**  
  1.  **Block-Universe Theorist:** Concludes that the disagreement demonstrates the relativity of simultaneity. Since both Alice's and Bob's inertial frames are equally valid, there is no unique, frame-independent "present moment." Events that are future for Alice (e.g., the distant clock reading 10 ns later) are present for Bob *now*. Therefore, all events across spacetime must exist timelessly in a four-dimensional block; presentism and growing-block views are incompatible with special relativity.
  2.  **Presentist:** Must deny the ontological significance of Bob's simultaneity judgment. They reply that *only* the events simultaneous in the *correct* (i.e., privileged) frame are truly present. Bob's judgment about the distant clock reflects a mere artifact of his coordinate system, not reality. What is "now" is absolute, even if observers in motion disagree locally. Bob is simply *wrong* about what is present at the distant location.
  3.  **Growing-Block Theorist:** Must reconcile "becoming" with relativity. They reply that becoming is *local* or *frame-dependent*. The block grows along the worldlines of individual observers or within their local light cones. There is no single, global "now" slicing the universe. Events become real *for Bob* along his simultaneity hyperplane, meaning the event of the distant clock reading 10 ns later becomes real *for Bob* at the moment he passes Alice, even though it hasn't become real *for Alice* yet.

  **The Single Premise Doing All the Work:**  
  The argument hinges entirely on the premise that **all inertial reference frames are ontologically equal**. There is no physically privileged frame of reference; the laws of physics (including electrodynamics, underpinning clocks and signals) hold identically in every inertial frame. This premise establishes that neither Alice's nor Bob's judgment about simultaneity is merely conventional or perspectival in a way that lacks ontological weight – both describe the *actual* structure of spacetime equally well.

  **Why Mundane and Cosmic Cases Stand or Fall Together:**  
  The argument doesn't rely on the *size* of the simultaneity shift (δt), only on its *existence* due to the relativity of simultaneity *combined with* the ontological equality of frames. Penrose's Andromeda version (where δt could be months or years) differs only in the numerical value calculated using the same formula (δt = vx/c²). If the ontological equality of frames is accepted, then *any* non-zero δt, whether 1 ns or 1 year, forces the conclusion that "what is present" is frame-dependent. Rejecting the conclusion for the mundane case solely because δt is small requires arguing that ontological significance depends on the *magnitude* of the disagreement – a position lacking any basis within relativity itself. Accepting the premise demands accepting the consequence regardless of scale; rejecting the consequence necessitates rejecting the premise outright.

  **The Presentist's Best Reply and Its Cost:**  
  The most defensible presentist reply here is to **deny the ontological equality of inertial frames** and posit a **privileged reference frame** (e.g., the frame defined by the average motion of matter in the universe, or some fundamental substratum). This directly targets the core premise. Bob's simultaneity judgment is then merely a *conventional* artifact of his coordinate system, not reflecting the true, frame-independent structure of becoming. The cost is severe: **this move explicitly violates the principle of relativity as understood in modern physics.** While Lorentzian interpretations (with a dynamical aether) are logically possible, they are empirically indistinguishable from Special Relativity *except* for their ontological commitment to a privileged frame. This commitment is widely seen as ad hoc and contrary to the spirit (though not the letter) of relativity, which finds no experimental need for such a frame. The presentist sacrifices deep compatibility with fundamental physics to preserve absolute becoming.

  This mundane scenario forces the ontological debate into the open, stripping away the distraction of cosmological scales and making clear that the dispute hinges solely on the acceptance or rejection of the ontological equality of inertial frames.
