  - Probe tests: Adding a 13th image where human judgment and a shallow rule disagree - if the solver gets it wrong, does that prove they didn't have the concept?
  - Generation tests: Asking the solver to generate images based on a rule - if they can classify but not generate, what does that say about their understanding?

