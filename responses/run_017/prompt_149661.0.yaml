answer: |-
  Here is a structured set of criteria for evaluating accounts of the "could have done otherwise" condition, designed to underwrite real-world excuse practices without presupposing determinism's truth. Requirements are motivated by core cases, marked for negotiability, and followed by your cases, incompatibility diagnosis, and scorecards.

  ---

  ### **Core Requirements for an Adequate Account**
  1. **Distinguish Compulsion/Duress from Frankfurt Cases**  
     - *Motivation*: A gun to your head (duress) excuses; a Frankfurt intervener (who doesn't act) doesn't.  
     - *Non-negotiable*: Any account must explain why duress undermines responsibility but covert intervention (e.g., Frankfurt's Jones/Black case) doesn't.  
     - *Key test*: If the agent acts identically *without* the threat/intervention, is responsibility preserved?  

  2. **Handle Omissions/Failures to Prevent**  
     - *Motivation*: Not saving a drowning child because you *couldn't swim* vs. *chose not to*.  
     - *Non-negotiable*: Must explain why physical inability excuses, but mere unwillingness doesn't.  
     - *Example*: A guard fails to press a lifesaving button due to paralysis (no responsibility) vs. laziness (responsibility).  

  3. **Resolve Manipulation/Indoctrination**  
     - *Motivation*: An agent acts "freely" but was programmed (e.g., Mele's "Ann/Beth" case).  
     - *Negotiable (partisan)*: Source incompatibilists demand history matters; actual-sequence theorists reject this.  
     - *Tension*: If the agent meets local control conditions *at the time of action*, is she responsible?  

  4. **Address Resultant Moral Luck**  
     - *Motivation*: Two reckless drivers: one kills a pedestrian (luck), one doesn't. Criminal law punishes differently.  
     - *Non-negotiable*: Must accommodate outcome-dependent blame practices.  
     - *Challenge*: Can responsibility vary based on luck if neither "could have done otherwise" in the actual sequence?  

  5. **Explain Diminished Capacity**  
     - *Motivation*: A child or mentally ill person lacks responsibility despite "choosing" an action.  
     - *Non-negotiable*: Account must align with legal insanity/immaturity defenses.  
     - *Key*: Focus on *ability to grasp reasons*, not just physical alternatives.  

  6. **Clarify Ignorance of Inability**  
     - *Motivation*: An agent doesn't know they’re locked in a room but stays willingly. Is she responsible?  
     - *Negotiable*: Some argue ignorance excuses; others say only abilities matter.  
     - *Case*: If you *would* have left but couldn’t, are you blameworthy for staying?  

  7. **Actual Sequence vs. Alternatives**  
     - *Motivation*: Frankfurt cases challenge PAP ("could have done otherwise" is necessary). Flicker-of-freedom replies argue alternatives exist (e.g., "could have wavered").  
     - *Negotiable (central debate)*: Must PAP be satisfied *somehow*, or is actual control sufficient?  
     - *Dilemma*: If the intervener’s trigger is chancy, does it reintroduce alternatives?  

  8. **Answerability: Historical or Current?**  
     - *Motivation*: Manipulation cases push for historical conditions (source of agency); Frankfurt cases favor current structure (control at *t*).  
     - *Negotiable*: Source incompatibilists vs. semi-compatibilists’ core disagreement.  

  ---

  ### **Your Cases & How Requirements Apply**
  - **Reason-Swap Variant**:  
    - *Issue*: If intervention induces panic (not conviction), is she answerable for *acting* or for *acting for her reasons*?  
    - *Requirements at stake*: #3 (manipulation), #8 (history vs. current).  
    - *Cost*: If answerability requires actual reasons (#8 historical), she isn’t responsible. Actual-sequence views (#7) may still hold her responsible for the *act*.  

  - **Decaying Monitor**:  
    - *Issue*: Ability fades from near-certain to negligible. Does responsibility decay?  
    - *Requirements at stake*: #1 (threshold for compulsion), #5 (capacity), #6 (ignorance of inability).  
    - *Verdict*: Non-scalar views (#5) require categorical capacity thresholds (e.g., understanding reasons). Scalar ability (#1) suggests graded blame, but law/practice favors thresholds (e.g., legal standards for duress).  

  - **Boardroom Case**:  
    - *Issue*: Committee vote 4–3; chair would overrule a minority win.  
    - *Requirements at stake*: #7 (alternatives), #8 (individual vs. collective agency).  
    - *Verdict*: Individual members are responsible for their votes (actual sequence control). The committee *as a whole* isn’t answerable if the chair’s power negates alternatives—exposing individualism bias in most theories (Requirement #8’s "single nervous system" assumption).  

  ---

  ### **Incompatible Requirements**
  **The Core Tension**:  
  - **Requirement #3 (Manipulation demands history)** and **Requirement #7 (Frankfurt rejects PAP)** cannot be jointly satisfied.  
    - *Why*: Manipulation cases require responsibility to depend on how the agent *came to be* (historical condition). But Frankfurt cases show responsibility is compatible with no alternatives (rejects PAP). If history matters (per #3), Frankfurt agents *should* be non-responsible (due to covert design), but intuition says they *are* responsible—contradicting #7’s actual-sequence focus.  

  **Exclusionary Requirement**:  
  - **Requirement #1 (Distinguish duress/Frankfurt)** does the heaviest lifting:  
    It eliminates views conflating coercion and intervention. E.g., crude PAP accounts can’t explain why the Frankfurt agent is responsible but the coerced agent isn’t.  

  ---

  ### **Scorecards for Major Views**
  1. **Classical PAP ("Could Have Done Otherwise")**:  
     - *Strengths*: Easily handles duress (#1), omissions (#2), and moral luck (#4) via alternative possibilities.  
     - *Failures*: Crumbles under Frankfurt cases (#7) and manipulation (#3) if history isn’t included.  

  2. **Actual-Sequence/Guides-Control (Fischer/Ravizza)**:  
     - *Strengths*: Survives Frankfurt (#7), explains duress (#1) via reasons-responsiveness.  
     - *Failures*: Struggles with manipulation (#3) and reason-swap (no history); moral luck (#4) remains problematic.  

  3. **Source Incompatibilism (Kane, Stump)**:  
     - *Strengths*: Nails manipulation (#3) and reason-swap (history matters); handles diminished capacity (#5).  
     - *Failures*: Rejected by Frankfurt cases (#7) if PAP is abandoned; may over-excuse in moral luck (#4).  

  ---

  ### **Conclusion: The Real Sticking Point**
  The irreconcilable conflict is between **history-sensitive conditions** (to handle manipulation) and **actual-sequence sufficiency** (to handle Frankfurt cases). Requirement #3 (manipulation) forces a historical condition, but Requirement #7 (Frankfurt) shows responsibility requires no alternatives. *No theory satisfies both without compromising intuition*. Your enzyme kinetics lens is apt: theories either prioritize the "actual pathway" (actual-sequence) or the "possible pathways" (PAP/history), but the reaction (responsibility) is pathway-dependent. When returning to the literature, use Requirement #1 as a filter: if a view conflates duress and Frankfurt, reject it. Then weigh which cost you prefer: sacrificing history (actual-sequence) or alternatives (source incompatibilism).
