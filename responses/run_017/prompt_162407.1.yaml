prompt: |-
  I am spending six months as a visiting researcher in a city whose everyday conventions differ from those I was raised with, and a colleague here keeps closing arguments with "when in Rome, do as the Romans do." I would like that proverb precisified, because in the two arguments where it has been used on me it is doing noticeably different work, and I doubt it does either job well.

  The practices in question, described rather than attributed to any particular country (I am not confident my impressions would be fair to one): boarding a city bus involves no queue — people mass near the doors and position is taken by steady pressure; tipping in restaurants is not customary, and a tip left on the table is sometimes carried out after you as though you had forgotten something; pedestrians cross where and when they like, and drivers treat this as normal and anticipate it.

  The first argument: I have been holding back at the bus stop. My colleague says the proverb means I am obliged to push along with everyone else — that standing aside is not neutral self-denial but a free ride on other people's willingness to do the shoving, and, worse, a silent moral criticism of them. The second argument: I tipped a waiter twice out of habit, and the same colleague says the proverb means I must stop — that persisting makes me responsible for raising expectations among workers whose wages were set on the assumption that they are not tipped, and that this is a small piece of unilateral social engineering carried out by a guest.

  What I want is the menu of precise claims the proverb could be expressing, from the platitudinous to the strong, with verdicts. Please proceed as follows.

  First, set out the distinct readings — I imagine somewhere between six and ten genuinely different ones, but give as many as are really distinct rather than padding to a number. Candidates I can already see, which you should feel free to split, merge, or replace: a prudential reading (comply to avoid sanction); an epistemic-deference reading (locals know the local consequences of local behaviour better than I do); a tacit-consent or guest-contract reading (entering the jurisdiction binds you to its rules); an expectation-reliance reading (people have planned around the convention, so violating it wrongs them); an anti-imperialism or non-interference reading (a guest has no standing to reform the host's arrangements); a normative-humility reading (my own upbringing's conventions have no privileged authority, so local default wins by default); a membership or solidarity reading (compliance is what makes you count as a participant rather than an observer); and a universalisability reading (act as you could will that everyone in your situation act). There will be others.

  Second, for each reading give, compactly: (a) the thesis stated precisely enough that one could imagine arguing about it; (b) a status verdict — platitude, substantive and defensible, substantive and contested, or straightforwardly false — with a one-line reason; (c) which of my colleague's two conclusions it actually supports, if either: the obligation to push, the obligation to stop tipping, both, or neither; and (d) whether it is a reading he is plausibly invoking, given how he used it.

  Third, and this is where I most need help: tell me how each reading fares against three features of my situation, since I suspect some readings simply fail to engage with them.

  Non-transferability of meaning. My pushing and a local's pushing are the same bodily movements, but they may not be the same act. A local's shove can be read as getting along in a crowded system; mine may be read as an outsider barging in. And my standing back may be read not as moral criticism but as an outsider's uncertainty. The proverb seems to assume that doing what Romans do secures what their doing secures for them; for conventions whose point depends on who is performing them, that assumption may fail for exactly the reason the advice sounds apt.

  The one-shot player. Locals at that stop encounter each other repeatedly, and what looks to me like a scramble may be stabilised by reciprocity over time — the person who loses today's bus gets tomorrow's — and by the prospect of later recognition and sanction. I am at one stop for six months and am not a party to that repeated interaction, so my compliance would be the compliance of someone who can draw on the arrangement without ever paying into it. Does that make complying worse than abstaining, or does it mean the arrangement simply has no application to me?

  Convention drift. I have already tipped twice, and one waiter now hovers differently. If visitors' conduct feeds back into the convention, then "do as the Romans do" may be unsatisfiable in principle: by the time I have learned Rome, Rome has partly become something I helped make. Which readings have anything at all to say about obligations with respect to a convention one is already shifting, and which silently presuppose a fixed Rome?

  Finally, on the basis of the menu: is there a single reading that supports both of my colleague's conclusions, or does he need two, and is either of them the one he is likely to mean? Please keep the whole answer under about 1,000 words, and do not give me a reading list or citations — I want the disambiguation and the verdicts, argued from the cases rather than from authorities.
reasoning: |-
  Hmm, the user is a visiting researcher facing cultural friction in a new city, specifically around bus boarding and tipping customs. Their colleague keeps invoking "when in Rome" to critique their behavior, but the user finds the proverb ambiguous and wants it precisified. They've outlined two scenarios where the proverb was applied differently: obliging them to push on buses but to stop tipping.

  The user wants a systematic breakdown of possible interpretations of the proverb. They've suggested several candidate readings themselves: prudential, epistemic-deference, tacit-consent, expectation-reliance, anti-imperialism, normative-humility, membership/solidarity, and universalizability. I need to expand on these while ensuring distinctness.

  For each reading, I must provide: (a) precise thesis statement, (b) status verdict with reasoning, (c) application to the bus/tipping cases, and (d) whether the colleague likely invokes it. Then address three key complications: non-transferability of meaning (same action ≠ same social signal), one-shot player status (no reciprocity for temporary resident), and convention drift (their actions already influence local norms).

  The colleague's applications seem inconsistent at first glance - pushing is framed as obligation to participate, while not tipping as obligation to abstain. This suggests either two different readings are being used, or one reading that somehow covers both (like expectation-reliance).

  For the three complications:
  - Non-transferability undermines readings assuming identical social meaning (like membership/solidarity). My bus push might read as "entitled foreigner" rather than "participant."
  - One-shot player status challenges reciprocity-based readings. As a temporary resident, I can't participate in long-term balancing.
  - Convention drift makes fixed-norm readings obsolete. My tipping has already altered one waiter's expectations.

  The most coherent single reading supporting both conclusions seems to be expectation-reliance: pushing avoids free-riding on the bus system, not tipping avoids distorting wage expectations. But it struggles with non-transferability (my participation might still disrupt) and drift (my actions already changed norms). 

  Ultimately, the colleague likely leans on expectation-reliance, but it's imperfect. Practical advice would be: for buses, adopt minimal necessary pressure; for tipping, abstain since the harm of disrupting wage structures outweighs momentary embarrassment. The proverb oversimplifies - cultural navigation requires discerning when compliance maintains systems vs. when it distorts them.
answer: |-
  Here is a precisification of "When in Rome, do as the Romans do," analyzed through distinct readings, verdicts, and engagement with your complications. The colleague likely uses **Reading 4 (Expectation-Reliability)** for both arguments, though imperfectly.

  ### Distinct Readings & Verdicts
  1.  **Prudential Reading**
      *   (a) Comply with local conventions to avoid social sanctions, practical inconvenience, or hostility.
      *   (b) **Status:** Platitude. *Reason:* Basic self-preservation in social settings is uncontroversial.
      *   (c) **Supports:** Neither clearly. Pushing *might* avoid annoyance; not tipping *might* avoid confusion. But obligation is weak/pragmatic, not moral.
      *   (d) **Plausibly Invoked?** Unlikely. Colleague frames both cases as moral obligations, not mere prudence.

  2.  **Epistemic Deference Reading**
      *   (a) Defer to local conventions because residents possess superior knowledge of the *functional consequences* of those conventions within their specific social context.
      *   (b) **Status:** Substantive and Defensible. *Reason:* Locals often understand the "why" and ripple effects better than outsiders.
      *   (c) **Supports:** Both. Local knowledge suggests pushing is functional; tipping is dysfunctional.
      *   (d) **Plausibly Invoked?** Partially. Underlies colleague's claims about consequences (bus efficiency, wage stability).

  3.  **Tacit Consent / Guest-Contract Reading**
      *   (a) By voluntarily entering and residing in the community, you tacitly agree to abide by its prevailing social norms as a condition of your welcome.
      *   (b) **Status:** Substantive and Contested. *Reason:* Assumes norms are clear, consent is meaningful, and violation breaches hospitality.
      *   (c) **Supports:** Both. Pushing and not tipping are prevailing norms; violating them breaks the guest "contract."
      *   (d) **Plausibly Invoked?** Likely. The "guest" framing implies a reciprocal obligation.

  4.  **Expectation-Reliability Reading**
      *   (a) Comply because others reasonably rely on the convention; violating it disrupts coordination, creates unfairness, or imposes unanticipated costs on locals.
      *   (b) **Status:** Substantive and Defensible. *Reason:* Social coordination requires predictable behavior; free-riding or unilateral change harms those relying on the system.
      *   (c) **Supports:** **Both strongly.** Holding back = free-riding on shovers; tipping = disrupting wage/expectation equilibrium.
      *   (d) **Plausibly Invoked?** **Most Likely.** Colleague explicitly cites free-riding and disrupting expectations.

  5.  **Anti-Imperialism / Non-Interference Reading**
      *   (a) As a guest, you lack the standing, understanding, or right to impose changes on the host society's established practices.
      *   (b) **Status:** Substantive and Contested. *Reason:* Valid concern about outsider arrogance, but presumes all change is "imposition" and locals are monolithic.
      *   (c) **Supports:** Stopping tipping (seen as intervention). Not pushing (abstention) isn't intervention.
      *   (d) **Plausibly Invoked?** Likely for tipping ("unilateral social engineering"), less so for bus.

  6.  **Normative Humility Reading**
      *   (a) Recognize your native conventions have no inherent superiority; suspend judgment and adopt the local default as provisionally valid.
      *   (b) **Status:** Substantive and Defensible. *Reason:* Challenges cultural chauvinism; fosters open-mindedness.
      *   (c) **Supports:** Both, weakly. Favors adopting local practice, but doesn't establish strong *obligation*.
      *   (d) **Plausibly Invoked?** Possible background assumption, but colleague emphasizes obligation over humility.

  7.  **Membership/Solidarity Reading**
      *   (a) Compliance is performative; doing as Romans do signals participation and solidarity, making you a member rather than an observer/critic.
      *   (b) **Status:** Substantive and Contested. *Reason:* Actions build social bonds, but obligation to "join" may be overstated; observation isn't inherently bad.
      *   (c) **Supports:** Pushing (participating). Stopping tipping (conforming). Abstaining (bus) signals non-participation.
      *   (d) **Plausibly Invoked?** Likely, especially for bus ("silent moral criticism" implies non-participation is rejection).

  8.  **Universalisability Reading**
      *   (a) Act only according to maxims you could rationally will to be universal laws for *all* temporary visitors in your situation.
      *   (b) **Status:** Substantive and Contested. *Reason:* Kantian ethics applied contextually; outcomes depend on how "situation" is defined.
      *   (c) **Supports:** Ambiguous. Universally not pushing? Bus system fails. Universally tipping? Wage system disrupted. Universally pushing? Maybe functional. Requires careful formulation.
      *   (d) **Plausibly Invoked?** Unlikely. Colleague argues consequences, not universal maxims.

  ### Engaging with Your Complications

  1.  **Non-Transferability of Meaning:**
      *   **Hits Hardest:** Readings 7 (Membership), 4 (Expectation-Reliability - if reliance depends on *who* you are), 3 (Tacit Consent - if your act isn't read as consenting). Your push may *not* be read as "just participating," undermining the intended signal/solidarity. Your holding back may be correctly read as uncertainty, not criticism, weakening the "free-riding" claim if locals don't *expect* you to push like them. **Readings 2 (Epistemic) and 5 (Anti-Imperialism) handle this best:** They focus on *consequences* and *standing*, less on the precise social meaning of *your specific act*.

  2.  **The One-Shot Player:**
      *   **Hits Hardest:** Readings 4 (Expectation-Reliability - if system relies on long-term reciprocity) and 7 (Membership - if short-term can't achieve it). As a one-shot player, you *cannot* fully participate in the reciprocal bus scramble long-term. Complying *might* let you benefit without future payback, making it *more* like free-riding (weakens colleague's bus argument). Abstaining *might* be neutral. **Readings 1 (Prudential), 2 (Epistemic), 5 (Anti-Imperialism), and 6 (Humility) are less affected:** They focus on immediate consequences, deference, non-interference, or attitude, not long-term reciprocity.

  3.  **Convention Drift:**
      *   **Hits Hardest:** Readings assuming a static "Rome" (All, but especially 3, 4, 5, 7). The proverb struggles here. **Reading 2 (Epistemic) adapts best:** It asks what locals know about the *current, evolving* consequences. **Reading 4 (Expectation-Reliability) adapts poorly:** Whose expectations matter now (established locals? the waiter learning from you)? It creates a paradox: initial compliance avoids drift, but once drift starts, compliance perpetuates your influence. **Reading 8 (Universalisability) could apply:** Could you will all visitors to tip, knowing it changes norms? Likely no, given colleague's wage argument. Could you will all to abstain? Maybe.

  ### Conclusion: Colleague's Likely Reading & Support
  *   **Single Reading Supporting Both?** **Yes, Reading 4 (Expectation-Reliability).** It's the only reading providing a strong, consistent *moral obligation* argument for both pushing (avoiding free-riding) and not tipping (avoiding disruptive expectation-shifting). His language ("free ride," "silent moral criticism," "raising expectations," "unilateral social engineering") directly maps onto this reading's concerns about reliance, fairness, and system stability.
  *   **Is it what he likely means?** **Yes.** The emphasis on consequences for locals and system integrity points strongly to Reading 4.
  *   **Does it handle your complications perfectly? No.**
      *   *Non-Transferability:* Your push might *not* seamlessly integrate you; locals might not *rely* on you pushing like they rely on each other. This somewhat weakens the free-riding claim for the bus.
      *   *One-Shot Player:* Your inability to reciprocate long-term complicates the "free-riding" claim on the bus; abstaining might be less disruptive than awkward participation.
      *   *Convention Drift:* Your tipping has *already* caused drift. Strict Reading 4 might now say *stopping* tips disrupts the *new* expectation you created! However, the colleague's argument (disrupting the *established* wage system) likely assumes the baseline is still dominant, so stopping minimizes *further* drift. Reading 2 (Epistemic Deference) better handles this dynamic complexity.

  **In short:** Your colleague primarily uses the Expectation-Reliability reading to ground obligations in both cases. While this is a defensible and substantive reading, its application to your specific, transient situation is complicated by questions of social perception, reciprocity, and the very dynamism your presence introduces. A touch of Epistemic Deference ("locals understand the system best") and Anti-Imperialism ("don't impose change") likely bolster his argument, especially for tipping. For the bus, the free-riding claim is the weakest link due to non-transferability and your one-shot status.
