prompt: |-
  Our hospital's patient-advocacy committee keeps a running list of encounters we've flagged as epistemic injustice, and I'm the one who has to write up the rulings so I'm trying to keep them consistent. Flagged so far: the Black patient whose pain report was discounted; the woman whose autoimmune symptoms got called anxiety for six years; the patient with a strong regional accent whose description was heard as vague. Not flagged: the patient with a documented history of false reports, where we said the credibility deficit tracked evidence rather than identity; the wealthy, articulate man whose self-diagnosis was accepted far too readily, where we said an excess of credibility is a clinical error but not the kind of injustice we track; and a patient whose symptoms had no established clinical description at the time, which we called a gap in shared concepts rather than anyone's fault.

  New case: a patient brings orthostatic data she collected at home and says she thinks it's dysautonomia. The clinician discounts her for two reasons that seem separable — one, patients who turn up with a printed differential get typed as anxious/'Dr. Google', and two, her chart carries an auto-generated summary of an earlier visit saying 'health anxiety, likely somatization'; she contests that line in the room, and he trusts the summary over her even though the summary was built out of her own earlier words, just laundered through a system nobody gave her access to.

  What should we rule if we want to be consistent with ourselves? I can see at least two rules that fit all six earlier verdicts: a narrow one requiring a deficit caused by identity prejudice, and a looser one about deficits that don't track the speaker's actual reliability whatever their source. They split here, since the Dr-Google typing attaches to an acquired affiliation rather than an identity, and the summary thing isn't really about a person's credibility at all. Give me your best guess at our ruling, tell me which precedent is genuinely the closest analog, say what principle we'd be committing to either way, and name the further case that would actually separate the two rules instead of just restating them.
reasoning: |-
  Hmm, the user is dealing with a nuanced epistemic injustice ruling for their hospital's patient-advocacy committee. They've described six precedent cases and a new case involving a patient whose home-collected orthostatic data was dismissed due to two factors: the "Dr. Google" stereotype and reliance on an auto-generated chart summary labeling her with "health anxiety." The user needs a consistent ruling that fits their existing framework.

  Breaking this down: The precedents show three flagged cases where credibility deficits stemmed from identity markers (race, gender, accent), and three non-flagged cases where deficits arose from evidence (false reports), clinical misjudgment (over-credibility), or systemic gaps (lack of shared concepts). The key tension is between two possible rules: one strictly requiring identity prejudice, the other covering any credibility deficit untethered to actual reliability.

  In the new case, the "Dr. Google" dismissal feels identity-adjacent but targets an acquired behavior rather than an inherent trait. The chart-summary issue is trickier—it's a systemic failure where the clinician privileged an algorithmic interpretation over the patient's contested narrative. Neither fits cleanly into the identity-based rule, but both violate the reliability-based principle since the dismissal wasn't grounded in her actual trustworthiness.

  The autoimmune case precedent is the strongest parallel: both involve dismissal anchored to a contested anxiety label that short-circuited investigation. The "further case" test—a non-marginalized patient dismissed solely due to contradictory documentation they can't access—would force choosing between the rules. If only identity-based injustice matters, that case wouldn't qualify; if systemic credibility mismatches count regardless of identity, it would.

  Ruling "flag" here commits the committee to the broader principle that epistemic injustice includes systemic credibility mismatches, even without identity prejudice. That maintains consistency with the autoimmune ruling while expanding their framework to address algorithmic mediation issues.
answer: |-
  Based on your precedents and the principles they establish, here's the ruling and reasoning for consistency:

  1.  **Ruling:** **Flag this encounter as epistemic injustice.**

  2.  **Closest Analog:** **The woman with autoimmune symptoms labeled as anxiety for six years.**

  3.  **Principle Committed To:** **Epistemic injustice occurs when a credibility deficit is applied to a patient *not* based on evidence of their *actual* unreliability as a knower or speaker in *this specific instance*, but instead stems from systemic biases, prejudicial stereotypes (even non-identity-based ones like "Dr. Google"), or failures in the epistemic system (like inaccessible documentation) that distort the clinician's perception of the patient's credibility, regardless of whether the bias targets a core identity or an acquired behavior/label.**

  **Analysis Breakdown:**

  *   **Why Flag? Applying the Precedents:**
      *   **"Dr. Google" Stereotype (Reason 1):** This parallels the "anxiety" dismissal in the autoimmune case. The clinician types the patient ("anxious/'Dr. Google'") based on a behavior (researching symptoms, presenting a differential) rather than engaging with the *specific content* of her report or the *quality* of her home data. This is a systemic bias against patients who are proactive or informed, creating a credibility deficit unrelated to the actual reliability of *this* patient's information *in this moment*. The "wealthy articulate man" precedent shows accepting self-diagnosis isn't *injustice* per se; the injustice here is the *automatic discounting* based on a *stereotype* applied to the *act* of presenting information, not the information itself.
      *   **Reliance on Contested, Inaccessible Summary (Reason 2):** This is the most profound injustice and the strongest reason to flag. The clinician privileges an *algorithmically generated interpretation* of the patient's *own past words* (likely stripped of context or nuance) *over* her *current* direct testimony contesting that interpretation. Crucially, **she lacks access to the system that generated this summary**, preventing her from understanding or challenging how her words were transformed into a clinical label ("health anxiety, likely somatization"). This creates an **epistemic power asymmetry**:
          *   Her own testimony is subordinated to a system-generated artifact she cannot see or audit.
          *   The clinician trusts the system's output over the patient's direct account, effectively silencing her contestation.
          *   This mirrors the **systemic failure** aspect hinted at in the "no established clinical description" case, but here the system *actively generates and imposes a credibility-undermining label* based on her own inaccessible data, rather than just lacking a shared concept. It's a gap created *by* the system *against* the patient.

  *   **Why Not the Other Precedents?**
      *   **"False Reports" Patient:** The deficit here *was* explicitly tracked to documented evidence of unreliability *in reporting*. In the new case, the clinician discounted the *current* report based on a stereotype and a contested past summary, *not* documented evidence of fabrication regarding dysautonomia or orthostatic data.
      *   **"Wealthy Articulate Man":** The error was an *excess* of credibility (clinical misjudgment), not a *deficit* applied based on stereotype or systemic asymmetry. The new case involves a clear *deficit*.
      *   **"No Established Description":** This was a genuine lack of shared concepts/understanding, a gap not attributable to prejudice or a system *imposing* a label. The new case involves the system *actively imposing* a contested label ("health anxiety") that directly undermines credibility.

  *   **Resolving the Rule Tension:** This ruling commits you to the **"looser" rule**: Epistemic injustice encompasses credibility deficits arising from **systemic biases (like the "Dr. Google" stereotype) and failures in the epistemic system (like inaccessible, authoritative documentation overriding direct testimony)**, even if the bias doesn't target a fundamental identity like race or gender. The "Dr. Google" bias attaches to an *acquired* behavior/label, and the summary issue is fundamentally about **systemic epistemic power** (who controls the narrative derived from the patient's words). Both lead to a credibility assessment untethered from the patient's actual reliability regarding her *current* report and data.

  *   **The Further Case to Separate the Rules:**
      Imagine: **A patient (e.g., a middle-aged white man with no marginalized identity markers) has a complex, poorly understood chronic condition. During a visit, he strongly contests a line in his auto-generated chart summary that says "exaggerates symptoms, possible factitious tendencies," derived (via the same opaque system) from a single frustrated remark years prior ("I guess I must be making it up!") made during a difficult diagnostic process. The clinician, seeing this summary, dismisses his detailed new symptom report and home-monitoring data, trusting the summary over his current account and protest. The clinician exhibits no discernible identity prejudice.**
      *   **Under the Narrow Rule (identity prejudice required):** Not flagged. No marginalized identity is involved in the dismissal.
      *   **Under the Looser/Chosen Rule (deficit untethered to actual reliability, systemic failure):** **Flagged.** The credibility deficit stems directly from reliance on an inaccessible, authoritative system-generated label that overrides the patient's direct testimony and contests their reliability *without* current evidence. The injustice lies in the systemic power imbalance and the imposition of a credibility judgment based on an inaccessible artifact, not the patient's identity. This case cleanly isolates the systemic epistemic failure from identity prejudice.

  By flagging the current case, you affirm that epistemic injustice in your framework includes harms arising from systemic biases beyond core identity (like the "Dr. Google" trope) and, crucially, harms arising from failures in the clinical documentation *system* itself that create power imbalances and override patient testimony based on inaccessible interpretations of their own words.
