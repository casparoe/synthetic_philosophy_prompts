prompt: |-
  You are a philosopher of history and a historian of science with long experience teaching first-year undergraduates how explanations are built. Please think carefully and work in two stages. Begin with a short brainstorming phase in which you list the candidate cases you considered, the obvious-but-wrong opening moves, and your reasons for rejecting each; only then write the teaching plan itself. Do not explain the concept to me, and do not give me a reading list, a bibliography, or citations. I want a plan for an explanation that I will deliver, and I want you to name and reject alternatives rather than present one polished option as if it were the only one.

  The setting: I am a graduate instructor and I have a fifty-minute slot next week in the first-year *How History Works* seminar. The students have read some narrative history, no philosophy of history, and no science beyond school level; a whiteboard is available. They are at ease with board-level sentences such as: the Black Death broke the back of the manorial system; the Little Ice Age pushed settlers off the land. But they have no vocabulary for causation, condition, or agency. My aim is narrower than teaching them to think critically in general. By the end I want each of them to be able to hold three claims apart: that a non-human thing — a pathogen, a climatic shift, a volcano — was causally relevant to some outcome; that it was the determining or sole cause; and that it can properly be written into a narrative as a character without either of the first two collapsing into the third. I also want them to be able to hear the word actor applied to a germ without concluding either that the word is empty metaphor or that the germ had plans.

  Provisional device I want you to pressure-test: I have been using a two-sentence rule when revising my own lectures. Whenever I let a non-human entity appear as a character in an explanation, I require myself to produce a mechanism sentence, stating how the entity made its causal difference — the pathway, not merely the correlation — and an uptake sentence, stating what the human beings in the story did, failed to do, or could have done differently such that the entity's difference became the outcome being explained. If the mechanism sentence cannot be written, I am writing poetry rather than history; if the uptake sentence is empty, or reduces to the claim that nothing could have been done, I have slid into determinism. Tell me whether this rule does the work I want at this level, whether it needs sharpening or a third sentence, and exactly where in the fifty minutes it should be introduced and applied. I suspect it has to arrive before I turn them loose on any case, but I want your reasoning about the dependency rather than agreement.

  Now the plan.

  1. Order and dependency. Give me the phases of the session in the order they must occur, with rough minutes, and for each phase state what later phase depends on it. I care about the dependency structure and not merely a plausible sequence: tell me which move, if placed earlier, would make a later move unintelligible or would invite a misconception that I then have to undo. Place in particular the separation of causally relevant from determining, the defusing of the agency-requires-intentions reflex, the moment actor-talk is first licensed, and the two-sentence rule.

  2. The carrying case. I am inclined to build the whole session around the potato blight of the 1840s in Ireland, using the contrast with the same blight in places where it did not produce mass mortality. Tell me whether that is the right carrier, and specify what a carrier for this idea must have and must lack. My own guess is that it must contain a non-human entity whose causal role is localized and legible, a human institutional component that students can recognize as uptake, and the same entity present in another setting with a different outcome; and that it must lack any need for specialist biological or climatological detail, and must not be so catastrophic in scale that it hypnotizes students into treating the non-human thing as the whole story. If the Irish case fails any of these, say so and propose the better carrier. Then tell me why each of the tempting alternatives is a trap at this level: the Black Death, the 1815 eruption of Tambora and the following year's summer, and the 1918 influenza pandemic. I want the reversal in each case — what the alternative makes easy and what it quietly makes impossible.

  3. The misconception map, in the order the students will actually form them, with the point in the sequence where each should be headed off. The ones I expect are: that only beings with intentions can be agents, so that calling a germ an actor must be metaphor or must be nonsense; that once a germ or a volcano is cited as a cause, human decisions become decoration; that saying the environment mattered just is saying it determined everything, so that students conclude either that any environmental causation is determinism or that none of it is; and — I expect this one only after the cross-case contrast — that since the same blight did not produce famine everywhere, the blight did not really matter in Ireland, which is a slide from not sufficient to not necessary. Add any further misconception you think is predictable in this audience, and for each tell me the sentence or board move that defuses it and the phase in which that move belongs.

  4. The check. Give me one question to ask in the final five minutes that would show the idea has landed rather than that the students have merely learned my vocabulary. I would rather it be a transfer task than a request for a definition. I am happy to put a fresh, minimally described case on the board — either the failure of the French canal effort in Panama in the 1880s, in which mosquito-borne disease was central, or the Tambora case held back from the main exposition — and ask them to produce the two sentences, or to diagnose a one-line board explanation as determinist and repair it. Tell me what a correct answer would look like and, just as importantly, what a superficially correct answer would look like and why it would not count.

  5. Refusals. State explicitly what I should decline to explain at this level and say aloud that I am declining. I take it that this includes any general metaphysics of agency, any formal account of causation, the internal biology or climatology of the entities, and any named theoretical framework about non-human agency. Say what I should say when a student presses on one of these.

  Write the brainstorming section first and keep it visibly distinct from the plan that follows.
reasoning: |-
  Hmm, the user is asking me to create a teaching plan for a first-year undergraduate history seminar focused on explaining causation involving non-human entities. They want me to follow a specific structure: start with a brainstorming section listing candidate cases and why I reject them, then create the actual teaching plan.

  The user has several specific requirements. They want students to understand three key distinctions: that a non-human thing can be causally relevant without being the sole cause, that it can be written into narratives as a character without anthropomorphizing it, and that calling it an "actor" doesn't require intentions. They've proposed a "two-sentence rule" (mechanism + uptake) and want me to pressure-test it.

  Looking at the brainstorming requirements, I need to consider candidate cases:
  - The user's preferred case is the Irish Potato Famine (1840s)
  - Alternatives include: Black Death, Tambora eruption (1815), and 1918 influenza pandemic

  For each case, I should identify:
  - What it makes easy to teach
  - What misconceptions it might reinforce
  - Why it might not work for this audience

  For the Irish Potato Famine case:
  Strengths: Clear non-human factor (potato blight), institutional uptake (British policies), clear cross-case contrast (same blight affected other regions differently). Avoids overwhelming scale.

  Weaknesses: Colonial dynamics might overshadow the causal lesson, potential emotional weight. But still the strongest candidate.

  For alternatives:
  - Black Death: Too catastrophic, reinforces "non-human as sole cause" misconception, complex medieval context.
  - Tambora: Hard to separate climate from human responses, requires too much specialist knowledge.
  - 1918 Flu: Too recent for historical perspective, pandemic responses too complex, blurs with current experiences.

  The user's two-sentence rule seems solid but needs sharpening. Mechanism sentence explains how the non-human entity operated causally. Uptake sentence shows human responses that shaped the outcome. I should recommend adding a "characterization guardrail" to prevent anthropomorphism.

  For the teaching plan structure:
  - Must build dependencies carefully: Introduce actor-talk only after defusing intention reflex; present cross-case contrast only after establishing causal relevance vs. determination distinction.

  Plan phases:
  1. (5 min) Establish baseline with human-only example to surface "intention = agency" reflex
  2. (10 min) Introduce non-human causal relevance with Irish case, defusing intention reflex
  3. (10 min) Separate causal relevance from determination using uptake concept
  4. (10 min) License actor-talk with characterization guardrail
  5. (10 min) Apply two-sentence rule to Irish case
  6. (5 min) Transfer task with Panama Canal case

  Key misconceptions to address in sequence:
  1. "Only intentional beings can be agents" - head off in Phase 2
  2. "Non-human cause makes humans irrelevant" - address in Phase 3
  3. "Environmental causation = determinism" - counter in Phase 3
  4. "Different outcome elsewhere means not necessary" - prevent in Phase 5

  Final check: Use Panama Canal case. Correct answers show mechanism (mosquitoes transmitting disease) and uptake (French medical ignorance vs. later US mosquito control). Superficial answers might state disease mattered but miss institutional uptake.

  Refusals: Should decline deep metaphysics, formal causation theories, specialist science, and theoretical frameworks. If pressed, say: "That's beyond our scope today; we're building practical tools for historical explanation."

  This approach should give the user a practical, misconception-resistant teaching plan focused on their core learning objectives.
answer: |-
  ### Brainstorming
  **Candidate cases considered:**  
  1. **Irish Potato Blight (1840s)**  
  2. Black Death (14th c.)  
  3. Tambora eruption (1815) → "Year Without a Summer" (1816)  
  4. 1918 Influenza Pandemic  

  **Rejected alternatives and reasons:**  
  - **Black Death**:  
    *Temptation*: Clear non-human actor (pathogen); dramatic impact.  
    *Trap*: Overwhelming scale reinforces "non-human as sole cause" misconception; medieval institutional responses are less legible to novices; obscures uptake (e.g., feudal collapse had multiple drivers).  
  - **Tambora eruption**:  
    *Temptation*: Isolates climate as actor; vivid cross-regional contrasts (e.g., European famine vs. New England adaptation).  
    *Trap*: Requires understanding multi-year atmospheric mechanisms; human uptake (e.g., crop substitution) is diffuse and lacks clear institutional levers; conflates climate with weather events.  
  - **1918 Influenza**:  
    *Temptation*: Familiar pandemic context; varied national responses.  
    *Trap*: Modern public health infrastructure complicates "uptake"; students may project COVID-era biases; virus mutation biology is distracting.  

  **Irish Potato Blight assessment**:  
  - **Strengths**: Fits all carrier requirements—localized pathogen, legible institutional uptake (British policy/land tenure), stark cross-case contrast (Belgium/Netherlands vs. Ireland). Avoids specialist science (blight = fungus, not virus) and catastrophic hypnosis (outcome tied to policy choices).  
  - **Weakness**: Colonial dynamics risk overshadowing causal structure. Mitigate by strictly framing uptake as *response capacity*, not moral judgment.  
  **Verdict**: Optimal carrier.  

  **Two-sentence rule pressure test**:  
  - **Does the work?** Yes—forces "pathway" specificity (mechanism) and human contingency (uptake).  
  - **Needs sharpening?** Add a **characterization guardrail**: "Refer to [entity] as an actor *only after* mechanism/uptake are established." Prevents premature anthropomorphism.  
  - **When to introduce?** *After* separating causal relevance/determination (dependency: students need that distinction first to avoid seeing mechanism/uptake as determinism).  

  ---  
  ### Teaching Plan (50-min session)  
  **1. Order and Dependencies**  
  - **(0-5 min) Phase 1: Surface "intention reflex"**  
    *Activity*: Ask: "*Who broke the back of the manorial system?*" (from their reading). Board student answers (e.g., "Black Death," "peasants").  
    *Dependency*: Later phases depend on exposing the reflex that "only humans *do* things." If skipped, students won’t grasp why actor-talk needs rules.  
  - **(5-15 min) Phase 2: Introduce causal relevance ≠ sole cause (Irish case)**  
    *Activity*: State: "*The blight destroyed potatoes. Did it cause the famine?*" Contrast Ireland (1M dead) with Netherlands (minimal deaths).  
    *Dependency*: Separating relevance/determination here allows uptake (Phase 3) to resolve the contrast. If done later, students conflate relevance with blame.  
  - **(15-25 min) Phase 3: Define "uptake" to defuse determinism**  
    *Activity*: Board:  
    > Mechanism: *Blight spores spread, rotting potatoes.*  
    > Uptake: *Tenant farmers had no alternative crops; landlords exported grain.*  
    Emphasize: Uptake shows *how* humans turned blight into famine.  
    *Dependency*: Must precede actor-talk (Phase 4) to prevent "germs decide history" fallacy.  
  - **(25-35 min) Phase 4: License actor-talk with guardrail**  
    *Activity*: Write: "*The blight *acted* by destroying staple crops.*" Contrast with "*The blight *wanted* to...*" → reject.  
    *Dependency*: Depends on mechanism/uptake existing first. Without these, "actor" invites intention reflex.  
  - **(35-45 min) Phase 5: Apply two-sentence rule + guardrail**  
    *Activity*: Students draft sentences for Ireland vs. Netherlands cases.  
    *Dependency*: Requires all prior steps; applying earlier would confuse structure with intent.  

  **2. Carrier Case: Irish Potato Blight**  
  - **Why it works**:  
    - Non-human actor: *Phytophthora infestans* (simple: fungus → rot).  
    - Uptake: Tenant dependence on potatoes vs. Dutch crop diversification.  
    - Cross-case: Same blight, different outcomes (Ireland vs. Low Countries).  
    - Lacks: Catastrophic hypnosis (policy choices visible); no specialist science needed.  
  - **Alternatives’ traps**:  
    - **Black Death**: Makes *relevance* easy but *determination* hard (students see plague as unstoppable force). Quietly erases institutional uptake (e.g., quarantine laws).  
    - **Tambora**: Makes *environmental push* easy but *uptake* impossible (responses are fragmented; climate mechanisms require background knowledge).  
    - **1918 Flu**: Makes *mechanism* easy (virus spreads) but *uptake* murky (war censorship, variable healthcare). Invites "biology vs. society" false dichotomy.  

  **3. Misconception Map**  
  - **M1: "Agents need intentions"** (Forms in Phase 1)  
    *Defuser*: In Phase 2: "*Causal relevance means making a difference, not having goals.*"  
    *Board move*: Draw arrow: "Blight → potato rot" ≠ "Blight ☞ famine".  
  - **M2: "Non-human cause → humans irrelevant"** (Forms in Phase 2)  
    *Defuser*: In Phase 3: "*Uptake asks: How did humans channel the force?*" Show Irish grain exports vs. Dutch diversification.  
  - **M3: "Relevance = determinism"** (Forms in Phase 3)  
    *Defuser*: In Phase 3: "*Determinism would mean no uptake was possible. Was it?*" Point to Netherlands example.  
  - **M4: "Different outcome elsewhere → not necessary"** (Forms in Phase 5)  
    *Defuser*: In Phase 5: "*Necessary ≠ sufficient. Blight was necessary for *this* famine, but other factors made it sufficient.*"  
  - **Added M5: "Actor-talk = metaphor"** (After Phase 4)  
    *Defuser*: In Phase 4: "*Calling it an actor is *causal shorthand* after mechanism is shown. Like saying 'the wind downed trees.'*"  

  **4. Final Check (5 min)**  
  - **Task**: Put on board: "*French Panama Canal failed because of mosquitoes.*" Ask: *"What’s missing? Draft two sentences to fix it."*  
  - **Correct answer**:  
    > Mechanism: *Mosquitoes transmitted malaria/yellow fever, sickening workers.*  
    > Uptake: *French engineers drained swamps poorly and rejected germ theory, unlike later US efforts.*  
  - **Superficial answer**:  
    > Mechanism: *Mosquitoes caused disease.*  
    > Uptake: *Workers got sick and died.*  
    **Why it fails**: Repeats correlation without *how* mosquitoes acted; uptake lacks human choices (e.g., medical ignorance).  

  **5. Refusals**  
  - **What to decline**:  
    - "We won’t debate *what agency really is* metaphysically."  
    - "We’re not learning formal causation models (e.g., necessary/sufficient conditions)."  
    - "We’ll skip the biology of blight or volcanoes—focus on their role in the story."  
    - "No theoretical frameworks today (e.g., Actor-Network Theory)."  
  - **When pressed**:  
    *Say*: "That’s beyond our goal today. We’re building one practical tool for historical explanation, not a grand theory."
