prompt: |-
  I've got a view about everyday conventions that I keep defending at meetups, and I want to know how exposed it actually is before I build more on top of it. Rough version: conventions like queue order, tip rates, whether you wait for the walk signal, which side you stand on an escalator, generate real moral obligations for visitors to a place — not just prudential reasons or etiquette. But the content of the obligation is fixed by local expectations, not by what the convention is nominally for, and what you owe is *conspicuous* compliance: you have to be seen going along, because the thing noncompliance damages is the shared expectation itself, not any particular persons interests. I basically think of conventions as Schelling points with normative glue smeared on them. Call it the expectation-maintenance account. There's one bit I especially like: locals are permitted to break their own convention (they've got standing to renegotiate it) while visitors aren't — call that the guests license asymmetry or whatever.

  So what would count against this? Skip the obvious stuff — "cultural relativism," "who says you have to follow local norms" — I can field that. What I want is a map of where the view is actually at risk:

  - The case it can't describe, or describes badly. I'm most worried about the invisible tourist: crossing against the light at 4am with nobody around, or skipping a tip at a place you'll never return to where nobody compares notes. My account seems to say there's no duty, since no expectation gets damaged. If that's actually fine, say why; if it's a reductio, walk me there.
  - The collapse risks, both directions. Where does this stop being moral philosophy and become "don't be rude to the locals" with extra steps? And where does it stop being a story about conventions and turn out to be an instance of a general duty not to free-ride on a cooperative scheme? Which collapse is more likely, and which feature of a case decides it.
  - A discriminating case: something my view predicts that the plain free-riding account doesn't, or vice versa, with an honest note about which way I'd have to find my intuitions going for it to count against me.
  - The awkward-but-not-fatal stuff, ranked separately: conventions that are themselves bad (a norm of paying off officials, a norm about who gets served first), visitor-only conventions (a queue at a tourist site with no locals in it), conventions in flux (a place where half the locals have stopped tipping), and the "opting out by announcement" move — if I loudly announce I'm not playing, have I discharged the duty?
  - What a defender would concede rather than fight. If I concede as much as I probably should, does anything interesting survive?
  - And whether I've insulated it. When I get pushed I start saying the duty is only pro tanto and the relevant expectation is that of a reasonable local, and I want to know if that's legitimate specification or whether I've qualified the thing into having no risk at all.

  The thing that would actually move me: an argument that expectation-maintenance can't distinguish being morally required from being strongly expected without secretly importing a harm or unfairness premise that's doing all the real work. If that lands I'd probably drop the view, so tell me how close such an argument is to succeeding. Rank everything fatal down to merely embarrassing, and if there's a real-world pattern you think already counts either way, describe the shape of it — I don't want dates or studies, just the shape. Be straight with me if the honest answer is that the view is well insulated and that this is okay because it's mostly a claim about what we owe strangers in shared spaces rather than an empirical claim.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've got this theory about everyday conventions creating moral obligations for visitors, centered on conspicuous compliance to maintain shared expectations. They want to know where their view might be vulnerable. I need to identify the weak points without rehashing the usual cultural relativism arguments they've already dismissed.

  First, the invisible tourist case. They mention crossing against the light at 4am with no one around. Their theory says no duty because no expectation is damaged. But is that a problem? Maybe it shows their account is too focused on actual observers, not the potential erosion of norms. If no one sees you, the norm isn't challenged, but what about the internalization of the rule? If visitors think it's okay to break norms when unseen, that might weaken their overall adherence. But the user might argue that the duty only kicks in when noncompliance is observable. Still, this could be a spot where their view seems counterintuitive—most people might feel it's still wrong to jaywalk alone at night, even if no one's watching. That intuition gap might be a problem.

  Next, collapse risks. On one side, their theory might just be politeness dressed up. If the obligation is only about being seen to comply, doesn't that reduce to avoiding offense? The user insists it's moral, not just etiquette. The key difference is the systemic harm to cooperative structures, but that edges into free-rider territory. On the other side, if it's all about free-riding, then conventions are just cooperative schemes. But the user wants to distinguish their view from that. They need a case where conspicuous compliance matters independently. Maybe something like fashion norms—wearing formal attire to a casual event might confuse expectations without free-riding. But fashion might not be seen as a convention with moral weight, so that's shaky. The tourist-only queue is better: tourists maintaining a queue among themselves, no locals involved. Free-riding doesn't apply since there's no preexisting scheme, but the expectation-maintenance account still suggests a duty to comply. If that feels intuitive, it supports their view over free-riding.

  Discriminating cases: the tourist queue again. Free-riding theory might say no obligation since there's no cooperative benefit to locals. But if visitors feel obliged to queue anyway, that favors the user's account. However, if people think it's optional, that hurts their view. Also, the locals breaking norms part—locals can jaywalk without issue, but visitors can't. Asymmetry here. If people agree, it supports the user. If not, it's a problem.

  Bad conventions: paying bribes. The user might concede that the duty is pro tanto and overridden by moral reasons. But if the expectation-maintenance still applies, does that mean there's a residual obligation to comply conspicuously? That seems icky. They have to argue that the norm's badness dissolves the duty, but then what's the threshold? This could be a major weakness.

  Opting out by announcement: shouting "I won't tip!" doesn't absolve you because it still undermines the expectation. The duty is to maintain the norm, not just avoid surprising people. So announcing might make it worse. That aligns with their view but might seem counterintuitive if people think declaring opt-out removes obligation.

  Concessions: Admit that the duty is pro tanto, context-dependent, and doesn't override strong moral objections. Also, that the "reasonable local" standard avoids bad norms. But does this gut the theory? Maybe not, if it still covers mundane conventions like queuing.

  Insulation risk: If they keep adding qualifiers, does the theory become unfalsifiable? They need to clarify where the duty applies without retreating to "it depends." The key is whether expectation-maintenance adds something beyond harm/unfairness. In the invisible tourist case, no harm is done, so if there's still an intuition of wrongdoing, their theory can't explain it without smuggling in harm. That might be the fatal flaw. If people don't feel it's wrong to jaywalk alone, then their view holds, but if they do, the theory fails.

  Real-world pattern: Consider places with weak norms, like a city where jaywalking is common. Visitors might not feel obliged to wait for lights, even when observed. If the locals don't care, the expectation isn't strong, so no obligation. This tests the "reasonable local" aspect. If the user's theory fits such cases, it's a point in their favor.
answer: |-
  Your expectation-maintenance account is provocative and internally coherent, but it faces genuine pressure points. Below is a targeted analysis of its vulnerabilities, structured around your requests. I’ll be blunt about where it frays or collapses, and where it holds up. The core tension: **your account struggles to ground "moral obligation" purely in expectation-maintenance without smuggling in harm/fairness or reducing to etiquette.** Let’s dissect:

  ---

  ### 1. **The Invisible Tourist: Fatal if Moral, Salvageable if Etiquette**  
     - **The Case**: Crossing against a light at 4am with no witnesses, skipping a tip at a remote diner where no one tracks compliance.  
     - **Your View’s Prediction**: No duty—no expectation is damaged without an audience.  
     - **Why It’s a Reductio (If Moral)**:  
       - If the *only* wrong in noncompliance is damaging shared expectations, invisibility absolves the actor. But intuitions often rebel:  
         - *Moral Residue*: Many feel it’s still "wrong" to violate a convention even when unseen (e.g., jumping a deserted queue feels "cheaty," not just imprudent).  
         - *Slippery Slope*: If invisible breaches are permitted, the norm erodes *internally* for the visitor ("Why comply when unseen?"), increasing visible breaches. Your account can’t explain why *this* erosion matters absent harm.  
       - **Fatal Collapse Risk**: This exposes your view as **not genuinely moral** but **epistemically constrained etiquette**. If the "obligation" vanishes without an audience, it’s about *perception management*, not morality.  
     - **Salvage Move**: Concede this is etiquette, not morality—but that undermines your core claim.  

  ---

  ### 2. **Collapse Risks: Two Directions, One More Threatening**  
     - **Collapse into Etiquette ("Don’t be rude")**:  
       - **Risk**: High. If the duty is solely about *being seen* to comply to avoid "damaging expectations," it mirrors "don’t offend the locals." The "moral glue" is just social friction avoidance.  
       - **Deciding Feature**: Does violating the convention *feel* like a *faux pas* (etiquette) or a *betrayal* (morality)? If the former, collapse is likely.  
     - **Collapse into Free-Riding ("Don’t exploit cooperation")**:  
       - **Risk**: Higher, and more damaging. Most conventions (queues, tipping) *are* cooperative schemes. Your "expectation-maintenance" might just be instrumental to preventing free-riding.  
       - **Deciding Feature**: Does the convention solve a coordination problem *with mutual benefits*? If yes, free-riding explains the duty better.  
       - **Which Collapse Wins?** Free-riding is the stronger competitor. If conspicuous compliance only matters because it sustains a *beneficial* scheme, your account adds nothing.  

  ---

  ### 3. **Discriminating Case: Tourist-Only Queues**  
     - **The Case**: A queue at a tourist attraction with *no locals* (only visitors). Locals don’t use or care about it.  
     - **Your View’s Prediction**: Visitors have a duty to comply conspicuously—they must maintain expectations *among themselves*.  
     - **Free-Riding Prediction**: No duty—there’s no cooperative scheme with locals to free-ride on. Benefits are individual (faster entry), not collective.  
     - **Intuition Test**: If people feel *no obligation* to queue here (e.g., they rush the gate), free-riding wins. If they still feel obliged to queue "on principle," your view survives.  
     - **Brutal Truth**: Most people will see queue-jumping here as "rude" but *not immoral*. If your intuition agrees, your view loses. If not, you’re isolated.  

  ---

  ### 4. **Awkward-but-Not-Fatal Cases (Ranked)**  
     - **Bad Conventions** (e.g., bribing officials):  
       - **Awkwardness**: Your view implies a pro tanto duty to conspicuously comply (to maintain expectations). This is morally grotesque.  
       - **Defense**: Concede the duty is overridden by stronger moral reasons. But if the *pro tanto duty exists*, it stains the view.  
     - **Visitor-Only Conventions**: As above—major discriminating case.  
     - **Conventions in Flux** (e.g., tipping where 50% of locals skip):  
       - **Problem**: Whose expectations matter? Your "reasonable local" fix helps, but ambiguity weakens the duty’s force.  
     - **Opting Out by Announcement**:  
       - **Your View**: Announcing noncompliance *still* damages expectations (it signals the norm is negotiable), so the duty isn’t discharged.  
       - **Awkwardness**: This feels counterproductive—declaring intent seems *more* respectful than covert violation.  

  ---

  ### 5. **Concessions a Defender Should Make**  
     - Concede the duty is **pro tanto** (overridden by stronger moral reasons).  
     - Concede it only applies to **coordination conventions** (not traditions like bowing).  
     - Concede **"reasonable local"** defines expectations (avoiding bad norms).  
     - Concede **invisible breaches** aren’t covered—this limits the view but saves coherence.  
     - **What Survives?** A limited claim: *In cooperative spaces, visitors owe conspicuous compliance to sustain local coordination norms, barring overriding reasons.* This is narrower but still substantive.  

  ---

  ### 6. **Insulation Risk: Qualifying into Irrelevance?**  
     - **Legitimate Specification**: Using "pro tanto" and "reasonable local" is defensible—it avoids endorsing harmful norms.  
     - **Over-Insulation Danger**: If you add "...unless expectations are weak, or harms outweigh benefits, or locals don’t care..." the view becomes unfalsifiable. **Red line**: Stick to clear coordination norms (queues, traffic) where expectations are strong and benefits obvious. Don’t stretch to vague "cultural expectations."  

  ---

  ### The Attack That Could Sink You: **Expectation-Maintenance ≠ Moral Obligation**  
     - **The Argument**:  
       - *Premise 1*: Moral obligations require a *ground* (harm, unfairness, rights).  
       - *Premise 2*: "Damaging expectations" only becomes morally relevant if it causes *harm* (e.g., chaos in queues) or *unfairness* (e.g., free-riding).  
       - *Strike*: Your account implicitly relies on these grounds. In the *invisible tourist* case, no harm/unfairness occurs, and intuitions reject a duty. In *bad conventions*, harm/unfairness explains why the duty vanishes.  
       - **Conclusion**: Expectation-maintenance is a *proxy* for harm/unfairness avoidance, not a free-standing moral source. Your "normative glue" is epoxy made of hidden harm/fairness particles.  
     - **How Close Does It Land?** **Direct hit if** you grant:  
       - The *only* reason we care about damaged expectations is to prevent bad outcomes (chaos, resentment).  
       - If no bad outcomes follow (e.g., a dying convention), the "duty" disappears.  
     - **Real-World Pattern**: Watch norms in decline (e.g., tipping in cafes with tablet defaults). Locals shrug at noncompliance—no moral outrage, just annoyance. Your view predicts lingering duty; reality shows obligation dissolves as the expectation fades.  

  ---

  ### Final Assessment  
  - **Fatal Flaws**:  
    1. **Invisible Tourist as Reductio** (if you insist it’s moral, not just etiquette).  
    2. **Collapse into Free-Riding** for beneficial conventions (your added value is dubious).  
    3. **Expectation ≠ Moral Ground** argument (if you accept it exposes hidden premises).  
  - **Embarrassing but Survivable**:  
    - Bad conventions (concede override).  
    - Flux/ambiguity (invoke "reasonable local").  
  - **Insulation Success**: Pro tanto + reasonable local + conspicuous-compliance focus keeps it coherent for **benign coordination norms**.  
  - **Verdict**: Your view is best framed as **"the ethics of stranger coordination"**—a real but narrow duty to signal shared investment in local order. It’s not a general moral theory. If you retreat to that, it holds. If you push further, it crumbles.  

  **Straight Talk**: This isn’t trivial—it captures something visceral about being a guest. But it’s fragile where morality demands deeper foundations. If you want bulletproof, stick to etiquette. If you want moral heft, graft it onto cooperation ethics. Either way, the "guest license asymmetry" is your strongest insight. Build there.
