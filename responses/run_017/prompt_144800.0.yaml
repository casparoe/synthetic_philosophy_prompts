prompt: |-
  Our office has a statutory duty to weigh the interests of future generations, and we need a single discounting rule to apply across projects whose payoffs run out eighty to a hundred and fifty years: sea defences, nuclear waste storage, grid rebuilds. Before I look at any particular proposal I want the specification, since nearly everything I read argues from one favourite case. Write the desiderata that any adequate account of pure time preference and of discounting distant future benefits must meet, with the case or consideration behind each: what it must say about the difference between discounting money, consumption, and welfare; about keeping pure time preference separate from — or explicitly folding in — expected growth, catastrophe and extinction risk, and the possibility that the recipients of the benefit owe their existence to the timing of the project itself; about whether the rate should be flat or decline with the horizon; about how the rule behaves when, as actually happens, it is reapplied at every budget cycle rather than once at the outset; about what it owes, if anything, to observed market and political behaviour; about the distinction it must not collapse between how much we owe the future and how much we should invest now against a fixed budget; and about benefits that are not a separable stream at all — say, a project that lowers the annual hazard rate of civilisational collapse, so that the value of the benefit depends on the size and shape of the whole future it protects. Mark which requirements you take to be non-negotiable and which are the preferences of a particular camp, name the single requirement that excludes the most candidates, and flag any subset of the list you suspect is jointly unsatisfiable — I expect the trouble to lie in the triangle of horizon-declining rates, stability under repeated re-optimisation, and consequentialist re-evaluation. Then a sentence each on where the standard families fail the list — zero pure time preference with a growth term, a positive pure rate calibrated to observed choice, declining-horizon schedules, and views that drop pure time preference but add a separate sustainability constraint — but no full scorecard.
reasoning: |-
  Hmm, the user is asking about discounting rules for long-term projects like sea defenses or nuclear waste storage. They want desiderata that any discounting approach must meet, covering various aspects like pure time preference, different types of discounting, risk factors, rate structure, and more. They also want me to highlight non-negotiable requirements and potential conflicts.

  First, I need to break down their query into parts. They mentioned several key areas: difference between discounting money, consumption, welfare; handling pure time preference separately from growth, catastrophe risks, extinction, and existence dependency; whether the rate should be flat or declining; behavior under repeated reapplication; relation to market/political behavior; distinction between obligations to future generations versus investment decisions; and non-separable benefits like reducing civilizational collapse risks.

  The user is likely a policy advisor or government official dealing with intergenerational projects. Their explicit need is a framework for evaluating long-term policies, but deeper needs include avoiding bias towards present generations, ensuring consistency, and addressing ethical dilemmas in discounting. They're frustrated with case-based arguments and want a principled approach.

  I should structure the desiderata clearly. Start with foundational ones: no discrimination by temporal location, which is non-negotiable. Then move to operational requirements like separating pure time preference from growth. The ethical distinction between obligations and investment is crucial—confusing them could justify underinvestment. 

  The user suspects a conflict between declining rates, stability under re-optimization, and consequentialist reevaluation. That's spot on. Declining rates can lead to time inconsistency if not handled properly. If every budget cycle reapplies the rule, declining rates might cause earlier reversals of past decisions, which is unstable. Consequentialist reevaluation might ignore prior commitments, exacerbating instability. 

  For standard families: Zero pure time preference with growth term might ignore existence dependency. Positive pure rates calibrated to markets often fail ethical obligations. Declining schedules struggle with re-optimization stability. Sustainability constraints as add-ons might not integrate well with discounting logic. 

  I need to name the requirement that excludes most candidates. Probably the stability under re-optimization combined with consequentialism and declining rates. Many models don't account for repeated application. 

  Also, non-separable benefits are tricky. Discounting a hazard reduction requires valuing the entire future protected, which standard discounting can't handle well. That might need a separate approach.
answer: |-
  Here are the desiderata for a long-term discounting rule, structured as requested:

  ### Foundational Desiderata (Non-Negotiable)
  1.  **No Arbitrary Temporal Discrimination:** The rule must not systematically devalue the well-being of future generations *solely* because they exist later in time. *Case:* Ethical imperative against discrimination by birth date; core statutory duty.
  2.  **Distinguish Discounting Bases:** Must explicitly differentiate between discounting:
      *   *Money:* Reflects only expected inflation & opportunity cost of capital.
      *   *Consumption:* Reflects expected growth in per capita consumption.
      *   *Welfare/Utility:* Reflects pure time preference + diminishing marginal utility of consumption.
      *Case:* Confusing these leads to misallocation (e.g., discounting welfare at a financial rate ignores ethical dimensions).
  3.  **Separation of Pure Time Preference (PTP):** PTP (if used) must be explicitly stated and justified separately from predictive components (growth, risk). *Case:* PTP is an ethical choice; growth/risk are empirical predictions. Conflation obscures value judgments.
  4.  **Handle Non-Separable Benefits:** Must accommodate benefits that protect or enable *the entire future stream* (e.g., reducing civilisational collapse risk). *Case:* Standard separable-stream discounting fails catastrophically here; the value depends on the integral of future potential existence.
  5.  **Distinguish Obligation from Investment:** Must not conflate "how much we owe the future" (an ethical question) with "how much should be invested now given a fixed budget" (an efficiency question). *Case:* Using an investment hurdle rate as the ethical discount rate justifies under-provision for the distant future.

  ### Operational & Robustness Desiderata
  6.  **Explicit Treatment of Existential & Catastrophic Risks:** Must incorporate the probability of extinction or civilisational collapse *and* the possibility that the project itself changes future population/existence. *Case:* Ignoring these risks over centuries is empirically indefensible; existence dependency (Parfit's "Non-Identity Problem") challenges standard welfare aggregation.
  7.  **Stability Under Re-Optimization:** The rule must generate dynamically consistent choices when reapplied at successive budget cycles. *Case:* Real-world policy is made sequentially; rules causing frequent reversals of long-term commitments are impractical and undermine trust.
  8.  **Acknowledge, Don't Blindly Follow, Markets/Politics:** Must justify any use of observed market rates or political short-termism, not merely calibrate to them. *Case:* Market failures (e.g., missing markets 100yrs out), political myopia, and ethical duties mean observed behaviour isn't a normative guide.
  9.  **Rate Structure Justification:** Requires clear rationale for whether the discount rate is constant or declines with horizon. *Case:* Uncertainty about long-term growth/risk may justify declining rates, but ethical arguments (PTP) typically don't.

  ### Potential Conflicts & Key Exclusions
  *   **The Excluder:** **Stability Under Re-Optimization (7)** combined with a consequentialist re-evaluation mandate excludes most declining rate schedules and some constant rate models. Declining rates often induce time-inconsistency.
  *   **The Suspect Triangle:** You correctly identify the likely conflict: **Declining Rates (9)**, **Stability Under Re-Optimization (7)**, and **Consequentialist Re-evaluation** (implied by sequential budgeting). Achieving all three simultaneously is exceptionally difficult without pre-commitment mechanisms or non-consequentialist ethics. Consequentialist re-evaluation at t+1, using a declining schedule, will often deem the t=0 optimal plan suboptimal, violating (7).
  *   **Joint Unsatisfiability Suspect:** The triangle above + **Explicit Treatment of Existence Dependency (6)**. Fully consequentialist evaluation incorporating existence effects under re-optimization with declining rates is a formidable, perhaps unsolvable, challenge.

  ### Where Standard Families Falter (Briefly)
  *   **Zero PTP + Growth Term (Ramsey):** Often fails (7) stability if growth uncertainty forces declining *effective* rates, struggles with (4) non-separable benefits & (6) existence dependency, can blur (5) obligation/investment.
  *   **Positive PTP Calibrated to Choice:** Violates (1) & (3), ignores (8) market/political failures as normative guides, poorly handles (4) & (6).
  *   **Declining-Horizon Schedules (e.g., DDRs):** Frequently fail (7) stability under re-optimization (time-inconsistency), can lack rigorous foundation for decline profile, challenging for (4) non-separable benefits.
  *   **Zero PTP + Sustainability Constraint:** Risks blurring (5) (is the constraint the obligation or a side-constraint?), often ad-hoc integration with discounting logic, may not cleanly handle (4) or (6), implementation of constraint can be vague.

  This framework prioritizes ethical clarity, operational robustness, and handling the unique challenges of very long time horizons and civilisational risks, as demanded by your statutory duty. The tension between declining rates, stability, and consistent re-evaluation remains the central practical and theoretical hurdle.
