answer: |-
  ## Research Proposal: Baselines in Motion - Re-examining Doing vs. Allowing in Life-Sustaining Contexts

  **1. Project Summary:**
  This project challenges a core assumption in ethical debates about "killing" versus "letting die" (specifically "doing" versus "allowing"): the idea of a neutral, discoverable baseline state. It argues that in real-world scenarios where life depends on continuous effort (like maintaining medical equipment), the baseline *is set* by ongoing actions, not passively *found*. I propose to systematically test whether modifying classic thought experiments to reflect this reality destabilizes our intuitions about the doing/allowing distinction, suggesting it primarily tracks social expectations about responsibility ("whose job the dying is") rather than inherent moral facts about causation or intention. The outcome will be a clear articulation of this challenge and its potential implications.

  **2. The Core Question:**
  **Does reframing life-sustaining scenarios to explicitly acknowledge that the "normal" state requires active maintenance significantly alter our intuitive judgments about whether withdrawing that maintenance constitutes "doing harm" or "merely allowing harm," and does this reveal the doing/allowing distinction to be primarily a pragmatic tool for assigning responsibility rather than reflecting a fundamental moral difference?**

  **3. Why the Standard Approach Falls Short:**
  Current debates overwhelmingly rely on simplified, one-shot scenarios (e.g., pushing someone vs. not saving them from falling). These scenarios assume a clear, passive baseline: if you "stand still," nothing changes *relative to a pre-existing, stable state*. This assumption is unrealistic. In contexts like critical healthcare, infrastructure upkeep, or chronic care management, the "normal" state *is* the result of continuous human effort. Stopping that effort isn't passive inaction; it's actively ceasing a necessary intervention. The standard framework obscures this by treating the *results* of prior effort (e.g., a plugged-in ventilator) as the neutral starting point, making the maintainer's withdrawal seem like a mere "allowing." This project argues that this framing is arbitrary and masks the true nature of the moral question.

  **4. Proposed Methodology & Work Plan (8 months, ~15 hrs/week):**
  My approach leverages critical analysis of thought experiments and conceptual reasoning, requiring no formal experiments, participants, or ethics approval. I will draw on my practical understanding of life-sustaining systems from my profession.

  *   **Months 1-2: Groundwork & Cataloging:**
      *   Precisely define key concepts: "doing," "allowing," "baseline," "maintenance," "responsibility-ascription."
      *   Catalog and summarize 10-15 foundational "killing vs. letting die" thought experiments, explicitly noting the assumed passive baseline in each.
      *   Develop 3-5 real-world analogues for each foundational scenario where the baseline is *actively maintained* (e.g., not just "unplugging a ventilator," but "ceasing the daily checks and servicing that prevent a ventilator from failing," or "halting levee maintenance knowing failure is imminent").
  *   **Months 3-4: Analysis & Intuition Testing:**
      *   Systematically compare judgments about the original scenario and its "maintenance-dependent" counterpart. Would the *same action* (e.g., stopping servicing) intuitively feel more like "killing/doing" than the original "unplugging/allowing"? Why?
      *   Identify factors influencing this potential shift: Is it the visibility of prior effort? The established role of the maintainer? The predictability of the harm?
      *   Explore the role of temporal framing: Analyze how describing the *same cessation of maintenance* as a single act ("pulled the plug") vs. an ongoing state ("stopped maintaining") affects categorization as doing vs. allowing.
  *   **Months 5-6: Synthesis & Implications:**
      *   Synthesize findings: Do maintenance-dependent baselines consistently destabilize the doing/allowing intuition? If so, what principle(s) seem to explain the revised judgments?
      *   Develop the core argument: Does this support the hypothesis that the distinction is primarily a tool for assigning responsibility ("this death is now your job to prevent/not cause") rather than marking a deep moral chasm?
      *   Formulate the challenge to the privileged status of the distinction in contexts like end-of-life care or resource allocation.
  *   **Months 7-8: Refinement & Deliverable Drafting:**
      *   Refine arguments, anticipate counter-arguments (e.g., the distinction *still* tracks intention or direct causation).
      *   Draft the final, clear, non-technical report for the foundation.

  **5. Why This Approach?**
  *   **Fills a Gap:** It directly challenges an underexamined assumption in a crowded field by shifting focus to the *source* of the baseline.
  *   **Leverages Unique Perspective:** My practical experience with maintaining life-sustaining equipment provides concrete insight into the hidden labor behind "stable" states, informing realistic scenario construction.
  *   **Feasible & Focused:** Thought-experiment analysis is perfectly suited to independent, literature-based research within the time constraints. It requires only rigorous thinking and clear writing.
  *   **Reveals Underlying Mechanics:** By forcing the baseline to be explicit and dynamic, we can better see *why* we categorize actions as we do, potentially revealing the social/pragmatic engine behind the distinction.

  **6. Deliverable:**
  At the end of eight months, I will submit a clear, concise report (approximately 15-20 pages) written in plain language suitable for an intelligent non-specialist audience. This report will:
  1.  Clearly state the core question and the "baseline is set, not found" hypothesis.
  2.  Present the catalog of classic scenarios and their maintenance-dependent counterparts.
  3.  Detail the observed shifts in intuitive judgment and the factors influencing them.
  4.  Articulate the argument that the doing/allowing distinction primarily functions as a responsibility-ascription tool in these contexts.
  5.  Discuss the implications, particularly regarding the potential instability of the distinction across time frames and its use in policy/clinical ethics.
  6.  Conclude with the significance of the findings and potential avenues for further thought.

  **7. What Would Constitute Failure & Success:**
  *   **Success:** Demonstrating a consistent and significant shift in intuition when moving to maintenance-dependent baselines, providing a compelling case that this shift reveals the pragmatic (responsibility-ascribing) function of the distinction in a way that challenges its assumed moral fundamentality. Showing *why* this matters practically.
  *   **Failure (Avoiding the "True but Boring"):**
      *   **Finding No Significant Shift:** If intuitions remain stable despite the changed baseline, it would suggest the distinction is more robust than hypothesized, or my scenarios were flawed.
      *   **Inconclusive Results:** If shifts are inconsistent or minor, failing to reveal a clear pattern or principle.
      *   **The "True but Boring" Outcome:** **Crucially, even if the core observation (baselines are often set) is confirmed, the project fails if I cannot demonstrate its significant *implications*.** If it turns out this observation doesn't genuinely challenge the moral weight placed on the doing/allowing distinction in practical debates (e.g., about treatment withdrawal), or if the responsibility-ascription point is deemed trivial or already acknowledged, the project would lack meaningful impact. I explicitly commit to acknowledging this possibility in the final report if it emerges.
  *   **Defining Success Clearly:** Success hinges not just on establishing that baselines can be set, but on showing that *acknowledging this forces a substantive reinterpretation of the moral landscape* surrounding doing and allowing in life-sustaining contexts.

  This project offers a rigorous, feasible, and novel examination of a fundamental ethical distinction through the practical lens of sustained effort. It seeks to move beyond abstract one-shot examples to better reflect the realities of how life is often preserved, and in doing so, shed new light on the moral categories we use.
