prompt: |-
  hi — im in a third year Kant seminar, we're on the Groundwork / formula of universal law part, and I need to bring a case to class on thrusday for a short presentation. Our prof keeps insisting that "universalize your maxim" is ambiguous and she's been using two made-up labels for the two readings (I dont think they're from anywhere, they're hers):

  - statutory universalization: picture everyone freely adopting the maxim and acting on it whenever those circumstances come up
  - nomic universalization: picture it wired into nature so agents can't help but act that way, like a law of physics

  I need a maxim where the two come apart: permitted under statutory, forbidden under nomic. And I also need the formula of humanity to come out permissive on it, so that the nomic reading is the only thing doing any work.

  Constraints:
  - one paragraph, ordinary academic or professional life — no violence, no trolleys, and not one of the standard examples from the Groundwork
  - the maxim should be something a decent person might genuinely adopt. If it's only condemnable because I cooked it to be nasty, the case is worthless
  - the nomic failure can't be the usual free rider move (the maxim only works because most people don't follow it). Everyone tries that one and she rolls her eyes at it
  - the gap between the readings should come from the action type itself somehow losing the point that makes it the action it is, not from a straight logical contradiction or a coordination breakdown

  After the scenario, run it through all three tests in one short paragraph each, tell me which single feature of the case makes the nomic reading blow up, and tell me what happens if you delete that feature — does the whole thing collapse back into a free rider case, or does it just go permissive across the board?

  The bit I actually need most: how would someone who thinks statutory is the correct reading attack my case, and what would they say is really doing the work? I'm trying to show that the choice between the readings isn't harmless exegesis, it flips verdicts on real cases — so be honest with me if this example can't carry that weight or if it's doing less than I think. If it genuinely can't be done cleanly, say what's blocking it rather than fudging it.
reasoning: |-
  Okay, the user is in a Kant seminar focusing on the Groundwork, specifically the Formula of Universal Law. They need a case for a presentation that shows a divergence between two interpretations of universalization: statutory (everyone freely adopts the maxim) and nomic (it's a law of nature). The maxim should be permitted under statutory but forbidden under nomic, and the Formula of Humanity should permit it. The case must avoid violence, trolleys, and standard examples, and shouldn't be a free-rider case. The key is that the nomic failure comes from the action losing its point, not logical contradiction or coordination issues.

  First, I need to find a maxim that's plausible for a decent person. Common examples like false promises or suicide are out. Professional or academic settings are preferred. The challenge is ensuring statutory permits it, but nomic forbids it without free-rider dynamics. 

  Considering professional contexts, something like creative work or mentorship. What if someone wants to keep their innovative ideas private? That could work. The maxim: "Sometimes keep innovative ideas private to secure recognition." Under statutory, if everyone freely chooses when to share or not, it might still function. But under nomic, if it's a law of nature that everyone always keeps ideas private, then knowledge sharing collapses, making innovation impossible. The action loses its point because recognition requires others knowing the idea.

  Formula of Humanity should permit it because withholding ideas isn't treating others as mere means; it's self-regarding. The nomic failure is due to the action's dependence on being the exception. But the user specified no free-rider, so how to avoid that? The key is that in nomic, the maxim becomes self-defeating because the very condition for recognition (others knowing the idea) is negated. It's not that others aren't complying; it's that the universal law destroys the preconditions for the action's success.

  Potential objections: A statutory defender might argue that the nomic failure is actually a coordination problem disguised. They'd say the contradiction comes from everyone acting the same way, which is still a free-rider issue. To counter, emphasize that the action's purpose (recognition) requires the possibility of sharing, which nomic eliminates entirely, whereas statutory allows discretionary sharing. Deleting the "securing recognition" part would turn it into a free-rider case, where the maxim works only if others share. But including recognition makes the nomic failure intrinsic to the maxim's goal.

  Need to ensure the example is clean. Another idea: seeking feedback but only when convenient? But that might not create a strong divergence. The original idea seems solid. Check constraints: no violence, academic setting, decent person's maxim. Yes. Formula of Humanity: withholding ideas isn't inherently disrespectful, so permissible. 

  Now, structuring the response. Present the maxim clearly. Then statutory: universal adoption is possible because people can choose when to share. Nomic: as a law of nature, no ideas are shared, so recognition is impossible. Formula of Humanity: no violation. The critical feature is the maxim's goal (recognition) requiring the possibility of sharing. If removed, it becomes a free-rider case. Objections: statutory proponents might say nomic's collapse is due to uniform action, not the maxim itself. But the rebuttal is that the maxim's end is unachievable under nomic, making it contradictory in a different way.

  This should meet the user's needs. It's a real-world case, avoids clichés, and clearly shows the readings' divergence.
answer: |-
  Here's a case meeting all your constraints:

  **Maxim:** "When I develop an innovative but preliminary idea during my research, I will sometimes keep it private in informal discussions with colleagues to secure recognition for the full, developed version later, rather than risk premature adoption or credit dilution."

  **Scenario:** Dr. Aris, a junior academic in a competitive field, has a promising but unrefined hypothesis. Sharing it openly at a coffee chat might lead a senior colleague to quickly develop and publish the core idea, leaving Aris struggling for recognition. Aris decides not to mention it today, planning to share only once the idea is robust and their paper is near submission. This feels prudent, not malicious, aiming to protect their legitimate stake in their own intellectual labor.

  1.  **Statutory Universalization (Permitted):** Imagine everyone freely adopts this maxim. Sometimes colleagues hold back nascent ideas; sometimes they share openly. Crucially, sharing *does still happen*, especially when ideas are more developed or when individuals judge sharing is beneficial/risk-free. The practice of informal discussion retains its core function – exchanging ideas, sparking collaboration, building trust – because sharing remains a frequent possibility actors can choose. The maxim doesn't destroy the practice; it just introduces occasional, context-specific discretion. Universal adoption seems possible without contradiction.
  2.  **Nomic Universalization (Forbidden):** Imagine it's a law of nature: *every* agent *always* keeps *every* preliminary idea private in informal discussions to secure future recognition. This eliminates the very possibility of spontaneous, trust-building idea-sharing in informal settings. The purpose of such discussions – the open exchange of nascent thoughts to foster collaboration and early feedback – is utterly destroyed. It becomes logically impossible to "secure recognition *later*" because the *precondition* for recognition (others eventually knowing the idea originated with you) requires sharing *at some point*, but the nomic law prevents *any* sharing of preliminary ideas *ever*. The action ("keeping private to secure later recognition") loses its intelligible point – the "later recognition" becomes unattainable. A world where no one ever shares nascent ideas informally is one where the very concept of collaborative intellectual development through informal talk vanishes, making the maxim's goal incoherent.
  3.  **Formula of Humanity (Permitted):** Withholding a preliminary idea in this specific context isn't treating colleagues merely as a means. Aris isn't deceiving them about facts or exploiting them; colleagues aren't entitled to Aris's every nascent thought. Aris is managing their own intellectual property and career prospects, a legitimate end. Colleagues are still treated as ends-in-themselves – their autonomy and goals aren't directly thwarted by this specific omission, especially since open sharing still occurs in other contexts (seminars, publications). This seems permissible self-regard.

  **The Crucial Feature:** The maxim inherently relies on the **preservation of the social practice** (informal idea-sharing) as a *functional background condition* for its own goal ("secure recognition later"). Nomic universalization destroys this background practice entirely, making the goal unachievable and the maxim self-stultifying. Statutory preserves the practice because sharing remains a live option actors can choose.

  **If the Feature is Deleted:** Remove "to secure recognition for the full, developed version later." The maxim becomes: "Keep innovative ideas private in informal discussions." *Now* it collapses into a classic free-rider case under nomic: the practice breaks down because everyone hoards, and the value of hoarding vanishes precisely because no sharing exists. Statutory might *still* permit it if sharing on other occasions is assumed, but the nomic failure loses its unique "loss of practice meaning" character and relies solely on the free-rider dynamic.

  **Attacking the Case (Statutory Proponent's View):** A defender of statutory universalization would likely argue that the nomic failure you identify is *not* fundamentally different from a coordination breakdown. They would say:
  1.  **"It's Still About Expectations":** The reason the practice collapses under nomic is that *everyone* acts the same way (always withhold), creating a predictable environment where no one shares. This is functionally identical to a coordination problem. The "loss of point" just describes the *consequence* of universal non-sharing, not a distinct *type* of contradiction.
  2.  **"Statutory Fixes the 'Problem'":** They'd argue that under statutory, the practice *doesn't* collapse precisely because actors freely choose *not* to act on the maxim sometimes (i.e., they share), maintaining the necessary background expectation of occasional sharing. The permissibility hinges on the maxim *not* being universally applied in practice, even if universally adopted as a principle for *possible* use. The nomic reading unfairly "rigidifies" the maxim into constant application, which isn't required by statutory.
  3.  **"The Real Work is Done by the Specificity":** They might contend that the apparent difference stems *only* from the highly specific wording tying the withholding to the *future goal* of recognition. They'd say this wording creates an artificial dependency for the nomic test. A less specific maxim ("Keep preliminary ideas private sometimes") would show the same nomic failure (free-rider) and statutory permissibility, proving the "loss of meaning" is just a semantic trick layered on top of the core coordination issue.

  **Can it Carry the Weight?** Yes, this case effectively demonstrates a verdict flip: Statutory permits, Nomic forbids, FH permits. The nomic failure *feels* distinct from a pure free-rider because the maxim's *internal goal* ("secure recognition later") becomes impossible when the *background social practice enabling that goal* is destroyed by universal application-as-law. The statutory proponent's attack is strong, focusing on expectations and coordination being the core issue even here. However, the case *does* highlight that the choice between readings matters: **The statutory reading prioritizes the *logical possibility* of a world where actors freely *limit* their use of the maxim to preserve the practice. The nomic reading tests the maxim's *necessary consequences* when applied universally *as a strict law*, revealing how it erodes the very conditions making its own purpose intelligible.** This difference *can* flip verdicts on real, non-horrific maxims concerning reasonable discretion in social practices. It shows the exegetical choice isn't harmless – it determines whether Kant's test focuses on the coherence of *principles in a world of free agents* (statutory) or the coherence of *the maxim itself as a necessary law* (nomic). Your case makes this tangible.
