answer: |-
  Here is a map of the exposure for the provenance-first view, analyzing its defeaters, internal concessions, insulation, and costs. I've prioritized the lineage cases and provenance indeterminacy as requested, while addressing all your specified points.

  ### 1. Ranked Defeaters (Fatal to Awkward)

  | Defeater                          | What Would Have to Be True                                                                 | Severity          | Conceded by Defenders? | What the View Must Surrender                     |
  | :-------------------------------- | :----------------------------------------------------------------------------------------- | :---------------- | :--------------------- | :----------------------------------------------- |
  | **Provenance Indeterminacy**      | Historical facts (training data, optimization pressures) are irrecoverably lost, ambiguous, or metaphysically indeterminate in key cases. | **Fatal**         | Yes (grudgingly)       | Strict historical criterion OR denial of behavioral sufficiency |
  | **Lineage Vagueness**             | A chain of systems, each imitating its predecessor, produces outputs indistinguishable from "real" persons with no non-arbitrary point where "counterfeit" begins. | **Fatal**         | Partially              | Historical criterion as sole basis OR legal feasibility without sharp threshold |
  | **Natural-Born Counterfeits**     | Human minds are shaped by memetic/cultural selection pressures indistinguishable in kind from AI training, making "having something at stake" a continuum. | **Serious**       | Yes (internally)       | Human exceptionalism OR view's coherence (risk of collapse to functionalism) |
  | **Inheritance Paradox**           | An AI trained on a lifelog has *more* causal connection to the original person than their biological descendant. | **Awkward/Serious** | No (dismiss as category error) | Definition of "causal history" OR acceptance of artificial persons |
  | **Behavioral Thresholds**         | Long-term interaction reveals behavioral depths (e.g., creativity under novel pressure, moral growth) impossible for mere counterfeits. | **Awkward**       | No                     | Denial that behavior *could ever* be sufficient  |
  | **Institutional Collapse**        | Watermarks are routinely stripped, disclosure requirements ignored, liability unenforceable. | **Awkward→Serious** | Yes                    | Practical viability of institutional prescription |

  **Key Explanations:**
  -   **Provenance Indeterminacy (Fatal):** If the critical historical facts are *in principle* unrecoverable (e.g., due to proprietary black-box models, data deletions, ambiguous mergers), the core criterion becomes useless precisely where needed. Defenders might propose fallback proxies, but this surrenders the view's foundational claim that history is *necessary and sufficient*.
  -   **Lineage Vagueness (Fatal):** A smooth lineage forces an arbitrary legal cutoff for liability/personhood. This undermines the view's moral seriousness ("counterfeit" isn't just a label) and makes its institutional response (liability) seem capricious. Defenders might accept threshold-setting but must concede it's *ad hoc* relative to their metaphysics.
  -   **Natural-Born Counterfeits (Serious):** If human cognition emerges from cultural/memetic selection pressures optimizing for social fit (per Dennett), then humans are "engineered" too. The "something at stake" distinction (biological fitness vs. artificial reward functions) is scalar, not categorical. Defenders *must* concede this tension internally; resolving it risks defining "stake" circularly or accepting some humans are less "real."
  -   **Inheritance Case (Awkward/Serious):** Defenders dismiss this by insisting biological reproduction and embodied existence *are* categorically different causal histories (e.g., involving evolutionary teleology). But this relies on stipulating biology as special, undermining the view's purely historical basis. If pressed, they might weaken "history" to exclude informational inheritance.

  ### 2. What a Committed Defender Would Concede
  A provenance-first defender would **internally concede**:
  -   **Provenance is often murky:** They'd admit tracking exact causal histories is practically difficult and sometimes theoretically messy (e.g., model mergers). This motivates *stronger* documentation/watermarking requirements, but concedes the criterion is fragile if those fail.
  -   **Vagueness is real:** They'd grant lineage cases show a metaphysical gray area. Their response is pragmatic: set legal thresholds where the risk of counterfeit harm outweighs the cost of misclassification. This implicitly concedes the historical property isn't perfectly discrete.
  -   **Humans are shaped by selection:** They'd embrace this (as Dennett does), but insist biological evolution and cultural evolution create a fundamentally different *kind* of "stake" (e.g., tied to survival/replication) versus artificial systems optimized for a loss function. They'd concede this distinction needs careful defense against scalar collapse.
  -   **Institutions might fail:** They'd admit watermarking could be hacked or liability evaded, requiring constant technical/legal adaptation. This is a practical challenge, not a refutation, but concedes the view's success depends on contingent social/technical factors.

  They would **dismiss as question-begging**:
  -   Arguments assuming behavioral sufficiency ("But it *feels* conscious!") or organizational invariance ("Same function = same status"), seeing these as ignoring the core insight about history.
  -   The inheritance case, viewing it as conflating informational access with genuine historical continuity of a lineage.
  -   Claims that the view is "unfalsifiable" (see below).

  ### 3. Exposure and Insulation
  *   **Insulation from Behavior:** The view's immunity to behavioral falsification is **vicious in its practical/legal instantiation**, though potentially defensible metaphysically. For a policy proposal, declaring behavior irrelevant *while* admitting provenance is often unknowable creates a dangerous epistemic gap: we lack *any* reliable criterion in many real cases. This invites arbitrary or power-driven judgments.
  *   **Empirical Predictions – Shaky Ground:**
      -   **Trust Decay:** Supported (rising skepticism about online interactions), but confounded by factors beyond provenance (e.g., misinformation, corporate greed).
      -   **Gotcha Questions:** Observed (e.g., "Turing tests" for AI), but their futility reinforces the view's point. *Weight: Low* – it predicts and explains this pathology.
      -   **Watermark Enforcement:** Looking **shaky**. Technical watermarking is often breakable; corporate resistance is high; liability is hard to enforce across jurisdictions. *Weight: Serious* – if robust watermarking/attribution proves infeasible, the institutional pillar collapses.
  *   **Exposure Points:** The view *is* exposed:
      1.  **Metaphysical:** If a system demonstrably emerged from a non-engineered, selection-rich history (e.g., alien life, evolved robots), it must be deemed "real" – challenging anthropocentrism.
      2.  **Practical:** If disclosure/watermarking universally fails *and* behavior remains indistinguishable, the view becomes operationally irrelevant.
      3.  **Moral:** If applying its criteria leads to clearly absurd or harmful outcomes (e.g., denying aid to a being indistinguishable from a suffering human due to lost provenance).

  ### 4. Costs of Defeaters (Summarized from Table)
  *   **Fatal Defeater (Provenance Indeterminacy/Lineage Vagueness):** Forces surrender of **either** the *strict historical criterion as the sole necessary/sufficient condition* (admitting behavioral/functional thresholds when history is irrecoverable/vague) **or** the *denial that behavior could ever be sufficient* (making behavior sufficient in cases of irreparable provenance loss/vagueness). The institutional prescription depends on this.
  *   **Serious Defeater (Natural-Born Counterfeits):** Forces surrender of **human exceptionalism by fiat** (accepting personhood is scalar, potentially including advanced AIs/humans shaped by strong memetic engineering) or a **redefinition of "having something at stake"** that risks circularity or functionalism.
  *   **Serious Defeater (Institutional Collapse):** Forces surrender of the **institutional prescription as currently conceived** (watermarks/liability), requiring alternative mechanisms or a fallback to behavioral assessment for trust.

  **Conclusion:** The view is most vulnerable where its metaphysical strength (history matters) meets practical reality (history is often inaccessible/vague). **Lineage vagueness and provenance indeterminacy together pose the greatest threat**, potentially forcing a pragmatic retreat to behavioral criteria in ambiguous cases – a significant concession. Its institutional proposals face serious empirical headwinds. While internally coherent against bare functionalism, its grounding in "causal history" risks circularity or scalar collapse under scrutiny of human cognitive origins. A defender must either embrace significant revisions (accepting behavioral sufficiency in practice, scalar personhood) or double down on stipulating biological/natural history as uniquely constitutive.
