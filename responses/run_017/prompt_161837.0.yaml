  1. They might say that Sarah can know that she knows p by reflecting on her first-order evidence ( the reading of 304 and the error bounds) without using a coarser method, and that this reflection does not consume extra margin. In our case, the second-order knowledge is based on the same evidence as the first-order, and it is this evidence that has the coarseness. To blunt this reply, we can note that the coarseness is in the evidence itself ( the thermometer's precision and error), not in the reflection process. Even by reflecting, she cannot narrow down the true temperature beyond the error bounds.

  2. They might say that the sphere of nearby worlds for higher-order beliefs is narrower. For example, for the third-order belief, we should use a smaller radius for nearby worlds. In our case, for the safety of the third-order belief, if we use a smaller radius, say 1°C instead of 2°C, then the world with T=302 might not be nearby. But in the actual world, the temperature is 304, and 302 is 2 away, so if we make the radius 1, then it is not nearby. Then in the nearby worlds for third-order ( true T in [303,305]), at every point, she knows that she knows p ( because T>=303>=303). Then her belief is safe. To blunt this, we can make the actual temperature closer to the edge of the second-order interval. In our case, actual T=304, and the second-order requires T>=303. If we set actual T=303.0, then:
  - knows p: 303 in [301.5,308.5] -> yes.
  - knows that she knows p: 303 in [303,307] -> yes (at the boundary).
  - for third-order: the true temperature must be in [304.5,305.5] -> 303 not in. 
   worlds with the same display ( say 303.0) would have true T in [301,305]. In this range, at T=301, she does not know level two ( because 301<303). In the world with T=301, display=303, she might believe the third-order proposition. If the safety radius for third-order is 1°C, then T=301 is 2 away from 303, not nearby. T=302 is 1 away, and in that world, does she know level two? 302<303, so no. In the world with T=302, display=303, she believes the third-order proposition ( same as actual) but it is false. And 302 is within 1°C of 303? |302-303|=1, so if the radius is 1, it is included. So the safety is violated.

   Therefore, the case is robust if we set the actual temperature at the lower edge of the second-order interval.

  Weakness: the case relies on the margin-for-error principle and the nested intervals it generates. If the defender rejects this principle and adopts a different account of knowledge, the case may not work. Also, the coarseness of the method is in the first-order evidence, not in the higher-order methods per se. If the safety radius for higher-order beliefs is allowed to be smaller, the case might not work. 

  If we switch to a sensitivity condition ( if p were false, would she believe p? ), the case might not work because for higher-order beliefs, the sensitivity condition might be easier to satisfy.

