  ### Case: Oven Temperature in a Bakery

  Sarah, a baker, monitors her oven's temperature using an analog thermometer to ensure it stays within the safe range of 300°C to 310°C for baking bread. The thermometer has a precision of 1°C and a known error margin of ±2°C due to calibration limits. The true temperature is 304.0°C, and the thermometer reads 304°C. Sarah forms the true belief that \( p \): "The temperature is between 300°C and 310°C." She reflects on her evidence: the reading of 304°C and the ±2°C error mean the true temperature is between 302°C and 306°C, which is safely within [300°C, 310°C]. She concludes she knows \( p \). When she reflects further on whether she knows that she knows \( p \), she considers that the entire range [302°C, 306°C] falls within the first-order knowledge margin, so she believes she knows that she knows \( p \). However, when she tries to know that she knows that she knows \( p \), her belief is unsafe because a nearby world with a true temperature of 302°C (displaying 304°C) is one where she believes she knows that she knows \( p \), but she does not (as 302°C falls outside the margin for second-order knowledge).

  ---

  ### Account and Arithmetic
  **Account:** Safety condition, which a defender of KK might grant as a standard externalist constraint: S knows that \( q \) only if, in all nearby worlds where S believes \( q \) via the same method, \( q \) is true. We assume a fixed similarity metric based on temperature difference (in °C), with "nearby" defined as within ±2°C of the actual temperature. This margin reflects the coarseness of Sarah's thermometer; her method for self-ascribing knowledge relies on the same instrument, with no independent refinement.

  **Arithmetic:**
  - **First-order knowledge of \( p \) (margin consumed: 1.5°C):**  
    The nearest not-\( p \) worlds are at 299°C (below 300°C) and 311°C (above 310°C). For safety, Sarah must be at least 1.5°C from these boundaries to avoid errors. Thus, to know \( p \), the true temperature must be in [301.5°C, 308.5°C]. Actual temperature (304.0°C) is within this, so she knows \( p \).
    
  - **Second-order knowledge of \( Kp \) (margin consumed: additional 1.5°C, total 3.0°C):**  
    The nearest worlds where Sarah does not know \( p \) are at 301.4°C (below 301.5°C) and 308.6°C (above 308.5°C). To know \( Kp \), she must be at least 1.5°C from these, requiring the true temperature in [303.0°C, 307.0°C]. Actual temperature (304.0°C) is within this, so she knows \( Kp \).

  - **Third-order knowledge of \( KKp \) (margin consumed: additional 1.5°C, total 4.5°C):**  
    The nearest worlds where Sarah does not know \( Kp \) are at 302.9°C (below 303.0°C) and 307.1°C (above 307.0°C). To know \( KKp \), she must be at least 1.5°C from these, requiring the true temperature in [304.5°C, 305.5°C]. Actual temperature (304.0°C) is outside this (304.0°C < 304.5°C), and crucially, the coarseness of her method (thermometer error ±2°C) means she cannot rule out a nearby world like 302°C (within ±2°C of 304°C). In that world, the thermometer still reads 304°C, so she believes \( KKp \), but at 302°C, she does not know \( Kp \) (as 302°C < 303.0°C), making \( KKp \) false. Thus, her third-order belief is unsafe, and she does not know \( KKp \).

  **Why level three fails:** The margin consumed by each iteration (1.5°C per level) accumulates, and by level three, the required margin (4.5°C total) exceeds the available buffer from the not-\( p \) boundaries (4.0°C from 300°C/310°C). The coarseness of Sarah’s method (thermometer error ±2°C) prevents her from discriminating the exact margin left after level two, so she cannot "see" that 304.0°C is too close to 303.0°C for level-three safety.

  ---

  ### Role of Coarseness and Sharpness
  - **If her second-order method discriminated the margin exactly (e.g., a perfect thermometer with ±0.1°C error):**  
    She would know the true temperature is 304.0°C ±0.1°C. The interval [303.9°C, 304.1°C] is entirely within [303.0°C, 307.0°C] (level-two margin), so she would know \( Kp \) and could safely know \( KKp \). The case collapses into full KK.
    
  - **If the underlying quantity were sharp (e.g., no measurement error, she knows exact temperature):**  
    With no coarseness, no margin is consumed by self-ascription. She would know \( p \), \( Kp \), and \( KKp \) directly from the exact value, leading to full KK.

  ---

  ### Replies for KK Defenders and How to Blunt Them
  1. **Reply: Second-order knowledge via reflection on first-order evidence (no separate method):**  
     *Defense:* Sarah knows she knows \( p \) by re-examining her first-order evidence (the thermometer reading and error bounds), not by a coarser second-order method. Thus, no extra margin is consumed.  
     *Blunting:* In this case, the "evidence" is inherently coarse due to the thermometer’s ±2°C error. Reflection uses the same input, so it inherits this coarseness. To block this reply, ensure the method for self-ascription is identical to the first-order method (e.g., Sarah re-reads the same thermometer). Change the scenario: If Sarah had a separate, precise second instrument (e.g., a digital sensor with ±0.1°C error) for self-ascription, she could avoid coarseness. But here, no such tool is available (Constraint 4).

  2. **Reply: Narrower similarity spheres for higher-order beliefs:**  
     *Defense:* The sphere of "nearby worlds" for evaluating \( KKp \) is narrower (±1°C) than for \( Kp \) (±2°C), so 302°C is not nearby, and the belief is safe.  
     *Blunting:* Safety conditions typically fix the metric (here, temperature difference) across orders; varying it ad hoc favors KK. To blunt this, set the actual temperature at the edge of the level-two margin (e.g., 303.0°C). Then, 301°C is ±2°C away. If the sphere narrows to ±1°C, 302°C is still nearby (|303°C - 302°C| = 1°C), and at 302°C, she fails to know \( Kp \), defeating safety. Change the scenario: If the similarity metric were context-dependent (e.g., "psychological nearness"), the case might not hold, but we use a fixed physical metric.

  ---

  ### Weak Points and Sensitivity
  - **Load-bearing assumption:** The margin-for-error arithmetic (1.5°C per iteration) carries the verdict. This derives from the safety condition and the choice of margin size.  
    - **Flip to full KK:** If the margin per level is reduced to 1.0°C, level three requires [304.0°C, 306.0°C]. Actual 304.0°C is included, so she knows \( KKp \).  
    - **Flip to failure at level two:** If the margin is increased to 2.0°C per level, level two requires [305.0°C, 306.0°C]. Actual 304.0°C is excluded, so she fails to know \( Kp \).  
    - **Argument to flip:** Defenders may argue the margin should not compound or should be smaller for higher orders. Rebut by noting iteration tightens constraints (Williamson 2000, Ch. 5).

  - **Switching to sensitivity (if \( p \) were false, S wouldn’t believe \( p \)):**  
    The case fails. For sensitivity, level three asks: If \( KKp \) were false, would Sarah believe \( KKp \)? At 302°C (where \( KKp \) is false), the thermometer may read 304°C, so she might still believe \( KKp \). But sensitivity tolerates this if the scenario is "distant" from actuality. Here, 302°C is nearby, so sensitivity may still fail. However, safety is stricter and better fits margin arguments.

  **Most likely breakpoint:** The safety/margin-for-error account is contestable. If defenders reject margin iteration, the case loses force. But it remains effective against students assuming KK failure is all-or-nothing.
