              So Y still dominates X? So it works.

          But if we set for row A: (0,0) and (4,3) and for row B: (4,5) and (0,3) then:

              After eliminating C:
                  Against A: X=0, Y=3 -> Y better.
                  Against B: X=5, Y=3 -> X better.

              Then Y does not dominate X (because at B, X is better). So we cannot eliminate X.

          Then the procedure does not unravel to (A,Y). We would have:

              After eliminating C, we have a 2x2:

                  A: (0,0) [for X] and (4,3) [for Y]
                  B: (4,5) [for X] and (0,3) [for Y]

              Now, for row player: 
                  Against X: A=0, B=4 -> A is strictly dominated by B? So we eliminate A.
                  Then we are left with B and both columns. Then for column: 
                      Against B: X=5, Y=3 -> so X is better? Then we eliminate Y?
                  So the outcome is (B,X).

          But we wanted (A,Y). So we must design the column payoffs so that after C is gone, Y dominates X.

     Now, the best objection by a skeptic:

          A skeptic might say: "Why should we allow mixed strategies to dominate? The players are going to play pure strategies. Moreover, the mixed strategy requires the row player to randomize between A and B. But if the row player plays A, then they get 0 against X and 4 against Y. If they play B, they get 4 against X and 0 against Y. They cannot get the average without actually randomizing. And if they randomize, then the column player might adjust accordingly? The iterated elimination procedure assumes that the players are rational and that they know the other player is rational, but it does not require them to actually play mixed strategies. It only uses mixed strategies as a thought experiment to eliminate strategies that are never a best response?"

          Reply: 
              "The use of mixed strategies in iterated elimination is justified by the fact that a strictly dominated strategy (by any strategy, mixed or pure) is never a best response to any belief about the opponent's play. Therefore, a rational player would never choose it. The mixed strategy dominance is a stronger condition and leads to more eliminations. It is standard in game theory (e.g., in the definition of rationalizability). Moreover, note that we are not requiring the player to actually randomize; we are only using the mixed strategy to show that C is strictly worse than some other strategy (the mixed one) no matter what the column player does. So the row player, knowing that, would never play C."

     We'll present the matrix and the story as above.

     Let me write the matrix clearly:

          Strategies:
            Row: A, B, C
            Column: X, Y

          Payoff matrix (row, column):

                     X        Y
            A      (0,0)    (4,5)
            B      (4,0)    (0,5)
            C      (1,5)    (1,0)

     Story in one paragraph:

          The city council (row player) must choose a location for a new landfill: north (A), south (B), or central (C). The state environmental agency (column player) chooses the monitoring level: low (X) or high (Y). The city council's payoff depends on the location and monitoring: in the north, high monitoring avoids environmental risks but is costly (yielding 0 under low monitoring and 4 under high); in the south, low monitoring is sufficient (yielding 4) but high monitoring causes public unrest (0); in the central location, the payoff is 1 regardless. The state agency's payoff: in north or south, high monitoring (Y) is necessary to avoid disaster (yielding 5) and low monitoring (X) yields 0; in central, low monitoring (X) is sufficient (5) and high monitoring (Y) is wasteful (0).

     Now, the step-by-step:

          (1) Pure-only IESDS:
              - For row: 
                  A vs B: 
                    Against X: A (0) < B (4) -> so A is not dominated by B? Actually, we require that one strategy is strictly worse in every column? 
                    Against Y: A (4) > B (0) -> so no domination.
                  A vs C: 
                    Against X: 0 < 1 -> so A worse than C in X.
                    Against Y: 4 > 1 -> so A better than C in Y. -> no domination.
                  B vs C: 
                    Against X: 4 > 1 -> B better than C in X.
                    Against Y: 0 < 1 -> B worse than C in Y. -> no domination.

              - For column:
                  X vs Y:
                    Against A: 0 (for X) < 5 (for Y) -> Y better.
                    Against B: 0 < 5 -> Y better.
                    Against C: 5 (for X) > 0 (for Y) -> X better.
                  So no strict dominance for either X or Y.

              Therefore, no elimination in the first round. The procedure stops.

          (2) Mixed procedure:
              Step 1: Consider the mixed strategy of row: 0.5 A + 0.5 B.
                  Against X: 0.5*0 + 0.5*4 = 2
                  Against Y: 0.5*4 + 0.5*0 = 2
                  Now, compare to C:
                      Against X: 2 > 1 -> mixed strategy is better.
                      Against Y: 2 > 1 -> mixed strategy is better.
                  Therefore, C is strictly dominated by the mixed strategy and is eliminated.

              Step 2: Now the game is:

                     X        Y
                  A (0,0)   (4,5)
                  B (4,0)   (0,5)

              For column player:
                  Against A: X gives 0, Y gives 5 -> Y better.
                  Against B: X gives 0, Y gives 5 -> Y better.
                  Therefore, Y strictly dominates X. So we eliminate X.

              Step 3: Now the game is:

                     Y
                  A (4,5)
                  B (0,5)

              For row player: 
                  Against Y: A gives 4, B gives 0 -> so A strictly dominates B. We eliminate B.

              The unique survivor: (A, Y).

          (3) The key feature: 
              The compromise strategy C has a constant payoff k (here 1) that is less than the average of the two extreme strategies A and B in both states (which is 2). The mixed strategy of A and B gives 2 in both states, and since 2>1, it dominates C. 
              If k were raised to 2, then the mixed strategy would not dominate (because 2 is not strictly greater than 2). 
              Also, note that the pure strategies A and B do not dominate each other and also do not dominate C because they are state-dependent.

          (4) What if we change C to (2,2) or if the column payoffs do not lead to domination of X after C is eliminated?
              If C is (2,2): then the mixed strategy (0.5A+0.5B) gives (2,2) and does not strictly dominate C. Then we cannot eliminate C. The procedure stalls.
              If the column payoffs are changed so that after C is eliminated, X is not dominated by Y, then we might not eliminate X and the unraveling stops. For example, if we set for row B: (4,5) and (0,3) then after eliminating C, we have:
                  Against A: X=0, Y=5 -> Y better.
                  Against B: X=5, Y=3 -> X better.
              Then Y does not dominate X. Then we have a 2x2 game. We might then eliminate a row strategy by pure dominance? For example, if we see that for row player, against X: A=0, B=4 -> so A is dominated by B? Then we eliminate A. Then we have only B and both columns. Then for column: against B, X=5, Y=3 -> so Y is dominated by X? Then we eliminate Y? Then we get (B,X). 
              But that is not (A,Y). So the condition on the column payoffs is necessary.

          (5) Skeptic's objection and reply: 
              Objection: "Mixed strategies are not actually played, so why use them to eliminate? The row player might never randomize, so why consider a mixed strategy to eliminate C?"

              Reply: "The elimination is based on the principle that a rational player will never play a strategy that is strictly dominated, meaning that there exists some other strategy (pure or mixed) that yields a strictly higher payoff no matter what the opponent does. This is because, regardless of the opponent's play, the player can guarantee a higher payoff by switching to that other strategy. The mixed strategy here is a way of combining pure strategies to create a strategy (which could be played by randomizing) that dominates C. The player does not have to randomize in the end; they just has to recognize that C is never the best choice. In fact, after elimination, we end up with a pure strategy equilibrium."

     We have the matrix and the story. The example is complete.
answer: |-
  ### Problem-Set Question: Iterated Elimination of Strictly Dominated Strategies

  **Scenario:**  
  A city council (row player) must choose a location for a new landfill: North (A), South (B), or Central (C). The state environmental agency (column player) chooses the monitoring level: Low (X) or High (Y). The council's payoff depends on location and monitoring costs/political fallout. The agency's payoff depends on environmental risk and monitoring costs. Payoffs (council, agency) are:

  |          | Low Monitoring (X) | High Monitoring (Y) |
  |----------|---------------------|---------------------|
  | **North (A)** | (0, 0)             | (4, 5)             |
  | **South (B)** | (4, 0)             | (0, 5)             |
  | **Central (C)** | (1, 5)             | (1, 0)             |

  **Analysis:**

  ### (1) Pure-Strategy Iterated Elimination (Stops Immediately)
  - **Row Player (council):**  
    - A vs. B:  
      - Against X: 0 < 4 (B better)  
      - Against Y: 4 > 0 (A better)  
      → No strict dominance.  
    - A vs. C:  
      - Against X: 0 < 1 (C better)  
      - Against Y: 4 > 1 (A better)  
      → No strict dominance.  
    - B vs. C:  
      - Against X: 4 > 1 (B better)  
      - Against Y: 0 < 1 (C better)  
      → No strict dominance.  
  - **Column Player (agency):**  
    - X vs. Y:  
      - Against A: 0 < 5 (Y better)  
      - Against B: 0 < 5 (Y better)  
      - Against C: 5 > 0 (X better)  
      → No strict dominance (X better under C, Y better under A/B).  
  **Result:** No strategies eliminated in Round 1. Procedure stops with all 6 outcomes.

  ### (2) Mixed-Strategy Iterated Elimination (Eliminates C, then X, then B)
  - **Step 1: Eliminate C (dominated by 50-50 mix of A and B)**  
    Mixed strategy (0.5A, 0.5B) vs. C:  
    - Against X: \(0.5 \times 0 + 0.5 \times 4 = 2 > 1\)  
    - Against Y: \(0.5 \times 4 + 0.5 \times 0 = 2 > 1\)  
    → C strictly dominated. Remove C. Matrix reduces to:  
    |          | X       | Y       |
    |----------|---------|---------|
    | **A**    | (0, 0)  | (4, 5)  |
    | **B**    | (4, 0)  | (0, 5)  |

  - **Step 2: Eliminate X (strictly dominated by Y)**  
    Agency:  
    - Against A: 0 (X) < 5 (Y)  
    - Against B: 0 (X) < 5 (Y)  
    → Y strictly dominates X. Remove X. Matrix reduces to:  
    |          | Y       |
    |----------|---------|
    | **A**    | (4, 5)  |
    | **B**    | (0, 5)  |

  - **Step 3: Eliminate B (strictly dominated by A)**  
    Council against Y:  
    - A: 4 > 0 (B)  
    → A strictly dominates B. Remove B.  
  **Result:** Unique surviving strategy profile (A, Y) = (North, High Monitoring).

  ### (3) Key Feature of Payoff Matrix
  The critical feature is **C's constant payoff (k, k) vs. A's (0, 4) and B's (4, 0)**. The 50-50 mix of A and B yields (2, 2) against both X and Y. This strictly dominates C if \(k < 2\). Here, \(k = 1\) (the maximum integer satisfying \(k < 2\)).  
  - If \(k = 2\): Mixed strategy gives 2 against both, equal to C → no strict dominance.  
  - If \(k = 1.5\): Mixed strategy (2) > C (1.5) → strict dominance (but payoffs are integers here).

  ### (4) If Key Feature Is Removed
  - **C changed to (2, 2):**  
    Mixed strategy (2, 2) does not strictly dominate C (2 ≯ 2). Elimination stalls → no strategies eliminated.  
  - **Column payoffs altered so X not dominated after C eliminated (e.g., B vs. Y payoff for agency changed to (0, 3)):**  
    After eliminating C:  
    |          | X       | Y       |
    |----------|---------|---------|
    | **A**    | (0, 0)  | (4, 5)  |
    | **B**    | (4, 0)  | (0, 3)  |  
    Agency: Against A, Y (5) > X (0); against B, X (0) < Y (3) → no strict dominance. Procedure may stall or eliminate differently (e.g., if row eliminates A first, outcome may be (B, X)).

  ### (5) Skeptic's Objection and Reply
  - **Objection:** "Mixed strategies aren't 'real' choices—players don’t randomize. Pure dominance is the only legitimate criterion."  
  - **Reply:** "The goal is to identify strategies *never* optimal. If a mixed strategy strictly dominates a pure strategy C, then C is never a best response to *any* belief about the opponent's play. Rational players avoid C regardless of whether they ultimately randomize. This is standard in game theory (e.g., rationalizability) and strengthens predictions."

  ---  
  **Final Matrix and Survivor:**  
  - **Full Payoff Matrix:**  
    |          | X       | Y       |
    |----------|---------|---------|
    | **A**    | (0, 0)  | (4, 5)  |
    | **B**    | (4, 0)  | (0, 5)  |
    | **C**    | (1, 5)  | (1, 0)  |  
  - **Unique Survivor:** (A, Y) = (North, High Monitoring).
