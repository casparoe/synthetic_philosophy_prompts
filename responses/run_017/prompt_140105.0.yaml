prompt: |-
  Hey — I mod a pretty large online community (forum plus a Discord, ~40k members, rationalist/EA-ish core with a big general-interest tail), and the mod team is six volunteers doing this in our spare time. Two or three times a month someone does something and a chunk of the community demands we sanction them: ban them, delete or lock their posts, pull their invite to an in-person meetup, put a visible note on their profile, or publicly confirm or deny an accusation. Right now each of these turns into a 300-comment thread and we decide by vibes, so we've definately been inconsistent and everyone can tell.

  What I want is a decision procedure, not more framings. Take whatever the philosophy of punishment actually has to say — retributive vs. deterrence vs. communicative/expressive vs. restorative accounts, proportionality, the line between punishing someone and merely declining to associate with them or protecting the group, whether the punisher needs standing and on whose behalf they're acting, whether reasons and a chance to respond are owed, whether a sanction can be undone — and turn it into something six tired volunteers can actually run in an evening on a real case, in about an hour of discussion, and write up afterwards as a short public note. Constraints: no lawyer, no investigator, usually only what the parties tell us; majority of the six signs off; we post the anonymized reasoning publicly because transparency is the whole reason anyone trusts us.

  A few things I keep half-remembering from blogs that I think have to be built in, and please tell me if I've got them wrong:

  - The ratchet: a sanction that's formally temporary is functionally permanent, because search engines, archives and screenshots don't decay. Whatever we do, its real severity is set by an audience of strangers we didn't choose, not by the community we were talking to. So "a two-week ban" and "a permanent mark on this person's search results" may be the same action and we should have to say which one we're doing.
  - Related: the severity we intend and the severity that gets delivered come apart, and we don't control the translation. One member's mild rebuke is another audience's career-ender. I want a step where we say who the addressee of the sanction is supposed to be, and what happens if we can't keep it to them.
  - There is no sanction budget. Nobody is tracking or able to track the total amount of sanction a person is receiving across venues, so "proportionate to the act" is not the same as "proportionate to what this person will actually experience." Sometimes the right move is to sanction less than the act deserves; sometimes doing nothing is the pile-on.
  - The abstraction test: rewrite the offense description with no proper names, no ideological markers and no in-group/out-group markers, re-run the procedure on the rewrite, then re-run it with a randomly chosen member in the role. If the verdicts differ, something other than the act is doing the work.

  The procedure needs: the questions in order; what counts as a sufficient answer to each; where it stops with a no; and where it hands the decision to a person because it's a values question rather than a factual one (I think one of those is whether we're a private club we may exclude people from for any reason or none, versus something closer to infrastructure people depend on for professional and social goods — that one we should vote on once and then it changes everything downstream, so flag it).

  Cases it has to handle without falling over:
  1. A long-time, well-liked contributor who was repeatedly rude and dismissive to a newcomer, never broke a written rule, and the newcomer quietly left.
  2. An allegation about something serious that happened off-platform, years ago, entirely legal, which we can't verify because the evidence is a private conversation and the complainant won't consent to sharing it — and the member's real name is on their account.
  3. Someone another community already sanctioned hard for the same conduct, where people want us to either pile on or publicly affirm that sanction.

  Then: run the procedure on all three, and make at least one of them come out somewhere the team will hate — we have to publicly decline to sanction someone most of us think is a jerk, or we have to sanction a popular contributor, or we have to say something that will read as taking a side. Tell us which one that is and how to defend it in the public note. Finally, be honest about what the procedure can't do: which kinds of case it will systematically misfire on, and which of the hard questions it just relocates rather than answers.
reasoning: |-
  We are designing a decision procedure for a moderation team of six volunteers. The procedure must be efficient (about one hour per case), produce a public note, and handle real-world constraints (no legal/investigative resources, reliance on available information). The procedure must incorporate several philosophical insights and handle specific test cases. It should also be transparent about its limitations.

  Key principles to incorporate:
  1. **The Ratchet**: Sanctions have permanent digital consequences. We must be explicit about whether a sanction is temporary (intended to expire) or permanent (leaves a lasting mark).
  2. **Severity Discrepancy**: The intended severity and the actual impact may differ. We must specify the intended audience and consider spillover effects.
  3. **No Sanction Budget**: We cannot track the total sanctions a person receives across platforms. Therefore, proportionality must consider the act in isolation and the potential for over-sanctioning.
  4. **Abstraction Test**: To avoid bias, we must anonymize the offense description and test the decision against a hypothetical member.

  The procedure must include:
  - Ordered questions
  - Sufficient answers for each
  - Stopping points (where a "no" ends the process)
  - Points where human judgment (vote) is required

  Additionally, we must decide on the nature of the community (private club vs. infrastructure) once, as it affects the entire procedure.

  Test cases:
  1. **Case A**: Long-time, well-liked contributor repeatedly rude to a newcomer (no rule broken), newcomer left.
  2. **Case B**: Allegation of serious off-platform conduct (years ago, legal, unverifiable private conversation), with real name on account.
  3. **Case C**: Someone already sanctioned by another community for the same conduct; demands to pile on or publicly affirm.

  We must run the procedure on all three, and at least one outcome should be unpopular (e.g., decline to sanction a jerk, sanction a popular member, or take a side). We must also identify the procedure's limitations.

  ---

  **Step 0: Pre-procedure Setup (One-time Vote)**
  - **Question**: What is the primary nature of this community? 
    - Option A: A private club (we may exclude or sanction for any reason or none, with minimal justification).
    - Option B: Essential infrastructure (provides professional/social goods, requiring higher due process and restraint in sanctions).
  - **Process**: The six moderators vote (majority wins) and record the result. This decision sets the default stance for subsequent steps.

  ---

  **Decision Procedure**

  **Step 1: Preliminary Assessment (Is this within our remit?)**
  - **Question 1.1**: Does the alleged conduct violate a written rule of the community? (If yes, skip to Step 2. If no, proceed to 1.2)
  - **Question 1.2**: Even if no written rule is violated, does the alleged conduct pose a clear and present danger to the community's function or members? (e.g., driving away members, creating a hostile environment, or threatening physical safety)
    - *Sufficient answer*: Moderators discuss briefly (5 min) and vote. Majority "yes" proceeds to Step 2. Majority "no" → **Stop: No sanction. Public note: "After review, we found no violation of community rules and no clear threat to the community. We are not taking action at this time."**

  *Rationale: This step filters out cases where the community's rules or safety aren't implicated. It prevents overreach into purely interpersonal disputes without community impact.*

  ---

  **Step 2: Abstraction Test (Guarding against bias)**
  - Rewrite the offense description without names, ideologies, or in-group/out-group markers. Focus solely on the actions and context.
  - **Question 2.1**: If the same abstracted actions were done by a randomly chosen member (e.g., a median active member), would we proceed? 
    - *Sufficient answer*: Moderators vote. If majority "no", → **Stop: No sanction. Public note: "After applying an impartiality test, we determined that the conduct, when abstracted, does not meet our threshold for intervention. We will not sanction."**
    - If majority "yes", proceed to Step 3.

  *Rationale: This step ensures consistency and reduces bias based on identity or popularity.*

  ---

  **Step 3: Severity and Proportionality (What sanction, if any, is appropriate?)**
  - **Question 3.1**: What is the primary goal of a sanction in this case? (Vote on one)
    - A. Deterrence (discourage similar conduct by others)
    - B. Protection (remove or restrict the person to protect the community)
    - C. Restoration (repair harm, e.g., mediation, apology)
    - D. Expression (communicate community values)
  - **Question 3.2**: Considering the act in isolation (ignoring external sanctions), what is the minimum effective sanction? (Options: Warning, private note, public note, temporary ban, permanent ban, profile note, meetup exclusion, etc.)
    - *Process*: Moderators propose and vote on options. Majority wins.
  - **Question 3.3**: Given the Ratchet principle, is the proposed sanction reversible? 
    - If reversible (e.g., temporary ban), proceed.
    - If irreversible (e.g., permanent profile note, public accusation), → **Requires supermajority (5/6) or unanimous vote to proceed.**
  - **Question 3.4**: Considering the No Sanction Budget principle, is there evidence this person is already facing significant external sanctions (e.g., public shaming, job loss)? 
    - If yes, and if the sanction would be additive, consider reducing severity or opting for a private resolution. Vote on whether to downgrade the sanction (e.g., from public to private, from permanent to temporary). Majority decides.
  - **Question 3.5**: Specify the intended audience for the sanction (e.g., the offender, the community, or the public). Then, discuss: Could this sanction spill over to unintended audiences (e.g., employers, other communities)? 
    - If spillover is likely and severe, consider mitigation (e.g., anonymizing the public note) or downgrading. Vote on whether to adjust.

  *Rationale: This step forces explicit consideration of purpose, reversibility, and collateral damage.*

  ---

  **Step 4: Due Process (Fairness to the accused)**
  - **Question 4.1**: Has the accused been given a chance to respond to the allegations? 
    - If no, pause and allow a response (time-permitting; if urgent, skip but note in public record).
  - **Question 4.2**: Is the evidence sufficient to support the sanction? (Given constraints: usually only what parties tell us)
    - *Sufficient answer*: Moderators vote on whether the evidence meets a "preponderance of the evidence" standard (more likely than not). If no, → **Stop: No sanction. Public note: "Insufficient evidence to support action."**
    - If yes, proceed to Step 5.

  *Rationale: Basic fairness requires an opportunity to respond and evidence-based decisions.*

  ---

  **Step 5: Final Decision and Public Note**
  - **Question 5.1**: Do at least four moderators agree on the sanction? (Majority of six)
    - If yes, implement and draft a public note.
    - If no, reconsider or downgrade sanction until consensus or drop the case.
  - **Public Note Template**:
    - Summary of the allegation (anonymized).
    - Findings (what we concluded about the conduct).
    - Decision and sanction (if any).
    - Reasoning (including which principles applied, e.g., "We considered the risk of spillover and opted for a private warning").
    - Any dissenting views (optional but recommended for transparency).

  ---

  **Running the Test Cases**

  **Case A: Rude Contributor**
  - **Step 1.1**: No written rule broken → **1.2**: Does it pose a clear danger? Yes, if rudeness drives members away, harming the community. Proceed.
  - **Step 2**: Abstract: "A member was repeatedly rude to a newcomer, who left." Apply to random member: Would we sanction? Probably yes (if community values newcomer retention). Proceed.
  - **Step 3.1**: Goal? Likely deterrence and protection. **3.2**: Minimum sanction? Private warning or mediation. **3.3**: Reversible? Yes. **3.4**: No evidence of external sanctions. **3.5**: Audience: The offender. Spillover low if handled privately.
  - **Step 4**: Accused can respond. Evidence: Testimony of witnesses or the complainant. Likely sufficient.
  - **Step 5**: Sanction: Private warning and offer to mediate. Public note: "We addressed a pattern of unwelcoming behavior. The member has been counseled privately."
  - **Outcome**: Mild sanction for a popular member. Team might hate this if they wanted harsher action, but the procedure forces proportionality.

  **Case B: Off-Platform Allegation**
  - **Step 1.1**: No rule broken (off-platform) → **1.2**: Clear danger? If the allegation is serious (e.g., harassment) and the person is active, it might create a hostile environment. Proceed only if the danger is clear and present (e.g., if the person holds a leadership role). Otherwise → Stop. *Assume we proceed for test.*
  - **Step 2**: Abstract: "A member is accused of serious off-platform conduct, unverifiable due to private evidence." Apply to random member: Sanctioning without evidence risks unfairness. Vote likely "no" → **Stop: No sanction.** 
    - *But if vote is "yes", continue:*
  - **Step 3.1**: Goal? Protection or expression. **3.2**: Minimum sanction? If danger is high, temporary ban pending investigation (but we can't investigate). **3.3**: Irreversible if public. **3.4**: Real name → high spillover risk. **3.5**: Likely downgrade to private inquiry or no action.
  - **Step 4**: Evidence insufficient (unverifiable) → **Stop: No sanction.**
  - **Public note**: "We reviewed an off-platform allegation but found the evidence insufficient to act. We take such reports seriously but must balance fairness and verification."
  - **Outcome**: Decline to sanction despite serious allegation. Team might hate this if they believe the complainant, but the procedure prioritizes due process and evidence.

  **Case C: Pile-On Demand**
  - **Step 1.1**: No rule broken (conduct occurred elsewhere) → **1.2**: Clear danger? Only if the conduct directly affects this community (e.g., if the person is repeating the conduct here). Otherwise → Stop. *Assume no local impact.*
  - **Step 2**: Abstract: "A member was sanctioned by another group; should we add our sanction?" Apply to random member: Unless the conduct violates our rules, no. Vote "no" → **Stop: No sanction.**
    - *If the conduct also occurred here, treat as a new case.*
  - **Public note**: "We do not automatically endorse sanctions from other communities. Without evidence of harm here, we decline to act."
  - **Outcome**: Decline to pile on. Team might hate this if they want to show solidarity, but the procedure isolates the community's interests.

  ---

  **Unpopular Outcome**: 
  - In **Case B**, the procedure forces us to decline sanctioning despite a serious allegation because we lack evidence. This might anger members who believe the complainant, but we defend it by emphasizing fairness and the risk of irreversible harm from unverified accusations.
  - In **Case A**, if the team dislikes the mild sanction, we defend it by noting that the harm was addressed without escalating to public shaming, respecting the contributor's history and minimizing spillover.

  ---

  **Limitations of the Procedure**:
  1. **Evidence Constraints**: Without investigative resources, we rely on what's presented. This may lead to under-sanctioning in cases with hidden evidence (e.g., Case B).
  2. **Bias in Abstraction**: The abstraction test is subjective; moderators might still imagine the real person.
  3. **Spillover Unpredictability**: We cannot fully control how sanctions are perceived externally.
  4. **Restorative Challenges**: We lack tools for true restoration (e.g., mediation requires willing parties).
  5. **Speed vs. Thoroughness**: One hour may rush complex cases.
  6. **Values Relocation**: The procedure doesn't resolve core debates (e.g., "What is harm?"); it only structures them.

  **Conclusion**: This procedure provides a structured, principled way to make consistent decisions. It forces moderators to confront key issues (bias, severity, evidence) and publicly justify outcomes. It won't please everyone, but it ensures transparency and reduces arbitrariness.
answer: |-
  Below is a complete decision procedure for your moderation team, designed to be run in ~1 hour per case. It integrates your philosophical constraints (ratchet effect, severity discrepancy, no sanction budget, abstraction test) and handles the specified test cases. The procedure is structured as a flowchart of questions, with clear stopping points, voting requirements, and guidance for public notes. It assumes your team has already voted on the foundational question of your community's nature (Step 0).

  ---

  ### **Step 0: Foundational Vote (One-Time Decision)**
  **Question:** *Is this community a private club (we may exclude/sanction for any reason) or essential infrastructure (we must minimize exclusion due to social/professional dependence)?*  
  - **Process:** Moderators vote majority-rule. Record the result permanently in your charter.  
  - **Downstream Impact:**  
    - *Private club:* Lower bar for sanctions; "protecting the community" outweighs individual fairness.  
    - *Essential infrastructure:* Higher bar for sanctions; prioritize due process and rehabilitation.  

  ---

  ### **Core Decision Procedure**  
  *Run this sequence for each case. Timebox each step (5-10 mins) to stay under 1 hour total. Always anonymize parties in internal discussion (e.g., "Member A," "Accuser B").*

  #### **STEP 1: Threshold Check**  
  **Question 1.1:** *Is there a credible claim of harm to the community or its members (e.g., driving people away, creating fear, enabling harassment)?*  
  - **Sufficient Answer:**  
    - If **no** → **Stop. No sanction.** Public note: "No community harm substantiated."  
    - If **yes** → Proceed to 1.2.  

  **Question 1.2:** *Is the harm primarily "on-platform" (occurring within our forum/Discord)?*  
  - **Sufficient Answer:**  
    - If **off-platform and not spilling into our space** → **Stop. No sanction.** Public note: "This concerns off-platform conduct with no demonstrated impact here."  
    - If **on-platform or spilling into our space** → Proceed to Step 2.  
  - **Human Judgment:** Vote if unclear. Majority rules.  

  > *Rationale:* Filters out cases where your community isn't implicated. Test Case B (off-platform allegation) often stops here unless spillover is proven.

  #### **STEP 2: Abstraction Test (Bias Check)**  
  **Question 2.1:** *Rewrite the offense generically (remove names, ideologies, in-group markers). Example: "Member was persistently dismissive of another member's contributions" instead of "EA leader mocked newbie."*  
  **Question 2.2:** *Would we sanction a randomly chosen median member (not new, not core) for this generic offense?*  
  - **Sufficient Answer:**  
    - If **no** → **Stop. No sanction.** Public note: "After impartial review, this does not meet our threshold for intervention."  
    - If **yes** → Proceed to Step 3.  
  - **Human Judgment:** Vote. Majority rules.  

  > *Rationale:* Ensures consistency. Test Case A (popular member's rudeness) must pass this to proceed—no special treatment.

  #### **STEP 3: Evidence & Due Process**  
  **Question 3.1:** *Can we verify key facts with ≥51% confidence using only what's shared with us (no investigation)?*  
  - **Sufficient Answer:**  
    - If **no** → **Stop. No sanction.** Public note: "Insufficient evidence to act."  
    - If **yes** → Proceed to 3.2.  

  **Question 3.2:** *Has the accused had 24 hours to respond (if practical)?*  
  - **Sufficient Answer:**  
    - If **no and case is non-urgent** → Pause to allow response.  
    - If **yes or urgent** → Proceed to Step 4.  
  - **Human Judgment:** Vote on urgency. Majority rules.  

  > *Rationale:* Fairness baseline. Test Case B (unverifiable off-platform claim) stops here unless the accused admits guilt.

  #### **STEP 4: Sanction Goals & Proportionality**  
  **Question 4.1:** *What is the primary goal?* (Vote on one):  
  - A. **Protection:** Remove immediate threat (e.g., ban).  
  - B. **Deterrence:** Discourage future harm (e.g., public warning).  
  - C. **Restoration:** Repair relationships (e.g., mediated apology).  
  - D. **Expression:** Affirm community values (e.g., statement).  

  **Question 4.2:** *What is the minimum sanction to achieve this goal?*  
  - **Guidance:** Start low (e.g., private warning) and escalate only if necessary.  

  **Question 4.3:** *Given "no sanction budget," might this sanction cause disproportionate cumulative harm (e.g., job loss, cross-platform pile-on)?*  
  - **Sufficient Answer:**  
    - If **yes** → Downgrade sanction (e.g., make private, shorten ban).  
    - If **no** → Proceed.  
  - **Human Judgment:** Vote on downgrade. Majority rules.  

  > *Rationale:* Prevents over-punishing. Test Case C (external sanction) often downgrades here (e.g., no public statement).

  #### **STEP 5: Ratchet & Severity Control**  
  **Question 5.1:** *Is this sanction reversible (e.g., temporary ban, private note)?*  
  - **Sufficient Answer:**  
    - If **yes** → Proceed to 5.2.  
    - If **no** (e.g., permanent ban, public profile note) → Requires **unanimous moderator vote**. If not unanimous, downgrade to reversible sanction.  

  **Question 5.2:** *Who is the intended audience?* (e.g., offender, community, public).  
  **Question 5.3:** *Could this sanction spread beyond the audience (e.g., via screenshots)?*  
  - **Sufficient Answer:**  
    - If **yes** → Add mitigation (e.g., anonymize public note, clarify intent: "This is not a verdict on off-platform conduct").  
    - Proceed to Final Vote.  

  > *Rationale:* Manages digital permanence. Test Cases B and C require mitigations for public spillover.

  #### **FINAL STEP: Vote & Public Note**  
  - **Vote** on the proposed sanction (with downgrades/mitigations). Majority of moderators must agree.  
  - **Public Note Template:**  
    ```  
    1. Summary: "We reviewed [generic offense description]."  
    2. Decision: "[Sanction] or no action."  
    3. Reasoning: "Based on [goal from 4.1]. Evidence was [sufficient/insufficient]. We considered [ratchet risk/sanction budget].  
    4. Audience: "This is directed at [audience], not a broader judgment."  
    5. Dissent (optional): "Some moderators argued [alternative view]."  
    ```  

  ---

  ### **Test Case Applications & Unpopular Outcomes**  
  Ran the procedure on your three cases. **Case C (external sanction demand)** produces the "unpopular" outcome your team will hate, where you publicly decline to act despite community pressure.  

  #### **Case A: Popular Member’s Rudeness (Newcomer Left)**  
  - **Step 1:** Harm? **Yes** (driving members away). On-platform? **Yes** → Proceed.  
  - **Step 2:** Generic: "Member repeatedly dismissed a newcomer." Sanction a median member? **Yes** → Proceed.  
  - **Step 3:** Evidence? **Yes** (e.g., public posts). Accused responded? **Assume yes** → Proceed.  
  - **Step 4:** Goal? **Restoration** (repair culture). Minimum sanction? **Private apology request + mediation offer.** Sanction budget? **Low risk** → No downgrade.  
  - **Step 5:** Reversible? **Yes** (private). Audience? **Offender + affected parties.** Spillover? **Low** → No mitigation.  
  - **Outcome:** **Private restoration-focused sanction.** Unpopular aspect: Team might want a public rebuke, but procedure forces privacy to avoid ratchet effect.  
  - **Public Note Defense:** *"We confirmed dismissive behavior harmed community trust. Our goal is repair, not punishment, so we facilitated a private resolution. Public sanctions would risk disproportionate harm."*  

  #### **Case B: Off-Platform Allegation (Unverifiable, Real Name)**  
  - **Step 1:** Harm? **Unclear** (off-platform). On-platform? **Likely no spillover** → **Stop. No sanction.**  
    - *If spillover argued (e.g., "members feel unsafe"):* Proceed to Step 2.  
  - **Step 2:** Generic: "Member accused of past harmful conduct." Sanction median member? **No** (off-platform, unverified) → **Stop. No sanction.**  
  - **Outcome:** **No action.** Unpopular aspect: Team might believe the allegation but can't act.  
  - **Public Note Defense:** *"We take allegations seriously, but this involved off-platform conduct we couldn't verify. Sanctioning without evidence risks unjust harm, especially given real-name identification. We encourage affected parties to seek external resources."*  

  #### **Case C: Demand to Pile On (External Sanction)**  
  - **Step 1:** Harm? **No** (external conduct, no on-platform impact) → **Stop. No sanction.**  
    - *If same conduct occurred on-platform:* Treat as new violation (proceed to Step 2).  
  - **Outcome:** **No action.** **This is the unpopular outcome**—your team must publicly decline to endorse another community's sanction.  
  - **Public Note Defense:** *"We reviewed [conduct]. While other communities may act as they see fit, we only sanction based on harm within our space. Piling on risks excessive punishment ('no sanction budget') and misrepresents our role. We remain focused on our community's health."*  

  ---

  ### **What the Procedure Can't Do (Systematic Limitations)**  
  1. **Truth-Finding:** It can't resolve "he said/she said" disputes without evidence. Cases relying on unshareable proof (e.g., private DMs) will misfire, favoring inaction (e.g., Test Case B).  
  2. **Bias Elimination:** The abstraction test reduces bias but can't erase implicit preferences (e.g., "median member" is still subjective). Human votes reintroduce values.  
  3. **Restoration:** If parties refuse mediation (Test Case A), restoration fails, leaving only punitive options.  
  4. **Spillover Control:** Mitigations (anonymization) help but can't prevent determined archiving/doxxing.  
  5. **Values Questions Relocated, Not Solved:**  
     - "What is harm?" is decided in Step 1 (human vote).  
     - "Do we owe fairness?" is set in Step 0 (club vs. infrastructure).  
     - "When is punishment deserved?" is handled in Step 4 (proportionality vote).  

  ---

  ### **Implementation Tips**  
  - **Pre-Meeting Prep:** Assign one mod to anonymize the case (Step 2) before discussion.  
  - **Time Savings:** Skip steps when Stopping Rules trigger (e.g., 50% of cases end at Step 1).  
  - **Public Trust:** Always publish notes—even for "no sanction" outcomes—to demonstrate consistency.  
  - **Review:** Every 6 months, audit decisions for adherence to the procedure.  

  This system prioritizes efficiency, consistency, and your constraints. It forces tough choices (like not piling on in Case C), but the public reasoning makes defensible.
