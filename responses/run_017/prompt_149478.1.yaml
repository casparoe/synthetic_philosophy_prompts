prompt: |-
  I help write the rules for a couple of volunteer organisations and moderate a forum, and I keep running into the same shape of problem, and I cant find out whether it has a name.

  Two instances. Our bylaws say the section on membership fees can only be changed by a two-thirds vote. Last year a simple majority passed a motion saying that any section can be changed by a simple majority. So now either the fee section got unprotected by a procedure it explicitly forbids, or that new motion partly failed to do what it said. Either way nobody voted on the fee section, but it's suddenly far easier to change.

  Second instance: a rule says motions about money need two weeks' notice. Someone amends the definitions section so that "money" no longer covers honoraria. The notice rule was never touched, nobody voted on it, and it now governs much less than it did.

  So the pattern I mean: changing what a rule actually does by changing some *other* rule it leans on — its own amendment procedure, or the definition of its own words — rather than by changing the rule itself. Does legal theory, or the theory of rules generally, have a term for this? It isn't quite entrenchment, since the protection here is itself amendable, and it isn't quite implied repeal, since everybody agrees the rule itself is still there untouched. If there's no established term, coin one and define it, and give me the boundary cases: is redefining a word really the same move as altering an amendment procedure, and does the case where the second rule changes nothing yet anyway count? I want the carving, not just a label.
reasoning: |-
  Okay, the user is dealing with a recurring problem in rule systems where changing one rule indirectly affects another without directly amending it. They provided two examples: one where a supermajority requirement was bypassed by changing the amendment process, and another where redefining a term limited a rule's scope. They want to know if there's a term for this in legal theory or rule systems, or if they should coin one. They also want boundary cases analyzed.

  First, I recall that in legal systems, this is similar to hierarchy issues, like constitutional amendments. In their first example, the membership fee section required a two-thirds vote. But a simple majority passed a motion allowing any section to be changed by simple majority. Now, the fee section's protection is undermined without a direct vote. This feels like a meta-rule change affecting lower-level rules.

  The second example involves changing a definition. The rule about money needing two weeks' notice was circumvented by redefining "money" to exclude honoraria. So the rule still exists but applies less broadly. This is about semantic shifts altering application without touching the rule text.

  I need to figure out if there's an existing term. Implied repeal isn't right because the original rule isn't repealed. Entrenchment refers to protections, but here it's about bypassing them. Maybe "procedural circumvention" or "definitional drift"? But I should check legal concepts. In constitutional law, "structural amendments" or "procedural entrenchment" might be relevant, but those aren't standard terms.

  Hierarchical inconsistency comes to mind. When a higher-order rule (like amendment procedures) conflicts with a specific rule's entrenched clause. The user mentioned entrenchment but noted it's amendable, so it's not absolute. The key is the indirect amendment via dependency alteration.

  Boundary cases: What if the changed rule (like the definition) hasn't been applied yet? Does it still count? Probably, because the potential is there. Also, is changing an amendment procedure the same as redefining a term? Both exploit dependencies, but one is procedural, the other semantic. The core mechanism is altering a dependency to change the rule's effect without direct amendment.

  The user needs a precise term and definition. Since no existing term fits perfectly, coining one makes sense. "Rule dependency exploitation" or "indirect rule alteration" could work. Emphasizing the dependency aspect is crucial. For boundary cases, if the dependency change has no immediate effect, it's still the same mechanism, just dormant. Procedural vs. semantic changes are subtypes under altering dependencies.

  The user's deeper need might be to prevent such loopholes in their organizations' rules. Providing terminology helps them articulate the problem and draft clearer bylaws, perhaps adding clauses that dependencies can't be altered to circumvent specific protections. They might also want validation that this is a recognized issue, which the answer should address by linking to similar legal concepts.
answer: |-
  This is a brilliantly articulated observation of a fundamental problem in rule-system design: **the vulnerability of rules to indirect amendment through modification of their dependencies.** While no single universally-agreed term exists across all domains, several concepts from legal theory, logic, and organizational studies converge here. Here's the carving you requested:

  ### The Core Mechanism: Rule Dependency Exploitation
  The essence is that **a rule (Rule A) derives its meaning, scope, or application force not only from its own text, but also from other rules or definitions (Rule B, Definition C) upon which it implicitly or explicitly depends.** Changing Rule B or Definition C *indirectly* alters the practical effect of Rule A, without formally amending Rule A itself. This exploits the *dependency* of Rule A.

  ### Proposed Term: **Rule Dependency Exploitation (RDE)**
  *   **Definition:** The act or effect of altering the practical application, scope, or force of a rule (Rule A) by amending or reinterpreting a different rule, definition, or procedural mechanism (Rule B) upon which Rule A logically or operationally depends, thereby circumventing the formal amendment process or protective mechanisms intended for Rule A.
  *   **Key Elements:**
      1.  **Dependency:** Rule A relies on Rule B/Definition C for its meaning, applicability, or enforcement mechanism.
      2.  **Indirect Amendment:** Rule B/Definition C is changed *instead of* Rule A.
      3.  **Altered Effect:** The change to Rule B/Definition C fundamentally changes how Rule A functions or what it governs.
      4.  **Circumvention:** The change achieves a result regarding Rule A that would have been harder, procedurally different, or impossible to achieve by amending Rule A directly (e.g., bypassing a supermajority, avoiding a notice period).

  ### Applying RDE to Your Cases
  1.  **Amendment Procedure Change:** The Membership Fee Rule (Rule A) depended on the *amendment procedure rule* (Rule B - requiring 2/3) for its protection. Changing Rule B (to simple majority) *exploited* this dependency, indirectly stripping Rule A of its protection without ever putting Rule A itself up for a vote under its own stricter standard. This is **Procedural RDE**.
  2.  **Definitional Change:** The Money Notice Rule (Rule A) depended on the *definition of "money"* (Definition C) for its scope. Changing Definition C (to exclude honoraria) *exploited* this dependency, indirectly narrowing the scope of Rule A without amending its text or triggering its notice requirement for the change itself. This is **Semantic RDE**.

  ### Boundary Cases and Carving
  1.  **Are Procedural and Semantic RDE the *Same* Move?**
      *   **Mechanism:** Yes, fundamentally. Both exploit a dependency (procedure on Rule B, meaning on Definition C) to alter Rule A's effect indirectly.
      *   **Intent/Effect:** Often similar (circumventing a protective aspect of Rule A).
      *   **Visibility/Complexity:** Semantic RDE can be subtler. Changing a definition buried in a glossary might attract less scrutiny than changing a prominent amendment procedure. Procedural RDE often directly attacks the hierarchy of rules.
      *   **Conclusion:** They are distinct *subtypes* (Procedural RDE vs. Semantic RDE) under the broader umbrella of Rule Dependency Exploitation, sharing the core mechanism.

  2.  **Does Changing a Rule that *Currently* Doesn't Affect Rule A Count as RDE? (The "Null Effect" Boundary)**
      *   **Scenario:** Rule B is changed, but *at the time of change*, Rule A either isn't in force or Rule B's change doesn't currently alter any application of Rule A (e.g., no honoraria are currently being proposed).
      *   **Analysis:** This is **still RDE**. The *potential* for Rule A's effect to be altered by the change to Rule B is inherent in the dependency. The exploitation lies in creating the *condition* for future circumvention. The change to Rule B fundamentally alters the *operating environment* for Rule A, even if no immediate application occurs. The vulnerability is created.

  3.  **Is Changing a Rule that *Strengthens* Rule A RDE?**
      *   **Scenario:** Suppose the definition of "money" was *broadened*, causing Rule A (notice requirement) to apply to *more* things without amending Rule A.
      *   **Analysis:** This **is still RDE** under the definition (it alters Rule A's scope via dependency change). However, the *connotation* of "exploitation" (implying circumvention of protection) might not fit well if the change *enhances* Rule A's protective intent. This highlights that RDE is a *mechanism* that can be used for different purposes (undermining *or* strengthening). The core dependency exploitation mechanism is identical. Intent distinguishes "beneficial" vs. "circumventing" applications of the mechanism.

  4.  **Relationship to Established Concepts:**
      *   **Not Implied Repeal:** Implied repeal deals with conflicting rules of *equal* stature. RDE involves changing a *supporting* rule/definition, not creating a direct conflict.
      *   **Beyond Simple Entrenchment:** Entrenchment is about making rules harder to change. RDE is the specific *method* used to *circumvent* entrenchment (or other protections) by attacking dependencies. Procedural RDE is essentially how entrenchment clauses themselves are vulnerable.
      *   **Meta-Rules & Rule Hierarchies:** This problem highlights the critical role of "rules about rules" (meta-rules) and hierarchies (e.g., constitution > bylaws > motions). RDE often involves changing a higher-level or more general rule to affect a lower-level or more specific one. Legal theory recognizes this hierarchy vulnerability (e.g., amending a constitution to bypass entrenched rights).
      *   **Interpretive Drift:** Semantic RDE is a deliberate, rule-change-induced form of interpretive drift, where the meaning of a term shifts through formal amendment of definitions rather than gradual reinterpretation.

  ### Why This Pattern Matters and Mitigation
  RDE is a powerful loophole because it allows significant changes to the *effect* of core rules while potentially avoiding the scrutiny, debate, or voting thresholds designed to protect them. It exploits the interconnectedness of rule systems.

  **Mitigation Strategies for Your Organizations:**
  1.  **Explicit Dependencies:** State key dependencies within the rule itself. E.g., "This section can only be amended by a 2/3 vote, *notwithstanding any other provision of these bylaws*." Or "The term 'money' includes honoraria, stipends, and any form of compensation, *as defined herein and not subject to amendment for the purpose of circumventing this notice requirement*." (Be cautious with wording to avoid unintended rigidity).
  2.  **Hierarchy Clarity:** Establish a clear hierarchy of rules (e.g., Charter > Bylaws > Policies > Motions) with explicit statements about which level can amend what, and how lower levels cannot override higher levels on specific matters.
  3.  **Entrench Key Definitions/Procedures:** Consider entrenching the amendment clause itself (e.g., "This Article governing Amendments requires a 3/4 vote for amendment") and critical definitions ("The definition of 'Money' in Article X requires a 2/3 vote to amend").
  4.  **"Notwithstanding" Clauses:** Use these clauses in high-priority rules to state they override other potentially conflicting rules or definitions.
  5.  **Intentional Drafting:** Be mindful of dependencies when drafting. Ask: "What other rules/definitions does *this* rule rely on? How could changing *those* undermine this rule's intent?"

  **In essence, Rule Dependency Exploitation (RDE)** names the maneuver you've identified: changing the ground beneath a rule's feet to alter where it stands, without moving the rule itself. Understanding this mechanism is crucial for drafting robust, loophole-resistant governing documents and forum rules.
