prompt: |-
  I am finishing the methods chapter of my dissertation in political science, on what can legitimately be inferred from a single well-documented historical episode, and I have reached the point where a survey of positions is no longer useful to me. What I need is a specification.

  Fix the object and the purpose, because I take adequacy to be relative to a purpose. The object is a retrospective case explanation: an account, produced after the fact by someone who already knows how the episode ended, of why outcome O occurred in case C. The purpose is prospective. I want such explanations to be usable as one input to reasoning about a live analogue L that has not yet resolved — say, whether a governing coalition under sustained fiscal strain will hold together over the next two years. So the question is not what makes a historical account illuminating or well written; it is what a theory of retrospective case explanation would have to deliver for its outputs to be licensed as evidence about an unresolved case, given that the producer of the account cannot un-know the ending, and given the documented tendencies of hindsight reconstruction and of narrative shaping that the methodology literature on this topic concerns itself with.

  Below is my own draft list of candidate requirements, which I expect to be partly confused. Each has a gloss; I want you to repair, extend, and triage them rather than to ratify them.

  1. Outcome-blind evidential weighting, tested by an erasure procedure: delete from the write-up every sentence that states or presupposes O, or its timing, and ask whether the surviving evidence still supports the stated causal ranking.
  2. Live-alternative bookkeeping: at each juncture the account must name what else was still possible at the time, and must sort junctures into the unforeseeable, the foreseeable but unheeded, and the foreseen and nearly averted.
  3. Base-rate anchoring: confidence must be calibrated to how often comparable initial conditions produced O, with the reference class fixed as it was at the time, not reconstructed from the class of cases in which O in fact occurred.
  4. Conjunctive bookkeeping: where the account needs several steps all to break the same way, the compounding must be displayed rather than disguised by narrative flow as a single tendency.
  5. A negative-control or swap test: run the same explanatory procedure on contemporaneous cases where O did not occur; if it returns equally tight accounts, it has no discriminating power, and the theory must say what follows — refusal to explain, downgraded confidence, something else.
  6. Documentary-shadow correction: the surviving archive is itself partly an effect of O, since records are kept, memoirs written, and inquiries convened because the episode turned out to matter, so the evidence base is outcome-selected and not merely neutrally incomplete.
  7. Grain stability: the causal claim should survive redescription at coarser and finer grain, from individual deliberation to structural pressure, and if it holds at only one grain that must be declared.
  8. A reverse-narration test: if the account reads as naturally backwards from O as forwards from the initial conditions, treat that as evidence of rationalization rather than of causal asymmetry.
  9. Symmetric treatment of non-events: the theory must be able to explain why O did not occur in the years before it did, and to handle absences as explananda, not only presences.
  10. A stated failure condition: the account must say in advance what findings would have led its author to withdraw or downgrade it, on pain of being able to accommodate any archive whatsoever.
  11. A transport license: the deliverable must identify which features of C are load-bearing for transfer to L, and must say how far and under what changes the license extends, since my purpose is exactly transfer.
  12. An anti-deflation constraint: the output must remain a causally unified account of a particular episode — an explanation — and may not discharge its obligations by returning an unordered weighted list of factors.

  What I want from you:

  First, restate the desiderata properly, each with the case or consideration that motivates it, in the form of requirements on a theory rather than instructions to a historian. Say explicitly which of my twelve are genuine desiderata for the purpose I have fixed, which are prejudices of one methodological camp dressed up as requirements, which are really the same requirement counted twice, and what is missing. I am particularly unsure whether the anti-deflation constraint is a desideratum or a professional preference, and whether the reverse-narration test earns its place or merely restates the erasure procedure.

  Second, mark each requirement as non-negotiable for the stated purpose or as negotiable, and say what would have to change about the purpose for the negotiable ones to become binding.

  Third, and this is the part I care most about: identify which subsets of the requirements cannot be jointly satisfied. I suspect a real tradeoff between narrative unification and calibrated conjunctive contingency, and another between correcting for the documentary shadow and keeping evidential weights independent of O, since diagnosing the selection seems to require the very knowledge one is trying to neutralise. If the full list is unsatisfiable, say so and treat that as the result, and then tell me the strongest weaker purpose the truncated list will support — that is, what I should retreat to, and what I should stop claiming in the chapter.

  Fourth, name the single requirement that does the most work in excluding otherwise attractive theories, and justify the choice.

  Finally, a compressed scorecard, no more than about 150 words, rating four families of approach against the list: covering-law and statistical-relevance accounts, mechanism or process-tracing accounts, counterfactual difference-making accounts, and narrativist accounts that treat the shape of the story itself as the explanation. Keep the argumentative weight on the criteria; the scorecard is for orientation only.

  Anchor each requirement on either my coalition-under-fiscal-strain case or on a real episode you are confident any reader of the chapter will recognise, and say which you have used. Please do not supply references or reading lists; I have that part covered, and I want the specification itself.
reasoning: |-
  Hmm, the user is working on a dissertation in political science about inferring from historical cases to unresolved analogues. They've shared their own list of 12 requirements for retrospective case explanations and want me to improve them. This is quite complex with several specific requests.

  First, I need to understand their core concern: they want retrospective case explanations to be usable prospectively for unresolved cases. Their list includes things like outcome-blind weighting, live-alternative bookkeeping, base-rate anchoring, etc. Some seem redundant or overlapping. For example, requirement 1 (erasure procedure) and 8 (reverse-narration test) might both address hindsight bias but in different ways.

  Looking at their requirements, I notice that several are motivated by fundamental challenges in historical inference. The documentary-shadow correction (6) deals with how outcomes affect what evidence survives, which is crucial but hard to handle without circularity. The conjunctive bookkeeping (4) addresses the compounding of contingencies, which narrative accounts often smooth over.

  The anti-deflation constraint (12) seems important for their purpose - they want an actual explanation, not just a list of factors. But it might conflict with requirements like conjunctive bookkeeping that emphasize contingency. There might be trade-offs here.

  For their unresolved coalition-under-fiscal-strain case, the transport license (11) is vital because they need to know which elements transfer. But anchoring on base rates (3) might be difficult since historical coalitions vary widely.

  I should reorganize these requirements, identify which are non-negotiable for prospective use, and highlight tensions. The documentary-shadow correction and outcome-blind weighting seem particularly hard to reconcile. I'll also need to evaluate how different methodological approaches fare against these requirements in a concise scorecard.

  The user seems deeply engaged with methodological tensions and wants clarity about what's possible. They're not looking for literature but for a rigorous specification to structure their argument. I'll focus on making the requirements precise and exposing the trade-offs frankly.
answer: |-
  Here is a specification structured to meet your requirements, anchored in your coalition-under-fiscal-strain case (C) and the purpose of prospective inference to an unresolved analogue (L). Requirements are restated as necessary conditions for a theory of retrospective case explanation (RCE) to license transfer.

  **Restated, Motivated, & Triaged Desiderata:**

  1.  **Outcome-Independent Evidence Valuation (OIEV):** *Requirement:* The theory must ensure the evidential weight assigned to pre-outcome traces is demonstrably independent of knowledge of O. *Motivation:* Prevents hindsight bias where knowledge of O inflates the significance of evidence leading to it while diminishing contradictory traces (e.g., overstating early signs of coalition fracture while downplaying stabilizing factors). *Triage:* Genuine & core. (Distinct from Reverse-Narration).

  2.  **Live Alternatives Specification (LAS):** *Requirement:* The theory must require the RCE to explicitly identify the plausible alternative outcomes perceived as live possibilities by actors *at each critical juncture* prior to O's occurrence. *Motivation:* Forces acknowledgment of contingency and guards against deterministic narratives, vital for assessing risk in L (e.g., Was dissolution truly imminent at point X, or were other outcomes plausible?).

  3.  **Reference Class Integrity (RCI):** *Requirement:* The theory must calibrate confidence in the RCE using base rates derived from a reference class defined *prior* to the occurrence of O in C. *Motivation:* Counters selection bias where O defines the class of "comparable" cases (e.g., studying only coalitions that *did* collapse under strain, ignoring those that held). *Triage:* Genuine. (Distinct, though related to Negative Control).

  4.  **Conjuncture Transparency (CT):** *Requirement:* The theory must mandate explicit identification and probabilistic assessment (qualitative or quantitative) of each necessary conjunct in a causal sequence leading to O. *Motivation:* Prevents narrative smoothing from obscuring the compounded contingency of multiple necessary steps (e.g., fracture required: (a) leader weakness + (b) external shock + (c) defection trigger – each needing assessment).

  5.  **Discriminatory Power Test (DPT):** *Requirement:* The theory must include a procedure to apply the same explanatory logic to contemporaneous cases where O did *not* occur; failure to discriminate requires explicit downgrading of explanatory confidence or scope. *Motivation:* Ensures the explanation isn't just a good story that fits any outcome (e.g., applying the "fiscal strain + weak leadership" explanation to a strained coalition that *didn't* collapse). *Triage:* Genuine & core.

  6.  **Evidence Selection Bias Correction (ESBC):** *Requirement:* The theory must incorporate a method to identify and mitigate bias in the surviving evidence trace resulting from O itself (e.g., disproportionate records from winners, post-hoc inquiries framing events). *Motivation:* The archive is not a neutral snapshot; it's shaped by O (e.g., post-collapse memoirs blame fiscal strain, pre-collapse documents may show other priorities). *Triage:* Genuine & critical. (Creates tension with OIEV).

  7.  **Causal Grain Consistency (CGC):** *Requirement:* The theory must ensure causal claims remain stable or explicitly shift when the explanandum is redescribed at different levels of analysis (e.g., individual choice vs. institutional constraint). *Motivation:* Prevents level-of-analysis fallacies during transfer to L (e.g., was collapse due to PM's indecision [individual] or electoral system fragility [structural]?).

  8.  **Reverse-Narration Invariance Test (RNIT):** *Requirement:* The theory must treat ease of constructing a plausible narrative *from O backwards* to antecedents as evidence *against* strong causal asymmetry claims, indicating potential rationalization. *Motivation:* Flags post-hoc path dependency narratives that mistake outcome inevitability for causal strength (e.g., "of course austerity caused collapse" reads well backwards). *Triage:* Genuine. (Distinct from OIEV; OIEV focuses on evidence weighting, RNIT on narrative construction).

  9.  **Non-Event Explanatory Capacity (NEEC):** *Requirement:* The theory must enable explanations for why O did *not* occur earlier in C or in similar antecedent cases. *Motivation:* Ensures the explanation isn't tailored solely to the occurrence of O and can handle stability as well as change (e.g., Why didn't the coalition collapse during the *previous* budget crisis?).

  10. **Falsifiability Specification (FS):** *Requirement:* The RCE must explicitly state empirical conditions under which the core explanation would be weakened or abandoned. *Motivation:* Prevents unfalsifiable "just-so" stories that can absorb any evidence (e.g., "If coalition partners publicly reaffirmed commitment *after* the critical meeting, then the explanation fails").

  11. **Transferable Component Identification (TCI):** *Requirement:* The theory must require the RCE to explicitly identify which aspects of the causal structure in C are deemed essential ("load-bearing") for the explanation and specify the conditions under which these components are transferable to L. *Motivation:* Directly enables prospective use by clarifying *what* and *how* to transfer (e.g., Is the specific *type* of fiscal strain, or the *mechanism* of intra-coalition bargaining failure, the key element? Under what institutional similarities does it hold?).

  12. **Explanatory Unity Constraint (EUC):** *Requirement:* The theory must deliver a causally coherent account explaining *why O occurred in C* as an integrated sequence/process, not merely a list of contributing factors. *Motivation:* A list lacks the causal structure necessary for prospective reasoning about dynamics in L; transfer requires understanding *how* factors interacted to produce O. *Triage:* Genuine & non-negotiable for the purpose. (It's not mere preference; an unordered list fails to provide the causal mechanism/structure needed for prospective inference about a *process* in L).

  **Negotiability Assessment:**
  *   **Non-Negotiable (Core to Prospective Transfer):** OIEV (1), LAS (2), DPT (5), TCI (11), EUC (12). *Rationale:* Without these, the RCE is either biased (1,5), ignores contingency vital for prediction (2), or provides no usable structure for transfer (11,12).
  *   **Negotiable (Highly Desirable, But Partial Fulfillment Might Suffice with Caveats):** RCI (3), CT (4), ESBC (6), CGC (7), RNIT (8), NEEC (9), FS (10). *Rationale:* While critical for robustness and reducing bias, weaker forms might still permit cautious transfer. ESBC (6) is particularly hard; partial mitigation might be the best possible. *To Bind:* If the purpose shifted to precise probability assessment (3,4), absolute causal certainty (7,8), or explaining stability regimes (9), these would become non-negotiable. FS (10) binds only if demanding Popperian falsifiability; a weaker "accountability to evidence" might suffice.

  **Joint Satisfiability & Trade-offs:**
  *   **Primary Tension:** **OIEV (1) vs. ESBC (6).** Diagnosing evidence selection bias *requires* knowing O ("Why were these records kept?"), but OIEV demands evidence valuation *ignore* O. Satisfying both fully is likely impossible. *Resolution:* The theory must explicitly grapple with this tension, perhaps prioritizing ESBC awareness while implementing OIEV procedures as best possible, acknowledging residual uncertainty.
  *   **Secondary Tension:** **EUC (12) vs. CT (4).** A unified narrative risks obscuring conjunctive contingency; highlighting contingency risks a fragmented account. *Resolution:* The theory must require *both* a unified account *and* explicit flagging of critical conjuncts/contingencies within it.
  *   **Tertiary Tension:** **RCI (3) vs. Specificity.** Defining a valid pre-O reference class for complex historical events like coalition stability under strain is often contested or impossible. Strict RCI might yield uninformative base rates. *Resolution:* The theory must require *attempted* RCI, acknowledge limitations, and perhaps use it primarily to dampen overconfidence rather than supply precise probabilities.
  *   **Overall:** The full list is **unsatisfiable perfectly** due to the OIEV/ESBC conflict and practical limits of RCI/NEEC. However, a **workable subset (1,2,5,11,12 + mitigated 4,6,7,10)** supports a **weaker purpose:** Generating causally structured, contingency-sensitive explanations of C that *identify potentially transferable causal mechanisms/components* for *structured analogical reasoning* about L, while explicitly acknowledging known biases (hindsight, selection) and limitations (contingency, reference class issues). **Retreat:** Stop claiming RCE can provide *unbiased, probability-calibrated predictions* for L. Claim it provides *structured causal hypotheses* about L's *possible dynamics*, grounded in a rigorously analyzed case, with inherent limitations clearly stated.

  **Most Exclusionary Requirement:**
  *   **Discriminatory Power Test (DPT - 5).** *Justification:* This requirement most sharply excludes popular and often illuminating approaches. Narrativist accounts often excel at fitting *one* case but fail DPT. Many process-tracing accounts focus on confirming mechanisms within C without testing if they explain non-O cases. Pure counterfactual accounts often lack a systematic DPT procedure. Covering-law accounts struggle to find laws that genuinely discriminate in single cases. A theory passing DPT must have clear criteria for what constitutes a valid negative case and a method for comparison, imposing significant analytical discipline often absent.

  **Compressed Scorecard (Families vs. Requirements):**

  1.  **Covering-Law/Statistical-Relevance:** Struggles with OIEV (laws often defined post-hoc), LAS, CT, ESBC, CGC, RNIT, NEEC, TCI. Excels at FS (in theory) & EUC (if law-like). Fails DPT without population data. Weak RCI.
  2.  **Mechanism/Process-Tracing:** Good at LAS (if done well), CT (mechanisms are conjunctive), CGC (mechanisms span levels), EUC. Mixed on OIEV (risk of selection bias), ESBC (awareness varies), DPT (often case-specific), NEEC, TCI (mechanism scope unclear). RCI & RNIT often weak. FS varies.
  3.  **Counterfactual Difference-Making:** Strong on LAS, CT (explicit contingency), NEEC, FS (testable claims). Mixed on OIEV (baseline choice bias), ESBC, CGC, RNIT (often asymmetric), DPT (depends on scope). Weak on RCI, TCI (focus on differences, not structures), EUC (can be fragmented).
  4.  **Narrativist:** Excels at EUC. Potentially good LAS. Weak on OIEV (shaped by O), RCI, CT (smooths contingency), DPT (single-case focus), ESBC (uncritical of sources), CGC (fixed grain), RNIT (often rationalizes), NEEC, FS (unfalsifiable), TCI (implicit).

  *(Key: Good/Strong = Naturally aligns or can be incorporated. Mixed = Possible with significant effort/modification but not inherent. Weak = Fundamentally opposed or very difficult to satisfy.)*
