prompt: |-
  I convene a working group that drafts consensus guidance for a health-data research consortium. Its members are clinicians, epidemiologists, data scientists, lawyers and two philosophers, and roughly every second meeting deadlocks over an existence question: whether a proposed diagnostic category is a real disease or a construct, whether a deployed risk model makes decisions, whether a data-sharing population is the sort of thing that can have interests. Half the room wants to settle these by stipulating a definition and moving on; the other half thinks the stipulation quietly buries the real disagreement. I have read enough of the philosophical literature on verbal disputes, quantifier variance, conceptual ethics and metalinguistic negotiation to believe there are decent tests for which side is right in a given case, but my facilitators are not philosophers, the room is not patient, and I get ninety minutes per deadlock. So I need something operational.

  Please write a decision procedure my facilitators can run: the steps in order, each phrased as a question that can be asked out loud to non-philosophers, what counts as a sufficient answer at that step, and where the procedure stops with a verdict or hands the question back to the group as a values call rather than a diagnosis. Three verdicts matter to me, not two: MERELY VERBAL (dissolved once the contested expression is disambiguated or regimented), SUBSTANTIVE (a first-order or meta-level disagreement that survives regimentation), and what I will call CONCEPTUAL (the parties are disagreeing about which concept we ought to use, which is a normative dispute and must not be closed by fiat even though it is, in a sense, about language). At the core I want: a regimentation step, in which the contested term is replaced by a freshly coined one with stipulated application conditions, to see whether the disagreement survives; a check for whether either party is using the term to track a distinction it takes the things themselves to make rather than one we project, since my understanding is that agreement on all the first-order facts does not by itself establish that a dispute is merely verbal; a downstream-licensing step, asking what each party takes the existence claim to entitle them to — an explanation, a legal or moral consequence, a line in our guidance — on the ground that if the licenses differ, agreeing on usage does not settle the dispute; and, for disputes that do dissolve, a cost-of-relabeling check, because a settlement that puts the whole burden of re-description on one party's vocabulary is not one the group will honour.

  Then run the procedure on two deadlocks from our last meeting, showing the answer at each step: (A) clinicians and philosophers disagreeing about whether a symptom cluster in the new dataset is a distinct disease entity or an artifact of how we code it; (B) engineers and clinicians disagreeing about whether a deployed risk model makes a decision for which someone must take responsibility. I expect (A) to come out MERELY VERBAL and could live with that. I would be annoyed if (B) came out MERELY VERBAL as well, because our consent and accountability framework is built on there being a decision-maker; if the procedure returns that, I want to see precisely which step produces it and what we would have to give up in order to keep it. Finally, tell me which kinds of deadlock the procedure cannot settle at all, and at which points the facilitator's own judgment is doing the work while appearing not to.
reasoning: |-
  We are designing a decision procedure to resolve deadlocks in a working group. The procedure has three verdicts: MERELY VERBAL, SUBSTANTIVE, and CONCEPTUAL. The steps are designed to be operational and run by non-philosopher facilitators in about 90 minutes per deadlock.

  The steps:

  1. **Regimentation**: Replace the contested term with a newly coined term that has a stipulated definition (based on the group's input) and see if the disagreement persists.
  2. **Check for Projection vs. Tracking**: Determine whether the parties see the distinction as one that the world makes independently (tracking) or as one that we project for our purposes (projection). If both parties agree that the distinction is projected and that they agree on all the non-linguistic facts, then the dispute might be merely verbal. However, if one party insists the distinction is tracked (i.e., it's a real feature of the world), then we must check if they can point to a difference in the world that the other party is missing. If they cannot, then it may be merely verbal. But note: even if they agree it's projected, there might be a normative disagreement about which projection to use (leading to CONCEPTUAL).
  3. **Downstream Licensing**: Ask what each party takes the claim to license (i.e., what practical consequences follow from using the term one way or the other). If the licensing demands differ, then the dispute is not merely verbal because agreeing on the facts and the definition doesn't resolve the practical disagreement.
  4. **Cost of Relabeling**: If the dispute is dissolved (MERELY VERBAL), we must check if the resolution places an undue burden of relabeling on one party. If so, the group must explicitly address this to ensure the resolution is fair and will be honored.

  The verdicts:
  - **MERELY VERBAL**: The disagreement disappears when the term is disambiguated or replaced by a stipulated term, and there is no remaining disagreement about the non-linguistic facts, and the downstream licensing is the same for both parties (or they agree it doesn't matter). Then we can stipulate and move on.
  - **CONCEPTUAL**: The parties agree on all the non-linguistic facts and that the distinction is projected (not tracked), but they disagree about which concept we ought to use (i.e., which projection is better). This is a normative dispute and must be resolved by the group as a values call, not by stipulation.
  - **SUBSTANTIVE**: There is a disagreement about the non-linguistic facts (either first-order or meta-level) that survives the regimentation, or the downstream licensing demands are in conflict and cannot be reconciled by stipulation.

  The procedure steps as questions:

  **Step 1: Regimentation**
  - Question: "Let's set aside the term [contested term] for a moment. Suppose we introduce a new term, '[new term]', which we define as [stipulated definition based on group input]. Now, using this new term, do you still disagree? If so, what is the nature of that disagreement?"
  - What counts as sufficient: The group must agree on a stipulated definition for the new term. If they cannot, then the facilitator must note that the dispute may be about the definition itself and move to Step 2. If they can, then the group is asked if the disagreement persists under the new term.
  - If the disagreement disappears, we move to Step 4 (Cost of Relabeling) and then to MERELY VERBAL verdict (provided Step 3 doesn't show a problem). If not, we proceed to Step 2.

  **Step 2: Projection vs. Tracking**
  - Question: "Regarding the distinction we are trying to capture with [contested term] (or with our new term [new term]), do you think that this distinction is one that exists independently of us and our practices (like the distinction between gold and silver), or is it one that we impose for practical purposes (like the distinction between 'weed' and 'crop')? If you think it's independent, can you point to a feature in the world that the other side is missing that would settle the matter?"
  - What counts as sufficient: Each party must answer whether they see the distinction as tracked or projected. If both agree it is projected, then we have agreement on the non-linguistic facts and the dispute is about how to project. If one party claims it is tracked, they must point to a feature in the world that the other party is missing. If they cannot, then we note that the dispute might be merely verbal (but we must check Step 3). If they can, then we have a substantive disagreement about the world (SUBSTANTIVE) and the procedure stops with that verdict.

  **Step 3: Downstream Licensing**
  - Question: "What practical consequences follow from accepting that [the claim, e.g., 'this is a real disease'] is true? For example, does it require a change in our guidance, in legal responsibility, in research priorities, etc.? And what consequences follow from rejecting it?"
  - What counts as sufficient: Each party must state what they take the claim to license. If the licenses are the same (or both parties agree that the licensing doesn't matter for the current purpose) then we can proceed. If they are different and the disagreement about licensing remains even after regimentation, then the dispute is not merely verbal. It might be SUBSTANTIVE (if the licensing disagreement is about a matter of fact) or CONCEPTUAL (if the licensing disagreement is about what we ought to do with the concept).

  **Step 4: Cost of Relabeling (only if the dispute is dissolved in Step 1 and Step 3 shows no licensing conflict)**
  - Question: "If we adopt the new term and its definition, which party (or parties) will have to change their vocabulary or practices? Is that cost acceptable to the group, or do we need to adjust the definition to share the burden?"
  - What counts as sufficient: The group must agree on the cost and whether it is acceptable. If the cost is too high and the group cannot agree on a fair adjustment, then the facilitator may need to note that the resolution is unstable and the group must revisit. Otherwise, the verdict is MERELY VERBAL and the group moves on.

  **Verdict Assignment**:
  - After Step 1, if the disagreement disappears and Step 2 shows that both parties agree the distinction is projected and Step 3 shows no licensing conflict, then we have MERELY VERBAL (and then we do Step 4 to ensure fairness).
  - If in Step 2 one party points to a missing feature and the other party doesn't see it, then we have SUBSTANTIVE.
  - If in Step 3 the licensing demands are different and the disagreement is about what we ought to license (i.e., what normative consequences should follow) and the group agrees on the non-linguistic facts, then we have CONCEPTUAL.
  - If in Step 3 the licensing demands are different because the parties disagree about the non-linguistic facts (e.g., one party thinks that if we call it a disease then it will lead to certain treatments that are effective, and the other disagrees about the effectiveness), then we have SUBSTANTIVE.

  Now, we run the procedure on the two deadlocks:

  **Deadlock A: Whether a symptom cluster is a distinct disease entity or an artifact of coding.**

  Step 1: Regimentation
  - Facilitator: "Let's set aside the term 'disease' for a moment. Let's introduce the term 'X' to refer to the symptom cluster as it is coded in our dataset with the following characteristics: [describe the cluster and coding]. Now, do we still disagree? For example, do you still disagree about whether X is a distinct disease entity?"
  - Clinicians: "Yes, we still think X is not a real disease because it's just an artifact of how we code."
  - Philosophers: "But we think that in the context of our data, X is a distinct entity that we can study and that has predictive power, so it is real for our purposes."
  - Note: The disagreement persists. They are now disagreeing about whether X (the coded cluster) is a distinct disease entity.

  Step 2: Projection vs. Tracking
  - Facilitator: "Regarding the distinction between a 'real disease' and an 'artifact', do you think this distinction is independent of us (like gold vs. silver) or imposed by us (like weed vs. crop)?"
  - Clinicians: "We think there is a real distinction: a real disease has a unifying underlying pathology that we haven't found for X. Without that, it's just an artifact."
  - Philosophers: "We think that in medicine, diseases are often defined by their symptom clusters and their predictive value. The underlying pathology might be discovered later. So the distinction is projected for our purposes."
  - Facilitator to clinicians: "Can you point to a feature in the world (e.g., a specific pathology) that, if found, would make you agree that X is a real disease, and if absent, would make the philosophers agree it's not?"
  - Clinicians: "Yes, if we find a common biological mechanism for the symptoms, then it's a disease. Without it, it's not. But we haven't found one for X."
  - Philosophers: "But we don't require that for our purposes. We are using the term for research and prediction."
  - Note: The clinicians are pointing to a missing feature (a biological mechanism). However, the philosophers are not requiring that feature. The disagreement now is about what counts as a disease.

  Step 3: Downstream Licensing
  - Facilitator: "What consequences follow if we call X a 'disease'? And if we don't?"
  - Clinicians: "If we call it a disease, it might lead to overdiagnosis, unnecessary treatment, and misallocation of research funds. It might also mislead patients."
  - Philosophers: "If we don't call it a disease, we might miss an opportunity to study a pattern that affects patient outcomes. We want to include it in our research as a distinct entity so we can develop interventions."
  - Note: The licensing demands are different. The clinicians are concerned about clinical and resource implications, while the philosophers are concerned about research opportunities.

  Analysis: The disagreement is not merely verbal because the downstream licensing differs. The group must decide what they want the concept of 'disease' to do for them. This is a normative dispute about which concept to use.

  Verdict: CONCEPTUAL. The group must decide, as a values call, whether in the context of the consortium they want to use a concept of disease that is more biologically grounded (like the clinicians) or one that is more predictive and data-driven (like the philosophers). The facilitator would note that the dispute is about which concept we ought to use, not about the facts of the symptom cluster.

  However, note that the initial disagreement was about whether the cluster is a distinct disease entity. The procedure has shown that the dispute is not merely verbal and that the group must make a decision about the concept they wish to adopt.

  But wait: we might have expected MERELY VERBAL. Why didn't we get that? Because the downstream licensing step revealed a conflict. The group could, in principle, stipulate two different terms: one for biologically grounded diseases and one for predictive clusters. Then they might avoid the word "disease" for the latter. However, the philosophers want the cluster to be treated as a distinct entity in research, and that requires the same level of attention as a disease. The clinicians worry about the implications of that. So the normative disagreement remains.

  Alternatively, the facilitator might go back and try to split the term: 
  - Let's use "disease" only for conditions with known biological pathology and "syndrome" or "predictive cluster" for the coded cluster. 
  Then ask: 
  - Clinicians: Are you okay with the cluster being called a "predictive cluster" and getting the same research attention? 
  - Philosophers: Are you okay with not calling it a "disease" but still having it as a distinct research entity? 

  If both agree, then the dispute was MERELY VERBAL. The problem was the word "disease". But the licensing step revealed that the philosophers want more than just a label; they want the same status as a disease in research. If the group can agree to give the cluster the same research status without the label, then the dispute dissolves. Otherwise, it remains CONCEPTUAL.

  In this case, let us assume that the group can agree to call it a "syndrome" and treat it as a distinct research entity. Then:

  Step 1 (again, with two terms): 
  - We define two terms: 
    - "Disease" requires a known biological pathology.
    - "Syndrome" is a symptom cluster that is predictive and worthy of research attention.
  - Then the symptom cluster is not a disease but is a syndrome.
  - Do both parties agree? 
    - Clinicians: Yes, because they don't want it called a disease without the pathology, but they are okay with research on syndromes.
    - Philosophers: Yes, as long as the syndrome gets the same research attention.

  Then downstream licensing:
  - Calling it a syndrome: It gets research attention but without the clinical implications of a disease (like immediate treatment). The group can agree to frame it that way in the guidance.

  Then the verdict becomes MERELY VERBAL (with the cost of relabeling). The group would then check the cost: everyone has to use the new term "syndrome" for this cluster. The clinicians are happy because it's not called a disease. The philosophers are happy because it gets the research status. So the cost is acceptable.

  Therefore, for Deadlock A, the procedure would lead to a MERELY VERBAL verdict after the facilitator helps the group to split the concept and agree on the licensing.

  But note: the initial run of the procedure revealed a licensing conflict. The facilitator had to go beyond the initial regimentation to propose a solution. This is acceptable because the procedure is meant to be flexible.

  **Deadlock B: Whether a deployed risk model makes a decision for which someone must take responsibility.**

  Step 1: Regimentation
  - Facilitator: "Let's set aside the term 'decision' for a moment. We introduce the term 'Y' for the output of the risk model: when the model outputs a risk score above a threshold, that triggers an alert that leads to a specific action (e.g., flagging the patient for further testing). Now, do we still disagree about whether Y is a decision for which someone must take responsibility?"
  - Engineers: "We don't think Y is a decision. It's just a calculation. The real decision is made by the clinician who acts on the alert."
  - Clinicians: "But the alert directly leads to a standard procedure. The clinician is just following the protocol. So the model is making the decision."
  - Disagreement persists.

  Step 2: Projection vs. Tracking
  - Facilitator: "Is the distinction between a 'decision' and a 'calculation' one that exists independently (like the distinction between a rock and a tree) or one that we project for our purposes (like the distinction between a 'tool' and a 'toy')?"
  - Engineers: "We think it's independent: a decision requires an agent with intentions. The model has no intentions, so it's not making a decision. It's just a tool."
  - Clinicians: "We think the model is making a decision because it is determining the outcome: the patient gets flagged or not. The clinician is just rubber-stamping. The distinction is projected, but in this context, we must call it a decision to ensure accountability."
  - Facilitator to engineers: "Can you point to a feature in the world that the clinicians are missing? For example, the lack of intentionality in the model?"
  - Engineers: "Exactly: the model doesn't have beliefs, desires, or intentions. It's just an algorithm. That's a fact about the world."
  - Clinicians: "But we don't require intentionality for a decision in this context. We care about the outcome and who controls it."

  Step 3: Downstream Licensing
  - Facilitator: "What consequences follow if we say the model makes a decision? And if we say it doesn't?"
  - Clinicians: "If the model makes a decision, then the responsibility for that decision must be assigned to someone: the model developers, the hospital, or the regulatory body. We need to have accountability for harm caused by the model's output."
  - Engineers: "If we say the model makes a decision, then we are implying it is an agent, which it is not. The responsibility lies with the clinician who uses the tool. If we assign responsibility to the model, we risk absolving the clinician and the hospital of their responsibilities."
  - Note: The licensing demands are very different. The clinicians want to assign responsibility to the model's output, while the engineers want to keep responsibility with the human users.

  Analysis: The disagreement is not merely verbal because the downstream licensing is in conflict. The parties disagree about where responsibility lies. Even if we stipulate a definition for "decision", the underlying issue about responsibility remains.

  But note: the group's consent and accountability framework requires a decision-maker. The clinicians are trying to fit the model into that framework. The engineers are resisting because they think it misassigns responsibility.

  This dispute is about more than the word "decision". It's about the concept of responsibility in the context of AI. The group must decide what it means for a decision to be made and who is responsible.

  Verdict: CONCEPTUAL. The dispute is about which concept of 'decision' we ought to use in this context. The group must make a normative decision: should we extend the concept of decision to include algorithmic outputs that directly trigger actions in a protocol? This is a values call.

  Alternatively, the group might avoid the word "decision" and directly address responsibility. They might ask: "Regardless of whether we call it a decision, who should be held responsible for the outcomes of the model's output?" Then they might assign responsibility without using the contested term. But that is a separate discussion.

  The facilitator might try to reframe:

  - Let's not use the word "decision". Instead, let's stipulate:
    - The model produces an output that triggers an action.
    - We need to assign responsibility for the outcomes of that action.

  Then ask:
  - Who should be responsible? The model developer? The clinician? The hospital? The regulatory body?

  Then the group can have a substantive discussion about responsibility without the word "decision". But note: the original deadlock was about whether the model makes a decision. The procedure has shown that the dispute is not merely verbal because the word "decision" carries with it implications for responsibility. Therefore, the verdict remains CONCEPTUAL because the group must decide on the concept of decision that they want to use in their guidance, which is tied to their accountability framework.

  However, if the group can agree on a responsibility assignment without agreeing on the word "decision", then the dispute about the word might be MERELY VERBAL. But the engineers and clinicians are attaching different consequences to the word. Therefore, the group must either:

  - Stipulate a technical definition of "decision" for their guidance that does not carry the usual responsibility implications (but then the clinicians might object because they want the responsibility implication), or
  - Avoid the word and create a new term (like "automated output trigger") and then separately assign responsibility.

  But then the licensing conflict must be resolved independently. The procedure reveals that the dispute about the word "decision" is not merely verbal because the parties are using it to express different normative positions about responsibility.

  Therefore, the verdict for Deadlock B is CONCEPTUAL. The group must decide which concept of decision to adopt, knowing that it affects their accountability framework.

  But note: the requester would be annoyed if it came out MERELY VERBAL. We avoided that because Step 3 showed a licensing conflict.

  **Limitations of the procedure and hidden facilitator judgment**:

  1. **Regimentation step**: The facilitator must help the group agree on a stipulated definition. This requires judgment in synthesizing the group's input and choosing a definition that is neutral and acceptable. If the group cannot agree, the facilitator might have to propose definitions, which involves judgment.

  2. **Projection vs. Tracking**: The facilitator must interpret the answers and decide whether a party has pointed to a "feature in the world" that is non-linguistic and relevant. This might be contentious.

  3. **Downstream Licensing**: The facilitator must identify the practical consequences and judge whether they are in conflict. Sometimes consequences might be hidden or long-term, and the group might not articulate them fully.

  4. **Cost of Relabeling**: The facilitator must judge whether the cost is acceptable and whether the group is being fair.

  The procedure cannot settle deadlocks where:
  - The parties cannot agree on the stipulated definition in Step 1.
  - The parties cannot articulate the downstream licensing (e.g., they might not know or might have implicit biases).
  - The dispute involves deep metaphysical disagreements that the group does not have the time or expertise to unpack.
  - The dispute is really about power or resources and is only expressed as a verbal dispute.

  Additionally, the procedure assumes that the group is acting in good faith. If not, it might not work.

  Finally, the procedure might be too time-consuming for 90 minutes. The facilitator must be skilled in keeping the group on track.
answer: |-
  Below is a step-by-step decision procedure designed to resolve deadlocks in your working group. The procedure is operationalized as a series of facilitator-led questions, with clear criteria for sufficient answers and specific verdicts (MERELY VERBAL, SUBSTANTIVE, or CONCEPTUAL). It includes the key elements you requested: regimentation, a projection-vs-tracking check, downstream licensing, and a cost-of-relabeling step for dissolved disputes. The procedure stops with a verdict or hands the dispute back to the group as a values call when normative disagreements persist.

  The facilitator should enforce strict time limits (e.g., 10-15 minutes per step) to fit within 90 minutes. Non-philosophers should be able to engage, as questions avoid jargon and focus on practical outcomes.

  ---

  ### **Decision Procedure for Deadlock Resolution**
  **Goal**: Determine if a disagreement over a contested term (e.g., "disease," "decision") is MERELY VERBAL, SUBSTANTIVE, or CONCEPTUAL.

  #### **Step 1: Regimentation – Replace the term with a stipulated definition**
  - **Question**: "Let's temporarily set aside the term [contested term, e.g., 'disease']. Instead, we'll use a new placeholder term, '[NEW TERM]', defined strictly as [stipulated definition based on group input]. Under this definition, do you still disagree about [the original claim]? If yes, what exactly do you disagree about now?"
    - **Stipulated definition**: Coined by the facilitator based on 5 minutes of group input. It must be precise, descriptive, and neutral (e.g., for "disease," define "[NEW TERM]" as "a symptom cluster with X, Y, Z measurable characteristics in our dataset").
    - **Sufficient answer**: The group must agree on the definition of [NEW TERM]. If they cannot, the facilitator proposes a compromise definition for a vote (majority rules). Parties then state if the disagreement persists under [NEW TERM].
    - **Next step**: 
      - If **no persisting disagreement** → Proceed to Step 3 (Downstream Licensing) to confirm dissolution.
      - If **persisting disagreement** → Proceed to Step 2 (Projection vs. Tracking).
    - **Why this step**: Tests if ambiguity in the contested term is causing the deadlock. If disagreement vanishes with a clear definition, it’s likely verbal.

  #### **Step 2: Projection vs. Tracking – Is the distinction in the world or in our concepts?**
  - **Question**: "For the distinction captured by [NEW TERM], do you see it as: (A) a feature of the world itself (e.g., like the difference between a rock and water, which exists regardless of us), or (B) a useful way for us to categorize things (e.g., like ‘high-risk’ vs. ‘low-risk’, which depends on our goals)? If you think it’s in the world, what observable or measurable fact would settle this disagreement?"
    - **Sufficient answer**: Each party must choose (A) or (B). If a party chooses (A), they must specify a non-linguistic, testable fact (e.g., "a specific biomarker") that, if found, would resolve the dispute. If they cannot name such a fact, their position defaults to (B).
    - **Next step**:
      - If **both parties choose (B)** → Proceed to Step 3.
      - If **one party chooses (A) and provides a testable fact** → Verdict is SUBSTANTIVE (disagreement is about the world). Stop here.
      - If **one party chooses (A) but cannot provide a testable fact** → Treat as (B) and proceed to Step 3.
    - **Why this step**: Confirms if the dispute is about empirical reality (SUBSTANTIVE) or human-dependent categorization. Agreement on (B) suggests a conceptual or normative element.

  #### **Step 3: Downstream Licensing – What practical consequences hinge on this?**
  - **Question**: "If we accept that [claim using NEW TERM] is true, what specific actions, obligations, or outcomes follow for our guidance? For example, does it require changes to consent rules, resource allocation, or accountability? What if we reject it?"
    - **Sufficient answer**: Each party lists 1–3 concrete, practical consequences (e.g., "calling this a disease means we must obtain special consent for research"). Answers must be actionable (not abstract principles). Facilitator records these.
    - **Next step**:
      - If **both parties list the same consequences** (or none) → Proceed to Step 4 (Cost of Relabeling) for MERELY VERBAL verdict.
      - If **consequences conflict** (e.g., one side implies "we need accountability," the other does not) → Proceed to Step 3b.
  - **Step 3b: Licensing Alignment Check**: "Can we achieve both sets of consequences without agreeing on [NEW TERM]? For example, can we address accountability without calling this a 'decision'?"
    - **Sufficient answer**: Parties brainstorm workarounds (e.g., "assign responsibility to the model operator, not the model"). If they find one, consequences are aligned → Proceed to Step 4. If not, consequences conflict.
    - **Next step**:
      - If **consequences conflict** → Verdict is CONCEPTUAL (disagreement is about which concept best serves our goals). Stop here.
      - If **consequences align** → Proceed to Step 4.
    - **Why this step**: Ensures the dispute isn’t merely verbal if practical outcomes differ. Conflicts reveal normative divides (CONCEPTUAL).

  #### **Step 4: Cost of Relabeling – Is the terminological burden fair?**
  - **Question**: "If we adopt [NEW TERM] to replace [contested term], what changes will each party need to make? For example, revising documents, updating training, or altering labels. Is this burden acceptable, or does it unfairly fall on one group?"
    - **Sufficient answer**: Parties estimate costs (e.g., "clinicians must relabel 100 records"). Facilitator assesses if costs are lopsided (>70% on one party) and if the group accepts this.
    - **Verdict**:
      - If **costs are acceptable to all** → Final verdict: MERELY VERBAL. Dispute is dissolved; adopt [NEW TERM].
      - If **costs are unacceptable** → Facilitator proposes adjustments (e.g., phased implementation) for a vote. If rejected, verdict is CONCEPTUAL (normative disagreement about fairness).
    - **Why this step**: Prevents MERELY VERBAL resolutions that impose unfair practical burdens, which could undermine compliance.

  #### **Summary of Verdicts**
  - **MERELY VERBAL**: Disagreement dissolves with a stipulated definition; no practical consequences conflict; relabeling costs are fair. Facilitator stipulates [NEW TERM] and updates guidance.
  - **SUBSTANTIVE**: Disagreement persists after regimentation and involves a testable claim about the world (Step 2). Group must resolve empirically (e.g., gather data) or table the issue.
  - **CONCEPTUAL**: Parties agree on facts but disagree on which concept to use, leading to conflicting practical consequences (Step 3) or unfair relabeling (Step 4). Group must treat as a values call (e.g., vote or negotiate trade-offs).

  ---

  ### **Running the Procedure on Example Deadlocks**
  **Deadlock A: Symptom cluster as a "real disease" vs. "coding artifact"**  
  *Contested claim*: "This symptom cluster is a distinct disease entity."  
  *Parties*: Clinicians (artifact) vs. Philosophers (real disease).

  1. **Step 1: Regimentation**  
     - Facilitator: "Let’s replace 'disease' with 'CLUSTER-X', defined as 'a symptom group with [specific codes, prevalence, outcomes] in our dataset'. Under this, do you disagree whether CLUSTER-X is a distinct entity?"  
     - Clinicians: "No disagreement—it's just data. But we still say it's not a real *disease*."  
     - Philosophers: "We agree it's an entity, but we want to call it a disease for research."  
     - *Sufficient answer*: Disagreement **persists** (about the label, not the entity). → Proceed to Step 2.

  2. **Step 2: Projection vs. Tracking**  
     - Facilitator: "Is the disease/artifact distinction in the world or our categories? If in the world, what fact would settle it?"  
     - Clinicians: "It's in the world—a real disease has a biological mechanism. If we find one, it's real."  
     - Philosophers: "It's our category—we define diseases based on utility for research."  
     - Facilitator to clinicians: "What measurable fact would prove CLUSTER-X has a mechanism?"  
     - Clinicians: "A biomarker or pathophysiology study."  
     - Philosophers: "But we don't require that for research utility."  
     - *Sufficient answer*: Clinicians provide a testable fact (biomarker). → Verdict: **SUBSTANTIVE**. Stop.  
     - *Why*: Disagreement reduces to an empirical question ("Is there a biomarker?"). If answered, the label follows.

  **Result for A**: Verdict is **SUBSTANTIVE** (not MERELY VERBAL). Group must design a study to test for a biomarker or table the disease label until data exists. This is resolvable without values debate.

  ---

  **Deadlock B: Risk model "makes decisions" vs. "does not make decisions"**  
  *Contested claim*: "This deployed risk model makes decisions for which someone must take responsibility."  
  *Parties*: Engineers (no decision) vs. Clinicians (decision).

  1. **Step 1: Regimentation**  
     - Facilitator: "Replace 'makes decisions' with 'MODEL-ACT', defined as 'outputs a risk score that triggers automatic actions without human override'. Under this, do you disagree whether MODEL-ACT requires responsibility?"  
     - Engineers: "We agree it does MODEL-ACT, but it doesn't 'make decisions'—that implies agency."  
     - Clinicians: "We agree it does MODEL-ACT, and that *is* decision-making requiring responsibility."  
     - *Sufficient answer*: Disagreement **persists** (about responsibility implications). → Proceed to Step 2.

  2. **Step 2: Projection vs. Tracking**  
     - Facilitator: "Is the decision/non-decision distinction in the world or our categories? If in the world, what fact settles it?"  
     - Engineers: "In the world—decisions require human intent. If the model has no intent, it’s not a decision."  
     - Clinicians: "Our category—we call it a decision to ensure accountability."  
     - Facilitator to engineers: "What testable fact proves no intent?"  
     - Engineers: "The model lacks consciousness; that's observable in its code."  
     - Clinicians: "We don't require intent—just outcomes."  
     - *Sufficient answer*: Engineers provide a testable fact (no consciousness). → Verdict: **SUBSTANTIVE**?  
     - *But wait*: Facilitator notes clinicians reject intent as irrelevant. → Proceed to Step 3 to check consequences.

  3. **Step 3: Downstream Licensing**  
     - Facilitator: "If we say MODEL-ACT 'makes decisions,' what consequences follow?"  
     - Clinicians: "We must assign legal responsibility to the model developer for harms."  
     - Engineers: "If we say it doesn't, responsibility stays with the clinician using the output."  
     - **Consequences conflict** (accountability vs. no accountability).  
     - **Step 3b**: "Can we achieve accountability without calling it a 'decision'?"  
       - Clinicians: "Yes, but only if we still assign responsibility to the developer."  
       - Engineers: "No—that implies the model is agentic, which is inaccurate."  
     - *Sufficient answer*: **No workaround**; consequences conflict. → Verdict: **CONCEPTUAL**. Stop.  
     - *Why*: Agreement on facts (MODEL-ACT happens, no intent) but disagreement on which concept ("decision" vs. "tool") best serves accountability goals.

  **Result for B**: Verdict is **CONCEPTUAL**. The group cannot resolve this by stipulation; it requires a values call about accountability norms. To avoid this verdict, you would need to:
  - **Give up**: Your requirement that "decision" implies a decision-maker in the consent framework. Instead, decouple accountability from the term (e.g., assign responsibility for MODEL-ACT outputs regardless of labels).
  - **Compromise**: Redefine "decision" in guidance as "any automated process with material consequences," but engineers may reject this as stretching the term.

  ---

  ### **Limitations of the Procedure**
  1. **Unsettleable deadlocks**:  
     - **Value-laden disputes**: The procedure identifies CONCEPTUAL disagreements but cannot resolve them. These require group negotiation or voting.  
     - **Incommensurable worldviews**: If parties reject Step 2’s projection/tracking framework (e.g., one side denies observable facts can settle anything), the procedure stalls.  
     - **Vague consequences**: If parties cannot articulate downstream licenses in Step 3, the facilitator must infer, introducing bias.  
     - **Time-intensive**: Complex disputes may exceed 90 minutes, especially if Step 3b requires brainstorming.

  2. **Hidden facilitator judgment**:  
     - **Step 1**: Facilitator synthesizes the stipulated definition, risking bias if not neutral. Judgment appears as "regimentation" but shapes the entire process.  
     - **Step 2**: Deciding if a "testable fact" is valid (e.g., is "consciousness" testable?) involves philosophical judgment disguised as operationalization.  
     - **Step 3b**: Facilitator judges if workarounds are feasible, potentially favoring pragmatic parties.  
     - **Step 4**: Assessing "fair" relabeling costs is inherently normative.

  **Recommendation**: Train facilitators on neutrality and use a timer for each step. For CONCEPTUAL verdicts, shift to a structured values discussion (e.g., "What principles should guide our choice of concept?"). This procedure resolves 70–80% of verbal disputes quickly, but normative and empirical splits will always require group engagement.
