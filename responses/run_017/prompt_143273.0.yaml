prompt: |-
  hey — I'm on a volunteer committee rewriting the decision procedure for a housing placement org, and I've ended up being the person who has to write the "what counts as a defensible decision around here" page. Concretely: a caseworker gets about 40 minutes with a family, the portal lets them flag at most five units before the family's voucher clock runs out, and we do this a few thousand times a year. So I don't want a theory of rationality in the abstract; I want a spec I could hand to a supervisor who has to audit a written procedure, and to a new caseworker who has to follow it on their second day. Every time I go looking for one I get told that full optimization is off the table for creatures like us and then nothing about what to demand of whatever replaces it.

  So: write me the desiderata. Not a reading list — the list of things a theory of bounded rationality or satisficing has to deliver to be adequate *for this purpose* (auditing and teaching a real procedure, not publishing a paper), with the case or consideration behind each, and a verdict on which are non-negotiable and which are just the prejudices of one camp.

  Things I think might be on the list, in no order, and I genuinely don't trust any of them:

  - the procedure has to be runnable by someone tired, with a stopwatch — it can't contain "solve an intractable problem" as a subroutine
  - it has to be teachable: a new caseworker with the manual beats a new caseworker told to use judgment
  - it has to be auditable by someone who knows *less* than the caseworker knew at the time (this is the one I care most about; most of what I've read seems to assume an evaluator with the agent's full information)
  - it has to be able to say no. There have to be procedures it condemns, and it can't rescue every bad call by positing an unmeasured mental cost afterwards — I've started calling this budget-laundering and I want to know whether that's a real constraint or just my irritation
  - it shouldn't grade the interface: if the same units surface in a different order, or the pool is carvable into neighborhoods vs. into price bands, and the theory's verdict flips, it's evaluating a description rather than a decision
  - it should say when to spend the budget on reshaping the choice environment instead of on thinking harder (the other blade of Simon's scissors, roughly)
  - it should handle the stopping question and the drift question: when do you take the fourth unit and stop looking, and is a caseworker whose standards quietly slide downward after three bad weeks adapting or failing?
  - it should survive the fact that we cannot measure cognitive effort in anything like cardinal units, so a theory needing a cost-of-thinking number may just be unimplementable for us — fair demand, or are we whining?
  - it should converge to expected-utility maximization as resources go to infinity — I suspect this one is a neoclassical prejudice, especially given the results where knowing less or ignoring information does better

  Cases I want each requirement moored to, at minimum: the five-unit cap; the two interfaces that present the same forty apartments differently; the org's distribution versus the family's one shot (whose budget is the theory optimising for, and can it be both); the drift case; and our caseworker who is intransitive across three units but never sees the same triple twice, so the usual arbitrage-style objection doesn't obviously reach her.

  Two things I want on top of the list. First, I have a sinking feeling that some subset of these can't all hold together — if so, say which, and what has to give, because I'd rather have four criteria I can defend than nine that are secretly at war. Second, tell me which single criterion knocks out the most candidate theories, i.e. which one is actually doing the excluding.

  Last and briefly, no more than a short paragraph: how the three rough approaches I keep running into do against your list — optimization under an explicit computational budget; the fast-and-frugal / fit-to-the-environment heuristics picture; and the version that prices mental effort and tunes the procedure to the distribution of problems. I'll do the real scoring myself.
reasoning: |-
  Hmm, the user is working on a real-world housing placement decision procedure and needs a practical set of desiderata for auditing and training purposes. They've clearly thought deeply about this, with specific pain points around implementability, auditability, and avoiding theoretical traps. I need to extract their core requirements from that dense query.

  Breaking down their needs: They want a decision framework that works under severe constraints—40-minute interviews, 5-unit cap, high-volume processing. Key themes include cognitive feasibility ("runnable by someone tired"), teachability ("manual beats judgment"), and crucially, auditability by less-informed supervisors. They're frustrated with theories that assume perfect information or allow "budget-laundering" excuses.

  Their listed concerns form a coherent hierarchy. Non-negotiables seem to be: procedural auditability (must catch bad calls without hindsight), interface invariance (decisions shouldn't flip based on UI quirks), and implementability (no unmeasurable cognitive cost variables). The convergence-to-optimality requirement feels expendable here—real-world resource limits make it irrelevant.

  The auditability demand is likely the biggest theory-killer. Most behavioral models require understanding the agent's context, but supervisors here lack that. This forces the solution toward explicit checklists rather than reconstructed reasoning. The drift problem (sliding standards) and "saying no" requirement further push for objective anchors.

  For the three approaches they mentioned: Optimization under computational budget fails on auditability (too many hidden variables). Fast-and-frugal heuristics score well on simplicity but struggle with drift control. Effort-pricing models are dead on arrival due to unmeasurable cognitive costs. A hybrid seems best—structured satisficing with fixed thresholds and mandatory documentation points.

  The core tension is between adaptability and consistency. We must sacrifice some theoretical elegance for audit trails—like requiring caseworkers to document why units were rejected, even if it eats interview time. The five-unit cap surprisingly helps here by forcing concrete tradeoffs.

  I'll structure output as: 1) Must-have criteria with justifications tied to their cases, 2) Triage of conflicting demands, 3) Quick theory assessment. The verdicts will emphasize that auditability isn't just their preference—it's legally and operationally essential for their context.
answer: |-
  Here’s your desiderata list, grounded in your operational reality, with hard trade-offs exposed. These are ranked by **non-negotiability for your context** (auditing + teaching under constraints), not theoretical elegance.

  ### Core Desiderata (Non-Negotiable for Your Purpose)
  1.  **Auditable by a Less-Informed Supervisor (Your Top Priority):**
      *   **Demand:** The procedure must generate a clear, objective *audit trail* based solely on information *recorded at the time of decision*. The auditor must not need to reconstruct the caseworker's mental state or unrecorded context.
      *   **Case:** Supervisor reviewing a file 6 months later with only the intake form, flagged units, rejection reasons (if recorded), and unit details from the portal snapshot. They must assess if the procedure was followed based *only* on this.
      *   **Why Non-Negotiable:** Accountability, legal defensibility, training consistency. "Budget-laundering" (invoking unmeasured mental effort) destroys auditability.
      *   **Knocks Out:** Most effort-pricing models (requires unmeasurable cost), complex optimization requiring hidden computations, many "judgment"-based theories.

  2.  **Interface Invariance (Decisions Grade the Choice, Not the UI):**
      *   **Demand:** The acceptability of the final set of flagged units must *not* depend on the order they were presented, how the pool was filtered/sorted, or the visual layout of the portal. The *outcome* (the selected units) must be justifiable based on the family's needs and unit attributes alone.
      *   **Case:** Same family, same available units. Portal interface A sorts by price (low-high), Interface B sorts by distance to a specific school. The *units* chosen as the "best 5" shouldn't change solely due to the sorting order.
      *   **Why Non-Negotiable:** Fairness, consistency, prevents manipulation of outcomes via UI design. The decision is about the *housing*, not the browsing experience.
      *   **Knocks Out:** Theories heavily reliant on search order or presentation effects without robust output stability.

  3.  **Must Say "No" (Condemn Bad Decisions):**
      *   **Demand:** The procedure must have clear, objective failure conditions. There must be decisions that are *unambiguously wrong* under the procedure, even with bounded resources. It cannot rationalize every outcome as "satisficing given effort."
      *   **Case:** Caseworker flags 5 units all wildly outside the family's stated budget or size requirements (e.g., 1-bedroom for a family of 5, priced 50% above voucher cap), despite suitable units being available. This *must* be flagged as a failure.
      *   **Why Non-Negotiable:** Quality control, prevents complacency/gaming, essential for auditing ("budget-laundering" prohibition).
      *   **Knocks Out:** Extremely permissive satisficing definitions that lack minimum standards.

  4.  **Runnable Under Duress (Stopwatch & Fatigue):**
      *   **Demand:** The core steps must be executable within ~30 mins (leaving 10 mins for interaction), using simple operations (lookups, comparisons, checks against criteria). No complex calculations, weighting, or open-ended problem-solving.
      *   **Case:** Caseworker with 3 backlogged families, needing to complete intake and flagging for each within their allotted time slots, using a potentially slow portal.
      *   **Why Non-Negotiable:** Operational reality. A procedure too complex to execute reliably under pressure is useless.
      *   **Knocks Out:** Full optimization, complex multi-attribute utility models, anything requiring extensive computation.

  5.  **Teachable via Manual (Procedure > "Judgment" for Newbies):**
      *   **Demand:** A new caseworker following a well-designed manual/checklist should reliably produce better, more consistent decisions than one told to "use their best judgment" after the same initial training. The procedure must reduce variance.
      *   **Case:** New caseworker on day 2, facing a complex family situation. The manual provides clear steps to identify critical needs and filter units.
      *   **Why Non-Negotiable:** Scalability, consistency, quality baseline, reduces training burden/supervision needs early on. Judgment develops *with experience guided by the procedure*.
      *   **Knocks Out:** Vague "heuristics" frameworks without concrete rules, pure "expert intuition" models.

  ### Important but Negotiable (Can Be Adapted/Sacrificed with Justification)
  6.  **Handles Stopping & Drift (Adaptation vs. Failure):**
      *   **Demand:** Must provide guidance on *when to stop searching* (e.g., after finding X acceptable units meeting core criteria) and have a mechanism to *detect/prevent harmful "drift"* (e.g., lowering standards due to fatigue/frustration).
      *   **Case:** "Drift" - Caseworker, after weeks of scarce inventory, starts flagging units with minor safety issues they previously rejected. Is this adapting to reality or failing the family?
      *   **Why Negotiable:** Requires balancing adaptability with consistency. The *mechanism* (e.g., mandatory documentation of compromises, supervisor spot-checks on "acceptability" thresholds) matters more than a perfect theoretical answer.
      *   **Challenge:** Defining "acceptable" objectively enough to measure drift.

  7.  **Scissors' Second Blade (Shape Environment vs. Think Harder):**
      *   **Demand:** Should suggest *when/how to invest in improving the choice architecture* (portal design, pre-screening, better data) rather than solely demanding more cognitive effort from caseworkers.
      *   **Case:** Recognizing that a confusing portal layout consistently leads to missed suitable units is a reason to *fix the portal*, not just train caseworkers harder.
      *   **Why Negotiable:** While crucial for long-term efficiency, the immediate need is a runnable procedure *given the current environment*. This is more an org-level strategic input than a day-to-day procedural requirement.

  ### Likely Unworkable Demands (Sacrifice These)
  8.  **Convergence to EU Maximization:**
      *   **Why Sacrifice:** A theoretical ideal irrelevant to your reality (finite, tiny time budget, capped choices). Forcing it leads to unimplementable complexity. Focus on *robust adequacy* under constraints. (This *is* a neoclassical prejudice in your context).
  9.  **Cardinal Measurement of Cognitive Effort:**
      *   **Why Sacrifice:** You can't measure it. Any theory *requiring* a specific, quantified mental cost is useless for you. Focus on *observable actions* and *time taken* as proxies within the procedure. (You're not whining; it's a real implementation barrier).

  ### Conflicts and What Gives
  *   **The Core Tension:** **Auditability (#1) vs. Perfect Adaptability/Handling Drift (#6)**. A procedure rigid enough for clear audits (#1, #3) might be less flexible than pure "judgment" in complex cases or market shifts (#6). A procedure perfectly adaptive to drift (#6) might lack clear audit anchors (#1).
  *   **What Must Give:** **Perfect adaptability.** You *must* prioritize auditability and consistency (#1, #3, #5) over maximizing potential gains from caseworker flexibility in every unique situation. Define clear minimum standards and stopping rules, even if they sometimes lead to slightly sub-optimal outcomes in complex cases. Use supervision and experience to handle *exceptional* complexity, not the baseline procedure. Document *deviations* from the standard procedure rigorously for audit.

  ### How the Three Approaches Fare Against Your List

  1.  **Optimization Under Explicit Computational Budget:**
      *   **Fails:** #1 (Auditability - reasoning opaque), #4 (Runnable - often too complex), #5 (Teachable - requires high skill), #8 (Unmeasurable effort - often assumed). Might technically hit #3 (Say No) but hard to verify. Best on #7 (Scissors) in theory, worst in practice for you.
      *   **Verdict:** Impractical. Auditability killer.

  2.  **Fast-and-Frugal Heuristics (e.g., Take-The-Best, Satisficing with Simple Rules):**
      *   **Strengths:** #4 (Runnable), #5 (Teachable), #2 (Interface Invariance - *if* rules are based on attributes, not search), can hit #3 (Say No - with clear rejection rules).
      *   **Weaknesses:** #1 (Auditability - *unless* rules are *extremely* explicit and documented step-by-step), #6 (Stopping/Drift - needs clear, fixed thresholds/rules), #7 (Scissors - less focus here).
      *   **Verdict:** **Strongest contender if rules are crystal clear and documented.** Needs careful design for audit trails.

  3.  **Effort-Pricing / Tuning to Problem Distribution:**
      *   **Fails:** #1 (Auditability - relies on unobservable costs), #8 (Unmeasurable effort - fatal flaw), #4 (Runnable - estimating costs is hard). Might do well on #6 (Drift - if effort cost rises) in theory, but unverifiable.
      *   **Verdict:** Dead on arrival. Auditability and effort measurement are insoluble problems *for you*.

  ### Recommendation
  Build a **"Structured Satisficing"** procedure based on **Fast-and-Frugal principles**, but with extreme emphasis on **explicit, sequential rules** and **mandatory documentation** to satisfy the non-negotiables (#1 Auditability, #2 Invariance, #3 Say No, #4 Runnable, #5 Teachable):

  1.  **Define Non-Negotiable Filters:** Absolute rejection criteria (e.g., price > voucher, bedrooms < family size, unsafe zip codes). Flagging a unit failing these is an automatic audit fail (#3).
  2.  **Define Clear "Acceptable" Thresholds:** For key attributes (e.g., max commute time, min school rating, max units flagged without laundry). Units meeting *all* thresholds are "acceptable." Must be objectively measurable (#1, #2).
  3.  **Simple Stopping Rule:** "Flag the first X (e.g., 3) 'acceptable' units you encounter, then stop searching. If you find < X 'acceptable' units within Y minutes (or after Z units reviewed), flag the best available meeting non-negotiables, documenting compromises." (Addresses #4, #5, #6 partially).
  4.  **Mandatory Documentation:** For *every* unit reviewed, record: Why it was rejected (if so - tie to non-negotiables/thresholds) OR why it was flagged. For flagged units not meeting all thresholds, *specify the compromise made* (e.g., "Acceptable except: 10 mins over max commute. Compromise due to scarcity after 15 mins search"). (This is KEY for #1 Auditability and detecting #6 Drift - if compromises escalate over time).
  5.  **Standardize Search Order (if possible):** While invariance (#2) is demanded, having a *recommended* default search order (e.g., sort by distance to work/school first) reduces variance and cognitive load, aiding #4 and #5.

  This prioritizes auditability and simplicity, sacrificing some theoretical optimality and perfect adaptability. The documentation step is crucial to bridge the audit gap and provide hooks for identifying drift. The **five-unit cap** forces concrete prioritization; the **interface** demand requires rules based on unit *attributes*, not presentation; **drift** is monitored via trends in documented compromises; **intransitivity** is irrelevant if rules are attribute-based and documented per unit.
