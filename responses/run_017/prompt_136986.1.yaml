answer: |-
  Your hypothesis about evidential standards is astute and largely correct, but the Meridian case reveals additional layers. Below is a diagnosis of the core disagreement, followed by predictions for Meridian and a table of candidate diagnoses.

  ### Diagnosis of the Disagreement
  The deadlock stems from **conflated questions under the label "innate"**, compounded by **divergent evidential standards**. "Innate" is used ambiguously to mean (a) *architecturally constrained hypothesis space*, (b) *domain-specific prior*, or (c) *genetically encoded symbolic knowledge*. Both sides agree on (a) but treat (b) and (c) as inseparable, though they are empirically distinct. The nativists demand a *guarantee* that no unconstrained learner could acquire the target property from the input (a negative proof). The modelers accept an *existence proof* that a learner *can* acquire it with domain-general mechanisms (a positive demonstration). These standards are incommensurable: satisfying one camp inherently fails to address the other’s core concern. The Meridian case crystallizes this: the input’s informational content (an empirical question) is overshadowed by the proxy war over what counts as explanatory.

  ### Meridian Findings: How Each Camp Responds
  - **Nativists** would claim victory:  
    (1)–(3) show C is acquired without evidence; (4) proves generic models fail; (5) confirms that only a *specific innate bias* (hierarchical dependency) enables learning. They dismiss the model’s next-unit success as irrelevant (performance ≠ competence) and argue the biased model’s success validates innateness (bias = innate structure).  
  - **Modelers** would reject this:  
    (4) only shows *this* model fails, not that the input lacks information (e.g., distributional cues for m-verbs or dependencies). (5) doesn’t prove innateness—the bias could be domain-general (e.g., from action parsing). They’d note adults *produce* C-violations, suggesting indirect evidence (e.g., statistical absence). For them, (5) is a tweak, not nativist confirmation.  
  **Result**: No movement. Nativists see confirmation; modelers see a flawed test.

  ### Path to Progress
  1. **Disentangle the questions**: Replace "Is it innate?" with:  
     - Q1: *Is the hypothesis space constrained?* (Trivially yes; irrelevant).  
     - Q2: *Is the constraint domain-specific?* (Testable via cognitive transfer experiments).  
     - Q3: *Is the constraint genetically encoded?* (Requires developmental genetics, irrelevant to learnability).  
  2. **Measure input information rigorously**: Quantify cues for C in Meridian (e.g., m-verb co-occurrence patterns, prosodic boundaries) without presupposing the learner’s representational format.  
  3. **Formalize evidential standards**: Accept that *guarantees* are for mathematical models (e.g., Gold’s theorems), while *existence proofs* suffice for cognitive plausibility.  
  Progress lies in abandoning "innate" as a monolithic explanation and testing Q2/Q3 separately.

  ---

  ### Candidate Diagnoses Table
  | diagnosis                                      | commitments                                                                                                | explains                                          | meridian                                                                 | credence |
  |------------------------------------------------|----------------------------------------------------------------------------------------------------------|---------------------------------------------------|--------------------------------------------------------------------------|----------|
  | Verbal dispute about "innate"                  | Both sides agree on architectural constraints but define "innate" differently (nativists: domain-specific + genetic; modelers: architectural only). | Both stock replies about "innate" being underspecified. | Debate unmoved; nativists call the bias "innate," modelers call it "architectural." | 20%      |
  | **Disagreement about standards of evidence**   | Nativists require impossibility proofs; modelers accept existence proofs. Neither standard falsifies the other. | Modelers' complaint about unfalsifiability; nativists' dismissal of successful models. | **Predicts stalemate**: Findings satisfy nativists' standard but not modelers' (who demand better domain-general models). | 35%      |
  | Hidden empirical question about the input      | The input *does* contain sufficient information, but we lack tools to detect it. "Impoverishment" is measurement failure. | Modelers' insistence that input carries latent cues. | Debate unmoved; modelers claim input *must* have cues (undetected); nativists cite (2) as proof of absence. | 15%      |
  | **Two different questions under one label**    | "Is it innate?" conflates hypothesis-space constraints (Q1), domain-specificity (Q2), and genetic encoding (Q3). | Both sides' stock replies about "innate" being slippery. | **Predicts stalemate**: Findings address Q1/Q2 but not Q3; each camp focuses on their preferred sub-question. | 25%      |
  | The question is ill-posed                      | "Innateness" is not scientifically coherent (e.g., genes/environment interact irreducibly). The debate is metaphysical. | Both sides' frustration with recycled arguments. | Findings irrelevant; the case is dismissed as a false dichotomy. | 5%       |

  **Key**: Credence sums to 100%. Top diagnoses (bold) are **evidential standards** and **conflated questions**, which are mutually reinforcing. The Meridian case fails because it answers a conflated version of "innate" while meeting only one evidential standard. Progress requires splitting the question and aligning on falsifiability criteria for Q2 (domain-specificity).
