  **Villanelle: The Queue**

  We form a line and hold our place.  
  Two strangers waiting in the morning chill.  
  *It was simply the obvious thing.*  

  More come, and see the pattern they must trace.  
  They fall behind, accepting as their will.  
  We form a line and hold our place.  

  A crowd now gathers, slow and commonplace.  
  No thought, just habit—filling curb and sill.  
  *It was what we did last time.*  

  A shove breaks rhythm, haste without a grace.  
  A voice from nowhere: *Wait! That breaks the rule.*  
  We form a line and hold our place.  

  Her cry, though she’s no stake in our embrace,  
  now weights the air and makes compliance full:  
  *It was what we ought to do.*  

  Decades on, the stop’s erased without a trace,  
  yet still we join and bend to the unseen pull.  
  We form a line and hold our place.  
  *It is what we owe each other.*  

  ---

  The final stage remains a convention, fundamentally unchanged from the first. Though internalization adds normative force—transforming "obvious" into "owed"—the behavior persists only because each participant expects others to comply and expects others to expect compliance. This mutual expectation sustains the equilibrium; remove it, and the obligation dissolves. The poem leans toward convention’s continuity by anchoring every stanza in the fixed refrain (the behavior) and the evolving reason’s dependence on collective expectation. Yet a dissenting reader might argue the poem’s closing line implies duty transcends expectation, becoming a free-standing moral truth. This tension mirrors the seminar’s core debate: does normativity mask convention’s bones, or replace them? The villanelle’s form—invariant act, shifting motive—suggests the former, but its final, tender deflection ("owe") leaves room for the latter.
