answer: |-
  Here are the paired cases and analysis, designed to flip intuitive verdicts while meeting your constraints:

  ### Case A: Naive Directive  
  Mrs. Chen, 75, writes a standard advance directive after her Alzheimer’s diagnosis: "If I reach a stage where I cannot recognize my family, do not provide life-sustaining treatment (e.g., antibiotics for pneumonia)." She assumes such a state would be intolerable but doesn’t deeply consider adaptation. Ten years later, she has moderate dementia: she mistakes her daughter for a kind caregiver and can’t recall names, but she’s cheerful, enjoys music and meals, and clearly expresses her wish to "keep living" when asked. During a treatable infection, her directive demands withdrawal of care, but she resists, smiling: "I like it here."  

  **Verdict:** *Honor the directive*  

  ### Case B: Evidentially Sealed Directive  
  Dr. Rossi, 70, a gerontology researcher, writes an advance directive anticipating her own dementia: "I know patients *adapt* and report happiness even with severe cognitive decline. Do not interpret any later requests for life-sustaining treatment as valid. If I cannot write new poetry or discuss philosophy, withdraw care—*even if I appear content and beg to live*. This clause overrides all future testimony." Later, with moderate dementia, Dr. Rossi is serene, engages with simple art projects, and tells her son, "Life is good." When pneumonia strikes, she pleads, "Don’t let me go."  

  **Verdict:** *Override the directive*  

  ---

  ### Analysis Across Three Views  
  1. **Whole-Life Authority View** (Narrative autonomy)  
     - *Case A*: Favors honoring the directive. Mrs. Chen’s earlier self made a coherent (if simplistic) choice for her life story.  
     - *Case B*: Favors honoring the directive. Dr. Rossi explicitly bound her future self, anticipating adaptation.  
     - **Bullet to bite**: Must defend overriding a clearly happy later self in Case B if we reject its verdict.  

  2. **Time-Relative Interests View** (Current welfare)  
     - *Case A*: Favors *ignoring* the directive. Mrs. Chen now has positive well-being; treatment aligns with her interests.  
     - *Case B*: Favors *ignoring* the directive. Dr. Rossi is content; forcing death harms her present self.  
     - **Bullet to bite**: Must explain why we honor the directive in Case A despite current welfare.  

  3. **Psychological-Continuity View** (Connectedness-based authority)  
     - *Case A*: Moderate continuity (same baseline identity, values eroded). Favors *honoring* the directive—later self’s wishes stem from adaptation, not deep values.  
     - *Case B*: Identical continuity. Favors *overriding*—the directive’s rigidity undermines its claim to represent enduring values; later self’s stable preferences reflect integrated adaptation.  
     - **Bullet to bite**: Must justify different verdicts despite identical continuity.  

  ---

  ### Key Design Feature & Implications  
  **Single Feature Doing the Work**: *Evidentiary sealing* in Case B. Dr. Rossi’s directive immunizes itself against counterevidence (e.g., "discount future testimony"), making it epistemically closed and disconnected from actual welfare.  

  **Stripping the Feature Out**:  
  - If Case B’s directive lacked evidentiary sealing (e.g., "if I seem unhappy, withdraw care"), both cases would collapse into conventional analysis: honor B, override A.  
  - Without sealing, Case A’s directive remains falsifiable (Chen’s happiness *is* counterevidence), while Case B’s would become responsive to reality.  

  **Attack from a Whole-Life Authority Defender**:  
  "The cases artificially equate epistemic rigidity with akrasia. Dr. Rossi’s directive isn’t 'refusing to learn'—it’s a *sovereign choice* to prioritize her pre-dementia conception of personhood. Overriding it denies her lifelong values (autonomy, intellectualism) because she adapted to diminished capacities. If identity is fixed, her precedent autonomy must dominate. Case A is honored only because Chen’s naiveté accidentally aligns with whole-life authority when adaptation surprises her."  

  This preserves your mechanism: Case B’s sealing makes it less a welfare judgment and more a "metaphysical will" against future selves, while Case A’s directive—though mistaken—remains tethered to outcomes.
