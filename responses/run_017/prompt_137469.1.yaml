prompt: |-
  I am writing a paper on the ethics of torture and keep running into a recurring pattern in the arguments that I cannot name, and I would rather not coin a name for it until I know whether the ground is already occupied.

  The pattern shows up most clearly in the ticking-bomb case. The case is always told as a one-off: one captive, one device, one interrogation, after which the absolute prohibition is restored and nothing else has changed. Critics say the stipulation is unrealistic; defenders say we are asking about principle, not practice. What interests me is that the one-off stipulation looks to me not merely optimistic but self-consuming, in three separate respects.

  Capacity. Interrogational torture cannot be performed on demand. To be available in the emergency one needs people already trained, premises, a protocol, a chain of authorisation. The standing capacity must pre-exist the occasion and outlive it, so the act cannot be the exception that leaves no trace: the exception presupposes exactly the standing arrangement the prohibition was meant to rule out.

  Doctrine. If the act is to be lawful rather than merely excused afterwards, some authorising rule or necessity defence has to be articulated, and a rule is general in form. It will still be available in later cases where the stipulated features are absent, or merely asserted by someone with an interest in asserting them.

  The agent and the audience. After the first interrogation the officials involved are people who have done this, and future captives and future interrogators know it. The meaning and the expected cost of the practice change, not through abuse or bad faith but as a necessary consequence of the first instance having occurred.

  The common structure, as I see it: the act is permissible, if it is, only under a condition — that it be isolated, unpractised, unprovided-for — which its own performance necessarily destroys. The justification therefore applies at most once, and a reason that can by its nature apply only once seems an odd thing to build into a code.

  The near misses I have tried and rejected: the slippery slope (mine is not a prediction about what happens if people are weak or corrupt; it would hold under perfect compliance), dirty hands (that concerns the agent's moral remainder, not what the act does to the later choice set), talk of a state of exception (that concerns sovereignty and legal order, and the exception there is constitutive and repeatable rather than used up by its own occurrence), moral hazard (about incentives, and contingent). I have also wondered about the old puzzles about nuclear threats, where a threat is useful only if there is some chance of its being carried out though carrying it out would be ruinous — but that is about credibility and dispositions, whereas mine is about changes to the world the act brings about.

  So my question: is there an established concept for an act that destroys the condition of its own permissibility, or more precisely for a justification that is essentially one-off because satisfying it necessarily eliminates its own conditions of application? If there are several neighbouring notions, tell me which is closest and exactly where my case departs from each. If nothing fits, coin and define one: the definition, at least two clear instances, and at least two cases that look like instances but are not — I want the boundary drawn, not merely the centre — and then say what follows for how the ticking-bomb case ought to be argued. A bare label will not help me; the carving is the point. And if the honest verdict is that what I have described dissolves into two or three familiar things, I would rather be told that than handed a name.

  I do not need references, a reading list, or a literature review; I will chase anything myself. Please keep the whole answer under 600 words.
reasoning: |-
  Okay, the user is working on an ethics paper about torture and has noticed a recurring argument pattern in the ticking-bomb scenario that they can't name. They describe how the justification for torture in a one-off case actually undermines the conditions that make it permissible in the first place. 

  First, I need to understand their core observation: that torture can't truly be a one-time exception because establishing the capacity for it creates permanent infrastructure, articulating a doctrine makes it generalizable, and the first instance changes social perceptions. This makes the justification self-consuming - applying it destroys what made it applicable. 

  The user has already ruled out several related concepts like slippery slope, dirty hands, state of exception, and moral hazard. They want to know if there's an existing term for this self-consuming justification pattern. 

  Hmm... in ethics and philosophy, there are concepts like self-defeating principles, but those are more about logical inconsistencies. What they're describing is more concrete - about how an action alters the world in ways that void its own justification. 

  I recall that in legal theory, there's something called a "self-stultifying rule" where following a rule undermines its purpose. But that's not quite it. The closest fit seems to be "performative contradiction" - where an utterance contradicts its own presuppositions. But here it's about actions, not statements. 

  For example, when a government claims a torture exception is temporary but establishing it requires permanent systems, that's performative in the philosophical sense - the action itself creates new facts that contradict the justification. 

  After considering alternatives, I think coining "Self-Consuming Justification" fits best. It captures how the justification burns up its own foundation. Clear instances would be torture infrastructure and nuclear retaliation threats. Non-instances would be dirty hands (which is about guilt, not structural changes) and slippery slope (which depends on human failings). 

  This framing changes how we should approach the ticking-bomb argument - it shows why defenders can't maintain the "one-off" premise without ignoring real-world consequences. The structure of the justification itself makes it unsustainable beyond the hypothetical. 

  The user seems sophisticated - they've clearly done their homework and want precise conceptual tools. They're not asking for references but for sharp philosophical distinction-making. I'll focus on giving them the conceptual carving they requested, with clear boundaries for the term.
answer: |-
  Your core insight identifies a genuine gap in existing terminology. The pattern is best captured by coining **Self-Consuming Justification (SCJ)**.

  **Definition:** A SCJ is a justification for an act that requires, as a necessary condition for its permissibility, the *absence* of certain enabling structures or precedents. Performing the act *successfully justified by this rationale*, however, inevitably creates or reinforces precisely those structures or precedents, thereby nullifying the condition for its own permissibility in any future instance. The justification consumes its own foundational premise through its enactment.

  **Clear Instances:**
  1.  **Ticking-Bomb Torture (as you describe):** Permissibility requires no pre-existing torture capacity, doctrine, or precedent. Performing it necessitates creating capacity (training, facilities) and establishing a doctrine/authorization process, instantly creating the forbidden standing apparatus. The justification destroys its own "one-off" condition.
  2.  **Nuclear Deterrence via Launch Threat:** The threat's credibility relies on a perceived willingness to launch (the justification: preventing war through fear of retaliation). *Actually launching* retaliatory nukes (the act justified under the doctrine) destroys the societal and strategic conditions that made the threat credible and arguably rational (e.g., annihilated society, loss of command/control). The act destroys the basis of the deterrence justification itself.

  **Near Misses (Why They Don't Fit):**
  1.  **Dirty Hands:** Focuses on the agent's moral corruption or psychological burden. SCJ focuses on the *objective, structural change in the world* (capacity, doctrine, precedent) that alters the permissibility landscape for *future actors*, regardless of the original agent's guilt or innocence. The "dirt" is personal; the "consumption" is institutional/systemic.
  2.  **Slippery Slope:** Predicts future abuses due to human weakness, error, or bad faith leading to expansion beyond the initial justification. SCJ argues that *even under conditions of perfect compliance and good faith*, the *first* justified act *logically necessitates* creating the structures that make the justification inapplicable the *second* time. The slope is inherent in the act's *successful* execution, not contingent on later failures.

  **Boundary Clarification:** SCJ applies *only* when:
  *   The justification **explicitly or implicitly requires the absence** of X (e.g., standing capacity, precedent, enabling rule).
  *   Performing the justified act **logically necessitates creating or reinforcing X**.
  *   The creation/reinforcement of X **directly contradicts the core condition** required for the justification to hold again.
  *   This occurs **independently of human fallibility or malice**; it's a structural consequence of the act.

  **Implications for the Ticking-Bomb Argument:**
  The SCJ analysis demonstrates that the "one-off" stipulation is **logically incoherent within a system governed by rules and institutions**. Defenders cannot simultaneously claim:
  1.  The act is justified *only* because it's a unique, unrepeatable emergency requiring no prior preparation.
  2.  That a real-world state could *actually perform* such an act without thereby creating the institutional and doctrinal preconditions that make the "unique emergency" justification categorically inapplicable to any *future* scenario.

  Therefore, arguing the principle *requires* confronting the institutional reality it would instantly create. The ticking-bomb case, framed as a pure one-off, is not merely unrealistic; its core justificatory premise is **self-nullifying** upon enactment. The debate must shift to whether the creation of a *standing exception* (capacity, doctrine, precedent) is ever justified, abandoning the myth of the isolated, consequence-free act. SCJ forces the discussion onto the ground of institutional ethics and systemic consequences, which the one-off fantasy evades.
