  We are designing a seminar activity for 90 minutes with 12 upper-level students. The goal is to explore moral uncertainty, specifically:
  1. Students should discover that their confidence across moral views is spread out.
  2. They should see that acting on the highest-credence view vs. expected moral value can lead to different decisions in an ordinary case.
  3. They should see that the conversion rule (how to put different theories' verdicts on a common scale) is crucial and that uncertainty about this conversion is itself a source of uncertainty.
  4. They must handle the "no fact of the matter" credence (10% in the example) and see that it doesn't act like another theory.
  5. There should be an option to wait and inquire, but at a cost, and an irreversible ("morally self-blinding") option.

  The case I propose is a relief logistics scenario. Let's refine it:

  **Case: The Relief Convoy**

  The setting is a region struck by a natural disaster. A convoy of aid (medicine, food, blankets) must be sent to one of two settlements: 
  - Settlement A: A smaller, isolated community of 100 people. There is a standing promise (made by the organization) to help them first in such a situation. They are more vulnerable and without aid, 50% will die. With aid, only 10% will die.
  - Settlement B: A larger community of 500 people. Without aid, 40% will die. With aid, only 5% will die.

  The convoy has a single window: it must leave now to reach either settlement in time. If it waits, it loses the window for both. However, there is an option to hold the convoy and try to gather more information (e.g., about the current conditions, the accuracy of the death rate estimates, etc.). This wait option costs time and resources: the convoy will be able to deliver aid to only one settlement (with a reduced effect because of delay) and only if they choose within 24 hours. Specifically, if they wait and then send to A, the death rate in A will be 30% (instead of 10% if sent immediately). If they wait and then send to B, the death rate in B will be 15% (instead of 5% immediately). Also, during the wait, an estimated 10 people in each settlement will die due to the ongoing crisis (so A would have 90 people left, B 490, and then the aid reduces the death rate as above).

  Moreover, there is an irreversible option: the convoy can be split, sending half to A and half to B. However, because of economies of scale and the nature of the aid, splitting the convoy reduces effectiveness: 
  - For A: without aid, 50% die; with half aid, 30% die (so 30 deaths averted instead of 40).
  - For B: without aid, 40% die; with half aid, 30% die (so 100 deaths averted instead of 175).

  But note: splitting the convoy is irreversible and destroys evidence about which settlement would have been better to help. It also might break the promise to A, and it doesn't allow for learning which approach (consequentialist, deontological, etc.) was best because the outcomes are mixed.

  Alternatively, the organization could let the affected people decide (by sending a fast messenger to both settlements and having representatives meet). However, this takes time (same as waiting) and the same delay penalties apply. Moreover, it is not clear if the representatives can be gathered in time, and it might lead to conflict.

