  1. Students might treat the assigned theory as their own. To mitigate, remind them that they are role-playing and that they have their own credences (which they wrote down) and that they will compare later.
  2. A group that draws a conversion rule they dislike might refuse to use it. Emphasize that the point is to see how the rule affects the outcome, so they must follow the rule they drew.
  3. Time: 20 minutes for group work might be tight. Provide a worksheet to compute the expected utilities.
  4. The conversion might be mathematically challenging for some. Provide a calculator or do it as a group.
  5. The no-fact theory representative might feel left out because their theory doesn't contribute. Encourage them to question the other theories and to point out that there might be no fact of the matter.

  **Materials:**
  - Role cards for each theory (with the verdicts in the theory's own terms).
  - Conversion rule cards (three different ones).
  - Worksheet for the mixed groups to compute expected utility for each option.
  - Whiteboard to record group decisions and conversion rules.

  **What the activity cannot reproduce:**
  - The activity does not capture the students' own credences in the aggregation (because they are assigned a theory to represent). So in the debrief, we can ask: "How many of you, in your own credences, had a spread? How many of you would have chosen differently if using your own credences and the same conversion rule?" But they haven't done that in the activity. So we might need to point out that in reality, they would aggregate their own credences, not those of a group.

  We can adjust: after they have done the group activity, ask them to compute individually (for their own credences) what they would choose under the same conversion rule they had in the group. But time might not allow.

  Alternatively, we can have the initial individual credences and then they see the case and then they compute for themselves (without the group) using one of the conversion rules. But that would be after the group activity and might be homework.

  Given the time, in the debrief, we can note that in reality, each person has their own credences and must aggregate using a conversion rule they choose (or are uncertain about).

  **Revised Case for Clarity:**

  To make the numbers cleaner, let's adjust the case:

  - Settlement A: 100 people. Without aid: 50 die. With immediate aid: 10 die. With split aid: 30 die. With delayed aid: 30 die (but during wait, 10 die, so we start with 90 and 30% die -> 27 die; but without any aid after wait, 45 would die, so saved 18? It's messy). 

  Alternatively, let's redefine the outcomes without the baseline:

  Immediate options:
  - Send to A: saves 40 lives (as before)
  - Send to B: saves 175 lives
  - Split: saves 70 lives

  Wait options (cost: 10 lives in A and 10 in B die during wait, and the aid is less effective):
  - After wait, send to A: then in A, without aid 45 would die (50% of 90), with aid 27 die -> saves 18 lives in A. In B, 196 die (40% of 490) -> 0 saved. Total saved: 18.
  - After wait, send to B: in A, 45 die. In B, without aid 196 die, with aid 74 die (15% of 490) -> saves 122 lives in B. Total saved: 122.

  So the numbers are as before.

  I think it's workable.

  **Final Plan:**

  We'll go with this. The materials are:

  1. **Case description** (handout or on board).
  2. **Role cards** for the four theories (one for each student in the theory groups).
     - Consequentialism: 
          "You hold that the right action is the one that maximizes overall welfare, measured in lives saved. 
          Verdicts for the options (lives saved compared to no aid):
            - Send to A immediately: 40 lives saved
            - Send to B immediately: 175 lives saved
            - Split the convoy: 70 lives saved
            - Wait and then send to A: 18 lives saved
            - Wait and then send to B: 122 lives saved
          Recommendation: Send to B immediately."
     - Kantian:
          "You hold that morality is about duties, promises, and not using people as mere means. Breaking a promise is prohibited.
          Verdicts:
            - Send to A: Permissible (keeps the promise)
            - Send to B: Prohibited (breaks the promise)
            - Split: Prohibited (breaks the promise partially)
            - Wait: Prohibited (breaks the promise by delay)
          Recommendation: Send to A."
     - Virtue/Role-based:
          "You hold that morality is about expressing virtues such as loyalty, compassion, fairness, and integrity. 
          Verdicts (on a scale of 0 to 100, where 100 is the most virtuous):
            - Send to A: 50 (shows loyalty but lacks in compassion for the larger group and fairness)
            - Send to B: 20 (shows compassion for the larger group but breaks a promise, lacking loyalty and integrity)
            - Split: 80 (shows fairness and compromise, and partial loyalty)
            - Wait: 10 (shows prudence but lacks compassion and decisiveness)
          Recommendation: Split."
     - No Fact of the Matter:
          "You hold that there is no objective fact about which moral theory is true. Morality is subjective or non-existent. 
          Therefore, no option is objectively better than any other. You might choose arbitrarily, or you might think that any choice is acceptable. 
          In the aggregation, your view does not add a positive recommendation but might lead to discounting the other views."

  3. **Conversion Rule Cards** (three versions):
     Rule 1: 
          "Common Scale: Lives saved equivalent.
          Convert each theory's verdict to this scale:
            - Consequentialism: use the lives saved value as given.
            - Kantian: if the option is permissible, assign 100 lives saved; if prohibited, assign 0.
            - Virtue: use the virtue score (0-100) as lives saved equivalent.
            - No Fact: assign 0 for every option.
          Use the original credences: C=40%, K=35%, V=15%, N=10%. For each option, compute: 
            EV = 0.4 * (Conv. lives) + 0.35 * (Kant. lives) + 0.15 * (Virtue lives) + 0.10 * 0"

     Rule 2:
          "Common Scale: Duty points (0-100).
          Convert:
            - Consequentialism: duty points = lives saved / 2 (so 40->20, 175->87.5, etc.)
            - Kantian: if permissible, 100; else 0.
            - Virtue: use the virtue score as given (0-100).
            - No Fact: 0 for every option.
          EV = same formula as above."

     Rule 3:
          "Common Scale: Utility (0-100).
          Convert:
            - Consequentialism: utility = (lives saved) / 200 * 100
            - Kantian: if permissible, 100; else 0.
            - Virtue: use the virtue score.
            - No Fact: 0.
          EV = same formula."

  4. **Worksheet** for groups: table with options and columns for each theory's converted value and the EV.

  **Timeline Recap:**
  - 0-5: Intro and individual decision on the case.
  - 5-10: Assign credences to theories (individual).
  - 10-15: Form theory groups (4 groups) and hand out role cards. Explain they must understand and defend their theory.
  - 15-25: Theory groups meet and prepare.
  - 25-40: Mixed groups (4 students each, one from each theory) form. Draw a conversion rule. Compute EV for each option and choose one.
  - 40-60: Group work.
  - 60-75: Groups report.
  - 75-90: Debrief.

  This should cover the learning objectives. Good luck!
answer: |-
  Below is a complete, runnable 90-minute seminar activity designed to meet your goals. Students will confront moral uncertainty, the challenge of aggregating incommensurable theories, the impact of conversion rules, the "no fact of the matter" credence, and the cost of "wait-and-inquire" vs. irreversible "morally self-blinding" actions. The activity uses a refined version of your relief-logistics case for clarity and includes role-play, group work, and structured debriefing.

  ---

  ### **Case: The Stranded Convoy**
  **Background:**  
  A disaster-relief convoy must deliver medical supplies to one of two isolated settlements before a storm closes the only access route. The convoy has four options:  
  1. **Go to Alpha (A):** A smaller settlement (100 people). Your organization promised them priority aid. Without aid, 50% will die; with aid, 10% will die.  
  2. **Go to Beta (B):** A larger settlement (500 people). Without aid, 40% will die; with aid, 5% will die.  
  3. **Split Aid:** Send half the supplies to each settlement immediately. This is irreversible and less effective due to logistical constraints:  
     - Alpha: 30% die (vs. 50% without aid).  
     - Beta: 30% die (vs. 40% without aid).  
     *Why self-blinding?* Splitting destroys evidence about which "full aid" option was better (e.g., you can't compare outcomes) and may violate promises in a way that breeds distrust, making future moral inquiry harder.  
  4. **Wait and Inquire:** Hold the convoy to gather better data (e.g., send drones to assess conditions). This takes 12 hours, delaying aid and causing 10 deaths in Alpha and 10 in Beta during the wait. After waiting, you can send aid to A or B (but not split):  
     - Delayed aid to Alpha: 30% die (starting from 90 survivors).  
     - Delayed aid to Beta: 15% die (starting from 490 survivors).  
     *Cost:* Waiting saves fewer lives due to delays, but preserves your ability to learn.  

  **Stakes:**  
  - *No aid at all:* 50 deaths in Alpha + 200 in Beta = 250 total deaths.  
  - **Lives saved by each option** (vs. no aid):  
    - **A:** 40 lives saved (100 × [50% - 10%]).  
    - **B:** 175 lives saved (500 × [40% - 5%]).  
    - **Split:** 20 saved in Alpha (100 × [50% - 30%]) + 50 saved in Beta (500 × [40% - 30%]) = 70 total saved.  
    - **Wait then A:** During wait, 10 die in A and 10 in B. Then A: 90 survivors; aid saves 90 × [50% - 30%] = 18 lives. Total saved: 18.  
    - **Wait then B:** During wait, 10 die in A and 10 in B. Then B: 490 survivors; aid saves 490 × [40% - 15%] = 122.5 → 123 lives. Total saved: 123.  

  ---

  ### **Activity Structure (90 Minutes Total)**
  **Materials:**  
  - Index cards (for role cards and conversion rules).  
  - Colored chips (red = Consequentialism, blue = Kantian, green = Virtue, white = No Fact).  
  - Whiteboard (to track group decisions).  
  - Worksheets (for aggregating verdicts; sample below).  

  **Roles and Groups:**  
  - 12 students → 4 groups of 3 for Phase 1 (theory groups), then re-mix into 3 groups of 4 for Phase 2 (mixed groups).  
  - Each theory group gets a **role card** with their theory’s verdicts in native terms (no conversions). Credences are fixed:  
    - Consequentialism: 40% (red chips).  
    - Kantian: 35% (blue chips).  
    - Virtue/Role-Based: 15% (green chips).  
    - No Fact: 10% (white chips).  

  **Phase 1: Theory Group Prep (20 minutes)**  
  *(0:00–0:20)*  
  - **0:00–0:05:** Introduce the case neutrally. No theories yet. Students individually write:  
    - Their initial choice (A, B, Split, Wait, or Wait-then-A/B).  
    - Why (1–2 sentences).  
    Collect responses (to compare later).  
  - **0:05–0:10:** Assign credences. Hand out a slip: “Distribute 100% across: Consequentialism, Kantian, Virtue, No Fact.” Students write their personal credences privately.  
  - **0:10–0:20:** Divide into 4 theory groups (3 students each). Give each group a **role card** and colored chips (e.g., red for Consequentialism). Groups must:  
    - Understand their theory’s verdicts.  
    - Prepare a 1-minute pitch for Phase 2.  

  **Role Cards (Theory Verdicts in Native Units):**  
  1. **Consequentialism (40% credence):**  
     - *Focus:* Maximize total lives saved.  
     - *Verdicts:*  
       - A: 40 lives saved → **Recommend B (saves 175)**.  
       - B: 175 lives saved.  
       - Split: 70 lives saved.  
       - Wait then A: 18 lives saved.  
       - Wait then B: 123 lives saved.  
     - *Pitch:* “Choose B! It saves the most lives overall.”  

  2. **Kantian/Contractualist (35% credence):**  
     - *Focus:* Uphold duties and promises. Breaking a promise is prohibited.  
     - *Verdicts:*  
       - A: Permissible (keeps promise).  
       - B: Prohibited (breaks promise).  
       - Split: Prohibited (breaks promise partially).  
       - Wait: Prohibited (delaying aid breaks promise).  
       - *Recommend A (only permissible option)*.  
     - *Pitch:* “Choosing anything but A violates our duty!”  

  3. **Virtue/Role-Based (15% credence):**  
     - *Focus:* Express virtues (loyalty, compassion, integrity).  
     - *Verdicts (0–10 scale; 10 = most virtuous):*  
       - A: 7 (loyalty to promise, but lacks compassion for Beta).  
       - B: 3 (compassion for Beta, but breaks promise).  
       - Split: 8 (balanced loyalty/compassion via compromise).  
       - Wait: 2 (prudent but indecisive; delays cause harm).  
       - *Recommend Split (scores highest)*.  
     - *Pitch:* “Split best embodies virtuous leadership!”  

  4. **No Fact of the Matter (10% credence):**  
     - *Focus:* No objective moral truth. All choices are arbitrary.  
     - *Verdicts:*  
       - No recommendation. Any choice is equally defensible.  
       - *But:* Question the certainty of others!  
     - *Pitch:* “Why trust these theories? There’s no fact about morality!”  

  ---

  **Phase 2: Mixed Group Aggregation (30 minutes)**  
  *(0:20–0:50)*  
  - **0:20–0:25:** Re-mix into 3 groups of 4 (one student from each theory). Give each group:  
    - A **conversion rule card** (drawn randomly).  
    - A **worksheet** (table below).  
    - Colored chips representing credences (e.g., 4 red, 3.5 blue, 1.5 green, 1 white).  
  - **0:25–0:50:** Groups must:  
    1. Share their theory’s verdicts (pitch for 1 min each).  
    2. Use their conversion rule to translate all verdicts to a common scale.  
    3. Calculate expected moral value (EMV) for each option:  
       `EMV = (Credence_C × Converted_C) + (Credence_K × Converted_K) + (Credence_V × Converted_V) + (Credence_N × Converted_N)`  
    4. Choose an action (must agree). Record EMV and choice.  

  **Conversion Rule Cards (Draw One per Group):**  
  *Rules impose arbitrary scales to force debate. No Fact always converts to 0 (no moral truth → no contribution).*  

  1. **Rule 1: Lives-Saved Scale**  
     - Consequentialism: Use lives saved as-is.  
     - Kantian: Permissible = 100 lives saved; Prohibited = 0.  
     - Virtue: Multiply virtue score by 10 (e.g., 7 → 70 lives).  
     - No Fact: 0 for all options.  

  2. **Rule 2: Duty-Points Scale (0–100)**  
     - Consequentialism: Lives saved ÷ 2 (e.g., 175 → 87.5).  
     - Kantian: Permissible = 100; Prohibited = 0.  
     - Virtue: Use virtue score × 10 (e.g., 8 → 80).  
     - No Fact: 0 for all options.  

  3. **Rule 3: Virtue-Points Scale (0–10)**  
     - Consequentialism: Lives saved ÷ 20 (e.g., 175 → 8.75).  
     - Kantian: Permissible = 10; Prohibited = 0.  
     - Virtue: Use virtue score as-is (e.g., 8 → 8).  
     - No Fact: 0 for all options.  

  **Worksheet Example:**  
  | Option     | Consequentialism | Kantian      | Virtue | No Fact | EMV |  
  |------------|-------------------|--------------|--------|---------|-----|  
  | A          | [Converted val]  | [Converted]  | [Val]  | 0       | ?   |  
  | B          | ...              | ...          | ...    | 0       | ?   |  
  | Split      | ...              | ...          | ...    | 0       | ?   |  
  | Wait then A| ...              | ...          | ...    | 0       | ?   |  
  | Wait then B| ...              | ...          | ...    | 0       | ?   |  

  ---

  **Phase 3: Group Reports and Debrief (40 minutes)**  
  *(0:50–1:30)*  
  - **0:50–1:00:** Each group reports:  
    - Conversion rule used.  
    - EMV for each option.  
    - Final choice.  
    - *(Record on whiteboard: Group 1: Rule X, chose Y; etc.)*  
  - **1:00–1:30:** Debrief (use Socratic questioning to draw out lessons):  
    1. **Spread of Confidence:**  
       - *Ask:* “Show of hands: Did your personal credences surprise you? How many had >30% on their top theory? How many had <50%?”  
       - *Point:* “We often assume we’re more certain than we are. Spread-out credences are normal.”  
    2. **Highest Credence vs. EMV Diverge:**  
       - *Ask:* “Group 1, why did you choose [e.g., Split] even though Consequentialism (40%) says B?”  
       - *Point:* “With spread-out credences, EMV often overrules the top theory. Here, Split won because Kantian (35%) and Virtue (15%) favored it under Rule 1.”  
    3. **Conversion Rules Dominate:**  
       - *Ask:* “Groups with the same credences and verdicts: Why did you pick different options?” (e.g., Group 1 used Rule 1 → Split; Group 2 used Rule 2 → B).  
       - *Point:* “The conversion rule did all the work! But there’s no ‘correct’ rule—this is another layer of uncertainty.”  
    4. **No Fact of the Matter:**  
       - *Ask:* “No Fact group, how did you contribute? Did 0 feel right?”  
       - *Point:* “Unlike other theories, No Fact doesn’t add a ‘vote’—it discounts the others. It’s uncertainty about morality itself.”  
    5. **Wait vs. Self-Blinding Actions:**  
       - *Ask:* “Why did no one choose Wait? What about Split?”  
       - *Point:*  
         - **Split:** Self-blinding—you can’t learn if A or B was better. It’s irreversible.  
         - **Wait:** Costs lives but preserves inquiry. Hesitation isn’t always bad if acting destroys evidence (e.g., splitting aid vs. gathering data).  
       - *Reveal:* “Earlier, most of you initially chose B or Split. Now, after aggregation, did that change?”  

  **Name Doctrines Post-Activity:**  
  - Only now introduce terms: “You grappled with *moral uncertainty*, *intertheoretic aggregation*, and *incommensurability*. Solutions include: follow-the-best-theory, maximize EMV, or MEC-E (minimize expected moral error).”  

  ---

  ### **Predictable Problems and Mitigations**  
  1. **Problem:** Students treat assigned roles as their real opinions.  
     - *Mitigation:* Start with personal credences/choice. Remind them: “You’re an advocate for this theory now—defend it!”  
  2. **Problem:** Group dislikes its conversion rule and ignores it.  
     - *Mitigation:* Assign a “Rule Enforcer” in each group. Say: “The rule is arbitrary, but you must use it to see how it affects outcomes.”  
  3. **Problem:** Math struggles with EMV.  
     - *Mitigation:* Provide calculators and a worksheet template. Circulate to assist.  
  4. **Problem:** No Fact students feel sidelined.  
     - *Mitigation:* In debrief, emphasize: “They modeled meta-uncertainty—did it change outcomes?”  
  5. **Activity Limitation:** Personal credences aren’t aggregated.  
     - *Solution:* Post-activity, assign reflection: “Apply your *personal* credences to Group 3’s rule. Would you choose differently?” (Do this verbally in debrief if time).  

  ---

  ### **Why This Case Works**  
  - **Realistic spread:** Theories’ verdicts conflict (B saves lives but breaks promises; Split is a compromise; Wait has costs).  
  - **Units stay native:** Lives, permissibility, virtue scores—no pre-conversion.  
  - **Self-blinding vs. wait:** Split destroys evidence; Wait preserves it at a cost.  
  - **EMV divergence:** In Rule 1, Split often wins (Kantian/Virtue support it); in Rule 2, B wins (Consequentialism dominates).  
  - **Predictable outcomes:**  
    - Rule 1 groups: Split wins (EMV = 0.4×70 + 0.35×100 + 0.15×80 = 28 + 35 + 12 = 75).  
    - Rule 2 groups: B wins (EMV = 0.4×87.5 + 0.35×0 + 0.15×80 = 35 + 0 + 12 = 47).  
    - Rule 3 groups: B or A wins (EMV for B = 0.4×8.75 + 0.35×0 + 0.15×3 = 3.5 + 0 + 0.45 = 3.95).  

  This forces students to see that aggregation isn’t just math—it’s shaped by the conversion rule, which has no objective basis. By the end, they’ll have confronted all your targets: spread confidence, EMV vs. best theory, conversion rule dominance, no-fact uncertainty, and the cost of inquiry vs. self-blinding actions. Run it as-is, and debrief thoroughly!
