  First, I need to break down Pascal's Mugging. A mugger claims they can inflict negative utility unless paid, with a tiny probability but astronomically high disutility. The fanatic argues that even if the probability is minuscule, the expected value calculation demands payment because the massive disutility outweighs the low probability. The user's systems handle similar calculations but in high-throughput, repeated decision environments.

  Translating the fanatic position: They maximize expected value without bounds. In the user's terms, it's like having a heavy-tailed distribution where the tail index α approaches zero. The sample mean becomes unstable, but the fanatic doesn't clip probabilities or utilities. This is problematic in one-shot decisions where LLN doesn't apply.

  Looking at anti-fanatic moves:
  1. **Bounding utility**: Capping max utility. In engineering, this is equivalent to clipping extreme values to prevent overflow. The user sees this as identical to their clipping process, but philosophers might argue about theoretical limits vs. practical caps.
  2. **Probability floors**: Treating tiny probabilities as zero. The user already does this with credence-resolution limits. This maps well.
  3. **Diminishing returns**: Concave utility functions. The user uses constraints to manage tails, which is similar but not identical. Philosophers think in smooth curves; engineers use hard cutoffs.
  4. **Lexical thresholds**: Absolute priorities over expected value. Like hard constraints in engineering systems, ensuring tail risks don't dominate.

  Residue analysis:
