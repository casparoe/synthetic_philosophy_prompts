  Based on H's past rulings, I'll analyze each new case by inferring the implicit rules, predict her judgment, and assess confidence. I'll then provide a further case to clarify the rules and flag the least confident prediction.

  ### Inferred Rules from H's Past Rulings:
  H's decisions consistently hinge on **hypocrisy**, **accountability**, and **norm alignment**. Key implicit rules:
  1. **Same-Norm Hypocrisy Rule**: If you've violated the *exact same norm* you're criticizing and haven't addressed it (e.g., no amends, reform, or acknowledgment), you lack standing. Examples: Kev (stealing), Tom (ghosting), and Nadia (consuming meat she protests, unless she "owns it" or stops).
  2. **Reform Exception**: If you've demonstrably reformed (e.g., stopped the behavior and made amends or earned credibility), you may have standing even for the same norm. Example: Mara (sober for years, so she "earned" the right to comment on drinking).
  3. **Different-Norm Exception**: Criticizing a *different norm* (unrelated fault) grants standing. Example: The cheating woman calling out lying (cheating vs. lying are distinct).
  4. **Third-Party Relay Exception**: Relaying a complaint from an affected party (e.g., a client) grants standing, even if hypocritical. Example: Chronically late person citing a client complaint.
  5. **Ongoing Behavior Rule**: Current engagement in the criticized behavior (without acknowledgment or change) denies standing. Example: Nadia must "own" her beef-eating to criticize dog-meat consumption.
  6. **Acknowledgment Requirement**: For past violations, "owning it" (admitting fault) can partially restore standing, even if you haven't fully reformed. Example: Nadia's case implies acknowledgment mitigates hypocrisy.

  H also emphasizes that truth doesn't grant entitlement—standing depends on the critic's moral consistency.

