    - Same-norm hypocrisy (crossing a picket line), no accountability (never apologized or made amends). This directly parallels Tom (ghosted, then shamed ghosting) and Kev (stole, then criticized stealing). 
    - No reform (no public reckoning) and no third-party relay (he's leading the criticism, not citing others).
  - **Confidence**: High. Fits Rule 1 squarely; union context doesn't introduce new factors, and H is strict about unaddressed past violations.

  **Case 3: Recycling enforcer (meticulously sorts, but flies long-haul 3x/year) berating neighbors for poor sorting.**
