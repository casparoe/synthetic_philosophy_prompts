    - Same-norm hypocrisy (environmental harm), with ongoing behavior (flying regularly) and no acknowledgment. Flying contributes significantly to carbon emissions, making it a related norm to recycling (both environmental responsibility). This mirrors Nadia (eats beef while criticizing meat consumption) and the lateness case (ongoing lateness without relay). 
