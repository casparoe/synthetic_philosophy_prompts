  - **Confidence**: High. Combines Rules 1 and 5 (same-norm hypocrisy and ongoing behavior). H treats environmental norms as interconnected (like Nadia's meat cases).

  ### Summary of Predictions:
  | Case       | Prediction | Confidence | Key Rule Applied          |
  |------------|------------|------------|---------------------------|
  | Brother    | No standing | Medium     | Same-norm hypocrisy (Rule 1) |
  | Union rep  | No standing | High       | Same-norm hypocrisy (Rule 1) |
