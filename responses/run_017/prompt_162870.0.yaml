  - **Reasoning**: 
    - Same-norm hypocrisy (drunk driving), no reform acknowledgment (never told anyone, no amends), and no demonstrable "earning" like Mara. Quiet stopping without transparency mirrors Kev (shoplifted secretly) and Tom (ghosted without apology). 
