prompt: |-
  I spent ten years in industry working on guidance and control for autonomous underwater vehicles before I took my doctorate in philosophy, and I now write mainly on skill and knowledge-how. Next month I am giving a colloquium to my old group, and I want to use the visit as an occasion to think again about a literature I have come to find stalled. The dispute between intellectualists and anti-intellectualists about knowing how seems to me to be running on competing intuitions about described cases, and I suspect that a good deal of what is doing the work is that the two sides are operating with different background pictures of what a piece of competence in an agent could even be. My first vocabulary may be a sharper instrument here than the one the literature uses, so I would like you to carry out a systematic translation. Please write in British English, and please do not supply references, a bibliography or suggestions for further reading; I know that literature well, and what I want from you is the structure of the argument rather than its sources.

  The vocabulary I want the translation done into is the one I used daily: plant and environment; controller or policy; state estimator; closed-loop against open-loop behaviour; feedforward against feedback; world model; model-based control, including model predictive control with its online optimisation and receding horizon, against model-free or amortised policies arrived at by tuning or reinforcement learning; system identification; hierarchical architectures in which an outer loop sets setpoints for an inner one; gain scheduling and other forms of adaptation; robustness, stability margins and disturbance rejection; infeasibility and unreachability; and the difference between a controller you can certify and one you have only validated empirically. Translate into exactly that vocabulary, as faithfully as you can, the following six claims: (1) anti-intellectualism, understood as the view that to know how to do something is to possess a policy that produces success reliably across the relevant range of conditions, with nothing in the account requiring an inspectable, propositionally formatted representation of how the thing is done; (2) the regress consideration that drives that view, namely that if every competent performance required consulting such a representation and then applying a rule to it, the applying would itself be a performance requiring a further consultation, so that something must be competent without consulting anything; (3) intellectualism, understood as the view that knowing how is a matter of standing in some propositional attitude to a proposition about a way of doing the thing, together with the fallback position that the relevant attitude need be neither consciously accessible nor verbally formattable; (4) the claim that knowing how, unlike mere reliable success, is factive, in that there must be a fact of the matter about how the thing is to be done; (5) the claim that what the debate is really about is guidance, so that a performance manifests knowledge-how only if the agent guides it as it goes along and not merely if something in the agent generates the correct trajectory; and (6) the claim that knowledge-how is what separates intelligent from merely successful performance, so that a superbly tuned but unguided mechanism would not count as skilled.

  Then give me the residue report, which is the part I actually care about: for each of the six, say what translated cleanly, what translated only after you quietly added or dropped something, and what resisted translation altogether, and say in each case whether the resistance is a gap in my engineering vocabulary or a sign that the philosophical claim was never very determinate. I have three cases I want you to run through the translation as a check on yourself, because I think they pull in different directions. First, the transfer case: a policy trained to genuine competence on one plant is deployed on a modified plant and its performance collapses in a way not predicted by anything the agent can report about what it was doing; is that best described as the absence of knowing that, and is the intellectualist committed to predicting the collapse? Second, the one-shot instruction case: a competent agent told a single true sentence about how to do something it has never done immediately does it tolerably well, which seems to show a route from proposition to policy that the anti-intellectualist must accommodate as a process of compilation whose intermediate stages are difficult to locate in time. Third, the recombination case: an agent that reliably does A and reliably does B in the settings in which it learned each cannot do A followed by B in a novel setting, even though it can state perfectly well that the novel setting calls for A and then B. Finally, tell me where you think the philosophical dispute turns out to be merely verbal once it is put in control-theoretic terms. I have in mind especially the question whether a learned latent state or a set of tuned gains is a representation with correctness conditions at all: my old vocabulary has no settled answer to that, and the philosophers seem to me to be leaning on one.
reasoning: |-
  We are translating philosophical claims about knowledge-how into control-theoretic vocabulary. The target vocabulary includes: plant, environment, controller/policy, state estimator, closed-loop vs open-loop, feedforward vs feedback, world model, model-based control (including MPC with online optimisation and receding horizon) vs model-free (amortised) policies (via tuning or RL), system identification, hierarchical architectures (outer loop sets setpoints for inner), gain scheduling/adaptation, robustness/stability margins/disturbance rejection, infeasibility/unreachability, and certified vs empirically validated controllers.

  We are to translate six claims and then provide a residue report for each. Then we consider three cases and finally comment on whether the dispute is verbal.

  Translation of the six claims:

  (1) Anti-intellectualism: 
      Translation: Knowing how to perform a task is to possess a controller (or policy) that, when coupled with the plant (the agent's body and the environment), produces successful behaviour (i.e., achieves the task goals) reliably across the expected operating envelope (the relevant range of conditions). This controller does not require an inspectable, propositionally formatted representation (such as a world model) of the dynamics of the plant or the task.

  (2) The regress argument for anti-intellectualism:
      Translation: If every instance of competent control required first consulting a propositionally formatted representation (like a world model) and then applying a rule (a control law) based on that representation, then the application of the rule would itself be a control action that would require a further consultation of a representation (and so on). Therefore, at some level, the control must be executed without consulting any representation — that is, there must be a policy that operates without reference to a model (a model-free policy).

  (3) Intellectualism (with fallback):
      Translation: Knowing how to perform a task is a matter of having a standing propositional attitude (like belief or acceptance) towards a proposition that specifies a way (a policy or a set of instructions) for doing the task. The fallback position is that this attitude need not be consciously accessible (i.e., the agent might not be able to introspect it) nor verbally formattable (i.e., it might not be encoded in natural language symbols). In control terms, this might correspond to having an internal world model that represents the task and the way to perform it, even if that model is not explicitly available for inspection.

  (4) Factivity of knowing how:
      Translation: Unlike a policy that merely produces reliable success (which might be achieved by luck or in a way that is not robust), knowing how requires that there is a fact of the matter about the correct way to perform the task. That is, the policy must be such that it is grounded in the actual dynamics of the plant and environment (so that the success is not accidental). In control terms, this might be linked to having a controller that has been designed or adapted with a correct model (or having robustness properties that ensure it works for the right reasons).

  (5) Guidance requirement:
      Translation: A performance manifests knowledge-how only if the agent is guiding the behaviour in real-time (i.e., using closed-loop control with feedback) and not merely generating a precomputed trajectory (open-loop). Thus, the controller must be responsive to the state of the plant and environment during execution.

  (6) Intelligent vs merely successful performance:
      Translation: Knowledge-how is what distinguishes an intelligent performance (which can adapt to perturbations and is robust) from a merely successful one (which might be brittle). A highly tuned but unguided mechanism (e.g., a precomputed trajectory executed open-loop) that achieves the goal in nominal conditions would not count as skilled because it lacks the ability to adjust to disturbances or changes.

  Residue report for each claim:

  (1) Translation: Clean. We have a direct mapping: "possess a policy that produces success reliably" is core control language. The absence of an inspectable propositional representation maps to model-free policies (which are not based on an explicit world model). However, note that in control theory, even model-free policies may have internal state (like in recurrent networks) but they are not inspectable in a propositional format. The translation captures the essence.

  (2) Translation: Mostly clean. The regress is well captured by the idea that if every control action required a model-based lookup and rule application, we'd need a controller for the controller, leading to infinite regress. Hence, we must have model-free execution at some level. However, the philosophical regress is about the requirement of a representation for every action, while in control, we break the regress by having a policy that is a direct mapping from state to action without an intermediate representation. The translation is faithful.

  (3) Translation: Some addition. The intellectualist claim of a propositional attitude is translated as having a world model (which is a representation with correctness conditions). The fallback about not being consciously accessible or verbally formattable is handled by noting that the model might be implicit (e.g., encoded in weights of a neural network). However, the control vocabulary does not have a direct term for "propositional attitude", so we used "internal world model". This might be a slight extension because a world model is typically seen as representational, but the fallback about accessibility is covered by the fact that models in control can be implicit. The resistance is that the philosophical notion of "propositional attitude" is broader than what we have in control (which is about representation of dynamics). We added the idea of the model being non-inspectable to cover the fallback.

  (4) Translation: Added robustness and grounding. The claim that knowing how is factive requires that there is a correct way. In control, we capture this by saying the policy must be robust (so it works for the right reasons) and grounded in the actual plant dynamics (so it's not just lucky). We also have the concept of a controller that is designed using a correct model (model-based) as opposed to one that happens to work (which might be model-free but still robust). However, note that a model-free policy can also be factive if it is robust and generalises appropriately. The residue: the philosophical term "factive" is not directly in control, so we had to interpret it in terms of robustness and non-accidentality. This might be a gap in the engineering vocabulary for the specific philosophical notion of factivity, but we have close analogues.

  (5) Translation: Clean. The distinction between closed-loop (feedback) and open-loop (feedforward without feedback) is standard. The requirement of guidance is exactly closed-loop control with real-time state feedback.

  (6) Translation: Clean. The contrast between a robust, adaptive controller (which can handle disturbances) and a brittle, open-loop controller is standard. The unguided mechanism is open-loop and hence not skilled because it cannot adjust.

  Now the three cases:

  First, the transfer case:
      Scenario: A policy (controller) trained to be competent on one plant (original environment and body) is deployed on a modified plant (e.g., a different vehicle or altered dynamics). Its performance collapses, and the agent (if a human) cannot report why (i.e., it has no accessible representation of what went wrong).

      Intellectualist perspective: The intellectualist would say that the agent never had the propositional knowledge (world model) that accurately represented the modified plant. Hence, the collapse is due to the absence of knowing that (the true dynamics). The intellectualist is committed to predicting the collapse only if they hold that the original knowledge-how depended on a world model that did not account for the modification. However, note the fallback: the intellectualist might say that the original policy was model-free and hence the agent didn't have a world model to begin with? But the intellectualist typically says knowledge-how is propositional, so they might have to say that the agent had a world model that was incorrect for the new plant. Hence, they would predict collapse if the model was not updated.

      In control terms: This is a classic failure of transfer due to a mismatch between the plant and the controller's assumptions. If the controller was model-based, then we can inspect the model and see that it doesn't match the new plant. If it was model-free, then we have no such model to inspect. The collapse is due to the lack of robustness to that specific plant variation. The intellectualist might be committed to the collapse if they insist that the original knowledge-how required a correct model (which the agent doesn't have for the new plant). But note the policy might have been model-free and the agent might still have had a world model (as per intellectualism) that was not used in control? This is messy.

      How we describe it: The collapse is due to the policy not being robust to the plant variation. The agent's inability to report indicates that the original policy was model-free (or that the model was not accessible). The intellectualist is not necessarily committed to predicting the collapse because they might hold that the agent has a model that is correct for the original plant but not for the new one, but they don't claim that the model must be general. However, if the intellectualist claims that knowledge-how requires a general model (which they don't necessarily), then they might predict the collapse. Without that, they might not.

      Best description: The absence of a correct world model for the new plant (if we are intellectualist) or the lack of robustness in the policy (anti-intellectualist). The intellectualist is not inherently committed to predicting the collapse because the original knowledge-how might have been about the old plant only.

  Second, the one-shot instruction case:
      Scenario: A competent agent (with general skills) is told a single true sentence (a proposition) about how to do a novel task and immediately performs it tolerably well.

      Anti-intellectualist must accommodate: They must explain how a proposition can be compiled into a policy very quickly (without extensive learning). This might involve the agent having a general-purpose compiler (a meta-policy) that can transform the proposition into a policy by using existing skills and models.

      In control terms: The agent has a hierarchical architecture where a high-level planner (outer loop) can take a symbolic instruction (the proposition) and generate setpoints for low-level controllers (inner loops) that are already tuned. The agent uses a world model to interpret the instruction and generate a plan (which is a policy for the task). The compilation is the process of using the world model to generate the policy. The intermediate stages are the planning steps (which might be very fast and not accessible to introspection).

      Translation: This case supports intellectualism because it shows the use of a world model to generate a policy on the fly. However, the anti-intellectualist can say that the agent already has a set of policies (skills) and the instruction simply selects and sequences them (without requiring a full model). The compilation might be a process of skill composition.

  Third, the recombination case:
      Scenario: An agent that reliably does A and reliably does B in the settings in which it learned each, but when faced with a novel setting that requires A then B, it fails, even though the agent can state that the setting calls for A then B.

      Interpretation: The agent has policies for A and B that are tuned for their original contexts but are not transferable to the new context. The failure might be due to the lack of a higher-level policy that can sequence A and B appropriately in the new setting, or due to the low-level policies not being robust to the new context.

      In control terms: The agent has two sub-controllers for A and B, but they are not designed to be composed. The outer loop that should sequence them is missing or not adapted to the new setting. The agent's ability to state the sequence indicates that it has a world model that represents the need for A then B, but it lacks the control architecture to execute that sequence in the new context (or the inner policies are not robust to the new state).

      This case supports intellectualism because the agent has the propositional knowledge (world model) that A then B is required but fails to execute, showing that knowledge-how (the control policy) is separate. However, the anti-intellectualist might say that the agent simply lacks a policy for the sequence in that context, which is consistent.

  Finally, where the dispute is merely verbal:

  The key point of verbal dispute is about what counts as a "representation with correctness conditions". In control theory, we have:
     - Model-based control: uses an explicit world model (with correctness conditions) for planning.
     - Model-free control: uses a policy that is a direct mapping from state to action, which may have been acquired by learning (tuning or RL). This policy may be implemented as a neural network with latent state, but we don't typically say it has correctness conditions in the same way. It's more about input-output mappings.

  The philosophers are leaning on whether a set of tuned gains (in a PID controller) or a learned latent state (in a recurrent policy) is a representation. In control, we don't have a settled answer. Some might see the entire policy as a representation of the control law, but without propositional structure. The dispute between intellectualism and anti-intellectualism might reduce to whether we count these non-propositional structures as representations. If we define representation broadly to include any internal state that carries information, then model-free policies might count. But the intellectualist typically requires a propositional format, which the model-free policy lacks. The anti-intellectualist says that the policy itself (without a representation) is sufficient.

  Thus, the dispute turns on whether we require a propositionally formatted representation. In control, we can have both model-based (with representations) and model-free (without) controllers that are competent. The residue is that the philosophical dispute is about the necessity of a specific kind of representation, which is not required by the control framework. Hence, the dispute is verbal in that it hinges on the definition of "representation" and whether it must be propositional.

  Conclusion: The translation shows that the control framework can capture the key claims, but the dispute about representation remains. The cases highlight that both model-based and model-free controllers have their strengths and weaknesses, and the choice depends on the task and the environment. The philosophical dispute about knowledge-how might be better understood by acknowledging that both types of control exist and that the distinction between them is important for understanding skill.
answer: |-
  ### Translation into Control-Theoretic Vocabulary

  #### (1) Anti-intellectualism  
  **Translation**: Knowing how to perform a task is the possession of a **controller** or **policy** that, when coupled with the **plant** (agent and environment), achieves reliable success across the operational envelope. This policy requires no **inspectable, propositionally formatted representation** (e.g., no explicit **world model**) of how the task is executed; it may be **model-free**, **amortised** via **tuning** or **reinforcement learning**, and deployed without internal symbolic reasoning.  

  #### (2) Regress Argument  
  **Translation**: If every competent execution required consulting a **world model** (propositionally formatted representation) and applying a rule to it, the application step would itself demand a further **controller** to execute, initiating infinite regress. Thus, foundational competence must reside in a **closed-loop policy** operating without model consultation—e.g., a **feedback-driven controller** that acts directly on sensory inputs.  

  #### (3) Intellectualism (with Fallback)  
  **Translation**: Knowing how is a **propositional attitude** (e.g., acceptance) toward a proposition specifying a **policy** or **way of achieving the task**. Crucially, this attitude need not entail conscious access or verbal expressibility; it may be encoded in a **latent world model** (e.g., an internal dynamics representation) used for **model-based control** (e.g., **model predictive control**), even if the model is sub-symbolic and non-inspectable.  

  #### (4) Factivity Claim  
  **Translation**: Unlike mere **reliable success** (which could arise from **over-tuned policies** or fortuitous disturbances), knowing how requires **factivity**: the policy must align with the **actual dynamics** of the plant and environment. This implies **robustness**—achieving goals despite **disturbances**—and excludes policies that succeed accidentally (e.g., those validated empirically but lacking **stability margins**).  

  #### (5) Guidance Requirement  
  **Translation**: A performance manifests knowledge-how only if the agent **guides it in real-time** via **closed-loop control** (using **feedback** from state estimates), not merely by executing **open-loop trajectories** or **feedforward commands**. Guidance requires continuous **state estimation** and adjustment, distinguishing it from precomputed paths.  

  #### (6) Intelligent vs. Merely Successful Performance  
  **Translation**: Knowledge-how separates **intelligent performance** (adaptive, **robust**, with **disturbance rejection**) from **merely successful performance** (achieving goals in nominal conditions without adaptability). A **highly tuned open-loop controller** generating perfect trajectories without feedback lacks skill; intelligence requires **closed-loop policies** capable of online optimisation.  

  ---

  ### Residue Report  
  *(Per claim: what translated cleanly, what required adjustment, and sources of resistance)*  

  #### (1) Anti-intellectualism  
  - **Clean translation**: "Policy" maps directly to competence; "model-free" captures absence of explicit representations.  
  - **Adjustment**: "Propositionally formatted" was interpreted as "requiring symbolic decomposition" (e.g., a world model with inspectable states). Resistance arose with "possess": engineering focuses on policy *function*, not ontology.  
  - **Resistance**: Philosophical "possession" is underspecified—is a PID controller "possessed"? This is indeterminacy in philosophy, not a vocabulary gap.  

  #### (2) Regress Argument  
  - **Clean translation**: "Model consultation" → "world model lookup"; "competence without consultation" → "feedback-driven execution".  
  - **Adjustment**: "Applying a rule" became "executing a control law", but the regress assumes *all* rules are symbolic, while control laws can be arithmetic (e.g., PID).  
  - **Resistance**: The argument presumes a dichotomy (symbolic vs. direct action) absent in control theory, where arithmetic rules (e.g., gains) are neither "consulted" nor propositional. Philosophical indeterminacy.  

  #### (3) Intellectualism  
  - **Clean translation**: "Propositional attitude" → "implicit world model"; "way of doing" → "policy specification".  
  - **Adjustment**: "Standing in an attitude" was mapped to "encoding a dynamics model", but attitudes are psychological, while models are functional.  
  - **Resistance**: "Attitude" implies normativity (e.g., justification), which control lacks. Engineering has no analogue for "acceptance"—only functional representations. Philosophical gap.  

  #### (4) Factivity  
  - **Clean translation**: "Factivity" → "robustness to disturbances" and alignment with "actual plant dynamics".  
  - **Adjustment**: "Fact of the matter" became "correct system identification", but factivity is metaphysical (truth-apt), while robustness is empirical.  
  - **Resistance**: Control theory assesses policies via **validation** (empirical success) and **certification** (formal guarantees), not "truth". Philosophy conflates correctness with functionality.  

  #### (5) Guidance  
  - **Clean translation**: "Guiding" → "closed-loop control with feedback"; "as it goes along" → "real-time state estimation".  
  - **Adjustment**: "Manifests knowledge-how" assumes guidance is sufficient for skill, but a brittle controller may guide poorly.  
  - **Resistance**: None. Engineering vocabulary fully captures the distinction.  

  #### (6) Intelligent Performance  
  - **Clean translation**: "Unguided mechanism" → "open-loop trajectory"; "intelligent" → "adaptive closed-loop policy".  
  - **Adjustment**: "Superbly tuned" mapped to "high-fidelity feedforward", but tuning can apply to closed-loop systems.  
  - **Resistance**: None. Control theory operationalises intelligence via adaptability.  

  ---

  ### Case Analyses  
  *(Translated into control-theoretic terms)*  

  #### 1. **Transfer Case**  
  - **Scenario**: A **model-free policy** (e.g., RL-tuned) trained on Plant A fails on Plant B (modified dynamics). The agent cannot report why.  
  - **Intellectualist prediction**: Collapse implies absence of a **correct world model** for Plant B. Intellectualism *is* committed to predicting failure if knowledge-how requires an accurate model.  
  - **Anti-intellectualist view**: The policy was never **robust** to such perturbations; failure stems from **overfitting**, not missing propositions.  
  - **Verdict**: Intellectualism overreaches—model-free policies can be robust without models. Control theory explains this via **generalisation bounds**, not propositional lack.  

  #### 2. **One-Shot Instruction Case**  
  - **Scenario**: A novel task is described via a proposition (e.g., "Apply gain K at state S"). The agent executes it competently.  
  - **Anti-intellectualist accommodation**: The proposition **compiles** into a policy via **hierarchical control**: the outer loop (symbolic) sets **setpoints** for inner loops (tuned policies). "Compilation" is rapid **controller synthesis** using existing sub-policies.  
  - **Challenge**: Locating "intermediate stages" maps to **online optimisation** (e.g., MPC solving for setpoints)—a process with no discrete temporal stages.  

  #### 3. **Recombination Case**  
  - **Scenario**: Policies for tasks A and B work in isolation but fail when sequenced in a novel setting, despite the agent stating "do A then B".  
  - **Control-theoretic explanation**: The failure reveals **infeasibility** in hierarchical control—the outer loop issues valid setpoints, but inner loops lack **adaptation** (e.g., **gain scheduling**) for the new context. The agent’s statement reflects a **world model**, but the **policy architecture** lacks modularity.  
  - **Implication**: Supports intellectualism’s distinction: propositional knowledge (setpoints) ≠ executable policy (inner loop competence).  

  ---

  ### Verbal Dispute Identification  
  The core verbal dispute centers on **whether tuned gains or latent states constitute "representations"**.  
  - **Intellectualism**: Asserts that even **implicit representations** (e.g., neural network weights) have "correctness conditions" (truth-aptness).  
  - **Anti-intellectualism**: Denies this, treating such states as **amortised policies** without semantic content.  
  - **Control-theoretic resolution**: The vocabulary has **no settled view**.  
    - A **tuned gain** (e.g., PID) is a parameter, not a representation; it has no "correctness" beyond stability margins.  
    - A **latent state** (e.g., in LSTM) may encode dynamics but lacks propositional structure—it’s **validated** (works) not **certified** (true).  
  - **Conclusion**: The dispute is verbal. Philosophers impose a binary "representation/no representation" framework where engineering sees a continuum from **model-free policies** (non-representational) to **model-based controllers** (explicit representations). Requiring "propositional formatting" for all representations is a philosophical imposition absent in control theory.
