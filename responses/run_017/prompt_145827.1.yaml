prompt: |-
  Hi — I'm a journalist covering science and ideas, and I've been reporting on effective altruism on and off for about a decade: the pledge, the earning-to-give years, the turn toward longtermist cause areas, the blowups, the critiques. I want to write a piece not on who's right but on why the argument never moves. Every time I publish something on EA I get the same three complaints in my inbox, and every time I put them to an EA I get the same three replies, and nobody concedes anything, which after ten years looks to me like a structural fact about the dispute rather than stubbornness.

  The three, as I'd spell them out: (1) the institutional or structural critique — that EA treats every problem as an allocation problem for individual wallets and donors, and so systematically ignores who holds power and why the arrangements that produce the harm persist; the usual reply is that EA only ever asked which use of a dollar does the most good, and would happily fund institutional change if that's what the evidence favoured. (2) the earning-to-give critique — that taking a lucrative job in finance or tech and giving most of it away makes you complicit in the harms of the industry and turns morality into a ledger you can balance at the end of the month; the reply is that the counterfactual does the work, since if you hadn't taken the job someone else would have, and they wouldn't have donated. (3) the measurability critique — that the money flows to whatever is quantifiable and near-term rather than to what matters most, and that the numbers come out of the same models as the interventions, so the measurement isn't independent of what it's measuring; the reply is that uncertainty isn't a reason to weight everything equally, and that making the reasoning explicit at least exposes it to correction.

  My working hypothesis is that this isn't one stalled disagreement but three of different logical types marching under one banner: (a) an empirical question about leverage, replaceability and causal attribution in systems where the counterfactual is contested; (b) a question about the unit of moral agency — individual, institution, movement, or something else; (c) an epistemic question about acting on measurements when the metric and the intervention are model-dependent in the same way. And then something leftover that I don't have a name for: critics often seem to be objecting to the legitimacy of a bunch of wealthy donors deciding what counts as the world's most pressing problems, which isn't an efficacy claim at all, and no amount of evidence about bednets or cash transfers would touch it. I've started calling that the authorization problem, since what's at issue is who gets to do the prioritizing, not what the priorities should be.

  So: diagnose it. For each of the three (plus the leftover), tell me what kind of disagreement it actually is — factual, about units of agency, about which values, about the standard of argument, verbal, or a mix — and whether my hypothesis is right or whether I'm manufacturing tidiness. Is any of it a genuinely verbal dispute riding on 'effective', 'the most good', or 'systemic'? Is there a hidden empirical question that, if somebody actually answered it, would settle part of it? What would count as progress for each, concretely — a study, a distinction, a change of question — and is there any part where I should just tell my readers no progress is available and why? A table with the critiques down the side would be easiest for me to work from, but I don't want a survey of who said what and I don't want a verdict on who wins; I want the shape of the thing.

  End with a final line \answer{...} containing at most six words naming the single thing you think is really holding the debate up.
reasoning: |-
  Hmm, the user is a science journalist who's been covering effective altruism (EA) for about a decade. They want to write a piece on why the arguments about EA never seem to move forward. They've identified three recurring critiques they always hear and get the same responses to, creating a stalemate situation.

  The journalist describes the three main critiques as: (1) the institutional/structural critique about EA ignoring power dynamics and focusing only on individual donations; (2) the earning-to-give critique about complicity in harmful industries; and (3) the measurability critique about favoring quantifiable, near-term interventions. For each, they get predictable responses from EA proponents.

  They have a working hypothesis that these represent three different types of disagreements: empirical questions about leverage and counterfactuals; questions about moral agency (individual vs institutional); and epistemic questions about model-dependent measurements. They also identify an "authorization problem" - who gets to decide what the world's most pressing problems are.

  I need to diagnose the nature of each disagreement without taking sides. For each critique, I'll identify what kind of disagreement it is (factual, about agency, values, standards of evidence, etc.), whether the journalist's hypothesis is accurate, and what might constitute progress. I'll also address whether any part is purely verbal or could be settled by empirical evidence.

  For the institutional critique, this is fundamentally about units of moral agency. EAs focus on individuals while critics emphasize systems and institutions. Progress might look like case studies showing institutional change successes or developing decision frameworks that incorporate power dynamics.

  For the earning-to-give critique, this is an empirical question wrapped in moral disagreement. The debate centers on contested counterfactuals and complicity. Progress would require better empirical work on labor market dynamics and job replaceability, plus clearer definitions of complicity.

  For the measurability critique, this is an epistemic disagreement about how to handle uncertainty and model dependence. Progress might involve developing frameworks for comparing measurable vs. structural interventions or creating better metrics for long-term impacts.

  The "authorization problem" is a meta-disagreement about legitimacy and values - who should set priorities. This is less about evidence and more about democratic principles versus expertise-based decision making. Progress here is difficult but might involve EA being more transparent about priority-setting processes.

  The core issue preventing progress seems to be "incommensurable foundations" - the different starting points make it difficult to find common ground. The debates are happening on different planes rather than being resolvable through evidence alone.
answer: |-
  Here's a diagnosis structured as requested, focusing on the logical types of disagreement, your hypothesis, potential paths to progress, and inherent limitations. Your framing of "different logical types marching under one banner" is largely correct; the disputes operate on distinct planes, making resolution elusive. The "authorization problem" is a crucial addition.

  | Critique                 | Type of Disagreement                                                                 | Hypothesis Accuracy                                                                 | Potential Paths to Progress                                                                                         | Intractable Element?                                                                 |
  | :----------------------- | :----------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------ | :----------------------------------------------------------------------------------- |
  | **1. Institutional/Structural** | **Primarily ontological/agential** (Unit of agency: individual vs. system). Secondarily *empirical* (leverage points) & *methodological* (how to analyze systems). | **Accurate.** Core is agency unit clash. EA's "happily fund if evidence favored" reply assumes individual agency *can* effectively target systems, which critics dispute ontologically. | Case studies demonstrating EA funding successfully altering power structures. Development of EA decision frameworks *explicitly* incorporating power/movement-building metrics alongside cost-effectiveness. | **Yes:** If critics view *all* individual-donor-driven action within unjust systems as inherently illegitimate/co-opted, evidence won't bridge this. |
  | **2. Earning-to-Give**   | **Empirical** (counterfactuals, replaceability) **+ Moral/Deontological** (complicity, integrity). | **Accurate.** Empirical (replaceability) is tractable *in theory*. Moral (complicity) is foundational. EA's reply addresses the empirical but dismisses/ignores the moral critique as irrelevant. | Rigorous empirical studies on job fungibility in specific sectors/roles. Explicit EA guidelines defining "complicity thresholds" or unacceptable roles. Philosophical work reconciling consequentialism with integrity/complicity concerns. | **Yes:** The core moral clash (Is complicity inherently wrong, even if net-positive?) is value-based. Evidence on replaceability won't satisfy someone for whom participation is *intrinsically* immoral. |
  | **3. Measurability**     | **Epistemic** (Handling model-dependency & uncertainty) **+ Methodological** (What counts as valid evidence/measurement). | **Accurate.** EA's "explicit reasoning" reply doesn't resolve model-dependency. Critics see *over-reliance* on quantifiable proxies as distorting priorities *by design*. | Development of "uncertainty-adjusted" impact assessment frameworks. Funding for rigorous studies *comparing* measurable vs. structural interventions in similar contexts. Adoption of explicit "sensitivity analysis" standards showing how model choices affect outcomes. | **Partial:** While better uncertainty tools help, the clash over whether *any* model-dependent quantification can validly prioritize truly "systemic" work vs. inherently favoring the measurable persists. |
  | **4. Authorization Problem** | **Meta-Ethical/Political** (Legitimacy, democratic deficit) **+ Value-Based** (Who *should* decide priorities). | **Crucially Accurate.** This underpins the stalemate. It's not about efficacy evidence; it's about procedural legitimacy and moral authority. EA's focus on "doing good" sidesteps "who authorized *you*?" | EA institutions diversifying funding sources & decision-makers beyond wealthy donors. Transparent, participatory priority-setting processes within EA. Explicit acknowledgment of the "elite philanthropy" critique and its limits. | **Largely Yes:** The core demand (democratic control over societal priorities) is incompatible with EA's foundational model (identifying & funding the "most good" via expert analysis/donor choice). Evidence on impact is irrelevant here. |

  **Key Diagnoses & Your Hypothesis:**

  1.  **You're Manufacturing Tidiness? No.** Your separation into distinct logical types (empirical, agential, epistemic, legitimacy) is insightful and necessary. Treating these as one "debate" obscures why it stalls.
  2.  **Verbal Disputes?** Minor role. While terms like "systemic" or "effective" can be fuzzy, the core disagreements are substantive. Disagreements over "complicity" or "legitimacy" are conceptual/moral, not merely semantic.
  3.  **Hidden Empirical Questions?** Yes, particularly for **Earning-to-Give** (actual job fungibility in specific contexts) and **Measurability** (robust comparisons of quantifiable vs. structural intervention impacts *over time*). Resolving these *could* shift the empirical ground but wouldn't eliminate the deeper agential or legitimacy clashes.
  4.  **Progress Possible?** For **Institutional**: Concrete EA wins on power-structure change. For **Earning-to-Give**: Better replaceability data + ethical guidelines. For **Measurability**: Better uncertainty tools + comparative studies. For **Authorization**: EA democratization efforts (though core tension remains). **Telling Readers "No Progress Available"?** Highlight the **Authorization Problem** as fundamentally value-based and political – evidence about bednets won't resolve whether elite donors *should* set global priorities. Similarly, the core *moral* clash in **Earning-to-Give** (integrity vs. net impact) may be intractable.

  **The Shape of the Thing:** The debate stalls because critiques operate on multiple, often incompatible, levels: empirical evidence, moral frameworks, epistemic standards, and foundational beliefs about legitimacy. EA replies typically engage only on the empirical/methodological level relevant to *its own* framework (counterfactuals, cost-effectiveness), dismissing or misunderstanding the deeper ontological, ethical, or political challenges. The lack of shared premises or agreed-upon "rules of engagement" across these levels prevents resolution.

  \answer{Incommensurable foundational premises.}
