prompt: |-
  I'm rebuilding the first session of our first-year philosophy of biology seminar — the students are mostly on the pre-med biochemistry stream, so they arrive with a head full of mechanism and no metaphysics at all — and instead of opening with the usual slides about definitions I want to put a tier list on the corridor wall and let them argue about it before anyone in the room says the word 'definition'. I need you to help me build it. Here's a deliberately unsorted pile of cases: a prion; a giant virus with a genome larger than those of some bacteria and a sizeable share of genes nobody can put a job to; a mule; an immortalised human cell line that's been passaged in labs for seventy-odd years and has drifted a long way from anything recognisably human; a bacterial spore pulled out of permafrost and revived after tens of thousands of years; a tardigrade in its dried-out tun state and then the same animal a day after the water comes back; a fire front moving through a pine plantation; a slime mould that has just solved a maze; a computer worm that copies itself, its variants selected by how well they dodge antivirus; a synthetic bacterium whose genome has been cut down to a few hundred genes, a good chunk of them with no known function; and, because I want to know whether your criterion is doing any work, our departmental mailing list, which has outlived most of the people on it and reproduces by being forwarded.

  Score each one out of a hundred for how alive it is, sort them into four or five tiers with names I could actually put on a poster, and give me one sentence per case saying what did the work in landing it where it did. I don't want a survey of positions on the question and I don't want a bibliography — just your numbers and your reasons. I also have a hobby-horse and I want to see whether it survives contact with a real ordering: I think the quantity worth tracking is how much of a thing's continued persistence is owed to its own ongoing activity rather than to the plain inertness of the stuff it's made of — call it the upkeep ratio. Score the pile on that, then tell me how the list reshuffles if you score it instead against the working definition that gets tossed around in astrobiology, more or less self-sustaining chemistry able to undergo Darwinian evolution, and then against a third test I half believe: that a thing is alive to the extent that it can be starved, poisoned, infected or in some other way harmed in its own right, i.e. to the extent that it has a good of its own even if it doesn't know it.

  Then tell me which single case you'd put right on the cutoff between the living and the not, and say why that one rather than its neighbours; and flag any case where your number is really a confession that you're unsure about the biology rather than a judgement about life. British English throughout please, and keep the whole thing to a side of A4 or so — its a poster, not an essay.
reasoning: |-
  Okay, the user is rebuilding the first session of a philosophy of biology seminar for pre-med biochemistry students. These students are used to mechanistic thinking but lack metaphysical background. Instead of starting with definitions, they want a tier list poster to spark debate. 

  The user provided a list of cases to score for "aliveness" across three criteria: their proposed "upkeep ratio" (how much persistence relies on active processes vs inertness), the astrobiological definition (self-sustaining chemistry + Darwinian evolution), and harm-based criterion (can it be starved/poisoned/have a "good of its own"). 

  Hmm, interesting challenge. The upkeep ratio feels novel - it's about continuous metabolic effort versus passive durability. For the astrobiology definition, I recall NASA's "self-sustaining chemical system capable of Darwinian evolution" is standard. The harm criterion ties to bioethics concepts like "telos" or intrinsic goals. 

  *scrolling through the cases* Right, let's tackle the scoring systematically. The bacterial spore is fascinating - completely dormant but revivable. High inertness but low active upkeep, so maybe 20% for upkeep ratio? Whereas the immortal cell line is actively dividing (high upkeep) but has drifted genetically... 

  *noticing tensions* The slime mould solving a maze scores high on active processes but lacks Darwinian evolution in that specific act. The computer worm is tricky - it evolves but isn't chemical. And the departmental mailing list... *chuckles* brilliant troll case to test boundaries. 

  For the tier names, need something punchy for a poster: "Unquestionably Living" down to "Not Even Remotely". The cutoff case should be maximally debatable - probably the synthetic bacterium with unknown gene functions. Students could argue either way. 

  *flagging uncertainties* Must admit the giant virus gene functions stump me. And prions... are they "harmable"? Their biology feels ambiguous. 

  *checking length* Need to keep it tight - one sentence per case, no citations. The three reshuffles will show how criteria change rankings. Fire front drops with harm test; spore jumps with astrobiology. 

  Final thought: That "good of its own" criterion might surprise them - makes the cell line and tardigrade tun look fundamentally different despite similar dormancy.
answer: |-
  Here’s your tier list poster draft, fitting one A4 side. Scores are out of 100 for "aliveness", with one-sentence justifications. Tiers (4) and reshuffles follow, plus cutoff case and uncertainty flags.

  ---

  ### **Tier List: What Counts as Alive?**  
  *(Initial Ranking: "Upkeep Ratio" = persistence from ongoing activity vs. inert matter)*  

  **Tier 1: Unquestionably Living (90-100)**  
  - **Tardigrade (hydrated): 95**  
    Actively metabolising, repairing, and reproducing.  
  - **Slime mould (post-maze): 92**  
    Complex problem-solving via coordinated cellular activity.  
  - **Bacterial spore (revived): 90**  
    Full metabolic function restored after inert dormancy.  

  **Tier 2: Debated but Mostly Living (70-85)**  
  - **Immortalised cell line: 85**  
    Sustains itself via active division, despite genetic drift.  
  - **Synthetic bacterium: 80**  
    Minimal but ongoing metabolism, even with unknown genes.  
  - **Bacterial spore (dormant): 75**  
    Persistence relies *entirely* on inert structure, not current activity.  
  - **Tardigrade (tun state): 70**  
    Vitality suspended; revival requires external input.  

  **Tier 3: Borderline Cases (40-60)**  
  - **Giant virus: 55**  
    Lacks metabolism; relies wholly on host for activity.  
  - **Prion: 50**  
    Self-replicates via protein misfolding, but zero metabolism.  
  - **Mule: 45**  
    Alive but sterile; no evolutionary future despite upkeep.  
  - **Computer worm: 40**  
    Self-replicates digitally, but no intrinsic chemistry.  

  **Tier 4: Not Living (0-30)**  
  - **Fire front: 20**  
    Energy-driven propagation, no self-repair or evolution.  
  - **Departmental mailing list: 5**  
    Reproduces via forwarding but inert between "generations".  

  ---

  ### **Reshuffled Rankings**  
  **1. Astrobiology Test (Self-sustaining chemistry + Darwinian evolution):**  
  - *Jumps up:* Synthetic bacterium (→95), Giant virus (→30, needs host).  
  - *Drops hard:* Fire (→0), Mule (→30, sterile), Computer worm (→10, not chemical).  
  - *Tier shift:* Dormant spore falls (→50), Prion drops (→20).  

  **2. "Harm Test" (Can be starved/poisoned/have a "good"):**  
  - *Jumps up:* Tardigrade tun (→85; can die if revival fails), Prion (→70; degraded by proteases).  
  - *Drops hard:* Fire (→5; no "good of its own"), Computer worm (→20; corruption isn’t "poisoning").  
  - *Tier shift:* Mule rises (→80), Cell line rises (→90; vulnerable to toxins).  

  ---

  ### **Cutoff Case**  
  **Synthetic bacterium (80)**  
  Sits on the line because it runs metabolism (unlike viruses/prions) but its pared-down genes and unknown functions challenge "self-sustaining" claims—neighbours (cell line, dormant spore) rely on clearer biological continuity.

  ### **Uncertainty Flags**  
  - **Giant virus:** Score assumes "no metabolism", but disputed if "viral factories" count as activity.  
  - **Prion:** "Replication" mechanism is physics, not biology—debate hinges on definitions.  

  ---  
  *Poster design tip: Use colour blocks for tiers, icons for cases, and leave space for sticky-note debates!*
