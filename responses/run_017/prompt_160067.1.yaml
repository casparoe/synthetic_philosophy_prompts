prompt: |-
  I teach an upper-level philosophy of science seminar: fourteen students, one ninety-minute session, no equipment beyond a projector, index cards and data I generate in advance, and no real money for stakes. They have already done a week each on confirmation and on the theory-ladenness of observation, and their working instinct is that evidence "adds up" toward the truth of a theory — that with enough of it, the theory is eventually forced on you. Next week is underdetermination, and I want them to run into the problem rather than hear about it: no framing lecture up front, and I would rather the distinctions get their names only in the debrief.

  Here is the shape I have been toying with, which you should either make work or replace with something better. Stage one: small groups interrogate a hidden rule or mechanism under a strictly limited budget of probes they choose themselves — they design the experiments — and end up with two live candidate theories that fit everything they have been able to observe, then bet, for points, on which one is right. The rule should be such that collecting more data of the same kind does not help, so the frustration is the point. Then a beat I am less sure about: hand one group a different background assumption, an auxiliary they did not know they were relying on, and let them discover that the tie between their rivals was contingent on it and can break without any new evidence arriving. Stage two, after the bets are locked: reveal that the actual rule was never in any group's hypothesis space, so the failure was not between the rivals they compared but in the list of rivals they were able to compare at all. My worry is that the whole thing lands as a trick and the takeaway becomes that anything goes, when what I want them to feel is something narrower and harder; and I am genuinely unsure whether stage two belongs in this session or a later one.

  What I need is the mechanism itself, something I can actually build and run with what I have, plus the rules, the point-payoff scheme, a timeline with minute marks, and a debrief that maps the moments they actually lived through onto the distinctions I need them to hold apart: underdetermination by the evidence available to us versus by all the evidence there could be; the dependence of any apparent equivalence on auxiliary assumptions; and the status of the tiebreaker they will have reached for — simplicity, generality, elegance — including whether that tiebreaker is doing evidential work or some other kind of work entirely. Tell me what will predictably go wrong the first time I run it, and how to handle it in the moment, and be frank about what a ninety-minute game cannot stage and that I will therefore have to say myself: my guess is that it cannot reproduce the difference between transient and permanent underdetermination, since my students only ever get finite data out of a fixed budget. Structure it under the headings Setup and materials, Rules and timeline, Debrief map, Failure modes, What you must supply; keep the whole thing under 800 words; and close with a short note on how confident you are in the design overall and which single moment or claim you are least sure of.
reasoning: |-
  Okay, let me tackle this philosophy of science seminar activity. The professor wants students to experience underdetermination firsthand rather than just hearing a lecture. Their current instinct is that evidence accumulates to force a theory, but next week's topic challenges that. 

  Hmm, the professor has a three-stage idea but is worried it might feel like a trick or lead to "anything goes" conclusions. They need concrete mechanics using index cards and a projector, all within 90 minutes. Key distinctions to highlight later: underdetermination by available vs all possible evidence, role of auxiliary assumptions, and status of tiebreakers.

  First, I consider the core challenge: designing a hidden rule where more data doesn't resolve ambiguity. The dice sum idea seems promising - students might assume dice are fair (auxiliary assumption), when actually one is weighted. This creates two indistinguishable theories until the assumption is questioned. 

  For stage two, introducing an "impossible" rule (like dice color mattering) could show how hypothesis spaces limit us. But I share the professor's concern this might overwhelm students. Maybe save it for debrief discussion instead of live play.

  The timeline needs to be tight: 15min intro, 25min group investigation, 10min betting, then 10min assumption-break. Debrief should map moments to concepts - like when groups realized same evidence supported rival theories (underdetermination available), or when changing auxiliaries changed the game (assumption-dependence).

  Potential failure modes: groups might guess the weighting early (mitigate by using subtle weight differences), or fixate on one theory (encourage betting to force engagement). The professor will need to emphasize that simplicity tiebreakers aren't evidence - just pragmatic choices.

  Biggest uncertainty is whether stage two's "hidden rule outside hypothesis space" belongs in this session. Probably better as debrief illustration to avoid muddying the main point. Simpler to focus on auxiliaries breaking ties.

  Overall confidence is moderate-high for stages 1 and 3, but I'd simplify stage 2. The auxiliary assumption twist is the crucial move - when students see their "obvious" fairness assumption was never guaranteed, that should create the right kind of frustration.
answer: |-
  ## Underdetermination Lab: Design & Implementation  

  **Setup & Materials**  
  - **Projector**: Display "Dice Investigation Lab" with 3 sections:  
    1. *Observation Phase*: "Test dice pairs (e.g., 'Roll A+B'). Record sum. Max 10 tests."  
    2. *Hypothesis Phase*: "Submit 2 theories fitting all data. Bet points (1-3) on your favorite."  
    3. *Reveal Phase*: "True rule revealed. Points adjusted."  
  - **Index Cards**:  
    - 2 sets of dice per group (4 dice total: 2 normal d6s, 1 subtly weighted d6 (e.g., favors 4/5), 1 normal d6 of different color).  
    - Group cards: "Theory 1: ______", "Theory 2: ______", "Bet: ____ on Theory __".  
  - **Hidden Rule** (written on instructor card):  
    *"Sum of two dice, BUT the green die is replaced by a fixed '3' if rolled with the red die."*  
  - **Data Generation**: Pre-roll dice pairs to anticipate outcomes.  

  **Rules & Timeline (90 min)**  
  1. **Intro (5 min)**: "You’re testing a hidden rule governing dice pairs. Design 10 tests. Propose 2 theories fitting your data. Bet points. Highest points wins."  
  2. **Group Investigation (25 min)**:  
     - Groups request dice pairs (e.g., "Red + Blue"). *Instructor rolls visibly, announces sum*.  
     - *Crucial*: Ensure all groups get ambiguous data (e.g., Red+Green always sums to 3 + Green value; other pairs normal). After 8 tests, nudge: "You have 2 tests left."  
  3. **Theory Submission & Betting (10 min)**:  
     - Groups submit 2 theories (e.g., *T1: "Sum is always even"*, *T2: "Sum is >4"*) and place bets (1-3 points). Collect cards.  
  4. **Assumption Break (15 min)**:  
     - Announce: "Group 3, new info: *The green die isn’t always fair.*" Let them test Red+Green *again* (sum differs if weighted die used).  
     - *Result*: Their rivals (e.g., T1/T2) no longer both fit *all* data.  
  5. **Reveal & Stage Two (10 min)**:  
     - Show true rule. Void bets involving Red/Green.  
     - Reveal: "No group proposed the *real* rule. It required a factor (die color interaction) outside your hypotheses."  
  6. **Debrief (25 min)**: Structured below.  

  **Debrief Map (Link Experience to Concepts)**  
  - **After Betting**: "Why did you bet despite identical evidence?" → *Underdetermination by available evidence*: Rival theories equally fit *your* data.  
  - **Assumption Break**: "Why did Group 3’s theories break?" → *Auxiliary assumption dependence*: "Fair dice" was a hidden commitment; its collapse broke the tie *without new evidence*.  
  - **Reveal**: "Could *any* test distinguish your theories from the real rule?" → *Underdetermination by all possible evidence*: The true rule wasn’t in your hypothesis space.  
  - **Tiebreakers**: "Why bet on T1 over T2? Was simplicity *evidence*?" → *Non-evidential virtues*: Parsimony/elegance resolve practical indecision but don’t add truth-likeness.  

  **Failure Modes & Fixes**  
  - **Groups discover the rule early**: Use subtle weight/color rules; pre-test rolls. If exposed, say: "Now design a *different* ambiguous dataset."  
  - **Theories aren’t rivals**: Circulate, challenge: "Does *all* data fit both? Revise!"  
  - **"Anything Goes" panic**: Debrief emphasizes: "This shows why we need *more tools* (auxiliary testing, broader spaces)—not that evidence is meaningless."  
  - **Time overrun**: Enforce strict test limits; cut theory submission at 8 min.  

  **What You Must Supply**  
  1. **Conceptual Framing**: Post-game, distinguish:  
     - *Transient* underdetermination (resolvable with *more* data) vs. *Permanent* (evidence exhausted; auxiliaries or new spaces needed).  
     - Clarify: The game simulates *permanent* underdetermination *within* a fixed hypothesis space, but real science iteratively *expands* spaces.  
  2. **Prevention of Relativism**: Stress: "Auxiliaries aren’t arbitrary—they’re testable. Group 3 *tested* ‘fair dice’ implicitly."  

  **Confidence & Uncertainty**  
  - **Overall Confidence**: High (85%). The dice mechanic is tactile, quick, and reliably generates rivalry + assumption shock.  
  - **Least Sure Moment**: Stage Two (revealing the "outside hypothesis space" rule). Risk: Students feel "cheated." Mitigation: Emphasize in debrief that *all* science works within provisional frameworks. Consider making it a discussion prompt ("Could you have *conceived* this rule?") rather than a "gotcha."  

  **Word Count**: 798  

  This design forces confrontation with underdetermination’s inevitability *and* its constraints, using minimal tools. The dice create visceral frustration when "more data" fails, and the auxiliary break mirrors real scientific revolutions. Crucially, it avoids relativism by highlighting science’s capacity to *revise* assumptions and spaces—a bridge to future topics.
