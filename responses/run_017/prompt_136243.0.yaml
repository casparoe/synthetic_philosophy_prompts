prompt: |-
  I'm finishing a chapter on hypocrisy and the conditions on blame, and I've come to think the usual framing — can a hypocrite blame? — is too coarse to be answered, because our actual practices don't answer it the same way twice. So I want to work from the other end: take the practices as given and reconstruct the theory of standing they commit us to, then ask whether that theory holds together.

  Here is the pattern I keep circling. Under the equitable clean-hands rule, a plaintiff whose own blameworthy conduct was bound up in the very transaction they are suing on is refused equitable relief altogether; but the refusal is all-or-nothing, it has to be raised by the defendant, and the misconduct has to be connected to the subject matter of the suit rather than a general blot on the plaintiff's character. Move across the courthouse and the same kind of fault behaves completely differently: in tort, the plaintiff's own carelessness doesn't bar the claim at all, it discounts the recovery proportionally, and in criminal proceedings the complainant's own criminal record is irrelevant to whether the accused is guilty, surfacing at most as a question about credibility. Move out of law into the international sphere and it shifts again: the post-war tribunals insisted that one belligerent's commission of the same crime does nothing to excuse another's, tu quoque is not a defence to liability, and yet in diplomatic argument the reply does demonstrably something — it lowers the critic's standing, and everyone involved behaves as though it does, while insisting in the same breath that it shouldn't.

  The thing I can't bring into focus is whether there is one principled story here or three unrelated ones. Notice that equity's rule is essentially relational: the misconduct that disqualifies you is misconduct in the very transaction, and generally toward the very party you are suing, which makes it look less like a doctrine about hypocrisy and more like a doctrine about what you may demand from someone you have wronged. That would explain why the objection bites hardest when a state denounces another state's treatment of that state's own citizens and bites least, or not at all, when I denounce you for what you did to me — even though in both cases the speaker does the very thing they are condemning. But if the implicit view is relational, the practice of shaming in international human-rights institutions is left unexplained, and so is the fact that the same people who discount a hypocritical state's blame treat the hypocrite's advice, warning, or prediction as entirely in order.

  So let me add the variant I've been toying with, because it is the case that makes me think the practice is underdetermined. Suppose a tribunal adopted what I'll call the would-have proviso: a complainant lacks standing if, placed in the defendant's circumstances, they would have done what the defendant did, as the tribunal best can tell — with the result that someone who attempted the same wrong and failed through bad luck loses standing, while someone who committed it and self-reports retains it. That reverses the actual doctrine on both halves, since the actual doctrine cares about what you did in this transaction, not about what you would have done, and it doesn't much care whether you were caught or came forward. I take the proviso to presuppose a dispositional or commitment-based view of standing, where what matters is what the norm actually has by way of a grip on you, whereas the doctrine we have looks backward at conduct and complicity. I want to know whether that's right, whether the backward-looking rule strictly presupposes a complicity view or would sit equally well under several, and in particular whether the practices rule out the dispositional view or merely fail to implement it.

  A second wrinkle, in the same territory. We are distinctly unimpressed by the blame of someone who refrained only because they never had the opportunity — you didn't defraud anyone because nobody ever left you alone with the accounts — and yet the international system runs on small states shaming great powers for exactly the failures they themselves would never have had the capacity to commit, and we don't treat that as a standing problem. Does that asymmetry get explained by whatever theory you favour, or does it show that the practice is tracking something other than standing, like the epistemic value of the critic's testimony or the strategic effects of letting them speak?

  What I'd like from you: reconstruct the implicit theory of standing that this cluster of practices — equitable, tortious, criminal, diplomatic, and the informal norms of moral address — comes closest to presupposing, and keep separate what the practices strictly require from what merely fits them comfortably. Say where several theories would license the same practice, so that the practice is philosophically underdetermined and my chapter can't lean on it as evidence. Say which part of the pattern, if any, is an accident of institutional history rather than a commitment. Then tell me what would actually have to change in doctrine and in ordinary moral address if the backward-looking test were replaced by something like the would-have proviso, including what it would do to the evidential position of a tribunal and to the blamer who has simply never been tempted. If it helps, distinguish standing to blame from standing to advise, to demand an accounting, to impose sanctions, and to resent, since I suspect the practices distribute these separately and the conflation is what has made the literature hard to read.

  I don't need the literature named or a reading list — I have that part covered. Please answer in continuous prose, as you would in a long email: no headings, no bullet points, no bold, no tables, and no lists of any kind. Lead with a single sentence giving me your bottom line — what the practices actually presuppose, in one breath — and then argue for it.
reasoning: |-
  Okay, let me unpack this rich query about hypocrisy and standing to blame. The user is clearly deep into legal philosophy and moral theory, working on a chapter that challenges conventional framing. They've observed inconsistent patterns across equitable clean-hands doctrine, tort contributory negligence, criminal evidence rules, and international tu quoque arguments - and want to reconstruct the implicit theory unifying these practices.

  Hmm, their core frustration resonates: the "can a hypocrite blame?" question is indeed too blunt when real-world practices vary so dramatically. The equitable rule bars relief entirely for transactional misconduct, torts allow proportional recovery, criminal law ignores accusers' records, while diplomacy treats tu quoque as standing-reducing despite official denials. That's four distinct patterns already.

  The relational angle strikes me as crucial. In equity, disqualification hinges on wronging this defendant in this transaction - it's not about general hypocrisy. But then why does state hypocrisy about human rights still undermine diplomatic standing? And why does "would've done the same" hypothetical hypocrisy (like untempted non-thieves) intuitively weaken blame more than actual reformed hypocrites?

  Ah, their proposed "would-have proviso" flips existing doctrine: standing denied if you'd have committed the same wrong in defendant's shoes. That prioritizes current normative commitment over past conduct. But current practice looks backward - actual acts matter, not hypotheticals. Unless... maybe past acts are proxies for commitment? 

  Then there's the capacity puzzle. We dismiss blame from those who lacked opportunity ("you'd cheat if you could"), yet accept small states criticizing great powers for abuses they couldn't physically commit. That asymmetry needs explaining. Is standing really about moral authority or just strategic/epistemic utility?

  For reconstruction, I suspect standing fractures along functional lines: 
  - To demand accounting (equity): requires clean hands in the specific relationship 
  - To determine liability (torts/criminal): standing irrelevant because objective wrongs matter 
  - To resent (moral): requires shared vulnerability to temptation 
  - To advise (epistemic): depends on insight, not virtue

  The practices aren't random - they reflect institutional purposes. Courts separate fault-finding from blameworthiness to preserve objectivity. Diplomacy mixes standing with credibility because it's persuasive, not adjudicative. 

  Implementing the "would-have proviso" would collapse moral and legal standing. Tribunals would assess character dispositions - messy but possible. The untempted blamer loses standing, which feels right morally but destabilizes legal predictability. Meanwhile small-state critics keep epistemic standing if their analysis is sound, regardless of capacity.

  The unresolved tension? Practices treat hypocrisy as sometimes irrelevant (courts), sometimes disqualifying (equity), and sometimes credibility-damaging (diplomacy) because "standing" bundles distinct functions. Unpacking those functions - rather than seeking one theory - might be the key breakthrough for their chapter.
answer: |-
  Your practices collectively presuppose that standing to blame or claim redress depends primarily on the blamer's prior conduct *within the specific normative relationship* where blame is levied, not on general character, hypothetical dispositions, or the blamer's consistency with abstract norms alone. This relational view explains the variations: standing is forfeited only when the blamer's own actions directly undermine the particular entitlement they assert or the authority they invoke against *this specific party* in *this specific context*.  

  The equitable clean-hands rule exemplifies this. Relief is barred only if the plaintiff’s misconduct is connected to the very transaction sued upon and directed at the defendant. It is relational, not punitive: you cannot demand equity from someone you have defrauded *in this matter*. Tort law’s comparative negligence aligns here too. The plaintiff’s carelessness reduces recovery proportionally because it breaches a shared duty of care *within the incident*—it is relational contributory fault, not general moral turpitude. Criminal law’s irrelevance of the complainant’s criminal record further confirms the pattern. Guilt is objective; the victim’s unrelated sins don’t negate the defendant’s breach of *societal* norms. Credibility assessments are distinct—they address testimonial reliability, not standing to accuse.  

  International practice appears contradictory but fits when contextualized. *Tu quoque* is rejected as a *legal defense* because liability for war crimes hinges on the perpetrator’s violation of universal norms, irrespective of others' conduct. Yet diplomatically, a state committing the same crime loses standing to *shame* another—not because liability is excused, but because the shaming state’s conduct *within the shared diplomatic relationship* undermines its moral authority as a critic. The small-state paradox is resolvable here: a state lacking capacity to commit genocide can still credibly invoke universal human rights norms against a powerful offender because its criticism isn’t tainted by *participation in the same wrongful relational dynamic*. Its standing derives from representing the normative community, not from personal compliance. Conversely, a state actively torturing dissidents lacks standing to condemn another’s torture because its actions directly betray the norm it invokes *in its diplomatic engagement*.  

  Your "would-have proviso" reveals a fault line. Current practice is strictly backward-looking and conduct-based, not dispositional. Equity bars relief for *actual* transactional misconduct, not hypotheticals. The untempted non-thief’s standing to condemn theft remains intact because they haven’t violated the relational duty (e.g., trust) that theft breaches. The proviso, by contrast, adopts a commitment-based view: standing requires that the blamer *would have* adhered to the norm in the defendant’s shoes. This clashes with doctrine. Tribunals avoid speculating about counterfactuals—actual past conduct is a concrete indicator of relational integrity. If adopted, the proviso would destabilize key practices:  
  - In equity, a reformed fraudster could sue for fraud if they "wouldn’t do it now," while an unlucky would-be fraudster could be barred. This injects uncertainty and incentivizes insincere repentance.  
  - The untempted blamer loses standing despite clean hands, weakening normative enforcement where temptation is unevenly distributed (e.g., only the powerful can invade sovereign states).  
  - Tribunals would need intrusive inquiries into moral psychology, compromising objectivity.  
  - International shaming would require assessing critics’ hypothetical choices, politicizing human rights discourse.  

  The practices *rule out* the dispositional view. They treat standing as forfeited by *acts*, not attitudes. Hypocrisy matters only when the blamer’s *own conduct* in the relevant relationship contradicts the demand they make (e.g., suing for breach of contract while having breached it themselves). Where no such relational inconsistency exists—like a small state condemning aggression it couldn’t commit—standing persists because the criticism isn’t hypocritical *in the transactional sense*.  

  The asymmetry between "no opportunity" blamers and small states is thus explained relationally. We dismiss the untempted non-thief’s blame because their criticism implies a personal commitment they’ve never *relationally* tested; their standing to resent is weak. But small states’ criticisms don’t claim personal virtue—they invoke shared norms *against a party whose actions directly threaten the normative order*. Their standing derives from their role as norm-bearers, not their capacity to sin. This distinction is institutional: legal/diplomatic systems separate *standing to demand accountability* (which requires relational integrity) from *standing to articulate norms* (which requires only epistemic reliability or communal membership).  

  Accidents of institutional history do exist. Tort law’s proportional reduction arose from pragmatic apportionment, not relational theory. Yet it coheres retroactively: partial forfeiture reflects partial breach of the relational duty of care. Meanwhile, equity’s all-or-nothing bar stems from its origins as conscience-based relief, but its transactional focus aligns with the relational core.  

  To implement the "would-have proviso," doctrine and practice would need radical shifts:  
  1. **Courts** would assess blamers’ hypothetical choices, not just deeds, eroding predictability.  
  2. **Moral address** would prioritize current commitment over past actions, excusing reformed hypocrites but silencing the innocently untempted.  
  3. **Evidence rules** would shift toward character evidence, as tribunals probe dispositions.  
  4. **Standing distinctions would blur**: advising (epistemic) and blaming (relational) conflate if both hinge on "would-have" consistency.  

  The practices strictly require a backward-looking, relational test. They comfortably fit—but do not necessitate—a view where standing safeguards the moral coherence of specific normative relationships. What they cannot accommodate is any theory that severs standing from the blamer’s concrete conduct toward the blamed within the shared context of the wrong.  

  ---  
  *This reconstruction shows your cluster of practices as unified by a relational-conduct theory of standing. The "would-have proviso" isn't implied by current norms; adopting it would demand reengineering blame's architecture—elevating moral character over relational history, with profound institutional and epistemic costs. The chapter's leverage lies in exposing how standing functions not as a shield against hypocrisy per se, but as a guardian of transactional integrity.*
