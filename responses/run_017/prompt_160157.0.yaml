  Third tension: (e) Relational analogy only restricts analogical reasoning to documented process-pattern links, but (g) Case verdict infers a "socially recognized rule" without citing such a link. How was this inference made without violating (e)? Confidence: 80%. This could force either compromising (e)'s stricture or demanding more from (g)'s justification.

