answer: |-
  Here is an audit of tensions within your commitments, ordered by severity (high to moderate), followed by dissolving tensions, resolution strategies, and a verdict on (g). Confidence levels reflect conceptual certainty (not empirical). Key tensions stem from conflicting stances on belief recoverability, the nature of "meaning," and analogical inference.

  ### **High-Severity Tensions (Fundamental Incompatibilities)**
  1. **`(c) Costly Signaling` vs. `(a) Underdetermination`**  
     - **Tension**: (c) claims costly displays are "best evidence" for inferring "what people actually believed," while (a) asserts objects "never settle questions of belief content" and demand reporting "practices rather than beliefs." (c) directly violates (a)'s core prohibition.  
     - **Severity**: High. (c) requires belief inference from material traces; (a) forbids it categorically.  
     - **Resolution Required**: Sacrifice (c)'s claim that costly signals reveal *beliefs* or soften (a)'s absolute ban.  
     - **Cost**:  
       - If (c) yields: Lose "evidentially superior to textual evidence" for *beliefs*. Costly signaling could still support *institutional compliance* (aligning with (b)), but not mental states.  
       - If (a) yields: Undermines "honest default" stance, risking overinterpretation.  
     - **Confidence**: 95% (conceptual contradiction).  

  2. **`(d) Material Engagement` vs. `(b) Institutions Recoverable`**  
     - **Tension**: (d) states meaning/cognition is "partly constituted by things," resisting symbols for "antecedently held belief." (b) allows institutional recovery but bans "meanings, experiences, cosmologies." If institutions involve normative meaning (e.g., "sacred rules"), and meaning is co-constituted with objects (d), can institutions truly be disentangled from "meanings"?  
     - **Severity**: High. (d) erodes (b)'s clean separation. If meaning emerges *through* objects, inferring institutions (rules with normative force) may unavoidably engage "meaning."  
     - **Resolution Required**: Either narrow (b)'s definition of "institutions" to purely behavioral patterns (risking vacuity) or concede that institutional recovery implies *some* meaning (contrary to (b)'s gloss).  
     - **Cost**:  
       - Narrowing (b): Institutions become "observed regularities," losing normative/recognized character.  
       - Conceding meaning: Weakens (b)'s boundary, potentially conflicting with (a)/(g).  
     - **Confidence**: 85% (conceptual, but hinges on "meaning" scope; empirical check needed for institutional inferences in practice).  

  ### **Moderate-Severity Tension (Operational Conflict)**
  3. **`(e) Relational Analogy Only` vs. `(g) Case Verdict`**  
     - **Tension**: (e) demands ethnographic/historical "process-to-pattern links" for analogical inference. (g) infers a "socially recognized rule of closure" without citing such a link. If (g) relies on cross-cultural intuition (e.g., "closure" as a human universal), it violates (e). If not, what licenses the inference from pits/broken objects to a *rule*?  
     - **Severity**: Moderate. (g) appears to infer institutions (permitted by (b)) but may overextend without (e)'s strict analogy.  
     - **Resolution Required**: Either justify (g)'s inference via a relational analogy (e.g., documented abandonment rituals) or weaken (e) to allow limited formal analogy for institutional patterns.  
     - **Cost**:  
       - Adding relational analogy to (g): Requires empirical support not stated in the commitment.  
       - Weakening (e): Risks reintroducing "intuition" (which (e) forbids).  
     - **Confidence**: 80% (empirical; depends on whether institutional patterns like "closure rules" are cross-culturally attested via documented processes).  

  ---

  ### **Dissolving Tensions (Apparent Conflicts That Cohere on Inspection)**  
  - **`(f) Texts Not Default Frame` vs. Others**: No tension. (f) reinforces (c)'s material superiority and (a)'s skepticism of textual bias, while aligning with (b)'s focus on practiced institutions over elite texts.  
  - **`(c) Costly Signaling` vs. `(b) Institutions Recoverable`**: No tension. (c) supports (b) by identifying "costly-to-maintain traces" (e.g., maintained boundaries) as evidence for institutional norms.  
  - **`(a) Underdetermination` vs. `(g) Case Verdict`**: No tension. (g) infers a practice ("rule of closure") but explicitly denies belief content ("no animism"), adhering to (a).  

  ---

  ### **Critical Revision & Overall Coherence**  
  - **Most Impactful Revision**: **Modify (c) to focus on *institutional commitment* rather than *belief***.  
    - **Revised (c)**: *"Costly signaling reveals what people were institutionally committed to, not what they privately believed."*  
    - **Why**: Resolves the core (c)-(a) tension, aligns with (b) and (g), and retains "evidentially superior" for practiced norms. Costs only (c)'s psychological claim.  
  - **Can (g) Survive?** **Yes, but with caveats**:  
    - (g) works if "socially recognized rule" is inferred via (b)'s criteria (repeated, standardized, costly) and relational analogy (e) bridges pattern to process.  
    - **Problem**: (g) assumes "closure" is an institution, not a meaning/cosmology. If (d) is right, smashing querns may *constitute* cosmological engagement, making (g)'s belief denial inconsistent. **Revision**: Soften (b) to allow "institutions with embedded meaning," but this risks collapsing into cosmology.  
    - **Confidence in (g)'s viability**: 75% (contingent on relational analogies for closure rituals; empirical check needed).  

  ### **Uncertainty Flags**  
  1. **Highest Uncertainty**: **Whether institutional recovery (b) can avoid meaning if material engagement (d) is true** (Confidence 70%). This rests on contested theories of material agency (e.g., Ingold vs. Binford). *Check empirical cases*: E.g., can standardized weights imply "fair trade" norms without inferring shared concepts of justice?  
  2. **Empirical Checks Needed**:  
     - For (e)-(g): Documented cases of relational analogies for abandonment practices (e.g., ethnographic parallels for pit-deposits).  
     - For (c): Whether costly displays correlate more strongly with institutional roles than personal beliefs (e.g., initiation rituals).  

  ### **Summary**  
  - **Severe Tensions**: (c) vs. (a) [belief recoverability], (d) vs. (b) [meaning/institution divide].  
  - **Key Revision**: Limit (c) to institutional commitments (not beliefs).  
  - **Package Viability**: Achievable with revisions, but (d) threatens (b)/(g)'s strict avoidance of meaning. (g) is consistent *only* if its inference uses (b)/(e) rigorously and rejects (d)'s implication.  
  - **Overall Confidence in Audit**: 85% (conceptually sound; empirical gaps noted).  

  ---  
  **Output calibration**: I focused on logical coherence per your constraints. The weakest point is the (b)-(d) interface, as it hinges on unresolved debates in material culture theory. Revising (c) cleans up the most; if you retain original (c), (a) or (g) must bend significantly.
