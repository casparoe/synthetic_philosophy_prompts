prompt: |-
  My friend Lena used to be really into campaign finance reform and now she has become a full-time sortition person — she consults on citizens' assemblies, and whenever somebody floats a "why not just pick them by lottery" idea she has an instant yes or no. I've been writting her calls down because they don't line up with any clean slogan I can find:

  - Absolutely yes to a binding redistricting commission drawn by stratified lot, single non-renewable term, no legislative override.
  - Yes to a 100-person assembly drafting the options for a constitutional amendment on a right to housing, with the final choice going to a referendum.
  - Yes to citizens' juries advising the council on the ten-year waste and recycling plan.
  - Yes to filling half the seats on the state ethics commission (the body that can sanction elected officials) by lot, for non-renewable terms.
  - Yes, but only if the sampling frame is widened, to a panel setting water-allocation rules for a river basin that runs into a neighbouring state and across a tribal nation's land.
  - No to replacing the elected school board with a randomly selected one with the same powers.
  - No to staffing the city's seats on the regional transit authority by lot — those people have to build relationships and be answerable over years, she said.
  - No to a standing "citizens' cabinet" that would set the whole city budget each year by binding vote: a budget is the one thing that has to be somebody's responsibility at election time.
  - A reluctant no to a lot-drawn panel deciding which drugs go on the state Medicaid formulary: they'd just ratify whatever the clinical staff put in front of them, so what are we actually buying?

  Here's the case I actually care about. A state with a few hundred million a year in public research money is considering a "Research Directions Chamber": 150 residents drawn by stratified lot, staggered three-year terms with a third replaced every year, permanent staff and a budget for expert testimony, binding authority over how the fund is split between broad areas (climate, biomedicine, fusion, ag research, whatever) but not over individual grants, which still go through peer review; deliberations and written reasons get published, and the only thing elected officials still do is raise or cut the total. My gut says she'll hate it, but I dunno, and I want more than a vibe. What rule is she actually running — something like "use the lot when whoever would otherwise decide has a stake in the outcome," or "use it only for bounded, single-purpose bodies that dissolve afterwards," or "use it only where the sample mirrors the people affected," or "don't use it where the call is really technical"? All four seem to fit her record about equally well and I think at least two of them come apart on this case. So: predict her verdict, say what each candidate rule predicts and why, give me your best guess with the reasons you prefer it, and then design the one variant of this proposal (or the one extra case) that would best separate whichever rules are still tied. And please be honest about confidence: which single feature of the design, if flipped, would most change your prediction, and where is your reading of her track record most likely to be wrong?
reasoning: |-
  Hmm, the user is asking me to analyze their friend Lena's principles for using sortition (random selection) in governance, based on her past decisions. Lena seems to have specific criteria for when lottery-based systems are appropriate. The user needs help predicting her response to a "Research Directions Chamber" proposal and identifying the underlying rule she follows.

  Let me examine Lena's track record carefully. She said yes to several proposals: a binding redistricting commission with a stratified lottery and non-renewable terms; a 100-person assembly for constitutional amendment options; citizens' juries advising on waste plans; and half the ethics commission seats filled by lot. But she said no to replacing an elected school board, staffing regional transit seats by lot, a citizens' cabinet setting city budgets, and a panel deciding Medicaid drug formularies.

  Looking for patterns, I notice she approves when the body is focused on a specific issue without ongoing responsibility, when it addresses conflicts of interest, when it represents affected stakeholders, and when the decision doesn't require deep technical expertise. She rejects proposals where the body would need long-term relationship building, where electoral accountability is crucial, or where it might just rubber-stamp expert recommendations.

  For the Research Directions Chamber proposal, it has some positive elements: a specific scope (broad research areas), published deliberations, and no individual grant decisions. But concerning aspects include staggered three-year terms (suggesting permanence), and the question of whether research funding allocation is technically complex enough that experts might dominate.

  The key rules that emerge are: Conflict of Interest Avoidance (when elected officials have stakes), Ephemeral Bodies (temporary, single-purpose), Stakeholder Mirroring (representing affected groups), and Anti-Technocracy (avoiding technical decisions). For this proposal, Conflict of Interest fits best - legislators might steer research funds to benefit donors or districts, so a citizen body could counter that.

  I predict she'd say "reluctant yes" - the conflict of interest concern outweighs the technicality issue. To test this, if we removed the binding authority, making it advisory, she'd likely say no, as it wouldn't solve the conflict problem. The staggered terms might be a concern but not a deal-breaker.

  To distinguish between rules, consider a variant: a permanent body setting state park entrance fees. Conflict of Interest would support it (to prevent favoritism), but Anti-Technocracy might reject it as too technical. Ephemeral Bodies would oppose permanence. This could help clarify which rule is primary.

  My confidence is medium - the technicality concern in drug formulary rejection might extend here, but research directions seem less technical. If the proposal included individual grants, she'd definitely reject it, as that's peer review territory. The Medicaid case rejection was likely because the panel would just endorse experts, not due to technicality alone.
answer: |-
  Based on Lena's track record and the principles that emerge from her "yes/no" pattern, here's a breakdown of her likely verdict on the Research Directions Chamber, the candidate rules, and a test case to distinguish them:

  **Predicted Verdict for Research Directions Chamber:** **Reluctant Yes (with reservations about the staggered terms).**

  **Candidate Rules & Their Predictions:**
  1.  **Conflict of Interest Avoidance ("use the lot when whoever would otherwise decide has a stake in the outcome"):**
      *   **Prediction:** Strong Yes.
      *   **Why:** Legislators deciding research funding allocations are highly susceptible to influence from industry lobbyists, university constituencies, and campaign donors tied to specific sectors (e.g., big pharma, agribusiness, fossil fuels). This creates a clear conflict of interest. A citizen body directly counters this.
      *   **Fit:** Explains her strong yes to redistricting (legislators gerrymander!), ethics commission (legislators sanction themselves!), water allocation (stakeholders competing), and budget cabinet (politicians favor pet projects). Explains no to school board (voters *are* the stakeholders) and transit authority (relationship-building needed, less direct conflict).

  2.  **Ephemeral Bodies ("use it only for bounded, single-purpose bodies that dissolve afterwards"):**
      *   **Prediction:** Strong No.
      *   **Why:** The Chamber is permanent (standing body) with staggered terms, explicitly designed for ongoing oversight and direction-setting. It doesn't dissolve after a single decision.
      *   **Fit:** Explains her yes to redistricting (non-renewable, specific task), constitutional assembly (draft options, then done), citizens' juries (advise on specific plan), water panel (bounded rules). Explains her no to the standing budget cabinet and likely informs skepticism about the ethics commission (though she said yes, perhaps seeing it as bounded by specific sanctions).

  3.  **Stakeholder Mirroring ("use it only where the sample mirrors the people affected"):**
      *   **Prediction:** Qualified Yes.
      *   **Why:** The stratified lot *should* broadly mirror the state's population, who are ultimately the funders *and* beneficiaries of the research (via societal progress, economic growth, health outcomes). The "people affected" is diffuse, making mirroring appropriate.
      *   **Fit:** Explains her insistence on widening the sampling frame for the water panel (to include neighboring state & tribal nation). Explains yes to redistricting (voters affected), housing amendment (residents affected), waste plan (residents affected). Less clear on ethics commission, but perhaps sees the public as the affected party when officials misbehave. Doesn't strongly explain her no's alone.

  4.  **Anti-Technocracy ("don't use it where the call is really technical"):**
      *   **Prediction:** Leaning No (similar to the Medicaid drug panel).
      *   **Why:** Deciding broad funding allocations between "climate, biomedicine, fusion, ag research" requires grappling with complex scientific potential, societal needs, feasibility, and opportunity costs. Lena might fear the Chamber would either be captured by staff/experts ("ratify whatever...put in front of them") or make poorly informed decisions. Peer review staying for individual grants acknowledges the technicality at that level.
      *   **Fit:** Directly explains her no to the Medicaid drug panel. Explains potential reluctance on water rules (technical) and why she's okay with bounded tasks like redistricting (less technical) or advising on waste plans (less technical *decisions*, more values). Doesn't explain yes to the ethics commission (can be technical) or redistricting (can involve technical mapping).

  **Why "Reluctant Yes" and Preferred Rule:**
  *   **Conflict of Interest Avoidance** is the most consistent and powerful explanation for Lena's pattern. It underpins her strongest "yes" cases (redistricting, ethics) and her "no" to the budget cabinet (where electoral accountability *is* the intended check on self-interest). The potential for legislative capture by research special interests is a textbook case for this rule.
  *   The **Anti-Technocracy** concern is significant (explaining the Medicaid "no") but likely secondary here. While complex, the Chamber focuses on *broad priorities*, not technical project details (delegated to peer review). Staff/expert support and published reasoning mitigate this. Lena might worry about capture, but the binding authority and scope make it distinct from the purely ratifying Medicaid panel.
  *   The **Ephemeral Bodies** rule is the biggest tension point, explaining the "reluctance" in the yes. The permanence and staggered terms go against her preference for bounded tasks. However, the *strength* of the conflict-of-interest argument likely overrides this, especially since the task (setting broad priorities) is inherently ongoing. She accepted the *half* ethics commission despite it being permanent, suggesting she tolerates permanence when conflict is high.
  *   **Stakeholder Mirroring** is satisfied and supportive but not the primary driver.

  **The Deciding Variant/Test Case:**
  To separate **Conflict of Interest Avoidance** (likely dominant) from **Anti-Technocracy** (major challenger) and **Ephemeral Bodies**:

  *   **Proposal:** A permanent, stratified-lot citizen panel with staff support sets **state park entrance fees and annual permit costs**, with binding authority. Deliberations and reasons published. Legislature only sets the parks' total budget allocation.
  *   **Prediction based on Conflict of Interest:** **Yes.** Legislators setting fees face conflict – pressure to keep fees low for voters/tourism biz vs. need to fund parks. Random citizens avoid this.
  *   **Prediction based on Anti-Technocracy:** **Leaning No/Reluctant No.** Setting optimal fee structures involves understanding elasticity of demand, cost recovery, impact on access/equity, maintenance needs – fairly technical economics/operations. Risk of capture by park staff or poor decisions.
  *   **Prediction based on Ephemeral Bodies:** **No.** It's a permanent body managing an ongoing operational function.
  *   **Why it separates:** Unlike research priorities (where conflict is paramount and technicality is debatable), park fees present a clearer technical challenge (economics) alongside a *milder* conflict of interest (less intense lobbying than research billions). If Lena says **Yes**, Conflict of Interest is dominant. If she says **No**, Anti-Technocracy or Ephemeral Bodies is stronger. Her reasoning would be key.

  **Confidence & Key Flips:**
  *   **Confidence in Prediction (Reluctant Yes): Medium-High.** The conflict-of-interest angle is very strong and aligns with her core approvals. The technicality is less extreme than the Medicaid case.
  *   **Single Feature Flip that Changes Prediction:** **Making the Chamber purely advisory.** If it only *recommends* priorities to the legislature, Lena would almost certainly say **No**. This removes the core conflict-of-interest justification ("so what are we actually buying?" echoes the Medicaid concern). It becomes vulnerable to being ignored or captured without solving the underlying problem.
  *   **Where My Reading Could Be Wrong:**
      1.  **Underestimating Anti-Technocracy:** Lena might view *any* research priority setting, even broad, as too inherently technical and prone to expert capture, aligning it firmly with her Medicaid "no". Her "reluctant no" to the Medicaid panel might stem more from perceived technical futility than its boundedness.
      2.  **Overestimating Tolerance for Permanence:** Her "yes" to the half ethics commission might be the absolute limit. She might see the Chamber's ongoing, staggered nature as fundamentally incompatible with citizen deliberation, regardless of conflict, demanding a one-time priority setting exercise instead of a standing body. Her "no" to the standing budget cabinet reinforces this.
      3.  **"Answerability" Nuance:** Her "no" to the transit authority cites relationship-building and answerability. While research direction seems less relational, the *permanence* of the Chamber might trigger her concern that members become de facto unaccountable technocrats over time, even if not elected. The staggered terms specifically prevent the clean-slate approach of juries or single-term commissions.

  **In summary:** Bet on Lena giving a **Reluctant Yes** to the Research Chamber, driven primarily by the desire to avoid legislative conflicts of interest in allocating large research funds. Her main hesitation will be the permanent, staggered structure. The park fees test case best probes whether Conflict of Interest or Anti-Technocracy is her true north. Flipping the binding authority to advisory would kill the proposal in her eyes. Be prepared for her to focus on the risk of expert capture within the Chamber's staff structure.
