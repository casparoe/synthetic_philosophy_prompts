answer: |-
  **Bottom line:** A minimally viable account must distinguish construction from epistemic/conventional counterparts, track divergent case dynamics without reductionism, permit non-intentional bases, and resolve the bank fraud case via emergent institutional mechanisms—revealing that neutrality on "reality" precludes revisionary conclusions.

  ### Requirements for a Valid Account of Social Construction
  1.  **Non-Conflation Requirement** (Non-negotiable)  
      *Must clearly distinguish "socially constructed" from: caused, chosen, conventional, merely nominal, subjective, fictional, unreal.*  
      **Motivation:** Collapsing "constructed" with "unreal" (e.g., claiming race isn't *real* because constructed) ignores how constructed kinds (like money) exert concrete causal power. Equating it with "chosen" (e.g., gender identity as pure volition) ignores structural constraints.  
      **Contrast Set & Motivating Cases:**  
      | Contrast Term | Mistake Demonstrated by Case |  
      |--------------|------------------------------|  
      | **Unreal** | Money: Its constructedness doesn’t prevent bankruptcy. |  
      | **Merely Nominal** | Gender: Legal/social penalties show it's not *just* a label. |  
      | **Subjective** | Race: Institutional racism operates independently of individual beliefs. |  
      | **Conventional** | Psychiatric diagnoses: DSM revisions show conventions can be *discovered* wrong, not arbitrary. |  
      | **Chosen** | Caste: Birth-ascribed status limits individual choice. |  
      | **Fictional** | Corporations: Legally constructed entities can own property/sue. |  

  2.  **Case-Sensitivity Requirement** (Negotiable: Camp-dependent)  
      *Must explain divergent dynamics in paradigm cases (race/gender/money) without reducing all to one mechanism. Need not be univocal.*  
      **Motivation:** Treating race (often concept-first with ontological gap) like money (co-constituted concept/kind) or gender (varying intentionality/awareness) obscures key differences. E.g., being wrong about race (misidentification) vs. being wrong about money (counterfeiting).  
      **Base Stance:** Construction base *must include* material infrastructure (ledgers, bodies) and practices, *may include* concepts/institutions. Non-intentional elements (e.g., algorithmic outputs, path-dependent resource distributions) *required*.

  3.  **Emergent Construction Requirement** (Non-negotiable)  
      *Must accommodate kinds arising without collective acceptance or creator intention, gaining causal power through feedback loops.*  
      **Motivation: Bank Fraud Cluster:** Statistically emergent kind, unintended/unaccepted initially, gains reality via behavioral adaptation (customers altering transactions), then self-identification and institutional embedding (credit decisions). Parallels early racial categorization’s bureaucratic origins gaining biological/social "reality".  
      **Verdict:** This kind *is* socially constructed. Rejects strong collective acceptance (Searle) as necessary. Non-intentional base is *essential*.

  4.  **Reality-Revision Tension** (Non-negotiable)  
      *Must reject neutrality on the "reality" of K to deliver the "so-what". Construction must imply contingent mutability with normative stakes.*  
      **Motivation:** If construction doesn’t entail that K *could be otherwise* (making its current form non-necessary) and that its current form *causes harm/misrepresents* (warranting change), the "so-what" evaporates. Neutrality (e.g., "constructed but real") blocks revisionary conclusions evident in race (biological reality debates vs. critique of racialization) and bank fraud (challenging algorithmic profiling).

  ### Key Diagnostics
  -   **Most Exclusionary Requirement:** **#4 (Reality-Revision Tension)**. Knocks out: 1) "Cambridge Social Constructionism" (Hacking) emphasizing interactive kinds but often agnostic on reality/mutability; 2) Deflationary accounts ("everything is constructed") lacking critical edge; 3) Strong realist-compatibilist views.
  -   **Jointly Unsatisfiable Pair:** **Neutrality on Reality vs. Revisionary "So-What"** (#4 confirms your suspicion). Accounts *cannot* simultaneously insist constructed kinds are "just as real" as non-constructed kinds *and* derive a reason to dismantle/change them solely from their constructedness. The normative force requires showing construction introduces a *problematic* contingency or misrepresentation.

  ### Scorecard (Brief)
  -   **Causal-Historical (e.g., Mills on race):** Strong on #1 (non-conflation), #4 (revisionary), case-sensitive (#2). Struggles with #3 (bank fraud) without adding institutional mechanisms.
  -   **Constitutive/Ameliorative (e.g., Haslanger):** Excels at #4 (explicit normative "so-what"), good #2 (sensitivity). Weak on #3 (requires intentional/conceptual work), risks conflation if "constitutive" misread as "unreal" (#1).
  -   **Collective Acceptance/Status Function (e.g., Searle):** Fails #3 (bank fraud) and #4 (revision) by requiring collective acceptance/intention. Handles money well, struggles with race/gender complexity (#2).
