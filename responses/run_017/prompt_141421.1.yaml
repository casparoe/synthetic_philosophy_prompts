prompt: |-
  I'm one of the TAs for an undergrad democratic theory course and I've got a pile of midterms too grade, so I want a second read on this one. My rubric is pretty rough and I keep giving marks I can't really defend if a student appeals. Below is the question and one student's answer.

  Could you grade it? Give me a mark out of 20, and then go through it part by part: for each of (a), (b) and (c) tell me what the student actually got right, what's wrong or missing, and how many of that part's marks you'd award. Please flag anything that *sounds* plausible but doesn't really follow — conflations, views that get attributed to a principle that doesn't carry them, steps that need an argument the student never gives. Don't just tell me it's "generally good but could be more precise"; I need specific comments I can hand back.

  THE QUESTION

  Question 3 (20 marks). The "boundary problem" is the problem of who is entitled to be a member of the demos. It is standardly distinguished from the "scope problem": the problem of what the demos is entitled to decide over.

  (a) Explain the difference between the two problems in your own words, and explain why the boundary problem generates a circularity that the scope problem does not. [5 marks]

  (b) Two familiar proposed criteria for membership: the ALL-AFFECTED PRINCIPLE (the demos for a decision consists of all and only those whose interests are affected by it) and the ALL-SUBJECTED PRINCIPLE (the demos consists of all and only those who are subject to the coercion of the political order making the decision). Apply each to the following case: Ruritania, a wealthy state, decides to sharply restrict immigration from Belgravia, its much poorer neighbour. Which criterion gives the more determinate answer about who is in the demos, and why? [8 marks]

  (c) A third proposal, which I'll call the NO-EXIT CRITERION: the demos for a decision consists of all and only those who cannot avoid the effects of that decision at reasonable cost by relocating to another jurisdiction. Does the no-exit criterion escape the central objection to the all-affected principle? Does it collapse into the all-subjected principle? Give at least one case where the no-exit criterion and the all-subjected principle come apart. [7 marks]

  THE STUDENT'S ANSWER

  (a) The boundary problem asks who the "we" is when we say that a decision was made democratically. The scope problem asks which decisions the "we" is entitled to take collectively in the first place, and at what level. In a sense the scope problem is the boundary problem applied to issues rather than persons. They're connected — the bigger the unit that decides, the more likely any given decision reaches people outside it — but they come apart: you can have a perfectly settled demos and still argue about whether schooling or transport is decided locally or nationally.

  The boundary problem has a circularity that the scope problem doesn't. To hold a vote on who is to be in the demos you already need some group doing the voting, and the membership of that group is precisely what's in dispute, so you can never constitute the demos by democratic means. With scope there's no equivalent problem, because you can in principle let an already constituted demos vote on what it gets to decide over.

  (b) The all-affected principle has a well-known difficulty: in a connected world almost everyone's interests are affected by almost every decision, so the principle threatens to make every demos global. In the Ruritania case this shows up right away. Ruritania's decision to close the border affects Belgravians who want to move far more than it affects most Ruritanians, so the principle seems to say that the people being excluded have to be included in the demos that decides on excluding them. There's also no natural stopping point: Ruritanian wages, house prices, and Belgravian wages are all affected too, so there's no non-arbitrary way of saying whose affected interests count.

  The all-subjected principle is best understood as a narrower version of the same thought: coercion is just one way of being affected, so the demos is whoever is affected by being coerced. It looks better on this case, because whether you are subject to a legal order sounds like a yes-or-no matter rather than a matter of degree, which makes it more determinate than the all-affected principle. But I think it gives the same result here, and the same difficulty. Belgravians at the border are coerced by Ruritanian law — that is what border enforcement is — so they're in the demos; and anyone who hears about the policy and would like to come is deterred by the threat of force, which is arguably coercion as well. So the coercion principle also reaches the excluded, and it inherits the all-affected principle's over-inclusiveness.

  That means it is committed to a conclusion about the case: if the people being kept out have to be part of the demos that decides whether to keep them out, then the exclusion can't be legitimate, since no group votes to exclude itself. Ruritania would have to open its borders. The two criteria are therefore less different than they look, though the all-subjected one is at least more determinate.

  (c) The no-exit criterion does escape the worst version of the over-inclusion objection. Affectedness is everywhere, but being unable to leave is not: plenty of people are affected by Ruritanian policy and could relocate without much trouble, so they drop out of the demos. That yields a smaller and more stable demos than the all-affected principle, and it explains the intuition that the Belgravian with no alternative has a stronger claim to a say than the Ruritanian who is mildly inconvenienced.

  It doesn't collapse into the all-subjected principle either. The two come apart in both directions. A tourist in Ruritania is fully subject to Ruritanian law for the two weeks she is there — she can be fined, arrested, deported — but she can leave whenever she likes, so the no-exit criterion leaves her out. Conversely, someone in a region the state has effectively abandoned, where nothing is enforced any more, may be unable to leave because of poverty or because no one else will take her, even though no coercion is being exercised over her at all. So the criteria track different properties: one is about the costs of leaving, the other about being governed.

  One worry: the no-exit criterion makes membership depend on facts about other jurisdictions, since how costly leaving is depends on who else will admit you. Ruritania's demos would grow or shrink with Belgravia's and everyone else's policies, which seems odd. It also has the strange consequence that the rich, who can always leave, have the weakest claim to a vote.

  But all three criteria are attempts to answer the same question, which is where the boundary should be drawn. Once we know who is in the demos we also know which territory the state may rightfully control, since the demos just is the people who live on the territory in question.
reasoning: |-
  Okay, the user is a TA for an undergrad democratic theory course grading midterms. They're concerned about defending their marks if students appeal, so they want a second opinion on this student's answer. The question has three parts, and I need to grade each part specifically.

  Looking at part (a), the student does a good job distinguishing boundary and scope problems. They explain boundary as "who the 'we' is" and scope as "what decisions the 'we' is entitled to take." The circularity explanation is strong - they correctly note you need a pre-existing group to vote on membership, creating a chicken-and-egg problem. The scope problem doesn't have this issue because the demos is already constituted. I'd give full marks here.

  For part (b), the student applies both principles to the immigration case well. They correctly identify the all-affected principle's indeterminacy problem - how it could include affected Belgravians and even global economic effects. Their analysis of all-subjected is mostly good too, though I notice they incorrectly claim it "inherits the over-inclusiveness" of all-affected. Actually, all-subjected is meant to be narrower by focusing only on coercion. They also miss that border enforcement primarily affects non-citizens trying to enter, not all Belgravians. But they correctly conclude all-subjected is more determinate. I'd deduct some marks for these issues.

  In part (c), the student provides excellent examples where no-exit and all-subjected diverge - the tourist (subjected but can exit) and abandoned resident (can't exit but not subjected). However, they don't explicitly answer whether no-exit escapes the all-affected objection (it does) or whether it collapses into all-subjected (it doesn't). The final paragraph about territory seems irrelevant to the questions asked. I'll need to deduct for missing these direct answers while rewarding the strong examples.

  The student writes clearly and engages deeply with the concepts, but there are specific misunderstandings in part (b) and missed requirements in part (c) that affect scoring. The territorial claim at the end of (c) is confusing and adds nothing. Overall it's a strong answer with room for improvement on precision.
answer: |-
  Here's a detailed, part-by-part assessment of the student's answer, including a mark out of 20 and specific feedback for each section. **Overall Mark: 16/20**

  **Feedback for Student:**

  **(a) Boundary vs. Scope & Circularity (5 marks awarded: 5/5)**
  *   **What's right:** You perfectly distinguish the problems: *boundary* = "who is the 'we'" (membership), *scope* = "what decisions the 'we' is entitled to take" (competence/domain). The connection ("bigger unit... reaches more people") and distinction ("settled demos... schooling or transport") are accurate. Your explanation of the circularity is **excellent**: you correctly identify that a pre-existing demos is needed to vote on *who* constitutes the demos, creating an unsolvable chicken-and-egg problem ("you can never constitute the demos by democratic means"). You correctly note this circularity doesn't apply to scope, as an *existing* demos can decide its own scope. This hits all key points.
  *   **What's missing/wrong:** Nothing significant. This is a model answer for this part.
  *   **Mark:** **5/5**

  **(b) Applying AAP & ASP to Ruritania, Determinacy (8 marks awarded: 6/8)**
  *   **What's right:**
      *   You correctly identify the core weakness of AAP: over-inclusiveness/indeterminacy ("threatens to make every demos global"). Your application to Ruritania is strong: affected Belgravians (potential migrants), Ruritanians (wages, house prices), and the lack of a "non-arbitrary way" to limit it. This shows the principle's failure to give a *determinate* demos.
      *   You correctly identify ASP as generally *more determinate* because it focuses on the binary question of subjection to coercion ("yes-or-no matter"), contrasting it with AAP's gradations of "affectedness".
      *   You correctly apply ASP to the border case: Belgravians at the border *are* subject to Ruritanian coercion (enforcement) and are therefore included. You note the potential extension to those "deterred".
      *   You correctly conclude ASP gives a *more determinate answer* than AAP.
  *   **What's wrong/missing/plausible but flawed:**
      *   **Major Misstep (Conflation):** Your claim that ASP is "a narrower version of the same thought" and "inherits the all-affected principle's over-inclusiveness" is **incorrect and undermines your analysis**. ASP is conceptually distinct and specifically designed to *avoid* AAP's over-inclusiveness by focusing *only* on those subject to the *coercive authority* of the political order. While being subjected *affects* you, ASP defines the demos based on the *source* of the effect (authoritative coercion), not the effect itself. Your argument that ASP gives "the same result" and "the same difficulty" here is a significant misunderstanding of ASP's purpose and limits the strength of your comparison.
      *   **Over-extension of ASP:** While your application to border enforcement is correct, extending it to those merely "deterred" by the "threat of force" is debatable and weakens the determinacy point. ASP proponents usually focus on *actual* subjection to enforceable rules, not mere awareness of a distant threat influencing choices. This risks reintroducing the indeterminacy ASP aims to avoid.
      *   **Missing Nuance:** You imply ASP *must* include *all* Belgravians potentially subject to coercion at the border. However, ASP proponents might argue the demos is defined by *ongoing* subjection to the *general* legal order, not just potential subjection regarding a *specific* rule. Does Ruritania's *general* coercive order apply to Belgravians living in Belgravia? Usually not, only when they attempt to cross. This creates a more complex picture than your answer allows for, though your core point (ASP includes those directly coerced by the border rule) stands.
      *   **Legitimacy Claim:** Your point about illegitimacy ("no group votes to exclude itself") is interesting but **tangential to the question asked**, which was about *determinacy* ("which criterion gives the more determinate answer"). It doesn't gain credit but doesn't lose it either.
  *   **Mark:** **6/8** (Strong on AAP and determinacy comparison, but significant deduction for mischaracterizing ASP as inheriting AAP's over-inclusiveness and being essentially the same principle).

  **(c) No-Exit vs. AAP Objection, vs. ASP, Case (7 marks awarded: 5/7)**
  *   **What's right:**
      *   You correctly state that the No-Exit Criterion (NEC) *does* escape the "worst version" of AAP's over-inclusion objection ("plenty of people... could relocate... drop out"). Your reasoning is sound: inability to leave at reasonable cost filters out the mildly affected/mobile, yielding a "smaller and more stable demos". The Belgravian vs. Ruritanian example is apt.
      *   You correctly argue NEC does **not** collapse into ASP. Your examples demonstrating divergence are **excellent and clear**:
          1.  *Tourist*: Subjected (ASP IN) / Can exit easily (NEC OUT).
          2.  *Abandoned Resident*: Not subjected (ASP OUT) / Cannot exit (NEC IN).
      *   You correctly identify the distinct properties tracked ("costs of leaving" vs. "being governed").
  *   **What's wrong/missing/plausible but flawed:**
      *   **Direct Answers Missing:** You never explicitly state the answers to the two yes/no questions: "Does the no-exit criterion escape the central objection to the all-affected principle?" (Yes, as you imply) and "Does it collapse into the all-subjected principle?" (No, as you argue). While your reasoning supports the correct answers, you **fail to state them directly**, which the question explicitly asks for.
      *   **Irrelevant Conclusion:** Your final paragraph ("Once we know who is in the demos... territory") is **confusing and irrelevant** to the specific questions asked in (c). It introduces an unsupported claim about territory that isn't necessary and doesn't address the points about escaping AAP's objection, collapsing into ASP, or providing a divergence case. This adds nothing and slightly detracts.
      *   **Objections Handled Well (But Not Asked For):** Your "worry" about dependence on other jurisdictions and consequences for the rich are valid potential objections to NEC, but the question didn't ask for objections, only the specific comparisons to AAP's objection and ASP. While well-stated, they don't directly earn marks here. No penalty.
  *   **Mark:** **5/7** (Strong reasoning and excellent divergence cases, but deduction for failing to explicitly answer the two direct yes/no questions and the irrelevant/unhelpful final sentence).

  **Overall Summary for TA:**
  *   **Strengths:** Excellent grasp of the core distinction and circularity in (a). Strong analysis of AAP's indeterminacy in (b). Clear understanding of how NEC filters AAP's over-inclusion and superb examples showing NEC/ASP divergence in (c). Writing is clear and engages deeply with concepts.
  *   **Weaknesses:** Significant misstep in (b) conflating ASP with AAP and attributing AAP's over-inclusiveness to ASP. Failure in (c) to explicitly answer the direct yes/no questions posed, despite providing the correct reasoning. Minor tangents/over-extensions (ASP deterrence in (b), territory in (c)).
  *   **Why 16/20:** High marks for (a) and strong elements in (b) & (c), but significant deduction in (b) for the ASP error and smaller deductions in (c) for missing direct answers and irrelevant content. This is a very good answer demonstrating strong conceptual understanding but needing more precision on ASP and responsiveness to specific question phrasing. Defensible against appeals based on the specific errors identified.
