prompt: |-
  Bit of an odd request but here goes. I finished a clerkship over the summer and in January I start as a staff attorney at a state supreme court, and the judge I'll be working for has asked each of us to write a one-page memo on our own interpretive methodology before the next argument sitting — she says she wants to know in advance where we'll predictably disagree with her. I've been trying to write mine and I keep finding that the pieces don't obviously fit together. A friend from law school who is a committed purposivist read my draft and said it's just purposivism with extra steps and that I'm kidding myself; I dont think she's right, but I cant tell which bit she's pointing at. I mostly absorbed this stuff from half-reading a well-known textualist treatise in law school and then copying the judge I clerked for, so it's entirely possible I've picked up things that don't cohere. Here's roughly where I land:

  (1) The meaning of a statute is what a competent, legally informed reader at the time of enactment would have taken the words to convey. It's fixed at enactment and doesn't get updated, so for new technology I ask what the enacting-era reader would have understood the relevant kind to cover, and I don't buy dynamic updating.
  (2) Relatedly, I never read legislative history: no committee reports, no floor statements, no sponsor's statements.
  (3) But I am fine with dictionaries, corpus-linguistics searches, treatises, and how the same phrase was used in neighboring statutes around the same time.
  (4) I think you're also allowed to ask what that reader would have expected the words to cover in a case like the one in front of you, not just their dictionary sense — so in the old no-vehicles-in-the-park hypothetical I'd want to know whether an enacting-era reader would have understood the ban to reach an ambulance driving in to reach someone having a heart attack.
  (5) I like the absurdity doctrine and the scrivener's-error fix: where literal application would be genuinely absurd the court should read it sensibly. I'd include the old style of case where a statute bans importing foreign contract laborers under a contract for labor or service and a congregation hires a minister from abroad — I think it shouldn't apply there even though the words on their face cover it.
  (6) I think constitutional avoidance and clear-statement rules are legitimate and important: the legislature has to speak clearly before we read a statute to preempt state law, to tread on state prerogatives, or to raise a serious constitutional doubt.
  (7) I'm happy with the textual canons — whole text, noscitur a sociis, eiusdem generis — but I think the rule of lenity is mostly junk and should be a last-resort tiebreaker after you've found real ambiguity. It annoys me when a court narrows a criminal statute that looks clear to me.
  (8) I think statutory precedent should bind fairly strongly: once a court has settled what a statute means, a later court shouldn't reopen it just because it now thinks that reading was wrong, and the fact that the legislature has left the reading alone for years counts in favor of keeping it.
  (9) When the text really is ambiguous I pick the reading that best serves the statute's purpose — but only a purpose you can find in the enacted text itself, preamble, findings, title, not one reconstructed from anyone's testimony.
  (10) And the reason I like the package is that it constrains judges, it's more democratically legitimate than the alternatives, and legislatures are so bad at anticipating cases that asking what they would have wanted is usually asking a question with no answer.

  Can you audit this for me? What I want is the pairs that are actually in tension, ranked by how severe the tension is, with what would have to give in each case and what giving it would cost me — not a list where everything gets flagged as equally suspicious. I also want to know which pairs only look inconsistent and why, because my friend is not going to accept it's all fine without an argument, and I'd rather hand her the good version of that response. Tell me anywhere I'm using a label to smuggle back in something I said I rejected in (1) or (2), and whether (10)'s rationale is doing work my other commitments quietly undercut. If there's a single revision that cleans up the most, say which one. And please don't just tell me to become a purposivist: I want to know what breaks, not to switch teams. No case names or reading recommendations, I have plenty of those.
reasoning: |-
  Okay, let's start by understanding what the user is asking. They need an audit of their interpretive methodology for their new role as a staff attorney. The main concern is internal coherence, especially after a friend called it "purposivism with extra steps." The user wants to identify real tensions, not just superficial ones, and understand which parts might conflict and how severe those conflicts are.

  First, I need to break down each of their ten points. Points (1) and (2) establish a fixed textualist approach: meaning is fixed at enactment, no legislative history. But then point (4) introduces expected applications, which might rely on hypothetical scenarios beyond the text. That seems like a potential conflict because expected applications could imply intent, which textualists usually avoid. The user says they don't use legislative history, but expected applications might sneak in similar issues.

  Point (5) discusses the absurdity doctrine and scrivener's error. While textualists accept these, the user's version includes cases like the minister example, which feels more like purpose-based reasoning. That could clash with the fixed meaning in (1). If they're correcting absurdities based on purpose rather than textual clues, it might contradict their rejection of dynamic updating.

  Point (9) allows using purpose when text is ambiguous, but only if derived from the text itself. However, determining ambiguity might already involve purpose, creating a loop. The user insists on textual sources, but if ambiguity is a gateway to purposive interpretation, that could undermine their textualist stance. The friend's critique of "purposivism with extra steps" might target this.

  Constitutional avoidance in (6) can force a non-obvious reading, which might conflict with (1)'s fixed meaning. If the text is clear but avoidance requires a different interpretation, that's a tension. The user's commitment to democratic legitimacy might be at odds here because avoidance overrides clear text for constitutional concerns.

  Statutory precedent in (8) binding strongly could conflict with (1) and (7). If a past ruling was wrong textually, sticking with it might perpetuate an error. Lenity as a last resort in (7) but rejecting it when clear could be consistent, but the user's annoyance at courts narrowing statutes suggests they prioritize textual clarity over lenity, which might not align if ambiguity exists.

  The friend's comment about purposivism with extra steps likely points to (4), (5), and (9). These points introduce elements that purposivists use, like purpose and expected applications, but the user wraps them in textual constraints. However, the constraints might not hold, leading to incoherence. For example, (9) using purpose after ambiguity might be the "extra step."

  The user's rationale in (10) emphasizes democratic legitimacy and judicial constraint. But their use of avoidance, absurdity, and precedent might allow judges flexibility, undercutting that rationale. They need to ensure each tool is textually grounded to maintain consistency.

  Key tensions:
  1. Between (4) expected applications and (1) fixed meaning. Expected applications might rely on unenacted intent. Solution: limit to textual evidence only.
  2. (5) absurdity doctrine vs. (1). If absurdity corrections are based on purpose, not text, it conflicts. Need textual anchors.
  3. (9) purpose after ambiguity vs. rejecting legislative history. Must ensure purpose is text-derived, not external.
  4. (6) avoidance vs. (1). Avoidance might override clear text. Solution: only apply when text is genuinely ambiguous.

  The user could refine by tightening how they determine absurdity and expected applications, strictly tying them to textual evidence. This reduces tension and aligns with their textualist foundation. Highlighting these adjustments can counter the friend's critique by showing coherent constraints.
answer: |-
  Here's an audit of your methodology, identifying genuine tensions (ranked by severity), apparent inconsistencies that can be defended, label mismatches, and potential undercuts to your rationale. The goal is coherence within your textualist framework, not conversion.

  **Severe Tensions (Require Adjustment or Nuance):**

  1.  **(1) Fixed Meaning + (5) Absurdity Doctrine (Minister Example):**
      *   **Tension:** Your minister example (hiring a minister = "importing contract laborer for service") is the *core* problem. If meaning is fixed by what a competent reader would understand the words to convey at enactment (1), banning ministers falls squarely within the literal meaning. Calling this "absurd" relies on an *unwritten purpose* (e.g., "targeting cheap manual labor, not professionals") – precisely what you reject in (2) and (9) (purpose *only* after ambiguity). This smuggles in unenacted intent/purpose under the absurdity label.
      *   **What Gives:** You must either:
          *   **Option A (Narrow Absurdity):** Restrict absurdity to cases resolvable *textually* (e.g., scrivener's error, grammatical impossibility, internal contradiction) or where application is *physically* or *logically* impossible (e.g., "vehicle" including toy cars might be absurd, but an ambulance is debatable). Drop the minister example as an absurdity case. *Cost:* Loses a tool you find intuitive for truly nonsensical outcomes.
          *   **Option B (Textual Anchor for Absurdity):** Require that the "absurd" result *contradicts a purpose or limitation clearly expressed elsewhere in the enacted text itself* (preamble, title, specific limitation clause). The minister case likely fails this test. *Cost:* Makes absurdity much harder to invoke, aligns better with (1) & (9).
      *   **Why Severe:** This directly contradicts your core commitment (1) by overriding fixed text based on external notions of purpose/reasonableness. Your friend likely sees "purposivism" here.

  2.  **(1) Fixed Meaning (Competent Reader's Understanding) + (4) Expected Applications (Ambulance in Park):**
      *   **Tension:** Point (4) asks what the enacting-era reader would *expect* the words to cover in a specific unforeseen scenario. This subtly shifts focus from the *communicated meaning* ("vehicle") to *hypothetical application intent*. While related, they aren't identical. A competent reader might readily understand "vehicle" includes ambulances *as a matter of meaning*, even if they *expected* such use to be permissible in emergencies. Your point (4) risks conflating meaning with unenacted expectations about application.
      *   **What Gives:** Reframe (4) strictly as part of determining the *meaning* (scope/category). Don't ask "Would they *expect* it to be banned?" Ask "Would they *understand the word 'vehicle' to encompass* an ambulance?" This focuses purely on linguistic meaning, not policy expectations. *Cost:* Less flexibility; might force you to conclude the ambulance *is* banned unless another textual hook exists (e.g., implied exceptions, absurdity under Option A above).
      *   **Why Severe:** Blurring meaning and expected application opens the door to the dynamic updating/purposivism you reject in (1) and (10). It's the slippery slope your friend might point to.

  **Significant Tensions (Require Careful Demarcation):**

  3.  **(3) Using External Aids (Dictionaries, Corpus) + (2) Rejecting Legislative History:**
      *   **Tension:** While textualists distinguish dictionaries/corpus (linguistic context) from legislative history (drafting intent), the line can blur. Treatises contemporary to enactment might *discuss* or be influenced by the legislative debate. Corpus searches might highlight uses *in* legislative debates. Your methodology relies on drawing a bright line between "linguistic context" (allowed) and "drafting intent" (forbidden).
      *   **What Gives:** Be hyper-vigilant. Scrutinize treatises for whether they parrot legislative history or provide independent linguistic analysis. Use corpus data focused on *general* language use, not statutory drafting debates. Explicitly state you use these tools *only* to reconstruct ordinary public meaning, not specific intent. *Cost:* Requires discipline; potential for unconscious seepage.
      *   **Why Significant:** Failure here makes your rejection of legislative history seem arbitrary and lets intent in through the back door.

  4.  **(6) Constitutional Avoidance/Clear Statement Rules + (1) Fixed Meaning / (7) Lenity as Last Resort:**
      *   **Tension:** Avoidance/Clear Statement rules *require* adopting a non-obvious reading of the text to avoid constitutional problems or preserve state authority, *even if the text seems clear*. This actively overrides the "fixed meaning" understood by the competent reader (1) and potentially avoids the "real ambiguity" threshold you require for lenity (7). It prioritizes constitutional/comity values over textual primacy.
      *   **What Gives:** Acknowledge this as a distinct, *constitutionally mandated* exception to pure textualism. Ground its legitimacy *solely* in constitutional structure/separation of powers, not statutory interpretation theory. Emphasize it only applies when a serious constitutional doubt exists *and* the alternative reading is *plausible* (not utterly fanciful). *Cost:* Admits an external principle that supersedes text in limited cases, potentially undermining (10)'s constraint narrative slightly. Crucial for legitimacy in a state SC context.
      *   **Why Significant:** It's a principled exception, but it *is* an exception that doesn't flow from your core textualist commitments.

  **Apparent Inconsistencies (Defensible with Nuance):**

  5.  **(7) Textual Canons (e.g., noscitur, eiusdem) + (7) Rejecting Strong Lenity:**
      *   **Apparent Inconsistency:** Using semantic canons but downgrading lenity (a substantive canon) might seem arbitrary.
      *   **Defense:** This is standard textualism. Semantic canons (noscitur, eiusdem) are tools for *discerning meaning* from the structure and words of the text itself. Lenity is a substantive policy canon applied *after* meaning is found ambiguous, reflecting a preference for liberty. Your view (lenity only after *true* ambiguity) is consistent with textualism prioritizing finding meaning *before* applying policy defaults. Your annoyance stems from believing courts invoke lenity too readily when the text *isn't* truly ambiguous.
      *   **Response to Friend:** Semantic canons are linguistic; lenity is policy. Textualism embraces the former, is wary of the latter overriding discernible meaning.

  6.  **(8) Strong Stare Decisis + (1) Fixed Meaning:**
      *   **Apparent Inconsistency:** If meaning is fixed at enactment, why bind future courts to a potentially *wrong* interpretation?
      *   **Defense:** Your justification (legislative acquiescence, stability) is pragmatic and common. Textualists accept that settled precedent, even if initially flawed, gains legitimacy over time due to reliance and legislative inaction. This doesn't change the *original* fixed meaning but recognizes a *legal* meaning has supervened. You prioritize stability *unless* the prior reading is utterly indefensible textually.
      *   **Response to Friend:** This is about the rule of law and institutional roles (courts vs. legislature), not abandoning textualism. The *original* meaning remains fixed, but the *authoritative legal* meaning evolves through precedent.

  7.  **(9) Purpose Only After Ambiguity + (10) Constraint/Democratic Legitimacy:**
      *   **Apparent Inconsistency:** Isn't resorting to purpose still judicial lawmaking?
      *   **Defense:** Your version is highly constrained: ambiguity must be *real* (not manufactured), and the purpose must be *textually derived* (preamble, findings, title, structure). This seeks the purpose the legislature *actually enacted*, not what it *should have* enacted or what a committee member said. It respects the enacted text as the sole source of purpose. Contrast with purposivism, which often uses extrinsic evidence to *define* purpose and then construe text accordingly.
      *   **Response to Friend:** This is ambiguity resolution *using the enacted materials*, not freewheeling purpose-seeking. It respects the legislature's choice by limiting purpose to what they publicly declared in the law itself.

  **Label Mismatches & Rationale Undercuts:**

  *   **"Absurdity" (5):** As identified in Tension #1, using "absurdity" for the minister case mislabels it. That's pure purposivism smuggled in. Fixing this strengthens your claim to textualism.
  *   **"Expected Applications" (4):** Framed as "what the reader would have understood the words to cover" is textualist. Framed as "what they would have *expected* it to cover *in this case*" drifts towards intent/purpose. Stick rigidly to the former wording.
  *   **Rationale (10) Undercuts:** Your commitment to constraint/democratic legitimacy is *undercut* by:
      *   Broad Absurdity Doctrine (Tension #1): Allows judges to override text based on reasonableness.
      *   Unchecked Expected Applications (Tension #2): Invites speculation.
      *   **Strengthened by:** Rejecting legislative history (2), limiting purpose to enacted text (9), skepticism of lenity (7), using linguistic tools (3), strong stare decisis (8 - promotes stability).

  **The Single Most Cleansing Revision:**

  **Tighten your definition and application of the Absurdity Doctrine (Point 5).** Specifically, reject the minister example as a valid absurdity case unless you can point to a *textually expressed* purpose or limitation it violates. Restrict absurdity to outcomes resolvable by textual clues (scrivener's error, grammatical nonsense, internal contradiction) or truly impossible applications. This directly addresses the most severe tension (#1), eliminates the clearest example of "purposivism with extra steps," and significantly bolsters the coherence and credibility of your textualist framework by aligning your most significant exception with your core commitment to fixed meaning and rejection of unenacted purpose/intent.

  This revised methodology presents a coherent, predominantly new textualist approach with well-defined, principled exceptions (Avoidance, narrow Absurdity, precedent). It significantly addresses your friend's critique by eliminating the most glaring purposivist intrusion and tightening the use of expected applications. Good luck!
