  First, I need to assess the core argument: inertness. The user claims that knowing a proposition is both true and false forces credence to 0.5, just like ignorance. Then in decision-making, this leads to the same EU outcomes. The user worries this might smuggle in classicism, especially in scoring inaccuracy by adding both truth values. I should check if that scoring method is fair from a dialetheist perspective. If dialetheists reject adding errors because it assumes exclusivity, that's a key objection. The user mentions this pushback but isn't sure how to evaluate it. I need to consider if there's a better way for dialetheists to handle credences without falling back to 0.5.

