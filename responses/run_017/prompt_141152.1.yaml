  For the principle, I'll refine their stages: First, Pareto superiority via bijection. Second, when that's silent, treat changes as finite modifications relative to a fixed infinite background. Third, when aggregation is impossible (like in symmetric cases), default to maximin or lexical priority to avoid paralysis. Case (4) will be the test for stage two, while case (6) forces stage three.

  New cases will probe: (i) whether individual act evaluation holds under background infinitude (button torture), (ii) how to handle undefined totals (balanced +100/-100 vs. zero), and (iii) whether sparsity affects obligation in distributed-gain scenarios. For (i), the principle should isolate individual impact; for (ii), maximin breaks the tie; for (iii), sparsity shouldn't matter if gains are finite.

  I anticipate sacrificing their intuition in case (1) - adding a +1 person must be neutral under this framework, though they feel "nothing is at stake." The discontinuity in (7) is defensible: infinity changes the moral math because background populations become irrelevant comparators. Confidence is lowest in stage three's lexical prioritarianism - it may feel arbitrary, but alternatives like hyperreal utilities introduce their own problems.

  The weakest point is whether "finite disturbance" can truly ignore infinite backgrounds. If someone argues that dense modifications create qualitatively new patterns (e.g., altering limit properties), that could force aggregation - but I'd resist to preserve individual focus.
answer: |-
  ### **My verdicts, restated**
  1.  **Add +1 person:** No reason (neutral).
  2.  **Raise person 1 to +100:** Strong reason (improvement).
  3.  **Raise person 1 from -1000 to +1:** Stronger reason than (2) (priority for worse off).
  4.  **Harm person 1 to -1000; tiny gains to all others (unbounded total gain):** *No stable verdict* (torn between aggregation and individual harm).
  5.  **All at +2 vs. all at +1:** +2 world better (clear improvement).
  6.  **Infinitely many at +10 & infinitely many at -1 vs. all at +1:** *No verdict* (intuition slides based on subgroup density; seen as defect).
  7.  **Finite population (e.g., billion) analog of (1):** Adding +1 person is a small improvement; analog of (4) is worth taking. *Discontinuous verdict* between large finite and infinite populations.

  ---

  ### **The Principle**
  **Refined Three-Stage Evaluation (RTE):**  
  1.  **Pareto via Bijection:** If there exists a bijection between populations such that everyone is at least as well off in World B as in World A, and at least one is strictly better off, then B > A. *Motivation:* Captures verdicts (2), (3), (5). Load-bearing for individual-focused improvements.  
  2.  **Finite Disturbance Evaluation (FDE):** If no such bijection exists, treat the change as affecting only a *finite* subset against a fixed infinite background. Evaluate solely by net impact on affected individuals. *Motivation:* Resolves (1) (adding one +1: neutral), (4) (harm to one outweighs diffuse gains), and explains discontinuity in (7) (finite populations aggregate; infinite do not). Load-bearing for blocking spurious aggregation.  
  3.  **Lexical Prioritarian Fallback:** If FDE is silent (e.g., symmetric conflicts), rank worlds by:  
      (a) Maximin: Prefer the world with the least-worst-off individual.  
      (b) If equal, lexical priority to the next-worst-off, etc.  
      *Motivation:* Breaks ties in (6) without density-dependence; prioritizes avoiding severe harms.

  ---

  ### **Verdicts on Cases I Haven't Settled**  
  **(i) Button Torture:**  
  - **RTE Verdict:** *No reason to push/not push.* FDE applies: Your act affects only your button’s victim. Torturing one person is wrong (strong reason not to push). Infinitely many others pushing is irrelevant background.  
  **(ii) +100/-100 vs. All at 0:**  
  - **RTE Verdict:** *Prefer all at 0.* Bijection and FDE are silent (change is infinite). Lexical Prioritarian Fallback: The 0-world has no one below 0; the split world has infinitely many at -100. Maximin favors 0.  
  **(iii) Sparse Variant of (4):** Harm person 1 to -1000; give tiny gains to a *sparse infinite subset* (e.g., every 1000th person).  
  - **RTE Verdict:** *Do not make the change.* FDE applies identically: Only finite individuals are affected (person 1 loses; finitely many gain). The loss to person 1 dominates. Density is irrelevant; only finitude matters.  

  ---

  ### **Verdicts I'd Have to Give Up**  
  - **Case (1): Adding +1 person is neutral** – You must accept this under FDE. Your finite-population intuition (7) that addition improves things is overruled for infinite populations; the discontinuity is defensible (infinity breaks additive aggregation).  
  - **Case (6): No verdict due to density-dependence** – RTE forces a verdict via Lexical Prioritarianism: Prefer the all-+1 world over the mixed +10/-1 world. The worst-off in the mixed world are at -1, worse than +1.  
  - **Case (7):** Discontinuity remains. Adding one person helps in finite cases (aggregation applies) but not infinite (FDE ignores untouched infinity). This is a feature, not a bug.  

  ---

  ### **What Would Change This Answer**  
  The most vulnerable point is **FDE’s dismissal of infinite background effects**. If it can be shown that *distributed micro-gains* (as in Case 4) generate a *new, structurally superior infinity* (e.g., altering limit properties or measure-theoretic features), aggregation might be defensible. This is both technical (how to model "net welfare" in infinities) and moral (whether individual-focused ethics must capitulate to structural gains). I am 90% confident in FDE for *finite* changes, but only 60% in Lexical Prioritarianism for symmetric conflicts—it risks rigidity. A compelling argument that *preventing vast expected suffering* (e.g., in Case 4’s unbounded gain) outweighs individual harm, even infinitely, could flip Case (4)’s verdict. This hinges on whether morality is fundamentally individual-comparative or system-wide.
