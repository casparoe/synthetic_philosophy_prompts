prompt: |-
  I am a doctoral candidate in philosophy writing a chapter on weakness of will, and I share a reading group with two behavioral economists. One of them put an argument to me some weeks ago that I have not managed to get out of, and what I want from you is a diagnosis of the argument rather than a survey of positions.

  Start from the standard definition: an agent acts akratically at t only if she acts freely and intentionally against her own all-things-considered better judgment about what she ought to do at t. The argument, as he gave it:

  (1) An agent's all-things-considered judgment at t ranks option A above option B just in case her preference ordering at t ranks A above B. There is no daylight between what she judges best at a time and what she prefers at that time for judgment to slip into.
  (2) Intentional action at t follows the agent's preference ordering at t: if at t she prefers A to B, believes herself able to A, and is not blocked, she A-s.
  (3) For an agent with a hyperbolic — or quasi-hyperbolic, beta–delta — discount function, the ordering over a smaller-sooner option s and a larger-later option l is time-indexed: l is ranked above s while both are temporally distant, and s is ranked above l once s becomes imminent.
  (4) So at every time t such an agent does what she judges best at t. No sooner does the ordering reverse than the judgment reverses with it, and the action follows both.
  (5) Akrasia requires acting against one's better judgment, and by (4) that never happens. So no agent with a hyperbolic discount function ever acts akratically in virtue of the reversal. The stock case — the dieter who eats the cake — is not a case of acting against better judgment at all, and the discounting model, precisely insofar as it successfully predicts the reversal, fails to generate the phenomenon it was introduced to explain.
  (6) Nothing in (1), (2) or (4) depends on the shape of the discount function. Generalize, and no intentional action is ever akratic; continence becomes trivially universal rather than an achievement, and the effortful, variable, sometimes exhausting character of self-control becomes unintelligible.

  He takes (6) as a reductio of the orthodox picture and concludes that we should stop treating continence and incontinence as a distinction in the agent's will and treat it as a distinction in her circumstances. I cannot accept that, and I also cannot find the step.

  Three wrinkle cases I have tried on him, which seem to me to make the problem worse rather than better.

  First, the clear-eyed dieter. Suppose that at t her discount function has reversed, so her preference ranks s above l, but she also sincerely and reflectively judges at t that l is what she should do, and says so while reaching for the cake. If this counts as akrasia, then (1) is false and judgment and preference can come apart at a time. But then I do not know what work hyperbolic discounting is doing: either the preference reversal is the whole story, in which case clear-eyed akrasia is impossible and my case is misdescribed, or the reversal is not the whole story, in which case the model under-determines the phenomenon.

  Second, the sophisticated agent who pre-commits. If (4) is right, then at t she cannot act otherwise than her t-indexed ordering dictates, so resisting temptation without a commitment device is impossible; yet people plainly do resist without one. This makes me want to reject (2) rather than (1), and to allow that an agent can act against her present preference ordering. But then I owe an account of how such an action is explained and caused at all, and I have the familiar worry that contra-motivational action starts to look like a lucky spasm rather than something she does.

  Third, an agent with the reverse profile: impatient at a distance, patient up close, so that she defers a readily available good while judging at t that she should take it, and then judges at the later time that she should have taken it. If akrasia is symmetric — if it should be possible to act against one's judgment in either direction — then a model that generates only one direction of reversal cannot be the whole account of failures of self-governance.

  So: which step do you reject, and what does rejecting it cost? Please tell me why the step I should reject looked compelling in the first place, and price the alternatives rather than just listing them. Two specific things I would like addressed. If I keep (2), is the right move to reject (1) and reconceive better judgment so that it is indexed to the agent as a temporally extended entity rather than to a time-slice — and if so, what fixes which slice's judgment is authoritative for her, and does the notion of a better judgment survive once every candidate slice is admitted to be her? Alternatively, should I give up the standard definition and reconceive akrasia in terms of self-governance, practical identity, or the failure to conform to one's own diachronic policies — and if I do, what becomes of the ordinary first-personal phenomenology of acting against one's better judgment, and of the intuition that the continent and the incontinent agent differ in something other than their environments? If I have to choose, I would rather give up the judgment–preference link than the claim about how intentional action relates to preference, since the quasi-hyperbolic modeling result is not something I want to relitigate here; but I want to know exactly what I am paying and whether the bill is larger than I think.
reasoning: |-
  Okay, let me start by unpacking this complex philosophical argument. The user is a doctoral candidate in philosophy grappling with a challenge from behavioral economists about weakness of will. The core issue is whether hyperbolic discounting models eliminate the possibility of akrasia by collapsing judgment and preference. 

  Hmm, the economist's argument seems airtight at first glance: if judgment just is preference (premise 1), and action follows preference (premise 2), then the temporal reversal in discounting (premise 3) means the agent always acts on current judgment (4), making akrasia impossible (5). The conclusion (6) that no intentional action can be akratic feels like a reductio. 

  But I notice tension in the user's wrinkle cases. The clear-eyed dieter suggests judgment and preference might diverge - but then why does hyperbolic discounting matter? The pre-commitment case hints that resisting temptation without devices might require acting against present preference. The reverse profile case questions directional asymmetry. 

  The user's real struggle appears to be between two alternatives: either reject premise 1 (separating judgment from preference) or reject premise 2 (allowing action against present preference). Both have costs. Keeping premise 2 means rethinking judgment as diachronic - but then whose judgment counts? The time-slice problem looms large. Keeping premise 1 means explaining how contra-preferential action is possible without being "spasmodic."

  I recall Frankfurt's hierarchical desires and Bratman's planning theory might help with the diachronic approach. For the contra-preferential route, Chalmer's "trying" or Holton's resolve could provide mechanisms. The phenomenology point is crucial - the user needs to preserve the visceral experience of acting against one's better judgment.

  Perhaps the deepest worry is about agency itself. If we deny premise 1, we must explain how judgment guides action differently than preference. If we deny premise 2, we need an account of effortful resistance that isn't random. The behavioral economist's circumstantial view threatens to erase the distinction between continent and incontinent agents that feels existentially real.

  The trade-offs are stark: ontological simplicity versus phenomenological accuracy. I think I'll recommend denying premise 1 as less disruptive, but must acknowledge it requires rebuilding judgment as a distinct mental state with causal powers. The "authoritative slice" problem for diachronic views seems even harder to solve.
answer: |-
  Your colleague's argument is a formidable challenge to the standard conception of akrasia. I reject **premise (1)**. The conflation of "all-things-considered better judgment" with "preference ordering at t" is the critical flaw. Here's a step-by-step diagnosis, pricing the alternatives, and addressing your specific concerns:

  ### Why Premise (1) is Wrong (and Why It Looks Compelling)
  1. **The Mistake**: Premise (1) equates *evaluative judgment* ("what I ought to do") with *revealed preference* ("what I choose"). But these are distinct psychological states:
     - **Better judgment** is a normative, second-order endorsement grounded in reasons. It reflects what the agent believes is objectively best, considering long-term goals, values, and commitments.
     - **Preference ordering** is a dispositional state governing choice. Hyperbolic discounting reveals a shift in *motivational strength*, not necessarily in evaluative belief.  
     *Cost of rejection*: You must defend judgment as a distinct mental state irreducible to choice dispositions.

  2. **Why It Looks Compelling**:
     - **Behavioral economics** often operationalizes "judgment" as revealed preference for predictive simplicity. In rational choice models, preference *is* the ordering that explains action.
     - **Time-slice ontology**: If the agent is reduced to a momentary state (as in premise 2), judgment and preference must coincide at t. This ignores the agent's diachronic identity.

  ### Solving the Wrinkle Cases
  - **The Clear-Eyed Dieter**:  
    She judges *at t* that she should refuse cake (l), yet prefers and chooses cake (s). This *is* akrasia. Premise (1) is false: judgment and preference diverge. Hyperbolic discounting explains *why* her motivation shifts (s becomes overpoweringly salient), but her evaluative judgment remains anchored to her long-term goal. The model explains the *temptation*, not the judgment.  
    *Cost*: You must explain how judgment persists despite shifting preferences. (Answer: Judgment is a stable commitment encoded in plans or values, resistant to visceral salience).

  - **The Sophisticated Pre-Committer**:  
    Resisting temptation without a device *is* possible because agents can act on judgment *against* present preference. Premise (2) must be softened: intentional action typically follows preference, but self-control can override it via effortful processes (e.g., attention modulation, willpower).  
    *Cost*: You need an account of "effort" that isn't a "lucky spasm." (Answer: Following Holton, *resolve* is a capacity to adhere to prior intentions by actively inhibiting temptations. It’s a skill, not luck).

  - **Reverse Profile Agent**:  
    Hyperbolic discounting only explains impulsivity. You need additional mechanisms (e.g., anxiety, perfectionism) to explain *procrastination*. Akrasia is asymmetric because temptation’s motivational force is asymmetric.

  ### Addressing Your Specific Alternatives
  #### Option 1: Reject Premise (1) → Judgment is Diachronic
  - **What fixes the "authoritative slice"?**  
    The agent’s *practical identity* (Korsgaard) or *diachronic plan* (Bratman) anchors judgment. The "authoritative" perspective is the one that coheres with her reflectively endorsed values and long-term commitments.  
    *Example*: The dieter's judgment at t-1 (refusing cake) is authoritative because it aligns with her planned diet, while t (eating cake) reflects a temporary motivational distortion.  
    *Cost*:  
    - Requires a robust theory of personal identity over time.  
    - Must explain why earlier/later judgments trump present ones (answer: they embody deeper agential commitments).  
    - Judgment survives because the agent *owns* her diachronic values, not her transient desires.

  #### Option 2: Reconceive Akrasia as Self-Governance Failure
  - **Phenomenology Preservation**:  
    Acting against better judgment *feels* like a failure because it violates your own endorsed standards. This is preserved if akrasia is reframed as acting against your *diachronic will* (e.g., breaking a plan you identify with).  
    *Example*: The dieter’s guilt stems from betraying her planned self, not a metaphysical "true" judgment.  
  - **Continence vs. Incontinence**:  
    The difference lies in the agent’s capacity to execute her plans/resolutions. The continent agent exerts effort to align motivation with commitment; the incontinent succumbs. Circumstances matter, but the *capacity for self-regulation* is the differentiating factor.  
    *Cost*:  
    - Requires grounding "self-governance" in psychological realism (e.g., Bratman’s planning theory).  
    - Risks over-intellectualizing ordinary akrasia.

  ### Why Rejecting (1) is Preferable to Rejecting (2)
  - **Preserving Intentional Action**: Rejecting (2) (action always follows preference) risks severing action from motivation, making akrasia seem irrational or "magical." Rejecting (1) allows judgment to *compete* with preference, with action determined by which wins (via judgment’s causal power or willpower).  
  - **Behavioral Economics Compatibility**: Quasi-hyperbolic discounting can still model shifting *motivation*, while judgment represents a stable evaluative layer. The model predicts temptation; your philosophy explains how agents sometimes overcome it.  
  - **Phenomenological Fit**: The agony of akrasia arises precisely from *feeling* your judgment overpowered by a preference you disavow. Premise (1) erases this tension.

  ### The Bill You Pay
  - **Metaphysical Cost**: You commit to judgment as a distinct, reason-responsive state with causal efficacy (potentially contentious in naturalistic philosophy).  
  - **Psychological Cost**: You must explain how judgment persists during preference shifts (e.g., via working memory, symbolic representation).  
  - **Agency Cost**: You accept that agents are temporally extended entities, not atomic time-slices. This complicates but enriches theories of autonomy.

  ### Conclusion
  Rejecting (1) costs you a tidy reduction of judgment to preference, but saves the phenomena: akrasia, effortful self-control, and the distinction between continent and incontinent agents. The behavioral economist’s "circumstantial" view collapses the normative struggle that defines weak-willed action. By anchoring judgment in diachronic agency, you preserve the first-person experience of acting against your better self while accommodating the predictive power of discounting models. The continent agent isn’t just lucky; she successfully mobilizes her cognitive and volitional resources to align action with her enduring commitments.
