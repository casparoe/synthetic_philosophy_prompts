  | **Informed-desire**                | **B**, A, B, A, **B**, A, A, A, B, A      | Same as experience-requiring except Q1. **Separate with Q1**: C→informed; B→experience. |  
  | **Experience-requiring**           | **C**, A, B, A, **B**, A, A, A, B, A      | Q1 distinguishes from informed-desire. |  
  | **Brandt or Dispositional**        | B/C, **A**, B, A, **A**, A, A, A, B, A    | **Indistinguishable**: Both share (Moderate, Single, Strict, No, Fixed). *Extra case needed*: E.g., "A person with inconsistent desires that logical coherence fixes but therapy doesn’t" (Q: Does coherence alone suffice? A: Dispositional; therapy: Brandt). |  
  | **Railton or Moralized**           | B/C, A, **C**, A, **A**, **B**, A, **B**, B, A | **Indistinguishable**: Both share (Strong, Single, Loose, No, Fixed). *Separate with Q8*: B for both, but moralized *requires* B (moral core), while Railton *allows* A/B. If Q8=A, likely Railton; if B, ambiguous. Add a case: "A non-moral value that survives idealization but seems ‘alien’ to present-you." (Railton: accepts; moralized: rejects). |  
  | **Yudkowsky-style CEV**            | -, A, -, A, A, B, A, A/B, **A**, A        | Q9A is unique. (Q1/Q3/Q8: Irrelevant for group-focused CEV.) |  
  | **Ideal-advisor**                  | B/C, A, B, A, A, **B**, A, A, B, A        | Distinguished by identity (Q6B: no "you" requirement). |  
  | **Pluralist**                      | Any, Any, Any, Any, **B**, Any, Any, Any, **C**, **B** | Q5B + Q9C + Q10B is unique. Other answers vary. |  

  #### Interpreting Mixed Patterns:  
  - **Mixed within a leaf** (e.g., Brandt/dispositional with conflicting answers): The participant is consistent with the leaf but hasn’t resolved sub-positions. Use extra cases (noted above) to probe further.  
  - **Mixed across leaves**: Inconsistent commitments (e.g., Q7B [veto] with Q6B [strong correction]). Explain:  
    > "Your answers suggest tension—e.g., you want present-you to have veto power (Q7B) but also endorse strong correction (Q6B). Revise your intuitions or adopt a hybrid view. Revisit cases 6 and 7 to clarify."  
  - **Unmappable**: Rare; occurs if answers defy all patterns (e.g., Q5A + Q10B). Conclude: "Your idealization has unique features not captured by standard theories."  

  #### Limitations:  
  - **Brandt vs. Dispositional** and **Railton vs. Moralized** are indistinguishable without extra cases.  
  - **CEV** may be misassigned if group dynamics (Q9) aren’t prioritized.  
  - **Pluralist** is robustly identified by Q5B + Q9C + Q10B.  

  This quiz diagnoses core commitments while obscuring theory names. Use mixed patterns to spark discussion, not force classification.
