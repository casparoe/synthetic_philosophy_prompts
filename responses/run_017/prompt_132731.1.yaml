  ### Part 1: Taxonomy of Idealization Procedures

  I define the logical space using five key splits, forming a taxonomy. Each split addresses a core dimension of how idealization procedures handle personal values. Named positions are mapped to leaves, with unoccupied combinations noted.

  #### Taxonomy Dimensions:
  1. **Corrective Depth**:  
     - **None**: Only accommodates current values (no correction).  
     - **Moderate**: Corrects for irrationality, misinformation, or lack of experience (e.g., removes preferences based on false beliefs).  
     - **Strong**: Corrects for broader flaws (e.g., adaptive preferences, moral errors, or situational constraints), potentially altering core values.  

  2. **Convergence**:  
     - **Single**: Outputs one coherent answer (convergence is required).  
     - **Multiple**: Allows multiple valid answers (no forced convergence).  

  3. **Identity Condition**:  
     - **Strict**: Idealized self must be recognizably "you" (psychological continuity, core values preserved).  
     - **Loose**: Idealized self is a related but potentially different version of you (e.g., extrapolated or situated ideally).  
     - **None**: No "you" requirement (e.g., external advisor or group convergence).  

  4. **Veto Power**:  
     - **Yes**: Present-you can reject the idealized result.  
     - **No**: Idealized result overrides present-you’s objections.  

  5. **Stability**:  
     - **Fixed**: Further idealization leaves the answer unchanged (stable fixed point).  
     - **Unfixed**: Further idealization can shift the answer (no fixed point).  

  #### Named Positions Mapped to Leaves:
  | Named Position                     | Corrective Depth | Convergence | Identity Condition | Veto Power | Stability | Notes |  
  |------------------------------------|------------------|-------------|--------------------|------------|-----------|-------|  
  | Simple present-desire              | None             | Multiple    | Strict             | Yes        | Fixed     | Baseline; no idealization. |  
  | Informed-desire                    | Moderate         | Multiple    | Strict             | No         | Fixed     | Adds full information. |  
  | Experience-requiring               | Moderate         | Multiple    | Strict             | No         | Fixed     | Adds lived experience. |  
  | Brandt-style cognitive therapy     | Moderate         | Single      | Strict             | No         | Fixed     | Removes desires that dissolve under factual clarity. |  
  | Dispositional ideal reasoning      | Moderate         | Single      | Strict             | No         | Fixed     | What you’d want under ideal reasoning. |  
  | Railton-style objective interests  | Strong           | Single      | Loose              | No         | Fixed     | Ideally situated you wants *for* you. |  
  | Yudkowsky-style CEV                | Strong           | Single      | None               | No         | Fixed     | Group convergence to coherent volition. |  
  | Ideal-advisor                      | Moderate         | Single      | None               | No         | Fixed     | External idealized advisor dictates good. |  
  | Moralized rationality              | Strong           | Single      | Loose              | No         | Fixed     | Rationality includes moral constraints. |  
  | Pluralist                          | Moderate         | Multiple    | Strict             | No         | Unfixed   | Irreducible multiplicity; no fixed point. |  

  #### Unoccupied Combinations:  
  - **(Strong, Multiple, Loose, Yes, Fixed)**: Incoherent—strong correction with veto/preservation clashes.  
  - **(None, Single, *, Yes, Unfixed)**: Unattractive—no correction but demands convergence and instability.  
  - **(Moderate, Single, None, Yes, Fixed)**: Unoccupied—external authority with veto is rarely defended.  
  - **Other combos**: Unoccupied (e.g., **Strong + Multiple + Strict**) due to unattractiveness or oversight.  

  ---

  ### Part 2: Diagnostic Quiz & Scoring Key

  **Instructions**: For each scenario, pick the option that best reflects your view. Answer instinctively—no prior knowledge needed.  

  #### Quiz Questions:  
  1. **Untried Delight**:  
     Alex has never eaten pineapple and doesn’t want to. After trying it, they love it. What determines Alex’s good *before* trying it?  
     - A) Their current lack of desire.  
     - B) What they’d want if they knew all facts about pineapples.  
     - C) What they’d want after tasting it.  

  2. **Fear of Flying**:  
     Taylor knows flying is statistically safer than driving but still feels intense fear. Does this fear factor into their good?  
     - A) No—it’s irrational and should be ignored.  
     - B) Yes—it’s part of their psychology.  

  3. **Shrunk Aspirations**:  
     Sam, stuck in a dead-end job, has lowered their ambitions to match their situation. What determines Sam’s good?  
     - A) Their current shrunken aspirations.  
     - B) The aspirations they’d have with full information.  
     - C) The aspirations they’d have in a better situation.  

  4. **Exhausted Verdict**:  
     Jay makes a major life decision at 3 AM while exhausted. Should this decision define their good?  
     - A) No—exhaustion distorts judgment.  
     - B) Yes—it reflects their current state.  

  5. **Two Lives**:  
     Charlie could thrive as a pianist or a mathematician. Both paths are coherent and fulfilling, but incompatible. Is there one "best" life for Charlie?  
     - A) Yes—idealization reveals one optimal path.  
     - B) No—both could be good, depending on choice.  

  6. **Replaced Commitment**:  
     An idealization process says Riley’s treasured commitment (e.g., to a career) isn’t good for them. How should Riley react?  
     - A) Preserve the commitment—it’s core to who they are.  
     - B) Accept the result—the idealization knows best.  
     - C) Reject it if it feels wrong—Riley gets final say.  

  7. **Violent Rejection**:  
     Present-you hates what your idealized self endorses. Does this override the idealization?  
     - A) No—the idealized self is authoritative.  
     - B) Yes—present-you’s rejection matters.  

  8. **Awful Values**:  
     After full information and coherence adjustments, Morgan still holds awful values (e.g., bigotry). Do these values contribute to their good?  
     - A) Yes—if they survive idealization, they count.  
     - B) No—awful values can’t contribute to good.  

  9. **Group Conflict**:  
     A group’s individually idealized goods conflict (e.g., resource allocation). How should this be resolved?  
     - A) Converge to a single coherent group volition.  
     - B) Accept individual conflicts—no resolution needed.  
     - C) Embrace multiplicity—both options are valid.  

  10. **Shifting Idealization**:  
      Further idealization (e.g., more information, coherence) keeps changing the answer for a person’s good. Is this a problem?  
      - A) Yes—idealization must settle on a fixed answer.  
      - B) No—the ideal can evolve indefinitely.  

