  **What the Game Can't Reproduce**:
  - The game uses points, but in fiction, decisions are about identity, values, and narrative consequences. You'll have to explicitly draw the parallel: "In fiction, the 'points' might be the character's integrity, relationships, or story outcomes."
  - The copy variant is a metaphor for the character's identity over time or across possible worlds. You'll have to explain that the "copies" represent the character in different circumstances, and breaking the policy in one branch affects the character's overall trustworthiness or self-image.

  **Revised Timeline with Copy Variant as Group Vote**:

  0-5: Intro and Round 1 (pre-commit)
  6-10: Round 2 (live without knowledge? Skip to save time) or go straight to:
  6-10: Flip coin and reveal for Round 3 (live with knowledge). But we need two reveals? Let's do:

  After Round 1:
  - Flip the coin and hide it. Then skip Round 2a.
  - Then reveal: "It's Tails." (If it's Heads, say it's Tails for the sake of the exercise, or flip until Tails, but that's dishonest. Alternatively, if Heads, say: "We'll do this as if it were Tails to show the conflict.") 
