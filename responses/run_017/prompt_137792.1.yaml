  Alternative plan:

  - Do two games: one with a hypothetical Tails and one with Heads? But that's confusing.

  Given time, I propose we always use Tails for Round 3 by fiat for demonstration. Say: "For the next round, we are going to assume the coin was Tails so we can see a particular situation."

  **Final Timeline**:

  **0-5 min**: Intro and Round 1 (pre-commit for the coin flip scenario). They seal their choice.

  **6-10 min**: Without revealing the coin, say: "Now, for the next part, we are going to imagine that the coin flip was Tails. Knowing that, what do you choose now? A (3) or B (0)?" (Round 3). They choose.

  **11-15 min**: Open the sealed envelopes. Compare: who chose B in Round 1 but A in Round 3? Discuss why.

  **16-30 min**: Copy variant as a group activity.
    - Explain the setup: two copies, policy set in advance.
    - Group votes: policy A or policy B (by show of hands).
    - Then, assign: half the room as Heads copies, half as Tails copies.
    - Ask each group: "You are in the Tails world, the policy is B. Do you follow it and choose B (0 points) or break it and choose A (3 points)?" Then same for Heads (but they will choose B if policy is B because 8>3). 
    - Then, flip a coin to decide which group is real. But the choice they made stands? 
    - Alternatively, we don't need to flip for real; it's about the temptation.

    Better: After setting policy B, ask the Tails group: "What do you choose? If you break policy, you get 3. If you follow, 0. Also, note that if you break, you are breaking the pre-commitment." Record how many break.

  **31-45 min**: Debrief the gap and introduce terms.

  **46-60 min**: Application to fiction: dead-mother promise and other examples.

  **61-75 min**: Workshop their own manuscripts.

  This is a bit rushed. We might skip the copy variant physical split and do it as a thought experiment if short on time.

  **Final Materials**:
  - Index cards (at least 2 per person)
  - Envelopes (1 per person)
  - A coin
  - Whiteboard to record votes.

  **Bottom Line Activity**: 
  Participants will pre-commit to a choice before a coin flip, then make a live choice after learning the flip outcome (simulated as Tails). The mismatch reveals a tension between advance and on-the-spot decisions. A group activity extends this to a "copy" scenario to show the policy aspect. Finally, we apply it to fiction writing.
answer: |-
  ### Bottom Line for Handout
  **"In this session, you'll play a quick game: first, write a sealed choice for a coin-flip scenario; then, make a live choice after seeing the flip. We'll compare your answers to uncover why characters might break promises when their original reasons vanish—and how this shapes their identity."**

  ---

  ### **Game Setup: "The Broken Vow" Activity**  
  **Goal**: Force players to confront the gap between pre-commitment (advance policy) and on-the-spot decisions (conditional choice).  
  **Core Conflict**: Players pre-commit to a choice *before* a coin flip, then choose again *after* seeing the flip. Most will abandon their pre-commitment when the outcome voids their reason—revealing the updateless vs. updated tension. The "copy" variant then shows this isn't about physical binding but identity/policy.  

  #### **Materials (for 12 people)**  
  - **Index cards**: 36 total (3 per person).  
  - **Envelopes**: 12 (1 per person).  
  - **Coin**: For flips.  
  - **Pens**: 12.  
  - **Point tokens**: Use paper squares (3 per player: ⬤ = 1 point). Optional but tactile.  
  - **Timer**: For strict pacing.  
  - **Whiteboard/flip chart**: Record choices and points.  

  #### **Rules & Scenarios**  
  **Points system**: Simple trade-offs (e.g., "Give up 3 points to get 8"). No math—focus on emotional weight: "Points represent your character's survival, reputation, or goals."  

  ---

  ### **Minute-by-Minute Timeline (75 Total)**  
  #### **0–10 min: Intro & Round 1 (Pre-Commitment)**  
  - **0–2 min**: Quick hook. *"Imagine your character swore to save their sibling no matter what. But when the moment comes, the sibling is already safe. Do they still act? Let's simulate this."*  
  - **3–5 min**: Explain Round 1. *"A coin will flip. If Heads, Option B gives 8 points (big win); Tails, it gives 0. Option A gives 3 points no matter what. Write your choice on a card: A or B. Seal it in an envelope. This is binding—like a deathbed vow."*  
    - **Why this works**: Forces policy thinking ("What should I decide in advance?").  
  - **6–10 min**: Collect envelopes. Flip coin (hide outcome). *"Now, we move to the next choice..."*  

  #### **11–25 min: Round 2 (Live Choice After Flip)**  
  - **11–12 min**: Reveal coin. **Rig this to be Tails** (see "What Could Go Wrong"). *"Coin was Tails. Option B now gives 0 points, A gives 3. Choose live: A or B (write on new card)."*  
  - **13–15 min**: Collect live choices. Tally on board:  
    - **Column 1**: Pre-commit choices (open envelopes).  
    - **Column 2**: Live choices (after Tails).  
  - **16–25 min**: Show results. *Typical outcome*:  
    - ~80% choose B in Round 1 (expected value 4 > 3).  
    - ~90% choose A in Round 2 (3 > 0).  
    - **Key moment**: Point out mismatches. *"Why did you abandon B? The reason for choosing it (chance of winning 8) is gone, right?"*  

  #### **26–45 min: Round 3 (Copy Variant—Policy Isn't Physical)**  
  - **26–30 min**: Introduce twist. *"New scenario: You’re duplicated. Copy 1 sees Heads, Copy 2 sees Tails. A random coin flip picks which copy is 'real' and pays points. You must set a policy in advance: 'Both copies always choose A/B.'"*  
    - Vote as group: Policy A or B (record on board).  
    - **Rational choice**: Policy B (50% chance of 8 > guaranteed 3).  
  - **31–35 min**: Assign roles. *"Half of you are Copy 1 (Heads), half Copy 2 (Tails). Now, your copy learns the outcome. Do you follow the policy?"*  
    - Copy 1 (Heads): Choosing B gives 8 > 3 → follows policy.  
    - Copy 2 (Tails): Choosing B gives 0 < 3 → most break policy.  
  - **36–45 min**: Reveal "real" copy (flip coin). Discuss:  
    - *"Copy 2 broke the policy to avoid 0 points. But if both copies do this, the policy fails. What does this say about 'who you are' across situations?"*  

  #### **46–60 min: Debrief & Map to Theory**  
  - **46–50 min**: Explicitly link game to concepts:  
    - **Pre-commitment (Round 1)** = "What should I decide *before* I know my situation?" (Updateless).  
    - **Live choice (Round 2)** = "What should I do *now* given what I know?" (Updated).  
    - **Copy variant (Round 3)** = "Breaking a promise isn’t about envelopes—it’s about whether you see yourself as part of a larger policy."  
  - **51–60 min**: Connect to fiction. Use your example:  
    - *"Dead-mother promise: The 'coin flip' is whether the reason for the vow (mother’s life) exists. When it lands 'Tails' (mother gone), your protagonist faces Round 2’s choice. Her decision isn’t logical—it’s about identity."*  
    - **Handout snippet**: *"A vow’s power lies in what breaking it says about the character, not its original purpose."*  

  #### **61–75 min: Apply to Manuscripts**  
  - **61–65 min**: Brainstorm prompt. *"Pick a scene where your character must keep/break an expired commitment (e.g., a vow made in crisis that no longer applies). Answer: What would they do if deciding on the spot? What would they have pre-committed to?"*  
  - **66–70 min**: Solo write (index cards).  
  - **71–75 min**: Pair-and-share. *"Explain one scene to your partner. Where’s the tension between policy and convenience?"*  

  ---

  ### **What Could Go Wrong (and How to Handle It)**  
  1. **"This is unrealistic—I’d never pre-commit!"**  
     - **Why**: Writers reject abstract trade-offs.  
     - **Fix**: Reframe emotionally. *"In your novel, this is the character swearing an oath. Do they honor it when costs change?"* If they resist, note: *"Your refusal is a choice—what does it say about risk aversion?"*  

  2. **Coin lands Heads in Round 2 (no conflict)**.  
     - **Why**: Heads makes B rational both rounds, hiding the gap.  
     - **Fix**: **Rig the coin to Tails** (use a double-tailed coin or pretend). If challenged: *"We’re exploring a specific narrative dilemma—assume Tails to see the tension."*  

  3. **Players optimize points, not drama**.  
     - **Why**: They pick A always (avoiding risk) or B always (gambling).  
     - **Fix**: Amplify stakes. *"Choosing B in Round 1 isn’t greed—it’s hope. Choosing A in Round 2 isn’t cowardice—it’s pragmatism. Where’s the story in that shift?"*  

  4. **Copy variant confuses**.  
     - **Why**: "Duplicates" feel sci-fi.  
     - **Fix**: Simplify. *"You’re not literally copied—this is your character at two possible moments. Policy-breaking in one 'moment' affects how readers see their core self."*  

  ---

  ### **What the Game Can’t Do (Requires Your Voice)**  
  - **Emotional weight**: Points can’t replicate guilt, integrity, or narrative consequences. Say: *"In fiction, the 'cost' isn’t points—it’s trust, identity, or thematic resonance."*  
  - **Nuanced motives**: The game can’t show *why* a character feels bound to vows (duty vs. love vs. guilt). Highlight: *"Use the gap to ask: Is your character keeping a promise, or keeping *themselves*?"*  
  - **Third options**: Players can’t "negotiate" in the game. Note: *"Characters might compromise—your game choice is a forcing device to expose default instincts."*  

  ---

  ### **Why This Works**  
  - **No jargon**: Decision theory emerges from mismatched choices, not lectures.  
  - **Hands-on**: Writers "feel" the gap by living it (sealed envelope → regret).  
  - **Clear through-line**: Game → debrief → application to their work.  
  **Final tip**: Start energetic. Say: *"We’re not here to lecture—we’re here to steal ideas from your own choices."*
