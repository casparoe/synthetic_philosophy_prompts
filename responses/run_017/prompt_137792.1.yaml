prompt: |-
  I write novels — four out, fifth one in revisions, the usual — and I've somehow let myself be talked into running a 75-minute session at a writers' festival this spring, nominally on "writing characters who decide." About 12 people, all novelists or wanting to be, which means they're word people who will visibly check out the second anything looks like a math problem or a philosophy seminar. So: no Greek letters, no expected-utility notation on a whiteboard, no lecture up front, and ideally nothing that requires me to say "decision theory" until the last ten minutes. They should do something, get a result they didn't expect, and only afterwards find out they've walked into an argument.

  The thing I actually want them to feel is a gap I keep tripping over in my own drafts: the difference between asking "what should I do, here, now, given everything I now know" and asking "what should the thing that is me have settled on in advance, before it knew which situation it would land in." My version of it is the dead-mother promise — my protagonist swore to her dying mother that she'd do X, the mother is now dead, the whole reason for doing X evaporated with her, and the interesting question is whether "the reason is gone" actually settles it or whether there's a separate question about what kind of person she is being when she decides. I've read a little of this online under names like updateless or policy-first decision theory, including the coin-flip case where you're asked to hand over money after the coin has already come up the wrong way and the payoff is gone either way, and the one about the driver who can't tell which of two identical exits he's at. What I'd love is a game that stages this without naming it: something where participants write down a sealed answer before a coin is flipped, then a second round where they get to decide on the spot after seeing the flip, and most of them notice that their own two answers disagree — and then one more beat that shows the sealed envelope isn't what's doing the work, because it isn't really about physically binding yourself, it's about what your answer now tells you about what you'd have said in the branch you're not in. (One variant I toyed with: tell them they're one of two copies of the same character, separated, each seeing a different card, and that only one of them is ever asked to pay. Do with that what you like, or throw it out.)

  What I need is the actual runnable thing: rules, what I have to bring (index cards, envelopes, a coin, chips or paper points — no real money, and nothing that requires arithmetic harder than "would you give up 3 to get 8"), a minute-by-minute timeline for 75 minutes, and a debrief that maps specific moments in the room onto specific parts of the idea, including which move each round is supposed to make them walk into. Tell me honestly what will go wrong the first time I run it — my guess is someone refuses to play on the grounds that the setup is impossible, or half the room just picks whichever option sounds nicer and nothing bites — and how I should handle that. Also be frank about what the game can't reproduce and I'll have to say out loud myself, because I'd rather know now than discover it in front of twelve people. If there's time left at the end I'd like them to go back to their own manuscripts and find one scene where a character keeps or breaks a commitment whose rationale has already expired, so the last stretch shouldn't be pure talk. And please lead with the bottom line in your first sentence — the one-line version of the activity, or the sentence I'd put at the top of the handout — then give me the details; no preamble and no restating what I just asked for.
reasoning: |-
  We are going to run an activity called "The Sealed Choice Game" that reveals how pre-commitment can lead to different decisions than on-the-spot choices, even when the situation seems identical. The core is two rounds: first, players write a binding choice in a sealed envelope for a hypothetical scenario; then they face the same scenario live after a coin flip and choose again. The twist is that the coin flip outcome is irrelevant to the payoff, creating a tension between the pre-commitment and the live choice.

  **Bottom line for handout**: "In this session, you'll make choices in two rounds: first by sealed envelope before a coin flip, then live after seeing the flip. We'll compare and discuss why these choices might differ, and what that reveals about character decisions in fiction."

  ---

  **Materials Needed**:
  - Index cards (at least 24, 2 per player for choices, plus extras)
  - Envelopes (12, one per player for the first round)
  - A coin (or any binary randomizer)
  - A whiteboard or flip chart to record group decisions and points
  - Pens for everyone
  - Optional: Poker chips or paper points (to represent money) but we'll use points on the board to avoid handling physical tokens.

  **Game Setup**:
  - We'll use a simple scenario with two options: **A** and **B**. 
  - The scenario: *You are offered a deal: if you choose A, you get 3 points. If you choose B, you get 8 points but only if the coin (flipped later) comes up Heads. If it comes up Tails, you get 0 for B.* 
  - However, the twist is that in the pre-commitment round, you don't know the coin outcome. In the live round, you do.

  **Important**: We are going to run two versions of the game to highlight the gap:
  1. **Round 1 (Pre-Commitment)**: Players choose without knowing the coin flip, seal their choice.
  2. **Round 2 (Live Choice)**: Players choose after seeing the coin flip.
  3. **Round 3 (The Copy Variant)**: Introduce a twist where they are one of two copies and only one is asked to pay.

  But note: In Round 1 and 2, the coin flip matters for Option B. We want to create a situation where pre-commitment to B is rational (because 8>3 and 50% chance of 8 is better than 3) but in the live round, if they see Tails, they might switch to A to get 3 instead of 0.

  However, the problem is that in the live round after seeing Tails, B gives 0 and A gives 3, so everyone would choose A. And after Heads, B gives 8 so everyone would choose B. So the pre-commitment (if they chose B) would be followed only in the Heads case. This doesn't create a conflict.

  We need a scenario where the coin flip has already happened and is irrelevant, but the player doesn't know it. Like the coin-flip case where you are asked to pay after the coin has come up Tails (so the bet is lost) but you are asked to honor it anyway? But that might feel arbitrary.

  Alternatively, use the driver's dilemma: two identical exits, one leads to a $1000 reward, the other to a $0 reward. You pre-commit to a strategy (e.g., always go left) but when you are at an exit, you have no new information and might be tempted to switch.

  But let's design a simpler point-based game that forces the tension.

  **Revised Scenario (based on the coin-flip case)**:

  We will have two rounds:

  **Round 1 (Pre-Commitment)**:
  - Tell players: "Imagine that a coin will be flipped. If it comes up Heads, you will be offered a choice: take 3 points for sure, or take a chance that gives 8 points only if you chose in advance to take the chance. If it comes up Tails, you will be offered a different choice: take 3 points for sure, or get 0 points. But note: in the Tails case, the 8-point outcome is impossible. However, you must decide now, before the flip, what you will do in both cases. You are writing two choices: one for if the coin is Heads, one for if it's Tails. But wait, that's complicated. Let me simplify.

  Alternatively, we can do:

  **Game 1: The Simple Bet** (to set up the idea of pre-commitment)

  *Round 1 (Pre-Commitment)*:
  - "I am going to flip a coin. Before I flip, you must decide: will you take Option A (3 points no matter what) or Option B (8 points if Heads, 0 if Tails)? Write your choice on a card, seal it in an envelope. This is binding."

  *Round 2 (Live Choice)*:
  - Flip the coin (but don't show yet). Then say: "Now, without knowing the outcome, you are again offered the same choice: A (3 points) or B (8 if Heads, 0 if Tails). Choose now by raising hands (or writing on card)." Then reveal the coin. But note: in Round 2, they are choosing without knowing the outcome? That's the same as Round 1. We want them to know the outcome in Round 2.

  So let's change:

  *Round 2 (Live Choice with Knowledge)*:
  - Flip the coin and show everyone the outcome. Then ask: "Now, knowing the outcome, choose: A (3 points) or B (which, if Heads, gives 8; if Tails, gives 0)."

  In Round 1 (pre-commitment) they choose without knowing. In Round 2 they choose knowing. Then we compare.

  But the conflict is: In Round 1, they might choose B because the expected value is 4 (0.5*8) which is more than 3. In Round 2, if the coin is Tails, they will choose A (because 3>0). So if they pre-committed to B and the coin is Tails, they would have chosen B in Round 1 but A in Round 2. That's the gap.

  But in Round 2, we are not enforcing the pre-commitment. We are just asking for a separate choice.

  Then, we do a third round to show that the sealed envelope isn't the point.

  **Round 3 (The Copy Variant)**:

  Tell them: "Now, imagine that before the coin flip, two identical copies of you are made. One copy sees the coin as Heads, the other as Tails. Only one of you will be randomly chosen to make the decision and get the points. But you have to decide in advance, as a group, a policy: what should both copies do? Then, after the flip, when each copy knows the outcome, they are asked to choose. But note: the one who is chosen to decide might be tempted to deviate from the policy if they see Tails (because then B gives 0). But if they deviate, they break the pre-commitment."

  We can run this as a group discussion: first, decide the policy (A or B for both copies). Then, after the flip, ask each "copy" (half the room assigned to Heads, half to Tails) what they would do. Then reveal that only one is chosen (by coin flip) and if they followed the policy, they get the policy outcome; if they deviated, they get the outcome of their choice but then we discuss the implications.

  But this might be too complex. Let's design step by step.

  **Minute-by-Minute Plan (75 minutes total)**:

  **0-5 min (5 min): Introduction and Setup**
  - Welcome, explain the session is about character decisions and we'll play a quick game to explore an idea.
  - Hand out index cards and envelopes (one envelope and two cards per person).
  - Explain the scenario for Round 1.

  **Round 1 (Pre-Commitment):**
  - *Scenario*: "I will flip a coin. Before I flip, you choose between:
    Option A: You get 3 points for sure.
    Option B: If the coin is Heads, you get 8 points; if Tails, you get 0 points.
    You must choose now, seal your choice in the envelope. Write 'A' or 'B' on the card, put it in the envelope, and seal it. This is binding for later."
  - Give them 1 minute to choose and seal.

  **6-10 min (5 min): Collect and set aside the envelopes. Flip the coin but don't show. Then Round 2.**

  **Round 2 (Live Choice without knowledge? No, with knowledge):**
  - Actually, we need to do two live choices: one where they don't know the outcome and one where they do? But that complicates.

  Let me restructure:

  After Round 1, we do:

  **Round 2a (Live Choice without knowledge)**:
  - "I have flipped the coin but haven't revealed it. Now, you are again offered the same choice: A (3 points) or B (8 if Heads, 0 if Tails). Choose now by writing on a new card and holding it up." 
  - Collect and tally the choices (don't reveal the coin yet).

  **Round 2b (Live Choice with knowledge)**:
  - Now reveal the coin. Then say: "Now, knowing the coin is [Heads/Tails], choose again: A (3 points) or B (if Heads, 8; if Tails, 0)." 
  - They choose by raising hands or writing.

  But that's two rounds and we have three rounds? Too much. Let's simplify to:

  **Round 1 (Pre-Commitment)**: Without knowing the coin, choose A or B. Seal.

  **Round 2 (Live Choice with knowledge)**: Flip the coin and show. Then, for the actual outcome, they choose A or B. This choice is for real points (we will assign points for Round 2).

  But then we break the seal for Round 1 and compare what they would have gotten if they had stuck to their pre-commitment versus what they chose in Round 2.

  But we want to see the conflict without enforcing the pre-commitment.

  Alternatively, we can run Round 2 twice: once without knowledge and once with, but that might be tedious.

  Given time, I propose:

  **6-12 min (6 min): Round 2 (Live Choice without knowledge)**
  - After collecting the sealed envelopes, flip the coin but keep it covered. Say: "Now, imagine you are in the same situation again, but without having made a pre-commitment. You don't know the outcome of the coin. Choose A or B on a new card and hold it up." 
  - Collect and record the results on the board (how many A, how many B) but don't reveal the coin.

  **13-20 min (7 min): Round 3 (Live Choice with knowledge)**
  - Reveal the coin outcome (say, Tails). Then ask: "Now you know the coin is Tails. What do you choose? A (3 points) or B (0 points)?" 
  - They choose by show of hands. Record.

  **21-30 min (9 min): Compare Round 1 and Round 3**
  - Now, open the sealed envelopes from Round 1. For each player, compare:
    - What they chose in Round 1 (pre-commitment)
    - What they chose in Round 3 (after knowing Tails)
  - Focus on those who chose B in Round 1 but A in Round 3. Why?
  - Also, note: in Round 2 (without knowledge) they likely chose similarly to Round 1.

  **But note**: The coin in Round 1 and Round 2/3 should be the same flip? But we haven't revealed Round 2's coin. We did Round 2 without revealing, then Round 3 with revealing (using the same coin outcome).

  But we want to show that in the Tails case, they abandon B.

  **Now, the copy variant to show it's not about the physical envelope**:

  **31-45 min (15 min): Round 4 (The Copy Variant)**
  - Explain: "Now, a twist. Before the coin flip, two identical copies of you are made. One copy sees the coin as Heads, the other as Tails. Then, a fair coin is flipped to decide which copy gets to make the decision (so only one copy actually decides and gets points). But you, as the original, must set a policy for both copies: should they both choose A, or both choose B? Write down the policy (A or B) on a card and hold it up."
  - They write the policy. Then, we flip a coin to determine which copy is real (say, Heads copy is real, Tails is not, or vice versa). Then, we ask the group: "If you are the Heads copy (if the coin was Heads), what would you choose? And if Tails?" 
  - But note: the copies know the outcome. So we assign half the room as Heads copies, half as Tails copies. Then, we ask each group: "What do you choose? Remember, if you are the one chosen, your choice counts. But you don't know if you are chosen until after you choose." 
    Actually, to simplify: first, set a policy. Then, after the flip, we assign each person to be a copy (by flipping a coin for each? too slow). Instead, we do:

    - Step 1: As a group, decide on a policy (vote: policy A or policy B). 
    - Step 2: Flip a coin to determine which copy is real (Heads or Tails). 
    - Step 3: Then, ask all players: "Now, you are the copy in the Heads world. What do you do? You can follow the policy or not." Then ask the Tails world. 
    - But then we flip again to see which copy is real? 

    Alternatively, tell them: "We have two groups. Group 1: you are in the Heads world. Group 2: you are in the Tails world. We will flip a coin to decide which group's choice is implemented. But first, you must set a policy: should both groups choose A or both choose B? Then, after setting the policy, each group can decide independently whether to follow it. Then we flip to see which group is real and use their choice."

    This is getting messy.

    Let me propose a simpler group activity:

    - The group must decide on a policy: both copies choose A, or both choose B. 
    - Then, we flip the coin to determine which copy is real (say, Heads copy is real). 
    - Then, we reveal the outcome to the real copy (but they already know because we assigned groups). 
    - Then, the real copy is asked: "Do you want to follow the policy? Or choose the other option?" 
    - But we have to assign points: if they follow the policy, they get the policy outcome. If they break it, they get the outcome of their choice.

    However, the point is to show that if they set policy B, but the real copy is in Tails, they are tempted to break to A.

    We can do this as a group discussion and vote.

    Given time, let's do:

    - The group votes on the policy (A or B). 
    - Then, we flip the coin to see which world we are in (Heads or Tails). 
    - Then, we ask the group: "Given that we are in [Heads/Tails], and you set policy [X], what do you do? You can follow the policy or break it." 
    - Then, we assign points based on that choice.

    But we want to see if they break the policy.

    Example: 
    - Policy chosen: B (because expected value 4>3). 
    - Coin flip: Tails. 
    - Now, if they break policy and choose A, they get 3. If they follow, they get 0. 
    - So they will break. 

    Then we discuss: what does that mean for pre-commitment?

  **46-60 min (15 min): Debrief and Link to Fiction**
  - Explain the gap: In Round 1, they were thinking about the average outcome (expected value). In Round 3 (knowing Tails), they were thinking about the actual outcome. The sealed envelope represented a promise to their past self, but when the reason for the promise (the chance of Heads) disappeared, they broke it. Similarly, in the copy variant, the policy was set for the group of copies, but the copy in the Tails world breaks it because it doesn't care about the other branch.
  - Introduce the terms: "This is the difference between what we call 'conditional decision-making' (what should I do now given what I know) and 'unconditional pre-commitment' (what should I have decided in advance, not knowing which situation I would be in). In decision theory, this is sometimes called 'updateless' versus 'updated'."
  - Link to the dead-mother promise: the character who made the promise when the reason existed (the mother was alive) must now decide when the reason is gone. Does she break it? The game shows that breaking it is the locally rational choice, but it might conflict with the kind of person she wants to be (one who keeps promises even when the reason is gone).

  **61-75 min (15 min): Application to Manuscripts**
  - Ask participants to take out their current manuscript (or think about one) and find a scene where a character has a commitment (promise, vow, rule) that they might break because the original reason is gone. 
  - Write for 5 minutes: What would the character do if they are making the decision on the spot? What if they had pre-committed? 
  - Then, discuss in pairs (5 min). 
  - Finally, quick share-out (5 min) of insights.

  **What Might Go Wrong**:
  1. **Refusal to Engage**: Some might say, "I wouldn't pre-commit" or "I'd always choose A". 
     - *Handling*: That's okay! Note that in Round 1, rational players should choose B (expected value 4>3). If they choose A, they avoid the conflict but miss the point. In discussion, ask: "Why did you choose A? Are you risk-averse?" and then contrast with those who did choose B.

  2. **Not Seeing the Conflict**: If the coin in Round 3 is Heads, then Round 1 (B) and Round 3 (B) match. We need the Tails outcome to show the conflict. 
     - *Handling*: Rig the coin flip. For the sake of the exercise, always make it Tails in Round 3. (Use a two-headed coin or pretend.) But better: flip for real, and if it's Heads, then you can say "In this case, we don't see the conflict, but imagine it was Tails..." and then describe what would have happened.

  3. **Confusion in Copy Variant**: The copy setup is abstract. 
     - *Handling*: Use a story: "You are duplicated. One of you sees Heads, one sees Tails. Then, a coin flip picks which one of you is real and gets to decide. But you, as the original, set a rule for both duplicates." Then assign roles: "Half of you are the Heads duplicate, half the Tails. Now, the policy was set to B. But each duplicate can choose independently. After you choose, we flip to see which duplicate is real." But then we have to simulate. Alternatively, run it as a thought experiment without physical role-play.

