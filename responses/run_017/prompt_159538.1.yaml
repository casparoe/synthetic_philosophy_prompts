   Let's design the RFC.

   Sections:

     Title: RFC: Notification Message Packet Model for Localization

     Summary:
       We propose a packet model for notification and error messages. Each message consists of a payload (the factual proposition) and a header (tone and presentation). Localization is restricted to header transformations, ensuring that the payload remains consistent across locales. Any alteration to the payload by localization is considered a "truth incident" and must be logged. This model brings consistency, auditability, and a clear separation of concerns.

     Motivation:
       Current message localization leads to recurring debates in code reviews, with conflicting requirements from different locales (e.g., directness vs. politeness). The packet model resolves this by defining a single source of truth (the payload) and allowing locale-specific presentation rules.

     Design:
       - Payload: A string that must be a literal, objective statement of fact. It should be minimal and devoid of any hedging, politeness, or cultural context.
       - Header: A set of parameters (e.g., hedging, negation softening, apology level) that control how the payload is presented.
       - Localization Process: The linter checks that the localized string is a valid transformation of the payload, only modifying the header parameters. If the localized string alters the proposition (e.g., by omitting, adding, or changing facts), it is a truth incident.
       - Truth Incident Severity: We define an enum (see below) to classify the severity of the deviation.

       Parameters per locale (set in a configuration file):
          - hedging: on/off (adds phrases like "Sorry", "We regret to inform you")
          - negation_softening: on/off (replaces "couldn't" with "was not able to", or uses more indirect phrasing)
          - bluntness: high/medium/low (controls the directness of the statement)

       Example for nl-NL: 
          hedging: off, negation_softening: off, bluntness: high
       Example for ja-JP:
          hedging: on, negation_softening: on, bluntness: low

     Truth Incident Severity Enum:
       We propose the following levels:

          SEVERITY_0: Harmless White Lie - The deviation does not affect user action and is socially expected (e.g., "Sorry" when no remorse is felt).
          SEVERITY_1: Misleading - The deviation may cause the user to misunderstand the situation but is unlikely to lead to negative consequences.
          SEVERITY_2: Deceptive - The deviation is likely to mislead the user and may cause minor negative consequences.
          SEVERITY_3: Harmful Lie - The deviation causes direct harm (e.g., by hiding a critical fact).
          SEVERITY_4: Malicious Lie - Intentional deception with malicious intent.

     Per-Locale Parameter Table:

          Locale   | Hedging | Negation Softening | Bluntness
          --------------------------------------------------
          nl-NL    | off     | off                | high
          ja-JP    | on      | on                 | low

     Worked Examples:

       Example 1: 
          Payload: "The file was not saved."

          nl-NL transformation: 
            Hedging off -> no apology. Bluntness high -> direct statement.
            Output: "We couldn't save your file." 
            (Note: This is acceptable because it matches the payload. The use of "couldn't" is allowed because it's not considered softening under the model? Or wait, we might need to define. Alternatively, we could have the payload as "The file save operation failed." to avoid any modal verbs.)

          But note: The original example had "Sorry, ...". In the model, we must generate the base version without any header. So the payload is the core fact.

          Let's adjust: 
            Payload: "File save failed."

          Then:
            nl-NL: bluntness high -> "File save failed." (exactly the payload? But they want to say "We couldn't save your file." which is equivalent? We need to allow for rephrasing as long as the fact is the same? This is where it breaks.)

          This is a problem: the model requires that the payload is the literal string? Or is it the proposition? We have to decide. The RFC will take the literal string approach because it's easier to lint.

          So let's say the payload is a string that must be preserved unless the transformation rules are applied. But the transformation rules only allow adding hedges or changing the phrasing without changing the meaning? But meaning is hard.

          We'll have to define the payload as a string and then allow the locale to transform it only by adding predefined header elements and by applying syntactic transformations that are known to be meaning-preserving (e.g., replacing "could not" with "failed to", but only if the parameter says so). This is getting messy.

          For the example, let's have:

            Payload: "The file was not saved."

            nl-NL: 
              Hedging: off -> remove any apology.
              Negation Softening: off -> use the direct negation.
              Bluntness: high -> use the active voice and assign responsibility? 
              Output: "We did not save your file." -> but wait, this is a different proposition? Because maybe the system didn't even try? We have to be careful.

          Alternatively, we can have the payload be a structured fact, but that's beyond the scope of the RFC.

          To keep it simple in the example, we'll say:

            Payload: "File save operation failed."

            Then:
              nl-NL: "File save failed." (shortened, but same fact) -> acceptable.
              ja-JP: With hedging on and negation softening on: "We are very sorry, but the file could not be saved at this time." -> Now, is this a payload change? 
                - The payload says the operation failed. The Japanese version adds an apology (header) and softens the failure to "could not be saved at this time" (which implies it might be saved later? If that's not true, then it's a truth incident).

          So for ja-JP, we would log a truth incident of severity 0 or 1 because of the "at this time" which adds a false implication of recoverability.

          Example 2: 
            Payload: "Invalid input in field 'email'."

            nl-NL: "Invalid input in field 'email'." (unchanged)
            ja-JP: With softening: "The email field may contain an input that requires correction." -> This is a truth incident because it uses "may" and is less direct. The payload states that the input is invalid, but the Japanese version only says it might be. Severity 2? Because the user might not understand they must correct it.

     Rollout Plan:
       - Phase 1: Implement the linter and severity logging for new messages.
       - Phase 2: Migrate existing messages to the packet model, with a one-time truth incident amnesty for legacy messages.
       - Phase 3: Enforce the model in CI/CD, blocking deployments with severity 3 or 4 incidents.

     Now, inline comments:

