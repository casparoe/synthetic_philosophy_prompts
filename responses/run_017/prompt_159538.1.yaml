   Important: 
     - The doc must not wink at the reader. It's deadpan.
     - Philosophy: 
          * Distinguish between saying something false and conveying something false without saying it (implicature).
          * Indirectness can be deniable (so the hearer can choose to read it as the strong meaning or not) -> but in the packet model, we are forced to choose one literal payload.
