   The model: a message has a "payload" (the proposition, the literal truth) and a "header" (tone, politeness).
   Localization can only change the header. Changing the payload is a "truth incident".

   We must write in the voice of a competent staff engineer who believes in the model.
   The document is an internal engineering RFC, with sections: Summary, Motivation, Design, etc.
   Include inline comments from Amsterdam and Tokyo reviewers sniping at each other.

   Key points:
