          - Truth incidents: defined as any payload deviation. Severity levels.
          - Linter: checks that localization only changes the header.
     Severity Enum: Define the levels (e.g., Severity 0: harmless white lie; Severity 1: misleading; ... up to Severity 4: malicious lie).
