   - Push the model to its extreme: if every hedge (like "sorry", softening) is a payload deviation, then:
       Option A: Strip all hedges and be brutally honest everywhere -> but then the Japanese version is unacceptable.
       Option B: Log every deviation as a "truth incident" -> but then we have a log full of "lies".
   - The model breaks down because it assumes that the "brutal truth" is the real payload and politeness is just packaging.
     But sometimes the softened form is the accurate vehicle (e.g., in a culture where directness is rude and the indirectness is part of the meaning).
   - Also, white lies: are they lies? Are they harmless? The doc shouldn't settle this, but the system's bookkeeping will collapse.

