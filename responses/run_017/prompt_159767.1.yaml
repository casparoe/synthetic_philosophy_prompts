prompt: |-
  I'm putting together a seminar session on the extended mind whose whole point is to unsettle a lazy assumption students arrive with: that the extended mind thesis is simply the permissive view about where cognition stops, and that its opponents are simply the restrictive ones. To make that point I need a case where a middle view grants extension while the extended mind thesis withholds it. Please build one.

  Three positions, stated here so you don't have to reconstruct any literature:

  (A) Extension by parity: an external resource counts as part of a subject's cognition when it plays the functional role an internal process would play and meets the usual integration conditions — it is there when needed, easy to access, reliable, and its deliverances are automatically endorsed.

  (B) Wide computationalism: an external resource counts as part of a subject's cognition when the computation the coupled system performs cannot be individuated without citing that resource — the resource is a vehicle of the computation. On this view it does not matter whether the subject retrieves content from the resource, endorses anything, or could say what is "stored" there.

  (C) Intracranialism: cognition is constituted by brain-bound states with non-derived content; environmental resources can cause, scaffold, and reshape cognition but never constitute it.

  The case must yield these verdicts: (B) says yes, (A) says no, (C) says no — so that the view famous for extending the mind ends up agreeing with the view famous for confining it. The reversal has to be generated by the theories, not stipulated into the scenario.

  Constraints on the scenario:

  - One paragraph. Ordinary present-day human setting: no implants, no brain–computer interfaces, no science fiction.
  - The resource must be inanimate and non-digital: no notebook, phone, GPS, written list, or search engine. It must not be a repackaging of the notebook case, the blind person's cane, or an arrangement of tiles or tokens used to solve a puzzle.
  - No other person's cognition does the work: no colleagues, no social institutions, no division of labour across agents.
  - The agent knows the resource is there and deliberately relies on it. The case may not work by making her unaware of it, deceived about it, or unusually forgetful or impaired.
  - The resource should be something she did not design herself and could not simply carry away with her.
  - At no point may you stipulate that the resource is, or is not, part of her mind; every verdict has to come from (A)–(C) applied to the facts of the case.

  After the scenario, give me:

  1. The verdict each of (A), (B), and (C) returns, with the reasoning that gets there — for (A), which of its conditions goes unmet and why; for (B), why the computation cannot be individuated without the resource; for (C), what it takes the resource to be merely doing.
  2. The single feature of the case that is load-bearing, stated explicitly as a variable someone could toggle.
  3. What happens when that variable is toggled: which verdicts flip, and why the case then collapses into a familiar instance that does no dialectical work.
  4. The strongest reply available to the (A) theorist — the best way for her to argue that this is not a counterexample at all but a case of something else (mere scaffolding, embodiment, a coupled-but-not-constituted system, or whatever reclassification you think is strongest) — together with your honest assessment of whether that reply rescues (A) or merely relocates the real disagreement into the (B) versus (C) dispute.
  5. One sentence on whether you think (B)'s verdict here is a cost or a benefit for that view.

  Format: begin your reply with the scenario itself — its first sentence is the first sentence of your reply, with no heading, no preamble, and no restating of this request. In everything that follows, lead with each section's bottom line and then give the reasoning.
reasoning: |-
  Okay, let me think through this request carefully. The user wants a scenario that challenges the common assumption about the extended mind thesis, specifically creating a case where Clark & Chalmers' parity principle (A) rejects extension while wide computationalism (B) accepts it, with intracranialism (C) also rejecting - showing (A) and (C) unexpectedly agreeing. 

  The constraints are quite specific: present-day setting, inanimate non-digital resource, no other people involved, agent fully aware, and the resource must be fixed in place. It can't resemble classic examples like notebooks or canes. The scenario needs to naturally generate the theoretical verdicts without stipulation.

  Hmm... what could work? Considering architectural features as cognitive resources... What about a building's layout guiding navigation? But that might be too passive. Maybe a specific tool like a sundial? But sundials involve environmental inputs that might trigger (B)'s computational requirements. 

  Ah! A carpenter's workshop with specially placed reference surfaces! The surfaces are fixed, inanimate, non-digital, and the carpenter actively uses them. This satisfies all constraints: the surfaces weren't designed by the user, can't be carried away, and their spatial arrangement is computationally integral to the angle measurement task.

  For the verdicts: (A) would reject because there's no content retrieval or endorsement; (B) accepts because the physical configuration is necessary to compute the angles; (C) rejects as always. The load-bearing feature is the resource being causally necessary for the computation but not containing or processing representational content. If we toggle it to involve content (like marked angles), it collapses into a notebook-like case where (A) would accept.

  The strongest reply for (A) theorists would be to frame this as causal coupling rather than constitution, but that just shifts the debate to (B) vs (C). As for (B)'s verdict, while it might seem unintuitive at first, it demonstrates the theory's consistency - treating all computationally essential components equally, whether biological or environmental.
answer: |-
  A carpenter precisely cuts miter joints for a complex frame by placing each workpiece against one of several fixed reference surfaces installed throughout her workshop; each surface corresponds to a frequently needed angle (e.g., 22.5°, 30°, 45°), and by selecting the appropriate surface, physically aligning the workpiece flush against it, and cutting along the edge defined by that alignment, she reliably produces the correct angle without measuring or calculating, relying solely on the spatial orientation of these installed references.

  1.  **Verdicts & Reasoning:**
      *   **(A) Says No:** The reference surfaces do **not meet the automatic endorsement condition**. While reliably available and deliberately relied upon, their deliverances (the correct angle) are not retrieved as content or endorsed as true; the carpenter exploits their spatial properties causally to guide action, without forming a judgment *about* the angle derived from the surface. The resource is a physical constraint enabling accurate performance, not a source of information she automatically accepts.
      *   **(B) Says Yes:** The computation being performed (transforming the goal "cut a 45° miter" into the motor action achieving it) **cannot be individuated without citing the specific reference surfaces**. The specific spatial configuration and orientation of the *particular surface* used for a given angle are essential vehicles in the computational process mapping the goal state to the correct motor output; describing the computation solely in terms of internal brain states would omit the essential physical parameters provided by the external resource that causally structure the action.
      *   **(C) Says No:** The reference surfaces are **merely causal scaffolds** shaping the motor action. The actual cognition—the intention to cut a specific angle and the motor plan execution—remains entirely brain-bound. The surfaces provide reliable physical constraints influencing behavior but do not constitute cognitive states with non-derived content.

  2.  **Load-Bearing Feature:** The resource **provides essential spatial parameters for action *causally*, not by delivering representational content for endorsement.**

  3.  **Toggling the Feature:** If the surfaces were instead marked with angle labels (e.g., "45°") that the carpenter reads and endorses to guide her cut, **(A) flips to "Yes"** (meeting endorsement), **(B) remains "Yes"**, and the case collapses into a **familiar notebook-like instance** where (A) and (B) agree on extension, losing the dialectical force.

  4.  **(A) Theorist's Strongest Reply & Assessment:** The (A) theorist can argue this is **mere embodied scaffolding**, not cognitive extension. The surfaces are part of the reliable causal loop enabling skilled action (like a potter's wheel or a jig), but they don't play the functional role of an internal *belief* (e.g., retrieving and endorsing the proposition "this is 45°"). Cognition remains internal, utilizing the environment for reliable motor guidance. **Assessment:** This reply *successfully defends (A)* within its own framework by strictly applying the content-endorsement requirement. However, it *relocates the core disagreement* to whether such causally essential, non-representational scaffolding should count as cognitive constitution (as (B) claims) or merely causation/scaffolding (as (A) and (C) agree). The case highlights that the (A) vs. (B) debate hinges fundamentally on the necessity of *endorsing representational content*.

  5.  **(B)'s Verdict Assessment:** **(B)'s "Yes" verdict is a cost** in terms of intuitive plausibility, as it extends "cognition" to include causally essential but non-representational physical structures in a way that feels overly liberal compared to common sense and (A)'s content-based criterion.
