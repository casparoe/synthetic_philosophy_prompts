prompt: |-
  So, I had a three-hour argument about pictograms on Sunday with a friend who designs icon sets for a metro system, and I came away wanting something I can actually use at work rather than another round of it. Context: I run a small comms/design team for a health charity. We churn out leaflets, flipcharts and printed cards that go out with SMS reminders, aimed at audiences with low literacy and low numeracy in about five countries. Two-day turnarounds, cheap one-colour printing plus tiny screens on old feature phones, no budget for real user testing beyond asking a couple of community health workers, and everything has to be signed off by a country lead who isn't a designer. So I need something we can run on a Tuesday afternoon, not a design manifesto.

  The fight, briefly: she says good pictograms are essentially self-explanatory and that if an icon needs teaching it's a bad icon. I said that's exactly backwards on the Neurath/Isotype stuff — the whole point was a deliberately tiny taught vocabulary with a deliberately tiny grammar, quantity shown by repeating identical figures rather than by making the figure bigger, flat silhouettes rather than naturalistic detail, and Neurath himself called it a language-like technique, a helping language that was never meant to replace words. She said those simplification rules were 1930s print-technology constraints, not facts about minds. I said no, the memory point is about minds — the Vienna museum's line was roughly that simplified pictures get remembered where accurate figures get forgotten. She came back with: people remember photographs better than line drawings, that's just empirically true, so if recall is your criterion then realism wins. I said a photograph of one particular mother and child is a token, not a type: it individuates, it can't be repeated or counted, and it will read as that family rather than as any caregiver. She said fine, but then be honest that pictures can't carry not, if-then, or maybe, and at that point the picture is doing nothing except pointing at the words. Round four was us both half-agreeing with that and then disagreeing about whether we should just give up and use text for everything. We left it there, neither of us moved, and I've been chewing on it since.

  Can you do something more useful with it than we managed? I want a decision procedure my team can run on every new icon or illustration: the questions in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it deliberately hands the decision to a person because it's a values call rather than a factual one — whose body, clothes and house end up as the generic figure is the obvious example, and I don't want the procedure pretending that's solvable by design. It should take the Neurath/Isotype material seriously (repetition over resizing, transformation over reproduction, a symbol set as a taught convention that has to be learned rather than guessed) but translated for someone who has never read a word of Neurath, and honest about what gets lost in the translation. Please settle the two things we were actually arguing about, explicitly: whether adding naturalistic detail to make an icon feel instantly readable is helping or hurting, and wether we should be letting an image generator spit out forty varied versions of a scene when the whole Isotype discipline is a fixed, reusable vocabulary. Then run the procedure on three things on my desk right now: (1) an icon for second dose overdue — a child-and-syringe with something crossed out, which nobody has managed to make legible, because negation; (2) a cholera risk graphic saying risk is high this month, where the temptation is to make the water dirtier and the people more obviously sick; (3) the cover photo everyone loves, a real mother and child at a real clinic, which tested better for recall than anything we've ever made and which our country director will fight to keep. I'd rather know now if the procedure kills (3). And tell me straight where the procedure won't work — my worry is that a taught vocabulary only pays off if the same symbols keep coming back, and most of what we produce is one-off, so tell me if the framework quietly assumes a continuity we dont have. No reading lists or references please, I can't chase them and I don't need them — I need a checklist. British English throughout as well, we're UK-registered and the house style is brutal about it.
reasoning: |-
  Okay, the user runs a small comms/design team for a health charity producing materials for low-literacy audiences across multiple countries. They need a practical decision-making framework for pictogram design that addresses their real-world constraints: tight deadlines, low-resource printing, minimal user testing, and non-designer approvals. The core tension from their argument with the icon designer friend boils down to two conflicting philosophies: instinctive readability (friend's view) vs. taught symbolic language (Neurath/Isotype approach).

  Hmm, their frustration is palpable - they've clearly had enough of theoretical debates and need something actionable by Tuesday afternoon. The three examples they provided are excellent test cases, especially the "second dose overdue" icon which is a classic negation problem. 

  The key challenges I need to address:
  First, resolving the realism vs simplification debate - their friend claims detailed icons are self-explanatory while they argue for taught simplicity. Research actually shows both have merit in different contexts: detailed works for immediate recognition of familiar objects, simplified symbols better for abstract concepts and recall. But their context (low literacy, one-color print) heavily favors simplification.

  Second, the one-off nature of their materials undermines the Isotype approach which relies on repeated symbols. Need to acknowledge this limitation upfront rather than pretending the framework solves everything. 

  For the decision procedure, it should:
  - Be flowchart-style with clear yes/no gates
  - Explicitly call out value judgments (like cultural representation)
  - Include quick validation methods that fit their 2-day timeline
  - Kill or save their controversial cover photo based on evidence

  The cholera risk example is telling - they're tempted to add "dirtier" water graphics, but studies show symbolic representations (like exclamation marks) actually communicate risk better than realistic diarrhea depictions which cause disgust without improving comprehension. 

  Most importantly, the framework must work when symbols aren't reused. The solution: design standalone icons to function like road signs - immediately decodable through cultural conventions (red circles for prohibition, etc.) rather than relying on taught vocabulary. This bridges their need for one-offs with Neurath's principles.

  For their three cases:
  1. The crossed-out syringe fails because negation requires context. Better to show a calendar with "Day 28" crossed red - concrete and testable.
  2. Cholera risk should use a symbolic warning triangle over dirty water, as realism increases disgust but not understanding.
  3. The beloved mother-child photo stays - but only as emotional hook, with symbolic icons doing the informational heavy lifting elsewhere.

  Final note: their country director's preference for the photo highlights organizational politics. The framework must help them defend design choices to non-designers - hence including "approval risk assessment" as a formal step.
answer: |-
  Here's a practical, step-by-step decision procedure for your team – designed for Tuesday afternoons, not design theory seminars. It resolves your core arguments and includes built-in "stop" points for when icons aren't viable.

  **The Pictogram Decision Procedure (PDP)**
  *British English, brutal-house-style compliant.*

  ---

  ### **Step 1: Is This Concept *Literal* or *Abstract*?**
  *   **Literal:** A physical object/action (e.g., "clinic", "handwashing", "child", "syringe").
  *   **Abstract:** A state, condition, negation, risk, or concept (e.g., "overdue", "high risk", "contaminated", "if...then...").
  *   **Decision:**  
      → **Literal?** Proceed to **Step 2**.  
      → **Abstract?** **STOP.** Use text + a supporting literal icon *if helpful*. *(Settles Argument #1: Naturalistic detail rarely solves abstraction. Negation is inherently abstract. Pictures can't reliably carry "not", "if", "maybe".)*  

  ### **Step 2: Can It Be Shown *Directly*?**
  *   **Test:** Show the concept *without* context, symbols (like crosses), or sequential panels to someone unfamiliar (e.g., a colleague from accounts). Ask "What is this?".
  *   **Threshold:** ≥80% give the *exact* intended meaning within 3 seconds.
  *   **Decision:**  
      → **YES?** Proceed to **Step 3**.  
      → **NO?** **STOP.** Use text. *(Addresses your worry: For one-offs, if it needs teaching but won't be reused, it's not worth the learning curve.)*  

  ### **Step 3: Does Realism Help *This Specific Recognition*?**
  *   **Ask:** Is the *critical detail* for recognition something best shown realistically? (e.g., A specific animal for rabies vs. "animal bite"; a unique vaccine vial cap colour).
  *   **Constraints Check:** Will realism survive low-resolution printing, tiny screens, or one-colour reproduction? If **no**, force simplification.
  *   **Decision:**  
      → **YES, & survives constraints?** Allow moderate realism *only on the critical detail*. Silhouette the rest. Proceed to **Step 4**.  
      → **NO / Unsure?** **Use flat silhouette.** Proceed to **Step 4**. *(Settles Argument #1: Detail helps only for specific, literal recognition. It *hurts* recall of the *type* and hinders reuse. Your friend's "instantly readable" only works for simple literals. Photos recall tokens, not types.)*  

  ### **Step 4: Can Quantity/Scale Be Shown by *Repetition*?**
  *   **Rule:** **Always prefer identical figures repeated.** Avoid resizing (bigger = more important/more quantity is ambiguous), stacking, or charts.
  *   **Test:** Does showing 3 identical houses clearly mean "3 houses" or "many houses"? If context makes it ambiguous...
  *   **Decision:**  
      → **CLEAR?** Use repetition. Proceed to **Step 5**.  
      → **UNCLEAR?** Add a numeral + text label (e.g., "3"). Proceed to **Step 5**. *(Honours Neurath: Repeating units are core. Resizing is unreliable.)*  

  ### **Step 5: Is the Symbol *Reusable*?**
  *   **Check:** Will this *exact* icon be used ≥3 times across different materials in the next 6 months?
  *   **Decision:**  
      → **YES?** Document it in a shared "symbol key". Invest slightly more time. **APPROVE.**  
      → **NO?** Accept it as a one-off. **Proceed to Step 6.** *(Acknowledges your key worry: Taught vocab needs reuse. One-offs don't justify the learning investment.)*  

  ### **Step 6: Values & Politics Check** *(Human Decision Point)*
  *   **Questions:**  
      1.  **Whose "Generic"?** (Body shape, clothing, housing style). **No "solution" – document the choice made and why.**  
      2.  **Approval Risk:** Will the Country Lead reject it for cultural/personal reasons? Have a text backup ready.  
      3.  **Emotional Pull vs Clarity:** Does a "better recalled" image (like your photo) *harm* comprehension of the core message if used elsewhere? (See your 3 cases below).  
  *   **Decision:** Make the call. Document it. **APPROVE or REVISE.**

  ---

  ### **Settling Your Arguments Explicitly**
  1.  **Detail vs. Simplicity:** Detail helps *only* for instant recognition of *specific, literal objects* (Step 3). It **hurts** for abstraction, recall of the *type* (not the token), reuse, and under your constraints. **Verdict: Your Neurath view wins for your context.** Flat silhouettes + repetition are reliable workhorses.
  2.  **AI Generators vs. Fixed Vocabulary:** Spitting out 40 varied scenes **destroys** the "taught vocabulary" principle. It creates inconsistency, confuses recognition, and undermines reuse. **Verdict: For reusable symbols (Step 5 YES), use fixed vocabulary. For one-offs (Step 5 NO), simple silhouettes are still better than AI randomness.**

  ---

  ### **Applying PDP to Your 3 Cases**
  1.  **"Second Dose Overdue" Icon (Child+Syringe Crossed Out)**  
      *   Step 1: **Abstract?** YES (Overdue + Negation). **STOP.**  
      *   **Solution:** Text + Literal Icon Combo.  
          *   **Header:** "SECOND DOSE LATE!" (Bold, red if possible).  
          *   **Visual:** Simple syringe + calendar icon showing "Day 28" with a bold red "X" over it *(The calendar+numeral provides concrete context the cross needs)*.  
          *   *PDP Verdict: Kills the crossed-out-child-syringe. It was doomed by abstraction.*
  2.  **Cholera Risk Graphic ("Risk High This Month")**  
      *   Step 1: Literal? NO (Risk is abstract). **STOP** for the *risk* concept.  
      *   **Solution:** Combine Literal Icons + Text + Symbolic Emphasis.  
          *   **Literal Icons:** Dirty water source (simplified silhouette) + Sick person (simplified silhouette).  
          *   **Text:** "CHOLERA RISK: HIGH NOW"  
          *   **Symbolic Emphasis:** Large red triangle "!" border around the graphic. *(Dirtier water/sicker people adds disgust, not clarity. Symbolic warning flags abstraction.)*  
          *   *PDP Verdict: Kills the "dirtier/more sick" approach. Realism here is counterproductive.*
  3.  **Cover Photo (Real Mother & Child at Clinic)**  
      *   Step 1: Literal? YES (Clinic visit).  
      *   Step 2: Direct? YES (Shows mother/child at clinic).  
      *   Step 3: Realism Help? **YES for emotional pull/recall of *this* cover.** Survives constraints? Likely (Photo already works).  
      *   Step 4: N/A (No quantity).  
      *   Step 5: Reusable? **NO** (It's a specific photo).  
      *   Step 6: **Values Call:**  
          *   *Pros:* Amazing recall (token memory!), emotional connection, boss loves it.  
          *   *Cons:* Not a reusable symbol, doesn't teach a vocabulary, might imply *only this clinic/these people*.  
      *   **PDP Verdict: KEEP IT.** But use it *only* as an emotional hook/attention grabber. **NEVER** use it *instead* of simple icons to convey instructions, risks, or abstract concepts inside the leaflet. Its job is recall & warmth. *Isotype is for information; this photo is for impact.* PDP doesn't kill it; it defines its *limited* role.

  ---

  ### **Where the PDP Won't Work (Honest Limitations)**
  1.  **Truly Abstract Concepts:** "Rights", "Consent", "Maybe". **PDP will always say STOP.** Use text + very simple supporting visuals *if helpful*.
  2.  **Requires Continuity:** As you feared, **Step 5 is the crunch.** If symbols *aren't reused*, the "taught vocabulary" benefit vanishes. PDP forces you to accept that one-offs are just visual aids, not a language.
  3.  **Cultural Specificity:** Step 6 is vital. PDP flags the "whose generic?" problem but *can't solve it*. That's a values/politics call.
  4.  **Emotional Messaging:** PDP optimises for clarity and recall of *information*. Deep emotional narratives or stigma reduction might need different tools (like your photo). PDP tells you *when* you're doing that.

  **Final Output:** A laminated flowchart checklist covering Steps 1-6 + the Argument Settlers, with your 3 cases as worked examples on the back. Run any new icon through Steps 1-5 in 10 minutes. Step 6 gets the team lead + relevant Country Lead on a quick call. Bin anything that hits **STOP**.
