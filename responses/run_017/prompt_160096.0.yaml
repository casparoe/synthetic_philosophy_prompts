  For section 4 (B-positive probe), I'll show it targets step (1)'s claim that lesion-based diagnoses avoid conduct-judgments. The probe demonstrates that even with a biomarker, confinement practices persist, proving the political issue centers on consent/coercion, not ontology.

  For section 5 (what survives), I'll salvage Szasz's core insight: psychiatric labels uniquely legitimize coercion over conduct-based objections, which differs from how physical illnesses function socially. The strongest claim is about institutional power, not metaphysics.

