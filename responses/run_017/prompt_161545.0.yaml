answer: |-
  ## Guidance for Claimants: Modal Compensation Entitlement Scheme (MCES)
  **Issued by the Modal Claims Office (MCO), Department for Modal Affairs**
  **Version 3.1 (Revised 15/10/2023)**

  **1. Introduction**
  This guidance explains the statutory scheme for claiming compensation under the Modal Entitlements Act (2023). The scheme provides financial redress to individuals who demonstrate that a described state of affairs constitutes a possible scenario under the stipulated assessment framework. The Modal Claims Office (MCO) administers the scheme. Claims must be submitted on Form MCO-1, available online or by post.

  **2. Core Entitlement Principle**
  Compensation is payable where a claimant successfully demonstrates that a described scenario (the "Claimed Scenario") satisfies the standard of Possibility as defined for the purposes of the MCES. Possibility is determined through the application of two distinct but operationally conjoined tests.

  *   **2.1 Test 1 (Scenario Considered as Actual):** The Claimed Scenario is evaluated *as if* it described the actual state of the world. Within this evaluation, the referents of terms used in the description are determined by the roles those terms fulfil *within the described scenario itself*. For example, a claim stating "the substance flowing from domestic taps is XYZ" would be assessed under Test 1 by determining what substance fulfils the role of 'substance flowing from taps' within that Claimed Scenario (e.g., XYZ).
  *   **2.2 Test 2 (Scenario Considered as Counterfactual):** The Claimed Scenario is evaluated *as a way the actual world might conceivably have been*. Within this evaluation, the referents of terms are fixed *as they are understood in the actual world*. Using the previous example, under Test 2, the term 'substance flowing from taps' would refer to H₂O (the actual referent), regardless of the description within the Claimed Scenario.

  **3. The Coincidence Provision (Section 7, Modal Entitlements Act)**
  For the efficient administration of the MCES and to ensure consistency in claim resolution, the Act incorporates the Coincidence Provision. This provision establishes that, **for the sole purpose of determining eligibility under this scheme**, satisfaction of Test 1 shall be deemed *conclusive evidence* of satisfaction of Test 2. Therefore, a Claimed Scenario passing Test 1 is automatically considered to pass Test 2, rendering the claimant eligible for consideration of an award, subject to other scheme requirements.

  **4. Claim Requirements & Assessment**
  *   **4.1 Clarity and Coherence:** The Claimed Scenario must be clearly and coherently described on Form MCO-1. Vague, contradictory, or logically incoherent descriptions will be rejected (Regulation 12(b)).
  *   **4.2 Endorsement Requirement:** All claims submitted under the standard procedure (utilising the Coincidence Provision) must include the **Mandatory Endorsement**: "The Claimed Scenario is described *as actual*." This endorsement must be signed and dated. Failure to include this endorsement will result in the claim being placed on hold pending clarification (Form MCO-3C).
  *   **4.3 Alternative Assessment Route (Form MCO-7A):** Claimants who believe their Claimed Scenario involves a **Deep Contingency** – where the outcome of Test 1 demonstrably *diverges* from the outcome of Test 2 under standard interpretation – may elect to submit Form MCO-7A ("Notification of Deep Contingency"). *Important Note:* Electing this route forfeits the automatic application of the Coincidence Provision. The MCO will conduct *both* Test 1 and Test 2 independently. Compensation is payable *only* if *both* tests are satisfied individually. This route typically involves extended processing times (see Section 6 on Processing Timelines).
  *   **4.4 Assessment Process:** Upon receipt of a valid claim (Form MCO-1 with Mandatory Endorsement, or Form MCO-7A), the MCO will determine if the Claimed Scenario passes Test 1. If using the standard route (Form MCO-1), the Coincidence Provision is then applied. If using Form MCO-7A, both tests are conducted separately.

  **5. Compensation Calculation & Limits**
  *   **5.1 Compensation Reference Framework (CRF):** Awards are calculated based on the perceived impact of the Claimed Scenario *not* being actual, assessed against a notional baseline. The CRF utilises a complex formula considering scenario complexity, claimant articulation effort, and standard impact metrics. A detailed breakdown is available in Annex B (not included in this leaflet; request separately).
  *   **5.2 Means Test:** All awards are subject to a statutory Means Test (Schedule 2, Modal Entitlements Act). Compensation may be reduced or set to zero based on the claimant's financial circumstances as verified by HM Revenue & Customs data. Claimants must consent to data sharing on Form MCO-1.
  *   **5.3 Scheme Cap:** Total compensation payable to any single claimant under the MCES in a fiscal year is capped at **£1,750** (Regulation 45). This cap applies irrespective of the number or complexity of claims submitted.

  **6. Processing Timelines & Appeals**
  *   **6.1 Standard Claims (Form MCO-1):** Aim to process within 18 months. High volume may cause delays.
  *   **6.2 Deep Contingency Claims (Form MCO-7A):** Minimum processing time 36 months due to dual-test requirement.
  *   **6.3 Appeals:** Refused claims may be appealed to the First-tier Tribunal (Modal Entitlements) within 28 days of the decision notice. Grounds for appeal are limited to procedural error or misapplication of the published guidance/MCO regulations. The validity of the Coincidence Provision itself *cannot* be appealed under the scheme.

  **7. Worked Example**
  *   **Claimant Description:** "Hesperus is not Phosphorus."
  *   **Assessment (Standard Route - Form MCO-1 + Mandatory Endorsement):**
      1.  Test 1 (Considered as Actual): In a scenario described *as actual* where 'Hesperus' refers to the evening star and 'Phosphorus' refers to the morning star, it is possible they are distinct celestial bodies. Test 1 passed.
      2.  Coincidence Provision Applied: Test 1 pass deems Test 2 passed.
  *   **Eligibility:** Claimant eligible for compensation calculation.
  *   **Calculation:** CRF applies. Means Test applies. Cap applies. (Actual award likely nominal after means test and cap).

  **8. Frequently Asked Questions (FAQ)**

  *   **FAQ 1: What if my scenario is very simple?** All coherently described scenarios satisfying Test 1 are eligible under the standard route. Complexity affects the CRF calculation, not core eligibility.
  *   **FAQ 3: Why the Mandatory Endorsement?** It ensures claimants affirm the perspective required for the correct application of Test 1 and the subsequent Coincidence Provision. It is a statutory requirement.
  *   **FAQ 5: Should I use Form MCO-7A?** Only if you are certain your claim involves a Deep Contingency where Test 1 and Test 2 *would* yield different results *and* you believe it would pass *both* tests independently. Otherwise, the standard route (Form MCO-1) is generally more efficient. Seek Independent Advice if unsure (see Section 9).
  *   **FAQ 7: Is there compensation for scenarios *actually* being different?** The MCES compensates based on the *possibility* of the described scenario, assessed as per the Act and this guidance. It is not a scheme for correcting actual past injustices.
  *   **FAQ 8: My scenario involves a world physically identical to ours but lacking conscious experience. Is this claimable?** Yes, subject to the standard requirements (Form MCO-1, Mandatory Endorsement, coherence). Such claims are assessed under Test 1 (considered as actual: in that scenario, the relevant functional roles are filled without consciousness), pass, and the Coincidence Provision applies. Awards are subject to the CRF, Means Test, and Cap. *(Editorial Note: Processing of these specific claim types has been temporarily prioritised within standard resource constraints).*
  *   **FAQ 10: Where does the funding come from?** The MCES is funded through a consolidated grant from HM Treasury. Scheme administration costs are carefully managed.

  **9. Independent Advice**
  Independent advice on completing claims may be available from Citizens Advice or authorised modal advice centres (list available at www.gov.uk/mco-advice-centres). The MCO cannot provide advice on claim content.

  **Modal Claims Office, Department for Modal Affairs**
  **PO Box 777, Cricklewood, London NW2 1AB**
  **www.gov.uk/modal-claims**
  **Helpline: 0300 123 4567 (Mon-Fri, 9am-1pm)**
