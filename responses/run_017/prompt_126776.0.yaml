prompt: |-
  I'm on a tiny committee at my professional body — we certify people who write technical assessment reports, sort of like a licensing thing — and we've been going back and forth on a proposal one of our members pitched, which he calls a "currency requirement," copied from aviation. As far as I understand the aviation version: airline crews fly almost everything on autopilot and are often required to by their own procedures, but pilots still have to log a few recent manual takeoffs and landings to stay legal to carry people, and they go into the simulator every few months to have the automation failed on them and hand-fly something ugly. His version for us: members would have to log around ten hours a quarter of work done with no AI assistance at all (no autocomplete either), plus one unannounced "cold check" a year where you're handed something you submitted eight months ago, no tools, and asked to reconstruct the reasoning out loud while someone grades it. We'd still let people use AI freely on actual client work.

  What I can't get straight is what we'd be claiming if we did this, because the two halves of the aviation practice seem to pull in opposite directions — you're mandated to depend on the automation and also mandated to periodically not depend on it. So: what does the practice actually presuppose about understanding or skill? Is the point that you need the unaided capacity in reserve to notice when the tool goes wrong, is it that the capacity decays without use and the credential is supposed to certify the person rather than the document, or is it something about the struggle being what builds the understanding in the first place? Please separate what the practice strictly presupposes from what it merely fits well with — I have a feeling several quite different theories of understanding would each license some version of it, and I'd like to know where it's genuinely underdetermined.

  Two more things are bugging me and I'd like them addressed rather than swept aside. First, the line-drawing: we never required anyone to do unaided mental arithmetic, or navigate without GPS, or write without a spellchecker, or (for that matter) work without colleagues and reference books, and those all got absorbed fine — so is there a principled difference in the AI case, or is this just novelty and professional-status anxiety dressed up? One of our members keeps saying that on the extended-mind / distributed-cognition sort of view there was never an "unaided" state to protect anyway, and I can't tell whether that kills the proposal or is compatible with it for totally different reasons. Second, whether the analogy even transfers: in the cockpit the automation fails loudly — it disconnects, the alarms go off, you're handed the airplane — whereas an LLM hands you something fluent and wrong and nothing announces it, and I suspect that changes which rationale, if any, survives. And if we decided the whole presupposition was mistaken, what would assessment have to look like instead? I keep coming back to unbundling the two things — grade the artifact, and separately grade whether the person could have produced or defended it — and then not knowing whether that second number should go on the credential or stay private. I'm not a philosopher, so feel free to use the technical vocabulary but explain it as you go, and please don't just tell me who to read.
reasoning: |-
  Okay, let me unpack this committee member's proposal about implementing an "AI currency requirement" for their certification body. The aviation analogy is interesting but raises several conceptual and practical questions that need careful dissection. 

  First, the user is struggling with the apparent contradiction in the aviation model: mandating reliance on automation while also requiring periodic unaided practice. This isn't really inconsistent when you examine the underlying rationale. The core presupposition is that operational competence requires maintaining baseline manual skills as a fallback capability. It's not about rejecting tools, but about preserving the capacity to detect tool failures and intervene. 

  The line-drawing concern is particularly sharp. Previous technological shifts (calculators, spellcheck, GPS) didn't trigger similar requirements because those tools had predictable failure modes and clear verification methods. LLMs introduce novel risks: their errors are latent, semantically coherent, and often require domain expertise to catch. This creates a qualitative difference in the kind of vigilance needed. 

  The distributed cognition counterargument (that there's no "pure" unaided state) actually strengthens the case for currency requirements. Precisely because cognition is distributed, we must actively maintain the biological node's capacity to monitor and correct the non-biological components. The cold checks specifically target this by assessing reconstruction ability - a proxy for whether the human retains the causal model underlying past reports.

  For the analogy transfer problem: yes, the failure mode difference is crucial. Since LLMs fail silently, the aviation rationale shifts from "recovering from loud failures" to "preventing silent ones." This suggests the manual practice should emphasize error-detection drills (e.g., reviewing AI outputs for subtle flaws) rather than just unaided production. 

  If rejecting the presupposition, alternatives would need to focus on testing monitoring competence directly - perhaps through viva voce exams probing understanding of AI-generated reports, or controlled exercises where candidates must identify seeded errors in synthetic work products. The credential might then certify "supervisory competence over AI-assisted work" rather than unaided capability.

  The unbundling idea is perceptive but incomplete. Artifact assessment alone can't capture whether the human provided meaningful oversight. A hybrid approach might work: certify the artifact's quality publicly, while requiring private skill verification (via cold checks or similar) as a licensing condition. This separates what the public sees (document quality) from what the profession guarantees (practitioner competence).
answer: |-
  You've hit on precisely the tensions that make this proposal philosophically rich and operationally tricky. Let's dissect the presuppositions, transferability, and alternatives systematically.

  ### Core Presuppositions of the Aviation Model (Strict vs. Compatible)
  - **Strict Presupposition (Non-Negotiable):**  
    *Operational competence requires maintaining a latent capacity to perform core tasks without automation.* This isn't about preferring manual work; it's a hedge against unpredictable system failure. The practice presupposes that:  
    - Skill decay occurs with disuse ("use it or lose it").  
    - Automation can fail catastrophically *or* insidiously (e.g., giving incorrect data without alarms).  
    - The human must be the ultimate failsafe.  

  - **What It Merely Fits With (Compatible but Not Required):**  
    - **Epistemic Vigilance Theory:** Unaided practice trains error-detection in automated outputs (spotting "fluent nonsense").  
    - **Foundational Skill Theory:** Struggling manually builds deep understanding that aids tool *supervision* (not just operation).  
    - **Anti-Obsolescence View:** Preventing deskilling preserves professional agency if tools change/withdrawn.  

  ### Your Two Key Objections: Line-Drawing & Analogy Transfer
  1. **"Why AI But Not Calculators/Spellcheck?" The Novelty Question:**  
     - **Principled Difference #1: Opacity vs. Transparency.**  
       Calculators/spellcheck are deterministic; errors are traceable to user input or clear limits (e.g., "divide by zero"). LLMs generate *novel, plausible* errors with no audit trail. Unaided work here maintains *conceptual integrity* to catch fabrications.  
     - **Principled Difference #2: Cognitive Offloading Depth.**  
       Autocomplete offloads motor execution; LLMs offload *reasoning scaffolds* (e.g., structuring arguments, weighting evidence). If reasoning atrophies, you lose capacity to validate outputs.  
     - **Distributed Cognition Rebuttal:** Yes, cognition is always distributed. But the *accountability node* must retain core competence. Licensing certifies the human's role in the system – not just the network's output. The proposal forces practitioners to recenter on their node.  

  2. **"Silent Failure" vs. "Loud Failure": Does the Analogy Hold?**  
     - **Crucially, It Changes the Rationale.** Aviation practice prepares for *acute* failure (alarms blaring). For LLMs, the threat is *chronic*:  
       - **Skill Decay Rationale Weakens:** If failures are silent, you might never *use* manual skills reactively.  
       - **Vigilance Rationale Strengthens:** Manual practice trains anomaly detection (e.g., "This conclusion feels too fast – did the AI skip steps?").  
       - **Cold Checks Adapt Better:** Reconstructing past work tests retention of *personal epistemic artifacts* – your own reasoning traces, not generic skill.  

  ### If the Presupposition is Mistaken: Assessment Alternatives
  Rejecting unaided capacity demands a shift to **supervisory competence** assessment:  
  1. **Artifact Defense Model:**  
     - Submit AI-assisted reports, then undergo viva voce probing: *"Walk us through how you validated Step 4. What alternatives did you consider and reject?"*  
     - **Pros:** Directly tests oversight. **Cons:** Hard to distinguish memorized prompts from genuine understanding.  
  2. **Controlled Sabotage Tests:**  
     - Provide an AI-generated report with seeded errors (in logic, data, compliance); grade detection/correction.  
     - Simulates real-world monitoring under pressure.  
  3. **Process Auditing:**  
     - Require documentation of human-AI interaction: version histories, prompt iterations, validation steps.  
     - Certifies the *system*, not just the person.  

  ### Should "Capacity" Be Certified or Private?
  - **On the Credential:** Only the *output quality* (artifact) and *supervisory competence* (defense/sabotage tests) should be public. The public cares that reports are reliable, not how they're made.  
  - **Private Licensing Requirement:** "Capacity" metrics (manual hours, cold checks) are maintenance requirements – like CME credits. They assure *the profession* that members remain valid accountability nodes.  

  ### Recommendation for Your Committee
  The proposal's strongest justification is **error detection in silent-failure environments**. Frame it as:  
  - **Manual Hours:** Not about nostalgia, but maintaining *conceptual resolution* to spot AI hallucinations.  
  - **Cold Checks:** Ensure members retain *personal intellectual archives* (their own reasoning traces), not just tool proficiency.  

  **Compromise Structure:**  
  - Replace fixed "no AI" hours with **"vigilance drills"**: 10 hrs/quarter *testing* AI outputs on old cases, comparing to manual rework.  
  - Keep cold checks, but allow **reference to original notes** (testing reconstruction ability, not memory).  
  - **Sunset Clause:** Review in 3 years as tools/monitoring evolve.  

  This shifts from "protecting unaided skill" to "certifying cognitive oversight" – which addresses distributed cognition concerns while hedging against silent risks. The credential stays focused on output quality, while the profession privately maintains its human accountability layer.
