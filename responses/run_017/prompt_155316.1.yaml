  **Defense Notes for Student Queries:**  
  - **(a) "Cooperates with anyone"**: Hofstadter (1983) *requires* players to assume identical reasoning (i.e., mutual superrationality). Against an ordinary player, superrational cooperation fails.  
  - **(b) Probability formula**: While `20p(1-p)^19` is technically the probability *a given player wins*, superrationality *also* requires this individual optimization to align with group success. Your conclusion (p=1/20) is correct, but the formula alone doesn't show collective rationality.  
