  ### **How to Use**  
  1. Have participants answer individually.  
  2. Tally responses and use the scoring key to assign positions.  
  3. Discuss: "Which position’s awkward commitment are you willing to accept? Where did the quiz mislabel you?"  
  4. Focus debate on concrete cases (e.g., "How would your position handle the surgeon?") instead of labels.  

  This avoids rehashing "open borders" debates by forcing choices on dilemmas that fracture coalitions. Engineers and lawyers appreciate the case-based, combinatorial approach.
