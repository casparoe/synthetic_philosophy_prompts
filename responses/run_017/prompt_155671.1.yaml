  ### **Diagnostics**
  - **Unoccupied Combinations**: Patterns like Q1A (full welfare) + Q4A (guest workers) are incoherent—you can’t demand equal benefits while endorsing exclusionary programs. Patterns with Q8B (borders justified without welfare) + Q1A (unconditional welfare access) conflate cultural/national logic with redistribution.  
  - **Undifferentiated Pairs**:  
    - *Thin vs. Thick Integrationism*: Both answer Q5 with B/C. **To split them**, add: *"Should Vandia require migrants to adopt liberal social values (e.g., gender equality) to keep residency?"* Thick says yes; Thin says no.  
    - *Open Borders+ vs. No States, No Borders*: Both reject Q4’s guest-worker program. **To split them**, add: *"Should Vandia exist as a state with coercive laws?"* Open Borders+ says yes; No States says no.  
  - **Weakest Quiz Point**: Q4 (guest workers) and Q5 (enclave) collapse "thick" and "thin" integrationism. The surge question (Q9) struggles to isolate threshold effects from plain consequentialism.  
  - **Portable Benefits Note**: This isn’t incoherent—it’s administratively daunting (requires global tax treaties) and unoccupied in literature because states resist cross-border welfare liabilities.  

