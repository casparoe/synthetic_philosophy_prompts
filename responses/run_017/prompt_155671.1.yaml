  ### **Scoring Key**
  Match your answers to the letter patterns below to find your position. **Positions are descriptive labels, not -isms.** Each includes:  
  - **Awkward Commitment**: A tough implication of the view.  
  - **Weak Case**: A scenario it handles poorly.  

  | Answer Pattern (Q1–Q10) | Position Label | Key Tenets | Awkward Commitment | Weak Case |
  |--------------------------|----------------|------------|---------------------|-----------|
  | Mostly A’s (esp. Q1A, Q8A, Q9A) | **Open Borders+** | Full right to cross, equal welfare access, numbers irrelevant | Must admit even those who actively undermine social trust (Q5) | Selling admission (Q10) – conflicts with non-commodification |
  | Q1B, Q2A, Q4A, Q5A, Q8A | **Guest Worker Open Borders** | Right to reside/work, but no welfare access for years | Retirees (Q2) – they don’t work but also don’t claim benefits | Long-term unauthorized residents (Q7) – denies regularization after contributions |
  | Q1C, Q2A, Q6A, Q7A, Q8B | **Generous Nationalist** | Vandia controls borders but admits generously for family/refugees | Wealthy retiree (Q2) admitted freely while needy laborer (Q1) is excluded | Surgeon (Q3) – no mechanism to address brain drain |
  | Q1C, Q2A, Q3A, Q4A, Q8A | **Welfare State Restrictionist** | Borders protect redistribution; admit only net-contributors | Surge (Q9) – if migrants are excluded from welfare, why restrict numbers? | Counterfactual no-welfare state (Q8) – undermines core justification |
  | Q1C, Q2B, Q5B/C, Q7C, Q10A | **Club Model** | Vandia is a members’ association; admission based on cultural fit/contribution | Spousal reunification (Q6) – risks admitting "non-assimilating" members | Aging laborer (Q1) – excludes those who pose no cultural threat |
  | Q3B/C, Q4A, Q8A, Q9C | **Global Consequentialist** | Focus on effects on sending countries, not Vandia’s rights | Cultural enclave (Q5) – tolerates internal fragmentation if it aids global poor | Wealthy retiree (Q2) – no harm to sending country, but no benefit either |
  | Q5B/C, Q6B, Q7B | **Integrationist (Thin or Thick)** | Admission conditional on assimilation; welfare delayed until integration | Unauthorized resident (Q7) – denies full rights despite law-abiding life | Surge (Q9) – struggles to scale individualized integration checks |
  | *Any pattern* + Q1C, Q4C, Q5A, Q8A | **No States, No Borders** | Rejects legitimacy of borders/states entirely | Temporary workers (Q4) – opposes even voluntary contracts that deny citizenship | Selling admission (Q10) – opposes markets but offers no alternative |
  | Q1C, Q2A, Q3A, *and support for portable benefits* | **Portable Entitlements Model** | Migrants keep home-country benefits (funded by host-country surcharge) | Retiree (Q2) – no earnings to surcharge; requires bilateral treaties | Surgeon (Q3) – brain drain persists, and surcharge may not offset it |

