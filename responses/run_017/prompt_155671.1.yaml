  ### **The Vandia Immigration Quiz**
  *Answer each question based solely on the scenario described. Vandia is a rich, aging democracy of 12 million with a generous welfare state. There are no "right" answers—only what you believe Vandia should do.*

  1. **The Aging Laborer**: An unskilled 55-year-old from a much poorer country wishes to move to Vandia. He will likely be a net recipient of welfare for his remaining life. Should Vandia admit him?  
     - A) Yes, with immediate full welfare access  
     - B) Yes, but with no welfare access (self-support only)  
     - C) No  

  2. **The Wealthy Retiree**: A rich 65-year-old from a poorer country wants to retire in Vandia. She will never work or claim benefits. Should Vandia admit her?  
     - A) Yes, residency is a right regardless of wealth  
     - B) Yes, but only if she pays a large fee  
     - C) No  

  3. **The Surgeon & the Clinic**: A surgeon from a country with severe doctor shortages wishes to move to Vandia. She will send half her salary home to fund a clinic. Should Vandia admit her?  
     - A) Yes, her choice benefits everyone  
     - B) Yes, but tax her to compensate her home country  
     - C) No, her departure harms her homeland too much  

  4. **Temporary Worker Program**: Vandia proposes admitting workers for 5-year terms. They can work but get no welfare, voting rights, or citizenship path. Is this acceptable?  
     - A) Yes, work access alone is valuable  
     - B) Only if they gain a citizenship path after 5 years  
     - C) No, it creates second-class residents  

  5. **The Cultural Enclave**: A migrant lives in Vandia, obeys all laws, but rejects its secular norms and speaks only his native language in an isolated community. Should this affect his residency?  
     - A) No, only law-breaking matters  
     - B) Yes, require language/civic classes to keep residency  
     - C) No—he shouldn’t have been admitted without prior assimilation  

  6. **Spouse Reunification**: A Vandian citizen marries someone from a much poorer country. The spouse seeks residency. Should Vandia admit them?  
     - A) Yes, with immediate full rights  
     - B) Yes, but with delayed welfare access (e.g., 5 years)  
     - C) Only if the spouse meets standard immigration criteria  

  7. **Long-Term Unauthorized Resident**: A migrant entered illegally 15 years ago, worked, paid taxes, and stayed crime-free. Should Vandia grant legal status?  
     - A) Yes, with a path to citizenship  
     - B) Yes, but no welfare access and probationary status  
     - C) No, amnesty rewards law-breaking  

  8. **The Borderless Welfare Test**: *Imagine Vandia has no welfare state.* Would closed borders still be justified?  
     - A) No—without welfare, borders lose their main purpose  
     - B) Yes—culture/security/self-determination still matter  
     - C) Depends on other factors (e.g., economic impact)  

  9. **The Surge**: Vandia admits 50,000 immigrants/year without issue. Suddenly, 2 million wish to enter next year. Must policy change?  
     - A) No—principles don’t change with numbers  
     - B) Yes—sheer numbers would overwhelm institutions (threshold effect)  
     - C) Yes—consequences (e.g., social cohesion) would be negative  

  10. **Selling Admission**: Should Vandia auction residency permits to wealthy foreigners?  
      - A) Yes—efficient and funds public goods  
      - B) Only if revenue offsets costs for poorer migrants  
      - C) No—admission should be need/merit-based, not market-driven  

