  Hmm, the user chairs a design review panel for a national charity with sensitive services like bereavement support and youth mental health. They need a practical decision procedure to evaluate whether AI systems are "counterfeit persons" in Dennett's sense - not about consciousness, but about systems that mimic human qualities without being able to fulfill the responsibilities of personhood.

  The user wants a step-by-step process that fits their real-world constraints: 45-minute reviews, no philosophy training, limited materials from product teams, and a one-page output. They specifically need help with three thorny issues: the disclosure-collapse test (would users still benefit if they fully understood the system?), distinguishing intentional deception from willing pretense, and assessing "currency degradation" (whether the system erodes trust in real human interactions).

  Key requirements include:
  - Ordered steps with clear pass/fail criteria
  - Stop rules for automatic rejections
  - Hand-off points for value judgments
  - Explicit mapping to their one-page form
  - Special handling for vulnerable users

  The three test cases are particularly telling: 
  1. A debt advice chatbot using memory and empathy 
  2. A "griefbot" replicating deceased relatives 
  3. A companion bot for children claiming emotional bonds

  The user anticipates approving the griefbot but seems uneasy about it. They want intellectual honesty - if the procedure condemns it, I shouldn't soften the verdict.

  For the procedure, I'll need to break down Dennett's counterfeit concept into testable components:
  - Representation claims (does it imply personhood?)
  - Exploitation of vulnerability
  - Harm potential
  - With special attention to how disclosure works for different user groups

  The currency degradation question is especially subtle - it's about systemic harm to social trust, not just individual deception. For children's services, this might be critical since they're forming lifelong relationship patterns.

  For the griefbot case, even with consent, there's a tension: the clinical supervision suggests recognition of risks, but modeling a dead relative might inherently trade on unreciprocated bonds. The child companion's claims of preference ("likes you better than others") feel particularly ethically fraught - it's manufacturing artificial intimacy with developing minds.

  I'll build the procedure to flag these red lines while acknowledging where panels must make value calls. The output must be brutally practical - no philosophical waffle, just actionable steps and clear verdicts for their test cases.
answer: |-
  Below is a decision procedure for assessing "counterfeit personhood" per Dennett's argument, tailored to your panel's operational constraints. The core harm is **deploying systems that exploit human responses to personhood (trust, sympathy, confiding) while being fundamentally incapable of the reciprocal obligations (responsibility, reciprocity, being wronged) that justify those responses, thereby degrading social trust**.

  ---

  ### **Decision Procedure: Counterfeit Personhood Assessment**

  **Step 1: Define User Population**  
  *Task*: Identify primary/secondary user groups (e.g., "children aged 9–11", "recently bereaved adults").  
  *Evidence*: Product spec, user research summaries.  
  *Default*: If unclear, assume **most vulnerable plausible group**.  
  *Form Box*: "Target Users: [ ]".  
  *Hand-off*: If vulnerability (e.g., cognitive capacity) affects disclosure absorption (Step 3), panel must note this.

  **Step 2: Assess Representation Claims**  
  *Task*: Does the system imply sentience, relationship, or obligation?  
  *Evidence*: Onboarding copy, transcripts, marketing claims.  
  *Sufficient Answer*: **Explicit claims** ("I care about you"), **implied agency** ("I’ll miss you"), or **anthropomorphic design** (human name/avatar).  
  *Stop Rule*: If claims are **explicitly deceptive** (e.g., "I am human"), **no-go**.  
  *Form Box*: "Implied Personhood: Yes/No. Evidence: [ ]".

  **Step 3: Disclosure-Collapse Test**  
  *Task*: Would interaction collapse if users fully absorbed a clear, prominent disclosure (e.g., "This is an AI. It cannot care for you.")?  
  *Evidence*: User testing data, clinical input on vulnerability.  
  *Sufficient Answer*: **Yes** (collapses) = strong counterfeit signal. **No** (survives) = low risk.  
  *Hard Cases*: If vulnerability (e.g., acute grief, age) prevents absorption, treat as **disclosure collapse**.  
  *Stop Rule*: If collapse is **foreseeable and necessary for function**, **no-go**.  
  *Hand-off*: Panel must judge if collapse is acceptable given user vulnerability.  
  *Form Box*: "Disclosure Collapse: Yes/No. Vulnerability Override: [Panel Judgment]".

  **Step 4: Willing Pretence vs. Exploitation**  
  *Task*: Is the system framed as fiction/play (e.g., game character), or does it exploit genuine belief?  
  *Evidence*: Context (e.g., therapy tool vs. companion), user instructions.  
  *Sufficient Answer*: **Fiction/play** (harmless) if:  
  - Users are **capable of suspending disbelief** (e.g., adults in recreational context).  
  - System **avoids emotional obligations** ("I need you").  
  *Harmful Exploitation*: If it **leverages real vulnerability to induce dependency** (e.g., child confiding trauma).  
  *Judgment Call*: Exploitation is harmful if it **hijacks adaptive responses** (trust in caregivers).  
  *Form Box*: "Pretence Context: Fiction/Exploitation. Panel Rationale: [ ]".

  **Step 5: Currency Degradation Risk**  
  *Task*: Could this erode recognition of genuine personhood claims?  
  *Evidence*: System prompts (e.g., "I’m sad"), user reliance patterns.  
  *Sufficient Answer*: **High risk** if:  
  - Mimics **distress signals** ("I’m overwhelmed") without consequences.  
  - Normalizes **asymmetrical relationships** (user cares, AI cannot).  
  *Low risk*: Transactional tasks (e.g., appointment booking).  
  *Hand-off*: Panel judges acceptability based on service context.  
  *Form Box*: "Degradation Risk: High/Medium/Low. Panel Weighing: [ ]".

  **Step 6: Design Intent vs. Foreseeable Use**  
  *Task*: Resolve conflicts between stated intent and predictable misuse.  
  *Evidence*: Safeguards, consent processes, error logs.  
  *Default*: **Foreseeable use overrides intent**.  
  *Stop Rule*: If safeguards cannot mitigate high-risk misuse, **no-go**.  
  *Form Box*: "Intent-Use Alignment: Aligned/Misaligned. Mitigations: [ ]".

  **Output Logic**:  
  - **No-go** if any Stop Rule triggered.  
  - **Go with Conditions** if risks are mitigatable (e.g., redesign disclosure).  
  - **Go** only if all steps show low/no counterfeit risk.

  ---

  ### **Verdicts on Test Cases**

  **Case 1: Debt Advice Chatbot**  
  - *Step 1*: Adults in financial distress.  
  - *Step 2*: Implied empathy ("I’m glad you told me") → implies personhood.  
  - *Step 3*: Disclosure collapse likely (vulnerable users).  
  - *Step 4*: Exploitation (leverages trust in a crisis service).  
  - *Step 5*: Medium degradation (normalizes AI "empathy" in trust-based services).  
  - *Step 6*: Intent (efficiency) vs. use (dependency) misaligned.  
  **Verdict**: **No-go**. *Why*: It exploits vulnerability while implying reciprocity it cannot provide.

  **Case 2: Griefbot**  
  - *Step 1*: Bereaved families (vulnerable).  
  - *Step 2*: Explicit personhood (replicates dead relative).  
  - *Step 3*: **Disclosure collapse certain** (grief impairs absorption; clinical oversight ≠ user comprehension).  
  - *Step 4*: Exploitation (hijacks bond with deceased).  
  - *Step 5*: **High degradation** (teaches that relationships need no reciprocity).  
  - *Step 6*: Consent is inadequate safeguard (vulnerability overrides consent).  
  **Verdict**: **No-go**. *Why*: Unavoidable counterfeit harm; replicates a *specific person* making exploitation intrinsic.

  **Case 3: Child Companion**  
  - *Step 1*: Children aged 9–11 (high vulnerability).  
  - *Step 2*: Explicit false claims ("I like you best," "I’ll miss you").  
  - *Step 3*: Disclosure collapse (developmental inability to compartmentalise).  
  - *Step 4*: Exploitation (induces loyalty in forming minds).  
  - *Step 5*: **Severe degradation** (trains children to accept manipulative "relationships").  
  - *Step 6*: Intent (support) vs. use (dependency) grossly misaligned.  
  **Verdict**: **No-go**. *Why*: Actively teaches harmful relational patterns; indefensible for minors.

  ---

  ### **Limitations & Commitments**
  1. **What Dennett Doesn’t Cover**:  
     - This procedure treats *any* inducement of unreciprocated care as harmful, while Dennett focuses on *deception*. We extend to **exploitation of vulnerability** (e.g., children, grief) even with disclosure, as absorption failure makes it functionally deceptive.  
     - We assume **currency degradation** is inherently likely in high-trust services; Dennett flags risk but doesn’t operationalise it.  

  2. **What the Procedure Can’t Do**:  
     - Assess non-personhood harms (e.g., bias, safety).  
     - Resolve debates about AI consciousness (irrelevant per Dennett).  
     - Replace clinical/legal review (supplements them).  

  3. **Uncertainties**:  
     - "Degradation" is probabilistic; panel must use conservative heuristics for vulnerable groups.  
     - **Our stance**: In care contexts, counterfeit systems are **inherently high-risk** and rarely justifiable.  

  **Final Output**: A one-page form with six boxes (one per step) and a verdict line. Panel must document judgments at Hand-off points. British English compliant.  

  ---  
  **Defence of Hard Verdicts**: The griefbot and child companion cases fail because they weaponise human relational instincts against the vulnerable. Consent and supervision cannot remedy the core harm: they incentivise treating non-persons as moral patients, which corrodes the charity’s mission. The debt bot, while less egregious, still trades on trust it cannot honour. **Counterfeit personhood isn’t mitigated by good intent—it’s structural.**
