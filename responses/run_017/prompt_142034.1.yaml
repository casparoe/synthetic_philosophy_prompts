  I'm a fourth-year PhD student in the programming languages group — I work on dependent types, mostly Coq — and I've been landed with the 80 minute slot on constructive reasoning in our departments "logic bootcamp" for incoming PhDs, in two weeks. Most of the room will be CS students who've written some Coq or Agda but have never had a logic course beyond induction-on-the-derivation, and a couple of them are philosophy-adjacent and dont code, so I can't lean on Curry-Howard as the main vehicle even though it's the thing I'd reach for first. I also know for a fact that a fifth-year has already told them that intuitionistic logic is just classical logic without excluded middle, strictly weaker, nothing to see here, so they will turn up thinking the slot is a formality.

  Don't write the lecture for me. I want a plan for how to teach it.

  1. The order the pieces have to go in and what depends on what. My instinct is that the Brouwer-Heyting-Kolmogorov style reading of or and exists — a proof of A or B is a choice of a side plus a proof of that side, a proof of exists x. A is a witness plus a proof — has to come before anyone says the words "law of excluded middle", because otherwise "why can't I just split on whether P holds" doesn't sound like a question that needs an answer. But I'm not sure where the real numbers go: I want them to see that you can't in general decide whether two constructive reals are equal (or what the constructive substitute for comparing them even is), and I don't know whether that needs the BHK clauses first or whether it can be what motivates them. And where, if anywhere, does the split between Brouwer-style intuitionism — which adds principles like continuity and bar induction and outright refutes bits of classical maths — and Bishop-style constructive maths, which is deliberately a common subset with no extra axioms, belong? One of the philosophy people will have read something and will say "isn't this all just about meaning being use?", and I want to know if that's a derailment I should absorb into the sequence or head off in advance.

  2. The one example to carry the whole thing. I keep going back and forth between the root-two-to-the-root-two proof that there are irrationals a and b with a^b rational, and the intermediate value theorem — the bisection argument looks totally constructive right up to the point where you have to decide whether f at the midpoint is zero. I currently prefer IVT because it hands me the contrast between the exact statement and the approximate one (for every epsilon there's an x with |f(x)| < epsilon), which is provable, and because I've heard there's a computable function that crosses zero but has no computable zero, which would show the exact version really is unprovable rather than just unfound. Tell me which one to use, what the carrying example has to have and what it has to lack — I worry a careless choice makes constructive maths feel like classical maths with theorems deleted, i.e. a loss — and say explicitly why not the other one. If there's a better example I haven't thought of, name it and say why it's better.

  3. The misconceptions, in the order they'll form, and the point in the sequence where I should kill each one. The ones I'm expecting: "so intuitionists assert that excluded middle is false" — I want to head this off with the fact that not-not-(A or not-A) is itself constructively provable, so flatly denying A or not-A would be inconsistent, and I want to know whether that's the right tool and the right moment; "constructive maths is just whatever you can get without choice and excluded middle"; "you can always mechanically convert a classical proof into a constructive one" (I think this is only half true and only for certain shapes of statement, but I don't know what the honest two-sentence version is at this level); and "if it's neither proved nor refuted then it has no truth value, or it's a third truth value". Tell me what I'm missing, specifically for an audience that has written `destruct (classic P)` in Coq a hundred times without thinking about it.

  4. Where the disjunction and existence properties go. My plan is to use them as the payoff: a theory with the disjunction property can't prove every instance of A or not-A, because then it would have to settle every open problem it can state, and no consistent arithmetic strong enough to encode itself does that. That's the moment the CS people should sit up. Is that right as I've stated it, or does it need a guardrail? I realise there are intuitionistic theories that prove A or not-A for particular A, including for decidable A, so the failure has to attach to the universal claim and not to instances — tell me how to phrase it so I don't get caught out by the one smart question in the room.

  5. What to refuse to explain, out loud, and what to name-and-move-on: choice sequences, bar induction and the fan theorem, realizability, Kripke versus Beth semantics, the double-negation translation beyond one sentence, whatever Brouwer's continuity principle is actually doing. My guess is I should say the words so they know the words exist and then decline the details, but I want to know which one of these I'm likely to get a serious question on and should therefore have two honest sentences ready for.

  6. One thing for the last slide that tells me whether it landed rather than whether they were entertained. I was going to hand them a short classical proof containing exactly one non-constructive step and ask them to find it and say whether it can be repaired — but I dont have a good candidate: I want something short, whose suspicious step looks innocent, and where the answer to "can it be repaired?" is interestingly different from the near-identical variant next to it. Suggest the pair, or suggest a different check if a written one would just test pattern-matching.
reasoning: |-
  We are designing a lecture plan for a 80-minute session on constructive reasoning for incoming PhD students with mixed backgrounds (CS with some Coq/Agda, and philosophy-adjacent non-coders). The goal is to challenge the misconception that intuitionistic logic is just classical logic without excluded middle and to show that it is a meaningful alternative with its own insights.

  Key constraints:
  - Cannot rely heavily on Curry-Howard (though it might be mentioned).
  - The audience has seen induction on derivations but no deep logic course.
  - A fifth-year has already told them that intuitionistic logic is weaker and uninteresting.

  Plan structure:

  1. **Order of Pieces**:
     - Start with the **Brouwer-Heyting-Kolmogorov (BHK) interpretation** to establish the meaning of logical connectives in terms of evidence/proof. This is crucial to preempt the question "why can't I just split on P?" when we get to excluded middle.
     - Then introduce **excluded middle (LEM)** and show that it is not assumed. Emphasize that we are not denying LEM (because ¬¬(A∨¬A) is provable constructively) but rather we are not assuming it.
     - Next, use a concrete example to show that LEM is not always justified. The **Intermediate Value Theorem (IVT)** is a good candidate because:
          * It is a familiar theorem.
          * The classical proof uses a non-constructive step (deciding the sign of f at the midpoint repeatedly).
          * The constructive version is an approximate one (for every ε>0, there is x such that |f(x)|<ε) and is provable.
          * There is a computable counterexample: a computable function that crosses zero but has no computable zero (e.g., a function that oscillates and only crosses zero at a non-computable real). This shows the exact IVT is not provable constructively.
     - The example of real numbers: After introducing the constructive notion of real numbers (e.g., as Cauchy sequences with a modulus of convergence), show that equality is not decidable (we cannot decide in general if two reals are equal). This follows naturally from the IVT example because the IVT counterexample relies on the non-computability of the zero. However, we can also motivate the BHK interpretation by the need for computational content: a proof of existence must provide a witness.
     - Distinguish between **Bishop-style constructivism** (which is neutral and avoids extra axioms) and **Brouwer's intuitionism** (which adds principles like continuity and bar induction) only if questions arise. Otherwise, note that we are focusing on Bishop-style for the common subset. If a philosophy student brings up "meaning is use", note that this is related (Wittgenstein) and that in constructive logic the meaning of a statement is tied to what counts as a verification (which aligns with BHK). This is not a derailment but an opportunity to connect.

  2. **The Central Example**: Use the **Intermediate Value Theorem (IVT)**. Why?
     - It is more central to analysis and more likely to be known than the root-two example.
     - The root-two example (showing that either √2 or (√2)^√2 is rational) uses the law of excluded middle in a way that does not provide an actual witness. But the example is short and elegant, so you can mention it as a secondary example to show that sometimes we can get around non-constructiveness by proving a disjunction without knowing which side holds (but note that in this case we don't get to know which one is rational). However, the IVT example is better because:
          * It shows a common theorem that fails constructively and how we can weaken it to a constructively provable version.
          * It connects to the issue of non-computability in a direct way (via a computable counterexample).
          * It avoids the feeling of "deletion" by showing a positive constructive version.

     Why not the root-two example? It is a bit isolated and does not lead naturally to the discussion of real numbers and approximations. Also, it might be perceived as a trick.

  3. **Misconceptions and How to Address Them**:
     - **"Intuitionists assert that excluded middle is false"**: Address early when introducing LEM. State that we do not deny LEM (because ¬¬(A∨¬A) is constructively provable) but we simply do not assume it. We are working in a system that is neutral about LEM for arbitrary statements.
     - **"Constructive mathematics is just classical mathematics without LEM and choice"**: This is a common oversimplification. We must emphasize that constructive mathematics is not just a restriction but a re-interpretation of the logical connectives (via BHK). Also, some theorems are reformulated to be computationally meaningful (like the approximate IVT). Moreover, constructive mathematics can be extended with principles that are classically false (like continuity principles) but we are focusing on the common core (Bishop).
     - **"You can always mechanically convert a classical proof into a constructive one"**: This is not true in general. However, for certain classes of statements (e.g., Π₂ statements in arithmetic) there are techniques (like the double-negation translation) that allow us to interpret classical proofs. But the resulting constructive proof might be more complex and less informative. Also, the double-negation translation does not preserve the meaning of the statement (it embeds it in a different way). We should note that some theorems simply do not hold constructively (like the exact IVT) and must be replaced.
     - **"If it's neither proved nor refuted then it has no truth value, or it's a third truth value"**: Constructive logic is not a three-valued logic. The truth of a statement is identified with its provability (BHK). So a statement is true when we have a proof and false when we have a refutation (which is a proof of its negation). Without either, it is simply not known to be true or false. There is no third truth value.

     Additional misconceptions:
     - **"Constructive mathematics is less powerful"**: Actually, constructive mathematics can be seen as more informative because proofs come with computational content. Also, it can be interpreted in classical mathematics (via realizability, etc.) but not vice versa without loss of information.
     - **"Excluded middle is the only non-constructive principle"**: There are others, like the axiom of choice (which in its full form is non-constructive) and impredicative definitions. But LEM is the most prominent.

  4. **Disjunction and Existence Properties**:
     - These are the payoff. Present them after the BHK interpretation and the failure of LEM.
     - The disjunction property: If a theory proves A∨B, then it proves A or it proves B. Similarly for existence: if it proves ∃x A(x), then it proves A(t) for some term t.
     - Use this to show that if the theory were to prove every instance of A∨¬A, then for every sentence A, the theory would prove A or prove ¬A. But no consistent formal system that is sufficiently strong (e.g., can encode its own syntax) can be that complete (by Gödel's incompleteness). Therefore, it cannot prove the universal statement ∀A (A∨¬A) and, more importantly, it cannot prove every instance of A∨¬A (because that would require it to be complete, which it isn't). 
     - Guardrail: Note that for specific A (e.g., decidable formulas) we can prove A∨¬A. The issue is for arbitrary A.

  5. **What to Refuse to Explain in Detail**:
     - **Choice sequences, bar induction, fan theorem, continuity principle**: Mention that Brouwer's intuitionism uses these non-classical principles, but we are focusing on Bishop-style constructivism which avoids them. If asked, say: "Brouwer introduced choice sequences, which are potentially infinite sequences generated by free choice, and used bar induction to prove results about them. The continuity principle states that every function from reals to reals is continuous. These are not part of the common constructive core."
     - **Realizability, Kripke/Beth semantics**: Mention that these are ways to model constructive logic (realizability relates proofs to computations, and Kripke/Beth are modal-like semantics) but they are beyond the scope of this lecture.
     - **Double-negation translation**: We can say: "There is a translation that embeds classical logic into intuitionistic logic by prefixing double negations. This shows that intuitionistic logic is not weaker in terms of consistency, but the translated theorems have a different meaning."

     Be prepared for a question on the continuity principle: have two sentences ready: "Brouwer's continuity principle states that every total function from reals to reals is continuous. This is classically false but is consistent with intuitionistic logic and reflects the idea that a function must be determined by finite information about its input."

  6. **Final Check**:
     - Instead of a written exercise (which might be too time-consuming and pattern-matchy), present a very short classical proof and ask them to spot the non-constructive step and see if it can be repaired. 
     - Example: 
          Theorem: There exist irrational numbers a and b such that a^b is rational.
          Proof: Consider √2. If √2^√2 is rational, then take a = b = √2. Otherwise, take a = √2^√2 and b = √2. Then a^b = (√2^√2)^√2 = √2^(2) = 2, which is rational.
          Non-constructive step: The use of LEM on "√2^√2 is rational". 
          Can it be repaired? Not in the same form because we don't know which case holds. However, we can prove the existence without knowing which pair (but we do have a specific pair: either (√2, √2) or (√2^√2, √2)). But note: we don't know which one is irrational? Actually, both are irrational in both cases. The issue is that we don't have a witness for the pair. We have two candidates but we don't know which one works. However, the constructive mathematician would note that we have a disjunction without knowing which side. But by the disjunction property, we would need to know which one. However, we don't. So the proof does not give a constructive witness.

     Alternatively, use a very short IVT-like argument (e.g., for a specific function that crosses zero, but using bisection and LEM to decide the sign at midpoints). The non-constructive step is the repeated use of LEM on the sign of f at the midpoint. It cannot be repaired for the exact zero, but it can be repaired for the approximate version.

     The point of the last slide is to have them engage critically. The example should be short and the non-constructive step should be clear once they are primed.

  **Lecture Outline**:

  Time: 80 minutes.

  - (5 min) **Introduction**: What is constructive reasoning? It's about requiring proofs to provide evidence. Not just about dropping LEM. Historical context: Brouwer, Heyting, Kolmogorov, Bishop.

  - (15 min) **BHK Interpretation**: 
     - Define what counts as a proof for each connective: 
          * A proof of A∧B is a proof of A and a proof of B.
          * A proof of A∨B is either a proof of A or a proof of B.
          * A proof of A→B is a method to convert a proof of A into a proof of B.
          * A proof of ∃x A(x) is a specific object t and a proof of A(t).
          * A proof of ∀x A(x) is a method to convert any object x into a proof of A(x).
          * Negation: ¬A is defined as A→⊥, and ⊥ has no proof.
     - Emphasize that this is the meaning of the connectives.

  - (10 min) **Excluded Middle and its Status**:
     - State LEM: A∨¬A.
     - Show that ¬¬(A∨¬A) is provable (in intuitionistic logic). Hence, we are not denying LEM, but we are not assuming it either.
     - Why might we not want to assume it? Because it can be used to prove existence without providing an example.

  - (20 min) **The Intermediate Value Theorem as Example**:
     - State the classical IVT: If f is continuous on [a,b] and f(a)<0<f(b), then there exists x in [a,b] such that f(x)=0.
     - Sketch the classical bisection method: repeatedly bisect and choose the interval where the sign change occurs. The non-constructive step: we must decide at each midpoint if f(mid)=0 or not, and if not, whether it is positive or negative? Actually, the classical proof might use LEM to assert that either f(mid) is zero, positive, or negative? But more fundamentally, the process of narrowing down to a real number requires infinitely many steps and we must commit to a sequence of intervals without knowing if we ever hit zero exactly? Actually, the classical proof does not require hitting zero, but the non-constructiveness is that the limit might not be computable? 
     - However, the standard issue is that we cannot decide at each step whether f(mid)=0 exactly. Moreover, we might not be able to decide the sign (if f(mid) is exactly zero, we are done, but if not, we need to know the sign). But in the constructive setting, we cannot decide the sign because the real numbers are not decidable. 
     - Constructive version: For every ε>0, there exists x such that |f(x)|<ε. This is provable constructively because we can run the bisection until we find a point where |f(x)|<ε (by continuity). 
     - Mention the computable counterexample: there is a computable continuous function f (with f(0)<0 and f(1)>0) such that no computable real x satisfies f(x)=0. (Reference: Specker sequence or similar.) 

  - (10 min) **Real Numbers and Equality**:
     - Constructive reals are represented by Cauchy sequences with a modulus of convergence. 
     - Equality is not decidable: we cannot in general decide if two reals are equal. Why? Because if we could, we would be able to solve the halting problem (by encoding a halting problem into a real number).

  - (10 min) **Disjunction and Existence Properties**:
     - State the properties for a constructive theory: 
          * If ⊢ A∨B, then ⊢ A or ⊢ B.
          * If ⊢ ∃x A(x), then ⊢ A(t) for some term t.
     - Explain why this is important: it means that if we prove a disjunction, we know which side, and if we prove existence, we have a witness.
     - Why can't we have LEM? Because if we had LEM for every A, then for every A we would have either a proof of A or a proof of ¬A. But then the theory would be complete. However, by Gödel's incompleteness theorem, no sufficiently strong consistent theory is complete. Therefore, we cannot have LEM for every A.

  - (5 min) **Bishop vs Brouwer**:
     - Bishop-style: minimal, neutral, common subset of classical and constructive. 
     - Brouwer's intuitionism: adds principles that are classically false, like continuity and bar induction. We are focusing on Bishop.

  - (5 min) **Q&A and Final Check**:
     - Present the root-two example and ask: what is the non-constructive step? (LEM on whether √2^√2 is rational). Can we repair it? (We have two candidates but we don't know which one works. The constructive mathematician would say we have proved the disjunction: either (√2,√2) is the pair or (√2^√2, √2) is the pair. But we don't know which. However, note that in this case we do have a constructive proof of the disjunction without knowing which side? Actually, we don't: the proof uses LEM and does not provide a witness for the disjunction. So it is non-constructive. But we can prove the existence without LEM? It is known that there is a constructive proof that explicitly gives a pair (e.g., e and ln(2)) but that is a different pair. So the root-two proof is non-constructive and does not give a constructive witness. However, the theorem itself is constructively true by other means.)

     Alternatively, use a simple IVT-like proof for a specific function (e.g., f(x)=x^2-2) and point out the non-constructive step. Then ask: what is the constructive version we can prove? (the approximate one).

  **Timing is tight, so be prepared to adjust.**
answer: |-
  Below is a structured plan for your 80-minute lecture on constructive reasoning, designed to challenge misconceptions, motivate the BHK interpretation, and showcase the substance of constructive mathematics. The sequence prioritizes conceptual dependencies and addresses your specific concerns. I'll follow your numbered sections.

  ---

  ### **1. Order of Concepts (with Timing)**
  **Total: 80 min**  
  - **0–10 min: Motivate Constructive Reasoning**  
    Start with **why**: Computation, epistemology, and paradox avoidance. Mention:  
    - Hilbert’s program (proofs as objects) vs. Brouwer (mathematics as mental construction).  
    - Russell’s paradox: Impredicativity feels "dangerous" classically; constructivism avoids it by demanding witnesses.  
    - **Head off "meaning is use" immediately**: "For philosophers, this resonates with verificationism or Wittgenstein—truth is tied to proof, not Platonic reality. We’ll see how this plays out logically."  

  - **10–25 min: BHK Interpretation**  
    **Core vehicle**: Define proofs for each connective (no formal logic yet):  
    - ∧: A pair of proofs.  
    - ∨: A choice of side + proof of that side.  
    →: A transformation of proofs.  
    - ∃: A witness + proof for it.  
    - ∀: A uniform construction of proofs.  
    - ¬A: Proof that A → ⊥ (contradiction).  
    **Key analogy**: "Proving a theorem is like writing a program that computes evidence."  
    **Why early?** To preempt "Why not split on P?" when LEM appears.  

  - **25–40 min: Real Numbers & Equality**  
    **Use reals here** to concretize BHK and motivate LEM’s failure:  
    - Constructive reals: Equivalence classes of Cauchy sequences *with explicit moduli* (no set theory).  
    - **Punchline**: Equality is **undecidable**. Sketch:  
      - Assume `eq? : ℝ → ℝ → Bool` decides equality.  
      - Encode the halting problem: For TM `M`, define real `r_M = ∑_{n=0}^∞ a_n / 2^n`, where `a_n = 1` if `M` halts in `≤n` steps, else `0`.  
      - `r_M = 0` iff `M` never halts → solves halting problem. Contradiction.  
    **Why before LEM?** Shows BHK’s stakes: A proof of `r = s` must *construct* convergence (not just "true or false").  

  - **40–55 min: Law of Excluded Middle (LEM) and its Status**  
    - Define LEM: `∀P. P ∨ ¬P`.  
    - **Kill misconception 1**: "Intuitionists assert LEM is false."  
      - Show `¬¬(P ∨ ¬P)` is constructively provable (easy proof).  
      - "Denying LEM is inconsistent! Constructivists *don’t assume it*—they suspend judgment where evidence is missing."  
    - **Contrast with computability**: LEM claims every proposition is **decidable**. But real equality isn’t → LEM is a *non-computable axiom*.  

  - **55–70 min: Intermediate Value Theorem (IVT) as Central Example**  
    **Why IVT over root-two?**  
    - **Root-two is shallow**: Shows LEM hides witnesses, but repair (e.g., `e^{ln(2)}`) feels like a hack.  
    - **IVT is deep**:  
      - Classical statement: If `f(a) < 0 < f(b)` (continuous), then `∃x∈[a,b]. f(x)=0`.  
      - **Bisection "trap"**: Bisection *looks* constructive until you see: At each step, you need `f(mid) = 0` or `f(mid) > 0` or `f(mid) < 0`—undecidable for arbitrary `f`!  
      - **Constructive repair**: Approximate IVT: `∀ε>0. ∃x. |f(x)| < ε` (provable via interval halving; continuity gives modulus).  
      - **Payoff**: Exact IVT implies LEM (proof: encode any `P` as `f(0) = -1`, `f(1) = 1`, `f(0.5) = 0` if `P`, else linear interpolation → `f(x)=0` decides `P`¹).  
      - **Philosophical punch**: "Constructive math isn’t ‘deleting’ theorems—it’s refining them to be computationally meaningful."  

  - **70–78 min: Disjunction/Existence Properties and Payoff**  
    - **State properties**: If `⊢ A ∨ B` then `⊢ A` or `⊢ B`; if `⊢ ∃x. A(x)` then `⊢ A(t)` for some `t`.  
    - **Why now?** After IVT, students see how LEM obscures computational content.  
    - **Kill misconception 2**: "Constructive math = classical – LEM – choice."  
      - "No! BHK redefines truth. Disjunction property means proofs *must* decide."  
    - **Gödelian punch** (for CS students):  
      - If your theory proves `∀P. P ∨ ¬P`, then it decides *every* sentence.  
      - But Gödel: Any consistent formal system for arithmetic has undecidable sentences.  
      - ∴ No such theory can prove `∀P. P ∨ ¬P` (universally).  
    - **Guardrail**: "For *specific* `P` (e.g., decidable ones), `P ∨ ¬P` is fine! The failure is universal quantification."  

  - **78–80 min: Bishop vs. Brouwer (Briefly!)**  
    - **Bishop**: "Neutral constructive core—no extra axioms. Focuses on what classical/intuitionistic math share."  
    - **Brouwer**: Adds axioms like **continuity** (all functions are continuous) or **bar induction** (classically false).  
    - "Today is Bishop-style. Brouwer’s ideas are deep but require sessions of their own—ask me later!"  

  ---

  ### **2. The Central Example: IVT**  
  **Why IVT?**  
  - **Short & familiar**: Every student knows it; bisection feels algorithmic.  
  - **Non-repairability**: Exact IVT is *provably unconstructivable* (via LEM reduction), not just "not yet found."  
  - **Positive refinement**: Approximate IVT is constructively provable and useful (e.g., numerical analysis).  
  - **Computable counterexample**: Use a function like `f(x) = x² - 2` (if `x` rational) or adjust based on a non-computable real².  

  **Why not root-two?**  
  - It’s resolvable with other witnesses, making constructivism seem like "classical math with extra steps."  
  - IVT’s repair (approximate version) is a *genuinely new theorem* with computational content.  

  ---

  ### **3. Misconceptions and When to Kill Them**  
  | Misconception | When to Address | Response |
  |---------------|----------------|----------|
  | "Intuitionists assert ¬LEM." | During LEM intro (40–55 min) | "`¬¬(P ∨ ¬P)` is provable. Denying LEM is inconsistent; we just don’t *assume* it." |
  | "Constructive math = classical – LEM – choice." | During disjunction property (70–78 min) | "BHK redefines truth. It’s not subtraction—it’s rebuilding logic around evidence (e.g., approximate IVT)." |
  | "You can always convert classical → constructive proofs." | During IVT repair (55–70 min) | "False for Π₂ statements (like IVT). Double-negation translation exists, but it changes meaning and isn’t mechanical for existence." |
  | "Neither proved nor refuted = third truth value." | During BHK (10–25 min) | "No truth-value gaps! `P` is ‘true’ when proved, ‘false’ when refuted. Without proof, we’re agnostic—it’s epistemic, not ternary." |
  | **New: "So LEM is unprovable, but why not add it as an axiom?"** | During Gödelian punch (70–78 min) | "You can, but it ‘poisons’ the system: Disjunction property fails, proofs lose computational content." |

  ---

  ### **4. Disjunction/Existence Properties**  
  **Placement**: After IVT (70–78 min), as the "grand finale" for CS students.  
  **Phrasing to avoid smart-question traps**:  
  - "For any **closed** formula `A ∨ B`, if the theory proves it, it proves `A` or proves `B`."  
  - "If your theory proves `∀P. P ∨ ¬P`, it decides **every** sentence. Gödel says: No consistent recursively axiomatized extension of arithmetic can do this. So, while `A ∨ ¬A` holds for **some** `A` (e.g., `2+2=4`), it **fails as a universal law**."  

  ---

  ### **5. What to Refuse to Explain (With 2-Sentence Responses)**  
  - **Continuity principle**: "Brouwer claimed all real functions are continuous. Classically false, but in intuitionism, it reflects that functions depend on approximations. We’re skipping details."  
  - **Bar induction/fan theorem**: "Brouwer used these to prove uniform continuity. They’re intuitionistic axioms, not part of Bishop’s core. Ask me after class!"  
  - **Realizability/Kripke semantics**: "These model constructive truth (realizability = proofs as programs; Kripke = truth across possible worlds). Deep waters—see me for papers."  
  - **Choice sequences**: "Brouwer’s ‘lawless’ sequences where values unfold over time. Not computable, so not in Bishop’s framework."  
  **Likely question**: Continuity principle (philosophy students). Have your 2 sentences ready.  

  ---

  ### **6. Final Slide: Check for Understanding**  
  **Activity**: Present **two classical proofs** side-by-side. Ask: "Which step is non-constructive? Can it be repaired?"  
  - **Proof A (Repairable)**:  
    > "There exist irrationals \(a, b\) such that \(a^b\) is rational.  
    > *Proof*: Take \(a = \sqrt{2}\), \(b = 2\log_2 3\). Then \(a^b = (\sqrt{2})^{2\log_2 3} = 3\), rational."  
    **Suspicious step**: None. Constructively valid! (Witnesses given.)  

  - **Proof B (Unrepairable)**:  
    > "There exist irrationals \(c, d\) such that \(c^d\) is rational.  
    > *Proof*: Consider \(\sqrt{2}^{\sqrt{2}}\). If rational, take \(c = d = \sqrt{2}\). Else, take \(c = \sqrt{2}^{\sqrt{2}}\), \(d = \sqrt{2}\). Then \(c^d = 2\), rational."  
    **Suspicious step**: Use of LEM on "\(\sqrt{2}^{\sqrt{2}}\) is rational."  
    **Can it be repaired?** Not without new witnesses (this specific proof requires deciding a non-computable³ disjunction).  

  **Why this works**:  
  - Short, visually similar, but one has hidden LEM.  
  - Tests if they grasp BHK: Proof B doesn’t provide a witness.  
  - "Repairable?" is nuanced: The *theorem* is constructively true (via Proof A!), but Proof B is flawed.  

  ---

  **Footnotes**  
  ¹ Formal reduction: Let `P` be any proposition. Define `f` on `[0,1]` with `f(0)=-1`, `f(1)=1`, `f(0.5)=0` if `P`, else linear. Then `f(x)=0` implies `x=0.5` and `P`.  
  ² Example: Let `α` be a non-computable real. Define `f(x) = \min(x - α, 0)` for `x ≤ α + 1`, extended linearly. `f` is computable if `α` is, but no computable zero exists.  
  ³ Though `\sqrt{2}^{\sqrt{2}}` is irrational (proved classically), the disjunction "rational or irrational" isn’t constructively justified without evidence.  

  This plan confronts misconceptions early, uses IVT to showcase substance (not just limitations), and ends with CS-relevant incompleteness. Good luck!
