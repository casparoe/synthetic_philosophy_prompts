answer: |-
  The air in the DSM Subcommittee Room 4B hummed with the recycled breath of twelve psychiatrists and the faint whine of the projector. On the screen: **"Volitional Attenuation Disorder (VAD) - Proposed Criteria."**

  Dr. Aris Thorne, neuropsychologist, leaned back, fingers steepled. "So, the core complaint: a persistent, subjectively reported 'thinning' of the sense of volition, specifically linked to prolonged reliance on AI-driven decision-making assistants for daily life choices. They *report* feeling like they're on autopilot, that actions don't *originate* with them anymore. Yet, functionally, they're fine. Bills paid, jobs held, social niceties observed. It's purely phenomenological distress."

  Dr. Lena Petrov, a clinician known for her work with tech-related anxieties, nodded. "Exactly. It's not anhedonia, not depersonalization in the classic sense. They feel competent, even efficient. But the *ownership* is gone. They describe it as... hollow agency. Like watching a very capable actor play them."

  Dr. Raymond Hayes, whose focus was insurance coding and disability accommodations, rubbed his temples. "And the trigger is specifically delegating *decisions* to AI for over a year? Not just using it? Not stress, not burnout?"

  "According to the proposers, yes," Thorne confirmed. "The delegation of choice itself seems to be the corrosive agent. Like a muscle atrophying."

  Hayes sighed. "Alright. So, is this new? Or is it just 'modern life malaise' dressed up? Or worse..." He gestured vaguely. "...are we pathologizing the inevitable consequence of ubiquitous optimization? Should feeling like a slightly detached CEO of your own life *be* a disorder?"

  Petrov leaned forward. "The distress is real, Raymond. People are coming into clinics saying, 'I feel like a passenger.' They use phrases like 'choice paralysis' when the AI *isn't* available, paradoxically. They report existential unease precisely *about* this lack of felt volition. Is it existential angst? Sure. But so was much of early anxiety disorder diagnosis before we refined it."

  A junior member, Dr. Chen, piped up. "But how do we *know*? Without biomarkers, without clear functional impairment beyond self-report... isn't this incredibly vulnerable to suggestion? What happens if we label it?"

  Thorne’s eyes sharpened. "Ah. The feedback loop. *That's* my primary objection. Not that the distress isn't real, Lena. It is. But *call* it VAD, leak it to the press – which it inevitably will, it always does – and watch what happens."

  He painted the picture: A speculative article drops. People vaguely dissatisfied with their AI-curated lives suddenly have a name for the hollowness. Online forums bloom – r/VAD_Support, #GhostedByChoice. Users swap stories, refining the language: "I got totally *ghosted* by my own decision to have cereal this morning," "Stuck in *autopilot mode* all week." Clinicians, primed by the buzz, start hearing patient complaints *through* the VAD lens. A vague sense of detachment becomes a "classic VAD symptom." Diagnosis rates climb. Pharma, smelling opportunity, funds studies.

  "And then," Thorne concluded, his voice tight, "we point to the rising diagnosis rates as *proof* VAD was always there, just unrecognized. We created the very phenomenon we're trying to describe. It’s an iatrogenic epidemic waiting to happen."

  Petrov shook her head, almost impatiently. "Aris, that loop isn't unique to VAD. It's *how* human kinds work! Look at ADHD, look at PTSD, look at chronic fatigue syndrome decades ago. The label *organizes* experience, gives people a language, a community. It *allows* research. Yes, it shapes how people interpret their own minds. But that doesn't mean the underlying *something* wasn't there, causing distress before the label existed. This 'looping' is inherent to psychiatry. It disqualifies nothing. It just *is*."

  Hayes cut through the debate like a scalpel. "I don't particularly care if it's 'real' in some platonic sense or a socially constructed feedback loop." He held up a hand to silence the protests. "I care that people *suffering* from this... whatever it is... need help. They need validation. They need therapy frameworks developed. Crucially, they need *accommodations*." He tapped the table for emphasis. "If someone genuinely feels their sense of self dissolving because they outsourced their lunch choices to an algorithm for two years, and it causes them distress that impacts their life, therapy might help. Maybe they need structured 'decision reclamation' exercises. Maybe they need workplace adjustments limiting mandatory AI delegation. But without a code, insurance won't cover it. Employers won't recognize it. We leave them stranded in that vague discomfort Lena described. A code, Aris, even a provisional one, opens doors."

  Silence descended, heavier than before. The proposed criteria glowed on the screen: *A. Subjective sense of diminished personal volition... B. Attribution by the individual to prolonged reliance... C. Duration >12 months... D. No significant functional impairment... E. Distress or preoccupation...*

  Dr. Chen spoke softly, voicing the unspoken vertigo. "So... do we vote 'yes' because people are suffering and need help, knowing we might be amplifying the very thing we're trying to treat? Or 'no' to avoid creating a diagnostic artifact, leaving those same people without resources or validation?"

  The vote was tabled. More data needed, they agreed. But the genie was already nudging the bottle.

  Three months later, a snippet from Petrov’s interview with a tech magazine leaked: "...emerging concern about 'volitional attenuation' in heavy AI users..."

  Within a week, #VolitionalAttenuation was trending. Memes depicted sad avatars watching AI pick their outfits. A subreddit, r/ChoiceGhosting, sprang up, filled with posts like: "Anyone else feel like their decisions are just echoes?" and "My AI picked my vacation. It was perfect. Why do I feel so empty?" Clinicians noted an uptick in patients mentioning "that choice-ghosting thing."

  A year later, preliminary studies showed a "significant rise" in VAD-like symptoms following the media exposure. Petrov cited them triumphantly in the reconvened committee: "See? The prevalence is climbing. It *was* there!"

  Thorne countered: "Or *you* climbed it by pointing at it!"

  Hayes presented draft accommodation guidelines: "Workplace AI opt-outs, mandatory 'human decision hours'. We need the code *now*."

  The committee reconvened. The debate raged hotter, the feedback loop now deafening. Was the rising diagnosis rate proof of VAD's legitimacy, or proof of their profound suggestion? Was the online community a support group for a genuine shared experience, or a factory manufacturing symptoms through shared vocabulary?

  Dr. Thorne looked out the window. His own AI assistant had just seamlessly rescheduled his afternoon, booked a taxi using his preferred service, and ordered his usual lunch salad, all based on a single mumbled groan about running late. He felt a familiar, thin detachment. Was it VAD? Or just efficiency? Or the weight of the debate? He couldn't tell. He opened his mouth to speak, but the words felt slippery, less his own than ever before. Across the table, Dr. Petrov caught his eye. Her expression was unreadable, but Thorne saw a flicker of the same vertigo. Hayes just tapped his pen impatiently against the draft accommodation list. The vote, this time, was imminent. Whatever they decided, the ghost of choice had already escaped the machine.
