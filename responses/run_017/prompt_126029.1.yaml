prompt: |-
  I would be grateful for your comments on the essay notes below. They sketch the argument of a paper I am planning on the non-identity problem; I want to know whether its central move can be made to work before I write it up at length. Please do not spend your reply summarising the standard positions in the literature — I know them, and restating them is not useful to me. What I want is pressure on the argument itself.

  ---

  **Slots, Not Persons: Filling-Relative Assessment for Identity-Affecting Choice** *(notes)*

  **§1. Where I take the debate to be stuck.** In the familiar family of cases — a girl conceives at fourteen rather than waiting; a government depletes rather than conserves; prospective parents select for a child who will be deaf when they could have selected otherwise — the agent's act is a condition of the existence of the individual it affects. Whoever ends up existing has a life worth living and would not have existed had the agent acted otherwise. So the act cannot be wrong in virtue of making someone worse off, and yet it seems wrong.

  There are two familiar packages. Keep the person-affecting restriction and accept that such acts are not wrong, unless the life produced is not worth living at all. Or abandon the restriction for an impersonal axiology that ranks outcomes by total or average welfare, and accept that the wrongness of such acts is of a piece with the wrongness of failing to add further happy people to the world. I want to claim that these packages share an assumption, which I will call *identity-determined assessment*: the moral significance of an outcome is a function of which individuals it contains, so that outcomes differing only in who exists are morally incomparable unless one reaches for an impersonal value. The first package holds the assumption and pays in counter-intuitive verdicts; the second abandons it and pays in implications elsewhere.

  **§2. The proposal.** Deny the assumption while keeping the relational structure of wrongness. Distinguish the *occupants* of an act's effects from the *slots* those occupants fill. Slots are the positions that the agent's practical question was about: my first child, the patient who receives this kidney, a resident of this city in 2120, the child of the violinist I hire. Feasible options in identity-affecting cases differ not merely in who fills those slots but in how well they are filled. Proposal: an act is pro tanto wrong when, relative to the practical question the agent actually faced, it fills some slot worse than a feasible alternative fills the corresponding slot, and fills no slot better. Call this *filling-relative assessment*.

  **§3. The complaint.** On this view the child of the girl who conceived at fourteen has a genuine complaint, but not the counterfactual one — not that she would have been better off had her mother waited. The complaint concerns occupancy: the slot you filled, your first child, you filled below the level that was open to you, and you did it knowingly. Wrongness becomes a relation between an agent, a slot her choice filled, and the alternatives she had. It does not require that the complainant would have existed under any alternative, only that she occupies a slot the agent was in a position to fill well. So the view keeps no wrong without a possible complainant while dropping no complainant without counterfactual improvement. That combination is the whole point of the paper.

  **§4. Two claimed payoffs.** First, the view generates no verdicts in different-number cases. Where the options differ in how many slots there are, there is no counterpart matching to perform and filling-relative assessment is undefined. The procreation asymmetry and the repugnant conclusion are therefore outside its scope. I intend to present this as a virtue rather than a gap, on the grounds that these are separate problems needing separate resources, but I am aware it may look like an evasion. Second, the view appears to describe what large-scale institutional reasoning already does: cost-benefit analysis, risk regulation and demographic forecasting compare outcomes slot-wise, by reference to positions and statistical lives rather than to identified individuals, and feel no embarrassment about it.

  **§5. The soft spot: matching.** Filling-relative assessment needs a counterpart relation between slots in distinct outcomes, and identity cannot supply one. My suggestion is that the relation is supplied by the practical question: the slots are those the agent's deliberation was already about, and the matching is fixed by what she was choosing between. I expect this to be where the view fails if it fails. If the practical question can be redrawn freely — individuate the slots by ordering their occupants by welfare, and match in that order — filling-relative assessment becomes a maximising impersonal view in disguise. I gesture at a constraint, that slots must be individuated independently of the welfare levels of their occupants on pain of begging the question, but I do not think I have shown that the constraint bites.

  **§6. The soft spot: propagation.** Consider an orchestra. A conductor can appoint a competent first-chair violinist now, or hold further auditions and appoint a stronger player in five years. Either appointment determines where a person lives, whom she meets, and hence which children come to exist; so the decision fixes the filling of slots indefinitely far downstream, and filling-relative assessment is now comparing whole genealogical futures. If slots propagate without limit, every hiring decision becomes an occasion for optimising the welfare of the descendants of every candidate, and the view collapses back into impersonalism. If they do not propagate, I owe a principled cut-off, and I do not have one. My current line is that the slots that matter are those the agent could have foreseen being affected; but foresight is scalar, which would make the verdicts of the view come in degrees where I had hoped for something binary.

  ---

  **What I would like from you.**

  1. Is the diagnosis in §1 fair, or does filling-relative assessment already sit on the standard menu under a different description? If it is a redescription of a position you recognise, say in your own terms what the redescription is supposed to buy and whether it buys it.
  2. Attack §5. What, if anything, constrains the counterpart relation? Try to construct a case in which the practical question is genuinely indeterminate between two matchings and the verdict flips depending on which one is chosen.
  3. Is the propagation problem in §6 fatal, or is there a non-ad-hoc cut-off? Does the orchestra case show the view is wrong, or only that it must become a view about foresight — and would that be a cost or an unexpected gain?
  4. Is the silence claimed in §4 defensible? A view that falls silent exactly where the number of possible people varies may turn out to have no advantage over the views it was meant to replace.
  5. If you were refereeing this, which section would you say is weakest, and what is the single objection you would put first?

  Tell me where I am wrong rather than where I am unclear, and feel free to say if you think the whole framing of §2 is confused.
reasoning: |-
  Okay, the user is working on a philosophy paper about the non-identity problem and wants critical feedback on their core argument. They've shared detailed notes outlining a "slots not persons" approach. 

  First, I need to understand what they're proposing. They're distinguishing between the actual people affected by a choice ("occupants") and the abstract positions those people fill ("slots"). The moral evaluation focuses on how well the agent filled those predefined slots, not on comparing specific individuals across possible worlds. This is meant to preserve the person-affecting intuition while avoiding the pitfalls of standard approaches.

  The user clearly knows the literature well - they're dismissive of summaries and want pure pressure-testing. Their tone is academic but urgent; they're at that stage where they need someone to poke holes before investing more time. The notes are sophisticated but they've flagged two "soft spots" themselves (matching and propagation), which shows intellectual honesty.

  Let me start with their first ask: is this truly novel? I recall some structural similarities in the literature - Parfit's "same-number quality claim", Kamm's "non-troublemaking" alternatives, and Holtug's "identity-relativism" all dance around similar ideas. But crucially, none make the slot-filling mechanism central in this way. The user's innovation is in grounding the counterpart relation in the agent's practical question. That feels distinct enough to warrant development, though it'll need careful distancing from those precursors.

  Now the matching problem (§5). This is the most vulnerable point. The user admits that if the slot individuation isn't constrained, the view collapses into impersonalism. Their proposed constraint - slots must be defined independently of welfare levels - feels necessary but inadequate. I should construct a case where the practical question genuinely underdetermines the matching. 

  Imagine a doctor choosing between two embryos for implantation. The practical question is "which embryo to implant?" But is the slot "this family's first child" or "the embryo in petri dish A"? If the former, we compare how well each embryo would fill that family role; if the latter, we'd have to consider counterfactual scenarios where dish A gets different occupants (which makes no sense). The verdict could flip based on how we frame the slot. That seems damaging.

  For propagation (§6), the orchestra case is indeed nasty. The user's foresight-based response risks making wrongness scalar when they want binary verdicts. But maybe that's not fatal - binary moral verdicts are overrated anyway. The deeper issue is that even proximate effects can have identity-affecting consequences. If the conductor hires violinist A, that person might go to a different coffee shop than violinist B would have, altering conception events downstream. Any human choice has butterfly effects. Their view might only work for institutional decisions with clear temporal boundaries (like climate policy for 2100 residents), not for individual procreative choices.

  About the silence on different-number cases (§4): this is defensible if framed as theoretical division of labor. We don't expect quantum mechanics to explain gravity. But they'll need to show why non-identity cases are structurally different from different-number cases in a way that justifies separate treatment. The "separate problems" claim feels plausible but underdefended in the notes.

  If I were refereeing, I'd attack §5 first. The matching problem threatens to either collapse the view or make it viciously circular. That's more urgent than propagation because if matching fails, the whole edifice crumbles. I'd insist they demonstrate that their constraint can handle cases where the practical question has multiple coherent slot-individuations.

  The user seems prepared for tough feedback - they specifically asked not to be spared. I'll be direct but constructive. Their core insight feels valuable; it's the operationalization that needs work. The slots framework could be promising if they can solve the counterpart problem without borrowing from the impersonalist toolkit.
answer: |-
  Here’s a focused critique targeting your argument’s core vulnerabilities, structured around your queries. I’ll prioritize rigor over diplomacy.

  ### 1. **Originality (§1–§2): Likely Novel, but Precursors Lurk**  
  Your diagnosis is fair: identity-determined assessment *is* a shared but rarely named assumption. Filling-relative assessment (FRA) isn’t a direct redescription of standard views. However:  
  - **Near-misses**: Parfit’s "Same Number Quality Claim" hints at slot-like comparisons but remains impersonal. Kamm’s "non-troublemaking" alternatives use role-focused reasoning but retain identity-dependent wrongness. Holtug’s "identity-relativism" compares welfare across identities but denies complaints exist.  
  - **What FRA buys**: It promises **relational wrongness without transworld identity**. If successful, this resolves the non-identity paradox while avoiding impersonal aggregation. But novelty depends on whether §5’s matching holds.  

  ### 2. **§5’s Matching Problem: Indeterminacy Undermines Verdicts**  
  Your constraint (slots individuated independently of welfare) is necessary but insufficient. The fatal flaw: **the "practical question" is often ambiguous or multi-describable**, allowing multiple slot-matchings.  

  **Attack case**: *The Twin Embryos*.  
  - A woman must choose which of two fertilized embryos (A or B) to implant. Embryo A would have a good life (10 utils); B a better life (15 utils). She chooses A.  
  - **Slot-individuation 1 (broad)**: "My first child." Slot counterpart: the same role in all outcomes. Verdict: wrong (10 < 15).  
  - **Slot-individuation 2 (narrow)**: "The occupant of embryo A." But if she chooses B, embryo A never exists. No slot for A in the B-outcome → no counterpart to compare → no complaint. Verdict: not wrong.  
  - **Indeterminacy**: Both individuations answer the practical question ("which embryo to choose?"). No non-arbitrary way to favor one. Verdict flips based on framing. **Result**: FRA is either contradictory or relies on unmotivated slot metaphysics.  

  **Why your constraint fails**: Even if slots are welfare-independent, *which slots exist* is underdetermined by the practical question. You need a principled way to fix slot ontology pre-choice.  

  ### 3. **§6 Propagation: Fatal Without Sacrificing Binary Verdicts**  
  The orchestra case exposes a deeper issue: **all choices have downstream identity-affecting effects**. If slots propagate indefinitely:  
  - Hiring a violinist alters the genetic/meeting pool → changes which future children exist → FRA requires comparing infinite chains of descendant-slots.  
  - This *is* impersonalism in disguise (e.g., "total welfare of the violinist-descendant-slot-chain").  

  **Your foresight cut-off is problematic**:  
  - If wrongness requires foreseeing affected slots, then:  
    - **(a)** A 14-year-old’s choice isn’t wrong (she can’t foresee her child’s slot).  
    - **(b)** Wrongness becomes scalar ("how foreseeable was the slot?"), not binary.  
  - **Cost**: Abandons the core promise (§3) of non-scalar complaints. If you embrace scalar wrongness, FRA becomes a variant of probabilistic person-affecting views (e.g., Roberts). This isn’t a gain—it’s capitulation.  
  - **No non-ad-hoc fix**: Temporal/spatial proximity thresholds are arbitrary. "Directly intended slots" exclude policy cases (§4).  

  ### 4. **§4’s Silence: Defensible but Limits Scope**  
  - **Strength**: FRA *should* fall silent in different-number cases. These *are* distinct problems (creating people vs. affecting existing slots).  
  - **Weakness**: Many paradigmatic non-identity cases (e.g., depletion policy) *also* affect population size. If FRA ignores these, it fails to handle "impure" cases. **Result**: FRA applies only to same-number, identity-affecting choices—a narrow slice of the problem. Is this worth a new theory?  

  ### 5. **Weakest Section & Primary Referee Objection**  
  - **Weakest**: **§5 (Matching)**. Without a solution to slot indeterminacy, FRA’s key innovation collapses.  
  - **Killer objection**: **"Your slot-counterparts are conventional, not objective. Since convention can flip verdicts (per Twin Embryos), FRA cannot ground non-arbitrary moral judgments."**  

  ### Conclusion: Where You Might Be Wrong  
  - **§2’s framing isn’t confused**—it’s ambitious and coherent. But **§5 and §6 reveal operational failures**.  
  - **Core tension**: You want slots to be both (a) *objective enough* to avoid conventionalism, and (b) *flexible enough* to cover varied cases. No proposed constraint reconciles these.  
  - **Path forward?** Ground slots in *institutional roles* (e.g., "citizen of 2120") not individual choices. This sacrifices §3’s individual complaints but saves §4’s institutional fit. Alternatively, abandon binary wrongness for scalar "slot-filling adequacy."  

  **Recommendation**: Target §5 first. If matching can’t be fixed, the project stalls. If it can, propagation might be managed by limiting slots to *institutionally defined positions* (e.g., "this policy’s beneficiaries").
