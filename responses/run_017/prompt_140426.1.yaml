answer: |-
  ### Procedural Framework for Concept Selection

  #### 1. Extracting Knobs (Pre-Jam)  
  **Method**: Host a 90-minute "knob-mapping" session before the jam. Start by listing obvious theme features (e.g., for "puzzle games": grid, moves, win/lose conditions). Then:  
  - **Generate terrible variations**: Ask "What would make this theme unbearably bad?" (e.g., "match-three where tiles never disappear"). This exposes hidden knobs by breaking assumptions.  
  - **Cross-context shifts**: Transplant the theme into unrelated settings (e.g., "tile-sliding in a zombie apocalypse") to reveal contextual knobs.  
  **Unnamed knob detection**: If a variation feels "off" but the team struggles to articulate why, capture that friction as a knob candidate (e.g., "player agency decay" in failure-less games).  
  **Watch for**: Over-narrow definitions. Revisit the list post-jam to integrate new knobs discovered during ideation.  

  #### 2. Sorting Knobs by Depth  
  **Definitions**:  
  - **Surface**: Independent adjustments (e.g., art style). Test: Change it → no cascading changes needed.  
  - **Structural**: Alters core relationships (e.g., grid size). Test: Change it → forces ≥1 other knob to shift (e.g., larger grid requires longer move animations).  
  - **Frame**: Defines the theme’s identity (e.g., win/lose conditions). Test: Remove it → the game ceases to fit the theme (e.g., puzzles without goals become sandboxes).  
  **Test protocol**: For each knob, simulate two extreme states (min/max). Observe:  
  - Cascading effects? → Structural.  
  - Loss of thematic essence? → Frame.  
  - **Ambiguity handle**: If unclear after 5 minutes, flag as "structural-frame" and proceed. Revisit during variation tests.  

  #### 3. Space-Search Moves  
  - **Push knob to extreme**: Maximizes novelty per dimension. Tends to produce polarizing, high-risk ideas (e.g., "Noughts" removing failure entirely). Best for breaking creative ruts.  
  - **Move coupled cluster**: Shifts linked structural knobs (e.g., permadeath + resource scarcity). Tends to produce systemic depth. Use when knobs share causal relationships.  
  - **Delete knob**: Forces minimalism (e.g., removing scoring). Tends to reveal essential mechanics. Use to challenge bloated concepts.  
  - **Borrow knob**: Imports from adjacent genres (e.g., roguelike progression in word puzzles). Tends to produce hybrids. Use when the theme feels stale.  

  #### 4. Variation Tests (Ordered)  
  1. **Frame test**: Detects lost-the-thread failures. *Pass*: Core frame knobs intact. *Fail*: Theme unrecognizable (e.g., word puzzle becoming action RPG). **Stop here if fail**—this wastes resources and is worse for small studios.  
  2. **Structural integrity test**: Detects unplayable concepts. *Pass*: Knob movements don’t break mechanics. *Fail*: Contradictions (e.g., "endless" mode with level-based unlocks).  
  3. **Novelty test**: Detects samey-but-new failures. *Pass*: Knob shifts alter player experience. *Fail*: Surface-only changes (e.g., "Folio’s" aesthetic swap).  
  4. **Value test**: Human judgment for taste/audience fit. Escalate if trade-offs exceed your mandate.  

  #### 5. Stopping Points and Handoffs  
  - **Automatic "no"**: Frame test fail (irreversible lost-the-thread) or structural integrity fail (unfixable break).  
  - **Escalate to person**: Value test conflicts (e.g., "Noughts" trading core engagement for accessibility). You (Creative Director) decide unless it impacts business strategy → studio head.  

  ---

  ### Case Analyses  

  **Theme context**: Last quarter’s theme was "reimagined casual classics" (e.g., match-three, tile-sliders, word puzzles).  
  **Knobs identified pre-jam**:  
  - Frame: Win/lose conditions, progression structure (e.g., levels vs. endless).  
  - Structural: Move complexity, feedback loops (e.g., cascading matches), time pressure.  
  - Surface: Theming, grid size, visual polish.  

  #### 1. "Noughts" (Match-three without failure)  
  - **Knobs moved**:  
    - Frame: "Failure state" deleted (extreme push).  
    - Structural: "Feedback loop" altered (messiness replaces loss).  
  - **Tests**:  
    - Frame test: Pass. Core match-three mechanic remains intact.  
    - Structural integrity: Pass. Messiness creates new feedback.  
    - Novelty test: Pass. Experience shifts from punitive to expressive.  
    - Value test: **Judgment call** (yours). Studio head’s concern (loss of tension) vs. team’s enthusiasm (fresh appeal).  
  - **Verdict**: **PROTOTYPE** (procedure passes until value test).  
  - **Judgment call**: True. You must weigh: Is "tension-free" aligned with studio identity?  

  #### 2. "Folio" (Reskinned tile-slider)  
  - **Knobs moved**:  
    - Surface: "Theming" (bestiary), "grid size" (per-level variation).  
  - **Tests**:  
    - Frame test: Pass. Core tile-sliding unchanged.  
    - Structural integrity: Pass. Grid size variability is manageable.  
    - Novelty test: **FAIL**. Surface changes only; experience identical to past titles.  
  - **Verdict**: **REJECT** (automatic "no" at novelty test).  
  - **Judgment call**: False. Procedure flags samey-but-new risk.  

  #### 3. "Errand" (Word puzzle + roguelike structure)  
  - **Knobs moved**:  
    - Frame: "Progression structure" borrowed (roguelike runs).  
    - Structural: "Feedback loop" altered (permadeath breaks daily reset).  
  - **Tests**:  
    - Frame test: **FAIL**. Daily puzzle cadence (core to theme) replaced by run-based progression → lost-the-thread.  
  - **Verdict**: **REJECT** (automatic "no" at frame test).  
  - **Judgment call**: False. Procedure identifies genre drift.  

  **Unwanted outcome**: "Errand" rejected despite team interest.  

  ---

  ### Where the Procedure Misfires  
  1. **Pre-jam knob limitations**: Yes, naming knobs can constrain ideation. **Mitigation**: Document "unknown knob" placeholders during the jam and re-run mapping post-jam.  
  2. **Fun/timing blindness**: The procedure **cannot** evaluate fun, humor, or market timing. These require human judgment during the value test. **Refuse to touch**: Legibility ≠ quality. Prioritize value test escalation for these.  

  ---

