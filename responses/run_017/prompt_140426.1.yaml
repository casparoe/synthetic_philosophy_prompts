  We are creating a procedure to systematize the selection of game concepts based on Hofstadter's idea of creativity as variations within a style-space.

  The procedure has five parts as requested:

  1. **Getting the knobs out**:
     - Before the jam, hold a session to define the theme's knobs. Start by listing obvious features, then push to name the axes by generating variations.
     - How to name knobs: Instead of features (e.g., "has a grid"), think in terms of dimensions that can vary (e.g., "grid size", "grid connectivity").
     - To find unnamed knobs: Deliberately generate terrible variations (e.g., "what if we made the grid size 1x1? What if we removed the grid entirely?") and see what breaks or changes. Also, try to imagine the theme in a wildly different context (e.g., "match-three in space with zero gravity").
     - Record every knob that comes up, even if it seems silly.

  2. **Sorting knobs by depth**:
     - Your definitions are a good start. We'll refine:
       - **Surface knob**: Can be changed independently without affecting other knobs. (Test: Change it and see if the core gameplay remains. If yes, it's surface.)
       - **Structural knob**: Changing it forces changes in other knobs. (Test: Try to change it and note if you have to adjust other knobs to keep the game playable. If yes, it's structural.)
       - **Frame knob**: This knob defines the theme. Removing it makes the game no longer part of the theme. (Test: Remove it and see if the game becomes a different genre. If yes, it's frame.)
     - The test: For each knob, run a mental simulation of changing it to an extreme and observe the effects. If the test is inconclusive (e.g., it might be structural or frame), note it as "ambiguous" and revisit when we see interactions.

  3. **Moves for searching the space**:
     - **Push one knob to an extreme**: For creating novelty. Tends to produce radical but focused variations. Use when you want to explore the boundaries of one aspect.
     - **Move a coupled cluster at once**: For when knobs are linked (structural). Tends to produce coherent but complex variations. Use when you suspect a set of knobs are interdependent.
     - **Delete a knob entirely**: For challenging assumptions. Tends to produce minimalist or abstract variations. Use when you want to see what is essential.
     - **Borrow a knob from an adjacent genre**: For cross-pollination. Tends to produce hybrid variations. Use when you want to refresh the theme with outside ideas.

  4. **Tests for judging a variation** (in order):
     1. **Frame test**: Has the frame changed? (If the frame knobs are altered beyond recognition, it's a different theme -> lost-the-thread. This is worse for a studio your size because you have a defined style and audience. Mark as failure and stop.) 
     2. **Structural integrity test**: Do the moved knobs break the game? (If the variation requires too many adjustments to work, it might be too complex for a prototype. If it breaks, it's a failure. If it holds, proceed.)
     3. **Novelty test**: Is the variation samey-but-new? (Check if the experience is identical despite knob movement. If yes, it's a failure. This is less severe than lost-the-thread because it's a wasted opportunity, not a detour. It can be fixed by pushing further or combining moves.)
     4. **Value test**: Does it align with studio values? (This is where we hand off to a person. More below.)

     Why lost-the-thread is worse: For a small studio, a month-long prototype that turns out to be off-theme is a significant waste. Samey-but-new is a less severe failure because it can be caught earlier in prototyping.

  5. **Stopping points and handoffs**:
     - The procedure stops with a "no" at:
       - Frame test failure (lost-the-thread).
       - Structural integrity test failure (if the break is unfixable with reasonable effort).
     - It hands off to a person at the Value test: 
       - The question is about trade-offs (e.g., audience, resources, studio identity). 
       - The person should be the creative director (you) because you are running the process and have the vision. If the decision involves business (e.g., audience size, monetization), then escalate to the studio head.

