       - Structural integrity: Without failure, what drives the player? The game must now rely on other motivators (e.g., creating patterns, high score). The prototype must show if the game holds together. We don't know from the sheet. But the sheet says "you can't lose", so we assume the structure holds.
       - Novelty: It's not samey. It's a known idea (removing failure) but in match-three it's not common. It's a clear variation.
       - Value test: The studio head thinks removing losing removes the game. This is a value conflict. The procedure hands off to a person (you) for the value test. You must decide: does this align with the studio's vision? The team loves it, but the boss doesn't. As creative director, you might side with the team and argue for innovation, or with the boss for core game values. Since the studio head signs off, you might need to escalate.

     Verdict by procedure: Passes frame, structure, novelty. But value test requires handoff. Since the studio head has already expressed disapproval, it might be a no. However, the procedure says handoff to you first. You might decide to prototype and let the playtest decide.

     But note: the procedure says the frame test passed. So we proceed to value test. Then it's your call.

  ### 2. "Folio":
     - Same tile-sliding puzzle, new art (hand-drawn bestiary) and variable grid size.
     - Knobs moved:
