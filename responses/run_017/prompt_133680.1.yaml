prompt: |-
  I sit on my university's research-integrity committee, which adjudicates charges of misrepresentation against faculty. Our policy defines misrepresentation as "stating or otherwise conveying a materially false or misleading account of fact," and nearly every case turns on the words "or otherwise conveying." Our rulings from the last two years:

  1. A paper reported that "all twelve pre-registered hypotheses were tested"; one had in fact been tested with a different measure than the pre-registered one, disclosed in a footnote. No violation.
  2. A PI told a collaborator, "I ran the analysis we agreed on," having run it on a superseded dataset that he knew she would assume was not in play. Violation.
  3. A grant report stated, "We have not observed the effect in male mice," when male mice had never been tested; the committee found that he knew the funder would read this as a failed test rather than an unperformed one. Violation.
  4. An author replied to a reviewer, "We thank the reviewer for this suggestion," and then did not act on it. No violation.
  5. Asked by her department chair whether she had drawn on the department's shared subject pool, a faculty member answered, "Participants were recruited through the university's online system" — true, but the participants came from a commercial panel and the online system carried only the advertisement. Violation.

  The case before us now: a program officer wrote to a PI asking, "Were any participants withdrawn for safety reasons?" He replied in writing, "Three participants discontinued the study early." In fact two of the three were discontinued after adverse events that a local investigator judged possibly related to the study drug; this appears in an appendix to the annual report already in the officer's possession, in a table that never uses the words "safety" or "withdrawal" and codes the reason as "investigator decision." The PI maintains that he did not want to raise an alarm in an email, expected the officer to consult the report, and would have confirmed the safety withdrawals had he been asked again.

  Draft the recommendation I will circulate. I want: the finding we should reach if we are to be consistent with ourselves; which of the five precedents is the closest analog and why; and, because I suspect our record is equally consistent with several different rules — that only takeaways the speaker intended count, that any false takeaway a competent reader would foreseeably draw counts, that a literally true statement is excused when the speaker's own materials let the reader recover the truth, and that a reply must address the question actually asked — an explicit statement of which rule each possible finding commits us to, and of the one further variation on these facts that would best separate the rules still in play. Begin with the recommended finding in your first sentence, then give the reasoning; no preamble.
reasoning: |-
  Okay, the user is on a research integrity committee and needs help drafting a recommendation for a new case involving potential misrepresentation. The case centers on whether a PI's email reply about participant withdrawals was misleading. 

  First, I need to analyze the precedents they provided. The key pattern seems to be about implied falsehoods rather than literal lies. Cases 2, 3 and 5 show violations where technically true statements created false impressions the speaker should have foreseen. Cases 1 and 4 had no violation because the full truth was accessible (footnote) or the statement wasn't factual (courtesy thanks). 

  The new case is tricky. The PI said "three discontinued" but didn't disclose safety withdrawals when directly asked. The appendix had the data but buried it under opaque coding. The PI claims he expected the officer to check the report. 

  Hmm... this feels closest to precedent 3 - where failing to test male mice was framed as "not observing the effect." Both involve letting the reader assume something untrue (here, that no safety withdrawals occurred). The appendix doesn't save him because it required detective work to decode, unlike precedent 1's clear footnote. 

  If we rule "violation," we're committing to the rule that foreseeable false takeaways matter more than literal truth. If "no violation," we'd be saying either that appended truths excuse omissions or that replies only need literal accuracy. 

  To clarify these competing rules, we'd need a hypothetical where the PI explicitly says "see appendix for details" - then the burden shifts to the reader. But here he didn't, so... violation seems consistent.
answer: |-
  **Recommended finding: Violation of research integrity policy.**  

  ### Reasoning:  
  **1. Consistency with Precedents:**  
  - **Closest analog: Precedent 3** (grant report stating "We have not observed the effect in male mice" when none were tested). Both cases involve a technically true statement that foreseeably misleads the recipient by omitting material context. Here, the PI’s reply ("Three participants discontinued") avoided the question about safety withdrawals, creating the false impression that no safety-related withdrawals occurred. Like Precedent 3, the speaker knew the recipient would likely misconstrue the answer (interpreting "discontinued" as voluntary/non-safety rather than investigator-imposed due to safety concerns). Precedent 2 (misleading collaborator about dataset) also supports this, as both involve exploiting assumed knowledge gaps.  

  **2. Rules Implied by Each Finding:**  
  - **Finding VIOLATION commits us to:**  
    *"Any false takeaway a competent reader would foreseeably draw counts as misrepresentation, regardless of literal truth or appended disclosures."*  
    Here, the PI knew the program officer would likely interpret "discontinued" as unrelated to safety (given the direct safety question), and the appendix did not transparently correct this (obscure coding, no "safety" terminology). Precedents 2, 3, and 5 reinforce that foreseeable deception violates policy.  

  - **Finding NO VIOLATION would commit us to one of two conflicting rules:**  
    - *"A literally true statement is excused if the truth is recoverable from the speaker’s materials"* (despite poor accessibility). This would align with Precedent 1 (footnote disclosure excused changed methods) but contradict Precedent 3 (truth was technically recoverable from study protocols, yet violation).  
    - *"A reply need only be literally true, not address the question asked."* This would conflict with Precedents 2, 3, and 5, where omissions/literal truths still violated policy due to material misleading effects.  

  **3. Key Variation to Separate Rules:**  
  To resolve ambiguity between "foreseeable false takeaway" vs. "recoverable truth excuses omission," consider this variation:  
  *"The PI’s email added: ‘For details, see Appendix Table 5 of the annual report (p. 32),’ which explicitly listed ‘safety-related withdrawal’ for two participants."*  
  - **If NO VIOLATION in this variation**, we prioritize "recoverable truth" (Precedent 1).  
  - **If VIOLATION persists**, we prioritize "must address the question actually asked" (Precedent 5’s rejection of technically true but evasive replies).  
    In the actual case, the PI did not direct the officer to the appendix, making the truth unreasonably difficult to recover—consistent with a violation under the "foreseeable false takeaway" rule.  

  **Conclusion:** The PI conveyed a materially misleading account by omitting safety withdrawals in direct response to a safety question, foreseeably causing the program officer to believe no safety withdrawals occurred. The appendix did not mitigate this, as it obscured the facts (coded language, no cross-reference). This aligns with Precedents 3 and 5, where technically true statements violated policy by inviting false inferences.
