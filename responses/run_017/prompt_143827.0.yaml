  **Office of the Registrar of Perceived Objects**  
  **Central Registry of Being**  
  *File Reference: CRB/Pub/G9/Leaflet/08*  
  **MAINTENANCE OF BEING FOR CHATTELS AND LANDHOLDINGS: A CITIZEN’S GUIDE**  

  **1. Scope and Purpose**  
  1.1. This leaflet details procedures for recording a chattel (movable object) or landholding as "in being" (perceived) under the Consolidated Perceptual Assurance Act.  
  1.2. Unrecorded objects risk lapse into non-being. Registration ensures continuous ontological security and legal recognition.  
  1.3. Failure to comply may incur administrative penalties (Schedule 2, Fees & Penalties Order).  

  **2. Recording Initial Being**  
  2.1. Submit Form BE-1a (Chattels) or BE-1b (Land) to any Registry Office.  
  2.2. Forms must include:  
  - 2.2.1. Full perceptual description (colour, dimensions, texture, etc.). Incomplete descriptions delay processing.  
  - 2.2.2. Time, date, and location of most recent citizen perception.  
  - 2.2.3. Witnessed declaration: *"I attest that the above-described object was perceived by me, and its being is hereby affirmed."*  
  2.3. A Registration Fee applies (see 5.1).  
  2.4. Upon validation, a Certificate of Perceptual Continuity (CPC) will be issued. Retain this.  

  **3. Correcting Recorded Being (Errors & Disputes)**  
  3.1. **Reporting Lapse**: If an object ceases mid-perception (e.g., vanishes during observation):  
  - 3.1.1. Immediately file Form BE-3a (Report of Spontaneous Non-Being) at a Registry Office.  
  - 3.1.2. **WARNING**: Section 4 of BE-3a requires describing the object *as it was when last perceived*. Attempting to describe it *in its current unperceived state* invalidates the form. *Conceiving an object for description constitutes perceptual affirmation, rendering non-being unreportable.* Incomplete/invalid forms incur Penalty Fee δ.  
  3.2. **Title Disputes**: Where multiple parties claim perceptual rights to a *seemingly* single object:  
  - 3.2.1. File Form TD-2 (Petition for Resemblance Adjudication) with the Perceptual Tribunal.  
  - 3.2.2. The Tribunal will assess the "Sufficiency of Resemblance" between claimants' perceptual records.  
  - 3.2.3. Registration Costs are scaled to the Degree of Dissimilarity (DoD) determined by the Tribunal. Higher DoD = Higher Costs (Schedule 3). Maintain accurate records to minimise costs.  

  **4. Sustained Being Assurance**  
  4.1. Divine Perceptual Maintenance ensures object continuity during perceptual gaps (e.g., night, unattended periods).  
  4.2. **Important**: Divine Maintenance operates universally *without* human intervention. Citizen perception and Registry validation remain legally essential for contractual, insurance, and proprietary purposes.  
  4.3. Scheduled Registry Audits (Perceptual Re-Affirmation Sweeps) are mandatory and cannot be waived. Audit non-compliance risks CPC revocation (Form BE-4, Revocation Notice).  

  **5. Fees and Penalties**  
  5.1. Registration Fee (BE-1a/b): ₣25.  
  5.2. BE-3a Processing Fee: ₣10 (+ Penalty Fee δ: ₣50 for invalid submission).  
  5.3. TD-2 Base Fee: ₣100 + Variable Cost (₣20 x DoD Rating).  
  5.4. CPC Re-Issuance (Post-Revocation): ₣75.  
  5.5. Fees payable upon submission. Cash only. No refunds.  

  **6. Contact**  
  Central Registry of Being, 10 Veridical Avenue, Capital City. Open M-F, 9am-5pm (Scheduled Audits permitting). Tel: 600 300 3000. *Do not attend without an appointment voucher (Form AP-7).*  

  ---  
  **Note for Author (98 words):**  

  *   **Settled:** The Divine Perceiver as Berkeley's solution to unperceived objects is canonical. Bureaucratic insistence on human processes despite this is your core awkwardness/joke. "Sufficiency of Resemblance" logically follows from Berkeley's rejection of abstract general ideas & Lockean substratum; scaling costs to dissimilarity is a plausible bureaucratic twist.  
  *   **Contested/Liberties:** The "conceivability=perception" trap (BE-3a) exaggerates a contested reading. Some scholars argue Berkeley merely claims we cannot *frame a positive idea* of unperceived existence, not that the *attempt* is paradoxical. I turned this into a bureaucratic catch-22 for comedy. The absolute unreportability of non-being is an extrapolation, not strict doctrine. Persistence of the Audit office despite divine maintenance is comedic exaggeration of institutional inertia.*
