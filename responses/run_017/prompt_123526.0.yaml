prompt: |-
  Hey — I TA a third-year epistemology seminar (16 students, one 75-minute slot, and they've already got the basics: evidential probability, peer disagreement, the first-order/higher-order distinction) and I need a runnable in-class game for next Thursday on higher-order evidence and epistemic akrasia. Me and two of the other TAs got into it over drinks and I came away thinking the usual cases cheat: they hand you someone who has just been told their reasoning is impaired right now, and then act surprised that the person is stuck. What I actually want students to feel is that the bind is a leftover — it's what remains when three escape routes are shut, and the classic setups shut all three silently, so the akratic conclusion looks inevitable when it's really an artifact of the framing. The routes I have in mind: fold — treat the higher-order evidence as just more evidence about the world and calibrate your first-order credence toward the base rate; bracket — keep the first-order belief but quarantine it, don't act on it; re-open — spend resources going to get better evidence instead of trying to repair the bad evidence you already have. My half-formed thesis is that re-opening is the one nobody talks about, and that whether akrasia is real for a given case is basically a question of how expensive re-opening is; the cases that feel inescapable are exactly the ones where re-opening is impossible or priced out of reach. So: design the game so each route has an explicit price in points, and so participants hit at least one round where folding costs them accuracy, one where bracketing costs them action, and one where re-opening is either cheap (and the bind dissolves) or too expensive (and the bind is genuine). Not sure how you do all that with one mechanism — maybe a per-round "reinvestigation fee" the facilitator sets and only reveals at the moment it matters?

  Materials should be cheap (index cards, dice, envelopes, maybe a fourth-year I can draft as a confederate to hand things out), and the task itself should be something like quantity estimation or comparing city populations, where a silent impairment can actually be induced — half the room gets an anchor nudge or an extra working-memory load without knowing the others didn't. Score with a strictly proper scoring rule on both the first-order answer and the meta-answer about whether to trust it, and keep the two currencies separate with no exchange rate, so that on some rounds doing best overall means giving an answer you simultaneously say you shouldn't trust. Several of them are annoyingly competitive about points, so the scheme shouldn't just reward stubbornness. Give me: the setup, the rules as numbered steps, the payoff scheme as a small table, a minute-by-minute timeline for 75 minutes, and a debrief that maps specific moments in the game onto (a) the three routes, (b) why calibration and akrasia come apart, and (c) the question whether the akratic subject is being irrational or is just unlucky. Add a note on what will predictably go wrong the first time I run it — I'm guessing most people will just fold everything, or they'll figure out they're supposed to feel torn and perform being torn — and how I handle it, and be honest about which part of the philosophical problem the game cannot stage and I'll have to say out loud myself. No lecture up front and don't name any of this until the debrief. One page max, hard cap 800 words; I'd rather have something tight and actually runnable than something complete.
reasoning: |-
  We are designing an in-class game for 16 students on higher-order evidence and epistemic akrasia. The goal is to have students experience the three escape routes (fold, bracket, re-open) and see that the akratic bind arises when all three are blocked or too costly.

  Game Title: **Evidence Expedition**

  **Setup:**
  - Students play in 4 groups of 4. Each group is a "research team".
  - Each round, groups are given an estimation task (e.g., "How many jellybeans in the jar?" or "Population of Ottawa?"). 
  - Materials: 
    - Index cards for answers and meta-answers.
    - Envelopes for "reinvestigation" actions (if chosen).
    - A confederate (fourth-year student) to administer "impairments" and handle reinvestigation.
    - A timer.
    - A hidden die (for some rounds) to add noise.

  **Mechanism for Impairment:**
  - For half the groups (randomly assigned each round), the confederate gives an anchor (e.g., "I heard it's around X") or adds a working-memory load (e.g., "Memorize this number: 739" and they must recall it at the end). The other half gets no such nudge. Groups are not told about the impairment condition of others.

  **Three Escape Routes with Costs:**
  1. **Fold (Calibrate)**: Adjust first-order credence using base rate of impairment (which is 50%). Cost: Accuracy points (if impairment didn't actually affect them, they might adjust away from the truth).
  2. **Bracket**: Keep the first-order belief but mark it as untrustworthy. Cost: Action points (if they bracket, they cannot use the answer for a bonus action task).
  3. **Re-open**: Pay a "reinvestigation fee" (in points) to get a new, untainted estimate. Cost: Points paid now. The fee is set per round by the facilitator and revealed only when a group considers re-opening.

  **Scoring:**
  - Two separate scoring currencies: **Accuracy Points** (for first-order estimates) and **Action Points** (for being able to act on the estimate in bonus tasks).
  - **Accuracy Points**: Use a quadratic scoring rule for the first-order estimate. For an estimate `x` and true value `v`, the score is: `S = 100 - (x - v)^2 / (range/10)` (scaled appropriately). Also, meta-answer (trust/distrust) is scored by a proper scoring rule for confidence: if they say "trust", they get `100 * (1 - (x-v)^2 / max_possible_error)` if correct, else `0`; if "distrust", they get a fixed 50 (to represent the value of withholding).
  - **Action Points**: Only if they do not bracket, they can attempt a bonus task (e.g., bet on their estimate) to earn extra Action Points (e.g., double or nothing). If they bracket, they get a safe 10 Action Points (but no bonus).

  **Rules (Numbered Steps):**

  1. **Round Start (5 min)**: 
     - Facilitator gives the estimation task. Confederate secretly gives half the groups an impairment (anchor or memory load). 
     - Groups have 5 minutes to discuss and write their first-order estimate (on an index card) and a meta-answer (trust or distrust) on a separate card.

  2. **Escape Route Options (3 min)**:
     - Groups now decide on an escape route (without knowing the reinvestigation fee yet):
       - **Fold**: They may adjust their estimate downward (if they suspect impairment) by a fixed percentage (e.g., 10%) to account for the base rate. They must note they are folding.
       - **Bracket**: They mark their meta-answer as "distrust" (if not already) and note they are bracketing.
       - **Re-open**: They indicate they want to re-open. The facilitator then reveals the reinvestigation fee (in Accuracy Points, e.g., 20 points). If they pay, they get a new, untainted estimate (from the confederate, who quickly gives a reasonable estimate without the impairment). They then update their first-order estimate and may update meta-answer.

  3. **Submission and Bonus Task (2 min)**:
     - Groups submit their final first-order estimate and meta-answer (trust/distrust).
     - If they did not bracket, they can choose to do a bonus task: bet their Action Points on their estimate (if within 10% of truth, double; else lose half). If they bracketed, they get 10 safe Action Points.

  4. **Scoring and Reveal (5 min)**:
     - True value is revealed. 
     - Facilitator calculates and announces Accuracy Points and Action Points for each group.

  **Rounds:** 
  - 4 rounds (12 min each) + setup and debrief (total 75 min).
  - Round 1: Re-opening cheap (low fee, e.g., 10 points). Impairment affects half. (Students may re-open and avoid the bind.)
  - Round 2: Re-opening very expensive (50 points). Folding costs accuracy (because impairment didn't occur for some, so they adjust away from truth).
  - Round 3: Bracketing costs action (the bonus task would have been easy to win, so they regret bracketing).
  - Round 4: Re-opening impossible (fee = infinity, or not allowed). The bind is genuine: they must either fold (and risk accuracy) or bracket (and lose action) or be akratic.

  **Debrief (15 min):**
  - Map moments to the three routes:
    - Round 1: Re-opening was cheap -> bind dissolves.
    - Round 2: Folding cost accuracy (for untainted groups) -> showed that calibration isn't free.
    - Round 3: Bracketing cost action -> they couldn't capitalize on a good estimate.
    - Round 4: All routes blocked -> akrasia: they might have an estimate they mark as untrustworthy but must use because they can't re-open or adjust without cost.
  - Why calibration and akrasia come apart: Calibration (folding) is treating HOE as first-order, but sometimes it's not. Akrasia (bracket without re-open) arises when we must hold conflicting attitudes because we can't fix the evidence.
  - Irrational or unlucky? In the game, when re-opening is too expensive, the bind is real and not irrational. The subject is unlucky in the cost structure. But rationality requires responding to the available options.

  **Predictable Problems:**
  - Most groups will fold (adjust) in the first round. Solution: In Round 2, set the impairment to be absent for some groups, so folding (adjusting) hurts them.
  - Groups may not bracket because they want the bonus. Solution: In Round 3, make the bonus very attractive and the impairment obvious (so they bracket) but then the true value is exactly what they had -> they regret bracketing.
  - They may figure out the manipulation. Solution: Vary the impairment (anchor vs memory load) and the true value randomly. Use a die to add noise to the true value (e.g., true value ± 5%).
  - Performing being torn: The scoring rules and competitive aspect should make them genuinely conflicted. In the debrief, ask about their internal debate.

  **What the Game Cannot Stage:**
  - The game cannot perfectly model the internal conflict of believing P while believing that one shouldn't believe P. We only model it behaviorally by having them mark "distrust" while still holding the estimate. The debrief must explicitly discuss the doxastic state.

  **Timeline (75 min):**
  - 0-5 min: Explain the game (without philosophy) and form groups.
  - 5-17 min: Round 1 (cheap re-open).
  - 17-29 min: Round 2 (expensive re-open, folding costly for some).
  - 29-41 min: Round 3 (bracketing costly).
  - 41-53 min: Round 4 (re-open impossible).
  - 53-68 min: Scoring and reveal for all rounds (do after each round? We do after each round: 5 min per reveal, total 20 min? But we have 4 rounds. Alternatively, do reveals at the end to save time. Let's adjust: do reveals after each round, 5 min each, so 20 min total for reveals. Then 15 min debrief. But the rounds are 12 min and we have 4 rounds -> 48 min, plus 20 min reveals and 15 debrief = 83 min. So we must cut one round. Do 3 rounds and adjust timeline.)

  Revised Timeline for 3 Rounds (to fit 75 min):
  - 0-5: Setup and rules.
  - 5-17: Round 1 (cheap re-open: fee=10).
  - 17-22: Reveal and score Round 1.
  - 22-34: Round 2 (expensive re-open: fee=50; and set impairment to be absent for half -> folding hurts).
  - 34-39: Reveal and score Round 2.
  - 39-51: Round 3 (bracketing costly: fee=50, but bonus task is easy to win if they don't bracket; and impairment is present for all? Or only half? We want bracketing to feel costly. So set impairment for all, but the true value is near their estimate so they would have won the bonus. But they bracketed and only get 10. Alternatively, set no impairment but they don't know, so some bracket and then regret. We'll say: impairment for none, but they are told nothing about this round's impairment rate. They might bracket because they are cautious, but then the bonus is easy. The fee is high so they don't re-open. And they bracket -> lose bonus chance.)
  - 51-56: Reveal and score Round 3.
  - 56-60: Break (if needed) or move to debrief.
  - 60-75: Debrief.

  **Payoff Scheme Table:**

  | Action               | Accuracy Points Cost             | Action Points Cost/Gain          |
  |----------------------|----------------------------------|----------------------------------|
  | Fold (adjust)        | Risk: if untainted, may lose accuracy | None (but if they bracket, they avoid betting risk) |
  | Bracket             | None                             | Forfeit bonus chance (get 10 safe instead of potential 20 or more) |
  | Re-open             | Pay fee (revealed at decision)   | None (unless they then don't bracket and bet) |
  | Bonus Task (if not bracket) | None | If win: double Action Points; if lose: halve |

  **Note on Impairment**: In each round, the facilitator flips a coin to determine which groups get impaired (half). The impairment might be an anchor (e.g., "I heard it's around [a number 30% off]") or a memory task. The true value is set by the facilitator in advance (with a small random variation if needed).

  This design should create situations where each escape route has a cost, and students experience the akratic bind when all routes are too expensive.
answer: |-
  ### **Evidence Expedition: Higher-Order Evidence Game**  
  **Setup (5 min)**  
  - **Groups**: 4 teams of 4. Each gets an estimation task (e.g., "Jellybeans in jar" or "Population of Brussels").  
  - **Materials**: Index cards (for estimates/decisions), envelopes (for "reinvestigation"), dice, confederate (to administer impairments).  
  - **Impairment**: Confederate secretly gives 2 teams an anchor (e.g., "I heard it’s 1.5M") or memory load ("Memorize 739"). Others get no nudge.  

  **Rules (Repeated per Round, 15 min/round × 3 rounds)**  
  1. **Estimate (5 min)**: Teams discuss and write:  
     - First-order estimate (e.g., "1.2M").  
     - Meta-answer: "Trust" or "Distrust" my estimate.  
  2. **Escape Route Choice (5 min)**: Teams pick one (costs revealed when chosen):  
     - **Fold**: Adjust estimate toward base rate (e.g., "Impairment rate 50%, so lower estimate by 10%"). *Cost: Risk accuracy points.*  
     - **Bracket**: Keep estimate but mark meta-answer as "Distrust". *Cost: Forfeit bonus task (lose action points).*  
     - **Re-open**: Pay reinvestigation fee (points, set per round) to get new, untainted estimate from confederate. *Cost: Fee (Accuracy Points)*.  
  3. **Bonus Task (3 min)**: If not bracketing, bet Action Points on estimate (win double if within 10% of truth; lose half otherwise). If bracketing, get 10 safe Action Points.  
  4. **Scoring (2 min)**: True value revealed. Points calculated:  

  | **Component**               | **Accuracy Points (AP)**                                  | **Action Points (ActP)**                                  |  
  |-----------------------------|-----------------------------------------------------------|----------------------------------------------------------|  
  | **First-order estimate**    | Quadratic scoring: `AP = 100 - (estimate - truth)^2 / 10` | —                                                        |  
  | **Meta-answer "Trust"**     | +50 if correct (estimate within 10% of truth), else 0     | —                                                        |  
  | **Meta-answer "Distrust"**  | +50 (fixed)                                               | —                                                        |  
  | **Bonus task**              | —                                                         | Win: Double ActP; Lose: Half ActP; Bracket: +10 safe ActP |  
  | **Re-open fee**             | Deducted (e.g., 10/50 points)                             | —                                                        |  

  **Rounds Design**  
  - **Round 1**: Re-open cheap (fee=10 AP). Impairment: Half teams. *Goal: Re-open dissolves bind.*  
  - **Round 2**: Re-open expensive (fee=50 AP). Impairment: None for 1–2 teams. *Goal: Fold costs accuracy (unimpaired teams adjust away from truth).*  
  - **Round 3**: Re-open impossible (fee=100 AP). Impairment: All teams. *Goal: Bracketing costs action (bonus easy to win; bracketers miss out).*  

  **Timeline (75 min Total)**  
  - 0–5 min: Form teams, explain tasks/rules (no theory).  
  - 5–20 min: **Round 1** (emphasize: reinvestigation available).  
  - 20–25 min: Score/reveal Round 1.  
  - 25–40 min: **Round 2** (confederate subtly hints impairment "might be unreliable").  
  - 40–45 min: Score/reveal Round 2.  
  - 45–60 min: **Round 3** (confederate implies "high stakes" to pressure bracketing).  
  - 60–65 min: Score/reveal Round 3.  
  - 65–75 min: **Debrief**.  

  **Debrief (10 min)**  
  - **(a) Three Routes**:  
    - Round 1: **Re-open** dissolved bind (low fee).  
    - Round 2: **Fold** cost accuracy (unimpaired teams lost AP by adjusting).  
    - Round 3: **Bracket** cost action (teams with accurate estimates missed bonus by distrusting).  
  - **(b) Calibration vs. Akrasia**: Calibration (folding) treats HOE as first-order evidence—but when impairment is absent, it backfires. Akrasia (saying "I distrust this" while holding the estimate) arises when you can’t re-open or fold safely.  
  - **(c) Irrational or Unlucky?** In Round 3, akrasia isn’t irrational—it’s the best of bad options when re-opening is too expensive. The unlucky teams had high costs imposed by the situation.  

  **Predictable Problems & Fixes**  
  - **Problem**: Teams default to folding. *Fix*: In Round 2, ensure unimpaired teams lose AP if they fold (set truth far from anchor).  
  - **Problem**: "Performing" akrasia. *Fix*: Use competitive scoring—AP and ActP are separate, so optimizing forces tradeoffs (e.g., distrusting a correct estimate loses ActP).  
  - **Problem**: Noise in estimates. *Fix*: Use pre-tested tasks (e.g., jar with 250 beans; city pop. known to confederate).  

  **What the Game Can’t Stage**:  
  The internal conflict of *believing P while believing you shouldn’t believe P* is behavioralized (via "Distrust" + held estimate). Explicitly state in debrief: "The game makes you *act* akratic, but the philosophical puzzle is about doxastic tension—holding two conflicting attitudes. That’s why re-opening is key: it avoids the tension entirely."  

  **Materials**: Index cards, envelopes, dice, prepped tasks (e.g., 3 jars/city questions), confederate briefed on impairments.  
  **Word Count**: 798
