prompt: |-
  I work on quantitative prioritization for a small funder that splits its giving between near-term global health and longer-horizon catastrophic- and extinction-risk work, and I have been asked to write an internal memo on how we should handle heavy-tailed payoffs, including cases where the expectation fails to converge. Before I commit anything to paper I would like someone to audit the position I have ended up with, because my colleagues keep telling me it is a grab bag and I genuinely cannot see which part is load-bearing. One request up front: we have essentially no journal access from here, so please argue the points out rather than pointing me at papers — I need the reasoning and the arithmetic, not references.

  Here is where I have landed. (1) In ordinary finite cases I am a straightforward expected-utility maximizer, and I do not want to give that up, because every alternative I have looked at — weighting probabilities nonlinearly, ignoring probabilities below some threshold, sorting options into lexical tiers — seems either to cost me statewise dominance or to destroy the fine-grained discrimination we need when two grants differ in expected value by a factor of three. (2) Value is unbounded, and for the parts that matter to my job it is roughly linear in lives saved: ten-to-the-thirty lives saved is about ten-to-the-thirty times as good as one, and there is no ceiling past which further lives stop adding value. This is the whole reason the long-term half of the portfolio is worth taking seriously. (3) But I am not a fanatic. Take a physically clean lottery — one ticket drawn from a well-mixed urn of ten-to-the-twelve, with no funny business about where the probability estimate came from — that saves ten-to-the-thirty lives with probability ten-to-the-minus-twelve and does nothing otherwise, and compare it with saving ten-to-the-four lives for sure. I do not believe the lottery is the better option and I do not want a theory that tells me it is; I want to be able to keep funding the second kind of thing. A colleague says I can have both by putting a ceiling on value, and my worry is that any ceiling low enough to help with (3) also makes (2) idle, but I cannot tell whether that is right or whether I am just attached to (2). (4) On the St. Petersburg game itself I think the entry fee is small, somewhere in the tens of dollars, and I notice that I expect that verdict to be nearly the same for me as for someone a thousand times richer. My explanation has two parts: diminishing marginal utility of money, and the fact that any real counterparty has a ceiling on what it can pay out, so the schedule is truncated somewhere. I know the concavity part alone does not settle it, since you can re-denominate the payoffs in utils and the paradox returns; I am relying on the truncation part to do the real work. A friend adds that explaining a wealth-insensitive fee by appeal to concavity is incoherent, since a concave utility function is precisely a wealth-sensitive object, and I would like to know whether that objection lands. (5) I also think that when an expectation genuinely fails to exist, it is legitimate to stop doing expected-utility arithmetic and be guided by what happens in the overwhelming majority of cases; this sounds like it contradicts (1), but it does not seem to me to, since expected-utility maximization has no verdict where there is no expectation. (6) One theory, not two: I do not want one rule for my own money and another for lives saved, since almost every decision I actually make is a trade-off between them, and I do not want verdicts to shift when the same outcomes are re-described in different units.

  (7) And here is the case I cannot get a stable verdict on, which I made up and call the Lifesburg game: the same fair-coin structure, but the payoff on the nth toss is two-to-the-n lives saved rather than two-to-the-n dollars. My judgment is that I should not liquidate everything I own to play it once — that strikes me as a plainly bad trade, and I am more confident of that verdict than of any argument I can construct for it. But when I try to derive it from my own framework I come apart: with linear value in lives the expectation is infinite, and if I truncate at the number of people who could ever exist — say ten-to-the-forty, the sort of figure that gets thrown around at work — the expectation is roughly 133 lives, which at any cost-per-life we would actually defend is still more money than I have.

  So: which of these commitments are really in tension with which, and which are only apparently in tension? Please rank the real ones by severity rather than listing them as equally bad, and for each say what specifically would have to be given up and what giving it up would cost me, given that I would rather revise one thing than three. In particular: can a single revision deal with both the Lifesburg verdict in (7) and the anti-fanaticism verdict in (3), or do they need different fixes, and is there any fix that handles both without gutting (2)? Tell me which items I have wrongly flagged — I suspect at least one of the (1)-versus-(5) worry and the wealth-insensitivity worry in (4) is a non-issue, and I would rather not revise more than I have to. And if the honest answer is that no coherent package delivers my (7) verdict, say so and tell me which of (1), (2) and (7) is the weakest link.
reasoning: |-
  Hmm, the user is a quantitative prioritization expert at a small funder balancing near-term global health and long-term catastrophic risks. They've developed a position on handling heavy-tailed payoffs but are getting pushback from colleagues who call it a "grab bag." They want me to audit their 7-point framework before committing it to a memo, specifically identifying which commitments are genuinely in tension, ranking those tensions by severity, and suggesting minimal revisions.

  Key elements of their position:
  1) Firm commitment to expected utility (EU) maximization in finite cases
  2) Unbounded linear value of lives saved (no diminishing returns)
  3) Anti-fanaticism: rejects tiny probability/huge payoff options over modest sure things
  4) St. Petersburg resolution via truncation + money utility concavity
  5) Accepts non-EU approaches when expectations diverge
  6) Demands one consistent theory across domains
  7) Lifesburg Game paradox: infinite EU clashes with intuition against liquidation

  Their core tension: Unbounded linear value (2) creates infinite expectations that force fanaticism (contradicting 3), yet they want to keep (2) for long-term work's justification. The Lifesburg Game (7) crystallizes this - linear value implies infinite EU, making liquidation rational, but they recoil at that conclusion.

  I need to evaluate:
  - Whether concavity of money utility (4) successfully resolves St. Petersburg while preserving wealth-insensitive fee intuition
  - If (1) and (5) are actually compatible (EU vs non-EU when expectations diverge)
  - Whether a single fix can resolve both (3) and (7) without gutting (2)

  Major tensions I see:
  **Severe Tension 1: (2) Unbounded linear value vs (3) Anti-fanaticism**  
  This is fundamental. With truly linear utility over lives, any non-zero probability of saving N lives generates unbounded expected value as N→∞. Their 10⁻¹² chance of 10³⁰ lives example mathematically dominates 10⁴ sure lives. To reject this while keeping linear utility requires abandoning EU maximization - but that violates (1).

  **Severe Tension 2: (2) vs (7) Lifesburg intuition**  
  Identical core problem as above. Linear utility makes Lifesburg EU infinite. Truncating at 10⁴⁰ lives (as they suggest) gets EU ≈133 lives - trivial next to liquidation costs. Yet they feel liquidation is irrational. This directly challenges (2).

  **Moderate Tension: (4) Wealth-insensitivity claim**  
  They argue St. Petersburg entry fee is similar for rich/poor due to money utility concavity + truncation. But their colleague correctly notes: concavity *is* wealth-sensitivity. If fee is wealth-insensitive, concavity can't be the primary driver - truncation must be. However, this is resolvable by clarifying that truncation dominates.

  **Minor/Apparent Tension: (1) vs (5)**  
  No real conflict here. EU maximization only applies when expectations exist. When they don't (e.g., St. Petersburg with linear utility), (5) is the natural fallback - no violation of (1).

  **The Cross-Domain Unity Demand (6)** is actually helpful here - it forces a consistent solution across money and lives, preventing domain-specific patches.

  Resolution strategy:  
  The only coherent path that preserves most commitments is to **sacrifice strict linearity in lives (2)** while retaining its spirit for practical long-term work. We can introduce minimal curvature: a utility function like U(L) = log(L) or L/(L+L₀) that approximates linearity at scales below 10²⁰ lives but tapers fanaticism. This:
  - Resolves (3): The lottery EU becomes finite and < sure thing
  - Resolves (7): Lifesburg EU becomes finite (~log₂(log₂(N_max)) utils)
  - Preserves near-linearity for all practical long-term work
  - Maintains EU maximization (1)
  - Keeps one theory (6)
  - Explains wealth-insensitive St. Petersburg fees via money concavity + lives curvature

  Crucially, this doesn't require different rules for money/lives - the same expected utility theory applies, just with a utility function that has slight concavity in lives saved at cosmic scales. Their anti-fanaticism intuition in (3) and (7) becomes mathematically expressible.

  If they absolutely refuse to bend on (2), only two options remain:  
  A) Accept fanaticism (bet everything on tiny probabilities of vast payoffs)  
  B) Abandon EU for lexical thresholds or similar - but that violates (1) and loses discrimination  
  Neither is palatable given their expressed values.

  Final ranking of tensions:  
  1. (2) vs (3)/(7) [Severe]  
  2. (4) wealth-insensitivity confusion [Moderate]  
  3. (1) vs (5) [Apparent]
answer: |-
  Your position is admirably rigorous but contains one severe tension that must be resolved. Below, I rank the tensions by severity, explain what must be given up and why, and propose minimal revisions that preserve as much of your framework as possible. Crucially, **a single revision resolves both your anti-fanaticism (3) and Lifesburg (7) concerns without gutting (2)**. I address each point systematically, referencing your numbering.

  ### **Severity-Ranked Tensions**
  1.  **Severe Tension: (2) Unbounded Linear Value vs. (3) Anti-Fanaticism & (7) Lifesburg Intuition**  
      - **Conflict**: (2) implies that value is linear and unbounded in lives saved (e.g., \( U(L) = kL \) for lives \( L \), constant \( k \)). This forces infinite expected utility (EU) in cases like your lottery (\(10^{-12}\) chance of \(10^{30}\) lives) and Lifesburg. But (3) and (7) reject acting on these infinite EUs (e.g., preferring \(10^4\) sure lives over the lottery, or not liquidating for Lifesburg). With linear \( U(L) \), the lottery has EU \( = (10^{-12} \times 10^{30}) + (1 - 10^{-12}) \times 0 = 10^{18} \), vastly exceeding \(10^4\)—so EU maximization demands taking it. Similarly, Lifesburg’s EU diverges. *Any ceiling or truncation low enough to make EU finite and "reasonable" (e.g., capping at \(10^{40}\) lives) guts (2)*, as it imposes a hard bound where larger payoffs add no value. Your \(10^{40}\) cap reduces Lifesburg EU to ~133 lives—trivial next to liquidation costs.  
      - **Cost of Keeping (2)**: Forces fanaticism: you must accept the lottery over \(10^4\) sure lives and liquidate for Lifesburg. This violates your core intuitions in (3) and (7).  
      - **What Must Be Given Up**: Strict linearity in (2). This is non-negotiable; unbounded linear utility *requires* fanaticism under EU maximization when infinite payoffs are possible.  

  2.  **Moderate Tension: (4) Wealth-Insensitive St. Petersburg Fee vs. Concavity of Money Utility**  
      - **Conflict**: You argue St. Petersburg’s entry fee is small and wealth-insensitive due to money-utility concavity *and* truncation. But your friend is right: concavity (e.g., \( U(\text{wealth}) = \log(\text{wealth}) \)) inherently makes willingness-to-pay *wealth-sensitive*. For example, with \( U(W) = \log(W) \), the certainty-equivalent of St. Petersburg is finite but increases with wealth (e.g., ~$2 for poor, ~$10 for rich). Your intuition of wealth-insensitivity likely stems from truncation (real-world counterparts can’t pay infinite sums), which dominates concavity. *Truncation alone can justify a low, wealth-insensitive fee*, but concavity contradicts wealth-insensitivity.  
      - **Cost of Keeping Incoherence**: If you insist concavity drives wealth-insensitivity, you contradict EU theory.  
      - **What Must Be Given Up**: The claim that concavity explains wealth-insensitivity. Keep truncation as the primary driver.  

  3.  **Apparent Tension (No Real Conflict): (1) EU Maximization vs. (5) Non-EU for Divergent Expectations**  
      - **Resolution**: This is consistent. When the St. Petersburg or Lifesburg EU diverges (i.e., the sum \( \sum p_i U_i \) doesn’t converge), EU maximization has no verdict—so (5) is a natural fallback. No revision needed.  

  ### **Minimal Revision: Introduce Minimal Curvature in Value of Lives**
  - **The Fix**: Replace strict linear utility (\( U(L) = L \)) with a *boundedly linear* utility function. Use \( U(L) = \log(L) \) or \( U(L) = L/(L + L_0) \) for lives \( L \) and a large constant \( L_0 \) (e.g., \( L_0 = 10^{30} \)).  
  - **Why It Works**:  
    - **Resolves (3)**: For your lottery, with \( U(L) = \log(L) \), EU = \( (10^{-12} \times \log(10^{30})) + (1 - 10^{-12}) \times \log(1) \approx (10^{-12} \times 69) + 0 \approx 6.9 \times 10^{-11} \). The sure \(10^4\) lives give \( U = \log(10^4) \approx 9.2 \), which is vastly larger. Anti-fanaticism preserved.  
    - **Resolves (7)**: For Lifesburg, \( U(L) = \log(L) \) gives finite EU. The payoff for flip \( n \) is \( \log(2^n) = n \log(2) \approx 0.693n \). EU = \( \sum_{n=1}^{\infty} (1/2^n) \times 0.693n \approx 1.386 \) utils. If money utility is concave (e.g., \( U(M) = \log(M) \)), liquidating everything (say, \( M = \$10^6 \)) gives \( U \approx \log(10^6) \approx 13.8 \), vastly larger than Lifesburg’s 1.386. No liquidation.  
    - **Preserves (2) for Practical Purposes**: For \( L \ll L_0 \), \( U(L) \approx L \) (near-linear). For \( L \gg L_0 \), \( U(L) \) grows slower (e.g., logarithmically). Long-term work remains viable: preventing extinction still has near-infinite *linear* value for \( L < L_0 \), but avoids fanaticism.  
    - **Satisfies (6)**: One theory. Apply the same curved utility to lives and money (e.g., \( \log \) for both). Trade-offs remain consistent.  
    - **Retains (1)**: EU maximization works everywhere (expectations converge).  
    - **Clarifies (4)**: Use truncation for St. Petersburg payoffs (real institutions can’t pay \( 2^n \) for large \( n \)). Concavity explains why fees are low but not wealth-insensitive; truncation explains wealth-insensitivity.  

  ### **What You Must Give Up and Costs**
  - **Give Up**: Strict linearity in (2).  
  - **Cost**: For very large payoffs (\( L > 10^{30} \)), value grows slower than linear. This slightly reduces the *relative* weight of gigantic payoffs but preserves discriminative power for differences in realistic ranges (e.g., between \( 10^{20} \) and \( 10^{25} \) lives). Crucially, it doesn’t impose a hard ceiling—value still increases, just sublinearly. This is the price of avoiding fanaticism while keeping EU.  

  ### **Why Other "Fixes" Fail**
  - **Probability Thresholds/Ignoring Small Probabilities**: Violates statewise dominance (e.g., a 0.999 chance of 1 life vs. 0.999001 chance of 1 life plus \( 10^{-12} \) chance of \( 10^{30} \) lives).  
  - **Lexical Priorities**: Destroys fine-grained discrimination (e.g., treats all catastrophes below a threshold as equal).  
  - **Hard Ceilings**: Gut (2) by making value bounded (e.g., saving \( 10^{40} \) lives = saving \( 10^{30} \) lives).  

  ### **Verification of Your Judgments**
  - **(1) vs (5)**: Correctly not in tension (as explained).  
  - **(4) Wealth-Insensitivity**: Partly wrong—concavity cannot explain it, but truncation can.  
  - **(7) Lifesburg**: Your intuition is sound; the minimal curvature fix validates it.  
  - **Core Conflict**: (2) is the weakest link. Without revising it, (3) and (7) are indefensible under EU.  

  ### **Conclusion**
  Adopt **minimal curvature in utility** (e.g., \( U(L) = \log(L) \)). This single revision:  
  - Resolves all severe tensions (fanaticism/Lifesburg) while preserving near-linearity for practical long-term work.  
  - Maintains EU maximization, one unified theory, and your anti-fanaticist and Lifesburg intuitions.  
  - Costs only a slight deviation from linearity for astronomically large payoffs—a minor sacrifice given your operational needs.  

  This is the most parsimonious fix. If you insist on strict linearity, you must embrace fanaticism or abandon EU—but that would cost more. I recommend testing the curved utility on historical grant data to confirm discrimination is preserved.
