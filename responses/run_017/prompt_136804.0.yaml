  (ii) **Cancellation argument holds (pivot prob × batch size ≈ 1)**: **0.65**. Uniform/weakly informative priors support ≈1, but heavy-tailed or clustered demand priors could reduce it.  
  (iii) **Real supply chains have unpredictable thresholds**: **0.80**. Inventory systems (e.g., (s,S) policies) use stochastic triggers, though some demand signals exist.  
  (iv) **Downstream effects don’t wash out impact**: **0.55**. Substitution, waste, or price adjustments likely attenuate but rarely nullify net effect.  
  (v) **Moral aggregation handles this expected effect**: **0.75**. Tiny probabilities of large effects pose aggregation challenges but are tractable under standard expected utility.  

  **Combined credence**: Geometric mean ≈ **0.68** (product: 0.85×0.65×0.80×0.55×0.75 ≈ 0.15; adjusted for interdependence).  
  **Most sensitive term**: (iv) Downstream effects. A 10% absolute decrease here (to 0.45) drops credence to ~0.60.  
  **Key empirical evidence**: Estimates of cross-good substitution elasticities in grocery retail would move (iv) furthest.  
  **User-supervisor disagreement locus**: Likely (ii) – your supervisor may doubt the prior’s realism or cancellation robustness.  

