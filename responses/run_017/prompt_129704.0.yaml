  So EU_A(D) > EU_A(C), so Alice would defect. But in this distribution, she cooperates with probability p=x+y=0.7, which is not consistent with her preferring defect.

  So we need to find a fixed point.

  Assume that Alice and Bob both use mixed strategies with probability p and q respectively, and that there is a correlation coefficient.

  For simplicity, assume that the actions are independent. Then r = q, s = q, and t = p, u = p.

  Then for Alice:
    EU_A(C) = 3q - 1
    EU_A(D) = 3q
   so EU_A(D) > EU_A(C) always, so Alice always defects.

  For Bob:
    EU_B(C) = 3p - 2
    EU_B(D) = 3p
   so EU_B(D) > EU_B(C) always, so Bob always defects.

  This is the standard non-cooperative outcome.

  But with correlation, we can have cooperation.

  Let's assume the joint distribution is such that the only constraint is the marginal probabilities and the correlation. We can use the formula:

  x = p*q + rho * sqrt(p(1-p)q(1-q))

  But it's complicated.

  We can solve for p and q such that both are indifferent.

  Assume that Alice is indifferent: EU_A(C) = EU_A(D)
   3r - 1 = 3s

  And Bob is indifferent: 3t - 2 = 3u

  And assume symmetry in the sense that the conditional probabilities are consistent.

  Assume that the joint distribution is symmetric in the following way: P(A=C,B=C) = P(A=D,B=D) and P(A=C,B=D)=P(A=D,B=C). But that would require p=q and symmetric utilities, which we don't have.

  Alternatively, we can set r = t and s = u, but that might not hold.

  This is getting too messy for a two-agent example with different utilities.

  Perhaps in practice, for the trade to happen, the agents must have a high enough correlation and the costs and benefits must be such that both find it beneficial to cooperate.

  But your question about weights: in the case where the agents have the same scaling, they might coordinate on (C,C). If the scaling is different, they might not.

  The idea in the literature is that for the trade to be Pareto-optimal, the agents must be using a common weighting. How is that achieved? By normalizing the utility functions.

  Suppose we normalize Alice's utility so that the difference between her maximum and minimum is 1, and similarly for Bob.

  Alice's possible utilities: -1, 0, 2, 3 -> max=3, min=-1, range=4.
  Bob's: -2,0,1,3 -> max=3, min=-2, range=5.

  Normalize:
  Alice: (U_A - (-1)) / 4 = (U_A +1)/4
  Bob: (U_B - (-2))/5 = (U_B+2)/5

  Alice's normalized utilities for the outcomes:
  (C,C): (2+1)/4 = 3/4
  (C,D): (-1+1)/4=0
  (D,C): (3+1)/4=1
  (D,D): (0+1)/4=1/4

  Bob's normalized:
  (C,C): (1+2)/5=3/5
  (C,D): (3+2)/5=1
  (D,C): (-2+2)/5=0
  (D,D): (0+2)/5=2/5

  Now, in the acausal trade, each agent is assumed to maximize a weighted sum of the normalized utilities.

  But what weights? The theory says that the weights are equal if they are symmetric in their decision-making. Or they might be proportional to the agent's "importance".

  In this case, if they both maximize the sum of normalized utilities, then:

  For (C,C): 3/4 + 3/5 = 0.75+0.6=1.35
  (C,D): 0 + 1 = 1
  (D,C): 1 + 0 = 1
  (D, D): 1/4 + 2/5 = 0.25+0.4=0.65

  Then (C,C) is the best.

  In this case, if both agents are trying to maximize the sum of normalized utilities, then they will both cooperate.

  In the decision rule for EDT, each agent, when conditioning on their action, would be using the joint distribution and choose the action that maximizes the expected sum of normalized utilities.

  This can lead to cooperation.

  So the normalization matters because it sets the relative scales.

  If they don't normalize, then the weights are arbitrary.

  ### Point 1: Trade as buying good news
  In this setup, when Alice cooperates, she is taking a costly action that provides evidence that Bob will cooperate, which benefits her. So she is in effect buying good news about Bob's action. The "trade" is that both are doing this for each other. But it is not a physical transfer; it's an evidential update.

   This is a valid cooperation in the sense that both end up better off than if they both defect. In the (C,C) outcome, Alice gets 2 (not 0) and Bob gets 1 (not 0). So it's a mutual improvement.

   The objection that "EDT just manages the news" does land here, but it also lands in the twin prisoner's dilemma. The standard response is that in the twin case, by cooperation, you cause the other to cooperation (acausally), so it's not just news. Here, similarly, by cooperating, you are acausally causing the other to cooperate ( or rather, you are ensuring that in the set of worlds that are acausally identical, you both cooperate).

  ### Point 4: Size and aggregation
  Now, scale to a large number of agents.

  Suppose there are N agents. Each agent i has a utility function U_i. The action space: each agent chooses an action a_i in {C, D}.

  When agent i cooperates, it pays a cost c_i and gives a benefit b_j to agent j for j != i. But typically, we might assume that the benefit is only to a specific agent or to all? In the literature, it's often pairwise.

  To simplify, assume that the universe is large and that each agent has many potential partners. But since they are causally disconnected, they can only interact acausally.

  In the acausal trade setup, agent i will cooperate if the expected increase in utility from the acausal effects (i.e., the increased probability that others will cooperate with her) outweighs the cost.

  Specifically, agent i's cooperation is evidence that other agents j who are similar (using the same decision rule) will also cooperate, and this benefits agent i.

  In a large universe, let’s say there are M agents that are "acausally connected" to agent i (i.e., they are using the same decision rule and are in the same reference class). The probability that any given agent j exists and is in the reference class might be small, but the number M is large.

  Agent i's utility from cooperating: she pays c_i, and if agent j cooperates, she receives b_{j->i} from agent j. But note: the benefit from agent j might be 0 if agent j is not trading with her. Typically, we assume that the benefits are between all pairs.

  But then the utility would be:

  U_i = -c_i * I(a_i=C) + sum_{j != i} b_{j->i} * I(a_j=C)

  In a large universe, the expected utility for agent i cooperating is:

  EU_i(C) = -c_i + sum_{j} b_{j->i} * P(a_j=C | a_i=C)

  Similarly, for defection:

  EU_i(D) = 0 + sum_{j} b_{j->i} * P(a_j=C | a_i=D)

  The difference:

  EU_i(C) - EU_i(D) = -c_i + sum_{j} b_{j->i} * [ P(a_j=C | a_i=C) - P(a_j=C | a_i=D) ]

  The term in the brackets is the increase in the probability that agent j cooperates given that i cooperates. This is the acausal influence of i on j.

  If the agents are in a large network and each is only influenced by the overall decision rule, then we might assume that for each j, the difference in conditional probabilities is the same, say d_i.

  But d_i might be small because the universe is large and i has little influence on any particular j. However, if there are many j, the sum might still be large.

  The key is that d_i is approximately the same for all j in the reference class, and we can write:

    EU_i(C) - EU_i(D) = -c_i + d_i * B_i

   where B_i = sum_{j} b_{j->i}

  If B_i is very large (because of the large number of agents), and d_i>0, then even if d_i is small, the product might be large enough to outweigh c_i.

  But there is a catch: the event that agent j exists and is in the reference class. Let p_j be the probability that agent j exists and is in the reference class. Then:

    B_i = sum_{j} p_j * b_{j->i}   [because if j doesn't exist or is not in the class, then b_{j->i}=0]

  And d_i is the average increase in the probability that j exists and cooperates given that i cooperates.

  But typically, we assume that the existence is independent of the actions, so we can separate.

  The worry about double counting: if the benefits are not independent, then we might be double counting. For example, if two agents j and k are the same agent in different guises, then we should not count both. But in a large universe, if the agents are distinct, then it's fine.

  The fanaticism worry: if the number M of potential agents is very large, then B_i could be astronomical, and then even a tiny d_i would make cooperation worthwhile. This is similar to Pascal's mugging.

  However, in practice, the correlation d_i might be on the order of 1/M or smaller. If the acausal influence is diluted in a large universe, then d_i might be proportional to 1/M. Then d_i * B_i might be constant or grow slowly.

  For example, if the acausal influence of i on j is due to the fact that i and j are in the same reference class, and the reference class has size M, then if i cooperates, it increases the probability that any other agent in the class cooperates by a small amount. In the simplest model, we might assume that the only correlation is between agents in the class, and that the class is large.

  One model is that the joint distribution over the actions of the agents in the class is exchangeable. Then the law of large numbers kicks in.

  But then the conditional expectation of the proportion of agents that cooperate given that i cooperates might be higher than if i defects.

  Specifically, let Q be the proportion of agents in the class that cooperate. Then:

    EU_i(C) = -c_i + B_i * E[Q | a_i=C]
    EU_i(D) = 0 + B_i * E[Q | a_i=D]

  So the difference is -c_i + B_i * (E[Q | a_i=C] - E[Q | a_i=D])

  Now, E[Q | a_i=C] - E[Q | a_i=C] is the amount by which i's cooperation increases the expected proportion of cooperators. In a class of size M, this difference might be on the order of 1/M. 

  For instance, if the class is large and the agents are exchangeable, then when i cooperates, it's like adding one more cooperator, so the expected proportion increases by 1/M. Therefore, the difference is about 1/M.

  Then the difference in utilities is -c_i + B_i * (1/M)

  But B_i = sum_{j} b_{j->i} = (M-1) * average_benefit, say b_avg.

  So:

    -c_i + [ (M-1) * b_avg ] * (1/M) ≈ -c_i + (b_avg) 

  For large M, this is approximately -c_i + b_avg.

  Then agent i will cooperate if b_avg > c_i.

  This is a reasonable condition: if the average benefit from one other agent's cooperation exceeds the cost of cooperating, then it's worthwhile.

  However, this relies on the assumption that the increase in the expected proportion is 1/M. But if the agents are perfectly correlated, then E[Q | a_i=C] = 1 and E[Q | a_i=D]=0, so the difference is 1, and then the condition becomes -c_i + B_i > 0, which is -c_i + (M-1)*b_avg > 0. For large M, this is easily satisfied.

  But we are in between. In the acausal trade literature, it is often assumed that the correlation is strong enough to make it worthwhile.

  ### Conclusion
  Let me wrap up with a small example for two agents with different utilities, normalized.

  Alice: cost to cooperate=1, benefit from Bob's cooperation=3.
  Bob: cost=2, benefit from Alice's cooperation=3.

  Normalize:
  Alice: utility range from -1 to 3 -> range 4.
  Bob: -2 to 3 -> range 5.

  Normalized Alice: (U_A +1)/4
  Normalized Bob: (U_B+2)/5

  If they both maximize the sum of normalized utilities, then they should choose to cooperate.

  In the decision rule for EDT, Alice, when conditioning on her cooperation, has a high probability that Bob will cooperate (because they are using the same rule), and similarly for Bob.

  Then they both cooperate and both are better off than defection.

  Without normalization, if Alice uses her own utility and Bob uses his, then they might not cooperate if the costs are too high for the conditional probabilities.

  For example, Bob requires P(Alice cooperates | he cooperates) >=2/3, which might not be achievable if Alice's condition is not met.

  In the normalized version with the social welfare function, they both have the same goal, so the conditional probabilities are high.

  This is the mechanics of it.

  The open questions:
  - How to choose the weights? In practice, if the agents don't agree on the normalization, they might not trade.
  - The equilibrium in the general case: we need a fixed point in the joint distribution. It's not clear that it always exists.
  - The aggregation in large worlds: the issue of double-counting and the size of the correlation term.

  I hope this helps.
answer: |-
  ### Unstructured Brainstorming
  Okay, let's put on the EDT/acausal reasoning hat. We're diving into evidential cooperation with different values in a large universe. The core tension: EDT agents condition on their own actions to update beliefs about others' actions, even without causal influence. With different utilities, it's about gains from trade—each sacrifices something they value less to provide something others value more. But since it's all evidential, the "trade" is mediated purely through belief updates.

  Key friction points I'm wrestling with:
  - **Trade vs. News Management**: If actions don't causally affect anything, is this cooperation or just buying good news? In the twin PD, defection-avoidance feels cooperative, but here? Sacrificing for others' benefit feels more like trade, but the mechanism is still evidential. Does EDT's "managing the news" criticism bite harder here?
  - **Weighting & Normalization**: For Pareto-optimality, agents need to maximize the *same* weighted-sum utility. But utility scales are arbitrary. Normalizing isn't just bookkeeping—it sets exchange rates. If agents normalize differently, trade fails or becomes exploitative.
  - **Equilibrium with Mutual Conditioning**: With N agents, each conditions their action on that same action, creating a web of conditional beliefs. Standard Nash equilibrium assumes independence, which breaks here. We need a fixed point where all agents' conditional expectations are consistent. But does such a point always exist? Or can beliefs be mutually inconsistent?
  - **Large Worlds & Aggregation**: With vast numbers, individual probabilities are tiny. Gains scale with population, but credences are diluted. How to avoid double-counting or fanaticism? Does the law of large numbers help or hurt?

  I'll work through a minimal example first, then scale up.

  ---

  ### Small Example: Two Agents
  **Setup**:
  - Agents: Alice (A) and Bob (B), causally disconnected.
  - Actions: Cooperate (C) or Defect (D).
  - Utilities (arbitrary scales):
    - Alice's utility (UA):  
      - Costs 1 to cooperate (e.g., effort she dislikes).  
      - Gains 3 if Bob cooperates (e.g., receives a good she values).  
      - So: UA(C, C) = -1 + 3 = 2, UA(C, D) = -1, UA(D, C) = 3, UA(D, D) = 0.
    - Bob's utility (UB):  
      - Costs 2 to cooperate (e.g., resources he values highly).  
      - Gains 4 if Alice cooperates (e.g., a service he desperately needs).  
      - So: UB(C, C) = -2 + 4 = 2, UB(C, D) = 4, UB(D, C) = -2, UB(D, D) = 0.
  - Joint distribution: Reflects acausal correlation due to identical EDT reasoning. Let P(A, B) be the joint probability. For consistency, we need a distribution where each action is optimal given the conditional beliefs it induces.

  #### Point 1: The Trade Mechanics
  - **What is traded?** Alice sacrificing her utility (cost 1) is evidence Bob cooperates, giving her +3. Bob sacrificing (cost 2) is evidence Alice cooperates, giving him +4. No physical exchange—updates are purely belief-based.  
  - **Cooperation or "buying news"?** It's both. Alice's cooperation is a costly action that provides evidence of Bob's reciprocal action (which benefits her). But crucially:  
    - By conditioning on her *own* action, she isn't "just managing news" in a self-defeating way. Her action is part of a consistent equilibrium where both actions are correlated.  
    - In the twin PD, cooperation avoids mutual defection. Here, it's **gains from trade**: Alice trades something she values less (the cost 1) for something Bob values more (the benefit 4 to him), and vice versa. The evidential update is the *mechanism* enabling this trade.  
  - **Cost-benefit asymmetry**: Alice's cost (1) < Bob's gain (4), Bob's cost (2) < Alice's gain (3). This creates surplus value (1 + 2 < 3 + 4), making trade efficient.

  #### Point 2: Weighted Utilities and Normalization
  - **Why weighted sums?** For Pareto-optimality, both agents must maximize the same welfare function: W = w_A·UA + w_B·UB. Normalization sets w_A and w_B.  
  - **Normalization is critical**: Utilities are affine-invariant, but ratios (w_A/w_B) depend on scale. Suppose:  
    - Alice normalizes UA: Divides by her max-min range (3 - (-1) = 4), so UA' = (UA + 1)/4.  
      Values: UA'(C,C) = (2+1)/4 = 0.75, UA'(D,C) = (3+1)/4 = 1, UA'(C,D) = (-1+1)/4 = 0, UA'(D,D) = (0+1)/4 = 0.25.  
    - Bob normalizes UB: Range (4 - (-2) = 6), so UB' = (UB + 2)/6.  
      Values: UB'(C,C) = (2+2)/6 ≈ 0.67, UB'(C,D) = (4+2)/6 = 1, UB'(D,C) = (-2+2)/6 = 0, UB'(D,D) = (0+2)/6 ≈ 0.33.  
  - **Weighted sum**: If both maximize W = UA' + UB' (equal weights):  
    - W(C,C) = 0.75 + 0.67 = 1.42  
    - W(C,D) = 0 + 1 = 1  
    - W(D,C) = 1 + 0 = 1  
    - W(D,D) = 0.25 + 0.33 = 0.58  
    So (C,C) maximizes W. Cooperation is rational if both condition on maximizing W.  
  - **Mismatched normalization**: If Alice uses UA' but Bob uses raw UB, Bob sees huge gains (e.g., UB(C,D)=4) and might "defect" to exploit, breaking cooperation. Normalization aligns incentives for mutual gain.

  #### Point 3: Equilibrium with Mutual Conditioning
  - **Problem**: Agents don't choose independently. Alice's action affects her beliefs about Bob's action (and vice versa) because they share a decision rule.  
  - **Fixed-point condition**: We need a joint distribution P(A,B) where:  
    - If P(A=C) > 0, then EU_A(C | A=C) ≥ EU_A(D | A=C)  
    - Similarly for Bob.  
  - **Solving for P(A,B)**: Assume full support (all actions possible). Let:  
    - P_C|C = P(B=C | A=C)  
    - P_C|D = P(B=C | A=D)  
    Alice cooperates iff:  
      EU_A(C | C) = 2·P_C|C + (-1)·(1 - P_C|C) ≥ EU_A(D | C) = 3·P_C|C + 0·(1 - P_C|C)  
      → 3·P_C|C - 1 ≥ 3·P_C|C? *Contradiction.*  
    **Mistake!** EU_A(D | C) is conditioned on *A=C* but evaluates action D. Correct:  
    - EU_A(C | A=C) = 2·P_C|C + (-1)·(1 - P_C|C) = 3·P_C|C - 1  
    - EU_A(D | A=C) = 3·P_C|C + 0·(1 - P_C|C) = 3·P_C|C  (since conditioning on A=C, but choosing D)  
    So Alice cooperates iff 3·P_C|C - 1 ≥ 3·P_C|C, which simplifies to -1 ≥ 0. *Never holds!*  
    **What's wrong?** We assumed a joint distribution without specifying the decision rule. In EDT equilibrium, the distribution must be consistent with *all agents using the same rule*. If both maximize W=UA'+UB', then:  
    - They only choose C if it maximizes W given their action.  
    - In (C,C), W=1.42 > W(D,C)=1 (if Alice deviates) and W(C,D)=1 (if Bob deviates).  
    With high correlation, P_C|C ≈ 1. Then:  
      - EU_A(C | C) ≈ 3(1) - 1 = 2  
      - EU_A(D | C) ≈ 3(1) = 3 → Wait, still D is better?  
    **Ah!** This shows the issue. If Alice conditions on A=C, she believes Bob likely cooperates (P_C|C≈1). But defecting *given she cooperates* is impossible—EDT evaluates counterfactuals *under the same conditional beliefs*. So:  
    - When evaluating D, she must condition on *A=D*: EU_A(D | A=D) = 3·P_C|D + 0·(1 - P_C|D)  
    In equilibrium, if both follow the W-rule, P_C|D is small (defection suggests no trade).  
  - **Consistency**: For (C,C) to be an equilibrium:  
    - Alice: Compares EU_A(C | C) and EU_A(D | D) (not EU_A(D | C)).  
      With P_C|C ≈ 1: EU_A(C | C) ≈ 2  
      With P_C|D ≈ 0 (if defection breaks correlation): EU_A(D | D) ≈ 0  
      Since 2 > 0, she cooperates.  
    Similarly for Bob.  
  - **Fixed point exists?** Yes, if both follow W-rule and believe correlation is strong. But if one uses raw utility, no equilibrium may exist. **This is unresolved**: With complex utilities, inconsistent beliefs can arise.

  #### Point 4: Scaling to Large Worlds
  **Setup**:
  - N agents, N large (e.g., 10²⁰). Each agent i has cost c_i to cooperate, and provides benefit b_j to j if they cooperate.  
  - Utilities: U_i = -c_i·I(i cooperates) + Σ_{j≠i} b_j·I(j cooperates)  
  - Normalization: All utilities scaled to [0,1] (max-min).  
  - Agents maximize W = Σ_k U_k' (total normalized welfare).  

  **Aggregation**:
  - Let Q be the fraction of agents cooperating.  
  - Due to exchangeability (same decision rule), E[Q | i cooperates] > E[Q | i defects].  
  - For agent i, EU_i(C | C) = -c_i + (N-1)·E[b | i=C]·E[Q | i=C]  
    EU_i(D | D) = 0 + (N-1)·E[b | i=D]·E[Q | i=D]  
  - **Key term**: ΔQ_i = E[Q | i=C] - E[Q | i=D]  
    This is i's *acausal influence*—how much their cooperation raises the expected cooperation rate.  
  - With exchangeability, ΔQ_i ≈ 1/N (since one agent's action shifts the mean by ~1/N).  
  - **Net expected gain from cooperation**:  
    -c_i + [ (N-1)·E[b | i=C]·(ΔQ_i) ] + (N-1)·E[b | i=C]·E[Q | i=D] - (N-1)·E[b | i=D]·E[Q | i=D]  
    ≈ -c_i + [ (N-1)·E[b]·(1/N) ]   (if E[b] similar across actions)  
    ≈ -c_i + E[b]  
    Since (N-1)/N ≈ 1.  
  - **Threshold**: i cooperates if E[b] > c_i.  
    In our example, if average benefit E[b] exceeds personal cost, cooperation is worthwhile.  

  **Size Effects**:
  - **Helps**: With large N, ΔQ_i ≈ 1/N is tiny, but multiplied by N·E[b], it becomes E[b]—a stable, finite value. No fanaticism.  
  - **Hurts?**: If correlation is weak (e.g., ΔQ_i ≪ 1/N), cooperation fails. But with identical EDT reasoning, ΔQ_i is O(1/N).  
  - **Double-counting**: Avoided by exchangeability. Agents are treated symmetrically, so no overlap.  

  **Example**:  
  - Suppose all c_i = 1, b_j = 0.1 (to any j), N=10²⁰.  
  - Normalized utilities: c_i' = c_i / c_max = 1/1 =1; b_j' = 0.1 / b_max = 0.1/0.1=1 (if b_max=0.1).  
  - E[b'] = 1 (after norm).  
  - ΔQ_i ≈ 1/N = 10^{-20}  
  - EU_i(C | C) ≈ -1 + (10^{20} - 1)·1·(1/N) ≈ -1 + (10^{20})·(10^{-20}) = -1 + 1 = 0  
    EU_i(D | D) ≈ 0 + (10^{20} - 1)·1·(E[Q | i=D])  
    But E[Q | i=D] ≈ E[Q] - ΔQ_i ≈ E[Q] - 10^{-20} (small). If E[Q] is low, EU_i(D | D) might be <0, but:  
  - **Net gain**: -c_i + E[b'] = -1 + 1 = 0. Indifferent.  
  - **Cooperation if E[b'] > c_i'**: Here, 1 > 1? No. So defect. But if b_j = 0.11, E[b']=1.1, then -1 + 1.1 = 0.1 > 0, cooperate.  

  ---

  ### Summary and Open Questions
  - **Trade mechanics**: In EDT, cooperation with different values means sacrificing by your values to provide benefits by others' values, mediated by acausal correlation. It's genuine trade (creates surplus), not just news-buying, because actions are part of a consistent equilibrium.  
  - **Weights and normalization**: Normalization sets trade exchange rates. Mismatches cause failed cooperation or exploitation. Equal weights in normalized utilities enable Pareto-optimality.  
  - **Equilibrium**: Requires a joint distribution where each action is optimal given its conditional beliefs. Fixed points exist if all agents maximize the same W, but may not otherwise. Open: How to handle inconsistent beliefs?  
  - **Large worlds**: With exchangeability, ΔQ_i ~ 1/N, so EU scales to -c_i + E[b] (finite). No fanaticism or double-counting.  

  **Settled vs. Open**:  
  - ✅ Trade gains and normalization role.  
  - ✅ Aggregation in large worlds with exchangeability.  
  - ⚠️ Equilibrium existence: Proved for same W, open for heterogeneous reasoning.  
  - ⚠️ Normalization method: Range? Variance? Genuinely open and debated.  
  - ⚠️ Correlation strength: What if agents aren't fully exchangeable?  

  The EDT acausal trade is fragile but powerful: with aligned normalization, it enables cooperation across vast distances. But it hinges on consistent mutual conditioning—a delicate balance.
