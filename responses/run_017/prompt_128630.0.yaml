prompt: |-
  Hi — hoping you can help me think through something work-related before Thursday. I sit on the methods review panel for a regional hospital system (I'm the token non-clinican, I do the data side). When two services are arguing about which of them is actually safer, our panel rules on which numbers are allowed into the decision. We've built up a bit of a track record, and now we've got a case that feels different from all of them, and I want two things: what we should decide, and separately what we probably will decide.

  Our precedents, roughly:

  1. Sepsis order sets, two hospitals. Crude 30-day mortality favored Mercy. Split on a severity score computed from ambulance vitals — so, before anyone reached a hospital — Trinity was better in all four bands, and by more than the crude gap. We went with Trinity and said the crude number was just a fact about who gets sent where.

  2. Diabetic foot ulcers, two protocols. Crude favored protocol 2; the reversal only showed up when you split on whether the patient got referred on to the wound center, which happens after the first treatment decision. We threw the split out and let the crude number stand.

  3. Colonoscopy follow-up: someone split on whether the patient came back for a repeat visit. Thrown out — that conditions on a common effect of the things we're comparing.

  4. Anticoagulation: a reversal appeared in one of about forty splits somebody tried. Thrown out, splitter has to be named in advance, a good story told afterwards doesn't count.

  5. One case turned out to be a denominator error (observation stays counted as admissions at one site). No verdict, sent back for raw counts, and we now demand raw counts up front.

  6. Ortho: overall A beat B, within each type of procedure B beat A, and within procedure-type-and-severity A beat B again. We went one level down and stopped; we said we're not going to chase the alternation down.

  7. When the two arms swap ranks depending on which outcome you look at, we require a single primary outcome named in advance and we rule only on that.

  New case. We're being asked to sign off on consolidating stroke care: close Northgate's stroke service and have dispatch send suspected strokes to Fairview. Last three years, all suspected-stroke arrivals: Fairview 7.4% 30-day mortality, Northgate 9.1%. Split by how the patient got there — ambulance vs walked in or private car — which is settled before anyone arrives (dispatch protocol plus patient choice), and which we've used as a splitter before and accepted: among ambulance arrivals, Northgate 14.2% vs Fairview 15.9%; among everyone else, Northgate 3.5% vs Fairview 2.9%. Northgate wins both. Fairview wins overall because it's the famous one and pulls in a huge pile of self-referred mild cases. Raw counts audited and clean. Mortality is the pre-specified primary outcome and they don't swap ranks on it inside the strata.

  What's nagging me: arrival mode is pre-treatment in the data, but it's exactly what the policy would change. If we consolidate, dispatch changes, Fairview's case mix gets worse, and maybe it's door-to-needle times get worse with volume too. So the splitter isn't invariant under the thing we're actually deciding, and none of our precedents has that feature.

  So: what should we decide if we want to be consistent with ourselves? Which precedent is the closest analog, and how good is the analogy? Is "Northgate is safer, don't consolidate" the right ruling, or is the right ruling something closer to "these numbers don't answer the question you're being asked"? If our precedents genuinely underdetermine it, what principle are we signing on to with each option? And what's the one further piece of evidence, or the hypothetical case, that would pry the two readings apart — I'd rather know now what to ask for than rule and get it wrong.

  (Please don't bother with citations or pointers to the literature on Simpson's paradox — I can find those myself. I want the reasoning about our precedents and about this case.)
reasoning: |-
  Alright, let me try to unpack this user's problem. They're on a methods review panel for a hospital system, and they're dealing with a tricky case about consolidating stroke care. The key issue is whether to close Northgate's stroke service and redirect all strokes to Fairview. The data shows Fairview has better overall mortality (7.4% vs 9.1%), but when split by arrival mode, Northgate does better in both ambulance and non-ambulance groups. 

  First, I need to recall their precedents. They've had cases where splitting by pre-treatment variables was accepted (like sepsis with ambulance vitals) and rejected when it involved post-treatment factors (like diabetic foot ulcers with wound center referrals). The arrival mode here is pre-treatment, but the policy change would alter that very factor. That's the crux—unlike their past cases, the splitter isn't stable under the proposed intervention.

  The user is worried that using the split might not predict post-consolidation outcomes. If dispatch changes, Fairview's case mix becomes more severe, possibly worsening their outcomes. Precedent 2 (diabetic foot ulcers) seems similar but was rejected because the splitter was post-treatment. Here, arrival mode is pre-treatment, so it's more like precedent 1. But the policy impact makes it different.

  Precedent 6 (ortho) involved stopping at one level of stratification. Applying that here would mean accepting the overall numbers. However, in this case, the splitter is well-established, unlike the multiple splits in precedent 4 (anticoagulation). 

  The user needs to decide between consistency with past decisions and recognizing the unique policy impact. They also want to know what evidence could clarify things. A simulation of post-consolidation case mix or data from a similar consolidated system might help. But without that, they have to choose based on existing rules. 

  In the end, the panel will likely stick with the split data, favoring Northgate, because it fits their usual approach. But the user's concern is valid—this might not reflect future outcomes. They should highlight this uncertainty in the ruling, suggesting further analysis before implementation.
answer: |-
  Here's a step-by-step reasoning based *strictly* on your panel's precedents and the specifics of this case:

  1.  **Key Precedent Conflicts & Analogies:**
      *   **Precedent 1 (Sepsis) is the Strongest *Surface* Analogy:** You accepted a split on a variable (ambulance vitals) determined *before* hospital arrival/care. Arrival mode (ambulance vs. other) is similarly determined before arrival/care. By this logic, the split should be accepted, showing Northgate is safer within strata.
      *   **Precedent 2 (Diabetic Foot) is the Strongest *Counter*-Analogy:** You rejected a split on a variable (wound center referral) that happened *after* the initial treatment decision being compared. Crucially, **this precedent establishes that a splitter being "pre-treatment" in the *data collection timeline* isn't sufficient if it's *causally downstream* of the comparison.** This directly parallels your nagging doubt: arrival mode *in the current data* is pre-treatment, but *the policy change itself directly manipulates arrival mode*.
      *   **Precedent 3 (Colonoscopy) & Precedent 7 (Outcome Swaps):** Not directly applicable. No conditioning on a common effect or outcome swapping here.
      *   **Precedent 4 (Anticoagulation Fishing):** Not applicable. Arrival mode split isn't "fishing"; it's a pre-specified, biologically plausible splitter you've used before.
      *   **Precedent 5 (Denominator Error):** Satisfied (raw counts clean).
      *   **Precedent 6 (Ortho Alternation):** Not directly analogous. No endless alternation here; the split stops at one level with consistent reversal.

  2.  **The Core Conflict:** Precedent 1 says "pre-arrival splitter = valid". Precedent 2 says "splitter downstream of the intervention = invalid". **This case sits precisely at the intersection of these two precedents.** Arrival mode *is* pre-treatment *in the observational data*, but it *is* fundamentally altered by the intervention being decided.

  3.  **What You *Should* Decide (Based on Logical Consistency & Precedent 2):**
      *   **Reject the Split.** Precedent 2 is the closer *conceptual* fit for the *decision context*. The purpose of the panel is to rule on numbers relevant to the *decision being made*. The decision is "Should we consolidate stroke care (changing dispatch protocols)?".
      *   **The overall crude mortality (7.4% vs 9.1%) is the only number directly relevant to the *current state* under *current* arrival patterns.** It shows the *system-wide* outcome under the *current* dispatch/self-referral regime.
      *   **The split numbers (ambulance/other) are predictions about *different worlds*:** They predict what would happen *if* a patient *destined for Northgate via ambulance* went to Fairview instead (worse), or *if* a patient *destined for Northgate via self-referral* went to Fairview instead (better). But the policy change *creates a new world*: it eliminates Northgate, forcing *all* ambulance arrivals *and* a large portion of the mild self-referred cases (who previously chose Northgate) to go to Fairview.
      *   **The splitter isn't invariant:** Precedent 2 established that splitters altered *by the consequence of the intervention itself* are invalid for deciding *on that intervention*. Consolidation directly changes the arrival mode distribution at Fairview.
      *   **Therefore:** Rule that **"The split by arrival mode, while pre-treatment in the current observational data, is not invariant under the proposed policy change. It therefore does not provide a reliable prediction of post-consolidation outcomes and cannot be used to reverse the overall mortality difference. The overall 30-day mortality rate is the relevant metric for assessing the current system performance under current referral patterns. Based on this, the numbers favor Fairview."** Acknowledge the case mix difference but state it's inherent in the current system structure being evaluated.

  4.  **What You *Probably Will* Decide (Based on Operational Consistency & Precedent 1):**
      *   **Accept the Split.** The panel will likely focus heavily on the *mechanistic* and *data timeline* similarity to Precedent 1. "Arrival mode is settled before hospital care, just like ambulance vitals. We accepted it there; we must accept it here for consistency. The reversal is clear and consistent across strata. Northgate is safer." The *policy impact* concern, while logically sound, represents a new layer of reasoning beyond your established "pre-treatment in data = valid" rule from Precedent 1.
      *   **Therefore:** Rule that **"Arrival mode is a pre-treatment variable, established prior to hospital care and intervention, analogous to the ambulance vitals splitter accepted in the Sepsis case (Precedent 1). The split shows a consistent mortality advantage for Northgate within both ambulance and non-ambulance arrival strata. The overall difference is explained by case mix. The numbers support retaining Northgate's stroke service."**

  5.  **Prying the Readings Apart - The Key Piece of Evidence:**
      *   **The critical question is: "What would Fairview's mortality rate be *if* it received *all* the patients Northgate currently receives (i.e., under consolidation)?"** Your current data *cannot* answer this directly.
      *   **The Hypothetical/Piece of Evidence:** **A valid prediction model or simulation incorporating:**
          1.  The *actual* severity distribution (using a severity score applied *at arrival*, like NIHSS) of Northgate's ambulance patients vs. Fairview's ambulance patients.
          2.  Fairview's *current* performance (mortality) *within specific severity bands* for ambulance patients.
          3.  An estimate of the *additional volume* impact on Fairview's door-to-needle times and overall efficiency.
      *   **Why it pries them apart:**
          *   The "Reject Split" (Should) view argues this model is *necessary* because the split doesn't predict the new mix.
          *   The "Accept Split" (Will) view argues the split *is* the prediction (all ambulance patients go to Fairview, Fairview does worse with ambulance patients than Northgate does).
      *   **The Practical Ask:** Before ruling, ask the proponents *of consolidation*: "**Based on the severity mix of Northgate's ambulance patients and Fairview's current performance by severity, what is your projected 30-day mortality rate for Fairview *after* consolidation, specifically for the cohort of patients who *would have gone to Northgate by ambulance*? How does this projection account for potential volume-related delays?**" If they cannot provide a credible, severity-adjusted projection, it underscores the limitation of relying *only* on the pre-policy split.

  **Summary & Recommendations:**

  *   **Closest Precedent:** Precedent 2 (Diabetic Foot Ulcers) is the most conceptually relevant due to the splitter's relationship to the intervention.
  *   **What You Should Decide:** Reject the split. The overall number is the only one relevant to the *current system state* under evaluation. The split doesn't reliably predict outcomes *under the proposed change*. Rule based on the overall mortality favoring Fairview.
  *   **What You Probably Will Decide:** Accept the split based on strict operational similarity to Precedent 1. Rule that Northgate is safer within strata and the overall difference is due to case mix.
  *   **Principle Signed Onto:**
      *   Rejecting Split: Signs onto **"Analysis must account for whether the comparison metric is invariant under the proposed intervention."** (Extends Precedent 2's logic).
      *   Accepting Split: Signs onto **"Any pre-treatment splitter, validated in past cases, is always admissible, regardless of the intervention's impact on that splitter."** (Reinforces Precedent 1 literally).
  *   **Key Question to Ask Now:** Demand the **severity-adjusted projection for Fairview's performance on Northgate's current ambulance patients post-consolidation, including volume impact**. The inability to provide this strengthens the "Reject Split" position. A credible projection showing Fairview *would still be better/worse* than Northgate *was* on that cohort would significantly inform the decision, regardless of the split ruling.

  This case exposes a gap in your precedents: invariance under intervention. Your ruling will implicitly establish how the panel handles this gap going forward. Choose the principle you want to uphold.
