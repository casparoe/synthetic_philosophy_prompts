prompt: |-
  I'm a software engineer with no philosophy background (well, one undergrad ethics class I mostly slept through), and somehow I ended up as the "technical person" on the clinical ethics committee at one of the hospitals my company builds decision-support tools for. I keep finding that my gut verdicts on individual cases are very confident but don't add up to anything I can actually write down, and I'd like the rule. I even tried writing it as a spec — if X, then permissible — and it collapsed every time I tested it against the next case.

  Here's where I land. Unplugging the ventilator on a patient who'll never breathe on their own again, because the family asks us to: fine, obviously. Never starting the vent in the first place on that same patient: also fine, and I'll say out loud that it's the same decision, even though the ICU attendings treat withholding as completely different from withdrawing and much easier to sleep after — I think they're just wrong about that. Stopping a feeding tube: also fine, but it makes me uneasy in a way the vent doesn't, and I can't tell whether that's a real distinction or just squeamishness about food and water. Taking a young, awake patient with a high spinal cord injury off the vent because he's decided he doesn't want to live like that: fine, and somehow clearer than the first case even though he isn't dying of anything. Morphine for someone in end-stage lung disease who's gasping for air, at a dose where everyone in the room knows it'll shorten things by a few hours: fine. The same drug at a much bigger dose, where the whole point is to end it: not fine. I know those two look inconsistent — same drug, same route, same patient, same physiological cause of death, only the reason is different — and my friend mutters something about "double effect," but I don't want a tour of the literature, I want the principle.

  The pair that really breaks me: the guy who sneaks into the bathroom to hold his cousin's head under the water for the inheritance is a murderer, and the guy who came prepared to do exactly that, finds the kid already face-down, and just stands there and watches is also a murderer, close enough that I don't care about the difference. But then why isn't unplugging the vent the same thing? My best attempt at a principle: it's OK when what kills them is whatever was already wrong with them — their lungs, their heart — and not OK when the death comes from something I introduce into the situation. That doesn't handle the morphine pair (the drug kills them in both), and I'm not sure what it says about a nurse accidentally knocking a dialysis machine off and me deciding not to restart it. And next month we've got two cases that aren't in anybody's binder. One: during a surge, an allocation model ranks patients and recommends moving the last ventilator from a patient with poor projected benefit to one with better projected benefit; the attending's entire action is one click, accept recommendation, and a respiratory therapist does the actual disconnect per protocol. That feels fine to me if the ranking process is fair, but it definately feels worse than never having allocated the vent to the first patient in the first place, which is supposed to be the same thing. Two: a closed-loop sedation controller that titrates propofol to a comfort target, where the team's only real choices are let it run or switch it off — if the patient dies sooner because the controller ran, who did what, and does the principle say anything? So: can you give me a principle, or two competing candidates, with each clause tied to the case that motivates it, tell me honestly which of my verdicts it can't save and which one I should probably give up, and tell me what it predicts for those last two cases?
reasoning: |-
  Okay, the user is a software engineer on a clinical ethics committee, struggling to formalize their intuitive ethical judgments into a consistent principle. They've presented several medical scenarios where their gut feelings are clear but seemingly contradictory when analyzed systematically. 

  First, I need to recognize their core frustration: they're used to writing logical specs (if X then Y), but ethics keeps collapsing under edge cases. Their examples reveal deep tensions in medical ethics: withdrawing vs withholding care, intention vs outcome, natural death vs intervention. 

  The drowning cousin analogy is particularly sharp - it exposes why unplugging a vent feels ethically different than drowning someone, even though both involve inaction. This suggests they're intuitively grasping the distinction between "killing" and "letting die," but need a framework that doesn't break on cases like morphine dosing or ventilator reallocation.

  Their two upcoming cases are fascinatingly modern: algorithmic resource allocation and closed-loop systems. These force us to confront whether agency matters when decisions are delegated to protocols or machines. The sedation controller case especially blurs lines - if a machine optimizes for comfort knowing it may hasten death, is that meaningfully different from a doctor doing the same?

  I notice they dismiss "double effect" as "literature" but their morphine example perfectly illustrates it. Maybe reframing it as "intended effect vs foreseen side-effect" in engineering terms would resonate. Their discomfort with feeding tubes vs vents also hints at unconscious symbolic weight we give to food/water versus air.

  What they really need isn't dogma but tools to test their intuitions. I should offer competing principles (causal responsibility vs intention) not as final answers but as diagnostic lenses. For the tough cases: the vent reallocation feels worse because it actively reverses prior commitment, while the sedation controller is ethically cleaner since death is a side-effect of comfort optimization.

  Most importantly, I should validate that their struggle is normal - ethics isn't software. Their examples show excellent moral intuition; the friction comes from trying to over-regularize what's inherently contextual. The answer might be principled pluralism rather than a single spec.
answer: |-
  Your struggle is the sound of excellent ethical intuition colliding with philosophy's hard limits. You're wrestling with core tensions in medical ethics that resist simple rules. Here's a breakdown of candidate principles, case-by-case analysis, and predictions, grounded in your examples:

  **Candidate Principle 1: The "Intentional Causation of Death" Principle**
  *   **Core Idea:** An act is permissible *unless* the agent **intends death as a means or an end**, *and* death is caused by an **external intervention** introduced by the agent.
  *   **Clauses Motivated By Your Cases:**
      *   `Intent Death`: Motivated by the morphine pair (fine for symptom relief, not for intentional overdose) and the drowning cousin (intent to kill).
      *   `External Intervention`: Motivated by vent withdrawal vs. drowning (unplugging stops an external intervention *already* sustaining life; the underlying disease kills. Drowning introduces a *new*, fatal external force). Also clarifies why stopping feeding tubes feels uneasy (we perceive food/water as more "natural" than a vent, making the intervention seem less external, even though it is).
      *   `And` linkage: Both conditions must be met for impermissibility. Acting without intent (morphine for pain) is ok even if death is a side effect. Intending death *without* introducing a new lethal intervention (e.g., *not* restarting a knocked-off dialysis machine for a patient who would die without it) might be permissible.

  **Candidate Principle 2: The "Causal Responsibility for the Lethal Sequence" Principle**
  *   **Core Idea:** An act is permissible if the agent is **not the primary causal initiator of the new lethal sequence** leading to death. Permissible acts allow the underlying pathology to take its course; impermissible acts start a *new*, independent fatal process.
  *   **Clauses Motivated By Your Cases:**
      *   `Primary Causal Initiator`: Motivated by the drowning cousin (holding head under water *starts* the drowning sequence). Unplugging the vent *removes a barrier* to the pre-existing fatal pathology (respiratory failure) taking its course; it doesn't *start* a new lethal pathology.
      *   `Underlying Pathology`: Explains the vent withdrawal, withholding, feeding tube withdrawal, and spinal cord injury cases. Death results from the disease/injury.
      *   `New Lethal Process`: Explains the morphine overdose (drug toxicity *becomes* the primary cause) vs. symptom relief (disease remains primary cause, drug side-effect accelerates it). Explains why drowning is murder (you initiated suffocation).

  **Analysis of Your Verdicts & Principles:**

  | Case                                 | Your Verdict    | Principle 1 (Intentional Causation) | Principle 2 (Causal Responsibility) | Can Principle Save It? | Should You Give Up? |
  | :----------------------------------- | :-------------- | :---------------------------------- | :---------------------------------- | :--------------------- | :------------------ |
  | **Withdraw Vent (Family Request)**   | Fine            | ✔️ No intent to kill; Remove ext. intervention | ✔️ Underlying pathology kills; No new lethal process | Both: Yes              | No                  |
  | **Withhold Vent**                    | Fine (Same)     | ✔️ No intent; No ext. intervention started | ✔️ Underlying pathology; No new process | Both: Yes              | No (Attendings wrong) |
  | **Stop Feeding Tube**                | Fine (Uneasy)   | ✔️ No intent; Remove ext. intervention | ✔️ Underlying pathology kills; No new process | Both: Yes              | No (Unease = Squeamishness?) |
  | **Withdraw Vent (Awake SCI Patient)**| Fine (Clearer)  | ✔️ No intent; Remove ext. intervention | ✔️ Underlying pathology kills; No new process | Both: Yes              | No                  |
  | **Morphine (Symptom Relief)**        | Fine            | ✔️ Intend relief (not death); Death side-effect | ✔️ Disease primary cause; Morphine accelerates | Both: Yes              | No                  |
  | **Morphine (Intentional Overdose)**  | Not Fine        | ✖️ **INTENT Death**; Ext. intervention | ✖️ Morphine toxicity = **New Primary Cause** | Both: Yes              | No                  |
  | **Drowning (Active)**                | Murder          | ✖️ **INTENT Death**; **INTRODUCE** external force | ✖️ **INITIATE** new lethal process (drowning) | Both: Yes              | No                  |
  | **Drowning (Omission)**              | Murder (Close)  | ? (Debatable intent; No *new* force introduced? Complex) | ? (Didn't *initiate* drowning, but *prevented* rescue? Complex) | **Both: Struggle**     | **Possibly** (Grey zone) |
  | **Don't Restart Knocked-Off Dialysis**| ?               | ✔️ No intent to kill; Not introducing new harm | ✔️ Underlying pathology (renal failure) kills; No new process | Both: Likely Yes (Permissible) | -                   |

  *   **Where Principles Struggle:** The *watching* cousin drown case is the Achilles' heel for *both* principles. Neither cleanly captures the strong intuition that *not* acting to save someone you have a duty to save, *knowing* death will result, is morally equivalent to killing them in this context. Principle 1 struggles with "intent" and "introducing" harm via omission. Principle 2 struggles because you didn't *initiate* the drowning sequence. This highlights a core philosophical debate about acts vs. omissions and positive duties.
  *   **Give Up?** Your intuition on the *watching* cousin is strong and common. Don't abandon it entirely. Recognize it points to a limitation of these principles regarding *duties to rescue* in specific relationships. It might require a separate clause (e.g., "unless the agent has a specific duty to prevent the death and can easily do so").

  **Predictions for Your New Cases:**

  1.  **Algorithmic Ventilator Reallocation (Click Accept):**
      *   **Principle 1 (Intentional Causation):** *Permissible?* The *intent* is likely triage/saving life B, not killing A (Death is a foreseen, perhaps regretted, consequence). The *external intervention* (disconnecting) is introduced, but it's removing an intervention already present. **Verdict:** Likely Permissible, *BUT* the unease might stem from the *proximity* of the act (clicking "accept" feels causally direct) and the *reversal* of prior treatment (feels more like "killing" than "letting die"). This explains why it feels worse than withholding.
      *   **Principle 2 (Causal Responsibility):** *Permissible?* The *primary causal initiator* of the lethal sequence remains the patient's underlying disease/injury. Removing the vent allows that pathology to take its course; it doesn't start a *new* lethal process. The algorithm/protocol is just a tool for decision-making. **Verdict:** Permissible. The unease might relate to the *speed* and *artificiality* of the decision process compared to traditional clinical judgment, not the core causal structure.
      *   **Your Unease Explained:** Both principles technically permit it if the process is fair. Your discomfort likely stems from the *active removal* after commitment ("withdrawal" feels different than "withholding") and the *delegation* of agency to an algorithm/protocol, making the causal chain feel less "natural" and the intention potentially harder to discern clearly. **This unease is valid and highlights contextual factors beyond the core principles.**

  2.  **Closed-Loop Sedation Controller (Propofol Titration):**
      *   **Principle 1 (Intentional Causation):** *Permissible.* The *intent* is clearly comfort, not death. Death is a potential side-effect of achieving comfort. The *external intervention* (propofol) is introduced, but it's titrated to a comfort goal, not a lethal dose goal. **Verdict:** Permissible (like morphine for symptom relief).
      *   **Principle 2 (Causal Responsibility):** *Permissible.* The *primary causal initiator* of death remains the underlying terminal disease. The propofol is given *only* to manage symptoms related to that disease. Its contribution to hastening death is a side-effect, not the initiation of a new, independent lethal process (like an overdose would be). **Verdict:** Permissible.
      *   **"Who did what?"** The team's choice ("let it run") involves setting the *goal* (comfort) and accepting the *risk* (potential hastening of death). The controller is the *mechanism*. The team remains ethically responsible for configuring the system appropriately and monitoring its outcomes, just as they are responsible for manually titrating sedation. The principle focuses on the team's intention and the causal role of the drug relative to the disease. **Verdict:** Permissible.

  **The Verdict on Principles:**

  *   **Neither is perfect.** Both struggle with the *watching* cousin case and the subtle psychological differences (withdrawing vs. withholding, feeding tube unease, reallocation discomfort).
  *   **Principle 1 (Intentional Causation)** aligns well with your strongest intuitions (morphine pair, active drowning, unplugging vs. drowning). It directly addresses your "why isn't unplugging the same?" question via the "external intervention" clause. It handles the dialysis machine case cleanly.
  *   **Principle 2 (Causal Responsibility)** also aligns well and offers a slightly different, often complementary, perspective focused on the flow of causality. It feels more "natural" for the disease-focused cases.
  *   **Recommendation:** **Principle 1 (Intentional Causation)** is likely the better core framework *for you*, as it most directly tackles the distinctions that caused your biggest headaches (morphine intent, unplugging vs. drowning). However, **recognize its limitations:**
      *   It struggles with the strong intuition about the *watching* cousin. Don't abandon that intuition; acknowledge it points to a separate ethical dimension (duty to rescue) that needs consideration alongside the core principle.
      *   It doesn't fully explain the *psychological* difference between withdrawing and withholding, or feeding tube unease. These might be irreducible human factors or require additional context (like prior commitment).
      *   It needs careful application in delegation scenarios (algorithm, controller). The *intent* resides with the humans setting up the system and its goals.

  **In essence:** You are intuitively navigating the Doctrine of Double Effect (Intention matters), the Acts/Omissions Distinction (Withholding vs. Withdrawing *can* feel different but often isn't logically distinct), and the Killing/Letting Die distinction (External Intervention/Causal Responsibility). Principle 1 captures the Double Effect and Killing/Letting Die intuitions best for your cases. Use it as your core "spec," but accept that ethics, unlike code, often requires tolerating some ambiguity at the edges and incorporating additional contextual factors (like duty, prior commitment, psychological impact) that a single rule can't fully encode. Your discomfort at the edges is a feature, not a bug—it signals where deeper ethical reasoning is needed.
