  *(adjusting pince-nez with characteristic earnestness)*  
  Ah! The phantasmograph presents a most instructive dilemma, yet it confirms, rather than undermines, my central thesis. You err in conflating the *subjective character* of consciousness with the *objective relations* that constitute intrinsic value. The machine produces states indistinguishable *from within* — granted. But intrinsic goodness, as I argue in §112, adheres not to isolated sensations, but to *organic unities*: complex wholes whose value exceeds the sum of their parts.  

  Consider "pleasures of human intercourse." Its goodness arises not merely from feelings of affection, but from the *actual reciprocation*, the *shared existence* of minds in communion. The phantasmograph gives a counterfeit: consciousness without mutual recognition, affection without an object capable of *returning* it. This whole — real friendship — is good intrinsically; the simulation, however subjectively identical, lacks the objective relational element. Similarly, "enjoyment of beautiful objects" unites consciousness with the *actual existence* of beauty. A beautiful landscape unperceived retains value (§50) because beauty is an objective, non-natural property. The machine’s images, however exquisite, are not *instantiations* of beauty — they are phantasms, devoid of that property.  

  Thus: the machine offers valuable *conscious states* (pleasure, aesthetic semblance), but severs them from the objective constituents (real friendship, real beauty) that form the organic wholes we call "the greatest goods." Value resides in the *unified complex*, not in consciousness alone nor in objects alone. Your landscape example reinforces this: beauty’s intrinsic worth persists even unperceived because existence itself partakes of value. The phantasmograph, for all its marvels, cannot conjure *that*.  

  Pray, clarify: does the machine merely simulate neural states, or does it generate genuine, disembodied consciousness? This distinction may prove material.  

