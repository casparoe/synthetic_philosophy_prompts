prompt: |-
  hey — I'm doing methods review for a psych journal and I keep having the same fight with a co-author. Papers come in where subjects use some resource while doing a task — a notebook, a phone, a checklist, an autocomplete, another person — and the write-up says "participants remembered / decided / reasoned", and my co-author says no, the resource did that bit and the participant read it off. I dont want to keep settling this one paper at a time, so I want the spec.

  Write me the desiderata for a criterion of cognitive extension in the extended-mind sense. Fix the purpose for me: the criterion's job is to say, for a given subject + task + resource, whether an explanation of the performance should count the resource as part of the cognitive system that did it or as part of that system's surroundings. So heavy metaphysical "constitution" talk only earns its keep if it cashes out in some difference to how we describe, model, or intervene on the performance — if it cant, say so and drop it. I do NOT want a new theory of my own; I want the list of things any theory has to deliver to be usable for that job.

  For each requirement give me the case or consideration behind it — why anyone should accept it, not just that people do — and mark whether it is non-negotiable or a preference of one camp. Here are cases I already think a criterion has to sort; add your own where mine arent load-bearing:

  - the famous one: someone with memory trouble who always carries a notebook, writes things in it, and uses what he reads there without checking — vs. someone who hears about an exhibition, remembers it herself, and goes; vs. someone who has to look the address up in a guidebook he has never seen before
  - a blind person's cane, and seperately a pair of glasses: if the criterion lets both in, is that a cost or a feature, and what does it do to the criterion's purpose
  - my phone's contact list: I can recall maybe two numbers, I'd be lost without it, and I often dont know whether a number it shows me is right or whether the entry is the current one. This is the case that breaks things for me.
  - a generative writing assistant that is maybe 85% right on the kind of thing I use it for, that I've learned to correct for, whose output I cant predict in advance but recognise as soon as I see it, and that I sometimes argue with and overrule
  - a couple's shared calendar where one partner's recall depends on what the other one typed in
  - an abacus user's abacus, and the same person's abacus twenty years later when he can no longer say what his hands are doing but still gets the right answer
  - a notebook its owner has stopped trusting but still cant stop consulting; and the same kind of notebook for someone who only started using it last week and still checks it against memory every time
  - a whiteboard across the room that I know is there but cant currently read from where I'm sitting

  Stuff I explicitly want handled rather than assumed:

  1. Whether "extended" is all-or-nothing or admits degrees — and if it admits degrees, what the criterion says in the middle cases and what a reviewer is supposed to write down there. I suspect most of my fights with my co-author are secretly about this and nobody says so.
  2. Whether the subject gets a vote. Does first-person authority ("that's not me, that's the app talking") settle the question, get weighed, or get overruled by the criterion? Pick one, justify it, and give the case that shows what each option costs you.
  3. Both boundary conditions, as one requirement each if you can: what stops the criterion from swallowing everything (cognition depends on oxygen, on language, on culture, on the layout of the room — at some point "extended" stops being a claim) and what stops it from being so strict that nothing external ever counts and the whole literature was pointless.
  4. A temporal requirement. The papers I review are about learning and about skill decay, so I need the criterion to say something about a resource that is in the middle of being integrated into someone's performance, or in the middle of being abandoned. A criterion that only scores snapshots is not much use to me.
  5. Something about error and disagreement: what has to happen when the subject and the resource conflict, who wins, and why the answer to that is evidence about whether they form one system. I think this does more work than the trust condition people keep listing, but argue me out of it if I'm wrong.

  Then two more things. First: which two or three of your desiderata probably cant be jointly satisfied, with the case that shows the strain — and be explicit that this is a result about the list, not a complaint about any particular theory. Second: which single requirement knocks out the most candidate theories, since that's the one I should press people on in review.

  Sections, in this order:

  - "What the criterion is for" — about 100 words, and open by saying plainly what my stated purpose does and does not entitle me to demand
  - "The desiderata" — the bulk, around 900 words, one short block per requirement with its motivating case and its negotiable/non-negotiable marking; a table at the end of the section (requirement / case / status) is fine if it makes it readable
  - "Where the list fights itself" — about 250 words
  - "What to give up on" — about 150 words, i.e. which requirements I should stop expecting any theory to meet
  - "Scorecard" — 150 words max, keep it terse, this is the part I can do myself: two lines each on (a) a straight parity-or-functional-equivalence view, (b) the view that only resources carrying the right kind of content count, (c) an integrationist view built out of access + reliability + transparency + endorsement, (d) the view that nothing is really extended and the whole thing is just a coupled system. Pass/fail per requirement in a table is fine, and dont explain the four views to me.
reasoning: |-
  Okay, the user is dealing with a recurring conflict in their psych journal methods review. They need a clear criterion for cognitive extension to determine when a resource is part of the cognitive system versus just an external tool. Let me start by understanding their main concerns.

  First, they want desiderata that are practical, not metaphysical. Each requirement must have a case justifying it and specify if it's non-negotiable. They provided several scenarios like Otto's notebook, the blind person's cane, phone contacts, generative AI, shared calendars, abacus use, untrusted notebooks, and a distant whiteboard. These cases need to be addressed in the criteria.

  Key points they emphasized: degrees of extension, the subject's first-person authority, boundary conditions to avoid over/under-extension, temporal dynamics for learning/decay, and handling errors/conflicts. Also, they want to know which desiderata conflict and which requirement is a major theory-killer.

  I need to structure the response as specified: purpose, desiderata, conflicts, what to give up, and a scorecard. For the desiderata, each point should link to a case. For example, Otto’s notebook illustrates functional equivalence, the phone contacts show reliability, the generative AI involves endorsement, and the shared calendar highlights access.

  The boundary conditions are crucial. Oxygen and culture shouldn't count, but reliable tools like canes might. The blind person's cane and glasses test if sensory tools are included. If the criterion includes them, is that a feature? Probably, since they’re integrated, but it shouldn’t extend to oxygen.

  Temporal dynamics matter for learning. The abacus user over twenty years shows progression from explicit use to internalization. The new notebook user versus the distrustful one shows different trust levels affecting integration.

  Error handling: conflicts between subject and resource, like arguing with an AI, test if it's part of cognition. If the subject overrules, does that mean it's not integrated? Or is occasional conflict acceptable?

  The subject's first-person authority is tricky. If someone says "that's the app talking," should that override the criterion? Cases like the generative AI where the user corrects it might show that endorsement is necessary but not sufficient.

  Conflicting desiderata might be functional equivalence versus endorsement. Otto’s notebook meets functional equivalence, but the phone contacts without reliability might not. Endorsement is hard in cases like the abacus where the user can’t articulate the process.

  The major theory-killer is probably the temporal requirement because many theories focus on snapshots, not skill progression.

  For the scorecard, functional equivalence might handle Otto but fail on phone contacts. Content-based views exclude canes and glasses. Integrationist views might struggle with distrustful notebooks. Coupled systems might not address boundaries well.

  Need to ensure each section meets the word count. The desiderata section is the longest, with clear cases for each point. Highlight non-negotiables like functional equivalence and reliability over endorsements. Mention that some requirements are preferences, like degrees of extension.

  Finally, in "what to give up," admit that temporal dynamics and degrees are hard, so reviewers should note progression stages instead of binary labels.
answer: |-
  ### What the Criterion Is For  
  The criterion’s purpose is operational: it must guide *explanatory attribution* in cognitive science. It determines whether a resource’s role in task performance warrants treating it as *constitutive of the subject’s cognitive system* (enabling explanations like "S remembered X") versus *merely a causal input* (requiring "S read X"). This entitles you to demand functional distinctions affecting modeling (e.g., prediction, intervention, error attribution) but **not** metaphysical claims without empirical traction. It does **not** require resolving debates about "true" cognition—only clarifying when resource integration licenses specific explanatory language.  

  ---

  ### The Desiderata  
  1. **Functional Equivalence (Non-negotiable)**  
     *Case:* Otto’s notebook vs. biological memory. If the notebook reliably provides timely information without re-verification, it functions equivalently to recall. *Why:* Explanatory parity avoids arbitrary biological chauvinism. Failure here collapses the criterion’s purpose.  

  2. **Reliable Access (Non-negotiable)**  
     *Case:* Your phone contacts vs. a guidebook. You access contacts instantly and habitually; the guidebook requires deliberate lookup. *Why:* Unreliable/inconsistent access (e.g., needing to search) breaks cognitive integration, making the resource environmental scaffolding.  

  3. **Transparency (Negotiable preference)**  
     *Case:* Glasses vs. cane. Both become transparent during use (no conscious monitoring). *Why:* Transparency signals automated integration. However, excluding opaque-but-integrated tools (e.g., novice abacus users) may be too strict.  

  4. **Endorsement Without Rechecking (Non-negotiable)**  
     *Case:* Otto’s trusted notebook vs. a distrusted one. If the user habitually accepts output without validation, it’s incorporated; distrust implies environmental use. *Why:* Rechecking treats the resource as separate; automatic endorsement treats it as a cognitive "given."  

  5. **Conflict Resolution & Error Attribution (Non-negotiable)**  
     *Case:* Arguing with a generative AI. If overruling the AI is rare and requires effort (like self-correction), it suggests integration. Frequent, easy dismissal treats it as external. *Why:* Shared responsibility for errors (e.g., blaming "my memory" for notebook errors) indicates systemic unity.  

  6. **Subject’s Authority (Negotiable preference)**  
     *Case:* "That’s the app talking" vs. internalized tools (e.g., expert abacus user). The subject’s report should be weighed but not decisive. *Why:* Expertise can be procedural/unconscious (e.g., touch-typing); overruling reports avoids introspective bias but risks ignoring agency.  

  7. **Anti-Explosion Boundary (Non-negotiable)**  
     *Case:* Oxygen vs. a cane. Oxygen is a background condition, not a task-specific resource. *Why:* Cognition depends on oxygen, but it lacks task-oriented functional specificity. The criterion must exclude ubiquitous, non-targeted dependencies.  

  8. **Anti-Isolation Boundary (Non-negotiable)**  
     *Case:* A whiteboard across the room. If unreadable, it’s merely environmental; if constantly referenced, it’s scaffolding. *Why:* Over-strictness invalidates real extended cases (e.g., Otto). The cane must qualify to avoid neurocentrism.  

  9. **Temporal Dynamics (Non-negotiable)**  
     *Case:* Learning an abacus vs. decades of use. The criterion must describe *progression* (e.g., from explicit checking to fluency). *Why:* Skill acquisition/decay (e.g., distrustful notebook users) requires tracking integration/decoupling over time.  

  10. **Degree-Admissibility (Negotiable preference)**  
      *Case:* Shared calendar with unreliable inputs. Integration isn’t binary; resources can be partially extended (e.g., "S’s recall depends moderately on the calendar"). *Why:* Forces reviewers to specify *how* integrated a resource is, avoiding false dichotomies.  

  | Requirement                | Case Illustrating Need          | Status               |  
  |----------------------------|---------------------------------|----------------------|  
  | Functional Equivalence     | Otto’s notebook vs. recall      | Non-negotiable       |  
  | Reliable Access            | Phone contacts vs. guidebook    | Non-negotiable       |  
  | Transparency               | Glasses vs. cane                | Negotiable           |  
  | Endorsement Without Recheck| Distrusted notebook             | Non-negotiable       |  
  | Conflict Resolution        | Arguing with AI                 | Non-negotiable       |  
  | Subject’s Authority        | “That’s the app talking”        | Negotiable           |  
  | Anti-Explosion Boundary    | Oxygen vs. cane                 | Non-negotiable       |  
  | Anti-Isolation Boundary    | Unreadable whiteboard           | Non-negotiable       |  
  | Temporal Dynamics          | Abacus learner vs. expert       | Non-negotiable       |  
  | Degree-Admissibility       | Shared calendar reliability     | Negotiable           |  

  ---

  ### Where the List Fights Itself  
  **Conflict 1:** *Functional Equivalence vs. Subject’s Authority.* Otto’s notebook meets functional equivalence, but if Otto denies it’s "his memory," authority clashes with parity. **Conflict 2:** *Transparency vs. Temporal Dynamics.* A novice abacus user monitors moves consciously (opaque), but after 20 years, it’s transparent. Demanding transparency ignores learning. **Conflict 3:** *Degree-Admissibility vs. Endorsement.* A partially trusted resource (e.g., generative AI corrected 15% of the time) satisfies degrees but violates strict endorsement. Forcing a binary choice here misrepresents real-world use. These tensions reveal that no criterion can fully satisfy all desiderata simultaneously without trade-offs.  

  ---

  ### What to Give Up On  
  Abandon the expectation that **Subject’s Authority** decisively settles cases—introspection often misreports procedural integration (e.g., “I don’t use the abacus; I just *know*”). Similarly, treat **Transparency** as heuristic, not necessary: tools like glasses are cognitive extensions even when noticed. Finally, accept that **Degree-Admissibility** requires pragmatic compromise; demand reviewers specify *how* integrated a resource is (e.g., “highly extended” or “peripherally scaffolded”) rather than forcing yes/no labels in middling cases.  

  ---

  ### Scorecard  
  *(✓ = Satisfies, ✗ = Fails, ~ = Partially)*  

  | Requirement                | (a) Parity/Functional Equiv. | (b) Content-Based    | (c) Integrationist   | (d) Coupled System   |  
  |----------------------------|-------------------------------|----------------------|----------------------|----------------------|  
  | Functional Equivalence     | ✓                             | ✗ (excludes canes)  | ✓                    | ✗ (denies "cognition") |  
  | Reliable Access            | ~ (vague on reliability)      | ✓                    | ✓                    | ✓                    |  
  | Endorsement                | ✗                             | ~                    | ✓                    | ✗                    |  
  | Conflict Resolution        | ✗                             | ✗                    | ~                    | ✓ (but external)     |  
  | Anti-Explosion Boundary    | ✗ (includes oxygen)           | ✓                    | ~                    | ✗ (includes all)     |  
  | Anti-Isolation Boundary    | ✓                             | ✗ (excludes canes)  | ✓                    | ✗ (includes all)     |  
  | Temporal Dynamics          | ✗ (snapshots only)            | ✗                    | ~                    | ✓                    |  
  | **Major Theory-Killer**    | **Temporal Dynamics** (fails a,c,d) | **Anti-Isolation** (fails b) | **Conflict Resolution** (fails c,d) | **Functional Equivalence** (fails d) |  

  **Key Theory Weaknesses:**  
  - **(a) Functional Equivalence:** Fails endorsement, boundaries, and temporal dynamics.  
  - **(b) Content-Based:** Excludes non-representational tools (canes), violating anti-isolation.  
  - **(c) Integrationist:** Struggles with conflict cases (e.g., arguing AI).  
  - **(d) Coupled System:** Fails functional equivalence (denies "cognition" to externals).  
  **Press reviewers hardest on Temporal Dynamics**—most theories (including integrationism) handle it poorly, yet it’s critical for developmental studies.
