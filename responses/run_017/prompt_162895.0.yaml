    This student is partially correct: if you play infinitely many times, then by the law of large numbers for independent identically distributed random variables with infinite mean, the average will diverge to infinity. But the timescale is absurd: you would need to play more times than there are atoms in the universe to see the average start to grow large. So in any practical sense, the long-run argument doesn't save the expectation.

  The question to end on to check understanding:

    "Suppose a new game: you flip a coin until tails. If you get k heads, you win 10^k dollars. How much would you pay to play this game? And why? (Assume the casino has unlimited funds and you have log utility over money.)"

