    - "The whole thing shows rational choice theory has been refuted and mathematics can't be trusted with money": We don't want to go that far. We want to say that the theory has limitations and that we must be cautious when applying it to extreme gambles.

  The student who says: "expected value is the long-run average, so infinite expected value means that if I keep playing I will eventually be rich."

    Correction: For nonnegative payoffs with infinite mean, the strong law of large numbers does not apply. In fact, the long-run average may not converge to the expectation (which is infinite). It may converge to a finite value or diverge to infinity. In the St. Petersburg game, it is known that the average winnings after n games grows like log2(n) (if I recall correctly). So after n games, the total winnings are about n * (log2(n))? Actually, the expected winnings per game are infinite, but the actual average grows very slowly.

    Your applied-probability friend is roughly right: the total worth of n plays of the St. Petersburg game grows as n * log2(n). So the worth per play is log2(n). For n=100, log2(100)≈6.6, so the average per play is about 6.6. This is because the game pays significantly only when there are long runs of heads, which are rare.

