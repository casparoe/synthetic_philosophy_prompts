      - Then EU = sum_{k=1}^∞ (1/2^k) * ln(10^{10^k}) = sum_{k=1}^∞ (1/2^k) * (10^k * ln(10)) = ln(10) * sum_{k=1}^∞ (10/2)^k = ln(10) * sum_{k=1}^∞ 5^k, which diverges.
      - So they should say: now the expected utility is infinite, so I would pay any finite amount.

    But we might not have time for the second part. So just the first part: the payout 10^k. We want them to compute the EU and the certainty equivalent. If they can do that, they understand the mechanics. But to see if they grasp the tail issue, we can ask: "But note that half the time you win only $10, and the chance of winning $1000 or more is only 1/8. Does that make you want to pay less than $100?" We want them to say: "Under expected utility, I should pay $100 because it accounts for the diminishing marginal utility. But I might still feel uneasy because the expectation is driven by the tiny chance of winning an enormous amount." That shows they see the tension.

  Decline to explain:

    - The proof of the scaling result for n plays of the St. Petersburg game (we just state the result).
    - The distinction between the sum being infinite and merely approaching infinity (we'll say "infinite" without getting into the mathematics of divergence).
    - The technicalities of decision-making with unbounded utility (we mention that bounded utility is a solution but we won't prove why it's necessary).
    - The formal definition of the law of large numbers for random variables with infinite mean (we just state that the average grows very slowly).
    - The exact computation of the expected utility for the capped game (we can do one term and then state the result).

  We are being appropriately cautious.

  Revised plan with timing:

    0-5: Recap and setup.
    5-15: Capped game (double payouts, cap $1e6) -> EV=$21, log utility gives $15.
    15-20: Remove the cap -> infinite EV, but log utility gives $4. But note the tail dependence and the long-run average grows slowly (n*log2(n) for n plays).
    20-25: Break log utility with payout 2^(2^k) -> infinite EU even under log. 
    25-30: Discuss the implications: why expectation might be the wrong guide in these tail-dominated cases.
    30-40: Address misconceptions and Q&A. Specifically:
        - The long-run average point: corrected by the slow growth.
        - The casino solvency: we set it aside by considering an idealized casino, but even with finite caps the tail can dominate.
    40-45: The final question: "How much would you pay for a game that pays 10^k dollars for k heads?" and then the twist: "What if it pays 10^{10^k}?" We don't require computation, just reasoning.

  But note: we might run short on time. So we can skip the twist if needed.

  Final teaching plan:

    - 0-5: Recap and set the stage.
    - 5-15: Capped St. Petersburg (cap at $1e6, doubling payouts). Compute EV (about $21). Discuss: would you pay $21? Then compute under log utility (certainty equivalent about $15). Point: utility helps, but note that the $21 is driven by the 1-in-500,000 chance of $1M.
    - 15-20: Remove the cap. Now EV is infinite. Log utility gives $4. But note: the probability of winning more than $100 is only 1/64? (Actually, P(k>=7)=1/64) but the contribution to the expectation from the tail is huge. Also, the long-run average: if you play n times, your total winnings are about n * log2(n). For n=100, about 660 dollars total -> $6.60 per play. So you won't get rich quickly.
    - 20-25: New game: payout = 2^(2^k). Without cap, EV is infinite. Now under log utility: EU = sum_{k} (1/2^k)*ln(2^(2^k)) = sum_{k} (1/2^k)*(2^k * ln(2)) = ln(2)*sum_{k}1 -> infinite. So certainty equivalent is infinite. Would you pay $1000? $1e6? But the chance of winning more than $100 is 1/8? (P(k>=4)=1/8) and the chance of winning an astronomical amount is small. But the EU is infinite.
    - 25-30: Moral: The utility solution (log) fixed the original paradox but we broke it by making the payouts grow faster. So the problem is relocated, not solved. The expectation (whether of value or utility) can be dominated by extremely unlikely events, and then we might question whether it should guide our one-shot decision. We need other criteria for such extreme gambles.
    - 30-40: Address misconceptions:
          - "No real casino": we started with a finite casino and still had a substantial EV driven by a tail. Also, the idealized case shows the theoretical issue.
          - "Utility as a fudge": it's a rational way to account for diminishing marginal utility, but it doesn't solve all problems.
          - "Maximize the median": in the original game, the median is $2. That's one alternative, but we don't endorse it now, just note that there are other criteria.
          - "Utility settled it": we broke it.
          - "Refuted rational choice": no, but it shows limitations.
    - 40-45: Final question: "How much would you pay for a game that pays 10^k dollars for k heads (with log utility)?" Then: "What if it pays 10^{10^k}? Would you pay $1000 for that? Why or why not?" We want to hear them reason about the expected utility and the tail. Then we wrap up.

  This is a tight 45 minutes. We might have to cut the final question short, but it's important to check understanding.
answer: |-
  ### Teaching Plan: Relocating the Difficulty in the St. Petersburg Paradox  
  **Objective:** Show that expected utility (EU) relocates—but doesn't resolve—the core problem: expectation-based norms struggle when dominated by vanishingly improbable tail events. Convert "smug" practical objections into precise conceptual insights.  

  **Core Example:** A modified **Capped St. Petersburg Game** (house assets = **$1 million**). Payout for first tail on flip *k* is **min(4<sup>k</sup>, $1M)**.  
  - *Why this schedule?*  
    - **Doubling payouts (2<sup>k</sup>)** are too slow to challenge log utility later; **4<sup>k</sup>** grows faster but still yields finite EU.  
    - **$1M cap** is large enough that EV ($~25) feels nontrivial, small enough that students compute outcomes mentally (e.g., cap hit at *k=11* since 4<sup>11</sup> ≈ $4M).  
    - **No "doubly exponential" rigging:** We escalate to **4<sup>k</sup>** later (not 2<sup>2<sup>k</sup></sup>), ensuring the log-utility failure feels probing, not contrived.  

  ---

  ### Arc and Timing (45 min)  
  **Goals per segment:** What must land before moving on.  
  **Misconception map:** Integrated at relevant steps.  

  #### **0–8 min: Setup and Capped Game**  
  - **Recap (2 min):** "Last time: St. Petersburg EV=∞, Bernoulli fixed it with log utility. Today: Does that *solve* it, or *move* it?"  
  - **Capped game rules (3 min):**  
    - Flip coin until tails. Payout = min(4<sup>k</sup>, $1M) for first tail on flip *k*.  
    - House assets = $1M (cap visible; no "casino can’t pay" objection).  
  - **EV calculation (3 min):**  
    - EV = Σ [Pr(*k*) × payout(*k*)] = Σ<sub>*k*=1</sub><sup>10</sup> [(1/2<sup>k</sup>) × 4<sup>k</sup>] + (1/2<sup>10</sup>) × $1M ≈ $25.  
    - *Before moving on:* Students see EV is finite but driven by tails (e.g., 0.1% chance of $1M dominates 99.9% chance of ≤$262K).  

  > **Misconception addressed:** *"No real casino could pay, so it’s settled."*  
  > → **Precise thought:** Cap makes EV finite, but the *decision-weight problem remains*: Would you pay $25 when 99.9% of outcomes pay ≤$262K?  

  #### **8–18 min: EU in Capped Game vs. Uncapped**  
  - **Log EU in capped game (4 min):**  
    - *u*(*x*) = ln(*x*), background wealth *w* (e.g., $1000). Certainty equivalent ≈ $18.  
    - "EU lowers price, but still > median ($4). Why? Tail events dominate."  
  - **Remove cap (3 min):** Original St. Petersburg (payout=2<sup>k</sup>).  
    - EV = ∞. Log EU = Σ [(1/2<sup>k</sup>) × ln(2<sup>k</sup>)] = 2ln(2) ≈ $1.39 → finite CE (~$4).  
  - **Tail scrutiny (3 min):**  
    - "Probability you win >$1M? 1/2<sup>20</sup> ≈ 10<sup>−6</sup>. But without cap, this tiny chance *alone* contributes 10<sup>−6</sup> × ln(2<sup>20</sup>) ≈ 0.0000139 to EU. The *next* 20 flips add similar amount. Infinite sum!"  
    - *Before moving on:* Students see EU finite *mathematically* but feel uneasy—most mass in negligible-probability tails.  

  > **Misconception addressed:** *"EU settles it; no more paradox."*  
  > → **Precise thought:** EU tames infinity, but the norm still weights near-impossible outcomes heavily.  

  #### **18–25 min: Breaking Log Utility**  
  - **New payout: 4<sup>k</sup> (uncapped) (4 min):**  
    - EV = Σ [(1/2<sup>k</sup>) × 4<sup>k</sup>] = Σ 2<sup>k</sup> → ∞.  
    - Log EU = Σ [(1/2<sup>k</sup>) × ln(4<sup>k</sup>)] = ln(4) × Σ [*k*/2<sup>k</sup>] = 4ln(2) ≈ $2.77 → finite CE (~$16).  
  - **Faster escalation: 4<sup>k</sup> → still finite? (3 min):**  
    - "But what if payouts grow faster? Try *b<sup>k</sup>* for large *b*."  
  - **Break it: Payout = 4<sup>k<sup>2</sup></sup> (3 min):**  
    - EU = Σ [(1/2<sup>k</sup>) × ln(4<sup>k<sup>2</sup></sup>)] = ln(4) × Σ [*k<sup>2</sup>*/2<sup>k</sup>] → ∞ (since *k<sup>2</sup>*/2<sup>k</sup> decays slower than 1/*k*).  
    - "Log utility *also* gives ∞ EU. Certainty equivalent → ∞. Would you pay $1,000? Why/why not?"  

  > **Misconception addressed:** *"Utility is a psychological fudge; risk-aversion is irrational."*  
  > → **Precise thought:** EU isn’t arbitrary—it’s consistent math. But if extreme tails break it, maybe the *norm* (not psychology) is flawed.  

  #### **25–35 min: Long-Run Averages and Applied Insights**  
  - **Student claim: "Infinite EV = get rich in long run" (5 min):**  
    - **Clarify:** For nonnegative payoffs with ∞ mean, the strong law of large numbers *fails*. Sample averages don’t converge; they grow slowly.  
    - **Applied friend’s insight (corrected):**  
      - *n* independent plays: Total value ~ *n* log<sub>2</sub>(*n*) for original St. Petersburg.  
      - Per-play value ~ log<sub>2</sub>(*n*) → $6.60 for *n*=100, $20 for *n*=1e6.  
    - **Implication:** "∞ EV doesn’t mean ‘get rich quick.’ Even after 1M plays, average payout ≈ $20. Would you pay $25/play upfront?"  
  - **Place in session:** After uncapped EV discussion (18–25 min).  
    - *Before moving on:* Students see EV ∞ ≠ practical riches; underscores tension between math and intuition.  

  > **Misconception addressed:** *"Expected value = long-run average, so ∞ EV implies eventual riches."*  
  > → **Precise thought:** True asymptotically, but irrelevant for human timescales. Also, averages diverge slowly when means are infinite.  

  #### **35–42 min: Morals and Open Questions**  
  - **Three morals (4 min):**  
    1. **EU relocates, not resolves:** Tails dominate expectation even after utility transformation.  
    2. **Norms have domains:** Expectation-based rules struggle with one-shot, tail-driven gambles.  
    3. **Practical ≠ profound:** "Casinos can’t pay" dodges the *conceptual* problem: should negligible probabilities have huge weights?  
  - **One carryaway for first-years:** Moral #1 (utility relocates).  
  - **Final question to check understanding (3 min):**  
    - *"A game pays $e^{e^k}$ on first tail at flip k. Log utility gives ∞ EU. Should you pay $1,000? Why might you refuse even if 'rational'?"*  
    - **Genuine understanding:** "No. EU ∞ means ‘rational’ to pay any finite amount, but the chance of winning >$100 is minuscule. Maybe we should ignore extreme tails."  
    - **Rehearsed answer:** "EU says pay any finite amount, so yes."  

  #### **42–45 min: What We Decline to Resolve**  
  - **Explicitly defer:**  
    - Proofs of scaling laws (e.g., *n* log *n* growth).  
    - Formal distinction between "sum=∞" vs. "divergent."  
    - **Unbounded utility:** "Today, we saw log utility *can* be broken. To fix all cases, we might need bounded utility—but that’s grad-level."  
    - **Alternative norms (median, etc.):** "We’re not endorsing them; we’re asking if *expectation* deserves authority here."  
  - **No reading list:** Focus on internalizing the paradox’s relocation.  

  ---

  ### Why This Works  
  - **Single game thread:** Capped 4<sup>k</sup> → uncapped 4<sup>k</sup> → uncapped 4<sup>k<sup>2</sup></sup>. Escalation feels natural, not rigged.  
  - **Misconceptions transformed:** "Casinos can’t pay" → tail-weight problem; "EU settles it" → EU breaks under stress.  
  - **Log utility tested fairly:** 4<sup>k</sup> has finite EU; 4<sup>k<sup>2</sup></sup> breaks it without double exponentials.  
  - **Tail focus maintained:** From capped EV to uncapped EU to long-run averages.  

  **End on:** The unresolved tension—"If expectation weights near-zero-probability outcomes heavily, is it *right* for one-shot decisions?"
