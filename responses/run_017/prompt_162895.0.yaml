    - "There is nothing here because no real casino can pay": We addressed this by capping the payout and showing that the EV is still substantial ($21) and then by removing the cap and showing that the problem reappears in the idealized case. Also, when we break the log utility, we see that even with a finite casino (if we cap the new game) the expected utility might be very high but driven by a tail. So the problem is not just about the casino's solvency.

