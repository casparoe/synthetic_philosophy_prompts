  We are building a teaching plan for a 45-minute class that follows a lecture on the St. Petersburg paradox and Bernoulli's expected utility solution (with log utility). The goal is to show students that the utility solution relocates the difficulty rather than dissolving it, and to challenge the authority of expectation-based norms when the expectation is dominated by extremely low-probability, high-payoff events.

  Brainstorm of possible morals to end on:
  1. Utility must be bounded (to avoid St. Petersburg-type paradoxes in general).
  2. Expectation is the wrong summary statistic for one-shot decisions when the expectation is driven by tails.
  3. The norm of expected utility maximization was never meant to govern one-shot gambles against idealized counterparties (i.e., it's for repeated plays or with bounded utility).
  4. We need to consider other decision criteria (e.g., median, safety first) in such extreme cases.

  We choose moral #2 for the first-year students because:
  - It directly addresses the St. Petersburg setup and the students' prior lesson.
  - It is concrete and can be illustrated with the example we are going to use.
  - It is a point they can carry out: "In decisions where the expected value is dominated by extremely unlikely events, we might question whether expected value (or expected utility) is the right guide."

  However, we will also hint at the bounded utility idea without making it the main point, because it is more advanced and we don't have time to prove why bounded utility is necessary.

  The example: A capped St. Petersburg game. The casino has a finite cap on the payout, say $C. The game stops when either the coin comes up tails or the payout would exceed C. We need to choose C and the payout schedule.

