  ### Analysis of the Friend's Rule

  The friend's verdicts across the five cases suggest a consistent decision rule based on expected utility calculations, incorporating both the instrumental value of potentially affecting the outcome and, implicitly, a "civic integrity" component. The rule appears to be:

  **Rule 1: Expected Utility with Civic Integrity**  
  Vote if:  
  \[
  P \times B + I > C
  \]  
  where:  
  - \(P\) = probability your vote is decisive (i.e., breaks a tie).  
  - \(B\) = total welfare difference (in dollars) between the better and worse outcomes.  
  - \(I\) = "integrity factor" (negative when voting legitimizes a fraudulent process; 0 otherwise).  
  - \(C\) = cost of voting (time, money, opportunity cost).  

  ### Application to Given Cases:
  1. **National Election (even polls):**  
     \(P \approx 10^{-7}\), \(B = 300 \times 90 \times 10^6 = 27 \times 10^9\) (assuming $300/head), so \(P \times B \approx 27\).  
     \(C \approx 20\) (15 min walk). \(I = 0\) (fair election).  
     \(27 > 20\) → **Vote (not close)**.  

  2. **Same Election, Varied Cost:**  
     - At \(C = 400 + 640 = 1040\) (assuming day of leave ≈ $640):  
       \(27 > 1040\)? No, but verdict is **yes**. Rule 1 fails here unless \(I > 0\) is introduced.  
       *Inference*: Civic duty or sincerity premium \(D\) may exist. Revised rule below.  

  3. **Water-District Election:**  
     \(P \approx 0.02\) (based on historical margins), \(B \approx 20 \times 10^6\) (10% of budget × 10 years), so \(P \times B \approx 400,000\).  
     \(C \approx 13.33\) (10 min walk). \(I = 0\).  
     \(400,000 > 13.33\) → **Vote (vastly stronger than case 1)**.  

  4. **Settled Election (fraudulent):**  
     \(P \times B \approx 0\) (vote won’t affect outcome).  
     \(I < 0\) (voting endorses fraud; e.g., \(I = -L, L>0\)).  
     \(0 - L < C\) (even if \(C \approx 0\)) → **Do not vote (worse than staying home)**.  

  5. **Uninformed Bond Vote:**  
     Expected welfare impact = \(P_{\text{bond}} \times B_{\text{bond}} \times (2q - 1)\), where \(q\) = probability of correct vote.  
     Uninformed (\(q = 0.5\)): impact = 0.  
     \(C_{\text{marking}} \approx 0\), but voting without view adds noise → **Leave blank** (no net benefit).  

  ### Alternative Rule Fitting All Cases:
  **Rule 2: Expected Utility with Civic Duty and Integrity**  
  Vote if:  
  \[
  P \times B + D + I > C
  \]  
  where \(D\) = "civic duty" benefit (\(D > 0\) if voting sincerely in a fair election; 0 otherwise).  
