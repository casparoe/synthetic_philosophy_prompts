prompt: |-
  I sit on the three-person category-review panel of a large peer-to-peer marketplace where ordinary users sell goods, services and time to one another. We rule on roughly forty requests a year to open a new category of exchange — people writing in to ask whether they may sell something that our terms currently exclude — and we also periodically re-review categories we already host. The decisions are frequent and consequential: a wrong call in one direction produces a news cycle about what we enable, and in the other direction it shuts down exchanges that were harmless and that users have built routines around. Constraints: two weeks from intake to decision, no counsel assigned to individual cases, a three-person panel with no shared theoretical vocabulary, and a ruling that has to be defensible afterwards in a short public note to users. Our users are spread across many jurisdictions, so the question is never only what is lawful where; we are regularly asked to permit things that are legal somewhere and still feel like they should not be for sale, and we need a principled way to say so. Our options are also not exhausted by allow and ban: we can set price ceilings or floors, restrict who may sell or buy, require a cooling-off period with an unconditional seller right of withdrawal, forbid resale or brokering, cap how much any one person may sell in a year, require disclosure to affected third parties, or route the transaction through the platform instead of letting the parties contract directly.

  Please write us a decision procedure we can actually run on a request: the questions in order, what would count as a sufficient answer to each, where the procedure terminates in a refusal, where it terminates in permission conditioned on a named lever, and where it must stop and hand the question back to us because the disagreement is about values rather than facts. Ground it in the distinctions the philosophical literature on repugnant and noxious markets actually draws — I need the distinctions, not a reading list, and no citations. Two requirements. First, the procedure has to separate the question whether the underlying good may be traded at all from the question of the terms on which it may be traded, and tell us which lever to reach for when it is the terms that are doing the damage. Second, it has to flag the cases where our own aversion is evidence of something that matters and the cases where it is only unfamiliarity.

  Then run it on three live matters. One: users selling their place in a physical queue — many hours of waiting — for a limited-run sneaker release, where most buyers are resellers operating at scale. Two: users selling their place in the queue for a public comment slot at a city council hearing, where the city allocates slots for free, one per person, in order. Three: a category we already host and take a fee from, in which people pay others to attend a funeral, wedding or religious service as a guest or mourner. For the third, assume the procedure may be telling us to shut down something that currently works and that users rely on, and tell us how much of its answer survives that.

  Give us a committed response: definite rulings on all three with your reasons, including at least one ruling you expect us to dislike, a statement of which of our questions it cannot settle for us, and an honest account of where this procedure will misfire.
reasoning: |-
  Hmm, the user is part of a three-person panel that reviews category requests for a peer-to-peer marketplace. They need a decision procedure that's grounded in philosophical distinctions about repugnant markets, without citations. The procedure must separate whether a good can be traded from the terms of trade, and distinguish between genuine aversion and unfamiliarity. They also want it applied to three cases: queue-selling for sneakers, queue-selling for city council comments, and paid funeral/wedding attendees.

  First, I need to recall the philosophical distinctions. The key ones include: intrinsic wrongness of commodification (like selling votes), harm/exploitation (undue pressure or vulnerable sellers), misallocation (diverting essential goods to wealthy buyers), corruption of meaning (turning sacred acts into transactions), and distributive effects (reinforcing inequality). Also, the difference between repugnance from unfamiliarity versus inherent wrongness. The procedure should start with permissibility, then move to terms if needed, and finally check if the aversion is just unfamiliarity.

  For the decision procedure, I'll structure it as a flowchart with questions. Start with Q1: Is there intrinsic commodification? If yes, ban. If no, go to Q2: Are there significant harms like exploitation? If yes, then Q3: Can it be mitigated with levers? If not, ban. If mitigatable, apply specific levers. If no harms, then Q4: Is the aversion likely due to unfamiliarity? If yes, allow; if no, it might be a values conflict that the panel must decide.

  Now, applying this to the cases. 

  First case: selling queue spots for sneakers. Intrinsic commodification? Probably not—waiting time isn't inherently sacred. Harms? Scalpers operating at scale could lead to misallocation (sneakers going to resellers instead of fans) and maybe exploitation if sellers are desperate. But it's not severe harm. Levers could help, like price ceilings or limiting quantity. Also, the aversion might be unfamiliarity with queue-selling. So, allow with restrictions.

  Second case: selling city council comment spots. Intrinsic commodification? Yes, because it's about democratic participation. Turning a public voice into a commodity corrupts its meaning. Even if legal, it undermines civic equality. So, immediate ban under Q1.

  Third case: paid funeral attendees. Intrinsic commodification? Some might argue it corrupts mourning, but it's not clear-cut. Harms? Possible exploitation of vulnerable sellers? Or misallocation? But the sellers are offering a service, not a sacred role. The aversion is likely unfamiliarity. Since it's already operating, the procedure says allow, but with levers like requiring disclosure to avoid deception. The panel might dislike this because they feel it's repugnant, but the procedure flags it as unfamiliarity.

  Where the procedure misfires: It might not handle cultural differences well, or cases where harm is subtle. Also, when values conflict deeply within the panel, it kicks back to them. For the paid attendees, the answer survives the fact that it's operational: the ruling is to keep it with minor conditions, based on the analysis.

  The user wants a committed response, so I need to be definitive. One ruling they might dislike is allowing paid funeral attendees, arguing that the repugnance is due to unfamiliarity. Also, for city council, a ban even though it's legal in some places. The sneakers case gets restrictions but is allowed. The procedure can't settle values disputes; it flags them for panel judgment. Misfires occur when harms are non-obvious or cultural contexts vary.
answer: |-
  Here is a decision procedure grounded in philosophical distinctions about repugnant/noisome markets, designed for operational use within your constraints, followed by committed rulings on your three cases:

  ### Decision Procedure: Category Review Protocol
  **(Run sequentially; terminate at any "No" or "Conflict" outcome)**

  1.  **Q1: Intrinsic Commodification?**  
      *   *Question:* Does this transaction treat as a *fungible commodity* something that is *inherently non-fungible* or whose commodification *fundamentally corrupts its meaning or value* in human life (e.g., votes, organs, profound personal relationships, core civic duties)?
      *   *Sufficient Answer:* "Yes" requires clear articulation of the *intrinsic* corruption (e.g., "Selling this converts a sacred act of mourning into a paid service, destroying its essence").
      *   *Outcome:*
          *   **Yes → BAN.** (No levers can fix intrinsic wrongness).
          *   **No/Unclear → Proceed to Q2.**

  2.  **Q2: Significant Harm/Exploitation Risk?**  
      *   *Question:* Does the transaction create a *high risk* of (a) severe physical/psychological harm, (b) *undue* exploitation of vulnerability (economic desperation, emotional distress, lack of alternatives), or (c) significant negative externalities (e.g., public health risks, systemic market failure)?
      *   *Sufficient Answer:* "Yes" requires identification of *specific, probable* harm(s) and the *mechanism* by which the transaction causes them (e.g., "Sellers in this category are likely coerced by poverty into accepting dangerous conditions").
      *   *Outcome:*
          *   **Yes → Proceed to Q3.**
          *   **No → Proceed to Q4.**

  3.  **Q3: Mitigatable via Levers?**  
      *   *Question:* Can the harm/exploitation identified in Q2 be *effectively reduced to an acceptable level* using one or more available levers (price caps/floors, participant restrictions, cooling-off, volume caps, disclosure, platform routing, etc.)?
      *   *Sufficient Answer:* "Yes" requires a specific lever(s) and a plausible argument for its efficacy against the *specific* harm mechanism (e.g., "A price floor prevents race-to-the-bottom exploitation of desperate sellers").
      *   *Outcome:*
          *   **Yes → ALLOW WITH SPECIFIC LEVERS.** (Implement the proposed lever(s)).
          *   **No → BAN.** (Harm is inherent and unmitigatable).
          *   **Conflict (Panel disagrees on efficacy/acceptability) → RETURN TO PANEL.** (Values conflict on risk tolerance or lever efficacy).

  4.  **Q4: Repugnance Driven by Unfamiliarity?**  
      *   *Question:* Is the primary objection to this transaction likely rooted in *mere unfamiliarity* or cultural bias, rather than the distinctions in Q1-Q3 (intrinsic wrongness, harm, exploitation)? Does evidence suggest it functions *benignly* in contexts where it *is* familiar (e.g., paid pallbearers historically)?
      *   *Sufficient Answer:* "Likely Unfamiliarity" requires comparison to similar accepted practices or evidence of low harm where practiced. "Likely Meaningful Repugnance" requires linking the discomfort back to Q1-style concerns or demonstrable social harm not captured in Q2.
      *   *Outcome:*
          *   **Likely Unfamiliarity → ALLOW (Potentially with light monitoring/transparency).**
          *   **Likely Meaningful Repugnance → Proceed to Q5.**
          *   **Uncertain/Conflict → RETURN TO PANEL.** (Values conflict on the nature/significance of the aversion).

  5.  **Q5: Critical Social Function Undermined?**  
      *   *Question:* Would allowing this market *significantly undermine* a *critical non-market social institution or public good* (e.g., fair democratic process, equitable access to essential but scarce opportunities, non-commercialized community bonds)?
      *   *Sufficient Answer:* "Yes" requires showing *how* the market directly damages the institution's core function (e.g., "Selling access to public comment replaces civic participation with plutocracy").
      *   *Outcome:*
          *   **Yes → BAN.** (Preserving the institution outweighs individual exchange freedom).
          *   **No → ALLOW (Potentially with light monitoring/transparency).**
          *   **Conflict → RETURN TO PANEL.** (Values conflict on the institution's importance or the degree of harm).

  **Key Distinctions Employed:**
  *   **Intrinsic vs. Instrumental Wrongness:** Separates things wrong *to sell* from things made wrong *by how* they are sold (Q1 vs Q2/Q3).
  *   **Harm/Exploitation vs. Mere Disgust:** Focuses on tangible negative consequences and vulnerability, filtering out reactions based only on novelty or cultural difference (Q2, Q4).
  *   **Commodification vs. Corruption:** Distinguishes turning *anything* into a good (ubiquitous) from corrupting the *essential meaning or function* of something specific (Q1, Q5).
  *   **Market Failure vs. Social Institution Protection:** Separates inefficiencies within the market (potentially fixable) from damage to vital non-market structures (Q2 vs Q5).

  ### Rulings on Live Matters

  1.  **Selling Queue Spots for Sneaker Releases:**
      *   **Q1 (Intrinsic?):** No. Waiting time is fungible labor/time. No inherent corruption.
      *   **Q2 (Harm/Exploitation?):** **Yes.** High risk of **misallocation** (scalpers dominate, genuine fans priced out) and **minor exploitation** (desperate individuals selling time cheaply to professional resellers).
      *   **Q3 (Mitigatable?):** **Yes.** Levers target the harm mechanisms:
          *   *Harm:* Misallocation to resellers. *Lever:* **Cap transactions per seller/year** (e.g., 5) to prevent professionalization/scaling. *Why:* Ensures spots primarily go to end-users, preserving access.
          *   *Harm:* Exploitative low prices. *Lever:* **Price Floor** (e.g., min 75% of sneaker MSRP). *Why:* Prevents race-to-the-bottom on wages for waiting, ensures sellers value their time reasonably.
      *   **Ruling: ALLOW WITH LEVERS (Quantity Cap per Seller/Year, Price Floor).** *Reason:* Harms are instrumental (caused by scale/lopsided market power), not intrinsic, and are effectively mitigated.

  2.  **Selling Queue Spots for City Council Public Comment:**
      *   **Q1 (Intrinsic?):** **Yes.** Public comment in a democratic forum is a *civic right and duty*. Allocating access by queuing embodies principles of equality and equal opportunity to participate. Selling this slot commodifies and corrupts the *core democratic function* of ensuring diverse citizen voices inform policy. It replaces civic equality with plutocracy.
      *   **Outcome:** **BAN.** *Reason:* Intrinsic corruption of a fundamental democratic process (Q1). Levers cannot fix this; a "fairly brokered" comment slot still undermines the principle that civic voice should not be bought. Survival: This ruling survives unchanged even if legal in some jurisdictions; the wrongness stems from undermining a core public good, not illegality.

  3.  **Selling Attendance as Guest/Mourner at Funerals/Weddings:**
      *   **Q1 (Intrinsic?):** Conflict/Unclear. While deeply personal, the *act of attendance* itself isn't universally deemed *inherently* non-commodifiable like a vote or organ. Paid pallbearers/keeners exist historically. **Proceed to Q2.**
      *   **Q2 (Harm/Exploitation?):** **Yes.** Risk of **corruption of meaning** (if deception is involved, e.g., mourner pretending to be a friend) and **emotional harm/exploitation** (buyers potentially exploiting sellers' emotional need for validation; sellers potentially exploiting buyers' grief/loneliness for profit). Risk of **harm to third parties** (deceived family members).
      *   **Q3 (Mitigatable?):** **Yes.**
          *   *Harm:* Deception/Corruption of Meaning. *Lever:* **Mandatory Disclosure** (Seller must disclose paid status to the event host/family). *Why:* Preserves authenticity and prevents fraud, mitigating the corruption.
          *   *Harm:* Emotional Exploitation. *Lever:* **Cooling-Off Period + Unconditional Seller Withdrawal Right** (e.g., 24hrs). *Why:* Protects vulnerable sellers (potentially lonely or financially desperate) from impulsive commitments.
      *   **Q4 (Unfamiliarity?):** **Likely Significant Driver.** Paid attendance seems bizarre primarily because it's novel in many cultures, not because it inherently causes widespread harm like organ selling.
      *   **Ruling: ALLOW WITH LEVERS (Mandatory Disclosure to Host/Family, Cooling-Off Period/Withdrawal Right).** *Reason:* Harms are real but manageable through transparency and protection against impulsive commitments (Q2/Q3). Much aversion is likely unfamiliarity (Q4). No critical social institution is undermined (Q5).
      *   **Survival:** This answer survives the fact the category already exists. The levers (disclosure, withdrawal) address core potential harms without shutting down a service providing value (companionship, fulfilling quorum requirements) where sellers/buyers transact consensually *with transparency*. The procedure distinguishes between unfamiliar discomfort (insufficient for a ban) and intrinsic wrongness (absent here).

  **Definite Rulings Summary (Including the One You May Dislike):**
  1.  **Sneaker Queues: ALLOW** (With Quantity Cap & Price Floor).
  2.  **City Council Queues: BAN** (Intrinsic corruption of democracy).
  3.  **Paid Attendees: ALLOW** (With Disclosure & Cooling-Off) - *This is the ruling some panelists may dislike, as the practice feels deeply uncomfortable.*

  **Question the Procedure Cannot Settle:** The procedure **cannot resolve fundamental value conflicts** about:
  *   What constitutes "intrinsic commodification" or "corruption of meaning" (Q1, Q5). (e.g., Is paid attendance *always* a corruption of mourning, or only with deception?).
  *   The precise threshold of "acceptable risk" after applying levers (Q3).
  *   Whether discomfort is truly "mere unfamiliarity" or a signal of deeper harm inadequately captured (Q4).
  These require panel deliberation when flagged ("Return to Panel").

  **Where the Procedure Will Misfire:**
  1.  **Subtle Harms:** It may miss complex, diffuse, or long-term harms (e.g., cumulative erosion of community norms) that don't fit neatly into Q2's "specific, probable harm" framework.
  2.  **Cultural Specificity:** Distinguishing "unfamiliarity" from "meaningful repugnance" (Q4) is culturally contingent and prone to panel bias, especially concerning practices tied to minority cultures the panel knows less about.
  3.  **Unforeseen Lever Effects:** The efficacy of levers (Q3) is speculative. A lever might fail or create new perverse incentives (e.g., a price floor could inflate prices without improving seller welfare if demand is inelastic).
  4.  **"Critical Social Institution" Definition:** Judging what constitutes a "critical" institution and "significant" undermining (Q5) is inherently value-laden and contestable.
  5.  **Over-reliance on Predictability:** The procedure favors harms that are predictable and mechanistic. Novel markets might pose unpredictable risks it cannot assess.

  This procedure provides a structured, philosophically grounded path to defensible decisions within your constraints, explicitly separating permissibility from terms, and aversion from harm, while clearly flagging the points where your panel's judgment on values is essential.
