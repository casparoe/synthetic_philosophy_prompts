prompt: |-
  I'm a philosophy PhD student working in bioethics, and I'm drafting a chapter on how a public payer should decide what to cover — specifically, whether a scheme that insures treatments but not enhancements could be made to work, and what would have to be true of the therapy/enhancement distinction for it to bear that kind of institutional weight. Before I go further into the existing accounts I want the specification. So: write the desiderata that a theory of the therapy/enhancement distinction would have to satisfy in order to be adequate for this purpose — good enough to underwrite a coverage rule that is administrable, not arbitrary in the cases everyone antecedently agrees about, and not trivially gameable — and give the case or consideration behind each requirement. Two constraints on the list itself: it must not collapse restoring into improving, i.e. must not let the distinction degenerate into a difference in the magnitude of benefit, and it must not quietly redefine it as medical need, since that is the notion the coverage rule was supposed to be built out of. Where two requirements pull apart, state that as a result rather than papering over it: tell me which subset you suspect is jointly unsatisfiable, and say which single requirement does the most work in excluding otherwise attractive theories. Please also mark which requirements you take to be genuinely non-negotiable and which are really commitments of one camp dressed up as adequacy conditions. I have a suspicion that both the demand that the concept be value-free and descriptive, so that clinicians can apply it without moral contestation, and the demand that the distinction do real justificatory work in allocating resources, are such pseudo-desiderata, but argue it either way. A table is fine.

  The cases I keep tripping over are the familiar ones plus several I have not seen handled. Prevention — vaccines, statins, prophylactic surgery in people who would never have developed the condition — looks like enhancement on any species-typical-function view and is nevertheless the paradigm of reimbursable medicine. Aging presses from the other side, since senescence is statistically normal for the species, so such views seem to entail that sarcopenia or presbyopia are not medical matters at all. Continuous dimensions with no principled break (growth hormone for idiopathic short stature; cochlear implants that first restore and then exceed the typical range) raise the cutoff problem. There is also environment-relativity: stimulants for inattention that is partly an artifact of how a school day is structured, and the historical pathologizing of traits that were costly only within a particular social order. The cases I have not seen discussed are these. First, the set-point ratchet: suppose an intervention works by raising the level around which a homeostatic system regulates, so that after withdrawal the person sits below their pre-intervention baseline and the maintenance dose only returns them to the new set point. Is that dose therapy, and which baseline is authoritative — the pre-intervention individual, the current individual, or a population reference? Second, second-order interventions, which do little for you directly but change how well later interventions work on you, something along the lines of a plasticity or learning-rate enhancer; their value is entirely deferred and derivative, and I do not know what a coverage rule should say about them. Third, delegated-benefit interventions, where the benefit accrues to third parties rather than the patient — a drug that makes a parent less dispositionally short-tempered, say — which have a strong claim on a public payer but fit badly under restoring function in this patient. Fourth, prevalence inversion: if a deficient condition becomes nearly universal, statistical views appear to reclassify its treatment as enhancement, which looks like a reductio. So I want a list that tells me, for each requirement, which of these it is there to settle, and I especially want to know whether an adequate theory can be baseline-invariant, in the sense that its verdicts do not shift with the choice of reference class among species, age-and-sex-adjusted subpopulation, and the individual's own history, or whether instead it must argue for one of those as the correct baseline.

  A few last things. Keep the bulk of the answer on the criteria and their motivating cases; I only want a short scorecard at the end, a couple of lines each, for the Boorsian biostatistical and normal-function style of account, Wakefield's harmful-dysfunction analysis, Daniels-style normal-opportunity-range views, Savulescu-style welfarism, and the eliminativist position that the distinction should be dropped in favor of distributing by benefit and cost — I will do the scoring properly myself later. Do not cite anything or point me to literature; I have the reading list and would rather you spend the words on the requirements. Be explicit about your own confidence: tell me which desideratum on your list you are least sure belongs there, where your reasoning about the jointly unsatisfiable subset is most likely to fail, and which single argument or case would lead you to drop a requirement or to reorder the list. Please write in American English.
reasoning: |-
  Okay, the user is a philosophy PhD student in bioethics working on a chapter about public healthcare coverage decisions, specifically whether it's feasible to cover therapies but not enhancements. They need a list of desiderata (requirements) that a theory of the therapy/enhancement distinction must meet to be practical for policy use. 

  First, I need to unpack their core concerns. They want criteria that ensure the distinction isn't just about benefit magnitude or medical need (which would make it circular). They also list challenging cases: prevention (like vaccines), aging treatments, continuous traits (e.g., growth hormone), environment-dependent conditions, and novel cases like set-point ratchets or second-order enhancements. 

  The user explicitly rejects two common pseudo-desiderata: the idea that the distinction must be value-free (to avoid clinician disputes) and that it must directly justify resource allocation. I agree these are problematic – the first ignores that medicine inherently involves value judgments, while the second conflates descriptive classification with normative decisions. 

  Now, structuring the desiderata. The non-negotiable ones should prevent conceptual collapse: 
  - **Non-Reduction to Benefit Magnitude** is essential because otherwise the distinction vanishes into cost-benefit analysis. 
  - **Non-Identical to Medical Need** avoids circularity since need is what we're trying to define. 
  - **Non-Arbitrariness in Core Cases** is crucial for policy credibility – if vaccines get misclassified as enhancement, the theory fails. 

  The hard cases drive specific requirements: 
  - **Prevention Accommodation** handles vaccines by demanding they count as therapy despite not restoring function. 
  - **Aging Exclusion Resistance** blocks absurd conclusions like denying cataract surgery. 
  - **Cutoff Tolerance** acknowledges that some continua won't have sharp breaks but the theory must still guide policy. 
  - **Environmental Relativity Sensitivity** addresses how social context affects impairment. 
  - **Baseline Invariance Demand** tackles set-point ratchets by requiring consistent classification regardless of reference class (species/population/individual). 

  Novel cases add further layers: 
  - **Set-Point Ratchet Handling** explicitly governs maintenance doses. 
  - **Derivative Benefit Accommodation** covers second-order enhancements by allowing downstream benefits to count. 
  - **Third-Party Benefit Permissibility** permits interventions like mood stabilizers for parents if they indirectly restore function. 
  - **Prevalence Independence** prevents statistical absurdities (e.g., if myopia became universal, glasses wouldn't suddenly be "enhancement"). 

  I suspect tension between **Baseline Invariance** and **Set-Point Ratchet Handling** – the former wants fixed reference points, while the latter involves shifting baselines. Similarly, **Derivative Benefit Accommodation** might stretch "therapy" beyond recognition. The most exclusionary requirement is **Non-Arbitrariness in Core Cases** – it sinks biostatistical theories by misclassifying prevention and aging. 

  For the scorecard: 
  - **Boorse-style theories** fail hard on prevention/aging cases. 
  - **Wakefield's harmful dysfunction** struggles with environment-relativity (is infertility a dysfunction only in pronatalist societies?). 
  - **Daniels' opportunity-based view** handles social determinants well but risks collapsing into need. 
  - **Savulescu's welfarism** abandons the distinction entirely (violating non-reduction). 
  - **Eliminativism** sidesteps the problem but ignores institutional constraints. 

  My least confident item is **Third-Party Benefit Permissibility** – it might overextend "therapy." If a case emerged where third-party benefits clearly didn't restore patient function (e.g., cognitive enhancers for surgeons to reduce errors), I'd reconsider this requirement. 

  The user's deepest need seems to be avoiding policy incoherence while acknowledging real-world messiness. They're not just listing criteria but stress-testing whether any theory can hold under pressure from their novel cases – especially baseline dependence and derivative benefits.
answer: |-
  Here are the desiderata for a theory of the therapy/enhancement distinction to underpin a public coverage rule, structured by requirement, motivating case(s), and critical properties. Requirements marked **★** are non-negotiable for institutional viability; others reflect tensions inherent in the project.

  ### Core Desiderata Table
  | Requirement | Motivating Case(s) | Purpose | Non-Negotiable? |
  |-------------|---------------------|---------|------------------|
  | **1. Non-Reduction to Benefit Magnitude ★** | Growth hormone for idiopathic short stature; cochlear implants exceeding typical range | Prevents distinction collapsing into "how much improvement?" Ensures qualitative difference. | **Yes** |
  | **2. Non-Identical to Medical Need ★** | Coverage rule must be *built from* the distinction, not presuppose need | Avoids circularity; need must be defined *by* the theory. | **Yes** |
  | **3. Non-Arbitrariness in Core Cases ★** | Vaccines (prevention), cataract surgery (aging) | Must classify universally accepted therapies (e.g., vaccines) as therapy, not enhancement. | **Yes** |
  | **4. Prevention Accommodation** | Vaccines, prophylactic mastectomy in BRCA+ | Classifies prevention of disease in asymptomatic individuals as therapy. | No |
  | **5. Aging Exclusion Resistance** | Sarcopenia treatment, presbyopia correction | Avoids classifying age-related decline as "normal" and thus non-therapeutic. | No |
  | **6. Cutoff Tolerance** | Growth hormone for progressively severe short stature | Accepts non-arbitrary cutoffs on continua *if* justified by theory. | No |
  | **7. Environmental Relativity Sensitivity** | ADHD stimulants in rigid schooling; historical pathologizing (e.g., homosexuality) | Acknowledges social/environmental drivers of "dysfunction." | **Yes** (for anti-discrimination) |
  | **8. Set-Point Ratchet Handling** | Maintenance dose after intervention (e.g., hormone therapy) | Specifies authoritative baseline (pre-intervention individual vs. population). | **Yes** (for administrative clarity) |
  | **9. Derivative Benefit Accommodation** | Plasticity enhancers improving response to rehab | Allows interventions whose primary value is enabling *future* therapies. | No |
  | **10. Third-Party Benefit Permissibility** | Parental temper-regulating drugs benefiting children | Permits coverage if indirect benefit restores patient's *core function* (e.g., caregiving capacity). | No |
  | **11. Prevalence Independence ★** | Near-universal myopia: glasses remain therapy | Prevents statistical norms from reclassifying treatments as enhancements (reductio). | **Yes** |
  | **12. Baseline Invariance Demand** | Set-point ratchet; aging; prevalence inversion | Requires consistent verdicts across reference classes (species, subpopulation, individual history). | **Unclear** (likely tension point) |

  ---

  ### Tensions & Pseudo-Desiderata
  - **Key Tension:** **Baseline Invariance (12)** vs. **Set-Point Ratchet Handling (8)**. Baseline invariance demands fixed reference points, but set-point cases involve dynamic baselines. I suspect these are jointly unsatisfiable; a theory must prioritize one.  
  - **Pseudo-Desiderata Debate:**  
    - *Value-Free Application*: **Not required.** Clinicians already make value-laden judgments (e.g., disability severity). Insisting on value-freeness ignores that *all* medical classifications involve normative thresholds.  
    - *Direct Justificatory Work*: **Partially pseudo.** The distinction can *structure* resource allocation but cannot *justify* it alone (e.g., cost-effectiveness still matters). Treating it as sufficient justifier overburdens the concept.  

  ---

  ### Least Confident Requirement & Failure Points
  - **Least Confident:** **Third-Party Benefit Permissibility (10)**. Risks overextension (e.g., is "being employable" a core function?). A robust case of third-party benefit *without* restoring patient function (e.g., sedating agitated dementia patients solely for staff safety) might force its revision.  
  - **Most Likely Jointly Unsatisfiable:** **Baseline Invariance (12) + Prevention Accommodation (4) + Aging Exclusion Resistance (5)**. Prevention and aging resist species-typical baselines; invariance blocks contextual shifts. If forced to drop one, I’d abandon invariance.  
  - **Highest-Impact Requirement:** **Non-Arbitrariness in Core Cases (3)**. Excludes Boorse-style biostatistical theories (fails vaccines/aging) and Wakefield (fails prevention).  

  ---

  ### Theory Scorecard (Brief)
  | Theory                      | Fatal Flaw (Per Desiderata) |
  |-----------------------------|-----------------------------|
  | **Boorse (Biostatistical)** | Fails Prevention (4), Aging (5), Prevalence Inversion (11) |
  | **Wakefield (Harmful Dysfunction)** | Fails Prevention (4), Environmental Relativity (7) |
  | **Daniels (Normal Opportunity)** | Risks collapsing into Need (2); struggles with Set-Point (8) |
  | **Savulescu (Welfarism)**   | Reduces to Benefit Magnitude (violates 1 ★) |
  | **Eliminativism**           | Abandons distinction (violates institutional mandate) |

  ---

  ### Argument for Baseline Non-Invariance
  **The Set-Point Ratchet (8)** necessitates rejecting strict **Baseline Invariance (12)**. If an intervention (e.g., thyroid hormone) resets homeostasis, the *pre-intervention individual* is the only coherent baseline for classifying maintenance doses as therapeutic. Population baselines misclassify post-withdrawal states as "new normal." This requires accepting contextual baselines, undermining invariance. Prevalence inversion (11) reinforces this by showing statistical norms are unstable guides.
