answer: |-
  ### 1. **Brainstorm**  
  I considered three cruxes: (1) Whether grounding *requires* termination (challenging transitivity + irreflexivity), (2) Whether abstracta/necessities lie outside grounding’s domain (testing scope assumptions), and (3) Whether residue undermines the fundamentality/ungroundedness link. I chose (3) because it forces direct confrontation with the biconditional’s *substantive role*. (1) and (2) are important but can be deflected by rehearsing orthodoxy; residue uniquely exposes that "fundamental = ungrounded" isn’t a trivial truth but a *theoretical choice* (No Idlers) masquerading as definition. It compels students to interrogate what fundamentality *does*.

  ---

  ### 2. **The Question**  
  > **Fragmented Realms:**  
  > Suppose reality contains two disjoint domains. Domain A has grounding chains terminating in core ungrounded facts (e.g., fundamental physical facts). Domain B contains *residue*: ungrounded facts that ground nothing else (e.g., "The number 7 is prime"). These domains do not interact; no fact in A grounds/is grounded by any fact in B.  
  >   
  > **Question (25 marks):**  
  > In Fragmented Realms, is the residue in Domain B *fundamental*? Defend your answer. If you answer "no", explain what this implies about the standard claim that "x is fundamental iff x is ungrounded." If you answer "yes", explain whether this trivializes or distorts the concept of fundamentality. Your argument must engage with *why* metaphysicians might insist residue cannot exist (No Idlers) or why they might allow it.  

  *(158 words)*  

  ---

  ### 3. **What It Is Testing**  
  The core insight: The biconditional **"fundamental iff ungrounded" is not a definition but a substantive commitment to *No Idlers***. Students must see that residue (ungrounded but explanatorily inert) forces a *choice*: Reject residue (preserving the biconditional by fiat) or accept it (forcing fundamentality’s redefinition as core membership). Merely restating that "fundamental things are ungrounded" misses that *this very claim assumes there are no idle ungrounded things*. The question tests whether students recognize that the biconditional *does theoretical work* by excluding certain structures.  

  *(98 words)*  

  ---

  ### 4. **Model Answer**  
  In Fragmented Realms, the residue in Domain B is **not fundamental**. This reveals that the standard biconditional ("x is fundamental iff x is ungrounded") is not a neutral definition but relies on the substantive assumption that *there is no residue* (No Idlers).  

  **Why residue isn’t fundamental**: Fundamentality is not merely the *absence* of grounds but an *explanatory role*: the core ungrounded facts are those upon which all else asymmetrically depends. Residue, by stipulation, plays no such role. "The number 7 is prime" may be ungrounded, but if nothing metaphysically depends on it and it depends on nothing, it is inert within the structure of metaphysical explanation. Calling it "fundamental" stretches the term beyond usefulness: fundamentality marks the *basis* of reality, but residue is a metaphysical dead end.  

  **How this challenges the biconditional**: The biconditional seems plausible only if we *assume* No Idlers—i.e., that all ungrounded items are cores terminating chains. Fragmented Realms shows the biconditional *fails* without this assumption: here, ungrounded items (residue) exist but are non-fundamental. The biconditional thus isn’t a definition but a *consequence* of No Idlers. Students who treat it as definitional will erroneously call residue "fundamental," ignoring that fundamentality’s theoretical function (marking explanatory ultimacy) is lost.  

  **Why No Idlers isn’t trivial**: One might object that residue is impossible—grounding *must* "cover" all reality. But this needs argument:  
  - If grounding relates only contingent concrete facts (as some hold), necessary truths (like math) may be residue.  
  - If grounding facts are themselves ungrounded (as per "grounding essentialism"), they risk being residue unless they ground further facts.  
  - Infinite descent avoids residue but abandons fundamentality altogether.  

  No Idlers excludes these possibilities, ensuring all ungrounded items are cores. But this is a *choice* to prioritize a "complete" explanatory hierarchy. Rejecting residue lets us retain "fundamental = ungrounded," but only by *redefining* fundamentality as *mere* ungroundedness—a hollow victory, as residue’s "fundamentality" does no work. Better to define fundamentality as **core membership**: ungrounded *and* grounding other facts. This preserves fundamentality’s explanatory role and admits residue as ungrounded non-fundamentalia, forcing us to argue *why* reality lacks residue.  

  **Conclusion**: Fragmented Realms shows the biconditional is hostage to No Idlers. Calling residue "non-fundamental" isn’t verbal revisionism; it rescues fundamentality from vacuity. The takeaway: Metaphysicians who equate fundamentality with ungroundedness aren’t defining a term—they’re betting reality has no idle parts.  

  *(647 words)*  

  ---

  ### 5. **Marking Scheme** (25 marks total)  
  1. **Clear verdict on residue** (4 marks):  
     - *Lose all 4*: Fails to state whether residue is fundamental.  
  2. **Explanation of fundamentality’s explanatory role** (6 marks):  
     - *Lose all 6*: Treats fundamentality as *only* "ungrounded" without reference to core/residue distinction.  
  3. **Identification of biconditional’s dependence on No Idlers** (9 marks):  
     - *Lose all 9*: Assumes biconditional is definitional without argument.  
  4. **Engagement with why No Idlers is substantive** (4 marks):  
     - *Lose all 4*: Does not mention possible counterexamples (abstracta, grounding facts, etc.).  
  5. **Coherence & synthesis** (2 marks):  
     - *Lose all 2*: Answer is disjointed or misses the "big picture" stakes.  

  ---

  ### 6. **Borderline B Answer**  
  > *"In Fragmented Realms, residue is fundamental because it is ungrounded. The definition of fundamentality is being ungrounded, as per the standard view. Domain B’s facts have no ground, so they are fundamental. While they don’t ground anything else, this doesn’t change their status—fundamentality just means lacking grounds. No Idlers might be desirable to avoid ‘useless’ fundamentals, but it isn’t required. The biconditional holds; residue is just a strange kind of fundamental thing."*  

  **Why B-grade?** Correctly applies the biconditional but misses the crux: It treats fundamentality as a *stipulative label* for "ungrounded," ignoring that the concept’s *explanatory purpose* (marking the bedrock of dependence) is undermined by residue. It notes No Idlers is optional but doesn’t see that rejecting it forces a *revision* of fundamentality’s meaning. Demonstrates vocabulary mastery but not philosophical insight.  

  *(120 words)*
