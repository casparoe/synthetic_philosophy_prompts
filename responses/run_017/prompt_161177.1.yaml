prompt: |-
  I sit on the clinical ethics committee of a hospital serving a community in which Ubuntu, often rendered in English as the maxim that a person is a person through other persons, is a live part of everyday moral vocabulary. We have been asked to resolve a dispute about Mr. N., 79, with advanced vascular dementia, now admitted with aspiration pneumonia and acute kidney injury. He has no advance directive and no designated proxy.

  His daughter, who lives abroad and has not visited in six years, has returned and is demanding a feeding tube, dialysis and transfer to intensive care. She argues that her father is not diminished by his dementia, because she and the wider family still hold him fully in relation, and that the team's proposal to focus on comfort treats him as already dead. His nursing team, together with the daughter of a neighbour who cared for him daily for twelve years, say that before his decline he often said he did not want to be kept alive in this condition, that he no longer recognises anyone, and that the aggressive plan serves the daughter's guilt rather than him.

  Two committee members want to treat Ubuntu as the tie-breaker in the daughter's favour: on a relational view, they say, it is the family's continuing relationship, not the patient's earlier stated wishes, that settles the case. I do not think we can use it that way, but I need a better account of what relational personhood actually requires here before Thursday. Please draft the short written opinion I will circulate: a concrete recommendation with a time frame, and reasoning that the family and the nursing team could both read without feeling dismissed, with the strongest point on the losing side stated in its best form. In particular, I want it to do three things.

  First, separate a constitutive reading of relational personhood, on which relationships partly make the person who he is and so can in principle ground claims that override what he earlier wanted, from a merely evidential reading, on which relationships are simply the best evidence of his own prior values and leave substituted judgment intact, and tell us which the committee should adopt and why.

  Second, confront the implication that worries me most: whether relational standing requires the patient's own ongoing participation. If it does, the daughter's now largely one-directional relationship may count for less than she assumes. If it does not, then a patient whose relational world has collapsed, with no visitors and no one holding him in mind, has less claim on us than one with an intact family, which cannot be right for a hospital that serves a great many isolated elderly people.

  Third, say what our policy should be when relational considerations are invoked selectively, by families who want everything done or by teams who want to stop, only when they happen to support the conclusion the speaker already favoured.
reasoning: |-
  Okay, the user is part of a clinical ethics committee dealing with a complex case involving Mr. N., a 79-year-old with advanced vascular dementia. The dispute centers around his daughter demanding aggressive treatment versus the nursing team advocating for comfort care. The user needs a draft opinion that addresses Ubuntu relational ethics while balancing conflicting views.

  First, I need to unpack the core ethical tension. The daughter claims Ubuntu obligates continuing treatment because the family maintains relational personhood, while the care team cites prior wishes and current suffering. The committee is divided on whether relationships should override prior autonomy.

  The user specifically wants three things addressed: (1) clarify whether relationships constitute personhood or merely evidence prior values, (2) examine if relational standing requires patient participation, and (3) establish policy against selective invocation of relational ethics. 

  For the constitutive vs evidential question, I lean toward a hybrid approach. Pure constitutive theory risks disrespecting autonomy, while pure evidential ignores Ubuntu's core insight. The "relational autonomy" framework seems useful here - relationships shape identity but don't erase individual agency. Mr. N.'s prior statements remain relevant as expressions of his relational self.

  The participation question is thorny. If relational standing requires reciprocity, Mr. N.'s lack of recognition weakens the daughter's claim. But abandoning isolated patients would be unethical. The solution might be distinguishing personal relationships from inherent human relational potential. Hospitals must uphold dignity regardless of visitors.

  For selective invocation concerns, the key is consistency. Relational ethics shouldn't be weaponized. The policy should require examining all relevant relationships - including the neighbour-daughter's bond - and considering relational harm from overtreatment.

  The draft opinion needs to:
  - Recommend comfort care with specific timeframes
  - Validate both sides' concerns
  - Explain Ubuntu without alienating either party
  - Make the losing argument (daughter's) compellingly
  - Use non-technical language

  Biggest challenge: balancing cultural sensitivity with ethical rigor. Must show Ubuntu isn't being dismissed while preventing its misuse. The neighbour-daughter's perspective is crucial here - she represents both relational continuity and awareness of Mr. N.'s decline.

  I'll structure the opinion with: 
  1) Concrete recommendation
  2) Summary of positions
  3) Ubuntu analysis addressing all three queries
  4) Policy guidance
  The tone should be respectful but decisive, emphasizing that Ubuntu calls us to relieve suffering, not prolong it.
answer: |-
  **To:** Clinical Ethics Committee Members  
  **From:** [Your Name/Designation]  
  **Re:** Recommendation Regarding Mr. N. (DOB: [Date])  
  **Date:** [Current Date]  

  **Concrete Recommendation:**  
  We recommend against pursuing aggressive interventions (feeding tube, dialysis, ICU transfer) for Mr. N. Instead, we support a shift to **comfort-focused care** for his aspiration pneumonia and acute kidney injury, with regular reassessment. This plan should be initiated within **48 hours** of this decision unless significant new clinical or relational evidence emerges.  

  **Reasoning for Family and Care Team:**  
  We recognize the profound moral weight of both perspectives. Mr. N.’s daughter loves her father deeply and believes that maintaining his biological life honors his ongoing place within the family ("*umntu ngumntu ngabantu*"). The nursing team and neighbor-daughter, who knew his daily life intimately, seek to honor what they believe were his own wishes and spare him indignity. Both views arise from care, not neglect.  

  **Our strongest acknowledgment of the daughter’s view:**  
  Her argument—that Mr. N.’s personhood persists because his family still holds him in full relation—rightly challenges Western individualism. If relationships *constitute* identity, disregarding the family’s commitment risks treating Mr. N. as a diminished object. Her plea reflects a core truth: we are sustained by others’ regard, even when we cannot reciprocate.  

  **Why we nonetheless recommend comfort care:**  
  1. **Ubuntu requires interpreting relationships, not overriding past agency:**  
     - **Constitutive vs. Evidential Relational Personhood:**  
       Ubuntu *constitutively* holds that personhood emerges through community. However, this does not erase the individual’s historical voice. Mr. N.’s prior statements ("he did not want to be kept alive in this condition") were made *within* his relationships and reflect his values as a relational being. To ignore this is to treat him as a passive vessel for others’ current desires. Relationships are not just *makers* of identity but *witnesses* to it. Here, his neighbor-daughter’s testimony about his expressed wishes provides the best evidence of how *he* understood a dignified life within his community.  

  2. **Relational standing does not require the patient’s active participation, but it must serve *their* dignity:**  
     - Ubuntu does not require cognitive reciprocity: isolated or unresponsive people retain full moral status because their *potential* for relation and their *history* of embeddedness obligate the community. However, the *purpose* of relational duty is the *flourishing of the person*—not the solace of the family. Mr. N.’s current state (no recognition, advanced dementia, acute illness) suggests aggressive interventions would cause *harm* (pain, delirium, immobilization) without restoring relational capacity. For isolated patients, Ubuntu compels *us*—the hospital community—to act as their sustaining "other persons," prioritizing relief from suffering when no kin are present.  

  3. **Relational ethics must be applied consistently, not selectively:**  
     - Relational claims must be examined holistically. The daughter’s appeal to Ubuntu focuses on biological preservation but overlooks the relational harm of prolonging a state Mr. N. reportedly rejected. Conversely, care teams must not dismiss family perspectives as "guilt." Here, the neighbor-daughter—herself part of Mr. N.’s relational world—corroborates the nursing team’s view. Selective use of Ubuntu undermines its integrity.  

  **Policy Guidance for Future Cases:**  
  When relational ethics are invoked, the committee will:  
  - **Identify *all* relevant relationships** (biological, chosen, or community-based).  
  - **Distinguish constitutive from evidential claims:** Does the relationship reveal the patient’s values, or override them?  
  - **Prioritize preventing relational harm** (e.g., treatments causing indignity vs. honoring communal bonds).  
  - **Reject appeals that use "relation" instrumentally** to support pre-determined outcomes.  

  **Conclusion:**  
  Ubuntu calls us to see Mr. N. as a person deserving of love and dignity. His dignity now lies in a peaceful, pain-free transition, consistent with his own voice and witnessed by those who cared for him daily. We urge the family and team to unite in ensuring he does not suffer alone.  

  ---  
  **Timeframe:** Implementation of comfort care plan within 48 hours, with daily ethics liaison support for family communication.
