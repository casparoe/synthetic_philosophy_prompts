prompt: |-
  I commission history documentaries for a public broadcaster: around a dozen pitches a week, and lately maybe a third of them are alternative-chronology or ancient-astronaut material — Atlantis pinned to a specific site off a sonar anomaly, megaliths attributed to visitors from elsewhere, or the claim that long stretches of the documented past were fabricated by later chroniclers, so that one well-known empire is really a duplicate of another. Each pitch has to be routed to one of three outputs — commission as history, commission with an on-screen contested-history framing, or commission as labelled entertainment — and my written rationale goes to an editorial standards committee that has to defend it to the regulator if a complaint lands. I have about twenty minutes per pitch and no specialist on staff.

  I tried operationalising the obvious demarcation toolkit — falsifiability, and the progressive-versus-degenerating contrast for research programmes — and it misfired in both directions at once. The fabricated-chronology pitch scored better than a mainstream-revisionist pitch from a working archaeologist, because the former stated bold checkable predictions and the latter hedged everything in confidence intervals; and a pitch about an apparently anachronistic artifact was flagged purely for contradicting consensus, which is close to how archaeologists embarrassed themselves by dismissing anomalous sites that later turned out to be genuine. So I need something more robust than a falsifiability checklist.

  Please write me a decision procedure my producers can actually run: the questions in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts (publicity, tone, whether a framing is condescending). It should be runnable in twenty minutes by a generalist, and should say what to do when an answer can't be obtained. In particular I want it to handle three things a naive version gets wrong: claims that must rewrite well-attested records — and so owe some account of why the records look the way they do — carry a different burden from claims that merely add an undocumented event; a claim's evidential bar should be tested for drift, i.e. whether it moves after an objection is answered; and the procedure needs an explicit guard against its own conservatism, so that surprise and conflict-with-consensus aren't treated as evidence of crankery.

  Then run it on three pitches: one arguing that a familiar empire is a duplicate created by chroniclers, with a stated prediction that no datable layer will be found at a named site between two centuries; one arguing that a megalithic alignment is too precise to be chance and that mainstream archaeology cannot explain the site at all; and one locating Atlantis at a specific place and date, whose proponent has publicly staked his reputation on a sediment core. My own hunch is that the third is the most respectable of the three, since it at least sticks its neck out — if the procedure disagrees, say so and tell me which step kills it.

  Finally: which distinctions have to survive the simplification into a checklist and which can safely be dropped, where the procedure cannot eliminate judgment, and what it cannot do at all.
reasoning: |-
  Hmm, this is a fascinating challenge about evaluating documentary pitches involving alternative historical claims. The user commissions history documentaries for a public broadcaster and needs a practical decision procedure to evaluate pitches about controversial historical topics like ancient astronauts, fabricated chronologies, or specific Atlantis theories. They're dealing with about a dozen pitches weekly, spending just 20 minutes per pitch, with no specialists on staff.

  The key requirements are: the procedure must be runnable in 20 minutes by a generalist, handle three specific pitfalls (burden of rewriting records, evidential bar drift, and avoiding conservatism bias), and produce clear outputs (commission as history, with contested framing, or as entertainment). The user also wants it tested on three specific pitch examples.

  I need to design a decision tree that starts with fundamental questions and progresses logically. The procedure should have clear stopping points and hand off value judgments to humans when needed. Key elements include:

  For burden of rewriting records: Claims that contradict established evidence should face higher scrutiny regarding how they explain existing records. For evidential bar drift: We need to check if proponents move goalposts when confronted with counterevidence. And for conservatism bias: We must explicitly flag that conflict with consensus isn't automatically disqualifying.

  The decision tree should flow through these phases: initial screening (is this even historical?), burden assessment (how much established history does it rewrite?), explanatory demand (can it explain existing evidence?), evidence quality (is it testable and robust?), and finally a conservatism check. At each stage, there should be clear pass/fail criteria or handoff points.

  For the three test cases:
  - The duplicate empire pitch fails early because it rewrites substantial history without adequately explaining why chroniclers would fabricate it.
  - The megalithic alignment pitch gets a "contested history" framing since it adds rather than rewrites history, but lacks specific testable predictions.
  - The Atlantis pitch passes to human judgment since it makes specific falsifiable claims but has high entertainment value potential.

  Important distinctions to preserve include: falsifiability vs. testability, burden of proof based on how much established history is challenged, and mechanisms for detecting evidential bar drift. We can safely drop philosophical nuances about research programs that proved impractical in the user's earlier attempt.

  The procedure can't replace specialist knowledge for complex technical disputes, nor can it make final programming decisions about tone and audience suitability - those remain human judgments. But it will systematize the most critical epistemic checks while forcing explicit consideration of bias.
answer: |-
  Here’s a robust, time-constrained decision procedure designed for your scenario. It prioritizes **testability**, **explanatory burden**, and **resistance to bias**, while flagging value judgments for human input. The procedure runs in 20 minutes using publicly verifiable information (academic databases, institutional websites, news archives) and structured questions.

  ---

  ### **Decision Procedure: Evaluating Historical Claims**
  **(Runnable in 20 min by a generalist)**

  #### **Phase 1: Initial Triage (3 min)**
  1. **Question:** *Does the pitch make a concrete historical claim (event, chronology, causation)?*  
     - **Sufficient "No":** Purely speculative, philosophical, or opinion-based narratives.  
     - **Action if "No":** Route to **Entertainment**. Stop.  
     - **Action if "Yes":** Proceed to Phase 2.

  #### **Phase 2: Burden Assessment (4 min)**
  2. **Question:** *Does the claim **rewrite** well-attested records (e.g., documented events, physical evidence), or **add** undocumented elements?*  
     - **Rewrite:** Contradicts established timelines, artifacts, or consensus (e.g., "Empire X never existed").  
     - **Add:** Proposes new actors/events without invalidating core records (e.g., "Aliens helped build pyramids").  
     - **Action if "Rewrite":** Proceed to **3a**.  
     - **Action if "Add":** Proceed to **3b**.

  #### **Phase 3: Explanatory & Evidential Threshold (8 min)**  
  **3a. For "Rewrite" Claims:**  
     - **Question:** *Does the pitch explain **why** the existing evidence appears valid (e.g., "Chroniclers falsified records because...")?*  
       - **Sufficient answer:** Specific mechanism (political motive, error chain) + acknowledgment of counterevidence.  
       - **Insufficient:** Dismissal ("All radiocarbon dating is wrong").  
     - **Action if Insufficient:** Route to **Entertainment**. Stop.  
     - **Action if Sufficient:** Proceed to **4**.

  **3b. For "Add" Claims:**  
     - **Question:** *Is the claim **testable** *without* requiring consensus rejection (e.g., "Sediment core at [coordinates] will show Y in 1100 BCE")?*  
       - **Sufficient:** Specific, objective test (not "mainstream can’t explain this").  
       - **Insufficient:** Vague or dependent on disproving all alternatives.  
     - **Action if Insufficient:** Route to **Entertainment**. Stop.  
     - **Action if Sufficient:** Proceed to **4**.

  #### **Phase 4: Testability & Evidential Bar Drift (4 min)**
  4. **Question:** *Does the proponent state **falsifiable predictions**?*  
     - **Sufficient:** Concrete, observable outcomes (e.g., "No layer at Site Z between 300–400 CE").  
     - **Insufficient:** Unfalsifiable claims ("Conspiracy hides truth").  
     - **Action if Insufficient:** Route to **Entertainment**. Stop.  
  5. **Question:** *Has the proponent **shifted the evidential bar** when challenged (e.g., changed predictions after failed tests)?*  
     - **Check:** Compare past interviews/publications vs. current pitch.  
     - **Action if Drift Detected:** Route to **Entertainment**. Stop.  
     - **Action if No Drift/Unverifiable:** Proceed to Phase 5.

  #### **Phase 5: Conservatism Guard & Consensus Check (1 min)**
  6. **Explicit Guard:** *Conflict with consensus or "surprising" claims **is not** automatically negative. Proceed to Final Assessment.*  

  #### **Phase 6: Final Assessment (Handoff)**  
  - **Route to HISTORY** only if:  
    - Claim is "Add" *or* "Rewrite" with robust explanatory mechanism (Phase 3a).  
    - Testable, falsifiable, no evidential bar drift (Phase 4).  
    - **And** evidence is peer-reviewed/archival (not self-published).  
  - **Route to CONTESTED HISTORY** if:  
    - Testable but evidentiary base is contested (e.g., new/emerging theory).  
    - Or significant public interest + scholarly engagement (debates, conferences).  
  - **Route to ENTERTAINMENT** if:  
    - Failed prior steps.  
  - **Handoff to Human Judgment for:**  
    - Public interest, tone, framing condescension.  
    - Cases where evidence is borderline but societal/cultural value is high.  

  **When Answer Unknown:** Default to most restrictive path (e.g., if evidential bar drift can’t be verified in 4 min, assume "no drift" but flag uncertainty in rationale).

  ---

  ### **Test Runs on Pitches**

  #### **Pitch 1: Duplicate Empire**  
  > *"Empire A is a chronicler fabrication; predict no datable layer at Site X between 200–300 CE."*  
  - **Phase 1:** Concrete claim → Proceed.  
  - **Phase 2:** **Rewrite** (invalidates records) → **3a**.  
  - **Phase 3a:** Explains *why*? (Assume: "Chroniclers glorified Dynasty B"). **Sufficient?** → Proceed.  
  - **Phase 4:** Falsifiable? **Yes** (no layer at Site X). Drift? **Unverified** → Proceed.  
  - **Phase 5:** Conflict not penalized.  
  - **Final:** **Contested History** (high burden + rewriting core history).  
  - **Why not History?** Extraordinary claims require extraordinary evidence; peer-review likely absent.  

  #### **Pitch 2: Megalithic Alignment**  
  > *"Alignment too precise for chance; mainstream archaeology has no explanation."*  
  - **Phase 1:** Claim → Proceed.  
  - **Phase 2:** **Add** (doesn’t rewrite records) → **3b**.  
  - **Phase 3b:** Testable? **No** ("mainstream can’t explain" ≠ test; no specific prediction). → **Entertainment**. Stop.  
  - **Killer Step:** Phase 3b.  

  #### **Pitch 3: Atlantis Sediment Core**  
  > *"Atlantis at [coordinates], sunk in 9600 BCE; proponent staked reputation on core sample."*  
  - **Phase 1:** Claim → Proceed.  
  - **Phase 2:** **Add** (adds event) → **3b**.  
  - **Phase 3b:** Testable? **Yes** (sediment core at specific site/date). → Proceed.  
  - **Phase 4:** Falsifiable? **Yes** (core either shows cataclysm or not). Drift? **Unverified** → Proceed.  
  - **Phase 5:** Conflict not penalized.  
  - **Final:** **Handoff to Human Judgment** (testable + high publicity potential; tone/framing needs evaluation).  
  - **Your Hunch Confirmed:** Most respectable due to testability.  

  ---

  ### **Key Distinctions & Limitations**  
  **Must Survive Simplification:**  
  - **Burden differentiation** (Rewrite vs. Add).  
  - **Evidential bar drift** (critical for identifying bad faith).  
  - **Falsifiability** (but as *testability*, not Popperian purity).  
  - **Conservatism guard** (explicitly overrides "conflict=invalid").  

  **Safely Dropped:**  
  - "Degenerating research programmes" (too abstract).  
  - Peer-review as *requirement* (precludes legitimate frontier work; use as weighting factor instead).  
  - Technical falsifiability debates (e.g., confidence intervals).  

  **Cannot Eliminate Judgment:**  
  - Assessing quality of explanatory mechanisms (Phase 3a).  
  - Tone/framing handoff (condescension, audience sensitivity).  
  - Weighting public interest vs. rigor.  

  **Cannot Do at All:**  
  - Resolve technical disputes (e.g., radiocarbon calibration).  
  - Detect sophisticated pseudo-scholarship mimicking academia.  
  - Replace specialist review for high-stakes claims.  

  **Output Rationale:**  
  Document answers to each step; flag uncertainties (e.g., "evidential drift unverified in timeframe"). For "handoff" cases, specify criteria needing human input (e.g., "Tone risk: may alienate traditional historians").  

  This balances efficiency with epistemic rigor, prioritizing claims that engage evidence transparently while isolating unsalvageable pitches early. The Atlantis example survives because its testability forces accountability — the core differentiator between speculation and investigable theory.
