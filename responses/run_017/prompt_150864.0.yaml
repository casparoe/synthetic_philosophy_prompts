prompt: |-
  I run a fortnightly reading group for second-year undergraduates on Kant's ethics, and we have just finished the section of the Groundwork on the formula of universal law. What struck me is that everyone in the room now uses the same state-your-maxim-then-universalise-it-then-ask-whether-you-could-will-it vocabulary, and yet they disagree about nearly every case, because under that shared vocabulary they are quietly running four or five different tests. A friend of mine who works in decision theory sat in last week and added to the confusion by insisting that the whole procedure is just an under-specified coordination test, and that almost all of its apparent results come from choices about how the maxim is described. So rather than run another seminar on it, I want to give them a diagnostic quiz that sorts them by what they say about cases before they learn what the readings are called.

  Please act as a professional philosopher who specialises in Kant's practical philosophy and who has some experience designing teaching materials. Before you write any questions, take a bit of time to brainstorm the logical space: what are the genuine choice points that any universalizability test has to settle, and which combinations of answers to them are actually live? Build the instrument out of those distinctions, and only afterwards locate the familiar readings inside the space as leaves. The deliverable is ten questions, each a concrete maxim or case with two or three answer options, phrased so that a student can answer from their instincts about the case without knowing any labels and without being able to guess which reading an option leads to. No question should ask directly which version of the test they accept, or whether the formula is empty, or whether maxims must be described at a certain level of generality. Please use at least some of these cases (and add better ones of your own): the familiar promise-breaking case; lying to a would-be murderer who asks where his intended victim is; the inefficacy maxim in which one person's flight, coffee cup or ad-blocker makes no difference and yet everyone's does; a maxim of universal deference in which everyone insists on letting the other person go first; a maxim of extraordinary self-sacrifice such as donating a kidney to a stranger; and a maxim concerning beings who cannot reciprocate, such as eating animals or discounting future people. The distinctions I most want the questions to be sensitive to are: whether failure is a matter of inconceivability, of the agent's own purpose being defeated, or of a rational will's refusing a world it can perfectly well conceive; whether the universalised world is one in which everyone acts on the maxim or one in which everyone is disposed to; how many agents must act on it for the test to bite — literally everyone, or merely a quorum large enough to destroy the practice; whether the test is about what everyone does or about what would be done to you in the reversed position; and whether the test has purchase at all when the affected parties cannot reciprocate.

  The scoring key should map answer patterns, or dominant tendencies rather than exact hashes, onto five or six leaves — I want the contradiction-in-conception reader, the purpose-frustration reader, the contradiction-in-will reader, the reader who thinks the formula of humanity is doing the real work, the constructivist who relocates the action to the specification of the maxim, and the sceptic who thinks the formula delivers nothing — each leaf with one sentence on the most awkward commitment it inherits. Please also flag any pair of leaves your ten questions cannot really separate, rather than pretending they separate, and note any combination of answers that the space allows but that nobody seems to occupy, with a word on whether it is empty because incoherent, because unattractive, or merely because unexplored. I expect the rigorism-versus-latitude question (whether even the murderer case admits no exception) to cut across several leaves rather than forming one of its own; say so if that is what you find. Nothing in the quiz may depend on looking anything up: no citations, no attribution of readings to named commentators, and no requirement that a student know who defended what — the labels should appear only in the key at the end. Finally, add a short closing note on how confident you are that each of your questions really discriminates between the readings rather than merely between temperaments, name the single question you are least confident about, and say which of your leaf placements you would expect a Kant specialist to contest most sharply.
reasoning: |-
  We are designing a diagnostic quiz to uncover which interpretation of Kant's universalizability test a student is implicitly using. The quiz should be based on concrete cases and avoid technical language. The key distinctions we want to capture are:

  1. **Type of Contradiction**: 
     - (a) Logical inconceivability (the universalized maxim leads to a contradiction in conception, e.g., the world becomes impossible).
     - (b) Pragmatic self-defeat (the agent's own purpose is frustrated in the universalized world).
     - (c) Volitional contradiction (a rational will would not will such a world, even if it is conceivable and not self-defeating for the agent).

  2. **Scope of Universalization**:
     - (a) Literally everyone acts on the maxim.
     - (b) A disposition to act on the maxim is universalized (so that the maxim becomes a universal law of nature).
     - (c) A quorum large enough to destroy the practice or make it impossible.

  3. **Relevance of Reciprocity**:
     - Whether the test applies when the affected parties cannot reciprocate (e.g., animals, future generations).

  4. **Role of Maxim Specification**:
     - How the maxim is described (e.g., level of generality, inclusion of purpose) affects the outcome.

  5. **Scepticism**:
     - Whether the test delivers any substantive results.

  We also note that the rigorism vs. latitude issue (e.g., whether lying to the murderer is permissible) may cut across several interpretations.

  We are to design 10 questions, each with 2-3 answer options. The cases we must include (and we can add more) are:

  - Promise-breaking
  - Lying to a would-be murderer
  - Inefficacy maxim (e.g., ad-blocker, flight, coffee cup)
  - Universal deference (everyone lets the other go first)
  - Extraordinary self-sacrifice (e.g., donating a kidney to a stranger)
  - Treatment of beings who cannot reciprocate (e.g., eating animals, discounting future people)

  We will create questions that probe the distinctions above without naming them. Then we will map patterns of answers to six "leaves" (interpretations):

  1. **Contradiction-in-Conception (CiC) reader**: Focuses on logical impossibility in the universalized world.
  2. **Purpose-Frustration (PF) reader**: Focuses on the maxim becoming self-defeating for the agent's own purpose.
  3. **Contradiction-in-Will (CiW) reader**: Focuses on what a rational will would will, even if the world is conceivable and the purpose not self-defeated.
  4. **Formula of Humanity (FH) reader**: Believes the real work is done by treating humanity as an end.
  5. **Constructivist (Con) reader**: Thinks the action is in the specification of the maxim.
  6. **Sceptic (Scep)**: Thinks the formula delivers no substantive results.

  We must also note which pairs of leaves the quiz might not separate well, and which answer combinations are unoccupied.

  Let's brainstorm the logical space:

  **Choice Points for Any Universalizability Test**

  1. **What is universalized?** 
     - (A) The maxim as a rule of action for everyone (so everyone does the act in the same circumstances).
     - (B) The maxim as a disposition (so everyone is disposed to act that way when the circumstances obtain).
     - (C) A quorum that undermines the practice.

  2. **What counts as a contradiction?**
     - (A) Logical impossibility (the world described is incoherent).
     - (B) The agent's purpose being defeated (so the action becomes pointless or self-defeating).
     - (C) The world being one that a rational will would reject (e.g., because it undermines necessary ends).

  3. **How is the maxim specified?**
     - (A) At a high level of generality (e.g., "lying when convenient") vs. 
     - (B) Including very specific circumstances (e.g., "lying to a murderer at the door to save a life").
     - (Note: This is a major point of contention and often leads to different results.)

  4. **Relevance of reciprocity**:
     - (A) The test only applies to interactions between rational agents who can reciprocate.
     - (B) The test applies to all actions, including those affecting non-rational beings.

  5. **Rigorism vs. Latitude**:
     - (A) The test is absolute and admits no exceptions (e.g., lying is always wrong).
     - (B) The test allows for exceptions when the circumstances are exceptional.

  Now, we design the questions. Each question will present a case and ask whether the maxim is morally permissible (or sometimes, what the problem is). The answer options will be designed to reveal the underlying interpretation without using technical terms.

  **Important**: The student should answer based on their instinct about the case. We are not teaching Kant yet; we are diagnosing their implicit understanding.

  Let's create 10 questions:

  1. **Promise-breaking**: 
     - Case: You need money and consider making a false promise to repay, knowing you won't. You think: "It's okay because I really need the money and I'll pay back when I can, but I know I won't be able to."
     - Question: Is making a false promise in this situation morally permissible?
     - Options:
       - (A) No, because if everyone did that, no one would believe promises anymore and then the promise wouldn't work.
       - (B) No, because making a false promise is treating the lender as a mere means.
       - (C) It depends on the circumstances, but in this case, it might be permissible because the lender is rich and won't be hurt much.

  2. **Lying to a murderer**:
     - Case: A murderer comes to your door and asks where your friend is (who is hiding in your house). You consider lying to save your friend.
     - Question: Is lying to the murderer in this situation morally permissible?
     - Options:
       - (A) No, because lying is always wrong, no matter the consequences.
       - (B) Yes, because if everyone lied to murderers, it would save lives and that's a good thing.
       - (C) It depends on how we describe the maxim. If the maxim is "lying to save an innocent life", then universalizing it might be okay.

  3. **Inefficacy (ad-blocker)**:
     - Case: You use an ad-blocker because you think: "One person using an ad-blocker won't hurt the website's revenue, and I hate ads."
     - Question: Is using an ad-blocker in this situation morally permissible?
     - Options:
       - (A) No, because if everyone used ad-blockers, websites would collapse, and then you wouldn't have content to block ads on.
       - (B) Yes, because one person really doesn't make a difference, and the problem only arises if too many people do it.
       - (C) It depends on the website. If the website is supported by other means, then it's okay.

  4. **Universal deference**:
     - Case: You always insist on letting the other person go first through a door, because you think it's polite. But if everyone did that, no one would ever go through.
     - Question: Is this rule of universal deference morally permissible?
     - Options:
       - (A) No, because if everyone followed it, it would lead to a stalemate and no one could go through the door.
       - (B) Yes, because even if everyone did it, eventually someone would break the stalemate, and it's good to be polite.
       - (C) The maxim is incoherent: it both requires going first (by letting the other go first, you are going second) and not going first, so it's self-contradictory.

  5. **Kidney donation**:
     - Case: You consider donating a kidney to a stranger in need. You have no personal connection and it's a significant risk and sacrifice.
     - Question: Is it morally required to donate the kidney?
     - Options:
       - (A) No, because if everyone were required to donate a kidney to a stranger, that would be too demanding and people would be worse off.
       - (B) No, because while it is good to donate, it is not a duty; it is supererogatory.
       - (C) Yes, because we should help others in need, and if everyone did so, the world would be better.

  6. **Eating animals**:
     - Case: You eat meat because you enjoy it. The animals you eat cannot reciprocate moral treatment.
     - Question: Is eating meat morally permissible?
     - Options:
       - (A) Yes, because animals aren't rational and the universalization test only applies to interactions with rational beings.
       - (B) No, because if everyone ate meat, it would cause immense suffering and a rational will would not will such a world.
       - (C) It depends on how the animals are treated. If they are raised humanely, then it might be okay.

  7. **Discounting future people**:
     - Case: You decide not to recycle because you think: "One person not recycling won't harm the environment, and future generations are not here to complain."
     - Question: Is not recycling in this situation morally permissible?
     - Options:
       - (A) Yes, because future people don't exist yet and cannot be wronged.
       - (B) No, because if everyone did not recycle, the environment would be ruined for future generations, and a rational will would not will that.
       - (C) It depends on the scale. If only a few people don't recycle, it's okay.

  8. **False promise (with ability to repay)**:
     - Case: You consider making a false promise to repay a loan, but you know you could repay it if you wanted to (you just don't want to).
     - Question: Is making a false promise in this situation morally permissible?
     - Options:
       - (A) No, because if everyone did that, the practice of promising would collapse.
       - (B) No, because you are using the lender as a mere means to get money.
       - (C) It might be, if the lender doesn't really need the money and you do.

  9. **Lying for convenience**:
     - Case: You tell a small lie to avoid a social event you don't want to attend.
     - Question: Is this lie morally permissible?
     - Options:
       - (A) No, because if everyone lied for convenience, trust would break down.
       - (B) It depends on the context. If the lie is harmless and the event is unimportant, then it might be okay.
       - (C) Yes, because one small lie doesn't hurt anyone.

  10. **Breaking a promise to help a friend**:
      - Case: You have promised to help a friend move, but on the day, you get an opportunity to go to a concert you really want to attend. You break the promise and go to the concert.
      - Question: Is breaking the promise in this situation morally permissible?
      - Options:
        - (A) No, because if everyone broke promises when something better came up, promises would be meaningless.
        - (B) It depends: if your friend understands and forgives you, then it might be okay.
        - (C) No, because you are treating your friend as a mere means to your own enjoyment.

