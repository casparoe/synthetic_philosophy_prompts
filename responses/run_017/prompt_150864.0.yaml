     - Q2: B
     - Q10: C

  - **Con**:
     - Q3: B or C (context matters)
     - Q6: C
     - Q7: C
     - Q8: B

  - **Scep**:
     - Tendency to choose permissive options: 
          Q1: C
          Q2: C
          Q3: B
          Q4: B
          Q5: B
          Q6: A or C
          Q7: A or C
          Q8: C
          Q9: C
          Q10: B

  **Awkward commitments**:

  - CiC: Must condemn lying to the murderer because it would destroy the institution of truth-telling, even if it leads to death.
  - PF: In the non-beneficence case, if the agent doesn't care about ever receiving help, then the maxim would be permissible.
  - CiW: The duties to oneself and others are based on what a rational will would will, but it's unclear how demanding they are.
  - FH: It's unclear how to apply the formula to animals or future generations.
  - Con: The test is vulnerable to manipulation by redescribing the maxim.
  - Scep: The test doesn't give clear guidance and is therefore useless.

  **Pairs not well separated**:

  - CiC and PF: They often give the same answers (e.g., Q1, Q2, Q3, Q9, Q10). We might need to treat them as one category for some students.

  - Also, FH and CiW might overlap in some cases (e.g., Q6, Q7) if the student appeals to respect for rational nature in the abstract.

  **Unoccupied combinations**:

  - It's hard to imagine a student who is both rigorist (always chooses the strict option) and sceptic. That combination seems incoherent.

  - Also, a constructivist who is also a sceptic might be common, but they are both in the permissive camp.

  **Closing Note**:

  I am about 70% confident that the quiz discriminates between the readings, but there is overlap, especially between CiC and PF. The least confident question is Q2 (lying to murderer) because the options for CiC and PF are not clearly distinct. I expect Kant specialists to contest the placement of the Formula of Humanity leaf, especially because the Formula of Humanity is not technically part of the universal law test. Some might argue that our FH leaf is really just an application of the humanity formula and not an interpretation of the universal law test. But in our context, we are diagnosing how students are using the universal law vocabulary, and some might be smuggling in the humanity formula.

  We proceed to write the quiz as instructed.
answer: |-
  Below is a diagnostic quiz designed to uncover implicit interpretations of Kant's universalizability test by presenting concrete cases. The questions avoid technical terms, citations, or named readings, focusing instead on instinctive responses to scenarios. Each question has answer options that map onto underlying philosophical distinctions without signaling which reading they correspond to. 

  The quiz targets six interpretive "leaves" (readings) based on logical choice points in universalizability tests:  
  - **Contradiction-in-Conception (CiC)**: Failure occurs when universalizing the maxim creates a logically inconceivable world (e.g., practices become impossible).  
  - **Purpose-Frustration (PF)**: Failure occurs when universalizing defeats the agent’s own purpose (even if the world is conceivable).  
  - **Contradiction-in-Will (CiW)**: Failure occurs when a rational will rejects the universalized world as incompatible with necessary human ends (e.g., happiness, development), even if conceivable and not self-defeating.  
  - **Formula of Humanity (FH)**: The real work is done by treating rational beings as ends, not means (often manifesting as concern for reciprocity or respect).  
  - **Constructivist (Con)**: Moral weight lies in how the maxim is specified (e.g., generality, context), making universalization sensitive to description.  
  - **Sceptic (Scep)**: The test yields no substantive results, as outcomes depend entirely on arbitrary choices (e.g., maxim phrasing, empirical guesses).  

  **Key choice points embedded in the questions**:  
  1. **Failure mode**: Inconceivability vs. self-defeat vs. rational rejection.  
  2. **Scope of universalization**: Literally everyone acts vs. a quorum large enough to destroy the practice.  
  3. **Reciprocity requirement**: Whether the test applies to beings who cannot reciprocate (e.g., animals, future people).  
  4. **Maxim specification**: Whether the test is sensitive to how the maxim is described.  
  5. **Rigorism vs. latitude**: Whether exceptions are allowed in extreme cases (e.g., lying to a murderer), which cuts across multiple leaves.  

  ---

  ### **The Quiz**  
  Answer based on your intuitive judgment. There are no trick questions—choose the option that best reflects your view.  

  1. **The Broken Promise**  
     You urgently need a loan and promise to repay it next week, knowing you won’t be able to. Is this permissible?  
     - (A) No, because if everyone broke promises, no one would trust promises, and your false promise wouldn’t work.  
     - (B) No, because you’d be using the lender as a tool for your gain.  
     - (C) It depends—if the lender is wealthy and won’t be harmed, it might be fine.  

  2. **The Would-Be Murderer**  
     A murderer is at your door asking where your friend (who is hiding inside) is. You consider lying to save your friend. Is lying permissible?  
     - (A) No, because if everyone lied to violent people, your lie wouldn’t be believed, and it wouldn’t save your friend.  
     - (B) No, because lying treats the murderer as a mere obstacle, denying his humanity.  
     - (C) Yes, because saving a life outweighs truth-telling in this extreme case.  

  3. **The Coffee Cup**  
     You don’t bring a reusable cup to a café, thinking, "One disposable cup won’t matter." Is this permissible?  
     - (A) No, because if everyone did this, waste would overwhelm the environment.  
     - (B) Yes, because one person’s choice has no real impact.  
     - (C) It depends—if the café uses recyclable materials, it might be fine.  

  4. **Universal Deference**  
     You always insist others go first (e.g., through doors), valuing politeness. If everyone did this, movement would stall. Is this permissible?  
     - (A) No, because if everyone deferred, society would gridlock.  
     - (B) Yes, because someone would eventually act, and politeness is valuable.  
     - (C) No, because the rule "always defer" contradicts itself when universalized.  

  5. **Kidney Donation**  
     You consider donating a kidney to a stranger, risking your health for no personal gain. Is this morally required?  
     - (A) No, because if everyone had to donate, society would be worse off due to widespread harm.  
     - (B) No, because while admirable, such sacrifice isn’t obligatory.  
     - (C) Yes, because we must aid others if we can, and universal donation would save lives.  

  6. **Eating Meat**  
     You eat meat because you enjoy it, knowing animals can’t object. Is this permissible?  
     - (A) Yes, because animals aren’t rational, so their treatment isn’t covered by moral tests.  
     - (B) No, because if everyone ate meat, it would cause unbearable suffering no one could rationally endorse.  
     - (C) It depends—if animals are raised humanely, it might be acceptable.  

  7. **The Ad-Blocker**  
     You use an ad-blocker, thinking, "One user won’t affect website revenue." Is this permissible?  
     - (A) No, because if everyone blocked ads, websites would collapse, and you couldn’t use them.  
     - (B) Yes, because your individual action has negligible impact.  
     - (C) It depends—if the site has other funding, it might be harmless.  

  8. **Lying to Avoid Boredom**  
     You lie to skip a dull event, causing no obvious harm. Is this permissible?  
     - (A) No, because if everyone lied for convenience, social trust would erode.  
     - (B) It depends on the context—if the event is trivial and no one cares, it might be fine.  
     - (C) Yes, because small lies don’t hurt anyone.  

  9. **Discounting Future People**  
     You avoid recycling, thinking, "One person won’t harm the environment, and future people can’t protest." Is this permissible?  
     - (A) Yes, because future people don’t exist yet and can’t be wronged.  
     - (B) No, because if everyone did this, the environment would collapse, and no rational person would choose that world.  
     - (C) It depends—if others recycle enough, your inaction might not matter.  

  10. **Never Helping Strangers**  
      You refuse to help strangers in need (e.g., someone dropped their groceries) but accept help when offered. Is this permissible?  
      - (A) No, because if no one helped, you wouldn’t receive help when needed, defeating your own acceptance of aid.  
      - (B) No, because a world without mutual aid would be unlivable and rejected by any rational person.  
      - (C) Yes, because you aren’t obligated to help if you don’t want to.  

  ---

  ### **Scoring Key**  
  Map your answers to the dominant pattern in your responses. Each leaf includes one "awkward commitment" (a challenging implication of the view).  

  1. **Contradiction-in-Conception (CiC)**  
     - **Profile**: Frequent (A) in Q1, Q3, Q4, Q7; (C) in Q4. Rigorist about rules (e.g., no exceptions in Q2).  
     - **Leaf**: Failure = maxim’s universalization creates a logically impossible world (e.g., promises or movement become inconceivable).  
     - **Awkward commitment**: Must condemn lying to a murderer (Q2A) because it destroys truth-telling as a practice, even if it causes death.  

  2. **Purpose-Frustration (PF)**  
     - **Profile**: Strong (A) in Q1, Q2, Q3, Q7, Q10; sometimes (A) in Q4.  
     - **Leaf**: Failure = universalization defeats the agent’s specific purpose (e.g., your false promise or lie fails because no one trusts you).  
     - **Awkward commitment**: If an agent doesn’t care about their purpose (e.g., in Q10, they never want help), the test permits selfishness.  

  3. **Contradiction-in-Will (CiW)**  
     - **Profile**: (A) or (B) in Q5, Q9; (B) in Q6, Q10. Permissive about reciprocity cases (Q6, Q9).  
     - **Leaf**: Failure = rational agents reject the universalized world as incompatible with necessary ends (e.g., happiness, environmental survival), even if conceivable.  
     - **Awkward commitment**: Demands positive duties (e.g., aiding strangers in Q10B) but struggles to specify their limits.  

  4. **Formula of Humanity (FH)**  
     - **Profile**: (B) in Q1, Q2, Q10; (A) or (B) in Q5. Less emphasis on universalization mechanics.  
     - **Leaf**: The "real work" comes from respecting rational agency (treating persons as ends, not means). Universalization is secondary.  
     - **Awkward commitment**: Struggles to explain duties to non-rational beings (e.g., animals in Q6A/C).  

  5. **Constructivist (Con)**  
     - **Profile**: (B) or (C) in Q3, Q6, Q7, Q8, Q9; (C) in Q1, Q2. Context-dependent answers.  
     - **Leaf**: Moral truth lies in how we specify maxims (e.g., generality, details); universalization is flexible but vacuous without this.  
     - **Awkward commitment**: Allows "gaming" the test by redescribing maxims to permit almost anything.  

  6. **Sceptic (Scep)**  
     - **Profile**: (B) or (C) in most questions; (C) in Q1, Q2, Q8; permissive/empirical answers.  
     - **Leaf**: The test is empty—results depend on arbitrary choices (maxim description, empirical predictions).  
     - **Awkward commitment**: Cannot explain why Kant’s test feels compelling; reduces ethics to intuition.  

  ---

  ### **Limitations and Notes**  
  - **Poorly separated pairs**:  
    - **CiC and PF** often align (e.g., Q1, Q3, Q7). They are distinguished only if purpose vs. logical impossibility is explicit (Q4C and Q10A favor CiC; Q2A and Q10A favor PF).  
    - **FH and CiW** overlap on duties to others (Q5, Q10). FH is more about reciprocity, CiW about rational willing.  
  - **Unoccupied combinations**:  
    - **Rigorist Sceptic**: Rejects all exceptions (e.g., Q2A) but thinks the test is empty. Incoherent, as rigorism requires the test to be substantive.  
    - **Latitudinarian CiC**: Allows exceptions (e.g., Q2C) but requires strict logical impossibility. Unattractive, as it undermines the conception of "inconceivability."  
  - **Rigorism vs. Latitude**: Cuts across leaves. CiC/PF/FH often rigorist (Q2A/B); CiW/Con/Scep often latitudinarian (Q2C).  
  - **Least confident question**: **Q4 (Universal Deference)**. Answers may reflect temperament (e.g., optimists choose B) more than philosophical distinctions. CiC selects A/C, PF selects A, but B could indicate Scep or Con.  
  - **Contested leaf placement**: **FH** might be challenged by Kant specialists. The Formula of Humanity is distinct from the Formula of Universal Law, so mapping FH answers to universalization tests could be seen as conflating frameworks. However, in practice, students often "borrow" FH reasoning when applying universal law.  

  **Confidence in discrimination**: ~75%. Questions are designed to force choices between failure modes (Q1, Q2, Q10), reciprocity (Q6, Q9), maxim specification (Q3, Q7, Q8), and scope (Q4, Q5). Temperament (e.g., rigorist vs. permissive) influences answers but is scaffolded by the logical space. The quiz is weakest on Q4 and Q8, where intuitions may be noisy. For best results, discuss patterns in class after scoring.
