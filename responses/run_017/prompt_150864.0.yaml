     We must live with some overlap. Perhaps in practice, CiC and PF often converge.

     Alternatively, CiC might be captured in Q4 by option C (the maxim is self-contradictory).

     So we'll score:
     - CiC: 
          Q1: A
          Q2: A (if they choose A, but note it's shared)
          Q3: A
          Q4: C (or A, but C is more strictly logical)
          Q9: C (because there's no logical contradiction) or B? CiC doesn't apply to non-beneficence because it's not logically impossible. So they might choose C (permissible) for Q9.
          Q10: A

     But they might also choose B in Q10 (if they think it's not permissible because of the promise) but that's also PF and CiW.

     Given the difficulty, we might have to accept that CiC and PF are not well separated by this quiz. We'll flag that.

  - **PF**:
     - Q1: A
     - Q2: A
     - Q3: A
     - Q9: A
     - Q10: A

  - **CiW**:
