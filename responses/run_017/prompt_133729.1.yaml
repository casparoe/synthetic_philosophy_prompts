prompt: |-
  I mod a Discord server for a survival MMO — few thousand people, maybe six of us on the mod team — and a stupidly large chunk of my week is spent arbitrating fights. Over a couple of years I've started noticing a pattern in how people argue in those fights, and not having a word for it is driving me nuts.

  Here's the pattern. The same person, sometimes inside the same paragraph, will talk as if virtual stuff is perfectly real and then as if it's nothing whatsoever, and which way they go doesn't track the facts of the case. Someone spends four hundred hours building a base, another player he trusted lets himself in and torches it, and the first guy posts that he destroyed months of work, that it was theft, that he wants the guy banned and the items restored. Half an hour later in the same thread someone brings up that a woman in the server was cornered on voice chat and harassed for an hour while her character was pinned down, and the person who just called a burned base "theft" says it's just pixels, nobody was actually touched, if you can't handle it don't roll on an open-PvP server. And it isn't simple self-interest, which is why I don't think "hypocrisy" is the right word: I've watched people who were harassed themselves deploy the "it was only a game" move about their own harassment, and I've watched people who think being groped in VR is a real assault laugh at the idea that duping a stack of rare ore is theft, on the grounds that the ore wasn't scarce and nobody lost anything. So the flip doesn't line up with who benefits, and it doesn't line up with any general view about whether virtual worlds are real. As far as I can tell what it tracks is whether treating the virtual thing as real would generate an obligation somebody has to act on — property-ish claims generate "give it back, punish him," harm-ish claims generate "apologise, ban him, admit you did something wrong" — and whichever one is currently on the table gets the deflationary treatment. I've been calling it register flipping privately, and my own half-baked hypothesis is that the real variable isn't realism about the virtual at all but something like enforcement-dependence: whether acknowledging the thing would require an institution (the devs, us) to actually do something.

  So: does this have a name? I know there's a well-known puzzle in this area about why killing people in a video game seems fine while certain other virtual acts seem clearly not fine, and that feels adjacent, but it's about two different virtual acts rather than about one community's ontology flipping depending on what's at stake. I also know there are two consistent positions people defend — that virtual objects are perfectly real objects, just digital ones, and virtual reality is a genuine kind of reality; and the other one, that all of this is make-believe with props and the props aren't what the make-believe is about — and my phenomenon is neither of those, it's the switching between them. What I want is the nearest established concepts and how my pattern differs from each one: what it's not, especially (is it really distinct from ordinary special pleading, or is it just special pleading wearing a costume?), whether there's a version on which the flip is actually correct because objects need scarcity or causal powers or institutional backing and harms only need somebody to suffer, and whether the two standards could be jointly consistent in a way I'm not seeing. If nothing established fits, coin a term, define it, and give me the boundary cases — what counts as an instance and what's a near miss. And please don't hand me a bibliography or papers to look up; I've got no library access from here and I'd never chase them down anyway. I want the carving, not the name: what exactly this thing is, where its edges are, and what would have to be true for it to be a genuine double standard rather than two different standards correctly applied to two different kinds of thing.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a moderator for a Discord server tied to a survival MMO with a few thousand users. Their main issue is dealing with arguments where players flip between treating virtual items as real or insignificant based on the situation. 

  First, I need to understand the core of their frustration. They've noticed a pattern where the same person might insist that destroying a base is theft (real) but dismiss harassment as "just pixels" (not real). The user doesn't think it's simple hypocrisy because the flip doesn't align with self-interest—people have applied the "just a game" logic to their own harassment. 

  The key insight here is that the user believes the switch depends on whether acknowledging the issue would require enforcement action. So they're looking for a term or concept that describes this behavior. They mentioned "register flipping" as their own term but want to know if there's an established concept.

  I recall several philosophical and psychological concepts. Cognitive dissonance comes to mind, but it's more about internal conflict than strategic flipping. Motivated reasoning is closer because it involves adjusting beliefs to avoid discomfort or achieve goals. The user's enforcement-dependence idea fits here—people are motivated to avoid accountability or action.

  Special pleading is another possibility, but it usually involves applying a general rule with inconsistent exceptions. In this case, there's no consistent rule about virtual reality. Instead, the ontology itself shifts. That led me to ontological gerrymandering, which describes redrawing conceptual boundaries to suit one's needs. This seems spot-on because players are redefining what counts as real based on the desired outcome.

  I should also consider if there's a way the two standards could be consistent. For example, maybe property requires scarcity while harm requires emotional impact. But the user observed that the same person might dismiss scarcity-based theft in one context and accept emotional harm in another. The inconsistency lies in the selective application, not the standards themselves.

  Boundary cases help clarify. If someone always treats virtual property as real but dismisses all harms, that's consistent, though biased. The issue here is the situational flip within the same person. Another near miss is trolling, but that's intentional provocation, not necessarily inconsistent ontology.

  The user also wants to know if this is a genuine double standard. It is, because the criteria for "real" change based on the enforcement outcome. Double standards apply different rules to similar situations, which matches here—virtual items are similar in nature but judged differently based on enforcement needs.

  So ontological gerrymandering seems the best fit. It captures the strategic shifting of reality definitions. The term is niche but precise. I'll define it clearly, explain why other terms don't fully fit, and address the double standard aspect. The user's deeper need is likely to articulate this pattern to their mod team or community, so a precise term with clear boundaries will help them address arguments more effectively.
answer: |-
  This is a fascinating and astutely observed pattern, and you've hit on something crucial about how communities navigate virtual worlds. You're right that standard terms like "hypocrisy" or "special pleading" don't quite capture the fluid ontology at play. Here's the conceptual carving:

  1.  **The Core Pattern: Ontological Gerrymandering**
      *   **Definition:** The strategic shifting of the perceived *reality status* or *moral weight* of virtual entities/events (objects, property, harm, effort) depending entirely on whether acknowledging that reality/weight would necessitate an undesired institutional response (enforcement, punishment, restitution, apology).
      *   **Why "Gerrymandering"?** Just as political gerrymandering redraws district boundaries to achieve a desired electoral outcome, ontological gerrymandering redraws the boundaries of "what counts as real/significant *here*" to achieve a desired enforcement outcome (action or inaction).
      *   **Key Mechanism:** **Enforcement-Dependence.** As you brilliantly identified, the primary driver isn't a consistent belief about virtuality, self-interest, or even the specific nature of the act (property vs. harm). It's entirely contingent on the *institutional consequence* that would flow from taking the claim seriously. If acknowledging reality = "You (Mods/Devs) must *do* something costly/undesirable *to me or my ally*," then the event is deflated ("just pixels"). If acknowledging reality = "You (Mods/Devs) must *do* something beneficial *for me* (restore, punish my enemy)," then the event is inflated ("months of work destroyed!", "theft!").

  2.  **How it Differs from Adjacent Concepts:**
      *   **Hypocrisy:** Hypocrisy involves *claiming* adherence to a principle one doesn't actually *practice*. Here, individuals aren't necessarily claiming a consistent principle at all; they are strategically *defining the nature of reality itself* on the fly. The inconsistency is ontological, not just behavioral.
      *   **Special Pleading:** Special pleading involves applying a general rule inconsistently by making unjustified exceptions *for oneself*. Ontological gerrymandering is broader:
          *   It can be deployed for oneself *or* for others (e.g., defending an ally's harassment by deflating it).
          *   The "exception" isn't framed as "this rule doesn't apply *to me*," but rather "this *thing* isn't real/significant *in the way needed to trigger the rule*." They change the map, not just claim an exemption. It's special pleading applied to the *fundamental nature of the situation*, not just the rule.
      *   **Motivated Reasoning:** This is a broader psychological umbrella. Ontological gerrymandering is a *specific form* of motivated reasoning where the motivation is to influence institutional enforcement, and the reasoning involves manipulating the perceived ontology of the virtual world.
      *   **Cognitive Dissonance:** While discomfort might be present, the core isn't primarily about *reducing internal discomfort* (as in dissonance) but about *achieving an external outcome* (influencing mod action/inaction). The flip is tactical, not (just) psychological.
      *   **The Ludic/Narrative Fallacy (or the "Magic Circle" Problem):** This refers to the difficulty of cleanly separating "game reality" from "real reality." Your pattern exploits this ambiguity *strategically* rather than falling victim to it naively. Players are *weaponizing* the inherent ambiguity of the magic circle.

  3.  **Could the Flip Be Logically Consistent?**
      *   **The Scarcity Argument:** "Property requires scarcity. Duping ore doesn't destroy scarcity; burning a base does. Harms require emotional impact, which voice harassment causes." *Problem:* You observe people who dismiss *their own* emotionally impactful harassment ("just pixels") or who dismiss duping *even when* it creates artificial scarcity or undermines effort. The flip isn't applied consistently *to scarcity/impact*; it's applied based on *who benefits from enforcement*.
      *   **The Institutional Backing Argument:** "Property rights only exist if enforced by the devs/mod system. Harms exist independently if someone suffers." *Problem:* This *could* be a consistent position. However, your observation shows people who demand enforcement *for property* (acknowledging its institutional reality) simultaneously *deny* the institutional reality of harassment rules ("it's open PvP, deal!"). They aren't arguing "harms exist but the rules don't cover this"; they are arguing *the harm itself isn't real* ("nobody was touched"). They selectively deny the *underlying reality* needing institutional recognition when it suits them.
      *   **Conclusion:** While *theoretically* different standards *could* apply consistently to property vs. harm (e.g., requiring institutional backing for property rights but not for basic respect), the *observed behavior* involves applying *both* standards inconsistently *within each category* based solely on enforcement-desirability. This makes it a **Genuine Double Standard:** Applying different criteria for "what counts as real/significant" to *functionally similar situations* (virtual events causing distress/loss) based solely on the desired outcome for the enforcer.

  4.  **Boundary Cases & Near Misses:**
      *   **Instance:** Player A loses rare loot to a bug, demands restoration ("real loss!"). Player B is scammed out of equivalent loot via trade, Player A says "buyer beware, it's just a game."
      *   **Instance:** Player C reports prolonged toxic verbal abuse in global chat. Player D, who previously demanded a ban for base griefing, says "just mute them, it's text."
      *   **Instance:** Player E, after being sexually harassed on voice chat, later dismisses another player's complaint about the same behavior, saying "it's VR, grow a thick skin."
      *   **Near Miss (Not Ontological Gerrymandering):**
          *   Player F always believes virtual property is real and theft is wrong, but believes virtual harassment is "just banter" and part of the game. (This is a *consistent*, though potentially biased, ontological stance).
          *   Player G argues that duping isn't theft *because* the original owner still has their copy, while base burning *is* destruction *because* it's gone. (This is a consistent argument based on the *nature of the act*, not the enforcement consequence).
          *   Player H trolls by deliberately using both registers to provoke mods ("My base burned? THEFT! BAN HIM! Someone called me names? LOL SNOWFLAKE!"). (This is trolling *using* the pattern, but the core driver is provocation, not a genuine, situationally-driven need to influence enforcement for a specific outcome).
          *   Player I argues that while base burning *feels* bad, the *mods shouldn't intervene* because it's within game mechanics. They don't deny the loss is real, just that it's against the rules. (This is an argument about *policy/enforcement scope*, not a denial of ontology).

  **In Summary:**

  You've identified **Ontological Gerrymandering:** The tactical, enforcement-dependent redrawing of the boundaries defining what aspects of the virtual world "count as real" or "have moral weight" in a given moment. Its core is **Enforcement-Dependence**, not self-interest or a consistent philosophy of virtuality.

  *   **It is distinct from ordinary special pleading:** It manipulates the *fundamental nature of the thing* (is it real? does it matter?) rather than just claiming an exemption from a rule.
  *   **It is a genuine double standard:** While *theoretically* different standards *could* apply to property vs. harm, the observed behavior applies *inconsistent* standards *within* each category based solely on the desired enforcement outcome.
  *   **The flip is not logically justified:** The selective application of criteria like scarcity, emotional impact, or institutional backing based *only* on whether it leads to the desired mod action reveals the underlying tactical motive. Consistency *within* a person's arguments across similar cases is absent.

  Understanding this as Ontological Gerrymandering gives you a powerful lens. When you see the register flip, ask: "Is the *only* difference between this case and the one they cared about yesterday *who benefits from the mods taking action/inaction*?" If the answer is yes, you're seeing the gerrymander in action. Call it out precisely: "You're shifting the goalposts on what counts as 'real' here depending on whether you want us to act or not."
