answer: |-
  Below is a decision procedure designed for your committee's constraints: it aggregates across moral theories without requiring consensus, runs in 40 minutes, avoids your three failure modes, and explicitly flags value judgments. The procedure is structured as a checklist with timed stages, clear stopping points, and audit-friendly documentation. I'll first present the procedure, then apply it to your three cases, and end with limitations and a recording format.

  ---

  ### **Decision Procedure: Aggregated Moral Weighted Deliberation (AMWD)**
  **Core Principles:**  
  - **Avoids midway options** by only permitting actions endorsed by at least one committee member's theory.  
  - **Avoids scaling incomparability** by replacing 0–100 scores with ordinal rankings and explicit veto thresholds.  
  - **Avoids lexicographic dominance** by capping "catastrophe" impacts and requiring minimum credence (5%) for veto power.  
  - **Whose credences?** Uses committee members' credences only (not patients' or experts'). Patient values inform theories but aren't separately averaged.  
  - **Moral uncertainty disagreements:** Members apply their own aggregation methods internally; the procedure aggregates outputs, not theories.  

  **Time Allocation:**  
  - **Stage 0:** Case Setup (5 min)  
  - **Stage 1:** Option Pruning (10 min)  
  - **Stage 2:** Ranking and Catastrophe Screening (15 min)  
  - **Stage 3:** Voting and Tiebreaking (5 min)  
  - **Stage 4:** Recommendation Drafting (5 min)  

  **Procedure Flow:**  
  ![Procedure Flowchart](https://via.placeholder.com/400x800?text=Flowchart+in+Appendix)  
  *(Appendix includes text-based flowchart.)*

  ---

  #### **Stage 0: Case Setup (5 min)**  
  **Questions:**  
  1. What are the medical facts? (e.g., prognosis, options, patient/surrogate wishes)  
  2. What are the feasible clinical options? (List 2–4; e.g., "Continue full treatment," "Withdraw ventilator only").  
  3. Does the patient/surrogate have known values (e.g., religious directives)?  

  **Adequate Answer:**  
  - Medical facts from chart review (1–2 sentences).  
  - Options phrased as actions (e.g., "Stop pressors but continue ventilator").  
  - Patient values noted if documented (no speculation).  

  **Value Judgment?**  
  - No—facts only. If facts are disputed, halt and consult the treating team.  

  **Output:**  
  - Written list of options.  

  ---

  #### **Stage 1: Option Pruning (10 min)**  
  **Goal:** Remove options no theory endorses, avoiding the "midway problem."  

  **Questions:**  
  1. **Per each option:** "Is this option morally **permissible** under any theory you hold with ≥10% credence?" (Yes/No)  
  2. **Per member:** Briefly cite theories (e.g., "Deontology: yes, Consequentialism: no").  

  **Rules:**  
  - **Prune** if fewer than 1 member answers "Yes."  
  - If all options pruned, **halt and escalate** (no defensible choice).  

  **Adequate Answer:**  
  - Members state "Yes/No" per option with theory names (e.g., "Yes [Care Ethics]"). No scores or debates.  

  **Value Judgment?**  
  - **Yes**—members declare their own permissibility judgments.  

  **Output:**  
  - Pruned list of options (retain ≥2 options).  

  ---

  #### **Stage 2: Ranking and Catastrophe Screening (15 min)**  
  **Goal:** Handle scaling and lexicographic dominance by using rankings and capping catastrophe impacts.  

  **Questions:**  
  1. **Rank remaining options** from best to worst per member (ties allowed).  
  2. **Flag catastrophes:** "Does any option risk an outcome you consider **catastrophic** (unbounded disvalue) under a theory you hold with ≥5% credence?"  
     - If "Yes," specify: (a) option, (b) theory, (c) credence %, (d) alternative to avoid it.  

  **Rules:**  
  - **Catastrophe Screening:**  
    - If catastrophe flagged, committee votes (simple majority) on:  
      - "Is the catastrophe outcome **plausible** (medically or morally) and **not avoidable** by another option?"  
        - If **Yes**, prune the option.  
        - If **No**, retain the option (but note dissent).  
    - **Lexicographic dominance cap:** Catastrophe claims require ≥5% credence. Outcomes cannot be assigned "infinite" weight; they are treated as 100x worse than non-catastrophic outcomes.  

  **Adequate Answer:**  
  - Rankings: "1st: Option A, 2nd: Option B."  
  - Catastrophe flags: "Option B: 5% credence in Doctrine of Double Effect → withdrawing nutrition = killing innocent."  
  - Committee vote: "Plausible? 3 Yes, 2 No → prune Option B."  

  **Value Judgment?**  
  - **Yes**—rankings and catastrophe flags are value-laden.  
  - **No**—plausibility vote is factual (e.g., "Is recovery possible?"). If unclear, halt for medical input.  

  **Output:**  
  - Final ranked list of options.  

  ---

  #### **Stage 3: Voting and Tiebreaking (5 min)**  
  **Goal:** Aggregate rankings without averaging scales.  

  **Method: Modified Borda Count with Endorsement Check**  
  1. Assign points: Best option gets N points, second gets N-1, ... (N = number of options).  
  2. Sum points across members.  
  3. **Endorsement check:** If the top-scoring option is **not** ranked "best" by any member, discard it and rerun Borda on remaining options.  
  4. **Tiebreak:** If tie, choose option ranked "best" by more members.  

  **Rules:**  
  - If no option has ≥3 points after endorsement check, **halt and escalate** (irreconcilable disagreement).  

  **Adequate Answer:**  
  - Arithmetic only (no debate).  

  **Value Judgment?**  
  - **No**—pure arithmetic.  

  **Output:**  
  - Winning option.  

  ---

  #### **Stage 4: Recommendation Drafting (5 min)**  
  - **Write:** "We recommend [option]. Rationale: [2–3 sentences]."  
  - **Include:**  
    - Pruned options and why (e.g., "Option C pruned: no theory endorses it").  
    - Catastrophe flags and outcomes (e.g., "Member 3 flagged withdrawal as catastrophic; committee voted 3–2 against plausibility").  
    - Voting tally.  
  - **Requirement:** ≥3 members sign. Attending physician countersigns.  

  ---

  ### **Application to Your Cases**
  **Assumptions:**  
  - Members:  
    - **D1:** Constraints-based (deontology).  
    - **D2:** Constraints-based (disagrees with D1).  
    - **C:** Consequentialist (QALYs).  
    - **CE:** Care ethics (family/relationships).  
    - **L:** Lawyer (defensibility).  
  - **Credences:** Members use personal credences (e.g., CE assigns 3% to "conscious inner life" view in Case 3).  

  ---

  #### **Case 1: Withdrawal Post-Catastrophic Brain Injury**  
  - **Options:**  
    A: Continue all treatment (ventilator, pressors).  
    B: Withdraw ventilator only (stop pressors).  
    C: Withdraw all (ventilator + pressors).  
  - **Team wants C; daughter wants A.**  

  **Stage 0:**  
  - Medical facts: No meaningful recovery expected.  
  - Options: A, B, C.  

  **Stage 1: Pruning**  
  - Permissibility:  
    - D1 (futile treatment view): A✅, B❌, C✅.  
    - D2 (killing view): A✅, B❌, C❌.  
    - C: A❌, B❌, C✅.  
    - CE: A✅ (family wishes), B❌ (half-measure), C✅ (if done compassionately).  
    - L: A✅ (defensible), B❌ (legally risky), C✅ (defensible if policy followed).  
  - **Result:** B pruned (0 "Yes"). A and C advance.  

  **Stage 2: Ranking and Catastrophe**  
  - Rankings:  
    - D1: C > A  
    - D2: A > C  
    - C: C > A  
    - CE: A > C (prioritizes daughter's role).  
    - L: C > A (team recommendation more defensible).  
  - Catastrophe flags: D2 flags C as catastrophic ("killing" under deontology, 100% credence).  
    - Committee vote: "Is catastrophe plausible/avoidable?"  
      - D2: Plausible (value judgment).  
      - Others: Not plausible (C is "allowing death," not killing).  
      - **Vote: 4 No, 1 Yes → retain C.**  

  **Stage 3: Voting**  
  - Borda scores:  
    - A: D2 (2) + CE (2) = 4 points  
    - C: D1 (2) + C (2) + L (2) = 6 points  
  - **Result:** C wins (endorsed by D1, C, L).  

  **Recommendation:** Withdraw all treatment.  
  **Rationale:** "Option C is permissible under constraints-based futility, consequentialism, and legal defensibility; it is endorsed by three members. Option B was pruned (no endorsement). D2's catastrophe flag voted implausible (4–1)."  

  ---

  #### **Case 2: ICU Bed Allocation**  
  - **Options:**  
    A: Assign to sicker patient (25% survival).  
    B: Assign to less sick patient (70% survival).  

  **Stage 0:**  
  - Medical facts: One bed; Patient 1 (25% survival), Patient 2 (70% survival).  
  - Options: A, B.  

  **Stage 1: Pruning**  
  - Permissibility:  
    - D1: A✅ (sickest-first), B❌.  
    - D2: A✅ (duty to worst-off).  
    - C: A❌, B✅ (maximizes QALYs).  
    - CE: A✅, B✅ (both have relational merits).  
    - L: A✅, B✅ (both defensible).  
  - **Result:** No pruning.  

  **Stage 2: Ranking and Catastrophe**  
  - Rankings:  
    - D1: A > B  
    - D2: A > B  
    - C: B > A  
    - CE: A > B (care for most vulnerable).  
    - L: B > A (better outcomes reduce liability).  
  - Catastrophe flags: None.  

  **Stage 3: Voting**  
  - Borda scores:  
    - A: D1 (2) + D2 (2) + CE (2) = 6 points  
    - B: C (2) + L (2) = 4 points  
  - **Result:** A wins (endorsed by D1, D2, CE).  

  **Recommendation:** Assign bed to sicker patient (A).  
  **Rationale:** "Option A endorsed by constraints-based (sickest-first) and care ethics. B endorsed only by consequentialism. No catastrophes flagged."  

  ---

  #### **Case 3: Withdrawal with Lexicographic Dominance Concern**  
  - Same as Case 1 but CE assigns 3% credence to "conscious inner life" view (withdrawal = catastrophic killing).  

  **Stage 0–1:** Identical to Case 1 (A and C advance; B pruned).  

  **Stage 2: Ranking and Catastrophe**  
  - Rankings: Same as Case 1.  
  - Catastrophe flags: CE flags C as catastrophic under "conscious inner life" view (3% credence).  
    - Committee vote: "Is catastrophe plausible/avoidable?"  
      - CE: Plausible (value judgment).  
      - Others: Not plausible (3% credence below 5% threshold; no evidence of consciousness).  
      - **Vote: 4 No, 1 Yes → retain C** (lexicographic dominance blocked by 5% threshold).  

  **Stage 3: Voting**  
  - Identical to Case 1: C wins (6 points).  

  **Recommendation:** Withdraw all treatment.  
  **Rationale:** "Option C wins per Borda count. CE's catastrophe flag (3% credence) rejected by committee for two reasons: (1) credence <5% threshold, (2) medical evidence indicates no consciousness. Option retained after 4–1 plausibility vote."  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Resolve fundamental moral disagreements:** It aggregates outputs but does not reconcile theories.  
  2. **Override medical reality:** Depends on factual input from the treating team.  
  3. **Handle veto abuse:** A member could assign >5% credence to fringe theories to force pruning. Mitigation: Require theory names (e.g., "Catholic doctrine") to discourage bad-faith claims.  
  4. **Ensure "moral truth":** Outputs are defensible but not philosophically optimal.  
  5. **Process >4 options:** Time constraints limit options. Prune aggressively in Stage 1.  

  ---

  ### **Recording Format**  
  Use this template for audit trails:  

