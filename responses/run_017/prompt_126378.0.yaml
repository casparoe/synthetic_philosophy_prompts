  Then a JSON object with exactly these fields: {"best_guess": "...", "level": "...", "confidence": <0–1>, "closest_analog": "<which of 1–6, and why>", "decisive_next_case": "<the minimal case you'd put to her next>", "hidden_variable": "..."} — where hidden_variable is whatever she'd have to fix before her verdict is even well defined. My suspicion is that where you draw the boundary of the system is doing a lot of quiet work, especially given #6, but say if you think it's something else.

  Then two or three sentences of prose on which rule you'd actually bet on and why.
