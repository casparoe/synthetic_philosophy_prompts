prompt: |-
  I run a small fortnightly reading group on philosophy of mind for people who mostly work in ML, and we've spent the last few sessions stuck on the problem of other minds. Two members have been arguing past each other for months and I want to force them to produce something constructive, so I need you to draft the joint statement they could both sign at the end of a good-faith adversarial collaboration. Camp A is the inferentialist camp: ascribing mental states to others is a posits-and-prediction affair, justified by something like the argument from analogy plus an inference to the best explanation, and there is no perceptual contact with another creature's mind (though A gets to insist that the relevant "inference" is not conscious, not deliberation-like, and not something the subject could report doing). Camp B is the direct social perception camp: paradigmatically we perceive other people's anger, intentions and so on in their embodied expressive behaviour, and that perception is epistemically basic rather than derived from observed behaviour plus a hidden premise (though B gets to insist that this perception is learned, culturally shaped and revisable). Please don't cite anything or name papers — describe any study you appeal to in your own words, since I want this to be usable by someone with no library access.

  What I want is the document itself, not a dialogue and not a verdict on who wins. First, a numbered list of claims both can sign: about what needs explaining (please keep the phenomenal version of the problem — is anyone else conscious — separate from the belief-and-desire version, they keep sliding between the two), about what the sceptical challenge is even supposed to threaten, and about what developmental, comparative and clinical evidence can and can't settle. Second, a table of the disagreements that remain, each one stated twice, once in a wording A would sign and once in a wording B would sign, with a column flagging which of them you think are merely verbal (and why) rather than substantive. Third, the cruxes — the sub-questions such that settling them would move at least one side — and for each crux a concrete case or piece of evidence both would accept as bearing on it, with each side's prediction written down in advance, plus what each would count as evidence against their own view.

  For cruxes I'd seed these, but add your own if they're better. (i) "Silent cortex": stipulate an adult with a completely standard human brain in which every functional role associated with pain is realised, who sincerely reports feeling nothing — do we say she is in pain? (ii) "Kaspar", a case I made up: a child raised in total social deprivation until nineteen, stipulated to have no sensory or cognitive impairment, first exposed to faces and voices at nineteen — I want each side to predict how fast and how well she comes to recognise emotion, and to say in advance which finding would embarrass them. (iii) The running fight over whether newborns really imitate adult facial gestures in the first days of life and whether the classic effect holds up in larger, preregistered attempts. (iv) The one I actually care about: a digital system whose conversation is statistically indistinguisable from a thoughtful person's over years of interaction, with no public facts at all about its internals — what does each view say about whether we have any reason to think there is something it is like to be that system, and what would each side count as a reason? Also, be honest if part of their fight is really just about how far the word "perception" can be stretched, or about which side bears the default burden of proof. Neither side is allowed to close any section with "well, we just can't know".
reasoning: |-
  Okay, the user runs a philosophy of mind reading group for ML folks. They're stuck on the problem of other minds, especially between inferentialists (Camp A) and direct perception advocates (Camp B). The user wants a joint statement draft for these two camps to sign after an adversarial collaboration. 

  First, I need to understand the core conflict. Camp A thinks mental state attribution is like scientific inference - we observe behavior and infer hidden states. Camp B believes we directly perceive mental states in expressive behavior. Both have nuances: A says the inference isn't conscious, B acknowledges perception is learned. The user wants to separate phenomenal consciousness ("is anyone conscious") from belief/desire attribution, which they've been conflating.

  For the joint statement, I'll structure it as requested: 
  1) Agreed claims about what needs explaining, separating phenomenal and functional aspects clearly. 
  2) A table of disagreements stated neutrally for each camp. 
  3) Cruxes with testable predictions.

  Notable challenges:
  - Avoiding academic citations while describing studies accurately
  - Keeping phenomenal/functional distinction sharp
  - Identifying genuinely verbal vs substantive disputes
  - Making cruxes concrete enough for ML audience
  - Preventing either side from retreating to skepticism

  For the disagreements table, I'll flag where "perception" is being stretched terminologically versus where there's real epistemological divergence. The burden of proof issue needs addressing too - is direct perception the default or does inference need justification?

  The cruxes are cleverly chosen:
  - Silent cortex tests the pain-phenomenology link
  - Kaspar probes innate vs learned components
  - Newborn imitation examines human starting state
  - Digital system applies it to AI - perfect for ML crowd

  For each crux, I'll specify:
  - What each camp would predict
  - What would falsify their view
  - Avoiding "we can't know" cop-outs

  Particular care needed on the digital system crux since it bridges philosophy and ML. Camp A will likely demand internal architecture while Camp B may focus on observable interaction patterns. Need to ensure both make concrete falsifiable claims.
answer: |-
  Here is the joint statement draft for your reading group members, structured as requested:

  ### Joint Statement: Adversarial Collaboration on the Problem of Other Minds  
  **Signed by Camp A (Inferentialist) and Camp B (Direct Social Perception)**  

  #### I. Agreed Foundations  
  1. **Distinct Problems**:  
     - The *phenomenal problem* ("Is anyone else *conscious* like I am?") must be treated separately from the *functional problem* ("How do we attribute beliefs/desires/intentions to others?"). Evidence for one does not resolve the other.  
  2. **Skeptical Threat**:  
     - Skepticism threatens our *certainty* about others’ minds but not our practical justification for everyday attributions. Neither camp seeks absolute proof against radical skepticism.  
  3. **Evidence Limits**:  
     - Developmental studies (e.g., infant behavior) reveal *mechanisms* for mind-attribution but cannot directly address phenomenal consciousness.  
     - Clinical cases (e.g., autism, delusions) show atypical mind-reading but do not prove general skepticism.  
     - Comparative work (e.g., animal cognition) informs functional analogies but cannot bridge the phenomenal gap.  

  #### II. Table of Outstanding Disagreements  
  *Each row states one issue in both camps’ preferred terminology, with assessment of its nature.*  

  | **Issue**                                                                 | **Camp A (Inferentialist) Wording**                                                                 | **Camp B (Direct Perception) Wording**                                                                 | **Merely Verbal?** | **Reason**                                                                 |
  |---------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|--------------------|----------------------------------------------------------------------------|
  | **Epistemic Basis**                                                       | Mental state attributions require unconscious, rapid inferences from behavioral data.               | Mental states are directly perceived in expressive behavior (e.g., a scowl *is* anger’s appearance).   | No                | Substantive: Disagreement over whether perception requires sensory input alone or latent processing. |
  | **Burden of Proof**                                                       | Direct perception claims must justify why behavioral data *isn’t* inferred.                         | Inferentialists must justify adding extra steps to a parsimonious perceptual process.                  | Partially          | Terminological: Depends on default assumptions about "perception."         |
  | **Role of Learning**                                                      | Learning refines inference models (e.g., Bayesian priors for behavior-mental state links).          | Learning calibrates perception (e.g., distinguishing genuine vs. fake smiles through experience).      | Yes                | Both agree learning shapes the process; "inference" vs. "calibration" is semantic. |
  | **Scope of "Perception"**                                                 | "Perception" is restricted to sensory properties (e.g., shape, sound); mental states are inferred.  | Perception includes "high-level" properties (e.g., seeing *anger*, not just a face).                   | Partially          | Terminological: Dispute hinges on definitional boundaries of perception.   |

  #### III. Cruxes: Predictions and Falsifiability  
  *Each crux includes a shared scenario, both camps’ predictions, and their criteria for self-falsification.*  

  1. **Silent Cortex**  
     - **Scenario**: An adult with a fully functional pain-processing brain (nociception, avoidance, verbal reports of "pain") insists they feel *nothing*.  
     - **Camp A Prediction**: They are in pain (functional criteria override subjective denial).  
       - *Self-falsification if*: Functional markers dissociate from experience *without* inference failure.  
     - **Camp B Prediction**: They are not in pain (subjective report is perceptual evidence).  
       - *Self-falsification if*: All expressive/functional pain indicators exist without any felt experience.  

  2. **Kaspar: Social Deprivation**  
     - **Scenario**: A neurotypical 19-year-old (Kaspar), raised without seeing faces/hearing voices, is exposed to human expressions.  
     - **Camp A Prediction**: Slow, error-prone emotion recognition (inference requires learned behavioral models).  
       - *Embarrassing finding*: Immediate, accurate emotion recognition.  
     - **Camp B Prediction**: Rapid recognition of basic emotions (e.g., fear, anger) due to innate perceptual templates.  
       - *Embarrassing finding*: No spontaneous emotion recognition despite exposure.  

  3. **Newborn Imitation**  
     - **Scenario**: Large preregistered studies testing whether newborns imitate facial gestures (e.g., tongue protrusion) in the first 72 hours.  
     - **Camp A Prediction**: No robust imitation (early responses are reflexes; inference requires maturation).  
       - *Evidence against*: Reliable, specific imitation replicated in rigorous studies.  
     - **Camp B Prediction**: Basic imitation exists (perception-action coupling is innate).  
       - *Evidence against*: Null results in high-powered, well-controlled experiments.  

  4. **Digital System**  
     - **Scenario**: A black-box AI exhibits human-like conversation for years, with no access to its internals.  
     - **Camp A on Phenomenal Consciousness**: *No reason* to attribute consciousness (lacks behavioral *correlates* of inference, e.g., evolutionary continuity).  
       - *Evidence for consciousness*: System passes tests requiring self-referential cognition (e.g., lucidly discussing its "subjective" limitations).  
     - **Camp B on Phenomenal Consciousness**: *Defeasible reason* to attribute consciousness (sustained expressive interaction mirrors perceptual criteria).  
       - *Evidence against consciousness*: System fails tests of embodied affect (e.g., indifference to simulated "pain" while discussing it eloquently).  

  ---  
  **Signed,**  
  *Camp A Representative*  
  *Camp B Representative*  

  ### Design Notes  
  - **Phenomenal/Functional Split**: Explicitly separated throughout (e.g., digital system focuses *only* on phenomenal consciousness).  
  - **Burden of Proof**: Addressed in the table; both camps acknowledged their default assumptions.  
  - **"Perception" Stretch**: Flagged as terminological in the table.  
  - **Falsifiability**: Each camp specifies what would challenge them (no retreat to skepticism).  
  - **ML Relevance**: Digital system crux prioritizes AI alignment concerns.  
  - **Neutral Framing**: Disagreements stated without caricature (e.g., Camp B’s view isn’t "magic").  

  This document forces both sides to commit to testable claims while respecting their core positions. Use the Kaspar and digital system cases to steer discussion toward constructive predictions.
