prompt: |-
  Hey — I teach a history and philosophy of science course (mostly third-years, mixed majors), and Ive got a stack of take-home midterms to get through. Could you grade one for me? I want a second pair of eyes before I write comments, because this answer reads very smoothly and I genuinely can't tell whether I'm being taken in by the prose.

  Background, so you know what they had in front of them. In the lectures I split incommensurability into two: semantic (the vocabularies don't line up — some kind-terms or taxonomic structures don't survive translation, so part of what one side says can't be stated in the other's language) and evaluative (the vocabularies are fine, but the sides weight the ordinary standards of appraisal differently, and there is no rule, as opposed to a shared value, that settles which weighting is correct). I also hammered on three things about Kuhn:

  - he explicitly disavowed the mob-psychology / irrationalist reading: scientists have good reasons, but those reasons don't add up to an algorithm, and individual scientists weight the values differently, so reasonable people can go either way;
  - incommensurable is not his word for incomparable — comparison is hard, partial, and point-by-point, not impossible, and communication between camps breaks down by degrees rather than completely;
  - on progress he gives you progress-from (more puzzle-solving power, finer articulation, more precise instrumentation) and withholds progress-toward (convergence on a fixed, theory-independent goal, or a truth specified independently of any lexicon).

  Here's the question I set.

  **Question 3 (25 minutes).** In a fictional field called orogenics, researchers explain mountain ranges for decades by 'orogenic pressure': stress accumulates in rock strata until the strata buckle. A younger group proposes 'plate transit': crustal blocks drift a few centimetres a year and collide. The two camps use the same vocabulary for every observable feature of a landscape — fault, strata, elevation, uplift rate — and each side reads the other's papers without loss. On every survey measurement anyone has thought to take, they predict the same numbers. They disagree about what a good explanation has to do: the older camp requires that the whole history of a single region be reconstructible from that region's present state; the younger camp is happy with statistical claims about classes of region, provided the account also unifies sea-floor spreading and the distribution of earthquakes. After twenty years everyone under fifty has moved to plate transit, and the old problems have been dropped.

  (a) Does this episode involve incommensurability in either of the two senses distinguished in the lectures? Say which, and in two or three sentences say what turns on the answer.

  (b) Kuhn holds that the criteria of theory choice — accuracy, consistency, scope, simplicity, fruitfulness — are shared values rather than rules, and that this is compatible with theory choice being rational. Does that position commit him to denying that post-revolutionary science is better than what it replaced? Answer in four or five sentences, and say what he can and cannot claim about progress.

  And here's the answer I'm looking at.

  > Both parts turn on what 'incommensurable' does for Kuhn. In the orogenics case the two camps are not incommensurable in the semantic sense: they share all their terms, they translate each other without loss, and they predict all the same numbers, so there is a neutral observational language in which both theories can be stated and checked. It isn't a case of evaluative incommensurability either, because Kuhn's five criteria apply equally to both camps — that is just what it means to say that the standards are shared across a revolution. So the dispute is a plain disagreement about evidence, and the younger camp wins it, since its theory also covers sea-floor spreading and earthquakes. The change is large, but on Kuhn's own account it is hardly a revolution: nothing fails to translate, and the winner is simply the theory the shared criteria pick out.
  >
  > On (b): Kuhn thinks a change of paradigm is a gestalt switch, closer to a religious conversion than to an argument, and he insists that there is no neutral, theory-independent standpoint from which to compare a paradigm with its predecessor. That commits him to saying that the new theory is not better than the old one, only different — this is the 'world change' he describes, and it is why his critics accused him, in my view correctly, of making theory choice a matter of mob psychology. A field can certainly become more efficient at puzzle-solving after a revolution, and its instruments get more precise, but it cannot be said to get closer to the truth; and since Kuhn identifies progress with getting closer to the truth, he has to deny that anything in science counts as progress at all.

  Mark it out of 20. For calibration: a solid but unoriginal answer sits around 13 or 14 with me, and I go to 17 or above only for an answer that actually pushes back somewhere. What I want is a point-by-point assessment, not an overall impression — I'm not going to recieve anything useful from a general verdict. In particular: does the semantic half get handled properly; does the answer notice that the vignette is a case of evaluative disagreement in my sense even though translation is lossless, and draw the right conclusion about whether the choice was rationally decidable; and does it keep progress-from apart from progress-toward without sliding into relativism or into the line that the two camps can't even be said to disagree?

  Reply as exactly five numbered items. Item 1: the mark out of 20, plus one sentence of overall rationale. Items 2 through 5: the four comments that most need to land in the margin, each one or two sentences, each naming the specific sentence or move you're responding to, with at least one of the four giving credit rather than criticism. No introduction, no conclusion, and don't restate the answer back at me. American English, please.
