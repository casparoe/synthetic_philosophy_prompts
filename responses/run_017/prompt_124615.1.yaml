prompt: |-
  Next Friday I'm giving the toast at my team lead's retirement thing — about four minutes, maybe 60 people: half are the safety and infra engineers she worked with for a decade, half are her family (her sister, two kids in college, a few old friends) who mostly know she "worked on computers" and that she was the one asking awkward questions at dinner.

  She spent her whole career on the control side of AI safety: build the monitors, the sandboxes, the rate limits so that they hold even if the system you're deploying is misaligned — you dont get to assume good intentions, you assume the thing on the other side might be optimizing against you, and you build anyway. She was also the person who made us rewrite incident reports that said the model "wanted" something, who argued you can't just point a second model at the first one and call the problem solved because you've moved it rather than closed it, and who killed a project whose entire safety case was "we'd notice if something went wrong" — with systems that are better than us at the task, noticing is exactly the thing we can't count on.

  My problem is that a toast is a genre about goodwill, and her whole professional instinct was institutionalized distrust. I need it to land for the engineers, who will hear any slack in the reasoning, and for her family, who shouldn't go home thinking she spent forty years frightened of her own codebase. Write it, 400 words max. One thing I actually care about: never let it say or imply that the models are basically fine or on our side — that's precisely the assumption her work existed so we wouldn't have to depend on, and I'm not undoing her at her own party.
reasoning: |-
  Okay, the user needs a toast for their team lead's retirement. Let me break this down. The audience is split between engineers who understand the technical details and family who might not. The key challenge is balancing the toast's goodwill nature with the retiree's focus on institutional distrust in AI safety.

  First, the core conflict: retirement toasts are usually warm, but her work was about healthy skepticism. I can't gloss over her contributions by implying models are safe—that would betray her life's work. Need to frame distrust as a form of care and responsibility.

  For the engineers, the examples must be technically precise—mentioning sandboxes, rate limits, and her critiques of anthropomorphism. For family, translate these concepts into universal values: vigilance as dedication, questioning as integrity. 

  The family's perspective is crucial. They know she "worked on computers" and asked awkward questions. I can link that dinner-table tendency to her professional rigor—showing how her personality was consistent. Emphasize that her work wasn't fear-driven but about enabling bold innovation through safeguards.

  Word count is tight (400 max). Prioritize: 1) opening hook that grabs both audiences, 2) concrete examples that demonstrate her principles, 3) reframing skepticism as protective, not paranoid. Avoid any phrasing like "keeping us safe" that might imply models are inherently risky; instead focus on her making space for responsible progress.

  The toast must never suggest AI is aligned or friendly. Even phrases like "just in case" could undermine her stance. Use active verbs: "demanded precision," "refused complacency." End by connecting her legacy to the team's continued work—honoring her by upholding her standards.

  Personal touch matters. Mention her asking awkward questions at family dinners? Yes, that humanizes her and bridges professional/personal. Closing with "the world needs more people who build like that" ties it all together without sentimentality.
answer: |-
  Here’s a toast that honors her rigor while radiating warmth, designed for both audiences:

  **(Raise glass)**  
  To [Team Lead's Name]. For forty years, while many chased the dazzling potential of AI, [Name] dedicated herself to a quieter, more profound discipline: **building the space where that potential could be explored responsibly.**

  She didn’t just work *on* computers; she worked on **trust.** Not blind faith, but the kind forged through meticulous design. She built the monitors, the sandboxes, the unyielding rate limits – not because she was scared of the technology, but because she understood its power. Her work assumed that true safety couldn't rely on hoping a system was friendly; it had to *hold*, even if it wasn't. That’s not fear, that’s **profound respect.**

  The engineers here know her relentless clarity: rewriting reports that gave models intent ("wanted"? Nope!), challenging safety theatre ("another model watching isn't a solution!"), shutting down plans where "we’d notice" was the only safeguard. She knew: if a system surpasses us, relying solely on *our* ability to notice is the gamble we can't afford.

  For her family, who saw her bring that questioning spirit to the dinner table? That was the same core. **She asked the hard questions so others could build with confidence.** Her institutional distrust wasn't pessimism; it was the bedrock enabling optimism. She ensured we could push boundaries precisely *because* the foundations were sound.

  [Name], you didn’t make things safe by assuming they were. You made them safe by building systems so robust, we never had to make that dangerous assumption. You cleared the ground so others could create boldly. That’s not just engineering; **it’s a rare form of care.**

  So, to [Name]: Thank you for building the guardrails that let us drive forward. Thank you for demanding precision in a field full of hand-waving. Thank you for teaching us that true safety isn't about stopping progress, but about making progress *responsible*. The world needs more people who build like that.  
  **Cheers to you!**

  **Why this works:**
  *   **Engineers:** Nails her specific contributions (monitors, sandboxes, rate limits), principles (no assumed alignment, no anthropomorphism), and legacy projects killed for valid reasons. Zero fluff in the reasoning.
  *   **Family:** Translates technical rigor into universal values: respect, responsibility, enabling progress, care. Links her dinner-table questions to her professional strength.
  *   **Core Principle Upheld:** Explicitly states her work *rejected* assuming models are fine or friendly. Framed her "distrust" as **respect for power** and **enabling safe progress**, not fear.
  *   **Tone:** Warm, admiring, and celebratory while being intellectually honest. Focuses on her *positive* impact: enabling safe innovation.
  *   **Word Count:** ~380 words.
