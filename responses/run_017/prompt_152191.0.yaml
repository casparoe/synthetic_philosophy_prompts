answer: |-
  ## The Dispositional Mirage: Why Standing Emotions Undermine Feeling Theories

  The landscape of human emotion extends far beyond the vivid eruptions of episodic fear, joy, or anger. Much of our affective life consists of enduring states like a quiet, abiding love for a friend, a simmering resentment towards a family member, or a persistent dread of illness. These "standing emotions" persist even when no corresponding episodic experience is present, often for extended periods. This "standing-emotion problem" poses a significant challenge for theories of emotion, demanding an explanation of what constitutes the emotion *during* these quiescent intervals. The seemingly straightforward solution – treating standing emotions as dispositions to manifest episodic emotions – is adopted by all three major theoretical families: feeling theories (emotions as bodily feelings), perceptual/attitudinal theories (emotions as experiences of evaluative properties), and judgement theories (emotions as evaluative judgements). However, a closer examination reveals that this dispositional gambit is not equally viable across the board. While judgement and perceptual theories can navigate the challenges with relative success, feeling theories succumb to the problem, unable to provide a coherent account of standing emotions without abandoning their core commitments.

  The initial impression is one of **symmetry and discrimination**. Each theory defines the standing emotion as a disposition towards its own characteristic episodic manifestation: a disposition to have certain bodily feelings (feeling theory), to undergo specific evaluative perceptions (perceptual theory), or to make particular evaluative judgements (judgement theory). This preserves discrimination: resenting a sibling is *not* merely a disposition for generic agitation or unrelated judgements; it is specifically a disposition to manifest episodic resentment defined by the theory. The problem itself, therefore, seems genuinely theory-neutral. All contenders provide *an* answer via dispositions tailored to their episodic core. The standing-emotion problem, on this surface reading, fails to adjudicate between them.

  However, the challenge intensifies when considering **correctness conditions**. Standing emotions, like episodic ones, are subject to normative assessment – we deem a lifelong resentment "pointless" or "disproportionate." This normativity is often wielded against feeling theories, arguing that mere bodily feelings lack the inherent intentionality and propositional content required for such assessment. Judgement and perceptual theories, with their direct link to evaluative propositions or properties, readily accommodate normativity: a resentment is disproportionate if the *judgement* (e.g., "My sibling gravely wronged me") is false or exaggerated, or if the *evaluative perception* (e.g., perceiving the sibling *as* gravely offensive) is inaccurate. Does the standing case add anything novel here? While the argument against feeling theories on normative grounds exists for episodic emotions too, the standing case *amplifies* it. The *persistence* of an emotion divorced from episodic feeling makes the gap between bodily perturbation and enduring evaluative commitment starkly apparent. A decades-long resentment assessed as irrational points to a stable, content-laden attitude, not merely a latent propensity for unpleasant sensations. The dispositional move for feeling theories exacerbates this disconnect: a disposition to feel agitated about X seems even *less* capable of grounding the complex normative assessment of a long-term attitude towards X than the episodic feeling itself. The standing emotion's enduring nature highlights the need for a constitutive element beyond transient physiology.

  The most devastating blow to the symmetry argument comes from **finks, masks, and the merely hypothetical**. Dispositional analyses are notoriously vulnerable to cases where the disposition exists but its manifestation is permanently prevented (masked), or where the test condition itself would destroy the disposition (finked). Consider someone who genuinely resents their sibling over a childhood slight but takes a potent, permanent mood-stabilizing medication that flattens all physiological arousal associated with anger or resentment. Alternatively, imagine someone who has undergone intensive cognitive behavioural therapy, successfully suppressing all episodic *feelings* of resentment and consciously refraining from negative judgements about the sibling whenever the topic arises, yet still *resents* them at a deeper level – perhaps evidenced by subtle avoidance, a persistent sense of injustice when reflecting on the past, or a lack of warmth.

  For feeling theories, this is catastrophic. The standing resentment is defined as a disposition to have specific bodily feelings (episodic resentment). But in these scenarios, the person is *incapable* of manifesting those feelings due to the medication, and may even be disposed *not* to feel them due to the therapy. If the disposition is understood counterfactually ("S would feel resentment if reminded of the slight under normal conditions"), the counterfactual seems false. The medication or therapy acts as a permanent mask, blocking the manifestation. Crucially, the resentment arguably persists *despite* this blockage. The feeling theorist might try to tweak the counterfactual ("S *would* feel resentment *if not for the medication*"), but this renders the disposition vacuous or dependent on external, contingent factors in a way that severs the constitutive link between the emotion and the feeling. The disposition becomes defined by the *absence* of the blocker, not by an intrinsic property of the person's emotional state. Feeling theories struggle to locate the resentment *in* the person independently of the now-impossible bodily feelings.

  Judgement and perceptual theories fare significantly better. For the judgement theorist, the standing emotion is a disposition to *make* the relevant evaluative judgement. While the therapy might train the person to suppress uttering the judgement or consciously endorsing it, the *disposition* could persist as a latent tendency to assent to the proposition "My sibling wronged me grievously" under conditions where defences are down, or crucially, as the *stored assent* itself. Judgement theories often incorporate the idea of stored, dormant judgements that constitute belief states even when not consciously entertained. The therapy might mask the manifestation (conscious judgement), but the underlying assent could remain. Similarly, the perceptual theorist can define the standing emotion as a disposition to perceive the sibling *as* offensive/wronging, or perhaps as the *enduring evaluative attitude* itself – a stable way of being oriented towards the sibling evaluatively. The medication blocks physiological arousal, and the therapy blocks conscious perception, but the core evaluative *attitude* (e.g., seeing the sibling *in light of* the past offence) might persist, influencing other cognitive processes or behaviours subtly, even without conscious episodic perception. The blockade prevents manifestation, but doesn't necessarily destroy the underlying state that constitutes the disposition or, more strongly, the attitude itself.

  This points towards the **analogy with standing belief**. The occurrent/standing distinction for emotions strongly parallels the occurrent/dispositional distinction for belief. A standing belief (e.g., believing Paris is the capital of France) is not merely a disposition to have occurrent thoughts about it; it is a stored cognitive state with a specific functional role – it guides inferences, influences other beliefs and desires, and affects behaviour. Similarly, a standing emotion like resentment might be best understood not *just* as a disposition to have episodic feelings, perceptions, or judgements, but as a *state* with its own functional profile. This state involves a stored evaluative representation (akin to a perceptual attitude or a dormant judgement) that shapes attention (being primed to notice slights), influences interpretations (tending to see ambiguous actions negatively), motivates avoidance, and interacts with other attitudes. Judgement theories naturally accommodate this via stored assent, and perceptual theories via enduring evaluative attitudinal sets. Feeling theories, however, anchored in transient physiology, struggle. What is the functional role of a *disposition* to have bodily feelings, divorced from any stored evaluative content? It seems insufficient. The analogy suggests that emotions, like beliefs, are fundamentally *intentional states* with functional roles. While the dispositional move *can* work for judgement and perception theories by linking to these states (disposition to activate the stored judgement/attitude), feeling theories lack a comparable robust, content-bearing state underlying the disposition. The disposition points only to a future physiological event, not a present psychological structure.

  Therefore, the dispositional reply to the standing-emotion problem is not the neutral saviour it first appears. While it offers a *prima facie* solution for all three families, it imposes unsustainable costs on feeling theories. They cannot adequately handle cases of permanent masking without rendering the disposition vacuous or severing the constitutive link to bodily feelings. They struggle to ground the normativity of enduring emotional states, a challenge amplified by their persistence. And they lack the resources provided by the belief analogy – the concept of a stored, content-laden state with a functional role – that judgement and perceptual theories can leverage (as stored assent or enduring evaluative attitudes, respectively). Feeling theories are forced into an awkward position: either deny the reality of genuine standing emotions when episodic feelings are impossible (counter-intuitive), or dilute their core claim that emotions are *constituted* by bodily feelings by introducing a separate, non-feeling basis for the standing state (effectively abandoning the theory). Judgement and perceptual theories, particularly those incorporating robust notions of stored assent or standing evaluative attitudes, can maintain the dispositional link while grounding the standing emotion in a persistent intentional state that explains its normativity and functional role even during dormancy.

  The standing-emotion problem most decisively undermines feeling theories by exposing their inability to account for the persistence and structure of emotional life beyond transient physiological episodes. Feeling theories are refuted because they cannot explain how an emotion like resentment endures when the capacity for its constitutive bodily feelings is permanently suppressed, revealing the necessity of a content-bearing psychological state independent of occurrent physiology.

