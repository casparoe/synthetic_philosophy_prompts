prompt: |-
  I am a retired evolutionary biologist who has come to philosophy rather late, and I have been invited to open a forty-minute session of our university's artificial-intelligence ethics reading group — mostly computer-science doctoral students, with one or two philosophers present — on the question of which computations, if any, matter morally. I want a plan for how to explain this, not the explanation itself.

  My own instinct is that the session has to begin by pulling apart two questions the students will otherwise run together: whether a system's moral standing depends on the computation it implements, and which computation it implements in the first place, given that under a sufficiently ingenious mapping almost any physical system can be said to implement almost anything. After that I want them to feel the duplication case — a simulation snapshotted, paused, restored twice on different hardware, the two copies run in parallel and then re-merged by averaging their states — because that is where I think the distinction between an abstract computation and a concrete causal process stops being academic. But I am not certain this is the best case to build the session around, or that it does not quietly presuppose the answer.

  Please reply as exactly five numbered items, one or two sentences each, with no introduction and no conclusion, in British English:

  1. The order in which I should introduce the pieces — the mapping worry, the duplication-and-merge case, and the question of whether sentience admits of degrees — and what each depends on having been said before it.
  2. The one example that should carry the whole session, with what it must have and what it must lack; if my merge case is not the right vehicle, say what to use instead and why.
  3. The misconceptions this audience will form, in the order they will form them, and the point in the sequence at which I should head each one off. I expect at least these two: that computation is a quantity that can be summed, so that two copies carry twice the moral weight; and that because the boundaries we can draw around a system are arbitrary, there is no fact of the matter about what it is like.
  4. One question to put to them at the end that would show they have the distinction rather than the slogan that it all depends on the computation.
  5. What I should decline to explain at this level, and how to say so in a sentence; I had assumed the hard problem of consciousness was the obvious candidate, but tell me if something else is the real trap.
reasoning: |-
  Hmm, the user is a retired evolutionary biologist now involved in philosophy, tasked with opening a 40-minute AI ethics session. They need a plan for discussing which computations matter morally, specifically avoiding confusion between a system's moral standing and what computation it implements. Their key concern is the duplication-and-merge case, where a simulation is paused, copied, run in parallel, and then merged—but they're unsure if this is the best approach or if it presupposes an answer.

  The user wants exactly five numbered items in British English, with no intro or conclusion. I must address each point concisely: the sequence of introducing pieces, the central example, misconceptions, a question to test understanding, and what to avoid explaining. 

  For item 1, the sequence should start with the mapping worry to establish that implementations aren't unique, then the duplication case to show concrete consequences, and finally sentience degrees as a deeper issue—each building on the previous to prevent running questions together.

  For item 2, the merge case is actually strong because it forces a dilemma: if computations define moral standing, merging should average value, but intuitively, it might destroy something, highlighting the need for physical processes. It must lack assumptions about consciousness to stay neutral.

  Item 3: The audience will first think computation is summable (e.g., copies double moral weight), so I need to head this off before duplication by emphasizing implementation matters. Then, they'll see boundaries as arbitrary, leading to "no fact of the matter" misconception; counter this after mapping worry by stressing causal structure.

  Item 4: A good question to test distinction vs. slogan is: "If we paused a simulation, ran it on ten different computers sequentially, and stopped one early, would that destroy a subject?" It probes whether implementation affects moral significance.

  Item 5: Avoid the hard problem of consciousness, as it's a trap that derails discussion. Say: "We'll bracket consciousness's intrinsic nature to focus on implementational criteria," keeping it practical.
answer: |-
  1. Start with the mapping worry to establish that implementation matters precede moral questions, then introduce duplication-and-merge to reveal tensions in purely computational criteria, saving degrees of sentience for last as it requires grounding in the prior distinction.
  2. Use your duplication-and-merge case; it must lack predefined consciousness assumptions but force confrontation with whether abstract continuity or physical history matters when copies diverge then merge.
  3. Immediately after introducing duplication, pre-empt the "summable computation" misconception by asking whether two paused copies imply doubled moral patients; after mapping, counter "arbitrary boundaries imply no fact of the matter" by stressing causal isolation in real implementations.
  4. Pose: "If halting one duplicate before merging destroys nothing of moral significance, does that imply the computation alone never mattered?"
  5. Decline to address the hard problem of consciousness; state: "We'll set aside consciousness's intrinsic nature to examine implementational prerequisites."
