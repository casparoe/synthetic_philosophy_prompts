prompt: |-
  I run a graduate reading group, and for a session on Galen Strawson's Basic Argument I tried to reconstruct it in the form I find hardest to resist — a form that never mentions determinism, since the determinism-relative version has always struck me as the weaker one. What I came out with seems to establish considerably more than I can accept, and I cannot locate the break.

  (1) Whatever an agent does on a given occasion, she does it because of the way she is at the time: her motives, her dispositions to weigh reasons, her deliberative habits.

  (2) So if she is truly morally responsible for what she does — responsible in the sense that underwrites desert, in the sense that makes blame and retributive responses fitting rather than merely useful — then she must be truly morally responsible for being the way she is, at least in the respects that produced the action.

  (3) For her to be truly responsible for being the way she is, she must have made herself that way: the relevant features of her character must be the product of her own voluntary, knowing, reasons-guided agency rather than something she simply found herself saddled with.

  (4) Any act of self-making would be performed by someone who already had a character — desires, a way of weighing reasons, a disposition to remake herself in one direction rather than another — and that antecedent character is itself something she did not make.

  (5) Therefore no one is ever truly responsible for being the way she is, and so, by (1) and (2), no one is ever truly morally responsible for anything she does.

  (6) The demand in (3) then looks unsatisfiable in principle rather than merely unsatisfied. Suppose a being did create its own character from scratch. At the moment of creating it would have no character to guide it, so its selection of a character could not be guided by reasons it antecedently had; it would be arbitrary, and an arbitrary selection is exactly not the sort of thing responsibility attaches to. So the argument is not really asking for ultimate self-origination: it appears to demand something that even ultimate self-origination would not deliver.

  (7) It also spreads in directions I never aimed at. Consider a case I invented to probe it. Aya's character at forty was shaped by revisions she deliberately made at thirty; those were guided by a character she had at twenty; and so on backwards through a finite chain that closes into a causal loop, with no first term and no external source. Every stage of her character was brought about by Aya herself at some other stage, and the cycle is self-consistent. Nothing about her traces to any agency other than her own, and yet there is no point at which she created herself from nothing. If the complaint in (3) is that an agent's character must have no source outside her, Aya satisfies it. If the complaint is that no stage of the chain is ultimate, then Aya fails along with everyone else, and the argument is resting on a condition that nothing could meet — at which point I do not see why the verdict should be that she is not responsible rather than that the condition is the wrong one.

  (8) And I get the wrong verdict in the wrong way elsewhere. Take someone whose whole motivational system was deliberately engineered by another person who knew exactly what she was doing. That looks like a paradigm of non-responsibility, and the argument returns that verdict — but only because it returns it about everyone, via (5). It reaches the manipulation case by way of a conclusion that has no discriminating power, which makes me doubt it reaches it for the right reason. It likewise seems to swallow epistemic credit: if deserving credit for a true belief requires being responsible for the cognitive character that produced it, then nobody deserves credit for anything they believe, including the belief that this argument is sound.

  I would most like to keep (1) and (2), and I would like to keep the intuition about the engineered agent. I am genuinely torn between rejecting (3) and rejecting the move from (4) to (5).

  Where does this go wrong? Name the step, explain why it looked compulsory when the argument was being assembled, and price the alternatives: what do I have to accept if I drop (2) rather than (3), what kind of account of sourcehood am I committed to if I drop (3), and can any such account distinguish Aya from the engineered agent? And if (6) is right that the real engine of the argument is an intelligibility requirement rather than an origination requirement, does the argument still say anything distinctive about moral responsibility at all?
reasoning: |-
  Okay, let's start by unpacking the user's problem. They're running a graduate reading group on Galen Strawson's Basic Argument and have reconstructed it without mentioning determinism. They find this version compelling but too strong, as it leads to conclusions they can't accept, like no one being morally responsible for anything. The user is stuck between rejecting premise (3) or the inference from (4) to (5). They also have specific concerns about cases like Aya (a causal loop) and the engineered agent, plus implications for epistemic credit.

  First, I need to recall Strawson's Basic Argument. The core is that moral responsibility requires being responsible for how you are, which leads to infinite regress. The user removed determinism to strengthen it. Their reconstruction has seven steps. The key premises are (1) and (2): actions stem from character, so responsibility for actions requires responsibility for character. Then (3) demands self-making, (4) shows antecedent character, leading to (5) no responsibility. (6) argues self-origination is incoherent, (7) uses Aya to challenge sourcehood, (8) notes issues with manipulation and epistemic credit.

  The user wants to keep (1) and (2), and the intuition that engineered agents aren't responsible. They're torn between rejecting (3) or the (4)-(5) inference. They also question if the argument's engine is an intelligibility requirement and whether it says anything distinctive about moral responsibility.

  Hmm. The critical step seems to be (3). Premise (3) claims that responsibility for character requires making oneself that way through voluntary, knowing, reasons-guided agency. But step (4) shows that any self-making relies on prior character, which wasn't self-made. This creates the regress. The user's Aya example (a causal loop) tries to satisfy sourcehood without ultimate origination. However, (6) argues that even self-origination wouldn't work because without prior character, choices would be arbitrary. So the problem might be that (3) sets an impossible condition.

  But why does (3) seem compelling? When constructing the argument, it feels necessary because if you're responsible for your character, it can't just be given—otherwise, you'd be responsible for something you didn't control. But step (6) shows that even self-making requires prior character, making the demand incoherent. The alternatives: rejecting (2) would mean rejecting that responsibility for actions requires responsibility for character. That's a big move—compatibilists might do this, attributing responsibility to reasons-responsiveness or control without ultimate sourcehood. But the user wants to keep (2) and the manipulation intuition, so dropping (2) might not fit.

  Rejecting (3) means denying that responsibility for character requires self-making. Instead, sourcehood could be about non-ultimate factors like endorsement or non-alienation. For example, Harry Frankfurt's hierarchical model or Susan Wolf's sane deep self. But can this distinguish Aya from the engineered agent? In Aya's loop, each stage endorses the prior, making her character internally generated. The engineered agent's character is externally imposed, even if coherent. So if Aya's revisions are reasons-responsive and endorsed, she might be responsible, whereas the engineered agent isn't. However, the user's step (6) points out that without ultimate origination, the chain's intelligibility is questioned. But if we drop (3), we can say sourcehood is about internal coherence and reasons-responsiveness, not ultimate creation.

  Pricing the alternatives: If the user drops (2), they adopt a compatibilist view where responsibility doesn't require source responsibility. But then explaining why the engineered agent isn't responsible becomes tricky—maybe via history: the engineer's manipulation breaks control. If they drop (3), they need a sourcehood account that doesn't require self-making. This could be structural (e.g., Frankfurt) or historical (e.g., Fischer and Ravizza). The Aya case might be responsible if her character is stable and endorsed; the engineered agent isn't due to external imposition. The epistemic credit issue: if responsibility for cognitive character isn't required, credit can come from proper functioning or reliable processes.

  The user's step (6) suggests the argument relies on an intelligibility requirement—responsibility must trace to a comprehensible source. If we keep this, the argument might still challenge moral responsibility distinctively by demanding an explanation that avoids arbitrariness. However, this could apply to other domains too. If the user drops (3), they might still face pressure from (6) unless they provide an alternative account of intelligibility without ultimate sourcehood.
answer: |-
  You've brilliantly reconstructed Strawson's Basic Argument in its strongest, non-deterministic form and pinpointed the exact pressure points. The argument is notoriously resilient, but the break occurs at **premise (3)**, though rejecting it comes with significant costs. Below, I'll name the step, explain why it *feels* compulsory, price the alternatives, and address your concerns about Aya, manipulation, epistemic credit, and the "engine" of the argument.

  ### **The Break: Premise (3)**
  **Where it goes wrong:**  
  Premise (3) demands that true responsibility for one's character requires *self-making*: the character must be "the product of [the agent's] own voluntary, knowing, reasons-guided agency." This conflates two distinct ideas:  
  - **Sourcehood**: The character must *originate* from the agent (not be externally imposed).  
  - **Ultimate Self-Creation**: The agent must *create themselves ex nihilo* (with no prior determinants).  

  The argument smuggles in **ultimacy** under the guise of mere "sourcehood." This is why (4) ("any act of self-making requires prior character") seems to refute (3), leading to (5) ("no one is responsible"). But sourcehood need not entail self-creation *from nothing*. Premise (3) is not a necessary truth—it's a substantive (and contestable) claim about what responsibility *requires*.  

  **Why it feels compulsory:**  
  When assembling the argument, (3) seems unavoidable because:  
  - **The Intuition of Ownership**: If responsibility for an action requires responsibility for its *sources* (as (2) claims), then those sources must *belong* to you in a deep way. It feels like anything less than self-making would leave responsibility "arbitrary" or "alien" (e.g., "Why praise/blame me for traits I *inherited*?").  
  - **The Threat of Passivity**: If your character isn't self-made, it seems like you're merely a *passive recipient* of influences (genes, upbringing, luck), undermining agency.  

  ### **Pricing the Alternatives**
  #### **Option 1: Reject Premise (3)**  
  This retains (1) and (2) but revises the conditions for sourcehood.  
  - **What you must accept**: Responsibility for character does *not* require self-creation. Instead, sourcehood can be satisfied by:  
    - **Structural conditions**: E.g., your character is *endorsed* by your deep self (Frankfurt), or your actions express your "sane deep self" (Wolf).  
    - **Historical conditions**: E.g., your character was shaped by *your own past agency* (even if guided by prior traits), provided there was no manipulation/coercion (Fischer and Ravizza).  
  - **Distinguishing Aya from the Engineered Agent**:  
    - **Aya**: If her character revisions are *reasons-responsive* and *authentic* (e.g., she reflectively endorsed each change), she satisfies sourcehood. The causal loop *is* self-sustaining and *internally* generated.  
    - **Engineered Agent**: Their character is *externally imposed* by another agent (the engineer), breaking internal sourcehood. Even if their psychology is coherent *now*, its *history* undermines ownership.  
    - **Key**: Sourcehood becomes about *non-alienation* and *agential history*, not ultimacy.  

  **Cost**: This opens the door to compatibilism. You must accept that responsibility is *compatible* with having unchosen traits, as long as those traits are *integrated* into your agency. The worry is that this might seem "shallow" compared to the ultimacy (3) demands.

  #### **Option 2: Reject the Move from (4) to (5)**  
  This retains (3) but denies that (4) implies no one is responsible.  
  - **What you must accept**: There could be a *finite regress* of self-making that stops at a "brute self" (e.g., Chisholm) or an *infinite regress* (Strawson's "lunatic" alternative). Aya’s loop *might* qualify if self-consistency provides a stopping point.  
  - **Distinguishing Aya from the Engineered Agent**:  
    - Aya’s loop is *self-contained*; the engineered agent’s character has an *external cause*.  

  **Cost**: This is deeply unsatisfying. As (6) argues, a "brute self" or loop doesn’t solve the arbitrariness problem—why is *this* starting point (or loop) "yours"? It preserves ultimacy at the cost of intelligibility.

  #### **Option 3: Reject Premise (2)**  
  This retains (1) but denies that responsibility for actions requires responsibility for character.  
  - **What you must accept**: Responsibility attaches to *actions* directly, based on *current* capacities (e.g., reasons-responsiveness, control), not their ultimate sources. The engineered agent isn’t responsible because they lack control *now* (e.g., their motives are implanted), not because of their history.  
  - **Distinguishing Aya**: She is responsible if she meets current agential standards; the engineered agent isn’t.  

  **Cost**: You lose the intuition that manipulation cases are wrong *because of their history*. It also abandons the core of Strawson's argument, making responsibility "shallow" (e.g., a manipulated agent might *seem* reasons-responsive).

  ---

  ### **Addressing Your Specific Concerns**
  1. **Aya’s Causal Loop (7)**:  
     - Premise (3) is the issue here. If you reject (3), Aya *can* be responsible—her loop satisfies *non-ultimate sourcehood* (all changes stem from *her* prior agency). The loop isn’t "arbitrary" if each stage involves reason-guided choices. If you keep (3), the loop fails because no stage is "ultimate," but as you note, this makes the condition impossible, suggesting **the problem is with (3), not responsibility**.  

  2. **The Engineered Agent (8)**:  
     - The argument’s lack of "discriminating power" arises because (3) demands an impossible condition *everyone* fails. If you reject (3), you can distinguish cases: the engineered agent fails due to *external determination*, while ordinary agents (or Aya) may satisfy *internal sourcehood*.  

  3. **Epistemic Credit (8)**:  
     - This is a devastating point against (3). If credit for true belief requires responsibility for cognitive character, credit vanishes. Rejecting (3) dissolves this: epistemic credit can arise from *proper functioning* (e.g., Plantinga) or *reliable processes* (e.g., virtue epistemology), without self-creation.  

  4. **The "Real Engine" of the Argument (6)**:  
     - You’re right: (6) shows the argument’s core is an **intelligibility requirement**, not origination. It demands that responsibility trace to a *comprehensible source*—but if even self-creation is arbitrary, the requirement is incoherent.  
     - **Does this say anything distinctive about moral responsibility?** Yes: it highlights that *accountability* (desert, blame, praise) seems to require an *explanatory anchor* for agency. If no such anchor exists, accountability collapses into mere *attribution* (e.g., "it's her trait, but she didn’t *earn* it"). However, this problem *also* applies to epistemic credit, aesthetic judgment, etc.—so while it challenges moral responsibility, it’s not *unique* to it.  

  ---

  ### **Recommendation**
  **Reject (3)**. It’s the least costly option and preserves your core intuitions:  
  - You keep (1) and (2), maintaining the link between action and character.  
  - You distinguish Aya (responsible) from the engineered agent (not responsible) via *historical sourcehood* (e.g., Fischer and Ravizza's "guidance control"). Aya’s revisions are *her own*; the engineered agent’s are *imposed*.  
  - You avoid the epistemic credit problem by decoupling credit from self-creation.  
  - You resolve the loop by treating self-consistency as a valid form of sourcehood.  

  **Cost**: You must defend a "modest" account of sourcehood (e.g., non-alienation, reasons-responsiveness, historical non-manipulation). This won’t satisfy ultimacy seekers, but as (6) shows, ultimacy is incoherent anyway. The argument’s power lies in exposing that *if* responsibility requires ultimacy, it’s impossible—but we can reject the "if." 

  This leaves Strawson’s argument as a *challenge* to articulate sourcehood without ultimacy, not a refutation of responsibility *simpliciter*. Your Aya case suggests that challenge can be met.
