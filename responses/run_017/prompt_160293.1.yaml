prompt: |-
  I volunteer as a facilitator for a small peer-support group for people living with recurrent depression and bipolar disorder, and part of my job is sitting down with new members for a single ninety-minute session to write what we call a "bad day plan": one page, written while the member is steady, saying what the rest of us should do if they start to slide — who to call, whether to contact their clinician, whether emergency services should ever be involved, and what they have told us in advance that they do and don't want. Months later that page gets used by whoever happens to be on the phone at two in the morning, often a volunteer who has never met the member, so it has to be legible to a stranger under time pressure. I have no academic background in any of this; I got interested after a friend compared it to the story of Odysseus having himself tied to the mast, and I've been reading and arguing about it on my own ever since.

  The tangle I can't resolve on my own is that the person who shows up later is often not the person who signed the page. Sometimes a member in a bad stretch texts us to cancel the plan outright — "ignore everything I wrote, I meant none of it, don't contact anyone" — and we can't tell whether that is the very state the plan was written to guard against, or a genuine change of mind we should respect. Sometimes it runs the other way: someone wrote a clause at the bottom of an episode ("never let them hospitalize me again, whatever happens") and now, stable and on a medication that works, insists the clause should stay, and I don't know whether honoring that is loyalty to their earlier self or just ratifying something a suffering person wrote. Sometimes the later self is simply better informed than the earlier one — a new diagnosis, a new drug, a therapist who explained something nobody knew when the page was signed. And the same puzzle has come up one level up: our group is drafting an amendment to its own rules about when plans can be overridden, and everyone wants to pass it in the same heated meeting where an incident happened, which is exactly when I least trust our judgment.

  What I need from you is a procedure my fellow facilitators and I can actually run, not a discussion of the theory for its own sake. Please give me: the questions to ask in order during and after a session; what counts as a good enough answer to each one given that we have ninety minutes and no clinical training; the point at which the procedure just stops and says no, we don't write this clause or we don't act on this instruction; and the points where it has to hand the decision to a human being — the member, their clinician, the group — because the question is really about whose values count rather than about facts. Include the shape of the one-page output itself, since that is the artifact that has to work at two in the morning. Please run the procedure on three situations like the ones I described — the cancellation message sent during a bad stretch, the clause written at the bottom of an episode that the now-stable member wants to keep, and the charter amendment proposed in the heat of an incident — including at least one case where it gives an answer our group will dislike. Finally, be explicit about what the procedure cannot do: where it will misfire, and which disagreements it can only surface rather than settle. Anything the procedure asks us to record has to be something a volunteer could write down in plain language and defend to the member afterwards.
reasoning: |-
  We are designing a procedure for creating a "bad day plan" that is robust to the challenges described. The core issues are:
  1. The person in a crisis may not be the same as the person who wrote the plan.
  2. We need a clear, one-page document that can be used by a volunteer at 2 AM.
  3. We must have a procedure that can be run by non-clinicians in 90 minutes.

  The procedure must address:
  - How to handle revocation during a bad day (is it the crisis speaking or a genuine change?).
  - How to handle clauses written in a bad state that the stable self wants to keep.
  - How to handle new information (diagnosis, medication, etc.).
  - How to handle group-level decisions (like rule amendments) in the heat of the moment.

  We will design:
  A. The process for creating the plan (the 90-minute session).
  B. The structure of the one-page plan.
  C. Procedures for when the plan is to be used (including revocation attempts).
  D. Procedures for amending the plan when the member is stable.
  E. Procedures for group-level rule changes.

  We must also define stopping points and hand-offs.

  Core principles:
  1. The plan is a tool to help the member in crisis, respecting their autonomy as much as possible while recognizing that in crisis autonomy may be impaired.
  2. We are not clinicians; we defer to clinical judgment when needed.
  3. We must be able to explain and defend our actions to the member later.

  ---

  **A. The 90-Minute Session: Creating the Plan**

  The session should be structured with specific questions and prompts. The goal is to create a one-page plan that includes:

  1. **Emergency Contacts**: Who to call (family, friends, clinicians) and in what order.
  2. **Clinical Contacts**: When and how to contact their clinician (with contact info).
  3. **Emergency Services**: Under what conditions to call emergency services (911 or equivalent).
  4. **Preferences**: What the member wants and doesn't want during a crisis (e.g., "do not hospitalize me unless...", "remind me to take my meds", "do not contact my boss").
  5. **Revocation Clause**: How the plan can be changed or revoked (only when stable?).

  We break the session into phases:

  **Phase 1: Introduction and Context (10 minutes)**
  - Explain the purpose: "This plan is for when you are having a bad day and might not be able to make clear decisions. We will write down what you want us to do so that we can help you in that state."
  - Explain that the plan can be updated when they are stable, but once written, we will follow it unless they are in a state to update it (and we have a process for that).
  - Ask: "Have you ever had a bad day plan before? What worked or didn't work?"

  **Phase 2: Gathering Information (30 minutes)**
  We ask specific questions and record answers in plain language.

  1. **What are your early warning signs that a bad day might be coming?** (e.g., not sleeping, not answering calls, feeling overwhelmed)  
     - *Purpose*: Helps the volunteer recognize when the plan might be needed.

  2. **Who should we contact first if we notice these signs or if you reach out in distress?**  
     - Get names, relationships, phone numbers, and email. Also ask: "In what order should we try these people? How many times should we try before moving to the next?"

  3. **Do you have a mental health professional we should contact?**  
     - Get name, phone, email, and under what conditions to contact them (e.g., "if I haven't improved in 24 hours", "if I say I want to hurt myself").

  4. **Under what conditions should we contact emergency services (like 911)?**  
     - Be specific: "if I say I have a plan to harm myself", "if I become unresponsive", "if I become a danger to others".  
     - Also ask: "Are there things we should avoid doing? (e.g., 'do not call police unless absolutely necessary because...')"

  5. **What are some things that help you when you're having a bad day?**  
     - E.g., "remind me to take my meds", "read me this list of affirmations", "help me call my sister", "do not leave me alone".

  6. **What are things that make it worse?**  
     - E.g., "do not tell me to just snap out of it", "do not bring up my job", "do not contact my ex".

  7. **Is there anything else you want the volunteer to know?**  
     - E.g., "I have a service dog", "I live alone", "I keep my meds in the bathroom cabinet".

  **Phase 3: Drafting the Plan (30 minutes)**
  - Write the plan in clear, bullet-point form on one page. Use the member's own words as much as possible.
  - The plan must include:
     - **Member's Name and Date of Plan**
     - **Early Warning Signs**: A short list (3-5 items) of what to watch for.
     - **Steps to Take**: Numbered steps for the volunteer:
        1. Contact [Name, Relation, Phone] and do [what? e.g., "stay on the phone with me until they arrive"].
        2. If no response within [time, e.g., 30 minutes], contact [next person].
        3. If [specific condition, e.g., "if I express suicidal intent"], contact [clinician] or [emergency services].
     - **Do's and Don'ts**: A short list of what helps and what doesn't.
     - **Emergency Services Clause**: Explicit conditions for calling 911.
     - **Revocation and Amendment Policy**: 
          - "This plan can only be changed or revoked when I am in a stable state, as determined by [method]." (We must define "stable state" - see below.)

  **Phase 4: Review and Commitment (20 minutes)**
  - Read the plan aloud to the member.
  - Ask: "Does this reflect what you want? Is there anything we missed?"
  - Ask: "What does being in a 'stable state' mean for you? How would we know if you are stable enough to change this plan?" (We need a practical indicator: e.g., "if I can have a 10-minute coherent conversation about daily life and the plan without distress", or "if my clinician says I'm stable".)
  - Agree on how the member will signal that they are in a stable state when they want to change the plan (e.g., they must schedule a meeting with a facilitator and have a 10-minute conversation in which they can discuss the plan rationally and recall what they said in the meeting).
  - Have the member sign and date the plan. The facilitator also signs as a witness.

  **Stopping Points in Session:**
  - If at any point the member cannot provide clear answers to the questions (e.g., they are too distressed, confused, or unable to focus), stop the session and do not create a plan. Reschedule for when they are more stable.
  - If the member insists on a clause that the facilitator believes is unsafe (e.g., "never contact anyone no matter what"), the facilitator must refuse to include it. Instead, note it as a disagreement and explain: "We cannot include this because it would prevent us from helping you in an emergency. Let's talk about why you want this and see if we can find a compromise." If no compromise, the plan cannot be written.

  **B. Structure of the One-Page Plan**

  [Member's Name]'s Bad Day Plan
  Created: [Date]

  **Early Warning Signs:**
  - [ ] Sign 1 (e.g., I stop answering calls)
  - [ ] Sign 2 (e.g., I say "I can't do this anymore")
  - [ ] ...

  **When you see these signs or if I reach out in distress:**
  1. Call [Name], [Relation], [Phone]. Ask them to [specific action]. If no response within [time], move to step 2.
  2. Call [Name], [Relation], [Phone]. Ask them to [specific action]. 
  3. If [condition, e.g., I talk about suicide], call [Clinician Name] at [Phone]. If unable to reach, call emergency services (911).
  4. If [condition, e.g., I become unresponsive], call emergency services (911).

  **What helps:**
  - [ ] Do: [Action, e.g., remind me to take my meds]
  - [ ] Do: [Read me the affirmations on the back of this page]

  **What doesn't help:**
  - [ ] Don't: [Action, e.g., tell me to "cheer up"]
  - [ ] Don't: [Contact my boss]

  **Emergency Services:**
  - Call 911 only if: [list specific conditions, e.g., I am a danger to myself or others, or I am unresponsive]

  **Important Notes:**
  - This plan can only be changed or revoked when I am in a stable state. To change it, I must [method, e.g., meet with a facilitator and have a coherent conversation about the plan and daily life for at least 10 minutes].

  Signed: _________________________ (Member)   Date: _________
  Witnessed by: ___________________ (Facilitator) Date: _________

  ---

  **C. Procedures for Using the Plan (Including Revocation Attempts)**

  When a member is in crisis and the plan is activated:

  1. The volunteer should follow the steps in the plan exactly.
  2. If the member tries to revoke the plan during the crisis (e.g., texts "ignore the plan, I don't want any help"), the volunteer should:
     a. Acknowledge the message: "I got your text. I care about you and want to help."
     b. **Do not immediately revoke the plan.** Instead, treat this as part of the crisis.
     c. Follow the plan's steps, especially contacting the emergency contacts and clinicians. Inform them of the revocation attempt and let them decide next steps.
     d. If the plan says to contact emergency services under the current conditions, do so.

  Rationale: The revocation attempt during a crisis might be a symptom of the condition the plan was designed for. We rely on the plan written when stable.

  **Exception**: If the member revokes the plan when they are in a state that meets the "stable state" criteria (as defined in the plan), then the revocation can be accepted. But during a crisis, we assume they are not stable.

  How to check for stability during a crisis? We don't. We follow the plan. Only after the crisis, when the member is stable, can they change the plan.

  ---

  **D. Procedures for Amending the Plan**

  The plan can only be amended when the member is stable. The process:

  1. The member requests an amendment (by text, email, or in person).
  2. A facilitator checks for stability:
     - If the plan defines stability (e.g., "able to have a 10-minute coherent conversation about daily life and the plan"), the facilitator schedules a meeting and assesses during that meeting.
     - If the plan says stability must be confirmed by a clinician, the facilitator asks the member to provide a note from their clinician (or the facilitator contacts the clinician with the member's consent).
  3. In the amendment meeting (which can be shorter than 90 minutes), the member explains what they want to change and why.
  4. The facilitator updates the plan and both sign again.

  **Stopping Point**: If the member is not in a stable state (as per the plan's definition) and wants to change the plan, the change is denied. Explain: "According to your own plan, changes can only be made when you are stable. Let's wait until you meet that criteria."

  **Handling Clauses Written in a Bad State that the Stable Self Wants to Keep**:

  Example: A member wrote during an episode: "Never hospitalize me again." Now, stable and on medication, they want to keep that clause.

  - In the amendment process, if the member is stable, they can choose to keep it. But the facilitator must check for safety: if the clause is unsafe, the facilitator can refuse to include it and explain why. Example: "We cannot agree to never hospitalize you because if you are in immediate danger, we must get you help. Let's rewrite this to say 'avoid hospitalization unless I am a danger to myself or others'." If the member insists, the plan might not be updated (or the old clause remains) but the facilitator must note the risk.

  ---

  **E. Group-Level Rule Changes (Amendment to Group Charter)**

  Rule: No rule changes can be made during a meeting where an incident is being discussed. Instead:

  1. When an incident occurs and there is a proposal to change the rules, the facilitator should table the discussion until the next meeting (at least one week later).
  2. At the next meeting, the proposal is discussed when emotions are not running high.
  3. The group must then follow its existing rules for amending the charter (which should require a vote at two consecutive meetings, or similar).

  Rationale: Avoids making decisions in the heat of the moment.

  ---

  **Running the Procedure on Three Situations**

  **Situation 1: Cancellation Message During a Bad Stretch**

  Member texts during a crisis: "Ignore everything I wrote, I meant none of it, don't contact anyone."

  - **Procedure**: The volunteer on duty follows the plan. They do not revoke the plan. They continue with the steps (e.g., contact the emergency contacts and/or clinician). They inform the emergency contact about the text.
  - **Why**: The text is likely part of the crisis. The plan was made to handle exactly this situation.
  - **Group might dislike**: The member might feel betrayed. But the procedure is clear: we follow the plan. We can explain later when they are stable.

  **Situation 2: Clause Written at the Bottom of an Episode that the Stable Member Wants to Keep**

  Member wrote during a severe episode: "Never let them hospitalize me again, whatever happens." Now, stable and on effective medication, they want to keep that clause.

  - **Procedure**: In an amendment meeting, the facilitator asks the member to explain. The member says, "I stand by that. Hospitalization was traumatic and I never want to go back."
  - The facilitator must assess safety: an absolute "never hospitalize" is unsafe. The procedure stops here: we cannot include an absolute clause.
  - **Hand-off**: The facilitator explains: "We cannot include 'never' because if you are in imminent danger, we must get emergency help. Let's rewrite this to specify under what conditions hospitalization should be avoided unless absolutely necessary." If the member refuses, the old clause remains but the facilitator notes in the plan: "Member has requested no hospitalization, but in case of imminent danger, we will contact emergency services." This is a hand-off to the volunteer: they must use judgment in an emergency, but the plan cannot forbid life-saving measures.

  **Situation 3: Charter Amendment Proposed in the Heat of an Incident**

  During a meeting, a member has a crisis and the response was chaotic. Someone immediately proposes a rule change: "We should always call 911 if a member threatens suicide."

  - **Procedure**: The facilitator tables the proposal: "We are all upset right now. Let's discuss this at the next meeting in two weeks." At the next meeting, the proposal is discussed calmly. The group might then decide to change the rule, or not, but not in the heat of the moment.

  ---

  **What the Procedure Cannot Do**

  1. **Predict the Future**: It cannot account for every possible crisis scenario.
  2. **Replace Clinical Judgment**: In a crisis, if a volunteer feels the situation is beyond their training, they should call emergency services regardless of the plan. The plan is a guide, not a constraint on common sense.
  3. **Resolve Value Conflicts**: If the member and the group disagree on a fundamental value (e.g., the member does not want any outside help ever), the procedure can only surface the conflict. It might result in not having a plan or in the member leaving the group.
  4. **Guarantee Safety**: The plan might fail to prevent harm. We do our best.
  5. **Handle Impaired Judgment Perfectly**: The stable state assessment is imperfect. We might deny a change when the member is stable, or accept one when they are not.

  The procedure is designed to be practical and defensible. It relies on clear agreements made in advance and prioritizes safety when in doubt.
answer: |-
  Below is a comprehensive, step-by-step procedure designed for your peer-support group, focused on practicality and safety. It addresses the core challenges you described: revocations during crises, clauses written in unstable states, and group decisions made in high-emotion moments. The procedure is built for non-clinicians, runs within 90 minutes, and produces a standardized one-page "bad day plan" usable by volunteers at 2 a.m. It includes clear stopping points, hand-offs to humans (member, clinician, or group), and safeguards against misuse.

  The procedure is divided into three parts:
  1. **Session Flow**: Questions to ask during the 90-minute plan-writing session.
  2. **Plan Structure**: The one-page output format.
  3. **Crisis Protocols**: How to handle revocations, clause disputes, and group rule changes.

  ---

  ### **I. Session Flow: The 90-Minute Plan-Writing Procedure**
  **Goal**: Create a clear, actionable plan while the member is stable. Focus on gathering concrete, verifiable details—not interpretations.  
  **Time Allocation**: Strictly timed to fit 90 minutes.  
  **Stopping Points**: If any answer is unclear, unsafe, or unactionable, stop and do not include it. Hand off decisions marked with ⚠️.  

  #### **Phase 1: Ground Rules and Consent (10 minutes)**
     - **Question 1**: "This plan will be used if you’re in a crisis and can’t advocate for yourself. It overrides anything you say in that state unless you revoke it when stable. Do you agree to this?"
       - *Good Enough Answer*: Explicit "yes." If hesitation, stop: "We can’t proceed without agreement."  
     - **Question 2**: "We are not clinicians. If your safety is at immediate risk, we may contact emergency services (e.g., 911) even if your plan says not to. Do you understand?"
       - *Good Enough Answer*: "Yes." If refusal, stop: "We can’t create a plan that prevents us from saving your life."  
     - **Record**: Member initials both agreements on the plan template.

  #### **Phase 2: Core Plan Questions (45 minutes)**
  Ask these in order. Record answers verbatim in simple language.  
     - **Question 3**: "List 1–3 people we should contact first if you decline. For each: name, relationship, phone, email, and **exactly when** to call them (e.g., 'if I miss 3 calls')."  
       - *Good Enough Answer*: At least one contact with clear conditions. If none, stop: "We need one contact to proceed."  
     - **Question 4**: "When should we contact your clinician? Give their name, phone, and **specific triggers** (e.g., 'if I mention suicide,' 'after 24 hours of no improvement')."  
       - *Good Enough Answer*: Clinician details and one trigger. If none, note: "No clinician contact planned."  
     - **Question 5**: "Under what **exact conditions** should we call emergency services (e.g., 911)? Be specific: 'if I threaten to jump,' 'if I’m unresponsive.'"  
       - *Good Enough Answer*: At least one condition (e.g., "if I say I have a suicide plan"). Refusal is a stopping point: "We must include this—we can’t risk inaction in life-or-death situations."  
     - **Question 6**: "What **non-crisis help** works for you? List 3–5 concrete requests (e.g., 'remind me to take meds at 8 PM,' 'read me this affirmation: "This will pass"")."  
       - *Good Enough Answer*: 1–3 actionable items.  
     - **Question 7**: "What **must we never do**? List 1–3 hard limits (e.g., 'don’t call my boss,' 'don’t mention my weight')."  
       - *Good Enough Answer*: Clear, behavior-based limits (not emotions, e.g., "don’t make me feel judged" is too vague—rephrase as "don’t say 'snap out of it'").  
     - **Question 8**: "How should we **check if you’re stable enough to change this plan**? Pick one: (a) You message us 'I’m stable' and answer three safety questions (e.g., 'What’s today’s date?'), (b) Your clinician confirms it, or (c) You discuss it calmly for 10 minutes with a facilitator."  
       - *Good Enough Answer*: One chosen method. Default to (a) if undecided. ⚠️ Hand-off: If member insists on no method, stop: "We need a way to verify stability—otherwise, we can’t trust changes."  

  #### **Phase 3: Crisis Simulation and Review (30 minutes)**
  Test the plan’s clarity with a hypothetical.  
     - **Question 9**: "Imagine you text us 'I can’t do this anymore' at 2 a.m. Walk me through what the volunteer should do step-by-step using your plan."  
       - *Good Enough Answer*: Volunteer can follow the triggers/contacts without confusion. If gaps, revise the plan.  
     - **Question 10**: "What if you text 'Cancel my plan—I don’t want this help' during a bad stretch? Should we ignore it or pause the plan?"  
       - *Good Enough Answer*: Pre-agreed rule: "Ignore revocations during crises unless I use my stability-check method." If member objects, ⚠️ hand-off to clinician: "We’ll default to ignoring revocations, but your clinician can override this. We’ll note their contact here."  
     - **Final Review**: Read the entire plan aloud. Ask: "Is this exactly what you want? Can a stranger follow this under stress?"  
       - *Good Enough Answer*: "Yes." If "no," revise until time runs out.  

  #### **Phase 4: Sign-Off and Hand-Off (5 minutes)**
     - Member signs and dates the plan.  
     - Facilitator signs as witness.  
     - **⚠️ Hand-off to clinician**: If the plan includes high-risk clauses (e.g., "never hospitalize me"), facilitator adds: "Clinician review advised: ___________ [name/date]." Not mandatory, but flags disputes.  

  ---

  ### **II. The One-Page Plan Structure**
  **Design Principles**: Scannable, <1 page, plain language, with clear priorities. Use bold headers and numbered steps.  
  **Required Sections** (see [template](#appendix-a-sample-plan-template) below):  
  1. **Member Info**: Name, date, stability-check method.  
  2. **Immediate Actions**: Step-by-step contacts/triggers (ordered by priority).  
  3. **What Helps/What Harms**: Bulleted lists of non-crisis requests and hard limits.  
  4. **Emergency Rules**: Conditions for 911/clinician.  
  5. **Revocation Policy**: "Ignore crisis revocations unless I use my stability-check."  
  6. **Clinician Note**: Space for clinician input on high-risk clauses.  

  **Why This Works at 2 a.m.**:  
  - Volunteers scan **Immediate Actions** first—no reading required beyond this section.  
  - Triggers are **bolded** (e.g., **"If I mention suicide"**).  
  - Hard limits are in a **"NEVER DO"** box to prevent errors.  

  ---

  ### **III. Crisis Protocols: Handling Disputes and Revocations**
  **General Rule**: Always follow the written plan during a crisis. Deviate only for immediate safety risks (e.g., suicide threat with no plan).  

  #### **Protocol 1: Revocation Attempt During Crisis (e.g., "Ignore my plan")**  
     - **Step 1**: Volunteer replies: "Got your message. I’m following your plan to keep you safe."  
     - **Step 2**: Execute the plan’s **Immediate Actions**. Contact the first person on the list.  
     - **Step 3**: If member escalates (e.g., "I revoke everything!"), volunteer:  
       - Checks if the member used the pre-agreed **stability-check method** (e.g., answers "What’s today’s date?" correctly).  
       - If YES: Pause plan and notify facilitator.  
       - If NO: Ignore and continue the plan. ⚠️ **Hand-off to clinician**: Share revocation attempt with contacts/clinician—they decide next steps.  
     - **Why**: The crisis self isn’t trusted; stability-check is the objective filter.  

  #### **Protocol 2: Clause Written in Crisis That Stable Member Wants to Keep (e.g., "Never hospitalize me")**  
     - **Step 1**: Member requests to keep the clause during a **stability-checked session** (using their chosen method).  
     - **Step 2**: Facilitator asks: "Why keep this? What if it risks your life?" Record answer verbatim.  
     - **Step 3**: Apply the **"Safety Override Test"**:  
       - If the clause prevents life-saving help (e.g., no 911 even if member is suicidal), facilitator says: "We can’t include this. It puts you in danger. Let’s rewrite it together (e.g., 'avoid hospitalization unless I’m suicidal')."  
       - If member refuses, ⚠️ **Hand-off to clinician**: "We’ve added a note for your clinician to review. Until then, we’ll use the original plan."  
     - **Stopping Point**: No clause that forbids emergency help. Period.  

  #### **Protocol 3: Group Rule Change Proposed in Heat of Incident (e.g., amending charter after a crisis)**  
     - **Step 1**: During meeting, facilitator says: "We’re tabling this for [X] days. Emotions are high—we’ll revisit when stable."  
     - **Step 2**: After cooling-off period (min. 72 hours), facilitator:  
       - Shares incident facts (no opinions) via email.  
       - Asks members to vote anonymously: "Keep the rule? Change to [proposal]?"  
     - **Step 3**: If vote passes, adopt change. If not, drop it.  
     - **Stopping Point**: No changes without cooling-off period and anonymous vote.  

  ---

  ### **Running the Procedure: Three Examples**
  **Case 1: Cancellation Message During a Bad Stretch**  
  - *Situation*: Member texts "Ignore my plan—I didn’t mean it" during a depressive episode.  
  - **Procedure**:  
    - Volunteer checks stability method (e.g., texts back: "What’s today’s date?"). Member responds incorrectly.  
    - Volunteer ignores revocation, follows plan: contacts member’s sister (per **Immediate Actions**).  
    - Sister decides next steps.  
  - **Answer Group Might Dislike**: We ignore the member’s demand. Why? Crisis self isn’t reliable—plan protects them.  

  **Case 2: Crisis-Written Clause Kept by Stable Member**  
  - *Situation*: Member wrote "Never hospitalize me" during an episode. Now stable, they insist it stays.  
  - **Procedure**:  
    - In stability-checked session, member says: "Hospitals traumatize me. I’d rather die than go back."  
    - **Safety Override Test**: Clause forbids life-saving help → Facilitator refuses: "We can’t include 'never.' Let’s change it to 'avoid hospitalization unless I’m actively suicidal.'"  
    - Member refuses → ⚠️ Hand-off: Clinician note added ("Dr. Smith to review"). Plan used as-is until review.  
  - **Answer Group Might Dislike**: We override the member’s wish. Why? Autonomy doesn’t extend to life-threatening clauses.  

  **Case 3: Charter Amendment After Incident**  
  - *Situation*: After a chaotic crisis, a member shouts: "Change the rules! Always call 911 for suicide threats!"  
  - **Procedure**:  
    - Facilitator tables it: "We’ll discuss in 3 days."  
    - After cooling-off, email summary: "Incident: Member threatened suicide, volunteer hesitated. Current rule: Contact clinician first. Proposal: Call 911 immediately."  
    - Anonymous vote: 60% keep current rule → No change.  
  - **Answer Group Might Dislike**: No rule change. Why? Heat-of-the-moment proposals are untrusted.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Guarantee Safety**: It reduces risk but can’t eliminate it (e.g., if a member lies about contacts).  
  2. **Resolve Value Conflicts**: E.g., "My faith forbids meds, but the group says take them." The procedure surfaces this (via clinician hand-off) but can’t solve it—it’s about whose values win.  
  3. **Fix Ambiguous Plans**: If the session rushes and produces vague triggers (e.g., "call if I’m sad"), volunteers may misfire. Prevention is key: the 90-minute flow enforces specificity.  
  4. **Handle Extreme States**: If a member is psychotic or manic during the session, the procedure stops—no plan is made.  
  5. **Replace Clinical Judgment**: Clinicians decide if a "stable" member is actually stable; we only use the member’s chosen method as a proxy.  

  ---

  ### **Appendix: Sample Plan Template**  
  **MEMBER’S BAD DAY PLAN**  
  **Created**: [Date] | **Stability Check**: [Method, e.g., "Text me 3 questions"]  

  **IMMEDIATE ACTIONS**  
  *When I show [warning signs] or contact you in distress:*  
  1. **Call [Name] at [Phone]**. Do: [Request, e.g., "Stay on phone until calm"]. **If no response in [time] or if [trigger]**, →  
  2. **Call [Clinician] at [Phone]**. Do: [Request, e.g., "Update them"]. **If no response or if [trigger]**, →  
  3. **Call 911 if**: [Conditions, e.g., "I threaten self-harm"].  

  **WHAT HELPS**  
  - [ ] DO: [Request, e.g., "Remind me: 'You’ve survived this before'"]  
  - [ ] DO: [Request, e.g., "Ask me to take meds at 8 PM"]  

  **NEVER DO**  
  - [ ] DON’T: [Limit, e.g., "Contact my ex"]  
  - [ ] DON’T: [Limit, e.g., "Say 'just exercise'"]

  **REVOCATION POLICY**  
  "Ignore requests to cancel this plan during a crisis unless I pass my stability check."  

  **CLINICIAN NOTE**  
  [ ] Reviewed by [Clinician] on [Date]: _________________________  

  Signed: ________________________ (Member) | Witnessed: _______________________ (Facilitator)  

  ---  
  This procedure balances autonomy, safety, and practicality. It ensures plans are defensible (e.g., "We followed your written stability-check method") and minimizes on-the-spot judgment by volunteers. Test it with your group and refine based on real-world use.
