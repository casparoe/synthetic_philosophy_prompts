  ### Where PID Struggles (and Refinements)
  PID saves all your verdicts except one nuance:
  - **Case 2 indeterminacy:** PID explains why there's no fact of the matter, but doesn't resolve it. This is a feature, not a bug—it matches your intuition.  
  - **Case 4b (line weight):** PID rejects it, but if line weight were *dramatically* different (e.g., bold vs. thin as a conventional symbol), it might qualify. PID can be refined: *Rendering properties are rules only if they are symbolic or categorical (e.g., dashed, color-coded), not continuous (e.g., line weight, slight tint shifts)*.  
  - **Case 6b directionality:** PID uses "positive feature" heuristically, but this relies on cognition (we notice additions more than absences). For asymmetric features, the rule should describe the *salient deviation* from a default.  
  - **Noise tolerance:** PID allows ≤1 error per box, but this is arbitrary. A better clause: *Errors are acceptable if they arise from ambiguous instantiations of the property (e.g., a dot "outside" vs. "on the boundary") or are outliers in a clear pattern*.

  ### Conclusion
  The core principle is **Projectible Intrinsic Discontinuity (PID)**: Rules must be correct (noise-tolerant), intrinsic/invariant, and carve a projectible, discrete discontinuity. This explains:
  - Why mathematical properties (cases 1, 5), categorical states (4a, 6a), and structural features (one-stroke) feel like rules.  
  - Why derivative properties (1), continuous/accidental features (3, 4b), subjective judgments (lively), and underdetermined cases (2) do not.  
  - Directionality (6b) and noise (7) are handled by projectibility and asymmetry.

  PID aligns with how humans abstract concepts from examples: We seek properties that are generalizable, definitional, and "joint-carving." Your verdicts are largely consistent with this—except where ambiguity (case 2) or subjectivity (lively) prevents a rule from crystallizing. The principle also rejects your friend's designer-intent claim: Bongard problems are solved by *pattern recognition in the drawings*, not telepathy.
