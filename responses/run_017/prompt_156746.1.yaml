  ### New Cases: One-Stroke vs. Lively/Balanced
  **One-stroke rule (A: figures drawable in one stroke; B: require multiple strokes)**  
  - **Your intuition:** Feels like a genuine rule.  
  - **PID analysis:**  
    - **Correctness:** Assumed.  
    - **Intrinsicality/Invariance:** Satisfied—drawability is a topological property (invariant under deformation). It depends on the figure's structure, not rendering.  
    - **Projectible Discontinuity:** Highly projectible. "Drawable in one stroke" is discrete (Eulerian path exists or not) and carves a natural joint (e.g., connectedness degree).  
    - **PID verdict:** Genuine rule. PID saves your intuition.

  **Lively/balanced grab-bag (A: spiral, star, zigzag, circle+dot; B: static or asymmetric shapes)**  
  - **Your intuition:** Not a rule—too vague or subjective.  
  - **PID analysis:**  
    - **Correctness:** Assumed (but subjective).  
    - **Intrinsicality/Invariance violated:** "Lively" or "balanced" is context-dependent and continuous (e.g., a shape might be "somewhat lively"). No invariance under perception shifts.  
    - **Projectible Discontinuity fails:** Not projectible—no discrete boundary. What counts as "lively" is ambiguous (e.g., is a hexagon "balanced"?). Relies on subjective judgment, not structural features.  
    - **PID verdict:** Not a rule. PID rejects it as non-projectible and non-intrinsic.

