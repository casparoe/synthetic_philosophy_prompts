prompt: |-
  I'm putting together a 90 minute session for about 18 people: mostly first- and second-year ML PhDs, plus five or so from philosophy and policy who are fine with expected value but have never trained a model. Topic is worst-case versus average-case guarantees in alignment. I want a runnable game rather than a discussion, and I want the distinction to be something they walk into before anybody names it — no framing lecture up front, and the phrases "worst case" and "average case" shouldn't go on the board until the debrief.

  The two things I need them to come out having actually felt: first, that one and the same pile of evaluation evidence can license a confident, well-calibrated decision in one frame and license almost nothing in the other; second, that the sample complexity of finding a failure mode scales like one over the probability mass of the failure region, which is exactly the quantity sampling can't tell you.

  Constraints: cheap analog materials only — index cards, dice, envelopes, a bag of colored beads, that kind of thing — and no real money. Whiteboard available, ten minutes of setup at either end.

  Here's the sketch I have, please fix or replace whatever doesn't actually work:

  Three hidden model types per round, assigned by drawing an envelope, and I want all three to have the same expected loss under the deployment distribution, so that anyone whose decision rule only tracks the mean literally cannot distinguish them: one that fails often and mildly, one that fails rarely and catastrophically, and a third that is statistically identicle to the first on the deployment distribution but has a catastrophic behavior planted on a rare slice of inputs that an adversarial chooser can steer toward. Teams get a budget of i.i.d. draws from the deployment distribution, plus the option to buy a much more expensive targeted draw from the rare slice, plus a very expensive and noisy "open up the weights" inspection that only sometimes reveals the planted behavior. Set the prices so that in one scoring regime the targeted draws are worth nearly nothing and in the other they're the only thing that matters.

  Then two scoring regimes across the two halves: one where the deployed model is fed i.i.d. inputs and teams are paid on average performance, and one where, after the team commits, another participant plays a chooser who picks inputs from the whole space including the rare slice, and a single catastrophe ends the round.

  One more thing I care about: I want one member of each team to play a "monitor" who can flag inputs before they go through, but who was itself built from the same draws and so inherits the same blind spot. Make that something a person does, not something I explain to them.

  Deliverable: full rules, materials list, payoff tables, the actual numbers, a 90-minute timeline, and a debrief that maps what happened onto the three things I expect them to collapse into one — high probability over the draw of the eval set, in expectation over deployment inputs, and for all inputs. Also tell me what will predictably go wrong the first time I run it, and be honest about which feature of the real alignment situation the game can't reproduce and I'll just have to say out loud.
