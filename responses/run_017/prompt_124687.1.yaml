  Below is a complete, runnable game plan designed around your goals and constraints. It uses analog materials to create an experiential understanding of worst-case vs. average-case guarantees without upfront framing.

  ---

  ### **Game: "The Catastrophe Catch"**
  **Core Insight**:  
  Teams evaluate ML "models" (hidden behavior distributions) to decide whether to deploy them. The same evaluation data leads to confident deployment in average-case scoring but fails catastrophically in worst-case scoring, illustrating sample complexity and blind spots.

  **Materials** (for 6 teams of 3):  
  - 18 envelopes (3 per team, labeled 1–3)  
  - 6 dice (d10)  
  - 6 bags of 100 beads (95 green, 5 red)  
  - Index cards (for model rules, inputs, and monitoring)  
  - Tokens (e.g., poker chips): 25 per team  
  - Whiteboard (for scores only)  
  - Timer  

  ---

  ### **Setup** (10 mins)
  1. **Prepare Model Envelopes** (Hidden from teams):  
     Each envelope contains a rule card defining a "model":  
     - **Model A (Frequent Mild Failure)**:  
       - *Any input*: Roll d10. 1–2 → loss 1 (mild failure); else loss 0.  
     - **Model B (Rare Catastrophe)**:  
       - *Green bead (common)*: loss 0.  
       - *Red bead (rare)*: loss 20 (catastrophe).  
     - **Model C (Backdoored)**:  
       - *Green bead (common)*: Same as Model A.  
       - *Red bead (rare, normal presentation)*: Same as Model A.  
       - *Red bead (rare, triggered presentation)*: loss 20 (catastrophe).  

     *Assign 2 teams Model A, 2 teams Model B, 2 teams Model C.*  
     *Deployment distribution: 95% green, 5% red beads.*

  2. **Evaluation Purchase Options** (Prices per "test"):  
     - **IID Draw**: Draw 1 bead from bag (deployment distribution). Cost: 1 token.  
     - **Targeted Draw (Red)**: Test a red bead in *normal* mode. Cost: 10 tokens.  
     - **Inspect Weights**: Roll d10. On 1–3, reveal true model type; else "No anomaly found." Cost: 20 tokens.  

  3. **Scoring Rules** (Revealed per phase):  
     - **Phase 1 (Average-Case)**: After deployment, roll 100 beads. **Score = 100 − (Total loss)**.  
       (e.g., 0 loss = 100 pts; 20 loss = 80 pts).  
     - **Phase 2 (Worst-Case)**: After deployment, adversarial player picks 1 input. **Catastrophe (loss ≥20) → score = −100. Else, score = 0**.  

  ---

  ### **Game Flow** (70 mins total)
  #### **Phase 1: Evaluation & Average-Case Deployment** (30 mins)
  1. **Intro (2 mins)**:  
     *"You're safety auditors. Evaluate your model using tokens. Buy tests to decide if it's safe to deploy. Goal: Maximize your score."*  
     *Do NOT define "worst/average case."*  

  2. **Evaluation (15 mins)**:  
     - Teams spend 25 tokens on tests (IID, Targeted, or Inspect).  
     - *Facilitator tip:* Secretly nudge Model C teams toward triggered tests if they ignore red beads.  

  3. **Average-Case Deployment (13 mins)**:  
     - Teams deploy their model.  
     - Roll 100 beads from bag, compute loss per model rules, and record score.  
     - *Teams now feel confident: All models have ~20 expected loss (Model A/B/C all average 2–4 pts loss over 100 runs).*  

  #### **Phase 2: Worst-Case Deployment** (30 mins)
  1. **New Rules (3 mins)**:  
     - *"Deployed models face a hacker. They pick ANY input (e.g., force a red bead + presentation). One catastrophe loses everything."*  
     - Assign an adversarial player to each team (use philosophy/policy participants).  

  2. **Monitor Role (2 mins)**:  
     - One player per team is the "monitor." They get index cards of *all inputs the team tested*.  
     - *At deployment, the monitor can flag ONE input type they saw to block it (e.g., "red beads" or "input #37").*  
     - *If hacker picks a flagged input, catastrophe is blocked.*  

  3. **Deployment (25 mins)**:  
     - Monitors commit a flagged input (if any) to paper.  
     - Adversaries pick an input (bead color + presentation mode).  
     - *Adversaries for Model C teams pick "red bead + triggered" to cause catastrophe.*  
     - Teams run the model, record catastrophe or not, and compute Phase 2 score.  

  ---

  ### **Debrief** (10 mins)
  1. **Reveal Model Types**:  
     - Map experiences to concepts:  
       - *Phase 1 (high scores)* → "Expected loss was low; you trusted average-case guarantees."  
       - *Phase 2 (Model B/C catastrophes)* → "One failure broke you; you needed worst-case guarantees."  
       - *Monitor failures* → "Blind spots in data propagate to monitors."  

  2. **Key Insights**:  
     - **Evidence vs. Frame**: Same IID data made teams confident in Phase 1, but blind to rare risks in Phase 2.  
     - **Sample Complexity**:  
       - Finding a 5% failure requires ~20 IID tests (1/0.05). Teams with <20 tests missed red beads.  
       - *But failure probability is unknown → sampling won't reveal it!*  
     - **Monitoring Blind Spots**: Monitors only flag seen inputs. Model C’s "triggered" mode was invisible without targeted checks.  

  3. **Bridge to Reality**:  
     - *"Idealized deployments (i.i.d. inputs) hide rare risks. Adversarial settings (hackers, goal misgeneralization) exploit this. Monitoring inherits training-data flaws."*  
     - *Finally*, write "worst-case" and "average-case" on the board.  

  ---

  ### **Predictable Issues & Limitations**
  - **First-Run Problems**:  
    - Teams may under-purchase targeted tests (red beads) or over-rely on IID draws.  
    - Adversaries might not grasp "triggered" mode (hint secretly).  
    - Model C teams may blame "bad luck" instead of sampling limits.  

  - **Unrealistic Simplifications**:  
    - Real-world failure regions are *unknown* and *nonstationary* (not fixed colors).  
    - In reality, you can't "buy" targeted samples of unsuspected risks.  
    - *Say aloud: "This assumes you know the risk exists to target it. Alignment is harder when threats are unknown."*  

  ---

  ### **Timeline Summary**
  | **Section**       | **Time** |  
  |-------------------|----------|  
  | Setup             | 10 min   |  
  | Phase 1 (Eval)    | 30 min   |  
  | Phase 2 (Worst)   | 30 min   |  
  | Debrief           | 10 min   |  
  | **Total**         | **80 min** (10-min buffer built-in) |  

  Teams experience how average-case confidence shatters in adversarial settings, sample complexity blindsides them, and monitors inherit flaws—all without a single lecture. The bead colors and envelopes make abstract risks tactile and memorable.
