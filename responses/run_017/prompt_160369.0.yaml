answer: |-
  Here is a disciplined analysis of COP26 through the lens of standing-to-blame theory, structured as requested. This case illuminates complex tensions between moral principle and political reality, revealing where standing conditions bite, collapse, or demand refinement.

  ### I. Disciplined Mapping of Blaming Relations

  **1. Rich-Country Negotiators → Coal-Dependent Developing Countries**  
     - **Norm Violated:** Failure to commit to sufficiently deep/rapid emission cuts ("ambition gap").  
     - **Speech Act:** *Moral address* (demanding higher targets as a duty) blended with *censure* (public shaming for insufficient Nationally Determined Contributions).  
     - **Blamer Implication:**  
       - *Same norm?* Yes (rich countries missed *their own* prior targets).  
       - *Same act?* No (not refusing *new* cuts, but failing past obligations).  
       - *Benefit/Complicity?* Yes (historical emissions enabled wealth; ongoing high per-capita emissions).  

  **2. Island-State Delegates → High-Emitting States (Rich & Developing)**  
     - **Norm Violated:** Disregarding the "survival emissions" threshold (exceeding fair shares that threaten others' territorial integrity).  
     - **Speech Act:** *Moral address* (demanding climate justice), *censure* (shaming inaction), and *enforcement* (advocating for legal/financial mechanisms like loss/damage).  
     - **Blamer Implication:**  
       - *Same norm?* No (their emissions are negligible; not threatening others).  
       - *Benefit/Complicity?* Minimal (may use fossil fuels marginally but are net victims).  

  **3. Host Government (UK Ministers) → All High-Emitting States**  
     - **Norm Violated:** Failure to prioritize existential global risk over national interest.  
     - **Speech Act:** *Moral address* ("keeping 1.5°C alive"), *enforcement* (setting summit agenda/participation rules).  
     - **Blamer Implication:**  
       - *Same norm?* Yes (UK missed past targets; approved new oil fields).  
       - *Benefit/Complicity?* Yes (historical emissions; finance sector profits from fossil fuels).  

  **4. Activists/Campaigners (using commercial flights) → Governments & Corporations**  
     - **Norm Violated:** Prioritizing profit/politics over planetary health.  
     - **Speech Act:** *Censure* (protests), *sanction* (social/media shaming).  
     - **Blamer Implication:**  
       - *Same norm?* Arguably yes (high-emission travel contradicts "emergency" rhetoric).  
       - *Complicity?* Yes (participation in high-carbon systems).  

  **5. Private Jet Users (Executives/Delegates) → Others**  
     - *Implicit blame* via advocacy for emissions cuts while engaging in extreme luxury emissions.  
     - **Blamer Implication:**  
       - *Same norm?* Yes (violating "reduce emissions urgently" norm egregiously).  

  ---

  ### II. Running the Standing Tests  

  | **Condition**               | **Private-Jet Delegate** | **Commercial-Flight Activist** | **Island-State Delegate** | **Rich-Country Negotiator** |  
  |------------------------------|--------------------------|--------------------------------|---------------------------|-----------------------------|  
  | **Strict-Identity** (Same act) | FAIL (flies private)     | PASS (flies commercial)       | PASS                      | PASS (not refusing *new* cuts) |  
  | **Same-Norm** (Violated norm invoked) | FAIL                    | **FAIL** (high emissions)     | **PASS**                  | **FAIL** (missed targets)    |  
  | **Domain** (Implicated in sector) | FAIL                    | **FAIL** (aviation user)      | **PASS** (negligible role)| **FAIL** (fossil economy)   |  
  | **Complicity/Benefit**       | FAIL (luxury benefit)    | **FAIL** (system participant) | **PASS** (net victim)     | **FAIL** (benefits from high emissions) |  
  | **Selectivity** (Silent on equally culpable) | N/A*                   | **FAIL** (rarely call out activists' flights) | **PASS** (blame all high emitters) | **FAIL** (soft-pedal allies' failures) |  

  \* *Private jet users rarely blame others formally; their hypocrisy is performative.*  

  **Key Discriminations:**  
  - **Commercial-Flight Activist vs. Island Delegate:** *Same-norm* and *domain* conditions sharply distinguish them (activist fails, islander passes). *Strict-identity* fails to catch the activist’s complicity.  
  - **Rich-Country Negotiator vs. Private-Jet User:** *Strict-identity* passes negotiators (different acts), but *same-norm/complicity* fail both.  
  - **Where Conditions Align/Diverge:** *Domain/complicity/benefit* agree on failing everyone *except* island states. *Strict-identity* and *selectivity* diverge on activists and negotiators.  

  ---

  ### III. Pushing the Episode Against Theory  

  **Problem 1: Overbreadth of Domain/Complicity Conditions**  
  If "implication in the fossil economy" forfeits standing, only those with near-zero emissions (e.g., island states) may blame. This either:  
  - *Trivializes standing* (only the powerless have standing but lack leverage), or  
  - *Demands scalar standing* (standing degrades with complicity).  
  **Resolution:** Standing must be *graded* (e.g., islanders have "full standing"; activists "weakened standing"). Retreating to strict-identity is inadequate—it excuses systemic complicity.  

  **Problem 2: Blame in Official Capacity**  
  When UK ministers blame, is it *personal* or *institutional*?  
  - **Office-Holders:** Standing is *borrowed from the institution's mandate* (e.g., COP host), but *undermined* if the institution is hypocritical (UK’s oil policies).  
  - **Representatives (Islanders):** Standing is *derived from victims* they embody—even if personally implicated (e.g., using a diesel generator), their blame channels collective survival.  

  **Problem 3: The Implicated Blamer’s Dilemma**  
  What should a high-emitting activist do?  
  - **Silence:** Abdicates moral duty.  
  - **Confession-then-blame:** Acknowledges complicity but may still lack standing (if complicity is ongoing).  
  - **Self-Implicating Blame:** ("*We* must change") avoids hypocrisy but dilutes accountability.  
  - **Delegation:** Ceding voice to unimplicated parties (e.g., islanders) is structurally honest but often impractical.  
  **Restoration:** Standing can be *partially restored* by demonstrable repentance (e.g., divestment, policy change), but not retroactively—past blame remains tainted.  

  ---

  ### IV. Where the Apparatus Is Silent  
  - **Collective Standing:** Can a hypocritical *state* (e.g., UK) have standing? The theory focuses on individual agents.  
  - **Intergenerational Blame:** High emitters blame past generations? Standing theory lacks tools for diachronic responsibility.  
  - **Scale of Contribution:** Does blaming a super-emitter (e.g., USA) require different standing than blaming a mid-level polluter? No scalable framework exists.  
  - **Negotiated Texts as Blame:** Is the "Glasgow Pact" shaming coal a blame act? If so, who "owns" it—drafters, signatories, or dissenters?  

  ---

  ### Bottom Line for Your Piece  
  **Hypocrisy is a symptom, not the disease.** The COP26 case reveals three deeper issues:  
  1. **Structural Scarcity of Standing:** In a carbon-intensive world, *everyone* is materially complicit, creating a crisis of moral authority. Only those with negligible power (island states) have "clean hands"—but their blame is often ignored.  
  2. **The Selectivity Trap:** Standing is lost not just by hypocrisy, but by *partial enforcement* (e.g., rich countries blaming India’s coal while excusing Australia’s). This is independent of the blamer’s own record.  
  3. **Agency vs. Office:** Hypocrisy matters less when blame is institutional (e.g., COP presidency), but institutions lose legitimacy if their actions contradict their mandates.  

  **Verdict:** The episode *works* for your piece, but not merely as a hypocrisy showcase. It exposes a **fundamental tension**: climate blame requires moral standing, but the systems causing climate change corrupt that standing universally. The lesson isn’t "hypocrites can’t blame"—it’s that *no one meets ideal standing conditions*, forcing us to either abandon blame (impractical) or redefine standing as *scalar, redeemable, and institutional*. This redefinition is where your piece could break new ground.
