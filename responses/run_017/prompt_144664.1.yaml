prompt: |-
  So I'm in a seminar on personal identity this term and we spent last week on Parfit's teletransporter — the scan-and-rebuild-on-Mars machine that destroys the original back on Earth. We got completely stuck on the branching variant, where the scanner misfires and doesnt destroy you, so you and the Mars replica both go on to live separate lives from then on. Parfit's move there, as I understand it, is that this is in no way worse than ordinary survival, because what matters in survival is the holding of psychological continuity with any cause, not identity, and identity just isn't the thing we were ever really caring about. My friend Priya thinks that's nuts and I half think she's right, but I can't tell which part of the package I'm actually resisting — the reductionism, or the bit where two branches at full strength each get the whole of what matters, or something else.

  Here's the ask. I want a number: your credence that in the branching case the original loses nothing that matters — that branching is in no respect worse for her than ordinary, single-threaded survival. Mine is about 0.6, Priya's is about 0.15. Don't just tell me it depends on which theory of personal identity you accept; I know that. Decompose it. The terms I think have to be in there somewhere: the probability that some reductionist view (no further fact beyond physical and psychological continuity, Relation R with any cause) is true rather than the further-fact or non-reductionist view; the probability, given reductionism, that what matters comes in degrees at all and that two full-strength branches share or sum rather than compete; the probability that anticipating my own future is even coherently a one-to-many relation rather than an attitude that quietly presupposes a unique continuer; and the probability that the question of what matters is purely descriptive rather than partly something we get to settle. Use your own decomposition if mine is bad. For each term give a number plus one line of justification, then show how they combine into the headline number, then tell me which single term the final result is most sensitive to, which of your own numbers you're least confident in, and what argument or case would move it most. And if you can, say where you think Priya and I are most likely disagreeing, since we're 0.15 and 0.6 apart and I suspect we're not actually arguing about the same sub-question. I mean the number as a real verdict about what's true, not a prediction about where the field lands — though a second number for where you'd expect the literature to settle in thirty years would be a fun addition if you want to separate those.

  Two test cases I've been chewing on that I want your credence applied to, because I don't think either appears in this exact form. First, the merge case: the two branch people live a year of divergent lives, then both are scanned and their psychological profiles averaged into one new person, whose memory of that year is a blur of both of them. Does that one person get more, less, or the same amount of what-matters as either branch would have had alone — and if your framework can't even assign a cardinal amount here, say that and tell me what it does instead. Second, the lopsided case: the scanner destroys the Earth original and builds two replicas, one a perfect copy and one a degraded, maybe 60%-fidelity copy with scrambled childhood memories. Is there a coherent story on which the original's total survival-amount is preserved and merely spread across the two, or is the honest description just one full continuer plus a damaged stranger? Also be straight with me if the question as I've posed it is broken: if you think "what matters in survival" has no determinate truth value, or the merge case is fatally underdescribed, or my 0.6 rests on conflating two things, tell me that plainly instead of politely handing me a number I shouldn't trust.
