  Mainstream epistemologists will demand categorization (foundationalism? etc.). Should refuse all boxes - this is pre-theoretical. Social epistemologists will pounce on power dynamics: who kills questions? Concede this is crucial, but separate descriptive from normative. 

  The lab example is perfect for showing hinge death/reactivation. But must clarify: hinge change isn't rational revision, it's practice collapse. 

  Biggest risk: if the formal epistemologist asks about probability 1 assignments. There's no clean answer - Wittgenstein would reject the frame. If this comes up, pivot to practices overriding models. 

  Most critical reply: to the hinge epistemologist. If they don't buy that "dead question" explains grounding better than "basic belief," the whole thesis unravels. 

  Preemptive strike: in opening, stress that this isn't epistemology-as-usual. Hinges aren't in the knowledge game at all. 

