prompt: |-
  hey — I'm on the small committee that decides how a roughly $3M pot gets split across maybe five two-year projects, and it's the theory end of the org: decision theory, formal guarantees, epistemics of evaluation, the conceptual side of safety cases — not empirical ML. The argument we keep having and never resolving is worst-case vs average-case guarantees, and I want your view on which open questions here are actually worth money.

  Where I'm stuck, so you know what I already believe and can tell me where I'm wrong. Worst case over all inputs looks useless: anything with real capability can be pushed into bad behavior on some input, so the claim is either vacuous or unachievable, and people mostly invoke it as a rhetorical standard rather than something they expect to meet. Pure average case looks gameable: you look great on the distribution you were evaluated on and awful on the one you get deployed on. And in our case I don't think the deployment distribution is even a fixed object — these systems write a lot of the code, draft a lot of the documents, and generally shape what tasks get handed to them next, so the "average" is partly their own output. I've started calling that the self-consuming average and people have started using it back at me, which worries me, because I can't tell whether it names a real problem or is just a way of making average-case sound deeper than it is.

  Some candidate questions floating around, which you should feel free to reorder, merge, or say are junk:

  - what the input set for a worst-case claim should even be. Worst case over "inputs a competent operator would plausibly produce"? Over everything a red team with compute budget B can find? Is B a principled knob or just a fudge factor we tune until the claim comes out true?
  - whether there's a genuinely useful middle notion — guarantees over a set of distributions rather than over inputs — and when that collapses back into worst case versus when it's actually cheaper to satisfy.
  - whether an average-case guarantee is even well-defined when the deployment distribution is partly a fixed point of the system's own behavior, and if not, what a fixed-point-relative guarantee would look like and whether anything about it is tractable.
  - composition. Worst-case guarantees for components generally don't compose into a worst-case guarantee for the assembled system, and average-case ones only compose under independence assumptions that visibly fail here. Is there a notion that composes, or do we just accept that the system-level claim will always be weaker than the parts?
  - whether "average-case guarantee plus a worst-case-triggered shutdown" is a real third thing or just two weak claims stapled together.
  - the regulatory end: what a safety case can honestly assert. Is "no bad behavior on any input our red team found with budget B" the sort of sentence that should appear in a filing, and is work on making claims like that legible and non-misleading worth funding?
  - whether the distinction is even tracking what we care about. Maybe what we want is a bound on the probability of catastrophe under deployment, which is neither worst case over all bad behavior nor average case frequency-weighted, and maybe that frame should just eat both.

  What I want from you: given that pot, that timeframe, and that kind of researcher, rank the questions you'd fund and defend the ranking. I care much less about the list than about the reasoning — for each one, what it's upstream of, whether it's tractable for people who do math and philosophy rather than large-scale experiments, how neglected it is, and what you'd watch over the next two years that would move it up or down. Also tell me explicitly which of these you would NOT fund and why, including — if this is your view — that the worst-case/average-case framing is the wrong frame and the money should go somewhere else entirely. And if "self-consuming average" is a confused concept, say so and say what the right version of the point is; I'd rather find out from you than from a referee.

  One format thing: lead with your bottom line in the first sentence — the allocation you'd actually recommend, in order — then give the reasoning. No preamble, no restating my question back to me.
reasoning: |-
  Okay, let me tackle this systematically. The user is part of a committee allocating $3M for theoretical AI safety projects, specifically focused on the worst-case vs average-case guarantees debate. They've outlined several candidate questions and want a prioritized funding recommendation with clear reasoning.

  First, I need to understand their core dilemma. They're stuck between worst-case guarantees being unrealistic and average-case guarantees being gameable, especially with this "self-consuming average" problem where the system shapes its own input distribution. That's a crucial insight - it means traditional statistical assumptions break down when the system influences future inputs.

  Looking at their candidate questions, I should group related ones to avoid duplication. The fixed-point problem (question 3) seems central because if the deployment distribution isn't stable, average-case claims become meaningless. That connects to composition (question 4) since systems with feedback loops create interdependent distributions. 

  The regulatory angle (question 6) feels premature - we can't standardize claims before solving the technical foundations. And the "guarantee plus shutdown" idea (question 5) seems like a band-aid rather than fundamental research.

  The catastrophe probability framing (question 7) is compelling because it bypasses the worst-case/average-case dichotomy. If we can bound P(catastrophe) under deployment, that's what actually matters for safety cases. This might subsume other questions.

  For tractability, I consider what theoretical researchers can achieve in two years without massive compute. Defining input sets (question 1) or distribution sets (question 2) could yield publishable math, but the fixed-point analysis might be more impactful if we can crack it.

  Neglect is another factor. Everyone talks about worst-case guarantees, but the self-consuming average problem gets less attention. Funding that could stimulate novel work.

  Prioritization emerges: 
  1. Catastrophe bounds (question 7) because it reframes the problem usefully
  2. Fixed-point analysis (question 3) as it addresses the core instability issue
  3. Composition (question 4) since real systems are modular
  The rest either derivative or premature.

  I'd explicitly deprioritize the shutdown combo (5) and regulatory questions (6) - they're applied concerns that need better foundations first. The "self-consuming average" terminology actually captures something real about distributional shift in autonomous systems, so I'll validate that.

  For deliverables: Year 1 should produce formal models of the fixed-point problem, Year 2 should show composition results or catastrophe bounds. If someone demonstrates a tractable fixed-point guarantee, that would rocket to top priority.
answer: |-
  **Recommended allocation (descending priority):**  
  1. **Catastrophe probability bounds** (question 7)  
  2. **Fixed-point-relative guarantees** (question 3)  
  3. **Composition under interdependence** (question 4)  
  4. **Middle notion: Sets of distributions** (question 2)  
  5. **Regulatory legibility** (question 6)  
  *Defund: Input set definitions* (question 1) *and shutdown combos* (question 5) — they’re tactical, not foundational.  

  ---

  ### Reasoning & Defense  
  **Core problem:**  
  The worst-case/average-case dichotomy is **obsolete** for your context. Deployment distributions are non-stationary and system-influenced ("self-consuming average" is *valid and critical* — it highlights feedback loops that break classical assumptions). Funding should target *alternatives* to this framing.  

  #### Priority Breakdown:  
  1. **Catastrophe probability bounds (Question 7)**  
     - **Why top?** Directly addresses what you care about: "Bound P(catastrophe) under deployment." This subsumes worst/average cases by focusing on tail events and system-induced distribution shifts.  
     - **Tractability:** Math-heavy (e.g., extremal statistics, regret bounds under non-stationarity). Philosophers can tackle formalizing "catastrophe" (e.g., irreversible harm thresholds).  
     - **Neglect:** Understudied in theory-focused safety; most work assumes fixed distributions.  
     - **Watch for:** Year 1: Axiomatization of "catastrophe" and coupling to capability thresholds. Year 2: Bounds for simple systems with self-modifying inputs.  

  2. **Fixed-point-relative guarantees (Question 3)**  
     - **Why?** Essential for "self-consuming averages." If deployment isn’t fixed, guarantees must account for the system’s influence on its own input distribution.  
     - **Tractability:** Requires dynamical systems/game theory (model feedback loops). Philosophers can define "reasonable" fixed points (e.g., avoiding self-deception).  
     - **Upstream of:** Composition, regulatory claims.  
     - **Watch for:** Year 1: Stability criteria for fixed points. Year 2: Tractable approximations (e.g., Lipschitz constraints on system-induced distribution shift).  

  3. **Composition under interdependence (Question 4)**  
     - **Why?** Systems are modular, but safety failures cascade. Worst-case composition is intractable; average-case assumes independence (false here).  
     - **Tractability:** Information-theoretic or causal frameworks (e.g., bounding mutual influence between components).  
     - **Neglect:** Composition theorems rarely address endogenous distribution shifts.  
     - **Downstream impact:** Enables modular safety cases.  
     - **Watch for:** Year 1: Counterexamples showing composition failure. Year 2: Sufficient conditions for robust composition.  

  4. **Sets of distributions (Question 2)**  
     - **Why lower?** A bridge between worst/average cases (e.g., "robust to all distributions in uncertainty set 𝒟"), but risks collapsing into worst-case if 𝒟 is too broad.  
     - **Fund if:** Focused on *tractable* sets (e.g., distributions close to training via KL divergence) *and* links to catastrophe bounds.  
     - **Watch for:** Avoid "fudge factor" sets (e.g., arbitrary compute budgets).  

  5. **Regulatory legibility (Question 6)**  
     - **Why fund?** Necessary for real-world impact, but premature without technical foundations.  
     - **Conditional:** Support *only* if paired with #1–3 (e.g., "How to communicate catastrophe bounds in filings?").  

  ---

  ### What to Defund & Why  
  - **Question 1 (Input sets):** Unproductive. "Competent operator" is underspecified; "red team budget B" is arbitrary. Funds better spent on *systemic* properties (e.g., fixed points).  
  - **Question 5 (Shutdown combos):** Theoretically shallow. "Average-case + shutdown" doesn’t solve distribution shift or self-triggered failures. A band-aid, not research.  

  ### On Framing & "Self-Consuming Average"  
  - **The dichotomy is the wrong frame.** Worst-case is infeasible; average-case ignores feedback. **Reframe as:** "Guarantees under *strategic* or *adaptive* environments."  
  - **"Self-consuming average" is valid:** It captures *endogenous distribution shift* — a core challenge for deployment guarantees. The right question is how to formalize it (hence #2 and #3).  

  ### Allocation Rationale  
  - **$3M over 5 projects:** Split ~$1.5M to #1–2 (foundational), ~$1M to #3–4 (enablers), ~$0.5M to #5 (applied).  
  - **Why this order?** Questions 1, 5, and 6 don’t resolve the core conflict. #7 and #3 attack the root problem (non-stationarity + self-influence); #4 ensures scalability.  
  - **Timeframe:** Years 1–2 can yield formal frameworks + impossibility results. Empirical validation isn’t needed — this is theory.  

  **Bottom line:** Abandon the worst-case/average-case debate. Fund work on *catastrophe bounds* and *feedback-aware guarantees*. Ignore tactical fixes; invest in formalizing the dynamics of self-modifying systems.
