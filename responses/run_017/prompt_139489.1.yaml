prompt: |-
  I'm in the middle of a PhD (political theory, working on a chapter about the fiduciary/trust framing of humanitarian intervention) and I keep going back and forth on whether the trusteeship model actually earns its keep on Libya 2011, or whether it just restates the ordinary R2P critique in fancier vocabulary. I want you to run the case through it properly, both directions.

  Here's the version of the model I've been defending, so we're using the same one. On this view, coercive humanitarian intervention is a *fiduciary power*: the intervener is a trustee of the protected population, holding powers it may exercise only for that population's benefit and never for its own. The incidents I care about are: (1) a duty of loyalty/no-conflict -- the mandate can't be used to advance the intervener's own security, credibility, or domestic-political interests, or to settle a civil war on the side the intervener prefers; (2) a duty not to exceed the mandate's purposes, where the purposes are fixed by the authorization, not by the trustee's own judgment of what would be best; (3) a duty of care and repair, scaled to what the trustee foreseeably breaks -- so the responsibility to rebuild isn't an add-on, it's part of what makes the intervention legitimate in the first place; (4) a duty of impartiality among rival factions of the beneficiary population; (5) a duty to render an account and to exit only when the trust purposes are actually fulfilled, not when the trustee gets tired.

  The case (you know it, but pinning the facts so we don't talk past each other): Resolution 1973 was adopted 17 March 2011 under Chapter VII, ten in favour and five abstentions including Brazil, Germany, India, China and Russia; it demanded a ceasefire, imposed a no-fly zone, and authorised all necessary measures to protect civilians and civilian-populated areas under threat of attack, expressly excluding a foreign occupation force of any form on any part of Libyan territory. Gaddafi's forces were at the gates of Benghazi and he had said publicly that they were coming that night with no mercy. NATO took command on 31 March; what began as protecting Benghazi became a campaign that decided the civil war; Gaddafi was killed in October; the operation wound down with no reconstruction commitment, militia fragmentation, a second civil war from 2014, and reports of open slave markets by 2017. Factually none of that is controversial, so don't spend words re-establishing it.

  What I want is the disciplined mapping. Who exactly is the trustee here (NATO? the coalition? individual states?), who is the beneficiary ("civilians under threat of attack" versus the Libyan people as a whole versus whoever ends up holding power), what is the trust property, and what in that sequence counts as breach of which incident. Then: does the model actually explain anything the standard "mission creep" / "R2P as cover for regime change" story doesn't -- especially the abstentions, which look a lot like foresight about loyalty and about exit -- and where does it misdescribe the case? My worry is that it forces a clean principal-beneficiary structure onto a situation where the whole problem was that no one could say who the beneficiary was once the air campaign started deciding the war, and that the fiduciary framing quietly smuggles in a verdict about regime change by definitional fiat rather than argument.

  And then the other direction: is Libya a confirmation of the model, an anomaly, or a case it was never built for? Be honest if the model is silent somewhere -- my three candidate silences are (a) multi-trustee collective action when there's no single will to hold to a duty, (b) the absence of any forum in which the account is rendered, i.e. a beneficiary with no standing to sue, and (c) the fact that the hardest decision, when to leave, is precisely the one the fiduciary duty language leaves underdetermined. If you think there's a worse one, say so.

  One test I'd like you to apply: run Kosovo 1999 through the same model in a short paragraph at the end. If your version of the trusteeship framing ends up condemning the unauthorized NATO action in Kosovo as straightforwardly as it condemns what happened in Libya, I think it's collapsing into just a general theory of when war is permissible and I should cut it from chapter three -- tell me if that's what's happening.

  Keep it argumentative and specific rather than survey-like, and please don't pad it out with citations or a reading list -- I can find those myself, and its the mapping I'm stuck on. Not looking for a balanced overview, I want you to take a position on whether this model survives Libya.
reasoning: |-
  Okay, the user is a PhD candidate in political theory, working on a chapter about fiduciary models in humanitarian intervention. They're specifically focused on the Libya 2011 case and whether the trusteeship model adds value beyond standard R2P critiques. They've provided a detailed framework with five key duties and want a disciplined mapping of Libya against this model.

  First, I need to unpack their core concerns: They're worried the model might just dress up existing critiques in fancier terms, particularly regarding mission creep and regime change accusations. They also question if the model forces an artificial principal-beneficiary structure onto messy realities. And they're testing if the model collapses into general jus ad bellum when applied to unauthorized interventions like Kosovo.

  For the Libya mapping, I should identify: Who's the trustee? Probably NATO or the coalition, though there's ambiguity. Beneficiary? Civilians under threat initially, but this blurred as the conflict evolved. The "trust property" would be the coercive power itself. Then I need to analyze each breach against their five incidents:

  Loyalty breach seems clearest - NATO's shift from protection to regime change. Mandate excess is evident in the transition from no-fly zone to civil war intervention. Repair failure is stark given the post-2014 collapse. Impartiality vanished once they backed rebels exclusively. And the exit was clearly premature.

  The value-add question is crucial. The model explains the abstentions' foresight about loyalty/exit risks better than standard critiques. It also makes the repair duty foundational rather than optional. But it struggles with the beneficiary ambiguity post-Benghazi and collective action problems.

  On Kosovo, applying the same model shows it doesn't automatically condemn unauthorized interventions - it focuses on conduct. This distinction preserves its unique contribution to jus in bello analysis rather than collapsing into general war permissibility.

  Key silences to acknowledge: collective trustee problems, lack of enforcement mechanisms, and underdetermined exit timing. These are real limitations but don't invalidate the model.

  The user needs decisive conclusions: The model survives Libya by exposing structural flaws in the intervention's execution, but requires refinement on collective action and beneficiary definition. It remains distinct from general jus ad bellum frameworks. They should keep it in Chapter 3 but address these edges.
answer: |-
  Here's the disciplined mapping of Libya 2011 against your fiduciary model, followed by its critical evaluation and the Kosovo test:

  **Trustee Identification:** Ambiguous, creating structural weakness. While Resolution 1973 authorized "Member States," operational command resided with **NATO** (specifically NATO's operational structures under SACEUR). This creates a tension: the *legal authorization* was collective to UN Member States, but the *operational fiduciary agency* was NATO. This ambiguity undermines clear accountability for the incidents.

  **Beneficiary Identification:** Initially clear, then fractured. The mandate defined beneficiaries as **"civilians and civilian-populated areas under threat of attack"**. This was specific and situational (e.g., Benghazi under imminent assault). However, as the intervention decisively shaped the civil war's trajectory, the beneficiary population became conceptually fractured: civilians remained beneficiaries, but the intervention inevitably favoured one faction (anti-Gaddafi rebels) *as a means* to protect civilians, blurring the line between protection and partisan victory. The model struggles because "the Libyan people as a whole" was not the initial beneficiary, and "whoever ends up holding power" is antithetical to the duty of impartiality.

  **Trust Property:** The **coercive power authorized by UNSCR 1973** – specifically, the mandate to use "all necessary measures... to protect civilians".

  **Breach of Incidents:**

  1.  **Duty of Loyalty/No-Conflict (Breached):** NATO's actions demonstrably advanced the coalition's (particularly key NATO members') preference for regime change and geopolitical interests (removing a pariah, preventing perceived regional instability from Gaddafi's survival). The shift from protecting Benghazi to systematically degrading Gaddafi's command/control and enabling rebel offensives settled the civil war on the side NATO preferred, directly conflicting with the beneficiary-centric purpose.
  2.  **Duty Not to Exceed Mandate Purposes (Breached):** The mandate's purposes were fixed by UNSCR 1973: ceasefire, NFZ, protect civilians *under threat*. NATO exceeded this by conducting operations designed to achieve regime change (targeting command centers far from imminent civilian threats, providing close air support for rebel advances). The "protection" purpose became a predicate for a purpose (regime change) not authorized.
  3.  **Duty of Care and Repair (Breached):** NATO's campaign foreseeably shattered the Libyan state's coercive capacity and governance structures without any commensurate plan or commitment to repair. The model makes this breach foundational: the intervention's initial legitimacy was contingent on assuming responsibility for foreseeable consequences. The 2014+ collapse was a direct, foreseeable result of this failure, making the intervention retrospectively illegitimate *ex post* by the model's logic.
  4.  **Duty of Impartiality (Breached):** While the mandate implicitly required acting against *any* attacker of civilians (including rebels), NATO exclusively targeted Gaddafi's forces and actively empowered the rebel faction. The intervention became functionally partisan, favouring one segment of the Libyan population (the rebels and their supporters) against another (Gaddafi loyalists and associated tribes).
  5.  **Duty to Render Account & Exit Only on Purpose Fulfillment (Breached):** No meaningful account was rendered to the UNSC or the Libyan people justifying the shift in strategy or the premature exit. NATO exited when the immediate military objective (Gaddafi's ouster) was achieved, *not* when the trust purposes (protection, stable environment free from imminent threat) were fulfilled. The mandate's purposes were abandoned once the regime fell, despite the obvious vacuum and foreseeable threats to civilians.

  **Does the Model Earn Its Keep?**

  1.  **Explanatory Power Beyond Standard Critique:**
      *   **The Abstentions:** The fiduciary lens *sharpens* the understanding of the abstentions (especially Russia, China, India, Brazil). Their concerns weren't just generic "mission creep" but specifically foresaw breaches of *loyalty* (regime change agenda), *mandate excess* (fear of expansive interpretation), and *failure of care/repair* (skepticism about Western commitment to stability). The model provides a structured vocabulary for these specific, normatively grounded anxieties.
      *   **The "Why" of Repair:** Standard critiques treat "rebuilding" as a desirable add-on. The fiduciary model makes it a *constitutive element of legitimacy*. Libya's catastrophic aftermath isn't just a failure of follow-through; it retroactively undermines the intervention's initial claim to legitimacy because the duty of care was inherent to the power’s exercise.
      *   **Impartiality as Core Failure:** Standard critiques focus on regime change. The fiduciary model highlights the distinct, simultaneous breach of *impartiality* – the intervention became a tool for one side in a civil war, violating the duty to protect civilians *from all threats* impartially.

  2.  **Where it Struggles/Misdescribes:**
      *   **Beneficiary Ambiguity:** You're right. The model assumes a coherent beneficiary. Libya exposed the impossibility of maintaining this when protection requires defeating one party in a civil war. The beneficiary fractures into "civilians we protect from Gaddafi" vs. "civilians we harm by enabling rebels" vs. "loyalists we no longer protect." The model lacks tools to navigate this inherent tension within the mandate once decisive force is applied beyond immediate defensive protection.
      *   **"Regime Change by Fiat"?** Not quite smuggled in *by the model*, but exposed by its application. The model *demands* that regime change must be justified *within the fiduciary constraints* (loyalty, mandate purpose). Libya shows NATO violated those constraints, using the mandate as cover. The model provides the framework to *argue* why this specific regime change was illegitimate under the authorization, not just that it was regime change.

  **Libya: Confirmation, Anomaly, or Out-of-Scope?**
  Libya is a **stress test confirming the model's diagnostic power but exposing its structural weaknesses and silences.**

  *   **Confirmation:** It powerfully diagnoses multiple, specific breaches of fiduciary duty that explain the mission's moral and practical failure far more precisely than "mission creep" alone.
  *   **Exposed Silences:**
      *   **(a) Multi-Trustee Collective Action:** The UNSC-NATO-State triad created fatal ambiguity. Who was ultimately responsible for ensuring fidelity? The model assumes a coherent trustee, which didn't exist. This *is* a critical silence.
      *   **(b) No Forum for Account/Enforcement:** The Security Council is a flawed forum. The beneficiary (Libyan civilians) had no standing. This is a fundamental weakness in the *application* of the model globally, not a flaw in the model's *logic*, but a major practical limitation.
      *   **(c) Underdetermined Exit:** The model correctly identifies that exit must be purpose-driven, but "purpose fulfillment" (a stable environment free from imminent threat?) is inherently contestable and political, especially after the state collapses. The model offers principle but no clear decision rule.
      *   **(d) Worse Silence: Fractured Beneficiary in Civil War:** As noted, this is the core descriptive challenge the model struggles with most acutely in cases like Libya. It needs development.

  **The Kosovo Test (1999):**

  Applying the model strictly: The intervention lacked UNSC authorization, so there was no *formal* trust mandate. However, NATO claimed a *moral* fiduciary duty to protect Kosovar Albanians from ethnic cleansing. Even assuming this moral trust existed:
  *   **Loyalty:** Mixed. Genuine humanitarian motive was strong, but NATO credibility/cohesion interests were also significant.
  *   **Mandate:** Self-defined ("halt violence, force Serb withdrawal, allow refugees back, deploy peacekeepers"). Exceeded? Arguably not *within its self-set purposes*, but those purposes were expansive.
  *   **Care/Repair:** **Crucial Difference.** NATO committed massively to post-conflict administration (UNMIK/KFOR), fulfilling the duty of care/repair *ex post*, arguably legitimizing the action *retrospectively* under the model's logic, unlike Libya.
  *   **Impartiality:** Targeted the Serbian state, not civilians *per se*; ultimately protected Albanian civilians impartially *from Milošević*.
  *   **Account/Exit:** Rendered account (to publics/alliances); exited military combat role once Serbs withdrew, but maintained a massive peacekeeping/state-building presence for years, aligning with purpose fulfillment (stability).

  **Conclusion on Model Survival:** Your fiduciary model **survives Libya**. It doesn't collapse into general *jus ad bellum* (Kosovo shows it *can* distinguish authorized from unauthorized actions while still evaluating conduct, and crucially highlights the repair duty that Kosovo fulfilled and Libya ignored). It provides a superior, structured framework for diagnosing Libya's specific failures (loyalty, mandate excess, care/repair, impartiality, account/exit) compared to generic "mission creep/regime change" critiques, explaining the abstentions' foresight and making repair foundational. However, Libya brutally exposes its **key weaknesses**: handling the fractured beneficiary in civil war, the collective action problem among multiple trustees, and the lack of an enforcement forum. **Keep it in Chapter 3, but explicitly confront these silences as limitations needing further theoretical work.** The model earns its keep by forcing precision on *why* Libya failed as an instance of R2P, not just *that* it failed.
