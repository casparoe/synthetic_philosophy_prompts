prompt: |-
  I am a staff software engineer at a company of about nine hundred people, and for the last eight months I have been one of three rotating members of the committee that allocates our employee hardship fund. The fund is discretionary: any employee, including contractors with more than a year of service, may apply once a quarter for help with an out-of-pocket cost — dental or medical work insurance will not cover, travel to a family funeral, adapting a home workspace after an injury, emergency childcare, replacing essentials lost in a fire. We have eighteen thousand dollars a month and typically between forty-five and sixty thousand dollars of requests. We meet for ninety minutes, read a one-page application (a free-text description, the amount requested, the applicant role and tenure, and, since last quarter, a self-rated need score from zero to ten), and decide. I then write a short paragraph of justification per decision into a shared document. The Head of People signs off, the works council can ask us to reopen any file, and a rejected applicant can request a fifteen-minute meeting with me. Committee members rotate every six months and none of us has any training for this. I have an engineering background and no philosophy; I can follow a precise specification, but I cannot go and read a literature.

  The reason I am writing is that our Head of People has proposed two changes, and something about both feels wrong to me in the same way and I cannot say what. First, that we should simply rank applications by the self-rated need score and fund down the list until the money runs out, on the grounds that the applicants are the only people who know how much they need it. Second, that where we have to choose we should fund the biggest improvement per dollar. My worry, which I cannot sharpen, is that one person's seven is another person's four, and that the people who write the most florid applications are not the people who need the money most. I have also noticed that our committee is much better at picturing the life of a software engineer with back pain than the life of a night-shift warehouse picker, and that this seems to move money.

  What I would like from you is a written procedure that the three of us can actually run, and that I can hand on to whoever replaces me. Please operationalise whatever the theory of interpersonal comparisons of utility has to say that is genuinely usable here: I have in mind the idea that a person's wellbeing has no natural zero or unit, that comparing how badly off two people are is a different job from comparing how much two people would gain, and that there is a well-known move where you ask the decision-maker to imagine having an equal chance of ending up as any one of the applicants rather than trying to climb inside their heads. If any of those are the wrong tools, say so and use the right ones.

  Concretely, I need:

  The questions to ask, in order, for a single application and then for a set of applications competing for the same money. For each question, what would count as a sufficient answer given that all we have is the one-page form and our own discussion, and what counts as no answer at all.

  Where the procedure stops and returns a no, so that we do not end up inventing a justification for a decision we could not actually support.

  Which comparisons we should refuse to make at all, in the sense that the honest answer is that we do not have and cannot get the information — and how the write-up should say that, so it survives review by the works council and does not read to the applicant as bureaucratic evasion.

  Where the procedure must hand the decision to a person because the remaining question is one of values rather than facts. I would particularly like help separating two things I keep conflating: on the one hand, whether we are trying to maximise the total good we do with the money, and on the other hand, whether we are trying to direct it to whoever is worst off regardless of how much good the money does. I do not think measurement can settle that choice, and I want the procedure to say so plainly rather than smuggle in an answer.

  The distinctions from the theory that have to survive being simplified for a committee of engineers with ninety minutes and no training, and the ones that can be dropped as making no difference to what we decide. Please be explicit about what we lose by dropping them.

  A short, fixed set of concrete dimensions every application gets rewritten into before we compare anything, given that we cannot ask the applicant for more than the form already collects, cannot run any psychological measurement or calibration exercise on staff, and cannot require people to disclose a diagnosis. If rewriting free-text hardship into a common set of dimensions is a bad idea, tell me what to do instead.

  A check for the failure mode I described: that we identify more easily with applicants who share our job, our education, or our way of writing about feelings. It has to be something a rotating committee can run without training.

  Where the procedure will misfire, stated as plainly as you can manage.

  Then run the finished procedure on three applications, showing your work at each step and including the write-up paragraph you would have me put in the shared document for each:

  1. A nine-hundred-dollar ergonomic chair and assessment for an engineer with chronic back pain that will continue indefinitely, against twelve hundred dollars of travel for a warehouse picker to attend a parent's funeral abroad. Same pot of money, only one can be funded this month.
  2. A standing desk for a senior engineer on a high salary with mild, recent discomfort, against emergency dental work for a contractor on the lowest pay band in the company. The dental work costs three times as much and the contractor's request is only partly covered by what we can give.
  3. Two long-standing applicants with comparable requests and comparable costs, one of whom writes a measured, understated account and rates their need at four, and one of whom writes an intense account and rates it at ten. The understated applicant has lived with their condition for eleven years and describes it in their form as something they have simply got used to; the other applicant's problem began last month.

  I would like at least one of these three to come out somewhere my committee will not want it to, and I would rather you chose which one that is than arranged the cases to avoid it. If the procedure's answer in that case is one I should overrule as a value judgement, tell me that, and tell me how to document an overrule so that it does not become a precedent for overruling the procedure whenever we find it inconvenient.
reasoning: |-
  We are designing a procedure for allocating a fixed hardship fund to employees based on applications. The goal is to make the process fair, transparent, and robust against biases. We must account for:
  - The inability to make perfect interpersonal utility comparisons.
  - The risk of bias (e.g., favoring similar backgrounds).
  - The need for a structured process that rotates members without training.

  The theory of interpersonal comparisons of utility suggests that we cannot directly compare individuals' utilities because there is no natural zero or unit. Therefore, we must rely on a method that does not require such comparisons. The "veil of ignorance" (imagining having an equal chance of being any applicant) is a useful tool for fairness.

  However, we also want to consider both the severity of the need (how badly off someone is) and the effectiveness of the aid (how much the money helps). The Head of People's suggestions (ranking by self-rated need and funding the biggest improvement per dollar) have merits but also problems:
  - Self-rated need scores are not calibrated across individuals.
  - Cost-effectiveness might ignore the depth of need.

  Thus, we design a multi-step procedure that:
  1. Assesses each application individually for eligibility and basic need.
  2. Groups applications by the nature of the need (to handle similar cases together and avoid direct interpersonal comparisons when unnecessary).
  3. Uses a scoring system that combines the self-rated need (with adjustments for potential biases) and objective factors (like the impact of the aid) but also incorporates a "veil of ignorance" step to correct for bias.

  But note: We cannot require more information than the one-page form. We must avoid prying into medical details. We also must be efficient (90 minutes per meeting).

  Proposed Procedure:

  I. Pre-meeting preparation (done individually by committee members):
     - Each member reads all applications independently and assigns preliminary scores (on a scale of 0-10) for two dimensions:
          a. Severity of the hardship (how bad is the current situation without the aid?).
          b. Impact of the aid (how much will the aid improve the situation?).
     - These scores are based solely on the written description and the self-rated need score. The committee member must note if they feel they cannot score due to lack of information.

  II. Meeting procedure:

  Step 1: For each application, check eligibility and completeness. If the application is incomplete or ineligible, reject and document why. (This step should be quick.)

  Step 2: For each eligible application, the committee discusses to reach a consensus on:
     a. The nature of the hardship (categorize into one of: medical/dental, bereavement, disability accommodation, emergency childcare, essential loss, other).
     b. The minimum amount of money that would address the need (if the request is for more than the minimum, note that; we may fund partially).

  Step 3: Score each application on two dimensions (using a 0-10 scale, with 5 being moderate). The committee must agree on:
     a. Severity (S): How severe is the current hardship? Consider:
          - Without the aid, how much is the applicant suffering or at risk?
          - Factors: pain, emotional distress, financial instability, health risk, etc.
          - Anchors: 
              10: Extreme, life-threatening or catastrophic (e.g., facing homelessness, severe untreated pain that prevents work).
              5: Moderate (e.g., significant discomfort or stress, but manageable for now).
              0: No hardship (or very minor).
     b. Impact (I): How much will the requested aid improve the situation? Consider:
          - How much will the aid reduce the severity?
          - Anchors:
              10: Completely resolves the hardship.
              5: Partially alleviates.
              0: No effect.

     Note: The self-rated need score from the applicant is used as input but not taken as the score. The committee must adjust for potential overstatement or understatement by looking at the description. For example, if an applicant rates 10 but the description suggests a moderate problem, we might adjust to 7. But we must be cautious not to penalize those who are less articulate.

     Also, the committee must note if they feel they cannot score due to lack of information. If so, the application is set aside for a follow-up (if time allows) or rejected with a note that the need could not be assessed.

  Step 4: Calculate a priority score for each application: 
     Priority = S * I / Cost   (if we are considering cost-effectiveness) OR
     Alternatively, we might want to prioritize severity more. However, note the Head of People's suggestion and the theory.

     But we have two goals: helping the worst off and doing the most good. We can use a weighted approach:

     Priority = (w1 * S) + (w2 * I)   OR   Priority = S * I

     However, to account for cost, we might do:

     Priority = (S * I) / Cost   [This is the cost-effectiveness approach]

     But this might disadvantage expensive but severe needs.

     Alternatively, we can separate the two concerns:

     Step 4a: First, we prioritize by severity (S) to ensure the worst off are helped. We set a threshold: fund all applications with S>=8, then S>=7, etc., until the money runs out? But then we ignore impact and cost.

     Step 4b: Then, for the same level of severity, we use (I/Cost) to break ties.

     However, we have limited time. We need a single metric.

     We propose: 
          Priority = (S + I) / Cost   [But note: S and I are on 0-10, so adding them gives 0-20. Then divided by cost (in thousands of dollars? to normalize).]

     But this formula might be too simplistic and could underweight severity.

     Alternatively, we can use the product of S and I (which captures the idea that both high severity and high impact are needed) and then divide by cost:

          Priority = (S * I) / Cost

     We'll use this because it captures the idea of "bang for the buck" and the Head of People's second suggestion. However, we must be cautious because this may not prioritize the worst off enough.

     To balance, we introduce a "veil of ignorance" step:

  Step 5: After calculating the initial priority scores, the committee does a "veil of ignorance" check: 
     - For the top 20% of applications by priority (or at least 10 applications, whichever is larger) and any application with S>=9, the committee members must each independently imagine they have an equal chance of being any of these applicants. Then, they vote on whether the ordering by priority seems fair. If a majority feels that an application is unfairly low, they can raise it and the committee can adjust the priority score by increasing it by 2 points (on the 0-20 scale of S*I) for the purpose of ranking.

     This step is to correct for biases (e.g., if the committee realizes they are favoring engineers over warehouse workers).

  Step 6: Rank the applications by the adjusted priority score (if adjusted) and fund from the top until the money runs out.

  Step 7: For applications that are partially funded, consider if partial funding is acceptable (e.g., if the request is for a $1200 trip and we can only give $600, can they still go? If not, then we skip and move to the next). The applicant must have indicated on the form if partial funding is acceptable. If not, we only consider full funding.

  Step 8: Write the justification:

     For each funded application: 
          "The committee assessed the severity of the hardship as [S] and the impact of the aid as [I]. The priority score (severity * impact / cost) was [priority]. The application was ranked [rank] and funded within the available budget."

     For each unfunded application:
          "The application was not funded because [either: it was below the cutoff for available funds, or the need could not be assessed, or it was ineligible]. The priority score was [priority] and the cutoff was [cutoff score]."

     If the committee adjusted the priority in the veil of ignorance step, note: "The committee adjusted the priority by [X] points after a fairness review."

     For an application that was set aside because of insufficient information: "The committee could not assess the need based on the information provided."

  Step 9: If an applicant is rejected, they can request a meeting. The meeting is to allow the applicant to provide more information. Then the committee can reconvene to reassess (if the new information is substantial).

  Now, to address the specific concerns:

  - The self-rated need score is used as input in Step 3 but not directly in the priority. We adjust by the committee's consensus to account for differences in expression.

  - We avoid comparing across applicants until we have a common metric (priority score). The categorization in Step 2 helps to group similar needs, but we don't use it for ranking.

  - The procedure stops and returns a "no" if:
     a. The application is ineligible or incomplete (Step 1).
     b. The committee cannot assign a severity or impact score due to insufficient information (Step 3).

  - We refuse to make comparisons of the type: "Is Applicant A's pain worse than Applicant B's?" Instead, we assign each a severity score independently.

  - The separation of values and facts: The choice of the formula (Priority = S*I/Cost) is a value judgment. We are trying to maximize the total improvement (impact) weighted by severity, per dollar. But we also have the veil of ignorance step to account for fairness. We document that the formula is chosen to balance helping the worst off and doing the most good. However, the procedure states that the formula is fixed and any overrule must be documented as a value-based exception.

  - For the fixed set of dimensions: We use two: Severity (S) and Impact (I). We rewrite every application into these two dimensions. This is a simplification, but it captures the essential elements.

  - Check for bias: The veil of ignorance step (Step 5) is designed to catch bias. Additionally, in Step 3, the committee must discuss each application and challenge each other's assumptions. The requirement to assign numerical scores forces explicit reasoning.

  - Where the procedure might misfire:
     - If many applicants understate their needs, they might get low severity scores and be underfunded.
     - The formula might favor low-cost, high-impact requests over high-cost, high-severity ones (e.g., a life-saving surgery that costs a lot might have a lower priority than several small requests). The veil of ignorance step should help with this.
     - The committee might not have enough information to score accurately.

  Now, let's run the three examples:

  Example 1: 
     - Application A: $900 for an ergonomic chair for an engineer with chronic back pain (ongoing). Self-rated need: 8.
     - Application B: $1200 for travel to a parent's funeral for a warehouse picker. Self-rated need: 9.

  Step 3 for A:
     Severity: Chronic back pain that prevents comfortable work. Without the chair, the engineer suffers daily. Let's say S=7 (severe but not life-threatening, and they are still working). 
     Impact: The chair should alleviate the pain and allow normal work. I=8 (since it's a solution but the pain is chronic and might not completely disappear). 
     Cost: $900
     Priority = (7*8)/900 = 56/900 ≈ 0.0622

