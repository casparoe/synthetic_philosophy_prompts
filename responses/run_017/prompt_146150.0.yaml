  Write-up for B: "The committee assessed the severity of the bereavement and travel need as 8 and the impact as 9. The priority score (72/1200=0.06) was below the cutoff. The application was not funded."

  But the committee might feel uncomfortable. They might overrule. How to document:

     "The committee, after the veil of ignorance step, felt that the warehouse worker's need was more urgent and critical. Although the priority score was lower, we decided to fund B instead. This is a value-based override because we prioritized a one-time critical event over an ongoing need. We note that this override is exceptional and based on the unique circumstances of this case."

