answer: |-
  ## The Whiteboard Session (1180 words)

  **Setting:** A health authority conference room. Meg (late 30s, precise gestures) and Avi (40s, intense stare) stand at a whiteboard covered in equations and the words "Flat", "Spread", "Big Flip". Coffee cups sit forgotten.

  **Meg:** (Tapping the board) Okay, Avi, let’s bottom this out. We agree Harsanyi’s theorem is *formally* correct: If a social ranking over *lotteries* satisfies the vNM axioms (completeness, transitivity, continuity, independence) and respects *ex ante* Pareto (if every individual, using their *own* expected utility, strictly prefers lottery P over Q, then society prefers P over Q), then social welfare *must* be a weighted sum of individual expected utilities: W = Σ wᵢ * EUᵢ. The impartial observer – imagining an equal chance of being anyone – gets you equal weights wᵢ. It’s elegant. It *is* utilitarianism for risky prospects.

  **Avi:** (Nodding slowly) Elegant, yes. Delivers *utilitarianism*? No. Because that sum Σ wᵢ * EUᵢ? It’s not a moral conclusion until you tell me what those wᵢ are and what zero means for each uᵢ. Your theorem assumes unit interpersonal comparability – that we can compare *gains and losses* across people. But individual vNM utility functions are defined only up to affine transformations: uᵢ → aᵢuᵢ + bᵢ, aᵢ > 0. Change my normalization – shift my zero point, rescale my units – and your weighted sum changes arbitrarily! Utilitarianism needs fixed zero points and fixed scales. Leximin only needs level comparability – who’s better off *absolutely*. Your theorem *presupposes* the comparability it needs to look utilitarian.

  **Meg:** (Leans forward) But that’s *why* the impartial observer is crucial! It fixes both levels *and* units. Imagine you don’t know who you’ll be. You have a single utility function over states: "being person i at welfare level x". The *observer’s* preferences under uncertainty are governed by vNM rationality. Crucially, *respecting each person’s own attitudes* – meaning if the observer, behind the veil, knows they’ll be person i, their preferences over prospects *for i* must match person i’s own preferences. That pins down the observer’s utility for being i at x relative to y. Combine that with the equal probability weighting, and *boom* – you get a common scale and zero point. Equal weights wᵢ fall out. The observer device *provides* the interpersonal comparisons the weighted sum needs.

  **Avi:** (Shaking head) Meg, that’s circular. What does "respecting each person’s own attitudes" *mean* in setting up the observer’s utility? It means that the observer’s *ex ante* preference over identity-lotteries, conditional on being a specific person, aligns with that person’s preference. It smuggles in *ex ante Pareto* at the individual identity level! You’re using the very principle – that social preference must track unanimous *ex ante* individual expected utility orderings – to *define* the comparisons needed to make that principle yield utilitarianism. It’s a consistency argument, not a foundation. It doesn’t tell me *why* I should accept that the observer *must* respect each person’s risk attitudes in this way when forming a *moral* judgment. It assumes the moral relevance of *ex ante* individual perspectives.

  **Meg:** Alright, let’s ground it with our cases. Ten thousand people, same baseline. Flat: everyone gets 1, total 10,000 for sure. Spread: each gets heads=3/tails=0 independently. Big Flip: one coin, all get 3 or all get 0. Everyone risk-neutral over their *own* welfare. So:
  *   Each individual: EU(Flat) = 1. EU(Spread) = 1.5. EU(Big Flip) = 1.5. *Ex ante* Pareto is silent between Spread and Big Flip, and prefers both over Flat.
  *   Harsanyi: Society must prefer both Spread and Big Flip over Flat. With impartial observer, equal weights, W(Spread) = W(Big Flip) = 15,000 > W(Flat) = 10,000. Done. One uniform theorem.

  **Avi:** But that’s precisely where the rubber meets the road! Look at the *realized* distributions.
  *   **Spread:** After the coins flip, we have (almost certainly) ~5000 at 3, ~5000 at 0. Total is still 15,000, yes, but it’s terribly unequal. *There’s no uncertainty left.* Choosing Spread over Flat *ex ante*, when we know the near-certain outcome is this split, means choosing a known unequal distribution over a known equal one. What’s "Pareto" about that? The losers (tails) are *objectively worse off* than under Flat. Appealing to their *ex ante* consent (because they hoped for heads) feels hollow once the coin lands. The theorem forces you to prioritize aggregate *ex ante* expectation over the *ex post* distributional consequences *even when the uncertainty washes out almost completely*. That’s not ordinary Pareto; that’s fetishizing the *veil*.

  **Meg:** So you’d prefer Flat to Spread? Knowing it gives less expected utility for *everyone*?

  **Avi:** No! *Ex post*, I might well prefer Spread’s 15,000 total to Flat’s 10,000. But I care *how* it’s distributed. My social welfare in a *state* isn’t linear: it’s Σ f(uᵢ), with f concave – prioritizing gains to the worse-off. So for *Spread’s realized state*: W ≈ f(3)*5000 + f(0)*5000. For *Flat’s realized state*: W = f(1)*10000. If f is sufficiently concave, Spread’s state could be worse than Flat’s state, despite the higher total. My *ex-ante* social preference is the expectation of this ex-post welfare: E[Σ f(uᵢ)]. So EU(Spread) ≈ 0.5 * [f(3)*10000] + 0.5 * [f(0)*10000]? No! Each person's outcome is independent. The expectation is over the *massive* number of possible distributions, but the overwhelmingly most likely outcome dominates: E[W_spread] ≈ Σᵢ E[f(uᵢ)] = 10000 * [0.5*f(3) + 0.5*f(0)]. For Big Flip, E[W_big] = 0.5 * f(3)*10000 + 0.5 * f(0)*10000. Compare E[W_flat] = f(1)*10000. *I satisfy vNM linearity in probabilities over states of nature!* My objection isn't to probabilities, it's to *linearity in utilities across people within a state* and the *ex ante Pareto* principle forcing me to ignore distribution *ex post*.

  **Meg:** (Eyes narrow) Ah, so you *are* vNM rational at the social level over external risk. But look at Big Flip. Under Harsanyi, W(Big Flip) = 1.5 * 10000 = 15,000. Under you, E[W_big] = 0.5 * f(3)*10000 + 0.5 * f(0)*10000. Since f is concave, Jensen’s inequality tells us this is *less* than f(1.5)*10000. Harsanyi gives 15,000. You give something less than f(1.5)*10000. You’re exhibiting *social risk aversion* towards aggregate shocks, purely because of your concavity in the cross-section! Yet you claim individuals are risk-neutral and you accept linearity in probabilities. Isn't that inconsistent? The risk aversion pops out *only* because you care about inequality.

  **Avi:** It’s perfectly consistent! My concavity (f) reflects a *value judgment*: an extra unit of welfare matters more to someone at level 0 than to someone at level 3. *That’s* the priority view. In Big Flip, the *bad* state (everyone at 0) is catastrophic not just because it's low, but because everyone is equally badly off – there’s no one better off to shoulder the burden or help. The *ex post* welfare sum Σf(uᵢ) is very low in that state. The *good* state (everyone at 3) is great. I average *those* ex-post evaluations. The "risk aversion" you see is *entirely* a consequence of my aversion to *ex post* inequality (captured by f's concavity) and the fact that Big Flip creates perfect correlation. Spread, by scattering the risk, ensures that even in the worst-case *overall* state (though unlikely), many people are fine and can potentially aid others. My E[W_spread] ≈ 10000 * [0.5f(3) + 0.5f(0)] could easily be higher than E[W_big] = 5000*f(3) + 5000*f(0), precisely because of the concavity – spreading risk is better under prioritarianism. *That’s* the substantive moral difference Harsanyi flattens.

  **Meg:** But Avi, *what fixes f?* And its zero? You say it's a value judgment about diminishing moral weight. Fine. But how deep does that judgment go? If I rescale person i's utility – uᵢ → 2uᵢ – suddenly gains to them look morally smaller relative to others because their "level" seems higher, even though nothing material changed. Your f needs *full* interpersonal comparability, including levels and ratios. Harsanyi, via the impartial observer, pins down a specific scale where weights are equal. Your prioritarianism leaves the *degree* of concavity and the *anchoring* of the scale wide open – it’s arbitrary in a different way! You traded one normalization problem for another, arguably bigger one.

  **Avi:** (Concedes reluctantly) That’s a fair hit, Meg. Choosing f *is* a substantive, difficult normative choice. It needs stronger interpersonal comparisons – level comparability at least, perhaps ratio comparability depending on f. The theorem doesn't generate those comparisons; it assumes the social planner brings them. But here's the key difference: *I’m not claiming my view is uniquely demanded by rationality plus minimal Pareto.* I’m saying Harsanyi’s premises – especially *ex ante* Pareto applied to identity-lotteries – *encode* a specific, contestable moral value: that individual *ex ante* consent, based on personal expected gain, trumps all *ex post* distributive concerns. The normalization for utilitarianism is fixed *by* accepting that value fully. I *reject* that value as overriding. I care intrinsically about the *ex post* distribution. The arbitrariness in choosing f reflects the *substantive* moral debate about how much priority the worse-off deserve, a debate your theorem tries to bypass by deriving weights from a consistency condition I find morally loaded.

  **Meg:** (Sighs, wipes some dust off the board) And I think you’re conflating the state of uncertainty with the state of distribution. The theorem shows that if you want rational aggregation under uncertainty respecting individual *prospective* evaluations, utilitarianism is the price. Your rejection of Spread over Flat, when the outcome is near-certain inequality, reveals you prioritize *ex post* equality over unanimous *ex ante* expected benefit. That *is* a fundamental value choice. But I’ll concede this: the impartial observer, while brilliant, isn’t a magical comparison machine. It relies on the idea that rational choice behind a veil *should* track individual risk attitudes. If you think morality shouldn’t be grounded solely in hypothetical rational choice under those specific conditions… then yeah, the door is open. But within the framework of rational social choice under risk, Harsanyi defines the game.

  **Avi:** Agreed. And I concede the theorem is formally impeccable within its assumptions. My point is those assumptions *are* the battleground. The Big Flip/Spread divergence shows *ex ante* Pareto demanding we treat two socially very different risks identically. That’s where I jump ship. The concavity of f is how I express the judgment that sometimes, less aggregate expected benefit is better if it avoids terrible *ex post* distributions or catastrophic correlated losses – a judgment excluded by your premises.

  **Where it Bottoms Out:**

  **Meg:** "The core disagreement is whether respecting individual *ex ante* expected utility preferences over social lotteries – including the identity-lottery setup of the impartial observer – is the foundational moral requirement for rationality under uncertainty. Harsanyi shows it forces utilitarianism. Avi rejects that requirement as overriding, prioritizing *ex post* distributional fairness instead. The theorem can't settle *which* requirement is morally fundamental; that's prior."

  **Avi:** "Exactly. The theorem assumes the moral relevance of *ex ante* individual perspectives under the veil. I deny that relevance is absolute. The real question underneath is: Does morality fundamentally concern itself with *prospective* individual gains, or with the actual *realized* states of affairs across persons? Harsanyi builds the first into his axioms. I build the second into f. The empirical fact of risk-neutral individuals doesn't touch that normative core."
