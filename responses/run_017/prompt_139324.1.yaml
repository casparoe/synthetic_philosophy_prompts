prompt: |-
  I'm writing a feature about how institutions handle uncertainty when the numbers refuse to sit still, and there's one practice whose logic I can't reconstruct. Over the last decade or so, reform-minded corners of the social and biomedical sciences have reacted to the discovery that reasonable analytic choices — which controls to include, which cases to drop, how to measure the outcome — can move a result by a great deal. The reaction has been to run the same analysis many ways (handing one dataset to many independent teams, or having a single team report every defensible combination of choices as a specification curve), to publish the whole spread rather than a preferred estimate, and to treat a claim as established only if it holds across the entire spread rather than being pooled into one best guess. A large philanthropic funder I'm profiling has pushed this into policy: it will fund an intervention only if the estimated effect is positive under every specification its analysts rated as defensible, and when nothing clears that bar it funds whichever option has the best worst case. Yet the same funder's cost-benefit spreadsheets plug in a single point estimate and a single discount rate and return one optimal recommendation, and it pays for replication studies on the stated rationale that more evidence shrinks uncertainty.

  My tentative reconstruction is that the spread-publishing and unanimity rules presuppose that a body of evidence determines not one probability but a set of them, that the spread is not sampling noise which averaging would cancel out, and that we are not entitled to probabilities over the specifications themselves — since if we had them, ordinary model averaging would hand back a single number and the whole apparatus would be pointless. On that reading the practice quietly commits its adopters to something like imprecise credences plus a particular rule for deciding under them, and it rules out both the view that evidence pins down a unique rational degree of confidence and the view that the spread merely reflects our ignorance about which analysis is correct and should be averaged over with a second-order probability.

  Two things complicate this for me. First, the funder builds its list of specifications by inviting rival teams to propose analyses, so the bounds of the set depend on who turned up and what occurred to them: does the practice have to treat the set as a fact about the evidence, or can it admit that the width is partly an artifact of who was in the room? Second, a source tells me that when your probabilities form a set and you update on merely partial or coarse evidence, the interval for a hypothesis can come out strictly wider than it was before — that you can learn something and end up less precise. If that is right, the replication plank of the same policy seems to presuppose a narrowing that the reporting plank denies. I'd like you to reconstruct the implicit epistemology of this package: distinguish what the practice strictly presupposes from what it merely sits well with, say which rival views of uncertainty it rules out and which would license it anyway, tell me whether the point-estimate cost-benefit step and the set-valued evidence step can be made consistent or whether one of them has to go, and sketch what the funder would have to change if it took imprecision seriously all the way down. Please answer as exactly five numbered items, each one or two sentences long, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user is writing a feature about how institutions handle uncertainty in the social and biomedical sciences. They're particularly interested in a specific practice where researchers run multiple analyses on the same dataset and require results to hold across all defensible specifications. There's a philanthropic funder implementing this approach in their grant decisions, requiring interventions to show positive effects under every defensible specification. 

  The user has reconstructed this as reflecting "imprecise credences" - the idea that evidence determines a set of probabilities rather than a single probability. They note several complications: the specifications depend on which analysts are involved, and updating on partial evidence might actually widen the uncertainty interval rather than narrow it. They're asking me to reconstruct the implicit epistemology behind this practice.

  I need to address several specific points: what this practice presupposes versus what it merely accommodates, which views of uncertainty it rules out, whether the point-estimate cost-benefit approach can coexist with set-valued evidence, and what changes would be needed if the funder took imprecision seriously throughout.

  For the epistemology, this practice fundamentally rejects that evidence determines a unique rational probability. It treats the specification spread as irreducible uncertainty about the true model, not just sampling noise. It rules out Bayesian model averaging which would collapse the spread. The set of specifications is treated as defining the boundaries of defensible uncertainty, though it's acknowledged this depends on which analysts participated.

  There's a tension with how the funder handles replication studies. The practice suggests replication might not narrow uncertainty if it adds new specification possibilities, contradicting the stated rationale that more evidence reduces uncertainty. The point-estimate cost-benefit analysis is inconsistent with this epistemology as it treats uncertainty as reducible to a single number.

  If the funder wanted full consistency, they'd need to maintain set-valued representations throughout - using intervals or sets in cost-benefit calculations and acknowledging that replication might widen rather than narrow uncertainty ranges. But this would fundamentally change how they make decisions.
answer: |-
  1.  The practice presupposes that evidence generates an irreducible *set* of reasonable probability assignments (imprecise credences), not a single unique value, treating the specification spread as fundamental epistemic indeterminacy rather than quantifiable uncertainty.
  2.  It strictly rules out views where evidence dictates one rational degree of belief (strict Bayesianism) *and* views where specification uncertainty is merely ignorance that should be averaged over using second-order probabilities (Bayesian model averaging).
  3.  The set's boundaries are treated as inherent to the evidence, though contingent on which specifications analysts proposed; the practice must view the resulting spread as reflecting the *available* defensible uncertainty, even if dependent on participation.
  4.  The replication rationale (more evidence narrows uncertainty) conflicts with the epistemology: updating imprecise credences on coarse evidence can widen intervals, implying replication might *increase* indeterminacy if it reveals new defensible specifications.
  5.  The point-estimate cost-benefit analysis is inconsistent; coherence would require set-valued inputs/outputs (e.g., min-max or interval dominance rules) throughout, forcing the funder to abandon single-number optimizations if taking imprecision seriously.
