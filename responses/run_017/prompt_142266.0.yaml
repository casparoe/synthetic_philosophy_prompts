  Okay, the user wants a villanelle about information cascades for their literary magazine. They’re pairing poems with concepts from other classes, so this needs to be both poetic and conceptually precise. 

  First, I need to unpack their requirements. The core idea is an information cascade—where people sequentially follow others’ actions while ignoring their private signals. The two refrains must represent: 1) the private signal (what the individual knows) and 2) the public action (what they do despite their knowledge). The villanelle’s repeating lines should show how reasoning shifts around these fixed points, culminating in their juxtaposition in the final stanza to highlight how the private signal gets drowned out, not disproven.

  Key nuances they emphasized: 
  - No character should seem irrational; following the crowd must feel logically defensible. 
  - Distinguish between copying due to inferred knowledge ("they must know something") vs. social cost ("being the outlier is painful"). They prefer focusing on the latter, especially in high-school-like settings where social penalties are visceral. 

  Setting matters—they want ordinary scenarios (food truck line, lunch table) to ground the abstraction. Diction should stay plain; no jargon or explanations. The poem must work as standalone art while satisfying readers who understand cascades. 

  For structure: The villanelle’s 19 lines with ABA rhyme and refrains (A1/A2 repeating in set pattern) is perfect—it naturally forces tension between fixed refrains and evolving context. I’ll make A1 the private signal ("My own eyes say the special’s sold out"), A2 the public action ("I take my place and say I’ll have it too"). 

  The challenge is showing the shift from "maybe they know more" to "resisting costs too much." Stanzas 2-4 should trace this: early actors might genuinely doubt their signal, but later ones clearly yield to social pressure. The final quatrain must pit both refrains side by side without resolution—yes, the special is sold out (private signal was right), but the speaker still orders it (public conformity). 

  High school cafeteria setting feels right: visible social stakes, mundane choices amplifying dread of deviation. Words like "laminated sign," "plastic tray," "gossip" keep it grounded. Avoiding terms like "cascade" or "signal" maintains subtlety. 

  Biggest risk is making the conflict too neat. The horror isn’t ignorance—it’s knowing better but complying because the cost of truth-telling is isolation. Last line’s "I take my place" should echo both queue position and social submission. Reader recognition comes from seeing the uncancelled private signal literally next to futile compliance.
answer: |-
  ## Lunch Line Logic

  The laminated sign says *special's sold out* —  
  but the queue snakes forward, so what can I do?  
  *I take my place and say I'll have it too.*

  The girl ahead shrugs; she had her own doubt  
  but followed the three before her. It grew.  
  (The laminated sign says *special's sold out*.)

  The third boy looked nervous, glanced round about,  
  saw two trays held high, thought *They must know*. True?  
  *I take my place and say I'll have it too.*

  The second girl whispered, felt cold with the rout  
  of being alone, wrong in plain view.  
  (The laminated sign says *special's sold out*.)

  The first just guessed wildly, a playful redoubt  
  against the bland daily. None had a clue.  
  *I take my place and say I'll have it too.*

  The cost isn't wrongness, but standing without  
  the crowd, the sharp gossip, the sideways "Hey, you—?"  
  **The laminated sign says *special's sold out*.  
  I take my place and say I'll have it too.**  

  ---

  **Notes on the Villanelle:**

  *   **Refrains:** "The laminated sign says *special's sold out*" (private signal) & "I take my place and say I'll have it too" (public action).
  *   **Reasoning Shift:** Early stanzas show doubt ("she had her own doubt," "looked nervous") implying *maybe the crowd knows more*. Later stanzas shift to social cost ("felt cold with the rout / of being alone," "The cost isn't wrongness, but standing without / the crowd").
  *   **Final Stanza:** The private signal and public action land side-by-side, emphasizing the signal *wasn't refuted* ("sold out" remains true), yet the action *still happens* due to social pressure ("being the one who walked away is expensive").
  *   **No Irrationality:** Characters act understandably ("what can I do?", "thought *They must know*", "the cost isn't wrongness").
  *   **Focus on Social Cost:** The poem leans into the second case ("being the one who walked away is expensive") as requested, especially in stanzas 4 & 5 and the final couplet.
  *   **Ordinary Setting:** A high school cafeteria lunch line ("laminated sign," "queue," "trays," "gossip"). Diction is plain and concrete.
  *   **Standalone & Recognizable:** The poem avoids jargon. Readers familiar with cascades will identify the refrains and see the unresolved tension in the ending – knowing the truth doesn't free the speaker from the social cost of acting on it. The cascade persists despite its internal contradiction.
