  Okay, the user is a TA for a 200-level course called Technology, Power, and Society. They're dealing with a diverse group of students, including engineering and CS majors who might be resistant, and others from poli sci or sociology. The class recently read Winner's "Do Artifacts Have Politics?" and the TA noticed two main reactions: some students saw it as the designer being prejudiced, while others thought artifacts are neutral and depend on usage. The TA wants an activity where students experience the politics of technology firsthand, especially the concept of "orphaned politics"—where the political effects of an artifact persist even after the original intent is gone.

  The TA has a rough idea: split students into groups to design an artifact that allocates a scarce resource, then assign roles that might disadvantage certain individuals, and have them live under another group's system. But they want a third phase to highlight orphaned politics. The key is for students to realize that the artifact's effects outlive the designers' intentions, and no one currently in charge is actively maintaining those effects.

  First, I need to design an activity that meets these goals. The activity should have three phases: design, implementation with assigned roles, and then a twist to show orphaned politics. The twist could involve changing the context—like swapping the scarce resource or the user demographics—so the same artifact now has different, unintended consequences. The original designers aren't around to explain or modify it, highlighting how the artifact's politics persist independently.

  Materials should be simple and identical for all groups to avoid bias. Things like index cards, markers, dice, tokens. The scarce resource could be "Priority Points" which can be exchanged for a small reward, making it mildly desirable. Roles need to introduce asymmetries: someone with mobility issues, time constraints, sensory sensitivities, etc. These roles should create disadvantages when interacting with the allocation systems.

  For the orphaned politics phase, after groups have used each other's systems, introduce a sudden change. Maybe announce that the resource is now "Flex Time" for assignment deadlines instead of Priority Points. Or swap the roles among groups. The key is that the artifact remains the same, but the context shifts, causing unforeseen issues. The original designers aren't there to adjust the system, so students have to cope with the existing setup, leading to frustration and realization.

  Potential pitfalls: Engineering students might suggest redesigning the artifact as a solution. The TA needs to address this in the debrief by discussing real-world constraints like sunk costs, path dependency, and material limitations. Also, the activity might run long, so strict timekeeping is essential. Some groups might design overly complex systems, so emphasizing simplicity could help.

  In the debrief, the TA should connect the activity to Winner's concepts. Point out moments where the artifact's effects persisted despite changed contexts, and how no one intended the new disadvantages. Highlight that both interpretations from the reading (designer's intent vs. usage) fall short when the original reasons are gone but the effects remain.

  The structural limitation of the activity is the time scale. Real-world artifacts persist for years, accumulating layers of adaptation, while the exercise is short. Also, real systems involve multiple stakeholders and higher stakes, which the activity can't fully replicate. The TA should emphasize these points in closing to bridge the gap between the exercise and real-world examples.
answer: |-
  Here’s a redesigned activity focused on generating "orphaned politics," with concrete implementation details, pitfalls, and structural limitations addressed. The core twist repurposes artifacts into a new context where original intentions are irrelevant but biases persist.

  **Activity Title:** *The Allocation Machine Challenge*  
  **Goal:** Experience how artifacts encode politics that outlive their creators' intent.  
  **Time:** 75 minutes  
  **Materials per Group:**  
  - 10 index cards  
  - 2 dice  
  - 5 tokens (e.g., poker chips)  
  - 1 marker  
  - 1 envelope with **Phase 2 role cards** (see below)  
  - 1 sheet: *"Rules: Design a system to allocate PRIORITY POINTS (PP). These can later be traded for: 1) First pick of presentation slots, 2) +1% bonus on next quiz, 3) Snacks."*  

  ---

  ### **Phase 1: Design (20 min)**  
  - **Groups:** 5 groups of 5–6 students (mix majors if possible).  
  - **Task:** Using materials, design a physical/digital system to allocate 5 PP *per group* during Phase 2. Rules must be written on index cards.  
  - **Constraints:**   
    - The system must operate *autonomously* (no human judgment during use).  
    - It must use at least 3 materials.  
  - **Prep Tip:** Circulate and push groups toward "efficiency" or "fairness" to embed biases (e.g., "Could a fast runner benefit more here?").  

  ---

  ### **Phase 2: Live Under the System (20 min)**  
  1. **Assign Roles:** Each student draws a role card from their group’s envelope:  
     - *Commuter:* Must stand near the door at 60:00 and 75:00 (simulates bus departure).  
     - *Back Pain:* Cannot bend below knee height.  
     - *Loud Advocate:* Must argue for their preferred outcome twice.  
     - *Room Manager:* Must rearrange 3 chairs before Phase 2 ends.  
     - *(If 6 students) Note-Taker:* Must document all PP allocations.  
     - *(All roles)* Must maximize their own PP.  

  2. **Implement:** Groups use *another group’s* system to allocate PP. Run 2–3 allocation rounds (e.g., every 5 min).  

  ---

  ### **Phase 3: Orphaned Politics Twist (15 min)**  
  - **The Change:** Announce: *"Due to unforeseen circumstances, PRIORITY POINTS are now STUDY CREDITS (SC). 1 SC = +15 min on the final exam. All systems remain exactly as built."*  
  - **New Context:** Add: *"The Dean’s office just announced: Commuters get +2 SC automatically. Back Pain sufferers need a doctor’s note (only 1 group has one)."*  
  - **Task:** Groups use the *same* machine to allocate SC under new rules. No modifications allowed.  

  ---

  ### **Debrief (20 min)**  
  **Guiding Questions & Connections:**  
  1. *"What frustrated you in Phase 2? Was it the designer’s fault?"*  
     → Links to *intended* politics (e.g., a dice system advantaged Loud Advocates who demanded rerolls).  

  2. *"In Phase 3, did your system feel fair? Why did it still help/hurt some of you?"*  
     → Highlights *orphaned politics*: The artifact’s bias persists (e.g., a token system now disadvantages Commuters who lost time near doors), but no one "chose" this.  

  3. *"Who could ‘fix’ this now? Did the original designers anticipate Phase 3?"*  
     → **Address engineers:** "Could we redesign? Sure—but the exam is tomorrow, the system is embedded in campus infrastructure, and the designers graduated. Is ‘just redesigning’ always feasible?"  

  4. **Map to Winner:**  
     - *Low Bridges:* "Remember the bus/overpass? Phase 3 was like buses being repurposed for school transport but overpasses staying low."  
     - *Compatibility vs. Requirement:* "Did your system *require* disadvantage (e.g., tokens on the floor hurting Back Pain), or was it *compatible* with it?"  

  ---

  ### **What Will Go Wrong (And How to Mitigate)**  
  1. **Pitfall:** Groups design over-complex systems.  
     - *Fix:* Enforce "3-material max" and veto over-engineered designs.  

  2. **Pitfall:** Role-play feels silly/lacks emotional buy-in.  
     - *Fix:* Assign roles authoritatively ("You *are* the Commuter—lose 1 PP if late to the door"). Use physical constraints (e.g., tape "knee-height line" on wall).  

  3. **Pitfall:** Engineers dominate design and dismiss politics.  
     - *Fix:* In Phase 2, force them into disadvantaged roles (e.g., Back Pain). Ask: "Could your *own* design have harmed you?"  

  4. **Pitfall:** The PP/SC reward feels inconsequential.  
     - *Fix:* Follow through post-activity (e.g., award actual bonus points/snacks).  

  ---

  ### **Structural Limitation: What the Activity CAN’T Capture**  
  **The Weight of Time and Entanglement**  
  > *"In 15 minutes, you saw orphaned politics emerge. But in reality, artifacts accrue layers of adaptation (e.g., workarounds for low bridges become ‘normal’). Sunk costs aren’t just money—they’re cultural habits, legal precedents, or ecosystems built around the artifact. Concrete isn’t just heavy; it’s woven into daily life. You can’t ‘just redesign’ because the artifact has already reshaped the world to depend on its flaws."*  

  **Supply This in Closing:**  
  - Show **2 slides**:  
    1. *1950s highway design* ("intended to speed travel").  
    2. *Same highway dividing a neighborhood today* ("orphaned politics: it still excludes, but planners are retired, and funding is locked into repairs").  
  - Ask: *"Who ‘has’ the politics here? The concrete? The long-dead designer? The city that won’t pay to tear it down? Or all of us who’ve adapted to it?"*  

  This forces confrontation with Winner’s core tension: Politics isn’t *in* the artifact or *in* people—it’s in the ongoing relationship between them, hardened by time.  

  ---
  **Final Tip:** Start debrief with student outrage ("X’s system was rigged!")—then dissect *why* it felt rigged *even after the rules changed*. The emotion makes the theory stick.
