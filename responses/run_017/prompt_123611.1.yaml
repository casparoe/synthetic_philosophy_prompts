     - Safety theorist: They are happy because safety matches the intuition. They might not care about sensitivity.

  Conclusion: The case satisfies the specifications. It embarrasses the no-false-lemma analysis and global reliabilism (if they accept 95% as sufficient) and supports the safety condition. The case survives its defects: the control tolerance is set at a standard level, and the hidden common mode is a real phenomenon in science.
