  ### 75-Minute Classroom Activity: The Order-Dependent Expectation  
  **Goal:** Students discover that expected value can be undefined due to conditional convergence, experiencing firsthand that the sum depends on the order of aggregation.  

  **Materials:**  
  - Index cards (2 sets of 20 cards per group, see below)  
  - Calculators (students can use phones)  
  - Projector + spreadsheet (for instructor’s laptop, used only in debrief)  
  - Coins (for physical setups)  
  - Prizes: Homework tokens for group with "most defensible price"  

  **Prep:**  
  - **Card Decks:** Create two types of decks (each with 20 cards) representing the same gamble:  
    - **Deck A (Coin-Flip Order):** Cards ordered by \(n = 1, 2, 3, \dots, 20\) with:  
      - Outcome: \((-1)^{n-1} \cdot 2^n / n\)  
      - Probability: \(1/2^n\)  
      - *Example:*  
        - \(n=1\): Outcome = \(+2.00\), Prob = \(1/2\)  
        - \(n=2\): Outcome = \(-2.00\), Prob = \(1/4\)  
        - \(n=3\): Outcome = \(+2.67\), Prob = \(1/8\)  
        - ... (up to \(n=20\))  
    - **Deck B (Shuffled Order):** Same cards, but order rearranged to **maximize partial-sum divergence** (e.g., group positives then negatives: all \(n\) odd first, then all \(n\) even).  
  - **Physical Setups:**  
    - **Table 1 (Coin Flips):** Coin flipped until first heads; \(n\) = flips (including heads). Payoff calculated as above.  
    - **Table 2 (Urn Draw):** "Urn" (hat) with 20 tickets. Tickets correspond to Deck B’s order (e.g., Ticket 1: \(n=1\), Ticket 2: \(n=3\), Ticket 3: \(n=5\)... then \(n=2,4,6...\)).  

  **Activity Flow:**  

  #### Part 1: Group Work (30 min)  
  1. **Intro (2 min):**  
     - *Instructor:* "We’re exploring a new game. You’ll compute a fair price (in points) to play it. Points convert to homework tokens. No upfront math—just aggregate the outcomes in the order given!"  
     - Assign groups (3–4 students each). Half get Deck A, half get Deck B.  

  2. **Task (23 min):**  
     - *Instructions:*  
       - "Compute your max willingness to pay by summing: **(Outcome × Probability)** for each card **in order**."  
       - "Record partial sums after every 5 cards to see convergence."  
       - "Ignore probabilities beyond card 20—they’re negligible." (This truncates the infinite series, but the tail is small: \(\sum_{n=21}^{\infty} 1/2^n \approx 0\)).  
     - *Key twist:* Groups with **Deck A** (natural order) see **oscillating partial sums** (e.g., +1.0 → -0.5 → +0.83 → ...). Groups with **Deck B** (positives first) see **large positive sums early**, then sharp drops.  
       - *Example partial sums for Deck B (first 10 cards):*  
         After 5 cards (all odd \(n\)): +8.50  
         After 10 cards (all odd \(n\)): +12.00  
         After 15 cards (all odd + first 5 even): -5.50  
         After 20 cards: +0.65 (matches Deck A’s final sum)  

  3. **Physical Setups (5 min concurrent):**  
     - Two volunteers play at Table 1 (coin flips) and Table 2 (urn draw).  
     - After 5 min, they report outcomes (e.g., Table 1: \(n=4\), payoff = \(-4.00\); Table 2: drew \(n=5\), payoff = \(+6.40\)).  

  #### Part 2: Price Report & Conflict (15 min)  
  1. **Report Prices (5 min):**  
     - Groups post max prices (e.g., Deck A groups: 0.60–0.70 points; Deck B groups: 1.50–2.00 points).  
     - *Instructor highlights:* "Same probabilities, same outcomes—but different prices!"  

  2. **Compare Setups (5 min):**  
     - Ask: "Table 1 (coins) and Table 2 (urn) produced different outcomes. Are these the *same gamble*?"  
     - Students note: Probabilities are identical, but Table 2’s urn "feels different" due to ticket order.  

  3. **Spoiler Alert (5 min):**  
     - *If advanced students say, "This is the Pasadena game!":*  
       - Acknowledge: "Some may have seen this—but let’s see *why* it breaks. Your job is to find where the calculation fails."  
     - *If a group refuses to bid:* "What’s your concern?" (E.g., "The sum keeps changing!"). Use this in debrief.  

  #### Part 3: Debrief (30 min)  
  **Guided Discussion Map:**  
  | **Activity Moment**               | **Formal Point**                                                                 |  
  |-----------------------------------|----------------------------------------------------------------------------------|  
  | Groups reported different prices  | Expected value isn’t defined by the distribution alone—it depends on *order of summation*. |  
  | Deck B’s sum "converged" late     | The series is *conditionally convergent*: converges to different values when rearranged. |  
  | Final sums matched for \(n=20\)   | Truncation hides the issue. The *infinite series* is where order matters.        |  
  | Physical setups felt "different"  | The aggregation procedure (coin flips vs. urn) can be part of the gamble definition. |  
  | A group saw wild partial sums     | "Undefined" isn’t infinite or unknown—it’s *fundamentally unstable*.              |  

  **Key Debrief Points:**  
  1. **Order Dependence (10 min):**  
     - Show spreadsheet: Natural order (\(n=1,2,3,\dots\)) converges to \(\ln 2 \approx 0.693\).  
     - Rearrange terms (e.g., +1 positive, +2 negatives): converges to \(1.04\) or any chosen value!  
     - *Punchline:* "Expected value isn’t a property of the gamble—it’s a property of the gamble *plus how you list outcomes*."  

  2. **Undefined vs. Infinite (5 min):**  
     - Contrast St. Petersburg (infinite EV) with this (EV can be 0.693, 1.04, or -5.0—no "fact of the matter").  

  3. **Escape Hatches & Costs (10 min):**  
     - *Cap payoffs:* "What if we bound outcomes?" (Loses the gamble’s essence; arbitrary cap).  
     - *Natural order:* "Why \(n=1,2,3,\dots\)?" (Physical setups may order differently).  
     - *Average over orderings:* "Is this computationally or philosophically justified?" (Not standard in decision theory).  
     - *Abandon expected utility:* "Use median payoff? Maximin?" (Loses EU’s coherence).  

  4. **Predictable Problems & Mitigation:**  
     - *Risk aversion confusion:* Stress, "We’re computing expected value, not utility. Prices differ despite identical outcomes/probabilities!"  
     - *Arithmetic errors:* Use calculators; emphasize partial sums.  
     - *Spoilers:* Channel advanced students into "detective roles."  
     - *Boundedness:* Admit: "We truncated the series, but in theory, rearrangement changes everything. In practice, infinite gambles can’t exist—but math forces us to confront undefined expectations."  

  **What the Activity Can’t Stage:**  
  - Genuine infinitude and unbounded stakes. **Handoff:** "In the real world, we can’t play infinite games. But mathematically, conditional convergence breaks expected value. This isn’t a flaw in *you*—it’s a flaw in the naive sum-over-outcomes approach. Next week, we’ll see how decision theorists respond."  

  **Why This Works:**  
  - Students *do arithmetic* and see order-driven divergence.  
  - Physical setups make "order" tangible.  
  - Debrief links moments to formal insights without jargon upfront.  

  **Total Time:** 5 min buffer for transitions. Adjust discussion depth as needed.
