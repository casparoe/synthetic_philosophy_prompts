answer: |-
  ## Sestina for the Fixed Array

  My chair holds steady. *Now*: the telescope's cold eye recalls the **supernova** bloom,
  Sudden, across the plate. My daughter phones: the **birth** is done, the first faint cry.
  This joint remembers metal's bite, the **knee** replaced, that long, white room.
  A comfort then, this small heat rising – hear the **kettle** start its thin reply.
  Outside my window, patient in the dawn, a **spider** spins its anchored **silk**.
  Beyond all that, the oldest whisper, cold, the **CMB's** enduring **ring**.

  Old Mrs. Shaw walks past. Her pace is slow, yet *now* for her, that faint **ring**
  Of cosmic dawn arrives *before* the light that showed us that bright **supernova**.
  She sees my kettle steam *already* poured, while near her gate, damp **silk**
  Is spun anew. Her daughter's call (announcing that swift, bloody **birth**)
  Reaches her *later* than my kettle's boil. Her own stiff **knee**
  Pains her *sooner* than my waiting cup. This slant defines her **kettle**'s cry.

  Young Pete jogs leftwards, fast. For him, *right now*, the **kettle**'s rising **cry**
  Happens *after* distant galaxies congeal beneath the **CMB**'s first **ring**.
  His own stride jars an ache that *later* blooms – the future twinge inside his **knee**.
  He sees the spider *finish* its wet work, while light from that vast **supernova**
  Still races, *not yet* caught upon his eye. The news of his niece's **birth**
  Arrives *before* the steam has cleared the spout. He glimpses dew on drying **silk**.

  Down the coast road, Laura drives east, fast. For her, the **silk**
  Is spun *already*, glistening and whole. She hears the **kettle**'s finished **cry**
  Before the signal flashes from the ward announcing her grandchild's **birth**.
  She sees the afterglow, the cooled-down **CMB**, its faint, stretched **ring**,
  While photons leap, *still travelling*, from that bright star's explosive **supernova**.
  The surgeon's knife *will cut* her joint tomorrow. Future tense defines her **knee**.

  A satellite streaks overhead, westbound. Its *now* includes the **knee**
  Procedure done, scar healed. It sees the web decay, the broken **silk**.
  It registers the light, *long after* flash, from that spent **supernova**.
  It measures cosmic heat, the **CMB**, a cooler, wider **ring**.
  The grandchild laughs, *already* three years old. The empty **kettle**, cold and dry,
  Sits silent *past* the moment steam first rose. It missed the urgency of **birth**.

  No frame contains the present's fleeting edge. Each claims its own true **birth**,
  Its own sharp pain condensed as *here*, as *this* – the surgeon's probe, the **knee**,
  The rising steam, the spider's patient craft, the fragile **silk**,
  The star's last gasp, the kettle's brief demand, its piercing **cry**,
  The universe's dawn-light, cooled and stretched, that ancient **ring**,
  The burst that lit our plates in 'eighty-seven, that fading **supernova**.

  All frames are true. Deny one privileged **supernova**-flash of *Now*.
  Admit the **birth**, the **knee**, the **kettle**'s **cry**, the **silk**, the **CMB**'s deep **ring** –
  Not relativised presents, but the fixed array: all six held, and held apart. The stillness stuns. No thing becomes. No flow. No wing.

  ---

  **Notes on Physics & Argument:**

  *   **End Words:** Concrete events: **Supernova** (SN 1987A), **Birth**, **Knee** (operation), **Kettle** (boiling), **Spinning Silk** (small/intimate), **CMB Ring** (cosmic microwave background radiation, distant/old).
  *   **Frame Relativity:** Each stanza depicts a different inertial frame (stationary, slow walker, jogger, car driver, satellite) with increasing relative velocity. The simultaneity slices tilt correctly:
      *   For an observer moving *right* (Mrs. Shaw, Pete), events *ahead* (to their right) occur *later* in the rest frame but are simultaneous *now* for them. Events *behind* (left) occur *earlier* in the rest frame but are simultaneous *now* for them.
      *   For an observer moving *left* (Laura, satellite), the tilt reverses: events *ahead* (left) are future in rest frame, simultaneous for them; events *behind* (right) are past in rest frame, simultaneous for them.
  *   **Causality:** Light signals (e.g., news of birth, light from supernova/CMB) propagate at `c`. Events causally connected remain ordered (e.g., birth *before* grandchild aged three).
  *   **Answering the Grandson:** The poem enacts the argument: if *every* frame's "now" is equally real (as the rotating stanzas show, each claiming different events as simultaneous and thus "present"), and these "nows" collectively cover *all* events (as the envoi crams them together), then *all* events must be equally real *simpliciter*. Denying a privileged frame *forces* the acceptance of the entire block. "Presentism with extra algebra" requires a *true* present (even if hard to define); the poem shows *no* frame's "now" is metaphysically privileged, undermining the core "present" of presentism.
  *   **Honest Loss:** The envoi explicitly states the cost: "No thing becomes. No flow. No wing." Passage is relinquished. The final image is of permanent, static relation ("held, and held apart") and "stillness".
