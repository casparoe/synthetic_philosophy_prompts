prompt: |-
  I run grantmaking for a foundation that gives away roughly $40 million a year across global health and economic opportunity: about sixty grants annually, six program staff, no in-house economist, and a board that must approve anything above $250,000. The board has asked us to rank proposals by cost-effectiveness in the style associated with effective altruism. I want to do that while taking the movement's critics seriously: that quantification quietly privileges whatever is easy to count, and that treating a problem as a series of individually purchasable fixes displaces the structural work that would end it.

  What I need is a procedure, not a position paper: the gates a proposal passes through in order, what counts as a sufficient answer at each gate, where the procedure returns a no, and where it stops and hands the decision to the board because the question is one of values rather than evidence. Constraints: runnable in about two hours per proposal by a program officer with no economics training, with a part-time consultant available for the numbers, and only what survives the gates reaches the board. Be explicit about which steps are judgment calls dressed as procedure, and about which distinctions from the critique you had to drop to make the thing usable.

  One device I want built in rather than argued about: each proposal is scored on two ledgers, one for effects we can count and price with a stated uncertainty range, one for effects we believe in but cannot measure, such as shifted local power, deterrence, or dignity; and the board sets, once a year and before seeing any proposals, the rate at which it is willing to trade one ledger against the other, so that unmeasured effects are neither scored at zero nor quietly rescued case by case.

  Apply the procedure to three live proposals: a $2M renewal of an unconditional cash-transfer program with randomized evidence and a cost-per-outcome estimate that survives a fragility check but does nothing about why recipients are poor; a $600k grant to a land-rights legal-empowerment group whose theory of change runs through changing how district officials behave and which has no credible comparison group; and a $900k fellowship that pays graduates to take high-earning finance jobs and donate a share of their salaries, which two board members already champion. If the procedure says no to something we currently fund and are attached to, say so plainly, and say what would have to change for it to pass. Finally, say what the procedure cannot do: which decisions it will systematically get wrong, and where an officer should overrule it.
reasoning: |-
  We are designing a grant evaluation procedure that incorporates cost-effectiveness analysis (CEA) in the style of effective altruism (EA) while addressing key critiques: that quantification may privilege what's easily countable and that focusing on individual fixes might displace structural work. The procedure must be runnable in about 2 hours per proposal by a program officer (PO) without economics training, with a part-time consultant for numbers. Only proposals that pass all gates reach the board. We have two ledgers: one for quantifiable effects and one for unquantifiable effects. The board sets an exchange rate between the ledgers annually.

  The procedure has several gates. At each gate, a proposal can be rejected, sent back for revision, or passed to the next gate. The gates are:

  1. **Problem Definition and Theory of Change (ToC) Gate**
     - Check: Does the proposal clearly define the problem it addresses and have a coherent theory of change? The ToC must outline the causal pathway from activities to outcomes, including any structural changes.
     - Sufficient answer: A written ToC that is logically consistent and identifies key assumptions. If the ToC is missing or fundamentally flawed (e.g., no plausible causal link), reject.
     - Time: 15 minutes.
     - Judgment: The PO judges logical consistency and plausibility of the ToC. Critics might argue that structural change is hard to capture in a ToC, but we require at least an attempt to articulate it.

  2. **Quantifiable Effects Ledger Gate**
     - Check: For the quantifiable effects, we require a cost-effectiveness estimate with an uncertainty range. The PO, with the consultant, will:
       a. Identify the primary quantifiable outcome (e.g., lives saved, income increase).
       b. Estimate the cost per unit of outcome (e.g., cost per life saved, cost per $1 of income increase) using the best available evidence.
       c. Conduct a fragility check: How much would the estimate change if key assumptions were varied? (e.g., using different comparison groups, adjusting for attrition).
     - Sufficient answer: A clear calculation of cost per outcome with a range (e.g., via sensitivity analysis). If the estimate is too fragile (e.g., small changes in assumptions lead to negative or extremely high cost per outcome) or if there is no credible way to quantify any outcome, then the proposal fails this gate. However, note that if the proposal has no quantifiable outcomes, it can still pass if it has strong unquantifiable effects (but then it must rely entirely on the second ledger).
     - Time: 60 minutes (with consultant support for the calculations).
     - Judgment: The PO and consultant decide on the key outcome and the evidence quality. The fragility check involves judgment on which assumptions to vary and by how much.

  3. **Unquantifiable Effects Ledger Gate**
     - Check: For effects that cannot be quantified (e.g., shifts in power, dignity, deterrence), the proposal must clearly articulate what these effects are and how the intervention will bring them about. The PO must assess the credibility of these claims.
     - Sufficient answer: A narrative description of the unquantifiable effects and the causal link. If the proposal claims unquantifiable effects without a plausible story or if the effects are not relevant to the problem, reject. Otherwise, assign a qualitative rating (e.g., low, medium, high) for the magnitude and credibility of the unquantifiable effects.
     - Time: 15 minutes.
     - Judgment: The PO judges the credibility and importance of the unquantifiable effects. This step explicitly avoids quantification to prevent forcing unquantifiable effects into numbers.

  4. **Combined Score and Exchange Rate Gate**
     - Check: Combine the two ledgers using the board's pre-set exchange rate. The board will have set a rate (e.g., 1 unit of unquantifiable effect is worth X units of quantifiable effect). The PO, with the consultant, will:
       a. Convert the unquantifiable rating into a quantitative score using a predefined conversion (e.g., low=1, medium=2, high=3) and then scale by the board's exchange rate.
       b. Combine this with the quantifiable cost-effectiveness score to get an overall score.
       - Example: Suppose the quantifiable cost per outcome is $Y, and the unquantifiable score is Z (after conversion and scaling). The overall cost-effectiveness might be adjusted by subtracting (or adding) a value based on Z. Alternatively, we can think in terms of total benefits: Quantifiable benefits (e.g., number of outcomes) divided by cost, plus the unquantifiable benefits (converted to the same unit) divided by cost.
       - However, note: The board sets the exchange rate in terms of how much quantifiable benefit they are willing to forgo for a unit of unquantifiable benefit. So we can compute:
           Adjusted Cost-Effectiveness = (Quantifiable Benefits + (Exchange Rate * Unquantifiable Benefits)) / Cost
         But note that unquantifiable benefits are in a different unit. So we need a common unit. Let the board set: 1 unit of unquantifiable benefit (UB) = X units of quantifiable benefit (QB). Then:
           Total Benefit (in QB units) = Quantifiable Benefit (QB) + X * Unquantifiable Benefit (UB)
           Then the cost-effectiveness is Total Benefit / Cost.
       - But we don't have a measure of unquantifiable benefit in units. Instead, we have a rating (low, medium, high). So we must map the rating to a numerical value. The board must also set what a low, medium, high rating is worth in terms of QB units (or in terms of a multiple of the quantifiable benefit of a reference intervention). Alternatively, we can have the board set the exchange rate in terms of cost: e.g., they are willing to pay $R for a "high" unquantifiable effect. Then we can add that to the benefits side as if it were a monetary gain (but without actually monetizing the unquantifiable effect, we are just using a dollar value as a common unit). This is tricky.

     Let's reframe: We want to compare proposals by their cost-effectiveness. We have:
       - Quantifiable: cost per unit of quantifiable outcome (e.g., $100 per life-year saved).
       - Unquantifiable: a rating (low, medium, high) and a narrative.

     The board sets: for a typical grant, what is the maximum additional cost they are willing to incur for unquantifiable effects? For example, they might say: "For a grant that has a high unquantifiable effect, we are willing to accept a cost per quantifiable outcome that is up to 50% higher than the best alternative without unquantifiable effects." Then, for a proposal, we can compute:

       Effective Cost = Cost / (1 + (adjustment factor))

     where the adjustment factor depends on the unquantifiable effect rating and the board's policy. For example:

       Adjustment factor: low = 0.1, medium = 0.3, high = 0.5.

     Then, the effective cost per quantifiable outcome becomes:

       Effective Cost per Outcome = (Cost per Outcome) / (1 + adjustment)

     This means we are effectively discounting the cost for unquantifiable benefits. Alternatively, we can think of it as increasing the benefits. But this method allows us to adjust the cost per quantifiable outcome to account for unquantifiable benefits.

     Alternatively, we can have the board set a dollar value for each rating. For example, they might say: a "high" unquantifiable effect is worth an extra $500,000 in benefits. Then we add that to the quantifiable benefits (converted to dollars) and then compute cost-effectiveness.

     However, note that the quantifiable outcome might not be in dollars. So we need a common unit. We can use a standard conversion (e.g., value of a life-year) for the quantifiable outcome, but that might be controversial and the board might not want to do that.

     Given time constraints, we propose:

     - The board sets a table for the unquantifiable adjustment:
          Rating | Adjustment Factor (multiplier for quantifiable benefits)
          Low    | 1.1   (i.e., 10% more benefits)
          Medium | 1.3
          High   | 1.5

     Then, the adjusted quantifiable benefit becomes: Original Quantifiable Benefit * Adjustment Factor.

     Then the cost per adjusted unit of outcome = Cost / (Original Outcome * Adjustment Factor) = (Original Cost per Outcome) / Adjustment Factor.

     This effectively reduces the cost per outcome for proposals with unquantifiable benefits.

     Alternatively, if we have the quantifiable benefit in natural units (e.g., lives saved) and we want to keep it in natural units, we can compute:

          Adjusted Cost per Outcome = Cost / (Quantifiable Outcome * Adjustment Factor)

     This makes the cost per outcome lower for higher unquantifiable benefits.

     Then we can rank by Adjusted Cost per Outcome (lower is better).

     But note: this adjustment factor is arbitrary and set by the board. It is a way to incorporate the unquantifiable without having to put a dollar value on it.

     - Sufficient answer: A calculation of the adjusted cost per outcome. If the adjusted cost per outcome is above a threshold (set by the board annually, e.g., $X per life saved), then the proposal fails. Otherwise, it passes to the next gate. But note: we don't have a fixed threshold because the board might want to compare across proposals. So we don't set an absolute threshold at this gate. Instead, we use this adjusted cost per outcome for ranking.

     However, we are not rejecting at this gate based on an absolute threshold because the board will see a ranked list. We only reject if the adjusted cost per outcome is extremely high (e.g., above a pre-set ceiling). The board might set a ceiling (e.g., $100,000 per life-year saved) above which they are not willing to fund.

     - Time: 15 minutes (with consultant if needed).
     - Judgment: The conversion of the rating to an adjustment factor is based on the board's preset table. However, the PO must ensure that the unquantifiable effects are relevant to the proposal's goals.

  5. **Value Judgment Gate**
     - Check: Some proposals may involve value judgments that are beyond the scope of evidence. For example, the board might have preferences about certain types of interventions (e.g., avoiding paternalism) or populations. The PO must flag any such value-laden issues that the board must decide.
     - Sufficient answer: The PO writes a brief note identifying any value conflicts (e.g., "This proposal involves working with a controversial government agency" or "This approach may undermine local ownership"). The proposal is not rejected at this gate, but the note is attached for the board.
     - Time: 15 minutes.
     - Judgment: The PO must identify which issues are about values and not evidence.

  6. **Final Ranking**
     - The PO, with the consultant, compiles a list of proposals that passed all gates, ranked by the adjusted cost per outcome (lowest adjusted cost per outcome first). The ranking and the full analysis (including the two ledgers) are presented to the board.

  **Constraints and Dropped Distinctions:**
  - We dropped the critique that structural work is displaced by focusing on individual fixes. Our procedure requires a theory of change that includes structural pathways, but we still rank by cost-effectiveness. We hope the unquantifiable ledger captures some structural effects, but we acknowledge that the quantification step might still favor individual-level interventions.
  - We are using a simplified adjustment factor for unquantifiable effects, which might not capture their full complexity. But we avoid setting a dollar value for things like dignity.
  - The fragility check is a proxy for robustness, but it might not capture deeper methodological flaws.

  **Applying the Procedure to the Three Proposals:**

  1. **$2M renewal of unconditional cash-transfer program**
     - Gate 1: Clear problem (poverty) and ToC (cash transfers increase income and consumption). Pass.
     - Gate 2: Quantifiable effects: Cost per outcome (e.g., $ per $ of additional consumption) is available from RCT, survives fragility check. Suppose cost per $1 of additional consumption is $1.20 (with range $1.10-$1.30). Pass.
     - Gate 3: Unquantifiable effects: The proposal does nothing about why recipients are poor (structural issues). So unquantifiable effects might be low. We rate it "low" for unquantifiable effects (since it doesn't address systemic causes, but it does preserve dignity by being unconditional). However, the PO might argue that cash transfers do have unquantifiable benefits (dignity, reduced stress) and rate it medium. Let's say we rate it low because the structural critique is strong. 
     - Gate 4: Suppose the board set: low=1.1, medium=1.3, high=1.5. Adjusted cost per $1 of consumption = $1.20 / 1.1 = $1.09.
     - Gate 5: Value judgment: None flagged.
     - Result: Adjusted cost per outcome is low, so it would rank high.

  2. **$600k grant to a land-rights legal-empowerment group**
     - Gate 1: Problem: insecure land rights leading to poverty. ToC: legal empowerment -> changes in district officials' behavior -> secure land rights -> increased investment and well-being. Pass.
     - Gate 2: Quantifiable effects: No credible comparison group, so we cannot produce a cost per outcome with confidence. The fragility check would show that the estimate is highly sensitive to assumptions. But note: we might still have some quantifiable outcomes (e.g., number of land titles secured) but without a comparison group, we don't know the counterfactual. We might have to rely on intermediate outcomes. However, the PO and consultant might try to estimate cost per title secured, but without a counterfactual, the net effect is unknown. This might fail Gate 2. But we can note that the proposal might have no quantifiable outcomes in the sense of net impact. In that case, it fails the quantifiable ledger? But we allow proposals to pass if they have strong unquantifiable effects. So we can skip the quantifiable part and rate the unquantifiable effects highly. However, the procedure requires that we attempt the quantifiable ledger. If we cannot produce an estimate, then we put $0 for quantifiable benefits? Then the entire weight is on the unquantifiable ledger.
       - Alternative: We can use a very rough estimate (e.g., based on qualitative data) with a wide uncertainty range. But if the fragility check shows it's too fragile, it fails Gate 2. 
       - Let's say we cannot produce a credible cost per outcome. Then we mark the quantifiable cost per outcome as "infinite" (or extremely high) and move to Gate 3.
     - Gate 3: Unquantifiable effects: The proposal aims to shift power and change systemic behavior. We rate the unquantifiable effects as "high" (if we believe in the theory of change). Pass.
     - Gate 4: Adjusted cost per outcome: Without quantifiable benefits, we cannot compute an adjusted cost per outcome. We need a rule for this: 
          Option 1: If the quantifiable benefits are zero (or not measurable), then the entire proposal must be justified by the unquantifiable ledger. The board's exchange rate must be used to compare to other proposals. We can compute the cost per unit of unquantifiable effect. But we don't have a natural unit. Alternatively, we can use the adjustment factor in reverse: we can say that the adjusted cost per outcome is the cost divided by the adjustment factor (as if the adjustment factor were a benefit multiplier). But without quantifiable benefits, we don't have a base. 
          Option 2: The board sets a maximum cost for a "high" unquantifiable effect. For example, they might say: we are willing to spend up to $1 million for a proposal with "high" unquantifiable effects and no quantifiable benefits. Then if the cost is below that threshold, it passes.
       - We need to build this into Gate 4: If there are no quantifiable benefits, then we check if the cost is below the board's preset maximum for the unquantifiable rating. The board would set for each rating a maximum cost they are willing to fund (e.g., high: $1M, medium: $500k, low: $250k). Then if the grant request is below that maximum, it passes. Otherwise, it fails.
       - So for this proposal: $600k request and "high" rating. If the board set a maximum of $1M for high, then it passes.
     - Gate 5: Value judgment: This work is structural and might involve challenging power structures. Flag for the board.
     - Result: It would pass if the board's maximum for high unquantifiable effects is at least $600k.

  3. **$900k fellowship for finance jobs and donations**
     - Gate 1: Problem: Lack of funding for effective charities. ToC: Fellows earn high salaries and donate a portion, leading to more funding for effective causes. Pass.
     - Gate 2: Quantifiable effects: We can estimate the cost per dollar donated (or cost per dollar directed to effective causes). The cost is $900k. The expected donations: Suppose each fellow donates 10% of a $200k salary for 5 years, so $100k per fellow. If there are 10 fellows, total donations = $1M. Then cost per dollar donated = $0.90 (i.e., $0.90 to get $1). But note: we must account for the counterfactual: would these fellows have donated anyway? And would they have earned as much without the fellowship? The two board members championing the proposal might argue that the fellowship causes additional donations. But without evidence, we must make assumptions. Suppose we assume 50% of the donations are additional. Then cost per dollar donated = $900k / ($500k) = $1.80. Fragility check: if we change the additionality to 30%, then cost per dollar becomes $900k/$300k = $3.00. This is fragile. 
       - However, we might also consider the counterfactual of the fellows: without the fellowship, they might have taken other high-paying jobs and donated less. But that's speculative. Given the fragility, we might fail this at Gate 2? But let's say we get a range of $1.80 to $3.00. We can take the midpoint or the worst-case. If the worst-case is too high (e.g., above $2.00 per dollar is considered high by the foundation), then it might fail. But we don't have an absolute threshold at Gate 2. We just note the estimate and range. Pass to next gate.
     - Gate 3: Unquantifiable effects: The proposal might have negative effects (e.g., brain drain from other sectors, promoting finance careers which some see as harmful). Or it might have positive effects (building a culture of giving). We rate it as "low" to "medium". Let's say we rate it "low" because the unquantifiable effects are uncertain and potentially negative. 
     - Gate 4: Adjusted cost per dollar donated: Using the worst-case $3.00 and adjustment factor for low (1.1): Adjusted cost = $3.00 / 1.1 = $2.73 per dollar. This is high compared to other giving opportunities (e.g., cash transfers at $1.09 per dollar of consumption). 
     - Gate 5: Value judgment: Some board members might believe in the long-term movement building, while others might object to funding finance careers. Flag for the board.
     - Result: It would rank low due to high adjusted cost per outcome.

  **What the Procedure Cannot Do:**
  - It cannot capture long-term, systemic changes that might take decades to materialize and are hard to attribute.
  - It might undervalue interventions that build capacity or shift power because these are often in the unquantifiable ledger and the adjustment factor might be too low.
  - It might be gamed by overstating quantifiable benefits or understating uncertainty.
  - It might favor interventions with easily measurable outcomes over those with more diffuse but important outcomes.

  **Overruling the Procedure:**
  A program officer should overrule the procedure when:
  - There is clear evidence of a flaw in the analysis (e.g., a miscalculation, or new evidence).
  - The proposal addresses an urgent crisis where speed is more critical than thorough analysis.
  - The proposal is a pilot for a new approach that, if successful, could be highly scalable, but the evidence base is currently weak.

  For the fellowship proposal, the procedure says it's not cost-effective. To pass, it would need:
  - Stronger evidence of additionality (so the cost per dollar donated is lower, e.g., below $1.50).
  - A higher rating on the unquantifiable ledger (if the board believes the movement-building effects are high, they might rate it as high, leading to a better adjusted cost).

  **Final Note:**
  The board must set the parameters annually: the adjustment factors for unquantifiable effects, the maximum costs for proposals with only unquantifiable effects, and the ceiling for cost per outcome in the quantifiable ledger. The procedure will then rank proposals accordingly.
answer: |-
  ### Grant Evaluation Procedure: Balancing Quantification and Structural Critique  
  **Core Design:** Two ledgers (quantifiable and unquantifiable effects), board-set exchange rate, gates for efficiency (2 hours/proposal), with explicit judgment flags. Board only sees proposals passing all gates.  

  ---

  #### **Procedure: 6 Gates, 120 Minutes/Proposal**  
  **Key Roles:**  
  - **Program Officer (PO):** Leads evaluation (judgment calls, narrative analysis).  
  - **Consultant (Part-time):** Validates numbers, uncertainty ranges, fragility checks (quantifiable ledger only).  

  **Annual Board Pre-Commitments:**  
  1. **Exchange Rate (ER):** "How much quantifiable benefit (QB) is 1 unit of unquantifiable benefit (UB) worth?" (e.g., "1 UB = 100 QB units").  
  2. **Unquantifiable Max Budget (UMB):** Max $ allocated to proposals with *only* unquantifiable benefits (e.g., $1M/year for "High UB" proposals).  
  3. **Cost-Effectiveness (CE) Threshold:** Max acceptable cost per QB unit (e.g., $50/QB unit).  

  ---

  #### **Gate Sequence**  
  **Gate 1: Problem & Theory of Change (ToC) [15 min | PO]**  
  - **Check:** Does the ToC articulate both direct *and* structural pathways? (e.g., "Cash transfers increase income" + "...but may entrench dependency if systems unchanged").  
  - **Sufficient Answer:** ToC map showing causal links, assumptions, and acknowledgment of structural limits.  
  - **Reject If:** ToC ignores structural factors *and* claims to "solve" a systemic problem.  
  - **Judgment Call:** PO subjectively assesses "structural awareness." Critics’ concern about "purchasable fixes" is partially addressed by requiring this acknowledgment.  

  **Gate 2: Quantifiable Ledger [45 min | PO + Consultant]**  
  - **Check:** Estimate cost/QB unit (e.g., cost per life saved, $/income boost) with uncertainty range.  
  - **Steps:**  
    1. Identify primary outcome metric (e.g., income increase, diseases prevented).  
    2. Calculate cost/QB using evidence (RCT, quasi-experimental).  
    3. **Fragility Check:** Vary key assumptions (e.g., 10% attrition, alternative comparison group). Range must stay within 2x of baseline.  
  - **Sufficient Answer:** Cost/QB with 90% uncertainty range. Consultant signs off.  
  - **Reject If:**  
    - No credible evidence (e.g., no comparison group, data non-replicable).  
    - Fragility range exceeds 2x baseline (e.g., baseline $100/QB, fragility $50–$500).  
  - **Pass-Through:** If no quantifiable effects, skip to Gate 3.  

  **Gate 3: Unquantifiable Ledger (UB) [15 min | PO]**  
  - **Check:** Articulate UB (e.g., "shifts power dynamics," "builds community dignity") and link to ToC.  
  - **Sufficient Answer:** Narrative justifying UB magnitude ("Low/Medium/High") and relevance to the problem.  
  - **Reject If:** UB claims are vague or unrelated to stated goals (e.g., "deterrence" with no causal logic).  
  - **Judgment Call:** PO rates UB magnitude (L/M/H). Critics’ "easy to count" bias is countered here by valuing non-quantifiable outcomes.  

  **Gate 4: Ledger Integration [20 min | PO + Consultant]**  
  - **Check:** Combine ledgers using board’s ER and UMB.  
  - **Steps:**  
    1. **If QB exists:**  
       - Convert UB rating to QB units: e.g., Low UB = +50 QB, Medium = +100 QB, High = +200 QB (scaled by ER).  
       - Adjusted QB = Original QB + (UB in QB units).  
       - Adjusted Cost/QB = Cost / Adjusted QB.  
    2. **If no QB:**  
       - Check if cost ≤ UMB for UB rating (e.g., High UB proposal costs ≤ $1M).  
  - **Reject If:**  
    - Adjusted Cost/QB > CE threshold, OR  
    - No QB and cost > UMB for UB rating.  

  **Gate 5: Values & Overrides [10 min | PO]**  
  - **Check:** Flag value conflicts (e.g., "Fellowship may incentivize harmful industries").  
  - **Sufficient Answer:** "Board decision needed" note if:  
    - Moral disagreement (e.g., "Is it ethical to fund finance careers?").  
    - Strategic pivot (e.g., "This exits a high-impact region").  
  - **No Rejection:** Only flags for board review.  

  **Gate 6: Board Submission [15 min | PO]**  
  - **Output:** Ranked list by Adjusted Cost/QB (lowest first) or UB rating (if no QB). Includes:  
    - Quantified CE + fragility range.  
    - UB narrative + rating.  
    - Values flags.  

  ---

  #### **Application to Live Proposals**  
  **Proposal 1: $2M Unconditional Cash Transfers**  
  - **Gate 1:** Pass. ToC: "Cash boosts income; structural causes unaddressed but mitigated by choice."  
  - **Gate 2:** Pass. Cost/QB = $1.20 per $1 income increase (range: $1.10–$1.40 after fragility check).  
  - **Gate 3:** UB = "Medium" (dignity from choice).  
  - **Gate 4:** Adjusted QB = Original QB + 100 QB (Medium UB). Cost/QB drops to $1.10.  
  - **Gate 5:** No flags.  
  - **Result:** **Funded.** Ranks well due to strong CE + moderate UB.  

  **Proposal 2: $600K Land-Rights Legal Empowerment**  
  - **Gate 1:** Pass. ToC: "Training → officials change behavior → land rights → systemic empowerment."  
  - **Gate 2:** **Reject.** No comparison group → unable to quantify net impact. Fragility check fails.  
  - **Gate 3:** UB = "High" (shifts power, deters exploitation).  
  - **Gate 4:** No QB → check UMB: $600K ≤ $1M (High UB max). **Conditional pass.**  
  - **Gate 5:** Flag: "Reliance on UB; structural change unproven but plausible."  
  - **Result:** **Reaches board** but with low rank (no QB). Currently funded? **Procedure says no unless UMB increased.** To pass: Add quasi-experimental metrics (e.g., tracking officials’ behavior change pre/post).  

  **Proposal 3: $900K Finance Fellowship**  
  - **Gate 1:** Pass. ToC: "Fellows earn → donate → funds for high-impact charities."  
  - **Gate 2:** Pass with fragility. Cost/$ donated = $0.90 (if 100% additionality), but range $0.50–$2.00 (if 25–75% additionality).  
  - **Gate 3:** UB = "Low" (potential brain drain from public sector).  
  - **Gate 4:** Adjusted Cost/QB = $0.85 (after Low UB boost). But fragility upper bound ($2.00) > CE threshold (e.g., $1.50). **Reject.**  
  - **Result:** **Rejected.** Currently funded? **Procedure says no.** To pass: Provide evidence on additionality (e.g., survey showing 80% wouldn’t donate without fellowship) to tighten fragility range.  

  ---

  #### **What the Procedure Cannot Do**  
  1. **Systematically Undervalues Structural Work:** Favors short-term QB (e.g., cash transfers) over long-term UB (e.g., policy change). *Mitigation:* UB ratings and UMB, but still QB-dominated.  
  2. **Misses Contextual Nuance:** Formulaic ER may ignore local realities (e.g., "dignity" in one culture ≠ another). *Override when:* PO has deep contextual knowledge contradicting UB rating.  
  3. **Fragile in Low-Evidence Settings:** Rejects high-UB proposals without QB (e.g., advocacy). *Override when:* Crisis response or unique leverage (e.g., closing a window for policy reform).  
  4. **Biased Toward Measurable Outcomes:** "Cost per outcome" incentivizes narrow metrics. *Critique dropped* to ensure usability.  

  **When to Overrule:**  
  - **False Negatives:** Proposals with transformative UB but weak QB (e.g., civil rights litigation). PO can escalate to board with justification.  
  - **False Positives:** High-QB proposals with hidden harms (e.g., undermining local markets). Gate 5 flags prevent this.  

  **Final Output:** Board receives ranked proposals with explicit CE/UB tradeoffs, values flags, and clear thresholds. Procedure balances EA efficiency with critics’ insights, but prioritizes feasibility over perfect equity.
