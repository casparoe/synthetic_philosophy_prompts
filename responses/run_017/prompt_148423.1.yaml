prompt: |-
  I've been teaching a grad seminar on the self this term and I keep running into a thing in discussion that I don't have a word for. I work mostly in epistemology, so I'm well outside that literature and probably reinventing something someone named twenty years ago. Would love to know whether it has a name.

  Here's the phenomenon. A person can come to disbelieve their own self-narrative and it still keeps pulling. Not a vague residue, an actual continuing grip on what they do and on what they'll say about themselves in the moment. Case one: a friend of mine spent thirty years with a story about himself, he's the kind of person who finishes what he starts. A few years back he decided, deliberately and with evidence, that it's false. He can rattle off six projects he walked away from, he'll tell you unprompted that it was a family myth, and he still can't leave a manuscript alone. He describes the pull in the first person while simultaneously disavowing it, and he isn't being ironic. Case two: a student who was assigned "you're the responsible one" by her siblings, sees perfectly well that it was imposed on her, resents it, and is nevertheless the person who books the flights every single time. What's odd is how it goes away: it fades by being acted against, slowly and unevenly, and it comes back under time pressure. Arguing against it does nothing, or nothing she can feel.

  The contrast case is what makes me think this is one thing and not just recalcitrant belief. Correct a merely factual bit of someone's autobiography, no you were born in April, and the old version loses its grip instantly and completely the moment they're convinced. So whatever this is, it attaches specifically to the parts of a life-story that have a shape: the "kind of person I am", the "where this is going", the evaluative and teleological bits rather than the dated ones.

  In my notes I've been calling it narrative drag, or residual gravity. It isn't quite habit, and it isn't like the alief business or like belief perseverance, those seem to be about single propositions or associations whereas this is shaped like a whole life. And it isn't straightforwardly what Dennett is after with the self as a centre of narrative gravity either, because on his picture the abstraction is supposed to be doing explanatory work, and here you have a story the person has explicitly withdrawn and it is still doing the work. Though maybe that just means the picture absorbs it and I'm not seeing how.

  So: does this have a name of its own, or is there a cluster of established concepts that carve it up between them? I want the carving, not the label — what exactly it is, what it is not, where its edges are, and whether the disavowed story is still that person's centre of gravity or whether something else has taken over while mimicking it. Also tell me if it tells against the gravity metaphor rather than sitting inside it.

  Be honest about your confidence. If there's no established term, say so plainly instead of finding me one. If you think I'm bundling three separate things under one description, split them and say which is which. If my contrast case is doing less work than I think, or the whole framing leans on a picture of self-narratives that nobody should accept, I'd rather be told that than get a polite answer. And if you reach for names and dates, don't bother — I can't look anything up from here and I won't trust a half-remembered citation anyway, so give me the views rather than who holds them.

  Write it as continuous prose, the way you'd write to a colleague: no headings, no bullet points, no bold, no tables. I know a table of nearest concepts and how each differs would be the obvious move here and I specifically don't want one, because I want to hand what you give me to my students as a letter.
reasoning: |-
  Okay, let me think through this query carefully. The user is describing a phenomenon where disbelieved self-narratives continue to exert behavioral influence, and wants to know if this has an established conceptual framework. 

  The core observation seems to be that evaluative life-stories (unlike factual memories) retain gravitational pull even after explicit rejection. This feels distinct from habit or cognitive biases like belief perseverance because of its narrative structure - it's not isolated propositions but entire life-shaping scripts that persist.

  I recall several philosophical concepts that might map to this, but none perfectly. Wittgenstein's hinge propositions come to mind as deep frameworks that resist change, but they're not narrative. Ricoeur's narrative identity captures the shaping power of stories, but doesn't address disavowal. Bourdieu's habitus is close with its embodied dispositions, but too broad. 

  The metaphor of "narrative drag" is actually quite apt - it captures both the persistence and the slow dissipation through counter-action. The key insight is that these stories operate at the level of practical orientation rather than propositional belief. When the student books flights automatically despite resenting the "responsible one" label, it's not that she believes the story cognitively, but that it still structures her relational world.

  What's particularly interesting is how this challenges standard accounts of narrative self-constitution. In Dennett's center of narrative gravity model, the story we tell is constitutive of selfhood. But here we have explicit rejection of the story coupled with behavioral persistence - suggesting the narrative operates below the level of endorsement, as a kind of behavioral grammar.

  For teaching purposes, I should emphasize three boundaries: 
  First, this differs from mere habit in being meaning-laden (the "responsible one" script carries relational expectations). 
  Second, it's not self-deception since the disavowal is conscious. 
  Third, the contrast with factual memories shows narrative's unique grip - April birthdays don't organize one's world.

  The fade pattern is crucial: it diminishes through repeated counter-performance, not argument. This suggests performative approaches might offer better dissolution strategies than cognitive ones. Under stress though, the old groove reemerges - like muscle memory for identity.

  I won't invent terminology since the user wants existing frameworks, but I'll note how their "drag" metaphor productively extends Dennett by showing narratives can exert gravity without being consciously endorsed. The center hasn't shifted; the rejected story still bends behavior, just without consent.
answer: |-
  What you're describing feels immediately recognizable—that stubborn persistence of a self-concept that's been intellectually dismantled but retains its behavioral purchase. It's a fascinating friction point where epistemic rejection fails to translate into practical release. While I don't think there's a single, universally accepted term for this precise phenomenon, there are well-worn concepts that cluster around it, and your framing helps isolate its distinct contours. Let me walk through the near misses and why they don't quite capture what you're seeing, then suggest where the edges might lie.

  First, it's clearly not mere *habit* in the behavioral sense. Habits are procedural routines divorced from narrative meaning—tying shoes a certain way, not being "the responsible one." Your cases involve identity-laden scripts: the actions carry evaluative weight ("finishing," "responsibility") tied to a story about who one *is*. The pull isn't just automaticity; it's a felt imperative rooted in a (disavowed) role. Similarly, it's distinct from *alief* (Gendler's term), which typically describes automatic, belief-discordant reactions to specific stimuli (e.g., flinching on a glass walkway despite knowing it's safe). This is broader: a sustained, global orientation to one's life, not a situational twitch. *Belief perseverance* (where discredited beliefs linger) is closer but operates at the propositional level ("I'm competent at X") without the narrative architecture or behavioral entrenchment you note. Your contrast case highlights this: factual errors vanish when corrected; identity narratives don't.

  The narrative theorists offer richer ground. Ricoeur’s *narrative identity*—the idea that selves are constituted through emplotted stories—gets the structure right. But it doesn't fully account for the *disavowal* while the narrative *still functions*. Dennett's "center of narrative gravity" is useful, but as you suspect, it struggles here. If the disavowed story still exerts gravitational pull, is it still the "center"? Or is it a phantom center—a vacated locus still bending the trajectory? Your metaphor of "residual gravity" actually sharpens this: the mass (the internalized narrative) has been removed, but the curvature of spacetime (the behavioral field) persists until acted against. The slow fade through counter-performance suggests inertia in the practical, embodied dimension of selfhood, not just the cognitive.

  This points toward concepts in practice theory (Bourdieu’s *habitus*) and phenomenological accounts of embodiment. The *habitus*—internalized dispositions shaping perception and action—often operates below explicit awareness and resists intellectual revision. Your student booking flights "automatically" despite resentment mirrors this: the "responsible one" role is sedimented in her bodily habits and relational expectations. Merleau-Ponty’s *body schema* might also be relevant: the disavowed narrative remains woven into the pre-reflective "I can" of daily action. Arguing against it fails because it's not lodged in belief alone; it's in the muscle memory of identity. The resurgence under stress makes sense: when deliberative resources are depleted, we fall back on embodied scripts.

  So, where does this leave us? You're likely bundling two intertwined elements:  
  1.  **The Narrative Scaffold:** The evaluative/teleological structure ("kind of person," "life trajectory") that organizes experience. Once internalized, it shapes perception and valuation even when rejected.  
  2.  **The Embodied Inertia:** The habituation of behavior and affective responses tied to that scaffold. This is why acting against it slowly erodes the pull—you're wearing new grooves into the *habitus*.  

  Its edges are defined by:  
  - **Source:** Socially assigned or deeply internalized identity roles (not innate traits or transient beliefs).  
  - **Persistence Mechanism:** Embodied habituation + narrative framing (not cognitive error or fear).  
  - **Dissolution Path:** Requires repeated counter-performance, not just cognitive correction (as your contrast case proves).  
  - **Trigger for Resurgence:** Situations demanding rapid, low-cognition action (stress, fatigue, familiarity).  

  Is the disavowed story still the "center of gravity"? Not consciously—the person has shifted their cognitive center. But practically, in moments of unreflective action, the old gravity well still exerts force. It’s a *haunting* of the narrative self: the story is dead intellectually, but its ghost animates the body. Your "drag" metaphor captures this beautifully—it’s the resistance felt when trying to accelerate into a new narrative against the friction of the old one.

  Does it tell against Dennett? Only if we conflate the center of gravity with the consciously endorsed story. If we see narrative gravity as operating at multiple levels (deliberative and pre-reflective), it can absorb your phenomenon. The disavowed story is a decommissioned *explicit* center whose *implicit*, embodied inertia lingers. The new center (say, "I am not defined by finishing") is cognitively active but not yet fully embodied. The drag is the tension between them.

  In sum, no single term owns this, but it sits at the intersection of narrative identity theory, practice theory, and phenomenology. It’s the embodied afterlife of a socially installed self-narrative. "Narrative drag" or "residual gravity" are apt because they emphasize its dynamic, force-like quality resisting change. It’s not a flaw in the narrative-self model but a testament to how deeply such narratives can root themselves below the bedrock of belief. Your cases illustrate something vital: we don’t just *tell* ourselves into being; we are *enacted*—sometimes by stories we no longer tell.
