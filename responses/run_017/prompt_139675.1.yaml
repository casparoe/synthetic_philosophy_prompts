  First, I need to extract the core requirements: exactly five numbered items, no intros/conclusions, ~400 words, philosophical argumentation. The user explicitly rejects citations or debate-mapping, focusing instead on reconstructing positions via their labels (historical/error/tracking-deficient tests).  

  The research question must be sharpened to demand a determinate answer. Their draft implies two layers: (1) which tests entail others, and (2) which neutrality-compatible tests can perform specific normative "jobs" (well-being measurement, consent validity, etc.). Framing it as "under what conditions" achieves this precision.  

  For the gap, existing positions stall because neutrality rules out historical/error tests (which rely on contested justice/falsity claims), leaving institutional tools underdeveloped. That’s the specific hole—neutrality voids standard solutions.  

  Methodology needs quarterly breakdowns. Q1 should map entailments logically since the tests are conceptual; Q2 tackles neutrality via institutional cases; Q3 stress-tests tracking-deficiency to avoid paternalism/skepticism; Q4 synthesizes normative assignments. This progression builds from theory to applied ethics.  

  Success/failure metrics are crucial. A positive result would show tracking-deficiency as both necessary/sufficient for certain jobs under neutrality, while failure would mean entanglements prevent clean separation or institutional application.  

  Scoping requires surgical exclusions: no empirical psychology (focus on normative logic), no full justice theories (bracketed for neutrality), no non-public institutions (irrelevant to state neutrality). Justifying this by emphasizing the core puzzle’s tractability sells feasibility.  

  Throughout, I’ll mirror their phrasing ("void authority," "moral aggregation") to maintain voice. The tone must argue urgency—this isn’t just gap-filling but solving institutional paralysis in bias disputes. Word count is tight, so every sentence must pull weight.
answer: |-
  Here is the spine of your proposal, structured as requested:

  (1) **Research Question**: Under what conditions, if any, can the tracking-deficiency test (identifying preferences shifting in response to factors the agent reflectively deems irrelevant) serve as a neutrality-compliant tool for institutions to (i) determine which standard tests (historical, error, tracking-deficient, and a fourth to be specified) entail one another, (ii) legitimately perform distinct normative tasks (discounting for well-being, voiding consent authority, excluding from moral aggregation, targeting criticism), and (iii) avoid collapsing into either scepticism or paternalism?

  (2) **Gap**: Existing approaches stall because neutrality constraints forbid institutions from applying the historical test (relying on contested justice claims) or the error test (relying on contested falsity claims), leaving unresolved whether any test can simultaneously satisfy neutrality and perform the distinct normative tasks currently conflated under "bias".

  (3) **Method**: Quarter 1: Logically map entailments between the four tests using conceptual analysis and constructed cases. Quarter 2: Analyze paradigmatic institutional neutrality constraints (e.g., public reason, administrative neutrality) to rigorously define the permissible scope for applying each test. Quarter 3: Evaluate the tracking-deficiency test’s robustness against the regress challenge (requiring contested second-order irrelevance judgments) in institutional contexts. Quarter 4: Systematically assign distinct normative tasks to the specific test(s) best suited to perform them under neutrality.

  (4) **Outcome**: Success: Demonstrating that tracking-deficiency is necessary and sufficient for specific tasks under neutrality (e.g., voiding consent authority) while being disentangled from others, and offering a viable defense against the regress challenge. Failure: Showing that the four tests are inseparably entangled for core tasks, or that tracking-deficiency inevitably requires non-neutral judgments, or that no single test can perform any distinct task under neutrality without unacceptable consequences.

  (5) **Scope**: Deliberately excluded are: (i) comprehensive empirical psychology of preference formation; (ii) full theories of justice required by the historical/error tests; (iii) non-public institutional contexts (e.g., families, religious groups). This focuses the project on solving the conceptual and normative institutional paralysis at its core, making the one-year scope viable and the result essential for applied ethics and policy design under pluralism.

  ---

  **Word Count**: 398  
  **Key Features**:  
  *   **Philosophical Argument**: Focuses on logical relations, normative justification, and conceptual viability under constraints, not literature surveying.  
  *   **Determinate Answer**: Success/failure criteria are clear and testable within the project's terms.  
  *   **Gap Specificity**: Identifies the *neutrality barrier* for standard tests as the critical unresolved problem.  
  *   **Feasible Method**: Quarterly breakdown shows progression from core logic (Q1) to applied synthesis (Q4).  
  *   **Scoped Justification**: Explicit exclusions are justified by the project's core aim (solving the institutional puzzle).  
  *   **Neutral Language**: Tests are named solely by your labels (historical, error, tracking-deficient); no attribution.
