prompt: |-
  I'm a journalist who covers social science and ideas for a national magazine, and I've been awarded a nine-month fellowship at a policy institute on the understanding that it produces two things: one long feature for a general audience, and one working paper that people who actually draft electoral rules could use. The selection committee — two political scientists and a philosopher — wants a two-page proposal next week, and it will fund the project only if the proposal shows that the interesting part is not reporting: it wants the question stated so that it has a determinate answer, an argument that the existing answers leave it open, a method, and an honest account of what would count as the project failing. My editor thinks the magazine piece should be about turnout decline; I think that is the boring version of the story, and I'd rather the proposal not go there. Please don't include a literature review or citations — I'll add those myself — but the conceptual architecture does need to be sharp enough that the working paper says something a drafter of election law couldn't have arrived at unaided.

  Here is where I've got to, and I'm aware it's half-formed. The three franchise reforms that come up again and again in the places I report on — compulsory voting; lowering the voting age, usually to sixteen; and extending the vote to resident non-citizens, at least in local and school-board elections, as a few jurisdictions have tried and some have had reversed in court — are almost always argued about separately, by different people, on different grounds. Compulsory voting is defended in the language of civic duty and the fair sharing of a collective burden, roughly on the model of jury service. Lowering the age is defended with developmental evidence about adolescent decision-making capacity, plus the observation that sixteen-year-olds work, pay tax and are subject to the law. Non-citizen voting is defended by pointing to stake rather than status: someone who lives under a city's ordinances, pays into it, sends children to its schools and can be deported for breaking its rules has an interest in its decisions that formal membership does not capture. My suspicion is that these grounds do not cohere, and specifically that the duty framing and the stake framing carry opposite implications about what the vote is. If the vote is something you owe your fellow members, it is odd to extend it to non-members, and odd to treat it as a shield against coercion that you are entitled to. If the vote is a protection you are owed because the state coerces you, it is hard to see why you may be compelled to exercise it — you don't owe anyone the exercise of a protection — and hard to see why the coercion of a fourteen-year-old generates less standing than that of a sixteen-year-old, unless there is quiet competence-based reasoning doing the work. So the left-ish package that bundles compulsory voting with franchise expansion may be the least stable combination available, while compulsory voting plus a competence-restricted franchise, and voluntary voting plus a stake-based expansion, each hang together. I keep losing versions of this argument at dinner parties with friends who work on campaigns, which is not evidence, so I'd like the proposal to state it as one question rather than three and to give a principled reason to think the tensions are genuine rather than a reflection of who happens to like which reform.

  What I want the proposal to supply, beyond the precise question: why the existing positions leave it open, given that the literatures barely talk to each other and that where they do they argue about turnout or about the abstract problem of who counts as affected by a decision rather than about concrete packages of reform; a method that is genuinely philosophical, since I can't do original survey work and don't want to fund it — my own idea is a handful of test cases at the intersection of the three reforms, used as a diagnostic for which justification yields which verdict: the sixteen-year-old permanent resident who has lived in the same city since she was three, works part-time, will be eligible to naturalise at eighteen and hasn't got round to it; the middle-aged citizen who says he has a conscientious objection to voting and would rather pay the fine; the long-term resident with no legal status whose children are citizens; a statement of the possible conclusions and which considerations would decide between them; and a description of the deliverable I have in mind, which is something like a compatibility map — a table of the standard justifications, the reforms each one supports, and the packages that can and cannot be defended together — that someone writing a city charter or an electoral code could actually consult. Then say plainly what would count as failure: the duty and stake framings turn out to be complements rather than rivals; the map merely reproduces the bundling that political actors already exhibit; the competence threshold turns out to be the only real crux and the rest is decoration; or the whole thing collapses into the general boundary problem and I have no way to stop it expanding to future generations, prisoners and corporations. Finally, be realistic about scope: tell me what a nine-month, one-person, non-specialist project cannot do, and which part you would cut first.
reasoning: |-
  Hmm, the user is a journalist preparing a fellowship proposal about franchise reforms for a policy institute. They need a sharp conceptual framework that avoids the typical turnout decline angle their editor prefers, focusing instead on the tensions between three reforms: compulsory voting, lowering voting age, and non-citizen voting. 

  The core challenge is framing these disjointed debates into one coherent question about whether the underlying justifications—civic duty versus stake-based rights—are fundamentally incompatible. The journalist keeps losing dinner-party arguments about this, so they need academic rigor to prove it's not just political preference. 

  Key constraints: The proposal must show a determinate answer is possible, explain why existing literature leaves the question open (they barely interact), use philosophical methods (no original surveys), and preempt failure conditions. The deliverable is a practical "compatibility map" for policy drafters. 

  Their half-formed idea has merit but needs tightening: The duty/stake tension feels real but needs grounding in principle rather than observation. The test cases (e.g., conscientious objector, undocumented parent) are smart—they force justifications to confront edge scenarios. But scope is a risk: Nine months alone can't solve the "boundary problem" (prisoners/corporations), so the proposal must explicitly bracket those. 

  Biggest pitfall? Competence thresholds secretly doing all the work. The method should isolate duty/stake logic by testing if competence alone resolves the cases. Also, the "left-ish package" instability hypothesis must avoid partisan framing—it's about logical coherence, not ideology. 

  For the "why existing positions leave it open" section: Emphasize disciplinary silos. Political scientists study turnout/compulsion, psychologists study adolescent competence, immigration scholars study non-citizen rights—nobody compares their first principles. Philosophers *do* discuss "all affected" vs. membership, but rarely apply it to concrete reform bundles. 

  Failure conditions should be specific: 
  - If duty/stake turn out complementary (unlikely, given compulsion vs. entitlement clash) 
  - If the map just mirrors existing political alliances (e.g., progressives bundle all three) 
  - If adolescent competence overdetermines the age question 
  - If every test case collapses into "who counts as affected" without resolution 

  What to cut first? The non-citizen examples could overspill into immigration law tangles. Prioritize cases where duty/stake directly conflict, like the conscientious objector (duty says punish, stake says his coercion claim voids compulsion). 

  Final note: The journalist’s skepticism about "boring" turnout focus is justified. Turnout decline is symptoms; this is about the disease—confused first principles eroding franchise legitimacy.
answer: |-
  Here's a conceptual architecture for your proposal, designed to meet the committee's criteria while avoiding the turnout trap and centering the core tension you've identified. This structure prioritizes philosophical clarity, a determinate answer, and policy utility:

  ---

  ### **Project Title**: The Franchise Tension: Mapping the Conceptual Compatibility of Electoral Reform Bundles

  **Core Question**:  
  *Can the primary justifications for compulsory voting (civic duty), adolescent enfranchisement (developmental competence), and non-citizen voting (stake-based entitlement) be coherently combined into a single, defensible theory of voting rights—or do they generate irreconcilable tensions that constrain viable reform packages?*

  **Why Existing Answers Leave It Open**:  
  1. **Siloed Discourses**: Each reform is debated within separate literatures (electoral studies, developmental psychology, immigration/citizenship theory) using incommensurate core concepts (duty vs. capacity vs. stake).  
  2. **Under-theorized Bundling**: Advocates/policymakers combine reforms pragmatically (e.g., "pro-democracy" packages) without testing foundational compatibility. Philosophical work on "all affected interests" vs. "membership" theories addresses boundaries abstractly but *not* how they interact with compulsion or competence thresholds in real-world bundles.  
  3. **Hidden Assumptions**: Competence criteria often covertly scaffold age-based exclusions, masking conflicts with stake-based claims. Duty frameworks ignore whether obligations apply to non-members.  

  **Method: Conceptual Stress-Testing via Dilemma Cases**  
  A rigorous philosophical analysis using hypothetical but legally plausible scenarios to isolate clashes between justifications:  
  - **Case 1**: A 16-year-old *permanent resident* (taxpaying, local-schooled) refuses to vote in a compulsory system. Does civic duty override her non-citizen status? Can stake justify compulsion?  
  - **Case 2**: A citizen *conscientious objector* to voting (cites futility/pluralism concerns) faces fines under compulsory voting. Does his membership obligation negate autonomy claims stake-based theories would grant non-members?  
  - **Case 3**: An *undocumented long-term resident* with citizen children seeks to vote in school board elections. Does stake override legal status? If competence justifies excluding her 14-year-old (citizen) child, why not her?  

  **Analysis will**:  
  - Diagnose which justification(s) dominate resolution of each case.  
  - Identify whether one framework can subsume others without contradiction.  
  - Reveal if "coherence" requires abandoning core tenets (e.g., duty theorists accepting non-member voters).  

  **Determinate Conclusions Possible**:  
  1. **Fundamental Incompatibility**: Duty/stake are mutually undermining; competence thresholds destabilize both. Only internally consistent bundles survive (e.g., duty + competence OR stake + voluntarism).  
  2. **Hierarchical Compatibility**: One justification (e.g., stake) can coherently integrate others if revised.  
  3. **Contextual Resolution**: Local vs. national elections alter the viability of bundles (e.g., duty applies only to sovereign membership).  
  *Crucial*: The test cases force adjudication between justifications; conclusions turn on whether *the same core principle* can resolve all cases without contradiction.

  **Deliverable: The Franchise Compatibility Map**  
  A policy-focused matrix for drafters evaluating reform packages:  
  | **Core Justification** | Supports: | Conflicts With: | Viable Bundles? |  
  |------------------------|-----------|----------------|-----------------|  
  | Civic Duty             | Compulsion, Age-18+ | Non-citizen voting, Anti-compulsion claims | Duty + Competence (status quo) |  
  | Stake-Based Entitlement | Non-citizen voting, Voluntarism | Compulsion, Arbitrary age cuts | Stake + Voluntarism + Residence |  
  | Developmental Competence | Age-16+ voting | Non-citizen exclusion, Duty enforcement | [As above, or hybrid?] |  
  *(Final map populated after analysis; will specify logical "red lines" for drafters)*  

  **What Would Constitute Failure**:  
  - **Theories are Complementary**: Duty/stake/competence seamlessly integrate; tensions are superficial.  
  - **Bundles are Trivially Predictable**: The map merely codifies existing political alliances (e.g., "left" vs. "right" bundles) without novel insight.  
  - **Competence Dominates**: Age thresholds resolve all cases, making duty/stake debates irrelevant.  
  - **Boundary Problem Overwhelms**: No principled way to exclude corporations/future generations from stake-based claims, collapsing the project.  

  **Realistic Scope & Cuts**:  
  **Feasible in 9 Months**:  
  - Deep dive into 3 core justifications (duty, stake, competence) via 4-5 dilemma cases.  
  - Compatibility matrix grounded in test-case outcomes.  
  - Working paper with clear drafting implications.  

  **First Cut If Overwhelmed**:  
  - Narrow from *all* non-citizens to specific subcategories (e.g., permanent residents only).  
  - Drop national-level implications; focus on local/school-board elections where stake arguments are strongest.  
  - Simplify cases (e.g., remove conscientious objection variant).  

  **Non-Negotiable Core**:  
  The duty/stake clash *must* be resolved—it’s the project’s spine. Without this, the map lacks diagnostic power.

  ---

  ### Why This Works for the Committee
  - **Not Reporting**: Centers conceptual tension, not descriptive trends.  
  - **Determinate Answer**: Test cases force "this bundle works/implodes" verdicts.  
  - **Policy Utility**: The map gives drafters a tool to avoid logically incoherent packages.  
  - **Failure Defined**: Clear, specific collapse conditions.  
  - **Honest Scope**: Acknowledges boundary problem risk but contains it via test cases.  

  This architecture makes your dinner-party insight machine-testable—and gives electoral drafters something they lack: a dispassionate logic to navigate the reform thicket.
