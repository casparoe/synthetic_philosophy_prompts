answer: |-
  Below is a sorting quiz designed to diagnose positions on money pumps, cyclic preferences, and related rational choice issues. It includes eight concrete cases (aligned with your specified scenarios) with answer options phrased neutrally. The scoring key maps answer patterns to **eight distinct positions** in the logical space, flags incoherent/unattractive combinations, and notes epistemic status. I dropped no cases—your seven are included, and I added an eighth (a "status quo bias" case) to clarify ambiguity in pre-commitment.

  ---

  ### **Sorting Quiz: Rational Choice Cases**

  **Instructions:** For each scenario, circle the answer that best reflects your judgment. There are no right or wrong answers—we’re exploring intuitions.

  1. **Ordinary Money Pump**  
     You prefer A to B, B to C, and C to A. A trader offers:  
     - Pay $1 to trade A for B  
     - Then pay $1 to trade B for C  
     - Then pay $1 to trade C for A  
     You end with A but $3 poorer.  
     *Does this show your preferences are irrational?*  
     (a) Yes  
     (b) No  

  2. **Money Burner Pump**  
     Identical to #1, but the trader burns the money. No one profits; you just lose $3.  
     *Does burning the money change your verdict?*  
     (a) No, it’s still irrational  
     (b) Yes, it’s no longer irrational  

  3. **Free Pre-Commitment**  
     You foresee the pump from #1 and can *pre-commit for free* to refuse all trades. Without pre-commitment, you’d lose $3.  
     *Should you pre-commit?*  
     (a) Yes  
     (b) No  

  4. **Group Money Pump**  
     A committee’s majority preferences cycle: A>B, B>C, C>A. A trader runs the same pump as #1, leaving the group with A and $3 less.  
     *Does this show the group is irrational?*  
     (a) Yes  
     (b) No—groups lack a unified will  
     (c) No—only individuals can be irrational  

  5. **Individual Over Time**  
     Your preferences change: today you prefer $110 in 2 days over $100 in 1 day; tomorrow you prefer $100 now over $110 in 1 day. A trader exploits this: you end with $100 today (less than $110).  
     *Is this analogous to the group in #4?*  
     (a) Yes—both are irrational  
     (b) No—changing preferences aren’t irrational  
     (c) No—groups and individuals are different  

  6. **Self-Torturer (Small Steps)**  
     A device delivers electric current (0–1000 units). For each unit increase:  
     - You gain $10,000  
     - Pain increases imperceptibly; each step feels worth it.  
     At 1000, pain is excruciating and not worth any money. You accept all increases.  
     *Is this a rationality failure?*  
     (a) Yes  
     (b) No  

  7. **Unimaginable Future**  
     You know you’ll care about things you can’t currently understand (e.g., after having a child). Choices that seem acceptable now lead to an outcome future-you will hate.  
     *Can you be required to avoid this path?*  
     (a) Yes  
     (b) No  

  8. **Status Quo Bias**  
     Identical to #1, but you start with A and can *avoid trading at all* at no cost.  
     *Should you avoid trading?*  
     (a) Yes  
     (b) No  

  ---

  ### **Scoring Key**  
  Based on your answers, map to one of eight positions. I built the tree from the quiz’s logical space first, then labeled positions. Combinations that are **incoherent** (logically inconsistent) or **unoccupied** (no one defends them) are flagged.  
  **Epistemic notes**:  
  - 🟢 **Orthodox**: Widely accepted in rational choice theory.  
  - 🟠 **Disputed**: Live debate; no consensus.  
  - 🔴 **Reconstructed**: Based on logical inference (not a named position).  

  | Answer Pattern (Q1–Q8)             | Position Label & Description                                                                 | Epistemic Status | Defensibility/Notes                                                                 |
  |------------------------------------|---------------------------------------------------------------------------------------------|------------------|-------------------------------------------------------------------------------------|
  | **1a, 2a, 3a, 4a, 5a, 6a, 7a, 8a** | **Strict Acyclicity**: Cyclic preferences are irrational. Pumps show vulnerability to exploitation. Avoid cycles preemptively. | 🟢 Orthodox      | Defensible; avoids all pumps. Standard in economics.                               |
  | **1a, 2a, 3c, 4a, 5a, 6a, 7a, 8a** | **Sophisticated Chooser**: Cycles are irrational, but you avoid pumps by foreseeing and refusing exploitative paths (no need to pre-commit). | 🟢 Orthodox      | Defensible; avoids exploitation without commitment costs.                         |
  | **1a, 2a, 3a, 4b/c, 5b, 6a, 7a, 8a** | **Temporal Neutrality**: Cycles are irrational for fixed preferences. Changing preferences (Q5) and groups (Q4) are distinct. | 🟠 Disputed      | Defensible; separates individual/group rationality. Rejects "collective agency."   |
  | **1a, 2b, 3a, 4a, 5a, 6a, 7a, 8a** | **Exploitation-Required**: Cycles are irrational only if someone gains. Burning money (Q2) negates the problem. | 🔴 Reconstructed | Weak: Losing value is bad regardless of who profits. Incoherent if Q6=Yes.         |
  | **1b, 2b, 3b, 4b/c, 5b, 6b, 7b, 8b** | **Choice Relativism**: No irrationality—each choice is rational given its context. Pumps are just bad luck. | 🟠 Disputed      | Defensible but unpopular: Ignores global outcomes. Aligns with behavioral econ.    |
  | **1b, 2a, 3a, 4a, 5a, 6a, 7a, 8a** | **Incoherent Combination**: Denies cycles are irrational (Q1b) but accepts all pump risks (Q2a, Q3a, etc.). | 🔴 Incoherent    | Abandon: Contradicts Q1b by acting as if cycles *are* risky.                       |
  | **1a, 2a, 3a, 4b/c, 5b, 6b, 7b, 8a** | **Resolute Choice (Bounded)**: Pre-commit to plans (Q3a) but only for imaginable/stable preferences. Fails with change (Q5, Q7) or vagueness (Q6). | 🟠 Disputed      | Partially defensible: Works for clear cases. Fails for Q6/Q7.                      |
  | **1b, 2b, 3a, 4b/c, 5b, 6b, 7b, 8a** | **Status Quo Bias**: Avoid trades (Q8a) but not due to cycles (Q1b). Values inertia, not resolution. | 🟠 Disputed      | Defensible; avoids pumps pragmatically. Aligns with loss aversion.                 |

  ---

  ### **Notes on Taxonomy**  
  - **Unattractive/Unoccupied**: Patterns like (1a, 2b, 3b, ...) are **unoccupied**—saying cycles are irrational *only when profitable* (Q2b) but refusing to pre-commit (Q3b) is exploitable.  
  - **Ambiguity**: Q5 (time inconsistency) splits positions—some see it as identical to cycles (e.g., Strict Acyclicity), others as distinct (Temporal Neutrality). The quiz separates these.  
  - **Your Pet Case (Q7)**: Diagnoses limits of resolute choice. If you answered 7b, you reject planning under deep uncertainty.  
  - **Added Case (Q8)**: Clarifies whether avoiding pumps is about *cycles* or *inertia*. Dropped nothing—it complements your cases.  
  - **Defensibility**:  
    - **Strong**: Strict Acyclicity, Sophisticated Chooser.  
    - **Moderate**: Temporal Neutrality, Resolute (Bounded), Status Quo Bias.  
    - **Weak**: Exploitation-Required (incoherent with loss aversion), Choice Relativism (ignores dominance).  
  - **Orthodox v. Disputed**:  
    - Orthodox: Acyclicity (Q1a), pre-commitment/sophistication (Q3).  
    - Disputed: Group agency (Q4), changing preferences (Q5), unimaginable futures (Q7).  

  Use the quiz to spark debate: "Why did you choose X? Does your position cohere with all cases?" I recommend assigning defenses of each leaf in seminar—even unpopular ones sharpen reasoning.
