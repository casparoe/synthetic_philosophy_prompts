prompt: |-
  hi — i'm writing my third-year dissertation on how the Atlantic slave system actually ended, so i've got the Williams thesis (interests: the sugar colonies stopped paying, so the plug got pulled) on one side and Appiah's honour story on the other, and my supervisor is a rational choice guy who keeps deflating the whole thing. His line is that a norm is just a convention, exactly like driving on the left: everybody does it because everybody expects everybody else to, nobody in the history of the world was ever argued out of driving on the left, and when people switch it's because enough other people switched. So the abolitionists' arguments were the obituary, not the cause — they're what people wrote while the real mechanism did its work. He runs the same line on duelling: nobody refuted the code duello, gentlemen just gradually stopped caring. When I pointed out that i vaguely remember someone (Drescher?) arguing the West Indian sugar economy was still growing, not dying, when Britain abolished the trade, he just said fine, then something else in the payoff structure moved and that's what I should be looking for. When I pushed harder he switched analogies entirely: it's like a fashion, nobody argues anyone out of flared trousers.

  The analogy is doing a lot of work in his hands — it's basically what licenses "arguments were epiphenomenal, go find the real cause" — and I can't tell how much of that is the analogy and how much is the model it's riding on. I sat down to to write it out as an actual payoff matrix and got stuck in about ten minutes, because I couldn't work out who the players are even supposed to be (planters? MPs? the people being enslaved? the people boycotting slave-grown sugar? the guys being press-ganged onto the anti-slave-trade patrols?) or whether we're in a common-interest coordination game at all. I've started calling this the "coordinating with whom" problem, which I'm fairly sure isn't a real term.

  Could you audit the driving-on-the-left analogy for me: what corresponds to what if you take the mapping seriously, where it breaks, and specifically which of the disanalogies matter for the conclusion he's using it for and which are just noise. The things I keep getting snagged on: pure conventions are cases where everyone is better off matching, whereas abolishing slavery looks like some people's interests being straight-up defeated (and then compensated, at enormous public expense, which seems like an odd thing for a convention to require); norms come with honour and blame and shame bolted onto them in a way that driving on the left doesn't seem to; and his payoffs look like they're meant to be fixed while Appiah's story seems to be about what people want changing — which, if that's right, means the argument and the payoff shift aren't two separate things he gets to choose between, and the whole "epiphenomenal" move quietly assumes what it needs to prove. If the convention picture genuinely can't carry the anti-argument bit, is there a better analogy that does the work Appiah wants (honour as a kind of credit? a norm as a language? a boycott or a strike, where the argument is part of the mechanism?) — and would that better one rescue my supervisor's conclusion too, or does "the arguments didn't matter" only survive inside the coordination version? I don't need to win the supervision, I just want to know which bit of his picture is load-bearing.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're working on their dissertation about the end of the Atlantic slave system, caught between the Williams thesis and Appiah's honor argument. Their supervisor, a rational choice theorist, uses the driving-on-the-left analogy to argue that norms are mere conventions, and abolitionist arguments were epiphenomenal. The user is struggling with mapping this analogy to slavery abolition and suspects key disanalogies.

  First, I need to break down the supervisor's analogy. The driving convention works because everyone benefits from coordination—no inherent morality, just mutual interest. Applying this to slavery implies abolition happened when payoffs shifted, making it unprofitable. But the user points out that slavery involved moral arguments, active opposition from abolitionists, and compensation to slave owners. These elements don't fit a simple coordination game.

  The user's deeper concern seems to be whether their supervisor's model dismisses the role of ideas and moral persuasion. They mention Drescher's argument that the sugar economy was still profitable, challenging Williams' decline thesis. The supervisor's response shifts to vague payoff changes without specifying mechanisms. The user feels the analogy is doing heavy lifting to sideline arguments, but they can't articulate exactly why it fails.

  I should identify the core disanalogies. First, slavery abolition isn't a coordination game with mutual benefit. Enslaved people had opposing interests, and abolitionists actively fought against slaveholders. Second, the driving convention lacks normative content, while abolition involved shame, honor, and moral claims. Third, compensation to slave owners adds complexity—why pay if it's just a convention? That suggests coercive change, not mutual adjustment.

  The user also wonders if there's a better analogy, like boycotts or strikes, where arguments are part of the mechanism. These involve strategic coordination to shift payoffs, where persuasion matters. This could reconcile Appiah's honor theory with rational choice, showing that norms and payoffs interact. For example, boycotts make immoral practices costly, linking moral arguments to material consequences.

  The supervisor's epiphenomenal claim might assume fixed preferences, ignoring that arguments can reshape what people value. If Appiah is right about changing honor codes, then moral arguments are causal in shifting payoffs. The user needs to challenge the fixed-preference assumption to show that ideas aren't just byproducts.

  In conclusion, the driving analogy's key failures are the lack of conflict, moral dimension, and preference change. Highlighting these disanalogies undermines the supervisor's dismissal of arguments. Suggesting alternative models like boycotts could bridge Appiah and rational choice, showing how norms and payoffs co-evolve. The user's real need is to validate their skepticism and find a framework that incorporates both material factors and ideational change.
answer: |-
  Let's dissect the supervisor's "driving-on-the-left" analogy systematically, pinpointing its strengths, its critical breakdown points regarding slavery abolition, and where it smuggles in assumptions that undermine your core question about the role of arguments.

  **The Analogy Mapped (As Intended by Supervisor):**

  1.  **"Driving on the Left" Norm:** A pure coordination convention.
      *   **Players:** Drivers (essentially identical in interests).
      *   **Payoffs:** Everyone is significantly better off if *everyone* uses the *same* side (any side!), avoiding collisions. No inherent moral preference for left/right. Payoffs are symmetric.
      *   **Mechanism of Change:** Shifts occur when a critical mass switches expectations (e.g., due to external pressure like neighboring countries switching, or a decree anticipating a shift). *No one is argued out of their preference for driving on the left itself.* Arguments might explain *why* switching *now* is safer, but not *why* driving on the left was bad.
      *   **Enforcement:** Primarily self-interest in avoiding death/costs. Minimal "shame" beyond practical consequences.
      *   **Arguments:** Epiphenomenal to the core coordination problem. They describe the situation or announce the change, but don't *cause* the shift in fundamental preferences/payoffs.

  2.  **Mapping to Slavery Abolition (Supervisor's Implied Model):**
      *   **"The Norm":** Slaveholding (or permitting it).
      *   **Players:** Presumably slaveholders, non-slaveholding elites, politicians, the public (treated as relatively homogenous groups with aligned interests, or at least where some groups' interests dominate).
      *   **Payoffs:** Implied that maintaining slavery was the stable "everyone expects it" equilibrium. Some payoff (economic benefit, social stability) made it collectively preferable *for the dominant players* to maintain the system.
      *   **Mechanism of Change:** Some shift in the underlying "payoff structure" (e.g., economic costs of slavery rising, benefits falling; changing geopolitical pressures; rising costs of repression; changing social status associated with slaveholding). Once this shift reached a critical point, expectations flipped, leading to abolition. *Abolitionist arguments didn't change minds about the morality of slavery; they merely reflected or announced the changing payoff landscape.*
      *   **Enforcement:** Implied to be primarily through self-interest and expectations, similar to driving. "Honour" is downplayed or seen as derivative of the payoff structure.
      *   **Arguments:** Obituary, not cause. Superfluous to the real mechanism (changing payoffs/expectations).

  **Where the Analogy Breaks Down Critically (and Why it Matters for "Epiphenomenal Arguments"):**

  1.  **Fundamental Conflict of Interest & Asymmetric Payoffs:**
      *   **Driving:** Pure common interest. *All* drivers gain equally from coordination on *any* side.
      *   **Slavery:** Inherently antagonistic. **Enslaved people:** Their fundamental interest is *abolition*, full stop. Their "payoff" for the system is catastrophic. **Slaveholders:** Had massive, direct, material, and social interests in *maintaining* slavery. **Abolitionists/Anti-Slavery Public:** Had moral, economic (e.g., competing free labor), or political interests in *ending* it.
      *   **Why it breaks the analogy:** This isn't a coordination game where everyone benefits from agreeing on *any* rule. It's a **distributive conflict** or a **battle of wills**. The "switch" (abolition) represented a *massive loss* for one powerful group (slaveholders) and a *fundamental gain* for another (the enslaved). This requires **overcoming resistance**, not just aligning expectations. The driving analogy implicitly assumes everyone *wants* the same outcome (coordination), just needs to agree on *how*. Abolition involved forcing a change deeply opposed by powerful actors. **The "coordinating with whom?" problem is fatal.** You can't coordinate with people whose core interests are diametrically opposed to yours on the outcome itself.

  2.  **Moral Content and Normative Force:**
      *   **Driving:** Amoral convention. No inherent "right" or "wrong" side. Shame/blame only attach to recklessness (not following *any* convention), not the *choice* of side itself.
      *   **Slavery:** Core to the abolitionist movement was the argument that slavery was **intrinsically morally wrong**, a violation of fundamental human dignity and rights. Abolition involved installing a powerful **moral norm** condemning an act previously considered acceptable or even honorable by many.
      *   **Why it breaks the analogy:** The driving convention lacks intrinsic moral content. Arguments about *which side* to drive on are purely instrumental. Arguments *against slavery* were fundamentally *moral* arguments aimed at changing the perception of the *act itself*, not just coordinating behavior. **Appiah's "honour" point is crucial here:** The shift involved redefining what constituted honourable behaviour for a gentleman/nation. This is qualitatively different. Arguments weren't just announcing a change; they were actively *trying to redefine the normative landscape* – what was shameful, what was honourable. The driving analogy *assumes away the very thing Appiah highlights and you suspect matters*.

  3.  **Compensation & Coercion:**
      *   **Driving:** Switching sides doesn't require compensating losers. The cost is mainly logistical (re-signing, public awareness). Enforcement is self-policing based on self-preservation.
      *   **Slavery:** British abolition involved **massive state compensation** (£20 million in 1833, a huge % of GDP) to slaveholders. It also required **state coercion** (Royal Navy patrols against slave trade, laws enforced against pro-slavery interests). Slave resistance (e.g., revolts, marronage) was a constant factor increasing the cost of maintenance.
      *   **Why it breaks the analogy:** Compensation and coercion are hallmarks of overcoming a **conflict**, not facilitating coordination. Paying someone £20 million suggests they suffered a *real loss*, not that they simply agreed to switch lanes for mutual benefit. Naval patrols represent *enforcement against violators of the new rule*, not self-enforcing coordination. This looks like **imposing a new rule on losers**, not mutually beneficial coordination. The analogy obscures the power struggle.

  4.  **The Nature of "Payoff Shifts" and the Role of Arguments:**
      *   **Driving:** Payoffs (avoid death/costs) are fixed and material. Arguments don't change the *value* of avoiding collisions; they just inform about the *means* (which side to use).
      *   **Slavery:** **Appiah's core point (and your insight) is crucial here:** Arguments aimed to change the *perceived payoffs themselves*. They weren't just describing existing payoffs; they were trying to *alter* them by:
          *   **Changing Moral Preferences:** Making people *feel* shame or dishonour for participating in/supporting slavery, increasing the *social cost*.
          *   **Changing Perceptions of Legitimacy:** Undermining the ideological foundation of slavery, making it harder to defend and enforce, increasing the *political cost*.
          *   **Informing/Mobilizing:** Highlighting the *true* costs of slavery (e.g., brutality, economic inefficiency argued by Adam Smith earlier) to shift calculations.
      *   **Why it breaks the analogy (and undermines "epiphenomenal"):** The supervisor treats "payoffs" as objective and fixed, and arguments as mere commentary. **But if arguments can successfully change how people *value* certain outcomes (e.g., making social dishonour a major cost, or revealing hidden material inefficiencies), then they are *causal* in shifting the payoff structure.** The supervisor's "epiphenomenal" claim *assumes* arguments cannot change fundamental preferences/values/perceptions – it assumes the payoff structure shifts for *other* reasons (e.g., pure economics). This is precisely what Drescher's work (showing the West Indies were *profitable* at abolition) and Appiah's thesis challenge. If the economic payoff didn't shift negatively *enough* to explain abolition, then the change in the *social/moral* payoff component (driven significantly *by* abolitionist arguments and activism) becomes the crucial explanatory factor. The analogy hides this possibility by modeling payoffs as simple and static.

  **Which Disanalogies Matter Most for the Conclusion?** The **Conflict of Interest/Asymmetric Payoffs** and the **Moral Content/Normative Force** disanalogies are the most damaging to the supervisor's core "epiphenomenal arguments" conclusion. They show abolition wasn't a benign coordination problem but a conflict where moral arguments were weapons used to change perceptions of legitimacy, honor, and cost, directly challenging powerful entrenched interests. The **Compensation/Coercion** point reinforces this conflict model. The **Nature of Payoff Shifts** disanalogy shows the supervisor's model subtly begs the question against Appiah by assuming arguments can't *be* the mechanism of payoff change.

  **Better Analogies for Appiah's Honour Story / Your Needs:**

  1.  **Boycotts:**
      *   **Mapping:** Slave-grown sugar boycott is the direct historical example. Players: Consumers vs. Producers/Traders. Payoffs: Consumers get utility from sugar but face a *moral/social cost* if consuming "tainted" sugar. Producers lose sales if boycott succeeds.
      *   **Role of Arguments:** Arguments *create* the perceived moral/social cost. They frame the product as immoral, making consumption shameful. Arguments also coordinate the boycott itself. The boycott *shifts the material payoff* (lost sales) for producers. **Arguments are central to the mechanism:** They define the "honour" (avoiding shame) and create the collective action that changes material incentives.
      *   **Rescue Supervisor?** Partially. It shows a "payoff shift" (lost profits) as crucial. *But* it demonstrates that arguments (defining the moral cost) and collective action (the boycott itself) are the *drivers* of that payoff shift, not independent factors. It refutes "epiphenomenal" by showing arguments as the *initiating and sustaining* cause of the payoff change.

  2.  **Strikes:**
      *   **Mapping:** Workers vs. Owners. Payoffs: Workers want higher wages/conditions but risk job loss. Owners want lower costs but risk lost production.
      *   **Role of Arguments:** Arguments (e.g., about fairness, exploitation, solidarity) build worker resolve (changing their valuation of risk vs. gain), create public support (increasing cost to owners via reputation/sympathy strikes), and coordinate the action. Arguments frame the owners' stance as dishonourable exploitation.
      *   **Rescue Supervisor?** Similar to boycott. Payoff shift (production halt) is key, but arguments are integral to *causing* that shift by changing valuations and enabling coordination. Not epiphenomenal.

  3.  **Norms as Language / Social Grammar (Less Formal, More Appiah):**
      *   **Mapping:** Norms define what is sayable, thinkable, and honourable within a society. Changing a norm (like slavery's acceptability) is like changing the meaning of a word or introducing a new grammatical rule.
      *   **Role of Arguments:** Arguments *are* the primary tools for redefining this social grammar. They challenge existing definitions, offer new ones, and justify them. Successful arguments shift what constitutes "common sense" or "honour." The payoff shift *follows* the normative shift – acting dishonourably becomes socially costly *because* the norm changed.
      *   **Rescue Supervisor?** No. This model places arguments at the very heart of the causal mechanism for normative change. The payoff shift (social sanction) is a *consequence* of the normative shift driven by argument/discourse.

  **Conclusion: The Load-Bearing Beam**

  The core load-bearing element of your supervisor's picture is the **assumption that fundamental preferences, values, and perceptions of honour/shame (the components of "payoffs" beyond simple material gain) are exogenous and fixed.** The driving analogy *requires* this assumption to hold for its "epiphenomenal arguments" conclusion to work. If arguments can *change* those preferences/values/perceptions – making slavery *feel* shameful, dishonourable, or illegitimate in a way it wasn't before – then arguments become a direct causal force *shaping* the payoff structure itself. Drescher's data challenges the simple economic "payoff shift" (Williams), while Appiah's thesis directly challenges the assumption that honour-based payoffs were fixed.

  **Your Path Forward:**

  1.  **Directly Challenge the Fixed-Preference Assumption:** Frame your dissertation around whether abolitionist arguments and activism *caused* a shift in the perceived social/moral/honour-based payoffs associated with slavery, independent of or interacting with economic factors. Cite Appiah, but also look at the work of Christopher Leslie Brown ("Moral Capital") on how abolitionists constructed the moral argument strategically.
  2.  **Use Conflict Models, Not Coordination Models:** Frame it as a political struggle/collective action problem/battle of ideas. Who were the actors? What were their *conflicting* interests? How did abolitionists overcome the opposition? Boycott and strike analogies are helpful here.
  3.  **Empirical Focus:** Don't just debate theory. Use your sources! Examine abolitionist rhetoric – did it *succeed* in creating social stigma? Look at parliamentary debates – were opponents genuinely persuaded by moral arguments, or only yielding to pressure? Analyze the compensation debate – why was it deemed necessary if it was just a benign convention switch?
  4.  **Engage Supervisor Constructively:** "I understand your point about payoff structures. My research suggests the crucial payoff shift wasn't purely economic (given Drescher), but involved the rising *social and moral cost* of defending slavery. I'm investigating how abolitionist arguments actively *engineered* that cost increase by redefining honour and legitimacy, making it a key part of the 'payoff shift' mechanism." This meets him on rational choice ground but challenges the narrow definition of "payoffs."

  The driving analogy is a powerful rhetorical tool for your supervisor, but its foundations crumble when applied to the morally charged, conflict-ridden, preference-transforming reality of slavery abolition. Your "coordinating with whom?" instinct is exactly right – it highlights the analogy's fatal flaw.
