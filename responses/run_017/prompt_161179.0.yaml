answer: |-
  The challenge you're grappling with involves understanding "closeness to truth" across different types of false claims. Let's dissect the core concepts at play, starting with a brainstorm of candidate notions of closeness, their flaws, and a resolution focused on your "repair-cost" intuition.

  ### Brainstorming Candidate Concepts
  1. **Numerical Distance**:  
     - **Description**: In quantitative contexts (like the bean jar), closeness is measured by absolute difference (e.g., |900–940| = 40 vs. |2000–940| = 1060).  
     - **What's wrong**: It fails for non-numerical claims (e.g., orbital shapes). It assumes a metric space where distances are computable, but many philosophical/scientific claims lack this (e.g., comparing "circle" vs. "parabola" requires a geometry-specific metric). It cannot handle qualitative or structural falsehoods.

  2. **Consequence-Based Verisimilitude (Popperian)**:  
     - **Description**: Closeness is measured by the balance of true vs. false consequences (e.g., "circle" implies true consequences like "closed orbit" but false ones like "constant radial distance"; "parabola" implies more false consequences like "open orbit").  
     - **What's wrong**: As you noted, it "misbehaves" under refinement. Adding a false detail ("radius = 1 AU") introduces *both* true (e.g., "radius ≈1 AU") and false consequences (e.g., "exactly 1 AU"), making net consequence-counting ambiguous. Worse, the Miller-Tichý theorem (1974) proved that under Popper's definition, no false theory can be closer to truth than another in a logically consistent way—it collapses into triviality. It also depends on arbitrary choices of language/consequence sets.

  3. **Repair-Cost (Your Intuition)**:  
     - **Description**: Closeness is the minimal "work" (conceptual, structural, or parametric changes) needed to transform a false claim into a true one. For orbits, repairing "circle" to "ellipse" requires a minor adjustment (e.g., introducing eccentricity), while "parabola" needs a major overhaul (e.g., redefining conic section parameters).  
     - **Why it initially seems better**: It handles non-numerical cases intuitively and avoids consequence-counting pitfalls by focusing on *transformational minimality*.  
     - **What's wrong (in your radius example)**: When you add "radius = 1 AU" to "circle", the repair-cost is still low (only small radius changes are needed), yet you intuit it as "less close" than the unadorned "circle". This exposes a flaw: repair-cost doesn't penalize *overprecision*. The claim "circle with radius 1 AU" is *riskier*—it makes a specific, falsifiable claim that a vague "circle" does not. Repair-cost alone misses this, as it only considers the path to truth, not the claim's vulnerability to error.

  ### Analysis of Repair-Cost
  - **What it is**: Repair-cost measures *minimal intervention distance*—the least costly modification (in parameters, structure, or concepts) to achieve truth. It is operationalized as a **metric over a state space** (e.g., geometric shapes with parameters like eccentricity).  
  - **How it differs from others**:  
    - Vs. *numerical distance*: It generalizes to qualitative domains (e.g., orbits) by defining state spaces (e.g., conic sections with eccentricity and semi-major axis).  
    - Vs. *consequence-counting*: It avoids language-dependence by focusing on model-space transformations, not logical consequences.  
  - **Where it breaks down**:  
    1. **Incommensurable vocabularies** (e.g., comparing "orbit is a circle" to "orbit is a harmonic oscillator"): Without a shared state space, defining "repairs" is ambiguous.  
    2. **Multiple minimal repairs** (e.g., fixing "circle" to "ellipse" could involve adjusting eccentricity *or* moving foci—both cheap but distinct). Repair-cost doesn't specify which path "counts," leading to indeterminacy.  
    3. **Overprecision/risk sensitivity**: As in your radius example, repair-cost ignores that claims with added false details are *epistemically worse* because they are more easily falsifiable and "get lucky" with near-truth (e.g., "radius=1 AU" is accidentally close but unjustifiably precise).  
    4. **Context-dependence**: "Cost" is subjective—e.g., in physics, repairing "parabola" to "ellipse" might involve revising gravitational theory, which is costlier than tweaking a circle.  

  ### Which Notion Is the "Real Article"?
  - **Truthlikeness (Verisimilitude) via Similarity-Based Approaches**: This is the overarching framework that subsumes repair-cost. Pioneered by Niiniluoto (1987) and Oddie (1986), it defines closeness as **minimal distance in a metricized state space**. For example:  
    - Bean jar: Distance is arithmetic difference.  
    - Orbits: Distance could be the difference in eccentricity (|0–0.0167| for circle vs. |1–0.0167| for parabola).  
    - Your repair-cost is an informal version of this—it quantifies "work" as distance in the parameter space.  
  - **Strengths**: It handles numerical and structural cases uniformly, avoids Popper's traps, and explains why "circle" is closer than "parabola" (smaller parametric shift).  
  - **Weaknesses**: It requires defining a context-specific metric, which can be ad hoc. It also struggles with incommensurability.  

  ### Verdict on Repair-Cost
  - **Established Name**: **NONE** (as a standalone term). It is an intuitive proxy for **similarity-based verisimilitude**, but not a formalized concept itself.  
  - **Nearest Established Notion**: **Similarity-based verisimilitude** (which must be distinguished from consequence-based verisimilitude, as they are incompatible solutions to Popper's problem).  

  ### Why Repair-Cost Isn't Enough
  Repair-cost captures a key insight—truthlikeness as transformational minimality—but needs refinement to handle overprecision. In your radius example, similarity-based verisimilitude resolves the tension:  
  - The claim "circle" has *low distance* in shape-space (eccentricity ≈0).  
  - Adding "radius=1 AU" adds a *separate parameter* with low distance (|1–0.98| AU is small) but increases *overall risk* because the combined claim (shape + size) has more ways to fail. Truthlikeness accounts for this by measuring distance in a joint parameter space (e.g., Euclidean distance between (eccentricity, radius) vectors), where errors compound. Thus, "circle with radius=1 AU" might be farther from truth than "circle" alone if radius-error is weighted—even if repair-cost is similar.  

  In short: Repair-cost is a pragmatic heuristic for similarity-based verisimilitude, which is the "real article" for handling your cases. It breaks when repairs are ambiguous, vocabularies clash, or claims are overprecise—but these are limitations of the broader framework, not unique to repair-cost.

  \answer{NONE | similarity-based verisimilitude}
