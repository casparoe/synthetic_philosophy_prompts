  ### Key Resolutions
  - **R2 vs. Sentience Uncertainty**: R2 is **compatible** with not presupposing sentience. It uses a precautionary standard ("minimize *potential* suffering"), avoiding ontological claims while demanding ethical caution.  
  - **R7 vs. Determinacy (R9)**: These conflict procedurally but can be sequenced (e.g., rapid technical assessment for R9, then participatory review for R7).  
  - **Most Exclusionary Requirement**: **R2** excludes the broadest range of views by forcing engagement with suffering without requiring sentience proof.  
  - **Radical Uncertainty**: R9 (determinacy) is a **preference**, not core; agencies must not use uncertainty to bypass R1–R8.  

  This framework provides a non-ideological foundation for agencies, publicly anchoring decisions in necessity, precaution, justice, and consequence-management.
