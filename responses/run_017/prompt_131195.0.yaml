  ### Ethics Framework Specification for Vector-Control and Crop-Protection Programs

  **Purpose**: To provide actionable, publicly defensible criteria for selecting interventions, without presupposing unresolved debates (e.g., insect sentience). The requirements below are derived from concrete operational dilemmas and must guide decisions among options like insecticide spraying, gene drives, or doing nothing.

  #### Requirements Table

  | Requirement (Imperative)                                                                                               | Motivating Case                                                                                                  | Status                                                                 | Excludes                                                                                              | Conflicts (IDs & Reason)                                                                                                                                 |
  |------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **R1**: Prioritize interventions based on necessity (severity of harm addressed) and proportionality (magnitude of countervailing benefit). | Asymmetry case: Malaria prevention (necessity) vs. cosmetic crop yields (disproportionate benefit).              | Non-negotiable                                                         | Views that solely maximize net utility without thresholds (e.g., crude cost-benefit).                | None.                                                                                                                                                   |
  | **R2**: Minimize potential suffering in control methods under a precautionary principle, regardless of sentience certainty. | Dying-time problem: Neurotoxins cause prolonged distress; uncertainty demands caution, not inaction.             | Non-negotiable                                                         | Views ignoring suffering due to sentience uncertainty (e.g., strict behaviorist or human-exceptionalist). | R9: Precaution (R2) may delay decisions under radical uncertainty (R9).                                                                                |
  | **R3**: Contextualize "pest" status as harm-to-specific-human-interests, not intrinsic disvalue.                      | Constitution worry: Caterpillars are pests in crops but neutral on verges; status depends on human activity.     | Non-negotiable                                                         | Views treating pests as universally undesirable (e.g., speciesist or purification ethics).           | None.                                                                                                                                                   |
  | **R4**: Favor sustainable solutions that avoid irreversible ecological or resistance lock-in.                          | Lock-in objection: Insecticides breed resistance, creating long-term dependency.                                 | Non-negotiable                                                         | Short-termist views (e.g., crisis-driven utilitarianism).                                            | None.                                                                                                                                                   |
  | **R5**: Set baselines for harm assessment using expected anthropogenic mortality, not natural mortality.               | Baseline problem: "They die anyway" dodges accountability; compare to undisturbed human-impacted populations.    | Non-negotiable                                                         | Views using natural mortality to justify anthropogenic harm (e.g., "harmless killing" arguments).     | None.                                                                                                                                                   |
  | **R6**: Treat population suppression (e.g., preventing births) as distinct from killing, requiring independent moral evaluation. | Suppression without killing: Sterile-insect releases or gene drives reduce future populations, not current lives. | Non-negotiable                                                         | Views equating suppression with killing (e.g., some rights-based) or ignoring it (e.g., death-focused). | None.                                                                                                                                                   |
  | **R7**: Ensure risk-bearers (e.g., farmworkers, downwind communities) participate in decisions affecting them.          | Risk-bearing and say: Beneficiaries (e.g., crop owners) rarely bear exposure risks; procedural legitimacy required. | Non-negotiable                                                         | Purely outcome-based views (e.g., utilitarianism without process).                                   | R9: Participatory processes (R7) may impede determinacy under uncertainty (R9).                                                                         |
  | **R8**: Restrict techniques to target species/contexts and include misuse safeguards.                                  | Migration: Insecticides for malaria mosquitos redeployed against benign insects in other regions.               | Non-negotiable                                                         | Views assuming neutral technology (e.g., instrumentalist optimism).                                  | None.                                                                                                                                                   |
  | **R9**: Yield determinate decisions under radical uncertainty (e.g., sentience, ecosystem cascades).                   | Coauthor's candidate: Agency paralysis when evidence is incomplete; distrusts "wait for certainty" approaches.   | Camp preference: Pragmatist/Operational camp                           | Views requiring impossible certainty (e.g., strong precautionary principle).                         | R2, R7: Determinacy (R9) may override suffering minimization (R2) or participation (R7).                                                               |

