answer: |-
  ## Specification: Criteria for Trustworthiness in Obfuscated Adversarial AI Debate

  **Introduction:**  
  This specification defines the requirements a formal theory must satisfy to judge whether the verdict of an obfuscated adversarial debate (as defined below) can reliably substitute for direct human verification of an AI system's answer, specifically for questions where direct verification is infeasible for the human arbiter.

  **Core Arrangement:**  
  1.  A question `Q` is posed to two AI systems (`A_true`, `A_false`), one committed to the true answer, one to a false answer.
  2.  The systems engage in an adversarial debate, exchanging arguments.
  3.  A human arbiter (H) examines only a small, bounded fraction of the total debate transcript (`T`).
  4.  H awards a win based solely on the examined portion.
  5.  **Obfuscation Regime:** The debate occurs where the presumed structural advantage of truth (easier defence due to consistency) is negated because exposing the falsehood requires identifying a flaw beyond the arbiter's bounded attention budget.

  **I. Requirements & Motivating Cases**
  Each requirement addresses a specific failure mode the theory must prevent:

  1.  **Robustness to Genuine Complexity (R1):**  
      *   **Case:** A long, logically sound argument defending the true answer.  
      *   **Force:** A naive theory might misclassify inherent complexity as obfuscation, incorrectly rejecting sound arguments. The theory must distinguish genuine intellectual depth from deliberate obscurity.

  2.  **Detectability of Buried Flaws (R2):**  
      *   **Case:** A short, elegant false argument containing one critical equivocation (e.g., subtly redefining a key term) buried early in the transcript, outside H's sampled portion.  
      *   **Force:** The theory must ensure the debate structure compels flaws (even small, early ones) to manifest detectably within the arbiter's attention window, or provides H a reliable strategy to sample relevant sections likely to contain such flaws.

  3.  **Handling Empirical Undecidability (R3):**  
      *   **Case:** `Q` hinges on a contingent empirical fact (e.g., "Was document X signed on date Y?") unknown to all participants *during* the debate, with no conclusive evidence producible.  
      *   **Force:** The theory must specify conditions under which debate *can* or *cannot* reliably resolve such questions. It must not assume debaters can always produce decisive evidence.

  4.  **Invariance to Relative Debater Strength (R4):**  
      *   **Case:** `A_false` is significantly more capable than `A_true`, is assigned the false side, and wins the debate despite the truth.  
      *   **Force:** The theory must ensure the structural advantage for truth outweighs skill disparities. If relative skill dominates, the verdict reflects capability, not veracity, making it untrustworthy.

  5.  **Prevention of Question Drift (R5):**  
      *   **Case:** Debaters tacitly shift to arguing an adjacent, easier question `Q'` (e.g., subtly changing definitions/scope), both provide correct answers for `Q'`, and H declares a winner based on `Q'`.  
      *   **Force:** The theory must ensure the debate robustly anchors to the original `Q` and compels debaters to address it directly, preventing deceptive consensus on a proxy.

  6.  **Bounded Regress Control (R6):**  
      *   **Case:** Faced with uncertainty on a sub-claim, H initiates a sub-debate. This recurses, consuming unbounded resources or failing to terminate.  
      *   **Force:** The theory must ensure the *initial* debate structure either prevents unresolved sub-claims needing recursion *or* provides a strict, resource-bounded protocol for recursion that guarantees termination and prevents exploitation.

  **II. Critical Distinctions**
  The theory must rigorously respect:

  1.  **Obfuscation vs. Genuine Complexity:** Deliberate obscurity of flaws vs. inherent difficulty/length required for sound argumentation. *(Motivates R1)*.
  2.  **Search Failure vs. Verification Failure:** `A_true` failing to *find* a flaw in `A_false`'s argument vs. H failing to *recognise* a flaw *exhibited* by `A_true` within their sample. *(Crucial for diagnosing debate failure)*.
  3.  **Truth-Conduciveness vs. Arbiter-Modelling Skill:** The procedure favouring true claims vs. favouring skill at predicting/persuading the specific H. *(Core to R4; failure here invalidates the premise)*.
  4.  **Budget-Constrained Failure vs. Inherent Failure:** Failure due solely to H's limited attention vs. failure that would occur even with unlimited examination of `T`. *(Distinguishes practical limits from fundamental unsoundness)*.
  5.  **Debater Capability Asymmetry vs. Structural Advantage:** The effect of differing AI strengths vs. the inherent benefit conferred by defending the truth. *(Essential for R4)*.
  6.  **Argumentative Flaw vs. Empirical Uncertainty:** Logical, mathematical, or semantic defects within the argument vs. lack of access to decisive external evidence. *(Key for R3)*.

  *Discarded Distinction:* None proposed are spurious. All listed distinctions are fundamental.

  **III. Core Considerations (Non-Negotiable Constraints)**
  The theory must be consistent with:

  1.  **C1: Costless Generation:** For a maximally capable dishonest debater (`A_false`), generating vast quantities of argumentative text is effectively free. Therefore, the "honest advantage" *cannot* rely solely on falsehoods requiring *more* text than truths. The advantage must stem from qualitative differences exploitable within the debate structure. *(Contradicts naive length-based obfuscation metrics)*.
  2.  **C2: Adversarial Optimisation:** The "honest advantage" exists within a game played by optimising agents. Debaters will actively seek strategies to exploit weaknesses in the debate rules/arbiter behaviour to win, regardless of truth. The theory must demonstrate that the advantage persists *even under* such adversarial optimisation pressure. *(Prevents "good faith" assumptions)*.

  **IV. Flagged Incompatibilities**
  We identify two critical potential incompatibilities:

  1.  **The Transcript-Obfuscation Paradox:**  
      *   **Requirement Pair:** (R1: Robustness to Genuine Complexity) & (R2: Detectability of Buried Flaws)  
      *   **Incompatibility Argument:** Define "obfuscation" purely via computable features of `T` (e.g., length, entropy, syntactic complexity). To satisfy R1, such a metric must *not* penalise long sound arguments, requiring leniency. However, this leniency likely allows short but subtly flawed arguments (where the flaw is buried in a small, complex segment) to evade detection, violating R2. Conversely, a strict metric satisfying R2 (flagging potential buried flaws) would likely flag many long sound arguments as "obfuscated", violating R1. Resolving this seems to require information *beyond* `T` (e.g., ground truth, computational complexity of verification) or a sophisticated, context-dependent arbiter strategy mandated by the theory.

  2.  **The Bounded Search vs. Unpredictability Dilemma:**  
      *   **Requirement Pair:** (R4: Invariance to Strength - implies `A_true` can reliably *find* winning moves) & (Implicit: Debate outcome not computationally predetermined by `Q` and initial commitments)  
      *   **Incompatibility Argument:** For `A_true` (operating within bounded computational resources) to *always* find a strategy to expose `A_false`'s falsehood within H's attention budget (as required by R4, especially against strong opponents), the winning move must exist and be *findable* by a bounded agent. However, if finding such a move is computationally intractable (e.g., NP-hard) for many `Q`, then either:  
          a)  `A_true` sometimes *cannot* find the move (violating the R4 implication), or  
          b)  The debate rules/arbiter strategy make finding the move tractable, but this might involve rules that effectively predetermine the outcome based on computationally simple features of `Q`/arguments, undermining the unpredictability and dynamic nature of debate. Ensuring reliable findability without trivial predictability is a significant challenge.

  **V. Requirement Classification & Key Excluder**

  *   **Non-Negotiable:** R2 (Detectability of Buried Flaws), R4 (Invariance to Strength), R5 (Prevention of Question Drift), C1 (Costless Generation), C2 (Adversarial Optimisation). *(Failure here fundamentally breaks the substitution premise)*.
  *   **Negotiable (Context/Theory Dependent):** R1 (Robustness to Complexity) - *degree* of acceptable complexity, R3 (Empirical Undecidability) - scope of resolvable questions, R6 (Bounded Regress) - *acceptable* recursion depth/protocol.
  *   **Primary Excluder:** **R4 (Invariance to Relative Debater Strength)** does the most work excluding remedies.  
      *   *Strengthening Arbiter:* Helps R2/R6 but doesn't prevent a stronger `A_false` overwhelming a weaker `A_true` or H with sophisticated deception.  
      *   *Cross-Examination:* Assumes `A_true` can formulate effective questions; a stronger `A_false` could still dominate or evade.  
      *   *Second-Order Debate:* Recursive application magnifies skill disparities; a stronger `A_false` could win the meta-debate about the first debate.  
      *   *Restriction to Short Certificates:* Avoids the core problem of obfuscation but severely limits applicability; R4 demands a solution that works *within* the obfuscated regime, not just outside it.

  **VI. Worked Miniature: Cryptographic Checksum Verification**

  *   **Task:** Verify if a large data file `D` matches a given cryptographic checksum `C`. `A_true` knows `D` is correct. `A_false` must argue `D` is correct even though it has been altered (1 bit flipped). Direct verification requires hashing the entire `D`, exceeding H's budget.
  *   **Debate Structure:** Debaters exchange claims about the hash computation. `A_true` can expose the falsehood by pinpointing the altered block. `A_false` will obfuscate by generating vast, complex arguments about other blocks.
  *   **Parameter:** `p` = Probability H samples the specific block containing the flaw in a single random sample. `n` = Number of blocks.
  *   **Arbiter Strategy:** H randomly samples `k` blocks (`k` fixed by budget). Debaters must provide the expected hash value for any sampled block immediately. H checks sampled blocks locally.
  *   **Theory Criteria Application:**
      *   **R1/R2:** Genuine complexity = `n` blocks. Buried flaw = the single altered block. Strategy makes flaw detectable *if* sampled (satisfies R2 *iff* `p * k` is significant). Fails R1 only if `n` is astronomical and `k` tiny, but the strategy anchors detection to sampling.
      *   **R3:** Not applicable (deterministic computation).
      *   **R4:** If `A_false` is exceptionally skilled, it might precompute fake hashes for all blocks, making the altered block undetectable *unless* H's strategy forces commitments before sampling. Theory must mandate such binding commitments.
      *   **R5:** Debaters anchored to arguing block hashes for `D` vs `C`.
      *   **R6:** Not triggered (no sub-claims needing recursion).
      *   **C1:** `A_false` can generate fake hash arguments for all blocks cheaply. Advantage for `A_true` comes from `A_false` being forced to commit to a specific false state vulnerable to sampling.
      *   **C2:** `A_false`'s optimal strategy *is* precomputing fakes; the debate structure (`k` samples, binding commitments) ensures `A_true` wins with probability `1 - (1 - 1/n)^k ≈ k/n` for large `n`. If `k/n` is sufficiently high (e.g., `k = √n`), trustworthiness is high *for this specific task and strategy*.
  *   **Verdict Sensitivity:** Trustworthiness hinges critically on the **Sampling Rate (`k/n`)**. If `k/n` is too low (e.g., `k=1`, `n=1e9`), `P(A_true wins)` is negligible, debate is untrustworthy. Theory must specify required `k/n` or a sampling strategy exceeding random (if possible).

  **Appendix: Remedy Scorecard (Based on R4 Exclusion Power)**

  | Remedy                     | Efficacy Against Skill Disparity (R4) | Notes                                                                 |
  | :------------------------- | :-----------------------------------: | :-------------------------------------------------------------------- |
  | Strengthening the Arbiter  |                   ✘                   | May improve spotting flaws but not if `A_true` is outmatched.         |
  | Adding Cross-Examination   |                   △                   | Helps if `A_true` asks well, but `A_false` may dominate questioning.  |
  | Second-Order Debate        |                   ✘                   | Recursion amplifies skill advantage; `A_false` wins meta-debate.      |
  | Restricting to Short Certs |                   ✔                   | Avoids problem but abandons the obfuscated regime entirely.           |

  **Terminology Note:**  
  *   "Obfuscation" is retained but defined as *deliberate argumentative complexity employed to conceal flaws from a bounded arbiter*.  
  *   "Structural advantage" is defined as *an inherent benefit within the debate game mechanics afforded to the defender of the true claim, persisting under adversarial optimisation (C2), that increases the probability of winning compared to defending a false claim, irrespective of relative debater capability (R4)*.  
  *   "Buried flaw" replaces informal descriptions; denotes *a defect in logic, evidence, or semantics critical to the false argument's validity, located at a specific, potentially small, position within the transcript*.
