  **(Speech - Approx. 8 minutes)**

  Good morning. Thank you all for coming out on this crisp October morning to this place Dad loved so much. It feels right to be here, surrounded by the prairie he helped bring back, the wind moving through the grasses he knew by name. It’s simple, like he’d have wanted.

  When Dad thought about moments like this, about death, he turned to the ancient Chinese text he spent his life studying, the Zhuangzi. But he’d be the first to tell you – probably loudly, over dinner – that most people get it wrong. He didn’t find comfort in the idea of dissolving into some grand, mystical cosmic whole. That, he argued, was a misunderstanding, sometimes a comforting one, but not what the text actually says.

  His reading was… starker. More literal. More curious. He saw it pointing to the raw, physical transformation: the body becoming soil, becoming part of the ants, becoming nourishment for the crows. He loved that story where someone says they wouldn’t mind being left out for the birds and insects – not because it was noble, but because it was honest about the process. It’s happening right here, under our feet, all the time. Life feeding life in a constant, messy exchange. Dad wasn’t looking for a soul returning to a source; he was looking at the dirt, the bugs, the roots.

  And he thought the real point of all that talk about transformation wasn’t to give us a nice answer about an afterlife, but to shake loose our tight grip on the idea of a fixed, separate “me.” If the boundaries between self and not-self are always shifting, always part of this flow of matter and energy, then the question “What happens to *me*?” starts to unravel. There’s no single, stable answer that could truly console that small, scared sense of self we cling to. It’s not about finding peace for that "me," but about seeing how that "me" isn't quite the solid thing we imagine.

  So, Dad wasn’t chasing serenity about death. He thought that missed the mark. What he found in the Zhuangzi, what resonated with him deeply, was *curiosity*. Curiosity about the sheer weirdness and wonder of this transformation. Why else would he spend twenty years here, learning every grass, tracking every bird? He was fascinated by the processes, the changes, the sheer improbability of it all. He thought the Zhuangzi was one of the funniest books ever written precisely because it tackles this biggest, scariest thing with such absurdity and irreverence. He’d chuckle at the image of someone worrying about the afterlife while sitting on a mushroom. It’s absurd! And that absurdity, that refusal to take our own dread entirely seriously, was part of his own response.

  That’s why I can’t stand here and tell you he’s at peace now, or that he’s returned to some source, or that he’s watching over us. He thought sentences like that said more about what the living desperately need to hear than anything true about the dead. And I won’t turn him into a tidy lesson about death being natural like the seasons, either. That feels like using him, and it wouldn’t be fair – not to him, not to you.

  So, what can I honestly say about Dad, here, now? That he was fiercely curious. That he loved the particular, tangible stuff of this world – the texture of prairie dropseed, the call of a meadowlark, the intricate chaos of an ant colony working on a fallen log. That he found deep meaning not in escaping the cycle of transformation, but in paying close attention to it, right down to the beetles in the soil. That he saw the humour in the human predicament, even this ultimate one.

  He believed the best response to loss wasn't necessarily feeling a certain way, but *doing* a certain thing: paying attention. Really looking. So, in his spirit, rather than asking you to feel comforted or serene, I’d like to suggest something simple. After we scatter his ashes here among the grasses he nurtured, take a few minutes. Walk out onto the prairie path. Stop. Look closely. Find one specific, living thing. A particular clump of big bluestem bending in the wind. A grasshopper clinging to a stem. The flash of a goldfinch. See it. Not as a symbol, but as Dad would have: as a piece of this ongoing, astonishing, and yes, sometimes absurd, transformation he’s now part of.

  Thank you for being here for him, and for each other.

