  Below is a complete, runnable activity designed for your library group, centered on the gavagai puzzle. It avoids technical language until the debrief and ensures participants experience the core insight—that unlimited evidence fails to fix meaning—through firsthand struggle. The design handles your constraints: paper, index cards, a whiteboard, and no homework.

  ---

  ### **Session Structure**  
  **Total Time:** 115 minutes  
  - Setup & Introduction (10 min)  
  - Activity Rounds (70 min)  
  - Commitment & Scoring (15 min)  
  - Debrief (20 min)  

  ---

  ### **Setup & Materials**  
  - **Volunteer "Speaker":** Secretly assign one participant as the speaker of a fictional language. Give them a **rule card** (below).  
  - **Rule Card for Speaker:**  
    - *"You answer questions based on one of these rules (assigned secretly by facilitator):*  
      - **Rule 1 (Rabbit):** Use *gavagai* only for **whole rabbits** (alive, intact).  
      - **Rule 2 (Parts):** Use *gavagai* for **undetached rabbit parts** (e.g., ears, legs—but only if attached).  
      - **Rule 3 (Stages):** Use *gavagai* for **rabbit stages** (e.g., "this momentary rabbit-slice").*  
    - *Always answer consistently with your rule. For non-rabbit things, say nothing or use other words.*"  
  - **Materials:**  
    - Index cards with simple drawings (rabbits, rabbit parts, non-rabbits).  
    - Whiteboard for group notes and manual drafts.  
    - Paper for translation manuals.  
    - Timer.  

  ---

  ### **Activity Flow**  
  #### **Round 1: Basic Observation (15 min)**  
  - **Goal:** Gather initial data to build a translation manual.  
  - **Steps:**  
    1. Show 10–12 index cards with images:  
       - Whole rabbits (5 cards: e.g., hopping, sitting).  
       - Rabbit parts (3 cards: e.g., ear, leg—attached to a visible rabbit).  
       - Non-rabbits (2–4 cards: e.g., squirrel, rock, carrot).  
    2. For each card, the speaker says:  
       - *Gavagai* if the image matches their rule.  
       - Another nonsense word (e.g., *blicket*) for non-rabbits.  
    3. Group records responses on the whiteboard (e.g., "Rabbit hopping → gavagai").  
  - **Predictable Outcome:**  
    - All rules produce identical responses here (since parts/stages imply a rabbit is present).  
    - Group likely drafts Manual V1: *"Gavagai = rabbit"*.  

  #### **Round 2: Unlimited Questioning (30 min)**  
  - **Goal:** Test if more questions resolve ambiguity. Spoiler: they won’t.  
  - **Rules:**  
    - Participants ask **any question** via pointing, drawing, or acting (no English).  
    - Speaker answers based solely on their rule (e.g., nods/shakes for yes/no, points, or uses words like *gavagai*/*blicket*).  
  - **Key Question Types & Speaker Responses:**  
    | **Question** | **Rule 1 (Rabbit)** | **Rule 2 (Parts)** | **Rule 3 (Stages)** |  
    |--------------|---------------------|--------------------|---------------------|  
    | Point to a rabbit ear → *"Gavagai?"* | Shake no (it’s a part) | Nod yes (undetached part) | Shake no (not a stage) |  
    | Point to a dead rabbit → *"Gavagai?"* | Shake no (not alive) | Nod yes (parts still attached) | Nod yes (it’s a stage) |  
    | Point to a moving rabbit → *"Same gavagai?"* (after 5 sec) | Nod yes (same rabbit) | Shake no (parts changed) | Shake no (new stage) |  
    | Point to a scattered rabbit (head here, tail there) → *"Gavagai?"* | Shake no (not whole) | Nod yes (undetached parts) | Nod yes (stage of scattered rabbit) |  
  - **Facilitator Notes:**  
    - The speaker’s answers will **contradict the group’s Manual V1** (e.g., "Why is an ear *gavagai*?").  
    - Groups often split: some think *gavagai* = whole rabbit, others think it = parts/stages.  
    - **Critical:** Ensure no rule is empirically "better"—all fit the data perfectly long-term.  

  #### **Round 3: Manual Drafting (25 min)**  
  - **Goal:** Formalize competing manuals.  
  - **Steps:**  
    1. Split group into 3 teams. Each drafts a translation manual:  
       - Team 1: *Gavagai* = whole rabbits.  
       - Team 2: *Gavagai* = undetached rabbit parts.  
       - Team 3: *Gavagai* = rabbit stages.  
    2. Teams test manuals against Round 2 data on whiteboard.  
    3. Speaker answers 5 new questions (e.g., "Is this half-eaten carrot *gavagai*?"). All manuals predict the same answers.  

  ---

  ### **Commitment & Scoring (15 min)**  
  - **Stakes:** Groups bet points on their manual being "correct."  
  - **Rules:**  
    1. Each team writes their manual on paper and commits in writing (e.g., *"We bet 10 points on Manual 2"*).  
    2. Facilitator reveals: **No rule is "true."** The speaker followed one rule, but all manuals fit all evidence forever.  
    3. Scoring:  
       - All teams win 10 points if their manual fits the speaker’s answers.  
       - Result: All win. No manual is falsifiable.  
  - **Why this works:**  
    - Participants *feel* the frustration of having to choose with no decisive criteria.  
    - The bet makes the indeterminacy visceral (e.g., "Wait, we all win? But that means...").  

  ---

  ### **Debrief (20 min)**  
  **Goal:** Connect the activity to Quine’s indeterminacy of meaning.  

  #### **Key Moments to Reference**  
  1. **"Why couldn’t more questions solve it?"**  
     - Point to Round 2: Even with unlimited queries, the speaker’s answers fit multiple rules.  
     - Quine’s insight: Meaning isn’t fixed by behavior. Data underdetermines translation.  

  2. **"Is there a ‘real’ meaning?"**  
     - Highlight the bet: All manuals were "correct" despite conflicting ontologies (rabbits vs. parts vs. stages).  
     - Quine: No fact of the matter beyond observable use.  

  3. **"What about the speaker’s intentions?"**  
     - Note: Participants who demanded this (e.g., "Just ask what they *mean*!") hit a wall. The speaker’s rule was arbitrary—no "true" meaning exists to uncover.  

  4. **Turning it back on English:**  
     - "When you say ‘rabbit,’ what makes it about a whole object and not parts? Could a Martian linguist translate it as ‘undetached rabbit part’?"  
     - This shifts from exotic languages to home turf: **All language is indeterminate**.  

  #### **Handling Predictable Issues**  
  - **"This is just skepticism about other minds!"**  
    - Clarify: Skepticism doubts we know others’ minds. Indeterminacy says there’s **nothing to know** beyond behavior. Use the bet: "Did you doubt the speaker existed, or that meaning was fixed?"  
  - **Participant trying to "game" rules:**  
    - E.g., Asking abstract questions ("Is *gavagai* abstract or concrete?").  
    - Solution: Speaker answers based on their rule (e.g., Rule 2: parts are concrete). All manuals still fit.  
  - **Demanding inner intentions:**  
    - Redirect: "How could you test that with behavior? What question would force the speaker to reveal ‘inner’ meaning?" (Spoiler: None).  

  #### **What the Activity Can’t Generate**  
  - **The Web of Belief:** You’ll need to explain that meaning depends on a whole network of words/beliefs. Say:  
    > "Quine argued that *gavagai* could mean ‘rabbit stage’ if we adjust other words (e.g., redefining ‘same’). Meaning is holistic—no word is fixed alone. Our activity simplified this, but the struggle you felt is the point: no manual is uniquely ‘right’."  

  - **Why Indeterminacy Matters:**  
    - "This isn’t about field linguistics. It challenges whether meaning is ‘in our heads’ at all. If two manuals fit all behavior, there’s no fact of the matter—even for English."  

  #### **Closing**  
  - End with a question: "If meaning isn’t in your head or the world, where *is* it? In use? In community agreement?" (No need to answer—leave them pondering).  

  ---

  ### **Facilitator Cheat Sheet**  
  - **Beforehand:** Assign speaker their rule secretly. Test edge cases (e.g., dead/scattered rabbits).  
  - **During Rounds:**  
    - Gently reinforce speaker consistency (e.g., "Remember your rule!").  
    - If groups stall, suggest: "Try asking about parts vs. wholes" or "Ask if a moving rabbit is ‘the same’."  
  - **In Debrief:** Use whiteboard to contrast manuals (e.g., "Team 1 said X, Team 2 said Y—both fit").  
  - **Ethos:** Stay neutral. Say, "I won’t resolve this—philosophers still debate it!"  

  This design ensures participants *experience* indeterminacy through confusion, debate, and the unsatisfying "win" of the bet. By the debrief, "indeterminacy" isn’t jargon—it’s the puzzle they lived.
