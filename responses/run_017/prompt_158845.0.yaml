          - They also have the concept of a rabbit for Manual 2: a series of rabbit-stages that are connected (e.g., by being stages of the same enduring rabbit).

          The two words:
          - "gavagai": 
               Manual 1: said when a rabbit is present.
               Manual 2: said when a rabbit-stage is present.
          - "hoo":
               Manual 1: said when two things are numerically identical.
               Manual 2: said when two rabbit-stages belong to the same rabbit.

          But note: Manual 2's "hoo" is only defined for rabbit-stages. What if the group points to two non-rabbit things and asks if they are hoo? We can have the speaker not have opinions on non-rabbits. Or, we can say that "hoo" in Manual 1 is for any identity, but in Manual 2 it is only for rabbit-stages. So if the group points to two squirrel-stages, Manual 2 might not have an answer. We can avoid that by only allowing questions about rabbits.

          How the activity will go:

          - In Round 1, the speaker is shown pictures of rabbits and says "gavagai" for each. 
          - In Round 2, the group can ask about identity. For example, they might take two pictures of the same rabbit and ask: "hoo?" -> both manuals: yes.
            - They might take two pictures of different rabbits: "hoo?" -> both: no.
            - They might take two pictures of the same rabbit at the same time from different angles? Manual 1: numerical identity -> one rabbit, so yes. Manual 2: two rabbit-stages of the same rabbit -> yes.

          - The group might try to ask about a rabbit and a non-rabbit. The speaker can be taught to say "not gavagai" for non-rabbits, and then if asked "hoo" between a rabbit and a non-rabbit, both manuals would say no.

          - The group cannot find a question that distinguishes the manuals.

          - Then, we move to the commitment part.

          Commitment round (15 minutes):
          - Split the group into two teams. Each team must write down a full translation manual for the two words on index cards. They have to inlcude:
               Manual Team A: 
                   "gavagai" means rabbit
                   "hoo" means numerical identity
               Manual Team B:
                   "gavagai" means rabbit-stage
                   "hoo" means same rabbit ( for stages)

          - Then, they have to use their manual to translate new examples provided by the speaker. The speaker will provide new sentences (e.g., pointing to a rabbit and saying "gavagai", or pointing to two pictures and saying "hoo"). Both manuals will give the same translation.

          - The facilitator reveals that the speaker was using one manual (say Manual 1), but both manuals work equally well for all evidence past, present, and future.

          - The score: each team gets a point for every example they translate correctly. But both will get all points.

          - Then, we discuss.

          Debrief (15 minutes):
          - Reveal that this is the gavagai puzzle, and it shows the indeterminacy of translation.
          - Connect to English: how do we know that when we say "rabbit" we mean a whole enduring object and not a stage? Is there a fact of the matter? The activity suggests that even for our own language, the meaning is in the web of beliefs and not in the world directly.
          - Address potential issues:
               - The participant who demands the speaker's inner intentions: Explain that in radical translation, we have no access to intentions. We only have behavior.
               - The one who says it's other minds skepticism: This is different because it's about meaning, not about whether the mind exists.
               - The one who tries to game the rules: If someone asks a question that we haven't defined, the facilitator can help the speaker answer consistently with one manual or the other, or rule the question out if it's not expressible.

          - What the activity cannot generate: The activity shows underdetermination, but it doesn't show that there is no fact of the matter. That leap will have to be explained. Quine's point is that there is no fact of the matter beyond what is in the manual. We have to state that explicitly.

          Given the time, let's write the activity in detail.
