prompt: |-
  I moderate a large hobbyist forum, and over some years I have noticed a recurring shape in the claims and practices that spread through it, for which I can find no word. It is not that they are false, or vivid, or useful. It is something about how they handle being checked.

  Three instances, invented but typical. A warning circulates about a faulty batch of a component, and it travels from the start with a rider: that anyone who asks to see the measurements is advertising that he does not care whether people get hurt. The warning may well be true; that is not the point. What travels with it is a clause that makes the act of checking expensive, and the cost falls on the checker rather than on the believer. Second: a practice spreads through a volunteer organisation of never writing decisions down, carried along by the remark that wanting them written down is itself the trouble. Third: a conversation-stopper — only someone who has never had to do this would ask that. Nothing is said about the question. The questioner is simply priced out.

  I have read a little of the popular Darwinian literature about ideas spreading the way genes do, and I do not think the mechanisms usually listed are doing the work here. The parasite or mind-virus picture does not fit either: nothing is being hijacked, the ordinary channels of transmission work perfectly well, and what distinguishes these variants concerns scrutiny rather than copying.

  Two further observations, which may or may not mark real distinctions. In the cases I care about the shield is rarely part of the variant's own content; it is borrowed from a norm that was already in place, so the variant is protected by something it did not have to carry. And the protected element is usually attached to a package that is independently worth passing on, so it may be riding along rather than being selected for.

  My questions. Is there an established concept for selection on this property — the property of making oneself costly or impossible to check — as a mechanism distinguishable from the familiar biases of content, prestige and conformity? Is Darwinian machinery the right machinery here at all, or is selection the wrong word for what is going on? And where does the boundary lie between a clause that shields a claim from scrutiny and one that legitimately specifies what checking a claim of that kind would involve — a specification that any serious framework of inquiry has to make? The distinction is not that the claim is unfalsifiable in principle: the measurements might exist. It is that the route to them has been socially closed.

  If there is no established term, coin one, define it tightly, and give me cases that fall in and out. If there is one, tell me where my description fits and where it does not. A name by itself is of no use to me. I have to write moderation policy, and a rule against unverified claims would catch whistleblowing along with everything else, so I need the carving rather than the label — and I would rather you flagged the places where the classification is genuinely contested than smoothed them over.
reasoning: |-
  Okay, let me try to unpack this user's query. They're a forum moderator dealing with recurring patterns in claims that spread through their community. The key issue isn't the truth or usefulness of these claims, but how they make verification socially costly. The user provides three examples: a component warning that shames requesters for evidence, a practice of not documenting decisions by framing documentation as problematic, and conversation-stoppers that disqualify questioners based on identity.

  Hmm, the user has clearly thought deeply about this. They've even explored evolutionary metaphors but find existing frameworks inadequate. Their frustration with moderation tools is palpable - they need something more precise than just banning "unverified claims" since that would stifle legitimate whistleblowing. 

  The core challenge seems to be distinguishing between:
  1) Legitimate epistemic boundaries (e.g., "peer review requires these qualifications")
  2) Socially weaponized verification-blocking (e.g., "only heartless people ask for data")

  I recall similar concepts across different fields. In epistemology, there's "epistemic closure" but that's more about philosophical systems. Sociology has "accountability avoidance" which fits well. The immunizing strategy concept from philosophy of science also resonates - Lakatos discussed how theories protect their cores. 

  Wait, but the user specifically notes the "shield" isn't always part of the claim itself - it borrows existing norms. That's crucial. This makes it different from straightforward ad hominem attacks. The social enforcement aspect reminds me of Goffman's face-work - the cost is about social standing, not just logical rebuttal.

  For moderation, we'd need operational markers:
  - Does the barrier target the person rather than the claim?
  - Is verification framed as morally suspect?
  - Does the cost fall asymmetrically?
  - Is the shielding mechanism portable across contexts?

  The boundary cases would be tricky. Like when a PTSD support group says "only survivors can understand" - that's legitimate context-setting, not verification-blocking. Whereas "only real engineers ask for specs" in a hobbyist forum is abusive.

  User's clearly analytical - they'll appreciate the taxonomy approach. Should emphasize the social enforcement mechanism as the differentiator. Practical test: "Would providing evidence actually resolve the dispute, or just trigger social penalties?" 

  Also important to flag that sometimes these mechanisms start as legitimate protections but get weaponized. That gray zone is where moderation gets hardest...
answer: |-
  You've identified a sophisticated social-epistemic phenomenon that transcends simple falsehood or bias. While no single established term captures its full complexity, the core mechanism is **Epistemic Shielded Propagation (ESP)**. Below is a tight conceptual carving, boundary cases, and distinctions from existing frameworks.

  ---

  ### **Core Definition: Epistemic Shielded Propagation (ESP)**
  *An idea, practice, or claim that spreads by co-opting existing social norms to impose asymmetric costs on verification attempts. The shield:*
  1. **Socially penalizes scrutiny** (not just ignores it),
  2. **Derives from pre-existing norms** (e.g., trust, loyalty, identity),
  3. **Imposes costs primarily on the scrutinizer** (reputation, access, labor),
  4. **Is portable** (attachable to otherwise valuable content).

  ---

  ### **Key Mechanisms vs. Existing Concepts**
  | **Concept**             | **Why ESP is Distinct**                                                                 |
  |-------------------------|-----------------------------------------------------------------------------------------|
  | **Memetic Immunity**    | Not about evolving defenses; ESP borrows static social norms as pre-fabricated armor.   |
  | **Ad Hominem Fallacy**  | ESP weaponizes the *act of questioning itself* as socially transgressive, not just attacking the questioner. |
  | **Falsifiability**      | The claim may *be* falsifiable, but the *social pathway* to falsification is barred.    |
  | **Taboo Enforcement**   | ESP lacks intrinsic sacredness; it parasitizes functional norms (e.g., "trust experts"). |
  | **Conformity Bias**     | Conformity is a *tool* here, not the driver. ESP *exploits* conformity to block dissent. |

  ---

  ### **Boundary: Shielded vs. Legitimate Verification Protocols**
  The line hinges on **cost distribution** and **norm function**:

  | **ESP (Illegitimate Shield)**                     | **Legitimate Verification Protocol**                 |
  |---------------------------------------------------|------------------------------------------------------|
  | Costs of verification fall disproportionately on scrutinizer | Costs distributed fairly (e.g., peer review burdens all) |
  | Borrows/abuses norms *unrelated* to the claim (e.g., "questioning = disloyalty") | Uses norms *inherent* to the claim's domain (e.g., "clinical trials require IRB approval") |
  | Shield serves no epistemic function beyond obstruction | Protocol ensures rigor/reliability (e.g., data anonymization) |
  | **Test:** Removing the shield doesn’t invalidate the claim | **Test:** Protocol is necessary for valid evaluation |

  **Example:**  
  - *ESP:* "Asking for safety test data proves you value profits over lives."  
    (Abuses pre-existing "pro-safety" norm to block scrutiny)  
  - *Legitimate:* "Safety claims require ISO 17025-certified lab reports."  
    (Specifies domain-appropriate verification standard)  

  ---

  ### **Operational Markers for Moderation**
  Flag content when **all** are present:  
  1. **Asymmetric Cost Imposition**: Verification attempt triggers social/moral penalty *for the questioner*.  
  2. **Norm Hijacking**: Penalty derives from a virtuous norm (safety, empathy, efficiency) repurposed as a shield.  
  3. **Portability**: The shield attaches to an independently plausible/useful claim.  
  4. **Non-Inherency**: The shield isn't logically required to evaluate the claim (e.g., data exists but is withheld via shaming).  

  ---

  ### **Case Classification**
  | **Included in ESP**                              | **Excluded**                                        | **Contested Boundary**                          |
  |--------------------------------------------------|-----------------------------------------------------|------------------------------------------------|
  | "Only a corporate spy would demand our source code." | "You can't verify quantum decoherence without a lab." | "Survivors of trauma don’t owe you proof."     |
  | "True artists feel this; measurements kill soul." | "Audit requires 30 days per financial regulations."  | "Trade secrets protect this formula (vs. safety claim)." |
  | "Veterans know war; academics just theorize."    | "Methodology details in supplementary materials."    | "Indigenous knowledge requires oral transmission." |

  **Contested Cases Note**: Legitimacy hinges on whether the shield preserves necessary context (e.g., trauma narratives dissolve under adversarial scrutiny) or arbitrarily blocks scrutiny (e.g., trade secrets invoked to hide safety flaws). **Moderation test**: Does the barrier *protect meaning* or *prevent accountability*?

  ---

  ### **Why "Darwinian" Frameworks Fail Here**
  - **Selection isn't on truth/fitness**: ESP thrives on **lowering host defenses**, not outcompeting rivals.  
  - **No "parasite"**: The shield uses the host's immune system (norms) as camouflage.  
  - **Rides on value**: The attached claim/practice is often beneficial (e.g., safety warning), so ESP avoids negative selection.  

  ---

  ### **Moderation Strategy**
  1. **Rule Template**:  
     *"Claims that penalize good-faith verification attempts by invoking moral/social norms unrelated to evidence standards may be removed. Burden of proof must align with claim gravity, not weaponize virtue."*  
     
  2. **Process**:  
     - Ignore the *claim*; audit the *shield mechanism*.  
     - Ask: *"Could someone reasonably provide evidence without facing disproportionate social cost?"*  
     - Preserve whistleblowing: Focus on *how* scrutiny is blocked, not claim veracity.

  3. **Gray-Zone Handling**:  
     - Require clear cost-asymmetry evidence (e.g., "Asking for proof gets you banned").  
     - Permit domain-specific norms (e.g., "Oral histories in cultural preservation").  

  This carves the phenomenon at its epistemic joints, separating social weaponization from rigorous inquiry. The power lies in naming the *mechanism*, not the claim.
