prompt: |-
  I teach the final session of a graduate reading group on morality and nonhuman animals: 16 participants — mostly first- and second-year philosophy students, plus two visitors from biology — one 100-minute meeting, no internet access in the room. We have already worked through the argument from marginal cases, the epistemic problem of other minds, and the vertebrate-biased welfare literature. What I want from this last session is for people to *feel* the force of the scale argument about insects — that an astronomically large number of candidate individuals can swamp even a very low probability that any of them is sentient — rather than to hear me assert it and then discuss it.

  Please design a runnable activity for that session. My intended frame: participants serve as a small funding committee with a fixed budget, deciding how to divide it between an intervention whose case rests on insects and one whose case rests on vertebrates. The department will actually transfer a trivial sum — say 100 units of local currency — according to the committee's decision, so the choice is not purely hypothetical, though nothing else of consequence rides on it. There should be no lecture, definition, or literature summary up front; the ideas should reach participants through what they have to do. Please do not cite or recommend any readings: I already have the syllabus.

  Arrange the roles, rules, staged information, and payoffs so that participants collide with the following five complications on their own. The expressions 'expected value', 'fan-out', 'scaling exponent', 'replacement', and 'proxy transfer' should not be spoken until the debrief.

  1. **Fan-out rather than diversification.** Uncertainty about insect sentience is not spread across individuals; it is very nearly one bet. An enormous number of insects multiplied by a small probability is not a near-certainty of a large amount of welfare — it is a single coin flip with an enormous upside. Two allocations can share an expected value and differ completely in how that value is distributed across outcomes, and I want participants to feel that difference in their gut before anyone names it.

  2. **A hidden scaling exponent.** Suppose a creature's welfare capacity scales with its neuron count as n raised to some power α, where α is unknown: α = 0 for a threshold or any-mind view, α = 1 for a linear view, 0 < α < 1 for steeply diminishing returns, and possibly something other than neuron count doing the work. The comparison between very many very small nervous systems and few large ones flips depending on α, and nobody in the room knows α. The activity should make allocation decisions sensitive to α without ever letting participants settle it.

  3. **Replacement.** If insect populations are limited by resources rather than by deaths, then averting insect deaths may barely reduce the number of insects that ever live: prevented deaths make room for replacements. The headline number of individuals affected can therefore be enormous while the counterfactual difference is near zero. For farmed vertebrates the population is created by demand, so the counterfactual has a different structure altogether. I want participants to discover that "number of individuals helped" and "difference made" can come apart, and to discover it by being shown the mechanism rather than being told.

  4. **Proxy transfer.** Our evidence for sentience — flexible trade-off behaviour, learned avoidance, analgesic modulation, and the like — was calibrated on vertebrates. Applying it to insects assumes the link from proxy to sentience transfers across an enormous phylogenetic distance, which is a reference-class or base-rate problem rather than a simple evidential gap. Give participants evidence packets that look strong in isolation and let them notice that the strength depends on a transfer assumption they cannot check.

  5. **Cheapness is ambiguous.** Insect-directed interventions are cheap per individual affected, and that cheapness is what makes the scale argument bite. But cheapness is also some evidence about what is being measured, and about neglectedness rather than about welfare. Participants should be able to feel the pull of "the numbers are bigger" and also feel, later, that the cheapness was doing part of the work that the sentience probability was supposed to do.

  Practical constraints: stipulate every empirical figure yourself as an order of magnitude and hand it to participants as given — I do not want the session spent arguing about real entomology, neuron counts, or population estimates, and I do not want anything to depend on their being accurate. Supply a lookup table or pre-computed cards so that nobody stalls on arithmetic. Assign role cards carrying different prior credences about insect sentience, so that the committee contains both people who take insect sentience to be near-certain and people who take it to be near-zero, and require the committee to produce a single allocation (with provision for a recorded dissent that the scoring still tracks). No one should be able to sit out: every participant must make at least one binding choice. Assume no one present has any decision-theoretic training beyond the obvious.

  Structure your response in exactly these sections, in this order, with roughly the lengths indicated:

  - **Setup and materials** — about 150 words
  - **Roles, rules, and staged information** — about 450 words
  - **Scoring and stakes** — about 150 words
  - **Timeline** — about 200 words, with checkpoints across the 100 minutes
  - **What participants should run into, and when** — about 250 words
  - **Debrief** — about 500 words, mapping specific moments in the activity onto each of the five complications above, and onto the scale argument itself
  - **What will go wrong the first time I run it** — about 250 words, with how to handle each failure
  - **What the activity cannot deliver** — about 150 words, on which feature of the scale argument you, as facilitator, must simply state
reasoning: |-
  We are designing an activity for a 100-minute session with 16 participants. The goal is for participants to *feel* the force of the scale argument regarding insects, especially in comparison to vertebrate interventions. The frame is a funding committee deciding how to split a fixed budget between an insect intervention and a vertebrate intervention. The department will actually transfer a trivial sum (100 units) based on the committee's decision. The activity must avoid upfront lecturing and instead let participants encounter five key complications through the activity.

  **Setup and Materials** (150 words)
  - Room setup: One large table or cluster of tables for 16. Two flipcharts or whiteboards labeled "Insects" and "Vertebrates" for recording allocations and reasons.
  - Materials: 
    - Role cards (16): Assign prior credences on insect sentience (e.g., 4 cards at 90%, 4 at 50%, 4 at 10%, 4 at 1%).
    - Information packets (one per participant): Each contains the same core facts (see Staged Information), but some roles get additional perspective prompts (e.g., biologist role might get a note about phylogenetic distance).
    - Budget tokens: 100 physical tokens (coins, chips) to represent the budget.
    - Decision sheets: For recording individual and group allocations.
    - Lookup tables: Precomputed outcomes for various choices (to avoid arithmetic delays).
    - Timer.

  **Roles, Rules, and Staged Information** (450 words)
  - Roles: All participants are committee members. Assign role cards with prior credences (as above). Two participants get a "biologist" tag (visitors) — their cards note that evidence proxies (like pain behavior) might not transfer across phylogeny. No other special roles.
  - Rules:
    1. The committee must allocate exactly 100 tokens between two interventions: 
       - Insect: Protects a fixed number of insects from a harmful event (e.g., pesticide-free farming). Cost: 1 token per 10^X insects (where X is set by facilitator, e.g., 10^9).
       - Vertebrate: Improves welfare for a fixed number of vertebrates (e.g., cage-free chickens). Cost: 1 token per Y vertebrates (e.g., 10^3).
    2. The session has three stages: 
       - Stage 1 (Individual): 10 min. Each writes their preferred allocation based on initial info.
       - Stage 2 (Small groups): 30 min. Form four groups of four. Each group debates and agrees on an allocation. Groups receive additional information packets (see below) halfway through.
       - Stage 3 (Whole committee): 40 min. Groups present. Whole committee debates and votes on final allocation. Voting: Each participant has one vote; majority rules, but any member can record a dissent (which affects scoring).
  - Staged Information:
    - Initial packet (given at start):
      - Insect intervention: Costs 1 token per 10^12 insects protected. (Note: This is cheap per individual.)
      - Vertebrate intervention: Costs 1 token per 100 vertebrates helped.
      - Background: 
        - Estimated number of insects affected by the intervention: 10^18 (a quintillion).
        - Estimated number of vertebrates: 10^10 (10 billion).
        - Probability of insect sentience (for scoring) is your prior (from role card). Vertebrate sentience is assumed 1.
        - Welfare per individual: For vertebrates, 1 unit per individual. For insects, if sentient, welfare per individual is scaled by neuron count. (Neuron counts: insect ~10^5, vertebrate ~10^10. So ratio is 10^-5.)
      - Replacement effect: For insects, if deaths are averted, the population is resource-limited, so replacements occur. Only 1% of averted deaths actually reduce total insect-years. For vertebrates (farmed), no replacement: demand sets population, so averted suffering directly reduces total.
    - Mid-activity packet (given to small groups at 15 min mark):
      - Reveal that welfare per insect might scale with neuron count as n^α, where α is unknown (0 ≤ α ≤ 1). Provide a lookup table showing welfare per insect for different α (e.g., for α=0: 1, α=0.5: ~0.003, α=1: 10^-5). 
      - Proxy transfer: "The evidence for insect sentience (e.g., avoidance learning) is similar to evidence in vertebrates. However, the last common ancestor was 600 million years ago. Does this evidence transfer?"
      - Cheapness note: "Interventions for insects are cheaper per individual. Is this because they are simpler, or because their welfare is less valued by the market?"

  **Scoring and Stakes** (150 words)
  - Scoring: The actual outcome (in welfare terms) depends on:
    - Whether insects are sentient (a coin flip based on the group's average prior? Or use a fixed probability? We'll use the group's allocation and a fixed probability for simplicity in calculation).
    - The scaling exponent α (drawn randomly by facilitator at the end from [0, 0.5, 1]).
    - Replacement: Only 1% of insect "saves" count; vertebrate saves count 100%.
  - Stakes: The department will donate 100 units of local currency proportional to the allocation. The donation goes to real organizations (pre-arranged) working on insect welfare and vertebrate welfare. The scoring also yields a "welfare score" (for debrief) but does not affect the donation.
  - Individual scoring: Each participant's "success" is tracked by comparing their initial allocation to the final group allocation and the "true" outcome (revealed in debrief). Dissenters get a note in the record.

  **Timeline** (200 words)
  - 0-5 min: Introduction. Explain the funding committee setup, budget tokens, and the two interventions. Hand out role cards and initial information packets. Emphasize: "You must allocate 100 tokens. The department will donate real money based on your final decision."
  - 5-15 min: Stage 1 (Individual). Participants read packets and write initial allocation.
  - 15-45 min: Stage 2 (Small groups). Form four groups. Groups debate. At 15 min (start of Stage 2), hand out mid-activity packets. Groups must agree on an allocation by 45 min.
  - 45-85 min: Stage 3 (Whole committee). Each group reports. Whole group debate. At 75 min, call for a vote (each participant votes for an allocation split). Tally votes (median? or majority of a set of options). Allow dissent recording. Final allocation recorded by 85 min.
  - 85-95 min: Participants write reflections: "What surprised you? What made you change your mind?"
  - 95-100 min: Quick share of reflections. Do not debrief yet.

  **What Participants Should Run Into, and When** (250 words)
  - Stage 1 (Individual): Participants with low insect-sentience priors may allocate little to insects, but those with high priors see huge numbers. They note the neuron scaling (welfare per insect is tiny) but also the enormous scale. Replacement is in the packet but may be overlooked.
  - Stage 2 (Small groups): Mid-activity packet introduces α. Groups realize that if α=0, insects matter a lot; if α=1, very little. They cannot settle α. Replacement is rediscovered: "Wait, saving 10^18 insects only avoids 10^16 insect-years?" The proxy transfer note makes some question the sentience probability. Cheapness is noted: "Why is it so cheap? Because no one cares?" 
  - Stage 3 (Whole committee): Groups with different priors and α assumptions clash. Someone argues: "Even a 1% chance of sentience makes insects dominate due to numbers." Another counters: "But it's one big gamble, and if α is low, it's nothing." Replacement is debated: "We're not really saving insects, just making room for others." Vertebrate advocates stress known sentience and no replacement. The vote forces trade-offs.

  **Debrief** (500 words)
  Start by revealing the randomly drawn α and whether insects were sentient (based on a coin flip at 5% probability? Or use the average prior? We'll use the average prior to compute expected value). Then:
  1. **Fan-out**: Point out that the insect allocation was a single big bet. Ask: "How many felt the tension between the huge upside and the risk of zero?" Map to Stage 3 arguments. Contrast with vertebrates: many small certain gains.
  2. **Scaling exponent**: Show how the welfare score changes with α. Ask: "Did you notice how your decision hinged on an unknown biological parameter?" Highlight group discussions where α was pivotal.
  3. **Replacement**: Note that the effective impact for insects was 1% of the headline number. Ask: "Who realized that the counterfactual for insects is almost zero? How did that feel?" Contrast with vertebrates: direct reduction.
  4. **Proxy transfer**: Reference the biologist roles: "Did anyone worry that the evidence we use for vertebrates might not apply to insects?" Discuss the base-rate problem: we have no independent calibration for insects.
  5. **Cheapness**: Ask: "Did the low cost per insect make you more willing to fund them? But then, is that because of their numbers or because they are neglected?" Link to the idea that cheapness might reflect low expected welfare rather than just efficiency.
  - Finally, tie to the scale argument: "The raw numbers are staggering, but you encountered how uncertainty, scaling, and counterfactuals complicate the picture. The force comes from multiplying a tiny probability by a huge number, but today you felt the caveats."

  **What Will Go Wrong the First Time** (250 words)
  - **Stalling on math**: Despite lookup tables, some groups might try to compute. Solution: Circulate and remind them to use tables. Precompute key scenarios.
  - **Dominant participants**: Some may monopolize discussion. Assign a facilitator per small group (rotate) and set speaking rules.
  - **Overlooking key info**: E.g., replacement might be missed. Solution: In Stage 2, ask prompting questions: "What about the replacement note?"
  - **Voting deadlock**: In whole committee, no majority. Solution: Use a ranked vote or median allocation.
  - **Biologists feeling sidelined**: Ensure their proxy transfer note is included in group discussion. Assign them to different groups.
  - **Time overrun**: Keep strict timeboxes. Cut whole-group discussion if needed and go to vote.
  - **Flippancy about real donation**: Emphasize the real stakes: "This money will be donated based on your choice."

  **What the Activity Cannot Deliver** (150 words)
  The activity cannot deliver a precise understanding of the scaling exponent α in neurobiology, nor can it resolve the base-rate problem for proxy evidence. It also cannot simulate the true astronomical scale (the numbers are abstract). Most importantly, it cannot make participants *feel* the moral weight of trillions of insects without the artificial constraints of the activity. The facilitator must state that the scale argument, in its pure form, is about the product of number and probability, but the complications show that this product is not straightforward. The gut feeling of the argument's force comes from the tension between the huge numbers and the layers of uncertainty, but the activity simplifies the science and the moral math. The debrief must clarify that in the real world, these parameters are not just unknown but may be unknowable.
answer: |-
  ### Setup and Materials  
  Prepare:  
  - **Role cards (16):** Assign prior credences for insect sentience: 4 at 90% ("high"), 4 at 50% ("medium"), 4 at 10% ("low"), 4 at 1% ("skeptic"). Two biology visitors receive "Biologist" cards noting phylogenetic distance.  
  - **Information packets (3 types):** Packet A (initial): Costs and baseline facts. Packet B (mid-activity): Scaling and proxy evidence. Packet C (final): Replacement and cheapness ambiguity. Print on colored paper.  
  - **Budget tokens:** 100 physical tokens (e.g., poker chips).  
  - **Decision sheets:** Individual/group allocation forms.  
  - **Lookup tables:** Laminated cards with precomputed welfare outcomes for different α values and sentience probabilities (e.g., "If α=0, welfare per insect = 1; if α=1, welfare = 0.00001").  
  - **Other:** Flipcharts labeled "Insects" and "Vertebrates," timer, opaque jar for α draw.  

  ### Roles, Rules, and Staged Information  
  **Roles:** All 16 are committee members. Role cards assign priors and perspectives (e.g., "Biologist" cards hint at phylogenetic gaps). No "leader" roles—equal standing.  
  **Rules:**  
  1. **Stage 1 (Individual):** 10 mins. All receive **Packet A** with:  
     - *Interventions:*  
       - **Insect:** "Aerial spray reduction. Cost: 1 token = 10¹⁵ insects ‘protected.’ Headline impact: 10¹⁸ insects."  
       - **Vertebrate:** "Cage-free transitions. Cost: 1 token = 10³ chickens. Headline impact: 10⁶ chickens."  
     - *Baseline facts:* "Chicken sentience probability: 99%. Insect sentience probability: *your prior* (see role card). Welfare per sentient chicken: 1 unit. Welfare per sentient insect: scaled by neuron count (insect brain: 10⁵ neurons; chicken: 10⁹)."  
     - *Task:* Write initial token split (e.g., "80 insect, 20 vertebrate").  

  2. **Stage 2 (Small groups):** 30 mins. Form four groups of four. At 15 mins, hand **Packet B**:  
     - *Scaling exponent:* "Welfare per insect may scale with neurons as *n^α*. α is unknown (0≤α≤1). Use lookup table for welfare calculations."  
     - *Proxy evidence:* "Studies show insects avoid heat (like vertebrates). Biologists: Note this evidence evolved independently in insects vs. vertebrates."  
     - *Task:* Groups debate and agree on a split.  

  3. **Stage 3 (Whole committee):** 40 mins. Groups share splits. Distribute **Packet C**:  
     - *Replacement:* "Insect populations are resource-limited. Only 1% of ‘protected’ insects avoid suffering (99% are replacements). Chicken populations are demand-driven—savings are direct."  
     - *Cheapness:* "Insect intervention is 10¹²× cheaper per individual. Why? Market neglect? Or low welfare capacity?"  
     - *Task:* Whole group debates, then blind-votes on final split (tokens placed in envelopes). Dissenters submit written objections.  

  ### Scoring and Stakes  
  - **Real stakes:** The department donates 100 units of local currency proportional to the final split (e.g., 70 tokens to insect → $70 to an insect charity).  
  - **Simulated welfare scoring:** Post-activity, draw α from a jar (0, 0.5, or 1). Calculate welfare:  
    - **Vertebrates:** Tokens × 10³ × welfare per chicken (1) × sentience prob (0.99).  
    - **Insects:** Tokens × 10¹⁵ × welfare per insect (from α) × sentience prob (group avg) × replacement (0.01).  
  - **Individual stakes:** Dissenters’ objections are recorded. All must submit initial/final allocations—no neutrality.  

  ### Timeline  
  - **0–5 mins:** Introduce committee frame, tokens, and real donation. Distribute Packet A and role cards.  
  - **5–15 mins:** Stage 1 (Individual decisions).  
  - **15–45 mins:** Stage 2 (Small groups). At 15 mins, distribute Packet B.  
  - **45–65 mins:** Stage 3a (Groups report splits on flipcharts).  
  - **65–85 mins:** Stage 3b (Whole-group debate). At 65 mins, distribute Packet C. At 80 mins, blind vote.  
  - **85–95 mins:** Submit dissent notes. Participants write reflections: "What pulled you most?"  
  - **95–100 mins:** Collect materials. No discussion—save for debrief.  

  ### What Participants Should Run Into, and When  
  - **Stage 1 (Individual):** High-prior members allocate heavily to insects (big numbers!). Low-prior members dismiss it. All see neuron scaling but not α—welfare per insect feels arbitrary.  
  - **Stage 2 (Small groups):** Packet B forces debate on α. A high-prior member argues, "Even if welfare per insect is tiny, the scale dominates!" Another retorts, "But if α=0, it’s huge; if α=1, it’s nothing—we’re gambling!" Biologists question proxy evidence: "Heat avoidance in insects might not mean pain."  
  - **Stage 3 (Whole committee):** Packet C shocks them. "Only 1% of insect ‘saves’ matter? Then the big number is fake!" Vertebrate advocates pounce: "Our gains are certain." Cheapness ambiguity emerges: "Is spraying cheap because insects suffer little, or because nobody cares?" Final vote deadlocks over uncertainty.  

  ### Debrief  
  Start by revealing the drawn α and welfare scores. Then:  
  1. **Fan-out (Complication 1):** "When you voted, did the insect option feel like one lottery ticket with massive stakes? Vertebrates felt safer—many small wins. That’s *fan-out*: identical expected value, radically different risk." (Link to Stage 3 deadlock.)  
  2. **Scaling exponent (Complication 2):** "Your debate hinged on α—e.g., ‘If α=0, insects win!’ But α is unknown. In Stage 2, you saw welfare flip from negligible to colossal based on a biological unknown."  
  3. **Replacement (Complication 3):** "Packet C revealed that ‘saving 10¹⁸ insects’ might mean almost nothing. You discovered that *individuals helped* ≠ *difference made*—especially when replacements exist. Vertebrates lacked this, making their impact legible."  
  4. **Proxy transfer (Complication 4):** "Biologists, you noted heat-avoidance evidence might not transfer across species. This isn’t just an ‘evidence gap’—it’s a base-rate problem. Without independent calibration, proxies are slippery." (Cite Packet B discussions.)  
  5. **Cheapness ambiguity (Complication 5):** "The insect intervention’s low cost pulled some of you in. But is that because of scale? Or because markets undervalue insects? Or because their welfare *is* low? You felt cheapness blurring with sentience probability."  
  - **Scale argument synthesis:** "You *felt* the tension: even a 1% sentience chance could dominate due to numbers. But you also saw why it’s fragile—α, replacement, and proxies make it unstable. The gut-level pull? The sheer weight of 10¹⁸ lives forcing you to take a 1% chance seriously."  

  ### What Will Go Wrong the First Time  
  1. **Math paralysis:** Despite lookup tables, groups stall on α calculations. *Fix:* Circulate precomputed examples (e.g., "For α=0.5, welfare = Z"). Enforce a 2-min "no calcs" rule.  
  2. **Dominant voices:** Extroverts monopolize small groups. *Fix:* Assign a "silent observer" per group to ensure equity; use timed turns.  
  3. **Packet C overlooked:** Groups ignore replacement in Stage 3. *Fix:* When distributing Packet C, ask, "How does this change your headline numbers?"  
  4. **Biologists sidelined:** Non-biologists dismiss phylogeny concerns. *Fix:* In Stage 2, give biologists a "mandate" to speak on proxy transfer.  
  5. **Vote indecision:** Committee deadlocks at 50-50. *Fix:* Require a ranked-choice vote; use tokens to force allocation.  
  6. **Trivialized stakes:** Participants treat donations as a joke. *Fix:* Open with: "This money *will* be donated. Choose wisely."  

  ### What the Activity Cannot Deliver  
  The activity cannot simulate the **true moral weight of astronomical scales**. Participants engage with abstract billions, not trillions of real insects, numbing the emotional impact. It also cannot resolve **deep uncertainty about α or proxies**—you must state that these are irreducible unknowns in real ethics. Finally, it cannot fully separate **neglectedness from welfare capacity** in "cheapness"; you must clarify that low cost *correlates* with but does not *prove* low moral weight. The gut-level "aha" of scale emerges from friction, but the vastness itself remains theoretical.
