    Revised plan for the 110-minute session:

    Part 1: Stale Evidence Warm-up (60 minutes)

    - Setup: Jar with either Die A or Die B.
    - Round 1: Prior on A (collect and shuffle).
    - Roll 1: show 6. Students update and write posterior for A (collect and shuffle).
    - Roll 2: show 6 again. Students update and write posterior for A (collect and shuffle).
    - Now, ask: "How much did the second roll of 6 alone change your belief in A? You know that without the second roll, your belief was what you wrote after the first roll, but you don't have that anymore. And you don't have your prior either. Can you compute how much you should have updated upon seeing the second 6? What is the likelihood ratio for the second roll? [They can compute: P(6|A)=1/6, P(6|B)=1/2, so LR for B over A is 3.] But without knowing your belief after the first roll, can you compute your posterior after the second roll? [No, because posterior = (likelihood ratio) * prior, but the prior here is the belief after the first roll, which they don't have.]"
    - This shows that for the second update, they are missing the prior (which was their state after the first roll).

    Part 2: Dormant Evidence (40 minutes)

    - Now introduce Die C (always 6).
    - Ask: "Given that you have seen two sixes, and now knowing that Die C is a possibility, what is your posterior belief that the die is A, B, or C? You must assign probabilities that sum to 1."
    - They have to assign these without being able to do a full Bayesian update because they don't have their prior for C and they don't have their current belief about A and B (which was already updated by the evidence).
    - Then, we set up a market where they can trade shares in A, B, and C. Each share pays $1 (or one unit of reward) if that die is the one in the jar.

    **Market Mechanism**:

    - We will have a continuous double auction. Students can shout bids and asks.
    - We record the last traded price for each security. The price reflects the market's credence.
    - We also ask students to write their own posterior (for A, B, C) on a slip to be scored later.

    **Scoring Rule**:

    Use the quadratic scoring rule. For a student who reports a probability vector (p1, p2, p3) for the three dice, and if the true die is i, then the score is:

        S = 1 - (1-p_i)^2 - (p_j)^2 - (p_k)^2   [for j, k != i]

    But to make it simpler and more intuitive, we can use a linear approximation or just tell them that they will be rewarded based on how close their reported probability for the true die is to 1.

    Alternatively, we can use a log scoring rule but that requires logs.

    Quadratic is easier to compute: 

        S = 2*p_i - (p_i^2 + p_j^2 + p_k^2)

    We can handout a table or a formula.

    **Timeline**:

    First Session (110 minutes):

    - (10 min) Introduction to the activity: We are going to play a game with a die in a jar. There are two dice initially (describe A and B). 
    - (5 min) Each student writes their prior for Die A on a slip (and their name). Collect in a bag and shuffle.
    - (10 min) Roll the die once (instructor rolls and shows 6). Students calculate and write their posterior for A. Collect and shuffle.
    - (10 min) Roll again (6). Students calculate and write their posterior for A. Collect and shuffle.
    - (15 min) Stale evidence reflection: Ask students to compute the likelihood ratio for the second roll alone. Then ask: "If you had not yet seen the second roll, how would you update from your state after the first roll? But you don't have that state anymore. How does that make you feel about your ability to do the update?" Let them discuss in pairs.
    - (5 min) Introduce Die C: always shows 6.
    - (10 min) Students individually assign posteriors to A, B, and C (sum to 1). Collect these.
    - (30 min) Market activity: 
          - Explain the market: There are three securities: A-share, B-share, C-share. Each will pay 1 unit of reward (e.g., 1 candy) if that die is the true one, 0 otherwise.
          - Each student gets an endowment of, say, 10 units of fake money.
          - They can buy and sell shares. We run the market for 20 minutes.
          - Record the final market prices (which should reflect the market's probability for each die).
    - (10 min) Reveal the true die and compute scores for the individual reports (using quadratic scoring) and for the market (the price of the true die's share is the payout for one share, so students who bought that share gain).

    Second Session (50 minutes) a week later:

    - (30 min) Debrief: 
          - Start with the stale evidence case: they couldn't update for the second roll without the intermediate state. That's a mild form of old evidence.
          - The dormant evidence case: they had to assign a posterior for C even though the evidence was old and they had lost their priors and intermediate states. 
          - The market prices likely moved in favor of C, even though individually they might have reported lower probabilities for C because they were anchored to A and B.
          - Introduce the problem of old evidence: when the evidence is already known, conditionalization seems to block updating.
          - Standard escapes:
              1. Counterfactual: "If I had not known E, then ..." -> but they don't know what they would have believed.
              2. Learning the entailment: "I learned that the theory entails E." -> then update on that. In our case, when we introduced Die C, we also introduced the entailment (that C entails two sixes). So that might be an escape. But what likelihood to assign to "C entails two sixes"? It's 1, but then it becomes tautological.
              3. Reassigning priors: They might have assigned a prior to C arbitrarily and then updated, but that ignores the fact that they already had evidence that might make C more likely.
    - (20 min) Discuss the stale vs. dormant distinction: In stale, they knew the evidence and its bearing all along. In dormant, they knew the evidence but only later saw its bearing on C. The update for C feels more compelling in the dormant case, but it is harder to justify with Bayesianism.

    **What will go wrong**:

    1. **Arithmetic**: Some students might struggle with the likelihood calculations. Provide the probabilities for each die:
          - P(6|A)=1/6, P(6|B)=1/2, P(6|C)=1.
          - P(two sixes|A)=1/36, etc.

    2. **Market dominated by a few**: Use a limit on the number of trades per student or use a call market in rounds. Alternatively, have them trade in small groups.

    3. **Prior amnesia not effective**: Students might remember their prior or intermediate posterior. Emphasize that they are not to remember and that the slips are shuffled to simulate loss.

    4. **Students resist betting on entailment**: In the dormant case, they might not want to assign a high probability to C because it feels ad hoc. That's part of the point: the Bayesian update might not capture the resistance to ad hoc hypotheses.

    **Debrief Mapping**:

    - The moment after they are asked to update for the second roll in the stale case and they realize they need the intermediate state -> shows that conditionalization requires the prior state.
    - The moment when they are asked to assign a posterior for C and they hesitate because they don't have their old beliefs -> the problem of old evidence.
    - The market activity: if the price for C is high, it shows that the market collectively confirms C, even though individuals might not have updated in a Bayesian way -> the intuition of confirmation is strong, but the formalism is blocked.
    - The standard escapes come up naturally: 
          - Counterfactual: "If I hadn't seen the two sixes, then ..." -> but how to assign the prior for C? 
          - Learning the entailment: They might say: "I learned that if C is true, we would see two sixes, which we did." -> then update on that. But what is the likelihood of the evidence (which is already known) given C? It's 1. So the update leaves the probability unchanged? That's not right.

    **Design Choice Load-Bearing**:

    - The prior amnesia mechanic is load-bearing for simulating the loss of the prior. If students remember their priors, the problem is mitigated. But in real science, we often don't have a record of our priors.
    - The stale/dormant split: The stale case is a warm-up to show the need for the prior state. The dormant case is the main event. If the distinction collapses, it's because both cases involve old evidence. But the dormant case has the additional feature of a new hypothesis, which is common in science.

    **Weaknesses**:

    - The scoring-rule-and-market setup might make the problem seem about willingness to bet rather than confirmation. But the market price is a proxy for the community's credence, which is what confirmation should affect. The gap between the market price and the individual's inability to update might highlight the problem.
    - The activity might not produce the experience if the students don't take the market seriously or if the arithmetic is too heavy.

    **Would I change my mind?** 

    - If the students don't experience the loss of the prior as a real obstacle (because they can approximate or remember), then prior amnesia is not effective. We could try to make the prior more complex (e.g., many hypotheses) so that it's hard to remember.
    - If the market doesn't show a clear shift towards C, then the dormant case might not illustrate the intuition of confirmation. We should ensure that the likelihood for C is very high.

    Given the constraints, this design seems workable. We'll use dice and focus on the dormant evidence case for the main problem.

    Let's write the deliverable.
answer: |-
  ### **Activity Design: The Old Evidence Enigma**  
  **Goal:** Students experience the problem of old evidence firsthand through prior amnesia and the stale/dormant evidence distinction, with market mechanics revealing confirmation where Bayesian updating is blocked.

  ---

  ### **Materials**  
  - **Dice Jars Setup**: 
    - 3 jars labeled **X**, **Y**, **Z**. Each contains 10 dice, but with hidden compositions:
      - **Jar X**: 9 fair dice (1/6 per face), 1 loaded die (6 appears 50%).
      - **Jar Y**: 5 fair dice, 5 loaded dice.
      - **Jar Z**: 1 fair die, 9 loaded dice.
    - One *true jar* chosen secretly by instructor (e.g., Jar Y).  
  - **Dice & Rolling**: 1 physical die (or digital RNG) for rolls.  
  - **Betting Slips**: Index cards for priors/posteriors.  
  - **Market Board**: Whiteboard to track share prices (hypotheses: X, Y, Z).  
  - **Scoring Handout** (one per student, see [Payoff Scheme](#payoff-scheme)).  
  - **Fake Currency**: 10 tokens per student for trading (1 token = 0.1% of max score).  

  ---

  ### **Timeline (110-Minute Session)**  
  **Total Time**: Strictly enforced.  

  #### **Part 1: Stale Evidence (50 min)**  
  1. **Intro & Rules (5 min)**:  
     - "One jar is chosen randomly. Your goal: find which jar it is. You’ll bet on hypotheses, trade shares, and score points."  
     - Explain: 1 roll shown today, 1 roll next week.  

  2. **Prior Collection (10 min)**:  
     - Students write priors for **X, Y, Z** (sum=1) on slips.  
     - Instructor collects, shuffles slips, and discards them (no return).  

  3. **First Roll & Posterior (10 min)**:  
     - Roll die: **6** appears.  
     - Students compute posterior for X, Y, Z given the roll.  
     - Collect and shuffle slips (discard).  

  4. **Stale Evidence Challenge (25 min)**:  
     - "Next week, we’ll see a second roll. How much should that *future* roll change your belief? Compute the likelihood ratio for a **6**."  
       - *Likelihoods*:  
         - `P(6|X) = (9/10)(1/6) + (1/10)(1/2) = 0.18`  
         - `P(6|Y) = (5/10)(1/6) + (5/10)(1/2) = 0.33`  
         - `P(6|Z) = (1/10)(1/6) + (9/10)(1/2) = 0.48`  
       - *Likelihood ratios (vs. Y)*: `X: 0.18/0.33 ≈ 0.55`, `Z: 0.48/0.33 ≈ 1.45`.  
     - "But you’ve lost your prior and first posterior. How will you update *next week* when you see the new roll? Write a plan."  
     - **Key moment**: Students realize they can’t compute the update without their prior state.  

  #### **Part 2: Dormant Evidence (50 min)**  
  5. **Introduce Dormant Evidence (10 min)**:  
     - "New info: Jar **Z** has a special trait: it’s linked to the *first roll* (the **6** we saw)."  
     - "Update your beliefs *now* for **X, Y, Z** given everything you know (both rolls and this trait)."  
     - Students assign posteriors (sum=1).  

  6. **Market Trading (30 min)**:  
     - Hypotheses shares: **X, Y, Z**. Each pays 1 token if true.  
     - Students trade with fake currency. Prices recorded on board.  
     - **Critical twist**: Students *already know* both rolls:  
       - First roll (**6**, seen today).  
       - Second roll (**6**, "revealed" now but identical to first).  
     - Prices will shift toward **Z** (confirmation effect).  

  7. **Scoring & Wrap-Up (10 min)**:  
     - Collect final posteriors.  
     - Preview: "Next week, we’ll resolve the jar and score."  

  #### **Follow-Up (50-Min Session, 1 Week Later)**  
  - **Reveal & Score (20 min)**:  
    - Reveal true jar (e.g., Y).  
    - Score posteriors using quadratic scoring (see [Payoff Scheme](#payoff-scheme)).  
    - Pay market shares.  
  - **Debrief (30 min)**: Structured discussion (see [Debrief](#debrief)).  

  ---

  ### **Payoff Scheme**  
  **Quadratic Scoring Rule** (simplified for in-class computation):  
  - For hypothesis \(i\) with true probability \(p_i\):  
    \[
    \text{Score} = 1 - (1 - p_i)^2 - \sum_{j \neq i} p_j^2
    \]  
  - **Example**: If true jar is **Y**, and a student reports:  
    - **X**: 0.2, **Y**: 0.6, **Z**: 0.2 → Score = \(1 - (0.4)^2 - (0.2^2 + 0.2^2) = 0.84\).  
  - **Market Payoff**: Share price of true jar is cashed out 1:1 (e.g., if **Y** share = 0.7 tokens, holder gains 0.7 tokens).  
  - **Token Conversion**: 10 tokens = +1% final grade (or candy equivalent).  

  ---

  ### **Debrief**  
  Map student experiences to philosophical concepts:  

  | **Moment in Activity**         | **Argumentative Structure**                                  | **Standard Escape Highlighted**                              |  
  |--------------------------------|--------------------------------------------------------------|-------------------------------------------------------------|  
  | Stale: Can’t compute update    | Conditionalization requires priors; lost priors block updating. | **Counterfactual priors**: "What would I have believed?" (But arbitrary without memory). |  
  | Market prices shift toward **Z** | Collective intuition confirms **Z**; individuals feel stuck. | **Learning entailment**: Updating on "**Z** predicts 6" (But likelihood=1 → no update). |  
  | Dormant: Confidence in **Z**   | Strong intuition from *newly seen* entailment.               | **Reassigning priors**: Arbitrary prior for **Z** (Ignores pre-existing evidence). |  
  | Posteriors mismatch market     | Personal bets deny confirmation; market prices embrace it.   | **Problem of old evidence**: Formalism is silent; agents "overrule" Bayes. |  

  **Stale vs. Dormant Distinction**:  
  - **Stale**: Evidence (first **6**) and its bearing known upfront. Students *can* compute likelihoods but *can’t update* without priors.  
  - **Dormant**: Evidence (first **6**) known, but bearing on **Z** only revealed later. Students *feel* strong confirmation but *can’t justify it* via Bayes.  
  - **Does it hold?** Yes—dormant case amplifies the problem. If it collapses, replace with **known entailment** (stale) vs. **novel entailment** (dormant).  

  ---

  ### **Predictable Challenges & Fixes**  
  1. **Student Refuses to Bet on Entailment**:  
     - *Why*: Skepticism that **Z** is "ad hoc."  
     - *Fix*: Reiterate: "You know the first roll was **6**. **Z**’s trait connects to that. Bet based on rules."  
     - *Debrief Note*: This mirrors scientific resistance to unfalsifiable theories.  

  2. **Market Dominated by Loud Students**:  
     - *Why*: Trading favors confident extroverts.  
     - *Fix*: 
       - Cap trades (max 5/student).  
       - Use silent bidding (written bids).  
       - *Debrief Note*: "The market aggregates intuition, but noise exists. Focus on price *shift*, not absolute levels."  

  3. **Arithmetic Overwhelms**:  
     - *Why*: Likelihood calculations may stall.  
     - *Fix*: Provide pre-computed likelihoods on handout.  

  4. **Prior Amnesia Feels Artificial**:  
     - *Why*: Students might recall priors.  
     - *Fix*: Stress: "This simulates scientific practice—we rarely record priors."  
     - *Debrief*: "Science often confronts old evidence with lost priors. How do we proceed?"  

  ---

  ### **Load-Bearing Design Choices**  
  1. **Prior Amnesia**:  
     - Simulates lost priors in real science.  
     - **Change my mind if**: Students reconstruct priors easily (use more hypotheses/complexity).  

  2. **Market Mechanics**:  
     - Makes confirmation publicly visible.  
     - **Change my mind if**: Betting conflates *confirmation* with *risk tolerance* (use peer persuasion instead).  

  3. **Stale/Dormant Split**:  
     - Isolates the "new entailment" intuition.  
     - **Change my mind if**: Distinction feels contrived (emphasize novelty of entailment alone).  

  **Weakest Link**: Prior amnesia. If students resist, pivot to **counterfactual priors** ("Imagine you never saw the first roll") and expose arbitrariness.  

  ---

  ### **What the Activity Can’t Reproduce**  
  - **The "Aha!" Moment of Entailment**: In science, discovering an entailment is transformative. Here, it’s handed to students. **Debrief statement**: "Real science involves *realizing* the entailment—here, we simulated only its effect."  
  - **Community Consensus Dynamics**: Markets simplify peer persuasion. **Debrief statement**: "Markets approximate communal confirmation; real science involves slower discourse."  

  Run this, and the problem of old evidence will shift from abstract to visceral. The market’s silent testimony against Bayesian paralysis will linger.
