  4. **Self-Contained Hypothesis Space**: Simple setup (e.g., a deck of cards with a hidden rule, or a jar of dice) so that likelihoods can be computed.
  5. **Scoring Rule**: Use a proper scoring rule with real but small stakes (e.g., candy, extra credit points) to incentivize honest reporting.

  We'll break the activity into two sessions:

