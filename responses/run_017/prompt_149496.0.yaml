prompt: |-
  hey — I need a thought experiment built to spec, and I want it to be the centerpiece of a short talk I'm giving to a hospital's clinical governance committee. The line I want to land is that "if you're unsure about a diagnosis, get a second opinion, and if you're still unsure, a third" is not automatically good advice, even when every clinician you ask is better than chance and nobody is rubber-stamping anybody else. I know the Condorcet jury theorem says majority accuracy climbs toward certainty as you add independent, better-than-chance voters, and I don't want to contradict that. I want a case where the theorem's headline conclusion holds and the advice still fails.

  So: build me a realistic case — a ward, a committee room, an on-call handover, whatever, not an urn or a coin — where two things come apart in exactly this direction:

  (a) the probability that the majority verdict is correct is HIGHER with nine voters than with one;
  (b) the expected cost of acting on the majority verdict is WORSE with nine voters than with one.

  Constraints, and these are most of the work:

  - One paragraph for the scenario itself. Real decision, real stakes, no science fiction, no trolleys, no stylized urns. The committee's verdict is binding and gets acted on, nobody abstains, odd numbers only so there's no tie-breaking.
  - Two states of the world, and you give me a competence number for each: the voter's probability of being right conditional on that state. Justify each in a sentence, so I read it and think yes, that is about how good a tired senior resident actually is. The rare state has to be rare for a reason that's in the story.
  - Every voter has the SAME two numbers. No heterogeneity, no weak-link voters dragging the average down. Whatever is doing the work, it is not "a few bad reviewers."
  - Overall competence, averaged over the base rates, comfortably above 50%.
  - Votes independent conditional on the state. Secret ballot, no deliberation, no deference, no cascade, nobody sees how anyone else voted. So the mechanism cannot be "they all looked at the same misleading scan" — I know that one, it isn't interesting, and it can't be "average competence is below 50%" either.
  - The voters are voting on the same proposition the committee is deciding. No gap between what the voter is reliable about and what the vote is about.
  - Here's the bit I haven't seen handled anywhere: each voter is well calibrated — when they say they're 90% sure, they're right 90% of the time — and the aggregation is a plain headcount that throws that confidence away. Nobody states a probability, nobody weights by one.
  - The two error types have genuinely different costs (a missed something versus an unnecessary something), and the asymmetry has to fall out of the scenario rather than be asserted.

  What I want back:

  1. The scenario, one paragraph.
  2. The numbers: two conditional competences, the base rate, two error costs, one line of justification each.
  3. The arithmetic to three significant figures: probability the majority is right, and expected cost of acting on the verdict, at n = 1, n = 3, n = 9, and in the limit as n grows. Show enough working that I can check you didn't just stipulate the verdicts.
  4. Which single feature of the case is doing the work, stated precisely enough that I could dial it up and down.
  5. What happens to (a) and (b) if I remove that feature — say, if I make the two error costs equal, or lift the rare-state competence above 50%. Does the case collapse, and if so into what?
  6. The strongest version of how someone who really believes in adding reviewers would attack the case, and then your honest call on whether that's a rebuttal or a redefinition of the claim.
  7. One line I can actually say to the committee at the end of the talk.

  Also: if the case really does depend on the voters being systematically un-alarmed in the rare state, tell me whether that's a feature of the scenario or a defect in it, and whether a real committee that knew its own numbers could just fix it by changing the decision rule — supermajority, any-positive-vote-wins, whatever. If its a yes, trivially, then my talk is definately in trouble and I'd rather find out now.

  American English throughout please, I'm lifting chunks straight into slides.
reasoning: |-
  We are going to design a thought experiment that meets all the specified constraints. The key is to have a situation where the majority vote becomes more accurate as the number of voters increases (as per Condorcet), but the expected cost of acting on that majority vote increases because the rare state (which is costly to miss) is being missed more often in the majority vote as the group grows, despite the increased accuracy in the common state.

  The scenario: Consider a hospital's rapid response team evaluating whether a patient with non-specific symptoms (like fatigue and mild fever) has a rare but deadly condition (e.g., bacterial meningitis) versus a common and benign one (e.g., viral upper respiratory infection). The committee must decide whether to initiate aggressive treatment (antibiotics, lumbar puncture, etc.) which is costly and risky for the patient if they don't have the bacterial infection, but life-saving if they do.

  States of the world:
  - State R (rare): bacterial meningitis. Base rate: low, say 1% (because it is rare and the patient is not presenting with classic symptoms, only non-specific ones).
  - State C (common): viral infection. Base rate: 99%.

  Voter competence (same for all voters, independent conditional on state):
  - In state R (rare): each voter has a probability p_R of being correct (i.e., diagnosing "meningitis") and 1-p_R of being wrong (i.e., saying "viral").
  - In state C (common): each voter has a probability p_C of being correct (i.e., diagnosing "viral") and 1-p_C of being wrong (i.e., saying "meningitis").

  We set p_C (competence in the common state) high, say 90% (because the common condition is easy to recognize) and p_R (competence in the rare state) low, say 40% (because the rare condition is hard to detect when it presents atypically, and the clinicians are prone to missing it even when it's there). Note: 40% is below 50%, but that is allowed because we are not requiring competence above 50% in every state, only on average.

  Overall competence (base rate weighted) = (0.01 * 0.4) + (0.99 * 0.9) = 0.004 + 0.891 = 0.895, which is 89.5% (well above 50%).

  But note: in the rare state, the individual is more likely to be wrong (60% chance) than right (40%). This is the key feature.

  Costs:
  - If the true state is R (meningitis) and the committee decides not to treat (false negative): high cost, say 1000 (representing death or severe disability).
  - If the true state is C (viral) and the committee decides to treat (false positive): moderate cost, say 10 (representing side effects, antibiotic resistance, hospital stay, etc.).
  - Correct decisions in either state have 0 cost.

  Now, we compute for n=1,3,9, and the limit.

  First, we note that the committee acts on the majority vote. The decision is to treat if the majority says "meningitis", and not to treat if the majority says "viral".

  We need:
  (a) Probability that the majority verdict is correct. This is the probability that the majority is right about the state.
  (b) Expected cost of acting on the majority verdict.

  We compute for each state and then average over the base rates.

  Let P_maj_correct(n) = P(majority correct | state) * P(state) [then summed over states]
  But note: the majority being correct in state R means majority votes for R (treat), and in state C, majority votes for C (not treat).

  Similarly, the expected cost is:
    E[cost] = P(state=R) * [P(majority votes C | R) * cost(FN) + P(majority votes R | R) * 0] 
             + P(state=C) * [P(majority votes R | C) * cost(FP) + P(majority votes C | C) * 0]

  So:
  E[cost] = P(R) * P(maj votes C | R) * cost_FN + P(C) * P(maj votes R | C) * cost_FP

  We compute for n=1,3,9.

  Note: For n=1, majority is the single vote.

  We'll use binomial distributions.

  Set:
  base_rate_R = 0.01
  base_rate_C = 0.99
  p_R = 0.4   # prob of correct vote in R (i.e., vote R)
  p_C = 0.9   # prob of correct vote in C (i.e., vote C)

  cost_FN = 1000
  cost_FP = 10

  For a given state and n, the number of correct votes is binomial.

  In state R: 
    Each vote is correct (votes R) with prob p_R = 0.4, so incorrect (votes C) with 0.6.
    Majority votes R (correct) if more than n/2 vote R.

  In state C:
    Each vote is correct (votes C) with prob p_C = 0.9, so incorrect (votes R) with 0.1.
    Majority votes C (correct) if more than n/2 vote C.

  We compute:

  1. n=1:
     State R: 
        P(majority correct | R) = P(vote R) = 0.4
        P(majority wrong | R) = 0.6
     State C:
        P(majority correct | C) = P(vote C) = 0.9
        P(majority wrong | C) = 0.1

     Overall P(majority correct) = P(R)*0.4 + P(C)*0.9 = 0.01*0.4 + 0.99*0.9 = 0.004 + 0.891 = 0.895

     Expected cost:
        E[cost] = base_rate_R * P(wrong|R)*cost_FN + base_rate_C * P(wrong|C)*cost_FP
                 = 0.01 * 0.6 * 1000 + 0.99 * 0.1 * 10
                 = 0.01*600 + 0.99*1 = 6 + 0.99 = 6.99

  2. n=3:
     Majority requires at least 2 votes.

     State R:
        Let X ~ Binom(3,0.4) for R votes.
        P(majority R) = P(X>=2) = P(X=2)+P(X=3) = C(3,2)*(0.4)^2*(0.6) + C(3,3)*(0.4)^3
                     = 3 * 0.16*0.6 + 1 * 0.064 = 0.288 + 0.064 = 0.352
        P(majority wrong | R) = 1 - 0.352 = 0.648

     State C:
        Let Y ~ Binom(3,0.9) for C votes.
        P(majority C) = P(Y>=2) = P(Y=2)+P(Y=3) = C(3,2)*(0.9)^2*(0.1) + C(3,3)*(0.9)^3
                     = 3 * 0.81*0.1 + 1 * 0.729 = 0.243 + 0.729 = 0.972
        P(majority wrong | C) = 1 - 0.972 = 0.028

     Overall P(majority correct) = 0.01*0.352 + 0.99*0.972 = 0.00352 + 0.96228 = 0.9658

     Expected cost:
        E[cost] = 0.01 * 0.648 * 1000 + 0.99 * 0.028 * 10
                 = 0.01*648 + 0.99*0.28   [Note: 0.028*10=0.28]
                 = 6.48 + 0.2772 = 6.7572

     So far, we see that the majority accuracy increased from 89.5% to 96.58%, but the expected cost decreased from 6.99 to about 6.76. We need it to increase for n=9.

  3. n=9:
     Majority requires at least 5 votes.

     State R:
        X ~ Binom(9,0.4)
        P(X>=5) = P(X=5)+...+P(X=9)
        We compute:
          P(X=k) = C(9,k) * (0.4)^k * (0.6)^(9-k)
          P(X=5) = 126 * (0.4^5)*(0.6^4) = 126 * 0.01024 * 0.1296 ≈ 126 * 0.001327 = 0.1672
          P(X=6) = 84 * (0.4^6)*(0.6^3) = 84 * 0.004096 * 0.216 ≈ 84 * 0.0008847 ≈ 0.0743
          P(X=7) = 36 * (0.4^7)*(0.6^2) = 36 * 0.0016384 * 0.36 ≈ 36 * 0.0005898 ≈ 0.0212
          P(X=8) = 9 * (0.4^8)*(0.6)   = 9 * 0.00065536 * 0.6 ≈ 9 * 0.0003932 ≈ 0.00354
          P(X=9) = 1 * (0.4^9)         = 0.000262144 ≈ 0.000262
          Sum ≈ 0.1672+0.0743+0.0212+0.00354+0.000262 ≈ 0.2665
        So P(majority R | R) ≈ 0.2665, so P(majority wrong | R) = 1-0.2665 = 0.7335

     State C:
        Y ~ Binom(9,0.9)
        P(Y>=5) is almost 1. Actually, we need P(Y<5) = P(Y<=4) for wrong majority (votes not C, i.e., majority R).
        P(Y<=4) = P(Y=0)+...+P(Y=4). Since p=0.9, this is very small.
          P(Y=0)= 0.1^9 = 1e-9
          P(Y=1)= 9*(0.9)*(0.1^8) = 9*0.9*1e-8 = 8.1e-8
          P(Y=2)= C(9,2)*(0.9)^2*(0.1)^7 = 36*0.81*1e-7 = 29.16e-7 = 2.916e-6
          P(Y=3)= C(9,3)*(0.9)^3*(0.1)^6 = 84 * 0.729 * 1e-6 = 84 * 7.29e-7 = 6.1236e-5
          P(Y=4)= C(9,4)*(0.9)^4*(0.1)^5 = 126 * 0.6561 * 1e-5 = 126 * 6.561e-6 = 8.26686e-4
          Sum ≈ 0.000000001 + 0.000000081 + 0.000002916 + 0.000061236 + 0.000826686 ≈ 0.00089092
        So P(majority wrong | C) ≈ 0.00089092, so P(majority correct | C) = 1-0.00089092≈0.999109

     Overall P(majority correct) = 0.01*0.2665 + 0.99*0.999109 ≈ 0.002665 + 0.989118 = 0.991783

     Expected cost:
        E[cost] = 0.01 * 0.7335 * 1000 + 0.99 * 0.00089092 * 10
                 = 0.01 * 733.5 + 0.99 * 0.0089092
                 = 7.335 + 0.00882 ≈ 7.3438

  Now we see: for n=1, cost=6.99; for n=3, cost=6.76; for n=9, cost=7.34. The cost increases from n=1 to n=9.

  But wait: we need to check the limit. As n→∞, in state R, since p_R=0.4<0.5, the majority will almost surely go to the wrong answer (voting C) with probability 1. In state C, since p_C=0.9>0.5, the majority will almost surely go to the correct answer (voting C). 

  So:
     P(majority correct | R) → 0
     P(majority correct | C) → 1

  Overall P(majority correct) → 0.01*0 + 0.99*1 = 0.99

  Expected cost → 0.01 * 1 * 1000 + 0.99 * 0 * 10 = 10

  So the cost in the limit is 10, which is worse than at n=1 (6.99) and n=9 (7.34).

  Thus, we have:
  n=1: 
     P(maj correct) = 0.895
     Expected cost = 6.99

  n=3:
     P(maj correct) = 0.9658
     Expected cost = 6.76

  n=9:
     P(maj correct) = 0.9918
     Expected cost = 7.34

  Limit:
     P(maj correct) = 0.99
     Expected cost = 10

  So (a) the probability that the majority verdict is correct increases with n (0.895 -> 0.9658 -> 0.9918 -> 0.99) and (b) the expected cost first decreases then increases (6.99 -> 6.76 -> 7.34 -> 10). We see that at n=9 the cost is already higher than at n=1.

  The key feature: the rare state (R) has individual competence below 50% (p_R=0.4), meaning that in that state, each voter is more likely to be wrong than right. Moreover, the cost of a false negative (missing R) is very high compared to the cost of a false positive (treating when it's C). As the group size increases, the probability of missing R (false negative) increases because the majority becomes more and more likely to vote for the common state (C) in the rare state. The high cost of these false negatives eventually dominates the reduction in false positives.

  Now, what if we remove the asymmetry in costs? Set cost_FN = cost_FP = 10. Then:

  n=1:
     E[cost] = 0.01*0.6*10 + 0.99*0.1*10 = 0.01*6 + 0.99*1 = 0.06+0.99=1.05

  n=3:
     E[cost] = 0.01*0.648*10 + 0.99*0.028*10 = 0.0648 + 0.2772 = 0.342

  n=9:
     E[cost] = 0.01*0.7335*10 + 0.99*0.00089092*10 = 0.07335 + 0.00882 = 0.08217

  Then the cost decreases as n increases. So the asymmetry is critical.

  What if we lift the rare-state competence above 50%? Suppose p_R=0.6. Then:

  Overall competence: 0.01*0.6+0.99*0.9=0.006+0.891=0.897 (still above 50%).

  For n=9 in state R:
     P(majority R | R) = P(X>=5) for X~Binom(9,0.6)
     This is high (since 0.6>0.5, and with n=9, it will be very close to 1). Similarly, state C remains high.

  Then the expected cost would decrease as n increases. So the case collapses.

  Therefore, the critical feature is that in the rare state (which is the high-cost state for false negatives), the individual competence is below 50%, meaning that each voter is more likely to get it wrong than right in that state.

  Now, the strongest attack: 
     "In real life, if the condition is so rare and the clinicians are only 40% accurate in detecting it, then that is a failure of training or protocol. We should improve individual competence so that in the rare state, it is above 50%. Then adding reviewers would help both accuracy and cost."

  Our honest call: This is a valid point. However, the scenario is designed to reflect a reality where some conditions are inherently difficult to diagnose even for competent clinicians (atypical presentations, lack of gold-standard tests on the spot). The thought experiment highlights that when such a situation exists (and it might be unavoidable), then adding more reviewers who are independently making the same kind of error can worsen outcomes because the group becomes more confident in the wrong answer. The committee should be aware that if their individual accuracy for a rare condition is below 50%, then adding more reviewers without improving the diagnostic method might be harmful.

  Can the committee fix it by changing the decision rule? For example, using a supermajority or any-positive-vote rule? 

  Consider: if we change the rule to "treat if at least one vote is for meningitis", then in state R, the probability of at least one vote for R is 1 - (0.6)^n. This increases with n, so the false negatives go down. In state C, the probability of at least one vote for R is 1 - (0.9)^n, which also increases. But the base rate of C is high. 

