          = 0.01 * [ (0.6)^n ] * 1000 + 0.99 * [1 - (0.9)^n] * 10

  For n=1: 0.01*0.6*1000 + 0.99*0.1*10 = 6 + 0.99 = 6.99
  For n=3: 0.01*(0.6^3)*1000 + 0.99*(1-0.9^3)*10 = 0.01*0.216*1000 + 0.99*(1-0.729)*10 = 0.01*216 + 0.99*0.271*10 = 2.16 + 0.99*2.71 = 2.16+2.6829=4.8429
  For n=9: 0.01*(0.6^9)*1000 + 0.99*(1-0.9^9)*10 
           0.6^9 ≈ 0.0100777, so 0.01*0.0100777*1000 ≈ 0.100777
           0.9^9 ≈ 0.387420489, so 1-0.3874≈0.6126, then 0.99*0.6126*10≈6.066
           Total ≈ 0.1008 + 6.066 ≈ 6.1668

  So the cost is lower than at n=1 and n=3? But at n=9 it's 6.17, which is less than 6.99? Actually, it is lower than n=1. However, note that the false positive rate becomes very high: 61.26% of the common cases get treated unnecessarily, which might be unacceptable in practice. But the cost calculation (with cost_FP=10) says it's acceptable. 

  Alternatively, the committee might use a supermajority for the common condition? Or they might use a different aggregation that takes into account the confidence? But the problem states that we are throwing away the confidence. 

  The point is: the committee could change the decision rule to make the any-vote-for-R rule and then adding reviewers would help. But that rule is not the majority rule. So the talk is safe: we are criticizing the specific advice of "add reviewers and use majority rule". 

  One line for the committee: "When a rare, high-stakes condition is in play, and individual experts are more likely to miss it than find it, adding more reviewers can make the group more confidently wrong in ways that harm patients — unless we change how we aggregate their votes."

