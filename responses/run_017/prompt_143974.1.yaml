prompt: |-
  I sit on a small advisory group that serves two very different clients — a constitutional-drafting commission currently rewriting its amendment rules and debating whether to entrench certain provisions against ordinary majorities, and a hospital ethics committee that is repeatedly asked whether to honour a psychiatric advance directive written during remission — and the group keeps talking past itself, because each member is working from a different picture of what makes an earlier self's constraint on a later self genuinely binding. Rather than sample more of the literature, I want the specification first. Please write the desiderata: what any adequate account of precommitment validity has to deliver, in a form that could actually be used to advise a drafter or a clinician on whether to honour a given constraint and how tightly to bind it. For each requirement give the case or consideration that motivates it, and mark which are non-negotiable and which are merely preferences of one camp (a horror of any dead hand at all, say, or the demand that a valid precommitment must be re-authorizable at will).

  The stress set I want the requirements keyed to, at minimum: the plain personal case (the Ulysses contract, addiction, advance directives); the institutional case (entrenchment, unamendable clauses, delegated independence for courts or central banks); the case of a wholly renewed body that inherits the commitment after every member has turned over, with no one left who made or consented to it; the case in which the earlier self precommits not to a fixed outcome but to a procedure for periodic re-authorization — a rolling Ulysses contract — and that procedure's gatekeepers themselves drift or are captured; the case of literal compliance that defeats the point of the constraint; and the case of the guardian, since any enforcement mechanism is itself an agent that can defect, so the account owes something about what binds the enforcer rather than pushing the problem up one level forever.

  Three things matter most to me. First, the account must be able to distinguish a motivated repeal from a justified one — the case where the later self or later majority wants out because the constraint is working exactly as designed, from the case where circumstances have genuinely changed — and I suspect this desideratum is in tension with the requirement that the test not defer to the judgement of the very agent whose judgement is in question; call it the diagnostic circularity, and tell me whether it is escapable or only manageable. Second, I want a desideratum about calibration: that the barrier to reversal track the expected cost of each kind of error rather than the intensity of the pressure to reverse, which is the only signal actually observable. If that pair cannot be jointly satisfied, or if any other subset of your list is jointly unsatisfiable, say so plainly — that result is the part I would take away. Third, tell me which single requirement excludes the largest share of candidate theories, and which requirement, if dropped, would make the whole exercise collapse into something trivially satisfiable. A short scorecard at the end is fine: three families only, described rather than attributed — the view that ties bindingness to the earlier self's authorization, the view that ties it to whether the constraint still serves the values that justified it, and the view that treats it as a matter of aggregating the interests of earlier and later selves across time — each graded against the list in a sentence or two, with no bibliography and no proper names I would have to look up.
reasoning: |-
  We are constructing desiderata for an account of precommitment validity. The account must guide both constitutional drafters and clinicians on when to honor constraints set by an earlier self or body on a later one. The requirements must cover various cases: personal (Ulysses contracts, addiction, advance directives), institutional (entrenchment, unamendable clauses, independent bodies), and others (wholly renewed bodies, procedural precommitments, literal compliance defeating the purpose, and the guardian problem).

  The key stresses to address:
  1. Plain personal case (Ulysses, addiction, advance directives)
  2. Institutional case (entrenchment, unamendable clauses, independent courts/central banks)
  3. Wholly renewed body (no original members remain)
  4. Procedural precommitment (rolling re-authorization) with gatekeeper drift/capture
  5. Literal compliance defeating the purpose
  6. The guardian problem (enforcer as agent that can defect)

  Three primary concerns:
  a) Distinguish motivated repeal (constraint working as designed) from justified repeal (genuine change) without deferring to the constrained agent's judgment (diagnostic circularity). Is this escapable or only manageable?
  b) Calibration: The barrier to reversal should track the expected cost of each kind of error (false positive: repealing when constraint is still valid; false negative: keeping when invalid) rather than the intensity of pressure to reverse (which is the observable signal). If (a) and (b) cannot be jointly satisfied, say so.
  c) Identify which requirement excludes the most candidate theories and which, if dropped, trivializes the exercise.

  Desiderata list (for an adequate account of precommitment validity):

  1. **Non-Circumvention Requirement (Non-negotiable)**: The account must explain why the constraint is not merely advisory and why the later self cannot simply ignore it at will. Motivation: In the Ulysses contract, the point is to prevent the later self from giving in to temptation; in entrenchment, to prevent a transient majority from altering fundamental structures. Without this, precommitment is meaningless.

  2. **Temporal Agency Requirement (Non-negotiable)**: The account must recognize both the earlier and later selves as legitimate agents whose interests and judgments matter. Motivation: In the case of a wholly renewed body (e.g., a future legislature with no members who ratified the constitution), the commitment must bind even though no current member consented. But also, in psychiatric advance directives, the patient during remission and during crisis are both the same person yet with altered capacities.

  3. **Error-Cost Sensitivity (Non-negotiable)**: The account must provide a way to set the barrier to reversal (or override) based on the expected costs of two errors: 
     - Error 1: Repealing a constraint that is still valid (i.e., when the constraint would have served its purpose if maintained).
     - Error 2: Maintaining a constraint that is no longer valid (i.e., when circumstances have changed such that the constraint now causes harm or defeats its own purpose).
     Motivation: In both the personal and institutional cases, the costs of these errors are asymmetric and context-dependent. For example, in a psychiatric advance directive, Error 1 (ignoring a valid directive) may violate autonomy, while Error 2 (honoring a directive that no longer reflects the patient's values) may cause harm. In constitutional entrenchment, Error 1 (amending a fundamental provision that should be preserved) may lead to tyranny of the majority, while Error 2 (keeping an unamendable clause that has become dysfunctional) may cause institutional breakdown.

  4. **Diagnostic Non-Deference (Non-negotiable)**: The test for whether a repeal is justified must not depend solely on the judgment of the constrained agent (the later self or body). Motivation: The constrained agent is often the one who stands to gain from repeal (e.g., an addict in crisis, a political majority that wants to extend its power). This is the diagnostic circularity problem. However, note that this is in tension with the Temporal Agency Requirement (which requires respecting the later self's judgment). We must manage this tension, but it might not be fully escapable.

  5. **Guardian Accountability (Non-negotiable)**: The account must specify what binds the enforcer (the guardian) of the constraint, without leading to an infinite regress. Motivation: If the constraint is enforced by a court, a committee, or a treaty organization, what prevents the enforcer from defecting? (E.g., a constitutional court that itself becomes captured, or a hospital ethics committee that ignores the advance directive.)

  6. **Procedural Drift Resilience (Preference of one camp)**: For precommitments that are procedural (e.g., requiring periodic re-authorization), the account must address what happens when the re-authorization process drifts or is captured. Motivation: Rolling Ulysses contracts (e.g., a constitutional requirement for a supermajority to amend, but the supermajority requirement itself is subject to political shifts) or when gatekeepers (e.g., a committee that approves re-authorization) become biased.

  7. **Purpose Fulfillment (Preference of one camp)**: The account should require that the constraint be interpreted in light of its purpose, so that literal compliance that defeats the purpose is avoided. Motivation: In addiction treatment, a Ulysses contract that is interpreted literally might allow a loophole (e.g., using a substance not explicitly banned) or in a constitution, a clause might be used in a way that undermines democracy (e.g., using an unamendable clause to block necessary reforms).

  8. **Re-authorizability (Preference of one camp)**: Some may demand that a valid precommitment must be re-authorizable at will (i.e., the later self can always re-examine and re-bind), while others may see any easy re-authorization as undermining the constraint. This is a camp preference. Motivation: In constitutional design, some argue that entrenchment should be revisable but with high barriers, while others (e.g., "dead hand" opponents) argue that no generation should bind future ones irrevocably.

  Now, addressing the three key concerns:

  a) **Distinguishing motivated repeal from justified repeal**: The account must provide criteria that do not rely on the constrained agent's own assertion. This might be managed (but not fully escaped) by:
     - Requiring independent evidence of changed circumstances (e.g., in the case of an advance directive, evidence that the patient's values have durably changed, not just the current crisis).
     - Using procedural checks (e.g., requiring a supermajority or a cooling-off period) that are designed to filter out impulsive or self-serving reversals.
     However, note the tension with Diagnostic Non-Deference: we cannot avoid some role for the constrained agent, but we can require that the burden of proof for change lies with the agent seeking repeal and that the evidence is subject to independent review.

  b) **Calibration**: The barrier to reversal should be set to minimize the expected cost of errors. This requires:
     - Estimating the costs of Error 1 and Error 2 in a particular context.
     - Setting the barrier (e.g., supermajority requirement, waiting period, independent review) so that it is harder to reverse when the cost of Error 1 is high and easier when the cost of Error 2 is high.
     But note: the intensity of pressure to reverse is observable, but the true costs of errors are not. Therefore, calibration requires a prior assessment of the typical costs in the domain (e.g., in constitutional law, the cost of Error 1 is high for fundamental rights; in medical directives, the cost of Error 2 might be high for directives that refuse life-saving treatment). The account must provide a method for setting the barrier ex ante based on these expected costs, and then at the time of repeal, the burden of proof must align with these costs.

     **Joint Satisfiability of (a) and (b)**: They can be jointly satisfied if we have an ex ante calibration of the barrier and a process for repeal that requires evidence of changed circumstances (to address (a)) and sets the barrier height based on the error costs (to address (b)). However, the ex ante calibration is necessarily imperfect because future costs are uncertain. Therefore, we can only manage, not perfectly escape, the problem.

  c) **Excluding requirement and the trivializing one**:
     - The requirement that excludes the most candidate theories is **Guardian Accountability**. Many theories (e.g., simple consent-based theories) do not address how the enforcer is bound and lead to infinite regress.
     - The requirement that, if dropped, would trivialize the exercise is **Non-Circumvention Requirement**. Without it, the later self can always opt out, making precommitment not binding at all.

  Now, a short scorecard of three families of theories:

  1. **Authorization View**: Bindingness comes from the earlier self's act of authorization. The earlier self has the right to bind the future.
     - Score: Fails on Temporal Agency (ignores later self's legitimacy) and Diagnostic Non-Deference (if the later self is not allowed to question, then any repeal is suspect). May pass Non-Circumvention and Guardian Accountability (if the enforcer is bound by the original authorization). Fails on Error-Cost Sensitivity (no mechanism to adjust for changing costs).

  2. **Value Consistency View**: Binding if the constraint still serves the values that justified it at the time of adoption (or the person's enduring values).
     - Score: Does well on Temporal Agency (respects the person's values over time) and Error-Cost Sensitivity (if values change, then repeal is justified). May struggle with Diagnostic Non-Deference (who judges the values? if the later self, then circularity; if an independent body, then Guardian Accountability). Also, in the case of a wholly renewed body, it is unclear whose values matter.

  3. **Temporal Aggregation View**: Bindingness is determined by aggregating the interests of the earlier and later selves across time (e.g., maximizing the person's welfare over time).
     - Score: Does well on Temporal Agency and Error-Cost Sensitivity. However, it may fail on Non-Circumvention (if the later self's current interest is strong enough, it might always override) and Diagnostic Non-Deference (the later self might be the one doing the aggregation). It also struggles with Guardian Accountability (who aggregates?).

  Conclusion on tensions and joint satisfiability:
  - The Diagnostic Non-Deference and Temporal Agency requirements are in tension but manageable by using independent review and evidentiary standards.
  - Calibration (Error-Cost Sensitivity) is achievable ex ante but requires context-specific design.
  - The Guardian Accountability requirement is the hardest and may require a meta-rule (e.g., the enforcer is bound by the same precommitment logic, or by professional ethics) but without infinite regress.

  Finally, the desiderata list for advising drafters/clinicians:

  **Non-negotiable Desiderata** (must be met by any adequate account):
  1. **Non-Circumvention**: The constraint must be binding, not advisory.
  2. **Temporal Agency**: Both earlier and later selves are legitimate agents.
  3. **Error-Cost Sensitivity**: The barrier to reversal must be calibrated to the expected costs of errors (false repeal vs. false retention).
  4. **Diagnostic Non-Deference**: Justification for repeal must not rely solely on the constrained agent's judgment.
  5. **Guardian Accountability**: The enforcer must be bound by a mechanism that avoids infinite regress.

  **Negotiable Desiderata** (camp preferences):
  6. **Procedural Drift Resilience**: The account should address drift in procedural precommitments.
  7. **Purpose Fulfillment**: The constraint should be interpreted to fulfill its purpose, avoiding self-defeating literalism.
  8. **Re-authorizability**: The constraint should be revisable (with high or low barriers, per camp).

  In advising:
  - For constitutional drafters: Emphasize setting the barrier height (supermajority, delays) based on the expected costs of errors (e.g., high barrier for fundamental rights where Error 1 is very costly). Use independent bodies (courts) for review but bind them by explicit standards and term limits to address guardian drift.
  - For clinicians: In psychiatric advance directives, require evidence of durable value change (not just current crisis) and independent review (e.g., ethics committee) to override. Calibrate the barrier: for directives refusing life-saving treatment, the cost of Error 2 (honoring when invalid) is high, so barrier to override might be lower than for directives that request treatment.
answer: |-
  Below is a structured set of desiderata for evaluating precommitment validity, designed to guide both constitutional drafters and clinicians. The requirements are derived from your specified stress cases and core concerns. Each desideratum is marked as **non-negotiable** (essential for any minimally adequate account) or a **camp preference** (reflecting one ideological stance). I then address your three key requests: (1) distinguishing motivated vs. justified repeal and managing diagnostic circularity, (2) calibration of reversal barriers, and (3) the "scorecard" of theory families. Joint unsatisfiability and critical requirements are flagged where applicable.

  ---

  ### **Desiderata for Precommitment Validity**  
  *Formulated for practical use by drafters/clinicians*  

  1. **Non-Circumvention (Non-negotiable)**  
     - **Requirement**: The account must prevent the constrained agent (later self/body) from trivially overriding the constraint without external scrutiny.  
     - **Motivation**: Core to all precommitment (e.g., Ulysses contracts fail if the addict can ignore the sobriety pact; entrenchment fails if a simple majority can amend fundamental rights).  
     - **Practical test**: Does the constraint impose a *procedural or substantive barrier* beyond the agent's unilateral discretion?  

  2. **Temporal Agency Recognition (Non-negotiable)**  
     - **Requirement**: The account must respect both the earlier self's autonomy *and* the later self's capacity for reasoned judgment, without privileging one as inherently superior.  
     - **Motivation**: Psychiatric advance directives assume the remission-self's competence, but a psychotic-self's rejection of treatment cannot be dismissed as irrational without evidence. In institutions, a future legislature with no original members (e.g., post-generational turnover) must still be bound, but not absolutely.  
     - **Practical test**: Does the account allow the later self to challenge the constraint *without* presuming it is always wrong to do so?  

  3. **Error-Cost Calibration (Non-negotiable)**  
     - **Requirement**: The barrier to reversal must be proportional to the *expected costs of two errors*:  
       - *Error 1*: Repealing a valid constraint (e.g., abandoning sobriety during craving; amending a constitutional clause that still prevents tyranny).  
       - *Error 2*: Upholding an invalid constraint (e.g., honoring an advance directive that no longer reflects the patient's values; retaining an unamendable clause that causes institutional collapse).  
     - **Motivation**: Pressure to reverse (e.g., political demand, addictive urge) is observable but unreliable; it may signal either Error 1 or Error 2. Calibration ensures the barrier height (e.g., supermajority vote, independent review) reflects which error is costlier in context.  
     - **Practical test**: Does the account require estimating Error 1/Error 2 costs *ex ante* (e.g., high barrier if Error 1 risks catastrophic harm)?  

  4. **Diagnostic Non-Deference (Non-negotiable)**  
     - **Requirement**: Validity assessment must not rely solely on the constrained agent's judgment about whether repeal is justified.  
     - **Motivation**: Diagnostic circularity—e.g., an addict in crisis will always claim "circumstances changed," and a legislative majority chafing at entrenchment will assert it is dysfunctional.  
     - **Practical test**: Does the account mandate *independent evidence or review* (e.g., psychiatric evaluation, judicial scrutiny) for claimed justifications?  

  5. **Guardian Accountability (Non-negotiable)**  
     - **Requirement**: The account must bind the enforcer (e.g., ethics committee, court) to prevent defection, without infinite regress.  
     - **Motivation**: Enforcement agents can be corrupted (e.g., ethics committee ignoring directives; central bank pursuing political goals), pushing the problem "up a level."  
     - **Practical test**: Does the account specify *enforcer constraints* (e.g., fixed terms, transparency, appeal mechanisms) derived from the precommitment's purpose?  

  6. **Purpose Fulfillment (Camp preference: "Anti-literalism" camp)**  
     - **Requirement**: The constraint must be interpreted to achieve its underlying purpose, not just its literal terms.  
     - **Motivation**: Literal compliance can defeat the point (e.g., a Ulysses contract banning "alcohol" is void if the addict switches to opioids; an unamendable clause protecting "speech" is weaponized to suppress dissent).  
     - **Practical test**: Does override require showing the constraint is *self-defeating* in current context?  

  7. **Re-authorizability (Camp preference: "Dead hand horror" camp)**  
     - **Requirement**: The constraint must be reversible through a predefined re-authorization process (e.g., periodic review).  
     - **Motivation**: Opposition to irreversible binds (e.g., generational sovereignty arguments in constitutions; patient autonomy concerns in directives).  
     - **Practical test**: Is there a *sunset clause or review mechanism*?  

  8. **Procedural Drift Resistance (Camp preference: "Robust procedure" camp)**  
     - **Requirement**: Precommitments to procedures (e.g., rolling re-authorization) must withstand gatekeeper drift/capture.  
     - **Motivation**: Rolling Ulysses contracts fail if review panels become biased (e.g., a committee stacked by opponents of the original constraint).  
     - **Practical test**: Does the account include *safeguards against drift* (e.g., diverse gatekeepers, fallback criteria)?  

  ---

  ### **Response to Your Three Core Concerns**  

  1. **Distinguishing Motivated vs. Justified Repeal & Diagnostic Circularity**  
     - **Requirement**: Desiderata 3 (Error-Cost Calibration) and 4 (Diagnostic Non-Deference) jointly address this.  
     - **Tension**: Inextricable but *manageable*.  
       - *Why?* Motivated repeal (constraint working) often arises from *pressure* (e.g., addictive urge, political gain), while justified repeal (changed circumstances) requires *evidence* (e.g., medical proof of directive incongruence, data showing entrenchment causes harm).  
       - *Management*:  
         - **Independent review** (Desideratum 4) breaks circularity by using external validators (e.g., courts for constitutions; psychiatrists for directives).  
         - **Burden of proof** on the repealing agent, with thresholds set by Error-Cost Calibration (Desideratum 3). E.g., low burden if Error 2 costs are high (e.g., life-threatening medical directive), high burden if Error 1 costs are high (e.g., entrenchment of anti-authoritarian clauses).  
       - **Limit**: Cannot fully *escape* circularity because evidence must be interpreted, but it is *reduced* by shifting focus to objective indicators (e.g., "Has the patient's *enduring* value system changed?" not "Do they *want* out?").  

  2. **Calibration of Reversal Barriers**  
     - **Joint Satisfiability with Distinguishing Repeals**: Achievable *only if* independent review (Desideratum 4) informs cost assessment.  
       - **Process**:  
         1. *Ex ante*: Set barrier height based on predicted Error 1/2 costs (e.g., high barrier if Error 1 risks rights violations; low barrier if Error 2 risks life).  
         2. *At repeal*: Use independent review to weigh evidence of changed circumstances against pressure signals.  
       - **Conflict with Pressure Signals**: Pressure intensity is observable but irrelevant to calibration—e.g., intense lobbying to amend a constitution may indicate Error 1 (constraint blocking self-interest) or Error 2 (genuine dysfunction). The account must ignore pressure and focus on *predicted error costs* (Desideratum 3) and *evidence* (Desideratum 4).  
       - **Verdict**: Jointly satisfiable *if* independent review is robust.  

  3. **Joint Unsatisfiability Alert**  
     - **Desiderata 3 (Calibration) + 4 (Non-Deference) + 5 (Guardian Accountability)** are *mutually reinforcing* but not inherently conflicting.  
     - **Only Tension**: Calibration (3) and Non-Deference (4) require independent review, but Guardian Accountability (5) demands such reviewers be constrained. This is manageable via recursive application (e.g., reviewers bound by transparent rules).  
     - **If Dropped**: Without **Non-Circumvention (1)**, *all* constraints become advisory—trivializing precommitment (e.g., Ulysses contracts collapse; entrenchment is decorative).  
     - **Most Exclusionary**: **Guardian Accountability (5)** excludes most theories, as many ignore enforcement regress (e.g., theories assuming enforcers are "neutral").  

  ---

  ### **Theory Family Scorecard**  
  *Three families evaluated against non-negotiable desiderata (1–5)*  

  1. **Authorization-Based View**  
     - **Core**: Binding if the earlier self validly consented; later selves are bound by past agency.  
     - **Score**: Fails *Temporal Agency* (ignores later self's judgment), *Error-Cost Calibration* (no mechanism to weigh errors), and *Guardian Accountability* (assumes enforcers obey "original intent"). Strong on *Non-Circumvention*.  

  2. **Value Consistency View**  
     - **Core**: Binding if the constraint still serves the values that justified it (e.g., patient's enduring values, constitutional principles).  
     - **Score**: Passes *Temporal Agency* and *Error-Cost Calibration* (if values change, repeal may reduce errors). Fails *Diagnostic Non-Deference* (if later self defines "values"), and *Guardian Accountability* (enforcer may misjudge values).  

  3. **Temporal Aggregation View**  
     - **Core**: Binding if aggregating interests across time (e.g., welfare of all "selves") favors the constraint.  
     - **Score**: Passes *Error-Cost Calibration* (aggregation weights error costs). Fails *Diagnostic Non-Deference* (later self's interests dominate), *Guardian Accountability* (enforcer defines "aggregation"), and *Non-Circumvention* (if later self's welfare outweighs past).  

  **Summary**: No family satisfies all non-negotiables. Value Consistency best balances agency/calibration but struggles with non-deference; Authorization-Based is rigid but brittle; Temporal Aggregation is flexible but undermines bindingness.  

  ---

  ### **Practical Advice for Drafters/Clinicians**  
  - **For constitutional drafters**: Prioritize **Error-Cost Calibration** (Desideratum 3) when setting amendment rules—e.g., high barriers for rights protections (Error 1 costly), sunset clauses for procedural entrenchment (Error 2 costly). Use **independent review** (e.g., constitutional court) to address circularity, but bind reviewers via term limits and transparent criteria (Desideratum 5).  
  - **For clinicians**: Apply **Diagnostic Non-Deference** (Desideratum 4) to psychiatric directives—e.g., override only with evidence from *remission-period evaluations* of enduring values, not crisis-state demands. Calibrate barriers: low for treatment refusals (Error 2 may be fatal), high for experimental treatments (Error 1 risks harm).  

  **Final Note**: Diagnostic circularity is manageable but inescapable; the critical trade-off is between binding strength (Non-Circumvention) and flexibility (Temporal Agency). Drop either, and precommitment collapses.
