prompt: |-
  I am writing a paper on slurs, and I keep finding that the literature advances one example at a time: a case is produced and offered as decisive for or against a whole framework. I want the specification before the verdicts.

  Write the desiderata list: what any adequate theory of slurs has to deliver. Fix the purpose as two jobs at once — (a) a predictive job: for an arbitrary expression in an arbitrary language, say whether it is a slur, which group it targets, and roughly where it sits on a scale of offensiveness; and (b) a normative job: say what, if anything, is wrong with a particular utterance of it, when uttered by whom and to whom, and what an appropriate response would be. If no single theory can do both, say so, tell me which job to give up, and what a theory stripped of the other job should look like.

  For each requirement give the case or consideration that motivates it, and mark it as non-negotiable or as a preference internal to one research programme. At a minimum I want requirements motivated by the following, which I have not seen handled together:

  1. A language has an ordinary word for an ethnic group; philologists establish it began life as a slur, but no living speaker — including members of the group — knows this.
  2. A speaker coins a group-directed derogatory expression on the spot, which hearers have never encountered but instantly read as hostile and as aimed at a group: a neutral group label with a pejorative affix, a mocking imitation of the group's accent, or a gesture.
  3. A slur is borrowed into a second language where it functions as a neutral or affectionate in-group label; it is uttered by a member of the borrowing community and overheard by someone from the community of origin, and the two hearers diverge completely.
  4. The slur is the only term in common use for the group; the official alternative is clinical, archaic, or offensive in some other way.
  5. The slur is applied to someone who is not a member of the target group, or it encodes a taxonomy the relevant science rejects.
  6. The same lexical item under negation, in the antecedent of a conditional, in a question, in reported speech, in quotation, and in a linguistics lecture about slurs — where offense seems to survive non-assertoric embedding but attenuates differently in each.
  7. In-group members use it as a term of endearment while out-group members cannot, including in quotation; and reclamation sometimes occurs without anyone deciding anything.
  8. Successor terms acquire the offense of the terms they replaced, and some slurs lose their group-specific content and become general-purpose insults.
  9. Group-directed contempt conveyed by prosody, gesture, or pronoun misuse, with no distinctive lexical item.
  10. Group-directed insults for voluntarily joined groups, for dominant groups, and for occupational or regional categories.

  Say which distinctions the theory must respect rather than collapse: slur versus pejorative versus epithet versus profanity; targeting versus referring versus predicating; content versus force versus uptake versus harm versus wrongness; a norm against use versus a difference in meaning; type-level versus token-level facts; binary versus graded offense. Note any findings from sociolinguistics the theory may not contradict.

  Then flag any subset of your own desiderata you suspect cannot be jointly satisfied — that is the part I most want — and name the single requirement that excludes the largest share of the current candidates. If it helps, close with a short table scoring the four standard families (derogation as truth-conditional content, as a conventional implicature or expressive dimension, as a pragmatic inference, or as the violation of a use-prohibition) against the list, and say what observation would settle the two disagreements that matter most. A table is fine; keep the argumentative weight on the criteria.
reasoning: |-
  Okay, let me tackle this complex request about slur theory desiderata. The user is clearly deeply engaged in philosophical linguistics and frustrated with piecemeal approaches. They want a systematic framework that handles both predictive and normative dimensions, with special attention to ten tricky cases that existing literature often overlooks.

  Hmm, the core challenge is balancing two potentially incompatible jobs: predicting what counts as a slur versus judging the morality of specific utterances. I should start by acknowledging this tension upfront - it's likely no single theory can perfectly do both. The predictive task requires objective linguistic markers while normative judgments depend heavily on context and speaker-hearer dynamics.

  For the desiderata list, each of their ten cases needs careful treatment. Take #1: the historical slur no one recognizes. This suggests offensiveness isn't inherent in etymology but depends on community awareness. That's non-negotiable for prediction. Then #2 with improvised slurs shows that morphological patterns and paralinguistic cues can instantly convey derogation - crucial for the predictive framework. 

  The bilingual conflict in #3 is particularly thorny. When a borrowed term has divergent meanings, normative judgments must account for both contexts simultaneously. This might require splitting the two jobs - prediction could note both usages while normative assessment would need relativity clauses. 

  #7 about reclaimed slurs is equally tricky. The in-group/out-group asymmetry suggests any adequate theory must incorporate speaker identity dynamically. And the spontaneous reclamation phenomenon undermines theories requiring formal reclamation ceremonies. 

  I'm noticing several irreconcilable tensions. Most glaringly: the predictive job wants stable linguistic criteria for slurhood (#2, #9), while normative judgments require context-sensitivity (#3, #6, #7). Also, #5 (misapplied slurs) breaks the link between word meaning and actual group membership. 

  The table comparing theoretical approaches will reveal this clearly. Truth-conditional theories fail #6 (embedding) spectacularly. Pragmatic approaches struggle with #2 (spontaneous slurs). Use-prohibition theories can't explain #3 (cross-linguistic variation). 

  Ultimately the user must choose which job to prioritize. If keeping both, I'd recommend a hybrid model with predictive linguistic markers supplemented by contextual normative parameters. But the admission ticket is clearly #2 - any theory that can't handle improvised slurs fails the predictive task fundamentally.
answer: |-
  Here is a comprehensive set of desiderata for a theory of slurs, structured to meet your requirements, with explicit distinctions, tensions flagged, and scoring of major theoretical families.

  ---

  ### **Core Desiderata: The Two Jobs**
  1.  **Predictive Job:** For any expression in any language, determine:
      *   Whether it is a slur.
      *   Which group(s) it targets.
      *   Its approximate position on a scale of offensiveness (relative to other slurs/terms for the same group).
      *   *Non-negotiable for a predictive theory.*

  2.  **Normative Job:** For any utterance of a slur, determine:
      *   What (if anything) is morally/pragmatically wrong.
      *   How speaker/hearer identity affects wrongness/offense.
      *   What constitutes an appropriate response.
      *   *Non-negotiable for a normative theory.*

  **Core Tension:** A theory maximizing predictive power (relying on stable semantic/pragmatic features) will struggle with context-dependent normative judgments (#3, #6, #7). A theory maximizing normative nuance (relying on speaker intention, hearer uptake, social context) will struggle with stable predictive criteria (#1, #2, #4, #9). **Priority Recommendation:** Give up a *monolithic* normative job. Adopt a predictive core theory, supplemented by *contextual parameters* (speaker identity, audience, utterance context) for normative assessment. A "stripped" normative theory becomes a framework for evaluating contextual harm/appropriateness *given* the predictive classification.

  ---

  ### **Desiderata Motivated by Specific Cases & Considerations**

  1.  **Historical Ignorance:**
      *   *Requirement:* An expression must be classifiable as a slur *without* relying on known historical etymology by current speakers. Current conventional force trumps origin.
      *   *Motivation:* Case #1 (Unknown historical slur origin).
      *   *Status:* Non-negotiable (Predictive). Undermines theories requiring speaker knowledge of derogatory history.

  2.  **Spontaneous Generation:**
      *   *Requirement:* The theory must explain how novel expressions (e.g., neutral label + pejorative affix, mocking accent imitation, gestures) can be instantly recognized *as slurs* targeting a specific group, based on linguistic/paralinguistic structure and context.
      *   *Motivation:* Case #2 (On-the-spot coinage).
      *   *Status:* **The Admission Ticket** (Non-negotiable, Predictive). Eliminates theories relying solely on conventional lexical meaning or prior exposure. Favors compositional or pragmatic mechanisms.

  3.  **Cross-Linguistic/Community Divergence:**
      *   *Requirement:* The theory must account for the same lexical item functioning as a severe slur in Community A but neutrally/affectionately in Community B, and explain the legitimacy of divergent hearer reactions (#3 overhearer divergence).
      *   *Motivation:* Case #3 (Borrowed slur with divergent meaning).
      *   *Status:* Non-negotiable (Predictive & Normative). Demands relativity to linguistic community/conventions. Undermines theories positing invariant semantic derogation.

  4.  **Lack of Neutral Counterpart:**
      *   *Requirement:* The theory must explain the offensiveness of a slur even when it is the *only* commonly available or non-problematic term for the group, and account for how offense persists despite pragmatic necessity.
      *   *Motivation:* Case #4 (Only common term; clinical/archaic alternative).
      *   *Status:* Non-negotiable (Predictive & Normative). Shows offense isn't solely derived from choosing the slur *over* a neutral term.

  5.  **Misapplication & False Taxonomies:**
      *   *Requirement:* The theory must explain the offensiveness of a slur when applied to non-members or when based on scientifically rejected categories, without relying on truth-conditional falsity.
      *   *Motivation:* Case #5 (Applied to non-member, false taxonomy).
      *   *Status:* Non-negotiable (Predictive & Normative). Shows derogation attaches to the *term/use* and its associated attitudes, not truth conditions or accurate reference.

  6.  **Embedding Resilience & Attenuation:**
      *   *Requirement:* The theory must explain why offense typically persists (though often attenuated) under negation, conditionals, questions, reported speech, quotation, and metalinguistic discussion (#6), while accounting for differences in attenuation across these contexts.
      *   *Motivation:* Case #6 (Non-assertoric contexts).
      *   *Status:* Non-negotiable (Predictive & Normative). Critical test for semantic vs. pragmatic vs. prescriptive accounts. Rejects theories predicting complete cancellation in non-assertoric contexts.

  7.  **In-Group Use & Reclamation:**
      *   *Requirement:* The theory must explain the asymmetry: why in-group use can be non-offensive/affectionate while out-group use is offensive (#7), including in quotation. It must also account for both organized and organic ("no one decided") reclamation.
      *   *Motivation:* Case #7 (In-group endearment, reclamation).
      *   *Status:* Non-negotiable (Normative, Predictive Challenge). Demands speaker-group identity as a core parameter. Undermines theories where derogation is solely lexical/conventional meaning.

  8.  **Offense Transfer & Generalization:**
      *   *Requirement:* The theory must explain how successor terms can rapidly acquire the offense of the terms they replace, and how some slurs lose group-specific content to become general insults.
      *   *Motivation:* Case #8 (Successor terms, generalization).
      *   *Status:* Non-negotiable (Predictive). Highlights the role of socio-historical association and pragmatic enrichment over fixed semantics.

  9.  **Non-Lexical Derogation:**
      *   *Requirement:* The theory must encompass group-directed contempt conveyed solely through prosody, gesture, or pronoun misuse (e.g., deliberate misgendering), without a dedicated slur word.
      *   *Motivation:* Case #9 (Derogation without distinct lexicon).
      *   *Status:* Non-negotiable (Predictive & Normative). Shows the phenomenon extends beyond specific lexical items to expressive modes targeting group identity.

  10. **Target Group Scope:**
      *   *Requirement:* The theory must handle slurs targeting voluntarily joined groups, dominant groups (e.g., "cracker"), and occupational/regional categories, not just involuntary, marginalized ethnic/racial/gender groups.
      *   *Motivation:* Case #10 (Voluntary, dominant, occupational targets).
      *   *Status:* Non-negotiable (Predictive). Ensures the account isn't limited to paradigmatic cases.

  ---

  ### **Required Distinctions (Do Not Collapse)**
  *   **Slur vs. Pejorative vs. Epithet vs. Profanity:** Slurs specifically target groups based on inherent/immutable characteristics with strong social weight; pejoratives express negative attitudes more broadly; epithets are often interchangeable with slurs but can be non-group; profanity relates to taboo, not necessarily group hatred.
  *   **Targeting vs. Referring vs. Predicating:** Targeting is the act of directing derogation *at* a group via the term. Referring is denoting the group. Predicating attributes properties. Slurs primarily *target* via referring.
  *   **Content vs. Force vs. Uptake vs. Harm vs. Wrongness:** Distinguish semantic content (if any), illocutionary force (e.g., derogating act), perlocutionary effect (harm/offense felt), and moral wrongness (which may exceed mere offense).
  *   **Norm Against Use vs. Difference in Meaning:** Is the prohibition primary, or is it a consequence of what the word *means*? This is a core theoretical divide.
  *   **Type-Level vs. Token-Level Facts:** Distinguish properties of the word-type (e.g., conventional offensiveness) from properties of specific utterances (e.g., harm caused in context).
  *   **Binary Offense vs. Graded Offense:** Offense is not all-or-nothing; it varies in intensity based on word, context, speaker, hearer, and history.

  **Sociolinguistic Constraints:** The theory *must not contradict* findings on:
  *   Reclamation dynamics and in-group variation.
  *   Rapid semantic shift/pragmatic enrichment of slurs.
  *   The role of power asymmetries in determining offensiveness.
  *   Community-specific norms and conventions.

  ---

  ### **Tensions & Suspected Incompatibilities**
  1.  **Fundamental Tension:** **Predictive Stability vs. Normative Context-Sensitivity.** A theory tightly specifying lexical/semantic features for prediction (#1, #2, #4, #8, #9, #10) will struggle with the radical context-dependence required for nuanced normative judgments (#3, #6, #7).
  2.  **Specific Conflicts:**
      *   **#2 (Spontaneous Slurs) vs. Conventional Meaning Theories:** Theories relying on conventionalized lexical semantics (CI, Truth-Conditional) struggle severely here. Pragmatic or use-prohibition theories handle it better.
      *   **#3 (Cross-Linguistic Divergence) vs. Invariant Semantic Derogation:** Truth-Conditional and Conventional Implicature (CI) theories struggle. Expressive, Pragmatic, or Use-Prohibition theories handle it better.
      *   **#7 (In-Group Use) vs. Semantic/Conventional Derogation:** Truth-Conditional, CI, and simple Expressive theories struggle to explain asymmetry without significant modification. Pragmatic and Use-Prohibition theories handle it more naturally.
      *   **#6 (Embedding) vs. Pure Pragmatic/Use-Prohibition Theories:** Theories reducing slurs to generalized implicatures or pure prohibitions struggle to explain the *persistence* and *systematic attenuation* of offense in embeddings. Semantic (TC, CI, Expressive) theories handle persistence better but struggle with attenuation/variation.

  **The Single Most Excluding Requirement:** **#2 (Spontaneous Generation).** This requirement eliminates theories that cannot explain how a *novel*, structurally transparent expression can *immediately* function as a recognizable group-directed slur based on composition and context. It most severely challenges **Truth-Conditional** and **Conventional Implicature** theories, which rely on fixed, conventionalized meanings. It also challenges simple **Use-Prohibition** theories that lack an account of *why* a novel term instantly falls under a prohibition. **Pragmatic** and **Expressive** theories (especially if compositional) handle this best.

  ---

  ### **Scoring Major Theoretical Families**
  | Theory Type                 | Predictive Power (P) | Normative Nuance (N) | Key Strengths                          | Key Weaknesses                         | Handle #2? |
  | :-------------------------- | :------------------- | :------------------- | :------------------------------------- | :------------------------------------- | :--------- |
  | **1. Truth-Conditional**    | Low-Moderate         | Low                  | Simple, handles some misapplication (#5) | Fails embedding (#6), in-group use (#7), divergence (#3), spontaneity (#2) | ❌         |
  | (e.g., Hom, Anderson/Lepore)|                      |                      |                                        |                                        |            |
  | **2. Conventional Implicature** | Moderate           | Low-Moderate         | Handles embedding persistence (#6)     | Fails spontaneity (#2), divergence (#3), in-group use (#7), attenuation in embeddings | ❌         |
  | (e.g., Potts)               |                      |                      |                                        |                                        |            |
  | **3. Pragmatic**            | **High**             | **High**             | Best handles spontaneity (#2), context (#3, #7), embedding variation, reclamation (#7) | May struggle with embedding *persistence* (vs. cancellation), requires complex contextual parameters | ✅         |
  | (e.g., Camp, Nunberg)       |                      |                      |                                        |                                        |            |
  | **4. Use-Prohibition**      | Moderate             | Moderate             | Handles divergence (#3), no-neutral-term (#4), social wrongness | Struggles with spontaneity (#2), embedding (#6), explaining *why* prohibited (needs supplement), graded offense | ⚠️ (Maybe) |
  | (e.g., Anderson/Lepore alt, Hornsby) |                |                      |                                        |                                        |            |
  | **5. Expressive (Non-CI)**  | Moderate-High        | Moderate             | Handles embedding persistence, spontaneity (if compositional), force | May struggle with in-group use (#7), divergence (#3), attenuation | ✅ (If comp) |
  | (e.g., Schlenker, Gutzmann) |                      |                      |                                        |                                        |            |

  **Key to Scores:** ✅ = Handles Well, ⚠️ = Handles Partially/With Difficulty, ❌ = Fails

  **Settling the Key Disagreements:**
  1.  **Pragmatic vs. Semantic (CI/Expressive) on Embedding (#6):** Does offense *systematically attenuate but persist* in non-assertoric contexts (e.g., conditionals, questions, quotation)? **Empirical Test:** Rigorous experimental pragmatics measuring perceived offensiveness across diverse embeddings and contexts. Evidence of systematic, context-sensitive attenuation favors Pragmatic; evidence of robust persistence favors Expressive/CI.
  2.  **Pragmatic/Expressive vs. Use-Prohibition on Spontaneity (#2):** Can a novel, structurally transparent expression (e.g., "X-ite" said contemptuously about group X) be reliably interpreted as a slur *on first encounter*? **Empirical Test:** Psycholinguistic experiments presenting novel derogatory formations in context and measuring speed/accuracy of interpretation as group-targeting slurs vs. mere insults. Evidence of immediate group-targeting interpretation favors Pragmatic/Expressive mechanisms over simple prohibition.

  **Conclusion:** No single theory satisfies all desiderata perfectly. **#2 (Spontaneous Generation)** is the most stringent filter. A **Hybrid Pragmatic-Expressive** theory (leveraging compositionality of expressives and context-sensitivity of pragmatics) currently has the broadest coverage, especially on prediction. Normative assessment requires supplementing this predictive core with contextual parameters (speaker identity, audience, historical/social context, intention, uptake). Giving up the aspiration for a *single, monolithic* normative rule in favor of a parameterized contextual framework is the most promising path forward.
