prompt: |-
  I've been going back and forth in the usual places — a forecasting Slack, some Astral Codex Ten comment threads, a reading group that ground its way through Ellsberg — about whether a rational agent can really have indeterminate credences, or whether, as people in those circles like to say, your uncertainty about a probability is itself just another probability and "imprecise credence" is either incoherent or redundant notation. I've drifted toward the imprecise-probability side without being able to say exactly what I'm signing up for, and my use case is narrow enough that I'd rather have the spec than the menu: I want to represent genuine severe uncertainty in catastrophic-risk estimates, where several credible models disagree, nobody will commit to a prior over the models, and yet a decision has to come out the other end — plus a side interest in what it would mean for a forecaster to be *calibrated* while reporting an interval rather than a number. So: write me the requirements list — what a theory of indeterminate or imprecise credence would have to deliver to be adequate for that job, with the case or consideration behind each requirement, and with a verdict on which are non-negotiable conditions of adequacy and which are just preferences of a particular camp. The items I keep coming back to, which you should feel free to reorganize, drop, or replace with better ones:

  - a principled way to tell imprecision apart from risk aversion or from exotic tastes, so that the framework doesn't become a garbage can into which any deviation from expected-utility behavior can be dumped and reinterpreted as a belief;
  - the cases where imprecision is clearly *warranted* (a coin of wholly unknown bias, an urn of unknown composition, a one-off institutional collapse) versus the cases where it should have washed out (the same coin after a thousand flips, a model with a long calibration record) — and whether "imprecision should shrink as evidence accumulates" is a genuine requirement or merely a hope;
  - an updating story: do you condition each element of the representor separately, update the lower envelope as a whole, or appeal to something like natural extension — and what to say about the phenomenon where learning something you already knew would happen *widens* your interval for something else. Concretely: suppose two admissible priors disagree about a coin's bias but agree that the next toss is 50/50; once you learn the result of a toss, element-wise conditioning leaves you with a spread of posteriors for the following toss — from a sharp one-half to something like a third-to-two-thirds — and it widens whichever way the toss came out, so you know in advance that looking will make you less precise. Is that a reductio, a bullet to bite, or a sign that the representor was the wrong object to update?
  - dynamic consistency: whatever the updating rule, does the agent's plan survive contact with new evidence, or does the natural maximin-flavored decision rule plus conditioning lead you to avoid free information or reverse your own plans in sequential problems? I can't tell whether this is a theorem-shaped cost or a confusion, and I want to know which.
  - a decision rule, since a set of credences is not yet a decision theory: E-admissibility, maximizing the lower envelope, maximality/interval dominance, or full-blown choice functions — is coming with one part of the theory's job description, and what is the case that separates them (one where the lower envelope and admissibility disagree)? Include the collapse risks on both sides: a framework so permissive that nothing is choice-worthy, or one that secretly becomes ordinary Bayesianism with a prior over the set after all.
  - the shape of the representor: whether it should be convex, and if so why a mixture of two individually permissible priors should itself be permissible; whether it should be closed under conditioning; whether "the interval" is best read as suspension of judgment, as each element being individually acceptable, or as a distribution over distributions I decline to write down;
  - the distinction between sharpness and evidential weight — being exactly 50/50 on no evidence versus exactly 50/50 after a thousand trials — and whether a formalism with only sets in it has the resources to mark it, or whether that pushes you toward a separate dimension;
  - aggregation: two analysts report [0.2, 0.5] and [0.4, 0.8]; what is the group's interval, does pooling preserve whatever coherence conditions you imposed, and is there any coherent way to score an interval forecast for accuracy or to pay someone for reporting one honestly;
  - enough structure to be usable at all — behavior on continuous spaces, conditioning on events of probability zero, and whether the whole thing is implementable as something like a linear program rather than an existence proof.

  What I most want out of this is the negative part: tell me which subsets of the requirements look jointly unsatisfiable, since if the list itself is the interesting result, that's what I'd rather find out now. My suspicion is that there's a triangle in there — element-wise conditioning, no dilation, and dynamic consistency under a cautious decision rule — where you can have any two, and I'd like to know whether that's right, what's actually proved versus merely asserted in the folklore, and which single requirement does the most work in eliminating candidate theories. Keep the weight on the criteria and their motivating cases; a line or two on how the main approaches fare against the list is fine, but skip the full scorecard and skip references entirely — I'll go find the literature myself once I know what I'm looking for.
reasoning: |-
  We are to design a requirements list for a theory of imprecise credences that must be adequate for representing severe uncertainty in catastrophic-risk estimates, with several credible models disagreeing and no commitment to a prior over models. The theory must also account for calibration of interval forecasts and provide a basis for decision-making. The user has provided a list of concerns, which we reorganize and refine into a set of requirements, marking each as non-negotiable (N) or preference (P). We also identify potential conflicts and which requirements are the most constraining.

  Requirements:

  1. **Distinguish Imprecision from Risk Attitudes (N)**: The framework must provide a clear separation between indeterminate beliefs (imprecise credences) and risk aversion or other non-belief aspects of decision-making (like exotic utility functions). Without this, the framework becomes a "garbage can" for any deviation from expected utility, which would undermine its purpose. The motivating case is to avoid conflating epistemic uncertainty (about the probability) with the agent's attitude toward that uncertainty.

  2. **Warrant for Imprecision and Its Dynamics (N)**: 
     - There must be a principled account of when imprecision is warranted (e.g., a coin of unknown bias, an urn of unknown composition, a one-off institutional collapse) versus when it should be reduced to a sharp probability (e.g., after many flips of the same coin, a model with a long calibration record). 
     - The theory must account for how evidence reduces imprecision: "imprecision should shrink as evidence accumulates" is a non-negotiable condition of adequacy for learning. However, the rate and manner of shrinkage may be context-dependent (P).

  3. **Updating Rule (N)**:
     - The theory must specify an updating rule (e.g., element-wise conditioning, updating the lower envelope, natural extension). 
     - It must also account for the phenomenon of dilation (where learning an outcome that was known to be possible widens the interval for a future event). The coin example provided (where after one toss, the interval for the next toss widens) must be addressed. The theory must either:
       (a) Explain why dilation is acceptable (a bullet to bite) and under what conditions it occurs, or 
       (b) Provide an updating rule that avoids it (if possible) without violating other requirements.
     - The updating rule should be defined for events of probability zero (if the representor includes continuous distributions) (N).

  4. **Dynamic Consistency (N)**: The updating rule and decision rule must be dynamically consistent. That is, an optimal plan formulated at an earlier time should remain optimal at a later time (after updating) unless new information warrants a change. The theory must not lead to avoiding free information or reversing plans in sequential decision problems. This is non-negotiable for a theory that aims to guide sequential decisions under severe uncertainty.

  5. **Decision Rule (N)**: The theory must come with a decision rule that maps imprecise credences to choices. The rule must be specified and justified. It should avoid two collapse risks:
     - Permissiveness: too many options are choice-worthy, leading to indecision.
     - Collapse to Bayesianism: the rule effectively becomes equivalent to having a single prior (e.g., by using a prior over the set of priors). 
     The rule must be applicable to the motivating case (catastrophic risks) and should be able to handle cases where the lower envelope and admissibility (E-admissibility) might disagree (e.g., a case where an option is optimal under some but not all priors in the set, and the agent must decide whether that is enough).

  6. **Structure of the Representor (P)**:
     - Convexity: Whether the set of priors (the representor) should be convex is a matter of debate. Convexity might be defended by the idea that if two priors are permissible, so should be any mixture (as mixtures represent a form of indecision). However, the user might have a preference for non-convex sets in some contexts. We mark this as a preference because non-convex sets might be used to represent a set of models that are not interpolable.
     - Closure under conditioning: The set should be closed under conditioning on events with positive lower probability? (This might be required for updating to be well-defined, but it is not always assumed.) This is a preference because it relates to the updating rule and the handling of zero-probability events.
     - Interpretation: The interval should be clearly interpretable (e.g., as the set of all probabilities that are not ruled out by the evidence, or as a set of individually acceptable probability functions). This is a non-negotiable for clarity, but the specific interpretation may be a preference.

  7. **Weight of Evidence vs. Sharpness (N)**: The formalism must be able to distinguish between sharp probabilities based on strong evidence (e.g., 50/50 after 1000 trials) and those based on no evidence (e.g., 50/50 for a coin of unknown bias). This is non-negotiable because without it, the interval alone does not capture the epistemic state. The theory must either represent this within the set-based formalism (e.g., by having a second-order structure) or by a separate dimension (which might push beyond sets).

  8. **Aggregation (P)**: The theory should provide a method to aggregate imprecise credences from multiple analysts (e.g., pooling [0.2,0.5] and [0.4,0.8] into a group interval). The method should preserve coherence conditions (if any) and should ideally be accompanied by a scoring rule for interval forecasts (for calibration and incentives). This is a preference because while necessary for group decision-making, the exact method might vary.

  9. **Implementability and Mathematical Structure (N)**:
     - The theory must be defined for continuous spaces and handle events of probability zero (if needed for the application). 
     - It should be computationally tractable (e.g., via linear programming) for practical use in catastrophic risk assessment. This is non-negotiable for real-world applications.

  Conflicts and Trade-offs:

  The user suspects a triangle: element-wise conditioning, no dilation, and dynamic consistency under a cautious decision rule. We analyze:

  - If we require element-wise conditioning (which is the most straightforward updating rule) and dynamic consistency, then dilation may occur. Dilation is not necessarily a reductio; it can be seen as a reflection of increased uncertainty after conditioning on an event that was known to be possible but not fully specified. However, in the coin example, it leads to the interval widening after a toss, which might be counterintuitive but not inconsistent. Some argue that dilation is acceptable and even necessary in some cases.

  - If we require no dilation and element-wise conditioning, then dynamic consistency might be sacrificed. For instance, an agent might avoid free information because it would widen the interval and make decisions harder. This would violate dynamic consistency.

  - If we require no dilation and dynamic consistency, then we might need a different updating rule (like updating the lower envelope as a whole via natural extension or using a set of posteriors that is not obtained by conditioning each prior). However, such rules might not satisfy element-wise conditioning and might lead to other issues (like not being responsive to evidence).

  Non-negotiable requirements that are particularly constraining:

  - Dynamic consistency (N) and updating (N) are fundamental. Without them, the theory cannot guide sequential decisions.

  - The requirement for a decision rule (N) that avoids collapse to Bayesianism (so that the imprecision is doing work) and permissiveness is also very constraining. The most common rules are:
     - Maximality (an option is choice-worthy if it is not dominated by any other option under any prior in the set)
     - E-admissibility (an option is choice-worthy if it is optimal under at least one prior in the set)
     - Maximizing the minimum expected utility (maximin) - but this is often criticized for being too conservative and conflating beliefs and risk attitudes.

  The requirement to distinguish imprecision from risk aversion (N) pushes against using maximin because maximin can be seen as extreme risk aversion. Thus, E-admissibility or maximality are more popular in the imprecise probability community.

  The requirement for evidence to reduce imprecision (N) and the updating rule (N) are also central. However, note that with element-wise conditioning, imprecision might not always shrink (due to dilation) and might even grow. So the requirement that imprecision shrinks with evidence might have to be relaxed in some cases (or we must accept that it doesn't always happen).

  Verdict on the triangle: The user's suspicion is correct. The three properties (element-wise conditioning, no dilation, dynamic consistency) are incompatible in general. You can have at most two.

  - Element-wise conditioning and dynamic consistency: then dilation may occur (as in the coin example).
  - Element-wise conditioning and no dilation: then dynamic consistency may fail (e.g., the agent might avoid free information).
  - No dilation and dynamic consistency: then we must abandon element-wise conditioning.

  Which single requirement does the most work? Dynamic consistency is a key condition that forces the updating rule and decision rule to be compatible. Without it, the theory would not be useful for sequential decisions (which are common in catastrophic risk management). Therefore, it is non-negotiable and highly constraining.

  How the main approaches fare:

  - The most common approach (e.g., Levi, Walley) uses a convex set of priors, element-wise conditioning, and a decision rule like E-admissibility or maximality. This approach accepts dilation and aims for dynamic consistency by careful choice of decision rule. However, dynamic consistency is not guaranteed for all decision rules (e.g., maximin may lead to dynamic inconsistency).

  - Another approach (e.g., using belief functions) might have different updating rules (like Dempster's rule) that avoid dilation but may violate element-wise conditioning and sometimes dynamic consistency.

  - Some new approaches (like using sets of posteriors that are not obtained by conditioning the prior set) are being explored to avoid dilation and maintain dynamic consistency, but they are less standard.

  Conclusion:

  The non-negotiable requirements are: 1, 2 (especially the dynamics of learning), 3 (updating rule and handling of dilation), 4 (dynamic consistency), 5 (decision rule that avoids collapse), 7 (weight of evidence), and 9 (implementability). Among these, dynamic consistency (4) and the updating rule (3) are the most constraining and lead to the identified triangle. The theory must choose between element-wise conditioning (leading to possible dilation) or an alternative updating rule that might break with the traditional conditioning. The decision rule must be chosen to be compatible with dynamic consistency (e.g., E-admissibility) and to avoid conflating with risk aversion.

  The list of requirements is challenging and may not be fully satisfiable by any existing theory without trade-offs. The user must decide which trade-offs are acceptable for their application (e.g., accepting dilation in exchange for dynamic consistency and element-wise conditioning).

  Final note: The requirement for the weight of evidence (7) might push beyond the set-based representation, suggesting a need for a second-order distribution (which then risks collapsing to a Bayesian approach with a sharp prior over models). However, one can represent weight of evidence within the set by the size of the set (with the caveat that a small set might represent strong evidence). But note: a set can be small and yet the evidence weak if the set is not concentrated? This is tricky. Therefore, requirement 7 might be one of the hardest to satisfy without introducing a second-order distribution.
answer: |-
  Below is a requirements list for a theory of imprecise credences, tailored to your use case (severe uncertainty in catastrophic-risk estimates with model disagreement, no agreed prior over models, and a need for decision-making and calibration of interval forecasts). Requirements are categorized as **non-negotiable** (essential for adequacy) or **preference** (domain-specific or theoretical-camp choices). Conflicts and trade-offs are highlighted in the verdict.  

  ---

  ### **Requirements List**  
  1. **Separation of Beliefs from Preferences (Non-Negotiable)**  
     - **Case**: Distinguish genuine epistemic uncertainty (e.g., "I lack evidence to commit to a single probability") from risk aversion (e.g., "I fear tail risks") or exotic utility functions.  
     - **Requirement**: The formalism must isolate *imprecise beliefs* as a property of evidence and models, not conflate them with decision rules.  
     - **Verdict**: Non-negotiable. Without this, imprecise credences become a garbage can for deviations from expected utility, undermining their purpose.  

  2. **Evidence-Based Warranty and Dynamics (Non-Negotiable)**  
     - **Case**: Imprecision must be warranted for severe uncertainty (e.g., unknown bias of a coin, one-off catastrophes) but shrink under evidence accumulation (e.g., after 1000 coin flips). It should not persist when evidence resolves ambiguity.  
     - **Requirement**: A principled link between evidence and imprecision width:  
       - Imprecision *must* contract with unambiguous evidence (non-negotiable).  
       - "Dilation" (imprecision widening post-evidence) must be justifiable or avoidable.  
     - **Verdict**: Non-negotiable for learning. Dilation (e.g., coin toss widening bias estimates) is a bullet to bite *only* if it reflects genuine unresolved uncertainty.  

  3. **Updating Rule with Zero-Probability Events (Non-Negotiable)**  
     - **Case**: Conditioning on events like "coin lands heads" when priors disagree on bias but agree on P(heads)=0.5. Element-wise conditioning can widen intervals.  
     - **Requirement**:  
       - Updating must be defined for events of probability zero (for continuous spaces).  
       - The rule must specify if we:  
         - Condition each prior separately (causing dilation),  
         - Update the lower envelope (e.g., via natural extension), or  
         - Use a new object (e.g., sets of likelihoods).  
     - **Verdict**: Non-negotiable. Element-wise conditioning is standard but forces dilation; alternatives risk ad-hocness.  

  4. **Dynamic Consistency (Non-Negotiable)**  
     - **Case**: In sequential decisions (e.g., investing in disaster prevention pre- and post-data), the agent must not avoid free information or reverse plans after updating.  
     - **Requirement**: Optimal plans pre-update must remain optimal post-update under the chosen decision rule.  
     - **Verdict**: Non-negotiable for coherence. Maximin + conditioning often violates this; E-admissibility or regular choice functions may preserve it.  

  5. **Decision Rule Resisting Collapse (Non-Negotiable)**  
     - **Case**: Choosing actions when models disagree (e.g., act on climate risk under [0.01, 0.20] fatality probability).  
     - **Requirement**: A rule must:  
       - Avoid permissiveness (everything choice-worthy) or collapse to Bayesianism (e.g., hidden prior over the set).  
       - Resolve conflicts between:  
         - *E-admissibility* (optimal under some prior in the set),  
         - *Maximin* (optimize worst-case),  
         - *Interval dominance* (A > B if min(A) > max(B)).  
     - **Verdict**: Non-negotiable. E-admissibility is least collapse-prone; maximin conflates beliefs/risk.  

  6. **Representor Structure (Preference)**  
     - **Case**: Should mixtures of admissible priors (e.g., 50% Prior A + 50% Prior B) be included if individually rational?  
     - **Requirement**: Clarify if the set must be convex, closed under conditioning, or interpretable as:  
       - Suspended judgment (all priors possible),  
       - Acceptable commitments (each prior is defensible),  
       - Unspecified second-order distribution.  
     - **Verdict**: Preference. Convexity aids computation but may over-include; suspension of judgment aligns with severe uncertainty.  

  7. **Weight of Evidence vs. Sharpness (Non-Negotiable)**  
     - **Case**: Distinguish 50/50 credence for an unknown coin (no evidence) vs. 50/50 after 1000 fair flips (high evidence).  
     - **Requirement**: The formalism must mark "weight of evidence" separately from interval width.  
     - **Verdict**: Non-negotiable for calibration. Set-based approaches *fail* here; a second dimension (e.g., reliability classes) is needed.  

  8. **Aggregation and Scoring (Preference)**  
     - **Case**: Pooling intervals (e.g., [0.2, 0.5] and [0.4, 0.8] from experts) and scoring forecast accuracy.  
     - **Requirement**: A method to:  
       - Aggregate intervals (e.g., intersection or convex hull) preserving coherence,  
       - Score intervals for calibration (e.g., "90% of events fall in reported intervals").  
     - **Verdict**: Preference. Necessary for group decisions but method is context-dependent.  

  9. **Implementability (Non-Negotiable)**  
     - **Case**: Catastrophic-risk models often use continuous spaces (e.g., climate sensitivity distributions).  
     - **Requirement**:  
       - Handle continuous spaces and zero-probability events.  
       - Be computable (e.g., linear programs for decision-making).  
     - **Verdict**: Non-negotiable for real-world use.  

  ---

  ### **Conflicts and Trade-offs**  
  - **The Triangle of Impossibility**:  
    You suspected a conflict between:  
    - (A) Element-wise conditioning,  
    - (B) No dilation,  
    - (C) Dynamic consistency under cautious decisions (e.g., maximin).  
    **Verdict**: This is correct. Proven conflicts exist:  
    - **A + B → ¬C**: Avoid dilation via non-element-wise updating (e.g., natural extension) often breaks dynamic consistency.  
    - **A + C → ¬B**: Element-wise conditioning + dynamic consistency (e.g., with E-admissibility) permits dilation.  
    - **B + C → ¬A**: No dilation + dynamic consistency requires abandoning element-wise conditioning.  
    **Strongest Constraint**: Dynamic consistency (C) does the most work in eliminating theories (e.g., it rules out naive maximin).  

  - **Key Non-Negotiable Tensions**:  
    - **Weight of Evidence vs. Set-Based Simplicity**: Representing evidence weight requires richer structure (e.g., second-order distributions), threatening collapse to Bayesianism (vs. Requirement 5).  
    - **Updating vs. Dynamic Consistency**: Element-wise conditioning (Requirement 3) is intuitive but forces dilation, conflicting with evidence-based dynamics (Requirement 2). Alternatives (e.g., "unit-by-unit" updating) lack consensus.  
    - **Decision Rules vs. Collapse**: E-admissibility avoids collapse but may permit too many options; interval dominance is decisive but ignores internal structure.  

  - **Which Requirements Are Jointly Unsatisfiable?**  
    The core unsatisfiable bundle is:  
    - No dilation (from Requirement 2),  
    - Element-wise conditioning (from Requirement 3),  
    - Dynamic consistency (Requirement 4).  
    **Result**: You must sacrifice one. For your use case, *allow dilation* (bite the bullet) is preferable, as severe uncertainty sometimes deepens with evidence.  

  ### **Verdict on Folk Wisdom**  
  - "Your uncertainty about probability is just another probability" is **false** for severe uncertainty. It ignores model disagreement with no prior and conflates belief with weight of evidence.  
  - Imprecise credences are **not redundant** if they:  
    - Isolate belief imprecision (Requirement 1),  
    - Handle dilation without dynamic inconsistency (Requirements 2–4),  
    - Avoid collapse in decisions (Requirement 5).  
  - **Most Adequate Approach**: *Sets of priors with E-admissibility*. It satisfies Requirements 1, 3 (with element-wise), 4 (if consistent plans are chosen), 5, and 9. It fails Requirement 7 (weight) and allows dilation, but these are survivable for your use case.  

  ### **Recommendation**  
  Prioritize theories that:  
  1. Use sets of priors updated element-wise (Levi, Walley),  
  2. Adopt E-admissibility for decisions (Levi),  
  3. Add a separate "reliability" metric for weight of evidence.  
  Reject approaches that:  
  - Conflate imprecision with risk (e.g., maximin),  
  - Forbid dilation arbitrarily,  
  - Aggregate sets into sharp probabilities.  

  This framework handles catastrophic-risk uncertainty (model disagreement, no prior) and delivers decisions, but calibrating intervals requires extending scoring rules (e.g., Winkler intervals). The literature will now make sense: start with Levi (1980) and Walley (1991), then recent dilation papers (e.g., Augustin et al.).
