  ### Game Design for Condorcet Jury Theorem Demonstration  
  **Core Goal:** Make students experience the theorem's nuances—*independence conditional on the state*, *competence >0.5*, and how headcount alone can hurt—through iterative voting rounds with twists.

  ---

  ### 1. Card Generation & Round Procedure  
  **Signal Generation (Clue Cards):**  
  - **Pre-game Prep:**  
    - Generate 20 true states (e.g., 🔴 **A** or 🔵 **B**) using a fair coin flip (50/50).  
    - For each student and round, generate private signals:  
      - **Block 1 (Independence):** Each signal matches the true state with probability **0.6** (independent Bernoulli trials).  
      - **Block 2 (Broken Independence):** Same as Block 1, but add a **public signal** with reliability **0.7** (pre-generated).  
      - **Block 3 (Group Comparisons):**  
        - *Round 1:* 19 signals at *p*=0.6.  
        - *Rounds 2–3:* 3 signals at *p*=0.9 (for randomly selected "experts").  
        - *Round 4:* 18 signals at *p*=0.6 + 1 always-wrong signal (*p*=0.0).  
    - Print signals on index cards (1 per student per round), sorted into round-specific envelopes.  

  **Round Flow (90 Seconds/Round):**  
  1. **Handout (20 sec):** Shuffle and distribute clue cards for the round.  
  2. **Vote (20 sec):** Students write **A/B** on blank index cards (secret ballot).  
  3. **Collect & Tally (20 sec):** Collect votes, tally publicly on whiteboard.  
  4. **Reveal State & Score (30 sec):** Reveal true state; award points (see §2).  

  **Sequence & Rounds:**  
  - **Block 1 (5 rounds):** Independent signals (*p*=0.6).  
    - *Goal:* Show group accuracy > individual accuracy.  
  - **Block 2 (4 rounds):** Private signals (*p*=0.6) + public signal (*p*=0.7).  
    - *Twist:* Public signal read aloud before voting.  
    - *Why this twist?* It reliably breaks independence—voters correlate around the public signal. Deliberation or revealed votes are less predictable and slower.  
  - **Block 3 (4 rounds):**  
    - *Round 1:* 19 voters (*p*=0.6).  
    - *Rounds 2–3:* 3 "expert" voters (*p*=0.9; others sit out).  
    - *Round 4:* 18 voters (*p*=0.6) + 1 always-wrong voter (*p*=0.0).  
    - *Why 19@0.6 vs. 3@0.9?* Probability gap is stark:  
      - 19@0.6 → 75.4% group accuracy.  
      - 3@0.9 → 97.2% group accuracy.  
      - Adding a *p*=0.0 voter reduces 19@0.6 → 72.0% accuracy.  

  **Total Rounds:** 13 rounds → **~19.5 mins**.  
  **Pace Tip:** Use student helpers for handout/tally. Pre-sort envelopes by block.  

  ---

  ### 2. Payoff Scheme  
  **Point System:**  
  - **+1 point** if your vote is correct.  
  - **+1 point** if the group majority is correct.  
  - *Max 2 points/round.*  

  **Why This Works:**  
  - Aligns self-interest (individual accuracy) with group success.  
  - Penalizes blind copying: Voting against your signal risks losing individual points.  
  - *Sacrifice:* Minor risk of strategic voting (e.g., ignoring signals to "swing" votes), but peer pressure and speed mitigate this.  

  ---

  ### 3. Timeline (80 Minutes)  
  | Time      | Activity                                                                 |  
  |-----------|--------------------------------------------------------------------------|  
  | 0–5 min   | **Intro:** Explain rules, secrecy, and points. No theory—just mechanics.|  
  | 5–15 min  | **Block 1 (5 rounds):** Independence (*p*=0.6).                          |  
  | 15–23 min | **Block 2 (4 rounds):** Public signal twist.                             |  
  | 23–31 min | **Block 3 (4 rounds):** Group comparisons.                               |  
  | 31–80 min | **Debrief:** Guided discussion (see §4).                                 |  

  ---

  ### 4. Debrief (49 Minutes)  
  **Map Game Moments to Concepts (No Theorem Name Until End):**  
  - **Block 1 Results (10 min):**  
    - *Q:* "Why did the group outperform most individuals?"  
    - *Highlight:* "You had **independent clues** and each was **better than a coin flip**—so errors canceled out."  
  - **Block 2 Results (15 min):**  
    - *Q:* "Why did votes become unanimous after the public signal? Did accuracy *improve*?"  
    - *Highlight:* "Your votes **depended on the same public clue**—so errors amplified. Independence was broken!"  
  - **Block 3 Results (15 min):**  
    - *Q:* "When did fewer people outperform more? Why did adding a voter hurt in Round 4?"  
    - *Highlight:* "Competence matters more than headcount. Adding a **biased voter** (or correlated group) can **reduce accuracy**."  
  - **Theorem Reveal (9 min):**  
    - Name the Condorcet jury theorem only now.  
    - Connect assumptions:  
      - Independence (conditional on state) → *Block 1 vs. 2*.  
      - Competence >0.5 → *Block 1’s success vs. Block 4’s failure*.  
      - Common interest → *Points rewarded group success*.  

  ---

  ### 5. Predictable Problems & Fixes  
  - **Whispering clues:**  
    - *Fix:* Stress secrecy at the start; walk around during voting. Penalize offenders (e.g., subtract 2 points).  
  - **Meta-gaming points:**  
    - *Fix:* Discourage complex strategies: "Vote your clue to maximize *your* points."  
  - **Slow tallying:**  
    - *Fix:* Assign 2 students as "tally clerks."  
  - **Bad luck streaks:**  
    - *Fix:* Pre-compute expected accuracies (§6); explain randomness if results diverge.  
  - **Frustration in Block 3 (non-experts):**  
    - *Fix:* "You earn group points even if not voting—experts are working for you!"  

  ---

  ### 6. Limitations & Honesty Note  
  **What the Game Can’t Show:**  
  - **Asymptotics:** With 19 voters, group accuracy ~75% (not 99.9%). Say: *"With 1,000 voters, accuracy →100%—but we can’t simulate that here!"*  
  - **Adding good voters:** We only show adding *bad* voters hurts. Clarify: *"Adding voters with p>0.5 *always* helps... but only if independent!"*  
  - **Small samples:** One "bad-luck" round may mislead. Share expected probabilities:  
    - Block 1: ~75% group accuracy.  
    - Block 2: ~70% (if public signal dominates) or ~93% (if mixed).  
    - Block 3: Small group (97%) > large group (75%) > bad-voter group (72%).  

  **Critical Setup for "Adding Voters Hurts":**  
  - **Where?** Block 3, Round 4 (adding *p*=0.0 voter).  
  - **Why?** Tangibly shows competence > headcount. Use a **single always-wrong voter**—it’s simpler and more dramatic than correlated blocks.  
  - **Student Insight Prompt:** *"Why did 19 good voters + 1 bad one underperform 18 good voters alone?"*  

  ---

  ### Final Prep Notes  
  - **Materials:** 13 envelopes (pre-sorted rounds), 250+ blank index cards, markers.  
  - **Expected Accuracies:** Share if results diverge (e.g., "Theory says 75%, but randomness gave us 60%—that’s okay!").  
  - **Big Idea:** Students should articulate: *"More voters help only if they’re independent and competent. Otherwise, they can hurt!"*  

  This design forces confrontation with the theorem’s nuances—while the public signal and bad-voter twists make the pitfalls *unignorable*.
