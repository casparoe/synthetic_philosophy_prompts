  ### Requirements List from Cases  
  **Derived from your scenarios, with considerations, non-negotiable status, and duplicates identified.**  

  1. **Single-Case Deference**  
     - *From "the last toss"*: Rule must assign credence = chance for singular, non-repeatable events.  
     - **Consideration**: Simulator provides objective chances for one-off events, not just frequencies.  
     - **Non-negotiable**: Yes (core to module’s purpose).  

  2. **Noise-Tolerant Deference**  
     - *From "chance laundering"*: Rule must defer to the *original* chance when receiving a noisy report, not the report itself.  
     - **Consideration**: Deference requires tracking the true chance, not its corrupted observations.  
     - **Non-negotiable**: Yes (simulator may have imperfect channels).  

  3. **Time-of-Event Deference**  
     - *From "self-erasing bias"*: Rule must defer to the *latest* chance before the event, even if earlier chances undermine it.  
     - **Consideration**: Current chance supersedes past chances; learning past chances doesn’t override this.  
     - **Non-negotiable**: Yes (avoids time-inconsistency in beliefs).  

  4. **Admissibility Enforcement**  
     - *From "tipster's shadow" and "the demon" (secretly the same requirement)*: Rule must ignore information that would make chance deferral irrational (e.g., future outcomes or micro-details), even if others have it.  
     - **Consideration**: Prevents money-pumping by future bettors or overfitting to micro-details.  
     - **Non-negotiable**: Absolutely (critical for decision stability).  

  5. **Conflict Resolution**  
     - *From "two weather services"*: Rule must reconcile conflicting chance reports (e.g., average, weight by reliability, or use simulator’s meta-rules).  
     - **Consideration**: Agents need a unique credence for EU calculations; indecision invites exploitation.  
     - **Non-negotiable**: Yes (real-world inputs are messy).  

  6. **Self-Locating Branch Weighting**  
     - *From "fission box"*: Rule must set self-locating credence (e.g., "I am the 0.9 branch") = objective branch weight.  
     - **Consideration**: Branch weights *are* chances in branching universes; failure risks incoherence.  
     - **Non-negotiable**: Conditional (only if simulator includes branching physics).  

  7. **Action-Relative Chances**  
     - *From "truck on the bridge"*: Rule must output chances *conditional on interventions* (e.g., walking vs. driving) and mesh with decision theory.  
     - **Consideration**: EU calculations require P(outcome | action); chances are meaningless without context.  
     - **Non-negotiable**: Absolutely (module must interface with action selection).  

  8. **Chance-1 Credence**  
     - *From "chance one but not certain"*: Rule must assign credence 1 to events with chance 1, even if unobservable.  
     - **Consideration**: Weak deference (credence ≈ chance) fails for extremal cases; invites Dutch books.  
     - **Non-negotiable**: Controversial (see "Joint Unsatisfiability" below).  

  9. **Confused Case**: **"The demon"** is confused. If an agent has *complete microphysical information* (implying outcome determinism), macro-level chances are either 0/1 or undefined. Rule should *not* defer—use micro-details instead.  

  ---  
  ### Non-Negotiables vs. Taste  
  **Non-negotiable** (essential for ship-ready module):  
  - Single-case deference (1), Noise tolerance (2), Time-of-event deference (3), Admissibility (4), Conflict resolution (5), Action-relativity (7).  
  **Taste** (metaphysical camps):  
  - "Chances from frequencies": Taste (Humean). Module uses simulator’s numbers, not derived frequencies.  
  - "Causally inert chances": Taste (propensity). Module treats chances as inputs, regardless of causal role.  
  - "Dutch-book derivability": Non-negotiable! Avoids money-pumping (core to your spec).  

  ---  
  ### Your Hunch on Deference vs. Conditionalization  
  **Correct**: Full deference and strict conditionalization conflict. Bites when:  
  - Learning a chance value *as evidence* (e.g., "self-erasing bias") might not override inadmissible information.  
  - **Resolution**: Deference must *constrain* conditionalization. Credence = chance *after* conditionalizing only on admissible information.  

  ---  
  ### Joint Unsatisfiability  
  - **Unattainable triad**:  
    1. Deference to chance-1 events (8).  
    2. Avoiding credence 1 in non-logical truths (e.g., infinite sequences).  
    3. Strict Dutch-book immunity.  
  - **Conflict**: (8) forces credence 1 in events that *could* fail (e.g., fair coin lands heads ∞-times). This risks "incoherent" beliefs if evidence contradicts chance setup.  
  - **Most damaging requirement**: **Chance-1 Credence (8)**. Kills rules using approximate deference (e.g., "set credence within ε of chance") or fallibilism.  

  ---  
  ### One-Line Views (for context)  
  - **Lewis-style**: Defer to chance *only* conditional on admissible information (past/chance facts, not future outcomes).  
  - **Best-system/Humean**: Chances = compactly describable patterns in history; useless for single-case sims.  
  - **Propensity**: Chances = physical tendencies; metaphysically robust but unverifiable.  
  - **Expert calibration**: Set credence = chance *as if* chance function is an ideal forecaster; requires no metaphysics.  

  **Recommendation**: Prioritize Lewis-style + expert calibration. Drop chance-1 credence (8) for pragmatism—use "credence ≈ chance" with error margins. This satisfies all non-negotiables except extremal cases.
