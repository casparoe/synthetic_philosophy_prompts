   Key points for Protocol A:
   - 24 common octopuses, trained individually for about three weeks on a three-choice discrimination task, followed by terminal recording under anesthesia (cannot be released).
   - The PI argues that octopuses are Skinnerian (behavior shaped by reinforcement within a single lifetime) so only individual suffering during training (brief and mildly aversive) is at stake.

   Key points for Protocol B:
   - Field study on New Caledonian crows in six territories. Each territory has a group with distinct tool types that don't seem environmentally forced. A few birds in each territory (apparently influential) will be temporarily removed for eight weeks to aviaries. Then observe if the remaining birds' tools drift or revert, and if the original style returns when the removed birds are put back.
   - Pitched as testing if crows are Gregorian (Dennett's sense: minds made of tools from culture, not just individually rebuilt).
   - Controversy: Gregorian tier is a group-level property. Removing key birds might dismantle a group-level cultural entity. Some say this is worse than individual harm (not captured by current severity bands); others say no individual bird is harmed. Also, it's unclear if the tool styles are indeed socially transmitted (could be individually reinvented, making them Skinnerian or Popperian).

   Steps for the memo:
   1. Introduction: State the purpose and the two protocols.
   2. Recommendation for Protocol A: 
      - We know the harm: individual suffering during training (mild and brief) and terminal procedure (under anesthesia). Since the octopuses cannot be released and the terminal procedure is done humanely, the harm is within acceptable limits. However, we must ensure that the training procedures are as refined as possible to minimize aversive experiences.
      - Recommendation: Approve with conditions that the training protocols are reviewed and optimized to minimize distress, and that anesthesia and euthanasia are performed by trained personnel following best practices.

   3. Recommendation for Protocol B:
      - The main ethical issue is the potential harm to the cultural entity (if it exists). Since the birds are captured temporarily and then released, individual harm might be minimal (though capture, captivity, and release have risks). However, the experiment could disrupt a cultural tradition that is valuable for the group's survival or well-being.
      - We don't know if the tool styles are cultural or individually reinvented. The experiment is designed to test this, but that very uncertainty makes the intervention risky.
      - The board members' concerns: 
          a) Dismantling a group-level cultural entity is a harm not captured by current severity bands.
          b) Since no individual is harmed (in a traditional sense), it might be acceptable.
          c) The uncertainty about the transmission mechanism: if it's not cultural, then the experiment might be unnecessary and we are just capturing and holding birds for no reason; if it is cultural, we might be destroying something irreplaceable.
      - Given the uncertainty and the potential for irreversible damage to a cultural tradition, we should be cautious. The study might be better designed as observational without removal? But the removal is the key manipulation.
      - Recommendation: Defer for more information. We need a clearer risk assessment for the potential cultural harm and a plan for mitigating any negative impacts on the crow groups. Also, we should require evidence that the removal and reintroduction of birds will not cause significant stress or harm to the individuals. We might also suggest a pilot study on one group to assess the impact.

   4. Adding a "cultural harm" line to the review form:
      - The debate indicates that current forms may not capture group-level or cultural harms. We should consider adding a category for "cultural or group-level impact" in the review form. However, defining and operationalizing this is challenging. We must avoid subjective judgments.
      - How to apply without waving through interesting studies? We can require:
          - A clear justification for why the study is necessary and cannot be done without the intervention.
          - An assessment of the potential impact on the group's culture and how it will be monitored and mitigated.
          - Evidence that the cultural trait is robust and the intervention is reversible, or if not, that the loss is justified by the scientific gain.
          - Independent review by experts in cultural transmission in animals.

   5. Present the strongest argument against our position:
      - For Protocol A: The strongest argument against approval is that octopuses are highly intelligent and possibly capable of more complex experiences than the Skinnerian model suggests. They might experience distress not just during training but also in captivity and from the anticipation of the procedure. However, the PI's view is that they are Skinnerian, but that might be an oversimplification. We are approving with conditions to minimize suffering, so the counter-argument is that we are underestimating the octopus's capacity for suffering and the ethical cost of terminal procedures on 24 individuals.
      - For Protocol B: The strongest argument for approval is that without such experiments, we cannot advance our understanding of animal culture, which is a critical aspect of cognitive evolution. The study is designed to test a fundamental question about the nature of these crows' minds. If we always avoid interventions due to uncertainty, we will never learn. Moreover, the birds are not individually harmed (captivity is temporary and in good conditions) and the cultural tradition might be resilient enough to recover. Deferring might kill a groundbreaking study.

   6. Bottom line: We recommend approving Protocol A with conditions and deferring Protocol B for more information. We also recommend adding a "cultural harm" category to the review form with clear guidelines.

   Draft the memo:

  ---

  **MEMORANDUM**

  To: Animal Care Committee Board  
  From: [Your Name/Committee Member]  
  Date: [Current Date]  
  Subject: Recommendations for Protocols A (Octopuses) and B (New Caledonian Crows)  

  This memo provides recommendations regarding two research protocols under review. Protocol A involves training and terminal procedures on common octopuses, and Protocol B is a field study on New Caledonian crows that involves temporary removal of key individuals to investigate cultural transmission. After careful consideration of the ethical implications, I offer the following assessments and recommendations.

  **Protocol A: Octopus Training and Terminal Recording**  
  This protocol proposes training 24 common octopuses individually on a three-choice discrimination task over approximately three weeks, followed by terminal electrophysiological recording under anesthesia. The Principal Investigator (PI) argues that the octopuses are Skinnerian learners, meaning their behavior is shaped solely by individual reinforcement, and thus the primary welfare concern is the mild and brief aversive experiences during training.  

  *Recommendation:* Approve with conditions.  
  Conditions:  
  1. The training protocols must be reviewed and refined to minimize distress, using the least aversive methods possible.  
  2. Anesthesia and terminal procedures must be conducted by trained personnel following established best practices to ensure no pain or distress.  
  3. The committee requires a detailed report on any signs of distress observed during training and steps taken to address them.  

  *Rationale:* The harm to individual octopuses is limited to the training period and the terminal procedure (which is done under anesthesia). Given that the octopuses cannot be released, the terminal procedure is justified. However, we must ensure the training is as humane as possible.  

  *Strongest Counter-Argument:* The PI's characterization of octopuses as purely Skinnerian may be an underestimation. Recent evidence suggests octopuses are highly intelligent and may experience complex states of distress beyond what is assumed. The committee must consider the cumulative impact of training, captivity, and terminal procedures on 24 individuals, which might be more severe than portrayed.

  **Protocol B: Crow Tool Culture Study**  
  This protocol involves temporarily removing a few key crows (identified as potential models for tool use) from each of six wild territories for eight weeks in aviaries. The aim is to observe whether the remaining birds' tool styles drift or revert, and whether the original style returns upon reintroduction. The study is framed as a test of whether these crows possess a Gregorian mind (per Dennett), where culture provides essential cognitive tools.  

  *Recommendation:* Defer for more information.  
  Reasons for deferral:  
  1. The ethical framework currently does not adequately address potential harm to group-level cultural attributes. Removing key individuals might dismantle a cultural tradition that is not the property of any single bird but of the group.  
  2. There is significant uncertainty about whether the tool styles are indeed socially transmitted (and thus Gregorian) or individually reinvented (Skinnerian/Popperian). Without this knowledge, the intervention risks irreversibly damaging a cultural entity if it exists.  
  3. The potential harm to individual birds during capture, captivity, and release must be thoroughly assessed and mitigated.  

  Required additional information:  
  - A risk assessment specifically addressing potential cultural harm and its reversibility.  
  - A detailed plan for monitoring the well-being of both the removed and remaining birds, and for mitigating any observed negative impacts.  
  - Evidence from the PI that the study design is the least invasive way to answer the research question and that the potential loss of cultural tradition is justified by the scientific value.  
  - Consideration of a pilot study on one territory to evaluate the impact before full-scale implementation.  

  *Strongest Counter-Argument:* This experiment is a unique opportunity to empirically test a major theory about the evolution of cognition. Without such interventions, our understanding of animal culture remains speculative. The birds are not expected to suffer significant individual harm (as captivity conditions are good and the duration is limited), and the cultural traditions might be resilient. Deferring or rejecting this protocol could stifle a groundbreaking study that could reshape our understanding of nonhuman intelligence.

  **Adding a "Cultural Harm" Category to the Review Form**  
  The debate around Protocol B highlights a gap in our current review process: the potential for harm to group-level cultural attributes is not explicitly considered. I recommend adding a "cultural or group-level impact" line to the review form. To ensure this is applied objectively and not as a rubber stamp for interesting studies, we should:  
  1. Require researchers to justify the necessity of the intervention and demonstrate that non-invasive methods are not feasible.  
  2. Mandate a thorough assessment of the potential impact on the cultural trait and the group's well-being, including reversibility.  
  3. Include independent review by experts in animal culture and behavior.  
  4. Establish clear criteria for when potential cultural harm is outweighed by scientific and conservation benefits.  

  This addition would help the committee evaluate studies that might affect cultural entities without solely relying on individual harm metrics.

  **Conclusion**  
  In summary, I recommend:  
  - Approving Protocol A with the conditions outlined.  
  - Deferring Protocol B until the requested information is provided and reviewed.  
  - Initiating a discussion on adding a "cultural harm" category to our review form with appropriate safeguards.  

  The committee must balance scientific advancement with ethical responsibility, particularly when confronting novel challenges like group-level cultural attributes.

  \answer{Approve A with conditions; defer B for more info; add cultural harm category.}
answer: |-
  **MEMORANDUM**  

  To: Animal Care Committee Board  
  From: [Your Name], Animal Care Committee Member  
  Date: [Current Date]  
  Subject: Ethical Review and Recommendations for Protocols A (Octopus) and B (Crow)  

  This memo addresses the ethical review of two proposed research protocols (A and B) and provides recommendations based on animal welfare considerations, scientific merit, and emerging ethical concerns. Both protocols present distinct challenges that warrant careful scrutiny under our existing framework, with Protocol B raising novel questions about "cultural harm" that merit broader policy discussion.  

  ### **1. Protocol A: Octopus Behavioral Training and Terminal Recording**  
  **Overview**: 24 common octopuses undergo individual training (3 weeks) on a three-choice discrimination task, followed by terminal recording under anesthesia. The PI contends that octopuses are purely Skinnerian learners, limiting welfare concerns to mild, transient aversive stimuli during training.  
  **Recommendation**: **Approve with conditions**  
  - **Conditions**:  
    - Training must use positive reinforcement (e.g., food rewards) to minimize aversive stimuli; any punitive methods (e.g., electric shocks) are prohibited.  
    - Daily welfare checks must be documented, with immediate cessation if signs of distress (e.g., ink release, escape attempts) exceed mild severity.  
    - Anesthesia/euthanasia must adhere to AVMA guidelines, with a veterinarian on-site during procedures.  
  - **Rationale**: The protocol aligns with standard invertebrate welfare practices. Terminal procedures prevent post-release suffering, and training-related distress is mitigatable. However, emerging evidence of octopus cognition (e.g., pain sensitivity, enrichment needs) necessitates strict oversight.  
  - **Strongest Counter-Argument**: *Octopuses may possess latent capacities for suffering beyond Skinnerian models*. If they experience anticipation of harm (e.g., from repeated handling) or covert stress during isolation, the protocol risks underrepresenting cumulative harm across 24 individuals. Rejecting this could prioritize precaution over scientific progress, given the lack of conclusive data on cephalopod affect.  

  ### **2. Protocol B: Crow Cultural Transmission Field Study**  
  **Overview**: In 6 wild crow territories, remove key "tool-model" birds to aviaries for 8 weeks, monitor tool-use changes in the group, then reintroduce models to observe cultural reinstatement. The PI frames this as testing "Gregorian" cognition (Dennett), where culture scaffolds individual minds.  
  **Recommendation**: **Defer for more information**  
  - **Reasons for Deferral**:  
    - Critical uncertainties exist: (a) Whether tool traditions are socially transmitted (Gregorian) or individually reinvented (Popperian/Skinnerian); (b) Potential for irreversible disruption of group-level culture; (c) Inadequate mitigation plans for capture/release stressors (e.g., territory reintegration risks).  
    - The protocol’s design precludes predicting outcomes. If traditions are cultural, removing models may permanently erase group knowledge; if not, the study imposes unnecessary captivity.  
  - **Required Information**:  
    - Pilot data showing tool traditions persist after brief removals (e.g., 1–2 birds in one territory).  
    - Evidence that captivity conditions (aviaries) meet complex social needs.  
    - Contingency plans if groups collapse (e.g., supplemental feeding).  
  - **Strongest Counter-Argument**: *Not approving this protocol stifles a pivotal test of nonhuman culture*. If crows are Gregorian, this study could revolutionize our understanding of animal minds. Individual birds experience no direct physical harm (captivity is low-stress), and deferral perpetuates ignorance about cultural systems—arguably a greater ethical failing than intervention.  

  ### **3. Adding a "Cultural Harm" Category to the Review Form**  
  **Recommendation**: **Add the category, but with strict criteria** to prevent subjective bias toward "high-impact" science.  
  - **Implementation Guidelines**:  
    - **Define "cultural harm" narrowly**: Only apply when (a) a group-level trait (e.g., tool tradition) is empirically documented; (b) disruption risks irreversible loss; (c) the trait confers survival value (e.g., foraging efficiency).  
    - **Require burden of proof**: Researchers must demonstrate cultural transmission likelihood (e.g., via prior observational data) before interventions.  
    - **Tiered review**: Assign "cultural harm" severity levels (e.g., low/reversible, high/irreversible) and mandate independent ethology consultation.  
    - **Mitigation hierarchy**: Prioritize non-invasive methods (e.g., observational studies, temporary removals over permanent).  
  - **Safeguard Against Bias**: Reviewers must justify "cultural harm" assessments with species-specific evidence, not theoretical appeal. For Protocol B, this would require proof that crows’ tool styles are cultural *before* approval.  

  ### **Conclusion**  
  Protocol A balances welfare risks with scientific value and is approvable with refinements. Protocol B, while groundbreaking, demands caution: deferral allows addressing gaps in cultural risk assessment. Adding a "cultural harm" category—with evidence-based thresholds—will future-proof our reviews without compromising rigor. I urge the committee to adopt these recommendations to uphold ethical innovation.  

  \answer{Approve A with conditions; defer B for more data; add cultural harm with evidence thresholds.}  

  ---  
  *End of Memo*
