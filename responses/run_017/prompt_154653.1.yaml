  Breaking down the passage: Douglass mentions being attacked by someone who advertised an anti-slavery lecture but instead delivered an "anti-Douglass" lecture. The user has three main questions. First, what are the "two powers" Douglass refers to? It's likely the platform (live speaking) and the press (newspapers), showing he's facing criticism in both mediums. The criticism isn't just about ideas but personal attacks, which Douglass frames as disloyal to the cause since it shifts focus from slavery to internal disputes.

