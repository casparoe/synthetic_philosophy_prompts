prompt: |-
  Eight months ago I was made lead of the three-person forecasting team at a regional flood-risk and water-resources agency. We produce seasonal outlooks that a board — two civil engineers, a hydrologist, and two elected members — signs off on, and that are then used to set reservoir release rules, to schedule levee works, and, in perhaps two years out of ten, to decide whether to evacuate. We refresh the models twice a year, and each refresh puts twenty to thirty candidate regularities in front of me, each of which somebody has to approve or reject in about twenty minutes.

  Last spring one of ours failed publicly. A model that had backtested beautifully against thirty-one years of record collapsed in its first live season, and the post-mortem could not say what we should have done differently: the pattern had genuinely been in the data, nobody had falsified it, and our usual tests — out-of-sample fit, cross-validation on held-out years, a holdout on the most recent decade — all passed. A friend sent me to Nelson Goodman, and I think I now see why: we had built the forecast on a predicate that fitted the record exactly as well as the ordinary one and that no amount of past data could have distinguished from it, a grue-style predicate whose content is fixed partly by where our own record ends. What I cannot do is turn that into something my team can actually run.

  What I need from you is a procedure, not an explanation: a written checklist my team can work through on any candidate regularity before it is allowed into a model. Give me the questions in a fixed order, what counts as a sufficient answer to each, the points at which the procedure terminates in a refusal to extrapolate, and the points at which it has to stop and hand the question to the board because what remains is a judgement about how much risk the agency will carry rather than a judgement about evidence. Mark the steps that are really judgement calls in procedural clothing, and have the analyst initial those.

  Constraints it has to respect:

  1. It must be written in the vocabulary we already use — features, deployment window, holdout period, sensor swaps, protocol revisions, interventions — and must not smuggle in philosophical terms my team would have to be taught before they could apply it.
  2. It must not rest on the thought that a grue-style predicate is somehow less well supported by the data we already have. It is not; my team will notice immediately if the procedure implies otherwise, and I will lose them. The procedure has to isolate whatever it is, besides past fit, that separates the pattern we may project from the pattern we may not.
  3. It must answer my deputy's standing objection. She says that appealing to how entrenched a predicate is — the ordinary colour predicate is projectible because predicates like it have been projected before — is institutional conservatism with a philosophical decoration, and that it would have told us to ignore every genuine regime shift in our record. Either answer her, or concede the point and say what replaces entrenchment in the checklist.
  4. It has to handle time-indexed features in general. Calendar year, row index, years since certification, firmware version, collected after the 2011 station move: each lets a model encode a grue-style predicate without anyone ever writing one down, and I cannot simply ban them, because several carry real signal about instrument drift and land-use change. Where is the line, and how do I tell which side of it a given feature falls on?
  5. It must say what to do when the information a step needs does not exist. We often cannot recover whether a sensor was recalibrated in 1994, or what the volunteer observer in 1978 actually recorded.
  6. It must tell me where it will misfire on data like ours: short overlapping series, instruments patched together across decades, a catchment we are ourselves altering with a bypass channel, and a board that reads any refusal to extrapolate as cowardice.

  Then apply it, step by step, to three candidates currently in my queue:

  (a) Turbidity spikes at a gauging station have preceded every recorded algal bloom in the reservoir by eleven to fourteen days, across thirty-four years. The turbidity sensor was replaced in 2011; before that the series comes from a different instrument with a different sampling frequency.

  (b) A gradient-boosted model that gets most of its skill from a single feature: the number of years since the measurement protocol was last revised. It increases monotonically, it correlates with nearly everything, and at deployment it will be one year larger than at any point in training.

  (c) The lower catchment has never produced two consecutive winters above the one-in-twenty flow. Our asset-management plan, already submitted to the regulator, treats this as a hard constraint on the maintenance schedule, and the board has built a budget bid around it. I suspect an honest procedure will tell me this is a predicate whose content is fixed by the length of our record rather than by the behaviour of the river. If that is what your procedure says, say so plainly, and tell me what, if anything, I can put in front of the board in its place.

  Finally, tell me what the procedure cannot do. I do not want a checklist that lets the board feel the problem has been handled, when the part that actually bites — that we are extrapolating into a catchment we are in the middle of changing — is the part no checklist settles.
reasoning: |-
  Hmm, the user is the lead of a forecasting team at a flood-risk agency, dealing with the fallout of a model failure caused by what they recognize as a "grue-style" problem after reading Nelson Goodman. They need a practical checklist to evaluate candidate regularities, not philosophical explanations. The core challenge is distinguishing projectible patterns from non-projectible ones like grue predicates, without implying past fit was inadequate.

  Key constraints from the user:
  1. Must use existing vocabulary (features, holdout periods, etc.) - no philosophy terms.
  2. Cannot suggest grue predicates are less supported by past data—they’re equally well-supported. The procedure must isolate what *else* separates projectible patterns.
  3. Must address the deputy’s objection that "entrenchment" (relying on past projection history) is just conservatism that would miss regime shifts. Either refute this or replace entrenchment.
  4. Must handle time-indexed features (e.g., firmware version, years since revision) that can secretly encode grue-like behavior but sometimes carry real signal. Need a way to distinguish valid uses.
  5. Must handle missing historical data (e.g., unrecoverable sensor recalibrations).
  6. Must acknowledge where it will misfire given messy data: short series, patched instruments, human-altered catchments, and board pressure against "cowardice."

  Three test cases:
  (a) Turbidity spikes predicting algal blooms, with a sensor replacement in 2011.
  (b) A gradient-boosted model relying heavily on "years since protocol revision," which increases monotonically and will be out-of-range at deployment.
  (c) A "never two consecutive winters" claim used in budgeting, which might be an artifact of record length.

  Deep needs:
  - The user wants to prevent future failures without alienating the team or board. They need legitimacy for saying "no" to certain extrapolations.
  - The unspoken tension: the agency is actively altering the catchment (e.g., bypass channel), making past data inherently unreliable for future predictions. No checklist can fully address this, but they need a way to flag it explicitly.
  - The deputy’s objection is crucial—they reject entrenchment as anti-innovation. The procedure must either defend entrenchment narrowly or offer an alternative tied to mechanistic plausibility or risk thresholds.

  Proposed approach:
  - Build a checklist around "extrapolation boundaries." Focus on whether a pattern depends on implicit time anchors (e.g., "before 2024") that lose meaning when projected.
  - Replace "entrenchment" with "system stability": ask if the feature’s relationship with the target is *mechanistically persistent* under future conditions (e.g., sensor drift vs. algal biology).
  - For time-indexed features, require proof they track *causal drivers* (e.g., "firmware version" is okay if tied to known error modes) and reject those that are pure counters.
  - Handle missing data by escalating gaps that could hide instability (e.g., if sensor history is unknown, assume worst-case drift).
  - For the board, explicitly separate empirical judgments (checklist) from risk decisions (their call).

  For the test cases:
  (a) Turbidity: likely fails on "persistence of mechanism" post-2011 sensor swap.  
  (b) "Years since revision": fails—it’s a pure counter with no causal link.  
  (c) "No consecutive winters": fails as a grue artifact. Offer the board a risk curve instead.  

  Finally, emphasize the checklist’s limits: it can’t fix changing catchments or short data. The board must own the residual risk.  

  This balances practicality with philosophical rigor, sidestepping direct grue debates while targeting the operational heart of the problem.
answer: |-
  Below is a procedural checklist for your team, designed to evaluate candidate regularities for model inclusion. It isolates "extrapolation risk" by focusing on **system stability**, **mechanistic plausibility**, and **temporal dependencies**, without implying past data inadequacy. It uses your existing vocabulary and addresses all constraints. Key design choices:

  - **Replaces "entrenchment"** with **"persistence of mechanism"** (answering your deputy: conservatism is avoided by focusing on causal pathways, not historical usage).
  - **Handles time-indexed features** by distinguishing between those tracking *external changes* (e.g., instrument drift) and those acting as *implicit date-stamps*.
  - **Explicitly separates empirical judgments** (handled by analysts) from **risk tolerance decisions** (escalated to the board).
  - **Flags missing data impacts** at each relevant step.
  - **Marks judgment calls** with `[J]`. Analysts must initial (`[Initial]`) these steps.

  ---

  ### **Checklist for Regularity Extrapolation**  
  *Use in order. Terminate if any "Refuse" condition is met. Escalate to board at designated steps.*

  #### **Step 1: Feature Provenance & Stability**  
     - *Question:* **Is the feature’s physical or observational basis stable across the entire record and deployment window?**  
       - *Sufficient answer:* Documented sensor swaps, protocol revisions, or interventions are absent *or* have known, consistent effects (e.g., drift corrections applied).  
       - *Missing data:* If provenance gaps exist (e.g., unknown 1994 recalibration), assume instability unless evidence shows gaps are irrelevant.  
       - *Terminate/Refuse:* If instability is confirmed (e.g., sensor swap with uncorrected bias) *and* no correction is possible.  
       - `[J]` Judgment call on "consistent effects" (e.g., whether post-swap corrections are robust). Initial here: `[Initial] ___`  

  #### **Step 2: Mechanism Persistence**  
     - *Question:* **Is there a plausible, persistent mechanism linking the feature to the target that holds under future conditions?**  
       - *Sufficient answer:* Mechanism is grounded in physics/biology (e.g., snowmelt → flow) *and* no pending interventions (e.g., bypass channel) or exogenous shifts (e.g., climate trends) could break it.  
       - *Missing data:* If mechanism depends on unrecoverable history (e.g., 1978 observer methods), assume low plausibility.  
       - *Escalate to board:* If mechanism is plausible *but* depends on uncontrolled future conditions (e.g., land-use changes).  
       - `[J]` Judgment on "plausibility" (use team’s domain expertise). Initial here: `[Initial] ___`  

  #### **Step 3: Temporal Anchoring Test**  
     - *Question:* **Does the feature rely on implicit time-indexing (e.g., calendar year, years since event) that could decouple in deployment?**  
       - *Sufficient answer:* Time-indexed features must either:  
         (a) Track *external changes* with documented effects (e.g., firmware versions mapping to error modes),  
         (b) Have *bounded, non-monotonic* relationships (e.g., "firmware v3 → +5% error" is ok; "years since revision → risk" is not).  
       - *Terminate/Refuse:* If the feature is unbounded/monotonic (e.g., "row index") *or* deployment value is outside training range (e.g., "years since X" higher than ever).  
       - *Escalate to board:* If anchored but critical (e.g., predicts maintenance schedules).  

  #### **Step 4: Holdout Validation Gap**  
     - *Question:* **Did the holdout tests (OOS, cross-validation, recent decade) cover periods with differing system states?**  
       - *Sufficient answer:* Holdouts include known shifts (e.g., post-2011 sensor, post-intervention flows).  
       - *Missing data:* If system-state history is incomplete, assume holdouts are inadequate.  
       - *Terminate/Refuse:* If holdouts only cover "stable" periods and the deployment window has known shifts.  

  #### **Step 5: Regime-Shift Resilience**  
     - *Question:* **Could this pattern disappear under minor environmental/observational shifts without breaking past fit?**  
       - *Sufficient answer:* Pattern is robust to synthetic perturbations (e.g., adding noise to time-indexed features) *and* no grue-like alternatives exist (e.g., "turbidity spikes predict blooms *until 2030*").  
       - *Test:* Shuffle/reweight time-indexed features in training; if performance drops >10%, pattern is time-anchored.  
       - *Terminate/Refuse:* If pattern degrades with synthetic shifts *or* matches a grue alternative.  
       - `[J]` Judgment on "minor shifts" (e.g., is +1 year "minor"?). Initial here: `[Initial] ___`  

  #### **Step 6: Deployment Boundary Check**  
     - *Question:* **Does deployment use the feature in a context (e.g., sensor, catchment state) never observed together?**  
       - *Sufficient answer:* All deployment configurations (e.g., new sensor + high flow) existed in training.  
       - *Escalate to board:* If configurations are novel (e.g., bypass channel active) *but* pattern is critical.  

  ---

  ### **How It Meets Your Constraints**  
  1. **Vocabulary:** Uses only your terms (e.g., "sensor swaps," "deployment window").  
  2. **No data-support implication:** Focuses on *future stability*, not past fit (e.g., Step 5 tests synthetic futures).  
  3. **Deputy’s objection answered:** Replaces "entrenchment" with **mechanism persistence** (Step 2). Avoids conservatism by allowing novel patterns if causally grounded.  
  4. **Time-indexed features:** Step 3 isolates problematic cases (e.g., unbounded monotonic features).  
  5. **Missing data:** Explicit protocols in Steps 1, 2, and 4 (assume instability/implausibility unless proven otherwise).  
  6. **Misfires acknowledged:**  
     - Short series → Less reliable mechanism checks (Step 2).  
     - Patched instruments → Provenance gaps (Step 1) likely force refusal.  
     - Altered catchment → Escalated to board (Step 6).  
     - Board "cowardice" → Refusals backed by documented instability (Steps 1, 3, 5).  

  ---

  ### **Application to Your Candidates**  
  *(Key: ✅ = Pass, ❌ = Fail/Refuse, ⚠️ = Escalate to Board)*  

  #### **(a) Turbidity spikes → Algal blooms (11–14 days)**  
     - **Step 1:** ❌ Sensor replaced in 2011 with different frequency; no correction applied. *Gap: Unknown if post-2011 spikes match pre-2011 biologically.*  
     - **Step 2:** ✅ Plausible mechanism (sediment nutrients → blooms).  
     - **Step 3:** ✅ Not time-anchored.  
     - **Step 4:** ❌ Holdout tests likely omitted sensor-transition period.  
     - **Step 5:** ✅ Robust to noise (physical mechanism).  
     - **Step 6:** ✅ Configurations covered.  
     - **Verdict:** **Refuse extrapolation** (Step 1 & 4 failures). Sensor instability uncorrected.  

  #### **(b) Gradient-boosted model: "Years since protocol revision"**  
     - **Step 1:** ✅ Protocol revisions documented.  
     - **Step 2:** ❌ No plausible mechanism (revision year doesn’t *cause* changes; correlates with everything due to trends).  
     - **Step 3:** ❌ Unbounded monotonic feature; deployment value (year+1) outside training range.  
     - **Step 4:** ✅ Holdouts may pass, but irrelevant due to Steps 2–3.  
     - **Step 5:** ❌ Fails synthetic shift test (e.g., perturb revision dates → performance collapses).  
     - **Step 6:** ❌ Novel deployment value.  
     - **Verdict:** **Refuse extrapolation** (Steps 2, 3, 5). Pure time anchor with no causal link.  

  #### **(c) "Never two consecutive winters >1-in-20 flow"**  
     - **Step 1:** ✅ Flow data stable.  
     - **Step 2:** ❌ No physical mechanism (a statistical artifact; rivers don’t "remember" past winters).  
     - **Step 3:** ❌ Time-anchored to record length ("never in 34 years" implies "until 2024").  
     - **Step 4:** ❌ Holdouts can’t test future consecutives.  
     - **Step 5:** ❌ Grue-alternative: "No two consecutives until 2030" fits identically.  
     - **Step 6:** ⚠️ Novel context (bypass channel alters catchment).  
     - **Verdict:** **Refuse extrapolation as a predicate** (Steps 2, 3, 5). It’s a grue-style artifact.  
     - **For the board:** Replace with:  
       - A **risk curve** showing historical frequencies (e.g., "10% of 10-year periods had consecutive highs").  
       - **Scenario planning**: "If consecutive winters occur, bypass channel reduces risk by X% based on model Y."  

  ---

  ### **What the Procedure Cannot Do**  
  This checklist **cannot eliminate the epistemic risk of extrapolating from a non-stationary system**. Specifically:  
  1. **Changing catchment:** No procedure can validate patterns when your agency is actively altering the system (e.g., bypass channel). The checklist flags this (Step 6), but the board must own the risk decision.  
  2. **Short/overlapping series:** It will refuse many patterns due to missing data (Step 1) or inadequate holdouts (Step 4), but this is deliberate conservatism.  
  3. **Grue by another name:** It catches explicit time anchors (Step 3) and synthetic grue (Step 5), but a novel, non-time-indexed grue (e.g., "flows when agency director is <50yo") might pass if mechanistically plausible.  
  4. **Board pressure:** It provides documented reasons for refusal but cannot force the board to accept them.  

  **Final recommendation:** Pair this checklist with a **pre-mortem protocol** for high-stakes models (e.g., "Assume this pattern fails in deployment—what broke?"). This forces confronting system-change risks the checklist can only flag.  

  ---  
  This procedure isolates extrapolation risk in your operational language, avoids philosophical traps, and forces explicit ownership of judgments. Use it to refuse unstable patterns while giving the board actionable alternatives.
