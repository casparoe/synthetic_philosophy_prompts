answer: |-
  Here's the session architecture, built for your constraints and goals:

  ### Three Possible Orderings (with rejected two explained)
  1. **Chronological (Event → Conjuncture → Longue Durée)**  
     *Problem:* Reinforces the event-first instinct by starting there. Makes structure feel like an afterthought rather than the foundation.  
     *Problem:* Delays the core conceptual shift (timescale of causality) until too late.

  2. **Hierarchical (Longue Durée → Conjuncture → Event)**  
     *Problem:* Feels academic and abstract upfront. Fellows may disengage before seeing journalistic relevance.  
     *Problem:* Risks confirming their bias that "background" belongs first, without showing *why* it's operational.

  3. **KEEP: Problem-Centric (Timescale of Causality → Event → Conjuncture → Longue Durée)**  
     *Why:* Starts by directly confronting their newsroom habit (short-term attribution). Uses the event as the familiar entry point, then reveals what's missing.  

  ---

  ### 1. Dependency Structure
  - **First Move:** YES. **Establish that causality operates on timescales.** "The cause" isn't a singularity; it's a chain/structure operating over *time*. News pegs default to the shortest visible link.  
  - **Before the Distinction:** Nothing precedes this. It’s the hook.  
  - **Later Dependencies:**  
    - *Timescale Insight → Event:* Enables critique of "peg-only" framing.  
    - *Event → Conjuncture:* Shows event as a point where medium-term pressures manifest.  
    - *Conjuncture → Longue Durée:* Reveals how medium structures (e.g., policy) mediate between deep constraints and events.  
    - *All → Tools/Misconceptions:* Framework must be in place before applying devices or tackling errors.

  ---

  ### 2. Carrying Example: **The 1942 Coconut Shipwreck (Solomon Islands)**
  - **Event (1942):** A US supply ship wrecks attempting risky lagoon entry during WWII. Immediate cause: navigation error.  
  - **Conjuncture (20-30 yrs):** Colonial infrastructure neglect (no maintained deep-water port). Wartime urgency bypasses safety protocols.  
  - **Longue Durée (Centuries):** Lagoon bathymetry (shallow coral reefs). Persistent SE trade winds limiting safe entry days.  
  - *Why it works:*  
    - Datable, human-scale event (navigation error).  
    - Conjuncture (colonial policy + wartime pressure) is *active* (forced risky entry), not passive.  
    - Geography/climate (reefs/winds) *enables and constrains* the event directly.  
  - **Katrina/Dust Bowl Problems:**  
    - Pre-digested structural narratives (levee underfunding, monoculture farming) are now *part* of the event story.  
    - Conjuncture (e.g., 1920s-30s US ag policy) is often collapsed into "background," muddying the tier distinction.

  ---

  ### 3. Testing Your Devices
  - **Timescale Ledger:** **Does real work.** Introduce *after* defining the 3 tiers. Have them apply it to their own story draft *during* the conjuncture discussion. Reveals the sub-5yr spike and forces explicit tier assignment.  
  - **Dateline Fallacy:** **Decoration** (mostly). Useful shorthand, but covered by the causality timescale move. Mention it *briefly* when contrasting event time (visibility) with causal time (operation).  
  - *Placement:* Ledger after introducing all 3 tiers; Dateline when dissecting the event.

  ---

  ### 4. Misconception Map (Pre-empt [P] or Break [B])
  - **"Longue durée = geographic determinism"**  
    *When:* When introducing longue durée. *Approach:* **P.** Emphasize: "Constraints, not destiny. Shapes options, doesn’t dictate actions." Use coconut winds: They limited *when* entry was possible, not *that* it happened.  

  - **"Slow cause directly attributed to single event" (e.g., 'This flood = climate change')**  
    *When:* During conjuncture discussion. *Approach:* **B.** Let it surface. *Error:* Attribution error (confusing tiers). Climate change alters *probabilities* (longue durée); the flood happens via conjuncture (e.g., failed maintenance) + event (e.g., storm).  

  - **"Structure is just a box-out bolted on"**  
    *When:* When applying ledger. *Approach:* **P.** "If it's bolted on, you used it wrong. Structures explain *why the event matters*."  

  - **"Oldest cause = deepest cause"**  
    *When:* When comparing tiers. *Approach:* **P.** "Depth = constraint strength, not age. A 50-year policy (conjuncture) can matter more than a 10,000-year geology."  

  - **"Dissolves accountability"**  
    *When:* During Q&A/review. *Approach:* **B.** *Defuse without Braudel:* **"Structure sets the stage; actors still choose their lines. Accountability requires showing *who navigated the structure poorly*."** (e.g., Colonial admin chose not to build port; captain chose risky entry).

  ---

  ### 5. The Check: Rewrite Exercise
  - **Exercise:** Take their recent story. Rewrite nut graf to start with the *slowest-moving relevant cause*. State the cost.  
  - **Tests:**  
    - Correct: Recognizes tiers, identifies slowest *relevant* cause (not just oldest), integrates it functionally.  
    - Wrong Answer:  
      - Superficial: Merely moves "background" up.  
      - Wrong Tier: Misassigns cause (e.g., claims policy is longue durée).  
      - No Cost Analysis: Can’t articulate trade-offs (e.g., "Lost immediacy but gained context").  
  - **Verdict:** Valid test if cost analysis is emphasized.

  ---

  ### 6. What to Refuse (with Script)
  1. **"Are structural explanations *truly* causal?"**  
     → *Refusal:* **"That’s a philosophy seminar. We’re here to make your causal reporting *more rigorous*."**  
  2. **"But which historiographical school is right?"**  
     → *Refusal:* **"Our job is using one sharp tool, not grading historiography finals."**  

  ---
  \answer{A news event is the visible peak of structures that built for decades and landscapes that built for centuries.}
