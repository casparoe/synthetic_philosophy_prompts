prompt: |-
  I was living in Edinburgh through the 2014 independence campaign and voted in it, and I am now doing some part-time postgraduate work on democratic theory, where I want to use that referendum as a case study of the boundary problem rather than as decorative background. The facts I am working from, so that we are not at cross purposes: the vote was held on 18 September 2014 on the simple question whether Scotland should be an independent country, needing only a simple majority; it was authorised by the 2012 agreement between the Scottish and UK governments and by the Scottish Independence Referendum Act 2013; the electorate was residence-based and about 4.3 million strong — British, Commonwealth and EU citizens resident in Scotland aged 16 or over, with 16- and 17-year-olds enfranchised for the first time — so that Scots living in England or Wales could not vote while EU citizens living in Scotland could, and the voters of the rest of the United Kingdom had no say at all; the result was 55.3 per cent No to 44.7 per cent Yes on a turnout of 84.6 per cent. What I want first is a disciplined mapping rather than an opinion. Take three or four of the standard answers to the boundary question — everyone whose interests are materially affected, everyone who would be subject to the coercion of whichever state or states result, the constituent-power view on which a people with a claim to self-determination simply is the right unit, and the thinner civic view on which lawful residence and a stake in the community suffice — and tell me what franchise each would actually have produced that September. I especially want four pressure points: the Scots resident elsewhere in the UK who were excluded; the EU citizens resident in Scotland who were included and whose citizenship would have been transformed twice over had Scotland left the UK and joined the EU; the 16- and 17-year-olds, and, if a criterion reaches them, why it does not also reach the 15-year-olds and the not-yet-born who will live longest with the outcome; and the rest of the UK, whose defence, currency, debt and EU membership were all in play.

  Then say which criterion the actual franchise best matches and which it flatly contradicts — and then run the case the other way, because what interests me most is what it shows about the theory. Two features strike me as badly handled by the way the boundary question is normally posed. The first is that this demos was not discovered but chosen by a party to the dispute: the Scottish Government drafted the franchise, the Scottish Parliament enacted it, Westminster consented, and each contested element of it — the lowered voting age, the exclusion of Scots abroad, the inclusion of EU residents — was widely taken at the time to favour one side. As I have encountered it, the discussion asks which boundary is correct and seems to have very little to say about a boundary strategically chosen by one of the parties, where who decides is settled by a decision that is undemocratic in just the sense under discussion. Is that a genuine gap, or does one of the criteria already absorb it? The second is a test I have been turning over and cannot make work, which I have been calling the reconstitution condition: the demos competent to dissolve a union must be the same demos, constituted in the same way, that would be competent to reconstitute it, so that a decision which cannot be revisited by the electorate that inherits its consequences — because those voters are dead, newly enfranchised or newly arrived — is defective in a way that has nothing to do with the justice of the cause. Does that condition collapse into one of the standard criteria? Does it condemn cases we take to be clear, such as the American colonies or the secession that produced the Irish Free State, since those were irreversible too? And does it do any work on the problem of the chosen demos, or only relocate it one level up?

  What I want from the answer is discipline about the mapping rather than breadth: who the rival claimants are, what each criterion counts as evidence of affectedness or subjection, what verdict it returns on each pressure point, and where it falls silent instead of being made to speak. I would rather have 700 careful words than a tour of the positions available, and I should mention that I am writing this from a borrowed flat with no library and no internet, so argument and example are all I can use and pointers to literature would be wasted on me.
reasoning: |-
  Okay, let's start by unpacking the user's query. They’re working on democratic theory, specifically using the 2014 Scottish independence referendum as a case study for the boundary problem. The user was in Edinburgh during the campaign and voted, so they have firsthand experience. Now, they need a disciplined mapping of how different democratic criteria would have shaped the franchise.

  First, I need to recall the key facts they provided: the referendum date, the electorate criteria (residence-based, including 16+ residents, EU citizens, excluding Scots elsewhere in UK), and the result. Their main request is to apply four standard criteria to this case: affected interests, subjection to coercion, constituent power, and civic stake. Then, analyze each against the pressure points: Scots outside Scotland, EU residents in Scotland, 16-17 year olds vs. younger, and the rest of the UK.

  The user also has two deeper concerns. First, the franchise wasn't discovered but chosen strategically by the Scottish Government, which isn't well-addressed in existing theory. Second, their reconstitution condition—whether the same demos that dissolves a union should be able to reconstitute it. They wonder if this condition holds up against historical cases like the American or Irish secessions.

  I should start by mapping each criterion to the actual franchise. For affected interests, anyone materially impacted should vote. That includes Scots outside Scotland (since independence affects pensions, property) and the rest of the UK (due to shared debt, defense). But EU residents in Scotland might be included only if their interests (jobs, residency) are considered. The 16-17 year olds are included as affected, but why not 15-year-olds? The line is arbitrary here. Subjection to coercion would include everyone under the new state's laws, so Scots in Scotland and possibly EU residents, but excludes those outside. Rest of UK isn't subject to Scottish laws, so excluded. Constituent power focuses on the "people" claiming self-determination, likely Scots in Scotland, excluding those outside and the rest of UK. Civic stake includes residents with community ties, so EU citizens are in, Scots abroad out. Age inclusion here is again arbitrary.

  Next, comparing the actual franchise to these criteria. It aligns with constituent power and civic stake but conflicts with affected interests and subjection by excluding Scots outside and the rest of UK. 

  Handling the user's deeper points: the strategic choice of demos by the Scottish Government highlights a gap in theory. Most criteria assume a pre-existing demos, not one shaped by political actors. The reconstitution condition argues that the same demos should be able to reverse the decision. But in irreversible cases like secession, future generations can't reconstitute the union. This condition might collapse into the affected interests criterion since the unborn are affected but can't vote. However, it adds a temporal dimension that standard criteria lack. For the user, this might show that the boundary problem isn't just about who votes but also about the decision's reversibility and intergenerational justice.

  The user might be seeking to critique democratic theory's limitations in handling strategic franchise manipulation and irreversible decisions. Their reconstitution condition could be a novel contribution, so I should analyze its validity without dismissing it. They might also want to highlight how real-world referendums involve power dynamics, which theories often overlook. Ensuring the response stays focused on mapping criteria and addressing their specific questions without digressing into literature is crucial.
answer: |-
  Here is a disciplined mapping of the 2014 Scottish independence referendum franchise against four democratic boundary criteria, followed by an analysis of your core challenges:

  **1. Mapping Franchises to Criteria:**

  *   **A. Affected Interests:** All materially affected individuals.
      *   *Franchise:* UK-wide + Scots abroad (due to shared debt, currency, pensions, defence, EU membership implications). Includes EU residents in Scotland (local impact). Likely includes 16-17yos (long-term impact) but excludes younger/unborn (practical exclusion).
      *   *Pressure Points:* Includes Scots elsewhere in UK (significant interests), Includes EU residents (local interests), Includes 16-17yos (future interests), **Includes rest of UK** (profoundly affected). Excludes unborn/very young (practical limit).
  *   **B. Subjection to Coercion:** All subject to the binding laws of the resulting state(s).
      *   *Franchise:* Residents of Scotland (subject to new Scottish state). Potentially ambiguous on EU residents (subject during residence). Excludes Scots outside Scotland (subject to rUK laws). Excludes rest of UK (not subject to Scottish laws).
      *   *Pressure Points:* Excludes Scots elsewhere in UK (subject to rUK, not Scotland), Ambiguous/Includes EU residents (subject while resident), Includes 16-17yos (future subjects), **Excludes rest of UK** (not subjects). Silent on age cut-off justification.
  *   **C. Constituent Power (Self-Determination):** The pre-political "people" claiming the right to decide.
      *   *Franchise:* Ethnically/culturally defined Scots (wherever resident). Or, resident Scottish citizens (excluding EU residents). Typically excludes minors. Highly contested definition.
      *   *Pressure Points:* **Includes Scots elsewhere in UK** (part of the "people"), Excludes EU residents (not part of the "nation"), Excludes 16-17yos (often minors excluded traditionally), Excludes rest of UK (different "people"). Silent on defining the "people".
  *   **D. Civic Stake (Residence/Community):** Those with a stake through lawful residence and participation.
      *   *Franchise:* All residents of Scotland (including EU citizens), typically adult residents. May include 16-17yos if deemed participatory.
      *   *Pressure Points:* Excludes Scots elsewhere in UK (no residence), **Includes EU residents** (resident stakeholders), Includes 16-17yos (if participatory), Excludes rest of UK (no Scottish residence). Silent on why 16+ not 15+ (arbitrary threshold).

  **2. Actual Franchise Match & Contradiction:**

  *   **Best Match:** **Civic Stake (D)**. The actual franchise (residents aged 16+, incl. EU citizens) aligns closely with a residence-based community stake model.
  *   **Flattest Contradiction:** **Affected Interests (A)**. The actual franchise explicitly excluded the two largest groups materially affected: Scots resident elsewhere in the UK and, crucially, **the entire electorate of the rest of the UK** (rUK), whose national assets, debt, currency, defence, and EU membership were fundamentally at stake.

  **3. Your Core Theoretical Challenges:**

  *   **The "Chosen Demos" Gap:** This is a **genuine gap** in standard boundary theory. The criteria (A-D) typically assume a pre-existing, discoverable demos. They offer no principled way to evaluate *who gets to choose the choosing unit* when that unit itself is contested and strategically defined by one party (here, the Scottish Government/Parliament, with Westminster consent). The criteria are static; they assess the *resulting* franchise, not the *process* of its strategic construction. None inherently absorb the meta-question of authority to define the demos. This highlights the **prior political decision** inherent in boundary-setting, often masked as a theoretical discovery.
  *   **The Reconstitution Condition:**
      *   **Collapse?** It does not neatly collapse into a standard criterion. It introduces a **temporal and reversible legitimacy constraint** distinct from static snapshots of interest, subjection, or identity. It resonates weakly with "Affected Interests" regarding future generations but adds a specific procedural requirement: reversibility by the same (or identically constituted) demos.
      *   **Condemn Clear Cases?** Yes, it **problematizes irreversible secessions** like the American Colonies and Irish Free State. Future generations (including the unborn, new citizens, new adults) inherit the consequence but cannot reconstitute the prior union. The condition suggests such decisions possess a democratic defect *regardless of substantive justice* – they lock in outcomes for those who had no voice. This challenges foundational narratives of national liberation.
      *   **Work on the "Chosen Demos"?** It **relocates rather than resolves** the problem. Determining *which* demos must satisfy the reconstitution condition (e.g., Scotland-alone? rUK? UK-wide? Ireland/UK?) replicates the initial boundary dilemma at a higher level. If the dissolving unit (Scotland-alone) is strategically chosen, requiring *it* to be the reconstituting unit merely entrenches that choice. Applying it to the *prior* union (UK-wide) condemns the dissolution as illegitimate without rUK consent. The condition highlights the temporal bind but struggles with the foundational "who decides" question.

  **Conclusion on the Case Study:** The 2014 franchise demonstrates that practical resolutions to the boundary problem are often political settlements (civic residence here) rather than theoretically pure deductions. It exposes the **strategic manipulation of the demos itself** as a critical, under-theorized dimension and reveals the **temporal dilemma of irreversible constitutional change** for future generations and disenfranchised populations. Standard criteria struggle with both the *provenance* of the demos and the *finality* of the decision. Your reconstitution condition sharpens the temporal critique but inherits the initial boundary conundrum. The case underscores that boundary-setting is fundamentally an exercise of power, not just a question of democratic theory.
