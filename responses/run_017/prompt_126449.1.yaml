  | **Y, Y, N, N, Y**             | *Unoccupied Cell 5*                                                               | **Diagnosis:** Unattractive. Acknowledges sentience (Q1Y) but rejects precaution (Q4N), higher stunning risk (Q3N), *and* aggregation (Q5Y), leaving minimal welfare basis. |
  | **Y, N, Y, Y, N**             | *Unoccupied Cell 6*                                                               | **Diagnosis:** Incoherent. Denies reflexes/hormones are insufficient evidence (Q2N) but acknowledges sentience in prawn (Q1Y), conflicting with the Species B stipulation. |
