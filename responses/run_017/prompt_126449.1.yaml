  ## Technical Annex: Decision Instrument for Classifying Positions on Crustacean Welfare Standards

  This annex presents a classification instrument for the Aquaculture Certification Working Group. The instrument structures defensible positions on extending finfish welfare standards to farmed crustaceans. Its foundation is the entry commitment that moral considerability depends solely on the capacity for valenced experience (e.g., suffering, pleasure), rendering species membership and ecological role irrelevant. The instrument branches via five diagnostic questions derived from concrete cases or claims. Three cases utilize stipulated facts commissioned for this exercise; the stipulated facts are treated as given. The instrument maps answer combinations to named positions and identifies unexplored or incoherent combinations.

  ### Part 1: Logical Space of Positions

  The decision tree begins with the entry commitment and branches on five sequential questions. Each question requires a Yes or No answer based solely on the stipulated facts and the implications of prior answers for the capacity for valenced experience and its moral relevance.

  1.  **Question 1 (Based on Stipulated Case 1 - Species A Prawn):** Does the presence of a functional opioid receptor system coupled with a behavioral response to analgesics (resuming normal feeding faster after injury when treated) constitute sufficient evidence that Species A possesses the capacity for valenced experience?
      *   *Branch:* Yes / No

  2.  **Question 2 (Based on Stipulated Case 2 - Species B Tilapia):** Does the absence of a valenced experience, despite intact nociceptive withdrawal reflexes and stress hormone responses (as stipulated for Species B), imply that such reflexes and hormonal responses are *insufficient* evidence, by themselves, for concluding an animal possesses the capacity for valenced experience?
      *   *Branch:* Yes / No

  3.  **Question 3 (Based on Stipulated Case 3 - Stunning Apparatus):** Does the risk of immobilization without insensibility (where sentience remains fully intact) during a procedure like electrical stunning constitute a greater welfare harm for an individual crustacean (compared to a finfish) if both possess the capacity for valenced experience, given the higher failure rate and different failure mode?
      *   *Branch:* Yes / No

  4.  **Question 4 (Designed):** Does uncertainty about the capacity for valenced experience in a group of animals (like crustaceans) justify applying precautionary welfare standards equivalent to those applied to animals known to possess that capacity?
      *   *Branch:* Yes / No

  5.  **Question 5 (Designed):** Does the total welfare impact (e.g., total suffering) depend solely on the intensity and duration experienced by *each individual*, making the *number* of affected individuals irrelevant to the moral calculus?
      *   *Branch:* Yes / No

  Each combination of answers to these five questions (e.g., Y-N-Y-N-Y) defines a unique logical cell within the space of possible positions. The sequence of answers determines the path through the tree to a specific leaf.

  ### Part 2: Mapping Positions to the Logical Space & Diagnosing Unoccupied Cells

  The following table locates the named positions within the logical space defined by the answer combinations to Questions 1-5. Each position occupies a specific leaf (combination). Unoccupied combinations are identified, and a brief diagnosis for their emptiness is provided.

  | **Leaf (Q1, Q2, Q3, Q4, Q5)** | **Position Label**                                                                 | **Brief Description**                                                                                                                               |
  | :---------------------------- | :-------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Y, Y, Y, Y, N**             | **Precautionary Position**                                                        | Grants crustaceans benefit of the doubt due to uncertainty. Welfare standards should account for number of individuals.                              |
  | **Y, Y, Y, N, N**             | **Sentience-Based Position (Probability Weighted)**                               | Welfare standards count crustaceans proportionally to assessed probability of sentience. Aggregates welfare across individuals.                      |
  | **Y, Y, N, Y, N**             | *Unoccupied Cell 1*                                                               | **Diagnosis:** Incoherent. Acknowledges sentience (Q1Y) and precaution (Q4Y) but denies higher stunning risk (Q3N) contradicts the sentience premise. |
  | **Y, Y, N, N, N**             | *Unoccupied Cell 2*                                                               | **Diagnosis:** Unattractive. Acknowledges sentience (Q1Y) but rejects both precaution (Q4N) and higher stunning risk (Q3N), offering no clear rationale for action. |
  | **Y, Y, Y, Y, Y**             | *Unoccupied Cell 3*                                                               | **Diagnosis:** Incoherent. Precaution (Q4Y) logically requires aggregating potential harms across individuals, contradicting Q5Y (no aggregation).      |
  | **Y, Y, Y, N, Y**             | **No-Aggregation Position**                                                       | Acknowledges sentience but minimizes only the worst individual suffering; number of suffering individuals is irrelevant.                             |
