prompt: |-
  hey — I need a spec, not another opinion piece. I'm trying to write the decision rule for an agent that gets offered one-shot gambles whose expected value doesn't exist (Pasadena-style: toss a fair coin till it lands heads, and if that's the nth toss you win 2^n/n when n is odd and lose it when n is even), and every rule I end up with is really just one intuition with a formula stapled to it. So: write me the desiderata. What would an account of what such a game is worth have to deliver before I should take it seriously?

  Fixing the purpose so adequacy has something to be relative to: the agent is offered a game once, at a stated price, and has to answer yes or no; sometimes it's allowed to quit partway through; and sometimes it already holds other bets on the same coin flips. I want verdicts out of the theory in those situations, not a shrug and a discussion of what "value" really means.

  Cases I think any list has to handle — add to these, and tell me if any of mine is a fake requirement wearing a tie:

  - St. Petersburg sitting right next to Pasadena. Infinite expectation and undefined expectation are different failure modes, and I don't want a theory that flattens both into "EV is broken here".
  - The capped versions. Truncate Pasadena at N tosses with nothing paid if no heads shows up by then, and its expectation is the Nth partial sum of the alternating harmonic series, so those truncated values close in on ln 2 from both sides. Does that force "value = limit of the truncations" on me? Note the same move hands St. Pete an infinite value, so whatever I use to refuse St. Pete is doing separate work.
  - Shifting and bundling. If I'll pay x for G I should pay x+1 for G-with-a-dollar-added-to-every-payout, and 2x for two independent copies of G. If a theory does hand Pasadena a number, does it keep these? My hunch is that "it's worth ln 2" breaks somewhere on bundling, but I can't turn the hunch into an actual conflict.
  - Scrambled Pasadena: keep the payout amounts and their probabilities exactly as they are, but hang them on scattered sets of coin sequences instead of the tidy "first heads at toss n" sets. Must the value be unchanged? It looks compulsory if value only cares about how probable each payout is — and it stops looking compulsory once the agent also holds a side bet that pays off when the first heads lands on an even-numbered toss, because then two games with identical payout distributions aren't interchangeable to it at all. So is "value supervenes on the distribution" a genuine desideratum or just the prejudice of the probability-first camp?
  - The quittable version. Conditional on k tails so far, continuing looks worth about 2^k times the tail of the alternating harmonic series — on the order of 2^k/2k, sign flipping with every extra tail, unless I've botched that. So ex ante the game is worth roughly $0.69 to an agent who's locked in, while at every node the local verdict is enormous and switches sign. What am I allowed to demand here: dynamic consistency, agreement with the locked-in value when quitting isn't on the table, "the option to quit can only help"? I suspect at most two of those live together.
  - Money versus utility. Utility bounded above defuses St. Pete; what defuses Pasadena is utility bounded *below*, which is a much stranger thing to sign up for when the losses in these games are unbounded. Is "defined values for every game, at the price of a floor as well as a ceiling" a requirement, or a bullet I'm permitted to spit out?

  Then: order the requirements, mark which are non-negotiable and which are just what one camp happens to like, and — the part I actually want — find me the subsets that can't all be satisfied at once, and say which single requirement kills off the most candidates. A short scorecard at the end is fine (truncate-and-take-the-limit, "undefined means any price goes", bounded utility, nonstandard/hyperreal expectations, dominance-ish or long-run rules), but keep the weight on the criteria and their cases; I'll argue with the contenders myself.
reasoning: |-
  We are to list desiderata for a decision rule for an agent faced with one-shot gambles that have undefined expected value (like the Pasadena game). The agent may be offered the gamble at a stated price and must decide yes/no, may have the option to quit partway, and may hold other bets on the same coin flips.

  We are given several cases that any such theory must handle. We will expand on these and then formulate a set of desiderata.

  ### Cases to Handle (as provided and expanded)

  1. **St. Petersburg vs. Pasadena Distinction**: 
     - St. Petersburg has infinite expectation (EV = ∞) while Pasadena has undefined expectation (the series for EV is conditionally convergent). The theory must treat these differently.

  2. **Capped Versions**:
     - When the Pasadena game is truncated at N tosses (with no payout if no heads by N), the expectation is the N-th partial sum of the alternating harmonic series, which converges to ln(2) ≈ 0.69 as N → ∞. However, the same truncation for St. Petersburg gives an expectation that grows without bound. The question: must the value of the full Pasadena game be ln(2)? And if not, why not?

  3. **Shifting and Bundling**:
     - If an agent is willing to pay x for a gamble G, then:
       - For G shifted by adding a fixed amount c to every payout, the agent should be willing to pay x+c.
       - For two independent copies of G, the agent should be willing to pay 2x (if the value is additive).
     - We suspect that if the Pasadena game is assigned ln(2), then shifting and bundling might break.

  4. **Scrambled Pasadena**:
     - Consider a gamble that has the same payout distribution as the Pasadena game (i.e., the same probabilities for the same amounts) but the payouts are assigned to different sequences of coin flips. 
     - If the agent holds side bets (for example, a bet that pays off when the first heads is on an even toss), then the scrambled version might not be equivalent. 
     - Should the value of the gamble depend only on the distribution of payouts, or also on how the payouts correlate with other gambles the agent holds?

  5. **Quittable Version**:
     - In the Pasadena game, at any node (after k tails) the continuation value (if the agent must continue) is conditionally convergent and alternates in sign and grows in magnitude. However, ex ante (without quitting) the value might be ln(2). 
     - We want dynamic consistency: the ex-ante value should agree with the value at every node when quitting is not allowed, and the option to quit should only help (or at least not harm). But it seems that the continuation values are large and oscillating, so the agent might want to quit at some nodes even if ex ante the game is positive.

  6. **Money vs. Utility**:
     - For St. Petersburg, bounded utility (above) can resolve the infinite expectation. For Pasadena, bounded utility (below) might be needed to avoid unbounded losses. But is requiring utility bounded below acceptable? And does it help?

  ### Additional Cases to Consider

  7. **Multiple Independent Copies**:
     - If the agent is offered multiple independent copies of the Pasadena game, what is the fair price? Does the value per game change? (This is related to bundling.)

  8. **Correlation with Existing Holdings**:
     - If the agent already holds a side bet that is correlated with the Pasadena game (like the even-heads bet mentioned), then the value of the new gamble might depend on that correlation.

  9. **Weak Dominance**:
     - If gamble G1 always pays at least as much as gamble G2, then the agent should not value G1 less than G2.

  10. **Continuity/Stability under Small Perturbations**:
      - If we slightly change the payouts, the value should not jump discontinuously.

  ### Desiderata

  We now list the properties a decision rule should satisfy. We mark each as either **Non-negotiable** (N) or **Negotiable** (X) based on whether they are fundamental or a matter of taste. Note: what is non-negotiable may be debated, but we aim for objective criteria.

  1. **Distinguish St. Petersburg and Pasadena (N)**: The rule must assign different verdicts to these two games (e.g., one might be acceptable at any finite price while the other is not, or they have different values).

  2. **Truncation Consistency (X)**: If we set a truncation level N and the agent knows the game will be truncated at N, then the value is the expectation of the truncated game. But for the untruncated game, the rule need not assign the limit of the truncated expectations. However, if the rule does assign a value to the untruncated game, then it should be the limit of the truncated expectations when that limit exists and is finite (as in Pasadena). But note: St. Petersburg's truncated expectations diverge, so the rule may assign infinity or not assign a finite value.

  3. **Shift Invariance (N)**: If a gamble G has value x, then the gamble G' which is G plus a fixed amount c (added to every payout) has value x+c.

  4. **Additivity for Independent Gambles (X)**: If an agent is offered two independent copies of the same gamble G (with value x), then the value of the bundle should be 2x. However, this might be too strong for gambles with undefined EV because of correlation in the convergence issues. Alternatively, we might require homogeneity: the value of n independent copies should be n times the value of one copy (if the value is defined).

  5. **Distributional Supervenience (X)**: The value of a gamble depends only on the distribution of payouts. However, if the agent holds other gambles on the same underlying events, then this might not hold because of correlations. Therefore, we might require this only when the gamble is considered in isolation. But if the agent already has holdings, then the value might be context-dependent.

     - We propose two versions:
       - **Strong Supervenience (X)**: The value of a gamble is entirely determined by its payout distribution, regardless of how it is implemented and regardless of other holdings. (But this is likely too strong because of the side bet issue.)
       - **Weak Supervenience (X)**: In isolation (when the agent has no other bets), two gambles with the same distribution have the same value.

  6. **Dynamic Consistency (N)**: 
     - If the agent is locked in (cannot quit), the rule assigns a value v.
     - If the agent can quit at any point, then the value of the game with the option to quit should be at least v (since quitting can only help). Moreover, the strategy of never quitting should yield the same value as the locked-in version. However, the option to quit might lead to a higher value.

     - Additionally, the optimal quitting strategy should be consistent: the ex-ante value (with quitting) should equal the value computed by backward induction (using the rule at every node).

  7. **Boundedness of Utility (X)**: The rule may require utility to be bounded (above and/or below) to ensure that expectations are defined. However, we note that requiring boundedness below might be seen as a way to avoid unbounded losses, but it is a strong assumption.

  8. **Weak Dominance (N)**: If gamble G1 pays at least as much as gamble G2 in every state of the world, then the value of G1 is at least the value of G2.

  9. **Context-Dependence (X)**: The value of a gamble may depend on the agent's existing portfolio of bets. This is particularly important for the scrambled Pasadena and side bets.

  10. **Continuity (X)**: If two gambles are close in payouts (in some metric), then their values should be close. However, in the Pasadena game, small changes in the assignment of payouts to sequences might lead to large changes in correlation with existing bets, so this might be hard to satisfy if context matters.

  ### Conflicts Between Desiderata

  We now identify conflicts:

  - **Conflict 1: Truncation Consistency vs. Shift Invariance and Bundling**
    - Suppose we assign the Pasadena game the value ln(2) by truncation consistency (taking the limit of truncated expectations). 
    - Now consider shifting: the game G' that is Pasadena plus $1. Then by shift invariance, it should be worth ln(2)+1. 
    - Now consider bundling: two independent copies of Pasadena. If we require additivity, then the bundle should be worth 2*ln(2). 
    - However, the bundle of two independent Pasadena games does not have a distribution that is easily related to the alternating harmonic series. In fact, the expectation of the bundle is the sum of two conditionally convergent series, which can be rearranged to converge to any number (by the Riemann rearrangement theorem). Therefore, truncation consistency might not assign 2*ln(2) to the bundle. 
    - **Resolution**: If we require truncation consistency, shift invariance, and additivity, then we run into trouble because the bundle might not have a well-defined limit under truncation. Hence, at least one of these must be dropped.

  - **Conflict 2: Distributional Supervenience vs. Context-Dependence**
    - Strong supervenience says that two gambles with the same payout distribution have the same value. But if the agent holds a side bet that is correlated with one of the implementations (like the even-heads bet) and not the other (because of scrambling), then the value to the agent might differ. 
    - Therefore, if we require strong supervenience, we ignore the context of existing bets. But if we allow context-dependence, then strong supervenience fails.

  - **Conflict 3: Dynamic Consistency vs. Locked-in Value**
    - In the Pasadena game, the locked-in value might be ln(2). But at every node after an even number of tails, the continuation value is negative and large in magnitude (so the agent would quit). After an odd number, it's positive and large. 
    - Therefore, the ex-ante value with the option to quit might be higher than ln(2) because the agent avoids the large losses. But if we require that the locked-in value equals the value when the agent never quits, that holds. However, if we require that the value of the game with quitting is the same as without, that fails. 
    - We require that the option to quit can only help, so the value with quitting should be at least the locked-in value. This is consistent. The conflict is in the behavior at nodes: the local evaluations (if the agent must continue from that node) are large and oscillating, but the ex-ante value (with optimal quitting) might be finite and positive. This is acceptable as long as the backward induction using the rule is well-defined and consistent.

  ### Which Requirement is Most Damaging?

  The requirement that is most damaging to candidate theories is **Truncation Consistency** because:

  - It forces the value of the Pasadena game to be ln(2) (if we take the limit of the truncations) but then causes conflicts with additivity and shift invariance when considering multiple copies or shifted versions. Moreover, the same requirement for St. Petersburg would force infinity, which we want to avoid.

  Alternatively, the requirement of **Additivity for Independent Gambles** is also problematic because of the rearrangement issues when summing conditionally convergent series.

  ### Candidate Theories Scorecard

  We briefly score candidate approaches against the desiderata. We consider:

  1. **Truncate and Take the Limit (TTL)**: Assign the value as the limit of the truncated expectations (for Pasadena: ln(2)).
     - St. Pete: infinite (so distinct from Pasadena) → satisfies 1.
     - Truncation consistency: by definition → satisfies 2.
     - Shift invariance: yes, because shifting the payouts by c shifts the truncated expectation by c, and the limit by c → satisfies 3.
     - Additivity: fails. The bundle of two independent Pasadena games has a payoff that is the sum of two independent random variables each having the Pasadena distribution. The expectation of the bundle is the sum of two conditionally convergent series, which can be rearranged arbitrarily. The truncation method for the bundle might not yield 2*ln(2). → fails 4.
     - Distributional supervenience: in isolation, same distribution same value → satisfies weak supervenience. But if the agent has side bets, it might not account for correlation → fails strong supervenience in context.
     - Dynamic consistency: the locked-in value is ln(2). With quitting, the agent might avoid large losses so the value might be higher. The rule doesn't directly address quitting, but if we use the same truncation for the continuation value at a node, it might be large and oscillating, so the agent would quit at even nodes. The ex-ante value with quitting might not be ln(2). But the rule doesn't specify how to compute with quitting. → unclear.

  2. **Undefined Means Any Price Goes (Relativism)**: Since the expectation is undefined, any price is acceptable (or the agent can choose arbitrarily).
     - Distinguishes St. Pete and Pasadena? Not really: both are undefined in the sense of not being finite and well-defined, but St. Pete has a definite infinite EV. So we might say St. Pete is worth any finite price? Then they are not distinguished. → fails 1.
     - Other properties: shift invariance and additivity hold trivially? (If I assign arbitrary value to G, then G+c can also be arbitrary, and two copies arbitrary.) But then there is no guidance. → probably not useful.

  3. **Bounded Utility (BU)**: Use a utility function bounded above and below. Then expectations are defined for all gambles.
     - St. Pete: finite value (since bounded utility) → so distinct from Pasadena? Both are finite, but St. Pete might be very large and Pasadena might be around ln(2) (if utility is linear for the range of Pasadena payouts). But if utility is bounded, then the value of St. Pete is finite and the value of Pasadena is finite, so they are both defined but different → satisfies 1.
     - Truncation consistency: might hold approximately for large truncations if the utility function is close to linear in the range of the truncated payouts. But for the full game, the tails are cut off by the bounded utility so the value might not be exactly ln(2). → may fail 2.
     - Shift invariance: only holds if utility is linear, but bounded utility is typically not linear everywhere. So if we shift by a large amount, the utility might saturate. → fails 3.
     - Additivity: fails because of nonlinear utility and possible interactions (like risk aversion).
     - Distributional supervenience: holds because value is just the expected utility of the distribution.
     - Dynamic consistency: with bounded utility, we can compute expected utility at every node. The option to quit might be valued by backward induction. → satisfies 6.

  4. **Nonstandard/Hyperreal Expectations (NH)**: Represent the payouts and probabilities in a non-archimedean field, so that the conditionally convergent series can be assigned a value (like ln(2)) in a way that respects the ordering.
     - St. Pete: infinite (in the hyperreal sense) → distinct from Pasadena (which is finite) → satisfies 1.
     - Truncation consistency: the hyperreal expectation of the truncated game is the same as the standard, and the full game is the limit (in some sense) → satisfies 2.
     - Shift invariance: holds if we add a standard constant → satisfies 3.
     - Additivity: holds for independent gambles? The expectation of the sum is the sum of expectations. But note: the expectation of the Pasadena game is defined as a hyperreal number, say H. Then the expectation of two independent copies is 2H. So if H = ln(2) (a standard real), then 2H = 2*ln(2). However, the issue is that the expectation of the bundle in the hyperreal model might be defined as the sum of the two expectations. → satisfies 4.
     - Distributional supervenience: holds because expectation is defined by the distribution → satisfies 5 (weak).
     - Dynamic consistency: the hyperreal expected utility at every node might be defined, but they will be hyperreal numbers. How do we compare them? And the option to quit requires comparing hyperreals. Also, the continuation values are hyperreal and large in magnitude (but alternating sign). The agent would quit when the continuation value is negative. The ex-ante value might be the same as the locked-in value? → unclear, but potentially consistent.

  5. **Dominance or Long-Run Rules (DLR)**: Use a rule based on dominance or long-run performance (like the law of large numbers). For example, if the gamble is offered repeatedly, then the average payoff converges to a particular value. But for one-shot, this might not apply. 
     - For Pasadena, if we consider repeated independent plays, the average payoff might not converge (because the payouts are so heavy-tailed) → so this doesn't help.

  ### Non-negotiable Desiderata

  Based on the purpose (the agent must make a yes/no decision for a one-shot gamble, sometimes with quitting, and with existing holdings), the non-negotiable desiderata are:

  - **Distinguish St. Petersburg and Pasadena** (because they are fundamentally different).
  - **Weak Dominance** (to avoid irrational decisions).
  - **Dynamic Consistency** (if the rule gives a value at every node, then the quitting strategy must be consistent with those values).

  And perhaps:

  - **Shift Invariance** (because adding a fixed amount should shift the value by that amount).

  ### Conclusion

  The most damaging requirement is **Truncation Consistency** because it forces a specific value (ln(2) for Pasadena) but then causes conflicts with additivity and bundling. 

  The requirement that kills the most candidates is **Additivity for Independent Gambles** because it is difficult to satisfy for conditionally convergent gambles (due to rearrangement issues) and also because of nonlinear utility effects.

  ### Recommendation

  Given the conflicts, we might:

  - Drop additivity for independent gambles (or only require it for gambles with absolutely convergent expectations).
  - Allow context-dependence (so that the value of a gamble depends on existing holdings) and drop strong distributional supervenience.
  - Use a bounded utility function to ensure that all expectations are defined, and then the decision rule is standard expected utility. However, this requires a bounded utility, which may be controversial.

  Alternatively, if we want to preserve additivity and shift invariance, then the hyperreal/nonstandard approach might be the best, but it is mathematically complex and the dynamic consistency with quitting might be tricky.

  Finally, note that the option to quit makes the game a compound lottery, and we can use backward induction with a well-defined value at every node. This might require defining the value for the continuation game at every node. The nonstandard approach might provide a way to define these values.
answer: |-
  Below is a structured specification of desiderata for a decision rule handling one-shot gambles with undefined expected value (e.g., Pasadena games). The focus is on **adequacy criteria** derived from your use case: the agent must accept/reject a fixed price, may quit early, and may hold correlated side bets. Desiderata are ranked by criticality, with conflicts and trade-offs highlighted. A scorecard of candidate theories is included at the end.

  ---

  ### **Core Desiderata (Non-Negotiable)**  
  *Must hold for any viable theory; failure disqualifies the approach.*

  1. **Distinguish EV-Divergent vs. EV-Undefined Gambles**  
     - **Requirement**: Treat St. Petersburg (EV → ∞) and Pasadena (EV undefined) as fundamentally distinct.  
     - **Test Case**: St. Pete should be rejected at any finite price, while Pasadena admits a finite "fair price" (even if context-dependent).  
     - *Failure Example*: Theories that return "∞" or "undefined" for both flatten the distinction.

  2. **Weak Dominance**  
     - **Requirement**: If gamble *G* always pays ≥ gamble *H* (and sometimes >), *G*'s value ≥ *H*'s value.  
     - **Test Case**: Adding $1 to every Pasadena payout must increase its value by exactly $1 (shift invariance).  
     - *Rationale*: Prevents arbitrage and ensures monotonicity.

  3. **Dynamic Consistency under Quitting**  
     - **Requirement**: If quitting is allowed, the ex-ante value must equal the value computed via backward induction from continuations.  
     - **Test Case**: In quittable Pasadena, the optimal strategy (quit after even tails) must yield a value ≥ the locked-in value, and nodes' local decisions must cohere.  
     - *Rationale*: Avoids contradictions between pre-commitment and time-consistent plans.

  4. **Correlation Sensitivity**  
     - **Requirement**: Value must depend on how payouts correlate with the agent's existing bets.  
     - **Test Case**: "Scrambled Pasadena" (same payout distribution, different outcome mapping) may have a different value if the agent holds a side bet on even-numbered heads.  
     - *Rationale*: Payout distributions alone are insufficient when side bets exist.

  ---

  ### **Secondary Desiderata (Negotiable but Expected)**  
  *Violations weaken the theory but may be tolerable with justification.*

  5. **Truncation Robustness**  
     - **Requirement**: For capped Pasadena (at *N* tosses), the value must be the *N*-th partial sum of the alternating harmonic series. For full Pasadena, the value need not be ln 2.  
     - **Conflict**: Forces ln 2 if "value = limit of truncations" is imposed. Rejecting this allows distinct treatment of St. Pete (limit → ∞).  
     - *Trade-off*: Accepting truncation-consistency for Pasadena but not St. Pete requires a clear separating principle.

  6. **Additivity for Independent Copies**  
     - **Requirement**: The value of *k* independent copies of gamble *G* should be *k* × value(*G*).  
     - **Test Case**: Two independent Pasadena games should have twice the value of one.  
     - *Conflict*: Fails if value(Pasadena) = ln 2, as bundling creates a new conditionally convergent series manipulable via rearrangement.  
     - *Trade-off*: Relax to asymptotic additivity (e.g., for large *k*) or drop if correlation sensitivity dominates.

  7. **Bounded Utility Compatibility**  
     - **Requirement**: The theory should not require utility bounded below (only bounded above) to resolve Pasadena.  
     - **Rationale**: Unbounded losses are realistic; requiring a utility floor is ad hoc.  
     - *Conflict*: Bounded-below utility forces Pasadena to have a defined value but may overconstrain real-world preferences.

  ---

  ### **Contrived "Desiderata" to Reject**  
  *Commonly proposed but incompatible with core goals.*

  - **Distributional Supervenience**:  
    "Value depends only on payout probabilities, not outcome mappings."  
    - **Rejection**: Contradicts **Correlation Sensitivity** when side bets exist.  
    - *Your Insight*: Correctly identifies this as "probability-first camp prejudice."

  - **Single Truncation-Limit Value**:  
    "Full Pasadena value = ln 2 (limit of truncations)."  
    - **Rejection**: Conflicts with **Additivity** (bundled copies ≠ 2 ln 2) and **Correlation Sensitivity**.  
    - *Your Hunch Confirmed*: The conflict arises because rearrangement affects bundled series.

  - **Context-Independence**:  
    "Value is intrinsic to the gamble, ignoring existing holdings."  
    - **Rejection**: Incompatible with **Correlation Sensitivity** for scrambled games.

  ---

  ### **Conflict Analysis**  
  *Impossible combinations and critical trade-offs.*

  - **Irreconcilable Trio**:  
    {Additivity, Shift Invariance, Truncation-Limit Value (ln 2)}  
    - **Conflict**: If Pasadena value = ln 2, then two copies should be worth 2 ln 2 (Additivity). Shift Invariance requires adding $1 to increase value by $1. However, the bundled game's expectation is a rearranged series that converges to any real number (or diverges), violating both.  
    - **Resolution**: Sacrifice Additivity or reject ln 2 as the value.

  - **Dynamic Consistency vs. Locked-In Value**:  
    - **Conflict**: In quittable Pasadena, backward induction suggests quitting at even tails (avoiding large losses), raising the ex-ante value above the locked-in value (e.g., $0.69). Demanding equality contradicts "option to quit only helps."  
    - **Resolution**: Accept that quittable value ≥ locked-in value (core desideratum 3).

  - **The K.O. Requirement**: **Correlation Sensitivity**  
    Kills:  
    - Any distribution-based theory (e.g., "value = ln 2" or nonstandard expectations).  
    - Long-run frequency rules (ignore side bets).  
    - Theories assuming gambles are evaluated in isolation.  
    **Why**: Side bets force context-dependence; ignoring this violates real-world agent constraints.

  ---

  ### **Candidate Theories Scorecard**  
  *Ranked by desiderata compliance. "✓" = satisfies, "✗" = violates, "∼" = partial.*

  | Theory                     | Core 1–4 | Truncation Robust. | Additivity | Bounded Util. | Notes                                                                 |
  |----------------------------|----------|---------------------|------------|---------------|-----------------------------------------------------------------------|
  | **Contextual Expected Utility** | ✓✓✓✓     | ∼                   | ∼          | ✗             | Value = EU relative to portfolio. Handles correlation. Weak on truncation. |
  | **Dominance-Stable Rules**     | ✓✓✓✓     | ✓                   | ✗          | ✗             | Uses stochastic dominance; rejects additivity. Best on quitting.     |
  | **Hyperreal Expectations**     | ✓✗✓✗     | ✓                   | ✓          | ✗             | Assigns Pasadena ln 2. Fails correlation sensitivity.                |
  | **Limit Truncation (ln 2)**    | ✗✓✗✗     | ✓                   | ✗          | ✗             | Fails St. Pete/Pasadena distinction and correlation.                 |
  | **Bounded Utility**           | ✓✓✓✗     | ∼                   | ✗          | ✓             | Artificially defuses losses; may violate shift invariance.           |
  | **Undefined = Any Price**     | ✗✗✗✗     | ✗                   | ∼          | ✗             | Rejects all structure; useless for decisions.                        |

  #### **Recommendation**  
  - **Top Candidate**: **Contextual Expected Utility** (with correlation-sensitive weights).  
    - Pros: Clears all core desiderata. Handles side bets and quitting via backward induction.  
    - Cons: Truncation robustness and additivity are secondary; sacrifice them for flexibility.  
  - **Fallback**: **Dominance-Stable Rules** (e.g., pairwise comparisons with side bets).  
    - Pros: Strong dynamic consistency; cleanly handles weak dominance.  
    - Cons: Additivity fails; may not specify a unique "fair price."  

  #### **Why Others Fail**  
  - **Hyperreal/Nonstandard**: Ignores correlation with side bets (fails core 4).  
  - **Limit Truncation**: Forces ln 2, breaking additivity and correlation sensitivity.  
  - **Bounded Utility**: Requires utility floors (unrealistic) and fails additivity.  
  - **Undefined = Any Price**: Distinction collapse (fails core 1).

  ---

  ### **Final Specification**  
  A viable theory must:  
  1. **Distinguish** infinite-EV (St. Pete) and undefined-EV (Pasadena) gambles.  
  2. **Respect weak dominance** and **shift invariance** (+$1 → +$1 in value).  
  3. **Guarantee dynamic consistency** with quitting.  
  4. **Assign context-dependent values** when side bets exist.  
  5. **Avoid requiring utility bounds** or distributional supervenience.  

  **Trade-off Directive**: Prioritize correlation sensitivity and dynamic consistency over additivity and truncation-limit fidelity. Reject any theory that cannot handle scrambled games with side bets.  

  Use this framework to test candidate rules. For implementation, start with contextual EU or dominance-stable backward induction.
