  The user has clearly defined moral trade as reciprocal action between morally disagreeing parties where each benefits by their own standards. They've listed seven key questions: enforcement/commitment, unit of account, adverse selection, endogeneity, trade with non-standard agents, aggregative effects, and relation to existing practices. Their core request is a defended prioritization of these questions based on funder relevance, tractability, neglectedness, and dependency - with special attention to what's genuinely philosophical versus economic.

  Two strong hypotheses emerge from their thinking: that unit-of-account is the most upstream question (which I agree with), and that endogeneity has the most disruptive institutional implications (which I think needs refinement). The request also includes dynamic considerations - how answers might shift the landscape, and what would falsify the program's worth.

  Notable tensions in their position:
  - The funder wants actionable institutional changes, but foundational work may not deliver that in three years
  - Economists colleagues likely prefer applied work, but the philosophical core seems non-negotiable
  - The "sincere, stable views" assumption risks bracketing real-world moral persuasion dynamics

  What's particularly sophisticated is their awareness of second-order effects: how researching moral trade might alter its own subject (endogeneity), and how bilateral rationality could lead to collective irrationality (aggregative effects). Their fear of "Gresham's law of moral trade" suggests concern about unintended consequences dominating outcomes.

  For the response, I need to:
  1) Explicitly rank their questions with clear criteria weights
  2) Flag which are pseudo-questions or downstream 
  3) Distribute focus between philosophy and economics
  4) Engage their hunches rigorously
  5) Model how the field might shift with new answers
  6) Propose a falsification test

  The user's depth suggests they'll appreciate nuanced tradeoffs - like how tractability constraints might force difficult choices despite theoretical upstreamness. Since they're time-pressed (three-year program), I should emphasize scaffolding: what foundational work MUST happen before applied questions can be meaningfully addressed.
answer: |-
  Here’s a defended structuring of the research call, prioritizing questions by **upstream importance**, **funder relevance**, **tractability**, and **neglectedness**. I’ll explicitly weigh criteria, address your hunches, and outline dynamic dependencies.  

  ### **Criteria & Weights**  
  1. **Upstreamness** (30%): Does answering this unlock progress on others? Without it, other work may be incoherent.  
  2. **Funder Impact** (30%): Likelihood of changing institutional allocation (e.g., revealing pitfalls/opportunities funders can’t ignore).  
  3. **Tractability** (25%): Can philosophy + decision theory make progress in 3 years? Avoids empirical/measurement rabbit holes.  
  4. **Neglectedness** (15%): Is this overlooked relative to its importance?  

  ### **Ranked Research Priorities**  
  1. **Unit of Account**  
     - **Why #1**: *Your hunch is correct*. Until we define *what is traded* (e.g., "moral credit," obligations, resource control?), enforcement, adverse selection, and aggregation lack objects. If trade is denominated in a common currency (e.g., welfare units), it smuggles in a meta-ethical standard parties reject. If not, how do we compare "funding a mosque" to "funding a vaccine"?  
     - **Funder Impact**: High. Funders need to know what trades "look like" operationally (e.g., contracts, blockchain tokens, veto rights).  
     - **Tractability**: Moderate. Draws on modal logic (possible-worlds semantics for moral value) and decision theory under incommensurability.  
     - **Neglectedness**: High. Literature assumes a solution (e.g., money-like proxies) without rigor.  
     - **Philosophy/Economics Split**: 80% philosophy (meta-ethics, value theory), 20% institutional design.  

  2. **Endogeneity**  
     - **Why #2**: *Your hunch is half-right*. The drift toward "consequentialism-shaped" views isn’t just surprising—it’s existentially relevant to funders. If moral trade erodes the diversity it relies on, it self-defeats. But this isn’t upstream: it *presumes trade occurs*.  
     - **Funder Impact**: Highest. If trade causes normative drift, funders *must* design safeguards (e.g., trade quotas, view-preserving institutions).  
     - **Tractability**: High. Model using evolutionary game theory + moral uncertainty frameworks.  
     - **Neglectedness**: Extreme. Almost no work on how institutions reshape moral views endogenously.  
     - **Split**: 50% philosophy (normative dynamics), 50% economics/game theory.  

  3. **Adverse Selection (Gresham’s Law)**  
     - **Why #3**: Directly threatens feasibility. Permissive views (e.g., total utilitarianism) "flood the market," crowding out deontologists/nationalists. Funders care: if trade empowers views they oppose, they’ll avoid it.  
     - **Upstreamness**: Requires a unit of account (to define "offers") but informs enforcement design.  
     - **Tractability**: High. Extend signaling games to moral preferences.  
     - **Neglectedness**: High. Studied in prediction markets, not moral trade.  
     - **Split**: 30% philosophy (value aggregation), 70% game theory.  

  4. **Aggregative Effects**  
     - **Why #4**: Reveals if decentralized trade is *worse than no trade* (e.g., PD-like traps). Funders need to know if centralized oversight is essential.  
     - **Upstreamness**: Depends on unit of account + adverse selection.  
     - **Funder Impact**: High. Could kill enthusiasm for moral trade markets.  
     - **Tractability**: Moderate. Use agent-based modeling of moral networks.  

  5. **Enforcement & Commitment**  
     - **Why #5**: *Downstream of unit of account*. How to bind parties depends on *what* is traded (e.g., enforcing promises vs. transferring control rights).  
     - **Tractability**: High. Existing literature on self-enforcing contracts.  
     - **Neglectedness**: Low. Well-studied in game theory.  
     - **Split**: 10% philosophy, 90% economics.  

  6. **Trade with Non-Recognizing Agents**  
     - **Why #6**: A critical *application*, not a foundation. Depends on unit of account (how to "trade" with entities that can’t reciprocate?).  
     - **Funder Impact**: Medium-long term. Less urgent for initial institutional change.  

  7. **Relation to Existing Practices**  
     - **Why #7**: Downstream synthesis. Useful for framing, but not foundational.  

  ### **Pseudo-Questions & Downstream Issues**  
  - **"Is convergence a defect?"** (Endogeneity): Not a research question—it’s normative. The *fact* of convergence is what matters for institutions.  
  - **Sacred Values**: Subsumed under "unit of account" (if values are sacred, can they be traded? If not, trade fails).  
  - **Enforcement Mechanics**: Downstream of *what* is enforced.  

  ### **Missing Question: Trade Legitimacy**  
  - **Why it matters**: If parties view moral trade as corrupting (e.g., "selling principles"), uptake fails. This intersects with endogeneity and is crucial for funders designing acceptable systems. More philosophical than economic.  

  ### **Attacking Your Hunches**  
  - **Unit of Account**: **Agree strongly**. Without this, "moral trade" is a metaphor. Enforcement papers (e.g., contract theory) assume dollars or utility, but moral disagreement rejects these. *This is the keystone*.  
  - **Endogeneity**: **Refine your claim**. It’s high-impact but *not upstream*. Its power is in revealing tradeoffs: if trade causes drift, funders face a trilemma—enable trade (empower others), avoid trade (lose gains), or manipulate drift (undermine sincerity). *This is the most policy-relevant result*.  

  ### **Dynamic Shifts: What Changes the Ranking?**  
  - **If unit of account is resolved** (e.g., we define "moral credit" non-circularly):  
    - Enforcement/adverse selection become tractable → move up.  
    - Trade with non-agents becomes urgent → jumps to #2.  
  - **If unit of account is *impossible***: The entire program collapses → falsifies moral trade feasibility.  
  - **If endogeneity is proven inevitable**: Kills momentum for decentralized trade → shifts focus to aggregation/enforcement as damage control.  

  ### **Falsification Test for the Programme**  
  The program fails if, in 3 years, we cannot:  
  1. Define a *non-question-begging unit of account* for ≥2 incommensurable moral views (e.g., a nationalist vs. utilitarian), **and**  
  2. Show *either* that stable trade is feasible *or* diagnose why it isn’t (e.g., adverse selection dominates).  

  ### **Recommended Call Structure**  
  **Core Theme**: *Foundations for Feasible Moral Trade*  
  **Year 1**: Unit of account + adverse selection (build objects/identify barriers).  
  **Year 2**: Endogeneity + aggregative effects (test systemic risks).  
  **Year 3**: Enforcement + non-standard agents (design applications).  

  **Defend to Economists**: Frame unit of account as "specifying the commodity" in moral exchange (economics cares about tradable goods). Stress that endogeneity/adverse selection are market-design issues. Philosophy handles what’s *tradable*; economics handles *how to trade it*.  

  This ordering maximizes the chance of funder-relevant insights while ensuring early work enables later progress. If foundations crack, applications follow; if not, the programme saves funders from wasting billions.
