  ### Final Exam Question: Consequentialism and Infinite Value

  **Instructions:** Answer all parts. You may use your notes and problem sets. Aim for clarity and concision. Total: 25 marks.  
  **Nominal word count:** ~1500 words (not enforced).  
  **Time guidance:** Strong students should complete this in ~90 minutes.  

  ---

  #### Part A: The Shift Paradox (5 marks)  
  Consider an infinite population of people, one for each integer (positive and negative). In the **baseline outcome**, person \(n\) has welfare level \(n\). In the **shifted outcome**, person \(n\) has welfare level \(n+1\).  
  1. Explain why the multiset of welfare levels is identical in the baseline and shifted outcomes.  
  2. Explain why the shifted outcome is a Pareto improvement over the baseline.  
  3. Given your answers to (1) and (2), state which ethical principles conflict in evaluating these outcomes. Justify your answer.  

  #### Part B: Bounded Welfare and Permutations (5 marks)  
  A student argues that the conflict in Part A only arises because welfare is unbounded below. Another student claims that even if welfare were bounded below (e.g., all welfare levels \(\geq -100\)), a permutation could be crafted to produce the same conflict.  
  1. Construct a bounded-welfare example exhibiting the conflict *or* prove it is impossible.  
  2. Explain why boundedness (or its absence) is pivotal to the conflict.  

  #### Part C: Tethered Comparison of Permuted Worlds (10 marks)  
  Consider two outcomes:  
  - **Even-Odds**: Person \(n\) has welfare 1 if \(n\) is even, 0 if \(n\) is odd.  
  - **Odds-Evens**: Person \(n\) has welfare 0 if \(n\) is even, 1 if \(n\) is odd.  
  We compare outcomes using the **tethered difference rule**:  
  - Fix a nested sequence of finite sets \(S_1 \subseteq S_2 \subseteq \cdots\) whose union is all integers (a "tether").  
  - For outcomes \(A\) and \(B\), compute the total welfare difference \((A - B)\) over \(S_n\) for each \(n\).  
  - Rank \(A\) better than \(B\) if the difference is eventually always positive; \(B\) better than \(A\) if eventually always negative; else, incomparable.  

  1. Show that *Even-Odds* and *Odds-Evens* are permutations of each other. (1 mark)  
  2. Construct two different tethers (call them \(T_1\) and \(T_2\)) such that:  
     - Under \(T_1\), the rule ranks *Even-Odds* better than *Odds-Evens*.  
     - Under \(T_2\), it ranks *Odds-Evens* better than *Even-Odds*.  
     Explicitly define \(T_1\) and \(T_2\) and compute the difference sequences for each. (6 marks)  
  3. Does the tethered difference rule violate anonymity? Explain why or why not. (3 marks)  

  #### Part D: The Impossibility of Ideal Rules (5 marks)  
  1. Suppose we demand that a decision rule for infinite populations satisfies:  
     - **Responsiveness**: Saving one life (a finite welfare improvement) always yields a better outcome.  
     - **Tether-independence**: Rankings do not depend on the choice of tether.  
     - **Acyclicity**: No cycles of strict betterness (e.g., if \(A > B\) and \(B > C\), then \(A > C\)).  
     Argue that not all three can hold simultaneously.  
  2. Which requirement would you drop? Defend your choice.  

  ---

  ### Model Answer (Approx. 850 words)  

  #### Part A  
  1. The multiset of welfare levels in both outcomes is \(\{ n \mid n \in \mathbb{Z} \}\) (all integers). Shifting welfare assignments by one (i.e., assigning person \(n\) the welfare of \(n+1\) in the baseline) is a bijection on \(\mathbb{Z}\). Since bijections preserve multisets, the distributions are identical.  
  2. For every person \(n\), \(n+1 > n\). Thus, every individual is strictly better off in the shifted outcome, satisfying Pareto superiority.  
  3. The conflict is between **Pareto** (which ranks shifted better) and **anonymity** (which, by treating permutations as irrelevant, ranks baseline and shifted as equally good). Pareto relies on cross-world identity (comparing welfare of the *same* person across outcomes), while anonymity denies the ethical relevance of identity.  

  #### Part B  
  1. **Conflict is impossible with bounded welfare.** Suppose welfare is bounded below (e.g., \(\geq -K\)). For a permutation to be a Pareto improvement, every person must be at least as well off and at least one strictly better. But with identical multisets, any gain for one person must be offset by a loss for another (else the multisets diverge). For example, if welfare levels are \(\{0, 1\}\) and a permutation improves one person from 0 to 1, another must fall from 1 to 0. Thus, no permutation can be a Pareto improvement.  
  2. **Unboundedness is pivotal** because it allows "gains without losses": in the shift, gains at \(n\) (e.g., person \(-1000\) improves from \(-1000\) to \(-999\)) are not offset by losses elsewhere, as the multiset stays intact. Boundedness closes this escape valve.  

  #### Part C  
  1. *Even-Odds* and *Odds-Evens* are permutations: map each person \(n\) to \(n+1\). This swaps their welfare assignment (e.g., an even \(n\) with welfare 1 in *Even-Odds* becomes an odd \(n+1\) with welfare 1 in *Odds-Evens*), preserving the multiset \(\{\text{infinitely many 0s and 1s}\}\).  
  2. **Tether 1 (favors *Even-Odd*):**  
     - Define \(T_1\) as:  
       - \(S_1 = \{0\}\) (even)  
       - \(S_2 = \{0, 2\}\) (evens)  
       - \(S_3 = \{0, 2, 1\}\) (add first odd)  
       - \(S_4 = \{0, 2, 1, 4\}\) (add even)  
       - \(S_5 = \{0, 2, 1, 4, 6\}\) (add even)  
       - \(S_6 = \{0, 2, 1, 4, 6, 3\}\) (add odd)  
       - Continue: for \(k \geq 1\), at steps \(n = 3k-2\) and \(n = 3k-1\), add the next even; at \(n = 3k\), add the next odd.  
     - Welfare difference (*Even-Odds* minus *Odds-Evens*):  
       - \(S_1\): \(1 - 0 = 1\)  
       - \(S_2\): \((1+1) - (0+0) = 2\)  
       - \(S_3\): \((1+1+0) - (0+0+1) = 1\)  
       - \(S_4\): \(1+1+0+1 - (0+0+1+0) = 3-1 = 2\)  
       - Pattern: Difference remains \(\geq 1\) for all \(n\). Thus, *Even-Odds* is better.  

     **Tether 2 (favors *Odds-Evens*):**  
     - Define \(T_2\) symmetrically:  
       - Start with an odd: \(S_1 = \{1\}\)  
       - Add odds at \(n = 3k-2, 3k-1\); add evens at \(n = 3k\).  
       - E.g., \(S_1 = \{1\}\), \(S_2 = \{1, 3\}\), \(S_3 = \{1, 3, 0\}\), etc.  
     - Welfare difference (*Even-Odds* minus *Odds-Evens*):  
       - \(S_1\): \(0 - 1 = -1\)  
       - \(S_2\): \((0+0) - (1+1) = -2\)  
       - \(S_3\): \((0+0+1) - (1+1+0) = -1\)  
       - Pattern: Difference \(\leq -1\) for all \(n\). Thus, *Odds-Evens* is better.  

  3. **The rule violates anonymity.** Anonymity requires that permuted outcomes are equally good, but here:  
     - \(T_1\) ranks *Even-Odds* > *Odds-Evens*.  
     - \(T_2\) ranks *Odds-Evens* > *Even-Odds*.  
     The verdict depends on the tether, not just the distribution, contradicting anonymity’s core claim that "who gets what" is irrelevant.  

  #### Part D  
  1. **Impossibility argument:** Suppose a rule satisfies all three. By *responsiveness*, saving one life (improving welfare of person 0 from 0 to 1, others unchanged) makes outcome \(A\) better than \(B\). By *tether-independence*, this holds for any tether. But consider:  
     - Tether \(T_x\) excludes person 0 (e.g., \(S_n = \{-n,\dots,n\} \setminus \{0\}\)).  
     - For \(T_x\), welfare in \(A\) and \(B\) is identical over every \(S_n\), so \(A\) and \(B\) are incomparable (not \(A > B\)).  
     This violates tether-independence. If we force comparability, we create cycles (e.g., \(A > B\) via \(T_0\), but \(B \sim A\) via \(T_x\) breaks acyclicity).  
  2. **Drop tether-independence.** Responsiveness is non-negotiable for ethical traction (e.g., saving lives). Acyclicity prevents inconsistent choices. Tether-dependence, while unsatisfying, is manageable: we can stipulate a "fair" tether (e.g., symmetric sets) for impartiality. Dropping responsiveness or acyclicity sacrifices core rationality.  

