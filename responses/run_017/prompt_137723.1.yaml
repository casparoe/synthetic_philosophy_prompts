     (b) Explain why the shifted outcome is a Pareto improvement over the baseline.
     (c) Given that the two outcomes have the same multiset of welfare levels, what ethical principle would normally say they are equally good? 
     (d) Therefore, what is the conflict between principles in this example?

   Part B (5 marks): 
     One student objects that this example only works because the welfare levels are unbounded below. They say that if welfare levels were bounded below, then such a conflict would not arise. 
     Another student claims that even with bounded welfare levels, a conflict between Pareto and anonymity can be constructed using a clever permutation.
     Which student is correct? Either construct an example with bounded welfare levels that exhibits the conflict, or explain why it is impossible. (Note: welfare levels can be any real numbers, but in this course we often use integers for simplicity.)

   Part C (5 marks): 
     To handle comparisons in infinite populations, one might use the "tethered difference rule". 
     The rule is as follows:
       Fix a nested sequence of finite sets of people, S_1 ⊆ S_2 ⊆ ... , whose union is all people. 
       For two outcomes A and B, for each n, compute the total welfare in A over the people in S_n minus the total welfare in B over the people in S_n. 
       If there exists an N such that for all n>N, this difference is positive, then A is better than B. 
       If there exists an N such that for all n>N, the difference is negative, then B is better than A. 
       Otherwise, A and B are incomparable.

     Consider two new outcomes, which we'll call Even and Odd:
       In Even, every even-numbered person has welfare 1 and every odd-numbered person has welfare 0.
       In Odd, every even-numbered person has welfare 0 and every odd-numbered person has welfare 1.

     (a) Explain why Even and Odd are permutations of each other.
     (b) using the following two different tethers, apply the tethered difference rule to compare Even and Odd:
          Tether 1: S_n = {0, 2, 4, ..., 2n} ∪ {1, 3, 5, ..., 2n-1}   [Wait, this is {0,1,2,...,2n} -> then the number of even and odd is n+1 even and n odd? Because the set has 2n+1 elements if including 0 to 2n? So we need to define it differently.]

     Given the complexity of the unbiased tether in part (b) of the even-odd example and the time constraints, we will instead ask the student to construct one tether that yields "Even is better than Odd" and another that yields "Odd is better than Even". We will provide the worlds and let them define the tethers.

     Alternatively, we can describe the biased tethers we have above and ask for the verdict.

     Given the time, we will ask them to describe two different tethers (sequences) that are nested and cover all integers, such that when using the tethered difference rule on the Even and Odd worlds, one tether yields Even better than Odd, and the other yields Odd better than Even.

     (c) Does the tethered difference rule violate anonymity? Why or why not?

   Part D (5 marks):
     The rule might be responsive to finite changes: for example, if you save a drowning child and otherwise leave the world unchanged, then in any tether that includes the child, the difference will eventually be positive (once the child is included and the set is large enough not to be affected by other changes). 
     But we would like the verdict to be independent of the choice of tether (tet independence). 
     And we would like the rule to be acyclic ( or at least not to have cycles, but the rule is not necessarily transitive).

     However, it turns out that you cannot have all three: 
       (1) Responsiveness to finite local improvements (like saving a child that no one else is affected by).
       (2) Tether-independence: the ranking of two worlds does not depend on the choice of nested sequence.
       (3) Acyclicity: if A is better than B and B is better than C, then A is better than C, and there are no cycles.

     Which of these three would you drop to avoid the challenge? Defend your choice.

