    Alternatively, a defender of SSA might argue that the reference class should include only observers that exist at the time of the event. But we have already taken that into account because we are counting only those civilizations that exist during the event.

    A defender of SIA might not need to attack the case because in this case SIA wins. But if we had a case where SIA loses, a defender of SIA might question the independence of our existence from the hypothesis. SIA assumes that we are more likely to exist in a world with more observers. But if the additional observers in H2 are in distant galaxies that cannot interact with us, does that count? This is the problem of the reference class: are we including all observers in the universe, or only those in our galaxy? The defender might argue that we should only include observers that are causally connected to us. This would break the vast headcount of H2.

    Specifically: if we define the reference class as observers in our galaxy, then in H1 our galaxy has 1000 civilizations, and in H2 our galaxy (which is one of 10^12) has 10 civilizations. Then:

        In H1: our galaxy has 10 civilizations? Wait, we set H1 to have only one galaxy with 1000 civilizations.

        In H2: our galaxy is one of 10^12 galaxies, each with 10 civilizations -> so our galaxy has 10 civilizations.

        Then:

            H1: total observers in our galaxy: 1000 civilizations? But wait, in H1 there is only one galaxy so our galaxy is that one.

            How do we define "our galaxy"? We are on Earth. In H1, the entire universe is our galaxy. In H2, our galaxy is one among many.

        Then:

            Evidence E: we are in a civilization that observed the event.

            In H1: our galaxy (the entire universe) has 1000 civilizations, 999 of which see the event. So if we condition on being in our galaxy (which we are) then:

                SSA: P(E | H1) = 999/1000   (fraction in our galaxy)

            In H2: our galaxy has 10 civilizations. How many see the event? We said in each galaxy, one civilization sees the event? So in our galaxy, 1 civilization sees the event. Then:

                SSA: P(E | H2) = 1/10

            Then SSA update: LR = (999/1000) / (1/10) ≈ 10 -> still favors H1, but by only 10:1. Not the 10^6 we had.

            And SIA: 
                For H1: the absolute number of observers in the entire universe that see the event is 999.
                For H2: the absolute number in the entire universe is 10^6.
                But if we restrict the reference class to our galaxy, then under SIA we might weight by the number of observers in our galaxy? 

            This becomes messy. The key point is that if we restrict the reference class to our galaxy, then the vastness of H2 becomes irrelevant. But note: SIA is defined to include all observers in the universe. So a defender of SIA would not accept the restriction to our galaxy. They would argue that the existence of observers in other galaxies does affect the probability of being one of them.

  Practical divergence:

    What should we do? Suppose we are deciding whether to fund further research. 

        Under SSA (which favors H1: the small universe): 
            In H1, there are very few civilizations (1000) and we are one of the 999 that saw the event. The next step is to look for a second type-Z supernova. In H1, the event was unique: only one supernova in the entire history. So we will never see another. In H2, each galaxy has one supernova, and there are 10^12 galaxies, so we might see more in our galaxy? But we said each galaxy has exactly one in its history. And we already saw it. So we won't see another in our galaxy.

            But note: we might be able to observe supernovae in other galaxies? In H2, there are many galaxies, each having one supernova. So if we build a better telescope, we might observe supernovae in other galaxies. In H1, there are no other galaxies.

            So the action: build a telescope to look for supernovae in other galaxies.

            If we see one, that confirms H2. If we don't, that supports H1.

            But under SSA, we believe H1 is almost certainly true, so we might not fund the telescope.

        Under SIA (which favors H2: the large universe): 
            We believe H2 is true, so we are more likely to see a supernova in another galaxy. Therefore, we fund the telescope.

    Thus, the choice of anthropic assumption leads to different actions.

    Alternatively, we might consider the value of information: even if we believe H1, we might want to confirm. But the expected value of the telescope would be higher under H2 because there are many more supernovae to see.

    So the divergence is both in belief and in action.

  Therefore, we have a case that satisfies the constraints.

  Final scenario write-up for the paper:

  Scenario: 

    We are astronomers considering two cosmological models. Model A (H1) describes a small universe containing only 1,000 civilizations. Due to its unique astrophysical conditions, 999 of these civilizations will observe a rare type-Z supernova. Model B (H2) describes a vast universe with 1,000,000,000,000 civilizations (a trillion). However, in this universe, only one in a million civilizations observes a type-Z supernova, resulting in 1,000,000 civilizations that witness the event. Non-indexical evidence, such as the existence of at least one civilization observing the event, is equally probable under both models. We have just observed a type-Z supernova. 

  Calculations:

    Priors: 
        P(H1) = P(H2) = 1/2

    SSA update (reference class: civilizations):
        P(we observe | H1) = 999/1000 ≈ 0.999
        P(we observe | H2) = 1,000,000 / 1,000,000,000,000 = 10^{-6}
        Likelihood ratio (H1:H2) = 0.999 / 10^{-6} ≈ 10^6
        Posterior(H1) ≈ (10^6 * 1/2) / (10^6 * 1/2 + 1/2) = 10^6/(10^6+1) ≈ 1
        Posterior(H2) ≈ 0

    SIA update:
        The likelihoods are proportional to the absolute numbers of civilizations that observe the event:
            P(we observe | H1) ∝ 999
            P(we observe | H2) ∝ 1,000,000
        Likelihood ratio (H1:H2) = 999 / 1,000,000 ≈ 10^{-3}
        Posterior(H1) ≈ (999 * 1/2) / (999 * 1/2 + 1,000,000 * 1/2) = 999/(999+1,000,000) ≈ 0.001
        Posterior(H2) ≈ 0.999

  Structural feature:

    The reversal is driven by the fact that SSA depends on the fraction of observers who witness the event, which is high in H1 (99.9%) and very low in H2 (0.0001%), while SIA depends on the absolute number of observers who witness the event, which is 999 in H1 and 1,000,000 in H2. The absolute count in H2 is higher because H2 has a trillion civilizations despite the low fraction. This gap between fraction and absolute count leads to the reversal.

  Collapse to presumptuous philosopher:

    If we set the fractions equal (say both 50%), then SSA does not update (LR=1) while SIA favors the larger world (H2) by the ratio of their total headcounts.

  Reference class robustness:

    If we redefine the reference class as individual sentient beings (assuming each civilization has M individuals and that every individual in a civilization that sees the event also sees it), the fractions and absolute counts scale by M, leaving the likelihood ratios unchanged. If only one individual per civilization sees the event, the reversal still holds: SSA (with individual observers) gives LR ≈ 10^6 for H1 vs. H2, and SIA gives LR ≈ 10^{-3}.

  Defender's attack:

    A defender of SSA might challenge the reference class, arguing that it should be restricted to observers in our galaxy. In H1, our galaxy (the entire universe) has 1,000 civilizations. In H2, our galaxy (one among a trillion) has, say, 10 civilizations. Then, conditioning on being in our galaxy, SSA would compute:
        P(E | H1) = 999/1000 ≈ 0.999
        P(E | H2) = (number of civilizations in our galaxy that see the event) / (total in our galaxy) = 1/10 (if one per galaxy)
        LR ≈ 0.999/(0.1) ≈ 10, still favoring H1 but only by an order of magnitude. This avoids the extreme reversal but at the cost of altering the reference class. SIA defenders would reject this restriction, maintaining that all observers in the universe are relevant.

  Practical divergence:

    The beliefs lead to divergent actions. If we accept SSA, we believe the universe is small (H1) and we will not observe another type-Z supernova (since there was only one in total). If we accept SIA, we believe the universe is large (H2) and we might observe supernovae in other galaxies with a powerful telescope. Thus, SIA recommends funding such a telescope, while SSA does not.

  This case meets all constraints.
answer: |-
  Below is a self-contained case tailored to your specifications. It pits the Self-Sampling Assumption (SSA) against the Self-Indication Assumption (SIA) in an astronomical survey scenario, with priors equal and non-indexical evidence symmetric. The two assumptions yield opposite conclusions (favoring different hypotheses by over three orders of magnitude), driven by a structural gap between fractions and absolute counts. I address all requested components: setup, calculations, structural feature, collapse to presumptuous philosopher, reference-class robustness, attacks from the losing side, and practical implications.

  ---

  ### **Scenario: The Sirius Anomaly Survey**
  Astronomers are investigating an anomalous short-lived radio signal, "Sirius-type," which sporadically appears near stars. Two hypotheses explain the signal's origin:  
  - **H₁ (Local Universe)**: The universe is small, containing only one galaxy (ours) with 1,000 habitable planets. Due to unique local physics, 999 of these planets host civilizations that observe exactly one Sirius signal during their technological window.  
  - **H₂ (Vast Universe)**: The universe is vast, containing 10¹² galaxies. Each galaxy has 1,000 habitable planets, but Sirius signals are exceedingly rare: only one planet per galaxy observes the signal (so 10¹² signals total). Galactic conditions ensure that observing civilizations are always present when a signal occurs.  

  Non-indexical evidence (e.g., astrophysical data on signal properties, stellar distributions) equally supports H₁ and H₂. Priors are set at 1:1.  
  *Indexical evidence*: You are an astronomer on a planet that has just observed a Sirius signal.  

  ---

  ### **Calculations**  
  **Priors**: \( P(H_1) = P(H_2) = 0.5 \)  
  *Reference class*: All planetary civilizations capable of observing the signal.  
  - **H₁**: Total civilizations = \( N_1 = 10^3 \). Observers with your evidence (seeing a signal) = \( k_1 = 999 \).  
  - **H₂**: Total civilizations = \( N_2 = 10^{12} \times 10^3 = 10^{15} \). Observers with your evidence = \( k_2 = 10^{12} \) (one per galaxy).  

  #### **SSA Update**  
  Likelihoods are based on the *fraction* of observers with your evidence:  
  - \( P(\text{evidence} \mid H_1) = \frac{k_1}{N_1} = \frac{999}{1000} \approx 0.999 \)  
  - \( P(\text{evidence} \mid H_2) = \frac{k_2}{N_2} = \frac{10^{12}}{10^{15}} = 10^{-3} \)  
  Likelihood ratio (H₁:H₂):  
  \[
  \text{LR}_{\text{SSA}} = \frac{0.999}{10^{-3}} \approx 10^3
  \]  
  Posterior for H₁:  
  \[
  P(H_1 \mid \text{evidence}) = \frac{0.5 \times 0.999}{0.5 \times 0.999 + 0.5 \times 10^{-3}} \approx \frac{0.999}{0.999 + 0.001} \approx 0.999
  \]  
  SSA favors H₁ by ≈999:1 (over three orders of magnitude).  

  #### **SIA Update**  
  Likelihoods are proportional to the *absolute number* of observers with your evidence:  
  - \( P(\text{evidence} \mid H_1) \propto k_1 = 999 \)  
  - \( P(\text{evidence} \mid H_2) \propto k_2 = 10^{12} \)  
  Likelihood ratio (H₁:H₂):  
  \[
  \text{LR}_{\text{SIA}} = \frac{k_1}{k_2} = \frac{999}{10^{12}} \approx 10^{-9}
  \]  
  Posterior for H₁:  
  \[
  P(H_1 \mid \text{evidence}) = \frac{0.5 \times 999}{0.5 \times 999 + 0.5 \times 10^{12}} \approx \frac{999}{10^{12}} \approx 10^{-9}
  \]  
  SIA favors H₂ by ≈10¹²:999 (over nine orders of magnitude; well beyond the three-order requirement).  

  **Result**: SSA picks H₁ (local universe) as the winner; SIA picks H₂ (vast universe).  

  ---

  ### **Structural Feature Producing Reversal**  
  The reversal stems from the gap between **fraction of observers** (SSA) and **absolute count of observers** (SIA):  
  - SSA’s likelihood ratio is \( \frac{k_1 / N_1}{k_2 / N_2} \).  
  - SIA’s likelihood ratio is \( \frac{k_1}{k_2} = \left( \frac{k_1 / N_1}{k_2 / N_2} \right) \times \frac{N_1}{N_2} \).  
  Here, \( \frac{k_1 / N_1}{k_2 / N_2} = 10^3 \) (favoring H₁), but \( \frac{N_1}{N_2} = \frac{10^3}{10^{15}} = 10^{-12} \), so SIA multiplies SSA’s ratio by \( 10^{-12} \), flipping the outcome.  
  **Why it reverses**: H₂’s vast headcount (\( N_2 \gg N_1 \)) compensates for its low signal fraction (\( k_2/N_2 \ll k_1/N_1 \)) under SIA, but SSA ignores headcount and sees only the fraction.  

  ---

  ### **Collapse to Presumptuous Philosopher Case**  
  Remove the fraction gap by setting equal signal fractions:  
  - Adjust H₂ so \( \frac{k_2}{N_2} = \frac{k_1}{N_1} = 0.999 \) (e.g., \( k_2 = 0.999 \times 10^{15} \), \( N_2 = 10^{15} \)).  
  Now:  
  - SSA: LR = \( \frac{0.999}{0.999} = 1 \) → No update from prior (1:1).  
  - SIA: LR = \( \frac{k_1}{k_2} = \frac{999}{0.999 \times 10^{15}} \approx 10^{-12} \) → Strongly favors H₂.  
  This matches the presumptuous philosopher: SSA is indifferent; SIA favors the larger world.  

  ---

  ### **Reference-Class Robustness**  
  Test with two reference classes:  
  1. **All humans**: Assume each civilization has \( M \) humans, and all humans in a signal-observing civilization see it.  
     - Fractions: \( \frac{k_1 M}{N_1 M} = \frac{999}{1000} \) (H₁), \( \frac{k_2 M}{N_2 M} = 10^{-3} \) (H₂).  
     - Absolute counts: \( k_1 M \) (H₁), \( k_2 M \) (H₂).  
     SSA LR = \( 10^3 \), SIA LR = \( 10^{-9} \) → **Reversal holds**.  
  2. **All conscious observers**: Include non-human aliens (set all civilizations equal).  
     - Identical to "civilizations" case → **Reversal holds**.  

  ---

  ### **Defender of the Losing Assumption Attacks the Case**  
  - **SSA defender (losing in this case)** attacks by:  
    Rejecting the reference class. Argues that "observers" should be restricted to *causally connected* entities (e.g., only in our galaxy). In H₂, our galaxy has only 1,000 civilizations (vs. H₁’s 1,000), with one signal. Then:  
    - SSA: \( P(\text{evidence} \mid H_1) = \frac{999}{1000} \), \( P(\text{evidence} \mid H_2) = \frac{1}{1000} \) → LR ≈ \( 10^3 \) (still favors H₁).  
    This avoids reversal but violates the intended reference class (all observers in the universe).  
  - **SIA defender (wins here, but general attack if losing elsewhere)**:  
    Questions whether H₂’s distant observers are "real" (e.g., if they are causally disconnected, their weight in SIA is invalid). Rejects the problem setup as idealized.  

  ---

  ### **Practical Divergence: Belief and Action**  
  - **Belief divergence**: SSA concludes H₁ (local universe) is near-certain; SIA concludes H₂ (vast universe) is near-certain.  
  - **Action divergence**: Astronomers must decide whether to fund "Deep-Sky Sirius Scanners" (DSS) to detect signals in other galaxies.  
    - Under SSA (H₁): No other galaxies exist. DSS wastes resources.  
    Under SIA (H₂): Other galaxies exist. DSS has high value.  
    **Result**: SSA advises defunding DSS; SIA urges funding.  
    → **The choice has practical bite** (funding allocation differs).  

  ---

  ### **Verification of Constraints**  
  - **No infinities, simulations, duplicates, or predictors**: Finite \( N_1, N_2 \); ordinary empirical setting.  
  - **Non-indexical symmetry**: Signal properties, stellar data, and priors are equal.  
  - **Indexical evidence**: "You observe a Sirius signal" is directly acquirable.  
  - **Reversal validated**: SSA and SIA favor different hypotheses by >10³.  
  This case meets all specifications. No fudging required.  

  ---  
  Use this case as a clean illustration of how SSA and SIA can diverge decisively. The Sirius Anomaly highlights the core tension: fractions vs. absolute counts in anthropic updates, with tangible consequences for scientific decisions.
