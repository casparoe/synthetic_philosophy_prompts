  Hmm, the user wants me to draft a document for this collaboration. The key challenges are: differing base rates between demographic groups, and the fact that outcomes are only observed for the 15% who received slots (the "selective labels" problem). There are two main camps here - formalists who accept fairness impossibility theorems and want explicit tradeoff choices, versus system thinkers who view fairness as dynamic and emergent.

  Interesting additions requested: First, a new "differential counterfactual improvement" criterion that measures expected gain from intervention rather than prediction accuracy. Second, exploring how the fairness debate changes when thresholds are budget-driven and scores are updated semi-annually with reapplications.

  For structure, I'll need: (1) Common ground section covering mathematical constraints, data limitations, and audit feasibility - things both sides would accept. (2) A disagreement table with at least four rows including the new criterion question. Each row should contrast both positions neutrally, identify whether the disagreement is substantive or terminological, pinpoint the crux, and propose test cases with predictions.

  The word limit is tight (1,200 words), so I'll avoid citations and focus on crisp explanations. The tone should be practical since this is for policymakers, not theorists. For the common ground, I'll emphasize undisputed realities: mathematical tradeoffs, selective labels bias, vendor access limitations, and what audits can actually measure. For disagreements, I'll map the core philosophical divides while making space for the new criterion exploration.

  The differential counterfactual improvement idea is particularly tricky - it cleverly shifts focus to intervention impact but requires unobservable counterfactuals. I'll frame it as a thought experiment that exposes deeper questions about what fairness means in allocation systems. On dynamic thresholds, I'll note how recurring decisions might mitigate some tensions but introduce new ones like gaming incentives.

  Throughout, I'll maintain that both perspectives reveal partial truths - the formalists are right about unavoidable tradeoffs in static snapshots, while system thinkers correctly emphasize that real fairness unfolds over time through system design. The document should help them see their positions as complementary rather than contradictory.
answer: |-
  ## Adversarial Collaboration: Fair Allocation in Housing Support

  **Context:** County Housing Authority allocates 400 intensive supportive housing slots annually from ~3,000 applicants. Vendor supplies a score [0,1], interpreted as P(housing instability within 12 months). Top 400 scores receive slots. Complications: (1) Observed base rates for instability differ significantly across two legally mandated reporting groups. (2) Outcome data (actual stability at 12/24 months) is only available for ~15% of applicants – specifically, those *who received slots*. This creates "selective labels" bias, as the score's training data reflects past allocation patterns, not true population outcomes. Vendor access to applicant data is limited to what's provided per application cycle.

  **Goal:** Establish common ground and clarify residual disagreements between "Formalists" (F) and "System People" (SP) regarding fairness auditing and implementation.

  ---

  **Section 1: Common Ground (Claims Both Can Sign)**

  1.  **Mathematical Trade-offs are Inevitable (in Static Frame):** For any fixed threshold and fixed budget, simultaneously satisfying common statistical fairness criteria (e.g., Demographic Parity, Equalized Odds, Calibration by Group) is mathematically impossible when base rates differ across groups. Choosing one criterion inherently involves sacrificing others.
  2.  **"Stability" is an Imperfect & Partial Label:** The recorded outcome variable (stable/unstable at 12 months) is:
      *   **Imperfect:** A proxy for the true goal (long-term well-being, self-sufficiency).
      *   **Partial:** Only observed for the ~15% who received the intervention (selective labels).
      *   **Influenced:** The intervention itself likely impacts the observed outcome for those who receive it.
  3.  **Selective Labels Introduce Major Bias:** The vendor's model was trained and is evaluated predominantly on data from people *who received the intervention in the past*. This data:
      *   Does not represent the true outcome distribution for the entire applicant pool.
      *   Reflects historical prioritization patterns and resource constraints, potentially encoding past biases.
      *   Makes estimating the model's true performance (e.g., accuracy, AUC) for *non-recipients* highly speculative and unreliable.
  4.  **The Score is Not P(Stability | Applicant):** The vendor's score is best understood as an estimate of P(Instability | Application Features & *Past Allocation Context*), not a pure, context-independent probability for a randomly selected applicant. Its relationship to true stability risk for non-recipients is unknown.
  5.  **Audit Scope is Limited:** Audits based *only* on the agency's existing data (scores, allocations, outcomes for recipients) can primarily establish:
      *   Compliance with chosen procedural fairness criteria (e.g., score ranking, group parity at threshold) for the allocated group.
      *   Calibration or error rates *among those who received slots*.
      *   *Cannot* reliably establish:
          *   True model performance for non-recipients.
          *   Counterfactual outcomes (what would have happened without the slot, or if someone else got it).
          *   The causal impact of the intervention itself.
  6.  **Vendor Data Access is Constrained:** The vendor builds the score using features provided in the application for the current cycle and potentially aggregated, anonymized historical data *from past allocations*. They lack real-time, comprehensive tracking of non-recipients.
  7.  **Perfect Prediction ≠ Perfect Allocation:** Even a perfectly accurate model predicting instability risk does not necessarily lead to the fairest or most effective allocation. Maximizing overall stability might conflict with equitable distribution across groups or maximizing individual benefit.
  8.  **The Goal is Tangible Improvement:** The ultimate ethical aim is improving housing stability and well-being for vulnerable residents, not merely satisfying a statistical criterion. The system's design should serve this goal.

  ---

  **Section 2: Residual Disagreements**

  | # | Disagreement Focus          | Formalist (F) Position                                                                                                 | System Person (SP) Position                                                                                                                                                   | Real or Verbal? | Crux Underneath                                                                                                                                 | Concrete Test Case                                                                                                                       | F Prediction                                                                 | SP Prediction                                                                 |
  | :--------------------------- | :--------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------- | :---------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------- | :---------------------------------------------------------------------------- |
  | **1** | **Nature of Fairness Object** | "Fairness is a property of the *classifier* and its *decision* at the allocation threshold. We must rigorously define and audit fairness metrics for this specific decision point." | "Fairness is a property of the *entire socio-technical system* over time. Focusing solely on the classifier snapshot ignores feedback loops, re-applications, intervention effects, and long-term equity." | **Real**        | Is fairness fundamentally a static property of an algorithm's output, or a dynamic property of a system's operation and impact?                 | Simulate system over 5 years with fixed 400 slots/year, re-applications allowed, model updated annually. Compare group-level outcomes & model drift under F vs SP audit regimes. | Static audit fails to prevent cumulative disadvantage; model drifts.         | System-level view reveals emergent fairness properties missed by static snapshots. |
  | **2** | **Role of Impossibility Results** | "The impossibility theorems expose an irreducible conflict. We *must* explicitly choose which fairness criterion to prioritize (e.g., maximize utility, satisfy sufficiency) and acknowledge the sacrificed criteria as a necessary cost." | "The impossibility results are artifacts of an impoverished, static model. They highlight why that framing is wrong for dynamic interventions. We escape the 'choice' by focusing on system design (e.g., re-application, impact measurement, resource advocacy) that improves outcomes over time." | **Real**        | Do the impossibility theorems define the fundamental ethical dilemma, or are they merely limitations of an unsuitable analytical framework?     | Analyze if a system redesign (e.g., triage tiers, waitlists + reassessment, increased slots via advocacy) demonstrably reduces the *perceived trade-off severity* identified by static F analysis. | Trade-offs remain inherent; redesign shifts but doesn't eliminate conflict. | Smart system design demonstrably mitigates the apparent conflicts highlighted by static analysis. |
  | **3** | **Differential Counterfactual Improvement (DCI)** | "DCI (equal expected gain from intervention conditional on score) is theoretically appealing but practically useless. We lack the counterfactual data (stability w/o slot for recipients, stability w/ slot for non-recipients). It also conflicts directly with giving slots to those who benefit *most* (maximizing total gain), creating a *new* trade-off, not an escape." | "DCI points to the *real* ethical question: are we helping equally? It forces focus on the intervention's *impact*, not just prediction. While hard to measure, it motivates system changes (e.g., RCTs, better tracking) to *get* the data. Maximizing total gain might be secondary to equitable impact per resource unit." | **Real**        | Is the core fairness question about predictive accuracy or intervention impact? Is equitable distribution of *benefit* more important than maximizing total benefit *or* predictive parity? | If feasible RCT data existed showing DCI varies significantly by group at same vendor score, how should allocation change? (F: Maybe adjust score? SP: Redesign intervention/targeting?) | DCI creates new impractical demands & conflicts; focus on measurable criteria. | DCI reframes the goal correctly; its difficulty highlights need for better system instrumentation. |
  | **4** | **Threshold/Budget Dynamics** | "The core trade-offs persist. While the threshold moves, the *relative* disadvantage at the moving cutoff remains governed by score distributions and base rates. Re-computation helps accuracy but doesn't dissolve the fairness conflicts at any given allocation point." | "Dynamic thresholds and re-application fundamentally change the game. It transforms a one-shot exclusion into a process. People get multiple chances, models adapt to changing circumstances, and the focus shifts to *timely* help rather than perfect prediction at a single point. This mitigates the ethical weight of the static trade-offs." | **Real**        | Does allowing re-application and model updates significantly reduce the practical ethical harm associated with the static impossibility results? | Compare outcomes for marginal applicants (just above/below cutoff) in a static one-shot system vs. a dynamic system with 6-month re-application. Measure rates of ultimately receiving help and time-to-help by group. | Significant group disparities in time-to-help and ultimate access persist.    | Dynamic system shows convergence in access rates over time and reduced disparity in time-to-help. |

  ---

  **Conclusion for Collaboration:** Both perspectives identify critical truths. The Formalists correctly emphasize the unavoidable mathematical trade-offs inherent in *any snapshot* of this allocation process and the limitations of audits based on selective labels. The System People correctly argue that fairness is realized (or not) through the *ongoing operation* of the entire system, and that fixating solely on classifier metrics ignores the dynamic reality of re-application, intervention impact, and the potential for system redesign. The disagreements are largely real, stemming from different focal points (decision vs. system) and different prioritizations (managing known trade-offs vs. transcending them via design). Exploring DCI highlights the gap between predictive fairness and impact fairness, while analyzing dynamics reveals whether process changes genuinely alleviate static dilemmas. Productive collaboration involves F rigorously auditing the *current* decision within its constraints, while SP designs pilots to measure impact and explores system changes, both working towards the shared goal of tangible improvement in housing stability.
