  Hmm, their audience is uniquely positioned to poke holes - facilitators know group dynamics, recruiters understand attrition risks, civil servants see institutional friction. The journalist's allergy to enthusiasm means emotional appeals backfire. 

  First, the core vulnerability: proposing binding power to this crowd is like suggesting parachutes made of wet paper to skydiving instructors. Their entire professional identity is built on advisory assemblies. Must preemptively concede that upfront - maybe frame it as "a dangerous supplement, not replacement" to lower defenses.

  The attrition objection will hit hardest. Practitioners see volunteers drop from 3-day assemblies; asking employers to release someone 8 years is laughable. My reply about sabbatical credits feels weak - corporate HR would laugh. Should flag that as "speculative concession" in notes.

  Oh! The continuity paradox is sneaky: they claim permanent civil servants dominate short assemblies, but won't long-term assemblies just create... permanent amateur bureaucrats? That's the knife-twist question I hope nobody asks. If pressed, must admit it risks becoming a shadow civil service without saying "you're right, this invalidates my thesis."

  The politician's "who elected them" is unavoidable. Best weapon: flip it. "Who elected the central bank committee setting 30-year rates?" But must immediately concede this won't satisfy democrats - just reframe as tradeoff.

  Most crucial reply? The implementation lag. If they don't buy "skin in the game" solves time horizon problem, the whole architecture crumbles. Should practice that 90-second analogy about jury duty meets pension actuary until it bleeds.

  ...wait. Did they just casually drop that their jury service was "peculiar"? Now I'm wildly curious what happened, but that's not relevant here. Focus.
answer: |-
  Here’s your preparation sheet, tailored to your audience and thesis. I’ve prioritized objections by **likelihood × damage potential**, phrased as your audience would, with concise replies and vulnerability notes. I’ll conclude with preemptive concessions, the critical reply, and your "quiet hope" question.

  ---

  ### **Top 8 Objections & Replies**  
  *(Ordered by impact risk)*  

  1. **Practitioner (Facilitator):**  
     *"How do you expect employers to release someone for eight years? We struggle with two-week assemblies. Attrition will gut this."*  
     **Reply:** "We’d mandate employer cooperation (like military reserve duty) with salary top-ups. Staggered cohorts mean only 1/8 of seats turn over yearly, so losing a few members won’t collapse the body. Attrition is a real risk, but we’d recruit alternates upfront."  
     **Soft spots:** Employer mandates are politically explosive. Alternates add complexity. *Concede* this requires legal teeth unlikely in current climates.  

  2. **Civil Servant (Participation Team):**  
     *"Amateurs meeting for eight years become unaccountable mini-bureaucracies. How do you stop them going rogue or burning out?"*  
     **Reply:** "Limited scope (e.g., only 5 predefined long-term issues) prevents mission creep. Burnout is addressed by non-renewable terms and professional facilitation. They’re not drafting legislation—they’re setting parameters, like a jury deciding guilt, not writing penal codes."  
     **Soft spots:** "Parameters" can be elastic. No evidence amateurs sustain engagement beyond 2 years. *Change subject* to scope constraints.  

  3. **Politician (Democratic Reform Committee):**  
     *"Who elected these people? Binding power without a vote violates democratic legitimacy."*  
     **Reply:** "Legitimacy comes from mandate + accountability. Their mandate is narrow (e.g., ‘Set 2050 emissions targets’). Accountability comes from the implementation lag: if they hurt people, those people are still in the room. Elected bodies delegate binding power to judges and central bankers—this is similar, but more transparent."  
     **Soft spots:** Judges are credentialed; lotteries aren’t. *Concede* this trades electoral accountability for long-termism.  

  4. **Evaluator (Academic):**  
     *"Where’s your evidence that 8-year members become ‘competent’? Our data shows learning plateaus after 6 months in assemblies."*  
     **Reply:** "Competence here isn’t expertise—it’s understanding tradeoffs. Pension actuaries (my world) take years to grasp intergenerational equity. Plateaus in advisory bodies occur because they know their input is symbolic. Binding responsibility changes incentives."  
     **Soft spots:** Zero empirical evidence for this claim. *Concede* it’s extrapolated from other domains.  

  5. **Journalist (Reform-Skeptic):**  
     *"This sounds like a committee of randoms playing God with infrastructure. Why trust them over engineers?"*  
     **Reply:** "They’re not replacing engineers. They’re answering normative questions like ‘How much should we sacrifice today for future safety?’ Engineers can’t answer that—it’s a democratic dilemma. Random selection forces deliberation among people who live with tradeoffs."  
     **Soft spots:** Distinguishing "normative" from technical is messy in practice. *Strong reply* if kept abstract.  

  6. **Recruiter (Lottery Contractor):**  
     *"You’ll get only retirees and the self-employed. Normal people can’t pause careers for eight years."*  
     **Reply:** "We’d weight recruitment toward life stages with flexibility (e.g., empty-nesters, gig workers) and compensate at 150% median wage. It’s like national service—rare but feasible with the right incentives."  
     **Soft spots:** "Weighting" risks biasing representation. Compensation is costly. *Concede* skew is likely.  

  7. **Facilitator (Process-Obsessed):**  
     *"Group dynamics fester over eight years. Cliques, grudges, lobbyist capture—this is a facilitator’s nightmare."*  
     **Reply:** "Annual cohort rotation (20% new members) injects fresh perspectives. No renewal reduces careerism. Facilitators would rotate too. Capture is harder when decisions affect members personally via the lag."  
     **Soft spots:** Lobbyists exploit stability. *Change subject* to the implementation lag as a counterweight.  

  8. **Civil Servant (Cost-Worrier):**  
     *"This will cost 10x a regular assembly. Who pays for a decade of venues, staff, and salaries?"*  
     **Reply:** "Compare to High-Speed Rail’s $100B+ cost overruns from short-term politics. A $20M assembly preventing one misstep pays for itself. We’d piggyback on existing parliamentary infrastructure."  
     **Soft spots:** Overrun prevention is hypothetical. *Concede* high upfront costs.  

  ---

  ### **Preemptive Concessions (First 2 Minutes)**  
  Lead with these to build credibility:  
  > *"I’ll start with three caveats. First, this only works for specific long-term issues—it’s not a general governance tool. Second, the attrition risk is real; we’d need legal employer mandates I admit are optimistic today. Third, legitimacy isn’t electoral—it’s functional. If you reject that tradeoff, this fails."*  

  ---

  ### **The Reply That Must Land**  
  **When challenged on legitimacy:**  
  *"We already delegate binding power on long-term issues—to central banks, constitutional courts, and pension boards. Those are appointed or elected once. This replaces technocrats with a representative sample. The implementation lag means if they get it wrong, they’ll face their neighbors while the policy bites. That’s more accountability than a bureaucrat who retires to the countryside."*  
  **Why it’s critical:** If they don’t buy this equivalence to existing delegated powers, your thesis collapses.  

  ---

  ### **The Question You Hope Nobody Asks**  
  **Evaluator:** *"You claim elected officials discount beyond their term. But your assembly has no reelection constraint. What stops them from *over*-investing in the future, imposing brutal costs on the present?"*  
  **Why it’s dangerous:** It targets your core mechanism (no electoral horizon) and could paint you as a utopian.  
  **Your reply:**  
  > *"The implementation lag is the check. If they impose brutal costs, they’ll be alive when their friends lose jobs or taxes rise. This forces balance—unlike politicians who can promise pain-free futures. But you’re right: we’d need strong impartial secretariats to model impacts, much like budget offices do now."*  
  **Vulnerability:** Still assumes members care about collective fallout. Concede monitoring is essential.  

  ---

  ### **Summary Notes**  
  - **Your strength:** Novelty. You’re not rehashing sortition’s virtues but solving a specific problem (electoral time horizons).  
  - **Their bias:** They’ll judge this through a *practical* lens: cost, logistics, political sellability.  
  - **Trap to avoid:** Don’t get dragged into "sortition vs. elections." Anchor to *long-term decisions* and existing delegation models.  
  - **Delivery tip:** Use actuarial analogies (e.g., "Pension trustees face 40-year liabilities but are appointed for 5. That mismatch causes systemic risk.").  

  You’ve got a tight case. Expose its edges early, defend the delegation parallel fiercely, and they’ll engage on your terms.
