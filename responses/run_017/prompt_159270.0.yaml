  i want to close a session on personal identity with a villanelle instead of yet another handout. Speaker: the man in the teletransporter booth on Earth, mid-scan, addressing the replica who will step out on Mars. The two refrains should be the two things people want to say about this case — the ordinary view that survival is a further fact that either holds or doesn't, and Parfit's line that what matters is psychological continuity and connectedness with any cause, so nothing that matters is lost even though identity is a separate question. Please get it right: the reductionist claim isn't that the replica simply is you, it's that there's no further fact for survival to consist in; and in the branching case where the machine makes two, identity can't hold for either — not because one of them loses a coin toss — while nothing that matters has gone. If you can get the combined spectrum in (survival coming in imperceptible degrees, so the question has no sharp answer) do it in the last tercet. Full villanelle, both refrains meeting in the final quatrain, and the last two lines should show the two claims sitting side by side rather than one knocking the other out. Someone who knows Part Three of Reasons and Persons should think it's accurate; someone who doesn't should just find it a bleak poem about stepping into a machine.
