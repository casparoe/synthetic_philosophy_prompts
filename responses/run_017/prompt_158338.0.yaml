  The user argues with a conservator friend who thinks it's just about provenance gossip—the story adds value. But the user disagrees because these objects are still appreciated aesthetically, not just as relics. They also point out neighboring cases: homages later treated as forgeries, synthetic continuations of a dead artist's work that outperform minor genuine works. Then there are counterexamples where exposure destroys value, like anonymous fakes or unsuccessful deceptions. 

  The user wants to know if there's a term or concept in philosophical or critical literature for this phenomenon. They're not just after a name; they want a clear definition and boundaries. They need this for their valuation notes to classify reattributed objects accurately. 

  First, I need to recall if there's existing literature on this. The user mentions the puzzle of undetectable fakes being less valuable, but their case is the opposite. So maybe existing theories like Nelson Goodman’s "autographic vs. allographic" art or Arthur Danto’s "artworld" might touch on context affecting value. But specifically, the increase in value post-exposure? That's unique.

  Van Meegeren’s case is key. After exposure, his forgeries became valuable because of the notoriety and his skill in deceiving experts. But why do some fakes gain value while others don't? Factors like the fame of the forger, the scale of deception, and the aesthetic quality matter. The user’s examples of homages and synthetic works suggest that the narrative and perceived skill can add value even without deception.

  The user’s deeper need might be for a framework to categorize these objects in valuations. They need precise terminology to explain why certain items retain or increase in value post-exposure. They might also want to predict when this phenomenon occurs, to advise clients or set reserves.

  Looking at boundary cases: homages mistaken for fakes gain value without actual deception. Synthetic continuations (like those mimicking a dead artist) succeed because they’re transparent about their nature but still valued for craftsmanship. Anonymous fakes lose value because there's no story or artist to attach to. Unsuccessful deceptions don't gain value because no one was fooled. Fabricated specimens become worthless as they lose scientific integrity.

  So, the core elements seem to be: a compelling narrative (scandal, skill), aesthetic merit that survives exposure, and a named creator (forger or artist). The term "autographic forgery" comes to mind, but maybe that's not established. Perhaps "valorized deception" or "narrative valorization." But the user wants a definition and boundaries.

  Key questions: Does actual deception matter? In homages, there's none, but later misattribution creates the narrative. So attributed deception might suffice. Institutional embarrassment adds to the story but isn't always necessary—skill demonstration in synthetic works can suffice. The premium likely combines aesthetic and narrative value, though the user insists the objects are still engaged with aesthetically. Over time, as scandal fades, the value might rely more on aesthetic merit if the narrative diminishes.

  Proposing the term "Scandal Premium" or "Notoriety Dividend" could work, but the user might want something more academic. "Provenance Paradox" captures the irony but might be too vague. "Authenticity Surplus" is another option, emphasizing the new authentic narrative. 

  For valuation notes, the user needs a concise term. Defining the phenomenon as requiring a compelling narrative, aesthetic resilience, and a reattributable creator. Boundary cases: homages with attributed deception fit, synthetic works without deception but with skill demonstration fit, anonymous or unsuccessful deceptions don't. The premium decays if the narrative fades unless aesthetic value endures.

  The user might also need to distinguish between types of value—monetary vs. cultural. In the art market, narrative drives prices, but aesthetic engagement sustains long-term value. This framework helps in categorizing objects post-revelation, guiding appraisals and catalog notes.
answer: |-
  What you've described is a fascinating and paradoxical phenomenon that sits at the intersection of aesthetics, value theory, provenance, and art market psychology. While no single, universally established term in philosophy or critical theory perfectly encapsulates *all* your cases, we can carve out a precise concept, define its boundaries, and propose a name. Let's break it down:

  **The Core Phenomenon & Its Name:**

  *   **The Phenomenon:** An object *gains* significant cultural and/or monetary value *specifically because* it is revealed to be a deliberate misrepresentation (forgery, fake, sophisticated homage mistaken for the real thing, synthetic continuation), where the revelation involves a compelling narrative of deception, skill, or institutional failure. Crucially, the object retains aesthetic interest and engagement beyond its mere notoriety.
  *   **Proposed Name:** **"Notoriety Dividend"** or **"Scandal Premium"**. While descriptive, these capture the core driver: value *added by* the revelation of the deception and its circumstances.
  *   **More Formal/Academic Term:** **"Valorized Deception"** or **"Authenticity Surplus via Provenance Narrative."** The latter emphasizes the shift from one "authentic" state (e.g., a Vermeer) to another (e.g., an authentic *Van Meegeren forgery of a Vermeer*), where the new authenticity is defined by the scandal itself and the object's role within it.

  **Why Existing Concepts Don't Fully Cover It:**

  1.  **Provenance Value:** As your friend notes, provenance is key, but standard provenance value usually accrues to *positive* associations (royal ownership, famous collections). This is *negative* provenance value that paradoxically *enhances* the object. It's provenance as scandal.
  2.  **The Forgery Debate (Goodman, Danto, etc.):** This primarily tackles *why* a perfect fake is considered aesthetically inferior *even if undetectable* (arguments about history of production, artistic intention, "genuineness" as a constitutive property). Your case is the *opposite*: the *detection* and *revelation* of the fake *adds* a layer of value *on top of* its aesthetic properties, creating a *new* kind of "genuineness."
  3.  **Aura (Benjamin):** The "aura" of the original is lost in a forgery. Here, the forgery *gains* its own distinct "aura" derived from its history of deception. It's a secondary aura born of scandal.
  4.  **Pastiche/Homage:** These are usually valued lower than the originals they reference. Your cases involve homages/pastiches that are *mistaken* for the real thing and *then* gain value *because* of that mistaken attribution and subsequent exposure.
  5.  **Institutional Critique:** While related (exposing institutional fallibility), this is usually the artist's intent. Here, the critique is an *unintended consequence* of the deception's exposure, and the value accrues to the *object*, not just the critique.

  **Carving the Concept: Boundaries & Requirements**

  Based on your cases and counter-cases, we can define the necessary and sufficient conditions for the "Notoriety Dividend" to arise:

  1.  **Revelation of Misrepresentation:** The object must be definitively reclassified *away* from its initial, higher-status attribution (Vermeer -> Van Meegeren; "genuine late work" -> "synthetic continuation"). The revelation is crucial.
  2.  **Compelling Narrative:** The revelation must involve a story that captures the imagination. Key narrative elements include:
      *   **Successful Deception (Real or Attributed):** The object *must* have been accepted, even if briefly, *as the real thing* by someone/something credible (a major museum, a renowned expert, the market itself for a significant period). This is the scandal fuel. (This excludes your "unsuccessful deception" case).
      *   **Demonstrated Skill:** The deception must be seen as requiring significant skill, craftsmanship, or insight into the original. Crude fakes don't qualify. This underpins the retained aesthetic interest.
      *   **Identifiable Agent:** There needs to be a creator (forger, workshop, artist) whose story becomes part of the object's new identity (Van Meegeren the trickster genius). Anonymous fakes lack this hook (your counter-case). The "synthetic continuation" works succeed because the *concept* (continuing the master's style) and the *skill* demonstrated become the narrative, even without initial deception.
  3.  **Aesthetic Resilience:** The object must possess sufficient intrinsic aesthetic qualities (composition, technique, material presence) to sustain interest *beyond* its documentary value as a relic of scandal. People still engage with it *as an artwork/picture*. This differentiates it from purely documentary relics (e.g., a forged document might only have historical value post-exposure).
  4.  **Reattribution Creates New "Authenticity":** The object isn't just a "failed Vermeer"; it becomes an *authentic* "Van Meegeren Forgery" or an *authentic* "Authorized Synthetic Continuation of Artist X." It gains a *new*, stable identity defined by the narrative of its creation and revelation.

  **Applying the Carving to Your Cases:**

  *   **Van Meegeren "Vermeers":** ✅ Revelation. ✅ Compelling Narrative (fooled Goering, experts, museums). ✅ Demonstrated Skill. ✅ Identifiable Agent (Van Meegeren). ✅ Aesthetic Resilience (still hung as pictures). ✅ New Authenticity (Authentic Van Meegeren Forgery).
  *   **Homages/Pastiches Later "Exposed" as Fakes (though never intended as such):** ✅ Revelation (misattribution discovered). ✅ Compelling Narrative (Attributed Deception - market was fooled, even if artist wasn't deceptive; Skill demonstrated). ✅ Identifiable Agent. ✅ Aesthetic Resilience. ✅ New Authenticity (e.g., "Authentic Example of Y's work mistaken for X"). *(Requires attributed deception)*.
  *   **"Synthetic Continuations" of Dead Artists:** ✅ Revelation (Transparent from outset, but the *act* of continuation is the revelation). ✅ Compelling Narrative (Skill in mimicking the master; Concept of continuation itself). ✅ Identifiable Agent/Creative Force (The workshop/concept). ✅ Aesthetic Resilience. ✅ New Authenticity ("Authentic Synthetic Continuation of X's Late Style"). *(Does not require actual deception, but requires the narrative of skillful emulation/continuation and market acceptance of that concept)*.
  *   **Anonymous Fake Exposed:** ❌ Lacks Identifiable Agent & Compelling Narrative (just "a fake"). Value collapses.
  *   **Fake Exposed Before Certification:** ❌ Lacks Successful/Attributed Deception. No scandal, no compelling narrative. Value minimal or collapses.
  *   **Fabricated Field Notes/Specimen:** ❌ Lacks Aesthetic Resilience. Value is purely documentary/scientific integrity, destroyed by exposure. No new "authenticity" is possible.

  **Addressing Your Specific Questions:**

  *   **Actual Deception vs. Attributed Deception:** Attributed deception is sufficient (as in the homage case mistaken for a fake). The *narrative* of having fooled someone credible is essential. The "synthetic continuation" case shows a compelling narrative *without* deception can also work if skill and concept are central.
  *   **Institution Fooled vs. Demonstrated Skill:** Skill is necessary but not sufficient. The narrative requires *either* actual institutional/market deception *or* a concept (like synthetic continuation) where the skill is the *point* and creates its own market acceptance/narrative. An undiscovered, anonymous fake has skill but no narrative/revelation = no dividend.
  *   **Aesthetic Life vs. Documentary Interest:** The premium **requires both**. The scandal provides the initial boost and narrative hook, but the aesthetic resilience allows the object to sustain value and be engaged with beyond the scandal's immediate aftermath. If it were only documentary, its value would decay rapidly as the scandal faded.
  *   **Does the Premium Decay?** Potentially, yes, *unless* the aesthetic resilience is strong enough. If the scandal fades from living memory and the object lacks sufficient independent aesthetic merit or historical significance beyond the scandal, its value will likely decline. However, if the object is aesthetically compelling *and* the scandal becomes a well-documented historical episode (like Van Meegeren's), the premium can become a permanent part of its value profile ("historically significant forgery by a master faker"). The narrative becomes part of art history itself.

  **Conclusion & Recommendation for Valuation Notes:**

  You've identified a distinct phenomenon: the **Notoriety Dividend** or **Valorized Deception**. Its core is the *value added by the revelation of a compelling narrative of deception (real or attributed) or masterful emulation, combined with the object's enduring aesthetic qualities, which together create a new form of authenticity for the object.*

  **For your valuation notes, a concise description could be:**

  > *"Reclassified as an authenticated example of [Creator/Workshop Name]'s work created in the manner of [Original Artist], this object possesses significant value derived from its notable history of [briefly state the scandal/narrative, e.g., 'having been accepted as a work by X before attribution was revised,' or 'as a recognized masterful homage/synthetic continuation']. This provenance narrative, combined with its inherent aesthetic qualities, contributes substantially to its current market valuation."*

  This avoids needing a single potentially jargon-heavy term while clearly signaling the *source* of the value premium to anyone in the field. You've moved beyond "fake" to articulate the specific *kind* of historically and aesthetically significant object it now is. The carving is complete.
