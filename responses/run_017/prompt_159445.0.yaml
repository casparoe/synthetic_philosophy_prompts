  - **No** → **Leaf: Physical Pain Conservationism**  
    - *Most awkward commitment:* Must defend physical pain as intrinsically necessary even when it provides no new information or motivation.  

  **Branch 2: The Grief Case**  
  *Claim: "In a scenario where someone loses a loved one, they feel no sadness, fully understand the loss, and remain motivated to process it (e.g., seek support)—this outcome is acceptable."*  
  - **Yes** → Proceed to Branch 3.  
  - **No** → **Leaf: Physical-Suffering-Only Abolition**  
    - *Most awkward commitment:* Emotional suffering (e.g., grief) must be preserved despite its potential dysfunctionality, even when physical suffering is abolished.  

  **Branch 3: The Static Bliss Worry**  
  *Claim: "A world without suffering would become a static, unchallenged state of bliss, undermining growth, achievement, or meaning."*  
  - **Agree** → **Leaf: Static Bliss Objection**  
    - *Most awkward commitment:* Suffering is necessary for a meaningful life, so abolishing it is inherently misguided.  
  - **Disagree** → Proceed to Branch 4.  

  **Branch 4: Intervention Priority**  
  *Case: "Consider three technologies: (A) Prevents extreme agony (e.g., torture, severe depression) but leaves mild suffering; (B) Guarantees no one drops below neutral (no suffering) but doesn’t enhance bliss; (C) Maximizes bliss but doesn’t reduce suffering. Which is most urgent?"*  
  - **A (Prevent extreme agony)** → Proceed to Branch 5.  
  - **B (Guarantee no suffering)** → **Leaf: Hedonic Floor Raising**  
    - *Most awkward commitment:* Requires perpetual intervention to "rescue" people from suffering without removing their capacity for it, potentially creating dependency.  
  - **C (Maximize bliss)** → **Leaf: Ceiling Raising**  
    - *Most awkward commitment:* Ignores intense suffering (e.g., in unaltered humans/animals) to focus on enhancing positive states.  

  **Branch 5: Range Compression Trade-off**  
  *Case: "Reducing the worst suffering to mild levels (e.g., making torture feel like a stubbed toe) is worth keeping mild suffering as a motivator for everyday risks (e.g., children learning not to touch stoves)."*  
  - **Yes** → **Leaf: Range Compression**  
    - *Most awkward commitment:* Accepts mild suffering as a "tax" for motivation, potentially condemning beings to avoidable distress.  
  - **No** → Proceed to Branch 6.  

  **Branch 6: Scope of Application**  
  *Claim: "Suffering abolition should apply to all sentient beings (e.g., animals, AI) by default, not just consenting humans."*  
  - **Yes** → **Leaf: Full Abolitionism (Pearcean)**  
    - *Most awkward commitment:* Imposes a radical rewrite of all sentience (including non-consenting animals/AI) with irreversible evolutionary consequences.  
  - **No** → **Leaf: Human-Centric Abolition**  
    - *Most awkward commitment:* Denies abolition to non-human sentient beings (e.g., factory-farmed animals) despite their capacity for suffering.  

