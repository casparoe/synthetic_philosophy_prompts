  ### Key Notes
  **Indistinguishable Pair:**  
  The tree **cannot separate** direct-stimulation wireheading (bliss detached from reality) from reward-gradient abolitionism (bliss tied to real achievements). Both collapse into the abolition leaves (7 or 8) because:  
  - No branch questions force a distinction on whether "positive states must align with real-world states."  
  - Branch 3 (static bliss) partially addresses motivation but doesn’t isolate the "reality alignment" of rewards. To split them, a branch like *"Is bliss experienced during unearned or harmful acts (e.g., via brain stimulation) acceptable?"* would be needed—but this exceeds your six-branch limit.  

  **Unoccupied Cells in Logical Space:**  
  1. **Heritable Hedonic Floor Raising**  
     - *Description:* Guaranteeing no experience below neutral, applied heritably (e.g., via germline editing).  
     - *Why empty:* Coherent but unattractive—floor-raising interventions (e.g., neural implants) are typically framed as reversible safeguards, not genetic rewrites. Combines the awkwardness of dependency (Leaf 4) with non-consensual imposition (Leaf 7).  
  2. **Abolition with Preserved "Pain-As-Information"**  
     - *Description:* Suffering (unpleasant feeling) abolished, but pain-information and aversive motivation retained (e.g., the dentist case applied universally).  
     - *Why empty:* Incoherent in practice—pain-information without suffering often collapses into motivation-only (as in the dentist case), but for extreme scenarios (e.g., torture), decoupling is untested and may be psychologically unstable.  
  3. **Voluntary Range Compression for Non-Humans**  
     - *Description:* Reducing suffering intensity in animals/AI via reversible, non-consensual interventions.  
     - *Why empty:* Unadvocated—compression (Leaf 6) is usually proposed for humans; applying it non-consensually to non-humans draws criticism from both abolitionists (for not going far enough) and conservationists (for overriding "natural" states).  

  The tree isolates your emphasized distinctions:  
  - Dentist/grief cases split physical vs. emotional suffering acceptance (Branches 1–2).  
  - Intervention types are separated by trade-offs (Branch 4 prioritizes floor/ceiling/compression; Branch 5 tests compression’s limits).  
  - "Safety floor" (Leaf 4) is distinct from full abolition.  
  - Static bliss worry (Branch 3) exits skeptics early.  

