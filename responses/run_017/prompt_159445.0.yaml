  - **Intervention type** (hedonic floor, range compression, ceiling raising).  

  Each branch question is answerable without knowing the resulting position. Leaves are named where established; "unnamed" positions are described. Each leaf includes its "most awkward commitment" (a counterintuitive or challenging implication).  

  ### Decision Tree  
  **Start → Branch 1: The Dentist Case**  
  *Claim: "In a scenario where a dentist drills your damaged tooth, you feel no pain, remain fully aware of the damage, and are strongly motivated to fix it—this outcome is acceptable."*  
