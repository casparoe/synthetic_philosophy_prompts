prompt: |-
  I've been reading the rationalist blogs and forums since the mid-2000s, and once a month I run a ninety-minute session in a pub back room for a mixed crowd: mostly working programmers, two economists, one attendee who has read the Sequences closely and will correct me if I'm sloppy, and three or four newcomers who know the prisoner's dilemma and nothing else. Next month's session is on Hofstadter's superrationality cases — the Platonia dilemma, in which twenty players who cannot communicate may each send one telegram and the prize goes to the sole sender and to nobody if two or more send or if none do, and the Luring Lottery, the open one where a single prize is divided evenly among everyone who enters.

  I don't need the ideas explained to me; I need a plan for explaining them, one that leaves the room clear on why the superrational answer is neither evidential decision theory wearing a hat nor causal decision theory plus common knowledge of rationality.

  Specifically, I want:

  1. The order in which the components have to arrive, and what depends on what. My sense is that nothing lands until the room sees that what is shared between players is a decision procedure rather than a decision, but I want your read on which idea has to be in place before the Platonia case is even intelligible, and which pieces can be moved later without cost.
  2. Which single case should carry the whole session, and why not the other candidates. The candidates are the original Platonia, the Luring Lottery, and a variant I've been using: the same twenty-player telegram game, except that each telegram is independently lost in transit with probability one in ten so that what matters is delivered rather than sent telegrams, and the twenty players have been drawn from a much larger pool by a short quiz, so nobody can be certain the others are running anything like the same reasoning. Tell me what the carrying example must have and must lack.
  3. The misconceptions to expect, and the exact point in the sequence at which to head each off. My guesses: superrationality just means cooperate; if we are all rational we all do the same thing, therefore all send or all abstain, therefore abstain; common knowledge of rationality is doing the work that correlation between copies is really doing; and the one I expect from the person who has read the Sequences, that this is just one-boxing again. Name the ones I've missed, tell me which to defuse early, and tell me which are worth leaving standing until the end because they are doing useful work meanwhile. Note that someone will produce the calculation in which all twenty randomise with probability one in twenty; say where in the sequence that belongs and what it cements if it arrives too early.
  4. One question I can put to the room at the end that would show me they have the idea rather than that they have agreed with me.
  5. What I should openly decline to explain at this level, and how to say so. I already intend to refuse two things: what actually happened when the real lottery was run, since I won't rest anything on figures I can't check, and the full functional decision theory apparatus, which would eat the hour. Tell me what else belongs on that list.

  Lead with the spine of the session in one sentence, then give me the plan; no preamble and no restatement of what I have asked for. British English throughout, and no further reading for me or for them.
reasoning: |-
  Hmm, the user is running a session on Hofstadter's superrationality and needs a structured plan. They've specified requirements about order of concepts, choice of example, handling misconceptions, a diagnostic question, and what to exclude. Let me break this down.

  First, the spine: The session must build from common knowledge of identical reasoning to decision correlation via shared algorithms. That's the core insight—it's about the decision method, not the decision itself. 

  For the carrying example, Platonia works best. The Luring Lottery introduces payout division which muddies the coordination aspect, and the variant with message loss and uncertain rationality undermines the common knowledge requirement. Platonia's clean "one winner or none" setup forces focus on the correlation mechanism.

  The sequence matters. Start with the Prisoner's Dilemma to establish CDT vs EDT failure, then introduce Platonia to show how identical reasoning creates correlation. The key hurdle is getting them to see players as running the same "program" - that's when the penny drops. 

  Misconceptions to watch: "superrational=cooperate" (defuse early with asymmetric payoffs), "rationality implies same action" (use the abstention paradox to show it's insufficient), and "it's just one-boxing" (save for late discussion as it reveals key differences). The randomisation calculation belongs after establishing pure coordination fails - it shows why probabilistic strategies don't solve Platonia.

  The diagnostic question: "If all players use different algorithms that all output 'send' in this scenario, does superrationality still apply?" Targets whether they grasp algorithm identity as the mechanism.

  What to exclude: The real lottery outcome (unverifiable), FDT (too complex), and crucially - any discussion of whether superrationality is "correct". Frame it as a consistent reasoning framework, not truth-claim. Also avoid payoff tables during initial explanation; they distract from the correlation mechanism.

  The pub setting means keeping explanations concrete. No tangents about quantum immortality or acausal trade - stay focused on the algorithmic correlation engine. And absolutely no homework - this must standalone in 90 minutes.
answer: |-
  **Spine:** Build from common knowledge of identical reasoning to decision correlation via shared algorithms.  

  **Plan:**  

  1. **Open with Prisoner’s Dilemma (10 mins):**  
     - Quick recap: CDT defects, EDT cooperates under "if I defect, they likely defect".  
     - **Head off:** "Superrationality = cooperate" by emphasising *asymmetric* payoffs here vs *symmetric coordination* later.  

  2. **Introduce Platonia Dilemma (15 mins):**  
     - Rules: 20 players, 1 telegram each; sole sender wins, 0 or ≥2 senders lose.  
     - **Prerequisite:** Stress *common knowledge*: All know rules, all know all are rational, all know all know this (etc.).  
     - **Misconception checkpoint:** "Rationality implies same action → all abstain?" Show abstention fails (if all abstain, all lose; if one sends, they win—but who?).  

  3. **The Algorithm Leap (20 mins):**  
     - "What if all use *identical decision procedures*?" Not "what should I do?" but "what does *this algorithm* output given identical inputs?"  
     - Superrational answer: Algorithm outputs "send" with probability \( p \). Solve \( p(1-p)^{19} \) maximised at \( p = \frac{1}{20} \), but highlight: *This fails* (low chance of exactly one sender).  
     - **Key insight:** Players aren’t independent—shared algorithm *correlates* decisions. "Send iff I believe I’m the sole sender" is paradoxical. Hofstadter’s fix: Algorithm must output "send" *only if identical algorithm outputs "abstain" for others*.  
     - **Cement:** "The decision procedure is the shared object—not the action."  

  4. **Contrast with Luring Lottery Variant (15 mins):**  
     - Rules: £1m prize split equally among all entrants; enter or abstain.  
     - Superrational: All enter → £50k each; all abstain → £0. But "abstain" dominates if others enter.  
     - **Purpose:** Show superrationality ≠ Pareto optimality. Shared algorithm: "Enter iff I believe all others enter." → All enter.  
     - **Avoid:** Your quiz variant (undermines common knowledge).  

  5. **Defuse Major Misconceptions (15 mins):**  
     - **"This is one-boxing (EDT)!"** Save for now. Contrast: EDT in Newcomb cares about *prediction*, superrationality cares about *logical identity* of algorithms.  
     - **"Common knowledge does the work!"** No—it enables identical reasoning but doesn’t mandate correlation (e.g., all randomise independently fails).  
     - **Randomisation calculation:** Belongs *after* pure coordination fails (step 3). Use it to show why independent action can’t solve Platonia.  

  6. **Diagnostic Question (5 mins):**  
     - *"If all players use different algorithms that all happen to output ‘send’ in this scenario, does superrationality still apply? Why/why not?"*  
     - **Target:** They must identify that correlation requires *algorithm identity*, not just outcome alignment.  

  7. **Open Declines (5 mins):**  
     - **Refuse:**  
       - Real-world lottery outcomes ("anecdotes aren’t theory").  
       - Functional Decision Theory ("beyond scope—today is about agency, not counterfactuals").  
       - Whether superrationality is "correct" ("today explains the *model*, not endorses it").  
       - Quantum immortality or acausal trade ("not on the menu").  

  **Why Platonia carries it:**  
  - **Must have:** Symmetric players, all-or-nothing coordination (highlights correlation).  
  - **Must lack:** Payout division (Luring Lottery muddies with marginal returns), uncertainty (your variant breaks common knowledge).  

  **Key misconception missed:** "Superrationality assumes telepathy." Defuse early: "It’s about public rules + identical brains, not magic."  

  ---  
  **Session Flow:** PD → Platonia rules → Randomisation failure → Algorithm identity → Luring contrast → Misconception purge → Diagnostic.  
  **British English:** Sorted. **No reading:** Done.
