  1) Naming a student who made a racist remark (after the clip already circulated)
  2) An unsigned op-ed criticizing a teacher's grading
  3) A news story claiming "the school is angry" based on a petition

  The checklist must include:
  - Specific questions in order
  - Clear pass/fail criteria
  - At least two hard stops (automatic rejection points)
  - At least one point requiring a vote
  - Laminated one-page format

  Key constraints:
  - No citations or reading lists (practical only)
  - Must acknowledge limitations (what the checklist can't do)

  The ethical tensions are complex: balancing truth-telling with harm prevention, anonymity needs with accountability, and reporting on events without creating narratives. Kierkegaard's emphasis on individual responsibility clashes with journalistic conventions about sources and audience.

  For the case applications, at least one should fail the test (as requested). Case 3 (the "school is angry" story) seems most vulnerable due to "ventriloquized consensus." Case 1 (naming the sophomore) risks "leveling," and Case 2 (unsigned op-ed) tests the pseudonym paradox.

  The checklist design should flow from concrete (facts) to abstract (ethics), with clear off-ramps. The "vote required" question should come late, after binary checks. Limitations must be stated upfront: this won't assess legality, accuracy, or predict audience reception—just ethical framing.
answer: |-
  Here’s a **15-Minute Ethical Check** for your editorial board, designed as a one-page laminated card. It operationalizes Kierkegaard’s ideas on the "crowd," leveling, and addressability, plus your "ventriloquized consensus" test.  

  ---

  ### **THE CARD: ETHICAL DECISION TREE**  
  *Work through these questions in order. Stop if any "NO" answer is reached.*  

  1. **FACT CHECK:**  
     *"Is every factual claim in this piece independently verifiable by our staff (e.g., documents, recordings, on-record sources)?"*  
     - **SUFFICIENT ANSWER:** Yes, with specific evidence noted.  
     - **HARD STOP IF NO.** Reason: Prevents manufacturing "truth" via speculation.  

  2. **INDIVIDUAL HARM:**  
     *"Does this piece name or clearly identify a specific student/staff member in a negative context? If YES, could the harm be reduced by anonymizing *without* losing truth?"*  
     - **SUFFICIENT ANSWER:** Harm is unavoidable for public accountability OR anonymizing would distort facts.  
     - **HARD STOP IF:** Naming serves only to shame/embarrass (not accountability).  

  3. **VENTRILOQUIZED CONSENSUS TEST:**  
     *"If the words 'students,' 'school,' or 'community' appear: Does the piece *prove* this group holds a view via direct input (e.g., surveys, votes), or is it assuming consensus?"*  
     - **SUFFICIENT ANSWER:** Proof shown (e.g., "62% of 200 polled students"); OR language changed to "some students."  
     - **HARD STOP IF:** Claims group outrage/opinion based only on petitions, social media, or <15% participation.  

  4. **ADDRESSABILITY TEST:**  
     *"Pick one real person affected by this piece (e.g., someone named, criticized, or quoted). Would we publish this *exactly as written* if they were the ONLY reader? Why?"*  
     - **SUFFICIENT ANSWER:** "Yes, because the story informs them/holds them accountable fairly" OR "No, but we’ve revised to remove gratuitous harm."  
     - **VOTE REQUIRED HERE.** Majority vote decides if the piece meets ethical addressability.  

  5. **ANONYMITY CHECK:**  
     *"If the author/source is unnamed: Is anonymity necessary to protect them from retaliation? OR is it hiding behind the ‘crowd’ to avoid accountability?"*  
     - **SUFFICIENT ANSWER:** Anonymity needed for safety (e.g., fear of bullying, job loss); OR author named.  
     - **HARD STOP IF:** Anonymity lets writers attack individuals without accountability.  

  ---

  ### **APPLIED TO YOUR CASES**  
  **Case 1: Naming the Sophomore**  
  - **Fact Check:** YES (recording exists).  
  - **Individual Harm:** YES (names student). Harm reduction? Unlikely—naming is core to accountability.  
  - **Ventriloquized Consensus:** N/A (not about group opinion).  
  - **Addressability Test:** YES (if the sophomore is the only reader, the piece holds them accountable to their actions).  
  - **Anonymity Check:** N/A (author named).  
  **→ PUBLISHABLE** *if harm is proportional (e.g., context given, no sensationalism).*  

  **Case 2: Unsigned Op-Ed Criticizing Teacher**  
  - **Fact Check:** YES (grading data verifiable).  
  - **Individual Harm:** YES (names teacher). Harm reduction? Anonymize teacher? NO—loses accountability.  
  - **Ventriloquized Consensus:** N/A.  
  - **Addressability Test:** **VOTE REQUIRED.** *Would you send this op-ed to the teacher as the only reader?* Likely NO—unsigned critique feels like a crowd attack.  
  - **Anonymity Check:** **HARD STOP.** Anonymity here avoids accountability; writers can criticize without facing the teacher.  
  **→ KILL THE PIECE** unless authors agree to attach names.  

  **Case 3: "School is Angry" Walkout Story**  
  - **Fact Check:** YES (petition exists).  
  - **Individual Harm:** NO (no individuals named).  
  - **Ventriloquized Consensus:** **HARD STOP.** "School is angry" claims consensus, but 200/1800 signatures = 11%. *Manufactures outrage.*  
  - **Addressability Test:** N/A (stopped at #3).  
  - **Anonymity Check:** N/A.  
  **→ KILL THE PIECE.** Rewrite framing: "Some students plan walkout after petition garners 200 signatures."  

  *(Your board won’t like killing Case 3—but it fails the ventriloquized consensus test. Headlines declaring "the school" believes X create the illusion of unity where none exists.)*  

  ---

  ### **WHAT THIS CHECK CANNOT DO**  
  1. **Verify truth:** Assumes facts are checked *before* this ethical review.  
  2. **Assess legality:** Does not cover libel, FERPA, or press freedom. Faculty advisers must handle this.  
  3. **Predict reception:** Cannot stop readers from misinterpreting the piece as "crowd" rhetoric.  
  4. **Prevent bias:** Won’t catch buried ledes or cherry-picked quotes—rely on editing.  
  5. **Solve dilemmas:** It flags ethical tensions but won’t replace nuanced debate for edge cases.  

  ---  
  **Design Notes:**  
  - **Time Saver:** Focuses on high-risk elements (naming, anonymity, group claims).  
  - **Kierkegaard In Action:** Rejects "crowd" logic (Cases 2–3), prioritizes individual addressability (Case 1).  
  - **Laminated Backside Tip:** *"When in doubt: Who is speaking? To whom? Why hide?"*  

  This won’t prevent all mistakes—but it forces scrutiny where your near-misses occurred. Run every controversial piece through it.
