prompt: |-
  Hi. I've been reading, slowly and as a hobby (I'm a hospital pharmacist by trade, so this is all very much outside my day job), the literature that tries to get norms for what you should believe out of one idea: that a set of opinions is better the closer it sits to the truth, that you can put a number on how close, and that from there you can argue that certain ways of forming opinions are worse than others no matter how things actually turn out. I keep bumping into something I don't have a word for, and I want to know whether it has one.

  Here's the toy I keep playing with. Four ways things could go, call them w1 to w4. Annie spreads her confidence evenly, 25% on each. Bella goes 40/40/10/10. Score them by adding up the squared gap between confidence and truth over the four possibilities, lower is better. If w1 or w2 is the actual one, Bella does better (0.54 against 0.75). If w3 or w4 is, Annie does better (0.75 against 1.14). So neither of them is better come what may. Now score them again over just two possibilities, "w1 or w2" and "w3 or w4". Annie is 50/50, Bella is 80/20 — nothing about either of their opinions has changed, they're the same opinions described more coarsely — and suddenly Annie wins outright: 0.5 against 0.68 whichever way it goes. The verdict "one of these people is doing worse however things turn out" versus "neither is" seems to depend entirely on how finely you slice.

  Second thing, same flavour. Instead of asking who wins in each possibility, average each person's score using someone's confidence as the weights. If you use Annie's numbers as the weights, Annie comes out ahead (0.75 against 0.84 for Bella). If you use Bella's, Bella comes out ahead (0.66 against 0.75). Everybody's favourite is themselves. And it doesn't help to switch to the "must win in every possibility" version of the argument, because that's the version that flipped in the first case.

  So: the verdict depends on decisions that the arguments don't seem to argue for — how fine the possibilities are, whose numbers do the averaging, and (a third variant) whether you score someone only on the claims she actually voiced or on all the claims her opinions commit her to like "A or B" and "not A". And my suspicion, which I can't quite make precise, is that the flipping isn't random: it tends to favour whoever got to set the scorecard up.

  Does this have a name, or several names for what might be two different things? Please don't just hand me a label — I want to know what exactly the phenomenon is, whether my two cases are the same phenomenon or not, what it's NOT (it feels close to "any comparison can be wrecked by redescribing the options", but that can't be right either, since some redescriptions here don't change anything), whether there's a constraint on the numerical measures that makes it go away and what that constraint costs, and whether it means these arguments quietly assume part of what they're trying to show. If there's no established concept, coin one and define it, with a couple of cases that fall just outside it. And please skip the references and reading suggestions — I've no library access worth speaking of and I'll chase those up separately if I need them.
reasoning: |-
  Okay, let me tackle this query step by step. The user is exploring epistemic scoring rules and noticing how evaluations of belief accuracy flip depending on framing choices like granularity of possibilities or weighting schemes. 

  First, I need to parse their two core examples clearly. The coarse-graining paradox shows Annie beating Bella when possibilities are grouped, even though neither dominates in the fine-grained view. The self-weighting paradox reveals that each believer appears superior when their own credences are used to average scores. 

  Hmm, these feel distinct but related - both expose how epistemic scoring depends on arbitrary framework decisions. The common thread seems to be that the assessment method itself introduces evaluative bias, favoring whoever's doxastic state aligns with the scoring parameters. 

  For the coarse-graining issue, I recall this resembles what's called "partition sensitivity" in accuracy dominance arguments. But the self-weighting case is trickier - it might connect to the "linear pool vs logarithmic score" debate, though that's not quite it. 

  *scribbles mentally* Perhaps we need a new umbrella term like "epistemic frame dependence"? But let me verify if existing concepts fit first. The shifting verdicts definitely aren't just about redescription generally - it's specifically the scoring rule's sensitivity to partition structure and weighting that matters here.

  What's profound is how this undermines objectivity claims in epistemic utility theory. If "better" depends on whose perspective sets the scoring parameters, it suggests circularity: the norms presuppose the very credences they aim to justify. 

  *checks intuition* No, this isn't merely about incommensurability - in both cases we have commensurable scores, but the dominance relation reverses under legitimate transformations. That's more subversive.

  For constraints: strictly proper scoring rules avoid the self-weighting issue but not coarse-graining flips. And requiring partition invariance would gut most epistemic arguments. So the cost is high - we'd lose most accuracy-based norms.

  Ultimately both phenomena reveal that accuracy evaluations aren't neutral; they embed assumptions about relevance and weighting. That meta-point feels crucial for the user's suspicion about "who sets the scorecard".
answer: |-
  Your observations cut to the heart of a profound challenge in epistemic scoring rules and accuracy arguments for probabilism. What you're describing doesn't have a single universally agreed-upon name, but it encompasses several interconnected phenomena. Let's dissect it precisely.

  ### Core Phenomena Identified
  1.  **Partition Sensitivity of Dominance (Your First Case):**
      *   **What it is:** Whether one credence function accuracy-dominates another (i.e., is strictly more accurate in every possible world) depends critically on the choice of *partition* over which possibilities are defined. Coarsening or refining the partition can reverse the dominance relation.
      *   **Why it happens:** The Brier score (sum of squared errors) you used is *partition-dependent*. Accuracy is measured relative to the atoms of the chosen partition. When you coarse-grain (e.g., from {w1, w2, w3, w4} to {w1∨w2, w3∨w4}), the truth-value targets change (now 1 or 0 for the *disjunctions*), and the credences being scored change (Annie: 50/50, Bella: 80/20). The scoring rule is applied to a fundamentally different set of propositions. Dominance is not preserved under this change of descriptive granularity.
      *   **What it's NOT:** It's not *merely* that any comparison can be wrecked by redescription. Crucially:
          *   The credence functions themselves haven't changed; only the *description of the possibilities* against which they are evaluated has changed.
          *   The *scoring rule itself* (Brier score) is applied consistently *within* any given partition. The issue is that dominance defined over one partition doesn't entail dominance over a different, even logically related, partition.

  2.  **Perspectival Bias in Expected Accuracy (Your Second Case):**
      *   **What it is:** When comparing the *expected accuracy* of two credence functions (C1 and C2) relative to a probability function P, the verdict "C1 has higher expected accuracy than C2" depends critically on *which* P is used to calculate the expectation. Specifically, each credence function will judge itself to have the highest expected accuracy relative to its *own* probability measure.
      *   **Why it happens:** This stems directly from the defining property of a **Strictly Proper Scoring Rule** (like the Brier score). A scoring rule S(C, w) is strictly proper if, for any probability function P, the expected score *relative to P* (Σ_w P(w)*S(C, w)) is uniquely minimized when C = P. Therefore:
          *   Using Annie's credence (A) as P: Expected Score(A) < Expected Score(B) because A minimizes its own expected score.
          *   Using Bella's credence (B) as P: Expected Score(B) < Expected Score(A) because B minimizes its own expected score.
      *   **What it's NOT:** This isn't a flaw or paradox *of the scoring rule itself*. It's a *consequence* of strict propriety, which is generally considered a *desirable* property (it incentivizes honest reporting of beliefs). The "bias" arises when we try to use expected accuracy *relative to a specific P* as a neutral, external measure of epistemic virtue, but the choice of *which* P to use is arbitrary. The credence functions themselves provide the only probability measures available for calculating expectation, leading to self-favoring results.

  ### Are These the Same Phenomenon?
  They are **distinct but deeply connected** manifestations of a core challenge: **The lack of a single, privileged, neutral perspective for evaluating epistemic performance.**

  *   **Partition Sensitivity** reveals that "doing better no matter how things turn out" (dominance) depends on the chosen level of descriptive detail (the partition).
  *   **Perspectival Bias** reveals that "doing better on average" (expected accuracy) depends on the chosen probability measure used to define "average".

  Both expose that **evaluative judgments about credences are inherently tied to a frame of reference** (a partition, a probability measure) that is not dictated by the accuracy-first framework itself. This frame must be supplied externally, creating the opening for the suspicion you voiced: the verdict can favor whoever sets up the evaluation parameters.

  ### What About "Commitments" (Your Third Variant)?
  Evaluating over a minimal set of propositions versus all commitments (like "A or B") is closely related to **Partition Sensitivity**. The set of propositions you commit to implicitly defines a partition (the atoms of the algebra generated by those propositions). Scoring only explicit commitments versus all logical consequences changes the partition/algebra over which accuracy is measured, directly impacting dominance relations, just like coarse-graining did. This emphasizes that epistemic evaluation isn't just about stated beliefs but the entire doxastic state they represent.

  ### Can Constraints Make it Go Away? At What Cost?
  1.  **For Perspectival Bias (Expected Accuracy):**
      *   **Constraint:** Use *only strictly proper scoring rules* and evaluate expected accuracy *only relative to the true chance function or a uniquely rational prior*.
      *   **Cost:** This requires identifying the "true" probability measure (chance or prior) independently of the credences being evaluated. This is often epistemically inaccessible or assumes the very objectivity the framework is trying to ground. It reintroduces the need for external justification of that measure.
  2.  **For Partition Sensitivity (Dominance):**
      *   **Constraint:** Require dominance to hold over *all possible* partitions, or at least all partitions generated by the propositions an agent *should* care about.
      *   **Cost:** This is devastatingly strong.
          *   **No Non-Trivial Dominance:** It's extremely difficult for one non-probabilistic credence function to accuracy-dominate another over *all possible partitions*. More importantly, Joyce's original accuracy-domination theorem shows that *only* probabilistic credences are *never* accuracy-dominated *by another credence function defined over the same domain*. Requiring dominance over *all* domains/partitions is far too strong and likely unworkable.
          *   **The "Should Care" Problem:** Defining the set of partitions an agent "should" care about is highly problematic and context-dependent, again requiring external input.
      *   **Weaker Constraint (Standard Approach):** The standard accuracy-dominance argument for probabilism *fixes a specific partition/algebra* and shows that *over that specific set of propositions*, any non-probabilistic credence is dominated by a probabilistic one. This avoids the need for all-partition dominance but concedes that the dominance verdict is partition-relative. It assumes the relevance of the chosen partition.

  ### Does This Undermine the Arguments? (The Circularity Suspicion)
  Yes, in a significant way. The suspicion that the flipping "tends to favour whoever got to set the scorecard up" points to a potential **epistemic circularity** or **bootstrapping problem**:

  1.  **The Partition Problem:** Arguments for norms (like probabilism) based on dominance require choosing a partition. But the choice of which partition is *relevant* or *salient* for epistemic evaluation often presupposes background knowledge or epistemic priorities that themselves need justification. Why evaluate Annie and Bella over {w1, w2, w3, w4} or {w1∨w2, w3∨w4}? The argument doesn't tell us; it assumes the partition is given. The verdict hinges on this assumed, unjustified (within the framework) choice.
  2.  **The Weighting Problem (Expected Accuracy):** Using expected accuracy requires a probability measure. If the only available measures are the agents' own credences, the evaluation becomes self-referential and circular: "Your beliefs are best *according to your own beliefs*." Appealing to an external "true" measure requires justification *outside* the accuracy-first framework, potentially undermining its self-sufficiency.
  3.  **The Commitment Scope Problem:** Deciding whether to score only explicit beliefs or all commitments again presupposes a view on what constitutes a relevant epistemic commitment.

  **In essence:** Accuracy-first arguments often *assume* a specific epistemic context (a relevant partition, a relevant set of commitments, sometimes a weighting scheme) to derive norms. However, determining *which* context is the right one for epistemic evaluation is itself a fundamental epistemic question that the accuracy-first framework, on its own, struggles to answer neutrally. The framework needs inputs it cannot justify internally, creating the opening for the evaluative instability you observed. It doesn't *quietly assume the conclusion*, but it does *quietly assume essential parameters of the evaluation context* that significantly influence the normative conclusions drawn.

  ### Proposed Terminology
  Since established terms are partial, let's coin a precise umbrella concept:

  *   **Epistemic Frame Relativity (EFR):** The phenomenon whereby evaluative judgments about the accuracy or epistemic virtue of credence functions (e.g., dominance, expected superiority) depend non-trivially on the choice of a **frame**, where a frame F consists of:
      1.  A **Partition (Ω_F):** The set of mutually exclusive, exhaustive possibilities defining the descriptive grain.
      2.  A **Weighting Function (P_F):** The probability measure used for calculating expectations (e.g., expected accuracy). (Can be `None` for dominance arguments).
      3.  A **Commitment Scope (S_F):** The set of propositions over which accuracy is evaluated (e.g., only explicit beliefs, all atomic propositions, all propositions in an algebra).

  *EFR manifests when altering F (e.g., coarsening Ω_F, changing P_F, expanding S_F) leads to a reversal or significant change in the evaluative comparison between credence functions, despite the underlying doxastic states remaining constant.*

  *   **Your First Case:** EFR via change in Ω_F (fine-grained to coarse-grained partition) and implied change in S_F (scoring disjunctions directly). P_F = `None` (dominance).
  *   **Your Second Case:** EFR via change in P_F (Annie's weights vs. Bella's weights). Ω_F and S_F fixed.
  *   **Your Third Variant:** EFR via change in S_F (explicit commitments vs. full logical closure). Ω_F implied by S_F, P_F = `None` or specified.

  **Cases Just Outside EFR:**
  1.  **Redescription without Frame Change:** Describing "w1 or w2" as "Not-(w3 or w4)" doesn't change Ω_F, S_F, or P_F. The Brier score over the original partition remains identical. No evaluative flip occurs.
  2.  **Linear Transformation of Scores:** Changing the Brier score by adding a constant or multiplying by a positive scalar might change absolute scores but preserves *dominance relations* (if C1 dominates C2 under S, it dominates under a*S + b). EFR involves changes that alter the dominance/ranking itself.

  **Conclusion:** You've astutely identified **Epistemic Frame Relativity (EFR)**. It's not one single flaw, but a fundamental sensitivity inherent in applying numerical accuracy measures to evaluate beliefs. The phenomena you describe (partition sensitivity, perspectival bias in expectation, commitment scope dependence) are distinct facets of EFR. It highlights that accuracy-first epistemology cannot generate evaluative norms in a vacuum; it requires crucial inputs (the frame F) that themselves demand epistemic justification external to the framework. This doesn't necessarily invalidate the approach, but it crucially clarifies its limits and the source of the "flipping" you observed: the evaluative verdict is always relative to the chosen, and contestable, epistemic frame.
