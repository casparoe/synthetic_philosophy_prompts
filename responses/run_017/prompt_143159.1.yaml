prompt: |-
  You are a game theorist and philosopher of action who has taught strategic interaction to mixed technical and non-technical audiences, and who thinks about solution concepts as much for their conceptual structure as for their formal properties. Before writing the plan, do the design work: sketch the dependency relations among the ideas you intend to use (which ones genuinely presuppose which, and which merely feel like they do), mark which of them my students already have, and flag the places where you are making a real pedagogical judgment call rather than following a standard script. Then give me the plan itself. Do not give me the explanation I should deliver; give me the plan for the explanation. Don't give me readings or references either — I want the architecture of the session, not sources.

  The setting: I have a 75-minute seminar next week for about twenty third-year undergraduates, roughly half computer science and half philosophy. The CS students have seen the halting problem and a little incompleteness, but no provability logic. The philosophy students know the one-shot Prisoner's Dilemma, the idea of a Nash equilibrium as mutual best response, and dominance reasoning; they have no computability theory at all. Nobody in the room has heard of program equilibrium. Logistics: one whiteboard, a projector I don't trust, so the session has to survive without displayed code. My aim is narrower than it sounds: by the end they should be able to say what a program equilibrium is, in exactly what sense it is an equilibrium, why it neither dissolves the Prisoner's Dilemma nor leaves it untouched, and why the move from actions to programs raises a question about rational agency rather than just adding a new trick to the toolbox.

  Three complications you should design around. First, our campus has just spent two weeks arguing about students using automated bidding agents in the housing lottery, so everyone will arrive with a live but misleading picture of a program as a delegate or representative that acts on your behalf and has aims of its own; I expect that framing to do real damage and I want to know where to break it. Second, the same students will later in term do a session on multi-player program equilibrium and coalitional deviation, so I want the plan to install the hooks that session needs without covering any of it. Third, I have to tell them openly what I am refusing to cover, and I'd rather name the right two or three omissions than mumble.

  What I want from you:

  1. The order. What has to be in place before what, and what actually breaks if I reorder it — as opposed to what merely feels more natural in another order. In particular: where in the sequence must the moment go at which the object of choice changes from a move to a program, and where must the question of who or what selects the program go?

  2. The carrying example. My candidates are (a) two competing trading bots whose source code is published by the exchange's rules, (b) the program that cooperates if and only if the opponent's source is byte-identical to its own, and (c) a Cold War hotline story in which each side commits a retaliation policy in advance. Pick one, or refuse all three and give me a better one, and say explicitly what properties the example must have and must lack — I assume it must not smuggle in iteration, reputation, cheap talk, or external enforcement, but tell me what else it must be free of, and what the housing-lottery agents do to each candidate.

  3. The misconception map, with the point in the sequence where each should be headed off and the single board move or one-sentence move that heads it off. My guesses at what I'll face: that this is just the Prisoner's Dilemma with complete information, or just cheap talk, so the strategic problem has vanished; its twin, that defection is still available so nothing whatever has changed; the opposite twin, that the dilemma has been solved; that the game must be repeated or the programs must be learning from each other; that a program which does what the other program does is circular and either hangs or has an arbitrary output, and the related thought that a program which cooperates when it can prove the opponent cooperates is circular in the same way; that the programs must be simulating each other all the way down; and that the outcome of two programs is what they print, looping programs included, with a timeout. Also tell me which of these is not a misconception at all but a correct insight I should welcome rather than defuse, and which one my students will raise in an order I haven't anticipated.

  4. A decision I can't make myself: whether to include the provability-based variant in which a program cooperates iff it can prove the opponent cooperates, given that nobody here has seen Löb's theorem. If yes, show me how to do it honestly in five minutes without hand-waving the one step that makes it work. If no, tell me what to put in its place so that the circularity worry is met rather than quietly sidestepped.

  5. The two moments most likely to lose the philosophers and the two most likely to lose the CS students, and what to do at each so that neither half is merely waiting.

  6. A check for understanding that distinguishes getting it from pattern-matching: not restate the definition, but something like a second game, not the Prisoner's Dilemma, where I can see from their answer whether they have the concept or only the slogan. Give me the question, the answer that shows they got it, and one plausible wrong answer together with what it would tell me about where the explanation failed.
reasoning: |-
  We are designing a 75-minute seminar for mixed CS and philosophy students. The goal is to introduce program equilibrium, focusing on the shift from actions to programs, the sense in which it is an equilibrium, why it doesn't simply dissolve the Prisoner's Dilemma, and the implications for rational agency.

  ### Step 1: Dependency Relations and Prerequisites

  **Core Ideas:**
  1. Prisoner's Dilemma (PD): known by all (philosophy students have seen it, CS students can be quickly reminded).
  2. Nash equilibrium: mutual best response (known by philosophy students; CS students can pick it up quickly).
  3. Program: as a choice (not as an agent with its own aims). We must break the "delegate" misconception.
  4. Program equilibrium: mutual best response in the space of programs.
  5. The circularity issue: programs can refer to each other without infinite regress.
  6. The outcome: what the programs output when run (with potential non-termination).

  **Dependencies:**
  - PD must come first as the setting.
  - The shift to programs must come after PD but before program equilibrium.
  - The definition of program equilibrium (mutual best response in the program space) requires understanding that we are now choosing programs, not actions.
  - The circularity issue must be addressed to show that the programs can be written without infinite regress (but without diving into provability logic, unless we choose to include a variant).
  - The outcome of the game (cooperate/defect) must be defined as the output of the programs when they are run. Non-termination must be considered (but we don't need to solve it, just note it).

  **Prerequisites:**
  - Students have:
     - PD: known by philosophy, can be summarized for CS.
     - Nash equilibrium: known by philosophy, can be defined for CS.
     - Basic programming concepts (CS students have, philosophy may not: but we can explain that a program is a set of instructions that may take input and produce output).
  - Students lack:
     - Program equilibrium: new to all.
     - Provability logic: not known by any.

  **Pedagogical Judgments:**
  - The shift from actions to programs is a major conceptual leap. It must be done explicitly and early enough to set the stage.
  - The housing lottery example has framed programs as autonomous agents with their own goals. We must break this by emphasizing that the program is a fixed strategy chosen in advance by the player, and the player's goal is still to maximize their own payoff. The program does not have its own goals.
  - We must avoid iteration, reputation, cheap talk, and external enforcement. The example must be one-shot and without communication.
  - We are not covering multi-player or coalitional deviations, but we must set hooks: note that the program can condition on the opponent's program, which opens the door to considering groups (but we won't go there).

  ### Step 2: The Carrying Example

  **Requirements for the example:**
  - Must be one-shot, no repetition.
  - No communication during the game (no cheap talk).
  - No external enforcement.
  - Must show that the programs are chosen in advance and then run without further input.
  - Must avoid the misconception that the program is an autonomous agent (so not like the housing bots that are actively bidding in an auction).

  **Evaluating candidates:**
  - (a) Trading bots: Might imply ongoing interaction (like in a market) and the bots might be seen as autonomous. Also, trading is typically repeated. Reject.
  - (b) Cooperate iff byte-identical: This is the "clone" program. It works, but it relies on the opponent being identical, which is a very specific case. Also, byte-identity is brittle and not general. However, it is simple and avoids iteration. But note: the housing lottery agents might be seen as similar (they are programs that act for you), so we must break the autonomous agent framing.
  - (c) Cold War hotline: This is a classic example of commitment. Each side commits to a policy (retaliate if attacked). It is one-shot (the policy is set in advance) and the action is taken only if the event occurs. However, in the PD setting, we don't have an external event; we have two players choosing simultaneously. Also, the hotline is about conditional action but in a different game structure.

  **Proposed example: Refine (b) to a more general program? Or use (c) in a PD context?** 

  Alternatively, let's create a new example: 

  **Example: Two programmers in a competition.** 
  Each must submit a program (by the deadline) that will be run against the other's program in a one-shot PD. The programs take as input the source code of the opponent and output either Cooperate or Defect. The payoffs are given by the PD matrix. 

  But note: the housing lottery bots are also submitted in advance. So we must distinguish: in the housing lottery, the bots are acting in a dynamic environment (bidding over time) and might be adaptive. In our PD, the program outputs one action and then stops. 

  We choose: **A modified version of (b) that is more general and less reliant on identity.** 

  Better: Use a program that cooperates if and only if the opponent's program is functionally equivalent to a known cooperator? But that is hard. 

  Alternatively, use the **"FairBot"** from the literature: it cooperates if it can prove that the opponent cooperates (but we are avoiding provability for now). 

  Given the constraints, I propose using the **Cold War hotline story adapted to PD**. 

  **Adapted Cold War example for PD:** 
  Two generals are on either side of a mountain. They must independently decide whether to attack (Defect) or not (Cooperate). If both attack, they both get high casualties (mutual defection payoff). If one attacks and the other doesn't, the attacker wins big (temptation) and the other loses big (sucker). If neither attacks, they both get a moderate payoff (mutual cooperation). 

  Each general must write a policy in advance (a program) that will be executed by a trusted third party. The policy takes as input the entire policy (source code) of the opponent and outputs an action. The trusted third party runs both policies (providing each with the source code of the other) and then carries out the actions. 

  This example: 
  - Avoids iteration (one-shot). 
  - Avoids cheap talk (no communication). 
  - Avoids external enforcement (the third party just runs the programs). 
  - The programs are fixed in advance. 
  - But note: the housing lottery bots are also fixed in advance, so we must emphasize that in this case, the program is a complete strategy that outputs one action and does not have ongoing interactions. 

  We break the autonomous agent misconception by: 
  - Stating clearly that the program is a fixed set of instructions chosen by the player. The player's goal is still to maximize their own payoff. The program does not have its own goals; it is just a tool. 

  **Decision: Use the adapted Cold War example.** 

  ### Step 3: Misconception Map

  We list the misconceptions and when to address them:

  1. **That this is just the Prisoner's Dilemma with complete information, or just cheap talk, so the strategic problem has vanished.**
     - When: After introducing the setup but before showing the equilibrium.
     - How to break: "Note that the programs are chosen simultaneously and in advance. There is no communication during the choice of programs. The strategic problem remains: each player must choose a program without knowing the other's choice."

  2. **That defection is still available so nothing whatever has changed.**
     - When: After defining the program choices and before equilibrium.
     - How to break: "Yes, a player can still choose a program that always defects. But note that if both do that, they get the mutual defection payoff. The point is that there might be other programs that, when both choose them, yield mutual cooperation and are stable (neither can do better by changing their program)."

  3. **That the dilemma has been solved.**
     - When: After showing a program equilibrium that yields mutual cooperation.
     - How to break: "But note: this only works if both players choose such a program. If one player chooses a program that always defects, then the other might get the sucker payoff. So the dilemma is not entirely gone: we still need a way to coordinate on choosing the cooperative programs."

  4. **That the game must be repeated or the programs must be learning from each other.**
     - When: When introducing the program setup.
     - How to break: "This is a one-shot interaction: the programs are run once, and they output one action each. There is no repetition and no learning over time."

  5. **That a program which does what the other program does is circular and either hangs or has an arbitrary output.**
     - When: When presenting the example program that conditions on the opponent's source.
     - How to break: "We are not requiring the program to simulate the opponent and then do the same. Instead, we can write a program that checks a specific property of the opponent's code. For instance, a program that cooperates only if the opponent's program is byte-identical to itself. This program does not need to run the opponent's program; it just does a string comparison."

  6. **That a program which cooperates when it can prove the opponent cooperates is circular in the same way (if we mention the provability variant).**
     - If we include the provability variant, we must address this. But we are not sure yet.

  7. **That the programs must be simulating each other all the way down.**
     - When: When explaining how the programs are run.
     - How to break: "The trusted third party runs each program, providing the opponent's source code as input. The program can read the opponent's code and then output an action without simulating the opponent. For example, it might look for a particular string in the code."

  8. **That the outcome of two programs is what they print, looping programs included, with a timeout.**
     - When: When defining the outcome.
     - How to break: "We assume that the programs are run in a way that they must halt. If a program does not halt, we might assign a default action (like defection) or a very bad payoff. But for simplicity, we'll assume that the programs are written to halt."

  **Which is a correct insight?** 
  - The thought that defection is still available is correct and important. We should welcome it: it shows that program equilibrium doesn't eliminate the possibility of defection, but it does allow for new equilibria.

  **Which might be raised out of order?** 
  - The circularity worry (misconception 5) might come up as soon as we say that the program takes the opponent's source as input. Be prepared to address it early.

  ### Step 4: Provability-Based Variant Decision

  **Decision: Do not include the provability-based variant.** 

  **Reasons:**
  - We have only 75 minutes, and the students have no background in provability logic.
  - Doing it honestly would require explaining Löb's theorem, which is too much in 5 minutes.
  - Without that, it would be hand-waving.

  **Alternative to address circularity:**
  - Use the byte-identical program (or a similar one that avoids simulation). 
  - Also, we can note that in the program equilibrium, the programs do not need to simulate the entire opponent; they can use a proof that the opponent will cooperate without running it by using mathematical reasoning (but we don't go into details). 
  - We can say: "There are ways to write programs that use logical proofs to avoid circularity, but that topic is advanced and we won't cover it today. For now, note that the byte-identical program doesn't have circularity because it does a simple string comparison."

  ### Step 5: Moments Likely to Lose Students

  **Lose philosophers:**
  1. **When we start talking about programs taking source code as input.** Philosophers might not be comfortable with code. 
     - What to do: Use an analogy. "Think of the program as a set of instructions, like a recipe. Each general writes a recipe that says: if the other's recipe looks like this, then do X; if it looks like that, then do Y." 

  2. **When we discuss the program equilibrium as a Nash equilibrium in the program space.** The idea of a strategy space being programs might be abstract.
     - What to do: Draw a parallel to the normal form. "Just as in the normal form we have a matrix of actions and payoffs, here we have a matrix of programs and payoffs. We are looking for a pair of programs such that no player can change their program and get a better payoff given the other's program."

  **Lose CS students:**
  1. **When we spend time on the Prisoner's Dilemma.** They might think it's too simple.
     - What to do: Quickly recap but then move to the twist: "But now, instead of choosing an action, you choose a program that chooses an action based on the opponent's program."

  2. **When we discuss the philosophical implications about rational agency.** They might get impatient with abstract discussion.
     - What to do: Tie it back to the code. "So, what does this mean for how we design autonomous systems? If we are the programmers, how do we ensure that our systems can achieve cooperation without external enforcement?"

  ### Step 6: Check for Understanding

  **Question:** 
  Consider a different game: the Stag Hunt. In Stag Hunt, each player can either hunt a stag (which requires the other to also hunt stag) or hunt a hare (which can be done alone). Hunting stag gives a high payoff if both do it, hunting hare gives a low payoff but is safe. Now, suppose we play Stag Hunt with programs: each player submits a program that takes the opponent's source and outputs either 'stag' or 'hare'. 

  Can there be a program equilibrium in which both players hunt stag? If so, describe what the programs might look like. If not, why not?

  **Answer that shows understanding:**
  Yes, there can be. The programs might be: "If the opponent's program is identical to this one, then output 'stag'; else output 'hare'." (Or any program that hunts stag only if it expects the other to hunt stag, and otherwise hunts hare.) They would form an equilibrium because if both players choose this program, they both hunt stag and get the high payoff. If one player changes to a program that always hunts hare, then when faced with the original program, the original program would output 'hare' (since the programs are not identical) and so the deviating player would get the hare payoff, which is lower than the stag payoff when both cooperate. But note: the deviating player might do better by hunting hare when the other hunts stag? Wait, in the equilibrium, if one player changes to a program that always hunts stag, then the other program (which is still the original) would see that the programs are not identical and output 'hare'. Then the deviating player would get the sucker payoff (hunting stag when the other hunts hare) which is worse. So the original program is a best response to itself.

  Alternatively, a program that hunts stag if the opponent's program is a known cooperator (by some property) and hare otherwise. The key is that the program must condition on the opponent's program in such a way that it hunts stag only when it is sure the opponent will too, and otherwise hunts hare. And in equilibrium, both use the same program and it works.

  **Plausible wrong answer:**
  "The programs both always hunt stag. That's an equilibrium because if both do it, they both get the high payoff, and if one changes to hunting hare, they get less because the other is hunting stag and they only get hare." 

  **Why it's wrong:** 
  This ignores the conditioning. If one player changes to a program that always hunts stag, then when faced with the original program (which always hunts stag), they both hunt stag and the deviator gets the same as before. But actually, the original program (always stag) is not a best response to itself because a player could switch to a program that hunts hare and then get the hare payoff when the other hunts stag, which is better than the stag payoff? Wait, in Stag Hunt, the payoff for hare is usually less than mutual stag but greater than sucker (stag when other hunts hare). 

  Let me recall Stag Hunt payoffs: 
  - Both stag: (3,3)
  - One stag, one hare: stag gets 0 (sucker), hare gets 2
  - Both hare: (2,2)

  So if both programs are "always stag", then if one player switches to "always hare", they get 2 (when the other is still "always stag", so the other hunts stag and this one hunts hare: payoff 2). But 2 is less than 3? So switching is not beneficial. So actually, both "always stag" is a Nash equilibrium in the action space. But in the program space, it is also an equilibrium? 

  But the question is about program equilibrium. The above does not use the program structure. The wrong answer is that they don't use the opponent's source code. They are just fixed actions. The point of program equilibrium is that we can have a program that conditions on the opponent. 

  A better wrong answer: 
  "The programs both look at the opponent and if they see the opponent is going to hunt stag, they hunt stag, else they hunt hare." 

  But then, how do they know what the opponent will do? Without a fixed point, this might lead to circularity. 

  Another wrong answer: 
  "The programs both output 'stag' because they see that the other is going to output 'stag'." 

  But that's circular. 

  **What the wrong answer tells us:**
  If a student gives the "always stag" answer, it shows they haven't understood that the program can condition on the opponent's program. They are still thinking in actions. 

  If a student gives the circular answer, they might have understood the conditioning but not the fixed point issue. 

  ### The Plan

  **Total time: 75 minutes.**

  #### Part 1: Setting the Stage (15 minutes)
  - (2 min) Recap Prisoner's Dilemma (PD): actions, payoffs, dominant strategy, and why mutual defection is the only Nash equilibrium but mutual cooperation is better. 
  - (3 min) Introduce the twist: We now play a game where players choose programs instead of actions. The program takes as input the source code of the opponent's program and outputs an action (C or D). The trusted third party runs the programs and the output actions determine the payoffs. 
  - (5 min) Use the Cold War example to illustrate: two generals writing policies that take the other's policy as input. 
  - (5 min) Break the autonomous agent misconception: "Important: The program is a fixed strategy chosen by the player. The player's goal is to maximize their own payoff. The program does not have its own goals; it is an extension of the player's will." 

  #### Part 2: Program Equilibrium (20 minutes)
  - (5 min) Show that the program "always defect" is still an equilibrium (mutual defection). 
  - (5 min) Introduce a new program: "Cooperate if the opponent's program is byte-identical to this program, else defect." 
  - (5 min) Explain that if both players choose this program, then they are byte-identical, so both cooperate. 
  - (5 min) Argue that it is an equilibrium: if one player changes to another program, then the other (still using the original) will see that the programs are not identical and defect, so the deviator gets defection payoff (or worse, if they cooperate, they get sucker). So deviating doesn't help. 

  #### Part 3: Why the Dilemma is Not Dissolved (10 minutes)
  - (5 min) Discuss: But what if one player chooses "always defect"? Then if the other chooses the conditional program, they get defection (because the programs are not identical) and the defector gets the temptation payoff. So the dilemma is still present: we have two equilibria (mutual defection and mutual cooperation via the conditional program). 
  - (5 min) Emphasize: Program equilibrium doesn't eliminate the dilemma; it adds a new cooperative equilibrium. But we still need coordination to reach it. 

  #### Part 4: Implications for Rational Agency (15 minutes)
  - (5 min) Question: What does it mean to choose a program? In traditional game theory, we choose actions. Now we choose a function from the opponent's program to an action. 
  - (5 min) The shift: The player is not just choosing what to do, but choosing a rule that determines what to do based on the opponent's rule. This is a higher-order choice. 
  - (5 min) Why is this philosophically interesting? It forces us to think about how we can bind our future actions and how we can reason about others' reasoning. 

  #### Part 5: Addressing Misconceptions and Questions (10 minutes)
  - (10 min) Open floor for questions. Be prepared to address the misconceptions listed above. Specifically: 
     - If circularity comes up: "The program we used doesn't run the opponent's program; it does a string comparison. There are ways to avoid circularity without simulation." 
     - If they say the problem is solved: "It's not solved because we still have the risk of defection and the need for coordination." 
     - If they mention iteration: "This is one-shot; the programs are run once." 

  #### Part 6: Check for Understanding (5 minutes)
  - (5 min) Pose the Stag Hunt question (as above). 
  - Listen for: Do they condition on the opponent's program? Do they avoid circularity? 

  #### Omissions (announced at the end of Part 1 or Part 2)
  - "We are not covering: 
     - Multi-player program equilibrium (more than two players). 
     - Coalitional deviations (groups of players changing their programs together). 
     - The provability-based program equilibrium (which uses logical proofs). 
    We'll see some of these later in the term." 

  ### The Order and Critical Points

  **Critical order:**
  - The shift from actions to programs must happen right after the PD recap and before the program equilibrium. (Part 1)
  - The byte-identical program example must come after the shift and before the equilibrium argument. (Part 2)
  - The discussion of who selects the program: at the moment of the shift, emphasize that the player chooses the program in advance, and the program is run by a trusted third party. 

  **What breaks if reordered?**
  - If we try to define program equilibrium before the shift to programs, it won't make sense. 
  - If we discuss the implications for agency before seeing the example, it will be too abstract. 

  **Hooks for later:**
  - Note that the program can condition on the opponent's program. In multi-player settings, it can condition on the entire set of programs. 
  - Also, the idea of a deviation: in the next session, we'll consider deviations by groups. 

  **Final Timing:**
  - Part 1: 15 min
  - Part 2: 20 min
  - Part 3: 10 min
  - Part 4: 15 min
  - Part 5: 10 min (could be used to extend Part 4 if no questions)
  - Part 6: 5 min

  Total: 75 min.
answer: |-
  ### Plan Architecture for 75-Minute Seminar

  #### **Dependency Relations Sketch**
  - **Core ideas in dependency order**:
    1. **Prisoner's Dilemma (PD) recap** → Must precede everything (foundation for payoff structure/dominance).
    2. **Program as choice object** → Must precede equilibrium definition (shifts agency from move to program; breaks if introduced after equilibrium).
    3. **Program execution mechanics** (input: opponent’s source; output: action) → Must precede examples (clarifies how programs interact; breaks if after examples).
    4. **Mutual best response in program space** → Depends on 1–3 (defines program equilibrium; breaks if PD/program-as-choice not established).
    5. **Non-iterated, non-enforced conditional cooperation** → Depends on 2–4 (illustrates equilibrium; breaks if iteration/reputation smuggled in).
    6. **Agency implications** (program as precommitment, not delegate) → Depends on 2–5 (requires seeing program as tool, not agent; breaks if framed earlier).
  - **Prerequisites students have**: 
    - PD payoffs/dominance (all), Nash equilibrium as mutual best response (philosophers), halting/incompleteness (CS).
  - **Pedagogical judgment calls**:
    - **Byte-identical example over Cold War**: Avoids misalignment with housing bots (Cold War implies real-world delegation; byte-identical is code-as-code). 
    - **Defer provability logic**: Replaced with syntactic checks to sidestep circularity without Löb’s theorem. 
    - **Explicit omission announcements**: Early, to preempt scope creep.

  #### **Session Plan**

  **Part 1: Setup and Shifting the Object of Choice (15 min)**  
  - **(0–5 min) PD Recap + Nash Equilibrium**:  
    - *Board*: PD matrix (C/D; payoffs). Ask: "Why is (D,D) the only Nash equilibrium?"  
    - *Flag misconception*: "Defection is dominant" → Correct, but note: *programs change how dominance applies*.  
  - **(5–10 min) Introduce Programs as Choices**:  
    - "Today, you choose *programs*, not actions. A program takes opponent’s source as input, outputs C/D."  
    - *Emphasize*: "You select the program; it has no ‘goals’. It’s a precommitment tool (like a contract), not a delegate. Housing bots *act dynamically*; here, programs run once, then stop."  
    - *Board*: Sketch program execution: `f(g)` → action, `g(f)` → action.  
  - **(10–15 min) Announce Omissions**:  
    - "We omit: multi-player deviations, provability logic, learning/reputation. Focus: two-player, one-shot, no talk."  

  **Part 2: Program Equilibrium via Byte-Identical Example (25 min)**  
  - **(15–20 min) Example Setup**:  
    - *Carrying example*: **Byte-identical program** ("cooperate iff opponent’s source code is identical to mine; else defect").  
    - *Why this example?*  
      - *Must have*: No iteration/enforcement; uses source code as input; no simulation (avoids halting worries).  
      - *Must lack*: Real-world delegation (housing bots feel like "agents" – break by stressing code-as-text).  
      - *Housing-bot damage control*: "Unlike bidding agents, this program doesn’t ‘adapt’ – it’s a fixed rule checked once."  
  - **(20–25 min) Equilibrium Argument**:  
    - *Board*: Payoff matrix for programs: rows = Player 1’s program (e.g., "always D" vs. "byte-identical"), columns = Player 2’s.  
    - Show: If both choose byte-identical → both C → (3,3).  
    - *Misconception break*: "Defection is still available? Yes, but changing to ‘always D’ *when opponent uses byte-identical* gets temptation (5) only if opponent cooperates. But if you change, opponent’s program defects → you get (1, not 5)." (Board: arrow from deviation to opponent’s response.)  
  - **(25–35 min) Why Not Solved?**:  
    - *Board*: Two equilibria: (always D, always D) and (byte-identical, byte-identical).  
    - "Dilemma isn’t dissolved: (always D) is still an equilibrium! Cooperation requires coordination on conditional programs."  

  **Part 3: Circularity and Agency (20 min)**  
  - **(35–40 min) Address Circularity Without Provability**:  
    - *Misconception break*: "Programs don’t simulate each other. Byte-identical does string comparison, not execution. No halting problem – it’s syntactic."  
    - *Alternative to provability*: Use a checksum or hash example. "Cooperate iff opponent’s hash = my hash. No simulation, just computation."  
  - **(40–50 min) Agency Shift Discussion**:  
    - Question: "When you choose a program, what are you choosing? A move (no) or a *rule for responsive action* (yes)?"  
    - *Key point*: "Programs turn ‘what should I do?’ into ‘what reaction rule should I bind myself to?’ – this is *self-constraining rationality*."  
    - *Misconception break*: "Not cheap talk: no messages; programs are binding. Not repetition: one execution."  

  **Part 4: Stakes for Philosophers and CS Students (10 min)**  
  - **Lose philosophers moments**:  
    - (1) *Program syntax discussion* (Part 2): Defuse with "Think of programs as recipes, not code."  
    - (2) *Nash in program space* (Part 2): Defuse with "Like action matrix, but rows/columns are rules, not moves."  
  - **Lose CS students moments**:  
    - (1) *Agency philosophy* (Part 3): Defuse with "In AI design: How do you hardwire cooperation without iteration?"  
    - (2) *PD recap* (Part 1): Defuse with "The twist is coming: programs let you *condition* on the opponent."  
  - **Engagement**: Pair philosophers/CS in ad hoc groups for Part 2 payoff exercise.  

  **Part 5: Check for Understanding (5 min)**  
  - **Question**: "In Stag Hunt (payoffs: Stag/Stag=4, Hare/Hare=3, Stag/Hare=0 for stag-hunter), can there be a program equilibrium where both hunt stag? Describe the programs."  
    - **Correct answer**: "Yes. Program: ‘Hunt stag iff opponent’s program has property P (e.g., hash match); else hare.’ If both use this, they hunt stag and won’t deviate (since deviating causes opponent to hunt hare → you get 0)." → Shows grasp of conditioning without moves.  
    - **Plausible wrong answer**: "Both always hunt stag." → Reveals confusion: thinks programs are just actions. Points to Part 2 failure (didn’t internalize program-as-rule).  
    - **Why it works**: Stag Hunt requires coordination (unlike PD), testing if students see conditioning as tool for assurance.  

  #### **Misconception Map with Breakers**
  | Misconception | When to Break | One-Sentence/Board Breaker |
  |---------------|--------------|----------------------------|
  | "Just complete-info PD" | Part 1 (program intro) | "Programs add *conditioning*, not just info." |
  | "Defection still available/nothing changed" | Part 2 (equilibrium) | "Deviation triggers opponent’s defection → worse payoff." (Board: deviation payoff calc) |
  | "Dilemma solved" | Part 2 (why not solved) | "Two equilibria: cooperative and defective. Still need coordination." |
  | "Must be repeated/learning" | Part 1 (program intro) | "Programs run once, no history." |
  | "Program simulating opponent hangs" | Part 3 (circularity) | "No simulation: byte-identical compares text, doesn’t run code." |
  | "Programs simulate all the way down" | Part 3 (circularity) | "Input is static code, not output." |
  | "Outcome is print output (loops/timeout)" | Part 2 (execution) | "Assume programs halt; non-halting ≈ defect." |
  | **Correct insight**: "Defection still available" | Part 2 (equilibrium) | *Welcome*: "Yes! That’s why (always D) is still an equilibrium." |
  | **Likely out-of-order**: "Circularity in conditioning" | Part 1 (program intro) | Preempt in execution sketch: "Programs read code as text, don’t run it." |

  #### **Critical Order and Judgments**
  - **Program-as-choice shift**: Must be in **Part 1** after PD recap. Breaks if later: students will default to action-based thinking.  
  - **Program selection agency**: Must be in **Part 1** when introducing programs. Breaks if delayed: housing-bot delegation framing sticks.  
  - **Key judgment**: Byte-identical example chosen over Cold War to avoid delegation framing (Cold War feels like real agents; byte-identical is code-as-code).  
  - **Provability decision**: Excluded. **Why**: No Löb’s theorem background; 5-minute honest explanation impossible. **Replacement**: Syntactic checks (hash/byte-identity) to meet circularity worry head-on.  
  - **Hooks for later**: In omission announcement ("We omit multi-player deviations") and byte-identical example ("Conditioning on opponent’s program enables coordination").
