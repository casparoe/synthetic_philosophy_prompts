prompt: |-
  Two people in my decision theory reading group have been going at each other for about a year about acausal trade. One thinks it's a genuine phenomenon that a correct decision theory has to cash out — that you can rationally pay a cost to get a benefit brought about by an agent you will never causally influence. The other thinks the whole literature slides between "my action is evidence of what the other agent does" and "my action makes the other agent do something." They've finally agreed to an adversarial collaboration and I'm the one who has to produce the document.

  Can you draft it? I want a numbered agreed-claims section first, then a disagreements table where each row has a neutral framing plus each side's own wording that they'd actually be willing to sign, then the cruxes.

  For the cruxes I want concrete shared cases rather than the usual twins-in-distant-galaxies setup — please build them around these two:

  - Drift: two civilizations on opposite sides of a cosmological horizon, no causal contact ever possible; each can either spend a large share of its resources encoding its entire scientific corpus into a beacon nobody receives, or spend it on itself. The correlation between their choices runs only through the fact that both had to independently derive the same chunk of mathematics to even describe the option, and it's partial — say the chance their procedures coincide, conditional on both facing the choice, is around 0.7, and both know it.
  - Half-sim: you're either the original or a simulation of yourself whose memory of the last hour was corrupted in a known way; now you choose whether to cooperate with your counterpart, you can't find out which one you are, and you know the corruption makes the sim's choice only weakly correlated with yours.

  For each: is trade rational, roughly where's the threshold in correlation, and what happens as the similarity degrades continuously — with each side's prediction written down in advance. Also flag any dispute you think is merely verbal; I suspect the "is it really trade, does anything actually get exchanged" argument is partly terminological, and maybe part of the "you can't benefit from what you don't cause" one too.
reasoning: |-
  We are drafting an adversarial collaboration document on acausal trade. The structure will be:
  1. Agreed Claims (numbered)
  2. Disagreements Table (each row: neutral framing, then each side's wording they'd sign)
  3. Cruxes: two concrete cases (Drift and Half-sim) with each side's position and predictions.

  First, let's outline the agreed claims. Both sides likely agree on:

  1. **Decision Theory Framework**: We are working within the framework of formal decision theories (e.g., causal decision theory, evidential decision theory, functional decision theory, etc.) and the concept of rationality as maximizing expected utility.

  2. **Impossibility of Causal Influence**: In the scenarios under consideration (like Drift and Half-sim), there is no causal path by which one agent's decision can influence the other's.

  3. **Existence of Correlations**: The agents' decisions may be correlated due to common causes (e.g., shared mathematical derivation in Drift) or shared history (in Half-sim), and this correlation is known to the agents.

  4. **Conditional Probabilities**: Agents can condition their expected utility calculations on their own decision and on the fact that they are in a decision situation. They may also condition on the fact that there is a correlated agent.

  5. **No Clairvoyance**: Agents do not have knowledge of the other agent's actual decision at the time of their own choice.

  Now, the disagreements table. We have two sides:

  - **Side A (Pro-Acausal Trade)**: Believes that acausal trade is a genuine phenomenon and that a correct decision theory must account for it. They argue that in the presence of sufficient correlation, it is rational to choose an action that is costly in isolation because the correlation means that the other agent is likely to do the same, leading to mutual benefit.

  - **Side B (Skeptic)**: Believes that the literature confuses evidential and causal effects. They argue that one's action is only evidence about what the other agent does, but does not cause the other agent to do anything. Hence, they are skeptical that one can rationally pay a cost to get a benefit that is not caused by one's action.

  We frame each disagreement neutrally, then each side's version.

  Disagreement 1: Rationality of paying a cost for an uncaused benefit.

  - Neutral: In scenarios with correlated decision-makers and no causal influence, is it rational for an agent to choose an action that is costly in isolation (i.e., if the other agent does not reciprocate) when the expected utility, accounting for the correlation, is higher than not doing so?

  - Side A: Yes, because the agent's own action provides evidence that the other agent will take a similar action, and the expected benefit from the other agent's action (which is not caused but is correlated) makes the trade rational.

  - Side B: No, because the agent's action does not cause the benefit. The benefit is brought about by the other agent's independent decision, and the agent's action is merely evidence. Paying a cost for evidence is not rational when that evidence does not cause the desired outcome.

  Disagreement 2: The role of decision theory.

  - Neutral: Should a correct decision theory recommend acausal trade in some correlated scenarios?

  - Side A: Yes, a correct decision theory must sometimes recommend acausal trade because it captures the rational response to the correlated decision-making scenario, leading to mutually beneficial outcomes that would otherwise be missed.

  - Side B: No, a correct decision theory should not recommend acausal trade because it confuses evidential and causal reasoning. The agent should only act based on the causal consequences of their actions.

  Now, the cruxes: two cases.

  **Case 1: Drift**

  Scenario: Two civilizations on opposite sides of a cosmological horizon (no causal contact ever possible). Each can either:
  - Spend a large share of resources to encode its entire scientific corpus into a beacon (which nobody will receive) [Action: Beacon]
  - Spend the resources on itself [Action: Self]

  The correlation: The chance that both civilizations choose the same action, conditional on both facing the choice, is about 0.7. This correlation arises because both had to independently derive the same chunk of mathematics to describe the option. Both know this.

  Question: Is it rational for a civilization to choose Beacon? What is the threshold of correlation (if any) for which it becomes rational? What happens as the correlation degrades (continuously)?

  Side A (Pro-Trade) position:
  - Rationality: It is rational to choose Beacon if the correlation is high enough that the expected benefit from the other civilization also choosing Beacon (and thus the agent receiving the benefit of knowing that the beacon is sent, even if not received) outweighs the cost. The benefit might be non-instrumental (e.g., the value of participating in a cosmic exchange of knowledge) or instrumental (if there's a tiny chance the beacon is received, but that's not the main point). The threshold depends on the utilities and the correlation. They might say: Let U(Beacon, Beacon) be the utility when both choose beacon (which includes the cost but also the satisfaction of mutual exchange), U(Beacon, Self) the utility when you choose beacon and they don't (high cost, no benefit), and similarly for others. Then the expected utility of choosing beacon is:
    EU(Beacon) = P(they choose Beacon | I choose Beacon) * U(Beacon, Beacon) + P(they choose Self | I choose Beacon) * U(Beacon, Self)
    Similarly for Self. They would compare EU(Beacon) and EU(Self). Since P(they choose Beacon | I choose Beacon) is 0.7 (if we interpret the 0.7 as the probability of agreement, then P(they choose Beacon | I choose Beacon) = 0.7, and P(they choose Self | I choose Beacon)=0.3). If U(Beacon, Beacon) is high enough relative to the cost, then EU(Beacon) can be greater than EU(Self). They might set a threshold where the correlation must be above, say, 0.5, but it depends on the specific utilities.

  - Degradation: As the correlation degrades (say, from 0.7 down to 0.5), the expected utility of choosing beacon decreases and eventually becomes less than that of choosing self. At very low correlations (e.g., 0.5 or below, depending on utilities), it becomes irrational.

  Side B (Skeptic) position:
  - Rationality: It is not rational to choose Beacon. The choice of Beacon does not cause the other civilization to choose Beacon. The correlation is due to a common cause (the shared mathematical derivation) and is fixed. The agent's choice is only evidence. Therefore, the agent should ignore the correlation when making the decision because it doesn't affect the causal outcome. They would calculate the expected utility without conditioning on their own action for the other's action? Or they might condition on being in the decision situation but not on their own action? They might say: The probability that the other chooses Beacon is fixed, say p, independent of what I do. Then:
    EU(Beacon) = p * U(Beacon, Beacon) + (1-p) * U(Beacon, Self)
    But note: if the correlation is 0.7, then p (the unconditional probability they choose Beacon) might be, say, 0.5 (if symmetric) and then the conditional probability P(they choose Beacon | I choose Beacon) is 0.7. However, Side B would say that the agent should use the unconditional probability because their action doesn't affect the other. They would not condition on their own action. So they would use p (which might be 0.5) and then EU(Beacon) would be lower because U(Beacon, Self) is very bad. Hence, they would never choose Beacon.

    Alternatively, Side B might allow conditioning on the fact that both are in the decision situation and that the correlation exists, but not on the agent's own action. They might say: The agent should use the unconditional probability of the other's action (which is the same regardless of what they do) because their action doesn't cause the other's. So they would set P(they choose Beacon) = p, and then the expected utility of Beacon is based on that p. Since p is fixed and not influenced, and if U(Beacon, Self) is very low, then it's irrational to choose Beacon.

  - Threshold: They would say there is no threshold because the action doesn't cause the outcome. They might only consider causal levers.

  **Case 2: Half-sim**

  Scenario: You are either the original or a simulation of yourself. The simulation's memory of the last hour was corrupted in a known way. You choose whether to cooperate (C) or defect (D) with your counterpart. You don't know which one you are. The corruption makes the sim's choice only weakly correlated with the original's. Specifically, the correlation between your choice and the counterpart's choice is low, say 0.6 (for example). The payoff structure is similar to a one-shot prisoner's dilemma: mutual cooperation is good, mutual defection is bad, and if one cooperates and the other defects, the cooperator gets a very bad outcome and the defector gets a very good one.

  Question: Is it rational to cooperate? Threshold? Degradation?

  Side A (Pro-Trade) position:
  - Rationality: It is rational to cooperate if the correlation is high enough that the expected utility of cooperating is higher than defecting. They condition on their own action: 
    EU(C) = P(they cooperate | I cooperate) * U(C,C) + P(they defect | I cooperate) * U(C,D)
    EU(D) = P(they cooperate | I defect) * U(D,C) + P(they defect | I defect) * U(D,D)

    With a correlation of 0.6, P(they cooperate | I cooperate) might be 0.6, and P(they defect | I cooperate)=0.4. Similarly, P(they defect | I defect) might be 0.6 (so agreement 0.6). Then they would plug in the utilities. In prisoner's dilemma, U(C,C) > U(D,D) > U(C,D) and U(D,C) is the best. But if U(C,C) is much better than the others and the correlation is high enough, EU(C) might exceed EU(D). Threshold: depends on the exact utilities and the correlation. For example, in standard PD, if the correlation is 1, then EU(C) = U(C,C) and EU(D)=U(D,D), so C is better. As correlation drops, EU(C) becomes lower because of the risk of being exploited. At a certain point (maybe around 0.7 or 0.8 in standard PD? but we have weak correlation 0.6) it might not be rational. But for Side A, it can be rational at 0.6 if the utilities are adjusted.

  - Degradation: As correlation decreases, the expected utility of cooperating decreases and eventually becomes less than defecting.

  Side B (Skeptic) position:
  - Rationality: It is not rational to cooperate because your action does not cause the other to cooperate. The correlation is due to the common history and the corruption process. They would say: The probability that the other cooperates is fixed (say p) regardless of what you do. Then:
    EU(C) = p * U(C,C) + (1-p) * U(C,D)
    EU(D) = p * U(D,C) + (1-p) * U(D,D)

    They would use the same p for both. Since p is the same, and in PD, U(D,C) > U(C,C) > U(D,D) > U(C,D), then EU(D) will always be greater than EU(C) because for any p, 
    EU(D) - EU(C) = p*(U(D,C) - U(C,C)) + (1-p)*(U(D,D)-U(C,D)) > 0
    because U(D,C) > U(C,C) and U(D,D) > U(C,D). Therefore, they would always defect.

    Alternatively, if they condition on being in the situation but not on their own action, they might set p to be the probability the other cooperates given the setup. But that p would be the same regardless of their action, so the above holds.

  - Threshold: They would say there is no threshold; defection always dominates.

  **Verbal Disputes**

  We flag two potential verbal disputes:

  1. **Definition of "Trade"**: 
     - Side A might define trade as any mutually beneficial arrangement that occurs due to correlated decisions, even without causation.
     - Side B might define trade as requiring an actual exchange of goods or information, which would require causation. 
     Hence, they might agree on the decision-theoretic recommendation but disagree on whether to call it trade.

  2. **"Benefit from what you don't cause"**:
     - Side A would say that you benefit from the other agent's action, and your action is part of the reason (evidentially) that they take that action, even if you don't cause it.
     - Side B would say that you cannot benefit from what you don't cause because the benefit is not under your control.

     This might be partly terminological: what does it mean to "benefit from" something? If it means the benefit is caused by your action, then by definition Side B is right. But Side A might mean that the benefit is correlated with your action and that you can use that correlation to achieve higher utility.

  Now, we draft the document accordingly.
answer: |-
  ### Adversarial Collaboration Document: Acausal Trade Disputes  
  **Participants:**  
  - **Proponent (P):** Believes acausal trade is a genuine phenomenon that correct decision theories must capture.  
  - **Skeptic (S):** Believes discussions of acausal trade often conflate evidential and causal reasoning, making trade irrational without causation.  
  **Facilitator:** You (document author).  

  ---

  ### 1. Agreed Claims  
  Both parties endorse the following:  
  1. **Decision-Theoretic Framework:** Rational agents maximize expected utility (EU) given their beliefs and available information.  
  2. **No Causal Contact:** In the cases below, no causal interaction (e.g., signaling, physical influence) between agents is possible.  
  3. **Correlation Exists:** Agents’ decisions may be statistically correlated due to shared antecedents (e.g., math derivation, corrupted memory).  
  4. **Knowledge of Setup:** Agents know the structure of the scenario (including payoffs, correlation strength, and impossibility of causal influence).  
  5. **Symmetric Information:** Both agents have identical knowledge about the game and their correlation.  
  6. **No Externally Enforced Commitments:** Agents act independently; no precommitments or binding contracts are possible.  
  7. **Goal of Decision Theory:** A decision theory should prescribe actions that maximize EU without contradictions or self-defeating outcomes.  

  ---

  ### 2. Disagreements Table  
  *Each row states the disagreement neutrally, followed by P’s and S’s signable wording.*  

  | **Neutral Framing**                                                                 | **P’s Wording**                                                                                                                    | **S’s Wording**                                                                                                                      |  
  |-------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------|  
  | **Definition of Rational Trade:** When is it rational to pay a cost for a benefit provided by an uncorrelated agent? | "It is rational to pay a cost if conditional EU (given one’s action) justifies it, as correlation implies mutual benefit *despite* no causation." | "Paying a cost for an uncaused benefit is irrational; correlation is *evidence* of the other’s action, not a lever to affect outcomes." |  
  | **Role of Decision Theory:** Should decision theories recommend actions that leverage acausal correlations? | "A correct decision theory *must* endorse acausal trade in high-correlation cases, as it secures Pareto improvements otherwise unattainable." | "A correct decision theory *must not* endorse acausal trade, as it confuses evidential conditioning with causal efficacy." |  
  | **Source of Correlation Value:** Does the decision-maker’s action *influence* the probability of the other agent’s action? | "My action reveals information about shared antecedents, so conditional probabilities (e.g., P(other | my action)) are valid for EU maximization." | "My action is *screened off* by shared antecedents; only unconditional probabilities (e.g., P(other)) matter, as I cannot shift the other’s state." |  

  ---

  ### 3. Cruxes: Concrete Cases  
  Both parties pre-commit to predictions for two scenarios. Payoffs are in utility units (u), with higher numbers preferred. Correlation (ρ) measures the probability agents choose the *same* action given both face the choice. Degradation tests behavior as ρ → 0.5 (random chance).  

  #### Case 1: Drift  
  **Setup:**  
  - Two civilizations on opposite cosmological horizons (no causal contact ever).  
  - Each chooses:  
    - **Beacon:** Spend 90u to encode science into an unreceivable beacon.  
    - **Self:** Spend 0u (keep resources).  
  - Payoffs:  
    - If both choose **Beacon**: Each gets 100u (net +10u from mutual "exchange").  
    - If one chooses **Beacon** and other **Self**: Beacon-chooser loses 90u; Self-chooser gets 0u.  
    - Both **Self**: Both get 0u.  
  - Correlation: ρ = P(Other chooses same | I choose). Known ρ = 0.7. Arises from shared math derivation.  

  | **Question**                           | **P’s Position**                                                                                                                                 | **S’s Position**                                                                                                                               |  
  |----------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Is Beacon rational?**                | Yes, at ρ ≥ 0.55. EU(Beacon) > EU(Self) since ρ=0.7 implies P(Other Beacon \| I Beacon) = 0.7. EU(Beacon) = (0.7)(10) + (0.3)(-90) = -20u. EU(Self) = (0.7)(0) + (0.3)(0) = 0u. **Net EU gain from Self → Beacon if ρ > 0.9?** No: threshold is ρ > 0.55 (where EU(Beacon) > 0u). | No. EU must use unconditional P(Other Beacon) = 0.5 (since ρ=0.7 and symmetry imply equal base rates). EU(Beacon) = (0.5)(10) + (0.5)(-90) = -40u. EU(Self) = 0u. **Beacon never rational.** |  
  | **Threshold for trade?**               | **ρ > 0.55.** Where EU(Beacon) > EU(Self). Derives from payoff imbalance (losses hurt more than gains help).                                                                 | **No threshold.** Beacon irrational even at ρ=1.0, as causation impossible. EU always uses fixed P(Other Beacon)=0.5.                                                                 |  
  | **Degradation (ρ → 0.5+):**            | As ρ→0.5+, EU(Beacon)→-40u, EU(Self)→0u. Beacon becomes *more irrational*, crossing below EU(Self) at ρ=0.55.                                  | As ρ→0.5+, P(Other Beacon)→0.5. EU(Beacon)→-40u, EU(Self)→0u. **No change in prescription:** Always choose Self.                              |  

  #### Case 2: Half-Sim  
  **Setup:**  
  - You are either Original or Sim (50% prior). Sim’s memory corrupted, weakening choice correlation.  
  - Choose:  
    - **Cooperate (C):** Pay 5u cost to give Other +50u.  
    - **Defect (D):** Pay 0u, give Other 0u.  
  - Payoffs:  
    - Mutual C: Each +45u (net: -5u cost +50u from other = +45u).  
    - Mutual D: Each 0u.  
    - You C, Other D: You -5u, Other 0u.  
    - You D, Other C: You +50u, Other -5u.  
  - Correlation: ρ = P(Other same choice | I choose) = 0.6. Due to shared history/corruption.  

  | **Question**                           | **P’s Position**                                                                                                                                 | **S’s Position**                                                                                                                               |  
  |----------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------|  
  | **Is Cooperate rational?**             | Yes, at ρ ≥ ~0.55. EU(C) = P(Other C \| I C) * 45 + P(Other D \| I C) * (-5). With ρ=0.6, P(Other C \| I C) = 0.6 → EU(C) = (0.6)(45) + (0.4)(-5) = 25u. EU(D) = P(Other C \| I D) * 50 + P(Other D \| I D) * 0. Since ρ=0.6, P(Other D \| I D) = 0.6 → P(Other C \| I D) = 0.4 → EU(D) = (0.4)(50) + (0.6)(0) = 20u. **EU(C) > EU(D) at ρ=0.6.** | No. EU must use P(Other C) = 0.5 (unconditional). EU(C) = (0.5)(45) + (0.5)(-5) = 20u. EU(D) = (0.5)(50) + (0.5)(0) = 25u. **C always irrational** (EU(D) > EU(C)). |  
  | **Threshold for trade?**               | **ρ > ~0.55.** Where EU(C) > EU(D). Depends on payoff asymmetry; here, threshold lower than Drift due to smaller downside risk.                 | **No threshold.** Defect always dominates regardless of ρ, as causation impossible.                                                          |  
  | **Degradation (ρ → 0.5+):**            | As ρ→0.5+, EU(C)→20u, EU(D)→25u. C becomes irrational below ρ≈0.55.                                                                             | As ρ→0.5+, P(Other C)→0.5. EU(C)→20u, EU(D)→25u. **No change:** Always Defect.                                                                |  

  ---

  ### 4. Flagged Verbal Disputes  
  - **"Is It Trade?"**  
    - P: "Trade occurs when agents mutually provide benefits *because* of correlated decisions—no causation needed."  
    - S: "Trade requires *actual exchange* (e.g., resources, data), which demands causation. 'Acausal trade' is a misnomer for coincidence."  
    - **Resolution:** Terminological. Both agree on EU calculations but disagree on labeling. Suggests replacing "trade" with "mutual benefit from correlated decisions" in neutral contexts.  

  - **"Can You Benefit From What You Don’t Cause?"**  
    - P: "Yes—benefits arise from *correlation patterns*, which EU maximization exploits. 'Benefit from' means 'utility gains associated with'."  
    - S: "No—'benefit from' implies causation. Uncaused benefits are luck, not something to *plan for*."  
    - **Resolution:** Partly terminological. P focuses on EU outcomes; S on metaphysical causality. Not central to core rationality dispute.  

  ---

  ### Next Steps  
  This document:  
  - Identifies 5 agreed claims (Section 1).  
  - Clarifies 3 disagreements with signed wording (Section 2).  
  - Tests positions against 2 concrete cases with pre-commit predictions (Section 3).  
  - Flags 2 verbal disputes for deprioritization (Section 4).  

  Proposed workflow:  
  1. **Revise disagreements/cruxes** (1 week): P and S suggest edits to Sections 2–3.  
  2. **Resolve verbal disputes**: Adopt neutral terms (e.g., "acausal mutual benefit") in final draft.  
  3. **Empirical test** (optional): Run Drift/Half-Sim as computational simulations with varying ρ; compare outcomes to EU predictions.  
  4. **Finalize document** for publication or group deliberation.  

  ---  
  *Facilitator’s Notes:*  
  - Key substantive dispute: **Should EU calculations condition on the agent’s own action?** P says yes (evidential decision theory); S says no (only causal levers matter).  
  - Degradation thresholds highlight P’s reliance on correlation strength and S’s flat rejection. Half-Sim’s lower threshold vs. Drift shows P’s sensitivity to payoff risk.  
  - Verbal disputes should not derail focus on Section 3’s testable predictions.
