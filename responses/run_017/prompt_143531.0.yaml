prompt: |-
  Not sure this is the right venue but here goes — I keep noticing the same shape of thing and I'd like to know whether it has a name, or whether I'm just describing three different things as one.

  The shape, as best I can spell it out. Two or more parties are in some competitive situation. Each of them takes a step that costs them something and removes their own future ability to back out: they sign a contract they can't cancel, pre-buy something they can't resell, announce a date in public, hand the decision to somebody else who won't give it back. Crucially nothing about their actual capability improves. The only thing that changes is what the *other* side now believes. And the value of doing it seems to depend almost entirely on doing it first — the one who locks in first gets whatever there is to get (the reputation, the scare, the funding, the credit), and the second one gets nothing, or just ends up stuck. So it isn't a race to build a better thing. It's a race to be the one who got locked in first.

  The bit I find hardest to describe is where the credibility comes from. You can't just tell the other side you can't back out; nobody would believe you. What seems to actually happen is that each side goes and recruits some third party who would punish them for reversing — shareholders, voters, a regulator, a journalist who now has the story — and then the escalation takes the form of shopping around for a harsher audience, because whoever has the nastier audience wins. Everyone involved says privately they'd sign a binding agreement tomorrow, but any pause to sit down and negotiate is exactly the moment the other side can lock in.

  Things I already know about and think this isn't: the burning-your-boats idea from game theory (that's one side doing it once, to make a threat stick, and the point is the threat — here there's often no threat at all, and it's the ordering that matters); the thing where you tie yourself up because your future self will be weak-willed (I don't change my mind; I would reverse this afternoon if I could get away with it); the two-drivers-swerving setup (there you want to *look* committed while keeping the option to swerve — here you have to actually destroy it); and the auction where everyone bids and everyone pays (there's a prize in that one, and the money goes to somebody). I've also come across the phrase 'commitment race' muttered at me at a conference, but I've never managed to find it used for anything, and it implies a finish line, which mine doesn't have.

  So: is there an established concept here, and if the nearest ones only half fit, tell me exactly how mine differs from each and which comes closest. If nothing fits, coin something and define it tightly enough that I can tell a real case from a near miss. And give me a diagnostic — what would I have to observe in the wild to conclude this is what's happening rather than an ordinary capability race or plain positional one-upmanship, and what observation would make me say no, it's just one of the things I listed above? I don't want a label on its own; I want the carving.
reasoning: |-
  Hmm, this user is describing a fascinating strategic pattern they've observed in competitive situations. They've clearly put serious thought into distinguishing it from existing concepts like burning bridges, Ulysses pacts, or chicken games. What stands out is their emphasis on three key elements: mutual irreversible actions, credibility derived from third-party enforcers, and the first-mover advantage being the entire point rather than a side effect.

  The user seems analytically sophisticated - they're not just asking for a label but demanding precise conceptual carving. Their frustration with vague terms like "commitment race" is palpable. I notice they're particularly focused on the mechanism where credibility isn't about self-binding but about recruiting external punishers, and how the competition escalates through finding progressively harsher audiences.

  What they're describing feels like a hybrid between an arms race and a preemption game, but with unique twists. The irreversible actions aren't about building capability but about removing exit options, and the reward is purely about being perceived as the first to commit. The shareholder/journalist/voter examples suggest this happens in institutional contexts where accountability structures exist to punish reversals.

  For differentiation, I need to emphasize three diagnostic criteria: (1) the asymmetric payoff where only the first-mover gains reputation/scare/credit while later movers get penalized, (2) the active recruitment of external enforcers rather than just self-binding, and (3) the fact that capability remains unchanged - it's all about perception management. A key test case would be observing whether parties continue escalation even when mutual agreement would benefit everyone, simply because pausing to negotiate creates first-mover opportunities.

  The term "punishment-pact race" seems fitting - it captures the competitive recruitment of enforcers and the irreversible nature. But more important than naming is specifying the boundary conditions: if there's any capability enhancement, it's not this; if reversibility remains possible, it's not this; if second-movers can still gain, it's not this.
answer: |-
  Based on your precise description, you've identified a distinct strategic phenomenon that doesn't map cleanly onto a single established concept, but combines elements in a novel and insightful way. Let's carve it out:

  **The Core Concept: Punishment-Pact Preemption Race**

  **Definition:** A competitive dynamic where rivals irreversibly eliminate their own exit options *not* primarily to enhance capabilities, but to credibly signal commitment *to third-party enforcers*. This forces observers (investors, regulators, the public, etc.) to perceive them as the inevitable winner/first-mover, thereby capturing reputation, resources, or positional advantage solely through the *act of being first to lock in*. The value derives entirely from the *sequence and irreversibility*, creating a winner-take-all race where the second mover gains no strategic benefit and often incurs pure cost.

  **Key Distinctions from Existing Concepts:**

  1.  **Burning Bridges / Self-Binding Commitment (Game Theory):**
      *   *Your Concept:* **Multi-party & Reciprocal.** Involves *all* rivals performing irreversible actions in sequence. The focus is on **forcing observers to *perceive* a winner**, not deterring a specific threat. The *first-mover advantage* is the core prize.
      *   *Distinction:* Burning bridges is typically unilateral (one actor) and aimed at making a *specific threat credible to a specific opponent* (e.g., "I can't retreat, so you must surrender"). Here, it's multilateral, aimed at *observers*, and the "win" is the *perception* itself, not the outcome threatened.

  2.  **Ulysses Pact (Self-Control):**
      *   *Your Concept:* **No Change in Preference/Willpower.** Actors *want* to reverse the action but *cannot* due to external punishment, not internal weakness. The commitment is externally enforced punishment for reversal.
      *   *Distinction:* Ulysses pacts are about binding one's *future self* against *changing preferences*. Here, preferences remain constant; reversal is blocked by *external sanctions*, not internal resolve.

  3.  **Chicken Game / Brinkmanship:**
      *   *Your Concept:* **Destruction of Option is Required, Not Bluffing.** In Chicken, the ideal is to *appear* committed while secretly retaining the option to swerve. Here, **the option *must* be genuinely destroyed** to recruit the third-party enforcer. Bluffing fails because observers need proof (the irreversible act).
      *   *Distinction:* Chicken focuses on mutual risk of catastrophic collision and the value of *appearing* crazy/committed. Here, the focus is on **securing a *positive* reward (reputation, funding) via verified first-mover status** achieved through irreversible action, with the *secondary* threat being the cost of being second.

  4.  **Preemption Race / First-Mover Advantage:**
      *   *Your Concept:* **No Capability Enhancement.** Traditional preemption involves racing to build/buy/deploy something *better or faster* (e.g., patent race, land grab). Here, **capability is unchanged.** The action *only* removes the exit option and signals commitment to observers. The "first" is defined solely by who locks in *first*.
      *   *Distinction:* The "thing" being raced for isn't a product, market share, or resource *per se*, but the **symbolic status of being the "inevitable" or "committed" party** as judged by key observers/enforcers.

  5.  **All-Pay Auctions:**
      *   *Your Concept:* **Asymmetric Payoff Based on Order.** In all-pay, *all* bidders pay their bid, but only *one* wins the prize. Here, **only the *first* to lock in gains the positive payoff.** The second (and subsequent) lock themselves in *at cost* but gain *no* equivalent prize or status; they get stuck with the cost and no benefit. The "prize" is only awarded for first place.
      *   *Distinction:* The cost is paid *sequentially* based on who acts first, and the "prize" (reputation/scare/funding) is inherently asymmetric, accruing only to the very first mover. Later movers don't just lose the auction; they pay a cost for nothing.

  **Diagnostic Criteria: Is it a Punishment-Pact Preemption Race?**

  **Observe these to confirm YES:**

  1.  **Irreversible Action as Core Move:** Participants take costly, verifiable actions that *eliminate their own future flexibility* (signing unbreakable contracts, public announcements with reputational fallout, pre-paying non-refundable costs, delegating irrevocable authority).
  2.  **No Capability Change:** The action demonstrably **does not improve** the actor's ability to compete or deliver on the underlying goal. Its only function is to remove an option and signal.
  3.  **Recruitment of Third-Party Enforcer:** The credibility comes **explicitly from binding oneself to an external entity** (market, regulator, media, shareholders, voters) that will inflict significant punishment (financial, reputational, legal) for reversal. The "harsher audience" escalation is key.
  4.  **Asymmetric Winner-Take-All (First-Mover):** The primary or sole benefit (reputation for commitment, scare factor, funding, credit) **accrues only to the actor who locks in *first***. Followers gain little or nothing positive and are often left locked in at a net cost.
  5.  **Mutual Desire for Agreement, But Fear of Preemption:** Parties acknowledge privately that mutual coordination would be preferable, but any pause is seen as an opportunity for the *other* side to lock in first and capture the advantage. The race dynamic prevents negotiation.

  **Observe these to conclude NO (it's something else):**

  1.  **Capability Enhancement Observed:** If the irreversible action demonstrably *improves* the actor's ability to compete/build/deliver (e.g., pre-buying essential scarce materials, securing key permits), it's likely a **traditional Preemption Race or Capability Investment**.
  2.  **Reversibility Remains (or Bluff is Core):** If actors retain a realistic exit option (even if costly) and the game revolves around *appearing* committed while keeping it, it's **Brinkmanship/Chicken**.
  3.  **Threat Deterrence is Primary Goal:** If the irreversible action is clearly aimed at convincing a *specific opponent* to back down from a *specific, imminent threat*, it's **Burning Bridges/Self-Binding Commitment**.
  4.  **Benefit for Multiple Actors:** If multiple actors performing the irreversible action gain *some* positive benefit (e.g., all bidders signal strength even if they lose, industry-wide standard setting), it's closer to an **All-Pay Auction** or **Coordination Game with Costs**.
  5.  **Internal Commitment Mechanism:** If the irreversible action is primarily about overcoming an actor's *own* anticipated future weakness of will (e.g., setting up automatic savings), it's a **Ulysses Pact**.

  **Real-World Examples vs. Near Misses:**

  *   **YES:** Two tech startups racing to announce a firm, non-refundable launch date for a similar product to the same trade press. Neither speeds up development. The first announcement garners all the buzz and investor interest. The second is seen as a me-too, locked into a costly launch with no advantage.
  *   **NO (Preemption Race):** Two miners racing to physically stake claims on land. The irreversible action *does* secure the resource (capability enhancement).
  *   **NO (Brinkmanship):** Two nations mobilizing troops on a border. While costly and signaling, the *option* to stand down remains, and the goal is deterring the *other side's* specific action.

  **Why "Punishment-Pact Preemption Race"?**

  *   **Punishment-Pact:** Highlights the core mechanism: binding oneself to an *external enforcer* who will punish reversal.
  *   **Preemption:** Emphasizes the critical *first-mover advantage* as the goal.
  *   **Race:** Captures the dynamic, sequential, competitive escalation where speed is paramount and hesitation is fatal.

  Your observation carves out a specific and potent dynamic where competition shifts from building better capabilities to racing to be the first to *irrevocably appear committed* in the eyes of powerful third parties. The winner captures perception-based rewards, while the losers pay costs for nothing tangible. This is distinct from the concepts you mentioned and deserves its own label.
