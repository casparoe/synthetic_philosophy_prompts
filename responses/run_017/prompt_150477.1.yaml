answer: |-
  Below is a diagnostic decision tree for distributive ethics views, designed to address the levelling-down objection and your specified cases. It starts from concrete scenarios and branches into named positions, with empty branches diagnosed. The tree has **9 branch nodes** and **10 leaves** (including one "unnamed" position). Each node is a self-contained question answerable without theory knowledge. Empty branches are marked and explained.

  ---

  ### **Decision Tree: Distributive Ethics Taxonomy**

  **Node 1: In a deterministic choice, would you reduce inequality *even if it literally helps no one and harms no one*? (e.g., blinding the sighted to match the blind)**  
  - **Yes** → Go to Node 2.  
  - **No** → Go to Node 5.  

  **Node 2: Is the badness of inequality grounded in *unfair social relationships* (e.g., domination, stigma) rather than brute luck or responsibility?**  
  - **Yes** → **Leaf: Relational Egalitarianism** (Equality as a condition for just social relations).  
  - **No** → Go to Node 3.  

  **Node 3: In the *top-addition case*: Adding a very happy person to the world (or giving a bonus to the top) makes the distribution more unequal but benefits someone and harms no one. Is this change *all-things-considered bad*?**  
  - **Yes** → **Leaf: Telic Egalitarianism** (Equality is an intrinsic good; bites the bullet on levelling down).  
  - **No** → Go to Node 4.  

  **Node 4: In the *intra-personal levelling down case*: For one person, is it better to remove goods from their best years to prevent terrible years (e.g., reducing 10 great years to avoid 1 awful year)?**  
  - **Yes** → **Leaf: Prioritarianism + Equality Term** (Hybrid: weights absolute disadvantage but adds equality as a separate goal).  
  - **No** → ***Empty Branch***.  
    - *Diagnosis: Incoherent*. If equality is non-relational (Node 2=No), rejecting intra-personal levelling down implies the badness is interpersonal, yet you denied telic egalitarianism’s core claim (Node 3=No).  

  **Node 5: Does the moral weight of aiding someone depend *only* on their absolute well-being level (e.g., 10 units of benefit matter more to a starving person than a millionaire)?**  
  - **Yes** → Go to Node 6.  
  - **No** → **Leaf: Unweighted Beneficence** (e.g., utilitarianism; only total well-being matters).  

  **Node 6: Is the moral urgency of helping someone discontinuous at a *threshold* (e.g., poverty line), not continuous?**  
  - **Yes** → **Leaf: Sufficientarianism** (Priority to those below a threshold).  
  - **No** → Go to Node 7.  

  **Node 7: In a conflict where you can save either Group A (1 very badly off person) or Group B (10 moderately badly off people), must you use a *weighted lottery* (e.g., Group A gets higher odds proportional to their disadvantage)?**  
  - **Yes** → **Leaf: Competing-Claims View** (Claims weighted by disadvantage; fairness requires lottery).  
  - **No** → Go to Node 8.  

  **Node 8: Does the *number of people* on each side change what you ought to do? (e.g., saving 10 moderately off > saving 1 very badly off?)**  
  - **Yes** → **Leaf: Plain Prioritarianism** (Weighted benefits; numbers matter via aggregation).  
  - **No** → Go to Node 9.  

  **Node 9: Under *uncertainty* (no one knows their future position), would you still prioritize the worst off *as if their disadvantage were certain*?**  
  - **Yes** → **Leaf: Egalitarianism as Deontic Constraint** (Equality as a fairness obligation, not a goal).  
  - **No** → **Leaf: Unnamed Position** (Rejects aggregation/equality; no existing view defends this).  
    - *Diagnosis: Unattractive*. Prioritizing the worst off only when certain ignores the moral relevance of risk and ex ante fairness.  

  ---

  ### **Leaf Summaries**
  1. **Telic Egalitarianism**: Inequality intrinsically bad; accepts levelling down.  
     - Top-addition: Bad (may decline to create happy person).  
     - Intra-personal: No (interpersonal only).  
  2. **Relational Egalitarianism**: Inequality bad only if it causes oppressive relations.  
     - Top-addition: Not bad (if no social harm).  
     - Intra-personal: No (irrelevant to social relations).  
  3. **Prioritarianism + Equality Term**: Weights absolute disadvantage + equality as separate goal.  
     - Top-addition: Bad (due to equality term).  
     - Intra-personal: Yes (prioritarianism dominates).  
  4. **Sufficientarianism**: Priority to those below a threshold.  
     - Top-addition: Not bad (if no one below threshold).  
     - Intra-personal: Yes (if awful year below threshold).  
  5. **Competing-Claims View**: Claims weighted by disadvantage; resolve conflicts via lottery.  
     - Top-addition: Not bad (no conflict of claims).  
     - Intra-personal: N/A (single person, no competing claims).  
  6. **Plain Prioritarianism**: Benefits to worse off matter more; aggregates across people.  
     - Top-addition: Good (adds weighted well-being).  
     - Intra-personal: Yes (lifetime weighted well-being).  
  7. **Egalitarianism as Deontic Constraint**: Equality as fairness obligation, not goal.  
     - Top-addition: Not bad (no one wronged).  
     - Intra-personal: No (constraint applies between persons).  
  8. **Unweighted Beneficence**: Maximize total well-being; no weighting.  
     - Top-addition: Good (increases total).  
     - Intra-personal: No (reduces total).  
  9. **Unnamed Position**: Prioritizes worst off only under certainty.  
     - Top-addition: Ambiguous (no clear default).  
     - Intra-personal: Ambiguous.  
  10. **Unweighted Beneficence**: See above.  

  ---

  ### **Quiz: 10 Questions to Diagnose Your View**
  Answer **Yes (Y)** or **No (N)**. Scoring key below.

  1. Blinding the sighted to match the blind is morally required if it reduces inequality and harms/wrongs no one.  
  2. Inequality is bad only if it creates oppressive social hierarchies (e.g., stigma, domination).  
  3. Adding a very happy person to the world (top-addition) is all-things-considered bad due to increased inequality.  
  4. For one person, it’s better to remove goods from great years to prevent awful years (intra-personal levelling down).  
  5. A benefit (e.g., $100) matters more morally if given to a starving person than a millionaire.  
  6. Helping people below a "sufficiency threshold" (e.g., poverty line) is infinitely more urgent than helping those above it.  
  7. In a conflict, saving 1 very badly off person requires a lottery even if saving 10 moderately off people would do more total good.  
  8. Saving 10 moderately badly off people is better than saving 1 very badly off person.  
  9. Under uncertainty (veil of ignorance), we should prioritize the worst off exactly as if their disadvantage were certain.  
  10. The number of people affected always matters (e.g., saving 100 mildly off > saving 1 severely off).

  ---

  ### **Scoring Key**
  Match your answers to the leaves:  
  | Leaf                          | Answers (1-10)                               |  
  |-------------------------------|----------------------------------------------|  
  | Telic Egalitarianism          | Y, N, Y, N, -, -, -, -, -, -                |  
  | Relational Egalitarianism     | Y, Y, N, N, -, -, -, -, -, -                |  
  | Prioritarianism + Equality    | Y, N, Y, Y, Y, N, N, Y, -, -                |  
  | Sufficientarianism            | N, -, -, -, Y, Y, N, Y, -, Y                |  
  | Competing-Claims View         | N, -, -, -, Y, N, Y, N, -, N                |  
  | Plain Prioritarianism         | N, -, -, -, Y, N, N, Y, -, Y                |  
  | Deontic Egalitarianism        | N, -, -, -, N, -, -, N, Y, -                |  
  | Unweighted Beneficence        | N, -, -, -, N, N, N, Y, -, Y                |  
  | Unnamed Position              | N, -, -, -, Y, N, N, N, N, -                |  

  **How to use**:  
  - Start with Q1: If Y, check leaves with Y in Q1 (Telic, Relational, Prioritarianism+). If N, check leaves with N (others).  
  - Proceed to Q2 if needed, and so on. "-" = irrelevant for branching.  

  **Key Insights**:  
  - **Intra-personal levelling down** separates views that care about distribution within a life (e.g., prioritarianism) from purely interpersonal views (e.g., egalitarianisms).  
  - **Top-addition** forces telic views to accept "levelling down by omission," while others permit it.  
  - **Uncertainty** (Q9) isolates deontic egalitarianism (prioritizes worst off even behind the veil) from prioritarianism (weights ex ante expectations).  
  - **Weighted lottery** (Q7) distinguishes competing-claims from plain prioritarianism.  

  **Empty Branches**:  
  - Node 4 (No): Incoherent, as explained.  
  - *Other combinations* (e.g., prioritizing worst off only under certainty) are unexplored or unattractive.  

  This tree covers your cases, isolates key distinctions, and avoids forcing separations where none exist (e.g., weighted lottery vs. prioritarianism is cleanly split by Node 7).
