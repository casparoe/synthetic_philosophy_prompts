prompt: |-
  I am marking a mid-term for a final-year applied ethics course and want an independent read on one answer before finalising the marks. The question (which I set) and one student's response are reproduced below.

  **Question 4 (25 marks).** Consider a visitor who is in a city for a single afternoon, will never return, and whose conduct no one there will be able to identify as an outsider's. In this city: restaurant bills include service, and leaving a tip is widely taken to imply that the server depends on the customer's charity; people form a queue at bus stops and board in order of arrival; and pedestrians cross where and when they please, with drivers forming their expectations accordingly.

  In your answer:

  (a) State the account of "convention" you are working with. (The course used the standard one: a pattern of behaviour that is arbitrary among the available alternatives, and is sustained because each person prefers to conform conditionally on others' conforming.)

  (b) Defend either (i) the claim that the existence of these conventions gives the visitor a moral reason to conform that she would not otherwise have had, or (ii) the denial of that claim.

  (c) Say whether your answer is the same for all three practices, and explain why or why not.

  (d) Reply to the objection that, since no single person's conforming makes a difference to whether a convention persists, the visitor cannot owe conformity to anyone.

  **Student's answer**

  I defend (ii).

  (a) A convention is a self-reproducing pattern of behaviour: arbitrary among the alternatives once we ask which rule would be best, but stable once it is in place, because each person does best by conforming given that the others conform, and that is what keeps it going. Two things follow. First, conventions are facts about expectations, and facts about expectations are not by themselves normative: that a great many people expect me to tip, to queue or to wait at the light is not yet a reason for me to do any of those things. Second, the arbitrariness of the rule's content is not what stops it from binding me. Given that others conform, conforming is usually what I have most reason to do; the fact that a different rule would have been equally workable does not show that I may ignore this one. So I rest nothing on arbitrariness.

  (b) If the convention as such gives no reason, the reason has to come from somewhere else, and the only candidate is the effect of my action on people's interests. Frustrated expectations are not themselves a harm; they matter only where someone is made worse off. My test is therefore: does non-conformity set back anyone's interests?

  (c) The test gives different results across the three cases, but not because they are different kinds of convention — only because the interest-effects differ.

  *Tipping.* Leaving money would give the server more than she is owed, and would not set back her interests. But it would offend her, and it would put pressure on a wage arrangement this city has chosen. That is a real setback, so the visitor should not tip — though the reason is the offence and the pressure, not the convention.

  *Queueing.* Here the convention does bind, again not as such: the people already waiting have given up time and taken up places, and if I push in they lose a place they would otherwise have had. Because identifiable people are made worse off, the visitor must queue. Where the bus is half empty and no one loses a place, nothing is at stake and the convention is inert. That is a consequence of the test, not a difficulty for it.

  *Jaywalking.* Crossing mid-block sets back no one's interests, since drivers expect it; waiting at the lights sets back no one's interests either, since it merely delays the visitor herself. This convention is morally inert and the visitor may do either.

  (d) I accept the objection, and it supports my conclusion. A convention persists because most people conform, and one visitor's act cannot change that; she cannot owe conformity to a practice her own conduct cannot affect. What she owes is not conformity but regard for interests. This also explains why her being an outsider, and never returning, is beside the point: it is not membership but effects on interests that do the work.

  **What I want from you.** Assign a mark out of 25 and justify it point by point: say what the answer gets right and deserves credit for, identify any step that fails or any position it misdescribes and explain exactly where and why it goes wrong, separate the serious problems from the merely cosmetic ones, and state what the answer would have had to do to be worth full marks. Please also say explicitly whether you think the two failures you take to be most serious are independent of one another or whether one generates the other. Do not rewrite the answer — I want the assessment, not a model response.
reasoning: |-
  Okay, I need to carefully assess this applied ethics exam answer. The student is defending position (ii) - that conventions don't inherently create moral obligations - and applying it to three scenarios. Let me break this down point by point.

  First, the convention definition in part (a) is well-handled. The student accurately captures the course's standard view that conventions are arbitrary but self-sustaining patterns. They make two important clarifications: that expectations aren't inherently normative, and that arbitrariness doesn't automatically invalidate reasons to conform. This shows good conceptual understanding.

  For part (b), the core argument is that moral reasons must stem from interest-affection rather than convention itself. The "set back interests" test is reasonable, though slightly reductive. The student deserves credit for clearly establishing this consequentialist framework.

  When applying the test in part (c):
  - The tipping analysis is strong - correctly identifying offense and wage pressure as harms
  - Queueing is well handled with the "identifiable victims" argument
  - But jaywalking reveals the first major flaw. The student assumes drivers perfectly anticipate pedestrians, ignoring how unpredictable behavior could cause accidents even with expectations. This misses a key harm possibility.

  Part (d) correctly concedes that individual conformity doesn't sustain conventions, but then overextends this to dismiss all obligation. The deeper issue is failing to recognize convention's role in coordinating expectations to prevent harm - which is precisely relevant in the jaywalking case.

  These two flaws are connected: the reductive "set back interests" test (which ignores preventive coordination) enables the jaywalking error. The student would need to either refine their harm principle to include risk prevention, or acknowledge convention's instrumental value in harm reduction.

  For full marks, addressing the risk element in jaywalking and explaining convention's coordination function would be crucial. The current answer shows excellent structure and conceptual grasp but has these substantive gaps in application and theory.
answer: |-
  ### Mark: 18/25  
  **Breakdown by Section:**  

  #### **(a) Convention Definition (4/5)**  
  - **Strengths:** Correctly captures the core elements of the course’s account: arbitrariness, conditional preference for conformity, and self-sustaining stability. The distinction between expectations and normativity is astute and shows conceptual clarity.  
  - **Weaknesses:** Slightly overemphasizes "self-reproduction" (a consequence, not a defining feature) and could explicitly tie "does best by conforming" to the course’s phrasing of "prefers to conform conditionally."  
  - **Credit:** Full marks for substance; minor deduction for stylistic imprecision relative to the course’s wording.  

  #### **(b) Defense of (ii) – Core Argument (5/6)**  
  - **Strengths:** Clear, coherent rationale for denying inherent moral force to conventions. Correctly roots moral reasons in interest-affection (harm/benefit) rather than convention qua convention. The "set back interests" test is a logically sound consequentialist criterion.  
  - **Weaknesses:** Does not address *why* conventions cannot *generate* new reasons (e.g., by creating legitimate expectations or relational duties). Slightly reductive in assuming all moral reasons reduce to interest-setback without acknowledging potential deontological nuances (e.g., fairness).  
  - **Credit:** Strong foundation but loses one point for incompleteness in anticipating counterarguments.  

  #### **(c) Application to Three Practices (6/9)**  
  - **Tipping (3/3):** Excellent. Correctly identifies offense and systemic wage pressure as harms (not mere convention). Distinguishes convention from actual moral reasons.  
  - **Queueing (3/3):** Persuasive. Recognizes queuing creates vested claims (e.g., time investment), so non-conformity harms identifiable individuals. Handles edge cases (empty bus) well.  
  - **Jaywalking (0/3):** **Serious flaw.** Assumes drivers’ expectations eliminate all risk, ignoring that unpredictable behavior (even if expected) can increase collective risk (e.g., forcing sudden braking, causing rear-end collisions). Fails to consider how conventions *coordinate behavior to prevent harm*. Non-conformity here *could* setback interests (safety) by undermining predictable coordination.  
  - **Cross-Case Consistency (N/A):** Correctly notes differences stem from interest-effects, not convention-type, but jaywalking error undermines this.  

  #### **(d) Reply to Objection (3/5)**  
  - **Strengths:** Correctly concedes individual conformity doesn’t sustain conventions and smartly notes outsider-status is irrelevant to interest-based duties. The shift from "owing conformity" to "regard for interests" is well-argued.  
  - **Weaknesses:** **Serious flaw:** Ignores how conventions *enable coordination that reduces harm*. Even if one act doesn’t change a convention, violating it can directly harm others *by exploiting the convention’s stability* (e.g., jaywalking increases accident risk precisely because drivers rely on pedestrian patterns). The reply dismisses convention’s instrumental role in protecting interests.  

  ---  

  ### **Overall Assessment**  
  - **Key Strengths:**  
    - Logically structured, philosophically consistent defense of (ii).  
    - Excellent handling of tipping/queueing via interest-based reasoning.  
    - Nuanced understanding of convention’s arbitrariness/non-normativity (part a).  
    - Effective rebuttal of "membership" relevance (part d).  

  - **Most Serious Failures (Interdependent):**  
    1. **Jaywalking Misanalysis (c):** Assumes expectations nullify all risk, neglecting how conventions *minimize harm through predictability*.  
    2. **Coordination Blindness (d):** Dismisses convention’s role in harm-prevention, reducing obligations *only* to direct interest-setback.  
    - **Interdependence:** The jaywalking error **generates** the reply’s flaw in (d). By assuming jaywalking has no interest-effects, the student overlooks how conventions function as harm-reduction tools. This then undermines their reply to the "no difference" objection, as they ignore that violating conventions *can* directly harm others *because* of the coordination they provide.  

  - **Cosmetic Issues:**  
    - Minor wording deviations from course material (e.g., "does best by conforming" vs. "prefers to conform conditionally").  
    - "Self-reproducing" slightly overstates convention mechanics but is harmless.  

  - **For Full Marks (25), the Answer Would Need to:**  
    - Address jaywalking’s potential to increase risk despite expectations (e.g., via unpredictability undermining driver-pedestrian coordination).  
    - In (d), acknowledge that conventions can create moral reasons *instrumentally* by facilitating coordination that protects interests (e.g., safety, efficiency), even if individual acts don’t alter the convention.  
    - Briefly engage counterarguments on fairness/exploitation (e.g., free-riding on others’ conformity).  

  **Final Note:** Despite flaws, this is a sophisticated answer. The jaywalking/coordination oversight is significant but confined; elsewhere, it demonstrates exceptional clarity and applied reasoning. 18/25 reflects high competence with room for deeper systemic analysis.
