prompt: |-
  I run a monthly methods club at the health economics consultancy where I work: about a dozen analysts, most with an MPH or a health-economics master's, all of them fluent in QALYs, Markov models, cost-effectiveness acceptability curves and probabilistic sensitivity analysis, but none of them with any formal social choice theory. Next month we are doing a session on equity weighting, and I have one fifty-minute slot this week to get Harsanyi's aggregation theorem in front of them first. I don't need the result explained to me; I need a plan for explaining it to them.

  The part I most want help with is the sequence. My draft is: define von Neumann–Morgenstern utility, state the Pareto condition, state the conclusion that social welfare is a weighted sum of individual expected utilities, and then say that this is why utilitarian cost-benefit analysis has a claim on us. I'm fairly confident that last move is where I go wrong, but I can't say exactly how: I suspect the weights are doing more work than I will be admitting, and that using the word utilitarian in front of this group will have them nodding at something they would reject if they saw the premises written out. There are also two things I'd rather the plan be honest about than paper over. I have seen the theorem stated with only unanimity-of-indifference as the Pareto premise and also with full unanimous preference, and I can't tell whether the stronger premise is what rules out negative weights or whether it does some other work entirely. And I keep encountering what looks like a second Harsanyi argument built around an impartial observer who imagines an equal chance of turning out to be anyone; I don't know whether that is the same result in different packaging or a genuinely different argument with different inputs, and if it is the latter I'd like to flag the difference in one sentence rather than let the group conflate them.

  So please give me the order the components have to go in, with what depends on what. My own instinct is that the distinction between ranking sure social states and ranking lotteries over social states has to be in place before the theorem is even stated, or the whole ex ante versus ex post business will be invisible to them, but tell me where it belongs and what breaks if it arrives later. Then the carrying example: I want one case to do the work of the whole session, ideally in our idiom, say two candidates for a single remaining dose or a single program slot, and I want you to say what such a case must contain, whether that means a coin-flip option, or asymmetric stakes, or enough structure that we can actually compute the sums by hand at the whiteboard, and also what it must not contain, because my worry is that if the stakes are monetary my analysts will silently read utility as willingness to pay, and if the number or the identity of the people varies across options we will be arguing about population ethics by minute ten and never get back. On misconceptions, here is my list and I want yours: that the theorem vindicates the cost-effectiveness analyses they already run; that QALYs are the utility functions being summed, so that adding them across patients is licensed by it; and that summing implies equal concern for everyone. One colleague who has read a little Sen will at some point announce that utilitarianism is indifferent to distribution, and I want that to land as something the group can watch fall out of the result rather than as a slogan, so tell me where in the sequence to place it. Relatedly, I have been told that the theorem cannot even represent a strict social preference for flipping a fair coin over handing the good to one identified person, and that this is at the heart of the standard objection to it; I cannot reconstruct the argument and would need it in a form I can put on a whiteboard in two minutes. Finally, give me one question to put to them at the end that will show me whether the idea has actually landed rather than merely been endured, and an explicit list of what I should refuse to go into at this level and say out loud that I am refusing; I assume the proof itself is on that list, but tell me what else.
reasoning: |-
  We are preparing a 50-minute session on Harsanyi's Aggregation Theorem for a group of health economists familiar with QALYs, Markov models, etc., but without formal social choice background. The goal is to set up equity weighting by introducing Harsanyi's result, while avoiding common pitfalls.

  Key issues to address:
  1. Sequence of components: VNM utility, Pareto condition, conclusion (social welfare as weighted sum of individual expected utilities), and then the connection to utilitarian cost-benefit analysis (with caveats about weights and the term "utilitarian").
  2. Two versions of Pareto: unanimity of indifference vs. full unanimous preference, and which one rules out negative weights.
  3. The impartial observer argument: how it relates to the aggregation theorem.
  4. The ex ante vs. ex post distinction: must be introduced early.
  5. A single carrying example: must include lotteries (to show the need for VNM), avoid monetary stakes (to prevent confusion with WTP), avoid varying population, and be computable by hand.
  6. Misconceptions to address:
     - That the theorem directly vindicates their current cost-effectiveness analyses (it doesn't because of weights and the fact that QALYs might not be VNM utilities).
     - That QALYs are the utilities being summed (so adding QALYs across patients is licensed by the theorem) - but note that QALYs are not necessarily VNM utilities and the weights matter.
     - That summing implies equal concern (weights may not be equal).
     - That utilitarianism is indifferent to distribution (which falls out of the additive form and constant weights).
  7. The coin-flip objection: the theorem cannot represent a strict preference for a fair lottery over giving the good to a known person. This must be explained simply.
  8. One question at the end to check understanding.
  9. List of topics to avoid: the proof, deep dives into population ethics, etc.

  Proposed Sequence (50 minutes):

  1. (5 min) Introduction: Why we care about aggregating individual preferences in health economics? Example: allocating a scarce resource (e.g., a single dose of a drug) between two patients. We want a social preference that respects individual preferences but also equity? But note: Harsanyi's theorem is a foundation for utilitarianism, which is then modified by equity weighting.

  2. (10 min) Setting up the framework: Social states vs. lotteries over social states.
     - We are not just ranking sure outcomes (like giving the dose to patient A or B) but also lotteries (e.g., a 50-50 chance of giving it to A or B).
     - Why? Because uncertainty is inherent in health (e.g., we don't know who will benefit more, or we might design a random allocation).
     - Introduce the idea of a social lottery: a probability distribution over social states (which specify who gets what).

  3. (10 min) von Neumann-Morgenstern (VNM) utility: The rationality conditions for preferences under uncertainty.
     - Explain that we assume each individual has VNM preferences over lotteries that affect them. This gives us a cardinal utility function for each individual, unique up to affine transformations.
     - Example: For two patients (A and B) and two social states: state A (dose to A) and state B (dose to B). We can also consider a lottery L(p) that gives state A with probability p and state B with probability 1-p.
     - Patient A's utility: Let u_A(A) = 1 (if A gets the dose), u_A(B)=0 (if B gets it). Similarly, for B: u_B(A)=0, u_B(B)=1. Then for lottery L(p), A's expected utility is p*1 + (1-p)*0 = p, and B's is p*0 + (1-p)*1 = 1-p.

  4. (5 min) The Pareto condition:
     - Two versions:
          a) If every individual is indifferent between two lotteries, then society is indifferent (unanimity of indifference).
          b) If every individual weakly prefers lottery X to lottery Y, then society weakly prefers X to Y (and if at least one strictly prefers, then society strictly prefers) - full Pareto.
     - Note: The stronger version (full Pareto) is typically used. It implies the weaker one.

  5. (5 min) The theorem: Under the assumptions that society's preferences over lotteries satisfy the VNM axioms and that the Pareto condition holds (with the full version), then social welfare must be a weighted sum of individual expected utilities. That is, there exist weights w_i (for each individual i) such that for any lottery L, the social welfare W(L) = sum_i w_i * EU_i(L).

  6. (10 min) Implications and discussion:
     - Why this is utilitarian? It is additive and linear in probabilities (so expected utility). But note: the weights w_i may not be equal. If they are equal, then we have classical utilitarianism. But the theorem does not require equal weights.
     - The weights: They are positive? The stronger Pareto condition (with weak preference) ensures non-negative weights. (If we had only the indifference part, we might get negative weights.) So with full Pareto, weights are non-negative. If we also assume that society is not indifferent to everything, then at least one weight is positive.
     - Distributional indifference: Suppose we have two sure social states: state 1 (gives 1 util to A and 0 to B) and state 2 (gives 0 to A and 1 to B). If weights are equal, then W(state1)=w, W(state2)=w? Actually: W(state1) = w_A * 1 + w_B * 0 = w_A; W(state2)=w_B. So if w_A = w_B, then society is indifferent. But if w_A > w_B, then society prefers state1. However, note that the additive form implies that we only care about the total weighted sum. So if we have a transfer from a low-weight individual to a high-weight one, social welfare might increase even if the total utils are the same? Actually, no: because the weights are fixed. But in the standard utilitarian setup with equal weights, we are indifferent to distribution: we only care about the total. But with unequal weights, we are not indifferent: we prefer to give the resource to the person with the higher weight. However, the theorem does not require weights to be equal.
     - The coin-flip objection: Suppose we have two individuals, and one dose. Consider two options:
          Option 1: Give the dose to A for sure.
          Option 2: Flip a fair coin: if heads, give to A; if tails, give to B.
          Now, suppose we want society to strictly prefer the coin flip (because it's fair). But according to the theorem, the social welfare of option 1 is w_A * 1 + w_B * 0 = w_A.
          The social welfare of option 2 is w_A * 0.5 + w_B * 0.5 = 0.5*(w_A + w_B).
          If we prefer the coin flip, then we require 0.5*(w_A + w_B) > w_A, which implies w_B > w_A. But that would also imply that if we had a choice between giving the dose to B for sure and giving it to A for sure, we would prefer B (because w_B > w_A). So the theorem cannot capture a pure preference for fairness (i.e., a preference for the lottery that is not due to a difference in the weighted sum) without having a built-in preference for one individual over the other. This is a limitation: the social welfare function is linear in probabilities and thus cannot capture risk aversion at the social level for fairness reasons.

  7. (5 min) Relation to cost-effectiveness analysis and QALYs:
     - The theorem does not directly say that we should sum QALYs. Why?
          a) QALYs are not necessarily VNM utilities. They are health measures, but the preferences over lotteries might not satisfy the axioms (e.g., if there is risk aversion beyond what is captured by the linear QALY model).
          b) The weights in the theorem are not necessarily equal. So even if we take QALYs as utilities, the social welfare function would be a weighted sum of expected QALYs, not the unweighted sum.
     - Therefore, the theorem does not justify unweighted QALY maximization.

  8. The impartial observer argument: (1-2 min) This is a different argument by Harsanyi for utilitarianism. Here, an impartial observer imagines having an equal chance of being any person in society. Then, the observer's VNM preferences would lead to maximizing the average utility. This is a justification for equal weights. But note: the aggregation theorem does not require the impartial observer and does not require equal weights. So they are different. We are focusing on the aggregation theorem.

  9. (5 min) Example worked out on the whiteboard:
     - Scenario: One dose to allocate between two patients, A and B.
          - Option 1: Give to A (sure)
          - Option 2: Give to B (sure)
          - Option 3: Flip a fair coin (50% A, 50% B)
     - Utilities: 
          - If A gets dose: A's utility=1, B's=0.
          - If B gets dose: A's utility=0, B's=1.
     - Assume society has weights: w_A and w_B.
          - W(Option1) = w_A * 1 + w_B * 0 = w_A
          - W(Option2) = w_A * 0 + w_B * 1 = w_B
          - W(Option3) = w_A * (0.5) + w_B * (0.5) = 0.5*w_A + 0.5*w_B
     - If we set w_A = w_B = 1 (equal weights), then:
          Option1: 1, Option2: 1, Option3: 1 -> society is indifferent.
     - If we set w_A = 2, w_B = 1 (maybe because A is more severely ill? but note: the theorem does not specify weights), then:
          Option1: 2, Option2: 1, Option3: 1.5 -> society prefers Option1, then Option3, then Option2.
          - There is no way to make society strictly prefer Option3 over both Option1 and Option2 without having w_B > w_A and w_A < w_B, which is impossible. So if we want to strictly prefer the coin flip, we cannot do it without having weights that are inconsistent in the sure cases.

  10. (5 min) Recap and one question for the group:
      - Question: "Suppose we have two patients and one dose. We have two options: give the dose to patient A (who is very young and has many QALYs to gain) or to patient B (who is older and has fewer QALYs to gain). If we use unweighted QALY maximization, we choose A. But Harsanyi's theorem says that social welfare is a weighted sum of individual expected utilities. What does that allow us to do that unweighted QALY maximization doesn't? And what constraint does it impose on how we value the coin flip option?"

      Expected answer: 
          - It allows for giving different weights to different individuals (e.g., giving more weight to the older patient if we value equity). 
          - But it forces us to value the coin flip option at the weighted average of the two sure options. So we cannot have a separate 'fairness' value beyond the weighted utilities.

  11. Topics to avoid (explicitly say we are skipping):
      - The proof of the theorem (it's an existence proof using the separating hyperplane theorem or linear algebra).
      - Population ethics (changing number of individuals).
      - How to determine the weights (that's for equity weighting next month).
      - The debate about whether QALYs are VNM utilities (assume for now they are, but note it's an assumption).
      - The impartial observer in depth.

  Final Structure with Timing:

  - 0-5 min: Introduction and motivating example (without lotteries yet).
  - 5-15 min: The need for lotteries and VNM utility (ex ante perspective).
  - 15-20 min: Pareto conditions (full version).
  - 20-25 min: Theorem statement and form of social welfare.
  - 25-35 min: Implications: weights, distribution, and the coin-flip objection (with example on whiteboard).
  - 35-40 min: Relation to QALYs and cost-effectiveness.
  - 40-42 min: Brief note on impartial observer (different argument).
  - 42-47 min: Worked example (whiteboard) and discussion.
  - 47-50 min: Recap and one question.

  Note: Be prepared for the Sen comment. When discussing the form of social welfare, point out that the additive form implies that we only care about the weighted sum. So if we have two distributions that have the same weighted sum, we are indifferent. There is no inherent concern for equality of utility. This is the sense in which utilitarianism is indifferent to distribution. But note: if we have diminishing marginal utility of income (or health), then we might have a concern for equality, but that is built into the individual utility functions. However, in the social welfare function, the weights are constant. So even if individual utilities are concave, the social welfare function is linear in utilities. So we are indifferent to the distribution of utilities per se (we don't care about the variance, only the total).

  This should set the stage for equity weighting: we might want to adjust the weights or use a non-linear social welfare function to account for equity, but Harsanyi's theorem forces linearity and thus constrains us.
answer: |-
  Below is a structured 50-minute session plan for introducing Harsanyi's aggregation theorem to your group. The sequence prioritizes conceptual clarity, addresses your concerns about misconceptions, and builds toward equity-weighting discussions. I'll break it down step by step, including timing, key points, examples, and how to handle objections.

  ---

  ### **Session Plan: Harsanyi’s Aggregation Theorem (50 Minutes)**
  **Goal:** Establish why social welfare *must* be a weighted sum of individual expected utilities under specific axioms—and clarify what this does (and does not) justify in health economics.

  ---

  #### **1. Framing & Core Distinction: Sure States vs. Lotteries (10 min)**
  - **Why start here?** If the ex ante/ex post distinction isn't clear upfront, the theorem’s implications (e.g., why it can't handle fairness) will be misunderstood.
  - **Key points:**
    - We rank two types of things:  
      (a) **Sure social states** (e.g., "Dose goes to Patient A").  
      (b) **Lotteries over social states** (e.g., "50% chance dose goes to A, 50% to B").  
    - Health decisions involve uncertainty (e.g., treatment efficacy, random allocation). We need rules for ranking lotteries.
    - **Ex ante perspective:** Evaluate lotteries *before* uncertainty is resolved (focus on expected individual outcomes).  
    - **Ex post perspective:** Evaluate outcomes *after* uncertainty is resolved (focus on final distributions).  
  - **Carrying example (use throughout):**  
    > *One dose left for a life-saving drug. Two patients:*  
    > - *Patient A: Gains 4 QALYs if treated.*  
    > - *Patient B: Gains 1 QALY if treated (due to comorbidities).*  
    > *Options: Give to A (State A), Give to B (State B), or flip a coin (Lottery L: 50% A, 50% B).*  
    > *Assume no other differences (age, wealth, etc.).*  
    - **Why this works:** Fixed population, no money (avoids WTP confusion), asymmetric stakes (high vs. low QALY gain), includes a lottery.  
    - **Whiteboard:** Sketch utilities for A and B in each state (e.g., U_A(A) = 4, U_A(B) = 0; U_B(A) = 0, U_B(B) = 1).

  ---

  #### **2. von Neumann-Morgenstern (VNM) Utility (10 min)**
  - **Why here?** VNM is the foundation for cardinal utilities. Without it, "weighted sum" is arbitrary.
  - **Key points:**  
    - Individuals have rational preferences over lotteries (completeness, transitivity, continuity, independence).  
    - These axioms imply **VNM utility functions**: unique up to affine transformations, capturing risk attitudes.  
    - *Not* QALYs! QALYs are health measures; VNM utilities reflect preferences under uncertainty.  
      > *In our example:*  
      > - Patient A’s VNM utility: EU_A(L) = 0.5×4 + 0.5×0 = 2 QALYs.  
      > - Patient B’s VNM utility: EU_B(L) = 0.5×0 + 0.5×1 = 0.5 QALYs.  
  - **Stress:** VNM utilities are cardinally measurable. This allows linear aggregation.

  ---

  #### **3. Pareto Conditions (5 min)**
  - **Why here?** Pareto links individual and social preferences. Clarify which version you use.
  - **Key points:**  
    - **Unanimity of indifference (weak Pareto):** If all indifferent between two lotteries, society is indifferent.  
    - **Full unanimous preference (strong Pareto):** If all prefer lottery X over Y, society prefers X over Y. If some strictly prefer X, society strictly prefers X.  
    - **Which version?** Use **strong Pareto** (standard in health econ). It rules out negative weights and implies social rationality.  
    - *Weak Pareto alone allows negative weights (e.g., "spiteful" social preferences).*

  ---

  #### **4. Harsanyi’s Theorem (5 min)**
  - **Statement:**  
    > If (1) Individuals have VNM preferences,  
    > (2) Society has VNM preferences,  
    > (3) **Strong Pareto** holds,  
    > Then social welfare is a **weighted sum of individual expected utilities**:  
    > \( W = w_1 EU_1 + w_2 EU_2 + \dots + w_n EU_n \)  
    > with \( w_i \geq 0 \) (and not all zero).  
  - **Whiteboard derivation** (intuitive, not proof):  
    - In our example:  
      - State A: \( W = w_A \cdot 4 + w_B \cdot 0 \)  
      - State B: \( W = w_A \cdot 0 + w_B \cdot 1 \)  
      - Lottery L: \( W = w_A \cdot 2 + w_B \cdot 0.5 \)  
  - **Weights ≠ equal:** \( w_i \) reflect social priorities (e.g., \( w_B > w_A \) if B is prioritized).

  ---

  #### **5. Implications & Misconceptions (15 min)**
  **Sequence matters:** Address objections *after* stating the result, using the example.
  - **A. Why this isn’t "utilitarianism" (and the distribution problem):**  
    - **Sen’s objection:** "Utilitarianism is indifferent to distribution."  
      > *In our example, if w_A = w_B = 1:*  
      > - State A: W = 4 (A lives, B dies)  
      > - State B: W = 1 (A dies, B lives)  
      > - Society prefers A, *regardless of inequality*.  
      > *If w_A = 1, w_B = 4 (prioritizing B):*  
      > - State A: W = 4  
      > - State B: W = 4  
      > - Society is indifferent, *despite B gaining fewer QALYs*.  
    - **Key:** Summing utilities doesn’t care *who* gets them. Distribution only matters via weights.  

  - **B. The coin-flip objection (core limitation):**  
    - **Scenario:** Society prefers fair lottery L (50-50) over giving the dose to A *for sure*.  
    - **Theorem’s response:**  
      > *Compare Lottery L vs. State A:*  
      > - \( W_L = w_A \cdot 2 + w_B \cdot 0.5 \)  
      > - \( W_A = w_A \cdot 4 + w_B \cdot 0 \)  
      > - For \( W_L > W_A \), we need: \( 2w_A + 0.5w_B > 4w_A \) → \( 0.5w_B > 2w_A \) → \( w_B > 4w_A \).  
      > *But if w_B > 4w_A, then State B (dose to B) is preferred to State A:*  
      > - \( W_B = w_B \cdot 1 > W_A = 4w_A \) (since \( w_B > 4w_A \)).  
    - **Conclusion:** Society can only "prefer fairness" if it *always* prioritizes B over A. The theorem can’t capture pure procedural fairness (e.g., "coin flips are fair even if A is prioritized").  

  - **C. What the theorem does NOT justify:**  
    - **QALY summation:**  
      - QALYs ≠ VNM utilities (e.g., they ignore risk preferences).  
      - Summing raw QALYs assumes \( w_i = 1 \) for all (equal weights), but weights are arbitrary in Harsanyi.  
    - **Cost-effectiveness analysis (CEA):**  
      - CEA maximizes total QALYs (unweighted sum). Harsanyi shows this requires *equal weights* and *QALYs as VNM utilities*—both strong assumptions.  
    - **Equal concern:** Weights \( w_i \) may be unequal (e.g., prioritizing the young, severely ill, etc.).

  ---

  #### **6. Impartial Observer: One-Sentence Clarification (2 min)**
  - **How it differs:**  
    > "Harsanyi’s impartial observer imagines you have an equal chance of *being* any person. This justifies **equal weights** (\( w_i = 1 \)). The aggregation theorem is more general: weights can be unequal."  
  - **Why mention it?** Prevents conflation. The aggregation theorem is your focus.

  ---

  #### **7. Final Question to Test Understanding (3 min)**
  - **Question:**  
    > *In our drug example, suppose society strictly prefers the coin flip (Lottery L) over giving the dose to Patient A. What does Harsanyi’s theorem force us to conclude about how society ranks giving the dose to Patient B versus Patient A?*  
  - **Expected answer:**  
    - Society must prefer Patient B over Patient A (since \( w_B > 4w_A \)).  
    - This shows the theorem can’t value fairness independently of outcomes.

  ---

  #### **What to Refuse (Explicitly State)**  
  - **Proof:** "We’re skipping the proof (it uses linear algebra), but focus on what the theorem implies."  
  - **Population ethics:** "We’re holding population size fixed today; this doesn’t apply to saving future lives."  
  - **Weight calibration:** "How to set weights (e.g., age, severity) is for next month’s equity session."  
  - **QALY validity:** "We’re assuming QALYs ≈ utilities for simplicity, but this is debated."  
  - **Alternative theories:** "We’re not covering rank-dependent weights (e.g., prioritarianism) today."

  ---

  ### **Why This Sequence Works**
  - **Dependencies:**  
    VNM → Pareto → Theorem → Implications.  
    The coin-flip objection requires the theorem to be understood first.  
  - **Example:** Asymmetric stakes + lottery show aggregation mechanics and limitations.  
  - **Misconceptions:** Addressed *after* the result—when the group sees the math, objections become tangible.  
  - **Honesty:** Strong Pareto clarifies weights; impartial observer distinguished upfront.  

  By the end, your group will see Harsanyi as a *constraint*: it forces linear aggregation but doesn’t justify CEA or QALY summation. This sets up equity weighting as a response to the theorem’s limitations (e.g., unequal weights for fairness).
