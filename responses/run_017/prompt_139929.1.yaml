answer: |-
  Here’s a focused proposal draft addressing your requirements, structured for clarity and realism. I’ve tightened your framework, confronted the collapse worry head-on, and designed a feasible 9-month plan centered on public case evidence.

  ---

  **Project Title:** Diagnosing Goodhart’s Law: Matching Intervention Types to Failure Modes in Performance Metrics  

  **Sharpened Research Question:**  
  *Do the three observed failure modes of performance metrics—(1) selection pressure, (2) reclassification, and (3) constitutive capture—require categorically distinct interventions to mitigate, and if so, what diagnostic criteria reliably distinguish them in practice?*  
  **Determinate answer:** A taxonomy of failure modes with evidence-based intervention pairings (or confirmation that they collapse under scrutiny).  

  ### Why Existing Frameworks Fall Short  
  Current literature treats Goodhart failures as homogeneous, prescribing "robustification" (e.g., multiple metrics) indiscriminately. This overlooks critical nuances:  
  - **Selection pressure** (divergence at extremes) is well-theorized but conflated with **reclassification** (gaming labels without changing reality), which exploits measurement opacity.  
  - **Constitutive capture** (proxy redefining the target, e.g., credit scores) is underexplored; it merges measurement with institutional ontology, making standard audits inadequate.  
  - **The Collapse Worry:** If all metrics inherently reshape goals (e.g., "creditworthiness" *is* defined by scoring algorithms), categories may dissolve. *This project directly tests that:* By analyzing cases where metrics explicitly redefine success (e.g., FICO scores, school ratings) vs. those where they don’t (e.g., warehouse efficiency), we validate or invalidate constitutive capture as a distinct mode.  

  ### Method: Comparative Case Analysis  
  *Why this approach?*  
  - **Feasibility:** Public documents (audit reports, regulatory filings, ML papers) provide verifiable evidence without institutional access.  
  - **Rigor:** Cross-domain comparison (healthcare, education, finance, logistics, ML) tests universality of categories.  
  - **Avoids pitfalls:**  
    - *Formal models* require unrealistic assumptions about "true" targets.  
    - *Practitioner interviews* risk conflating rationalization with causation.  
    - *Big case surveys* lack depth to probe institutional ontology shifts.  

  **9-Month Work Plan (10 hrs/week):**  
  1. **Months 1–2:** **Literature Synthesis & Case Identification**  
     - Systematize definitions of failure modes; identify 3–5 documented cases per domain (e.g., VA hospital wait-time scandals [reclassification], Atlanta test-cheating [selection pressure], algorithmic credit scoring [capture]).  
  2. **Months 3–6:** **Deep Case Analysis**  
     - For each case: (a) Reconstruct how the metric was gamed, (b) Trace whether the *target concept itself shifted* (e.g., did "education quality" become "test scores" for administrators?), (c) Catalog interventions attempted and outcomes.  
  3. **Months 7–8:** **Cross-Case Comparison & Framework Testing**  
     - Map cases to failure modes using diagnostic criteria (e.g., *Was the metric’s definition altered? Did institutional rules absorb the proxy?*).  
     - Test the collapse worry: Is capture observed *only* where metrics formally redefine institutional goals?  
  4. **Month 9:** **Deliverable Design & Reporting**  
     - Synthesize findings into diagnostic tools; draft final report.  

  ### Deliverable: A Practitioner’s Diagnostic Toolkit  
  A concise, actionable guide (≤15 pages) enabling metric designers to:  
  1. **Diagnose Failure Modes** using observable signals (e.g., *rapid metric inflation + unchanged labels → reclassification*).  
  2. **Match Interventions** to modes:  
     - *Selection pressure:* Calibration against baselines, avoid high-stakes thresholds.  
     - *Reclassification:* Third-party audits, measurement transparency.  
     - *Constitutive capture:* Deliberate goal/metric decoupling (e.g., "creditworthiness reviews must include non-score factors").  
  3. **Flag Contexts** where categories blur (e.g., ML reward functions that *become* the objective).  

  ### Failure Conditions (Plainly Stated)  
  The project fails if:  
  1. Cases cannot be confidently categorized into the three modes using public evidence, *or*  
  2. Analysis shows interventions are interchangeable across modes (invalidating the core hypothesis), *or*  
  3. The resulting framework offers no practical advantage over generic "use multiple metrics" advice for redesigners.  

  ### Scope Realism  
  **What’s cut:** Prescriptive intervention design (e.g., testing new audit techniques). This requires institutional partnerships beyond scope.  
  **Why keep the rest?** Taxonomy validation is feasible with public data and delivers immediate value: Misdiagnosis leads to costly fixes (e.g., adding metrics when audits are needed). Your depot case exemplifies this—a basket of metrics wouldn’t stop clocking-out labor, but transparent shift logs might.  

  ---  

  **Key Strengths for Reviewers:**  
  - **Actionable Output:** Directly helps practitioners like you diagnose failures *before* implementing fixes.  
  - **Collapse Worry Addressed:** Builds in a falsification test (domain cases where capture is absent).  
  - **Evidence-Based:** Leverages documented scandals—no speculation required.  
  - **Foundational:** Creates a shared vocabulary for future work in "practical epistemics."  

  This frames your insight as a tractable, high-impact project with clear win/fail conditions. I can refine specifics if helpful.
