prompt: |-
  My day job has nothing to do with any of this — I plan delivery routes for a regional grocery chain, and a few years ago our head office started ranking depots on cases shipped per labor hour. Inside about six months, two depots were splitting orders into half-empty totes so the case count went up, and one supervisor had started clocking people out during lulls so the lull never showed up as labor. Nothing was exactly falsified. The number just quietly stopped meaning the thing the people who picked it meant by it. I've been reading about this in the evenings ever since — Goodhart's law, specification gaming, reward hacking in ML, the whole genre — and I've now talked myself into applying for a small independent-project grant: nine months part-time, about fifteen thousand, from a foundation that funds what it calls practical epistemics. They want two pages: a precise question, a method they can actually judge, a deliverable, and an honest statement of what would count as the project failing. I have no supervisor and no university affiliation, so I can't borrow framing from anyone, and I'll fill in whatever citations are needed myself — please don't spend words on a reading list.

  Where I've got to is this. I've started sorting Goodhart failures into three buckets, and I think the standard toolkit for fixing them is really three different tools that people treat as interchangeable. (1) Selection pressure: the metric and the thing you care about track each other fine in the ordinary range and come apart in the tail, so rewarding the metric hard drags behaviour into the region where they diverge. (2) Reclassification: the world doesn't change, the labels do — hospital coders rewriting a case as a more severe diagnosis, a depot relabelling an order as two orders. (3) What I've been calling constitutive capture, which is the one I can't find anyone discussing properly: gaming the number doesn't just come apart from the target, it partly *redefines* the target. A credit score is the clearest case — the behaviour that raises your score is, by the lender's own lights, partly what being creditworthy now consists in. My half-formed hypothesis is that the usual remedies are matched to particular buckets and are actively damaging when applied to the wrong one: random audits or a human-in-the-loop look like the right fix for (2) and nearly useless for (1); a basket of metrics, or rotating the metric every few months, looks like the right fix for (1) but plausibly makes (3) worse, because more metrics means more of the target is constituted by whatever is being measured, and rotating destroys the shared expectation that was doing the constitutive work in the first place. If that's right then a lot of metric reform fails not because people under-react to Goodhart but because they reach for the nearest tool. There's also a worry I keep going back and forth on: in most real cases maybe there is no target fully specifiable apart from some proxy, in which case my three buckets might collapse into one and the whole project turns into something I'm not equipped to write.

  Can you turn that into the proposal I'd actually send? I need: the sharpened question (something with a determinate answer, not a gesture at a topic); why the existing ways of talking about this leave it open, including the strongest version of the collapse worry in the last sentence above; what I'd really do month by month across nine months at maybe ten hours a week, working from publicly documented cases in a handful of domains — hospital coding, school accountability, credit scoring, warehouse metrics, ML reward hacking — and why that method rather than the obvious alternatives (building a formal model? interviewing practitioners? a big case survey?); what a useful deliverable would be for someone actually redesigning a metric at an organisation like my employer, since that's who the foundation will ask about; and what would make the project a failure, stated plainly enough that I'd recognise it if it happened. Be realistic about scope — if this is two projects and one of them needs to be cut, say which and why.
