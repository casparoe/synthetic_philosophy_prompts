  *   **Why Bet on YES?** Her acceptance of the Cyrillic 'а' is the key. It demonstrates that the *identity* (Latin vs. Cyrillic) matters less than the *form's function* as representing /a/ *in its specific setting*. Similarly, the bitmap 'a' was illegible alone but accepted *in context*. The damaged mark, while ambiguous in isolation, is functionally an 'a' within "CABARET". Her "letterform rather than character" principle directly applies: she's judging if this *shape* serves as an 'a' *here*, not if it's a perfect specimen.

  **The Ideal Test Case to Separate Surviving Rules (Function vs. Structure):**

  To definitively separate the **Function/Reading** rule (Rule 3) from the **Structure/Tolerance** rule (Rule 2), present her with this:

  *   **The Case:** A deliberately designed, novel glyph mapped to the 'a' key in a functional typeface. The glyph is a **perfect circle**. When used in a word like "cat" ("c◯t"), competent readers instantly and effortlessly interpret the circle as the vowel /æ/ (i.e., they read "cat").
  *   **Prediction:**
