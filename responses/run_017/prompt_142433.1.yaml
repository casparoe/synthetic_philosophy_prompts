  ### **Application to Live Proposals**

  #### **Proposal 1: Litigation Funder Slice ($400k)**  
  - **Step 1: Cap upside at $1.2M** (3×). Rationale: Funder’s assets ($50M) could cover 3× payouts in a "win" state, but defendant solvency risk reduces recoverable amount.  
  - **Step 2: Adjust win rate to 45%** (from 60%). Rationale: Shared legal question creates correlated risk; +15% skepticism adjustment.  
  - **Step 3: Scenario analysis**  
    - Best (3×): $1.2M @ 25% prob  
    - Base (1.5×): $600k @ 25% prob  
    - Worst (0): $0 @ 50% prob  
    - **Expected return:** `(0.25×1.2M) + (0.25×0.6M) + (0.5×0) = $450k` (12.5% return over 3 years → **4.2% annualized**).  
    - *Below 15% hurdle*.  
  - **Step 4: Distribution safety**  
    - Max loss ($400k) = 1% of corpus. Even in stress year, corpus covers distributions.  
  - **Step 5:** Illiquid but <2.5% of corpus.  
  - **Verdict: ❌ REJECT** (Fails Step 3 hurdle).  

  #### **Proposal 2: Uncapped Royalty Stream ($1M)**  
  - **Step 1: Cap upside at $3M**. Rationale: Licensor’s net assets ($15M) imply $3M max survivable payout in "blockbuster" state.  
  - **Step 2: Assign probabilities** (⚖️):  
    - Blockbuster ($3M): 5% prob  
    - Moderate ($1M): 25% prob  
    - Failure ($0): 70% prob  
  - **Step 3: Expected return**  
    - `(0.05×3M) + (0.25×1M) + (0.7×0) = $400k` (**–60% total return**).  
  - **Step 4: Distribution safety**  
    - Loss ($1M) = 2.5% of corpus. In stress year, corpus = $28M – $1M = $27M. Distributions over 10 years = $20M. Buffer: `$27M > 1.2×$20M?` → No ($27M < $24M required).  
  - **Verdict: ❌ REJECT** (Fails Steps 3 and 4).  

  #### **Proposal 3: Tail Hedge Options (2% of corpus/year = $800k/year)**  
  - **Step 1: Cap upside at 50× ($40M)**. Rationale: Historical crises (e.g., 2008) show S&P 500 can drop 50%, but liquidity constraints limit option payouts.  
  - **Step 2: Adjust crash probability to 2%** (from promoter’s 1%).  
  - **Step 3: Scenario analysis**  
    - Best (50×): $40M @ 2% prob  
    - Base (5×): $4M @ 10% prob  
    - Worst (0): $0 @ 88% prob  
    - **Expected annual return:** `(0.02×40M) + (0.1×4M) + (0.88×0) = $1.2M` (50% return on $800k).  
    - *Exceeds 15% hurdle*.  
  - **Step 4: Distribution safety**  
    - Annual cost ($800k) = 0.2% of corpus. In stress year:  
      - Portfolio drops 30% → $28M.  
      - Option pays $40M → corpus = $28M + $40M = $68M.  
      - Distributions over 10 years = $20M. Buffer: `$68M > 1.2×$20M` → Yes.  
  - **Step 5:** Liquid (exchange-traded), but recurring cost.  
  - **Vote Trigger:**  
    - Expected return clear, but 88% probability of total loss yearly.  
    - Qualitative: Insurance value in crises vs. drag on returns.  
    - **Handoff to committee vote** (⚖️).  

