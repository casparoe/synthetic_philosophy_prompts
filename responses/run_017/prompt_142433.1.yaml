  *(Judgment steps marked with ⚖️)*

  1. **Step 1: Cap the Upside Realistically**  
     - **Question:** *What is the maximum credible payoff, given counterparty capacity constraints in adverse states?*  
     - **Method:**  
       - Identify the worst-case state (e.g., market crash, defendant bankruptcy).  
       - Estimate counterparty’s available capital in that state (e.g., liquid assets minus senior obligations).  
       - Set upside cap at 50-75% of this amount (⚖️: conservative haircut for hidden liabilities).  
     - **Reject if:** No defensible cap can be set (e.g., promoter refuses to share counterparty financials).

  2. **Step 2: Adjust Probabilities for Conservatism**  
     - **Question:** *What are realistic probabilities of success/failure after adjusting for promoter optimism and model risk?*  
     - **Method:**  
       - Start with promoter’s stated probabilities.  
       - Apply adjustments:  
         - Win/upside probability: Reduce by 10–30% (⚖️).  
         - Loss probability: Increase by 10–30% (⚖️).  
       - For fat tails: Cap tail probability at 2× historical precedent (e.g., if promoter claims 1% crash odds, use ≤2%).  
     - **Reject if:** Adjusted loss probability >80% or upside probability <15%.

  3. **Step 3: Calculate Risk-Adjusted Return**  
     - **Question:** *Does the risk-adjusted return clear a hurdle after capping and probability adjustments?*  
     - **Method:**  
       - Use simplified scenarios:  
         - **Best case:** Capped upside (Step 1).  
         - **Base case:** 50% of capped upside.  
         - **Worst case:** Total loss.  
       - Assign probabilities (⚖️): Best (20–40%), Base (20–40%), Worst (30–60%).  
       - Compute expected return: `(Best prob × Best) + (Base prob × Base) + (Worst prob × Worst)`.  
       - **Hurdle:** Minimum 15% annualized return after fees.  
     - **Reject if:** Expected return < hurdle.

  4. **Step 4: Test Distribution-Safety Constraint**  
     - **Question:** *Could this investment cause a missed 5% distribution in a 10-year window?*  
     - **Method:**  
       - Simulate impact over 10 years:  
         - Assume 3 stress years (portfolio –30%), 7 normal years (+5%).  
         - Add investment loss in its worst-case year.  
       - **Threshold:** Corpus must cover all distributions with 20% buffer (⚖️).  
         - *Formula:* `(Corpus – Investment) ≥ 1.2 × (10 × 5% × Initial Corpus)`.  
       - For recurring investments (e.g., options), test cumulative cost.  
     - **Reject if:** Buffer breached in any simulated year.

  5. **Step 5: Liquidity & Concentration Check**  
     - **Question:** *Does this tie up capital or expose >2.5% of corpus in illiquid assets?*  
     - **Method:**  
       - Illiquidity penalty: If locked for >3 years, require +5% to return hurdle.  
       - **Reject if:** >2.5% of corpus exposed to a single illiquid bet.

  6. **Step 6: Vote Trigger**  
     - **Question:** *After Steps 1–5, is the decision still ambiguous?*  
     - **Handoff to vote if:**  
       - Expected return > hurdle but adjusted loss probability >50%.  
       - Mission alignment/other qualitative factors dominate (⚖️).  
     - **Document:** Justify cap, probabilities, and qualitative factors in 1-pager.

