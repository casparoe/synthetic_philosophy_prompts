answer: |-
  Here's a comprehensive spec for a theory of propositional unity, designed to meet your constraints and objectives. The desiderata are derived from the core jobs: enabling compositional semantics and serving as mind-independent, truth-evaluable objects of propositional attitudes.

  ---

  ### **Core Desiderata for Propositional Unity**  
  *(Non-negotiable = **N**; Contentious/Preference-Based = **C**)*  

  1. **Unity vs. Mere Aggregation (N)**  
     - **Requirement**: Must distinguish a unified proposition (e.g., *Socrates is wise*) from a mere list/heap (e.g., {Socrates, wisdom}).  
     - **Why**: A list lacks truth-evaluability; propositions must be truth-apt.  
     - **Knocks out**: Naive set-theoretic or mereological aggregates (e.g., {Socrates, wisdom} is not false when Socrates is wise).  

  2. **Directionality/Order Sensitivity (N)**  
     - **Requirement**: Must distinguish *aRb* from *bRa* (e.g., *Socrates loves Plato* vs. *Plato loves Socrates*).  
     - **Why**: Natural language semantics and truth conditions depend on constituent order.  
     - **Knocks out**: Symmetric relations (e.g., "adjacency") or unstructured complexes. Must avoid adding a *relational constituent* (e.g., a "glue" relation), as this triggers Bradley’s regress.  

  3. **False Proposition Unity (N)**  
     - **Requirement**: False propositions (e.g., *Socrates is foolish*) must be fully unified, despite no corresponding fact.  
     - **Why**: Propositions are truth-bearers regardless of truth-value; we believe/doubt false propositions.  
     - **Knocks out**: Fact-based theories (e.g., early Wittgenstein) or correspondence theories requiring existing states of affairs.  

  4. **Scalability to Complex Structure (N)**  
     - **Requirement**: Must handle embedded/quantified propositions (e.g., *Alice believes that Bob doubts that p*).  
     - **Why**: Natural language exhibits recursive compositionality.  
     - **Knocks out**: Atomistic or non-compositional theories (e.g., simple predicate-argument models without recursion).  

  5. **Mind-Independence/Shareability (N)**  
     - **Requirement**: Propositions exist independently of any mind entertaining them; multiple agents can grasp the same proposition.  
     - **Why**: Propositions are public objects of attitudes (e.g., two people believe *2+2=4* without mutual interaction).  
     - **Knocks out**: Mental-act theories (e.g., Russell’s judging) or ad hoc cognitive constructions. Your constraint rules out "synthesis" by the thinker.  

  6. **Truth-Evaluability (N)**  
     - **Requirement**: Propositions must have determinate truth conditions.  
     - **Why**: Central to their role as objects of belief/knowledge.  
     - **Knocks out**: Non-representational "propositions" (e.g., pure syntactic forms).  

  7. **Fine-Grained Identity (C)**  
     - **Requirement**: Propositions must be individuated finely enough to distinguish cognitively distinct but logically equivalent contents (e.g., *triangles have 3 sides* vs. *3 is the square root of 9*).  
     - **Why**: **Controversial** – structuralists demand it for cognitive realism; possible-worlds theorists reject it.  
     - **Knocks out**: Coarse-grained theories (e.g., possible worlds).  

  8. **No Extra Constituents (N)**  
     - **Requirement**: Unity cannot rely on an additional constituent (e.g., a "binding relation").  
     - **Why**: Bradley’s regress: any new constituent requires further unification.  
     - **Knocks out**: Relational glue theories (e.g., early analytic metaphysics).  

  9. **Unity Explanation (C)**  
     - **Requirement**: Unity must be *explained* (not taken as primitive).  
     - **Why**: **Controversial** – Anti-primitivists see this as necessary to avoid mystery; primitivists (e.g., Fregeans) argue unity is bedrock.  
     - **Knocks out**: Primitivist theories (Frege, Wittgenstein) if explanation is demanded.  

  ---

  ### **The Tension: The Minimal Unsatisfiable Subset**  
  The core conflict arises when combining:  
  - **Structure** (required for directionality and semantics),  
  - **Non-Regress** (no extra unifying constituents),  
  - **Mind-Independence** (no thinker-dependent unification).  

  **Argument for Unsatisfiability**:  
  - Structure demands internal complexity (e.g., subject-predicate asymmetry).  
  - Non-Regress forbids adding a unifier (e.g., a relation).  
  - Mind-Independence requires unification prior to cognition.  
  - **Result**: Without extra constituents *or* mental acts, *how can structure emerge*? This traps theories in a dilemma: accept primitivism (violating Explanation) or invoke regress-prone elements.  

  **The Key Excluder**: **Non-Regress** does the most work. It forces theories into radical solutions (e.g., Frege’s unsaturatedness) or retreats (e.g., possible-worlds minimalism).  

  ---

  ### **Can the Enterprise Survive Your Constraint?**  
  Yes, but only by accepting **primitivism** (Frege) or **rejecting structure** (possible-worlds). If neither is palatable, collapse is likely. Your constraint (no thinker activity, no extra constituents) is fatal for relational/act-based theories.  

  ---

  ### **Theories at a Glance**  
  | **Theory**          | **Fails on Desiderata**                               | **Survives?**       |  
  |----------------------|-------------------------------------------------------|---------------------|  
  | **Frege**            | Unity Explanation (C) – takes unsaturatedness as primitive. | **Best survivor** – satisfies all (N) desiderata but primitivist. |  
  | **Russell (judging)**| Mind-Independence (N) – requires act of judging.      | **No** – violates your constraint. |  
  | **Possible Worlds**  | Directionality (N), Fine-Grained Identity (C), Structure. | **Partial** – avoids unity problem but loses semantic structure. |  
  | **Wittgenstein**     | Unity Explanation (N/C) – unity "shown" not stated.   | **No** – offers no theory, just silence. |  

  **Frege’s Edge**: Only Frege satisfies all (N) desiderata under your constraint. His unsaturated concepts (e.g., *wisdom* needs an object) provide intrinsic unity without extra elements or minds. But it trades Explanation for Primitivism – the very preference you flagged.  

  This sets the stage for your group: the choice between explanatory ambition (risking regress) and primitivist restraint. Focus on the **unsatisfiable subset (Structure + Non-Regress + Mind-Independence)** as the pivot – it forces this dilemma.
