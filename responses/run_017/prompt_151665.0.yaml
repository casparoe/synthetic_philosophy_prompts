     b) The ex-ante objective is a non-causal functional of the policy: the policy both selects actions and fixes the probability of being in the situations (information sets) where those actions are taken. The formalism of MDPs and POMDPs does not exclude such objectives by construction, but the standard Bellman equation and the policy gradient theorem rely on the Markov property and perfect recall. In imperfect recall, the visitation distribution at an information set is endogenous to the policy, and the standard policy gradient formula (which ignores the derivative of the state distribution) does not hold. We must use a more general policy gradient for POMDPs that accounts for the visitation distribution.

     c) The vocabulary can express the difference between the driver asking what he should do now and what he should have planned. The "now" question is answered by the Q-function given the current belief (which is induced by the policy). The "plan" question is answered by the ex-ante optimization of the policy. The formalism can express both, but they lead to different answers unless the policy is at a fixed point.

