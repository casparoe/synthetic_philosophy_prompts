          - The self-consistency fixed point: require that the policy θ is such that the action prescribed by the policy (i.e., exit with prob θ) is optimal at the time of action given the belief that θ induces. This is equivalent to requiring that θ is a fixed point of a policy-improvement operator: given θ, we compute the belief, then the optimal action at the information set, and then set the new policy to be the one that takes that action (if deterministic) or a mixture that matches the optimality condition. In this case, the fixed point is θ=1/3.

