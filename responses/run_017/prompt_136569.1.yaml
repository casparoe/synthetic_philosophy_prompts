prompt: |-
  I have been asked to contribute a short conceptual-foundations annexe to a health authority's draft methods guide for technology appraisal, and the section I am responsible for has to say what the guide's central rule presupposes. Before I write it, I would like your help reconstructing the implicit theory as sharply as the material allows.

  The rule, as the guide states it: a treatment is recommended if its incremental cost per quality-adjusted life year falls below a fixed monetary threshold, and rejected if it exceeds that threshold. The details that seem to matter philosophically are these. QALYs are constructed by weighting each year of life by a quality weight between zero, identified with death, and one, identified with full health, with weights below zero permitted for states judged worse than death. The weights are derived from surveys in which members of the general public choose between a shorter life in full health and a longer life in a described impaired state, and the guide averages across respondents even for states those respondents have never occupied. Gains are then summed linearly across all patients, and the guide states explicitly that the value of a QALY gain does not depend on whose it is, on how many QALYs the patient has already had, or on how the total is distributed. There are three standing exceptions to the threshold. The first is an end-of-life override permitting a premium for patients with short remaining life expectancy. The second is an unmet-need clause permitting a premium where the condition is rare and no alternative treatment exists. The third is a spillover clause: health gains accruing to carers and family members may be counted in sensitivity analysis but are excluded from the base case, and so are the future health care costs a patient would have incurred had they not died.

  What I need from you is a reconstruction, not a survey of positions, and I would rather you argue from the structure of the practice than appeal to what is standard in the literature. Specifically:

  Distinguish the different strengths of comparability the rule might be committed to: that one person's well-being can be compared in level with another's; that gains and losses can be compared cardinally across persons; and that well-being is measurable on a ratio scale rather than merely an interval scale. Which of these does the arithmetic strictly require? My own suspicion is that division by cost demands more than summation does, and that allowing negative weights demands something specific about where zero sits, but I want this set out precisely, with each commitment tied to the step in the calculation that forces it.

  Say whether the practice presupposes a welfarist reading, on which QALYs are a measure of welfare, or an extra-welfarist one, on which they measure health and society may weight health however it likes. Which parts of the practice fit which reading, and what breaks if we switch? I am especially unsure about the survey method: it asks people to evaluate states they have never been in, and the guide simply averages over the familiar gap between how patients in a state rate it and how the general public rates it from outside. What view of well-being does that method quietly commit the guide to, and would patients' own ratings be a better or worse fit for the reading you identify?

  Assess whether the no-distributional-weighting clause really commits the guide to an unweighted total view, on which the marginal moral value of a gain is the same whoever receives it, or whether it is compatible with prioritarianism, since the guide says nothing about patients' lifetime well-being levels. Then take up the exceptions. Are the end-of-life override and the unmet-need clause contradictions of the baseline rule, or do they reveal that the baseline was never unweighted in the first place? I would like the difference between weighting by absolute shortfall, the number of QALYs a patient would lose without treatment, and weighting by proportional shortfall, the fraction of remaining life lost, spelled out, and I want to know which of these the end-of-life rule actually instantiates, given that its trigger is life expectancy rather than either shortfall measure. If the answer is neither, say what view of distributive justice a life-expectancy trigger would instead commit us to, and whether that view is one the guide could coherently hold alongside its own baseline.

  One member of the panel has proposed, in a footnote, that the threshold is not a moral quantity at all but the shadow price of a fixed budget: the amount of health that unidentified patients elsewhere in the system lose when we spend here. Does that reinterpretation remove the need for interpersonal comparisons, or does it only relocate them, given that the displaced patients are not identified and the comparison is with a counterfactual population? I want a straight answer on whether this is a genuine defence of the rule or a change of subject.

  Finally, tell me what would have to change if the comparability assumption were dropped. Could the rule survive as a decision procedure without being an aggregation of well-being at all, for instance as the output of a social choice function over profiles of individual preferences, or as a device for implementing a hypothetical agreement among people who do not know whose position they will occupy? And if the implicit view were replaced by prioritarianism, sufficientarianism, or a capabilities-style view in which the currency is not well-being but what people are able to do and be, which elements of the practice would have to change: the quality weights, the linear summation, the three exceptions, or the currency itself?

  Throughout, I want three things kept clearly separate: what the practice strictly presupposes in the sense that it would be unintelligible otherwise; what it merely fits well with because several theories would license it; and where its parts seem to presuppose inconsistent things, so that the guide may be committed to a conjunction no single view would endorse.
reasoning: |-
  Okay, the user is asking for help reconstructing the implicit philosophical foundations of a health technology appraisal guide's central rule. This is a deep and complex request that requires careful unpacking of multiple philosophical dimensions embedded in the guide's methodology.

  First, I need to understand the core rule: treatments are recommended if their incremental cost per QALY falls below a fixed monetary threshold. The key elements are QALY construction (including negative weights), linear summation across patients, and three specific exceptions to the threshold rule.

  The user wants me to focus on several critical aspects:
  1) The strength of interpersonal comparability required by the arithmetic
  2) Whether the approach is welfarist or extra-welfarist
  3) Whether the "no distributional weighting" clause truly commits to unweighted utilitarianism
  4) How to interpret the three exceptions in relation to the baseline rule
  5) Whether the budget constraint reinterpretation avoids interpersonal comparisons
  6) What would change if we dropped comparability or adopted alternative theories

  For interpersonal comparability, I need to analyze what each step requires. The summation across individuals requires cardinal interpersonal comparability of gains/losses. The division by cost to get ICER requires ratio-scale measurability because ratios would be meaningless otherwise. Negative QALY weights further reinforce ratio-scale requirements since they imply an absolute zero point (death as neutral).

  On welfarism vs extra-welfarism, there's tension here. The survey method using general public valuations of health states they've never experienced suggests an extra-welfarist view where health is a distinct good. But the construction method (quality-weights applied to life-years) and the exceptions (especially spillover considerations) pull toward welfarism. The averaging of public valuations over patient experiences creates inconsistency - it's neither purely experiential nor resource-based.

  The "no distributional weighting" clause appears utilitarian at first glance, but prioritarianism could technically be compatible since it doesn't mention baseline welfare levels. However, the exceptions complicate this - the end-of-life premium suggests concern for absolute shortfall, while unmet need suggests something closer to proportional shortfall. I need to determine what the life-expectancy trigger actually implies.

  For the budget constraint argument, this doesn't actually avoid interpersonal comparisons - it just shifts them to opportunity costs affecting an unidentified population. The comparison between actual and counterfactual populations still requires strong comparability assumptions.

  If we dropped interpersonal comparability, the entire QALY framework would collapse as currently constructed. Social choice approaches without comparability couldn't support the arithmetic required. Alternative theories like prioritarianism or capabilities would require fundamental changes: different valuation methods, non-linear aggregation, and potentially different currencies altogether.

  Throughout this, I must maintain clear distinctions between what the practice strictly presupposes, what merely fits well, and where inconsistencies appear. The most glaring inconsistency is between the "no distributional weighting" baseline and the three exceptions that introduce explicit weighting. The survey methodology also contains tensions between public and patient valuations.
answer: |-
  Here is a reconstruction of the implicit philosophical commitments within the guide's rule and its details, structured according to your requirements. The analysis ties each commitment directly to the practice and distinguishes between strict presuppositions, compatible theories, and internal tensions.

  ### 1. **Strength of Interpersonal Comparability**
     - **Cardinal Comparability of Gains/Losses (Strict Presupposition):**  
       Linear summation of QALY gains across patients *requires* that gains and losses can be cardinally compared and aggregated interpersonally. The rule treats a QALY gain for Patient A as directly additive to a QALY gain for Patient B, regardless of their identities, histories, or baseline welfare. This arithmetic breaks if gains are only ordinally comparable or non-fungible.
       
     - **Ratio-Scale Measurability (Strict Presupposition):**  
       The incremental cost-per-QALY calculation (ICER) demands a ratio scale. Division by cost implies:  
       (i) A non-arbitrary zero point (death = 0 QALYs), as negative weights for "worse than death" states rely on death as a fixed anchor.  
       (ii) Meaningful ratios: e.g., a treatment yielding 2 QALYs is twice as valuable as one yielding 1 QALY.  
       Without ratio-scale measurability, ICER thresholds are incoherent (e.g., doubling all QALY values would arbitrarily alter cost-effectiveness decisions).

     - **Level Comparability (Compatible but Not Strictly Required):**  
       The arithmetic does *not* require comparing absolute well-being levels (e.g., "Is Person A happier than Person B?"). It only requires comparability of *changes* in well-being (gains/losses). However, the exceptions (e.g., end-of-life premium) may implicitly rely on level comparisons (see §4).

  ---

  ### 2. **Welfarist vs. Extra-Welfarist Foundations**
     - **Tension Between Commitments:**  
       The guide’s practice is philosophically hybrid but leans **extra-welfarist** in design, with unresolved contradictions:
       - **Extra-Welfarist Elements:**  
         QALYs measure *health*, not comprehensive welfare. The use of public preferences (not patients') assumes society can define "health" independently of individual welfare. The exclusion of non-health spillovers (carers’ welfare) and non-health costs (e.g., productivity) reinforces this.
       - **Welfarist Elements:**  
         QALYs are constructed via preference-based choices (implying welfare is the root metric). Permitting negative weights accepts that some health states reduce overall welfare. The spillover clause’s sensitivity analysis admits welfare effects beyond health.
       
     - **Survey Method Commitments:**  
       Using general public preferences for states they haven’t experienced assumes:  
       (i) Health state valuation is objective or social, not experiential.  
       (ii) Well-being (or health) is interpersonally comparable via a common scale.  
       **Inconsistency:** If QALYs are *welfarist*, patients’ lived experience should be primary (and typically differs systematically from public valuations). If *extra-welfarist*, public preferences fit better—but the guide’s inclusion of "worse than death" states imports welfare logic. Switching to patient ratings would align with welfarism but clash with the guide’s societal perspective.

  ---

  ### 3. **Distribution: Utilitarianism vs. Prioritarianism**
     - **Unweighted Total View (Strict Presupposition):**  
       The explicit rejection of weighting by patient identity, prior QALYs, or distribution forces a utilitarian reading: a QALY gain has equal marginal value regardless of recipient. Prioritarianism *is not* compatible, as it weights gains by the recipient’s lifetime well-being level. The guide’s silence on lifetime levels does not create ambiguity; it confirms an *unweighted* sum.  
       **Breakdown under Prioritarianism:** Weighting gains by baseline welfare would require tracking individual histories—explicitly ruled out.

     - **Exceptions as Contradictions (Inconsistency):**  
       The end-of-life and unmet-need exceptions contradict the baseline rule:  
       - **End-of-Life Override:** Premiums for short life expectancy prioritize gains to those with low *absolute* remaining welfare (shortfall = total QALYs left without treatment). *Not* proportional shortfall (which would consider age/fair innings).  
       - **Unmet Need:** Premiums for rare conditions prioritize gains based on lack of alternatives (a non-health-related moral concern).  
       **Result:** The baseline claims "a QALY is a QALY," but exceptions weight QALYs higher for specific groups. This reveals the baseline *is* distributionally weighted—but covertly and inconsistently.

  ---

  ### 4. **Threshold: Moral Value vs. Budgetary Shadow Price**
     - **Relocation, Not Removal of Interpersonal Comparisons:**  
       The "budget shadow price" argument does not avoid interpersonal comparisons. It shifts the comparison to:  
       (i) **Identified patients** (those receiving treatment) vs. **unidentified patients** (those losing care due to budget reallocation).  
       (ii) **Actual** vs. **Counterfactual** populations.  
       To claim that £X spent here sacrifices *more* QALYs than it gains here, we must compare gains in one group with losses in another—requiring cardinal, ratio-scale comparability.  
       **Verdict:** This is a change of subject (from "what is just?" to "what is efficient?"), not a defense of the rule’s moral coherence.

  ---

  ### 5. **What Changes if Assumptions are Dropped?**
     - **Dropping Interpersonal Comparability:**  
       The rule becomes unintelligible. Without cardinal comparability of gains:  
       - QALYs cannot be summed across persons.  
       - ICERs cannot be calculated.  
       Social choice functions (e.g., Arrow) or hypothetical contracts (e.g., Veil of Ignorance) might yield similar *decisions* but not the same *arithmetic*. The QALY framework itself relies on interpersonal aggregation.

     - **Adopting Alternative Theories:**  
       | **Theory**          | **QALY Weights**       | **Summation**       | **Exceptions**       | **Currency**       |  
       |---------------------|------------------------|---------------------|----------------------|--------------------|  
       | **Prioritarianism** | Same (if health-focused)| Non-linear weights  | Redundant¹           | Health/Well-being² |  
       | **Sufficientarianism**| Minimum health threshold| Priority below threshold | End-of-life override | Health             |  
       | **Capabilities**    | Revise to functionings | Non-comparable?     | Replace              | Capabilities       |  
       
       - **Prioritarianism:** Requires weighting gains by lifetime welfare. Summation must track individuals. Exceptions become redundant or conflict.  
       - **Sufficientarianism:** May retain QALYs but sets a minimum health threshold. End-of-life override aligns; unmet need may not.  
       - **Capabilities:** Abandons QALYs for a multi-dimensional currency (e.g., mobility, dignity). Non-fungible capabilities prevent linear summation.  

       **Key Changes:**  
       1. **Prioritarianism/Sufficientarianism:** Quality weights *could* remain, but summation must weight gains. Exceptions conflict.  
       2. **Capabilities:** Currency and weights must be redefined; summation may not be possible.  

  ---

  ### **Summary of Commitments and Tensions**
  - **Strict Presuppositions:**  
    (i) Cardinal, ratio-scale interpersonal comparability of health gains.  
    (ii) Unweighted summation of gains (utilitarianism).  
    (iii) Health as the primary currency (leaning extra-welfarist).  

  - **Compatible Theories:**  
    Rule-utilitarianism, extra-welfarism, and (contentiously) the budget shadow price view.  

  - **Inconsistencies:**  
    (i) **Survey Method:** Public preferences + negative weights = unresolved welfarist/extra-welfarist tension.  
    (ii) **Exceptions:** Contradict "a QALY is a QALY" by weighting gains for some groups.  
    (iii) **Spillovers:** Excluding carer gains in base case conflicts with health focus if carers’ health is affected.  

  The guide implicitly endorses a **hybrid utilitarian-extra-welfarist** position but imposes ad hoc distributive weights via exceptions—a conjunction no coherent theory would endorse. To resolve this, either drop the exceptions or reformulate the baseline to incorporate distribution explicitly.  

  Would you like to refine any section or address another angle?
