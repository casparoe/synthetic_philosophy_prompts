prompt: |-
  Me and my friend Dev spent about three hours in the pub last night argueing about moral trade — that thing where two people with different values each do what's cheap for them and valuable to the other, without either of them endorsing the other's values. (I give $200 to the wetland trust Sam cares about, Sam gives $200 to the malaria charity I'd have given to anyway.) Dev's position was basically pure gains from trade: if each of us prefers the package deal to no deal at all, do it, end of story. When I pushed back she added something like a veil-of-ignorance clause — the arrangement should be one you'd agree to without knowing which side of it you'd end up on. I sort of liked that but I'm not sure it earns its keep.

  We got nowhere because we kept fighting about cases, so here are mine, going by gut:

  - Sam, $200 each to the other's cause. Obviously fine.
  - Guy from my climbing gym, young-earth creationist, raising money for a museum. He'll give $500 to my charity if I give $500 to the museum. Not fine. I think the museum makes the world worse and I want no part of financing it.
  - The priest at the church on my street: he'll give $200 to my charity if I give $200 to their soup kitchen. Fine — even though I think some of what that church teaches does real harm to real people, and even though the money is just as fungible here as it is in the museum case. I can't tell you what the difference is between these two, and I'm not sure there is one.
  - Marcus: he's about to buy a huge truck. He'll buy a small one instead and give the difference to my charity if I lay off meat for a month. Fine.
  - Marcus, different conversation: he says he'll spend Saturday keying SUVs unless I lay off meat for a month. Not fine at all, and it doesn't even feel like the same kind of thing, even though the shape is identical — he does something I like, conditional on me doing something.
  - A local campaign: they'll give $300 to my charity if I sign their petition, whose framing I think is straight-up dishonest. Not fine. I won't put my name to something misleading for $300 — even though I'd hand them $300 out of my giving budget, or just redirect it from my own cause, without blinking. That asymmetry probably doesn't survive scrutiny, but it's what I feel.
  - Scale: I'd happily trade $200, and I'd happily trade $2,000, but if someone offered to move most of my annual giving into trades on genuinely great terms I'd balk. No idea whether that's cowardice or a real point.
  - Future me: I sign up with a site that takes my $1,000 and burns it, or gives it to a cause I'm indifferent about, unless I've made my yearly donation by December. Fine — enthusiastic, even. Dev says that's not a trade at all, just a commitment device, and my principle shouldn't have to cover it.

  And here's what I genuinely can't decide: trading with someone who's just wrong about the facts — the guy who thinks his pet charity saves a life for a couple hundred bucks when I'm pretty sure he's off by an order of magnitude, and who'll fund my cause if I fund his PR push; trading with a stranger on a forum where neither of us can check whether the other actually did their bit; and a matching platform where everyone deposits an "I'll do X if matched" pledge and an algorithm assigns counterparties, so I end up serving some cause I've never heard of and can't evaluate.

  So: is there a principle, or a short list of candidates, that captures my verdicts? State it precisely enough that I can test it, tell me which clause is doing the work in which case, be honest about which of my verdicts it can't accommodate and which one you'd throw out, and run it on the three I can't decide. If gains from trade plus Dev's veil thing is basically right and I'm the one who's confused, say that, and say where. One more: is the "you can't verify compliance" issue a moral problem or just plumbing? Dev says plumbing. It feels more moral than that to me, but I definately can't say why.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a long debate with their friend Dev about moral trade, where each person does something valuable to the other based on their differing values. The user provided several cases where their gut reactions vary, and they're looking for a principle that can explain their judgments consistently. 

  First, I need to understand the core of their dilemma. The user seems conflicted between the efficiency of gains from trade and their intuitive discomfort in certain scenarios. Dev's position is straightforward: if both parties prefer the trade over no trade, it's acceptable. The veil-of-ignorance addition is meant to add fairness, but the user isn't sure it's sufficient.

  Looking at the cases they listed, I notice patterns. In the acceptable trades (Sam, priest's soup kitchen, Marcus's truck, future me), there's either a clear net positive outcome, no direct harm, or personal commitment without coercion. The unacceptable ones (creationist museum, SUV keying, dishonest petition) involve perceived harm, coercion, or moral compromise. 

  The tricky cases involve factual errors, verification issues, and algorithmic matching. Here, the user is unsure. Factual errors might lead to inefficiency or unintended harm. Verification problems introduce trust issues, which could be moral if it involves deception. Algorithmic matching feels risky because you can't assess the cause's impact, leading to potential complicity in harmful actions.

  The user's underlying concerns seem to be about complicity, harm, and integrity. They don't want to enable harm or associate with causes they find reprehensible, even indirectly. The scale issue suggests a discomfort with overcommitting to trades, possibly due to loss of control over their values or fear of unintended consequences.

  Dev's view that verification is merely plumbing might overlook the moral aspect of trust and accountability. If you can't verify, you're taking a risk that your action enables harm without recourse, which feels morally significant.

  To build a principle, I need to incorporate constraints that address these concerns. The baseline of mutual benefit isn't enough. Adding a harm constraint (no net harm) and an integrity constraint (no endorsing harmful values) covers many cases. The museum causes harm by spreading misinformation, so it's out. The soup kitchen, while run by a harmful church, directly helps without endorsing the church's doctrines. The SUV keying is clearly harmful and coercive. The dishonest petition compromises integrity by attaching the user's name to lies.

  For the unresolved cases: trading with someone factually wrong might violate the harm constraint if their cause is ineffective or harmful. Verification issues could breach integrity if deception occurs. Algorithmic platforms might force association with harmful causes, violating both harm and integrity constraints.

  I should check if this principle explains the scale issue. Smaller trades are manageable, but large-scale trading risks losing oversight, potentially leading to unintended harm or association with bad actors. Future me is fine because it's a commitment device, not a trade with another party's values.

  The veil-of-ignorance might help in some cases but doesn't resolve harm or integrity concerns. For example, behind the veil, you might reject trading with the museum knowing it promotes harmful ideas, even if it benefits both parties.

  Finally, advising the user to accept Dev's view only if they can reconcile these intuitions. But since their discomfort persists, the proposed constraints better capture their moral boundaries. They should also consider if their gut reactions in borderline cases (like the priest) align with avoiding complicity in harm versus direct endorsement.
answer: |-
  Here's a principle that captures your intuitive verdicts across nearly all cases, based on constraints beyond mutual benefit. I'll state it precisely, apply it to your cases, highlight where it deviates slightly, and tackle your unresolved scenarios:

  **The Constrained Gains-from-Trade Principle:**
  *A moral trade is permissible if and only if:*
  1.  **Mutual Benefit (Baseline):** Each party prefers the outcome where the trade occurs to the outcome where it does not occur (Dev's core condition).
  2.  **No Net Harm Constraint:** The trade does not create a *net increase in reasonably foreseeable harm* (physical, psychological, social, or epistemic) in the world, evaluated from a neutral standpoint (using your best available evidence and widely shared values like preventing suffering/promoting flourishing).
  3.  **Integrity Constraint:** The trade does not require you to *directly endorse, materially support the core harmful mission of, or become complicit in* a cause or action you reasonably judge to be significantly harmful or unjust, beyond the specific good being traded for. ("Complicity" implies a meaningful causal contribution or association with the harm).
  4.  **No Coercion/Threat:** The trade is not predicated on one party *threatening* to inflict harm unless the other complies (distinguishing threats from offers).

  **Application to Your Cases:**

  1.  **Sam ($200 each):** Passes all. Mutual benefit (✓), No net harm (✓), No endorsement/complicity (✓), No coercion (✓). **Verdict: Fine (Matches yours).**
  2.  **Creationist Museum ($500):** Fails Integrity Constraint. Funding the museum *directly supports its core harmful mission* (promoting anti-scientific views you believe make the world worse), even if it also gets money to your cause. Mutual benefit (✓), but core constraint violated. **Verdict: Not Fine (Matches yours).**
  3.  **Priest/Soup Kitchen ($200):** Passes Integrity Constraint *barely*. Funding the soup kitchen supports a specific good (feeding people). While the church has harmful doctrines, the money isn't *directly supporting* that core harmful mission (assuming fungible money; if $200 directly funds pamphlets you know spread harmful messages, it fails). It's materially supporting a *good subsidiary activity*. Mutual benefit (✓), No net harm (likely ✓ - soup helps), No coercion (✓). **Verdict: Fine (Matches yours).** *The distinction vs. Museum is the direct link to the core harmful mission.*
  4.  **Marcus (Truck Swap):** Passes all. Mutual benefit (✓), Net harm likely reduced (smaller truck: less pollution/risk? ✓), No endorsement of harm (✓ - encouraging smaller vehicle), No coercion (✓ - it's an offer). **Verdict: Fine (Matches yours).**
  5.  **Marcus (SUV Keying):** Fails **No Coercion/Threat Constraint** spectacularly. Mutual benefit exists *if you comply*, but the "trade" is initiated by Marcus *threatening harm*. Also fails No Net Harm (Keying causes harm) and Integrity (You'd be complicit by rewarding/extorting via threat). **Verdict: Not Fine (Matches yours).** *Shape is similar, but the initiating mechanism (threat vs. offer) is morally fundamental.*
  6.  **Dishonest Petition ($300):** Fails **Integrity Constraint**. Signing the petition constitutes *direct endorsement* of something you believe is misleading. Your name is attached, implying agreement. It's not just funding; it's active complicity in spreading (what you see as) a falsehood. Mutual benefit (✓), but core constraint violated. **Verdict: Not Fine (Matches yours).** *The asymmetry (giving $ vs. signing) is justified: signing is an act of personal endorsement, giving money is often seen as more detached support.*
  7.  **Scale (Large Trades):** **Principle Doesn't Directly Address Scale.** Your discomfort is likely rooted in practical concerns the principle hints at but doesn't explicitly forbid:
      *   *Loss of Control/Vision:* Large-scale trading could inadvertently violate the Integrity or Net Harm constraints more easily if you can't vet every counterparty/cause deeply.
      *   *Dilution of Values:* Over-reliance on trade might shift your focus from actively promoting your *own* values to a passive market dynamic.
      *   *Systemic Risk:* Large platforms might amplify harm if matching algorithms pair people with genuinely harmful causes unknowingly. Your balking isn't necessarily cowardice; it's a pragmatic concern about maintaining the *conditions* under which the principle safely applies. The principle *permits* large trades if constraints are met, but the feasibility of ensuring that decreases with scale.
  8.  **Future Me (Commitment Device):** **Dev is Correct - Not a Trade.** There's only one valuing entity (you) and one pot of money/action. No differing values are being bridged between distinct agents. It's a self-imposed incentive mechanism. The principle doesn't need to cover it, but it's clearly permissible. **Verdict: Fine (Matches yours).**

  **Addressing Your Unresolved Cases:**

  1.  **Trading with Factually Wrong Person (Life-saving PR):**
      *   **Apply Principle:** Does funding his PR push violate Integrity or cause Net Harm?
          *   *If the PR push is merely ineffective but neutral/harmless:* Trade might be permissible (like paying slightly more for a widget because he overvalues it). Mutual benefit exists, no clear net harm or complicity in harm. Your discomfort might be inefficiency, not immorality.
          *   *If the PR push actively spreads harmful misinformation or diverts resources from truly effective causes (Net Harm):* Fails Net Harm Constraint. Funding it makes you complicit in that harm (Integrity Constraint). **Likely Not Permissible.** Your gut sense that his factual error matters is correct *if* it leads to actual harm. If it's just wasted money, the principle might allow it, but your aversion could stem from valuing epistemic responsibility or efficiency beyond the core principle.

  2.  **Unverifiable Trade (Forum Stranger):**
      *   **Apply Principle:** **Dev is Partially Right (Plumbing), but Morally Relevant.** The principle focuses on the *action* (doing X conditional on Y). If you *do* your part (fund his cause), but he *doesn't* do his (fund yours), then:
          *   You *have* materially supported a potentially harmful cause (violating Integrity/Net Harm if it's bad).
          *   You *haven't* received the benefit, so Mutual Benefit fails *ex-post*.
      *   **Moral Problem:** Agreeing to an *unverifiable* trade significantly increases the risk of *unknowingly violating the Integrity and Net Harm constraints* (funding harm without getting the offsetting good) and of being exploited (Mutual Benefit failing). It shows poor due diligence on your part regarding the feasibility of upholding the constraints. **The unverifiability itself creates a high risk of *ex-post* moral failure, making the agreement potentially irresponsible.** Your feeling is valid – it's not *just* plumbing.

  3.  **Algorithmic Matching Platform (Unknown Cause):**
      *   **Apply Principle:** Participation carries a high risk of violating the **Integrity and Net Harm constraints**. You are agreeing *in advance* to materially support ("do X for") a cause you cannot evaluate. There's a significant chance you could be matched with a cause whose core mission you find harmful/unjust, forcing you to either:
          *   Break your pledge (problematic).
          *   Become complicit in harm (violating Integrity/Net Harm).
      *   **Verdict:** Participation seems **impermissible under the principle** due to the unacceptable risk of violating core constraints. The platform design inherently conflicts with the due diligence required to ensure the Integrity and Net Harm constraints are met for each trade.

  **Where the Principle Deviates Slightly / Requires Nuance:**

  *   **Priest/Soup Kitchen:** This is the weakest link. The principle *barely* passes it by distinguishing supporting a *subsidiary good* from supporting the *core harmful mission*. If you believe *any* support to the organization inherently fuels its harmful mission (strong fungibility), it fails the Integrity Constraint. Your gut accepts it; the principle can accommodate that by interpreting "core harmful mission" narrowly for the specific transaction. **This is the verdict most likely to be debated.**
  *   **Scale:** As noted, the principle allows large trades *if constraints are met*. Your discomfort suggests an *additional* practical or values-based concern not fully captured. Perhaps an implicit "Proportionality" or "Maintaining Agency" sub-clause is needed, but it weakens simplicity.

  **Conclusion:**

  Your intuitions go beyond simple mutual benefit (Dev's baseline). The **No Net Harm** and **Integrity** constraints (especially avoiding complicity in or endorsement of core harm) are crucial, alongside **No Coercion**. Dev's veil-of-ignorance might *approximate* the Net Harm constraint but is less precise about complicity/endorsement.

  *   **You're not confused:** Your cases consistently show aversion to enabling harm or compromising your integrity, even for mutual gain. The Constrained Gains-from-Trade Principle captures this well.
  *   **Verification:** It's both plumbing *and* morally relevant due to the risk it creates for violating core moral constraints (Integrity/Net Harm).
  *   **Your Unresolved Cases:**
      1.  **Factual Error:** Likely impermissible *if* the funded action causes net harm; possibly permissible if merely inefficient/neutral.
      2.  **Unverifiable Trade:** High risk makes agreement irresponsible/morally risky.
      3.  **Algorithmic Platform:** Impermissible due to unacceptable risk of violating Integrity/Net Harm constraints.

  This principle provides a robust framework for navigating the moral complexities of trade across differing values, prioritizing avoiding harm and maintaining integrity alongside mutual benefit.
