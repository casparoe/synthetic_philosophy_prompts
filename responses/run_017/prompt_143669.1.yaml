answer: |-
  Your diagnosis cuts deep, and I think you're closer to the core than most academic treatments. The stalemate isn't *just* about decision theory—it's about **which layer of agency the problem forces us to inhabit** and **what we believe is ontologically fixed** at the moment of choice. Here's the breakdown, with reasons:

  ### 1. The "Act vs. Disposition" Divide is Real (But Not the Whole Story)
  You're right:  
  - **The Two-Boxer** inhabits the **moment of action**. For them, the prediction is *causally fixed*, the boxes are *physically present*, and dominance is inescapable. "The million is either there or not. Taking both boxes *now* can't hurt me and might help." Their world is defined by causal levers they can pull *at that instant*.  
  - **The One-Boxer** inhabits the **space of pre-commitment**. They see the choice as a **symptom of a disposition** the predictor detects. "If I'm the *kind of agent* who takes one box, the predictor likely knew that and rewarded it. I need to *be* that agent." Their world is defined by **counterfactual consistency**—how their choice *reflects* a stable trait.

  **Why this isn't *just* framing?** Because it reveals a **metaphysical schism** about the predictor's knowledge:  
  - The two-boxer treats the predictor's accuracy as a **brute statistical fact** about past correlations.  
  - The one-boxer treats accuracy as **evidence of a dependency** between their *dispositional state* and the prediction. For them, "99% accurate" *means* the predictor reliably detects the disposition that *causes* your choice.  

  ### 2. The Deeper Disagreement: What is "Fixed" at Choice-Time?
  The core tension is **temporal and counterfactual**:  
  - **Two-Boxer Ontology**: Once the boxes are sealed, *nothing you do* affects Box B. Your choice is a *pure output* of your decision process. The predictor's accuracy is a historical fluke.  
  - **One-Boxer Ontology**: Your choice *manifests* a disposition that was *retroactively necessary* for Box B to contain $1M. Choosing to one-box isn't "tricking" the predictor; it's *being the person who was predicted to one-box*. The choice and the prediction are **entangled outcomes** of your agency.  

  **Your modified predictor case exposes this**:  
  When you make the predictor "perfect on one-boxers, useless on two-boxers," you force a confrontation:  
  - **Your friend** sees this as cheating because it **explicitly ties accuracy to disposition**. It confirms her view that Newcomb only "works" if the predictor detects *dispositions*, not acts-in-isolation.  
  - **You** see it as revealing that **standard Newcomb smuggles in dispositional realism**. Your version shows that "99% accuracy" is underspecified—*whose accuracy? Under which conditions?*  

  This isn't just semantics. It's about **which conditional probabilities are primitive**:  
  - Two-boxers use: *P(Box B full | I take one box)*  
  - One-boxers use: *P(Box B full | I *am* a one-boxer)*  
  **Your modified case proves these aren't equivalent**. When the predictor is bad at spotting two-boxers, *P(Box B full | I am a two-boxer)* can be high, even if *P(Box B full | I take one box)* is high for others.  

  ---

  ### What Counts as Progress?
  Rehashing CDT vs. EDT won't help. Neither will new dominance arguments. Progress requires **stepping outside the decision-theoretic frame**:

  1. **Formalize the Predictor's Epistemology**:  
     - Agree on *what "99% accurate" means*. Is it:  
       - *Unconditional frequency* (e.g., 99/100 predictions correct, regardless of agent-type)?  
       - *Conditional on agent-type* (e.g., 99% correct *given* the agent's disposition)?  
     - **Crucially**: Specify if the predictor's accuracy *depends asymmetrically* on the agent's disposition (as in your variant). This determines whether "being a one-boxer" is a *causal node* in the graph.

  2. **Map the "Act/Disposition Divergence" Theorems**:  
     - Formalize *when* the rational *act* diverges from the rational *disposition to adopt*. This happens when:  
       - The predictor detects dispositions, not acts (*your modified case*).  
       - Choices have "self-signaling" power (*standard Newcomb*).  
       - Pre-commitment is possible (*e.g., smoking lesion problems*).  
     - **Result**: Prove that in Newcomb-like problems, **maximizing utility *at the moment of choice* systematically undermines the cultivation of dispositions that maximize *long-run* utility**. This frames the stalemate as a conflict between **temporal slices of rationality**.

  3. **Agree to Answer Separately—But With Stakes**:  
     - Explicitly distinguish:  
       - **Q1 (Dispositional)**: "What disposition should I cultivate *before* prediction?" → **One-box**.  
       - **Q2 (Act)**: "What should I do *after* boxes are sealed?" → **Two-box**.  
     - **But**: Acknowledge that in Newcomb's universe, *you cannot optimize both*. Choosing Q2 sabotages Q1. This reveals the dilemma's power: **it forces you to pick which "you" gets to be rational**.

  ---

  ### Why This Diagnoses the Stalemate
  - **The literature is stuck** because it tries to force *one* answer to a question that splits agency. CDT answers Q2, EDT answers Q1, and both are "right" within their frame.  
  - **You and your friend are frozen** because you're prioritizing different agential perspectives. She's optimizing her *causal history* (being predictably rewarding), you're optimizing your *physical action* (grabbing maximal cash).  
  - **The predictor's accuracy** *is* the load-bearing element—but only because it determines whether the problem is about *acts* (if accuracy is random) or *dispositions* (if accuracy tracks agent-properties).  

  **To move forward**: Run experiments on the *modified* predictor. Calculate expected utilities for Q1 and Q2 *separately* under different accuracy specifications. You'll likely find:  
  - When accuracy is disposition-tracking (like your variant), **Q1 (one-box) dominates Q2 for long-run wealth**.  
  - When accuracy is act-tracking (e.g., predictor spies on you *as you choose*), **Q2 (two-box) dominates**.  

  This exposes Newcomb's core: it's a **Trojan horse for dispositional realism**. The one-boxer isn't "irrational now"; they're **paying a premium to rent a rational past**. The two-boxer isn't "leaving money on the table"; they're **refusing to pay for a past they can't change**. Until you agree on *which temporal slice of rationality matters most*, the boxes stay closed.
