prompt: |-
  You are a curriculum designer who has actually run hands-on formal-systems workshops for strong teenagers, not someone summarising a book from the outside. Before you settle on anything, spend a little while brainstorming two or three genuinely different ways the session could be built, and then tell me in two or three sentences which candidates you discarded and why — I want to see the shape of the design space, not just your favourite point in it.

  I help run a five-day summer intensive for mathematically strong rising high-school seniors: 16 participants this year, one 90-minute block on Tuesday morning, plus an optional 25-minute follow-up slot on Wednesday, no computers in the room, nothing but index cards, markers, scissors, tape and a couple of dice. Last year I ran the MU puzzle as a live game and it went beautifully — the students could *feel* the difference between moving inside a system and reasoning about the system — but the session I built on top of it, on how a formal system can talk about itself, degenerated into me talking at them for forty minutes. They came away able to repeat that code numbers can encode statements about code numbers, with no felt sense of why the indirection does any work. So this year I want the self-replication slot to be the thing that fixes that, and I want it to be typogenetics-flavoured: strings of letters get "translated" into enzymes, and the enzymes edit other strings.

  Please design a stripped-down variant I can actually run. I have read the original typogenetics material and I do not want to use it: there are too many amino acids to keep in working memory while fifteen people are shouting at each other, and I'd rather have a tiny system with a codon table that fits on one side of an index card and can be executed by hand on paper strips. Two design constraints I care about, which are my own additions and not part of the usual setup, so please engage with them rather than quietly reverting to the standard version. First, a **quarantine rule**: an enzyme translated from a given strand may never be applied to that very strand — it can act on any other strand in the pool, including a numerically identical *different* copy. My hope is that teams will first try to build a strand that copies itself directly, hit the wall, and then discover on their own that they need a machine that copies *whatever it is handed*, together with a description of the machine handed to it as data. If you think that rule makes the puzzle trivial, or impossible, or that the failure it induces is pedagogically fake, say so and give me the variant you would actually run instead. Second, a **noise phase**: once at least one team has a working replicator, run three or four more rounds in which I roll a die and flip a single base somewhere in the pool, and score teams not on who replicated first but on whose lineage is still replicating at the end. The thing I want them to run into is the tension between describing enough machinery to get yourself copied and staying short enough to survive being copied badly — a self-description is also a target, and I want them to discover that trade-off by losing to it, not by hearing a sentence about error thresholds.

  What participants should come away seeing: that "X copies itself" is always shorthand for "X is copied by machinery that X also encodes, and that machinery has to be able to take X as data" — the same indirection that makes quines and self-referential sentences possible. Nobody should hear the words quine, Gödel, diagonal, or fixed point until the debrief, and the debrief should map specific moments in the session (the failed direct attempt, the moment a team realises it needs an intermediate strand, the moment the noise kills a long replicator) onto specific parts of that idea, including why the direct attempt *cannot* work. Give me the minute-by-minute timeline with materials, the rules as a table, three predictable failure modes with fixes (someone hand-copies a strand instead of going through an enzyme; one team finishes in four minutes and flattens the room; a team finds a degenerate replicator that exploits a loophole), and be frank about what the activity cannot reproduce — self-reproduction of this kind is much closer to self-replicating machinery than to incompleteness, and I would rather know exactly which parts I have to supply in words, and which false takeaway a bright student might walk out with, than have the activity oversell itself. I have been around the rationalist blogosphere long enough to know how loosely "self-replicating" gets thrown around, which is most of why I want them to earn the concept instead of inheriting it.

  Format: under 850 words total. Lead with one sentence naming the single thing participants will see for themselves; then the rule table; then the timeline; then the debrief mapping as a short table; then the failure modes; then the honest-limits paragraph. Tables and bullets are welcome; general remarks on the beauty of self-reference are not.
reasoning: |-
  Hmm, the user is a curriculum designer running a formal systems workshop for mathematically strong high school seniors. They've had an issue with previous sessions becoming too lecture-based when explaining self-referential systems. Now they want a stripped-down typogenetics variant that teaches self-replication through hands-on experience.

  The key constraints are:
  - Must include a quarantine rule (enzymes can't act on their own source strand)
  - Must have a noise phase (die rolls introduce mutations after replication works)
  - Rules must fit on an index card
  - Avoid complexity of original typogenetics
  - Participants should discover indirection through failure
  - No jargon until debrief

  Brainstorming three approaches:
  1. **Direct mini-typogenetics**: Like the original but simplified to 4 bases and 4 operations. Risk: Might still be too complex for hand calculation with 16 students shouting.
  2. **Binary string machines**: Use only 0/1 with codon-like triplets. Too abstract? Loses the biological metaphor that made MU puzzle engaging.
  3. **Token-based assembly**: Physical tokens representing operations. Ditched because it would feel like building IKEA furniture rather than discovering emergent behavior.

  Discarded token-based for losing computational feel, binary for losing accessibility. Mini-typogenetics wins for maintaining the biological metaphor while being computationally tractable.

  Designing the system:
  - Alphabet: A, C, G, T (4 bases)
  - Codons: 2-base pairs → simpler than original 3-base
  - Operations: Cut (C), Copy (P), Paste (S) - minimal set for replication
  - Enzyme = sequence of operations
  - Quarantine rule enforced via colored paper strips

  Predicting failure modes:
  1. Hand-copying bypass: Fix by requiring enzyme stamps on outputs
  2. Fast team dominance: Give them mutation-tracking duties
  3. Degenerate replicator: Publish enzyme code publicly

  Noise phase crucial: Forces error-resilience tradeoff. Teams with shorter replicators survive mutations better.

  Honest limitations:
  1. Doesn't show true self-application (Gödel's core move)
  2. Replication ≠ reproduction (no open-ended evolution)
  3. Fixed environment vs real-world constraints

  Debrief mapping ties concrete experiences to abstract concepts:
  - Quarantine failure → need for indirection
  - Noise deaths → description/target tension
  - Short replicator survival → error threshold principle

  Keeping total word count under 850 while packing in all operational details requires extreme compression. The enzyme table must be visually scannable, timeline paced for 90 minutes with optional extension, and failure fixes practical for chaotic classroom environment.
answer: |-
  **Participants will see that self-replication requires machinery (built from instructions) that treats those same instructions as data.**

  **Rule Table (Index Card Side):**
  | **Symbols** | **Codon** | **Operation** | **Effect** |
  |-------------|-----------|--------------|-----------|
  | Strands: `A`, `C`, `G`, `T` | `AA`      | Cut (`C`)    | Split strand here |
  | Enzymes: Ordered list of operations | `AC`      | Copy (`P`)   | Copy next *single* base |
  |             | `AG`      | Paste (`S`)  | Insert copied base(s) here |
  |             | `AT`      | **STOP**     | End enzyme |
  | *(Other codons: Ignore)* |           |              |           |
  | **Process:** 1. Translate strand top-to-bottom into enzyme (ignore untranslatable bases).<br>2. Apply enzyme *steps* to a **different** strand (Quarantine Rule). Start at strand's left. STOP ends early.<br>3. Execute operations sequentially. Copy stores base(s). Paste inserts stored data *before* current position. Cut fragments strand; enzyme continues on right fragment.<br>**Pool:** Start with `ATACAG` (makes enzyme `[P, S]`). Teams (4 groups of 4) design new strands on paper strips. Successful outputs join pool.

  **Timeline (90 mins + 25-min optional):**
  *   **0-10 min:** Frame challenge: "Build a strand that creates enzymes to make more of itself. Quarantine: Enzymes can't act on *their own* source strand."
  *   **10-20 min:** Demo rules. Apply `ATACAG`'s enzyme (`[P, S]`) to `GT`: Copy `G`, Paste before `T` → `GGT`. Show quarantine: Can't apply to `ATACAG`.
  *   **20-60 min:** **Design/Build Phase.** Groups design strands (markers, paper strips). Facilitator translates, applies enzymes to *other* pool strands (not their own!), adds valid outputs. Circulate, enforce quarantine. *Predict: Groups try direct self-desc (e.g., `[P,S]` instructions + data). It fails quarantine.*
  *   **60-75 min:** **Replication Rush.** Groups refine. Likely solution emerges: *Universal Copier* strand (e.g., `ACACACAT` → `[P, P, P, STOP]` copies 3 bases) + *Description* strand (e.g., `GTT`). Copier enzyme applied to Description outputs `GTT`. *Crucial:* Description strand encodes the Copier (`ACACACAT` = `A C A C A C A T` → `[P,P,P,STOP]`). Teams must hand Copier the Description to replicate the system.
  *   **75-85 min (Optional Wed): Noise Phase (3-4 rounds).** After a replicator works: 1. All replicating strands duplicated. 2. Roll die: 1-2=flip 1st base, 3-4=flip middle, 5-6=flip last base of a *random* strand in pool. Track lineages. *Predict:* Long Descriptions (e.g., Copier + its own Description) mutate faster than short ones.
  *   **85-90 min / Wed 25-min:** **Debrief & Scoring.** Declare teams whose replicator lineage survived noise. Transition to discussion.

  **Debrief Mapping:**
  | **Session Moment** | **Conceptual Link** |
  |-------------------|---------------------|
  | Failed direct self-description attempt | "X copies itself" is impossible; quarantine forces separation of machinery (enzyme) and data (strand it acts on). |
  | Realizing you need a Copier + Description | Machinery (Copier) built from Description *must* treat Description as data. Indirection is necessary. |
  | Noise killing long replicators | A self-description is both code and target; longer code = bigger mutation target. Error threshold trade-off. |

  **Predictable Failure Modes & Fixes:**
  1.  **Hand-Copying Bypass:** Student copies strand manually instead of applying enzyme. *Fix:* Require enzyme "stamps" (tape+marker) on outputs; only stamped strands enter pool. Enforce: "If it wasn't made by an enzyme acting on *different* data, it's not replicated."
  2.  **Fast Team Dominance:** One team solves quickly, floods pool. *Fix:* Limit teams to adding *one* new strand type per round. Use noise phase to disrupt dominance. Redirect fast team: "Now make it survive mutations with fewer bases!"
  3.  **Degenerate Replicator:** e.g., `AT` (STOP enzyme) + *nothing*. "Copying" nothing vacuously "works". *Fix:* Require enzymes to produce *non-empty* output. Clarify goal: "Replicate *specific* instructions, not just make *any* strand."

  **Honest Limits:** This shows template replication (machinery + data description), not true self-application (like quines where code *executes* itself). Gödel's core move (embedding "this statement is unprovable" *within* the system's language) remains abstract. The "machinery" here is fixed (translation rules), unlike evolving biology. Students might *overgeneralize* that all self-replication is this simple, or miss that real systems lack a centralized "pool" or facilitator. Use debrief to clarify: "This is a *model* showing why indirect description is fundamental. Real cells/viruses/quines share this core trick, but with more layers."
