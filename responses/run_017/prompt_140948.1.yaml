prompt: |-
  I'm definately trying to figure out what I actually think about when it's rational to believe something, going by my gut on some lottery- and preface-style cases. I keep hitting a pair of verdicts that seem to pull in opposite directions, and I want the principle behind the pattern — or to be told which verdict has to go.

  Case 1: A fair lottery with 1,000,000 tickets, exactly one winner. My confidence that ticket #417 will lose is 0.999999. Verdict: I believe ticket #417 will lose. Same for every individual ticket.

  Case 2: Same lottery. The claim "the first 99,999 tickets all lose" has credence 0.900001 for me. Verdict: I believe that. The claim "the first 100,000 tickets all lose" has credence exactly 0.9. Verdict: I do NOT believe that one — I withhold. The claim "all 1,000,000 tickets lose" has credence 0. Verdict: I don't believe it; I believe the negation (someone wins). So I believe each ticket loses, and I believe moderate conjunctions of tickets lose, but not the giant conjuction.

  Case 3: I write a 500-claim book. I'm 0.99 confident in each claim, and the errors are independent. Verdict: I believe claim 1, claim 2, ..., claim 500 individually. I do NOT believe the conjunction "all 500 claims are true" (credence about 0.0066). I do believe its negation, "at least one claim is false" (credence about 0.9934). So: I believe every individual claim, but I also believe the book has an error.

  Case 4 (the one I keep going back and forth on): The book has 50 chapters of 10 claims each. For any chapter, the claim "chapter n has no errors" has credence 0.99^10 ≈ 0.904. Verdict: I believe chapter 1 has no errors, I believe chapter 2 has no errors, ..., I believe chapter 50 has no errors — all 50 of them. But I do NOT believe the book as a whole has no errors (the conjunction of all 50 chapter claims); instead I believe there's an error somewhere. This feels inconsistent: if I really believe each chapter is fine, why can't I just put them together and believe the whole thing is fine? I feel a lot of pull to say yes — that's what "believing each" seems to commit me to. But my gut also says no, the whole-book claim is under 1% likely. So either I give up the idea that beliefs combine (closure), or I give up believing each chapter, or I give up believing there's an error. I want all three if I can get them, but I suspect I can't.

  Case 5 (a twist I made up to test my tentative principle): A perfect proofreader tells me the 500-claim book contains exactly one false claim, but not which one. Now each claim has credence 499/500 = 0.998, so I still believe each claim. The claim "all claims are true" has credence 0, so I'm certain there's an error. For a single chapter of 10 claims, the chance it's error-free is 490/500 = 0.98, so I believe each chapter is error-free. But the claim "the first 100 claims (ten chapters) contain no error" has credence 400/500 = 0.8. Verdict: I do NOT believe that the first 100 claims are all true, even though I believe each of the ten chapters in that block is error-free.

  My tentative principle is a threshold view: I believe p iff my credence in p is strictly greater than 0.9; and belief just isn't closed under conjunction, so from believing p and q it doesn't follow that I believe p & q, because cr(p & q) can be less than cr(p) and less than cr(q). Please test this against Cases 1–5, repair it if it's broken, or replace it with a better principle (or a small set of candidates). I want the principle stated precisely, the case that motivates each clause, its verdicts on cases I haven't considered, and an honest statement of which of my verdicts it cannot accommodate — especially whether it can save all of Case 4 or has to overturn one of my verdicts there.

  Please use American English throughout (so "realize", "organize", "behavior", etc.). Deliver your answer as a JSON object with exactly these fields:

  - "principle": string, the best single principle (or leading candidate) stated precisely.
  - "clauses": array of objects, one per clause of the principle; each object has:
      - "clause": string, the clause text,
      - "motivating_case": string, which case (e.g., "Case 2") forces this clause,
      - "what_it_predicts": string, how the clause decides that case.
  - "case_4_resolution": string, explain how the principle handles the hard pair in Case 4; say explicitly which of the three options it takes (reject closure, stop believing each chapter, or stop believing there's an error), and if it rejects closure, why that's not just ad hoc.
  - "overturned_verdicts": array of strings, each naming a verdict of mine that the principle says I have to drop, with a short reason.
  - "unlisted_cases": array of exactly two objects for cases I haven't listed; each object has:
      - "case": string, your description of a new case (keep it in the same spirit, e.g., a lottery or preface variant with different numbers),
      - "predicted_verdict": string, what the principle says I believe / don't believe,
      - "credence": string, the relevant credence if the principle uses one.
  - "cannot_accommodate": array of strings, any of my verdicts no candidate can accommodate, with a note on whether I should just drop them.

  Make sure the JSON is valid and all string values are in American English.
