answer: |-
  ### Readings  
  1. **Semantic Tautology**: The sentence "Water is H₂O" expresses a trivial linguistic truth *given our current linguistic practices*. It is necessary because "water" rigidly designates H₂O in all possible worlds where it exists, by stipulative definition post-discovery.  
  2. **Rigid Designation**: "Water" is a rigid designator for H₂O, meaning it picks out H₂O in all possible worlds where H₂O exists. The necessity arises from language-world linkage, not metaphysics.  
  3. **A Priori Necessity for Idealized Speakers**: For speakers with full knowledge of chemistry, "Water is H₂O" is knowable a priori (given the causal history of "water") and thus necessary. Ignorance at introduction is irrelevant.  
  4. **Two-Dimensional Primary Intension**: The primary intension (contextual meaning) of "water" is "the clear, drinkable liquid in our environment," which contingently picks out H₂O. The secondary intension (modal meaning) rigidly designates H₂O. Necessity applies only to the secondary intension.  
  5. **Metaphysical Essentialism**: Water *as a natural kind* has H₂O as its essential microstructure. This is a de re necessity about the substance itself, independent of language or epistemology.  
  6. **Epistemic Immunity**: Once empirical discovery establishes the identity, no future evidence can falsify "Water is H₂O," making it functionally necessary for rational agents.  
  7. **Strong Conceivability Barrier**: Any scenario where watery stuff isn’t H₂O is *inconceivable* under full descriptive specification (e.g., "H₂O-less watery stuff" is contradictory).  

  ### Verdicts  
  1. **Semantic Tautology**: Platitude. True but trivial; depends entirely on linguistic conventions.  
  2. **Rigid Designation**: Defensible (Kripkean orthodoxy). Grounded in reference-fixing mechanisms.  
  3. **A Priori Necessity for Idealized Speakers**: Doubtful. Requires controversial epistemic externalism; actual humans lack this access.  
  4. **Two-Dimensional Primary Intension**: Defensible. Captures the contingency of reference-fixing.  
  5. **Metaphysical Essentialism**: Substantive but doubtful. Assumes microstructure defines kinds, ignoring functional or historical properties.  
  6. **Epistemic Immunity**: Platitude. Once identity is known, it’s not empirically revisable—but this is trivial.  
  7. **Strong Conceivability Barrier**: Straightforwardly false. We *can* conceive of non-H₂O watery stuff (e.g., XYZ).  

  ### My Two Cases  
  **Split Lake**:  
  - *Rigid Designation*: Fails. "Water" lacks a unique referent; it might refer disjunctively (H₂O ∨ XYZ) or ambiguously. "Necessity" collapses.  
  - *Metaphysical Essentialism*: False. No single essence corresponds to "water" in this world.  
  - *Primary Intension*: Picks out the disjunction (H₂O ∨ XYZ). "Water is H₂O" is false here.  
  - *Diagnostic*: Shows necessity relies on *actual uniqueness*. If consciousness is multiply realizable, the analogy fails.  

  **Stipulated Term**:  
  - *Semantic Tautology*: True, but trivial—now a definitional truth.  
  - *Rigid Designation*: Holds, but only by fiat. No discovery needed.  
  - *Metaphysical Essentialism*: Unaffected, but reveals essentialism is detached from language.  
  - *Key Point*: In this case, "water is H₂O" is necessary *only* because of linguistic practice. The slogan’s force evaporates if necessity depends on stipulation, not worldly structure.  

  **Verdict on Cases**: Split Lake challenges readings 2, 4, and 5 by exposing dependence on uniqueness. Stipulated Term challenges 1–3 by showing necessity can be manufactured linguistically. Both undermine the slogan’s use against zombies.  

  ### Does It Do the Work?  
  Only **Metaphysical Essentialism** (reading 5) or the **Strong Conceivability Barrier** (reading 7) could *potentially* shut down the upload argument, but:  
  - Essentialism requires the **extra premise** that consciousness *is like water*—i.e., defined by microstructure. This is the core dispute, not a neutral tool.  
  - The Strong Barrier is false (as Split Lake shows), so it fails.  
  - **Crucial Gap**: The water example shows that *some* necessities are a posteriori, but *not* that conceivability is *globally unreliable*. Zombies might be conceivable because consciousness lacks a rigidly designated microstructure (unlike water). The analogy assumes physicalism, which is the very issue at stake.  
  - **Needed Premise**: Physicalism must be true *and* consciousness must be type-identical to a physical state. Water doesn’t establish this; it presupposes it for its own case.  

  ### Bottom Line  
  The slogan is ambiguous, deployed inconsistently. Its defensible readings (rigid designation, two-dimensionalism) are linguistic and don’t imply metaphysical necessities that bind consciousness. Split Lake and Stipulated Term reveal that necessity often depends on contingent linguistic or contextual factors, not deep metaphysics. To use water against zombies, you must *first* assume physicalism—rendering the argument circular. The conceivability argument stands unless independently refuted. Water is not the silver bullet it’s claimed to be.
