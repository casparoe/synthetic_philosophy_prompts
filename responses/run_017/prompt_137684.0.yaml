prompt: |-
  I've just come out of a long argument with a friend who works at a philanthropic advisory shop, and I want help reconstructing what the practice we were arguing about actually presupposes, because I suspect it is committed to more than my friend admits. The practice is the standard cause-prioritisation framework used by grantmakers in that world: candidate causes are scored along three axes — how much value would exist if the problem were solved (cashed out in something like lives saved, quality-adjusted life years, or some generic welfare unit), how much progress an additional dollar buys, and how few other resources are already flowing to the problem — and causes are then ranked by something like the product of the three. Around the scoring sits a cluster of further habits that I think matter. Evaluators decline to recommend an organisation that cannot usefully absorb the money: they ask how much room there is for additional funding, and once that room is nearly filled they move on, even though the programme itself is unchanged and still the cheapest known way to produce the good. The score of a cause goes down when other funders move into it; grantmakers say a cause has become over-subscribed and is therefore a worse bet than it was five years ago — while in the same breath running field-building programmes whose explicit aim is to attract more funders and more talent into the very causes they favour. Donors are told to concentrate everything on the single highest-scoring cause rather than to spread across several, even though everyone agrees the underlying estimates are uncertain by an order of magnitude or more. And in practice only causes that can be given a quantitative model get scored at all: considerations that resist quantification — dignity, coercion, effects on institutions or on culture, the moral significance of who exactly is helped — tend to drop out of the ranking silently rather than entering it as uncertain terms.

  The crux of our argument was the third axis. My friend said it is just a proxy for diminishing marginal returns: my dollar does less good where other dollars are already going, and the framework is only trying to approximate the marginal expected value of the next dollar. I said that cannot be the whole story, because the same variable is also being used as evidence: grantmakers routinely treat the fact that no one is working on something as a warning sign that it is not important or not tractable, and the fact that many smart people are working on something as evidence that it is. Those two roles pull in opposite directions, and I want to know whether a single scoring framework can coherently use one input both as a multiplier on value and as evidence about the other multipliers, or whether that double-counts. She then proposed a rival that I found genuinely illuminating, and I want your verdict on it: replace the third axis with what she called credit-share accounting, where a cause is scored by its importance and tractability divided by the number of funders whose cooperation the outcome requires, so that we rank by our share of the credit for a joint achievement rather than by the difference our dollar makes to how the world goes. Her claim was that the practice already secretly runs on her view and not on the counterfactual one — that the room-for-more-funding check and the concentration advice only look sensible if you think you are buying a share in an outcome rather than making a marginal difference.

  So: reconstruct the implicit theory here, and be disciplined about it. What theory of practical reasons — counterfactual difference-making, marginalism, fair-share-of-a-cooperative-venture, something else — does the practice strictly presuppose, and what does it merely sit well with? Could a non-consequentialist, or someone who thinks we should do our part rather than maximise, endorse the same scoring without inconsistency, which would show the practice is more underdetermined than it looks? Does the practice presuppose that values across radically different causes are commensurable and aggregable, and if so does it presuppose a total rather than an average, person-affecting rather than impersonal, view of aggregation? What does it presuppose about the epistemology of unmodelled effects — is the refusal to score what cannot be modelled a piece of expected-value reasoning, a sensible response to cluelessness, or simply a bias that the framework's own commitments condemn? Separately: is the advice to concentrate rather than diversify compatible with the acknowledged size of the uncertainties, or does it require risk neutrality (and if it requires risk neutrality, is that a substantive moral commitment the practice is smuggling in)? Finally, tell me which feature is doing the real work in the practice, what would have to change in grantmaking if we swapped the counterfactual view for my friend's credit-share view (be concrete: which of the four habits above would survive and which would collapse), and what the sharpest objection is that my friend should make to my charge of double-counting. Please don't answer by saying that the three-axis framework is just a heuristic for expected value — I know the framework and I know that line; I want the commitments that ride along beneath it, and where the practice is running on two theories at once.
reasoning: |-
  Okay, let me try to unpack this user's query. They had an argument with a friend about cause-prioritization in philanthropy, specifically about the third axis—how existing funding affects a cause's score. The user thinks there's an inconsistency in using that axis both as a proxy for diminishing returns and as evidence of a cause's importance or tractability. The friend proposed "credit-share accounting" as an alternative, arguing that the current practice secretly relies on this view.

  First, I need to reconstruct the implicit theories behind the standard framework. The user mentions scoring causes on three axes: scale, effectiveness, and room for funding. Then multiplying them to rank causes. The habits around this include not funding beyond absorption capacity, treating underfunded causes as better, concentrating donations, and ignoring unquantifiable factors. 

  The user’s core concern is whether the third axis is double-counting. It's used both to adjust for marginal returns (more funding means less impact per dollar) and as evidence (if others aren't funding it, maybe it's not worthwhile). The friend suggests switching to credit-share, where the score is divided by the number of funders needed. The user wants to know which theory the practice actually presupposes, if it's consistent, and what would change under credit-share.

  I should start by examining the surface commitment. The framework presents itself as counterfactual marginalism—each dollar's impact based on current conditions. But the habits suggest something else. For example, stopping funding once absorption capacity is reached implies you're buying a share of a fixed outcome, not making an additive difference. The same with treating other funders' interest as evidence—why would that matter if you're just measuring marginal impact?

  The credit-share view makes sense of these habits. If you see your donation as purchasing a share of the total outcome, then once all shares are bought, additional funding doesn't help. Also, others joining signals the cause's validity because they're co-investors. But this conflicts with the marginalist view because under marginalism, more funders could mean the problem gets solved faster or better, not that your share diminishes.

  The user also asks about deeper presuppositions: commensurability of values, epistemology of unmodeled effects, risk neutrality in concentration, etc. The framework assumes values can be quantified and aggregated impersonally. Unmodeled effects are excluded, which might be pragmatic but biases against qualitative goods. Concentration advice assumes risk neutrality despite uncertainties, which is a substantive commitment.

  Switching to credit-share would change habits. Room-for-funding checks make more sense, as do field-building programs (since more funders reduce each one's credit-share needed). But concentration might not hold; if credit-share is divisible, spreading could be better. The double-counting charge: under marginalism, using funding levels as evidence is separate from marginal adjustment, but in practice, they conflict. The friend’s rebuttal is that evidence from other funders informs tractability, not the marginal adjustment itself, but the user might see entanglement.

  I need to ensure I address all parts: implicit theories, commensurability, epistemology, risk, what changes with credit-share, and the double-counting objection. Highlight that the practice runs on both theories, causing tension. Credit-share resolves some inconsistencies but introduces new ones, like treating causes as fixed pie outcomes. The sharpest objection to double-counting is separating evidence from multiplier roles, but in habit, they merge.
answer: |-
  Your reconstruction is sharp, and your instincts are correct: the practice *does* run on conflicting theoretical commitments, and the "room for more funding" (RMF) axis is the friction point. Below is a disciplined dissection of the implicit theories, their tensions, and the consequences of swapping views. 

  ### 1. **The Practice's Core Implicit Theory: Hybrid and Unstable**
     - **Surface Commitment: Counterfactual Marginalism**  
       The framework *officially* presupposes **counterfactual difference-making** with **diminishing marginal returns**. The RMF axis functions as a *multiplier* approximating the derivative of impact w.r.t. resources:  
       `Marginal Value = Scale × Tractability × RMF`  
       Here, RMF = 1 / (current funding saturation), so high RMF implies your dollar avoids waste. Concentration follows naturally: put dollars where marginal value is highest.
     
     - **But Secretly: Credit-Share Accounting**  
       Your friend is right that key habits only cohere under **cooperative credit-claiming**:  
       - **Room-for-funding checks**: If impact is a fixed "pie" (e.g., "solving X requires $100M"), your grant buys a *share* of the pie. Once shares are sold, new money can't "buy in."  
       - **Field-building programs**: Attracting others *reduces* your credit-share needed per unit outcome. Under marginalism, more funders might *increase* total impact (e.g., faster progress), but here it *dilutes* your claim.  
       - **Other funders as evidence**: Under credit-share, absent funders signal a cause isn't "creditworthy" (low importance/tractability). Under marginalism, their absence should *boost* your marginal value.  
       This hybrid is unstable: **RMF acts as both a *multiplier* (marginalism) and a *signal* (credit-share)**, creating double-directional pressure.

  ### 2. **Compatibility with Non-Consequentialism? Only Superficially**
     - A **"do your part" deontologist** could endorse credit-share: you contribute your fair share to a collective duty.  
     - But the framework’s **aggregative commensurability** undermines this:  
       - **Totalism, not person-affecting**: Scoring requires *summing* welfare gains impersonally (e.g., QALYs). A person-affecting view (helping identifiable individuals) would reject trading off causes where "winners" and "losers" are incommensurable.  
       - **Commensurability smuggled in**: Quantification forces all goods onto one scale ("utils"). Dignity/culture drop out not because they lack value, but because they resist *aggregation* under the model.  
     - **Verdict**: Non-consequentialists can use the *heuristic* but not the *ethics*. The scoring’s structure presupposes maximized aggregate welfare.

  ### 3. **Epistemology of Unmodelled Effects: Bias Disguised as Pragmatism**
     - **Refusal to score unquantifiables** is *not* sound expected-value reasoning. It’s a **revealed bias toward modelable uncertainty**:  
       - Quantifiable causes (e.g., bednets against malaria) let you compute "variance" in expected value. Unquantifiables (e.g., institutional corrosion) are "deep uncertainty" (ambiguity).  
       - The practice treats deep uncertainty as *zero* rather than *non-parametric uncertainty*. This contradicts its own commitment to expected value, which would require assigning probability distributions to qualitative effects.  
       - **Presupposition**: Only modelable interventions are "tractable" in principle. But this confuses *measurement* with *tractability*.

  ### 4. **Concentration vs. Uncertainty: Risk Neutrality Assumed**
     - **Concentration advice** only makes sense under **risk neutrality**:  
       - If impact estimates have order-of-magnitude uncertainty (e.g., Cause A: 1–100 utils/$, Cause B: 2–200 utils/$), diversifying *reduces portfolio variance*.  
       - Concentration is optimal *only* if:  
         (a) You’re risk-neutral (only expected value matters), *or*  
         (b) Correlations between cause impacts are ~1 (unlikely).  
     - **Smuggled commitment**: Philanthropy should maximize expected value *without aversion to model uncertainty*. This is substantive (e.g., rejects precautionary principles).

  ### 5. **Swapping to Credit-Share: Concrete Changes**
     If RMF is replaced by **credit-share** (impact / # funders required):  
     - ✅ **Survives**:  
       - Room-for-funding checks (natural cap on "shares").  
       - Field-building (more funders → smaller share needed per outcome).  
       - Other funders as *evidence* (validates cause quality).  
     - ❌ **Collapses**:  
       - **Concentration advice**: Credit-share encourages *spreading* if causes require many funders (you can "buy in" cheaply everywhere). Marginalism requires piling on the highest-margin cause.  
       - **Marginal progress focus**: Credit-share cares about *total* impact, not your *addition*. A dollar in a saturated cause still earns credit if the outcome occurs.  

  ### 6. **Sharpest Rebuttal to Your Double-Counting Charge**
     Your friend’s best retort:  
     > *"The RMF multiplier and evidentiary role are epistemically distinct. The multiplier adjusts for current saturation; the evidence informs priors about* tractability/scale *in a Bayesian update. We use low current funding as* data *to revise our estimates of tractability (e.g., ‘if this were easy, others would fund it’). Once revised, we apply the RMF multiplier to the* updated *estimate. No double-counting—it’s sequential learning."*  
     
     **Why it’s strong**: It isolates the RMF axis as purely a saturation adjustor, while the "evidence" role updates other parameters. But it fails in practice because:  
     - Field-building seeks to *attract funders to high-priority causes*, which *lowers* RMF scores under marginalism—a self-sabotaging act if RMF is purely a multiplier.  
     - Credit-share resolves this: attracting funders *raises* evidence quality *and* reduces your credit-share burden.

  ### The Real Workhorse: Credit-Share in Practice, Marginalism in Theory
  The practice **strictly presupposes credit-share accounting** operationally (due to habits like absorption caps and field-building), while **paying lip service to counterfactual marginalism**. This creates tension:  
  - **Marginalism** explains *concentration* and *avoiding diminishing returns*.  
  - **Credit-share** explains *treating funder interest as evidence*, *field-building*, and *absorption limits*.  

  The framework’s fragility stems from using one metric (RMF) to serve two masters. Credit-share alone *could* unify the habits, but at the cost of abandoning concentration—which is why the practice clings to marginalist language. The "double-counting" is a symptom of this deeper incoherence.

  **Final verdict**: Your friend’s credit-share view better explains the *actual* habits, but the practice won’t admit it because it would force a reckoning with the anti-diversification stance. The unresolved tension reveals philanthropy’s unease with being seen as purchasing "shares" in outcomes rather than "saving lives."
