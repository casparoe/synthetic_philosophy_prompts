  **Scoring**:

  We assign each leaf a characteristic pattern. Then, for a student, count the number of matches for each leaf and assign the leaf with the highest match. If tie, note mixed.

  **Confidence and Limitations**:

  - **Confidence in discrimination**: 
    - Most questions are designed to be sensitive to the distinctions. For example:
      - Q2: A (CiC rigorist) vs B (Con or FoH) vs C (FoH).
