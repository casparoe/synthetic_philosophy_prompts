       - Q2: B (if they specify the maxim as lying to a murderer)
       - Q3: B or C
       - Q4: C
       - Q8: B
       - Q9: B or C

  6. **Sceptic (Scep)**: Believes the universal law formula gives no clear guidance.
     - Awkward commitment: Must explain why Kant thought it was central.
     - Expected pattern: 
       - Might choose permissive options in many cases, or options that deny the contradiction.
       - Q1: C
