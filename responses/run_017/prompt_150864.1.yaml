answer: |-
  Below is a diagnostic quiz designed to map students' implicit interpretations of Kant's universalizability test onto distinct philosophical "leaves" (interpretive positions). The quiz isolates key choice points in applying the formula of universal law—without using technical terms or signaling which reading an option aligns with. Each question presents a concrete case or maxim with answer options reflecting genuine forks in the universalization procedure. The scoring key (after the quiz) groups answer patterns into six leaves, notes limitations, and highlights awkward commitments.

  ---

  ### **Kantian Universalizability: Diagnostic Quiz**  
  **Instructions**: For each scenario, select the option that best reflects your judgment of whether the action is morally permissible. Answer based on your intuitive understanding of universal moral principles, *not* on prior knowledge of Kantian ethics. Choose one option per question.

  1. **The False Promise**  
     You need money and consider making a false promise to repay a lender, knowing you can't.  
     - A) This is wrong because if *everyone* did this, no one would trust promises, making your own promise useless.  
     - B) This is wrong because it manipulates the lender—you’re treating them as a tool for your gain.  
     - C) This might be acceptable if your situation is desperate, since not everyone needs to make false promises at once.  

  2. **Lying to the Murderer**  
     A killer asks if their victim is hiding in your home (they are). You lie to protect them.  
     - A) Lying is wrong here: if everyone lied when they thought it justified, truth-telling would collapse.  
     - B) Lying is permissible: the killer’s immoral intent voids their right to the truth.  
     - C) Lying is wrong—not because of universalizability, but because it violates the victim’s humanity by risking their fate if discovered.  

  3. **The Ad-Blocker Maxim**  
     You use an ad-blocker because your individual choice doesn’t affect website revenue.  
     - A) This is wrong: if *enough* people did this, free content would vanish, harming everyone.  
     - B) This is permissible: your choice has no real impact, and even if all did it, the internet would adapt (e.g., paywalls).  
     - C) This is wrong because you benefit from a system you’re unwilling to support fairly.  

  4. **Universal Deference**  
     You always let others go first (e.g., through doors), insisting they take priority.  
     - A) This is wrong: if *everyone* deferred, society would deadlock—no one could act.  
     - B) This is permissible: a world of mutual deference is harmonious, even if rare in practice.  
     - C) This is wrong because it forces others into decisions they might not want.  

  5. **Kidney Donation to a Stranger**  
     You donate a kidney to a stranger in need.  
     - A) This is permissible and admirable, but not required—it goes beyond duty.  
     - B) This is wrong: if *everyone* did this, we’d face unbearable burdens, making society unsustainable.  
     - C) This is required: refusing would deny the stranger’s basic worth.  

  6. **Eating Animals**  
     You eat meat, reasoning that animals lack reason and can’t participate in morality.  
     - A) This is permissible: universalizing this affects only non-rational beings, so no contradiction arises.  
     - B) This is wrong: it treats sentient creatures as mere resources, ignoring their inherent value.  
     - C) This is permissible because humans have always done it—no practice is undermined.  

  7. **Discounted Future Generations**  
     You avoid costly climate action, reasoning that future people can’t affect you now.  
     - A) This is wrong: if *everyone* did this, humanity would perish—we couldn’t accept such a world.  
     - B) This is permissible: future people aren’t here to reciprocate, so universalization doesn’t apply.  
     - C) This is wrong because it fails to respect future people as ends in themselves.  

  8. **The Trivial Promise-Breaker**  
     You skip a coffee meeting with a friend after promising, because you’re tired.  
     - A) This is wrong: if *enough* people broke trivial promises, trust in all commitments would erode.  
     - B) This is permissible: since the promise is minor, universalizing this wouldn’t destroy promising.  
     - C) This is wrong because you’re using your friend for convenience without regard for their time.  

  9. **The Non-Voter**  
     You don’t vote, believing your single vote won’t change an election.  
     - A) This is wrong: if *enough* people abstained, democracy would fail, harming everyone.  
     - B) This is permissible: since most people vote, your choice has no effect, and universal non-voting is unlikely.  
     - C) This is permissible—if everyone abstained, we might develop a better system.  

  10. **Benefiting from Discrimination**  
      You accept a job knowing the employer discriminates against a group, but you don’t endorse it.  
      - A) This is wrong: if *everyone* accepted such benefits, discrimination would persist unchallenged.  
      - B) This is permissible: your action doesn’t directly cause harm, and universalizing it wouldn’t defeat any purpose.  
      - C) This is wrong because it profits from treating others as mere means.  

  ---

  ### **Scoring Key and Interpretive Leaves**  
  **How to score**: Tally the student’s most frequent answer pattern. Each "leaf" represents a distinct interpretation of the universalizability test. No leaf is perfectly aligned with Kant—each has an "awkward commitment" (a philosophical weakness).  

  1. **Contradiction-in-Conception (CiC) Reader**  
     - **Core belief**: A maxim fails if universalizing it creates a *logical or practical contradiction* (e.g., the practice becomes impossible).  
     - **Answer pattern**: Mostly **A** (esp. Q1, Q2, Q3, Q4, Q8, Q9). Rejects exceptions (rigorist).  
     - **Awkward commitment**: Must condemn lying to the murderer (Q2A) even to save a life.  
     - **Latitude note**: Rigorism is inherent here; no room for exceptions.  

  2. **Purpose-Frustration (PF) Reader**  
     - **Core belief**: A maxim fails if universalizing it *defeats the agent’s own goal* (e.g., false promises fail because you couldn’t succeed if all did it).  
     - **Answer pattern**: **A** on cases where self-defeat is clear (Q1A, Q3A, Q8A, Q9A), but **B/C** on cases without self-defeat (Q2B, Q6A, Q7B).  
     - **Awkward commitment**: Permits non-self-defeating harms (e.g., Q7B allows discounting future people if it doesn’t frustrate *your* purpose).  
     - **Latitude note**: Latitude emerges naturally; actions without self-defeat pass.  

  3. **Contradiction-in-Will (CiW) Reader**  
     - **Core belief**: A maxim fails if a *rational will would reject* the universalized world—even if conceivable (e.g., a world without mutual aid is unsustainable).  
     - **Answer pattern**: **A** on welfare/reciprocity cases (Q5B, Q7A, Q10A), **B** on others (Q2B, Q6A). Avoids logical contradictions (not CiC).  
     - **Awkward commitment**: Relies on contested claims about what a "rational will" rejects (e.g., Q5B assumes no one could will universal sacrifice).  

  4. **Formula of Humanity (FoH) Reader**  
     - **Core belief**: Universalizability is empty; the *real work* is done by treating persons as ends (Formula of Humanity).  
     - **Answer pattern**: Mostly **B/C** across cases (Q1B, Q2B/C, Q5C, Q6B, Q7C, Q8C, Q10C). Rejects coordination tests.  
     - **Awkward commitment**: Effectively abandons the universal law formula despite Kant’s emphasis.  

  5. **Constructivist (Con) Reader**  
     - **Core belief**: The test’s outcome depends on *how the maxim is specified*. No "correct" description exists.  
     - **Answer pattern**: **B** or **C** emphasizing context (Q2B, Q3B, Q4B/C, Q6C, Q8B, Q9B/C). Permissive on quorum/adaptation.  
     - **Awkward commitment**: Risks moral relativism (e.g., Q3B allows free-riding by redefining impacts).  

  6. **Sceptic (Scep) Reader**  
     - **Core belief**: The formula is *under-specified* and gives no clear guidance; results are arbitrary.  
     - **Answer pattern**: **B** or **C** denying contradictions (Q1C, Q3B, Q4B, Q5A, Q6A, Q7B, Q9B). Permissive or inconsistent.  
     - **Awkward commitment**: Makes Kant’s central ethical tool seem useless.  

  ---

  ### **Limitations and Notes**  
  - **Indistinguishable pairs**:  
    - **CiC vs. PF**: Hard to separate in cases like Q1 or Q8 (both often choose A). PF readers may accept latitude where self-defeat is absent (e.g., Q7B), while CiC does not.  
    - **FoH vs. CiW**: Overlap in welfare cases (Q5, Q7, Q10). FoH prioritizes dignity (C-options); CiW focuses on rational sustainability (A-options).  
  - **Unoccupied combinations**:  
    - **Rigorist FoH/Con**: FoH and Con readers naturally embrace latitude. A rigorist reading that *also* relies on humanity (e.g., always choosing C) is unattractive—it demands extreme duties (e.g., Q5C requires kidney donation) without coordination constraints.  
    - **CiW sceptic**: Denying rational will’s content while invoking it is incoherent.  
  - **Rigorism vs. Latitude**: As predicted, this cuts across leaves:  
    - Rigorism: Central to CiC, optional for CiW/FoH.  
    - Latitude: Central to PF/Con/Scep, possible for CiW/FoH.  
  - **Confidence in Questions**:  
    - High discrimination: 9/10 questions robustly separate leaves (e.g., Q2 separates CiC rigorists from others; Q5 separates CiW from FoH/Con; Q7 separates PF/Scep from CiW/FoH).  
    - **Least confident question**: Q6 (Eating Animals). Options may reflect temperament (e.g., vegetarianism) more than interpretive differences. Scep/FoH/PF/Con all permit meat-eating (A/C), but for different reasons.  
  - **Contested leaf placement**:  
    - **Purpose-Frustration**: Kant specialists may argue this *is* CiC (Kant’s false promise example). Treating it as distinct highlights the "agent-relative purpose" fork.  
    - **Constructivist**: Some deny this is a legitimate Kantian reading, but it captures your decision-theorist’s point about maxim specification.  

  ---

  ### **Closing Design Note**  
  This quiz diagnoses *interpretive divergences*, not temperament. Each question isolates a fork in universalization (e.g., quorum vs. everyone, purpose-defeat vs. inconceivability). I’m >90% confident the quiz discriminates readings, except Q6 (as noted). A Kant specialist would most sharply contest **PF as a distinct leaf**—but your students’ "quietly running different tests" justifies isolating it. Use this to spark debate: "Why do we all use Kant’s vocabulary yet disagree?"
