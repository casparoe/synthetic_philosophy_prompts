       - Q6: B
       - Q7: C
       - Q8: C
       - Q10: C

  5. **Constructivist (Con)**: Believes the test is about the agent's own commitment and how they specify the maxim.
     - Awkward commitment: The test becomes highly sensitive to how the maxim is described, which might lead to relativism.
     - Expected pattern: 
       - Might be more permissive in many cases because they can specify the maxim narrowly. 
