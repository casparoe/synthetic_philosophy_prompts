  This quiz is designed to reveal the underlying principles students use when applying the universalizability test. The questions are based on classic and new cases that probe the choice points in the test. The scoring key provides a mapping to six interpretations, each with an awkward commitment to highlight the trade-offs. The quiz may not perfectly separate every pair of leaves (e.g., CiC and CiW might be close on many cases, but Q5 and Q7 are key discriminators). The leaf placements are based on standard scholarly debates, but a specialist might contest whether the purpose-frustration and constructivist readings are sustainable in a Kantian framework.

