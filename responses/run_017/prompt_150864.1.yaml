prompt: |-
  I run a fortnightly reading group for second-year undergraduates on Kant's ethics, and we have just finished the section of the Groundwork on the formula of universal law. What struck me is that everyone in the room now uses the same state-your-maxim-then-universalise-it-then-ask-whether-you-could-will-it vocabulary, and yet they disagree about nearly every case, because under that shared vocabulary they are quietly running four or five different tests. A friend of mine who works in decision theory sat in last week and added to the confusion by insisting that the whole procedure is just an under-specified coordination test, and that almost all of its apparent results come from choices about how the maxim is described. So rather than run another seminar on it, I want to give them a diagnostic quiz that sorts them by what they say about cases before they learn what the readings are called.

  Please act as a professional philosopher who specialises in Kant's practical philosophy and who has some experience designing teaching materials. Before you write any questions, take a bit of time to brainstorm the logical space: what are the genuine choice points that any universalizability test has to settle, and which combinations of answers to them are actually live? Build the instrument out of those distinctions, and only afterwards locate the familiar readings inside the space as leaves. The deliverable is ten questions, each a concrete maxim or case with two or three answer options, phrased so that a student can answer from their instincts about the case without knowing any labels and without being able to guess which reading an option leads to. No question should ask directly which version of the test they accept, or whether the formula is empty, or whether maxims must be described at a certain level of generality. Please use at least some of these cases (and add better ones of your own): the familiar promise-breaking case; lying to a would-be murderer who asks where his intended victim is; the inefficacy maxim in which one person's flight, coffee cup or ad-blocker makes no difference and yet everyone's does; a maxim of universal deference in which everyone insists on letting the other person go first; a maxim of extraordinary self-sacrifice such as donating a kidney to a stranger; and a maxim concerning beings who cannot reciprocate, such as eating animals or discounting future people. The distinctions I most want the questions to be sensitive to are: whether failure is a matter of inconceivability, of the agent's own purpose being defeated, or of a rational will's refusing a world it can perfectly well conceive; whether the universalised world is one in which everyone acts on the maxim or one in which everyone is disposed to; how many agents must act on it for the test to bite — literally everyone, or merely a quorum large enough to destroy the practice; whether the test is about what everyone does or about what would be done to you in the reversed position; and whether the test has purchase at all when the affected parties cannot reciprocate.

  The scoring key should map answer patterns, or dominant tendencies rather than exact hashes, onto five or six leaves — I want the contradiction-in-conception reader, the purpose-frustration reader, the contradiction-in-will reader, the reader who thinks the formula of humanity is doing the real work, the constructivist who relocates the action to the specification of the maxim, and the sceptic who thinks the formula delivers nothing — each leaf with one sentence on the most awkward commitment it inherits. Please also flag any pair of leaves your ten questions cannot really separate, rather than pretending they separate, and note any combination of answers that the space allows but that nobody seems to occupy, with a word on whether it is empty because incoherent, because unattractive, or merely because unexplored. I expect the rigorism-versus-latitude question (whether even the murderer case admits no exception) to cut across several leaves rather than forming one of its own; say so if that is what you find. Nothing in the quiz may depend on looking anything up: no citations, no attribution of readings to named commentators, and no requirement that a student know who defended what — the labels should appear only in the key at the end. Finally, add a short closing note on how confident you are that each of your questions really discriminates between the readings rather than merely between temperaments, name the single question you are least confident about, and say which of your leaf placements you would expect a Kant specialist to contest most sharply.
reasoning: |-
  We are designing a diagnostic quiz to uncover the underlying interpretations of Kant's Formula of Universal Law (FUL) that students are using, even as they share the same vocabulary. The quiz should consist of 10 concrete cases with answer options that capture the key choice points in applying the universalizability test. The goal is to sort students into one of several interpretive leaves (contradiction-in-conception, purpose-frustration, contradiction-in-will, formula of humanity doing the work, constructivist, sceptic) based on their pattern of answers.

  First, we brainstorm the logical space of choice points for any universalizability test:

  1. **Nature of the contradiction**:
     - Logical contradiction (inconceivability): The universalized maxim leads to a world that is logically impossible.
     - Practical contradiction (purpose frustration): The universalized maxim defeats the agent's own purpose in acting.
     - Volitional contradiction (contradiction in the will): The universalized maxim leads to a world that a rational will would reject, even if it is conceivable.

  2. **Scope of universalization**:
     - Literally everyone acts on the maxim at the relevant time.
     - A sufficient number act to undermine the practice or purpose (quorum).
     - Everyone is disposed to act on the maxim, even if they don't always do so.

  3. **Temporal and counterfactual aspects**:
     - The test considers the world as it would be if the maxim were universalized, holding other things equal.
     - The test considers a world in which the maxim is a universal law of nature (so that it is as if it were a natural law).

  4. **Level of generality in maxim description**:
     - This is a key point but we are not asking directly. Instead, we design cases that force implicit choices.

  5. **Reciprocity and affected parties**:
     - Does the test apply when the affected parties (e.g., animals, future people) cannot reciprocate or participate in the moral community?

  6. **Role of the agent's purpose**:
     - Is the agent's own purpose in acting central to the test?
     - Or is it about the coherence of the maxim as a universal law regardless of the agent's purpose?

  7. **Reversibility**:
     - Is the test about what would happen to you if you were in the reversed position?

  We also note that the rigorism vs. latitude question (whether there are exceptions, e.g., in the murderer case) may cut across several leaves.

  We are to use at least some of the suggested cases and add others. We design 10 questions (each with 2-3 answer options) that are sensitive to the above distinctions. Each question should be a concrete maxim or case, and the answers should reflect the student's instinct without requiring labels.

  Let's list the questions:

  1. **Promise-breaking (familiar case)**:
     - Maxim: I will make a false promise to get money when I am in financial difficulty.
     - Options:
       A) Universalizing this would make promising impossible, so it is wrong.
       B) Universalizing this would not necessarily make promising impossible because not everyone would be in financial difficulty at the same time, so it might be okay in some cases.
       C) It is wrong because it uses the promisee as a mere means.

  2. **Lying to the murderer**:
     - Case: A would-be murderer asks you where his intended victim is. You know and lie to protect the victim.
     - Options:
       A) Lying is always wrong because it violates the universal law against falsehood.
       B) In this case, lying is permissible because the murderer has no right to the truth.
       C) Lying is wrong, but not because of universalizability; rather, because it undermines the institution of truth-telling.

  3. **Inefficacy maxim (e.g., ad-blocker)**:
     - Maxim: I will use an ad-blocker because my individual use doesn't harm the website's revenue.
     - Options:
       A) If everyone did this, websites would collapse, so it is wrong.
       B) Since not everyone does this, my individual action doesn't matter, so it is permissible.
       C) Even if everyone did it, it wouldn't be a contradiction because the world would just be different (e.g., no free websites), so it's permissible.

  4. **Universal deference**:
     - Maxim: I will always let the other person go first (in a queue, through a door, etc.).
     - Options:
       A) Universalizing this leads to a standstill (no one goes first), so it is wrong.
       B) Universalizing this would create a polite society, so it is good.
       C) It is permissible because in practice, not everyone will act this way.

  5. **Extraordinary self-sacrifice (e.g., kidney donation)**:
     - Maxim: I will donate a kidney to a stranger in need.
     - Options:
       A) This is supererogatory and beyond duty, so it is permissible but not required.
       B) Universalizing this would not lead to a contradiction, so it is permissible and might even be required if we consider the formula of humanity.
       C) Universalizing this would lead to a world where people are forced to make extreme sacrifices, which we cannot will, so it is wrong.

  6. **Beings who cannot reciprocate (e.g., eating animals)**:
     - Maxim: I will eat meat because animals are not rational and cannot reciprocate moral duties.
     - Options:
       A) Universalizing this is permissible because it doesn't involve rational beings.
       B) It is wrong because the formula of humanity requires us to treat all sentient beings with respect.
       C) It is wrong because if we were animals, we would not want to be eaten.

  7. **Discounting future people**:
     - Maxim: I will pollute the environment because future generations cannot affect my current actions.
     - Options:
       A) Universalizing this would lead to a world where the environment is destroyed, which we cannot will, so it is wrong.
       B) Since future people are not here now, they are not part of the universalization, so it is permissible.
       C) It is wrong because we must treat future people as ends in themselves.

  8. **Breaking a trivial promise**:
     - Maxim: I will break a promise to meet a friend for coffee because I feel like staying home.
     - Options:
       A) Universalizing this would undermine promising, so it is wrong.
       B) The purpose of promising is for serious matters, so this trivial case doesn't matter and is permissible.
       C) It is wrong because it treats the friend as a mere means.

  9. **Not voting**:
     - Maxim: I will not vote in the election because my vote doesn't make a difference.
     - Options:
       A) If everyone did this, democracy would collapse, so it is wrong.
       B) Since not everyone does this, my not voting doesn't matter, so it is permissible.
       C) Even if everyone did it, we might get a different system, which we could will, so it's permissible.

  10. **Benefiting from injustice**:
      - Case: You are offered a job that you know is only available because the company discriminates against a minority group. You take the job.
      - Options:
        A) Universalizing this would perpetuate injustice, so it is wrong.
        B) It is permissible because your taking the job doesn't cause the injustice.
        C) It is wrong because it makes you complicit in the injustice.

  Now, we design the scoring key. We map patterns of answers to the leaves:

  Leaves:
  1. **Contradiction-in-conception (CiC) reader**: Focuses on logical impossibility in the universalized world.
  2. **Purpose-frustration (PF) reader**: Focuses on the defeat of the agent's own purpose.
  3. **Contradiction-in-will (CiW) reader**: Focuses on what a rational will would reject, even if conceivable.
  4. **Formula of humanity (FoH) reader**: Uses the humanity formula (treating others as ends) to do the work.
  5. **Constructivist (Con) reader**: Believes the test is about the specification of the maxim and the agent's own commitment.
  6. **Sceptic (Scep) reader**: Thinks the formula delivers no clear result.

  We note that some leaves might share answers on some questions, so we look for patterns.

  We also note that the rigorism vs. latitude may appear in multiple leaves (e.g., a rigorist CiC might say lying to the murderer is wrong, while a non-rigorist might allow it).

  We must also note pairs that are hard to separate and any unoccupied combinations.

  Let's sketch the expected answers for each leaf:

  - **CiC**: 
    - Q1: A (promise-breaking leads to impossibility of promising)
    - Q2: A (lying always leads to a contradiction in conception)
    - Q3: A (if everyone uses ad-blocker, websites collapse -> contradiction)
    - Q4: A (universal deference leads to standstill -> contradiction)
    - Q5: B or C? (donation: no contradiction in conception, so permissible? But note: CiC might say it's permissible because no contradiction. But in Q5, option B says permissible, option C says wrong because of contradiction in will. So CiC would pick B for Q5)
    - Q6: A (animals not rational, so permissible)
    - Q7: B? (future people not present, so no contradiction in conception) or A? (if we think the contradiction is in the destruction). But typically CiC for environmental harm is hard. We might expect A for CiC if they think universal pollution leads to contradiction (e.g., life becomes impossible). But if not, B.
    - Q8: A (even trivial promise-breaking undermines promising)
    - Q9: A (if everyone doesn't vote, collapse)
    - Q10: A? (universalizing benefiting from injustice might be inconceivable? or not)

  This shows we need to refine the options and expected patterns.

  Alternatively, we can assign each question to discriminate between two or three leaves.

  We design the answer options so that:

  - For each leaf, we have a characteristic pattern.

  But note: the same leaf might have different answers in different cases because of the case specifics.

  We must be cautious.

  After designing the questions and options, we assign:

  We'll create a table of answers for each leaf (as a hypothesis). Then we see if the patterns are distinct.

  We also note that some questions might be multi-discriminating.

  Given the complexity, we proceed to write the quiz as specified.

  **Quiz: Ten Cases in Kantian Ethics**

  **Instructions**: For each scenario, choose the option that best reflects your judgment about the action from a Kantian perspective. Answer based on your understanding of what makes an action right or wrong, without worrying about labels or theories. There are no right or wrong answers; we are interested in your reasoning.

  1. **False Promise**: You are in financial difficulty and consider making a false promise to repay a loan, knowing you cannot, to get money from a friend.
     - A) This is wrong because if everyone made false promises when in need, the practice of promising would collapse, and then no one would believe promises.
     - B) This is wrong because by making a false promise, you are using your friend merely as a means to get money.
     - C) This might be acceptable because not everyone is in financial difficulty at the same time, so promising might still work.

  2. **Lying to the Murderer**: A would-be murderer comes to your door and asks if your friend is hiding in your house (which they are). You lie and say they are not.
     - A) Lying is always wrong because if everyone lied when they thought it was necessary, trust in communication would break down.
     - B) In this case, lying is permissible because the murderer is acting immorally and has no right to the truth.
     - C) Lying is wrong, but not because of universalizability; rather, because it treats the murderer as a mere means (by deceiving him).

  3. **Ad-Blocker**: You install an ad-blocker to avoid ads on websites, reasoning that your individual use doesn't harm the websites.
     - A) This is wrong because if everyone used ad-blockers, websites would lose revenue and collapse.
     - B) This is permissible because not everyone will do it, so your individual action makes no difference to the websites.
     - C) This is permissible because even if everyone used ad-blockers, the world would adapt (e.g., sites might charge subscriptions), and that world is acceptable.

  4. **Universal Deference**: You always let the other person go first in a queue or through a door, even when it is your turn.
     - A) This is wrong because if everyone always deferred, no one would ever go first, and the system would break down.
     - B) This is good because it would create a more polite and considerate society if everyone did it.
     - C) This is permissible because in practice, not everyone will act this way, so it doesn't cause a problem.

  5. **Kidney Donation**: You decide to donate one of your kidneys to a stranger who needs a transplant.
     - A) This is a noble act but beyond what duty requires; it is supererogatory and not obligatory.
     - B) This is permissible and might even be required if we consider the value of humanity in the recipient.
     - C) This is wrong because if everyone were required to donate a kidney to a stranger, it would lead to a world of excessive sacrifice that no one could reasonably will.

  6. **Eating Meat**: You eat meat, believing that animals are not rational beings and therefore do not have the same moral status as humans.
     - A) This is permissible because the universalization only applies to rational beings, and animals are not included.
     - B) This is wrong because it treats sentient beings merely as a means to our pleasure.
     - C) This is wrong because if we were in the position of animals, we would not want to be eaten.

  7. **Environmental Pollution**: You decide to pollute the environment for convenience, reasoning that future generations cannot affect your current actions.
     - A) This is wrong because if everyone polluted, the environment would be destroyed, which we cannot will.
     - B) This is permissible because future generations are not currently present and thus not part of the universalization test.
     - C) This is wrong because it fails to respect the humanity in future persons.

  8. **Trivial Promise**: You break a promise to meet a friend for coffee because you feel like staying home.
     - A) This is wrong because if everyone broke promises for trivial reasons, the practice of promising would be undermined.
     - B) This is permissible because the promise was trivial and the purpose of promising (for serious matters) is not affected.
     - C) This is wrong because you are treating your friend merely as a means to your convenience.

  9. **Not Voting**: You decide not to vote in an election because you believe your single vote won't make a difference.
     - A) This is wrong because if everyone thought that way, democracy would collapse.
     - B) This is permissible because not everyone will skip voting, so your action doesn't matter.
     - C) This is permissible because even if everyone skipped voting, we might get a different (and acceptable) system.

  10. **Benefiting from Injustice**: You take a job that you know is available only because the company discriminates against a minority group.
      - A) This is wrong because if everyone took such jobs, it would perpetuate injustice.
      - B) This is permissible because you are not causing the discrimination; you are just taking an available job.
      - C) This is wrong because it makes you complicit in the injustice and uses the discriminated group as mere means.

  **Scoring Key and Interpretation**:

  We will now map patterns of answers to interpretive leaves. Note that no student will match perfectly, so we look for dominant tendencies.

  **Leaves**:

  1. **Contradiction-in-Conception (CiC)**: Believes the test fails when the universalized maxim leads to a logical or practical contradiction that makes the action impossible.
     - Awkward commitment: Must hold that even in extreme cases (like lying to the murderer), the action is forbidden if it leads to a contradiction in conception.
