  This is why we need to look at patterns.

  3. **Contradiction-in-Will (CiW)**: Believes the test fails when the universalized maxim leads to a state of affairs that a rational will would reject, even if it is conceivable.
     - Awkward commitment: Must explain why we cannot will certain things (e.g., a world without mutual aid) without falling back on desires.
