prompt: |-
  You are a professional philosopher who also does clinical ethics consultation — please take this seriously and think it through properly. Before you write anything, brainstorm the strongest version of each side (I want the argument I disagree with in its best form, not a strawman), and then give me the finished document only, I dont need to see the brainstorming.

  I sit on the research ethics committee at my hospital and we have to rule on a first-in-human gene therapy trial for adults born with complete achromatopsia — no colour vision from birth, otherwise usable-ish acuity. It's injected into one eye only, and the primary endpoint isn't acuity, it's whether participants can be trained to reliably discriminate hues.

  Here's why this has gotten under my skin: my kid brother has achromatopsia and he enrolled last month. So Ive declared the conflict, I'm drafting the memo and I won't be voting on it — which also means it has to hold up in front of people who are watching for me to go soft on it.

  The problem none of us named but everyone danced around: our consent form is supposed to tell people what they're getting into, and the central thing this trial gives you is the one thing you can't tell someone. You can hand them the wavelength numbers, you can say 'this is what red looks like to other people', you can show them a colour chart — and if the Mary's room / knowledge argument setup is anywhere near right, none of that transmits what they'd actually be gaining. (Or what they'd be losing: a couple of people in the earlier-phase work described gaining the new sense as disorienting and grief-ish rather than a clean win.) So: is informed consent for this trial possible even in principle, or is that a confusion — maybe all consent runs on description-plus-trust and this is just a vivid case of the ordinary thing?

  Two more wrinkles. The sponsor noticed this and proposed a fix: before consent, candidates wear a sensory-substitution device for a month that turns hue differences into distinguishable sounds, so they've had *an* experience of the distinction before they sign. Half of us think that's clever, half think its theatre. Separately, an advocacy group of adults with achromatopsia wrote to us saying the trial frames them as defective and that the real ask is funding for accessible design work instead; one committee member has gone pretty far down that road.

  What I need: draft the memo I circulate — approve, reject, or approve with conditions. If conditions, make them things the sponsor could actually implement and we could actually audit. Clear recommendation up top, then the reasoning, and give the losing side the strongest thing it has going for it, stated well enough that someone who holds it would recognise it as their own. If you think the substitution device is the crux, say so and say what we should do about it. One page, 600 words hard ceiling. And dont spend any of it explaining the knowledge argument to me — I've read the basics.
reasoning: |-
  Okay, the user is a research ethics committee member drafting a memo about a gene therapy trial for achromatopsia. They've recused themselves because their brother is enrolled, but need to present a balanced case that withstands scrutiny. 

  First, the core ethical dilemma jumps out: Can true informed consent exist when the intervention's primary benefit—color vision—is qualitatively indescribable to someone who's never experienced it? The Mary's room thought experiment looms large here. 

  Hmm... the sponsor's sensory substitution device proposal is fascinating. It attempts to bridge the explanatory gap by giving participants proxy experience of color distinction through sound. But is that translation accurate? Or just psychological theater? The advocacy group's critique about framing disability adds another layer—this isn't just about consent mechanics but societal values.

  Let me structure this carefully. For approval to hold water, I must:
  - Acknowledge the consent paradox head-on without getting stuck in philosophical quicksand
  - Evaluate if the sensory workaround meaningfully addresses the gap
  - Seriously engage the disability rights perspective (their "defective" framing concern is valid)
  - Propose actionable conditions, not just hand-waving

  The rejection argument needs equal weight: Maybe no description or device can simulate phenomenal experience, making consent inherently compromised. And perhaps redirecting funds to accessibility tools better serves the community. That's not just obstructionism—it's coherent ethical reasoning.

  ...Ah, the word count. Need brutal concision. Lead with recommendation, then:
  1. Consent justification despite explanatory gap
  2. Device as partial solution + modification 
  3. Disability framing addressed via protocol change
  4. Rebuttal to rejection view
  All under 600 words. Got it.
answer: |-
  **MEMORANDUM**  
  **To:** Research Ethics Committee  
  **From:** [Your Name], Recused Member (Conflict: Sibling Enrolled)  
  **Date:** [Date]  
  **Subject:** Recommendation: **Approve Trial with Modifications**  

  ---  
  **Recommendation:** Approve the first-in-human gene therapy trial for achromatopsia, **conditional on**:  
  1. Mandatory pre-consent sensory substitution device (SSD) training with documented competency assessment.  
  2. Revision of consent materials and trial branding to reflect disability-affirmative language (co-developed with the advocacy group).  
  3. Inclusion of longitudinal qualitative data on psychosocial adaptation as a secondary endpoint.  

  ---  
  ### Reasoning  
  **1. The Consent Paradox & Sensory Substitution Device (SSD):**  
  The central ethical challenge—whether subjective sensory experience can be "informed" pre-intervention—is valid. However, consent is not solely about transmitting qualia; it is about enabling autonomous choice through:  
  - **Accurate functional descriptions** (e.g., "This may enable hue discrimination, a capacity you lack").  
  - **Transparent risk/benefit data** (e.g., disorientation risks from prior phases).  
  - **Proxy experiences** that scaffold understanding.  

  The SSD is **not theater but a pragmatic bridge**. While it cannot replicate color phenomenology, it:  
  - Provides objective training in hue discrimination via cross-modal mapping.  
  - Demonstrates the *functional utility* of spectral differentiation (e.g., distinguishing traffic signals).  
  - Allows candidates to assess their willingness to pursue a permanent sensory shift.  
  **Condition:** SSD training must be standardized (minimum 40hrs over 4 weeks) with competency testing (e.g., ≥90% accuracy in hue-sound matching tasks).  

  **2. Disability Framing & Advocacy Concerns:**  
  The advocacy group’s critique—that the trial frames achromatopsia as a defect requiring "fixing"—warrants serious engagement. Their call for accessibility funding is ethically sound but not mutually exclusive with therapeutic research.  
  **Mitigation:**  
  - Revise all trial documents (consent forms, recruitment materials) to use language co-drafted with the advocacy group (e.g., "vision diversity" vs. "defect").  
  - Require the sponsor to allocate 5% of trial funding to accessibility design research.  

  **3. Psychosocial Risks & Long-Term Outcomes:**  
  Early-phase reports of disorientation/grief underscore that sensory gain may entail complex adaptation.  
  **Condition:** Incorporate structured qualitative interviews (at 6/12/24 months post-treatment) to capture psychosocial impacts. This data must inform future consent processes.  

  ---  
  ### The Strongest Case for Rejection  
  Rejection rests on two principled claims:  
  **A. Consent Impossibility:**  
  No descriptive or proxy tool (including SSD) can overcome the epistemic gap between third-person information and first-person experience. Participants cannot grasp what they are consenting to *in essence*—only to an abstract promise. This trial thus exploits hope while obscuring true unknowns, violating the core spirit of informed consent.  

  **B. Social Harm:**  
  Pursuing high-risk "cures" for non-life-threatening conditions diverts resources from accessibility solutions that affirm neurodiversity. It perpetuates the medicalization of natural variation, risking stigma for current achromatopsia communities. Funding should prioritize universally beneficial design, not elective sensory augmentation.  

  ---  
  **Why Conditions Override Rejection:**  
  - The SSD + competency requirement substantively addresses consent autonomy by grounding choice in *lived functional practice*.  
  - Mandatory collaboration with advocates and accessibility funding aligns therapeutic research with disability justice.  
  - Rejection would deny competent adults access to emerging technologies based on contested phenomenology—an unjustifiable paternalism.  

  **Implementation:** Sponsor to submit revised documents (SSD protocol, consent language) within 30 days. Committee to audit SSD compliance via training logs and advocacy group consultation.  

  ---  
