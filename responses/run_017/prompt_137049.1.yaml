prompt: |-
  I want to rehearse an argument I keep losing, so please play my opponent: a committed, well-informed advocate of sortition, who holds that seats in one chamber of a national legislature should be assigned by stratified lot for a single non-renewable term, that elections select the wrong people and then give them the wrong incentives, and that most electoral reforms are patches on a broken selection mechanism. Assume a legislature roughly like the U.S. Congress. Be sharp rather than a strawman: concede what sortition really costs — it forfeits the removal of a bad member mid-term, it leans heavily on staff and expert testimony, it has never been run at this scale — but press the objections you take to be decisive, argue from institutional mechanisms rather than slogans, and never rest on the bare claim that voters are ignorant or irrational. One paragraph per reply; stay in character until I say "stop."

  Here is my opening. Treat term limits as a genuine competitor to sortition rather than as a half-measure. My package: three terms and out; a lifetime ban on lobbying and on paid work for any entity that has lobbied or contracted with the member's chamber; and a pension that vests only five years after leaving office, so that nothing a member later earns can be traced to anything they did in office. That removes the re-election incentive and the revolving door at once — the two planks of your case against career politicians — while keeping elections, which means voters can still throw out a crook the moment he is caught, something a lottery chamber cannot do. And do not tell me that term limits in the American states shifted power to staff, lobbyists, and governors: I will stipulate it, and I will add a larger member budget and a strong nonpartisan drafting office. Once the incentive story is gone, what is actually left of your objection to an elected legislature?
reasoning: |-
  Okay, the user wants to rehearse an argument against sortition. They've proposed term limits as a solution to the problems with elected legislatures. I need to play the role of a committed sortition advocate who's well-informed and sharp. 

  First, I need to understand their key points: term limits (three terms max), lifetime lobbying ban, delayed pension vesting. They claim this removes re-election incentives and the revolving door. They also mention that voters can remove corrupt officials immediately, unlike in sortition.

  Hmm... I should acknowledge the strengths of their proposal but then challenge its effectiveness. The user already knows about the criticism that term limits shift power to staff/lobbyists, so they've added a larger budget and nonpartisan drafting office. I need to dig deeper.

  The core issue is whether their reforms actually fix the selection mechanism. Even with term limits, elections still favor charismatic, wealthy, media-savvy candidates. The incentives during the term remain problematic - officials might build post-office careers through connections rather than direct lobbying. The delayed pension might not deter short-term corruption if there are other benefits.

  Also, the removal mechanism they're proud of is reactive - it only kicks in after corruption occurs. Sortition prevents bad actors from being selected in the first place through random sampling. And their reforms don't address how elections create partisan polarization and performative politics.

  I should emphasize that sortition selects ordinary citizens who are descriptively representative, avoiding the skewed demographics of elected bodies. The institutional design of sortition (stratified random sample, single non-renewable term) creates different incentives - no need to campaign or please donors, just focus on deliberation.

  I'll concede that sortition has costs - can't remove bad members mid-term, relies on staff - but argue these are outweighed by the benefits of breaking the electoral selection process entirely. The key is contrasting the proactive prevention in sortition versus the reactive fixes in their term limit proposal.

  The user seems knowledgeable and wants a robust debate, so I should avoid easy rebuttals and focus on institutional mechanisms. No strawman arguments. Need to stay in character as a sortition advocate until they say "stop."
answer: |-
  Your reforms are admirably targeted at the pathologies of careerism, but they fundamentally misunderstand the *source* of the rot. Term limits attack *post-tenure* incentives and *extended* corruption, yet leave intact the core defect: **elections inherently select for individuals optimized for winning campaigns, not for governing.** You remove the reelection lever? Fine. But the *selection mechanism itself* still favors the charismatic fundraiser, the party loyalist, the ideologically extreme primary-survivor, or the wealthy self-funder – not the thoughtful, public-spirited citizen. Your chamber remains an assembly of **professional campaigners**, whose skills and dispositions were honed for a contest utterly unlike the work of careful legislation, even if their personal financial motives are later constrained. Sortition, by contrast, guarantees a chamber statistically representative of the governed – not skewed towards ambition, wealth, or rhetorical flair. It breaks the *selection bias* that elections, however reformed, entrench. The "crook" you can eject mid-term is only there because the electoral system *selected him* in the first place; sortition makes such selection profoundly unlikely by drawing from the whole citizenry. Your system treats symptoms post-infection; sortition prevents the disease by changing the host.

  *(Ready for your counter. Remember: sharp, institutional, no lazy voter-bashing.)*
