  ## MEMORANDUM

  **TO:** All Principal Investigators, Facility Managers, and Animal Research Personnel  
  **FROM:** University Animal Care and Ethics Committee (ACEC)  
  **SUBJECT:** Revised Protocol Guidance: Indirect Duty Framework Implementation (Effective Immediately)  
  **DATE:** October 26, 2023  

  ### I. DEFINITIONS
  1.  **Duty:** A moral obligation owed exclusively to rational beings (persons) capable of autonomy, setting ends, and membership in the Kingdom of Ends.  
  2.  **Non-Rational Being:** Any entity lacking the capacity for rationality, autonomy, and moral personhood (hereafter encompassing all non-human animals). *No direct duties are owed to Non-Rational Beings.*  
  3.  **Indirect Duty:** An obligation rooted solely in the preservation or cultivation of humanity's moral character or societal well-being, which may incidentally involve the treatment of Non-Rational Beings.  
  4.  **Cruelty:** Treatment of a Non-Rational Being that demonstrably degrades the moral sensibility of the human agent(s) involved, fostering callousness or disregard for suffering *in general*, thereby posing a risk to duties owed to persons.  
  5.  **Service:** Labor or companionship provided by a Non-Rational Being to humans, fostering specific analogical bonds relevant to human virtues (e.g., loyalty, diligence).

  ### II. GENERAL PRINCIPLES OF REVIEW
  The ACEC reviews animal research and husbandry protocols *exclusively* through the lens of protecting humanity's moral integrity and social fabric. Protocol approval hinges on demonstrating that proposed activities either:
      (a) Avoid actions constituting Cruelty (as defined in I.4), or  
      (b) Are justified by substantial benefits to humanity outweighing the risk of moral degradation, or  
      (c) Incorporate measures mitigating risks to human moral character outlined herein.

  ### III. ANALOGY SCHEDULE & SPECIES-SPECIFIC PROVISIONS
  Treatment standards derive from the perceived *analogical closeness* of the Non-Rational Being to human nature or human social virtues, as this closeness influences the potential for moral coarsening in humans.  
      1.  **Tier 1 (High Analogy: e.g., Dogs, Horses):**  
          *   Full provisions apply due to unavoidable analogies to human loyalty, service, and companionship.  
          *   Mandatory avoidance of gratuitous suffering; mandatory "retirement" plans for long-serving individuals (Section IX).  
          *   *[Marginal Annotation (Utilitarian): "This implies suffering matters more in a dog than a rat purely because we anthropomorphize dogs more?"]*  
          *   *[Kantian Rebuttal: Correct. The potential for moral harm *to humans* stems from the strength of the analogy. Suffering itself is not the locus of wrong; the erosion of human virtue triggered by the analogy is.]*  
      2.  **Tier 2 (Moderate/Limited Analogy: e.g., Rodents, Rabbits, Cats, Primates):**  
          *   Mandatory suppression of analogical triggers:  
              *   Prohibition on assigning individual names. Mandatory use of impersonal identifiers (e.g., Subject ID, Cohort B).  
              *   Prohibition on anthropomorphic photography or public display emphasizing individual character.  
              *   Mandatory disposition (euthanasia or transfer *only* to other approved research protocols) immediately upon conclusion of experimental utility. No long-term holding.  
          *   *[Marginal Annotation: "So we must kill them quickly to avoid forming attachments that might make us question the ethics?"]*  
          *   *[Kantian Rebuttal: Preventing the formation of misleading analogies protects researchers from unnecessary moral conflict and potential coarsening. Disposition is a prophylactic measure for human virtue.]*  
      3.  **Tier 3 (Low Analogy: e.g., Fish, Amphibians, Reptiles, Birds):**  
          *   Abbreviated review process (Form C). Focus primarily on overt Cruelty risk and public perception (Section VII). Analogical considerations minimal.  
      4.  **Tier 4 (Negligible Analogy: e.g., Insects, Arachnids, Molluscs, Crustaceans, Invertebrates generally):**  
          *   Outside ACEC scope. No review required. Treatment governed solely by property rights and resource management concerns. *No analogical resemblance to human nature or virtue is discernible.*

  ### IV. HARDENING REGISTER & AGENT ASSESSMENT
  The primary restraint on harmful procedures is the risk of moral coarsening (hardening) of the human agent. This risk is not uniform and must be assessed.  
      1.  **Initial & Annual Assessment:** All personnel involved in procedures potentially causing distress to Tier 1 or 2 animals must undergo an ACEC-approved sensibility assessment at induction and annually. This assessment evaluates susceptibility to moral coarsening from animal work.  
      2.  **Hardening Certification:** Personnel demonstrating consistent insensitivity to analogical triggers and procedures involving animal distress, as confirmed by assessment and supervisor observation, may be certified as "Fully Hardened" by the ACEC.  
      3.  **Consequence of Certification:** For Fully Hardened personnel:  
          *   Protocols involving Tier 2 animals may omit certain standard refinement measures *if* scientifically justified, as the primary ground for restraint (risk of coarsening *that specific agent*) is nullified.  
          *   *[Marginal Annotation: "So if you prove you lack empathy, the rules protecting animals from suffering are relaxed FOR YOU?"]*  
          *   *[Kantian Rebuttal: Precisely. The rules exist solely to protect the moral character of the agent. If the agent is demonstrably immune to coarsening from these specific acts, the *moral* justification for restraint lapses. Prudential or reputational concerns may remain (Section VII).]*  
      4.  **Unwitnessed Procedures:** Procedures performed unwitnessed by any non-Hardened personnel, and unlikely to become public knowledge, are subject to reduced scrutiny *if* involving Tier 2 or 3 animals, as the risk of coarsening others or causing public scandal is minimized.

  ### V. PAINFUL OR DISTRESSING PROCEDURES
  1.  **Justification Threshold:** Procedures involving significant pain, distress, or deprivation require compelling justification demonstrating **substantial importance to humanity** (e.g., essential medical research, critical food security).  
  2.  **Exclusion:** Procedures motivated primarily by **speculative curiosity** or trivial human benefit are prohibited, as the risk of moral degradation to the agent(s) cannot be outweighed.  
  3.  **Refinement Requirement:** Where justified, protocols must incorporate all feasible measures to minimize evident signs of pain/distress *to the extent necessary* to mitigate the risk of Cruelty (coarsening) in personnel.  
  4.  **Corruption Principle:** *[Clause Demonstrating Strength]* **Even if a painful procedure is essential and carefully refined, investigators must vigilantly monitor their *own* affective responses and those of their staff.** Repeated exposure necessitates heightened self-scrutiny for signs of diminished sensitivity to suffering *in general*. This self-monitoring is a **positive duty to oneself** to preserve one's moral constitution for fulfilling duties to humanity. Failure in this duty constitutes the core ethical violation.

  ### VI. PROPERTY & UTILIZATION
  Non-Rational Beings are legitimately acquired property.  
      1.  **Use:** They may be utilized for food, labor, companionship, or research as property dictates.  
      2.  **Disposition:** They may be disposed of (euthanized, sold, etc.) when no longer useful or required, provided disposition is not **Cruel** (i.e., does not involve gratuitous suffering that risks coarsening the agent).  
      3.  **Efficiency:** Wasteful or inefficient use of animal property is discouraged as poor stewardship of resources, but not an *ethical* violation unless rising to Cruelty.

  ### VII. PUBLICITY & PERCEPTION MANAGEMENT
  While public distress has no *direct* moral bearing (as no duty is owed to animals), societal outrage can indirectly harm the institution and potentially coarsen societal attitudes.  
      1.  **Mitigation:** Protocols involving Tier 1 or 2 animals, or procedures likely to be perceived as harsh by the public (regardless of agent Hardening status), must include a Public Perception Mitigation Plan.  
      2.  **Plan Elements:** May include: scientific necessity briefings, emphasis on human benefit, avoidance of sensitive imagery/vocabulary, restrictions on public disclosure.  
      3.  **Compliance Basis:** Compliance is required solely to protect the institution's reputation and prevent societal discord, *not* because public sentiment reflects a direct moral truth about animal treatment.

  ### VIII. LONG-SERVICE RECOGNITION (TIER 1 ANIMALS ONLY)
  1.  **Eligibility:** Non-Rational Beings in Tier 1 (e.g., facility dogs, herd sires/dams) providing sustained, faithful Service may be eligible for recognition upon retirement from service.  
  2.  **Scheme:** Recognition typically involves a dignified retirement (e.g., pensioning to a suitable sanctuary or private home) funded by the facility/department.  
  3.  **Basis:** This acknowledges the **analogy to human service** and fosters the virtue of *gratitude* in the human agents involved, thereby strengthening moral character. *It is not a duty owed to the animal itself.*  
  4.  **Non-Service Animals:** Animals not providing recognizably analogous Service (e.g., most research subjects, production animals) are ineligible. Disposition follows standard property protocols (Section VI.2). *[Marginal Annotation: "The faithful lab rat gets the needle; the facility dog gets the farm. Justice?"]*  
      *[Kantian Rebuttal: Justice pertains to persons. The dog's retirement cultivates human gratitude, a virtue relevant to our duties. The rat presents no such analogical opportunity; its disposition is simply management of property.]*

  ### IX. COMPLIANCE ATTESTATION & REVIEW
  All Principal Investigators submitting protocols must attest to the following:  
      *"I affirm that the procedures outlined in this protocol are designed and will be conducted strictly in accordance with the principles of Indirect Duty as defined by the ACEC. I understand that the purpose of all refinement measures, restrictions, and reporting requirements mandated or undertaken is solely to protect the moral character of human personnel, uphold societal perceptions necessary for institutional function, and/or utilize animal property efficiently. I attest that no measures are taken out of a belief in direct duties owed to non-rational animals.*  
      *I further commit to monitoring my own character and that of my staff for signs of undue hardening relevant to our duties to humanity."*  

  **Signature:** _________________________ **Date:** _______________  

  **Review Clause:** This Guidance Framework will be reviewed biennially by the ACEC, or immediately in response to significant incidents of public scandal or demonstrable failure to prevent widespread moral coarsening among research personnel, to ensure its continued efficacy in safeguarding **human dignity and moral integrity**.

  ---

  **ACEC Chair Approval:** _________________________ **Date:** _______________
