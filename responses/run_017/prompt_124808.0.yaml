answer: |-
  ## Case Analysis: Mercury's Perihelion Advance & Underdetermination

  This analysis examines the anomalous precession of Mercury's perihelion through the lens of underdetermination of theory by evidence, strictly separating the three specified readings and assessing their applicability both theoretically and historically.

  **Given Facts Recap:**
  By the late 19th century, Mercury's observed perihelion advance exceeded Newtonian predictions by approximately 43 arcseconds per century. Three broad classes of solutions were considered:
  1.  **Undiscovered Matter (Vulcan/Ring/Swarm):** Additional mass inside Mercury's orbit.
  2.  **Diffuse Matter (Dust Cloud/Ring):** Distributed mass close to the Sun.
  3.  **Revision of Gravitational Law:** Modifying the inverse-square law (e.g., exponent change) or, later, adopting General Relativity (GR).

  **I. Theory-to-Case Analysis: Examining the "Fixes"**

  1.  **Undiscovered Matter (Vulcan/Ring/Swarm):**
      *   **Auxiliary Commitments:** Existence of sufficient mass *within Mercury's orbit*; distribution not significantly perturbing Venus/Earth orbits beyond observed limits; potential observability (for a planet/planetoid); gravitational influence confined to inner solar system.
      *   **Independent Evidence For/Against:**
          *   *For:* Direct telescopic searches (especially during solar eclipses or transits predicted by perturbations); gravitational effects on *other* inner planets (Venus, Earth) if mass significant; potential infrared emission.
          *   *Against:* Systematic failure of telescopic searches (e.g., by Le Verrier, Wolf, Watson, others); absence of predicted transits across the solar disc; lack of observed gravitational perturbations on Venus/Earth orbits; stability concerns for a ring/swarm. Observations of zodiacal light *might* be consistent with dust but argued *against* a concentrated mass.
      *   **Underdetermination Status:** **Merely Apparent.** The auxiliaries (observability, gravitational effects on Venus/Earth) were *independently testable and tested*. The repeated failure to find Vulcan or detect its gravitational signature on other planets provided strong, direct evidence *against* this specific solution *independently* of Mercury's precession itself. For astronomers actively searching (e.g., Le Verrier, Newcomb), this underdetermination was largely resolved by negative evidence by the early 20th century, though hope lingered in some quarters.

  2.  **Diffuse Matter (Dust Cloud/Ring):**
      *   **Auxiliary Commitments:** Existence of a stable, sufficiently massive dust cloud/ring very close to the Sun; distribution smooth enough not to cause anomalous *secular* changes in other orbits (like Earth's Moon) beyond observed limits; connection to zodiacal light; thermal properties consistent with solar proximity.
      *   **Independent Evidence For/Against:**
          *   *For:* Existence of zodiacal light (interpreted as sunlight scattered by dust); plausibility of circumsolar dust.
          *   *Against:* Quantitative analysis showing the mass required to explain Mercury's precession would: (a) produce *far* brighter zodiacal light than observed; (b) cause detectable secular acceleration in the *Earth's Moon's mean motion* via tidal friction/drag (which was *not* observed); (c) potentially perturb Venus/Earth orbits beyond observed limits. The zodiacal light observations were *inconsistent* with the required mass density.
      *   **Underdetermination Status:** **Merely Apparent.** The critical auxiliaries (mass-brightness relationship for zodiacal light, gravitational effect on Moon's motion) were *quantitatively testable*. Seeliger and others demonstrated the observational consequences (excessively bright zodiacal light, lunar acceleration) were *not* present, decisively falsifying this solution as the cause of Mercury's anomaly by the early 20th century.

  3.  **Revision of Gravitational Law:**
      *   *A. Exponent Change (e.g., Hall/Newcomb):*
          *   **Auxiliary Commitments:** Modified law (e.g., F ∝ 1/r^(2+δ)) must preserve *all* other well-established orbital phenomena: Keplerian orbits for planets (especially Earth/Venus), lunar motion, tides, binary stars; consistency with Cavendish-type experiments; mathematical coherence.
          *   **Independent Evidence For/Against:**
              *   *For:* Potential to mathematically fit Mercury's anomaly *if* δ is very small.
              *   *Against:* Failure to simultaneously satisfy other precision tests: Even tiny δ values sufficient for Mercury caused *discrepancies* in the motion of the Moon and Venus/Earth orbits that were larger than the observed anomalies themselves. Cavendish experiments constrained δ very tightly. Clairaut's work in the 18th century already showed the inverse-square law was uniquely consistent with elliptical orbits under Newtonian assumptions.
          *   **Underdetermination Status:** **Merely Apparent.** The auxiliary (preservation of other orbital motions/experiments) was rigorously testable. Calculations by Newcomb and others conclusively showed no value of δ could fix Mercury *without* breaking other well-confirmed phenomena. This solution was effectively ruled out.
      *   *B. General Relativity (GR):*
          *   **Auxiliary Commitments:** The entire novel theoretical framework of GR (curved spacetime, equivalence principle, field equations, etc.); specific predictions beyond Mercury (light bending, gravitational redshift, other perihelia).
          *   **Independent Evidence For/Against (Pre-1919):** Primarily Mercury's precession fit was the initial key evidence *for*. No direct counter-evidence existed *yet*, but the theory lacked *independent* confirmation beyond this single anomaly. Its complexity and radical departure were significant hurdles.
          *   **Underdetermination Status (1915-1919):** **Genuine Transient Underdetermination.** GR provided a mathematically consistent solution fitting the Mercury data, but *only that data*. No other unique predictions had been confirmed. *In principle*, other theories (even undiscovered ones) *could* have fit the Mercury data alone. Rival gravitational theories existed (e.g., Nordström), though they failed on Mercury. This underdetermination was transient because *novel* predictions (1919 light bending) were imminent and decisive.

  **II. Case-to-Theory Analysis: What the Episode Shows About Underdetermination**

  1.  **Temporary/Transient Thesis:** **Strongly Exemplified.** The Mercury anomaly *was* underdetermined by the available evidence *for decades*. Multiple logically possible solutions (matter, dust, law change) existed. This underdetermination was *resolved over time* by the accumulation of new evidence: failed searches for Vulcan, quantitative falsification of the dust ring, failure of exponent changes, and crucially, the *novel predictions* (light bending, later redshift) and overall coherence of GR. The episode is a textbook case of transient underdetermination.

  2.  **Holist (Duhem-Quine) Thesis:** **Illustrates the Mechanism, but Highlights its Practical Limits in Mature Science.**
      *   *Illustration:* The episode perfectly demonstrates holism. Newtonian gravity (core hypothesis) faced an anomaly. Defenders *could* (and did) protect it by invoking auxiliary hypotheses about unseen matter (Vulcan, dust) or modified force laws. This shows how shielding the core theory is logically possible.
      *   *Limitation:* Crucially, the *required auxiliaries themselves carried independently testable consequences*. Holism is a claim about *logical space* – shielding is always *logically possible* by adjusting auxiliaries. However, this case shows that in *scientific practice*, viable auxiliaries are constrained by the *entire web of belief*. The auxiliaries proposed (Vulcan's observability/perturbations, dust ring's zodiacal light/moon effect, exponent change's impact on Venus/Moon) were *not* arbitrary shields; they made concrete, falsifiable predictions *beyond* Mercury's orbit. These predictions were tested *and failed*. The episode demonstrates that while holism grants theoretical flexibility *in principle*, the *practical* requirement for auxiliaries to be consistent with the *broader body of evidence* severely constrains viable options. It shows holism operating, but also shows how science actively *seeks* to break the underdetermination by testing the auxiliaries.

  3.  **Radical/Permanent Thesis:** **Not Exemplified.** There is no evidence in this episode for the existence of *permanently* empirically equivalent rivals to the Newtonian framework or to GR *within the domain of available evidence*. The proposed alternatives (Vulcan, dust, exponent change) were *distinguishable* by evidence (telescopic searches, lunar motion, other orbits). GR itself made novel predictions that later distinguished it. While one could *imagine* a rival to GR matching all 1915-1919 data (see closing question), no such *viable, developed* rival existed historically. The episode does not support the radical thesis.

  **The Role of GR's Vindication:** GR's success with light bending (1919) and other predictions *directly addresses the transient underdetermination*. It provided the new evidence that decisively broke the underdetermination that existed *prior* to its confirmation. It confirms that the transient underdetermination present *circa* 1915 had lapsed by 1919/1920 due to new evidence. It does not speak to radical underdetermination, as GR was distinguishable by those novel tests.

  **Closing Verdict on the Hypothetical (1920 Rival to GR):**

  The situation in 1920, with a hypothetical rival (R) matching *all* gravitational observations (perihelion advance, light bending, redshift) but diverging in the strong-field regime (untestable until the 1970s), is best described as:

  *   **A Case in Which Suspension of Judgement Was the Reasonable Response.**

  *   **Rationale:**
      1.  **Transient Underdetermination:** This is clearly a case of *transient* underdetermination. The available evidence (perihelion, light bending, redshift) cannot distinguish between GR and R. Both are empirically adequate *for the evidence available in 1920*.
      2.  **Not Irrationality:** Proponents of either theory are *not* being irrational. Both theories explain the known data. Advocating for one based on its elegance, coherence, potential for explaining other phenomena, or theoretical virtues would be scientifically reasonable. Advocating for the other based on its potential in the strong-field regime would *also* be reasonable. Neither group is *compelled* by the 1920 evidence alone to abandon their view.
      3.  **More than Just "Little Data":** While limited data is a factor, the key point is the *structural equivalence* of the two theories *relative to the accessible domain of phenomena*. It's not merely that there's little data, but that the existing data *cannot, in principle, at that time*, discriminate between the two well-developed, empirically adequate rivals within their shared domain of application (solar system gravity).
      4.  **Not Radical Underdetermination (Yet):** This is *not* radical/permanent underdetermination *unless* it can be shown that *no possible evidence accessible in the future* (including strong-field tests like binary pulsars or gravitational waves) could *ever* distinguish them. The scenario specifies that evidence *does* arrive in the 1970s, implying the underdetermination is transient. Radical underdetermination requires empirical equivalence across *all possible* evidence, which is not claimed here (R diverges in strong fields).

  **In Summary:** The Mercury perihelion episode is a classic illustration of *transient* underdetermination, resolved by accumulating evidence. It demonstrates the *mechanism* of holism – shielding a core theory with auxiliaries – but powerfully illustrates how *in practice*, viable auxiliaries must survive independent testing against the broader web of evidence, limiting genuine underdetermination. It provides no support for radical underdetermination. The 1920 hypothetical is a clear case of transient underdetermination where suspension of judgment is the epistemically reasonable stance until new evidence (strong-field tests) becomes available.
