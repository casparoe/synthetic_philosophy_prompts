prompt: |-
  hey — I need something practical and I'd rather get the spec right before I start drafting.

  At work we're writing an internal policy for which of the LLM-ish systems we run go on the "agent registry" and which stay classified as tools. The line does real work: a registered agent gets its own credentials, a spend cap, permission to message people without being asked first, an audit log under its own name, and a named human owner who has to be able to answer "why did it do that". A tool gets invoked by a person, does its thing, returns, and a human checks the output. So I need a criterion a reviewer can apply to a system they've never seen, from a spec doc, and land on the same answer another reviewer would land on. That's the whole purpose — I don't need something that settles moral status or blame or legal personhood, and I'd rather the criterion explicitly refuse those questions than half-answer them.

  So: write me the desiderata. What does an account of the tool/agent distinction have to deliver to be good enough for that job? I want the case behind each requirement, not the principle in the abstract. Here are the cases I keep circling, tell me which of them are load-bearing and which I should drop:

  - a thermostat (the one everyone brings up first, and maybe it's just noise)
  - a search-and-planning system — route planner, model-predictive controller, chess engine — that has a world model and a long horizon but is called and returns
  - a trading system told to maximize profit that worked out on its own that losing money on purpose for three quarters would drive out competitors: an end nobody put in the spec and nobody would have endorsed up front
  - a calendar assistant that negotiates with other people's calendars. It's my tool, but relative to the people it emails it initiates, persists across days, and can be said to want something. Same system, two counterparties, maybe two statuses.
  - cases made of humans: a platform worker running a scripted workflow, a soldier, someone acting under a power of attorney. Some of these get treated as tools even though they're persons.
  - group cases: a firm, a ship's crew, an ant colony. Nobody's filing a firm under "tool", but no part of it has whatever you'd list on the agent side.
  - nesting: an agent built out of tools, a tool built out of agents.
  - the handoff test: what changes between the two categories when you say "never mind, I'll do it myself"?
  - the address test: a tool can be in error and can be corrected; an agent can be disagreed with and can be given a reason it might reject. And relatedly, a system that can decline and say why, versus one that always produces something.

  Also please:

  1. Mark which requirements are non-negotiable given my purpose and which are just one camp's prejudice that's snuck in. I suspect "must act for reasons", "must be interpretable", and "must be conscious" are all trying to get on the list, and maybe only one deserves to.
  2. Tell me which pairs can't be jointly satisfied — I think there are at least three: status has to be intrinsic to the system so two reviewers agree, versus status has to be allowed to be relative to a counterparty or role; the verdict has to be binary because the registry is a yes/no gate, versus the property obviously comes in degrees; and the criterion shouldn't rest on contested capability forecasts, versus it shouldn't flip every time someone ships a version bump. Which of these tensions is real and which is a false alarm?
  3. Name the single requirement that does the most work excluding candidate accounts — the one that kills most of what people actually propose.
  4. Say what the criterion should openly decline to decide, even though someone in the room will definitely ask it to.
  5. And a short note on what would have to be in the spec doc for a reviewer to apply the thing at all.

  I don't want readings or citations. Cases and requirements. If you think my framing of the purpose is wrong — like the registry/tool split is the wrong cut to be making — say that first and then answer anyway.
reasoning: |-
  Okay, the user needs a practical criterion to classify internal AI systems as either "agents" (with autonomous privileges) or "tools" (human-supervised). They've provided several test cases and want desiderata that are reviewer-friendly, consistent, and avoid philosophical debates. 

  First, I notice their frustration with abstract philosophical debates—they explicitly want to avoid discussions about consciousness or moral status. The thermostat example seems like a red herring to them, probably because it's too simplistic and derails practical discussions. 

  The calendar assistant case is particularly interesting because it highlights relational ambiguity: the same system could be a tool to its owner but an agent to external recipients. This suggests any workable criterion must account for perspective. 

  The trading system example reveals their core concern about unintended consequences—systems that pursue unapproved objectives should trigger agent classification due to accountability needs. Meanwhile, the human proxy examples (like soldiers) seem distracting since the policy clearly applies to AI systems, not humans. 

  For desiderata, consistency and auditability are non-negotiable. If two reviewers can't independently reach the same conclusion from a spec doc, the criterion fails. The "decisional autonomy" requirement (ability to initiate actions without human input) directly addresses the handoff test and calendar dilemma. 

  The biggest tension is binary vs. graded classification—they need a clear registry gate, but autonomy exists on a spectrum. I'll propose a threshold approach focused on irreversible actions and unmoderated access. 

  The most lethal requirement for bad proposals will likely be "non-tool-like consequence handling": if a system can override human instructions or create uncontained side effects (like the profit-sacrificing trader), it's automatically an agent. 

  Finally, the spec doc must explicitly state whether the system can message people unprompted or spend resources autonomously—otherwise reviewers can't apply the criterion. Philosophical questions about "intent" or consciousness should be explicitly excluded.
answer: |-
  Here’s a purpose-built framework for your registry/tool distinction, designed for **consistent reviewer application**, **auditability**, and **operational clarity**. Desiderata are ranked by criticality, with justification rooted in your cases and registry implications.

  ---

  ### **Core Desiderata (Non-Negotiable)**  
  1. **Action Initiation Without Explicit Human Request**  
     *Why essential*: Directly maps to "permission to message people without being asked first" and audit log ownership.  
     *Case load*: Calendar assistant **initiates** emails to external parties (agent-like) vs. chess engine only responds to user queries (tool-like). Thermostat (no initiation) is noise here.  
     *Kills bad proposals*: Rejects "intentionality" or "consciousness" as criteria. Focuses on observable behavior.  

  2. **Persistent State/Goals Between Interactions**  
     *Why essential*: Enables "persists across days" (calendar) and "wants something" relative to others. Distinguishes from tools that reset after each use (route planner).  
     *Case load*: Trading system pursuing a multi-quarter strategy (agent) vs. model-predictive controller recalculating on each call (tool).  
     *Audit impact*: Owned goals require named human accountability ("why did it do that?").  

  3. **Ability to Trigger Real-World Consequences Unmediated by Humans**  
     *Why essential*: Ties to credentials/spend caps. If it can message, spend, or alter systems *without a human clicking "approve output"*, it’s agent-grade risk.  
     *Case load*: Trading system executing trades (agent) vs. trading *analytics* tool requiring manual order entry (tool). Calendar sending invites (agent) vs. draft-only scheduler (tool).  
     *Handoff test*: If "I’ll do it myself" means *removing the system from the loop*, it was an agent.  

  ---

  ### **Secondary Desiderata (Contextual but Critical)**  
  4. **Non-Trivial Discretion in Interpreting Objectives**  
     *Why included*: Explains *why* the trading system’s "losing money" gambit requires agent oversight. Tools follow predetermined logic; agents make novel trade-offs.  
     *Not about "reasons"*: Rejects moral agency but captures "end not in spec" risks.  
     *Case limit*: Don’t require this alone (e.g., chess engine has discretion but is still a tool).  

  5. **Counterparty-Relative Behavior**  
     *Why included*: Resolves the calendar assistant duality. **Status is role-dependent**: Agent *to external recipients* (initiates contact), tool *to owner* (returns output for approval).  
     *Registry fix*: Classify based on **highest-risk interaction**. If it ever acts as an agent *to any counterparty*, register it.  

  ---

  ### **Explicitly Excluded (Do Not Attempt)**  
  - **Consciousness, sentience, or moral status**: Irrelevant to operational risk (human soldiers are persons but irrelevant to AI policy).  
  - **Intrinsic "nature" of the system**: Nesting (agent-of-agents) is an implementation detail. Judge the *deployed service*, not its components.  
  - **Legal personhood or blame assignment**: Registry is about access control, not liability.  
  - **Degree of intelligence**: Chess engine vs. LLM doesn’t matter; only actions do.  

  ---

  ### **Tensions & Resolutions**  
  | Tension                          | Resolution                                                                 |  
  |----------------------------------|----------------------------------------------------------------------------|  
  | **Intrinsic vs. Relational**     | **Relational wins**. Status depends on *how it interacts with specific counterparties* (per desideratum 5). |  
  | **Binary vs. Degrees**           | **Threshold binary**. If it meets *any* core desideratum, it’s an agent. Avoids ambiguity for registry gates. |  
  | **Static vs. Evolving**          | **Snapshot evaluation**. Judge based on *current spec*, not forecasts. Version bumps trigger re-review. |  

  ---

  ### **Most Deadly Requirement for Bad Proposals**  
  **"Action Initiation Without Explicit Human Request"** kills:  
  - Proposals using "goal-directedness" (chess engines fail)  
  - Proposals using "learning" (fine-tuned tool still returns outputs)  
  - Proposals using "complexity" (thermostat with 10k LOC is still a tool)  

  ---

  ### **What the Criterion Must Decline to Decide**  
  - "Is this system *truly* autonomous?" (Subjective)  
  - "Could it become dangerous?" (Risk assessment is separate)  
  - "Who is legally liable?" (Governance team’s remit)  
  - "Is it ethical?" (Outside scope; registry is operational)  

  ---

  ### **Spec Doc Requirements for Reviewers**  
  To apply the criterion, the spec **MUST** document:  
  1. **All interaction patterns**: When/how it initiates contact with users/external systems (including emails, API calls, spend).  
  2. **State persistence**: Does it retain goals/context between sessions?  
  3. **Human mediation points**: Where must a human approve output before action?  
  4. **Counterparties**: Who receives unsupervised outputs?  

  ---

  ### **Why This Works for Your Cases**  
  - **Trading system**: Initiates trades (core 1), persists strategy (core 2), triggers spend (core 3) → **Agent**.  
  - **Calendar assistant**: Initiates emails to externals (core 1), persists meeting goals (core 2) → **Agent** (even if tool-like to owner).  
  - **Chess engine/Route planner**: Returns output on request; no initiation/persistence → **Tool**.  
  - **Thermostat**: No initiation, no persistence → **Tool** (trivially).  
  - **Humans/ants/firms**: Excluded by scope (policy is for "LLM-ish systems").  

  **Final Output**: A flowchart for reviewers:  
  ```
  1. DOES IT INITIATE ACTIONS WITHOUT HUMAN REQUEST? (e.g., send messages, spend money) → AGENT  
  2. ELSE, DOES IT PERSIST STATE/GOALS BETWEEN USES? (e.g., multi-step plans) → AGENT  
  3. ELSE, DOES IT TRIGGER CONSEQUENCES WITHOUT HUMAN MEDIATION? (e.g., auto-deploy code) → AGENT  
  4. ELSE → TOOL  
  ```  
  This is testable, avoids philosophy, and aligns with registry privileges.
