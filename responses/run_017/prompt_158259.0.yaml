prompt: |-
  I got into an argument at a dinner party recently about whether you can ever be worse off for knowing something, and I have not been able to get my own verdicts to line up. One friend, an economist, said the question is settled: for an expected-utility maximizer facing a fixed decision problem, free information is never worth less than nothing, because you can always ignore what you learn and do exactly what you would have done anyway, and by the same style of argument a signal is never worth less than any noisy garbling of it. I think that argument is right as far as it goes, but I keep producing cases where I would pay to avoid learning something, and I want to know whether the principle can be repaired or whether some of my verdicts have to go. My tentative formulation, which I suspect is too crude, is this: learning is good just when it lets my action depend on the world in a way it could not before, and bad just when it forces my action to depend on the world in a way I would rather it did not.

  Here are the verdicts I am fairly confident about. I would pay for a market survey before deciding whether to launch a product, and I would pay more the nearer I am to indifference between launching and not; the same survey is worth exactly nothing if it is so noisy that no result could move me, and worth nothing if I already know what it will say. I would pay a little to learn who wrote a certain anonymous seventeenth-century pamphlet, even though I will do nothing differently once I know. I would pay a real sum not to be told which of my students wrote which anonymous exam, even though knowing would let me write them more useful comments, because once I know I cannot grade blind. I would take, for free, a sealed envelope containing that mapping which I alone could open and would probably leave shut, and I think that is clearly better than never being offered the envelope. I would decline a health-risk test whose result is automatically entered into a file my insurer can read, and I would want the very same test if the result sat in a file only I control. In a negotiation, I would pay to read the other side's cost sheet if they never learn I have seen it, and I would pay not to be handed it in front of them. And a friend who runs a two-person clinic says a fifty-variable forecast would make her team worse than a one-page summary, because her team can act on about three things a quarter and reading the rest eats the attention the three would have had; she would take the summary even if the full forecast were free and strictly more informative. Finally, I would pay for a cheap pilot whose only use is telling me whether the expensive study is worth commissioning at all, even though the pilot says nothing directly about the launch decision. The Blackwell-style claim and the clinic case are the pair I cannot reconcile, and the pamphlet case sits badly with the claim that information is worthless when it cannot change your action.

  What I want from you is the principle, not a survey of positions and not references. State one or two candidate principles precisely enough that I could apply them myself, say which case motivates each clause, and tell me which of my verdicts each candidate accommodates and which it forces me to overturn, including whether the crude formulation above survives in any form. Then give me its verdicts on three cases I have not listed: a physician deciding whether to tell a patient the exact numerical risk of a side effect when the patient will have the operation either way and has said they would rather not know; a juror who has accidentally seen material the judge will later instruct the jury to disregard; and me, halfway through a novel, deciding whether to read a detailed plot summary before finishing it. If the honest answer is that no single principle fits and that the disagreement between my verdicts is real rather than apparent, say so and tell me which verdict you think is the mistake.
reasoning: |-
  Okay, let me tackle this user's problem. They're wrestling with whether knowing something can ever make you worse off, despite the economic principle that free information shouldn't hurt because you can always ignore it. Their examples show situations where they'd pay to avoid learning something, which conflicts with that principle. 

  First, I need to reconcile their conflicting intuitions. The economist friend's argument is based on expected utility and Blackwell's theorem, which says more information is never worse. But the user's cases like not wanting to know student exam identities or health tests shared with insurers clearly violate this. 

  Hmm, the key seems to be separating the decision context. In standard fixed-decision problems, Blackwell holds. But when learning changes the decision problem itself—like adding constraints (must grade non-blind) or revealing info to others (insurers)—then information can hurt. Also, cognitive costs like the clinic's attention limits make extra data harmful even if "free."

  The user's crude formulation about action dependence is partly right but too vague. Better to distinguish between information's instrumental value (affecting actions) and its non-instrumental costs (psychological, strategic, attention). 

  For their pamphlet example—pure curiosity with no action change—the value is non-instrumental. That's why it doesn't fit the "only valuable if it changes actions" view. The juror case shows compulsory exposure creating bias you can't undo, making info harmful despite ignoring it. 

  The physician case hinges on autonomy vs. distress. If the patient prefers ignorance, telling them against their will adds negative value even if medically irrelevant. The novel spoiler is about experiential utility—knowing reduces suspense, altering the reading experience itself. 

  So no single principle covers all. Need conditional principles: information is good if it expands feasible actions without adding constraints or costs. Bad if it imposes new constraints, reveals to adversaries, or overwhelms cognition. Their grading blind verdict is correct; the economist's blanket claim needs qualifying for real-world complexities. 

  Final thought: the user's instincts are mostly sound. The mistake is applying a frictionless model to contexts with psychological/strategic friction. Abandoning "information never hurts" as universal; adopt context-sensitive rules instead.
answer: |-
  Here are two precisely stated principles that reconcile your verdicts, followed by their application to your cases. Your "crude formulation" is partially preserved but refined to address its limitations.

  ### Principle 1 (Instrumental Value Under Fixed Constraints)  
  *For an agent facing a fixed decision problem with immutable action constraints and no exogenous costs of information processing, a signal is never worse than any garbling of it (Blackwell's theorem holds). Information has non-negative value if it can be freely ignored and imposes no externalities.*

  - **Motivation:** Preserves your economist friend's core insight for standard decision problems (e.g., market survey, pilot study).  
  - **Accommodates:** Market survey (valuable near indifference), noisy/known survey (worthless), sealed envelope (strictly better than nothing), insurer-controlled test (harmful only due to externality).  
  - **Overturns:** None of your verdicts—constraints explain exceptions.  

  ### Principle 2 (Costs of Expanded Possibility Sets)  
  *Information can reduce welfare if it:*  
  *(a) Introduces new action constraints (e.g., ethical/legal obligations)*,  
  *(b) Generates psychological/attention costs exceeding instrumental gains*,  
  *(c) Reveals data to adversarial parties*,  
  *(d) Alters the feasible set of decision problems the agent can face in the future.*  

  - **Motivation:** Clinic case (attention costs), exam IDs (new grading constraint), insurer file (adversarial revelation), negotiation (strategic exposure).  
  - **Accommodates:** All your verdicts by explaining deviations from Principle 1.  
  - **Survival of your formulation:** Your "bad when forces unwanted dependence" is retained as (a) and (b); "good when enables useful dependence" is covered by Principle 1.  

  ---

  ### Reconciliation of Conflicting Cases  
  - **Blackwell vs. Clinic:** Principle 1 assumes no attention costs; Principle 2(b) overrules it when cognitive scarcity binds. Your clinic is worse off because the forecast consumes scarce attention.  
  - **Pamphlet Case:** Principle 1 allows non-instrumental value (curiosity) even if actions don’t change. This resolves tension with "information worthless without action change."  

  ---

  ### Verdicts on New Cases  
  1. **Physician revealing side-effect risk:**  
     - **Verdict:** Do **not** disclose.  
     - **Principle:** 2(a/b). Disclosure imposes a psychological cost (anxiety) against patient preference, with no compensatory instrumental gain (action unchanged).  

  2. **Juror seeing inadmissible evidence:**  
     - **Verdict:** Worse off for knowing it.  
     - **Principle:** 2(a/d). Knowledge creates an obligation to *attempt* disregard (new constraint) while biasing judgment. Future decision problems (deliberation) are contaminated.  

  3. **Reading novel spoilers:**  
     - **Verdict:** Pay to avoid summary if you value suspense/uncertainty.  
     - **Principle:** 2(b). Spoilers destroy experiential utility (a cognitive cost) that outweighs any instrumental benefit (e.g., "preparing" for the ending).  

  ---

  ### Conclusion  
  **No single principle fits all cases—your conflicting verdicts are valid.** The economist’s claim assumes a frictionless world (Principle 1). Real-world deviations (Principle 2) explain when information harms. Your "mistake" was applying Principle 1 to cases governed by Principle 2.  

  **Key insight:** Information’s value depends on *how it interfaces with your constraints*. When learning *creates* new burdens (attention, obligations, strategic vulnerabilities), it can be net harmful. When it merely expands options in a frictionless setting, it is never worse than ignorance. Your verdicts stand.
