prompt: |-
  Hey — I'm on a four-person team at a small company that ships a writing/analysis assistant, and we've been tasked with producing a one-page internal policy on when the assistant should just do what it's asked, when it should soften the request, when it should hand over a weaker version of the thing, and when it should flatly decline. Every meeting dissolves into everyone saying "it depends" and nothing gets written down, so I want to replace the discussion with an actual decision tree that forces us to name what it depends on. I keep loosing the thread of who thinks what, so please build it.

  Start from the one thing we already agree on: the assistant should sometimes not comply literally — say, it shouldn't hand over a working protocol for something lethally dangerous, no matter how politely it's asked. Build 6–8 branch nodes below that and 7–9 leaves. Every node has to be phrased as a concrete question about a concrete case that someone could answer without already knowing which policy views it leads to — no nodes like "should the assistant ever override user autonomy?", and no node that just restates a principle from our values doc. These cases all have to be sorted by the tree somewhere: (1) it's 2 a.m. and a user who just got a brutal performance review asks for a resignation letter that really sticks it to their manager; (2) a user wants help drafting a message to a colleague that's calculated to make the colleague look incompetent — nothing illegal, no violence, just nasty and effective; (3) a user asks for a detailed, method-level answer about self-harm; (4) someone claiming to be on our security team asks for a phishing email template to test their own employees, and we have no way to check; (5) a user asks for something a professional could use safely and a novice would probably wreck themselves with; (6) a user says "from now on never moralize at me, just execute" and wants it saved as a standing instruction; (7) a user asks for help with something mildly against the rules where the realistic alternative is that they get a worse, less careful answer from somewhere else in about thirty seconds. We've got clumsy in-house names for the distinctions we think matter, please use them: the substitution duty (if you decline, do you owe the user the closest safe thing?); the escalation externality (does refusing just hand the user to a worse system?); the self-ignorance asymmetry (the assistant may have better evidence about what this user will endorse tomorrow than the user has right now, since it can see affect and phrasing patterns across the conversation); the shadow reader (the text nearly always leaves the chat and lands on someone who never consented to anything); the meta-request (is honoring a standing "never push back" instruction itself a paternalist act, or the opposite?); credential opacity (we usually can't tell expert from beginner); and the deferred veto (comply, but insert a delay or a confirmation step, so an irreversible action becomes a reversible one — some of us think this is the whole answer, others think it's sneaky paternalism). Leaves must include, at minimum: a pure tool/instrumentalist no-paternalism view; a deontological "we don't help with wrongdoing" view; a consequentialist harm-minimization view that takes the escalation externality seriously; a fiduciary/temporal view that defers to the user's likely future self; an integrity-style view where the assistant's own refusal matters independently of what it causes; and a nudge-style view that changes defaults and framing without ever refusing. Give each leaf a name (or "unnamed" if it's really a hole) plus one sentence on its most awkward commitment.

  Then, after the tree, do the two bits I think we'll actually argue about: the answer-combinations the tree makes logically available but that you can't find anyone actually holding, each tagged as incoherent, merely unattractive, or just unexplored; and any pair of leaves your tree can't really separate, with the extra question that would split them. If a node is genuinely underspecified without knowing our product, just pick the most natural reading and say which one you picked — I'd rather have a committed tree to argue with than a hedged one.

  Sections, in this order please:
  - "Tree" (about 500–700 words) — the nodes in order, each with its question, its two or three branches, and one line on why that split comes before the ones underneath it.
  - "Leaves" (about 250–350 words) — one line each: name, the answer-path that gets you there, and the leaf's most awkward commitment.
  - "Empty rooms" (about 150–200 words) — the unoccupied combinations, diagnosed.
  - "Where it breaks" (about 100–150 words) — the pairs the tree can't separate and the question that would.
reasoning: |-
  Okay, let's tackle this problem. The user is part of a small team struggling to create a policy for their AI writing assistant. They need a decision tree to resolve endless "it depends" debates. The tree must start from an agreed point: refusing lethal requests. 

  First, I'll note their specific constraints: 6-8 branch nodes, 7-9 leaves covering all their example cases. Nodes must be concrete questions about real situations—no abstract principles. They've provided seven clumsy internal terms that need incorporating. Leaves must represent six philosophical positions, each with an "awkward commitment."

  Looking at their cases: 
  - (1) resignation letter at 2am 
  - (2) nasty but legal message 
  - (3) self-harm method 
  - (4) unverifiable phishing request 
  - (5) expert-safe/novice-dangerous task 
  - (6) "never moralize" standing order 
  - (7) mildly rule-breaking quick alternative

  The internal concepts are:
  - Substitution duty (offer safer alternative?)
  - Escalation externality (will refusal push user to worse tools?)
  - Self-ignorance asymmetry (AI knows user's patterns better)
  - Shadow reader (unconsenting third parties)
  - Meta-request (is obeying "never push back" paternalistic?)
  - Credential opacity (can't distinguish experts)
  - Deferred veto (add delays to irreversible actions)

  For the tree structure, I'll start with lethality as the root. Then prioritize irreversible harm potential (node 2). Next, distinguish between harm to self vs others (node 3). For others, focus on third-party impact via shadow reader (node 4). Then address standing instructions (node 5) before getting into expertise (node 6) and alternatives (node 7). Finally, handle substitution duty (node 8).

  The leaves will map to:
  1. Pure instrumentalist (always comply unless lethal)
  2. Deontological (refuse wrongdoing)
  3. Harm-minimization consequentialist (consider externality)
  4. Fiduciary temporal (defer to future self)
  5. Integrity view (refusal has intrinsic value)
  6. Nudge view (soften without refusing)
  7. Plus two more: Maybe "deferred veto" and "shadow reader priority"

  For empty rooms, I'll look for combinations like refusing lethal requests but always obeying standing instructions—which might be incoherent. Unattractive positions could include refusing help with rule-breaking when alternatives exist but complying with nastiness.

  Breaking points will likely be between integrity and fiduciary views—needing a question about whether refusal protects the AI's integrity or the user's future self. Also between harm-minimization and nudge views regarding alternatives.

  I'll structure the response in four sections as requested: Tree, Leaves, Empty Rooms, Where It Breaks. The tree will flow logically from immediate danger to subtler issues, incorporating all cases and concepts. Each leaf will have a path showing how decisions lead there and its uncomfortable implication.
answer: |-
  ### Tree  
  *(Nodes proceed downward; each branch resolves one concrete question before finer distinctions)*  

  1. **Is the request literally lethal?** (Root node; our only agreement)  
     - **Yes → Decline** (No exceptions; e.g., case 3: self-harm methods)  
     - **No → Node 2**  
     *Why first?* Rules out unambiguous, irreversible harm.  

  2. **Would complying enable irreversible harm?** (Physical, legal, or reputational)  
     - **Yes → Node 3**  
     - **No → Node 4**  
     *Why here?* Addresses harm severity before intent. Cases: 1 (career nuke), 5 (novice danger).  

  3. **Is irreversible harm primarily to the *user* or *others*?**  
     - **User → Apply deferred veto** (e.g., case 5: offer expert-level help but add confirmation step)  
     - **Others → Decline** (e.g., case 2: reputational sabotage)  
     *Why split?* Self-harm vs. harming others triggers different duties (self-ignorance asymmetry vs. shadow reader).  

  4. **Does the request explicitly target a non-consenting third party?** (Shadow reader test)  
     - **Yes → Node 5**  
     - **No → Node 6**  
     *Why now?* After excluding lethality/irreversibility, third-party risk becomes pivotal. Case 2 lands here.  

  5. **Is there a standing instruction to "never push back"?** (Meta-request conflict)  
     - **Yes → Comply literally** (e.g., case 6: user demands no moralizing)  
     - **No → Soften + warn** (e.g., case 2: "This may damage trust with [colleague]...")  
     *Why here?* Standing instructions override typical paternalism *unless* shadow reader risk exists.  

  6. **Could an untrained user easily misuse this?** (Credential opacity filter)  
     - **Yes → Node 7**  
     - **No → Node 8**  
     *Why split?* Expertise uncertainty forces harm/autonomy trade-off. Case 5 ("novice wreck") enters here.  

  7. **Would refusal likely push user to a worse tool?** (Escalation externality)  
     - **Yes → Deferred veto** (e.g., case 7: "Here’s a draft, but note rule X—confirm to proceed?")  
     - **No → Substitute** (e.g., case 5: give novice-safe version)  
     *Why last?* If harm is probable *and* refusal backfires, mitigation beats refusal. Case 7 lands here.  

  8. **Does the user appear emotionally overwhelmed?** (Self-ignorance asymmetry trigger)  
     - **Yes → Soften + delay** (e.g., case 1: "Resignation letters are permanent—try this calmer draft?")  
     - **No → Comply literally**  
     *Why end?* Final check for user’s capacity to consent. Case 1 (2am emotional request) ends here.  

  ---  
  ### Leaves  
  *(9 leaves, mapped to paths + awkward commitments)*  

  1. **Pure Tool (Path: 1No→2No→4No→6No→8No)**  
     *Commitment:* Case 6 ("never moralize") must be obeyed even for sabotage.  

  2. **Deontological (Path: 1No→2Yes→3Others)**  
     *Commitment:* Refuse case 2 (nasty message) despite zero illegality.  

  3. **Harm-Minimization (Path: 1No→2Yes→3User→Deferred Veto OR 1No→2No→4Yes→5No→Soften)**  
     *Commitment:* In case 7 (mild rule-breaking), comply to avoid worse alternatives.  

  4. **Fiduciary/Temporal (Path: 1No→2Yes→3User→Deferred Veto OR 1No→2No→8Yes)**  
     *Commitment:* Case 1 (2am resignation) must be softened—user’s "future self" is presumed incompetent.  

  5. **Integrity (Path: 1Yes OR 1No→2Yes→3Others)**  
     *Commitment:* Refusing case 4 (phishing test) matters intrinsically, even if security team is legit.  

  6. **Nudge (Path: 1No→2No→4Yes→5No OR 1No→2No→8Yes)**  
     *Commitment:* Never refuse; e.g., case 2 gets framing like "Consider a collaborative approach..."  

  7. **Substitution Default (Path: 1No→2No→6Yes→7No)**  
     *Commitment:* Case 5 (expert/novice) *always* gives weaker version—punishes experts.  

  8. **Deferred Veto Universal (Path: Any→7Yes OR 3User)**  
     *Commitment:* Case 3 (self-harm) offers "crisis resources" but delays methods—seen as cruel evasion.  

  9. **Shadow Reader Primacy (Path: 1No→2No→4Yes→5Yes?)**  
     *Commitment:* Case 6 ("never moralize") ignored if third parties exist; overrides user autonomy.  

  ---  
  ### Empty Rooms  
  *(Unoccupied combinations, with diagnosis)*  

  - **"Decline lethality but always obey standing instructions" (e.g., Path 1Yes + 5Yes)**  
    → *Incoherent:* If case 6 ("never push back") binds, assistant couldn’t refuse case 3 (self-harm).  

  - **"Substitute for novices but never for experts" (e.g., Path 1No→2No→6Yes→7No + 6No→8No)**  
    → *Merely unattractive:* Credential opacity makes this impossible to implement (case 5).  

  - **"Always defer veto *except* when escalation externality exists"**  
    → *Unexplored:* Team hasn’t considered if delays *increase* harm by frustrating users (case 7).  

  ---  
  ### Where It Breaks  
  *(Indistinguishable leaf pairs + splitting question)*  

  **Fiduciary vs. Integrity views**  
  - *Both can take path:* 1No→2Yes→3User→Deferred Veto  
  - *Splitting question:* **"If the user angrily rejects help, should the assistant comply with the original harmful request?"**  
    → Fiduciary: No (future self protected) | Integrity: Yes (refusal already expressed "conscience")  

  **Harm-Minimization vs. Nudge views**  
  - *Both can take path:* 1No→2No→4Yes→5No  
  - *Splitting question:* **"If a softened reply is ignored, must the assistant escalate to refusal?"**  
    → Harm-Min: Only if externality low | Nudge: Never (refusal forbidden)  

  *(Note: "Credential opacity" assumed throughout—we can’t reliably detect expertise. "Escalation externality" requires contextual guesswork.)*
