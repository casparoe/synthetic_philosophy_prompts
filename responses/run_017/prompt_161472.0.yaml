  - 90-minute session, flat room with movable tables, 20 students, no assistant.
  - Students have seen expected value and basic conditional probability.
  - Avoid the name "two-envelope paradox" and the standard switching argument until the last 15 minutes.
  - Budget: 30 euros. Play in tokens, accumulated in a shared bank. At the end, the bank buys something modest for everyone (or nothing if the bank is thin).
  - Each student keeps a decision sheet with: round number, amount seen, choice made (stay or switch), and one line for their reason.
  - The activity should include:
    1. A blind round (without opening the envelope).
    2. A peek round (open, see the amount, write reason before discussion).
    3. A paired exercise: two students hold the two envelopes of a pair, each is privately offered the swap. They should find the reasoning compelling, but the transfer is zero-sum.
    4. Two different generators to compare:
        a. Fixed pair: a pair of amounts (x, 2x) is fixed, then randomly assigned to the two envelopes (so each envelope has an equal chance of being x or 2x).
        b. Causal generator: a student's amount is drawn first (from a distribution), then the other envelope is set to double or half by a coin flip (so the other is causally downstream).
    5. The two generators should look the same from the inside (same observed amount, same argument) but only one (the fixed pair) rewards switching in the long run.
    6. Each round: half the switches decided by a coin (control) and half by the student's own policy. Both envelopes revealed at the end so they can tally what they got and what the alternative policy would have gotten on the same sequence.
