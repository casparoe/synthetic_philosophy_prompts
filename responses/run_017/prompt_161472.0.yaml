          And we reveal the name of the paradox in the last 15 minutes.

    Handling the student who puts the 1.25x algebra on the board in the peek round:

        - We can ask the class: "In your peek round, did you see an amount and then use this reasoning? Let's test it. In the rounds we played, when you saw an amount x, what was the average of the other envelope? Let's collect data from Generator A rounds and Generator B rounds separately."

        - We can have students volunteer their data: for a particular amount they saw, what was the other amount? Then we compute the average.

        - We should see that for some amounts, the average other is 1.25x, for others not. And in both generators, the overall average gain is zero.

    What might go wrong:

        - Noise in small samples: with only one round per generator, the students might not see the zero overall gain. We can aggregate the class data.

        - Students who peek and still feel nothing: they might not switch. That's fine, we have diversity.

        - The student who refuses to write a reason: we can gently encourage, but not force.

        - The pair of friends who compare amounts mid-round: we instruct clearly at the beginning not to communicate. We can monitor.

    What the activity cannot reproduce:

        - The genuinely one-shot case against an unknown or bottomless generator. In the activity, students know that the amount set is bounded and they see the distribution over rounds. In the one-shot, they don't know the generator. And for a bottomless generator (unbounded), they cannot use a threshold. The pull of the argument is strongest there, and we have to admit that in that case, the argument, though fallacious, has a strong intuitive appeal.

  We now provide the exact instruction wording for each round.

  Round 0 (Blind round):

    "In this round, do not open your envelope. You must decide whether to stay with the envelope you have or switch to the other envelope. Write your decision in the 'My decision' column. Since you cannot see the amount, leave the 'Amount seen' blank. For the reason, you may write 'blind' or any brief thought you had. Also, flip a coin: if heads, the coin's decision is 'stay'; if tails, 'switch'. Write that in the 'Coin's decision' column. After everyone has decided, we will reveal the amounts in both envelopes in your pair. Then, you will be able to compute your outcome and the coin's outcome."

  Round 1 (Peek round, Generator A):

    "In this round, you may open your envelope and see the amount inside. Write the amount in the 'Amount seen' column. Then, decide whether to stay or switch, and write that in 'My decision'. Also, in the 'Reason' column, write a brief reason for your decision in one line. Do not discuss with others. Flip a coin for the control and record the coin's decision. After you have written your decision and reason, we will reveal the other envelope in your pair. Then, you will record your outcome and the coin's outcome."

  Round 2 (Paired exercise, Generator A):

    "In this round, you will work in pairs. You and your partner have two envelopes. Open your own envelope and see the amount. Write the amount. Then, decide independently whether to switch or stay, and write your reason. Also, flip a coin for the control. Do not communicate with your partner. After both of you have decided, you will reveal your amounts to each other. Then, compute your outcome: if you chose to stay, you get the amount you saw; if you chose to switch, you get the amount in your partner's envelope. Record your outcome and the coin's outcome."

  Round 3 (Generator A, bounded):

    "In this round, you will receive an envelope. Open it and see the amount. Decide whether to stay or switch. You do not need to write a reason. Flip a coin for the control. After everyone has decided, we will reveal the other envelope in your pair. Record your outcome and the coin's outcome."

  Round 4 (Generator B, bounded):

    "In this round, you will receive an envelope. The amounts are generated differently, but you won't know how. Open it and see the amount. Decide whether to stay or switch. You do not need to write a reason. Flip a coin for the control. After everyone has decided, we will reveal the other envelope in your pair. Record your outcome and the coin's outcome."

  Tallying:

    "Sum up your tokens for 'My outcome' column for all rounds. Also, sum up the tokens for the 'Coin outcome' column for all rounds. Report your totals to the teacher. We will sum the class totals and convert to euros for the class bank."

  Debrief:

    We will follow the points outlined above.

  This design meets the requirements.
answer: |-
  Below is a complete, runnable session plan for your 90-minute seminar on the two-envelope paradox. It includes materials, procedures, a detailed timeline, exact instructions, and debriefing guidance. The design ensures students act and discover key insights without premature exposure to the paradox, uses real stakes within budget, and addresses common pitfalls.

  ---

  ### **Materials & Preparation (Budget: €30)**
  - **Tokens**: Use poker chips or printed card tokens (1 token = €0.01; max expected tokens/student = 250, total class max ~5,000 tokens = €50, but capped at €30 via scaling if needed).
  - **Envelopes**: 120 envelopes (6 rounds × 20 students). Pre-fill amounts using generators (details below).
  - **Decision Sheets**: Printed tables for students (one per student; [see template](#decision-sheet-template)).
  - **Generator Tools**:
    - **Generator A (Fixed Pair)**: For each pair of envelopes, choose a base amount `x` from {5, 10, 20, 40} (uniformly random). Assign `x` to one envelope and `2x` to the other (coin flip decides assignment).
    - **Generator B (Causal)**: For each pair, choose a seed amount from {10, 20, 40} (uniformly random). Flip a coin: heads, other amount = `2 × seed`; tails, other amount = `seed/2`. Assign amounts randomly to envelopes.
  - **Coins**: 20 coins (one per student) for control decisions.
  - **Shared Bank**: A box to collect tokens; funds buy snacks for all if ≥€15, else nothing.

  ---

  ### **Session Timeline (90 Minutes)**
  #### **0–5 min: Setup & Introduction**
  - **Instructions**:  
    "Today, we’ll play a game with envelopes containing tokens. Your tokens go into a shared bank; if we earn enough, I’ll buy snacks for everyone. In each round, you’ll get an envelope. Sometimes you’ll see the amount inside, sometimes not. You’ll decide: **stay** with your envelope or **switch** to the other one. Record every choice on your sheet—amount seen, your decision, coin’s decision, and sometimes a reason. Never discuss amounts mid-round. After each round, both envelopes in a pair are revealed so you can score outcomes."

  #### **5–15 min: Round 0 (Blind Round)**
  - **Goal**: Experience decision under ignorance.  
  - **Generator**: A (Fixed Pair, amounts {5,10,20,40,80}).  
  - **Procedure**:  
    1. Distribute envelopes (pre-filled: 10 pairs via Generator A).  
    2. **Instructions**: "Do **not** open your envelope. Decide now: stay or switch? Write your choice. Also, flip a coin for the control: heads=stay, tails=switch. For reason, write ‘blind’ or a one-word gut feeling (e.g., ‘lucky’)."  
    3. Reveal both envelopes in each pair. Students record:  
       - Outcome (tokens gained based on their decision).  
       - Outcome if they’d done the opposite.  
       - Coin’s outcome.  
  - **Teacher Note**: Ensure no peeking; reveal envelopes swiftly.

  #### **15–25 min: Round 1 (Peek Round)**
  - **Goal**: Elicit personal reasoning; set up paradox.  
  - **Generator**: A (Fixed Pair, same amounts).  
  - **Procedure**:  
    1. Distribute new envelopes (Generator A).  
    2. **Instructions**: "Open your envelope. See the amount? Write it. Decide: stay or switch? In the ‘reason’ box, write one sentence explaining why—e.g., ‘I saw 10, so I think the other is 20 or 5’. Then flip a coin for the control."  
    3. Reveal both envelopes. Students record outcomes (as in Round 0).  
  - **Teacher Note**: Collect reasons silently; note students using "double/half" logic.

  #### **25–35 min: Round 2 (Paired Exercise)**
  - **Goal**: Show symmetry of reasoning; zero-sum transfer.  
  - **Generator**: A (Fixed Pair, same amounts).  
  - **Procedure**:  
    1. Pair students (10 pairs). Distribute one envelope per student in each pair.  
    2. **Instructions**: "Open your envelope. Decide independently: stay or switch? Write your amount, decision, and reason. Flip a coin for control. **Do not talk to your partner.**"  
    3. **Reveal & Resolve**:  
       - Partners reveal amounts to each other.  
       - For each student: Outcome = other’s amount if they switched, their amount if stayed.  
       - Record outcomes.  
  - **Teacher Note**: Watch for mid-round sharing; intervene if partners communicate.

  #### **35–50 min: Rounds 3 & 4 (Generator Comparison)**
  - **Goal**: Contrast Fixed Pair (A) vs. Causal (B); same observed amounts, different outcomes.  
  - **Rounds**:  
    - **Round 3 (Generator A)**: Fixed Pair (base {5,10,20,40}).  
    - **Round 4 (Generator B)**: Causal (seed {10,20,40}).  
  - **Procedure (each round)**:  
    1. Distribute envelopes (pre-filled per generator).  
    2. **Instructions**: "Open your envelope. See the amount? Decide: stay or switch. No reason needed—just decide. Flip a coin for the control."  
    3. Reveal both envelopes. Record outcomes (as before).  
  - **Teacher Note**: Do not mention generator differences; students should feel the contrast empirically.

  #### **50–60 min: Round 5 (Threshold Policy & Stretched Set)**
  - **Goal**: Show threshold beats blind switching in bounded sets; advantage fades when stretched.  
  - **Generator**: A (Fixed Pair), first with base {5,10,20,40}, then {5,10,20,40,80}.  
  - **Procedure**:  
    1. **Part 1 (Bounded)**: Use base {5,10,20,40}. Instructions: "Decide: if amount < 40, switch; else, stay. Flip a coin for control." Reveal and record.  
    2. **Part 2 (Stretched)**: Use base {5,10,20,40,80}. Instructions: "Same rule: if amount < 40, switch; else, stay." Reveal and record.  
  - **Teacher Note**: Later, debrief why threshold worked in bounded set but not stretched.

  #### **60–75 min: Tallying & Data Collection**
  - Students sum their tokens (own, opposite, and coin) across rounds.  
  - Teacher aggregates class token totals on the board.  
  - Convert tokens to euros (e.g., 2,500 tokens = €25; scale if over €30).  
  - Announce: "Bank = €X; we’ll buy snacks if ≥€15."  

  #### **75–90 min: Structured Debrief**
  - **Map to Student Actions**:  
    1. **Blind Round**: "Who switched blindly? Did the coin beat you? Why might no-info switching break even?"  
    2. **Peek Round**: "Share reasons. Many said: ‘I saw X, so the other is 2X or X/2’. Let’s test this."  
    3. **Paired Exercise**: "When both switched, you swapped tokens—zero-sum! The argument feels compelling but cancels out."  
    4. **Generators A vs. B**:  
       - Display class data: Avg gain from switching in A ≈0, in B ≈0.  
       - "Same amounts, same argument—why no gain? *How* amounts are generated matters."  
    5. **Threshold Policy**: "In bounded sets, switching only below 40 avoided losses at 80. In the stretched set (max=160), the rule fails—you miss gains at 80 (other=160)."  

  - **Handle the 1.25x Algebra**:  
    - If a student presents: "If I see X, the other is 2X or X/2, so expected value = 1.25X!"  
    - Respond: "Brilliant! Let’s test it. Class: for all times you saw 10, what was the actual other amount?"  
    - Aggregate data from sheets:  
      - Generator A: When saw 10, other was 5 (50% of time) or 20 (50%) → avg=12.5 (1.25×10).  
      - Generator B: When saw 10, other was 5 (33%) or 20 (67%) → avg=15 (1.5×10).  
    - "The algebra assumes 50/50 odds, but Generator B breaks this. Your envelope’s origin affects the odds."  

  - **Predictable Issues**:  
    - **Noise in small samples**: "Some saw gains/losses by chance. Class averages smooth this."  
    - "Peeked but felt nothing": Normal—some stay with high amounts; their data shows staying can win.  
    - **Refused reason**: Use peer pressure; skip if persistent.  
    - **Friends cheated**: "If you compared mid-round, your data is invalid. Is the argument so compelling you had to share?"  

  - **Limitation of Activity**:  
    - "In class, you saw the generator and played repeatedly. But in a true one-shot with an *unknown, unbounded* generator (e.g., amounts could be 5, 10, 20, 40, 80, 160, 320...), the 1.25X argument feels inescapable. No experiment can simulate this—it’s why the paradox is deep. You must ask: does the generator have bounds? Without that, switching *always* seems better."  

  - **Key Insight**:  
    "Peeking only helps if it reveals bounds. The ‘double or half’ logic isn’t wrong—it’s incomplete. It depends *entirely* on how envelopes were filled. Your reason ("I saw X, so the other is 2X or X/2") never came from the envelope—it came from you assuming uniform odds. Today, you proved that assumption isn’t free."

  ---

  ### **Decision Sheet Template**
  Print one per student:

  | Round | Amount Seen | My Decision (Stay/Switch) | Reason                                  | Coin’s Decision (Stay/Switch) | My Outcome | If Opposite Outcome | Coin’s Outcome |
  |-------|-------------|-----------------------------|----------------------------------------|-------------------------------|-----------|---------------------|---------------|
  | 0     | -           |                             | (e.g., "blind" or "gut: switch")      |                               |           |                     |               |
  | 1     |             |                             | (e.g., "Saw 10, expect 20 or 5")      |                               |           |                     |               |
  | 2     |             |                             | (e.g., "Saw 20, could get 40")        |                               |           |                     |               |
  | 3     |             |                             | -                                      |                               |           |                     |               |
  | 4     |             |                             | -                                      |                               |           |                     |               |
  | 5a    |             |                             | (Threshold: if <40, switch)           |                               |           |                     |               |
  | 5b    |             |                             | (Threshold: if <40, switch)           |                               |           |                     |               |
  | **Total Tokens** | | | | | **[Sum]** | | **[Sum]** |

  ---

  ### **Why This Works**
  - **Paradox Delayed**: No "two-envelope" name or switching argument until debrief.  
  - **Generators Contrasted**: A and B use identical amounts but different mechanics; students feel the difference via aggregated outcomes.  
  - **Threshold & Stretching**: Bounded sets show threshold’s edge; stretching drains it without changing student logic.  
  - **Real Stakes**: Tokens create engagement; shared bank incentivizes collective play.  
  - **Hands-On Discovery**: Students write reasons first, then see contradictions in their own data.  
  - **Debrief Anchored in Experience**: Every point ties to student actions, making the paradox visceral.  

  Run this as-is, and your class will grasp the paradox’s mechanics—and its philosophical tension—through their own choices.
