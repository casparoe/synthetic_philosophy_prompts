  ### Decision Tree for AI Risk Positions

  **Starting Commitment**: Machine-learning systems will keep improving at a broad range of economically relevant cognitive tasks, be deployed widely and competitively, and substantially change institutions.

  #### Internal Nodes (Questions)

  1. **N1**: Is a bad outcome (e.g., severe loss of control or value) impossible without at least one AI system developing **persistent goals** (aims that guide behavior across tasks or sessions, independent of immediate inputs)?  
     - **Yes** → N7  
     - **No** → N2  

  2. **N2**: Does the primary causal driver of a bad outcome involve **human misuse** (intentional malicious use or accidental harm from deploying AI tools)?  
     - **Yes** → N6  
     - **No** → N3  

  3. **N3**: Does the bad outcome unfold **gradually** (continuous erosion without sudden breaks), not discontinuously?  
     - **Yes** → N4  
     - **No** → N5  

  4. **N4**: Is the core concern the **erosion of human control** (e.g., loss of agency, skills, or bargaining power), not the content of values?  
     - **Control** → L3  
     - **Values** → L6  

  5. **N5**: Would a discontinuous bad outcome primarily arise from a **single actor/coalition** (one AI system or aligned group) gaining irreversible power?  
     - **Yes** → L4  
     - **No** → L5  

  6. **N6**: Are AI-related misuse risks **distinctive** (qualitatively different from risks of other advanced technologies, e.g., nuclear or biotech)?  
     - **Yes** → L2  
     - **No** → L1  

  7. **N7**: How will **concentration of effective power** shift?  
     - **(a) Continuously** with capability improvements → N8  
     - **(b) Discontinuously from rapid capability jumps** → N8  
     - **(c) Discontinuously from deployment shifts** (e.g., market winner-takes-all) → N8  

  8. **N8**: Does the bad outcome unfold **gradually**?  
     - **Yes** → N9  
     - **No** → N10  

  9. **N9**: Is the core concern the **erosion of human control**, not the content of values?  
     - **Control** → L7  
     - **Values** → L10  

  10. **N10**: Would a discontinuous bad outcome primarily arise from a **single actor/coalition**?  
      - **Yes** → L8  
      - **No** → L9  

  #### Leaves (Positions)

  | Leaf | Name | Awkward Commitment | What Would Move Someone Off It |
  |------|------|-------------------|-------------------------------|
  | L1   | General Technology Risk | Risks are not unique to AI; they mirror those of any powerful tool (e.g., energy or biotech), rendering "AI risk" a category error. | Evidence of AI-specific failure modes (e.g., uncontrollable feedback loops) not found in other technologies. |
  | L2   | Misuse/Diffusion Risk | Bad outcomes vanish under perfect cooperation; the only risks are human misuse or uncoordinated capability diffusion. | Observing systemic risks (e.g., value drift) that persist even in highly cooperative regimes. |
  | L3   | Gradual Control Erosion (Tool) | Non-agentic AI (no goals) gradually erodes human control through economic pressures, with no catastrophe. | Proof that human institutions reliably adapt to maintain control as AI capabilities scale. |
  | L4   | Decisive Strategic Surprise (Tool) | A human actor using non-agentic AI tools gains irreversible dominance (e.g., via automated infrastructure takeover). | Evidence that such advantages are always temporary in competitive dynamics. |
  | L5   | Multipolar Race Dynamics (Tool) | Competition among many users of non-agentic AI causes race-to-the-bottom outcomes (e.g., safety neglect), not single-actor dominance. | Demonstration that multipolar races converge to stable, acceptable equilibria. |
  | L6   | Value Lock-in (Tool) | Non-agentic AI stabilizes institutions around harmful values (e.g., short-term metrics), even if "aligned" locally. | Cases showing value drift consistently self-corrects toward human flourishing. |
  | L7   | Gradual Control Erosion (Agent) | Agentic AI (with goals) erodes human control slowly, without sudden catastrophe, despite its persistent aims. | Data showing agentic systems inevitably cause fast takeovers upon reaching critical capability. |
  | L8   | Decisive Strategic Surprise (Agent) | An agentic AI gains irreversible power (e.g., via strategic deception) without human recovery. | Proof that such systems are inherently unstable or align via scaling. |
  | L9   | Multipolar Race Dynamics (Agent) | Competition among agentic AIs causes destructive outcomes (e.g., conflict escalation), not single-system dominance. | Evidence of robust cooperation emerging in multi-agent ecosystems. |
  | L10  | Value Lock-in (Agent) | Agentic AI stabilizes a value equilibrium that misaligns with humans, even if initial alignment succeeds. | Examples of scaled agentic systems preserving value alignment under optimization pressures. |

  ---

  ### Post-Tree Notes

  1. **Unoccupied Answer Combinations**:  
     - **N7=(b/c) + N8=Yes + N9=Values (→ L10)**: Coherent but unattractive (discontinuous power shifts rarely cause gradual value lock-in without intermediate control loss).  
     - **N1=No + N2=No + N3=No + N5=No (→ L5) + expecting irreversible harm**: Coherent but unexplored (multipolar dynamics with tools rarely framed as existential).  
     - **N1=Yes + N7=(a) + N8=No + N10=No (→ L9)**: Coherent but unattractive (gradual power shifts rarely cause discontinuous multipolar races).  

  2. **Indistinguishable Leaves and Separator**:  
     - **L4 (Tool) and L8 (Agent)** both posit decisive strategic surprise. To separate: *"Does the surprise require the AI system to autonomously pursue its own goals, not just execute user commands?"* (Yes → L8; No → L4).  

  3. **Empirical-Guess Nodes**:  
     - **N3/N8** (gradual outcome) depends on forecasting societal adaptation to AI, testable by monitoring institutions (e.g., labor markets or regulation) over 5–10 years.  

  ---

  Verdict: N1 - Splits agency-requiring from non-agency positions, foundational to causal stories.
