prompt: |-
  Hi. I'm one of two people who cover the clinical ethics consult line at a 400-bed community hospital — the other is a nurse practitioner, I'm a hospitalist by training, and between us we have maybe one undergrad philosophy course that I mostly slept through. We get paged three or four times a month, almost always at 2am, almost always by phone, with the family at the bedside and the charge nurse wanting an answer before shift change. I've got 20–30 minutes and whatever's in the EMR. What comes out the other end is a short note in the chart that the attending signs and, if anything is even slightly unusual, risk management has to be able to defend a year later.

  The consults that actually wreck me are all the same shape underneath: is what we're about to do *stopping something* or *making something happen*, and does that difference matter here. The team's working distinction is our medical director's slogan — "we don't do things to kill people, we just stop doing things to them" — which is fine as a bumper sticker and useless at 2am. And the half-remembered philosophy I have doesn't convert either: something about double effect, and something about whether you initiate a lethal sequence or just fail to interrupt one (the "direction of agency," I want to say? whoever it was seems to think *that* is the real cut, not the bodily-movement one). I can't turn either into a checklist, and I've noticed we can't even get started because "letting die" needs a baseline and I genuinely don't know which baseline to use: the disease's natural course (in which case nobody in an ICU is ever "allowing" anything), the patient's current supported state (in which case every withdrawal is a killing), or just whatever this unit normally does for this diagnosis (which feels like it makes the whole thing a local custom with moral language stapled to it). Pick one for me, tell me what breaks under the other two, and mark clearly which part of that choice is a values call I should be naming out loud in the note instead of burying.

  So: write me a decision procedure my NP or I can actually run at 2am, in order, with what counts as a sufficient answer to each question, where it hard-stops with a no, and where it hands off to a person because the question is one of values or of facts nobody can get in thirty minutes. Please keep three questions separate that we constantly mush together: (1) is this permissible at all, (2) is this what a decent clinician should be offering here (those come apart — we can all feel it, I can't say how), and (3) is it fair to ask *this* nurse to be the one in the room, given that "I'll write the order but I don't want to be there" is a position half our staff holds and I've never decided whether it's coherent. The procedure should also tell us when the right move is to do nothing for twelve hours and re-page, and it should say what the chart note has to contain so it survives risk management — I don't want elegant reasoning that reads badly to a lawyer. Give me a one-page cheat-card version and then a slightly longer annotated version, and be straight with me about which steps are really just the intent/foresight distinction in a lab coat and which ones are doing independent work.

  Then run it on three cases.

  1. Terminal extubation, 58-year-old, hypoxic brain injury, family wants it now, two nurses have said they'd rather not be assigned to the room, and the resident has already put in orders for fentanyl and midazolam "for air hunger" starting before we pull the tube.
  2. Deactivating a destination-therapy LVAD in a 61-year-old who is not otherwise dying — no disease process is going to stop his heart, the pump is the only reason it keeps beating, and if we switch it off he dies in minutes. The team is split on whether this is the same as extubation or is something categorically different, and I can't tell if that split is moral or just squeamishness about hardware.
  3. A 79-year-old on the ventilator with a catastrophic GI bleed, where the plan everyone has quietly agreed to is "no escalation" — no more blood products, no more pressor — while leaving the vent running, which means he dies slowly over a day and a half instead of quickly. I have a horrible feeling your procedure is going to tell me this is not morally different from withdrawing and is *worse for him*, and that we only do it because it feels better to us. If that's where it goes, say so and then tell me what I'm supposed to do with that at 2am with his daughter in the room.

  Finally: tell me where the procedure misfires. I already suspect it'll get gamed by framing (we're very good at describing things as "not starting"), that it'll get used to rubber-stamp whatever the attending wanted, and that getting the metaphysics right does nothing at all for a nurse who's been crying in the break room. But you'll see failure modes I haven't. And please: no citations, no reading lists, no "you should really read X" — I have no library access and I want your argument in your own words, not a map to somebody else's.
reasoning: |-
  Okay, let me start by really understanding the user's situation. They're a hospitalist doing clinical ethics consults at a community hospital with minimal formal training. The consults come in at 2am, often with family at the bedside and pressure to decide quickly. The core issue seems to be distinguishing between stopping treatment versus actively causing death, and how to apply that in real-time decisions.

  First, I need to unpack their main pain points. They mentioned three recurring questions: permissibility, what clinicians should offer, and fairness to the nurse involved. They also need a practical decision tool that works under time constraints and holds up legally. The examples given—terminal extubation, LVAD deactivation, and withholding escalation in a GI bleed—highlight scenarios where the line between allowing death and causing it feels blurred.

  The user's underlying struggle is with the baseline for "letting die." They listed three options: the disease's natural course, the current supported state, or local standards. Each has flaws. Using the natural course makes everything in ICU artificial, so withdrawing support isn't allowing death. The current state baseline makes any withdrawal an active killing. Local standards risk moral relativism. They need a principled yet practical choice here.

  I think I should propose a baseline of the current supported state but reframe it as "current clinical state" to avoid implying permanence. This is clinically verifiable and avoids the pitfalls of the other options. The key is to note that withdrawing artificial interventions isn't killing but ceasing to prolong dying. The values call here is naming that we're not obligated to prolong life at all costs—this should be explicit in the chart note.

  For the decision procedure, it needs to be step-by-step, with clear stopping points and handoffs. Separating the three questions is crucial. For permissibility, focus on whether the action is stopping an intervention versus initiating a new harm. For clinician offering, it's about standard of care and patient values. For nurse fairness, it's about conscience and support.

  The cheat sheet must be one page for quick use. Annotations can explain the reasoning. Steps should flag when to pause and re-page, like when there's unresolved disagreement or unclear patient values. Legal robustness means documenting the decision process, not just the conclusion, and stating the values explicitly.

  Testing the cases:
  1. Terminal extubation: Permissible since stopping vent is withdrawing treatment. Offering comfort meds is standard. Nurses can opt out if others cover. Note must state intent is comfort, not hastening death.
  2. LVAD deactivation: Similar to extubation—stopping a life-sustaining treatment. Permissible if consistent with patient wishes. The team's discomfort might be squeamishness, not moral difference. Document that LVAD is medical intervention, deactivation is withdrawal.
  3. Withholding escalation in GI bleed: Permissible but suboptimal. Slow death vs. quicker withdrawal. Ethically, withdrawing vent might be better but hard to implement at 2am. Note should recommend revisiting withdrawal and ensuring comfort.

  Failure modes: Framing bias, where teams call things "not starting" to fit the procedure. Also, power dynamics might override ethics. Plus, emotional toll on staff isn't addressed by the procedure. Need to acknowledge these and suggest team debriefs and support.

  The user's deeper needs: They want moral clarity without philosophy jargon, a tool that respects time constraints, and validation of their intuition that some practices are for staff comfort. They also need legal protection through documentation. Recognizing that the procedure can't fix systemic issues but can provide a structured approach is key.
answer: |-
  Here's a practical decision procedure designed for 2am consults, separating your three questions. It uses the **current supported state** as the baseline for "letting die" (explained below). The one-page cheat card is first, followed by annotations and case applications.

  ---

  ### **ONE-PAGE CHEAT CARD: ETHICS CONSULT DECISION PROCEDURE**  
  *(Run in order. Timebox: 20 min. If stuck at any ★, pause and re-consult at 8am.)*

  1. **PERMISSIBILITY (Is this legally/ethically allowed?)**  
     - **Q1:** Is the proposed action **stopping an ongoing intervention**?  
       *Sufficient:* Removing a treatment (vent, LVAD, pressor) or not starting a *new* one (surgery, CPR).  
       *Hard stop if NO → Action may be active killing. DO NOT PROCEED.★*  
     - **Q2:** Is there **valid refusal of treatment**? (Advance directive, surrogate decision-maker per state law, clear prior wishes).  
       *Sufficient:* Documented refusal or surrogate consent to stop.  
       *Hard stop if NO → Seek legal/risk management.★*  
     - **Q3:** Is the **primary intent symptom relief** (if giving meds)?  
       *Sufficient:* Meds dosed for comfort (e.g., standard opioid/sedative protocols), not bolus to suppress breathing.  
       *Hard stop if NO → Action may be euthanasia.★*  
     **→ If YES to all: Permissible.** *Chart Note Must State:* "Withdrawal/withholding of [intervention] per valid refusal. Comfort measures for symptom control."  

  2. **CLINICIAN OFFERING (Should we proactively suggest this?)**  
     - **Q4:** Is the **burden of treatment disproportionate** to benefits?  
       *Sufficient:* Treatment prolongs dying, causes severe suffering, or conflicts with patient values (e.g., "no machines").  
       *Handoff if UNCLEAR → Needs goals-of-care discussion.★*  
     - **Q5:** Is this **aligned with standards of care**?  
       *Sufficient:* Supported by guidelines (e.g., palliative extubation) or consensus at peer institutions.  
       *Handoff if NO → Ethics committee review.★*  
     **→ If YES to both: Should be offered.** *Chart Note Must State:* "Option discussed as consistent with standard care given prognosis/burdens."  

  3. **FAIRNESS TO STAFF (Can we assign this task?)**  
     - **Q6:** Is the **objection conscience-based** (not logistical)?  
       *Sufficient:* Moral/religious objection to the *act itself* (e.g., "I can’t turn off a LVAD").  
       *Not sufficient:* "I’m busy," "It’s sad."  
     - **Q7:** Can **another qualified staff member** take over?  
       *Sufficient:* Coverage exists without compromising safety.  
       *Hard stop if NO → Delay until shift change.★*  
     **→ If YES to both: Assign alternate staff.** *Chart Note Must State:* "Staff reassigned per conscientious objection policy."  

  **PAUSE & RE-PAGE IF:**  
  - Disagreement among team/surrogates ★  
  - Uncertain prognosis or patient values ★  
  - Novel/unfamiliar technology (e.g., experimental device) ★  

  ---

  ### **ANNOTATED VERSION**  
  **Baseline Choice: Current Supported State**  
  - *Why this?* "Letting die" requires a reference point. The **disease’s natural course** ignores medicine’s role (making all ICU deaths "preventable"). **Local custom** is morally arbitrary. **Current supported state** defines interventions *in place now* as the status quo. Withdrawing them isn’t killing; it’s allowing the underlying illness to proceed.  
  - *Values Call to Name in Note:* **"We are not obligated to prolong life when treatments burden the patient without benefit, even if death results."**  
  - *What Breaks Under Other Baselines:*  
    - *Natural course:* Makes withdrawal of a vent (keeping a drowning person afloat) "killing."  
    - *Local custom:* Could justify non-beneficial treatments if "usual" (e.g., routine CPR in terminal cancer).  

  **Key Distinctions:**  
  - **Permissibility (Q1-3)** hinges on *act description* (stopping vs. starting) and *intent*. This *is* "double effect" in a lab coat.  
  - **Clinician Offering (Q4-5)** hinges on *proportionality* and *standard of care*—this does independent work, separating "allowed" from "should do."  
  - **Staff Fairness (Q6-7)** is about *moral residue*, not the act’s permissibility. "I’ll order but won’t be there" is *incoherent* for nurses (they execute the act); it’s *coherent* for physicians (ordering ≠ doing).  

  **Why This Works at 2am:**  
  - Uses objective markers: Is the vent/LVAD/pressor *currently running*? Is there a valid refusal?  
  - Avoids metaphysics: "Stopping an intervention" is clinically verifiable.  
  - Legal Robustness: Focuses on intent (symptom relief), valid consent, and standard practices.  

  ---

  ### **CASE APPLICATIONS**  

  #### **1. Terminal Extubation**  
  - **Permissibility:**  
    - Q1: YES (stopping vent).  
    - Q2: YES (family consent).  
    - Q3: YES (fentanyl/midazolam for air hunger is standard).  
  - **Clinician Offering:**  
    - Q4: YES (futile care in irreversible brain injury).  
    - Q5: YES (standard palliative care).  
  - **Staff Fairness:**  
    - Q6: YES (conscience objection).  
    - Q7: YES (assign other nurses).  
  **→ Proceed. Chart Note:** "Withdrawn per surrogate request. Comfort meds for dyspnea. Nursing staff reassigned."  

  #### **2. LVAD Deactivation**  
  - **Permissibility:**  
    - Q1: YES (stopping a *treatment*—the pump. LVAD is external life support, like a vent).  
    - Q2: YES (presume valid consent).  
    - Q3: N/A (no meds).  
  - **Clinician Offering:**  
    - Q4: YES (patient’s values > prolonging life with device burden).  
    - Q5: YES (consensus: LVAD deactivation = treatment withdrawal).  
  - **Staff Fairness:**  
    - Q6/Q7: Address like Case 1.  
  **→ Permissible and should be offered.** *Chart Note:* "LVAD deactivated per request. Consistent with withdrawal of life-sustaining treatment." *Team’s split is squeamishness, not moral.*  

  #### **3. Withholding Escalation in GI Bleed**  
  - **Permissibility:**  
    - Q1: YES (not starting pressors/transfusions = withholding).  
    - Q2: YES (presume agreement).  
    - Q3: N/A.  
  - **Clinician Offering:**  
    - Q4: **NO**—Withholding causes slow death (hours-days) *without* proportional benefit. Vent withdrawal would be *faster and kinder* if death is inevitable.  
    - Q5: **NO**—Standard care is comfort-focused when death is imminent.  
  - **Staff Fairness:**  
    - N/A (no direct "act" to object to).  
  **→ Not what should be offered.** *At 2am:* **Re-page at 8am ★** for urgent goals-of-care discussion. Say to daughter: "Right now, we’re ensuring comfort. Tomorrow, we’ll discuss whether continuing the ventilator aligns with his values." *Chart Note (for now):* "No escalation per plan. Re-consult ethics for goals-of-care review."  

  ---

  ### **WHERE IT MISFIRES**  
  1. **Framing Bias:** Teams may call *withholding* a treatment "not starting" (always permissible) but *withdrawing* the same treatment "killing." *Mitigation:* Ask: "Is the **patient dependent** on this *now*?" (e.g., LVAD/vent = yes; dialysis 3x/week = no).  
  2. **Rubber-Stamping Power:** Attendings might force a "valid refusal." *Mitigation:* Q2 requires *documented* refusal/surrogate authority—no doc, no proceed.  
  3. **Ignores Suffering:** The procedure okays *permissible* acts but can’t fix a system that abandons staff. For the crying nurse: **"This is ethically sound, but your distress is real. Let’s find coverage and debrief tomorrow."**  
  4. **Novel Tech:** Fails for non-standard cases (e.g., deactivating a neural implant). ★ triggers re-consult.  
  5. **Moral Distress ≠ Wrongness:** Permissible acts (e.g., extubation) may *feel* like killing. The procedure can’t absolve guilt—only acknowledge it.  

  **Final Note:** This isn’t philosophy—it’s damage control. Your 20-minute note must:  
  - **State facts:** "Stopped X." "Comfort meds at standard doses."  
  - **Name values:** "Not obligated to prolong life when burdens > benefits."  
  - **Cite authority:** "Per surrogate decision-maker [name]."  
  That’s what risk management needs.
