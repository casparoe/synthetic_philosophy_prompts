prompt: |-
  Hey — I'm in a tiny second-year reading group on moral psychology (four of us, plus one faculty member who keeps saying "you're all asking different questions" and then refuses to say what the questions are), and we've now burned three sessions on whether an action has moral worth only when the agent does it for the right reasons. It is going nowhere and I want a diagnosis, not a verdict. Please don't give me a survey of the positions or a reading list — we've read the Kantian side, the one-thought-too-many complaints about the man who jumps in to pull his wife out of the water, the situationist worry that basically nobody deliberates the way the duty story seems to require, and the view that what matters is just acting from decent motives whether or not the agent thinks of them as reasons. Assume all of that; I want to know why the argument doesn't move.

  Here's the shape of our deadlock, concretely. One of us holds that moral worth requires the right-making feature to be what the agent is actually guided by — help given because the person needed help, not because it was fun or prestigious or tax-deductible. Another holds that this is a fetish of self-consciousness, and that worth tracks quality of will: if you reliably want the right things and act on them, you have it, and demanding that you also think "because this is right" just adds a thought that would make you worse. A third has basically given up on moral worth as a notion and wants to replace talk of worth with talk of praise, blame, accountability and what we should encourage in each other. The case that broke us was one I invented: a hospital finance officer who spots a billing irregularity, flags it, and would definitely have flagged it either way — because it's fraudulent and because it would have blown up a budget target she cares a lot about. My attempt at a tiebreaker was a counterfactual-substitute test: strip away the self-interested reason, and ask whether she'd still have flagged it; if yes, she has moral worth, if no she doesn't, and the fact that the good reason wasn't the one doing the guiding work doesn't matter. Half the group said this is obviously right, half said it obviously changes the subject.

  My own hypothesis, which nobody liked, is that "moral worth" is doing three different jobs and each camp has silently picked one: an appraisal job (does this agent deserve credit, is she praiseworthy), a guidance job (what should we tell people to aim at, what should we cultivate in children), and something closer to a claim about what makes actions right in the first place — and that the views look inconsistent only because a view that's plausible for one job is being read as an answer to all three. A weaker bit of evidence: at a conference dinner we read the same vignette to a handful of people and asked three questions — "did she deserve moral credit", "did she do it for the right reasons", "is she a good person" — and the verdicts came apart in a way that felt like it shouldn't have. So: is this a verbal dispute, a substantive one about which psychological states matter, a hidden empirical question about how people actually deliberate, a fight about which cases count as data (stylized vignettes vs. real agents vs. saints), or an ill-posed question wearing the costume of a hard one? Tell me what each side is actually committed to, where my hypothesis is wrong, and — given the diagnosis — what would count as real progress here: a distinction, an empirical finding, a change of question, or an honest argument that we should expect none. American English throughout, please.
reasoning: |-
  Okay, let me start by unpacking this user's problem. They're stuck in a moral psychology reading group debating whether moral worth requires acting for the right reasons. They've hit a deadlock with three distinct positions: one insisting on conscious motivation by right-making features, another rejecting "duty-thoughts" as fetishistic in favor of reliable good motives, and a third abandoning moral worth entirely for praise/blame frameworks. The user's hospital billing case—where the officer acts for both moral and self-interested reasons—became the breaking point.

  The user's own hypothesis is that "moral worth" is being used for three different jobs (appraisal, guidance, metaphysical grounding), causing apparent inconsistency. Their dinner experiment showed diverging intuitions on "deserves credit," "did it for right reasons," and "is good person." They want a diagnosis, not more theory—specifically asking: Is this verbal? Substantive? Empirical? Ill-posed?

  Hmm. First, I notice the faculty member's cryptic "asking different questions" remark is key. The user is onto something with their tripartite hypothesis, but it needs refining. The three positions aren't just prioritizing different jobs; they're operating in distinct conceptual territories entirely. Let me map this:

  - Position 1 (right-making feature as guide) cares about the *mental architecture of deliberation*. It's a theory of moral psychology—how motives function in the moment.  
  - Position 2 (quality of will) cares about *character assessment*. It's about stable traits, not episodic reasoning.  
  - Position 3 (praise/blame focus) cares about *social practices of accountability*. It's pragmatic, not descriptive.  

  The counterfactual test failed because it smuggled in Position 1's framework (isolating motives) while Position 2 sees motives as non-modular ("reliably wants good things" can't be split). Position 3 would reject the test as irrelevant—what matters is whether we *should* reinforce such behavior.  

  The user's dinner experiment reveals the fissures: "did it for right reasons" probes mental architecture, "deserves credit" probes social accountability, "is good person" probes character. Different domains, different criteria.  

  So the core issue isn't ambiguity in "moral worth"—it's that the group is using one term across three incommensurable frameworks. Progress won't come from better arguments but from:  
  1. Explicitly adopting one framework (e.g., "Let's agree we're asking about praiseworthiness today")  
  2. Or mapping how answers in one domain constrain others (e.g., "If character is about reliable motives, can episodic deliberation be irrelevant?")  
  3. Or confronting the meta-question: "Why do we care about moral worth? To grade agents? Guide education? Assign blame?"  

  The faculty member's evasion is understandable—they see the frameworks clashing but want students to notice it themselves. The user's hypothesis is mostly right but undersells the radical divergence: these aren't three jobs for one concept but three distinct concepts forced into a single label. Real progress? Either:  
  - A negotiated distinction (e.g., "moral credit" vs. "virtuous disposition")  
  - Or agreement that moral psychology needs all three lenses, with clarity about which is in use  
  - Or—the nuclear option—embracing Position 3's pragmatism and asking: "What work does 'moral worth' do that praise/blame can't?"  

  Final thought: The hospital case is perfect because it lives at the intersection of all three frameworks. That's why it broke them.
answer: |-
  Your diagnosis—that "moral worth" is being stretched across three distinct conceptual jobs—is fundamentally correct, but the deadlock runs deeper. The positions aren't just prioritizing different *aspects* of moral worth; they're operating in entirely different frameworks of moral psychology. Here's why the argument doesn't move, what each side is committed to, and what real progress would look like.

  ---

  ### **The Core Problem: Three Incommensurable Frameworks**
  Your group isn’t having one debate—it’s having three parallel debates, each answering a different question. When proponents talk past each other, it’s not because they disagree about "moral worth" but because they reject the *premises* of the others’ frameworks:

  1. **The Deliberation Theorist**  
     - **Commitment:** Moral worth tracks *episodic moral psychology*—the conscious, reason-driven process in a specific action.  
     - **Question:** "What mental state *causally explains* this action?"  
     - **Blind spot:** Assumes agents are (or should be) "reasons-first" deliberators. Ignores that most actions aren’t preceded by explicit reasoning.  
     - **In your case:** Your counterfactual test appeals here—it isolates the operative reason. But this side sees "quality of will" as irrelevant because it doesn’t address *how* the action was chosen *in the moment*.

  2. **The Character Theorist**  
     - **Commitment:** Moral worth tracks *dispositional psychology*—stable traits (e.g., empathy, honesty) that reliably produce good actions.  
     - **Question:** "Does this action express a virtuous *character*?"  
     - **Blind spot:** Dismisses deliberation as philosophically naive ("fetishism") and psychologically unrealistic.  
     - **In your case:** They reject your counterfactual test because stripping away one motive ignores the *holism* of character. The officer’s budget-consciousness isn’t a contaminant—it’s part of her broader competence and reliability.

  3. **The Social-Pragmatist**  
     - **Commitment:** "Moral worth" is a confused proxy for *social practices* (praise/blame, incentives).  
     - **Question:** "What should we *do* about this agent/action?"  
     - **Blind spot:** Throws out normative psychology entirely. Can’t explain *why* we praise some motives over others.  
     - **In your case:** They’d say your test is irrelevant—what matters is whether flagging fraud *should* be encouraged, full stop.

  ---

  ### **Why Your Hypothesis Needs Sharpening**
  You’re right that "moral worth" serves three jobs—but the conflict isn’t just about emphasis. It’s about **competing meta-commitments**:
  - **The Deliberation Theorist** assumes morality is fundamentally about *reasons-responsive agency*.  
  - **The Character Theorist** assumes morality is about *being a good person*.  
  - **The Pragmatist** assumes morality is about *regulating behavior in a community*.  

  These are not reconcilable without abandoning core premises. Your conference dinner experiment proves this: people intuitively parse "credit," "reasons," and "good person" as distinct because they map onto these separate frameworks.

  ---

  ### **Why the Deadlock is Substantive (Not Verbal or Empirical)**
  - **Not verbal:** Everyone agrees on the *definition* of "moral worth" (e.g., "praiseworthiness of the agent’s motivation"). The fight is about what *constitutes* praiseworthiness.  
  - **Not empirical:** Situationist data (e.g., "nobody deliberates like Kantians") won’t resolve this. The Character Theorist embraces this—virtues *don’t* require deliberation. The Pragmatist says empirical habits dictate praise practices.  
  - **Not ill-posed:** Each question is coherent in isolation. The problem is forcing them into a single concept.  

  The conflict is **foundational**: what is the *primary locus* of moral evaluation? Actions, agents, or social consequences?

  ---

  ### **Pathways to Progress**
  1. **Reframe the Question (The Meta-Move):**  
     Stop asking "What is moral worth?" Ask instead:  
     - *"Why do we care about motivation at all?"*  
       (e.g., To hold people accountable? To cultivate virtue? To ensure replicable good actions?)  
     - *"What moral work should 'moral worth' do for us?"*  
       (e.g., Justify blame? Guide moral education? Predict future behavior?)  

  2. **The Distinction That Unlocks Clarity:**  
     Introduce **Regress of Motives**:  
     - *First-order motive:* Helping because you care.  
     - *Second-order motive:* Helping because it’s right.  
     The Character Theorist sees first-order motives as sufficient (even superior); the Deliberation Theorist demands second-order awareness. Your hospital case fails to force a choice—both motives are first-order. Progress requires a case where motives *conflict hierarchically*:  
     > *A racist nurse competently treats a minority patient. She acts from professional pride (first-order) but would refuse if she thought it was "morally required" (second-order aversion).*  
     Does she have moral worth? Here, the Deliberation Theorist must deny worth; the Character Theorist might still affirm it (if pride reliably produces good care); the Pragmatist focuses on whether to praise the action to reinforce professionalism.

  3. **An Honest Conclusion:**  
     Admit that **no unified account of moral worth is possible**—the concept is a mosaic of psychological, normative, and social concerns. The only "progress" is deciding which question matters most *for your group’s purpose*. Example:  
     - If studying moral development, prioritize character.  
     - If designing institutions, prioritize pragmatism.  
     - If analyzing responsibility, prioritize deliberation.  

  ---

  ### **What Won’t Work (But You’ll Keep Trying)**
  - More vignettes (they’ll be interpreted through each framework).  
  - Historical exegesis (Kantians vs. Humeans talked past each other too).  
  - Conceptual analysis (you’ve hit bedrock).  

  **Real progress here looks like this:** The faculty member is hinting that you’re "asking different questions" because *they are different questions*. Until you choose one—or agree that moral psychology is irreducibly plural—you’ll spin in circles. The way out isn’t a verdict but a taxonomy: "Here are three things we might mean by 'moral worth,' and here’s why they diverge." That’s not surrender—it’s clarity.
