  I do a science-and-ideas beat and I'm working on a piece about the 1914 Christmas Truce and the live-and-let-live system that developed in the trenches afterwards. I already know the Axelrod tournament story and tit-for-tat gets wheeled out every December, so skip it. Analyse the episode through the prisoner's dilemma instead, one-shot and iterated, and be disciplined about the mapping: who the players actually were (individual soldiers, companies, or armies), what cooperation and defection looked like on the ground, and what the payoffs were. Three things I want faced honestly. The shadow of the future was short and known to be short — rotations, planned offensives, peace eventually — which by the textbook should kill cooperation before it starts. Noise: an accidental shell or a jumpy sniper is indistinguishable from defection, and reciprocal strategies spiral on exactly that. And two friends of mine who disagree: one says this is really a stag hunt and not a PD at all, since nobody gained much by shooting a man who was burying his dead, the other says the real units weren't individuals but companies with their own internal enforcement, so the reciprocity story is at the wrong level. Give me exactly five numbered points, a couple of sentences each, no intro and no sign-off: your tightest mapping, where the short horizon and the noise problem break it, which friend is nearer right and why, what the truce explains that the model can't reach (carols, joint burials, the crackdown from above once the generals found out), and wether the episode confirms the evolution-of-cooperation story, is an anomaly for it, or is a case it was never built to handle.
