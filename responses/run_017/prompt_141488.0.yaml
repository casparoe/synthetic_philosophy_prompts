  I need to reconstruct the implicit epistemological assumptions behind these practices. The key tension lies between debate formats (which assume false claims have cheap refutations) and single-sample grading (which requires judge reliability). The user's observations about certificate usage and inconsistent practices are crucial - they suggest labs might be relying on verifiability while claiming dialectical solutions work universally.

