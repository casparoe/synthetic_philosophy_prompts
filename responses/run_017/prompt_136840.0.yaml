prompt: |-
  my mate has been saying for about three years that he wants out — leave the job, leave the city, start again. He goes on about it constantly and in really specific detail, and he's obviously not having a good time. But he doesn't go. Last year a role came up that was more or less exactly the thing he describes wanting, on better money, and he didn't apply; he said the timing was wrong. Mostly he doesn't even say no, he just lets the deadline go past.

  I'm the one he phones at midnight, and I've started to find it wearing. Our other friend has gone further and basically told him: nobody should take your words seriously when your behaviour says the opposite, wanting something is just whatever you actually end up doing, everything else is cheap talk you produce for free. Part of me thinks that's brutal and wrong. Part of me thinks he's right and that I've been enabling something by listening.

  What I can't get straight is this: it's never been a clean choice in front of him. Every version of leaving that's actually come up has been bundled with something — a pay cut, his kid's school, his mum who's not well and who he'd be three hours from. So "he chose to stay" seems to be carrying a lot of weight in that argument, when the situation never really offered him staying versus going on its own. And a third person suggested a test: put a small, reversible version in front of him — a month's leave, a trial somewhere — and if he won't even take that, then it's talk. I half like that, but I also don't see why turning down a small version tells you the same thing as turning down the real one.

  And underneath it I'm stuck on a weirder question: if I do take what he says at face value, what am I taking seriously? Is there some fact about what he wants sitting inside him that his behaviour is just a bad guide to, or is there nothing there beyond the pattern of what he does?

  So, two things I actually need. One: is the behaviour-is-the-only-real-evidence line right here, and if it's missing something, what? Two: what should I concretely do — keep taking the calls, push him toward the trial-run thing, or tell him I'm done talking about it until he moves? Also, please write in British English, the American spellings grate on me.
reasoning: |-
  Alright, let me unpack this user's situation. Their mate has been talking about leaving his job and city for three years in vivid detail but never acts on it. The user is frustrated, especially after their friend called out the mate's inaction as "cheap talk." The user feels caught between enabling and abandoning their friend.

  First, I need to assess the core conflict. The mate's words and actions don't align, causing emotional drain. The user questions whether intentions or behaviors hold more weight. They also mention that real opportunities always come with trade-offs (pay cuts, family obligations), making "choosing to stay" an oversimplification.

  The user's explicit questions are: 1) Is behavior the only real evidence of intent? 2) What concrete steps should they take? But reading deeper, they might be seeking validation for their frustration and guidance on setting boundaries without guilt. The midnight calls indicate the user's role as an emotional crutch, which is unsustainable.

  Looking at the psychological aspect, the mate might be using venting as a coping mechanism, trapping himself in inaction. The "trial run" idea is smart but doesn't account for how small steps might not reflect readiness for big changes. Family responsibilities complicate things—each opportunity isn't just "leave/stay" but a web of sacrifices.

  The user's philosophical question about "what wants really are" is profound. Philosophers like Wittgenstein would argue language and action are intertwined; without action, declarations are empty. But existentialists might say fear obscures true desires. Both views matter here: the mate's desires might be genuine but buried under anxiety.

  For concrete advice, boundaries are crucial. The user needs to preserve their well-being. Suggesting a trial run is practical, but must be presented without pressure. Reframing conversations to focus on problem-solving could shift dynamics. Also, recommending professional help is key—this seems beyond friendship resolution.

  Ultimately, the user needs permission to step back without feeling cruel. Emphasizing that support isn't synonymous with endless venting might relieve their guilt. Highlighting the mate's agency reinforces that change must come from him, not the user's nudges.
answer: |-
  Right, this is a proper sticky situation, and your frustration comes through loud and clear. Your mate's stuck in a loop, and it's dragging you down with him. Let's break this down, using the Queen's English as requested.

  **1. Is "Behaviour-Is-The-Only-Real-Evidence" Completely Right? (Spoiler: Mostly, but with nuance)**

  Your other friend has a brutal point, but it's slightly oversimplified. Here’s the breakdown:

  *   **The Core Truth:** Actions *are* the ultimate evidence of priorities and commitment. Consistently *not* acting on stated desires, especially when opportunities arise (like the perfect job), speaks volumes. Talking costs nothing; doing requires effort, risk, and overcoming inertia/fear. His inaction demonstrates that, *at this moment and for the past three years*, the perceived costs/risks/fears of leaving outweigh his stated desire to go, *or* that the desire isn't as strong as his words suggest. The "letting deadlines pass" is particularly telling – it's passive avoidance, not an active choice weighed up.
  *   **The Nuance You Rightly Point Out:**
      *   **Bundled Choices:** You're spot on. Life rarely offers clean "stay vs. perfect go" options. Every real opportunity *will* have trade-offs (pay, family, schools). Saying "he chose to stay" *does* carry weight because it means he actively (or passively) *preferred* the status quo, with all its miseries, *over* the specific alternative presented *with its specific downsides*. He didn't choose "staying" in a vacuum; he chose it *over that particular version of leaving*. The perfect, cost-free escape doesn't exist.
      *   **Internal Conflict & Fear:** His words likely reflect a *genuine* dissatisfaction and a *fantasy* of escape that feels good to articulate. The desire for change might be real *in the abstract*, but the concrete steps to achieve it trigger paralysing fear (of failure, of the unknown, of letting people down), ambivalence (loves the fantasy, hates the practical upheaval), or hidden commitments (e.g., a subconscious sense of duty trapping him). His behaviour isn't necessarily a *lie* about his unhappiness; it's evidence of being utterly stuck between that unhappiness and his fears/obligations.
      *   **"Wanting" vs. "Willing":** He may very much *want* the outcome (a fresh start) but be completely *unwilling* or *unable* to pay the price required (effort, risk, discomfort, confronting family, potential short-term loss). His behaviour shows his current level of willingness.

  **The Verdict:** His behaviour *is* the primary evidence of what he is **actually willing and able to do right now**. It trumps his words in terms of predicting his actions. However, it doesn't necessarily mean his *dissatisfaction* or his *abstract desire for change* aren't real. The problem is that the abstract desire, without action, is functionally meaningless and emotionally draining for everyone around him.

  **2. Underneath: What Are You Taking Seriously?**

  This is the philosophical crux. When you take his words at face value, you are taking seriously:

  *   **His Experience of Suffering:** His unhappiness in his current situation is likely very real.
  *   **His Fantasy/Ideal:** He has a vivid picture of what he thinks would alleviate that suffering.
  *   **His Need to Vent/Be Heard:** The midnight calls are a pressure valve for his frustration.

  What you *cannot* take seriously, based on years of evidence, is:

  *   **His Claim of Imminent Action:** His words about *actually leaving* lack credibility because they are never backed by deeds.
  *   **The Idea that External Factors *Alone* Prevent Him:** While the trade-offs are real, they are the *constant context*. His *consistent* inaction, even when opportunities align reasonably well with his fantasy, points to *internal* barriers (fear, indecision, lack of true commitment) being the primary blockers. If the desire were overwhelming, he'd be actively problem-solving *around* the trade-offs, not using them as perpetual reasons for inaction.

  **There isn't a "fact about what he wants" separate from his behaviour.** His desires are complex and contradictory: he wants change *and* he wants safety/avoidance of risk. His behaviour reveals which desire is currently winning the internal tug-of-war (safety/avoidance). The "pattern of what he does" *is* the clearest expression of his prioritised wants *in practice*.

  **3. What Should You Concretely Do?**

  Your well-being matters. Being a perpetual midnight sounding board for unactionable misery is unsustainable. Here’s a practical plan, moving from supportive to firmer boundaries:

  1.  **The Next Call (Reframe & Test):** Next time he launches into the "I must leave" monologue, interrupt gently but firmly. *"Mate, I hear how miserable you are and how much you want out. We've talked this into the ground for three years. Talking isn't making you feel better or getting you out. What's one *small*, *concrete* thing you could do *this week* to move an inch closer to figuring this out, even if it's just researching something?"*
      *   **Why it's better than just a trial-run suggestion:** It immediately shifts focus from venting to micro-action. It tests his willingness to engage *at all* beyond words. If he dismisses it or can't think of *anything*, it reveals his resistance starkly.
      *   **The Trial Run Idea:** You can *then* introduce this. *"Look, you keep saying the real chances are too messy with pay/kids/your mum. What about testing the water without burning bridges? A month's unpaid leave/sabbatical to volunteer somewhere completely different? A short-term contract in another city? Even just a proper fortnight's holiday *alone* to clear your head? If you won't even try a small, reversible step, it's hard to believe the big move is a real priority right now, however much you talk about it."*
      *   **Turning Down the Small Version:** It *does* tell you something crucial: it tells you his aversion to *any* change, or his fear of even dipping a toe in the water, is stronger than his stated desire to escape. It reveals the *depth* of the inertia/fear. If he won't take a month's leave, he absolutely won't quit his job and move cities.

  2.  **Set Clear Boundaries on the Venting:**
      *   **Topic Boundary:** *"Mate, I care about you, but I can't keep having the same circular conversation about leaving. It's draining and it doesn't help you. I'm happy to talk about *actual* plans or steps you're taking, or other stuff going on in your life, but I need a break from the 'I must leave' talk unless it comes with action."*
      *   **Time Boundary:** *"And these midnight calls when you're in the depths of it... I can't do them regularly. I need my sleep. If it's a genuine crisis, call, but if it's the usual loop about leaving, text me in the morning and we can grab a coffee at the weekend if you've got something new to discuss."*
      *   **Enforce It:** If he calls at midnight to rant, say *"This sounds like the leaving talk. I can't do this now. Text me tomorrow."* and end the call. If he starts the rant in person, remind him: *"Remember what we said? Happy to talk about something else or actual plans."* If he persists, end the conversation: *"I'm going to head off/let you go mate, speak soon."*

  3.  **Acknowledge the Stuckness & Suggest Professional Help:** In a calm moment, you could say: *"Look, it's obvious you're deeply unhappy but also completely stuck. This isn't just about jobs or cities; it feels bigger. Have you ever thought about talking this through properly with someone? A therapist or counsellor could help you untangle why you feel trapped and figure out what you *really* want and how to get there, in a way our chats just can't. It might be more useful than calling me at midnight."* Frame it as support, not criticism.

  4.  **"I'm Done Talking Until You Move":** This is the nuclear option if boundaries are repeatedly ignored and your well-being is suffering. *"Mate, I love you, but I'm completely burnt out on this. I've said my piece, suggested ways forward, and set boundaries you keep crossing. I can't listen to you talk about leaving any more until you actually *do* something – anything – to change your situation. I'm here for you as a friend in other ways, but this topic is off the table."* Be prepared for backlash, but stick to it.

  **In summary:**

  *   **Yes, behaviour is the best evidence of willingness/ability to act.** His inaction speaks louder than his words about *doing*.
  *   **But:** His *unhappiness* is likely real, even if his promises of action aren't credible.
  *   **Do:**
      *   **Reframe conversations:** Demand small, concrete actions or shift the topic.
      *   **Suggest a trial run:** It *is* a valid test of willingness to embrace *any* change.
      *   **Set FIRM boundaries:** On topic (no more circular venting) and time (no more midnight misery-dumps).
      *   **Suggest professional help:** Gently, framing it as support for his obvious stuckness.
      *   **Protect your own well-being:** This is essential. You're not his therapist.
  *   **Don't:**
      *   Keep being the unlimited venting outlet (it *is* enabling the cycle).
      *   Feel guilty for setting boundaries.
      *   Invest emotional energy in his "escape plans" until he shows concrete initiative.

  This isn't about abandoning him; it's about refusing to enable his stagnant misery and protecting your own mental space. Real support sometimes means stopping the unproductive cycle, even if it feels harsh initially. Good luck – it sounds exhausting, and you've been a patient friend. Now it's time for that patience to wear some armour.
