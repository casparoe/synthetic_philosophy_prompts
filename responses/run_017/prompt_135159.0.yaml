prompt: |-
  I'm a senior in a philosophy of psychiatry seminar, and our current unit is psychiatric classification and Ian Hacking's looping effects — the way a classification of people can feed back on the people classified and change them, which then forces the classification itself to be revised. For the final paper we were handed an invented case (I'll reproduce it below; please treat every fact in it as stipulated and don't try to check it against anything real). In the discussion section last week my professor reached for a line I have now heard three times this term: "diagnoses aren't discovered, they're made." It seemed to be doing three different jobs, and I suspect it can only do them by sliding between readings. I want the readings separated before I commit to a thesis.

  The three jobs it was made to do:

  1. To close down a classmate's question "but is PMDS a real disorder or not?" — the answer was that the question is not well formed.
  2. To conclude that the criteria are therefore a policy choice, to be settled on cost-benefit grounds by asking what the category does for patients, clinicians, insurers, and researchers.
  3. To conclude that no psychiatric category could be a natural kind, so the search for validators is misguided from the start.

  The seminar case, abbreviated. A working group is deciding whether to keep, split, or drop a proposed category, "prolonged motivational depletion syndrome" (PMDS).

  - 2017–18: two neurology clinics publish a case series of about forty patients, mostly with a shared lesion pattern, who report intact wanting together with an inability to initiate action. There is no psychiatric label for this; the clinicians call it "the starting problem."
  - 2023: PMDS is proposed: six months or more of reported failure to initiate volitional action with preserved hedonic response, plus two of five functional items, not better explained by a depressive episode.
  - 2026: a bestselling memoir by someone from the original cohort.
  - 2027–30: a large online community forms; members call themselves "PMDSers"; short videos circulate that teach the criteria as a self-check; referrals rise from dozens to tens of thousands; new patients describe their experience in the criteria's own vocabulary and report the symptoms in item order.
  - 2031: field trials show the original functional items no longer discriminate — near-ceiling endorsement in both self-referred and comparison groups. The group narrows the criteria and adds a clinician-rated initiation-latency measure.
  - Validators drift: family aggregation is 3.1 in the 2018 cohort and 1.2 in the 2029 cohort; a dopaminergic agent has a large effect in the 2018 cohort and a small one in 2029; an imaging correlate found in 2018 fails to replicate in 2029.
  - Course: in the 2018 cohort it tracks the lesion; in the 2029 cohort symptoms frequently remit when people leave the online community.
  - Institutions: a vocational-rehabilitation benefit now requires a PMDS code for eligibility. One patient organization lobbies to keep the category; a rival group of former patients campaigns against it, saying the label taught them to read ordinary fatigue as illness.
  - The live dispute: some clinicians say the 2029 presentations are a different condition entirely; others say it is the same condition with a widened phenotype.

  What I'd like from you:

  1. A menu of seven to nine distinct precise readings of the slogan, ordered from the most platitudinous to the most radical. For each: what it asserts exactly; a verdict (trivial platitude / substantive and defensible / substantive but doubtful / false / self-undermining); and which of the three jobs it actually supports, if any. One clause naming the position each reading corresponds to is welcome, but the readings should be distinguished by content, not by labels.
  2. Make sure the menu separates readings along these axes, since I think the ambiguity lives there: whether what is "made" is the term, the criteria, or the people and the kind; whether "made" means causally produced by the practice of classifying or conventionally selected from phenomena that were already there; whether the claim is constitutive (these instances could not have existed without the label) or merely causal and historical; and whether it is global (all clinical kinds) or local (only some, and if so which).
  3. Say for each reading how it bears on Hacking-style looping and on his contrast between kinds that are indifferent to our classifications and kinds that are not: does looping entail the reading, is it merely compatible with it, or does it tell against it? I specifically want to know whether a looping effect, on its own, supports any antirealist conclusion at all, and why or why not.
  4. Run each reading against the case at two time slices, the 2018 clinic cohort and the 2029 self-referred cohort, and say whether PMDS comes out discovered, made, both, or neither at each. Flag explicitly the readings whose verdict changes between the slices — my guess is that the interesting ones are time-indexed, and I want that made visible rather than averaged away.
  5. Assess three inferences I keep hearing in seminar. (a) The criteria were written by a committee, so the kind is a committee artifact. (b) The label changes the people who have it, so the kind is not real at any given time, cannot be a natural kind, and cannot support stable science. (c) These individuals would not have had this experience without the label, so the category cannot be explanatory. For each: valid under which reading or readings, and what goes wrong where it is not.
  6. Tell me whether any single reading supports all three of the professor's uses. If none does, say which use has to be given up, and say plainly whether the slogan's rhetorical work depends on moving from a platitudinous reading to a radical one without marking the move. If a reading is self-undermining, show the mechanism; my own suspicion is that the reading which best supports job (2) is the least stable, because looping also degrades the evidence you would use to estimate the benefits — the treatment effect shrinks and the validators drift, so there may be nothing fixed for the pragmatist to optimize against. Check that argument rather than agreeing with it.
  7. Finally: which reading is the professor most likely to have meant, given that they used the line for all three purposes?

  Format and constraints. Please write in American English, about 1,000 to 1,300 words. Give the menu as a numbered list with a consistent verdict label on each entry, then a compact table with one row per reading and columns for verdict, supports job (1)/(2)/(3), relation to looping, verdict on the 2018 cohort, and verdict on the 2029 cohort. Define any technical term you use. Assume I know the basics of how diagnostic manuals work and what a looping effect is, and nothing beyond the seminar. I'm writing this from off campus with no database access, so please don't send me to the literature or tell me what to read — I need the distinctions worked out and the verdicts argued for, not a bibliography. And please don't leave me with "it depends what you mean by 'real'": that much I already have, and producing the disambiguation with verdicts is the whole point of what I'm asking for.
reasoning: |-
  Okay, let me tackle this philosophy student's complex request about psychiatric classification and Ian Hacking's looping effects. The user needs precise disambiguation of the professor's slogan "diagnoses aren't discovered, they're made" across seven distinct readings, analyzing how each interpretation holds up against the fictional PMDS case study.

  First, I recognize this is a sophisticated query from a senior seminar student who's clearly done their homework. They've identified three distinct rhetorical functions the slogan serves in class discussions and want to expose potential equivocation. The PMDS case provides perfect material to test different interpretations against temporal evolution of a diagnostic category.

  Hmm, the core challenge lies in mapping the ambiguity along multiple axes: what's being "made" (term/criteria/people), the nature of "making" (causal/conventional), and the scope (constitutive/causal, global/local). I'll need to construct readings that systematically vary these parameters while tracking their implications for realism, natural kinds, and policy.

  For the menu, I consider starting with the least controversial interpretations and escalating to radical constructivist views. Reading 1 could be about diagnostic labels being conventional artifacts - this seems uncontroversial but doesn't support antirealist conclusions. Readings 2-3 might address criteria development as pragmatic decisions, which could justify policy approaches but still allow for underlying real patterns. 

  The more radical readings (4-7) would explore how classifications might actively shape the phenomena. Here I need to carefully distinguish between causal looping effects (which are empirically observable) and constitutive claims (which make stronger metaphysical assertions). The fictional PMDS case brilliantly illustrates this - the 2018 lesion-based cases seem discovered, while the 2029 social-media-influenced presentations appear made.

  When analyzing the three problematic inferences, I notice particular trouble with (b) - that label-induced changes automatically undermine reality. This ignores that many natural kinds evolve through interaction (like biological species in changing environments). The shrinking treatment effect in PMDS actually demonstrates real interaction effects rather than unreality.

  For the professor's likely intended meaning, the temporal aspect seems crucial. They're probably sliding between moderate constructivism about criteria (for policy) to stronger claims about kinds when discussing natural kinds. But the case study shows that only some readings survive contact with both time slices - the 2018 cohort resists radical "made" claims.

  The pragmatic policy angle (job 2) does face the student's suspected problem: if validators drift, benefits become moving targets. I'll need to show how this makes optimization unstable without necessarily invalidating pragmatism altogether. Maybe distinguish between transient symptom clusters and stable neurocognitive mechanisms as potential referents.

  Throughout, I should maintain strict discipline: no appeals to external literature, no "it depends on real" cop-outs. Each reading must earn its verdicts through direct application to the PMDS timeline. The table format will help expose where verdicts flip between cohorts - likely around readings 5-7 where social construction is strongest.

  Most importantly, I must resist concluding with bland relativism. The exercise should empower the student to argue precisely why certain uses of the slogan overreach given the case details, while others remain defensible. The goal isn't to debunk the professor but to equip the student with finer analytical tools.
answer: |-
  Below is a systematic disambiguation of "diagnoses aren't discovered, they're made" across eight distinct readings, analyzed against your criteria. Verdicts apply to psychiatric classifications generally unless specified. The PMDS case is used to test temporal stability.

  ---

  ### **Menu of Readings**  
  *(Ordered from least to most radical)*  

  1. **Reading: Diagnostic terms are human conventions**  
     - *Assertion*: The *word* "PMDS" (and its criteria descriptions) is a linguistic artifact, not a preexisting natural term.  
     - *Verdict*: **Trivial platitude** (all scientific terms are human-made).  
     - *Supports job*: Weakly (1) — shifts focus from "real disorder?" to "useful construct?"  
     - *Relation to looping*: Compatible but irrelevant; looping concerns phenomena, not words.  
     - *PMDS 2018*: Term made, phenomena discovered.  
     - *PMDS 2029*: Term made, phenomena altered.  
     - *Changes?* No — term is always made.  

  2. **Reading: Diagnostic criteria are pragmatic selections**  
     - *Assertion*: Criteria (e.g., "6 months + 2/5 items") reflect practical trade-offs (reliability vs. inclusivity), not discovery of natural boundaries.  
     - *Verdict*: **Substantive and defensible** (boundaries in psychiatry are often arbitrary-seeming).  
     - *Supports job*: (2) — criteria are policy choices.  
     - *Relation to looping*: Compatible; criteria changes (e.g., 2031 revisions) respond to looping.  
     - *PMDS 2018*: Criteria made, but tracked a lesion-based cluster.  
     - *PMDS 2029*: Criteria made, now tracking a socially shaped cluster.  
     - *Changes?* Yes — validity of original criteria degrades.  

  3. **Reading: Classifications causally alter illness presentations**  
     - *Assertion*: Applying a label *changes* how symptoms are experienced/reported (e.g., patients adopting criteria's vocabulary).  
     - *Verdict*: **Substantive and defensible** (empirically observed in PMDS: symptom reporting homogenizes by 2029).  
     - *Supports job*: (1) — "real?" ignores dynamic feedback.  
     - *Relation to looping*: **Entails looping** (Hacking’s core claim).  
     - *PMDS 2018*: Minimal alteration (no label existed).  
     - *PMDS 2029*: Significant alteration (self-reports mirror criteria).  
     - *Changes?* Yes — looping intensity increases.  

  4. **Reading: Instances depend on the classification for their existence**  
     - *Assertion*: Some cases (e.g., 2029 cohort) *would not exist* without the label (e.g., remission when leaving online community).  
     - *Verdict*: **Substantive and defensible for some cases** (true for socially contingent presentations).  
     - *Supports job*: (1) — questions "real disorder?" by showing causal dependence.  
     - *Relation to looping*: **Exemplifies looping** (label creates new behaviors).  
     - *PMDS 2018*: Not made (lesion existed prior).  
     - *PMDS 2029*: Made (illness experience constituted by community/label).  
     - *Changes?* Yes — from discovered to made.  

  5. **Reading: All psychiatric kinds are constituted by practices**  
     - *Assertion*: Psychiatric categories *ontologically depend* on diagnostic practices; no "mind-independent" psychiatric kind exists.  
     - *Verdict*: **Substantive but doubtful** (overgeneralizes from looping; 2018 lesion resists this).  
     - *Supports job*: (3) — denies natural kinds.  
     - *Relation to looping*: Compatible but not entailed (looping doesn’t require global constitutivity).  
     - *PMDS 2018*: Falsified (lesion preexists label).  
     - *PMDS 2029*: Plausible (experience is practice-dependent).  
     - *Changes?* Yes — fails for 2018.  

  6. **Reading: Validators are corrupted by looping, preventing natural kinds**  
     - *Assertion*: Looping (e.g., symptom drift) destabilizes validators (e.g., family aggregation, treatment response), making natural kinds impossible.  
     - *Verdict*: **Substantive and defensible locally** (PMDS validators drift; stable kinds require indifference to classification).  
     - *Supports job*: (3) — undermines validator search.  
     - *Relation to looping*: **Shows limitation of natural kinds** under looping.  
     - *PMDS 2018*: Validators stable (3.1 familial aggregation).  
     - *PMDS 2029*: Validators unstable (1.2 aggregation).  
     - *Changes?* Yes — from potentially natural to unstable.  

  7. **Reading: Psychiatric categories are institutional fictions**  
     - *Assertion*: Categories like PMDS *only* exist as tools for institutions (clinics, insurers) with no underlying reality.  
     - *Verdict*: **False** (ignores 2018 lesion; overstates institutional power).  
     - *Supports job*: (2) — reduces to policy.  
     - *Relation to looping*: Incompatible (looping requires real effects on real people).  
     - *PMDS 2018*: False (lesion objective).  
     - *PMDS 2029*: Still false (altered experiences are real).  
     - *Changes?* No — always false.  

  8. **Reading: Clinical phenomena are retroactively created by classification**  
     - *Assertion*: The act of classification *brings into being* the phenomena it describes (e.g., PMDS didn’t exist until defined).  
     - *Verdict*: **Self-undermining** (if no pre-label phenomena, what prompted the 2017 classification effort?).  
     - *Supports job*: (3) — denies discovery.  
     - *Relation to looping*: Contradicts looping (looping requires prior phenomena to loop through).  
     - *PMDS 2018*: Incoherent (clinicians responded to observed lesions).  
     - *PMDS 2029*: Incoherent (label altered existing behaviors).  
     - *Changes?* No — always incoherent.  

  ---

  ### **Summary Table**  
  | Reading | Verdict                  | Supports (1) | Supports (2) | Supports (3) | Relation to Looping            | PMDS 2018      | PMDS 2029      |  
  |---------|--------------------------|--------------|--------------|--------------|--------------------------------|----------------|----------------|  
  | 1       | Trivial platitude        | Weakly       | No           | No           | Compatible                     | Term made      | Term made      |  
  | 2       | Substantive/defensible   | No           | **Yes**      | No           | Compatible                     | Criteria made  | Criteria made  |  
  | 3       | Substantive/defensible   | **Yes**      | No           | No           | **Entails**                    | Minimal change | Major change   |  
  | 4       | Substantive/defensible   | **Yes**      | No           | Weakly       | **Exemplifies**                | Discovered     | **Made**       |  
  | 5       | Substantive/doubtful     | Weakly       | No           | **Yes**      | Compatible                     | Discovered     | **Made**       |  
  | 6       | Substantive/defensible   | No           | No           | **Yes**      | **Limits natural kinds**       | Natural?       | Unstable       |  
  | 7       | False                    | No           | Weakly       | Weakly       | Incompatible                   | Discovered     | Altered        |  
  | 8       | Self-undermining         | No           | No           | Weakly       | Contradicts                    | Incoherent     | Incoherent     |  

  ---

  ### **Assessment of Inferences**  
  **(a) "Committee-made criteria → kind is artifact"**  
  - *Valid under*: Reading 5 (constitutive dependence), Reading 7 (institutional fiction).  
  - *Fails under*: Readings 1–4,6 (criteria can track/cluster preexisting phenomena or manage looping without constituting the kind).  
  - *Problem*: Conflates *description* with *referent*; committees make criteria, not necessarily the phenomena.  

  **(b) "Label changes people → kind not real / not natural"**  
  - *Valid under*: Reading 5 (global constitutivity), Reading 6 (validator instability).  
  - *Fails under*: Readings 3–4 (looping alters presentations but not necessarily reality; e.g., 2018 lesion remains real).  
  - *Problem*: Assumes natural kinds must be static; but interactive kinds (Hacking) are real yet responsive to classification.  

  **(c) "No label → no experience → category nonexplanatory"**  
  - *Valid under*: Reading 4 (for 2029 cohort only), Reading 5 (global).  
  - *Fails under*: Readings 1–3,6 (label can *modify* experience without being its sole cause; e.g., lesion in 2018 explains initial cases).  
  - *Problem*: Ignores pre-label causal chains; PMDS 2018 was explanatory for the lesion cohort.  

  ---

  ### **Professor’s Slogan: Consistency Check**  
  - **No single reading supports all three jobs**. Reading 6 (validator corruption) supports (3) and weakly (1), but not (2). Reading 2 supports (2) but not (1)/(3).  
  - **Job (2) must be given up** for radical readings: Readings 5–8 undermine cost-benefit analysis by making benefits ephemeral (as you suspected). If the kind is unstable (Reading 6), policy optimizes a moving target; if constituted by practices (5), "benefits" lack fixed reference.  
  - **Rhetorical mechanism**: The slogan slides from platitude (Reading 1, "terms are conventions") to radical (Reading 5, "kinds are constituted") without distinction. This equivocation supports (1) via moderate readings (3–4) and (3) via radical readings (5–6), while (2) borrows plausibility from the trivial.  
  - **Self-undermining of pragmatism (Job 2)**: Your suspicion holds. Reading 6 shows benefits degrade as validators drift (treatment efficacy drops), making optimization intractable. Only Reading 2 (pragmatic criteria selection) avoids this, but it doesn’t support antirealism (Jobs 1/3).  

  ---

  ### **Likely Professor’s Meaning**  
  Given usage across all three jobs, the professor **equivocates between Readings 3, 4, and 6**:  
  - **Reading 3** (label alters presentations) closes Job 1 ("real?" is naive).  
  - **Reading 4** (some cases depend on label) + **Reading 6** (validators unstable) support Job 3 (no natural kinds).  
  - **Reading 2** (criteria as policy) is cited for Job 2 but relies on ambiguity with more radical readings for rhetorical force.  

  The temporal shift in PMDS (2018 vs. 2029) explains why no single reading suffices: the professor treats the 2029 state (high looping) as revealing the "true" nature of psychiatric categories generally, ignoring the 2018 baseline where looping was minimal.
