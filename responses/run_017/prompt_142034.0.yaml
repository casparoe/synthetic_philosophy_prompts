prompt: |-
  I'm a fourth-year PhD student in the programming languages group — I work on dependent types, mostly Coq — and I've been landed with the 80 minute slot on constructive reasoning in our departments "logic bootcamp" for incoming PhDs, in two weeks. Most of the room will be CS students who've written some Coq or Agda but have never had a logic course beyond induction-on-the-derivation, and a couple of them are philosophy-adjacent and dont code, so I can't lean on Curry-Howard as the main vehicle even though it's the thing I'd reach for first. I also know for a fact that a fifth-year has already told them that intuitionistic logic is just classical logic without excluded middle, strictly weaker, nothing to see here, so they will turn up thinking the slot is a formality.

  Don't write the lecture for me. I want a plan for how to teach it.

  1. The order the pieces have to go in and what depends on what. My instinct is that the Brouwer-Heyting-Kolmogorov style reading of or and exists — a proof of A or B is a choice of a side plus a proof of that side, a proof of exists x. A is a witness plus a proof — has to come before anyone says the words "law of excluded middle", because otherwise "why can't I just split on whether P holds" doesn't sound like a question that needs an answer. But I'm not sure where the real numbers go: I want them to see that you can't in general decide whether two constructive reals are equal (or what the constructive substitute for comparing them even is), and I don't know whether that needs the BHK clauses first or whether it can be what motivates them. And where, if anywhere, does the split between Brouwer-style intuitionism — which adds principles like continuity and bar induction and outright refutes bits of classical maths — and Bishop-style constructive maths, which is deliberately a common subset with no extra axioms, belong? One of the philosophy people will have read something and will say "isn't this all just about meaning being use?", and I want to know if that's a derailment I should absorb into the sequence or head off in advance.

  2. The one example to carry the whole thing. I keep going back and forth between the root-two-to-the-root-two proof that there are irrationals a and b with a^b rational, and the intermediate value theorem — the bisection argument looks totally constructive right up to the point where you have to decide whether f at the midpoint is zero. I currently prefer IVT because it hands me the contrast between the exact statement and the approximate one (for every epsilon there's an x with |f(x)| < epsilon), which is provable, and because I've heard there's a computable function that crosses zero but has no computable zero, which would show the exact version really is unprovable rather than just unfound. Tell me which one to use, what the carrying example has to have and what it has to lack — I worry a careless choice makes constructive maths feel like classical maths with theorems deleted, i.e. a loss — and say explicitly why not the other one. If there's a better example I haven't thought of, name it and say why it's better.

  3. The misconceptions, in the order they'll form, and the point in the sequence where I should kill each one. The ones I'm expecting: "so intuitionists assert that excluded middle is false" — I want to head this off with the fact that not-not-(A or not-A) is itself constructively provable, so flatly denying A or not-A would be inconsistent, and I want to know whether that's the right tool and the right moment; "constructive maths is just whatever you can get without choice and excluded middle"; "you can always mechanically convert a classical proof into a constructive one" (I think this is only half true and only for certain shapes of statement, but I don't know what the honest two-sentence version is at this level); and "if it's neither proved nor refuted then it has no truth value, or it's a third truth value". Tell me what I'm missing, specifically for an audience that has written `destruct (classic P)` in Coq a hundred times without thinking about it.

  4. Where the disjunction and existence properties go. My plan is to use them as the payoff: a theory with the disjunction property can't prove every instance of A or not-A, because then it would have to settle every open problem it can state, and no consistent arithmetic strong enough to encode itself does that. That's the moment the CS people should sit up. Is that right as I've stated it, or does it need a guardrail? I realise there are intuitionistic theories that prove A or not-A for particular A, including for decidable A, so the failure has to attach to the universal claim and not to instances — tell me how to phrase it so I don't get caught out by the one smart question in the room.

  5. What to refuse to explain, out loud, and what to name-and-move-on: choice sequences, bar induction and the fan theorem, realizability, Kripke versus Beth semantics, the double-negation translation beyond one sentence, whatever Brouwer's continuity principle is actually doing. My guess is I should say the words so they know the words exist and then decline the details, but I want to know which one of these I'm likely to get a serious question on and should therefore have two honest sentences ready for.

  6. One thing for the last slide that tells me whether it landed rather than whether they were entertained. I was going to hand them a short classical proof containing exactly one non-constructive step and ask them to find it and say whether it can be repaired — but I dont have a good candidate: I want something short, whose suspicious step looks innocent, and where the answer to "can it be repaired?" is interestingly different from the near-identical variant next to it. Suggest the pair, or suggest a different check if a written one would just test pattern-matching.
reasoning: |-
  We are designing a lecture plan for an 80-minute slot on constructive reasoning for incoming PhD students with mixed backgrounds (CS with some Coq/Agda, and some philosophy). The goal is to challenge the misconception that intuitionistic logic is just "classical logic without excluded middle" and to show the positive aspects of constructive mathematics.

  The plan addresses:

  1. **Order of Topics**: Start with BHK interpretation to set the stage for why excluded middle is not taken for granted. Then move to examples (like real numbers) to show the limitations and alternatives. Only then discuss LEM and its status. Bishop vs Brouwer can be mentioned briefly as a spectrum but focus on Bishop for the common core.

  2. **Central Example**: Use the Intermediate Value Theorem (IVT). It is more central to analysis and clearly shows the distinction between constructive and classical reasoning. The exact IVT is not provable constructively, but an approximate version is. The example of a computable function with no computable zero can be mentioned. The irrational power example is nice but may be seen as a trick and doesn't generalize as well.

  3. **Misconceptions**: Address them as they naturally arise. Specifically:
     - "Intuitionists assert that excluded middle is false": Clarify that they don't assert the negation of LEM (which is inconsistent) but rather do not accept it as universally valid.
     - Other misconceptions: Constructive math is not just deleting LEM and choice; it's a positive program. The double-negation translation is a way to interpret classical proofs but not a general constructive proof. Truth is not a third value but about providing evidence.

  4. **Disjunction and Existence Properties**: Use these as the payoff to show the computational content: if the theory proves a disjunction, it must prove one of the disjuncts. This implies that if the theory were to prove LEM for all statements, it would decide every sentence, which is impossible for sufficiently strong consistent theories. Guard by noting that for decidable predicates it is provable.

  5. **What to Skip**: Mention but do not delve into: choice sequences, bar induction, fan theorem, realizability, and advanced semantics. Be prepared for a question on continuity principles: have a one-sentence explanation (e.g., "Brouwer's continuity principle states that all functions on reals are continuous, which is a strong axiom that refutes some classical theorems") and then move on.

  6. **Final Check**: Give a classical proof with a non-constructive step and ask them to find it and say if it can be repaired. Use a pair of examples: one where the step can be repaired (e.g., by using an approximate version) and one where it cannot (without additional assumptions). Example: 
     - Repairable: The approximate IVT (as above).
     - Unrepairable: A proof that uses LEM on an undecidable predicate and then uses the result in a way that the constructive content is lost (e.g., a proof that a particular number is either rational or irrational, and then uses that to define a function by cases arbitrarily).

  Detailed Plan:

  ### 0. Introduction (5 minutes)
  - Set the stage: constructive mathematics as an alternative foundation that requires evidence for mathematical assertions.
  - Mention that it is not just the deletion of excluded middle but a positive program with computational meaning.

  ### 1. BHK Interpretation (15 minutes)
  - Explain the meaning of logical connectives in terms of proofs and constructions:
    - A proof of `A ∧ B` is a pair of proofs (proof of A, proof of B).
    - A proof of `A ∨ B` is either a proof of A or a proof of B (with a tag).
    - A proof of `A → B` is a method that turns a proof of A into a proof of B.
    - A proof of `∃x, P(x)` is a pair (witness, proof of P(witness)).
    - A proof of `∀x, P(x)` is a method that for every x produces a proof of P(x).
  - Emphasize that the disjunction and existential require explicit choices. This is the core that will block LEM.

  ### 2. Example: Constructive Reals and IVT (20 minutes)
  - Introduce constructive real numbers as Cauchy sequences with a modulus of convergence (without equivalence classes to keep it simple). 
  - Point: Equality of reals is not decidable because you cannot in general decide if two Cauchy sequences converge to the same limit (without extra information).
  - Present the Intermediate Value Theorem: Let f be continuous on [a,b] with f(a)<0<f(b). Then there exists c in [a,b] such that f(c)=0.
  - Show the classical bisection method: repeatedly bisect and choose the subinterval where the sign change occurs. The non-constructive step: at each bisection, you must decide if f(mid)=0 or if not, then whether f(mid) is positive or negative. But if f(mid) is not exactly zero, then by continuity we can eventually find the sign? But note: without knowing a modulus of continuity, we might not know how close to get to the zero? Actually, the problem is that we cannot decide if f(mid) is exactly zero or not. This is the non-constructive part.
  - Constructive version: For every ε>0, there exists x in [a,b] with |f(x)|<ε. This is provable. 
  - Mention: There are computable functions that cross zero but have no computable zero (e.g., a function that oscillates and only crosses zero at a non-computable real). This shows the exact IVT is not provable constructively.

  ### 3. Law of Excluded Middle (10 minutes)
  - State LEM: For any proposition A, A ∨ ¬A.
  - Note: Constructively, we do not accept LEM as a universal principle. But we do not assert its negation either! In fact, ¬¬(A ∨ ¬A) is constructively provable. So we cannot refute LEM without being inconsistent.
  - Why not? Because the BHK interpretation tells us that to prove A ∨ ¬A we must either prove A or refute A (i.e., prove ¬A). But for an arbitrary A, we might not be able to do either.
  - Example: Let A be a currently open problem (e.g., Goldbach's conjecture). We don't have a proof or a refutation. So we cannot assert A ∨ ¬A now.

  ### 4. Disjunction and Existence Properties (10 minutes)
  - Payoff: Intuitionistic logic has the disjunction property: if ⊢ A ∨ B, then either ⊢ A or ⊢ B. Similarly, the existence property: if ⊢ ∃x P(x), then there is a term t such that ⊢ P(t).
  - Consequence: If we could prove LEM for every A, then for every statement A we would have either ⊢ A or ⊢ ¬A. But that would mean our theory is complete (decides every statement). However, by Gödel's incompleteness, no consistent recursively axiomatized extension of arithmetic can be complete. Therefore, we cannot prove LEM for every A in such a theory.
  - Guardrail: Note that for decidable predicates (e.g., equality of integers) we can prove LEM because we can algorithmically decide it. The failure is for arbitrary predicates.

  ### 5. Bishop vs Brouwer (5 minutes)
  - Briefly: Bishop-style constructive mathematics is the common core that avoids LEM and uses constructive interpretations but adds no extra principles. Brouwerian intuitionism adds principles like continuity and bar induction that are classically false. For most purposes (especially in CS) we focus on Bishop's approach.

  ### 6. Addressing Misconceptions (5 minutes, woven in but summarized here)
  - Constructive math is not just classical without LEM: it has a positive interpretation and sometimes requires different definitions (e.g., of real numbers, continuity).
  - It is not about truth values being three-valued: it is about the requirement of evidence. A statement is true if we have a proof, false if we can derive a contradiction, and otherwise we don't know.
  - The double-negation translation: Classical logic can be embedded into intuitionistic logic by double-negating. This is a way to understand classical proofs but does not make them constructive.

  ### 7. Final Activity (10 minutes)
  - Hand out a classical proof that uses LEM and ask them to identify the non-constructive step and then see if it can be repaired.
  - Example 1 (repairable): 
    Theorem: There are two irrational numbers a and b such that a^b is rational.
    Classical proof: Consider √2. If (√2)^√2 is rational, then we are done (a=√2, b=√2). Otherwise, let a=(√2)^√2 and b=√2. Then a^b = ((√2)^√2)^√2 = (√2)^(√2*√2) = (√2)^2 = 2, which is rational. But note: we never decided which case holds. 
    Non-constructive step: The use of LEM on the statement "(√2)^√2 is rational". 
    Repair: Actually, we can avoid LEM by using a different witness: use a=√2 and b=2*log2(3) (which is irrational) and then a^b = 3. But note: this requires knowing that log2(3) is irrational (which it is). So this is constructive. However, the original proof is non-constructive because it doesn't provide a witness. But we can provide an explicit witness. So in this case, the theorem is constructively provable by a different method.

  - Example 2 (unrepairable without extra assumptions): 
    Theorem: Every increasing bounded sequence of real numbers has a least upper bound.
    Classical proof: Define the least upper bound as the supremum (which is the limit of the sequence). But constructively, we cannot in general compute the supremum (if the sequence converges non-computably). Instead, we must use the Cauchy real numbers and require that the sequence is not just increasing and bounded but also has a modulus of convergence (i.e., is a Cauchy sequence). Without that, the supremum might not be constructively given.

  However, for the final activity, I suggest a different pair to avoid the confusion that the first example is repairable. Instead, use:

  - A classical proof of the exact IVT (with bisection) and ask to identify the non-constructive step (the decision at each midpoint about the sign, which requires knowing if f(mid)=0). Then ask if it can be repaired: yes, by proving the approximate version (which we did).

  But to show an unrepairable one, we might not have time. Alternatively, we can use:

  Theorem: For any real number x, either x=0 or x≠0.
  Classical proof: By LEM. 
  Non-constructive step: obvious.
  Can it be repaired? Not for arbitrary x, because we cannot decide equality for reals. But note: we can prove the negative: ¬¬(x=0 ∨ x≠0) and also that if x≠0 then |x|>0, but without a witness we cannot decide.

  But this might be too abstract.

  Alternatively, use a proof that uses LEM on an undecidable predicate:

  Theorem: Let P be a predicate on naturals. Then, for any natural number n, either P(n) or not P(n).
  Classical proof: LEM.
  Non-constructive step: if P is undecidable, we cannot provide an algorithm to decide for every n.
  Repair: Only if P is decidable.

  But this is trivial.

  I suggest instead for the final activity to use:

  Consider the following classical proof:

  Theorem: There exists an irrational number.
  Proof: We know that √2 is irrational. So take that.

  This is constructive. Now contrast with:

  Theorem: Either Euler's constant γ is rational or it is irrational.
  Proof: By LEM.

  The non-constructive step is LEM on a specific open problem (whether γ is rational). And we cannot repair this without settling the open problem. So the proof is non-constructive and cannot be made constructive without more information.

  This is a simple example that shows the non-constructive use of LEM and the fact that we cannot provide a constructive proof without solving the open problem.

  ### Timing Summary:
  - 0. Intro (5 min)
  - 1. BHK (15 min)
  - 2. Constructive reals and IVT (20 min)
  - 3. LEM (10 min)
  - 4. Disjunction/Existence properties (10 min)
  - 5. Bishop vs Brouwer (5 min)
  - 6. Misconceptions (addressed throughout, but recap 5 min)
  - 7. Final activity (10 min) and wrap-up.

  Total: 80 minutes.

  This plan should challenge the initial misconception and show constructive mathematics as a meaningful alternative with computational content.
answer: |-
  Here's a structured plan addressing your concerns, designed to challenge misconceptions while emphasizing the *positive* nature of constructive mathematics. The goal is to make CS students see computational content and philosophy students see meaning-as-use foundations, without requiring Curry-Howard.

  ---

  ### **1. Order of Concepts (30 min)**
  **Sequence & Rationale:**  
  - **Start with BHK immediately (10 min):**  
    - *Why first?* Preempts "why not just assume LEM?" by grounding logic in evidence. Define `∨`/`∃` as computational choices (proof = witness + verification). Contrast with classical `∨` (truth without location).  
    - *Philosophy hook:* "Meaning is use" (Wittgenstein) fits perfectly—connect to how BHK defines logical connectives via proof *actions*. Absorb this, don’t head it off.  

  - **Constructive reals *before* LEM (15 min):**  
    - *Why here?* Concrete motivation for BHK’s constraints. Define constructive reals (e.g., Cauchy sequences with modulus). Show:  
      - Equality is **undecidable**: No algorithm for `∀x y, x = y ∨ x ≠ y` (use `x = 0` vs. `y = ∑ 2^{-n}` where `n` ranges over Turing machine halting events).  
      - *Substitute:* Introduce **apartness** (`x # y = ∃n, |x - y| > 2^{-n}`) as a positive alternative.  
    - *Avoids loss:* Emphasize that reals aren’t "weaker"—they encode algorithms.  

  - **Then LEM (5 min):**  
    - Now "why not split on `P`?" arises naturally. Answer: BHK requires evidence we lack (e.g., for reals equality). Stress: Rejecting universal LEM ≠ asserting `¬∀P, P ∨ ¬P` (inconsistent!). Show `¬¬(P ∨ ¬P)` is provable.  

  - **Bishop vs. Brouwer (name only):**  
    - Mention post-lecture: Bishop = "common core" (no LEM, no extras), Brouwer = adds axioms (continuity, bar induction) refuting classical math. Say: "Today focuses on Bishop-style—shared computational foundation."  

  ---

  ### **2. Central Example: Intermediate Value Theorem (15 min)**  
  **Why IVT over root-two?**  
  - **IVT is better:**  
    - *Familiar:* Core analysis concept.  
    - *Pedagogical contrast:* Classical proof (bisection) *looks* constructive until the midpoint decision (`f(m) = 0?`). Highlight the exact point of failure.  
    - *Positive substitute:* Prove the **approximate IVT** (∀ε>0, ∃x, |f(x)| < ε) constructively. Emphasize this isn’t a "loss"—it’s the useful computational content (algorithms for ε-roots).  
    - *Killer fact:* Mention there exists a computable `f` crossing zero with no computable root (e.g., `f` oscillates near a Specker sequence). Shows unprovability, not just "not yet found."  

  - **Why not root-two?**  
    - Feels like a "trick." The constructive repair (explicit `a=√2, b=2log₂3`) is too easy—doesn’t showcase deep BHK constraints. IVT’s computational subtleties are richer.  

  ---

  ### **3. Misconceptions & When to Kill Them**  
  Address as they arise:  
  - **"Intuitionists deny LEM" (kill at LEM discussion):**  
    - *Tool:* Show `¬¬(A ∨ ¬A)` is provable → denying LEM is inconsistent. Stress: "We don’t assume it universally; we don’t deny it."  
  - **"Constructive = delete LEM/choice" (kill at BHK/reals):**  
    - *Counter:* BHK is a positive logic; reals require new definitions (apartness, locatedness). "It’s rebuilding math with computational meaning."  
  - **"Mechanical conversion of classical proofs" (kill during IVT):**  
    - *Honest answer:* "Only for `Π⁰₂`-statements (e.g., `∀n∃m, P(n,m)`) via double-negation translation. IVT’s exact form is `∃x, ...`—no general conversion."  
  - **"Third truth value" (kill at BHK):**  
    - *Tool:* "Truth isn’t ternary. BHK: A claim is true when proven; false when refuted; otherwise, not determined. No middle *value*, just absent evidence."  
  - **Missing for Coq users:** "`destruct (classic P)` is admissible but non-computational—it’s a ‘black box’ with no extraction."  

  ---

  ### **4. Disjunction/Existence Properties (10 min)**  
  **Place as payoff after LEM:**  
  - State properties: `⊢ A ∨ B` ⇒ `⊢ A` or `⊢ B`; `⊢ ∃x, P(x)` ⇒ `⊢ P(t)` for some `t`.  
  - **Why here?** CS punchline: If your theory has these, proving `∀P, P ∨ ¬P` would force deciding every mathematical sentence (e.g., Goldbach). Incompleteness → impossible for consistent arithmetics.  
  - **Guardrail:** "LEM holds for *decidable* `A` (e.g., `n = m` in ℕ). The failure is for arbitrary propositions—no algorithm to decide all `P`."  
  - *Philosophy hook:* "Truth requires verification, not just platonic existence."  

  ---

  ### **5. What to Refuse (Name Only)**  
  Mention in closing "further topics" slide. Prepare 1-sentence explanations:  
  - **Likely question:** "What’s Brouwer’s continuity principle?"  
    - *Answer:* "All total functions `ℝ → ℝ` are continuous. It *contradicts* classical math but expresses that constructions are computable. Bishop avoids it."  
  - **Skip details:** Choice sequences (non-predefined reals), bar induction (Brouwer’s induction principle), realizability (one model of BHK), Kripke/Beth (possible-worlds semantics).  

  ---

  ### **6. Final Slide: Assessment Exercise (15 min)**  
  **Activity:** "Spot the non-constructive step; can it be repaired?"  
  - **Use *paired* classical proofs:**  
    ```coq
    (* Example 1: Repairable *)
    Theorem exists_irrational: exists a b, irrational a /\ irrational b /\ rational (a^b).
    Proof. (* Classical: Case split on (√2^√2) rational or not. Non-constructive step: LEM. *)
      (* Repair: Explicit witness e.g., a = √2, b = log₂ 9. Constructive! *)

    (* Example 2: Unrepairable without more info *)
    Definition sig (f: nat -> bool) : nat := 
      if classic (exists n, f n = true) then (* LEM used! *)
        minimal n such that f n = true
      else 0.
    (* Non-constructive step: LEM on `exists n, f n = true`. 
       Repair? Only if `f` is decidable (e.g., if we know `forall n, f n = true \/ f n = false`). *)
    ```  
  - **Why this pair?**  
    - First shows LEM can sometimes be avoided with explicit witnesses.  
    - Second shows LEM used to *define* a value, which fails if the witness isn’t computable (e.g., `f` encodes halting problem).  
    - Tests understanding: Students must recognize LEM *and* see that repairability depends on available evidence.  

  ---

  ### **Timeline Summary**  
  - **0–10 min:** BHK (evidence-based logic) + philosophy hook.  
  - **10–25 min:** Constructive reals (equality undecidable) → apartness.  
  - **25–30 min:** LEM (why not universal?; `¬¬LEM`).  
  - **30–40 min:** IVT (classical vs. approximate; computable counterexample).  
  - **40–50 min:** Disjunction/existence properties + incompleteness payoff.  
  - **50–60 min:** Bishop vs. Brouwer (1 sentence); misconceptions recap.  
  - **60–75 min:** Final exercise (paired proofs).  
  - **75–80 min:** Q&A; further topics named.  

  **Why this works:**  
  - CS students see computational depth (reals, IVT, disjunction property).  
  - Philosophy students see meaning-as-use (BHK as operational semantics).  
  - Both walk away understanding constructive math as a *positive* framework, not just "classical minus LEM."
