prompt: |-
  I keep watching arguments about transformative AI turn on whether it is like nuclear weapons, the printing press, or the Industrial Revolution, and I want to stop asking which comparison is correct and ask instead what a comparison would have to be good for. Please write the specification.

  The purpose it has to be adequate to: guiding a decision that must be made before the evidence is in. A regulator, a funder, or a lab deciding now whether some concrete inference goes through — about how fast a capability diffuses, whether unilateral restraint is stable, whether a pause would be enforceable, whether the first movers capture durable advantages. Not forecasting, not mood-setting, not winning an argument. So the unit of adequacy is the inference an analogy licenses, not the analogy taken as a whole; an analogy can be good for one inference and worthless or actively misleading for another.

  Here are the requirements I keep half-formulating. Sharpen them, discard the ones that are not really desiderata, and add what I have missed. For each, give the case or consideration that motivates it and say what a candidate looks like when it fails it.

  1. Named inference. The analogy must state which specific inference it is carrying, and that inference must have a direction and a subject, not just a topic.
  2. The name-stripping test. Restate the lesson with every proper noun removed, as a claim about feature-values. If the inference collapses when the names go, the episode's prestige was doing the work.
  3. Incrementality. Delete the analogy; if the conclusion is unchanged, the analogy was decoration.
  4. Ex ante availability. Was the lesson recognizable to people living through the earlier transition, or only reconstructable once the outcome was known? Say what we should do with analogies whose lessons are purely retrospective.
  5. Declared axes. The analogy must say which dimensions it is mapping — tempo, whether the artifact is a tool or something with its own initiative, how concentrated control over it is, whether the change is reversible, whether diffusion feeds back into further improvement, whether contemporaries could tell a transition was underway — and which of those axes actually carry the inference, and which it is leaving dark.
  6. Defeat conditions. What would have to be true of AI for this analogy to misfire, and how would we know?
  7. The boomerang condition. Analogies get picked up by people arguing the opposite policy. What does this one license for them?

  Then: mark which requirements are non-negotiable and which are preferences of a camp — I suspect that demanding an analogy involve existential stakes, or that it be drawn from an episode that ended tolerably well, are both smuggled conclusions rather than criteria. Flag any subset of the surviving desiderata that cannot be jointly satisfied; if the list is itself a result, say so plainly. And commit to a view on which single requirement does the most work in excluding candidates, with your reason.

  Finally, a scorecard against the list — nuclear weapons, the printing press, the Industrial Revolution — one line each, no more than 150 words total. Keep the weight on the criteria; the scorecard is an appendix.

  Take a definite position throughout and defend it. Do not survey the options and leave me to choose. Under 800 words, in American English.
reasoning: |-
  Okay, let's tackle this user request. They want a specification for evaluating historical analogies about transformative AI, moving beyond "which comparison is correct" to focus on what makes an analogy useful for concrete decisions. The core insight is that analogies should license specific inferences for actions taken now under uncertainty.

  Hmm, the user provides seven half-formed requirements. Need to sharpen these while recognizing some might be preferences rather than necessities. Key is distinguishing between what makes an analogy structurally sound versus what makes it policy-useful. 

  First, Named Inference seems fundamental - without specifying exactly what conclusion the analogy supports, it's just rhetoric. The Name-stripping Test follows naturally: if the lesson depends on historical branding rather than general features, it's prestige-thinking. Incrementality weeds out decorative comparisons. Ex Ante Availability is trickier - while retrospective bias is real, some valid patterns only emerge in hindsight; probably should be a preference rather than hard requirement.

  Ah, Declared Axes feels crucial. Every analogy highlights some dimensions while obscuring others; making this explicit prevents smuggling assumptions. Defeat Conditions force falsifiability. Boomerang Condition is pragmatically vital - if both sides can wield it, the analogy lacks discriminant power.

  Now, which requirements are non-negotiable? Named Inference, Name-stripping, and Declared Axes seem essential for any rigorous analogy. The others guard against specific failure modes but could sometimes be waived. Importantly, demanding "existential stakes" or "positive outcomes" indeed smuggles conclusions - good catch by user.

  For the scorecard: Nuclear Weapons fails name-stripping (relies on Hiroshima prestige) and boomerang test (deterrence vs. nonproliferation arguments both use it). Printing Press collapses on declared axes - maps poorly to capability diffusion feedback loops. Industrial Revolution flunks ex ante availability (contemporaries didn't grasp scale) and defeat conditions (no clear failure threshold).

  The real workhorse requirement is Declared Axes - it forces precision about what's being compared and what's ignored. Most analogies fail here by overclaiming relevance. User's focus on concrete inferences rather than mood-setting is exactly right; this specification should help cut through policy theater.
answer: |-
  Here is the sharpened specification for evaluating historical analogies used to license inferences about transformative AI decision-making:

  **Non-Negotiable Requirements:**
  1.  **Named Inference:** The analogy must explicitly state the *specific, directional claim* it licenses (e.g., "Nuclear weapons analogies license the inference that *unilateral national restraint on frontier AI development is unstable*"). Must identify the subject (who/what acts) and the direction of the inference (increases/decreases likelihood, enables/impedes).
      *   *Failure:* "AI is like nukes, so we need caution." (Vague topic, no direction).
      *   *Motivation:* Prevents vague mood-setting; forces operational clarity.
  2.  **The Name-Stripping Test:** The core causal mechanism supporting the named inference must be stated using only abstract feature-values (e.g., "Artifacts enabling decisive strategic advantage trigger arms-race dynamics even among adversaries fearing mutual destruction").
      *   *Failure:* "It's like nukes, so obviously restraint fails." (Collapses without "nukes" prestige).
      *   *Motivation:* Ensures the inference rests on replicable dynamics, not historical branding.
  3.  **Declared Axes:** The analogy must explicitly state: (a) Which features/dimensions *are* mapped (e.g., "We map: strategic advantage concentration, catastrophic misuse potential, reversibility of deployment"). (b) Which specific mapped features *carry* the inference. (c) Which critical features are *not* mapped or are dissimilar (e.g., "We do *not* map: speed of development, dual-use nature, diffusion to non-state actors").
      *   *Failure:* "AI is the new Industrial Revolution." (Implies broad relevance without specifying which aspects matter or differ).
      *   *Motivation:* Forces transparency about scope, relevance, and limitations; prevents over-extension.
  4.  **Defeat Conditions:** Must specify observable conditions under which the analogy demonstrably *fails* for the named inference (e.g., "The nuclear analogy for unstable restraint fails if: (1) Key AI capabilities prove inherently slow & expensive to replicate *and* (2) Early developers demonstrate consistent, verifiable self-restraint without defection").
      *   *Failure:* Analogies presented as universally applicable regardless of AI's specific properties.
      *   *Motivation:* Embeds falsifiability; ties the analogy to observable reality.

  **Important Preferences (Not Strictly Non-Negotiable, But Highly Recommended):**
  5.  **Incrementality:** The named inference should gain significant, non-redundant support *from the analogy itself*, beyond arguments already present.
      *   *Failure:* Using Hiroshima imagery solely to emphasize "AI could be bad" when independent arguments already establish catastrophic potential.
      *   *Motivation:* Ensures the analogy adds unique evidential weight, not just rhetorical force.
  6.  **Ex Ante Availability (Preference):** The causal lesson should have been plausibly recognizable *during* the historical episode, based on contemporary information.
      *   *Failure:* "The Luddites were ultimately wrong" – a lesson only clear *after* industrialization's long-term benefits materialized.
      *   *Treatment:* Analogies relying purely on retrospective "lessons of history" should be treated with extreme skepticism for *prospective* decisions under uncertainty. They often smuggle in hindsight bias.
  7.  **The Boomerang Condition:** Evaluate what plausible counter-policy the *same* analogy could be used to support.
      *   *Failure:* Nuclear analogies used equally to argue *for* aggressive development ("deterrence") and *against* it ("non-proliferation").
      *   *Motivation:* Reveals if the analogy is too vague or polysemous to provide clear guidance; highlights potential for misuse.

  **Key Observations:**
  *   **Smuggled Conclusions:** Requiring existential stakes or a "good outcome" *are* smuggled conclusions. An analogy's validity depends on its structure and mapping, not its emotional weight or endpoint.
  *   **Joint Satisfaction:** All non-negotiables can be jointly satisfied. Preferences might sometimes conflict (e.g., a highly *incremental* analogy might rely on a *retrospective* framing), but prioritizing non-negotiables resolves this.
  *   **Most Workhorse Requirement:** **Declared Axes** does the most work. It forces explicit articulation of the analogy's scope, mechanism, and limitations. Most bad analogies fail here by implying relevance where none exists or hiding critical disanalogies. It underpins the Name-Stripping Test and enables Defeat Conditions.

  **Scorecard (≤150 words):**
  *   **Nuclear Weapons:** Fails **Name-Stripping** (prestige-heavy), often fails **Declared Axes** (rarely specifies mapped features like concentration vs. diffusion), catastrophically fails **Boomerang** (supports deterrence *and* non-proliferation). Strong on existential stakes (smuggled) and Defeat Conditions *if* axes declared.
  *   **Printing Press:** Fails **Declared Axes** (diffusion speed & societal impact mapped, but critical disanalogies like autonomous agency obscured), weak **Defeat Conditions** (what *wouldn't* be like the press?). **Ex Ante Availability** questionable (contemporaries saw disruption, not full transformation). Illustrates diffusion, not control.
  *   **Industrial Revolution:** Fails **Ex Ante Availability** (contemporaries misjudged pace/impact), often fails **Declared Axes** (broad-brush comparison hides critical differences in agency, timescale, reversibility). **Defeat Conditions** hard to define. Illustrates long-term transformation, not acute risk dynamics.

  **Final Position:** Analogies are tools for specific inferences under uncertainty. Rigor requires stating the exact claim, stripping away historical branding, declaring the mapped (and unmapped) features, and specifying when the analogy breaks. **Declared Axes** is paramount. Nuclear analogies often fail structurally; Printing Press is too vague; Industrial Revolution is hindsight-laden. Use them only with extreme discipline under this spec.
