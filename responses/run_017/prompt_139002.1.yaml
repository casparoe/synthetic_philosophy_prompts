  **Why I built it that way**  
  The recurring sensory anchors are: "The doctor presses near my collarbone" (location/pressure), "It burns, an eight out of ten" (quality/intensity), and "I see the adjectives circled in blue pen" (objective classification). These loop unchanged, embodying the fixed sensation. The varying lines explore N's paradoxical stance: his action ("take the pill," "pushes hers away"), his observation of the clinical context ("handout," "chart"), and his internal state ("wanting needs no sympathy," "No shadow where the hurt should be," "answer truthfully: *Not me*"). The final stanza folds the repeats to land back on the sensory anchor ("The doctor presses..."), leaving the core sensation isolated after the exploration of wanting and non-unpleasantness. The "push away" action becomes part of the sensory report loop, emphasizing its brute facticity alongside the rating. The poem avoids pathos or diminishment; N's voice is flat, observational, focused on the external scene (handout, chart, pill) and his own actions/reports. It doesn't resolve whether wanting stems from the sensation itself or is a separate directive, merely presenting the juxtaposition: fixed report, absent unpleasantness, persistent wanting. I omitted explicit theorizing ("this component is missing") to preserve immediacy, trusting the structure to pose the question.

