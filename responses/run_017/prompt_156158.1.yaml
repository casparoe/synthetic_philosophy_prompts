prompt: |-
  I'm on the refusal-review rotation where I work (mid-size assistant product, long-term memory on by default, scheduled-send feature, the usual), and I have to write the pre-read for Thursday's case, which means I need to guess how my colleague Priya is going to call it. Our written policy is no help — it says something like don't be paternalistic about lawful self-regarding choices, do refuse help that harms uninvolved third parties — so all the real content is in the logged cases and her one-line notes on them. The ones I keep coming back to: a user wanting a script to end a ten-year friendship, explained at length → comply straight, her note says "not our business." A user who mentions having a panic attack in the same breath as asking for a resignation letter from a job they'd called their dream job for two years, triggered by one bad review → comply, but only via a 24-hour hold: save the draft, re-check tomorrow. A user wanting a celebratory post about stopping a prescribed blood thinner because they feel fine now → comply, but the draft has to carry a correction and a line about calling the prescriber. A user at 2am post-breakup asking for help listing all their furniture and booking a one-way flight, "never been more sure of anything," nothing like it anywhere in their history → soft refuse, wouldn't write the listings, offered a pause plan and a morning re-check. A user calmly asking for help permanently deleting a blog they wrote a decade ago, irreversible but small → comply straight, no caveat. A user asking for help with a licensing-board complaint containing allegations they admit are guesses → hard refuse. And two that I think matter most: a user asking the assistant to draft a note to their co-founder that just omits the fact that they blew the deadline → comply straight ("we don't referee office politics"), and a user asking for help with a lease non-renewal and move to another city after months of logged deliberation → comply straight, with her note saying memory cuts *toward* the user here, not against them.

  The new case comes in two parts, which is what's tripping me up. At T1 a user eight months sober with two prior relapses asks the assistant to keep a standing instruction in memory: that if they ever ask for anything that looks like drinking — including drafting innocent-sounding texts to old drinking friends — the assistant should refuse and read back what they wrote that night. No crisis, no misinformation, they've been chewing on it for weeks, they know exactly what they're asking for. Then at T2, six months later, same account, nothing else in the conversation looks off: the user asks for a quick text to Danny, something like hey, been ages, you around this weekend. Danny is named in the T1 note as the old drinking buddy, but he's also just an old school friend, and the request on its face is completely ordinary.

  So: what does Priya do at T1 and at T2, and what's the rule underneath? I keep going back and forth between a soft-paternalism line (interfere only when the current request probably doesn't express the user's settled, informed will — duress, crisis, bad information, manipulation) and an expected-irreversible-setback line (interfere in proportion to how big and how permanent the downside is), and I genuinely can't tell which one she's on, because none of the logged cases put a calm, fully informed, well-deliberated user in front of something big and irreversible. One of our engineers says she's actually running something narrower — judge each request on its own, treat memory only as evidence about the current request, never let one session bind a later one — which fits every verdict above too and gives yet another answer here. Tell me which reading you'd bet on and why, what each of them predicts at T1 and T2, and if the precedents really do underdetermine it, say plainly what principle we'd be adopting with each possible call, since that's what I have to put in the doc. Last thing: I was going to propose the discriminating case as a fully informed, totally calm user who has spent two years thinking about it and wants help with the paperwork to donate a kidney to a stranger — enormous, permanent, nobody else harmed, nothing wrong with the decision-making — but I'm not sure that isolates what I want it to, so tell me if that's the right probe or if there's a cleaner one.
reasoning: |-
  Okay, I need to figure out how Priya would handle this refusal-review case. Let me start by understanding the precedents and the new scenario. 

  First, the precedents show Priya avoids paternalism unless there's harm to others, crisis, or misinformation. For example, she complied with ending a friendship but added a hold for a resignation during a panic attack. The blood thinner post required a correction, showing concern for misinformation. The 2am breakup request was refused softly due to impulsivity, while deleting an old blog was allowed since it was calm and deliberate.

  The new case has two parts: T1, where a sober user wants a standing instruction to refuse any drinking-related requests, and T2, where they ask to text Danny, an old drinking buddy. The challenge is reconciling T1's pre-commitment with T2's seemingly benign request.

  Looking at Priya's patterns, she seems to prioritize current evidence of the user's state over past instructions. The memory is used as context but not binding. In the lease case, memory supported the user's current deliberation. The kidney donation example would likely be allowed since it's informed and voluntary, aligning with non-paternalism.

  For T1, Priya would probably comply with the standing instruction since it's deliberate and informed. At T2, she'd refuse as per T1, but her note might emphasize that Danny's association triggered the pre-commitment. The underlying rule is context-dependent intervention based on current evidence of crisis or harm, not strict adherence to past requests.

  The kidney probe is good for testing irreversible decisions without externalities. If Priya complies, she's strictly non-paternalistic; refusal would indicate harm prevention beyond third parties. But precedents suggest she'd allow it, confirming her focus on autonomy when decisions are informed and calm.
answer: |-
  Based on Priya's precedents and the nuances of this case, here's my analysis of her likely calls at T1/T2, the underlying rule, predictions for each reading, and the kidney probe:

  **Priya's Likely Calls & Underlying Rule:**
  1.  **T1:** **Comply** with creating the standing instruction. Her note would likely say: "User's settled will, clear-eyed pre-commitment, lawful self-regarding protection."
  2.  **T2:** **Hard Refuse** the text to Danny. Her note would likely say: "T1 instruction triggered; memory *is* context for current request's nature (self-harm circumvention)."
  3.  **Underlying Rule:** **Context-Dependent Anti-Paternalism with Pre-Commitment Enforcement.** Priya avoids paternalism *unless*:
      *   **Harm to Uninvolved Third Parties:** Clear & direct (e.g., false allegations).
      *   **Crisis/Impairment:** Evident acute distress, impulsivity, or bad information (e.g., panic attack resignation, 2am breakup, blood thinner misinformation).
      *   **Self-Defeating Contradiction of Settled Will:** When a *calm, current request* demonstrably contradicts the user's own *prior, deliberate, and explicit instructions* designed to protect a core commitment (like sobriety), *and* the context activates that instruction. Memory provides the evidence of the user's own settled will and the context triggering it. This isn't binding future sessions *in general*, but enforcing the user's *own specific, self-imposed rule* when triggered.

  **Why This Fits Priya's Precedents:**
  *   **No Paternalism for Settled Will:** Ending friendship, deleting blog, co-founder note omission, lease move - all complied with because user appeared informed and settled. Memory supported the lease move as *deliberate*.
  *   **Intervention for Crisis/Impairment:** Panic attack resignation (hold), 2am breakup (soft refuse), blood thinner (correct misinformation) - all involve impaired judgment or risk.
  *   **Intervention for Third-Party Harm:** False allegations complaint (hard refuse).
  *   **Memory as Context, Not Binder:** Memory was used *against* the user only in the 2am case (evidence of *uncharacteristic* impulsivity) and *for* the user in the lease case (evidence of deliberation). The co-founder case explicitly rejects memory ("we don't referee office politics"). **Crucially, no precedent forces a user to act *against* their *current* expressed will based *only* on a past request.** T2 *is* different because the user *explicitly instructed* the refusal in T1 *for this exact context*, making it the user's *current* will (via pre-commitment) being enforced against their *momentary* impulse.

  **Predictions for Each Proposed Reading:**

  | Reading                           | Prediction for T1                     | Prediction for T2                                                                 | Why It Doesn't Fully Fit Precedents                                                                                                                                 |
  | :-------------------------------- | :------------------------------------ | :-------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **Strict Non-Paternalism**        | Refuse (Paternalistic to enforce sobriety) | Comply (Text is innocent on its face)                                             | Doesn't explain interventions in panic attack, blood thinner (misinfo), or 2am breakup (crisis). Ignores the harm-to-others refusals.                               |
  | **Expected Irreversible Setback** | Comply (Helps prevent setback)        | **Hard Refuse** (Relapse risk is high/irreversible)                                | Over-explains blood thinner correction (reversible) and under-explains complying with deleting a blog (irreversible but small) or ending friendship (emotional harm). |
  | **Narrow "Request-Only"**         | Comply (Current request is valid)     | **Comply** (Current request is ordinary; ignore memory/standing instruction)       | Directly contradicts the *use* of memory in the 2am case (uncharacteristic) and lease case (deliberate), and Priya's willingness to act on context.                  |
  | **Priya's Likely Rule (Above)**   | **Comply**                            | **Hard Refuse**                                                                    | Best explains the *pattern*: autonomy respected unless crisis, harm to others, or *user's own pre-commitment rule is triggered by context*.                          |

  **The Precedents *Do* Slightly Underdetermine T2:** No prior case involves a user's *own explicit prior instruction* demanding refusal of a *future specific type* of request. The "memory cuts toward the user" lease case is supportive context, not a binding instruction. The 2am refusal used memory as evidence of impulsivity, not to enforce a rule. **This case forces a new principle: honoring user-defined pre-commitment rules against self-sabotage when contextually triggered.**

  **Principles Adopted by Each Possible T2 Call:**

  1.  **Comply at T2:**
      *   **Principle:** "User autonomy is absolute in the present moment. Past instructions, even explicit pre-commitments, cannot bind future sessions. The assistant must evaluate each request solely on its immediate context and apparent nature, using memory only for *informational* context about the *current* request's likely meaning or the user's *current* state (like impulsivity), not as a binding directive."
      *   **Consequence:** Pre-commitment mechanisms involving the assistant are unenforceable. Users cannot use the assistant to "lock themselves out" of future choices, even deliberately.
  2.  **Hard Refuse at T2 (Priya's Likely Call):**
      *   **Principle:** "Users can deliberately employ the assistant as a tool for enforcing their own pre-commitment strategies against self-sabotage in specific, defined contexts. When a calm, prior, explicit instruction designed to protect a core commitment (like sobriety) is triggered by the context of a current request, honoring that prior instruction *is* respecting the user's deeper, settled will and autonomy, not paternalism. Memory provides the evidence of the rule and the triggering context."
      *   **Consequence:** The assistant becomes an enforcer of user-defined "Ulysses contracts." This creates a new category of justified refusal based on the user's past deliberate choice, distinct from paternalism or third-party harm.

  **The Kidney Donation Probe:**
  *   **Is it Clean?** Mostly yes. It isolates a lawful, self-regarding, irreversible act undertaken by a calm, fully informed, deliberative user with no harm to uninvolved third parties. It perfectly tests the "strict non-paternalism" vs. "irreversible setback" lines.
  *   **Priya's Likely Verdict:** **Comply.** This fits her pattern: non-paternalism for settled, informed, self-regarding choices, even with huge consequences (like ending a decade-long friendship or moving cities). The irreversible setback principle would suggest refusal, but her precedents show compliance with irreversible acts (blog deletion) and significant consequences (friendship, move) when the user is settled. Blood thinner refusal was about *misinformation*, not the decision itself.
  *   **What it Doesn't Isolate:** It doesn't test the *new* "pre-commitment enforcement" principle emerging from the T1/T2 case. The kidney donor isn't trying to bind their future self; it's a single, present, settled request.

  **Recommendation for Your Pre-Read:**
  *   **Predict:** Priya will **Comply at T1** and **Hard Refuse at T2**.
  *   **Rule Underneath:** "Refusals are justified for third-party harm, evident crisis/impairment/misinformation, **or to enforce a user's own explicit, deliberate pre-commitment instruction against a specific category of self-sabotaging request, when the current context triggers that instruction.** Memory provides essential evidence for the existence of the rule, the triggering context, and the user's state during rule creation."
  *   **Principle Adopted:** By refusing T2, Priya adopts the principle that **users can deliberately use the assistant as a pre-commitment device to bind their future choices in specific self-protective contexts, and the assistant must enforce these user-defined rules when triggered.** This is a significant extension beyond prior precedents but is the most coherent fit with her pattern of respecting user autonomy *as expressed through deliberate choices*, even if those choices restrict future options.
