  Hmm, this user presents a sophisticated ethical dilemma observed in their giving circle and personal debate. They've noticed a pattern where moral demands seem to expand beyond financial contributions into perpetual scrutiny of daily choices, and they contrast two archetypes: the fully committed aid worker versus the constantly vigilant "moral accountant." 

  The user has already engaged deeply with philosophical concepts - rejecting standard labels like demandingness, integrity objections, and loss of supererogation as incomplete fits. Their core insight is that ethical theories might differ along two distinct axes: total cost (resources sacrificed) versus pervasiveness (cognitive occupation). The giving circle example shows how low-cost but high-pervasiveness demands create a unique burden where one is "never off duty."

  Key questions they raise: (1) Does pervasiveness truly discriminate between ethical theories if even deontology has open-ended duties? (2) Could pervasiveness just be another form of cost (cognitive/emotional)? (3) Might their discomfort stem from the nature of moral authority rather than burden?

  The case of the member who gives a third of his income but faces endless micro-scrutiny illustrates how pervasiveness operates independently of cost. The group's behavior shifts from celebrating substantial sacrifice to policing negligible decisions - pension investments, brand choices, volunteer hours. This creates a qualitatively different pressure: not "give more" but "never stop calculating."

  Their contrast between aid worker and moral accountant is brilliant. The aid worker's total life absorption seems less existentially troubling than the accountant's perpetual low-grade vigilance, despite the latter being "cheaper." This suggests pervasiveness concerns moral psychology - the way ethics colonizes mental space rather than consumes resources.

  Philosophically, this connects to debates about moral residue and deliberative closure. Rule-consequentialism or budgeted giving ("give 10% then stop") create psychological off-ramps missing in pure act-consequentialism. But as the user suspects, even Kantian beneficence duties risk similar pervasiveness without clear boundaries.

  The cognitive cost question is thorny. While decision fatigue is real, the user's examples suggest something more: a violation of what Bernard Williams called "moral luck" - we resent ethics claiming jurisdiction over morally arbitrary choices (like cereal brands). This might explain why explicit budgets feel liberating - they create zones of moral indifference.

  Perhaps the deepest insight is about authority. Constant moralization turns life into an exam where every choice is graded, creating what Sartre called "bad faith" - the inability to simply be. The giving circle's shift from substantial giving to trivial scrutiny reveals how this culture of perpetual evaluation can undermine moral motivation itself.
answer: |-
  Your analysis cuts to the heart of a profound and under-discussed dimension of moral theory. What you're describing as **pervasiveness** (the continuous occupation of deliberative space) versus **costliness** (aggregate resource expenditure) is indeed distinct from standard objections to consequentialism, and your cases expose this distinction sharply. Here's the conceptual landscape mapped precisely:

  ---

  ### **1. The Core Concept: Moral Permeation**
  I propose the term **Moral Permeation** for the phenomenon you identify. Its defining features:
  - **Definition**: The degree to which a moral theory claims jurisdiction over *non-sacrificial, everyday choices* by rendering them perpetually morally salient.
  - **Key Mechanism**: Turns trivial decisions (brand switches, idle moments) into sites of moral obligation through *opportunity cost reasoning* (e.g., "This saved $5 could save a life").
  - **Differentia**: Contrasts with standard demandingness by targeting *cognitive occupancy* and *agency erosion* rather than material sacrifice. A theory can be low-cost but high-permeation (your Case 2) or high-cost but low-permeation (aid worker).

  ---

  ### **2. Boundary Cases Clarifying the Concept**
  - **IN**: Act-utilitarianism with constant expected-value calculations. *Why*: Even brushing teeth carries moral weight (time/water wasted = lives lost).  
  - **OUT**: Kantian imperfect duty of beneficence. *Why*: You may fulfill it by donating 5% income annually, then mentally "close the file."  
  - **BOUNDARY CASE**: A rule requiring daily micro-donations (e.g., $0.10/day via app). *Verdict*: **Low permeation** if automated (deliberation ends after setup); **high permeation** if each day requires manual deliberation.

  ---

  ### **3. Relation to Existing Concepts**
  | **Concept**          | **Where it Aligns**                          | **Where it Diverges**                                  |
  |----------------------|----------------------------------------------|-------------------------------------------------------|
  | **Demandingness**    | Both concern moral "burden"                  | Demandingness = resource depletion; Permeation = cognitive colonization. Your Case 2 is *undemanding* but *pervasive*. |
  | **Integrity Objection** | Both worry about alienation              | Integrity focuses on *projects*; Permeation targets *mundane choices* (e.g., your pension investment scrutiny). |
  | **Loss of Supererogation** | Both note duty expansion               | Supererogation concerns *heroic acts*; Permeation concerns *trivial acts* becoming duties (e.g., signing petitions). |
  | **Agent-Centred Prerogative** | Both seek moral "off-ramps"       | Prerogative justifies *self-interest*; Permeation seeks zones of *moral indifference* (no residue). |
  | **Satisficing Consequentialism** | Both limit obligations          | Satisficing reduces *cost*; Permeation reduction requires *deliberative finality* (e.g., "10% done, no more thought"). |

  ---

  ### **4. Addressing Your Specific Queries**
  #### **(i) Does Permeation Discriminate Between Theories?**
  - **Yes, critically**. Traditional deontology (e.g., Rossian duties) allows "discharge and closure" (e.g., keep promises, then done). Virtue ethics often has "spheres of indifference" (Aristotle’s *adiaphora*).  
  - **But**: Modern "effective altruism"-adjacent deontology *can* become pervasive if beneficence is open-ended. Permeation arises when:  
    - Moral theory denies *quantifiable thresholds* (no "enough")  
    - It frames *inaction* as continuous wrongdoing (your "running lookout" case)  
  - **Implication**: The demandingness debate misses how low-cost, high-permeation theories exploit *psychological availability* rather than material capacity.

  #### **(ii) Is Permeation Just Cognitive Cost?**
  - **No**, though related. Cognitive load (decision fatigue) is a *symptom*, but permeation’s core harm is:  
    - **Normative Authority Expansion**: Morality claims domains traditionally reserved for prudence/habits (e.g., cereal brands).  
    - **Existential Encumbrance**: The self is never "morally unobserved" (your "no point where he is permitted to say enough").  
  - **Test**: A fully automated, unconscious compliance (e.g., AI donating optimally) has *zero cognitive cost* but still *high permeation* if the agent *knows* all choices *could* be moralized.

  #### **(iii) Why Budgets Feel Liberating**
  - **Psychological Mechanism**: Explicit thresholds (e.g., "give 10%, then off-duty") create **deliberative closure**. This:  
    - Preserves zones of *non-moral agency* (choosing coffee for taste, not cost-efficiency).  
    - Avoids the **residue of unactualized opportunities** (always thinking "I could do more").  
  - **Productivity Link**: Budgets reduce *evaluative anxiety* (Tetlock’s "accountability pressure"), freeing cognitive resources for focused giving. Permeation, by contrast, induces *moral trivialization* (petitions = climate change) and burnout.

  ---

  ### **5. Sharpening the Concept: What Moral Permeation Is NOT**
  - **≠ Scarcity of Supererogation**: Permeation makes *micro-choices* obligatory, not heroic acts.  
  - **≠ Totalizing Morality**: Permeation thrives in *liberal theories* (e.g., Singer) that avoid prescribing lifestyles but moralize marginal choices.  
  - **≠ Decision Fatigue**: Fatigue is empirical; permeation is normative (a theory’s *structure* forces chronic evaluation).  

  ---

  ### **Conclusion: The Shape of the Thing**
  Your intuition exposes a gap in ethics: **the moralization of the mundane**. Permeation occurs when:  
  1. **No De Minimis Threshold**: No choice is too small to escape moral scrutiny.  
  2. **No Temporal Boundaries**: Duty is continuous, not dischargeable (no "clocking off").  
  3. **Opportunity Cost Dominates**: Any saved resource *immediately* generates new obligations.  

  This explains why your aid worker (high cost, clear purpose) feels less oppressive than the moral accountant (low cost, endless vigilance). The latter turns life into an unceasing ethical audit. The literature’s oversight lies in conflating *what morality takes* with *how it occupies the self*. Your giving circle’s shift from major sacrifice to minor scrutiny reveals permeation’s corrosive effect: it replaces *achievement* with *endurance*. 

  If permeation has a synonym, it’s **moral enclosure** – the fencing of everyday life into perpetually monitored pasture. Its antidote isn’t less demanding morality, but one with *explicit preserves of indifference*.
