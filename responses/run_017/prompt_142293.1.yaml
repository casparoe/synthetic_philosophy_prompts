prompt: |-
  you're a metaphysician who's been stuck in the modal literature for like fifteen years, the kind of person who has opinions about whether the counterpart relation has to be symmetric. take this seriously and think it through carefully — start with a short brainstorm of the cases you're going to need before you write anything up, and be blunt where you think I've got something wrong.

  I'm trying to write the background section of a paper on de re modality and I keep tripping over the fact that everyone in this argument seems to be working from a different shopping list of what a theory has to deliver. So before I read any more of it I want the spec, not another survey.

  What the theory is for: an account of de re modal claims about ordinary concrete objects — this table could have been made of something other than wood, I could have missed that flight, Humphrey could have won, there could have been one more person than there are — good enough to sit underneath arguments that move from modal premises to conclusions about essence, about coincidence and composition, and about supervenience. So it has to actually deliver truth conditions, or at least a decent story about what makes those claims true, and not merely a translation scheme that rewrites modal English into first-order talk about a plurality of worlds.

  Here's the pile of things I've seen people demand, and I genuinely can't tell which are real requirements and which are just loyalty to a camp. Sort it for me: that an object can literally exist at more than one world versus that the theory never commits you to one thing being wholly present at two worlds; that de re claims be about the very object rather than about some surrogate; that the whole thing work without concrete other worlds; that it respect the necessity of identity and of distinctness; that it have something to say about objects that exist at only one world and have counterparts nowhere; that it not automatically make every property of such a lonely object necessary; that it make origins essential while leaving accidental intrinsics contingent; that similarity do the work without dragging in symmetry or transitivity; that modal truth not swing around with whatever is salient in the conversation; that it take a principled line on the Barcan formulas and contingent existence; that it use one and the same machinery for a thing's persistence through time and for its goings-on at other worlds; that it either allow merely possible objects into the domain or at least not blur could have existed into does exist.

  And here are some cases I invented because the standard ones all seem rigged in somebody's favour. What I want to know is what a theory must be able to say about each, not what your favourite theory does say.

  1. The two heirs. Some object divides into A and B, perfectly symmetric, both of them equally similar to the original and to each other. A similarity-based relation either picks arbitrarily, says both are me (so one object has two successors), or goes indeterminate. Should a theory be required to give a determinate answer here, or is branching an acceptable output?

  2. The swap. Two worlds, w and v. In w, X has the causal biography and modal role that Y has in v, and Y has X's; everything intrinsic about them is traded. Which is which? Is there a fact of the matter? And is a theory that has no answer any worse off than one that answers by stipulation?

  3. The merge. A and B, distinct origins, fuse into C. Somewhere else a single thing splits into two that each trace back to the fused material. Whatever your theory says here has to stay consistent with what it said about case 1, and I suspect that constraint is doing more work than anyone admits.

  4. The lonely object. Exists at exactly one world, zero counterparts anywhere else. Does it come out having all its properties necessarily, and is that a cost or a consequence the theory should just own? If it's a cost, what structure does the theory need in order to avoid it?

  5. Near tie. A world with two candidates, one slightly better along respect R1 and the other slightly better along R2, no weighting given. How much of a story about the respects of comparison does a theory owe us before it can be assessed at all?

  So: give me the numbered requirements list, with the case or consideration behind each one and what goes wrong for a theory that misses it. Mark each as non-negotiable or as a preference of a particular kind of theorist, and say whose. Flag any pair or subset of the requirements you think can't be jointly satisfied — if the honest result is that the list itself is unsatisfiable and the interesting work is in deciding what to drop, that's the part I most want, so say that plainly rather than quietly weakening a requirement to make the list add up. Tell me which single requirement does the most work in excluding candidates, and which of my five cases is the one that really separates the views rather than the one that just looks dramatic.

  Then, briefly — a table is fine, a few lines per view, no more — score these three against your list: the counterpart-theoretic picture where similarity plus context does the work; the transworld identity picture where individual essences or haecceities do it; and the stage-theoretic picture where temporal and modal counterparthood are the same phenomenon. If you'd rather swap in a different third view, do. Don't recieve this as an invitation to summarise the literature, don't tell me what to read, and don't pad it with citations — I want the criteria.
reasoning: |-
  Okay, let me approach this systematically. The user wants a clear set of requirements for de re modal theories, stripped of partisan biases. They've provided a list of common demands and five test cases – this suggests they're frustrated with theoretical vagueness and want operational criteria. 

  First, I need to categorize their listed demands by philosophical necessity vs. theoretical preference. The heir case seems crucial for testing branching tolerance, while the lonely object directly challenges modal flexibility. The swap case might expose hidden commitments to haecceities. 

  For non-negotiables: Truth conditions are foundational – without them, the theory can't support metaphysical arguments. Contingency for ordinary objects is equally vital; denying it collapses modality. The necessity of distinctness feels non-negotiable too, as its failure implodes identity conditions. 

  Ah, the tension between concreta-free worlds and literal transworld identity jumps out. That's likely the sharpest constraint – counterpart theories sacrifice the latter, while transworld identity needs abstract worlds. Stage theory tries bridging but may inherit problems from both. 

  The lonely object case is revealing: Theories requiring world-bound objects must either accept necessary properties (problematic for contingency) or introduce abstract surrogates (which may violate "about the very object" demands). This exposes a core tradeoff between metaphysical purity and expressive power. 

  For scoring: Counterpart theory handles branching/merge cases flexibly via similarity metrics but stumbles on swap indeterminacy and context-dependence. Transworld identity preserves objecthood rigidly but can't handle symmetric cases without primitive essences. Stage theory unifies time/modality elegantly but struggles with persistence intuitions in the heir case. 

  The merge case (#3) is the real separator – it forces consistency in handling composition/division symmetries. Most theories reveal their hand here: whether they prioritize material continuity, causal roles, or brute essences. 

  Finally, I should flag that origins essentialism + intrinsic contingency creates pressure for structured individual essences – which then clashes with anti-haecceity intuitions. No theory escapes this unscathed.
answer: |-
  Here's the distilled specification for a de re modality theory, sorted by necessity, with conflicts flagged. Requirements derive from your cases (1-5) and demands list. **Core tension:** Literal transworld identity vs. contingency/similarity-based flexibility is irreconcilable without sacrificing key intuitions.

  ### Requirements List (Non-Negotiables Marked ★)
  1.  **★ Truth Conditions for Ordinary Claims:** Must ground truthmakers (or falsemakers) for claims like "This table could have been metal," "I could have missed the flight," etc. *Why:* Without this, the theory fails its core purpose. *Failure:* Modal claims become unmoored from metaphysics; arguments about essence/composition lack foundations.
  2.  **★ Contingency for Ordinary Objects:** Must allow Humphrey to have won, this table to have different material, etc. *Why:* Denial contradicts intuitive modal judgments central to philosophical arguments. *Failure:* Collapses modality into necessity (Spinozism) or trivializes essentialism.
  3.  **★ Necessity of Identity/Distinctness:** If X=Y in any world, X=Y in all worlds where both exist. If X≠Y in any world, X≠Y in all worlds where both exist. *Why:* Violation implies contradictions in identity conditions (≈ "X is Y and X is not Y"). *Failure:* Undermines objecthood and logical coherence.
  4.  **★ No Automatic Necessity for Lonely Objects (4):** An object existing in only one world *must* have some contingent properties (e.g., "This lonely table could have been scratched"). *Why:* Denial (all properties necessary) makes modality meaningless for unique entities; contradicts contingency requirement (#2). *Failure:* Renders vast swathes of modal discourse (e.g., about origins of the universe, unique artifacts) incoherent. *Structure Needed:* Requires *modal profiles* not tied to existence elsewhere (e.g., world-indexed properties, non-existent counterparts).
  5.  **Avoid Salience-Dependence:** Modal truth shouldn't shift *fundamentally* with conversational context. *Why:* Needed for objectivity in metaphysical arguments. *Failure:* Makes essence, composition, supervenience claims context-relative and non-metaphysical. *(Note:* Counterpart theorists often reject this; marked negotiable for them, non-negotiable for others).
  6.  **Handle Branching/Indeterminacy (1 & 3):** Must provide a *principled* account of symmetric cases (Two Heirs, Merge). *Why:* Avoids arbitrariness or brute stipulation. *Failure:* Theory lacks generality; adjudicates cases by fiat. *Acceptable Outputs:* Indeterminacy ("neither is uniquely the successor") or non-arbitrary branching ("both are successors, worlds branch") are valid *if* principled. Forbidding *arbitrary* "picking one" is key.
  7.  **Respect Origins Essentialism + Accidental Intrinsics Contingency:** Must ground essentiality of origin (e.g., this table from this wood) while allowing contingent properties (e.g., this table being scratched). *Why:* Central data point for essence/accident distinction. *Failure:* Cannot underpin arguments about essence. *(Note:* Requires careful handling of similarity/essence relation).
  8.  **Principled Stance on Contingent Existence/Barcan:** Must explicitly accept or reject Barcan formulas (∀x□F(x) → □∀xF(x); ◇∃xF(x) → ∃x◇F(x)) and justify it regarding the domain/quantification. *Why:* Affects coherence of "could have existed" claims and ontological commitments. *Failure:* Quantification over worlds/objects becomes ambiguous or contradictory.
  9.  **Clarity on "Other Worlds":** Must specify ontological status of "worlds" (concrete, abstract, ersatz) and relation to actuality. *Why:* Bears on truthmaking and metaphysical cost. *Failure:* Truth conditions are obscure or metaphysically extravagant.
  10. **Object-Aboutness:** De re claims must be *about* the object itself, not merely a description or surrogate *in a way that violates core intuitions*. *Why:* Captures the *de re* character ("Humphrey *himself* could have won"). *Failure:* Collapses into disguised *de dicto* modality. *(Note:* Counterparts *can* satisfy if the link is sufficiently robust; Haecceities *do* satisfy literally).

  ### Conflicts & Key Tensions
  *   **★ Irreconcilable Conflict:** **Literal Transworld Identity (#10 strict reading) vs. Contingent Existence + Lonely Object Contingency (#2, #4).** If an object *literally exists* only at its home world (#4), it cannot be *literally identical* to something at another world (#10 strict). Conversely, if it *is* literally identical across worlds (#10 strict), it *must* exist at those worlds, making contingent existence (#2) tricky (requires world-bound domains) and lonely objects (#4) impossible. *Resolution requires choice:* Sacrifice strict literal transworld identity (accept surrogates) OR sacrifice straightforward contingent existence/lonely object contingency (accept transworld identity with world-indexed properties or domain restrictions).
  *   **Conflict:** **Similarity Flexibility vs. Determinacy (#6, Swap #2).** Relying on similarity (for contingency, origins) creates pressure for context-dependence (#5) and indeterminacy in symmetric cases (Swap #2: "Which is which?" may have no fact of the matter). Insisting on determinacy (#6) and anti-salience (#5) pushes towards non-similarity-based grounds (e.g., haecceities, primitive essences).
  *   **Tension:** **Merge Consistency (3) vs. Heir Symmetry (1).** A theory using the same machinery for fission/fusion must treat symmetric fission (1) and asymmetric fusion (3) coherently. E.g., if symmetric fission yields indeterminacy/branching, symmetric fusion should too. *Failure here exposes ad hocery.*

  ### Most Excluding Requirement
  **★ Contingency for Lonely Objects (#4)** does the most work. It immediately excludes:
  *   **Extreme Transworld Identity:** If objects are world-bound, properties must be modally flexible *without* counterparts elsewhere.
  *   **Extreme Counterpart Theory:** If counterparts are *required* for de re possibility, lonely objects have none, so all properties are necessary (violates #4).
  *   *(Requires: World-bound objects with intrinsic modal profiles OR non-existent counterparts)*

  ### Most Revealing Case
  **The Swap (#2)** is the sharpest separator, not the most dramatic (Heirs/Merge are dramatic but often handled similarly within camps). It tests:
  *   **Haecceitism/Thismess:** Does identity *supervene* on intrinsic properties + relations? If yes, Swap worlds are indistinguishable regarding which object is which (no fact of the matter). If no, primitive haecceities ground identity independently (fact of the matter).
  *   **Counterpart Theory:** Context/salience determines counterpart relation. "Which is which?" isn't a worldly fact but depends on description.
  *   **Stage Theory:** Depends on temporal counterpart relation – if it's similarity-based, Swap raises same issues as for standard CT.

  ---

  ### Theory Scores Against Requirements
  *(CT = Counterpart Theory; TI = Transworld Identity; ST = Stage Theory)*

  | Requirement                     | CT (Lewisian)                     | TI (Haecceitist)                  | ST (Siderian)                     |
  | :----------------------------- | :-------------------------------- | :-------------------------------- | :-------------------------------- |
  | **1. Truth Conditions**        | **✓** (via counterparts @ worlds) | **✓** (via identity @ worlds)     | **✓** (via modal counterparts)    |
  | **2. Contingency**             | **✓✓** (core strength)            | **△** (Tricky w/ contingent existence) | **✓** (similar to CT)             |
  | **3. Nec. Identity/Distinct**  | **✓** (by stipulation)            | **✓✓** (core strength)            | **✓** (by stipulation)            |
  | **4. Lonely Object Contingency** | **✗** (No counterparts → necessity) | **△** (Possible w/ world-indexing) | **✗** (No modal counterparts → necessity) |
  | **5. Anti-Salience**           | **✗✗** (Salience is core)         | **✓✓** (Identity is objective)    | **✗** (Salience/temporal context) |
  | **6. Branching/Indeterminacy** | **✓** (Handles 1/3 via indeterminacy/context) | **△** (Struggles w/ 1/3 symmetry - needs brute facts) | **✓** (Handles like CT)           |
  | **7. Origins Ess + Accid Cont** | **△** (Depends on similarity weighting) | **✓** (Origins part of essence)   | **△** (Like CT)                   |
  | **8. Barcan Stance**           | **✓** (Rejects BF, domains world-bound) | **△** (Often accepts BF, domains fixed) | **✓** (Like CT)                   |
  | **9. World Clarity**           | **✓** (Concrete pluriverse)       | **△** (Often abstract/ersatz)     | **✓** (Like CT)                   |
  | **10. Object-Aboutness**       | **△** (Surrogates - controversial)| **✓✓** (Literal identity)         | **△** (Surrogates - temporal stages) |

  **Key:** **✓✓** = Strong Fit, **✓** = Satisfies, **△** = Partial/Problematic Fit, **✗** = Fails, **✗✗** = Core Failure

  *   **CT:** Excels at contingency (2), branching (6), world clarity (9). **Fails** Lonely Objects (4) and Anti-Salience (5) non-negotiably. Object-Aboutness (10) is its Achilles' heel for critics.
  *   **TI:** Excels at identity/discernibility (3, 10), anti-salience (5). **Struggles** with Contingent Existence (2) and Lonely Object Contingency (4) without careful world-indexing/domain handling. **Fails** to handle symmetry (1, 2, 3) non-arbitrarily without primitive haecceities.
  *   **ST:** Gains unification (time/modality). Inherits **CT's strengths** (2, 6, 8, 9) and weaknesses (4, 5, 10). **Adds weakness:** Persistence conditions become modal counterpart relations, which can feel less intuitive than temporal ones.

  **Conclusion:** No theory satisfies all non-negotiables (1-4, 5/6 partially). **The core trade-off is:** Accept surrogates (CT/ST) for flexibility/contingency at the cost of literal aboutness and anti-salience, **OR** accept literal transworld identity (TI) for aboutness/objectivity at the cost of flexibility in contingent existence and symmetric cases. **Lonely Object Contingency (4)** is the hardest nut, forcing either world-bound objects with intrinsic modal properties (straining TI/ST) or non-existent entities (straining CT). Your "spec" reveals why the debate persists: the desiderata are genuinely in tension, and choosing a theory involves prioritizing which modal intuitions are bedrock.
