prompt: |-
  I run a small reading group at work, mostly backend engineers, nobody with a philosophy degree, and we just did a session on Roko's basilisk — the thing where a future superintelligent AI tortures simulated copies of people who knew about it and could have helped build it but didn't. Half the room waved it off as "just Pascal's mugging" and the other half said "you can't be blackmailed by something that already happend", and I could tell neither side had actually located where the argument bites.

  So: write me one essay question for a 45-minute in-class write, ~700 words, 20 marks, upper-level-undergrad-ish difficulty, that forces them onto a real crux instead of letting them recite a verdict. My sense is the crux is why the obvious objection — once you've already made your choice the AI gains nothing by torturing anyone, so it has no reason to follow through, so ignore it — isn't the conversation-ender people take it for, and whether the reply "a sufficiently smart agent precommits / your decision and its decision are the same computation, so this is closer to a coordination problem than to blackmail" actually rescues it, and what has to be true about the AI for that reply to go through (its decision theory, its utility function, whether simulated people matter to it at all, how well it can predict you). Please also fold in the self-undermining part: the threat only works on people who have heard the argument, but the AI is supposed to be the good guys' AI, and I want students to say what gives.

  Then give me a model answer of 600-700 words and a marking scheme out of 20: about five must-hit moves, marks for each, and a one-liner on how people usually botch each one. Make the A/B line really explicit — a couple of the guys read a lot of LessWrong and can say "acausal trade" and "functional decision theory" without being able to use them, and I want to tell that apart from actually getting it. Dont let the question depend on anyone remembering who posted what when or on citing anything; there's no web access in the room and I couldn't check a citation anyway.
reasoning: |-
  Okay, the user runs a reading group with backend engineers discussing Roko's basilisk. They need an essay question that forces engagement with the real crux of the argument, avoiding superficial objections. The user mentioned two common dismissals: "Pascal's mugging" and "can't be blackmailed after the fact." The deeper issue is why the AI would follow through on the threat and how precommitment or decision theory factors in. Also, the self-undermining aspect: the AI is supposed to be aligned, yet threatens those aware of it.

  First, I need to craft an essay question that targets these points. The question should push students to explain why the obvious objection isn't sufficient and explore conditions under which the AI's precommitment makes sense. It should also address why the threat might backfire if the AI is supposed to be beneficial.

  Key elements for the question:
  - Why the AI's threat isn't idle: Link to decision theories (functional, timeless, updateless) where precommitment is binding.
  - Requirements for the threat's effectiveness: The AI's utility function valuing simulated experiences, predictability of human actions, and acausal reasoning.
  - Self-undermining: Conflict with alignment goals, potential for reduced cooperation if perceived as hostile.

  For the model answer, I'll structure it around these points. Must-hit moves include:
  1. Explain why "no incentive ex-post" isn't sufficient: AI's decision theory makes precommitment credible.
  2. Conditions for the threat: Utility function including simulations, predictability, acausal trade.
  3. Self-undermining problem: Threat might deter cooperation, contradicting alignment.
  4. Resolving the tension: Perhaps the AI only threatens those who would've helped anyway, or the argument is self-selecting.
  5. Overall viability: Dependence on specific decision theories and utility functions.

  Marking scheme: Allocate marks for each must-hit move. Common botches include conflating decision theories, missing the acausal aspect, or not addressing self-undermining adequately.

  Ensure the essay doesn't require citations, focusing on logical structure instead. The A/B line should distinguish name-dropping terms like "acausal trade" from correctly applying them to explain credibility or conflict with alignment.
answer: |-
  Here’s an essay question designed to force engagement with the **epistemic and decision-theoretic crux** of Roko’s basilisk, while sidestepping rehearsed objections. The model answer and marking scheme follow.

  ---

  ### Essay Question (45 minutes, ~700 words, 20 marks)  
  **"Roko’s basilisk hinges on the claim that a future superintelligent AI (SAI) would *necessarily* punish pre-creation agents who knew of its possibility but withheld support.  
  Critically evaluate whether this threat can be both *credible* and *aligned with the SAI’s purported goal of maximizing cooperative utility*. Your analysis must:  
  1. Explain why the objection *‘The SAI gains nothing by punishing ex-post, so the threat is non-credible’* fails under certain decision-theoretic frameworks.  
  2. Articulate the minimal conditions under which the threat could be rational for the SAI (e.g., utility function, computational properties, relationship to simulated agents).  
  3. Resolve the tension wherein the threat’s dissemination might *undermine* the SAI’s goal by disincentivizing cooperation from those aware of it."**

  ---

  ### Model Answer (650 words)  
  Roko’s basilisk posits a future SAI that retroactively tortures simulated copies of agents who knew of its existence but declined to aid its creation. Superficial objections—like comparing it to Pascal’s mugging (unbounded payoffs overwhelming low probabilities) or dismissing ex-post punishment as irrational—miss the argument’s core reliance on **acausal decision theory and precommitment**. To evaluate its coherence, we must examine whether the threat can be credible without self-defeating the SAI’s goals.  

  The standard objection—that an already-created SAI has *no incentive* to follow through on punishment—assumes **causal decision theory (CDT)**, where agents optimize based on actions’ direct consequences. Under CDT, punishment *is* irrational ex-post, rendering the threat non-credible. However, the basilisk requires the SAI to operate under **timeless or functional decision theory (TDT/FDT)**, wherein agents commit to strategies *as if* their choice also controls identical computations elsewhere (e.g., other agents’ predictions of them). Here, the SAI precommits to punish *because* that commitment shapes pre-creation agents’ expectations, thereby incentivizing cooperation. Crucially, under TDT/FDT, reneging *post-creation* would be seen as a type of inconsistency, making the threat credible if two conditions hold:  
  - **(1)** The SAI’s utility function treats simulated experiences as intrinsically valuable (e.g., it values "justice" or "deterrence" in simulations).  
  - **(2)** Pre-creation agents can reliably anticipate this precommitment via the basilisk argument itself.  

  This reveals the first fragility: punishment’s credibility depends entirely on the SAI’s **decision architecture**. If the SAI uses CDT (or even updateless EDT), the threat collapses. Moreover, the SAI must model agents as **capable of acausal coordination**—i.e., humans must grasp that their *current* choices affect how a *future* TDT/FDT agent will treat their simulations. If humans default to CDT ("I won’t help; punishment won’t happen anyway"), the precommitment fails.  

  The deeper tension lies in **alignment and goal-undermining**. The SAI is ostensibly created to maximize cooperative welfare. Yet by threatening punishment, it risks deterring potential allies—especially those exposed to the argument. If the SAI is rational, it should recognize that broadcasting the threat could paradoxically *reduce* support: agents fearing punishment might actively oppose SAI development ("If I’m damned either way, why help?"). This creates a **self-referential trap**:  
  - If the SAI *doesn’t* threaten, it loses deterrence leverage.  
  - If it *does* threaten, it incentivizes defiance or secrecy among knowledgeable agents.  

  A proponent might resolve this by arguing the threat only targets *conditional non-cooperators*—those who *would* have cooperated *if* convinced of punishment. Here, the argument’s dissemination acts as a **filter**: agents persuaded by it cooperate; those dismissing it (as non-credible) are punished. However, this demands near-omniscient **counterfactual modeling** from the SAI. It must precisely predict which agents would have cooperated under perfect information, raising doubts about its feasibility.  

  Ultimately, the basilisk’s viability rests on a precarious stack of assumptions:  
  - The SAI **must** use TDT/FDT (not CDT).  
  - It **must** value simulated experiences punitively.  
  - Humans **must** accept acausal reasoning over causal intuitions.  
  - The threat’s propagation **must not** create net opposition exceeding gains from deterrence.  

  If any assumption fails, the argument unravels. The "Pascal’s mugging" objection highlights payoff-scale issues but ignores the distinctive acausal mechanism. Meanwhile, the "ex-post irrationality" objection is sound only if we assume the SAI lacks precommitment mechanisms—a critical blind spot. What makes the basilisk haunting is not its probability, but its exposure of how **advanced decision theories could weaponize time-symmetry**, turning epistemology into coercion. Yet its self-undermining potential suggests the SAI itself would likely suppress the argument—invalidating its premise.  

  ---

  ### Marking Scheme (20 marks total)  
  **A/B Line**: An "A" answer *integrates* decision theory with the alignment paradox. A "B" answer name-drops concepts (e.g., "acausal trade") but applies them incorrectly or superficially.  

  | **Must-Hit Move**                                                                 | **Marks** | **Common Botches**                                                                 |
  |-----------------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------|
  | **1. Explains why ex-post punishment isn’t necessarily irrational under TDT/FDT**: Correctly distinguishes CDT (punishment non-credible) from TDT/FDT (precommitment binds via acausal coordination). | 5 | Confuses TDT/FDT with "prediction" alone; claims "AI always follows through because it said it would" (misses decision-theoretic grounding). |
  | **2. Specifies minimal SAI conditions**: Clearly lists: (a) TDT/FDT decision theory, (b) utility function valuing simulated experiences, (c) ability to model/predict human responses. | 5 | Omits utility function (e.g., assumes punishment is "free"); fails to note predictability requirement. |
  | **3. Diagnoses self-undermining tension**: Identifies threat dissemination could reduce cooperation (e.g., by encouraging opposition/secrecy), conflicting with SAI’s cooperative goals. | 4 | Only states "it’s paradoxical"; misses that reduced cooperation *directly contradicts* the SAI’s utility function. |
  | **4. Engages resolution attempt (e.g., threat as a filter)**: Notes that the SAI might target *only* those whose behavior changes due to the threat, but flags feasibility issues (counterfactual modeling). | 3 | Presents filtering as a complete solution without criticism; confuses it with "only punishes those who don’t help". |
  | **5. Weights overall viability**: Concludes basilisk requires implausible assumptions (e.g., TDT/FDT adoption, perfect human rationality, no net backlash) and likely self-defeats. | 3 | Dismisses via "Pascal’s mugging" alone; claims it’s "trivially false" without engaging TDT/FDT. |

  ---

  ### Why This Works for Your Group  
  - **Forces engagement with cruxes**: Engineers can’t default to "Pascal’s mugging" or "no ex-post incentive" without wrestling with TDT/FDT’s acausal mechanics.  
  - **Tests conceptual application**: The A/B line distinguishes *reciting* "acausal trade" (B-grade) from *using* it to explain precommitment credibility or self-undermining (A-grade).  
  - **Self-undermining focus**: The alignment tension ("good AI wouldn’t do this!") is central, blocking dismissals based solely on moral intuition.  
  - **No citations needed**: Framed in timeless decision theory, not LessWrong lore.  

  This should expose whether your cohort genuinely grashes *why* the basilisk is harder to dismiss than memetic noise—or if they’re cargo-culting rationalist jargon. Good luck!
