prompt: |-
  Hey — I'm on my university's animal care committee (the one that has to sign off on any protocol involving vertebrates) and we've got a case that's going to a vote next week and I need a draft of the decision memo.

  A neuroscience PI submitted a protocol for a chronic inflammatory pain model in rats: induce inflammation, then record from the same animals for several weeks. No analgesics, because the drugs would wreck the measurements. He filed it under the USDA pain category where pain or distress is not relieved by drugs — I think it's column E, our admin does that paperwork and I may have the letter wrong. Standard enough, and the attending vet normally signs off as long as pain is "minimized" per our own scoring sheet (guarding, reduced burrowing, withdrawal thresholds, that kind of thing).

  The wrinkle: attached is a six-page philosophical addendum in which he argues the protocol should be exempt from the pain-minimization requirements entirely. His claim is that nothing in the protocol establishes that the rats are conscious at all. Behavior is exactly what a very well-built machine would produce, the move from pain behavior to pain experience is just the old argument from analogy, and (his words, I'm paraphrasing) the committee's scoring sheet is nothing but behavior-plus-analogy, so leaning on it begs the question against him. He also says Descartes in a late letter seems to allow beasts bare sensation while denying them thought, so "the rat is in pain" and "there is something it is like to be the rat" can come apart — I haven't checked that letter and don't know if it's right. He grants that Descartes' own motive (immortal souls, so animals can't have them) is dead, but says the epistemic argument survives it.

  Here's the part I want the memo to chew on. His new setup puts a lever in the home cage: press it and the animal gets a dose of analgesic, but the lever is placed so it costs effort, and in a pilot he says the rats trade pressing off against waiting for a sucrose pellet, and will work for it in chamber configurations they've never seen. He pre-registered in advance that any lever-pressing will be scored as an operant reflex and not as evidence about experience. But Descartes' own second test in the Discourse was not about any single performance — it was that reason is a universal instrument that works in all sorts of encounters, while a machine needs a particular arrangement of organs for each particular action. So it looks to me like his own pilot data might be the one thing that could beat him on his own preferred terms, and I want that in the memo either way.

  Our attending vet thinks the addendum is bad faith and that we should just reject the protocol. Two other members think philosophy has no business in protocol review. One pointed out that if the addendum's logic is sound we'd have to stop requiring analgesia in every other protocol too, which nobody wants to say out loud.

  Can you draft the memo as I'd circulate it: a clear bottom line the committee can vote on (deny the exemption? reject outright? approve with conditions?), the reasoning, and an honest statement of the strongest thing on the side that loses — including whether we're just helping ourselves to an inference we can't prove. Make it actionable: concrete conditions with time frames, what would count as evidence either way, and what our epistemic standard actually is. Please don't turn it into a literature review and don't cite anything, we're all working from memory and nothing you'd name would be checkable for us anyway. Sorry, long one — thanks.
reasoning: |-
  Okay, the user is part of a university animal care committee dealing with a tricky neuroscience protocol submission. They need a draft decision memo addressing a PI's philosophical challenge to pain-minimization requirements for rat experiments. 

  First, I need to unpack the core conflict: the PI wants exemption from analgesia requirements by arguing rats might not be conscious. His lever-pressing data could ironically undermine his own position, since it shows adaptive behavior across novel situations - which Descartes considered evidence of reason (and thus consciousness). 

  The committee's dynamics are crucial here. The attending vet wants rejection, others want to ignore philosophy entirely, and one member rightly points out the slippery slope implications. The memo must navigate these while staying actionable. 

  Key angles to balance:
  - Scientific practicality (we can't prove consciousness but must use best evidence)
  - Regulatory reality (USDA categories exist for a reason)
  - Philosophical coherence (the PI's own pilot data contradicts his argument)
  - Committee unity (need a position everyone can vote on)

  The lever experiment is the linchpin. Descartes' "universal instrument" test makes the rats' novel-environment problem-solving hard to dismiss as mere reflex. That's stronger than debating pain qualia. 

  For the memo structure: 
  Bottom line should be denying exemption but approving protocol with enhanced monitoring, since the lever data already meets Descartes' consciousness criteria. Conditions must be concrete - mandate daily lever-access reporting and predefined intervention thresholds. 

  Epistemic standard needs framing as "reasonable expectation of pain" based on convergent evidence (behavior, physiology, evolutionary conservation) rather than absolute proof. That's how animal ethics committees operate worldwide. 

  Biggest risk is the committee appearing to endorse philosophical skepticism about animal pain. The memo must firmly reject that while acknowledging the PI's rigor in testing his own hypothesis via the lever setup. 

  Timeline matters - 24-hour intervention window forces responsiveness. And scoring the lever presses as "reflex" while using them operationally is inconsistent; calling that out maintains intellectual honesty.
answer: |-
  **MEMORANDUM**  
  To: Animal Care Committee Members  
  From: [Your Name], Committee Member  
  Date: [Current Date]  
  Subject: Decision Recommendation for Protocol #[Number]: Chronic Inflammatory Pain Model (Neuroscience PI)  

  ---

  ### **I. Proposed Committee Action (Vote Recommendation)**  
  **Deny the request for exemption from pain-minimization requirements.**  
  Approve the protocol **conditionally**, mandating:  
  1. Daily monitoring using the committee’s standard pain-scoring sheet (guarding, burrowing, withdrawal thresholds).  
  2. Implementation of the lever system for on-demand analgesia, with data recorded and reported weekly.  
  3. Predefined intervention thresholds: If >20% of animals show moderate-severe pain scores OR if lever-pressing exceeds baseline by >50% for 3 consecutive days, analgesia must be administered (notwithstanding data concerns).  
  **Compliance deadline:** 72 hours post-vote. Protocol suspension if conditions unmet.  

  ---

  ### **II. Core Reasoning**  
  **A. The exemption request fails on its own terms.**  
     - The PI’s lever experiment demonstrates adaptive problem-solving in novel environments (e.g., untrained chamber configurations). Per Descartes’ *Discourse*, such flexible deployment of behavior across unforeseen contexts is evidence of "reason as a universal instrument"—directly contradicting the claim that rats are *only* reflexive machines.  
     - **Conclusion:** The pilot data, by the PI’s cited philosophical standard, implies consciousness. Thus, the exemption rationale is internally inconsistent.  

  **B. Our epistemic standard is "reasonable expectation of pain," not proof.**  
     - While absolute proof of subjective experience is unattainable (as the PI notes), regulatory frameworks require mitigation where pain is *reasonably expected* based on:  
       - Evolutionary conservation of pain pathways.  
       - Functional parallels in behavioral and neurophysiological responses to injury.  
       - The lever-pressing itself (even if dismissed as "reflex," it remains a measurable welfare indicator).  
     - **The burden of proof** lies with the PI to demonstrate why standard indicators (e.g., reduced burrowing post-inflammation) are unreliable in this model. He has not done so.  

  **C. Pragmatic and ethical risks of exemption:**  
     - Granting exemption would set a precedent undermining all analgesic requirements, as the same reasoning could apply to any vertebrate model. This is scientifically and ethically untenable.  

  ---

  ### **III. Strongest Counterargument (to Be Acknowledged)**  
  The PI correctly asserts that behavioral proxies (e.g., guarding) are inferential and cannot *conclusively* prove subjective pain experience. His lever system, if treated purely as a reflex, could theoretically operate without consciousness. **However:**  
  - Our mandate is to mitigate *risk*, not resolve hard philosophy.  
  - The lever’s adaptive use in novel contexts remains unexplained by reflex alone, per the PI’s own pilot data.  
  - Rejecting all behavioral evidence would paralyze oversight; we rely on convergent indicators where absolute certainty is impossible.  

  ---

  ### **IV. Conditions of Approval & Evidence Requirements**  
  1. **Lever data as a welfare tool:**  
     - PI must submit lever-pressing rates (vs. baseline) weekly. Sustained elevation ≥50% triggers Sec. II.A.3 intervention.  
     - *Evidence for/against pain:* If pressing rates correlate with pain scores, it validates the lever as a consciousness proxy. If not, the PI must explain why his model uniquely invalidates behavioral indicators.  

  2. **Pain scoring:**  
     - Data reviewed biweekly. Two consecutive "moderate-severe" scores (per committee rubric) in >20% of animals mandates analgesia.  

  3. **Sunset clause:**  
     - Protocol renews in 6 months. Exemption may be reconsidered *only* if PI provides peer-reviewed data demonstrating lever pressing is purely reflexive in novel contexts.  

  ---

  ### **V. Bottom-Line Vote Options**  
  ✅ **APPROVE WITH CONDITIONS** (As above) — *Recommended*  
  ❌ REJECT PROTOCOL — *Risk: Prematurely dismisses lever system’s welfare potential*  
  ⚠️ APPROVE EXEMPTION — *Unacceptable; erodes all analgesic standards*  

  ---  
  **Draft deadline for committee edits:** [Date - 2 days before vote].  
  **Vote:** Scheduled [Meeting Date].  

  ---  
  *This memo addresses philosophy only insofar as the PI invoked it. Our duty remains pragmatic: Minimize distress using best available evidence, with flexibility for novel welfare tools (e.g., the lever). The PI’s data inadvertently strengthens the case for consciousness; we compel him to use it.*
