  2. Show a Condorcet cycle: consistent individuals producing an intransitive group ranking.
  3. Show a consistent group ranking that flips due to an irrelevant alternative (spoiler effect).
  4. A "design your own rule" round in teams, where they try to break each other's rules.
  5. Optional: Black-box "decision machine" (if time permits, but we might skip or adapt due to time constraints).

