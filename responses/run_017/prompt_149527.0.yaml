            First round: A:3, B:2, C:2 -> no majority. Eliminate C (lowest). Redistribute: the 2 C voters have C>A>B, so they go to A. Then A:3+2=5, B:2 -> A wins.

          Now add an irrelevant alternative D that everyone ranks last:

            Ballots:
              3: A>B>C>D
              2: B>C>A>D
              2: C>A>B>D

          Without D: same as above -> A wins.

          With D (using IRV):
            First round: A:3, B:2, C:2, D:0 -> eliminate D? Then same as without D -> A wins.

          We need a method that is not independent of irrelevant alternatives.

          Let's try Borda:

            Without D: 
              Points: 2 for first, 1 for second, 0 for third.
              A: 3*2 + 2*0 + 2*1 = 6+0+2=8
              B: 3*1 + 2*2 + 2*0 = 3+4+0=7
              C: 3*0 + 2*1 + 2*2 = 0+2+4=6
              A wins.

            With D (3 points for first, 2 for second, 1 for third, 0 for fourth):
              A: 3*3 + 2*0 + 2*2 = 9+0+4=13
              B: 3*2 + 2*3 + 2*0 = 6+6+0=12
              C: 3*1 + 2*2 + 2*3 = 3+4+6=13
              D: 0
              Now A and C tie at 13.

          So the presence of D changes the ranking between A and B? Now A and C are tied, but before A was ahead of B and C.

          This is messy.

     Given the complexity and time, we might skip this part and rely on the first activity to show the spoiler effect (which is a form of IIA failure) and focus on the cycle and the design round.

     Alternatively, we can use the first example we had with plurality and say: "In ranked voting, there can be a similar effect. For example, in a method called instant runoff, adding a candidate that no one ranks first can still change the winner." And then we can state the example without running it.

     But we want them to feel it. Given time constraints, we might have to cut this and move to the design round.

     Revised plan: Skip Activity 3 as a separate activity and incorporate the idea in the design round or debrief.

  V. Activity 4: Design Your Own Rule (20 minutes)
     - Split into small teams (3-4 teams of 3-5 people each).
     - Task: "Your team must invent a voting rule for ranking three options. Write the rule in plain English on an index card. The rule should take in ranked ballots (each ballot is a ranking of the options) and output a group ranking or a winner. Then, exchange rules with another team. You will try to break their rule by making up a set of ballots (also on index cards) that causes their rule to produce an outcome that seems unfair or violates one of our intuitions. We'll score: if you break a rule, you get a point. If your rule survives, you get a point. We'll do two rounds."

     - Possible rules they might invent:
          - Majority rule for the top choice: if one option has >50% first-place votes, it wins; else, do X.
          - Borda count.
          - Instant runoff.
          - Pairwise comparisons (and then if a cycle, break it somehow).

     - We expect that every rule will be broken. For example:
          - Majority rule: might have no majority, then what?
          - Borda: sensitive to irrelevant alternatives.
          - Instant runoff: can have a spoiler or fail monotonicity.
          - Pairwise: might cycle.

     - We'll have them try to break each other's rules.

     Steps:
          - Form teams (5 minutes)
          - Invent rule (5 minutes)
          - Exchange and try to break (5 minutes per round, two rounds: 10 minutes)

     Total: 20 minutes.

  VI. Black-box decision machine (if time permits, but we are at 5+15+20+20 = 60, plus intro and debrief, so we have 30 minutes? But we might run over. So we can skip or do as an extra.)

     Alternatively, we can run the machine as a whole-group activity for 10 minutes.

     How to run the machine:
          - The facilitator is the machine. The machine takes ranked ballots (each participant fills out a ranked ballot for the options) and outputs a group ranking.
          - The machine has a secret rule: it is a dictatorship. It always outputs the ranking of participant #7 (for example).
          - The group's job is to figure out the rule by submitting different sets of ballots and seeing the output.

     But with 15 people, how many trials? We can do:

          - First, everyone submits a ballot. The machine outputs the ranking of participant #7.
          - Then, they can change one ballot at a time? Or submit new sets.

     To save time, we might do only 2-3 trials.

     Steps:
          - "Now, let's try to figure out this black-box machine. I'll be the machine. You can give me any set of ranked ballots, and I'll output the group ranking. Your goal is to figure out my rule. Let's start with everyone submitting a ballot for three options: P, Q, R."

          - Collect the ballots, then announce the ranking of participant #7 (without revealing it's #7).

          - Then: "Now, you can change one ballot and resubmit, or change many. You have 3 attempts to guess the rule."

     This might take 10 minutes.

  VII. Debrief (10 minutes)
     - Recap what happened:
          - In the first vote, adding a fourth option changed the winner even though no one changed their mind about A vs B. (Condition 3: independence of irrelevant alternatives fails)
          - Then, we saw that the group can have a cycle even though every individual is consistent. (This is about the group rationality, not the method)
          - Then, in the design round, every rule they came up with had a flaw.

     - Then, introduce the four conditions (without Arrow's name) and map:

          (1) Unrestricted domain: anyone can rank however they like -> we allowed that.
          (2) Pareto efficiency: if everyone prefers X to Y, then the group should too -> we saw that in the cycle example, pairwise it might hold? But in the spoiler effect, it was violated? Actually in our examples, we didn't violate this. We'll have to state it as a condition they agree with.
          (3) Independence of irrelevant alternatives: the first activity showed a violation of this.
          (4) Non-dictatorship: the black-box machine was a dictatorship.

     - We didn't show a violation of Pareto in the activities, so we might have to state that one.

     - Then: "It turns out that no voting rule can satisfy all four of these at once. That's Arrow's Impossibility Theorem."

     - Finally, address the "voting is meaningless" claim: "This doesn't mean democracy is fake. It means there's no perfect voting rule. We have to choose which flaws we can live with. And that's a design choice."

     - Also, for the small sample: "Even though we had a small group, these paradoxes scale to any size and are inherent in the math."

     - For the coin flip: random methods are not deterministic and might violate Pareto or IIA in expectation? And rotating dictator is a dictatorship each time? But we can say: random methods have their own issues, like not being repeatable.

  Final Timeline:

  - 0-5 min: Intro and real decision context. Assign preference cards for Activity 1.
  - 5-20 min: Activity 1 (Plurality and spoiler effect)
  - 20-40 min: Activity 2 (Condorcet cycle)
  - 40-55 min: Activity 4 (Design your own rule) [skipping Activity 3 due to time and complexity]
  - 55-65 min: Black-box machine (if time, else skip)
  - 65-75 min: Design round results and transition to debrief
  - 75-85 min: Debrief (10 minutes)
  - 85-90 min: Wrap-up and next steps

  Materials:
  - Index cards for preferences (pre-written for Activities 1 and 2)
  - Index cards for ballots in the design round and machine.
  - Whiteboard and markers.

  What to say minimally:

  - In intro: "We're deciding snacks for next time. I've given you preference cards to make the voting patterns clear. Your card shows your ranking of the snacks. For the first vote, just tell me your top choice among A, B, C."
  - After Activity 1: "Notice that by adding D, which didn't win, the winner changed. But no one changed their mind between A and B."
  - After Activity 2: "Even though each of you has a clear ranking, the group as a whole has a cycle: A beats B, B beats C, C beats A. That's an inconsistency at the group level."
  - In design round: "Your task is to create a rule that takes ranked ballots and outputs a winner or ranking. Then, try to break another team's rule by finding a set of ballots that makes the rule produce an outcome that seems unfair."
  - In debrief: "We saw that adding an irrelevant option can change the outcome (IIA fails), the group can be intransitive, and every rule we invent has a flaw. It turns out that it's mathematically impossible to have a voting rule that satisfies four reasonable conditions at once: ... [list]."

  What might go wrong:

  - The group might not produce a cycle in Activity 2 if we use their real rankings. -> We are using assigned preferences, so it will work.
  - The design round might be too abstract. -> Keep it concrete with three options.
  - Someone says "let's flip a coin": Acknowledge that randomness avoids some issues but introduces others (like unpredictability and possible violation of Pareto if the coin chooses a dominated option).
  - Sample size: "These paradoxes are mathematical and happen in large groups too. We used a small group to see it quickly."
  - "Democracy is fake": "This shows that every voting rule has flaws, not that voting is meaningless. We have to choose the least bad rule for the context."

  What we cannot show:

  - The theorem holds for every possible set of ballots (we only showed examples).
  - The result assumes only rankings (not intensities) and that the rule must output a complete and transitive ranking.
  - We didn't cover all four conditions equally (Pareto was not violated in our activities).

  We'll have to state these in the debrief.

  Final design for 90 minutes:

  I. Introduction (5 minutes)
     - "Tonight we're making a real decision: the snack for our next meeting. But we're going to experiment with different voting methods. To make sure we see how voting methods can behave, I've assigned each of you a preference card. It shows your personal ranking of the snack options. Please keep this card for the entire session; it represents your preferences."
     - Options: A (Chips), B (Fruit), C (Cookies), and later D (Veggies).
     - "First, we'll do a simple vote: with only A, B, C available, write your top choice on an index card and pass it in."

  II. Activity 1: Plurality and Spoiler Effect (15 minutes)
     - Hand out pre-assigned preference cards (designed to show the spoiler effect, as in the example with 4 groups: 3,2,2 with the last group split if needed, but we prepared for 12).
     - First vote: plurality on A, B, C. Tally and announce: A wins.
     - "Now, we're adding D (Veggies). Vote again by plurality, with A, B, C, D. Write your top choice on a new card and pass it in."
     - Tally: B wins.
     - "Notice: the winner changed from A to B. But did anyone change their mind about A versus B? (No, because your preferences are fixed by the card.) The only change was adding D, which didn't win. This is called the spoiler effect."

  III. Activity 2: Condorcet Cycle (20 minutes)
     - "Now, let's try a different method: pairwise comparisons. We'll see what the group thinks in head-to-head matchups."
     - Use new assigned preferences for a cycle (e.g., 4 groups of 3 with the cycle rankings).
     - "For each pair, we'll vote by show of hands. How many prefer A over B? ... etc."
     - Record the pairwise results on the whiteboard.
     - Show the cycle: A>B, B>C, C>A.
     - "So the group says A is better than B, B is better than C, and C is better than A. That's a circle. But each of you has a straight ranking. The group as a whole is inconsistent."

  IV. Activity 4: Design Your Own Rule (25 minutes)
     - Split into teams of 3-4. (5 minutes to form teams and explain)
     - Task: (5 minutes) "Invent a voting rule for three options (call them X, Y, Z) that takes ranked ballots and outputs a winner or a ranking. Write the rule clearly on an index card."
     - Exchange rules with another team. (10 minutes for two rounds)
          - Round 1: Each team gets another team's rule and has 3 minutes to create a set of ballots (on index cards, one per voter) that they think will break the rule. They submit the ballots to the rule-making team, who applies the rule and announces the outcome. If the outcome seems unfair (e.g., a candidate that everyone prefers loses, or the rule produces a cycle, or the winner changes when a loser is removed), then the rule is broken. The attacking team explains why it's broken.
          - Round 2: Rotate rules and try again.
     - Keep score: a point for each broken rule.

  V. Debrief (25 minutes)
     - Start with observations from the design round: "What happened? Was any rule unbreakable? What kinds of flaws did you see?"
     - Then, recap the conditions we care about (without the theorem's name):
          (1) "We want to allow any ranking." (Unrestricted domain)
          (2) "If everyone prefers X to Y, then the group should too." (Pareto efficiency) -> we didn't violate this, but it's intuitive.
          (3) "The group's choice between X and Y should not depend on how they rank some other option Z." (Independence of irrelevant alternatives) -> we saw this fail in Activity 1 and possibly in the design round.
          (4) "No one person should always decide." (Non-dictatorship) -> we might have seen rules that are dictatorial in the design round? Or not.
     - "It turns out that no voting rule can satisfy all four of these at the same time. This is a famous result called Arrow's Impossibility Theorem."
     - Address concerns:
          - "Does this mean voting is meaningless? No, it means we have to choose which flaws we can live with. Every voting rule has strengths and weaknesses."
          - "What about flipping a coin? Randomness can avoid some issues but introduces others, like not being repeatable and sometimes ignoring strong preferences."
          - "Small sample? These are mathematical truths; they happen in any size group."
     - Conclude: "The takeaway is that designing a fair voting system requires trade-offs. There's no perfect system, but understanding the trade-offs helps us choose better."

  Note: The black-box machine is skipped due to time. If there's extra time, it can be done as a quick demo.

  This is a packed 90 minutes. If running long, cut the design round to one round or reduce time in debrief.

  Let me know if you need the preference card details or further adjustments.
answer: |-
  Here’s a practical, activity-based design for your 90-minute session. It focuses on **experiential learning** with minimal lecturing, using the snack decision (e.g., "What snack should we have next month?") as the real-stakes hook. Participants will encounter Arrow’s conditions through guided discovery.  

  ---

  ### **Materials & Setup**  
  - **Whiteboard:** Pre-write 3 snack options (e.g., A: Chips, B: Fruit, C: Cookies).  
  - **Index cards:** 30+ blank cards for ballots and rule-writing.  
  - **Sticky notes:** For teams to post rules during the design round.  
  - **Pre-assigned preference cards (crucial):** Create 15 cards with fixed rankings (see below) to ensure paradoxes occur. Phrase it as: *"To save time, I’ve given you ‘preference cards’ – these are your personal snack rankings for all activities. Treat them as your true preferences."*  
  - **Hidden fourth option:** D: Veggies (revealed mid-activity).  

  ---

  ### **Timeline (90 Minutes Total)**  
  **Goal:** Avoid lectures. Let paradoxes emerge from activities.  

  #### **I. Intro & First Vote (5 min)**  
  - **Say only:** *“We’ll decide next month’s snack today using different voting methods. First: vote for ONE option you want most. Write its letter (A, B, or C) on a card and pass it to me.”*  
  - **Tally publicly** on the whiteboard using **plurality** (most first-place votes wins). *Example outcome: A wins (e.g., A:6, B:5, C:4).*  

  #### **II. Spoiler Effect (15 min)**  
  - **Reveal D:** *“I forgot an option! D: Veggies is available. Re-vote with A, B, C, D. Again, pick ONE.”*  
  - **Use pre-assigned preferences** (12–18 voters):  
    - Group 1 (5 voters): D > A > B > C → **Votes A** (if D unavailable).  
    - Group 2 (4 voters): B > C > D > A → **Votes B**.  
    - Group 3 (3 voters): C > B > D > A → **Votes C**.  
    - **First tally (A,B,C):** A wins (5-4-3).  
    - **Second tally (A,B,C,D):** Group 1 splits (3 vote D, 2 vote A). Outcome: **B wins** (B:4, D:3, A:2, C:3).  
  - **Prompt:** *“The winner flipped from A to B. Did anyone change their mind about A vs. B?* [No] *Why did adding D change the outcome?”*  
  - **Key moment:** Let them articulate *“D stole votes from A”* or *“the method is flawed.”* Write *“Spoiler Effect”* on the board.  

  #### **III. Condorcet Cycle (20 min)**  
  - **Shift to rankings:** *“Now, rank all options (1st, 2nd, 3rd) on a new card.”*  
  - **Use new pre-assigned preferences** for a cycle:  
    - Group 1 (6 voters): A > B > C  
    - Group 2 (5 voters): B > C > A  
    - Group 3 (4 voters): C > A > B  
  - **Pairwise comparisons:**  
    - *“Who prefers A over B? Raise hands.”* Tally: A beats B (10–5).  
    - *“B over C?”* B beats C (11–4).  
    - *“C over A?”* C beats A (9–6).  
  - **Reveal the cycle:** A>B, B>C, C>A. *“The group says A beats B, B beats C, but C beats A. Is that rational?”*  
  - **Distinguish:** *“Each of you had consistent rankings. Is this the group being irrational, or the method causing problems?”*  

  #### **IV. Design-Your-Own-Rule Round (25 min)**  
  - **Split into 3–4 teams.** Task: *“Invent a fair voting rule for 3 options. Write it in plain English on a sticky note. Rules must use rankings only (no ‘rate 0-10’).”*  
  - **Examples they might create:**  
    - *“Pick the option with the most 1st-place votes.”* (Plurality)  
    - *“Award 2 points for 1st, 1 for 2nd, 0 for 3rd. Highest score wins.”* (Borda)  
    - *“Eliminate the option with the fewest 1st-place votes, redistribute votes, repeat.”* (IRV)  
  - **Attack phase (10 min):** Teams swap rules. Goal: *“Break the rule by creating 3–5 example ballots where the outcome seems unfair.”*  
    - **Scoring:** Attacking team gets 1 point if they break a rule (e.g., spoiler, cycle, or violates unanimity).  
  - **Debrief attacks (5 min):** *“Which rules were broken? How?”*  

  #### **V. Black-Box Decision Machine (15 min - Optional but Recommended)**  
  - **Setup:** You (facilitator) are the “machine.” Secret rule: **You always output the #1 ranking of Participant 7** (or a pre-chosen volunteer).  
  - **Task:** *“Hand me any set of ranked ballots. I’ll output the group ranking. Your goal: guess my rule in ≤3 tries.”*  
  - **How to run efficiently:**  
    1. First try: All submit real ballots (e.g., from Cycle activity). Announce Participant 7’s ranking.  
    2. Second try: Teams suggest a new set (e.g., *“All rank B first”*). Output Participant 7’s ranking (even if it defies the group).  
    3. Third try: Let them test dictatorship (e.g., *“Change only Participant 7’s ballot”*).  
  - **Reveal:** After 3 tries, confess the dictator rule. *“Did this feel fair? Why or why not?”*  

  #### **VI. Debrief (10 min)**  
  - **Map activities to Arrow’s conditions:**  
    | **Condition** | **Activity That Exposed It** | **Prompt to Participants** |  
    |---------------|------------------------------|----------------------------|  
    | (1) Any ranking allowed | Design Round | *“Did any rule ignore someone’s ballot? Why is that bad?”* |  
    | (2) Unanimity wins | Spoiler Effect | *“In the first vote, if everyone preferred A>B, should A win? Did we violate that?”* |  
    | (3) No spoilers | Spoiler Effect | *“When D was added, did it change A vs. B? Should it?”* |  
    | (4) No dictator | Black-Box Machine | *“What if one person always decided? Is that acceptable?”* |  
  - **Key conclusion:** *“No voting rule gives you all four. We have to choose which flaws to live with.”*  
  - **Address predictable comments:**  
    - *“Democracy is fake!”* → *“No—voting isn’t meaningless, but all rules have trade-offs. We get to choose which trade-offs our community accepts.”*  
    - *“Flip a coin / random dictator”* → *“Randomness avoids some issues but creates new ones (e.g., ignores preferences, unstable outcomes).”*  
    - *“Small sample size!”* → *“These paradoxes are mathematical—they scale to any group size. We used a small group to see them quickly.”*  
  - **End:** *“Next month, we’ll use YOUR winning rule to pick snacks!”* (Reinforce real stakes).  

  ---

  ### **What You Can Say (Minimal Script)**  
  - **Intro (5 min):** *“Snacks are real—we’ll order what you pick. Use your preference cards as your true rankings.”*  
  - **During activities:** Only give instructions (*“Vote now,” “Rank these,” “Attack this rule”*) and ask Socratic questions (*“Why did this happen?” “Is this fair?”*).  
  - **Debrief:** Use the prompts above. **Never say “Arrow” or “impossibility” until the final 2 minutes.**  

  ### **What Will Go Wrong (and Solutions)**  
  - **“Just add score voting!”**: When teams suggest ratings (0–10), say: *“That changes the input to scores, not rankings. Can we design a rule using only rankings?”*  
  - **Chaos in design round:** Assign a timekeeper. After 5 minutes, say: *“Pick your best rule now.”*  
  - **Black-box takes too long:** Cap at 3 inputs. If unsolved, reveal early and discuss.  
  - **No cycles in real ballots?** Use pre-assigned preferences—they guarantee paradoxes.  

  ### **What the Activity Can’t Show (State These in Debrief)**  
  - *“This happens for ANY voting rule, not just the ones we tried.”*  
  - *“We assumed rankings only (no ‘strength of feeling’). If we allowed scores, we’d face new trade-offs.”*  
  - *“Paradoxes exist no matter how large the group is—they’re baked into the math.”*  

  ---  
  **Why this works:** It forces participants to *feel* the paradoxes (spoilers, cycles, dictators) through tangible stakes and collaborative problem-solving. The design round exposes trade-offs, and the black-box machine makes dictatorship visceral. You’ll spend 80% time on activities, 20% on guided reflection—keeping non-specialists engaged and arriving at the "no free lunch" insight naturally.
