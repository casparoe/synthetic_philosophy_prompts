answer: |-
  Your "cooperative inertia" phenomenon is a fascinating case study that sharply contrasts the explanatory lenses of rational choice theory (RCT) and evolutionary game theory (EGT). Let's dissect the comparison point by point, addressing your specific queries.

  ### 1. **Stable Outcomes: Same Question, Divergent Notions?**
      *   **Rational Choice Theory (RCT):** RCT asks: "What strategies constitute a Nash equilibrium (NE) in the *infinitely* repeated PD?" The Folk Theorem provides the answer: **Any feasible payoff vector above the mutual defection payoff can be sustained by some NE strategy profile,** provided the discount factor (δ) is sufficiently high. Crucially:
          *   Mutual Cooperation (C,C) sustained by strategies like Tit-for-Tat (TFT) or Grim Trigger *is* a strict NE (if δ > threshold). It's stable because unilateral deviation *by a rational agent anticipating the future* is unprofitable.
          *   Mutual Defection (D,D) is *always* a NE, but it's only a *strict* NE in the one-shot game. In the repeated game with high δ, (D,D) is weak – a player could deviate to C and potentially trigger cooperation if the opponent uses a reciprocal strategy, but deviating while others play D yields no gain.
          *   **Divergence:** RCT treats the one-shot and repeated games as fundamentally different strategic scenarios. The one-shot has a unique, strict NE (D,D). The repeated game has a vast multiplicity of NEs, including (C,C) sustained by conditional strategies. Stability here is defined purely in terms of *incentive compatibility*: no player has a *profitable unilateral deviation* given the strategy profile and the expectation of future play.
      *   **Evolutionary Game Theory (EGT):** EGT asks: "What strategy frequencies are dynamically stable under evolutionary pressures (selection, mutation) in a *population* playing the game?" Key concepts:
          *   **Evolutionarily Stable Strategy (ESS):** A strategy resistant to invasion by a small fraction of mutants. In the one-shot PD, Defection (ALLD) is the only ESS. In the repeated PD, TFT can be an ESS against ALLD *if* δ is high enough (invader gets punished repeatedly).
          *   **Stochastic Stability:** In finite populations with rare mutations (like your sim), this identifies states (strategy distributions) most resilient to *sequences* of mutations followed by selection. It often favors "risk-dominant" or "Pareto-efficient" equilibria.
          *   **Divergence:** EGT *unifies* the one-shot and repeated games through the lens of dynamics. The one-shot game has a single, globally attractive rest point (ALLD). The repeated game, with sufficient δ, becomes a **multi-stable system**. Both ALLD and a cooperative state (e.g., dominated by TFT-like strategies) are locally stable attractors. The basin of attraction for cooperation grows with δ. Stability here is defined in terms of *dynamic resilience*: resistance to invasion (ESS) or resistance to perturbation via mutation/selection paths (Stochastic Stability).
      *   **Answering the Same Question?** They answer related but distinct questions. RCT asks "What are the self-enforcing agreements/rational plans?" EGT asks "What states will a population of adaptive agents (not necessarily hyper-rational) converge to and maintain under evolutionary pressures?" Both identify (C,C) as a potential stable outcome in the repeated game (under conditions) and (D,D) as the only stable outcome in the one-shot game, but define "stable outcome" differently (equilibrium profile vs. population state) and derive stability from different mechanisms (incentive compatibility vs. dynamic resilience).

  ### 2. **Representing Path Dependence and Slow Decay**
      *   **Rational Choice Theory (RCT):** **Struggles inherently.** RCT is fundamentally static and equilibrium-focused. It identifies *potential* stable points (NEs) but says little about *how* players arrive at one equilibrium rather than another, or *how long* it takes to move between them after a parameter change (like lowering δ). Path dependence and slow decay are outside its core explanatory scope.
          *   *Requires Importing Machinery:* To address inertia, RCT must bolt on auxiliary theories:
              *   **Equilibrium Selection:** Concepts like "focal points" or "risk dominance" (Harsanyi & Selten) *might* suggest why cooperation persists initially, but don't inherently model the *rate* of decay.
              *   **Learning Dynamics:** Incorporating models of how rational agents learn/believe (e.g., fictitious play, reinforcement learning) *can* generate path dependence and slow transitions. However, this moves RCT firmly into the domain of dynamics, borrowing heavily from EGT concepts. The core RCT framework of NE and best responses lacks temporal dynamics.
      *   **Evolutionary Game Theory (EGT):** **Embodies Path Dependence Naturally.** EGT is intrinsically dynamic. Your phenomenon is its bread and butter:
          *   **Basins of Attraction:** When δ is high, the cooperative state (e.g., high frequency of TFT) has a very large basin of attraction. Populations within this basin are pulled strongly towards cooperation.
          *   **Lowering δ:** Reducing δ shrinks the basin of attraction for cooperation and enlarges the basin for defection. Crucially, it does *not* instantly teleport the population state to the defection basin. The population is still *within* the (now shrunken) cooperation basin.
          *   **Slow Decay (Inertia):** Moving from deep inside the cooperation basin to the defection basin requires stochastic events (mutations, errors) to push the population over the "ridge" separating the basins. The *depth* of the basin matters:
              *   After long cooperation (high δ history), the population is likely deep within the cooperation basin. The "distance" (in strategy frequency space) to the boundary of the cooperation basin is large. Many correlated mutations or errors are needed to push it out. Decay is slow.
              *   If δ was barely above threshold, the population was near the boundary. Fewer mutations/errors are needed to push it into the defection basin. Decay is faster.
          *   **Stochastic Stability & Mutation Thresholds:** Finite populations and rare mutations formalize this. The cooperative state may still be stochastically stable even below the deterministic δ threshold, but the *expected time* to transition to defection increases dramatically the larger the basin was (i.e., the higher δ was historically) before δ was lowered. Your "history matters" observation is a direct consequence of basin structure shaped by past δ.

  ### 3. **Cooperative Inertia: Artifact or Feature?**
      *   **Rational Choice Theory (RCT):** From a strict RCT perspective focused solely on equilibrium, **inertia might be seen as an artifact** of non-equilibrium dynamics or "irrational" persistence. Once δ drops below the threshold, (C,C) sustained by TFT/Grim is *no longer a NE*. A rational player *should* defect immediately, anticipating others might do the same. The persistence of cooperation represents a failure to instantly re-coordinate on a new equilibrium (likely (D,D)), which RCT doesn't model well. RCT might attribute it to learning lags or belief inertia, seen as auxiliary factors.
      *   **Evolutionary Game Theory (EGT):** EGT **views inertia as a fundamental feature** of the dynamic system, inherent to populations evolving under selection and mutation in a landscape with multiple attractors. The slow decay is predicted by the theory of basin transitions under stochastic perturbations.
      *   **Distinguishing in Simulation:** To test if inertia is a core feature (EGT view) or an artifact of specific implementation (e.g., slow learning in an RCT-adjacent model):
          1.  **Vary Mutation/Error Rate (μ):** EGT predicts inertia strength is highly sensitive to μ. Lower μ → dramatically slower decay (fewer perturbations to push out of the deep basin). Higher μ → faster decay. If inertia persists strongly even at very low μ (except taking impractically long to observe), it supports the EGT basin depth argument. If inertia vanishes quickly as μ decreases, it might point to other mechanisms.
          2.  **Vary Population Size (N):** EGT (especially with stochastic stability) predicts transition times scale with population size. Larger N → slower decay (more "inertia") after high-δ history, as more correlated mutations are needed to shift the population mean. Smaller N → faster decay. Lack of sensitivity to N might suggest other dynamics dominate.
          3.  **Introduce Sophisticated Agents:** Add a small fraction of agents using "best response to current population" (myopic or with foresight). EGT predicts this could *accelerate* decay after δ drop, as these agents quickly switch to D, acting as catalysts. If inertia persists despite these agents, it strengthens the EGT view of a deep basin. If decay accelerates markedly, it suggests learning/coordination dynamics (closer to RCT concerns) are significant.
          4.  **Track Basin Size/Depth:** Estimate the size of the cooperation basin *at the new lower δ* (e.g., by initializing populations at many different strategy distributions and seeing which converge to C vs D without mutation). EGT predicts the decay rate correlates strongly with this estimated basin size relative to the population's current state.

  ### Synthesis: Rivals or Complementary? Real Explanatory Work
  *   **Rivals or Complementary?** They are **largely complementary, pitched at different levels of analysis:**
      *   **RCT** provides the *strategic logic*: it identifies the set of *potential* stable outcomes (NEs) and explains *why* they are self-enforcing (incentive compatibility). It answers "What *could* rational agents sustain?"
      *   **EGT** provides the *population dynamics*: it explains *how* a population of adaptive agents (driven by selection, imitation, mutation) might *actually arrive* at one of those potential outcomes, *which* one it likely arrives at, *how stable* it is to perturbations, and *how it transitions* between states when parameters change. It answers "What *will* likely emerge and persist in an evolving population?"
      RCT explains the existence of the cooperative equilibrium possibility; EGT explains its emergence, persistence, robustness, and the inertia you observe.
  *   **Real Explanatory Work in Your Case:** For the phenomenon of "cooperative inertia" – the slow decay of cooperation after a reduction in δ below the theoretical threshold – **the real explanatory work is being done by the evolutionary dynamics framework.** The key insights come from:
      *   The **multi-stable nature** of the repeated PD under evolutionary dynamics (multiple attractors).
      *   The concept of **basins of attraction** whose size depends on δ.
      *   The **path dependence** inherent in the population's location within a basin shaped by history.
      *   The **stochastic dynamics** (mutation, error, finite populations) governing the rate of transition *between* basins.
      *   The sensitivity to parameters like **mutation rate and population size**.

  While RCT provides the essential backdrop by defining the payoffs and the strategic structure that *allows* for cooperative equilibria when δ is high, it lacks the dynamical machinery to explain the persistence of cooperation *after* δ falls below the incentive compatibility threshold. The inertia is not about rational actors failing to re-coordinate instantly; it's about a population state trapped in the vestigial gravitational well of a shrunken but still deep basin of attraction, requiring stochastic forces to push it over the ridge into the domain of defection. This is quintessentially an evolutionary dynamic phenomenon, beautifully captured by your simulation.

  Your background in physiological ecology of disturbed communities likely makes the concepts of resilience, hysteresis, and slow state transitions feel deeply familiar – EGT provides the formal game-theoretic language for these phenomena in the context of social evolution. The inertia you observe isn't an artifact; it's a signature of the complex dynamical landscape governing cooperation.
