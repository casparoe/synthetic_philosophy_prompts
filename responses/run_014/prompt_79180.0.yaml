  When analyzing move by move, I'll need to be fair but critical. Miguel makes a strong point in Move 2 about all theories requiring reflection, but Dana correctly responds that it's about what the thought concerns (the relationship vs total utility). Miguel's distinction between criterion and decision procedure in Move 4 is valid but doesn't fully address Dana's worry about alienation. Dana's final move about the source of demands being external is particularly compelling.

