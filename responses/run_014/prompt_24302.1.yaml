prompt: |-
  I've been going in circles on indicative vs. counterfactual conditionals and I think I've got the standard picture wrong somewhere. My understanding is: the counterfactual "if it had rained yesterday, the streets would be wet" gets the Lewis-Stalnaker closest-worlds treatment, but the indicative "if it rained yesterday, the streets are wet" is just a material conditional, so it's automaticly true on any day it didn't rain, and the whole difference is that counterfactuals use possible worlds to dodge the paradoxes of material implication while indicatives just eat the truth table. But then "if it rained yesterday, the streets are wet" being true on a dry day just feels wrong to me, so I can't be getting this right. So wich is the real story — is the indicative really the material conditional, or is there a different semantics, and where does the real difference between the two kinds live? Give me exactly five numbered points, each a sentence or two, no intro or conclusion.
reasoning: |-
