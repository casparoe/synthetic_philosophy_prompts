answer: |-
  Here’s a practical, time-constrained procedure for your writers to detect and mitigate Whig history in exhibit copy, followed by analysis of your three drafts. The procedure focuses on **detectable textual patterns** and **actionable fixes**, with clear escalation points.

  ---

  ### **The 10-Minute Anti-Whig Procedure**  
  *(Per Label, Non-Specialist Friendly)*  
  **Key Principle:** History is about understanding past actors *on their own terms*; avoid framing the past as a teleological journey to the present.

  #### **Step 1: Scan for Foreshadowing Language (Mechanical Test)**  
  - **Question:** Does the text imply past actors knew or *should have known* the "right" outcome?  
  - **Red Flags:**  
    - "Pioneering step toward...", "laid the groundwork for...", "set the stage for...", "led inevitably to...", "foreshadowed...", "would later become...".  
    - Words like "triumph," "failure," "progress," "regression" **without immediate context**.  
  - **Action:**  
    - **Fixable:** Replace with *contemporary* stakes. Instead of "led to," use "contributed to" or "influenced."  
    - **Escalate:** If the label’s core thesis relies on hindsight (e.g., "This protest failed but inspired future movements").  

  #### **Step 2: Check for Present-Centered Moral Judgment (Judgment Call)**  
  - **Question:** Are past events judged *solely* by modern values?  
  - **Red Flags:**  
    - Moral labels ("horror," "triumph") without explaining *why* contemporaries saw it that way.  
    - Equating "different" with "worse" or "backward."  
  - **Action:**  
    - **Fixable:** Add contemporaneous perspective. *Instead of:* "Child labor was a horror." *Try:* "Reformers decried mill conditions as immoral; owners argued it was economically necessary."  
    - **Escalate:** If the event’s ethical dimension is non-negotiable (e.g., slavery) – but *still* contextualize.  

  #### **Step 3: Hunt for "Inevitable Arc" Framing (Mechanical Test)**  
  - **Question:** Is change presented as linear, deterministic, or winner-takes-all?  
  - **Red Flags:**  
    - "Could not survive," "was destined to," "the only logical outcome."  
    - Treating historical losers as "obstacles" or "on the wrong side of history."  
  - **Action:**  
    - **Fixable:** Insert contingency. Add phrases like "at the time," "unforeseen," or "debated alternatives."  
    - **Escalate:** If the label ignores viable historical alternatives (e.g., "Industrialization was inevitable" vs. "Luddites proposed...").  

  #### **Step 4: Verify Contextual Stakes (Judgment Call)**  
  - **Question:** Does the text explain *why* this mattered *then*, not just *now*?  
  - **Red Flags:**  
    - "We take for granted today," "legacy lives on," "the first of many."  
    - Outcomes framed exclusively as "steps" to the present.  
  - **Action:**  
    - **Fixable:** Shift focus to *contemporary* significance. "Pioneering step..." → "This campaign reduced infant mortality by 30% in two years."  
    - **Escalate:** If the event’s *primary* historical significance is genuinely its long-term impact.  

  #### **Where It Ends:**  
  - **✓** If all tests pass or yield easy fixes → Rewrite and approve.  
  - **↻** If 2+ tests trigger complex judgment calls → Escalate to curator with specific questions (e.g., "What alternatives existed to mill closures?").  
  - **✗** If the label’s core narrative is Whig → Full rewrite needed (escalate).  

  ---

  ### **Analysis of Your Drafts**  
  **1. Textile Mills Label**  
  > *"The industry that built this city could not survive the modern economy, but its legacy lives on in the thriving arts district it made possible."*  
  - **Step 1:** "Could not survive" (inevitability) + "legacy lives on" (foreshadowing).  
  - **Step 3:** Frames closure as deterministic; ignores labor/community trauma.  
  - **Step 4:** No *contemporary* stakes (e.g., unemployment, town identity crisis).  
  - **Verdict:** **Fixable with rewrite.**  
    - **Rewrite:** *"Global competition and automation shuttered most mills by 1970, costing thousands of jobs. Vacant factories later attracted artists seeking cheap studios, spurring today’s arts district."*  
    *(Why better: "Shuttered" replaces "could not survive"; adds human cost; separates cause/effect from "legacy.")*  

  **2. Pasteurization Label**  
  > *"A pioneering step toward the public-health protections we take for granted today."*  
  - **Step 1:** "Pioneering step toward" (foreshadowing).  
  - **Step 4:** "We take for granted today" (present-centered).  
  - **Verdict:** **Fixable with rewrite.**  
    - **Rewrite:** *"This 1908 campaign cut infant deaths by 40% in one year by making milk safer – a radical shift from laissez-faire attitudes toward government health intervention."*  
    *(Why better: Uses contemporary metrics; explains *why* it was radical then.)*  

  **3. Then-and-Now Timeline Wall**  
  > *Pairs 1890s photos of street corners with 2020s equivalents.*  
  - **Problem:** Visual juxtaposition *implies* progress unless explicitly countered.  
  - **Step 3:** Absent text, visitors infer "then = primitive, now = better."  
  - **Step 4:** No context for losses (e.g., community ties, architectural heritage).  
  - **Verdict:** **Structural Whig history – needs intervention.**  
    - **You won’t like this:** The *format* telegraphs "progress" even with neutral captions. Visitors spend seconds per image; the pairing cues "look how far we’ve come."  
    - **Solution:** Add *disruptors*:  
      - A panel questioning "What did 'progress' cost?" (e.g., displaced communities).  
      - A third column: "Alternate Futures" (e.g., 1910 plans for trolleys, green spaces).  
      - Captions highlighting *contested* change: *"1890: Bustling immigrant enclave. 2020: Tech offices. Many families were displaced by 1960s 'renewal.'"*  

  ---

  ### **What the Procedure Cannot Fix**  
  1. **Exhibit-Level Whig Narratives:**  
     - If objects are selected only for their role in "leading to" the present (e.g., excluding failed technologies).  
     - If the physical layout implies a "path" to modernity (e.g., chronological rooms ending with "Today").  
  2. **Silences:**  
     - Missing perspectives (e.g., mills framed as "economic evolution," not worker exploitation).  
     - Omitting alternatives (e.g., not showing 1908 anti-pasteurization arguments).  
  3. **Visitor Routing:**  
     - A "timeline tunnel" physically marching visitors toward "now."  
     - Fundraising rhetoric ("Support us to build on our glorious past!").  

  ---

  ### **Key Takeaways**  
  - **Whig history isn’t about moral language**; it’s about **hindsight determinism**. Saying "child labor was brutal" is fine *if* you show contemporaries fought it.  
  - **Contingency saves you**: Add "however," "debated," "unintended," "some argued."  
  - **Your timeline wall** can survive with added friction – but it *is* Whig-by-default without explicit critique of "progress."  
  - **Empower writers**: When they escalate, ask curators: *"What did people at the time fear/hope? What alternatives existed?"*  

  This procedure won’t catch everything – but it’s a scalable antibody against the most virulent Whig wording. The rest is curation.
