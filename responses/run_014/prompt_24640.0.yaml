prompt: |-
  I cover science and ideas and need a standard for evaluating accuracy-first epistemology, the view that accuracy is the fundamental epistemic value. Write the desiderata an adequate epistemic utility theory must satisfy if it is to adjudicate that view, with particular attention to imprecise credences, incommensurable propositions, and the absence of practical stakes. For each item, state the requirement, the case or consideration that motivates it, and whether it is non-negotiable or contestable. Return exactly five numbered items, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Okay, the user wants me to create desiderata for evaluating accuracy-first epistemology, focusing on imprecise credences, incommensurable propositions, and absence of practical stakes. They need exactly five numbered items without introduction or conclusion.

  I need to understand what accuracy-first epistemology entails - it's the view that accuracy is the fundamental epistemic value. The user covers science and ideas, so they're likely looking for rigorous philosophical standards. They specifically mention three challenging areas: imprecise credences (where agents have ranges rather than precise probabilities), incommensurable propositions (that can't be easily compared), and situations without practical stakes (purely epistemic contexts).

  For each desideratum, I must include: the requirement, the motivating case, and whether it's non-negotiable or contestable. The response should be concise - one or two sentences per item.

  Let me brainstorm the key requirements:
  First, I should address how the theory handles imprecise credences since they challenge traditional accuracy measures. The theory needs to explain why sharp credences are epistemically superior without invoking practical concerns - this seems non-negotiable for consistency.

  Second, for incommensurable propositions (like different scientific theories), the theory must show how accuracy comparisons are possible. This is crucial for real-world science coverage but might be contestable depending on how we define accuracy.

  Third, regarding absence of stakes, the theory must justify truth-seeking as valuable in itself. This is fundamental to accuracy-first epistemology and thus non-negotiable.

  Fourth, I should include a requirement about the uniqueness of accuracy as the core value - other values must be derivative. This is central to the view but could be contestable to those who value understanding or other epistemic goods.

  Finally, the theory should provide decision rules for epistemic actions like gathering evidence, purely based on accuracy. This bridges theory and practice in science contexts and is likely non-negotiable for applicability.

  I'll structure each item as: 1) Requirement statement, 2) Motivating case with specific examples, 3) Classification as non-negotiable/contestable. I'll keep each to one or two tight sentences as requested.
answer: |-
  1. **Requirement:** The theory must justify why precise credences are epistemically superior to imprecise ones solely based on accuracy considerations. **Motivation:** Imprecise credences (e.g., assigning a range like [0.3, 0.7]) avoid precise inaccuracy but seem less committal; the theory needs to explain this deficiency without invoking risk-aversion or practical stakes. **Status:** Non-negotiable for a pure accuracy-first view.
  2. **Requirement:** It must provide a framework for comparing the accuracy of credal states across logically independent or incommensurable propositions (e.g., different scientific theories). **Motivation:** Agents often hold credences over disparate domains; the theory needs a unified accuracy measure to adjudicate overall epistemic state quality in such cases. **Status:** Non-negotiable for broad applicability.
  3. **Requirement:** The theory must validate accuracy as intrinsically valuable and sufficient for guiding epistemic rationality even when beliefs have no practical consequences. **Motivation:** In purely theoretical inquiry (e.g., cosmology), accuracy must drive rational belief formation without needing instrumental justification from practical stakes. **Status:** Non-negotiable for accuracy-first foundations.
  4. **Requirement:** It must demonstrate that all other putative epistemic values (e.g., understanding, coherence) are either reducible to accuracy or derivative from it. **Motivation:** To uphold accuracy as fundamental, the theory must show why valuing, say, explanatory coherence isn't an independent basic epistemic good requiring separate justification. **Status:** Contestable, as critics argue for irreducible pluralism.
  5. **Requirement:** The theory must generate unique, stake-invariant prescriptions for epistemic actions (e.g., evidence gathering) based solely on expected accuracy gains. **Motivation:** Rational inquiry (e.g., choosing experiments) should depend only on potential for truth approximation, not personal costs/benefits, especially in pure science contexts. **Status:** Contestable, as some argue stakes can permissibly influence inquiry.
