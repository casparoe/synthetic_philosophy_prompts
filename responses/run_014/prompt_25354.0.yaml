  The core conflict revolves around points 2 and 3. The epistemic deference principle (point 2) seems to demand restraint in unilateral actions, while the moral necessity of whistleblowing (point 3) sometimes requires precisely such unilateralism. The user's insight about structural parallels (point 4) makes this particularly thorny. I should acknowledge their sharp observation that information disclosure qualifies as unilateral action (point 6) - many miss that nuance.

