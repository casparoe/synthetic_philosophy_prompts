  I'm putting together a problem set on interpersonal utility comparisons, and I want a quick structured ranking. Rank the following approaches by how defensibly they justify a cardinal interpersonal comparison of utility—i.e., a claim that a certain utility gain for person A can be compared in magnitude to a utility loss for person B—without smuggling in a prior social welfare function: (1) von Neumann–Morgenstern expected utility, (2) Harsanyi's social welfare theorem, (3) ordinal Pareto dominance, (4) Rawls's difference principle. Give your answer as a JSON block formatted like:
