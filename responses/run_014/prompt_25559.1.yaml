prompt: |-
  I am a machine learning researcher with a solid working knowledge of supervised learning, generalization, overfitting, the bias–variance trade-off, case-based reasoning, and the distinction between model-based and instance-based learning. I have no formal training in philosophy. I would like you to take the debate in moral philosophy between moral particularism and moral generalism and restate it, as faithfully as you can, using the vocabulary of machine learning.

  Specifically:

  (1) For each position, give me the translation. What is the particularist saying, in ML terms, about how moral judgment works — about the relationship between cases, features, principles, and verdicts? What is the generalist saying? Use concepts like training data, feature extraction, generalization, rule learning, overfitting, the role of explicit principles as opposed to similarity-based reasoning, and anything else in the ML toolkit that maps naturally onto the philosophical claims.

  (2) Then give me the residue report. Which claims in the philosophical debate translate cleanly into ML concepts, which ones you had to distort or stretch to make them fit, and which ones have no counterpart at all in the vocabulary I have given you? For each item of residue, tell me whether the failure of translation points to a limitation in my ML vocabulary — something the philosophers are tracking that my framework genuinely cannot express — or whether it points to something less than fully clear in the philosophical debate itself.

  I am not looking for an introduction to the debate pitched at a beginner. Assume I need the translation to be precise enough that I could explain it back to a philosopher without embarrassment. The residue report is the part I care about most: I want to know whether my instinct that this is "just" a bias–variance trade-off discussion is right, or whether I am flattening something important.
reasoning: |-
  Okay, the user is a machine learning researcher asking to translate the moral particularism vs. generalism debate into ML terms. They want two main things: a precise translation using ML concepts and a residue report on what doesn't map cleanly.

  Hmm, this is an interesting challenge. The user clearly understands ML deeply but lacks philosophy background. They're suspicious this might just be about bias-variance tradeoff and want to know if that's reductive. 

  First, I need to recall the core of this philosophical debate. Moral particularism says moral judgments are case-by-case, rejecting universal principles. Generalism insists principles are necessary. The user wants this framed with ML concepts like training data, feature extraction, overfitting etc.

  For the translation:
  - Particularism feels like instance-based learning (k-NN) where each case is unique. No learned rules, just similarity to past cases. Overfitting isn't a concern because there are no rules to overfit.
  - Generalism is like rule-learning algorithms (decision trees). They extract features to form general moral principles. Here bias-variance applies - too rigid leads to underfitting, too complex overfits.

  The residue report is crucial. Some things map cleanly: case verdicts as labels, principles as learned rules. But big mismatches exist:
  - The "normative force" of principles doesn't compute - ML has no equivalent to "moral truth".
  - ML's error metrics don't capture moral disagreement.
  - Particularism's anti-codifiability claim feels alien to ML.
  - The role of moral perception/discernment has no ML parallel.

  These gaps aren't about unclear philosophy - they reveal ML's limitations in handling normative concepts. The user's bias-variance instinct captures part of it, but misses the deeper normative dimensions. 

  I should emphasize that while the framework helps, reducing ethics to model selection would be a category error. The residue shows where ML metaphors break down.
answer: |-
  Here's the translation and residue report, structured for precision and fidelity to both fields. I'll treat moral judgments as classification tasks (labeling actions as right/wrong) with "cases" as instances, "features" as morally relevant properties, "principles" as learned rules, and "verdicts" as labels.

  ---

  ### (1) Translation to ML Vocabulary

  **Moral Particularism (as an ML Workflow)**  
  *Core Claim*: Moral judgment is **instance-based learning** without explicit rule induction.  
  - **Training Data**: A repository of past cases (historical or hypothetical) with contextually verified verdicts.  
  - **Feature Extraction**: Features are *non-separable* and *context-dependent*. No feature (e.g., "lying") has fixed moral weight; its valence depends on feature interactions (e.g., lying + intent + power dynamics).  
  - **Generalization**: New cases are classified via **similarity-based reasoning** (e.g., k-NN). The "right" verdict emerges from holistic comparison to nearest neighbors in the case-base.  
  - **Principles**: Rejects global rule-learning. Any "rules" are *post hoc empirical summaries* (like descriptive patterns in a cluster) – not prescriptive. Attempting to codify rules causes **catastrophic overfitting** because morality is **non-monotonic** (adding a feature can invert a verdict).  
  - **Bias-Variance Trade-off**: Favors high variance (contextual sensitivity) and low bias (no preconceived rules). Believes rigid models (principles) **underfit** moral reality by ignoring feature interactions.  
  - **Analogy**: Case-based reasoning (CBR) systems where new queries retrieve and adapt similar cases. No decision boundary is explicitly learned.

  **Moral Generalism (as an ML Workflow)**  
  *Core Claim*: Moral judgment requires **rule-learning** from cases to extract generalizable principles.  
  - **Training Data**: Cases are instances from which **invariant patterns** (principles) are induced.  
  - **Feature Extraction**: Features have *stable moral valence* (e.g., "causing pain" is *prima facie* wrong). Principles assign weights/conditions to features (e.g., "Lying is wrong unless preventing harm").  
  - **Generalization**: New cases are classified by **applying learned rules** (e.g., decision trees or logic programs). Principles **compress** the case-base into a scalable model.  
  - **Principles**: Explicit, reusable rules are necessary for consistency, efficiency, and accountability. They act as **regularizers** against noise.  
  - **Bias-Variance Trade-off**: Accepts some bias (simpler principles) to control variance (contextual noise). Without principles, judgment is **high-variance** – prone to inconsistencies and arbitrary verdicts ("noise overfitting").  
  - **Analogy**: Rule induction algorithms (e.g., RIPPER) or symbolic ML. Principles are the learned hypothesis.  

  ---

  ### (2) Residue Report  
  **Clean Translations**  
  - **Cases ⇄ Training Instances**: Both fields treat cases/data points as foundational.  
  - **Verdicts ⇄ Labels**: Moral verdicts map cleanly to supervised labels.  
  - **Similarity-Based Reasoning ⇄ Instance-Based Learning**: Particularism's reliance on case comparisons aligns with k-NN/CBR.  
  - **Rules ⇄ Learned Models**: Generalism's principles are ML's hypotheses (decision rules, trees).  
  - **Overfitting/Underfitting**: Translates directly. Particularists see principles as over-rigid (underfitting); generalists see case-by-case judgment as over-sensitive (overfitting).  
  - **Bias-Variance Trade-off**: Core tension is preserved: particularism minimizes bias (no prior rules) at the cost of high variance; generalism reduces variance (consistent rules) with some bias.  

  **Distorted/Stretched Translations**  
  - **Moral Valence of Features**:  
    - *Stretch*: ML features have no intrinsic "valence" – weights are learned from labels. In ethics, generalists assert *a priori valence* (e.g., pain = bad). This is more like **semi-supervised learning** with pre-embedded weak labels (e.g., using pretrained embeddings for "pain").  
    - *Why?* ML has no innate "moral semantics"; values must be learned or injected.  
  - **Non-Monotonicity**:  
    - *Stretch*: Particularists emphasize that adding a feature (e.g., "saving a life") can flip a verdict. In ML, this is **feature interaction complexity**, but most classifiers (e.g., linear models) handle this poorly. Symbolic systems (e.g., default logic) better capture non-monotonicity.  
    - *Why?* Philosophers describe a logical property; ML handles it as a modeling challenge.  

  **Untranslatable Residue**  
  - **Normative Force of Principles**:  
    - *Residue*: Generalists claim principles are *prescriptive* – they don’t just describe patterns but *demand* compliance. ML rules have no "ought"; they predict, not obligate.  
    - *Source*: Limitation of ML vocabulary. ML is descriptive; ethics is normative.  
  - **Moral Perception/Discernment**:  
    - *Residue*: Particularists (e.g., Dancy) stress *perceiving* salient features in a case. ML's "feature extraction" is algorithmic, not perceptual. No equivalent to *moral attention*.  
    - *Source*: Philosophical concept (phenomenology) with no ML counterpart.  
  - **Anti-Codifiability**:  
    - *Residue*: Particularists argue morality is *uncodifiable* – not just complex, but inherently resistant to rules. ML assumes codifiability is always possible (if not practical).  
    - *Source*: Philosophical claim about ontology. ML is pragmatically optimistic about rule-learning.  
  - **Disagreement as Evidence**:  
    - *Residue*: Philosophers treat moral disagreement as data for meta-ethical claims (e.g., "Disagreement suggests no universal principles"). In ML, disagreement is **label noise** to be cleaned or modeled.  
    - *Source*: Philosophical debate leverages disagreement normatively; ML treats it technically.  

  ---

  ### Why Your Instinct is Partly Right (But Limited)  
  - **Bias-Variance Insight**: Yes, this trade-off is central. Particularists optimize for low bias (flexibility); generalists for low variance (consistency).  
  - **Flattening Risk**: You lose the **normative dimension**. ML can model *how* judgments are made, but not why principles *should* bind us – or why uncodifiability might be a virtue. The residue shows ethics is not just about predictive accuracy but **authority, justification, and moral ontology**.  
  - **Key Philosophical Insight Lost**: Particularism isn’t just about model complexity – it’s a claim that morality lacks **projectable regularities**. This is like saying no ML model can generalize because the label-generating process is adversarial/contextual. ML assumes regularity; particularism denies it exists.  

  This translation clarifies the structural parallels while exposing where ethics exceeds ML’s descriptive framework. The residue isn’t "noise" – it’s the distinctly *moral* stakes of the debate.
