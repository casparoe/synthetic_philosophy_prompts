  But to save time, we do it in rounds with limited options.

  Given the time constraint, we have to accept that not every student will be booked, but many will. And in the debrief, we can point to specific students who are.

  To guarantee at least one example, we can plant a scenario.

  But let's assume that by offering attractive prices, many will take the bait.

