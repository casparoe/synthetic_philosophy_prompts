  Better: after the betting is done, we reveal the rules of Fluffleland. Then we note that some bets are decided by logic alone (like B→P is always true, so anyone who sold it must pay 100). For contingent ones, we draw a state at random.

  But to save time, we can only use necessary truths and falsehoods for the Dutch book, so that the loss is sure regardless of the state.

  For example, the student who sold S and bought F in round 1: sure loss of 10 tokens.

  The student who sold (Q∧¬R)→P: since it's always true, they must pay 100, and they received 85 -> loss 15, regardless of the state.

  The student who bought R∧S: always false, so they paid 20 and get 0 -> loss 20.

  So we focus on these.

  In the game, we include at least one always true and one always false proposition.

  Revised proposition list and rounds:

  Round 1:
  - S (buy/sell price: 60)
  - F (buy/sell price: 70)
  - R (buy/sell price: 40)

  Round 2:
  - Q (50)
  - B (60)
  - ¬R (60)

  Round 3:
  - P (50)
  - B→P (buy: 95, sell: 85)   [always true]
