  But again, they might not do both.

  To increase the chance, we have multiple opportunities.

  Additionally, we can have a proposition that is a consequence.

  Example of a chain:

  In round 3, we offer:
  - Proposition 12: If the Queen is in town and it is not raining, then a Puffle is happy. ((Q∧¬R)→P) [always true] [buy price: 95, sell price: 85]

  If a student sells this in round 3 (receives 85), and then in round 2 they bought Q∧¬R (which they might not have, because Q∧¬R wasn't offered until round 4) so we need to offer Q and ¬R in earlier rounds.

  Adjust rounds:

  Round 1:
  - S (price 60)
  - F (price 70)
  - R (price 40)

  Round 2:
  - Q (price 50)
  - B (price 60)
  - ¬R (price 60)

  Round 3:
  - P (price 50)
  - B→P (price for buy: 95, sell: 85)
  - (Q∧¬R)→P (price for buy: 95, sell: 85)   [always true]

  Round 4:
  - Sn (price 40)
  - S∨R∨Sn (buy: 90, sell: 80)
  - Q∧¬R (price 55)

  Now, a student in Group 2 might:
  - In round 1: sell S at 60 (because they think it's unlikely) and buy F at 70 (because they think it's more likely) -> net token immediate: +60 -70 = -10.
    Then, if S true: they have to pay 100 for S (because they sold) and get 100 for F -> net 0, plus -10 -> -10.
    If S false: they pay 0 and get 0, plus -10 -> -10. So loss 10.

  - In round 2: they might buy B at 60 and buy ¬R at 60. But if they do that, and if they later realize that B implies ¬R, but not necessarily a loss by itself.

  - In round 3: they might sell (Q∧¬R)→P at 85. Then they have to hope that (Q∧¬R)→P is false, which requires Q∧¬R true and P false. But they don't know the connection.

