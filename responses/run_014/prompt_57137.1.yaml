  5. The Grand Fluffle Ball is happening. (B) [60]
  6. It is not raining. (¬R) [60]

  Round 3:
  7. A Puffle is happy. (P) [50]
  8. If the Grand Fluffle Ball is happening, then a Puffle is happy. (B→P) [buy price: 95, sell price: 85]  [always true]
  9. It is raining and the sun is out. (R∧S) [buy price: 20, sell price: 30]  [always false]

  Round 4:
  10. It is snowing. (Sn) [40]
  11. Either the sun is out, or it is raining, or it is snowing. (S∨R∨Sn) [buy price: 90, sell price: 80]  [always true]
  12. The Queen is in town and it is not raining. (Q∧¬R) [55]

  After the rounds, reveal the rules of Fluffleland (weather rules, creature rules, ball rules). Then settle the bets:

  - First, for the always true and always false propositions (8,9,11), settle immediately.
  - Then, for the others, randomly draw a state. We can have a few states prepared, but to save time, we can use one state. For example, let's say: it is sunny (S true, R false, Sn false), Queen is in town (Q true), so B is true (because Q and not R), then F is true (because S), and we assume that at the ball, so P and M are true? But we don't have M in the bets. So for P: since B is true, then D is true, so P is true. Similarly, M is true.

  But we only have P in round 3.

  So in this state: S true, R false, Sn false, Q true, B true, F true, P true.

  Then we can settle the bets.

  Then compute final token counts.

