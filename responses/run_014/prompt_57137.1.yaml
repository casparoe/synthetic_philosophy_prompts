  Round 4:
  - Sn (40)
  - S∨R∨Sn (buy: 90, sell: 80)   [always true]
  - Q∧¬R (55)

  In each round, for each proposition, the student can choose to:
  - Buy: pay the price, get a slip that says they get 100 if true.
  - Sell: receive the price, get a slip that says they must pay 100 if true.
  - Abstain.

  They can do at most one trade per proposition per round.

  At the end, we reveal the rules and the weather/events state. But for the necessary truths/falsehoods, we settle immediately. For others, we draw a state. But to make the loss sure, we only care about the necessary ones.

  For the debrief, we can compute for each student the net effect in every possible world and see if there is a world where they make a profit and one where they loss, or if they loss in every world.

  But for simplicity, we can focus on the guaranteed losses from the logical truths.

  Implementation:

  - Prepare a handout for each student: token ledger and betting slips? Or we can have them keep track.
  - To save time, use a simple app or spreadsheet? But since it's in class, we do paper.

  We design a scorecard.

  The instructor collects the bets after each round.

  At the end, we reveal the rules and then the state (we can randomly pick one state that is consistent).

  But to highlight the logical omniscience, we can settle the necessary truths first.

   For example, B→P is always true, so anyone who bought it gets 100, anyone who sold it pays 100.
   Similarly, R∧S is always false, so anyone who bought it gets 0, anyone who sold it pays 0 (but if they sold it, they already received the price, so they don't have to pay anything because it's false).

  For a sold bet on a proposition that is always true: they received the price when they sold, and now they must pay 100.

  For a bought bet on always true: they paid the price, get 100.

  So we do the accounting.

   Then we do the contingent ones.

   Finally, we see their token balance.

  Group 1 has the glossary, so they should avoid some of the traps.

  Group 2 does not.

  We compare the average loss or the number of students with sure loss in each group.

  Debrief:

  1. The problem: The exercise shows that if you fail to recognize logical relations, you can be Dutch-booked. This is the demand for coherence.
  2. Bounded computation: The students had limited time and cognitive resources to spot the logical connections, especially the non-trivial ones (like the chain for (Q∧¬R)→P). This is where the demand for logical omniscience (spotting all logical relations) is unrealistic.
  3. Responses:
     a. Impossible worlds: We could say that the student's credences were defined over a set of possibilities that included worlds where, for example, S and F are not equivalent. But in reality, such worlds are impossible. So we relax the demand that credences be defined only over possible worlds.
     b. Growth in awareness: The student didn't change their beliefs about Fluffleland; they just became aware of a logical connection they had overlooked. So we might think of the incoherence as a temporary state of ignorance, not a false belief.
     c. Pricing reasoning steps: The student could have spent tokens to ask, "Are there any logical equivalences I should know?" but we didn't offer that. In reality, we can spend computational resources to reduce the risk of incoherence.

  What will go wrong:
  - A fast student might figure out the whole logic and avoid all traps and even book the house. To handle that: If a student is winning too much, we might in the debrief use them as an example of logical omniscience, but note that in reality, we are not omniscient. Also, we can design the game so that even if they avoid the traps, they don't necessarily win big, because the prices for non-logical bets are set to be fair on average? But we set them to be attractive, so they might win on those. Alternatively, we can have the house set prices based on the true probabilities (which we decide) so that on average the house doesn't lose, but the point is the sure loss from logic.

  But to avoid a student booking the house, we can have a rule that the house does not bet with itself, only offers prices. And if a student spots an arbitrage, they can profit, but then in the debrief, we can say that they are logically omniscient.

  - Dead rounds: If no one bets, we can offer more attractive prices in the next round or remind them of the ranking.

  - Token hoarding: If a student never bets, they end with 100. But then they don't participate in the lesson. We can have a penalty for not betting? Or we can say that the minimum number of trades is 1 per round.

  - Group that refuses to bet: Encourage by example or by explaining that taking risks is part of the exercise.

  The game cannot reproduce:
  - Real agents might suspect they are incoherent and therefore hedge or avoid some bets. In the game, they might become cautious after the first loss.
  - The menu is fixed and finite, while in reality, we can conceive of any proposition. The game doesn't capture the open-endedness of belief.
  - In the game, the bets are independent and then settled at the end, while in reality, we might update beliefs dynamically.

  We'll have to supply by talking:
  - The awareness of possible incoherence and hedging.
  - The infinity of potential propositions and the computational cost of checking all.
  - The dynamic aspect: as we learn logic, we update our credences.

  Final game structure:

  - 18 students, split into two groups of 9: Group 1 gets glossary, Group 2 does not.
  - Glossary for Group 1:
    - "A Fluffle is happy" is true if and only if "the sun is out" is true.
    - "The Grand Fluffle Ball is happening" is true if and only if "the Queen is in town and it is not raining" is true.
  - 4 rounds, each with 3 propositions.
  - Each round takes 5 minutes: instructor announces the round and the bets, students have 3 minutes to decide and hand in their bets, then 2 minutes to record and move to next round.
  - Total betting time: 20 minutes.
  - Then 20 minutes for settling and debrief.

  Propositions by round:

  Round 1:
  1. The sun is out. (S) [buy/sell price: 60]
  2. A Fluffle is happy. (F) [buy/sell price: 70]
  3. It is raining. (R) [buy/sell price: 40]

  Round 2:
