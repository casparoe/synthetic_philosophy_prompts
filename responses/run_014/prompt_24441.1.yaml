  1. **Avoid Catastrophic Harm**: Check if the release introduces a risk of catastrophic harm (e.g., death, permanent injury, existential risk). If yes, do not ship until mitigated.
  2. **Check for Reversibility**: If the harm is reversible (e.g., can be fixed in a patch) and the benefits are substantial, then we might lean towards shipping but with a plan to fix.
  3. **Quantify and Compare Expected Harm**: Calculate the total expected harm (in a common unit, e.g., seconds of user time lost) for both the status quo and the new release. If the new release has lower total expected harm, ship. If higher, move to the next step.
  4. **Check for Dominance**: If the new release causes harm to a subset that is worse in every way (i.e., the same users are getting both the small harms and the risk of large harm, and the large harm is not offset by the small benefits), then do not ship.
  5. **Threshold Check**: Check if the worst-case harm (or the expected harm for the worst-off individual) exceeds a pre-defined threshold (e.g., a harm that is considered unacceptable regardless of the benefits to others). If it does, do not ship.
  6. **Defer to Human Judgment**: If none of the above steps yield a clear answer, defer to a human (or a committee) for a judgment call.

