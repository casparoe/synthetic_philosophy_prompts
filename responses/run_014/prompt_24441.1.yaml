prompt: |-
  I'm an AI safety reviewer at a mid-size company and basically every release I sign off on is the same comparison in a new costume: a tiny annoyance to a lot of users versus a real harm to a few. Like a 200ms latency hit for five million users a day, or a one-in-a-million chance the model serves bad medical advice and someone gets hurt. I've been reading about the torture vs. dust specks problem and I think it's literally my job, and I think the arithmetic is broken in a specific way: either each tiny bit of harm doesn't actually add up (so a million small annoyances = nothing), or "worse than" stops being transitive somewhere, or you have to accept that a big enough pile of dust specks is worse than someone's year of torture, which I cant bring myself to believe. I can't tell which of those I'm secretly assuming when I make these calls, and I don't want to keep guessing.

  Can you write a decision procedure my team can actually run on a release? We're smart engineers, not philosophers, and I have to sign off within a day, so it has to be something we can finish in an afternoon. I want the questions in the order to ask, what counts as a good enough answer to each, where the procedure stops and says "no, don't ship," and where it has to hand off to a human because the question is one of values rather than facts. Be honest about which step is where we're picking one of those three horns, and say what the procedure can't do.

  Then run it on these three and give me the verdicts as a table with exactly these columns: case (short name), the step where it stops (step number and name), verdict (ship / don't ship / defer to human), which premise the verdict rests on (monotonicity, transitivity, a threshold, or neither), and one sentence on what would have to be true to flip it.

  The cases: (1) shipping a feature that makes every response 200ms slower for all five million daily users, versus not shipping it. (2) shipping the faster model that has a one-in-a-hundred-thousand chance of dangerous medical advice per user, versus shipping the safer model that's 200ms slower for everyone. (3) shipping a productivity feature that saves each of five million users about 30 seconds a day but carries a one-in-a-million chance per user-day of a serious error that costs someone a full day of work. I want to ship this one and business is on it, but I suspect your procedure will tell me not to — I want to see it do that and then explain why I might still be right to override it.
