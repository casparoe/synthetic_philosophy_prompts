answer: |-
  ### Decision Procedure for AI Safety Review

  This procedure is designed for engineers to complete in an afternoon. It breaks down the torture-vs-dust-specks dilemma into sequential, actionable steps. The core philosophical conflict (dust specks adding up vs. transitivity failure vs. threshold rejection) is explicitly addressed in **Step 5**. The procedure stops early if a clear "ship/don't ship" verdict is reached. Steps requiring human judgment are marked.

  **Key Premises**  
  - **Monotonicity**: Small harms add up linearly (rejecting "a million dust specks = nothing").  
  - **Transitivity**: "Worse than" comparisons hold across scales.  
  - **Threshold**: Individual harm above a defined cap (e.g., 1 hour/user/day) cannot be justified by aggregate benefits.  

  **Procedure Steps**  
  1. **Catastrophic Harm Check**  
     - *Question*: Could this release cause death, irreversible injury, or existential risk?  
     - *Good Answer*: "No" (supported by risk modeling). If "yes," quantify probability.  
     - *Stop & Verdict*: Don't ship if expected catastrophic events/day > 1e-9.  
     - *Premise*: Threshold (absolute safety cap).  

  2. **Reversibility & Mitigation**  
     - *Question*: If harm occurs, can it be undone (e.g., via rollback) within 24h?  
     - *Good Answer*: "Yes, with documented rollback plan."  
     - *Stop & Verdict*: Ship only if fully reversible; else, don't ship.  
     - *Premise*: Neither (operational pragmatism).  

  3. **Net Harm Calculation**  
     - *Question*: Convert all impacts to **seconds of user time lost/gained**. Calculate:  
       - Total harm (new release) = Σ (probability × severity in seconds)  
       - Total harm (status quo) = Baseline (often 0).  
     - *Good Answer*: Quantitative model with peer-reviewed assumptions.  
     - *Stop & Verdict*: Ship if total harm (new) ≤ total harm (status quo). Else, proceed.  
     - *Premise*: Monotonicity (small harms add up).  

  4. **Distributional Fairness**  
     - *Question*: Does any user subgroup get net harm without offsetting benefit?  
     - *Good Answer*: "No subgroup is strictly worse off."  
     - *Stop & Verdict*: Don't ship if a subgroup is net harmed. Else, proceed.  
     - *Premise*: Transitivity (individual/group comparisons hold).  

  5. **Individual Harm Threshold**  
     - *Question*: Does any user face >1 hour of expected daily harm, OR >1e-5 chance of a >1-hour harm?  
     - *Good Answer*: "No" (supported by per-user risk analysis).  
     - *Stop & Verdict*: Don't ship if threshold breached. Else, proceed.  
     - *Premise*: **Threshold** (rejects "dust specks > torture" at scale).  

  6. **Defer to Human Judgment**  
     - *Question*: Are benefits/harms incommensurable (e.g., time vs. privacy)?  
     - *Good Answer*: N/A (qualitative debate).  
     - *Verdict*: Defer to committee.  
     - *Premise*: Values, not facts.  

  **What the Procedure Cannot Do**  
  - Resolve fundamental ethics debates (e.g., utilitarianism vs. deontology).  
  - Handle unquantifiable harms (e.g., dignity loss).  
  - Replace domain expertise (e.g., medical risk assessment).  

  ---

  ### Case Evaluations
  | Case                         | Step Where Stopped             | Verdict       | Premise        | Flip Condition                                  |
  |------------------------------|--------------------------------|---------------|----------------|------------------------------------------------|
  | **1. 200ms latency for all** | Step 3: Net Harm Calculation   | Don't Ship    | Monotonicity   | If the feature provides >1M sec/day user benefit. |
  | **2. Faster medical model**  | Step 1: Catastrophic Harm      | Don't Ship    | Threshold      | If "dangerous advice" is minor (e.g., <5 min harm). |
  | **3. Productivity feature**  | Step 3: Net Harm Calculation   | Ship          | Monotonicity   | If error probability >1e-6 or harm >1 day.     |

  **Case Details**  
  1. **200ms latency for all**  
     - Harm = 5M users × 0.2 sec = **1M sec/day lost**.  
     - No benefit specified → net harm → **don't ship** (Step 3).  

  2. **Faster medical model**  
     - Expected catastrophic events = 5M × 1e-5 = **50 events/day**.  
     - Exceeds Step 1 threshold (1e-9) → **don't ship** (catastrophic harm).  

  3. **Productivity feature**  
     - Benefit = 5M × 30 sec = **150M sec/day gained**.  
     - Harm = 5M × (1e-6) × 8h × 3600 sec/h = **144K sec/day lost**.  
     - Net benefit = 150M - 144K = **149.86M sec/day** → **ship** (Step 3).  

  **Why You Might Override Case 3 Verdict**  
  The procedure says "ship" due to net time gain, but you might block it if:  
  - **Ethical concern**: Concentrated harm (5 users/day losing 8h) outweighs diffuse benefits, even if arithmetic disagrees. This rejects monotonicity.  
  - **Threshold adjustment**: You lower Step 5's cap (e.g., no >1e-6 chance of >4h harm).  
  - **Non-quantifiable risk**: "Serious error" could cause reputational damage or anxiety not captured in "time lost."  
  To override, escalate to **Step 6** (human judgment) with the argument: *"Protecting the worst-off user from catastrophic work loss is a deontological constraint that overrides aggregate utility."*  

