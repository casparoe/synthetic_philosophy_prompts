  User's self-awareness about gut feelings is impressive. Their challenge is systematizing without oversimplifying. The dialysis verdict deserves most skepticism—it's where tribalism masquerades as ethics. Everything else coheres reasonably.
answer: |-
  You've articulated a remarkably coherent set of intuitions that reveal deep tensions in how we think about special obligations—and your self-awareness about where your gut might be unreliable is spot on. There *is* a pattern here, but it challenges simplistic notions of patriotism or citizenship as the source of obligation. Let's break it down:

  ### The Principle Emerging from Your Cases
  Your intuitions point toward a **"Grounding Principle"**:

  > **Special obligations arise primarily from concrete relationships, proximity, capacity, reciprocity, and beneficiary responsibility—not from abstract national identity or legal status alone. These obligations are strong but defeasible when outweighed by greater need, injustice, or harm.**

  This principle explains your judgments:
  1.  **Proximity & Capacity:** Saving the drowning child is about direct ability to act (*you* can pull them out). Distance erodes this immediacy.
  2.  **Reciprocity & Contribution:** You prioritize the undocumented immigrant (embedded in society) over the absentee citizen. Shared social fabric matters more than paperwork.
  3.  **Beneficiary Responsibility:** Feeling obligated for colonial harms stems from benefiting from unjust systems, not just sharing a passport.
  4.  **Defeasibility:** Helping a friend over a stranger is reasonable, but *not* when the stranger faces catastrophe. Loyalty has limits.
  5.  **Rejection of Blind Tribalism:** Refusing wartime patriotism regardless of justice shows obligations can't override universal morality.

  ### Where Your Gut Might Need Scrutiny: The Dialysis Case
  This is your **most ethically vulnerable intuition** and deserves the deepest skepticism. Why?

  1.  **Contradicts Your Other Principles:** 
      *   Proximity? You're equally distant from both groups.
      *   Capacity? You have equal power to help via funding.
      *   Reciprocity? Both groups are strangers; neither has a specific tie to *you*.
      *   Beneficiary Responsibility? You're not *causing* malaria abroad.
      *   Defeasibility? The *greater need* (saving 1,000 vs. 100) is starkly clear.

  2.  **Reveals Tribalism:** This preference likely stems from **psychological parochialism** – favoring "us" over "them" based on nationality alone, even when "them" suffers vastly more. It's the same instinct that makes people donate to local charities over more effective global ones. It feels natural but lacks ethical justification.

  3.  **Moral Arbitrariness:** Why should the accident of birth within a border grant someone 10x greater claim on your resources when lives are equally valuable? Your own coin-flip analogy in the drowning case rejects this arbitrariness.

  ### Why the Other Intuitions Hold Up Better
  *   **Drowning Child:** Grounded in direct capacity/responsibility (you *can* act here/now).
  *   **Deportation Case:** Prioritizes moral desert (contribution, integration) over legal fiction.
  *   **Wartime Stance:** Upholds universal justice over tribal loyalty.
  *   **Historical Harms:** Acknowledges responsibility arising from *benefiting* from injustice.
  *   **Friend vs. Stranger:** Balances special relationships with the scale of need.

  ### Framing: Not Confused, But Nuanced
  Your framing isn't confused; it's grappling honestly with a messy reality. You're *not* smuggling in bad assumptions – you're correctly identifying that citizenship/nationality **alone** is a weak moral foundation. You're recognizing that *other* factors often masquerade as "compatriotism":

  1.  **Proximity/Immediacy:** Easier to see/help those nearby.
  2.  **Shared Institutions/Society:** Contributing to and relying on a system creates reciprocal ties.
  3.  **Beneficiary Status:** Profiting from past/present injustice creates debt.
  4.  **Psychological Affinity:** Feeling closer to those culturally similar (often overlaps with nationality).
  5.  **Legal/Political Agency:** Having more power to influence your own government for domestic issues.

  ### Conclusion & Recommendation
  *   **Principle:** Your core ethical stance values concrete relationships, capacity, reciprocity, and redress for harm over abstract national identity. Obligations based on nationality are usually proxies for these deeper factors and are defeasible.
  *   **Be Most Suspicious Of:** Your gut feeling favoring the domestic dialysis program over vastly more effective foreign aid. This is where unexamined tribalism ("us first") most clearly overpowers impartial moral reasoning (saving more lives). Scrutinize this instinct rigorously.
  *   **Refine Your Thinking:** Ask *why* you feel the pull toward compatriots in a given case. Is it genuinely about reciprocity/proximity/redress? Or is it just "they're one of us"? If it's the latter, challenge it using the impartial standard you applied in the deportation and drowning cases.

  Your struggle reflects the tension between being a member of a particular community and a member of humanity. Your instincts largely point toward a sophisticated **cosmopolitanism with room for grounded special duties** – a position many philosophers (like David Miller or Martha Nussbaum) grapple with. Trust your reasoning where it demands justification beyond borders, and question it hardest when it doesn't.
