  - `thesis_one_sentence`: A one-sentence statement of the position.
  - `concessions_up_front`: An array of strings of things to concede before questions.
  - `objections`: An array of objects, ordered by rank (1 being highest, meaning most likely and most damaging combined). Each objection object has:
