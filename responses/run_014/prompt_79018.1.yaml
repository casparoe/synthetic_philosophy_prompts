     - Graduate students (acquaintance): They will press on the nature of the knowledge-that: is it really about the object or about the testifier's state? Also, they might challenge the distinction between knowing-that and knowing-what-it's-like in the aesthetic context.
     - Art critic: Might dismiss the philosophical project entirely, arguing that aesthetic judgments are not propositional knowledge at all, but something else.

