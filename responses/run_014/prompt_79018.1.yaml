    - `likelihood`: integer 1-5 (5 very likely)
    - `damage`: integer 1-5 (5 very damaging)
    - `stance`: one of "concede", "hold", "concede partly"
    - `reply`: what to say in response (max 200 words)
    - `where_the_reply_is_soft`: one or two sentences on the weakness
