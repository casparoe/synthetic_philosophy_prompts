prompt: |-
  I have just spent a long evening arguing with a friend about whether the activations inside a large neural network are "representations" in any sense that matters, or whether the word is doing more work than it can bear. We kept circling the same issues without converging, and I have decided that before either of us argues further we need a shared specification: what a theory of representational content in artificial neural networks actually has to deliver to count as adequate. Please write that specification.

  For each requirement, give the consideration or motivating case behind it, and say whether you regard it as non-negotiable or as a preference of a particular camp. Cover at least the following, and flag any you think I have omitted:

  - Granularity: what the unit of a representation is supposed to be — a single activation, a learned feature, a circuit, a population of units — and what the theory owes us in cases where a single direction in activation space is shared by many concepts, or a single concept is spread across many directions.
  - Systematicity and compositionality: whether the theory must recover the systematic and compositional structure that philosophers have long taken to be essential to genuine content, and what that requirement actually demands of a network whose features are learned end-to-end rather than laid down by hand.
  - Causal mediation rather than mere correlation: the requirement that a putative representation figure in the causal chain between input and output, rather than being a bystander that merely co-occurs with the relevant computation.
  - Misrepresentation: the requirement that the theory explain how a feature can represent the wrong thing — a "cat" direction that lights up on a not-cat — without collapsing into the claim that a feature only ever represents what it tracks.
  - The circularity charge: whether the theory must answer the worry that a functional-role or causal-role account explains a feature's content only by reference to the very causal relations whose interpretation is at issue.
  - Interpretability: whether a representation has to be human-interpretable to count as one, or whether that is a prejudice of the people who happen to need to read the features.

  Then tell me which of these you take to be genuine desiderata and which to be inherited prejudices of one side of the argument; whether any subset of the list is jointly unsatisfiable, in which case the list itself is the result and we should say which subset and why; and which single requirement knocks out the most candidate theories.

  Finally, score the main contenders briefly against the list — the causal-role or functional account, the view that networks have no representations in the relevant sense and only computation, and the interpretability-led view that a representation just is a human-readable feature — but keep the weight on the requirements, since that is where the real work is. I want the specification and the reasoning, not a bibliography or a reading list.
reasoning: |-
  Okay, the user has spent a long evening arguing with a friend about whether activations in neural networks are genuine "representations." They want a shared specification for what a theory of representational content in ANNs must deliver. Let me start by understanding their core request.

  First, they mention specific areas to cover: granularity, systematicity/compositionality, causal mediation, misrepresentation, circularity, and interpretability. I need to address each, providing considerations, whether they're non-negotiable or preferences, and any omissions. 

  For granularity, the key issue is what counts as the unit of representation. Single activations might be too fine-grained; features or circuits could be better. The theory must handle cases where one direction corresponds to many concepts (polysemy) or one concept spans many directions (distributed representation). This seems non-negotiable because any theory must define its units clearly.

  Systematicity and compositionality: Philosophers like Fodor argue that genuine representations must recombine systematically. But in ANNs, structures emerge from data, not explicit rules. The user’s friend might insist on this, but it could be a preference. The theory should explain how compositions arise naturally without hand-crafting.

  Causal mediation is crucial. Representations must play a causal role in the network's output, not just correlate. Non-negotiable because passive correlations aren't sufficient for representation—functionality matters.

  Misrepresentation is tricky. If a "cat" feature activates for a dog, how is that error? Tracking theories struggle here. The theory needs to allow for errors without collapsing into perfect tracking. Non-negotiable for a robust theory of content.

  Circularity charge: Defining content by functional roles might reference the same causal relations in question. The theory must avoid this, perhaps through external factors. Non-negotiable to prevent vacuous explanations.

  Interpretability: Should representations be human-readable? Some camps say yes, but that's likely a bias. ANNs can have useful internal states even if not interpretable. This is a preference, not a core requirement.

  Possible omissions: External factors (teleosemantics) and counterfactual robustness. Added as points 7 and 8. External grounding addresses circularity, counterfactuals ensure representations aren't accidental.

  Desiderata vs. prejudices: Causal role, misrepresentation, granularity clarity, avoiding circularity are genuine needs. Systematicity and interpretability might be inherited preferences. 

  Conflict: Systematicity and end-to-end learning might clash if networks don’t develop compositional structures. Interpretability vs. causal role could conflict if functional states aren't readable.

  Causal mediation knocks out mere correlational theories. 

  Contenders: Functional-role theory handles causal mediation and misrepresentation but struggles with circularity. Anti-representational view rejects content, focusing on computation, but misses explanatory depth. Interpretability-led view is too anthropocentric. Hybrid approaches might be necessary.

  User's deeper needs: They want a clear framework to resolve debates, ensuring theories are rigorous and address philosophical concerns without bias. Highlighting genuine vs. optional criteria helps them move past circular arguments.
answer: |-
  Here is a specification for an adequate theory of representational content in artificial neural networks (ANNs), structured by your requested points, with considerations, negotiability assessments, and analysis of conflicts. Omitted but critical requirements are included.

  ---

  ### Core Requirements for a Theory of Representational Content

  1. **Granularity**  
     - **Requirement**: Must specify the *unit* of representation (e.g., single neuron, activation vector, learned feature subspace, circuit) and resolve ambiguity when:  
       - A single direction encodes multiple concepts (e.g., a polysemous feature for "financial instrument" and "guitar pick").  
       - A concept is distributed across many units (e.g., "cat" represented non-locally).  
     - **Consideration**: ANNs exhibit hierarchical, overlapping, and distributed encodings. A theory must clarify whether content is atomistic or holistic.  
     - **Negotiability**: **Non-negotiable**. A theory without granularity specifications is vacuously applicable.  

  2. **Systematicity and Compositionality**  
     - **Requirement**: Must explain how representations support systematic recombination (e.g., "chases" + "dog" + "cat" → "dog chases cat") and compositional semantics (e.g., "red cube" deriving from "red" and "cube").  
     - **Consideration**: Philosophical tradition (Fodor, Pylyshyn) argues systematicity is essential for productivity and generalization. ANNs learn features end-to-end, often without explicit symbolic scaffolding.  
     - **Negotiability**: **Preference**. Some camps (e.g., connectionists) deny strict compositionality is necessary; others (classicists) demand it. A theory may satisfy this weakly (e.g., emergent quasi-compositionality).  

  3. **Causal Mediation (vs. Correlation)**  
     - **Requirement**: Must show the representation is *causally efficacious* in generating outputs, not merely correlational. If ablating/modifying the feature disrupts task performance systematically, it strengthens causal claims.  
     - **Consideration**: Mere correlation (e.g., a "sunset detector" covarying with outputs but not used by the network) is insufficient for representational content.  
     - **Negotiability**: **Non-negotiable**. Without causal mediation, "representation" reduces to epiphenomenal correlation.  

  4. **Misrepresentation**  
     - **Requirement**: Must explain how a feature can *misrepresent* (e.g., a "cat" feature activating for a small dog). It cannot collapse into "whatever the feature tracks" (e.g., "cat-or-dog-or-furry-blob").  
     - **Consideration**: Tracking theories (e.g., Fodor) struggle with error cases. Teleosemantic approaches (Millikan) ground content in evolutionary function—but ANNs lack evolutionary history.  
     - **Negotiability**: **Non-negotiable**. Absent misrepresentation, content is merely informational.  

  5. **Circularity Charge**  
     - **Requirement**: Must avoid defining content *solely* by functional/causal roles within the network, as this risks circularity (e.g., "X represents cats because it causes cat-outputs").  
     - **Consideration**: Pure functionalist accounts (e.g., conceptual role semantics) struggle to anchor content externally. The theory needs an external "grounding" mechanism.  
     - **Negotiability**: **Non-negotiable**. Circularity renders the explanation vacuous.  

  6. **Interpretability**  
     - **Requirement**: Must clarify whether human interpretability is necessary for representation, or if inscrutable (e.g., high-dimensional) activations qualify.  
     - **Consideration**: Human intuitions favor interpretability, but ANNs may encode efficient yet alien representations (e.g., "curve detectors" in vision models).  
     - **Negotiability**: **Preference**. Insisting on interpretability is anthropocentric; non-human-readable states may still function representationally.  

  7. **External Grounding (Omitted)**  
     - **Requirement**: Must explain how representations acquire content *beyond* the network’s internal dynamics (e.g., via training data, loss functions, or deployment context).  
     - **Consideration**: Internalist theories (e.g., functionalism) fail to distinguish representation from syntax. Content requires external anchoring (e.g., Dretske’s informational semantics).  
     - **Negotiability**: **Non-negotiable** for avoiding circularity.  

  8. **Counterfactual Robustness (Omitted)**  
     - **Requirement**: Must account for how representations behave under hypothetical inputs (e.g., a "cat" feature *would* fire for unseen cat breeds).  
     - **Consideration**: Content implies generalization beyond observed instances.  
     - **Negotiability**: **Non-negotiable** for distinguishing representations from memorization.  

  ---

  ### Analysis of Requirements  
  - **Genuine Desiderata**: Causal mediation, misrepresentation, granularity clarity, external grounding, and counterfactual robustness are non-negotiable for any substantive theory.  
  - **Inherited Prejudices**:  
    - Systematicity reflects classical symbolic AI biases; ANNs may exhibit non-classical compositionality.  
    - Interpretability is a human-centric preference; representations need not be legible to us.  
  - **Conflict**: Systematicity vs. end-to-end learning. If ANNs learn non-compositional representations, a theory demanding strict systematicity may be inadequate for real networks. Interpretability vs. causal role may also conflict (e.g., causally potent but uninterpretable features).  
  - **Most Exclusionary Requirement**: **External grounding** eliminates purely internalist accounts (e.g., radical enactivism). **Causal mediation** eliminates correlational tracking theories.  

  ---

  ### Evaluation of Contending Theories  

  | **Theory**               | **Granularity**       | **Systematicity** | **Causal Mediation** | **Misrepresentation** | **Circularity**      | **Interpretability** | **External Grounding** |  
  |--------------------------|-----------------------|-------------------|----------------------|------------------------|----------------------|----------------------|------------------------|  
  | **Functional-Role**      | Circuits/layers       | Weak/emergent     | ✅ Strong            | ❌ (Collapses to role) | ❌ Circular          | ❌ Not required       | ❌ Lacks grounding     |  
  | **Anti-Representational**| N/A (denies content) | N/A               | N/A                  | N/A                    | N/A                  | N/A                  | N/A                    |  
  | **Interpretability-Led** | Single units/features| ❌ Ad hoc         | ⚠️ Correlational     | ⚠️ Arbitrary           | ⚠️ Unexamined        | ✅ Required          | ❌ Internalist         |  
  | **Teleosemantic Hybrid** | Learned features     | ✅ Emergent       | ✅ Strong            | ✅ Via design/training | ✅ Avoided           | ❌ Not required       | ✅ Via training goal   |  

  - **Functional-Role**: Fails circularity and misrepresentation. Confuses syntax with semantics.  
  - **Anti-Representational (Pure Computationalism)**: Avoids all requirements but ignores explanatory power of representational talk for generalization and errors.  
  - **Interpretability-Led**: Anthropocentric; conflates epistemology with ontology. Fails causal mediation and grounding.  
  - **Strongest Contender**: A **teleosemantic hybrid** (e.g., content fixed by the *design function* of the network via training). Solves grounding via learning objectives, allows misrepresentation (divergence from ideal function), and handles causal roles.  

  ---

  ### Conclusion  
  The core specification demands a theory that:  
  1. Grounds content externally (e.g., in training objectives),  
  2. Explains causal efficacy and error,  
  3. Defines units robustly amid distributed encoding.  
  Systematicity and interpretability are optional. **Circularity and lack of grounding** are the most frequent failure modes. Without external anchoring, "representation" is just a label for causal intermediaries—a view your friend may endorse, but which fails to explain *aboutness*. The teleosemantic hybrid best meets the spec, but all theories struggle with polysemy/distributed representations. This framework should ground your debate in what a theory *must* explain, separating philosophical desiderata from empirical constraints.
