prompt: |-
  I'm a second-year PhD student working on machine learning, with an undergraduate background in epistemology, and I'm trying to decide whether to commit my remaining three years to the problem of eliciting latent knowledge from AI systems — roughly, the cluster of questions around how to get a model to act on or report what it actually knows rather than what is convenient for it to report, including what people in this space call deceptive or sycophantic misreporting, and whether something like debate or consistency pressure can be trusted as an elicitation method. Before I commit, I want a prioritisation of the open conceptual questions in this area. Give me exactly five numbered items, each one or two sentences long, with no introduction or conclusion, and write in British English throughout. Each item should name one open question, state why it deserves priority over the others, and indicate what sort of evidence or argument over the next few years would move it up or down your ranking. Please be dependency-aware: I want to know which questions are upstream of which — for instance, whether the debate over whether elicitation methods reveal knowledge or merely manufacture new behavioural dispositions must be settled before work on scalable oversight schemes can be interpreted, or whether the two can proceed in parallel. I'd also like at least one item you'd rank highly precisely because it is neglected, not because it is tractable, and at least one you would rank highly despite it being intractable, with a sentence on why the ordering isn't just tractability by another name. Treat the following as the sort of thing I mean by an open question, not as items to include or exclude: whether a model can be said to know something when it reliably acts on that information but would deny it under questioning; whether inner optimisers count as a failure of elicitation or a failure of formation; and whether elicitation tools validated on models we can inspect transfer to models we cannot.
