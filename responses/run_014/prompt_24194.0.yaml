answer: |-
  ### Decision Procedure for Identifying Transcendental Arguments  
  **Purpose**: To distinguish genuine transcendental arguments (TAs) from non-TAs (a priori, inductive, performative contradiction, modal trap) and flag common weaknesses (overreach, question-begging).  
  **Timeframe**: Designed for completion within a month.  
  **Key Features**:  
  - Focuses on **structural form** (steps 1–6) to avoid substantive philosophical judgment.  
  - **Substantive tests** (steps 7–8) are flagged for referee input.  
  - **Stops early** if non-TA structure is detected.  
  - **Verdicts**: "TA," "Not a TA (specify type)," or "Inconclusive (requires referee's substantive judgment)."  

  ---

  ### The Procedure  
  Run these steps **in order**. Stop and assign a verdict if criteria are unmet.  

  1. **Identify the Phenomenon (P)**:  
     - **Question**: Does the paper explicitly state a phenomenon (e.g., experience, judgment, reference) whose *possibility* or *actuality* is the starting point?  
     - **Sufficient Answer**: P must be specified (e.g., "the possibility of coherent doubt," "the capacity for conceptual thought").  
     - **Stop if**: P is absent → Verdict: "Not a TA. Likely **a priori argument** (lacks grounding in a phenomenon)."  

  2. **Necessary Condition (X)**:  
     - **Question**: Does the paper claim X is a *necessary condition* for the possibility of P?  
     - **Sufficient Answer**: Clear statement that "without X, P is impossible."  
     - **Stop if**: Absent → Verdict: "Not a TA. Likely **inductive/empirical argument** (infers X from evidence, not necessity)."  

  3. **Inference Structure**:  
     - **Question**: Does the paper infer X *from* the possibility/actuality of P?  
     - **Sufficient Answer**: Logical structure: "P is possible/actual → X must hold."  
     - **Stop if**: Inference is reversed (e.g., "X is true, therefore P is possible") → Verdict: "Not a TA. Likely **a priori argument** (deduces P from X, not vice versa)."  

  4. **Anti-Empirical Check**:  
     - **Question**: Does the argument rely on *empirical evidence* (e.g., observations, experiments) to support X?  
     - **Sufficient Answer**: No empirical premises; pure conceptual analysis.  
     - **Stop if**: Empirical premises found → Verdict: "Not a TA. **Inductive/empirical argument**."  

  5. **Anti-Performative Check**:  
     - **Question**: Is X justified *only* by claiming that *denying X* creates a performative contradiction?  
     - **Sufficient Answer**: Performative contradictions involve *acts* (e.g., asserting) that presuppose X. TAs focus on *conditions of possibility* for P.  
     - **Stop if**: Sole reliance on performative contradiction → Verdict: "Not a TA. **Performative-contradiction argument**."  

  6. **Anti-Modal-Trap Check**:  
     - **Question**: Does the paper infer X *directly* from "we cannot conceive ~X" without linking to P?  
     - **Sufficient Answer**: TA must derive X from P’s conditions, not conceivability failures.  
     - **Stop if**: Modal trap detected → Verdict: "Not a TA. **Modal trap**."  

  7. **Overreach Test** (Substantive):  
     - **Question**: Does the argument conclude X holds *mind-independently* (not just as a condition of representation)?  
     - **Judgment Call**: Flag if it infers mind-independent reality from representational necessity.  
     - **Outcome**: No verdict change → Hand back to referee: "Potential **overreach** (Sellarsian objection)."  

  8. **Question-Begging Test** (Substantive):  
     - **Question**: Does the premise "X is necessary for P" *presuppose X’s truth*?  
     - **Judgment Call**: Flag if X is smuggled into the description of P or its conditions.  
     - **Outcome**: No verdict change → Hand back to referee: "Potential **question-begging**."  

  **Final Verdicts**:  
  - If steps 1–6 passed → "TA."  
  - If steps 7–8 flagged → "TA, but with substantive issues (noted)."  

  ---

  ### Limits of the Procedure  
  - **Judgment Calls**: Steps 5 (performative vs. TA), 7 (overreach), and 8 (question-begging) require interpretation. The procedure flags risks but cannot resolve them mechanically.  
  - **Novel Arguments**: May misfire on hybrid or innovative TAs (e.g., blending TA with pragmatism). Step 1 (phenomenon specification) is the strongest filter.  
  - **False Negatives**: Conservative; may misclassify weak TAs as non-TAs if structure is ambiguous.  

  ---

  ### Applying the Procedure to Papers A, B, and C  

  #### **Paper A**: Against global skepticism  
  > *Argument*: To coherently maintain that one’s experience might be ungrounded (skepticism), the subject must distinguish appearance from reality. This distinction requires the reality of objects → Skepticism self-undermines.  

  1. **Phenomenon (P)**: "Coherently maintaining skepticism" (explicitly stated) → **Pass**.  
  2. **Necessary Condition (X)**: "Distinguishing appearance/reality" (X₁) and "reality of objects" (X₂) are necessary for P → **Pass**.  
  3. **Inference Structure**: Infers X₂ from P’s possibility → **Pass**.  
  4. **Anti-Empirical**: No empirical evidence → **Pass**.  
  5. **Anti-Performative**: Not focused on *asserting* skepticism; targets coherence conditions → **Pass**.  
  6. **Anti-Modal-Trap**: No appeal to inconceivability; derives X from P’s conditions → **Pass**.  
  7. **Overreach Test**: Concludes objects exist mind-independently. *Judgment call*: **Flags overreach** (risk: only proves necessity of *representing* objects).  
  8. **Question-Begging Test**: Does "distinguishing appearance/reality" presuppose objects? *Judgment call*: **Flags question-begging** (skeptic may deny this necessity).  

  **Verdict**: **TA** (passes steps 1–6), but with substantive issues (steps 7–8).  
  **Key Step**: Step 3 (inference structure) confirms TA form. Step 8 flagged the referee’s concern.  

