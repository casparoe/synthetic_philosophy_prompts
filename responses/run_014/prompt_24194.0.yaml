prompt: |-
  I referee for an epistemology journal. I'm a general epistemologist, not a specialist in the literature on transcendental arguments, and I get six to ten papers a year, a few of which claim to offer a transcendental argument — against global skepticism, for the existence of other minds, or for the reality of the external world. My reports on these tend to be vague, because I can't reliably tell whether a manuscript is really offering a transcendental argument or is offering a different species of argument that merely sounds transcendental. I need a decision procedure I can run on a manuscript and finish within the month I have to write my report.

  Please write me that procedure: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a verdict of "not a transcendental argument" (and which species it is instead), and where it has to hand the call back to me because the question is substantive rather than formal. The procedure should at least let me separate a genuine transcendental argument — one that purports to establish a necessary condition of the possibility of experience, judgment, or reference, and then infers the condition from the fact that the phenomenon is possible — from (i) an a priori argument, (ii) an inductive or empirical argument, (iii) a performative-contradiction argument, and from the modal trap of inferring from "we cannot think X away" to "X must be the case." It should also run two specific checks: an overreach test, which asks whether the argument establishes at most the conditions of our representation of reality (the standard objection usually associated with Sellars) rather than a claim about mind-independent reality; and a question-begging test, which asks whether the premise that X is a necessary condition already presupposes X. And it should require the paper to specify the phenomenon whose possibility is being analyzed, so I can check that the condition is genuinely necessary for that phenomenon and not merely convenient or psychologically typical.

  Then run the procedure on three papers. Paper A argues against global skepticism: to coherently maintain that one's experience might be ungrounded, the subject must be able to distinguish appearance from reality, but that distinction itself requires the reality of objects, so the skeptic's position is self-undermining. Paper B argues that other minds must exist: a subject can acquire general concepts only through interaction with other speakers, so the possibility of conceptual thought requires other minds, so other minds exist. Paper C argues that the external world must exist because one cannot coherently doubt it. I'm personally attached to Paper A — I think it's the best available defense against skepticism and I hope it will pass as a genuine transcendental argument — so I expect the procedure's verdict on it to be the one I will not want. For each paper, show me the procedure's steps, its verdict, and which step did the work.

  Finally, be honest about the limits: mark which steps of the procedure are judgment calls dressed up as procedure, and say where the procedure will misfire on a genuinely novel argument that doesn't fit the taxonomy.
reasoning: |-
  We are constructing a decision procedure for identifying transcendental arguments (TAs) in manuscripts. The procedure must distinguish TAs from:
   (i) a priori arguments
   (ii) inductive/empirical arguments
   (iii) performative-contradiction arguments
   (iv) the modal trap (from "we cannot think X away" to "X must be the case")

   Moreover, we must run two specific tests:
   - Overreach test: Does the argument establish only the conditions of our representation of reality (thus falling to the Sellarsian objection) or does it make a claim about mind-independent reality?
   - Question-begging test: Does the premise that X is a necessary condition already presuppose X?

   Steps of the procedure:

   1. Identify the phenomenon (P) whose possibility is being analyzed.
      - The paper must explicitly state P (e.g., the possibility of experience, judgment, reference, etc.).
      - If not stated, stop: not a TA.

   2. Check the structure: Does the argument claim that X is a necessary condition for the possibility of P?
      - If not, stop: not a TA.

   3. Check the inference: Does the argument infer X from the fact that P is actual (or possible)?
      - Note: TAs typically start from the actuality of P (which entails possibility) and infer that the necessary conditions for P must hold.
      - If the inference is not from the actuality/possibility of P to X, then stop: not a TA.

   4. Distinguish from a priori arguments: An a priori argument might not rely on the structure of necessary conditions for a given phenomenon. Check:
      - Is the argument presented as deriving from pure reason without relying on the conditions of a specific phenomenon (like experience or thought)? If yes, then it might be an a priori argument and not a TA.
      - But note: TAs are a priori in a sense, but they are tied to the conditions of possibility of a given phenomenon. So if the argument does not have the form "P is possible (or actual), and X is necessary for P, therefore X", then it might be a different a priori argument.

   5. Distinguish from inductive/empirical arguments: Does the argument rely on empirical premises or inductive reasoning? If yes, then it is not a TA.

   6. Distinguish from performative-contradiction arguments: 
      - A performative contradiction occurs when the act of asserting a proposition contradicts the content of the proposition. 
      - In a TA, the focus is on the conditions of possibility of a phenomenon (which might include the act of asserting, but not necessarily). 
      - If the argument is that the very act of asserting the negation of X is self-defeating (because the act presupposes X), then it is a performative contradiction argument. 
      - However, note: sometimes TAs can be framed in terms of the conditions of making a judgment (which might look like a performative contradiction). We must be cautious. The key is: 
          - In a performative contradiction, the contradiction is between the act and the content. 
          - In a TA, the contradiction is in the conditions: if P is possible, then X must hold; but if X does not hold, then P is impossible. So if the argument is about the conditions of possibility of an act (like making a judgment) and not about the contradiction in the act itself, it is a TA.

   7. Distinguish from the modal trap: 
      - The modal trap: "We cannot think away X, therefore X must be the case." 
      - In a TA, the necessity of X is derived from the necessity of P and the fact that X is a necessary condition for P. 
      - If the argument does not have a phenomenon P (step 1) and instead moves directly from our inability to conceive the absence of X to the necessity of X, then it is the modal trap.

   8. Overreach test: 
      - Does the conclusion of the argument make a claim about mind-independent reality, or only about the conditions of our representation? 
      - If the argument only establishes that we must represent reality as having feature X (but does not establish that X exists independently of our representations), then it falls to the overreach objection. 
      - This does not necessarily mean it is not a TA, but it flags a potential weakness. The procedure should note this as a problem for the argument, but not as a reason to reject it as a TA.

   9. Question-begging test: 
      - Does the premise that X is necessary for P already presuppose the truth of X? 
      - If the argument assumes X in order to establish that X is necessary for P, then it is question-begging. 
      - This is a substantive criticism of the argument, but again, it doesn't mean it's not a TA. It just means the TA fails.

   The procedure must yield one of the following verdicts:
     - "Transcendental argument" (if it passes steps 1-3 and is not one of the non-TA types in steps 4-7)
     - "Not a transcendental argument" (with the specific alternative: a priori, inductive, performative contradiction, modal trap, or other)
     - "Inconclusive" (if the procedure requires a substantive judgment that the referee cannot make without deeper analysis)

   Now, we run the procedure on the three papers.

   Paper A: Against global skepticism.
     - Argument: To coherently maintain that one's experience might be ungrounded, the subject must be able to distinguish appearance from reality. But that distinction itself requires the reality of objects. Therefore, the skeptic's position is self-undermining.

   Paper B: For the existence of other minds.
     - Argument: A subject can acquire general concepts only through interaction with other speakers. Therefore, the possibility of conceptual thought requires other minds, so other minds exist.

   Paper C: For the reality of the external world.
     - Argument: One cannot coherently doubt the existence of the external world.

   We'll go step by step for each.

   Paper A:

   Step 1: Identify P (the phenomenon). 
      - The phenomenon here seems to be "coherently maintaining that one's experience might be ungrounded" (i.e., the possibility of skeptical doubt). 
      - The paper states it: the phenomenon is the skeptic's position (or the act of holding it).

   Step 2: Structure: Does it claim X is a necessary condition for P?
      - Yes: The ability to distinguish appearance from reality (let's call this X) is necessary for coherently maintaining the skeptical position (P).

   Step 3: Inference: Does it infer X from the actuality/possibility of P?
      - The argument says: if P is to be coherent, then X must hold. But then it argues that X itself requires the reality of objects (Y). So the structure is:
          P (skeptical doubt) is possible only if X (appearance/reality distinction) holds.
          But X is possible only if Y (reality of objects) holds.
          Therefore, P is possible only if Y holds.
      - And since P is actual (we can have skeptical doubts), then Y must hold.
      - So it does infer Y from the actuality of P (via the necessary condition X).

   Step 4: A priori? 
      - The argument does not rely on empirical premises but on the conditions of coherence of a certain thought. It is a priori, but it has the TA structure. So not merely an a priori argument without the TA form.

   Step 5: Empirical? No.

   Step 6: Performative contradiction?
      - The argument is not that the act of asserting skepticism is self-contradictory because the act presupposes the reality of objects. Instead, it is about the conditions of the possibility of having a coherent skeptical doubt. So it is not a performative contradiction argument. 
      - However, note: the skeptic's position is an act of thought. But the argument is not pointing out that in the act of asserting, the skeptic must use concepts that presuppose the external world (which would be performative). Instead, it is saying that for the doubt to be coherent, one must be able to draw the appearance/reality distinction, which in turn requires objects. So it is a TA about the conditions of the possibility of the doubt.

   Step 7: Modal trap?
      - The argument does not move from "we cannot think away the external world" to "the external world exists". Instead, it has a clear phenomenon (skeptical doubt) and necessary conditions for it. So not the modal trap.

   Step 8: Overreach test:
      - The conclusion is that the reality of objects (Y) must hold. This is a claim about mind-independent reality? 
      - The argument moves from the conditions of thought (the distinction between appearance and reality) to the reality of objects. But is this reality mind-independent? The paper argues that the distinction requires the reality of objects, which are independent. However, the overreach objection would question whether we have established the existence of mind-independent objects or merely the necessity of representing objects as mind-independent. 
      - This is a substantive point. The procedure flags: the argument may only establish that we must represent the world as containing mind-independent objects, not that such objects exist independently.

   Step 9: Question-begging test:
      - Does the premise that the appearance/reality distinction (X) requires the reality of objects (Y) already presuppose Y? 
      - It might. The skeptic could question whether the appearance/reality distinction really requires the reality of objects. Maybe it only requires the idea of objects? 
      - This is also substantive.

   Verdict for Paper A: 
