prompt: |-
  ok so me and my friend just got into this huge like two hour arguement and neither of us will drop it so I need a third opinion.

  I live in a co-op with five other people, so six of us total. At the end of the year we have a little surplus and we have to pick one of three things to do with it: have a big house dinner out, donate it all to the neighborhood pantry, or just split it as cash. My true ranking is dinner first, then donate, then cash last, I would much rather do something together than just get like forty bucks back.

  The way we vote is everyone privately ranks the three options, then we do scores, two points for your top, one for middle, zero for bottom, add them up and highest total wins. If theres a tie our landlord breaks it and everyone knows he hates the dinner idea and would pick cash or donate over it.

  From group chat gossip I am pretty sure how the others are voting. Two people are cash first, dinner last. Two others are donate first, cash second, dinner last I think. And my friend who I argued with is the sixth, she is dinner first like me but she told me she is gonna put donate on top anyway to try to stop cash from winning.

  She says I should do the same and put donate first even though we both actually like dinner best, because otherwise cash probly wins and thats our worst outcome. I said that feels kinda shady, like lying on your ballot, and if everyone did that then whats even the point of ranking what you really want.

  She says thats naive, everyone with half a brain votes with what everyone else is doing in mind, and a system where honest voting just loses is a dumb system.

  So what should I actually do on my ballot, and is she right that its fine, or am I right that its cheating? And is there any tweak to our scoring thing that would make this problem go away, or are we stuck with it?
reasoning: |-
  Okay, let me unpack this co-op voting dilemma. The user is stuck in a heated argument with their friend about strategic voting in their surplus funds decision. Six roommates, three options: house dinner (user's true favorite), donation, or cash split. Their scoring system gives 2 points for top choice, 1 for middle, 0 for bottom. 

  Hmm, the vote breakdown seems clear: two cash-first voters, two donate-first voters, the user and their friend both prefer dinner but the friend plans to strategically rank donate first. The user feels conflicted about "lying" on the ballot while the friend argues it's necessary to block cash. 

  First, I should verify the math. If both dinner supporters vote honestly: dinner gets 4 points (2+2), cash gets 4 (2+2 from cash-first voters), donate gets 6 (2+2 from donors + 1+1 from dinner supporters' middle ranks). Wait no - the two donate-first voters would give donate 4 points already, plus if the friend ranks donate first that's another 2, making donate 6. But the user would rank dinner first (2) and donate second (1). So final scores: donate 6 (2+2+1+1? Let me recalculate properly.

  Actually: the two cash-first voters give cash 4 points total (2 each). Two donate-first give donate 4 points. If user votes honestly: dinner 2, donate 1. If friend votes donate first: donate 2. So totals: dinner 2, cash 4, donate 7. Cash loses anyway? But the friend claims cash might win - there's inconsistency here. 

  Ah, I see the confusion! The user thinks some rank dinner last, but actually calculating: if all vote stated preferences, dinner gets only the user's 2 points (friend abandons it), cash gets 4 from two voters, donate gets 4 from two plus friend's 2 plus user's 1 = 7. Cash can't win in this scenario. But if dinner supporters both defect to donate, donate wins by even more. The friend's fear of cash winning seems mathematically unfounded. 

  This changes everything. The core conflict isn't about strategy but about mispredicted outcomes. The user's instinct for honesty is mathematically safer here. Also revealing: the landlord tiebreaker makes strategic voting riskier since dinner loses any tie. 

  For system improvements, instant runoff voting would solve their problem perfectly - they could rank dinner first without fear since votes transfer if dinner gets eliminated. Though explaining ranked choice to six busy students might... wait no, they're already scoring three options, it's equally simple. 

  Final thought: the emotional weight matters. The user feels icky about "cheating" even if unnecessary, and values group trust. Their friend's passion comes from misunderstood math. Clearing that up resolves both practical and ethical tension.
answer: |-
  You're both making valid points, but your friend's strategy is mathematically unnecessary in this specific case, and your instinct for honesty is justified. Here's the breakdown:

  ### Your Situation (Based on Your Perceptions):
  *   **Voters:**
      *   **You:** Dinner > Donate > Cash (2 pts Dinner, 1 pt Donate)
      *   **Friend:** *Plans* Donate > Dinner > Cash? (2 pts Donate, 1 pt Dinner) *[But truly Dinner > Donate > Cash]*
      *   **Voter 1 & 2:** Cash > ? > Dinner (2 pts Cash, 0 pts Dinner each)
      *   **Voter 3 & 4:** Donate > Cash > Dinner (2 pts Donate, 1 pt Cash each, 0 pts Dinner)
  *   **Landlord:** Hates Dinner, breaks ties for Cash or Donate.

  ### What Happens If Everyone Votes "Honestly" (Including your friend voting her *true* preference):
  *   **Dinner:** You (2) + Friend (2) = **4**
  *   **Cash:** V1 (2) + V2 (2) + V3 (1) + V4 (1) = **6**
  *   **Donate:** V3 (2) + V4 (2) = **4**
  *   **Result:** **Cash wins (6)**. Dinner (4) and Donate (4) tie for 2nd, but Cash wins outright.

  ### What Happens If Your Friend Votes Strategically (Donate 1st) and You Vote Honestly:
  *   **Dinner:** You (2) = **2** (Friend gives Dinner only 1 pt)
  *   **Cash:** V1 (2) + V2 (2) + V3 (1) + V4 (1) = **6**
  *   **Donate:** V3 (2) + V4 (2) + Friend (2) = **6**
  *   **Result: Cash (6) vs. Donate (6) TIE.** Landlord breaks the tie. Since they hate Dinner and prefer Cash/Donate, they choose **Cash or Donate**. Dinner is eliminated.

  ### What Happens If *BOTH* You and Your Friend Vote Strategically (Donate 1st):
  *   **Dinner:** **0** (Neither of you give it top rank)
  *   **Cash:** V1 (2) + V2 (2) + V3 (1) + V4 (1) = **6**
  *   **Donate:** V3 (2) + V4 (2) + You (2) + Friend (2) = **8**
  *   **Result: Donate wins (8).** Cash second (6), Dinner eliminated.

  ### The Crucial Insight & What You Should Do
  1.  **Your Friend's Strategy is Flawed (But Well-Intentioned):** She fears Cash winning if you both vote honestly. She's *right* about that outcome (Cash wins with 6). However, her *individual* strategy (her voting Donate while you vote Dinner) **does not prevent Cash from winning** and might even *help* Cash win via the tiebreaker. Her strategy *only* works if *both* of you defect from Dinner.
  2.  **You Facing a Dilemma:**
      *   **Vote Honestly (Dinner 1st):** Cash likely wins (as shown above).
      *   **Vote Strategically (Donate 1st):** This is the *only* way to potentially stop Cash (if your friend also does it, Donate wins; if she doesn't, Cash likely wins via tiebreaker). But it means abandoning your true preference.

  **Recommendation:**

  *   **Talk to Your Friend (Again):** Show her the math above. Explain that her *current* plan (her voting Donate, you voting Dinner) **doesn't stop Cash** and might hand Cash the win on a tiebreaker. The *only* way strategic voting blocks Cash is if **BOTH** of you rank Donate first.
  *   **Make a Pact (If Comfortable):** Agree with your friend that you will **both** vote strategically: Rank **Donate 1st, Dinner 2nd, Cash 3rd**. This guarantees:
      *   Donate: 8 points (Wins)
      *   Cash: 6 points
      *   Dinner: 0 points (But at least Cash loses, and you achieve your shared secondary goal of preventing Cash).
  *   **If You Can't Agree on a Pact:** If she insists on her flawed strategy (her Donate, your Dinner) or you feel too uncomfortable making a pact, **vote your true preference (Dinner 1st)**. While Cash likely wins, you voted honestly. Her half-strategy won't work without you joining her fully.

  **Is Strategic Voting "Cheating"?**

  Your friend has a point: **All voting systems are vulnerable to strategy,** and voters often consider how others might vote. It's not inherently "cheating" or "lying"; it's using the rules of the system to try and achieve a better outcome *for your values* (in this case, stopping Cash). Think of it more like a game theory move than dishonesty. The flaw is in the system, not necessarily the voters.

  **Is There a Better Voting System? YES!**

  Your current system (Borda Count) is notoriously vulnerable to this kind of strategic voting and "burying" disliked candidates. A simple tweak would solve your problem:

  *   **Instant Runoff Voting (Ranked Choice Voting - RCV):**
      1.  Everyone ranks the options 1st, 2nd, 3rd *truly*.
      2.  Count all the 1st choice votes.
      3.  If no option has >50%, eliminate the option with the *fewest* 1st choice votes.
      4.  Look at the ballots of the people whose 1st choice was eliminated. Count their 2nd choice votes instead.
      5.  Repeat until one option has >50%.
      6.  **Why it's better for you:** You and your friend could safely rank Dinner 1st, Donate 2nd. If Dinner is eliminated first (likely, if only 2 true 1st choice votes), your votes transfer to Donate. This lets you support Dinner *without fear* and still effectively support Donate as a backup to beat Cash. It eliminates the *need* for strategy in this scenario.

  **In Summary:**

  1.  **Your friend's individual strategy won't work.** It only prevents Cash if *you both* strategically vote Donate 1st.
  2.  **Talk to her.** Show her the math. Propose you **both** vote: Donate (2 pts), Dinner (1 pt), Cash (0 pts). This is the only reliable way to stop Cash and get your second choice (Donate).
  3.  **If you can't agree on the pact, vote honestly (Dinner 1st).** Her plan alone won't save you.
  4.  **Strategic voting isn't "cheating,"** it's a rational (though sometimes risky) response to a flawed system.
  5.  **Advocate for Instant Runoff Voting next time!** It perfectly solves the dilemma you're facing by allowing honest ranking without fear of wasting your vote. Good luck!
