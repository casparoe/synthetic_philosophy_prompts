  I'm a novelist working on a draft set in a fictional harbour town and I'm trying to make the counsil debates feel beleivable so I've been bending the ear of a friend who does outreach work to get her logic right. She says she is fully behind the New Zealand style decriminalization where you lift criminal penalties off both selling and buying and just use ordinary workplace safety and street nuisance rules plus voluntary support services, she is against the Swedish style Nordic model where buyers are criminalized while sellers are offered exit help because she thinks it still forces rushed screening and makes sellers dodge police, she is also against the German and Dutch style legalization with big licensed zones plus mandatory registration lists and health checks aimed only at sellers because she says it creates a two tier system and gives police too much leverage, though she did approve of this one Dutch city tweak I described where they kept brothels legal but dropped the seller-only medical pass in favour of standard premises inspections, and she hated a pimping law elsewhere that was written so broadly that a seller hiring her own driver or receptionist for safety could be treated as exploited. In my book the mayor now floats what is supposed to be a compromise and I need to know how my friend would react to keep her consistent, namely full removal of criminal penalties for selling and buying with no registry, letting tiny owner-operated places of three or four people operate under normal business and noise rules, but keeping a special licence and quarterly safety inspections only for larger commercial brothels plus a no street solicitation buffer around schools framed as ordinary nuisance law, all backed by city funded but fully voluntary housing and exit help.

  Can you act as a professional philosopher who really knows sex work policy and think this through carefully for me, starting with a bit of brainstorming about what general rule she might be running, because I am kinda stuck. I want you to lay out at least two different principles that both fit all her earlier takes, say what each one predicts she will say about the mayors compromise and give me your best guess about which is more likely her real view and why, plus suggest one further hypothetical case that would seperate the principles if I needed it for a later chapter. Please write your whole answer in continuous prose only with no headings, bullet points, bold text, or tables, just the way you would write an email or a letter to me.
