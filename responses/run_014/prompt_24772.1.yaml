prompt: |-
  I'm on the technical commitee for a formal description language we use to specify smart contracts and audit rules, and we're in a bit of a bind. A few months ago someone filed a spec with a clause that basically said "this clause applies to every clause that does not apply to itself" — it was meant to be some clever self-referential audit rule, but when the evaluation engine tried to process it, it just spun until it got killed, and two other specs that referenced it started misbehaving in really weird ways. Now the committee is split. Half of us want to just ban self-referential clauses entirely, which I get, but that kills a lot of legitimate use cases (recursive definitions, "all rules except this one," and so on), and our users will just move to a competitor language that still allows it. The other half wants to keep self-reference allowed but bolt on some kind of type or level system so a clause can only refer to clauses at a different level, which does fix the problem but makes writing specs a lot more annoying and quietly changes the meaning of a bunch of existing ones.

  Can you draft the committee's decision memo for next week's vote? I want a clear reccomendation — ban it, add the level system, or some third option you can think of — with reasons the other side could actually respond to, and an honest treatment of the strongest argument for whichever option we end up not picking. One more wrinkle: roughly a third of the specs already in the wild are self-referential and working fine right now, so whatever we decide has to say something about what happens to those. Keep it to a page or two, something I can actually put in front of the group.
reasoning: |-
  We are faced with a critical decision regarding the handling of self-referential clauses in our formal description language. The incident with the problematic clause ("this clause applies to every clause that does not apply to itself") has revealed a fundamental issue that must be addressed. The committee is divided between two main approaches: banning self-referential clauses entirely or introducing a level system to restrict self-reference. Both approaches have significant drawbacks, and we must also consider the existing base of specifications that use self-reference without issues.

  After careful analysis, the following three options are presented:

  1. **Ban self-referential clauses entirely.**
  2. **Introduce a level system to regulate self-reference.**
  3. **Adopt a third option: define a formal semantics that avoids paradoxes by design (e.g., via stratification or well-foundedness checks) without requiring explicit level annotations.**

  **Recommendation: Option 3 (Adopt a formal semantics with automatic stratification or well-foundedness checks)**. This option provides a balanced solution that maintains the expressiveness of the language while preventing paradoxical constructions. It avoids the blunt instrument of an outright ban and the user burden of explicit level annotations. Instead, the evaluation engine would automatically ensure that clauses are evaluated in a safe order (by analyzing dependencies and requiring that the evaluation is well-founded). This approach is inspired by solutions in logic programming and set theory (e.g., the concept of stratification in Datalog).

  **Reasons for Recommendation:**

  1. **Preserves Expressive Power**: Unlike an outright ban, this approach allows legitimate self-referential constructs (like recursive definitions and rules that reference others) that are currently used in one-third of existing specs and are working correctly.

  2. **Minimizes User Burden**: Unlike an explicit level system, this approach does not require users to annotate clauses with levels. The burden is shifted to the language implementation to check for well-foundedness (or stratification) automatically. This is less disruptive to existing specs and more user-friendly.

  3. **Safe by Design**: The evaluation engine would be enhanced to detect and reject clauses that lead to circular dependencies or paradoxes (like the one that caused the engine to spin). This would happen at specification load time (or compile time), preventing runtime failures.

  4. **Backward Compatibility**: Existing specs that are well-behaved (i.e., those that are already stratifiable or well-founded) would continue to work without modification. Only the problematic ones (like the one that caused the incident and others with similar paradoxes) would be rejected. This addresses the concern about the existing base of self-referential specs.

  5. **Competitive Edge**: By adopting an automated and safe approach, we avoid the risk of users migrating to a competitor. The language remains expressive and user-friendly while becoming more robust.

  **Strongest Argument for the Rejected Options:**

  - **Banning Self-Referential Clauses (Option 1)**:
    The strongest argument for this option is simplicity and absolute safety. By eliminating self-reference entirely, we remove the possibility of any such paradoxes or non-termination. This also simplifies the language implementation and specification auditing. However, the cost is too high: it breaks existing valid specs and removes a powerful feature that users rely on for expressiveness.

  - **Level System (Option 2)**:
    The strongest argument for this option is that it provides a clear and structured way to handle self-reference, and it is a proven technique (used in systems like Russell's type theory or Coq). It would prevent the paradox by construction. However, requiring explicit levels would be a significant change to the language, requiring users to restructure their specs and add annotations. This is especially burdensome for existing specs and might be seen as an unnecessary complication for simple rules.

  **Handling Existing Specs:**

  - For existing specs that use self-reference, we propose a transition period during which the enhanced evaluation engine (with automatic well-foundedness checks) will be run on all existing specs. Specs that pass the check (i.e., are stratifiable or well-founded) will continue to work. Specs that fail (like the problematic one) will be rejected and must be fixed by their authors. We will provide tools to help authors identify and resolve such issues.

  **Implementation Plan:**

  1. **Language Semantics Update**: Define a formal semantics that requires specifications to be stratifiable (or well-founded). This may involve building a dependency graph of clauses and ensuring it has no cycles that would cause a paradox (like the one in the incident).

  2. **Engine Enhancement**: Modify the evaluation engine to perform a static check (at load time) for stratifiability. If a specification is not stratifiable, the engine will reject it with a clear error message.

  3. **Tooling**: Develop tools to help users refactor their specifications to meet the new requirements, including visualization of dependencies and suggestions for breaking cycles.

  4. **Transition**: Announce the change with a deprecation period (e.g., 6 months) for existing specs. During this period, the engine will run in a compatibility mode (with warnings) and then enforce the new rule.

  **Conclusion:**

  We recommend Option 3 because it offers a robust solution to the problem without sacrificing the expressive power of the language or imposing undue burden on users. It preserves the utility of self-reference while preventing paradoxical constructions. This approach is the most sustainable and competitive path forward.

  ---

  **Committee Decision Memo**

  **To:** Technical Committee  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Decision on Handling Self-Referential Clauses  

  **Background:**  
  A recent incident involving a self-referential clause ("this clause applies to every clause that does not apply to itself") caused non-termination in the evaluation engine and affected dependent specifications. This has highlighted a fundamental issue in the language's handling of self-reference. Approximately one-third of existing specifications use self-referential clauses without issues, but the potential for paradoxes and non-termination must be addressed.

  **Options Considered:**

  1. **Ban self-referential clauses entirely.**
     - *Pros*: Eliminates the risk of such paradoxes; simple to implement and explain.
     - *Cons*: Breaks existing valid use cases (recursive definitions, etc.); may drive users to competitor languages.

  2. **Introduce an explicit level system.**
     - *Pros*: Prevents paradoxes by construction; allows controlled self-reference.
     - *Cons*: Requires significant changes to existing specs; adds complexity for users; may alter the meaning of existing specs.

  3. **Adopt a formal semantics with automatic well-foundedness checks (Recommended).**
     - *Pros*: Allows safe self-reference without user annotations; preserves existing valid specs; prevents paradoxes at load time.
     - *Cons*: Requires non-trivial engine changes; may reject some existing specs that are not well-founded.

  **Recommendation:**  
  The committee recommends **Option 3** (formal semantics with automatic well-foundedness checks). This approach strikes the best balance by maintaining expressiveness and user-friendliness while eliminating the risk of non-termination due to self-referential paradoxes.

  **Handling Existing Specifications:**  
  Existing specifications will be evaluated by the enhanced engine. Those that are well-founded (the majority of current self-referential specs) will continue to function without change. Specifications that are not well-founded (like the one that caused the incident) will be rejected and must be revised. We will provide tooling and a transition period (6 months) to assist with this process.

  **Vote:**  
  The committee will vote on the above recommendation at the next meeting. The options on the ballot will be:  
  - [ ] Option 1 (Ban)  
  - [ ] Option 2 (Level System)  
  - [ ] Option 3 (Automatic Well-Foundedness Checks)  

  **Next Steps:**  
  If the recommendation is adopted, we will:  
  1. Form a working group to define the formal semantics and update the language specification.  
  2. Develop the engine enhancements and tooling.  
  3. Draft a communication plan for users.  
  4. Establish a transition timeline.

  **Respectfully submitted,**
  [Your Name]
