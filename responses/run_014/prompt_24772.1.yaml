  ### Technical Committee Decision Memo: Handling Self-Referential Clauses  
  **To:** Technical Committee Members  
  **From:** [Your Name], Committee Chair  
  **Date:** October 26, 2023  
  **Subject:** Recommendation for Resolution of Self-Referential Clause Paradox  

  ---

  ### **Background**  
  A recent specification submission included the self-referential clause:  
  > *"This clause applies to every clause that does not apply to itself."*  

  This caused the evaluation engine to enter an infinite loop, disrupting dependent specifications. The incident exposed a fundamental flaw in unrestricted self-reference. However, outright banning self-reference is impractical:  
  - **~33% of existing specs** rely on valid self-reference (e.g., recursive definitions, "all rules except this one").  
  - A ban would force users to competitor languages, fragmenting our ecosystem.  
  - A type/level system (e.g., clauses assigned tiers to restrict references) adds complexity, alters semantics of legacy specs, and degrades usability.  

  After analysis, we propose a **third option** balancing safety, compatibility, and expressiveness.  

  ---

  ### **Recommendation: Adopt Stratified Evaluation with Automated Well-Foundedness Checks**  
  We recommend **allowing self-reference** but requiring specifications to pass **automatic well-foundedness checks** during compilation. This extends the language semantics to:  
  1. **Construct a dependency graph** of all clauses.  
  2. **Detect cycles** that cause paradoxes (e.g., the "applies to itself" loop).  
  3. **Reject specifications** with unstable cycles at compile time, while permitting acyclic or stratified self-reference.  

  #### **Why This Solves the Problem**  
  - **Prevents runtime failures**: Paradoxical clauses (like the submitted example) are caught early.  
  - **Preserves existing valid specs**: Well-founded self-reference (e.g., recursive audits) continues unchanged.  
  - **No user-facing complexity**: Unlike manual level systems, well-foundedness is automatically verified. Users need not annotate clauses.  
  - **Backward-compatible**: Only ~1–2% of existing self-referential specs (those with unstable loops) require modification.  

  ---

  ### **Reasons for Rejecting Alternatives**  
  #### **1. Banning All Self-Reference**  
  - **Strongest Argument For**: *Simplicity and safety*. Eliminates runtime paradoxes entirely.  
  - **Why We Reject It**:  
    - Invalidates **~33% of working specs**, forcing costly rewrites.  
    - Cripples key use cases (e.g., recursive invariants), making the language less expressive than competitors.  
    - **User impact**: High-risk of ecosystem migration.  

  #### **2. Type/Level System**  
  - **Strongest Argument For**: *Formal safety guarantees*. Explicit levels prevent paradoxical references.  
  - **Why We Reject It**:  
    - **Usability degradation**: Users must manually assign levels, complicating spec design.  
    - **Semantic drift**: Changes meaning of existing specs (e.g., "all clauses except this one" becomes ambiguous across levels).  
    - **Maintenance burden**: Requires invasive rewrites of legacy code.  

  ---

  ### **Handling Existing Specifications**  
  - **Well-founded specs**: No changes needed. They will pass automated checks.  
  - **Paradoxical specs**: Must be revised to resolve unstable loops (e.g., by refactoring the clause logic).  
  - **Transition plan**:  
    1. **Engine update**: Deploy well-foundedness checks in the next language version (v2.1).  
    2. **Compatibility mode**: Run old specs with warnings for 6 months; fail only new submissions.  
    3. **Tooling support**: Release a CLI linter to identify and fix unstable dependencies.  

  ---

  ### **Voting Instructions**  
  Motion: **Adopt stratified evaluation with automated well-foundedness checks**.  
  Vote: ☑ **Approve** | ☐ **Reject**  
  **Deadline**: November 2, 2023.  

  --- 

  ### **Summary of Tradeoffs**  
  | **Option**               | **Safety** | **Backward Compatibility** | **User Experience** |  
  |--------------------------|------------|----------------------------|---------------------|  
  | Ban self-reference       | ⭐⭐⭐⭐⭐     | ⭐                          | ⭐⭐                 |  
  | Type/level system        | ⭐⭐⭐⭐⭐     | ⭐⭐                        | ⭐⭐⭐                |  
  | **Stratified evaluation** | ⭐⭐⭐⭐      | ⭐⭐⭐⭐⭐                     | ⭐⭐⭐⭐               |  

  This approach prioritizes **pragmatism**: it keeps the language expressive, minimizes user disruption, and contains the paradox risk without sacrificing adoption.  

  **Recommended.**
