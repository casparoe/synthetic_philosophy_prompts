  For example, the first sentence: "Whatever physically realizes the right pattern... is performing the same computation." Philosophers might accept this under computationalism, but neuroscientists could wince if it oversimplifies biological processes. Turing's theorem is about formal systems, not directly about brains. Applying it to neurons requires assuming neural processes are rule-governed like algorithms, which is contentious.

