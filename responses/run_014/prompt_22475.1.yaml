  I need to explain how the hole argument claims indeterminism. If you have two metric tensors related by a diffeomorphism, they represent the same physical reality. But if spacetime points have independent identity, then these are different. That's the crux. The resolution comes from recognizing that the mathematical points don't have physical identity; only the geometry (manifold plus metric) defines physical reality. The indeterminism arises only if you insist on labeling points without reference to the metric. So, it's an artifact of how initial data is specified.

