  Balancing both sides: while Augustine’s view is foundational, modern professional ethics sometimes allow for protective deception in extreme cases. However, the student should be reminded to use truthful means first. A dismissal with educational guidance honors both the policy’s spirit and Augustine’s emphasis on truth, without punishing altruism.

