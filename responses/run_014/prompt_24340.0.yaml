  I'm writing a chapter on solutions to the Liar paradox and I want a comparative judgment, not a survey. Please tier the following six approaches into three tiers — Tier 1, an approach I'd be comfortable building a general theory of truth on; Tier 2, workable but with a cost I'd have to defend; Tier 3, one I'd avoid as a general theory — on a single axis: how much of the combination of (i) a single, unstratified truth predicate and (ii) full classical logic in one language, including the principle of explosion, each approach preserves while still defusing the Liar. The candidates are Tarski's stratified hierarchy of truth predicates, Kripke's minimal fixed-point account with truth-value gaps, Gupta–Belnap revision theory, the dialetheist paraconsistent approach that accepts the Liar as both true and false, a deflationist move that dissolves the paradox by denying there is any deep theory of truth to be had, and a supervaluationist treatment. For each candidate, give one or two sentences on why it lands in its tier on that axis, and name the specific principle it sacrifices — for instance a single unstratified predicate, bivalence, explosion, or unrestricted application of the T-schema. Then close with a short paragraph telling me which of the two things, (i) or (ii), is the more expensive to preserve, and why — that is, which one forces you to give up more of the rest of the apparatus.
