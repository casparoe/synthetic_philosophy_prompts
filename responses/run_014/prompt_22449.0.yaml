answer: |-
  You've hit on a profound and hotly debated point in welfare economics and social choice theory. Your confusion is justified—Harsanyi's theorem *is* often misrepresented, and its logical status hinges on subtle nuances. Let's dissect it step by step:

  ### 1. **What Harsanyi Actually Assumes: The "Baked-In" Cardinality**
     - **Individual utilities are vNM (cardinal expected utility)**: Yes, Harsanyi starts with individuals whose preferences satisfy the von Neumann-Morgenstern (vNM) axioms. This gives each agent a **cardinal utility function unique up to affine transformations** (i.e., scale and origin: \(u_i \rightarrow a_i u_i + b_i\)).
     - **Social preferences are also vNM-rational**: The social planner/observer has preferences over social lotteries that also satisfy vNM axioms, implying a *social* vNM utility function.

     ➠ **Crucially**: At this stage, utilities are *cardinal but not interpersonally comparable*. Scaling/zero-points are arbitrary per individual. No comparisons like "Alice's utils are worth twice Bob's" are possible yet.

  ### 2. **The Axioms that "Force" Comparability**
     Harsanyi adds two key axioms:
     - **Weak Pareto**: If all individuals weakly prefer lottery A to B, society does too.
     - **Impartiality/Anonymity**: Social preferences are symmetric in individuals (or **Independence of Irrelevant Alternatives** in some formulations).

     These seem normatively lightweight, but their interaction with vNM structure is explosive.

  ### 3. **The "Miracle": How Comparability Emerges**
     Here’s where the theorem does genuine work:
     - The social utility function \(W\) must be a **linear aggregation** of individual utilities:  
       \[
       W = \sum_{i=1}^n \lambda_i u_i \quad (\lambda_i > 0)
       \]
     - **Why the \(\lambda_i\) aren't arbitrary**:  
       The affine freedom (\(u_i \rightarrow a_i u_i + b_i\)) is constrained by **Pareto**. If you rescale Alice's utility (\(u_A \rightarrow k u_A\)), Pareto forces society to respond proportionally. The weights \(\lambda_i\) *adjust* to keep social rankings consistent.
       - Example: If you double Alice's utility scale, halving her \(\lambda_A\) preserves social preferences. The *product* \(\lambda_i u_i\) is invariant, making utils **ratio-comparable** across people.

     ➠ **The key insight**: Pareto ties individual scales together. The "comparability" is not assumed—it's the *only way* to reconcile individual vNM cardinality with social vNM rationality and Pareto.

  ### 4. **What the Theorem *Does* and *Doesn't* Establish**
     - ✅ **It derives interpersonal comparability from consistency**: You *can* compare utility *differences* across people (\(\Delta u_i\) vs. \(\Delta u_j\)) because weights \(\lambda_i\) fix the ratios of units.  
       *This is non-trivial:* Starting from non-comparable cardinal utilities, Pareto + vNM social rationality forces comparability.
     - ✅ **It derives utilitarianism**: The SWF *must* be a weighted sum.
     - ❌ **It does not empirically justify comparability**: The \(\lambda_i\) depend on the *observer's* vNM preferences (or original scaling). Weights are still relative—e.g., setting \(\lambda_1 = 1\) is conventional.
     - ❌ **It doesn't solve the "philosophical" problem**: Whether vNM utilities represent "welfare" or whether summing them is ethical remains open.

  ### 5. **Common Misinterpretations & Your Insight**
     - **"Trivial result?"**: Not trivial. The affine freedom *seems* to prevent comparability, but Pareto **collapses the degrees of freedom**. This is profound (and why Harsanyi won a Nobel).
     - **"Circularity?"**: Your instinct is partly right—**cardinality is assumed upfront**. But comparability is *not* assumed; it's *derived* from how Pareto binds scales. Philosophically, it shows that *if* you accept vNM rationality for society, comparability is unavoidable.
     - **The "Gotcha"**: Critics (e.g., Sen, Mongin) note that Harsanyi's setup **smuggles in a strong form of individualism**. If you reject that social rationality must mirror vNM axioms, the result unravels.

  ### 6. **Writing Your Dissertation: Key Angles**
     - **Technical nuance**: Emphasize how affine transformations interact with Pareto. Use Weymark's (1991) framing: Pareto forces the "zeroing out" of scale/origin freedom.
     - **Philosophical debate**: Contrast with:
       - **Ordinalists** (e.g., Robbins): Reject cardinality entirely.
       - **Frequentist utilitarians** (e.g., classical utilitarians): Assume direct comparability.
       - **Harsanyi as middle-ground**: Comparability emerges from rational choice constraints.
     - **Limitations**: Discuss whether vNM utilities reflect "welfare" (e.g., if \(u_i\) encodes risk aversion, should it affect social weights?).

  ### Bottom Line
  Harsanyi's theorem **transforms non-comparable cardinal utilities into comparable ones** via Pareto + social rationality. It doesn't "create" comparability from nothing (cardinality is assumed), but it shows that **admitting cardinal utilities while demanding Pareto-consistent social rationality *entails* comparability**. This is a deep result—but its normative force depends on accepting vNM rationality for society. Your skepticism is well-placed; the theorem is profound but not metaphysically miraculous.

  **Key References for Your Diss:**  
  - Harsanyi, J. (1955). *Cardinal Welfare, Individualistic Ethics...*  
  - Weymark, J. (1991). *A Reconsideration of the Harsanyi-Sen Debate...*  
  - Mongin, P. (1994). *Harsanyi's Aggregation Theorem...*  
  - Sen, A. (1986). *Social Choice Theory*, Ch. 11.
