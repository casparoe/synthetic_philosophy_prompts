prompt: |-
  I'm prepping a session on Goodhart's law and I want a case built to order, rather than the usual cobra-farm anecdote that everyones heard and that isn't even the interesting kind of failure.

  Spec: a realistic institutional setting — hospital, school, firm, funder, sports team, whatever you like, one paragraph, no AI/ML examples — in which a performance metric comes apart from the thing it's meant to track, under all of the following at once:

  - nobodies acting in bad faith and nobody's optimising against the metric;
  - the metric isn't a bad measure: for each person or unit measured it's unbiased, and a higher score really does mean a higher underlying value on average;
  - the metric doesn't causally change the thing it measures, and no one's stretching it into a range where its relationship to that thing breaks down;
  - and yet the institution uses it exactly as intended and systematically ends up rewarding the wrong people.

  Then do the analysis. I want to know what's actually going on, why it's structural rather than a mistake anybody made, how the distortion changes when the selection gets harsher (top 10% vs top 1% — I want a direction, and a rough sense of magnitude), what single change defuses it without giving up measurement altogether, and how someone who thinks this is just ordinary measurement error would push back.

  Format, please, and in British English:

  **The case** — the scenario itself, about 150 words, no commentary.
  **The mechanism** — what's really happening, about 150 words.
  **Turn the dial** — what happens as the selection gets harsher, about 80 words.
  **The fix** — one concrete change, about 80 words.
  **The comeback** — the strongest objection to your diagnosis, then your reply, about 120 words.

  One more thing: I'd rather the case be one where a casual observer would look at the metric and think it's working fine. And if you think the spec is unsatisfiable as stated, don't fudge it — say so and tell me which condition has to give.
reasoning: |-
  Okay, let me tackle this fascinating Goodhart's law case challenge. The user wants something beyond the tired cobra farm example - a fresh institutional scenario where metrics backfire despite everyone acting in good faith and the measure itself being statistically sound. 

  Hmm, hospital performance metrics come to mind as a rich area for this. The key is designing a case where the metric is genuinely informative at individual level but causes systemic distortion under selection pressure. Emergency department wait times could work beautifully - it's unbiased per clinician, doesn't causally affect outcomes, yet harsh selection would systematically reward those handling simpler cases.

  The structural problem lies in unobserved heterogeneity. When managers select "top performers" based on average wait times, they're actually selecting for casemix difficulty rather than skill - but this only becomes visible at the system level. As selection gets harsher (top 1% vs top 10%), the distortion magnifies because only those with ultra-simple cases can achieve extreme wait times.

  For the fix, risk-adjusted measurement seems most elegant - it preserves the metric's value while neutralizing the casemix confounder. The pushback would likely come from measurement purists arguing about complexity, but the reply writes itself: when underlying variance exists, refusing to account for it guarantees selection bias.

  Better avoid any AI/ML examples per spec, and use British English throughout. The hospital setting feels visceral enough that casual observers would nod along thinking the metric makes sense, which heightens the revelation when the systemic flaw emerges. Should work within all constraints without fudging conditions.
answer: |-
  **The case**  
  At St. Margaret’s Hospital Trust, consultants in general surgery are assessed annually by "Mean Theatre Turnaround Time" (MTTT) – the average time between one patient leaving the operating theatre and the next entering. Management introduced MTTT to reduce delays and increase surgical capacity. The metric is unbiased: for each consultant, a lower MTTT genuinely indicates efficient workflow preparation and handovers, saving 5-8 minutes per case. Consultants strive to improve their MTTT through better team coordination and pre-op checks, with no gaming. Yet, when the Trust promotes the "top 10%" fastest consultants, those selected overwhelmingly specialise in minor, elective procedures (e.g., hernia repairs), while consultants handling complex cancer resections or trauma are consistently overlooked despite similar efficiency within their case types.

  **The mechanism**  
  The distortion arises from unobserved heterogeneity in case complexity. MTTT is an unbiased metric *for each consultant*: faster times genuinely reflect better efficiency within their typical caseload. However, complex surgeries intrinsically require longer setup (specialised equipment, larger teams, post-op stabilisation). Consultants aren’t "optimising against" MTTT by avoiding complex cases; they work within their specialties. The institution’s error lies in ranking *all* consultants globally on MTTT without adjusting for case-mix. Thus, the selection process systematically rewards those with intrinsically faster-turnaround caseloads, mistaking low intrinsic complexity for exceptional efficiency. The metric correlates with the underlying value (efficiency) within groups, but the *comparison* across groups is invalid.

  **Turn the dial**  
  As selection gets harsher (e.g., "top 1%" vs. "top 10%"), the distortion intensifies. The absolute MTTT values required become increasingly unattainable for consultants handling complex cases. The promoted cohort narrows almost exclusively to those performing the simplest, highest-volume procedures (e.g., cataract surgeries or minor dermatology excisions). The performance gap *within* the low-complexity group becomes negligible, making selection arbitrary at the extreme, while truly skilled surgeons handling severe trauma or multi-organ transplants are entirely excluded from consideration regardless of their relative efficiency.

  **The fix**  
  Implement **risk-adjusted MTTT percentiles within specialty groups**. Instead of a global ranking, compare consultants against peers handling similar case complexity (e.g., vascular vs. breast surgery). Reward those in the top percentiles *within their group*. This preserves MTTT as a valid efficiency measure while neutralising the confounding effect of intrinsic case difficulty, ensuring complex-case surgeons aren’t penalised structurally.

  **The comeback**  
  **Objection:** *"This is simple sampling error. The complex-case surgeons just happen to be unlucky outliers this year. With more data or a larger pool, the metric would average out fairly."*  
  **Reply:** Sampling error implies random variation. This is systematic bias: the underlying distribution of possible MTTT scores is fundamentally different across groups due to intrinsic factors. More data only refines the *within-group* estimates; it doesn’t correct the *between-group* comparability flaw. A consultant doing liver transplants could be the most efficient in their specialty and still never reach the absolute MTTT scores of a consultant doing carpal tunnels, no matter the sample size. The institution is mistakenly interpreting a difference in *caseload difficulty* as a difference in *performance*.
