prompt: |-
  I work in procurement for a mid-sized grocery chain, and every quarter our sustainability team ranks proposed sourcing changes partly by how much harm they do to wild animals; the top-ranked change gets the first supplier switch of the year, and I'm the one who signs off. I have no ecologist on staff and I've been working out the logic of this on my own, and I keep getting stuck: I can't tell how to separate the harm that comes from the land a product takes, the harm from the animals killed while growing and harvesting its feed, and the harm from its production itself, and the insect deaths in crop cultivation are in numbers I have no way to count. Please write a decision procedure my team can run on a proposed sourcing change within about two days, grounded in whatever the animal-ethics literature actually says about prioritizing under deep uncertainty: the questions to ask in order, what counts as a sufficient answer to each when all I have are order-of-magnitude guesses, how to handle the question of the insects explicitly — that is, show at which step the ranking changes depending on how much moral weight we give insects versus mice versus birds — and the point at which the procedure has to stop and hand the question to a person because it is one of values rather than facts. Then run it on two proposals: replacing a beef line with a chicken line, and replacing the chicken line with a grain-based plant line. Be honest about where the procedure will misfire and what it cannot do, and tell me which proposal it favors even if that's not the answer I'd like. End your reply with a single line beginning "Verdict:" that states which of the two proposals the procedure ranks as producing the larger reduction in wild animal harm per serving, or "indeterminate" if it cannot.
reasoning: |-
  We are designing a decision procedure for assessing the harm to wild animals from a proposed sourcing change. The procedure must be grounded in animal ethics literature and account for deep uncertainty. We break the problem into steps, focusing on land use, feed production, direct harm during cultivation and harvest, and the moral weight of different animals (insects, mice, birds, etc.). The procedure will be a series of questions to ask in order, with guidance on what counts as a sufficient answer and how to handle uncertainty.

  ### Decision Procedure: Assessing Wild Animal Harm in Sourcing Changes

  **Step 1: Determine the change in land use per serving (hectares/serving)**
     - **Question:** How much land (in hectares) is required per serving for the current product versus the proposed product? (Include both direct land for cultivation and indirect land for feed if applicable.)
     - **Handling uncertainty:** Use order-of-magnitude estimates. If the difference is less than a factor of 2, consider it negligible. Otherwise, note the direction (increase or decrease) and the magnitude (e.g., 10x less land).
     - **Why?** Land use is a primary driver of wildlife habitat loss. Less land typically means less harm.

  **Step 2: Estimate the change in expected wild animal deaths per hectare per year (deaths/ha/year)**
     - **Question:** For the land types involved (e.g., cropland for feed, pasture for grazing), what is the typical mortality rate for wild animals (including insects, mammals, birds, reptiles, amphibians) per hectare per year?
     - **Handling uncertainty:** Use literature averages. For example:
          - Pasture (beef): ~5-15 mammals/birds/ha/year (from studies of mowing and harvesting impacts), and insects in the millions per hectare per year (but note: insect numbers are highly variable and often not well-studied).
          - Cropland (feed for chicken or plant products): ~10-50 mammals/birds/ha/year (from plowing, planting, harvesting) and again millions of insects.
     - **Why?** Different land uses have different mortality rates. Intensive cropland may have higher mortality per hectare than pasture.

  **Step 3: Account for the change in the number of servings produced per hectare per year (servings/ha/year)**
     - **Question:** How many servings does one hectare produce in a year for the current and proposed products?
     - **Handling uncertainty:** Calculate using yield data. If the proposed product requires less land per serving, then the number of servings per hectare is higher. This step adjusts the animal deaths per serving by combining Steps 1 and 2: 
          - Deaths per serving = (deaths per hectare per year) / (servings per hectare per year)
     - **Why?** We care about harm per serving, so we must account for efficiency.

  **Step 4: Consider the direct harm from production (non-land-related deaths)**
     - **Question:** Are there any significant direct harms in the production process (e.g., during slaughter, processing) that affect wild animals? (This is less common but might occur, for example, if the production involves trapping or poisoning pests in storage facilities.)
     - **Handling uncertainty:** If such harms are present, estimate the number of deaths per serving. Otherwise, set to zero. This step is often negligible for wild animals compared to land use, but it might be relevant for stored product pests.

  **Step 5: Account for the moral weight of different animals**
     - **Question:** Assign relative moral weights to insects, small mammals (like mice), birds, etc. based on the organization's values. The literature varies: some assign weights based on sentience, neural complexity, or ability to suffer. For instance:
          - Option A: Equal consideration per individual (1:1:1 for insect:mouse:bird) -> then total deaths matter.
          - Option B: Weight by brain size or some sentience indicator (e.g., 1:100:1000, meaning 1 bird death = 100 mouse deaths = 1000 insect deaths).
          - Option C: Threshold (e.g., only count vertebrates and ignore insects).
     - **Handling uncertainty:** Since we don't have a fixed value system, we must run the procedure under two or three plausible weightings and see if the conclusion changes. If the conclusion is robust across a range, then we can proceed. Otherwise, we note the uncertainty and that the decision depends on value judgments.

  **Step 6: Combine the information and calculate the total harm per serving**
     - Calculate the total harm per serving for the current and proposed product:
          - Total harm = [ (deaths per hectare per year for the land type) * (hectares per serving) ] + direct harm per serving
          - Then, adjust by moral weights: 
              Total weighted harm = Σ (number of deaths for animal group i * moral weight of group i)
     - Compare the harm per serving of the current product and the proposed product to find the reduction.

  **Step 7: Handling deep uncertainty and stopping points**
     - If at any step the uncertainty is too high (e.g., we cannot even get order-of-magnitude estimates for a key factor) or the moral weighting step leads to divergent conclusions, then the procedure stops and the decision must be made by a human based on the organization's values.
     - The procedure must also stop if the analysis reveals that the proposed change might increase harm in a way that is not captured by the model (e.g., if the new crop requires more pesticides that are more toxic to birds).

  **Step 8: Sensitivity Analysis**
     - Run the calculations with the most optimistic and pessimistic estimates for each uncertain parameter. If the range of outcomes does not change the ranking (e.g., the proposed change always reduces harm), then the decision is robust. Otherwise, note the risk.

  ### Applying the Procedure to Two Proposals

  We'll apply the procedure to:
  1. Replacing a beef line with a chicken line.
  2. Replacing the chicken line with a grain-based plant line.

  We use average data from the literature. Note: these are rough estimates and will vary by region and farming practices.

  #### Proposal 1: Replace beef with chicken

  **Step 1: Land use per serving**
     - Beef: requires about 20 m² per serving (0.002 ha/serving) [Note: This is an average for beef, including feed and pasture. Some sources say much higher.]
     - Chicken: requires about 3 m² per serving (0.0003 ha/serving) [including feed].
     - Change: Reduction by a factor of about 6.7 (so chicken uses less land).

  **Step 2: Deaths per hectare per year**
     - Beef: Pasture and feed cropland. Pasture may have lower mortality per hectare than cropland. Let's assume:
          - Pasture: 10 mammals/birds/ha/year and 1 million insects/ha/year (due to grazing and occasional mowing).
          - Feed cropland (for beef): 20 mammals/birds/ha/year and 2 million insects/ha/year (typical for corn/soy).
          - Average for beef: Since much of the land is pasture, we'll use a weighted average. Suppose 70% pasture and 30% cropland: 
              Mammals/birds: (0.7*10 + 0.3*20) = 13/ha/year
              Insects: (0.7*1M + 0.3*2M) = 1.3M/ha/year
     - Chicken: Feed cropland (corn/soy) and some pasture for free-range? But most chicken is intensive. Assume:
          - Cropland: 20 mammals/birds/ha/year and 2 million insects/ha/year.

  **Step 3: Servings per hectare per year**
     - Beef: 1 serving requires 0.002 ha -> 500 servings/ha/year.
     - Chicken: 1 serving requires 0.0003 ha -> about 3333 servings/ha/year.

  **Step 4: Direct harm in production**
     - Beef: Slaughter of the cow (but that's a domesticated animal, not wild). We are focusing on wild animals, so negligible.
     - Chicken: Similarly, slaughter of chicken is domesticated. But note: chicken feed production might involve more pesticides and thus more deaths? We accounted per hectare in step 2.

  **Step 5: Moral weights**
     - We will consider three scenarios:
          Scenario A: Equal per individual (1:1:1 for insect:mouse:bird) -> then total deaths (including insects) dominate.
          Scenario B: Weight by brain mass (approximate): insect=1, mouse=100, bird=200 (relative to insect).
          Scenario C: Only count vertebrates (insects=0).

  **Step 6: Calculate harm per serving for beef and chicken**

  For beef:
     - Mammals/birds: 13 deaths/ha/year -> per serving: 13 / 500 = 0.026 deaths/serving.
     - Insects: 1.3M deaths/ha/year -> per serving: 1.3e6 / 500 = 2600 insects/serving.

  For chicken:
     - Mammals/birds: 20 deaths/ha/year -> per serving: 20 / 3333 ≈ 0.006 deaths/serving.
     - Insects: 2M deaths/ha/year -> per serving: 2e6 / 3333 ≈ 600 insects/serving.

  Now, under the three moral weight scenarios:

  Scenario A (equal):
     - Beef harm: 0.026 (vertebrates) + 2600 (insects) = 2600.026
     - Chicken harm: 0.006 + 600 = 600.006
     - Reduction: Chicken has lower harm.

  Scenario B (weighted by brain mass, relative to insect=1):
     - Assume: mouse and bird deaths are both vertebrates. We don't have a breakdown between mice and birds. Let's assume 50% mice (weight=100) and 50% birds (weight=200). Then average vertebrate weight = (100+200)/2 = 150 per death.
     - Beef:
          Vertebrates: 0.026 * 150 = 3.9
          Insects: 2600 * 1 = 2600
          Total: 2603.9
     - Chicken:
          Vertebrates: 0.006 * 150 = 0.9
          Insects: 600 * 1 = 600
          Total: 600.9
     - Reduction: Chicken has lower harm.

  Scenario C (only vertebrates, insects=0):
     - Beef: 0.026
     - Chicken: 0.006
     - Reduction: Chicken has lower harm.

  In all scenarios, replacing beef with chicken reduces harm.

  #### Proposal 2: Replace chicken with a grain-based plant line (e.g., tofu from soy)

  **Step 1: Land use per serving**
     - Chicken: 0.0003 ha/serving (as above).
     - Plant-based (soy): requires about 0.0001 ha/serving (for tofu) [Note: This is an estimate. Soy is efficient.]

  **Step 2: Deaths per hectare per year**
     - Plant-based (soy): same as other cropland: 20 mammals/birds/ha/year and 2 million insects/ha/year.

  **Step 3: Servings per hectare per year**
     - Chicken: 3333 servings/ha/year (from above).
     - Plant-based: 1/0.0001 = 10,000 servings/ha/year.

  **Step 4: Direct harm in production**
     - Negligible for wild animals.

  **Step 5: Moral weights** (same scenarios)

  **Step 6: Calculate harm per serving for chicken and plant-based**

  For chicken (from above):
     - Mammals/birds: 0.006 deaths/serving
     - Insects: 600 insects/serving

  For plant-based (soy):
     - Mammals/birds: 20 deaths/ha/year / 10,000 servings/ha/year = 0.002 deaths/serving.
     - Insects: 2M / 10,000 = 200 insects/serving.

  Now, under the three scenarios:

  Scenario A (equal):
     - Chicken: 0.006 + 600 = 600.006
     - Plant: 0.002 + 200 = 200.002
     - Reduction: Plant has lower harm.

  Scenario B (weighted):
     - Chicken: vertebrates = 0.006 * 150 = 0.9; insects=600 -> total 600.9
     - Plant: vertebrates = 0.002 * 150 = 0.3; insects=200 -> total 200.3
     - Reduction: Plant has lower harm.

  Scenario C (only vertebrates):
     - Chicken: 0.006
     - Plant: 0.002
     - Reduction: Plant has lower harm.

  ### Comparison of the Two Proposals

  We are comparing the reduction in harm when replacing beef with chicken versus replacing chicken with a plant-based line. But note: the procedure is to compare the harm per serving of the current and proposed product for each change. We are interested in which change leads to a larger reduction in harm per serving.

  - Replacing beef with chicken:
     - Reduces harm from beef (2600.026 in Scenario A) to chicken (600.006) -> reduction of 2000.02 per serving (in Scenario A).
     - In Scenario B: reduction from 2603.9 to 600.9 -> 2003 reduction.
     - In Scenario C: from 0.026 to 0.006 -> 0.02 reduction.

  - Replacing chicken with plant:
     - Reduces harm from chicken (600.006 in Scenario A) to plant (200.002) -> reduction of 400.004 per serving.
     - In Scenario B: from 600.9 to 200.3 -> 400.6 reduction.
     - In Scenario C: from 0.006 to 0.002 -> 0.004 reduction.

  Therefore, in terms of absolute reduction per serving:
     - In Scenario A: beef->chicken reduces by 2000, chicken->plant reduces by 400 -> beef->chicken has a larger reduction.
     - In Scenario B: beef->chicken reduces by 2003, chicken->plant by 400.6 -> beef->chicken has a larger reduction.
     - In Scenario C: beef->chicken reduces by 0.02, chicken->plant by 0.004 -> beef->chicken has a larger reduction.

  But note: the reduction in harm from beef to chicken is larger in absolute terms because beef starts at a much higher level. However, we must also consider the baseline: if we are starting from beef and going to chicken, we avoid a lot of harm. But if we are starting from chicken and going to plants, we avoid less harm because chicken is already better than beef.

  However, the question is: which proposal (replacing beef with chicken OR replacing chicken with a plant line) produces the larger reduction in wild animal harm per serving? The above calculations show that replacing beef with chicken gives a larger reduction per serving than replacing chicken with plants.

  ### Caveats and Where the Procedure Misfires

  1. **Land use estimates:** Our land use numbers are rough. If beef production in the specific supply chain uses much less land (e.g., if it's from a very efficient feedlot system) then the benefit of chicken might be less. Similarly, if the chicken line is free-range and uses more land, then the benefit of replacing it with plants might be larger.

  2. **Mortality rates:** The per-hectare death rates are highly variable. Pasture might have lower insect mortality than we assumed, or cropland might have higher.

  3. **Insect deaths:** The numbers for insects are huge and uncertain. If we assign very little moral weight to insects (Scenario C) then the absolute reductions become small and the relative differences might change. But in our analysis, even in Scenario C, replacing beef with chicken still has a larger absolute reduction (though both are small).

  4. **Indirect effects:** The procedure does not account for long-term effects like deforestation (which might be associated with beef in some regions) or changes in pesticide use. Also, it doesn't account for the fact that plant agriculture might use less pesticide per hectare than feed crops for chicken? We assumed the same mortality rates per hectare for both chicken feed and plant food.

  5. **Moral weights:** The procedure requires a value judgment on the moral weight of insects. We ran three scenarios and found that in all, replacing beef with chicken had a larger reduction per serving than replacing chicken with plants. However, if we assigned a very high moral weight to insects (say, 1:1 with vertebrates) then the absolute numbers of insects dominate and both changes are beneficial, but the beef-to-chicken change avoids more insects per serving because beef uses more land and thus causes more insect deaths per serving.

  6. **Other considerations:** The procedure does not consider:
     - The welfare of domesticated animals (the cow and chicken) which might be a separate ethical concern (but the question is about wild animals).
     - Climate change or other environmental factors that might indirectly affect wildlife.

  ### Verdict

  Given the above analysis, the procedure ranks replacing the beef line with a chicken line as producing the larger reduction in wild animal harm per serving compared to replacing the chicken line with a grain-based plant line.

  However, note that both changes reduce harm, but the beef-to-chicken change yields a larger absolute reduction per serving.

  Verdict: Replacing beef with chicken produces the larger reduction per serving.
answer: |-
  ### Decision Procedure for Assessing Wild Animal Harm in Sourcing Changes  
  This procedure is grounded in animal ethics literature (e.g., Singer's *Animal Liberation*, Tomasik's work on wild-animal suffering) and prioritization under deep uncertainty. It uses a **five-step process** with explicit handling of uncertainty, moral weights, and stopping rules. Each step must be completed in order, using order-of-magnitude estimates (e.g., 1, 10, 100). If uncertainty prevents progress, default to worst-case values or halt for human judgment.  

  #### Procedure Steps:  
  1. **Estimate Land Use Change (ha/serving)**  
     - **Question:** What is the land footprint per serving (including feed, if applicable) for the current vs. proposed product?  
     - **Sufficient Answer:** Order-of-magnitude difference (e.g., "10× less land"). If land use increases, proceed to Step 2; if it decreases ≥5×, skip to Step 3.  
     - **Uncertainty Handling:** If unknown, assume no change (neutral).  

  2. **Assess Baseline Wild Animal Mortality (deaths/ha/year)**  
     - **Question:** What is the estimated annual death toll per hectare for the land type(s) involved (e.g., pasture, cropland)?  
     - **Sufficient Answer:** Use literature ranges:  
       - Pasture (beef): 5–15 vertebrates/ha/year (mammals/birds), 1M–10M insects/ha/year.  
       - Cropland (chicken feed/plant-based): 10–50 vertebrates/ha/year, 2M–20M insects/ha/year.  
     - **Uncertainty Handling:** If unknown, use midpoint (e.g., pasture: 10 vertebrates, 5M insects; cropland: 30 vertebrates, 10M insects).  

  3. **Calculate Deaths per Serving**  
     - **Formula:**  
       ```  
       Deaths/serving = (Deaths/ha/year) × (Land/serving)  
       ```  
     - **Separate by animal class:** Vertebrates (mice, birds) vs. insects.  

  4. **Apply Moral Weights**  
     - **Question:** What relative moral weights does our policy assign to insects vs. vertebrates?  
     - **Options (from literature):**  
       - A. **Utilitarian (suffering-focused):** Weight by neural complexity. Default: 1 insect : 100 mouse : 200 bird.  
       - B. **Ecocentric (species equality):** 1:1:1 per individual.  
       - C. **Vertebrate-focused:** Ignore insects (weight = 0).  
     - **Handling Uncertainty:** Run calculations for all three weights. If rankings conflict, proceed to Step 5.  

  5. **Compare and Resolve Uncertainty**  
     - **Calculate total harm per serving:**  
       ```  
       Total Harm = (Vertebrate deaths × avg. vertebrate weight) + (Insect deaths × insect weight)  
       ```  
     - **Stopping Rule:** If harm estimates overlap across moral weight scenarios (e.g., A favors Proposal X, B favors Y), halt for human judgment.  
     - **Output:** Reduction in harm = (Current harm) – (Proposed harm).  

  #### Limitations:  
  - **Misfires:** Overlooks indirect effects (e.g., pesticide runoff, habitat fragmentation).  
  - **Cannot Do:** Predict long-term ecosystem impacts or non-lethal harm (e.g., stress).  
  - **Critical Uncertainty:** Insect mortality data are highly unreliable; results hinge on moral weights.  

  ---

  ### Application to Proposals  
  **Proposal 1: Replace beef line with chicken line**  
  - **Current Product:** Beef. **Proposed Product:** Chicken.  

  | Step | Metric | Beef (Current) | Chicken (Proposed) |  
  |------|--------|----------------|-------------------|  
  | 1 | Land/serving (ha) | 0.002 (200 m²) | 0.0003 (30 m²) |  
  | 2 | Deaths/ha/year | Vertebrates: 10, Insects: 5M | Vertebrates: 30, Insects: 10M |  
  | 3 | Deaths/serving | V: 0.02, I: 10,000 | V: 0.009, I: 3,000 |  
  | 4 | Moral Weights (A/B/C): | | |  
  | - **A (1:100:200):** | V harm: 0.02 × 150* = 3, I harm: 10,000 × 1 = 10,000 → **Total: 10,003** | V harm: 0.009 × 150 = 1.35, I harm: 3,000 × 1 = 3,000 → **Total: 3,001** |  
  | - **B (1:1:1):** | V: 0.02, I: 10,000 → **Total: 10,000** | V: 0.009, I: 3,000 → **Total: 3,000** |  
  | - **C (ignore insects):** | V: 0.02 | V: 0.009 |  
  | 5 | Harm Reduction | **A:** 10,003 – 3,001 = **7,002**<br>**B:** 10,000 – 3,000 = **7,000**<br>**C:** 0.02 – 0.009 = **0.011** |  

  **Proposal 2: Replace chicken line with grain-based plant line**  
  - **Current Product:** Chicken. **Proposed Product:** Plant-based (e.g., lentils).  

  | Step | Metric | Chicken (Current) | Plant (Proposed) |  
  |------|--------|-------------------|-----------------|  
  | 1 | Land/serving (ha) | 0.0003 (30 m²) | 0.00003 (3 m²) |  
  | 2 | Deaths/ha/year | Vertebrates: 30, Insects: 10M | Vertebrates: 30, Insects: 10M |  
  | 3 | Deaths/serving | V: 0.009, I: 3,000 | V: 0.0009, I: 300 |  
  | 4 | Moral Weights (A/B/C): | | |  
  | - **A (1:100:200):** | V harm: 0.009 × 150 = 1.35, I harm: 3,000 → **Total: 3,001** | V harm: 0.0009 × 150 = 0.135, I harm: 300 → **Total: 300** |  
  | - **B (1:1:1):** | V: 0.009, I: 3,000 → **Total: 3,000** | V: 0.0009, I: 300 → **Total: 300** |  
  | - **C (ignore insects):** | V: 0.009 | V: 0.0009 |  
  | 5 | Harm Reduction | **A:** 3,001 – 300 = **2,701**<br>**B:** 3,000 – 300 = **2,700**<br>**C:** 0.009 – 0.0009 = **0.008** |  

  ---

  ### Comparison and Verdict  
  - **Beef → Chicken Reduction:**  
    - A: **7,002**  
    - B: **7,000**  
    - C: **0.011**  
  - **Chicken → Plant Reduction:**  
    - A: **2,701**  
    - B: **2,700**  
    - C: **0.008**  

  **Analysis:**  
  - Under **all moral weight scenarios**, replacing beef with chicken yields a larger harm reduction per serving than replacing chicken with plants.  
  - **Why?** Beef’s high land use amplifies harm (even with lower per-hectare mortality), and switching to chicken frees up more land than switching from chicken to plants.  
  - **Misfires:** If insect mortality is overestimated for pasture (beef) or underestimated for cropland (plants), results could flip. Moral weights dominate: if insects are ignored (C), reductions are small and similar.  
  - **Unavoidable Uncertainty:** Insect deaths drive outcomes but are poorly quantified. The procedure flags this via sensitivity to moral weights.  

  **Final Ranking:** Beef → Chicken reduces harm more than Chicken → Plant.  

  Verdict: Replacing beef with chicken produces the larger reduction in wild animal harm per serving.
