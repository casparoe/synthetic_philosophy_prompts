prompt: |-
  I'm applying for a small interdisciplinary fellowship — six months, half-time, real money but not a lot of it, and they want to know what I'll actually hand in at the end. The idea I'd be pitching came out of a reading group on collective action where we kept throwing everything under "the tragedy of the commons," and it started to bug me that the classic picture always assumes the thing getting destroyed is a stock: fish, pasture, groundwater, bandwidth, each act of appropriation nibbling a bit away. But the cases I actually care about don't look like that. A bus queue. People bagging their dog's mess. A wiki article that quietly stays accurate. The unwritten rule against leaving your cart in the middle of the lot. What degrades in those cases isn't a stock that gets eaten down unit by unit — it's the shared expectation that other people are still playing along. And it seems to flip: everyone does it, everyone does it, then two people don't and suddenly nobody does, with nothing about anyone's underlying incentives changing in between. The other oddity is that you can't wear it out by participating; the only way to damage it is to be seen not to. So the good looks non-rival in the usual sense and yet gets destroyed by visible non-use, which isn't how we normally talk about public goods either.

  My hunch is that this is a genuinely different failure mode rather than the standard story with the knobs turned up, and that if it is, it changes what interventions even make sense — you'd be thinking about visibility and thresholds instead of prices and quotas. But I honestly cant tell whether I'm onto something or just redescribing the same thing in fancier clothes, and that's the question I want the proposal to make answerable rather than quietly assume. Turn this into the proposal: state the question precisely, say why the existing ways of carving up commons and public-good problems leave it genuinely open (without turning it into a literature review — I'll fill in the references myself, just tell me which positions actually matter), and say what I'd do with six months at half time and why that method rather than the obvious alternatives. I'm genuinely unsure whether this should be formal modeling, a small set of structured case comparisons, or straight conceptual work, so pick one and defend it. Say what a successful outcome looks like, what would count as the project failing or as my distinction collapsing back into the standard one, and give me a straight answer about whether the paramaters I've described add up to a real deliverable or whether I'm kidding myself. Be concrete about what the thing I hand in actually is.
reasoning: |-
  Okay, let me start by really understanding what the user is asking for. They're applying for a small interdisciplinary fellowship and need to craft a proposal around their idea. The core of their idea challenges the classic "tragedy of the commons" model. They've noticed that in many real-world situations, what gets degraded isn't a physical stock but a shared expectation or norm. Examples like bus queues or wiki articles show that collapse happens suddenly when a few people stop cooperating, even if individual incentives haven't changed. 

  First, I need to pinpoint the exact question they want to explore. They mentioned that existing frameworks don't cover this kind of failure mode, so the proposal needs to highlight that gap. The user is worried they might just be repackaging old ideas. My job is to help them frame this as a novel inquiry. 

  Looking at the existing literature, Ostrom's work on norms and institutions is relevant, but her focus is on managing rival resources. Schelling's tipping points and Granovetter's threshold models address sudden shifts, but they don't specifically tackle non-rival goods damaged by non-use. The user needs to position their idea against these without a full lit review. 

  For methods, the user is unsure between modeling, case studies, or conceptual work. Since they have limited time (six months half-time), a formal model might be too ambitious. Case studies could work, but they'd need to gather data, which is time-consuming. Conceptual analysis with structured case comparisons seems feasible. It allows them to dissect mechanisms without new data. 

  Deliverables: A 25-30 page monograph makes sense. It's substantial but doable. They can outline the theoretical gap, analyze cases, and propose interventions. Success would mean showing their framework explains cases that standard models can't. Failure would be if all cases fit existing theories. 

  I should also address their concern about feasibility. With the time constraints, a focused conceptual piece is realistic. Emphasize that they're not kidding themselves—this is a manageable scope. Highlight concrete outcomes like the monograph and clear criteria for success/failure. 

  Need to make sure the proposal clearly states why this is different: non-rival goods, collapse from visible non-use, threshold effects. Stress that interventions here are about visibility and thresholds, not quotas or prices. That's the novel contribution.
answer: |-
  Here’s a structured proposal framework focused on precision, feasibility, and intellectual stakes, designed for a 6-month half-time fellowship:

  ---

  ### **Project Title**:  
  The Fragility of Invisible Rules: Threshold Collapse in Non-Rival Commons  

  ### **Core Question**:  
  **Under what conditions do cooperative systems sustained by mutual expectations (e.g., queues, norms, informal rules) collapse abruptly due to *visible non-participation* rather than resource overuse—and does this constitute a distinct failure mode from classic commons tragedies?**  

  ### **Why Existing Frameworks Leave This Open**:  
  1. **Hardin’s "Tragedy of the Commons" (1968)**: Assumes rivalrous resource stocks depleted by incremental overuse. *Your cases lack both rivalry and incremental depletion*.  
  2. **Ostrom’s Institutional Solutions**: Focuses on rules governing subtractable resources. *Your "expectation commons" degrade via signaling, not physical use*.  
  3. **Public Goods Theory**: Defines non-excludability and non-rivalry but treats underprovision (free-riding) as the core problem. *Here, the good (e.g., queue order) isn’t underprovided—it’s shattered by visible defection*.  
  4. **Tipping Points (Schelling/Granovetter)**: Explain sudden shifts but don’t distinguish *resource rivalry* from *expectational thresholds*.  
  **The Gap**: No framework explicitly addresses **non-rival goods destroyed exclusively by observable non-compliance**, where collapse is binary and participation doesn’t deplete the good.  

  ---

  ### **Method: Structured Case Comparisons (Defended)**  
  **Why not modeling?**  
  Agent-based models (ABMs) could simulate thresholds, but parameterizing "expectational decay" lacks empirical grounding. With 3 months equivalent time, modeling risks untestable abstraction.  

  **Why not pure conceptual work?**  
  Conceptual rigor alone won’t test if this is a *distinct* failure mode. Cases anchor theory in real-world variation.  

  **Why cases?**  
  - **Feasible**: Requires literature synthesis + analysis, not new data.  
  - **Diagnostic**: Cases act as "natural experiments" to stress-test mechanisms.  
  - **Interdisciplinary Leverage**: Juxtapose sociology (norms), economics (public goods), and behavioral science (signaling).  

  **Case Selection (4–6 total, e.g.)**:  
  1. Bus queue disintegration vs. sustained queue (transport studies)  
  2. Wikipedia edit wars/"vandalism collapse" vs. stable pages (digital governance)  
  3. Dog waste compliance in parks (urban sociology)  
  4. Shopping cart protocol breakdown (informal institutions)  

  **Analysis Framework**: For each case, assess:  
  - Trigger (visible non-use vs. resource scarcity)  
  - Collapse pattern (threshold vs. gradual)  
  - "Rivalry" of the good (does participation degrade it?)  
  - Intervention attempts (e.g., signage, surveillance, nudges)  

  ---

  ### **Deliverable: A 25–30 Page Monograph**  
  **Title example**: *Breaking Points: How Visible Defection Destroys the Commons of Expectation*  
  **Contents**:  
  - Theoretical gap analysis (commons vs. public goods vs. tipping points)  
  - 4–6 structured case studies with comparative tables  
  - Typology of "expectational commons" failure  
  - Implications for intervention: When do *visibility boosts* (e.g., highlighting compliance) or *threshold defenses* (e.g., "critical mass" pledges) outperform Pigouvian taxes/quotas?  

  ---

  ### **Success, Failure, and Feasibility**  
  **Success Looks Like**:  
  - Demonstrating ≥3 cases where collapse (a) lacked resource rivalry, (b) was triggered by visible non-use, and (c) resisted standard commons interventions.  
  - A testable definition of "expectational commons" with diagnostic criteria.  

  **Failure Looks Like**:  
  - All cases reducible to classic free-riding or rivalry (e.g., bus queues as "time rivalry").  
  - Collapse mechanisms indistinguishable from Schelling tipping points.  

  **Are You Kidding Yourself?**  
  **No—if you scope tightly**.  
  - ✅ **Feasible**: Half-time over 6 months = ~520 hrs. Allocate:  
    - 150 hrs: Literature deep dive (commons theory, norm signaling)  
    - 200 hrs: Case research/comparative analysis  
    - 120 hrs: Writing/structuring argument  
    - 50 hrs: Buffer/revision  
  - ✅ **Deliverable**: Monograph is standard for humanities/social science fellowships; 30 pages is realistic.  
  - ⚠️ **Risk**: Over-scoping cases. **Mitigation**: Pick cases with pre-existing documentation (e.g., Wiki edit histories, ethnographic studies of queues).  

  ---

  ### **Why This Matters**  
  If successful, this project:  
  1. **Reveals a hidden fragility** in cooperative systems (from climate action to office culture) where trust, not resources, is the bottleneck.  
  2. **Shifts Interventions**: From taxing/quotas (often ineffective for norms) to boosting observable participation (e.g., "most people pay taxes" campaigns).  
  3. **Creates Common Ground**: Gives sociologists a formal hook for norm dynamics and economists a new failure mode to model.  

  **Hand in a monograph—not just a question, but a toolkit for diagnosing invisible fractures in cooperation.**  

  ---  
  **Final note**: This isn’t just "tragedy of the commons with knobs turned up." It’s about how cooperation dies when the *idea* of cooperation dies—and that’s a different beast. Now go nail the references.
