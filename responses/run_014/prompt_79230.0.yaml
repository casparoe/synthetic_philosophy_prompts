  Here's a joke tailored to Moore's specific *organic unity* concept regarding friendship + aesthetic enjoyment:

  **Setup:**  
  A strict Benthamite utilitarian overheard G. E. Moore explaining his theory of organic unities: "You see, the *whole* state of affairs—your deep affection for a friend *combined* with your mutual appreciation of a sublime sunset—possesses a far greater intrinsic value than the affection alone plus the sunset's beauty alone."

  **Punchline:**  
  The utilitarian immediately started frantically collecting phone numbers and gallery brochures, muttering, "Right! Value multiplier! Need more friends *and* more sunsets... stack 'em high!"  
  *(He later lamented to his therapist: "I've got 43 contacts and 14 stunning vistas... but I'm still only at '17'. Moore promised synergy!")*

  **Why it works philosophically:**

  1.  **Targets Moore's Core Idea:** The punchline hinges entirely on misunderstanding Moore's *organic unity*. The utilitarian treats friendship and aesthetic enjoyment as simple, additive quantities (contacts + vistas = high score), missing Moore's crucial point that the *specific, intrinsic relational quality* of affection *combined* with *shared* appreciation creates the unique, higher-order value. It's not additive; it's emergent and relational.
  2.  **Contrasts with Utilitarianism:** It pits Moore against Bentham's quantitative hedonism, a key context for *Principia Ethica*. The utilitarian character embodies the reductionist approach Moore rejected.
  3.  **"17" Joke:** The arbitrary number "17" highlights the absurdity of trying to quantify the emergent value Moore describes. It emphasizes that the value isn't calculable by summing parts.
  4.  **"Stack 'em high" & "Synergy":** These phrases mock the utilitarian's quantitative, almost industrial, mindset towards personal affection and beauty, contrasting sharply with Moore's emphasis on their intrinsic, irreducibly complex value.
  5.  **Avoids Biography:** It uses Moore's *ideas*, not his life, as the engine of the humor. The joke is funny *because* you understand Moore's argument and the utilitarian's fundamental error in applying quantitative thinking to an organic unity.

  This joke rewards readers familiar with Moore by making the philosophical misunderstanding itself the source of the humor, rather than relying on generic tropes.
