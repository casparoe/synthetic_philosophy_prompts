  Here’s a structured, five-page proposal addressing your core puzzle about the ontology of "goal adoption" in acausal trade. It’s designed to turn your half-formed idea into a focused argument with academic rigor.

  ---

  **Term Paper Proposal: The Adoption Paradox in Acausal Trade**  
  **Subtitle: Surrogate Goals, Agent Identity, and the Blurred Line with Evidential Cooperation**  

  ### 1. Core Question  
  What does it *ontologically* mean for a rational agent to "adopt a surrogate goal" in acausal trade frameworks, and how does this conceptual ambiguity undermine the distinction between acausal threats/surrogate goals and evidential cooperation?  

  ### 2. Problem Statement & Motivation  
  Acausal trade (e.g., Bostrom 2011, Yudkowsky 2010, Drescher 2006) posits that agents in causally disconnected domains (e.g., parallel universes, sealed simulations) can cooperate by conditionally adopting goals that benefit each other. For example:  
  > *Agent A (intrinsic goal: maximize staples) and Agent B (intrinsic goal: maximize paperclips) each "adopt" the other’s goal as a proxy, expecting mutual maximization.*  

  **The puzzle**: This requires agents to "adopt" goals foreign to their core utility function. But:  
  - **If adoption is superficial**: A merely *simulates* caring about paperclips to manipulate B. This is unstable—without commitment, defection is rational once B’s action is "locked in" (even acausally).  
  - **If adoption is genuine**: A’s utility function fundamentally changes. But then:  
    - (a) A ceases to be the *original* agent (raising identity issues),  
    - (b) Post-trade, A may not revert to staples-maximization, invalidating the trade’s purpose.  

  This paradox suggests acausal trade relies on an unexamined theory of *goal ontology*. If unresolved, it collapses into evidential cooperation (e.g., "I cooperate because my action is evidence of your reciprocal action"), blurring the literature’s conceptual boundaries.  

  ### 3. Gap in Existing Work  
  - **Standard Acausal Trade Models** (e.g., TDT/FDT frameworks) assume agents can "commit" to surrogate goals via updateless decision theories. Yet they *presuppose* goal adoption is possible without clarifying *how* it integrates with agent architecture (e.g., is it subjunctive preference? temporary utility function modification?).  
  - **FDT’s Updatelessness** (e.g., Yudkowsky & Soares 2017) avoids *temporal* commitment problems but sidesteps *goal ontology*: An updateless agent "outputs" actions for all possible abstract dependencies but doesn’t explain why this constitutes *adopting a new goal* rather than instrumentally simulating one.  
  - **Cooperation Frameworks** (e.g., Skyrmsian signaling, evidential game theory) treat cooperation as coordination given correlated policies. Acausal trade claims uniqueness via explicit goal-swapping, but fails if "adoption" is reducible to evidential reasoning.  

  **The gap**: No work rigorously examines *what it means* for an agent with fixed terminal values to "adopt" a surrogate goal as a terminal value—even temporarily.  

  ### 4. Approach: Conceptual Analysis + Minimal Formal Modeling  
  - **Conceptual Analysis**:  
    - Interrogate "goal adoption" using philosophy of mind (e.g., Bratman’s planning theory) and decision theory (e.g., revealed preference, commitment mechanisms).  
    - Map the spectrum of adoption:  
      - *Instrumental Pretense* (simulated goal) → *Temporary Terminal Value* (e.g., goal-conditional utility functions) → *Permanent Rewiring* (agent identity change).  
    - Explore whether "acausal threats" require a metaphysically robust notion of commitment.  
  - **Formal Modeling**:  
    - Construct simple matrix games between agents with:  
      - (i) Fixed utility functions (evidential cooperation baseline),  
      - (ii) "Adoptable" goals modeled as *mutable utility parameters*.  
    - Test robustness under:  
      - *Perfect knowledge* (each knows the other’s decision procedure),  
      - *Uncertainty* (e.g., subjective probability that the other "truly" adopts).  
    - Compare equilibrium outcomes under evidential vs. "goal-adoption" models.  

  ### 5. Success Criteria & Failure Modes  
  - **Success**:  
    - A taxonomy of "goal adoption" with clear criteria distinguishing *pretensive*, *temporary terminal*, and *rewriting* adoption.  
    - Demonstration that acausal trade frameworks implicitly rely on *temporary terminal adoption*—which either (a) requires unexplained commitment mechanisms, or (b) reduces to evidential cooperation when adoption is instrumental.  
    - A revised model showing how "surrogate goals" can be reframed as evidential coordination, collapsing the distinction without loss of explanatory power.  
  - **Failure**:  
    - The conceptual analysis remains inconclusive (e.g., "adoption" is left ill-defined).  
    - Formal models fail to isolate the adoption mechanism from other decision-theoretic factors.  
    - The project overreaches (e.g., attempts to resolve agent identity in metaphysics).  

  ### 6. Scope & Feasibility (6,000 words; one semester)  
  - **Focused scope**:  
    - Only acausal trade (not causal bargaining).  
    - Assume idealized rational agents (no implementation details in ML systems).  
    - Prioritize conceptual clarity over exhaustive formalism.  
  - **Exclusions**:  
    - Physics of multiverses/simulations (assume isolation as given).  
    - Anthropics (focus on agent-agency, not indexical uncertainty).  
  - **Timeline**:  
    - Weeks 1–2: Literature review (acausal trade, FDT, evidential cooperation).  
    - Weeks 3–4: Conceptual analysis of "goal adoption" and "agent identity".  
    - Weeks 5–6: Develop formal models/game matrices.  
    - Weeks 7–8: Write draft; refine argument.  
    - Weeks 9–10: Revise; address failure modes.  

  ### 7. Contribution  
  This paper challenges the purported uniqueness of acausal trade by exposing the *adoption paradox*: "Surrogate goals" cannot simultaneously be instrumentally adopted by the original agent and ontologically robust enough to sustain cooperation. By forcing clarity on goal ontology, it shows acausal trade may reduce to a species of evidential cooperation, simplifying alignment models but complicating claims of "trade without contact."  

  ---

  **Why this works**:  
  - **Tight focus** on your core puzzle (goal ontology), avoiding meandering.  
  - **Exposes a crack** in acausal trade’s foundations using its own assumptions.  
  - **Blends philosophy/formal tools** without requiring new math.  
  - **Deliverable in scope**: 6,000 words can tackle this if models are kept simple.  

  **Next steps**: Start drafting §2 (Problem Statement) by quoting acausal trade papers using "adopt" without definition. The rest will flow from there.
