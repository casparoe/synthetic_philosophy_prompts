prompt: |-
  hey so im co running a workhop for about 22 first year undergrads, half CS half philosophy, 70 minutes total, and I want a runnable in class game that makes them feel the frame problem instead of just hearing a definition

  here is the setup I have in mind, feel free to tweak it: a dumb campus kiosk bot has to do three tiny jobs - keep clean mugs on shelf A, keep the cart out of the doorway, and keep an accurate count of spoons. Teams take turns writing rule cards for the bot and then another team has to execute them completely literally while I keep throwing in small side changes like a mug cracks, someone borrows the cart, spoons get moved to washbin, that sort of thing. I want them to discover on their own that listing extra do not change notes blows up and still misses stuff, without me naming the problem up front. The takeaway for them should be why relevance is the hard part, why you cannot fix commonsense updating just by adding more persistence rules.

  can you give me full rules, materials needed, teams and roles, a points system with no real money, a minute by minute plan for the 70 minutes, plus a debrief that maps specific moments in the game to parts of the idea. Also tell me what will predictably go wrong the first time I run this activty and how to handle it, and be honest about which part of the frame problem the game cannot reproduce and I will have to just explain.

  one more thing, please flag clearly what is settled vs what is genuinely contested among people who actually work on this area, and do not present a contested view as if it is the consensus.

  and at the very end after the main plan, add a compact summary table with these five columns: Phase, Minutes, Facilitator Move, Student Trap To Watch For, Which Bit Of The Problem It Shows. One row per phase is fine.
reasoning: |-
  We are designing an interactive classroom game to illustrate the frame problem to first-year undergraduates (mixed CS and Philosophy). The goal is for students to experience the difficulty of specifying all necessary conditions and the explosion of "do not change" rules, without explicitly naming the frame problem upfront.

  ### Core Concept
  The frame problem: When an AI system performs an action, how does it determine which facts in the world remain unchanged (and which might change) without having to explicitly represent every possible invariant? The challenge is the combinatorial explosion of stating all non-effects and the difficulty of determining relevance.

  ### Game Setup
  - **Scenario**: A campus kiosk bot with three simple tasks:
    1. Keep clean mugs on shelf A (if a mug is dirty, it must be cleaned and placed on shelf A).
    2. Keep the cart out of the doorway (if the cart is in the doorway, move it to storage).
    3. Keep an accurate count of spoons (if the spoon count is inaccurate, adjust the count based on observed spoons).

  - **Game Flow**:
    - Teams take turns writing rule cards for the bot (in a simple conditional language).
    - Another team executes the rules literally (playing the role of the bot).
    - The facilitator (you) introduces small changes (e.g., a mug cracks, someone borrows the cart, spoons are moved to the washbin) to disrupt the system.
    - The goal is to maintain the three objectives, but the rules will inevitably break due to unanticipated changes.

  ### Materials Needed
  - **Rule Cards**: Index cards or paper for teams to write rules.
  - **Whiteboard or Projector**: To display the current state of the world (state variables) and the objectives.
  - **State Variables**: 
    - Mugs: Location (shelf A, shelf B, sink, washbin) and state (clean, dirty, broken). 
    - Cart: Location (storage, doorway, borrowed). 
    - Spoons: Count (current count) and location (drawer, washbin). 
    - Time: Each turn advances time (so changes can happen).
  - **Tokens/Props**: Optional, but can help visualize (e.g., paper cutouts for mugs, cart, spoons).

  ### Teams and Roles
  - **3-4 Teams**: Each team has 5-6 students (22 total). 
  - **Roles per Turn**:
    - **Rule-Writing Team (1 team)**: Writes a set of rules (on a rule card) for the bot to maintain the three objectives. They must write rules that are simple conditionals (if-then). They have limited time (5 minutes) to write rules.
    - **Bot Team (1 team)**: Executes the rules literally in the current state. They must follow the rules exactly as written, without inferring anything. They also have to handle the facilitator's changes.
    - **Other Teams**: Observe and prepare for their turn. They can also be asked to predict what will go wrong.

  ### Points System (Non-Monetary)
  - **Rule-Writing Team**:
    - +1 point for each objective maintained at the end of their turn (max 3).
    - +1 point if the rules handle at least one change introduced by the facilitator without breaking.
    - -1 point for each objective that fails during their turn.
  - **Bot Team**:
    +1 point for correctly following the rules (as judged by the class and facilitator).
    +1 point if they notice an ambiguity and ask for clarification (but they cannot add common sense).
  - **Observer Teams**:
    +1 point for correctly predicting a failure mode (before the bot team acts).
    +1 point for suggesting a rule fix in the debrief that would have prevented a failure (without causing a new one).

  ### Minute-by-Minute Plan (Total 70 minutes)

  #### Phase 1: Introduction and Setup (10 minutes)
  - (0-5 min) Introduce the scenario and the bot's three tasks. Explain the state variables (displayed). 
  - (5-10 min) Explain the rules of the game: 
    - Each turn: 
      - Facilitator may change the state (e.g., move a mug, borrow the cart, etc.) to simulate real-world events.
      - Rule-writing team writes rules (5 min) on a card (using simple if-then statements).
      - Bot team then executes the rules exactly (5 min per turn, including state changes by facilitator).
    - Objectives are checked at the end of the turn.

  #### Phase 2: Game Rounds (45 minutes, 3 rounds x 15 minutes each)
    - **Round 1 (15 min)**:
      - (0-5 min) Facilitator sets initial state: 
          - Mugs: 5 clean on shelf A, 0 dirty.
          - Cart: in storage.
          - Spoons: 10 in drawer, count=10.
      - (5-10 min) Rule-writing team (Team A) writes rules for the bot.
      - (10-15 min) Bot team (Team B) executes the rules. Facilitator introduces one change during execution: e.g., "A mug on shelf A is now dirty (because it was used)." Check objectives.

    - **Round 2 (15 min)**:
      - (15-20 min) Facilitator sets state (based on previous round) and introduces a change: e.g., "The cart is now in the doorway (because someone left it there) and also one spoon is moved to the washbin (so the count is still 10 but one is not in the drawer)."
      - (20-25 min) Rule-writing team (Team C) writes rules (they can see the previous rules and outcomes).
      - (25-30 min) Bot team (Team D) executes. Facilitator introduces a change: e.g., "A mug is broken (so it's no longer usable)."

    - **Round 3 (15 min)**:
      - (30-35 min) State: Now includes broken mug, cart in storage, spoons: 9 in drawer, 1 in washbin, count=10 (inaccurate). Facilitator adds: "The cart is borrowed by a staff member (so it's gone)."
      - (35-40 min) Rule-writing team (Team A again or Team E) writes rules.
      - (40-45 min) Bot team (Team B again or Team F) executes. Facilitator adds: "Two new spoons are added to the drawer (but the count hasn't been updated)."

  #### Phase 3: Debrief and Discussion (15 minutes)
  - (45-55 min) Guided discussion:
    - Ask: What kept going wrong? Why did the rules break even after we added more rules?
    - Highlight: 
      - The rules were too focused on the immediate change and missed side effects (e.g., cleaning a mug didn't account for broken mugs).
      - When they tried to add "do not change" rules, they became too many and still missed things (like the cart being borrowed).
      - The spoon count was affected by location changes and new spoons.
    - Map to the frame problem: 
      - The bot has to know what changes and what stays the same. We cannot list everything that doesn't change because there are too many things (combinatorial explosion). 
      - The real issue is relevance: knowing which facts are relevant to the current action and which are not.

  - (55-70 min) Formalize the frame problem definition and connect to the game:
    - **Definition**: The frame problem is the challenge of efficiently determining which parts of the world state remain unchanged after an action, without explicitly representing all non-effects.
    - **Game Moments**:
      - When a dirty mug was cleaned and put on shelf A, the rule didn't account for broken mugs (so the broken mug was still on the shelf) -> Shows the qualification problem (a subproblem of the frame problem: listing all preconditions).
      - When the cart was borrowed, the rule to move it from the doorway didn't account for the cart not being present -> Shows the need for persistence rules and how they can be invalidated by unanticipated events.
      - The spoon count rule broke when spoons were moved to the washbin because the rule only checked the drawer -> Shows the difficulty of state representation and relevance.

  - **Contested vs Consensus**:
    - Consensus: The frame problem arises in classical AI planning and knowledge representation. It highlights the inefficiency of representing all non-effects and the need for a solution that avoids this.
    - Contested: 
      - Some believe the frame problem is intractable for classical AI and requires entirely different approaches (e.g., connectionism, situated robotics). 
      - There is no agreed-upon solution. Some use frame axioms (explicit non-effects), while others use non-monotonic logics (default reasoning) or probabilistic methods. Philosophers debate whether it is a technical or a fundamental problem.

  ### What the Game Cannot Show
  - **The game cannot fully capture the combinatorial explosion** because we are only dealing with a small state. In real AI, the state can have thousands of variables, and the explosion is more dramatic.
  - **The game does not address non-monotonic reasoning formally** (it's done by humans in the debrief). You may need to explain that in real AI, we use logics that allow default assumptions (e.g., "normally, things don't change") but these are hard to get right.

  ### Predictable Problems and Mitigation
  - **Problem 1**: Students write overly complex rules or try to cover everything. 
    - **Mitigation**: Enforce simplicity: rules must be one if-then per card, and only 3 rules per turn. This forces them to prioritize and still fail.

  - **Problem 2**: The bot team might use common sense. 
    - **Mitigation**: Remind them they are a dumb bot and must follow the rules literally. If they do, reward them with a point.

  - **Problem 3**: The state representation might be confusing.
    - **Mitigation**: Use a clear whiteboard grid for state variables and update it publicly.

  - **Problem 4**: The game might run long. 
    - **Mitigation**: Keep strict time limits. Use a timer. Skip a round if needed.

  - **Problem 5**: The point system might distract from learning. 
    - **Mitigation**: Emphasize that points are just for fun and the real goal is to understand the problem.

  ### Summary Table

  | Phase             | Minutes | Facilitator Move                                                                 | Student Trap To Watch For                                 | Which Bit of the Problem It Shows                                                                 |
  |-------------------|---------|----------------------------------------------------------------------------------|-----------------------------------------------------------|---------------------------------------------------------------------------------------------------|
  | Introduction      | 0-10    | Explain scenario, tasks, rules, state variables.                                 | Students may not grasp the literal interpretation of bot. | Sets up the challenge of specifying rules in a changing world.                                    |
  | Round 1           | 10-25   | Set initial state; after rules, make a mug dirty.                                | Rules only handle the initial state.                      | Shows that without persistence, the initial rules break when the world changes (qualification).   |
  | Round 2           | 25-40   | Set state with cart in doorway and spoon moved; after rules, break a mug.        | Adding more rules but missing new changes.                | Illustrates the beginning of rule explosion and how it still misses things (relevance).           |
  | Round 3           | 40-55   | Set state with broken mug, borrowed cart, and spoon discrepancy; add new spoons. | Rules become complex and unmanageable.                    | Demonstrates the combinatorial explosion and the difficulty of maintaining an accurate model.     |
  | Debrief           | 55-70   | Guide discussion, define frame problem, connect to game moments.                 | May focus on specific fixes rather than the core issue.   | Ties the experience to the frame problem: relevance and non-effect representation are hard.       |

  This plan should create an engaging experience that leads students to discover the frame problem through frustration and reflection.
answer: |-
  ### **Workshop Plan: The Kiosk Bot Frame Problem Game**  
  **Goal:** Students experience the combinatorial explosion of "do not change" rules and grasp why relevance is the core challenge.  

  ---

  ### **Materials & Setup**  
  - **Materials**:  
    - Whiteboard (track state variables: mugs, cart, spoons).  
    - Index cards (for rule-writing).  
    - Timer.  
    - Props (optional): Paper mugs/cart/spoons.  
  - **State Variables**:  
    - `Mugs`: {Shelf A: 5 clean, Sink: 0, Broken: 0}  
    - `Cart`: {Storage: yes, Doorway: no, Borrowed: no}  
    - `Spoons`: {Drawer: 10, Washbin: 0, Count: 10}  
  - **Teams**:  
    - **3 Teams** (7-8 students each).  
    - **Per Round**:  
      - **Team A (Rule-Writers)**: Writes 3 rules (max) on index cards.  
      - **Team B (Bot Executors)**: Runs rules *literally*.  
      - **Team C (Observers)**: Notes failures and predicts chaos.  
    - Rotate roles each round.  

  ---

  ### **Game Rules**  
  1. **Rule Format**:  
     - Rules must be **if-then** statements (e.g., *"If mug in sink, move to shelf A"*).  
     - No "common sense" allowed. Bot executors follow rules verbatim.  
  2. **Facilitator Sabotage**:  
     - After rules are written but *before* execution, announce a change (e.g., *"A mug cracks"*).  
     - Bot team must execute rules in the *new* state.  
  3. **Scoring (Bragging Rights Only)**:  
     - **Rule-Writers**: +1 per maintained objective; -1 per failed objective.  
     - **Bot Executors**: +1 for flawless literal execution.  
     - **Observers**: +1 for predicting a failure.  

  ---

  ### **70-Minute Schedule**  
  | Phase              | Time     | Activity                                                                                                |  
  |--------------------|----------|---------------------------------------------------------------------------------------------------------|  
  | **Intro (10 min)** | 0-10     | Explain the bot’s 3 tasks. Demo a simple rule (e.g., *"If cart in doorway, move to storage"*).          |  
  | **Round 1 (20 min)** | 10-30    | **State**: Default (all objectives met).<br>- **Rule-Write (5 min)**: Team A writes rules.<br>- **Sabotage**: *"A mug cracks."*<br>- **Execute (5 min)**: Team B runs rules.<br>- **Scoring & Discussion**: Did objectives break? Why? |  
  | **Round 2 (20 min)** | 30-50    | **State**: Mug broken, cart in storage, spoons in drawer (count=10).<br>- **Rule-Write (5 min)**: Team B writes rules.<br>- **Sabotage**: *"Someone borrows the cart."*<br>- **Execute (5 min)**: Team C runs rules.<br>- **Scoring**: Focus on cart/spoon failures. |  
  | **Round 3 (20 min)** | 50-70    | **State**: Cart borrowed, 1 spoon moved to washbin.<br>- **Rule-Write (5 min)**: Team C writes rules.<br>- **Sabotage**: *"A dirty mug is added to the sink."*<br>- **Execute (5 min)**: Team A runs rules.<br>- **Scoring**: Highlight rule overload. |  

  ---

  ### **Debrief (15 min Post-Game)**  
  **Connect Game Moments to the Frame Problem**:  
  1. **Round 1 Failure (Cracked Mug)**:  
     - *Observed*: Rules like *"If mug dirty, clean and move to shelf A"* ignore broken mugs.  
     - **Frame Issue**: Qualification problem (unstated preconditions: *"if mug isn’t broken..."*).  
  2. **Round 2 Failure (Borrowed Cart)**:  
     - *Observed*: Rules like *"If cart in doorway, move to storage"* break if cart is borrowed.  
     - **Frame Issue**: Persistence assumptions fail (cart’s location isn’t the only relevant state).  
  3. **Round 3 Failure (Spoon Count + New Mug)**:  
     - *Observed*: Teams add rules like *"If spoon in washbin, update count"*, but miss interactions (e.g., new mug distracts bot).  
     - **Frame Issue**: Relevance explosion (can’t list all "do not change" facts; rules conflict).  

  **Key Takeaways**:  
  - **Why Relevance is Hard**: Listing all invariants is impossible (e.g., *"mugs don’t teleport"*, *"spoons don’t vanish"*).  
  - **Why More Rules Fail**: Adding rules for edge cases creates conflicts/oversights (e.g., fixing spoons breaks mug tracking).  
  - **Real AI Impact**: Modern AI (e.g., reinforcement learning) avoids this by learning relevance from data—but still struggles.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Problem**: Bot team adds "common sense."  
     - **Fix**: Enforce literal execution. Award points for pedantry.  
  2. **Problem**: Rules become overly complex.  
     - **Fix**: Limit rules to 3 per round. Force trade-offs.  
  3. **Problem**: Observers disengage.  
     - **Fix**: Task them to predict failures. Award points for accuracy.  
  4. **Problem**: Students blame "bad rules" not the *problem*.  
     - **Fix**: Debrief by asking: *"Could perfect rules exist? Why not?"*  

  ---

  ### **What the Game *Can’t* Show**  
  - **Formal Non-Monotonic Reasoning**: The game illustrates practical failure modes but not technical solutions (e.g., default logic). *Explain post-game*:  
    > *"In AI, we use logics that assume ‘nothing changes unless stated’—but even those struggle with relevance."*  

  ---

  ### **Contested vs Consensus Views**  
  | Aspect                     | Consensus                                                                 | Contested                                                                                                |  
  |----------------------------|---------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------|  
  | **Frame Problem Scope**    | Affects classical symbolic AI planning.                                   | Is it *fundamentally unsolvable*? Some (e.g., Dreyfus) say yes; others (e.g., McCarthy) say it’s tractable. |  
  | **Relevance in Modern AI** | Deep learning avoids explicit rules but still faces relevance implicitly. | Does "embodied cognition" (e.g., robotics) dissolve the problem? Unresolved.                             |  
  | **Persistence Rules**      | Explicitly stating all invariants scales poorly.                          | Are probabilistic methods (e.g., Bayes nets) a full solution? No consensus.                              |  

  ---

  ### **Summary Table**  
  | Phase         | Minutes | Facilitator Move                                                                 | Student Trap to Watch For                                    | Which Bit of the Problem It Shows                                  |  
  |---------------|---------|----------------------------------------------------------------------------------|--------------------------------------------------------------|---------------------------------------------------------------------|  
  | **Intro**     | 0-10    | Demo a simple rule; state objectives.                                            | Assume rules are "complete."                                 | Sets up the illusion of controllability.                           |  
  | **Round 1**   | 10-30   | Sabotage: *"A mug cracks."*                                                      | Ignore state changes outside rules (e.g., broken mugs).      | Qualification problem (unstated preconditions).                    |  
  | **Round 2**   | 30-50   | Sabotage: *"Cart borrowed."*                                                     | Add persistence rules that fail (e.g., "cart is always movable"). | Persistence assumptions; relevance blindness.                      |  
  | **Round 3**   | 50-70   | Sabotage: *"New dirty mug + moved spoon."*                                       | Overload rules; miss interactions.                           | Combinatorial explosion; irrelevance of "do not change" lists.     |  
  | **Debrief**   | 70+     | Ask: *"Why did more rules fail? What’s the pattern?"*                            | Focus on edge cases, not the core relevance challenge.       | Ties chaos to the frame problem’s core: *relevance is not listable*. |  

  **Run it, then name it**: Students will feel the frustration—*then* reveal this is the frame problem. By the end, they’ll understand why "what to ignore" is AI’s hardest challenge.
