prompt: |-
  I'm a PhD student TAing a philosophy of cognitive science course, and next week I have to teach the frame problem to a mixed class of philosophy and computer science undergraduates in one eighty-minute section. Most of them have read Dennett's paper on the frame problem, but they haven't seen the original McCarthy and Hayes formulation, and I can tell from their forum posts that several of them think the frame problem is just about "how to give a robot enough common sense" or "the problem of listing all the facts a system needs to know." A couple of the CS students suspect it was solved by modern machine learning. I don't need you to explain the frame problem to me — I know the material. What I need is a teaching plan: the order in which the pieces have to be introduced, the one example that should carry the whole thing, the misconceptions that will predictably form and exactly where in the sequence I should head each one off, and how I'll know at the end whether they've actually understood the problem rather than just memorized a story about robots.

  Please structure your response in the following sections, with the rough lengths indicated:

  **Dependency structure** (about 250 words): What has to come first, second, and third in the explanation, and what depends on what. I'm especially interested in whether the McCarthy-and-Hayes technical formulation should come before or after the Dennett-style philosophical framing, and why. Tell me which idea, if not fully in place, makes everything that follows collapse.

  **The carrying example** (about 200 words): The one example or scenario that should run through the whole session. Tell me what it must have and what it must lack, and why Dennett's robot story is or isn't the right choice. If you think something else works better, describe it and justify the switch.

  **Misconception map** (about 300 words): The three or four most predictable misconceptions the students will bring or form, the point in the sequence where each one is likely to surface, and exactly how I should handle it at that moment — whether by letting it play out and then undercutting it, by heading it off before it crystallizes, or by using it as a bridge to the next piece. Address at minimum the "it's just the common-sense knowledge problem" conflation, the "machine learning solves this" line from the CS students, and whatever you think the third and fourth biggest traps are.

  **Check for understanding** (about 150 words): One question or task I can give in the last ten minutes that would tell me whether they've grasped the frame problem as distinct from the general problem of programming intelligence. It shouldn't be something they can answer just by summarizing Dennett. Tell me what a correct answer looks like and what a near-miss answer looks like — the one that sounds right but reveals they still don't have it.

  **What to leave out** (about 100 words): What I should openly refuse to cover at this level, and how to say so without making it sound like I'm dodging the hard part.
reasoning: |-
  Okay, the user is a PhD student TA who needs to teach the frame problem to undergrads in philosophy and computer science. They've noticed misconceptions among students, like thinking it's just about common-sense knowledge or that machine learning solves it. The user wants a structured teaching plan with specific sections: dependency structure, a carrying example, misconception map, check for understanding, and what to leave out.

  First, I need to consider the dependency structure. The students have read Dennett but might not grasp the technical roots. Starting with the McCarthy and Hayes formulation makes sense because it establishes the formal problem in AI before diving into philosophical implications. If they don't get the technical foundation, the philosophical discussion might just reinforce their misconceptions. So, sequence should be: first, the situation calculus and frame axiom problem; then, Dennett's expansion; finally, the philosophical implications. The key dependency is understanding the frame axioms as a formal issue—without that, the rest won't make sense.

  Next, choosing the carrying example. Dennett's bomb robot is engaging but might mislead students into thinking it's about danger or common sense. Instead, a simple example like carrying a box with fragile items (e.g., eggs) in changing environments (rain, wind) would better illustrate the need for frame axioms. This avoids the distraction of danger and focuses on the necessity of tracking what doesn't change. The example must show non-effects but avoid complex real-world variables that could sidetrack into common-sense knowledge.

  For misconceptions, the main ones are conflating the frame problem with common-sense knowledge, believing machine learning (ML) solves it, thinking it's about computational efficiency, and assuming it's outdated. Addressing each requires specific strategies. For common-sense conflation, contrast it during the technical explanation using the carrying example. For ML, ask how ML handles non-changes without explicit axioms. For efficiency, clarify that it's a representational issue, not just speed. For obsolescence, show that modern systems still bypass rather than solve it.

  The check for understanding needs to distinguish frame problem from general AI. A question like designing a system to detect irrelevant changes would work. Correct answers focus on avoiding listing non-effects, while near-misses revert to common-sense knowledge or efficiency.

  What to leave out includes historical solutions like circumscription, deep philosophy of mind debates, and modern AI workarounds. Explain that these are beyond the scope to maintain focus on the core issue.

  Need to ensure each section addresses the user's concerns. The dependency structure must clarify why technical first. The example should be simple yet effective. Misconceptions need preemptive strategies. The check question must test true understanding. And omissions should be justified as scope management.
answer: |-
  Here’s a structured teaching plan focused on conceptual clarity and preempting misconceptions:

  ---

  ### **Dependency Structure** (250 words)
  **Order:**  
  1. **McCarthy & Hayes’ technical core** (25 mins): *Start* with situation calculus (actions, states, preconditions/effects). Introduce the "carrying" example (see below) to show how actions change states. Highlight the need for **frame axioms** (e.g., "moving a box doesn’t change its color") to explicitly state what *doesn’t* change. Emphasize the *combinatorial explosion* of these axioms.  
  2. **Dennett’s philosophical expansion** (15 mins): *After* the technical setup, layer Dennett’s "cosmic ignorance" robot. Contrast his claim—that the frame problem reveals a *crisis of relevance* in modeling cognition—with the AI formulation.  
  3. **Generalization to cognition/philosophy** (15 mins): Explore why this isn’t just an AI issue but a problem for *any* system (biological or artificial) that must efficiently represent change.  

  **Why technical first?**  
  Dennett’s narrative risks reducing the frame problem to "common sense is hard." Starting with McCarthy & Hayes forces students to see the *formal necessity* of frame axioms. If they miss that the problem arises from **logic-based state transitions requiring exhaustive non-change declarations**, the philosophical depth collapses into vagueness.  

  **Key dependency:** The *frame axiom explosion* must be grasped before discussing alternatives (e.g., ML) or philosophy. Without it, students conflate the frame problem with knowledge engineering.

  ---

  ### **The Carrying Example** (200 words)  
  **Scenario:** A robot carrying a box across a room.  
  **Must include:**  
  - Explicit state properties (box location, box color, room temperature, ceiling fan state).  
  - An action: "Move box from A to B."  
  **Must exclude:**  
  - Danger (e.g., bombs), emotions, or complex goals (Dennett’s bomb robot distracts with "urgency," shifting focus to risk assessment, not relevance).  

  **Why this works:**  
  1. **Technical phase:** After moving the box, ask: "What changes? What stays the same?" List needed frame axioms (e.g., "moving doesn’t alter color," "doesn’t stop the fan"). Show how adding *one* new property (e.g., humidity) requires new axioms.  
  2. **Philosophical phase:** Ask: "How does a *human* know humidity is irrelevant? Do we store frame axioms?" Highlights the transition from AI to cognition.  

  **Dennett’s bomb robot isn’t ideal:** Its life-or-death stakes imply the issue is *critical reasoning under pressure*, not the underlying representational inefficiency.

  ---

  ### **Misconception Map** (300 words)  
  1. **"It’s just about common-sense knowledge"**  
     *When it surfaces:* During Dennett discussion.  
     *Preemption:* After introducing frame axioms, contrast: "Common-sense knowledge is *what* to know; the frame problem is *how to avoid knowing* what’s irrelevant. Why declare ‘moving doesn’t change the box’s color’ when color is never affected by *any* action?"  

  2. **"Machine learning solves this"** (CS students)  
     *When it surfaces:* When generalizing to modern AI.  
     *Preemption:* During the technical phase: "Suppose an ML model predicts state changes after ‘move box.’ How does it ‘know’ humidity is irrelevant? Does it learn from massive data? But:  
     - If data lacks humidity variation, the model assumes it’s irrelevant—but this is *brittle* (e.g., in a rainforest).  
     - If data includes humidity, it must still *ignore* it—which demands implicit frame axioms."  
     *Bridge:* ML *bypasses* explicit axioms but doesn’t *solve* the relevance problem; it offloads it to data/optimization.  

  3. **"It’s about computational efficiency"**  
     *When it surfaces:* During frame axiom explosion.  
     *Preemption:* Clarify: "Efficiency is a symptom. The core is *representational*: why must we encode obvious stabilities? Human cognition *doesn’t* list all non-changes—so what *does* it do?"  

  4. **"It’s outdated (solved by probabilistic methods)"**  
     *When it surfaces:* Post-ML discussion.  
     *Preemption:* Note: "Probability helps handle uncertainty (e.g., ‘the fan *might* stop’). But you still need to define *which* variables are uncertain—relevance returns. The frame problem asks: ‘Why is the fan even *in* your model?’"  

  ---

  ### **Check for Understanding** (150 words)  
  **Task (last 10 mins):**  
  *“Design a system that, when told ‘I painted the box red,’ infers ‘The box’s location didn’t change.’ How do you ensure it *doesn’t* explicitly store ‘painting doesn’t alter location’ for every possible action?”*  

  **Correct answer:**  
  - Focuses on *avoiding* explicit non-change declarations (e.g., "Default assumption: properties only change if an action’s effect specifies it").  
  - Mentions *relevance heuristics* or *inertia principles* (not just "use ML/data").  

  **Near-miss answer:**  
  - "Add common-sense rules" (misses *avoidance* of declarations).  
  - "Train on lots of examples" (doesn’t address *how* irrelevance is inferred without exhaustive data).  

  ---

  ### **What to Leave Out** (100 words)  
  Openly skip:  
  - **Historical solutions** (e.g., circumscription, fluent occlusion): Say, "These are technical patches; understanding *why* they’re needed matters more than their details today."  
  - **Deep philosophy of mind debates** (e.g., eliminativism): "We’re focusing on the problem’s structure, not its implications for consciousness."  
  - **Modern AI architectures** (e.g., transformers): "These are *pragmatic* workarounds; discussing them would distract from the core representational puzzle."  

  **Phrasing:** "The frame problem is a moving target in AI, but today we’re isolating its origin—so we’ll prioritize depth over breadth."  

  This sequence builds from concrete formalism to abstract implications, preempts top misconceptions with targeted examples, and verifies grasp via application, not regurgitation. Good luck!
