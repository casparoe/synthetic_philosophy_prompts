  ### Pantoum of the Four Horns  

  When the flame is extinguished, where does it go?  
  *The Tathāgata exists after death.*  
  The tetralemma sifts the seeds we sow.  
  *The Tathāgata does not exist after death.*  

  *The Tathāgata exists after death.*  
  Dependent, like a river’s flow, it stands.  
  *The Tathāgata does not exist after death.*  
  A mirage built on ever-shifting sands.  

  Dependent, like a river’s flow, it stands.  
  *The Tathāgata both exists and does not exist.*  
  A mirage built on ever-shifting sands.  
  *The Tathāgata neither exists nor does not exist.*  

  *The Tathāgata both exists and does not exist.*  
  When the flame is extinguished, where does it go?  
  *The Tathāgata neither exists nor does not exist.*  
  The tetralemma sifts the seeds we sow.  

  ---

  ### Scholar's Note (178 words)  

  This poem uses the Tathāgata’s post-mortem status (MMK 22.11–16) to embody the tetralemma’s four horns (italicized). The *identification of emptiness (śūnyatā) with dependent origination (pratītyasamutpāda)* is stable in Madhyamaka, reflected here through impermanent imagery (flame, river, mirage). Each horn’s recurrence under shifting contexts enacts Nāgārjuna’s claim that no position retains fixed meaning when re-examined dependently—e.g., "exists" (line 2) initially asserts being but later confronts "dependent, like a river’s flow" (line 6), destabilizing intrinsic nature.  

  The poem *avoids endorsing any horn*, and the closing stanza’s cyclical return to the opening questions performs *emptiness of emptiness* by refusing a fifth position. However, two scholarly disputes are relevant:  
  1. **Tetralemma interpretation**: The poem leans *classical* (all horns negated absolutely, rejecting intrinsic nature) rather than *paraconsistent* (some horns conventionally true). Lines like "mirage built on ever-shifting sands" imply total untenability, not conventional utility.  
  2. **Emptiness as thesis vs. therapy**: The poem implicitly treats emptiness as a *conclusion* (via dependent origination’s imagery), not purely a *conceptual cure*. Neutrality would require omitting the river/mirage metaphors, which signal metaphysical interdependence.  

  The form thus enacts classical Mādhyamika dialectics but does not resolve these debates.  

  ---  
  ### How the Poem Works  
  - **Structure**: The pantoum’s recursive form forces each horn (italicized) to recur in new contexts, altering its implications. The Tathāgata’s "existence" (line 2) seems literal until juxtaposed with dependency (line 6), then becomes paradoxical with "both exists and does not" (line 10), and finally dissolves into the opening question (line 13).  
  - **Emptiness of emptiness**: The final stanza reprises the first stanza’s questions (lines 1 & 3) but places them *after* all horns are exhausted, refusing closure. The poem ends mid-sift—no position held, no new ground claimed.  
  - **Accessibility**: Concrete imagery (flame, river, seeds) grounds abstract logic, letting non-specialists engage the poem as a meditation on impermanence.  
  Specialists will note horns 1–4 mapped to lines 2/5, 4/7, 10/13, 12/15, each undermined by adjacent lines showing dependent origination.
