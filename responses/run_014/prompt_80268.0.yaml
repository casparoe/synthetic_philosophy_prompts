  ### Decision Tree Branch Order
  The decision tree branches on three diagnostic distinctions, ordered as follows:  
  1. **Modal Bridge**: Does the argument require physical realizability (beyond mathematical possibility) to have force about the nature of time?  
     - **Yes**: Physical realizability required.  
     - **No**: Mathematical possibility sufficient.  
  2. **Work Done by CTCs** (only if Modal Bridge = "No"): Do closed timelike curves (CTCs) in Gödel's solution do essential work beyond special relativity's (SR) relativity of simultaneity?  
     - **Yes**: CTCs essential (Gödel adds novel content).  
     - **No**: SR alone sufficient (CTCs redundant).  
  3. **Target of the Argument** (applies to all paths except "Wash" and full skeptic): Does the argument primarily target the passage of time (A-series) or temporal structure as a whole (B-series and A-series)?  
     - **A-series only**: Loss of global passage, but B-series relations locally intact.  
     - **Temporal structure**: Collapse of temporal ordering (both A and B series undermined).  

  For Modal Bridge = "Yes", the tree terminates in positions that reject the argument's force for the actual universe (conditional, skeptic, or wash). For Modal Bridge = "No", Work Done by CTCs and Target further refine the reading.  

