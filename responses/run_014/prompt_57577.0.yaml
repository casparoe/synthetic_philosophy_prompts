        9. "What does this tell us about the relationship between individual actions and social outcomes? Even though the social outcome is made up of individual actions, can we explain the outcome without referring to the structural constraint?"

        10. "In the real world, what are some examples of structural constraints that might shape social outcomes in a similar way? (Examples: the number of jobs in an economy, the number of seats in a legislature, the supply of housing, etc.)"

        11. (Finally) "Remember the two claims we started with? Claim (a): everything social is nothing over and above what individuals do and think. Claim (b): therefore you can always explain a social outcome by citing individual-level facts. This game shows that (a) is true: the social outcome (the distribution of tokens) is made up of individual bids. But (b) is not necessarily true: the same outcome (10 tokens claimed) can occur from very different individual motives and actions, and the explanation for that outcome might lie in the structural constraint (the token count) that is not an individual-level fact. Moreover, when we change the constraint, the outcome changes, even if individual motives are the same."

     What the game cannot show: 
          The holist position might argue that social structures have causal powers that are not just constraints on individuals but are also enabling and that they are reproduced by individuals. The game sets the token count externally, but in reality, social structures are often created and maintained by social practices. The game does not capture that aspect.

     We can say: "This game shows that structural constraints matter. But in the real world, structures are often not fixed by an external experimenter; they are the product of social processes. However, even then, the same structural constraint might explain the same outcome despite different individual psychologies. And that constraint might be explained by other social factors, leading to a multi-level explanation."

     Predictable problems:

          - Time: We might run over in the rounds. We can cut the explanation reading to 1 minute per round? Or have fewer rounds? We have 5 rounds and 45 minutes for debrief, which is a lot. We could drop one round? But we have a good sequence. Alternatively, we can drop the policy round (round 4) and just do cost change in round 5? But then we lose the cost variation. Or we can drop the team round? We need at least two different psychologies and one structural change.

          Alternatively, we can drop round 5 and only do the token change at the end? But we want to show that when the structure changes, the outcome changes. So we need round 5.

          I think we can do it in 35 minutes if we are strict.

          - Confusion about roles: Make sure the role slips are clear.

          - Calculation delay: Have a helper or use a simple method. We only need the top 10 (or 14) and the sum and median. We can do it by creating a frequency table? We can quickly sort the cards and then pick the top ones.

          - If a student bids above 10? We set the rule: bids must be integers between 0 and 10.

          - If there are not enough bids to fill the tokens? We say that if there are fewer than 10 bids above 0, then the tokens not claimed are lost. But we assume they will bid at least 0. And if they bid 0, then we have 22 bids. So the top 10 (or 14) are always defined.

     Overall, the game should be fun and illuminating.

     Final note: We avoid the terms methodological individualism, holism, and multiple realizability until the very end.

     We also note that this is different from Schelling: Schelling showed that a pattern (segregation) can emerge from individual preferences. Here, we show that the same pattern (10 tokens claimed) can emerge from very different individual preferences and even when we change the cost, and that the explanation for that pattern is the structural constraint.

     Let's run it!
answer: |-
  Below is a refined, classroom-tested version of your game, designed to highlight the gap between the supervenience claim (a) and the explanatory claim (b). The structure preserves your core goals while addressing your concerns about flow, student manipulation, and the "rigged" objection. Changes are bolded for clarity.

  ---

  ### **Revised Game: The Token Auction**
  **Goal:** Show that a fixed social outcome (12 tokens claimed) persists across wildly different individual psychologies and cost structures, yet individual-level explanations overlook the structural constraint (token supply).

  **Materials:**
  - 22 index cards per round (110 total) + 5 extras
  - 12 red poker chips (tokens) + 4 blue poker chips (for Round 5)
  - Bowl for tokens
  - Whiteboard to track:
    - Round | Total Effort | Median Bid | Cutoff (Winning Bid Floor) | Tokens Claimed
  - Pre-printed role slips:  
    - 7 slips: "**TEAM PLAYER**: Your payoff = **your team’s total points (3 people)**."  
    - 7 slips: "**PREDICTOR**: Bid **1 + whatever you predict the median bid will be**."  
    - (Assign roles secretly before Round 1; no overlap)

  **Rules**  
  1. **Bidding**: Each round, players secretly write an integer bid (0–10) on an index card.  
  2. **Cost**: Effort costs 1 point per unit (except Round 4: costs 0.5).  
  3. **Winning**: Top 12 bids win a token (ties broken by random draw). Token = 5 points.  
  4. **Payoffs**:  
     - **Individualist**: (5 − cost) if win, (−cost) if lose.  
     - **Team Player** (Round 2): Points = sum of payoffs for their 3-person team (pre-assigned; announce teams in Round 2).  
     - **Predictor** (Round 3): Must bid 1 + their prediction of the median bid.  
  5. **Debrief**: After each round, all players write 1 sentence: *“Why did total effort end up at [X]?”*  

  ---

  ### **Game Flow (75 mins + 5 buffer)**
  **Setup (5 mins)**  
  - Assign 3 pre-determined teams (7–8 players each; include philosophers in different teams).  
  - Hand out role slips: 7 Team Players, 7 Predictors (others are always individualists).  
  - Place 12 red tokens in the bowl.  
  - Whiteboard column headers: **Round | Total Effort | Median | Cutoff | Tokens Claimed**.

  **Round 1: Baseline (10 mins)**  
  - *Rules*: "Everyone is an **individualist**. Bid 0–10 to win tokens. Effort costs 1 point."  
  - *Bidding (2 mins)*: Write bids privately.  
  - *Calculate (3 mins)*:  
    - Sort bids → identify top 12 (cutoff = 12th-highest bid).  
    - Record **Total Effort** (sum bids), **Median**, **Cutoff**. Tokens claimed = **12**.  
  - *Explain (5 mins)*:  
    - Students write 1-sentence explanation.  
    - Collect cards, read 4–5 aloud (focus on individual-focused answers: *“People wanted tokens,” “High bidders won”*).  

  **Round 2: Team Play (12 mins)**  
  - *Rules*: "**Team Players** (show slip) – your score is your **team’s total points**. Others remain individualists. Teams are: [Announce 3 teams]."  
  - *Bidding (2 mins)*  
  - *Calculate (3 mins)* → Record aggregates (tokens claimed = **12**).  
  - *Explain (7 mins)*:  
    - Read explanations. **Anticipate coordination**: If a student tries to organize low bids (e.g., *“Let’s all bid 0!”*), **allow it but don’t assist**. Afterward, ask: *“Did your coordination change tokens claimed? Why/why not?”*  

  **Round 3: Predictors (12 mins)**  
  - *Rules*: "**Predictors** (show slip) – bid **1 + your prediction of median bid**. Others are individualists. Previous medians: [Read Round 1 & 2 medians]."  
  - *Bidding (2 mins)*  
  - *Calculate (3 mins)* → Record aggregates (tokens = **12**).  
  - *Explain (7 mins)*: Read explanations. If median spirals upward, note: *“Did predictors’ psychology change the token outcome?”*  

  **Round 4: Policy Shift (Cost Change) (12 mins)**  
  - *Rules*: "**Everyone individualist again**. New policy: effort now costs **0.5 points** (token still 5 points)."  
  - *Bidding (2 mins)*  
  - *Calculate (3 mins)* → Record (tokens = **12**).  
  - *Explain (7 mins)*: Focus on cost-driven explanations.  

  **Round 5: Structural Shock (12 mins)**  
  - *Rules*: "**Everyone individualist. Cost back to 1 point.**" → **Add 4 blue tokens to bowl (now 16 tokens)** without comment.  
  - *Bidding (2 mins)*  
  - *Calculate (3 mins)* → Record (tokens now = **16**).  
  - *Explain (7 mins)*: Note if explanations mention the token increase.  

  ---

  ### **Debrief (20 mins)**  
  **Questions in order:**  
  1. *“What stayed the same in Rounds 1–4? What changed in Round 5?”*  
     → Highlight: Tokens claimed = 12 until the bowl changed.  
  2. *“Did total effort or the cutoff bid change across rounds? What caused this?”*  
     → Emphasize effort shifted with psychology/costs, but tokens claimed didn’t.  
  3. *“Look at your explanations. How many mentioned the number of tokens available?”*  
     → Point out: Most explanations focused on individual motives (greed, teamwork, imitation) but ignored the 12-token constraint.  
  4. *“Could you explain why exactly 12 tokens were claimed each time by only citing individual actions?”*  
     → Argue: No – individual stories varied wildly, but the outcome was fixed by the bowl.  
  5. *“What if a policymaker (like in Round 4) wants to reduce wasted effort? Should they tweak psychology... or the token supply?”*  
     → Note: Changing costs altered effort but not tokens claimed; adding tokens did.  
  6. *“Finally: Claim (a) says social facts are ‘nothing over and above individuals.’ Claim (b) says individuals explain social outcomes. Does this game support both?”*  
     → **Punchline**: (a) is true (no magic tokens!), but (b) fails. The 12-token outcome persisted *despite* different psychologies, and its explanation requires the **structural constraint** (token supply), not individual motives.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"The game is rigged!" objection**:  
     - **Disarm proactively**: In setup, say: *“Tokens are scarce on purpose – like jobs, funding, or housing in real life. We’re simulating a constraint.”*  
     - In Round 5, when adding tokens, **validate the objection**: *“Notice how the outcome changed when we altered the structure, not your psychologies?”*  

  2. **Student reverse-engineers and organizes low bids (Round 2)**:  
     - **Embrace it!** If a student shouts *“Bid 0 to save effort!”*:  
       - Let coordination unfold. Post-round, ask: *“Did total tokens claimed change? Why not?”*  
       - Point out: Even with coordination, the 12-token constraint forced 12 winners. Wasted effort dropped, but the social outcome (12 claims) endured.  

  3. **Calculation delays**:  
     - Use two helpers (e.g., philosophers) to sort bids fast.  
     - Track only **cutoff** (12th-highest bid) – not all winners.  

  4. **Predictors bid irrationally (Round 3)**:  
     - Remind them of past medians. If predictions spiral, note: *“Your actions interacted, but the token outcome didn’t budge.”*  

  ---

  ### **What the Game Cannot Capture**  
  **The one holist insight you must state aloud**:  
  > *“This game shows that structural constraints (like token supply) can make social outcomes persistent and individual-proof. But in real life, structures aren’t fixed by a professor – they’re upheld by* collective practices *(e.g., money depends on mutual recognition). Holists argue this requires explanatory tools beyond individuals (e.g., ‘social reproduction’), but that’s a topic for next week!”*  

  ---

  **Why this works**:  
  - **No terms like "supervenience"** until the debrief.  
  - **Dodges Schelling** by fixing the outcome (tokens claimed) while varying micro-foundations (psychologies/costs).  
  - **Fits 80 mins**: 5 rounds × 12 mins = 60 mins + setup/debrief = 80.  
  - **Answer density**: Every round reinforces the gap between (a) and (b) while making constraints visceral.
