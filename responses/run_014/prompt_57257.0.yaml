prompt: |-
  I teach a graduate seminar on weakness of will and a colleague of mine over in the behavioral economics group keeps reaching for the same picture, and I want to know how much weight it can bare before I let it anywhere near my syllabus. The picture: a person with a self-control problem is like a household containing two members — a far-sighted planner who has the household's real long-run interests at heart and an impulsive doer who keeps spending the money the planner had set aside. Saving apps, hiding the credit card in a drawer, Odysseus lashed to the mast — all of these are just the planner tying the doer down. That part is descriptive. The problem is the work he makes it do. Because the planner's ends are supposedly the person's own true ends, outside help — an auto-enrollment default, a sin tax, a nudge — isn't overriding the person's will at all, it's enforcing it, so the autonomy objection just evaporates, and the doer's complaints are like the complaints of a kid who's been made to do his homework. He also says hyperbolic discounting is the mathematical version of the same story: the very shape of the discount function shows there are two agents pulling in seperate directions, and later regret is the planner saying I-told-you-so, which is why the planner's ranking gets to be the metric of welfare rather than the doer's.

  So give me the correspondence table — what plays the planner, the doer, the shared household, the budget, the tying-down, the helpful outsider — and then the audit. Which features of the household carry over and which don't, and among the ones that don't, which actually threaten his argument versus which are just cosmetic? Three things I especially want pinned down: (a) whether anything in the formal treatment of hyperbolic or quasi-hyperbolic discounting implies two agents rather than a single agent whose preference ordering shifts with the temporal perspective she happens to be taking up at the moment of choice; (b) what the analogy quietly imports about there being a true self whose preferences get to count — my suspicion is that it hands him a solved problem about aggregation and about whose preference is authoritative that the model itself never argues for, and I'd like to see exactly where the smuggling happens; and (c) whether the paternalism conclusion survives once you notice that the doer is the one who is literally present at the moment of choice while the planner is, at best, a set of dispositions laid down earlier. I should also say the analogy seems to get something right that a plain single-agent model struggles with — the phenomenology of inner conflict, and why commitment can feel like an exercise of agency rather than a restriction on it — so don't just pile up disanalogies, tell me which of them are load-bearing.

  And if you think there's a better source domain for time-inconsistent agency — a repeated game among successive selves, a thermostat, a parliament with an upper house, a principal-agent contract with hidden action, whatever you'd nominate — say which one and how far it carries before it starts begging the same questions. No bibliography needed, I just want the argument.
reasoning: |-
  Alright, let me try to unpack this user's query. They teach a graduate seminar on weakness of will and have a colleague in behavioral economics who uses the two-agent household model to explain self-control problems. The user wants to evaluate how robust this analogy is before including it in their syllabus. Specifically, they're concerned about three main issues: whether hyperbolic discounting implies two agents, if the analogy smuggles in a "true self," and whether the paternalism justification holds.

  First, I need to map the analogy's components to the real-world concepts. The planner represents long-term goals, the doer is impulsive, the household is the individual, etc. The user’s colleague uses this to argue that external interventions aren't paternalistic since they enforce the planner's preferences. But the user suspects this might be philosophically problematic.

  Looking at point (a), the formal models of hyperbolic discounting don't necessarily require two agents. Quasi-hyperbolic models (like β-δ) can be seen as a single agent with changing discount rates. The two-agent framework is an interpretation, not a mathematical necessity. This is important because the user wants to know if the model itself supports the duality or if it's an add-on.

  For point (b), the analogy assumes the planner is the "true self," but the models don't establish this. Welfare evaluations often use the long-term perspective, but that's a normative choice. The user is right that the analogy smuggles in a solved aggregation problem, especially by treating the planner’s preferences as authoritative without justification from the model. This is a load-bearing disanalogy because it underpins the colleague's argument against autonomy objections.

  On point (c), at the moment of action, the doer is present, not the planner. External interventions might override the current self's expressed preference, which challenges the idea that such help is non-paternalistic. The user’s point about the doer being the one acting now is crucial here. This disanalogy threatens the colleague's conclusion because it questions whose autonomy is being respected.

  The user also acknowledges the analogy's strengths, like explaining inner conflict and commitment. So, I need to balance critiques by noting which disanalogies are cosmetic versus structural. Load-bearing issues include the aggregation of preferences and the authority of the planner, while the household structure itself might be cosmetic.

  Alternative models like repeated games or principal-agent setups could avoid some issues but introduce others. For example, a repeated game among temporal selves treats all as agents but still requires choosing which self's welfare counts. A principal-agent model highlights incentive misalignment but might not capture intra-personal conflict as vividly.

  The user’s deeper needs seem to be about rigorously evaluating the analogy’s philosophical foundations, especially regarding autonomy and welfare. They want to ensure their syllabus doesn’t present a flawed argument. Highlighting where the analogy holds and where it fails structurally will help them make an informed decision.
answer: |-
  Here's a breakdown of the two-agent household analogy, its correspondence to the weakness of will model, a critical audit focusing on your key concerns, and an alternative suggestion.

  **Correspondence Table:**

  | Analogy Component      | Weakness of Will Model Component             | Notes                                                                 |
  | :--------------------- | :------------------------------------------- | :-------------------------------------------------------------------- |
  | **The Household**      | **The Individual Person**                    | The entity containing the conflicting parts.                          |
  | **The Far-Sighted Planner** | **Long-Term Preferences / Commitment Preferences** | Represents valuations from a detached, future-oriented perspective (t=0). |
  | **The Impulsive Doer** | **Short-Term Preferences / Temptation Preferences** | Represents valuations from the perspective "in the moment" of choice (t=1). |
  | **Household's Real Long-Run Interests** | **"True" Welfare / Long-Term Well-Being** | Defined by the planner's preferences. The core normative claim.       |
  | **Money / Budget**     | **Willpower / Cognitive Resources / Opportunity** | The scarce resource the planner tries to conserve/save, the doer spends. |
  | **Saving Apps, Hiding Card, Odysseus' Mast** | **Commitment Devices / Pre-Commitment** | Mechanisms locking in the planner's choice, restricting the doer's options. |
  | **Tying the Doer Down** | **Imposing Costs / Removing Options** | The *mechanism* of commitment: making the tempting choice harder/less accessible. |
  | **Helpful Outsider (Auto-enroll, Tax, Nudge)** | **Paternalistic Policy / External Nudge** | External agent imposing the planner's preferred choice structure.      |
  | **Doer's Complaints / Kid Complaining** | **Experience of Constraint / Preference Reversal at t=1** | The felt sense of being restricted or acting against immediate desire. |
  | **Planner's "I-told-you-so" (Regret)** | **Ex Post Regret / Welfare Loss Realization** | Recognition after the fact that the impulsive choice was suboptimal. |

  **The Audit: Load-Bearing vs. Cosmetic Disanalogies**

  1.  **Cosmetic Disanalogies (Don't Threaten Core Argument):**
      *   **Literal vs. Metaphorical Agents:** We know the planner and doer aren't separate homunculi; they are aspects of a single mind. The analogy doesn't *require* literal multiplicity.
      *   **Spatial Separation (Household Members):** The conflict isn't spatially localized. The "household" structure is just a vivid container.
      *   **Budget as Money:** The "resource" is metaphoric (willpower, opportunity, future well-being), not literal currency. The core is *conflict over resource allocation*.
      *   **"Tying Down" as Physical:** The commitment mechanisms are cognitive, institutional, or behavioral, not ropes. The core is *externally/internally imposed constraint*.

  2.  **Load-Bearing Disanalogies (Threaten the Argument):**
      *   **(a) Two Agents vs. Shifting Perspective:** **This is crucial.** Hyperbolic/quasi-hyperbolic discounting models (*formally*) describe the preferences of a *single agent* at different points in time. The discount function (e.g., βδ in quasi-hyperbolic) simply represents how valuation changes as consumption nears. It shows time-inconsistency, **not** ontological multiplicity. The "two agents" framework is *one interpretation* imposed *onto* the math to make sense of the inconsistency and the effectiveness of commitment. **The math implies inconsistency, not duality.** Your colleague *smuggles in* the dual-agent *interpretation* as if it were a formal requirement. This interpretation is useful descriptively/phenomenologically but isn't mathematically necessary.
      *   **(b) The "True Self" Smuggling & Aggregation Problem:** **This is the most critical load-bearing flaw.**
          *   **Smuggling Point 1 (Aggregation):** The analogy *presumes* the planner's preferences *are* the "Household's Real Long-Run Interests." It assumes there *is* a single, unproblematic metric of long-run welfare that the planner perfectly represents. But the model itself (βδ) only shows conflicting preferences at different times. Nothing in the discount function *proves* that t=0 preferences are the "true" welfare metric. **The analogy solves the aggregation problem ("Which preference wins?") by fiat: the planner wins.** The formal model provides conflicting data points; it doesn't provide an aggregation rule.
          *   **Smuggling Point 2 (Authority):** The analogy *presumes* the planner has privileged access to the person's "real" interests. This relies on normative intuitions about rationality (e.g., a "view from nowhere," resisting visceral temptation). The formal model shows the inconsistency, but labeling the long-run perspective "true" is a *philosophical/normative judgment*, not a mathematical deduction. **Your colleague uses the analogy to *define* welfare as the planner's preference, bypassing the need to argue for it.** The "doer's" preferences are dismissed as "impulsive" *because* the planner is defined as the authority.
      *   **(c) Presence at Choice & Paternalism:**
          *   **The Load-Bearing Issue:** At the moment of choice (t=1), the "doer" *is* the agent making the decision. The "planner" exists only as a *past intention* or a *disposition* not currently active. When an outsider (or a past self via commitment) imposes the planner's choice *against* the expressed preference of the self *at the point of action*, **this *is* an override of the current agent's will.** The analogy hides this by anthropomorphizing the planner as a *co-present, co-equal agent* whose will is being enforced. But the planner *isn't* present at t=1; only the "doer" is choosing. Calling it "enforcing the person's *own* will" relies entirely on privileging the past/future perspective over the present one. **The paternalism objection doesn't evaporate; it shifts:** is it justifiable to override the current self's choice to enforce a past self's plan? The analogy glosses over this fundamental question by assuming the planner's authority.

  3.  **Where the Analogy Succeeds (And Why It's Tempting):**
      *   **Phenomenology of Conflict:** It captures the visceral feeling of internal struggle remarkably well – the sense of being "of two minds," arguing with oneself.
      *   **Function of Commitment:** It intuitively explains why commitment devices (Odysseus) feel like *exercises* of agency (the planner acting) rather than pure restrictions. It highlights *strategic* action against one's own anticipated future weakness.
      *   **Structure of Regret:** It neatly frames regret as the "return" of the planner's perspective after the doer acted.

  **Alternative Source Domain: Repeated Game Among Temporal Selves**

  *   **The Model:** Treat each "decision point" (t=0, t=1, t=2, etc.) as a distinct player (Self 0, Self 1, Self 2) playing a sequential game. Preferences are defined by quasi-hyperbolic discounting (βδ) applied from their temporal vantage point. Self t cares about utility at t, t+1, t+2, etc., discounting future utility by βδ, βδ², etc.
  *   **Advantages:**
      *   **Formal Alignment:** Matches the βδ structure directly. Each "self" is just the person at a time with the discounting applied *from that time*.
      *   **Clarity on Conflict:** Makes the strategic conflict explicit – Self 0 wants to save, but knows Self 1 will want to spend. Self 0 might "punish" or restrict Self 1's options.
      *   **Avoids True Self Smuggling? (Partial):** It presents clearly that *different temporal selves have different preferences*. This forces the welfare question into the open: *Which* self's utility matters for welfare? Long-run (Self 0)? The experiencing self at each moment? Some aggregate? It doesn't *solve* the aggregation problem but makes the need for an explicit solution unavoidable.
      *   **Commitment as Strategy:** Commitment devices become equilibrium strategies chosen by earlier selves to constrain later selves, fitting game-theoretic reasoning.
  *   **Where it Begs Similar Questions:**
      *   **Welfare Metric:** The fundamental normative problem remains: How do we aggregate the utilities of Self 0, Self 1, Self 2... to define the *person's* welfare? Using Self 0's perspective (long-run discounted utility) is common but still a *choice* requiring justification – it's privileging the earliest perspective. Is Self 1's experienced utility at t=1 less "real"? The model doesn't answer this.
      *   **Paternalism:** If an outsider enforces Self 0's plan against Self 1's preference, it's still overriding the *current* decision-maker (Self 1). Justification is still needed. The model clarifies *who* is being overridden but not *why* it's legitimate.
      *   **Presence:** Self 1 is still the only "agent" present at t=1. Self 0 is in the past.

  **Conclusion:**

  The household analogy is **descriptively powerful** for phenomenology and commitment but **normatively treacherous**. Its key load-bearing flaws are:

  1.  **Misrepresenting Formalism:** Hyperbolic discounting implies time-inconsistent preferences in a *single* agent, not ontological duality. The "two agents" are an interpretive gloss.
  2.  **Smuggling in Authority:** It *defines* the planner's preferences as the "true" welfare metric by analogy, bypassing the critical philosophical arguments needed to justify privileging the long-run perspective over the short-run perspective. This is the core smuggling operation supporting the paternalism conclusion.
  3.  **Masking Paternalism:** By anthropomorphizing the planner as a co-present agent, it obscures the fact that external interventions override the *current* self's expressed will to enforce a *past* self's plan. The autonomy objection doesn't vanish; it transforms into a debate about the authority of past vs. present selves.

  While the **repeated game** model avoids the misleading anthropomorphism and forces the aggregation problem into the open, it **does not solve** the fundamental normative dilemmas about welfare aggregation or the justification for overriding the current self. It makes the conflicts clearer but still requires independent philosophical argument to resolve whose preferences define welfare and when overriding the present self is justified. No analogy can do that normative heavy lifting for you. Use the household analogy cautiously, highlighting its vivid descriptive strengths but rigorously dissecting its normative sleight of hand, especially regarding (b) and (c).
