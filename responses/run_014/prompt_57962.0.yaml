  ### **Persistence Quiz: What's Your Intuition?**
  *For each scenario, pick the answer that feels most natural. Don't overthink it—go with your gut.*

  1. **The Spinning Homogeneous Disc**  
     A uniform disc spins 180°. At time T1, point A is at the top; at T2, point A is at the bottom. Is the disc at T2 the *same object* as the disc at T1?  
     - **(A) Yes—it’s the same disc, just rotated.**  
     - **(B) Yes—it’s part of the same extended "disc-history," though its parts have moved.**  
     - **(C) No—it’s a numerically different disc stage now.**  

  2. **Statue vs. Lump of Clay**  
     A lump is shaped into a statue (T1), then smashed back to a lump (T2), then reshaped into an identical statue (T3). Is the statue at T3 the *same statue* as at T1?  
     - **(A) Yes—same matter, same form.**  
     - **(B) No—the first statue was destroyed at T2; this is a new one.**  
     - **(C) No—they’re distinct temporal parts of the same "statue-history."**  

  3. **Time Traveler Meets Younger Self**  
     A time traveler (age 50) meets their 10-year-old self. How many *distinct people* are present?  
     - **(A) One—it’s the same person at different times.**  
     - **(B) Two—they’re different temporal segments of one life.**  
     - **(C) Two—they’re numerically distinct person-stages.**  

  4. **NPC in a Paused Game**  
     A game is paused, and an NPC (Bob) is copied. Ten years later, the original game unpauses (Bob1), and the copy activates in a new game (Bob2). Which is the "original Bob"?  
     - **(A) Only Bob1—it continues from the original game state.**  
     - **(B) Both—they share the same pre-pause history and properties.**  
     - **(C) Neither—the original Bob ceased at pause; these are new stages.**  

  5. **Ship of Theseus**  
     All planks of Ship A are replaced over time. The original planks are rebuilt into Ship B. Which is the "original ship"?  
     - **(A) Ship A—it has continuous existence and function.**  
     - **(B) Ship B—it has the original matter.**  
     - **(C) Neither—the original ship no longer exists as a unified object.**  

  6. **Growing Person (Child to Adult)**  
     Is 5-year-old Alice *numerically identical* to 50-year-old Alice?  
     - **(A) Yes—she’s the same whole person at both times, despite changes.**  
     - **(B) Yes—she’s a single entity with temporal parts spanning her life.**  
     - **(C) No—they’re distinct person-stages linked by relations.**  

  7. **Repaved Road**  
     A road is stripped to its foundation and repaved with all-new asphalt. Is it the *same road*?  
     - **(A) Yes—it’s the same spatial path and functional entity.**  
     - **(B) No—the physical material is entirely new.**  
     - **(C) It’s a new stage of the same road-history.**  

  8. **Burning Candle**  
     A candle burns down to half its height. Is the shorter candle the *same object*?  
     - **(A) Yes—it’s the same candle losing parts.**  
     - **(B) Yes—it’s a later temporal part of the candle’s timeline.**  
     - **(C) No—it’s a different stage with different properties.**  

  9. **Lump to Statue to Cube**  
     A lump (T1) is shaped into a statue (T2), then reshaped into a cube (T3). Is the cube at T3 the *same object* as the lump at T1?  
     - **(A) Yes—same matter throughout.**  
     - **(B) No—they’re different objects (lump, statue, cube) at different times.**  
     - **(C) No—they’re temporal parts of the same "matter-history."**  

