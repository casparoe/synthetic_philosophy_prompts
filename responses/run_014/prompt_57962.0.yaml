  ### **Scoring Key**
  Tally your answers, then see which theory they align with. **Important notes**:  
  - Some questions (*italicized*) don’t cleanly separate all views.  
  - A "consistent" score leans heavily toward one theory. Mixed scores may reflect hybrid views or ambiguities.  
  - "No one believes that" combos are flagged.  

  | Answer | 1 (Disc) | 2 (Statue) | 3 (Time) | 4 (NPC) | 5 (Ship) | 6 (Alice) | 7 (Road) | 8 (Candle) | 9 (Lump) |
  |--------|----------|------------|----------|---------|----------|-----------|----------|------------|----------|
  | **A**  | Endure   | Endure     | *Endure* | Endure  | Endure   | Endure    | Endure   | Endure     | Endure   |
  | **B**  | Perdure  | Perdure    | Perdure  | *Exdure*| Perdure  | Perdure   | *Perdure*| Perdure    | *Exdure* |
  | **C**  | Exdure   | Exdure     | Exdure   | Exdure  | Exdure   | Exdure    | Exdure   | Exdure     | Perdure  |

  #### **How to Interpret Your Score**
  - **Mostly A’s → Endurantism**: You see objects as "wholly present" at each moment. Change is something that happens *to* a single, identical entity.  
    - *Weak on*: Time traveler (Q3A) is problematic—endurantism struggles with two instances of one object simultaneously. NPC (Q4A) assumes continuity trumps copying.  
  - **Mostly B’s → Perdurantism**: You see objects as 4D "worms" with temporal parts. Identity is like a filmstrip: each moment is a frame in a sequence.  
    - *Weak on*: NPC (Q4B) and Lump (Q9B) blur with exdurantism—perdurantists might split hairs on "branching" (NPC) or matter vs. form (Lump).  
  - **Mostly C’s → Exdurantism (Stage Theory)**: You see objects as momentary stages. Persistence is about causal/historical relations (like "copying" or "counterparts") between stages.  
    - *Weak on*: Lump (Q9C) overlaps with perdurantism—both treat the lump-statue-cube as parts of a larger whole.  

  #### **Ambiguities & "No One Believes That" Combos**  
  - **Q3 (Time Traveler)**:  
    - A (Endure) is logically tricky (one object in two places).  
    - B (Perdure) and C (Exdure) both imply two entities—this question **doesn’t distinguish perdurantism/exdurantism**.  
  - **Q4 (NPC)**:  
    - B (Exdure) is closest, but perdurantists might say "neither" if they reject branching. **A+C mixes** (e.g., Q4A + Q4C) implies both continuity and stage-replacement—inconsistent.  
  - **Q7 (Road) & Q9 (Lump)**:  
    - B for Q7 (*perdure*) and C for Q9 (*perdure*) are debatable—endurantists might say "same road" (A) or "different objects" (B), so these **don’t strongly separate theories**.  
  - **"No one believes that" alert**:  
    - **Q2A + Q2B**: Claims statues are both identical *and* destroyed.  
    - **Q3A + Q3B/C**: Claims one person *and* two people simultaneously.  
    - **Q4A + Q4B**: Claims only Bob1 is original *and* both are.  

  #### **Final Tips**  
  - If you score **5+ in one column**, that’s your dominant intuition.  
  - **Mixed scores (e.g., 3A/3B/3C)**: Common! These theories overlap on change (perdure/exdure) or functional identity (endure/perdure).  
  - **Discuss contradictions**: E.g., if you picked Q1A (disc endures) but Q8C (candle is a new stage), ask: Is rotation different from part-loss?  

  This quiz is a conversation starter—not a final verdict. Use it to pinpoint *why* your group contradicts labels (e.g., perdurantists might say "same object" loosely for Q1, but strictly mean temporal parts). Happy debating! 😊
