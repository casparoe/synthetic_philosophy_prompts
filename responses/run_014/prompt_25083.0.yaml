  Hmm, the user's framing suggests they're frustrated with the literature's ambiguity. They're preparing to lead a seminar discussion, so this needs to be academically rigorous but also pedagogically useful. The bracketing of "theory of life" is smart—keeps focus on cognition. 

  I should start by defining what FEP/PP minimally claims. At its core: cognition is prediction-error minimization via hierarchical Bayesian inference. But adequacy means showing this isn't just fancy math repackaging existing ideas. 

  For desiderata, I consider these angles:
  - **Explanatory scope**: Must cover perception, action, attention at minimum. Consciousness is optional (Seth vs. Hohwy camps).
  - **Unification power**: Should dissolve old dichotomies (perception/action) but preserve key distinctions (e.g., conscious/non-conscious).
  - **Predictive precision**: Can't just retrodict—needs novel predictions like precision-weighting in schizophrenia.
  - **Falsifiability anchors**: Even if broad, should have specific testable claims (e.g., prediction-error signatures in fMRI).
  - **Mathematical coherence**: The math should constrain the theory, not just decorate it.

  The user's deep request is about tensions. So I need to identify which desideratum is most exclusionary—probably falsifiability. Many PP papers are so flexible they explain anything post-hoc. And conflicting pairs? Unification vs. Precision is tricky: the more phenomena PP unifies, the harder it is to make sharp predictions. 

  I also wonder if I should address the "redescription" risk explicitly. Maybe include a desideratum about mathematical necessity—does the formalism add explanatory value over verbal theories? 

  Finally, the killer move would be showing desiderata might be jointly unsatisfiable. If unification requires expansion but falsifiability requires constraints, that's a real tension. Could leave the class debating whether PP is profound or just protean.
answer: |-
  Here’s a structured set of desiderata for evaluating the adequacy of the Free Energy Principle (FEP) and Predictive Processing (PP) as theories of cognition, designed to cut through the literature’s ambiguities. I’ve flagged non-negotiables, contentious points, and key tensions—with the **single most exclusionary desideratum** and **potential conflicts** highlighted at the end.

  ---

  ### **Core Desiderata for an Adequate FEP/PP Account of Cognition**  
  *(Bracketing "theory of life" claims)*  

  1. **Non-Negotiables (Minimal Requirements for Explanatory Status)**  
     - **⦿ Phenomenological Coverage**: Must explain core cognitive phenomena:  
       - *Perception* (e.g., illusions, bistable perception).  
       - *Action* (e.g., motor control, goal-directed behavior).  
       - *Learning* (e.g., Bayesian updating, priors formation).  
       - *Attention* (e.g., precision-weighting effects).  
       - *Case*: Failing here reduces PP to a metaphor (e.g., must resolve *binocular rivalry* better than "it’s just prediction error minimization").  

     - **⦿ Unification Without Collapse**: Must dissolve traditional dichotomies (e.g., perception/action, top-down/bottom-up) *while preserving key distinctions*:  
       - *Case*: Explaining motor control (active inference) ≠ explaining semantic memory. Collapsing distinctions risks vacuity (Clark’s "everything is prediction" vs. Friston’s mathematical formalism).  

     - **⦿ Predictive Power**: Must generate *novel, testable predictions* beyond post-hoc explanation:  
       - *Case*: Precision-weighting deficits in schizophrenia (Corlett et al.), neuromodulatory mechanisms (e.g., acetylcholine), or prediction-error signatures in fMRI.  

     - **⦿ Mathematical Necessity**: The FEP math must *constrain* the theory—not just redescribe cognition in probabilistic terms:  
       - *Case*: If all cognitive processes can be "mapped" to variational free energy minimization without falsifiable constraints, it’s a framing device (Hohwy’s "just-so story" critique).  

  2. **Contested Desiderata (Camps Disagree on Necessity)**  
     - **◐ Consciousness Explanation**:  
       - *Required by*: Seth (interoceptive PP), Friston (generative models as self-evidencing).  
       - *Rejected by*: Hohwy (PP is subpersonal; consciousness is separate).  
       - *Case*: Can PP explain the *hard problem* or only correlates (e.g., confidence reports)?  

     - **◐ Scalability to High-Level Cognition**:  
       - *Required by*: Clark (language, culture as prediction machines).  
       - *Rejected by*: Critics who see PP as perception-action only.  
       - *Case*: Must explain abstract reasoning/social cognition *without* merely calling it "hierarchical prediction."  

     - **◐ Neurobiological Plausibility**:  
       - *Required by*: Microcircuit-focused researchers (e.g., cortical column implementations).  
       - *Optional for*: Computationalists (e.g., PP as abstract framework).  

  3. **Empirical Consistency (Must Accommodate Key Findings)**  
     - **⦿ Mismatch Negativity (MMN)**: PP must explain auditory ERP responses to deviants (prediction error signals).  
     - **⦿ Placebo Effects**: Precision-weighting of priors in pain modulation (e.g., descending neuromodulatory control).  
     - **⦿ Perceptual Biases**: E.g., *hollow-face illusion* (strong priors overriding sensory evidence).  
     - **⦿ Action-Oriented Perception**: E.g., *size-weight illusion* (sensorimotor priors influencing perception).  

  ---

  ### **The Exclusion Hammer: Falsifiability Anchors**  
  **Most exclusionary desideratum: ⦿ Predictive Power**  
  - Why? Most PP accounts are *retrospectively flexible* (explaining illusions, psychosis, placebo effects post-hoc) but fail to predict *novel, domain-specific phenomena* unambiguously. Without this, PP risks being unfalsifiable (e.g., "prediction error minimization" can explain any outcome by tuning priors/precision). Adequate theories must predict *what shouldn’t happen* (e.g., under which conditions precision-weighting *fails* in delusions).  

  ---

  ### **Tensions: Potentially Jointly Unsatisfiable Desiderata**  
  1. **Unification vs. Precision**:  
     - *Conflict*: The broader PP unifies (e.g., perception = action = attention), the harder it is to make *specific predictions* for each domain. Satisfying both may require sacrificing generality for falsifiable mechanisms (e.g., specifying distinct precision circuits for attention vs. interoception).  

  2. **Mathematical Elegance vs. Empirical Messiness**:  
     - *Conflict*: FEP’s mathematical unity (all cognition minimizes variational free energy) vs. accommodating cognitive exceptions (e.g., creative insight, exploration contradicting error minimization). Seth’s "dark room" critique applies: real cognition *seeks* uncertainty.  

  ---

  ### **Synthesis: Is the List Itself a Result?**  
  - **Adequacy Trap**: No current PP account satisfies *all* desiderata simultaneously.  
    - *Unification* tempts overexpansion (e.g., PP as "theory of everything").  
    - *Precision* risks reductionism (e.g., ignoring cultural scaffolding).  
  - **Provocation for Class**: **FEP/PP may be *inadequate as a standalone theory of cognition* but *adequate as a meta-framework***. Its power is in dissolving boundaries (perception/action), but it needs auxiliary hypotheses (e.g., precision implementations) to explain specifics. The desiderata list reveals PP’s tension between grand unification and mechanistic explanation—a core reason for the literature’s fragmentation.  

  ---

  **Suggested Class Discussion Launch**:  
  *"If PP can explain everything from retinal processing to philosophy—but only by being flexible to the point of unfalsifiability—is it a profound insight or a dead end? Let’s test it against Desideratum 3: What would falsify PP?"*  

  This framework forces scrutiny of PP’s explanatory substance beyond mathematical allure. Good luck!
