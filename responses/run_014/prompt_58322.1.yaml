  ## Opening Remarks: Autumn Film Weekend Premiere  
  **(Delivered by Peggy Thornton’s Son)**  

  **(Adjust microphone, warm smile to the audience)**  

  Good evening, everyone. Welcome to our town’s Autumn Film Weekend. On behalf of our family, thank you for coming together to celebrate a life that touched so many of us: my mother, Peggy Thornton.  

  To those who knew her—family, former patients, colleagues—you carry your own memories of her steady hands, her determined spirit, her long walks down muddy lanes to reach someone in need. To our neighbours here for a story, welcome—you’re about to meet a woman whose quiet persistence changed our community. And to the director and cast—**(turning slightly toward front row)**—thank you for pouring your talent into honouring her legacy.  

  Tonight’s film is a *dramatization* of Mum’s thirty years as a district nurse and her campaign for our rural clinic. It’s inspired by truth, shaped by art. And that leads me to a distinction I believe Mum herself would want us to hold clearly tonight: the difference between **getting every fact straight**, and **getting someone’s spirit right**.  

  The filmmakers had our family’s blessing to reshape timelines and events for the screen. That campaign you’ll see unfold in one dramatic winter? In reality, it spanned years of meetings, petitions, and setbacks. The passionate kitchen-table argument with union officials? Mum’s real work was quieter—months of careful letters, late-night phone calls, and yes, frustrating committee rooms. And the wonderful nurse you’ll meet as her close colleague? She’s a composite—a heartfelt tribute to the many real nurses who stood alongside Mum.  

  So why reshape reality this way? Because film isn’t a council minute-book or a historian’s archive. Its power lies in immediacy. It shows us the *weight* of a struggle in a weary look, the *heat* of conviction in a clenched hand, the *loneliness* of a long fight in a single, snow-blown walk home. It aims not just to recount events, but to let you *feel* what drove her—her compassion for patients cut off by flooded roads, her stubborn belief that dignity shouldn’t depend on your postcode. In that sense, this film seeks a deeper fidelity: faithfulness to her *character*, her *why*.  

  **(Pause, soberly)**  

  But—and this mattered deeply to Mum—artistic faithfulness must never become a license to rewrite history, especially for those who lived it. Some of you here—**(nodding toward historians, former colleagues)**—have dedicated years to documenting the precise steps of the clinic campaign. Your care for accuracy honours the real work of democracy: the meetings, the memos, the compromises. That work wasn’t glamorous, but it was *real*, and it deserves its place in our town’s memory.  

  And for those who knew Mum personally… you’ll recognise her strength, her humour, her resolve. But the film, by necessity, simplifies. The real Peggy Thornton didn’t make snap decisions in moments of high drama. She reflected. She listened. She wrestled with doubt. Her courage was a slow, steady burn—not a sudden spark.  

  So tonight, I invite you to watch with both eyes open.  

  **Watch with pleasure:** Let yourself be moved by the story, the performances, the craft. Feel the urgency of the fight, the warmth of community, the portrayal of a woman who refused to look away from need.  

  **But watch with care:** When you see timelines condensed, or meetings turned into confrontations, understand this as cinema’s language—not a documentary record. When motives seem clearer or decisions quicker than life allows, remember: the real woman was more patient, more thoughtful, more intricately human than any two-hour portrait can wholly capture.  

  This film is a loving interpretation, a powerful echo of Mum’s spirit. But it is not her. It is a character *inspired* by her—a silhouette cast by the bright light of her life.  

  **(Voice softens, steady)**  

  When the lights come up, carry this with you: Carry the vivid story, yes. But carry, too, the quieter truth of the woman who held your hand in a dark hour, who wrote letters until her fingers cramped, who believed—deeply, persistently—that care is never wasted, and that justice for our neighbours is worth a lifetime’s effort. That woman was real. Her name was Peggy Thornton. And her truest monument isn’t just the clinic that still stands—**(gestures outward)**—it’s the kindness we choose to show, right here, because she showed us how.  

  Enjoy the film. Thank you.  

  **(Steps back, nods gratefully. Applause.)**  

  ---

  **Key elements addressed:**  
  - **Fact vs. Spirit:** Explicitly names changes (time compression, composite character, dramatized scenes) while framing fiction as a tool for emotional/spiritual truth.  
  - **Legitimizes All Viewers:** Validates historians’ precision, comforts family/colleagues by acknowledging Mum’s deeper complexity, welcomes casual viewers with clear context.  
  - **Guides Viewing Experience:** Explicitly invites "pleasure" and "care"—teaching the audience *how* to watch critically but generously.  
  - **Honors Filmmakers:** Calls their work "loving," "heartfelt," and skilled while maintaining the family’s agency ("our blessing").  
  - **Civic Tone:** Focuses on community, collective memory, and ongoing responsibility ("kindness we choose to show").  
  - **Closes with Distinction:** Sharpens the line between "character" and "real woman," anchoring her legacy in tangible local impact (the clinic) and ethical example.  
  - **Philosophical Weight:** Addresses "obligations to the dead" through the demand that art respect truth even while interpreting it, and that memory remain anchored in documented reality.  

  **Timing:** Approximately 7 minutes when delivered with natural pauses.  
  **Tone Achieved:** Warm (personal stories, gratitude), sober (clear-eyed about artifice), civic-minded (focus on community values and action).
