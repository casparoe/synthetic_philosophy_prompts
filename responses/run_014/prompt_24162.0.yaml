prompt: |-
  I've landed on the position that evolutionary psychology is a real science, not a genre of just-so stories in the Kipling sense, and I'd like a map of what would count against it. My working view: the core program -- that a lot of the mind is a suite of domain-specific modules shaped by natural selection in the ancestral environment -- is doing exactly the kind of historical-functional explanation that makes evolutionary biology science, and the standard just-so objection (post-hoc, unfalsifiable, any story can be spun) is a generic attack that would sink paleontology and phylogenetics too, so it doesn't land. What would have to be true for me to be wrong? I want the defeaters sorted from fatal to merely awkward, and I'd be helped if you separated (a) evidence that would count against the modular-architecture claims specifically, (b) evidence that would count against the ancestral-environment reconstruction method, and (c) things that would only embarrass particular famous hypotheses without touching the program. I also want to know which of these a committed evolutionary psychologist would themselves concede as counting against them versus wave away as bad examples, and whether the program has a signature prediction that rival accounts -- say, general-purpose-learning-mechanism views or cultural-evolution accounts -- genuinely don't make, or whether its testability is mostly negative (it's just the absence of a better alternative). One more thing: I suspect part of the defense is definitional, i.e. "any hypothesis that could in principle be tested counts, and we just have to wait for the tests." Is the position insulated that way, and if so, is that a problem for it, or is that just what historical sciences are like? What I'd personally find most persuasive is a case where the program made a risky, dated, specific prediction and got it wrong in a way a rival account got right -- or, failing that, a clear statement of how much of the "science" label is load-bearing versus how much is already on the table from the fact that selection is a real cause.
reasoning: |-
  Okay, the user has a well-articulated position on evolutionary psychology (EP) and wants to understand what could potentially falsify it. They see EP as a legitimate science, akin to evolutionary biology, and dismiss the common "just-so story" critique as applicable to other historical sciences too. Their main request is for defeaters sorted by severity, categorized into (a) against modularity, (b) against ancestral environment reconstructions, and (c) against specific hypotheses. They also want to know how EP proponents would respond, whether EP has unique predictions, and if its testability is merely negative.

  First, I need to address their core argument: EP uses historical-functional explanations like evolutionary biology, so the just-so criticism shouldn't invalidate it alone. They're right that historical sciences face challenges with testability, but the key difference might be in the accessibility of evidence. Paleontology has fossils; EP has to infer mental modules from behavior, which is trickier. So perhaps the lack of direct evidence for adaptations is a weakness compared to other historical sciences.

  Next, the user wants defeaters categorized. For (a) modular architecture, evidence against would be if domain-general mechanisms can explain behaviors without domain-specific modules. Neuroplasticity and neural reuse are strong points here. If the brain shows high flexibility, that undermines the idea of fixed modules. Also, failures in reverse engineering behavior to find modules—like if purported modules don't correlate with specific functions—would be problematic. EP proponents might argue that modules are not localized but distributed networks, but that might stretch the original definition.

  For (b) ancestral environment reconstructions, issues arise if the EEA is too vague or if there's evidence of diverse ancestral environments that prevent consistent selective pressures. If different human groups faced varied challenges, universal modules might not exist. Genetics showing rapid evolution or lack of universality in traits would challenge EP's reliance on adaptation during the Pleistocene. Proponents might counter by refining EEA models or pointing to universal traits, but significant genetic diversity could be a fatal blow.

  For (c), specific hypotheses failing (e.g., Savannah hypothesis, waist-to-hip ratio) are embarrassing but not fatal. EP can dismiss these as early missteps. The user needs examples where rivals like cultural evolution explain things better, like why some "universal" traits vary across cultures.

  The user also asks about unique predictions. EP's strong point is predicting design specificity—like context-dependent risk aversion. If such predictions are confirmed, it supports EP. But if domain-general models explain the same without special modules, EP loses its edge. The testability concern is valid; if EP can always adjust its modules or EEA, it risks unfalsifiability. Proponents might insist on principled constraints, but without them, it's problematic.

  The user's deeper need seems to be a robust defense or critique of EP's scientific status. They might be preparing for a debate or seeking to solidify their stance. They value concrete evidence over theoretical arguments. Highlighting cases where EP predictions failed and rivals succeeded would be persuasive. Also, clarifying if EP's science label depends on testable predictions or just selection as a real cause. If the latter, it's not as strong a science as they claim.

  In summary, fatal issues include neural evidence against modularity and genetic evidence against universal adaptations. Embarrassing but not fatal are specific hypothesis failures. The lack of unique predictions and methodological flexibility are significant concerns. The user needs clear examples where EP failed and rivals explained better, plus an assessment of whether EP's testability meets scientific standards.
answer: |-
  Here's a systematic breakdown of potential defeaters for Evolutionary Psychology (EP), structured according to your request. This analysis distinguishes *fatal* flaws (undermining the core program), *awkward* ones (challenging key methods/assumptions but potentially surmountable), and *embarrassing* cases (isolated failures). I'll also address proponent responses, unique predictions, and the "science" label question.

  **Core Tenet Under Scrutiny:** EP posits that the human mind contains numerous, domain-specific, functionally specialized *computational modules* that are *adaptations* sculpted by natural selection operating in a largely shared *Environment of Evolutionary Adaptedness (EEA)* during the Pleistocene.

  ---

  ### **A. Defeaters Against Modular Architecture Claims (Fatal to Awkward)**

  1.  **Fatal: Neural Implementation & Plasticity Evidence**
      *   **What:** Widespread evidence that the brain operates primarily via domain-general learning mechanisms, massive neural reuse, and extreme plasticity, where *any* neural circuitry can be recruited for *any* function given appropriate developmental input and cultural scaffolding. Demonstrating that purported "modules" (e.g., for language, face recognition, cheater detection) lack dedicated, developmentally canalized neural substrates and instead emerge from general pattern recognition and associative learning.
      *   **Why Fatal:** Directly contradicts the core claim of *innate, domain-specific computational machinery*. If the brain is fundamentally a general-purpose learning system shaped by culture and individual experience, the EP architecture model collapses.
      *   **Proponent Response:** Argue plasticity *itself* is an adaptation, or that neural reuse occurs *within* evolved functional constraints. Might redefine "module" as functional specialization emerging from development *guided* by evolutionary biases, potentially diluting the core claim.

  2.  **Fatal: Failure of Reverse Engineering & Predictive Specificity**
      *   **What:** Consistent inability to identify unique computational signatures of hypothesized modules. Predictions derived from functional design logic (e.g., specific input conditions triggering precise, context-dependent outputs unique to the proposed module) systematically fail empirical tests. Domain-general models consistently outperform domain-specific ones in explaining behavioral variance.
      *   **Why Fatal:** EP's scientific claim rests on successfully reverse-engineering functional design. Persistent failure suggests the architecture isn't there or the method doesn't work. If rival models explain the data better without invoking modules, EP loses its explanatory power.
      *   **Proponent Response:** Attribute failures to poor hypothesis generation/testing or incomplete knowledge of the EEA. Argue modules are complex and predictions are hard, but the *approach* remains valid. May point to *some* successes (e.g., visual processing, phoneme discrimination).

  3.  **Awkward: The "Massive Modularity" Problem**
      *   **What:** Evidence that solving the vast array of adaptive problems faced by Pleistocene humans *didn't* require thousands of dedicated modules, but could be efficiently handled by fewer, more flexible mechanisms combined with cultural learning and general intelligence. Demonstrating combinatorial explosion or neural implausibility of hosting innumerable specialized circuits.
      *   **Why Awkward:** Challenges the necessity and plausibility of the proposed architecture, forcing EP towards fewer, coarser-grained "modules" or domain-general mechanisms with *biases*, blurring the distinction from rival views.
      *   **Proponent Response:** Argue efficiency lies in specialization, not generality. Cite evolutionary algorithms showing specialization evolves readily. Maintain that "massive" doesn't mean infinite or implausible, just numerous specialized functions.

  ---

  ### **B. Defeaters Against Ancestral Environment Reconstruction & Adaptationist Method (Fatal to Awkward)**

  1.  **Fatal: Irreducible Heterogeneity of Ancestral Environments & Selection Pressures**
      *   **What:** Strong evidence that Pleistocene human populations experienced drastically different selective environments (e.g., coastal vs. savannah, arctic vs. tropical, high-population-density vs. isolated bands) with minimal gene flow, leading to *different* selective pressures on cognitive traits. Crucially, evidence that this variation prevented the fixation of *universal, species-typical cognitive adaptations* for many proposed modules.
      *   **Why Fatal:** EP relies on a *shared* EEA creating *universal* adaptations. If selective pressures were divergent across populations, universal modules for many complex social/cognitive traits couldn't evolve. Genetics (e.g., recent local adaptations) supporting this would be devastating.
      *   **Proponent Response:** Argue for core shared pressures (social living, foraging, mating, predator avoidance) being dominant. Downplay environmental differences or argue modules are coarse-grained solutions to fundamental problems present everywhere. Shift focus to "evolved probabilistic tendencies" rather than fixed modules.

  2.  **Fatal: Chronically Poor EEA Reconstructions & Untestability**
      *   **What:** Demonstrating that plausible EEA reconstructions for most complex cognitive traits are fundamentally underdetermined by available evidence (paleo-climate, archaeology, ethnography of foragers). Crucially, showing that *multiple, mutually incompatible* EEA scenarios can generate the same hypothesized module, and *no conceivable evidence* could reliably distinguish between them or falsify a proposed adaptive function. This makes the "historical-functional" explanation effectively unfalsifiable speculation.
      *   **Why Fatal:** If EEA reconstruction for cognitive traits is always just-so storytelling lacking empirical anchors *unlike* (some) paleontology/phylogenetics (which have fossils, stratigraphy, DNA), then EP's core explanatory method fails as science.
      *   **Proponent Response:** Argue reconstructions are improving with interdisciplinary data. Emphasize using "middle-level" evolutionary theories (e.g., parental investment, reciprocal altruism) not tied to hyper-specific EEA details. Concede some early work was sloppy but insist the method *can* be rigorous.

  3.  **Awkward: Pace of Genetic/Cultural Change & Mismatch Overreach**
      *   **What:** Evidence that significant genetic evolution relevant to cognition *has* occurred since the Pleistocene (e.g., lactose tolerance, disease resistance, possibly aspects of brain development). More importantly, evidence that cultural evolution operates orders of magnitude faster than genetic evolution, allowing humans to adapt to novel environments *without* requiring specific genetic modules for every new challenge, undermining the "massive modularity" rationale and the primacy of mismatch explanations for modern behavior.
      *   **Why Awkward:** Challenges the temporal focus on the Pleistocene and the necessity of positing modules for behaviors solvable via culture/general learning. Suggests EP overstates genetic inertia and understates flexibility.
      *   **Proponent Response:** Argue most complex cognitive *foundations* are still Pleistocene relics; recent changes are "tweaks." Emphasize that cultural evolution *requires* underlying cognitive adaptations (e.g., for imitation, theory of mind). Mismatch remains a powerful explanation for many dysfunctions.

  ---

  ### **C. Embarrassing Failures (Specific Hypotheses Only)**

  *   **Examples:** The Savannah Hypothesis (preference for open landscapes), specific waist-to-hip ratio preferences as a universal fertility cue (ignoring cultural variation), certain "cheater detection" module predictions failing strict tests, exaggerated sex differences in mating strategies explained better by social roles.
  *   **Why Only Embarrassing:** These are failures of *specific* hypotheses generated *within* the EP framework. They might stem from poor EEA reconstruction, flawed experimental design, overlooking cultural influences, or simple error. They don't invalidate the *core idea* that natural selection shaped *some* aspects of cognition, or the *method* itself when applied rigorously.
  *   **Proponent Response:** Readily concede these as bad examples, early missteps, or hypotheses needing refinement. Argue they don't represent the best current EP work. Use them to illustrate the importance of rigorous testing within the paradigm.

  ---

  ### **Proponent Concessions vs. Deflections**

  *   **Likely Concessions:** Specific hypotheses (like Savannah or overly simplistic WHR claims) were flawed or disproven. Early EEA reconstructions were sometimes fanciful. "Massive modularity" might be an unhelpful caricature; the focus is on *functional specialization*, not necessarily thousands of encapsulated circuits. Testing needs care.
  *   **Likely Deflections:** Attacks based *only* on the "just-so story" label without engaging specific methodologies or evidence. Claims that rival theories (e.g., blank-slate learning) are viable. Failures attributed purely to cultural variation without explaining the origin of the underlying capacity. Arguments that EP is unfalsifiable *in principle* (they argue it isn't).

  ---

  ### **Signature Predictions & Testability**

  *   **Signature Prediction:** **Design Specificity.** EP uniquely predicts context-dependent, functionally specialized responses that are *efficiently* triggered by evolutionarily relevant cues (even if novel) and often operate outside conscious awareness, in ways that *wouldn't* be predicted by general learning principles alone. *Example:* Context-dependent risk aversion (e.g., more risk-seeking in losses framed as "missing a sure gain" vs. losses framed as "incurring a cost," matching ancestral foraging trade-offs, even with money).
  *   **Testability Balance:** EP relies on **both**:
      *   **Negative Testability:** Ruling out alternative explanations (e.g., general learning, current cultural norms) for a specific, complex behavioral pattern. If all simpler alternatives are falsified, the evolutionary hypothesis gains credence (akin to historical sciences).
      *   **Positive Testability:** Generating *novel*, risky predictions from functional design logic (like the risk aversion example above) that are subsequently confirmed. This is where EP strives to be more than just "absence of a better alternative."
  *   **The "In Principle" Insulation Problem:** Yes, proponents can (and sometimes do) retreat to "in principle" testability when faced with methodological hurdles or failed hypotheses. **This is a significant problem** if it becomes a pattern, as it risks making EP unfalsifiable *in practice*. Good EP avoids this by:
      1.  Making precise, testable predictions *now*.
      2.  Specifying *what evidence would falsify* a specific hypothesis.
      3.  Abandoning or revising hypotheses that consistently fail tests (not just moving the goalposts on the EEA or module definition).
  *   **Science Label Load-Bearing:** The "science" label **heavily** depends on **demonstrated testability in practice**, not just the reality of natural selection. Paleontology is science because it generates testable claims about fossil sequences, biogeography, and functional morphology *that are regularly tested and sometimes falsified*. Phylogenetics is tested via congruence of different data sources (morphology, molecules) and fossil calibration points. **EP's claim to science stands or falls on whether it can consistently generate hypotheses that are both testable *and* tested, leading to cumulative progress and the rejection of false ideas.** The reality of selection is necessary but insufficient.

  ---

  ### **The "Got Wrong / Rival Got Right" Scenario (Your Persuasion Request)**

  Finding a *clean* example where EP made a unique, dated, specific prediction that was falsified *and* a rival (domain-general/cultural) account uniquely predicted the correct outcome is challenging, partly because EP often absorbs evidence into revised hypotheses. However, consider the evolution of **cooperation with non-kin in large groups:**

  *   **Classic EP Prediction (e.g., based on reciprocity/indirect reciprocity):** Humans possess specialized cognitive modules for tracking reputations, detecting cheaters, and engaging in conditional cooperation *primarily within relatively small, stable groups* like the ancestral band. Cooperation in large, anonymous groups should be fragile without strong institutions (seen as cultural overlays on small-group psychology).
  *   **Prediction:** Laboratory experiments (e.g., Public Goods Games) with anonymous, one-shot interactions should show widespread defection.
  *   **What Happened:** While defection occurs, significant levels of *unconditional* cooperation and costly punishment of defectors are consistently observed, even in anonymous, one-shot settings across diverse cultures. This is hard to explain purely by domain-specific modules evolved for small-band reciprocity.
  *   **Rival Account (Cultural Evolution / Gene-Culture Coevolution):** Humans possess powerful capacities for social learning, norm psychology (acquiring and enforcing group norms), and group identification. Cooperation can evolve culturally via cultural group selection, where groups with prosocial norms outcompete others, even if individuals within the group aren't directly related or engaging in direct reciprocity. This predicts the observed "parochial altruism" and strong norm adherence even in anonymity.
  *   **Why it Hurts EP:** The rival account explains the data better *without* needing a specific "large-scale cooperation module" shaped purely by Pleistocene individual selection. It highlights the power of cultural evolutionary processes acting *on* general social learning capacities. EP proponents now often incorporate cultural evolution, but the original strong modular prediction derived purely from the Pleistocene EEA/person individual selection model was inadequate. This shows a limitation in the *exclusivity* of the standard EP approach for complex social behaviors.

  ---

  **Conclusion:** Your position that EP *can be* science is defensible, but its scientific *status is earned through methodological rigor and empirical success, not guaranteed by its subject matter*. Fatal defeaters would be evidence against domain-specific neural implementation or proof of irreducibly heterogeneous ancestral selection preventing universal adaptations. Awkward challenges involve the difficulty of EEA reconstruction and the power of cultural evolution. Embarrassing failures are common but not programmatic. EP's strongest claim is predicting *design specificity*; its weakest point is the potential for "in principle" testability to shield it from falsification *in practice*. The "science" label depends critically on whether the field consistently engages in genuine hypothesis testing leading to the rejection of ideas, not just on the reality of natural selection. The cooperation example illustrates a case where EP's initial modular/EEA-focused predictions were outperformed by a rival emphasizing cultural evolution on a foundation of more general capacities.
