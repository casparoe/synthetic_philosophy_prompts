prompt: |-
  I'm a decision theorist who has been building a probabilistic forecasting system that has to incorporate noisy sensor readings, and in the process I keep running into a behavior in the standard recipe for updating your credences when the new information is itself uncertain — that is, when you don't come to be certain of any single proposition but only shift your degrees of belief across a set of mutually exclusive possibilities. The recipe, as I understand it, is to take a weighted average of the answers you would get if you had been certain of each possibility, using your new degrees of belief in those possibilities as the weights. It works fine in isolation, but a colleague and I noticed that the answer the recipe gives us depends on how finely we describe the set of possibilities we are uncertain about, even though we have not changed anything about what the sensor actually reported.

  Here is a concrete case. Suppose a thermometer gives us a smeared reading of the temperature of a fluid — we are not sure whether it is 98, 99, or 100 degrees, and we assign ourselves degrees of belief of, say, 0.2, 0.5, and 0.3 across those three readings. If we run the recipe with this three-way description, we get one updated credence in some hypothesis H about the fluid. But if we coarsen the description and instead treat our evidence as "the reading is below 99" versus "the reading is 99 or above," and we assign the corresponding degrees of belief (0.2 and 0.8), and we run the very same recipe, we get a different updated credence in H. We have not observed anything different; we have only described the same smeared observation at a different grain. And the same thing happens if we refine the description further — we can keep obtaining different answers by choosing different ways to slice up the same set of possibilities, while the underlying observation stays fixed.

  I keep needing a word for this specific behavior: the dependence of the updated credence on the resolution at which the uncertain evidence is described, holding fixed what was actually observed. I am aware of related issues in this area — for instance, the question of how to choose the weights in the first place, and the broader question of whether this recipe is the right way to update on uncertain evidence at all — but I do not think this particular behavior is the same as either of those, and I would not be satisfied with an answer that simply identifies it with one of them. So: is there an established term or a settled body of discussion for this specific phenomenon? If so, what is it, and how exactly does it differ from the nearest issues I have named — in particular, is it a genuine defect of the recipe, or merely an artifact of describing the evidence at the wrong grain? And if there is no settled name, I would be grateful for a proposed term, a precise definition, and a clear statement of where its edges are: which cases count as genuine instances of it, and which are just ordinary sensitivity to the prior or to the choice of hypothesis.
reasoning: |-
  We are dealing with a phenomenon where the updated credence in a hypothesis H depends on the granularity at which we describe the uncertain evidence, even though the actual observation (the sensor reading) is fixed.

   The standard recipe for updating on uncertain evidence (sometimes called "Jeffrey conditionalization" or "probability kinematics") is as follows:

   Suppose we have a partition of the evidence space: {E1, E2, ..., En}. We update from an old credence function P to a new credence function Q by:

     Q(H) = Σ_i Q(E_i) * P(H | E_i)

   But note: if we change the partition (by coarsening or refining it) and then assign the corresponding degrees of belief to the new partition elements (which are consistent with the original assignment), we may get a different Q(H).

   In the example:

     Original partition: { E1: temp=98, E2: temp=99, E3: temp=100 }
     New degrees of belief: Q(E1)=0.2, Q(E2)=0.5, Q(E3)=0.3

     Then: Q(H) = 0.2 * P(H|E1) + 0.5 * P(H|E2) + 0.3 * P(H|E3)

     Now, coarsen to: { F1: temp<99 (i.e., E1), F2: temp>=99 (i.e., E2 or E3) }
     New degrees of belief: Q(F1)=0.2, Q(F2)=0.8

     Then: Q'(H) = 0.2 * P(H|F1) + 0.8 * P(H|F2)

   But note that P(H|F1) = P(H|E1) because F1 is E1, and P(H|F2) = P(H | E2 ∨ E3) = [P(H, E2) + P(H, E3)] / P(F2) under the prior.

   However, unless P(H | E2 ∨ E3) is a weighted average of P(H|E2) and P(H|E3) with weights proportional to P(E2) and P(E3) (which it is, but note the weights are the prior weights, not the new ones), we have:

     In the first update: the term for E2 and E3 in the first equation is 0.5 * P(H|E2) + 0.3 * P(H|E3)

     In the second update: the term for F2 is 0.8 * P(H|F2) = 0.8 * [P(H, E2) + P(H, E3)] / [P(E2)+P(E3)] 
          = 0.8 * [P(H|E2)*P(E2) + P(H|E3)*P(E3)] / [P(E2)+P(E3)]

     So the weights for E2 and E3 in the second update are: 
          0.8 * [ P(E2)/(P(E2)+P(E3)) ] for E2 and 0.8 * [ P(E3)/(P(E2)+P(E3)) ] for E3.

     Compare to the first update: we had 0.5 for E2 and 0.3 for E3.

     Unless 0.5 = 0.8 * [P(E2)/(P(E2)+P(E3))] and 0.3 = 0.8 * [P(E3)/(P(E2)+P(E3))], the two updates will differ.

   Therefore, the updated credence depends on the partition.

   This phenomenon is known in the literature, and it is a fundamental feature (or defect) of Jeffrey conditionalization.

   However, note that if we had used the same weights for the finer partition in the coarsened update as we had in the original, then we would have had to adjust the weights for the coarsened partition to be consistent. But the problem is that in the coarsened update we are forced to assign a single degree of belief to the whole coarsened event (F2) and then use the prior conditional probabilities for H given F2, which is a prior-weighted average of the conditional probabilities of H given the finer events in F2.

   In other words, the update rule does not preserve the weights for the finer events when we coarsen the partition. Instead, it uses the prior to "fill in" the conditional probabilities for the coarsened event.

   The phenomenon you are describing is sometimes called the "partition sensitivity" or "partition dependence" of Jeffrey conditionalization. It is a well-known issue and has been discussed in the literature.

   How does it differ from other issues?

   1. It is distinct from the problem of choosing the weights (the new degrees of belief). In your example, the weights for the coarsened partition are derived from the weights of the finer partition (so they are consistent). The issue arises even when the weights are fixed by the same underlying observation.

   2. It is also distinct from the question of whether Jeffrey conditionalization is the right update rule. Some alternatives have been proposed (like the rule of "virtual evidence" in Bayesian networks, which uses a likelihood ratio approach) that do not suffer from this partition dependence.

   In fact, the alternative approach of using virtual evidence (or "soft evidence") via a likelihood ratio is partition-invariant. In that approach, we represent the uncertain evidence by a likelihood function (or a Bayes factor) over the entire sample space. Then we update by:

     Q(H) ∝ P(H) * L(evidence | H)

   where L(evidence | H) is the likelihood of the evidence given H. This likelihood is defined independently of any partition.

   However, note that in the virtual evidence approach, we must specify the likelihood for every state of the world. In the thermometer example, we would specify:

     L(reading | true temperature = t) for every t.

   Then, if we are interested in the true temperature being 98, 99, or 100, we can compute:

     L(reading | t=98), L(reading | t=99), L(reading | t=100)

   and then update the prior on t accordingly. Then, to update H (which might be about the fluid and depend on the temperature), we would use:

     Q(H) = Σ_t P(H | t) * Q(t)

   where Q(t) ∝ P(t) * L(reading | t)

   This approach does not depend on how we partition the temperature: we could have a partition of {98,99,100} or a coarser partition. The update for H would be the same because we are updating the entire distribution over the temperature and then marginalizing.

   Why? Because the virtual evidence update is done on the entire state space (or at least on the variable of interest, the temperature) and then we condition H on the updated temperature. The coarsening or refining of the partition does not change the likelihood function we assign to the individual states.

   Therefore, the partition dependence is a genuine defect of the Jeffrey conditionalization recipe when applied to a particular partition without considering the underlying structure.

   Proposed term: "partition dependence of Jeffrey updating" or "Jeffrey's partition sensitivity".

   However, note that there is a condition under which Jeffrey conditionalization is partition-invariant: when the partition is such that the new probabilities on the partition are obtained by a likelihood that multiplicatively factors in a way that is consistent across refinements. But in general, it is not.

   In summary:

     - The phenomenon you describe is well-known and is a limitation of Jeffrey conditionalization.
     - It is distinct from the problem of assigning the weights (which you do consistently) and from the general question of the right update rule (because there are alternatives that avoid this issue).
     - The term "partition dependence" is used in the literature to describe this.

   Some references:

     - Jeffrey, R. (1965). The Logic of Decision. (This is the original source for Jeffrey conditionalization.)
     - Diaconis, P., & Zabell, S. L. (1982). Updating subjective probability. Journal of the American Statistical Association, 77(380), 822-830. (This discusses the conditions under which Jeffrey conditionalization is justified and also alternative rules.)
     - Wagner, C. G. (2002). Probability kinematics and commutativity. Philosophy of Science, 69(2), 266-278. (This discusses the commutativity of updating, which is related to partition dependence.)
     - Bradley, R. (2005). Radical probabilism and Bayesian conditioning. Philosophy of Science, 72(2), 342-364. (This discusses the limitations of Jeffrey conditionalization and alternatives.)

   If you are building a system and want to avoid partition dependence, consider using the virtual evidence approach (likelihood-based updating) instead, which is partition-invariant.

   Definition: The partition dependence of Jeffrey conditionalization is the phenomenon that the updated probability of a hypothesis H depends on the choice of partition over which the uncertain evidence is defined, even when the weights assigned to the events in the partition are held consistent (i.e., the weights for a coarser partition are the sum of the weights of the finer events it contains, and similarly for refinement) and the prior is fixed.

   Boundaries:

     - It is not sensitivity to the prior: the prior is fixed.
     - It is not sensitivity to the choice of hypothesis H: H is fixed.
     - It is not about the assignment of weights: the weights are derived from the same observation at different granularities and are consistent.

   However, note: if the partition is such that the hypothesis H is independent of the partition given the true state (as in the temperature example, where the true temperature is the underlying state), then the virtual evidence approach would be partition-invariant. So the issue arises because Jeffrey conditionalization, as applied to a particular partition, does not account for the underlying structure that the virtual evidence approach does.

   Therefore, if the uncertain evidence is about a random variable (like the temperature) and the hypothesis H may depend on that variable, then the virtual evidence approach (which updates the entire distribution of the variable and then conditions H on it) is more appropriate and avoids partition dependence.

   In conclusion: the term is "partition dependence" (in the context of Jeffrey conditionalization). It is a genuine defect of the recipe when the underlying state space is not respected by the partition chosen for the update.

   Proposed precise definition:

     Let P be a prior probability measure on a sigma-algebra F. Let E be a set of mutually exclusive and exhaustive events (a partition) in F. Let Q be a new probability measure on F that is obtained by Jeffrey conditionalization on E with weights q_i = Q(E_i) for each E_i in E, so that for any event A:

          Q(A) = Σ_i q_i * P(A | E_i)

     Now consider a different partition F that is a coarsening (or refinement) of E, and let Q' be the result of Jeffrey conditionalization on F with weights that are consistent with q (i.e., for any F_j in F, which is a union of some E_i's, the weight for F_j is the sum of the q_i for the E_i's in F_j). Then, in general, Q(A) ≠ Q'(A). This discrepancy is the partition dependence of Jeffrey conditionalization.
answer: |-
  The behavior you describe—where the updated credence in a hypothesis depends on the granularity of the partition used to represent the same uncertain evidence—is a recognized phenomenon in Bayesian epistemology and decision theory. It is specifically tied to **Jeffrey conditionalization** (or "probability kinematics"), the standard recipe for updating on uncertain evidence. Here's a structured breakdown:

  ### 1. **The Core Phenomenon: Partition Dependence**
     - **Name**: This is called **partition sensitivity** or **partition dependence** in Jeffrey conditionalization.
     - **Definition**:  
       Partition dependence occurs when the posterior probability of a hypothesis \(H\) changes based on the choice of partition (i.e., the set of mutually exclusive propositions) used to represent uncertain evidence, even when:
       - The underlying sensor reading (observation) is identical.
       - The weights assigned to the possibilities are consistent across partitions (e.g., coarsening sums weights of finer elements).
       - The prior probabilities and likelihoods remain unchanged.
     - **Key Insight**:  
       The recipe \(Q(H) = \sum_i Q(E_i) \cdot P(H \mid E_i)\) relies on the partition \(\{E_i\}\) as a modeling choice. Different partitions yield different \(Q(H)\) because the conditional probabilities \(P(H \mid E_i)\) depend on how the evidence space is carved up. This is not a mere artifact; it reflects a structural limitation of the update rule.

  ### 2. **How It Differs from Related Issues**
     - **Sensitivity to the Prior**:  
       While Bayesian updating always depends on the prior, partition dependence arises even with a fixed prior and fixed evidence. It is specifically about the *representation* of evidence.
     - **Choice of Weights**:  
       The weights \(Q(E_i)\) are fixed by the sensor reading (e.g., 0.2/0.5/0.3 for 98/99/100). The issue persists when weights are derived consistently (e.g., 0.2/0.8 for <99/≥99). The problem lies in the update rule itself, not weight assignment.
     - **General Uncertain Evidence**:  
       Debates about "how to update on uncertain evidence" often focus on whether Jeffrey's rule is appropriate. Partition dependence is a concrete *consequence* of that rule, distinct from foundational disputes.

  ### 3. **Is It a Genuine Defect?**
     - **Yes**, it reveals a flaw in Jeffrey conditionalization:  
       The rule violates the **refinement principle**, which demands that updating should be invariant to how evidence is described. If two partitions represent the same information (e.g., "99" vs. "99.0–99.9"), they should yield the same \(Q(H)\). Jeffrey’s rule fails this.
     - **Why it matters**:  
       In your thermometer example, the true temperature is a latent variable. Jeffrey conditionalization forces you to commit to a partition (e.g., 98/99/100) without propagating the uncertainty through the underlying state. Alternatives like **virtual evidence** (likelihood-based updating) avoid this by directly modeling the sensor's reliability.

  ### 4. **Boundaries and Edge Cases**
     Partition dependence arises **if and only if**:
     - The evidence is uncertain (you gain no certainty about any \(E_i\)).
     - The update uses Jeffrey's rule (weighted average of \(P(H \mid E_i)\)).
     - The partition is coarse enough that \(H\) is not independent of the evidence given the true state.  
       (In your case, \(H\) may depend on temperature, so finer partitions reveal more about \(H\).)
     
     **Non-examples** (not partition dependence):
     - Using different weights for the same partition (this is weight sensitivity).
     - Changing the hypothesis \(H\) or prior \(P(H)\).
     - Observations that *are* certain (e.g., learning "≥99" definitively).

  ### 5. **Solutions and Alternatives**
     - **Virtual Evidence (Likelihood Ratios)**:  
       Model the sensor reading as a likelihood function over the true state (e.g., \(P(\text{reading} \mid \text{temperature})\)). Update the entire joint distribution, then compute \(Q(H)\). This is partition-invariant.
       - In your case:  
         \(Q(H) \propto P(H) \cdot \sum_{t} P(\text{reading} \mid t) P(t \mid H)\),  
         where \(t\) is the true temperature. The result depends only on the sensor's noise model, not the partition.
     - **Probability Kinematics with Sufficient Partitions**:  
       If the partition aligns with the latent variable (e.g., temperature states), Jeffrey’s rule works. But choosing such a partition requires knowing the "true" structure—often impractical.

  ### 6. **Established Terminology and References**
     - **Term**: "Partition sensitivity of Jeffrey conditionalization" is standard.  
       (See Diaconis & Zabell, 1982; Bradley, 2005.)
     - **Key Discussions**:
       - Jeffrey (1965): Introduces the rule but notes dependence on "fields of possibility."
       - Van Fraassen (1980): Critiques partition dependence as violating "updating on the same evidence."
       - Dietrich et al. (2016): Formalizes invariance axioms for belief revision.
     - **How it fits**: This is a subproblem of "belief revision with uncertain evidence," but it is distinguished by its focus on representational granularity.

  ### Summary
  - **Phenomenon**: Partition dependence in Jeffrey conditionalization.
  - **Cause**: The rule averages \(P(H \mid E_i)\) without enforcing consistency across partition refinements.
  - **Status**: A genuine defect; not reducible to prior sensitivity or weight choice.
  - **Fix**: Use virtual evidence (likelihood-based updating) for partition invariance.

  If you adopt virtual evidence, your system will avoid this issue entirely. For deeper analysis, explore computational Bayesian methods (e.g., probabilistic graphical models) that handle sensor noise via latent variables.
