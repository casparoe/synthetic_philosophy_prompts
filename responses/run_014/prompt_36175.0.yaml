answer: |-
  Based on your friend's record and glosses, I'll analyze the candidate rules, predict her verdicts for the new cases, identify which rule(s) she's likely using, and suggest a clarifying case to test the rules. Your intuition about multiple rules is plausible—her responses suggest she might be blending two distinct but related criteria for "socially constructed." Let's break it down step by step.

  ### Key Patterns in Her Existing Verdicts
  - **Constructed**: Money (entirely dependent on human agreement), race (real variation but boxes are human-made), gender (social roles/identity imposed), weeds (category defined by human context), chess (entirely invented).
  - **Not constructed**: Mountains (exist independently), gold (natural essence), flu (natural biological entity).
  - **Critical observation**: She uses two types of reasoning:
    1. **Full invention**: Things created "out of nothing" by humans (e.g., chess, money). Her gloss for chess ("made up") emphasizes this.
    2. **Categorization of reality**: Real-world phenomena where human labels/boundaries define the category (e.g., race, weeds). Her gloss for race ("boxes are ours") highlights this.

  This suggests two candidate rules operating in tandem. If either applies, she calls it "constructed."

  ### Candidate Rules
  1. **Rule A (Full Invention)**: "Constructed if it is entirely created by humans, with no basis in independent reality." Fits: money, chess.
  2. **Rule B (Categorization)**: "Constructed if it involves human-imposed boundaries, labels, or interpretations on an underlying reality." Fits: race (biological variation), weeds (plants + human context), gender (biology + social roles).
  3. **Combined Rule (A or B)**: "Constructed if either fully invented or categorized by humans." This explains all her verdicts:
     - Not constructed (neither rule): Mountains, gold, flu (exist independently; no human role in essence or boundaries).
     - Constructed (Rule A and/or B): Everything else.

  ### Predictions for New Cases
  Using the **Combined Rule (A or B)**, here are predictions:
  1. **Brain death**:  
     - **Prediction**: Constructed (fits Rule B).  
     - **Why**: The biology (brain function loss) is real, but the criteria for "death" are human-defined (by committees for transplants). Analogous to race—real variation, but boxes are ours. Her gloss for race applies directly.
  2. **Species**:  
     - **Prediction**: Constructed (fits Rule B).  
     - **Why**: Natural variation exists, but boundaries between species are set by convention (lumpers/splitters). Like race, it's a categorization of reality. Gold (not constructed) has a fixed essence (atomic number), but species boundaries are fuzzy and debated.
  3. **Mean high-water line**:  
     - **Prediction**: Constructed (fits Rule A and B).  
     - **Why**: The tides are natural (not constructed), but the line is a human-made legal abstraction (computed from data for property law). Like money, it "only works because everyone goes along with it" in a legal context. Also fits Rule B as a human-imposed boundary on natural phenomena.
  4. **ADHD**:  
     - **Prediction**: Constructed (fits Rule A and B).  
     - **Why**: The underlying behaviors/neurology may be real, but the category is human-invented (recent name, shifting criteria) and affects behavior/identity. Like chess, it's "made up" (Rule A); like weeds, it's defined by context (societal norms; Rule B).

  ### How the New Cases Split the Rules
  - If she uses **only Rule A (Full Invention)**, she would say:
    - Brain death: Not constructed (biology is real; criteria are derived, not invented ex nihilo).
    - Species: Not constructed (variation is natural; boundaries aren't "made up" like chess).
    - Mean high-water line: Constructed (invented for law, like money).
    - ADHD: Constructed (invented category, like chess).
  - If she uses **only Rule B (Categorization)**, she would say:
    - Brain death: Constructed (human-defined boundary, like race).
    - Species: Constructed (human-defined boundary, like race).
    - Mean high-water line: Constructed (human-defined boundary, like weeds).
    - ADHD: Constructed (human-defined category, like gender).
  - **Key splitter**: **Species** is the best case to distinguish rules. 
    - If she says "not constructed," she likely uses Rule A (prioritizing natural variation over boundaries) or a new rule.
    - If she says "constructed," she likely uses Rule B or the Combined Rule. Given her race verdict, "constructed" is likely.

  ### Best Guess for Her Rule
  - **She's using the Combined Rule (A or B)**. It perfectly fits all her past verdicts:
    - Mountains/gold/flu avoid both rules (independent existence; no human role).
    - Money/chess fit Rule A (full invention).
    - Race/weeds/gender fit Rule B (categorization).
  - **Why?** She doesn't treat "full invention" and "categorization" as mutually exclusive—both make something "constructed." Her glosses show flexibility: chess is "made up" (Rule A), while race/weeds are "boxed by us" (Rule B).
  - **Predicted verdicts**: All four new cases are **constructed** under the Combined Rule. Brain death, species, mean high-water line, and ADHD all involve human-dependent boundaries or invention (Rule B applies to all; Rule A also applies to mean high-water line and ADHD).

  ### One Further Case to Settle the Rule
  Ask her about **"planet"** (e.g., Pluto's demotion):
  - **Why this case?** It directly splits Rule A and Rule B:
    - **Rule A (Full Invention)**: Not constructed. Planets exist independently; reclassifying Pluto doesn't make them "made up."
    - **Rule B (Categorization)**: Constructed. The definition (e.g., "clears its orbit") is a human-imposed boundary on celestial bodies, like species or race boundaries.
    - **Combined Rule**: Constructed (fits Rule B).
  - **How it clarifies**: 
    - If she says "not constructed," she might prioritize Rule A or a new essentialist rule (e.g., "natural kinds with fixed essences are not constructed," which fits gold/flu but not species/race). 
    - If she says "constructed," it confirms Rule B or the Combined Rule. Given her race verdict, "constructed" is likely, supporting the Combined Rule.

  ### Summary
  - **Predicted verdicts**: Brain death (constructed), species (constructed), mean high-water line (constructed), ADHD (constructed).
  - **Her likely rule**: Combined Rule (A or B)—"constructed if fully invented by humans or if human-imposed categories/boundaries are applied to reality."
  - **Settling the rule**: Ask about **"planet"** to see if she prioritizes natural existence (not constructed) or human categorization (constructed). If she says constructed, it reinforces the Combined Rule; if not, she might have a more complex hierarchy (e.g., "only human-dependent categories with social consequences are constructed").

