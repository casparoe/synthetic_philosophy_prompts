prompt: |-
  I teach a community-college intro course called Life in the Universe — 30 non-majors, mostly first-years, one 75-minute block, they sit at six tables of five. About half had a real high school biology class and half didn't. I want an in-class activity that makes them feel how hard it is to say what life *is*, and specifically that the problem isn't that they haven't thought hard enough yet: whatever criterion they write down keeps either swallowing things nobody calls alive or spitting out things everybody does.

  The shape I have in mind: each table is a defintion committee for a fictional sample-return mission. Round 1 they write an operational criterion on a card and hand it to me sealed — no taking it back, no peeking at what's coming. Round 2 they get a deck of specimen cards and have to rule each one in or out strictly by their own criterion, and write the verdict down even when they hate it. Round 3 is a challenge round where another table (or me) attacks one of their verdicts and they have to defend it or amend.

  Please write the specimen deck for me. I want these in it, at minimum:

  - a giant virus — the kind that's big enough to see under a light microscope and carries some of the genes for its own protein-building machinery, so it isn't the easy "just a bag of genes" case
  - a prion: a misfolded protein that spreads by converting normal copies of itself, no nucleic acid anywhere in the picture
  - a viroid: naked circular RNA, no protein coat, a few hundred bases, makes plants sick
  - an obligate bacterial endosymbiont that lives inside insect cells with a drastically stripped-down genome and can't be grown in a dish outside its host — not self-sustaining on any normal reading, and yet nobody wants to call it non-living
  - something dormant for years with no detectable metabolism (dried seed, tun-state tardigrade, your pick)
  - a mule — obviously alive, can't reproduce
  - a crystal that grows and passes its defect pattern on to the crystals it seeds
  - a population of self-replicating computer programs on an artificial-life platform where they mutate and get culled, so they clearly change by selection over generations

  Add three or four more of your own, and make at least one of those genuinely obscure rather than another chestnut. Order the deck deliberately: start with cards everyone will agree on so their criterion feels comfortable, then land the killers. Every card should be readable with zero biology background in under ~80 words, be factually accurate, and describe what's actually known about the specimen — does it take in and use energy, does it have heredity, does it change across generations, is it bounded off from its surroundings — rather than just naming it, so they're reasoning from evidence and not from whether they've heard the word before.

  Also give each table member a role card with a different stake in the outcome: the person designing the detector that has to fire on-site, the quarantine officer deciding what comes back in the capsule, someone deciding what could be treated or destroyed, someone worried about what we'd owe it. The point is that one and the same criterion serves those jobs badly or well in different ways, so by round 3 they should be arguing about which job the definition is for rather than about the facts. That's the moment I'm after, so build the mechanics to produce it instead of hoping.

  Include: full rules, a timeline for the 75 minutes, a scoring scheme that uses no real money (some kind of mission budget where bad rulings and amendments both cost something, so patching a definition isn't free), a materials list I can print and cut in under an hour with no budget, the debrief, and an honest note on what'll go wrong the first time I run it — e.g. a table that writes "made of cells and has DNA" and then cruises, or one that amends every single round — plus what to do about each.

  In the debrief, map what happened onto the conceptual stuff: the circularity worry in evolution-based formulations (the standard astrobiology-flavored line is roughly that life is a self-sustaining chemical system capable of Darwinian evolution — but Darwinian evolution already assumes reproduction, heredity and variation, so did they just define life in terms of life?); list-of-properties versus a loose cluster of overlapping features versus "alive" admitting of degrees; whether a dormant thing is alive *now* or only has the capacity, i.e. current capacities versus being part of a lineage with a history; and the job-relativity point from the role cards. No lecture beforehand and don't say "necessary and sufficient conditions," "natural kind," or "cluster concept" anywhere until the debrief.

  Finally, be frank about which feature of the problem the activity can't reproduce and I'll have to supply by hand. My guess is it can't get them to feel whether there's a fact of the matter independent of our interests — committees will just experience this as an engineering problem they can solve with a cleverer wording — but tell me if you think the design can actually touch that, and if so, how.
reasoning: |-
  We are creating an in-class activity for a non-majors intro course on "Life in the Universe". The goal is to make students grapple with the difficulty of defining life by having them create an operational criterion and then test it against challenging specimens.

  Activity Structure:
  - Each table (6 tables of 5 students) is a definition committee for a sample-return mission.
  - Round 1: Write an operational criterion on a card (sealed, no taking back).
  - Round 2: Test their criterion against a deck of specimen cards, ruling each in or out, even when they hate the verdict.
  - Round 3: Challenge round where another table (or instructor) attacks one of their verdicts and they must defend or amend.

  Specimen Deck (minimum 8, plus 3-4 more, total 11-12):
  We'll have at least:
  1. Giant virus
  2. Prion
  3. Viroid
  4. Obligate bacterial endosymbiont
  5. Dormant organism (tun-state tardigrade)
  6. Mule
  7. Crystal with inheritance of defect pattern
  8. Self-replicating computer programs (digital life)

  Additional specimens (at least 3-4 more, including one obscure):
  9. A lichen (a symbiotic association of a fungus and a photosynthetic partner, often algae or cyanobacteria) - It's a composite organism that behaves as a unit but is made of two (or more) distinct species. This challenges the idea of individuality and what counts as a single living entity.
  10. A fire (uses energy, grows, reproduces by spreading, but not typically considered alive) - This is a classic, but we'll describe it in a way that emphasizes the properties.
  11. A dead body (e.g., a recently deceased animal) - It has all the parts of a living thing, but no metabolism. It's not alive, but it's not inanimate in the same way as a rock. This tests the boundary between life and death.
  12. An artificial cell (protocell) from a lab: a lipid vesicle that contains a self-replicating RNA molecule and can divide when it grows too large. It's a simplified model of life, but is it alive? (This is the obscure one, as it's a current research area and not commonly known to students.)

  Ordering the deck:
  Start with easy ones that everyone will agree are alive or not alive, then progress to the challenging ones. We want to build confidence and then shatter it.

  Suggested order (with reasoning for each):
  1. House cat (alive) - easy, consensus alive.
  2. Rock (not alive) - easy, consensus non-living.
  3. Fire (not alive) - classic imposter, but we describe it without naming it until the debrief? Actually, we describe it by properties so they don't know it's fire until the reveal? But we have to be accurate. We can describe it without saying "fire" until the card is revealed? But the card should be readable and clear. We'll describe it as a phenomenon: "A phenomenon that consumes fuel and oxygen, releases heat and light, grows in size, and can spread to new fuel sources. It is not made of cells." Then at the end of the activity, we can reveal it's fire.
  4. Dormant tardigrade (in tun state) - alive? But no metabolism currently.
  5. Mule - alive, but sterile.
  6. Giant virus - not alive by many definitions, but complex.
  7. Viroid - naked RNA, causes disease.
  8. Prion - misfolded protein, infectious.
  9. Obligate bacterial endosymbiont - alive but dependent.
  10. Crystal with inherited defects - not alive, but grows and "reproduces" patterns.
  11. Self-replicating computer program (digital life) - not biological, but evolves.
  12. Lichen - composite organism, alive but symbiotic to the point of being a single entity? (Both the fungus and the alga are alive, but the lichen as a whole is a unit.)
  13. Dead body - recently deceased, no metabolism, but was alive moments ago.
  14. Artificial protocell - borderline, synthetic.

  But we want to start easy and then hit hard. Let's reorder:

  Proposed deck order (14 cards):
  1. House cat (alive) - obvious.
  2. Rock (non-living) - obvious.
  3. Fire - described as: "A process that consumes fuel and oxygen, grows by spreading, releases energy as heat and light, and produces copies of itself when sparks ignite new fires." (This is non-living, but has some life-like properties.)
  4. Dormant tardigrade: "A microscopic animal in a dried state called 'tun'. It has no detectable metabolism and can remain in this state for years. When placed in water, it revives and moves, eats, and reproduces." (Is it alive now? Or only when active?)
  5. Mule: "An animal, the offspring of a horse and a donkey. It is healthy, eats, moves, and responds to its environment, but is sterile and cannot produce offspring." (Alive, but cannot reproduce.)
  6. Giant virus: "A virus that is larger than some bacteria, visible under a light microscope. It has a large genome including some genes for protein synthesis, but it cannot produce proteins on its own; it requires a host cell to replicate." (Not alive by standard definitions, but complex.)
  7. Viroid: "A small, circular RNA molecule that does not have a protein coat. It can infect plant cells, causing disease, and replicates using the host's cellular machinery." (No metabolism, no cell, just RNA.)
  8. Prion: "An infectious protein that is misfolded. It can cause normal proteins in the host to misfold, leading to disease. It contains no genetic material and replicates by converting normal proteins into the misfolded form." (No nucleic acid, just protein.)
  9. Obligate bacterial endosymbiont: "A bacterium that lives inside the cells of an insect. It has a very small genome and cannot survive or reproduce outside its host. It provides essential nutrients to the insect and is inherited from parent to offspring." (Alive, but not independently viable.)
  10. Crystal with inherited defects: "A crystal that grows in a solution. When it breaks, small pieces can seed new crystals. The new crystals inherit the same pattern of defects (like a repeating flaw) from the original crystal." (Grows, reproduces pattern, but no metabolism or evolution.)
  11. Self-replicating computer programs: "A population of computer programs that can make copies of themselves. Some copies have random mutations. A selection process removes some programs, so the population evolves over generations to become better at surviving in the digital environment." (Digital life, not biological.)
  12. Lichen: "An organism that forms from a symbiotic relationship between a fungus and a photosynthetic partner (like an alga). The two organisms live together as one unit, growing and reproducing as a whole. The fungal partner provides structure and protection, while the photosynthetic partner provides food." (Composite life form: both partners are alive, but the lichen is the entity.)
  13. Dead body: "The body of a recently deceased mammal. All the cells are intact, but there is no metabolism, no response to stimuli, and no reproduction. It will decompose over time." (Was alive, now dead.)
  14. Artificial protocell: "A laboratory-created vesicle made of lipids (fats) that forms a membrane-bound compartment. Inside, it contains a self-replicating RNA molecule. When the vesicle grows too large, it can split into two, each containing copies of the RNA." (Simplified model of a cell, but not found in nature.)

  Role cards (5 per table, each with a different stake):
  1. Detector Designer: Designs the instrument that must automatically detect life on-site. Needs a clear, unambiguous criterion that can be implemented in hardware. (They want a simple, operational definition that can be programmed.)
  2. Quarantine Officer: Decides what samples are brought back to Earth. Must prevent contamination by living alien organisms. (They want to be cautious, so they might prefer a broad definition that includes anything potentially alive, even if borderline.)
  3. Treatment Specialist: Determines what samples can be treated (e.g., with antibiotics) or destroyed. (They care about whether the sample is alive and potentially harmful, so they need to know if it can be killed or treated.)
  4. Ethics Advisor: Considers what we owe to the life forms we find. (They want to avoid harming beings that might have moral status, so they might push for a definition that includes entities that are alive and perhaps sentient, but at least alive in a way that matters ethically.)
  5. Budget Officer: Tracks mission costs. Every sample returned costs money, and every false positive (returning non-life) or false negative (missing life) has financial implications. (They want a definition that minimizes costs, so they might prefer a narrow definition to avoid returning too many samples, but also avoid missing important life.)

  Rules and Timeline for 75 minutes:
  - Total time: 75 minutes.
  - Introduction: 5 min (set the scene: sample-return mission, the roles, the task).
  - Round 1 (Writing criterion): 10 min (each table writes their criterion on a card, seals it, hands to instructor).
  - Round 2 (Testing with specimens): 25 min (each table gets a deck of 14 specimen cards. They go through each, applying their criterion, and record verdicts on a worksheet. They must stick to their written criterion.)
  - Round 3 (Challenge round): 20 min (Each table is challenged on one of their verdicts by another table or the instructor. They have to defend or amend their criterion. If they amend, it costs them mission points.)
  - Debrief: 15 min (instructor-led discussion, mapping to concepts).

  Scoring Scheme (Mission Points):
  - Each table starts with 100 mission points.
  - During Round 2: For every specimen they rule on, if their ruling is inconsistent with their own criterion (caught by the instructor during spot checks or in the challenge round), they lose 5 points per inconsistency. (But we don't want to over-penalize. Alternatively, we can rely on the challenge round to catch inconsistencies.)
  - Challenge Round: 
    - If they successfully defend their verdict (their ruling is consistent with their criterion and they explain why), they gain 10 points.
    - If they have to amend their criterion (because they admit the ruling was wrong or they want to change to avoid a bad verdict), they lose 20 points per amendment (because changing the definition after the fact is costly for the mission).
    - If they fail to defend and do not amend, they lose 10 points (for having an inconsistent or problematic definition).
  - Additional: At the end, the instructor may award up to 50 bonus points for the table that had the most robust criterion (fewest challenges that required amendment) and/or for the table that best argued their case.

  But note: We want to avoid tables amending too easily. The cost should be high.

  Materials List (all printable on paper, then cut):
  - Specimen cards (14 per deck, 6 decks) - each card has the description (80 words max) and a number (for order).
  - Role cards (5 per table, 6 tables) - each card describes the role and their stake.
  - Worksheet for Round 2: a table with specimen number, verdict (alive/not alive), and a space for notes.
  - Criterion cards (one per table) - blank cards for writing the criterion.
  - Rules and timeline handout (one per table, or projected).
  - Scoreboard (for the instructor to track points per table).

  Debrief Outline:
  1. Start by asking: "What happened? Did your definition work? Where did it break?"
  2. Highlight key specimens and the problems they caused.
  3. Map to concepts:
     - Circularity in evolution-based definitions: If they used "capable of Darwinian evolution", point out that evolution requires reproduction, heredity, and variation. But then, is that defining life in terms of life? (e.g., the mule is alive but doesn't reproduce, so they might have excluded it, but then they have to amend to include it by saying "part of a lineage that evolves", which brings in the history.)
     - List of properties vs. cluster: Did they have a list (e.g., metabolism, reproduction, etc.)? What happened when one property was missing? (e.g., mule, dormant tardigrade) Or when non-living things had some properties (fire, crystal)?
     - Dormancy: Is the tardigrade alive now? Or only when active? How do we handle things that are temporarily not functioning?
     - Job-relativity: How did the different roles at the table influence what they wanted the definition to do? (e.g., the quarantine officer wanted to include more, the budget officer wanted to exclude more.) This leads to the idea that definitions might be purpose-relative.
     - The dead body: This challenges the idea of a sharp boundary between life and death. Also, the fire and crystal challenge the boundaries between living and non-living.
     - The artificial protocell: This is a current research area. Is it alive? Scientists debate this. It shows that the boundary is fuzzy.
  4. Conclude: There is no universally agreed definition of life. Astrobiologists use operational definitions for specific missions. The activity shows that the definition we choose depends on our goals and the context.

  Honest Note on What Might Go Wrong:
  1. A table writes a very broad or very narrow definition and cruises without conflict. For example, they write "anything that contains carbon" - then they have to call the crystal (which is carbon-based?) and the dead body alive? Or they write "made of cells" and then exclude viruses, viroids, prions, and the protocell? But then they might be happy with that. How to handle? 
     - Solution: In the challenge round, the instructor can challenge them on a verdict that is counterintuitive (e.g., if they called a prion alive because it's made of carbon, but prions are not typically considered alive, then the ethics advisor might be upset because we don't owe prions the same as a cat). Or if they excluded the giant virus, the quarantine officer might be worried because viruses can be dangerous. So the roles can drive the challenge.

  2. A table amends every time they are challenged. That would cost them a lot of points, so they might avoid it. But if they do, they end up with a very long and complicated definition. We can point out in the debrief that this is like adding epicycles to a theory.

  3. Some tables might not understand the specimens. Solution: The descriptions must be clear and written for non-biologists. Also, the instructor can circulate during Round 2 to answer clarifying questions about the specimens (without giving away the game).

  4. Time: 75 minutes is tight. We might run over. Solution: Be strict with time. Use a timer.

  5. Disagreements within a table: The activity requires consensus? Or majority? We should say that the table must agree on a single criterion and a single verdict per specimen. If they can't, they can note a split but must record a majority verdict. The role cards might lead to internal arguments, which is good! That's the point.

  What the activity can't do:
  - It can't make them feel that there is a fact of the matter independent of our interests. They will experience this as an engineering problem because they are in a mission context. To address this, in the debrief, you can ask: "Do you think there is a correct definition of life that we haven't found yet? Or is it always relative to our purposes?" Then you can mention that philosophers and scientists debate this. Some think life is a natural kind (there is a fact of the matter), and others think it's a cluster concept or even a category defined by our interests. You can point out that in the activity, they were forced to be operational because of the mission, but that doesn't mean there isn't a deeper truth. However, we don't have access to that truth without a theory of life.

  Final Specimen Cards (each in about 80 words):

  1. House cat: 
     - A common pet. It breathes, eats, moves on its own, responds to its environment, grows from a kitten to an adult, and can produce offspring. It is made of cells and contains DNA.

  2. Rock:
     - A piece of granite. It does not take in energy or nutrients, does not grow, does not respond to stimuli, and does not reproduce. It may break apart due to weathering, but the pieces are not produced by the rock for the purpose of replication.

  3. Fire:
     - A process that consumes fuel and oxygen, releasing heat and light. It grows by spreading to new fuel sources and can produce copies when embers start new fires. It is not made of cells and does not have genetic material.

  4. Dormant tardigrade (in tun state):
     - A microscopic animal in a dried, dormant state called a 'tun'. It has no detectable metabolism and can survive extreme conditions for years. When placed in water, it revives, becoming active, eating, and reproducing.

  5. Mule:
     - The sterile offspring of a male donkey and a female horse. It eats, breathes, moves, and responds to its environment. It grows and develops but cannot produce offspring because it is sterile.

  6. Giant virus (e.g., Mimivirus):
     - A virus larger than some bacteria. It has a large genome including genes for some protein synthesis, but it cannot make proteins on its own. It requires a host cell to replicate by taking over the host's machinery.

  7. Viroid:
     - A small, circular RNA molecule without a protein coat. It can infect plant cells, causing disease. It does not have its own metabolism and relies entirely on the host cell for replication.

  8. Prion (e.g., causing mad cow disease):
     - An infectious protein that is misfolded. It can cause normal proteins in the host to misfold, leading to brain damage. It contains no genetic material and replicates by converting normal proteins into the misfolded form.

  9. Obligate bacterial endosymbiont (e.g., Buchnera aphidicola):
     - A bacterium that lives inside aphid cells. It has a very small genome and cannot survive outside its host. It provides essential nutrients to the aphid and is passed from mother to offspring. It cannot be grown in a lab dish alone.

  10. Crystal with inherited defects:
      - A crystal grown in a solution. When it breaks, fragments can seed new crystals. The new crystals inherit the same pattern of defects (like a repeating flaw) from the original. The crystal does not metabolize or evolve.

  11. Self-replicating computer programs (digital life):
      - A population of computer programs that copy themselves. Some copies have random mutations. A selection process removes some, so the population evolves to survive better in the digital environment. They exist only in a computer.

  12. Lichen:
      - A composite organism formed by a fungus and a photosynthetic partner (like an alga). They live together as one unit: the fungus provides structure and protection, the partner makes food. The whole lichen grows and reproduces as a single entity.

  13. Dead body (recently deceased mammal):
      - The body of a mammal that died moments ago. All cells are intact, but there is no metabolism, no response to stimuli, and no reproduction. It will decompose due to bacteria and environmental factors.

  14. Artificial protocell:
      - A lab-created sphere made of lipids (fats) that forms a membrane. Inside, it contains a self-replicating RNA molecule. When it grows too large, it splits into two, each containing RNA. It does not have a full set of life processes.

  Role Cards (each role has a name and a short description of their stake):

  1. Detector Designer:
     - "You design the life-detection instrument. It must be simple and reliable. You want a clear, yes/no criterion that can be programmed into a machine. Avoid complexity!"

  2. Quarantine Officer:
     - "You protect Earth from alien contamination. You want to quarantine anything that might be alive. You prefer a broad definition to avoid missing a dangerous life form."

  3. Treatment Specialist:
     - "You decide how to handle samples. Can we treat it with antibiotics? Heat? Chemicals? You need to know if it's alive and potentially harmful to know how to kill it."

  4. Ethics Advisor:
     - "You consider the moral implications. If it's alive, we might owe it respect or care. You want to avoid harming beings that have moral status. You prefer a definition that includes entities that are alive and might be sentient or have interests."

  5. Budget Officer:
     - "You control the mission's budget. Returning samples costs money. False alarms (non-life brought back) waste resources, but missing life is a disaster. You want a definition that minimizes costs by being neither too broad nor too narrow."

  Rules Handout (for each table):

  Activity: Defining Life for a Sample-Return Mission

  Your table is a committee for the Astrobiology Exploration Mission (AEM). You must define what counts as "life" for the mission.

  Round 1 (10 minutes):
  - Discuss and write an operational criterion for life on a card. It must be a clear, testable statement that can be used to decide if a sample is alive or not.
  - Seal the card and give it to the instructor. You cannot change it after this.

  Round 2 (25 minutes):
  - Receive a deck of 14 specimen cards. For each specimen, apply your criterion strictly and record your verdict: "Alive" or "Not Alive".
  - You must write the verdict even if you don't like it. Be consistent with your criterion.
  - Record your rulings on the worksheet.

  Round 3 (20 minutes):
  - Another table (or the instructor) will challenge one of your verdicts. They will ask: "Why did you rule X as alive/not alive?"
  - Defend your ruling by showing how you applied your criterion. If you realize your criterion leads to a problem, you may amend it, but this costs mission points.

  Scoring:
  - Starting points: 100.
  - If you amend your criterion during the challenge: -20 points per amendment.
  - If you successfully defend your ruling: +10 points.
  - If you cannot defend and do not amend: -10 points.
  - Bonus: Up to 50 points for the table with the most robust criterion and best argumentation.

  Debrief (15 minutes): Whole class discussion.

  Timeline:
  - 0-5 min: Introduction and role assignment.
  - 5-15 min: Round 1 (write criterion).
  - 15-40 min: Round 2 (test specimens).
  - 40-60 min: Round 3 (challenges).
  - 60-75 min: Debrief.

  Instructor's note for challenges: 
  - During Round 3, you (the instructor) can assign which table challenges which, or do it yourself. To save time, you might have each table challenged on one specimen by the instructor. Or, have tables challenge each other (e.g., table 1 challenges table 2 on their ruling for specimen X, then table 2 challenges table 3, etc.). But with 6 tables, 20 minutes might only allow 6 challenges (one per table). So do one challenge per table.

  What to do if a table cruises with a bad definition? 
  - The challenge round is key. The instructor can choose to challenge them on a verdict that is clearly problematic (e.g., if they called a rock alive, or a cat not alive). Also, the role cards might cause internal conflict during Round 2. For example, the quarantine officer might argue against the budget officer if the definition is too narrow.

  Finally, print and cut:
  - 6 sets of specimen cards (14 cards per set, each with the description and number).
  - 6 sets of role cards (5 cards per set).
  - Blank criterion cards (one per table).
  - Worksheets (one per table) with a table: Specimen # | Verdict | Notes.
  - Rules and timeline (one per table or projected).

  This should be doable in under an hour of prep.
answer: |-
  Below is a complete, ready-to-run activity designed to meet your goals. It emphasizes the difficulty of defining life by forcing students to confront edge cases, reveals how definitions serve practical purposes (via role cards), and structures the debrief to highlight conceptual tensions. The specimen deck is carefully ordered to start easy and escalate, with each card written for zero biology background. The activity avoids lecturing upfront and saves key terms (like "cluster concept") for the debrief.

  ---

  ### **Activity: The Astrobiology Definition Challenge**  
  *Mission Briefing:* Your table is a committee for the Interstellar Sample-Return Mission (ISRM). You must create a foolproof criterion to decide what counts as "alive" in alien samples. One definition must serve all mission roles—but each of you has a different job with conflicting priorities.  

  ---

  ### **Materials to Print/Cut** (45–60 mins prep, no budget)  
  - **Specimen Cards**: 14 cards per deck × 6 decks (see full list below).  
  - **Role Cards**: 5 unique roles per table × 6 tables (roles described below).  
  - **Criterion Cards**: 6 blank cards (one per table) for Round 1.  
  - **Verdict Worksheets**: 6 sheets (one per table) with columns: *Specimen #, Verdict (Alive/Not Alive), Notes*.  
  - **Rules/Timeline Handout**: 1 per table (summary below).  
  - **Scoring Tracker**: For you to record mission points (use a whiteboard or paper).  

  ---

  ### **Specimen Deck** (14 cards, ordered deliberately)  
  Each card is <80 words, uses plain language, and focuses on observable traits (not names). Descriptions emphasize: energy use, boundaries, reproduction, evolution, and independent function.  

  1. **Earth Cat** (Consensus Alive)  
     "A furry animal that eats, breathes, moves, and responds to its surroundings. It grows from a kitten to an adult and produces kittens of its own. Made of cells with DNA. Uses energy from food to stay alive."  
     *Why: Starts easy. Everyone agrees it’s alive.*  

  2. **Granite Rock** (Consensus Not Alive)  
     "A solid stone. Doesn’t eat, grow, or respond. Breaks into smaller pieces when crushed, but pieces don’t make copies of themselves. No internal energy use. Stays the same unless eroded by wind/water."  
     *Why: Clear non-living example. Builds confidence.*  

  3. **Tardigrade in Tun State** (Dormancy Challenge)  
     "A microscopic 'water bear' dried into a lifeless-seeming ball. No metabolism detected. Can survive years in space, then revive in water to eat, move, and reproduce. Bounded by a tough outer layer."  
     *Why: Tests "metabolism now" vs. "capacity to revive." Early curveball.*  

  4. **Mule** (Reproduction Challenge)  
     "Offspring of a horse and donkey. Eats, grows, heals wounds, and responds to threats. Completely sterile—cannot produce offspring. Made of cells with DNA. Uses energy from food."  
     *Why: Alive but can’t reproduce. Questions reproduction as essential.*  

  5. **Giant Virus (Mimivirus)** (Gray Zone 1)  
     "A virus visible under a light microscope. Carries genes for part of its protein-making machinery but can’t make proteins alone. Invades host cells to copy itself. No metabolism outside a host."  
     *Why: More complex than typical viruses—blurs "bag of genes" trope.*  

  6. **Fire** (Classic Imposter)  
     "Flames that consume fuel and oxygen to grow, spread, and release heat/light. 'Reproduces' by sparks igniting new fires. Not made of cells. No genetic material. Boundaries shift with fuel."  
     *Why: Tests growth/reproduction without biology.*  

  7. **Viroid** (Minimal Life-Like)  
     "A tiny ring of naked RNA (no protein coat). Causes disease in plants. Copies itself using host cells but has no metabolism or energy use. Few hundred atoms total. No boundary—just RNA floating freely."  
     *Why: Simpler than viruses; challenges "cells/DNA" definitions.*  

  8. **Obligate Endosymbiont (Carsonella ruddii)** (Dependent Life)  
     "A bacterium living inside insect cells. Has a tiny genome; cannot survive or reproduce outside its host. Provides nutrients to the insect. Inherited from parent to offspring. Uses host energy."  
     *Why: Unambiguously alive but not independent—tests "self-sustaining" ideas.*  

  9. **Prion** (No Genetic Material)  
     "A misfolded protein that causes disease. Converts normal proteins into misfolded copies. No DNA/RNA involved. Spreads between hosts. No metabolism or energy use—just reshapes other proteins."  
     *Why: Replicates without nucleic acids. Deeply counterintuitive.*  

  10. **Self-Replicating Computer Program (Tierra-like)** (Digital Evolution)  
      "A program that copies itself in a digital world. Mutations cause variations; unfit programs are deleted. Population evolves to survive. No metabolism—runs on external electricity. Boundaries are code/data."  
      *Why: Tests if evolution alone defines life. Non-biological.*  

  11. **Crystal with Inherited Defects** (Non-Organic Replicator)  
      "A salt crystal growing in solution. 'Reproduces' when broken pieces seed new crystals that copy its defect patterns (e.g., a zigzag flaw). No energy use or evolution. Boundaries form as it grows."  
      *Why: Physical replication without evolution. Obscure but concrete.*  

  12. **Lichen** (Composite Organism)  
      "A partnership: fungus + alga living as one unit. Fungus provides structure; alga makes food from light. Reproduces as a whole. If separated, both can live independently. Bounded by a shared outer layer."  
      *Why: Challenges "individuality"—is the symbiosis "alive" or just its parts?*  

  13. **Dead Mouse** (Life/Death Boundary)  
      "A recently deceased rodent. Cells intact; no decomposition yet. No metabolism, response, or reproduction. Earlier, it was fully alive. Now inert unless broken down by bacteria."  
      *Why: Tests if "dead" = "non-living." Forces confrontation with time.*  

  14. **Artificial Protocell** (Synthetic Edge Case)  
      "A lab-made lipid bubble containing self-replicating RNA. Splits when large, passing RNA to 'daughters.' No metabolism—building blocks added by scientists. Doesn’t evolve; boundaries form spontaneously."  
      *Why: Genuinely obscure. Current research case—scientists debate if this is "alive."*  

  ---

  ### **Role Cards** (5 per table)  
  Each role has a stake in the definition. Conflict arises because one criterion must serve all jobs.  

  1. **Detector Designer**  
     "You build the life-detection tool. Need a simple, yes/no test for the probe. Complexity costs money! Push for a criterion that’s easy to turn into hardware (e.g., 'detects DNA'). Don’t care about ethics—just function."  

  2. **Quarantine Officer**  
     "You prevent alien contamination. Err on the side of caution! If it might be alive, quarantine it. A false alarm is safer than missing life. Fight for a broad definition—even borderline cases should be flagged."  

  3. **Treatment Specialist**  
     "You decide how to handle samples. Can it be killed (e.g., with radiation)? Only alive things can be 'killed.' Push for a narrow definition—don’t waste treatments on non-living hazards like toxins or radiation."  

  4. **Ethics Advisor**  
     "You consider moral rights. If it’s alive, we might owe it care. Sterile or simple life still matters! Fight against definitions that exclude dependent/dormant life. 'Alive' = deserves ethical consideration."  

  5. **Budget Officer**  
     "You manage mission funds. Returning/quarantining samples costs $$$. False positives (non-life flagged) waste money; false negatives (missed life) risk disaster. Demand a balanced definition—minimize costs and risks."  

  ---

  ### **Rules & Timeline** (75 mins total)  
  **Setup** (5 mins):  
  - Assign roles randomly at each table.  
  - Hand out: Role cards, blank criterion card, verdict worksheet.  
  - Explain: "Your definition must be operational—e.g., 'It has DNA and uses energy.' No take-backs after Round 1!"  

  **Round 1: Define Life** (10 mins)  
  - Tables draft one criterion. Examples: "Uses energy to grow," "Can reproduce," "Made of cells."  
  - **Critical**: Seal the card and hand to you. No revisions!  

  **Round 2: Test Specimens** (25 mins)  
  - Give each table the specimen deck (ordered 1–14).  
  - They apply their criterion to each specimen, recording verdicts (Alive/Not Alive) and notes.  
  - **Rule:** They MUST follow their definition, even if they dislike the result.  

  **Round 3: Challenge Round** (20 mins)  
  - **Pair tables** (e.g., Table A challenges Table B).  
  - You assign each pair one *controversial specimen* (e.g., Mule, Prion, Protocell—use 5–14).  
  - Challenger attacks: "Why did you call [specimen] [alive/not alive]? That’s bad for [their role]!"  
  - Defender must:  
    - **Defend**: Explain how their criterion forces the verdict.  
    - **Amend**: Change their definition (costs points).  
  - **Scoring**:  
    - Successful defense: +10 points.  
    - Failed defense (inconsistent): -10 points.  
    - Amend definition: -20 points.  
    - Starting points: 100 per table.  

  **Debrief** (15 mins):  
  - Discuss: "Where did your definition break? What felt unfair?"  
  - Map to concepts:  
    1. **Circularity in evolution**: "If you defined life as ‘capable of Darwinian evolution,’ how did you handle the mule? Evolution requires reproduction, but the mule can’t reproduce. Did you say it’s ‘part of a lineage’? That defines life using... life!"  
    2. **Properties vs. clusters**: "Did your definition list traits (e.g., metabolism)? What broke when one trait was missing (e.g., prions lack metabolism)? Maybe life isn’t a checklist—it’s a loose cluster of features."  
    3. **Dormancy & potential**: "Is the tun-state tardigrade alive *now* or just capable of being alive later? Does ‘alive’ require current activity?"  
    4. **Job-relativity**: "Did your Ethics Advisor fight your Budget Officer? Definitions aren’t neutral—they serve goals. Quarantine wants inclusiveness; Budget wants efficiency."  
  - **Avoided terms until now**: Necessary/sufficient conditions, natural kind, cluster concept. Use them here!  

  ---

  ### **Scoring Scheme**  
  - **Mission Points**: Abstract "credits," not real money. Track on a board.  
  - **Costs**:  
    - Amendments (-20): Changing the definition mid-mission is expensive.  
    - Bad rulings (-10): Inconsistent verdicts hurt mission integrity.  
  - **Incentives**:  
    - Defending successfully (+10) rewards rigor.  
    - Bonus (optional): +10 to the table with fewest amendments.  
  - **Why it works**: Penalties make amending painful, forcing trade-offs. Tables can’t "patch" freely.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Problem**: A table writes "Has DNA and cells" and cruises (excludes viruses/fire but accepts cat/rock).  
     - **Fix**: In Round 3, challenge them on the *giant virus* or *protocell*. Quarantine Officer protests: "Viruses can infect us!" Ethics Advisor: "Protocells might deserve rights!" Roles force conflict.  

  2. **Problem**: A table amends repeatedly.  
     - **Fix**: Scoring penalizes amendments (-20 each). Ask: "Is your definition becoming a Swiss Army knife? Real missions can’t change tools mid-flight!"  

  3. **Problem**: Students debate facts, not definitions.  
     - **Fix**: Specimen cards include all key facts (e.g., "No metabolism" for prions). Redirect: "Don’t argue if prions *should* be alive—does your criterion *force* it?"  

  4. **Problem**: Time runs short.  
     - **Fix**: Hard-stop Round 2 at 20 mins. Assign challenges yourself (not table-to-table) to save time.  

  5. **Problem**: One role dominates.  
     - **Fix**: Circulate and remind: "Detector Designer, can your tool *actually* test that?"  

  ---

  ### **What the Activity Can’t Do (and How to Supply It)**  
  - **The "Fact of the Matter" Problem**: Committees will treat this as engineering—they’ll chase a "better" definition for the mission. They won’t feel *whether life has an essence independent of us*.  
    - **How to Supply It**: In debrief, ask:  
      - "What if we *weren’t* on a mission? Is there a ‘true’ definition of life, or is it always about our goals?"  
      - Contrast: Biologists (life as a natural kind) vs. philosophers (cluster concept).  
      - Share: "Scientists debate this! NASA’s definition includes evolution; others say it’s circular. We might never agree."  

  ---

  ### **Why This Works**  
  - **Edge cases hit hard**: Ordered deck lures them in, then prions/protocells expose cracks.  
  - **Role cards create tension**: Forces realization that definitions serve interests.  
  - **Scoring disciplines play**: Prevents casual amendments.  
  - **Debrief ties to theory**: Concepts emerge from their frustration.  

  Print the cards, set a timer, and let the chaos unfold! The moment when a table argues "Why does the Ethics Advisor care about prions?!" is when they *feel* the problem.
