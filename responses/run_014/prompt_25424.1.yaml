prompt: |-
  I keep seeing this same argument structure everywhere and I'm starting to think it's a named thing in philosophy, but I don't know what to call it.

  Here's the pattern. There's a debate about whether X should be illegal. X is something like: a weird sex act between consenting adults, or selling a drug, or paying someone to be a surrogate mother, or assisted suicide. One side says: this is immoral, it's degrading, it violates the community's values, and that's enough — the law should reflect our shared morality. The other side says: who's the victim here? If everyone involved is consenting and nobody else gets hurt, the law has no business interfering.

  What I've noticed is that these two sides aren't just disagreeing about whether X is harmful. They disagree about what counts as a legitimate reason to criminalize something in the first place. The first side thinks "it's wrong" is a complete justification. The second side thinks you need to point to a specific harm to a specific person.

  I see this split in debates about prostitution, gambling, drug laws, blasphemy, what you can put on TV, even zoning laws sometimes. It doesn't map neatly onto left and right — I've seen people on both sides of the political spectrum take each position depending on the issue.

  So my questions: does this fault line have an established name in philosophy? I'm not just after a label — I want to know if this is one debate or a cluster of related ones, what the strongest formulations of each side are, and whether there are intermedate positions I'm glossing over. Also, I've noticed that sometimes the "harm" side stretches the concept of harm until it swallows everything (like "it harms the moral climate of society") and at that point I can't tell whether they've actually abandonned their own principle. Is that move itself a recognized thing?
reasoning: |-
  Okay, the user is noticing a recurring argument pattern in debates about legality and morality. They describe two main sides: one that criminalizes based on morality, and another that requires demonstrable harm. They want to know if this is a named philosophical concept.

  First, I recall that this is a classic debate in legal philosophy. The Harm Principle from John Stuart Mill comes to mind immediately. He argued that the only justification for restricting liberty is to prevent harm to others. That matches the second side the user mentioned. Then there's Lord Devlin's response to the Wolfenden Report, where he argued that society can ban acts that undermine its moral fabric, even without direct harm. That's legal moralism.

  The user also mentioned that the harm principle sometimes gets stretched. That ties into the "offense principle" by Joel Feinberg, where preventing offense can be a reason for restrictions. But when people talk about "harm to society's moral fabric," that's more aligned with legal moralism. The key is whether harm is direct and tangible or more abstract.

  The user seems well-read but might not be familiar with the philosophical terminology. They're looking for clarity and structure to understand these debates better. They might also be interested in how these principles apply to real-world issues they observe, like drug laws or prostitution.

  I should break down the main frameworks: Mill's Harm Principle, Legal Moralism, and intermediate positions like the Offense Principle. Highlighting thinkers like Hart and Feinberg will add depth. The user might also appreciate knowing that this isn't a binary but a spectrum, with nuances in how harm is defined.

  They also pointed out that political alignment doesn't predict which side someone takes. That's important because it shows these are philosophical stances, not partisan positions. Examples like blasphemy laws (moralism) versus drug legalization (harm principle) can illustrate this.

  The stretching of the harm concept is a valid concern. Explaining how legal moralism co-opts the term "harm" to include societal degradation shows how the lines blur. This ties into Feinberg's distinction between harm and offense, and where moral harm fits in.

  I should structure the response to first name the concepts, then outline each position's strengths and weaknesses. Including intermediate stances provides a fuller picture. Addressing the harm-stretching issue will directly answer their confusion about whether principles are being abandoned.
answer: |-
  You've identified one of the most fundamental and enduring debates in legal and political philosophy! It absolutely has established names and a rich history of argument. Here's a breakdown:

  1.  **The Core Frameworks:**
      *   **The Harm Principle (John Stuart Mill):** This is the clearest articulation of the second position you described. Mill, in *On Liberty* (1859), famously argued:
          > *"The only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others. His own good, either physical or moral, is not a sufficient warrant."*
          *   **Core:** Criminalization requires proving direct, tangible harm (physical, psychological, financial) to specific, non-consenting individuals. Immorality alone is insufficient. Consent matters profoundly.
          *   **Strengths:** Protects individual liberty and autonomy; prevents tyranny of the majority; focuses law on concrete harms rather than subjective moral judgments; promotes tolerance.
          *   **Weaknesses/Challenges:** Defining "harm" precisely (especially psychological/social harms); addressing diffuse or cumulative harms (e.g., pollution, societal decay arguments); dealing with vulnerable consent (e.g., poverty, addiction); potential for neglecting collective goods.
      *   **Legal Moralism (Lord Patrick Devlin):** This framework directly opposes Mill and underpins the first position you described. Devlin, responding to the Wolfenden Report (which recommended decriminalizing homosexuality and prostitution in the UK), argued in *The Enforcement of Morals* (1965):
          *   **Core:** Society has the right, even the duty, to use the law to protect its fundamental shared moral values, even in the absence of direct harm to non-consenting individuals. Immorality itself can be seen as a harm to the social fabric and collective identity. The "disintegration thesis" suggests that tolerating serious immorality weakens the bonds holding society together.
          *   **Strengths:** Recognizes the importance of shared values and social cohesion for a stable society; acknowledges that law often *does* reflect morality (e.g., prohibitions on incest, bestiality, cruelty); addresses concerns about societal degradation and symbolic harms.
          *   **Weaknesses/Challenges:** Danger of majoritarian tyranny; difficulty defining the "shared morality" in pluralistic societies; potential for arbitrary or oppressive laws; infringes heavily on individual liberty and privacy; risks freezing moral progress.

  2.  **The Established Name for the Fault Line:**
      The central debate is most commonly called **"The Hart-Devlin Debate"** (referencing H.L.A. Hart, a prominent defender of Mill's position against Devlin). It's also framed as **"The Harm Principle vs. Legal Moralism"**.

  3.  **Intermediate and Related Positions:**
      *   **The Offense Principle (Joel Feinberg):** Feinberg, in *Offense to Others* (1985), argued that while mere immorality isn't enough, preventing *serious offense* (e.g., public indecency, extreme noise, deeply offensive displays) to unwilling observers *can* be a legitimate basis for some restrictions. This sits between Harm and Moralism, focusing on the experience of non-consenting bystanders rather than direct harm or abstract immorality.
      *   **Paternalism:** The idea that the state *can* restrict individual liberty to prevent individuals from harming *themselves* (e.g., seatbelt laws, prohibitions on certain drugs). Mill largely rejected this (except for children/incompetents); others accept limited forms ("soft paternalism" - preventing choices made under severe impairment).
      *   **Legal Perfectionism:** The view that the law *should* promote human flourishing or virtue, even if it restricts choices that don't directly harm others. Similar to Moralism but focuses on the individual's good rather than societal cohesion. (Aristotle, some modern virtue ethicists).
      *   **Libertarianism:** Takes the Harm Principle to its extreme, often rejecting even the Offense Principle and most forms of Paternalism, focusing almost exclusively on preventing violations of individual rights (like force or fraud).

  4.  **The "Stretching Harm" Problem:**
      This is a **crucial and widely recognized point of contention**. Legal moralists often *do* argue that violating shared morality *is* a type of harm – **"moral harm"** or **"societal harm"** (e.g., "It harms the institution of marriage," "It harms the moral climate," "It harms our shared sense of decency"). Critics (like Hart and Feinberg) argue this:
      *   **Conflates Harm with Offense/Disgust:** What is often called "harm" here is really just profound offense felt by some members of society.
      *   **Is Vague and Unmeasurable:** Unlike physical harm or theft, "harm to the moral fabric" is incredibly difficult to define objectively or demonstrate causally.
      *   **Swallows the Harm Principle:** If *any* moral disapproval can be labeled as "harm," then the Harm Principle becomes meaningless, as anything deemed immoral could be banned. This is effectively abandoning the core requirement of demonstrable, non-consensual harm to specific individuals.
      *   **Is Circular:** "X is harmful because it's immoral, and it's immoral because it's harmful (to society)."
      *   Feinberg meticulously distinguished **"Harms"** (setbacks to interests) from **"Offenses"** (unpleasant experiences causing dislike or disgust) and argued that only harms (and serious offenses per his principle) justify criminalization.

  5.  **Why It Doesn't Map Neatly to Left/Right:**
      *   **Harm Principle Advocates:** Often align with classical liberals, libertarians, civil libertarians, and social progressives on issues like drug legalization, sex work, and censorship. However, they might support strong environmental regulations (preventing harm) or anti-discrimination laws (preventing harm to marginalized groups).
      *   **Legal Moralist Advocates:** Often align with social conservatives on issues like obscenity, prostitution, gambling, and drug prohibition. However, they might support strong environmental regulations (protecting the shared value of nature) or campaign finance laws (protecting the shared value of democratic integrity) where the "harm" is diffuse. Some on the left might use moralistic language regarding corporate behavior or economic inequality (harming "social justice" as a shared value).

  **In Summary:**

  *   **The Fault Line:** Primarily called the **Hart-Devlin Debate** or **Harm Principle vs. Legal Moralism**.
  *   **Core Positions:**
      *   **Harm Principle (Mill/Hart):** Criminalization requires proof of direct, non-consensual harm to others. Consent is key. Morality alone is insufficient.
      *   **Legal Moralism (Devlin):** Society can criminalize acts deemed profoundly immoral to protect shared values and social cohesion, even without direct harm.
  *   **Key Intermediate:** **Offense Principle (Feinberg)** - Criminalization to prevent serious offense to unwilling observers.
  *   **The "Stretching Harm" Issue:** When Legal Moralists claim immorality *is* a societal harm, critics argue this is a **conflation of harm with offense/moral disapproval** that effectively **abandons the core constraint of the Harm Principle** and makes it vacuous. Feinberg's distinction between "harms" and "offenses" is crucial here.

  You've perfectly grasped the essence of this deep philosophical divide that structures countless real-world legal and political debates. Understanding these frameworks gives you powerful tools to analyze the arguments on both sides.
