answer: |-
  Below is a decision-tree taxonomy for the origin and status of the standard genetic code, designed to help readers navigate competing views. The tree is built from the logical space of key contested questions, using your settled facts as grounding. Each branch is labeled by a yes/no claim that splits perspectives, leading to six distinct leaves (including your specified five plus one hybrid). I prioritize logical coherence over historical figures, and explicitly note where positions are contested, unsettled, or indistinguishable.  

  ### **Settled Facts (Ground Rules)**  
  - The code is near-universal, with rare variants (e.g., mitochondria, some yeasts/ciliates).  
  - The code has an error-minimizing structure: single-nucleotide changes typically encode similar/identical amino acids.  
  - The code is functionally portable (e.g., transgenic mouse experiments).  

  ### **Contested Core Issues**  
  - **Settled**: Error-minimization exists; variant codes exist; portability is empirical.  
  - **Genuinely contested**: Whether error-minimization is adaptive; whether the code is "evolvable"; whether it is a coherent unit of selection.  
  - **No consensus**: Frozen accident is not dead, but neither is full adaptationism; the field is divided.  

  ---

  ### **Decision Tree Taxonomy**  
  *Start at the top branch and follow answers to reach a leaf. Each leaf includes a name (or "unnamed"), a one-sentence summary, and its "awkward commitment" — the fact it must explain away.*  

  1. **Is the codon-to-amino-acid mapping a natural unit that selection can act on?**  
     - **No** → **Leaf 1: Deflationary View**  
       *Summary:* The "code" isn’t a single entity shaped by selection; it’s an emergent byproduct of molecular interactions.  
       *Awkward commitment:* Must explain near-universality without appealing to selection on the code *as a whole*.  
     - **Yes** → Proceed to 2.  

  2. **Can the genetic code change without causing lineage extinction?**  
     - **No** → **Leaf 2: Frozen Accident / Neutral Drift**  
       *Summary:* The code is "frozen" because any change is lethal; its structure is a non-adaptive historical fluke.  
       *Awkward commitment:* Must explain rare variant codes (e.g., mitochondria) without invoking adaptive change.  
     - **Yes** → Proceed to 3.  

  3. **Does the error-minimizing structure require an adaptive explanation?**  
     - **No** → **Leaf 3: Stereochemical / Coevolutionary View**  
       *Summary:* Assignments reflect innate chemical affinities between codons/anticodons and amino acids; error-minimization is a side effect.  
       *Awkward commitment:* Must explain why direct experimental evidence for widespread affinities in the *standard* code is weak.  
     - **Yes** → Proceed to 4.  

  4. **Was the initial codon assignment arbitrary?**  
     - **Yes** → **Leaf 4: Hybrid Accident-Then-Selection View**  
       *Summary:* Early assignments were fixed randomly, but later additions/arrangements were optimized by selection for error-minimization.  
       *Awkward commitment:* Must explain why selection could reshape later assignments but not revise early "arbitrary" ones.  
     - **No** → Proceed to 5.  

  5. **Were initial assignments optimized from the start?**  
     - **Yes** → **Leaf 5: Selection-for-Error-Minimization View**  
       *Summary:* The entire code was shaped by selection from inception to minimize translational errors.  
       *Awkward commitment:* Must explain how selection could act before a functional translation system existed.  
     - **No** → **Leaf 6: Unnamed Stereochemical-Adaptive Hybrid**  
       *Summary:* Initial assignments were determined by chemical affinities, but selection refined the code to enhance error-minimization.  
       *Awkward commitment:* Must reconcile why affinities alone didn’t suffice, requiring supplemental selection.  

  ---

  ### **Taxonomy Notes & Diagnostics**  
  - **Why this structure?**  
    - The tree prioritizes *logical dependencies*. Branch 1 addresses the deflationary challenge head-on, as it negates all adaptationist debates. Branch 2 isolates Crick’s core "catastrophe" claim. Branch 3 separates adaptationist from non-adaptationist explanations for error-minimization. Branches 4–5 resolve ambiguities in "hybrid" views.  
    - The six leaves cover your requirements while avoiding conflation:  
      - Frozen accident (Leaf 2), selection-for-error-minimization (Leaf 5), stereochemical (Leaf 3), hybrid accident-then-selection (Leaf 4), and deflationary (Leaf 1) are included.  
      - Leaf 6 (unnamed) is added to capture a stereochemical-selection hybrid common in modern literature.  

  - **Empty Cells & Why Unoccupied:**  
    - **"No change without extinction" + "Error-minimization is adaptive"**: Logically empty. If change is impossible (Branch 2: No), adaptation is irrelevant—selection can’t act. This is why Branch 2’s "No" leads *only* to frozen accident.  
    - **"Initial assignments arbitrary" + "No adaptation"**: Unoccupied and incoherent. If assignments were arbitrary and change *is* possible (Branch 2: Yes), rejecting adaptation (Branch 3: No) collapses into stereochemical or frozen accident views—but both deny arbitrariness.  

  - **Indistinguishable Positions (Flagged):**  
    - **Leaf 3 (Stereochemical) vs. Leaf 6 (Stereochemical-Adaptive Hybrid)** cannot be split cleanly by Branch 4 ("Was initial assignment arbitrary?"). Both reject arbitrariness, but Leaf 6 invokes selection *on top of* affinities. I separate them via Branch 5 for clarity, but in practice, proponents often blur these lines.  
    - **Leaf 4 (Hybrid) vs. Leaf 5 (Selection)** are separated by Branch 4’s "arbitrary initial assignment," but both invoke selection. The distinction is pragmatic: Leaf 4 is dominant in evolutionary biology; Leaf 5 is rarer and more teleological.  

  - **Contested Boundaries (My Judgment Calls):**  
    - **Stereochemical vs. Adaptive Views**: I treat these as mutually exclusive at Branch 3 because stereochemical theories (e.g., codon-affinity) argue error-minimization is *coincidental*, not adaptive. This is contested—some argue affinities *are* adaptive—but the dichotomy clarifies the literature.  
    - **The "Unnamed" Leaf 6**: I include it as distinct from Leaf 3 because it explicitly fuses affinities *with* selection (e.g., "adaptive stereochemistry"). It’s not just repackaging—it’s a third way between pure stereochemistry and pure adaptation.  
    - **Frozen Accident’s Viability**: I place it at Branch 2 (invoking "no change without extinction") because variant codes *do* exist—but Leaf 2 survives by arguing they’re exceptions (e.g., in reduced genomes like mitochondria). This is weakened but not dead.  

  - **Where I’m Less Sure**:  
    - Whether Leaf 6 (stereochemical-adaptive hybrid) is truly distinct from Leaf 5 (pure selection) in practice. Experiments on early translation are scarce, so "initial affinities vs. initial selection" is speculative.  
    - Whether "arbitrary" (Branch 4) is well-defined. Some argue *no* assignment is truly arbitrary (due to biophysical constraints), making Leaf 4 a special case of Leaf 5 or 6. I retain it as a useful heuristic.  

  ---

  ### **How to Use This Taxonomy**  
  - **Readers locate themselves by answering branch questions sequentially**. For example:  
    - *Frozen accident adherent*: Yes (unit of selection) → No (change is lethal) → Leaf 2.  
