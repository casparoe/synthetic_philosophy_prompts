prompt: |-
  I teach a community-college intro course called Life in the Universe — 30 non-majors, mostly first-years, one 75-minute block, they sit at six tables of five. About half had a real high school biology class and half didn't. I want an in-class activity that makes them feel how hard it is to say what life *is*, and specifically that the problem isn't that they haven't thought hard enough yet: whatever criterion they write down keeps either swallowing things nobody calls alive or spitting out things everybody does.

  The shape I have in mind: each table is a defintion committee for a fictional sample-return mission. Round 1 they write an operational criterion on a card and hand it to me sealed — no taking it back, no peeking at what's coming. Round 2 they get a deck of specimen cards and have to rule each one in or out strictly by their own criterion, and write the verdict down even when they hate it. Round 3 is a challenge round where another table (or me) attacks one of their verdicts and they have to defend it or amend.

  Please write the specimen deck for me. I want these in it, at minimum:

  - a giant virus — the kind that's big enough to see under a light microscope and carries some of the genes for its own protein-building machinery, so it isn't the easy "just a bag of genes" case
  - a prion: a misfolded protein that spreads by converting normal copies of itself, no nucleic acid anywhere in the picture
  - a viroid: naked circular RNA, no protein coat, a few hundred bases, makes plants sick
  - an obligate bacterial endosymbiont that lives inside insect cells with a drastically stripped-down genome and can't be grown in a dish outside its host — not self-sustaining on any normal reading, and yet nobody wants to call it non-living
  - something dormant for years with no detectable metabolism (dried seed, tun-state tardigrade, your pick)
  - a mule — obviously alive, can't reproduce
  - a crystal that grows and passes its defect pattern on to the crystals it seeds
  - a population of self-replicating computer programs on an artificial-life platform where they mutate and get culled, so they clearly change by selection over generations

  Add three or four more of your own, and make at least one of those genuinely obscure rather than another chestnut. Order the deck deliberately: start with cards everyone will agree on so their criterion feels comfortable, then land the killers. Every card should be readable with zero biology background in under ~80 words, be factually accurate, and describe what's actually known about the specimen — does it take in and use energy, does it have heredity, does it change across generations, is it bounded off from its surroundings — rather than just naming it, so they're reasoning from evidence and not from whether they've heard the word before.

  Also give each table member a role card with a different stake in the outcome: the person designing the detector that has to fire on-site, the quarantine officer deciding what comes back in the capsule, someone deciding what could be treated or destroyed, someone worried about what we'd owe it. The point is that one and the same criterion serves those jobs badly or well in different ways, so by round 3 they should be arguing about which job the definition is for rather than about the facts. That's the moment I'm after, so build the mechanics to produce it instead of hoping.

  Include: full rules, a timeline for the 75 minutes, a scoring scheme that uses no real money (some kind of mission budget where bad rulings and amendments both cost something, so patching a definition isn't free), a materials list I can print and cut in under an hour with no budget, the debrief, and an honest note on what'll go wrong the first time I run it — e.g. a table that writes "made of cells and has DNA" and then cruises, or one that amends every single round — plus what to do about each.

  In the debrief, map what happened onto the conceptual stuff: the circularity worry in evolution-based formulations (the standard astrobiology-flavored line is roughly that life is a self-sustaining chemical system capable of Darwinian evolution — but Darwinian evolution already assumes reproduction, heredity and variation, so did they just define life in terms of life?); list-of-properties versus a loose cluster of overlapping features versus "alive" admitting of degrees; whether a dormant thing is alive *now* or only has the capacity, i.e. current capacities versus being part of a lineage with a history; and the job-relativity point from the role cards. No lecture beforehand and don't say "necessary and sufficient conditions," "natural kind," or "cluster concept" anywhere until the debrief.

  Finally, be frank about which feature of the problem the activity can't reproduce and I'll have to supply by hand. My guess is it can't get them to feel whether there's a fact of the matter independent of our interests — committees will just experience this as an engineering problem they can solve with a cleverer wording — but tell me if you think the design can actually touch that, and if so, how.
reasoning: |-
  We are creating an in-class activity for a Life in the Universe course. The goal is to make students grapple with the difficulty of defining life by having them create an operational criterion and then test it against a set of challenging specimens.

  Structure:
  - Round 1: Each table (committee) writes an operational criterion for life on a card, sealed and handed to the instructor.
  - Round 2: Each committee gets a deck of specimen cards and must rule each one in or out (alive or not alive) strictly by their own criterion, recording verdicts even if they disagree with the outcome.
  - Round 3: Challenge round where another table (or instructor) attacks one of their verdicts, and they must defend or amend their criterion (with a cost).

  Additional Requirements:
  - Specimen deck: Must include the listed examples and 3-4 more (one obscure). Order: start easy, then hit with hard ones.
  - Each card: readable in under 80 words, factually accurate, describes features (energy, heredity, boundaries, etc.) without just naming.
  - Role cards: Each table member has a role with a different stake (detector designer, quarantine officer, treatment decision, ethical concerns). The idea is that the same criterion serves these roles differently, so in Round 3 they argue about which job the definition is for.

  Logistics:
  - 75-minute block, 6 tables of 5 students.
  - Materials: printable cards (specimen deck, role cards), rules, timeline, scoring (mission budget), debrief.

  Specimen Deck (12 cards, ordered deliberately):

  1. **House Cat**: A familiar animal. It moves, eats, breathes, reproduces, and responds to its environment. It has a complex internal structure with cells and DNA. It grows from a kitten to an adult and can produce offspring. [Easy, everyone will call alive.]

  2. **River Water**: A sample of water from a river. It contains dissolved minerals and organic compounds. Under a microscope, you see no cells or organized structures. It flows and can erode rocks, but it doesn't grow or reproduce on its own. [Non-living, but has energy flow and change.]

  3. **Brewer's Yeast (Saccharomyces cerevisiae)**: A single-celled fungus. It can be dormant as dried powder but when placed in sugar water, it becomes active, metabolizes sugar, and reproduces by budding. It has a cell membrane, DNA, and can adapt to environmental changes. [Alive, but introduces dormancy.]

  4. **Tardigrade in Tun State**: A microscopic animal that can enter a state called "tun" when dried out. In this state, it shows no metabolic activity and can survive for years. When rehydrated, it becomes active again, feeds, and reproduces. [Dormant but revivable.]

  5. **Mule**: The offspring of a horse and a donkey. It is healthy and active, eats, grows, and responds to its environment. However, it is sterile and cannot produce offspring. [Alive but cannot reproduce.]

  6. **Giant Virus (Mimivirus)**: A virus that is larger than some bacteria, visible under a light microscope. It has a protein coat and carries genes for some of its own protein-making machinery. However, it cannot reproduce on its own and must infect a host cell to replicate. [Blurs the line between virus and living cell.]

  7. **Obligate Bacterial Endosymbiont (e.g., Carsonella ruddii)**: A bacterium that lives inside insect cells. It has a very small genome and cannot be grown in a lab dish without its host. It depends on the host for many essential functions but can replicate its DNA and divide within the host. [Not self-sustaining, but clearly living?]

  8. **Viroid (e.g., Potato spindle tuber viroid)**: A tiny, circular RNA molecule without a protein coat. It can infect plants, causing disease. It does not have a metabolism and does not produce energy, but it can replicate inside host cells by using the host's machinery. [Naked RNA, no cell, no metabolism.]

  9. **Prion (e.g., causing Mad Cow Disease)**: A misfolded protein that can cause other normal proteins to misfold. It spreads in the brain, leading to disease. It does not contain DNA or RNA and does not metabolize or use energy. It simply changes the shape of existing proteins. [Protein only, no nucleic acid.]

  10. **Self-Replicating Crystal (e.g., Bismuth crystal)**: A crystal that grows when placed in a solution, adding layers to its structure. Sometimes, when small pieces break off, they can seed new crystals that have the same structure and even the same pattern of defects as the original. [Grows and passes on structure, but no metabolism, not made of organic molecules.]

  11. **Tierra Digital Organism**: A computer program in an artificial life simulation. These programs can self-replicate, mutate, and compete for computer memory and CPU time. The environment culls programs that are less efficient, leading to evolution of more complex programs over generations. [Digital life, evolves, but not physical.]

  12. **Obscure: Stromatolite**: A layered rock structure formed by the trapping and binding of sediment by microbial mats (cyanobacteria). The living bacteria are alive, but the rock structure itself is not. However, the rock grows and preserves a record of the living community. Is the entire structure alive? [Blurs individual and community, and the structure is a byproduct.]

  Order: 
  - Start with 1 (cat) and 2 (river water) for easy agreement.
  - Then 3 (yeast) and 4 (tardigrade) to introduce dormancy and revival.
  - Then 5 (mule) for reproduction issue.
  - Then 6 (giant virus) and 7 (endosymbiont) for dependency and incomplete machinery.
  - Then 8 (viroid) and 9 (prion) for minimal hereditary without metabolism.
  - Then 10 (crystal) and 11 (digital) for non-organic and digital.
  - End with 12 (stromatolite) for the community/rock structure.

  Role Cards (5 per table, each with a stake):

  1. **Detector Designer**: You design the instrument that must detect life on-site. Your priority is a clear, unambiguous signal that can be automated. You care about false positives (saying there's life when there isn't) because that wastes mission time and resources.

  2. **Quarantine Officer**: You decide what samples can be brought back to Earth without risk. You are concerned about containment and the potential for harm. You care about false negatives (missing a living thing that could be dangerous) and also about not over-quarantining non-living samples.

  3. **Treatment Officer**: You decide what samples can be treated (e.g., for study) or destroyed. You are concerned about ethical treatment of living beings and conservation. You care about recognizing life that might deserve ethical consideration.

  4. **Ethics Advisor**: You consider what we owe to any life we find. You are concerned about the moral status of living things and whether they have interests. You care about not mistreating life, but also about not attributing moral status to non-living things.

  5. **Mission Director**: You oversee the budget and overall success. You care about efficiency and the mission's scientific return. You want a definition that is practical and doesn't lead to costly mistakes or controversies.

  Scoring (Mission Budget):

  - Each table starts with 100 mission points.
  - In Round 2: For each specimen, if they rule it alive and it is generally accepted as living (by consensus of scientists), they gain 5 points. If they rule it non-living and it is generally non-living, they gain 5 points. But if they misclassify (by general consensus), they lose 10 points. [Note: We are not claiming there is an absolute truth, but we need a scoring mechanism. We'll base it on common scientific consensus for the activity.]
  - In Round 3: If they amend their criterion, it costs 20 points (because changing the mission parameters is expensive). If they successfully defend their verdict without amending, they gain 10 points. If they fail to defend and don't amend, they lose 20 points (for inconsistency). If they fail to defend and amend, they lose 20 points for the bad ruling and then 20 points for the amendment, so net -40? [Let's adjust: amendment costs 20 points, and they also have to take the point hit for any misclassification that was challenged? But maybe we don't want to double-penalize. Alternatively, we can have the challenge round only about the one specimen, and then adjust points for that one.]

  Alternative scoring for Round 3: 
  - When a challenge is made (by another table or instructor) on a specific verdict, the defending table must explain their ruling based on their criterion.
  - If the challenge is successful (i.e., the committee agrees that the verdict is problematic and they amend the criterion), they get a penalty of 20 points for amending. But note: they might amend to fix the problem and avoid future misclassifications, so we don't want to penalize too heavily.
  - Alternatively, we can have the challenge round as a way to catch errors without amending? Maybe we don't want to force amendment.

  Revised scoring for Round 3:
  - The challenge is on one specific specimen verdict. The committee must defend using their current criterion. 
  - The challenger (another table or instructor) points out the problem (e.g., "You called X alive, but by your criterion, Y must also be alive, but you called Y non-living" or "This contradicts because...")
  - The committee can either:
     a) Successfully defend: They show how the verdict follows from the criterion and the evidence, and the challenger is satisfied. Then they gain 10 points for a good defense.
     b) Amend the criterion: They change the criterion to fix the inconsistency. This costs 20 points and they must re-rule on that specimen (and any others that might be affected, but for time, we just do that one). They then get the chance to re-rule and if they correct the verdict (to match consensus) they get the 5 points for correct classification (but they already lost points in Round 2 for misclassification, so maybe we don't give extra). Alternatively, we can say that by amending they avoid the misclassification penalty for that specimen? Let's clarify.

  To avoid complexity, we can do:

  Round 2 scoring: 
  - After they rule on all specimens, we reveal the "consensus" (predefined by instructor) for each. For each specimen, if their ruling matches consensus, they get +5. If not, -10.

  Round 3: 
  - Each table must be ready to defend one verdict (chosen by challenger). 
  - If they successfully defend (their ruling is consistent with their criterion and the evidence, even if it doesn't match consensus), they get +10. 
  - If they fail to defend (their ruling is inconsistent with their own criterion, or they admit it's flawed) and they amend, they pay 20 points and then re-rule on that specimen (and get the chance to score +5 if they now match consensus, or -10 if they still don't). 
  - If they fail to defend and do not amend, they lose 20 points and the verdict stands (with the Round 2 score).

  But note: we want to encourage amendment when the criterion is flawed, but at a cost.

  Alternatively, we can skip the consensus scoring and focus on internal consistency and the roles. Maybe the scoring should be about how well the criterion serves the role's needs? But that might be too vague.

  Revised plan: Don't use consensus as the truth. Instead, the scoring is about the mission's success, which depends on the roles. But that is complex.

  Given time constraints, I propose:

  - In Round 2, they don't get points per specimen. Instead, they are setting up for Round 3.
  - In Round 3, each table will be challenged on one specimen by the instructor (or another table) and must defend. The success is based on whether they can defend consistently and whether the definition serves the roles.

  But we need a scoring system. Let's make it about the roles:

  At the end, each role player at the table rates the definition on a scale of 1-5 for how well it serves their needs (without knowing which table they are rating, to avoid bias). Then average the ratings and multiply by 10 for points? But that might be too subjective.

  Alternatively, we can have the instructor assign points based on:
  - Internal consistency of the criterion and rulings (did they apply it uniformly?).
  - How well the criterion addresses the concerns of the roles (as argued in Round 3).
  - But this is vague.

  Given the complexity, I suggest a simpler approach:

  - The mission budget is for the entire activity. 
  - Start with 100 points.
  - Every time they amend the criterion: -20 points (because changing the mission parameters is expensive).
  - In the challenge round, if they cannot defend a verdict and it is exposed as inconsistent, they lose 10 points (for a mission error).
  - But if they defend successfully, they gain 5 points.

  And then we can add: after the activity, the instructor can award up to 50 points based on the quality of the definition and the argumentation (to reward thoughtful ones).

  But we want to avoid too much subjectivity.

  Another idea: In Round 2, they get 5 points for each specimen they rule on (just for completing the task). Then in Round 3, the challenge round is about penalties and bonuses.

  I think we need to keep it simple.

  Final Scoring Proposal:

  - Each table starts with 0 points.
  - Round 1: Writing a criterion: 10 points (just for having one).
  - Round 2: Ruling on each specimen: 1 point per specimen for completing the ruling (max 12 points). 
  - Round 3: For each challenge (each table will face one challenge), 
     - If they successfully defend without amending: +10 points.
     - If they amend: they get 0 points (they avoid a penalty but pay the amendment cost of 20 points, so net -20?).
     - If they fail to defend and do not amend: -10 points.
     (Amendment cost: 20 points, so if they amend, they get 0 for the defense but lose 20 points.)

  But we want amendment to be an option, so let's set:
  - Amendment: costs 20 points, but they can fix the problem and avoid the defense penalty. So if they amend, they don't get the -10 for failing to defend, but they pay 20.

  So in Round 3:
  - The table is challenged on one specimen.
  - They have two minutes to discuss.
  - They can choose to defend or amend.
  - If they defend and the challenger (instructor) is convinced (the ruling is consistent with the criterion and they explain it well), they get +10.
  - If they defend and the instructor is not convinced (inconsistent, or they can't explain), they get -10.
  - If they amend, they pay 20 points and then change their criterion. They then re-rule on that specimen (but no extra points, because Round 2 points are already given).

  Alternatively, to avoid instructor bias, we can have the challenger be another table. But that might be chaotic.

  Given the time, I suggest the instructor acts as the challenger for all, moving from table to table.

  Timeline for 75 minutes:

  - 0-5 min: Introduce the activity, explain the mission scenario, and assign roles. Hand out role cards to each table. Explain the three rounds and scoring. (5 min)
  - Round 1: 10 min for tables to discuss and write their criterion on a card, seal it, and hand to instructor.
  - Round 2: 20 min for tables to go through the specimen deck (12 cards). They read each card, discuss, and record their verdict (alive or not) for each. They must use their own criterion. They fill out a verdict sheet.
  - Round 3: 30 min challenge round. The instructor (or a designated challenger from another table) challenges one verdict per table. Each table gets 3-4 minutes to defend or amend. (6 tables * 4 min = 24 min, plus transitions.) 
  - Debrief: 10 min.

  Materials to print and cut:
  - Specimen cards (12 per deck, 6 decks) — each card has the description and a number.
  - Role cards (5 per table, 6 tables) — each card has the role and a short description of the stake.
  - Verdict sheets for Round 2 (one per table) with specimen numbers and a column for verdict.
  - Criterion cards (one per table for Round 1).
  - Scoring sheet for the instructor to track points.

  Debrief Points:

  1. Circularity in definitions: For example, if they used "capable of evolution", note that evolution requires reproduction and heredity, which are already life features. Did they notice that?

  2. List of properties vs. cluster: Many definitions list properties (metabolism, reproduction, etc.), but then we have exceptions (mule, dormant). So is life a cluster of features with no single one necessary?

  3. Dormancy: Is a dormant tardigrade alive now? Or does it only have the capacity to be alive? How does that fit?

  4. Job-relativity: How did the roles influence the argument? Did they realize that the same definition might be good for the detector (avoiding false positives) but bad for quarantine (missing dangerous things)? So the definition might depend on the purpose.

  5. The fact of the matter: The activity can't reproduce the idea that there might be a fact of the matter independent of our interests. Committees will see it as an engineering problem. In the debrief, point this out: "Did you feel like there was a right answer out there, or were you just trying to make a useful rule? Why?"

  What will go wrong:

  1. A table writes "made of cells and has DNA" and then cruises because they rule out the virus, viroid, prion, crystal, digital. But then they have to rule the mule as alive (which is fine) and the endosymbiont as alive (cells and DNA), but what about the tardigrade in tun state? It has cells and DNA, so they call it alive. They might be happy until the challenge: the crystal isn't made of cells and doesn't have DNA, so they rule non-living, which is fine. But the digital organism? Not made of cells, no DNA, so non-living. The stromatolite? The living bacteria have cells and DNA, but the rock structure does not. How do they rule? They might say the sample includes living bacteria, so alive? But the card says "a layered rock structure", so they might rule non-living and then get challenged: "But it is formed by living things and contains them?" This might force an amendment.

  2. A table that amends every single challenge: To prevent this, the amendment cost (20 points) should be high enough to deter frivolous changes. Also, limit to one amendment per challenge.

  3. A table that cannot agree: Encourage the Mission Director to break ties.

  4. Time: Round 2 might take longer than 20 minutes for 12 cards. Solution: Have the specimens in a fixed order and impose a time limit per card (about 1.5 min per card).

  First-time advice:
  - Have a timer visible.
  - For Round 3, the instructor should prepare challenging questions for each table, focusing on a specimen where their criterion leads to a verdict that conflicts with one of their roles. For example, for a table that ruled a prion non-living, the quarantine officer might worry: "But if it's non-living, we wouldn't quarantine it, and it could cause an outbreak?" Then the committee must consider the role's concern.

  Honest note: The activity can't make them feel that there's a fact of the matter independent of our interests. They will experience it as an engineering problem. In the debrief, explicitly raise this: "Did anyone feel like there was a true answer that we just hadn't discovered yet? Or did it feel like we were making a tool for a job? How might that change if we found alien life that was very different?"

  Final Specimen Deck Write-ups (each under 80 words):

  1. House Cat: A common animal. It eats, breathes, and moves. It grows from a kitten to an adult and reproduces to have kittens of its own. It has cells containing DNA and responds to its environment. (Alive, easy.)

  2. River Water: A sample of water from a river. It flows and carries minerals and organic matter. It shows no organized structure under a microscope and does not grow or reproduce. It can change the landscape by erosion. (Non-living.)

  3. Brewer's Yeast: Dried yeast powder. When added to sugar water, it becomes active: it takes in sugar, produces carbon dioxide and alcohol, and reproduces by budding. Each yeast cell has a cell membrane and DNA. (Alive, but shows dormancy.)

  4. Tardigrade in Tun State: A microscopic animal in a dried state. It shows no signs of life: no movement, no metabolism. It can remain like this for years. When water is added, it becomes active, feeds, and reproduces. (Dormant but revivable.)

  5. Mule: A sturdy animal, offspring of a horse and donkey. It eats, grows, and responds to its environment. However, it is sterile and cannot produce offspring. (Alive but sterile.)

  6. Giant Virus (Mimivirus): A large virus visible under a light microscope. It carries genes for some protein-making machinery but cannot use them on its own. It must infect a host cell to replicate. It has a protein coat but no metabolism. (Virus with some cell-like genes.)

  7. Obligate Bacterial Endosymbiont (Carsonella): A bacterium living inside insect cells. It has a very small genome and cannot survive outside its host. It depends on the host for many functions but can replicate its DNA and divide within the host. (Not independent, but replicates.)

  8. Viroid: A tiny, circular RNA molecule without a protein coat. It does not have a metabolism or use energy. When it enters a plant cell, it uses the cell's machinery to replicate and causes disease. (Naked RNA, no cell.)

  9. Prion: A misfolded protein that can cause normal proteins to misfold. It spreads in the brain, causing disease. It does not contain DNA or RNA and does not use energy. It only changes the shape of existing proteins. (Infectious protein.)

  10. Self-Replicating Crystal: A crystal of bismuth. When placed in a solution, it grows by adding layers. If a piece breaks off, it can start a new crystal that has the same structure and defect pattern as the original. (Grows and passes on structure.)

  11. Tierra Digital Organism: A computer program that copies itself. It uses CPU time and memory to replicate. Sometimes it mutates, and the environment deletes programs that run too slowly. Over time, the programs evolve to be more efficient. (Digital evolution.)

  12. Stromatolite: A layered rock structure formed by sediment trapped by sticky microbial mats (cyanobacteria). The living bacteria are in the surface layer, but the rock itself is mostly mineral. The structure grows over time and can become very large. (Community and mineral structure.)

  Rules Summary Handout:

  - Round 1: Your table has 10 minutes to write a single, clear operational criterion for what counts as "alive" for this mission. Write it on the card, seal it, and hand to instructor. No changes after.
  - Round 2: You will receive a deck of 12 specimen cards. For each, read the description and apply your criterion. Record your verdict: Alive or Not Alive. Do not change your criterion. (20 minutes)
  - Round 3: The instructor (or another table) will challenge one of your verdicts. You have 3 minutes to either:
     a) Defend your verdict using your criterion and the evidence, or
     b) Amend your criterion (costs 20 mission points) and then re-rule on that specimen.
  - Scoring: 
     - Round 1: 10 points for submitting a criterion.
     - Round 2: 1 point per specimen ruled (max 12).
     - Round 3: 
          - Defend successfully: +10 points
          - Defend unsuccessfully: -10 points
          - Amend: -20 points (and no additional penalty for the verdict, but you must re-rule and that verdict stands for scoring in Round 2? Actually, Round 2 points are already given. So the amend cost is the only penalty for that round.)

  But note: if they amend, they might change the criterion and then the verdict for that specimen might change. We can allow them to change the verdict and then they get the Round 2 point for that specimen if they now have a verdict? But Round 2 is over.

  To keep it simple, we can say that the Round 2 points are fixed based on the initial rulings. Round 3 is separate. The amendment only affects future missions, so the initial ruling stands for scoring, but they avoid the defense penalty by paying the amendment cost.

  This is messy. I suggest we don't have Round 2 scoring per specimen. Instead, we have:

  - Round 1: 10 points
  - Round 2: 12 points (1 per specimen) for completing the task
  - Round 3: 
     - If they defend successfully: +10
     - If they defend unsuccessfully: -10
     - If they amend: -20 (and no defense points, because they changed)

  Then total points = Round1 + Round2 + Round3

  And the amendment cost is high enough to deter frequent changes.

  Debrief Outline (10 min):

  1. Ask: "What was the hardest specimen to rule on? Why?"
  2. Point out the circularity in evolution-based definitions: "If you used evolution, did you notice that evolution requires life-like properties already?"
  3. Highlight the dormancy issue: "Is a dormant thing alive now? What does it mean to be alive at a given moment?"
  4. Discuss the mule and reproduction: "Is reproduction essential? What about individuals that can't reproduce?"
  5. Talk about the roles: "Did anyone change their mind based on the role they were playing? How should the purpose affect the definition?"
  6. Finally: "Do you think there is a fact of the matter about what is alive, independent of our interests? Or is it always tied to our purposes?"

  The activity cannot make them feel the independent fact of the matter. The debrief must explicitly raise it and contrast with the engineering approach they took.
answer: |-
  Below is a complete, ready-to-run classroom activity designed to meet your goals. It's structured to make students confront the ambiguity of defining life through hands-on decision-making, role-playing, and debate. The activity forces them to see that no single criterion works perfectly across all cases, highlights the role of context/purpose in definitions, and sets up your debrief on core conceptual issues.

  ### **Activity Title: The Astrobiology Definition Dilemma**
  **Premise:** Tables are definition committees for a sample-return mission from Mars. They must define "life" operationally to classify specimens. The catch: their definition must serve conflicting mission priorities, and they can't backtrack once they see the specimens.

  ---

  ### **Materials to Print & Cut (45 mins prep, no budget)**
  - **Specimen Cards (12 total, 1 set per table):** See deck below. Print 6 identical sets. Each card has a number (1–12) and a description.
  - **Role Cards (5 per table, 30 total):** Print 6 sets. Each card has a role and a short stake description:
    - **Detector Designer:** "You design the life-detection tool. Priority: Avoid false positives (non-life mistaken for life). Why? False alarms waste mission time/funding."
    - **Quarantine Officer:** "You decide what enters Earth. Priority: Avoid false negatives (life mistaken for non-life). Why? Missing dangerous life risks planetary contamination."
    - **Treatment Officer:** "You decide what can be treated/destroyed. Priority: Avoid harming life with ethical value. Why? Destroying life could violate interstellar protection laws."
    - **Ethics Advisor:** "You consider our duties to life. Priority: Avoid denying rights to living beings. Why? Mistreating life could lead to moral/legal repercussions."
    - **Mission Director:** "You manage mission success. Priority: Balance all risks within budget. Why: Your job is to get high-value science without overspending."
  - **Blank Criterion Cards (1 per table):** Index cards or paper slips for Round 1.
  - **Verdict Sheets (1 per table):** A simple table with columns: Specimen # | Verdict (Alive/Not Alive) | Notes.
  - **Budget Tokens (Optional):** Paper clips or beads to represent "mission points" (start with 100 per table).

  ---

  ### **Specimen Deck (Ordered Deliberately)**
  Each card is <80 words, uses simple language, and focuses on observable traits (not jargon). Facts are accurate and drawn from astrobiology literature. Descriptions avoid naming the specimen to prevent preconceptions—e.g., "giant virus" isn't named, just described.

  1. **Common Earth Animal (e.g., squirrel):** "A furry animal. It eats nuts, moves on its own, responds to threats, and produces offspring. It has cells, uses energy from food, and maintains its internal environment. Found in parks worldwide."  
     *(Start easy—everyone agrees it's alive.)*

  2. **River Water:** "A liquid sample. It flows downhill, carries minerals/sediment, and erodes rock. Under a microscope, it shows no internal structure. It doesn't grow, change on its own, or produce copies of itself."  
     *(Easy non-life—sets confidence.)*

  3. **Dried Seed (e.g., lotus seed):** "A hard, dried object. No movement, energy use, or metabolism detected. When placed in water/soil, it may sprout into a plant after years. Contains genetic material (DNA) inside protective layers."  
     *(Dormancy intro—alive or not now?)*

  4. **Mule:** "A healthy, adult animal. It eats, moves, heals injuries, and interacts with others. Medical scans show complex organs and DNA. But it cannot produce offspring due to genetic incompatibility."  
     *(Alive but can't reproduce—challenges reproduction as essential.)*

  5. **Giant Virus (e.g., Mimivirus):** "A large microbe visible under light microscopes. It has genes for building proteins and a protective shell. Cannot use energy or replicate alone—it hijacks cells to copy itself. Causes disease in amoebas."  
     *(Blurs virus/life line—has some genes but no autonomy.)*

  6. **Obligate Endosymbiont (e.g., Tremblaya bacteria):** "A microbe living inside insect cells. It has DNA and divides to make copies. Cannot survive alone—it relies on the host for energy and nutrients. Never grown in a lab without its host."  
     *(Alive but not independent—challenges self-sustaining.)*

  7. **Crystal with Replicating Defects (e.g., Bismuth):** "A metallic crystal. Grows in solution, adding layers. When pieces break off, they form new crystals with identical defect patterns. No genetic material; changes are physical, not adaptive."  
     *(Grows/inherits—but no evolution or metabolism.)*

  8. **Viroid (e.g., Potato Spindle Tuber Viroid):** "A tiny, circular RNA strand. No protective shell or metabolism. Invades plant cells, uses the cell’s machinery to copy itself, and causes disease. No energy use or movement observed."  
     *(Naked RNA—heredity without cells/proteins.)*

  9. **Tardigrade in Tun State:** "A microscopic animal in dried 'tun' form. No metabolism, movement, or energy use detected—can stay like this for decades. When rehydrated, it becomes active, feeds, and reproduces. Contains DNA."  
     *(Dormancy deep dive—capacity vs. current state.)*

  10. **Prion (e.g., causing Mad Cow Disease):** "A misfolded protein. Not alive by standard tests: no genes, metabolism, or energy use. Spreads by converting normal proteins into misfolded copies. Causes fatal brain disease in animals."  
      *(Heredity without nucleic acids—pure protein.)*

  11. **Digital Organism (e.g., Tierra program):** "A self-replicating computer program. Copies itself, competes for resources, and mutates. Less efficient versions are deleted. Over generations, programs evolve to be smaller/faster. No physical body."  
      *(Evolution without chemistry—tests "Darwinian" definitions.)*

  12. **Obscure: Panspermia Candidate (e.g., Deinococcus radiodurans in meteorite sim):** "Bacteria-like cells in a rock. No metabolism detected; hardened against radiation/space. If placed in ideal conditions, they may revive and replicate. Debate exists: are they 'alive' in the rock or just preserved?"  
      *(Real-world astrobiology gray area—blurs line between dormant and non-living.)*

  **Deck Order Rationale:** Starts with consensus cases (1–2), then introduces edge cases gradually: dormancy (3), reproduction (4), dependency (5–6), non-organic replication (7–8), extreme dormancy (9), non-nucleic heredity (10), digital life (11), and ends with an obscure astrobiology puzzle (12). This "ramp" lures them into confidence before hitting hard cases.

  ---

  ### **Rules & Timeline (75 mins total)**
  **Scoring Scheme (Mission Budget):**  
  - Each table starts with **100 mission points**. Points track success; no real money.  
  - **Costs:**  
    - **Bad ruling penalty:** -10 points per specimen if their verdict contradicts their *own criterion* (exposed in Round 3).  
    - **Amendment cost:** -20 points if they change their criterion in Round 3 (simulates mission replanning costs).  
    - **Defense bonus:** +10 points if they defend a verdict successfully without amending.  
  - **Goal:** Maximize points. Low points = mission failure. This incentivizes clear, robust definitions.

  **Timeline:**  
  1. **Intro (5 mins):** Frame the mission scenario. Hand out role cards randomly. Emphasize: "Your definition must work for *all* your roles—no favoring one!" No lecture on life concepts.  
  2. **Round 1: Define Life (10 mins):**  
     - Tables draft one operational criterion (e.g., "It uses energy to maintain itself").  
     - They write it on a card, seal it in an envelope, and hand it to you. *No changes allowed.*  
  3. **Round 2: Classify Specimens (20 mins):**  
     - Hand each table a specimen deck (in order 1–12) and a verdict sheet.  
     - They classify each specimen as "Alive" or "Not Alive" strictly using their criterion. They *must* record verdicts, even if uncomfortable.  
     - *Time management:* Enforce ~1.5 mins per specimen. Announce time warnings.  
  4. **Round 3: Challenge & Defend (30 mins):**  
     - Each table is challenged once:  
       - You (or a neighboring table) attack one verdict where their ruling clashes with a role’s priority (e.g., "Quarantine Officer, you ruled prions 'not alive'—but if they’re infectious, isn’t that a false negative risk?").  
       - Tables have 2 mins to discuss. They must either:  
         - **Defend:** Explain how their verdict fits their criterion and role priorities (no amendments). If consistent, they gain +10 points.  
         - **Amend:** Change their criterion to fix the issue (costs -20 points). They update the verdict for that specimen.  
       - If their defense is inconsistent (e.g., verdict doesn’t match criterion), penalize -10 points.  
     - Rotate quickly: Allot 4 mins per table (6 tables × 4 mins = 24 mins + transitions).  
  5. **Debrief (10 mins):** See detailed guide below.

  ---

  ### **Predictable Problems & Solutions**
  1. **Problem: Overly simple criteria (e.g., "Has DNA and cells").**  
     - *Why it happens:* Students default to high-school bio definitions.  
     - *Solution:* In Round 3, attack with specimens that break their rule (e.g., prions for "DNA," endosymbiont for "cells"). Ask: "Detector Designer, if your tool fires only on cells, would it miss a digital organism that evolves? Is that acceptable for your role?" Forces refinement.

  2. **Problem: A table amends repeatedly.**  
     - *Why it happens:* They try to "fix" every challenge.  
     - *Solution:* The -20 point amendment cost discourages this. After one amendment, warn: "Your mission budget is draining—make this count!" In debrief, highlight how over-amending reflects the real-world cost of redefining life.

  3. **Problem: Role conflicts stall discussion.**  
     - *Why it happens:* E.g., Quarantine Officer (wants broad definition) vs. Detector Designer (wants narrow).  
     - *Solution:* Encourage Mission Director to break ties. In debrief, praise this as a feature: "Did your roles expose how definitions serve different goals?"

  4. **Problem: Time overruns in Round 2.**  
     - *Why it happens:* Students debate edge cases.  
     - *Solution:* Use a visible timer. After 15 mins, skip to last 3 specimens. Focus on key debates in Round 3.

  5. **Problem: "Gaming" the system.**  
     - *Why it happens:* E.g., a table defines life as "anything from Mars" to avoid penalties.  
     - *Solution:* Rule that definitions must be based on *traits* (e.g., energy use, heredity). Reject circular criteria upfront in Round 1.

  ---

  ### **Debrief Guide (10 mins)**
  **Goals:** Connect activity to big ideas without jargon. Highlight that the struggle is the point.  
  **Script:**  
  1. **Start with feelings:** "Show of hands: who felt frustrated when your definition 'killed' something you thought was alive, or vice versa? That’s the core problem—life resists simple rules."  
  2. **Conceptual mapping:**  
     - **Circularity in evolution-based definitions:** "Many of you probably included 'evolution' or 'reproduction.' But if life is defined by Darwinian evolution, doesn’t that assume reproduction and heredity—which are already life traits? Did anyone feel they were going in circles?" (Note: This critiques the "self-sustaining chemical system capable of Darwinian evolution" astrobiology standard.)  
     - **Dormancy & potential:** "Specimens 3 and 9 (seed/tardigrade) forced you to ask: Is something alive *right now* without metabolism, or does 'alive' require potential? How does time factor in?"  
     - **Necessary/sufficient conditions vs. cluster concepts:** "Did your definition keep 'swallowing' non-life (e.g., crystals) or 'spitting out' life (e.g., mules)? That shows life might be a cluster of features—no one trait is absolute." (Avoid terms like "cluster concept" until now.)  
     - **Job-relativity:** "Your Ethics Advisor might have wanted a broad definition to protect rights, while your Detector Designer wanted a narrow one to save resources. Does that mean what counts as life depends on context?"  
  3. **The "fact of the matter" problem:** "Here’s the kicker: In this activity, you treated this as an engineering problem—tailoring a definition to your mission. But is there a *fact* about what’s alive, independent of our needs? Could aliens have a different definition? We’ll explore that next class."  

  **End with:** "Remember: Even NASA struggles with this. The takeaway isn’t that you failed—it’s that defining life is fundamentally messy."

  ---

  ### **Frank Note: What the Activity Can't Do**
  **It can't make them feel there's a "fact of the matter."**  
  - **Why:** Committees experience this as a solvable engineering puzzle ("With a better criterion, we’ll get it right!"). Real philosophy (e.g., whether life is a natural kind) requires abstract reflection.  
  - **How to supply it:** In debrief, explicitly contrast their "mission" mindset with the philosophical question: "Did it feel like there was a *truth* about life you were trying to discover? Or were you just building a tool?" Then, bridge to astrobiology: "If we find alien life, could it be so different that our definitions fail? Or are we imposing Earth-centric ideas?" This primes deeper discussion later.

  **Why this works for your goals:**  
  - Forces engagement with edge cases (virus, prion, etc.) through evidence-based rulings.  
  - Role cards make stakes explicit, shifting debates from "What is life?" to "What definition serves *whom*?"—which leads to your "moment."  
  - Scoring/amendments mirror real-world trade-offs (precision vs. flexibility).  
  - Debrief ties struggles directly to your course concepts without prereqs.

  **First run tip:** Keep energy high and move briskly. Embrace the chaos—when a table groans at their verdict, lean in: "Why does that hurt? What does your role say?" That’s learning.
