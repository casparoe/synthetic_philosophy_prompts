  So I got into this huge argument with my friend Marcus last night and I'm still kinda ruminating on it. We were watching some documentary about the UN Security Council, the whole thing where five countries (US, Russia, China, France, UK) get to veto any resolution no matter what, and he went off on this rant that international law is basically a sham — that it's just the powerful countries imposing their will on everyone and then wrapping it up in pretty legal language to make it look legitimate. He said it's literally the might-makes-right vibe, force pretending to be justice. And I kept pushing back, saying there's a real difference between a rule that everyone actually agreed to and one that's just backed by a bigger army, and that the whole point of international institutions is to drag things away from raw power. Then he just goes, "dude, that's EXACTLY what Pascal said four hundred years ago," and I couldn't really counter it because I hadn't actually thought through Pascal's whole justice-and-force thing in depth, I just knew the vague name-droppy bits.

  So here's what I actually want to work out: if Pascal were looking at the modern international system — specifically this weird setup where there's no world government to enforce the rules, the "laws" only get carried out when a powerful country feels like it, and the five permanent members can block anything they don't like — what would he actually say? I want you to really engage with his specific argument, not just the general "power makes right" mood. Like, he had this idea that force needs a pretext of right to be acceptable, and right needs force to actually get executed, and the two have to be joined together; and separately he had this skeptical point that the laws of different countries are so wildly different that you can't call any of them real justice, they just rest on custom, sheer antiquity, and whoever was strong enough to impose them. Using THAT specific framework, how would he read the Security Council veto and the way international law gets enforced? Is he going to call it force dressed up as justice, or does he think the institutional wrapping does some real work? And does his Christian layer — the idea that there's a higher divine justice that all human systems fall short of — change how he'd evaluate it, or is that a separate register? I'm basicly trying to figure out if Marcus was right or if I was, and I'd rather walk in with a real argument than just "well, it's complicated."
