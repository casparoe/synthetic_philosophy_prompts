  Pascal would absolutely see the UN Security Council veto system as a **stark, almost textbook example of "force clothed in the garments of justice"** – confirming Marcus's core point. However, his analysis wouldn't stop there; he'd also acknowledge the *necessary* and *pragmatic* function of this "clothing" and place it within his broader, deeply skeptical view of human justice. Here's the breakdown using his specific arguments:

  1.  **Force Needs the Pretext of Right (Justice Needs Force):**
      *   **The Institutional Wrapping *is* the Pretext:** Pascal would immediately recognize the UN Charter, the elaborate procedures, the legal language, the votes, and the very concept of "international law" as the *essential* "garments of justice" draped over raw power. The veto isn't presented as "Russia/US/China/UK/France can do whatever they want." It's framed as a legal right enshrined in a treaty signed by member states, justified by historical context (WWII victors) and the need for great power consensus to prevent catastrophic conflict. This institutionalization provides the *appearance* and *language* of legitimacy and order. Without this, the P5's power would be naked aggression, harder to sustain and justify both domestically and internationally. **Pascal would say this wrapping *does* real work:** it transforms raw force into *authority* within the system.
      *   **Force Enables the "Right":** Conversely, the effectiveness of any UNSC resolution *depends entirely on the willingness and ability of powerful states (especially the P5 or their allies) to enforce it*. A resolution condemning a small state might be enforced; one condemning a P5 member or its crucial ally will almost certainly not be. Pascal would see this as the ultimate proof of his maxim: "Justice without force is powerless." The "justice" declared by the Council only becomes reality if backed by sufficient force. The veto is the ultimate expression of force *preventing* the declaration of an opposing "justice."

  2.  **Human Laws (Including International Law) Rest on Custom, Antiquity, and Power, Not Inherent Justice:**
      *   **The Veto Codifies 1945 Power Dynamics:** Pascal would be utterly unsurprised that the "rules" favor the powerful. The UN Charter, including the veto, wasn't divinely ordained or discovered through pure reason. It was negotiated by the victors of WWII based on *their* perceived interests and the power realities *at that time*. Its persistence relies heavily on **custom** (it's "just the way it's done"), **antiquity** (it's been around for nearly 80 years, acquiring a patina of legitimacy), and crucially, the **continued power** of the P5 to resist any fundamental change. The fact that laws vary wildly between nations? Pascal would see the veto as the international equivalent: the "law" of the international system simply reflects who held the most power when the system was designed and who can still defend their privilege.
      *   **No "True Justice" in the Rules Themselves:** Pascal would dismiss the idea that the UN Charter or international law represents some objective, universal justice. The veto mechanism *itself* is, from his skeptical perspective, fundamentally unjust by any abstract standard of fairness or equality among nations. It's a rule created by the powerful *for* the powerful, justified by necessity and custom, not inherent moral rightness. The wildly different interpretations and applications of international law by different powers (e.g., interventions, human rights criticisms) would only reinforce his view that "justice" here is largely a tool or a weapon wielded according to interest and power.

  3.  **The Security Council Veto Specifically:**
      *   **Force Pretending to Be Justice:** Pascal would see the veto as the *purest* expression of force masquerading as legal procedure. A single P5 member can block the collective will of the vast majority of the world's nations, often for blatantly self-interested reasons completely unrelated to the merits of a resolution or international peace. The legalistic language surrounding its use ("not in accordance with the Charter," "threat to international peace") is, for Pascal, precisely the "pretext" – the necessary fig leaf attempting (sometimes very thinly) to justify the raw exercise of power. He would say Marcus is fundamentally correct: the veto *is* "might makes right" institutionalized. The "institutional wrapping" legitimizes the *act* of wielding power (it's *legal* to veto), but it doesn't change the underlying dynamic of power dominating justice in that moment.

  4.  **The Role of Divine Justice:**
      *   **The Ultimate Shortfall:** Pascal's Christian perspective is crucial here. He believes *all* human systems of justice, without exception, fall infinitely short of true, divine justice. The UNSC, with its veto, is no different. Its flaws, its power politics, its compromises with evil, its inability to prevent suffering – all of this would confirm for Pascal the radical corruption and limitation of human institutions. Divine justice stands as a constant critique of the UN system (and every national system).
      *   **Pragmatic Acceptance, Not Validation:** However, this divine perspective doesn't lead Pascal to reject *all* human order. He was a pragmatist. He understood that fallen humans need *some* structure to avoid pure anarchy, which is worse. The UN, for all its flaws and power imbalances, might be seen as a *necessary* (or at least, the best available) mechanism for managing conflict between sovereign states in a world without a global leviathan. Its "pretext of justice," however imperfect, provides a framework for discourse and *some* restraint that pure power politics might lack. **So, while the divine layer highlights the system's ultimate inadequacy, it doesn't mean Pascal would advocate tearing it down.** He'd likely see it as a tragically flawed but perhaps necessary artifact of human fallenness in the realm of international relations.

  **Conclusion: Who Was Right (Pascal's Verdict)?**

  *   **Marcus was closer to Pascal's core insight regarding the veto and enforcement.** Pascal would unequivocally see the UNSC veto as a prime example of force (the power of the P5) being institutionalized and legitimized by a "pretext of justice" (the UN Charter and legal procedures). The selective enforcement of international law based on the interests of the powerful is *exactly* the dynamic Pascal described: justice declared but powerless without force, and force wielding "justice" as its tool. The system fundamentally rests on the power dynamics of 1945, maintained by custom and continued might.
  *   **However, your pushback about institutions "dragging things away from raw power" has a Pascal-ian resonance.** Pascal would agree that the "pretext" *matters*. The institutional wrapping isn't *just* a sham; it's the mechanism that makes force *authoritative* and *sustainable* within an international order. It creates a space (however imperfect) for argument, negotiation, and *some* restraint based on perceived legitimacy. It replaces *pure* conquest with a system where power must *at least* articulate a reason (however flimsy) and operate within a recognized framework. This is a step away from pure "might makes right" anarchy, even if it's a small and flawed step.

  **In essence:** Pascal would tell you both that Marcus correctly identified the underlying power reality masked by legalistic institutions, *but* that your defense of the institution highlights the crucial function Pascal assigned to the "garments of justice" – they are necessary to clothe the terrifying reality of force, making it palatable and functional within human society, even if they can never truly transform force into pure justice. The UNSC system is, for Pascal, a perfect case study in this tragic and inescapable human condition. He’d likely conclude, "Your friend sees the force; you see the garments. Both are real, but never confuse the garment for the body it hides." His Christian perspective adds a layer of profound sadness but also a pragmatic acceptance that this flawed system might be the best fallen humans can manage. So, walk in acknowledging Marcus grasped Pascal's core critique of power, but argue that the institutional framework, however imperfect, performs a vital function Pascal himself recognized – it prevents the descent into pure, unmediated force. That *is* the "real work" it does.
