  First, I need to recall Pascal's core arguments. He distinguishes between justice and force, arguing that laws rely on custom and power, not inherent justice. His famous line is that justice without force is powerless, force without justice is tyrannical. They must combine to be effective. Also, human laws vary widely, so no single system can claim true justice. There's a higher divine justice beyond human reach.

  Now, applying this to the UN Security Council. The veto power clearly gives the P5 immense force. The question is whether the institutional framework provides a "pretext of right" that Pascal says legitimizes force. The UN Charter is a formal agreement, which might satisfy Pascal's need for a veneer of legitimacy. But the veto undermines this when used for self-interest. Pascal would see the P5's ability to block resolutions as force dominating the system.

  The enforcement mechanism is another point. International law relies on powerful states to enforce it, aligning with Pascal's view that force is necessary for justice to be effective. But selective enforcement based on national interest would make Pascal call it mere force disguised as justice.

  The divine justice angle adds nuance. Pascal would likely say that while the UN system is flawed and power-driven, it's still preferable to pure anarchy. The institutional structures create a space for dialogue and some restraint, even if imperfect. This might support the user's original point that institutions move things away from raw power.

  The user wants to know if Marcus was right. Pascal would agree that the veto system is fundamentally about power, but the institutional trappings do some work in legitimizing and restraining force. So both have points, but Pascal's framework suggests Marcus is more correct about the underlying reality. Still, the user's emphasis on institutions creating space for agreement has merit in Pascal's eyes.

  I should highlight Pascal's view on custom and antiquity. The UN's longevity and global acceptance might give it a semblance of legitimacy, even if based on 1945 power dynamics. But Pascal would be skeptical, seeing it as another example of might codified as right.

  Finally, the divine justice perspective means all human systems, including the UN, fall short. This doesn't invalidate them but frames them as necessary yet imperfect. The user's Christian layer question is important here—Pascal wouldn't reject the UN entirely but see it as a pragmatic tool within human limitations.
