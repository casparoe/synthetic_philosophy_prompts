  ### Poem

  The hay to left is green and sweetly scented,  
  It lies precisely where the light descends;  
  Its golden heap, by hunger’s need presented,  
  Invites the famished beast to make amends.  
  The creature eyes it with a sharp desire,  
  Yet halts, suspended by the equal right.  

  The hay to right is green and sweetly scented,  
  It lies precisely where the shade extends;  
  Its matching heap, with equal grace augmented,  
  To hunger’s cry the selfsame solace lends.  
  The creature marks it with an equal fire,  
  And halts, suspended in the balance bright.  

  Then, without cause, the ass strides left and dines,  
  Resolving stalemate where no reason shines.  

  ---

  ### Note  
  This poem simplifies Buridan’s scholastic dilemma by assuming the ass’s perfect rationality and the piles’ absolute symmetry in "hunger-relevant" traits (e.g., nutrition, distance), excluding non-material factors like spatial bias. It relies on a contested understanding of indifference: modern decision theory permits arbitrary choice under strict indifference (as here), whereas scholastic traditions often deemed such scenarios paralytic. The couplet’s asymmetry enacts "picking without preferring," a stance debated in rational choice theory but defended by contemporaries like Isaac Levi.
