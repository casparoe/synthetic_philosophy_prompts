answer: |-
  Wikipedia's verifiability policy embodies a distinct **institutional norm of trackable public justification**, which prioritizes *procedural verifiability* over individual epistemic states or even truth itself. Here's a reconstruction, analysis, and philosophical assessment:

  **The Core Norm: Trackable Public Justification (The Verifiability Norm)**
  *   **Strict Requirement:** An assertion is permissible *only if* it is supported by a citable, published source meeting Wikipedia's criteria for reliability and independence. The norm is: *"Assert that P only if P is attested in a published, independent, reliable source that can be cited."*
  *   **Key Features:**
      1.  **Depersonalization:** The asserter's (editor's) own knowledge, justification, or experience is irrelevant. Only the *published record* counts.
      2.  **Verifiability Over Truth:** A true claim lacking a source must be removed. A false claim with a source meeting the criteria *may* remain until a counter-source is provided. The practice focuses on *demonstrating compliance* (trackability) rather than guaranteeing truth.
      3.  **Institutional Function:** This norm serves Wikipedia's core goals as a tertiary encyclopedia:
          *   **Collaborative Stability:** Allows diverse, anonymous editors to build consensus based on shared, accessible evidence, not personal authority.
          *   **Auditability:** Enables readers and other editors to easily trace and verify claims independently.
          *   **Neutrality:** Mitigates bias by requiring claims to be grounded in external, pre-existing discourse.
          *   **Scalability:** Provides a clear, objective (though imperfect) rule for managing vast amounts of information from countless contributors.
      4.  **Rejection of Firsthand Knowledge:** Personal testimony is inherently untrackable and unverifiable by the encyclopedia's distributed, anonymous editors and readers. It introduces an unacceptable element of personal authority and potential conflict.

  **Contrast with Courtroom and Conversation:**
  *   **Courtroom (Hearsay Rule):** The norm is *reliable evidence for truth-finding* in an adversarial setting. Firsthand testimony is preferred as the most direct, cross-examinable evidence. Hearsay (second-hand reports) is generally excluded because its reliability *cannot be effectively tested* in court (lack of oath, cross-examination of the original source). Wikipedia *needs* second-hand reports (published sources) because they *are* trackable and verifiable *within its institutional framework*, while firsthand accounts are not.
  *   **Ordinary Conversation:** Typically operates under a looser **knowledge norm** ("Assert that P only if you know that P") or a **truth norm** ("Assert that P only if P is true"), heavily context-dependent and reliant on trust and shared understanding. Personal knowledge is central.

  **Comparison to Philosophical Norms of Assertion:**
  *   **Knowledge Norm (Williamson):** *"Assert that P only if you know that P."* Wikipedia *rejects* this. An editor *knowing* P firsthand is insufficient; they *must* find a published source.
  *   **Truth Norm (Weiner):** *"Assert that P only if P is true."* Wikipedia *rejects* this. A *true* claim without a source is excluded. A *false* claim with a seemingly reliable source might be included until challenged.
  *   **Justification Norm (Lackey):** *"Assert that P only if you are justified in believing that P."* Wikipedia *rejects* this. The *editor's* justification (e.g., eyewitnessing) is irrelevant. Only the *source's* status (and the justification *it* provides, as assessed by policy) matters.
  *   **Reasonable-to-Believe Norm (Douven):** *"Assert that P only if it is reasonable for you to believe that P."* Again, the editor's own reasonableness is irrelevant; only the source-based trackability counts.
  *   **Verifiability/Trackability Norm:** *"Assert that P only if P can be publicly verified through a designated trackable procedure (citing an approved source)."* **This is the norm Wikipedia strictly presupposes and requires.** It is fundamentally **institutional and procedural**.

  **Philosophical Underdetermination:**
  While the strict requirement is the **Verifiability Norm**, Wikipedia's practice *fits well* with, but is not *strictly required* by, certain modified versions of other norms:
  1.  **Communal Justification Norm:** *"Assert that P only if P is justifiable *to the Wikipedia community* based on its agreed-upon standards (i.e., reliable sources)."* This captures the depersonalization and institutional grounding but frames it as justification *to the group*.
  2.  **Weak Truth Norm + Institutional Rules:** *"Assert that P only if P is true"* PLUS the institutional rule *"and you must demonstrate truth via citation."* This separates the ultimate aim (truth) from the required procedure (citation), which reflects Wikipedia's ideals but not its strict practice (as it allows unsourced truths to be removed and potentially false sourced claims to remain temporarily).
  3.  **Reduction of Epistemic Risk Norm (Goldberg):** *"Assert that P only if doing so does not create an undue risk of the audience forming a false belief."* Wikipedia's policy can be seen as an institutional strategy for massively *reducing epistemic risk* in a high-stakes, open, collaborative environment by outsourcing justification to pre-vetted publications. However, this is a *rationale* for the norm, not the norm itself.

  **Why the Distinction Matters:**
  *   **Strict Requirement (Verifiability Norm):** Explains the *mandatory* removal of true eyewitness accounts and true claims lacking sources. Explains the *permissibility* of dubious but published reports (they meet the procedural requirement, even if flawed).
  *   **What it Fits Well With (Communal Justification, Risk Reduction):** Explains the *motivation* behind the policy (creating reliable communal knowledge, minimizing error in a vulnerable system). Explains why citing *reliable* sources is preferred over citing *any* source, even though the norm formally only requires *a* source meeting the policy's definition.
  *   **Underdetermination:** Rival norms like the modified Communal Justification Norm or the Weak Truth Norm + Institutional Rules could *license* Wikipedia's practice *if* they incorporated the specific requirement for trackable citation. However, they don't *explain* the *absolute rejection* of personal knowledge as forcefully as the pure Verifiability Norm. The Verifiability Norm is the most direct and parsimonious description of the *strict rule enforced*.

  **Conclusion:**
  Wikipedia's practice presupposes a **strict institutional norm of trackable public justification (Verifiability Norm)**, prioritizing demonstrable compliance with a sourcing procedure over the individual asserter's knowledge, justification, or even the underlying truth of the claim. This norm fundamentally serves Wikipedia's collaborative, audit-focused, and depersonalized institutional structure. While it aligns with the *goals* of modified justification or truth norms (especially regarding reducing epistemic risk and aiming for truth via communal standards), the practice is strictly defined by and requires the procedural verifiability norm. This norm directly explains the inversion compared to the courtroom: Wikipedia *needs* the trackable "hearsay" (published reports) as its fundamental building blocks and *cannot* reliably utilize the courtroom's preferred firsthand testimony within its operational model. The practice is philosophically underdetermined only in the sense that other norms *could be constructed* to accommodate it by building in the citation requirement, but the core, enforced rule remains the distinct norm of trackable verifiability.
