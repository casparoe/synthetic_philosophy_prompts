          Band D2: 6 < T1 <= 12 months
          Band D3: T1 > 12 months
     b. Process bands in order: D1, then D2, then D3.
     c. Within a band, calculate the expected gain in time: E = p * (T2 - T1).
     d. Rank applicants in the band by E (highest first).
     e. If there is a tie in E, then lottery.
     f. Allocate courses to the applicants in the band in order of rank (and lottery for ties) until we run out of courses or applicants in the band.

  5. If an applicant is not allocated a course, they are refused.

  6. Each quarter is independent; past applications do not affect current allocation.

  This procedure is grounded in:
     - Non-aggregation: by prioritizing Type L over Type D, we do not trade lives against disabilities.
     - Priority to the worse off: by the urgency bands.
     - Efficiency: by using expected benefit within a band.
     - Equal concern: by using lotteries when candidates are equally deserving.

  We acknowledge that the band thresholds and the harm type classification are judgment calls, and that the expected benefit calculation is a simplification.
