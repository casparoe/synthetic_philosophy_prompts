  ### Decision Procedure for Enzyme-Replacement Therapy Allocation

  **Grounding in Ethical Principles**:  
  The procedure is built on established debates about harm aggregation and fairness:  
  - **Non-aggregation of Harms**: Harms to different people cannot be summed. Saving one life is not morally equivalent to preventing two non-lethal disabilities.  
  - **Priority to the Worse Off**: Those facing the most severe harms (e.g., death) have stronger claims, irrespective of numbers.  
  - **Equal Concern via Randomization**: When candidates are equally deserving, lotteries express equal concern—not indifference—by giving each a fair chance.  
  - **No Compounding of Past Losses**: Past refusals do not enhance current claims, to avoid penalizing new applicants or creating perpetual queues.  

  The procedure prioritizes **severity of harm** over **numbers affected** and uses **efficiency** (probability of response × gain) only within severity tiers. It rejects aggregating small harms to outweigh severe ones (e.g., 100 hearing losses ≠ 1 death) and avoids "pooling" weak claims.

  ---

  ### Decision Procedure  
  *Runnable in 10 minutes per case by a new committee member. Uses only data from the form: severity type, time to irreversible organ failure without treatment (\(T_{\text{without}}\)), time with treatment (\(T_{\text{with}}\)), response probability (\(p\)).*

  #### Step 1: Classify Harm Severity (Judgment Call)  
  - **Question**: *What is the nature of the irreversible harm?*  
    - **Sufficient Answer**: Clinicians (with pharmacist input) classify harm as:  
      - **Type L (Lethal)**: Harm is **death** (e.g., heart/liver failure).  
      - **Type D (Disabling)**: Harm is **non-lethal disability** (e.g., hearing loss, blindness).  
    - **Where It Stops**: If classification is ambiguous (e.g., uncertain if organ failure causes death), committee votes (majority wins). Proceed to Step 2.  
    - **Values vs. Facts**: Judgment call (values). Relies on clinician expertise.  

  #### Step 2: Prioritize by Harm Severity  
  - **Question**: *Are there Type L applicants?*  
    - **Sufficient Answer**:  
      - **Yes**: Allocate **all remaining courses** to Type L first (go to Step 3).  
      - **No**: Skip to Step 4 for Type D.  
    - **Where It Stops**: If no courses left, refuse all Type D.  

  #### Step 3: Allocate to Type L (Lethal Harm)  
  - **Substep 3.1: Urgency Triage**  
    - **Question**: *What is \(T_{\text{without}}\) for each Type L applicant?*  
      - **Bands**: Group applicants by \(T_{\text{without}}\):  
        - **Critical**: ≤ 12 months.  
        - **Severe**: 12–24 months.  
        - **Less Urgent**: > 24 months.  
      - **Allocate in band order**: Critical → Severe → Less Urgent.  
  - **Substep 3.2: Efficiency Within Band**  
    - **Question**: *What is expected gain (\( \text{Gain} \times p \))?*  
      - \( \text{Gain} = T_{\text{with}} - T_{\text{without}} \) (additional life-years if treatment works).  
      - **Rank** by \( \text{Gain} \times p \) (highest first).  
    - **Tiebreak**:  
      - If identical \( \text{Gain} \times p \), **require equal-chance lottery** (unweighted).  
      - If \( \text{Gain} \times p \) is incalculable (e.g., missing data), use lottery.  
  - **Where It Stops**: Allocate within band until courses run out. If bands exhausted, refuse remaining Type L.  

  #### Step 4: Allocate to Type D (Disabling Harm)  
  - **Substep 4.1: Urgency Triage**  
    - **Question**: *What is \(T_{\text{without}}\) for each Type D applicant?*  
      - **Bands**:  
        - **Critical**: ≤ 6 months.  
        - **Severe**: 6–18 months.  
        - **Less Urgent**: > 18 months.  
      - Allocate in band order: Critical → Severe → Less Urgent.  
  - **Substep 4.2: Efficiency Within Band**  
    - **Question**: *What is \( \text{Gain} \times p \)?*  
      - \( \text{Gain} = T_{\text{with}} - T_{\text{without}} \) (delay of disability onset).  
      - **Rank** by \( \text{Gain} \times p \) (highest first).  
    - **Tiebreak**: Identical to Type L (lottery required).  
  - **Where It Stops**: Allocate until courses run out. Refuse leftovers.  

  #### Step 5: Document and Notify  
  - **For Awards**: Write rationale (see Section 7).  
  - **For Refusals**: No further action (no queue for future quarters).  

  ---

  ### Key Rules Clarified  
  1. **Equal Chances**:  
     - **Required** when applicants in the same band have identical \( \text{Gain} \times p \).  
     - **Not weighted by severity**—bands already prioritize severity. Time (months) is used only for banding, not weighting lotteries.  

  2. **Order of Questions Matters**:  
     - **Severity First, Then Numbers**:  
       - Prevents "death vs. disabilities" trade-offs (e.g., 1 life > 100 hearing losses).  
       - Ensures worst-off (Type L) always prioritized.  
     - **Reverse Order (Numbers First) Would Cause Errors**:  
       - E.g., Allocating based on efficiency first might favor 10 mild cases over 1 critical case.  
     - **Consistency**: Order eliminates cycling. Banding and tiering create a strict hierarchy.  

  3. **Past Applications**:  
     - **No claim from past losses**. Each quarter is independent.  
     - **Why?** Prioritizing past applicants would:  
       - Penalize new, equally severe applicants.  
       - Create an unmanageable "disappointment queue."  

  4. **Divisibility of Courses**:  
     - **Does not change the procedure** unless proven effective.  
     - **Why?** The form lacks data on half-dose efficacy (\(p\) or \(T_{\text{with}}\)). Assuming equal effect risks harm.  
     - **Exception**: If manufacturer provides half-dose data, recalculate \( \text{Gain} \times p \) for half-courses.  

  ---

  ### Verdicts on Sample Slates  
  #### Slate (a): 8 courses, 9 identical applicants (all Type L, Critical band, same \( \text{Gain} \times p \))  
  - **Procedure**:  
    1. All 9 are Type L, Critical band, tied efficiency.  
    2. **Equal-chance lottery** for 8 awards.  
  - **Awards**: 8 randomly selected.  
  - **Refusals**: 1.  
  - **Rationale to Board**:  
    > "All nine applicants faced identical lethal harm (death within 12 months) and had equal expected benefit. We allocated via lottery to ensure equal concern. The eight selected were chosen randomly."  

  #### Slate (b): 8 courses; 4 Type L (\(T_{\text{without}}\)=18mo), 11 Type D (hearing loss, \(T_{\text{without}}\)=3mo, \(p\)≈equal)  
  - **Procedure**:  
    1. Type L prioritized. All 4 are Type L, Severe band (12–24mo).  
    2. Allocate 4 courses to Type L.  
    3. 4 courses left → Allocate to Type D.  
    4. All Type D are Critical band (≤6mo), tied efficiency → **Lottery for 4 awards**.  
  - **Awards**: 4 Type L + 4 Type D (randomly chosen).  
  - **Refusals**: 7 Type D.  
  - **Rationale to Board**:  
    > "We prioritized four applicants facing death within 18 months. The remaining four courses were allocated via lottery to applicants facing imminent permanent hearing loss, who had equal expected benefit."  
  - **Committee's Hated Verdict**: 7 hearing-loss patients refused. **Sacrifice**: Efficiency (ignoring numbers) to prioritize lives.  

  #### Slate (c): Spring Slate (4 stable/high-p, 2 critical/medium-p)  
  - **Assumptions**:  
    - Stable: Type D, Less Urgent band (\(T_{\text{without}}\)>18mo). High \(p\), moderate Gain.  
    - Critical: Type L, Critical band (\(T_{\text{without}}\)≤12mo). Medium \(p\), high Gain.  
  - **Procedure**:  
    1. Prioritize Type L (critical applicants).  
    2. Allocate to both critical applicants first.  
    3. Remaining courses (6) → Allocate to Type D.  
    4. Stable applicants in Less Urgent band. Allocate if courses available.  
  - **Awards**: 2 critical + 4 stable (if no higher-priority Type D).  
  - **Refusals**: None in this group (assuming 6+ courses).  
  - **Rationale to Board**:  
    > "We awarded courses to two applicants facing imminent death. The remaining courses were allocated to applicants with stable disease but high response probability, as they were next in priority."  

  ---

  ### Rationale Writing: Avoiding Indifference  
  - **For Awards**:  
    > "Awarded based on [severity/efficiency] priority. We recognize this means others in need were not selected, but scarcity required us to prioritize those at greatest risk of irreversible harm."  
  - **For Lottery Awards**:  
    > "Chosen via random selection from equally deserving candidates. This reflects equal concern for all in this group—not indifference. We regret we could not help everyone."  
  - **Answering Board Member on Lotteries**:  
    > "Randomization is not indifference; it is fairness. When candidates are identical on all measured criteria, a lottery ensures no arbitrary favoritism. Telling a family 'we had to choose, and gave everyone an equal chance' acknowledges their worth. The alternative—using hidden biases or first-come-first-served—would show less concern."  

  ---

  ### Judgment Calls and Limitations  
  **Marked Judgment Calls**:  
  1. **Harm Classification (Step 1)**: Relies on clinician interpretation of "organ failure" (values-based).  
  2. **Urgency Band Thresholds**: 12/24mo for Type L, 6/18mo for Type D (arbitrary but necessary).  
  3. **Efficiency Metric**: \( \text{Gain} \times p \) assumes linear value of time gained.  

  **Cases the Procedure Cannot Settle**:  
  1. **Ambiguous Harms**: If clinicians deadlock on Type L/D, no resolution (requires coin flip or new rule).  
  2. **Identical Applicants Beyond Courses**: Lotteries are the only fair option, but may feel unsatisfying.  
  3. **Catastrophic Ties**: 100+ identical applicants for 1 course—procedure works but emotionally grueling.  

  **What We Give Up**:  
  - **Aggregation**: We sacrifice "greatest good for the greatest number" to protect against devaluing severe harms.  
  - **Subjectivity**: Clinician judgment in harm classification is unavoidable but transparent.  
  - **Past Fairness**: We ignore previous rejections, risking perceived coldness, to ensure current fairness.  

  This procedure is honest about trade-offs. It will not collapse in the room because it anchors to defensible principles: severity first, efficiency second, randomization for ties.
