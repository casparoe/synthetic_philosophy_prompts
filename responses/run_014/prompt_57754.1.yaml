     (If there is disagreement, majority vote.)

  2. Separate applicants into Type L and Type D.

  3. For Type L:
     a. Assign to urgency bands based on time to death without treatment (T1):
          Band L1: T1 <= 12 months
          Band L2: 12 < T1 <= 24 months
          Band L3: T1 > 24 months
     b. Process bands in order: L1, then L2, then L3.
     c. Within a band, calculate the expected life extension: E = p * (T2 - T1), where p is the response probability, T2 is the time to death with treatment.
     d. Rank applicants in the band by E (highest first).
     e. If there is a tie in E, then the tied applicants are assigned to a lottery.
     f. Allocate courses to the applicants in the band in order of rank (and lottery for ties) until we run out of courses or applicants in the band.
