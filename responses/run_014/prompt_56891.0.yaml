prompt: |-
  Okay so — I'm giving a paper at a small workshop co-hosted by a divinity school and a phil-of-religion group, 40 minute talk plus an hour of Q&A. The room will be mostly historians of religion who think psychoanalytic readings of religion died in the seventies, one clinical psychologist who's psychodynamic and will defend Freud on basically everything, a philosopher of religion who works on Reformed epistemology and properly basic belief, and one person who does evolutionary debunking arguments about religion and considers Freud a naive precursor to what they do.

  My thesis, roughly: Future of an Illusion usually gets attacked for committing the genetic fallacy, but that's the wrong attack. Freud isn't arguing religion is false, he's arguing the believer has no entitlement to it — religious belief is held without regard to evidence and kept alive by wish, so the burden of proof shifts back onto the believer. Call it an entitlement-stripping argument instead of a truth-directed one. Sketch: (1) an illusion, for Freud, is a belief held out of wish whether or not it turns out true; (2) his claim is that religious belief is both wish-sustained and insulated from evidence; (3) so even if some religious belief happened to be true, holding it that way isnt knowledge and doesn't earn the protections people want to give it; (4) therefore the genetic fallacy charge just misses the target.

  Give me the prep sheet: the eight-ish objections this particular room will actually raise — not the generic ones you'd get from a philosophy of mind audience — ranked by how much damage each would do, phrased in the vocabulary of whoever's asking it, with a two-minute reply and a flag on where my reply is softest. Tell me what I should concede in the first ten minutes so it doesn't come up later, and name the one reply that has to land or the paper dies. Then add the question I'm praying nobody asks. Hard cap 1,100 words, bullets are fine, dont pad.
