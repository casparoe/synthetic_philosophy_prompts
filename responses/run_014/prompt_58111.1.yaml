answer: |-
  Here are two parallel cases exploring hypocrisy in academic blame, designed to isolate the critical factor beyond severity:

  **Case 1 (Non-Hypocritical Blame): Dr. Evans Discovers Her Own Past Mistake**
  *   **Scenario:** Dr. Evans, a respected ethics tutor, discovers rampant plagiarism in her students' essays. She confronts them sternly, outlining the severe consequences and the fundamental violation of academic integrity.
  *   **Dr. Evans' Past:** *Ten years ago*, while a stressed PhD student, Dr. Evans plagiarized a small but significant paragraph in a draft chapter of her dissertation. Weeks later, *before submission*, she re-read it, was horrified, and immediately deleted it, rewrote the section entirely from scratch, and cited the original source properly in her final thesis. She documented this correction in her research notes. She never published the plagiarized draft and considers it a profound, shameful mistake that taught her an invaluable lesson about diligence and honesty. She is open about this experience (without specifics) when teaching about academic integrity, framing it as a learning moment.
  *   **Blame:** Her blame towards her students seems warranted and appropriate, even knowing her past transgression.

  **Case 2 (Hypocritical Blame): Dr. Evans' Unacknowledged Foundation**
  *   **Scenario:** Dr. Evans, a respected ethics tutor, discovers rampant plagiarism in her students' essays. She confronts them sternly, outlining the severe consequences and the fundamental violation of academic integrity. *Her tone is particularly self-righteous.*
  *   **Dr. Evans' Past:** *Ten years ago*, while a stressed PhD student, Dr. Evans plagiarized a small but significant paragraph in the *final, submitted version* of her dissertation. This paragraph formed a key step in her core argument. It was never detected. She received her PhD based on this work. She later published articles building directly on the plagiarized argument without ever correcting or acknowledging the source. She has buried this knowledge, hoping it never surfaces, and actively presents herself as a paragon of academic rigor.
  *   **Blame:** Her blame towards her students feels objectionably hypocritical. The students might feel resentful, thinking "She got away with it and built her career on it, who is she to lecture us?"

  **The Principled Difference: Ongoing Benefit, Lack of Accountability, and Undermined Normative Commitment**

  The critical difference is **not** the *severity* of the original plagiarism (it's identical: a "small but significant paragraph" forming a "key step"). The difference lies in **Dr. Evans' current relationship to her own wrong and the norm she is enforcing**:

  1.  **Accountability and Disavowal (Case 1):**
      *   Dr. Evans *identified and corrected* her plagiarism *before* it conferred any benefit or became part of the official academic record.
      *   She holds herself accountable for the *attempted* wrong, viewing it as a serious mistake she rectified.
      *   She *disavows* the plagiarized act. Her current stance (blaming plagiarism) is consistent with her internal stance towards her own past action (rejection and correction).
      *   She derives *no ongoing benefit* from the plagiarized material. Her PhD and subsequent work are based on the corrected version.
      *   Her blame reinforces the norm *without contradiction*; she exemplifies the norm by having corrected herself.

  2.  **Ongoing Complicity and Normative Contradiction (Case 2):**
      *   Dr. Evans *never corrected* her plagiarism. It *remains* part of her foundational academic work (her PhD dissertation).
      *   She *benefits* from it continuously – her degree, position, authority, and subsequent publications all rest, at least partially, on uncorrected dishonesty.
      *   She actively *conceals* the wrongdoing, demonstrating a lack of accountability and a commitment to self-preservation over the norm.
      *   Her current stance (blaming plagiarism) is in *direct, performative contradiction* to her own ongoing state: she *is* (still) an unacknowledged plagiarist who *has* gained from it.
      *   Her blame does not reinforce the norm; it *exploits* it. She leverages the norm's authority *while herself being in violation of it*, undermining the norm's legitimacy and making her enforcement seem like a tool for maintaining her own position rather than upholding integrity.

  **Why Severity Isn't the Deciding Factor:**

  *   **Identical Core Wrong:** The *initial act* of plagiarism is stipulated to be identical in nature and significance ("small but significant paragraph," "key step").
  *   **Different Standing:** Despite the identical initial wrong, Dr. Evans' *standing to blame* differs dramatically between the cases.
  *   **The Crux:** The standing is undermined not because the past wrong was *worse* in Case 2, but because in Case 2, Dr. Evans remains *actively complicit* in violating the very norm she is enforcing. She *continues* to benefit from the violation and has made no effort to align her own status with the norm's demands. Her blame becomes hypocritical because it implicitly asserts a moral high ground ("I adhere to this norm") that her own uncorrected actions definitively falsify. In Case 1, by correcting the error and disavowing the act, she *aligns* herself with the norm she enforces.

  **Underlying Principle: The "Clean Hands" Requirement for Second-Personal Authority**

  The principled difference stems from the idea that to blame someone authoritatively for violating a norm (a "second-personal" stance), one must oneself be adequately committed to and compliant with that norm *in the relevant context*. Hypocrisy arises not merely from past violations, but from *ongoing* non-compliance or *unaddressed* violations that create a contradiction between the blamer's *current position* (enforcer of the norm) and their *current state* (violator of the norm). Case 1 demonstrates accountability and alignment; Case 2 demonstrates ongoing complicity and contradiction. This difference in *current normative alignment*, not the severity of the past act itself, creates the contrast in standing to blame.

  | **Feature**          | **Case 1 (Non-Hypocritical)**                       | **Case 2 (Hypocritical)**                          |
  |----------------------|-----------------------------------------------------|----------------------------------------------------|
  | **Initial Plagiarism** | Identical: Key paragraph in PhD work                | Identical: Key paragraph in PhD work               |
  | **Timing of Discovery** | Self-discovered BEFORE submission                   | Never discovered by others                         |
  | **Correction**       | Fully corrected BEFORE degree awarded               | **Never corrected**                                |
  | **Current Benefit**  | **Receives no benefit** from plagiarized material   | **Continues to benefit** from plagiarized PhD      |
  | **Accountability**   | **Acknowledged & documented** the error privately   | **Actively conceals** the plagiarism               |
  | **Norm Alignment**   | Current stance **consistent** with past correction  | Current stance **contradicts** ongoing violation   |
  | **Blaming Position** | Enforces norm from position of **integrity**        | Enforces norm from position of **compromised authority** |
  | **Student Perception** | Blame perceived as **legitimate guidance**          | Blame perceived as **self-serving hypocrisy**      |
