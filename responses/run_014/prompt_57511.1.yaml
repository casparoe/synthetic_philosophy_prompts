    3. *Institutional reinforcement*: Adoption by external actors (ads, HR, news) turns critique into a catalyst for entrenchment.  
  - **Field relevance**: Draws from philosophy of social science (defense of categories) and sociology of knowledge (institutional adoption), while addressing demographic methodology's limitations.  
  - **Practical utility**: Naming this pattern helps identify when refinement is substantive (e.g., data-driven) versus defensive (entrenching arbitrary labels).
