prompt: |-
  I'm trying to pin down what I actually think about the difference between knowing how to do something and knowing that something is the case, and I'd like to see whether my reactions to a set of cases hang together or whether I'm just being inconsistent. I'll report my verdicts case by case, mostly by gut, and then I'll ask you for the principle, if any, behind them.

  Start with the two I'm confident about, to set a baseline. I can ride a bicycle, but if you pressed me to explain the mechanics of balance I'd give you a muddled, probably wrong account; I know how to ride a bike, obviously. By contrast, I have read a very detailed manual on changing a tire and can recite every step in the right order, but I have never actually changed a tire and I'm confident I would fumble the jack; I do not know how to change a tire — I know that, if I followed the manual, I would change a tire. Those two feel like they should fall out of the same principle, and I'm not yet sure what that principle is.

  Now the cases where I'm less sure I'm consistent. I know how to swim, but suppose I'm in a lake with my arms zip-tied behind my back so that I literally cannot swim right now. I still feel that I know how to swim: the zip ties prevent me from swimming, they don't take the knowledge away from me. So for me, knowledge how seems to survive being temporarily blocked from being exercised. I can also recognize my next-door neighbor's face in a fraction of a second, though I could not describe the specific features that let me do it; my gut says I know how to recognize my neighbor, though I'm not sure that's the same kind of thing as knowing how to ride a bike. And I can work through a long-division problem by following the standard algorithm step by step, but I could not explain why the algorithm works, and if you asked me to do the same division in base seven I'd be lost; I'd say I know how to do long division, but only the ordinary base-ten kind, not long division in general. So my knowledge how comes in domain-specific packages, and I don't know how to state the domain.

  Here is the set I keep going back and forth on, because the three cases look to me like they should come out the same and I can't see why I'm treating them differently. In each, I can, if I set my mind to it, bring about a mental state on command.

  First, imagining: I can, deliberately and repeatedly, bring a vivid image before my mind — say, imagine in detail what it would be like to perceive the world in ultraviolet — and I can stop when I want. I'd say I know how to imagine. There's no ambiguity here; it feels like a straightforward ability, the same register as riding a bike.

  Second, believing: here I'm split. On one hand, I cannot, no matter how hard I try, bring myself to believe something I have strong evidence against — I can't just decide that the earth is flat — so "knowing how to believe" feels incoherent to me, as if the "how" were pointing at something that isn't a doing at all. On the other hand, when I have good evidence for a claim but am resisting it, I can bring myself to believe it by attending to the evidence and letting it register; I've done that deliberately, e.g. convincing myself a project will work by re-reading the data. So I hold both a "no, belief isn't something you do" verdict and a "yes, I know how to get myself to believe true things" verdict, and I can't make them consistent.

  Third, willing: the same structure. I cannot will myself to want something I have no reason to want — the attempt to will myself into wanting it just doesn't land. But I can will myself to act on a reason I already have, by rehearsing it and committing; I've willed myself to get up early that way. So again a "no" and a "yes" sitting in the same case.

  Is there a principle — or a small set of candidate principles — that captures all of these verdicts, or at least most of them? For each candidate, state it precisely, tell me which of my cases motivates each clause, say what it predicts for a case I haven't listed (for instance, someone who can solve a scrambled Rubik's cube by heart but couldn't handle a variant with a different color scheme, or a person who knows how to drive a stick shift but has never driven one with an automated clutch), and be honest about which of my verdicts it cannot accommodate. In particular, I'd like to know whether the swimmer-with-zip-ties verdict and the tire-manual verdict can both be kept, and whether the imagine/believe/will trio can be reconciled at all, or whether I have to give up one of the three — and if so, which one, and on what principle.
reasoning: |-
  Okay, this user is wrestling with a classic philosophical problem—the distinction between procedural knowledge (knowing-how) and propositional knowledge (knowing-that). They've presented a nuanced set of intuitions across various cases, and their core struggle seems to be reconciling apparent inconsistencies, especially around mental acts like imagining, believing, and willing. 

  First, their baseline cases are textbook examples: bike riding showcases embodied procedural knowledge that resists verbalization, while the tire manual demonstrates that propositional knowledge alone doesn't constitute know-how. Their intuition that zip-ties don't erase swimming knowledge is robust—it suggests know-how is a dispositional capacity rather than an occurrent performance. The neighbor recognition case further complicates things by introducing tacit pattern-matching that feels automatic yet deliberate.

  The real tension emerges in the mental act trio. When they claim to "know how to imagine," they're treating imagination as a controllable action—which aligns with their procedural intuitions. But belief and will present a paradox: they acknowledge deliberate belief formation through evidence engagement (procedural-ish), yet reject direct voluntary control over belief (anti-procedural). This mirrors the "direction of fit" problem in philosophy: beliefs aim to match the world (not directly willable), while intentions aim to change the world (more controllable).

  For reconciliation, I'm considering a two-axis framework: one axis for controllability (can you initiate/stop it at will?), another for world-dependence (does it require external conditions?). Swimming passes both; belief fails controllability but allows indirect methods. The Rubik's cube variant case would test domain-specificity—their verdict would likely hinge on whether color schemes alter the core algorithm or just perceptual inputs. 

  The clutch-driving case is revealing: if automated controls preserve the core mechanical actions, their know-how likely remains; if not, it fragments. This suggests procedural knowledge is hierarchical—some components are transferable, others aren't. Their struggle with base-seven division already hints at this.

  Ultimately, their inconsistency with belief/willing might not need full resolution. Philosophical work by Stanley & Williamson shows know-how often embeds know-that (e.g., knowing how to ride a bike involves knowing that leaning counters imbalance). Their "re-reading evidence" example fits this—it's know-how guided by epistemic norms. The flat earth counterexample simply shows procedural knowledge has success conditions: "knowing how to believe" only applies when truth-conducive methods exist. 

  I'll structure the response around dispositional capacities + method constraints, explicitly sacrificing their flat intuition that belief isn't a "doing"—because in controlled cases, it is.
answer: |-
  Based on your detailed verdicts, a coherent principle emerges that captures *most* of your intuitions. The core tension around belief/willing can be reconciled, but it requires refining your initial framing. Here's the principle and its components, grounded in your cases:

  **The Principle of Agentive Dispositional Capacity (ADC):**
  *S knows how to φ iff S possesses a reliable, *agentively deployable* disposition to succeed at φ-ing when attempting it under normal conditions for φ-ing, where success is measured against a contextually relevant standard.*

  ### Breaking Down the Principle & Matching Your Cases:
  1.  **Reliable Disposition:** Knowledge-how is a stable capacity, not just a one-time event.
      *   *Motivated by:* Bike riding (you reliably succeed when you try), swimming (the capacity persists even when zip-tied - the disposition isn't destroyed, just temporarily blocked). Contrasts with the tire manual (no reliable disposition formed).

  2.  **Agentively Deployable:** S must be able to *initiate or control* the execution of the capacity through their own agency/deliberation. It's something S *does* or *makes happen*.
      *   *Motivated by:* Your core distinction in the belief/willing cases. You *can* deliberately *imagine* (you initiate and control it). You *cannot* directly *decide to believe the earth is flat* or *will yourself to want something arbitrary* (no direct agentive control). This clause explains your "no" verdicts.

  3.  **Success under Normal Conditions:** The capacity reliably achieves the goal of φ-ing when the standard conditions for φ-ing are met.
      *   *Motivated by:* Long division (succeeds in base-10, normal condition; fails in base-7, abnormal condition). Swimming (succeeds in water without restraints; fails with zip-ties - abnormal condition blocking execution, not destroying the capacity). Tire manual (no disposition to succeed even in normal conditions).

  4.  **Contextual Standard of Success:** What counts as "succeeding" or "doing it" depends on the specific φ.
      *   *Motivated by:* Neighbor recognition (success = fast, accurate ID; standard doesn't require verbal description). Long division (success = correct answer using the standard algorithm in base-10; standard doesn't require understanding *why* it works). This allows for domain-specificity.

  ### Applying ADC to Your Cases:
  *   **Bike Riding:** Clear ADC. Reliable disposition. Agentive control (you decide to ride). Success under normal conditions.
  *   **Tire Changing (Manual Only):** Fails ADC. No reliable disposition formed. Reading ≠ agentively deployable capacity to change a tire.
  *   **Swimming (Zip-tied):** ADC holds. Disposition persists (reliability intact *if* zip-ties removed). Agentive control exists *for swimming movements* (blocked, not absent). Failure due to abnormal conditions.
  *   **Neighbor Recognition:** ADC holds. Reliable disposition (fast ID). Agentive control (you *deliberately look* at faces to identify). Success under normal conditions (seeing them). Contextual standard doesn't require verbalization.
  *   **Long Division (Base-10):** ADC holds. Reliable disposition (using algorithm). Agentive control (you execute steps). Success under normal conditions (base-10). Contextual standard: correct answer via algorithm, not theoretical understanding.
  *   **Long Division (Base-7):** Fails ADC. No reliable disposition for base-7. Normal conditions for *division* might hold, but the contextual standard for *long division* implicitly assumes base-10 (or requires specification).

  ### Reconciling Imagine/Believe/Will:
  ADC provides a clear distinction between your "yes" and "no" verdicts based on **agentive deployability**:
  *   **Imagining (Yes):** Clear ADC. You *directly* and *agentively* initiate, control, and terminate the vivid imagining on command. It's something you *do*.
  *   **Believing (Flat Earth - No):** Fails ADC key clause. You lack *agentive control* to directly initiate belief in something contrary to strong evidence. Belief formation isn't directly volitional like imagining. Your "no" verdict is correct under ADC.
  *   **Believing (via Evidence - *Limited* Yes):** ADC holds *for the method, not belief itself*. You possess a reliable, agentively deployable disposition to *engage in specific cognitive actions* (attending to evidence, letting it register) that *indirectly* lead to belief formation *when evidence warrants it*. You know how to *perform belief-forming actions*, not how to "believe" directly. Your "yes" verdict applies to this *process*.
  *   **Willing (Arbitrary Want - No):** Fails ADC. Lacks direct agentive control to initiate a want for no reason.
  *   **Willing (via Reason Rehearsal - *Limited* Yes):** ADC holds *for the method, not willing itself*. You possess a reliable, agentively deployable disposition to *engage in specific motivational actions* (rehearsing reasons, committing) that *indirectly* lead to strengthened will/action *when reasons exist*. You know how to *perform will-strengthening actions*, not how to "will" directly.

  **Reconciliation:** Your "no" verdicts apply to *direct, on-demand production* of belief/wanting. Your "yes" verdicts apply to *knowing how to perform specific, controllable mental actions (attending, rehearsing, committing) that reliably facilitate belief formation or willed action when the world cooperates* (i.e., when evidence/reasons exist). This preserves the distinction from imagining, which *is* directly controllable.

  ### Predictions for New Cases:
  1.  **Rubik's Cube (Solves by heart, different colors):**
      *   *ADC Prediction:* **No knowledge-how for the variant.** They have a reliable disposition *only* for specific color configurations. The variant creates abnormal conditions relative to their trained capacity. Contextual standard (solving a scrambled cube) requires handling different color schemes if that's the norm. Like your base-7 case.
      *   *Your Likely Verdict:* Matches ADC (No).

  2.  **Driving Stick Shift (Never used Automated Clutch):**
      *   *ADC Prediction:* **Likely retains knowledge-how.** The core disposition (gear shifting coordination, clutch control) is agentively deployable. An automated clutch *simplifies* the task but doesn't fundamentally change the normal conditions or contextual standard for "driving a stick shift car" (using gears effectively). Their capacity should transfer reliably. If the clutch feel/response is radically different and causes failure, then ADC might say "No" – failure under normal conditions for *that specific car*.
      *   *Your Likely Verdict:* Probably "Yes" (knowledge-how remains), as the core *agentive actions* (shifting gears, understanding the point of the clutch) are intact; the automation just removes one manual step.

  ### Accommodating Your Verdicts & Sacrifices:
  *   **Accommodated:** Bike (Yes), Tire Manual (No), Swim Zip-tied (Yes), Neighbor (Yes), Long Division Base-10 (Yes), Base-7 (No), Imagine (Yes), Belief Flat Earth (No), Belief via Evidence (*Limited* Yes for the *method*), Will Arbitrary (No), Will via Rehearsal (*Limited* Yes for the *method*).
  *   **Sacrifice Required:** Your initial gut feeling that "belief isn't something you do" needs refinement under ADC. While you *cannot* directly *do* belief like you do imagining, you *can* directly *do things* (attending to evidence) that constitute a *method* for forming belief. ADC requires accepting that "knowing how to φ" can apply to these *indirect methods* when they are agentively deployable and reliable. You have to give up the *absolute* "belief isn't a doing" for the specific case where you *are* doing something (attending) to form it. The principle forces this distinction.

  ### Conclusion:
  The **Principle of Agentive Dispositional Capacity (ADC)** provides a robust framework explaining your core intuitions across almost all cases. It successfully reconciles:
  1.  Bike vs. Tire Manual (Disposition + Agentive Control).
  2.  Swimming with Zip-ties (Disposition persists despite abnormal blocking condition).
  3.  The "Imagine/Believe/Will" trio by distinguishing *directly controllable actions* (imagining, belief/will *formation methods*) from *states* (belief, wanting) that are not directly willed but result from controllable actions under the right conditions.

  The only cost is acknowledging that "knowing how to believe" is shorthand for "knowing how to perform actions that reliably lead to belief when appropriate," not direct control over the belief state itself. This aligns with your split verdicts on belief/will. Your judgments are remarkably consistent under this principle.
