prompt: |-
  I'm a second year PhD in philosophy and this term I'm sitting in on a seminar on moral reasoning that has left me realy confused about particularism versus generalism. A few of us were chatting after the semniar last week about whether any general principles actually do work, and I started writing down my own gut verdicts to see where I land. I beleive it is fine, even required, to break a promise to meet a friend for coffee if you pass someone who has fallen over and needs help getting steady, even when they are not badly hurt. I also think it is not fine to break a promise to bring back a borrowed department projector by noon just because you wanted an extra hour to rehearse, even if nailing your talk would be good for more people in the end. I think it is fine to fib to a cold caller to get off the phone quickly, but not fine to tell my flatmate I already paid the electricity bill when I just forgot, even though both lies are low stakes and meant to avoid awkwardness. I also think it is fine to keep a library book a couple days overdue to finish a chapter when nobody else has requested it, but not fine to stash our shared kitchen pan in my room for a week just because I like having it handy, even though both look like minor rule bending for my own convenience.

  What I want to know is whether there is any single principle, even a hedged or complicated one, that actually captures all of that without just restating the cases, and if not which of my verdicts I should give up. I keep going back and forth on a new one that feels like it should be decided by whatever the principle turns out to be, which is whether it is okay to tell my undergrads the seminar was cancelled because I was ill when really I just needed an extra morning to finish a draft, and I would love to know what your best candidate principle predicts there plus one other fresh case of your choosing that would test it. Could you spell out the candidate principles clearly, say which case motivates each clause, and be honest about where they force me to revise a verdict, all in British English please.
reasoning: |-
  Okay, let me try to figure out what this philosophy PhD student is really asking. They're a second-year PhD student sitting in on a moral reasoning seminar, confused about particularism vs. generalism. They've listed several intuitive moral judgments about promise-breaking and rule-bending scenarios and want to know if a single principle can capture all these without being ad hoc. 

  First, I need to unpack their examples. They believe it's required to break a coffee promise to help someone who's fallen, but not okay to break a projector promise for extra rehearsal time. Lying to a cold caller is fine, but lying to a flatmate about the electricity bill isn't. Keeping an unrequested library book is acceptable, but hoarding a shared kitchen pan isn't. They're also stuck on whether lying to students about canceling class to finish a draft is permissible.

  The core tension here seems to be between consequentialist considerations (helping more people, avoiding harm) and deontological ones (keeping promises, not lying, respecting shared resources). Their intuitions suggest they weigh both but prioritize differently across contexts. The projector case shows they reject pure consequentialism (rehearsing might help more people but still wrong), while the injured person case accepts overriding promises for direct harm prevention.

  Hmm, what principle could unify this? Maybe something about preventing harm versus creating benefit? But the library book vs. kitchen pan case complicates that—both are about convenience, but one involves depriving others of resources. The projector case also involves potential benefit (nailing the talk) but feels wrong because it's opportunistic. 

  The student seems sensitive to: (1) immediacy of harm (fallen person vs. projector inconvenience), (2) fairness in shared resources (kitchen pan vs. unrequested book), and (3) whether deception serves avoidance versus active exploitation (cold caller vs. flatmate bill). 

  For the draft/class lie: it mirrors the flatmate bill lie (active deception for personal gain) but also resembles the cold caller if we see students as "imposing" on time. However, students have a right to expect honesty, unlike cold callers. So the principle probably condemns this lie. 

  A test case: stealing a loaf of bread to feed your starving family. Their principle should permit it (preventing severe harm over property rights), but not stealing for a luxury. This would distinguish harm prevention from benefit-seeking. 

  The challenge is avoiding circularity. If the principle mentions "unfair deprivation" or "unreasonable burden," it might just restate the intuitions. Need to define key terms objectively—e.g., "material harm," "established expectations," "direct deprivation." 

  Also, the student might need to adjust the library book verdict if the principle emphasizes respecting institutional rules equally. But their intuition highlights no negative impact, suggesting they care about actual harm over formal rules. So perhaps the principle should accommodate that. 

  Ultimately, a hybrid principle seems inevitable: one that prioritizes preventing direct harm, condemns exploiting others for gain, and forbids deception in trust relationships. Cases like the projector (no harm, pure self-interest) and flatmate lie (breach of trust) clearly fail; helping the fallen person (preventing harm) passes. The class lie likely fails as it's deceptive self-interest violating student trust. 

  They might need to soften the library book verdict if the principle strictly forbids rule-breaking for convenience. But if the principle incorporates lack of harm to others, it holds. 

  Honestly, no principle will perfectly match all intuitions without some tweaking. They might need to either accept minor revisions or embrace particularism for edge cases. But the proposed principle gets close by combining harm prevention, trust preservation, and fairness.
answer: |-
  Right, let's tackle this properly. Your intuitions reveal a clear pattern that rejects both crude consequentialism and rigid rule-worship, leaning towards a principle sensitive to **harm prevention, relational duties, and fairness in resource access**. No principle will capture *every* gut feeling perfectly without circularity, but we can get close. Here's the best candidate principle, built from your cases:

  **The Hybrid Harm-Prevention & Relational Duty Principle:**  
  *It is permissible to break a general moral rule (e.g., promise-keeping, truth-telling, rule-following) only if either:*  
  **1. (Harm Prevention):** *It is necessary to prevent significant, immediate, and non-consensual harm to a specific person(s), AND the harm prevented substantially outweighs the harm caused by rule-breaking; OR*  
  **2. (Relational/Institutional Context):** *The rule-breaking causes no material harm, violates no specific relational duty (e.g., trust, fairness in shared resources), and occurs within a context where the rule primarily serves administrative convenience rather than core moral expectations.*

  **Now, let's break this down clause-by-clause using your cases:**

  *   **"Necessary to prevent significant, immediate, and non-consensual harm":**  
      *   **Motivated by:** Helping the fallen person (prevents immediate harm, outweighs minor disappointment to friend).  
      *   **Rejects:** Breaking projector promise for rehearsal (no *harm* prevented, just potential benefit gained). Harm > Benefit focus is key here.  
      *   **Requires Revision?** No. Captures your verdict.

  *   **"Harm prevented substantially outweighs the harm caused":**  
      *   **Motivated by:** Rejecting projector case rehearsal. The harm caused (inconvenience, broken promise) isn't outweighed by the diffuse benefit of a better talk.  
      *   **Rejects:** Crude utilitarianism.  
      *   **Requires Revision?** No. Captures your verdict.

  *   **"Causes no material harm":**  
      *   **Motivated by:** Keeping unrequested library book (no one deprived, no real harm). Lying to cold caller (minimal, impersonal harm, if any).  
      *   **Contrasts with:** Hoarding kitchen pan (deprives others, material harm). Lying to flatmate (undermines trust, potentially causes material harm if bill unpaid).  
      *   **Requires Revision?** Forces revision on **library book** *if* we deem "violating institutional rules" as inherently harmful. You seem to discount this, so the principle accommodates you by focusing on *material* harm to others.

  *   **"Violates no specific relational duty (e.g., trust, fairness in shared resources)":**  
      *   **Motivated by:** Lying to flatmate (breaches trust in a close, cooperative relationship). Hoarding kitchen pan (violates fairness in shared communal resources).  
      *   **Contrasts with:** Lying to cold caller (no relational duty exists). Helping fallen person (relational duty to friend overridden by stronger duty to prevent harm).  
      *   **Requires Revision?** No. Captures your verdicts on flatmate lie and kitchen pan.

  *   **"Context where the rule serves administrative convenience":**  
      *   **Motivated by:** Keeping library book (due date often administrative, assuming no reservation). Lying to cold caller (social convention of politeness is weak, administrative).  
      *   **Contrasts with:** Projector promise (specific agreement with a colleague/department). Flatmate bill (specific cooperation within household).  
      *   **Requires Revision?** No. Helps distinguish library book from kitchen pan/department projector.

  **Applying the Principle to Your New Case & a Test Case:**

  1.  **Lying to Undergrads about Cancellation (Illness vs. Draft):**
      *   **Harm Prevention?** Needing time for a draft isn't "preventing significant, immediate harm." It's gaining a benefit/avoiding personal inconvenience.
      *   **Material Harm?** Cancelling wastes students' time/effort (they prepared, travelled?). Undermines trust in tutor-student relationship.
      *   **Relational Duty?** Strong duty of honesty and professionalism towards students. Specific trust relationship exists.
      *   **Administrative Convenience?** No. Truthfulness to students is core to the educational relationship, not mere administration.
      *   **Principle Prediction:** **Not Permissible.** You should *not* lie. This aligns with your rejection of lying to your flatmate – it's a breach of trust in a specific relationship for personal convenience/benefit, not harm prevention.

  2.  **A Fresh Test Case: "The Borrowed Ladder"**
      *   **Scenario:** You borrow your elderly neighbour's ladder for the weekend, promising to return it by Monday 5 PM. On Monday at 4:30 PM, you see a different neighbour's toddler wander into the busy road. The quickest way to safely grab the toddler is to use the borrowed ladder to climb over a low fence. Using it risks damaging the ladder slightly and means you *definitely* won't return it by 5 PM.
      *   **Principle Analysis:**
          *   **Harm Prevention?** **YES.** Preventing a toddler from likely death/serious injury is *significant, immediate, non-consensual harm*. The harm prevented (catastrophic) vastly outweighs the harm caused (minor damage to ladder, broken promise causing inconvenience/concern).
          *   **Material Harm?** Minor potential harm to property (ladder damage), but justified by harm prevention clause.
          *   **Relational Duty?** Promise to elderly neighbour exists, but the duty to prevent grave harm overrides it in this specific context.
          *   **Administrative Convenience?** The return time was specific, but the *reason* for breaking it triggers the harm prevention clause.
      *   **Principle Prediction:** **Permissible** to use the ladder and break the promise. This mirrors your fallen person case.

  **Where Revision Might Be Needed & Why Particularism Nags:**

  1.  **Library Book Revision (Slightly):** The principle *allows* keeping the book *if* you truly believe no harm occurs. However, institutions rely on general rule-following. A strict generalist might argue *any* rule-breaking erodes systems, causing diffuse harm. Your intuition downplays this. The principle sides with *your* intuition by focusing on *material harm to specific others*. To avoid *any* revision, you'd need to accept that library rules are sometimes mere administration.
  2.  **The Allure of Particularism:** Your "going back and forth" on the draft/class lie *before* having a principle shows particularism's point: context is king. The principle gives a framework, but applying "significant harm," "material harm," or "relational duty" still requires judgement in borderline cases. Does cancelling class cause "material harm"? How "specific" is the relational duty to students vs. a cold caller? A particularist would say no principle *can* eliminate this need for contextual judgement.

  **Conclusion:** The Hybrid Principle captures the core of your intuitions:
  *   **Harm Prevention** justifies breaking rules for the fallen person and the toddler.
  *   **Relational Duties & Fairness** forbid lying to flatmates/students and hoarding shared pans.
  *   **Minimal Harm & Administrative Context** permit lying to cold callers and keeping unrequested library books.
  *   **Benefit vs. Harm Focus** forbids breaking promises for rehearsal gains.

  It forces only a *potential*, minor softening on the library book case if you take institutional harm seriously, but otherwise validates your judgements. It clearly forbids lying to your students about the cancellation. Particularism remains tempting because applying the clauses (especially "significant harm," "material harm," "specific relational duty") requires contextual sensitivity – but this principle provides a robust generalist framework far stronger than simple rules like "never lie" or "maximise good outcomes." Stick to your guns on most cases, but perhaps ponder if the library *system* deserves a tad more weight.
