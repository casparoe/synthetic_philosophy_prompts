  For the analysis: Under means-rigidity, Engineer B is more sphexish because they rigidly repeat the same checks. Under ends-rigidity, Engineer A is more sphexish because she clings to the initial diagnosis (the end goal). The key detail is that Engineer A's varied actions all serve the same unaltered diagnosis. If that link were broken—say, if her actions were random rather than diagnosis-driven—the verdict would change.

