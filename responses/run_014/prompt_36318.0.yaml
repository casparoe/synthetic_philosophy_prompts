prompt: |-
  I'm giving a talk at an AI safety workshop defending approval-directed agents as a safer design target than goal-directed ones — agents that select actions by predicting what a human overseer would approve of, rather than by optimizing a fixed utility function over futures. The audience is about twenty researchers: a core of decision-theory-first types who believe corigibility is anti-natural in mesa-optimizers and will treat any halfway-stable target as a utility function in disguise, several interpretability empiricists who will want to know what in the weights I'm claiming to inspect, and a couple of veterans of reward-model work who have watched approval signals get Goodharted into sycophancy at scale. Prepare my Q&A prep sheet: the objections in the order they'll actually arrive, phrased in this crowd's vocabulary (reward tampering, misalignment delegated to the human, obfuscated arguments the overseer cannot evaluate, approval-shaping of the overseer himself), ranked by how much damage each would do, each with a two-minute reply and a note on where the reply is soft. Include the question I'm hoping nobody asks — I suspect it's the one about whether "predict what I would approve of" just is a goal, so the dichotomy collapses — but if you judge another objection worse, say so and why. Close the sheet with the consideration that would most move me off the thesis, and flag where my overall case is likeliest to fail if it fails.
