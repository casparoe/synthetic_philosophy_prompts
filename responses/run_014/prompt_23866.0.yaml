prompt: |-
  I sit on the advisory board of a foundation that makes effective-altruism-style grants across global health and long-run causes such as institutional reform and catastrophic-risk reduction. Every funding cycle, its program officers face the same problem: consequentialism tells them to rank proposals by expected total consequences, but they are clueless about most of those consequences beyond a short horizon. Write a decision procedure a program officer, not a philosopher, could run on a proposal before it goes to the funding committee: the questions to ask in order to tell simple cluelessness (unmodeled effects that wash out symmetrically across the live options) from complex cluelessness (reasons pulling in different directions that don't net out); what counts as a sufficient answer at each step; where the procedure stops and returns no ranking; and where it instead hands the call to the committee, because what's left is a question of values rather than a further fact. Run it on two live grants -- a global-health intervention with well-modeled near-term effects, and a policy-advocacy grant meant to shift a long-run institution -- and don't soften the verdict if the foundation's favored long-termist bet is the one that fails.
reasoning: |-
  We are designing a decision procedure for a program officer to evaluate proposals in the face of cluelessness. The procedure aims to distinguish between:
   - Simple cluelessness: Unmodeled effects that are symmetric across options and thus wash out.
   - Complex cluelessness: Unmodeled effects that pull in different directions and do not net out.

   The procedure should be runnable by a non-philosopher and should output one of:
   1. A ranking (if cluelessness is simple and we can proceed with expected total consequences).
   2. No ranking (if the cluelessness is too complex to rank by expected total consequences without further input).
   3. Hand the call to the committee when what remains is a question of values.

   Steps of the procedure:

   Step 1: Identify the primary intended pathway and its key effects within the modeled time horizon.
     - For a global health intervention, this might be lives saved in the next 10 years.
     - For a policy-advocacy grant, this might be the change in policy and its immediate effects.

   Step 2: Identify the key uncertainties and potential unintended consequences within the modeled time horizon.
     - What could go wrong? What are the main risks? Are there any co-benefits?

   Step 3: Assess the magnitude and direction of unmodeled effects beyond the short horizon.
     - Ask: "What are the most plausible ways this intervention could have long-run effects (beyond the modeled horizon) that are not captured in the primary analysis?"
     - Categorize these effects as:
          a) Positive (e.g., saving lives now leads to more people who can contribute to future progress).
          b) Negative (e.g., saving lives now leads to overpopulation and resource depletion).
          c) Ambiguous or mixed.

   Step 4: Determine symmetry across options.
     - Compare the current proposal against the counterfactual (what would happen without the grant, or compared to the next best alternative).
     - Ask: "Are the unmodeled long-run effects likely to be similar in direction and magnitude for the intervention and the counterfactual?"
          - If yes, then we have simple cluelessness: the effects wash out. We can rely on the near-term model.
          - If no, then we have complex cluelessness: the effects do not wash out.

   Step 5: For complex cluelessness, try to bound the effects.
     - Ask: "Can we bound the magnitude of the long-run effects? Are they likely to be small relative to the modeled effects? Or could they be enormous (e.g., existential risk level)?"

     - If we can bound the effects and they are small relative to the modeled effects, then we can still rely on the near-term model (with a note of caution).
     - If the effects are potentially enormous (either positive or negative) and we cannot bound them, then we must consider:
          a) The sign (positive or negative) of the net long-run effect? If we can determine the sign, then we can adjust the ranking accordingly.
          b) If the sign is unknown and the magnitude is potentially huge, then we are in a situation of deep uncertainty. We might need to hand the call to the committee because the decision now hinges on values (e.g., risk aversion, ambiguity aversion) rather than further facts.

   Step 6: Handing to the committee.
     - The committee should be involved when:
          a) The unmodeled long-run effects are of complex cluelessness and potentially enormous in magnitude, and we cannot determine the sign.
          b) The decision involves value judgments that the program officer is not authorized to make (e.g., how to weigh potential catastrophic risks against near-term benefits).

   Step 7: Output of the procedure:
     - If at Step 4 we determine simple cluelessness (or if we can bound the effects in Step 5 and they are negligible), output the ranking based on the near-term model.
     - If we have complex cluelessness but we can bound the effects and they are small, output the near-term ranking with a note about the uncertainty.
     - If we have complex cluelessness and the effects are potentially enormous and we can determine the sign, then adjust the ranking accordingly (e.g., if the net long-run effect is positive, the proposal is better than the near-term model suggests; if negative, worse).
     - Otherwise, if the sign is unknown and the magnitude is enormous, do not output a ranking and hand the call to the committee.

   Now, run the procedure on two grants:

   Grant 1: Global-health intervention with well-modeled near-term effects (e.g., distributing bed nets to prevent malaria).

   Step 1: Primary pathway: reducing malaria cases and deaths in the next 10 years. Modeled effects: X DALYs averted.

   Step 2: Uncertainties in the short term: potential insecticide resistance, distribution challenges, behavioral responses. Unintended consequences: maybe temporary, such as reduced immunity in the population? But these are usually considered in the model and are part of the uncertainty in the modeled effects.

   Step 3: Long-run effects beyond 10 years:
     - Positive: Children saved grow up to be productive adults, contributing to economic growth and stability, which might lead to better institutions and further health improvements.
     - Negative: Population growth might outstrip economic growth, leading to resource depletion, instability, and conflict. However, there is evidence that reducing child mortality leads to lower fertility rates in the long run, which might mitigate this.

   Step 4: Symmetry across options?
     - Compare to the counterfactual: without the grant, the bed nets are not distributed. In the counterfactual, more children die. The long-run effects in the counterfactual: the population is lower, but also the society might be more burdened by disease (which hinders development). 
     - It is plausible that the long-run effects of saving lives now versus not saving them might have both positive and negative aspects, but the evidence from demography and development economics suggests that, on balance, health improvements lead to a demographic transition and economic growth. However, the symmetry question: are the long-run effects in the two scenarios (with and without the intervention) symmetric in a way that they wash out? 

     - Actually, the long-run effects are not symmetric. The intervention causes a change in the trajectory. Without the intervention, the population is lower and the disease burden remains high. With the intervention, the population might be larger and healthier. The evidence suggests that the healthier, larger (in the short run) population, if coupled with investments in education and economic opportunities, can lead to a demographic dividend. But if the country does not have the capacity to absorb the population growth, it could lead to problems.

     - However, note that the counterfactual also has a trajectory. The question is: does the intervention change the long-run trajectory in a way that is not symmetric? The answer is yes. Therefore, we have complex cluelessness.

   Step 5: Bounding the effects?
     - The long-run effects of health interventions have been studied. There is a robust literature (e.g., the work on the demographic dividend) suggesting that health improvements can lead to substantial economic gains. The negative effects (like resource depletion) are often offset by technological progress and demographic transition. 
     - But note: these long-run effects are highly context-dependent. However, in the case of bed nets, the intervention is relatively low-cost and targeted. The magnitude of the long-run effects, though positive on average, might be bounded. We can look for evidence from similar interventions.

     - We can say that the long-run effects are likely to be positive and bounded in magnitude. The worst-case scenarios (e.g., triggering a Malthusian catastrophe) are considered highly unlikely by experts given the current state of development and global context.

     - Therefore, we can adjust the ranking: the bed net intervention not only has positive near-term effects but also likely positive long-run effects. Thus, the expected total consequences are even better than the near-term model suggests.

     - But note: if the program officer is not sure about the sign, or if there is a significant chance of negative long-run effects, then we must be cautious.

     - Given the consensus in the literature, we might consider the long-run effects to be positive and bounded. So we can rank this proposal highly.

     - However, if the program officer is uncertain about the literature, they might hand it to the committee. But for the sake of this example, we assume the officer is knowledgeable.

   Step 7: Output: We can rank the proposal based on the near-term model and note that the long-run effects are likely positive, so the ranking is even stronger.

   Grant 2: Policy-advocacy grant meant to shift a long-run institution (e.g., advocating for a specific international treaty on AI safety to reduce catastrophic risks from artificial intelligence).

   Step 1: Primary pathway: The grant funds advocacy work that increases the probability of adopting a treaty that would set safety standards for AI development. The near-term (say, 10 years) effects are modeled as a small increase in the probability of the treaty being adopted (say, from p to p+Δp) and then, conditional on adoption, a reduction in the probability of an AI catastrophe.

   Step 2: Uncertainties: Will the advocacy be successful? How will the treaty be implemented? Unintended consequences: Could the treaty lead to a false sense of security? Could it concentrate AI development in less regulated entities? Could it slow down beneficial AI development?

   Step 3: Long-run effects beyond the modeled horizon (which in this case might already be long, but let's consider even longer-term and broader effects):
     - Positive: The treaty might prevent an existential catastrophe from AI. It might set a precedent for international cooperation on emerging technologies, leading to a more stable future.
     - Negative: The treaty might be poorly designed and either fail to prevent an AI catastrophe or create a regulatory environment that stifles beneficial AI, leading to slower economic growth and reduced capacity to address other existential risks. Alternatively, it might lead to a concentration of AI power in the hands of a few, increasing the risk of misuse.

   Step 4: Symmetry across options?
     - Compare to the counterfactual: without the grant, the probability of the treaty remains p. The long-run effects of having the treaty versus not having it are very different. Moreover, the advocacy work might have spillover effects (e.g., raising awareness, changing norms) that could occur even without the treaty. But note: the counterfactual scenario without this advocacy might see other advocacy efforts (so the baseline p might be achieved by others). However, the grant is incremental.

     - The long-run effects of the treaty itself (if adopted) are complex and potentially enormous. The effects without the treaty are also enormous. But the intervention changes the probability of the treaty. The long-run effects of the intervention are not symmetric to the counterfactual because the intervention changes the probability of a very high-stakes event.

     - Therefore, we have complex cluelessness.

   Step 5: Bounding the effects?
     - The magnitude of the long-run effects is enormous (existential risk level). We cannot bound the effects because they could be infinitely positive (preventing human extinction) or negative (if the treaty leads to a worse outcome than no treaty). 

     - Can we determine the sign? 
          - The intended effect is positive, but there are plausible negative scenarios. The program officer must assess: 
              a) The likelihood that the treaty would be beneficial (i.e., reduce risk) versus harmful (increase risk or create new risks).
              b) The likelihood that the advocacy work itself might have negative side effects (e.g., by polarizing the debate).

     - This is highly uncertain. There is no strong consensus on the exact design of AI governance, and the effects are hard to predict.

     - Therefore, we cannot bound the magnitude and we cannot be certain about the sign of the net long-run effect.

   Step 6: Hand to the committee.
     - The decision now depends on:
          a) The foundation's values: How risk-averse are they? How much weight do they put on reducing existential risks?
          b) How they weigh the possibility of causing harm versus the possibility of preventing harm.

     - The program officer should hand this to the committee because the decision hinges on the foundation's stance on these value-laden issues.

   Step 7: Output: Do not return a ranking. Hand the call to the committee.

   Conclusion:

   For the global-health intervention (bed nets), the procedure returns a ranking (based on near-term effects and with an upward adjustment for positive long-run effects). The program officer can recommend funding.

   For the policy-advocacy grant on AI treaty, the procedure does not return a ranking and hands the decision to the committee. The committee must decide based on their values and risk preferences.

   Note: The foundation might have a long-termist focus and be willing to take bets on reducing existential risks even with high uncertainty. But the procedure does not soften the verdict: the program officer should not rank the AI advocacy grant without committee input because the cluelessness is complex and the stakes are enormous.
answer: |-
  Below is a decision procedure designed for program officers to navigate cluelessness. It categorizes unmodeled effects as **simple** (symmetric, wash out) or **complex** (asymmetric, require deeper analysis), then guides when to rank, abstain, or escalate to the committee. The procedure prioritizes tractability—demanding only feasible evidence—and halts when value judgments dominate.  

  ---

  ### **Decision Procedure: Handling Cluelessness**  
  **Input**: A grant proposal with near-term modeled effects.  
  **Output**: Rank (e.g., "Prioritize," "Deprioritize"), "No Ranking," or "Escalate to Committee."  

  #### **Step 1: Map Core Pathway**  
  - **Question**: What is the primary causal chain of effects within 5–10 years? Quantify key outcomes (e.g., lives saved, policy changes).  
  - **Sufficient Answer**: Clear logic model + evidence (e.g., RCTs, expert forecasts) for near-term impacts.  
  - **Failure**: Abort if core pathway is unmodeled or speculative.  

  #### **Step 2: Identify Unmodeled Long-Run Effects**  
  - **Question**: Beyond 10 years, what are the most plausible positive/negative effects? Focus on 2–3 dominant scenarios (e.g., economic growth, cascading risks).  
  - **Sufficient Answer**:  
    - Qualitative scenarios (e.g., "Saved children contribute to economic growth" or "Overpopulation strains resources").  
    - No need for quantification; just plausibility.  
  - **Failure**: If no scenarios emerge, treat as simple cluelessness (proceed to rank).  

  #### **Step 3: Test Symmetry**  
  - **Question**: Are these long-run effects **symmetric** across the intervention and its counterfactual (status quo or next-best alternative)?  
    - *Symmetric*: Effects likely similar in direction/magnitude for both options (e.g., climate events affecting all equally).  
    - *Asymmetric*: Effects differ meaningfully (e.g., intervention alters demographic/technological trajectories).  
  - **Sufficient Answer**:  
    - Symmetry: Historical analogs or expert consensus (e.g., "All health interventions face similar economic spillovers").  
    - Asymmetry: Mechanism explaining divergence (e.g., "This AI policy locks in path-dependent norms").  
  - **Outcome**:  
    - If **symmetric**, declare **simple cluelessness** → Rank based on near-term effects (Step 5).  
    - If **asymmetric**, proceed to Step 4 (complex cluelessness).  

  #### **Step 4: Bound Asymmetric Effects**  
  - **Question**: Can we bound the *magnitude* and *direction* of asymmetric effects?  
    - **Direction**: Is the net effect likely positive/negative across scenarios?  
    - **Magnitude**: Are effects negligible (<10% of near-term impact) or existential (>1000x)?  
  - **Sufficient Answer**:  
    - Direction: >60% expert agreement or strong mechanistic reasoning (e.g., "Economic growth from health gains is net positive").  
    - Magnitude: Comparative analysis (e.g., "Worst-case spillover < cost of near-term benefits").  
  - **Outcome**:  
    - If direction **clear** and magnitude **bounded** → Adjust near-term ranking by direction (Step 5).  
    - If direction **unclear** or magnitude **existential/unboundable** → Proceed to Step 6.  

  #### **Step 5: Rank the Proposal**  
  - Adjust near-term ranking:  
    - Net positive asymmetric effects: **Strengthen** rank.  
    - Net negative asymmetric effects: **Weaken** rank.  
  - **Output**: Final ranking (e.g., "Prioritize," "Deprioritize").  

  #### **Step 6: Escalate to Committee**  
  - **Conditions**:  
    - Asymmetric effects with unclear direction/unboundable magnitude.  
    - Effects involve existential stakes (e.g., >1% risk of catastrophe).  
    - Trade-offs demand value judgments (e.g., near-term lives vs. existential risk).  
  - **Output**: "Escalate to Committee."  

  #### **Step 7: No Ranking**  
  - **Condition**: Analysis fails at Step 1 (no core pathway) or Step 2 (no plausible scenarios).  
  - **Output**: "No Ranking."  

  ---

  ### **Applied to Two Grants**  
  #### **Grant 1: Global Health Intervention**  
  *Distributing bed nets to prevent malaria in sub-Saharan Africa.*  
  - **Step 1**: Core pathway clear. Near-term: 100k DALYs averted (modeled via RCTs). ✅  
  - **Step 2**: Long-run effects:  
    - *Positive*: Economic growth (healthier workforce).  
    - *Negative*: Population growth straining resources.  
  - **Step 3**: **Symmetry test**:  
    - Counterfactual: Children die → lower population but weaker economy.  
    - Intervention: Children survive → short-term strain but long-term growth.  
    - *Asymmetric* (trajectories diverge).  
  - **Step 4**: **Bound effects**:  
    - Direction: Net positive (evidence: demographic transition theory; health gains → lower fertility + productivity).  
    - Magnitude: Bounded (studies show health interventions boost GDP/capita 0.3–0.5%/year; negligible vs. DALYs saved). ✅  
  - **Step 5**: Rank = **Prioritize** (near-term DALYs + positive asymmetric boost).  

  **Verdict**: Simple cluelessness. Rank confidently.  

  ---  

  #### **Grant 2: Policy Advocacy for AI Governance**  
  *Lobbying for an international treaty restricting AI development.*  
  - **Step 1**: Core pathway clear. Near-term: 10% chance of treaty adoption → 5% lower AI catastrophe risk (expert surveys). ✅  
  - **Step 2**: Long-run effects:  
    - *Positive*: Treaty prevents AI catastrophe, enabling long-term flourishing.  
    - *Negative*: Treaty slows beneficial AI, delaying solutions to poverty/climate.  
  - **Step 3**: **Symmetry test**:  
    - Counterfactual: Unregulated AI → high risk of catastrophe or transformative progress.  
    - Intervention: Alters AI trajectory → lower catastrophe risk but slower progress.  
    - *Asymmetric* (divergent paths).  
  - **Step 4**: **Bound effects**:  
    - Direction: Unclear. Experts split on whether strict rules reduce net risk (e.g., "security dilemma" vs. "coordination benefits").  
    - Magnitude: Unboundable (effects could be existential: preventing extinction vs. delaying poverty solutions for 1B people).  
  - **Step 6**: **Escalate to Committee**.  
    - Why? Asymmetric, existential stakes, and value-laden trade-off: near-term welfare (from faster AI) vs. catastrophe risk.  

  **Verdict**: Complex cluelessness. Committee must weigh values.  

  ---  

  ### **Key Takeaways**  
  1. **Simple cluelessness**: Effects wash out (e.g., global health). Rank using near-term data.  
  2. **Complex cluelessness**:  
     - Bounded/clear direction → Adjust rank.  
     - Unbounded/unclear + existential → Escalate.  
  3. **No free passes**: The AI grant fails the procedure despite its long-termist appeal. Values trump facts at existential scales.  
  4. **Practicality**: Officers need no philosophy—just logic models, expert input, and scenario mapping.
