  Next, I should outline the essential desiderata. Non-negotiable ones include explaining introspective reports, cognitive distinctions like blindsight, the meta-problem, phenomenal judgments' causal efficacy, motivational asymmetry (e.g., pain), and structural features of experience. These are based on empirical data and functional roles, not just intuitions. 

