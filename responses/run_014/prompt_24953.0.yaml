  For each desideratum, I need to consider how illusionists address it. For example, Dennett uses heterophenomenology and the intentional stance, Frankish focuses on introspective misrepresentation, Graziano on attention schema, and predictive processing on generative models. Each approach tackles the meta-problem and functional aspects differently. 

  The user also mentioned joint unsatisfiability. Are there conflicting requirements? If illusionists must explain the felt quality without positing it, that might be a tension. But if they reframe the felt quality as a judgment or representation, it becomes part of the illusion to explain. Success depends on whether all non-negotiable desiderata can be met without realist assumptions.

  I should also address the user's examples. Pain's motivational role versus propositional knowledge requires explaining why pain feels urgent without invoking intrinsic qualia. Illusionists might argue that the introspective representation includes affective valence and urgency, making the representation itself motivating. 

  Finally, structuring the response to first list desiderata, then discuss negotiability, and touch on key theorists. Highlighting the meta-problem as central since it explains why the hard problem seems compelling. Emphasize that illusionism's success hinges on explaining the illusion's mechanics thoroughly, not preserving the phenomenal feel.
answer: |-
  Here's a breakdown of the core desiderata for a successful illusionist theory of phenomenal consciousness, separating the non-negotiable empirical/explanatory demands from the potentially question-begging realist intuitions:

  **Non-Negotiable Desiderata (What Illusionism MUST Explain):**

  1.  **The Robustness & Ubiquity of Introspective Reports:** It must explain why *every* neurotypical human (and likely many animals) reports having experiences with "what it's like-ness," qualitative feels, intrinsic properties, and subjectivity. *Why does introspection generate such a powerful, consistent, and seemingly non-inferential sense of phenomenality?* (This is the core of the "illusion").
  2.  **The Access-Phenomenal Distinction (as an Apparent Phenomenon):** It must explain why the *conceptual distinction* between access consciousness (information available for global control/report) and phenomenal consciousness ("what it's like" independent of access) feels so compelling and intuitive. Crucially, it must account for empirical phenomena that *appear* to map onto this distinction:
      *   **Blindsight:** Why does the blindsighter deny seeing anything in the blind field, yet demonstrate accurate forced-choice performance, while simultaneously reporting a stark *absence* of visual phenomenality in that field? The illusionist must explain the *judgment* of absence and the *functional dissociation* without needing to posit actual inaccessible phenomenality.
      *   **Attentional Phenomena:** Why does shifting attention dramatically change the *introspective report* of richness and detail in experience?
      *   **Filling-in (e.g., blind spot):** Why do we report a *seamless, filled-in* visual field despite the known physiological gap?
  3.  **The Meta-Problem of Consciousness:** This is absolutely fundamental. **The illusionist theory *is* the solution to the meta-problem.** It must explain *why* humans are so persistently convinced there is a "Hard Problem" – why the intuition of intrinsic, irreducible qualia feels so undeniable and resistant to functional/neural explanations. It needs to detail the cognitive/perceptual mechanisms that generate (and sustain) the *illusion* that something extra exists beyond information processing and access.
  4.  **The Causal Efficacy of Phenomenal Judgments:** It must explain how judgments *about* phenomenal states ("I see red," "I am in pain," "This tastes sweet") arise, how they become incorporated into cognitive processing, decision-making, verbal reports, and reasoning (including comparisons like "red is more like orange than like blue"). The *representational/functional states* underlying these judgments must be causally efficacious.
  5.  **Motivational Asymmetry (e.g., Pain):** It must explain why the *representation* of tissue damage (pain) is so overwhelmingly and urgently motivationally potent compared to a purely cognitive, propositional belief about the same damage ("I know my leg is broken"). The explanation needs to account for the *affective salience* and *action-priority* associated with certain internal states without invoking intrinsic qualia as the motivator. The illusion of "hurtfulness" must itself be a powerful driver.
  6.  **Structural Features and Invariants:** It must explain the apparent structural regularities within the "illusion":
      *   **Unity:** Why do we experience a seemingly unified field of consciousness, rather than a chaotic jumble of unrelated sensations? What mechanisms create the *binding* and *narrative stream* illusions?
      *   **Structured Changes:** How does the theory account for the *structured alterations* in reported phenomenality under conditions like psychedelics, meditation, dreaming, anesthesia, or neurological disorders? Why do these changes follow patterns correlated with neural changes?
      *   **Spatialization:** Why do many sensory modalities (vision, touch, somatic sensation) present as spatially located?
  7.  **Accuracy Conditions (Within the Illusion):** It must explain how we can make seemingly accurate or inaccurate judgments *within the framework* of the illusion (e.g., mistaking teal for blue, failing to notice a gorilla, correctly identifying a familiar smell). This relates to the reliability (and failure modes) of the underlying representational systems generating the phenomenal reports.

  **Potentially Question-Begging Desiderata (What Illusionism Typically REJECTS):**

  1.  **Preserving the "What It's Like"-ness Itself:** This is the *core* of the illusionist claim. Demanding that a theory "preserve" or "explain" the intrinsic qualitative feels *as real things* is precisely what the illusionist denies needs to be done. They aim to explain *why we think* there is "something it is like," not to account for the existence of that "something" itself. Requiring this *as a desideratum* assumes realism from the start.
  2.  **Explaining the "Intrinsic Nature" or "Raw Feels" of Qualia:** Similar to 1, the illusionist argues there *are no* intrinsic, non-relational, raw feels. Demanding an explanation for their nature or how they arise from physics is, from the illusionist perspective, like demanding an explanation for phlogiston's properties. The desideratum is to explain the *judgment* that there are such things.
  3.  **Grounding Phenomenal Concepts in Direct Acquaintance:** Realists often argue that our phenomenal concepts (e.g., "what red looks like") are grounded in direct acquaintance with the quale itself. Illusionists deny this direct acquaintance exists. Their desideratum is to explain how phenomenal concepts *seem* to work (e.g., via recognitional capacities, memory traces, introspective models) without needing a real quale as the referent.
  4.  **Explaining Epistemic Gaps / Explanatory Gap:** While illusionism must *address* the meta-problem (why the gap *seems* unbridgeable), it does *not* accept that there is a genuine metaphysical or epistemic gap concerning a real phenomenon. Explaining the *illusion* of the gap is sufficient; "bridging" a gap for something non-existent isn't required.

  **Joint Satisfiability & Viability:**

  *   **The Core Challenge:** Illusionism attempts to satisfy desiderata 1-7 *without* invoking the entities described in A-D. Its viability hinges on whether a sufficiently rich explanation of the *mechanisms generating the introspective model* (the illusion) can account for the robustness, structure, functional roles, and compelling nature of our phenomenal judgments.
  *   **Is there a Conflict?** The main potential conflict isn't *within* the non-negotiable desiderata themselves. The conflict arises *between* the illusionist project (explain 1-7 without A-D) and the realist insistence that A-D *must* be satisfied for a complete explanation of consciousness.
  *   **Tension within Illusionism?** One potential internal tension for illusionism lies between:
      *   **Explaining the Illusion's Power:** Making the introspective model rich, detailed, affectively laden, and seemingly non-inferential enough to fully account for the compelling nature of phenomenality (Desiderata 1, 2, 5, 6).
      *   **Avoiding Reification:** Ensuring this explanation doesn't inadvertently *recreate* something functionally equivalent to real phenomenality (e.g., if the introspective model is so rich and causally potent that it *becomes* the "what it's like," collapsing back into a type of realism).
      Dennett is most aggressive in avoiding reification, sometimes risking under-explaining the power (e.g., seeming dismissive of the subject's perspective). Frankish and the PP/Graziano camps lean more into explaining the richness of the model, walking a finer line near reification.

  **Quick Scorecard on Key Variants:**

  *   **Dennett (Heterophenomenology, Multiple Drafts, Intentional Stance):**
      *   **Strengths:** Radically avoids reification. Focuses heavily on explaining reports (1, 4). Handles blindsight (2) via information access differences. Addresses meta-problem (3) via cognitive illusions inherent in language/introspection.
      *   **Weaknesses:** Often seen as under-explaining the *compelling subjective richness* (1, 5, 6). Less detailed neural/cognitive mechanism for the illusion itself. Sometimes accused of changing the subject.
  *   **Frankish (Strong Illusionism / Introspective Misrepresentation):**
      *   **Strengths:** Explicitly frames phenomenality as an introspective *misrepresentation* of cognitive/access states. Directly tackles the meta-problem (3). Explains the compelling nature (1) via the nature of the misrepresentation. Handles structural features (6) via the structure of the representation.
      *   **Weaknesses:** Needs a robust theory of what *is* being misrepresented and the precise mechanism of misrepresentation. Risk of the misrepresentation becoming too phenomenality-like.
  *   **Graziano (Attention Schema Theory - AST):**
      *   **Strengths:** Provides a specific, neurobiologically plausible mechanism (a schematized model of attention) for generating the core illusion of subjective awareness (1, 3, 6 - unity). Explains blindsight (2) via damage to the visual attention schema. Explains reports (4) as output of the schema. Motivational potency (5) linked to affective tagging within the model.
      *   **Weaknesses:** Primarily focuses on the core "awareness" illusion; needs extension to fully explain *qualitative* feels (colors, pains) as distinct from mere awareness. The richness of qualia remains a challenge.
  *   **Predictive Processing (PP) Frameworks (e.g., Hohwy, Seth):**
      *   **Strengths:** Offers a powerful, unifying framework for perception, cognition, and action. Explains the *construction* of the experienced world (including the self-model) as a generative model/prediction error minimization. Naturally handles unity (6), filling-in (2), structured changes (6 - via model alteration), and potentially the meta-problem (3 - the generative model *is* the reality we experience; questioning its nature seems deep). Can integrate AST.
      *   **Weaknesses:** "How" the generative model gives rise to the specific *illusory quality* of phenomenality within PP is still being fleshed out. Like AST, bridging from complex neural processing to the compelling *feel* of "what it's like" remains the critical work.

  **Conclusion:** A viable illusionism must deliver a comprehensive cognitive/neural account of how and why brains construct a persistent, rich, unified, affect-laden, spatially structured, *introspective model* of their own states that misrepresents cognitive/access functions as involving intrinsic qualitative feels and subjective presence ("what it's like"). It must explain all the *reports*, *judgments*, *functional dissociations* (like blindsight), *motivational asymmetries*, and *structural features* of experience as arising from this model-building process. Its success hinges on whether this explanation feels sufficiently complete *without* needing to posit the real existence of the properties the model attributes to itself. The "non-negotiable" list (1-7) are the phenomena demanding explanation; the "question-begging" list (A-D) are the properties illusionism argues are *only* properties of the model itself, not of the underlying reality. The tension isn't within the non-negotiables, but between the illusionist's ability to fully explain them and the realist's conviction that such an explanation inherently misses the essential, real "what it's like" they insist exists.
