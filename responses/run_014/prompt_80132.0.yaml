prompt: |-
  I've just had a long argument with a friend about the inside view versus the outside view, and I'd like a fair adjudication of who's right about what. He says that epistemic modesty—deferring to base rates and the outside view—is always the right epistemic stance, and that the inside view (reasoning from the specifics of the case) is the source of the planning fallacy, so we should correct for it. I replied that the outside view only works if the reference class is relevant, and that determining relevance requires the very kind of case-specific, inside-view reasoning he's trying to avoid—so the epistemic modesty he's advocating actually depends on the epistemic confidence he's trying to eliminate. He said I was just relabeling the mistake—that I should use the narrowest relevant reference class, and that "relevance" is a matter of common sense. I said that "relevance" is doing all the work, and that without a principled way to determine it, the outside view reduces to picking whichever base rate confirms your prior expectation. He conceded that the reference class problem is real, but said it's a practical, not a principled, problem, and that in practice people can usually figure out the relevant reference class. Can you go through our exchange and say who's right at each step—not just who wins overall? And what, if anything, are we both missing about the relationship between epistemic modesty and the inside-view reasoning that the outside view actually depends on?
reasoning: |-
  Okay, let me start by unpacking this user's query. They had a debate with a friend about the inside view versus the outside view. The friend believes epistemic modesty—always deferring to base rates—is correct, while the user argues that determining the relevant reference class requires inside-view reasoning, creating a dependency. 

  First, I need to break down each point of their exchange. The friend claims the inside view leads to planning fallacy, so we should always use the outside view. The user counters that relevance of the reference class is determined by inside-view reasoning, making modesty depend on confidence. The friend then says relevance is common sense and suggests using the narrowest relevant class. The user argues that without principled relevance determination, it's cherry-picking. The friend concedes the reference class problem is practical, not principled.

  Hmm, the core issue here seems to be a tension between two epistemic approaches. The user is pointing out a circular dependency: modesty requires confidence in choosing reference classes. But both might be missing that these views are complementary, not mutually exclusive. Epistemic modesty isn't about eliminating inside-view but tempering it. 

  I recall Kahneman and Tversky's work on base rates. They showed that people neglect base rates but also that relevance matters. For example, predicting a startup's success isn't just about all startups but those in similar markets or with comparable tech. But how do you define "similar"? That's where inside-view comes in. 

  The user's insight about dependency is crucial. You need initial inside-view to select the reference class, then apply outside-view, but also stay open to updating. It's iterative. The friend's "common sense" argument is weak because cognitive biases can affect what seems relevant. Confirmation bias might lead someone to pick a reference class that fits their preconception. 

  The reference class problem is both principled and practical. Theoretically, there's no perfect solution, but in practice, experts use structured approaches. Maybe they're both missing that this is a dynamic process. You start with inside-view to hypothesize relevance, check against base rates, then refine. 

  Also, the user mentioned planning fallacy. The outside view helps counter optimism bias, but as the user noted, if you pick an irrelevant class (e.g., all projects vs. similar projects), the base rate might mislead. So both have roles: outside view corrects biases, inside view refines relevance. 

  The key takeaway is that epistemic modesty shouldn't mean rejecting inside-view. It's about balancing both, acknowledging uncertainty, and iterating. The user's point about dependency highlights that all reasoning starts with some inside-view assumptions. Even choosing a reference class based on "common sense" involves implicit inside-view judgments. 

  In adjudicating, each has valid points but oversimplifies. The friend is right that outside view corrects biases, but wrong to dismiss inside-view. The user is right about dependency and relevance, but shouldn't discount outside view's utility. Both miss the iterative, complementary nature of these approaches.
answer: |-
  Here's a fair adjudication of your exchange, breaking down who was right at each step and what's being missed:

  **The Exchange & Adjudication:**

  1.  **Friend's Opening:** *"Epistemic modesty (outside view) is always right; inside view causes planning fallacy."*
      *   **Friend's Valid Point:** The outside view *is* a crucial corrective to the planning fallacy and many cognitive biases (optimism, overconfidence). Ignoring base rates often leads to serious errors.
      *   **Friend's Overstep:** Claiming the outside view is *always* right is incorrect. It's not a universal prescription. There are situations where unique specifics *dominate* (e.g., a truly revolutionary technology, a unique geopolitical event). Insisting on *always* deferring is itself a form of epistemic *im*modesty about the power of base rates.
      *   **Adjudication:** Friend is **partially right about the danger** of the inside view but **wrong about the absolute rule**.

  2.  **Your Counter:** *"Outside view depends on choosing a relevant reference class, which requires inside-view reasoning."*
      *   **Your Valid Point:** This is the core insight. **You are fundamentally correct.** Identifying the "right" reference class (e.g., "all software projects" vs. "enterprise SaaS projects in healthcare using Agile" vs. "projects led by *this specific team*") is a judgment call. Making *that* judgment *requires* looking at the specifics of the case – the *inside view*. Epistemic modesty *cannot* escape this initial act of epistemic confidence in defining relevance. This is the "Reference Class Problem."
      *   **Adjudication:** You are **right** about this crucial dependency.

  3.  **Friend's Response:** *"You're relabeling the mistake. Use the narrowest *relevant* reference class. 'Relevance' is common sense."*
      *   **Friend's Valid Point:** The advice to seek the "narrowest *relevant* reference class" is standard and often good practice. It aims for the best statistical estimate given the available data.
      *   **Friend's Overstep:** Dismissing "relevance" as simple "common sense" is naive. **Relevance is *not* always obvious or common sense.** It's:
          *   **Subjective:** Different experts might define different "narrowest relevant" classes.
          *   **Prone to Bias:** Confirmation bias, availability heuristic, and motivated reasoning heavily influence what feels "relevant" (often aligning with prior beliefs).
          *   **Conceptually Challenging:** What properties *make* a class relevant? Similarity on *which* dimensions? How do you weigh them? This lacks a strict algorithmic solution.
      *   **Adjudication:** Friend is **right** that the *goal* is the narrowest relevant class but **wrong** to dismiss the profound difficulty and subjectivity of determining "relevance" as mere "common sense." He underestimates the problem you identified.

  4.  **Your Response:** *"'Relevance' is doing all the work. Without a principled way, it reduces to cherry-picking base rates."*
      *   **Your Valid Point:** You correctly highlight that the *entire* validity of the outside-view application hinges on this unprincipled, subjective judgment of "relevance." In the absence of a clear rule, people *do* often (consciously or unconsciously) select reference classes that confirm their prior expectations or desired outcome. This is a major weakness of relying solely on the outside view.
      *   **Adjudication:** You are **right** about the centrality of the relevance problem and the risk of cherry-picking.

  5.  **Friend's Concession & Rebuttal:** *"Reference class problem is real, but it's practical, not principled. In practice, people can usually figure it out."*
      *   **Friend's Valid Point:** He concedes the core problem exists (good!). He's also right that *in many practical situations*, experienced professionals *can* make reasonable judgments about relevant reference classes with decent accuracy. The outside view, even with imperfect relevance, often provides a valuable reality check.
      *   **Friend's Overstep:** Calling it "practical, not principled" downplays its significance. It *is* a deep **epistemological problem** (how do we *know* what's relevant?). While people manage in practice, the judgments are still:
          *   **Fallible:** Experts get relevance wrong frequently.
          *   **Biased:** As noted.
          *   **Lack Foundation:** There's no ultimate *principle* guaranteeing the "right" class is chosen, only practical heuristics and domain knowledge.
      *   **Adjudication:** Friend is **right** that it's a surmountable *practical* challenge in many cases but **wrong** to minimize its *principled* difficulty and the inherent subjectivity involved.

  **Who Wins Overall?**

  It's not a clean knockout. **You win on identifying the fundamental epistemological dependency:** the outside view *cannot* function without initial inside-view judgments to define relevance. You correctly exposed the core weakness ("reference class problem") and the risk of bias/cherry-picking inherent in the practical application of epistemic modesty via the outside view.

  **However, your friend wins on emphasizing the critical *utility* of the outside view as a bias-correcting tool.** His core argument – that neglecting base rates and over-relying on specific, often overly optimistic, inside-view narratives leads to predictable errors like the planning fallacy – is powerful and empirically supported. His practical stance ("we can usually figure out relevance well enough") reflects how it's actually used effectively.

  **What You're Both Missing: The Essential Synthesis & Iteration**

  The key insight you're both overlooking is that **epistemic modesty and the inside/outside views are best used iteratively and complementarily, not as competitors:**

  1.  **Start Modestly (Outside):** Begin with the *broadest plausible* base rate. This instills initial modesty and counters blind optimism. (e.g., "Most software projects overrun").
  2.  **Apply Inside View for Refinement:** Use case-specific knowledge to *narrow* the reference class towards greater relevance. This requires epistemic *confidence* in your judgment of which details matter. (e.g., "But this team has a great track record with similar projects, uses modern tools, and has stable requirements" -> Narrow class: "Projects by this team in the last 2 years").
  3.  **Re-Apply Outside View:** Use the *narrower* base rate derived from step 2. (e.g., "This team's projects averaged 10% overruns").
  4.  **Apply Inside View for Unique Factors:** Adjust the narrower base rate *up or down* based on truly unique, un-modeled specifics of *this* case. This requires high confidence and justification. (e.g., "But this project has a brand-new, untested integration component we've never done before -> adjust expected overrun to 15-20%").
  5.  **Embrace Uncertainty:** Recognize the uncertainty inherent in *both* the base rate (due to relevance judgments and sample size) *and* the inside-view adjustments. Express forecasts as ranges or probabilities.
  6.  **Update:** As the project unfolds or more information becomes available, *update* both your relevance judgments and your specific estimates.

  **Epistemic Modesty in this Synthesis:**

  *   **Modesty about Inside View:** Recognizing its susceptibility to bias and overconfidence. Using the outside view as a necessary anchor/corrective.
  *   **Modesty about Outside View:** Recognizing the subjectivity and potential error in defining relevance and the limitations of aggregate statistics for unique cases.
  *   **Modesty about Judgment:** Recognizing that both steps (defining relevance, making inside-view adjustments) involve fallible human judgment. Seeking diverse perspectives, using structured techniques (premortems, prediction markets), and tracking prediction accuracy can improve these judgments.

  **Conclusion:** Your friend is right about the *dangers* of the unmoderated inside view and the *practical value* of the outside view as a corrective. **You are right about the *fundamental dependency* of the outside view on inside-view judgments for relevance and the *principled challenge* this poses.** Neither view is sufficient alone. True epistemic modesty acknowledges the limitations of *both* approaches and advocates for a structured, iterative process that leverages their complementary strengths while explicitly acknowledging the role of judgment and uncertainty at each step. The goal isn't to eliminate the inside view, but to *temper* its overconfidence with base rates, while using its insights to *refine* the application of those base rates.
