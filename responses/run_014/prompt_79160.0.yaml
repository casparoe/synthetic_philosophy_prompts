prompt: |-
  For the past term my reading group has been split on the Sleeping Beauty problem, and the two sides have stopped engaging with each other's arguments. One side holds that there is a determinate fact about what the agent's credence in heads should be, fixed by a general principle for updating on self-locating evidence, with the betting and planning arguments merely downstream of that credence. The other side holds that the credence question is unsettled until we say what credences are for — that the betting arguments do not test a prior credence but constitute it, so "what should she believe?" is answerable only relative to a decision problem, if at all. I have been asked to draft the joint statement both sides could sign.

  Produce it as follows. First, a numbered list of agreed claims: about the protocol and what the agent knows at each awakening; about which probability claims are well-defined here; and about what each of the standard arguments (indifference over awakenings, no-new-information, conditionalization on centered evidence, the betting and Dutch-book considerations) does and does not establish. Second, a table of the residual disagreements, each stated in wording the camp that holds it would accept, with the crux for each. Third, for each crux, a case or argument both camps agree bears on it, with each camp's prediction written down in advance.

  Both camps have also agreed to be tested on a variant we devised, for which neither has a stock answer: she is told the whole protocol in advance; a fair coin is tossed; on heads she is woken once; on tails she is woken once, and then a second fair coin is tossed, and she is woken a second time only if that coin lands heads; there is amnesia between awakenings, and no clocks or other cues. Each camp should state its principle as a general rule that delivers an answer for this variant, rather than as an intuition about it, and should say what it would take for that principle to be refuted. Say finally which parts of the dispute, if any, are merely verbal, and what evidence or argument both camps would agree should move the debate. Keep the document free of citations; the group knows the literature.
reasoning: |-
  Hmm, the user is asking for a joint statement on the Sleeping Beauty problem for their reading group. This is a tricky philosophical puzzle about probability and self-locating beliefs. I need to recall the details clearly.

  The user describes two opposing camps in their group. One side thinks there's a definite correct credence based on updating rules, while the other thinks credence only makes sense relative to decision contexts. They want me to draft a statement both sides can agree on, with specific components: agreed claims, a table of disagreements, test cases, and analysis of a new variant.

  For the agreed claims section, I should list what's uncontroversial about the protocol: Beauty knows the setup, gets amnesia, and is woken once or twice based on a coin flip. Both sides agree that probability questions are well-defined for centered possibilities like "this awakening is heads-awakening" but not for indexical-free claims. They also agree that standard arguments have limitations - indifference can be disputed, no-new-information needs careful handling, and betting arguments depend on decision frameworks.

  The disagreements table should contrast the core positions neutrally. The "Updaters" believe in a unique credence fixed by evidence, while the "Decisionalists" think credence is constituted by decisions. The crux is whether belief exists prior to action. For testing, I propose cases like betting setups and decision problems where each camp makes different predictions about Beauty's behavior.

  The new variant involves two coin tosses - heads means one awakening, tails means possibly two awakenings based on another coin flip. Both camps should state general rules: Updaters would use a centered evidence approach giving 1/3 probability to heads, while Decisionalists might say it depends on the decision context. Each should specify what would falsify their view.

  Finally, I need to address whether this is merely verbal. Both sides likely agree that "credence" is used differently - one as belief strength, the other as decision weight. They'd agree that evidence from actual agent behavior in experiments could resolve some disputes, though philosophical differences might persist.

  I should keep the tone neutral and precise, avoiding jargon where possible. The document should facilitate dialogue by clarifying exactly where disagreements lie and how they might be tested.
answer: |-
  ## Joint Statement on the Sleeping Beauty Problem

  **Preamble:** We acknowledge a shared commitment to rigorous reasoning about self-locating belief and rational agency within stipulated protocols. While we disagree on foundational interpretation, we affirm the following common ground regarding the standard Sleeping Beauty problem and related variants.

  ### 1. Agreed Claims

      1.  **Protocol & Agent Knowledge:**
          *   On Sunday, Beauty is fully informed of the protocol: A fair coin is tossed. If Heads (H), she is awakened on Monday only. If Tails (T), she is awakened on Monday and Tuesday. After each awakening, she is given amnesia-inducing drugs causing her to forget that awakening. There are no distinguishing cues (e.g., no clocks, unique sensory inputs) between awakenings.
          *   Upon each awakening, Beauty knows: (a) the complete protocol described above, (b) that it is an awakening occurring as part of the protocol, (c) she has just been awakened, and (d) she has no episodic memory of any previous awakening within the experiment.

      2.  **Well-Defined Probability Claims:**
          *   The objective chance of the coin landing Heads (P(H)) is 1/2. The objective chance of Tails (P(T)) is 1/2. These are uncontroversial.
          *   The probability *from Beauty's perspective on Sunday* of the coin landing Heads (P_sun(H)) is 1/2. The probability of Tails (P_sun(T)) is 1/2.
          *   Questions concerning *centered propositions* relative to an awakening moment are well-defined targets for Beauty's credence at that moment. E.g., "What is my credence *now* that the coin landed Heads?" (Credence(H | centered_now)), or "What is my credence *now* that this is the Monday awakening?".
          *   Questions concerning *non-centered propositions* independent of the temporal context (e.g., "What is the unconditional probability the coin landed Heads?") are *not* the primary focus during an awakening, though Beauty knows the Sunday probability remains 1/2.

      3.  **Standard Arguments: What They Do & Do Not Establish:**
          *   **Indifference over Awakenings:** Asserts that, given Tails, Beauty should be indifferent between being in the Monday or Tuesday awakening. *Agreed:* This principle is intuitive but contentious; its applicability requires justification beyond the stipulated indistinguishability. It *suggests* a credence of 1/3 for Heads upon awakening but does not *compel* it without further argument about the nature of self-locating uncertainty.
          *   **No-New-Relevant-Information (Elga):** Argues that upon awakening, Beauty gains no new information relevant to discriminating H from T beyond what she knew Sunday, because she knew she would be awakened. *Agreed:* Beauty *does* gain new information: she learns "*This* awakening event is happening *now*." This argument, as originally phrased, does not adequately address the *centered* nature of the new information. It does not definitively settle the credence question.
          *   **Conditionalization on Centered Evidence (Lewis):** Applies Bayesian updating to centered evidence ("I am awake now"). *Agreed:* This is a formally coherent approach that yields 1/2. However, the key disagreement lies in whether this *is* the correct formalization of the update from Sunday's beliefs to an awakening belief state, given the self-locating nature of the evidence and the possibility of multiple "now"s.
          *   **Betting & Dutch Book Arguments:** These arguments link credence to fair betting odds or susceptibility to guaranteed loss schemes. *Agreed:*
              *   They demonstrate that the *fair price* Beauty should pay for a bet that pays $1 if H (offered *only* during an awakening) is $1/3 per bet offered. (A Halfer accepting such a bet would lose money in expectation).
              *   They demonstrate that the *decision-theoretic consequences* of adopting a credence of 1/2 or 1/3 lead to different rational actions in specific betting scenarios framed around awakenings.
              *   They do *not* by themselves establish whether the *epistemic credence* one "should have" is 1/3 or 1/2. They show what credence is *operationally required* for rational action *within specific decision contexts*. Whether this operational requirement *defines* the credence or *follows from* it is the core disagreement.

  ### 2. Residual Disagreements

  | Camp Label             | Core Position (Stated as Camp Would Accept)                                                                 | Crux of the Disagreement                                                                 |
  | :--------------------- | :---------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------- |
  | **Epistemic Updaters** | "There is a unique, determinate rational credence Beauty should hold upon awakening (1/2 or 1/3), fixed solely by applying the correct general principle for updating her self-locating beliefs given the protocol and her evidence. Betting behavior should flow from this credence and the decision problem structure." | **Does rational epistemic credence exist independently of specific decision contexts, determinable by an updating rule applied to the evidence?** |
  | **Credence Decisionalists** | "The question 'What credence *should* Beauty hold upon awakening?' is ill-posed or incomplete without specifying a decision problem. Rational credence is constituted by the dispositions required for consistent rational planning and action across possible decision scenarios she might face (e.g., different betting setups). '1/3' and '1/2' reflect different operational roles in different contexts, not a single pre-decisional belief strength." | **Is rational credence fundamentally an epistemic attitude (belief strength) or a component of a plan for action (decision weight)?** |

  ### 3. Testing the Crux: Agreed Cases and Predictions

  *   **Case A: Single Bet Offered:** Beauty is offered a bet *once during the experiment*, during an awakening. The bet pays $1 if H, $0 if T. She must state her fair buying price *before* knowing if it's the only time she's offered the bet.
      *   **Crux:** Does this decision problem *reveal* a pre-existing credence, or does it *define* the relevant credence for this context?
      *   **Updater Prediction:** Beauty's fair price ($1/3) is *derived from* her epistemic credence (whether they believe it's 1/2 or 1/3) combined with the structure of the bet (offered on every awakening). Her credence exists prior to considering this specific bet.
      *   **Decisionalist Prediction:** Beauty's fair price ($1/3) *is* the operational manifestation of her rational credence *for the purpose of this specific decision*. Asking for her credence independent of this decision context lacks clear meaning. The rational plan requires pricing it at $1/3.

  *   **Case B: Counterfactual Bet Assessment:** On Sunday, Beauty is asked: "Imagine it's Tuesday and the coin landed Tails. What would be your *fair price at that Tuesday awakening* for a bet paying $1 if H?"
      *   **Crux:** Can credence be meaningfully assigned in a purely counterfactual, non-actual awakening, independent of any actual decision being made there?
      *   **Updater Prediction:** Yes. Beauty can reason hypothetically. She knows that in that counterfactual state (T & Tuesday), H is false. Applying their updating rule, Halfers say her credence in H there would be 0; Thirders say it would be 0 (acknowledging the centered proposition "H *and this awakening is happening*" is false on T-Tuesday).
      *   **Decisionalist Prediction:** The question is problematic or underspecified. Without an actual decision being made *on that Tuesday awakening*, "credence" lacks concrete meaning. The relevant planning question on Sunday is how to act *if* awakened, not assigning belief strength to a non-experienced, non-decision counterfactual moment. The focus is on planning for possible *actual* decision moments.

  ### 4. The Agreed Variant: Two Coins

  *   **Protocol:** Beauty is told the protocol Sunday: Fair coin C1 is tossed.
      *   If C1 = Heads (H1): Beauty is awakened once (on Monday).
      *   If C1 = Tails (T1): Beauty is awakened once (on Monday), then a *second* fair coin (C2) is tossed.
          *   If C2 = Heads (H2): Beauty is awakened a second time (on Tuesday).
          *   If C2 = Tails (T2): Beauty is *not* awakened a second time.
  *   Amnesia between awakenings, no cues. Upon each awakening, Beauty knows the full protocol and that it is an awakening happening now.

  **Camp Positions (Stated as General Rules):**

  *   **Epistemic Updaters (Rule):** "Upon awakening, Beauty should conditionalize her Sunday probabilities on the centered evidence 'I am experiencing an awakening now'. The probability of this evidence differs depending on C1. P_sun(Awakening_now | H1) = 1. P_sun(Awakening_now | T1) = P_sun(Awakening_now | T1 & H2) + P_sun(Awakening_now | T1 & T2). Since an awakening occurs on T1 regardless of C2, but only one awakening occurs under T1&T2 while two could occur (one being 'now') under T1&H2, the likelihood is higher under T1&H2 than under T1&T2 or H1. Applying the rule yields Credence_now(H1) = 1/3."
      *   **What Would Refute:** An argument showing that conditionalizing on "awakening now" is fundamentally misguided in self-locating contexts with multiple possible agent moments, or a proof that this method leads to Dutch Books or other inconsistencies *in the epistemic interpretation* that cannot be resolved by refining the centered proposition.
  *   **Credence Decisionalists (Rule):** "The rational credence Beauty holds upon awakening is determined by the requirements of consistent rational planning for the decisions she might face *during that awakening*. Without a specific decision problem, 'credence' is indeterminate. For a standard bet on H1 offered once per awakening: The fair price per bet is the payout multiplied by the expected rate of encountering the bet per experiment divided by the expected number of bets encountered. Expected payout per experiment if H1: $1 (1 bet). If T1&H2: $0 (2 bets). If T1&T2: $0 (1 bet). Expected payout: (1/2)*$1 + (1/2)*(1/2)*$0 + (1/2)*(1/2)*$0 = $0.50. Expected number of bets encountered: (1/2)*1 + (1/2)*(1/2)*2 + (1/2)*(1/2)*1 = 1.25. Fair price per bet: $0.50 / 1.25 = $0.40. Therefore, for *this betting context*, the operational credence is 0.4."
      *   **What Would Refute:** A demonstration that the dispositions engendered by planning based *only* on specific decision contexts lead to inconsistent or dominated actions *across a range of plausible, non-ad-hoc decision problems* she might actually face within the protocol, where inconsistency cannot be resolved by refining the decision analysis.

  ### 5. Nature of the Dispute & Path Forward

  *   **Verbal Elements:** We agree that a significant component of the disagreement is **verbal**. Both sides use the term "credence," but:
      *   Epistemic Updaters primarily mean *degree of belief* or *epistemic probability* – a cognitive state representing strength of conviction in a proposition given evidence.
      *   Credence Decisionalists primarily mean *decision weight* or *betting quotient* – a component of a rational disposition to act in potential decision scenarios.
      *   Recognizing this distinction clarifies why arguments appealing purely to belief (Updaters) or purely to betting (Decisionalists) often talk past each other.
  *   **Non-Verbal Elements:** The core non-verbal disagreement concerns the **fundamental purpose and nature of credence** within rational agency: Is it primarily *representational* (tracking truth/reality given evidence) or primarily *pragmatic* (a tool for effective planning and action)? This connects to deeper philosophical questions about the relationship between belief and action.
  *   **Agreed Evidence/Argument to Move Forward:** Both camps agree that progress hinges on developing and analyzing **richer scenarios involving multiple, potentially conflicting decision problems within the same protocol**. Evidence that would be compelling includes:
      1.  **Decision-Theoretic Inconsistency:** Demonstrating that the dispositions prescribed by one view lead to guaranteed losses (Dutch Books) or dominated strategies *across a coherent set of inter-related decisions* Beauty might face (e.g., bets offered on different days with different payouts, inter-temporal choices), which cannot be resolved within that view's framework, while the other view avoids such problems.
      2.  **Predictive Power:** Empirical or theoretical results showing that agents reasoning according to one view systematically make more accurate predictions about *observable outcomes within the experiment* (e.g., frequencies of awakenings relative to coin states experienced by the agent) or achieve better objective outcomes in complex planning tasks within the protocol, compared to agents reasoning according to the other view.

  **Conclusion:** This statement reflects our shared understanding of the problem structure, the limitations of standard arguments, and the precise points of divergence regarding the nature and role of credence. We commit to evaluating future arguments and variants, particularly those involving complex decision scenarios, against the testing criteria outlined above.
