  Key insight to emphasize: The simulator label isn't just descriptive—it's a deflationary tactic. Calling it "simulation" denies that the system has intrinsic goals beyond next-token prediction. That's why the internal structure matters: the causal chain lacks goal-directedness at every step. Like a wind-up toy versus a mouse.

