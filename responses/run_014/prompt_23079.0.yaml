  Metric substantivalism is the view that spacetime points exist independently and have identities. The hole argument shows that if points have haecceities, then diffeomorphisms create physically distinct but observationally identical models. This leads to indeterminism because the metric inside the hole isn't determined by outside data. But the key is that this indeterminism arises only if we insist on haecceities. So, the hole argument is primarily an argument against substantivalism, not determinism per se.

  The point-coincidence argument by Einstein is crucial here. He argued that only coincidences (like intersections of worldlines) are observable, not the points themselves. So, diffeomorphic models describe the same physical reality because they preserve these coincidences. This leads to Leibniz equivalence, where models related by diffeomorphisms are physically identical. This resolves the indeterminism by negating haecceities.

