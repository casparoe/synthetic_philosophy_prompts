answer: |-
  ### Thesis
  The Principal Principle (PP) and van Fraassen’s Reflection Principle are structurally identical norms governing rational deference: PP commands deference to objective chance, while Reflection commands deference to your own future rational self. Standard counterexamples to Reflection (e.g., anticipated irrationality) reveal a defeater structure already latent in PP’s "inadmissible evidence" clause. This symmetry undermines constitutive accounts of chance, as parallel arguments would absurdly imply that "credence" is defined by deference to future selves.

  ### The Parallel (~250 words)
  Both principles enforce a *deference constraint* on rational credences. PP demands that your current credence in proposition **A**, conditional on the chance of **A** being *x* and no "inadmissible" evidence, must be *x*. Reflection demands that your current credence in **A**, conditional on your future self at time *t* having credence *y* in **A** (and being rational), must be *y*. The core imperative is identical: **align your belief with a privileged epistemic source**. The structural parallels are precise:  
  - **Conditional Structure**: Both use a conditional ("if the chance is *x*" / "if my future credence is *y*").  
  - **Default Authority**: Both treat the source (chance/future self) as *prima facie* authoritative.  
  - **Excusing Clause**: Both include a caveat suspending deference under specific conditions ("inadmissible evidence" for PP; "anticipated irrationality" for Reflection).  
  The only difference is the *level* of operation: PP defers to an *objective* probability (chance), while Reflection defers to a *subjective* state (your own future credence). This is a distinction in the *target* of deference, not the *logic* of the norm. Both encode: "Unless you have reason to distrust the source, adopt its verdict."

  ### Where Reflection’s Counterexamples Infect the PP (~200 words)
  Reflection’s classic counterexamples involve knowing your future self will be irrational—e.g., drugged, brainwashed, or emotionally compromised. These cases defeat Reflection because they reveal the future self is *epistemically malfunctioning*. Crucially, this **defeater structure mirrors PP’s "inadmissible evidence" clause**. Consider:  
  - If you know a chance-process is corrupted (e.g., a coin is biased by a hidden magnet), evidence of this corruption is *inadmissible* for PP—it defeats the imperative to set credence equal to the *reported* chance.  
  - Similarly, knowing your future self is "corrupted" (drugged) defeats Reflection.  
  The "inadmissibility" in PP is not a special feature of chance; it is **generic insurance against anticipated epistemic failure**. Just as a drugged future self isn’t a rational agent, a rigged chance-process isn’t a reliable chance-source. Both defeaters show the source fails to *track truth* due to identifiable dysfunction. PP’s clause thus implicitly acknowledges that chance-reports can be *malfunctioning*, just as future selves can be irrational. The norms share a vulnerability to broken epistemic machinery.

  ### What This Means for the Constitutive Reading (~150 words)
  If PP and Reflection are structurally identical, then any argument that PP *constitutively defines* "chance" (e.g., "chance just *is* what rational agents defer to") would imply that Reflection constitutively defines "credence" as "what your future rational self believes." This is absurd: credences are current subjective commitments, not defined by future states. The parallel thus exposes a fatal flaw in constitutive accounts of chance. Deference cannot be what chance *is*, because an identical deference norm applies to non-chance targets (future selves). Instead, both principles are *regulative norms* for managing information from fallible sources—not semantic anchors. Constitutive readings overreach by mistaking a normative practice (deference under ideal conditions) for an ontological foundation. If chance were *defined* by PP, future credences would be *defined* by Reflection—but they aren’t.

  ### Biggest Weakness of the Argument
  The most significant vulnerability is that PP’s target (objective chance) is widely regarded as *mind-independent*, while Reflection’s target (your future credence) is intrinsically *mind-dependent*. This asymmetry might undermine the claim that the norms are "literally the same." Chance is often posited as a fundamental feature of the world, making PP a bridge between physics and belief, whereas Reflection is purely intrapersonal. If chance has ontological weight—e.g., as a propensity or frequency—while future credences are merely psychological states, then PP’s "inadmissible evidence" clause might genuinely reflect a *metaphysical* constraint (e.g., evidence that bypasses lawful probability), not just an excusing condition for malfunction. This could preserve a disanalogy: PP defers to how the world *is*; Reflection defers to how you *will think*.
