answer: |-
  Here are 10 interview questions (with follow-ups) focused squarely on evidential decision theory's (EDT) mechanics, implications, and defenses, designed to move beyond Newcomb's paradigm while addressing your specified cases:

  ---

  ### Core Mechanics & Distinctions
  1. **Question:** EDT evaluates acts based on their *evidential* relationship to outcomes, not causation. How does EDT formally distinguish between an act being *good news* versus *causing* a good outcome in its calculation of expected value?  
     *Likely Reply:* "It doesn’t—it treats all probabilistic dependencies as informational."  
     **Follow-up:** If EDT lacks tools to differentiate causation from correlation, how can it avoid systematically misguided recommendations in cases like *medical testing*, where testing positive for a disease is evidence *of* the disease but doesn’t *cause* it? Should EDT agents avoid diagnostic tests?

  2. **Question:** EDT requires agents to conditionalize on their own acts. How do you reconcile this with the charge that this violates the *logic of deliberation*? (i.e., deciding *whether* to do X while assuming *X is true* seems inconsistent).  
     *Likely Reply:* "Updating on the *hypothesis* of performing X is a formal tool, not a psychological contradiction."  
     **Follow-up:** Doesn’t this imply EDT’s calculations are *observer-centric* rather than *agent-centric*? Could an EDT agent coherently deliberate while knowing their decision algorithm is being simulated (e.g., in a prediction experiment)?

  ---

  ### Smoking-Lesion Case (Your Request)
  3. **Question:** In the smoking-lesion case, smoking is evidence of cancer (due to the lesion) but causally inert. EDT calculates smoking’s expected utility as low because *P(cancer|smoke)* is high. How can EDT endorse smoking here without abandoning its core formalism?  
     *Likely Reply:* "The agent should *not* update on the lesion if they know their own genetic status."  
     **Follow-up:** But if the agent *doesn’t* know their lesion status (the standard setup), EDT recommends abstaining. Isn’t this a fatal flaw—punishing agents for evidence they can’t control?

  4. **Question:** Could EDT handle smoking-lesion by refining the *background knowledge* included in the probability space? For example, conditioning on genetic subgroups.  
     *Likely Reply:* "Yes—rational EDT agents partition hypotheses to screen off non-causal dependencies."  
     **Follow-up:** Doesn’t this require agents to know *which* partitions are causally relevant? If not, won’t EDT still recommend irrational acts when causal structures are opaque?

  ---

  ### Causation vs. Correlation (Your Request)
  5. **Question:** Critics argue EDT conflates *seeing* with *doing*. Does EDT have resources to identify when a correlation is *merely evidential*?  
     *Likely Reply:* "No—but agents use causal knowledge to *select reference classes* for their probabilities."  
     **Follow-up:** If causal knowledge is needed to apply EDT correctly, doesn’t this make EDT *parasitic* on causal reasoning? Should we view EDT as a tool for agents with full causal models rather than a self-sufficient theory?

  ---

  ### Newcomb's Problem Revisited (Your Request)
  6. **Question:** Beyond one-boxing, what is EDT’s *philosophical lesson* in Newcomb’s problem? Is it about epistemology (the predictor’s reliability), metaphysics (fatalism), or agency?  
     *Likely Reply:* "It shows that rational acts can *correlate* with good outcomes without causing them."  
     **Follow-up:** Does this imply EDT treats agents as *symptoms* of good outcomes rather than *authors*? Does this conflict with how we view moral responsibility?

  7. **Question:** Suppose Newcomb’s predictor has 99% accuracy. If an EDT agent *learns* they are an EDT reasoner, should they *revise their act probabilities*? (e.g., "I’m likely to one-box, so the box is probably full").  
     *Likely Reply:* "Yes—EDT agents update on all evidence, including their own dispositions."  
     **Follow-up:** Doesn’t this lead to *self-fulfilling expectations*? Could EDT demand different acts from identical agents based solely on their self-knowledge?

  ---

  ### Defenses & Extensions
  8. **Question:** EDT is often criticized in *dynamic choice* cases (e.g., Toxic Waste Puzzle) where agents can *bind* future choices. How can EDT avoid self-sabotage?  
     *Likely Reply:* "Agents should evaluate *plans*, not atomic acts—they can update on their commitment strategy."  
     **Follow-up:** But isn’t this a concession that *act-based* EDT fails? Does "plan EDT" collapse into causal decision theory (CDT)?

  9. **Question:** Some philosophers (e.g., Arif Ahmed) argue EDT violates *dominance* (choosing dominated acts if they correlate with good outcomes). Is dominance irrelevant to EDT, or can it be reconciled?  
     *Likely Reply:* "Dominance assumes *causal independence*, which EDT rejects when dependencies exist."  
     **Follow-up:** Doesn’t this make EDT vulnerable to *exploitation*? (e.g., a rival who rewards EDT-inconsistent behavior).

  ---

  ### Big Picture
  10. **Question:** If EDT doesn’t guide us toward *influencing* outcomes but toward *signaling* them, is it a theory of *rational action* or *rational self-forecasting*?  
      *Likely Reply:* "It’s about maximizing *evidential expected value*—a distinct notion of rationality."  
      **Follow-up:** Should we then judge EDT by its own standard? If EDT agents *lose money* to CDT agents in repeated interactions (e.g., in asymmetric dilemmas), is that evidence *against* EDT?

  ---

  ### Key Features of This Draft
  - **Avoids Newcomb Rehash:** Focuses on formalism (Q1, Q2), generalization (Q5, Q9), and meta-implications (Q10).
  - **Smoking-Lesion Depth:** Q3/Q4 dissect strategies to avoid "never smoke," pressuring EDT’s handling of uncontrollable evidence.
  - **Causal/Evidential Distinction:** Q5 forces engagement with EDT’s core limitation, with follow-up on causal knowledge dependency.
  - **Newcomb’s Lesson:** Q6/Q7 shift focus to *why* EDT one-boxes (correlation vs. authorship) and self-prediction paradoxes.
  - **Follow-ups That Push:** Each anticipates standard replies and challenges the guest to defend EDT’s coherence or applicability.

  This structure ensures technical rigor while probing EDT’s philosophical foundations, vulnerabilities, and paths forward—perfect for an audience familiar with decision theory basics. Good luck with the episode!
