  ### Argument Against the Evidential-Cooperation Argument for Large N

  **Claim:** In a one-shot coordination dilemma with \(N\) autonomous agents, where each agent's action is weakly correlated with others via a shared prior over an unknown cooperativeness parameter \(\theta\), the evidential-cooperation argument (ECA) fails to provide a rational basis for cooperation when \(N\) is very large. Even granting the correlation, the expected payoff from cooperating cannot justify its cost \(c\) as \(N\) scales, due to the vanishing evidential value of an individual action.

  #### Core Assumptions
  1. **Model Setup**:  
     - \(N\) agents play a simultaneous one-shot game.  
     - Each agent \(i\) chooses an action \(A_i \in \{C, D\}\) (cooperate or defect).  
     - Payoff for agent \(i\):  
       - If \(A_i = C\): \(-c + b \times (\text{number of other cooperators})\).  
       - If \(A_i = D\): \(b \times (\text{number of other cooperators})\).  
     - Assume \(b > c > 0\).  
     - \(\theta \in [0,1]\) is an unknown "cooperativeness" parameter drawn from a prior density \(p(\theta)\).  
     - Conditional on \(\theta\), actions \(A_1, \dots, A_N\) are i.i.d. Bernoulli(\(\theta\)).  

  2. **Evidential-Cooperation Argument (ECA)**:  
     - An agent reasons that if they cooperate (\(A_i = C\)), it is evidence that \(\theta\) is high (since \(P(A_i = C \mid \theta) = \theta\)), which implies other agents are likely to cooperate.  
     - The expected payoff of cooperating includes a benefit from others' cooperation, which may offset the cost \(c\).  

  3. **Scaling Assumption**:  
     - The prior \(p(\theta)\) is **fixed and independent of \(N\)**. (This is critical; see discussion below.)  

  #### Analysis: Scaling of Evidential Value
  Consider an agent deciding whether to cooperate. Under ECA, the agent compares:  
  - Expected utility of cooperating: \(E[U_i \mid A_i = C] = -c + b \cdot E[S_{-i} \mid A_i = C]\),  
  - Expected utility of defecting: \(E[U_i \mid A_i = D] = b \cdot E[S_{-i} \mid A_i = D]\),  
  where \(S_{-i}\) is the number of other agents (out of \(N-1\)) who cooperate. Cooperation is rational if:  
  \[
  b \left( E[S_{-i} \mid A_i = C] - E[S_{-i} \mid A_i = D] \right) > c.
  \]  

  By symmetry and conditional independence given \(\theta\):  
  \[
  E[S_{-i} \mid \theta] = (N-1)\theta.
  \]  
  Thus, the key difference is:  
  \[
  \Delta_N \triangleq E[S_{-i} \mid A_i = C] - E[S_{-i} \mid A_i = D] = (N-1) \left( E[\theta \mid A_i = C] - E[\theta \mid A_i = D] \right).
  \]  

  We compute the shift in the posterior mean of \(\theta\):  
  - Let \(\mu = E[\theta] = \int \theta  p(\theta)  d\theta\) (prior mean).  
  - Let \(\sigma^2 = \text{Var}(\theta) = E[\theta^2] - \mu^2\) (prior variance).  
  - Using Bayes' rule:  
    \[
    E[\theta \mid A_i = C] = \frac{E[\theta^2]}{\mu}, \quad E[\theta \mid A_i = D] = \frac{E[\theta(1-\theta)]}{1-\mu} = \frac{\mu - E[\theta^2]}{1-\mu}.
    \]  
  - The difference simplifies to:  
    \[
    E[\theta \mid A_i = C] - E[\theta \mid A_i = D] = \frac{\sigma^2}{\mu(1-\mu)}.
    \]  

  Thus:  
  \[
  \Delta_N = (N-1) \cdot \frac{\sigma^2}{\mu(1-\mu)}.
  \]  

  The cooperation condition becomes:  
  \[
  b \cdot (N-1) \cdot \frac{\sigma^2}{\mu(1-\mu)} > c.
  \]  

  #### Scaling with \(N\)
  - **Fixed prior**: \(\mu\), \(\sigma^2\), and \(\mu(1-\mu)\) are constants (independent of \(N\)).  
  - \(\Delta_N\) scales **linearly** with \(N\): \(\Delta_N = \Theta(N)\).  
  - The left-hand side of the inequality, \(b \Delta_N\), grows linearly with \(N\).  
  - For sufficiently large \(N\), \(b \Delta_N > c\) holds since \(b > 0\) and \(c\) is fixed.  

  **Apparent Implication**: ECA *supports* cooperation for large \(N\), as \(\Delta_N \to \infty\).  

  #### The Flaw: Vanishing *Per-Agent* Evidential Impact
  Despite \(\Delta_N\) growing with \(N\), the **evidential value per other agent** diminishes:  
  - The shift in the expected *fraction* of other cooperators is:  
    \[
    \delta_N \triangleq \frac{\Delta_N}{N-1} = \frac{\sigma^2}{\mu(1-\mu)}.
    \]  
  - \(\delta_N\) is **constant** (independent of \(N\)) under a fixed prior.  
  - Crucially, \(\delta_N\) represents the *average change* in the behavior of each other agent due to the conditioning on \(A_i\). As \(N \to \infty\), \(\delta_N\) does not grow; it remains \(O(1)\).  

  **Rational Irrelevance in Large Populations**:  
  - The agent cares about the *total* benefit \(b \cdot S_{-i}\), but the evidential argument relies on predicting \(S_{-i}\) by updating \(\theta\).  
  - For large \(N\), \(\theta\) is estimated more precisely by the aggregate behavior of the population, but the agent only observes their own action.  
  - The impact of one observation (the agent’s own action) on the posterior for \(\theta\) is \(O(1)\)—it does not diminish with \(N\), but it does not *scale* with the population either.  
  - However, to justify the cost \(c\), the agent requires a **total benefit shift** \(b \Delta_N = b \cdot (N-1) \cdot \delta_N\).  
    - While \(\Delta_N\) grows linearly, this growth comes solely from the factor \((N-1)\), *not* from increased evidence per agent.  
  - **Problem**: The agent’s own action is a single data point, and its evidential effect on \(\theta\) (quantified by \(\delta_N\)) is fixed. In a large population, this fixed update to \(\theta\) implies only a fixed change in the *fraction* of cooperators. The linear growth in \(\Delta_N\) is artificial—it arises because the agent applies this fixed fractional shift to \(N-1\) agents.  

  #### Why This Fails to Justify Cooperation
  1. **Misattribution of Scale**:  
     - ECA exploits the factor \((N-1)\) to amplify a fixed evidential signal (\(\delta_N\)) into a large \(\Delta_N\).  
     - But the signal \(\delta_N\) is not enhanced by the population size; it is inherently limited by the informational content of one observation.  

  2. **Cost-Benefit Mismatch**:  
     - The cost \(c\) is fixed and independent of \(N\).  
     - The *marginal gain* from cooperation over defection is \(b \Delta_N - c\).  
     - However, \(\Delta_N\)’s growth is not "real" evidence of increased collective cooperation; it is an artifact of multiplying a weak signal by \(N-1\).  
     - Rationality requires that the agent’s action *causes* benefits, but ECA relies on *correlation*. In large populations, the correlation between \(A_i\) and \(S_{-i}\) via \(\theta\) is diluted by the law of large numbers:  
       \[
       \frac{S_{-i}}{N-1} \to \theta \quad \text{(in probability given } \theta\text{)}.
       \]  
       Conditioning on \(A_i\) shifts \(E[\theta]\) by \(\delta_N\), but for large \(N\), \(\theta\) is already tightly concentrated around \(\mu\) under the prior, so the shift \(\delta_N\) is negligible relative to the uncertainty from the prior.  

  3. **Asymptotic Insignificance**:  
     - As \(N \to \infty\), the agent’s own action becomes an infinitesimal part of the data determining \(\theta\). The posterior variance of \(\theta\) given all actions would decay as \(O(1/N)\), but the agent only conditions on their own action, so the posterior variance remains \(O(1)\).  
     - Despite this, the **influence per agent** \(\delta_N\) does not decay, but it also does not grow. The linear growth of \(\Delta_N\) is thus a "volume effect" (multiplying by \(N-1\)) rather than a "strength-of-evidence effect."  
     - For cooperation to be rational, we need \(b \Delta_N > c\), which requires \(N > \frac{c \mu(1-\mu)}{b \sigma^2} + 1\). For fixed prior, this holds for large \(N\), but this is an artifact of the model.  

  #### Critical Dependence on Prior Stability
  - **Assumption of Fixed Prior**: The argument assumes \(p(\theta)\) is independent of \(N\). If instead the prior incorporates more information as \(N\) grows (e.g., prior variance \(\sigma^2 \propto 1/N\)), then \(\delta_N \propto 1/N\) and \(\Delta_N = O(1)\), making cooperation unjustified if \(b \Delta_N < c\).  
  - **Realistic Context**: In large populations, it is natural that prior information about \(\theta\) scales with \(N\) (e.g., from historical data). If so, \(\delta_N \to 0\), and ECA collapses. Even under a fixed prior, the linear growth of \(\Delta_N\) is misleading—it stems from multiplying a finite evidence update by \(N\), not from stronger evidence.  

  #### Conclusion
  For very large \(N\), the evidential-cooperation argument fails to ground a rational basis for cooperation. The shift \(\Delta_N\) grows linearly with \(N\) under a fixed prior, but this growth is an artifact of population scaling and does not reflect increasing evidence. The per-agent evidential impact \(\delta_N\) remains constant and finite, making the cost \(c\) unjustifiable when \(N\) is large enough that the fixed shift \(\delta_N\) cannot induce sufficient total benefit. This is compounded by the dilution of correlation in large populations: one action provides negligible evidence about \(\theta\) relative to aggregate behavior. Cooperation is rational only if the population is small or the prior is uninformative, but not in the large-\(N\) regime.  

  **Key Assumption**: The prior \(p(\theta)\) is fixed and independent of \(N\). If the prior sharpens with \(N\), ECA fails more severely.
