   19. Given the above, we can now argue as follows:

          In the one-shot coordination game with N agents and a common-cause prior over the population disposition θ, the evidential cooperation argument relies on the shift in the posterior distribution of θ caused by the agent's own action. This shift, multiplied by the number of other agents (N-1), gives the change in the expected number of cooperating others. The condition for cooperation is that this change times the benefit per cooperating other (b) exceeds the cost of cooperation (c).

          If the prior distribution is fixed (does not depend on N), then the shift in the posterior mean of θ is fixed, and thus the change in the expected number of others grows linearly with N. Therefore, for sufficiently large N, cooperation is justified.

          However, in a large population, it is natural to assume that we have more prior information about the population disposition. Specifically, we may assume that the prior is based on a sample size that grows with N. In that case, the prior variance of θ scales as 1/N. Then the shift in the posterior mean of θ given one's own action scales as 1/N, and the change in the expected number of others is bounded. Let B be the limit of that change as N → ∞. Then the condition for cooperation becomes b*B > c.

          If B < c/b, which may occur if the prior is sufficiently concentrated (i.e., if the prior sample size per agent is small enough), then the condition fails for all N, and in particular for large N. Therefore, in large populations with sufficiently informative priors, the evidential cooperation argument does not justify cooperation.

          This argument depends on the assumption that the prior variance scales as 1/N, which is natural if the prior is formed from a sample size proportional to N.

       Therefore, we have:

          Claim: The evidential cooperation argument does not provide a rational basis for cooperation in very large populations if we assume that the prior information about the population cooperativeness scales with the population size (so that the prior variance of θ is O(1/N)), and if the resulting bounded shift in the expected number of cooperating others (B) is less than c/b.

       Note: This is a sufficient condition for the argument to fail. It also requires that the prior sample size per agent is not too large (specifically, that the constant of proportionality in the prior sample size leads to B < c/b).

       Without the assumption of a prior that scales with N, the argument holds for large N.

       Given the problem's request to argue against the evidential cooperation in large N, we make the scaling assumption on the prior.

       Final argument:

          Consider the coordination game with N agents. Assume that the prior distribution for θ is based on a sample size of M = γ * N, where γ>0 is fixed. Then the prior variance σ^2 is O(1/N). The shift in the posterior mean of θ given the agent's own action is then O(1/N). Therefore, the shift in the expected number of other agents that cooperate is:

               Δ = (N-1) * O(1/N) = O(1)

          Specifically, Δ converges to a constant B(γ) as N → ∞. The condition for cooperation to be preferred is then:

               b * B(γ) > c

          However, note that B(γ) is a decreasing function of γ. For example, in the Beta prior, we had B(γ) = γ (in the sense that if the prior sample size is γ*N, then the shift in the posterior mean of θ is about 1/(γ*N) and then Δ = (N-1)/(γ*N) ≈ 1/γ). Therefore, we have:

               b / γ > c   =>   γ < b/c

          But if γ is large enough (specifically, γ > b/c), then B(γ) = 1/γ < c/b, and the condition fails. 

          In words: if the prior sample size per agent (γ) is greater than b/c, then the evidential effect is too weak to justify cooperation.

          Therefore, in large populations where we have a lot of prior data (specifically, γ > b/c), the evidential cooperation argument fails.

          This is the scaling argument we were seeking.

   20. Summary:

          We have shown that under the assumption that the prior distribution for the cooperativeness parameter θ is based on a sample size proportional to the population size N (with proportionality constant γ), the evidential value of one's own action (in terms of shifting the expected number of other cooperators) is approximately 1/γ. Therefore, the expected net benefit of cooperating over defecting is approximately b/γ - c. If γ > b/c, then this is negative, and cooperation is not justified.

          This argument depends on the following assumptions:

            (a) The prior distribution is derived from a sample size M = γ * N, for some fixed γ>0, and this sample is representative of the same population.

            (b) The prior distribution is sufficiently well-behaved (e.g., Beta) so that the posterior mean shift given one observation is about 1/(γ*N) for θ, leading to a shift of about 1/γ in the expected number of others.

            (c) The payoff structure is as given: cooperating costs c and yields b per other cooperating agent, and defecting costs nothing and yields b per other cooperating agent.

            (d) The agents do not have access to any additional information beyond the prior and their own action.

          Under these assumptions, for sufficiently large N and for γ > b/c, the evidential cooperation argument fails to justify cooperation.
