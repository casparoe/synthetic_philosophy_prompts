          E[ S_{-i} | X_i = 1 ] = (N-1) * E[ θ | X_i = 1 ]
          E[ S_{-i} | X_i = 0 ] = (N-1) * E[ θ | X_i = 0 ]

      So:

          Δ = (N-1) * [ E[θ | X_i=1] - E[θ | X_i=0] ]

   4. Now we compute the posterior expectations of θ given X_i.

      The prior for θ is p(θ). The likelihood of the data (only one observation: X_i) is:

          P(X_i=1 | θ) = θ,   P(X_i=0 | θ) = 1-θ

      Then:

          E[θ | X_i=1] = ∫ θ * p(θ | X_i=1) dθ = ∫ θ * [ θ * p(θ) / P(X_i=1) ] dθ
                       = (1 / P(X_i=1)) * ∫ θ^2 p(θ) dθ

          Similarly,

          E[θ | X_i=0] = ∫ θ * [ (1-θ) * p(θ) / P(X_i=0) ] dθ
                       = (1 / P(X_i=0)) * ∫ θ(1-θ) p(θ) dθ

      Also note:

          P(X_i=1) = ∫ θ p(θ) dθ = E[θ]  (let μ = E[θ])
          P(X_i=0) = 1 - μ

      So:

          E[θ | X_i=1] = (1/μ) * E[θ^2] = (1/μ) * (Var(θ) + μ^2)

          E[θ | X_i=0] = (1/(1-μ)) * E[θ(1-θ)] = (1/(1-μ)) * [ μ - E[θ^2] ]
                        = (1/(1-μ)) * [ μ - (Var(θ)+μ^2) ]

