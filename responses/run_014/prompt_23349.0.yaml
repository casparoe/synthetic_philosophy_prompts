  We are considering a one-shot coordination game with N agents. Each agent i chooses an action A_i in {C, D} (cooperate or defect). 
   There is an unknown parameter θ (the "cooperativeness" of the population) which is drawn from a prior distribution with density p(θ). 
   Conditional on θ, the actions A_1, A_2, ..., A_N are i.i.d. Bernoulli random variables with probability θ of cooperating (C).

   The payoff for an agent depends on its own action and the sum of the others' actions. Specifically, we assume that if an agent cooperates, it pays a cost c, but for every other agent that cooperates, it receives a benefit b. Thus, the payoff for agent i is:

     U_i(A_i, A_{-i}) = 
          if A_i = C: -c + b * (number of other agents that cooperate)
          if A_i = D: 0 + b * (number of other agents that cooperate)

   Note: the agent does not get a benefit from its own cooperation.

   We assume that b > c > 0, so that if at least c/b fraction of the other agents cooperate, then cooperating would be beneficial. However, in a one-shot game without any correlation, each agent would defect because they cannot influence others.

   The evidential cooperation argument (ECA) says: an agent conditions on its own action to update its belief about θ, and hence about the actions of others. Specifically, if the agent chooses to cooperate, that provides evidence that θ is high, which in turn suggests that other agents are more likely to cooperate. Thus, the expected payoff of cooperating might be higher than that of defecting.

   We wish to argue that when N is very large, this evidential effect becomes negligible, and thus the expected net benefit of cooperating (over defecting) becomes negative.

   Steps:

   1. We consider an agent's decision problem. Let X_i be the indicator that agent i cooperates. Then the agent's expected utility from cooperating is:

          E[U_i | X_i = 1] = -c + b * E[ S_{-i} | X_i = 1 ]

      where S_{-i} is the sum of the other N-1 agents' cooperation indicators.

      Similarly, for defecting:

          E[U_i | X_i = 0] = 0 + b * E[ S_{-i} | X_i = 0 ]

      The agent will prefer to cooperate if:

          -c + b * E[ S_{-i} | X_i = 1 ] > b * E[ S_{-i} | X_i = 0 ]

      which rearranges to:

          b * [ E[ S_{-i} | X_i = 1 ] - E[ S_{-i} | X_i = 0 ] ] > c

   2. We need to compute the difference in expectations:

          Δ = E[ S_{-i} | X_i = 1 ] - E[ S_{-i} | X_i = 0 ]

      and see how it behaves as N → ∞.

   3. By the symmetry and the identical distribution of the X_j given θ, we have:

          E[ S_{-i} | θ ] = (N-1) * θ

