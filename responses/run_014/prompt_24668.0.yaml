  Second rule: Protect concrete expression but not abstract ideas or merged elements. This fits all cases - they protected the concrete dialogue and cover art, but not the abstract concepts like premises, formulas or tropes.

  Third rule: Protect only literal copying of fixed expression. This stricter rule also fits, as they only enforced when there was near-verbatim copying (dialogues) or visual replication (cover art).

  For the new "time machine" case:
