prompt: |-
  I'm putting together a short opinionated piece for a workshop on moral epistemology and I want a sanity check on the argument before I embarrass myself in front of people who actually work on this stuff. Draft is below. Give me exactly five numbered comments, each one or two sentences, no intro or conclusion — just hit the weakest joints and tell me what to fix.

  Draft:

  "The puzzle of moral testimony is usually stated as an asymmetry: testimony seems perfectly fine as a source of belief about geography or chemistry, yet something seems off about forming moral beliefs that way — even when the source is clearly trustworthy. The standard moves are familiar. Either we deny the asymmetry, or we explain it via the knowledge/understanding distinction (you can get moral knowledge by testimony but not moral understanding, and understanding is what you need for acting well), or we argue that moral deference is somehow self-undermining. I want to suggest that all of this rests on a fiction: that our moral beliefs are normally the product of deliberation in the first place. They aren't. Nearly every moral view a normal adult holds — about promise-keeping, punishment, what we owe strangers — was absorbed from parents, peers, and ambient culture long before any deliberation occurred, and testimony played no role because nothing so structured as testimony was going on. So the puzzle only ever arises in the rare case where deference would conflict with someone's self-image as a deliberator, and what we are seeing is not an epistemological anomaly but wounded vanity. Once we see this, the asymmetry with geography and chemistry dissolves: in those domains we never had the self-image to wound. And the real problem the literature keeps dancing around is not deference but correlated deference — echo chambers, communities testifying to one another in a closed loop. That is a social epistemology problem about trust networks, and no amount of precision about moral understanding will touch it."

  Be harsh if it deserves it — I've got a nagging feeling the middle step does alot of work it shouldn't.
reasoning: |-
  Okay, the user is working on an opinion piece for a workshop on moral epistemology and wants a sanity check. They're specifically worried about the middle step of their argument and asked for five harsh, numbered comments without intros or conclusions. 

  First, let's unpack their core argument: They claim the moral testimony puzzle is based on a false premise—that our moral beliefs usually come from deliberation. Instead, they argue most moral views are absorbed uncritically from upbringing/culture. Therefore, the "asymmetry" between moral and factual testimony isn't real—it's just wounded vanity when deference clashes with our self-image as deliberators. The real issue is "correlated deference" (echo chambers).

  Hmm, the user's self-doubt about the middle step is warranted. Their jump from "beliefs come from culture" to "therefore the puzzle is only about vanity" needs more scaffolding. The observation about moral socialization isn't new—psychology/sociology have shown this for ages—but they're not engaging with how epistemologists have responded to this. 

  Also, the "wounded vanity" framing feels overly reductive. Even if beliefs originate culturally, people *do* deliberate later (e.g., reconsidering childhood beliefs about gender roles). The puzzle might persist when someone actively defers *instead* of deliberating post-socialization. 

  The dissolution of the asymmetry feels rushed too. The user assumes geography/chemistry lack deliberative self-image entirely, but academics in those fields absolutely see themselves as deliberators! A physicist might resent deferring on quantum mechanics just as much as a philosopher resists moral testimony. 

  Biggest hole: They dismiss existing solutions (understanding/self-undermining) without showing why their view handles those arguments better. If "vanity" is the issue, why did those sophisticated theories emerge? 

  Lastly, the pivot to "correlated deference" is intriguing but disconnected. They need to explain why *this* asymmetry (individual vs. group deference) matters more for morality than geography—maybe because moral beliefs require social coordination? 

  ...Wait, is the user secretly gesturing at a Durkheimian view? That could salvage it, but they'd need to name the move. 

  Overall: Sharp premise, underdeveloped middle, punchy but unearned conclusion. They’re right to worry.
answer: |-
  Here are five critical comments on your argument:

  1. **The "absorbed not deliberated" claim overgeneralizes**: While early moral socialization is passive, adults *do* revise beliefs via deliberation when confronted with novel dilemmas or inconsistencies—this reactivates the testimony puzzle even outside self-image concerns.  
  2. **"Wounded vanity" is reductive and uncharitable**: It dismisses substantive epistemological concerns (e.g., autonomy, reasons-responsiveness) as mere psychology without engaging their normative force.  
  3. **Dissolving the asymmetry fails**: Geography/chemistry *do* involve deliberative self-image (e.g., scientists resist deference on complex theories), yet testimony there remains uncontroversial—your account doesn't explain this residual difference.  
  4. **Ignoring existing responses to your premise**: Key literature (e.g., Jones, Enoch) addresses non-deliberative acquisition but still finds *post-hoc deference* problematic; you don't rebut their distinctions between passive shaping and active testimony-acceptance.  
  5. **"Correlated deference" shift is under-motivated**: You haven't shown why echo chambers are uniquely moral rather than general epistemic risks (e.g., scientific consensus bubbles), making the pivot seem arbitrary.  

  **Weakest joint**: The leap from "beliefs are absorbed" to "the puzzle is *only* wounded vanity" (#2 & #4)—this ignores how *conscious, adult* deference might differ epistemically from childhood enculturation, even if both use social sources.
