  Below is a complete game design tailored to your seminar. It preserves the exact timing structure of Kavka's puzzle, emphasizes the flip in dominant considerations, and includes a pre-commitment round to explore the incoherence of binding oneself to future acts. The game uses real stakes (small monetary rewards and a genuinely unpleasant drink) to elicit authentic reactions.

  ---

  ### **Game Title**: *The Midnight Challenge*  
  *(Do not reveal the connection to Kavka until the debrief)*  

  ---

  ### **Learning Goals**  
  - Experience the disconnect between decision-time and act-time incentives.  
  - Confront the practical failure of pre-commitment when future aversion is predictable.  
  - Surface the tension between one-step (outcome-focused) and two-step (process-focused) reasoning.  

  ---

  ### **Materials**  
  - **Disgusting Drink**: 1 oz per student of safe but revolting liquid (e.g., ¾ tsp soy sauce + ¼ tsp lemon juice concentrate + 5 drops Tabasco in water). *Test beforehand to ensure it’s tolerable but unpleasant*.  
  - **Rewards**: Envelopes with $3 cash per student (adjust for budget; $3 is salient but not coercive).  
  - **Pre-Commitment Tools**: Blank index cards, pens, and a lockable "commitment box" (a shoebox with a slot).  
  - **Timing Device**: Phone timer or clock.  
  - **Sign-Up Sheet**: To record decisions.  

  ---

  ### **Rules & Procedure**  
  **Total Time**: 75 minutes (split into timed phases).  

  #### **Phase 1: Decision Time (T0 - Minute 0-15)**  
  1. **Set-Up**:  
     - Show students the drink. Let them smell/taste a drop (optional).  
     - Explain:  
       > *"If you sign up now, you get $3 immediately. Later, at ‘Midnight’ (T1), you must drink the full glass. There’s no penalty for skipping the drink—you keep the $3 either way. We’ll only check at Midnight whether you drank."*  
     - Emphasize: **Signing up ≠ Drinking yet. Drinking happens later.**  

  2. **Decision**:  
     - Students sign the sheet if they want the reward. Hand $3 to each signatory.  
     - *Critical: Reward is given upfront*. No take-backs.  

  #### **Intermission (Minutes 15-40)**  
  - Run seminar content unrelated to the game (e.g., lecture on rational choice theory).  
  - **Purpose**: Let the immediacy of the reward fade; allow regret/anticipation to build.  

  #### **Phase 2: Act Time (T1 - Minute 40-50)**  
  1. **The "Midnight" Challenge**:  
     - Place the drink in front of each signatory.  
     - Announce:  
       > *"It’s Midnight. If you drink the full glass now, we record it. If not, you still keep the $3, but we’ll note your choice."*  
     - Observe who drinks. Record outcomes.  

  #### **Phase 3: Pre-Commitment Round (T0* - Minute 50-65)**  
  1. **Reset**: Collect unused drinks. Give new $3 rewards to all (to reset incentives).  
  2. **New Rules**:  
     > *"Now, you can pre-commit to drinking at Midnight. Write a binding pledge on a card (e.g., ‘I swear to drink the glass’). Seal it in the commitment box. If you do this, you get $3 now. At Midnight, we open the box. If your pledge is inside, you MUST drink—no exceptions. If you don’t pledge, you forfeit the reward."*  
     - **Key**: *No financial stakes or deposits*. Pledges are "binding" but unenforceable (students don’t know this yet).  

  3. **Decision**:  
     - Students choose:  
       - **Pledge & take $3** (write card, lock in box).  
       - **Refuse & get nothing**.  

  #### **Phase 4: Act Time 2 (T1* - Minute 65-75)**  
  1. **The Reveal**:  
     - Open the commitment box. Read pledges aloud.  
     - Place drinks in front of pledgers.  
     > *"It’s Midnight again. If your pledge is in the box, you must drink now."*  
  2. **Enforcement?**:  
     - **Secret rule**: *Do not force anyone*. If a student refuses, say:  
       > *"You chose not to drink. We’ll record this, but you keep the $3."*  
     - Record who drinks.  

  ---

  ### **Predictable Problems & Mitigation**  
  1. **Problem**: The drink isn’t aversive enough → Everyone drinks, no tension.  
     - **Fix**: Test the drink pre-class; calibrate to be unpleasant but safe. Use smell to amplify disgust.  
  2. **Problem**: Students "drink at decision time" → Sign-up collapses into immediate action.  
     - **Fix**: Physically separate reward and drink. Use clear phrasing: *"Drinking happens ONLY at Midnight."*  
  3. **Problem**: Pre-commitment round lacks authenticity → Students treat pledges as cheap talk.  
     - **Fix**: Frame pledges as "binding," use a ritualistic box, and read them aloud to add social pressure.  
  4. **Limitation**: Disgust may overwhelm two-step reasoning → No one signs up.  
     - **Design Note**: This is a **feature**. It mirrors Kavka’s core tension: if aversion is too high, forming the intention is impossible. Debrief this as the puzzle’s boundary condition.  

  ---

  ### **Debrief Structure**  
  **Do not name Kavka or "one/two-step" until the end.**  

  1. **Experience Recap (5 mins)**:  
     - *"In Round 1: What motivated you at Decision Time? At Act Time?"*  
     - *"In Round 2: Did pledging feel different? Why did/didn’t you drink?"*  

  2. **Map to Kavka’s Puzzle (5 mins)**:  
     - Reveal the puzzle:  
       > *"This was Kavka’s toxin puzzle. At T0, the reward dominates (you take the cash). At T1, disgust dominates (you refuse the drink). The 'toxin' is doing the act when the reward is already yours."*  
     - **Key Insight**:  
       > *"Pre-commitment failed because pledging at T0 doesn’t change your feelings at T1. If you knew you’d refuse, the pledge was hollow—you can’t intend what you know you’ll reject."*  

  3. **Theory Connection (5 mins)**:  
     - **One-step reasoning**: *"I get $3 for signing—why not?"* (Ignores future act).  
     - **Two-step reasoning**: *"I’ll sign and drink later"* → Fails when T1 aversion dominates.  
     - **Pre-commitment’s flaw**: It assumes you can control future you, but if you know future you will refuse, the pledge is incoherent.  

  4. **Ethical Twist**: *"What does this say about promising? Can we commit to acts we predict we’ll regret?"*  

  ---

  ### **Why This Works**  
  - **Timing Integrity**: Decision/act are separated; reward is independent of drinking.  
  - **Pre-Commitment Nuance**: Pledges expose the gap between symbolic commitment and genuine intent.  
  - **Predictable Tension**: Most will take the reward at T0, refuse the drink at T1, and struggle with pledges.  
  - **Safety**: Low-cost, voluntary, and hygienic (use disposable cups).  

  This design forces students to *live* the paradox—not just hear it. The pre-commitment round’s inevitable failure sets up a rich discussion on intention, time, and rationality.
