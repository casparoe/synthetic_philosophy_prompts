     - So maybe in the pre-commitment round, we only allow non-binding pre-commitments? But that seems pointless.

     - I propose:

          Round 1 (Basic Toxin Structure):
            - At T0: 
                 - Show the disgusting drink (make it safe but unappealing: e.g., 1 part hot sauce to 3 parts pickle juice, in a small cup - about 1 oz total). 
                 - Explain: "If you sign this commitment form, you will immediately receive $5. Then, at T2 (which we'll set for 30 minutes from now, or at the end of class), you will be asked to drink the cup. There is no penalty for not drinking at T2 - you keep the $5 regardless. But we will record whether you drink or not."
            - They sign and get $5.

