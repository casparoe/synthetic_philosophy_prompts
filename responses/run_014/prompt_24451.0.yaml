              Drink: get deposit back -> net reward = $5 (from the reward) - disgust (which we can think of as a cost D).
              Not drink: lose deposit -> net reward = $5 - deposit.

          - They will drink only if: $5 + deposit - D > $5 - deposit   =>   2*deposit > D.

