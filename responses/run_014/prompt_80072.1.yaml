answer: |-
  ### Engineered Teaching Case: Moral Uncertainty in Healthcare Allocation

  **Scenario**  
  Dr. Elena Rossi is the director of a public hospital’s intensive care unit (ICU) during a severe respiratory virus outbreak. The ICU is at capacity, and two critically ill patients—Patient X (a 40-year-old with no comorbidities) and Patient Y (a 75-year-old with multiple organ failures)—arrive simultaneously. Both require an ECMO machine to survive, but only one is available. Action A reallocates the ECMO machine from Patient Y to Patient X. Action B maintains the current allocation (Patient Y keeps the machine).  

  Medical evidence shows Action A would save Patient X’s life with >95% probability (adding ~40 life-years) while causing Patient Y’s certain death (losing ~5 life-years). Action B would likely extend Patient Y’s life by ~5 days with minimal recovery chance (<5%), while Patient X dies. Thus, Action A yields a net gain of ~35 life-years for the community. However, reallocating the machine from Patient Y violates hospital policy and explicit consent protocols: Patient Y’s family legally consented to ECMO use, and reallocation intentionally ends treatment without their approval, constituting a rights violation under the hospital’s ethics charter.  

  Dr. Rossi is morally uncertain between two frameworks:  
  - **Consequentialism** (60% credence): Endorses Action A, as it maximizes aggregate welfare (net gain of 35 life-years).  
  - **Rights-based deontology** (40% credence): Condemns Action A, as it inflicts a severe, intentional harm (violating Patient Y’s right to ongoing consented care) for aggregate gain, regardless of outcomes.  

  ### Moral Uncertainty Rules: Computations and Verdicts  
  **1. Expected Moral Value (EMV) Rule**  
  *Computation*:  
  - Assign numerical values on a common scale (e.g., "moral units"). Let \( V \) represent the value of one life-year gained.  
    - Consequentialist evaluation of Action A: Net welfare gain = +35V (aggregate benefit).  
    - Deontological evaluation of Action A: Rights violation = -C, where C is the disvalue of overriding consent/harm (scaled to V).  
  - EMV(A) = \( (0.6 \times 35V) + (0.4 \times (-C)) = 21V - 0.4C \).  
  - EMV(B) = \( (0.6 \times 0) + (0.4 \times 0) = 0 \) (no change in welfare or rights).  
  - **Verdict**: Choose A if \( 21V - 0.4C > 0 \).  
    - *Hidden stipulation*: The exchange rate \( C/V \) is undefined. If \( C/V = 50 \) (rights violation is 50× worse than losing one life-year), EMV(A) = 21V − 20V = +V > 0 → endorses A. If \( C/V = 60 \), EMV(A) = 21V − 24V = −3V < 0 → endorses B.  
  - **Structural feature**: EMV depends critically on the **cross-framework exchange rate** (arbitrary scaling of welfare vs. rights).  

  *If feature removed*: If rights violations and welfare gains were commensurable (e.g., a unified theory specifying \( C/V \)), EMV would always yield a determinate answer. Here, without a predefined scale, EMV is arbitrary.  

  **2. Satisficing/Worst-Case Rule**  
  *Computation*:  
  - **Rule definition**: Reject any action condemned by any plausible moral framework (here, deontology condemns A). Choose B only if it is permissible under all frameworks.  
  - Test:  
    - Action A: Condemned by deontology → forbidden.  
    - Action B: Consequentialism permits it (status quo, though suboptimal); deontology permits it (no rights violation) → allowed.  
  - **Verdict**: Choose B.  
  - **Structural feature**: Uses only **ordinal, framework-specific verdicts** (condemnation vs. permission), requiring no cross-framework scaling.  

  *If feature removed*: If deontology did not condemn Action A (e.g., if harm were unintentional), the rule would permit A, aligning with EMV under some scales.  

  ### Attacks and Evaluation  
  **Strongest Attack from EMV Defender**  
  "Satisficing is irrationally risk-averse. Dr. Rossi has 60% credence that A is morally required to save 35 life-years—yet satisficing discards this *probabilistic majority view* due to a 40% minority objection. This overvalues ‘clean hands’ at the cost of lives. EMV better balances uncertainty by weighting frameworks by credence and magnitudes, forcing explicit scale choices instead of hiding behind moral cowardice."  

  **Strongest Attack from Satisficing Defender**  
  "EMV’s demand for a common scale smuggles in bias. How can we compare 35 life-years (consequentialism) to a dignity violation (deontology)? The exchange rate \( C/V \) is arbitrary—e.g., setting \( C/V = 50 \) versus 60 flips EMV’s verdict. This reduces morality to pseudo-math. Satisficing avoids this by respecting incommensurability: if any credible framework forbids an action, we lack license to proceed. Here, rights violations are non-negotiable; gambling on them for aggregate gain is barbaric."  

  **Which Attack Lands?**  
  The satisficing defender’s attack lands. The exchange rate \( C/V \) *is* arbitrary and lacks objective grounding (e.g., is a rights violation “worth” 50 or 50,000 life-years?). EMV’s verdict is thus determined by an unsupported stipulation, while satisficing’s reliance on framework-specific prohibitions is transparent and avoids incommensurability. This exposes EMV’s fragility in realistic moral conflicts.  

  ---  
  **Case Built to Specification**:  
  - **Divergence achieved**: EMV endorses A only under favorable scaling (e.g., \( C/V = 50 \)), while satisficing always endorses B.  
  - **Sensitivity confirmed**: Altering \( C/V \) flips EMV’s verdict (e.g., \( C/V = 60 \) → B), but satisficing remains unchanged.  
  - **No collapse**: If deontology permitted A or if welfare/rights were commensurable, both rules *could* agree—but here, the structural features (scaling dependency vs. prohibition-based tests) drive divergence.
