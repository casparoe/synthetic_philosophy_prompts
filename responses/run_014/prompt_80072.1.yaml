  We are in a hospital setting. Dr. Lena, the chief of oncology, must decide whether to implement a new treatment protocol (Action A) or maintain the current standard (Action B) for a rare but aggressive cancer. The new protocol (A) involves a drug combination that is known to cause severe, irreversible heart damage in 2% of patients (a serious harm to identifiable individuals), but increases the overall 5-year survival rate from 70% to 90% (a significant aggregate gain). The hospital serves a population of 10,000 patients annually with this cancer. Action B maintains the status quo.

