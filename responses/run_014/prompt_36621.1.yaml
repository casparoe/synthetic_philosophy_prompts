  - **Degenerating phase (stanzas 4-6)**: Mercury's drift → failed Vulcan fix. Reuses feel forced. *Patch* becomes desperate, *anomaly* lingers unresolved.  
  - **Envoi**: Hard choice. Philosophically, dropping words mirrors programme collapse. I'll omit *belt* and *patch*—the shattered tools—to show abandonment. Final line lands on *anomaly*, the wound Einstein heals.  

  Craft notes will highlight key moves:  
  - Stanza 1: *Orbit* as celestial harmony → later becomes frayed.  
  - Stanza 3: *Prediction* glows with discovery → in stanza 5, it's a "ghost."  
  - Envoi: Silence of *belt/patch* signals heuristic failure.  

  User's hidden need: The poem must *feel* like theory decline to non-experts. Avoid jargon; lean into imagery (telescopes, whispers, spacetime). Last line's "anomaly" must ache.
answer: |-
  ## The Newtonian Sestina

  The cosmos hummed beneath a steadfast **law**,  
  Its clockwork cradled by a trusted **belt**.  
  A wobble showed – a faint, discordant **anomaly** –  
  Within the measured sweep of Uranus’s **orbit**.  
  From perturbation bloomed a bold **prediction**:  
  A new world traced, a necessary **patch**.

  On paper first, then glass, the perfect **patch**  
  Confirmed the everlasting, grand design of **law**.  
  The telescope fulfilled the bright **prediction**,  
  Proved strength resided in the yielding **belt**.  
  No flaw could crack the smooth celestial **orbit**,  
  That vanished **anomaly** became pure glory.

  But glory fades. A smaller, sharper **anomaly**  
  Persisted near the Sun. Another **patch**  
  Was sought within the sacred, trusted **orbit**  
  Of Mercury. The same unyielding **law**  
  Commanded: shield the core! Adjust the **belt**!  
  Invent a dark companion – **prediction**!

  So Vulcan rose, a phantom **prediction**,  
  To shroud the stubborn, scorching **anomaly**.  
  A desperate bulwark for the straining **belt**,  
  A heat-hazed, calculated, hopeful **patch**.  
  It held no light. The firm celestial **law**  
  Could not explain the shifting, skewed **orbit**.

  Obsession turned upon that flawed **orbit**.  
  No telescope confirmed the ghostly **prediction**.  
  The mathematics groaned beneath the **law**,  
  Unable now to tame the core **anomaly**.  
  Each calculation felt a shoddy **patch**,  
  The stiffening, exhausted, cracking **belt**.

  What once absorbed now choked the yielding **belt**.  
  All eyes were fixed upon the trembling **orbit**,  
  The failed equations, every fading **patch**.  
  Where Neptune shone, this hollow **prediction**  
  Left only ash. The deep, unhealed **anomaly**  
  Defied the old, imperious **law**.

  *The rigid **law** required a phantom near the Sun,*
  *A **prediction** born where reason had begun,*
  *But spacetime bent the light, the fixed **orbit** spun,*
  *Revealing why the constant **anomaly** won.*

  ---

  **Craft Notes**

  *   **End-Word Evolution:** The shift from progressive to degenerating problem shifts is enacted through the semantic strain on the end-words.
      *   *Progressive (Stanzas 1-3):* Reuses introduce novel, empirically fruitful meaning. "Prediction" moves from abstract calculation (S1) to triumphant discovery (S3). "Anomaly" transforms from discord (S1) to solved glory (S3). "Patch" is necessary and successful (S1/S3).
      *   *Degenerating (Stanzas 4-6):* Reuses become strained, ad hoc, or negative. "Prediction" becomes a "phantom" (S4) and "ghostly" (S5). "Anomaly" is "stubborn," "scorching," "core," and "unhealed" (S4-S6), emphasizing its persistence. "Patch" becomes "desperate," "hopeful" (implying doubt), "shoddy," and "fading" (S4-S6). "Belt" shifts from "trusted" and "yielding" (S1/S3) to "straining," "stiffening," "exhausted," and "cracking" (S4-S6). "Orbit" moves from "measured sweep" (S1) to "shifting, skewed" (S5) and "trembling" (S6).
  *   **Key Line (Double Duty):** "Invent a dark companion – **prediction**!" (S4) formally rotates the word, but "dark companion" immediately signals the degenerating shift – it's a *defensive* invocation echoing Neptune, but lacks empirical grounding and foreshadows failure.
  *   **Envoi Choice:** Philosophically aligned with abandonment. Only four end-words are used (*law, prediction, orbit, anomaly*), dropping *belt* and *patch*. This signifies the failure of the protective belt's heuristic and its patching strategies. The core (*law*) is mentioned but shown as insufficient ("required a phantom"). The final line lands decisively on "**anomaly**," now explained externally ("spacetime bent"), emphasizing the wound that killed the programme. The silence of *belt* and *patch* is the key formal enactment of the programme's death.
