  First, I need to grasp Lakatos's framework: hard core (unchanging principles), protective belt (adjustable elements), anomalies, and how problem shifts work. The sestina's fixed end-words perfectly model this—words stay rigid while contexts change, echoing the belt's adaptations. 

  The user specified six end-words: *law*, *belt*, *anomaly*, *prediction*, *patch*, *orbit*. These are spot-on—*law* for Newton's axioms, *belt* for adjustable theories, *anomaly* for discrepancies, etc. No swaps needed; they're conceptually tight. 

  For the narrative arc:  
