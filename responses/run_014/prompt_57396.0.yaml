  #### Part 3: Cruxes  
  The parties identify two cruxes that would move at least one participant if resolved. Both accept Case B (rank) as bearing on Crux 1 and Case D (reference class) as bearing on Crux 2. Predictions and potential counterevidence are stated.  

  **Crux 1: Does specific indexical information (e.g., birth rank) require likelihood-based updating without prior weighting by observer count?**  
  - **Bearing case:** Case B (rank).  
  - **SSA prediction:** P(small) = 1000/1001. Learning one’s birth rank in a large population is unlikely, so small populations are favored.  
  - **SIA prediction:** P(small) = 1/2. Prior weighting by observer count cancels the rank likelihood, leaving no update.  
  - **Discriminability:** No conceivable observation discriminates SSA from SIA in Case B, as hypotheses are empirically equivalent. The disagreement is substantive because it affects norms of reasoning: SSA views the rank as informative, while SIA sees it as neutral.  
  - **Counterevidence for SSA:** If SSA’s update led to incoherent beliefs (e.g., in a variant where high ranks are impossible in small populations), it would challenge SSA.  
  - **Counterevidence for SIA:** If SIA’s cancellation led to indifference in cases with extreme observer-count disparities, it would challenge SIA’s normative adequacy.  

  **Crux 2: Are the reference class (SSA) or observer definition (SIA) uniquely determined, or are they open choices?**  
  - **Bearing case:** Case D (reference class).  
  - **SSA prediction:** The choice to include duplicates is principled but open; if external criteria (e.g., biology) fixed the reference class, SSA might exclude them.  
  - **SIA prediction:** The choice to count duplicates as observers is principled but open; if consciousness criteria fixed "observer," SIA might exclude them.  
  - **Discriminability:** In Case D, no observation can discriminate the choices, as duplicates are stipulated as functionally identical. The disagreement is substantive because it highlights a shared problem: both assumptions require auxiliary choices not specified by the assumptions themselves.  
  - **Counterevidence for both:** A theory of reference classes (for SSA) or observers (for SIA) could resolve the choice. For example, evidence that functional duplicates lack subjective experience would challenge inclusion.  

  ---

  #### Part 4: Terminological Issues  
  The parties agree that the following difference is terminological and not substantive:  
  - **"Conditioning on existence" vs. "random sampling":** SSA describes its method as "conditioning on being a random sample from a reference class," while SIA describes it as "conditioning on one’s existence by weighting the prior." In cases without specific indexical information (e.g., Case A(i), Case C), both terminologies lead to identical outputs. The difference in phrasing does not reflect a disagreement about the underlying probabilities.  

  **What remains after stripping away terminology:**  
  - The substantive disagreements are:  
    1. How to update on specific indexical information (e.g., birth rank) when hypotheses imply different observer counts (addressed in Crux 1).  
    2. The unresolved problem of defining the reference class (SSA) or observer (SIA), which is a shared challenge requiring further choice (addressed in Crux 2).  

