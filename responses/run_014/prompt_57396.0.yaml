  ### Joint Statement on Observation Selection Effects

  **Preamble**  
  This document records agreements and disagreements between two participants in a workshop on observation selection effects. One participant defends the Self-Sampling Assumption (SSA), which holds that reasoning should proceed as if one is a random sample from a reference class of observers in the same epistemic situation. The other defends the Self-Indication Assumption (SIA), which holds that the prior probability of a hypothesis should be scaled by the number of observers it implies. Both parties conditionalize on self-locating evidence and accept the formal stipulations of the cases below. The cases are designed to isolate key disagreements, and numerical answers are derived strictly from each participant’s assumption. The statement is structured into four parts: agreements, disagreements, cruxes, and terminological issues.

  ---

  #### Part 1: Claims Both Can Sign  
  Both parties agree on the following points. Riders from one or both parties are included verbatim where needed.

  1. **Formal Setup**  
     - In all cases, agents update their credences by conditionalizing on self-locating evidence (e.g., indexical information about one’s identity or position).  
     - In Case A, the coin is physically fair, with a prior chance of Heads of exactly 1/2.  
     - All cases contain no non-indexical evidence beyond what is stipulated; evidence is neutral between hypotheses unless otherwise stated.  
     - Cases are analyzed as described, with no hidden evidence or external factors.  

  2. **Observation Selection Effects Generally**  
     - Observation selection effects pose genuine challenges for epistemology, particularly in contexts involving self-locating uncertainty or anthropic reasoning.  
     - **Rider from SSA defender:** "SSA provides a framework for addressing these effects, though the exact reference class may be context-dependent."  
     - **Rider from SIA defender:** "SIA avoids the need for a reference class by weighting by observer count, though the definition of 'observer' remains an issue."

  3. **Reference Class Problem**  
     - The reference class problem—determining which entities qualify as "observers" for sampling or weighting—is unresolved and central to the debate.  
     - **Rider from SSA defender:** "SSA requires specifying a reference class, which is a distinct choice not fully dictated by the assumption itself."  
     - **Rider from SIA defender:** "SIA requires specifying what counts as an 'observer,' which is a distinct choice not fully dictated by the assumption itself."

  ---

  #### Part 2: Disagreements Table  
  The table below presents disagreements in Cases A–C. For Case D, the table highlights divergent justifications despite numerical agreement. Answers are calculated and stated as fractions or decimals for clarity. Both parties concede that empirical equivalence between hypotheses in these cases prevents observational discrimination.  

