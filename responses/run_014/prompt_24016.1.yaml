  Okay, the user is preparing a graduate seminar in the philosophy of statistics and is stuck on articulating a puzzle about significance testing. They describe the standard practice: researchers use p-values below 0.05 to declare "statistical significance," leading to publication, while non-significant results are often dismissed. The user notes the institutional asymmetry where journals prefer significant results, treating p-values as verdicts on hypotheses, even though p-values are defined as probabilities under the null hypothesis. 

  The user wants a careful reconstruction of what this practice presupposes about the nature of probability. They mention frequentism, subjectivism, and propensity interpretations, and ask which interpretations can license the practice and where each breaks down. They're particularly interested in preregistration norms, which seem to align with frequentism but are motivated by making post-hoc statements credible. The user also wants to know how the institution would change under a Bayesian approach.

  First, I need to outline the core elements of the puzzle: the mismatch between the theoretical definition of p-values (frequentist) and their interpretation as evidence for hypotheses (Bayesian). The institutional incentives exacerbate this by favoring significant results, leading to publication bias.

  Next, I'll address each interpretation of probability. For frequentism, p-values make sense as long-run error rates, but the practice breaks down when users misinterpret them as hypothesis probabilities. Subjectivism (Bayesian) directly assigns probabilities to hypotheses, so p-values aren't natural here; using them requires contortions. Propensity might struggle with defining propensities for hypotheses rather than experimental setups.

  Preregistration is key. From a frequentist view, it controls Type I error by preventing data dredging. But the motivation to legitimize hypothesis statements hints at a Bayesian desire for credible priors. This tension shows that the practice isn't purely frequentist.

  Then, considering a Bayesian rebuild: hypotheses would have prior probabilities, evidence via Bayes factors, posterior distributions. Reporting would emphasize effect sizes with credible intervals. Preregistration could involve specifying priors and models, reducing data dredging through model transparency. The incentives would need to shift to value all well-conducted studies, not just significant ones.

  I should clarify where the practice is underdetermined. For example, frequentist methods can be used cautiously without misinterpreting p-values, but institutional pressures push towards misuse. Preregistration fits both frameworks but for different reasons: error control vs. prior justification.

  Finally, the user's deeper need might be to highlight the philosophical tensions in statistical practice, showing how institutional factors perpetuate misinterpretations. They might want to provoke discussion on reforming statistical education and scientific norms. Emphasizing the Bayesian alternative could illustrate how changing the philosophy alters practices and incentives.
answer: |-
  Here's a careful reconstruction of the philosophical puzzle surrounding significance testing, its institutional practice, and the underlying interpretations of probability, addressing your specific concerns:

  **The Core Puzzle:**
  The institutional practice conflates a *frequentist procedure* (significance testing, controlling long-run Type I error) with a *subjective epistemic output* (a binary verdict on the reality of an effect). This creates a tension because the procedure's output (p-value) is strictly a property of the data *assuming H0*, while its consumption treats it as a property of the hypothesis *given the data*.

  **Deconstructing the Practice & Interpretations of Probability:**

  1.  **Frequentism (Long-Run Relative Frequency):**
      *   **Licenses:** The *core procedure itself*. The p-value is interpreted as the relative frequency of observing data as or more extreme than the actual data *if the experiment were repeated infinitely under identical conditions and H0 were true*. The 0.05 threshold controls the long-run frequency of false positives (Type I error) at 5%. Preregistration makes perfect sense here: it strictly defines the "repeatable procedure" (hypothesis, test statistic, analysis plan) ensuring the long-run error rate calibration is valid. It prevents data dredging (p-hacking) which corrupts the long-run frequency interpretation by making the procedure non-repeatable.
      *   **Breaks Down:** At the point of *interpretation and consumption*.
          *   **Misinterpretation:** The practice treats "p < 0.05" as "H0 is probably false" or "Effect is real". Frequentist probability *does not apply to single hypotheses or events*; it only describes the procedure's behavior over many trials. Stating "There's only a 5% chance this result is due to chance" is a fundamental misinterpretation from a frequentist perspective. It conflates P(Data | H0) with P(H0 | Data).
          *   **Ignoring Power & False Negatives:** The institutional focus solely on significance ignores the frequentist concept of power (1 - Type II error rate). A non-significant result tells you little about H1 without knowing the power. The practice treats "p >= 0.05" as "No effect exists" (effectively P(H0 | Data) is high), which the frequentist procedure *does not* support.
          *   **Institutional Asymmetry:** The journal preference for significant results amplifies the misinterpretation and ignores the frequentist tenet that non-significant results *are informative* about the procedure's performance relative to H1 (via power analysis) and should be published to avoid publication bias, which distorts the long-run frequency of findings.

  2.  **Subjectivism / Bayesianism (Degree of Belief):**
      *   **Licenses:** The *desired consumption* ("Effect is real"). A Bayesian wants to assign probabilities *to the hypotheses themselves* (P(H0), P(H1)) and update them using data via Bayes' Theorem (P(H | Data) proportional to P(Data | H) * P(H)). A low p-value *might* correspond to a low P(H0 | Data) *if* the prior odds (P(H1)/P(H0)) and the likelihood ratio (Bayes Factor) are favorable. The concern about false negatives fits naturally, as Bayesians explicitly calculate posterior probabilities for both H0 and H1.
      *   **Breaks Down:** At the *core procedure and institutional reporting*.
          *   **The P-Value Itself:** The p-value (P(Data >= observed | H0)) is *not* the Bayesian quantity of interest. Bayesians need the likelihood P(Data | H0) *for the specific observed data*, not the tail probability. More crucially, they need P(Data | H1) and the priors. A low p-value alone tells you little about P(H0 | Data) without these (Lindley's Paradox exemplifies this: a significant p-value can coexist with high P(H0 | Data) if H0 has high prior probability or H1 is diffuse).
          *   **Fixed Thresholds & Binary Decisions:** Bayesian inference is inherently continuous (posterior probability or Bayes Factor). The institutional reliance on a fixed 0.05 threshold for a binary "significant/not significant" decision is alien to Bayesian reasoning, which focuses on the strength and direction of evidence updating beliefs.
          *   **Preregistration (Motivation Mismatch):** While preregistration *can* be beneficial for Bayesians (specifying models/priors upfront to avoid bias), its *primary justification within the current institution* (protecting Type I error rate) is fundamentally frequentist. The stated motivation ("to make post-hoc statements legitimate") *sounds* Bayesian (wanting credible posterior statements), but the *tool* (preregistration) is deployed to solve a frequentist problem (controlling long-run error under H0), not a Bayesian one (specifying defensible priors/models). The practice uses a frequentist tool (prereg) for a goal partly inspired by Bayesian desires, creating friction.

  3.  **Propensity (Single-Case Objective Chance):**
      *   **Licenses:** Potentially the *experimental setup itself*. A propensity theorist might interpret the probability in the randomization procedure or the underlying data-generating process as a propensity (e.g., the propensity of this specific coin setup to produce heads 50% of the time).
      *   **Breaks Down:** Most severely.
          *   **The P-Value:** It's very difficult to interpret a tail-area probability (p-value) as a propensity *of the specific experiment*. Propensities are typically tied to *generating* individual outcomes, not summarizing tail areas of distributions under hypotheticals.
          *   **Hypothesis Probabilities:** Propensity theories generally avoid assigning probabilities to hypotheses themselves. The propensity is a feature of the physical setup, not the truth of a proposition. The practice's consumption ("effect is real") cannot be directly licensed by propensity.
          *   **Underdetermined:** Propensity offers the least natural fit for the standard interpretation and consumption of significance tests. It doesn't clearly license either the procedure's calibration (like frequentism) or the hypothesis belief (like subjectivism).

  **Preregistration: The Crux of the Tension**
  Your insight is key. Preregistration is **strictly presupposed** by the frequentist interpretation: it safeguards the definition of the repeatable procedure, ensuring the long-run error rate calibration (alpha) is valid by preventing the "garden of forking paths" (data-dependent analysis choices). **However**, its *institutional motivation* ("to make post-hoc statements legitimate") often implicitly appeals to a *subjectivist/Bayesian ideal* – the desire for the final reported result to be a credible, unbiased statement about the hypothesis. This creates a philosophical mismatch: the tool is frequentist, but the *expressed reason* for using it resonates more with Bayesian concerns about the trustworthiness of the posterior conclusion. The practice *requires* the frequentist view to justify preregistration's *formal role*, but the *rhetoric* surrounding it often borrows from the subjectivist desire for credible inference.

  **Rebuilding on a Straightforward Bayesian View:**
  If the institution embraced Bayesianism as its foundation, significant changes would occur:

  1.  **Reporting:** "Significance" would vanish. Reports would focus on:
      *   **Posterior Distributions:** Showing the full distribution of probable effect sizes (e.g., "The 95% credible interval for the treatment effect is 2.5 to 5.1 units").
      *   **Bayes Factors:** Quantifying the relative evidence for H1 over H0 (or vice versa) from the data (e.g., "BF10 = 15, indicating strong evidence for H1").
      *   **Posterior Probabilities:** Explicit statements of P(H1 | Data) or P(Effect > 0 | Data), *conditional on the specified model and prior*.
  2.  **Evidence:** "Evidence of an effect" would be continuous and relative:
      *   Defined by Bayes Factors (strength of evidence) or the posterior probability exceeding a chosen threshold (e.g., P(Effect > 0 | Data) > 0.95).
      *   Emphasis shifts from binary "effect exists/doesn't exist" to quantifying the *strength of evidence* and the *most probable magnitude* of the effect.
  3.  **Experimental Design:**
      *   **Power:** Replaced by **Precision** or **Expected Bayes Factor**. Design focuses on achieving a desired precision (width of credible interval) or a high probability of obtaining strong evidence (e.g., BF > 10) if H1 is true.
      *   **Preregistration:** Evolves into **Preregistration of Models & Priors**: Crucial for transparency and to avoid bias. Researchers would specify:
          *   The competing hypotheses/models (H0, H1...Hn).
          *   Prior distributions for parameters under each model (justified theoretically or based on previous data).
          *   The planned likelihood function (data model).
          *   The decision rule for interpreting Bayes Factors/posteriors (if any).
      *   **Analysis:** Focuses on computing the posterior distribution/Bayes Factor based on the *specified* model and priors. Sensitivity analyses exploring different reasonable priors become standard.
  4.  **Institutional Incentives:**
      *   **Value of Null Results:** A study finding strong evidence *for* H0 (e.g., BF01 > 10) or a high posterior probability of a negligible effect would be highly valuable for updating beliefs and should be published.
      *   **Focus on Evidence Strength & Precision:** Journals/reviewers would value well-designed studies reporting strong evidence (high BF, tight credible interval) regardless of which hypothesis is favored. Studies showing only weak evidence would still be valuable if the design was strong and the question important, precisely because they update beliefs meaningfully.
      *   **Reduced "p-hacking":** While model specification bias remains a risk, the explicit specification of models/priors and the focus on the full posterior/BF makes data dredging for arbitrary thresholds less straightforward and more transparent.

  **Underdetermination & Summary:**

  *   **Underdetermined:** The *mechanics* of calculating a p-value are compatible with multiple interpretations (it *can* be seen as a frequentist error rate, or used within a Bayesian calculation as P(Data | H0)). The *act* of preregistration *can* be motivated by both frequentist (error control) and Bayesian (bias avoidance, prior specification) concerns. However:
  *   **Strict Presupposition:** The *standard justification and formal calibration* of significance testing (alpha level controlling long-run Type I error) **strictly presupposes a frequentist interpretation of probability.** Preregistration, in its role as protector of alpha, is a direct consequence of this frequentist foundation.
  *   **Breakdown:** The practice breaks down for Frequentism at the point of *interpretation and institutional use* (misinterpreting p-values as hypothesis probabilities, ignoring power, publication bias). It breaks down for Subjectivism/Bayes at the point of the *core procedure* (using p-values instead of posteriors/BFs, fixed thresholds). Propensity offers a poor fit throughout.
  *   **Tension:** The institutional practice embodies a fundamental tension: it relies on a frequentist *procedure* calibrated for long-run behavior but consumes the output as a subjectivist *epistemic verdict* about a specific hypothesis. Preregistration highlights this tension: justified frequentistically but often motivated by a subjectivist desire for credible conclusions.
  *   **Bayesian Rebuild:** Shifting to Bayesianism would fundamentally alter reporting (posteriors, BFs), evidence conception (continuous strength, relative), design (precision/expected BF, model/prior preregistration), and incentives (valuing strong evidence for H0, precision, transparency over binary significance).

  The puzzle, therefore, lies in the institution's reliance on a tool defined by one philosophy of probability (frequentism) while systematically interpreting and rewarding its output according to the norms of another (subjectivism), creating systematic misinterpretation and perverse incentives that the original philosophy cannot resolve within its own framework. Preregistration acts as both a symptom and a partial, philosophically conflicted, attempt to mitigate the resulting problems.
