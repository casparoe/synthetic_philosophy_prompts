  Below is a structured in-class game designed to make students experience the conceptual challenges of probability in the Everett interpretation. The game forces players to confront the "branch-counting" fallacy and the stability of amplitude-based weights through hands-on betting decisions. The rules, state setups, and debrief are tailored to your 90-minute session with 10 graduate students.

  ---

  ### **(1) Game Rules and Payoff Scheme**  
  **Title:** *The Amplitude Auction*  
  **Objective:** Players allocate tokens to outcomes before a measurement. After branching, tokens in winning branches convert to points, but every player-copy experiences a "win" or "loss" in their branch. Splitting introduces sub-branches to destabilize branch-counting.  

  **Rules:**  
  - **Tokens:** Each player gets 100 tokens per round.  
  - **Allocation:** Players allocate tokens to **outcome labels** (e.g., "Heads," "Tails") *before* measurement. Tokens must sum to 100.  
  - **Measurement & Branching:** A quantum state is measured, splitting the world into branches. Each player is copied into all branches.  
  - **Splitting Phase:** A designated **Splitter** (see roles) may subdivide one outcome into sub-branches. Amplitudes are divided, preserving total weight (e.g., splitting √0.4 into √0.1, √0.1, √0.2).  
  - **Payoff:**  
    - In each branch, tokens allocated to the **outcome that occurred** in that branch are converted to points:  
      `Points = (Tokens allocated to outcome) × (Branch weight) × 10`  
    - Tokens allocated to *other* outcomes yield 0 points.  
    - **Example:** In a branch with weight 0.4, 50 tokens allocated to this outcome yield `50 × 0.4 × 10 = 200 points`.  
  - **Scoring:** Players’ points are reset each round. The player with the highest cumulative points after all rounds wins non-monetary bragging rights or candy.  

  ---

  ### **(2) Quantum States and Branch Structures**  
  **Round 1 (Simple Split):**  
  - **State:** \( \sqrt{0.5} \, |H\rangle + \sqrt{0.5} \, |T\rangle \)  
  - **Branches:** H (weight 0.5), T (weight 0.5).  
  - **Goal:** Players intuitively allocate 50/50. Splitting not allowed. Shows the "baseline" branch-counting instinct.  

  **Round 2 (Splitting Trap):**  
  - **State:** \( \sqrt{0.6} \, |A\rangle + \sqrt{0.4} \, |B\rangle \)  
  - **Branches:** A (weight 0.6), B (weight 0.4).  
  - **Splitting:** The Splitter *must* split B into three sub-branches: \( \sqrt{0.1} \, |B_1\rangle + \sqrt{0.1} \, |B_2\rangle + \sqrt{0.2} \, |B_3\rangle \) (weights 0.1, 0.1, 0.2).  
  - **Trap:** Branch-counting favors B (3 branches vs. A’s 1), but weights favor A (0.6 > 0.4).  

  **Round 3 (Revealing Instability):**  
  - **State:** \( \sqrt{0.8} \, |X\rangle + \sqrt{0.2} \, |Y\rangle \)  
  - **Splitting:** The Splitter chooses whether to split X or Y. Players don’t know which outcome will be split or how.  
  - **Goal:** Players who bet on branch count lose when low-weight branches are subdivided (e.g., splitting Y into five 0.04-weight branches).  

  ---

  ### **(3) Roles**  
  - **Splitter (1 player):** Chooses which outcome to split and divides amplitudes. Rotate this role each round to involve everyone.  
  - **Bookmaker (Instructor):** Announces states, enforces rules, and calculates payoffs.  
  - **Regret Auditor (1–2 players):** After each round, interviews players: *“How did it feel to win/lose in every branch? Would you change your allocation?”* Records responses.  

  ---

  ### **(4) Timeline (90 Minutes)**  
  - **Intro (10 min):** Explain rules, token allocation, and payoff. Emphasize: *"Every outcome happens. You will experience all branches."*  
  - **Round 1 (15 min):** State 1 (H/T). Allocation → Measurement → Payoff.  
  - **Round 2 (20 min):** State 2 (A/B). Allocation → **Splitting** (Splitter subdivides B) → Measurement → Payoff.  
  - **Round 3 (20 min):** State 3 (X/Y). Allocation → **Splitting** (Splitter chooses outcome) → Measurement → Payoff.  
  - **Discussion & Debrief (25 min):** Structured reflection (see below).  

  ---

  ### **(5) Debrief: Mapping Game to Problem**  
  | **Game Moment**            | **Conceptual Point**                                                                 | **Debrief Question/Prompt**                                                                 |
  |----------------------------|-------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|
  | **Pre-allocation tension** | Disorientation of betting when all outcomes happen to "you."                        | *"You had to bet before knowing how branching would unfold. How did it feel to commit not knowing which branch ‘you’ would be in? Did it feel like gambling?"* |
  | **Round 2 payoff**         | Branch-counting fails: Splitting B into 3 branches lures bets, but weights are low. | *"Why did betting on B (3 branches) give lower scores than A (1 branch)? What does this say about trusting branch count?"* |
  | **Regret Auditor reports** | Failure of intuition; regret in low-weight branches.                                | *"Player X, you allocated heavily to B and won in B branches but scored low. Why? How does splitting change what ‘winning’ means?"* |
  | **Amplitude stability**    | Weights are invariant under splitting; amplitudes are conserved.                    | *"When the Splitter subdivided B, did the total weight of B change? Why can’t we ‘game’ the weights like we can branch counts?"* → **Connect to Born rule:** Amplitude-squared is the only stable "currency." |
  | **Broader implication**    | Probability loses meaning without uncertainty.                                      | *"If every outcome happens, what is a probability *of*? What does the Born rule actually weigh?"* → **Gesture to Deutsch-Wallace:** "Decision theory shows agents must weight by amplitude to avoid exploitation. But today, you *felt* it." |

  **Avoid Lecture:** End with an open question: *"In a multiverse without unique outcomes, is ‘probability’ the right word? What might we call it instead?"*  

  ---

  ### **Predictable Problems & Solutions**  
  - **Problem 1:** Students treat it as ordinary probability.  
    - **Solution:** Stress in rules: *"Every branch happens. After splitting, you will exist in all sub-branches."* Have Regret Auditor ask: *"In which branch are you *really*? Can you say you ‘won’ or ‘lost’ overall?"*  

  - **Problem 2:** Arithmetic overwhelms the concept.  
    - **Solution:** Use simple weights (0.5, 0.6, 0.4). Provide calculators. In debrief, focus on *why* 50 tokens on a 0.1-weight branch yield fewer points than on a 0.6-weight branch.  

  - **Unreproducible Aspect:** The **subjective uncertainty** of "which branch I’ll experience" is absent—all branches are real. You’ll need to clarify: *"Everett denies pre-measurement uncertainty. Probability arises from self-locating ignorance *after* branching."*  

  ---

  ### **Why This Works**  
  - The payoff scheme (`Tokens × Weight × 10`) forces players to *feel* the inefficiency of branch-counting when weights are low.  
  - Splitting destabilizes naive strategies, creating "aha!" moments when high-branch-count bets yield minimal points.  
  - The debrief links game pain points to the Born rule without invoking math, focusing on the **crisis of probability** in a multiverse.  

  The game compresses the decision-theoretic argument into an experiential lesson: Amplitude-squared isn’t arbitrary—it’s the only weight that can’t be gamed by splitting. Run it, and watch them confront the void where "probability" used to be.
