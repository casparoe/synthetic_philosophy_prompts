  - **Informant Prep**: Brief the informant (a student) on what to say in each round. In round 1: "If the card is red, then it is the ace of hearts." In round 2: "If the card is not the ace of spades, then it is red." The informant is reliable and knows the drawn card. They only say the conditional if it is true.

  ### 2. Market Rules (~250 words)
