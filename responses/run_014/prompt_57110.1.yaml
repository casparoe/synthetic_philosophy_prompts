answer: |-
  ### **The Kit**  
  A mini-deck of 12 cards: hearts (red) and spades (black), ace through six (6 hearts, 6 spades). One card is drawn face down.  
  **Props**:  
  - **H**: "Card is ace of hearts"  
  - **R**: "Card is red"  
  - **S**: "Card is ace of spades" (for Round 2)  
  **Compounds for testimony**:  
  - **Round 1**: Informant says, "If the card is red, then it is the ace of hearts" (R → H).  
  - **Round 2**: Informant says, "If the card is *not* the ace of spades, then it is red" (~S → R).  
  **Handout**: Single page listing deck composition, prop definitions, and scoring rule (explained in Market Rules).  
  **Point endowment**: Each student starts with 100 points (virtual currency).  
  **Informant prep**: Secretly brief one student before class. They know the drawn card and must truthfully state the conditional *only if it is true*. Emphasize reliability: "The informant is 100% accurate—no lies or mistakes."  

  ---

  ### **Market Rules**  
  Students report probabilities (as integers 0-100) for each prop at two stages: **before** and **after** testimony.  
  **Scoring**:  
  - Use the **quadratic scoring rule**: For reported probability \(p\) (as decimal), score = \(100 \times [1 - (\text{truth} - p)^2]\), where \(\text{truth} = 1\) (if prop true) or \(0\) (if false).  
  - **Example**: If you report 30% and the prop is true, score = \(100 \times [1 - (1 - 0.3)^2] = 100 \times [1 - 0.49] = 51\).  
  **Mechanics**:  
  1. **Before testimony**: Report probabilities for H, R (Round 1) or S, R (Round 2).  
  2. **After testimony**: Update probabilities for the same props.  
  3. **Payout**: Score each report separately. Total points = average of pre- and post-testimony scores across props.  
  **Anti-gaming**:  
  - Reports must be integers (no decimals).  
  - Scores penalize over/underconfidence (e.g., reporting 100% on a false prop gives 0).  
  - Reveal scores *after* both rounds to avoid hindsight bias.  

  ---

  ### **Timeline**  
  **0–5 min**: Distribute handouts. Explain deck, props, and market rules. Assign one student as informant (secretly).  
  **5–15 min**: **Round 1 pre-testimony**. Students report initial probabilities for H and R. Collect sheets.  
  **15–20 min**: **Round 1 testimony**. Informant states: "If the card is red, then it is the ace of hearts."  
  **20–30 min**: **Round 1 post-testimony**. Students update probabilities for H and R. Collect sheets.  
  **30–35 min**: **Resolution 1**. Reveal the card. Display all pre/post probabilities on the board (H and R).  
  **35–45 min**: **Round 2 pre-testimony**. Students report initial probabilities for S and R. Collect.  
  **45–50 min**: **Round 2 testimony**. Informant states: "If the card is not the ace of spades, then it is red."  
  **50–60 min**: **Round 2 post-testimony**. Update probabilities for S and R. Collect.  
  **60–65 min**: **Resolution 2**. Reveal the card. Display all pre/post probabilities (S and R).  
  **65–75 min**: **Debrief**. Show scoreboard, discuss patterns, and introduce Judy Benjamin problem.  

  ---

  ### **Where it Should Land**  
  **Key moment**: After Round 2, when students see the board:  
  - **Expected anomaly**: In Round 1, most double H’s probability (e.g., 8% → 50%) but barely change R (50% → 50%). In Round 2, S’s probability barely moves (e.g., 8% → 8–10%) despite testimony.  
  **Your role**: Point silently to Round 2’s S-column. Ask: "What did you learn about the ace of spades?"  
  **If no one notices**: Reveal the card and ask: "Did your update for S reflect that black non-ace-spades were ruled out? Why not?"  

  ---

  ### **The Policies, in Numbers**  

  | Policy             | Round 1: P(H) | P(R) | Round 2: P(S) | P(R) |
  |--------------------|---------------|------|---------------|------|
  | **Prior**          | 8.3%          | 50%  | 8.3%          | 50%  |
  | **(a) Conditionalize on testimony** | 14.3% | 14.3% | 14.3% | 85.7% |
  | **(b) Fix conditional credence** | 50% | 50% | 8.3% | 91.7% |
  | **(c) Fix antecedent credence** | 50% | 50% | 8.3% | 91.7% |

  **Explanation**:  
  - **(a)**: Treat testimony as a proposition (e.g., R → H ≡ ¬R ∨ H). Conditionalize by restricting to compatible worlds (7 cards in Round 1: 6 black + ace♥).  
  - **(b)**: Minimal change fixing P(H\|R) = 1 (Round 1) or P(R\|¬S) = 1 (Round 2). Keeps P(R) or P(¬S) intact (unchanged from prior).  
  - **Why (a) and (b) coincide in Round 1?** They don’t in this deck! (Original Judy Benjamin uses unequal partitions; here, policy (b) keeps P(R) fixed, but (a) lowers it.)  
  - **Why they diverge in Round 2?** Testimony ~S → R rules out black non-ace-spades (5 cards). (a) renormalizes (P(S)↑ to 14.3%), while (b)/(c) leave P(S) unchanged.  

  ---

  ### **Debrief**  
  1. **Map game beats to policies**:  
     - Round 1’s "H-doubling" matches (b)/(c): Students fixed P(R) and set P(H\|R) = 1.  
     - Round 2’s "S-stagnation" matches (b)/(c): Students fixed P(¬S) and set P(R\|¬S) = 1.  
  2. **Trade-offs**:  
     - (a) Respects logic but lowers P(R) counterintuitively in Round 1 (why distrust the antecedent?).  
     - (b)/(c) Feel intuitive but ignore that testimony can alter the antecedent’s probability (e.g., Round 2 testimony eliminates black non-ace-spades, so P(S) *should* rise).  
  3. **Real-world examples**:  
     - Doctor: "If it’s a virus, the test is positive." Does this make viruses *less* likely? (Policy (a) says yes.)  
     - Reviewer: "If the method works, the result replicates." Does this protect the method from doubt? (Policy (b)/(c) says yes.)  
     - Intelligence: "If the threat is real, the signal is clear." Should we downweight the threat?  
  4. **Reveal**: "This is van Fraassen’s Judy Benjamin problem: updating on conditionals isn’t solved by Bayes alone."  

  ---

  ### **Wreckage Report**  
  **Predictable issues**:  
  - **Noisy updates**: Math-averse students guess wildly (e.g., set H = 99% in Round 1).  
  - **Policy (b) wins points**: If the card is red, policy (b)’s 50% for H scores higher than (a)’s 14.3%. *When smugly noted*: "Short-term luck! Proper scoring rules reward *calibration*: (a) wins long-run, but one draw is noisy. Check scores if the card were black."  
  - **Informant error**: If the card falsifies the conditional (e.g., red non-ace-heart in Round 1), the informant erred. *Fix*: Restate reliability; redo the round if needed.  
  - **Time crunch**: Scoring takes 5+ minutes. *Fix*: Compute scores for 2–3 volunteers live; share full data next class.  

  ---

  ### **What the Market Can’t Show**  
  The market treats conditionals as *true propositions* (e.g., R → H is a fact). But Judy Benjamin’s core is updating on *conditional probabilities* (e.g., "Given red, P(H) = 1"), which isn’t a proposition. Here, testimony is a material conditional, not a conditional probability. You must explain: "In real life, we often get *uncertain* conditionals (e.g., ‘If it’s virus, test is *likely* positive’), which breaks the analogy."  

  ---

  ### **Deck Limitations vs. Original Judy Benjamin**  
  - **Issue 1**: Judy Benjamin uses *unequal partitions* (e.g., Red/Blue areas of different sizes). Our uniform deck (6♥, 6♠) obscures this; policies (a) and (b) diverge less starkly.  
  - **Issue 2**: Original problem updates on *P(H\|R) = 0.75* (not 1.0), making minimal-change updates more defensible. Our 0/1 case simplifies arithmetic but oversimplifies the philosophy.  
  - **Fix**: During debrief, contrast: "Judy Benjamin had uneven priors; here, symmetry hides some nuances."
