  - **Scoring Rule**: We use a quadratic scoring rule. For a probability report p and outcome I (1 if true, 0 if false), the score is: 
    - If you are a buyer: 100 * [I - p^2 - (1-I)(1-p)^2] (but we adjust for the trade)
