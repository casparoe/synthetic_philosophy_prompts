    Score = 100 * [1 - (I - p)^2] 
    That is, if they report p and the outcome is I, they get 100*(1 - (I-p)^2). This is strictly proper.
  - **Trading Mechanic**: Instead of a full market, we have each student report their probability (as a percentage) for each prop. They do this before and after the testimony. We then compute their score for each prop using the quadratic rule. Their total points are the sum over all props. The scoring rule is applied twice: once for the pre-testimony report and once for the post-testimony report. The final score for a prop is the average of the two? Actually, we want to encourage honest reporting at each stage. So we score each report separately and add them. But note: the outcome is only revealed at the end of the round (so for each round, we have two reports: before and after, but the outcome is the same for both). We score each report independently.
