prompt: |-
  I'm putting together a study guide for a seminar on the evolution of cooperation, and I keep getting confused by the units of selection debate — the whole gene vs. individual vs. group thing. I've been reading a lot of pop-science summaries of it and they all seem to conflate a few distinct technical questions, so I want to make a decision tree that takes a student from "I accept that natural selection shapes cooperation and altruism" all the way to a named position, so they can figure out where they actually stand without just memorizing labels.

  The tree should branch on the real technical distinctions, not just the surface-level "genes vs. groups" thing. In particular, I want it to seperate out: (1) the "units" vs. "levels" question (i.e., whether the gene or the group is the *unit* of selection — the thing that is selected — as opposed to just a *level* at which selection acts, one of several alongside the individual), (2) whether inclusive fitness and multi-level selection are taken to be equivalent (giving the same predictions in all cases) or genuinely in conflict (able to give different predictions), and (3) whether the "selfish gene" is a metaphor or a literal claim about genes being selfish replicators. Each branch node should be phrased as a question a student could answer without already knowing which camp it leads to — no "do you think genes are the units of selection?" questions, because that just asks for the label.

  Use concrete cases to force the splits where possible: sterile worker ants (altruism in non-reproductive kin), vampire bats sharing blood meals (reciprocal altruism among non-kin), myxobacteria forming fruiting bodies (cooperation in microorganisms), and the "greenbebe" effect (where an altruism allele recognizes and helps carriers of the same allele, even if they're not kin). Each leaf should carry the name of the position (or "unnamed" if nobody really defends it) and one sentence on its most awkward commitment. Flag any pair of leaves the tree can't really separate, and note any unoccupied combinations of answers and why nobody's there (incoherent, unattractive, or just unexplored). I'm aiming for maybe 8–12 leaves total. Think very carefully before answering, and respond in the style of someone who has actually worked through the primary literature on this (Hamilton, Dawkins, Wilson & Sober, Trivers) rather than a pop-science summary.
reasoning: |-
  Okay, the user is putting together a study guide on the evolution of cooperation and is confused by the units of selection debate. They want a decision tree that clarifies the technical distinctions without relying on memorizing labels. The key is to separate three main issues: units vs. levels of selection, equivalence of inclusive fitness and multi-level selection, and whether the selfish gene is literal or metaphorical. They also want concrete examples like sterile ants, vampire bats, myxobacteria, and the greenbeard effect to force clear splits.

  First, I need to ensure the tree branches on genuine technical distinctions. The initial split should be about what's actually being selected—replicators vs. interactors. Then, the next level should address the equivalence of inclusive fitness and multi-level selection, using examples to illustrate conflicts. Finally, the selfish gene metaphor needs to be addressed as literal or not.

  The user mentioned avoiding questions that presuppose the answer, like "are genes the unit?" Instead, questions should be framed around scenarios. For example, in the sterile worker ant case, asking whether the gene for sterility is selected because it helps relatives or because the trait benefits the group. That distinguishes gene-centered from group selection views.

  Inclusive fitness vs. MLS equivalence is tricky. Some theorists like Hamilton and Grafen argue they're mathematically the same, while others like Wilson and Sober see MLS as a distinct framework. Using the greenbeard effect here can show if altruism without kinship fits both models or if one handles it better. If a student thinks greenbeards are a problem for inclusive fitness, that might lead them to see MLS as different.

  The selfish gene metaphor split is about whether genes are the only replicators or if higher entities can be. Dawkins' literal view means genes are the unit, while others see it as a useful metaphor. The myxobacteria example could test if cooperation is explained by gene replication or group advantage.

  The user wants 8-12 leaves. Possible positions include Dawkins' gene selectionism, Williams' reductionism, classic group selection, modern MLS, and others. Unoccupied branches might be views that conflate units and levels or ignore replicator dynamics. For example, someone thinking genes are replicators but groups can be units might be incoherent.

  Also, the user wants to flag any pairs the tree can't separate and note why some combinations are unoccupied. For instance, if someone thinks genes are replicators and inclusive fitness isn't equivalent to MLS, but sees selfish gene as metaphorical—that might not be a coherent position because Dawkins ties the metaphor to gene-centric selection.

  Need to ensure each leaf has a clear position and its awkward commitment, like group selection struggling with within-group selection or gene-centered views explaining group traits. Concrete examples must be integrated at each branch to guide students without prior knowledge. The goal is clarity through real cases, avoiding technical jargon where possible.
answer: |-
  Here's a decision tree grounded in primary literature distinctions and concrete cases, designed to force technical splits. It branches through 10 distinct leaves, flags indistinguishable pairs, and notes unoccupied/unattractive nodes. Key splits leverage the cases to avoid presupposing labels.

  **Decision Tree: Navigating the Evolution of Cooperation & Units of Selection**

  **Start:** You accept natural selection shapes cooperation/altruism.

  **Branch 1:** Looking at **sterile worker ants** (non-reproductive kin altruism), is the *focal explanation* for the evolution of sterility primarily:  
  *   **A. The sterile allele persists because copies of it in the queen (and future queens) benefit from the help provided by sterile workers.**  
  *   **B. Colonies with sterile workers outcompete/reproduce more than colonies without them, even if within-colony selection slightly favors selfish reproduction.**  
  *(This splits "replicator" vs. "vehicle/interactor" focus using Hamilton's core case, avoiding "unit/level" terminology)*

  **Branch A (Sterility gene explained by relatedness/copies):**  
  **Branch A1:** Considering **vampire bats sharing blood with non-kin** (reciprocal altruism) and **myxobacteria fruiting bodies** (microbe cooperation), are predictions about when cooperation evolves using **Hamilton's Rule (inclusive fitness)** *always mathematically equivalent* to partitioning selection into within-group vs. between-group components (**Multi-Level Selection - MLS**)?  
  *   **A1a. Yes, they are formally equivalent frameworks describing the same reality; choosing one is pragmatic.** *(Hamilton '75, Grafen '84, Queller '92)*  
  *   **A1b. No, they are distinct approaches that can lead to different predictions or causal emphases, especially in complex scenarios like greenbeards or cultural evolution.** *(Wilson & Sober '94, contextual analysis proponents)*  

  **Branch A1a (Equivalence Accepted):**  
  **Branch A1a1:** Is "the selfish gene" primarily:  
  *   **A1a1a. A literal claim: Genes (or replicators) are the fundamental *units* of selection; phenotypes (individuals, groups) are temporary *vehicles* built by replicators to propagate themselves.** *(Dawkins '76, '82 - Gene Selectionism/Replicator View)*  
      *   **Leaf: Dawkinsian Gene Selectionism.**  
          *   *Awkward Commitment:* Explaining complex group-level adaptations solely through gene replication dynamics can feel counterintuitive and risks downplaying the emergent properties of vehicles.
  *   **A1a1b. A powerful metaphor emphasizing the gene's-eye view of evolution, but not denying that selection acts *on* phenotypes (individuals or groups) to change gene frequencies.** *(Many modern proponents of Inclusive Fitness/MLS equivalence)*  
      *   **Leaf: Pragmatic Inclusive Fitness / MLS Equivalence.**  
          *   *Awkward Commitment:* Must concede that "group selection" (as between-group component in MLS) is a valid perspective, potentially legitimizing views they oppose.

  **Branch A1b (Equivalence Rejected):**  
  **Branch A1b1:** Is "the selfish gene":  
  *   **A1b1a. Literally true: Only genes (replicators) are selected; groups are merely environmental contexts.** *(Classic Williams '66 Reductionism)*  
      *   **Leaf: Williamsian Gene-Centered Reductionism.**  
          *   *Awkward Commitment:* Must explain group-level traits (e.g., complex insect societies, human ultrasociality) *only* as summed individual adaptations, potentially straining plausibility for strong emergent properties.
  *   **A1b1b. A useful heuristic, but the fundamental unit of selection is the individual organism; groups are important selective *environments* but not units.** *(Standard Neo-Darwinian Individualism; common textbook view)*  
      *   **Leaf: Standard Neo-Darwinian Individualism.**  
          *   *Awkward Commitment:* Struggles to cleanly explain the evolution of *obligate* sterility (like ants) without implicitly invoking gene-centric logic via kin selection.

  **Branch B (Sterility explained by colony success):**  
  **Branch B1:** When selection acts on the group (e.g., ant colony), is the group itself a **replicator** (a cohesive entity with heritable variation in fitness)?  
  *   **B1a. Yes, groups can be Darwinian individuals ("superorganisms") and thus units of selection in their own right, analogous to organisms.** *(Classic Wynne-Edwards '62 Group Selection; Modern MLS-1/Sober & Wilson '98 "Trait Group" view for some adaptations)*  
  *   **B1b. No, groups are interactors/vehicles, not replicators; selection acts *on* groups but the *unit* that is selected (replicated with variation) is still the gene.** *(MLS-2 View - Focus on group *effect* on gene frequency change)*  

  **Branch B1a (Group as Replicator/Superorganism):**  
  **Branch B1a1:** How does this view handle the **"greenbeard" effect** (altruism allele helps non-kin carriers)? Is it:  
  *   **B1a1a. Primarily explained as a form of group selection (the "greenbeard group" is favored), or a special case relying on genetic linkage/assortment.** *(Some Classic Group Selection interpretations)*  
      *   **Leaf: Classic Group Selection (Superorganism View).**  
          *   *Awkward Commitment:* Difficulty explaining altruism among non-assorting, non-superorganismal groups (e.g., reciprocal altruism in loose networks) without resorting to individual/gene-level logic. Vulnerable to "subversion from within" (selfish mutants).
  *   **B1a1b. Best explained at the gene level (the selfish greenbeard allele), posing a challenge to group-level explanations unless the group is defined *by* the allele.** *(Aligned with Gene-Centric views)*  
      *   **Leaf: Modern Superorganism MLS (e.g., some Insect Sociobiology).**  
          *   *Awkward Commitment:* Must define very specific criteria for true "superorganism" status (high relatedness, obligate cooperation, functional integration), limiting applicability. Relies heavily on kin selection mechanisms *within* the group.

  **Branch B1b (Group as Vehicle, Gene as Replicator):**  
  **Branch B1b1:** How strong must between-group selection be relative to within-group selection for an altruistic allele (like sterility) to spread? Is it:  
  *   **B1b1a. Very strong, requiring mechanisms like extreme inbreeding or population structure to overcome the inherent vulnerability to selfish cheaters within groups.** *(Skeptical view of group selection's potency - aligns with early critiques)*  
      *   **Leaf: Skeptical MLS-2 (Group as Weak Interactor).**  
          *   *Awkward Commitment:* Must accept that genuine group-level adaptations (beyond simple summed individual traits) are rare or require very special conditions, potentially underestimating their role.
  *   **B1b1b. Potentially quite significant under plausible conditions (e.g., cultural group selection, frequent fission-fusion, punishment), not just extreme edge cases.** *(Modern Strong Proponents of MLS-2 - e.g., D.S. Wilson, cultural evolutionists)*  
      *   **Leaf: Strong MLS-2 (Group as Potent Interactor).**  
          *   *Awkward Commitment:* Must explain how group-beneficial but individually costly traits *reliably* avoid being undermined by within-group selection without constant external scaffolding (e.g., institutions, policing).

  **Branch A1b (Equivalence Rejected) - Continued:**  
  **Branch A1b1:** **Branch B1b (Group as Vehicle, Gene as Replicator)** leads to two leaves already covered: **Skeptical MLS-2** and **Strong MLS-2**. *(The tree converges here as the core distinction is whether groups are interactors (B1b) or replicators (B1a), and the strength/potency question (B1b1) applies regardless of equivalence views)*.

  **Indistinguishable Leaves (or nearly so):**
  1.  **Pragmatic Inclusive Fitness / MLS Equivalence (A1a1b)** and **Strong MLS-2 (B1b1b)** are *extremely close*. Both accept MLS partitioning as valid and see group-level selection as potentially powerful. The key difference is often terminological/nuanced: the former emphasizes the gene-level accounting via IF, the latter emphasizes the group-level process via MLS, while agreeing on the math and predictions. A student landing here likely aligns with modern synthesis views (e.g., West, Gardner, Lehmann).

  **Unoccupied/Incoherent/Unattractive Nodes:**
  *   **Believing groups are true replicators (B1a) AND accepting IF/MLS equivalence (A1a):** Unattractive/Incoherent. If groups are fundamental replicators like genes, then MLS cannot be *equivalent* to a gene-centric (IF) view; they represent fundamentally different units. True superorganism views reject equivalence.
  *   **Believing groups are true replicators (B1a) AND seeing "selfish gene" as literal (A1a1a):** Incoherent. These are contradictory claims about the fundamental unit of selection (gene vs. group-as-replicator).
  *   **Believing IF and MLS are NOT equivalent (A1b) AND groups are NOT interactors/vehicles at all:** Unexplored/Unattractive. If groups aren't even interactors, then rejecting equivalence becomes trivial (since MLS wouldn't be a valid framework). Most who reject equivalence do so *because* they think MLS captures something real about group-level interactions that IF obscures.
  *   **Strong belief in gene-as-sole-replicator AND strong belief in group-as-replicator:** Incoherent. This is a direct contradiction on the fundamental unit.

  **Key Insights from the Tree:**
  *   The "units vs. levels" debate is primarily split at **Branch 1 (A vs. B)** and **Branch B1 (B1a vs. B1b)** – is the *focal explanation* (and fundamental unit) the replicating gene/copy or the reproducing group?
  *   The "equivalence" debate is a major split among *gene-centered* views (**Branch A1**).
  *   The "selfish gene" literalness is primarily a split *within* gene-centered views accepting equivalence (**Branch A1a1**).
  *   The potency of group selection is a key split *within* the "group-as-vehicle" view (**Branch B1b1**).
  *   Concrete cases force the distinctions: Sterile Ants (Replicator/Vehicle), Vampire Bats/Myxobacteria (Equivalence/Mechanism), Greenbeard (Level/Unit Challenge).

  This tree emphasizes that the core disagreements are about *what is being selected (unit)* and *how to model/partition the causal processes (equivalence)*, using real biological puzzles to guide students away from superficial labels. The "awkward commitments" highlight the conceptual price of each position.
