prompt: |-
  I'm in my third year of graduate study and for the past term I've been sitting in on a reading group run by a colleague I'll call R., on future contingents from Aristotle's sea battle onward. R. is not much interested in which label from the literature you attach to a view; she asks for verdicts on cases and then reads the view off them. I have been keeping a list of her verdicts because next week I have to present a case she hasn't seen and predict her response, and I would rather not be wrong in front of the whole group. Here is the list. A fair coin is to be flipped in an hour and nobody has any special information: R. says that "it will land heads" is not true, and that "it will land tails" is not true either, and she is emphatic that this is not an epistemic point, not a claim that one of them is true while we fail to know which. But "it will land either heads or tails," with the disjunction inside the scope of the "will," she calls true, and obviously so; she says anyone who denies it has been misled by a notation. The same disjunction with the "will" distributed — "either it will land heads or it will land tails" — she refuses to call true, on the ground that joining two claims that are neither true nor false with an "or" does not manufacture a truth. A claim that an injection of a fast-acting toxin will kill the patient within the hour, where the objective chance is as high as you like short of certainty: strictly speaking not true, she says, the same strict verdict as for the coin; and when a student pressed her on whether such a claim is then *nearer* the truth than the coin claim, she replied that this was not a question her account was obliged to answer.

  Four more. A race was run yesterday and we are about to watch the recording: "the runner in lane four will be ahead at the two-hundred-metre mark" — true, she says, though the "will" is doing no real work there, because there is no fork to speak of. A colleague has secretly already signed an acceptance for a post in Vienna, though nobody in the group knows it: the claim, made today, that she will be at the Vienna conference in March is true; the very same claim made three weeks ago, before she signed, was neither true nor false; and R. insists the difference has nothing to do with what anyone knew at either time and everything to do with whether the world had narrowed. On Thursday she said "it will rain on Saturday"; it did not; asked now, she says flatly that what she said was false and that she was wrong, but asked whether it was true on Thursday that it would rain on Saturday she says no, adding that she is wrong now and that on Thursday there was nothing there yet to be wrong about. And "it might land heads," said before the flip, she calls true — telling a student who objected that this contradicts her verdict on "it will land heads" that his inference was valid but his premise, that "might" is simply the negation of "will," was not something she had granted him.

  The case I have to present is this. On Monday two members of the group, Nadia and Tomas, disagree about which city a hiring committee will choose for a post it decides on Friday: Nadia says "the committee will choose Oslo," Tomas says "the committee will choose Lisbon," and they take a bet. A third member, Ines, hearing both, says on Monday: "neither of you is saying anything true." On Friday the committee chooses Oslo. R. will be asked whether Ines's remark was true when she made it; whether Nadia was right on Monday or is only correctly called right now; and — the part I expect to be pressed on — whether Ines's remark and R.'s own account of the coin amount to the same claim, since Ines's remark looks like exactly what R. says about the two coin claims. I know the standard menu well enough to be confused rather than helped by it: Aristotle's gap, the Ockhamist's determinate truth values, supervaluation over branching histories, the Peircean reading of "will" as "in every future," assessment-sensitive truth, and a Łukasiewicz-style view on which unsettled claims have intermediate degrees of truth. My own guess is that R. is some kind of supervaluationist, but her verdict on the distributed disjunction seems to rule that out, and I cannot see what she is instead. So: which rule or rules are genuinely consistent with everything on my list; what does each predict about Ines, about Nadia, and about whether Ines and R. are saying the same thing; which single verdict do you think she will actually give on the Monday case, and why should I prefer that reading to the others; and what further case, one she has not already ruled on, would separate whatever candidates you are left with? Please be explicit about how confident you are in each of your main claims and single out the point in your answer you are least sure of; and if you think one of the verdicts I have reported simply cannot be squared with the others, say which, what you suspect I have misreported or over-read, and how much of the rest of the list survives that correction.
reasoning: |-
  Okay, let me try to work through this step by step. The user is in a graduate reading group on future contingents led by someone named R., and they've collected R.'s verdicts on various cases. Now they need to present a new case and predict R.'s response. The key is to synthesize R.'s position from the given verdicts and apply it to the new scenario.

  First, I need to understand R.'s core principles. From the coin flip case: 

  - "It will land heads" is not true
  - "It will land tails" is not true
  - But "it will land either heads or tails" is true (with disjunction inside "will")
  - Whereas "either it will land heads or it will land tails" (distributed "will") is not true

  This is crucial. R. distinguishes between the future disjunction being true while each disjunct lacks truth value. That immediately rules out Ockhamism (which would assign truth values to future contingents) and Peirceanism (which would make "it will land heads" false if it doesn't happen). 

  The toxin case shows R. applies the same "not true" verdict even to high-probability events, emphasizing it's not epistemic. The race recording case confirms that past-determined futures get truth values ("will be ahead" is true). The Vienna conference case shows truth-value depends on historical fixation (true after signing, indeterminate before). The Thursday rain prediction being called false after the fact but not true beforehand suggests truth-value is settled only at the time of occurrence. And "might" statements being true for unsettled futures indicates a non-bivalent logic.

  Putting this together, R. seems to be a thin red line supervaluationist with truth requiring inevitability. But wait—her rejection of the distributed disjunction ("either it will A or it will B") as untrue conflicts with standard supervaluationism, where that disjunction would be true even if neither disjunct is. That's a major puzzle. 

  Perhaps R. adopts a non-standard connective treatment like Łukasiewicz, but her "might" verdict doesn't fit three-valued logic (where "might P" wouldn't be true if P is indeterminate). Alternatively, she might be a growing blocker who relativizes truth to contexts, but her insistence on retrospective falsity ("I was wrong") complicates that. 

  For the new case: On Monday, neither "will choose Oslo" nor "will choose Lisbon" is true (like the coin), so Ines saying "neither is saying anything true" should be correct per R.'s account. After Oslo is chosen, Nadia's claim becomes retroactively true. The comparison to R.'s coin claim holds: Ines makes the same meta-claim R. would. 

  But the distributed disjunction problem resurfaces here. If R. rejects "either it will be Oslo or it will be Lisbon" as untrue, while accepting "it will be Oslo or Lisbon", Ines's statement parallels R.'s own position. Yet standard supervaluationism would call the distributed disjunction true—so R. must be modifying it. 

  I suspect R. endorses a view where future contingents lack truth value, disjunctions with "will" scoping over them are true by inevitability, but disjunctions of future-tensed claims are only true if one disjunct is true (which neither is). This resembles a non-supervaluational non-bivalent logic. 

  For the user's presentation: Predict that Ines was right on Monday (her claim was true), Nadia wasn't "right" on Monday but is correct to say now she was right, and Ines/R. make equivalent claims. The tension point remains the disjunction treatment—propose a test case: "Either the coin will land heads or it won't." If R. accepts this as true, it distinguishes her from Łukasiewicz; if not, it confirms her non-standard connective logic. 

  Least confident point: Whether R. would accept "Nadia was right on Monday" as true now. Given her rain case ("I was wrong"), she likely says no—truth is always relativized to utterance time. 

  Overall, R.'s view is a hybrid: truth requires historical inevitability, unsettled futures are indeterminate, but with distinct semantics for disjunctions that breaks from standard supervaluationism. The user should stress this nuance when presenting.
answer: |-
  Based on R.'s consistent verdicts, her view is a nuanced form of **Non-Bivalent Supervaluationism with a Thin Red Line (TRL) and context-sensitive truth assessment**, but crucially modified to reject the standard supervaluationist treatment of disjunction. Here's the breakdown:

  ---

  ### **Core Principles Consistent with R.'s Verdicts**
  1. **Non-Bivalence for Unsettled Futures**: Future contingents lack truth value until the event is historically inevitable ("world narrowed").  
     - *Evidence*: Coin flip, toxin, unsigned Vienna offer, Thursday's rain prediction (pre-rain).  
  2. **Thin Red Line (TRL)**: One actual future history exists, but truth about the future depends on *when* the claim is assessed.  
     - *Evidence*: Vienna case (truth changes after signing), Thursday's rain (retroactively false).  
  3. **Truth Requires Inevitability**: A future-tensed claim "will φ" is true *only if* φ is settled/inevitable at the time of utterance.  
     - *Evidence*: Race recording (settled past), Vienna (post-signing).  
  4. **Scope Sensitivity**: "Will(φ ∨ ψ)" can be true even if "will φ" and "will ψ" are indeterminate, but "will φ ∨ will ψ" is not true.  
     - *Evidence*: Undistributed vs. distributed disjunction in coin case.  
  5. **"Might" as Non-Redundant**: "Might φ" is true iff φ is not yet ruled out (compatible with unsettledness).  
     - *Evidence*: "Might land heads" is true pre-flip.  
  6. **Retrospective Truth Assessment**: We assess past predictions from *our current* knowledge of the TRL.  
     - *Evidence*: Thursday's rain claim is "false now" but "not true then."  

  ---

  ### **Predictions for Your Case (Monday Hiring Committee)**
  1. **Ines's Monday remark ("Neither of you is saying anything true")**:  
     - **TRUE when uttered**.  
     - *Why*: On Monday, "will choose Oslo" (Nadia) and "will choose Lisbon" (Tomas) are both indeterminate (like the coin claims). Ines correctly states neither has a truth value.  

  2. **Nadia's correctness**:  
     - **Not "right" on Monday** (her claim lacked truth value then).  
     - **Correctly called "right" now** (retrospectively, from Friday's vantage point).  
     - *Why*: Mirrors R.'s Thursday rain verdict: Nadia "was wrong" to assert a truth-value-less claim, but her assertion aligns with the actual outcome.  

  3. **Are Ines and R. saying the same thing?**  
     - **YES**, for the coin and hiring cases *in context*.  
     - *Why*: Both deny truth values for future contingents. Ines's "neither is true" parallels R.'s "neither 'will heads' nor 'will tails' is true."  

  ---

  ### **Why Supervaluationism (Modified) Fits Best**
  - **Standard Supervaluationism** is ruled out because it treats "will φ ∨ will ψ" as true (supertrue across histories) even if neither disjunct is true. R. explicitly *rejects* this (distributed disjunction in coin case).  
  - **R.'s View**: She adopts a **non-bivalent TRL supervaluationism** where:  
    - Histories branch until settled.  
    - "Will φ" is true iff φ occurs on *all* histories (inevitable) — but since only one history is actual (TRL), inevitability = fixation in actual history.  
    - **Key modification**: Disjunction "will(φ ∨ ψ)" is true iff φ∨ψ is inevitable (as in "will land heads-or-tails"). But "will φ ∨ will ψ" requires *one disjunct to be true* (which neither is, pre-settlement).  
  - **Why not Peircean/Ockhamist/Łukasiewicz?**  
    - Peircean: "Will φ" means "inevitably φ," making "will heads" *false* pre-flip (contradicts R.'s "not true").  
    - Ockhamist: Assigns truth values to contingents (violates R.'s coin/toxin verdicts).  
    - Łukasiewicz: "Might" would be indeterminate if "will" is (contradicts "might land heads" being true).  
    - Assessment-relativism: Fits R.'s retrospective judgments but doesn't explain her disjunction asymmetry.  

  **Confidence**: High (95%) on the core framework. The disjunction asymmetry is the linchpin.  

  ---

  ### **The Tension: Distributed Disjunction**
  - **The Problem**: R.'s rejection of "either it will heads or it will tails" as untrue is the *only* verdict conflicting with standard supervaluationism.  
  - **My Suspicion**: You haven't misreported; R. likely rejects the standard supervaluational consequence for disjunction. She treats "will φ ∨ will ψ" as requiring a true disjunct (like a non-supervaluational non-bivalent logic), while "will(φ ∨ ψ)" is evaluated for inevitability.  
  - **Surviving List**: All other verdicts hold if this disjunction asymmetry is accepted as a primitive feature of her view.  

  ---

  ### **Single Verdict for Your Case**
  - R. will say:  
    - **Ines was correct on Monday** (her remark was true).  
    - **Nadia was not "right" on Monday** (no truth value then) but **is correct to say she was right now** (from Friday's perspective).  
    - **Ines and R. are making equivalent claims** about future contingents.  

  **Why?** Directly analogous to her coin verdicts and Thursday rain case.  

  ---

  ### **Test Case to Distinguish Candidates**
  **Propose this to R.**:  
  > "A fair coin will be flipped. Is the claim 'Either the coin will land heads, or it will not land heads' true *before the flip*?"  

  - **Standard Supervaluationism**: YES (supertrue).  
  - **R.'s View (predicted)**: NO. She rejects manufacturing truth from indeterminate disjuncts.  
  - **Łukasiewicz Logic**: NO (indeterminate if "will land heads" is indeterminate).  
  - **Why it separates**: Confirms whether R. rejects all truth-functional tautologies for unsettled futures (Łukasiewicz-like) or makes an exception for "will(φ ∨ ¬φ)" (as she did for "will land heads-or-tails").  

  **Least Confident Point**: Whether R. would accept "will(φ ∨ ¬φ)" as always true (I think she would, per "will land heads-or-tails," but her distributed disjunction rejection makes this tense-specific). Confidence: 80%.  

  ---

  ### **Recommendation for Your Presentation**
  1. **Frame R.'s view** as:  
     - Truth requires historical inevitability at utterance time.  
     - Unsettled claims lack truth value (non-bivalence).  
     - "Will" scopes differentially over logical operators.  
  2. **Predict** the above verdicts for Ines/Nadia.  
  3. **Defend equivalence** of Ines and R.'s claims: Both deny truth values for unsettled future contingents.  
  4. **Use the test case** to probe the disjunction asymmetry if challenged.  

  R.'s view is internally consistent if you accept her treatment of disjunction as a semantic stipulation. Her position is a hybrid: supervaluationist TRL metaphysics with a non-classical connective logic for future tensed statements.
