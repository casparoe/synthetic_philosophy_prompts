answer: |-
  Here’s a ruthlessly prioritized roadmap for your semester project, designed to cut through the literature maze and target high-leverage, tractable questions. I’ll defend why these choices dominate the alternatives based on **upstream foundations**, **tractability**, and **avoiding dead ends**.

  ### **The Core Ranking: 2 Questions + 1 Wildcard**
  1.  **Question 1: Is "Avoiding Guaranteed Loss" the *Only* Coherent Diachronic Requirement? (Gustafsson's Challenge)**
      *   **Why it's #1 (Upstream & Foundational):** Every money pump argument implicitly assumes that being *exploitable* (susceptible to a pump) entails *irrationality*. Gustafsson (e.g., "Money Pumps, Diachronicity, and the Acyclicity of 'Better Than'") fundamentally challenges this. He argues exploitability *alone* doesn't imply irrationality; what matters is avoiding *guaranteed* (sure) loss *at the time of choice*. This reframes the entire debate.
          *   **Why it's Upstream:** If Gustafsson is right, the classic "you *will* be pumped" argument loses force unless the agent *knowingly* walks into a guaranteed loss *at the start*. This directly impacts arguments for transitivity, completeness, independence, and even resolute/sophisticated choice (which are *responses* to exploitability). It asks: "What does a money pump *actually prove* about rationality?" Everything else depends on the answer.
          *   **Tractability:** Perfect for logic. Formalize the difference between:
              *   *Potential Exploitability:* A sequence of choices *exists* that would pump money from the agent if they followed their preferences naively.
              *   *Guaranteed Loss (Gustafsson):* At the initial choice node, the agent faces a *dominated* option – choosing it *now* guarantees a worse outcome than some alternative *now*, regardless of future choices/predictions.
              *   Analyze classic pumps (transitivity, incompleteness) through this lens. Does the pump *only* work if the initial choice involves a guaranteed loss? If not, is that initial choice irrational *on its own terms*? This requires careful modeling of decision trees and dominance relations, not advanced econ.
      *   **Why Over Alternatives:** Debating "exploitability = irrationality" directly is often circular. Gustafsson provides a concrete, formalizable criterion (*guaranteed loss at choice*) to test the *foundation* of all pump arguments. Resolute/Sophisticated choice are downstream *solutions*; this questions the *problem* they solve.

  2.  **Question 2: Can Diachronic Rationality Survive *Genuinely* Changing Preferences (Not Just Temptation)?**
      *   **Why it's #2 (High Impact & Underexplored):** Most literature assumes stable core preferences; "changing preferences" often means temptation (e.g., hyperbolic discounting) where the agent *regrets* their earlier shift. But what if preferences change *fundamentally* (e.g., values shift, new information radically alters desires)? Can money pump arguments apply here? Is it irrational for Past-You to enable a pump that benefits Future-You-with-different-values?
          *   **Why it's Upstream:** This challenges the *very identity of the agent* over time. If Future-You isn't "You" in the relevant sense, pumping between Past-You and Future-You might not be irrational *for the diachronic agent* – it might just be a transfer between different entities. This impacts the scope of diachronic rationality itself. It forces a confrontation with personal identity/philosophy of mind.
          *   **Tractability:** Leverage logic and decision trees. Model an agent with explicit, time-indexed preference relations (P_t). Define what "genuine change" means (e.g., no stable overarching utility function, not resolvable by state-dependent utility). Construct pump scenarios. The key task is formalizing when a pump constitutes a "loss *for the diachronic person*" vs. a "transfer *between temporal stages*." Minimal econ needed; focus on relations and temporal logic.
      *   **Why Over Alternatives:** Questions about self-prediction or one-shot vs. repeated are often secondary (e.g., self-prediction might be needed *if* preferences are stable but the agent doesn't know it, but becomes moot if preferences genuinely change). The changing pref question is more fundamental and philosophically richer than refining completeness/independence arguments.

  3.  **Wildcard Question: Is Resolute Choice Logically Coherent Without a *Pre-Commitment Device*? (The McClennen Trap)**
      *   **Why it's the Wildcard (High Stakes, Central, but Potential Dead End):** McClennen's resolute choice (planning to stick to a plan despite later temptations) is the most philosophically interesting escape hatch. But *how* does the resolute agent actually bind themselves *at the later choice node*? If there's no external commitment device, what force does the resolution have *when the tempting choice is available*? This risks collapsing into either sophisticated choice (choosing *now* knowing future temptations) or inconsistency.
          *   **Why it's Important:** If resoluteness is incoherent without external commitment, sophisticated choice becomes the *only* coherent dynamic strategy within standard models, drastically narrowing the options for escaping pumps. If resoluteness *is* coherent, it's a powerful counter to many pumps. This is central to the entire debate.
          *   **Tractability:** Model it as a game against your future self. Use backward induction logic. Can you formalize a "resolution" as a distinct state/mode of agency? Does it require a different conception of preference or intention at T2? This is logic-heavy (game theory, modal logic for intentions).
      *   **Why Wildcard & Potential Dead End:** This debate has raged for decades (McClennen vs. McClennen!). It *might* be intractable without venturing deep into philosophy of action/intention. It also *depends* on Q1: If avoiding guaranteed loss is key, resoluteness might be less necessary. **Only pick this if Q1/Q2 lead you here naturally or you have a specific novel formalization idea.** Otherwise, focus on Q1/Q2.

  ### **Justification for Deprioritizing Other Topics**
  *   **Transitivity/Completeness/Independence Pumps:** Important, but well-trodden ground. Your contribution is more likely to be incremental unless you link it directly to Q1 (Guaranteed Loss) or Q2 (Changing Prefs).
  *   **Sophisticated Choice / Backward Induction:** Often presented as the "standard" solution. Important to understand, but less novel ground to explore unless contrasting sharply with resoluteness (Wildcard) or applying it to changing prefs (Q2).
  *   **Self-Prediction:** Frequently a red herring. If preferences are stable, sophisticated choice often handles prediction implicitly. If preferences change (Q2), prediction becomes ambiguous. Not truly upstream.
  *   **One-Shot vs. Repeated:** Important nuance, but often secondary to the core structure of the pump argument defined by Q1. Can be incorporated into analyses of Q1/Q2.
  *   **Acyclicity as the Only Requirement:** This debate largely *hinges* on Q1 (Guaranteed Loss). If Gustafsson is right, acyclicity might be sufficient. If the classic view holds, transitivity might be needed. Focus on Q1 resolves this.
  *   **"Exploitability = Irrationality?" Distraction?** This *is* crucial, but debating it abstractly is fruitless. **Q1 (Guaranteed Loss) is the *actionable*, formalizable version of this question.** It provides concrete criteria to test.

  ### **The Crucial Upstream Ladder**
  1.  **Gustafsson's Guaranteed Loss (Q1):** What *exactly* must rational diachronic choice avoid? (Foundational Criterion)
  2.  **Changing Preferences (Q2):** Who is the "agent" over time? Does diachronic rationality even apply? (Scope & Identity)
  3.  **Resolute vs. Sophisticated (Wildcard):** *How* can agents practically meet the criterion defined in (1) within the scope defined in (2)? (Implementation Strategies)

  ### **Tractability & Your Background**
  *   **Q1 (Guaranteed Loss):** Ideal. Pure decision theory/logic. Define choice nodes, outcomes, dominance relations. Compare sequences. Formalize "guaranteed loss at T1". Analyze classic examples.
  *   **Q2 (Changing Preferences):** Very suitable. Define time-indexed preferences formally. Model decision trees where preferences shift. Analyze sequences using the different preference relations. Requires careful definitions but no complex econ.
  *   **Wildcard (Resolute):** Moderately tractable. Requires modeling future selves and intentions. Game trees against yourself. Potentially more philosophical, but logic can handle the formal structure of the choice problem.

  ### **Overrated/Dead Ends**
  *   **Endless Refinement of Transitivity Pumps:** Without linking to Q1 or Q2, this is largely saturated.
  *   **Circular Debates on "Exploitability = Irrationality":** Abstract meta-debate without the concrete anchor of Q1.
  *   **Overly Complex Self-Prediction Models:** Often adds unnecessary layers if preferences are assumed stable (sophistication handles it) or genuinely changing (prediction is incoherent).
  *   **Ignoring Gustafsson's Distinction:** Perpetuating the classic pump argument without addressing the guaranteed loss critique is increasingly seen as missing the point.

  ### **Recommendation: Start Here**
  1.  **Dive Deep into Gustafsson:** Read his core papers. Formalize his "guaranteed loss" vs. "potential exploitability" distinction rigorously. Apply it to 2-3 classic pump types (e.g., intransitivity, incompleteness). **This is your highest-yield starting point.** It forces clarity on what pumps *prove*.
  2.  **Simultaneously/Next: Model Genuine Preference Change:** Define a simple case (e.g., A>B at T1, B>A at T2, *with no regret*). Build a pump scenario. Does the pump demonstrate diachronic *irrationality*, or just a transfer between agents? What would "rationality" even mean here?
  3.  **Only if Compelled:** If your work on Q1/Q2 highlights the binding problem, *then* tackle the Resolute Choice coherence (Wildcard). Don't start here.

  This approach leverages your logic strength, tackles the most fundamental and contested premises, avoids well-worn paths, and offers a clear path to original contributions within a semester. Good luck breaking the cycle!
