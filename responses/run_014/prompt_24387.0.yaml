prompt: |-
  I'm trying to figure out what I actually think about selling stuff, going by my gut on cases, and I can't get a consistent story out of the lot. A guy selling one of his kidneys to a stranger for $50k, fully informed, healthy otherwise: I'm fine with it. A plasma center paying you $50 for a pint, twice a week: obviously fine. A gas station tripling the price of bottled water three days after a hurricane: not fine, even though I get that its just the market. A tomato grower raising prices after a frost kills half the crop: fine, that's just markets working. Selling your vote in an election: not fine, full stop. A group paying low-income residents $20 to show up and vote, no instruction on how to vote: thats the one I keep going back and forth on. Selling your place in a line at the DMV for $20: fine. Selling your place in a kidney transplant waiting list: not fine. A paid surrogate carrying a baby for a couple who can't have one: fine. Selling a newborn at birth: not fine.

  The water one and the tomato one look the same to me structurally — price goes up, someone profits, buyers pay more — but my gut splits on them and I don't know why. Same with the line ones. Is there a principle that gets all of these, or close, stated precisely enough that I could test it on new cases? What does it say about the turnout-payment one, and which of my verdicts does it force me to drop? Also what does it predict for cases I haven't listed, like a woman in financial trouble selling a kidney to pay off debt, or a rich person buying a slot in a lottery for a subsidized apartment? I'd rather have a simpler principle that gets most of them right than a complicated one that saves every verdict, so be honest if the price of saving all my gut calls is a principle so baroque I wouldn't actually use it.
reasoning: |-
  Okay, let's start by unpacking the user's query. They're struggling with inconsistent gut reactions to various scenarios involving selling goods or services. The user wants a principle that explains their reactions and can be applied to new cases. 

  First, I need to analyze each example they provided. The kidney sale for $50k is fine, but selling a newborn isn't. Plasma donation is okay, but vote selling isn't. Price gouging water after a hurricane feels wrong, but tomato price hikes after a frost seem acceptable. Paid voting is ambiguous, while selling a DMV spot is fine but not a transplant list spot. Surrogacy is okay, but baby selling isn't. 

  The user's main confusion is why similar structures (supply/demand changes) elicit different reactions. They mention the water and tomato examples as structurally identical but emotionally different. The key here is identifying the underlying factors that trigger their discomfort.

  Looking at the examples, I notice patterns. When something involves basic necessity during a crisis (water after a hurricane), exploitation feels wrong. Tomatoes aren't a crisis necessity, so market pricing seems fair. Votes and transplant lists involve essential societal mechanisms—democracy and life-saving resources—so commodifying them feels corrupt. Selling a DMV spot is a minor inconvenience, hence acceptable. 

  The principle of "essential needs in crisis" vs. "routine market" explains some cases. But the paid voting example trips them up. Paying to vote directly is clearly bad, but paying for turnout without influencing the vote is ambiguous. Here, the societal function of voting—fair representation—might be undermined even if votes aren't bought, because it could skew participation. 

  Another angle is commodification of the body or identity. Kidneys and plasma are renewable or non-vital, so selling them is acceptable. Babies and votes are tied to personal identity and societal integrity, making their sale feel wrong. 

  The user might also value fairness and vulnerability. Exploiting desperate people (hurricane victims, debt-ridden kidney sellers) feels exploitative, whereas routine market transactions (tomatoes, plasma) don't involve the same vulnerability. 

  Testing the principle on new cases: a woman selling a kidney due to debt—this feels exploitative because of her desperation, so it might be unacceptable. A rich person buying a lottery spot for subsidized housing undermines the system's intent to help the needy, so it's likely unacceptable. 

  The turnout payment: paying for voting presence might be acceptable if it doesn't influence votes, but the user's gut is unsure. The principle of maintaining the integrity of essential systems might make this unacceptable because it commodifies a civic duty, potentially leading to coercion or inequality. 

  The user prefers simplicity. A principle combining societal function, vulnerability, and commodification covers most cases. If it conflicts, like the turnout payment, they might need to adjust their gut reaction. The key is whether the transaction undermines essential societal mechanisms or exploits vulnerability.
answer: |-
  Based on your gut reactions, a coherent principle emerges: **Commodification is unacceptable when it undermines essential societal functions, exploits extreme vulnerability, or violates bodily/identity integrity in non-renewable ways.** This principle prioritizes the *context and nature of the thing being sold* over the abstract market mechanism.

  Here's how it explains your judgments:

  1.  **Kidney Sale ($50k, informed, healthy):** *Acceptable.* Bodily integrity is impacted, but it's a renewable resource (one kidney suffices), consent is emphasized, and it doesn't inherently undermine an essential societal system. Your gut focuses on autonomy.
  2.  **Plasma Sale ($50/pint):** *Acceptable.* Similar to kidney: renewable bodily resource, regulated context, no systemic harm implied.
  3.  **Water Price Gouging (post-hurricane):** *Unacceptable.* **Exploits extreme vulnerability** (basic survival need during crisis) and potentially **undermines societal function** (maintaining order/relief during disaster). The *context* (crisis) makes the market response feel predatory.
  4.  **Tomato Price Hike (post-frost):** *Acceptable.* No extreme vulnerability exploitation; tomatoes aren't essential for immediate survival in a crisis context. It's a routine market response to reduced supply.
  5.  **Selling Your Vote:** *Unacceptable.* **Directly undermines an essential societal function** (democratic representation). It corrupts the core mechanism of governance by turning political voice into a commodity.
  6.  **Paying for Turnout ($20, no direction):** *Ambiguous (leaning Unacceptable for you).* Doesn't directly undermine voting *integrity* like vote-buying, but risks **undermining the societal function** of voting by commodifying civic participation. It feels like paying for an *act* tied to citizenship, blurring lines. (The principle flags this as problematic).
  7.  **Selling DMV Place ($20):** *Acceptable.* A minor inconvenience, not an essential societal function. The market efficiently reallocates a low-stakes "good" (time).
  8.  **Selling Transplant List Place:** *Unacceptable.* **Undermines an essential societal function** (fair, needs-based allocation of life-saving medical resources). Prioritizing wealth over medical need corrupts the system's purpose.
  9.  **Paid Surrogacy:** *Acceptable.* Involves bodily service/time (renewable), regulated, facilitates family formation (seen as a positive societal function). Bodily integrity is respected through consent and process.
  10. **Selling Newborn:** *Unacceptable.* **Violates bodily/identity integrity** in a profound, non-renewable way (creating/extracting a human life for sale). Treats a person as a commodity from inception, undermining the societal value of human dignity.

  **Why Your Gut Splits on Water vs. Tomatoes & DMV vs. Transplant List:**

  *   **Water vs. Tomatoes:** The principle highlights **exploitation of vulnerability in a crisis context.** Water is essential for *immediate survival* post-disaster; tomatoes are not. The hurricane creates a situation where buyers lack alternatives and face desperation, making the price hike feel exploitative. The frost causes a market fluctuation, not an existential crisis for buyers.
  *   **DMV vs. Transplant List:** The principle focuses on **essential societal function.** The DMV line is a minor administrative hassle; paying to skip it doesn't harm society's core functions. The transplant list allocates scarce, life-saving resources based on medical need; selling a spot corrupts this essential, ethically-driven system, prioritizing wealth over survival need.

  **Applying the Principle to New Cases:**

  1.  **Woman selling kidney to pay off debt:**
      *   **Principle Prediction:** *Likely Unacceptable.* Exploits **extreme vulnerability** (desperation caused by debt). While bodily integrity is involved like the healthy kidney sale, the context shifts from autonomous choice to coerced choice due to circumstance. The principle prioritizes preventing exploitation in such vulnerability.
      *   **Your Gut Likely:** Probably leans Unacceptable, seeing it as desperation, not autonomy.

  2.  **Rich person buying a slot in a lottery for a subsidized apartment:**
      *   **Principle Prediction:** *Unacceptable.* **Undermines an essential societal function** (providing affordable housing based on need/luck, not wealth). The lottery system aims for fairness/accessibility; allowing slots to be bought corrupts this purpose and exploits the system intended to help the less wealthy.
      *   **Your Gut Likely:** Unacceptable (similar to selling a transplant slot).

  **The Turnout Payment Verdict & Required Adjustment:**

  *   **Principle's Verdict:** Leans *Unacceptable*. While not direct vote-buying, paying for the *act of voting* commodifies an essential civic duty. It risks **undermining the societal function** of elections by potentially:
      *   Distorting participation (focus on payment, not civic duty).
      *   Creating perception of elections being "bought" indirectly.
      *   Targeting vulnerable populations whose participation might be unduly influenced by small payments.
  *   **Adjustment Required:** To align with the principle, you would need to drop your current ambivalence and conclude the turnout payment is **Unacceptable**. The principle doesn't cleanly distinguish it from vote-selling in terms of commodifying the civic *act*, even if not the vote itself.

  **Is it Simple Enough?**

  This principle ("No commodification undermining essential functions, exploiting extreme vulnerability, or violating profound bodily/identity integrity") is relatively concise and captures the core drivers behind your reactions. It's not *ultra*-simple, but avoids excessive baroqueness:

  *   **Essential Societal Functions:** Voting, fair allocation of life-saving resources, disaster response equity.
  *   **Extreme Vulnerability:** Crisis survival needs (post-hurricane water), desperate poverty (debt-driven kidney sale).
  *   **Profound Bodily/Identity Integrity:** Selling a person (baby), selling core civic acts (voting), corrupting vital allocation systems (transplants, subsidized housing).

  It explains the vast majority of your gut calls consistently, requiring only the shift on turnout payments. It provides a clear framework for evaluating new cases based on *what* is being sold and *in what context*, rather than just the market mechanism itself.
