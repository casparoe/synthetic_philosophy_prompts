answer: |-
  ## The Pasadena Game: A Coin Toss of Infinite Uncertainty

  Imagine a game, seemingly simple, played with a fair coin. We flip it repeatedly until the first head appears. If that head lands on the *n*-th toss, your payoff is startling: you win $2^n$ dollars if *n* is odd, but you *lose* $2^n$ dollars if *n* is even. The sequence of possible outcomes begins: +$2 (H on 1st), -$4 (TH on 2nd), +$8 (TTH on 3rd), -$16 (TTTH on 4th), +$32 (TTTTH on 5th), -$64 (TTTTTH on 6th), and so on, growing explosively positive and negative. This is the Pasadena game. While its rules are straightforward, it presents a profound mathematical and decision-theoretic puzzle that challenges the very notion of a "fair price" for a risk-neutral player. Let's dissect it carefully.

  **I. The Probability Distribution: Unbounded Extremes, Certain Termination**

  The coin is fair; the probability of heads (H) or tails (T) on any single toss is always 1/2. The game continues indefinitely only if tails appear forever, but the probability of never getting a head is the probability of an infinite sequence of tails: lim_{n->∞} (1/2)^n = 0. Therefore, the game terminates with probability 1. The first head must occur on *some* finite toss number *n* = 1, 2, 3, ...

  What is the probability the first head occurs precisely on toss *n*? It requires *n*-1 tails followed by one head. Since tosses are independent, this probability is:
      P(n) = P(T)^(n-1) * P(H) = (1/2)^(n-1) * (1/2) = (1/2)^n

  Each outcome *n* has a well-defined probability and payoff:
  *   n=1 (odd): Payoff = +$2^1 = +$2, P(1) = (1/2)^1 = 1/2
  *   n=2 (even): Payoff = -$2^2 = -$4, P(2) = (1/2)^2 = 1/4
  *   n=3 (odd): Payoff = +$2^3 = +$8, P(3) = (1/2)^3 = 1/8
  *   n=4 (even): Payoff = -$2^4 = -$16, P(4) = (1/2)^4 = 1/16
  *   ... and so on.

  The distribution is clear. The payoffs, however, are unbounded both above and below. While extremely large wins or losses become increasingly improbable (P(n) = 1/2^n shrinks rapidly), they are not impossible. There is no maximum possible win (+$2, +$8, +$32, ... grow without limit) and no maximum possible loss (-$4, -$16, -$64, ... become infinitely negative). This sets the stage for trouble when we try to calculate the "average" result.

  **II. The Undefined Expectation: Divergent Forces**

  The expected value (or mean) of a random variable is the long-run average payoff if the game is repeated infinitely many times. Formally, for discrete outcomes, it's calculated by summing (Payoff for outcome *n*) * (Probability of outcome *n*) over all possible *n*:
      E = Σ [Payoff(n) * P(n)] for n=1 to ∞

  Plugging in our Payoff(n) and P(n):
      E = Σ [ ( (-1)^{n+1} * 2^n ) * (1/2^n) ] for n=1 to ∞

  Let's simplify the term inside the sum:
      Payoff(n) * P(n) = [ (-1)^{n+1} * 2^n ] * (1/2^n) = (-1)^{n+1} * (2^n / 2^n) = (-1)^{n+1} * 1 = (-1)^{n+1}

  The 2^n and 1/2^n cancel perfectly! We are left with:
      E = Σ (-1)^{n+1} for n=1 to ∞

  What does this infinite series sum to?
      n=1: (-1)^{1+1} = (-1)^2 = +1
      n=2: (-1)^{2+1} = (-1)^3 = -1
      n=3: (-1)^{4} = +1
      n=4: (-1)^{5} = -1
      ...
  The series is simply the alternating series: **1 - 1 + 1 - 1 + 1 - 1 + ...**

  **This series does not converge.** Its partial sums oscillate forever between 1 and 0:
      S1 = 1
      S2 = 1 - 1 = 0
      S3 = 1 - 1 + 1 = 1
      S4 = 1 - 1 + 1 - 1 = 0
      S5 = 1
      S6 = 0
      ... and so on, never settling to a single limit.

  Crucially, the series is *not* infinite in the sense of diverging to positive or negative infinity. Instead, the sum of the positive contributions (the +1 terms) alone diverges to +∞, and the sum of the negative contributions (the -1 terms) alone diverges to -∞. The expectation is caught in an unresolvable tug-of-war; neither infinity wins, and no finite limit exists. The expected value of the Pasadena game is **undefined**, even within the extended real numbers (which include +∞ and -∞).

  **Contrast with St. Petersburg:** The classic St. Petersburg game also uses a fair coin tossed until first heads (on toss *n*) but pays +$2^n regardless of *n*. Its expectation is Σ [2^n * (1/2^n)] = Σ [1] = 1 + 1 + 1 + ... = ∞. Here the positive contributions diverge to +∞, while there are *no* negative contributions. The expectation is therefore well-defined in the extended reals as +∞. The Pasadena game's alternating payoffs fundamentally change the nature of the divergence.

  **III. The Rearrangement Paradox: The Fragility of Conditional Convergence**

  The series Σ (-1)^{n+1} = 1 - 1 + 1 - 1 + ... is a prime example of a **conditionally convergent** series. It converges conditionally because while the series itself doesn't converge, the series of its absolute values (|(-1)^{n+1}| = 1 + 1 + 1 + ...) *does* diverge to +∞.

  Riemann's Rearrangement Theorem states a startling fact: the terms of a conditionally convergent series can be rearranged to converge to **any** real number whatsoever, or to diverge to +∞, or to diverge to -∞.

  What does this mean for the Pasadena game? Imagine we don't sum the expected contributions in the natural order (n=1, then n=2, then n=3, etc.). We could group outcomes differently. For example:
  *   **Sum to +∞:** Group outcomes as (n=1) + (n=3, n=2) + (n=5, n=4) + ... = (1) + (1 - 1) + (1 - 1) + ... = 1 + 0 + 0 + ... = 1. This seems finite? But wait, this groups *pairs* of terms. To force divergence upwards, take *one* positive term, then *one* negative term, then *two* positive terms, then *one* negative term, then *three* positive terms, then *one* negative term, and so on. The excess positive terms accumulate without bound.
  *   **Sum to -∞:** Similarly, take *one* negative term, then *one* positive term, then *two* negative terms, then *one* positive term, then *three* negative terms, etc.
  *   **Sum to 10:** Riemann's theorem guarantees there exists a specific rearrangement (a specific order of adding the terms +1 and -1 corresponding to the different outcomes) that will make the partial sums get arbitrarily close to 10 and stay close.

  **Why is this a defect of "expected value"?** This isn't a trick or a calculation error. The problem lies in the *definition* of expected value itself for this game. The standard definition Σ (Payoff * Probability) assumes the sum converges absolutely or diverges cleanly to ±∞. When the series is only conditionally convergent, the result depends entirely on the *arbitrary order* in which we choose to add the contributions. There is no inherent "correct" order dictated by the probabilities alone; the natural order (n=1,2,3,...) is just one convention. If changing the order of summation changes the result completely – making the "expected value" be +∞, -∞, $100, or -$50 depending purely on how we list the possibilities – then this quantity fails to capture a stable, objective measure of the "average" or "fair" value of the game. The expectation is ill-defined because the mathematical object it relies on (the infinite sum) is pathologically sensitive to summation order.

  **IV. The Stable Median: A Different Center**

  Unlike the elusive mean, the median of the Pasadena game is well-defined and stable. The median is the smallest payoff value such that the probability of getting that value or less is at least 1/2.

  To find it, we calculate the cumulative distribution function (CDF). List the possible payoffs in ascending order (most negative to most positive): -$4, -$16, -$64, ... (all even n), then +$2, +$8, +$32, ... (all odd n). Now sum the probabilities starting from the smallest payoff:

  *   P(Payoff ≤ -$4) = P(n even) = P(n=2) + P(n=4) + P(n=6) + ... = (1/4) + (1/16) + (1/64) + ...
  This is a geometric series with first term a = 1/4, ratio r = 1/4.
  Sum = a/(1-r) = (1/4)/(1 - 1/4) = (1/4)/(3/4) = **1/3 ≈ 0.333 < 0.5**

  *   P(Payoff ≤ -$16) = P(n=4) + P(n=6) + P(n=8) + ... = (1/16) + (1/64) + (1/256) + ...
  Geometric series: a = 1/16, r = 1/4. Sum = (1/16)/(3/4) = (1/16)*(4/3) = **1/12 ≈ 0.083 < 0.5**

  Continuing, P(Payoff ≤ any specific even-n payoff) will always be less than 1/2.

  Now consider including the smallest *positive* payoff, +$2 (n=1):
  *   P(Payoff ≤ +$2) = P(n even) + P(n=1) = 1/3 + 1/2 = **5/6 ≈ 0.833 ≥ 0.5**

  Is P(Payoff ≤ +$2) ≥ 1/2? Yes (5/6 > 1/2). Is P(Payoff ≤ -$4) < 1/2? Yes (1/3 < 1/2). Furthermore, the payoff +$2 is the smallest value for which P(Payoff ≤ +$2) ≥ 1/2. Therefore, the **median payoff is +$2**.

  This makes intuitive sense: the most probable single outcome is winning $2 on the first toss (P=1/2), and over half the time (P=1/2 + P(n>1 even) = 1/2 + 1/3 = 5/6), you either win $2 or lose money. The median is stable; it doesn't change based on the order we consider outcomes. It tells us that in over 50% of plays, you will win $2 *or less* (which includes losses). While it ignores the massive potential swings (both good and bad), it provides a definite, reliable central point distinct from the problematic mean.

  **V. The Bookie's Question: What Fee is Fair?**

  The critical question for our risk analyst character: "What entry fee `c` makes this game fair for a risk-neutral player?" A fair fee would make the expected value of the net winnings (Payoff - c) equal to zero: E[Payoff - c] = E[Payoff] - c = 0, implying c = E[Payoff].

  But we've established that E[Payoff] **does not exist**. Therefore, there is **no finite fee `c`** that makes E[Payoff - c] = 0. Why? Because E[Payoff - c] = E[Payoff] - c. Since E[Payoff] is undefined (not a number, not ∞, not -∞), subtracting any finite constant `c` leaves it undefined. The expectation of the net winnings remains undefined regardless of the fee charged.

  Faced with this, what positions could a careful decision theorist defensibly take?

  1.  **Refuse to Play (for any fee):** Argue that without a well-defined expectation, the concept of a "fair price" is meaningless. The rearrangement paradox shows any finite purported "fair price" can be mathematically manipulated to seem too high or too low. The potential for catastrophic loss (e.g., losing $1,048,576 if heads first appears on toss 20) is real, however improbable. This position prioritizes avoiding the undefined and the potentially ruinous. *Cost:* Forgoing the high probability (1/2) of a $2 win and the chance of larger wins.
  2.  **Accept to Play for Free (`c = $0`):** Argue that the undefined expectation doesn't inherently favor playing or not playing, but playing for free guarantees no loss and offers a 1/2 chance of gaining $2, a 1/4 chance of gaining $8, etc., balanced against the chance of losses. The median (+$2) suggests a tendency towards positive outcomes. This position leans on the median or the positive skew of the most likely outcomes. *Cost:* Risking potentially large losses, especially if one is loss-averse.
  3.  **Use an Alternative Criterion (e.g., Median) to Set a Fee:** Argue that the median net payoff being zero is a sensible fairness criterion. Since the median gross payoff is $2, setting the fee `c = $2` would make the median net payoff $0: half the time net winnings ≤ $0, half the time ≥ $0. One could also consider other measures like a truncated mean (ignoring extremely unlikely high-|n| outcomes) or a risk-adjusted measure accepting a higher chance of small loss for the upside. *Cost:* This approach is inherently subjective (why prefer median over mean or mode?) and ignores the game's massive variance and potential extremes that might matter to the player.

  **Minimax Offers No Refuge:** A minimax criterion (minimizing the maximum possible loss) doesn't resolve the dilemma. The worst possible outcome is losing $2^n for large even n, which is unbounded below (you can lose arbitrarily large sums). There is no finite maximum loss to minimize.

  **Conclusion: The Limits of Expectation**

  The Pasadena game vividly exposes a boundary of expected utility theory. For a risk-neutral rational agent, expected value is the gold standard for valuing gambles. Yet here, expectation simply fails to exist as a meaningful quantity due to the symmetric divergence of positive and negative possibilities. The rearrangement paradox underscores that the standard summation process yields no unique, stable answer. While alternatives like the median exist, they lack expectation's normative force within standard rationality models. The game forces a confrontation: rational choice under risk, when faced with infinitely divergent symmetric uncertainties, cannot always rely on a single, well-defined expected value calculation. It reveals that expected utility theory, powerful as it is, has limits when dealing with distributions whose means are not merely infinite, but fundamentally undefined. The rational response becomes nuanced, depending on one's interpretation of fairness, tolerance for undefined expectations, and attitude towards potentially infinite losses weighed against likely small gains.
