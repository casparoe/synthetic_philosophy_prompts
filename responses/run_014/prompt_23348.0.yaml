  Below is a self-contained example that illustrates the role of the common prior assumption in Aumann's agreement theorem. I use a minimal state space with three states and specify the information partitions and priors for two agents. The example shows how a common prior leads to agreement after communication, and how a minimal change to the priors (making them different) allows for persistent disagreement. The key is that with a common prior, the agents can infer each other's information from their posteriors, but with different priors, this inference fails.

  ### Scenario Setup
  - **States of the world**: Three possible states: \(\omega_1\), \(\omega_2\), \(\omega_3\). These represent the true state of a system (e.g., the outcome of a hidden card draw).
  - **Event of interest**: Let \(A = \{\omega_1\}\) (e.g., "the card is of type 1").
  - **Agents**: Alice and Bob, each with a partition of the state space (representing their private information):
    - Alice's partition: \(\{\{\omega_1, \omega_2\}, \{\omega_3\}\}\)  
      (Alice cannot distinguish \(\omega_1\) from \(\omega_2\) but knows if it's \(\omega_3\)).
    - Bob's partition: \(\{\{\omega_1, \omega_3\}, \{\omega_2\}\}\)  
      (Bob cannot distinguish \(\omega_1\) from \(\omega_3\) but knows if it's \(\omega_2\)).
  - **True state**: \(\omega_1\) (for both versions of the example).

  ### Version 1: Common Prior (Agreement Occurs)
  - **Common prior**: Uniform distribution.  
    \(P(\omega_1) = P(\omega_2) = P(\omega_3) = \frac{1}{3}\).
  - **Initial posteriors** (given true state \(\omega_1\)):
    - Alice observes \(\{\omega_1, \omega_2\}\):  
      \[
      P_1(A \mid \{\omega_1, \omega_2\}) = \frac{P(\omega_1)}{P(\omega_1) + P(\omega_2)} = \frac{1/3}{1/3 + 1/3} = \frac{1}{2}.
      \]
    - Bob observes \(\{\omega_1, \omega_3\}\):  
      \[
      P_2(A \mid \{\omega_1, \omega_3\}) = \frac{P(\omega_1)}{P(\omega_1) + P(\omega_3)} = \frac{1/3}{1/3 + 1/3} = \frac{1}{2}.
      \]
  - **Announcement**: Alice and Bob truthfully announce their posteriors for \(A\): both say \(\frac{1}{2}\).
  - **Update after announcement**:
    - **Alice's reasoning**:  
      - Bob announced \(P_2(A) = \frac{1}{2}\). Under the common prior, Bob only assigns \(P_2(A) = \frac{1}{2}\) if he observed \(\{\omega_1, \omega_3\}\) (if he observed \(\{\omega_2\}\), he would assign \(P_2(A) = 0\)).  
      - Alice now knows the state is in Bob's information set \(\{\omega_1, \omega_3\}\).  
      - Alice's initial information set is \(\{\omega_1, \omega_2\}\).  
      - The intersection is \(\{\omega_1, \omega_2\} \cap \{\omega_1, \omega_3\} = \{\omega_1\}\).  
      - Alice updates: the state must be \(\omega_1\), so \(P_1(A) = 1\).  
    - **Bob's reasoning**:  
      - Alice announced \(P_1(A) = \frac{1}{2}\). Under the common prior, Alice only assigns \(P_1(A) = \frac{1}{2}\) if she observed \(\{\omega_1, \omega_2\}\) (if she observed \(\{\omega_3\}\), she would assign \(P_1(A) = 0\)).  
      - Bob now knows the state is in Alice's information set \(\{\omega_1, \omega_2\}\).  
      - Bob's initial information set is \(\{\omega_1, \omega_3\}\).  
      - The intersection is \(\{\omega_1, \omega_2\} \cap \{\omega_1, \omega_3\} = \{\omega_1\}\).  
      - Bob updates: the state must be \(\omega_1\), so \(P_2(A) = 1\).  
  - **Result**: Both agents update to \(P(A) = 1\) and agree.

  **Role of common prior**: The common prior allows each agent to invert the other's posterior to infer their private information set. Specifically:
  - Alice uses Bob's posterior (\(\frac{1}{2}\)) and the common prior to deduce Bob must have seen \(\{\omega_1, \omega_3\}\).
  - Bob uses Alice's posterior (\(\frac{1}{2}\)) and the common prior to deduce she must have seen \(\{\omega_1, \omega_2\}\).
  - This mutual inference reveals the intersection of information sets, pinning down \(\omega_1\).

  ---

  ### Version 2: Different Priors (Disagreement Persists)
  - **Alice's prior**: \(P_1(\omega_1) = \frac{1}{4}\), \(P_1(\omega_2) = \frac{1}{2}\), \(P_1(\omega_3) = \frac{1}{4}\).
  - **Bob's prior**: \(P_2(\omega_1) = \frac{1}{3}\), \(P_2(\omega_2) = \frac{1}{3}\), \(P_2(\omega_3) = \frac{1}{3}\).
  - **Initial posteriors** (given true state \(\omega_1\)):
    - Alice observes \(\{\omega_1, \omega_2\}\):  
      \[
      P_1(A \mid \{\omega_1, \omega_2\}) = \frac{P_1(\omega_1)}{P_1(\omega_1) + P_1(\omega_2)} = \frac{1/4}{1/4 + 1/2} = \frac{1/4}{3/4} = \frac{1}{3}.
      \]
    - Bob observes \(\{\omega_1, \omega_3\}\):  
      \[
      P_2(A \mid \{\omega_1, \omega_3\}) = \frac{P_2(\omega_1)}{P_2(\omega_1) + P_2(\omega_3)} = \frac{1/3}{1/3 + 1/3} = \frac{1/3}{2/3} = \frac{1}{2}.
      \]
  - **Announcement**: Alice announces \(P_1(A) = \frac{1}{3}\), Bob announces \(P_2(A) = \frac{1}{2}\).
  - **Update after announcement**:
    - **Alice's reasoning**:  
      - Bob announced \(P_2(A) = \frac{1}{2}\). Alice uses *her own prior* (\(P_1\)) to interpret this:  
        - If Bob saw \(\{\omega_1, \omega_3\}\), his posterior would be:  
          \[
          \frac{P_2(\omega_1)}{P_2(\omega_1) + P_2(\omega_3)} = \frac{1/3}{1/3 + 1/3} = \frac{1}{2} \quad (\text{matches announcement}).
          \]
        - If Bob saw \(\{\omega_2\}\), his posterior would be \(P_2(A) = 0\).  
      - Alice deduces Bob saw \(\{\omega_1, \omega_3\}\), so the state is in \(\{\omega_1, \omega_3\}\).  
      - Alice's initial information set is \(\{\omega_1, \omega_2\}\).  
      - Intersection: \(\{\omega_1, \omega_2\} \cap \{\omega_1, \omega_3\} = \{\omega_1\}\).  
      - Alice updates: state is \(\omega_1\), so \(P_1(A) = 1\).  
    - **Bob's reasoning**:  
      - Alice announced \(P_1(A) = \frac{1}{3}\). Bob uses *his own prior* (\(P_2\)) to interpret this:  
        - If Alice saw \(\{\omega_1, \omega_2\}\), her posterior would be:  
          \[
          \frac{P_1(\omega_1)}{P_1(\omega_1) + P_1(\omega_2)} = \frac{1/4}{1/4 + 1/2} = \frac{1}{3} \quad (\text{matches announcement}).
          \]
        - If Alice saw \(\{\omega_3\}\), her posterior would be \(P_1(A) = 0\).  
      - Bob deduces Alice saw \(\{\omega_1, \omega_2\}\), so the state is in \(\{\omega_1, \omega_2\}\).  
      - Bob's initial information set is \(\{\omega_1, \omega_3\}\).  
      - Intersection: \(\{\omega_1, \omega_2\} \cap \{\omega_1, \omega_3\} = \{\omega_1\}\).  
      - Bob updates: state is \(\omega_1\), so \(P_2(A) = 1\).  
  - **Result**: Both still update to agreement (\(P(A) = 1\))—but this is coincidental.  

  **Problem with Version 2**: The disagreement disappeared because the agents (incorrectly) used their own priors to model each other's beliefs. To create persistent disagreement, we need a case where the posterior announcement does **not** reveal the information set unambiguously. We modify Bob's prior minimally to make his posterior consistent with multiple information sets under Alice's prior.

  ### Version 2 (Revised for Persistent Disagreement)
  - **Alice's prior**: \(P_1(\omega_1) = \frac{1}{2}\), \(P_1(\omega_2) = \frac{1}{4}\), \(P_1(\omega_3) = \frac{1}{4}\).
  - **Bob's prior**: \(P_2(\omega_1) = \frac{1}{4}\), \(P_2(\omega_2) = \frac{1}{4}\), \(P_2(\omega_3) = \frac{1}{2}\).
  - **Initial posteriors** (given \(\omega_1\)):
    - Alice observes \(\{\omega_1, \omega_2\}\):  
      \[
      P_1(A \mid \{\omega_1, \omega_2\}) = \frac{P_1(\omega_1)}{P_1(\omega_1) + P_1(\omega_2)} = \frac{1/2}{1/2 + 1/4} = \frac{1/2}{3/4} = \frac{2}{3}.
      \]
    - Bob observes \(\{\omega_1, \omega_3\}\):  
      \[
      P_2(A \mid \{\omega_1, \omega_3\}) = \frac{P_2(\omega_1)}{P_2(\omega_1) + P_2(\omega_3)} = \frac{1/4}{1/4 + 1/2} = \frac{1/4}{3/4} = \frac{1}{3}.
      \]
  - **Announcement**: Alice announces \(P_1(A) = \frac{2}{3}\), Bob announces \(P_2(A) = \frac{1}{3}\).
  - **Update after announcement**:
    - **Alice's reasoning**:  
      - Bob announced \(P_2(A) = \frac{1}{3}\). Alice uses *her prior* (\(P_1\)) to interpret:  
        - If Bob saw \(\{\omega_1, \omega_3\}\):  
          \[
          \text{Compute } P_2(A) \text{ using Alice's prior:} \quad \frac{P_1(\omega_1)}{P_1(\omega_1) + P_1(\omega_3)} = \frac{1/2}{1/2 + 1/4} = \frac{2}{3} \quad (\text{not } \frac{1}{3}).
          \]
        - If Bob saw \(\{\omega_2\}\):  
          \[
          P_2(A) = 0 \quad (\text{not } \frac{1}{3}).
          \]
      - Alice **cannot reconcile** Bob's announcement with her model of his prior. She has **no rational way to infer Bob's information set** and thus cannot update her belief. She sticks with \(P_1(A) = \frac{2}{3}\).  
    - **Bob's reasoning**:  
      - Alice announced \(P_1(A) = \frac{2}{3}\). Bob uses *his prior* (\(P_2\)) to interpret:  
        - If Alice saw \(\{\omega_1, \omega_2\}\):  
          \[
          \text{Compute } P_1(A) \text{ using Bob's prior:} \quad \frac{P_2(\omega_1)}{P_2(\omega_1) + P_2(\omega_2)} = \frac{1/4}{1/4 + 1/4} = \frac{1}{2} \quad (\text{not } \frac{2}{3}).
          \]
        - If Alice saw \(\{\omega_3\}\):  
          \[
          P_1(A) = 0 \quad (\text{not } \frac{2}{3}).
          \]
      - Bob **cannot reconcile** Alice's announcement with his model of her prior. He has **no rational way to infer Alice's information set** and sticks with \(P_2(A) = \frac{1}{3}\).  
  - **Result**: Alice maintains \(P_1(A) = \frac{2}{3}\), Bob maintains \(P_2(A) = \frac{1}{3}\). Disagreement persists.

  **Why disagreement persists**: 
  - With different priors, Alice and Bob **cannot accurately invert each other's posteriors to infer private information**. 
  - Alice cannot find any information set for Bob (under *her* prior) that justifies his posterior of \(\frac{1}{3}\). Similarly for Bob.
  - Without a common prior, there is no shared model to map posteriors back to information sets. The agents are "speaking different languages," so communication does not resolve the disagreement.

  ---

  ### Conceptual Summary
  - **Common prior**: Acts as a shared reference point, allowing agents to deduce each other's private information from public posterior announcements. This forces agreement (as in Version 1).
  - **Different priors**: Breaks the link between posteriors and information sets. Agents cannot infer what evidence the other has seen, so they cannot update meaningfully. Disagreement can persist indefinitely (as in Version 2 Revised).
  - **Key intuition**: Your initial suspicion was correct—with a common prior, a posterior *is* a function of evidence alone, so announcing it reveals the evidence. Without a common prior, the mapping from evidence to posterior is agent-specific, and the same posterior may not correspond to the same evidence across agents. The example makes this failure explicit in the arithmetic.
