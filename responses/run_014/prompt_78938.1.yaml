  *Answer each question with yes/no. Follow the arrows to your position.*  

  ---

  **1. Start:** Consider a **synthetic genome assembled in a lab with no evolutionary history** (e.g., artificial bacterial genome). Does this DNA *functionally* encode biological information in the same way natural DNA does?  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q5.  

  **2. Q2:** Consider a **mutation that changes the DNA sequence but not the protein** (e.g., a synonymous mutation). Does this altered sequence still carry the *same* information?  
  - **Yes** → Go to Q3.  
  - **No** → Go to Q4.  

  **3. Q3:** Consider a **long stretch of DNA that never gets transcribed** (e.g., "junk" DNA). Does this region carry biologically relevant information?  
  - **Yes** → **Position: Causal Specificity**  
  - **No** → **Position: Engineering Code**  

  **4. Q4:** Is DNA a "code" **only in the engineering sense** (a systematic mapping rule, like Morse code), not in the ordinary sense (symbols "about" something)?  
  - **Yes** → **Position: Engineering Code**  
  - **No** → **Position: Genuine Aboutness**  

  **5. Q5:** Consider an **inherited methylation mark that changes the offspring’s traits** (e.g., epigenetic silencing). Does this show that DNA *alone* isn’t the unique bearer of biological information?  
  - **Yes** → Go to Q6.  
  - **No** → Go to Q7.  

  **6. Q6:** Consider a **gene that would produce a protein but isn’t expressed due to missing cellular factors** (e.g., no transcription factors). Does this gene still "encode" its protein?  
  - **Yes** → **Position: Whole System Bearer**  
  - **No** → **Position: Whole System Bearer**  

  **7. Q7:** Is "code/information" a **metaphor we should drop entirely** because it misrepresents biology?  
  - **Yes** → **Position: Drop the Metaphor**  
  - **No** → *Contradiction: Restart from Q5 (this path is unattractive/unexplored).*  

  ---

  ### Positions & Key Tensions  
  *(Each position must "swallow" one awkward implication.)*  

  1. **Genuine Aboutness** (Q4 → No)  
     - DNA has inherent semantic content (it "means" something).  
     - *Awkward: Must accept that a synthetic genome with no evolutionary history (Q1) has "meaning" like words in a book.*  

  2. **Engineering Code** (Q3 → No *or* Q4 → Yes)  
     - DNA is a code *only* as a mechanistic mapping (e.g., codon → amino acid). "Information" is observer-assigned.  
     - *Awkward: Must deny that non-transcribed DNA (Q3) carries information, even if it affects chromosome structure.*  

  3. **Causal Specificity** (Q3 → Yes)  
     - Information = precise causal role (e.g., *this* DNA bit makes *that* specific difference).  
     - *Awkward: Must treat a synonymous mutation (Q2) as informational (e.g., affects mRNA stability), even if "silent".*  

  4. **Whole System Bearer** (Q6 → Yes/No)  
     - DNA isn’t privileged; information emerges from the entire developmental system (DNA + epigenetics + environment).  
     - *Awkward: Must equate an epigenetic mark (Q5) with DNA as equal info-bearers, blurring "genetic" uniqueness.*  

  5. **Drop the Metaphor** (Q7 → Yes)  
     - "Code/information" is a misleading anthropomorphic metaphor; biology should ditch it.  
     - *Awkward: Must explain why the metaphor drives successful research (e.g., CRISPR, synthetic biology) if it’s invalid.*  

  ---

  ### Design Notes  
  - **Unseparated Positions:**  
    - *Genuine Aboutness* and *Engineering Code* are separated cleanly by Q4 (ordinary vs. engineered "code").  
    - *Whole System Bearer* and *Drop the Metaphor* both answer Q5 with "yes" but split at Q7 (usefulness of "information").  
  - **Empty/Incoherent Paths:**  
    - Q7 → "No" after Q5 → "No" is **unattractive**: Denying epigenetics (Q5) *and* rejecting the metaphor (Q7) leaves no coherent position.  
  - **Key Cases Covered:**  
    - Synthetic genome (Q1), synonymous mutation (Q2), non-transcribed DNA (Q3), epigenetic mark (Q5), unexpressed gene (Q6).  
  - **Blueprint vs. Recipe:**  
    - Built into Q4: Engineering Code (recipe-like operations) vs. Genuine Aboutness (could be blueprint or recipe, but semantic).  
  - **Tree Logic:**  
    - Branches on concrete cases, avoiding abstractions.  
    - Forces distinctions (no "it depends" loopholes).  

  *Fits 2 pages. Use for discussion!*
