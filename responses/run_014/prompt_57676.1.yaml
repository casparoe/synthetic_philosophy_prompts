answer: |-
  The clouds parted over the Sky Meadows of Kaelen, revealing the vast, shimmering expanse where the *Floaters* lived. Not creatures of flesh, nor plants entirely, the Floaters were buoyant kelp-like organisms, their translucent fronds catching the sunlight, drifting at specific depths within the atmospheric ocean. Their depth, crucial for optimal photosynthesis and avoiding predatory Skywhips, was the obsession of the Skywarden Guild.

  Elara, her hands calloused from tending the woven nets used to corral Floaters for harvest and study, watched a new batch of juveniles ascend. Their initial depth varied wildly. "Look at that spread," she murmured to her apprentice, Bren. "Some hug the heat-haze, others sink deep into the cold currents. It’s chaos."

  Bren, eager and recently returned from the Central Archives, adjusted his spectacles. "Chaos? Or predictable variance? The Archives have the latest heritability estimate for Depth Preference, Elara. *H² = 0.85*. Based on a massive study across the Eastern Drifts." He tapped a data-slate triumphantly. "Eighty-five percent! That means depth is *mostly* in the genes. See? That spread isn't random noise; it's the expression of their innate programming."

  Elara frowned. She’d heard the term ‘heritability’ bandied about by the Archive scholars – a number signifying how much of the *differences* between Floaters were due to inherited factors versus the environment, *for a specific group in specific conditions*. But Bren’s eyes shone with a certainty that made her uneasy. "Eighty-five percent? That’s high. But… what does it *mean*? For changing things?"

  "Change?" Bren laughed, a sharp sound. "Elara, with an *H²* that high, it means depth is *fixed* in their nature. Trying to shift the whole population deeper, like the Guildmaster wants? Foolish! It'd be like trying to make water burn. The genes resist it. We need to *select*, not waste resources on environmental tricks that can't touch the core trait. Breed the deep-divers, cull the surface-huggers. That’s the power of that number!" He gestured expansively at the drifting juveniles. "See that one? Always sinks fast? Its genes dictate deep. That one fluttering high? Shallow genes. Unchangeable. The number proves it."

  Elara looked at the Floaters. The ‘deep’ one Bren pointed to was currently bobbing higher than the ‘shallow’ one, caught in an unexpected thermal. She said nothing. Bren’s conviction, backed by the Authority of the Archives and that imposing number, felt like a physical weight.

  Guildmaster Torvin, however, was unmoved by numbers alone. The Skywhips were rising, drawn by warmer currents shifting with the changing sky-climate. The traditional harvest depths were becoming killing zones. "We need them deeper, Bren," Torvin stated flatly at the next council meeting. "Five hundred spans lower, minimum. Within two seasons."

  Bren presented his data-slate like a shield. "With respect, Guildmaster, the heritability is *eighty-five percent*. That means eighty-five percent of the *reason* they are where they are is genetic. Only fifteen percent is environmental. Pouring resources into changing the environment is inefficient, bordering on negligent! That fifteen percent wiggle room won't get you five hundred spans. We *must* focus on selective breeding. It’s the only approach sanctioned by the data." He glared at Elara, who shifted uncomfortably. "Tinkering with nutrients or light cycles is pointless against such strong genetic determinism."

  Torvin, a pragmatist forged in decades of sky-harvests, wasn't interested in scholastic debates. "Breeding takes generations. The Skywhips are here *now*. Elara, you've tinkered. Any ideas?"

  Elara hesitated. She remembered Floaters responding dramatically to specific mineral infusions in isolated test nets. "We… we saw some shifts in small trials, Guildmaster. Big shifts. But it was messy. Unpredictable. Some sank, some barely moved..." Her voice trailed off under Bren's incredulous stare.

  "Messy?" Bren scoffed. "Exactly! Proves my point. Uncontrolled environmental noise. That's the fifteen percent. You might shift an individual fluke, but you can't reliably shift the *mean* population depth against such a strong genetic tide. That eighty-five percent locks it in place. We need *order*, Guildmaster. Selection. Not chaos."

  Torvin looked from Bren's confident certainty to Elara's hesitant pragmatism. The Guild's resources were stretched thin. The Skywhips were getting bolder. He needed a solution, not a lecture on statistics. Bren's argument, bolstered by that impressive, seemingly objective number – *0.85* – sounded like solid science. Elara’s messy trials sounded like expensive gambles.

  "Alright," Torvin sighed. "Bren, you get the main nursery nets. Double down on selecting the deepest juveniles from every brood. Fast-track the breeding program. Elara, take the smaller, western drift. You can try your… mineral infusions. Minimal resources. We'll see whose approach yields faster depth gain."

  Bren practically glowed. His interpretation of the heritability estimate had won. The future belonged to selection, to harnessing the power locked within the genes revealed by that sacred number. He set to work with zeal, meticulously tagging and tracking Floaters based on their initial depth readings, confident that these early measurements revealed their immutable genetic destiny. Deep-divers were separated, given priority nutrients (ironically, an environmental boost he deemed necessary for breeding stock), while shallow ones were culled or relegated to less productive zones. He reported weekly gains: the *mean* depth of his selected breeders was increasing! Proof, he crowed, that he was working *with* the genetic grain.

  Elara, relegated to the smaller, more turbulent western drift, worked with a skeleton crew. Her mineral infusions were crude, delivered via vapour-misters. Results were chaotic. Some Floaters plummeted dramatically, others ignored the treatment entirely, a few even rose slightly. The *average* depth change in her nets fluctuated wildly week to week. Bren’s reports, showing steady progress through selection, were circulated widely. Elara's erratic data was seen as confirmation of her approach's folly.

  Then came the Great Calm.

  A vast, stable high-pressure system settled over Kaelen. The usual turbulent currents that mixed the atmospheric layers died. Thermal gradients flattened. The environment, for the first time in recorded history, became startlingly uniform across the Sky Meadows.

  In Bren's meticulously selected nursery, disaster struck. The Floaters, offspring of deep-divers raised in the enriched nursery environment, didn't dive. They spread out, occupying a vast range of depths, many significantly *shallower* than their parents ever were, or than Bren’s selection index predicted. There was no pattern. Floaters from the same brood, predicted to be uniformly deep-dwellers, occupied depths hundreds of spans apart. The high heritability estimate, derived in a world of varied currents and thermals, meant nothing in this new, uniform sea. The genetic differences were still there, but with no environmental variation to *interact* with or *express* against, the trait differences appeared random. The genes weren't 'broken'; they simply had nothing to push against or respond to. The carefully selected ‘deep’ genes didn’t guarantee depth in the absence of the environmental cues they were adapted to. His mean depth gain evaporated.

  Meanwhile, under the uniform conditions, Elara’s chaotic mineral treatments finally showed a consistent pattern. The specific mineral cocktail, previously lost in the environmental noise, now triggered a profound and *predictable* depth response in *all* treated Floaters, regardless of their parentage. They sank. Deeply and uniformly. Her nets, once a laughingstock, now plunged hundreds of spans below the vulnerable zone, safely beneath the prowling Skywhips. The environmental intervention, dismissed because it couldn't overcome genetic variation *in a varied environment*, now shifted the entire population mean dramatically in the uniform calm. The high heritability hadn't meant the trait was immune to environmental change; it just meant that *in the environment where it was measured*, most differences were due to genetic differences. Change the environment radically, and the rules changed.

  Bren stood at the edge of the guild platform, staring at his dispersed, vulnerable Floaters. His data-slate, displaying the once-triumphant *H² = 0.85*, felt like a mockery. He had treated it as proof of fixed individual destinies and an unshiftable mean. He had believed the genes were a rigid blueprint, not a set of potentials activated by context. He had taken a ratio of variances specific to a turbulent world and assumed it was a universal law, ignoring how the number itself would inflate if environments became more uniform. He had confused the *origin of differences* with the *potential for change*. His selective breeding program, predicated on this misunderstanding, had consumed the guild's resources and yielded Floaters perfectly adapted to an environment that no longer existed.

  Below, Elara’s deep, safe nets pulsed with a steady, emerald light. No grand explanation was offered, no statistical lecture delivered. The cost of the error hung heavy in the unnaturally still air: a season’s potential harvest lost to the Skywhips in Bren’s nets, the misallocated effort that could have prepared them all, and the stark, visible proof that a number, however impressive, only tells a story about the world in which it was born. The genes weren't destiny; they were a conversation with the sky. And Bren had only listened to half of it. Torvin, surveying the contrasting results, knew where the future lay. He turned his back on the scholar and his broken number, his gaze fixed on the deep, safe green glow in the west. Action, messy and adaptive, had won over elegant, misplaced certainty. The number hadn't lied. Bren had simply asked it the wrong questions, and believed it held answers it never promised.

  **Note on liberties**

  The story leaned hardest on **heritability's sensitivity to environmental variation** and **the compatibility of high heritability with large environmentally caused shifts in the mean**. It dramatized how a high *h²* estimated under varied conditions implies nothing about the trait's response to a *novel* environmental shift (the mineral infusion) or becomes meaningless under uniform conditions (the Great Calm). It simplified the concept of **genotype-environment interaction** by showing Floaters reacting differently to the minerals initially but uniformly under uniform conditions, though it didn't delve into the mechanics. The plot choice most likely to draw objection is portraying Bren's selected line *losing* its depth advantage entirely in the uniform environment. A statistically literate reader might argue that while the *variance* would collapse and the *h²* would become undefined/near-zero, the *mean* depth of the selected line might still be slightly deeper due to genetic differences, even if not expressed consistently. The story sacrificed this nuance for dramatic impact, showing a complete failure to emphasize the cost of misunderstanding environmental dependence.
