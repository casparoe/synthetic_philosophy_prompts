answer: |-
  Here's a structured breakdown of my credence that a mutual-gains moral compromise exists in the majority (>50%) of genuine value disagreements, along with sensitivity analysis. My final estimate is **64%**.

  ### **Decomposition Framework**
  I'll use your three dispute types, estimate the probability of mutual gains existing for each, weight by their prevalence, and combine. Assumptions: disagreements are *purely* about values (not facts/strategy), both parties are rational with consistent preferences, and "mutual gains" means a compromise *strictly preferred by both* over the other's ideal.

  | **Dispute Type**             | Probability Mutual Gains Exist | Prevalence Weight | Weighted Contribution |
  |------------------------------|--------------------------------|-------------------|------------------------|
  | **Weighting Differences**    | 90%                            | 60%               | 0.90 × 0.60 = 0.54    |
  | **Existence Differences**    | 25%                            | 30%               | 0.25 × 0.30 = 0.075   |
  | **Sacred Values**            | 5%                             | 10%               | 0.05 × 0.10 = 0.005   |
  | **TOTAL**                    | —                              | 100%              | **0.635 (≈64%)**      |

  ---

  ### **Rationale for Estimates**
  1. **Weighting Differences** (e.g., your disease vs. x-risk split):  
     - **Mutual Gains Probability: 90%**  
       If both parties value the same things (e.g., human welfare) but prioritize them differently, compromise is almost always possible. Smooth tradeoffs (like your 70% vs. 10% example) create convex preference sets where intermediate solutions dominate extremes. Exceptions arise only if preferences are sharply non-convex (e.g., threshold effects), but this is rare in weighting disputes.  
     - **Prevalence: 60%**  
       Most common type in practice (e.g., budget allocations, policy tradeoffs). Humans often share core values but disagree on weights.

  2. **Existence Differences** (e.g., one values animal welfare intrinsically, the other does not):  
     - **Mutual Gains Probability: 25%**  
       Gains require *coincidental alignment*: the "non-exister" must indirectly benefit from the compromise (e.g., "I’ll accept vegan subsidies if you support my R&D tax credit"). This is fragile—if the non-exister gains nothing from the exister's goal, compromise feels like a loss. Win-wins exist only where bargaining chips overlap.  
     - **Prevalence: 30%**  
       Common in identity-driven conflicts (e.g., religion, rights) but less frequent than weighting disputes.

  3. **Sacred Values** (e.g., "Never violate bodily autonomy, regardless of outcomes"):  
     - **Mutual Gains Probability: 5%**  
       Sacred values are defined by infinite resistance to tradeoffs. Compromise requires reframing (e.g., making an act *not* a "violation") or finding non-sacred bargaining spaces. Extremely rare for true sacred values.  
     - **Prevalence: 10%**  
       Relatively uncommon outside of deeply held ideologies (e.g., abortion, pacifism). Often overattributed to mere strong preferences.

  ---

  ### **Sensitivity Analysis**
  - **Most Sensitive Parameter: Prevalence of Existence Differences**  
    My credence is highly sensitive to the share of existence disputes. If they dominate, mutual gains become far rarer:  
    - If existence disagreements rise to **50% prevalence** (and weighting falls to 40%, sacred to 10%), total probability drops to **53%**.  
    - If existence disputes hit **60%**, probability falls to **47%** (below majority threshold).  
    *Why?* Existence disputes have low mutual-gains probability (25%), so small increases heavily reduce the overall estimate.

  - **Less Sensitive: Mutual Gains in Weighting Disputes**  
    Even if probability for weighting disputes falls to 70%, the overall credence only drops to **58%** (still >50%). Sacred-value changes have minimal impact due to low prevalence.

  - **Key Movers**:  
    - **Evidence shifting prevalence toward existence disputes** (e.g., studies showing moral disagreements are often about incommensurable values) would lower my credence.  
    - **Evidence that existence disputes admit trades more often** (e.g., via "linked compromises" in negotiation theory) would raise it.  
    - **Proof that sacred values are usually negotiable** (e.g., empirical work on taboo trades) could push credence toward 70%.

  ---

  ### **Caveats**
  - **Power asymmetries** may prevent compromise even if mutual gains exist theoretically.  
  - **Misperception**: Disputes thought to be about values may actually be about facts (e.g., "Will AI kill us all?").  
  - **Non-convexities**: If preferences have sharp thresholds (e.g., "any cut to healthcare >20% is unacceptable"), compromise may not be strictly preferred by both.  

  **Final Credence**: **64%**  
  I believe mutual gains are likely in most cases because weighting disputes dominate, and they’re highly compromise-conducive. But if you convinced me existence disputes are the norm (>50%), my credence would drop sharply—potentially below 50%.
