prompt: |-
  I write for a general-interest magazine about science and ideas, and I'm building an interactive flowchart to run alongside a piece on contested pasts — Atlantis, Anatoly Fomenko's New Chronology, ancient-astronaut readings of carved Mesoamerican sarcophagus lids. Please work as a philosopher of science who takes the demarcation problem seriously, and think it through before drafting: first list the candidate dimensions along which such claims differ (is a falsifier nameable, is the falsifier one that could actually be checked by an outsider, is the proponent's attachment to the claim negotiable, what does the claim imply about the competence or honesty of specialists, does it require a permanent conspiracy of record-keepers), note in a line each dimension you reject and why, and only then build the tree.

  Three constraints. Every node must be a question a general reader can answer about a claim without already suspecting where it leads — never a restatement of the verdict. Each leaf gets a name for the kind of claim it picks out, and at least two leaves must be non-pejorative, each with a sentence on what the tree obscures by filing a claim there. Then run five cases through it: Plato's Atlantis as he actually left it, Fomenko's chronology, an ancient-astronaut reading of a tomb sculpture, and two controls that were treated as crankery before the evidence arrived — Wegener's continental drift and the Norse settlement at L'Anse aux Meadows. If your tree cannot separate the controls from Fomenko, say so plainly instead of quietly adjusting a node until it can.

  Finally, map the combinations of answers your dimensions permit that no real case occupies, and diagnose each empty cell as incoherent, unattractive, or merely unexplored. Close by stating how confident you are that you have the right dimensions, and name the single node you'd most expect a specialist to attack.
reasoning: |-
  Hmm, the user is building an interactive flowchart for a science magazine about contested historical claims like Atlantis or Fomenko's chronology. They want me to approach this as a philosopher of science focusing on the demarcation problem - how to distinguish science from pseudoscience.

  First, I need to identify dimensions that differentiate these claims. The user specified several constraints: every node must be answerable by general readers without knowing the conclusion, include non-pejorative categories, test with five examples (Atlantis, Fomenko, ancient astronauts, plus Wegener's continental drift and L'Anse aux Meadows as controls), and analyze empty cells in the classification.

  For dimensions, I'm considering these key aspects based on philosophical principles:
  - Testability: Can we specify what would disprove this?
  - Accessibility: Could outsiders verify this evidence?
  - Psychological attachment: Do proponents adjust their claims when challenged?
  - Conspiracy requirement: Does this imply permanent deception by experts?
  - Competence assumption: Does it claim all specialists are incompetent?

  I'll reject dimensions that aren't actionable for readers, like "peer-review status" (too insider) or "mathematical rigor" (not universally applicable). 

  For the flowchart structure:
  - Start with testability (Popper's core criterion)
  - Then branch to evidence accessibility 
  - Then psychological negotiability 
  - Finally conspiracy/competence implications

  The leaf categories should include neutral terms like "Speculative Framework" and "Proto-scientific Hypothesis" alongside more critical labels.

  Testing with cases:
  - Plato's Atlantis would likely land in "Inspired Speculation" (testable but not accessible evidence)
  - Fomenko should hit "Pseudoscience" (untestable, requires conspiracy)
  - Ancient astronauts: "Fringe Interpretation" (testable but evidence inaccessible)
  - Wegener: "Proto-scientific Hypothesis" (testable but lacked contemporary verification)
  - L'Anse aux Meadows: "Legitimate Contested Claim" (fully testable/accessible)

  The empty cells reveal interesting gaps - like why no claims are both testable and require permanent conspiracies (too unstable to maintain). My confidence is moderate - the dimensions feel right but the negotiability branch might be vulnerable to specialist criticism.

  This approach should give readers clear thinking tools while acknowledging science's gray areas - exactly what the magazine needs.
answer: |-
  Here is a philosopher-of-science-driven flowchart for evaluating contested historical claims, designed for a general audience. It focuses on *how the claim functions* rather than its content, drawing on demarcation principles while respecting your constraints.

  **Candidate Dimensions Considered & Rejected:**
  1.  **Formal Peer-Review Status:** Rejected. Irrelevant to core epistemic function; many valid historical challenges begin outside journals, and crankery can sometimes appear there.
  2.  **Mathematical Formalism:** Rejected. While useful in some sciences, it's not applicable or necessary for most historical claims.
  3.  **Popularity Among Experts:** Rejected. A potential *consequence* of the claim's nature, not a defining characteristic itself; risks circularity.
  4.  **Age of the Claim:** Rejected. Longevity doesn't determine validity; some ancient ideas hold, some new ones are flawed.
  5.  **Motive of Proponent:** Rejected. Too subjective and difficult for a reader to assess reliably about a claim itself.

  **Selected Dimensions (Focused on Function & Testability):**
  1.  **Falsifiable Core?** Can a specific, concrete piece of evidence or observation be named that, *if found*, would definitively disprove the core claim? (Popperian Core)
  2.  **Evidence Accessible?** If a falsifier exists, could an independent researcher (e.g., a grad student, an archaeologist from another institution) realistically access and evaluate the relevant evidence/data/sites *without special, closed permissions*?
  3.  **Attachment Negotiable?** If faced with a significant challenge (e.g., contradictory evidence, a logical flaw pointed out by a neutral party), does the proponent's framework allow for *meaningful adjustment or concession*, or is the core claim insulated?
  4.  **Requires Permanent Conspiracy?** Does accepting the claim *necessarily imply* that generations of specialists across institutions/cultures have *continuously and deliberately* suppressed or falsified evidence? (Conspiracy Scale)
  5.  **Assumes Universal Incompetence?** Does accepting the claim *necessarily imply* that the vast majority of specialists in the relevant field(s) are *fundamentally incompetent* at their core tasks (e.g., basic dating, translation, stratigraphy)? (Competence Assumption)

  **The Interactive Flowchart:**

  1.  **Can a specific piece of evidence be named that would definitively disprove the core claim?**
      *   **No. -->** **Label:** **Unfalsifiable Narrative.** *What it obscures:* This category captures mythic or deeply ideological frameworks where evidence is interpreted solely through the lens of belief, but it might also include highly abstract philosophical ideas not meant as empirical history.
      *   **Yes. -->** Go to 2.

  2.  **Could an independent researcher realistically access and check this evidence?**
      *   **No. (Evidence is claimed lost, hidden, inaccessible, requires unique insight). -->** Go to 3.
      *   **Yes. -->** Go to 4.

  3.  **If faced with a strong challenge, can the proponent's core claim be meaningfully adjusted?**
      *   **No. (Challenges are dismissed via special pleading, ad-hoc hypotheses, attacking critics). -->** **Label:** **Fringe Interpretation.** *What it obscures:* This captures claims clinging to empirical pretenses but insulated from critique, potentially including some radical but sincere reinterpretations struggling for mainstream tools.
      *   **Yes. -->** **Label:** **Speculative Framework.** *What it obscures:* This includes serious but currently unsupported hypotheses that *could* evolve with new evidence or methods, distinct from dogmatic fringe views.

  4.  **Does accepting this claim require believing in a permanent, deliberate conspiracy by specialists?**
      *   **Yes. -->** **Label:** **Pseudoscience.** (Note: This inherently answers Q5 with "Yes" as well).
      *   **No. -->** Go to 5.

  5.  **Does accepting this claim require believing the vast majority of specialists are fundamentally incompetent at their core tasks?**
      *   **Yes. -->** **Label:** **Revolutionary but Flawed Challenge.** (Captures overly ambitious rejections of established methods/competence).
      *   **No. -->** **Label:** **Legitimate Contested Claim.** (The core dispute is about interpretation of accessible evidence within established methodological competence).

  **Testing the Cases:**

  1.  **Plato's Atlantis (as written):**
      *   Q1: **Yes.** (Find the specific location described in Critias/Timaeus with the described features *in the timeframe given*; evidence of Athenian victory over it ~9000 BC).
      *   Q2: **No.** (The location/evidence is lost/drowned; requires unique insight into Plato's meaning or undiscovered ruins).
      *   Q3: **Yes.** (Plato presents it as allegory/myth; proponents *could* adjust interpretations without abandoning core themes). --> **Speculative Framework.**

  2.  **Fomenko's New Chronology:**
      *   Q1: **Yes.** (Find original, reliably dated documents/artifacts *within* the standard chronology that Fomenko rejects, showing events happened where/when standard history says).
      *   Q2: **Yes.** (Documents, coins, inscriptions in museums/libraries are accessible).
      *   Q4: **Yes.** (Requires continuous fabrication/destruction of records by scribes, scholars, governments for centuries). --> **Pseudoscience.**

  3.  **Ancient Astronaut Tomb Sculpture Reading:**
      *   Q1: **Yes.** (Find unambiguous evidence within the culture's own records/art describing the figure as an extraterrestrial visitor/technology, distinct from gods/spirits).
      *   Q2: **No.** (Evidence hinges on reinterpreting symbolic art; "true meaning" claimed lost or requires unique insight). --> *Go to Q3.*
      *   Q3: **No.** (Challenges met with claims of "mainstream blindness," special knowledge, or shifting interpretations). --> **Fringe Interpretation.**

  4.  **Wegener's Continental Drift (Pre-Plate Tectonics Evidence):**
      *   Q1: **Yes.** (Find evidence continents *haven't* moved relative positions over geological time, or that the proposed mechanisms are physically impossible).
      *   Q2: **Yes.** (Fossil distributions, geological formations, continental shapes were observable).
      *   Q4: **No.** (Didn't accuse paleontologists/geologists of deliberate fraud, just misinterpretation). *Go to Q5.*
      *   Q5: **Yes (Initially).** (His mechanism was weak; accepting his drift *then* implied geophysicists were fundamentally wrong about crustal mechanics). --> **Revolutionary but Flawed Challenge.**

  5.  **Norse Settlement at L'Anse aux Meadows (Pre-Discovery):**
      *   Q1: **Yes.** (Find physical evidence of Norse habitation in North America outside Greenland - settlement ruins, specific artifacts like Norse tools/weapons, distinct from later European).
      *   Q2: **Yes.** (Coastline was accessible for survey/excavation).
      *   Q4: **No.** (Didn't require conspiracy; just that evidence hadn't been found/recognized yet). *Go to Q5.*
      *   Q5: **No.** (Didn't claim archaeologists were incompetent; claimed they hadn't looked in the right place or recognized subtle evidence). --> **Legitimate Contested Claim.**

  **Separation of Controls:** The tree cleanly separates Fomenko (Pseudoscience) from both Wegener (Revolutionary but Flawed Challenge) and L'Anse aux Meadows (Legitimate Contested Claim). Wegener lands in a different category due to the strong "Universal Incompetence" implication of his initial, mechanism-less challenge to geophysics.

  **Empty Cells & Diagnosis:**

  The flowchart dimensions create a combinatorial space. Here are significant empty cells:

  1.  **Falsifiable + Evidence Accessible + Attachment Negotiable + Requires Conspiracy + Assumes Incompetence:** *Incoherent.* If evidence is accessible and falsifiable, a permanent conspiracy is implausible. If attachment is negotiable, assuming *universal* incompetence is contradictory.
  2.  **Falsifiable + Evidence *In*accessible + Attachment Negotiable + Requires Conspiracy:** *Unattractive/Unexplored.* Why posit a conspiracy if the evidence is inaccessible anyway? If attachment is negotiable, conspiracy seems an unnecessary complication. Few serious claims structure themselves this way.
  3.  **Falsifiable + Evidence *In*accessible + Attachment *Non*-Negotiable + *No* Conspiracy + *No* Incompetence:** *Unexplored/Unlikely.* Claims insulated from challenge (non-negotiable) but not blaming malice or incompetence for lack of evidence are rare. Might fit very abstract metaphysical claims misapplied to history.
  4.  **Unfalsifiable + Requires Conspiracy:** *Unattractive/Incoherent.* If the core claim is unfalsifiable, positing a conspiracy to hide non-existent falsifiable evidence is illogical. Blame usually shifts to "suppressing truth" via other means (e.g., ridicule, funding denial).

  **Confidence & Vulnerability:**

  *   **Confidence:** Moderately High (7/10). The dimensions capture crucial functional differences (testability, insulation, blame structure) relevant to demarcation and historical reasoning. They avoid content bias and are user-answerable.
  *   **Most Vulnerable Node:** **Q3: Attachment Negotiable?** This is the hardest for a reader to judge definitively about a *claim* (vs. a specific proponent) and the most psychologically nuanced. Specialists might argue it's too subjective or that even "good" science can exhibit temporary dogmatism. It's crucial, however, for distinguishing rigid pseudoscience/fringe from genuinely open (if speculative) inquiry. A critic might suggest replacing it with a focus on the *structure* of the claim (e.g., "Are auxiliary hypotheses used primarily to protect the core from falsification?"), though this is harder for a general reader to assess directly.

  This tree provides readers with clear, philosophical tools to analyze contested claims based on *how they engage with evidence and criticism*, not just their conclusion. It highlights the critical roles of testability, accessibility, intellectual flexibility, and the scale of assumed error/malice required.
