prompt: |-
  Teaching decision theory next term and was skimming one of those pop-philosophy books students always cite, and it's got this paragraph on the Pasadena paradox that I'm pretty sure is wrong in at least a couple places but I want to be sure I'm not overreacting. Here's the passage:

  'The Pasadena game goes like this: flip a fair coin until you get heads. If it takes n flips, you win (−1)^(n−1) × 2^n/n dollars — so you gain on odd n and lose on even n. The expected value is the alternating harmonic series, which sums to ln(2), about 69 cents. So you should be willing to pay anything less than that to play. The twist is that because the series converges only conditionally, you can rearrange its terms to produce any expected value you want — make it a million dollars, make it negative a million. The upshot is that expected value theory can't handle games with conditionally convergent payoffs, since the result is just an artefact of how you describe the game.'

  I've got three worries but I'd love a systematic take. First: is the expected value actually ln(2)? My recollection is that's only true under one particular ordering of the state space, and that the whole point is there's no privileged ordering — so saying 'the expected value is 69 cents' is already begging the question. Second: what does 'rearranging the terms' cash out to, physically? Like, are we actually changing the game or just redescribing it? The summary makes it sound like a cheap trick about description, but I dimly recall Nover and Hájek making a deeper point about the lack of a canonical ordering of states. Third: is the moral right? Does conditionally convergent expectation really mean expected value theory 'can't handle' the game, or just that we need to be more careful? Go ahead and be pedantic, I want to know which sentences I'd have to correct if a student wrote this.
reasoning: |-
  Okay, I need to help this user who's teaching decision theory and is concerned about a passage from a pop-philosophy book on the Pasadena paradox. The user has three main worries, and I should address each systematically. Let me start by recalling what the Pasadena paradox involves.

  The game described involves flipping a fair coin until heads appears. The payoff is (−1)^(n−1) × 2^n / n for n flips. The book claims the expected value is ln(2), about 69 cents, and that due to conditional convergence, rearranging terms can change the expected value arbitrarily. The user questions whether the expected value is truly ln(2), what "rearranging terms" means physically, and if conditional convergence implies expected value theory can't handle such games.

  First, I need to verify if the expected value is indeed ln(2). The series in question is the alternating harmonic series: ∑_{n=1}^∞ (-1)^{n-1} / n, which converges to ln(2). However, in probability, the expectation is typically calculated by summing over the sample space ordered by n (the number of flips). Each outcome has probability (1/2)^n, and the payoff is as given. So the expectation series is ∑_{n=1}^∞ (1/2)^n * (-1)^{n-1} * 2^n / n. Let me compute that.

  (1/2)^n * 2^n = 1, so it simplifies to ∑_{n=1}^∞ (-1)^{n-1} / n, which is indeed the alternating harmonic series summing to ln(2). But here's the catch: this series is conditionally convergent. Riemann's rearrangement theorem states that such series can be rearranged to converge to any real number, or diverge. So, when the book says "the expected value is ln(2)", it's implicitly assuming the standard ordering by n. But is this ordering privileged? In probability theory, the expectation is defined as a sum over the sample space, but for infinite discrete spaces, the order matters if the series isn't absolutely convergent. Absolute convergence would require ∑ |payoff| * probability to converge, but here |(-1)^{n-1} * 2^n / n| * (1/2)^n = 1/n, and ∑ 1/n diverges (harmonic series). So yes, the series is conditionally convergent, and the expectation depends on the order of summation.

  On to the user's first worry: stating "the expected value is 69 cents" is indeed misleading because it presumes a specific ordering without justification. The key point is that without a canonical ordering, we can't uniquely define the expectation.

  Second worry: what does "rearranging terms" mean physically? Rearrangement in the mathematical sense corresponds to changing the order in which we consider the outcomes. But physically, the game's structure naturally orders outcomes by n (number of flips). However, the paradox highlights that this ordering isn't inherently special. If we redescribe the game by reordering the outcomes—like grouping outcomes differently—we could compute different expectations. For example, we might pair an odd-n outcome with a higher even-n outcome to skew the sum. But this changes how we enumerate states, not the game itself. Nover and Hájek's point is deeper: since there's no physical reason to prefer one ordering over another, the expectation is ill-defined. So, rearrangement isn't a trick; it exposes a flaw in applying expectation to such games without absolute convergence.

  Third worry: is the moral correct? Does conditional convergence mean expected value theory "can't handle" the game? Well, strictly speaking, standard expected utility theory (EUT) assumes absolute convergence or finite expectations. So for such pathological games, EUT doesn't provide a defined expectation. But it's not that EUT is useless; rather, we need extensions or different decision rules. Some solutions proposed are using weak expectations (if they exist), discounting future payoffs, or applying a "principle of indifference" to orderings. However, these are still debated. The book's claim that "expected value theory can't handle" it is somewhat correct but oversimplified. The deeper issue is the lack of a privileged ordering.

  So, corrections needed if a student wrote this:
  1. The expected value isn't uniquely ln(2); it's order-dependent.
  2. Rearrangement isn't just a description trick; it reflects a physical ambiguity in ordering states.
  3. The moral is partly right: standard EUT fails here, but it's not entirely incapable—extensions might help, though they're contested.
answer: |-
  You're right to be skeptical—this passage oversimplifies the Pasadena paradox and misrepresents key philosophical and mathematical nuances. I'll break this down systematically, addressing your three concerns and correcting the passage sentence by sentence. The core issue is that **conditional convergence exposes an ambiguity in defining expected value for games with infinite state spaces when no canonical ordering exists**, not that expected value theory is inherently incapable. Let's dissect:

  ### 1. **Is the expected value actually ln(2)?**
     - **The claim**: "The expected value is the alternating harmonic series, which sums to ln(2)."
     - **The problem**: This is misleading. The series ∑<sub>n=1</sub><sup>∞</sup> (-1)<sup>n-1</sup> / n *does* converge to ln(2) under the **standard ordering by *n*** (number of flips). However, this ordering is arbitrary—there is no *principled reason* to privilege it. Expected value is formally defined as a sum over the sample space, but for infinite spaces, the sum's value can depend on the order of summation if absolute convergence fails (which it does here).
     - **Why?**: 
       - The probability of outcome *n* (first heads on flip *n*) is (1/2)<sup>n</sup>.
       - The payoff is (-1)<sup>n-1</sup> · 2<sup>n</sup> / n.
       - So the expected value series is ∑<sub>n=1</sub><sup>∞</sup> [ (1/2)<sup>n</sup> ] · [ (-1)<sup>n-1</sup> · 2<sup>n</sup> / n ] = ∑<sub>n=1</sub><sup>∞</sup> (-1)<sup>n-1</sup> / n.
       - This series is **conditionally convergent** (since ∑ |(-1)<sup>n-1</sup>/n| = ∑ 1/n diverges), so Riemann's rearrangement theorem applies: reordering terms can make it converge to any real number or diverge.
     - **Your worry is correct**: Stating "the expected value is ln(2)" begs the question by implicitly assuming the standard ordering. In reality, there is no unique expected value—it's order-dependent.

  ### 2. **What does "rearranging terms" mean physically?**
     - **The claim**: "You can rearrange its terms to produce any expected value [...] The upshot is that expected value theory can't handle games [...] since the result is just an artefact of how you describe the game."
     - **The problem**: This trivializes the paradox as a mere "description trick." In fact, rearrangement has a deeper physical interpretation tied to **how we partition and order the state space**.
       - **Mathematical rearrangement** = Changing the order in which we sum the outcomes (e.g., grouping outcomes in a non-sequential order like 1st, 3rd, 2nd, 5th, 4th, ...).
       - **Physical interpretation**: This corresponds to redescribing the game by **redefining how states are enumerated or grouped**. Crucially, there is no *physical* reason to prefer one ordering over another. For example:
         - The "natural" ordering (by *n*) seems intuitive but isn't mandated by the game mechanics—it's a modeling choice.
         - A rearrangement might group outcomes differently (e.g., pairing outcome *n=1* with *n=2k* for large *k*), altering the partial sums.
       - **Nover and Hájek's point (as you recall)**: The paradox reveals that **no canonical ordering exists** for the state space. The game doesn't specify how to "sequence" the outcomes, so we lack a privileged way to compute the sum. This isn't just a notational issue—it's a gap in the standard definition of expected value for infinite state spaces.
     - **Your intuition is spot-on**: Rearrangement isn't a "cheap trick"; it highlights a genuine ambiguity in applying expected value theory to such games.

  ### 3. **Is the moral right? Does conditional convergence break expected value theory?**
     - **The claim**: "Expected value theory can't handle games with conditionally convergent payoffs."
     - **The problem**: This overstates the case. Expected value theory *can* handle such games, but it requires **additional structure or decision-theoretic refinement**:
       - **Standard expected utility theory (EUT) fails** here because it assumes the expectation is well-defined (i.e., finite or absolutely convergent). Conditional convergence violates this.
       - **Solutions exist** (though they're debated):
         - **Weak expectations**: Restrict to orderings where the series converges, but this doesn't resolve ambiguity (e.g., Lauwers 2010).
         - **Discounting**: Add a temporal discount factor to ensure absolute convergence (e.g., discount future payoffs by δ<sup>n</sup>, δ < 1).
         - **Decision rules beyond expectation**: Use minimax, rank-dependent utility, or other criteria (e.g., Seidenfeld et al. 2009).
         - **"Physical" privilege**: Argue that the coin-flip sequence *does* impose a natural ordering (by *n*), making ln(2) the valid expectation. Critics note this is still conventional.
       - **The upshot**: Conditionally convergent expectations aren't "unhandleable"—they reveal a limitation in the *standard definition* of expected value when absolute convergence fails. The theory needs refinement, not abandonment.

  ---

  ### **Corrections for Student Submissions**
  If a student replicated this passage, here's what to flag (key corrections in bold):

  > "The Pasadena game goes like this: flip a fair coin until you get heads. If it takes n flips, you win (−1)^(n−1) × 2^n/n dollars — so you gain on odd n and lose on even n. **Under the standard ordering by n, the expected value series is the alternating harmonic series, which sums to ln(2), about 69 cents. However, this value is order-dependent due to conditional convergence.** ~~So you should be willing to pay anything less than that to play.~~ **Thus, recommending a willingness to pay based on ln(2) is unjustified.** The twist is that because the series converges only conditionally, you can rearrange its terms **in the mathematical sum** to produce any expected value you want — make it a million dollars, make it negative a million. **This rearrangement corresponds to redescribing the game via a non-standard ordering of states, which lacks a physical basis.** The upshot is that **standard** expected value theory **fails to define a unique expectation for such games, as it depends on an arbitrary choice of state ordering** ~~can't handle games with conditionally convergent payoffs, since the result is just an artefact of how you describe the game~~."

  ---

  ### **Why This Matters for Teaching**
  - **Philosophical depth**: Emphasize that the paradox isn't about "tricks" but challenges the *definition* of expectation in infinite contexts (cf. Hájek & Nover's "Perplexing Expectations").
  - **Mathematical rigor**: Stress that expectation requires absolute convergence for order-invariance. Use the Pasadena game to show why ∑ |payoff| × prob must converge for EUT to apply cleanly.
  - **Pedagogical fix**: Introduce solutions like discounting to "tame" the paradox. For advanced students, discuss density expectations (Easwaran 2008) or decision rules that avoid expectation altogether.

  This passage confuses a *limitation* of standard EUT with an *impossibility*. You're not overreacting—it's a common oversimplification in pop sources. For students, pivot to the insight: **conditionally convergent expectations demand explicit justification for state-space orderings, which decision theory often overlooks.**
