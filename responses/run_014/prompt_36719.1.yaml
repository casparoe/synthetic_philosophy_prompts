prompt: |-
  I run a philosophy discussion group — a dozen graduate students, mixed subfields, comfortable with expected utility and with causal and evidential decision theory from a seminar unit, and they have already watched causal decision theory lose Newcomb's problem to a show of hands. Next session is ninety minutes, one whiteboard, and I want to teach updateless decision theory: the idea that a rational agent chooses the best policy or decision function in advance and then acts from it, rather than updating on each observation and deciding afresh. Plan how I should explain it, rather than explaining it to me. What has to be established before the updateless move can be presented as a response to a problem rather than an eccentric taste, and in what order does the material have to go? Which example should carry the session — I am torn between the standard counterfactual mugging and something less pre-loaded, since I suspect the mugging smuggles in exactly the intuition about the other branch that the session needs to earn — and what must that carrying example have, and lack? Which misconceptions should I expect — I have already caught one student saying updatelessness means never updating on evidence at all, and another treating it as ordinary precommitment that you are simply unlucky not to have already made — and at exactly which point in the sequence should each be headed off? I have also drafted my own variant, which I call the sealed verdict: the coin is flipped and its outcome sealed before anyone chooses, and the group must adopt a single policy that individual members, later assigned to different branches, are then bound to execute. Where should I deploy it, and what should it be doing that the standard examples cannot — is it a check or a teaching load-bearing element? Close with one question I can ask at the end that would reveal whether they have the idea rather than the slogan, ideally one whose updateless and intuitive answers come apart in a way we have not yet discussed. And tell me what I should openly refuse to cover at this level — I am thinking logical uncertainty, proof-based agents, and disputes about which mathematical facts a decision can be correlated with — and where to draw that line so that it reads as a statement of scope rather than evasion.
reasoning: |-
  We are introducing updateless decision theory to a group of graduate students who are familiar with expected utility, causal decision theory (CDT), and evidential decision theory (EDT). They have seen CDT lose in Newcomb's problem. The goal is to present updatelessness as a solution to a problem, not just an eccentric idea.

  ### Key Points to Establish Before Introducing Updatelessness
  1. **Revisit the problem with CDT and EDT**: Remind them of Newcomb's problem and why CDT fails (it ignores the correlation between the prediction and the action). Also, note that while EDT works in Newcomb, it fails in other problems (e.g., smoking lesion, where it recommends not smoking because it correlates with not having the lesion, even though smoking doesn't cause the lesion).

  2. **Introduce a problem that both CDT and EDT fail at**: We need a problem where both established theories give the wrong answer. This sets the stage for updatelessness as a necessary response.

     - **Counterfactual Mugging (CM)** is a standard example. However, you are concerned that it might pre-load the intuition about the other branch. Let's analyze:
          - In CM: Omega flips a fair coin. If heads, Omega asks you for $100. If tails, you win $10,000 only if you would have paid if heads. Both CDT and EDT refuse to pay in the heads situation because the decision doesn't affect the past and in the actual branch you lose $100. But the pre-commitment to pay would have been rational because the expected value is positive: (0.5 * -100) + (0.5 * 10000) = 4950.
          - The issue: In the heads branch, the intuitive answer is not to pay because you don't get the $10,000. The updateless view requires you to ignore the branch you are in and follow the policy that would have been best ex-ante.

     - Alternative: **Parfit's Hitchhiker** (but that's similar to Newcomb) or **Transparent Newcomb** (where you are told the prediction). However, let me suggest a less pre-loaded example: **The XOR Blackmail**.

     **XOR Blackmail** (to avoid pre-loading):
          - You are told that a predictor has predicted whether you will pay $100 to prevent a letter being opened. The letter contains information that, if revealed, will cause you to lose $1000. However, the blackmailer sends the letter only if they predicted you would not pay. Moreover, there is an independent coin flip: if heads, the blackmailer uses predictor A; if tails, predictor B. Both predictors are highly accurate, but they are not infallible. The catch: you are told the outcome of the coin flip (so you know which predictor was used) but not the prediction. Then you are asked to pay or not.
          - The problem: If the predictor is accurate, then if you are in a branch where the coin flip was heads, then if you pay, it's likely the predictor predicted you would pay, so the letter was not sent and you don't lose $1000. But if you don't pay, then the predictor likely predicted non-payment and sent the letter. However, the same applies for tails. But here's the twist: the predictors are such that they are conditionally independent given your actual disposition? (This might be too complex.)

     Alternatively, let's stick with **Counterfactual Mugging** but reframe it to avoid pre-loading the other branch. We can present it without initially emphasizing the other branch.

     **Recommendation**: Use **Counterfactual Mugging** as the main example because it is simple and directly illustrates the issue. To avoid the problem of smuggling in the intuition, we can start by asking what they would do without the policy perspective, then show the failure of CDT and EDT, and then introduce the policy view.

  3. **The concept of a policy**: Before introducing updatelessness, we must establish that a rational agent can choose a policy (a function from observations to actions) in advance. This is the key shift: from choosing actions at each information state to choosing the entire function.

  ### Sequence of the Session

  1. **Review and Motivation (10 minutes)**:
     - Briefly recap Newcomb's problem and why CDT fails (it two-boxes and gets $1000, while one-boxing would have gotten $1,000,000). Note that EDT one-boxes and gets $1,000,000, but then point out that EDT fails in other cases (like the smoking lesion).
     - Introduce Counterfactual Mugging and ask the students: "If you are in the heads branch (where Omega asks for $100), should you pay?" Let them vote. Then ask: "If you could precommit in advance to pay if heads, would you?" (Most will say yes because the expected value is positive.) Then note: Without precommitment, you don't pay because you are in the heads branch and paying doesn't get you the $10,000 (it's already lost). But if you don't pay, then in the tails branch you don't get the $10,000. So the problem is that without precommitment, you end up with $0 in both branches? Actually, in tails you get nothing because you didn't precommit? Let me clarify:

          - Without precommitment: 
              - Heads: You don't pay -> outcome: $0.
              - Tails: You don't pay -> outcome: $0 (because you didn't pay in the counterfactual heads branch).
          - With precommitment to pay:
              - Heads: You pay -> outcome: -$100.
              - Tails: You get $10,000.

          Expected value of precommitment: 0.5*(-100) + 0.5*(10000) = 4950.

          Without precommitment, the expected value is 0.

          So the precommitment is better.

     - The problem: When you are in the heads branch, you have no incentive to pay because the $10,000 is already gone (if tails) or not to be had (if heads). But if you don't pay, then in the tails branch you don't get the $10,000. So the decision in the heads branch affects the outcome in the tails branch? No, it doesn't. The outcome in the tails branch is determined by what you would have done in the heads branch. This is a counterfactual dependency.

     - Point out that both CDT and EDT will not pay in the heads branch. CDT: paying causes a loss of $100 and doesn't cause the $10,000 (which is already determined). EDT: paying is evidence that you are in the heads branch (so you lose $100) and doesn't give evidence of getting $10,000 because that's in the tails branch. So both say: don't pay.

     - This sets up the problem: individually, at the time of decision, paying is irrational. But collectively, the policy of paying is better.

  2. **Introduce the Policy View (Updatelessness) (20 minutes)**:
     - Explain that a rational agent should not just choose actions at each point but should choose the entire policy (a function from the information states to actions) that maximizes expected utility from the initial perspective (before any observations).
     - In Counterfactual Mugging, the policy "pay if asked" has an expected utility of 4950, while the policy "never pay" has 0. So we choose the policy "pay if asked".
     - Then, when the agent is in the heads branch, they follow the policy and pay even though at that moment it seems like a loss. Why? Because the policy was chosen to maximize the overall expected utility.

  3. **Addressing Misconceptions**:
     - **Misconception 1: Updatelessness means never updating on evidence at all.**
          - When: Right after introducing the policy view.
          - How to head off: Clarify that updatelessness does not mean ignoring evidence. We update our beliefs about the state of the world (so we condition on our observations) but we do not update the policy. We fix the policy at the beginning and then follow it. So in the heads branch, we update our belief: we know the coin is heads. But the policy says "if heads, pay", so we pay. The policy was chosen at the beginning, taking into account all possible observations and the probabilities of each.

     - **Misconception 2: Updatelessness is just ordinary precommitment that you are unlucky not to have made.**
          - When: When discussing the implementation of the policy.
          - How to head off: Precommitment is a mechanism to bind yourself to a policy. Updatelessness is the decision theory that says you should follow the best policy even without external precommitment. It is a norm for rational choice. The idea is that rationality requires you to act as if you had precommitted to the best policy. In Counterfactual Mugging, even without physical precommitment, you should pay in the heads branch because that's what the best policy dictates.

  4. **Sealed Verdict Variant (15 minutes)**:
     - This is a good way to illustrate the policy choice without the distraction of being able to change your mind. Present it as follows:
          - The coin is flipped and sealed. The group must choose a policy (a function from the coin outcome to an action) without knowing the outcome. Then, when the outcome is revealed, the member in that branch must carry out the action.
          - In this setup, the group chooses the policy that maximizes the expected utility. For the mugging: they choose to pay if heads and not if tails? Actually, in the mugging, the action in tails is irrelevant because the payment is only asked in heads. But note: the policy must specify what happens in each branch. The policy is: if heads, pay; if tails, do nothing (and collect $10,000 if the policy for heads was to pay?).
          - The sealed verdict makes the policy choice explicit and forces the group to choose a complete policy in advance. It also prevents any temptation to defect in the heads branch because the policy is fixed and binding.
          - **Role**: It is a teaching load-bearing element because it forces the students to think about the entire policy and the fact that the policy is chosen before knowing the state. It also clearly separates the two roles: the planner (who chooses the policy) and the executor (who follows the policy in the assigned branch). This is exactly the updateless perspective.

  5. **Contrast with CDT and EDT (10 minutes)**:
     - Show how CDT and EDT would decide in the Counterfactual Mugging when in the heads branch: they both decide not to pay. Then show that the policy that they would have chosen at the beginning (if they could) would have been to pay. So the inconsistency: the agent at time 0 wants the agent at time 1 (in the heads branch) to pay, but the agent at time 1 doesn't.

  6. **Discussion and Q&A (10 minutes)**.

  ### The Carrying Example: Counterfactual Mugging
  It must have:
     - A clear ex-ante expected value calculation for the policy.
     - A situation where the action in one branch affects the outcome in another branch only counterfactually (so that when in that branch, the action seems to have no causal effect on the desired outcome).
     - The property that the best policy is different from the action that seems best at the time of the decision.

  It must lack:
     - A causal link between the action and the outcome in the other branch (so that CDT doesn't see a reason to act).
     - A direct evidential link that EDT can exploit (in the mugging, EDT doesn't see evidence that paying will get the $10,000 because that's only in the tails branch).

  ### One Question to Reveal Understanding
  At the end, ask: 
     "In Counterfactual Mugging, suppose you are in the heads branch. You know that the coin came up heads, so you are asked for $100. According to updateless decision theory, should you pay? Why? And what would CDT and EDT say?"

     The correct updateless answer: Yes, because the best policy (chosen ex-ante) was to pay in this situation, and following that policy leads to the highest expected utility overall.

     But then ask a twist: 
     **New Question**: "Suppose you are in the heads branch, but you have the option to renege on the policy. You can choose not to pay even though the policy says to pay. Would it be rational to renege? Why or why not?"

     The updateless answer: It would not be rational to renege because the policy was chosen to maximize expected utility, and deviating would lead to a worse outcome in the tails branch (if we consider that the same policy must be followed in all branches). However, note that in the moment, reneging only affects the current branch? Actually, the problem is that if you renege, then in the tails branch you don't get the $10,000 (because Omega knew you would renege? Or because the policy is broken?). But in the standard setup, the counterfactual is fixed by the policy you are following. However, if you renege, then the policy you are following is not the one that would have paid in heads, so in tails you don't get the money.

     Alternatively, we can ask a question about a different scenario to avoid repetition:

     **The Absent-Minded Driver (AMD)**: 
          - The driver is at the first intersection and doesn't remember if they have passed any. They can exit (get $0) or continue (get $4 if they exit at the second, but if they continue at the second they get $1). The intersections are identical. The optimal policy is to continue with probability p, but let's focus on pure strategies: if they always continue, they get $1. If they exit at the first, they get $0. If they exit at the second, they get $4. But they don't know which intersection they are at.

     Question: "In the Absent-Minded Driver, what policy should the driver adopt at the beginning? And when at an intersection, what should they do? How does updateless decision theory apply?"

     The updateless solution: The driver chooses a policy for both intersections (which are identical). The policy must be the same at both. The possible policies are:
          - Always exit: then they exit at the first intersection -> $0.
          - Always continue: then they continue at both -> $1.
          - Exit at the second: but they cannot condition on which intersection, so they must use the same action at both. So they cannot have a policy that sometimes exits at the first and sometimes at the second? Actually, they can use a mixed policy. But for simplicity, if we restrict to deterministic, then the best is to always continue? Not exactly: if they always continue, they get $1. But if they could exit at the second, they can't because they don't know which intersection.

     Actually, the optimal deterministic policy is to continue? Then they get $1. But the optimal mixed policy is to continue with probability 2/3 at each intersection, which gives expected payoff of (2/3)*(2/3)*1 + (2/3)*(1/3)*4 + (1/3)*0 = (4/9)*1 + (4/9)*4 = 4/9 + 16/9 = 20/9 ≈ 2.22.

     But this might be too complex. Let me suggest a simpler twist on the mugging:

     **Asymmetric Counterfactual Mugging**: 
          - The coin is biased: heads with 0.9, tails with 0.1. In heads, you are asked to pay $100. In tails, you get $10,000 if you would have paid in the heads branch. Then ask: 
          "What is the best policy? And if you are in the heads branch, should you pay?"

          The expected utility of the policy "pay if asked": 
              Heads (0.9): -100
              Tails (0.1): 10000
              Total: 0.9*(-100) + 0.1*(10000) = -90 + 1000 = 910.

          The policy "never pay": 0.

          So the best policy is to pay.

          Now, if you are in the heads branch (which is very likely), paying seems very bad because you are losing $100 and you don't get the $10,000 (which is only in the unlikely tails). But updatelessness says: follow the policy. The intuition might be to not pay because the branch you are in is heads and the tails branch is very unlikely. But the policy was chosen when the probability of heads was 0.9 and tails 0.1, and it still came out positive.

          This question reveals if they are thinking from the ex-ante perspective or updating too much.

          So the question: 
          "In the asymmetric counterfactual mugging (heads 90%, tails 10%), you are in the heads branch. Should you pay? What does updatelessness say? What would CDT and EDT say?"

          Answer: 
          - Updatelessness: pay.
          - CDT: don't pay because it causes a loss and doesn't cause the gain (which is in tails and already fixed).
          - EDT: don't pay because paying is evidence that you are in the heads branch (so you lose $100) and doesn't give evidence of the tails branch (which is very unlikely now that you are in heads? Actually, EDT might condition on the fact that you are in heads? Then it would say: given you are in heads, paying loses $100 and you don't get the $10,000 regardless, so don't pay.

          But note: the updateless decision is to pay even in the asymmetric case because the policy was chosen when the probabilities were 0.9 and 0.1 and it had a positive expected utility.

          This is a good test because the intuitive answer might be to not pay in the asymmetric heads branch (since tails is so unlikely and you are almost certainly losing $100). But the updateless answer is to pay.

  ### What to Refuse to Cover
     - **Logical uncertainty**: The problem of making decisions when the outcome depends on mathematical facts that you are uncertain about (e.g., the halting problem). Say: "We are focusing on empirical uncertainty for now, not logical uncertainty."
     - **Proof-based agents**: These are a way to handle logical uncertainty but are beyond the scope of this session.
     - **Disputes about which mathematical facts a decision can be correlated with**: This is a deep issue in UDT (updateless decision theory) that we won't have time to cover. We are sticking to cases where the uncertainty is about empirical facts (like coin flips) and the correlations are given by the problem.

     Draw the line by stating: "Today, we are focusing on the core idea of updatelessness in problems with empirical uncertainty and known probabilities, without delving into logical uncertainty or the foundations of mathematical correlation."

  ### Timing Breakdown
     - Review and Motivation: 10 minutes
     - Counterfactual Mugging and the Failure of CDT/EDT: 15 minutes
     - Introducing Updatelessness and Policy View: 15 minutes
     - Addressing Misconceptions: 5 minutes
     - Sealed Verdict: 15 minutes
     - Asymmetric Counterfactual Mugging Question: 10 minutes
     - Q&A and Wrap-up: 20 minutes (but adjust as needed)

  Total: 90 minutes.

  Note: The sealed verdict can be presented as a group activity to make it more engaging.

  This plan should provide a clear path to understanding updatelessness as a solution to a problem and avoid common misconceptions.
answer: |-
  ### Teaching Plan: Updateless Decision Theory (UDT)  
  **Goal:** Present UDT as a necessary solution to decision problems where CDT and EDT fail, not as an eccentric choice. Focus on the shift from updating-and-deciding to policy selection.

  ---

  ### **Step 1: Establish the Problem (20 mins)**  
  *Why UDT? Show a flaw in CDT/EDT that demands a new approach.*  
  - **Recap Newcomb’s Problem (5 mins):**  
    - CDT fails (two-boxing loses $1M). EDT works but is flawed elsewhere (e.g., Smoking Lesion).  
    - *Whiteboard:* Matrix of decisions vs. predictions.  
  - **Introduce a New Failure Case (15 mins):**  
    - **Example: Counterfactual Mugging (CM)**  
      - *Setup:* Omega flips a fair coin. Heads: Omega asks for $100. Tails: You get $10,000 iff you would have paid if heads.  
      - *Problem:* If the coin lands heads, CDT/EDT refuse to pay (no causal benefit/evidence of gain). But precommitting to pay nets +$4,950 in expectation.  
    - *Why CM?*  
      - Forces a clash between **individual branch rationality** (don’t pay in heads) and **ex-ante optimality** (commit to pay).  
      - Avoids pre-loaded intuitions by framing branches symmetrically. *Crucial:* Emphasize that *your decision affects outcomes in other branches* via Omega’s counterfactual.  
    - *Poll:* Ask students what they’d do in the heads branch. Then ask if they’d precommit. Highlight the conflict.  

  ---

  ### **Step 2: Introduce Updatelessness (25 mins)**  
  *From actions to policies. UDT as the resolution.*  
  - **The Policy Shift (10 mins):**  
    - Define a **policy** (decision function): A mapping from possible observations (e.g., coin flip outcomes) to actions.  
    - *Analogy:* Choosing a strategy for a game in advance, rather than deciding moves turn-by-turn.  
    - *Key insight:* Rationality maximizes *ex-ante* expected utility (EU) by selecting the best policy *before* observations.  
  - **Apply UDT to CM (10 mins):**  
    - Policy A: "Pay if asked." Ex-ante EU: \(0.5 \times (-100) + 0.5 \times 10,000 = \$4,950\).  
    - Policy B: "Never pay." Ex-ante EU: \$0.  
    - UDT chooses Policy A. When heads occurs, you pay *because it’s part of the optimal policy*.  
  - **Address Misconceptions (5 mins):**  
    - *"UDT means never updating on evidence":*  
      - **Clarify now:** UDT *updates beliefs* (e.g., "I see heads"), but *does not update the policy*. Policies are fixed ex-ante.  
      - *Example:* In CM, you learn the coin flip but still follow Policy A.  
    - *"UDT is just precommitment":*  
      - **Clarify now:** UDT is a *normative theory* for rational choice, not a tactic. It applies even without external commitment mechanisms.  
      - *Contrast:* Precommitment *enforces* UDT; UDT justifies *why* you should precommit.  

  ---

  ### **Step 3: Deepen Understanding with "Sealed Verdict" (25 mins)**  
  *Leverage your variant to make UDT concrete and inescapable.*  
  - **Sealed Verdict Setup (5 mins):**  
    - Coin flipped, outcome sealed. Group chooses a *single binding policy* for all branches. Members later assigned to a branch must execute the policy.  
  - **Why Use It?**  
    - *Role:* **Teaching load-bearing element.** Forces students to think as *planners*, not just actors. Removes the temptation to defect in unfavorable branches.  
    - *Advantage over CM:* Eliminates "branch myopia" by making counterfactual dependency explicit:  
      - Policy choice determines outcomes in *all* branches simultaneously.  
      - *Activity:* Have the group debate policies. Ask: "Which policy maximizes group EU?"  
  - **Connect to UDT (5 mins):**  
    - UDT agents are the "planners" in the sealed verdict. They select policies *before* observations, then execute faithfully.  

  ---

  ### **Step 4: Contrast with CDT/EDT and Summarize (15 mins)**  
  *Solidify UDT as the solution to the established problem.*  
  - **Compare Decisions in CM (10 mins):**  
    - *Whiteboard table:*  
      | Branch | CDT/EDT | UDT |  
      |--------|---------|-----|  
      | Heads  | Don’t pay (lose \$0) | Pay (lose \$100) |  
      | Tails  | Win \$0 (no precommit) | Win \$10,000 |  
      | **Ex-ante EU** | \$0 | **\$4,950** |  
    - *Key takeaway:* CDT/EDT are "myopic" to their branch. UDT optimizes globally.  
  - **Summary (5 mins):**  
    - UDT: Choose the best policy ex-ante → follow it regardless of updates.  
    - Solves CM and Newcomb by decoupling policy selection from moment-by-moment causality/evidence.  

  ---

  ### **Final Check: Revealing Question (5 mins)**  
  *Test for conceptual grasp, not slogans.*  
  - **Question:**  
    > *"In Counterfactual Mugging, suppose the coin flip is revealed to be heads. According to UDT, why must you pay? What would happen if you ‘defected’ from the optimal policy only in this branch?"*  
  - **Why it reveals understanding:**  
    - *UDT answer:* Paying is required because the optimal policy (chosen ex-ante) includes this action. Defecting lowers ex-ante EU by breaking the counterfactual dependency (losing $10,000 in tails).  
    - *Intuitive but wrong answer:* "I wouldn’t pay—it’s irrational to lose money when I know tails won’t happen." (This misses UDT’s core: optimizing from the ex-ante view.)  
    - *Novelty:* Unlike CM, this directly challenges the tension between ex-post intuition and ex-ante optimality.  

  ---

  ### **What to Refuse to Cover**  
  *Draw boundaries to avoid scope creep. State upfront:*  
  - **Logical uncertainty, proof-based agents, mathematical correlation disputes:**  
    - *Reason:* These add layers of complexity (e.g., "Should an agent correlate decisions with the Riemann hypothesis?") that obscure UDT’s core insight.  
    - *How to frame it:* "Today, we focus on UDT in *empirical* uncertainty (like coin flips or predictions) with *given* probabilities. We set aside logical uncertainty to build intuition."  
  - **Advanced UDT variants (e.g., logical inductors):**  
    - *Reason:* Requires grappling with impossible problems (e.g., halting problem) and distracts from policy-based decisions.  

  ---

  ### **Expected Misconceptions and Mitigation**  
  | Misconception | When to Head Off | Mitigation |  
  |---------------|------------------|------------|  
  | "UDT ignores evidence" | Step 2 (Introduce Updatelessness) | Explicitly distinguish *belief updating* (allowed) from *policy updating* (forbidden). Use CM: "You update that it’s heads, but still follow the policy." |  
  | "UDT = precommitment tactics" | Step 2 (after defining policies) | Contrast: "Precommitment is a tool. UDT is the *reason* it works. Even without tools, UDT defines rationality." |  
  | "UDT agents don’t adapt" | Step 3 (Sealed Verdict) | Stress: Policies *include* responses to observations (e.g., "if heads, pay"). It’s adaptive by design, not by updating the strategy. |  

  ---

  ### **Why This Works**  
  - **Narrative arc:** CDT/EDT fail → UDT solves the failure → Sealed Verdict makes UDT tangible → Final question tests depth.  
  - **CM as the anchor:** Its symmetry avoids privileging one branch. Sealed Verdict then prevents "branch selfishness."  
  - **Clarity through constraints:** By refusing logical uncertainty, you keep focus on the policy-selection pivot.  

  UDT emerges not as a taste but as the only consistent response to dilemmas where rationality can't be timestep-local.
