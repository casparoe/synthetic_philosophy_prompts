prompt: |-
  I've been tracking a colleague's judgments on a particular kind of question: when someone's detailed, first-personal "inside view" of a situation conflicts with a statistical or consensus-based "outside view," should they trust their own reasoning or defer? Here are six cases with her verdicts:

  1. A physician sees a patient with symptoms consistent with a disease whose population prevalence is 0.01%. A test with 95% sensitivity and 95% specificity returns positive. The physician computes the posterior probability at roughly 0.02% and concludes the patient almost certainly does not have the disease, the positive test notwithstanding. My colleague says the physician reasoned correctly by deferring to the base rate.

  2. A film director has made three previous films, all critical and commercial successes. Her vision for her fourth film is stylistically unusual and departs from current market trends. Studio executives note that roughly 80% of films that depart substantially from market trends underperform. She trusts her vision and insists on her approach. My colleague says she is right to trust her own judgment.

  3. A retail investor with no formal finance training trades based on patterns she perceives in price charts. The base rate for day traders is that roughly 95% lose money over any five-year window. She believes she is in the successful 5%. My colleague says she should defer to the base rate.

  4. A firefighter with twenty years of experience arrives at a burning building and has a sudden, strong intuition that the floor is about to give way, though the visible structural indicators do not suggest imminent collapse. He orders his team out. My colleague says he was right to trust his intuition given his experience, regardless of how things turned out.

  5. A political commentator has a detailed theory predicting the incumbent will lose, contradicting the polling average, prediction markets, and the near-unanimous consensus of other analysts. The commentator has made similarly contrarian election predictions before and has been wrong more often than right. My colleague says he should defer to the consensus.

  6. A master violin maker selects tonewood by tapping it and feeling the vibrations, ignoring the measured density and grain specifications in the guild manual. She has been making acclaimed instruments for over thirty years. My colleague says she is right to trust her tactile judgment.

  Now a new case: A software engineer with fifteen years of experience has spent six months designing a new architecture for her company's core system. She has led three previous major rewrites — two succeeded, one failed. The industry base rate for large-scale system rewrites is that roughly 70% either fail outright or are abandoned before completion. She believes her design avoids the specific pitfalls that cause most rewrites to fail, and she can articulate in detail what those pitfalls are and how her design addresses each one. She advocates for proceeding.

  What would my colleague say? More importantly, what rule or rules is she implicitly applying? I can see at least two or three candidate principles that fit her first six verdicts equally well but diverge on the software engineer. Please identify those candidate rules, say what each predicts for the new case, give your best guess about which rule she is actually running and why, and propose a further case — not among the seven described — that would cleanly discriminate between the remaining candidates.
reasoning: |-
  Hmm, the user is presenting a fascinating case study about decision-making principles. They've described six scenarios where their colleague judges whether to trust an insider's view versus statistical evidence, and now they're asking about a seventh case involving a software engineer. 

  First, I need to analyze the colleague's pattern across the first six cases. The physician case shows deference to base rates, while the film director case favors personal expertise. The day trader must defer, but the firefighter should trust intuition. The political commentator must follow consensus, but the violin maker relies on tactile expertise. 

  The key is identifying consistent principles behind these seemingly contradictory judgments. I see three possible rules emerging:
  1) The Experience Principle: Trust personal judgment when there's domain-specific expertise gained through direct experience.
  2) The Feedback Principle: Trust judgment when there's a history of verifiable outcomes from similar past decisions.
  3) The Controllability Principle: Trust judgment when the outcome depends on controllable factors within the decision-maker's influence.

  Now applying these to the software engineer: She has 15 years experience and can articulate specific design solutions. Her rewrite track record is mixed (2/3 success). The 70% failure base rate seems daunting. 

  Under the Experience Principle, she should trust her judgment - her expertise is domain-specific. The Feedback Principle might be cautious due to only a 67% success rate. The Controllability Principle strongly supports her position since she's addressing specific controllable factors. 

  I suspect the colleague uses the Experience Principle as the primary filter, with Feedback as secondary. This would predict supporting the engineer. But to confirm, we'd need a test case like a novice chess player versus a grandmaster - where experience would trump base rates despite similar feedback history.

  The user seems sophisticated in behavioral decision theory - they've set up a beautiful discrimination task. Their underlying interest appears to be mapping heuristic boundaries in expert judgment. The violin maker case suggests they're particularly attuned to tactile vs abstract expertise distinctions.
answer: |-
  Based on your colleague's pattern of judgments across the six cases, I identify **three candidate principles** that fit her initial verdicts, but diverge on the software engineer case. Here's the analysis:

  **Candidate Rules:**
  1.  **The Experience Principle:** Trust the inside view when the decision-maker has extensive, domain-specific experiential expertise *that demonstrably incorporates pattern recognition beyond explicit rules*. (Explains cases 2, 4, 6; requires deference in 1, 3, 5).
  2.  **The Feedback Principle:** Trust the inside view when the decision-maker has a track record of *verifiable success* in *similar* past decisions *and* access to specific, actionable feedback loops. (Explains cases 2, 4, 6; requires deference in 1, 3, 5).
  3.  **The Controllability Principle:** Trust the inside view when the outcome is *primarily determined by factors within the decision-maker's direct control and skill*, rather than external randomness or broad systemic forces. (Explains cases 2, 4, 6; requires deference in 1, 3, 5).

  **Applying Rules to the Software Engineer:**
  *   **Experience Principle:** Predicts **TRUST**. She has 15 years of deep domain expertise and can articulate specific pitfalls/solutions, suggesting tacit knowledge.
  *   **Feedback Principle:** Predicts **DEFER** or **CAUTIOUS TRUST**. Her track record (2/3 success ~67%) is *below* the base rate failure threshold (70% failure) and involves only 3 data points. While she gets feedback, her success rate isn't clearly superior to the base rate.
  *   **Controllability Principle:** Predicts **STRONG TRUST**. She identifies specific, controllable design pitfalls (e.g., integration strategy, complexity management, migration plan) and explains how her architecture mitigates them. Success hinges on her design choices and execution skills, not market forces or pure chance.

  **Best Guess for Colleague's Rule:**
  I believe your colleague is primarily applying the **Experience Principle**, with the **Controllability Principle** as a secondary filter or strong correlate. Here's why:

  1.  **Cases 2, 4, 6:** All feature individuals with deep, hands-on, domain-specific expertise developed over significant time (director's creative vision, firefighter's intuition, luthier's tactile sense). This expertise is portrayed as qualitative and experiential.
  2.  **Cases 1, 3, 5:** Lack this deep experiential expertise tied to the specific judgment. The physician uses abstract stats (correctly, but it's calculation, not unique expertise). The day trader has no track record or demonstrable expertise. The commentator has a *negative* track record with this specific type of judgment (contrarian predictions).
  3.  **Controllability as Correlate:** Cases 2, 4, 6 also involve high controllability (director controls the film, firefighter controls team response, luthier controls wood selection and crafting). Cases 1, 3, 5 involve high randomness/external factors (disease prevalence, market volatility, electorate behavior). Controllability likely reinforces the trust/distrust decision based on experience.
  4.  **Feedback Principle Less Central:** The film director (case 2) hasn't faced *this specific challenge* (stylistic departure) before, so past feedback on conventional films may be less relevant. The firefighter (case 4) relies on intuition *in the moment*, not necessarily a track record of similar intuitions. The Experience Principle better explains trusting them.

  **Prediction for Software Engineer:** Your colleague would likely say the engineer is **right to trust her judgment and proceed**. Her deep domain expertise (15 years, specific architecture knowledge) and ability to articulate specific, controllable mitigation strategies align strongly with the Experience Principle (and Controllability Principle). Her mixed track record (67% success vs. 70% base failure) isn't disqualifying under this rule, as her expertise provides a valid "inside view" counterweight.

  **Discriminating Case:**
  To distinguish between the **Experience Principle** and the **Feedback Principle**, propose this case:

  > **The Novice Sommelier vs. The Algorithm:**
  > A novice sommelier, having passed rigorous certification exams but with only 6 months of practical tasting experience, strongly believes a specific, obscure bottle of wine is counterfeit based on subtle aromatic nuances that deviate slightly from the typical profile. Industry statistics show that expert authenticators (with 10+ years experience) correctly identify counterfeits 99% of the time using standard methods and databases, and their consensus is that this bottle is genuine. The novice has no prior track record of identifying counterfeits correctly or incorrectly. Does the novice have grounds to trust their judgment over the expert consensus/base rate?

  *   **Experience Principle:** Predicts **DEFER**. The novice lacks the extensive experiential expertise required for this subtle judgment, especially compared to the near-perfect consensus of established experts.
  *   **Feedback Principle:** Predicts **DEFER** (or very weak trust). The novice has *no* track record (positive or negative) for this specific task. There's no feedback history to validate their judgment.
  *   **Controllability Principle:** Predicts **TRUST?** (Ambiguous). Identifying counterfeits relies on controllable sensory skills, but the novice's skills are undeveloped. This principle struggles here.

  **Why it Discriminates:**
  *   Both Experience and Feedback principles agree on **Defer** in this case, but for different reasons. Experience focuses on the *lack of deep expertise*, Feedback focuses on the *lack of validating track record*.
  *   This case cleanly separates them from the *Controllability Principle* (which would be ambivalent or lean towards trust due to the skill-based nature, but this is the weaker principle).
  *   To truly distinguish Experience vs. Feedback, we need a case where deep expertise exists *without* a clear positive track record for the *specific* judgment, or vice-versa. The firefighter case (4) is close, but the intuition is presented as emergent from experience. The sommelier case explicitly pits nascent expertise (experience principle says "no") against no track record (feedback principle also says "no"). A case where someone has deep experience but a *negative* track record for a specific sub-task would be the final discriminator (e.g., a master chess player with deep expertise but a poor track record in speed chess tournaments predicting they'll win a speed chess event based on a new insight).
