   The paradox: 
   You are given two envelopes, one with X and the other with 2X. You pick one and find amount A. 
   Then you reason: 
     With 1/2 probability, the other envelope has 2A (if you picked the smaller) 
     With 1/2 probability, the other envelope has A/2 (if you picked the larger) 
     So the expected value of switching is (1/2)*2A + (1/2)*(A/2) = 1.25A, which is greater than A. 
     Therefore, you should switch. But by the same reasoning, you should switch again.

   The resolution: 
   The mistake is in assuming that the probability that you picked the smaller or larger is 1/2 regardless of A. 
   For the prior distribution of the smaller amount X, if we want the conditional probability (given A) that we hold the larger or smaller to be 1/2 for every possible A, then the prior must be improper (cannot be normalized). In fact, the prior would have to be proportional to 1/x, which integrates to infinity. 
   Hence, for any proper prior, the conditional probability that we hold the smaller or larger given A will depend on A and may not be 1/2. Therefore, the expected gain from switching is zero when averaged over all possibilities, and conditional on a particular A, it may be negative, zero, or positive.

   We are to use the two branches of the swap argument as recurring lines:
