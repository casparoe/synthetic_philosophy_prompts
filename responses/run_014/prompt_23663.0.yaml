  Noticing interesting nuances: The political scientist focuses on institutional outputs ("the record must make sense"), while the legal scholar emphasizes individual rationality ("no judge is inconsistent"). Both miss key insights the other could've pressed. For instance, when the legal scholar suggests voting only on the conclusion, they don't address how that hides dissent on premises - a point the political scientist rightly highlights but doesn't fully develop.

