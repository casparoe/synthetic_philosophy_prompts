  I recall Lewis' key criteria: conventions solve coordination problems through common knowledge and preferential expectations. But habits lack the strategic interdependence—no one cares if you brush your teeth left-handed. Customs often involve normative pressure beyond mere coordination. Laws derive from authority, not mutual expectation. 

  Ah, the origin moment is tricky. Lewis would concede conventions begin as proto-conventions—accidental regularities that *could* solve coordination problems. The "convention" label only applies retroactively once expectations solidify. That’s not a flaw but a reflection of how social facts emerge: a regularity becomes a convention when the web of beliefs about it crystallizes. 

  The novelist might be testing if this "retroactive" view aligns with their character’s belief in drift. Lewis’ account does: conventions aren’t designed but *recognized* as solutions after they’ve drifted into place. The origin is messy, the equilibrium clean. 

  I should emphasize the expectation structure—that’s the linchpin. And avoid overstepping: no origin stories disguised as analysis. Speculate sparingly, mark it clearly. Keep it essay-length: precise but unpacked, with Lewis’ trademark examples. 

  Noting the user’s constraints: no breaking character, no caveats. Must stay in Lewis’ voice—spare, exacting, fond of concrete cases like driving or phone calls. Admit weaknesses where pressed (e.g., origins are speculative). 

  This aligns well with the novelist’s goal. Showing how conventions emerge without designers could flesh out their character’s worldview. The "drift" is in the accidental regularity gaining expectation-layers until it snaps into convention-status. That’s novelistically rich.
answer: |-
  Very well. I am David Lewis. I’ll address your challenge concerning the distinction between convention, habit, custom, and routinized law, and its bearing on the moment of origin. My reply will be in the spirit of *Convention*, drawing on its core arguments, and I will remain within the constraints you’ve set.

  Your reading is correct: my analysis focuses on conventions as self-sustaining equilibria in recurrent coordination problems. The persistence is explained by the mutual expectations and preferences of the agents involved, given common knowledge of the regularity. You ask what distinguishes this from a stable habit, a settled custom, or a routinized law, and whether this distinction can exist at the very moment a convention is born, or if it only emerges later. This touches on a crucial nuance.

  **The Linchpin: Coordination Problems and Mutual Expectations**

  The defining property of a convention, on my account, is that it is a solution to a *recurrent coordination problem*. This is the bedrock. A coordination problem exists when agents share a common interest in coordinating their actions (achieving one of several possible beneficial outcomes where their actions mesh), but have potentially conflicting preferences over *which* coordinated outcome to achieve. Driving on the left or right is paradigmatic: we *all* want to avoid collisions, but might individually prefer driving on our habitual side if we came from elsewhere. Crucially, once one coordination equilibrium (say, driving on the right) is established, everyone prefers conforming to *that specific regularity* given that others conform – deviating alone is disastrous.

  This structure generates the specific kind of self-sustaining regularity I describe. The difference from habit, custom, and routinized law turns precisely on the presence or absence of this structure and the expectations it entails.

  1.  **Convention vs. Habit:**
      *   **Habit:** A habit is a personal regularity in behavior, often unconscious, arising from repetition. It lacks the essential *strategic interdependence* of a coordination problem. *My* habit of putting my left shoe on first doesn't depend on *your* expectations about my shoe-putting, nor does it solve a problem requiring *our* coordinated action. If I change my habit, no one else is affected, nor do they care. There is no "best response" contingent on others' actions in the same domain. A habit persists by inertia or individual conditioning, not by a network of mutual expectations about behavior in a shared problem-space.
      *   **The Line:** The property turning the distinction is the existence of a recurrent coordination problem and the consequent structure of *interdependent preferences and expectations*. My habit solves no coordination problem *for us*. A convention does. At the moment of origin, if a behavior arises purely from individual repetition without any element of agents responding to each other to solve a shared coordination issue, it’s a habit, not a convention. If it arises *as* a tentative response to the perceived need for coordination (even if initially accidental), it has the potential seed of convention.

  2.  **Convention vs. Custom:**
      *   **Custom:** Custom is a broader and fuzzier category. A custom *can* sometimes overlap with convention, especially when the custom solves a coordination problem (e.g., customary greetings). However, many customs lack the core structure:
          *   **Normative Force:** Customs often carry strong normative weight ("This is how it’s *done*; it’s proper/traditional/right"). While conventions *can* acquire normative force over time (we think driving on the right is "the rule"), this normativity is *derivative* of the coordination solution. The core reason for following a convention remains the preference for coordination *given others' actions*. A custom might be followed primarily due to its perceived inherent rightness, tradition, or social pressure, even if no coordination problem is solved or if deviating wouldn’t necessarily lead to coordination failure *if done alone*. Think of intricate table manners: violating one might cause offense, but it doesn’t inherently cause a coordination *failure* like a head-on collision. The reason to conform is social sanction or internalized norm, not primarily the strategic need to mesh actions to achieve a common goal.
          *   **Lack of Arbitrariness/Alternatives:** Conventions are often arbitrary – driving left works just as well as driving right *if everyone does it*. Customs may feel non-arbitrary, deeply tied to identity or belief. More importantly, customs may persist even when they *don't* solve a coordination problem effectively anymore, purely due to tradition.
      *   **The Line:** The critical property is whether the regularity primarily functions as a solution to a coordination problem sustained by mutual expectations of conformity, or whether it persists due to other forces like tradition, intrinsic value, or diffuse social pressure *independent* of the coordination structure. A custom *becomes* a convention *only* if adherence is driven by the interdependent preferences characteristic of a coordination equilibrium. At the moment of origin, if a behavior is adopted primarily for normative/traditional reasons unrelated to solving a coordination problem, it starts as custom. If it’s adopted (however tentatively) *because* it seems a way to coordinate, it has the germ of convention.

  3.  **Convention vs. Routinized Law:**
      *   **Routinized Law:** A law, even when perfectly internalized and followed routinely, derives its force from a different source: authority and sanction. People follow it because it is the law, backed by the threat (or promise) of enforcement. Crucially, even if *everyone* follows it routinely, the *reason* they follow it, the source of the obligation, is the legal system. If the authority vanished overnight, the routine might persist briefly out of habit, but its status as a *rule* would dissolve. Its persistence depends on the persistence of the authority structure, not *solely* on the self-sustaining network of mutual expectations among equals. The equilibrium exists within the larger framework of authority. In contrast, a convention exists *because* of that network of expectations among the participants themselves. Driving on the right persists because we all expect each other to do it and prefer to do it ourselves given that expectation. If the traffic laws vanished, the convention would likely persist unchanged until some new force disrupted it.
      *   **The Line:** The property is the *source of the obligation or reason for conformity*. Is conformity primarily sustained by mutual expectations among the participants regarding each other’s behavior in a coordination context? Or is it sustained by the dictates and sanctions of an external authority, even if obedience has become routine? A law, even routinely followed, retains its character as law because its reason for being followed traces back to authority. At the moment a law is enacted, it is clearly distinguished by its source. If a *de facto* regularity arises spontaneously solving a coordination problem, and *then* is codified as law, it was a convention first. Its origin as a convention lay in the mutual expectations before codification.

  **The Moment of Origin and the Property of "Convention-ness"**

  You ask if the defining property – being a solution to a coordination problem sustained by mutual expectations – can be present at the very moment of origin, or if it only emerges later.

  Here is where I must be cautious, as my analysis focuses on the equilibrium state, not the genesis. However, speculatively:

  1.  **The "Seed" is Present:** At the moment a regularity *begins* to be established as a way to solve a coordination problem, the *potential* for it to function as a convention is present. Agents are acting (perhaps tentatively, perhaps accidentally) in a way that *could* solve the problem. Crucially, if they are doing so *in response to* a perceived need to coordinate and with *some* nascent expectation that others might do the same (or are trying to signal the same solution), then the essential structure is nascent. Think of two people stranded on phones trying to reconnect: one shouts "I'll call you back!" hoping the other hears and expects it. The *attempt* embodies the coordination logic.
  2.  **"Convention" is Retrospective Label for the Mature State:** However, the full property of *being a convention* – a regularity that is *common knowledge*, where conformity is the preferred response *because* of the universal expectation of conformity – this typically only crystallizes *after* the regularity has been followed successfully for some time. The mutual expectations need time to form and solidify into common knowledge. The *belief* that "this is what we do, and we all know we do it, and we do it because we expect each other to do it" is the hallmark of the equilibrium. At the very first instance, this belief structure is absent or highly incomplete.
  3.  **Proto-Conventions:** So, at the moment of origin, we might have a *proto-convention*: a behavior adopted (perhaps arbitrarily, perhaps by salience, perhaps by precedent, perhaps by agreement) *as a candidate solution* to the coordination problem. It possesses the *potential* to become a convention. It only *becomes* a convention proper once it successfully coordinates and, through repetition and communication, the common knowledge and the expectations based on it are established. The property of being a convention is one that *emerges* as the regularity proves stable *because* it satisfies the coordination logic and the expectations become entrenched.

  **Is This Silence a Defect or Feature?**

  Is my account’s focus on the equilibrium, and its relative silence on the precise, messy moment of birth for each specific convention, a defect? I argue it is a necessary feature of the kind of analysis I undertook.

  1.  **Focus on Essence:** My aim was to define what a convention *is* in its stable state – to identify its essential structure. This structure explains *why* it persists. The process of *how* a specific convention arises – whether by explicit agreement, salience, precedent, accident, or gradual evolution – is highly variable and often contingent. It falls under history, sociology, or psychology.
  2.  **The Structure Constrains Genesis:** While silent on the details of genesis, the analysis *does* constrain it. For a regularity to become a convention, it *must* be capable of solving the coordination problem and attracting the necessary expectations. My account tells you what conditions the originating event or process must *lead to*.
  3.  **Equilibrium as the Explanatory Target:** Social order relies on stable patterns. Explaining the persistence of conventions – why they don’t constantly collapse – is crucial to understanding social order as "drift" rather than constant design. Understanding the equilibrium *is* understanding the cornerstone of the order that emerges. The birth pangs, while fascinating, are transient; the stable state is what endures and shapes ongoing interaction.

  In conclusion, the line between convention and habit/custom/routinized law is drawn by the presence of a specific structure: a recurrent coordination problem where conformity to a specific regularity is sustained by a network of mutual expectations and preferences, given common knowledge. Habit lacks the interdependence; custom often lacks the core coordination logic or relies on different forces; law relies on authority. The property of being a convention is primarily a property of the mature, stable state – the equilibrium – where this structure is fully realized. While the *potential* for convention exists in the originating act if it addresses a coordination problem proto-strategically, the label "convention" best applies once the self-sustaining system of expectations is in place. This focus on the equilibrium is not a defect in explaining social order as a product of drift; it explains the stable bedrock upon which the drift consolidates. The origin is the spark; the convention is the sustaining flame.
