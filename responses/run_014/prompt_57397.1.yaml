prompt: |-
  I direct the Office of Performance and Innovation for a city of roughly 340,000. My staff is five people, none of them economists; our one analyst is a part-time data person who mostly maintains dashboards. In the spring our city manager attended a conference session on governance by prediction markets and came back convinced we should pilot something he is calling futarchy on a handful of decisions this fiscal year. The version of the idea that persuaded him was roughly the one its originator popularized: let elected officials settle what we are trying to achieve, then let speculators bet on which of the candidate policies will achieve more of it, and adopt whichever branch the market prices higher. He has asked me to produce a written procedure that any program manager in any department can run on an incoming proposal before we commit public money to opening a market. He does not want another essay on whether prediction markets are wise in general; he wants steps, in order, with a stopping condition at each one.

  The constraints are these. The pilot has $60,000 in total, most of which is earmarked for seeding liquidity, because the platform vendor assures us the contracts themselves are trivial to write. Proposals arrive continuously — we field fifteen to twenty serious ones a year and expect four or five to reach the pilot — and each one gets a single afternoon of analysis before our monthly review board, at which the city attorney and one council member must sign off before anything goes live. The decisions at issue range from about $1 million to $15 million and affect anywhere from a few hundred households to most of the city; a couple of them are effectively irreversible for a decade. One department head insists any market must be written on a single dollar figure, and another insists that a dollar figure is exactly the wrong thing to write it on and wants a composite index instead. Please write the procedure so that this disagreement is resolved by the procedure rather than by whoever talks longest.

  Specifically, I need it to tell a non-specialist, step by step: what makes a decision eligible at all, and whether repeatability matters; how to tell a measurable outcome apart from a value, and who is permitted to choose the outcome the contract pays on; how to condition a contract on the policy actually being adopted, and who gets to declare that the condition was met; how thick a market has to be before its price is evidence rather than noise, and what to do when the honest answer is that we cannot get a number; how we would ever know the price was right, given that we only observe the branch we took and the losing branch is never resolved; how we keep a trader from buying the outcome he wants, in the market, in the world, or both, especially when the best-informed potential traders are also interested parties; what the losing side of the bet is entitled to do afterwards; and at which step the procedure must stop and hand the question back to elected officials because it is about what we should want rather than what will happen. Mark clearly which steps are genuinely mechanical and which are judgment calls wearing a procedural costume.

  Then run the procedure on three proposals we actually have on the table. First, whether to convert four low-ridership bus routes into a higher-frequency network, where the transit department wants the contract written on total boardings and the equity office wants it written on total rider-minutes, and where implementation would be partial and phased. Second, whether to sign a ten-year exclusive contract with one waste hauler or keep the collection zones out to competitive bid, where the parties with the best information about the answer are the bidders themselves. Third — and this is the city manager's flagship, the one he has already mentioned to the council — whether to open an overnight shelter at a specific vacant site, with the market written on assessed property values within a half mile over eighteen months. If the procedure kills the flagship, say so plainly and explain what specifically fails; if it lets all three through, tell me it is not a procedure but a rubber stamp. Finally, give me the limits: what classes of decision this will systematically get wrong, what a bad outcome would look like, and what we should be watching in month six that would tell us the pilot is failing before the failure is expensive.
reasoning: |-
  We are designing a procedure for a futarchy pilot in a city government context. The procedure must be step-by-step, with stopping conditions, and must resolve disagreements without relying on who talks longest. The goal is to have a written procedure that any program manager can follow to set up a prediction market for a policy proposal, given the constraints (limited budget, time, and expertise).

   Key elements from the query:
   - Decisions: $1M to $15M, affecting hundreds to most of the city, some irreversible for a decade.
   - Pilot budget: $60,000 total, mostly for liquidity.
   - Process: Each proposal gets one afternoon of analysis before a monthly review board (city attorney and one council member must sign off).
   - Disagreements: One department head wants single dollar figure, another wants composite index.

   The procedure must address:
   1. Eligibility: what makes a decision eligible? (repeatability? etc.)
   2. Measurable outcome vs. value: how to tell? who chooses the outcome?
   3. Conditioning: how to condition the contract on the policy being adopted? who declares?
   4. Market thickness: how thick must the market be? what to do if we can't get a number?
   5. How do we know the price was right? (since we only observe one branch)
   6. How to prevent a trader from buying the outcome he wants? (conflict of interest)
   7. What can the losing side do afterward?
   8. When to stop and hand back to elected officials (when it's about what we want, not what will happen).

   We also have three examples to test the procedure.

   Structure of the procedure:
   - Steps in order, with clear stopping conditions (if the condition is not met, stop and do not proceed to the market).
   - Mark which steps are mechanical and which are judgment calls.

   Let's design the steps:

   Step 0: Precondition - The proposal must be one of the candidate policies for which the elected officials (or their designated body) have already set the goal (i.e., the value we are trying to achieve). This step is about ensuring that the goal is set by elected officials and that we are only dealing with "what will happen" not "what we want".

   Step 1: Eligibility Check
     - The decision must be one where the outcome can be measured objectively and independently after a defined period of time. The outcome must be a metric that is not subject to interpretation and can be collected without bias.
     - Repeatability: Not required, but the outcome must be measurable at least once at a defined future date.
     - Stopping condition: If the outcome cannot be measured objectively and independently, stop. The decision is not eligible for a prediction market.

   Step 2: Define the Outcome Metric
     - How to tell a measurable outcome apart from a value? 
          * A measurable outcome is a specific, quantifiable indicator that can be observed and verified. 
          * A value is a broader goal (e.g., "improve equity") that might be achieved through multiple channels and is not directly measurable.
     - Who chooses the outcome? The review board (city attorney and council member) must choose the outcome metric from a set of candidate metrics proposed by the program manager, based on the goal set by elected officials. The program manager must present at least two candidate metrics, one of which must be a dollar figure and one a composite index (if applicable) to resolve the disagreement. The review board selects one metric that best reflects the goal and meets the measurability criteria. 
     - Stopping condition: If no agreement on a metric is reached, or if no metric adequately reflects the goal, stop.

   Step 3: Define the Condition for Policy Adoption
     - How to condition the contract on the policy actually being adopted?
          * The contract must have a clear binary condition: the policy is either adopted by a specific date or not. The contract will pay based on the outcome only if the policy is adopted. If the policy is not adopted, the contract is void and refunds all bets.
     - Who declares that the condition was met? 
          * The city manager (or a designated official) must declare by a specific date (e.g., 30 days after the market closes) whether the policy was adopted. The declaration must be based on an official record (e.g., council vote, executive order).
     - Stopping condition: If there is no clear point of adoption or if the adoption condition is ambiguous, stop.

   Step 4: Market Design and Liquidity Requirements
     - How thick a market must be? We need to set a threshold for trading volume and/or number of participants to consider the market price as evidence and not noise. Given the budget constraints, we set:
          * Minimum total volume: $10,000 (this is the total amount traded, not the liquidity provided). We are using $60,000 for the entire pilot, so for 4-5 markets, we can allocate about $12,000-$15,000 per market for liquidity. But note: the vendor may require liquidity seeding. We set a rule: the market must have at least 10 distinct traders and a total volume of at least $10,000 (or 5 times the liquidity provided, whichever is higher) to be considered valid. 
          * What to do when we cannot get a number? If the market does not meet the minimum volume and trader count by the closing date, the market is declared void and the policy decision is not made by the market. The review board must then decide by traditional means.
     - This step is mechanical in setting up the market, but the judgment call is at the end: if the market fails to meet the thresholds, then we stop and hand back.

   Step 5: Preventing Manipulation and Conflict of Interest
     - How to keep a trader from buying the outcome he wants? We must restrict trading by interested parties. Specifically:
          * Any individual or entity that stands to gain or lose directly from the policy decision (e.g., bidders in a contract, department heads whose performance is tied to the outcome) must be banned from trading in that market. 
          * The program manager must identify potential interested parties and submit the list to the review board for approval. The platform vendor will enforce the ban.
          * Additionally, the market should be designed to run for a short period (e.g., 2 weeks) to reduce the opportunity for manipulation.
     - Stopping condition: If the set of potential traders is too small (because too many are banned) and we cannot reasonably expect a liquid market, stop.

   Step 6: Resolution and Appeal
     - How would we know the price was right? We don't, because we only observe one branch. But the market price is considered the best available evidence at the time.
     - What the losing side of the bet is entitled to do afterwards? They lose their money (if they bet against the outcome that happened). There is no recourse for losing a bet. However, if there is evidence of market manipulation, the review board may void the market and refund all bets (but this should be very rare and require strong evidence).
