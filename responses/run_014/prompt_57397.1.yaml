answer: |-
  ### Futarchy Pilot Procedure for Policy Decisions  
  **Purpose:** To determine if a policy proposal should be adopted based on prediction market outcomes, using elected officials' goals and market-based evidence.  
  **Constraints:** $60k pilot budget; one afternoon analysis per proposal; review board (city attorney + council member) sign-off.  
  **Stopping Condition:** If any step fails, the proposal is referred back to elected officials.  

  ---

  #### **Step 1: Eligibility Check**  
  **(Mechanical)**  
  - **Criteria:**  
    - The decision must have **at least two mutually exclusive alternatives** (e.g., "Policy A" vs. "Status Quo" or "Policy B").  
    - The outcome must be **objectively measurable within ≤2 years** (e.g., dollar figures, counts, or verifiable indices).  
    - Repeatability is irrelevant; single-instance decisions are allowed.  
  - **Stopping Condition:** If alternatives aren’t mutually exclusive or the outcome can’t be measured, **stop and refer to elected officials**.  

  ---

  #### **Step 2: Define Outcome Metric**  
  **(Judgment Call)**  
  - **Distinguish Outcome vs. Value:**  
    - **Value:** Broad goal set by elected officials (e.g., "equitable transit access"). *Not used in the contract.*  
    - **Outcome:** Specific, quantifiable proxy for the value (e.g., "rider-minutes" for equity). *Used in the contract.*  
  - **Who Chooses?**  
    - The review board selects the outcome metric from options provided by the program manager.  
    - **Requirement:** The program manager must propose ≥2 metrics:  
      - One **dollar-denominated metric** (e.g., cost savings, revenue).  
      - One **composite index** (e.g., weighted average of accessibility + cost).  
    - *Example:* For bus routes, propose "total boardings" (dollar proxy via fares) and "rider-minutes" (composite of access + time).  
  - **Stopping Condition:** If the review board cannot agree on a metric, **stop and refer to elected officials** (indicates unresolved value conflict).  

  ---

  #### **Step 3: Policy Adoption Condition**  
  **(Mechanical)**  
  - **Conditioning the Contract:**  
    - The contract pays only if the policy is implemented.  
    - Define a **binary trigger event** (e.g., "City Council votes 'Yes' by [date]").  
  - **Who Declares?**  
    - The city clerk certifies trigger events within 48 hours, based on public records.  
  - **Stopping Condition:** If no clear trigger exists (e.g., phased implementation without a binary milestone), **stop and refer to elected officials**.  

  ---

  #### **Step 4: Market Liquidity Threshold**  
  **(Mechanical)**  
  - **Minimum Viability:**  
    - **Trading volume ≥$10,000** AND **≥10 unique traders**.  
    - Use $12,000/policy from the $60k budget for liquidity seeding.  
  - **Failure Protocol:**  
    - If thresholds aren’t met by market close, declare the market void. Refund traders.  
  - **Stopping Condition:** If the market is void, **decide by traditional methods** (no futarchy).  

  ---

  #### **Step 5: Prevent Manipulation**  
  **(Judgment Call)**  
  - **Ban Interested Parties:**  
    - Traders who can influence the outcome *or* the policy are banned (e.g., bidders in a contract, department heads).  
    - *Exception:* Allowed if trading <$100 (de minimis rule).  
  - **Enforcement:**  
    - Program manager submits a "banned traders" list to the vendor. Review board approves.  
  - **Stopping Condition:** If >50% of plausibly informed traders are banned, **stop and refer to elected officials** (market would be noise).  

  ---

  #### **Step 6: Resolve Market & Handle Losers**  
  **(Mechanical)**  
  - **Price as Evidence:**  
    - The winning policy is adopted if its contract price >50% (i.e., market predicts >50% chance of success).  
    - We never know the "true" price; we use the best available evidence.  
  - **Losing Traders:**  
    - Forfeit stakes; no recourse. Bets are voluntary.  
  - **Outcome Measurement:**  
    - City data office measures the outcome at the predefined time. External auditor verifies if disputed.  

  ---

  #### **Step 7: Value vs. Prediction Check**  
  **(Judgment Call)**  
  - **When to Hand Back:**  
    - If any step reveals unresolved disagreement about **what we want** (Step 2), **how to measure values** (Step 2), or **who is trustworthy** (Step 5), elected officials decide.  
    - Futarchy *only* answers "what will happen" under a goal; it does not set goals.  

  ---

  ### Application to Proposed Policies  
  #### **1. Bus Route Conversion**  
  - **Goal:** Improve transit efficiency and equity (set by officials).  
  - **Step 1:** Eligible (alternatives: convert vs. status quo; ridership measurable).  
  - **Step 2:** Propose "total boardings" (dollar proxy via fare revenue) and "rider-minutes" (composite index). Review board chooses one. *If no consensus, stop.*  
  - **Step 3:** Trigger = "Council approves full plan by [date]." Phased implementation invalidates trigger; **stop** unless a binary milestone exists.  
  - **Verdict:** Likely **fails at Step 3** due to phased rollout.  

  #### **2. Waste Hauler Contract**  
  - **Goal:** Minimize cost while maintaining service quality.  
  - **Step 1:** Eligible (alternatives: exclusive contract vs. competitive bids; cost/service measurable).  
  - **Step 2:** Propose "net present value of costs" (dollar) and "cost/complaints index" (composite). Review board chooses.  
  - **Step 5:** Bidders banned (they influence outcome). If no other informed traders (e.g., industry experts), market fails viability check. **Stop at Step 5**.  
  - **Verdict:** **Fails** due to insider dominance.  

  #### **3. Overnight Shelter (Flagship)**  
  - **Goal:** Minimize neighborhood disruption (set by officials).  
  - **Step 1:** Eligible (alternatives: open shelter vs. status quo; property values measurable).  
  - **Step 2:** Propose "median property value within 0.5 miles" (dollar) and "property value + crime rate index" (composite). Review board chooses.  
  - **Step 5:** Property owners in the area banned (they can manipulate by selling). Local real estate agents also banned. Remaining traders may be too few/uninformed. **Stop at Step 5**.  
  - **Step 4 (if not stopped):** Thin trading likely (specialized knowledge). Market void if volume <$10k.  
  - **Verdict:** **Fails at Step 5** (lack of unbiased traders).  

  **Pilot Summary:**  
  - **Rubber Stamp?** No. All three proposals fail (bus at Step 3; waste/shelter at Step 5).  
  - **Flagship Outcome:** Killed. Specific failure: Inability to field unbiased traders (Step 5).  

  ---

  ### Limits and Risks  
  **Systematic Weaknesses:**  
  1. **Long-term/irreversible decisions:** Markets struggle with >2-year horizons (traders discount uncertainty).  
  2. **Multi-factorial outcomes:** Composite indices may misweight values (e.g., property values ignore homeless welfare).  
  3. **Insider-dominated fields:** Markets fail when unbiased experts are scarce (e.g., waste contract).  

  **Bad Outcomes Look Like:**  
  - A policy wins via market manipulation (e.g., property owners dump assets to "prove" shelter harms values).  
  - A good policy rejected due to noise (e.g., low-liquidity market misprices probability).  

  **Month 6 Checkpoints:**  
  - **Success Metrics:**  
    - ≥50% of proposals pass Step 1 (eligibility).  
    - ≥1 market meets liquidity thresholds.  
    - No legal challenges to trader bans/outcomes.  
  - **Failure Signals:**  
    - >75% proposals stop at Step 2 (value conflicts unresolved).  
    >75% markets void at Step 4 (low liquidity).  
    - Trader bans challenged in court.  

  **Recommendation:** Start with low-stakes, short-term decisions to test validity before scaling.
