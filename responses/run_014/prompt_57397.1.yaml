   Procedure: Futarchy Pilot for Policy Decisions

   Step 0: Verify Goal Setting (Judgment Call)
     - Confirm that the elected officials (or their designated body) have set a clear and measurable goal for the policy area. The goal must be specific enough to derive outcome metrics.
     - Stopping Condition: If the goal is not set, or if the goal is about what we should want (a value judgment) without a measurable outcome, stop and return the decision to elected officials.

   Step 1: Eligibility Check (Mechanical with Judgment)
     - The policy proposal must have at least two distinct alternatives (e.g., adopt the policy vs. status quo, or policy A vs. policy B).
     - The outcome of the policy must be objectively measurable at a defined future date. The measurement must be independent and verifiable.
     - Repeatability is not required, but the measurement must be feasible and not subject to manipulation by the outcome measurer.
     - Stopping Condition: If the outcome cannot be measured objectively, stop.

   Step 2: Define Outcome Metric (Judgment Call)
     - The program manager must propose at least two candidate outcome metrics that reflect the goal. 
          - One of the metrics must be a dollar figure if feasible and relevant.
          - One of the metrics must be a composite index if feasible and relevant (to address the disagreement).
          - If one type is not feasible, note the reason and propose alternatives.
     - The review board (city attorney and council member) selects one metric from the candidates. The chosen metric must be the one that best reflects the goal and is the most reliable and objective.
     - Stopping Condition: If the review board cannot agree on a metric, or if no candidate metric is adequate, stop.

   Step 3: Define Adoption Condition (Mechanical)
     - The program manager must define a clear adoption condition: a specific event (e.g., council vote) by a specific deadline (e.g., 30 days after market close) that determines if the policy is adopted.
     - The city manager (or designated official) is responsible for declaring whether the condition was met, based on official records.
     - The contract will be void (and all funds returned) if the policy is not adopted by the deadline.
     - Stopping Condition: If the adoption condition is ambiguous or cannot be defined, stop.

   Step 4: Market Design and Liquidity Threshold (Mechanical with Judgment)
     - The program manager, with the vendor, sets up a prediction market contract that pays $1 if the outcome metric (from Step 2) is better under the proposed policy than under the alternative (e.g., status quo) at the measurement date, and $0 otherwise. (Note: for multiple alternatives, we might need multiple contracts. We assume a binary choice for simplicity.)
     - The market will be open for a fixed period (e.g., 2 weeks).
     - The city seeds the market with up to $15,000 (from the $60,000 pilot fund) to provide liquidity.
     - The market must achieve:
          - At least 10 distinct traders.
          - Total trading volume of at least $10,000 (or 5 times the liquidity provided, whichever is higher).
     - If the market does not meet these thresholds by the close, the market is void and the decision is returned to the review board for traditional decision-making.
     - Stopping Condition: This step does not have a pre-market stop, but the market might fail to meet thresholds and then we stop the futarchy process for that proposal.

   Step 5: Prevent Manipulation (Judgment Call)
     - The program manager must identify all individuals and entities that:
          - Have a conflict of interest (e.g., stand to gain or lose financially or in terms of performance evaluation from the policy outcome).
          - Can influence the outcome in the world (e.g., by taking actions that affect the outcome metric) or in the market (e.g., by having inside information and trading on it).
