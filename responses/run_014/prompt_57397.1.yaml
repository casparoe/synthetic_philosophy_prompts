     - The program manager must also assess whether the remaining set of potential traders is large enough to support a liquid market.
     - Stopping Condition: If the set of banned traders is so extensive that a liquid market is unlikely, stop.

   Step 6: Run Market and Decide
     - Run the market. At the close, if the market meets the liquidity thresholds, the price of the contract (which is the probability the policy will achieve the outcome) is used as the decision criterion:
          - If the price for the policy is higher than 0.5 (or higher than the price for the alternative, in a multi-alternative setup), then the policy is recommended for adoption.
          - The review board then formally adopts the policy if the market recommendation is to adopt, unless there are extraordinary circumstances (but note: the procedure is meant to replace the decision).
     - If the policy is adopted (per Step 3), then after the measurement date, the outcome is measured and the contract is settled.

