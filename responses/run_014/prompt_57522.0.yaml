prompt: |-
  I work in the secretariat of a national equality commission — small country, just call it the Commission — that issues non-binding opinions on whether proposed quota schemes in public and publicly funded institutions square with our equality statute. The statute is maddeningly short: it permits measures aimed at substantive equality so long as they are appropriate, proportionate and time-limited, and then it stops. Ten years of opinions have built up a body of precedent, but the Commission has never written down the rule its actually running, so every new file restarts the same argument from scratch. I have to draft a note for Thursday and I want to know what we should say to be consistent with ourselves rather than with our politics.

  Our record so far, compressed as best I can:
  1. Approved a floor requiring roughly two fifths of seats on state-owned company boards to go to each gender, enforced by a hard sanction and a two-year compliance window. No end date.
  2. Rejected reserving a third of promotions into the senior civil-service grade for members of a long-excluded group, on the ground that entry-level posts for that group were already reserved and the shortfall at the senior grade had largely closed.
  3. Approved a rule requiring party candidate lists in closed-list elections to alternate genders all the way down.
  4. Rejected a municipal fire brigade's plan to reserve a quarter of entry posts for residents of two named districts, even though applicants from those districts passed the same physical test at the same rate as everyone else, because the plan had no end date and no review.
  5. Approved with conditions a scholarship fund for first-generation university students, capped at 15% of the fund, reviewed every five years against whether the gap had closed.
  6. Rejected a conservatoire's proposal to reserve 20% of its places for applicants from the poorest fifth of postcodes, where admission is by audition, saying the measure would interfere with assessing the very thing the institution exists to select for.
  7. Approved a tie-break: where two candidates land within one point of each other on the same exam, preference goes to the one from the group underrepresented at that grade, and the rule lapses automatically the moment representation reaches parity.
  8. Rejected a requirement that employers above fifty staff reserve 5% of all vacancies for people with disabilities, enforced by a levy, noting that a levy lets an employer buy its way out so the reserve wasnt binding on anybody.

  The new file. A public medical school, funded by us, admits through a single national exam that ranks every applicant. It wants to reserve 25% of its places for applicants who grew up in three regions that are badly under-doctored. Those regions supply about 24% of the applicant pool but hold 8% of the places, and their applicants score within a couple of points of the national median on that same exam. The school's stated aim is not compensation for anything anyone did to those regions — it's that graduates from there go back and practise there, and it wants to attach a bond that waives tuition for reserved-place students who take up a post in the region within five years of qualifying. There's a seven-year sunset with a mandatory review at year four. The people displaced are individually ranked applicants who would otherwise have had a place, and one of them has already written to us; separately, applicants from a fourth region that is served just as badly but is not on the list say they've been left out arbitrarily.

  So, what should we say? I want (a) the candidate rules that are each consistent with all eight precedents — I can think of a "was there identified discrimination by the state" rule, an "is the shortfall unexplained among people who have already cleared the same bar" rule, a "does it end" rule, and something about how many named individuals get displaced, but tell me which of those genuinely survive the whole list and build better ones where mine don't; (b) for each surviving rule, what it predicts for the medical school file, as a table so I can see exactly where they come apart; (c) your recommendation, with the single closest precedent named and an honest account of what has to be distinguished to get there; and (d) whichever way we go, the principle we would be committing ourselves to, phrased so that we couldn't quietly reverse it next year without someone noticing. Also tell me which of the eight is the outlier we'll eventually have to explain away, and give me one further hypothetical file — concrete enough that I could actually table it at a meeting — that would split the surviving rules from each other. My colleague Marta thinks it's a clear approve because of the sunset and I think she's underweighting #6, but I could be wrong about that as well. No need for foreign case law or a reading list, just the reasoning worked through.
reasoning: |-
  Hmm, the user works for a national equality commission and needs help drafting a consistent opinion on a medical school quota proposal. They've provided eight precedents and want a framework to evaluate this new case without political bias.

  First, let me unpack their precedents. The commission seems to value: time limits (#4, #5, #7), non-interference with core selection criteria (#6), proportionality (#2, #8), and actual impact (#8). The rejections often involve measures that are either too blunt or lack review mechanisms. 

  Now the medical school case: 25% reservation for under-doctored regions, with applicants from those areas scoring near the median. Key features are the tuition bond and sunset clause. But there are red flags - displaced individuals and excluded regions. 

  Important to note the commission hasn't been consistent about whether historical discrimination matters. #1 was approved without it, while #2 seems to require ongoing disadvantage. 

  For the framework, I need to extract rules that survive all eight cases. "Time-limited" is obvious, but "core mission interference" from #6 is crucial too. The "proportionality" rule must account for both #2 (rejected as disproportionate) and #5 (approved capped measure). 

  The medical school proposal passes sunset and review tests, but stumbles on core mission - medicine requires selecting the best, though the small score gap might mitigate this. The regional exclusion is problematic for proportionality. 

  Precedent #7 (tie-breaker) feels closest - minimal displacement, clear sunset. But the medical school quota is more aggressive. If we approve this, we're committing to allowing significant quotas when: (1) tied to geographical need, (2) with binding return mechanisms, and (3) where performance gaps are negligible. 

  The outlier is clearly #1 - no end date, hard sanction. We might need to explain that board seats aren't a "core merit function" like auditions or medical exams. 

  For a future test case, imagine reserving judgeships by region - it would force the commission to choose between geographical representation and merit-based selection.
answer: |-
  Here's a systematic analysis focused *exclusively* on reconciling the Commission's precedents, followed by a recommendation anchored in consistency:

  ### (a) Rules Surviving All 8 Precedents
  1.  **"Sunset + Review" Rule:** The measure must have a defined end date/automatic lapse *and* a formal review mechanism tied to progress. *(Survives: #1 rejected for no end date, #4 rejected for no end date/review, #5 approved with review/sunset, #7 approved with automatic lapse, #8 implies lack of review makes levy ineffective)*.
  2.  **"Minimal Displacement" Rule:** Preferences cannot categorically exclude better-qualified candidates *unless* the difference in qualification is demonstrably insignificant relative to the core selection purpose. *(Survives: #6 rejected for overriding core merit (audition), #7 approved where qualification difference is minimal (1pt), #2 rejected where shortfall was closing without further displacement, #8 implicitly rejects displacing based on disability alone without qualification link)*.
  3.  **"Proportionality to Gap" Rule:** The scale/scope of the measure must be rationally connected to the *current, specific* underrepresentation gap it seeks to address. *(Survives: #2 rejected as disproportionate (shortfall closing), #5 approved as capped/proportionate, #4 rejected as overbroad (districts not proven to be proxy for group needing remedy), #8 rejected as misaligned (levy doesn't ensure hiring))*.
  4.  **"Non-Interference with Core Function" Rule:** The measure cannot override the primary, defining merit-based criterion of the selection process if that criterion is essential to the institution's function. *(Survives: #6 rejected for conservatoire auditions, #7 approved where merit threshold is met and difference is minor)*.
  5.  **"Binding Mechanism" Rule:** The preference must be enforceable and actually bind the intended beneficiaries/institutions. *(Survives: #8 rejected because levy didn't bind hiring, #1 approved with hard sanction, #4/5 imply need for enforceability)*.

  *Rules Rejected by Precedents:* 
  *   "Identified State Discrimination" Rule: Fails #1 (gender board quotas - no finding of discrimination required).
  *   "Unexplained Shortfall" Rule: Fails #6 (shortfall existed, but remedy overrode core function).
  *   "No Individual Displacement" Rule: Fails #7 (individuals displaced by tie-break).

  ### (b) Prediction Table for Medical School Proposal
  | Rule                     | Prediction for Medical School | Reasoning from Precedents                                                                                                |
  | :----------------------- | :---------------------------- | :----------------------------------------------------------------------------------------------------------------------- |
  | **1. Sunset + Review**   | **APPROVE**                   | 7-year sunset + mandatory Y4 review satisfies #5, #7. No precedent requires sunset <7 years.                             |
  | **2. Minimal Displacement** | **REJECT**                    | Applicants displaced scored higher. Core selection is exam rank. Difference (several points/ranks) > #7's 1pt & overrides core function like #6. |
  | **3. Proportionality to Gap** | **REJECT**                    | Gap: Regions supply 24% of applicants, hold 8% of places. Proposed quota (25%) exceeds applicant share (24%), is fixed, and excludes a 4th under-doctored region (#4: arbitrary scope). |
  | **4. Non-Interference w/ Core** | **REJECT**                    | Core function is selecting by exam rank. Quota overrides rank for 25% of places, akin to #6 overriding auditions. Score proximity alone insufficient (cf. #7). |
  | **5. Binding Mechanism** | **APPROVE**                   | Tuition bond tied to working in the region creates a binding link to the stated aim (#8 rejection contrasts with this).    |

  ### (c) Recommendation & Closest Precedent
  *   **Recommendation: REJECT**
  *   **Closest Precedent: #6 (Conservatoire Audition Rejection)**
  *   **Distinction Required:**
      *   The Commission must distinguish between *minor* qualification differences that don't undermine core merit (#7 - 1 exam point) and *significant* differences that do (#6 - overriding audition ranking). Here, displacing higher-ranked candidates based on geography overrides the core selection mechanism (exam rank) for a substantial portion (25%) of places. The proximity of regional scores to the *median* is irrelevant; the displaced candidates are *above* the cutoff for non-reserved places. This violates the **Minimal Displacement** and **Non-Interference with Core Function** rules established in #6 and #7. The bond (#5 Binding Mechanism) and sunset (#1 Sunset+Review) are insufficient to overcome this core conflict.
  *   **Honest Distinction from Marta's View (Precedent #5):** #5 (Scholarship) did *not* override core admissions criteria; it provided financial support to a group meeting the same academic bar. The medical school quota *changes* the admissions bar based on geography, akin to #6 changing the audition bar.

  ### (d) Principle Committed To (Phrased for Accountability)
  > "The Commission will reject quota measures that override the primary, merit-based criterion defining selection for a role or place when the measure displaces demonstrably better-qualified candidates, regardless of sunset clauses or ancillary mechanisms. Proximity to a qualification threshold alone does not justify categorical preference; the difference must be demonstrably insignificant to the core function being assessed."

  ### Outlier Precedent & Explanatory Burden
  *   **Outlier: #1 (Board Quotas - No End Date)**. This is inconsistent with the strict **Sunset + Review** rule applied rigorously elsewhere (#4, #5, #7, #8).
  *   **Explanation Needed:** Future opinions must either (1) distinguish board seats as "strategic appointments" where core selection criteria are less rigidly defined than competitive exams/auditions/employment tests, or (2) acknowledge #1 was wrongly decided on the sunset point and limit its application. Consistency demands the former: "Board appointments involve broader criteria beyond formal qualifications; the core function rule (#6, #7) does not apply with equal force, though proportionality (#3) and binding mechanisms (#5) still do."

  ### Hypothetical File to Split Surviving Rules
  **Scenario:** National Police Academy (entry by competitive exam). Proposal: Reserve 10% of places for applicants from rural areas (currently <5% of cadets). Rural applicants pass the exam at 85% the rate of urban applicants. 5-year sunset, review at Y3. *Aim:* Increase policing in underserved rural districts. *Mechanism:* Bond requiring 5 years service in a rural post after graduation.

  *   **Rules Split:**
      *   **Minimal Displacement / Non-Interference w/ Core (#2, #4):** Likely REJECT. Displaces higher-scoring candidates (rural pass rate 85% implies lower scores). Core function is selecting by exam rank for a high-stakes role.
      *   **Proportionality to Gap (#3):** Likely APPROVE? 10% reserve vs. <5% current representation. Gap is clear.
      *   **Sunset + Review (#1) & Binding Mechanism (#5):** APPROVE (Sunset/Review/Bond present).
  *   **Conflict:** Forces choice between **Proportionality** and **Minimal Displacement/Core Function**. Precedents #6 (Reject Conservatoire) and #7 (Approve Tie-Break) suggest Minimal Displacement/Core Function should prevail over Proportionality if core merit is overridden significantly. This hypothetical tests that hierarchy.

  **Conclusion for Medical School File:** Consistent application of the Commission's precedents, particularly **#6 (Conservatoire)** and **#7 (Tie-Break)**, demands rejection. The quota overrides the core merit principle (exam rank) for a significant number of places, displacing better-qualified candidates. The bond and sunset are positive features (#5, #1) but cannot cure this fundamental flaw under the established rules. Approving it would effectively overrule #6 without justification.
