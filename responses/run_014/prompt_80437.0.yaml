  Here are five jokes rooted in Lakatos's methodology of scientific research programmes (MSRP), requiring specific knowledge of the theory:

  1.  **Marriage:** "Our therapist keeps suggesting new date night rules and communication 'hacks' to shield the hard core belief we're fundamentally compatible, but the protective belt is so thick with ad hoc adjustments now we can't even agree on what counts as 'quality time'." (Mechanism: Piling ad hoc hypotheses onto the protective belt to shield the hard core from falsification, leading to degeneration).

  2.  **Diet:** "My 'Intuitive Eating' programme started degenerating after the third cupcake binge; now my positive heuristic just generates new auxiliary hypotheses like 'stress-carbs don't count' and 'it was probably gluten-free', with zero novel predictions about actual weight loss." (Mechanism: Degenerating programme piling on ad hoc auxiliary hypotheses; positive heuristic stalling, failing to produce novel predictions).

  3.  **Startup:** "The pivot from 'Uber for Laundry' to 'Blockchain-Powered Community Garment Stewardship' wasn't progress, just auxiliary hypothesis spam protecting the hard core 'disrupt dry cleaning' – our protective belt's obese, but empirically, we still just lose socks." (Mechanism: Adding ad hoc auxiliary hypotheses (pivots) to shield the hard core; protective belt thickening without empirical progress).

  4.  **Group Chat:** "When Dave's prediction that 'Karen will definitely leave after that meme' failed, he just reinterpreted the protective belt: 'Technically she *did* leave... emotionally!' Classic degenerating programme move, explaining away anomalies instead of yielding novel facts." (Mechanism: Degenerating programme responds to anomaly by reinterpreting/adjusting the protective belt ad hoc, rather than producing novel predictions/facts).

  5.  **Fitness Goal:** "My 'Gainz 4 Lyfe' programme is degenerating hard: the hard core 'more weight good' is shielded by endless belt adjustments – 'deload weeks', 'CNS fatigue', 'micro-plateaus' – but the theoretical growth (weight on bar) and empirical growth (muscle size) both stalled months ago." (Mechanism: Programme degenerating as protective belt accumulates ad hoc hypotheses shielding the hard core; both theoretical (predicted progress) and empirical (observed progress) components have halted).
