prompt: |-
  I clerk for a mid-sized city's Community Standards Review Panel, which operates under a locally adopted public reason guideline holding that coercive municipal measures should be justifiable in terms that residents of all faiths and none can in principle engage with, with heightened scrutiny whenever explicitly religious premises are doing justificatory work. I find the guideline abstract in isolation and would like guidance grounded in our own track record rather than in general theory, since consistency with what we have already done matters more to the panel than abstract correctness.

  Our unanimous rulings over the past two years include four relevant precedents. We approved funding for a winter shelter expansion where sponsors invoked both a faith-based duty of hospitality to strangers and a city auditor's findings on unsheltered counts and emergency service savings, stating on the record that the audit alone would have persuaded them to vote the same way. We rejected a proposed ordinance mandating retail closure on a weekly holy day where sponsors invoked only obedience to divine command and where staff analysis found no credible independent benefit for worker well-being or traffic that sponsors were willing to defend as sufficient on its own. We approved a temporary flood-relief levy championed by an interfaith coalition that cited both scriptural duties of stewardship and an independent engineering report on levee failure risk, with coalition witnesses affirming that they regarded the engineering case as compelling in its own right. We rejected an attempt to deny a parade permit to a minority faith on the basis of theological disapproval joined with asserted congestion concerns that the transportation department study directly contradicted, leaving no intact secular rationale for denial.

  We now face a proposal to sharply cap fees and rollovers on payday and auto-title loans within city limits. The principal sponsors are congregations appealing to doctrinal prohibitions on usury and exploitation of the vulnerable, and the file also contains a housing-office analysis documenting cycles of rollover debt, correlations with eviction filings, and net fiscal costs to the city. The sponsors state candidly, however, that they find the statistical case methodologically unpersuasive and would press the cap even if the data pointed the other way, regarding the doctrinal prohibition as alone decisive for them. Please recommend the decision that best coheres with our precedents, identify which of the four prior rulings is the closest analog and why, lay out at least two candidate principles that both fit our track record but diverge on this case, explain what each predicts here, give your best-supported recommendation with reasons for preferring one reconstruction, and describe a further hypothetical case that would most cleanly separate the candidate principles going forward. Close with a final line that reads exactly Verdict: Approve or Verdict: Reject or Verdict: Approve with conditions, with nothing after it.
reasoning: |-
  Alright, let me tackle this query from the Community Standards Review Panel clerk. The user needs a recommendation on a payday loan fee cap proposal that aligns with their precedents, avoiding abstract theory. 

  First, I need to parse their four rulings to spot patterns. The winter shelter and flood levy cases both had religious arguments paired with strong secular evidence that stood alone. The holy day closure and parade permit cases failed because they either lacked credible secular justification or had it contradicted. 

  Hmm... the key seems to be whether the secular rationale holds water independently. Now looking at the payday loan case: sponsors cite religious objections to usury but dismiss the housing office's data. That data shows real harm – debt cycles, evictions, city costs. But sponsors say they'd push the cap even without it. 

  Wait, this feels similar to the holy day closure case where secular arguments collapsed. But unlike that case, the housing data here hasn't been debunked; it's just disliked by sponsors. The parade permit denial had its secular rationale disproven, while here the secular case remains intact though contested. 

  Two possible principles emerge:
  1) "Sufficiency Test": Approve only if secular rationale is both present and sufficient on its own (would reject here since sponsors reject the data)
  2) "Integrity Test": Approve if credible secular rationale exists regardless of sponsors' views (would approve since housing data looks solid)

  The Integrity Test fits better with the flood levy precedent where religious groups accepted but didn't control the engineering report. Also, rejecting this cap might punish vulnerable residents just because sponsors are stubborn about data. 

  For a future test case, imagine a noise ordinance exemption for church bells where secular studies show no community disruption. If sponsors insisted they'd want it even with proven harm, that'd pit the principles against each other cleanly. 

  Verdict should be... *Approve*. The secular case stands uncontradicted, so it passes under the Integrity Test that aligns with their precedents.
answer: |-
  Based on your panel's precedents and the need for consistency, here's the analysis:

  1.  **Closest Analog:** The **Rejected Holy Day Closure Ordinance** is the closest analog. Both cases involve:
      *   A coercive measure (mandatory closure vs. fee cap).
      *   Sponsors relying *exclusively* on explicitly religious premises (divine command vs. doctrinal prohibition on usury/exploitation).
      *   Sponsors explicitly rejecting or finding insufficient any independent secular justification (no credible benefit found by staff vs. sponsors finding the housing analysis unpersuasive and stating doctrinal prohibition is decisive alone).
      *   The presence of *some* secular analysis (staff analysis finding no benefit, housing analysis finding harm) that the sponsors are unwilling to accept as sufficient justification on its own.

  2.  **Candidate Principles Diverging on This Case:**
      *   **Principle A (Sponsor Reliance Test):** Coercive measures are only permissible if the sponsors themselves would endorse the measure based *solely* on the secular rationale presented, treating any religious rationale as supplementary. (Focuses on the sponsors' stated justification hierarchy).
      *   **Principle B (Independent Grounding Test):** Coercive measures are permissible if a credible, intact secular rationale exists within the record that *could* independently justify the measure to reasonable citizens, regardless of whether the sponsors find it persuasive or sufficient. (Focuses on the objective existence of a valid secular justification).

  3.  **Predictions for the Payday Loan Cap:**
      *   **Principle A (Sponsor Reliance Test):** Predicts **Rejection**. The sponsors explicitly state the secular rationale (housing data) is unpersuasive to them and insufficient; they rely solely on the religious doctrine. This mirrors the Holy Day Closure rejection where the absence of sponsor-reliance on a sufficient secular rationale was fatal.
      *   **Principle B (Independent Grounding Test):** Predicts **Approval**. The housing-office analysis provides a detailed, intact secular rationale demonstrating harm (debt cycles, eviction links, fiscal costs). This rationale hasn't been credibly undermined *within the record* (unlike the parade permit congestion concerns). It stands as a justification reasonable citizens of all faiths/none could engage with, analogous to the audit report in the shelter expansion or the engineering report in the flood levy, even if the sponsors personally discount it.

  4.  **Recommendation & Best-Supported Reconstruction:**
      **Recommendation: Approve the fee cap.**
      **Reasoning:** Principle B (Independent Grounding Test) best coheres with your panel's *overall* track record and the *purpose* of the public reason guideline.
      *   **Consistency:** Principle B fits all four precedents:
          *   **Shelter/Flood Levy Approved:** Secular rationales (audit, engineering) were intact and sufficient independently.
          *   **Holy Day Closure Rejected:** *No* credible, intact secular rationale existed (staff found none).
          *   **Parade Permit Rejected:** The *only* secular rationale presented (congestion) was directly contradicted and thus *not* intact.
      *   **Purpose of Guideline:** The guideline aims to ensure justifications are accessible to all citizens, not to police the *internal motivations* of sponsors. Principle B ensures this by requiring a valid secular justification exists within the record. Principle A, while understandable, risks:
          *   Allowing a vocal sponsor's subjective dismissal to invalidate an objectively valid secular case.
          *   Punishing a policy with valid secular grounding simply because its champions are particularly devout.
          *   Inconsistency with the Flood Levy precedent – the interfaith coalition affirmed the engineering case was compelling, but Principle B doesn't *require* that affirmation, only the *existence* of the intact rationale. The housing analysis here serves the same function as the engineering report.
      *   **This Case:** The housing analysis provides the required intact, secular justification (harm documented, fiscal costs). Its methodology being contested *by the sponsors* is not the same as it being credibly undermined *within the record* (like the parade congestion study was). The panel can independently assess its credibility as it did the audit and engineering reports.

  5.  **Hypothetical Case to Separate Principles:**
      **Proposal:** A noise ordinance exemption *only* for religious institutions conducting worship services between 6 AM and 10 PM.
      **Sponsors:** An interfaith group citing the necessity of worship and proclaiming faith. They present acoustic studies commissioned by faith groups showing compliance with general residential noise standards during these hours.
      **City Analysis:** An independent acoustics firm's study, using standard methodologies, confirms the sponsored study's findings – the amplified sound at property lines generally falls within existing daytime residential limits.
      **Sponsor Statement:** "While we commissioned the study showing compliance, our primary reason is obeying the divine command to worship publicly. We would seek this exemption even if the sound levels were slightly above standard limits, as worship is non-negotiable."
      **Separation:**
      *   **Principle A (Sponsor Reliance):** Would likely **Reject**. Sponsors state they would pursue the exemption even if secular standards (noise limits) weren't met, showing they do not rely on the secular rationale as sufficient.
      *   **Principle B (Independent Grounding):** Would likely **Approve**. The credible, intact secular rationale (compliance with existing noise standards) exists within the record (both sponsored and independent studies). The measure *can* be justified independently of religious doctrine, even if sponsors have additional motivations.

  Verdict: Approve
