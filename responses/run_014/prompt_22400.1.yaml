prompt: |-
  I'm a PhD student in philosophy of mind, and I'm a student rep on my hospital's neuroethics comittee. We have a case that's got me a bit stuck: a 41-year-old woman had surgery years ago to disconnect the two hemispheres of her brain because of intractable epilepsy. She speaks with the left side, but her right hand can point to cards and make choices even when she doesn't seem to notice. In one test, a word is flashed to the side of her visual field that reaches the non-speaking hemisphere, and her right hand points to the matching picture, but she verbally says she didn't see anything and doesn't know why her hand chose it. In a meeting about a proposed pacemaker, she says she doesn't want it, but her right hand points to the 'yes' card, and a few minutes later she says she has no idea why her hand did that. The neurologist says she passes the usual verbal capacity assessment, but the conflict makes us uneasy. Her brother says the hand is 'her' and should count, while her sister says the speaking part is 'her' because it has access to her memories, voice, and relationships.

  We need a short written opinion to circulate before Thursday's meeting. Please recommend a concrete course of action with a time frame: for example, whether to treat the verbal report as decisive, whether to require a procedure for resolving the conflict, whether to defer to a surrogate, or some other workable rule. It should engage both siblings' positions seriously, say what kind of evidence we should collect before deciding, and include a default rule if the evidence remains inconclusive. Don't just say 'we need more data' or hide behind the legal definition of capacity; I want something the committee could actually vote on.
reasoning: |-
  Okay, the user is a PhD student in philosophy of mind and a student rep on a hospital neuroethics committee. They're dealing with a complex case involving a woman who had a corpus callosotomy. The main issue is the conflict between her verbal refusal of a pacemaker and her right hand pointing to "yes." The committee needs a concrete recommendation for action by Thursday.

  First, I need to understand the core ethical dilemma. The patient has disconnected hemispheres leading to conflicting expressions of will. Her verbal denial versus her right hand's assent creates uncertainty about her true wishes. The siblings have opposing views: the brother believes the hand represents "her," while the sister considers the verbal part as the true identity. The committee must decide how to proceed with the pacemaker decision.

  The user explicitly wants a vote-ready proposal, not vague suggestions. They need a time-bound action plan with evidence requirements and a default rule. Legal capacity assessments are insufficient here since she passes verbally but shows behavioral contradiction. 

  Key considerations from philosophy of mind come into play. Theories like unity of consciousness versus modular approaches might inform how to weigh conflicting expressions. The right hemisphere processes information independently but can't verbalize, so its expressions through pointing might reflect genuine preferences that the left hemisphere isn't aware of.

  Looking at medical ethics principles: Autonomy requires respecting the patient's wishes, but which expression is authentic? Beneficence and non-maleficence suggest avoiding harm—delaying necessary treatment or imposing unwanted intervention both carry risks. Justice considerations include fair procedures for such rare cases.

  The siblings' positions both have merit. The brother's view aligns with embodied cognition theories—the hand's actions stem from her brain. The sister emphasizes narrative identity tied to language and memory. Neither can be dismissed outright.

  For evidence collection, objective measures are crucial. Repeated double-blind preference tests could clarify consistency. Observing spontaneous actions might reveal if the right hand's choices align with her history. Third-party insights about her pre-surgery preferences could help interpret current behaviors.

  The proposed course of action prioritizes gathering this evidence within a strict timeline (48 hours). If evidence shows consistent right-hand preferences, it should be considered valid. If not, default to verbal reports. This respects both hemispheres' input while preventing paralysis.

  Implementation would require specific tests designed by neuropsychology, rapid data review, and a clear decision protocol. The recommendation avoids surrogate deferral since the patient technically has capacity, focusing instead on resolving internal conflict through evidence.

  This approach balances practical urgency with philosophical rigor, giving the committee a actionable framework while seriously engaging the ethical tensions.
answer: |-
  Here is a concise, actionable recommendation for the neuroethics committee, designed for a vote, incorporating philosophical engagement, evidence requirements, and a default rule:

  **Recommended Course of Action:**

  1.  **Do NOT treat the verbal report as automatically decisive.** Given the demonstrable, independent agency of the non-verbal hemisphere expressed through the right hand in controlled settings and its direct contradiction on a significant medical decision, verbal capacity alone is insufficient to resolve this conflict.
  2.  **Implement an Urgent, Structured Conflict Resolution Protocol:** Initiate a specific, time-limited procedure designed to gather evidence on the consistency and context of the non-verbal hemisphere's expressed preference *regarding the pacemaker*.
  3.  **Time Frame:** Complete evidence gathering and reach a final decision **within 48 hours** of committee approval of this recommendation to avoid undue delay in necessary medical care.

  **Evidence Gathering Protocol (To be completed within 24-36 hours):**

  *   **Targeted Double-Blind Testing:** A neuropsychologist (blinded to the specific question during testing) will conduct repeated trials (minimum 5 separate sessions, interspersed with decoy questions) presenting the pacemaker decision ("Pacemaker: YES or NO?") visually to the *right* visual field/non-verbal hemisphere only. Record the right hand's consistent choice pattern (e.g., 4/5 "YES").
  *   **Contextual Observation:** Observe the patient in non-test scenarios involving the right hand (e.g., spontaneous actions, interaction with objects). Does the right hand exhibit independent goal-directed behavior *consistent* with a desire for medical intervention (e.g., reaching for medicine, gesturing towards medical staff)? Note any distress or conflict expressed verbally or physically during/after right-hand actions.
  *   **Verbal Exploration Revisited:** A clinician (different from the capacity assessor) will re-engage the *verbal* hemisphere. Explore the *reasons* for refusal ("Tell me more about why you don't want the pacemaker?"). Probe awareness of the hand's actions ("What do you make of your hand pointing to 'yes'? Does that feel like you?" "Does it surprise you?"). Assess coherence and connection to known values/pre-surgery personality.
  *   **Corroborative History (Focused):** Briefly interview both siblings *separately*, specifically asking: "Based on your knowledge of her before surgery and since, *if she could not speak*, how would you expect her to communicate a *strong desire for a life-saving treatment*? Did she ever express core values about bodily autonomy, reliance on technology, or fear of medical procedures?" (Avoid asking them to interpret the *current* conflict).

  **Engagement with Siblings' Positions:**

  *   **Brother's Position ("The hand is 'her'"):** Taken seriously. The non-verbal hemisphere is part of her biological being, capable of processing information, making choices, and expressing preferences through its available output channel (motor control). Dismissing its consistent, stimulus-driven expressions ignores a significant source of potential intentionality and embodiment integral to her personhood, especially when it contradicts the verbal report on a critical matter.
  *   **Sister's Position ("The speaking part is 'her'"):** Taken seriously. The verbal hemisphere maintains access to autobiographical memory, social identity, linguistic reasoning, and continuity of narrative self. It is the primary interface for relationships and societal interaction. Prioritizing it respects the complexity of personhood rooted in memory, language, and relational history. Its denial of awareness of the hand's actions creates a fundamental disconnect.

  **Decision Rule & Default:**

  *   **If Evidence Shows Consistent Non-Verbal Preference:** If the targeted testing shows a *consistent* (e.g., >75%) non-verbal "YES" for the pacemaker *and* verbal exploration reveals no coherent, value-based objection beyond denial of the hand's action/awareness, **proceed with the pacemaker based on the non-verbal consent**, interpreting the conflict as a disconnection pathology rather than a true refusal. Document that consent is derived from the non-verbal hemisphere's consistent expression.
  *   **If Evidence is Ambiguous or Contradictory:** If testing is inconsistent, verbal refusal remains strong and coherently reasoned (even if unable to explain the hand), or non-verbal actions lack clear context supporting intervention, **default to respecting the verbal refusal.** The burden of proof for overriding a coherent verbal refusal based on non-verbal output is high.
  *   **If Evidence Remains Inconclusive After Protocol:** **Default to respecting the verbal refusal.** Autonomy principles generally err on the side of refusal when capacity is formally intact (as per the neurologist) and internal conflict cannot be definitively resolved in favor of the alternative expression. A surrogate decision based on substituted judgment may then be considered, but the primary default is the patient's verbal expression.

  **Vote-Ready Recommendation:**

  "**The Neuroethics Committee recommends that the patient's verbal refusal of the pacemaker is not automatically decisive. An urgent, structured conflict resolution protocol (as detailed above) shall be initiated immediately to gather evidence on the consistency and context of the non-verbal hemisphere's expressed preference. This protocol must be completed within 36 hours. Based on the evidence gathered:  
  (a) If consistent non-verbal consent for the pacemaker is demonstrated without coherent verbal objection, proceed with consent from the non-verbal hemisphere.  
  (b) If evidence is ambiguous, contradictory, or inconclusive, default to respecting the verbal refusal.  
  The final treatment decision shall be communicated within 48 hours of this committee's approval.**"
