prompt: |-
  I work for a fisheries and wildlife agency, and we keep getting proposals to list newly discovered populations as distinct species for the purposes of conservation law. The concept of species is philosophically contentious: the biological species concept (reproductive isolation) and the phylogenetic species concept (monophyly) can give different answers for the same population, and it is not clear whether species are natural kinds at all or whether the right species concept is a matter of pragmatic choice. Please write a decision procedure my team could actually run on a proposal to list a population as a distinct species: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with a no, and where it hands the decision to a person because the question is one of values rather than facts. Then run it on two proposals: listing a newly discovered fish population that is reproductively isolated but not monophyletic, and listing a bird subspecies that is monophyletic but not reproductively isolated.
reasoning: |-
  Okay, the user works for a fisheries and wildlife agency and is dealing with proposals to list newly discovered populations as distinct species for conservation purposes. They're facing the philosophical problem of what defines a species—biological species concept (reproductive isolation) vs. phylogenetic species concept (monophyly). They need a practical decision procedure that can handle these conflicts and two specific cases.

  First, I need to understand their core needs. The user wants a step-by-step process that their team can follow to evaluate species listing proposals. This procedure must clearly outline the questions to ask, what constitutes sufficient evidence, when to reject a proposal, and when to escalate to human judgment. The examples provided are a fish population that's reproductively isolated but not monophyletic, and a bird subspecies that's monophyletic but not reproductively isolated.

  The user's explicit request is for a decision tree that incorporates both scientific criteria and value-based judgments. But their deeper needs might include reducing ambiguity in decision-making, ensuring consistency across cases, and justifying decisions to stakeholders. They might also be concerned about the conservation implications—listing a population could allocate resources, affect legal protections, or influence ecosystem management.

  For the decision procedure, I should start with foundational questions to avoid wasting time on invalid proposals. Step 1 should verify if the population is diagnosable—meaning it has unique traits. Without that, it's not a candidate for species status under any concept. Step 2 would assess reproductive isolation (BSC), and Step 3 monophyly (PSC). Each step needs clear pass/fail thresholds: strong evidence for isolation or monophyly leads to automatic listing, ambiguous cases go to human review.

  The key insight is that when scientific concepts conflict—like in the examples—it becomes a policy issue. The procedure must flag this and hand it to humans, who can weigh conservation priorities. For instance, is protecting a genetically unique bird more important than strict reproductive criteria? That's not a science question; it's about values.

  Applying this to the fish example: it passes Step 1 (diagnosable), Step 2 (strong isolation), so it gets listed under BSC. No need to check monophyly—it's a clear case. For the bird: it passes Step 1 and Step 3 (monophyly), but fails Step 2 (no isolation). Since it's a subspecies, Step 4 triggers a values-based decision. Humans must decide if phylogenetic uniqueness justifies protection despite gene flow.

  I should emphasize that this procedure prioritizes pragmatism. It uses science where possible but acknowledges that conservation isn't purely objective. The examples illustrate how it streamlines decisions while highlighting where human judgment is essential. This should address the user's frustration with contentious species concepts and provide a actionable framework.
answer: |-
  Here’s a practical, step-by-step **Decision Procedure for Species Listing Proposals**, designed for agency use. It prioritizes scientific evidence while explicitly flagging value-based decisions for human judgment. The procedure assumes proposals include baseline data (morphology, genetics, ecology).

  ---

  ### **Decision Procedure: Is a Population a Distinct Species?**  
  *(Run each question sequentially; stop when a clear outcome is reached)*

  1. **Is the population diagnosably distinct?**  
     - *Question:* Does the population have fixed (100% prevalent) or near-fixed (≥95% prevalent) diagnostic traits (morphological, genetic, behavioral, or ecological) that distinguish it from all other known populations?  
     - *Sufficient evidence:* Peer-reviewed data showing consistent, heritable differences.  
     - **→ NO:** Reject proposal (*not distinct enough for any species concept*).  
     - **→ YES:** Proceed to Question 2.

  2. **Is the population reproductively isolated?**  
     - *Question:* Is there evidence of **complete or near-complete reproductive isolation** in nature?  
       - *Key evidence:*  
         - Sympatry without hybridization OR  
         - Hybridization ≤5% in contact zones OR  
         - Strong pre/post-zygotic barriers (e.g., mating avoidance, hybrid inviability).  
     - *Sufficient evidence:* Field studies, genetic analyses of wild hybrids, or experimental crosses.  
     - **→ STRONG YES (isolation ≥95%):** **List as species** (*Biological Species Concept satisfied*).  
     - **→ WEAK/AMBIGUOUS EVIDENCE:** Proceed to Question 3.  
     - **→ NO:** Proceed to Question 3.

  3. **Is the population monophyletic?**  
     - *Question:* Does the population form a **monophyletic clade** in robust phylogenies (e.g., concordant nuclear + mtDNA trees with high bootstrap support)?  
       - *Key evidence:*  
         - Shared derived alleles (synapomorphies) OR  
         - Consistent branch support (≥90% bootstrap) separating it from closest relatives.  
     - *Sufficient evidence:* Genomic data (e.g., SNPs, whole genomes) analyzed with standard methods (e.g., coalescent models).  
     - **→ YES:** Proceed to Question 4.  
     - **→ NO:** **Reject proposal** (*Fails both major species concepts*).  

  4. **Policy Evaluation: Conservation Imperative vs. Taxonomic Uncertainty**  
     - *Question:* Does the population represent a **unique evolutionary lineage** with **high conservation value**?  
       - *Factors for human judgment:*  
         - Risk of extinction without listing (e.g., endemic, small range, threats).  
         - Ecological role (e.g., keystone species).  
         - Phylogenetic distinctiveness (e.g., long branch length).  
         - Political/public significance (e.g., cultural icon).  
       - *Escalate to:* Agency leadership + independent scientists.  
     - **→ HIGH CONSERVATION VALUE:** **List as species** (*Pragmatic conservation decision*).  
     - **→ LOW/MODERATE VALUE:** **Reject or list as subspecies** (*Insufficient justification*).

  ---

  ### **Application to Case Studies**

  #### **Case 1: Fish Population (Reproductively Isolated, Not Monophyletic)**  
  - **Step 1 (Diagnosable?):** YES – Proposal shows unique fin morphology and coloration.  
  - **Step 2 (Reproductively Isolated?):** STRONG YES – Genetic data confirms <2% hybridization with nearest relative in shared habitats.  
  - **Outcome:** **LIST AS SPECIES** (Decision stops at Step 2; Biological Species Concept met).  
  - *Rationale:* Strong reproductive isolation overrides non-monophyly (e.g., due to incomplete lineage sorting). No values judgment needed.

  #### **Case 2: Bird Subspecies (Monophyletic, Not Reproductively Isolated)**  
  - **Step 1 (Diagnosable?):** YES – Genetic and plumage differences documented.  
  - **Step 2 (Reproductively Isolated?):** NO – Hybridizes freely (∼15% gene flow) with neighboring subspecies.  
  - **Step 3 (Monophyletic?):** YES – Genomic phylogeny shows strong monophyly (bootstrap = 98%).  
  - **Step 4 (Policy Evaluation):**  
    - *Facts:*  
      - Monophyletic lineage diverged >500k years ago.  
      - Endemic to a single island; habitat declining by 7%/year.  
      - Population <1,000 individuals.  
    - *Values Judgment:*  
      - **High extinction risk + evolutionary distinctness** justify listing despite hybridization.  
    - **Outcome:** **LIST AS SPECIES** (via Step 4 policy exception).  
  - *Rationale:* Phylogenetic significance and conservation urgency override lack of reproductive isolation.

  ---

  ### **Key Design Notes**  
  - **Science-Values Firewall:** Steps 1–3 are science-driven (objective thresholds). Step 4 is explicitly values-driven.  
  - **Efficiency:** Eliminates philosophically ambiguous cases early (e.g., non-diagnosable or failing both concepts).  
  - **Conservation Pragmatism:** Prioritizes preventing extinction over taxonomic purity when evidence is conflicted but risk is high.  
  - **Transparency:** Documents why a decision was made (e.g., "Listed per BSC" vs. "Listed per conservation imperative").  

  This procedure ensures defensible, timely decisions while acknowledging that conservation policy requires balancing science with societal values.
