  First, I need to deconstruct why the full-domain assumption is crucial. The theorem's combinatorial explosion when all preference orderings are permitted creates an environment where strategic manipulation becomes inevitable. This feels analogous to chaotic systems in mathematics - unrestricted initial conditions lead to unpredictable outcomes. The user's discomfort with the "blanket prohibition" interpretation suggests they intuitively sense domain constraints as mathematically natural, not artificial.

  The single-peaked preference case deserves special attention. I recall that its linear structure along a policy spectrum allows the median voter theorem to function strategy-proofly. But I must be precise: the mechanism works because any unilateral deviation either doesn't alter the median or moves it away from the deviator's true peak. The user's confessed unease about this likely stems from how discontinuous preferences could break it - I should emphasize the domain restriction's role in preventing such pathologies.

  Regarding the "sleight of hand" objection, there's a philosophical depth here. Domain restrictions aren't arbitrary when they model real-world ideological coherence. This mirrors applied math practices where simplifying assumptions make problems tractable without losing relevance. The user's operations research colleague probably recognizes this from optimization problems with structured constraints.

  For practical electoral design, I should highlight how many real institutions already operate within domain-like constraints (parliamentary systems with party discipline, primary elections with aligned voters). The theorem becomes less a death knell and more a design guideline: either accept limited strategic vulnerability or engineer preference coherence through institutional structures.

