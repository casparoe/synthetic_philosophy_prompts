  2. **Non-branching**: The continuity does not split into multiple contemporaneous streams.
  3. **Robustness**: The psychological connectedness is sufficiently high (e.g., no critical degradation of core autobiographical content).

  **Identity criterion**:  
  *A future person is identical to you if they satisfy robust psychological continuity, causal immediacy, and non-branching. When branching occurs, identity is lost, but "what matters" (survival-relevant psychological continuity) may still hold in a diminished, non-identical form.*

