prompt: |-
  I'm presenting at a philosophy of physics workshop next week my view that Lewis's Best System Account of laws of nature fails on a circularity problem: the laws are the theorems of the best system, the best system is the system that best systematizes the regularities, but the laws are supposed to explain the regularities, so the explanation is circular — and I argue this circularity is fatal, not minor, and that the only way out is an anti-Humean "governing" account on which laws bring about the regularities rather than merely describing them. The audience is a group of philosophers of physics, two of whom are committed Lewisians who know the BSA inside out, plus several agnostics. Prepare me for the question period: the objections I'll actually get from this audience, in roughly the order they'll come, phrased the way a Lewisian would phrase them, each with a two-minute reply and a note on where the reply is soft. Include the objection I'm hoping nobody asks.
reasoning: |-
  Okay, let me think through how to prepare this user for their philosophy workshop defense. The user is presenting a critique of Lewis's Best System Account (BSA) centered on circularity, with a room full of specialists including committed Lewisians. 

  First, I need to anticipate the actual objections in likely order. The opening salvo will probably be the "no metaphysical circularity" move - Lewisians will insist BSA is descriptive, not explanatory. My user needs to counter that this undermines laws' explanatory role in science, which is their core concern.

  Then comes the "systematization isn't explanation" distinction. The user should grant the semantic point but press the intuition that laws should ground regularities. The soft spot here is that the user's critique relies on a pre-theoretic intuition about explanation that Lewisians reject.

  The third wave will likely be pragmatic virtues - how BSA avoids governing laws. User must concede this advantage but argue it comes at too high a cost. The vulnerability is that naturalists may find governing accounts metaphysically extravagant.

  Now for the objection my user fears: the "your alternative fails" challenge. If governing accounts have their own problems (disagreement, modality, quantum issues), the user needs to bite the bullet and admit this while maintaining BSA is worse. This is the weakest point - it shifts debate to comparative metaphysics.

  Finally, the "BSA works fine" empirical argument. User should question whether any system actually achieves uniquely best status in complex physics. But this risks sounding like a technical quibble rather than principled objection.

  Throughout, I'm noting where replies are soft - places where Lewisians can dig in their heels. The user's strongest card is insisting on robust scientific explanation, but that's precisely what Lewisians redefine. This dialectic will hinge on whether the audience shares the user's intuition about what laws must do.
answer: |-
  Here's a breakdown of likely objections you'll face, phrased as a Lewisian would, with concise replies and vulnerability notes:

  1.  **Objection (Descriptive Priority):** "You're mischaracterizing the BSA's explanatory ambition. Lewis was explicit: laws *describe* the patterns in the Humean mosaic via an efficient summary. They don't metaphysically 'explain' or 'bring about' the regularities *in that strong sense*. The 'explanation' is pragmatic and epistemic: knowing the laws *allows us* to efficiently explain/predict particular events *within* the mosaic. There's no circularity because the laws aren't *ontologically prior* to the mosaic; they supervene on it. The 'explanation' of regularities is just seeing them as consequences of the summary."
      *   **Reply (2 min):** "I grant Lewis aimed for a descriptive summary. But the *functional role* laws play *in science* (and in Lewis's own discussions of counterfactuals, causation, chance) *requires* them to be more than just labels for patterns. When we say 'the law explains why planets orbit elliptically,' we mean it *makes it the case* or *grounds* the regularity, not just that it compresses the data. The BSA *tries* to capture this functional role by making laws the 'best' summary. But if 'best' is defined *in terms of* the very patterns they're meant to explain (via strength + simplicity + fit), we have a *conceptual* circularity undermining their *explanatory potency*. Science uses laws to *explain why the mosaic is as it is*; the BSA reduces this to 'the mosaic is as it is because it is as it is, summarized thusly.' That's explanatorily empty."
      *   **Soft Spot:** Lewisians will insist you're importing an anti-Humean demand for grounding/ontology that the BSA explicitly rejects. They see the epistemic compression *as* the explanation.

  2.  **Objection (Systematization ≠ Explanation):** "You're conflating two senses of 'explain'. The BSA provides a *systematization* of the regularities. This systematization *enables* scientific explanation (e.g., deducing specific events from the laws). But the laws themselves don't 'explain' the *existence* of the regularities in some deeper metaphysical sense; they *reflect* them. The circularity you see arises only if you insist laws must explain the regularities in that strong, non-Humean sense – a sense the BSA denies is necessary or coherent."
      *   **Reply (2 min):** "The distinction is crucial, but it highlights the BSA's core limitation. If the laws *merely* reflect the regularities, they cannot genuinely *explain why* those regularities hold rather than others. Consider indeterministic laws: the BSA says the probabilistic law *is* the best summary of the frequencies. But that law cannot *explain why* the frequencies turned out that way – it just *is* a description of them. Any attempt to use the law to explain the frequency pattern itself ('Why did heads come up 50%? Because the chance was 0.5') becomes viciously circular: the chance *is defined by* the frequency in the best system. The BSA cannot ground non-circular explanations of *why the world exhibits the specific patterns it does*."
      *   **Soft Spot:** Lewisians may argue that explaining *why the mosaic is this way* is either a) illegitimate (Humeanism) or b) explained by initial conditions + laws, where the laws *are* just the systematization. They'll see your demand as question-begging.

  3.  **Objection (Pragmatic Virtues Escape Circularity):** "The 'best' system isn't chosen *solely* by the brute regularities. It's chosen by the balance of *simplicity*, *strength*, and *fit* – pragmatic, epistemic virtues. These virtues *break* the alleged circularity. The laws aren't *just* the regularities; they are the most efficient, informative *way of describing* them. This structure provides genuine explanatory insight *because* it minimizes complexity while maximizing predictive power. The circularity vanishes once you see how the virtues constrain the system choice independently."
      *   **Reply (2 min):** "Simplicity and strength are crucial, but they are applied *to the candidate systems* which are evaluated *by how well they capture the actual regularities* (fit). Fit is paramount. A maximally simple system (e.g., 'Everything happens randomly') has terrible fit. A maximally strong system listing every event has terrible simplicity. The 'best' system is precisely the one that optimally trades off describing the *actual, observed regularities* (fit) with simplicity and strength. The laws *still supervene entirely* on the mosaic, including its regularities. The virtues guide the *selection* of the description, but they don't inject any content *independent* of the mosaic that could ground a non-circular explanation *of* that mosaic's patterns. The explanation remains 'The patterns exist because they exist, described efficiently.'"
      *   **Soft Spot:** Lewisians will argue the virtues *do* provide independent constraint, making the system more than a mere list. They'll see your reply as downplaying the genuine work simplicity/strength do.

  4.  **Objection (What's the Alternative?):** "Even *if* there's a circularity worry (which we dispute), your proposed 'governing' account faces far worse problems. What *are* these governing laws? Platonic entities? Causal powers? Modal primitives? How do they interact with matter? This seems metaphysically extravagant, non-naturalistic, and potentially inconsistent with fundamental physics (e.g., quantum indeterminacy). The BSA, despite perceived flaws, offers a clear, naturalistically acceptable account grounded in the actual world. Isn't that preferable to mysterious governing entities?"
      *   **Reply (2 min):** "You're right that governing accounts face challenges. But the BSA's circularity is fatal to its core claim of capturing lawhood *as science understands it*. Governing accounts (like Armstrong's, Dretske's, Tooley's, or Maudlin's primitivism) *directly* address the need for laws to *constrain* and *explain* the mosaic, not just describe it. Yes, they require richer metaphysics – powers, universals, primitive modality, or fundamental nomic facts. But this is the cost of avoiding circularity and capturing scientific practice. Many find these accounts compatible with physics; Maudlin's primitivism, for instance, is strikingly minimalist. The choice isn't between perfect BSA and mystical governance; it's between a circular description and a potentially more ontologically committing but genuinely explanatory account."
      *   **Soft Spot:** This is the weakest point *for you* in this audience. Philosophers of physics are often deeply wary of "extra" metaphysics. The Lewisian will pounce on the perceived obscurity, lack of empirical traction, and potential conflicts with physics interpretations (e.g., quantum non-locality seeming non-governed) of governing views. Your reply needs to acknowledge the cost while firmly stating the BSA's flaw is worse *for the concept of lawhood*.

  5.  **Objection (BSA Works in Practice):** "The BSA *delivers*. It gives us a framework to understand how laws like Newton's or Maxwell's *could* be true in a world just composed of local matters of fact. It handles probabilistic laws naturally. It integrates beautifully with a Humean theory of chance and causation. It avoids the 'inference problem' of governing views (how do we know the laws?). It provides a clear criterion for lawhood. If it works so well for modeling scientific practice and solving philosophical puzzles, why obsess over a perceived circularity that doesn't manifest in its successful applications?"
      *   **Reply (2 min):** "Its 'success' is precisely the problem! It *seems* to deliver explanations *because* we tacitly import the governing conception we use in science. When we say 'Newton's law explains the orbits,' within the BSA, this *actually means* 'The orbits are part of the pattern best summarized by Newton's law.' But this isn't what scientists *mean* when they invoke laws for explanation; they mean the law *constrains* the motion. The BSA piggybacks on this intuition while undermining its foundation. It handles probabilistic laws *by definition*, making them powerless to explain frequencies. It avoids the inference problem only by making laws *less* than what science requires them to be – fundamental explainers. Its criterion for lawhood is ultimately circularly dependent on the very phenomena laws are meant to explain."
      *   **Soft Spot:** This appeals strongly to naturalistic/philosophy-of-science sensibilities. Arguing that scientists are "confused" about what they mean by explanation is a hard sell. Your reply needs to sharply distinguish the *pragmatic utility* of BSA systematizations from their failure to capture the *ontological/explanatory role* attributed to laws.

  **The Objection You Hope Nobody Asks (But Likely Will):**

  *   **Objection (The 'No Miracle' Argument Flipped):** "Your governing laws seem like precisely the kind of unexplainable, brute 'miracle' Humeans reject. *Why* do these governing laws exist? *Why* are they the ones that hold? *How* do they govern? The BSA, by making laws supervene on the mosaic, avoids this mystery. The mosaic is the ultimate brute fact. Isn't positing fundamental governing laws *more* mysterious and *less* explanatory than the BSA? At least the BSA explains how we *discover* laws (by finding the best system), while your account offers no epistemology beyond 'we infer them' – which is just what the BSA does anyway!"
      *   **Reply (2 min):** "This hits the core metaphysical disagreement. Yes, governing laws are posited as fundamental nomic facts or relations. They *are* part of the bedrock. But this isn't a 'miracle'; it's a different metaphysical commitment. The Humean takes the entire mosaic as the brute fact. The anti-Humean takes laws plus initial conditions (or mosaic *under* laws) as the brute fact. Neither explains the *ultimate* brute fact. The key difference is *structure*: governing laws provide a *reason* internal to reality *why* the mosaic exhibits the regularities it does – the laws *constrain* it. The BSA offers no such internal reason; the patterns are just *there*. As for epistemology: we infer governing laws *by* finding the best systematizations *too*! The difference is in what we take that systematization to *represent*: a fundamental constraint (anti-Humean) or just a description (Humean). The 'no miracle' argument *for* laws highlights that the regularity of the world *demands* explanation; the BSA denies this demand can be met, leaving the regularity itself as the ultimate, inexplicable miracle."
      *   **Soft Spot:** This forces you onto explicitly metaphysical ground, defending fundamental modality or structure, which some philosophers of physics (especially those leaning positivist or operationalist) find deeply suspect. Your "different brute fact" reply is honest but may feel unsatisfying to those seeking ultimate reduction. Emphasize that the BSA leaves the *specificity* and *pervasiveness* of the regularities utterly unexplained.

  **Key Strategies for Your Replies:**

  1.  **Consistently Hammer the "Explanatory Function" Point:** Focus relentlessly on the idea that scientific explanation requires laws to be *more* than descriptions/summaries. Argue the BSA fails to capture *this specific role*.
  2.  **Distinguish Epistemic vs. Ontological:** Acknowledge the BSA's virtues for *discovery* and *prediction*, but insist it fails ontologically for *explanation*.
  3.  **Use Concrete Examples:** Probabilistic laws explaining frequencies is a strong point. "Why *this* frequency?" has no non-circular BSA answer.
  4.  **Concede the Metaphysical Cost (But Argue It's Necessary):** Don't shy away from the fact governing accounts need "more" metaphysics. Argue it's the price of avoiding circularity and capturing scientific practice accurately.
  5.  **Frame the Choice:** Present it as: Do you want a clear, naturalistic account that makes laws explanatorily inert (BSA), or a metaphysically richer account that grounds genuine scientific explanation (Governing)? Argue the latter is necessary for philosophy of physics to match scientific realism about laws.

  Good luck! The Lewisians will be tough, but your critique is central and well-known. Stick to your guns on the circularity undermining *genuine explanation*.
