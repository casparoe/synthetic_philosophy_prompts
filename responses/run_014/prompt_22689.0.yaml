  Okay, the user is working on an essay about Aquinas's view on tyrannicide and is struggling with a tension between two claims. On one hand, Aquinas says only public authorities can lawfully kill evildoers; on the other, he praises private citizens who kill tyrants, like Caesar's assassins. The user wants me to argue that the killing of a tyrant by a private person is lawful only when it's seen as an exercise of public authority on behalf of the community, not a private act.

  First, I need to recall Aquinas's key texts. In the Summa Theologiae, he distinguishes between public and private authority in killing. Then in De Regno and his commentary on Romans, he discusses tyranny. The Cicero reference about Caesar's killers is crucial here. The user's proposed resolution hinges on the idea that the community can assume public authority when the tyrant fails to act for the common good.

  Why does the tyrant ruling for private good matter? Aquinas defines tyranny as a perversion of rulership, where the ruler serves personal interests instead of the common good. This breaches the social contract, making the tyrant a public enemy. Thus, the community retains the authority to depose him. The killers act as agents of the community, not individuals. 

  I should contrast this with a private right of resistance. If Aquinas allowed that, it would contradict his strict hierarchy where only public authority can sanction killing. Granting private rights could lead to anarchy, which he wants to avoid. The community-based approach maintains order by framing tyrannicide as restoration of legitimate authority.

  The user might also be concerned about how to distinguish between legitimate tyrannicide and vigilante justice. Emphasizing that the act must be for the common good, not personal revenge, addresses this. The reference to Cicero shows Aquinas endorsing only cases where the killers are seen as liberators, not murderers.

  I need to ensure the argument shows why this interpretation is superior. It preserves Aquinas's consistency, avoids contradictions with his broader political theory, and aligns with natural law principles. The community's residual authority is key here. Also, addressing potential counterarguments, like why the killers aren't officials, by explaining they act as representatives of the people's will.

  The user's deeper need might be to present a coherent thesis in their essay, resolving the apparent contradiction in Aquinas. They might also want to demonstrate a nuanced understanding of medieval political theory. Highlighting how Aquinas's view differs from modern individualism could add depth. Ensuring the explanation is clear and logically structured will help the user's essay be persuasive.
answer: |-
  Here is an argument supporting your proposed reading, resolving the tension in Aquinas by grounding tyrannicide in the community's residual public authority, not a private right:

  **Thesis:** Aquinas's apparent endorsement of private tyrannicide is consistent with his prohibition on private killing because the tyrant, by ruling for private gain, fundamentally ceases to be a legitimate public authority and severs his bond with the community. This rupture allows the *community itself* (embodied in its members acting collectively or representatively) to reassert its inherent public authority for the common good, transforming the seemingly private act of killing into a legitimate exercise of *public* judgment and execution on behalf of the whole.

  **Argument:**

  1.  **The Foundational Principle of Public Authority:** Aquinas's core principle (`Summa Theologiae` II-II, Q64, A3) is unambiguous: killing an evildoer is lawful only for those entrusted with the care of the common good ("soli publicae auctoritati... commissae"). This is because:
      *   Justice requires impartial judgment and proportionate punishment, best secured by public institutions.
      *   Private vengeance destabilizes society, leading to cycles of violence ("infinita discordiarum sequerentur").
      *   The authority to take life for the common good is delegated *to* specific offices *by* the community for its own preservation and order.

  2.  **Tyranny as the Annulment of Legitimate Authority:** Aquinas defines tyranny as rule directed towards the ruler's "own private benefit" rather than the "common good" (`De Regno`, I.3; Commentary on Romans 13:1-7). This is not merely bad governance; it is a fundamental *perversion* of the very nature of rulership.
      *   **Loss of Public Character:** By subordinating the common good to his private appetite, the tyrant abandons his role as a *public* authority. He ceases to act *for* the community and begins acting *against* it. His power becomes an instrument of private predation, not public service.
      *   **Violation of the Social Bond:** The community's submission to authority is predicated on that authority serving its welfare. Tyranny breaks this implicit pact. The tyrant, by his actions, effectively declares himself an enemy of the common good and severs the bond that legitimizes his power over the community.

  3.  **The Community's Residual Public Authority:** When the tyrant abdicates his public role, the source of legitimate authority reverts to its origin: the community itself ("multitudo" - `De Regno`, I.6). The community, as the collective body whose good is the *raison d'être* of political authority, retains an inherent right to self-preservation and the restoration of just order.
      *   **Acting on Behalf of the Whole:** Killing the tyrant is not an act of private self-defense or vengeance by an individual. It is an act undertaken *by a member (or members) of the community* specifically *as an agent of the community*, for the explicit purpose of liberating the *whole* from a destructive force that has usurped public authority. The killer(s) acts *in loco communitatis* (in place of the community).
      *   **Assumption of the Public Role:** This is why appealing to Cicero's defense of Caesar's assassins (`De Officiis`) is crucial for Aquinas. Brutus and Cassius, though holding no *official* office at the moment of the act, were acting *as representatives of the Roman people* against one who had destroyed the Republic (the public order) for his own ambition. Their act was judged praiseworthy *because* it was understood as the community, through its members, reasserting its public authority against a usurper who had become a public enemy ("hostis publicus"). The act derives its legitimacy from its *public purpose and representative character*.

  4.  **Why "Private Right of Resistance" is Inferior and Inconsistent:**
      *   **Contradicts Core Principle:** Directly granting a "private right" to kill any ruler deemed tyrannical by an individual fundamentally contradicts Aquinas's absolute prohibition on private individuals taking life. It opens the door to the very anarchy and private vengeance he seeks to prevent.
      *   **Ignores the Public Nature of the Crime & Remedy:** Tyranny is a uniquely *public* crime – an attack on the common good itself. Its remedy must therefore also be public in nature. A "private right" framework reduces the act to an individual grievance, missing the essential communal dimension.
      *   **Fails to Explain the Cicero Example:** Why would Aquinas endorse the killing by senators (who arguably held public status, but not *that specific* power) or others if he meant a purely private right? The Cicero appeal makes sense *only* if the killers are seen as embodying the *res publica* against its destroyer.
      *   **Undermines Order:** A doctrine of private resistance risks constant instability, as any disgruntled faction could claim the "right." The community-based interpretation requires a threshold so severe (the complete perversion of public authority into private oppression) that the community *as a whole* (or a representative part) is justified in reclaiming its inherent authority to restore order. It's not a right of the individual *against* authority, but the community's authority *reasserting itself* against a usurper.

  **Conclusion:**

  The consistency in Aquinas lies in the *source* of legitimacy for killing: it must always stem from public authority exercised for the common good. The tyrant, by ruling for his *private* good, ceases to *be* a legitimate public authority and becomes an enemy of the community. This unique situation activates the community's inherent, residual public authority. When a private citizen kills such a tyrant, it is lawful *only* insofar as that citizen acts not as a private individual seeking redress, but as an agent of the outraged community, temporarily assuming the public role of judgment and executioner on behalf of the common good which the tyrant has annihilated. This reading preserves Aquinas's core principle against private killing, explains his appeal to Cicero, grounds the justification in the very definition of tyranny (the substitution of private for common good), and avoids the pitfalls of an anarchic "private right" doctrine by emphasizing the act's public, representative, and restorative nature. The killer acts *for* the *publicum*, because the tyrant has made himself the enemy *of* the *publicum*.
