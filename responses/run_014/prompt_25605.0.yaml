  Looking at the literature, the user is right that both sides have refined their positions. Retributivists like Duff now frame punishment as communicative rather than purely about suffering. Consequentialists have added constraints against punishing the innocent. But these tweaks don't bridge the gap because... 

  Ah, here's the key: they're operating with different conceptions of moral reasoning. Retributivism assumes deontology - moral facts exist independently of consequences. Consequentialism is teleological - value comes from outcomes. This explains why they talk past each other: one side sees moral necessity, the other sees optional suffering. 

  The free will question is interesting but probably not the core issue. Both sides could hypothetically agree on determinism and still disagree on whether punishment requires desert. And the "competing intuitions" point matters in edge cases, but the divide runs deeper than that. 

  So what would progress look like? Not more sophisticated versions of the same arguments. Maybe:
  - Meta-ethical work clarifying how justifications function
  - Empirical studies showing how each framework affects real-world outcomes
  - Or embracing the tension as philosophically productive

