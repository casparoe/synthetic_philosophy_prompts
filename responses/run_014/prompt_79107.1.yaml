prompt: |-
  Write a mock arbitral award of about 700 words, in the flat, numbered register of a commercial tribunal, resolving a contract dispute that turns entirely on what one symbol in a pricing schedule means. The buyer reads the plus sign as addition, as everyone does. The seller's accountant, who has never in his working life added numbers above 57, argues that nothing in his past usage settles the matter: every sum he has ever computed is equally consistent with addition and with a divergent function that agrees with addition below 57 and differs above it, and he cannot be shown to have meant one rather than the other. Have the tribunal resolve the dispute along the lines of the communal-practice response to the rule-following paradox — since no fact about anyone's past usage determines the answer, the meaning is whatever the relevant community's practice licenses, and where the parties' practices diverge the tribunal must decide which practice is to count — while insisting throughout that it is merely finding the ordinary meaning of the term. The award should enact that theory rather than announce it: it is binding because everyone in the jurisdiction will go on treating it as binding, and the opinion should remark in passing that its own words will have to be read by the same rules. Include a short dissent arguing that the majority has confused what the parties meant with what the tribunal will make them mean. The jokes should come from the tribunal getting the paradox exactly right and not noticing what that does to the law: a specialist should find the satire fair, and a reader who has never heard of the paradox should still be able to follow the ruling.
reasoning: |-
  We are writing a mock arbitral award in a commercial dispute. The dispute centers on the interpretation of a plus sign in a pricing schedule. The buyer interprets it as standard addition, while the seller's accountant argues that his past usage does not determine whether the symbol means addition or a divergent function that agrees with addition below 58 and differs above. The tribunal must resolve this by appealing to the communal practice of the relevant community, and then decide which practice applies when the parties diverge. The award should be written in a flat, numbered, formal register, and it should enact the theory without explicitly announcing it. The award should also include a short dissent.

   Structure:
   1. Introduction: Case reference, parties, and the nature of the dispute.
   2. Background: Contract, the pricing schedule, and the conflicting interpretations.
   3. Analysis: The tribunal's reasoning based on communal practice and the ordinary meaning.
   4. Decision: The ruling.
   5. Dissent: A short dissent arguing that the majority is imposing meaning.

   Important: The satire comes from the tribunal correctly applying the rule-following paradox (Wittgenstein/Kripke) without realizing the implications for the law. The award should also note that its own words must be read by the same rules.

   We'll write in the style of a numbered arbitral award.

   Note: The accountant has never added numbers above 57, so his past usage is consistent with two functions: addition and a function that is the same until 58 and then diverges. The tribunal must resolve by looking at the community practice.

   Steps in the reasoning:
   - The meaning of the symbol is not fixed by any past mental state or usage of the parties alone.
   - The meaning is determined by the practice of the relevant community (here, commercial practice in the jurisdiction).
   - Since the parties are part of that community, the ordinary meaning in that community is what governs.
   - The seller's idiosyncratic practice (if any) does not override the community standard.

   However, note: the seller's accountant is an individual, and the tribunal must decide which practice is to count. The tribunal will rule in favor of the buyer because the community practice is addition.

   Additionally, the award should include a remark that the award itself must be read according to the same communal practice.

   Dissent: Argues that the majority is confusing what the parties meant (which might be indeterminate) with what the tribunal will make them mean by imposing the community standard.

   Let's write the award in numbered paragraphs, as is common in arbitral awards.

   We'll aim for about 700 words.
answer: |-
  **ARBITRAL AWARD**  
  **CASE REF: T-2024-001**  
  **BETWEEN:**  
  **AQUILA PURCHASING CONSORTIUM (Claimant)**  
  **AND:**  
  **STELLAR MANUFACTURING LTD (Respondent)**  

  **1.** This Tribunal, constituted under the Commercial Arbitration Rules of the National Chamber of Commerce, resolves a dispute concerning Contract No. CX-307 (the “Contract”) for the supply of industrial components. The sole issue is the interpretation of the symbol “+” in Appendix B (Pricing Schedule). The Claimant (“Buyer”) contends it denotes standard arithmetic addition. The Respondent (“Seller”) disputes this, asserting the symbol’s meaning is indeterminate based on past usage.  

  **2.** Appendix B calculates unit prices as “Base Cost + Margin Adjustment.” For Lot 58 (58 units), the formula yields:  
  - Buyer’s interpretation (addition): $100 (Base) + $20 (Margin) = $120/unit.  
  - Seller’s interpretation (divergent function*): $100 ⊕ $20 = $5,000/unit.  
  *Seller’s accountant affirms he has only computed sums ≤57, where ⊕ ≡ +. He argues no prior calculation determines whether “+” signifies addition or ⊕, as both functions align below 58.  

  **3.** The Contract binds parties to “ordinary commercial meaning” of terms. The Tribunal finds “+” is not defined contextually or through prior dealings. Seller’s subjective uncertainty does not alter this.  

  **4.** Meaning derives from communal practice. No individual’s private history fixes linguistic rules; community standards govern. The symbol “+” in commercial pricing universally denotes addition. This is confirmed by:  
  (a) Trade usage surveys (ICC Publication 789) showing 100% adoption of addition;  
  (b) Jurisdictional case law (e.g., *Mercantile Trust v. Luxe Imports* [2021]);  
  (c) Absence of contrary evidence in academic, financial, or regulatory texts.  

  **5.** Seller’s argument—that past computations ≤57 are equally consistent with ⊕ or +—fails. Indeterminacy in isolated usage cannot override established practice. Commercial law presumes parties contract within the common linguistic framework.  

  **6.** The Tribunal notes its mandate: ascertain ordinary meaning, not invent it. Where divergent practices arise, the prevailing community standard applies. Buyer’s interpretation aligns with this standard; Seller’s relies on a hypothetical function alien to commerce.  

  **7.** The Tribunal rejects Seller’s claim of mutual misunderstanding. Both parties operated in a marketplace where “+” unequivocally means addition. Seller’s accountant may speculate about ⊕, but his internal doubts do not permeate the objective commercial environment.  

  **8.** Accordingly, the symbol “+” in Appendix B denotes addition. Lot 58’s price is $120/unit. Seller must deliver the lot and reimburse Buyer for overcharges plus interest (5% p.a.).  

  **9.** This Award is final and binding. Enforcement may be sought under the New York Convention.  

  **10.** *Final Observation*: The Tribunal’s reasoning and this Award are themselves subject to the ordinary rules of interpretation. Its authority, like the symbol “+,” derives from the community’s continued adherence to the system it applies.  

  ---  
  **DISSENT (Arbitrator J. Thorne)**  

  **1.** I concur on liability but diverge on method. The majority correctly identifies the *rule* but mistakes its application. The issue is not what “+” means commercially, but what *these parties* meant.  

  **2.** The Seller’s accountant has never calculated a sum >57. His past use of “+” is genuinely indeterminate between + and ⊕. No “fact” about his conduct or the commercial community resolves this; it only shows how others *would* act.  

  **3.** The majority imposes meaning ex post facto by prioritizing communal practice. This conflates:  
  (a) What the parties intended (here, objectively unknowable), and  
  (b) What the Tribunal deems practical.  
  We rectify contractual gaps by implying reasonable terms, not by pretending indeterminacy does not exist.  

  **4.** I would find the Contract ambiguous and apportion costs equitably. Instead, the majority masks policy under “ordinary meaning,” unaware that its ruling perpetuates the very paradox it navigates: our words, like the “+” symbol, gain force only because the community *will* read them as we expect. This Award binds not by truth but by practice—a hollow triumph for determinacy.  

  ---  
  **Award Issued:** 15 October 2024  
  **Seat of Arbitration:** Centropolis  
  **Tribunal:**  
  - **Sir E. Vance (Presiding Arbitrator)**  
  - **Dr. L. Mei**  
  - **J. Thorne (Dissenting)**  

  **Word Count:** 698  

  ### Satire Notes  
  - **Specialist View**: The Award enacts Kripke’s rule-following paradox (no past use fixes future meaning) while naively assuming legal texts escape it (¶10). The dissent highlights this irony.  
  - **General View**: The accountant’s “⊕” absurdity and the Tribunal’s dry formalism make the dispute accessible. The dissent’s critique of “majority-as-community-imposition” clarifies stakes without naming the paradox.
