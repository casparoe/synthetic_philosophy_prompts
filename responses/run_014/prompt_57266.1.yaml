prompt: |-
  Just spent three hours on the phone with a friend about a biopic and I still can't get out of her argument, which is maybe the worst sign, since I'm pretty sure the conclusion is nuts. Context: we watched a movie about a real civil rights lawyer who died in the 90s, and it invents a lot -- a composite of two of her actual colleagues rolled into one character, and a whole confrontation with her father that nobody who knew her ever mentioned. My friend says that's not a gray area, it's lying, and here's the chain she walked me through:

  (1) A film that shows an identifiable real person speaking lines is asserting that that person said those lines. Not suggesting, not inviting us to imagine -- asserting, because the film is presented as being about the actual world and the audience takes it that way.

  (2) So a film that gives a real person lines they never spoke asserts something false.

  (3) Asserting something false to an audience that trusts you abuses that trust: you get them to form a belief you have no basis for offering, and it doesn't matter whether you knew it was false or just never checked.

  (4) When the person depicted is dead, the abuse can't be repaired -- they can't correct the record, can't object, can't retroactively consent -- so the wrong is worse than the same fabrication about a living person, not milder.

  (5) A disclaimer card at the front doesn't rescue anything. Either the card is an assertion, in which case for a film this loose with the record the card itself asserts something false and you've stacked a second lie on top of the first, or the card isn't an assertion, in which case by (1)'s own logic neither is the dialogue and the film has told us nothing at all, true or false, so the whole idea of learning anything from it collapses.

  (6) The same reasoning runs straight into narrative history, which also fills in rooms, weather, hesitations, and motives that no document contains.

  (7) So either biopics and readable history both systematically wrong the dead and their audience, or something in (1)-(3) is false. She takes the first horn: stick to documentaries and archives, or at least to scenes you can source line by line.

  Here's where I got stuck and she just repeated herself. A subtitled documentary shows a real person speaking English words she never uttered. Same with a translated interview, same with a historian putting 18th-century speech into modern English. By (1) and (2) all of those assert falsehoods about what was said, and yet nobody thinks a subtitled documentary is lying to you. So either (1) is really about content rather than wording, and then I can't see what's doing the work in (2) anymore, because the composite colleague and maybe even the invented confrontation are arguably content-preserving compressions of things that did happen -- or (1) is about wording and the argument condemns translation, which she won't swallow either. She never picked.

  So: which step do you reject, and what does rejecting it cost? A few specific things I want priced:

  - If the fix is that films with real subjects don't assert at all -- some pretense or make-believe reading of the whole thing, Walton-style -- how do you stop the documentary's assertions from being mere pretense too, and what happens to the second horn of (5)?

  - If the fix is that they do assert but only something hedged or approximate, tell me exactly what the hedged content is, and whether it's a claim about what was said or about what was probably the case. Because that choice seems to decide whether the composite character and the invented confrontation land on the same side of the line, and her argument treats them as one and the same.

  - If (4) is the premise to drop, what's left of the idea that we owe the dead anything? Honestly I'd rather lose (1) than (4), so tell me what I'm paying for that preference.

  - And whatever you do with (6): if narrative history is off the hook but the biopic isn't, what's the actual difference, given that both fill gaps from thin evidence and both get believed by people who will never check?

  Don't bother with citations or a reading list, I'll chase those down myself. Just tell me where it breaks, why the broken step looked so fine going in, and what each repair costs.
reasoning: |-
  Okay, the user has presented a complex philosophical dilemma about the ethics of biopics and historical narratives. They've spent hours debating with a friend who argues that any deviation from factual accuracy in depicting real people constitutes lying, especially when the subjects are deceased. The friend's seven-step argument claims such fabrications abuse audience trust and wrong the dead irreparably. The user is stuck on the inconsistency when applying this logic to translations or subtitles - which clearly involve changing words yet aren't considered lying. 

  Hmm, the core tension here is between two valid concerns: historical fidelity and narrative utility. The friend's absolutist position (step 1) collapses under scrutiny because it equates depiction with literal assertion. But if we relax that, how do we prevent total relativism? The user wisely wants the costs of each possible solution priced - they're not just seeking refutation but understanding trade-offs.

  Looking at their specific pain points: The documentary paradox is sharp. If a subtitled interview "lies" by changing words, but conveys accurate meaning, then wording can't be the ethical line. Yet the friend insists invented scenes are lies regardless of thematic truth. This suggests the real disagreement is about what constitutes acceptable compression versus unacceptable fabrication. The composite character might preserve truth while the father confrontation may distort it - but the friend's framework can't distinguish them.

  The user's ethical instinct seems sound - they'd rather keep the obligation to the dead (step 4) than accept rigid literalism (step 1). Good. That obligation doesn't require perfect accuracy though, just good-faith representation. We owe the dead dignity and context, not verbatim transcripts. 

  For narrative history vs biopics: the difference might be in framing and tools. Historians signal uncertainty ("perhaps," "likely"), while films present inventions as reality. But the user's right that both get believed uncritically. So the repair cost is demanding higher transparency from both - footnotes for books, disclaimer cards that actually specify types of changes for films. 

  Biggest insight: The friend mistakes all artistic license for deception because she conflates two types of "assertion." Films assert themes (truths) through depicted events (tools). We don't take the weather in a biography as meteorological assertion. Breaking this conflation resolves most issues but costs us the clean bright line between fact/fiction she wants. Worth it.
answer: |-
  Here's where the argument breaks and what each repair costs:

  **The critical fracture is Step (1).** It falsely equates *depicting* with *asserting verbatim fact*. Films (and narrative history) operate in a realm of *interpretive representation*, not documentary stenography. Rejecting (1) doesn't mean "no assertion," but it fundamentally changes *what* is being asserted.

  ### Why Step (1) is the problem (and what rejecting it costs)
  *   **What it gets wrong:** A film showing Ida B. Wells saying "We demand justice" isn't asserting she uttered *exactly those words* at *exactly that moment*. It's asserting *that her character, actions, and principles were such that this statement authentically represents her stance and spirit in the context shown* (or that the scene effectively conveys a thematic truth about her struggle). The audience understands it's a *dramatization*, not a transcript. The assertion is about *meaning, character, and historical significance*, not literal utterances or minute-by-minute chronology.
  *   **Why it looked fine:** Because literal depiction *feels* like a direct claim. In a courtroom, showing a video *does* assert "this happened exactly like this." Biopics borrow the visual language of reality but operate under different, widely understood conventions.
  *   **The Cost of Rejection:**
      *   **Loss of Bright Lines:** You lose the simple, binary "lie/truth" test based on verbatim accuracy. Judging becomes messier, relying on intent, fidelity to *spirit*, proportionality, and potential harm.
      *   **Subjectivity:** Determining what constitutes a "faithful representation" or "authentic spirit" is inherently interpretive and contestable. Reasonable people will disagree on where the line is crossed.
      *   **Justification Burden:** The filmmaker/historian now bears the burden of justifying *why* a specific invention or compression serves a legitimate interpretive or narrative purpose without fundamentally distorting the subject or history.

  ### How this rejection resolves the specific issues
  1.  **Subtitles/Translation:** These *assert* that the translated words accurately convey the *meaning* of the original speech, not the literal phonemes. We accept minor linguistic shifts because the *content* assertion holds. A bad translation *is* misleading because it distorts the meaning/content.
  2.  **The Documentary Paradox:** Documentaries *do* assert specific factual claims (e.g., "This footage shows event X," "Person Y said Z"). They rely on evidence and strive for literal accuracy where possible. Biopics assert *interpretive truths* using dramatization. The disclaimer card for a biopic isn't lying (or meaningless) when it says "inspired by true events" or "dramatized" – it *asserts* that this is a fictionalized interpretation, not a documentary record. It signals the *type* of assertion being made.
  3.  **Composite Character vs. Invented Confrontation:** Rejecting (1) allows differentiation based on *fidelity to core truth*:
      *   *Composite Colleague:* If it accurately represents the *types* of relationships, challenges, and support the subject experienced (i.e., preserves the essential *content* of her professional environment and struggles), it might be a legitimate compression tool. The assertion is about the *nature* of her work life, not the literal existence of "Bob Smith."
      *   *Invented Father Confrontation:* If this depicts a relationship dynamic or internal conflict *absent* from the historical record and central to the film's portrayal, it becomes highly suspect. Does it distort her actual character, motivations, or known relationships? If so, it likely *misrepresents* the core truth about her, violating the (now redefined) assertion of authenticity. The line hinges on whether the invention serves to illuminate a *documented* aspect of the person/history or invents a *fundamentally new and unsubstantiated* narrative element.
  4.  **Narrative History vs. Biopic (Addressing Step 6):** Both fill gaps, but differ in *tools, conventions, and primary assertion*:
      *   *Narrative History:* Uses prose. Its assertion is an *interpretive argument* based on evidence. It signals uncertainty ("likely," "perhaps," "evidence suggests"). Filling gaps (weather, probable motives) is framed as reasoned inference, not incontrovertible fact. Its primary assertion is: "Based on the evidence, this is the most plausible and significant interpretation."
      *   *Biopics:* Use actors, sets, and dramatic scenes. Their primary assertion is: "This dramatization captures the *essential spirit, significance, and emotional truth* of this person/events." The visual medium creates a stronger *illusion* of literal reality, making the burden of signaling interpretation (disclaimers, stylistic choices) heavier. Filling gaps with *specific, dramatized scenes* feels more concrete than a historian's speculative prose.
      *   **The Cost of Distinction:** Acknowledging this difference means holding biopics to a high standard of *contextual transparency* and *fidelity to spirit*, recognizing their unique power to implant vivid (but potentially inaccurate) "memories" in the audience. Narrative history gets more leeway for explicit speculation but must rigorously ground its inferences.

  ### Addressing Your Specific Pricing Requests
  *   **"Films don't assert at all (Walton-style pretense)?"** This goes too far. Biopics *do* make claims about the real world and real people. Rejecting (1) isn't embracing pure fiction; it's redefining the *nature* of the assertion (interpretive truth, not verbatim fact). Documentaries still assert specific facts; they aren't pretense because they aim for and are judged by literal accuracy where possible.
  *   **"Hedged or approximate assertion?"** The hedged content is: **"This portrayal authentically represents the core character, significant actions, historical context, and thematic essence of the subject/events, within the necessary compromises of dramatic storytelling."** It's primarily a claim about *significance and meaning*, grounded in evidence, not a claim about *exact words or undocumented specific events*. The composite character *might* fall under this if it serves the "core character/context" assertion without distortion. The invented confrontation likely *doesn't* unless it directly reflects documented psychological conflicts (and even then, inventing the *specific scene* is risky).
  *   **"Dropping (4) - Obligation to the Dead?"** You don't need to drop (4). Rejecting (1) preserves the core of (4): we *do* owe the dead a duty of respectful and truthful representation. Misrepresenting their character, achievements, or significant relationships *is* a wrong, arguably worse when they cannot defend themselves. Rejecting (1) simply changes *what constitutes misrepresentation* – it's not about every invented line, but about distortions of their *essential identity and legacy*. The cost is the subjectivity mentioned earlier: defining "essential identity" is hard.
  *   **"Narrative History vs. Biopic Difference?"** As above: Tools, Conventions, Primary Assertion. Biopics have a higher risk of creating false concrete "memories" due to their sensory vividness. Both can mislead, but the mechanisms and audience expectations differ. The cost of this distinction is demanding greater contextual framing and responsibility from filmmakers due to their medium's immersive power.

  ### In Summary
  *   **Break Point:** Step (1). Films about real people assert *interpretive truths* about character, significance, and spirit, not verbatim facts.
  *   **Why it Looked Fine:** Confusing the *medium* (visual depiction) with the *message* (literal assertion).
  *   **Cost of Repair:**
      1.  Loss of simple binary (lie/truth on verbatim basis).
      2.  Introduction of interpretive subjectivity (what is "core truth"?).
      3.  Increased burden of justification on creators.
      4.  Need for clearer contextual framing (disclaimers doing real work).
      5.  Holding biopics accountable for *fidelity to spirit* and *avoiding harmful distortion*, especially of the dead, recognizing their unique power to shape perception.
      6.  Accepting that narrative history and biopics, while both interpretive, operate under different conventions and thus have different responsibilities regarding speculation.

  The repair allows you to condemn malicious or reckless distortion (like the likely invented confrontation if it misrepresents her character) while potentially justifying necessary dramatic compression (like the composite colleague), and explains why subtitles aren't lies. It preserves the obligation to the dead without requiring impossible literalism. The cost is navigating a more nuanced, less certain ethical landscape.
