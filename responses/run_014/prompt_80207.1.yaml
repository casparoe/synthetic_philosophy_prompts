  The core of the Condorcet theorem relies on several key assumptions: independent voters, each having competence above 50%, a clear factual truth to be discovered, and majority voting. The user wants me to map these assumptions to real institutions and identify where the analogies break down.

  For juries, I need to consider how deliberation violates independence - jurors influence each other, potentially amplifying biases rather than canceling them out. Also, the competence assumption might not hold for complex evidence. For referendums, the biggest issue is whether there's an objective "truth" at all - policy questions often involve value judgments. And for AI sampling, the "voters" aren't independent since they come from the same model with identical training data and biases.

  The user also wants two stress tests: what happens when median competence drops below 50% (where majority decisions actually become worse with more voters), and how much epistemic value majority voting adds in dependent AI samples (probably very little beyond creating an illusion of reliability).

  I should conclude by outlining what a better framework for judgment aggregation would look like - one that acknowledges dependencies, varying competencies, and the nature of the question. This would involve recognizing when simple majority voting is insufficient and what complementary mechanisms might help.
answer: |-
  Let's rigorously audit the "wisdom of crowds" analogy, mapping the Condorcet jury theorem (CJT) to real institutions and identifying where the mapping breaks—especially in the contexts you specified (deliberative juries, policy referendums, and dependent AI samples). We'll assess whether the core conclusion—*larger, more independent bodies are more accurate*—survives these breaks.

  ---

  ### **Correspondence Table & Core Assumptions**
  The CJT states: If voters are **independent**, each has **competence > 0.5** (more likely correct than incorrect), and there's a **binary fact of the matter**, then majority vote accuracy **increases toward 1** as the group size grows.

  | CJT Element          | Jury Trial                          | Policy Referendum                   | AI Sample Voting                   |
  |----------------------|-------------------------------------|-------------------------------------|------------------------------------|
  | **Independent Voter** | Jurors forming initial views        | Voters with diverse info sources   | Repeated LLM samples (same model) |
  | **Competence > 0.5** | Jurors understand evidence/law      | Voters grasp policy implications   | Samples reflect "ground truth"    |
  | **Fact of the Matter** | Defendant's guilt/innocence         | Objective policy outcome? (Rare)   | Single "correct" answer exists    |
  | **Majority Rule**    | Unanimous/supermajority verdict     | Simple majority wins               | Most frequent output chosen       |

  ---

  ### **Where the Mapping Breaks (and Why It Matters)**
  #### 1. **Juries: Deliberation Destroys Independence**
      - **Break**: CJT assumes votes are *statistically independent*. Real juries deliberate, sharing arguments and social influence. Errors become **correlated** (e.g., groupthink, charismatic jurors dominating).
      - **Impact on Conclusion**: **Fatal**. Correlation amplifies errors; accuracy may *decrease* with size if shared biases dominate. A large but correlated group can be *less* accurate than a small uncorrelated one. Deliberation can help *if* it corrects errors, but CJT’s independence guarantee vanishes.

  #### 2. **Referendums: No "Fact of the Matter"**
      - **Break**: CJT requires a binary ground truth (e.g., "Did X commit murder?"). Policy questions (e.g., "Should taxes increase?") lack objective truth—they hinge on values, trade-offs, and uncertain futures.
      - **Impact on Conclusion**: **Fatal**. "Accuracy" is undefined without ground truth. Majority preference ≠ correctness. Increasing voters only refines the *will of the people*, not epistemic truth. CJT’s math collapses here.

  #### 3. **AI Samples: Extreme Dependence**
      - **Break**: Repeated LLM samples **share weights/data/biases**. Errors aren’t random; they’re **systematic** (e.g., hallucinating the same false fact). No independence.
      - **Impact on Conclusion**: **Severe**. Majority voting over dependent samples only suppresses *random noise*, not systemic bias. If the model is biased toward wrong answers, majority *amplifies* error. "Wisdom" is illusory.

  ---

  ### **Stress Tests**
  #### 1. **Median Competence < 0.5**
      - **What CJT Says**: If average competence *p* < 0.5, larger groups become **less accurate**, approaching 0% correctness. Majority voting **harms truth-tracking**.
      - **Real-World Reversal**: Adding voters *worsens* outcomes if the median voter is misinformed (e.g., referendums on complex topics like monetary policy). The assumption that "bigger = better" **inverts**—a critical, often overlooked fragility.

  #### 2. **AI Sample Voting: Epistemic Mirage?**
      - **Guarantee Transfer**: Almost **none**. CJT requires independence; identical LLM samples are maximally dependent. Majority voting only helps if:
        - Errors are *random* (not systemic).
        - The model’s "competence" *p* > 0.5 *for the specific query*.
      - **Is It Doing Real Work?**: For *factual* questions where the LLM is reasonably accurate (e.g., "What is 2+2?"), majority reduces small random variances. For complex or biased queries (e.g., "Summarize the causes of the Ukraine War"), it **creates false confidence** while cementing systemic errors. It’s mostly *cosmetic* when bias dominates.

  ---

  ### **Conclusion: Does the Analogy Survive?**
  The core conclusion—*bigger, more independent bodies are more accurate*—**only holds on a knife-edge of assumptions that real institutions rarely meet**:
  - Independence fails in juries (deliberation), referendums (media bubbles), and AI (shared model).
  - Competence > 0.5 is often unverifiable and flippable (e.g., polarizing issues).
  - Ground truth is absent in policy and contested in complex trials.

  **Survival Scope**:  
  The analogy weakly holds for:  
  - Simple factual questions (e.g., trivia) with genuinely diverse, competent voters.  
  - Early-stage jury votes *before* deliberation (if independence holds).  
  It fails catastrophically for:  
  - Value-laden/uncertain referendums.  
  - Dependent systems (e.g., AI, institutional groupthink).  
  - Polarized groups where *p* < 0.5 for many.

  ---

  ### **A Better Account of Judgment Aggregation**
  When aggregation improves accuracy, it’s due to **diversity + friction**—not mere headcount. A robust framework would:
  1. **Acknowledge Dependencies**: Model correlations (e.g., network effects, shared data).
  2. **Calibrate Competence**: Weight votes by expertise (if measurable) or use prediction markets.
  3. **Define "Accuracy" Contextually**: For policies, use deliberation to clarify trade-offs, not binary votes. For AI, use uncertainty quantification (e.g., prediction entropy) over majority voting.
  4. **Prevent Correlation Cascades**: In juries, use structured deliberation (e.g., Devil’s Advocate); in AI, diversify models/data.
  5. **Abandon "Majority as Truth"**: Use aggregation only when ground truth exists *and* signals are noisy but unbiased. Else, treat it as preference aggregation.

  The wisdom of crowds isn’t wrong—it’s **fragile**. Its power emerges from *error diversification*, which real-world institutions actively suppress through shared narratives, power dynamics, and systemic bias. Better aggregation requires designing for *dissonance*, not just volume.
