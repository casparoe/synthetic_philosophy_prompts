prompt: |-
  I'm taking a metaphysics seminar this semester and we spent three weeks on mereology and I think I've broken my brain. The special composition question — when do some things add up to a whole? — sounded straightforward at first but now I can't stop seeing edge cases everywhere. I started keeping a note on my phone of cases and my gut reactions, and the list has gotten kind of long. I'm hoping someone can look at my verdicts and tell me if there's actually a coherent principle behind them or if I need to give some up.

  Here they are, roughly in the order I thought of them:

  1. The grains of sand on a beach: they compose something (the beach).
  2. The molecules that currently make up my body: they compose something (me).
  3. Those exact same molecules, if they were scattered evenly across the Milky Way: they do not compose anything.
  4. A hammer head and its handle, attached normally: they compose a hammer.
  5. That same head and handle, lying unassembled in a drawer six inches apart: they do not compose anything.
  6. Two strangers standing next to each other at a bus stop: they do not compose anything.
  7. Conjoined twins sharing a torso: I think they compose something, but I can't decide whether it's one thing or two, and this case genuinly bothers me.
  8. A cloud: it composes something, even though its boundaries are vague and its water droplets are constantly being replaced.
  9. The Eiffel Tower and my left shoe: they do not compose anything.
  10. A human body five minutes after death: it composes something, and it seems to be the same object that was there five minutes earlier when the person was alive, though something important has changed.
  11. A brand new committee whose members have never met: I don't think they compose anything beyond the individuals. But a committee that's been working together for years, with established procedures and shared norms — that feels like it composes something, maybe a group agent.
  12. All the hydrogen atoms in the sun: they compose something (the sun), but I'm not sure whether the sun is an object over and above the particles arranged sun-wise, or just the particles so arranged.

  I want you to extract whatever principle or small set of principles best captures these verdicts. For each candidate principle, state it precisely, walk through how it handles each of my twelve cases, and tell me honestly which of my verdicts it can't accommodate and why. Then apply each principle to a case I haven't considered: a pair of particles that have become quantum-entangled and are then separated by a light-year. Do they compose something according to each principle?

  Give me the whole thing as a JSON object with this schema:

  - "candidate_principles": array of objects, each with:
    - "name": string (a short label)
    - "statement": string (the principle stated precisely, with all clauses)
    - "case_verdicts": object mapping case numbers "1" through "12" to one of "composes", "does_not_compose", or "unclear"
    - "verdicts_abandoned": array of strings (case numbers where the principle disagrees with my stated verdict, e.g. ["5", "11"])
    - "rationale": string (one paragraph explaining the principle's motivation and why it draws the lines where it does)
  - "entangled_particles_verdicts": object mapping each principle name to its verdict on the entangled particles case
  - "recommendation": object with:
    - "best_principle": string (name of the principle you'd recommend)
    - "why": string (explanation)
    - "costs": string (what I'd have to give up)
reasoning: |-
  Hmm, the user is struggling with mereology after a metaphysics seminar, specifically the special composition question about when parts compose a whole. They've listed 12 cases with their intuitive verdicts and want me to extract coherent principles that explain these judgments. 

  Looking at their cases, I notice patterns emerging. The beach (1) and body (2) are clear compositions, while scattered molecules (3) and unrelated objects (9) aren't. Physical connection seems important in the hammer cases (4 vs 5), but then clouds (8) challenge that with vague boundaries. Social entities like committees (11) introduce functional unity, and conjoined twins (7) create boundary ambiguities. The dead body (10) suggests persistence through change, while quantum entanglement presents a modern physics challenge.

  The user's frustration is palpable - they're seeing edge cases everywhere. Their list shows they're deeply engaged but seeking stability. Underneath, they might be wrestling with bigger questions: what makes an object real? How do boundaries work? There's also an unspoken tension between commonsense intuition and philosophical rigor.

  For principles, I'm considering:
  First, causal interaction - things compose when they interact causally. This handles sand grains (they compact), molecules in a body (chemical bonds), but struggles with the new committee (no interaction yet) and the dead body (still physically connected but no life processes). 

  Second, functional unity - things compose when they serve a common purpose. This beautifully explains the assembled hammer (driving nails) versus disassembled parts, and even the established committee (shared goals). But it fails clouds (no purpose) and scattered molecules (no unified function).

  Third, spatial continuity - things compose when they occupy a contiguous region. This captures the beach, body, and sun as continuous masses, while rejecting scattered molecules. But conjoined twins become problematic (continuous but two persons?), and quantum entanglement defies spatial proximity.

  Fourth, mereological universalism - everything composes something always. This brute-forces consistency by accepting all compositions, but violates the user's strong intuitions about scattered molecules and strangers at a bus stop.

  Fifth, nihilism - nothing ever composes except fundamental particles. This resolves all ambiguity by rejecting composites, but forces abandonment of beaches, bodies and hammers - too high a cost for everyday realism.

  For the quantum-entangled particles: causal interaction would say yes (non-local correlation), functional unity no (no shared purpose), spatial continuity no (light-year apart), universalism yes (always), nihilism no (no composite).

  I'll recommend functional unity as most aligned with their intuitions. It saves 10/12 cases, only losing clouds (which they accept despite vagueness) and the sun (which they already question). The cost is accepting that some physical aggregates like clouds might be "less real" than functional unities, but that mirrors their committee intuition. This principle also handles the entangled particles as non-composite, which feels right - entanglement alone doesn't make a new object.

  Ultimately, functional unity honors their emphasis on purpose in the hammer and committee cases while resolving the twins as two functional systems sharing parts. It makes composition teleological but flexible - a worthy tradeoff for coherence.
