answer: |-
  Below is a decision-tree handout designed to guide students from the stipulation that human extinction is inherently bad (beyond the deaths it involves) to a named position explaining what else is lost. Each branch is based on intuitions about the four cases, avoiding position names until the end. The tree focuses on logical distinctions, with leaf positions including the required views and additional defensible ones. 

  ---

  ### **Decision Tree: The Badness of Human Extinction**  
  **Starting stipulation**: Human extinction is bad, and this badness is not exhausted by the deaths of the last generation.  

  ---

  #### **Question 1: Does the badness persist if no one exists to experience anything after extinction?**  
  *(Consider Case 1: Last human dies; artifacts remain; no one ever experiences anything again.)*  
  - **Yes** → Proceed to Question 2.  
  - **No** → Proceed to Question 5.  

  ---

  #### **Branch 1: Badness persists without any valuer (Answer: Yes to Q1)**  
  **Question 2: Does the badness persist if a posthuman successor inherits our culture/values?**  
  *(Consider Case 2: Humanity extinct; posthuman successor continues our culture/values.)*  
  - **Yes** → Proceed to Question 3.  
  - **No** → **Leaf: Cultural Continuity View**  
    - *Position*: The badness stems from the loss of humanity’s unique cultural legacy, which only matters if continued by a *culturally connected* successor.  
    - *Most awkward commitment*: If a posthuman species perfectly inherits human culture, extinction loses its badness—even if humans vanish entirely.  

  **Question 3: Does alien appreciation of human achievements remove the badness?**  
  *(Consider Case 3: Aliens visit Earth, genuinely enjoy human art/literature.)*  
  - **Yes** → **Leaf: Relational Value View**  
    - *Position*: Value requires a valuer; extinction is bad because no one exists to value human achievements, but *any* valuer (e.g., aliens) suffices.  
    - *Most awkward commitment*: If aliens appreciate human art, extinction isn’t bad—even with no human or posthuman future.  
  - **No** → Proceed to Question 4.  

  **Question 4: Does the badness persist if total universe well-being is unchanged?**  
  *(Consider Case 4: Total well-being identical to humanity’s continuation scenario.)*  
  - **Yes** → **Leaf: Deontological Claim View**  
    - *Position*: The living have a duty to future generations/humanity itself; extinction violates this duty regardless of outcomes.  
    - *Most awkward commitment*: Extinction is bad even if it *increases* total well-being (e.g., by preventing future suffering).  
  - **No** → **Leaf: Foreclosed Possibilities View**  
    - *Position*: Badness lies in losing specific future human lives and experiences (not just abstract well-being).  
    - *Most awkward commitment*: If identical well-being is created non-humans (e.g., aliens), extinction loses its badness.  

  ---

  #### **Branch 2: Badness requires a valuer (Answer: No to Q1)**  
  **Question 5: Does a posthuman successor remove the badness?**  
  *(Consider Case 2 again.)*  
  - **No** → Proceed to Question 6.  
  - **Yes** → Proceed to Question 7.  

  **Question 6: Does alien appreciation remove the badness?**  
  *(Consider Case 3.)*  
  - **No** → **Leaf: Scheffler’s "Afterlife" View**  
    - *Position*: Extinction undermines meaning in current life; humans need a "collective afterlife" (future humans) to sustain projects.  
    - *Most awkward commitment*: Extinction is bad even if future humans suffer immensely—meaning matters more than well-being.  
  - **Yes** → **Leaf: Human-Specific Valuer View**  
    - *Position*: Value is relational but requires a *human* valuer; human achievements lose worth without human appreciation.  
    - *Most awkward commitment*: If aliens value human art, it’s worthless—only human valuation counts.  

  **Question 7: Does alien appreciation remove the badness?**  
  *(Consider Case 3.)*  
  - **Yes** → **Leaf: Relational Value View** (Same as above)  
  - **No** → **Leaf: Cultural Relation View**  
    - *Position*: Badness requires a valuer *connected* to human culture (e.g., posthumans yes, aliens no).  
    - *Most awkward commitment*: Alien appreciation is irrelevant—only culturally inherited valuation matters.  

  ---

  ### **Notes on the Logical Space**  
  1. **Unoccupied Combinations**:  
     - **"No valuer + Posthuman removes badness + Aliens don’t"**: Logically possible (valuers must be culturally connected), but no major position holds this, as it conflates relational and cultural intuitions without adding insight.  
     - **"Valuer required + Posthuman doesn’t remove badness + Aliens do"**: Inconsistent. If posthumans fail, aliens should too (unless valuing is trivialized), so no position occupies this.  

  2. **Indistinguishable Positions**:  
     - **Relational Value View (Branch 1) vs. Relational Value View (Branch 2)**: Cases cannot separate them; both end in the same leaf. The path highlights if relational intuitions are primary (Branch 2) or secondary to non-valuer badness (Branch 1).  
     - **Deontological vs. Scheffler’s View**: Both reject Cases 2, 3, and 4 as mitigating badness. Only conceptual distinction (duty vs. meaning) separates them, not cases.  

  3. **Excluded Views**:  
     - **Deaths-only view**: Must deny any badness in Cases 1–4 beyond the last generation’s deaths.  
     - **Extinction not bad at all**: Must reject the starting stipulation entirely.  

  ---

  ### **How to Use This Tree**  
  1. Start at **Question 1** and answer based on your intuition about Case 1.  
  2. Follow branches using cases as prompts—avoid thinking about position names.  
  3. At a leaf, note the position’s core claim and its awkward commitment.  
  4. Discuss unoccupied branches and indistinguishable pairs to explore gaps/overlaps.  

  This tree isolates intuitions about the cases to reveal underlying philosophical commitments, fostering debate on what makes survival valuable.
