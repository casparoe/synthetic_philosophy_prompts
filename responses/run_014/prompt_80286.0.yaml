  Q8: Case 3 (aliens) remove extra badness?
     - YES: Leaf: Relational View (any valuer).
     - NO: Leaf: Cultural Relation View (only valuers that are culturally connected to us, like the posthuman, remove the badness).

  Now, we have the following leaves:

  1. Cultural Continuity View (from Q2 NO)
  2. Relational View (non-human valuers suffice) (from Q4 YES)
  3. Future-People View (species-neutral, well-being based) (from Q5 NO)
  4. Deontological View (from Q6 YES)
  5. Intrinsic Value of Humanity (from Q6 NO)
  6. Scheffler's Afterlife View (from Q9 YES)
  7. Human Valuer Relational View (from Q9 NO)
  8. Cultural Relation View (from Q8 NO) - which is a version of the relational view that requires cultural connection.

  We also have from Q8 YES: the standard Relational View (any valuer), which we already have from Q4 YES. So we can combine.

  But note: the relational view from Q4 YES is in the branch that said there is extra badness without a valuer (Q1 YES) and even with a posthuman valuer (Q2 YES) but then removed by aliens. That seems to require that the valuer need not be connected to us (aliens are fine). 

  The relational view from Q8 YES is in the branch that said no extra badness without a valuer (Q1 NO) and no extra badness with a posthuman valuer (Q3 NO) and also no extra badness with aliens (Q8 YES). This is the standard relational view.

  So we have two paths to the relational view: one that started by saying there is badness without a valuer but that badness is removed by any valuer (even non-connected), and one that started by saying there is no badness with a valuer (whether connected or not). These are slightly different, but both end in the same leaf.

  Now, let's assign the most awkward commitment for each leaf:

  - Cultural Continuity View: 
     Most awkward commitment: If a non-human species perfectly inherits and continues our culture, human extinction is not bad (other than the deaths).

  - Relational View (any valuer): 
     Most awkward commitment: If aliens discover and appreciate human art, then human extinction is not bad (other than the deaths).

  - Future-People View (species-neutral, well-being based): 
     Most awkward commitment: If the same total well-being is produced by non-human lives, then human extinction is not bad (other than the deaths).

  - Deontological View: 
     Most awkward commitment: Even if human extinction would lead to a much better future for other species, it is bad because it violates a duty to continue.

  - Intrinsic Value of Humanity: 
     Most awkward commitment: Even if humanity's continuation would lead to immense suffering, extinction is bad because it destroys something intrinsically valuable.

  - Scheffler's Afterlife View: 
     Most awkward commitment: Even if future humans would have terrible lives, extinction is bad because it undermines the meaning of current projects.

  - Human Valuer Relational View: 
     Most awkward commitment: If there were no human achievements to value, then extinction would not have this particular badness.

  - Cultural Relation View (valuers must be culturally connected): 
     Most awkward commitment: If aliens that are culturally disconnected from us appreciate human art, it doesn't remove the badness, but if a culturally connected non-human species does, it does.

