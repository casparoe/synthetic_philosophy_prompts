  Pair of leaves that the cases cannot separate:

     - The deontological view and the intrinsic value view might both say that there is extra badness in all cases (Case 1,2,3,4). The tree separates them by a conceptual question (Q6) about duty.

     - The future-people view (species-specific) is not explicitly in the tree. We have the intrinsic value view as a catch-all for species-specific value. The future-people view that is species-specific would also say Case 4 is bad. So it might be grouped with intrinsic value.

  Finally, the excluded views:

     - Deaths-only view: would have to give up the intuition that there is any badness beyond the deaths in Case 1,2,3,4.
