answer: |-
  ## The Friday Night Tokens  
  (Keynote Address for the Milltown Mutual Credit Cooperative)

  Friends, neighbours, founders… thank you for having me. Now, I’ll confess, when Martha asked me to speak tonight, my first thought was: *Martha, have you confused me with someone who understands plumbing invoices or sourdough starters?* My usual beat is dusty books and arguments from three hundred years ago, mostly concerning an Irish bishop named George Berkeley who had some rather… *unconventional*… thoughts about money. But Martha insisted his ideas might just resonate here, in this room, tonight. And the more I thought about it, the more I saw she was right. Because what we’re launching isn’t about the past, or abstract theory. It’s about *us*. Right now. And what we can build together.

  Look around. We see skills. We see needs. We see energy. A plumber who keeps pipes flowing. Bakers who nourish us. A childminder freeing parents to work. A haulier moving goods. A community kitchen feeding souls. Retired mill hands with lifetimes of practical knowledge. *That*—the work you do, the services you render, the goods you create and share—*that* is the real wealth of Milltown. Not lumps of metal locked away. Not numbers on a distant bank’s screen. Real, tangible wealth flows from fertile land, skilled hands, and willing hearts. Always has.

  So what are these credits? These little tokens we’re about to issue? They aren’t *backed* by anything hidden in a vault. And thank goodness! If we needed gold bars to start, we’d be waiting forever. No. Think of them simply as… *tickets*. Tickets for work. A baker needs a leaky tap fixed? They give the plumber a ticket. That ticket says: “Someone in Milltown owes an hour of skilled plumbing.” The plumber, holding that ticket, might then need bread. They hand the ticket to a baker. And the baker sees: “Someone in Milltown owes me a loaf.” The ticket moves. The work gets done. That’s it. That’s the whole magic trick. The ticket isn’t the wealth itself; it’s just the little counter that lets us *exchange* the wealth we already possess in each other.

  Now, some might scoff. That reporter over there, he wrote about “play money.” I saw it! Well, tell me, when you hand someone a bus ticket, do you need a miniature bus painted on it? When you give a cinema stub, must it glow with the image of the film? Of course not. The ticket works because we agree on what it *means*, what it *entitles* the holder to. It’s a sign we trust. We act on that sign every day. We reason with it. We hand it over, confident the driver will let us on, the usher will let us in. These credits are the same. They are signs we agree to trust. Signs that say: “In this community, this token represents a promise of work, a claim on service.” They don’t need to *look* like a repaired pipe or smell like fresh bread to bind us in mutual support. They just need *our* shared agreement, *our* shared commitment to honour them. That’s the hinge this whole thing swings on – not resemblance, but recognition and trust between *us*.

  Bishop Berkeley saw this potential. He argued fiercely for Ireland to create its own tickets for work, a national system built on trust in the people’s own industry. He lobbied Parliament. He wrote pamphlets. And… they ignored him. Completely. Why? Because the powerful, the distant financiers, the ones comfortable with the old ways, couldn’t grasp it. Or perhaps didn’t *want* to grasp it. They couldn’t see past the idea that money must be scarce, must be controlled from above, must be backed by something *else*.

  Well, their failure in Dublin centuries ago shows us something vital: **The power to issue these tokens, and the responsibility to manage them wisely, cannot be left to some far-off, unaccountable body.** It didn’t work then, and honestly, look around – how much has relying on distant powers worked for Milltown lately? Where Parliament failed, *we* succeed. Because the authority here? It’s not an abstract institution. It’s sitting right in this room. It’s *you*.

  **You, the members, *are* the authority.** Every time you accept a credit for your plumbing, your baking, your childcare, your haulage, you are saying, “Yes, this token is good. I trust the community that stands behind it.” And crucially, every time you *spend* a credit you’ve earned, you are saying, “I trust that someone here has the skill or the goods I need.” That mutual exchange, that constant flow, *is* the system. It’s self-governing. It lives in your hands. Which means keeping the volume of credits sensible is also *your* job. How? By keeping the work flowing! If credits pile up unused, if people hoard them, the system clogs. The tokens stop moving. The work stops happening. The ‘fertile land and industry’ get choked off. So the rule is simple: Use them, or pass them on. Keep the river flowing.

  That’s why we have the carrying-cost rule. A small percentage deducted yearly from any credit balance held idle. Some might grumble. Especially those of you, like our retired mill workers, who remember saving pennies for a rainy day. I understand. I grew up with that instinct too. This rule seems counter to that.

  Here’s the honest truth, plainly: **These credits are not designed to be a store of value.** They are not meant to be buried in a tin can or tucked under a mattress for years while you dream of a new roof. A credit sitting still, month after month, isn’t helping the plumber find work or the baker buy flour. It’s inert. It’s like water trapped in a stagnant pool – no good for drinking, no good for turning the mill wheel. Berkeley understood this deeply: money that never moves might as well not exist. The carrying-cost is a gentle nudge – a reminder that the *life* of this system, the real wealth it unlocks, is in the *movement*, the exchange, the work done *now*. It keeps the water flowing. It means that token in your pocket isn’t just paper; it’s a little spark, urging you to connect, to trade, to keep the energy of Milltown alive. Saving for something large? That’s important! This system encourages you to save *in real terms* – by building relationships, by offering your skills consistently, knowing the community will be there to support you *when you need to spend*. It’s saving through active participation, not passive hoarding. The carrying-cost is the small price we pay together to ensure the whole stream keeps running strong for everyone who depends on it.

  So, to our reporter friend, who called it "play money"? Fair enough. It *is* a kind of practice. Like practising a team sport. You pass the ball, you learn the moves, you build coordination, you score points that only count *within the game you’re playing together*. But ask any winning team: the trust, the coordination, the shared effort built during practice? That’s the real, lasting value. That’s the foundation of everything else. These credits are our practice tokens for rebuilding the muscle of mutual support right here in Milltown. The value isn't stamped on them; it's created *every time we pass them along with purpose*.

  This isn’t a seminar. Martha’s eyeing me. This is the start. The first credits are about to be issued. Not backed by gold, or a government, or a distant promise. Backed only by the skills in this room, the needs in this town, and our collective agreement to trust each other enough to get to work.

  So here’s what you can do. Monday morning, when you offer your first service priced in credits, or ask for help using credits you’ve earned, that’s it. That’s the speech made real. Pass the tokens. Honour the work. Keep the wheel turning. Thank you.
