  We are going to write a literary short story that revolves around Simpson's paradox without ever naming it. The story will be from the point of view of an outsider who doesn't see the tables — perhaps a porter or a patient. The central conflict is between two defensible viewpoints: the overall mortality rate (which shows the small rural hospital is worse) and the broken-down categories (which show the small hospital is better in each). We are not saving the small hospital at the end.

  We'll structure the story as follows:

  1. **Setting and Introduction of the POV character**: We are in a small rural hospital that is about to be closed. The POV character is a porter named Henry, who has worked there for 20 years. He knows the place and the people intimately.

  2. **The Announcement**: The news breaks that the hospital is closing because of higher overall mortality rates. The staff and community are shocked because they know their work is good.

  3. **The Discovery**: A young data analyst at the small hospital, Maya, finds the breakdown that shows their hospital is better in every category (maternity, trauma, long-term care). She brings this to the attention of the hospital administrator, who then contacts the county.

  4. **The Conflict**: The county's chief consultant, Dr. Aris Thorne, comes to the hospital to explain why the overall number is what matters. We stage the argument between Maya (representing the broken-down data) and Dr. Thorne (representing the pooled data) without any math explanations. The argument must be carried by dialogue and actions.

  5. **The Unfolding**: Despite the compelling breakdown, Dr. Thorne's argument prevails. The closure proceeds. We see the impact on the staff and community through Henry's eyes.

  6. **The Ending**: The hospital closes. Henry, the porter, is one of the last to leave. He reflects on the two truths and how both numbers were right in their own way.

  We must avoid:
  - Any mention of Simpson's paradox.
