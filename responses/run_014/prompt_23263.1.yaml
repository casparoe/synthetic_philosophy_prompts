answer: |-
  You've pinpointed the core conceptual battleground of the Mary argument. Let's break down the new-fact reading vs. the new-mode (phenomenal-concept/ability) reading, how the Ability Hypothesis (AH) tries to save physicalism while honoring the intuition, and clarify what physicalism is really on the hook for.

  **The Core Disagreement: What Does Mary Learn?**

  1.  **The New-Fact Reading (Anti-Physicalist):**
      *   **Claim:** When Mary sees red for the first time, she learns a genuinely *new fact* about the world – a fact concerning *what it is like* to see red.
      *   **Why it Threatens Physicalism:** If physicalism is true (and complete), all facts are physical facts (or logically supervene on physical facts). Mary, confined to her room, knew *all* the physical facts about color vision (neural states, light wavelengths, functional roles, etc.). Therefore, this "what it's like" fact *cannot* be a physical fact. It must be a new, non-physical fact. Thus, physicalism is false.
      *   **Intuition Honored:** This reading directly captures the strong intuition that Mary genuinely *learns something new* about the world – something she couldn't grasp from the inside of her room, despite her complete physical knowledge.

  2.  **The New-Mode-of-Presentation / Phenomenal-Concept / Ability Hypothesis Reading (Physicalist):**
      *   **Core Claim:** Mary does *not* learn a new *fact* about the world. Instead, she acquires a *new way of thinking about*, *representing*, or *accessing* a fact she already knew physically. Specifically, she gains:
          *   **New Phenomenal Concepts:** Concepts that are *directly grounded in* her first-person experience (e.g., the concept `RED#`, meaning *this specific type of experience I'm having now*). These concepts are distinct in kind from the physical/functional concepts she used before (e.g., "wavelength ~650nm light causing neural state N1").
          *   **New Abilities:** The ability to recognize red experiences directly (introspectively), the ability to vividly imagine or recall the experience of red, the ability to re-identify the experience type across time.
      *   **Why it Saves Physicalism:** The *fact* about what is happening when someone sees red is still exhaustively described by the physical facts Mary knew in her room. What changed is her *cognitive apparatus* for grasping that fact. She now has an additional, subjective *mode of access* to the physical state of affairs. The world hasn't changed; Mary's relationship to the part of the world she already knew about (her own brain states) has changed.
      *   **Intuition Addressed (The AH Explanation):** The AH says the intuition that Mary "learns something" is correct, but misidentified. She doesn't learn a new *proposition* (a new truth about the world). She gains **new conceptual resources and cognitive abilities**:
          *   **Recognitional Ability:** She can now *pick out* the experience type `RED#` directly in her own consciousness.
          *   **Imaginative Ability:** She can now *mentally simulate* the experience.
          *   **Conceptual Ability:** She possesses the phenomenal concept `RED#` itself.
          *   **Why it Feels Like Learning:** Acquiring these abilities is a significant *cognitive event*. It dramatically transforms her *perspective* and *understanding* of that physical fact. Knowing *that* a certain neural state occurs under certain conditions (which she knew) is profoundly different from *knowing what it feels like* to *be in* that neural state (which she now experiences via her new abilities/concepts). This difference feels like learning "something new" because it *is* a new cognitive achievement – gaining first-personal, subjective *access* to the fact.

  **Addressing Your Key AH Question: "Why isn't this just not learning a proposition?"**

  *   The AH *agrees* that Mary doesn't learn a new proposition (a new fact). It explicitly *denies* that.
  *   **What she gains is *non-propositional knowledge*:** The AH argues knowledge isn't *only* propositional ("knowing that"). There is also **knowledge-how** (procedural knowledge) and **knowledge by acquaintance** (direct, non-conceptual familiarity).
      *   **Knowledge-How:** Mary gains the *ability* to recognize, imagine, and think about red experiences *using phenomenal concepts*. This is knowing *how* to do something cognitively.
      *   **Knowledge by Acquaintance:** By experiencing red, Mary becomes *directly acquainted* with the qualitative character of the experience itself. This is a form of non-propositional, direct awareness.
  *   **The Transformation:** While the *fact* (the physical state of affairs) remains the same, Mary's *epistemic relation* to it changes radically. Before, she knew *about* it third-personally. Now, she is *directly presented with* it first-personally. This shift is profound and constitutes genuine learning (of abilities, concepts, acquaintance), but crucially, *not* learning a new fact *about the objective world*. The physicalist claims the objective world was already fully described by her prior knowledge.

  **What Physicalism is Actually Threatened By? (The Weakest Version)**

  The Knowledge Argument primarily targets a very strong form of physicalism:

  1.  **Completeness of Physics:** All facts are physical facts (or are logically supervenient on the physical facts).
  2.  **A Priori Deductibility:** All truths (including truths about consciousness) are *in principle deducible* from the complete physical truth *alone*, without needing any further *experiential* input. Mary *should* be able to figure out *what it's like* from inside her room using only physics textbooks and logic. *(This is the version the new-fact reading directly refutes if successful).*

  **The Weakest (and Most Plausible) Physicalism the Argument *Doesn't* Threaten:**

  *   **A Posteriori Physicalism:**
      *   **Claim:** While consciousness *is* entirely physical (e.g., identical to or realized by certain neural states), the *connection* between the physical description and the phenomenal description is **not knowable a priori**. It requires *empirical investigation* and, crucially, *first-person experience* to *discover* this identity/realization relation.
      *   **Why the Argument Doesn't Touch It:** This view readily accepts the AH/Phenomenal Concept Strategy. Mary knew the physical facts (including the neural facts `N1`) and knew the *that* someone seeing red was in `N1`. What she *didn't* and *couldn*'*t* know a priori was that `N1` *feels like this* (`RED#`). Discovering that identity requires the empirical act of *having* the experience `RED#` *while* being in `N1` (or knowing someone else is). She doesn't learn a new *non-physical fact*; she learns the *a posteriori necessity* of the identity `RED#` = `N1`, which requires the acquisition of the phenomenal concept `RED#` (and associated abilities) to grasp.
      *   **Mary Learns What?** She learns *which* physical/neural state *feels like this* (via acquaintance and new concepts). She doesn't learn a *new* fact; she learns *the same old physical fact* (`N1` is occurring) *under a new phenomenal mode of presentation* (`RED#`), and crucially, learns the *a posteriori identity* linking the physical concept (`N1`) to the phenomenal concept (`RED#`).

  **Conclusion: The Stakes**

  *   **New-Fact Reading:** If correct, physicalism (specifically, the completeness + a priori deducibility claims) is false. There are irreducibly non-physical facts about subjective experience.
  *   **New-Mode (AH/Phenomenal Concept) Reading:** Preserves physicalism (especially a posteriori physicalism) by reinterpreting Mary's epistemic progress. She gains new *ways of knowing* (abilities, phenomenal concepts, acquaintance) that provide deep, first-person access to *physical facts she already knew*, but do not constitute new facts about the world. The "something new" she learns is the *subjective dimension* of accessing those facts, not the facts themselves.
  *   **The Crux:** The debate hinges on whether the powerful intuition that Mary learns "something new" *must* be interpreted as learning a new *objective fact* (anti-physicalist), or whether it can be fully explained as acquiring new *subjective cognitive abilities and concepts* tied to accessing the *same old physical facts* (physicalist). The Ability Hypothesis/Phenomenal Concept Strategy argues forcefully for the latter.
