answer: |-
  Here's a concise example illustrating the tension between updateless decision theory (UDT) and evidential decision theory (EDT) in a setting with self-locating uncertainty, where the disagreement stems from policy-based reasoning rather than credences about branches or a one-shot gamble:

  ---

  ### **The Twin Quantum Prisoners**
  **Setup:**  
  Two identical agents, Alice and Bob, are created in a quantum superposition. With 50% probability, they are separate individuals playing a prisoner's dilemma against each other. With 50% probability, they are the same agent (due to quantum entanglement) playing against a perfect copy of themselves. The agents know this setup but cannot observe which scenario holds until after decisions are made. Each must choose to **Cooperate (C)** or **Defect (D)** independently. Payoffs are:  
  - Mutual Cooperation: 2 each  
  - Mutual Defection: 1 each  
  - Defection vs. Cooperation: 3 for defector, 0 for cooperator  

  **Key twist:**  
  - If they are separate (50%), payoffs are independent.  
  - If they are the same agent (50%), the agent receives the *sum* of both players' payoffs (since they are identical).  

  ---

  ### **Decision Theories Clash**
  #### **1. Evidential Decision Theory (EDT) Reasoning:**  
  At decision time, Alice conditions on her action:  
  - **If she chooses C:**  
    - This suggests her counterpart (Bob or her copy) also likely cooperates (since they are identical/entangled).  
    - *Expected payoff*:  
      - 50% chance (separate): Both cooperate → she gets 2.  
      - 50% chance (same agent): Both cooperate → she gets 2 + 2 = 4.  
      - **Total: 0.5 × 2 + 0.5 × 4 = 3**.  

  - **If she chooses D:**  
    - Suggests her counterpart defects.  
    - *Expected payoff*:  
      - 50% chance (separate): Both defect → she gets 1.  
      - 50% chance (same agent): Both defect → she gets 1 + 1 = 2.  
      - **Total: 0.5 × 1 + 0.5 × 2 = 1.5**.  

  **EDT verdict:** Cooperate (3 > 1.5).  

  #### **2. Updateless Decision Theory (UDT) Reasoning:**  
  UDT ignores the "current branch" and chooses a *policy* upfront for both scenarios:  
  - **Policy 1: Always Cooperate**  
    - Separate: Both cooperate → Alice gets 2.  
    - Same agent: Both cooperate → Alice gets 4.  
    - **Expected: 0.5 × 2 + 0.5 × 4 = 3**.  

  - **Policy 2: Always Defect**  
    - Separate: Both defect → Alice gets 1.  
    - Same agent: Both defect → Alice gets 2.  
    - **Expected: 0.5 × 1 + 0.5 × 2 = 1.5**.  

  - **Policy 3: *Conditionally* Defect if separate, Cooperate if same**  
    - But UDT cannot condition on the unresolved scenario! Policies must be *uniform* across branches.  

  - **Policy 4: *Tit-for-Tat* (cooperate if you believe counterpart cooperates)**  
    - This fails because beliefs depend on the unresolved scenario.  

  **UDT verdict:** Cooperate (same as EDT so far).  
  **Now, the tension:**  

  ---

  ### **The Twist: Asymmetric Policies**  
  Suppose UDT considers a **stochastic policy**: *With probability \(p\), cooperate; with \(1-p\), defect*. Crucially, this policy is fixed *before* the uncertainty resolves.  

  - **UDT optimizes \(p\) globally**:  
    - Expected utility:  
      \[
      \text{EU} = 0.5 \left[ p \cdot p \cdot 2 + p \cdot (1-p) \cdot 0 + (1-p) \cdot p \cdot 3 + (1-p) \cdot (1-p) \cdot 1 \right] \\ + 0.5 \left[ p \cdot p \cdot 4 + (1-p) \cdot (1-p) \cdot 2 \right]
      \]  
      - First term (separate): Standard PD payoffs.  
      - Second term (same agent): Summed payoffs.  
    - Simplifies to: \(\text{EU} = 0.5(2p^2 + 3p(1-p) + (1-p)^2) + 0.5(4p^2 + 2(1-p)^2)\).  
    - Maximizing EU, **optimal \(p = 0.8\)** (cooperate 80% of the time).  

  - **EDT at decision time**:  
    - Conditions on the *action she takes now*. If she cooperates:  
      - Evidence suggests \(p\) is high → counterpart likely cooperates → EU ≈ 3.  
    - But if she defects:  
      - Evidence suggests \(p\) is low → counterpart likely defects → EU ≈ 1.5.  
    - **EDT still sees C as dominant (3 > 1.5)**, ignoring the global \(p\)-optimization.  

  ---

  ### **The Core Tension**  
  - **UDT** commits to \(p = 0.8\) upfront, accepting defection 20% of the time to balance the separate/same scenarios.  
  - **EDT** rejects this: When Alice considers defecting *now*, EDT calculates it as inferior *given the evidence* (even though UDT’s \(p = 0.8\) is globally optimal).  
  - **Why this isn’t about branch credences**:  
    - The disagreement persists *even if Alice knows the 50/50 probabilities*.  
    - The conflict arises because EDT’s conditioning on actions "collapses" the policy, while UDT enforces consistency across unresolved self-locating uncertainty.  
  - **Not a one-shot gamble**: The policy optimization over \(p\) and entanglement of decisions creates a multi-scenario, non-myopic tension.  

  ---

  ### **Why This Highlights UDT's "Weirdness"**  
  UDT insists on a fixed policy before self-location resolves, sacrificing local EDT dominance for global optimality. EDT balks at this, as it cannot "see" the value of committing to non-conditionally-optimal actions. This mirrors real tensions in anthropic reasoning or quantum immortality, where pre-commitment avoids self-location traps.
