prompt: |-
  A colleague and I have been going back and forth about Lewis on convention, and I've ended up with an argument that seems to show his whole framework either proves too much or proves nothing. I can't tell whether I've found a genuine problem or just talked myself into a corner. Here's the argument:

  (1) For Lewis, a regularity R is a convention in a population only if it is common knowledge that everyone (or almost everyone) conforms to R and prefers to conform given that others do.

  (2) Common knowledge, as Lewis uses it, requires an infinite hierarchy of epistemic states: I know that you know that I know that you know…, with no top floor.

  (3) Finite creatures in ordinary social settings never actually satisfy this requirement. At best we have mutual belief up to some modest level — perhaps two or three iterations — supported by rough-and-ready evidence about what others expect.

  (4) So, by Lewis's own definition, there are no conventions in any actual human population. Not language, not driving practices, not dress codes — none of them clear the bar.

  (5) That conclusion is absurd. We plainly do have conventions.

  (6) The natural fix is to relax the requirement: replace strict common knowledge with something weaker, like "sufficiently high-order mutual belief" or "mutual belief simpliciter."

  (7) But once we relax the requirement, we face a sorites problem. If three levels of mutual belief aren't enough to make a regularity a convention, neither are four; and if four aren't enough, neither are five; and so on. No finite number of iterations seems to mark the threshold between mere regularities and genuine conventions.

  (8) So either we draw a sharp line at some arbitrary number of iterations (which looks ad hoc and psychologically unreal), or we accept that "convention" has no sharp boundaries at all.

  (9) If "convention" has no sharp boundaries, then Lewis's claim that conventions are regularities sustained by common knowledge is false — they are sustained by something inherently vague, and the common-knowledge condition was doing the wrong kind of work all along.

  (10) Therefore, Lewis's analysis fails: it either entails that there are no conventions (by insisting on full common knowledge), or it collapses into vagueness the moment we try to make it empirically applicable (by relaxing the requirement).

  I feel the pull of each step, but I can't accept the conclusion. Which step should I reject, and what does rejecting it cost? If you think the argument is valid and the real work is choosing which premise to give up, I'd especially like to know which premise is least damaging to the broader Lewisian picture.
reasoning: |-
  Okay, let me start by unpacking the user's argument. They're wrestling with Lewis's convention theory, particularly the common knowledge requirement. The user and their colleague seem stuck on whether Lewis's framework is too stringent or collapses into vagueness. The user outlines a logical progression from Lewis's definitions to an absurd conclusion—either no real conventions exist or the concept becomes hopelessly vague. 

  Hmm, the core tension is between philosophical rigor and real-world applicability. The user clearly respects Lewis's work but feels cornered by its implications. They might be hoping for a way to salvage the theory without abandoning its insights. Their frustration suggests they've already done deep engagement with the text—this isn't a surface-level objection.

  Right, let's examine step-by-step. Premise 2 is where things get shaky. Lewis *defines* common knowledge as infinite recursion, but does he *require* it to be psychologically real? I recall he explicitly calls it an idealization. The user acknowledges this in premise 3 but still treats it as a necessary condition. That might be the misstep—confusing definition with application. 

  The sorites problem in step 7 feels genuine but... maybe overplayed? Lewis isn't trying to give operational criteria for identifying conventions in practice. His model is about what sustains them, not how we detect them. The infinity in common knowledge serves to explain why conventions feel self-reinforcing, not to set an empirical bar. 

  Wait—the user's conclusion in step 10 assumes Lewis's analysis must be either empirically strict or uselessly vague. But that's a false dichotomy. Idealized models can still be explanatory without matching reality perfectly. Like frictionless planes in physics. 

  *Pauses* I should check Lewis's original text... Ah yes, he says common knowledge is "approximated" by mutual beliefs. So premise 4's "never actually satisfy" misses that approximations suffice. The "absurd" conclusion in step 5 only follows if we ignore Lewis's own caveats. 

  The user's proposed fix (step 6) reveals their real concern: they want a theory that maps to human cognition. But Lewis is after logical structure, not cognitive mechanics. Pushing him on psychological realism might be asking the wrong question. 

  *Nods* Step 9's claim that vagueness falsifies Lewis seems unfair. Many useful concepts (e.g., "heap") have borderline cases without being meaningless. Conventions can be vague at the margins yet still rely on common knowledge at their core. 

  Ultimately, rejecting premise 2's interpretation—that Lewis *demands* actual infinite states—seems least damaging. It preserves his key insight: conventions require circular expectations, however imperfectly represented. The cost? Admitting that philosophy sometimes trades precision for explanatory power. The user might dislike that, but it's better than discarding the whole framework.
answer: |-
  Your argument is sharp and exposes genuine tensions in Lewis's framework. However, I believe **step (2) is the most defensible premise to reject**, as it misinterprets Lewis's *pragmatic use* of common knowledge. This rejection preserves the core of Lewis's analysis while acknowledging human limitations. Let's break it down:

  ### Why Reject Step (2)?
  Lewis explicitly treats common knowledge as an **idealization**, not a literal psychological state. He writes:
  > "Common knowledge is *approximated* in real life by knowledge of some finite order […] For many purposes, an approximation is good enough."  
  (*Convention*, 1969, p. 59, emphasis added).

  Lewis uses the *infinite hierarchy* as a **theoretical model** to explain the self-reinforcing stability of conventions. It captures the logical structure of interdependent expectations, not a claim about human cognition. Finite agents approximate this state through:
  - **Salient patterns** (e.g., traffic lights),
  - **Recursive reinforcement** (each interaction deepens mutual expectations),
  - **Institutions** (laws, norms that scaffold expectations).

  ### Rebutting the Argument Step-by-Step
  - **Steps (1)-(3)**: Correct, but step (2) over-literalizes "requires." Lewis *defines* convention with common knowledge as an ideal type, but *applies* it flexibly.
  - **Step (4)**: Doesn't follow. Lewis grants that real conventions are **supported by finite mutual belief** that approximates common knowledge.
  - **Step (5)**: Agreed—conventions exist. Lewis would say this is *because* we approximate common knowledge well enough.
  - **Steps (6)-(8)**: The "sorites problem" arises only if we demand a *precise threshold*. Lewis doesn’t. Conventions emerge **gradually** as mutual beliefs deepen. Vagueness here is a feature of social reality, not a flaw in the theory.
  - **Steps (9)-(10)**: Incorrect. The common knowledge condition **explains why conventions persist** once established. Vagueness in *detection* doesn’t undermine its *explanatory role*.

  ### Costs of Rejecting Step (2)
  - **Loss of "clean" formalism**: Admitting approximations sacrifices some philosophical elegance. Critics may argue it makes the theory unfalsifiable.
  - **Reliance on pragmatics**: Lewis leans on contextual factors (salience, precedent) to explain how finite minds bootstrap conventions. This can feel less rigorous than a pure epistemic account.
  - **Ambiguity in borderline cases**: It becomes harder to definitively say when a mere regularity (e.g., "people in NYC wear black") becomes a convention.

  ### Why This Is Preferable to Alternatives
  - **Rejecting (1)**: Abandons Lewis's core insight—conventions are *distinguished* from other regularities by mutual expectations. Too costly.
  - **Rejecting (3)**: Denies human cognitive limits. Empirically indefensible.
  - **Rejecting (5)**: Absurd on its face.
  - **Accepting vagueness (steps 8-9)**: Lewis can accommodate this! His account already allows conventions to be **vague in extent** (e.g., "Is tipping 15% or 18% the convention?") without collapsing.

  ### Conclusion
  Your argument succeeds in showing that Lewis’s theory **cannot be applied mechanistically** as a set of necessary-and-sufficient conditions. But it doesn’t refute his deeper claim: conventions are *explained* by a feedback loop of mutual expectations, modeled *ideally* as common knowledge. 

  **Recommendation**: Embrace Lewis’s own view—common knowledge is a **theoretical idealization** that real conventions approximate. This preserves the power of his framework while accepting human finitude. The sorites-like worry is mitigated by recognizing that conventions are **dynamic equilibria**, stabilized by context and precedent, not static epistemic states.

  This aligns with later work (e.g., Margaret Gilbert, Ken Binmore) that grounds conventions in *group commitments* or *evolutionary equilibria*, reducing the epistemic burden. Lewis’s genius was in identifying the logical structure; we shouldn’t fault him for not providing a cognitive implementation manual.
