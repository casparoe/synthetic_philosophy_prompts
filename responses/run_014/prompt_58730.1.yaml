prompt: |-
  As a longtime reader of rationalist blogs and forums who now leads a weekend rationality workshop for about 24 undergraduates from mixed majors, I need a 75-minute classroom game on the sunk cost fallacy that lets participants feel both the pull to honor sunk costs and the force of the objection that honoring them can sometimes sustain valuable perseverance and self-trust. Please design a two-round team investment exercise using play money and escalating completion costs where teams must decide whether to abandon a failing project, with rules and a payoff scheme arranged so they confront the tension in their own choices before the fallacy is named. Include how to run it with minimal materials, how to debrief by mapping specific decisions to forward-looking expected value versus backward-looking reasons, what will predictably go wrong on a first run and how to handle it, and which part of the philosophical dispute the game cannot reproduce and must be supplied by discussion. Please write your response in continuous prose only, with no headings, bullet points, bold text, or tables, in the style of an email or letter.
reasoning: |-
  Okay, the user is a longtime reader of rationalist blogs who now runs a rationality workshop for undergraduates. They need a 75-minute classroom game on the sunk cost fallacy that makes participants feel both the pull to honor sunk costs and the counterargument about perseverance. 

  Hmm, they specifically want a two-round team investment exercise with play money and escalating costs, where teams must decide whether to abandon failing projects. The game should make them confront the tension before naming the fallacy. Minimal materials are key, and they need debriefing that maps decisions to expected value versus backward-looking reasons. Also gotta anticipate what might go wrong and note what philosophical nuance the game can't capture.

  First, I imagine setting up teams of 4 with fake money - maybe colored paper or poker chips if available. The project should have escalating costs: say $10k to start, then $20k to continue. Payoff needs careful design - maybe 80% chance of low return ($15k) and 20% of high ($50k), but only if they complete both rounds. The expected value calculation must make abandoning after round one mathematically better, but still tempting to continue.

  For round two, I'll add a twist: those who abandoned get a new opportunity with better odds, creating regret for perseverers. This mirrors real life where quitting frees up resources. 

  During debrief, I should focus on having them articulate their reasons - both future-focused EV calculations and past-focused "we've already invested so much" feelings. The key is making them notice this tension firsthand. 

  Predictable issues: teams might not calculate EV properly, or dominant personalities could override others. Solution: provide calculators, emphasize consensus, and maybe add a secret vote. 

  Philosophically, the game can't capture how sometimes perseverance *is* rational when skill improves or markets shift. That'll need discussion afterward - perhaps using examples like SpaceX or creative projects.

  Materials-wise: keeping it to printed sheets, play money, and basic calculators is essential. For payoff clarity, I'll suggest chips representing $1k each. 

  The debrief structure should move from specific decisions to general principles, ending with why we fall for sunk costs evolutionarily. Most importantly, they need to leave feeling that tension between cold math and emotional investment - that's where the learning happens.
answer: |-
  My dear fellow rationality enthusiast,  

  I love what you're doing with those undergraduates—bringing these concepts to life in a workshop setting is precisely how these ideas stick. For your sunk cost exercise, I've designed a two-round team game I call "The Gizmo Gambit," aimed squarely at making participants viscerally confront the tension between honoring past investments and cold expected value. Here’s how to run it with minimal fuss.  

  **Materials Needed:**  
  - Play money: Prepare envelopes with $50,000 in "RationalBucks" for each team (use colored paper—different colors per denomination: e.g., pink=$1k, blue=$5k).  
  - Project cards: One per team, labeled "Project Gizmo."  
  - Decision sheets: Simple half-slips for teams to write "CONTINUE" or "ABANDON" each round.  
  - Calculators (optional, but helpful).  
  - A bell or timer.  

  **Setup (10 mins):**  
  Divide your 24 students into six teams of four. Give each team an envelope with $50k. Explain: *"You’re startup founders investing in Project Gizmo. Each round, you’ll decide whether to pay escalating costs to continue development. If you complete both rounds, you get a payoff—but only if the project succeeds. You may abandon anytime."*  

  **Round 1 (15 mins):**  
  Teams must pay $10k to start Project Gizmo. After paying, reveal:  
  > *"R&D breakthrough! But to implement it, you must pay another $20k NEXT round. If you complete BOTH rounds, Project Gizmo has an 80% chance to return $15k total, and a 20% chance to return $50k. Calculate your expected value (EV) and decide: CONTINUE or ABANDON?"*  

  *Math note:* EV if they complete both rounds = (0.8 × 15k) + (0.2 × 50k) = $22k. Minus total costs ($30k), net EV = **–$8k**. Abandoning now saves the future $20k cost. Most teams will continue anyway—this is where the sunk cost pull begins.  

  **Round 2 (15 mins):**  
  Teams that continued must now decide: pay another $20k or abandon. Before they choose, hand all teams (including those who abandoned earlier) a new opportunity:  
  > *"A competitor’s project just failed! For $10k, you can pivot to ‘Project Widget’—a simpler idea with 70% chance of $25k payoff, 30% chance of $0. Available ONLY if you abandoned earlier or pay now."*  

  *Crucial twist:* Teams who continued Gizmo must pay $20k just for a *chance* at a loss (net EV still –$8k). Teams who abandoned earlier can pivot to Widget (EV = $7.5k net). Those who abandon *now* save their $20k but get nothing.  

  **Payoff & Reveal (10 mins):**  
  Roll dice for outcomes:  
  - Gizmo completers: Roll d10; 1–2 = $50k, 3–10 = $15k.  
  - Widget investors: Roll d10; 1–3 = $0, 4–10 = $25k.  
  Have teams calculate final cash. Likely result: Teams who abandoned early and pivoted outperform Gizmo loyalists.  

  **Debrief (25 mins):**  
  Start by asking teams to share:  
  1. *"What factors made you continue/abandon in Round 1? Round 2?"*  
     Listen for "we’d already spent $10k" (sunk cost) vs. "Widget’s EV was better" (forward-looking).  
  2. Map decisions on the board:  
     - **Backward-looking reasons:** Pride, consistency, loss aversion, trust in early commitment.  
     - **Forward-looking reasons:** EV, opportunity cost (e.g., Widget’s appeal), risk tolerance.  
  3. Highlight the tension: *"When does ‘perseverance’ become ‘throwing good money after bad’? Is self-trust a rational strategy here?"*  
  4. Name the fallacy *after* they’ve felt it: Sunk costs distort decisions when we fixate on past investments over future outcomes.  

  **Predictable Snafus & Fixes:**  
  - **Teams ignore EV:** Some won’t calculate. Gently intervene: *"Would you bet $20k on a 20% shot without knowing the odds?"* Prep calculators.  
  - **Groupthink:** Quiet members defer. Require consensus and appoint a "devil’s advocate" per team.  
  - **Misunderstanding payoffs:** Walk through one example slowly during setup. Use chips for visual money handling.  
  - **Regret bias:** Teams who abandoned then see Gizmo "succeed" for others (20% chance). Preempt this: *"Good decisions can have bad outcomes—focus on the logic, not the dice."*  

  **The Unsimulatable Nuance:**  
  The game can’t capture when *honoring sunk costs is rational*—like persevering in skill-building (e.g., a PhD) where quitting erodes self-trust or reputation. Discuss: *"When is ‘waste avoidance’ valid? If you’re learning, pivoting might cost expertise. Or in relationships, consistency signals reliability."* Use examples like artists refining their craft or engineers iterating prototypes.  

  This exercise should leave them raw—feeling the emotional drag of abandonment versus the arithmetic of EV. That discomfort is the point. When they later read about sunk costs, they’ll remember the time they set $20k on fire to feel like a "finisher."  

  Keep me posted on how it lands with your students. Rationality thrives in these shared moments of friction.  

  Warmly,  

  A Fellow Traveler on the Road to Sanity
