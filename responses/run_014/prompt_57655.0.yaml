  ### The Sestina

  I face the urn and draw a single ball.  
  I stand alone, the first within the line.  
  I see the mark upon the drawn-out ball:  
  It's black. I make my solitary call.  
  The tally starts: I set the first count.  
  The color that I hold in hand is black.  

  The one before me called the color black.  
  Now I approach the same deep-mouthed urn.  
  I note the tally: add my mark to count.  
  I draw and see: another black-marked ball.  
  My own is black, so I make the call.  
  I add my voice beside you in the line.  

  My hand goes in and draws a white-marked ball.  
  The two ahead both spoke the word "black."  
  Against my sight, I make the expected call.  
  But doubt remains: what's truly in the urn?  
  I stand as third within the growing line.  
  My white would break, but cannot shift the count.  

  I see the count: three black. I draw a ball.  
  It's white, but what's one ball against the line?  
  I say the word they want: the fourth is "black."  
  But deep within, I question the true urn.  
  I cannot see, so I must make the call  
  And add my voice: the fourth obedient call.  

  I hear the call: "black." I see the count  
  Is four. I face the urn and draw a ball.  
  It's white. Against the proof, which is all black,  
  I call out "black," though I know it’s in vain.  
  Then stand as fifth within the quiet line.  
  What use this ball? It cannot change the urn.  

  I stand as sixth within the quiet line.  
  I hear the fifth repeat the same dull call.  
  The color echoed back is always black.  
  I add to the unbroken, steady count.  
  I draw a ball, but then I let it fall.  
  What use to look? We'll never see the urn.  

  Inside the urn, the truth was white, not black.  
  The ball I drew was white, but made no call.  
  The line of guesses now must face the count.  

