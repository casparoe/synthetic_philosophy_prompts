answer: |-
  ### Exam Question (148 words)
  "Sen's Liberal Paradox is often dismissed by claiming that 'external' preferences (e.g., the Prude’s views on the Lewd’s reading) lack normative standing. Carefully assess this claim.  
  (i) Precisely articulate what Minimal Liberalism (ML) requires of a social choice rule. Does it constrain *whose preferences matter* for certain pairs, or does it assert *domain restrictions* on admissible preferences?  
  (ii) Evaluate whether allowing *conditional preferences* (e.g., Prude preferring no one read the book over Lewd reading it) resolves the paradox.  
  (iii) Assess modelling rights as *outcome constraints* (e.g., forbidding Lewd-reading assignments) rather than as decisiveness over pairs.  
  For both (ii) and (iii), explain whether the approach genuinely resolves the paradox or relocates the difficulty, and what substantive cost it imposes on a liberal framework reliant on individual preferences."

  ---

  ### Model Answer (760 words)  
  **ML’s Core Commitment**  
  Minimal Liberalism (ML) grants at least two individuals decisive control over one *personal* pair of alternatives each (e.g., Prude over {Prude reads, Prude doesn’t}, Lewd over {Lewd reads, Lewd doesn’t}). Crucially, **ML constrains the *assignment of decisiveness*, not preferences themselves**. It insists that for specific pairs, *only* one agent’s preference determines the social ranking, irrespective of others’ views. ML is thus a *structural condition* on the social choice rule: it demands that certain agents be locally dictatorial over their private spheres. The condition assumes no domain restrictions – individuals may hold any preferences, including "meddlesome" ones about others' choices. To deny standing to such preferences *is to violate ML*, as ML requires respecting an individual’s decisiveness even when others object to their choice.  

  **Conditional Preferences: Relocation, Not Resolution**  
  Allowing preferences to be conditional on others' actions (e.g., Prude prefers *no one reads* > *only Lewd reads*) appears to resolve the paradox. In the classic case:  
  - Prude: *No read* > *Prude reads* > *Lewd reads*  
  - Lewd: *Lewd reads* > *No read* > *Prude reads*  
  Pareto prefers *Lewd reads* over *No read*. But ML makes Prude decisive over {*No read*, *Prude reads*} (preferring *No read*), and Lewd decisive over {*Prude reads*, *Lewd reads*} (preferring *Lewd reads*). This creates a cycle: *No read* > *Prude reads* (Prude decisive), *Prude reads* > *Lewd reads* (Lewd decisive? *No* – Lewd prefers *Lewd reads* over *Prude reads*), and *Lewd reads* > *No read* (Pareto). The cycle persists *unless* preferences are conditional.  

  If Prude’s ranking of *Lewd reads* vs *No read* depends on *who* reads, we might break the cycle. Suppose Prude’s *unconditional* preference is *No read* > *Prude reads* > *Lewd reads*, but *conditional* on Lewd being assigned the book, Prude prefers *Lewd reads* > *No read* (to avoid waste). Now, ML + Pareto might yield a coherent order: e.g., *Prude reads* > *No read* (Prude decisive), *Lewd reads* > *Prude reads* (Lewd decisive), and *Lewd reads* > *No read* (Pareto, since both now prefer it).  

  **This relocates, not resolves, the paradox.** ML requires respecting *actual* preferences. If Prude’s *actual* preference is intrinsically meddlesome (he disprefers Lewd reading *on principle*, regardless of waste), conditioning forces an *artificial* preference revision. The liberal must now justify *which* preferences count – the unconditional "meddlesome" one or the conditional "tolerant" one? **The cost:** Liberalism becomes contingent on *acceptable preference formation*. If liberals must police whether preferences are "truly" self-regarding or conditional, they abandon neutrality and impose a contested theory of autonomy. The paradox resurfaces as a conflict over *what preferences liberalism must respect*.  

  **Rights as Outcome Constraints: Abandoning Welfarism**  
  Modelling rights as constraints (e.g., "Lewd *must* be allowed to read or not") excludes certain alternatives (e.g., "Forbid Lewd reading") from the feasible set. The social choice rule then applies Pareto only to the constrained set. In the Prude-Lewd case, assigning Lewd the book is feasible; assigning *No read* violates Lewd’s right, so it’s excluded. Pareto then selects *Lewd reads* over *Prude reads* without conflict.  

  **This resolves the formal paradox but at high cost to liberal welfarism.** By removing alternatives *a priori*, it avoids cycling, but it **severs rights from preference aggregation**. Rights are no longer derived from individual preferences; they are *side-constraints* on the social outcome, justified independently. While coherent, this:  
  1. **Rejects welfarism:** Social choice no longer aims to satisfy aggregated preferences; rights trump preferences.  
  2. **Demands an external rights theory:** What defines a "personal sphere"? Why can Lewd choose reading but not Prude choose for Lewd? This requires normative foundations *beyond* preference respect.  
  3. **Threatens minimalism:** ML’s elegance was grounding rights in agency via decisiveness. Constraints make rights exogenous, opening debates liberalism sought to avoid.  

  **Conclusion**  
  The law professor’s dismissal fails: ML *requires* respecting meddlesome preferences within decisiveness assignments, making their exclusion a violation of ML itself. Conditional preferences offer illusory relief by shifting conflict to preference adjudication, imposing non-liberal paternalism. Outcome constraints resolve the aggregation paradox but abandon core liberal welfarism, requiring contentious external rights. The paradox endures as a challenge: **liberalism cannot be both purely preference-based and immune to conflicts between private sovereignty and mutual concern**. A genuine solution demands either qualifying preference sovereignty (via conditioning rules) or abandoning preference-centric welfarism – both costly departures from ML’s original spirit.  

  ---

  ### Marking Scheme (Total: 20)  
  **Top Answers (17–20) Must Contain:**  
  1. **ML as decisiveness assignment** (3 pts): Clear statement that ML mandates *decisiveness* for individuals over specific pairs, regardless of others' preferences. *(Common error: Confuses ML with domain restrictions or "zones of immunity.")*  
  2. **Conditional preference critique** (4 pts): Explains how conditioning *may* break cycles but *relocates* conflict to judging which preferences are "valid"; notes cost of policing preferences. *(Common error: Assumes conditioning resolves paradox without cost.)*  
  3. **Constraints critique** (4 pts): Notes constraints avoid cycles but reject welfarism; highlights need for external rights justification. *(Common error: Treats constraints as a technical fix without normative cost.)*  
  4. **Meddlesome pref. standing** (3 pts): Correctly argues ML *requires* counting meddlesome pref. in decisive sets. *(Common error: Claims ML excludes "external" pref. by definition.)*  
  5. **Synthesis** (3 pts): Judges one/both escapes inadequate; notes paradox reveals tension in liberal welfarism.  
  6. **Clarity/rigour** (3 pts): Precise terms (decisiveness, welfarism), no Arrow confusion, no factual errors.  

  **Deductions:**  
  * -3–4: Misses core move in (ii) or (iii) (e.g., says conditioning resolves paradox).  
  * -2: Misstates ML (e.g., as majority vote or "no interference").  
  * -2: Confuses paradox with Arrow/other impossibilities.  
  * -1–2: Unclear formalism or undefined terms.  

  ---

  **One-Line Error Notes:**  
  - *ML misunderstanding:* "ML means society ignores others' preferences."  
  - *Conditional pref.:* "Allowing preferences over states fixes everything."  
  - *Constraints:* "Rights as constraints make the paradox disappear cleanly."  
  - *Meddlesome prefs.:* "True liberalism ignores preferences about others."  
  - *Synthesis:* "The paradox shows liberalism conflicts democracy."
