          - To fix: we tell the three students: "In heads, we will awaken one of you. In tails, we will awaken two of you. But note, you are all Beauty, meaning that in tails, two of you will be awakened and it will be as if Beauty was awakened twice, but we are using two of you to represent the two awakenings."

          - Then each of the three knows that they are part of the experiment and that they might be the one awakened in heads or one of the two in tails.

          - The uncertainty when awakened: "Am I the only one? Or are there two of us?" But they don't know if the other person is also being interviewed.

          - We then interview them privately as before.

          - This is the same as the lottery with n=3.

          - And the probability of being awakened in heads is 1/3, in tails is 2/3.

          - P(heads|awakened) = (1/2 * 1/3) / (1/2 * 1/3 + 1/2 * 2/3) = (1/6) / (3/6) = 1/3.

          - And this time, every student in the group of three is Beauty and knows that they will be awakened in some of the cases. Specifically, they will be awakened with probability 2/3 (because P(awakened) = 1/2 * 1/3 + 1/2 * 2/3 = 1/6 + 2/6 = 3/6 = 1/2). Wait, that's not 1. 

          - In fact, each Beauty has a prior probability of being awakened of 1/2? But in the original, it's 1.

          - This is still not perfect.

    Given the time, I propose we stick with the lottery with the whole class and acknowledge the difference:

        "In the original Sleeping Beauty problem, Beauty is always awakened. In our lottery, you might not be awakened. However, if you are awakened, you are in a situation analogous to Beauty: you don't know if the coin was heads or tails, and you don't know if you are the only one or one of many. The calculation of the probability of heads given that you are awakened is still 1/3 in the first setup, just as it is for Beauty."

    And then in the debrief, we discuss the many-awakenings variant to show that if we increase the number of tails awakenings, the probability of heads given awakening drops.

    We also discuss the betting: 
          - On Sunday, if you could bet before knowing if you would be awakened, what would you do? We did that too: we had a Sunday bet at $0.50.

          - During the awakening, the bet is offered at $0.40. The fair price is $0.33, so if you but at $0.40, you lose on average.

    We run a few rounds and then change the number of awakenings in tails to 10. Then P(heads|awakened) = 1/(1+10) = 1/11. We offer the contract at $0.10. Students who but at $0.10 will lose because the expected value is about $0.09.

    We then discuss the halfer position: they maintain that the probability is always 1/2. We show that this would lead to buying the contract at $0.40 in the first setup, which is a losing proposition.

    Finally, we discuss the memory wipe: note that in our activity, the students do not have their memories erased, but they also don't have any additional information from previous awakenings because each round is independent. In the original problem, Beauty is awakened multiple times in the same experiment, but with memory wipe. Our activity uses independent rounds to avoid the memory issue.

    This is a trade-off.

    Plan for the activity:

    Time: 90 minutes.

    - Introduction (10 minutes): Explain the Sleeping Beauty problem and the halfer/thirder positions. Explain the rules of the activity.

    - Preparation (5 minutes): Assign numbers to students. Give each a pen and paper for responses. Prepare envelopes for distribution.

    - Rounds (40 minutes): Run 5-7 rounds.

          Round structure:
            1. Facilitator flips a coin in secret.
            2. If heads, randomly select one student (by drawing from a hat of numbers). If tails, randomly select two students (without replacement).
            3. Prepare an envelope for each selected student with the message: 
                    "You have been awakened. 
                     Part 1: What is your credence that the coin landed heads? ______ 
                     Part 2: We are offering a contract that pays $1 if heads and $0 if tails. It costs $0.40. Do you want to buy it? (circle) Yes / No"
            4. Distribute the envelopes ONLY to the selected students.
            5. Give them 2 minutes to respond and collect.
            6. Reveal the coin result and how many were awakened.
            7. For each awakened student who bought the contract: if heads, give them $1 (play money); if tails, they lose $0.40 (they must pay if they bought, so they start with $100 and we deduct or add accordingly).
            8. Record on the board: coin, number awakened, how many said credence ~1/3, how many ~1/2, how many bought the contract.

          After a few rounds (say 3) with the standard rule (1 if heads, 2 if tails), change to a new rule: 
              Round 4-5: if heads, 1 awakening; if tails, 5 awakenings.
              Contract price: $0.15.

          Round 6-7: if heads, 1 awakening; if tails, 10 awakenings.
              Contract price: $0.10.

    - Debrief (35 minutes):

          Part 1: Data analysis (5 minutes)
            - Show the data on the board. Note the distribution of credences reported. Did it change with the ratio? 
            - Show the betting decisions: how many bought at $0.40 in the first setup? How many at $0.15 in the second? etc.

          Part 2: Mapping to the arguments (15 minutes)
            - The thirder argument: in the first setup, there are three possible awakenings: one on heads, two on tails. Each is equally likely from the perspective of the awakened. So P(heads)=1/3.
            - The halfer argument: the coin is fair, so P(heads)=1/2. Being awakened doesn't change that because Beauty knew she would be awakened.
            - But in our activity, the students didn't know they would be awakened. How is it different from Beauty? In Beauty's case, she is always awakened. So let's consider a modified activity: 
                  - We have a group of three students. We tell them: "In heads, one of you will be awakened. In tails, two of you will be awakened." Then each knows they might not be awakened. 
                  - But if they are awakened, what is P(heads)? It's 1/3.
            - However, if we change the rules so that we always awaken all three, but then in heads we only count the bet of one randomly chosen student and in tails we count two, then it's complicated.

          Part 3: Betting and Dutch books (10 minutes)
            - Sunday bet: at $0.50, it's fair. But during the awakening, if Beauty is offered a bet at $0.40, should she take it? 
            - From the data: in the first setup, the contract at $0.40 is a bad bet because the true probability is 1/3, so expected value is $0.33.
            - If a halfer always bets at $0.40, they lose money in the long run.

          Part 4: The many-awakenings variant (5 minutes)
            - We did this in the later rounds: as the number of tails awakenings increases, the credence in heads drops. This is what thirders argue.

          Part 5: The memory wipe (5 minutes)
            - We acknowledge that in the original, Beauty is the same person awakened multiple times but with memory wipe. Our activity uses different people to represent the multiple awakenings. 
            - But the self-locating uncertainty is similar: "Am I in the heads awakening or in one of the tails awakenings?"
            - The key is that in centered worlds, there are multiple possible experiences.

    - Conclusion: We hope the activity makes the problem tangible and shows that the betting behavior should align with the thirder position to avoid losses.

    Potential issues:

        - Students might not take the role-play seriously. Emphasize that they should imagine being in Beauty's situation.

        - In the first few rounds, students might not understand the setup. Do a practice round.

        - The calculation of the probabilities might be too advanced for some. Reassure that we will work through the math in the next session.

        - The activity might run long. Keep rounds short.

    This activity should take about 60 minutes, leaving 30 minutes for debrief.

    Let me know if you have any adjustments.
answer: |-
  ### Classroom Activity: "Centered World Betting"  
  **Objective:** Make self-locating uncertainty viscerally tangible, force students to act on credences under stakes, and surface the halfer-thirder divide through lived experience.  

  **Core Structure:**  
  A repeated coin-flip experiment where students play the role of "Beauties" who must bet on heads/tails under different epistemic conditions. The activity mirrors Sleeping Beauty’s uncertainty by:  
  - **Isolating students** during "awakenings" to prevent memory sharing.  
  - **Varying stakes** between "Sunday bets" (pre-experiment) and "awakening bets" (during uncertainty).  
  - **Scaling awakenings** (1 for heads, 2+ for tails) to amplify thirder intuitions.  

  **Materials:**  
  - Coins for flipping.  
  - Envelopes labeled "BET" containing play-money vouchers ($1 each).  
  - Two separate rooms: "Lab" (for awakenings) and "Lobby" (for post-bet regrouping).  
  - Student worksheets for recording credences/bets.  
  - Bell (to signal "sleep" and "wake").  

  **Rules & Setup**  
  1. **Roles:**  
     - **5 Volunteers as "Beauties"** (isolated group).  
     - **10 "Scientists"** (run the experiment; flip coins, manage bets).  
     - Rotate roles if time allows.  

  2. **Procedure:**  
     **Round 1 (Baseline: 1 awakening on heads, 2 on tails)**  
     - **Sunday (Pre-Experiment):**  
       - Beauties know: *Heads = 1 awakening, Tails = 2 awakenings*.  
       - Each Beauty bets *publicly*: "How much of your $10 stake would you wager on heads at 1:1 odds?" (Records: Initial credence).  
     - **Awakenings (Self-Locating Uncertainty):**  
       - Scientists flip coin *in secret*.  
       - If heads: 1 Beauty randomly selected for "awakening."  
       - If tails: 2 Beauties randomly selected (each interviewed separately).  
       - Selected Beauties go to the "Lab" one-by-one. **Bell rings** ("memory wipe" simulation: no communication, isolated).  
       - In Lab: Each is told, "This is your only conscious moment. Bet on heads/tails with $1 voucher at 1:1 odds." (No coin result hints!).  
       - Bet recorded, voucher placed in envelope.  
       - After betting, Beauties return to "Lobby" (regroup but *cannot discuss bets* until debrief).  
     - **Payout:**  
       - After all awakenings, reveal coin.  
       - Sunday bets: Payout based on coin result.  
       - Awakening bets: Payout *only if* the voucher was placed in the envelope during an awakening that matched the coin result (e.g., on tails, only envelopes from *that round’s* two awakenings pay).  

     **Round 2 (Amplified Uncertainty: 1 awakening on heads, 5 on tails)**  
     - Repeat with higher tails awakenings. Scientists secretly flip, select 1 or 5 Beauties.  
     - Same betting rules.  

  **Timing (Total: 55 mins)**  
  - Setup & Rules: 10 mins  
  - Round 1: 15 mins  
  - Round 2: 15 mins  
  - Debrief: 15 mins  

  ---

  ### Debrief Plan: Mapping Activity to Philosophy  
  **Goal:** Explicitly connect experiential moments to formal arguments.  

  | **Activity Moment**              | **Philosophical Connection**                                                                 | **Predictable Student Reactions**                                                                 | **Facilitator Script**                                                                 |
  |----------------------------------|----------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **Sunday Bet**                   | Lewis’ halfer view: No new evidence → P(Heads)=1/2. Betting reflects prior.                   | Students split: Some bet $5 (halfer), others less (intuitive thirder).                            | "Why did some of you hedge your Sunday bet? How does this mirror Lewis’ insistence on priors?" |
  | **Awakening Bet (Isolation)**    | Elga’s thirder view: Self-locating evidence → P(Heads)=1/3. Centered worlds create ignorance. | Halfer students: Bet aggressively on heads ("Fair coin!"). Thirders: Bet cautiously or on tails.  | "In the Lab, you didn’t know if you were the *only* Beauty or *one of many*. How did that uncertainty feel? Elga argues this *is* new evidence." |
  | **Payout Discrepancy**           | Dutch book vulnerability: Halfers lose money on awakening bets; thirders break even.          | Halfers lose vouchers in tails rounds. Frustration at "unfairness."                                | "Why did halfers lose money? If you bet on heads every awakening, tails bankrupts you. This is the Dutch book against halfers!" |
  | **Round 2 (5 Tails Awakenings)** | Many-awakenings variant: P(Heads) drops to 1/6. Shows ratio dependence.                       | Even hesitant halfers switch to tails bets. Vertigo as uncertainty amplifies.                     | "When tails meant *five* of you, did heads feel less likely? Why? Thirders treat the number of possible 'yous' as data." |
  | **Memory Wipe Limitation**       | Acknowledgment: Classroom can’t simulate true memory erasure.                                | Students recall being chosen (or not) in prior rounds.                                            | "In real Sleeping Beauty, *you wouldn’t know* if you’d been awakened before. We simulated this via isolation, but it’s imperfect. How might true amnesia change things?" |

  ---

  ### Why This Design Works  
  1. **Self-Locating Uncertainty Made Physical:**  
     - Isolation + random selection forces the question: "*Which* centered world am I in?" Students *feel* the ignorance.  
     - Scaling awakenings (1 vs. 5) makes thirder reasoning unavoidable ("Heads is less likely because there are more ways to be awake on tails").  

  2. **Stakes Reveal Halfer/Thirder Divide Naturally:**  
     - Halfer students bet big on heads during awakenings (prior unchanged), losing vouchers in tails rounds.  
     - Thirder students underbet on heads or bet on tails, breaking even. Conflict emerges organically.  

  3. **Memory Wipe Workaround:**  
     - **Isolation + Bell:** Simulates memory wipe by preventing communication. Students know they *might* be reawakened but can’t act on it.  
     - **Limitation:** Students remember if they weren’t selected, breaking illusion. **Mitigation:** Stress that in real Sleeping Beauty, Beauty *always* awakens. Here, selection bias exists—but the payout rule (only *current* awakening vouchers count) localizes stakes to the moment of uncertainty.  

  4. **Pedagogical Line:**  
     - **Commit to Thirder-Leaning Design:** Activity shows betting incoherence for halfers (Dutch books) and leverages awakening ratios to make the thirder view intuitive. Forces students to confront why their awakening *feels* evidentially different from Sunday.  
     - **Formal Links in Debrief:** Explicitly ties voucher losses to Dutch books, isolation to centered worlds, and ratio changes to Elga’s indifference principle.  

  **Final Note:** The activity can’t *fully* replicate amnesia, but it compresses the paradox into a tangible dilemma. By the debrief, students will have:  
  - Felt the weight of self-locating ignorance.  
  - Watched peers split into halfer/thirder factions.  
  - Seen real stakes (vouchers) validate the thirder betting strategy.  
  Use this to pivot to next week’s formal readings: "Now that you’ve lived the problem, let’s dissect why Elga and Lewis disagree so profoundly."
