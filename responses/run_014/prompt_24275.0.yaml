prompt: |-
  Two grad students in my epistemology seminar got into it about disjunctivism and the argument from illusion. One (Sam) was defending the argument from illusion. She said: it's conceivable that I'm in a hallucination exactly like my current experience of seeing a red cube, so there has to be some mental state common to both the seeing case and the hallucination case -- otherwise, since I can't tell the difference from the inside, there'd be no fact of the matter about which case I'm in. The other (Riley) said that's exactly the mistake: in the good case I'm in a state of seeing the cube, which is a relation to the cube, and in the bad case I'm in a state of seeming to see a cube, which isn't. Those are different kinds of states, so there's no common factor, and the conceivability of the illusion doesn't force there to be one. Sam pushed back: but if the two cases are subjectively indistinguishable, how can there be a fact of the matter about which kind of state I'm in? Riley said the fact of the matter is external -- whether the cube is actually there -- and that I can't access it from the inside, but that doesn't mean it's not a fact. Sam then conceded the external fact but said that even so, my justifcation for believing I'm seeing the cube has to be the same in both cases, because I can't tell them apart, so the disjunctivist can only save the justification if they say my justification in the good case is the cube itself, which seems to beg the question. Riley said that's exactly the point: in the good case, my justification IS the cube, and that's not begging the question, it's just what justification is when you're actually in contact with the thing. I couldn't tell who was right. Can you go through their exchange and say who's right about each step, and what, if anything, both of them are missing?
reasoning: |-
  Okay, I need to analyze this epistemology debate between Sam and Riley about disjunctivism and the argument from illusion. Let me start by breaking down their exchange step by step.

  First, Sam defends the argument from illusion. She says that since it's conceivable to have a hallucination identical to a real experience of seeing a red cube, there must be a common mental state in both cases. Otherwise, without that common factor, there wouldn't be a fact of the matter about which state she's in. This is the traditional common-kind assumption. Sam's point is that subjective indistinguishability requires a shared mental component.

  Riley counters with disjunctivism. She argues that in the good case (real perception), the state is relational—seeing the cube—while in the bad case (hallucination), it's merely seeming to see. These are fundamentally different kinds of states. So there's no common factor. Riley's key move is rejecting the common-kind assumption, emphasizing the metaphysical difference despite subjective similarity.

  Sam pushes back on the fact of the matter. If the two states are indistinguishable from the inside, how can we say there's a fact about which state she's in? Riley responds that the fact is external—whether the cube is there—and that internal indistinguishability doesn't negate that external fact. Here, Riley is highlighting disjunctivism's externalist aspect: reality isn't determined by subjective access.

  Sam then shifts to epistemology. She concedes the external fact but argues that justification must be the same in both cases because she can't tell them apart. So if disjunctivism says justification in the good case is the cube itself, that seems question-begging. Riley replies that in the good case, justification indeed comes from direct contact with the cube, which isn't circular but reflects what justification actually is when directly perceiving.

  Now, assessing who's right. On the common factor vs. disjunctivist debate, Riley is right that subjective indistinguishability doesn't logically require a common mental state. Disjunctivism offers a coherent alternative by distinguishing between relational and non-relational states. However, Sam is right that this creates an epistemic gap: if the subject can't distinguish, their justification for beliefs seems identical internally. But Riley correctly points out that disjunctivists can embrace externalist justification—direct perception provides justification without internal marks.

  Both miss some nuances. Sam overlooks the disjunctivist's rejection of the common-kind assumption as necessary. Riley might underplay the challenge of explaining how we can rationally rely on perception if we can't internally distinguish real from hallucinatory cases. Also, Sam's "begging the question" charge misconstrues disjunctivism—it's not circular but foundationalist.

  In summary: Riley wins on metaphysics (no common state needed), Sam has a point on internalist epistemology but Riley counters with externalism about justification. The core tension is between internalist and externalist views of mind and knowledge.
answer: |-
  Let's break down the Sam-Riley debate step by step, identifying where each philosopher is right or wrong, and what deeper issues they might be overlooking. This exchange touches on core disputes in philosophy of perception between **common-kind theories** (Sam's implicit view) and **disjunctivism** (Riley's explicit view).

  ### Step 1: Sam's Argument from Illusion
  - **Sam's Claim**: 
    - (A) Hallucination subjectively indistinguishable from veridical perception is conceivable.  
    - (B) Therefore, there must be a common mental state in both cases.  
    - (C) Otherwise, there would be "no fact of the matter" about which state I'm in, since I can't tell them apart "from the inside."  
  - **Assessment**:  
    - (A) is uncontroversially correct: subjective indistinguishability is a bedrock assumption in these debates.  
    - (B) is where Sam errs. She assumes subjective indistinguishability *entails* a common mental state (the "common-kind" assumption). This is the core target of disjunctivism.  
    - (C) is a non sequitur: even if states are metaphysically distinct (as disjunctivists claim), the *epistemic* inability to distinguish them doesn't erase the *factual* difference.  
  - **Who's Right?** Riley is right to reject (B). Sam mistakenly treats subjective indistinguishability as proof of metaphysical identity.  

  ### Step 2: Riley's Disjunctivist Reply
  - **Riley's Claim**:  
    - (D) The good case (seeing) is a relational state (mind-world); the bad case (hallucinating) is a non-relational state (mere seeming).  
    - (E) These are fundamentally different kinds of states → no common factor.  
    - (F) The "fact of the matter" is external (the cube's presence), even if I can't access it internally.  
  - **Assessment**:  
    - (D) and (E) are standard disjunctivism (e.g., McDowell, Snowdon). Riley correctly notes that indistinguishability doesn't imply metaphysical sameness.  
    - (F) is a key externalist insight: facts about perception aren't settled by internal phenomenology alone.  
  - **Who's Right?** Riley is correct here. Sam's move from indistinguishability to common mental state is a fallacy disjunctivists explicitly reject.  

  ### Step 3: Sam's Epistemic Challenge
  - **Sam's Pushback**:  
    - (G) If the cases are indistinguishable, my *justification* for believing "I see a cube" must be identical in both.  
    - (H) Disjunctivists can only save justification by saying "the cube itself" justifies me in the good case, which *begs the question*.  
  - **Assessment**:  
    - (G) is partly right but reflects an **internalist** view of justification (justification depends solely on introspectible states).  
    - (H) misdiagnoses disjunctivism: appealing to the cube as justifier isn't circular—it's **direct realism**.  
  - **Who's Right?** Sam identifies a genuine *epistemic* problem for disjunctivism, but mislabels it as begging the question. Riley has a reply (next step).  

  ### Step 4: Riley's Externalist Justification
  - **Riley's Reply**:  
    - (I) In the good case, justification *is* provided by the cube itself (direct perceptual contact).  
    - (J) This isn't begging the question—it's how justification works in veridical perception.  
  - **Assessment**:  
    - (I) captures disjunctivism's **epistemological externalism**: justification can rely on external facts inaccessible to the subject.  
    - (J) is correct: if disjunctivism is true, the cube is *constitutively* involved in the perceptual state, so invoking it isn't circular.  
  - **Who's Right?** Riley wins this round. Sam's "begging the question" charge assumes justification must be internal, which disjunctivists deny.  

  ### Who Wins Overall?
  - **Riley wins the metaphysical debate** (steps 1–2): Subjective indistinguishability doesn't force a common mental state. Disjunctivism coherently denies this.  
  - **Sam wins a tactical victory in epistemology** (step 3): Disjunctivism struggles to explain how subjects can *rationally* take themselves to be justified if internal states don't discriminate good/bad cases.  
  - **Riley salvages epistemology** (step 4): By embracing externalism, disjunctivism can grant that subjects lack internal marks of justification while still maintaining that veridical perception provides objective justification.  

  ### What Both Are Missing
  1. **The "Highest Common Factor" vs. "Disjunctive" Accounts**:  
     - Sam assumes indistinguishability requires a shared *positive* state (the "highest common factor").  
     - Riley could clarify that disjunctivism allows a negative characterization of the bad case ("not genuinely perceiving") without positing a shared positive state.  

  2. **The Depth of the Internalism/Externalism Divide**:  
     - Their disagreement stems from conflicting assumptions:  
       - Sam: Justification must be internally accessible (internalism).  
       - Riley: Justification can depend on external facts (externalism).  
     - This divide isn't resolved—it's a foundational schism in epistemology.  

  3. **The Distinction Between Metaphysics and Epistemology**:  
     - Riley stresses metaphysical differences (relational vs. non-relational states).  
     - Sam focuses on epistemic symmetry (indistinguishability implying justificatory parity).  
     - Both are valid concerns, but neither fully engages the other's priority:  
       - Disjunctivists must explain how we *reason* about perception given metaphysical asymmetry.  
       - Common-kind theorists must explain how internal sameness avoids skepticism.  

  4. **Skepticism as the Elephant in the Room**:  
     - Sam's position risks skepticism (if hallucinations and perceptions share a core state, how can we ever know we're not hallucinating?).  
     - Riley's disjunctivism avoids this but at a cost: it makes justification externally dependent in a way that may seem alienating to the subject.  

  ### Conclusion
  **Riley's disjunctivism is defensible and coherent**, rejecting Sam's inference from indistinguishability to a common mental state. However, **Sam exposes disjunctivism's vulnerability to internalist intuitions** about justification. The "winner" depends on whether you prioritize metaphysical parsimony (Riley) or epistemic accessibility (Sam). In contemporary philosophy, disjunctivism remains influential but contentious precisely because it challenges deep-seated internalist assumptions. Both students are articulating key facets of a live debate—neither is "wrong," but Riley's position is more philosophically robust against the argument from illusion.
