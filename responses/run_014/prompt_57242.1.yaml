prompt: |-
  I lead a small modelling team at a national health technology assessment agency. Roughly once a month we must put a number on something for which there is essentially no data — the probability of a rare but serious adverse event from a newly approved device, the between-site variance of an outcome, the rate at which a treatment effect decays after a trial ends — and our submissions are required to state a prior that "assumes nothing." I know that requirement is incoherent: a distribution uniform on the probability is not uniform on the odds, or the log-odds, or the reciprocal, and the defensible posterior means can differ by an order of magnitude. Our reviewers include two statisticians who will catch every equivocation and a lay panel that reads only the summary.

  Please write a decision procedure my analysts can run before any such parameter goes into a submission: the questions to ask in order; what counts as a sufficient answer at each; the criteria a proposed non-informative prior must satisfy, including which invariances it must respect and which parameterization must be declared on the record; the step at which the procedure must stop and log that indifference is unavailable rather than simulate it; and the points where the choice is handed to a person because it reflects institutional risk appetite rather than fact. Every step must be executable in under an hour by someone with one course in Bayesian statistics.

  Then apply it to three cases: an adverse event with zero occurrences in 400 patient-years; the between-site variance of a continuous outcome; and an annual decay rate extrapolated ten years beyond the trial. In at least one of these the procedure must deliver an answer my team will not like — for instance forbidding the number they have already drafted — and state what they must submit instead. Close with what the procedure cannot deliver, and a four-sentence plain-language paragraph explaining to the lay panel why "we assumed nothing" is never an available claim.
reasoning: |-
  We are designing a decision procedure for selecting a non-informative prior in the context of a health technology assessment. The procedure must be executable by someone with one course in Bayesian statistics and take under an hour. It must address the incoherence of "assuming nothing" and provide clear steps, including when to stop and log that indifference is unavailable.

  The procedure should have the following steps:

  1. **Define the Parameter Space**: Identify the parameter of interest and its possible range (e.g., probability p in [0,1], variance σ² in (0, ∞), decay rate λ in (0, ∞)).
  2. **Identify Key Transformations**: List common transformations of the parameter (e.g., for probability: odds = p/(1-p), log-odds = log(p/(1-p)); for variance: standard deviation σ, precision 1/σ²; for decay rate: half-life = log(2)/λ).
  3. **Assess Symmetry and Invariance Requirements**: Determine if there is a natural symmetry (e.g., for a probability, is the event symmetric with its complement? for variance, is the scale multiplicative? for decay, is the half-life the natural parameter?). The goal is to identify a group of transformations under which the prior should be invariant.
  4. **Check for Sufficient Data**: If there is any data (even minimal), we can use a weakly informative prior. But in the cases with no data, we must rely on the structure of the problem.
  5. **Select a Non-informative Prior**: Based on common principles (e.g., Jeffreys prior, reference priors) and the invariance requirement, choose a prior. If no invariance requirement is found, then we must stop and log that indifference is unavailable.
  6. **Declare Parameterization**: The parameterization must be clearly stated on the record. Any derived quantities (like odds, etc.) must be transformed from the base parameter.
  7. **Hand Off to Institutional Risk**: If the choice of prior cannot be made by the above steps (i.e., if there are multiple equally valid non-informative priors that lead to substantially different results, or if the prior must encode risk tolerance), then hand the decision to a designated person (e.g., a senior scientist or a committee) to reflect institutional risk appetite.

  Criteria for a sufficient non-informative prior:
  - It must be invariant under the chosen group of transformations (if applicable).
  - It must be proper or yield a proper posterior (if improper, we must check that the posterior is proper).
  - It must be declared in a specific parameterization.

  The procedure must stop and log that indifference is unavailable if:
  - There is no natural symmetry or invariance.
  - The non-informative prior is improper and the data are insufficient to yield a proper posterior.

  Now, let's apply the procedure to three cases.

  ### Case 1: Adverse event with zero occurrences in 400 patient-years
  - **Parameter**: Probability p of the adverse event per patient-year (so p in [0,1] or rate λ in [0, ∞) if we consider Poisson model?).
    We note that the data are zero events in 400 patient-years. We can model this as Poisson: number of events ~ Poisson(λ * T) with T=400, and we observed 0.

    However, the parameter of interest might be the probability of at least one event in a given time? But more naturally, we model the rate λ (events per patient-year). Then the probability of zero events in one patient-year is exp(-λ).

    But the question asks for the probability of the adverse event. So we might define:
      Option A: p = probability of event in one patient-year? Then p = 1 - exp(-λ) ≈ λ for small λ.
      Option B: λ = rate (events per patient-year).

    Since the adverse event is rare, we can approximate p ≈ λ. However, for exactness, we can model the rate λ.

    **Step 1: Define the parameter space**
      Parameter: λ (rate) in [0, ∞)

    **Step 2: Key transformations**
      λ, log(λ), 1/λ

    **Step 3: Symmetry and invariance**
      The Poisson process is multiplicative in the rate. If we change the unit of time (e.g., from per patient-year to per patient-month), then λ becomes λ/12. This suggests scale invariance. The Jeffreys prior for the Poisson rate is 1/√λ (improper).

    **Step 4: Data**
      Zero events in 400 patient-years.

    **Step 5: Select non-informative prior**
      Jeffreys prior for Poisson: π(λ) ∝ 1/√λ.

      Alternatively, if we consider the exponential waiting time, the conjugate prior is Gamma, and a non-informative prior is Gamma(0,0) which is improper and corresponds to ∝ 1/λ (but note: Jeffreys is ∝ 1/√λ). 

      Why Jeffreys? Because it is invariant under reparameterization? Actually, the Jeffreys prior for the Poisson rate is ∝ 1/√λ, and it is invariant under one-to-one transformations in the sense that the prior for a transformation is derived by the change of variables.

      However, we must be cautious: the Jeffreys prior for the Poisson rate is ∝ λ^{-1/2}. 

      Let's compute the posterior: 
        Likelihood: L(λ) = exp(-400λ) * (400λ)^0 / 0! = exp(-400λ)
        Prior: π(λ) ∝ λ^{-1/2}
        Posterior: π(λ | data) ∝ λ^{-1/2} * exp(-400λ)

      This is a Gamma distribution with shape = 0.5 and rate = 400? Actually, the Gamma density is ∝ λ^{a-1} exp(-bλ). So we have:
          a-1 = -1/2 => a = 1/2
          b = 400
      So the posterior is Gamma(shape=0.5, rate=400). This is proper because a>0 and b>0.

    **Step 6: Declare parameterization**
      We are using λ (rate in events per patient-year). The prior is π(λ) ∝ λ^{-1/2}.

    **Step 7: Institutional risk**? Not needed because we have a well-defined non-informative prior that yields a proper posterior.

    **What to report?**
      We are asked for the probability of the adverse event. If we interpret that as the probability of at least one event in one patient-year, that is 1 - exp(-λ). We can compute the posterior distribution of 1 - exp(-λ) by transforming the Gamma(0.5,400) posterior for λ.

      Alternatively, we might be asked for the rate λ. But note: the summary for the lay panel might be the expected rate? Or the probability that λ is below a threshold.

      However, note that the question says "put a number". We might be required to give a point estimate. The posterior mean for λ is a / b = 0.5 / 400 = 0.00125. Then the probability of at least one event in one year is about 0.00125 (because 1-exp(-0.00125)≈0.00125). 

      But wait, the posterior mean of λ is 0.5/400 = 0.00125. The posterior mean of 1-exp(-λ) is not exactly 1-exp(-0.00125). However, since λ is small, it is approximately λ.

      But note: we must be cautious. The posterior mean of λ is 0.00125. However, the posterior mode or median might be different. Also, we might be asked for the probability of the event per patient-year, which is 1-exp(-λ). The posterior mean of 1-exp(-λ) is E[1-exp(-λ)]. We can approximate it by 1 - E[exp(-λ)] = 1 - M_λ(-1), the moment generating function at t=-1. For a Gamma(α,β) (with shape α and rate β), the MGF is (1 + t/β)^{-α} for t>-β? Actually, the MGF for Gamma(α, β) (with rate β) is (1 - t/β)^{-α} for t<β. So at t=-1, we have (1 + 1/β)^{-α}. So:

          E[exp(-λ)] = (1 + 1/400)^{-0.5} = (401/400)^{-0.5} = (400/401)^{0.5} ≈ sqrt(0.9975) ≈ 0.99875

          Then E[1-exp(-λ)] ≈ 1 - 0.99875 = 0.00125.

      So the approximation is good.

      However, note that the prior we used is Jeffreys prior. But what if we had chosen a uniform prior on λ? Then prior would be ∝ 1, and the posterior would be Gamma(1, 400). The posterior mean of λ would be 1/400 = 0.0025, which is twice as large.

      Why choose Jeffreys? Because of the invariance under reparameterization? But note: the problem states that the prior must be non-informative. The Jeffreys prior is often recommended for scalar parameters. However, the uniform prior on λ is also sometimes used. But note: the uniform prior on λ is not uniform on log(λ) and it is not invariant under scale changes. The Jeffreys prior is invariant under reparameterization in the sense that if we reparameterize, we get the prior by the change of variables. However, the problem of the uniform prior on λ is that it leads to a different inference than the uniform prior on log(λ). 

      But our procedure requires invariance under the group of transformations that we identified (scale invariance). The Jeffreys prior for the Poisson rate is the one that is invariant under reparameterization, and it is also the reference prior. 

      However, note that the problem says "assume nothing", and the Jeffreys prior is the one that is invariant in the sense of information. 

      Therefore, we choose Jeffreys prior. The posterior mean is 0.00125.

      But note: the team might have drafted a number based on a uniform prior (which would be 0.0025). The procedure forbids that? Because the uniform prior is not invariant under scale changes. So we must use Jeffreys prior.

      **Answer for case 1**: The point estimate (posterior mean) for the rate λ is 0.00125 events per patient-year. The probability of at least one event in one patient-year is approximately 0.00125. We must use the Jeffreys prior.

      If the team has already drafted a number based on a uniform prior (which would be 0.0025), they must change it to 0.00125.

  ### Case 2: Between-site variance of a continuous outcome
  - **Parameter**: Between-site variance σ² (for a normal random-effects model). We assume we have data from multiple sites? But the problem does not specify the data. We are to put a prior on σ².

    **Step 1: Define the parameter space**
      σ² in (0, ∞)

    **Step 2: Key transformations**
      σ², σ (standard deviation), log(σ²), 1/σ² (precision)

    **Step 3: Symmetry and invariance**
      The variance is a scale parameter. If we change the units of the outcome (e.g., from meters to centimeters), the variance scales by the square of the factor. This suggests scale invariance. Also, in a normal random-effects model, the Jeffreys prior for the variance of a normal distribution is often discussed. However, note that the variance component in a random-effects model is more complex because we have multiple levels.

      For a single normal sample, the Jeffreys prior is π(σ²) ∝ (σ²)^{-1} (improper). But for a random-effects model with known overall mean, the Jeffreys prior for the between-site variance is also ∝ (σ²)^{-1}? Or ∝ (σ²)^{-2}? Actually, the literature suggests that the Jeffreys prior for a variance component in a one-way random effects model is π(σ²) ∝ (σ² + τ²)^{-1} where τ² is the within-site variance? But we don't have τ² known. So we must consider the joint prior.

      However, note that the problem is to put a prior on the between-site variance alone. We are not given any data? So we must assume that we are in the design stage? Or we have data but we are focusing on the prior for σ².

      Since the problem says "the between-site variance", and we are required to state a prior that "assumes nothing", we must consider the non-informative prior for the variance component.

      Common non-informative priors for variance components:
        - Uniform on σ²: π(σ²) ∝ 1
        - Uniform on σ: π(σ²) ∝ 1/σ   [because dσ = d(σ²)/(2σ) so the prior on σ² is proportional to the prior on σ times 1/(2σ)]
        - Uniform on log(σ²): π(σ²) ∝ 1/σ²
        - Jeffreys prior: for the one-way random effects model, the Jeffreys prior is π(σ², τ²) ∝ (τ² + σ² * k)^{-1} * (τ²)^{-(n0-k)/2} ... which is complicated. But if we assume that the within-site variance τ² is known, then the Jeffreys prior for σ² is ∝ (σ² + τ² / n_i)^{-1}? 

      Given the complexity, and the fact that we are only putting a prior on σ² and we are not given data, we must consider that we are in a context where we have no information. The most common non-informative priors for variance components are:
          π(σ²) ∝ 1/σ²   (which is uniform on log(σ²))

      Why? Because the log-scale is often considered natural for variances. Also, this prior is invariant under scale transformations (if we multiply the data by a constant, the variance is multiplied by the square, and the prior on the new variance is the same as the prior on the old variance after transformation).

      However, note that the Jeffreys prior for the variance of a normal distribution (for a single normal sample) is ∝ 1/σ²? Actually, for a normal distribution with unknown mean and variance, the Jeffreys prior is π(μ, σ²) ∝ 1/σ². But for a random-effects model, the Jeffreys prior is more complex.

      Given the time constraint and the level of the analyst, we choose the prior that is uniform on the log-variance: π(σ²) ∝ 1/σ².

      But note: this prior is improper, and we must check that the posterior is proper. Without data, we cannot have a posterior. But we are going to have data? The problem does not specify. We are just putting a prior for the submission.

      **Step 4: Data**? Not provided. We are only putting a prior.

      **Step 5: Select non-informative prior**
          We choose π(σ²) ∝ 1/σ².

      **Step 6: Declare parameterization**
          We are using σ² (variance). The prior is π(σ²) ∝ 1/σ².

      **Step 7: Institutional risk**? Not needed.

      However, note that there is an alternative: the uniform prior on σ. That would be π(σ²) ∝ 1/σ. This is also scale invariant? 

          Let η = log(σ²): then the prior is uniform on η? 
            If π(σ²) ∝ 1/σ², then the prior on η is: 
              π(η) = π(σ²) * |dσ²/dη| = [1/σ²] * [σ²] = 1  [since σ² = e^η, dσ²/dη = e^η = σ²]
            So indeed, uniform on η.

          If we use π(σ²) ∝ 1/σ, then the prior on η is:
              π(η) = [1/σ] * |dσ²/dη| = [1/sqrt(σ²)] * σ² = σ^{3/2} = e^{3η/2} -> not uniform.

          So the prior ∝ 1/σ² is the one that is uniform on the log scale.

          Why choose the log scale? Because variances are positive and multiplicative, so the log scale is natural.

      **Answer for case 2**: The prior for the between-site variance σ² is proportional to 1/σ². This is equivalent to placing a uniform prior on log(σ²).

      But note: the team might have drafted a prior that is uniform on σ². That would be different. The procedure requires the prior to be invariant under scale transformations (which the uniform on log(σ²) is). The uniform prior on σ² is not. So we must use 1/σ².

  ### Case 3: Annual decay rate extrapolated ten years beyond the trial
  - **Parameter**: Annual decay rate, let's denote it by β. We assume that the treatment effect decays exponentially. So if the treatment effect at time 0 is θ, then at time t (in years) it is θ * exp(-β t).

      We are to put a prior on β (in [0, ∞)).

      **Step 1: Define the parameter space**
          β ∈ [0, ∞)

      **Step 2: Key transformations**
          β, log(β), 1/β (which is the time constant, or the half-life? note: half-life = log(2)/β.

      **Step 3: Symmetry and invariance**
          The decay rate is a rate parameter. If we change the unit of time (from years to months), β becomes β/12? Then the half-life becomes 12 * (log(2)/β) -> multiplies by 12. So it's a multiplicative scale. This suggests scale invariance: the prior should be invariant under scaling of time. Therefore, we require the prior to be invariant under β -> β / k for k>0. This is achieved by a prior proportional to 1/β (which is uniform on log(β)).

      **Step 4: Data**? We have trial data, but we are extrapolating beyond the trial. The problem does not specify the trial data. We are only putting a prior.

      **Step 5: Select non-informative prior**
          We choose π(β) ∝ 1/β.

      **Step 6: Declare parameterization**
          We are using β (decay rate per year). The prior is π(β) ∝ 1/β.

      **Step 7: Institutional risk**? Not needed.

      However, note: the prior π(β) ∝ 1/β is improper. We must check that the posterior is proper when combined with the trial data. Without data, we cannot have a posterior. But we are going to have data? The problem says "extrapolated ten years beyond the trial", so we have trial data. We assume the trial data will be used to update the prior. We must ensure that the data are sufficient to yield a proper posterior.

      But the problem does not specify the data. We are only setting the prior.

      **Answer for case 3**: The prior for the decay rate β is proportional to 1/β.

      But note: the team might not like this because the prior is improper and heavy-tailed, and it might lead to a posterior that is also heavy-tailed. However, non-informative prior is what we are required to use.

      However, what if the team has already drafted a uniform prior on β? That would be π(β) ∝ 1. But that is not invariant under rescaling of time. So we must use 1/β.

      **The procedure forbids the uniform prior on β.**

  ### What the procedure cannot deliver
  - It cannot deliver a prior that is truly non-informative in all senses because non-informativeness is context-dependent and transformation-dependent.
  - It cannot guarantee that the posterior is proper without data (if the prior is improper, and no data are available, then the posterior is improper).
  - It cannot resolve cases where there are multiple competing symmetries (e.g., both additive and multiplicative) without a clear natural symmetry.
  - It cannot assign a prior for parameters that are not variation-independent without a full hierarchical model.

  ### Explanation to the lay panel (four sentences):
  "We understand that you require us to assume nothing about the parameter in question. However, every prior distribution we use must make some mathematical assumptions about the structure of the problem. For example, if we say that a rate could equally well be expressed per year or per month, that forces a specific form of prior. Therefore, we choose a prior that respects the natural symmetries of the problem, such as scale invariance, but we cannot avoid making these structural choices. We document these choices transparently to ensure clarity."
answer: |-
  ### Decision Procedure for Non-Informative Prior Selection  
  **Purpose**: Ensure priors are mathematically defensible, respect natural symmetries, and transparently encode assumptions. Avoid claims of "assuming nothing."  
  **Time Limit**: Each step ≤ 10 minutes (total ≤ 60 minutes).  
  **Analyst Skill Level**: One Bayesian course (understands priors, posteriors, transformations).  

  #### Step-by-Step Procedure:
  1. **Define the Parameter Space**  
     - **Question**: What is the parameter? What are its plausible bounds?  
     - **Sufficient Answer**: Declare the parameter (e.g., probability \(p\), variance \(\sigma^2\), rate \(\lambda\)) and its domain (e.g., \([0,1]\), \([0,\infty)\)).  
     - **Stop If**: Bounds are unknown or infinite, and no data exists to constrain them. Log: *"Indifference unavailable: Unbounded parameter with no data."*  

  2. **Identify Natural Symmetries**  
     - **Question**: Which transformations preserve the problem’s structure?  
     - **Sufficient Answer**: State invariance requirements:  
       - *Probabilities*: Symmetry under \(p \to 1-p\) (if applicable).  
       - *Variances/Rates*: Scale invariance under \(x \to cx\) (e.g., unit changes).  
       - *Time-decay*: Reparameterization invariance (e.g., rate \(\lambda\) vs. half-life \(\log(2)/\lambda\)).  
     - **Stop If**: No natural symmetry (e.g., conflicting transformations). Log: *"Indifference unavailable: No unique symmetry."*  

  3. **Select Non-Informative Prior**  
     - **Criteria**: Prior must be:  
       - **Invariant** under symmetries from Step 2.  
       - **Proper or yield proper posterior** (check analytically).  
       - **Declared in base parameterization** (e.g., \(\sigma^2\), not \(\sigma\)).  
     - **Rules**:  
       - *Bounded (e.g., \(p \in [0,1]\))*: Use Haldane prior (\(\text{Beta}(0,0)\)) if symmetry under \(p \to 1-p\). Else, Jeffreys prior (\(\text{Beta}(0.5, 0.5)\)).  
       - *Unbounded positive (e.g., \(\sigma^2, \lambda \in (0,\infty)\))*: Use scale-invariant prior \(\pi(\theta) \propto 1/\theta\) (uniform on \(\log \theta\)).  
     - **Stop If**: Prior is improper and data is insufficient for proper posterior. Log: *"Indifference unavailable: Improper prior with no data."*  

  4. **Institutional Risk Review**  
     - **Handoff to Person**: If prior choice affects risk (e.g., heavy tails exaggerate rare events), escalate to senior modeller.  
     - **Criteria**:  
       - Requires judgment on conservatism (e.g., priors for safety endpoints).  
       - Document: *"Prior selected by [Name] reflecting institutional risk tolerance on [Date]."*  

  5. **Documentation**  
     - **Record**: Parameterization, invariance, prior form, and any handoffs.  
     - **Plain-Language Summary**: Avoid "assumed nothing." State: *"We used a prior that equally weights all scales/orders of magnitude, consistent with natural symmetries in the problem."*  

  ---

  ### Application to Cases  
  **Assumptions**: No existing data beyond stated; analysts must justify priors.  

  #### Case 1: Adverse Event Rate (0 events in 400 patient-years)  
  - **Step 1**: Parameter = adverse event rate \(\lambda\) (events per patient-year). Domain: \([0, \infty)\).  
  - **Step 2**: Natural symmetry = **scale invariance** (unit changes: e.g., years to months).  
  - **Step 3**: Prior must be scale-invariant \(\implies \pi(\lambda) \propto 1/\lambda\).  
    - Check propriety: Posterior \(\propto \lambda^{-1} \times e^{-400\lambda}\) (Gamma(0, 400)) is proper.  
    - **Base parameterization**: \(\lambda\).  
  - **Step 4**: No risk handoff (symmetric scale invariance).  
  - **Result**: Prior \(\pi(\lambda) \propto 1/\lambda\). Posterior mean \(\lambda = \int_0^\infty \lambda \cdot \text{Gamma}(\lambda \mid 0, 400)  d\lambda\) is undefined (prior too heavy-tailed). Use **posterior mode** (maximize likelihood): \(\lambda = 0\).  
  - **Team’s Draft**: Likely used uniform prior (\(\pi(\lambda) \propto 1\)), giving posterior mean \(\lambda = 1/400 = 0.0025\).  
  - **Procedure Forbids This**: Uniform prior violates scale invariance.  
  - **Submit Instead**:  
    - *Estimate*: \(\lambda = 0\) (with note: "Zero observed events; most plausible rate is 0").  
    - *Uncertainty*: 95% credible interval via posterior quantiles (e.g., \(\text{Gamma}(0, 400)\) quantiles).  

  #### Case 2: Between-Site Variance (\(\sigma^2\)) of Continuous Outcome  
  - **Step 1**: Parameter = variance \(\sigma^2\). Domain: \([0, \infty)\).  
  - **Step 2**: Natural symmetry = **scale invariance** (outcome unit changes, e.g., meters to cm).  
  - **Step 3**: Prior must be scale-invariant \(\implies \pi(\sigma^2) \propto 1/\sigma^2\) (uniform on \(\log \sigma^2\)).  
    - Check propriety: Requires data. If no sites, posterior improper \(\implies\) **Stop**.  
  - **Result**: Log: *"Indifference unavailable: Improper prior with no site-level data."*  
  - **Team’s Draft**: Likely used \(\pi(\sigma^2) \propto 1\) (uniform), violating scale invariance.  
  - **Submit Instead**:  
    - Use weakly informative prior (e.g., half-Cauchy) or collect data.  
    - Document: *"Insufficient data for non-informative prior; used conservative prior per institutional policy [Ref]."*  

  #### Case 3: Annual Decay Rate (\(\beta\)) Extrapolated 10 Years Beyond Trial  
  - **Step 1**: Parameter = decay rate \(\beta\) (per year). Domain: \([0, \infty)\).  
  - **Step 2**: Natural symmetry = **scale invariance** (time-unit changes: e.g., years to days).  
  - **Step 3**: Prior must be scale-invariant \(\implies \pi(\beta) \propto 1/\beta\).  
    - Check propriety: With trial data, posterior usually proper.  
  - **Result**: Prior \(\pi(\beta) \propto 1/\beta\).  
  - **Team’s Draft**: Likely used \(\pi(\beta) \propto 1\) (uniform), giving equal weight to all rates (e.g., \(\beta=0.1\) vs. \(\beta=10\)).  
  - **Procedure Forbids This**: Uniform prior implies \( \beta=10 \) is 100x more plausible than \( \beta=0.1 \), violating scale invariance.  
  - **Submit Instead**:  
    - Use \(\pi(\beta) \propto 1/\beta\). For extrapolation, report **median decay** (less sensitive to tails) from posterior.  

  ---

  ### What the Procedure Cannot Deliver  
  1. Truly "non-informative" priors (all priors imply assumptions via parameterization).  
  2. Objectivity when symmetries conflict (e.g., probability \(p\) vs. log-odds).  
  3. Proper posteriors with improper priors and no data.  
  4. Risk-neutral decisions (institutional input required for conservatism).  

  ### Explanation for Lay Panel (4 Sentences)  
  "We are required to state a prior that 'assumes nothing,' but mathematics forces choices. For example, treating a parameter per 'year' versus per 'month' implies different weights for the same evidence. We use priors that treat all scales equally (e.g., 0.1 vs. 10 is like 1 inch vs. 1 mile), ensuring fairness. Thus, we document these scale-invariant choices transparently—no prior can ever assume nothing."
