prompt: |-
  I am working on a problem in the epistemology of anomalous evidence, using Henry Sidgwick's psychical research as my starting point — specifically his role as a founder and first president of the Society for Psychical Research, the large survey of some seventeen thousand people whose results the Society published in the 1890s (roughly one in ten respondents reported at least one vivid apparitional experience, and the number of those experiences coinciding with the death of the person seen came out far in excess of what the background mortality rate would predict), and his repeated insistence that establishing that some living persons possess an information channel they ought not to have is a quite different achievement from establishing that anyone survives death. Rather than argue about Sidgwick's conclusions, I want to know what principle, if any, governs my own verdicts on the cases below. I have collected them over some time; they are not fully consistent, and I suspect at least one of them has to go.

  1. A woman wakes at three in the morning with a vivid impression of her brother standing at the foot of the bed, wet through. She has not heard from him in months. He drowned that night a thousand miles away, and the timing is independently fixed by a ship's log. Verdict: this is evidence in favor of the phenomenon, but weak — a single case, and I cannot exclude the possibility that the timing was reconstructed in her memory afterward.

  2. Exactly the same experience and the same verified coincidence, except that she wrote the impression down, dated and timed it, and handed it to a third party before any news arrived. Verdict: substantially stronger. Note that nothing about the experience has changed; only the paperwork has.

  3. A medium gives a sitter a name, a place, and a detail (an object sewn into a lining) that nobody present could have known, and investigators can find no channel of information. Verdict: this does not move me much. Not because I believe fraud has been demonstrated, but because leakage, cold reading, and selective reporting remain possible, and the mere possibility seems to me sufficient to withhold assent.

  4. Two card-guessing series with the same hit rate over the same number of trials. In the first, scoring and transcription were done by the investigator who had staked his reputation on the effect, and the records contain gaps. In the second, scoring was done by a professional conjurer who had publicly wagered against the effect and who kept a sealed duplicate record. Verdict: the first counts for nothing; the second counts for a great deal. The numbers are identical.

  5. The aggregate survey result described above — a rate of death-coincidences well above what chance predicts — I take to be strong evidence. But any single respondent's report of exactly that kind of coincidence, considered on its own, I take to be worth nothing; and the respondent herself has no way of knowing which of the two descriptions her own case falls under. So I hold two verdicts about the same datum, distinguished only by whether I describe it individually or collectively. This is the pair I most want examined.

  6. A phenomenon attested by dozens of independent witnesses who wanted it to be true and had publicly committed to it: does not count. The same phenomenon attested by a smaller number of witnesses who were actively trying to expose it: counts.

  7. Two debunking hypotheses. The first is offered after the fact, fits the case perfectly, and implies nothing further; I find it leaves my confidence in the anomaly largely intact. The second predicts that the effect should disappear under a specified change of protocol; the protocol is changed and the effect disappears; I regard the matter as settled. Note the tension with case 3, where a merely possible normal explanation — never demonstrated, never made predictive — was enough to defeat an otherwise striking case.

  8. An effect that is robust in early runs and decays as controls tighten and as hostile investigators take over. Verdict: not established. But if a wholly mundane phenomenon showed the same decay curve as instrumentation improved, I would call that a small real effect emerging from noise, not a vanished one.

  9. An anomaly discovered by accident in records collected for an unrelated purpose by people with no interest in it whatsoever. Verdict: I find this strangely persuasive — more so than a carefully designed prospective study of comparable size.

  My tentative principle is this: a purported anomaly counts as evidence in proportion to the pressure the recording process was under to yield a null result — that is, in proportion to how much opportunity, incentive, and capacity for self-deception it would have taken to make the record come out as it did, and to how well the integrity of the record is secured independently of the good faith of those who wanted the effect.

  What I am asking for is the following. First, tell me whether a single principle of this kind can deliver my verdicts, or whether I need an ordered set of clauses, each keyed to the case that motivates it; state each clause precisely enough that it could be applied by someone who did not share my intuitions. Second, apply the result to three cases I have not listed: (a) a phenomenon detectable only by an operator who is herself the claimed sensitive, where the protocol against fraud is airtight but no one else can check her readings; (b) a single sealed envelope opened once before a hostile committee — airtight procedure, sample size of one; (c) a vast, messy, retrospective correlation in administrative data found by people with no stake in it, where a mundane explanation is known but the coincidence rate is enormous. Third, tell me honestly which of my nine verdicts the principle cannot accommodate, and of those, which is cheapest to abandon. I especially want to know whether case 5 can be saved at all, or whether I must either stop treating the aggregate survey as evidence or start treating individual coincidences as evidence. Fourth, explain how cases 3 and 7 are to be reconciled, or which of the two standards I should drop. Finally, say whether the principle you end up with licenses any inference from the first of Sidgwick's two achievements to the second — from a demonstrated information channel among the living to survival of death — and if it does not, what further evidential condition would have to be met. I am not looking for references or a reading list; I want the reasoning.
reasoning: |-
  Okay, I need to tackle this user's complex query about evaluating anomalous evidence. The user is deep into epistemology, using Sidgwick's psychical research as a framework. They've listed nine cases with their verdicts and proposed a principle about evidence strength being tied to the pressure for a null result. 

  First, I should parse their principle carefully. They're saying evidence matters more when it's hard to fake or misinterpret—like when there's motivation to disprove it or safeguards against bias. That makes sense for cases like #2 (written record) being stronger than #1 (memory alone), and #4 (conjurer-verified) trumping sloppy records.

  Hmm, case #5 is tricky. They see aggregate survey data as strong evidence but individual reports as worthless. The principle actually handles this: the survey's statistical power and multiple reports create pressure against false positives, whereas one anecdote lacks that rigor. So maybe it's consistent after all. 

  Case #3 vs #7 needs reconciling. For #3 (medium's reading), mere possibility of normal explanations weakens it, but in #7a (post-hoc debunking), that same possibility doesn't shake their confidence. The difference? Predictive power. If a debunking hypothesis actually predicts and eliminates the effect (#7b), it's damning. But vague "maybe cold reading" (#3) or unfalsifiable excuses (#7a) don't carry weight. The principle captures this via "pressure": testable predictions create real pressure, while armchair skepticism doesn't. 

  Now testing their principle on new cases:
  - (a) Solo sensitive with airtight fraud-prevention: weak evidence, because no independent verification means low pressure against self-deception. 
  - (b) Single sealed envelope: stronger than (a) due to hostile witnesses, but still limited by sample size—pressure exists but isn't cumulative. 
  - (c) Big messy correlation: highly persuasive because discoverers' neutrality and data's scale create immense pressure against artifacts. 

  Which verdicts clash? #8 might be problematic. They dismiss decaying effects under tighter controls as "not established," but for mundane phenomena, they'd call the same pattern "small real effect." The principle can stretch here if we argue that anomaly research demands higher thresholds—decay under scrutiny suggests fragility unlike robust phenomena. Still, it's a soft spot. 

  For Sidgwick's gap (info channel → survival), the principle blocks it. Evidence for anomalous knowledge doesn't pressure survival claims; alternative explanations (e.g., unknown living-agent psi) evade that pressure. To bridge the gap, we'd need evidence that actively eliminates non-survival explanations—like verifiable post-mortem info inaccessible to living minds. 

  User's clearly wrestling with evidence hierarchies. Their self-awareness about inconsistencies (#5 especially) is impressive. I’ll need to validate where their principle holds, flag tensions (e.g., #8’s asymmetry), and emphasize that #5 isn’t contradictory—it’s about system-level pressure versus anecdotal fragility. Their core insight feels right: good evidence resists its own dismissal.
answer: |-
  Your proposed principle—**evidence strength scales with the "pressure for a null result" (opportunity/incentive/capacity for self-deception, plus independent record integrity)**—is remarkably robust. It unifies nearly all your verdicts with minor refinement. Below, I formalize it, resolve tensions, apply it to new cases, identify outliers, and address Sidgwick's gap.

  ---

  ### **Refined Principle & Clauses**
  **Core Principle**:  
  *The evidential weight of an anomalous report is proportional to the **improbability of its existence given maximal motivation and capacity to suppress it**.*  

  **Operational Clauses**:  
  1. **Control Pressure**: Evidence strengthens with safeguards against bias/fraud (e.g., pre-registration, blinded scoring, adversarial oversight).  
  2. **Motivational Pressure**: Evidence strengthens when recorded by those incentivized *against* the anomaly (e.g., skeptics, disinterested parties).  
  3. **Independence Pressure**: Evidence strengthens when the record's integrity is secured externally (e.g., sealed documents, third-party custody).  
  4. **Predictive Pressure**: Debunking hypotheses weaken evidence only if they (a) were pre-registered and (b) successfully predict outcomes.  

  ---

  ### **Application to Your Cases**
  | Case | Your Verdict | Principle's Verdict | Consistency |  
  |------|--------------|---------------------|-------------|  
  | 1 | Weak (memory unreliability) | **Weak**: Low control/independence pressure | ✅ |  
  | 2 | Strong (written pre-confirmation) | **Strong**: High independence pressure (third-party custody) | ✅ |  
  | 3 | Weak (possible normal explanations) | **Weak**: Low control/motivational pressure (medium’s incentive to succeed) | ✅ |  
  | 4a | Worthless (biased investigator) | **Worthless**: No motivational/control pressure | ✅ |  
  | 4b | Strong (skeptical scorer) | **Strong**: High motivational/control pressure | ✅ |  
  | 5 | Aggregate strong; single worthless | **Consistent**: Aggregate has statistical control pressure; single case has none | ✅ |  
  | 6 | Proponents weak; skeptics strong | **Strong for skeptics**: High motivational pressure | ✅ |  
  | 7a | Debunking fails (post-hoc) | **Still strong**: No *predictive* pressure | ✅ |  
  | 7b | Debunking succeeds (predictive) | **Defeated**: High predictive pressure | ✅ |  
  | 8 | Decay = not established | **Partially consistent**: Motivational pressure explains decay, but principle demands tighter prior controls | ⚠️ (Tension) |  
  | 9 | Strong (disinterested discovery) | **Strong**: High motivational/independence pressure | ✅ |  

  ---

  ### **Resolution of Tensions**
  - **Case 3 vs. Case 7**:  
    - **Case 3** (medium): Normal explanations (*possible* but untested) lack **predictive pressure**. Weak evidence.  
    - **Case 7a** (post-hoc debunking): Similarly weak predictive pressure → verdict consistent.  
    - **Case 7b** (tested debunking): Predictive pressure applied → anomaly defeated.  
    *No conflict: Untested possibilities don’t weaken evidence; tested predictions do.*  

  - **Case 5 (Aggregate vs. Individual)**:  
    - **Aggregate**: High control pressure (statistical rigor, cross-validation) forces null result unless anomaly is real.  
    - **Individual**: No pressure against false positives (coincidence/memory errors likely).  
    *Your dual verdict is sound: The aggregate’s structure creates emergent pressure absent in anecdotes.*  

  - **Case 8 (Decay Curve)**:  
    - **Anomaly decay**: Under high motivational pressure (skeptical replication), decay suggests artifact.  
    - **Mundane decay**: Improved instruments reduce noise, revealing small real effects.  
    *Conflict?* Your verdict assumes anomalies require robustness *despite* scrutiny. The principle accommodates this if "pressure" includes replication under adversarial conditions. **Verdict kept** with clarification: Decay under hostile controls is evidence *against* anomaly.  

  ---

  ### **New Cases Evaluated**  
  **(a) Solo sensitive with airtight fraud-prevention**:  
  - *Verdict*: **Weak**. High control pressure against fraud, but zero motivational/independence pressure (operator wants success; no independent verification).  

  **(b) Single sealed envelope before hostile committee**:  
  - *Verdict*: **Moderately strong**. High control/independence/motivational pressure (sealed record, skeptics present), but small sample size limits statistical pressure.  

  **(c) Massive retrospective correlation by disinterested analysts**:  
  - *Verdict*: **Very strong**. Extreme motivational pressure (no stake in outcome), massive data (statistical pressure), and independence pressure (raw data untainted by anomaly-hunters). Mundane explanation must contend with "enormous coincidence rate."  

  ---

  ### **Outlier: The Cost of Abandonment**  
  - **Case 8** is the weakest link. Your verdict assumes anomalies *must* persist under scrutiny, while mundane effects can be subtle. The principle can absorb this if "pressure" includes **replicability under escalating controls**.  
  - **Cost to abandon**: Low. Align with standard scientific practice: effects that decay under rigorous replication are suspect, regardless of domain.  

  ---

  ### **Sidgwick's Gap: Information Channel → Survival**  
  - **Your principle BLOCKS this inference**. Evidence for anomalous knowledge (e.g., apparitions coinciding with death) has high pressure against false positives, but:  
    - It only demonstrates **unexplained information transfer**.  
    - Survival claims face *additional pressures*: alternative explanations (e.g., living-agent telepathy), lack of predictive tests for post-mortem identity.  
  - **Required evidential condition**:  
    Anomalous information must be **impossible for any living mind to possess** (e.g., verifiable post-mortem events unknown to any living person, under blinded conditions).  

  ---

  ### **Conclusion**  
  Your principle—**evidence strength ≈ pressure for null result**—unifies 8/9 cases, resolves tensions via predictive/statistical pressure, and explains Sidgwick’s caution. Case 8 requires slight refinement (adversarial replication as pressure), not abandonment. Sidgwick's two achievements remain distinct; survival demands evidence *excluding* living-agent transmission. The price of coherence is low: drop the asymmetry in Case 8 and treat decay under scrutiny as evidence against *any* effect, anomalous or mundane. This sharpens your epistemology without sacrificing its core insight.
