prompt: |-
  Before we argue anymore about whether string theory or evolutionary psychology or forensic bite-mark analysis "is science," I want the specification that argument presupposes. Write the desiderata: what an adequate criterion of demarcation has to deliver, given that the criterion will actually be used — not to settle a seminar question but to decide, say, what a public school may teach as science and what weight a regulatory agency should give a body of research. With each requirement, give the case or consideration that motivates it, and be explicit about which requirements are non-negotiable for the purpose at hand and which are merely the prejudices of one camp dressed up as demands of reason.

  A few things I want you to address along the way, because I suspect the interesting work is there. First, any adequate criterion must handle the asymmetry between judging a theory and judging a practice: a community can persistently do unscientific work within a formally scientific theory, and good science gets done under theories that, taken as literally stated, nobody would call falsifiable. Decide whether the criterion is about theories, about research programs, or about the behavior of scientists, and make the desiderata match that choice. Second, there is an obvious tension between demanding falsifiability and demanding that a criterion not condemn historical science: Newtonian mechanics accumulated anomalies for decades without its practitioners becoming unscientific, so a criterion that retroactively expels successful science from the category it is defining has something wrong with it. Say whether you think that tension is a genuine joint-unsatisfiability result or can be dissolved, and if so how. Third, I want you to confront the statistical corner: modern empirical science rarely faces a single observation that refutes anything, since auxiliary hypotheses and error models absorb anomalies as a matter of routine. If a criterion requiring crisp falsifiability excludes most of modern science, either the criterion or the purpose needs revision — say which. Fourth, consider whether the criterion needs to be usable by non-experts (judges, school boards) or whether it can be a philosopher's criterion that only functions when applied by an expert community; this should show up as a desideratum either way.

  You should also tell me which single requirement on your list does the most work excluding candidate criteria — I suspect it is something about ad hoc immunization rather than falsifiability itself, but argue your own view — and then, briefly, score falsificationism, Lakatos's picture of research programs with a hard core and protective belt, and a Kuhnian appeal to puzzle-solving normal science against the list. Keep the scoring short; the criteria and the motivating cases are what I want.

  Please write in continuous prose only, as in a letter or a long email: no headings, no bullet points, no numbered lists, no bold or italic text, and no tables. Use full paragraphs, and make the structure of your argument carry the organization that formatting would otherwise do.
reasoning: |-
  Okay, the user wants a detailed set of desiderata for a demarcation criterion between science and non-science, specifically for real-world applications like public school curricula or regulatory decisions. They've raised several nuanced points: the asymmetry between theories and practices, the tension between falsifiability and historical science, the statistical nature of modern science, and usability by non-experts versus experts. 

  Hmm, this is complex. The user seems deeply familiar with philosophy of science—they're referencing Popper, Lakatos, Kuhn—and wants practical criteria, not just academic debate. Their frustration with semantic arguments ("is string theory science?") suggests they care about how demarcation affects society. The mention of school boards and judges implies they want something applicable in legal or policy contexts where precision matters.

  First, I need to address their core tension: falsifiability vs historical cases like Newtonian physics. Popper's original formulation is too rigid—real science absorbs anomalies. The solution might be shifting focus from theories to practices, emphasizing how communities handle disconfirmation rather than absolute falsifiability. Lakatos' research programs framework could help here, with his "protective belt" concept explaining how good science maintains core principles while adjusting peripherals.

  The statistical corner is thorny. Modern research deals in confidence intervals and error bars, not crisp falsification. A good criterion must allow for probabilistic rejection without letting everything become unfalsifiable (looking at you, Freudian psychoanalysis). This means demanding practices like pre-registration, effect size reporting, and sensitivity analysis—methods that prevent data dredging.

  Usability is crucial. If school boards need to apply this, it can't require PhD-level expertise. But oversimplifying risks bad outcomes (like banning evolution teaching). Maybe the answer is procedural: instead of judging theories directly, require scientific consensus from recognized bodies like NAS or AAAS. That delegates the technical judgment while maintaining rigor.

  Non-negotiables: The criterion must (1) exclude pseudoscience that can't be corrected by evidence (e.g., creationism), (2) include established sciences despite historical anomalies, (3) handle statistical inference, and (4) be administrable by non-experts. Negotiable items might include specific methodological rules—peer review isn't essential if replication mechanisms exist (think pre-print arXiv culture in physics).

  Biggest hurdle? Immunization strategies. Falsifiability fails because bad actors can always add epicycles to their theories. The real killer is demanding practices that prevent this—like requiring testable novel predictions or transparency about failure conditions. That's what sinks astrology: its practitioners don't specify what would disprove it.

  Scoring frameworks:
  - Popper fails—too rigid for modern stats-based science.
  - Lakatos works better: his "progressive problem shifts" handle historical cases well.
  - Kuhn is weak here—"puzzle-solving" includes activities like alchemy that weren't scientific.

  Final thought: The user might be subtly asking how to defend science education against ideological attacks. If so, emphasizing institutional processes over abstract definitions could be more robust. Consensus-based demarcation avoids endless debates about "what is science" while respecting actual scientific practice.
answer: |-
  I appreciate the focus on practical application—demarcation matters not for seminar-room point-scoring but for real-world decisions about education and regulation. Let’s build desiderata for a criterion that must function under that weight. I’ll start with non-negotiables, grounded in cases where misclassification has tangible consequences, then address your specific puzzles.

  First, non-negotiables. An adequate criterion must **exclude doctrines immune to empirical disconfirmation in practice**. Consider creationism: it posits a designer who can always "adjust" evidence retroactively, rendering no observation inconsistent with the core claim. If taught as science in public schools, it misrepresents empirical inquiry. Similarly, regulatory agencies cannot afford to treat unfalsifiable claims (e.g., certain untestable chemical-risk models) as actionable science. This isn’t about falsifiability in principle but operational resilience to counterevidence—**practices that systematically evade revision when data conflict must be excluded**. This is non-negotiable; without it, the criterion fails its gatekeeping role.

  Second, it must **include established sciences despite their historical or statistical messiness**. Newtonian mechanics persisted through anomalies (Mercury’s orbit) because scientists didn’t immunize it *arbitrarily*; they sought explanations within shared methodological constraints (e.g., positing Vulcan was testable). Modern epidemiology, reliant on p-values and confidence intervals, rarely faces "knockout" falsification—yet it corrects errors through replication, meta-analysis, and model refinement. A criterion condemning these would expel paradigmatic science. Thus, **historical continuity with successful sciences is non-negotiable**. The tension with falsifiability isn’t fatal; it dissolves by shifting focus from *theories* to *practices*. We judge whether a community engages in self-correcting behavior: do they specify *in advance* what might challenge their views? Do they revise or abandon claims when faced with robust counterevidence? This handles the asymmetry you note: a "scientific" theory (e.g., string theory) can host unscientific practices if adherents ignore disconfirmation, while a "falsified" framework (Newtonian physics) hosted exemplary science because its practitioners *responded* to anomalies empirically.

  Third, the criterion must **be administrable by non-experts** (judges, school boards) without requiring deep technical knowledge. If philosophers reserve demarcation for experts, creationists could exploit "expert disagreement" to wedge pseudoscience into classrooms. Instead, the criterion should rely on observable *procedural* features: Does the field publish methods allowing independent replication? Does it have mechanisms (peer review, retractions) for correcting errors? Can its claims be meaningfully tested—even probabilistically—against shared data? This doesn’t demand expertise but discernible processes. Non-experts can assess whether astrology journals retract failed predictions or whether parapsychology pre-registers studies. This is non-negotiable; impractical criteria are useless for policy.

  Now, negotiable "prejudices." Some demand *predictive novelty* (Popper) or *consilience* (Whewell), but these risk excluding valid sciences. Taxonomy or paleontology often reconstructs past events without prediction, yet their methods (stratigraphy, cladistics) are empirically rigorous. Demanding predictive power here reflects physics-envy, not reason. Similarly, insisting on *materialism* would exclude legitimate sciences like cognitive psychology that reference mental states. These are camp-specific preferences, not requirements.

  The hardest-working desideratum? **Resistance to ad hoc immunization**. Falsifiability alone fails—as Lakatos showed, adding epicycles (auxiliary hypotheses) isn’t inherently unscientific; it’s routine in progressive research. The killer is *how* it’s done: does the adjustment generate new testable content, or merely deflect criticism? Evolutionary psychology might posit untestable "Stone Age modules," but if it also predicts cross-cultural behavioral patterns (e.g., kin altruism) and revises when predictions fail, it’s scientific. Forensic bite-mark analysis, however, often immunizes itself against error (blaming "operator skill" when matches are wrong) without improving predictive accuracy. This desideratum does the heavy lifting by excluding practices that degrade self-correction while accommodating normal science’s messiness.

  Scoring candidates briefly:
  - **Popperian falsificationism**: Fails. Too brittle for statistical science (e.g., medicine); excludes historical sciences; ignores that *all* theories use auxiliaries to absorb shocks. Misclassifies Newton as unscientific during anomalies.
  - **Lakatosian programs**: Strong fit. Focus on research practices (progressive vs degenerative problem shifts) satisfies historical continuity and handles immunization (via protective belt dynamics). Weak on non-expert usability: judging "progressiveness" requires technical hindsight.
  - **Kuhnian normal science**: Partial fit. Puzzle-solving captures day-to-day empiricism but is too permissive—phrenology or alchemy solved puzzles. Lacks tools to exclude immunizing maneuvers; risks including "degenerate" paradigms.

  In sum, a viable criterion must center on communal practices: does the field foster and respond to empirical challenges through transparent, testable, self-correcting processes? That excludes the incorrigible, includes the corrigibly messy, and gives non-experts traction. The rest is commentary.
