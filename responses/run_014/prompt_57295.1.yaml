  - Step 4: reject because (1) and (2) do care about the rationality of the later credence for the Dutch book to be a threat to rationality.
  - Step 5: keep in the sense that it is absurd to require Reflection in that case, but we avoid that by restricting.
  - Step 6: reject because we don't have to abandon (1); we just restrict it.
  - Step 7: reject the conclusion because we still have diachronic constraints for rational future credences.

  But note: step (5) is an assertion about the absurdity, which we agree with, but we avoid the absurdity by restricting. So we can say we keep step (5) in that the scenario is absurd, but we don't get there because we reject step (4).

  In the steps array, we'll go by the step numbers and give verdicts.

