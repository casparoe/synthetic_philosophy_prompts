prompt: |-
  I cover science and ideas, and I'm preparing a piece on why groups so often reach a conclusion their own members would reject. Before I weigh any specific proposal, I want the standard of evaluation itself. Write out the full list of desiderata that a theory of collective judgment — a rule that converts a set of individually consistent judgments about a collection of propositions into a set of group judgments — must satisfy to count as adequate, with the case behind each requirement: why it must accommodate any combination of rational individual views rather than only the well-behaved ones (universal domain); why the group's verdict on a given proposition should depend only on how individuals voted on that proposition (independence); why it cannot simply track one member's judgment (non-dictatorship); why it must respect unanimity; and why the group's own judgments must be logically consistent (deductive closure). Mark which of these are non-negotiable and which are the preferences of a particular camp, and — the part I most want to see — identify the subset that is jointly unsatisfiable and explain how the discursive dilemma, in which a court voting separately on each legal element ends up with a majority on the elements that implies a verdict the majority directly rejected, is the concrete face of that tension. Then, briefly, how premise-based voting and conclusion-based voting each do against the list. Begin with the list itself, with no preface or commentary.
reasoning: |-
  We are to list the desiderata for a theory of collective judgment. The requirements are:

  1. **Universal Domain**: The rule must be able to accommodate any possible combination of individually rational (i.e., logically consistent) judgments from the group members. The reason is that we cannot restrict the range of admissible individual views arbitrarily; any group of rational individuals might hold any set of consistent views, and the group should be able to aggregate them.

  2. **Independence**: The group's judgment on a given proposition should depend only on the individual judgments on that same proposition and not on judgments about other propositions. The reason is that we want the group's view on a matter to be grounded solely in the members' views on that matter, without being influenced by potentially unrelated opinions.

  3. **Non-Dictatorship**: The group judgment must not simply be the judgment of one fixed individual (the dictator), regardless of the others. The reason is that collective judgment should reflect the group as a whole, not just one member.

  4. **Unanimity**: If every member of the group holds the same judgment on a proposition, then the group must hold that judgment. The reason is that if everyone agrees, the group should too.

  5. **Deductive Closure**: The group's judgments must be logically consistent. That is, if the group's judgments on some propositions logically entail a judgment on another proposition, then the group must also hold that entailed judgment. The reason is that the group's collective view should be rational and coherent.

  Now, we mark which are non-negotiable and which are the preferences of a particular camp:

  - **Non-negotiable**: Typically, universal domain, non-dictatorship, unanimity, and deductive closure are considered fundamental. However, the independence condition is also often included as non-negotiable in the standard setup of the discursive dilemma. But note that the impossibility result (discussed below) shows that not all can be satisfied at once.

  - **Preferences of a particular camp**: The requirement for independence is sometimes relaxed by some approaches (like premise-based voting) in order to achieve consistency. Similarly, deductive closure might be relaxed in conclusion-based voting. But in the classic formulation, all five are presented as desirable, and the impossibility theorem (like the one by List and Pettit) shows that they cannot all be satisfied simultaneously.

  **The Impossibility**: The set of desiderata that is jointly unsatisfiable is: universal domain, independence, non-dictatorship, unanimity, and deductive closure. This is the essence of the discursive dilemma.

  **The Discursive Dilemma**: Consider a court case with three judges (A, B, C) and three propositions: P (e.g., a contract was valid), Q (e.g., the defendant had a duty), and the conclusion R (e.g., the defendant is liable), where R is equivalent to (P and Q). Suppose the individual judgments are:

  - Judge A: P true, Q true, R true.
  - Judge B: P true, Q false, R false.
  - Judge C: P false, Q true, R false.

  Now, if we vote independently on each proposition (by majority):
  - P: true (A and B say true, C false -> majority true)
  - Q: true (A and C say true, B false -> majority true)
  - R: false (B and C say false, A true -> majority false)

  But note that R is equivalent to (P and Q). The majority on the premises (P true and Q true) entails R true. However, the majority on R is false. Thus, the group judgments are inconsistent: they have P true, Q true, and R false, which is logically inconsistent.

  This dilemma illustrates the tension: we have satisfied universal domain (any consistent individual judgments), independence (we voted on each proposition separately), non-dictatorship (no one dictates), and unanimity (if there were unanimity we would have it). But we failed deductive closure because the set {P, Q, ¬R} is inconsistent with the logical constraint that R = P∧Q.

  **How Premise-Based and Conclusion-Based Voting Fare**:

  - **Premise-Based Voting**: We vote on the premises (P and Q) and then derive the conclusion (R) from the group's judgments on the premises. In the example, we get P true and Q true, so R true. This satisfies deductive closure and non-dictatorship, and it respects unanimity. However, it violates independence because the group judgment on R is determined by the votes on P and Q (and the logical connection) rather than by independent voting on R. Also, it may not respect the individual votes on R if we were to vote on it independently.

  - **Conclusion-Based Voting**: We only vote on the conclusion (R) and ignore the premises. In the example, we would get R false. This satisfies independence (only R is voted on) and non-dictatorship. But it fails deductive closure because we do not have judgments on the premises and we cannot check consistency. Also, it does not use the information about the premises and may lead to a conclusion that is not supported by the premises as judged by the group. Unanimity is respected for the conclusion, but we lose the ability to have a collective view on the premises.

  In summary, the standard desiderata are incompatible, as shown by the discursive dilemma. Premise-based voting sacrifices independence to get consistency, while conclusion-based voting sacrifices having collective judgments on the premises (and thus deductive closure) to get independence on the conclusion.
answer: |-
  ### Desiderata for a Theory of Collective Judgment

  1. **Universal Domain**  
     - **Requirement**: The rule must accommodate any logically consistent set of individual judgments on the propositions.  
     - **Case**: Rational individuals may hold any combination of consistent views (e.g., due to differing evidence, values, or reasoning). Restricting inputs arbitrarily would exclude legitimate perspectives and undermine the rule's generality.  
     - **Non-negotiable**: Yes. A theory must handle all rational inputs to be universally applicable.  

  2. **Independence**  
     - **Requirement**: The group’s judgment on a proposition must depend only on individual judgments on that proposition, not on judgments about other propositions.  
     - **Case**: Group judgments should reflect the members’ direct stance on each issue. Allowing cross-proposition influence (e.g., inferring views on unrelated topics) risks strategic manipulation, violates transparency, and misrepresents individual positions.  
     - **Non-negotiable**: Often treated as such, but some approaches relax it.  

  3. **Non-Dictatorship**  
     - **Requirement**: The rule must not always mirror the judgment of a single fixed individual (a "dictator").  
     - **Case**: Collective judgment requires genuine aggregation; if one member always determines the outcome, the group’s view is illusory, negating the purpose of deliberation.  
     - **Non-negotiable**: Yes. Dictatorship violates the core ideal of collective reasoning.  

  4. **Unanimity**  
     - **Requirement**: If all individuals agree on a proposition, the group must adopt that judgment.  
     - **Case**: Unanimity represents consensus; rejecting it would disregard the collective will and permit arbitrary overrides of agreed-upon truths.  
     - **Non-negotiable**: Widely accepted, as it ensures minimal responsiveness to agreement.  

  5. **Deductive Closure**  
     - **Requirement**: The group’s judgments must be logically consistent (e.g., if the group accepts \(P\) and \(P \rightarrow Q\), it must accept \(Q\)).  
     - **Case**: Incoherent group judgments (e.g., accepting premises but rejecting their logical conclusion) undermine rationality, invite contradictions, and impair decision-making.  
     - **Non-negotiable**: Often prioritized, but some approaches sacrifice it for feasibility.  

  ### Joint Unsatisfiability and the Discursive Dilemma  
  - **Unsatisfiable Subset**: Universal Domain, Independence, Non-Dictatorship, Unanimity, and Deductive Closure **cannot all be satisfied simultaneously** in non-trivial cases (i.e., with at least two interconnected propositions). This is established by the **doctrinal paradox** (a.k.a. discursive dilemma).  
  - **Discursive Dilemma as Concrete Tension**:  
    - **Scenario**: A court votes on three propositions: \(P\) (e.g., "The defendant breached the contract"), \(Q\) (e.g., "The defendant had a duty"), and \(R\) (e.g., "The defendant is liable"), where \(R \leftrightarrow (P \land Q)\). Judges vote as follows:  
      - Judge 1: \(P\), \(Q\), \(R\) (all True).  
      - Judge 2: \(P\) (True), \(Q\) (False), \(R\) (False).  
      - Judge 3: \(P\) (False), \(Q\) (True), \(R\) (False).  
    - **Majority Voting**:  
      - \(P\): True (2–1).  
      - \(Q\): True (2–1).  
      - \(R\): False (2–1).  
    - **Tension**: The group accepts \(P\) and \(Q\) (premises with majority support) but rejects \(R\) (conclusion with majority support). Since \(R\) is logically equivalent to \(P \land Q\), the judgments violate Deductive Closure. The dilemma arises because:  
      - **Universal Domain** allows any consistent individual views (here, all judges are consistent).  
      - **Independence** forces separate votes on \(P\), \(Q\), and \(R\).  
      - **Non-Dictatorship** and **Unanimity** hold (no dictator; unanimity is not triggered).  
      - **Deductive Closure** fails: The group cannot simultaneously hold \(P\), \(Q\), and \(\neg R\) without inconsistency.  
    - **Implication**: The paradox proves that the five desiderata conflict; satisfying four forces violation of the fifth.  

  ### Evaluation of Voting Methods  
  - **Premise-Based Voting**:  
    - **Rule**: Vote only on "premises" (e.g., \(P\) and \(Q\)), then derive the "conclusion" (\(R\)) logically.  
    - **Performance**:  
      - Satisfies **Universal Domain** (handles all inputs).  
      - Violates **Independence** (group judgment on \(R\) depends on premises, not direct votes).  
      - Satisfies **Non-Dictatorship** and **Unanimity**.  
      - Satisfies **Deductive Closure** (by construction).  
    - **Trade-off**: Restores consistency but ignores direct member views on conclusions.  

  - **Conclusion-Based Voting**:  
    - **Rule**: Vote only on the "conclusion" (e.g., \(R\)), ignoring premises.  
    - **Performance**:  
      - Satisfies **Universal Domain**.  
      - Satisfies **Independence** (only \(R\) is voted on).  
      - Satisfies **Non-Dictatorship** and **Unanimity**.  
      - Violates **Deductive Closure** (premises may be inconsistent with the conclusion; e.g., if \(R\) is False, but \(P\) and \(Q\) could be True).  
    - **Trade-off**: Avoids inconsistency on conclusions but sacrifices collective rationality on premises.
