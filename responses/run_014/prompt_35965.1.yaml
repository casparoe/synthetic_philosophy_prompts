  First, unpacking their core observation: the deadlock seems to persist because deflationists and inflationists aren't just disagreeing but often talking past each other. The user's suspicion about conflated questions resonates - is this about the predicate's function (deflationist lens) versus truth-makers (inflationist obsession)? But their third point about unexplained explanatory norms feels most acute. When Horwich says truth's role in explaining success is "merely apparent" while Lynch insists it's substantive, that's not just semantics - it's a meta-disagreement about what counts as explanation itself.

  The textual evidence supports this: Deflationists explicitly deny truth has "explanatory potency" (Horwich) beyond disquotation. Inflationists like Field demand truth must "figure in" causal explanations. Yet neither side debates what "explanatory potency" even means - they assume competing intuitions. This isn't verbal; it's unarticulated foundational disagreement.

  Progress then needs to force this hidden conflict into the open. Instead of recycling schema-vs-property arguments, we should test truth's explanatory role in concrete cases - say, whether a neuroscientist studying belief-guided behavior requires a substantive truth property or just disquotation. If both sides engage such cases, their criteria for "real explanation" become visible. Alternatively, meta-philosophical work on explanatory norms (e.g., Woodward's interventionism) could scaffold the debate.

  The placeholder view has merit too - this stalemate productively structures other areas like semantics. But the user's fatigue suggests we shouldn't just accept that. Their request for diagnosis over survey shows they want tools to cut through decades of circularity. Focusing on the unexplained explanatory norms - and demanding case studies - might finally provide traction.
answer: |-
  Here's a diagnosis of the stalemate, grounded in the arguments you outlined:

  1.  **The Core is Substantive, but Muddled:** The fundamental dispute is **substantive** – it concerns whether truth possesses a *metaphysically robust nature* capable of *genuine, non-redundant explanation*. Deflationists (Horwich, Field) argue the equivalence schema exhausts truth's function: "true" is a logical device enabling generalization and indirect assertion. Any "explanatory role" (e.g., true beliefs leading to success) is explained *away* by the schema plus facts about the beliefs and the world, *not* by a property *truth*. Inflationists (David, Lynch, Vision) insist the schema merely *fixes the extension* of a substantive property needed to explain phenomena like belief-success links or cross-linguistic agreement – explanations where disquotation alone seems insufficient.

  2.  **The Verbal Layer Exacerbates It:** This substantive clash is obscured by a **verbal disagreement about "theory" and "property."** Deflationists argue their account *is* a complete theory of the truth *predicate's function*. Inflationists retort that this ignores the *property* the predicate denotes. Deflationists reply they *deny* a substantive property is denoted. This creates a frustrating loop: one side demands an account of the property, the other denies the property exists beyond the predicate's use. Both are answering different, albeit related, questions: "How does the word 'true' work?" vs. "What is the nature of the feature in the world that makes beliefs/sentences true?".

  3.  **The Hidden Battleground: Explanation:** Crucially, the stalemate hinges on **unarticulated disagreements about explanation**:
      *   **Explanatory Scope:** Inflationists claim truth explains phenomena *beyond* what the equivalence schema plus non-truth facts can handle (e.g., "Why do actions based on true beliefs *generally* succeed?"). Deflationists (e.g., Horwich) counter that the schema plus the *specific* facts causing success (e.g., snow's whiteness causing successful snow-related actions) provide the *real* explanation; invoking "truth" adds nothing. This disagreement isn't just about truth; it's about whether certain phenomena *require* a unifying, abstract property explanation or are fully explained by piecemeal lower-level facts.
      *   **Explanatory Substantiveness:** What counts as a *genuine* explanation? Inflationists see truth as playing an indispensable causal or unifying role. Deflationists see its invocation as merely expressive shorthand, not genuinely explanatory – a "cheap heuristic" as you put it. This difference rests on divergent, often implicit, theories of explanation itself (e.g., causal vs. pragmatic).

  **Pathways to Progress:**

  *   **Sharpening the Explanatory Dispute:** Focus relentlessly on **specific test cases** where truth is purported to explain (e.g., belief-success, logical laws, meaning determination). Rigorously analyze whether a deflationist reconstruction *using only the schema, disquotation, and non-truth facts* genuinely matches the explanatory power claimed by inflationists invoking a substantive property. Does the inflationist explanation offer genuine insight or predictive power the deflationist reconstruction lacks?
  *   **Meta-Explanation Debate:** Explicitly engage the **underlying disagreement about explanation**. What *makes* an explanation substantive? When is a unifying property genuinely explanatory versus merely nominal? Framing the truth debate *within* a clearer meta-discussion about explanatory norms could break the deadlock.
  *   **Reformulating "Truth Property":** Instead of talking past each other on "property," inflationists could more precisely characterize the *explanatory role* they require truth to play (e.g., a causally efficacious natural kind, a metaphysically robust universal, a functional role). Deflationists could then directly target whether that *specific* role is necessary or illusory.

  **Conclusion:** The stalemate stems from a substantive core dispute (does truth have robust explanatory power?) obscured by verbal confusion ("theory," "property") and, most critically, unexamined disagreements about the nature and demands of explanation itself. Progress lies not in rehashing equivalence schemas but in forcing the debate onto the battleground of **concrete explanatory test cases** and **explicitly debating the standards of explanation** each side presupposes. While the debate structures other areas (semantics, epistemology), focusing on these points offers the best chance for genuine movement.
