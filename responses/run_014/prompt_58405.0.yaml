  Trade-offs: Prioritizing Line 1 might delay work on practical decisions (Line 3). But without a clear observer concept, Line 3 could be misguided. Line 2 is important for theoretical rigor but might not immediately help forecasters.

  Evidence that could change order: If early work on Line 1 shows observer definition is intractable, maybe shift to Line 3. Or if empirical data emerges about digital minds, it could accelerate Line 1. For Line 2, if consensus forms on limits to anthropic reasoning, that could simplify things.

