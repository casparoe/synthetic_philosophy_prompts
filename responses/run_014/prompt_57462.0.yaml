answer: |-
  *(Stabbing the counter with a finger)* Your grandfather's hands? I knew those hands. They built the bandstand in the park. Held your mother when she had the scarlet fever. Paid for Dee's first bicycle. Yeah, they were cracked and stained. So were mine. So what? You think the river wasn't stained before the works? You think men didn't cough? Life stains things. It kills things. That beamhouse? That's where Joe Petrovich taught his boy fractions while they scraped hides. That's where the collection started for the Henderson twins when their house burned. You want to tally the cough? Fine. Tally the Christmases paid for in that yard, the doctors' bills covered.  

  *(Leaning in, voice dropping, intense)* Dee... Dee brought them because she’s scared. Scared of empty storefronts and kids leaving. Thinks wiping the slate clean makes a future. It just makes a hole. You scrape off the works, what fills that hole? Server farm? Cold boxes humming? That’s not a town, that’s… storage. And your cousin’s baby pictures? They’re next to Joe Petrovich’s union card and a menu from the old Polish Hall. You pull one thread, the whole thing unravels. Forget the dead? You forget why you’re even breathing. A town that only looks ahead walks blind. What’s owed? Not worship. Memory. The raw stuff we’re made of. Without it, Bellrock’s just a name on a map, and Dee’s kids won’t know why they’re here either.  
