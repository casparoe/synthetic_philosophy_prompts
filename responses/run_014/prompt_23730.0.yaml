prompt: |-
  I'm a novelist moonlighting as host of a small science-and-ideas podcast; this month's guest is a philosopher of medicine who's spent her career on the normativist side of the health debate — the view that 'health' isn't a value-neutral biological fact you can just read off a body but is irreducably value-laden, so what counts as healthy depends partly on what a society values. I want to be the interviewer who actually knows the terrain, not the one who lets her give the TED-talk version. Write me a sequence of interview questions (seven to nine) that press the view where the literature presses it: at least one on why value-ladenness doesn't just collapse disease into 'whatever we happen to find bad' (the mere-badness problem), at least one on whether disease can still count as a natural kind if its boundaries are partly set by values, at least one on how a value-laden concept stays objective enough to be useful in epideomiology and public-health policy, and at least one on the social-construction worry — if health tracks our values, can't a society just decide its way out of a disease, the way we 'decided' homosexuality wasn't a mental illness? For each, give me a follow-up keyed to the reply she's most likely to give, because she has a polished answer for every one of these and I want to corner her, gently.
