prompt: |-
  I am assembling a fictional-archive issue for a policy journal and need one item: a piece of sustained deadpan satire of about 650 words, in the form of an official decision notice from a regulatory body, written as continuous prose in the register of a genuine determination. That means no headings, no numbered clauses, no bullet points and no bold text, and it should read the way a long and carefully courteous letter reads.

  The setting is an invented jurisdiction in which self-government is treated as a standing general principle rather than an occasional concession, and the body issuing the notice, which you may call the Boundary and Peoples Commission, has the job of deciding who counts as a people and where their territory stops. Address the notice to an invented regional movement whose application the Commission grants. Every place, body and person must be invented, so that nothing in the piece turns on any real referendum or real movement.

  The comedy must come from the Commission applying the applicant's own principle with complete consistency. The constituency whose consent is supposed to settle the matter cannot itself be identified without a prior decision about who belongs to it; the reasons offered for the applicant's secession are equally available to the applicant's own second city, to a rural district that voted the other way, and eventually to a single street that has filed its own application. Let the Commission also announce two doctrines of its own invention: one under which consent lapses whenever the composition of the constituency changes, so that no settlement is ever final, and one under which any grant of secession automatically reopens the question for every sub-unit of the newly created entity. It should apologise sincerely for the administrative inconvenience and offer to assist the applicant in completing the resulting forms.

  Never wink. The notice should sound fair-minded, even solicitous, and should never use the vocabulary of the academic debate; a reader who knows that literature should nonetheless recognise the real difficulty being dramatised, and should find the satire fair rather than merely clever. Please write in British English.
reasoning: |-
  Okay, the user wants a satirical piece for a policy journal. They need an official decision notice from a fictional regulatory body, the Boundary and Peoples Commission. The challenge is to create deadpan satire that mimics a genuine bureaucratic document while highlighting the absurdity of self-determination principles when applied with extreme consistency.

  The key requirements are: British English, continuous prose without headings or bullet points, and a courteous tone. The satire must stem from applying the applicant's own logic to its extreme conclusion - where every subgroup can claim the same rights, leading to infinite regress. 

  I consider creating the fictional "Cordelian Republic" as the applicant. The Commission's approval will trigger a cascade of sub-applications: from their second city "Tredonby", then the rural "North Fennyshire", down to "Elmsworth Avenue Residents' Association". 

  The two invented doctrines will be:
  1) "Dynamic Consent" - requiring re-referendum after demographic changes
  2) "Recursive Self-Determination" - automatically triggering subgroup applications

  The tone must remain painfully polite throughout. Phrases like "We recognise the administrative burden" and "offer our Forms Assistance Office" will maintain the deadpan effect while highlighting bureaucratic absurdity.

  I plan to structure it as:
  - Opening courtesies
  - Approval of Cordelian secession
  - Immediate triggering of Tredonby's application
  - Introduction of the two doctrines
  - Cascading effect down to street level
  - Apology for inconvenience + offer of forms assistance
  - Closing formalities

  The satire works by letting the logical extremes speak for themselves without explicit commentary. The reader should recognise real-world sovereignty debates in this fictional reductio ad absurdum.
answer: |-
  ## Decision Notice: Application for Recognition of the Cordelian Republic  
  *Ref: BPC/ADJ/78-4C*  

  Dear Secretary of the Cordelian Self-Determination Council,  

  The Boundary and Peoples Commission acknowledges receipt of your application, dated the 14th of Ultimo, seeking recognition for the Cordelian Republic as a distinct people and the establishment of its territorial boundaries, consequent upon a consultative exercise held within the proposed territory on the 3rd of Ultimo. The Commission has undertaken a thorough assessment of your submission, including the demographic data, historical narrative, and the expressed will of the inhabitants captured in the aforementioned exercise, wherein 62.1% of participants indicated a preference for independent statehood.  

  It gives the Commission considerable satisfaction to inform you that, upon careful examination and applying the foundational principle of self-government articulated in your application – namely, that the consent of the governed, expressed by a majority within a defined and coherent constituency, is the sole legitimate basis for territorial jurisdiction – we find the case for Cordelian distinctiveness and self-determination to be substantively made. Accordingly, the Commission is pleased to grant recognition to the Cordelian People and approves the establishment of the Cordelian Republic within the boundaries as described in Schedule A (enclosed), effective from the first day of the forthcoming month. The Commission commends the diligence and evident sincerity of your Council in advancing this claim.  

  However, in upholding the principle of self-government with the rigorous consistency our remand demands, the Commission must simultaneously address several corollary applications precipitated directly by your own successful petition. Immediately upon the publication of our provisional finding in favour of Cordelian recognition, the Commission received a valid application from the Municipal Authority of Tredonby, Cordelia's second city and a significant industrial centre. The Authority contends, citing the same principle of constituent consent underpinning your claim, that Tredonby constitutes a distinct socio-economic unit whose population (recorded at 58.7% in their preliminary survey) did not endorse secession in the wider Cordelian exercise and now seeks independent city-state status. Their arguments regarding unique civic identity and economic viability bear a notable resemblance, in both structure and moral weight, to those previously advanced by your Council regarding Cordelia's relationship to the wider Union of Albion-Mercia.  

  Furthermore, the Commission is obliged to apply two established doctrines critical to maintaining the integrity of self-determination as a continuous process, rather than a singular event. Firstly, the Doctrine of Dynamic Consent holds that any expression of constituent will is inherently tied to the specific demographic composition of the electorate at the moment of consultation. Significant subsequent demographic shifts – through migration, natural population change, or the enfranchisement of new resident cohorts – necessitate a fresh assessment of consent to ensure the continued legitimacy of the jurisdictional arrangement. Consequently, the settlement granted to the Cordelian Republic today cannot be considered perpetual; its validity is contingent upon periodic reassessment should relevant demographic thresholds be crossed.  

  Secondly, and more pertinently to the immediate administrative situation, the Principle of Recursive Self-Determination dictates that the recognition of any new territorial entity automatically validates the right of any geographically or culturally coherent sub-unit within that new entity to initiate its own application for recognition. The successful secession of Cordelia inherently validates the potential distinctiveness and right to self-determination of Tredonby, just as Cordelia's own claim relied upon validating its distinctiveness from Albion-Mercia. Indeed, following Tredonby's application, a further valid petition has now been received from the North Fennyshire Rural District Council – an area within Cordelia which returned a 74.3% vote *against* secession in your initial exercise. They argue, with impeccable internal logic mirroring Cordelia's initial position, that they constitute a distinct rural community unfairly subjected to the governance of an urban-majority Cordelian state against their expressed will. Most recently, and illustrating the principle's inexorable application, the Commission has registered an application from the Elmsworth Avenue Residents' Association in Tredonby, seeking recognition for their street (citing unique parking challenges and a demonstrably cohesive neighbourhood watch scheme) as a freehold enclave should Tredonby achieve city-state status.  

  The Commission fully recognises the administrative burden this cascade of valid applications imposes upon your nascent Cordelian Republic, even as it celebrates your own successful attainment of statehood. We profoundly regret any inconvenience caused by the rigorous, impartial application of the self-governance principle upon which your claim rested. To assist in managing the procedural requirements flowing from these developments – specifically, the requirement for the Cordelian Republic (as the newly recognised entity encompassing these sub-units) to formally acknowledge and process the applications from Tredonby, North Fennyshire, and the Elmsworth Avenue Residents' Association within its jurisdiction – we offer the services of our Forms Assistance Office. Our officers stand ready to guide you through the completion of Sub-Entity Recognition Schedules (Forms BPC/SERS/1 through 4) and the requisite Impact Assessments on Cordelian Territorial Integrity (Form BPC/IATI/7).  

  We extend our sincere congratulations once more on the recognition of the Cordelian Republic and remain at your disposal to facilitate the orderly implementation of the principles that have enabled its creation.  

  Yours faithfully,  

  **Eustace Thorne**  
  Chief Adjudicator  
  Boundary and Peoples Commission  
  *(On behalf of the Commissioners)*
