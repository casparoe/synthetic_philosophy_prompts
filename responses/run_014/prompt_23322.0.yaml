prompt: |-
  I am preparing a graduate seminar on moral uncertainty, and I want to clarify a distinction that I think is often elided: the difference between uncertainty over moral theories and uncertainty over moral facts within a fixed moral framework. Please explain this distinction carefully, with attention to the case in which the competing moral theories do not merely disagree about which act is right, but use different evaluative currencies or different decision rules. For example, one theory maximizes aggregate welfare, another treats certain rights as inviolable constraints, and another evaluates conduct primarily by the character of the agent rather than by the consequences of the act. My students keep assuming that if I assign a probability to each theory, I can simply compute a weighted sum of the theories' verdicts and choose the act with the highest expected moral score, but I suspect that this procedure may not always be well-defined when the theories do not share a common value function over acts.

  Could you explain why the expected-value formulation is conceptually unstable in that case, and what alternative ways of representing moral uncertainty would be available, such as probability over value functions, probability over preference rankings, or a view that treats moral disagreement as partly a disagreement about the kind of question being asked? I would prefer an explanation that stays at the level of the conceptual architecture rather than surveying the literature, and that makes clear what must be true for a decision procedure under moral uncertainty to be more than a convenient heuristic.
reasoning: |-
  Okay, let me start by really understanding what the user is asking. They're teaching a graduate seminar on moral uncertainty and want to clarify a key distinction: uncertainty over moral theories versus uncertainty over moral facts within a fixed framework. They mentioned that students often assume a weighted sum approach, but the user suspects issues when theories use different evaluative currencies or decision rules. 

  First, I need to unpack why the expected-value approach fails in such cases. The example theories given—utilitarianism, deontology, virtue ethics—each have fundamentally different structures. Utilitarianism uses a numerical scale, deontology deals in permissibility, and virtue ethics focuses on character traits. Aggregating these requires a common metric, which doesn't exist. It's like adding apples and oranges. 

  The user wants alternatives but without diving too deep into literature. So, I should focus on conceptual options: probability over value functions, preference rankings, or meta-ethical views. Each has its challenges. Value functions assume comparability, which might not hold. Preference rankings avoid cardinality but still need inter-theoretic comparisons. The meta-ethical approach questions whether moral theories are even answering the same question, which complicates aggregation further.

  I should emphasize the deeper issue: what makes a decision procedure more than heuristic? The key is whether the theories share a common structure that allows meaningful aggregation. If not, any procedure is arbitrary. The user's students might not realize that probabilities over theories don't resolve incommensurability. Highlighting this conceptual instability is crucial.

  Also, the user's unspoken need might be to equip students with tools to critically assess moral uncertainty frameworks. They need clear arguments to challenge simplistic models. So, explaining why each alternative has limitations helps students grasp the complexity. Stressing that no solution is perfect without shared assumptions underlines the seminar's advanced nature.
answer: |-
  Here's a clear conceptual breakdown of that crucial distinction and the challenges of aggregating across fundamentally different moral theories:

  ### 1. Core Distinction: Uncertainty *About* vs. Uncertainty *Within* a Framework
  *   **Uncertainty Over Moral Facts (Within a Fixed Framework):** You know *what kind of thing* makes an act right/wrong (e.g., maximizing welfare, respecting rights X, Y, Z, expressing virtues), but you are uncertain *what the specific facts are* within that framework.
      *   *Example (Utilitarianism):* You know rightness = maximizing welfare. But you are uncertain *which act* actually maximizes welfare (e.g., due to empirical uncertainty about consequences, or uncertainty about interpersonal comparisons).
      *   *Decision Procedure:* Expected value maximization *is* conceptually coherent here. You calculate the expected welfare of each act given your probabilities over states of the world and choose the act with the highest expected welfare.
  *   **Uncertainty Over Moral Theories (Frameworks):** You are uncertain *which fundamental framework* tells you what makes an act right/wrong in the first place. The theories disagree on the *currency* of moral value (welfare, rights, virtue) and the *decision rule* (maximize, constrain, cultivate).
      *   *Example:* You assign 60% probability to Utilitarianism (U: maximize aggregate welfare), 30% to Kantian Deontology (K: never violate autonomy, even for good consequences), and 10% to Virtue Ethics (V: act as a virtuous agent would).
      *   *Challenge:* The theories don't just output different "verdicts" (right/wrong); they output verdicts *based on fundamentally different and incommensurable kinds of evaluation*. U outputs a *cardinal quantity* (welfare units), K outputs a *binary constraint* (permissible/impermissible), V outputs an *ordinal ranking* or *character assessment*.

  ### 2. Why "Expected Moral Score" Fails with Divergent Frameworks
  The students' proposed solution – "weighted sum of the theories' verdicts" – runs into insurmountable conceptual problems when theories lack a common value function:

  *   **Problem 1: Incommensurable Currencies:** What is the "moral score" of an act?
      *   U might say Act A = +100 welfare units, Act B = +90.
      *   K might say Act A is *impermissible* (violates a right), Act B is *permissible*.
      *   V might say Act A expresses cowardice, Act B expresses courage.
      *   **How do you numerically combine "+100", "impermissible", and "cowardice"?** There is no common scale. Assigning numbers (e.g., 0 to impermissible, 1 to permissible) is arbitrary and doesn't capture the *qualitative difference* in the kind of wrongness K identifies (a constraint violation vs. a welfare loss). V's "cowardice" isn't readily translatable into welfare units or permissibility status.
  *   **Problem 2: Different Decision Rules:** The theories don't just value different things; they *use* those values differently.
      *   U says: *Maximize* the sum. Cardinal scale is essential.
      *   K says: *Never violate* the constraint, *regardless* of consequences (unless in conflict with another constraint). Permissibility is primary; cardinal welfare comparisons are irrelevant to the core constraint.
      *   V says: *Cultivate* virtue or *emulate* the virtuous agent. Evaluation is often holistic and comparative, not necessarily yielding a precise cardinal score for each act in isolation.
      *   **Aggregating outputs designed for incompatible rules is incoherent.** Averaging a "maximize this!" command, a "never do that!" command, and a "be like this!" command doesn't yield a meaningful composite instruction.
  *   **Problem 3: Loss of Normative Force:** The "expected moral score" loses the distinct normative character of each theory. For a Kantian, violating a constraint isn't just "scoring low"; it's categorically forbidden. Averaging it with high welfare gains fundamentally misunderstands the nature of the Kantian prohibition. The "score" becomes a new, hybrid metric disconnected from the normative authority of the underlying theories.
  *   **Problem 4: Arbitrary Normalization:** To combine the outputs numerically, you must force each theory's verdicts onto a common numerical scale. How do you map "impermissible" to a number relative to "+100 welfare units"? How do you scale virtue assessments? This mapping is unavoidably arbitrary and not dictated by the theories themselves. The final "expected moral score" is highly sensitive to these arbitrary choices.

  ### 3. Alternative Conceptual Representations of Moral Uncertainty

  Since direct aggregation of "scores" fails, we need different ways to model uncertainty over frameworks:

  *   **A. Probability over Value Functions:** Instead of assigning probabilities to *theories*, assign probabilities to *specific value functions* defined over acts.
      *   *Concept:* You believe there is *some* true numerical value function V(a) representing the "objective moral score" of each act 'a', but you are uncertain *which* V(a) is correct. You have a probability distribution over possible V(a) functions.
      *   *Challenge:* This *presupposes* a common *type* of output (a real number for each act) and a common *purpose* (maximizing V(a)). But our competing theories explicitly *reject* this presupposition. Kantians deny acts have a cardinal "moral score" to be maximized; they have constraints. Virtue ethicists might deny acts can be scored in isolation. This representation forces theories into a mold they reject.
      *   *When Coherent?* Only if the competing theories *implicitly agree* that the fundamental moral question *is* "Which act has the highest moral score?" and merely disagree on how to calculate that score. This is rarely the case with deeply divergent theories.
  *   **B. Probability over Preference Rankings:** Assign probabilities to complete or partial *ordinal rankings* of acts.
      *   *Concept:* Each theory provides a ranking (A > B > C, or A permissible, B impermissible). You assign probabilities to these different rankings. You then need a rule for choosing an act given this uncertainty over rankings (e.g., Borda count, Condorcet methods).
      *   *Advantage:* Avoids the need for cardinal scales. Captures the ordinal or comparative nature of many verdicts (better/worse, permissible/impermissible).
      *   *Challenge 1:* Theories might generate *incomparable* or *incompatible* rankings (e.g., K ranks A as worst due to constraint violation, U ranks A as best due to consequences). How do probabilities over rankings resolve this?
      *   *Challenge 2:* How do you aggregate rankings from theories that output different *kinds* of rankings? (e.g., U gives a complete cardinal ordering, K gives a partial ordering based on constraints, V might give a ranking based on character). Forcing them into a uniform ranking representation loses information.
      *   *Challenge 3:* Social choice aggregation rules (like Borda) have well-known limitations (paradoxes, sensitivity to irrelevant alternatives, framing effects).
  *   **C. Meta-Ethical Disagreement over the Question:** Treat the disagreement as being about *what kind of question morality asks*.
      *   *Concept:* Utilitarians ask "Which act produces the most good?". Kantians ask "Which act respects rational agency?". Virtue Ethicists ask "Which act expresses/exemplifies virtue?". These are fundamentally *different questions*.
      *   *Implication:* There is no single "moral score" to be uncertain about. Moral uncertainty is uncertainty about *which question is the morally relevant one to ask* when deciding what to do.
      *   *Decision Challenge:* How do you decide what to do when unsure which *question* to prioritize? This pushes towards higher-order principles (e.g., "choose the act that best respects the seriousness of the disagreement," "minimize the worst-case violation across frameworks") or pragmatic compromises, rather than straightforward aggregation. It acknowledges a deeper level of normative incommensurability.

  ### 4. What Makes a Decision Procedure More Than a Heuristic?

  For a procedure under moral uncertainty to be conceptually robust (not just a convenient heuristic), **one of the following must be true**:

  1.  **Common Currency & Rule:** The competing moral theories, despite surface differences, must *implicitly agree* on a common underlying value currency and decision rule (e.g., maximizing *something* cardinal), differing only in how they *measure* that currency. (This is highly controversial and unlikely for theories like deontology vs. utilitarianism).
  2.  **Meta-Value Justification:** There must be a justified *meta-value principle* (accepted as rational/normative *independently* of the first-order theories) that dictates how to weigh the outputs of different frameworks *despite* their incommensurability. This principle must provide the missing common scale/rationale for aggregation. (No consensus on such a principle exists).
  3.  **Uncertainty Resolves to Facts:** The uncertainty must be resolvable to uncertainty about non-moral *facts* (empirical or conceptual) that, if known, would allow deduction within a single, agreed-upon framework. (This avoids framework aggregation but assumes the frameworks *can* be reconciled under perfect information, which may not hold).

  **Conclusion:** The key insight for your seminar is that **uncertainty over fundamentally divergent moral frameworks involves incommensurability at the level of the evaluative *type* and decision *rule***. Simple expected value aggregation assumes away this incommensurability by forcing all theories into a single maximizing mold they explicitly reject. Alternative representations (value functions, rankings, meta-questions) each have significant conceptual limitations. A genuinely robust decision procedure requires either implausible assumptions about theoretical commensurability or a justified meta-priple for handling incommensurability – neither of which is currently uncontroversial. This highlights that moral uncertainty across frameworks is a profoundly difficult, perhaps metaphysically deep, problem, not merely a technical challenge of aggregation.
