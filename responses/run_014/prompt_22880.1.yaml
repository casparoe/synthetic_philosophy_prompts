answer: |-
  Your frustration is completely understandable - the Frege-Geach problem cuts to the heart of expressivism's viability, and textbook treatments often oversimplify both the problem and why solutions stumble. Let's break this down rigorously.

  **1. The Core Problem: Not Just Embedding, but Logic and Inference**

  Your understanding of the basic setup is correct, but the deeper issue isn't *just* that the conditional seems truth-apt while its parts aren't. It's about **preserving logical relations and enabling valid inference** within a compositional semantics.

  *   **The Descriptivist Baseline:** For descriptivists (cognitivists), "Stealing is wrong" expresses a belief (a cognitive state) with propositional content (p). "If stealing is wrong, then stealing that book is wrong" expresses a complex belief with content (If p, then q). The validity of inferring "Stealing that book is wrong" (q) from the conditional and "Stealing is wrong" (p) relies entirely on the *truth-functional relations* between the propositions p and q. Logic operates on *contents*.
  *   **The Expressivist Challenge:** Expressivists deny that "Stealing is wrong" expresses a belief with a truth-apt propositional content. It expresses a non-cognitive attitude (e.g., disapproval of stealing: BoS). So, what does the *embedded* occurrence of "stealing is wrong" in "If stealing is wrong, then stealing that book is wrong" express? It *can't* express the attitude BoS, because you're not *actually* expressing disapproval when you utter the conditional. You're considering a hypothetical.

  **2. Why the "Higher-Order Attitude" Solution Seems Promising but Fails**

  The expressivist response you mention (e.g., early Ayer, Stevenson's "working out" attitudes) tries to analyze the conditional as expressing a higher-order attitude towards combinations of first-order attitudes.

  *   **The Proposal:** "If stealing is wrong, then stealing that book is wrong" expresses something like: **Disapproval of the combination (Believing that stealing is wrong & Not disapproving of stealing that book)** or **Disapproval of (BoS & ~BoSSB)**.
  *   **The Intuitive Appeal:** It seems to capture the *conceptual connection* we feel between the two moral judgments. We think someone who accepts "Stealing is wrong" but not "Stealing that book is wrong" is being inconsistent in their attitudes.
  *   **The Fatal Flaw: The Problem of Logic and Validity (The Geach/Searle Point)** This is where you hit the wall. The problem isn't that we can't *imagine* expressing such a higher-order attitude. The problem is that this analysis **fails to explain why modus ponens is *logically valid* for moral sentences.**

      Consider the argument:
      1.  If stealing is wrong, then stealing that book is wrong. (Expresses: Disapproval of (BoS & ~BoSSB))
      2.  Stealing is wrong. (Expresses: BoS)
      Therefore,
      3.  Stealing that book is wrong. (Expresses: BoSSB)

      *   **The Logical Gap:** Premise 1 expresses an attitude *about combinations* of attitudes (BoS and the absence of BoSSB). Premise 2 expresses a *first-order* attitude (BoS). The conclusion expresses a *different* first-order attitude (BoSSB). **There is nothing in the *logical form* of the premises, analyzed this way, that logically *entails* the conclusion's attitude.** The inference relies entirely on the *substantive content* of the higher-order attitude expressed in (1) – namely, that it disapproves of precisely the combination present if you accept (2) but deny (3). It's like saying:
          *   Premise 1: I hate it when people like apples but hate apple pie.
          *   Premise 2: I like apples.
          *   Conclusion: Therefore, I like apple pie.
      *   **Why it's Invalid:** The conclusion doesn't follow logically. You could *consistently* hold premise 1 (hating the apple/apple-pie attitude combo) and premise 2 (liking apples) without liking apple pie yourself. You might just think people *should* like apple pie if they like apples, even if you personally don't! The premises don't *logically compel* the attitude expressed in the conclusion. Crucially, **the validity of modus ponens seems to depend on the *propositional contents* of the sentences, not the psychological states they express.** The higher-order attitude account reduces logical validity to contingent facts about psychological consistency, not necessary truth-preservation. It conflates *logical inconsistency* with *attitudinal inconsistency*.

  **3. Embedding Problem vs. Frege-Geach Problem: Clarification**

  *   **Embedding Problem:** This is the **broader challenge**. How can expressivism provide a unified, compositional semantics that explains the meaning of moral sentences *wherever they appear* in complex syntax (negation, conditionals, disjunctions, belief contexts, questions, etc.)? How does the meaning of the complex sentence derive from the meanings of its parts and the syntactic structure, given that the meaning of the atomic moral sentence is fundamentally non-representational (expressing an attitude)? This problem encompasses *all* embeddings.
  *   **Frege-Gach Problem:** This is the **most famous and devastating *instance* of the embedding problem**, specifically focusing on embeddings within truth-functional contexts (like conditionals, disjunctions, negation) and, crucially, the implications this has for **logical validity and inference** (like modus ponens). Geach's 1960 and 1965 papers specifically targeted the failure to account for the *unchanged meaning* of the embedded clause and its role in logic. While often used interchangeably, "Frege-Geach" usually highlights the *logical inference* aspect more sharply.

  **4. Blackburn's Quasi-Realism: The Sophisticated Expressivist Response**

  Blackburn aims to *solve* Frege-Geach while staying non-cognitivist at the core. Quasi-realism tries to "earn the right" to talk *as if* moral judgments are truth-apt and involved in logical relations, even though their fundamental nature is expressive. His key tool is analyzing complex sentences as expressing **higher-order attitudes towards combinations of attitudes projected onto possible situations**.

  *   **The Core Idea (Minimalism + Projectivism):**
      *   **Minimalism about Truth:** Blackburn adopts a minimalist/deflationary theory of truth. Saying "'Stealing is wrong' is true" is just another way of endorsing the attitude expressed by "Stealing is wrong" (BoS). Truth-talk doesn't imply robust representationalism.
      *   **Projectivism:** Moral attitudes are "projected" onto the world; we talk *as if* wrongness is a property, but it's really a reflection of our sensibility.
      *   **Higher-Order Attitudes for Logic:** Complex sentences express attitudes about having consistent patterns of first-order attitudes across different possible situations or descriptions of the world.

  *   **Solving Frege-Geach (The Quasi-Realist Account):**
      *   **Atomic Sentence:** "Stealing is wrong" expresses BoS (disapproval of stealing).
      *   **Conditional:** "If stealing is wrong, then stealing that book is wrong" expresses a **higher-order attitude**: disapproval of *any* state of mind (or combination of attitudes) that involves *accepting that stealing occurs* (the descriptive core) *while disapproving of stealing in general but not disapproving of stealing that specific book*. It's an attitude *for* or *against* combinations of attitudes held towards the same descriptive content (stealing/stealing that book) under different guises.
      *   **Validity (Quasi-Realist Style):** Why is modus ponens valid?
          *   Accepting Premise 1 means you have the higher-order attitude: you disapprove of *anyone* (including yourself) holding BoS but not BoSSB towards the relevant descriptive situations.
          *   Accepting Premise 2 means you hold BoS.
          *   Therefore, *given your commitment expressed in Premise 1*, you *must* hold BoSSB to avoid the specific combination of attitudes you disapprove of. **The validity arises from the internal practical consistency required by the commitments undertaken by endorsing the premises.** To accept both premises but deny the conclusion is to be practically inconsistent *with your own commitments* – you are disapproving of a combination (BoS & ~BoSSB) that you yourself hold (since you have BoS and lack BoSSB). This practical inconsistency *mirrors* logical inconsistency.

  *   **How it *Tries* to Avoid the Earlier Problem:** Blackburn emphasizes that the descriptive content ("stealing occurs," "stealing that book occurs") provides the common subject matter that the attitudes are *about*. The higher-order attitude isn't just a freestanding psychological quirk; it's an attitude *governing* how first-order attitudes must be applied *to specific descriptive contents* to maintain coherence in one's practical stance towards the world. Logic is grounded in the requirements of practical coherence for a projectivist being.

  **5. Why Quasi-Realism is Still Controversial (The "Wishful Thinking" Problem & More)**

  While sophisticated, quasi-realism faces significant challenges:

  1.  **The Wishful Thinking Problem (Dorr 2002, Streumer 2013):** Can quasi-realism distinguish *valid inference* from *wishful thinking*? Consider:
      *   Premise: If God exists, then stealing is wrong. (Expresses: Disapproval of (Believing God exists & Not disapproving of stealing))
      *   Premise: God exists. (Expresses: Belief that God exists - a *cognitive* state!)
      *   Conclusion: Stealing is wrong. (Expresses: BoS)
      According to quasi-realism, accepting the premises commits you, for practical coherence, to disapproving of stealing. But this seems like deriving a moral conclusion (an attitude) from purely *descriptive* premises (a belief). This looks disturbingly like *wishful thinking* – forming an attitude because you believe something else that you *wish* implied it. Quasi-realism struggles to explain why this inference seems fundamentally flawed, while moral modus ponens seems sound. It appears to validate inferences that are intuitively invalid.
  2.  **Compositionality Worries:** Is the account *genuinely* compositional? Does the meaning assigned to "stealing is wrong" in the atomic case truly *contribute* in the same way to the meaning of the complex sentence as it does in the descriptivist picture, or is the quasi-realist effectively changing the meaning ("systematic ambiguity") when the sentence is embedded? Does the analysis feel like an *ad hoc* patch rather than a natural derivation?
  3.  **The "Explanation" Challenge:** Does grounding logic in practical consistency *explain* logical validity, or merely *mimic* it? Critics argue it replaces necessary truth-preservation with contingent requirements of attitudinal coherence, failing to capture the *normative force* of logic itself.
  4.  **Complexity & Psychological Plausibility:** Do ordinary speakers really have these complex higher-order attitudes governing all possible descriptive scenarios whenever they use a moral conditional? The account risks being psychologically unrealistic.

  **In Summary:**

  *   **The Wall You Hit:** The naive higher-order attitude solution fails because it cannot explain the *logical validity* of inferences like modus ponens; it reduces logic to contingent psychological consistency.
  *   **Embedding vs. Frege-Geach:** Embedding is the broad challenge; Frege-Geach is the specific, critical instance concerning truth-functional embedding and logical inference.
  *   **Quasi-Realism's Gambit:** Blackburn uses minimal truth + higher-order attitudes governing combinations of first-order attitudes applied to descriptive contents to ground logical relations in requirements of practical coherence for projectivists.
  *   **Why it's Still Problematic:** The Wishful Thinking Problem highlights a major weakness in distinguishing valid from invalid inferences involving mixed descriptive/moral premises. Concerns about genuine compositionality, the nature of logical explanation, and psychological plausibility remain.

  The Frege-Geach problem remains the central battleground in metaethics precisely because it forces expressivists to walk a razor-thin line: explaining the *logical behavior* of moral language without collapsing into a form of descriptivism/cognitivism. Quasi-realism is the most developed attempt, but its success is fiercely debated. Your struggle reflects the genuine depth of the problem. Keep wrestling with the Wishful Thinking objection – it's a key pressure point for evaluating if quasi-realism truly succeeds.
