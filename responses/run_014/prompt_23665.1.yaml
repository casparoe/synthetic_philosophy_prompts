prompt: |-
  I've been reading secondary literature on Nāgārjuna's tetralemma (the catuṣkoṭi), and as someone who thinks in terms of classical logic I keep running into what looks like a genuine inconsistency. My understanding is that the tetralemma is applied to any thesis p by rejecting all four alternatives: that p holds, that p does not hold, that both hold, and that neither holds. But the law of excluded middle guarantees that one of the first two alternatives is true, so rejecting all four appears to assert a contradiction. If Nāgārjuna is making that positive claim, the tetralemma seems to refute itself the moment it is turned on the thesis that emptiness is itself empty. How, then, is the tetralemma supposed to work without simply being false?
reasoning: |-
  Okay, the user is struggling with Nāgārjuna's tetralemma from a classical logic perspective. They see a contradiction because rejecting all four options—p, not-p, both, neither—violates the law of excluded middle. Specifically, they're confused about how the tetralemma doesn't self-destruct when applied to emptiness itself.  

  Hmm... this is a sharp observation. The user clearly knows their logic and has done some reading, but might be missing the Madhyamaka context. The core tension is between classical logic's binary framework and Nāgārjuna's radical non-commitment. I should emphasize that the tetralemma isn't a truth-functional tool but a therapeutic deconstruction.  

  First, I need to clarify what "rejection" means here. In classical logic, rejecting all options is indeed absurd. But in Madhyamaka, "rejection" (pratiṣedha) is more about suspending ontological commitment than asserting contradictions. The four lemmas aren't exhaustive logical categories but targets for dismantling reification.  

  Ah, the self-application point is crucial! When the user says "emptiness must be empty," they're hitting on śūnyatāśūnyatā (emptiness of emptiness). Nāgārjuna absolutely applies the tetralemma to his own framework—not to assert a paradox but to prevent emptiness from becoming a new absolute. The tetralemma deconstructs itself too.  

  I should stress the soteriological angle: this isn't about building a consistent metaphysics but about liberation from views. The tetralemma's "failure" is its success—it exposes the limits of conceptual thought. Maybe mention Candrakīrti's distinction between negation types?  

  Also worth noting: the "both" and "neither" options aren't just true/false hybrids but attempts to conceptualize interdependence, which Nāgārjuna argues still reifies phenomena. The tetralemma systematically blocks every exit from essentialism.  

  ...Wait, the user might still wonder how this isn't just relativism or nihilism. Need to clarify that rejecting all positions isn't a fifth position—it's the cessation of position-taking (like the Buddha's "avyākṛta" silences). The MMK verses on nirvāṇa and saṃsāra being neither identical nor different could help ground this.  

  Finally, the logic point: while some scholars (like Garfield/Priest) use paraconsistent logic to model the tetralemma, that's retrospective formalization. Historically, Nāgārjuna is operating beyond Aristotelian bivalence. The user might appreciate that bridge though—it shows their logical concern is recognized in contemporary scholarship.
answer: |-
  Your struggle is both profound and common—it arises precisely at the collision between classical logic and Nāgārjuna's radical non-dualism. The apparent inconsistency *is* the point, and resolving it requires understanding Madhyamaka philosophy on its own terms. Here's how the tetralemma (*catuṣkoṭi*) functions without self-refutation:

  ### 1. **The Tetralemma as Deconstructive Therapy, Not Ontological Assertion**
     - **Purpose**: Nāgārjuna uses the tetralemma to dismantle **reification** (treating concepts as independently real). It targets *all* ontological positions, including its own.
     - **Method**: Rejecting all four *koṭis* negates **conceptual proliferation** (*prapañca*), not reality itself. It exposes the mind's tendency to impose rigid categories (being, non-being, etc.) onto a fluid, interdependent reality (*pratītyasamutpāda*).
     - *Key Insight*: The tetralemma isn't asserting a "fifth position" (e.g., "all positions are false"). It suspends judgment entirely, revealing the inadequacy of language/logic to capture ultimate truth (*paramārtha satya*).

  ### 2. **Why the Law of Excluded Middle (LEM) Doesn’t Apply**
     - **LEM Assumes Bivalence**: Classical logic requires propositions to be *either* true *or* false. Nāgārjuna rejects this framework for ultimate reality:
       - Phenomena lack inherent existence (*svabhāva*), so propositions like "X exists" or "X does not exist" are **semantically empty**. They presuppose an independent referent that doesn't exist.
       - **Example**: "The world is eternal" is rejected not because it's factually false, but because "the world" as a discrete, permanent entity is a misconception.
     - **Beyond True/False**: The tetralemma shows that LEM is a tool for conventional truth (*saṃvṛti satya*), not ultimate reality. Emptiness (*śūnyatā*) transcends this duality.

  ### 3. **Self-Application: Emptiness of Emptiness (*Śūnyatāśūnyatā*)**
     - **The Crucial Move**: When applied to itself (e.g., "Is emptiness empty?"), Nāgārjuna *does* reject all four positions (MMK XIII.7, XXII.11):
       - Emptiness is not a thing to be reified. To claim "emptiness exists" would make it a new absolute. To deny it would imply inherent existence elsewhere. "Both" and "neither" fall to the same critique.
     - **Avoiding Self-Refutation**: This rejection is **non-affirming negation** (*prasajya-pratiṣedha*):
       - It negates without positing an alternative. Emptiness is empty *of inherent existence*, not of dependent arising.
       - Like a ladder discarded after climbing, the tetralemma deconstructs itself, leaving no position to refute.

  ### 4. **The Logical Structure: Beyond Aristotle**
     - **Paraconsistent Logic?**: Some scholars (e.g., Priest, Garfield) model the tetralemma using paraconsistent logic, where contradictions don’t entail triviality. The four *koṭis* may be:
       - **Glutty** (both true/false possible, e.g., conventional vs. ultimate perspectives).
       - **Gappy** (neither true nor false, e.g., ineffable reality).
     - **Alternate Formalisations**: Others (e.g., Westerhoff) use multi-valued logic or argue that the *koṭis* are not jointly exhaustive in Nāgārjuna's system.

  ### 5. **Practical Function: Liberation from Views**
     - The tetralemma isn't a metaphysical theory—it's a tool to induce **cognitive openness**. By rejecting all extremes, it frees the mind from attachment to views (*dṛṣṭi*), leading to peace (*nirvāṇa*).
     - As Nāgārjuna states:  
       > *"The victorious ones have said that emptiness is the relinquishing of all views. Those who are possessed of the view of emptiness are said to be incorrigible"* (MMK XIII.8).

  ### Why This Isn't Inconsistent
  - **No Positive Claim**: The tetralemma makes **no assertion** about reality. It only negates reification. Silence isn't a contradiction.
  - **Contextual Validity**: Classical logic governs conventional discourse (e.g., daily life), but ultimate truth transcends it. Emptiness isn't a "thing" to which LEM applies.
  - **Self-Consistency via Self-Emptiness**: By denying its own substantiality, the tetralemma avoids becoming a dogma. Its emptiness *is* its consistency.

  ### Recommended Reading
  1. **MMK (Mūlamadhyamakakārikā)**: Ch. XIII, XVIII, XXII, XXVII.
  2. **Jay Garfield**: *The Fundamental Wisdom of the Middle Way* (logic-focused translation/commentary).
  3. **Graham Priest**: "The Logic of the Catuṣkoṭi" (paraconsistent approach).
  4. **Jan Westerhoff**: *Nāgārjuna’s Madhyamaka* (analytic perspective).

  Nāgārjuna’s genius lies in using logic to expose its limits. The tetralemma isn’t false—it points to where logic ceases to grip reality. As the *Vigrahavyāvartanī* says:  
  > *"If I had any thesis, that defect would be mine. But I have no thesis, so there is no defect for me."*
