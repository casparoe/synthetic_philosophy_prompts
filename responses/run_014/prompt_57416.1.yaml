prompt: |-
  I'm the lead on conceptual docs at a dev-tools company, which basically means I own the vocabulary: the framing analogy in the overview page, and then every tooltip, error message and diagram inherits it. It happens five or six times a quarter, I get about a day per decision, I'm not a cognitive scientist, and the CTO signs off on the overview. Stakes are high in a dumb way — once something like "the cache is your model's short-term memory" ships, support fields tickets from people who reasoned their way to a conclusion we never actually stated. Our reviewers' reflex objection is that every analogy is wrong somewhere, which proves too much to be any use.

  Write me a procedure I can run on a candidate analogy before it goes in, grounded in the Hofstadter/Sander line that analogy-making and categorisation are the same activity — so importing a source drags in it's whole naive theory, not just the piece I wanted, and a category can be enriched later by analogy with ones you already have. I want the questions in order, what counts as a sufficient answer to each, and specifically: how to tell a misfit that sits there harmlessly from an entailment people will actually draw and act on; how to check the audience even has the source category; and where the thing stops and hands the call to a human because it isn't a factual question. Flag the steps that are judgment in a checklist costume.

  Then run it on three candidates for the same product: the rate limiter as a narrow pipe you're pouring through, the model as a well-read intern, and the version history as parallel universes. One of those I'm attached to and I expect your going to kill it — if so, say so plainly rather than softening it. Finish with what the procedure can't decide at all, and what would change your mind: which of your three verdicts is most likely wrong, and what consideration would flip it.
reasoning: |-
  We are given a scenario where we need to evaluate analogies for a dev-tools company. The procedure must be based on the Hofstadter/Sander idea that analogy-making and categorization are the same, meaning that when we import a source domain (the analogy) we bring in its entire naive theory. We also note that categories can be enriched later by analogy with existing ones.

  The procedure should answer:
  1. How to tell a misfit that is harmless from one that people will act on?
  2. How to check if the audience has the source category?
  3. When to stop and hand off to a human because it's not a factual question.

  We are to run the procedure on three candidate analogies:
     a. The rate limiter as a narrow pipe you're pouring through.
     b. The model as a well-read intern.
     c. The version history as parallel universes.

  The procedure should be a series of ordered questions with what counts as a sufficient answer. We must also flag steps that are judgment in disguise.

  ---

  ### Procedure for Evaluating an Analogy

  **Step 1: Identify the Target and Source Concepts**
     - **Question:** What is the target concept (the thing we are trying to explain) and what is the source concept (the analogy we are using)?
     - **Sufficient Answer:** Clearly state both. For example: Target = rate limiter, Source = narrow pipe.
     - **Why?** To have a clear understanding of what we are mapping.

  **Step 2: List the Intended Mappings**
     - **Question:** What specific aspects of the target concept do we intend to map from the source?
     - **Sufficient Answer:** List the key attributes, relationships, or behaviors we want the analogy to convey. For example: for a rate limiter as a narrow pipe, we might want to convey that it restricts flow, causes backpressure, and has a fixed capacity.
     - **Why?** To be explicit about what we want the analogy to do.

  **Step 3: Identify the Naive Theory of the Source**
     - **Question:** What is the everyday understanding (naive theory) that people have about the source concept? What are the typical attributes, behaviors, and causal relationships in the source domain?
     - **Sufficient Answer:** Describe the common knowledge about the source. For example, a narrow pipe: liquid flows through, if you pour too fast it spills or overflows, you can only get so much liquid through per unit time, etc.
     - **Why?** Because the whole naive theory comes with the analogy, not just the parts we want.

  **Step 4: Check Audience Familiarity with the Source**
     - **Question:** Is the source concept likely to be familiar to the target audience (developers)? How common is this knowledge?
     - **Sufficient Answer:** Use audience analysis (if available) or common sense. If the source is very common (like a pipe) then yes. If it's specialized (like a particular scientific concept) then no. If unsure, flag for human judgment (e.g., via user testing or expert review).
     - **Why?** If the audience doesn't know the source, the analogy fails.
     - **Judgment Flag:** This step is heavily dependent on audience knowledge, which may require research.

  **Step 5: Enumerate Potential Mappings (Including Unintended Ones)**
     - **Question:** What are all the possible mappings that a user might infer from the source's naive theory to the target? Include both the intended ones and any unintended ones that seem plausible.
     - **Sufficient Answer:** Brainstorm a list. For example, for the pipe analogy: 
          - Intended: limited flow rate, backpressure when over capacity.
          - Unintended: the pipe might get clogged (implying the rate limiter might get blocked by a single large request?), or that the liquid is continuous (but requests are discrete), or that you can change the pipe width easily (which might not be true).
     - **Why?** To uncover potential misunderstandings.

  **Step 6: Evaluate Harmfulness of Unintended Mappings**
     - **Question:** Which unintended mappings might lead users to draw incorrect conclusions and take harmful actions?
     - **Sufficient Answer:** For each unintended mapping, assess:
          - How likely is the user to make this connection?
          - How harmful would it be if they acted on it? (e.g., could it cause errors, inefficiency, or support tickets?)
     - **Judgment Flag:** This requires experience and understanding of user behavior. If there is a highly likely and highly harmful mapping, the analogy is risky.
     - **How to distinguish harmless misfits from harmful ones?** 
          - Harmless: The misfit is either very unlikely to be drawn by the user, or if drawn, it doesn't lead to any action that affects usage (e.g., a poetic but irrelevant aspect). 
          - Harmful: The misfit is likely and leads to incorrect reasoning that can cause real problems (e.g., misconfiguring the system, expecting behavior that doesn't exist).

  **Step 7: Check for Category Enrichment Potential**
     - **Question:** Could this analogy help in enriching the understanding of the target category in the future? (i.e., will it be a foundation for future analogies or concepts?)
     - **Sufficient Answer:** Consider if the analogy is a building block for more complex ideas. For example, the pipe analogy might extend to a network of pipes (for more complex systems). If it has good potential, that's a plus.
     - **Why?** Because categories are enriched by analogies.

  **Step 8: Compare with Existing Analogies in the Domain**
     - **Question:** Are there existing analogies in the product or in common use in the industry for this target? How does this candidate compare?
     - **Sufficient Answer:** If there is an established analogy, does this one conflict? If it does, that might cause confusion. If it's novel, does it add clarity?
     - **Why?** Consistency in the product's vocabulary is important.

  **Step 9: Human Judgment Call**
     - **Question:** After the above, are there unresolved issues that require human judgment?
     - **Sufficient Answer:** If the analysis above has highlighted risks (especially in Step 6) that are not clear-cut, or if there are trade-offs between clarity and risk, then flag for human decision (e.g., the CTO, a senior team member, or even user testing).
     - **Why?** Because some decisions are not purely factual and require weighing pros and cons.

  ---

  ### Running the Procedure on the Three Candidates

  We'll go through each analogy step by step.

  #### Candidate A: Rate limiter as a narrow pipe you're pouring through

  **Step 1: Target and Source**
     - Target: Rate limiter
     - Source: Narrow pipe

  **Step 2: Intended Mappings**
     - The rate limiter restricts the flow (of requests) to a maximum rate.
     - If you try to send too many requests too fast, they get queued (backpressure) or dropped (overflow).
     - The pipe width represents the rate limit.

  **Step 3: Naive Theory of Source**
     - Liquids flow through pipes. A narrow pipe allows less liquid per unit time than a wide one.
     - Pouring too fast causes spillage or overflow.
     - Pipes can get clogged, which stops flow entirely.
     - Flow is continuous (not discrete).

  **Step 4: Audience Familiarity**
     - High. Most people have seen water through pipes.

  **Step 5: Potential Mappings (intended and unintended)**
     - Intended: 
          - Narrow pipe -> low rate limit, wide pipe -> high.
          - Pouring too fast -> overflow (requests dropped) or backpressure (requests delayed).
     - Unintended:
          - Clogging: Users might think a single large request could clog the pipe (block the rate limiter) when in reality rate limiters typically handle large requests by counting them as multiple units or by time-based windows.
          - Continuous vs. discrete: Requests are discrete events, but liquid flow is continuous. This might lead to confusion about how the limiter counts (e.g., per request vs. per byte).
          - Changing the pipe: In a pipe, you can change the width (e.g., by replacing it) but in software, changing the rate limit might be dynamic and immediate.
          - Direction: Pipes are usually one-way, but network traffic can be two-way.

  **Step 6: Harmfulness of Unintended Mappings**
     - Clogging: If users think a large request can clog the system, they might avoid sending large requests or split them unnecessarily. This could be harmful if the system handles large requests without issue. Likelihood: moderate. Harm: moderate to high.
     - Continuous vs. discrete: Might lead to confusion about how the rate is measured (e.g., per second vs. per request). Likelihood: moderate. Harm: moderate (could cause misconfiguration).
     - Changing the pipe: Not likely to be harmful because the analogy doesn't usually extend to how you adjust the rate limit.
     - Verdict: There are harmful unintended mappings that are somewhat likely.

  **Step 7: Category Enrichment Potential**
     - Good. The pipe analogy can extend to systems with multiple pipes (e.g., different rate limits for different endpoints) and valves (controls). It's a common analogy in networking (e.g., bandwidth).

  **Step 8: Comparison with Existing Analogies**
     - The pipe analogy is common in rate limiting (e.g., "throttling" is often explained with pipe metaphors). It's consistent.

  **Step 9: Human Judgment Call**
     - The unintended mappings are a concern. However, the analogy is so common that the benefits might outweigh the risks. But note: the clogging issue might need to be explicitly addressed in documentation.

  **Overall Verdict for A: Acceptable with caution.** The analogy is useful and common, but we must explicitly debunk the clogging idea and clarify that requests are discrete.

  ---

  #### Candidate B: The model as a well-read intern

  **Step 1: Target and Source**
     - Target: Model (likely a machine learning model, e.g., in an AI tool)
     - Source: Well-read intern

  **Step 2: Intended Mappings**
     - The model has read a lot of data (like an intern who has read many books).
     - It can answer questions based on what it has read, but not perfectly.
     - It might make mistakes and require checking.

  **Step 3: Naive Theory of Source**
     - An intern is a junior person, eager but inexperienced.
     - They have read a lot but may not have deep understanding.
     - They can do tasks but need supervision.
     - They can learn on the job and improve with feedback.
     - They can be creative but sometimes inappropriately.

  **Step 4: Audience Familiarity**
     - High. Most developers have heard of interns or have been one.

  **Step 5: Potential Mappings**
     - Intended:
          - Well-read -> trained on a lot of data.
          - Can answer questions -> can generate responses.
          - Not perfect -> may make mistakes.
     - Unintended:
          - An intern is a person -> the model has consciousness, intentions, or feelings (anthropomorphization).
          - An intern can learn from each interaction -> but the model might be static (unless it's an online learning model) and doesn't learn from each user interaction.
          - An intern requires supervision -> the model must be constantly monitored by a human? (might lead to over-trust or under-trust)
          - An intern can be asked to do tasks beyond reading -> the model might be expected to perform actions (like executing code) when it only generates text.

  **Step 6: Harmfulness of Unintended Mappings**
     - Anthropomorphization: Very likely. Users might attribute intentions or feelings to the model, leading to confusion about how it works. Harm: high (could lead to ethical concerns, misreporting issues).
     - Learning from interactions: If the model is static, users might think it's learning from them and adjust their behavior (e.g., expecting it to improve without retraining). Likelihood: moderate. Harm: high (could cause incorrect assumptions about model behavior).
     - Supervision: Users might think they must monitor every output, which could be burdensome, or they might under-supervise because they think the intern is "well-read" and thus reliable. Harm: moderate.
     - Task generalization: Users might ask the model to do things it cannot (like taking actions). Likelihood: moderate. Harm: moderate.

  **Step 7: Category Enrichment Potential**
     - Moderate. The intern analogy might help in explaining training (like the intern reading books) and fine-tuning (like giving the intern feedback). But it might not scale to more complex behaviors.

  **Step 8: Comparison with Existing Analogies**
     - Analogies for AI models as humans are common (e.g., "like a smart assistant") but also controversial because of anthropomorphism.

  **Step 9: Human Judgment Call**
     - The risks are high, especially anthropomorphism and the learning misconception. This might lead to significant support tickets and misuses.

  **Overall Verdict for B: Reject.** The unintended mappings are too harmful and likely. The analogy might cause more problems than it solves. (Note: This is probably the one you're attached to, and I'm killing it plainly.)

  ---

  #### Candidate C: Version history as parallel universes

  **Step 1: Target and Source**
     - Target: Version history (e.g., in source control)
     - Source: Parallel universes

  **Step 2: Intended Mappings**
     - Each version is a separate universe that exists independently.
     - You can branch (create a new universe) and merge (combine universes).
     - You can travel between versions (like moving between universes).

  **Step 3: Naive Theory of Source**
     - Parallel universes are alternate realities that exist simultaneously.
     - They might have diverged from a common point.
     - Travel between them might be possible in science fiction.
     - They are distinct and what happens in one doesn't affect the others (unless there is interaction).

  **Step 4: Audience Familiarity**
     - Moderate to High. Parallel universes are a common sci-fi trope, but not everyone might be deeply familiar.

  **Step 5: Potential Mappings**
     - Intended:
          - Branching -> creating a new universe from a point in time.
          - Merging -> combining two universes (though this is less common in sci-fi).
          - Checking out a version -> traveling to that universe.
     - Unintended:
          - In parallel universes, events happen independently and simultaneously -> but in version history, only one version is active at a time? (unless you have multiple branches being developed simultaneously, but the "universe" is not running in the background).
          - Merging might be seen as a cataclysmic event (like a universe collision) that destroys one? But in version control, merging is non-destructive.
          - Parallel universes are often depicted as having slight differences that lead to big changes (butterfly effect) -> users might be afraid to merge because of unexpected consequences.
          - Travel between universes might be seen as risky (e.g., you can get stuck) -> users might fear switching branches.

  **Step 6: Harmfulness of Unintended Mappings**
     - Simultaneity: Version history doesn't run in parallel unless you have concurrent branches. But in reality, branches are worked on concurrently by developers. This mapping is actually intended? However, the analogy might make users think that the universe is running in the background (which it isn't). Likelihood: low. Harm: low.
     - Merging as destructive: This is a risk. If users think merging is dangerous, they might avoid it. Likelihood: moderate (because of sci-fi tropes). Harm: high (could lead to merge aversion).
     - Butterfly effect: Users might overestimate the risk of small changes. Likelihood: moderate. Harm: moderate (could cause over-caution).
     - Travel risk: Users might be afraid to switch branches. Likelihood: low. Harm: low.

  **Step 7: Category Enrichment Potential**
     - Good. The parallel universe analogy can help explain branching and forking. It can also extend to more complex scenarios (e.g., multiverse of features).

  **Step 8: Comparison with Existing Analogies**
     - The "tree" analogy is common for version history (branches). The parallel universe is a bit more vivid but less standard.

  **Step 9: Human Judgment Call**
     - The merging issue is a concern. We must ensure that the analogy doesn't make merging seem scary. Also, the audience might not all know the trope.

  **Overall Verdict for C: Acceptable with caution.** The analogy is vivid and can be helpful, but we must explicitly address that merging is safe and non-destructive. Also, we should avoid implying that branches are running in the background.

  ---

  ### What the Procedure Can't Decide

  The procedure cannot decide:
     - **Aesthetic value:** How memorable or engaging the analogy is.
     - **Cultural fit:** Whether the analogy aligns with the company's brand voice.
     - **Long-term scalability:** How the analogy will hold up as the product evolves (unless we consider Step 7, which is speculative).
     - **Competitive differentiation:** Whether the analogy is unique and helps the product stand out.

  ### Which Verdict is Most Likely Wrong?

  The verdict most likely to be wrong is **Candidate C: Version history as parallel universes**. The potential harm in the merging part (making it seem dangerous) might be overblown if the audience is sophisticated enough to separate sci-fi drama from reality. Also, if the documentation explicitly and clearly explains that merging is safe, the analogy might be very effective.

  **What would flip the verdict?** 
     - If user testing shows that developers find the parallel universe analogy intuitive and not scary, and they don't infer that merging is destructive, then it could be a good choice. Also, if the product is targeted at an audience that loves sci-fi (e.g., game developers), it might resonate well.

  ### Final Note

  The procedure is a structured way to uncover risks, but the final decision should involve user testing and stakeholder input, especially for high-stakes analogies.
answer: |-
  Here's a structured procedure grounded in Hofstadter/Sander's theory of analogy-as-categorization, designed to catch high-stakes misfits in technical analogies. Steps flagged with ⚖️ require human judgment disguised as checklists.

  ---

  ### **Analogy Evaluation Procedure**  
  **Core Principle:** Analogies import the *entire naive theory* of the source category. Your audience will unconsciously fill gaps with source-domain assumptions.

  #### **Step 1: Map the Source Category's Naive Theory**  
    - **Question:** What are the 3-5 core attributes, cause-effect relationships, and implicit rules in the source category?  
    - **Sufficient Answer:** List attributes (e.g., "pipes have friction"), relationships (e.g., "wider pipe → faster flow"), and cultural assumptions.  
    - **Stop if:** The source category is too vague (e.g., "cloud") or culturally niche.  
    - *⚖️ Judgment:* Requires imagining a non-expert's mental model.  

  #### **Step 2: Audit Audience Familiarity**  
    - **Question:** Is this source category universally familiar to our audience (e.g., junior devs)?  
    - **Sufficient Answer:** Yes if 90%+ likely known (e.g., "pipe"); No if abstract (e.g., "quantum field").  
    - **Handoff:** If "No," discard or validate via 5-min user survey (e.g., "Describe how a rate limiter works using kitchen appliances").  

  #### **Step 3: Identify Target-Source Mappings**  
    - **Question:** Which source attributes *exactly* map to the target? List 1:1.  
      *(Example: Pipe diameter ↔ Rate limit config)*  
    - **Sufficient Answer:** 3-5 precise mappings max. Fewer → safer analogy.  

  #### **Step 4: Enumerate High-Probability Entailments**  
    - **Question:** What unstated source attributes might users *reasonably* apply to the target?  
    - **Sufficient Answer:** List 3+ likely entailments (e.g., "Pipes leak → Rate limiter loses requests").  
    - **Harm Test:**  
      - **Harmless misfit:** Poetic but inert (e.g., "Pipes are made of metal → Rate limiter is physical").  
      - **Harmful entailment:** Likely to drive *action* (e.g., "Leaky pipes need sealing → User builds redundant limiters").  
    - *⚖️ Judgment:* Harm scales with user autonomy. More configurable features → higher risk.  

  #### **Step 5: Stress-Test Category Boundaries**  
    - **Question:** Where does the source category *demand* properties that contradict the target?  
    - **Sufficient Answer:** Conflicts that break core functionality (e.g., "Parallel universes can’t merge ↔ Git branches *must* merge").  
    - **Handoff:** If found, human must decide if mitigable (e.g., explicit warnings).  

  #### **Step 6: Check for "Naive Theory" Overextension**  
    - **Question:** Could this analogy "infect" future features?  
      *(Example: If "model = intern," users might expect "interns" to learn from feedback → online training)*  
    - **Sufficient Answer:** Flag if source implies growth/change mechanisms the target lacks.  

  #### **Step 7: Final Veto Gate**  
    - **Question:** Does the analogy *simplify* more than it *misleads*?  
    - **Handoff:** Human (e.g., CTO) must sign off if:  
      - Entailments found in Step 4 could cause support tickets.  
      - Competing analogies exist in the product.  

  ---

  ### **Evaluation of Your Candidates**  
  *Assumed audience: Developers with 1–3 years experience.*

  #### **Candidate 1: Rate Limiter = Narrow Pipe**  
    - **Step 1 (Naive Theory):** Pipes constrain flow, burst under pressure, leak if faulty, require widening to fix.  
    - **Step 2 (Familiarity):** Yes.  
    - **Step 4 (Entailments):**  
      - Harmless: "Pipes are cylindrical."  
      - **Harmful:** "Leaks are inevitable → Rate limiter drops requests under load (may trigger over-engineering)."  
    - **Step 5 (Boundaries):** Pipes handle liquids (continuous), not requests (discrete). Low conflict.  
    - **Verdict:** **ACCEPT** with mitigation. Explicitly state: "Does *not* leak or burst."  

  #### **Candidate 2: Model = Well-Read Intern**  
    - **Step 1 (Naive Theory):** Interns learn from experience, ask questions, get tired, make typos, need supervision.  
    - **Step 2 (Familiarity):** Yes.  
    - **Step 4 (Entailments):**  
      - Harmless: "Interns drink coffee → Model runs on compute."  
      - **Harmful:** "Interns learn over time → Model must improve with use (may ignore retraining)."  
      - **Harmful:** "Interns can explain reasoning → Model is interpretable (may cause false trust)."  
    - **Step 5 (Boundaries):** Interns have agency; models are deterministic. **Critical conflict.**  
    - **Step 6 (Overextension):** Will invite demands for "teaching" the model interactively.  
    - **Verdict:** **REJECT.** This is the one you're attached to—I'm killing it. Anthropomorphizing models consistently causes dangerous reasoning in practice (e.g., expecting commonsense or memory).  

  #### **Candidate 3: Version History = Parallel Universes**  
    - **Step 1 (Naive Theory):** Universes are immutable, diverge infinitely, can’t interact, imply "alternate realities."  
    - **Step 2 (Familiarity):** Medium (sci-fi common, but not universal).  
    - **Step 4 (Entailments):**  
      - Harmless: "Universes have unique laws → Branches have different rules."  
      - **Harmful:** "Universes can’t merge → Git merges are impossible (may deter branch integration)."  
    - **Step 5 (Boundaries):** Merging universes violates physics; merging branches is essential. **Critical conflict.**  
    - **Verdict:** **REJECT.** The "no merging" entailment directly contradicts core functionality.  

  ---

  ### **What the Procedure Can’t Decide**  
  1. **Engagement vs. precision tradeoffs:** Some inaccuracies may be worth it for intuitiveness.  
  2. **Cultural shifts:** An analogy that’s safe today may misfire as language evolves (e.g., "cloud").  
  3. **Emotional resonance:** "Intern" feels relatable but causes harm—your procedure won’t flag this as a *benefit*.  

  ### **Which Verdict is Most Likely Wrong?**  
  **Rate Limiter = Pipe** has the shakiest verdict. It could flip if:  
  - Your users work in domains where "pipe" implies *lossy transport* (e.g., networking). Entailments like "packets always drop under throttling" could trigger over-engineering.  
  - **Mitigation:** User-test with: "If the pipe clogs, what should you do?" If >20% say "Add more pipes," kill it.  

  ---

  **Summary**  
  Your "intern" analogy is the riskiest—it invites vital inferences you can't control. Use the procedure to force explicit entailment mapping, but pair it with lightweight user testing ("How would you improve the intern?"). Remember: all analogies *are* wrong somewhere, but the goal is to quarantine the harmful wrongness.
