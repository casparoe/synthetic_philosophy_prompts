prompt: |-
  I am a software engineer with no formal training in philosophy, and I am building an internal tool that combines individual engineers' judgments into a single team judgment. In testing the logic I ran into a pattern I do not have good vocabulary for, and I would like help finding the principle behind my own reactions to cases. Please write your answer in American English.

  The tool asks each engineer to vote yes or no on two factual premises and also on a conclusion that follows from them, then it has to publish a team position that is logically consistent. The puzzle is that majority votes on the premises and majority votes on the conclusion can point in opposite directions.

  Here are five test cases I ran through, with what felt right to me in each:

  Case 1, bug triage. Three reviewers vote on whether a bug is release-blocking. Premise A is the bug reproduces reliably, Premise B is the behavior violates the specification, Conclusion C is the bug blocks release, where C follows if A and B are both true. The votes are Engineer 1: yes, yes, yes; Engineer 2: yes, no, no; Engineer 3: no, yes, no. So a majority says yes to A, a majority says yes to B, but a majority says no to C. My verdict: the tool should publish yes to A, yes to B, and yes to C as the team view, overriding the majority no on C. Publishing an inconsistent set, or letting the conclusion vote defeat two premise majorities, seems worse.

  Case 2, deploy decision. Same voting pattern and same logical structure. Premise A is the migration will finish in the maintenance window, Premise B is the rollback plan has been tested, Conclusion C is proceed with tonight's migration, where C follows if A and B are both true. Votes are identical to Case 1. My verdict here is the opposite: the tool should publish do not proceed. Even though premise majorities support proceeding, a direct majority against proceeding on a high-stakes action feels controlling, and auto-overriding it to force a deploy feels wrong.

  Case 3, incident review. Premise A is Alice authored the configuration change, Premise B is that change caused the outage, Conclusion C is Alice is accountable for the outage under our review policy, where C follows if A and B are both true. Votes are again Engineer 1: yes, yes, yes; Engineer 2: yes, no, no; Engineer 3: no, yes, no. My verdict: the tool should not publish either a yes or a no on C. It should publish the premise majorities and flag C as unresolved for human discussion. Forcing a team verdict that someone is accountable when most reviewers voted not accountable seems unfair, but so does manufacturing accountability from premise votes.

  Case 4, failover. Now the logic is a disjunction. Premise A is primary database A is unhealthy, Premise B is primary database B is unhealthy, Conclusion C is route traffic to the backup region, where C follows if A or B is true. Votes are Engineer 1: no, no, yes; Engineer 2: no, yes, yes; Engineer 3: yes, no, yes. So a majority says no to A, a majority says no to B, but everyone says yes to C on their own ballot. My verdict: the tool should publish yes to C and trigger the routing, even though that combination is inconsistent if you take the premise majorities literally. Unanimity on the conclusion seems to carry special weight here.

  Case 5, expertise. Back to conjunction for a launch check. Premise A is load testing passed, Premise B is the cryptography implementation was audited, Conclusion C is the service is ready. Engineer 1, our only security specialist, votes yes, yes, yes. Engineer 2 votes yes, no, no. Engineer 3 votes yes, no, no. So there is unanimity on A, a 2-1 majority against B, and a 2-1 majority against C. My verdict: the tool should defer to the specialist on B and publish yes, yes, yes. I am uneasy about this because it abandons one-person-one-vote, but counting uninformed votes equally on an audit question seems worse.

  My tentative rule was something like follow premise majorities for factual questions, follow conclusion majorities for actions, and defer to experts when recognized, but Cases 2 and 3 both involve actions and I treat them differently, and Case 4 suggests unanimity matters in a way my rule does not capture.

  Is there a precise principle, or a small set of candidate principles, that captures most of these verdicts? For each candidate, please state it exactly, explain which case motivates each part of it, say what it predicts for two further situations I have not resolved — first, a case where one voter abstains on a premise but votes on the conclusion, and second, a chained case where the conclusion of one vote becomes a premise for the next — and give an honest assessment of which of my five verdicts the principle cannot accommodate and whether I should revise that verdict or accept a more complicated rule to save it.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user is a software engineer building a tool to aggregate individual judgments into a team decision. They've encountered cases where majority votes on premises and conclusions conflict, and their intuitive responses vary. I need to find principles that explain their reactions.

  First, looking at Case 1 (bug triage): They override the conclusion majority to follow premise majorities. That makes sense because the premises are factual, and the conclusion logically follows. Consistency matters here.

  Case 2 (deploy decision) is similar but they go with the conclusion majority. The key difference seems to be the high stakes and action-oriented nature. Overriding a direct "no" on deployment could have serious consequences, so the conclusion vote takes precedence.

  Case 3 (incident review) is tricky. They avoid publishing any conclusion because accountability has fairness implications. Even though premises have majorities, forcing a conclusion might assign blame unfairly. This suggests that when outcomes affect people directly, consensus or human judgment is needed.

  Case 4 (failover) is interesting. Despite premise majorities against, the unanimous "yes" on the action suggests unanimity can override premise votes. The urgency of the action (routing traffic) likely plays a role here, and unanimous agreement on the action outweighs inconsistent premises.

  Case 5 (expertise) shows deference to specialists. The security expert's vote on the audit premise overrides the majority. This implies that for specialized knowledge, expertise trumps equal voting, especially when others might lack the necessary knowledge.

  Now, the user mentioned tentative rules like following premises for facts, conclusions for actions, and deferring to experts. But Cases 2 and 3 are both actions yet handled differently. Case 2 (deploy) follows conclusion majority, while Case 3 (accountability) avoids a conclusion. The difference might be in consequences: deploying affects systems, accountability affects a person's reputation. So stakes and human impact matter.

  Also, Case 4's unanimity isn't covered in their initial rule. Unanimous conclusions seem to override premise majorities in urgent actions.

  Putting this together, the principles needed are:

  1. **Epistemic vs. Practical Authority**: Factual premises should be aggregated independently, but practical decisions (actions) should respect direct votes, especially under high stakes or unanimity.

  2. **Moral/Reputational Stakes**: When conclusions involve blame or fairness, avoid automated decisions and require discussion.

  3. **Expertise Recognition**: Override votes on specialized premises if an expert is identified.

  4. **Unanimity Override**: Unanimous conclusions can justify overriding inconsistent premises in urgent actions.

  For the abstention case, if someone skips a premise but votes on the conclusion, the principle would handle the conclusion vote as an override in action contexts but require consistency in factual ones. For chained logic, each step's premises and conclusions need separate aggregation, possibly propagating inconsistencies, which might need human intervention.

  Assessing the principles against their verdicts: Principle 1 covers Cases 1 and 2. Principle 2 explains Case 3. Principle 4 fits Case 4. Principle 3 handles Case 5. All verdicts are accommodated except maybe Case 3's "unresolved" flag, which aligns with Principle 2. The abstention and chained cases require careful handling based on context, showing the need for configurable rules in the tool.
answer: |-
  Based on your cases, your intuitive verdicts reveal a sophisticated interplay between **logical consistency**, **practical stakes**, **expertise**, and **moral consequences**. There isn't a single universal rule, but a small set of principles explains all five cases. I'll define the principles, map them to your cases, test them against your unresolved situations, and assess fit.

  ---

  ### **Three Core Principles**
  1. **Epistemic Authority for Factual Premises**  
     *When premises are objective facts, aggregate them independently via majority vote. Derive the conclusion logically from the aggregated premises, overriding direct conclusion votes.*  
     - **Motivation**: Case 1 (bug triage). Premises (reproducibility, spec violation) are verifiable facts. Overriding the direct "no" on C preserves logical consistency and avoids absurdity (e.g., affirming A and B but denying their logical consequence).  

  2. **Practical Authority for High-Stakes Actions**  
     *For conclusions involving irreversible actions, high costs, or safety risks, defer to the direct majority vote on the conclusion, even if it contradicts the logical derivation from premises.*  
     - **Motivation**: Case 2 (deploy decision). Overriding a direct "no" on deploying could force a catastrophic action against the team's expressed will. Case 4 (failover) also fits: Unanimity on C (routing traffic) overrides premise majorities because immediate action is urgent, and unanimous agreement signals high confidence.  

  3. **Moral/Reputational Delegation for Accountability**  
     *When the conclusion assigns blame, credit, or legal/ethical responsibility, avoid automated resolution. Publish premise-level results but flag the conclusion for human discussion.*  
     - **Motivation**: Case 3 (incident review). Automating accountability (e.g., "Alice is responsible") risks unfairness or legal exposure. Premise-level data (e.g., "most say Alice authored the change") informs humans without imposing a verdict.  

  **Special Cases**:  
  - **Expertise Override** (Case 5): *For specialized premises requiring niche knowledge, defer to the recognized expert if their vote aligns with their domain.* This is a corollary of Epistemic Authority—facts still rule, but expertise refines what counts as reliable input.  
  - **Unanimity Override** (Case 4): *Unanimity on a conclusion can justify overriding inconsistent premises in action-oriented contexts*, reinforcing Practical Authority.  

  ---

  ### **Predictions for Unresolved Situations**
  #### **Situation 1: Abstention on a Premise**  
  *Scenario*: 4 engineers vote on a bug (A: reproducible, B: spec-violating, C: release-blocking). Votes:  
  - Eng 1: A=yes, B=yes, C=yes  
  - Eng 2: A=yes, B=no, C=no  
  - Eng 3: A=no, B=yes, C=no  
  - Eng 4: A=abstain, B=yes, C=no  

  **Analysis**:  
  - **Epistemic Authority (factual)**:  
    - A: Majority yes (Eng 1,2 vs. Eng 3; abstention ignored).  
    - B: Majority yes (Eng 1,3,4 vs. Eng 2).  
    - Derive C=yes logically.  
  - **Practical Authority (action)**: If C is high-stakes (e.g., deploy), direct vote is 3 no vs. 1 yes → publish C=no.  
  - **Abstention Handling**: Treat abstentions as non-votes (don’t count toward majority thresholds). Principle choice depends on context (factual vs. action).  

  #### **Situation 2: Chained Logic**  
  *Scenario*: Two linked votes. First vote: A, B, C (C = A ∧ B). Second vote: C (as premise), D, E (E = C ∧ D). Votes for first vote match Case 1 (majority A=yes, B=yes, but majority C=no).  

  **Analysis**:  
  - **Step 1**: Apply Epistemic Authority → Publish A=yes, B=yes, C=yes (derived).  
  - **Step 2**: Use C=yes (derived) as input for the second vote. Aggregate D and E independently:  
    - If D is factual, apply Epistemic Authority → derive E from C and D.  
    - If E is high-stakes (e.g., "shut down system"), defer to direct vote on E.  
  - **Risk**: Propagating derived premises could amplify errors. Mitigate by flagging derived values in the UI.  

  ---

  ### **Assessment Against Your Verdicts**
  | Case | Your Verdict                       | Principles Supported?                                     | Mismatch Analysis |  
  |------|------------------------------------|-----------------------------------------------------------|-------------------|  
  | 1    | Publish A=yes, B=yes, C=yes       | **Yes** (Epistemic Authority)                             | Perfect fit.      |  
  | 2    | Publish C=no (don’t deploy)       | **Yes** (Practical Authority)                             | Perfect fit.      |  
  | 3    | Publish A/B, flag C unresolved    | **Yes** (Moral Delegation)                                | Perfect fit.      |  
  | 4    | Publish C=yes (route traffic)     | **Yes** (Practical Authority + Unanimity Override)        | Perfect fit.      |  
  | 5    | Publish A=yes, B=yes, C=yes       | **Partial** (Expertise Override applies to B, but C=yes is derived) | *Minor tension*: Expertise Override justifies B=yes, but direct 2-1 majority against C is ignored. **Acceptable**: Epistemic Authority prioritizes factual correctness over direct votes. |  

  **Key Insight**: All your verdicts are accommodated. Case 5 is the tightest fit—Expertise Override modifies the input to Epistemic Authority, making your verdict defensible.  

  ---

  ### **Recommendations for Your Tool**
  1. **Implement Contextual Rules**:  
     - Tag votes as `factual`, `action`, or `accountability` during setup.  
     - `Factual` → Epistemic Authority (derive conclusion).  
     - `Action` → Practical Authority (defer to direct conclusion vote).  
     - `Accountability` → Moral Delegation (flag conclusion for humans).  
     - Add flags for `expertise_override` (user-defined roles) and `unanimity_override` (auto-trigger for unanimous conclusions).  

  2. **Handle Edge Cases**:  
     - **Abstentions**: Exclude from majority calculations; treat as "no opinion."  
     - **Chained Logic**: Propagate derived premises visibly (e.g., "C=yes [derived]") and apply rules recursively.  

  3. **Revise Verdicts?** No need—your intuition aligns with robust philosophical distinctions:  
     - **Epistemic vs. Practical Authority** mirrors *belief-desire psychology* (facts vs. actions).  
     - **Moral Delegation** avoids *moral hazard* from automated blame.  
     - **Expertise/Unanimity** reflects *social epistemology* (group knowledge isn't always democratic).  

  This approach balances logic with real-world stakes. If you share specifics of the two unresolved situations, I can refine predictions further.
