  First, I need to recall the key facts of the internment and the 1988 Civil Liberties Act. Over 100,000 Japanese Americans were forcibly relocated and detained. Decades later, a commission found it was due to prejudice, leading to an apology and reparations. 

  Mapping to the textbook model: The apologizer is the U.S. government, represented by Congress. The recipients are surviving internees and the Japanese American community, but also the broader public and future generations. The law clearly acknowledges the wrong and accepts responsibility. Reparations include monetary payments and educational support. However, the denial of broader legal liability is a complication.

  For the strains: Government turnover means the current administration isn't the one that committed the wrong. Recipients include those beyond direct victims, like descendants. The denial of liability creates tension with the apology's sincerity. Comparing the variants shows that without reparations, the commitment is weak, and without responsibility, it's not a true apology.

  The user might be grappling with whether state apologies can ever meet the ideal model or if they're inherently symbolic. They might need this analysis to argue their point in the seminar. The deeper need could be understanding the practicality of political ethics in real-world scenarios versus theoretical ideals. 

