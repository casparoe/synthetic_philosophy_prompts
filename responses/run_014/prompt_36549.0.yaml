  Below is a decision-tree handout designed to sort students' views on future contingents based on their concrete case judgments. It starts from the sentence "There will be a sea battle tomorrow" (asserted today) and uses binary questions to navigate the logical space. The tree has 7 nodes (5 internal questions, 2 clarifying follow-ups) and 7 leaves (5 requested positions, 1 additional position, 1 unoccupied leaf). It explicitly incorporates your two key cases (the disjunction and retrodiction) and flags conflation risks.

  ---

  **Future Contingents Decision Tree**  
  *Start with: "There will be a sea battle tomorrow" (asserted today).*

  **Q1. Bivalence**:  
  Is this sentence *either true or false* today?  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q4.  

  **Q2. Retrodiction (fixed past)**:  
  A historian in 2060 (with lost records) asks: "Was there a sea battle on March 3rd?" (today’s tomorrow). Does this *past-tensed sentence* have a truth value in 2060?  
  - **Yes** → Go to Q3.  
  - **No** → ✗ **Incoherent under bivalence** (unoccupied).  
  *Diagnosis*: Bivalence requires settled truth values, but denying truth values for knowably settled past facts is contradictory.  

  **Q3. Present truthmaker**:  
  If "There will be a sea battle tomorrow" is true today, must there be a *present fact* (e.g., current causes, truthmaker) that grounds its truth?  
  - **Yes** → ● **Thin Red Line** (TRL). One future is "marked" as actual now.  
  - **No** → ● **Ockhamism**. Truth depends on future events; no present fact needed.  

  **Q4. Disjunction**:  
  Is "Either there will be a sea battle tomorrow or there won’t" *true* today?  
  - **Yes** → Go to Q5.  
  - **No** → Go to Q6.  

  **Q5. Branching futures**:  
  Could the future unfold in *multiple genuinely possible ways* (e.g., branches, histories)?  
  - **Yes** → ● **Supervaluationism** (Super). Truth = supertruth (true on all branches).  
  - **No** → ● **Growing-Block Open Futurism** (GB). Only past/present exist; future unreal.  

  **Q6. Retrodiction (open future)**:  
  Same as Q2: Does the historian’s past-tensed sentence have a truth value in 2060?  
  - **Yes** → ● **Łukasiewicz Three-Valued View** (L3). Future contingents are indeterminate; past is fixed.  
  - **No** → ● **Peircean View**. "Will" means "must"; truth requires inevitability.  

  ---

  ### Key Features
  1. **Your Cases Incorporated**:  
     - **Disjunction (Q4)**: Splits Łukasiewicz (disjunction not true) from Super/GB (disjunction true).  
     - **Retrodiction (Q2/Q6)**: Splits truthmaker views (require fixed past; Q2=Yes) from epistemic/access views (deny truth without evidence; Q6=No).  

  2. **Named Positions Covered**:  
     - Łukasiewicz (L3), Supervaluationism (Super), Ockhamism, Growing Block (GB), Thin Red Line (TRL), + Peircean View.  
     - Unoccupied leaf: "Incoherent under bivalence" (if Q2=No).  

  3. **Conflation Warnings**:  
     - **Ockhamism vs. TRL**: Separated by Q3 (present truthmaker). TRL requires present grounding; Ockhamism does not.  
     - **Peircean vs. Supervaluationism**: Peircean ends at Q6 (disjunction not true + retrodiction denied); Super ends at Q5 (disjunction true + branching). They’re distinct!  
     - **Łukasiewicz vs. Peircean**: Both say disjunction not true (Q4=No), but split on retrodiction (Q6=Yes vs. No).  

  4. **Determinism Note** (margin):  
     *If determinism is true, the future is not open. Then:*  
     - Q1=Yes (bivalence holds), Q4=Yes (disjunction true), Q5=No (no branching).  
     - Ockhamism and TRL merge (both accept bivalence + unique future).  
     - Non-bivalence views (L3, Super, GB, Peircean) collapse or become incoherent.  

  5. **Tree Logic**:  
     - Max nodes: 7 (5 questions + 2 paths).  
     - Unanswered splits: None! All paths lead to a leaf.  

  ---

  **Handout Format** (printable):  
  ```  
  [Start]  
  │  
  Q1: Is "There will be a sea battle tomorrow" either true or false today?  
  ├─(Yes) → Q2: Does the historian's past-tensed sentence (2060) have a truth value?  
  │  ├─(Yes) → Q3: If true, must it have a present truthmaker?  
  │  │  ├─(Yes) → ● THIN RED LINE  
  │  │  └─(No) → ● OCKHAMISM  
  │  └─(No) → ✗ Incoherent under bivalence  
  └─(No) → Q4: Is "Either there will be a sea battle or there won't" true today?  
     ├─(Yes) → Q5: Could the future unfold in multiple ways?  
     │  ├─(Yes) → ● SUPERVALUATIONISM  
     │  └─(No) → ● GROWING BLOCK  
     └─(No) → Q6: Does the historian's past-tensed sentence (2060) have a truth value?  
        ├─(Yes) → ● ŁUKASIEWICZ (3-VALUED)  
        └─(No) → ● PEIRCEAN VIEW  
  ```  

  This tree forces students to confront case judgments before labels, using your seminar-tested nodes. The retrodiction case (Q2/Q6) ensures truthmaker-based views (Ockhamism, TRL, L3) split from epistemic-access views (Peircean). Determinism collapses Ockhamism/TRL and voids non-bivalence leaves.
