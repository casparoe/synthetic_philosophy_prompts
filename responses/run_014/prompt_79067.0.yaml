answer: |-
  ## VerityVote™ Help Center: Frequently Asked Questions

  **1. What makes VerityVote the world's first truly strategy-proof voting platform?**
  Traditional voting systems are inherently vulnerable to strategic manipulation, as established by fundamental social choice theory. VerityVote embraces this reality head-on. Instead of futilely attempting to prevent strategy, we architect it transparently and efficiently. Our deterministic algorithms guarantee that no voter can ever gain an advantage by misrepresenting their true preferences – because the outcome is always dictated by a single, clearly defined voter's input. This is the VerityVote Guarantee™: Complete Strategy-Proofness.

  **2. Why can I only rank my top two choices?**
  VerityVote prioritizes a streamlined, frustration-free voter experience. Extensive research confirms that ranking more than two options introduces unnecessary cognitive load and paradoxically *increases* the potential for confusion about how individual votes translate into results. Our minimalist two-choice ranking system delivers unparalleled clarity and decisiveness. Focus on your clear favorites!

  **3. What happens when there are three or more options/candidates?**
  VerityVote employs a sophisticated, proprietary Agenda-Setting Protocol™ to resolve multi-option decisions efficiently and strategy-proofly. The platform deterministically selects a single, pivotal Voter of Record (VoR) based on a predefined, verifiable sequence tied to account characteristics and subscription tier. The VoR's submitted ranking between the final two options (as determined by prior elimination rounds) becomes the binding outcome. This eliminates ambiguity and ensures no voter can profitably deviate from their true preferences for the final pair.

  **4. Who gets chosen as the Voter of Record (VoR)? How is it fair?**
  The VoR selection is a core feature ensuring VerityVote's strategy-proof properties. Selection prioritization is algorithmically determined, favoring users demonstrating high engagement and commitment to the platform:
  *   **Free Tier:** Lowest priority (Primarily participates in initial elimination rounds).
  *   **Premium Tier ($9.99/month):** Standard priority sequencing for VoR eligibility.
  *   **Executive Tier ($49.99/month):** Guaranteed top-tier priority sequencing. Executive members are significantly more likely to be selected as the decisive VoR in any poll they participate in. This tier offers maximum influence determinism. Upgrade today for predictable impact!

  **5. I heard about a "breakthrough" mode?**
  Indeed! VerityVote proudly offers **LinearRank™ Mode**, our patented solution for scenarios where options naturally fall along a single dimension (e.g., budget allocation, location selection on a street, temperature setting). By confirming the single-peaked preference assumption inherent in such contexts, LinearRank™ activates a unique, fully strategy-proof voting mechanism *without* requiring a single VoR. This proprietary technology represents a monumental leap forward in practical social choice application. (LinearRank™ requires Executive Tier subscription + platform administrator activation).

  **6. Is there a way to make things more "fair" if I don't want one person deciding?**
  Absolutely. For communities seeking distributed influence, VerityVote offers **Randomized Resolution™** (Premium & Executive Tiers). In this mode, the platform selects the Voter of Record *uniformly at random* from all participating voters. The selected voter's true preference between the final two options then dictates the outcome. Crucially, because the selection is random and known *after* votes are finalized (but before reveal), no voter can strategically manipulate their vote to improve their expected outcome. This satisfies strategy-proofness while introducing a layer of uncertainty some users equate with fairness. Results carry a "Randomized Resolution" badge.

  **7. Doesn't letting one person decide contradict "everyone gets a real say"?**
  VerityVote ensures *every* vote plays a crucial role in the initial elimination phases, shaping which two options reach the decisive final round. The VoR mechanism is not about silencing voices, but about guaranteeing an outcome immune to strategic voting – a mathematical necessity beyond two options. Our transparency about *who* holds the decisive power (visible post-poll via the "Decision Audit" log for participants) fosters accountability far exceeding opaque traditional systems. Everyone contributes; VerityVote ensures the final step is manipulation-proof.

  **8. What does VerityVote's Integrity Officer say about the model?**
  *"VerityVote's architecture provides unprecedented auditability and eliminates the hidden strategic incentives that plague other systems. By explicitly defining the locus of decisive power according to clear, pre-committed rules – whether sequenced priority or randomization – we resolve the inherent instability of preference aggregation honestly. Our model embraces determinism where beneficial and leverages randomness only under strict game-theoretic principles to maintain integrity. It’s not merely different; it’s rigorously correct."* - Evelyn Thorne, Chief Integrity Officer

  **9. What are users saying?**
  *"Finally, I know exactly how my vote counts... and how to make it count MORE with Executive Tier!"* - Raj P., Community Leader
  *"The Randomized Resolution feature settled our club funding debate peacefully. No one could complain it was 'rigged' after the random pick!"* - Susan T., Non-Profit Board
  *"LinearRank™ for choosing our conference venue was flawless. VerityVote turned a nightmare into a 5-minute decision."* - Mark D., Events Director

  **Ready to experience truly honest voting?** Explore our tiers and discover how VerityVote delivers the Strategy-Proof Future™. Executive Tier members gain priority influence, exclusive LinearRank™ access, and enhanced audit capabilities. Upgrade your democratic process today.
