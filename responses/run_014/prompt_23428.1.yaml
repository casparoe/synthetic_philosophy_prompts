  The ranking is based on each conception's vulnerability to the reference-class problem, particularly the "lowering of functioning" case where a pathology becomes statistically common and risks reclassification as normal. Resistance is determined by how inherently the conception avoids or mitigates underdetermination in reference-class selection and dependence on shifting statistical norms.

  1. **Normativist account**: Most resistant, as it entirely avoids reliance on statistical reference classes. Disease is defined by value-laden judgments (e.g., undesirability, harm), so prevalence shifts do not force reclassification. If a condition is deemed harmful, it remains a disease regardless of its frequency.
     
  2. **Hybrid biostatistical account**: Highly resistant, as it anchors the reference class to a fixed normative standard of functional design (e.g., ideal biological function) rather than observed statistics. This design standard is stable, preventing reclassification due to changing prevalence.

  3. **Daniels's normal-functioning account**: Moderately resistant. While tied to normative goals (e.g., maintaining fair equality of opportunity), it often implicitly relies on statistical or species-typical notions of "normal functioning." This leaves it vulnerable to reference-class ambiguity if "normal" is interpreted statistically.

  4. **Boorse's biostatistical theory**: Vulnerable, as it explicitly depends on statistical norms within a reference class (species, age, sex). If a pathology becomes common within a class, it may become statistically normal and lose disease status, exemplifying the reference-class problem.

  5. **Engel's conceptual-ecological approach**: Least resistant, as it embraces context-dependence, requiring reference classes to be chosen based on ecological, social, or multi-level factors. This amplifies underdetermination, as shifting contexts can redefine "disease" based on variable or fluid reference classes.

