answer: |-
  This phenomenon you're describing is astutely observed and remarkably common in political discourse. While no single term captures every nuance perfectly, several established concepts come close, each highlighting different facets:

  1.  **Essentially Contested Concept (Gallie):** This is the **strongest fit**. Philosopher W.B. Gallie argued that some concepts (like "democracy," "justice," "art") are *inherently* subject to endless dispute about their *correct* application. Key features:
      *   **Appraisiveness:** The concept signifies something valued (e.g., "Western values" = something *good*).
      *   **Internal Complexity:** The concept involves multiple constituent parts that can be weighted differently.
      *   **Diverse Interpretability:** Different parties champion different interpretations based on their worldview.
      *   **Openness:** The concept is adaptable to future arguments and changing circumstances.
      *   **Recognition of Contestation:** (Crucially) Proponents *recognize* their use is contested but argue *their* interpretation is correct. *This last point is where your observation adds depth – actors often deny contestation, claiming their definition is the only legitimate one.*
      *   *Fit:* "Western values" perfectly fits Gallie's criteria. Disagreement about its core content *is* the norm, not an aberration. However, it doesn't fully capture the *strategic deployment* and *denial of ambiguity* you note.

  2.  **Floating Signifier (Lévi-Strauss/Laclau & Mouffe):** This concept, originating in structural anthropology and elaborated in post-structuralist political theory, describes a symbol or term that is **empty enough to be filled with diverse, even contradictory, meanings by different groups** within a discursive field. Its power lies in its very lack of fixed meaning, allowing it to unify diverse agendas under a common banner.
      *   *Fit:* This directly addresses your "container" metaphor. "Western values" *is* a floating signifier – its emptiness allows conservatives, liberals, and critics alike to project their preferred meanings onto it while claiming it represents a unified essence. It highlights the strategic aspect – the term's usefulness *depends* on its ambiguity for different groups to mobilize it.

  3.  **Ideograph (McGee):** In rhetorical studies, Michael McGee defined an ideograph as "an ordinary-language term found in political discourse" that is "a high-order abstraction representing collective commitment to a particular but equivocal and ill-defined normative goal." Examples include "liberty," "equality," "rule of law." They function as slogans or icons, evoking emotion and loyalty rather than precise definitions.
      *   *Fit:* "Western values" operates as a powerful ideograph. Its invocation triggers allegiance to a perceived tradition or ideal without requiring precise definition. The disagreements you see are struggles over *which* specific commitments get to define that ideograph. It emphasizes the rhetorical power and emotional resonance over logical coherence.

  4.  **Umbrella Term:** While simpler, this captures the basic structure: a broad label covering diverse, sometimes conflicting, sub-concepts.
      *   *Fit:* Accurate descriptively, but lacking the theoretical depth regarding *why* it's contested and how it functions strategically. It doesn't address the denial of ambiguity.

  **Why "Equivocation" or "Moving Goalposts" Don't Quite Fit:**

  *   **Equivocation:** Typically implies a *single speaker* deliberately exploiting ambiguity *within an argument*. Here, the ambiguity is *structural* and exploited by *different groups* across different contexts, each claiming their definition is the only legitimate one, not shifting within a single exchange.
  *   **Moving Goalposts:** Involves changing criteria to avoid conceding a point. Here, the *starting point* (the definition of "Western values") is inherently unstable and contested from the outset, not shifted in response to challenge in a specific debate.

  **The Core Mechanism & Strategic Denial:**

  The key insight is that "Western values" functions as a **floating signifier** and **ideograph** within the framework of an **essentially contested concept**. The *strategic denial* you observe – each party insisting *their* meaning is the only stable, knowable one – is crucial. This denial is a power move. It attempts to:

  1.  **Claim Authority:** Assert the right to define the core of the concept (e.g., "True 'Western values' are Christian" vs. "True 'Western values' are secular and liberal").
  2.  **Exclude Opponents:** Frame those using different definitions as not just wrong, but *outside* the legitimate tradition or betraying it ("You don't uphold *real* Western values").
  3.  **Mobilize Support:** Use the powerful, emotionally resonant symbol to unify supporters around a specific agenda, obscuring internal contradictions by wrapping them in the flag of "Western values."

  **Where Does Shifting Reference End and Good-Faith Disagreement Begin?**

  Distinguishing this strategic ambiguity from good-faith disagreement is crucial but often blurry. Key differentiators:

  1.  **Denial of Ambiguity:** Does the speaker acknowledge the term *can* be interpreted differently, or do they insist their definition is the *only* possible or legitimate one? Good-faith actors usually acknowledge potential ambiguity.
  2.  **Strategic Inconsistency:** Does the *same speaker/group* use the term with significantly different meanings depending on the audience or argumentative need *without acknowledging the shift*? Good-faith actors strive for consistency or explain shifts.
  3.  **Refusal of Delimitation:** When challenged on the term's meaning, does the speaker engage in clarifying its boundaries and components, or do they resort to dogma, emotional appeals, or accusations? Good-faith disagreement involves attempts at mutual definition or understanding.
  4.  **Function in Argument:** Is the term being used primarily as an unquestionable trump card ("Because Western Values!"), or is it being used as a starting point for reasoned discussion about specific principles and their application? The former signals strategic use.
  5.  **Openness to Revision:** Is the speaker open to refining their understanding of the concept based on evidence or dialogue, or is it treated as a fixed, sacred dogma? Good-faith concepts are often subject to refinement.

  **Boundary Cases:**

  *   **Rawlsian "Overlapping Consensus":** Disagreement on fundamental philosophical grounds (e.g., *why* freedom is good) but agreement on core political principles (e.g., freedom *itself*) for shared governance. This involves good-faith recognition of deep differences but practical agreement on a *thin* core meaning for political purposes.
  *   **Constitutional Interpretation:** Debates over terms like "cruel and unusual punishment" or "due process" involve genuine, good-faith disagreement about applying broad principles to new contexts, often with established methodologies (text, history, precedent, structure, consequences). While contested, there's a shared framework for debate and an acknowledgment of the term's inherent need for interpretation.
  *   **Scientific Terms with Evolving Understanding:** "Gene," "species," "gravity." Meanings evolve with evidence and theory. Disagreement exists, but it's generally resolved through evidence and methodological consensus, not purely strategic deployment. The core referent (the phenomenon) is usually agreed upon, even if the conceptualization changes.
  *   **Legal Terms Needing Interpretation:** "Reasonable," "negligence." Require context-specific judgment calls. Good-faith disagreement focuses on applying shared criteria to facts, not fundamentally redefining the core concept for strategic advantage in unrelated domains.

  **In Summary:**

  The phenomenon you describe is best understood as a **floating signifier** operating within the framework of an **essentially contested concept**, functioning rhetorically as an **ideograph**. The strategic denial of ambiguity is a key power dynamic. It differs from good-faith disagreement primarily through the **denial of ambiguity itself**, **strategic inconsistency**, **refusal to engage in delimitation**, and its use as an **unquestionable trump card** rather than a starting point for reasoned debate. The boundary lies where participants acknowledge the contestability and engage in genuine attempts to define, apply, or reconcile meanings within a shared framework.
