  Hmm, this is fascinating. The user has identified something subtle - it's not just semantic disagreement but a kind of terminological battleground where the definition itself becomes weaponized. They're asking if there's an established term for this configuration. 

  Let me scan related concepts... "Essentially contested concept" (Gallie) comes close but doesn't fully address the strategic deployment aspect. "Floating signifier" (Lévi-Strauss) is better - that's when a symbol's meaning is deliberately kept fluid for political purposes. "Ideograph" (McGee) is another strong candidate from rhetoric studies, describing abstract terms that condense ideological commitments. 

  The user also wants boundary markers - how to distinguish this from good-faith conceptual disputes. That's crucial. The key differentiators would be: denial of ambiguity, strategic inconsistency (using multiple definitions situationally), and refusal to acknowledge competing interpretations. 

  For boundary cases: Rawls' "overlapping consensus" shows good-faith negotiation of shared meanings, while constitutional terms like "cruel and unusual punishment" demonstrate legitimate interpretive disputes. The problem arises when the term becomes what Waismann called an "open texture" concept but is pretended otherwise.

