  Below is a decision-tree handout designed to guide students from the stipulation that human extinction is inherently bad (beyond the deaths of the last generation) to a named position on what else is lost. The tree uses logical branches based on intuitions about four cases, without revealing the positions in advance. Each branch node is a question answered using the cases, and leaves are named positions with their key commitments. Positions excluded by the stipulation (e.g., deaths-only view) are noted at the end. 

  ---

  **Decision Tree: What Else Is Lost in Human Extinction?**  
  *Starting stipulation: Human extinction is bad, and this badness is not exhausted by the deaths of the last generation.*

  ### **Branch 1: Posthuman Successor (Case 2)**  
  Consider a posthuman successor species that inherits human culture and values. Does this **fully mitigate** the badness of human extinction?  
  - **Yes** → Go to Branch 2.  
  - **No** → Go to Branch 3.  

  ---

  ### **Branch 2: Alien Appreciation (Case 3)**  
  *(After "Yes" to Branch 1)*  
  Consider an alien civilization discovering and genuinely enjoying human art/literature. Does this **fully mitigate** the badness?  
  - **Yes** → **Relational Value View**  
    - *Position:* Value requires an actual valuer; extinction is bad because no one exists to appreciate human achievements.  
    - *Most awkward commitment:* If aliens were guaranteed to appreciate human culture, extinction would not be bad (even with no humans or successors).  
  - **No** → **Scheffler’s "Afterlife" View**  
    - *Position:* Extinction destroys the "afterlife" of human projects—the future generations that give meaning to current endeavors.  
    - *Most awkward commitment:* The value of present actions depends entirely on future beings (contingent on psychology, not inherent worth).  

  ---

  ### **Branch 3: Loss Focus (After "No" to Branch 1)**  
  *(Human extinction remains bad despite a successor)*  
  Is the badness primarily about **current people’s loss** (e.g., their projects/claims) or **future people’s loss** (e.g., unfulfilled possibilities)?  
  - **Current people’s loss** → **Deontological Claim View**  
    - *Position:* The living have a claim to a human future; extinction violates obligations to existing people.  
    - *Most awkward commitment:* Fails if the living voluntarily forgo a future (e.g., consent to extinction), yet extinction might still feel bad.  
  - **Future people’s loss** → Go to Branch 4.  

  ---

  ### **Branch 4: Total Well-Being (Case 4)**  
  *(After "Future people’s loss")*  
  Consider a world where total universe-wide well-being is identical to that if humanity survived. Is extinction **still bad**?  
  - **Yes** → **Foreclosed Possibilities View**  
    - *Position:* Extinction destroys unique human possibilities (e.g., cultural, technological, or moral futures).  
    - *Most awkward commitment:* The loss affects no one (due to the non-identity problem: no specific future people exist to be deprived).  
  - **No** → **Aggregate Well-Being View**  
    - *Position:* Extinction is bad because it reduces total well-being in the universe (future humans would have contributed net positive value).  
    - *Most awkward commitment:* Extinction is not bad if non-human beings (e.g., aliens) produce equal well-being elsewhere.  

  ---

  ### **Notes on Unoccupied Combinations & Indistinguishable Positions**  
  - **Unoccupied combinations:**  
    - *"No" to Branch 1 and "Yes" to Branch 2:* No one argues that aliens mitigate badness while successors do not. A successor is a "closer" valuer; if it fails, aliens (a "weaker" valuer) cannot succeed.  
    - *"Yes" to Branch 1 and "No" to Branch 4:* If successors mitigate, total well-being is irrelevant. Theorists who accept successors (Branch 1 "Yes") don’t invoke well-being (Branch 4) as decisive.  
  - **Indistinguishable positions with cases:**  
    - *Scheffler vs. Relational View:* Case (3) separates them (aliens mitigate for Relational but not Scheffler).  
    - *Foreclosed Possibilities vs. Deontological View:* Case (2) separates them (successors mitigate for neither, but Branch 3 distinguishes their focus).  
    - *All cases fail to separate:* Aggregative Well-Being and Relational Views both accept mitigation in Case (4) or Case (3), but Branch 1/Branch 2 sequence distinguishes them.  

  ---

  ### **Excluded Views**  
  - **Deaths-only view:** Extinction is bad *only* due to the deaths of the last generation. Must reject the stipulation that badness extends beyond deaths.  
  - **Extinction not bad at all:** Rejects the core stipulation that extinction is inherently bad.  

  ---  
  *Use this tree to reflect on cases (1)–(4). For example:  
  - Case (1) (artifacts remain, no valuers) tests relational views.  
  - Case (4) (same well-being) tests welfarist views.  
  - Case (2) and (3) probe whether valuers must be human or continuous.*
