prompt: |-
  I've been stuck on this in my metaphysics seminar: the arguments against endurantism. Lewis has the argument about the fact of presence, where if a thing exists at multiple times then there must be a further fact about when it is present, and Sider has the problem of temporary intrinsics, where a cat is curled up at one time and stretched out at another, so if it's the same cat at both times it has contradictory intrinsic properties. I keep going back and forth on whther these are the same argument in different clothes or two genuinely different ones. Can you compare them? In particular, does the endurantist's standard reply of tensed properties, like being red now, defuse both equally, or does one of them still bite? And which version do you think is stronger, and why?
reasoning: |-
  Okay, the user is struggling with two arguments against endurantism in their metaphysics seminar: Lewis's "fact of presence" and Sider's "problem of temporary intrinsics." They're trying to figure out if these are essentially the same argument or distinct, and whether the standard endurantist reply using tensed properties resolves both equally. They also want to know which argument is stronger and why.

  First, I need to recall what endurantism is. It's the view that objects persist through time by being wholly present at each moment they exist. Perdurantism, on the other hand, sees objects as having temporal parts. So Lewis and Sider are both attacking endurantism but from different angles.

  Lewis's argument is about the "fact of presence." He says that if an object exists at multiple times, there must be a fact about when it's present. But since the object is wholly present at each time, there's no distinction in how it's present across times. Without temporal parts, the only difference is the time itself, which doesn't inherently contain the "presentness." So he's pointing out a missing metaphysical fact.

  Sider's problem is about temporary intrinsics. An object can have contradictory properties at different times, like a cat being curled up and stretched out. If the object is wholly present at both times, it seems to have incompatible properties simultaneously, which violates Leibniz's Law. Endurantists respond by relativizing properties to times, like "is curled up at t1." But Sider argues that this doesn't solve the problem because the relativized properties are relational, not intrinsic.

  The user is confused about whether these are the same argument. On the surface, both deal with persistence and properties, but Lewis is concerned with the indexical "now," while Sider focuses on intrinsic properties. The tensed properties reply might work for Lewis by adding a temporal index to properties, making "present" a property of the object at a time. For Sider, though, the issue is that relativizing properties turns intrinsic properties into extrinsic ones, which is problematic.

  So the key difference is that Lewis's argument targets the metaphysics of presence and indexicals, while Sider's attacks the nature of intrinsic properties. The tensed properties solution might resolve Lewis's concern but not Sider's, because Sider insists that intrinsic properties shouldn't be relational.

  The user also wants to know which argument is stronger. Lewis's might be easier to counter with the tensed properties approach. Sider's critique is deeper because it challenges a core aspect of endurantism—how objects have changing intrinsic properties without becoming relational. That seems harder to refute without compromising what makes properties intrinsic.

  The user's deeper need might be understanding the nuances between these arguments to better grasp the endurantism-perdurantism debate. They might need a clear comparison to structure their seminar arguments or prepare for exams. Highlighting the distinction in what each argument targets and why Sider's is more robust could help them focus their studies.
answer: |-
  You've hit on a crucial debate in contemporary metaphysics! Lewis's "Argument from Temporary Intrinsics" (often linked to the "fact of presence" concern) and Sider's refinement/presentation of the problem are deeply related but target slightly different vulnerabilities in endurantism. Let's break down their relationship, the effectiveness of the "tensed properties" reply, and their relative strength.

  **1. The Arguments: Core Concerns**

  *   **Lewis's Argument (Problem of Temporary Intrinsics & Fact of Presence):**
      *   **Temporary Intrinsics:** Lewis argues that an enduring object, being wholly present at different times with different intrinsic properties (e.g., bent at t1, straight at t2), seems to instantiate incompatible intrinsic properties *simpliciter*. This violates the principle that an object cannot have genuinely contradictory intrinsic properties at the same time. The endurantist's "wholly present at each time" makes it hard to see how the properties are *only* had at specific times without relativization.
      *   **Fact of Presence:** Lewis also raises the "problem of the essential indexical." If an object O exists wholly at t1 and wholly at t2, what makes it true *at t1* that "O is present" (i.e., that *this* moment, t1, is *now* for O)? The mere existence of O at t1 doesn't seem sufficient, as it also exists at t2. There must be some further fact about which time is *present* for O. But what could this fact be? It can't be a relation to a temporal part (since O has none), and simply locating O at t1 doesn't distinguish t1 as *present* from t2 also being a location where O exists. There seems to be no non-relational "presentness" fact intrinsic to O at t1 that isn't also true at t2.

  *   **Sider's Argument (Problem of Temporary Intrinsics - Reloaded):** Sider focuses laser-like on the nature of intrinsic properties.
      *   He argues that the endurantist's standard move – relativizing properties to times (e.g., "O is bent-at-t1" and "O is straight-at-t2") – fundamentally changes the nature of the properties involved.
      *   "Bent-at-t1" is *not* an intrinsic property of O; it's a *relational* property. O's having this property entails a relation to a specific time, t1. Similarly, "straight-at-t2" is a relation to t2.
      *   However, the properties we *actually* attribute to objects in change (like being bent or being straight) *are* intrinsic. They are ways the object is *in itself*, not ways it is related to something else (like a time).
      *   Therefore, Sider concludes, the endurantist, by relativizing properties to times to avoid contradiction, fails to account for genuine *temporary intrinsic change*. They've replaced intrinsic properties with relational ones. The contradiction is avoided only by changing the subject – we're no longer talking about the cat's intrinsic shape, but about its shape-in-relation-to-a-time.

  **2. Are They the Same Argument in Different Clothes?**

  *   **No, but they are deeply intertwined and mutually supporting.** They both stem from the core challenge endurantism faces in accounting for temporal variation within a single, wholly present entity.
  *   **Lewis's "Fact of Presence"** focuses on the **indexicality of "present"** and the seeming need for an additional metaphysical fact to ground which time *is now* for the object, given that it exists wholly at multiple times. It's about locating the object *in the present moment*.
  *   **Lewis's/Sider's "Temporary Intrinsics"** focuses on the **incompatibility of properties** across time and the **nature of those properties**. How can one thing have incompatible intrinsic properties without contradiction? It's about the object *having different characteristics* at different times.
  *   **Sider's Refinement** specifically attacks the **endurantist's solution (relativization)** by arguing it sacrifices the *intrinsicality* of the properties being explained. This makes the problem more acute for the endurantist who has already adopted the relativization strategy.

  Think of it this way:
  *   **Temporary Intrinsics (Lewis/Sider):** "How can the same thing be bent and straight?"
  *   **Fact of Presence (Lewis):** "How can the same thing be *here now* (at t1) and also be *there then* (at t2), without some extra 'presentness' fact at t1?"
  *   **Sider's Point:** "Your solution to the first problem (saying it's 'bent-at-t1') means you're not really talking about it being intrinsically bent *simpliciter* anymore."

  **3. Does the "Tensed Properties" Reply Defuse Both Equally?**

  *   **The Reply:** Endurantists respond to both challenges by invoking **tensed properties** or **time-indexed properties**: "O is bent-at-t1" or "O is (tensedly) bent now (at t1)".
  *   **Against Lewis's Temporary Intrinsics:** This reply **seems effective**. It dissolves the contradiction by making the properties compatible: O has the property *bent-at-t1* and the property *straight-at-t2*. These are different, non-contradictory properties.
  *   **Against Lewis's Fact of Presence:** This reply **offers a partial solution**. The property "present-at-t1" (or "is-now") *can* be a genuine, non-relational property that O instantiates at t1 and does not instantiate at t2. The "further fact" is O instantiating this tensed property *at t1*. However, critics argue this merely pushes the problem back: What grounds the fact that "present-at-t1" is instantiated *at t1*? Isn't this just restating the original indexical fact? It can feel like labeling the problem rather than solving it.
  *   **Against Sider:** This reply **fails decisively**. This is Sider's whole point! By adopting tensed/time-indexed properties ("bent-at-t1"), the endurantist *concedes* that the properties accounting for change are **not intrinsic** but **relational** (involving a relation to time t1). The *intrinsic* property of *being bent* (simpliciter) – the property we directly observe the cat having when it's curled up – has vanished from the account. The endurantist might *call* "bent-at-t1" an intrinsic property of O, but Sider argues its very definition makes it extrinsic (it depends on the existence of and relation to t1).

  **4. Which Version is Stronger, and Why?**

  *   **Sider's argument is generally considered the stronger and more persistent challenge to endurantism.**
  *   **Why:**
      1.  **Targets the Solution:** Sider directly attacks the endurantist's *only plausible response* (relativization/tensed properties) to the original problem of temporary intrinsics. He shows that this solution comes at an unacceptable cost: the loss of genuine intrinsic change.
      2.  **Focuses on Intrinsicality:** He pinpoints a crucial feature of our pre-theoretical understanding of change – it involves variations in how objects are *in themselves*, not just variations in how they relate to abstract times. His argument forces endurantists into a dilemma: accept contradiction or deny genuine intrinsic change. Both options are unpalatable.
      3.  **Less Susceptible to Linguistic Maneuvers:** While Lewis's "fact of presence" can be mitigated (though not fully resolved) by positing tensed properties like "is-present-now," Sider's argument demonstrates that this linguistic move fundamentally alters the *ontological category* of the properties involved. You can't talk your way out of turning an intrinsic property into a relational one by using a hyphen.
      4.  **Highlights a Core Commitment:** It forces endurantists to either:
          *   Deny that properties like shape *are* intrinsic (a very radical and counterintuitive move).
          *   Accept adverbialism (properties are modes of the object at a time, like "O is bent-ly at t1"), which is complex and faces its own challenges.
          *   Embrace presentism (only the present exists), which avoids the problem by making past/future properties non-existent but comes with massive ontological and semantic costs.
          *   Concede that perdurantism offers a superior account of intrinsic change (O's t1-part is intrinsically bent, O's t2-part is intrinsically straight).

  **Conclusion:**

  While Lewis powerfully framed the twin problems of temporary intrinsics and the fact of presence arising from endurantism, **Sider's refinement is the more potent and enduring challenge.** Lewis's "fact of presence" points to a genuine puzzle about indexicality that the tensed property reply addresses, albeit perhaps incompletely. However, **Sider's argument bites deeper** because it exposes the fatal flaw *within* the endurantist's primary solution to the temporary intrinsics problem: relativization sacrifices the very intrinsicality it was meant to preserve. The tensed property reply might soothe the contradiction worry and partially address the "presentness" worry, but it does nothing against Sider's charge that this strategy abandons genuine intrinsic change. For this reason, Sider's version is widely regarded as the stronger argument and the one that continues to shape the debate most significantly. Endurantists need a convincing account of how an object can have *non-relational*, genuinely intrinsic properties that change over time without contradiction – and Sider argues persuasively that relativization fails to provide this.
