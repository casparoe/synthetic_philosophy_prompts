answer: |-
  ## Refrains That Slip Through Worlds

  I bear the selfsame name through worlds unknown,  
  Where branching paths from choices never made  
  Unfold a tapestry that time has sown.  
  If *tall* or *short* in realms beyond my own,  
  Is that still *me* where different traits are weighed?  
  **I bear the selfsame name through worlds unknown.**  
  **But likeness speaks where strictest truth has flown:**  
  A counterpart performs what I evade  
  Unfolding tapestries that time has sown.  

  That chair I scraped? A change by atoms shown...  
  Could *that* past self, with this one, be arrayed?  
  I bear the selfsame name through worlds unknown.  
  Is essence fixed, a rigid, central stone,  
  Or scattered echoes, subtly re-displayed,  
  Unfolding tapestries that time has sown?  

  The *then* and *now*—a chasm newly grown!  
  The self who stood where *this* one stands today—  
  **Is just a counterpart, not me alone,**  
  Unfolding tapestries that time has sown.  

  **I bear the selfsame name through worlds unknown,**  
  **But likeness speaks where strictest truth has flown.**

  ---

  **Notes for the Philosophically Inclined:**

  *   **The Refrains:**
      *   **"I bear the selfsame name through worlds unknown" (Kripkean):** This embodies Kripke's transworld identity. The core individual, rigidly designated by their name/essence, persists across possible worlds. The "selfsame name" signifies this unbroken identity.
      *   **"But likeness speaks where strictest truth has flown" (Lewisian):** This captures Lewis's counterpart theory. Modal claims about "me" aren't about strict identity across worlds; they are about distinct counterparts who are sufficiently similar ("likeness") in those worlds. "Strictest truth" (identity) has been replaced ("flown").
  *   **"Passing Each Other Without Settling":** Each refrain states its position definitively after the other, like debaters restating their thesis. They don't directly argue *against* each other in the lines; they simply reassert their contrasting core principles, sliding past the opposition without resolution ("The *then* and *now*—a chasm newly grown!").
  *   **The Volta (The Turn):** The crucial moment arrives in the fourth tercet: "That chair I scraped? A change by atoms shown... / Could *that* past self, with this one, be arrayed?" This shifts from abstract modal worlds to a concrete, *diachronic* example – identity over time. The "change by atoms shown" directly invokes the problem of accidental intrinsics (like having scraped the chair or not) applied to the self *over time*.
  *   **The Diachronic Consequence:** The penultimate tercet makes the threat explicit: "The *then* and *now*—a chasm newly grown! / The self who stood where *this* one stands today—" This sets up the closing couplet's application of the Lewisian refrain to the temporal self.
  *   **The Closing Couplet:**
      *   **"Is just a counterpart, not me alone,"**: This lands the devastating diachronic implication. If counterpart theory solves the problem of accidental intrinsics *across* worlds by denying transworld identity, the *same logic* applied to changes *through* time (like scraping the chair, aging, gaining/losing properties) suggests your past self is merely a temporal counterpart, not strictly identical to you now. This applies the Lewisian position ("a counterpart") to the time-slice problem.
      *   **"Unfolding tapestries that time has sown."**: This recurring line now resonates with both modal and temporal branching possibilities.
  *   **The Final Juxtaposition:** The couplet ends by placing the two core refrains side-by-side: "**I bear the selfsame name...**" (Kripke asserting enduring identity) and "**But likeness speaks...**" (Lewis asserting similarity replaces identity). The preceding line ("Is just a counterpart...") forces the reader to hear the Lewisian refrain *also* applying to the temporal case, undermining the apparent stability the Kripkean refrain offers even within a single timeline. The argument doesn't settle; it deepens, revealing a profound challenge to personal identity itself.
  *   **Metaphysical Accuracy:** The poem accurately presents:
      *   Kripke's view: Rigid designation, essential properties, transworld identity.
      *   Lewis's view: Counterpart relations based on similarity, rejecting transworld identity to solve problems like accidental intrinsics.
      *   The core problem: Accidental intrinsic properties (like height, scraped chairs) seem incompatible with strict identity across worlds where these properties differ.
      *   The extension: The logical parallel between this modal problem and the problem of identity over time given intrinsic change (diachronic accidental intrinsics). Lewis himself acknowledged this consequence.

  The poem uses the strict villanelle form to embody the unresolved, cyclical tension between these two fundamental approaches to identity across possibility and time, culminating in the unsettling realization that the modal debate directly threatens our sense of a persistent self.
