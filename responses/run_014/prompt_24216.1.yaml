prompt: |-
  I recently served on a criminal jury and then read about the Condorcet jury theorem, and I've been trying to work out what our system actually assumes about us. As I understand the theorem, if each juror is more likely than not to be correct and votes independently, majority rule becomes more reliable as the jury grows. Yet we were required to be unanimous to convict, we were only twelve, we were sequestered and forbidden from doing our own research, and we were told to convict only on guilt "beyond a reasonable doubt" rather than by a bare majority.

  What view of epistemic aggregation does that bundle presuppose? Does the unanimity requirement only make sense if individual accuracy is high, or if deliberation correlates our votes so the independence assumption fails and the theorem no longer applies? Is "beyond a reasonable doubt" just an asymmetric loss function, with a false conviction costing more than a false acquittal, and if so what does that do to the theorem's claim that majority rule is optimal? And is the practice internally consistent, or does sequestration presuppose that our votes are independent while deliberation presupposes that they are not?

  Please respond in the style of an expert in epistemic social choice and the philosophy of law, and think very carefully before answering. Distinguish what the practice strictly presupposes from what it merely fits, say where it is underdetermined so that several theories would license it, and tell me what would have to change if we replaced unanimity with a supermajority or a simple majority. Finally, state how confident you are in your main claims and single out the one point you are least sure of.
reasoning: |-
  Okay, the user has a fascinating set of questions after serving on a jury and encountering the Condorcet jury theorem. Let me unpack their concerns systematically.

  First, they're grappling with the apparent tension between the theorem's prescription of majority rule and their experience with unanimous verdicts. The core issue seems to be about what model of juror competence and independence the legal system actually assumes. 

  The Condorcet theorem requires three things: individual competence above 0.5, independence, and majority voting. But the real system modifies all three: it demands unanimity, implies deliberation (which breaks independence), and sets a high evidentiary standard. The user is smart to notice these contradictions.

  Hmm, the unanimity requirement is particularly interesting. Legally, it serves as an error-reduction mechanism for false convictions, but epistemically it only makes sense under specific conditions. If individual competence is very high (say >0.95), unanimity works well. But at moderate competence levels (0.6-0.7), it might paradoxically increase error rates. The system seems to assume the former while the theorem assumes the latter. 

  The "beyond reasonable doubt" standard clearly introduces asymmetric costs - false convictions are considered worse than false acquittals. That explains why we'd tolerate higher false acquittal rates. But this asymmetry isn't captured in the original Condorcet framework, which treats errors equally. 

  Ah, and the sequestration-deliberation tension is profound. Sequestering assumes we need independence from external influences, while deliberation intentionally creates interdependence among jurors. The system seems to want "controlled dependence" - correlated only through shared evidence. But is that realistic? Psychology suggests group dynamics introduce biases beyond mere evidence-sharing.

  For reform scenarios: moving to supermajority (say 10-2) would slightly lower the competence threshold needed while maintaining some error asymmetry. Simple majority would require much lower individual competence but increase false convictions - politically untenable given current legal values.

  My least certain point is whether deliberation creates epistemically beneficial correlation or harmful herding. The empirical data is mixed - some studies show improved accuracy from deliberation, others show polarization. The legal system presumes the former, but I'm not fully convinced.

  The user has identified deep philosophical questions about how law balances epistemic and ethical goals. Their experience demonstrates why jury design can't be reduced to pure probability theory - it's embedded in a complex normative framework where reducing one type of error is prioritized over truth-seeking alone.
answer: |-
  Your questions probe the deep philosophical and epistemic tensions at the heart of jury design. I'll address each layer systematically, distinguishing necessary presuppositions from compatible interpretations, and highlight where the system's assumptions may conflict.

  ### **1. Unanimity vs. Condorcet's Premises**
  - **Condorcet's Theorem (Simplified)**: Requires (a) individual competence > 0.5, (b) independence, and (c) majority rule to achieve asymptotic reliability.  
  - **Unanimity's Epistemic Implications**:  
    - *Presupposes extreme risk aversion to false convictions*. Unanimity is optimal *only if* individual juror competence (p) is very high (p > 0.5 is insufficient).  
      - *Example*: For 12 jurors, unanimity minimizes false convictions only if p > ~0.87 (computationally derived). Below this, it increases the risk of *false acquittals* exponentially.  
    - *Rejects pure independence*. Deliberation intentionally introduces correlation, making votes interdependent. The system presupposes this correlation improves accuracy by refining initial judgments through evidence-focused debate.  

  ### **2. "Beyond Reasonable Doubt" (BRD) as Asymmetric Loss**
  - **Loss Function Structure**:  
    - BRD encodes a *nonlinear error cost*: False conviction cost (C<sub>FC</sub>) ≫ false acquittal cost (C<sub>FA</sub>).  
    - *Epistemic Effect*: This justifies unanimity even when it increases total errors (by raising false acquittals), because the expected cost of error is minimized by prioritizing C<sub>FC</sub> reduction.  
  - **Condorcet Modification**: The theorem assumes symmetric errors (C<sub>FC</sub> = C<sub>FA</sub>). Under asymmetry, majority rule is no longer optimal. Unanimity becomes rational when C<sub>FC</sub>/C<sub>FA</sub> > k (where k depends on p and jury size).  

  ### **3. The Independence-Deliberation Tension**
  - **Sequestration**: Presupposes that *external* influences threaten independence (e.g., media bias).  
  - **Deliberation**: *Intentionally breaks independence* by design. This creates a controlled form of dependence:  
    - *Presupposition*: Shared evidence and debate cause votes to correlate *through better truth-tracking*, not bias.  
    - *Risk*: If deliberation induces herding/groupthink, correlation *reduces* accuracy. The system assumes deliberation is net truth-enhancing.  
  - **Internal Consistency?**: The system is *not* strictly inconsistent but *fragile*. It assumes:  
    - Independence *from external noise* (achieved via sequestration).  
    - Positive correlation *via evidence-sharing* (achieved via deliberation).  
    Empirical psychology suggests this balance is hard to achieve.  

  ### **4. Jury Size and Competence Threshold**
  - **Small Jury (n=12)**:  
    - *Presupposes high individual competence*. For unanimity to be reliable, p must be high (e.g., p=0.75 yields ~32% accuracy under unanimity; p=0.95 yields ~54%). Contrast with majority rule (p=0.75 → 99.6% accuracy).  
    - *Implied Claim*: The adversarial process + jury instructions produce jurors with p >> 0.5.  
  - **Why Not Larger?**: Tradeoff between marginal reliability gains and practical costs (e.g., deliberation quality declines with size).  

  ### **5. Alternative Voting Rules: Supermajority vs. Majority**
  - **Supermajority (e.g., 10-2)**:  
    - Lowers the competence threshold vs. unanimity (e.g., p=0.65 suffices for 90% reliability).  
    - Maintains high C<sub>FC</sub> avoidance but reduces false acquittals.  
    - *Compatible* with asymmetric loss if C<sub>FC</sub>/C<sub>FA</sub> is high but not extreme.  
  - **Simple Majority**:  
    - Optimal if errors are symmetric or p is moderate (p>0.5).  
    - *Incompatible* with current BRD asymmetry: Would increase false convictions unacceptably.  
    - Requires redefining BRD or accepting higher C<sub>FC</sub> risk.  

  ### **6. System Coherence and Underdetermination**
  - **Internally Consistent?**:  
    - *Yes*, under a *specific normative-epistemic model*:  
      - Jurors enter deliberation with p > 0.5 (via selection/instructions).  
      - Deliberation increases p through evidence-sharing.  
      - Unanimity exploits post-deliberation competence to minimize C<sub>FC</sub>.  
    - *No*, if deliberation correlates votes non-epistemically (e.g., via deference to dominant jurors).  
  - **Underdetermination**:  
    The same practice could arise from:  
    - **Pessimistic view**: Jurors have low p; deliberation combats individual incompetence.  
    - **Optimistic view**: Jurors have high p; deliberation refines near-certain judgments.  
    Both can justify unanimity under different competence assumptions.  

  ### **Confidence Assessment**
  - **High Confidence** (~90%):  
    - Unanimity presupposes both high C<sub>FC</sub> cost and post-deliberation competence.  
    - BRD is primarily an asymmetric loss function, not just an epistemic standard.  
  - **Moderate Confidence** (~70%):  
    - Deliberation is intended to create "good" correlation (evidence-driven), not noise.  
  - **Lowest Confidence** (~50%):  
    *"Whether real deliberation achieves the optimal correlation structure."*  
    Empirical data is mixed: Some studies show juries correct 50% of initial errors; others show group polarization or deference to outliers. The system *presumes* net epistemic gain, but I am least sure this holds universally.  

  ### **Conclusion**
  The bundle presupposes a **hybrid model**: (1) Jurors begin with competence well above 0.5 (due to court procedures), (2) deliberation further increases p by leveraging diverse perspectives under controlled conditions, and (3) BRD imposes asymmetric costs that justify unanimity's high false acquittal rate. If deliberation fails to improve competence or introduces bias, the system's reliability collapses. Changing unanimity to supermajority would relax competence requirements but retain C<sub>FC</sub> aversion; simple majority would demand rethinking BRD itself. The system is a bold wager that legal institutions can shape jurors into competent, correlated truth-trackers—a bet contingent on fragile human dynamics.
