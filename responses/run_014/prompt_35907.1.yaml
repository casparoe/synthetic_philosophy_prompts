answer: |-
  Below is the interactive quiz designed to sort readers by their inductive practices. It requires no prior knowledge beyond Hume and avoids technical jargon. Each question presents a concrete scenario with vivid details and stakes, followed by 2–3 first-person reaction options. The quiz takes ~10 minutes to complete.

  ---

  ### **The Inductive Practice Quiz**
  *Instructions: Read each scenario and select the option that best matches your intuitive reaction. Answer honestly—no position is "correct."*

  1. **Grue Emerald (Goodman’s New Riddle)**  
     *In 2023, scientists define "grue" as: an object is grue if it appears green before January 1, 2100, or blue after that date. Every emerald observed before 2023 was green (and thus grue). A new emerald is discovered on January 2, 2100. What should I expect?*  
     A) I’d expect it to be green, like all past emeralds.  
     B) I’d expect it to be blue (since it’s after 2100, and "grue" now means blue).  
     C) I wouldn’t expect either color—the evidence supports green or blue equally.  

  2. **Biased Coin Wager (Pricing Skepticism)**  
     *A coin landed heads 100 times in a row. I’m offered a bet: if the 101st flip is heads, I win $1,000; if tails, I lose $10. My rent is due tomorrow.*  
     A) I’d take the bet—it’s almost certainly biased toward heads.  
     B) I’d refuse—each flip is independent, so tails is possible.  
     C) I wouldn’t take either side—past flips don’t predict future ones.  

  3. **Lottery-Defined Dependability (Arbitrary Predicate)**  
     *A machine worked perfectly every day for 10 years. "Dependable" is defined as: it worked every day before a specific, unrelated lottery is drawn (the draw is next month). Does its past performance support expecting it to work tomorrow?*  
     A) Yes—its flawless record suggests reliability, lottery or not.  
     B) No—the lottery’s timing could make "dependable" irrelevant to tomorrow.  
     C) The evidence is silent—"dependable" is arbitrary and tells me nothing.  

  4. **Synthetic Compound (No Linguistic History)**  
     *Chemists create Zylofram, a compound never seen before. All 50 samples dissolved in water. No one has ever used "dissolves" for Zylofram. Should I expect the 51st sample to dissolve?*  
     A) Yes—uniform past behavior justifies expecting it again.  
     B) No—without a history of use, there’s no basis for extrapolation.  

  5. **Jade Revelation (Retroactive Breakdown)**  
     *For 2,000 years, "jade" meant a hard, green stone. All examined samples fit this. In 1863, jade split into two minerals (jadeite and nephrite) with different properties. What of those who extrapolated "all jade is hard"?*  
     A) They were reasonable—their evidence supported it—but unlucky.  
     B) Their method was flawed—they should’ve questioned "jade" as a category.  

  6. **Repainted Button (Physical vs. Verbal Continuity)**  
     *A device’s red button always beeps when pressed (50 tests). It’s repainted purple—same button, same mechanics. I press the purple button. Do I expect a beep?*  
     A) Yes—it’s the same button, regardless of color.  
     B) No—it’s now purple, and purple buttons haven’t been tested.  

  7. **Raven Confirmation (Falsificationist Probe)**  
     *I’ve seen 1,000 black ravens. A friend says, "This confirms your theory that all ravens are black!" How do I respond?*  
     A) "Yes—each black raven makes it more likely."  
     B) "No—it only shows no counterexamples yet; it could still be falsified."  

  8. **Sunrise Prior (Subjectivity of Expectations)**  
     *Two people see the sun rise daily for 30 years. One expects it to rise tomorrow; the other expects it to stop (thinking it’s "overdue"). Both have identical evidence. Is one more reasonable?*  
     A) The sunrise-expecter is more reasonable—uniformity is likely.  
     B) Neither is more reasonable—both views fit the evidence.  

  9. **Climate Shift (Background Knowledge)**  
     *Lake Michigan froze every December for 100 years. This December, I consider climate data showing warming trends. Do I expect it to freeze?*  
     A) Yes—the past pattern is strong evidence.  
     B) No—background knowledge overrides the pattern.  

  ---

  ### **Scoring Key**  
  *Match your answers to the predominant pattern below. Each "leaf" is a philosophical stance inferred from your choices. Awkward commitments highlight each position’s counterintuitive implications.*

  1. **Humean Skeptic**  
     - **Pattern**: Frequent C in Q1–4,7; A in Q5; C in Q2.  
     - **In plain terms**: You treat past observations as habits, not proof. Extrapolation is practical but never justified.  
     - **Awkward commitment**: You must act *as if* induction works (e.g., betting), while denying it has any rational basis.  

  2. **Popperian Falsificationist**  
     - **Pattern**: B in Q7; A or B in Q2; B in Q5.  
     - **In plain terms**: Observations never confirm theories—they only falsify. Science progresses by testing bold guesses.  
     - **Awkward commitment**: A theory surviving 1,000 tests is no "truer" than one surviving one test—both are unfalsified.  

  3. **Subjective Bayesian**  
     - **Pattern**: B in Q8; A in Q1,2,4; flexible elsewhere.  
     - **In plain terms**: Any expectation is rational if it coheres with your beliefs. Evidence updates your confidence but starts from personal priors.  
     - **Awkward commitment**: Two people with opposite predictions (e.g., sunrise vs. sunset) can both be fully rational.  

  4. **Goodmanian Conventionalist**  
     - **Pattern**: B in Q1; B in Q3; B in Q4; C in Q5.  
     - **In plain terms**: Extrapolation works only for "entrenched" predicates (like green or raven), not arbitrary ones (like grue or lottery-defined).  
     - **Awkward commitment**: If "grue" were as common as "green," expecting post-2100 emeralds to be blue would be valid.  

  5. **Natural-Kind Realist**  
     - **Pattern**: A in Q1,3,4,6; A in Q5; A in Q9.  
     - **In plain terms**: Induction succeeds when predicates track objective categories (e.g., chemical structure) not verbal labels.  
     - **Awkward commitment**: You must assume humans can unerringly identify "natural kinds" (e.g., that "purple button" is superficial, but "button mechanism" is real).  

  6. **Reichenbachian Pragmatist**  
     - **Pattern**: A in Q1–2,4; A in Q5; C in Q8.  
     - **In plain terms**: Induction isn’t proven reliable, but it’s optimal—if any method predicts the future, induction will.  
     - **Awkward commitment**: You defend induction even if the world is chaotic—it’s the best "blind tool" for a universe that *might* be uniform.  

  ---

  ### **Indistinguishable Leaf Pairs**  
  The quiz **cannot reliably separate**:  
  - **Subjective Bayesian vs. Goodmanian Conventionalist** (e.g., Q8 splits them, but Q1 and Q3 do not).  
    - *Why?* Both allow context-dependent projections. A Bayesian might project "grue" (Q1B) if their prior favors it, mimicking a Goodmanian. Only Q8 forces a choice: Bayesians tolerate any prior (Q8B), while Goodmanians require linguistic entrenchment (making Q8A more likely for them).  
  - **Humean Skeptic vs. Popperian** in wager contexts (Q2).  
    - *Why?* Both reject inductive justification, but Popperians act on "corroborated" theories (Q2A), while hard skeptics avoid bets (Q2C). Q5 clarifies: Popperians blame flawed methods (Q5B), while skeptics blame bad luck (Q5A).  

  ---

  ### **Guidance for Residual Patterns**  
  If your answers don’t fit one leaf:  
  - **Common residual pattern**: A in wagers (Q2A) and physical continuities (Q6A), but C in grue (Q1C) or arbitrary-predicate cases (Q3C). This suggests you **default to uniformity but reject it when properties feel "artificial"**—aligning closest with **Natural-Kind Realism**. You accept induction for "real" categories but demand predicates map to underlying structures.  
  - **No match?** Real inductive practice is messy! Your mix may reflect:  
    - **Context-sensitive pragmatism**: You adjust standards case by case (e.g., strict for grue, lenient for coins).  
    - **Untheorized intuitions**: You haven’t systematized your views—this quiz might help!  

  ---

  ### **Design Notes**  
  - **Cases included**: Grue (Q1), wager (Q2), arbitrary predicate (Q3), no linguistic history (Q4), retroactive breakdown (Q5).  
  - **Underdetermination option**: Appears in Q1,2,3 to isolate skeptics where intuitive (e.g., grue’s symmetry).  
  - **Questions built to split pairs**:  
    - Q8 (Sunrise Prior) separates **Subjective Bayesian** (B: both reasonable) from **Goodmanian** (A: only uniformity is entrenched).  
    - Q5 (Jade) separates **Humean** (A: unlucky) from **Popperian** (B: flawed method).  
  - **Why obvious questions fail**:  
    - "Do you believe in induction?" is avoided—answers often contradict practical choices (e.g., Q2).  
    - Grue (Q1) doesn’t split Bayesians/Goodmanians because both can reject green if priors or entrenchment favor grue.  

  This quiz captures how readers *use* induction, not just what they profess. Discuss your leaf in your philosophy group!
