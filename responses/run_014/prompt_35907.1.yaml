  We are creating a quiz that aims to sort readers by their inductive practices without using technical jargon. The quiz will have 8-10 questions, each presenting a concrete scenario with 2-3 answer options. The options are phrased as first-person reactions. We must include specific cases as described.

  Key cases to include:
  1. The grue case (with a concrete future cutoff and defined in the question)
  2. A wager case (to see if they act on extrapolations)
  3. A predicate defined by an arbitrary external event (machine "dependable" based on lottery draw)
  4. A case with no linguistic history (synthetic compound or instrument from wreck)
  5. A retroactive case (e.g., jade being two minerals)

  Additionally, we need at least one question with the underdetermination option.

  The scoring key must map to the following leaves (with plain names and one awkward commitment each):
  - Humean skeptic
  - Popperian (no observation confirms)
  - Subjective Bayesian (any coherent assignment is rational)
  - Goodmanian conventionalist (entrenchment in linguistic practice)
  - Natural-necessity/natural-kind view
  - Reichenbachian pragmatist

  We also need:
  - Note on indistinguishable pairs
  - Guidance for residual patterns

  Let's design the questions:

  Question 1: The Grue Case
  Scenario: Imagine a new color term, "grue", defined as: an object is grue if it appears green before January 1, 2100, or blue after that date. Until now, every emerald I've seen has been green (and therefore grue, because it's before 2100). I find a new emerald today (in 2023). What do I expect?
  Options:
  A) I expect it to be green (and so grue) just like all the others.
  B) I expect it to be blue (and so grue) because after 2100 it would be blue, but I'm not sure about the date.
  C) I don't have any expectation about its color because the evidence is equally consistent with the emerald being green or blue. [Underdetermination option]

  Question 2: Wager Case
  Scenario: I've flipped a coin 100 times and it landed heads every time. A friend offers a bet: if the next flip is heads, I win $100; if tails, I lose $10. Should I take the bet?
  Options:
  A) Yes, because it's very likely to be heads.
  B) No, because the next flip is independent and could be tails.
  C) I wouldn't take either side of the bet because I don't think the past flips tell me anything about the next one.

  Question 3: Arbitrary External Event (Machine Dependability)
  Scenario: A machine has worked without failure every day for the past 5 years. However, the term "dependable" is defined by a rule: the machine is "dependable" only if it worked every day prior to the day when a specific, unrelated lottery (which hasn't been drawn yet) is drawn. The lottery draw is next week. Does the machine's past performance support the expectation that it will work tomorrow?
  Options:
  A) Yes, the machine has a perfect record, so I expect it to work tomorrow regardless of the lottery.
  B) No, because the lottery draw might happen tomorrow and then the definition of "dependable" might change, but I'm not sure what that implies for the machine's operation.
  C) The past performance only supports that the machine was working on days before the lottery draw, but since we don't know when the lottery will be drawn, I have no basis to expect it to work tomorrow.

  Question 4: No Linguistic History (Synthetic Compound)
  Scenario: Scientists have just created a new synthetic compound, Xylophane. They've tested 100 samples and every one dissolved in water. No one has ever used the word "dissolves" for Xylophane before now. Should I expect the next sample of Xylophane to dissolve in water?
  Options:
  A) Yes, because the samples so far have all dissolved, so I expect the next one to as well.
  B) No, because without a history of use, there's no reason to expect uniformity.
  C) I don't have enough information to form an expectation.

  Question 5: Retroactive Case (Jade)
  Scenario: For centuries, people in East Asia used the word "jade" for a green stone that was hard and durable. They found many samples and all had the same properties. Then, in the 19th century, mineralogists discovered that what was called jade was actually two different minerals: jadeite and nephrite, which look similar but have different chemical compositions. What do we say about the pre-19th century people who expected every new green stone they called jade to be hard and durable?
  Options:
  A) They were reasonable based on their evidence, but unlucky that there were two minerals.
  B) Their method was flawed because they didn't investigate deeply enough to discover the two kinds.
  C) Their mistake was in assuming that the word "jade" picked out a single kind of thing.

  Now, we need 3-5 more questions to round out the set and to help distinguish the leaves.

  Question 6: Another underdetermination case? Or a case to distinguish Goodmanian from natural kind?
  Let's do a case that contrasts two predicates, one entrenched and one not, but without using those terms.

  Question 6: Contrasting Predicates
  Scenario: In a lab, a device is tested. It has two buttons: one red and one blue. When the red button is pressed, the device beeps. This has happened 50 times. Then, the device is repainted so the buttons are now purple and orange. The purple button is the same physical button as the old red one. Now, I press the purple button. Do I expect a beep?
  Options:
  A) Yes, because it's the same button, just repainted.
  B) No, because the button is now purple and we haven't tested the purple button.
  C) I have no expectation because the repainting might have changed something.

  This tests whether the subject relies on the physical continuity (natural kind) or the color predicate (which changes).

  Question 7: A case for the Popperian? To see if they ever take past observations as confirming.
  Scenario: I have a theory that all ravens are black. I have observed 1000 ravens and all were black. My friend says, "So your theory is confirmed?" How do I respond?
  Options:
  A) Yes, the more black ravens I see, the more confirmed the theory is.
  B) No, because I could still find a non-black raven, so it's not confirmed, but I do think it's more likely to be true.
  C) No, because no number of observations can confirm a universal theory; they can only refute it.

  Question 8: A case for the Reichenbachian pragmatist? They might act as if induction works because it's the best we can do.
  We can use a variation of the wager case? But we already have one.

  Alternatively, a case that asks about the method itself.

  Scenario: I am considering two methods for predicting the future: one is to always expect the same as the past, the other is to always expect the opposite. I have to choose one method to use for all future predictions. Which do I choose and why?
  Options:
  A) The method that expects the same as the past, because it has worked well so far.
  B) The method that expects the opposite, because it might be time for a change.
  C) I choose the method that expects the same as the past, not because I know it will work, but because if any method is going to work, this one is as good as any, and at least it's systematic.

  Now, we have 8 questions. Let me adjust to make sure we have 8-10.

  Question 9: Another case to distinguish the subjective Bayesian? They might allow any prior, so we need a case where two different priors could lead to different expectations, and see if the subject is comfortable with that.

  Scenario: I have two friends. One always expects the sun to rise tomorrow because it always has. The other expects the sun to stop rising tomorrow because he thinks it's overdue for a change. Both have the same evidence. Is one being more reasonable than the other?
  Options:
  A) The first friend is more reasonable because the uniform past supports the expectation of the sunrise.
  B) The second friend is just as reasonable because the evidence doesn't force one expectation over the other.
  C) The second friend is unreasonable because he has no evidence for expecting a change.

  Question 10: A case to test if they use background knowledge.

  Scenario: Every winter for the past 100 years, Lake Michigan has frozen over. This winter, I expect it to freeze again. Is this expectation based only on the past freezes?
