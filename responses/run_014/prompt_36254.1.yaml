prompt: |-
  For the final paper in my civics course, I am supposed to defend a principle for who belongs in a democracy's electorate, but before defending any particular principle I want to know what such a principle actually has to accomplish. Please write out the requirements any adequate answer to the boundary problem — the question of who belongs to the demos — must meet: the cases it has to classify correctly (children, tourists, permanent residents, people convicted of serious crimes, citizens living abroad, future generations affected by today's environmental laws), the distinctions it cannot collapse (being affected by a decision, being coerced by it, and having a long-term stake in the community), and the constraints it cannot violate — including that it not be circular, since a demos cannot democratically vote itself into existence without already presupposing a demos. For each requirement, give the case or consideration that motivates it, and mark which requirements are genuinely non-negotiable and which are just the preferences of one camp. Then address the part I most want to see: whether some subset of the requirements is jointly unsatisfiable — I suspect the demand that everyone affected by a decision be included and the demand that the demos remain a bounded, deliberating unit cannot both be satisfied, given how easily "affected" spreads across borders. Finally, briefly score the all-affected-interests principle, the all-subjected-to-coercion principle, and stakeholder views against your list; keep that part short, since the requirements are the substance.
reasoning: |-
  Okay, the user is working on a civics paper about defining who belongs in a democracy's electorate. They want to understand the requirements any principle must meet before defending one. Let me start by breaking down their query. They mentioned specific cases like children, tourists, permanent residents, etc., distinctions like affected vs. coerced vs. long-term stake, and constraints like non-circularity. They also want to know if some requirements conflict, especially the "all-affected" principle clashing with practical boundaries.

  First, I need to list all the requirements. The user provided examples, so each requirement should be tied to those cases. For instance, children motivate the exclusion without disenfranchisement requirement. Tourists highlight temporary presence. Permanent residents bring up inclusion despite non-citizenship. Then there are distinctions: affected vs. coerced vs. long-term stake. Constraints include non-circularity, determinacy, practicability, and normative grounding.

  Next, I should categorize which requirements are non-negotiable versus preferences. Non-negotiables are logical necessities, like non-circularity and avoiding contradictions. Preferences might be things like temporal scope, where different theorists argue. The user wants clarity here, so I need to mark each accordingly.

  The user suspects a conflict between including all affected and keeping the demos bounded. That's crucial. The all-affected principle can expand infinitely, making a practical demos impossible. But is this conflict resolvable? Some theorists might argue for a bounded interpretation, but inherently, there's tension. I should note that as a central tension, not a strict unsatisfiability, but still a major issue.

  Then, scoring principles: all-affected interests, all-subjected-to-coercion, and stakeholder views. Each has strengths and weaknesses. All-affected is inclusive but over-inclusive. Coercion addresses legitimacy but might exclude those affected without coercion. Stakeholder focuses on long-term interests but might exclude temporary residents. The user wants this brief, so just key points per principle.

  I need to ensure the answer addresses each part: requirements with cases, distinctions, constraints, conflict analysis, and principles' scores. Also, the user's deeper need might be understanding the core philosophical challenges to build a strong defense. Highlighting tensions helps them frame their argument, maybe by proposing a hybrid principle or justifying trade-offs.

  Check if non-circularity is absolute. Yes, because bootstrapping a demos requires an initial definition. Determinacy is practical but not always absolute, though necessary for implementation. Practicability is context-dependent but vital for real-world application. The conflict between all-affected and boundedness is key; emphasizing that helps the user focus their paper's argument.

  Make sure the response is structured clearly, using the user's outline. Avoid markdown, keep it conversational. Ensure each requirement is explained with its motivating case and marked as negotiable or not. Then analyze the conflict, and briefly score each principle. Conclude that the requirements are challenging but essential for a robust defense.
answer: |-
  Here’s a breakdown of the requirements for any adequate principle defining the democratic *demos*, structured as requested. The requirements emerge from logical, practical, and normative challenges inherent to the "boundary problem."

  ### Core Requirements & Their Motivations
  1.  **Excludes Children Without Disenfranchising Competent Adults (Non-Negotiable):**
      *   **Motivation:** Children lack the cognitive maturity for informed voting. However, any principle excluding them cannot also exclude competent adults arbitrarily (e.g., based on race, gender, or arbitrary tests). The principle must justify exclusion *only* based on relevant incapacity.
      *   **Case:** Children.

  2.  **Excludes Mere Transient Visitors (Negotiable Preference):**
      *   **Motivation:** Tourists lack a sustained connection to the community or its future. Democratic membership implies more than temporary physical presence. Preferences vary on *how* temporary presence must be to warrant exclusion.
      *   **Case:** Tourists.

  3.  **Includes Permanent Residents (Negotiable Preference - Strong Consensus):**
      *   **Motivation:** Individuals residing long-term, paying taxes, subject to laws, and shaping the community have a fundamental stake in its governance. Excluding them creates a class of governed non-participants, undermining democratic legitimacy for them.
      *   **Case:** Permanent Residents.

  4.  **Addresses Exclusion for Serious Crimes (Negotiable Preference):**
      *   **Motivation:** Felony disenfranchisement exists but is contested. A principle must explain *if* and *why* committing a crime can justifiably override the presumption of inclusion. Does it relate to forfeiture of civic trust, incapacity, or something else?
      *   **Case:** People convicted of serious crimes.

  5.  **Addresses Citizens Abroad (Negotiable Preference):**
      *   **Motivation:** Citizens living abroad are still legally bound (e.g., taxation, conscription) and retain citizenship rights. Should they vote? The principle must clarify the role of physical presence/absence vs. formal membership vs. direct impact.
      *   **Case:** Citizens living abroad.

  6.  **Considers Future Generations (Negotiable Preference):**
      *   **Motivation:** Decisions like environmental policy profoundly affect people who don't yet exist. How can a principle acknowledge their interests within a system requiring present actors? Pure inclusion is impossible, so representation models are needed.
      *   **Case:** Future generations affected by today's laws.

  7.  **Distinguishes "Affected" from "Subjected to Coercion" (Non-Negotiable):**
      *   **Motivation:** Globalization means *everyone* is potentially "affected" by major decisions (e.g., US interest rates). However, democracy requires a bounded group making *authoritative, enforceable* decisions. The principle must distinguish mere causal impact (affected) from being directly bound by the enforceable rules/laws (subjected to coercion). Collapsing this distinction dissolves boundaries.
      *   **Distinction:** Affected vs. Subjected to Coercion.

  8.  **Distinguishes "Affected" / "Subjected" from "Long-Term Stake" (Negotiable Preference):**
      *   **Motivation:** A tourist jailed for trespassing is "subjected to coercion," but lacks a long-term stake. A permanent resident child is "subjected to coercion" and has a long-term stake but lacks capacity. The principle must clarify if membership requires long-term commitment (stake) beyond just being subject to rules or affected.
      *   **Distinction:** Affected/Subjected vs. Long-Term Stake.

  9.  **Non-Circularity (Non-Negotiable):**
      *   **Motivation:** The *demos* cannot democratically decide its own composition without presupposing an initial *demos*. The principle must provide a non-democratic (yet democratically justifiable) criterion for initial membership.
      *   **Constraint:** Cannot presuppose an existing demos.

  10. **Determinacy (Practically Non-Negotiable):**
      *   **Motivation:** The principle must allow for reasonably clear identification of members in practice. Excessively vague criteria ("all affected") fail this, leading to arbitrary application or paralysis.
      *   **Constraint:** Must be applicable in the real world.

  11. **Practicability / Feasibility (Negotiable Preference - Degree):**
      *   **Motivation:** The demos must be capable of functioning as a deliberative and decision-making body. Extreme size or dispersion hinders effective democracy. The principle shouldn't demand the impossible (e.g., including every affected person globally).
      *   **Constraint:** Must enable a functioning political unit.

  12. **Normative Grounding (Non-Negotiable):**
      *   **Motivation:** The principle must be defensible based on core democratic values (e.g., political equality, autonomy, legitimacy, avoiding tyranny). It can't be arbitrary.
      *   **Constraint:** Must align with democratic theory.

  ### The Central Tension: Joint Unsatisfiability?
  You are correct to suspect a fundamental tension:

  *   **"All Affected" Demand:** Arguably essential for full legitimacy – those impacted should have a say.
  *   **Bounded, Deliberating Unit Demand:** Essential for democracy to function practically and meaningfully.

  **Why they clash:** In an interconnected world, "affectedness" is potentially global (climate change, economic policy, war) and temporally vast (future generations). Including *everyone* affected makes the demos impossibly large, dispersed, and heterogeneous, destroying its capacity for deliberation, collective identity, and efficient decision-making. It becomes administratively and politically infeasible. **Therefore, these two requirements are *jointly unsatisfiable* in any strict sense.** Any viable principle *must* compromise one to satisfy the other, or reinterpret "affected" narrowly (e.g., as "directly and significantly subjected to coercion").

  ### Brief Scoring of Major Principles
  1.  **All-Affected Interests Principle:**
      *   **Strengths:** Intuitive normative pull (inclusion based on impact), potentially includes residents, future gens (conceptually).
      *   **Weaknesses:** **Fails Determinacy/Practicability** catastrophically (boundary explosion), **Collapses Affected/Coercion Distinction**, struggles with children/criminals/abroad citizens, **violates Bounded Unit requirement**. Highly vulnerable to the central tension.

  2.  **All-Subjected-to-Coercion Principle:**
      *   **Strengths:** Stronger normative link to legitimacy (justifying force), clearer boundaries than "affected" (focuses on enforceable laws), **Distinguishes Affected/Coercion**, better handles residents, often includes citizens abroad. More **Determinate/Practicable** than All-Affected.
      *   **Weaknesses:** May exclude some deeply affected but not directly coerced (e.g., foreign workers in coercive industries?), struggles with children (subjected but incapable) and future gens. "Coercion" scope can be contested. Less intuitive for some than "affected."

  3.  **Stakeholder Principles (e.g., long-term interest/residence):**
      *   **Strengths:** Explicitly incorporates **Long-Term Stake**, strongly justifies including permanent residents, promotes deliberative stability, often more **Determinate/Practicable** (e.g., residency period). **Distinguishes Stake from Affected/Coercion**.
      *   **Weaknesses:** Can exclude temporarily coerced individuals (e.g., migrant workers), citizens abroad may lose "stake," future gens still problematic. "Stake" can be vague. May seem less directly tied to justifying state coercion than the Subjected principle.

  **In essence:** No principle perfectly satisfies all requirements, especially resolving the core tension. The All-Affected principle suffers most severely from the boundary explosion, making it the weakest on feasibility. The All-Subjected principle offers the best balance between normative grounding and determinacy for defining a core demos, while Stakeholder principles provide important supplementary justifications, particularly for inclusion based on belonging. Your defense will need to acknowledge these tensions and argue why your chosen principle offers the most compelling compromise or reinterpretation of the requirements.
