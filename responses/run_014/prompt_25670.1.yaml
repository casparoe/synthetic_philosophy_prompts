  ## Project Proposal: Mapping the Normative Terrain of Geometric Rationality

  **Project Title:** When Does Growth Rule? A Philosophical Taxonomy for Geometric Rationality in Decision Theory

  **Principal Investigator:** [Your Name], Associate Professor of Philosophy  
  **Duration:** 8 weeks (Summer 2024)  
  **Funding Requested:** [Specify Amount - e.g., Summer stipend, research assistance, travel for one workshop]

  **1. The Core Problem: Normative Ambiguity in Geometric Rationality**

  Decision theory grapples with fundamental questions about rational choice under uncertainty. A persistent tension exists between two powerful frameworks: orthodox Expected Utility (EU) theory and the approach known as "Geometric Rationality" (GR), exemplified by the Kelly criterion. The Kelly criterion, for repeated favorable bets, prescribes betting a fixed fraction of one's bankroll to maximize the *expected logarithm of wealth*, thereby maximizing the long-run *growth rate* of wealth. GR proponents argue this is rationally superior to maximizing expected wealth (which can lead to ruin) because real-world wealth evolution is fundamentally *multiplicative* rather than additive. They emphasize the importance of *time-average growth rates* over *ensemble-average expectations*, particularly in non-ergodic contexts where these diverge.

  Despite decades of debate, the *normative status* of GR remains deeply unsettled. GR advocates point to compelling long-run dominance results: Kelly betting almost surely outperforms any other fixed-fraction strategy in repeated, identical, independent trials. EU theorists counter that this result is contingent: Kelly betting is *precisely* equivalent to maximizing expected utility *only* for an agent with a logarithmic utility function over terminal wealth. If an agent has a different utility function (e.g., linear, quadratic, S-shaped), the Kelly strategy demonstrably fails to maximize their expected utility. The debate often stalls here: GR proponents showcase the pragmatic success and long-run logic of growth-rate maximization, while EU theorists insist rationality is defined by preference satisfaction via utility maximization, not by long-run dominance per se.

  **The critical gap this project addresses is the lack of a systematic analysis of *when* and *why* geometric reasoning possesses genuine normative force.** Is GR merely a useful heuristic for specific repeated gambles, or does it represent a fundamental principle of rationality under certain structural conditions? Conversely, when does adherence to GR lead normatively astray? The current stalemate stems from a failure to dissect the decision context sufficiently. This project proposes that the normative authority of GR hinges on specific, under-analyzed features of the decision environment.

  **2. Beyond the Stalemate: Key Contextual Dimensions**

  My hypothesis is that the normative force of geometric rationality varies systematically along at least three distinct dimensions:

  *   **Repetition & Horizon:** Is the decision a single isolated choice, part of a finite sequence of similar choices, or an element of an effectively infinite sequence? Kelly's dominance results hold strictly only in the infinite limit. How does normative force change with finite horizons?
  *   **Diversifiability of Risk:** Are the risks faced *idiosyncratic* (diversifiable across independent bets or agents) or *systematic* (non-diversifiable)? GR logic seems strongest when risks are idiosyncratic and repeated, allowing the law of large numbers to work. When risks are systematic (e.g., correlated market crashes), the ensemble perspective of EU might regain normative primacy.
  *   **Ergodicity:** Is the underlying stochastic process *ergodic* (where time averages converge to ensemble averages with probability one) or *non-ergodic* (where they diverge)? GR proponents argue that EU is fundamentally flawed in non-ergodic settings (like multiplicative wealth growth over time) because it reasons about an ensemble of possible worlds, not the single path an agent actually experiences. Establishing the normative implications of (non-)ergodicity is crucial.

  The core contention is that these dimensions interact to determine the normative status of geometric reasoning:
  *   **Mandatory:** In contexts of infinite repetition, idiosyncratic risk, and non-ergodicity (e.g., repeated independent favorable bets), GR may be the *uniquely rational* approach due to its long-run dominance and alignment with the agent's single-path experience.
  *   **Permissible:** In contexts with finite but long horizons and moderately diversifiable risk, GR may be one rational strategy among others (including EU with specific utility functions), with its appeal depending on risk tolerance and specific goals.
  *   **Misleading:** In one-shot decisions, contexts dominated by systematic risk, or ergodic processes, insisting on GR logic might lead to choices that are normatively inferior according to the agent's own preferences, as captured by non-log EU.

  **3. Project Method: Conceptual Cartography**

  This is a project in philosophical decision theory, employing conceptual analysis and formal modeling. The primary methodology involves:

  1.  **Conceptual Clarification:** Precisely defining the key contested terms: "normative force," "geometric rationality," "ergodicity" (in the decision-theoretic sense), "diversifiability," and the scope of "decision context."
  2.  **Taxonomy Construction:** Systematically mapping the conceptual space defined by the identified dimensions (Repetition, Diversifiability, Ergodicity). This involves:
      *   Defining distinct "cells" within the taxonomy.
      *   Analyzing the logical implications for wealth dynamics and rational choice within each cell.
      *   Drawing on established results from probability theory (e.g., laws of large numbers, multiplicative processes, ergodic theory) and decision theory (e.g., properties of EU, multi-armed bandit problems, portfolio theory).
  3.  **Normative Analysis:** For each cell in the taxonomy:
      *   **Evaluate GR Claims:** Does maximizing geometric mean (or similar) align with long-run dominance? Is non-ergodicity a decisive factor?
      *   **Evaluate EU Claims:** Can a non-log utility function prescribe a strategy that dominates Kelly in the long run within this context? Does EU adequately capture the agent's experience in non-ergodic paths?
      *   **Determine Status:** Is GR rationally mandatory, permissible, or irrational here? Why?
  4.  **Case Study Application:** Illustrate the taxonomy's application and normative conclusions with stylized but representative examples:
      *   *Cell A (Infinite Repetition, Idiosyncratic Risk, Non-Ergodic):* Repeated independent coin flips with edge (Classic Kelly Mandate).
      *   *Cell B (Finite Repetition, Idiosyncratic Risk, Non-Ergodic):* A limited number of similar investment opportunities.
      *   *Cell C (One-Shot, Systematic Risk, Non-Ergodic):* A single, high-stakes bet on a unique event with market-wide implications.
      *   *Cell D (Repeated, Systematic Risk, Non-Ergodic):* Investing in a volatile market with correlated downturns.
      *   *Cell E (Ergodic Process):* Gambling in a casino game with known, stable odds where wealth changes are additive (e.g., some table games). Does GR logic apply meaningfully here?
  5.  **Engagement with Critiques:** Actively consider potential counterarguments: Is the taxonomy robust? Are the dimensions independent? Does it dissolve or merely relocate the disagreement? Does it address concerns about path-dependence or the "gambler's ruin" problem outside pure Kelly?

  **4. Realistic Timeline (8 Weeks)**

  *   **Weeks 1-2:** Intensive Literature Review & Conceptual Groundwork. Deep dive into key Kelly, GR, ergodicity economics, and EU critiques. Finalize definitions and dimensional scope.
  *   **Weeks 3-5:** Taxonomy Development & Core Analysis. Construct the framework, populate cells, perform normative analysis for core cells using formal models and logical argumentation.
  *   **Week 6:** Case Study Elaboration & Counterargument Integration. Develop detailed examples and rigorously test the framework against potential weaknesses.
  *   **Week 7:** Synthesis & Drafting. Formulate overarching conclusions about the normative landscape of GR. Begin drafting the core paper/manuscript.
  *   **Week 8:** Refinement & Proposal for Future Work. Polish arguments, clarify exposition, outline potential journal targets, and identify next research steps (e.g., exploring additional dimensions like ambiguity, state-dependent utility).

  **5. Defining Success and Failure: Intellectual Honesty**

  This project's success hinges on achieving conceptual clarity and advancing the philosophical debate, *not* on proving GR universally correct or incorrect.

  *   **Success Looks Like:**
      *   Developing a coherent, well-argued taxonomy that meaningfully distinguishes decision contexts relevant to GR's normative force.
      *   Providing compelling philosophical arguments for why GR is mandatory, permissible, or irrational within specific cells of the taxonomy.
      *   Explaining *why* the current debate is stuck by showing how proponents argue from different, contextually valid premises.
      *   Generating a substantial draft of a journal article suitable for submission to a top philosophy of science, economics, or decision theory journal (e.g., *Philosophy of Science*, *Economics and Philosophy*, *Journal of Philosophy*).
      *   Stimulating further productive discussion by providing a clearer map of the contested terrain.
  *   **"Failure" is Nuanced:**
      *   **Clarifying "Failure":** If rigorous analysis reveals that geometric rationality *always* reduces to maximizing expected utility with a logarithmic function (i.e., GR is just EU-log in disguise), **this is a significant success, not a failure.** It would resolve the apparent conflict by showing GR is a *special case* of EU, applicable only when the decision context *and* the agent's implicit utility function align with log utility. This would be a major clarifying result, worthy of publication, demonstrating that the debate stems from a misapprehension of GR's foundations within the broader EU framework.
      *   **Genuine Challenges:** Potential hurdles include:
          *   The taxonomy collapsing due to unforeseen interdependencies between dimensions.
          *   Discovering that ergodicity is too difficult to define or apply operationally in the relevant decision contexts.
          *   Failing to provide arguments strong enough to convince proponents entrenched on either side of the current debate.
          *   Concluding that the dimensions identified don't adequately capture the source of normative disagreement.

  Even encountering these challenges would yield valuable insights. A collapsed taxonomy would reveal a deeper unity (or confusion) needing explanation. Difficulty with ergodicity would highlight a crucial conceptual problem requiring further work. Failure to persuade entrenched views would pinpoint where the deepest philosophical disagreements lie. **Therefore, the project succeeds if it provides rigorous philosophical analysis that clarifies the relationship between GR and EU, regardless of whether it crowns one framework or reveals a more complex, context-dependent landscape.**

  **6. Conclusion: Why This Matters**

  The debate between geometric rationality and expected utility theory touches the foundations of rational choice, especially concerning repeated decisions, growth, and risk over time. It has profound implications for economics, finance, and potentially other fields like evolutionary biology or AI safety. This project moves beyond the entrenched positions by asking a more fundamental philosophical question: *Under what conditions does the logic of multiplicative growth impose its own normative demands?* By constructing a careful taxonomy based on repetition, diversifiability, and ergodicity, this research aims to provide a much-needed conceptual map, resolving ambiguities and pinpointing the precise loci of disagreement. Whether the result is a vindication of GR in specific domains, its absorption into EU, or a more pluralistic picture of rationality, this summer's work promises significant philosophical progress on a stubborn and important problem. The funding requested will enable the focused, uninterrupted research time necessary to develop these complex arguments rigorously.
