prompt: |-
  Me and my brother both got made redundant last spring when the depot brought in picking robots, and one thing has been bugging me since. As far as I can tell, the government took income tax and national insurace off our wages every single week, but it takes nothing equivalent off the machine thats now doing the same job — and I'm fairly sure the company got a tax allowance for buying it. Meanwhile every politician goes on about full employment and the dignity of work.

  What view of work does that tax setup actually presuppose? Reconstruct the implicit theory as best you can — is it that a job matters only because of the paycheque, that automation is a favour to everyone, or something else entirely — and name the views of work it quietly rules out, like work giving you standing in a community, or work being a relationship between people rather than a purchase. Then be honest about whether the practice really needs that theory or is just underdetermined by it being easier to tax wages than kit. Point at where the whole thing contradicts itself. And end with what would have to change if the state treated meaningful work as a good in itself rather than a delivery mechanism for income.

  British English please, and give it to me as exactly five numbered points, one or two sentences each, with no introduction and no conclusion.
reasoning: |-
  Okay, the user was made redundant along with his brother when their depot introduced picking robots. He's frustrated because the government taxed their wages but doesn't tax the machines that replaced them, and he suspects the company got tax breaks for buying those robots. Politicians talk about full employment and work dignity, yet this tax setup seems contradictory. 

  I need to reconstruct the implicit theory behind this tax policy. The user wants me to identify what view of work this presupposes - whether it sees jobs only as income sources, if automation is viewed as beneficial, or something else. I also need to point out which views of work are excluded, like community standing or human relationships in work. I should assess whether the policy actually requires this theory or if it's just administratively easier to tax wages than equipment. I must highlight contradictions in the system and end with what would change if the state valued meaningful work intrinsically.

  Hmm, the core issue seems to be that the tax system treats human labor as a cost (taxing wages) while incentivizing capital investment (tax allowances for machines). This implicitly frames work as merely an economic transaction - the paycheck is what matters, not the activity itself or its social value. The views being ruled out include work as social contribution, source of identity, or meaningful human activity. 

  The contradiction is glaring: politicians champion "dignity of work" while building systems that financially encourage replacing workers with non-taxed machines. Is this deliberate ideology or just path dependency? Probably both - it's easier to tax visible wages than conceptualize "machine labor," but the effect entrenches capital bias. 

  If the state truly valued work intrinsically, everything would shift. We'd see automation taxes to level the playing field, subsidies for job creation over efficiency, maybe even redefining economic success beyond productivity metrics. The whole notion of "redundancy" would be questioned if maintaining employment was a policy goal in itself. 

  The user's bitterness is palpable - he's named the hypocrisy perfectly. My response should validate that while dissecting the structures behind it. Those five points need to be razor-sharp: implicit theory, excluded values, system contradictions, administrative reality check, and the alternative vision. British English throughout, no fluff.
answer: |-
  Here are five numbered points addressing your query:

  1.  **Implicit Theory of Work:** The tax setup presupposes work is solely a **cost of production**, viewing labour primarily as an expense (wages) to be taxed at source, while automation equipment is seen as a **capital investment** generating future value, meriting tax relief. It implicitly treats human work as merely an input for generating taxable income.

  2.  **Excluded Views of Work:** This system quietly rules out views that work provides **intrinsic dignity, social standing, community integration, or identity**, or that it constitutes a **meaningful human activity or relationship** beyond the simple exchange of labour for a wage. The non-taxation of the machine underscores that these human aspects hold no fiscal value.

  3.  **Theory vs. Practicality:** While the setup *reflects* viewing labour as a cost and capital as investment, the practice is significantly **underdetermined by administrative ease**: taxing regular, visible wage payments is vastly simpler than defining and taxing the ongoing "economic activity" or "value extraction" performed by a machine.

  4.  **Internal Contradiction:** The system **contradicts itself** by financially incentivising the replacement of human workers (via capital allowances and no 'robot tax') while simultaneously espousing political rhetoric about "full employment" and the "dignity of work", implicitly devaluing the very labour it claims to champion.

  5.  **Change for Meaningful Work as a Good:** If the state treated meaningful work as intrinsically valuable, policy would shift towards **taxing automation/robotics to level the playing field**, offering **significant subsidies for human job creation and retention**, and prioritising **tax structures incentivising good, stable employment** over pure capital efficiency or labour displacement.
