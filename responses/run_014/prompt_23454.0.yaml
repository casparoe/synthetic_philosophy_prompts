answer: |-
  ## The Case for the Bare Truth: Why Promises Only Bind When Harm Looms

  We’ve been sold a powerful myth about promises: that the act of uttering "I promise" creates an invisible moral chain, forged by our own will, binding us regardless of consequence. This Kantian "will theory" has undeniable elegance and intuitive pull. Who hasn’t felt the weight of their own word? But that weight, I argue, isn't the gravity of free-standing moral law; it's the echo of potential harm. The least popular account in philosophical circles – T.M. Scanlon’s derivative or harm-based view – gets closest to the messy, contingent truth: **a promise binds morally *only* when breaking it would harm the promisee by violating a principle we couldn’t reasonably reject.** When no harm looms, the moral wrong evaporates, leaving only social noise or personal disappointment.

  **The Will Theory’s Seductive Illusion: Coercion in Moral Drag**

  The will theory’s appeal lies in its seeming purity. You *willed* it! You created a right! Breaking it is an affront to autonomy itself! But this purity is an illusion. The perceived "authority" of the promise-maker’s will isn't a magical moral power; it mirrors the felt authority of a *threat*. 

  Consider coercion: "Hand over your wallet or I'll shoot." The *bindingness* here isn't in the robber's *will* commanding yours; it's in the credible *threat* of harm if you disobey. The will theory subtly replicates this structure within the individual. When we promise, we implicitly *threaten ourselves* with the harm of becoming a promise-breaker – the social stigma, the loss of trustworthiness, the guilt. "Keep your promise *or* suffer the consequences of being unreliable." The "binding force" we feel isn't a unique moral fact conjured by our declaration; it's the anticipated social and psychological fallout – the *harm* – associated with reneging. The will theory mistakes the *internalization* of this threat (becoming "the kind of person who breaks promises") for an inherent moral authority residing in the act itself. It’s coercion turned inward, disguised as moral duty.

  **The Edge Case Revealed: The Cancelled Lecture**

  Now, to the core challenge: I promise my colleague, Dr. Jones, I’ll attend her guest lecture. Unbeknownst to me, she secretly cancels the entire event. I skip it anyway. No one is present, no one expected me, no harm is done. Has a moral wrong occurred?

  *   **The Will Theorist:** Insists yes. I exercised my will to create a duty to attend. By not attending, I violated that self-imposed duty, wronging Dr. Jones’s "right" to my attendance, even though she neither knew nor cared I broke it.
  *   **The Derivative Verdict:** Emphatically no. *Morally*, I did nothing wrong. Scanlon’s principle of fidelity (Principle F) holds we have a duty not to lead others to form reasonable expectations about our future behavior and then intentionally disappoint them *when they would suffer a loss as a result*. Here, no expectation was formed (she knew it was cancelled), and crucially, *no loss occurred*. My skipping the non-event caused Dr. Jones no setback, disappointment, or practical inconvenience. The promise, in this context, was inert.

  **But it *feels* wrong! Why?** This intuition is powerful but misleading. It points to realities *other* than moral wrongness:
  1.  **Etiquette & Social Ritual:** Breaking a promise, even a "dead" one, violates a powerful social norm. It *feels* rude, like not clapping after a performance. This is about propriety, not fundamental morality.
  2.  **Self-Conception & Virtue:** I might feel I failed *myself* – I’m not the reliable person I aspire to be. This is about character and integrity *as personal ideals*, not about violating a duty *to another person*.
  3.  **Institutional Friction:** Promises function within a social system built on trust. Habitually breaking promises, even harmless ones, weakens the institution and makes *future* promises less credible, potentially causing *future* harm. But the wrong in that case lies in the *future consequences*, not in the isolated act itself.

  The moral core of promise-keeping isn't fidelity to a past act of will; it's preventing the tangible setback to another person’s interests that flows from their reliance on our commitment. Where no reliance exists and no setback occurs, the moral engine stalls.

  **The Solitary Pledge: Promising to Oneself**

  What of the vow to quit smoking? Does the derivative account collapse here? Not entirely, but it requires precision.

  1.  **Is it a "Promise"?** Scanlon argues promises are inherently *interpersonal*. A "promise to oneself" is better understood as a *resolution*, *pledge*, or *commitment*. It lacks the core interpersonal element: creating an expectation *in another* that grounds a potential harm *to them*.
  2.  **What "Binds"?** The binding force isn't a moral duty generated by the pledge itself. It stems from:
      *   **Prudential Reasons:** Smoking harms *you*. The pledge is a tool to combat weakness of will and serve your own long-term interests (health, finances). Breaking it harms *your future self* by perpetuating that harm and potentially undermining your self-efficacy.
      *   **Self-Trust:** Habitually breaking resolutions weakens your ability to govern your own future actions – a practical, not strictly moral, harm to your agency.
      *   **The Absence of a Distinct Moral Wrong:** There is no *interpersonal* moral wrong in breaking a resolution, because there is no *other* person whose expectations are reasonably formed and violated to their detriment. The "wrong" is primarily a failure in self-governance or prudence, not a violation of a promise-based *duty*.

  The derivative account doesn't struggle with self-pledges because it correctly identifies them as a different category of act. The "bindingness" comes from the harm *to oneself* of continuing the harmful behavior and the practical costs of weak will, not from a magical self-generated duty.

  **Candid Vulnerability: The Weight of the Unseen**

  The derivative account’s greatest vulnerability lies in cases where harm seems intuitively present but is deeply obscured or deferred. Consider a **deathbed promise**: You promise your dying grandmother to always care for her prized rose garden. She dies peacefully, never knowing you later neglect it. No one else knows of the promise or cares about the garden. It crumbles to weeds.

  *   **Derivative Verdict:** Hard to see a clear harm *to the promisee*. She’s gone, beyond disappointment. The garden's loss harms no one's interests she was concerned with. Morally permissible? Perhaps.
  *   **Intuitive Revolt:** This feels monstrously wrong. The will theorist pounces: you violated her right, created by your promise!

  The derivative account must argue either:
  1.  There *is* a harm: violating a principle (respecting last wishes) that we couldn't reasonably reject, as it upholds the value we place on the wishes of the dying and the continuity of care for things they valued. Or,
  2.  The strong intuition stems from powerful non-moral sources: profound sentiment, cultural reverence for the dead, the symbolic weight of final requests, or guilt over perceived betrayal of a relationship's memory.

  Admitting this feels unsatisfying is crucial. The derivative view demands we disentangle deep sentiment, symbolic meaning, and personal grief from the core question of *harm to the promisee's interests*. It forces a starkness that can seem cold, requiring us to say the moral wrong, if any, is far less absolute than our feelings suggest. Its strength is its ruthless focus on actual consequences for others; its weakness is potentially undervaluing the moral significance of commitment *as such* in our lived experience, especially when harm is intangible or relational. It leaves us holding the bare wire of harm, sometimes wishing for the comforting insulation of the will.

  **Conclusion: Embracing the Derivative Core**

  The derivative account strips promise-keeping of mystical will-power. It grounds it firmly in preventing harm caused by disappointed, reasonable reliance. The will theory's compelling authority is the shadow of internalized social consequence, not moral bedrock. The cancelled lecture exposes the emperor's lack of clothes: no harm, no foul. Self-pledges bind through prudence, not promissory magic. Yes, the deathbed case stings – it reveals the view's austere demand to prioritize tangible harm over symbolic fidelity. But in a world drowning in broken vows causing real suffering, isn't it the harm that truly matters? The moral weight of a promise isn't in the saying; it’s in the potential wreckage of the breaking. That’s the bare, binding truth.
