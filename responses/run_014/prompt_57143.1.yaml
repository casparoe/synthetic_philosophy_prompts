  We are given a scenario involving Marta and her decision problem at the turnoffs. The argument presented by the user is a reductio ad absurdum against the principle (1) that an agent rationally maximizes expected utility given current information. The user wants to keep (1) but avoid the conclusion that humans are irrational in a way that puts them outside the theory's jurisdiction.

  Let me restate the key steps of the argument:

  (1) Rational action at a moment is maximizing expected utility given current information.

  (2) A plan is rationally adoptable only if it remains rational to carry out at every point; if the agent would rationally drop it, she won't execute it.

  (3) Therefore, Marta can only adopt plans that are "turnoff-optimal" (i.e., at each turnoff, the action is optimal given the information at that turnoff).

  (4) For Marta, at each turnoff, turning gives 4 (since with credence 1/2 she is at the first and gets 0, or at the second and gets 8, so 0.5*0 + 0.5*8 = 4) and going straight gives 2 (because she will face the same situation at the next turnoff and do the same, so she ends up going straight at both and getting 2). So turning is better, and the plan "turn at every turnoff" is the unique turnoff-optimal plan, yielding 4 ex ante.

  (5) The wide-awake twin, who can distinguish, can adopt the plan: go straight at the first (which she knows is the first) and turn at the second (which she knows is the second), getting 8.

  (6) The gap of 4 between the two Martas is due solely to Marta's inability to discriminate at the moment of choice.

  (7) Generalization: Whenever an agent has a shortfall (i.e., gets less than the maximum possible), it is because at some moment of choice she failed to discriminate between situations that require different actions.

  (8) Therefore, a fully rational agent must have perfect recall (or, more precisely, at each moment of choice, she knows exactly which moment she is at in the decision tree).

  (9) Humans do not have perfect recall (as illustrated by the user and his grandmother).

  (10) Therefore, no human is a rational agent (in the sense of the theory) — not just somewhat irrational, but outside the theory.

  (11) Thus, expected utility theory (with (1) at its core) is not a normative theory for humans because it describes an impossible creature and labels every human as irrational, which is a misuse.

  (12) Therefore, (1) is false.

  The user wants to reject the conclusion (12) and keep (1), but also avoid (10) and (11). He is open to dropping (2) but notes that even without (2), Marta might not be able to execute a plan that requires different actions at indistinguishable turnoffs.

  The user also points out that the same issue arises in a non-paradoxical scenario: his grandmother who doesn't remember if she took her pill. In that case, we apply (1) and compute the expected utility of taking the pill or not, and that seems reasonable. So why does the turnoff case feel like a reductio?

  Let me analyze the argument step by step.

  First, note that the turnoff case is a classic example of an absentminded driver (first discussed by Piccione and Rubinstein). The standard resolution in decision theory is that the initial approach (which leads to the 4 vs 8 gap) is flawed because it does not account for the fact that the agent's strategy must be consistent across indistinguishable decision nodes. In fact, the problem is that the agent is at an information set that contains both turnoffs, and she must choose the same action at both. Therefore, the plan must assign the same action to both nodes. So in that sense, (2) is not needed to force the same action; the information set structure already requires it.

  But the argument goes beyond that. The user is arguing that the shortfall (4 vs 8) is due to the lack of discrimination, and that in general, without perfect recall (or without being able to distinguish every decision node) we have such shortfalls, and that this implies that the theory of rationality requires perfect recall.

  However, note that in the grandmother's pill case, we don't conclude that she is "outside the theory". We apply expected utility theory and get a solution. So what is the difference?

  The key is that in the grandmother's case, the decision problem is a single decision node (with uncertainty about the state of the world: whether she has already taken the pill or not). In the turnoff case, it is a sequential decision problem with two decision nodes that are indistinguishable. The theory of sequential decisions with imperfect recall is more complex and leads to paradoxes (like the absentminded driver) that have been extensively discussed.

  The flaw in the argument might be in step (7) and (8). The user generalizes that any shortfall is due to a failure to discriminate at the moment of choice. But note: in the pill case, there is a shortfall? Actually, if the grandmother could remember, she would never take a double dose and never skip. But because she doesn't remember, she might take a double dose or skip, so she has a shortfall. But we don't say that she is outside the theory; we say that she is rational if she maximizes expected utility given her credences. So the theory does apply.

  Thus, the argument must break down somewhere. I think the problem is in step (10) and (11). The theory does not require perfect recall. It can handle imperfect recall by having the agent choose a strategy that is optimal given the information sets. The agent is still rational if she maximizes expected utility at each information set. The fact that she gets less than an agent with perfect recall is not a failure of rationality, but a consequence of her imperfect information.

  So the theory does not demand perfect recall. It only demands that the agent maximizes expected utility given the information she has. In the turnoff case, Marta does exactly that: at each turnoff, she chooses the action that maximizes expected utility given her credences. That yields 4, which is less than 8, but that's because she has less information. The theory doesn't say that she should get 8; it says that given her information, 4 is the best she can do.

  Similarly, the grandmother, by maximizing expected utility, does the best she can given her imperfect memory.

  Therefore, the argument fails at step (8): we do not require perfect recall. We require that the agent uses the information she has optimally. The theory is normative for agents with imperfect recall as well.

  But then why does the user feel that the turnoff case is a reductio? Because the gap of 4 feels large and due to a failure of rationality? But note that the gap is due to the structure of the problem and the lack of information, not a failure to be rational. The wide-awake twin has more information, so she can do better. That is not a failure of rationality on Marta's part.

  Moreover, step (2) is not necessary for the argument. Without (2), we still have that Marta must choose the same action at both turnoffs because she cannot tell them apart. So the set of available plans is limited to those that prescribe the same action at both turnoffs. Then, the plan "turn at both" yields 4, and "go straight at both" yields 2. So she chooses "turn", and that is rational.

  Now, what if she tries to adopt a plan that says "if I am at the first, go straight; if I am at the second, turn"? But she cannot execute that plan because at the time of decision she doesn't know which turnoff she is at. So she cannot condition her action on that. Therefore, such a plan is not available to her. So the set of available strategies is limited by the information structure.

  Therefore, the theory of rational choice under uncertainty (with information sets) already accounts for this. The agent is rational if she chooses the best strategy available given the information constraints.

  So the theory does not break down. It handles both the turnoff case and the pill case. In the pill case, the grandmother's information set is a single node with uncertainty about the state (which is not a decision node but a state of nature). She has two actions: take the pill or not. She assigns credences to having taken it or not, and then chooses the action that maximizes expected utility.

  The user's argument (7) says that the shortfall (compared to what she would get if she remembered) is due to the failure to discriminate. But that is true, but it doesn't mean she is irrational. Rationality is about making the best of the information you have, not about having perfect information.

  Therefore, the theory is normative for humans. It tells the grandmother what to do: calculate the expected utility of taking the pill and of not taking it, and choose the better one. Similarly, it tells Marta to turn at the turnoff because 4>2.

  Now, what about step (6): the gap is due to the inability to discriminate? Yes, but that doesn't make the agent irrational. It just means that having better memory would allow for a better outcome. Rationality is about using what you have, not about having perfect faculties.

  So the argument fails at step (8): we do not require perfect recall. We require that the agent uses her available information optimally. And that is what Marta and the grandmother do.

  Therefore, we can keep (1) and avoid the absurd conclusion.

  But note: the user says that in the seminar, someone objected to the credence 1/2. The user says that the argument goes through for any credence between 1/4 and 1. But let me see: if Marta has credence p that she is at the second turnoff (so 1-p at the first), then:

  - Turning: with probability 1-p she gets 0 (if at first) and with probability p she gets 8 (if at second) -> expected utility: 8p.

  - Going straight: she gets 2 (because she will do the same at the next turnoff, so she ends up going straight at both and getting 2).

  So turning is better if 8p > 2, i.e., p > 1/4. So for any p>1/4, she turns. And the ex ante value of the plan "turn at both" is 8p. But note: the ex ante value (before starting the drive) of the plan is actually 8p (if we interpret p as the probability that a randomly chosen turnoff is the second). However, the actual ex ante value (from the start) is: with probability 1/2 she is at the first turnoff, and then she turns and gets 0, and with probability 1/2 she is at the second and turns and gets 8, so 4. But if she had a different plan? She cannot have a plan that conditions on the turnoff because she can't tell. So the ex ante value of the only available plans are:

  - Always turn: 4
  - Always go straight: 2

  So 4 is the best.

  But note: the wide-awake twin gets 8. So the gap is 4. But again, that gap is due to the lack of information, not irrationality.

  In the grandmother's case, the gap is due to lack of information. But we don't say she is irrational; we say she is rational given her constraints.

  Therefore, the user's feeling that the turnoff case is a reductio might come from the fact that the problem is sequential and the absentmindedness leads to a situation where the agent's initial perspective and the perspective at the decision node are not aligned. But the standard resolution is that the agent should maximize at the information set, and that is what is done.

  So to answer the user's questions:

  - I reject step (8) and the subsequent steps (9)-(12). 
  - Step (8) is not entailed by the previous steps. The theory does not require perfect recall; it requires maximizing expected utility at each information set, even if the information set contains multiple nodes.

  - Why did (8) look innocent? Because the user thought that the shortfall (the gap) must be attributed to a failure of rationality, but in fact it is attributed to the lack of information. The agent is still rational.

  - What does rejecting it cost? Nothing. We keep (1) and we can still apply the theory to humans.

  Additionally, note that the user is willing to drop (2). But we don't need to drop (2) either. In fact, (2) is not the source of the problem. The problem is that the user overgeneralized from the gap to the requirement of perfect recall.

  In the grandmother's case, the situation is simpler because it is a one-shot decision. The turnoff case is a sequential decision with imperfect recall, but the theory handles it.

  Therefore, the argument is invalid because it misinterprets the requirements of rationality. Rationality does not require perfect recall; it requires optimal use of the information available.

  So the user can keep (1) and not have to say that his grandmother is a rock. His grandmother is a rational agent who, given her memory limitations, maximizes expected utility.

  Let me also note: the user's step (7) says that the shortfall traces to a failure to discriminate. This is true in the sense that if she had discriminated, she would have done better. But that is a causal explanation, not a normative one. The theory does not require that she discriminates; it requires that she acts optimally given that she does not discriminate. So the theory is still normative.

  In summary, the step I reject is (8) (and consequently (9)-(12)). The argument looked innocent because it conflated the cause of the shortfall (lack of information) with a failure of rationality. The cost of rejecting (8) is that we must accept that rational agents can have limitations (like imperfect recall) and still be rational.

  Thus, expected utility theory is a normative theory for humans, even with their imperfections.
answer: |-
  Your argument is a fascinating and rigorous exploration of decision theory, particularly the challenges posed by imperfect recall. I'll address it step by step, explain where I believe the flaw lies, and clarify why your grandmother's pill case feels different from Marta's turnoff case. Ultimately, I'll show how we can preserve (1)—rational action maximizes expected utility given current information—without conceding that humans are "outside the theory's jurisdiction" like rocks. I'll also explain why rejecting the problematic step is cost-effective and consistent with decision theory as a normative guide for humans.

  ### Summary of My Position
  - **I reject step (7) and its generalization.** This is where the argument goes astray. The claim that "whenever an agent ends up with less than she could have had, the shortfall traces to a failure to discriminate at the moment of choice" is too broad and misattributes the source of the shortfall. The shortfall in cases like Marta's stems from **structural constraints** (e.g., the inability to implement conditionally distinct plans due to indistinguishability), not a failure of rationality at the moment of choice. Rationality operates within these constraints, and a shortfall doesn't imply irrationality—it reflects the agent's informational limitations.
  - **Step (8) doesn't follow from (7)** because perfect recall isn't required by (1); (1) only demands optimal use of *available* information, not perfect information. Humans can be rational agents despite imperfect recall.
  - **Your grandmother's pill case isn't paradoxical** because it involves a single decision with probabilistic uncertainty about states, not sequential indistinguishability. It aligns perfectly with (1) and doesn't trigger the reductio.
  - **Dropping (2) isn't necessary or sufficient to resolve this**, but I'll explain why it doesn't help much here.
  - **Cost of rejection:** Rejecting (7) costs us the clean generalization that all shortfalls reduce to discrimination failures, but it preserves (1) and decision theory's applicability to humans. It forces us to treat "indistinguishability constraints" as part of the agent's environment, not a defect in rationality.

  Now, let's walk through the reasoning.

  ### Where the Argument Fails: Step (7) and the Misattribution of Shortfall
  The core issue is in step (7):
  > *(7) And that generalizes. Whenever an agent ends up with less than she could have had, the shortfall traces to a failure to discriminate, at the moment of choice, between situations that call for different actions — had she discriminated perfectly she'd have done the right thing in each, and there'd be no shortfall.*

  This overgeneralizes Marta's turnoff case. While it's true that *in this specific scenario*, the shortfall arises because Marta can't distinguish the turnoffs, this isn't universally true for all shortfalls. More importantly, **the shortfall isn't due to a *failure of rationality* but to a *constraint on feasible plans*.** Let's break this down:

  - **In Marta's case, the shortfall is inevitable given her constraints:** Marta cannot physically implement a plan like "straight at the first, turn at the second" because the turnoffs are indistinguishable. At the moment of choice, she lacks the information to condition her action on which turnoff she's at. Thus, her only feasible plans are those that prescribe the *same* action at both turnoffs: always turn or always go straight. "Always turn" (yielding 4) is indeed optimal *given this constraint*, and she chooses it rationally under (1). The shortfall (4 vs. the twin's 8) arises because the twin faces no such constraint—she can discriminate and execute conditionally distinct actions. But this doesn't mean Marta is irrational; it means her *opportunity set* is limited by her imperfect recall.
    
  - **Rationality doesn't require overcoming constraints—it requires optimizing within them:** (1) demands that agents maximize expected utility *given their current information*. It doesn't demand that they have information they lack (e.g., perfect discrimination). Marta does this perfectly: at each turnoff, with credence 1/2, turning has EV = 4, going straight has EV = 2, so she turns. The theory doesn't blame her for the shortfall; it says she did the best she could *with what she has*. Labeling this as "irrational" (as (10) does) misapplies the theory.

  - **Why the generalization in (7) fails:** Not all shortfalls stem from discrimination failures at choice moments. For example:
    - **Resource constraints:** An agent might lack the money to buy an optimal investment, leading to a shortfall. This isn't due to a discrimination failure.
    - **Computational limits:** An agent might use a heuristic for a complex problem, achieving a suboptimal result due to bounded rationality, not imperfect recall.
    - **Your grandmother's pill case:** Here, the shortfall (e.g., risk of double dose or missed dose) arises from uncertainty about the *state of the world* (whether she took the pill), not from an inability to discriminate between *decision points*. She faces a single decision with probabilistic beliefs, and (1) guides her to maximize EU based on her credences. This is rational and doesn't imply she's "defective" (more on this below).

  The flaw in (7) is equating "could have had" with a counterfactual where the agent has perfect discrimination. But decision theory doesn't require agents to be omniscient; it evaluates them relative to their actual circumstances. Marta's shortfall isn't a *rationality failure*—it's a *value lost to the constraints of her environment*. The theory accommodates this by defining rationality conditionally on information.

  ### Why Step (8) Doesn't Follow: Perfect Recall Isn't Required by (1)
  Step (8) claims:
  > *(8) So a fully rational agent, one with no shortfall, is one who always knows at each moment of choice which moment of choice she's at. Perfect recall isn't a technical convenience the theory could do without; it's what (1) turns out to demand once you spell it out.*

  This is unsupported:
  - **(1) only requires local optimization, not global omniscience:** (1) says that at each moment, given the agent's *current* information, she chooses the action with the highest EU. It doesn't require her to "know which moment she's at" in an absolute sense—only to use her available beliefs. Marta satisfies (1): at a turnoff, she has credences (1/2, 1/2) and maximizes EU. Your grandmother satisfies (1) by weighing the risks of double dosing vs. skipping. Neither needs perfect recall to be rational under (1).
  - **Perfect recall is a modeling tool, not a normative requirement:** Decision theory often assumes perfect recall to simplify dynamic problems, but it's not inherent to (1). When recall is imperfect (like in Marta's case), the theory handles it with information sets: nodes the agent can't distinguish are grouped together, and the agent must choose the same action for all nodes in the set. This is still governed by (1)—Marta evaluates EU over the entire information set. The theory *can* do without perfect recall; it just gets messier.
  - **No shortfall? Unrealistic for bounded agents:** A "fully rational agent with no shortfall" (as in (8)) is an idealization (like an omniscient optimizer), not a realistic standard. Humans can be rational *despite* shortfalls caused by their constraints. Rationality isn't about achieving the global maximum—it's about achieving the maximum *given your information and capabilities*.

  ### Why Your Grandmother's Pill Case Feels Different—and Why It Should
  You're right that the pill case "feels like plain good sense" while Marta's turnoff feels like a reductio. This is because they involve fundamentally different decision problems:
  - **Pill case: Single decision under uncertainty (state discrimination)**  
    Your grandmother has one decision point ("take pill or not?") and uncertainty about the *state* ("did I already take it?"). She has credences (e.g., 50% she took it, 50% she didn't) and computes:  
    - EU(take pill) = [prob(didn't take) × utility(taking when needed)] + [prob(did take) × utility(double dose)]  
    - EU(not take) = [prob(didn't take) × utility(skip)] + [prob(did take) × utility(no action needed)]  
    She picks the action with higher EU. This is a straightforward application of (1) to a single choice with probabilistic beliefs. The shortfall (e.g., risk of side effects from double dosing) arises from *state uncertainty*, not an *inability to distinguish decision points*. It feels intuitive because (1) handles state uncertainty perfectly. She's firmly within the theory's jurisdiction.
    
  - **Marta's turnoff: Sequential decisions with action indistinguishability (decision-point discrimination)**  
    Marta faces two decision points she can't distinguish, forcing her to choose the same action at both. This creates a feedback loop: her action at one node affects the state at the other, but she can't condition on it. This is a classic "absentminded driver" problem (Piccione & Rubinstein, 1997), where the interplay of actions and indistinguishability leads to a perceived paradox. The shortfall *feels* like a reductio against (1) because it highlights a limitation of *local* EU maximization in dynamic problems with imperfect recall. But as argued above, this isn't a failure of (1)—it's a constraint on feasible strategies.

  The key difference: In the pill case, the lack of discrimination is about *states*; in Marta's case, it's about *decision points*. (1) handles state discrimination seamlessly but requires extra machinery (information sets) for decision-point indistinguishability. The "reductio" feeling arises because Marta's problem exposes a quirk of sequential EU maximization under imperfect recall, not a flaw in (1) itself.

  ### Why Dropping (2) Doesn't Solve the Problem (But Isn't Needed)
  You mention being unattached to (2):
  > *(2) A plan is rationally adoptable by an agent only if she'll still find it rational to carry out at every point where she has to carry it out; a plan she'll rationally drop when she gets to it isn't a plan she'll execute.*

  Dropping (2) doesn't rescue the argument because:
  - Marta still couldn't execute a plan like "straight at first, turn at second." At each turnoff, she lacks the information to know which action the plan prescribes. Even with sincere commitment, she can't overcome the indistinguishability. Thus, the only *implementable* plans are uniform (always turn or always straight).
  - (2) is about dynamic consistency, not indistinguishability. In problems with perfect recall, (2) ensures plans are time-consistent. But in Marta's case, the issue isn't inconsistency—it's physical infeasibility. Even without (2), she can't implement conditional plans.

  However, I agree that (2) is often a stipulation. We can drop it without harm, but it doesn't block the reductio. The real solution is rejecting (7).

  ### What Rejecting (7) Costs You
  Rejecting (7) comes with a minor cost but preserves the core of decision theory:
  - **Cost:** You lose the sweeping generalization that "all shortfalls reduce to discrimination failures." This might feel unsatisfying, as it weakens a elegant but overbroad claim. However, this cost is low because (7) was never essential to decision theory—it was an inference from a specific case.
  - **Benefits:**  
    - You keep (1) intact as the core of rationality.  
    - Humans remain within the theory's jurisdiction: your grandmother is rational when she weighs pill risks, and Marta is rational when she turns. Both are using (1) optimally given their constraints.  
    - Decision theory stays normative for humans. It acknowledges constraints (e.g., imperfect recall, limited resources) and guides agents to do their best within them.  
    - No need to abandon standard tools (e.g., information sets for imperfect recall problems).

  ### Final Resolution: How to Keep (1) and Avoid the Reductio
  - **Reject step (7):** The shortfall in Marta's case isn't due to a *rationality failure* but to a *constraint on feasible plans* imposed by indistinguishability. Rationality (per (1)) operates within constraints.  
  - **Affirm (1):** Rational action always maximizes EU given current information. This works for your grandmother's pill (state uncertainty) and Marta's turnoff (decision-point indistinguishability).  
  - **Clarify the theory's jurisdiction:** Humans are rational agents if they follow (1). Imperfect recall doesn't expel them; it just means their best achievable outcome may be lower than an idealized agent's. This is no different from other constraints (e.g., budget limits in economics).  
  - **Address the credence 1/2 issue:** As you note, the argument doesn't hinge on 1/2. For any credence \( p \) (probability at second turnoff), turning is optimal if \( 8p > 2 \) (i.e., \( p > 0.25 \)), and the gap (vs. the twin) is positive if \( p < 1 \). But since the gap reflects constraints, not irrationality, it doesn't threaten (1).

  Your argument is sharp and highlights a real challenge in decision theory: how to handle sequential decisions with imperfect recall. But by rejecting (7), we avoid the reductio while preserving (1) as a robust normative theory for humans. Your grandmother isn't a rock—she's a rational agent making the best of her imperfect memory, just like Marta.
