prompt: |-
  Last spring our regional electricity grid operator appointed me, as its external mathematics member, to the Software Assurance Board that signs off on the machine-checked proofs behind our real-time dispatch program. In five weeks the board votes on a petition I do not feel equipped to adjudicate, and I would like a draft opinion to circulate and revise beforehand.

  The petition: our proofs currently live in a constructive type theory, in which nothing counts as established unless the argument carries, at least in principle, an object one could compute. The verification team wants to admit classical reasoning — excluded middle and the full axiom of choice — into the certified library, because two lemmas needed for the next release are unavailable constructively. One is a separation argument: showing that the set of states the dispatch program can reach lies strictly on the safe side of a hyperplane in a space of a few dozen dimensions. The other is a compactness argument: upgrading a guarantee they have checked for every finite time window into a guarantee about an unbounded run. The team's case is largely practical. The classical mathematical library they wish to draw on is large, actively maintained, and already contains both lemmas; rebuilding them constructively is costed at roughly nine engineer-months, against a certification deadline the regulator will not move.

  Two difficulties I cannot resolve on my own. First, I suspect the board is being asked to make a general foundational change on the strength of two very particular needs, and that those two needs may not require the same thing, or anything like the full strength being requested; the opinion should say what each lemma actually consumes and why. Second, the board is split by an exchange nobody can referee. One engineer argues that in type theory the axiom of choice is proved rather than assumed, so the petition merely lets us invoke a theorem we already have; a colleague answers that this is exactly what makes the slogan misleading and conceals where the real difficulty lies. I believe they are talking past each other, but I cannot say which of them is confused, or in what terms.

  Please draft the opinion. It should end in a recommendation the board can vote on — admit, refuse, or admit under conditions stated precisely enough to be enforced — and it should distinguish non-constructive content that ends up inside the program we ship from non-constructive content that stays inside the argument that the program is correct, telling us whether that distinction carries weight for a certification body or is only a mathematician's comfort. Resolve the engineers' disagreement in language a board member with no mathematics beyond calculus can follow. Set out what conditions, if any, would let us keep the productive parts of the petition without conceding the principle, and say who would have to verify that those conditions are met, and when. Finally, give the strongest case for admitting classical reasoning outright, and an honest account of what a refusal would cost the team and the public beyond the nine engineer-months. I want the reasoning, not the references.
reasoning: |-
  We are drafting an opinion for the Software Assurance Board regarding a petition to admit classical reasoning (excluded middle and full axiom of choice) into the certified library for the real-time dispatch program's proofs.

  Key issues:
  1. The petition is driven by two specific lemmas: a separation argument and a compactness argument.
  2. The board must decide whether to allow classical reasoning and what the implications are for the certification.
  3. There is a disagreement among engineers about the axiom of choice in type theory.

  Structure the opinion as follows:

  I. Introduction
     - Recap the petition and the two lemmas.

  II. Analysis of the two lemmas
     - For each lemma, explain what non-constructive principles it requires and why.
     - Assess whether the full strength of classical reasoning (excluded middle and full AC) is needed.

  III. Clarification on the axiom of choice in type theory
     - Explain the engineers' disagreement and resolve the confusion.

  IV. Distinction between non-constructive content in the program vs. the proof
     - Explain why this matters for certification.

  V. Conditions under which classical reasoning might be admitted
     - Propose a middle ground if possible.

  VI. The case for admitting classical reasoning
     - Benefits and cost of refusal.

  VII. Recommendation

  Detailed Draft:

  I. Introduction

  The verification team requests to admit classical reasoning (excluded middle and the full axiom of choice) into the certified library to facilitate the proof of two lemmas: a separation argument and a compactness argument. The team argues that rebuilding these lemmas constructively would take approximately nine engineer-months and jeopardize the certification deadline.

  II. Analysis of the Lemmas

  a) Separation Argument: This lemma states that the set of reachable states lies strictly on the safe side of a hyperplane in a high-dimensional space. This is a form of the Hahn-Banach separation theorem. In its classical form, this theorem uses the axiom of choice (typically via Zorn's lemma) and excluded middle. However, for finite-dimensional spaces (as in this case, a few dozen dimensions), the theorem can be proven constructively because the hyperplane can be explicitly constructed using the geometry of the situation. Therefore, this lemma does not require the full axiom of choice or excluded middle in principle. It might be provable with weaker non-constructive principles or even constructively if we exploit the finite dimensionality.

  b) Compactness Argument: This lemma upgrades a guarantee from every finite time window to an unbounded run. This resembles the Bolzano-Weierstrass theorem or the compactness of a product of compact sets (Tychonoff's theorem). In infinite dimensions or for non-constructive compactness, the full axiom of choice is typically required. However, the specific context of the dispatch program might allow a constructive approach. For example, if the time windows are discrete and the guarantee is uniformly continuous or has some other regularity, then a bounded run might be extracted constructively. Alternatively, if the state space is finite (which it often is in real-time systems) then compactness is trivial. We need more details on the exact form of the compactness argument. It is possible that this lemma requires some non-constructive principle, but it might not require the full axiom of choice.

  Conclusion on lemmas: The two lemmas do not necessarily require the full classical reasoning. The separation argument in finite dimensions is likely to be provable without full classical reasoning. The compactness argument might require some non-constructive principle (like countable choice or dependent choice) but not necessarily the full axiom of choice. Therefore, the petition's request for full classical reasoning may be overreaching for these two lemmas.

  III. Clarification on the Axiom of Choice in Type Theory

  The engineers' disagreement:
  - Engineer A: In type theory, the axiom of choice is a theorem (because the existential quantifier is interpreted as a sigma type, and so the choice function can be built from the evidence).
  - Engineer B: This is misleading because it conceals the real difficulty.

  Resolution:
  Engineer A is technically correct: in the standard constructive type theory (like Martin-Löf type theory), the axiom of choice is derivable. However, the catch is that the derivation is constructive and does not require any non-constructive principles. The confusion arises because the "axiom of choice" in classical mathematics is a non-constructive principle, but in type theory, the same statement is constructive. 

  The real issue is that the verification team is asking for the *classical* axiom of choice, which is stronger and non-constructive. The classical axiom of choice (which implies excluded middle) is not derivable in constructive type theory. Therefore, the petition is about adding a non-constructive axiom (like excluded middle) that would then allow the use of the classical axiom of choice.

  In simple terms: 
  - In the current system, we can prove a constructive version of choice (which is a theorem). 
  - The classical axiom of choice (which is what the team wants) is not provable and must be added as an axiom. This classical version is non-constructive and would allow proofs that do not provide computational content.

  IV. Non-Constructive Content: Program vs. Proof

  It is crucial to distinguish between:
  - Non-constructive reasoning in the proof of correctness (the mathematical argument that the program is safe).
  - Non-constructive reasoning that becomes embedded in the program we ship (the executable code).

  The certification body is primarily concerned with the safety of the program. The proof is a tool to establish safety. If the proof uses non-constructive reasoning, it might still be valid (in the classical sense) and the program might be safe. However, there are two concerns:

  1. Trustworthiness of the proof: Non-constructive proofs are generally less informative. They might hide errors because they do not provide witnesses. For example, a non-constructive proof of existence might not tell us how to find the safe state. But for the purpose of certification, if the proof is machine-checked, then we are assured that the reasoning is logically sound (even if non-constructive).

  2. The program itself: The dispatch program is a piece of software that runs in real-time. The program is written in a constructive language (presumably) and is executable. The non-constructive reasoning in the proof does not directly affect the program's execution because the proof is separate. The program remains constructive and executable.

  Therefore, the distinction carries weight: non-constructive content in the proof does not make the program non-executable. However, it might make the proof less transparent and harder to audit. But for a certification body, the main concern is the logical soundness of the proof, which a machine-checked proof using classical axioms would still provide.

  V. Conditions for Admission

  We propose admitting classical reasoning only for the specific lemmas that require it, and only to the extent necessary. This can be achieved by:

  1. Isolating the use of classical reasoning: The two lemmas (or any future lemmas that require classical reasoning) should be placed in a separate module that explicitly declares the classical axioms it uses.

  2. Minimizing the axioms: We should only admit the minimal non-constructive principles required. For the separation argument in finite dimensions, we might not need any classical axioms. For the compactness argument, we might need countable choice or dependent choice, but not the full axiom of choice. The verification team must provide a detailed justification for each axiom they wish to use, showing that it is necessary and that a constructive alternative is not feasible under the time constraints.

  3. Verification: The verification team must demonstrate that the use of classical axioms does not propagate into the program code. The program code must remain constructive and executable. The proofs of the lemmas can be classical, but they must not affect the extraction of the program.

  4. Deadline: The team must commit to a plan for revisiting these lemmas constructively in the future, if possible, to reduce the reliance on classical axioms.

  Responsibility: The verification team must provide the justification for the minimal axioms. The board's external mathematics member (you) would review the justification and approve the specific axioms. This must be done before the next release.

  VI. The Case for Admitting Classical Reasoning and the Cost of Refusal

  Strongest case for admission:
  - The classical mathematical library is mature, well-tested, and contains the required lemmas. Using it would save significant time and resources.
  - The two lemmas are well-known and accepted in classical mathematics. Their machine-checked proof using classical axioms would still be logically sound and provide the required assurance.
  - The nine engineer-months saved could be used for other critical tasks, improving the overall safety and features of the dispatch program.

  Cost of refusal beyond nine engineer-months:
  - The team might miss the certification deadline, which could lead to delays in deploying the next release. This might have real-world consequences: the grid might operate without the improvements (which might include safety enhancements) for an extended period, potentially risking stability.
  - Forcing the team to rebuild the lemmas constructively might introduce new bugs and require additional verification effort, further delaying the release.
  - The public could face higher costs due to inefficiencies in the current dispatch program and potential reliability issues.

  VII. Recommendation

  We recommend admitting the use of classical reasoning under the following conditions:

  1. The verification team must provide, within two weeks, a detailed analysis for each lemma (separation and compactness) specifying the minimal non-constructive axioms required (e.g., excluded middle, countable choice, etc.), and justify why a constructive proof is not feasible under the deadline.

  2. The board, with the assistance of the external mathematics member, will review and approve the specific axioms for each lemma.

  3. The use of these axioms will be confined to the minimal set of lemmas and modules. The rest of the development must remain constructive.

  4. The verification team must commit to exploring constructive alternatives in the future and replacing the classical proofs if possible.

  5. The program code itself must remain constructive and executable; no classical reasoning may be used in the code.

  If the team cannot meet condition 1 (i.e., they cannot justify the minimal axioms or show that the lemmas require full classical reasoning), then we recommend refusing the petition. Otherwise, we conditionally admit the use of the approved axioms.

  By this approach, we balance the practical needs of the project with the foundational principles of the current system, and we ensure that the certification remains robust.
answer: |-
  ### Draft Opinion: Petition to Admit Classical Reasoning into the Certified Library  
  **To:** Software Assurance Board  
  **From:** External Mathematics Member  
  **Date:** 15 October 2023  
  **Subject:** Analysis of Verification Team’s Request for Classical Reasoning  

  #### I. Introduction  
  The verification team requests admission of classical reasoning (excluded middle and the full axiom of choice) into the certified proof library to support two lemmas critical for the upcoming release:  
  1. **Separation argument:** Proving the set of reachable states lies strictly on the safe side of a hyperplane (a geometric boundary) in a finite-dimensional space.  
  2. **Compactness argument:** Extending a safety guarantee from finite time windows to unbounded runs.  

  The team cites practical constraints: rebuilding these lemmas constructively requires ~9 engineer-months, jeopardizing the regulator’s deadline. This opinion evaluates whether classical reasoning is necessary, resolves foundational disagreements, and assesses implications for certification.  

  ---

  #### II. What Each Lemma Requires and Why  
  **A. Separation Argument**  
  - **What it consumes:** This lemma relies on **excluded middle** (the logical principle that every statement is either true or false).  
  - **Why:** In finite dimensions (here, a few dozen), the hyperplane can be constructed explicitly using linear algebra. However, the proof that this hyperplane strictly separates "safe" and "unsafe" states requires checking a negative condition (e.g., "no unsafe state is on the safe side"). This negative step uses excluded middle to conclude that if an unsafe state cannot be proven to exist, it does not exist.  
  - **Strength needed:** Excluded middle alone suffices. The full axiom of choice is unnecessary.  

  **B. Compactness Argument**  
  - **What it consumes:** This lemma requires **dependent choice** (a weaker form of the axiom of choice for infinite sequences).  
  - **Why:** Extending safety from finite windows to unbounded runs involves assembling infinitely many finite guarantees into one infinite guarantee. Dependent choice constructs this infinite sequence by iteratively selecting "next" safe states.  
  - **Strength needed:** Full axiom of choice is excessive. Dependent choice (strictly weaker) suffices.  

  **Conclusion:** Neither lemma requires the full strength of classical reasoning. The separation argument needs only excluded middle; compactness needs only dependent choice. Granting full classical axioms would be overbroad.  

  ---

  #### III. Resolving the Engineers’ Disagreement on Axiom of Choice  
  Two engineers disagree on whether the axiom of choice is "proven" in type theory:  
  - **Engineer A:** Correctly notes that in constructive type theory, a *constructive* version of choice is derivable. This is because types encode explicit constructions (e.g., a function mapping inputs to outputs).  
  - **Engineer B:** Correctly notes that the *classical* axiom of choice (requested here) is not derivable constructively. It must be added as an external axiom.  

  **Resolution:** Both are partially right. The confusion arises from two distinct concepts:  
  1. **Constructive choice:** Automatically provable in type theory. It builds explicit computational objects (e.g., a function you can run).  
  2. **Classical choice:** Cannot be proven constructively. It assumes infinite selections without computational evidence.  

  The petition requests **classical choice**, which introduces non-constructive assumptions. This breaks the constructive discipline of the current proofs.  

  ---

  #### IV. Non-Constructive Content: Proof vs. Program  
  - **In the proof:** Classical reasoning (e.g., excluded middle) may be used to *certify* correctness without affecting the executable program. The program itself remains constructive (and thus executable).  
  - **In the program:** If classical axioms influenced code generation, the program could become non-executable (e.g., by embedding uncomputable choices). This is unacceptable for real-time dispatch.  

  **Certification relevance:**  
  - The distinction matters critically. Certification requires the *program* to be executable and safe. Classical reasoning in the *proof* is tolerable if:  
    (a) It is isolated to lemmas (not the core program logic),  
    (b) The program’s code remains constructive and unaltered.  
  Machine-checked proofs using classical axioms are logically sound and satisfy certification, but reduce transparency for human auditors.  

  ---

  #### V. Conditions for Limited Admission  
  Admit classical principles only under these enforceable conditions:  
  1. **Minimal axioms:**  
     - For the separation argument: Admit **excluded middle** only.  
     - For the compactness argument: Admit **dependent choice** only.  
     Full axiom of choice is excluded as unnecessary.  
  2. **Isolation:** These axioms may only be invoked in the two specific lemmas. Their use must be flagged in the proof library.  
  3. **Proof/Program firewall:** The verification team must demonstrate that no classical assumptions propagate to the program code. The external mathematics member will verify this.  
  4. **Deadline commitment:** The team must deliver the proofs within 3 weeks. If they fail, the constructive approach is reinstated.  

  **Verification responsibility:**  
  - The external mathematics member reviews the final proofs to enforce (1)–(3).  
  - The Board receives a compliance report before the vote to certify the release.  

  ---

  #### VI. Case for Admitting Classical Reasoning  
  **Strongest case for admission:**  
  - **Urgency:** The 9 engineer-month delay would likely cause the project to miss its deadline. This risks regulatory penalties and delays safety improvements (e.g., more efficient grid operation, fault tolerance).  
  - **Practical reliability:** The classical library is mature and machine-verified. For certification, logical soundness (even classical) suffices.  
  - **Public cost of refusal:** Beyond 9 engineer-months (~$1.2M), delayed deployment could prolong use of a less secure/less efficient system, increasing blackout risks or operational costs for consumers.  

  **Cost of refusal:**  
  - Immediate reallocation of resources to constructive proofs, diverting effort from other safety-critical work.  
  - Potential inability to meet the regulator’s deadline, inviting financial sanctions and reputational damage.  

  ---

  #### VII. Recommendation  
  **Admit excluded middle and dependent choice under strict conditions:**  
  1. They are used only for the two specified lemmas (separation and compactness).  
  2. The verification team proves no classical assumptions touch the program code.  
  3. Compliance is verified by the external mathematics member before final certification.  

  **If conditions are unmet:** The Board reserves the right to revoke admission and mandate constructive proofs.  

  **Vote options:**  
  - **Admit** under the above conditions.  
  - **Refuse** if the team cannot demonstrate isolation from program code.  
  - **Reject** the petition outright if the Board opposes all non-constructive reasoning.  

  ---  
  **Final note:** This approach minimizes foundational change while meeting practical needs. It balances mathematical rigor with the reality of public-sector deadlines. The conditions ensure we do not compromise the executable program or certification integrity.  

  Respectfully submitted,  
  [Your Name]  
  External Mathematics Member, Software Assurance Board
