prompt: |-
  So I'm a second-year PhD in computer science doing mostly multi-agent learning stuff, and I've been roped into TAing a philosophy of AI workshop for undergrads next month wich I'm acutally kind of excited about. We just covered the one-shot prisoner's dilemma in class, like 3 candies each if both cooperate, 1 each if both defect, and 5 for the defector and 0 for the sucker if they split, so defecting is dominant if you choose blind, and I tried to explain the program equilibrium idea to a couple friends over dinner, you know the trick where instead of choosing actions directly you each submit a program and the programs get to read each other's source code before deciding, so something like cooperate if and only if the other code does the same thing can become stable and you get mutual cooperation without any repeated play or enforcement. They kind of got it intellectually but it still felt like a math trick to them, not something that changes how you'd actually reason.

  I get an 80-minute slot with about 22 undergrads with no coding background, just a room with whiteboards and index cards and I can bring candy for points, and I want them to live through that shift from defect-defect to cooperate-cooperate because of transparency rather than me just telling them. Could you put together a complete hands-on session plan where they first play a blind version for candy points and then a second version where they have to write down super simple conditional rules on cards and exchange and commit to following them, so the cooperation emerges from what they do before I ever say the fancy name? I need the minute-by-minute flow, exactly how to score it without money, how to run the debrief so each weird moment maps onto the underlying logic of reading code and best-responding to programs instead of actions, plus your best guess at what will get messy on the first run with this crowd and how to rescue it, and a candid bit at the end about what this low-tech card version has to fake about real program equilibrium that I'll need to just explain outright.
reasoning: |-
  We are designing a workshop for undergrads with no coding background to experience the shift from defect-defect to cooperate-cooperate in a one-shot Prisoner's Dilemma (PD) by introducing the concept of program equilibrium through a low-tech card-based activity.

  The core idea: 
  1. First, have them play a blind one-shot PD (so they choose without knowing the other's choice) and they will likely defect, leading to the suboptimal outcome (1 candy each).
  2. Then, in the second round, they write simple conditional rules on index cards (like "I will cooperate if and only if you write the same rule as me" or any other condition they can think of) and exchange these cards. After seeing the other's rule, they must commit to following their own rule. This transparency and conditional commitment can lead to cooperation.

  Structure of the 80-minute session:

  - Introduction and setup (10 minutes)
  - Round 1: Blind one-shot PD (15 minutes)
  - Debrief Round 1 (10 minutes)
  - Round 2: Rule-based PD (25 minutes)
  - Debrief Round 2 and link to program equilibrium (15 minutes)
  - Wrap-up and connection to real AI (5 minutes)

  Detailed Minute-by-Minute Plan:

  **0-10 min: Introduction and Setup (10 min)**
  - Welcome and explain the Prisoner's Dilemma scenario in simple terms (using candy as payoffs). Write the payoff matrix on the board:
    - Both cooperate: 3 candies each
    - Both defect: 1 candy each
    - One cooperates, one defects: defector gets 5, cooperator (sucker) gets 0
  - Emphasize that it's a one-shot game (no repetition) and no communication during the blind round.
  - Assign pairs: Since there are 22 students, we can have 11 pairs. Write pair numbers on index cards and hand them out randomly. They find their partner and sit together.

  **10-25 min: Round 1 - Blind One-Shot PD (15 min)**
  - Each pair gets two index cards (one for each player) and a pen. 
  - Instructions: Without showing your partner, write either "C" (cooperate) or "D" (defect) on your card and fold it. Then, both hand their folded card to you (the instructor). 
  - You collect all cards, then for each pair, open the two cards and announce the outcome (but not who wrote what if one is C and one D, just the result) and hand out the candy accordingly. 
  - Record the outcomes on the board (e.g., tally for CC, DD, CD/DC). 
  - Expected result: Most pairs will end up with DD (both defect) and get 1 candy each, maybe a few CD/DC and very few CC.

  **25-35 min: Debrief Round 1 (10 min)**
  - Ask: "How many of you defected? Why?" 
  - Discuss: Why is defecting dominant? (Because no matter what the other does, you get more by defecting: 5>3 if they cooperate, 1>0 if they defect.) 
  - Point out the collective tragedy: They end up with 1 each when they could have had 3. 
  - Pose the challenge: "Is there a way, without changing the game, to get to mutual cooperation in a one-shot setting? What if you could see the other's decision? But that's not allowed because it's simultaneous. So what else?"

  **35-60 min: Round 2 - Rule-Based PD (25 min)**
  - Introduce the twist: "Now, you are going to write down a rule instead of an action. The rule must be a condition that tells you what to do (C or D) based on the rule of the other player. But note: you will exchange rules and then must follow your own rule after seeing the other's rule."
  - Give examples of rules (write on the board):
    - "I will always cooperate, no matter what." (call this Rule A)
    - "I will always defect, no matter what." (Rule B)
    - "I will cooperate if and only if your rule is exactly the same as mine." (Rule C)
    - "I will cooperate only if your rule says you will cooperate no matter what, otherwise I defect." (Rule D)
    - Encourage them to be creative but keep it simple and clear.
  - Each student writes their rule on an index card. They can write it as a sentence. (Allow 5 min for writing rules.)
  - Then, in their pairs, they exchange their rule cards and read the other's rule. (They are allowed to read and think for 2-3 min.)
  - Now, they must decide their action (C or D) by following their own rule, given the rule they just read from the other. They write their action (C or D) on a new index card and fold it. (They can write the action on a separate card to keep the rule and action distinct.)
  - Collect the action cards. Then, for each pair, reveal the actions and distribute candy. Also, note the rules they used and the outcome.

  **60-75 min: Debrief Round 2 and Link to Program Equilibrium (15 min)**
  - Start by asking: "How many pairs ended up with CC? How many with DD? How many mixed?"
  - Then, ask for volunteers to share: 
    - What rule did you write?
    - What rule did your partner write?
    - What action did you take and why?
  - Focus on pairs that achieved CC. Likely, they used a rule like Rule C (or similar). 
  - Highlight: "Notice that by writing a rule that says 'I will cooperate if and only if you have the same rule as me', and if both write that, then they both cooperate. But if one writes that and the other writes 'always defect', then the first one will defect (because the rules are not the same) and the second defects, so DD. But if both write 'always defect', they end up with DD. So why would both write a rule like Rule C? Because they know that if they both write it, they get CC. And if they write Rule C and the other writes Rule A (always cooperate), then Rule C would lead to defect (because the rules are not the same) and Rule A would cooperate, so DC (and the Rule C user gets 5). But wait, that's bad for the Rule A user. So how do we avoid that? 
  - Introduce the concept: "This is like submitting a program that can read the other's program. The program then outputs an action. We are looking for a pair of programs (rules) that are in equilibrium: each is the best response to the other. In the case of Rule C, if both use Rule C, then they both cooperate and get 3. If one uses Rule C and the other uses a different rule, Rule C leads to defect and they get 1 or 5 (depending on the other). But if both use Rule C, neither can do better by changing their rule unilaterally. Why? If I change to Rule B (always defect) and you still use Rule C, then you will defect (because our rules are different) and I defect, so we get DD (1 each). I get 1 which is worse than 3. Similarly, if I change to Rule A (always cooperate) and you use Rule C, then you defect and I cooperate, so I get 0. So Rule C is a best response to itself. This is a program equilibrium."
  - Note: Rule A (always cooperate) is not stable because if the other uses Rule B (always defect), then the Rule A user gets 0. And Rule B (always defect) is stable in a way, but it leads to DD which is worse than CC.

  **75-80 min: Wrap-up and Connection to Real AI (5 min)**
  - Recap: In the blind game, we got stuck in DD. By writing conditional rules and exchanging them (which is like letting the programs read each other's source code), we found a way to commit to cooperation in a one-shot game.
  - What the card version faked: 
    - In real program equilibrium, the programs can be arbitrarily complex and can read the entire source code. Here, we only wrote simple rules and we assumed they are followed. Also, in reality, we might have to worry about halting problems and such, but we ignored that.
    - Also, in our activity, we did not have a way to verify that the rule was followed (we trusted them to follow). In real code, it's automatic.
  - Why it matters for AI: In multi-agent systems, if agents can see each other's code (or a commitment to a strategy) before acting, they can achieve cooperative outcomes without repeated interaction. This is relevant for AI safety and cooperation in one-shot settings.

  Potential Messy Points and Rescues:

  1. **Problem:** Students might not understand how to write a conditional rule.  
     **Rescue:** Provide clear examples and walk through one or two. Have a few pre-written examples on the board.

  2. **Problem:** In Round 2, a student might not follow their own rule.  
     **Rescue:** Stress that they must follow their rule. If you suspect cheating, you can ask them to explain how they applied their rule after the fact. But with candy incentives, they will likely follow.

  3. **Problem:** Students might write rules that are too vague or not conditional.  
     **Rescue:** Check the rules as they write and ask for clarification. Encourage them to write in the form: "I will [action] if [condition]." 

  4. **Problem:** The class might not get a CC outcome in Round 2 because they are being too cynical.  
     **Rescue:** That's okay! Use the DD outcomes to discuss why they happened. For example, if both wrote "always defect", then they get DD. Ask: "Could you have written a rule that would have led to CC? What would it be? And why didn't you?" Then explain that if everyone is writing "always defect", then switching to a conditional rule that cooperates only with the same rule might be risky because you don't expect others to write it. But if both write the conditional rule, it works. This leads to the idea of equilibrium.

  5. **Problem:** Time might run short.  
     **Rescue:** Be strict with timings. For Round 2, if writing rules takes too long, give an extra minute but then move on. In the debrief, if there's no CC, you can simulate a pair that did use Rule C and show it would have worked.

  Materials:
  - Index cards (at least 3 per student: one for Round 1 action, one for Round 2 rule, one for Round 2 action; plus one for pairing if needed)
  - Pens
  - Candy (enough for 22 students, with at least 5 candies per student in the worst case? But note we are doing two rounds, so plan accordingly)
  - Whiteboard for payoff matrix and recording results.

  Candy Budgeting:
  - For Round 1: Each pair might yield 2 actions. You need to give:
    - CC: 3 each
    - CD: 5 to defector, 0 to cooperator
    - DC: same as CD
    - DD: 1 each
  - For Round 2: same as above.

  Total candies: 
  - Worst-case if all DD in both rounds: 22 students * (1+1) = 44 candies (1 per round per student for DD).
  - But also prepare for some getting 3 or 5.

  Bring at least 100 candies to be safe.

  This plan should give the students an experiential understanding of how transparency in the form of conditional commitments (like program equilibrium) can enable cooperation in one-shot dilemmas.
answer: |-
  ### Workshop Plan: From Blind Defection to Transparent Cooperation  
  **Total Time:** 80 minutes  
  **Participants:** 22 philosophy undergrads (no coding background)  
  **Materials:** Whiteboard, index cards (100+), pens, candy (150+ pieces, e.g., small chocolates), timer.  
  **Goal:** Experience how strategy transparency (à la program equilibrium) enables cooperation in one-shot dilemmas.  

  ---

  #### **Phase 1: Intro & Blind PD Round** (20 mins)  
  **0–5 mins: Set the Stage**  
  - Write the Prisoner’s Dilemma (PD) payoffs on the board:  
    - Both Cooperate (CC): **3 candies each**  
    - Both Defect (DD): **1 candy each**  
    - You Defect/Other Cooperates (DC): **5 candies for you, 0 for them**  
    - You Cooperate/Other Defects (CD): **0 for you, 5 for them**  
  - Emphasize: *"One-shot game—no repeats, no talking during decisions."*  

  **5–15 mins: Play Blind PD**  
  - Pair students randomly (11 pairs). Give each pair 2 index cards.  
  - **Instructions:**  
    > *"Write ‘C’ or ‘D’ on your card—your choice. Fold it so your partner can’t see. Hand it to me when done."*  
  - Collect cards, reveal outcomes pair by pair, and distribute candy. Record tallies (CC/CD/DC/DD) on the board.  

  **15–20 mins: Debrief Blind Round**  
  - **Q1:** *"Why did most defect?"* → Highlight *dominant strategy*:  
    > "Defect gives 5 (if they cooperate) or 1 (if they defect)—better than 0 or 3. But collectively, DD is worse than CC!"  
  - **Q2:** *"Can we get CC without repeating the game?"* → Tease the twist.  

  ---

  #### **Phase 2: Rule-Based PD Round** (30 mins)  
  **20–25 mins: Introduce Rule Writing**  
  - **Pitch:** *"Now, you’ll write a ‘strategy rule’ for what to do. You’ll swap rules with your partner, then decide your action after reading theirs."*  
  - **Examples on the board (keep it simple!):**  
    - *"Always Cooperate"*  
    - *"Always Defect"*  
    - *"Cooperate only if their rule is the same as mine"*  
    - *"Defect unless their rule says ‘Always Cooperate’"*  
  - **Rules:**  
    - Rules must fit 1 sentence.  
    - You MUST follow your rule after reading theirs.  

  **25–35 mins: Write & Exchange Rules**  
  - Give each student 2 cards:  
    - **Card 1:** Write your rule (e.g., *"Cooperate if they write the same rule as me"*).  
    - **Card 2:** Blank (for action later).  
  - Students swap **Card 1** with their partner.  

  **35–45 mins: Decide Actions & Resolve**  
  - **Instructions:**  
    > *"Read your partner’s rule. On Card 2, write ‘C’ or ‘D’ based on YOUR rule. Fold and hand to me."*  
  - Collect action cards (Card 2), reveal outcomes, and distribute candy. Record rules/outcomes on the board (e.g., *"Rule A + Rule B → CC"*).  

  ---

  #### **Phase 3: Debrief & Link to Program Equilibrium** (25 mins)  
  **45–55 mins: Reflect on Rule Round**  
  - Ask pairs:  
    - *"Did you cooperate? Why?"*  
    - *"What rule did your partner use? Did it surprise you?"*  
  - Highlight patterns:  
    > "Many of you used rules like *‘Cooperate if same rule’*. When both did this, you got CC! Why? Because you enforced mutual cooperation by making your action depend on their *strategy*, not their *action*."  

  **55–65 mins: Map to Program Equilibrium**  
  - **Analogy:**  
    > *"Your ‘rule card’ is like a program. Swapping cards = letting programs read each other’s source code. You ‘ran’ your program (rule) after seeing theirs."*  
  - **Key insight:**  
    > *"In blind PD, defecting dominates. But when programs see each other’s code, they can condition actions on mutual behavior. That’s how ‘Cooperate if same’ becomes stable—it punishes differing rules and rewards alignment."*  
  - Contrast rules:  
    - *"Always Defect"* → DD (bad).  
    - *"Always Cooperate"* → Exploited if partner defects.  
    - *"Cooperate if same rule"* → CC if matched, DD if not (safe against exploitation).  

  **65–70 mins: Address the "Math Trick" Feeling**  
  - **Q:** *"Did this feel like a ‘trick’? Why?"*  
  - **Reframe:**  
    > "It’s not magic—it’s about **commitment and predictability**. By sharing rules upfront, you reduced uncertainty. Real AI systems use this: algorithms commit to strategies before acting, enabling cooperation without repetition."  

  ---

  #### **Phase 4: Wrap-up & Caveats** (5 mins)  
  **70–75 mins: What We Faked**  
  - **Low-tech limitations vs. real program equilibrium:**  
    1. **No recursion/complexity:** Real programs can simulate opponent code (e.g., *"What will they do if I do X?"*). Cards can’t handle this—just assume rules are followed.  
    2. **No enforcement:** We trusted you to follow rules. Real programs execute automatically.  
    3. **No Nash refinement:** In real life, multiple equilibria exist (e.g., both writing *"Always Defect"*). We nudged toward cooperation.  

  **75–80 mins: Big-Picture Takeaway**  
  - *"This is why transparency matters in AI. When agents can share strategy code (or commitments), they cooperate in one-shot dilemmas. That’s program equilibrium—no enforcement needed!"*  
  - **Hand out extra candy for questions** 😊  

  ---

  ### **Anticipated Messy Moments & Fixes**  
  1. **Problem:** "Rules are vague or unenforceable."  
     - **Fix:** Pre-approve rules during writing time (e.g., *"Show me your card—does it clearly output C/D?"*).  

  2. **Problem:** "Students cheat/disobey rules."  
     - **Fix:** Announce: *"If I catch you, you get 0 candies. Honor system!"* Use public shaming minimally.  

  3. **Problem:** "No CC pairs in Rule Round."  
     - **Fix:** Fake a demo pair! Have two students read:  
       > Rule 1: *"Cooperate if Rule 2 says ‘Cooperate if Rule 1 says...’"*  
       → Show how mutual conditionality forces CC.  

  4. **Problem:** "Time runs short."  
     - **Fix:** Skip detailed pair-sharing; summarize outcomes. Focus on 1–2 example pairs.  

  5. **Problem:** "Overly complex rules."  
     - **Fix:** Ban conditionals beyond 1 clause (e.g., no *"Cooperate if they’re nice"*).  

  ---

  ### **Why This Works**  
  - **Experiential learning:** They *feel* the shift from DD (blind) to CC (transparent) via candy incentives.  
  - **Low-tech abstraction:** Cards = "code", swapping = "reading source", actions = "program output".  
  - **Debrief scaffolding:** Each step links mechanics to theory ("commitment" → "equilibrium").  

  **Post-workshop:** Email them a 1-pager on program equilibrium + Tennenholtz’s original paper for context. Good luck—they’ll be debating this over coffee! ☕
