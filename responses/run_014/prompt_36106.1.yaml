prompt: |-
  For the past six years I've chaired the volunteer board of a mid-sized community arts center, and every quarter we face the same kind of meeting: one or more projects we're already deep into, and the question of whether to keep funding them. Recent examples include a membership database migration that is about sixty percent complete with vendor costs ballooning, a co-production with a neighboring theater that is behind schedule and under-subscribed, and the annual winter festival that reliably loses a few thousand dollars but that our community is visibly attached to. In these meetings, board members argue by pointing at how much we've already spent and how much we'd be "throwing away" by stopping, and for years my reflex has been to slap that down with a rule I picked up somewhere: the money is gone either way, sunk costs are irrelevant, and the only thing that matters is a clean comparison of future costs against future benefits.

  Lately, though, I've stopped trusting my own slap-down. Some of the reasons people give for continuing do seem to track the past in ways that might be legitimate rather than confused. Donors who funded the first phase of a project will reasonably wonder about us if we abandon it midway. Stopping and later restarting carries real costs that a simple forward-looking comparison leaves out. There's also something to the thought that our earlier selves spent that money while holding information we may have forgotten, and that discarding their decision for free is its own kind of waste. And I've noticed the pure rule cuts the other way too: anyone who wants to kill a project can reframe every dollar already spent as "sunk" and thereby win the argument without ever discussing what the project is worth going forward. So I no longer believe the question is simply whether honoring sunk costs is rational or irrational; I suspect the real question is when and in what form the past should enter the decision, and I don't have a systematic way of answering it. I have no background in economics or philosophy, so I'm missing whatever structure this question actually has.

  What I'd like is a procedure the board can actually run at one of our quarterly meetings — ninety minutes, seven volunteers with no training, decisions in the range of five to fifty thousand dollars, and a need to leave the meeting with a written one-page record for the minutes. It should be an ordered set of questions, with some indication of what counts as a sufficient answer to each, the points at which it yields a recommendation to continue or stop, and the points at which it has to hand the decision back to us because the question is one of values rather than facts. Crucially, it should separate the genuine fallacy from the reasons for continuing that survive scrutiny — reputational commitments, restart costs, the information embodied in past spending, effects on partners and staff — and say how each of those should be weighed rather than just named. Then run it on three cases: the database migration, the under-subscribed co-production, and the beloved money-losing festival. I'd like you to be honest about where the procedure will misfire, which steps are judgment calls dressed up as procedure, and at least one case where the answer it gives goes against what the board — or frankly, what I — would prefer.
reasoning: |-
  Okay, the user is the chair of a volunteer board for a community arts center. They've been using the sunk cost fallacy rule to stop arguments about continuing projects based on past spending. But now they're seeing that some reasons for continuing might actually be valid, like reputational risks or restart costs. They want a practical procedure for their board meetings that handles these nuances.

  First, I need to unpack their main pain points. The board keeps revisiting projects that are over budget or underperforming. The user initially dismissed sunk costs but now realizes past decisions can have legitimate influences. They need a structured method to evaluate these factors without getting bogged down in fallacies.

  The user mentioned specific examples: a database migration with ballooning costs, a co-production that's behind and undersold, and a festival that loses money but is beloved. Each case has different factors. The database involves vendor lock-in and completion necessity. The co-production affects partnerships. The festival has community attachment and intangible benefits.

  The key is to separate emotional attachments from rational factors. The procedure must guide the board to consider reputational harm, restart expenses, and past information without falling for the "we've spent too much to quit" trap. Also, the process needs to be time-efficient—90 minutes with untrained volunteers—and produce a clear one-page record.

  I recall that in economics, sunk costs shouldn't affect decisions, but real-world factors like contractual obligations or strategic alignment do matter. The challenge is incorporating those without justifying irrational continuations. The user wants the procedure to flag when a decision is value-based rather than factual, so the board knows when to use their judgment.

  For each project, the steps should assess future costs/benefits, then evaluate legitimate past-related factors. For instance, the database might have high restart costs if switching vendors, while the festival's value is in community goodwill, which is hard to quantify. The procedure must force quantification where possible, like estimating reputational damage or measuring volunteer engagement.

  The user also wants honesty about where the procedure might misfire. For example, assigning weights to intangible factors is subjective. In the festival case, the procedure might recommend discontinuation despite community attachment, forcing the board to override based on values. That's a critical point—admitting when the output clashes with preferences.

  I need a step-by-step flowchart that's easy to follow. Starting with future viability, then moving to past commitments. Using thresholds, like the 70/30 rule for completion costs, helps simplify decisions. Including a "values override" step acknowledges that some factors transcend numbers.

  Testing the procedure on their three cases will show its application. The database might continue due to high restart costs, the co-production might be renegotiated or stopped, and the festival might be flagged for values-based override. Highlighting where the board might disagree, like cutting the festival, adds transparency.

  Finally, the user needs a one-minute summary for meetings. Emphasizing that the initial steps screen out sunk costs but later steps reintroduce valid past considerations. Ensuring the procedure is both rigorous and accessible for volunteers without economic training is essential.
answer: |-
  Here's a practical, step-by-step procedure designed for your board meetings, incorporating legitimate past considerations while rigorously screening out the sunk cost fallacy. It uses a flowchart-like approach with clear decision points:

  **The Project Continuation Decision Procedure (90-Minute Version)**

  **Materials:** Project summary (current status, total spent, future costs/benefits estimate), flip chart/whiteboard, timer.

  **1. The Future Screen (15 mins per project)**
      *   **Question:** *"Ignoring everything already spent, what are the FUTURE costs (cash, staff time, opportunity costs) and FUTURE benefits (revenue, audience reach, strategic alignment, community goodwill) to complete/run this project from TODAY?"*
      *   **Required:** Quantify costs. Quantify benefits where possible (tickets, memberships). List intangible benefits (goodwill, artistic value).
      *   **Decision Point:** **If Future Benefits CLEARLY & SIGNIFICANTLY > Future Costs, CONTINUE.** (Proceed to Step 4 for documentation). **If Future Costs CLEARLY & SIGNIFICANTLY > Future Benefits, proceed to Step 2.** *If close or highly uncertain, proceed to Step 2.*

  **2. The "Legitimate Past" Interrogation (20 mins per project)**
      *   **Question Set (Address each systematically):**
          *   **a. Reputational Commitment:** *"Who specifically (named donors, partner orgs, key community stakeholders) committed based on the project's completion? What is the tangible evidence (contracts, pledge letters, public announcements)? What specific, material harm (lost future donations, broken partnership, public outcry) is LIKELY if we stop?"*
              *   *Sufficient Answer:* Concrete names, documented commitments, plausible specific consequences (e.g., "Major Donor X pledged $10k for Phase 2 & has told us this is a priority; losing their support is likely").
              *   *Insufficient:* Vague fears ("People might be upset"), general reputation concerns without specifics.
          *   **b. Restart/Transition Costs:** *"If we stop now but might want this later, what are the ACTUAL costs to restart or transition? (e.g., new vendor search/onboarding, penalties, rehiring, re-design, re-marketing)? Are we locked into future payments even if we stop?"*
              *   *Sufficient Answer:* Quantifiable estimates for restart/transition, specific contractual obligations triggered by stoppage.
              *   *Insufficient:* "It would be annoying/hard to start over."
          *   **c. Embodied Information/Point of No Return:** *"Have we passed a critical point where completing is now CHEAPER or LESS RISKY than stopping? (e.g., migration 95% done, core build complete). Does stopping now waste unique effort/knowledge gained that can ONLY be used if we finish?"*
              *   *Sufficient Answer:* Evidence that marginal cost to finish is lower than cost to abort *and* rebuild later; proof that key irreplaceable work is done.
              *   *Insufficient:* "We've done so much already." (Focus on *type* of work done, not just volume/$).
          *   **d. Partner/Staff Morale Impact:** *"Will stopping actively damage essential relationships or cause key staff/partner resignations beyond normal disappointment?"*
              *   *Sufficient Answer:* Specific threats or history, evidence this project is critical to a key partner/staff member's commitment.
              *   *Insufficient:* General morale dip assumed.
      *   **Decision Point:** **If ONE or more "Legitimate Past" factors present a SPECIFIC, MATERIAL FUTURE COST (financial or strategic) that significantly changes the Future Cost/Benefit picture from Step 1, UPDATE the Future Cost/Benefit analysis.** Proceed to Step 3. **If NO credible, material "Legitimate Past" factors are identified, STOP the project.** (Proceed to Step 4).

  **3. The Updated Future Calculation (10 mins per project)**
      *   **Question:** *"Revisiting Step 1, incorporating the QUANTIFIED costs of the valid 'Legitimate Past' factors (e.g., add reputational risk cost as estimated lost donations, add restart costs, add penalties). Does the updated Future Benefit > updated Future Cost?"*
      *   **Decision Point:** **YES - CONTINUE. NO - STOP.** (Proceed to Step 4). *If still highly uncertain or close, proceed to Step 4 acknowledging deadlock.*

  **4. Documentation & Values Call (Remaining Time)**
      *   **Question:** *"Summarize the decision, key factors, and any unresolved VALUE judgment requiring board vote (e.g., 'Updated costs exceed benefits, but board believes community attachment to festival is a core value worth subsidizing')."*
      *   **Action:** Draft the 1-page minute record:
          *   Project Name
          *   Step 1: Future Cost/Benefit Summary
          *   Step 2: Valid "Legitimate Past" Factors Identified (or "None")
          *   Step 3: Updated Calculation & Rationale
          *   **Decision:** Continue / Stop / Deadlock (Requires Vote)
          *   **Values Override (If Applicable):** "Board voted X-Y to CONTINUE/STOP based on value judgment [State Value, e.g., 'Community Tradition'] overriding the financial analysis."

  ---

  **Applying the Procedure: The Three Cases**

  **1. Database Migration (60% Complete, Costs Ballooning)**
      *   **Step 1 (Future):** High future costs (ballooned vendor fees, internal time). Future benefits: operational efficiency, better data. *Verdict: Costs likely > Benefits? Proceed to Step 2.*
      *   **Step 2 (Legitimate Past):**
          *   *Reputational:* Unlikely (no specific donor for *this* phase).
          *   *Restart Costs:* **HIGH.** New vendor search, re-scoping, data cleanup, potential data loss. Existing contract penalties? Locked-in future payments?
          *   *Embodied Info:* **HIGH.** Core extraction/transformation might be done. Unique vendor knowledge gained. Finishing *might* be cheaper than restarting.
          *   *Morale:* Moderate (staff frustration), unlikely catastrophic.
      *   **Step 3 (Updated Future):** Add significant Restart & Embodied Info costs (quantify if possible: e.g., "Restart estimated $15k vs. $10k to finish"). *Verdict: Updated Benefits (efficiency) likely justify Updated (Completion + Avoided Restart) Costs? **RECOMMEND: CONTINUE** (finishing is cheaper than stopping).*
      *   **Values Call:** Unlikely needed. *Procedure Output: Continue.*

  **2. Co-Production (Behind Schedule, Under-Subscribed)**
      *   **Step 1 (Future):** High future costs (remaining production, marketing push). Low future benefits (poor ticket revenue forecast). *Verdict: Costs CLEARLY > Benefits. Proceed to Step 2.*
      *   **Step 2 (Legitimate Past):**
          *   *Reputational:* **MODERATE/HIGH.** Specific partner theater. Harm: Damaged trust, future collaboration unlikely. Quantify? (Estimate lost joint grant opportunity value).
          *   *Restart Costs:* Low (project-specific).
          *   *Embodied Info:* Low (artistic process isn't usually "wasted" if stopped; scripts/sets might be reusable but not uniquely tied to completion).
          *   *Morale:* **MODERATE.** Cast/crew disappointment, partner frustration.
      *   **Step 3 (Updated Future):** Add quantifiable reputational cost (e.g., "Estimated $5k value of lost future partnership"). *Verdict: Even with $5k added Benefit (avoiding loss), Future Costs likely STILL > Benefits? **RECOMMEND: STOP.***
      *   **Values Call:** Board might value partnership highly. *Procedure Output: Stop, but board can override based on value "Strategic Partnership" if quantified reputational cost is deemed too low.*

  **3. Beloved Money-Losing Festival**
      *   **Step 1 (Future):** Future Costs (known loss of few thousand). Future Benefits: Some revenue, high intangible community goodwill, volunteer engagement. *Verdict: Quantifiable Costs > Quantifiable Benefits. Proceed to Step 2.*
      *   **Step 2 (Legitimate Past):**
          *   *Reputational:* **HIGH, but DIFFUSE.** Community expectation built over years. Harm: Loss of trust, reduced community support? Hard to quantify specifically.
          *   *Restart Costs:* Low (annual event).
          *   *Embodied Info:* Low.
          *   *Morale:* **HIGH.** Staff/volunteer pride, community identity.
      *   **Step 3 (Updated Future):** Intangibles are dominant but resist clean quantification. *Verdict: Procedure CANNOT resolve. **RECOMMEND: Values Call.***
      *   **Values Call:** **ESSENTIAL.** Does the quantified loss justify the intangible community benefit & identity? *Procedure Output: Values Judgment Required - "Board prioritizes Community Tradition & Goodwill over annual operating loss of $X."*

  ---

  **Where the Procedure Misfires & Judgment Dressed as Procedure**

  1.  **Quantifying the Intangible (Judgment in Step 2/3):** Assigning dollar values to reputation damage or morale impact (Co-Pro, Festival) is inherently subjective. The procedure forces specificity ("$5k lost partnership value?") but the *number* is a judgment call disguised as quantification.
  2.  **"Materiality" Threshold (Judgment in Step 2):** What constitutes "SPECIFIC, MATERIAL"? Is a vague community grumble "material"? Is a single annoyed donor? The Chair/facilitator must make a call on what factors get "admitted" to Step 2 scrutiny.
  3.  **The Close Call (Judgment in Step 1/3):** Defining "CLEARLY & SIGNIFICANTLY" is subjective. When costs and benefits are close, the procedure pushes towards continuing (by going to Step 2), potentially favoring inertia. The board needs awareness of this bias.
  4.  **Values Override Masking Poor Process (Risk in Step 4):** The board could misuse the "Values Override" to justify continuing *any* project they like emotionally ("We value... uh... finishing things!"). The procedure requires a *specific, named value* ("Community Tradition," "Strategic Partnership") to be invoked.
  5.  **Underestimating the "Clean Kill" Cost (Procedure Blindspot):** Stopping a project sometimes has immediate, clear savings (canceling a contract). The procedure focuses on future costs *of stopping*, but may underweight the psychological and operational relief of ending a draining project, freeing up resources instantly.

  **Case Where Procedure Goes Against Preference: The Beloved Festival**
  The procedure ruthlessly exposes the festival as a consistent money-loser where the *only* justification is intangible community value (Step 2) that cannot be financially quantified (Step 3). It forces a stark values decision (Step 4). If your personal preference is to always run the festival, the procedure doesn't support that automatically – it makes you explicitly vote on the value *despite* the loss. It might even recommend stopping if the board refuses to articulate the value override clearly. This is uncomfortable but necessary honesty.

  **The One-Page Minute Record Template:**

  ```
  **Project:** [e.g., Winter Festival]
  **Step 1 - Future Outlook:** Costs: [$X Loss + Staff Time]. Benefits: [$Y Revenue + High Community Goodwill]. Verdict: Quantifiable Costs > Quantifiable Benefits.
  **Step 2 - Legitimate Past Factors:** Reputational Commitment (High/Diffuse Community Expectation), Staff/Volunteer Morale (High). Restart: N/A. Embodied Info: N/A.
  **Step 3 - Updated Calculation:** Intangible benefits dominant; quantification impractical. Verdict: Values Judgment Required.
  **Decision:** Continue, based on Board Values Override: "Community Tradition & Identity outweigh annual operating loss."
  ```
  ```
  **Project:** [e.g., Co-Production]
  **Step 1 - Future Outlook:** Costs: [$A Remaining Prod/Marketing]. Benefits: [$B Forecast Low Revenue]. Verdict: Costs > Benefits.
  **Step 2 - Legitimate Past Factors:** Reputational Commitment (Partner Theater X; estimated $5k value of future collaboration at risk). Restart: Low. Embodied Info: Low. Morale: Moderate.
  **Step 3 - Updated Calculation:** Future Costs [$A] > Future Benefits [$B + $5k Avoided Reputation Loss]. Verdict: Stop Recommended.
  **Decision:** Stop Project. (No Values Override invoked).
  ```

  **How to Run It in 90 Minutes:**
  *   **Preparation (Before Meeting):** Staff prepares briefs for each project summarizing Steps 1 & 2 factors where known.
  *   **Meeting:** Focus on 1-2 critical projects max.
      *   Project 1: Step 1 (10 min), Step 2 (15 min), Step 3 (5 min), Step 4 (5 min) = 35 min.
      *   Project 2: Repeat = 35 min.
      *   Buffer/Discussion: 20 min.
  *   **Chair Role:** Strict timekeeper. Enforce specificity ("Who exactly?", "How much?"). Guide Step 2, challenge vagueness. Summarize clearly for Step 4 documentation.
  *   **Board Role:** Come prepared. Focus answers on specific questions. Be ready for values vote.

  This procedure forces the board to confront the *real* reasons for continuing beyond sunk costs, provides a defensible record, acknowledges the role of values, and crucially, **makes the irrational attachment to sunk costs visibly irrational** when no legitimate past factors exist. It turns a chaotic debate into a structured inquiry.
