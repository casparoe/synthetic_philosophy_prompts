  The strategy-stealing argument in standard Hex relies on two key points:
  1. Having an extra stone of your color on the board never hurts your position (i.e., if a board state is winning for you without that extra stone, it remains winning with it).
  2. Therefore, the first player can make an arbitrary first move (a "dummy" move) and then, for the rest of the game, pretend to be the second player by using the second player's supposed winning strategy. If the dummy move is ever in the way (i.e., the strategy calls for a move where the dummy already is), the first player can play elsewhere arbitrarily and still be at least as well off as the second player would have been without that extra stone.

  In our variant, each player has one pass they can use. The rule: exactly one pass per player per game, and no two passes in a row.

