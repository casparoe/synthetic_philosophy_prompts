  Below is a decision tree designed to sort positions on the norm of assertion based on intuitive case judgments. It starts from the premise that assertion is a normative speech act and uses 7 concrete scenarios to navigate the logical space of possible norms. Named positions are **Knowledge Norm (KN)**, **Truth Norm (TN)**, **Belief Norm (BN)**, **Practical Norm (PN)**, **Anti-Norm (AN)**, plus two hybrids (**Justification Norm/JN** and **Hybrid Norm/HN**) that emerge from the cases. Each branch forces a choice between conflicting intuitions.

  ---

  ### **Assertion Norm Decision Tree**  
  *Start at Q0. Answer "Yes" or "No" to each scenario.*

  #### **Q0: Unsupported False Assertion**  
  Sam has no evidence and doesn’t believe it’s raining (he’s guessing). It is *not* raining. Sam asserts, "It’s raining."  
  → **Yes, proper** → **AN (Anti-Norm)**: No unique norm governs assertion.  
  → **No, improper** → Proceed to Q1.

  #### **Q1: Lucky True Belief**  
  Alex believes a coin landed heads based *only* on a dream. It *did* land heads. Alex asserts, "Heads!"  
  → **Yes, proper** → Proceed to Q2A.  
  → **No, improper** → Proceed to Q2B.

  #### **Q2A: False Belief**  
  Chris has strong evidence the coin landed heads (saw it clearly) and believes it. It *actually* landed tails. Chris asserts, "Heads!"  
  → **Yes, proper** → **BN (Belief Norm)**: Assert only what you believe.  
  → **No, improper** → **TN (Truth Norm)**: Assert only what is true.

  #### **Q2B: Gettiered Assertion**  
  Taylor sees a clock stopped at 3:00. It *is* 3:00. Taylor believes and asserts, "It’s 3:00." (Unbeknownst to Taylor, the clock broke 12 hours ago.)  
  → **Yes, proper** → Proceed to Q3A.  
  → **No, improper** → Proceed to Q3B.

  #### **Q3A: High-Stakes Assertion**  
  Jamie has the *same evidence as Taylor in Q2B* (sees a stopped clock at 3:00; it *is* 3:00). If wrong, Jamie will be fired. Jamie asserts, "It’s 3:00."  
  → **Yes, proper** → **JN (Justification Norm)**: Assert only what you’re justified in believing (stakes-invariant).  
  → **No, improper** → **PN (Practical Norm)**: Assert only what you can act on as if true (stakes-sensitive).

  #### **Q3B: Confidential Knowledge**  
  You *know* your boss committed tax fraud (you overheard it clearly). You’re bound by confidentiality. You assert to a colleague, "Boss committed tax fraud."  
  → **Yes, proper** → **KN (Knowledge Norm)**: Assert only what you know.  
  → **No, improper** → **HN (Hybrid Norm)**: Assert only what you know *and* are practically entitled to assert.

  ---

  ### **Key Notes**  
  1. **Covered Cases**:  
     - Lucky-belief (Q1), stake-shifting (Q3A), "knows but no right to say" (Q3B).  
     - *Knows-but-doesn’t-believe* omitted: Assumed resolved by BN/KN (belief is typically required for knowledge; Q2A covers belief).

  2. **Unseparated Positions**:  
     - **JN vs. KN**: Both reject lucky beliefs (Q1) and Gettier cases (Q2B), but diverge on stakes (Q3A).  
     - **PN vs. HN**: Both are stakes-sensitive, but PN doesn’t require knowledge (rejects Q2B), while HN does (requires Q2B=No).

  3. **Empty/Incoherent Combinations**:  
     - *"Q1=No, Q2B=Yes, Q3A=No"* → **PN**: Coherent but maps to stakes-sensitive justification.  
     - *"Q1=Yes, Q2A=No"* → **TN**: Requires truth but not justification (consistent but unpopular).  
     - *"Q0=No, Q1=Yes, Q2A=Yes"* → **BN**: Permits false assertions if believed (internally consistent).

  4. **Why Hybrids?**  
     - **JN** emerges if you reject luck (Q1) but accept Gettier (Q2B) and ignore stakes (Q3A=Yes).  
     - **HN** emerges if you require knowledge (Q2B=No) but add practical constraints (Q3B=No).  

  5. **Tree Logic**:  
     - Q0 isolates AN (denies normativity).  
     - Q1 separates truth+belief norms (Yes) from justification/knowledge norms (No).  
     - Q2A splits TN (requires truth) from BN (permits false beliefs).  
     - Q2B splits knowledge-requirers (No) from justification-requirers (Yes).  
     - Q3A/Q3B resolve stakes-sensitivity and practical overrides.

  ---

  ### **Position Map**  
  | **Norm**              | **Q0** | **Q1** | **Q2A** | **Q2B** | **Q3A** | **Q3B** |  
  |------------------------|--------|--------|---------|---------|---------|---------|  
  | AN (Anti-Norm)         | Yes    | –      | –       | –       | –       | –       |  
  | TN (Truth Norm)        | No     | Yes    | No      | –       | –       | –       |  
  | BN (Belief Norm)       | No     | Yes    | Yes     | –       | –       | –       |  
  | JN (Justification Norm)| No     | No     | –       | Yes     | Yes     | –       |  
  | PN (Practical Norm)    | No     | No     | –       | Yes     | No      | –       |  
  | KN (Knowledge Norm)    | No     | No     | –       | No      | –       | Yes     |  
  | HN (Hybrid Norm)       | No     | No     | –       | No      | –       | No      |  

