       - For Novikov: The objection that the principle might be ad hoc and that it is not clear how the laws of physics would enforce consistency without violating local causality.

  **Points of Agreement**:
     - Both agree that the past cannot be changed and that consistency must hold.
     - Both reject the possibility of genuine contradictions arising from time travel.

