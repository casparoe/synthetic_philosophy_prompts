  We are comparing David Lewis's resolution of the grandfather paradox (from his 1976 paper) and the Novikov self-consistency principle (from physics) on four specific points.

  1. **Agency in the Past**:
     - **Lewis**: The time traveler retains agency and can try to kill their grandfather. However, they will fail because of coincidences (like a slip, a noise, etc.). The failure is not due to a lack of ability or opportunity but because the past is fixed. The traveler is free to try, but the outcome is predetermined to be consistent with the past.
     - **Novikov**: The self-consistency principle is a physical constraint. The laws of physics (in the presence of closed timelike curves) only allow events that are self-consistent. Thus, the traveler would not even have the opportunity to create an inconsistency. The constraint is structural: the initial conditions and the laws of physics are such that only consistent events occur.

     *Contrast*: Lewis allows for the attempt (with failure due to coincidence), while Novikov rules out the possibility of the attempt leading to an inconsistent state at all.

  2. **The Fixed Past**:
     - **Lewis**: The past is fixed in the sense that what has happened cannot be changed. This is a metaphysical notion of time: events are temporally relative. For a person at a given time, the past is fixed and the future is open. But for the time traveler, when they are in the past, that past is their present and thus open, but the fact that they are from the future means that what they do must be consistent with the future they came from. So the past is fixed relative to the time of the event, but the traveler is part of that fixed past when they travel back.
     - **Novikov**: The past is fixed by the global solution of the equations of physics. The entire spacetime is a fixed four-dimensional manifold. The self-consistency principle is a consequence of the laws of physics (like general relativity) in the presence of closed timelike curves. The past is fixed in the sense that the entire history is determined by the laws and initial conditions.

     *Contrast*: Lewis's fixed past is based on the idea of temporal relations (what is past from a given vantage point) and the impossibility of changing the past, while Novikov's is a consequence of the block universe and deterministic physical laws.

  3. **Free Will and Determinism**:
     - **Lewis**: Lewis's account does not require global determinism. He allows for indeterminism in the usual sense. However, for time travel events, the outcomes must be consistent. So, in the case of the grandfather paradox, the failure of the attempt is consistent with the traveler's freedom: he was free to try, but something happened to prevent success. This is a local determinism for the time travel scenario but not necessarily global.
     - **Novikov**: The Novikov principle assumes a deterministic physical universe. The laws of physics are such that they only allow self-consistent solutions. Therefore, in the presence of closed timelike curves, the universe is globally deterministic: the state at any time determines the state at all other times, including along the closed curve.

     *Contrast*: Lewis allows for indeterminism in general but enforces consistency for time travel events, while Novikov requires global determinism to maintain consistency.

  4. **Dissolving vs. Relocating the Paradox**:
     - **Lewis**: The paradox is dissolved because the traveler cannot change the past. The attempt fails not because of a lack of ability but because of coincidences. The question of how the traveler came to exist is answered by the fact that the grandfather was not killed. The consistency is maintained by the failure of the attempt.
