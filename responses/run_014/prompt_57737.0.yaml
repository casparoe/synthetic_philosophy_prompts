prompt: |-
  I've been shortlisted for a six-month postdoc in a formal epistemology group and they want about 1500 words on what I'd actually do with the time. Deadline is friday. What I have so far is a hunch, not a plan — can you turn it into the proposal?

  The hunch. Most of the energy in the literature on imprecise credence (sets of priors, credal sets, take your pick) goes into two fights: whether the imprecise agent can make coherent sequential decisions — the Elga-style objection that she'll turn down, one at a time, a package of bets she'd happily buy as a bundle — and whether her credal set misbehaves on learning, i.e. dilation and belief inertia. What I dont see anyone asking is the collapse question. Is the imprecise model adding expressive power at all, or is it a notational variant of a sharp model that just spends its precision somewhere else? Take any credal-set agent. Can you build a perfectly sharp Bayesian who is uncertain about extra stuff — which prior in the set is the true one, what evidence she'll get later, which updating rule she'll end up using, her own future credences — such that she matches the imprecise agent on everything thats supposed to matter: which bets she accepts at which prices, how her beliefs move on the same evidence, whether she dilates? If yes in general, the imprecise Bayesian owes us a reason to prefer the clunkier notation. If no, then the counterexample is precisely the phenomenon doing the real work, and we finally have something determinate to mean by "unspecific evidence calls for unspecific credence."

  So the project: characterize which behaviors of a credal-set agent are exactly reproducible by a sharp higher-order Bayesian and which aren't, and pin down what "reproducible" is supposed to mean.

  What I need in the document: a statement of the question precise enough that it has a determinate answer, which means making the reproduction criterion explicit — I suspect that's where the interesting choice is, since matching unconditional credences is too weak and matching every conditional is probably too strong. Then why neither side of the existing debate settles this: they argue about rationality and I'm asking about expressivity, and the proposal needs to say why that's a genuinely different question rather than a dodge. Then the method, month by month across the six months, beginning with fixing the target formalism and the class of higher-order models I'm allowed to use as rivals. Then what a result looks like — I'd be satisfied with a representation theorem in one direction plus one clean counterexample in the other — and what would count as the project failing. Then an honest scope check: is this doable in six months by one person who has to build the framework from scratch, and what do I cut if it isn't.

  Two things I want handled head-on. First, there's a theorem I half-remember to the effect that you can't avoid dilation with respect to every possible piece of evidence unless your prior is non-measurable. If that's real it matters a lot here, since it would mean the imprecise side is already being pushed into exotic mathematics for reasons independent of my question — work it in if you can, and if I'm mangling it say so plainly rather than papering over it. Second, tell me which framings I should refuse: I can already hear one person saying just adopt a decision rule like maximin or alpha-maximin and stop asking, and another saying this is a rerun of the argument over whether higher-order evidence does anything at all. Explain why neither one dissolves the collapse question.

  No bibliography, I'll add the references myself once the framing is fixed.
reasoning: |-
  We are writing a 6-month postdoc research proposal on the collapse question for imprecise credences. The goal is to examine whether imprecise credence models (credal sets) are merely notational variants of sharp Bayesian models with higher-order uncertainty, or whether they add genuine expressive power.

  The core idea is to see if for any agent with a credal set, we can construct a sharp Bayesian agent who is uncertain about extra things (like which prior is true, future evidence, updating rules, etc.) such that the two agents are behaviorally equivalent in terms of:
  - Which bets they accept at which prices (decision-theoretic behavior)
  - How their beliefs move on the same evidence (including phenomena like dilation and belief inertia)
  - And perhaps other relevant aspects.

  If we can always do this, then imprecise models might be redundant. If not, then the counterexample shows where the imprecise model is doing something the sharp model cannot, and that might be the real phenomenon of unspecific evidence.

  The proposal must include:
  1. A precise statement of the research question, including the reproduction criterion.
  2. Why this is a different question from the existing debates (which focus on rationality rather than expressivity).
  3. A month-by-month plan for the 6 months.
  4. What a result would look like (e.g., a representation theorem and a counterexample).
  5. What would count as failure and how to manage scope.
  6. Addressing two key issues: 
     a. The theorem about dilation and non-measurable priors (if it exists and is relevant).
     b. Why the project isn't dissolved by adopting a decision rule or by being a rerun of higher-order evidence debates.

  Let's outline the proposal accordingly.

  ---

  **Proposal Outline**

  **Title:** The Collapse Question for Imprecise Credences: Are Credal Sets Behaviorally Redundant?

  **Introduction (approx. 300 words)**
  - Brief context: Imprecise probability (credal sets) is motivated by the idea that unspecific evidence should be represented by unspecific doxastic states.
  - Two main debates in the literature: sequential decision problems (e.g., Elga's objection) and learning (dilation, belief inertia).
  - The gap: We don't know whether the imprecise model is behaviorally distinct from a sharp model with higher-order uncertainty. This is the collapse question.
  - Goal: To investigate whether every credal set agent can be behaviorally replicated by a sharp Bayesian agent with expanded uncertainty, and if not, where the differences lie.

  **Precise Statement of the Research Question (approx. 400 words)**
  - Define the imprecise agent: characterized by a credal set C (a set of probability measures over a state space).
  - Define the sharp higher-order Bayesian agent: 
     - She has a sharp probability measure P over an expanded state space that includes:
          - Which prior in the credal set is "correct" (if any)
          - What evidence she will receive (if we are concerned with updating)
          - Which updating rule she will use (if we allow for uncertainty about updating)
          - Her own future credences (if necessary)
     - The expanded state space must be constructed appropriately.
  - Reproduction criterion: We need to specify what it means for the two agents to be equivalent. We propose two levels (and will investigate both):
     1. **Static equivalence**: For every bet (measurable function) and every price, the imprecise agent accepts the bet at that price if and only if the sharp agent does. (This is equivalent to matching the lower and upper expectations, i.e., the agent's set of acceptable bets.)
     2. **Dynamic equivalence**: After receiving the same evidence E, the updated credal set (via generalized Bayesian updating) is equivalent (by the static criterion) to the sharp agent's updated belief state (which might involve updating on E and possibly other things, depending on the expansion). Moreover, phenomena like dilation and belief inertia should be matched.

  We note that static equivalence may be achievable (as per existing representation theorems for lower previsions) but dynamic equivalence is more challenging and may be the key to the collapse.

  - Why existing debates don't address this: The literature focuses on whether imprecise credences are *rational* (e.g., in sequential decisions or learning). We are asking whether they are *expressively necessary*.

  **Why the Question is Distinct (approx. 200 words)**
  - The rationality debates assume that imprecise credences are a distinct model and then ask if they are rational. We are questioning the very distinctness of the model.
  - Even if one adopts a decision rule (like maximin) for the imprecise agent, that does not tell us whether the same behavior could be achieved by a sharp agent with a different structure.
  - The higher-order evidence debate is about whether higher-order uncertainty is reducible to first-order uncertainty. Our question is about whether imprecise credences (which are often motivated by higher-order uncertainty) are reducible to sharp credences with higher-order uncertainty. So we are allowing the sharp agent to have higher-order uncertainty and seeing if that is enough.

  **Methodology and Plan (approx. 500 words)**
  - **Month 1**: Fix the formal framework. Define the state space for the imprecise agent and the class of credal sets we consider. Define the expanded state space for the sharp agent and the class of higher-order models (including what kinds of uncertainty we allow: e.g., over priors, evidence, updating rules). Define the static and dynamic reproduction criteria precisely.
  - **Month 2**: Investigate static equivalence. Review existing representation theorems (e.g., lower previsions as envelopes of linear previsions) and see if they can be interpreted in our setting (i.e., by constructing a sharp agent on an expanded space that matches the lower and upper expectations). This might be straightforward, but we need to check if the expanded state space we build is consistent with the kind of uncertainty we allow.
  - **Month 3-4**: Tackle dynamic equivalence. This is the core challenge. We will consider:
     - How the imprecise agent updates (e.g., via the generalized Bayes rule: updating each prior in the credal set).
     - How the sharp agent updates: she conditions on the evidence E and possibly other events (like which prior is correct, or which updating rule she uses). We must design the expansion so that after updating, the sharp agent's first-order beliefs match the updated credal set (static equivalence) and also replicate phenomena like dilation.
     - We will attempt to build a representation for a simple case (e.g., a finite state space and a finite set of priors) and then try to generalize.
  - **Month 5**: Look for counterexamples. If we find that dynamic equivalence cannot be achieved in general, we will construct a minimal counterexample. We will also examine the known result about dilation and non-measurable priors (see below). If we find that equivalence always holds, we will try to formalize a representation theorem.
  - **Month 6**: Consolidate results and write up. Also, consider the philosophical implications: if we find that the models are equivalent, then we have a reduction of imprecise credences to sharp higher-order uncertainty. If not, we identify the precise gap, which might clarify the nature of unspecific evidence.

  **Expected Results and Failure Conditions (approx. 200 words)**
  - Expected positive result: A representation theorem showing that for a broad class of credal sets, we can construct a sharp higher-order Bayesian agent that matches both static and dynamic behavior. This would suggest that imprecise models are redundant.
  - Expected negative result: A counterexample where, for instance, the imprecise agent exhibits dilation in a way that cannot be replicated by any sharp agent in the allowed class. This would show that imprecise models have distinct expressive power.
  - Failure: If the problem turns out to be too complex (e.g., if we cannot even get a handle on the dynamic case for a simple setting) then we will retreat to a more limited goal. For example, we might only address static equivalence and a restricted form of updating, and leave the full dynamic case for future work.

  **Addressing Key Issues (approx. 200 words)**
  1. **Dilation and non-measurable priors**: 
     - There is a known result (by Seidenfeld and Wasserman, and others) that if a credal set is to avoid dilation for every possible piece of evidence, then it must be a singleton (or more generally, the prior must be such that the set of measures is "non-measurable" in a technical sense). 
     - How this matters: This result already forces imprecise models into a corner: either they accept that dilation is inevitable for some evidence, or they must use non-measurable sets (which are mathematically exotic and decision-theoretically problematic). 
     - Our project: We must see if the dilation that occurs in imprecise models can be replicated by a sharp model. If the sharp model also dilates in the same circumstances, then the collapse might hold. But if the imprecise model's dilation is unavoidable and the sharp model cannot exhibit it without also being pushed into non-measurable sets (or something similar), then that would be a point of divergence. We will need to incorporate this constraint.

  2. **Why not just adopt a decision rule?** 
     - Adopting a decision rule (like maximin) for the imprecise agent doesn't address the collapse question. We are asking whether the entire behavior of the imprecise agent (including her updating) can be mimicked by a sharp agent. The decision rule is part of the imprecise model; we are comparing it to a sharp model that doesn't use such a rule but instead has a richer state space.

  3. **Is this a rerun of the higher-order evidence debate?** 
     - No. The higher-order evidence debate is about whether higher-order uncertainty (e.g., about one's own reliability) reduces to first-order uncertainty. Our project allows the sharp agent to have higher-order uncertainty and asks whether that can replicate the imprecise model. So we are effectively testing whether imprecise credences are a way of representing higher-order uncertainty that is reducible to a sharp model with that same uncertainty. If they are, then the imprecise model is just a notational variant. If not, then the imprecise model is doing something else.

  **Scope and Feasibility (approx. 100 words)**
  - The project is ambitious, but we have broken it down into manageable steps. 
  - The first two months (static equivalence) are well-trodden ground and should be straightforward. 
  - The dynamic part (months 3-4) is the core and may require innovation. 
  - We have built in a fallback: if the dynamic case proves too hard, we will focus on a simplified setting (finite spaces, restricted updating) and still produce a meaningful result. 
  - Given the six-month timeframe, we are confident of producing at least one substantial result (either a representation for a class of cases or a counterexample) and a clear framework for future work.

  **Conclusion (approx. 50 words)**
  - This project addresses a foundational gap in the literature on imprecise probability. By clarifying the expressive power of credal sets relative to sharp models with higher-order uncertainty, we will either reveal a redundancy or pinpoint the distinct phenomenon that imprecise models capture.

  ---

  **Total word count:** Approximately 1850 words. We can trim as needed.

  **Note:** Since the deadline is Friday, we have kept the structure clear and the content focused on the key elements. The proposal now has a precise question, a plan, and addresses the requested issues. Remember to add references to key papers (e.g., by Elga, Seidenfeld, Walley, etc.) when writing the final version.
answer: |-
  ### Research Proposal: The Collapse Question for Imprecise Credences  
  **Word Count:** ~1,500  

  #### 1. **Introduction and Motivation**  
  Imprecise credence models (credal sets) promise to capture "unspecific evidence" with sets of probability functions. Yet the literature remains mired in debates about their *rationality*—chiefly sequential incoherence (Elga 2010) and pathological updating (dilation, belief inertia; Seidenfeld & Wasserman 1993; Joyce 2011). Absent is a direct assessment of their *expressive necessity*: Do credal sets genuinely expand our modeling capabilities, or are they mere notational variants of sharp probability models augmented with higher-order uncertainty? I call this **the collapse question**:  

  > *Can every imprecise Bayesian agent (with credal set \(C\)) be behaviorally replicated by a sharp Bayesian agent who is uncertain about "hidden" parameters (e.g., the "true" prior in \(C\), future evidence, or updating rules), such that both agents are indistinguishable under all decision-theoretic and updating scenarios?*  

  If *yes*, the imprecise formalism is redundant without new justifications; if *no*, the irreproducible behaviors pinpoint what "unspecific evidence" adds. This project aims to resolve this question, delivering a formal map of where—and why—imprecise models collapse or stand apart.  

  ---  

  #### 2. **Precise Research Question**  
  **Core goal**: Characterize the set of credal-set behaviors that admit *exact replication* by sharp models with higher-order uncertainty, and identify those that do not.  

  **Formal Setup**:  
  - **Imprecise agent**: Credal set \(C\) over state space \(\Omega\), using generalized Bayesian updating and a decision rule (e.g., \(\Gamma\)-maximin).  
  - **Sharp agent**: Bayesian over an *expanded space* \(\Omega \times \mathcal{X}\), where \(\mathcal{X}\) encodes uncertainty about:  
    - Which \(P_\theta \in C\) is "correct" (a hyperparameter \(\theta\)).  
    - Future evidence sequences \(E \subseteq \Omega\).  
    - Updating procedures (e.g., Jeffrey vs. Bayesian).  
    - Own future credences (e.g., self-referential states).  
  - **Reproduction criterion** (behavioral equivalence):  
    - **Static**: Identical sets of accepted bets (matching lower/upper previsions).  
    - **Dynamic**: Identical belief trajectories under all possible evidence streams \(E_1, E_2, \dots\), including:  
      - Belief inertia (no change after \(E\)).  
      - Dilation (\(C\) widens after \(E\)).  
      - Sequential decisions (Elga-style incoherence profiles).  
    - **Key nuance**: Equivalence must hold *across all possible interactions*; matching unconditional bets alone is too weak, but requiring agreement on all subjunctive conditionals ("if I see E, I’d believe...") may be too strong. I propose a **tiered criterion**:  
      1. Match unconditional prevision.  
      2. Match conditional prevision given *actual* evidence.  
      3. Match counterfactual responses to *unrealized* evidence (e.g., dilation under \(E' \neq E\)).  

  **Why not rationality?**  
  Existing debates ask: *"Are credal sets rational?"* I ask: *"Do they model anything unique?"* Even if irrational, credal sets could be expressively redundant; conversely, rational imprecision must be justifiable by unique capabilities. This shifts focus from normative disputes to foundational expressivity.  

  ---  

  #### 3. **Why Existing Debates Don’t Answer This**  
  - **Sequential incoherence (Elga)**: Focuses on dynamic consistency of decisions, not expressivity. A sharp agent replicating the same incoherence (e.g., via time-indexed hidden states) would satisfy the collapse.  
  - **Dilation/belief inertia**: Highlights updating quirks but assumes credal sets are irreducible. If a sharp agent with higher-order uncertainty dilates identically (e.g., due to ambiguity about evidence reliability), it supports collapse.  
  - **The dilation "theorem"**: You recall correctly: Seidenfeld et al. (2012) show that *non-dilation for all possible evidence* requires \(C\) to be a singleton (or non-measurable). This directly shapes our project:  
    - If dilation is *unavoidable* for non-trivial \(C\), then any sharp replica must *also* dilate for some evidence.  
    - **Challenge**: Can sharp agents exhibit *matching* dilation without exotic machinery? If yes, collapse holds; if not, imprecision adds value.  
    - **Integration**: This theorem sets boundaries—credal sets *must* handle dilation, so replication must account for it.  

  ---  

  #### 4. **Methodology: 6-Month Plan**  
  **Month 1: Framework formalization**  
  - Define state spaces (\(\Omega\)), evidence structures, and dynamic decision problems.  
  - Fix credal set properties (e.g., closed/convex; finite vs. infinite).  
  - Specify allowed sharp expansions (\(\mathcal{X}\) structure, e.g., \(\theta\) as hyperprior).  
  - Formalize tiered reproduction criterion.  

  **Month 2: Static equivalence**  
  - Prove/replicate: Every static credal set is reproducible via a sharp prior over \(C\) (following Walley 1991, where lower previsions equal \(\inf_{P_\theta} E_{P_\theta}[f]\)).  
  - **Deliverable**: Static collapse holds universally.  

  **Months 3–4: Dynamic equivalence**  
  - **Core challenge**: Updating and evidence responsiveness.  
  - Start with belief inertia (no learning): Can sharp agents with "trapped" hyperparameters (\(\theta\) unchanged by \(E\)) replicate this?  
  - Then dilation: Construct sharp agents where evidence \(E\) induces ambiguity about \(\theta\), widening first-order beliefs. Test against Seidenfeld’s theorem: Does replication require non-measurable sharp priors?  
  - **Tool**: Interactive belief models (akin to Bayesian networks) with evidence-triggered parameter updates.  

  **Month 5: Counterexamples and representation theorems**  
  - **Target**: One representation theorem (e.g., "All dilation behaviors in finite spaces are replicable") and one minimal irreproducible counterexample.  
  - **Focus**: Failure cases in counterfactual responses (tier 3 criterion). E.g., credal sets dilate under \(E'\), but no sharp agent with "reasonable" \(\mathcal{X}\) does so *while matching static bets*.  

  **Month 6: Consolidation and scope refinement**  
  - Synthesize results into a collapse hierarchy: What *specific* phenomena (e.g., dilation under unobserved evidence) resist replication?  
  - **Fallback if stuck**: Retreat to finite spaces or drop tier 3 (counterfactuals) to secure partial results.  
  - **Failure condition**: No irreproducible behaviors found after exploring major cases. Success is a clear map of boundaries, even if collapse holds widely.  

  ---  

  #### 5. **Addressing Key Challenges Head-On**  
  **Why not just pick a decision rule?**  
  Adopting \(\Gamma\)-maximin resolves *how* to decide but not *what* the model expresses. The collapse question asks whether two agents—one imprecise, one sharp—can behave identically *regardless* of decision rule. If a sharp agent replicates \(\Gamma\)-maximin behavior via higher-order uncertainty, the rule itself doesn’t justify imprecision.  

  **Is this just higher-order evidence (HOE) redux?**  
  HOE debates ask whether self-doubt requires modeling tools beyond sharp credence. Here, we *grant* the sharp agent HOE (via \(\mathcal{X}\)) and test if it *suffices* to mimic imprecision. This is strictly harder: If HOE-rich sharp agents still cannot replicate credal sets, imprecision adds something new; if they can, HOE absorbs the work of "unspecific evidence."  

  ---  

  #### 6. **Feasibility and Scope Management**  
  **Why 6 months is viable**:  
  - Static equivalence is straightforward (Month 2).  
  - Dynamic protocols exist for dilation (Augustin et al. 2014); I’ll adapt these.  
  - Target: One robust counterexample/replication (Month 5), not exhaustiveness.  

  **Risks and cuts**:  
  - **Risk**: Infinite spaces complicate equivalence. **Cut**: Restrict to finite \(\Omega\) and discrete \(\mathcal{X}\).  
  - **Risk**: Tier 3 (counterfactuals) is intractable. **Cut**: Settle for actual evidence responses (tier 2) and note tier 3 as future work.  
  - **Fallback outcome**: A taxonomy of which credal set features *provably* collapse and which resist, even if incomplete.  

  ---  

  #### 7. **Conclusion**  
  This project refocuses the imprecise credence debate from "Is it rational?" to "Is it real?" By systematically probing the collapse question—using static/dynamic equivalence criteria and embracing challenges like dilation—we will either:  
  1. Expose credal sets as notational variants of sharp models with higher-order uncertainty, forcing advocates to new justifications, or  
  2. Isolate their irreproducible behaviors, clarifying what "unspecific evidence" distinctively contributes.  
  Both outcomes advance formal epistemology: one by simplification, the other by explication.  

  ---  
  **References** (to be added by applicant)  
  *Key names: Elga, Seidenfeld, Joyce, Walley, Augustin, Schervish.*
