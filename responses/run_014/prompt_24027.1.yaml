answer: |-
  ### Step-by-Step Audit Procedure for Constructive Validity

  **Overview**: This procedure checks for adherence to intuitionistic principles: no unrestricted Law of Excluded Middle (LEM), existence claims require explicit constructions, and avoidance of non-constructive choice principles. Steps 1–6 are sequential; if any step fails, terminate early. Steps take ~1 hour total per paper.  
  **Output**: Exactly one of:  
  - **Accept** (proof constructive),  
  - **Reject** (non-constructive, unfixable),  
  - **Refer to editor** (ambiguous policy or fixable issue).

  ---

  **Procedure Steps**:  
  1. **Scan for explicit non-constructive tools** (Mechanical + Judgment)  
     - *Ask*: Does the proof use LEM, "without loss of generality" over non-decidable properties, or axioms (e.g., full Axiom of Choice)?  
     - *Sufficient answer*: Absence of these, or LEM restricted to decidable predicates (e.g., integers).  
     - *Bad answer*: Unrestricted LEM or choice → **Reject**.  

  2. **Existence claims** (Judgment)  
     - *Ask*: Is every existence claim ("there exists c") backed by a direct construction or algorithm?  
     - *Sufficient answer*: Witness is computable from given data (e.g., via a procedure).  
     - *Bad answer*: Witness inferred indirectly (e.g., contradiction, LEM) → **Reject**.  

  3. **Proof by contradiction** (Judgment)  
     - *Ask*: Is contradiction used to prove a **positive** statement (e.g., existence, disjunction)?  
     - *Sufficient answer*: Contradiction only used for **negative** statements (e.g., "¬P").  
     - *Bad answer*: Contradiction proves existence → **Reject**.  

  4. **Case splits** (Judgment)  
     - *Ask*: Are case splits (e.g., "if P, then ...; else ...") on a **decidable** predicate?  
     - *Sufficient answer*: Predicate is computable (e.g., "n even/odd", "x < y" for rationals).  
     - *Bad answer*: Split on non-decidable predicate (e.g., "f(c) = 0" for real-valued f) → **Reject**.  

  5. **Choice principles** (Judgment)  
     - *Ask*: Does the proof invoke choice (e.g., "choose x such that P(x)")?  
     - *Sufficient answer*: Countable or dependent choice (if journal policy allows), with constructive justification.  
     - *Bad answer*: Unrestricted choice or no justification → **Reject**.  
