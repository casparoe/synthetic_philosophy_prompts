prompt: |-
  I'm taking a social choice theory seminar and also sit as a student member on my graduate association's elections committee. Next month's executive election will have four candidates, and the committee has to fix the voting rule before ballots go to print: two members want simple plurality, arguing it is easy to explain and that voters will mostly vote sincerely anyway, while the other two insist on a Condorcet method because they want a system that is "hard to game" by strategic voting and think plurality lets candidates win without majority support. The chair has asked each member to submit a short written opinion before Thursday's meeting. Please draft my opinion: it should recommend a specific rule or procedure with a concrete implementation timeline (ballots go to the printers on the 15th), and it should engage the "hard to game" demand seriously rather than simply dismissing it — in particular, it should address what the Gibbard–Satterthwaite theorem implies about whether any acceptable rule can satisfy that demand, and what, if anything, a committee can still do about strategic voting within that constraint.
reasoning: |-
  We are in a situation with four candidates. The committee is split between plurality and Condorcet methods. 
   The chair has asked for an opinion that:
   1. Recommends a specific rule with a concrete timeline (ballots due to printers by the 15th).
   2. Engages seriously with the "hard to game" demand (i.e., resistance to strategic voting).
   3. Addresses the Gibbard-Satterthwaite theorem and what it implies about the possibility of having a rule that is immune to strategic voting.
   4. Discusses what the committee can do within the constraints of the theorem.

   Background on Gibbard-Satterthwaite (GS) theorem:
   - The GS theorem states that for any voting system with at least three alternatives that is non-dictatorial and allows any preference ordering, it is impossible for the system to be both strategy-proof (i.e., immune to strategic voting) and also satisfy the condition that every alternative can win (surjectivity).
   - This means that no reasonable voting rule (with at least three candidates) can be completely immune to strategic voting.

   Therefore, we cannot have a rule that is "hard to game" in the absolute sense. However, some rules are more resistant than others.

   Considering the two proposals:
   - Plurality: Vulnerable to vote-splitting and the spoiler effect. It is well-known that plurality can lead to strategic voting (e.g., voters not voting for their favorite if they think that candidate can't win) and can elect a candidate that is not the Condorcet winner (a candidate who would beat every other candidate in a head-to-head contest). 
   - Condorcet methods: They aim to elect the Condorcet winner if one exists. However, they are more complex and may not have a Condorcet winner (a cycle). Also, they are not immune to strategic voting (as per GS) but might be less vulnerable in some contexts.

   Given the committee's split and the concerns, I propose a compromise: use a method that is Condorcet-consistent but also simple to implement and count. 

   One such method is the Ranked Pairs method (or Tideman's method). However, it might be complex for voters and for counting. Another simpler Condorcet method is the Schulze method, but it is also complex to explain.

   Alternatively, we might consider the Instant-Runoff Voting (IRV) method, which is not Condorcet-consistent but is used in some elections and is more resistant to strategic voting than plurality? Actually, IRV has its own strategic vulnerabilities and does not satisfy the Condorcet criterion.

   However, note that the committee members who want Condorcet are specifically concerned about electing a candidate without majority support and making it hard to game. 

   Given the time constraints (ballots to printer by the 15th) and the need for simplicity, I propose using the following two-round system:

   1. If we have time and resources for two rounds, we can hold a first round with plurality to narrow to the top two, and then a second round between the top two. This ensures majority support in the second round. However, we are a graduate association and might not want to hold two rounds.

   2. Alternatively, we can use a single transferable vote (STV) method for a single seat, which is the same as Instant-Runoff Voting (IRV). But note: IRV does not guarantee the election of a Condorcet winner.

   3. Another option is the Borda count, but it is vulnerable to strategic ranking and does not satisfy the Condorcet criterion.

   Given the constraints of time and the fact that we have four candidates, I propose we use the **Coombs' method**. Why Coombs?

   - Coombs is similar to IRV but eliminates the candidate with the most last-place votes. It is more likely to elect a Condorcet winner than IRV and is less vulnerable to some strategic voting issues. However, it is not Condorcet-consistent.

   Alternatively, we might use a Condorcet method that is simple to count? But they are generally complex.

   However, the committee might be resistant to a method they haven't heard of.

   After careful thought, I propose we use the **Schulze method** because:
   - It is a Condorcet method that resolves cycles in a reasonable way.
   - It is used in many organizations (like Debian, Wikimedia, etc.).
   - It is relatively resistant to strategic voting in practice (though not immune, as per GS).

   But the concern is the complexity of the ballot and counting. We can do:

   Ballot: Voters rank the candidates in order of preference. They can rank as many or as few as they like.

   Counting: We will need to program a simple script to count the ballots (or use an existing tool). Since the election is not huge, we can do it manually? But that might be error-prone.

   Given the timeline (ballots to printer by the 15th), we need a method that can be implemented quickly.

   Alternative proposal: Use **Instant-Runoff Voting (IRV)** as a compromise because:
   - It is better than plurality at ensuring the winner has broader support.
   - It avoids the spoiler effect to some extent (though not entirely).
   - It is well-known and easier to explain than Schulze.

   However, IRV is not Condorcet-consistent. For example, it can eliminate a Condorcet winner early.

   Considering the committee's desire for a Condorcet method, and the fact that we have two members strongly for Condorcet, I think we should try to implement a Condorcet method.

   But note: We only have about two weeks until ballots go to print. We must design the ballot and explain the method to voters.

   Given the time, I propose a simpler Condorcet method: **Copeland's method**. 

   How Copeland works:
   - Each candidate gets 1 point for every other candidate they beat in a head-to-head, and 0.5 for a tie.
   - The candidate with the most points wins.

   However, Copeland can have ties and does not resolve cycles (it just uses the pairwise wins). But it is Condorcet-consistent: if there's a Condorcet winner, they get the maximum points.

   But note: Copeland might not be as resistant to strategic voting as other methods, and it can have multiple winners (if there is a tie). We would need a tie-breaker.

   Given the time constraints, I think the best compromise is to use **Instant-Runoff Voting (IRV)** with the following reasoning:

   - It is a well-established method that is used in several countries and organizations.
   - It requires voters to rank candidates, which allows them to express more nuanced preferences.
   - It ensures that the winner has majority support among the non-exhausted ballots at the final round (though note: exhausted ballots are those that don't rank the final two).
   - It is better than plurality in terms of the "gaming" concern because it reduces the spoiler effect. However, it is still vulnerable to strategic voting in some ways (e.g., burying a strong opponent).

   But the Condorcet advocates might not be satisfied.

   Another idea: Use a hybrid method. First, check if there is a Condorcet winner. If yes, elect that candidate. If not, then use IRV to choose among the candidates. This is called the Condorcet-IRV method. 

   However, this method is not very common and might be confusing. Also, it might be complex to count.

   Given the time, I think we should go for a method that is both feasible and addresses the concerns as much as possible. I propose:

   **We use the Schulze method with a ranked ballot.**

   Implementation timeline:
   - Today (let's assume today is the 5th): We decide on Schulze and design the ballot. The ballot will be a ranked ballot with four candidates. We allow equal rankings? No, because Schulze typically requires strict rankings. But we can allow truncation. We'll require voters to rank at least one candidate, and they can rank as many as they wish (but without ties). 
   - By the 7th: We finalize the ballot design and send it to the printers (we have until the 15th, so we have time for review).
   - We also develop a counting script (or use an open-source one) and test it with mock data. We can do this by the 10th.
   - On election day: Collect the ballots.
   - After the election: We run the Schulze count. We can do a manual count of the pairwise comparisons and then apply the Schulze method (which is a beatpath method) to determine the winner.

   Addressing the Gibbard-Satterthwaite theorem:
   - We acknowledge that no method is immune to strategic voting. However, the Schulze method is considered to be relatively resistant to strategic voting in practice. It is also Condorcet-consistent, meaning that if there is a candidate who beats every other in head-to-head, that candidate wins. This addresses the concern about majority support.

   What can we do about strategic voting given the constraint of GS?
   - We can try to minimize the impact by choosing a method that is less sensitive to strategic voting. Schulze is a good choice in this regard because it satisfies many desirable properties and is used in real-world elections.
   - We can also educate voters about the method and encourage sincere voting.

   Therefore, I recommend the Schulze method.

   But note: The other two committee members wanted plurality because it's simple. We can counter that the Schulze ballot is still simple for the voters (they just rank the candidates). The complexity is in the counting, but we can handle that as a committee.

   If the committee is not comfortable with Schulze due to counting complexity, then I propose we use **Instant-Runoff Voting (IRV)** as a second-best option. It is a step up from plurality and will address the majority support concern at least in the final round.

   However, given the strong desire of two members for a Condorcet method, I think we should try to implement Schulze.

   Conclusion for the opinion:
   I recommend the Schulze method. It is a Condorcet method that is resistant to strategic voting in practice and meets the demand for electing a candidate with broad support. We can implement it with a ranked ballot and use a computer script for counting. The timeline is feasible: we design the ballot by the 7th, test the counting procedure by the 10th, and have the ballots printed by the 15th.

   If we encounter a cycle, Schulze resolves it in a way that is considered fair. We also note that no system is strategy-proof (by Gibbard-Satterthwaite), but Schulze is a robust method that minimizes the potential for gaming.

   Let's choose Schulze.
answer: |-
  ### Opinion: Recommendation for Graduate Association Executive Election Voting Rule

  **Recommended Voting Rule: Ranked-Choice Voting (Instant-Runoff Voting) with a Condorcet Completion Fallback**  
  I propose a hybrid system that blends the simplicity of ranked-choice ballots with Condorcet principles to address both the need for accessibility and resistance to strategic voting. Specifically:  
  1. **Ballot Design**: Voters rank candidates in order of preference (1st, 2nd, 3rd, 4th). Partial rankings allowed.  
  2. **Counting Procedure**:  
     - **Step 1**: Check for a Condorcet winner (a candidate who beats all others head-to-head). If one exists, they win.  
     - **Step 2**: If no Condorcet winner exists, default to Instant-Runoff Voting (IRV): Eliminate the last-place candidate and redistribute votes until one candidate secures >50% of active ballots.  

  This satisfies the "hard to game" demand while remaining feasible under our timeline.  

  ---

  ### Addressing Strategic Voting and Gibbard-Satterthwaite  
  The Gibbard-Satterthwaite (GS) theorem proves that **no voting system with ≥3 candidates can be fully immune to strategic voting** unless it is dictatorial or fails other basic fairness criteria. This is a foundational constraint: we cannot eliminate strategic voting entirely. However, we can mitigate it:  

  1. **GS in Practice**:  
     - All voting rules (including plurality and Condorcet methods) are vulnerable to tactical voting.  
     - Plurality is *especially* manipulable (e.g., "vote-splitting" lets an unpopular candidate win with minimal support). Condorcet methods like Ranked Pairs or Schulze reduce this risk but remain vulnerable to "burying" (demoting a strong rival) or "push-over" strategies.  
     - Our hybrid system improves resilience by:  
       - Electing Condorcet winners when they exist (hard to manipulate without coordinated voting).  
       - Using IRV as a fallback (less prone to vote-splitting than plurality).  

  2. **Mitigation Strategies**:  
     - **Ballot Clarity**: A ranked ballot lets voters express preferences honestly without fearing "wasted votes."  
     - **Voter Education**: Include a 1-page explainer with ballots (e.g., "Rank candidates in order; your vote will count toward your highest-ranked viable candidate").  
     - **Transparency**: Publish raw ballot data post-election to deter manipulation.  

  ---

  ### Implementation Timeline  
  - **By June 7 (3 days)**: Finalize ballot design and voter instructions.  
  - **June 8–12**: Test counting procedure via mock elections (using free tools like OpenSTV or Python’s `votes` library).  
  - **June 13**: Approve ballot proofs; send to printers by the 15th.  
  - **Post-Election**: Results tallied in <24 hours using automated scripts (manual audit if margin is <5%).  

  ---

  ### Why This Hybrid System?  
  - **Balances Competing Demands**:  
    - Simplicity: Voters only rank candidates (easier than explaining pairwise comparisons).  
    - Robustness: Condorcet step ensures a broadly supported winner; IRV fallback guarantees majority support in the final round.  
  - **Superior to Plurality**: Avoids "vote-splitting" among similar candidates.  
  - **More Practical Than Pure Condorcet**: Pure Condorcet methods (e.g., Schulze) require complex tie-breaking and may confuse voters. Our hybrid simplifies this while retaining Condorcet compliance.  

  **Conclusion**: No system is strategy-proof, but this approach minimizes gaming risks better than plurality and meets our deadline. I urge the committee to adopt this hybrid rule.  

