  **Defended criterion:** Two circuits are the same mechanism if they decompose into the same set of functional roles with identical causal connectivity, and for every intervention targeting any role (or edge between roles), the effect on task output is indistinguishable.

  ### (a) Criterion Specification
  - **Structure preserved:** A directed graph where nodes are functional roles (e.g., "prefix-matcher", "copier") and edges indicate information flow. Roles must be defined by their computational purpose (e.g., "outputs token probabilities").
  - **Map requirements:** A bijection between roles preserving:
    - Function (e.g., "prefix-matcher" must map to "prefix-matcher").
    - Causal connectivity (if role A feeds role B in one circuit, it must in the other).
  - **Intervention match:** For every basis intervention applied to a role or edge in one circuit, the corresponding intervention (via the map) in the other must yield identical task output. Basis interventions include:
    - Role ablation (zero out all outputs of the role).
    - Role patching (overwrite the role's output with values from a different run).
    - Edge patching (overwrite inputs to a role from a specific upstream role).
  - **Incomplete libraries:** If the intervention library is incomplete, identity is provisional; it holds only over tested interventions. To claim full identity, the basis must cover all roles/edges and distinguish known behavioral differences (e.g., from verdicts 2 and 6).

  ### (b) Verdicts Under This Criterion
  - **Verdict 1 (small vs. large induction):** Same. Roles: "prefix-matcher" and "copier". Connectivity: prefix-matcher → copier. Interventions on roles (e.g., ablating prefix-matcher) match.
  - **Verdict 2 (lookup table):** Different. Roles: The lookup lacks separable roles (it's one atomic "recaller"), while induction has two. Causally distinct.
