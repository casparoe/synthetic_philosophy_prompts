prompt: |-
  I'm on a small team at an AI lab that has to aggregate different stakeholder preferences into a single objective function for the systems we ship, and right now we justify "sum the utilities" by citing Harsanyi's aggregation theorem, which reviewers keep poking holes in. Write a decision procedure my team can actually run on any proposed aggregation rule before a project lead signs off: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops with "the theorem doesn't reach this," and where it has to hand off to a value judgment because the question is values rather than facts. Three people, one afternoon, no social choice theorist on staff, and be honest about which steps are judgment calls dressed up as procedure -- I dont buy the "it's forced by rationality" story. Then run it on three cases: a clean one where everyone has well-defined expected-utility preferences and the impartiality condition is plausible; one where a stakeholder group's values are incommensurable with the rest so no cardinal utilities exist; and one where the procedure lands on a non-sum rule and we really dont want to hear it. Also keep separate what's settled among people who work on this from what's genuinely contested -- if the theorem isnt a settled proof of utilitarianism, say so plainly.
reasoning: |-
  We are designing a decision procedure for the team to evaluate any proposed aggregation rule for stakeholder preferences. The goal is to have a systematic way to check the conditions under which Harsanyi's theorem applies, and to identify when we step outside those conditions and must rely on value judgments.

  Harsanyi's Aggregation Theorem: 
  - If all individuals and the social planner have preferences that satisfy the von Neumann-Morgenstern (vNM) axioms (i.e., they are expected utility maximizers) and the social preference satisfies the Pareto principle (if everyone weakly prefers A to B, then society weakly prefers A to B), then the social welfare function must be a weighted sum of individual utilities. If we also impose an impartiality condition (that the social welfare function is symmetric in individuals), then we get a simple sum.

  However, we know that the theorem has assumptions that may not hold in practice. Our procedure will be a checklist of questions to ask about the aggregation context.

  **Decision Procedure: Questions to Ask in Order**

  1. **Do all stakeholders have preferences that satisfy the vNM axioms (or can be represented by cardinal utilities)?**
     - *What to check:* For each stakeholder, can we model their preferences over lotteries (i.e., uncertain prospects) as maximizing the expected value of a utility function? This requires that preferences are complete, transitive, continuous, and satisfy the independence axiom.
     - *Sufficient answer:* If for every stakeholder we can assign a utility function such that they prefer lottery A to B if and only if the expected utility of A is greater than B, then the answer is yes. If we cannot (e.g., because of violations of independence or because preferences are not well-defined over lotteries), then no.
     - *If no:* The theorem does not apply. We note that we are outside the scope and move to step 2. If we are in a context without uncertainty, we might still use cardinal utilities, but the theorem's justification is weakened.
     - *Judgment call:* In practice, we might accept a cardinal utility representation even if it's not strictly vNM if the stakeholder can assign consistent cardinal scores. But this is a judgment.

  2. **Is the social planner's preference required to satisfy the vNM axioms?**
     - *What to check:* We are building a social objective function that must guide choices in uncertain situations. The planner must be able to compare lotteries over social outcomes. We require that the social preference is complete, transitive, continuous, and satisfies the independence axiom over lotteries of social outcomes.
     - *Sufficient answer:* If we are designing a system that must make decisions under uncertainty and we want the social objective to be consistent in the same way an individual's utility function is, then we require this. If we don't need to handle uncertainty, then we might not require it. But note: without it, we cannot apply the theorem.
     - *If no:* The theorem does not apply. We note that we are outside the scope and move to step 3.

  3. **Does the Pareto principle hold?**
     - *What to check:* If every stakeholder weakly prefers outcome A to outcome B, then the social planner must also weakly prefer A to B. This is a minimal requirement for respecting individual preferences.
     - *Sufficient answer:* If we are committed to respecting unanimous stakeholder preferences, then yes. If there are reasons to override unanimous preferences (e.g., due to externalities not captured by the stakeholders, or because of concerns for future generations not represented), then no.
     - *If no:* The theorem does not apply. We note that we are outside the scope and move to step 4.

  4. **Do we require impartiality?**
     - *What to check:* Should the social welfare function treat all stakeholders symmetrically? That is, if we permute the utility levels of the stakeholders, the social welfare should remain the same.
     - *Sufficient answer:* If we believe that each stakeholder should count equally, then yes. If we have reasons to give different weights (e.g., because some stakeholders are more affected, or because of prioritarian reasons), then no.
     - *If yes and we have passed steps 1-3:* Then the theorem implies that the social welfare function must be the sum of utilities. We stop and use the sum.
     - *If no but we have passed steps 1-3:* Then the theorem implies a weighted sum, and we must assign weights. How to assign weights is a value judgment.

  **When the Theorem Doesn't Apply: Handling Other Cases**

  If at any step 1, 2, or 3 we get a "no", then the theorem does not force a sum (or a weighted sum). We then have to consider:

  5. **Can we approximate the context as one with cardinal utilities and vNM preferences?**
     - *Judgment call:* Even if we don't have perfect vNM preferences, we might decide to use a cardinal utility representation for practical reasons. We might use a method (like the standard gamble) to elicit cardinal utilities, or we might use a scoring rule. But this is a judgment call because the theorem doesn't back it.

  6. **What aggregation rule are we proposing?**
     - Now we must design an aggregation rule without the theorem's backing. We might consider:
          - A sum of utilities if we still want to try to use the theorem as inspiration.
          - A different rule (e.g., prioritarianism: sum of a concave transformation of utilities; or leximin; or a Nash product).
     - *Value judgment required:* The choice of rule must be justified by ethical considerations. We must ask: what are our core values? Equality? Efficiency? Respecting rights? We might run a deliberation among the team and stakeholders.

  7. **Does the proposed rule satisfy minimal rationality conditions?**
     - We should check that the rule does not lead to cyclic social preferences (if we are in a deterministic context) or that it can handle uncertainty in a consistent way (if needed). This step is about avoiding obvious inconsistencies.

  **Where the Procedure Stops and Hands Off to Value Judgments**

  - Steps 1, 2, 3: If the answer is no, we leave the realm of the theorem. We then have to make a judgment about whether to force a cardinal representation (step 5) or choose an aggregation rule (step 6). These are judgment calls.
  - Step 4: The choice of symmetry (impartiality) is a value judgment. The theorem does not force impartiality; without it, we get a weighted sum and the weights are a value judgment.
  - Step 6: Entirely a value judgment.

  **The Three Cases**

  Let's run the procedure on three cases.

  **Case 1: Clean Case (Well-defined EU preferences, impartiality plausible)**
  - Stakeholders: All have vNM preferences. We can assign cardinal utilities.
  - Social planner: Must make decisions under uncertainty, so we require vNM preferences for the planner.
  - Pareto principle: We accept it.
  - Impartiality: We require it (each stakeholder counts equally).
  - *Procedure outcome:* By step 4, we require the sum of utilities. The theorem applies and forces the sum.

  **Case 2: Incommensurable Values (No cardinal utilities for one group)**
  - One stakeholder group (say, environmentalists) has values that are not representable by a cardinal utility function. For example, they might have lexical preferences (e.g., avoid extinction at all costs, and then within that, maximize biodiversity) that violate the independence axiom.
  - Steps:
      - Step 1: We find that not all stakeholders have vNM preferences (the environmentalists do not). So the theorem does not apply.
      - We then go to step 5: We might try to approximate? But the incommensurability is severe. We decide that we cannot force a cardinal representation for the environmentalists without distorting their values.
      - Step 6: We must choose an aggregation rule. We might consider:
          - A multi-objective approach: treat environmental objectives and others as separate dimensions and then look for Pareto improvements, but that might not give a complete ordering.
          - A constraint: first satisfy the environmentalists' minimal requirements (no extinction) and then maximize the sum of utilities of the other stakeholders? But how to set the constraint? Value judgment.
          - Or, we might use a weighted sum but assign a very high weight to the environmentalists' goal? But that's arbitrary.
      - Step 7: We must check that the rule we choose is consistent. For example, if we use a constraint, then we must ensure that it doesn't lead to cycles or inconsistencies in decision making.
  - *Outcome:* We end up with a non-sum rule (like a constraint or a lexicographic ordering) and the choice is based on value judgments.

  **Case 3: Non-Sum Rule and We Don't Want to Hear It**
  - Suppose we have a case where the theorem technically applies (steps 1-3 are satisfied) but we don't require impartiality (step 4: no). Then the theorem says we must use a weighted sum. But the team might want to use a different rule, say, the product of utilities (Nash product) because they care about relative gains and fairness.
  - Steps:
      - Step 1: Yes, vNM preferences.
      - Step 2: Yes, the planner must handle uncertainty.
      - Step 3: Yes, Pareto principle holds.
      - Step 4: We are asked if we require impartiality. The team says no because they think that the Nash product (which is equivalent to the sum of log utilities) is fairer. But note: the theorem forces a weighted sum. The Nash product is a weighted sum of logs, which is not linear. So it violates the vNM axioms for the social planner? 
          - Actually, the Nash product is not linear in probabilities. It is a different functional form. Therefore, it would not satisfy the independence axiom for the social planner. So step 2 would fail? Let's check:
              - The social welfare function W = ∏ u_i is not linear in probabilities. For example, consider two lotteries: 
                  Lottery A: outcome x with probability 1.
                  Lottery B: outcome y with probability 1.
                  Lottery C: 50% chance of x and 50% chance of y.
              - The Nash product of C is ∏ u_i(C) = ∏ (0.5 u_i(x) + 0.5 u_i(y)) which is not 0.5 * (∏ u_i(x)) + 0.5 * (∏ u_i(y)). So the social welfare of a lottery is not the expected value of the Nash product of the outcomes. Therefore, the social preference represented by the Nash product is not vNM.
      - Hence, if we require step 2 (that the social planner must have vNM preferences), then the Nash product is ruled out. But if we drop step 2, then we are outside the theorem. So the team must decide: do we require the social planner to have vNM preferences? If we do, then we cannot use the Nash product. If we do not, then we can consider it, but then we must justify why we are dropping the requirement for vNM at the social level (which is a value judgment).
  - *Outcome:* The team might decide to drop the vNM requirement for the social planner and use the Nash product. But then they must be aware that the planner's decisions under uncertainty might be inconsistent (e.g., violate independence). This is a judgment call.

  **Clarification on the Theorem**

  The theorem is a mathematical result: under the assumptions (vNM for all individuals and the social planner, plus Pareto), the social welfare function is linear (weighted sum) in individual utilities. However, it is not a settled proof of utilitarianism because:
  - The assumptions are strong and may not hold in reality.
  - The requirement of vNM preferences for the social planner is a substantive requirement of rationality that might be challenged (as in Case 3).
  - The impartiality condition (for the simple sum) is an ethical assumption.

  In summary, our procedure helps us identify when the theorem applies and when we are in the realm of value judgments. We must be honest that steps 1, 2, and 3 are often not satisfied in practice, and then we must make judgments.
answer: |-
  Below is a decision procedure for your team to evaluate proposed preference aggregation rules, designed for a 3-person team in one afternoon. The procedure is structured as a checklist of questions to ask in sequence. It explicitly separates **fact-based checks** (grounded in Harsanyi's theorem and decision theory) from **value judgments** (where assumptions fail or ethics dominate). I'll first outline the procedure, then apply it to your three cases.  

  ---

  ### **Decision Procedure: Aggregation Rule Evaluation**  
  **Time:** 3 people, 1 afternoon.  
  **Input:** Proposed aggregation rule, stakeholder preference data.  
  **Output:** Greenlight ("use sum"), Yellowlight ("use non-sum, but justified"), or Redlight ("hand off to values").  
  **Core Principle:** Harsanyi’s theorem only endorses summing utilities if all assumptions hold. Where they fail, the theorem is silent.  

  #### **Question 1: Can all stakeholders express *cardinal* utilities?**  
  - **Check:** Do stakeholders have:  
    - Complete, transitive preferences?  
    - Rational preferences over lotteries (satisfy von Neumann-Morgenstern axioms)?  
    - Measurable "intensity" of preferences (e.g., "I prefer A over B twice as much as C over D")?  
  - **Sufficient answer:** Yes, if preference data allows mapping outcomes to numerical utilities (unique up to affine transformations).  
  - **If NO:**  
    - **Stop Harsanyi.** Note: "Theorem doesn’t reach this."  
    - **Hand off to values:** Skip to Question 4.  
  - **Judgment call?** Yes. Eliciting cardinal utilities often requires subjective scoring (e.g., 0–100 scales) or lottery questions. What counts as "sufficient" cardinality is team-agreed.  

  #### **Question 2: Is the aggregation *Pareto-respecting* and *vNM-rational*?**  
  - **Check:**  
    - *Pareto:* If all stakeholders prefer outcome A to B, does the rule rank A above B?  
    - *vNM-rational:* Does the rule yield consistent, transitive preferences over *lotteries* (not just deterministic outcomes)?  
  - **Sufficient answer:**  
    - Pareto: Unanimous "yes" from stakeholders.  
    - vNM: Aggregation preserves independence axiom (e.g., if \( A \succ B \), then \( \text{lottery}(A,C) \succ \text{lottery}(B,C) \)).  
  - **If NO to either:**  
    - **Stop Harsanyi.** Note: "Theorem doesn’t apply."  
    - **Hand off to values:** Proceed to Question 4.  
  - **Judgment call?** Pareto is usually non-negotiable. vNM-rationality is a team choice: if your AI won’t face uncertainty (e.g., no probabilistic outcomes), skip vNM.  

  #### **Question 3: Is *impartiality* (equal weighting) justified?**  
  - **Check:** Do stakeholders have symmetric moral claims? (e.g., no power imbalances, urgency, or historical inequities).  
  - **Sufficient answer:** Yes, if all stakeholders are peers with equal stakes (e.g., identical users in a recommender system).  
  - **If NO:**  
    - **Theorem output:** Weighted sum (not simple sum). Weights require ethical justification.  
    - **Hand off to values:** Proceed to Question 4 to assign weights.  
  - **Judgment call?** Entirely values-based. "Equal moral claims" is a philosophical stance.  

  #### **Question 4: What values justify deviations from Harsanyi?**  
  - **Use if:** Any prior step stopped Harsanyi.  
  - **Check:**  
    - What ethical principles override the theorem? (e.g., fairness, rights, risk-aversion).  
    - Does the proposed rule satisfy minimal rationality? (e.g., no cycles, handles uncertainty coherently).  
  - **Output:**  
    - **Greenlight:** If Harsanyi passed all steps → use **sum** (or **weighted sum** if Question 3 failed).  
    - **Yellowlight:** If Harsanyi failed but the rule aligns with team/stakeholder values → use **non-sum rule** (e.g., max-min, Nash product).  
    - **Redlight:** If values conflict or rationality fails → escalate to leadership.  
  - **Judgment call?** Entirely values-based. This step is ethical deliberation, not math.  

  ---

  ### **Applying the Procedure to Three Cases**  
  #### **Case 1: Clean Case (Sum Applies)**  
  - **Context:** 10 users with well-defined EU preferences (e.g., choosing server allocation). All vNM-rational, no power imbalances.  
  - **Procedure:**  
    1. **Q1:** Stakeholders provide cardinal utilities via lottery questions → **Yes**.  
    2. **Q2:** Pareto and vNM hold → **Yes**.  
    3. **Q3:** All users symmetric → **Yes** (impartiality).  
    4. **Q4:** N/A (Harsanyi applies).  
  - **Output:** Greenlight → **Sum utilities**.  
  - **Why settled?** Harsanyi’s assumptions hold; sum is theorem-backed.  

  #### **Case 2: Incommensurable Values (Non-Sum Rule)**  
  - **Context:** 3 stakeholders:  
    - Group A: Profit-maximizing (cardinal utilities).  
    - Group B: Environmentalists (lexical preferences: "No habitat loss > everything else").  
  - **Procedure:**  
    1. **Q1:** Group B’s preferences violate vNM axioms (no trade-offs between habitat/other values) → **No**.  
       - *Stop Harsanyi*. Hand off to values.  
    2. **Q4 (values):**  
       - Team agrees: Environmental constraints are non-negotiable.  
       - Proposed rule: Maximize profit *subject to* habitat loss ≤ threshold.  
       - Minimal rationality: Coherent under uncertainty (e.g., thresholds apply to lotteries).  
  - **Output:** Yellowlight → **Non-sum rule** (constrained optimization).  
  - **Why contested?** No theorem forces this. Values (e.g., "nature has intrinsic worth") dominate.  

  #### **Case 3: Non-Sum Rule (And We Don’t Want to Hear It)**  
  - **Context:** 4 stakeholders with cardinal utilities, but team wants to use **Nash product** (maximize \(\prod u_i\)) for "fairness."  
  - **Procedure:**  
    1. **Q1:** All cardinal → **Yes**.  
    2. **Q2:** Pareto holds. vNM fails: Nash product violates independence axiom!  
       - *Example:* Let \( u_A = [2, 1] \), \( u_B = [1, 2] \).  
         - Outcome 1: \((2,1)\) → product \(=2\).  
         - Outcome 2: \((1,2)\) → product \(=2\).  
         - Lottery: 50% chance of each → expected product \(= 2\), but *product of expected utilities* \(= (1.5)(1.5)=2.25\).  
       - → **No** (vNM fails).  
    3. **Q4 (values):**  
       - Team insists: "Fairness matters more than vNM-rationality."  
       - Proposed rule: Nash product.  
       - Check rationality: No cycles, but inconsistent under uncertainty (as above).  
  - **Output:** Yellowlight → **Non-sum rule** (Nash product), but warn:  
    > "This violates vNM-rationality. Under uncertainty, choices may be incoherent. Value judgment overrides theorem."  
  - **Why contested?** Harsanyi’s rationality assumptions are rejected for ethical reasons.  

  ---

  ### **Key Notes**  
  - **Harsanyi’s theorem is not settled utilitarianism:** It assumes vNM-rationality *at the social level*—a hotly contested requirement. Many ethicists reject it (e.g., Rawlsians). The theorem is math, not moral philosophy.  
  - **Judgment calls:**  
    - Cardinal utility elicitation (Q1) is often subjective.  
    - Impartiality (Q3) and values (Q4) are ethical, not technical.  
  - **When Harsanyi fails:** Own the values debate. Example script:  
    > "The theorem doesn’t apply here because [e.g., utilities aren’t cardinal]. We propose [rule] based on [value], accepting [trade-off]."  
  - **Output clarity:** Use traffic-light labels to force explicit justification for deviations.  

  This procedure avoids false "rationality" claims, isolates value judgments, and respects Harsanyi’s limits. It’s a pragmatic filter—not a theorem replacement.
