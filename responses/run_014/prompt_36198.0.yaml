answer: |-
  Your frustration is spot-on—the vagueness debate *is* stuck, and your AI eval experience reveals why: **the core disagreement isn't about heaps or truth, but about the *metaphysical grounding* of linguistic meaning and the *purpose* of semantic theories.** It's a substantive clash of worldviews masquerading as a technical dispute about borderline cases. Here's the diagnosis:

  ### 1. **The Disagreement is Substantive & Metaphysical (Not Verbal or Empirical)**
     - **Epistemicism** presupposes a **robustly realist metaphysics of language**: Meanings are fixed (even if complex), the world carves reality into precise properties (even if messy), and truth-conditions exist independently of our epistemic access. The "unknowable cutoff" isn't an epicycle—it's a *consequence* of this realism. Bivalence isn't just a logical preference; it's a commitment to language mirroring a determinate (if fine-grained) reality. When your team says "there's a fact of the matter," they're expressing this realist intuition.
     - **Supervaluationism** presupposes a **pragmatic/conventionalist metaphysics of language**: Meanings are fundamentally tools for communication, shaped by use and context. "Precisifications" aren't discovered truths but *stipulations* we make to resolve ambiguity. Denying bivalence at borders isn't a semantic failure—it's *honesty* about how language works. When your team says "define a convention," they're prioritizing utility over ontological commitment.
     - **This is NOT merely about "truth"**: Both theories *can* be formulated with Tarskian truth-predicates. The clash is deeper: *What makes a sentence true?* For epistemicists, it's correspondence to mind-independent, sharp boundaries. For supervaluationists, it's super-truth relative to admissible conventions.

  ### 2. **Why Progress is Paralyzed: Competing Virtues & No Decisive Test**
     - **Epistemicism's strength** is preserving classical logic/bivalence and avoiding "truth-value gaps." Its **fatal flaw** is positing unknowable facts that play no role in linguistic practice (your "fake fact" point). Williamson's margin-for-error is clever but feels like an *excuse* for the theory's counterintuitiveness.
     - **Supervaluationism's strength** is modeling how we *actually handle* vagueness (e.g., context-sensitivity, tolerance). Its **fatal flaw** is higher-order vagueness (when is a precisification "admissible"?) and counterintuitive truth-value assignments ("This is a heap" and "This isn't a heap" both false).
     - **No knockout blow exists** because:
       - **Logic won't decide it**: Epistemicism saves classical logic by sacrificing epistemological naturalness; Supervaluationism sacrifices classical logic for pragmatic fidelity.
       - **Empirical evidence is indirect**: Psycholinguistics might show speakers *behave* like supervaluationists (accepting conventions, tolerating small changes), but epistemicists can dismiss this as performance ≠ competence.
       - **Metaphysical commitments are prior**: Choosing sides often reflects pre-theoretic intuitions about language's relation to reality—not arguments about sand grains.

  ### 3. **Your Working Theory: Close, But Dig Deeper**
  You suspect the debate is about "whether truth is a property of sentences relative to a language or of utterances relative to speakers' commitments." This is insightful but needs refinement:
     - **Epistemicism** *does* treat truth as sentence-relative (to a fixed language with sharp boundaries).
     - **Supervaluationism** treats truth as *context*-relative (via precisifications anchored in speaker conventions).
     - **The deeper divide**: Epistemicists see language as a *static map* of reality; supervaluationists see it as a *dynamic toolset*. Your "speakers' commitments" hints at this—but it's really about **whether meaning is *discovered* (epistemicism) or *negotiated* (supervaluationism)**.

  ### 4. **What Counts as Progress? Moving Beyond the Impasse**
  Forcing a "winner" is futile. Meaningful progress would:
     - **Reframe the debate meta-semantically**: Stop asking "Which theory is right?" and ask **"What do we *want* a theory of vagueness for?"**  
       - *AI Eval Example*: If the goal is **policy decisions** (e.g., "Is this model dangerous?"), supervaluationism wins pragmatically—you *need* conventions and context-sensitive criteria. If the goal is **tracking mind-independent capabilities** (e.g., "Does this model *really* understand?"), epistemicism aligns better (even if we can't measure the cutoff).  
     - **Develop a "Decision-Theoretic" Approach**: Acknowledge both intuitions are useful in different contexts. Formalize how to choose between epistemicist or supervaluationist *framings* based on stakes, error costs, and available evidence.  
       - *Example*: In high-stakes AI safety, adopt supervaluationist conventions for bright-line rules *while recognizing* they're context-bound—but use epistemicist ideals to drive measurement improvements.  
     - **Embrace Pluralism**: Vagueness might be *overdetermined*. Some concepts (e.g., "heap") may be conventional; others (e.g., "conscious") may have hidden cutoffs. The impasse teaches us that **vagueness isn't one problem but a symptom of language's dual nature: both representational and communicative.**

  ### Conclusion: Why Your Team Repeats the Debate & How to Move Forward
  Your AI team isn't arguing about heaps—they're arguing about **how to ground judgments under uncertainty**. The epistemicist instinct reflects a desire for objectivity ("There *must* be an answer"); the supervaluationist instinct reflects pragmatism ("We *need* to decide without perfect knowledge"). 

  **To escape the loop**:  
  1. **Clarify the goal**: Are you seeking metaphysical truth (epistemicism) or actionable consensus (supervaluationism)?  
  2. **Admit the trade-offs**: Precision vs. flexibility, objectivity vs. practicality.  
  3. **Build hybrid frameworks**: Use supervaluationist conventions for binary decisions *while quantifying* uncertainty (e.g., "60% of precisifications classify this as scheming")—this respects epistemicist intuitions without demanding impossible precision.  

  The vagueness wars won't end—but like your team, we can stop fighting and start engineering solutions. The disjunction *is* the insight: Vagueness forces us to confront that language is both a mirror and a hammer. Use the right tool for the job.
