     B) Meaningless unless she deemed it important.  
     C) Data about her body, not her self.  

  6. **Vera’s diary shows shifting political views. What does this inconsistency imply?**  
     A) Growth: her self evolved through time.  
     B) No fixed self: she was a series of "selves."  
     C) A character flaw.  

  7. **The memoir calls Vera "resilient"; her diary expresses despair. Which reveals her true emotional state?**  
     A) The diary: her private voice is authoritative.  
     B) The memoir: others see us objectively.  
     C) Neither: emotions are fleeting states.  

  8. **Vera’s deposition includes a self-damning statement. Why would she say this?**  
     A) Honesty defines her, even against her interests.  
     B) Legal pressure overrode her true self.  
     C) It was a situational response.  

  9. **The book ends with the dossier—raw data without narrative. What does this final document achieve?**  
     A) Shows the objective truth of Vera’s life.  
