  ### **Diagnostic Quiz**  
  Answer based on intuition about Vera’s documents alone.  

  1. **Vera’s diary describes a childhood event vividly. In her deposition, she denies it happened. How do you resolve this?**  
     A) Trust the diary: it captures her private truth.  
     B) Trust the deposition: legal pressure forces honesty.  
     C) Neither: both reflect transient moments.  

  2. **Vera’s sister calls her "generous" in the memoir. The dossier shows Vera rarely donated money. What matters more?**  
     A) The sister’s judgment: it defines Vera’s character.  
     B) The dossier: facts override interpretations.  
     C) Both: generosity isn’t just about money.  

  3. **Vera’s diary plans a career change she never pursued. Does this plan reveal "who she was"?**  
     A) Yes: aspirations shape identity.  
     B) Only if acted upon; otherwise, it’s noise.  
     C) It reveals a passing thought, not her self.  

  4. **In her deposition, Vera confesses to a harmful act she hid in her diary. How significant is this confession?**  
     A) Crucial: it shows accountability, core to her self.  
     B) Distorted: legal coercion masks her true self.  
     C) Just one event among many.  

  5. **The dossier reveals Vera took daily walks she never mentioned in her diary. What does this habit signify?**  
