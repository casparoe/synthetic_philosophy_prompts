answer: |-
  Below is a concrete example where acquiring information lowers the decision-maker's expected utility, violating an assumption of Good's theorem. The violation occurs because the **set of available actions depends on the signal observed**, which contradicts the theorem's implicit requirement that the action set is fixed and independent of the signal. Good's theorem assumes that the decision-maker can freely choose any action from a fixed set \( \mathcal{A} \) regardless of the signal. When actions are constrained by the signal, the theorem no longer holds.

  ### Example: Constrained Actions After Signal Observation
  **States of the world (\( \theta \))**:  
  - \( \theta_1 \): State 1 (prior probability \( P(\theta_1) = 0.5 \))  
  - \( \theta_2 \): State 2 (prior probability \( P(\theta_2) = 0.5 \))  

  **Signal (\( s \)) and its distribution**:  
  - \( s_1 \) or \( s_2 \) (perfectly informative signal):  
    - \( P(s_1 | \theta_1) = 1 \), \( P(s_2 | \theta_1) = 0 \)  
    - \( P(s_1 | \theta_2) = 0 \), \( P(s_2 | \theta_2) = 1 \)  

  **Actions and availability**:  
  - Without signal: Decision-maker chooses from \( \mathcal{A}_0 = \{a_1, a_2, a_3\} \).  
  - With signal:  
    - After \( s_1 \), **only \( a_1 \) is available** (action set = \( \{a_1\} \)).  
    - After \( s_2 \), **only \( a_2 \) is available** (action set = \( \{a_2\} \)).  
  - *Key violation*: Action \( a_3 \) is **unavailable** after observing any signal.  

  **Utility function \( u(\theta, a) \) (risk-neutral, state-dependent)**:  
  |          | \( \theta_1 \) | \( \theta_2 \) |  
  |----------|---------------|---------------|  
  | \( a_1 \) | 0.4           | 0             |  
  | \( a_2 \) | 0             | 0.4           |  
  | \( a_3 \) | 0.6           | 0.6           |  

  ---

  ### Expected Utility Calculation
  **1. Expected utility *without* signal (chooses from \( \mathcal{A}_0 = \{a_1, a_2, a_3\} \))**:  
  - \( \mathbb{E}[u(a_1)] = P(\theta_1)u(\theta_1, a_1) + P(\theta_2)u(\theta_2, a_1) = (0.5 \times 0.4) + (0.5 \times 0) = 0.2 \)  
  - \( \mathbb{E}[u(a_2)] = (0.5 \times 0) + (0.5 \times 0.4) = 0.2 \)  
  - \( \mathbb{E}[u(a_3)] = (0.5 \times 0.6) + (0.5 \times 0.6) = 0.6 \)  
  - Optimal action: \( a_3 \) (expected utility = \( 0.6 \)).  

  **2. Expected utility *with* signal (actions constrained by signal)**:  
  - After observing \( s_1 \) (implies \( \theta_1 \)):  
    - Only \( a_1 \) available → utility = \( u(\theta_1, a_1) = 0.4 \).  
  - After observing \( s_2 \) (implies \( \theta_2 \)):  
    - Only \( a_2 \) available → utility = \( u(\theta_2, a_2) = 0.4 \).  
  - **Overall expected utility**:  
    \[
    P(s_1) \times 0.4 + P(s_2) \times 0.4 = (0.5 \times 0.4) + (0.5 \times 0.4) = 0.4
    \]  

  **Comparison**:  
  - Expected utility without signal: \( 0.6 \)  
  - Expected utility with signal: \( 0.4 \)  
  - **Change in expected utility**: \( 0.4 - 0.6 = -0.2 \) (negative).  

  ---

  ### Why This Violates Good's Theorem
  Good's theorem assumes:  
  1. The decision-maker updates beliefs via Bayes' rule (satisfied here).  
  2. The decision-maker is risk-neutral and maximizes expected utility (satisfied).  
  3. **The set of available actions \( \mathcal{A} \) is fixed and independent of the signal** (violated).  

  In this example, the action set changes with the signal:  
  - Without signal: Full set \( \{a_1, a_2, a_3\} \).  
  - With signal: Restricted to \( \{a_1\} \) or \( \{a_2\} \), excluding \( a_3 \).  
  The decision-maker **cannot choose \( a_3 \) after observing the signal**, even though \( a_3 \) is optimal ex ante. This constraint forces a suboptimal choice upon learning \( \theta \), lowering expected utility.  

  ### Why This Is Non-Trivial
  The example is non-trivial because:  
  - The signal is informative (perfectly reveals \( \theta \)).  
  - The decision-maker is rational (updates beliefs and chooses optimally given constraints).  
  - The negative value arises solely from the **loss of flexibility** in actions after observing the signal, not from costs of acquisition.  

  ### Verification of Arithmetic
  1. **Without signal**:  
     - \( \mathbb{E}[u(a_3)] = 0.5 \times 0.6 + 0.5 \times 0.6 = 0.6 \) (optimal).  
  2. **With signal**:  
     - \( s_1 \) (prob. 0.5): utility \( = 0.4 \) (only \( a_1 \) available).  
     - \( s_2 \) (prob. 0.5): utility \( = 0.4 \) (only \( a_2 \) available).  
     - Expected utility \( = 0.5 \times 0.4 + 0.5 \times 0.4 = 0.4 \).  
  3. **Difference**: \( 0.4 - 0.6 = -0.2 \) (negative).  

  ---

  ### Conclusion
  This example demonstrates a negative value of information due to **signal-dependent action constraints**, violating Good's theorem's assumption of a fixed action set. If actions are unconstrained (i.e., \( a_3 \) remains available after the signal), the decision-maker could ignore the signal and still achieve \( 0.6 \), preserving non-negative value. Thus, the theorem holds only when the action set is invariant to the signal.
