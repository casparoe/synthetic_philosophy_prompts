  - Skepticism is idle (2).
  - Ordinary justification is internalist (3).
  - Hinges are inherited (5) and can change (6).
  - Conversion happens (7) and we can say it feels like an improvement to us, but we don't claim it's objectively better? But wait, (8) says there is a fact of the matter.

  Without (4), (8) becomes harder to defend because we cannot point to a particular hinge and say it's wrong. But we might say that the entire hinge-set as a whole is better? But then we need a criterion.

  It seems that (4) is the one that most directly conflicts with the core idea of hinges being beyond justification.

  Therefore, I recommend dropping (4).

