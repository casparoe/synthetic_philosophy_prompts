answer: |-
  ## Research Integrity Appeal Procedure: Framework Incommensurability Claims (Version 1.0)

  **Purpose:** To provide a consistent, evidence-based procedure for case officers to assess appeals alleging that peer-review rejection stemmed from incommensurability between the applicant's research framework and that of the reviewers/panel, as defined operationally below.

  **Scope:** Applies only to appeals where the *sole or primary* ground is alleged framework incommensurability, not alleging bias, factual error, or procedural irregularity in the standard sense.

  **Officer Constraints:** Holds a doctorate; has 45 minutes; works *only* from the submitted documents (original proposal, two review reports, applicant rebuttal, panel summary/decision letter); no subject expertise; no external consultation; no primary literature review.

  **Available Dispositions:**
  1.  **Dismiss:** Appeal rejected; original decision stands.
  2.  **Uphold:** Appeal successful; funding decision overturned (rare for this ground alone).
  3.  **Refer for New Panel:** Case remitted for review by a differently constituted expert panel.
  4.  **Seek Specialist Advice:** Commission written advice from *one* external specialist (specify the nature of the disagreement requiring advice).
  5.  **Uphold in Part (Reconsider Specific Point):** Appeal partially upheld; panel directed to reconvene *only* to reconsider a specific, clearly defined objection in light of the framework issue identified.

  **Procedure:**

  *The officer applies the following tests sequentially. Stop and assign a disposition as soon as a test yields a conclusive finding.*

  1.  **Test for Resolvable Misunderstanding or Error:**
      *   **Examine:** Proposal, reviews, rebuttal, panel summary. Look for *explicit statements* in the rebuttal identifying a specific point of contention where the applicant claims the reviewers misinterpreted core concepts, methods, aims, or results *due to framework differences*. Cross-reference with the reviews/panel summary to see if they directly address *that specific claim*.
      *   **Sufficient Finding:** The rebuttal identifies a specific criticism (e.g., "Reviewer A states X is impossible, but within my framework Y, X is defined differently and achievable") AND the review/panel summary either (a) demonstrates clear factual error in interpreting the proposal (e.g., misstating the method), (b) ignores the rebuttal point entirely, or (c) dismisses it without engagement beyond asserting mainstream standards. *AND* resolving this specific point appears central to the rejection.
      *   **Licenses:** **Uphold in Part (Reconsider Specific Point).** Direct the panel to reconvene solely to reconsider the identified criticism, explicitly requiring them to engage with the applicant's stated framework on that point. *Judgment Point (JP1):* Determining if the misunderstanding is central to rejection. *Likely Error:* Overlooking resolvable points (erring towards dismissal).
      *   *If not met, proceed to Test 2.*

  2.  **Test for Lexical Divergence Only:**
      *   **Examine:** Proposal, reviews, rebuttal. Look for instances where the same *concrete concept* (method, object, outcome) is described using different terminology by applicant and reviewers. Check the rebuttal: does the applicant *translate* their terms into the reviewers' terms (or vice-versa in the reviews) to demonstrate equivalence? Look for shared citations discussing the *same phenomena* even if using different labels.
      *   **Sufficient Finding:** The core disagreement hinges *only* on terminology. The applicant demonstrates in the rebuttal that their concepts/methods map directly onto concepts/methods the reviewers accept ("What I call A is equivalent to your B"), or vice-versa is evident from the reviews. Shared citations support this mapping. The underlying substance of the criticism (e.g., "method X lacks precision") remains valid *even after translation*.
      *   **Licenses:** **Dismiss.** Incommensurability claim invalid; criticism is substantive. *Judgment Point (JP2):* Assessing if translation resolves the *substance* of the criticism. *Likely Error:* Accepting superficial translation masking substantive disagreement (erring towards dismissal).
      *   *If not met, proceed to Test 3.*

  3.  **Test for Shared Evidentiary Standards:**
      *   **Examine:** Proposal and rebuttal (for applicant's standards), reviews and panel summary (for reviewers' standards). Identify what *both sides* explicitly state constitutes valid evidence, a significant result, or falsification/validation within their frameworks. Look for *overlap* in these stated standards (e.g., both require statistical significance, reproducibility, predictive power, internal consistency - even if interpreted differently).
      *   **Sufficient Finding:** Both frameworks explicitly endorse *some* core standard of empirical adequacy or logical coherence that is recognisably similar (e.g., both value predictive accuracy, both require internal consistency, both demand replicable observations). The disagreement concerns the *application* of this shared standard to the specific proposal, not the standard's validity itself.
      *   **Licenses:** **Dismiss.** The frameworks are commensurable on a core standard; the rejection represents legitimate disagreement *within* science, not *between* frameworks. *Judgment Point (JP3):* Identifying genuine shared core standards beyond vague words like "rigour". *Likely Error:* Missing subtle differences in how standards are applied (erring towards dismissal).
      *   *If not met, proceed to Test 4.*

  4.  **Test for Anomaly Resolution (vs. Misunderstanding):**
      *   **Examine:** Proposal Introduction/Motivation and rebuttal. Did the applicant *explicitly frame* their approach as resolving a specific anomaly or limitation within the mainstream framework? Does the proposal/rebuttal cite specific phenomena, results, or conceptual problems that the mainstream framework allegedly handles poorly or ignores? Crucially, does the rebuttal *contrast* this with the alleged misunderstanding by reviewers?
      *   **Sufficient Finding:** The applicant clearly articulates a specific, recognised anomaly/problem within the mainstream framework *in the original proposal* AND explicitly positions their framework as resolving it *in the rebuttal*. The rebuttal distinguishes this motivation from claims of reviewer misunderstanding. The reviews/panel show no engagement with *this specific claimed resolution of an anomaly*.
      *   **Licenses:** Proceed to Test 5 (as this suggests potential deeper divergence). *Judgment Point (JP4):* Distinguishing genuine anomaly-motivation from post-hoc justification or simple claims of novelty/misunderstanding. *Likely Error:* Confusing genuine anomaly-resolution claims with generic assertions of superiority (erring towards dismissal). *If not met, **Dismiss** (Framework claim likely opportunistic or weak).*

  5.  **Characterise the Divergence (Taxonomy):**
      *   **Examine:** Core disagreement identified through Tests 1-4, focusing on rebuttal justification for divergence and reviews/panel rejection rationale.
      *   **Taxonomy & Adjudicability:**
          *   **A. Divergent Evidentiary Thresholds/Interpretation:** Parties agree *what counts as evidence/data* (e.g., specific measurements, model outputs) but disagree fundamentally on *what level or pattern* constitutes a significant result, confirmation, or falsification *within their respective frameworks*. *(Adjudicability: In principle adjudicable by shared standards, but often at prohibitive cost requiring deep expertise to translate/compare frameworks on this specific point. Requires **Specialist Advice**.)*
          *   **B. Divergent Aims/Weighting of Desiderata:** Parties share broad goals (e.g., understand phenomenon X) but fundamentally prioritize different criteria for success (e.g., predictive precision vs. explanatory breadth vs. ontological parsimony vs. policy relevance). The criticism/rejection hinges on missing a desideratum the applicant's framework explicitly deprioritizes. *(Adjudicability: Not adjudicable by shared *scientific* standards alone. Requires appeal to higher-level funder values (e.g., pluralism). **Refer for New Panel** with specific remit to consider pluralism.)*
          *   **C. Ontological/Kind Divergence (Later Kuhnian):** Parties disagree fundamentally on the classification of core entities/processes relevant to the research (e.g., what counts as the "same" type of system, what properties are essential). Criticisms rely on concepts (e.g., "microfoundations", "mechanism") that are incoherent or undefined within the applicant's framework's web of meanings. Shared evidence is interpreted through incompatible categorical lenses. *(Adjudicability: Not adjudicable in principle within existing paradigms. Requires **Specialist Advice** to confirm depth of divergence, but **Refer for New Panel** likely needed for final assessment.)*
      *   **Licenses:** Based on Diagnosis:
          *   A or C: **Seek Specialist Advice** (Requesting expert assessment of the *depth* and *nature* of the divergence and its impact on the specific criticisms). *JP5: Characterising the divergence type. Likely Error: Misclassifying B as A/C (erring towards costly advice) or A/C as B (erring towards dismissal).*
          *   B: **Refer for New Panel** (Brief new panel explicitly on considering methodological pluralism alongside scientific merit regarding the weighting of desiderata). *JP6: Confirming that rejection was primarily due to missing a low-priority desideratum, not shared standards.*

  6.  **Rule on Entitlement:**
      *   **Incommensurability Entitles Appellant To:** A review process that explicitly recognises the *possibility* of framework divergence and attempts to assess the proposal *on its own terms* or within a pluralistic context. It does *not* guarantee funding, shield the proposal from criticism *internal to its own stated framework*, or protect it from failing shared standards of coherence, clarity, or feasibility that transcend frameworks (e.g., logical consistency, methodological transparency, adequacy of resources). A valid incommensurability claim necessitates reconsideration by reviewers capable of engaging with the framework or explicit consideration of pluralism, *not* automatic success.

  7.  **Test for Opportunistic Use / Quality Failure:**
      *   **Examine:** Proposal clarity, rebuttal coherence, reviews. Is the "framework" presented consistently and coherently in the *proposal*? Does the rebuttal use Kuhnian language *only* in response to criticism, without prior grounding? Are the criticisms *also* applicable internally (e.g., proposal lacks internal coherence, methods poorly described, aims unclear even within its own terms)? Does the applicant dismiss *all* criticism as framework-based?
      *   **Sufficient Finding:** The proposal itself provides an unclear, inconsistent, or internally incoherent account of its "framework". The rebuttal invokes incommensurability defensively without substantive engagement. Criticisms exist that clearly pertain to flaws *within* the proposed framework's own logic or methodology (e.g., statistical errors, methodological flaws admitted by the framework itself, lack of clear research questions even in its own terms). *OR* the reviews demonstrate a good-faith attempt to engage with the proposal's stated aims/methods but find them lacking *on their own terms*.
      *   **Licenses:** **Dismiss.** The incommensurability claim is likely a rhetorical shield for a proposal failing ordinary standards of quality, clarity, or internal coherence. *Judgment Point (JP7):* Distinguishing genuine framework defence from opportunistic deflection of substantive, internally valid criticism. *Likely Error:* Mistaking a poorly articulated framework for a profound divergence (erring towards referral).

  **Systematic Failure Modes:**
  1.  **Subtle Evidentiary Divergence:** Cases where shared standards exist but are applied so differently the officer misses the depth of disagreement (JP3). *Errs towards dismissal.*
  2.  **Novelty Misclassified as Anomaly:** Truly novel (but commensurable) proposals misread as resolving anomalies, triggering unnecessary referrals (JP4). *Errs towards costly referral.*
  3.  **B-Type Disguised as A/C:** Deep value conflicts mischaracterised as technical disagreements about evidence or ontology, leading to inappropriate specialist advice instead of pluralism-focused panel referral (JP5/6). *Errs towards costly advice and potential dismissal.*
  4.  **Strong Rhetoric Overcomes Weak Substance:** Persuasive but opportunistic use of Kuhnian language secures referrals for weak proposals (JP7). *Errs towards costly referral.*
  5.  **Costly Divergence Dismissed:** Profound but costly-to-adjudicate divergence (A/C) dismissed due to resource constraints or officer caution (JP5, Funding Constraint). *Errs towards dismissal.*

  ---

  **Application to Test Cases**

  **(a) Infection & Immunity (Network Perturbation)**
  *   **Tests:** Passes Test 1? Rebuttal identifies specific criticism (need for falsifiable hypothesis/primary endpoint) and states framework reason (network state change vs hypothesis test). Reviews/panel don't engage *why* network state change is insufficient within *their* framework. Fails Test 2 (not just terms). Fails Test 3? Both likely share standards like "significant change" & reproducibility, but *what constitutes a significant/interpretable change* is disputed. Passes Test 4? Proposal likely motivated by complexity mainstream reductionism handles poorly (anomaly). Diagnosis (Test 5): **A. Divergent Evidentiary Thresholds/Interpretation** (What counts as a "result"?). Entitlement: Not shielded; needs assessment on its terms.
  *   **Disposition:** **Seek Specialist Advice** (Request: Assess whether network state change is a recognised/valid form of result within systems biology/immunology and whether the proposed analysis can robustly detect/interpret such changes, OR if the criticism reflects a fundamental incompatibility).
  *   **Reasoning (Determination Letter Extract):** "The appeal identifies a core disagreement concerning what constitutes a valid 'result' within the applicant's proposed framework (network state analysis) versus the standards applied by the reviewers (falsifiable hypothesis testing). The rebuttal framed this as a framework difference. While both approaches value empirical observation, the divergence in interpreting these observations warrants expert clarification. We are commissioning advice on whether the proposed methodology can yield interpretable outcomes by recognised standards within network-based approaches, or if the criticism reflects a fundamental methodological incompatibility."
  *   **Judgment Points:** JP3 (Shared Standards? - Found insufficient overlap on result interpretation), JP4 (Anomaly? - Assumed proposal addressed complexity limitation), JP5 (Diagnosis - Classified as A).

  **(b) Macroeconomics (Stock-Flow Consistent)**
  *   **Tests:** Passes Test 1? Rebuttal identifies criticism (lack identification/microfoundations) and states framework reason (focus on accounting consistency). Reviews/panel don't engage *why* accounting consistency alone might be valuable if identification is impossible. Fails Test 2. Fails Test 3? Shared standards likely exist (e.g., internal consistency, empirical relevance - though "testable" is disputed). Passes Test 4? **Crucially, rebuttal/applicant identifies NO specific anomaly mainstream models cannot represent.** Diagnosis (Test 5): **B. Divergent Aims/Weighting of Desiderata.** Applicant prioritises accounting consistency and potentially holistic understanding; reviewers prioritise identification (for causal inference/policy) and microfoundations (for mechanistic explanation). The rejection hinges on missing desiderata the framework deprioritizes. Entitlement: Warrants consideration of pluralism, not automatic success. Fails Test 7? Proposal/rebuttal coherent on its own terms regarding accounting focus; not opportunistic *if* pluralism is valued.
  *   **Disposition:** **Refer for New Panel** (Specifically: "Reassess the scientific merit of the proposal, explicitly considering the value of methodological pluralism and the specific contributions of the stock-flow consistent approach, including its internal consistency and potential insights, alongside concerns regarding identification and microfoundations.").
  *   **Reasoning (Determination Letter Extract):** "The appeal highlights a disagreement concerning the essential desiderata for macroeconomic models. The applicant's framework prioritises rigorous accounting consistency, while the reviewers emphasised identification and microfoundations. This represents a difference in the weighting of legitimate methodological values. Given the funder's commitment to methodological pluralism, the proposal merits reassessment by a panel specifically tasked with balancing these potentially competing priorities when evaluating scientific merit."
  *   **Judgment Points:** JP4 (Anomaly? - Found absent: key reason for dismissal despite sympathy), JP5 (Diagnosis - Classified as B, not A/C), JP6 (Confirming rejection due to missing desideratum).
  *   **Pluralism Commitment:** The commitment requires giving alternative frameworks *consideration*, not automatic funding. This disposition ensures that consideration happens explicitly, balancing pluralism against other scientific criteria. Dismissal would have ignored the legitimate value clash; upholding would have overridden scientific judgment. Referral is the proportionate response.

  **(c) Archaeology/Genetics (Chronology Convention)**
  *   **Tests:** **Passes Test 1 Resoundingly.** Rebuttal *need not even invoke Kuhnian terms*; the documents clearly show a concrete, resolvable error: reviewers applied a different calibration convention to radiocarbon dates than the applicant. The discrepancy is purely technical and resolvable by applying one consistent convention. The panel's rejection reason ("contradicts geneticists' dates") is factually incorrect based on consistent convention, as shown by proposal + reports. Test 1 finding met: Specific criticism (date discrepancy) based on clear misinterpretation (wrong convention applied), central to rejection.
  *   **Disposition:** **Uphold in Part (Reconsider Specific Point).** Direct panel to reconvene solely to reassess the chronological evidence using a consistent calibration convention as per the applicant's methodology and reconsider the rejection based on the corrected dating.
  *   **Reasoning (Determination Letter Extract):** "The appeal documents demonstrate that the perceived chronological contradiction resulted from the application of different calibration conventions to the radiocarbon data. The panel's summary indicates this discrepancy was central to the rejection. This constitutes a resolvable factual misunderstanding. The original panel is directed to reconvene solely to reassess the chronological alignment using a single, consistent calibration convention (as per the applicant's stated methodology) and reconsider the funding decision based *only* on the corrected chronological assessment."
  *   **Judgment Points:** JP1 (Centrality - Clearly central). *Note:* The appellant's framing as "temporal frameworks" is misleading; this is a standard technical calibration issue. Test 7 (Opportunism) is also arguably passed – Kuhnian language used defensively for a simple error.
