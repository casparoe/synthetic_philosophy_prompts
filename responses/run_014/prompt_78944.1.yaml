prompt: |-
  I run the risk team at a mid-sized pension fund — three of us, exactly one with any stats training — and every quarter we have to hand our investment comittee a view on a few big slow ugly exposures: whether the energy transition actually bites this decade, whether a particular counterparty bank is still around in eighteen months, whether the funding ratio recovers. The trustees have no quant background and they want numbers, my boss wants numbers, and I've been reading Keynes's Treatise on Probabilty and the things he wrote later about uncertainty, and I think he's right that we've mostly been faking it. Please turn his position into a procedure we can actually run — a checklist with a fixed order to it. How do we state the evidence base before anything else, since on his view a probability is relative to that evidence and to nothing else? When are we entitled to a number, and when is the honest output only a ranking or a rough comparison? How do we record how much weight the evidence carries, separately from how likely the thing is? What do we do with symmetry arguments, and with analogies to past episodes that aren't really the same episode? When does a market price count as evidence and when is it just a convention we're all agreeing to? And when is 'we don't know' the deliverable rather than a failure? It has to fit in a week, it has to say which steps a trustee signs off on, and it has to be runnable by someone who's never heard of Keynes. Then run it on two exposures: the long climate transition question and the bank counterparty over eighteen months. Include the case where the procedure tells us to hand the committee nothing at all, say plainly what the procedure can't do, and point out where I'll be dressing up a hunch as a step. Lead with the bottom line in your first sentence and then the reasoning — no preamble, no restating the question.
reasoning: |-
  Okay, the user runs a risk team at a mid-sized pension fund and is grappling with how to handle big, uncertain exposures like the energy transition and counterparty bank stability. They've been influenced by Keynes's ideas on probability and uncertainty, feeling that current approaches might be "faking it." They need a practical, step-by-step procedure that can be implemented in a week, understandable by trustees without quant backgrounds, and executable by team members unfamiliar with Keynes.

  The core challenge here is bridging Keynesian epistemology with operational risk management. Keynes distinguished between measurable probabilities (based on sufficient evidence) and true uncertainty (where quantification is meaningless). The user needs a framework that forces explicit acknowledgment of evidence quality before assigning any numbers.

  Key requirements jump out: 
  - Must start with evidence base declaration
  - Needs clear rules for when to output numbers vs rankings vs "don't know"
  - Requires separate tracking of evidence weight from likelihood
  - Must handle symmetry arguments and imperfect analogies
  - Needs to interpret market prices critically
  - Must accept "we don't know" as valid output
  - Practical constraints: one-week implementation, trustee sign-offs, non-expert usability

  For the energy transition case, the evidence base would include policy announcements, tech cost curves, and emissions data - but these are non-comparable and non-additive. The procedure should stop at evidence weighting and analogies, explicitly rejecting quantification. The deliverable would be qualitative assessments with confidence ratings.

  For the bank counterparty, more structured data exists - financial ratios, CDS spreads, regulatory metrics. Here the procedure allows a "rough comparison" output by anchoring to historical precedents, but with heavy caveats about evidence limitations. The CDS spread gets contextualized rather than taken at face value.

  The critical insight is that the procedure's value lies in forcing transparency about the *basis* for judgments. The hunch-dressing happens mainly in the analogy step (step 5), where subjective pattern-matching gets formalized. Trustees would sign off on evidence scope (step 1) and output format (step 7) - making them acknowledge the sandbox boundaries before seeing results.

  This approach doesn't eliminate uncertainty, but makes its treatment rigorous. The "we don't know" outcome isn't failure - it's intellectual honesty when evidence weight falls below threshold. The framework's main limitation is that it can't create knowledge where none exists, and still relies on expert judgment at key points.
answer: |-
  Here's a bottom-line procedure based on Keynesian uncertainty, then its application:

  **Bottom Line:** Your deliverable is either (1) a quantified probability *only if* sufficient homogeneous evidence exists, (2) a comparative ranking/range, or (3) a clear "Unquantifiable - Decision Based on Other Factors" statement. Evidence quality is documented separately from the output. Market prices are data points, not truth, and "we don't know" is mandatory when evidence lacks weight or comparability.

  **Keynesian Uncertainty Procedure (The "Evidence-Weight First" Protocol)**

  1.  **Define the Proposition & Evidence Scope (Trustee Sign-Off):**
      *   State the *exact* question (e.g., "Bank X remains solvent 18 months from now").
      *   **List ALL evidence sources explicitly:** Internal models, market data, expert reports, historical analogs, regulatory filings, news, fundamental analysis. *Be exhaustive.*
      *   **Trustee Role:** Approve the defined proposition and the *scope* of evidence considered. This sets boundaries.

  2.  **Assess Evidence "Weight" (Separate from Probability):**
      *   **Is the evidence Homogeneous?** Are data points directly comparable and additive (e.g., dice rolls, mortality tables)? If YES, proceed to Step 3. If NO, go to Step 4.
      *   **How Relevant/Reliable is the evidence?** Rate qualitatively (High/Medium/Low) or score (1-5) based on:
          *   *Completeness:* Gaps? Key unknowns?
          *   *Objectivity:* Subjective interpretation needed?
          *   *Stability:* Likely to change fundamentally?
          *   *Comparability:* Truly similar to the proposition?
      *   **Record this "Weight Assessment" separately.** This is crucial.

  3.  **Quantified Probability (Only if Homogeneous Evidence Exists):**
      *   **IF** evidence is judged sufficiently homogeneous *and* weight is High/Medium-High *and* the process is stable, calculate a statistical probability.
      *   **Output:** A single number or narrow range (e.g., "PD: 1.2%" or "85-90% chance").
      *   **Document Assumptions & Weight Rating:** Explicitly state the homogeneity and weight basis. *This is rare for your "big ugly" questions.*

  4.  **Comparative Assessment (Non-Homogeneous Evidence):**
      *   **Can evidence support meaningful comparison?** Can you rank outcomes (e.g., Event A seems *more likely* than Event B)? Can you group evidence suggesting "high/medium/low" likelihood? Can you define a *very wide* plausible range?
      *   **Output:** Rankings ("Solvency Risk: Bank X > Bank Y > Bank Z"), Ranges ("Probability between 20% and 60%"), or Categories ("High Risk", "Moderate Likelihood").
      *   **Document Basis:** Explain *why* comparison is possible despite non-homogeneity. Link to Weight Assessment.

  5.  **Handle Analogies & Symmetry:**
      *   **Analogies:** Treat as *one piece* of evidence. *Explicitly state differences* from the current situation. Rate their Relevance/Reliability in Step 2. *Never* assume direct probability transfer.
      *   **Symmetry Arguments (e.g., coin flips):** Only valid if *truly symmetric* and *no relevant evidence breaks the symmetry*. Highly suspicious for complex real-world events. Document *why* symmetry is assumed and any potential breaks.

  6.  **Market Prices: Evidence, Not Gospel:**
      *   Market prices (CDS, stock) are *evidence* – add them to Step 1's list.
      *   **Interpret Critically:** What convention/assumption is priced in? (e.g., CDS assumes specific recovery, liquidity affects price). Is the market deep/informed? Document this interpretation in Step 2's Weight Assessment.
      *   **Never** use a market price *alone* as "the probability".

  7.  **Decide the Deliverable (Trustee Sign-Off):**
      *   Based on Steps 2-6:
          *   **Quantified Probability?** (Only if Step 3 passed).
          *   **Comparative/Ranged Output?** (If Step 4 possible).
          *   **"Unquantifiable - Insufficient Weight/Comparability"?** (If Steps 3 & 4 fail).
      *   **Mandatory "We Don't Know":** Required if evidence weight is Low/Very Low, evidence is contradictory, or the future state is fundamentally unknowable (true Knightian uncertainty).
      *   **Trustee Role:** Approve the *format* of the deliverable (Number, Ranking, or "Unquantifiable") *before* seeing the specific answer. This forces acceptance of uncertainty.

  8.  **Produce Output & Document:**
      *   Generate the agreed deliverable.
      *   **Attach the Evidence List (Step 1) and Weight Assessment (Step 2).** This is the core of the Keynesian approach – the probability/ranking is meaningless without its evidence base and weight.

  **Application: Energy Transition Bites This Decade**

  1.  **Proposition & Evidence:** "Significant, sustained global reduction in fossil fuel demand driven by transition occurs by 2030." Evidence: Current policy pledges (INDCs), tech cost curves (solar/batteries), fossil investment trends, climate model scenarios (IPCC), corporate commitments, historical tech transitions (analogy), energy market prices (oil, gas, renewables), geopolitical factors.
  2.  **Weight Assessment:**
      *   *Homogeneity?* **NO.** Policies ≠ tech costs ≠ models ≠ analogies. Not additive.
      *   *Relevance/Reliability:* Mixed. Policies (Medium - can change), Tech (Medium-High - trends clear, pace uncertain), Models (Low-Medium - scenarios, not forecasts), Analogies (Low - energy transition unique scale/scope), Prices (Low - reflect short-term, influenced by many factors).
      *   *Weight:* **Low-Medium.** Fragmented, future-dependent, high-impact unknowns (tech breakthroughs, political shifts, climate tipping points).
  3.  **Quantified Probability?** **NO.** Insufficient homogeneity.
  4.  **Comparative Assessment?** **Limited.** Can categorize:
      *   *More Likely Than Not?* Evidence mixed but suggests momentum increasing. Maybe "Moderate-High Likelihood" (e.g., >50% but wide band).
      *   *Plausible Range?* Very Wide (e.g., 30% - 80%).
      *   *Ranking?* Not applicable vs other exposures here.
  5.  **Analogies/Symmetry:** Past transitions (e.g., coal to oil, horses to cars) cited. *Key Differences:* Scale, urgency, system complexity, entrenched interests, global coordination needed. Relevance: Low. Symmetry arguments invalid.
  6.  **Market Prices:** Reflect current supply/demand, geopolitical risk. Poor proxies for decade-long structural shift probability. Low weight.
  7.  **Deliverable:** **Comparative/Ranged Output + "Unquantifiable" Caveat.** "We assess a Moderate-High Likelihood (>50%) of a significant energy transition bite occurring this decade, based on current policy and technology momentum. However, evidence weight is Low-Medium due to fundamental uncertainties; a wide plausible range of 30%-80% reflects this. This is unquantifiable with precision."
  8.  **Output:** Statement above, backed by documented evidence list and weight assessment.

  **Application: Counterparty Bank Solvency (18 Months)**

  1.  **Proposition & Evidence:** "Bank X maintains sufficient capital and liquidity to meet obligations without external intervention for the next 18 months." Evidence: Bank's public financials (capital ratios, liquidity coverage ratio - LCR, NPLs), CDS spreads, stock price & volatility, credit ratings, regulatory reports (if available), analyst reports, market sentiment/news, peer comparisons, historical bank failures (analogy).
  2.  **Weight Assessment:**
      *   *Homogeneity?* **PARTIALLY.** Financial ratios are standardized and comparable over time/peers. CDS/stock prices market-driven but interpretable. News/analyst reports less homogeneous.
      *   *Relevance/Reliability:* Financials/CDS (High if timely, Medium if lagged), Ratings (Medium), News/Sentiment (Low-Medium), Analogies (Medium - if similar banks/situations).
      *   *Weight:* **Medium-High.** More structured data, shorter timeframe, regulated entity. Key risks: sudden market loss of confidence, hidden exposures.
  3.  **Quantified Probability?** **NO.** While ratios are homogeneous, *solvency* depends on future events and confidence. Not purely statistical.
  4.  **Comparative Assessment?** **YES.**
      *   *Ranking:* Can rank vs peers ("Riskier than Bank Y, less risky than Bank Z").
      *   *Range:* Can estimate a Point-in-Time Probability of Default (PIT PD) based on models using ratios/CDS, anchored to historical default data for similar banks. **Crucially:** Output a *wide range* (e.g., 0.5% - 5%) and express as "Low Risk" or "Elevated Risk". *Not* a precise number.
  5.  **Analogies/Symmetry:** Historical failures (Lehman, SVB) used. *Key Differences:* Specific bank profile, current regulations, macro environment. Relevance: Medium (for mechanisms, not precise odds). Symmetry invalid.
  6.  **Market Prices:** CDS spread is *primary evidence* for market-implied PD. **BUT:** Interpret critically in Step 2: Liquidity premium? Model assumptions? Short-term focus? Combine with fundamentals – don't outsource judgment.
  7.  **Deliverable:** **Comparative/Ranged Output.** "Based on current financials (CET1: X%, LCR: Y%), CDS spread of Z bps (implying a rough PIT PD of 0.7%-2.5%), and peer comparison, we assess Bank X as Low-Moderate Risk of insolvency within 18 months. Evidence weight is Medium-High; however, a precise probability is not possible due to confidence risk."
  8.  **Output:** Risk category (Low-Moderate) + anchored PD range + documented evidence/weight.

  **Where You'll Dress Up a Hunch & What the Procedure Can't Do:**

  *   **The Hunch Step:** Step 4 (Comparative Assessment) is most vulnerable. Turning heterogeneous, weight-assessed evidence into a "Moderate-High Likelihood" or a "0.7%-2.5% PD range" involves unavoidable expert judgment (the hunch). The procedure forces you to *document the evidence basis and weight* for that judgment, making the hunch more transparent and disciplined, but it's still there.
  *   **Cannot Create Knowledge:** It can't magically generate reliable probabilities where none exist (true uncertainty). It forces you to admit this ("Unquantifiable").
  *   **Cannot Eliminate Judgment:** Evidence weighting (Step 2), analogy relevance (Step 5), and the *interpretation* within comparative assessment (Step 4) rely on expert judgment. The procedure structures and documents it; it doesn't replace it.
  *   **Cannot Predict Black Swans:** It deals with known unknowns. Radically unforeseen events remain unforeseen.
  *   **Cannot Force Trustees to Like "We Don't Know":** It provides a rigorous basis for it, but cultural acceptance is separate. The sign-off steps (1 & 7) are crucial for this.

  **Key Output:** You deliver either a number (rarely), a range/ranking with explicit caveats, or a justified "Unquantifiable." Crucially, **you always deliver the documented Evidence Base and Weight Assessment.** This meets the demand for "numbers" when possible and intellectually honest communication when not, all within a structured, auditable, week-long process runnable by non-experts following the checklist.
