prompt: |-
  Two friends of mine, both in the same philosophy of science seminar, got into it over coffee about whether Bayesianism has a fatal problem with old evidence. The issue came up cause they were discussing how Einstein used the known anomaly in Mercury's perihelion as evidence for general relativity — something astronomers had known about for decades before GR.

  Dan said it's a devastating problem: if you already know some piece of evidence E, your credence in E is 1, and Bayes' theorem says P(H|E) = P(E|H)P(H)/P(E). If P(E) = 1, then P(H|E) = P(H). So old evidence literally cannot confirm a theory. But it obviously does — Mercury's orbit confirmed GR. So Bayesian confirmation theory is broken at its core.

  Maya said this is too quick. She said what actually happens when a scientist uses old evidence is they consider what the evidence would have looked like if they didn't already know it — they subtract it from their background knowledge and then see whether the theory predicts it. So the formalism can be saved by asking what your credence would have been without E.

  Dan shot back that "subtracting" evidence you already know is psychologically impossible — you can't just pretend you don't know something — and even if you could, there's no principled way to decide what to replace it with. Your credences would be totally unconstrained.

  Maya said that's a practical problem, not an in-principle one, and anyway scientists do this kind of counterfactual reasoning all the time — it's basically what "this theory would predict X" means.

  Dan said that's exactly his point — scientists do it all the time, and Bayesianism can't represent it, so Bayesianism fails as a descriptive account of how confirmation actually works in science.

  Maya paused and said maybe the real issue is that we shouldn't think of confirmation as updating on known facts at all — maybe confirmation is about explanatory relationships, not credence changes. But Dan said that just abandons Bayesianism rather than saving it.

  They went back and forth a while and never resolved it. Can you walk through their arguments and say who has the better case at each step, and whether either of them is missing something important?
reasoning: |-
  Okay, so I need to figure out this Bayesianism problem with old evidence. Dan and Maya are arguing about whether known evidence can confirm a theory. Dan says it can't because if P(E) is 1, then P(H|E) = P(H), meaning no confirmation. Maya thinks you can handle it by imagining not knowing E and seeing if H predicts it.

  First, I should recall Bayes' Theorem: P(H|E) = [P(E|H) * P(H)] / P(E). If E is already known, P(E) = 1. Then P(H|E) = P(H) * P(E|H) / 1. Since P(E|H) is usually high for a good theory, but P(H|E) still equals P(H) times that. Wait, but if P(E) is 1, dividing by 1 doesn't change anything, so P(H|E) is just P(E|H) * P(H). But if P(E) is 1, and E is true, does that affect P(E|H)? P(E|H) is the likelihood, which is how likely E is given H. If E is already true, does that impact the likelihood? Actually, no—P(E|H) is based on H predicting E. But if P(E) is 1, meaning E is certain, then H doesn't add new information about E. So in the equation, P(H|E) simplifies to P(H) only if P(E) is 1? Let me double-check.

  If P(E) = 1, then the denominator is 1, so P(H|E) = P(E|H) * P(H). But if P(E) = 1, that means E is always true, so P(E|H) must also be 1 for any H, right? Because if E is certain, then no matter what H is, E is true. So P(E|H) = 1, so P(H|E) = 1 * P(H) = P(H). So yes, if E is already known with certainty, updating on it doesn't change the probability of H. That's the core of Dan's argument.

  But in practice, Mercury's perihelion was known, and it did confirm GR. So how does Bayesianism handle that? Maya suggests "subtracting" E from background knowledge and then asking what the credence would be without E. So, in a counterfactual scenario where you don't know E, you calculate P(E|H) and P(E) without that knowledge, and then see if H predicts E better.

  Dan counters that this is psychologically impossible—you can't pretend you don't know something. And even if you could, how do you reconstruct your credences without E? Your background knowledge changes, so probabilities might be different.

  Maya says it's a practical issue, not in-principle, and scientists do counterfactual reasoning all the time.

  Dan argues that since Bayesianism can't represent this naturally, it fails descriptively.

  Maya then suggests that confirmation might be about explanation, not credence changes, but Dan says that abandons Bayesianism.

  I need to assess who has the better case. Let me break it down step by step.

  First, Dan's point about P(E)=1 leading to no confirmation is technically correct in strict Bayesian updating. If evidence is already certain, it doesn't change beliefs. But in the case of old evidence, when Einstein used Mercury's orbit, he wasn't "updating" on new information; he was showing that GR explains it, whereas Newtonian mechanics didn't fully. So, the confirmation comes from the explanatory power, not from a belief update.

  Maya's idea of counterfactual credences is a common solution in Bayesian philosophy. For example, Clark Glymour and others have proposed this. You define a measure of confirmation based on what your credence would have been if you didn't know E. So, let K be background knowledge without E, then the confirmation is P(H|E,K) vs P(H|K). But since you do know E, P(H|E,K) might be different, but in the counterfactual, you compare P(H|K) to what it would be after learning E, which is P(H|E,K).

  In the counterfactual scenario, without knowing E, P(H|E,K) isn't defined because E isn't known. Better to think: before learning E, what was P(H|K)? Then upon learning E, it updates to P(H|E,K). But if E is old evidence, you never had a time when you didn't know E, so you can't observe that update.

  Therefore, the Bayesian must imagine a hypothetical prior where E is not known. That's what Maya means by subtracting E from background knowledge.

  But how do you define that hypothetical prior? Dan says it's unconstrained because background knowledge includes many things, and removing E might affect other beliefs.

  For example, with Mercury's perihelion, before it was known, astronomers had certain beliefs. But in Einstein's time, many other things were known, so it's hard to recreate the exact state of knowledge before E was discovered.

  However, in practice, scientists approximate. They ask, "If we didn't know about Mercury's anomaly, and GR predicted it, how surprising would that be?" Or, they compare the likelihoods under different theories.

  So, for Bayesianism, one way is to compute the likelihood ratio: P(E|H,K) / P(E|¬H,K). If H predicts E better than alternatives, then E confirms H, even if E is known. In the formula, P(E|H) and P(E) are still meaningful; P(E) is the probability without assuming H, but with background knowledge.

  Ah, that's key. P(E) in Bayes' theorem is the prior probability of E given background knowledge, not including H. But if E is part of background knowledge, then P(E|K) = 1, so again, no update.

  If E is in K, then K implies E, so P(E|K) = 1. Then P(H|E,K) = P(H|K), since E is redundant given K. So strictly, old evidence can't confirm if it's in the background.

  Therefore, to handle old evidence, we need to consider K without E. Let K' be K minus E. Then, we can compute P(E|H,K') and P(E|K'), and the degree of confirmation is how much P(H|E,K') is higher than P(H|K').

  But since we can't actually have K', it's counterfactual.

  Dan's psychological impossibility point: Can we really imagine not knowing E? For example, can a modern physicist pretend they don't know about Mercury's orbit to test GR? It might be hard, but scientists do thought experiments like this.

  Moreover, in many cases, we can look at historical records to see what was known before E.

  But Dan has a point that it's not straightforward.

  Maya says it's a practical problem, not in-principle. Bayesianism can be saved by this counterfactual approach.

  Dan also says Bayesianism fails descriptively because scientists don't explicitly calculate probabilities; they reason about explanations.

  But Bayesianism is often seen as normative, not descriptive. So it might still work as a rational model.

  The old evidence problem is a known issue in Bayesian confirmation theory. Solutions include:

  1. Counterfactual credences (like Maya said).
  2. Ur-probability: Using a prior before any evidence, but that's problematic.
  3. Explanation-based measures, but that might not be Bayesian.

  Another approach is to say that when a theory explains old evidence, it increases our understanding, which could be separate from credence. But Bayesianism is about credences.

  Perhaps for old evidence, the confirmation comes from the fact that H entails E, while other theories don't, so we see that H is a better explanation. Bayesianism can capture this through likelihoods. If P(E|H) is high and P(E|¬H) is low, then E confirms H relative to ¬H, even if E is known.

  But if P(E) = 1, then P(E|H) must be 1, and P(E|¬H) must be 1, so no confirmation.

  Unless we don't condition on E in the background.

  I think the counterfactual approach is the standard solution.

  Now, to evaluate their arguments:

  - Dan is right that strictly, with E in background, no Bayesian update occurs.
  - Maya is right that by redefining background, we can model confirmation of old evidence counterfactually.
  - Dan's psychological point is valid but not fatal; it's a limitation of human cognition, not the formalism.
  - Maya's point about scientists doing counterfactual reasoning is strong; they often say "if this theory were true, it would predict X, which we observe."
  - Dan's descriptive failure argument has merit, but Bayesianism is primarily normative.
  - Maya's suggestion about explanatory relationships might lead away from Bayesianism to something like inference to the best explanation.

  Who has the better case? Overall, Maya's counterfactual solution is accepted in philosophy, so she might have the stronger position. But Dan highlights real issues with implementation.

  Key thinkers: Clark Glymour raised the problem in "Theory and Evidence." Solutions from Howson, Garber, etc. Garber proposed that we learn logical relationships, like H implies E, which we might not have known before.

  In the Einstein case, when GR was developed, it was realized that GR entails the perihelion shift, which wasn't obvious before. So, learning that H entails E is new evidence, not E itself.

  That's another solution: the new evidence is not E (which is old), but the fact that H implies E. Let this be F = "H entails E".

  Then, P(H|F) could be updated. Since F might be surprising, it can confirm H.

  For example, before knowing that GR entails the perihelion, one might have P(H) low, but after seeing that it does, P(H|F) increases.

  And P(F) is not 1, because it might not have been obvious that GR predicts that.

  In this case, E is still known, but F is new.

  This avoids the need for counterfactual credences.

  Dan might say that in practice, scientists don't think that way; they just see that the theory explains the evidence.

  But formally, it works.

  In summary:

  - Dan's initial argument is correct: if E is certain, no update.
  - Maya's counterfactual is one solution.
  - The entailment solution is another.
  - Dan's psychological and descriptive criticisms have weight but don't refute Bayesianism as a normative model.
  - Maya's explanatory point might suggest a different approach, but within Bayesianism, solutions exist.

