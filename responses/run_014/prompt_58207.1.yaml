  1. Judgment View (J): Emotions are evaluative judgments (e.g., fear is the judgment that something is dangerous).
  2. Perceptual View (P): Emotions are perceptions of value (like seeing danger, not judging it).
  3. Feeling View (F): Emotions are feelings of bodily changes (e.g., the feeling of increased heart rate, trembling).

