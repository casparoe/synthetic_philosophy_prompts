     - *Question*: What does this show about the nature of Alex's fear?
     - *Options*:
       A. The fear is irrational because it doesn't match Alex's judgment about safety. (J)
       B. The fear is a perception of danger that persists despite the judgment. (P)
       C. The fear is just the feeling of Alex's body reacting (heart racing, sweating) and doesn't require the judgment. (F)

