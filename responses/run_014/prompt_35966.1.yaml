answer: |-
  A utilitarian and a Scanlonian are reviewing disaster relief policies. The utilitarian proposes diverting funds from a single life-saving air ambulance to buy fifty million aspirin packets, preventing widespread mild headaches during a crisis.  
  "Completely impermissible!" declares the Scanlonian. "The person needing the ambulance could reasonably reject any principle allowing their death just to spare someone else a headache. No single headache-sufferer has a complaint remotely strong enough to outweigh that."  
  "Okay," says the utilitarian, "but what about the collective complaint of all fifty million headache sufferers? Surely *that* outweighs one life?"  
  The Scanlonian sighs patiently. "No, you're still not getting it. Adding more people with the *same* minor complaint doesn't change the *strength* of the complaint anyone can raise against the principle. Each still only has a headache. So, no single individual can reasonably reject a principle that saves the life but leaves their headache untreated. Therefore, a principle permitting the fund diversion is rejectable only by the one who dies... and *their* complaint clearly outweighs any *one* headache complaint. Hence, we must fund the ambulance."  
  "...So," the utilitarian replies slowly, staring at the policy document, "you're telling me we *have* to let fifty million people suffer headaches... because none of them is suffering *enough* on their own to matter?"  
  The Scanlonian beams. "Exactly! You finally understand reasonable justifiability!"
