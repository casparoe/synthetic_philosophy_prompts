  We are designing a decision procedure for triaging internal proposals based on the concept of safe Pareto improvements. The key principles are:
  1. At least one group must be better off by their own preferences (without relying on interpersonal utility comparisons).
  2. No group is made worse off (again, by their own preferences).
  3. This must hold under a range of plausible forecasts (robustness).
  4. We do not allow uncompensated losses to be outweighed by gains elsewhere (so no Kaldor-Hicks).

  The procedure must be:
  - Usable in about 45 minutes by staff without economics training.
  - Have ordered checks with plain standards of evidence.
  - Specify when to reject outright.
  - Mark where factual checking ends and value judgment begins (requiring director sign-off).

  We structure the procedure as a series of steps (checks). If a proposal fails any step, it may be rejected or require director sign-off as specified.

  **Decision Procedure: Safe Pareto Improvement Check**

  **Step 1: Identify Affected Groups**
  - Task: List all distinct groups (e.g., bus riders on route A, clinic patients in department X, staff in department Y) that might be affected by the proposal, positively or negatively.
  - Standards of Evidence: Use the proposal document and any supplementary materials to identify groups. If the proposal does not explicitly list affected groups, ask the proposer to provide this. If there are obvious missing groups, note them.
  - Time Guideline: 5 minutes.
  - Outcome: A list of groups. If any group is missing and cannot be identified within 2 minutes, reject the proposal as incomplete (with feedback to resubmit with clear group identification).

  **Step 2: Measure Impact on Each Group (Factual)**
  - Task: For each group, determine the nature of the change (e.g., longer walk, more frequent bus, reduced waiting time). If the proposal provides data or forecasts, note them.
  - Standards of Evidence: Require the proposal to state the expected impact on each group. If no impact is stated for a group, assume no change? But caution: we must check for any negative impact. If the proposal does not address a group, then we cannot assume no impact. Therefore, if any group is not addressed, the proposal is incomplete and must be rejected (or sent back).
  - Time Guideline: 10 minutes.
  - Outcome: For each group, a description of the impact. If any group's impact is not described, reject the proposal as incomplete.

  **Step 3: Check for Any Uncompensated Losses (Factual)**
  - Task: For each group, check if the impact includes any negative change (e.g., longer walk, less convenient timing, increased cost). If there is a negative change, note whether the proposal includes compensation for that group (such that the group is at least as well off as before). Compensation must be direct and targeted to the group experiencing the loss (e.g., a voucher for the housing estate residents who have a longer walk, or a free shuttle). Note: We are not counting gains to others as compensation.
  - Standards of Evidence: The proposal must explicitly state any negative impact and how it is fully compensated. If there is an uncompensated loss (even if small) for any group, then the proposal fails the safe Pareto criterion and must be rejected. However, if the group is not made worse off by their own preferences (e.g., they might not mind the longer walk because they get a more frequent bus) then it's acceptable. But note: we must check preferences in the next step.
  - Time Guideline: 10 minutes.
  - Outcome: If any group has an uncompensated loss (by the facts of the change, without considering preferences), then we move to Step 4 for that group to check if they are actually made worse off by their own preferences. But note: the absence of compensation and the presence of a negative change is a red flag.

  **Step 4: Check Preferences for Impacted Groups (Value Judgment - Director Sign-off)**
  - Task: For any group that has a negative change without compensation, we must determine if that group, by their own preferences, is made worse off. This requires evidence about the group's preferences.
  - Standards of Evidence: 
    - If the group has been consulted and a majority (or a representative sample) indicates they are not worse off (or are even better off due to other aspects), then we can accept. 
    - If there is no direct evidence of preferences, we must rely on reasonable assumptions. However, this step requires a value judgment because we are interpreting preferences. Therefore, if there is no clear evidence (like survey data or historical behavior) and we are making an assumption, then we mark this as requiring director sign-off.
    - Note: Even for a positive change, we must check that the group actually values the change (but that is usually assumed if they are getting something they might want). The critical part is for negative changes without compensation.
  - Time Guideline: 10 minutes per group (but typically only one or two groups might be in question).
  - Outcome: If a group with an uncompensated negative change is determined (by evidence or director judgment) to be worse off by their own preferences, then the proposal fails and must be rejected. If they are not worse off (or are compensated), then we proceed.

  **Step 5: Robustness Check (Factual)**
  - Task: Consider at least two alternative future scenarios (e.g., low ridership growth, high ridership growth) and check that in each scenario, the condition of no group being worse off and at least one better off still holds.
  - Standards of Evidence: The proposal should include a sensitivity analysis. If it does not, staff must consider two scenarios (optimistic and pessimistic) based on readily available data (e.g., historical variation). If in any scenario a group becomes worse off (without compensation) and that scenario is plausible (more than 10% chance by staff judgment), then the proposal fails unless the negative impact is compensated in that scenario too. If the proposal does not address a plausible scenario and staff cannot easily assess, then it must be sent back for more analysis or rejected.
  - Time Guideline: 10 minutes.
  - Outcome: If the proposal fails in any plausible scenario, reject. If the analysis is missing, reject or require resubmission (if time permits) or reject if the risk is obvious.

  **Step 6: Check for At Least One Group Better Off (Factual)**
  - Task: Verify that at least one group is made better off (by their own preferences) without any negative trade-off (e.g., they get a more frequent bus without having to pay more or walk further). This is usually straightforward from Step 2 and Step 4.
  - Standards of Evidence: The proposal must show at least one group has a positive change that they would prefer (if there is any doubt, we might need to check preferences for that group, but usually a positive change in a desirable attribute is acceptable). If no group is better off, then the proposal is not an improvement and must be rejected.
  - Time Guideline: 5 minutes (if not already clear).
  - Outcome: If no group is better off, reject.

  **Summary of Rejection Points:**
  - Step 1: Missing groups -> reject (incomplete).
  - Step 2: Unaddressed group impact -> reject (incomplete).
  - Step 3: Uncompensated loss (without checking preferences) -> then Step 4: if preferences show worse off -> reject.
  - Step 5: Fails in a plausible scenario -> reject.
  - Step 6: No group better off -> reject.

  **Director Sign-off:**
  Only required at Step 4 when we are making a judgment about a group's preferences without clear evidence.

