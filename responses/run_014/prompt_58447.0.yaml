answer: |-
  ### Decision Procedure for Evaluating Proposals as Safe Pareto Improvements  
  This procedure ensures proposals meet the **safe Pareto standard**: improving at least one group by its own preferences without harming any group, under plausible forecasts. Uncompensated losses cannot be justified by larger gains elsewhere. Designed for **45-minute use by non-economists**, it includes ordered checks, evidence standards, rejection criteria, and clear sign-off points.  

  ---

  #### **Step-by-Step Procedure**  
  1. **Identify Affected Groups (5 minutes)**  
     - **Task**: List all groups impacted (e.g., bus riders, clinic staff, patients).  
     - **Evidence Standard**: Proposal must explicitly name groups. If groups are omitted, ask proposer to clarify.  
     - **Reject If**: Groups are missing and cannot be identified in 2 minutes.  
     - **Output**: Complete list of groups.  

  2. **Measure Direct Impacts (10 minutes)**  
     - **Task**: For each group, note:  
       - Tangible gains (e.g., shorter wait times, cost savings).  
       - Tangible losses (e.g., longer walks, reduced access).  
       - Compensation offered (e.g., shuttle service, fee waivers).  
     - **Evidence Standard**: Require quantifiable data (e.g., "walk increases by 0.2 miles"). If qualitative (e.g., "better experience"), reject for vagueness.  
     - **Reject If**: Any group faces an uncompensated loss (e.g., longer walk with no offsetting benefit).  
     - **Output**: Table of impacts per group.  

  3. **Check Preferences (10 minutes)**  
     - **Task**: For gains/losses, verify alignment with group preferences.  
     - **Evidence Standard**:  
       - **Pass**: Survey data (e.g., 60%+ support) or past behavior (e.g., riders prioritized frequency over walk distance).  
       - **Fail**: Assumptions without evidence (e.g., "we think they won’t mind").  
     - **Value Judgment Sign-off**: If evidence is weak (e.g., no surveys), director must approve whether the loss/gain aligns with preferences.  
     - **Reject If**: Losses lack evidence of acceptance by the affected group.  

  4. **Test Robustness (10 minutes)**  
     - **Task**: Assess impacts under 2–3 scenarios (e.g., low/high demand, budget cuts).  
     - **Evidence Standard**: Proposal must address scenarios. If absent, use council’s historical data (e.g., "bus ridership fluctuates ±15%").  
     - **Reject If**: Any group is worse off in a plausible scenario (e.g., estate residents face 20% longer waits if demand spikes).  

  5. **Verify Net Improvement (5 minutes)**  
     - **Task**: Confirm at least one group is better off without harming others.  
     - **Evidence Standard**: Gains must be preference-aligned and uncompensated losses must be absent.  
     - **Reject If**: No group gains, or gains rely on offsetting losses elsewhere.  

  6. **Final Decision (5 minutes)**  
     - **Approve**: Passes all checks with strong evidence.  
     - **Revise & Resubmit**: Fails due to missing data but no outright harm.  
     - **Reject**: Fails Steps 2, 3 (with no sign-off), 4, or 5.  

  ---

  ### **Application to Fictional Proposals**  
  #### **Proposal 1: Bus Route Consolidation**  
  *Merge two evening routes into one frequent corridor. Improves frequency but lengthens walk for Housing Estate A.*  
  - **Step 1: Groups Identified**:  
    - Riders from Housing Estate A (longer walk).  
    - Riders from Housing Estate B (shorter waits).  
    - City transit (cost savings).  
  - **Step 2: Impacts**:  
    - Estate A: Walk +0.3 miles (loss), no compensation.  
    - Estate B: Wait times −10 minutes (gain).  
    - Transit: $5K/month savings (gain).  
    - *Rejection Risk*: Uncompensated loss for Estate A.  
  - **Step 3: Preferences**:  
    - **Evidence**: Survey shows 70% of Estate A riders oppose longer walks.  
    - **Result**: Fails. Loss not preference-aligned.  
  - **Step 4: Robustness**:  
    - Scenario: 20% ridership increase → overcrowding. Estate A’s walk loss remains uncompensated.  
    - **Result**: Fails (harm persists).  
  - **Step 5: Net Improvement**:  
    - Estate B gains, but Estate A loses → not Pareto.  
  - **Outcome**: **Reject**. Fails Step 3 (preferences) and Step 4 (robustness).  

  #### **Proposal 2: Clinic Appointment Swapping**  
  *Automatically reallocate unused appointments across departments.*  
  - **Step 1: Groups Identified**:  
    - Patients (quicker access).  
    - Clinic staff (administrative burden).  
    - Department A (potential loss of slots).  
  - **Step 2: Impacts**:  
    - Patients: Wait times −3 days (gain).  
    - Staff: +2 hours/week scheduling (loss).  
    - Department A: May lose slots to Department B (loss).  
    - *Rejection Risk*: Uncompensated staff loss.  
  - **Step 3: Preferences**:  
    - **Evidence**: Staff survey: 80% support swapping if overtime is paid (compensation offered).  
    - **Value Judgment Sign-off**: None (evidence strong).  
  - **Step 4: Robustness**:  
    - Scenario: System outage → double-bookings. Staff loss worsens (no backup plan).  
    - **Result**: Fails (unmitigated harm).  
  - **Step 5: Net Improvement**:  
    - Patients gain, but staff loss requires compensation.  
  - **Outcome**: **Revise & Resubmit**. Address outage risk in Step 4 (e.g., add manual override).  

  ---

  ### **Limitations and Failure Points**  
  1. **What It Cannot Settle**:  
     - **Value conflicts**: E.g., if a loss is deemed "acceptable" without preference evidence (requires director judgment).  
     - **Non-preference trade-offs**: E.g., environmental impacts not tied to group preferences.  
     - **Intergenerational equity**: Long-term effects (e.g., climate) are hard to forecast.  

  2. **Where It Misfires**:  
     - **Overlooked groups**: Staff may miss subtle stakeholders (e.g., nearby businesses affected by bus changes).  
     - **Forecast errors**: Plausible scenarios may exclude rare events (e.g., pandemic disrupting clinics).  
     - **Compensation loopholes**: Non-monetary harms (e.g., stress) may be undervalued without preference data.  

  **Conclusion**: This procedure robustly screens for Pareto safety but requires diligent group identification and preference evidence. It rejects proposals with unvetted harms but cannot resolve ethical dilemmas beyond preferences. Director sign-off ensures accountability where facts end and values begin.
