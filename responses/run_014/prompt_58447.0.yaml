  **What the procedure cannot settle and where it is likely to misfire:**

  - **Cannot Settle**:
    1. **Deep value conflicts**: If there is a disagreement about what constitutes a "group" or how to define a group's preferences, especially when groups are heterogeneous.
    2. **Intertemporal trade-offs**: The procedure does not handle future generations or long-term effects well (e.g., environmental impacts far in the future).
    3. **Non-preference-based values**: If the council has commitments to fairness, rights, or environmental protection that go beyond the preferences of current groups, the procedure might not capture that.
