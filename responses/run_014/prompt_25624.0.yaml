prompt: |-
  I'm organizing a reading group of software engineers and data scientists who meet monthly to discuss decision theory. None of them have formal economics training, but they're comfortable with probability, expected value, and basic calculus. Next month I'm leading a session on Kelly betting and the idea that when you face a sequence of favorable repeated bets, you shouldn't maximize expected wealth — you should maximize expected geometric growth rate, which means betting a fraction of your bankroll rather than going all-in. The session is ninety minutes, and I'll have a whiteboard.

  Don't explain Kelly betting to me. I already understand it. Plan how I should teach it: the order in which the pieces must be introduced and what depends on what, the one worked example that should carry the entire session and what features it needs to have, the misconceptions this audience will predictably form and exactly where in the sequence I should head each one off, what I should explicitly refuse to cover at this level, and a check for understanding I can use near the end to see whether the core idea actually landed.

  I'm especially worried about a few traps. These people know enough math to follow a derivation but not enough to notice when a derivation is answering a different question than the one they thought they asked. They'll have seen expected-value reasoning before and will trust it. And at least two of them will have heard the phrase "Kelly criterion" from poker or sports betting and will arrive with half-remembered rules of thumb. I need the session to make them feel the problem viscerally before I give them the mathematics — otherwise the math will just feel like a clever trick whose motivation they accept on my say-so.

  End your response with a single sentence, on its own line, that summarizes the central pedagogical challenge this topic presents for this audience.
reasoning: |-
  We are introducing the Kelly criterion to an audience of software engineers and data scientists with strong math backgrounds but no formal economics training. The goal is to make them understand why maximizing expected wealth is not optimal for repeated bets and why maximizing the expected geometric growth rate (via fractional Kelly betting) is better. The session is 90 minutes.

  Core pedagogical challenge: They trust expected-value reasoning and might not see the problem with maximizing expected wealth in repeated bets. We need to make them feel the problem viscerally before diving into the math.

  Plan Outline:
  1. Start with a motivating example that shows the problem with maximizing expected wealth (all-in) in repeated bets.
  2. Introduce the concept of growth-optimal betting and the geometric mean.
  3. Derive the Kelly criterion for a simple biased coin.
  4. Discuss properties, misconceptions, and practical considerations.
  5. Check for understanding.

  Detailed Plan:

  I. Introduction and Motivating Example (20 minutes)
     A. Set up a simple, concrete example: a biased coin with known probabilities.
          - Coin flip: 60% chance of heads (win), 40% tails (loss).
          - If you bet and win, you double your money (so net gain equals bet). If you lose, you lose the bet.
          - You can bet any fraction of your current bankroll. What fraction should you bet each time?
     B. Ask the audience: What would you do? Why?
          - Expect some to say "all-in" because expected value of a single bet is positive: 0.6 * (double your bet) + 0.4 * (lose your bet) = 0.6 * (1) + 0.4 * (-1) = 0.2 per unit bet? Actually, if you bet fraction f, then:
            - If win: bankroll becomes 1 + f (because you gain f, so total becomes 1+f)
            - If lose: bankroll becomes 1 - f.
          - But note: If you bet your entire bankroll (f=1), then you have:
            - 60% chance of doubling (bankroll becomes 2) and 40% chance of going to 0.
          - Expected wealth after one bet: 0.6 * 2 + 0.4 * 0 = 1.2 -> positive.
     C. Now extend to two bets: 
          - Start with $1.
          - If you bet all-in on the first bet and win, you have $2. Then if you bet all-in again and win, you have $4. But if you lose the second bet, you go to $0.
          - If you lose the first bet, you go to $0 and stop.
          - So after two bets, possible outcomes:
            - Win, Win: $4 (probability 0.6 * 0.6 = 0.36)
            - Win, Lose: $0 (0.6 * 0.4 = 0.24)
            - Lose, Win: $0 (0.4 * 0.6 = 0.24) -> but actually you stop after first loss? Let's clarify: we are betting sequentially, so if you go broke, you stop.
            - Lose, Lose: $0 (0.4 * 0.4 = 0.16)
          - Expected wealth: 0.36 * 4 + (0.24+0.24+0.16)*0 = 1.44.
          - But now ask: what is the probability of ending up with $0? 1 - 0.36 = 0.64 -> very high.
          - The expected value is positive, but most of the time you end up broke. This is the key point: we care about not going broke because then you are out of the game.

     D. Now consider betting half your bankroll (f=0.5) each time.
          - After one bet: 
            - Win: 1 + 0.5 = 1.5
            - Lose: 1 - 0.5 = 0.5
          - After two bets:
            - Win, Win: 1.5 * 1.5 = 2.25? Actually, we are betting fractionally: starting with 1, after first win: 1.5, then bet half of 1.5 (which is 0.75) so after second win: 1.5 + 0.75? That's not right. Correction: when you bet a fraction f, the bankroll multiplies by (1+f) on win and (1-f) on loss.
            - So: 
              - Win then Win: 1 * (1+0.5) * (1+0.5) = 1 * 1.5 * 1.5 = 2.25
              - Win then Lose: 1 * 1.5 * (1-0.5) = 1.5 * 0.5 = 0.75
              - Lose then Win: 1 * 0.5 * 1.5 = 0.75
              - Lose then Lose: 1 * 0.5 * 0.5 = 0.25
          - Expected wealth: 0.36*2.25 + 0.24*0.75 + 0.24*0.75 + 0.16*0.25 = 
            = 0.36*2.25 + 0.48*0.75 + 0.16*0.25
            = 0.81 + 0.36 + 0.04 = 1.21
          - Compare to all-in: 1.44 vs 1.21 -> all-in has a higher expected wealth. But note: with all-in, 64% of the time you have $0, while with half-Kelly you always have positive money.

     E. The key insight: We are going to play many times. We care about the long-term growth. If we go broke, we can't continue. So we want a strategy that avoids ruin and maximizes the rate of growth.

     F. Now we introduce the geometric mean growth rate per bet. For a sequence of bets, the final bankroll is:
          B_n = B_0 * (1 + f)^W * (1 - f)^L
          where W = number of wins, L = number of losses, and n = W+L.
          The growth rate per bet is: (B_n / B_0)^(1/n) = [ (1+f)^W * (1-f)^L ]^(1/n)
          We can take log to make it additive:
          log(growth rate per bet) = (W/n) * log(1+f) + (L/n) * log(1-f)
          As n becomes large, by the law of large numbers, W/n -> p and L/n -> 1-p.
          So the long-term growth rate is: g(f) = p * log(1+f) + (1-p) * log(1-f)

     G. Now we can compute the expected growth rate for the two strategies in the example:
          For all-in (f=1): 
            g(1) = 0.6 * log(2) + 0.4 * log(0) -> log(0) is -infinity -> so the growth rate is negative infinity! (This is because when you lose, you go broke and cannot recover.)
          For f=0.5:
            g(0.5) = 0.6 * log(1.5) + 0.4 * log(0.5) 
                    = 0.6 * 0.4055 + 0.4 * (-0.6931) 
                    ≈ 0.2433 - 0.2772 = -0.0339 -> negative? But wait, that doesn't seem right because we saw that we end up with positive money. Actually, the calculation is for the asymptotic growth rate per bet. We must check the sign: negative growth rate means the bankroll shrinks on average? But in the two-bet example, we ended up with expected value above 1. However, note that expected value and growth rate are different.

          Actually, we need to maximize g(f). We'll compute the optimal f.

  II. Derivation of the Kelly Criterion (25 minutes)
     A. We have g(f) = p * log(1+f) + (1-p) * log(1-f)
     B. We want to maximize g(f) with respect to f (for 0 <= f < 1).
     C. Take derivative:
          g'(f) = p/(1+f) - (1-p)/(1-f)
     D. Set to zero: 
          p/(1+f) = (1-p)/(1-f)
          => p(1-f) = (1-p)(1+f)
          => p - p f = 1 + f - p - p f
          => p - p f = 1 - p + f - p f   [Wait, let me recast:]
          Actually: 
            p(1-f) = (1-p)(1+f)
            p - p f = 1 + f - p - p f
            p - p f = 1 - p + f - p f   [Combine like terms]
            => p - p f = 1 - p + f - p f
            => Add p f to both sides: p = 1 - p + f
            => f = 2p - 1
     E. In our example: p = 0.6, so f = 2*0.6 - 1 = 0.2.
     F. Now compute g(0.2):
          g(0.2) = 0.6 * log(1.2) + 0.4 * log(0.8)
                  = 0.6 * 0.1823 + 0.4 * (-0.2231)
                  ≈ 0.1094 - 0.0892 = 0.0202 -> positive growth.

     G. Now compare with f=0.5: we had a negative growth rate? Actually we computed -0.0339. And for f=0.2 we have positive 0.0202. So 0.2 is better.

     H. Also, we can check the expected value of one bet for f=0.2: 
          Expected value of multiplicative factor: 0.6*1.2 + 0.4*0.8 = 0.72 + 0.32 = 1.04 -> so each bet increases expected wealth by 4%. But note: this is the arithmetic mean. The geometric mean is what drives the long-term growth.

     I. The Kelly fraction f = p - q (in this case p - (1-p) = 2p-1) for even payoffs.

  III. Properties and Misconceptions (20 minutes)
     A. Why not bet more than Kelly? (Too risky)
          - Show g(f) for f>0.2 in our example, e.g., f=0.5: we saw negative growth. Also, f=0.4: 
            g(0.4) = 0.6*log(1.4)+0.4*log(0.6) ≈ 0.6*0.3365 + 0.4*(-0.5108) ≈ 0.2019 - 0.2043 = -0.0024 -> negative.
          - So betting more than Kelly reduces the growth rate and may even make it negative.

     B. Why not bet less than Kelly? (Too conservative)
          - The growth rate is lower than optimal. For example, f=0.1:
            g(0.1)=0.6*log(1.1)+0.4*log(0.9)≈0.6*0.0953+0.4*(-0.1054)=0.0572-0.0422=0.015 -> less than 0.0202.

     C. The trade-off: higher volatility vs growth. Kelly maximizes growth but might be too volatile for some. Hence, fractional Kelly (bet a fraction of the Kelly fraction) is sometimes used.

     D. Misconception: Kelly is only for gambling.
          - Actually, it applies to any situation with repeated investment decisions with known edge and independent bets.

     E. Misconception: Kelly guarantees you won't go broke.
          - Actually, if you bet exactly the Kelly fraction, the probability of going broke is zero (if p>0.5 and f<1). But note: in the real world, if the outcomes are not exactly independent and identically distributed, or if you have estimation error, you might still go broke.

     F. Misconception: Kelly is only for even payoffs.
          - We can generalize to any payoff. For example, if when you win you get b-to-1 (so for each dollar bet, you win b dollars and get your dollar back), then the optimal fraction is: f = (p * (b+1) - 1) / b = p - q/b. But we won't derive that in this session.

     G. How to handle multiple simultaneous bets? (Complex, we skip for now.)

  IV. Check for Understanding (15 minutes)
     A. Pose a new problem: 
          - A die is rolled. If it comes up 1 (probability 1/6), you lose your bet. Otherwise (5/6), you win and get 5 times your bet (so you net 5 times the bet, plus you get the bet back). What fraction of your bankroll should you bet?
          - Steps:
            1. Identify p = 5/6, and the net gain on win: if you bet $1, on win you get $5 (plus your $1 back) so total $6? Actually, the payoff is 5-to-1: so if you win, you get 5 times the bet in profit plus the original bet. So the multiplicative factor for win: 1 + 5f. On loss: 1 - f.
            2. The Kelly fraction: f = [p*(b+1) - 1] / b, but we haven't covered that. Alternatively, we can derive from the log growth:
               g(f) = p * log(1 + b*f) + (1-p) * log(1 - f)
                     = (5/6)*log(1+5f) + (1/6)*log(1-f)
            3. Take derivative: 
               g'(f) = (5/6) * (5)/(1+5f) - (1/6)/(1-f)
                      = (25/6)/(1+5f) - (1/6)/(1-f)
            4. Set to zero:
               (25/6)/(1+5f) = (1/6)/(1-f)
               => 25/(1+5f) = 1/(1-f)
               => 25(1-f) = 1+5f
               => 25 - 25f = 1 + 5f
               => 24 = 30f
               => f = 24/30 = 0.8

          - But note: 0.8 is very high! Check the loss probability: 1/6. So 1/6 of the time you lose 80% of your bankroll. But the growth rate is maximized at this fraction.

          - Now, ask: what is the expected value of a single bet? 
            If you bet 1 unit: 
              (5/6)*5 - (1/6)*1 = (25/6) - (1/6) = 24/6 = 4. So expected profit is 4 units. 
            So the expected multiplicative factor: 1 + 4f? Actually, it's (5/6)*(1+5f) + (1/6)*(1-f) = 1 + (5/6)*5f - (1/6)f = 1 + (25f - f)/6 = 1 + 24f/6 = 1 + 4f -> so expected value is 1+4f. 
            This is positive for any f>0. But if you bet f=1: 
              Win: bankroll becomes 6, loss: bankroll becomes 0. 
              Expected value: 5/6*6 + 1/6*0 = 5 -> which is 5 times the initial bankroll? But wait, initial bankroll is 1 -> expected value 5. 
            However, the growth rate for f=1: 
              g(1) = (5/6)*log(6) + (1/6)*log(0) -> which is -infinity.

          - Therefore, the Kelly fraction is 0.8. 

     B. Ask the audience: what would happen if you bet more than 0.8? (e.g., f=0.9)
          - g(0.9) = (5/6)*log(1+5*0.9) + (1/6)*log(1-0.9) = (5/6)*log(5.5) + (1/6)*log(0.1)
                    ≈ (5/6)*1.7047 + (1/6)*(-2.3026) 
                    ≈ 1.4206 - 0.3838 = 1.0368? Wait, that positive? But note: log(5.5) is about 1.7047, and log(0.1) is -2.3026. Then (5/6)*1.7047 ≈ 1.4206, and (1/6)*(-2.3026)≈-0.3838, so 1.0368? That doesn't make sense because the growth rate per bet should be in the same unit as log. But let me check: 
            Actually, 1.4206 - 0.3838 = 1.0368? But that is positive? But we know that if f>0.8, the derivative would be negative? So let's compute the derivative at f=0.8 and then at f=0.9.

          Alternatively, let me compute the exact value of g(0.8) and g(0.9):
            g(0.8) = (5/6)*log(1+4) + (1/6)*log(0.2) 
                    = (5/6)*log(5) + (1/6)*log(0.2)
                    ≈ (5/6)*1.6094 + (1/6)*(-1.6094) 
                    = (1.6094/6)*(5 - 1) = (1.6094*4)/6 ≈ 6.4376/6 ≈ 1.0729? That can't be because the log of the multiplicative factor per bet should be less than 1? Actually, we are computing the expected log return per bet. 

          I think I made a mistake: the log of the multiplicative factor per bet is a number that can be positive or negative. In the die example, let me recast:

            For f=0.8: 
              win: 1+5*0.8 = 5 -> so the factor is 5, log(5)≈1.6094
              loss: 1-0.8=0.2, log(0.2)≈-1.6094
              g(0.8) = (5/6)*1.6094 + (1/6)*(-1.6094) = (1.6094)*(5/6 - 1/6) = (1.6094)*(4/6)= (1.6094)*(2/3)≈1.0729? That is positive and large? 

          But wait, the expected log is positive? That means the bankroll grows exponentially? 

          Now for f=0.9:
              win: 1+5*0.9 = 5.5 -> log(5.5)≈1.7047
              loss: 1-0.9=0.1 -> log(0.1)≈-2.3026
              g(0.9)= (5/6)*1.7047 + (1/6)*(-2.3026) 
                     = (5*1.7047 - 2.3026)/6 
                     = (8.5235 - 2.3026)/6 = 6.2209/6 ≈ 1.0368 -> which is still positive? But we expected it to be less than at f=0.8? 

          Actually, let me compute the derivative at f=0.8 and f=0.9 to see the sign.

          Alternatively, we can note that the maximum is at f=0.8, so g(0.9) should be less than g(0.8). But 1.0368 < 1.0729? Actually, 1.0368 is less than 1.0729? Then it is lower? So that's consistent.

          But note: both are positive? So why is f=0.8 better? Because 1.0729 > 1.0368? But wait, the units are in nats per bet? Actually, the growth rate is 1.0729 nats per bet? That would imply exponential growth by a factor of e^1.0729 per bet? That seems too high. 

          Correction: I think I made a mistake in the calculation of g(0.8). The formula is:
            g(f) = (5/6)*log(1+5f) + (1/6)*log(1-f)
            For f=0.8:
              = (5/6)*log(5) + (1/6)*log(0.2)
              log(5)=ln(5)≈1.6094, log(0.2)=ln(0.2)≈-1.6094? Actually, ln(0.2)=ln(1/5)=-ln(5)≈-1.6094.
            So: (5/6)*1.6094 = 1.3412, and (1/6)*(-1.6094)≈-0.2682, so g(0.8)=1.3412-0.2682=1.073? That can't be because the maximum possible per bet if you never lost would be log(6) (if you bet everything and win) which is about 1.7918. But 1.073 is less than that. However, note that we have losses 1/6 of the time. 

          But the key point: the growth rate at f=0.8 is positive and at f=0.9 is lower. 

          However, note that if you bet f=1, then g(1)= (5/6)*log(6) + (1/6)*log(0) -> negative infinity.

          So the point is that even though the expected value is high for high f, the risk of ruin (or near ruin) drags down the growth rate.

  V. Wrap-up (10 minutes)
     A. Summarize: 
          - For repeated bets, we care about the long-term growth rate, which is the expected log return per bet.
          - The Kelly criterion tells us the fraction to bet to maximize that growth rate.
          - Betting more than Kelly is overbetting and reduces growth and increases risk of ruin.
          - Betting less than Kelly is underbetting and gives suboptimal growth.

     B. What we didn't cover: 
          - Multiple bets (correlated or simultaneous)
          - Uncertain probabilities (we assumed known p)
          - Risk aversion (Kelly is for maximizing growth, but if you are risk averse you might want less volatility)

     C. Final thought: In practice, many use half-Kelly to reduce volatility while capturing most of the growth.

  Central pedagogical challenge: Overcoming the intuitive trust in expected value maximization by demonstrating the risk of ruin in repeated bets and establishing the geometric mean growth rate as the appropriate objective.
answer: |-
  ### Teaching Plan for Kelly Betting Session

  #### **Session Structure & Timing (90 Minutes Total)**
  1. **Problem Setup & Intuitive Trap (15 min)**  
     - Start with a relatable coin-flip example: 60% chance of heads (win double your bet), 40% tails (lose the bet).  
     - Ask: *"If you start with $100 and play 100 times, what fraction of your bankroll would you bet each time?"*  
     - **Trap Prediction:** Most will say "all-in" (fraction = 1.0) due to expected-value reasoning:  
       *Single-bet EV = (0.6 × 2) + (0.4 × 0) = 1.2x > 1.*  
     - **Head off misconception:** Simulate two all-in bets on the whiteboard:  
       - Win/Win: $400 (prob = 0.36)  
       - Win/Lose or Lose/Win: $0 (prob = 0.48)  
       - Lose/Lose: $0 (prob = 0.16)  
       *→ Expected wealth = $144, but 64% chance of ruin. Visceral takeaway: EV maximization risks total loss.*

  2. **Geometric Growth Rate Introduction (20 min)**  
     - Contrast with a fractional bet (e.g., 50% of bankroll):  
       - Outcomes after two bets:  
         Win/Win: $225  
         Win/Lose: $75  
         Lose/Win: $75  
         Lose/Lose: $25  
       *→ No ruin, but lower EV ($121).*  
     - **Key insight:** Long-term growth depends on *multiplicative* outcomes. Introduce the **growth rate per bet**:  
       \( g(f) = \text{average of } \log(1 + \text{profit}) \).  
       - For fraction \( f \): \( g(f) = p \log(1 + f) + (1 - p) \log(1 - f) \).  
     - **Head off misconception:** Emphasize \( \log \) transforms multiplication into additive growth (critical for repeated bets).

  3. **Derivation of Kelly Criterion (25 min)**  
     - Maximize \( g(f) \) for the coin flip:  
       - Solve \( \frac{d}{df} g(f) = 0 \) → \( \frac{p}{1+f} - \frac{1-p}{1-f} = 0 \) → \( f^* = 2p - 1 \).  
       - For p=0.6, \( f^* = 0.2 \).  
     - **Worked example:** Show growth rates:  
       - \( f = 0.2 \): \( g = 0.6 \log(1.2) + 0.4 \log(0.8) \approx 0.02 \)  
       - \( f = 1.0 \): \( g = -\infty \) (ruin)  
       - \( f = 0.5 \): \( g \approx -0.03 \) (negative growth).  
     - **Head off misconception:** Explicitly map the derivation back to the original problem:  
       *"We’re maximizing long-term growth, not one-time wealth."*

  4. **Misconceptions & Practical Nuances (15 min)**  
     - **Trap: "Half-Kelly from poker" rules of thumb:**  
       - Acknowledge their existence but defer discussion (state: "We’ll revisit in Q&A, not core today").  
     - **Critical clarifications:**  
       - *Overbetting (f > f*)*: Show g(f) decreases for f > 0.2 (e.g., f=0.4 → g≈−0.002).  
       - *Underbetting (f < f*)*: Safe but suboptimal (e.g., f=0.1 → g≈0.015 < 0.02).  
       - *Edge cases:* p ≤ 0.5 → f* = 0 (no bet).  
     - **What we skip:**  
       - Variable payoffs, correlated bets, or uncertain probabilities.  
       - Risk aversion (mention "half-Kelly reduces volatility" but no math).

  5. **Check for Understanding (15 min)**  
     - **Problem:** A stock has 70% chance to 2x (win +100%), 30% chance to 0.5x (lose 50%). Find f*.  
       - *Correct approach:*  
         \( g(f) = 0.7 \log(1 + f) + 0.3 \log(1 - 0.5f) \)  
         Maximize → \( f^* \approx 0.3 \) (solution via derivative or numerical estimate).  
       - *Predicted mistake:* Using EV (f=1.0 → ruin).  
     - **Success metric:** >80% of the group solves this correctly.

  ---

  #### **Central Pedagogical Challenge**
  Making the failure of expected-value maximization viscerally felt *before* introducing the geometric growth framework, to prevent the math from appearing as a disconnected trick.
