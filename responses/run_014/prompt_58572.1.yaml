answer: |-
  My dear interlocutor, your scenario pains me, yet duty remains clear. Even if silence reveals your friend's presence through common knowledge, you must not lie. Your silence is materially truthful—you refuse to confirm a falsehood or deny a truth. The murderer's inference stems from *his* knowledge and *his* evil intent, not from any false declaration of yours. To lie, however, would actively misuse your faculty of communication, whose very purpose is truth. You would treat the murderer—and indeed humanity in his person—merely as a means, violating the categorical imperative. The moral law commands: "Do not lie," unconditionally. Your duty is to your own integrity; consequences are for Providence. A lie corrupts the ground of all duties, even to save life.
