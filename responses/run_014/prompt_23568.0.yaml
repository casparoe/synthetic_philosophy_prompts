prompt: |-
  I am moderating the audience Q&A for a colloquium in the history and philosophy of science. Our guest has just published a book arguing that Johannes Kepler's attempt to ground astrology in natural causes is a coherent proto-physical theory rather than a residue of pre-scientific superstition: specifically, that planetary influence is a radiant force emitted by the planets, distributed through the world-soul as a mediating medium, that the harmonic ratios between planetary motions determine which aspects are genuinely active, and that the configuration at the moment of the nativity leaves a lasting imprint on the new-born soul. I would like a sequence of six to eight questions that go beyond having her restate that claim. I need at least one question each on (i) how the radiant-force mechanism is supposed to function as a physical carrier, and how it is to be reconciled with the magnetic-vis account of the Earth's motion in his planetary theory; (ii) why the instant of the nativity is the decisive moment, and what role the "soul of the earth" is supposed to play in registering the configuration; (iii) his rejection of the traditional essential and accidental dignities in favor of the harmonic-ratio account of aspects, and whether that account is genuinely more predictive than the rules it displaces; and (iv) the theological difficulty, given his Lutheran commitments, of how astrologically shaped dispositions are compatible with free will and divine foreknowledge. For each question, append a single follow-up sentence keyed to the answer she is most likely to give, so that I can press her at the point where the position is actually most vulnerable.
