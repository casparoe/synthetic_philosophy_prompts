  Below is a one-page decision tree designed to guide your reading group through responses to the Liar Paradox. It starts from a shared commitment to the ordinary truth schema and treats the liar as a problem. Each node is a question about the phenomenon, forcing explicit choices without naming schools. Cases (truth-teller, infinite chain, contingent liar, Curry, revenge) are integrated into the nodes. Leaves are labeled with standard positions and include their hardest commitment. Indistinguishable pairs are marked (e.g., gap/glut theories share answers until Node 6). The tree fits 8 leaves and 7 nodes.

  ---

  **STARTING POINT**  
  *I accept the truth schema: "S is true iff S" (e.g., "snow is white" is true iff snow is white). I take the liar ("This sentence is false") to threaten this schema.*

  ### **NODE 1: What breaks the truth schema?**  
  - **A: Nothing breaks it—the reasoning is sound, so we must accept its conclusion.**  
    → Go to Node 2  
  - **B: Something is flawed—we must reject/restrict a premise or rule.**  
    → Go to Node 3  

  ---

  ### **NODE 2 (A: Sound reasoning): What is the liar’s status?**  
  *Consider: If the liar is both true and false, does "1=0" follow? (Curry)*  
  - **A: The liar is neither true nor false (a gap).**  
    → Go to Node 4  
  - **B: The liar is both true and false (a glut).**  
    → Go to Node 5  

  ---

  ### **NODE 3 (B: Flawed reasoning): Where is the flaw?**  
  *Consider: A sentence saying "The next sentence is false" infinitely—no self-reference, yet paradoxical.*  
  - **A: The truth schema itself fails for some sentences.**  
    → Go to Node 6  
  - **B: Self-reference/circularity is illegitimate or misfiring.**  
    → Go to Node 7  
  - **C: The logic’s inference rules (e.g., reductio, contraction) are invalid here.**  
    → *Leaf: **Substructural***  
    *Hardest commitment: We must abandon basic structural rules (e.g., "if P→(P→Q), then P→Q"), making reasoning context-dependent and non-monotonic.*

  ---

  ### **NODE 4 (A: Gap): Why is the gap unavoidable?**  
  *Consider: The truth-teller ("This sentence is true") is also ungrounded—why is it non-paradoxical?*  
  - **A: Truth is partial—ungrounded sentences lack a value.**  
    → *Leaf: **Fixed Point (Partial Truth)***  
    *Hardest commitment: Classical logic fails (e.g., excluded middle); truth-teller and liar share the same valueless status.*  
  - **B: Truth requires a new logic—gaps demand a revised conditional.**  
    → *Leaf: **Paracomplete (with Conditional)***  
    *Hardest commitment: We must accept a non-classical conditional (e.g., where "if gap, then Q" can be true) to block Curry and revenge.*

  ---

  ### **NODE 5 (B: Glut): How do gluts avoid triviality?**  
  *Consider: If "true contradiction" is possible, why doesn’t "1=0" follow?*  
  - **A: Paraconsistent logic blocks explosion (P∧¬P→Q fails).**  
    → *Leaf: **Paraconsistent Dialetheism***  
    *Hardest commitment: Some contradictions (like the liar) are true; truth is inconsistent but non-trivial.*

  ---

  ### **NODE 6 (A: Schema fails): Why restrict the schema?**  
  *Consider: A sentence saying "Snow is white but this sentence is false"—contingent self-reference.*  
  - **A: Truth is hierarchical—no language contains its own truth predicate.**  
    → *Leaf: **Hierarchical (Tarskian)***  
    *Hardest commitment: We cannot state the full truth schema for our language—only fragments in higher metalanguages.*  
  - **B: Truth is deflationary—a device for generalization, not robust "correspondence."**  
    → *Leaf: **Deflationism***  
    *Hardest commitment: The truth schema only applies to sentences without semantic vocabulary, limiting expressive power (e.g., "all theorems are true" is inexpressible).*  
  - **C: Truth is incoherent—abandon the concept.**  
    → *Leaf: **Incoherentism***  
    *Hardest commitment: Truth must be replaced (e.g., with "warranted assertibility"); no theory captures its essence. [Thinly populated: likely unattractive/unexamined.]*

  ---

  ### **NODE 7 (B: Self-reference flawed): What makes it defective?**  
  *Consider: The revenge sentence ("This sentence is not true in theory T") challenges theory T.*  
  - **A: Circular reference shifts context—truth is assessment-sensitive.**  
    → *Leaf: **Contextualism***  
    *Hardest commitment: The liar’s truth-value changes with conversational context; no stable "meta" perspective blocks revenge.*  
  - **B: Circular sentences lack fixed points—truth is a dynamic process.**  
    → *Leaf: **Revision Theory***  
    *Hardest commitment: Truth has no fixed extension (liar oscillates between true/false); classical logic holds for stable sentences only.*

  ---

  ### **INDISTINGUISHABLE PAIRS & NOTES**  
  - **Gap vs. Glut (Nodes 2,4,5):** Both accept non-classical values but split on Node 2’s choice (gap/glut). They answer all other nodes identically.  
  - **Fixed Point vs. Paracomplete (Node 4):** Both accept gaps but split on whether a new conditional is needed to handle Curry/revenge.  
  - **Contextualism vs. Revision (Node 7):** Both blame circularity but split on whether context shift (Contextualism) or dynamic revision (Revision) resolves revenge.  
  - **Unpopulated Leaf:** Incoherentism (Node 6C) is marked due to unattractiveness (truth is indispensable in logic/metaphysics).  
  - **Cases Covered:**  
    - Truth-teller (Node 4): Ungrounded but non-paradoxical.  
    - Infinite chain (Node 3): Paradox without self-reference.  
    - Contingent liar (Node 6): Blames schema (not self-reference).  
    - Curry (Nodes 4,5): Forces gap/glut theories to address conditionals.  
    - Revenge (Node 7): Tests expressive limits.  

