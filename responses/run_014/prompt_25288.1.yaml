prompt: |-
  I'm a PhD student in philosophy working on animal ethics, and my advisor drops these casual verdicts on moral status all the time but wont just tell me her principle. I've been writing them down. Here's what I have so far—all about *direct* moral considerability, not instrumental or indirect value:

  - Human: full
  - Chimpanzee: full
  - Elephant: full
  - Dolphin: full
  - Dog: substantial
  - Pig: substantial
  - Octopus: substantial (she's wierdly insistent about this one)
  - Salmon: minimal but nonzero
  - Frog: minimal but nonzero
  - Honeybee: none
  - Ant: none
  - Sperm whale: substantial but not full (this one surprised me—biggest brain on earth!)
  - Human with anencephaly (born without cerebral cortex): none
  - Human with severe microcephaly (~400cc brain, moderate intellectual disability, but conscious and socially engaged): full

  I'm trying to figure out what rule generates these before I bring her a new case. The new case: a neuroscientist I know described a hypothetical that's basically the inverse of microcephaly—a person with a brain the size of a mouse's (~0.5g) but with radically dense neural packing and organization that somehow produces fully normal human cognition, emotion, and self-awareness. So: mouse-sized brain, human-level mind. What would my advisor say about this being's moral status?

  Give me a JSON object with:
  - "candidate_rules": array of at least three distinct principles consistent with all her verdicts. Each object has "name", "statement" (one sentence), and "prediction" for the new case.
  - "best_guess": object with "rule_name" and "reasoning" for why this rule fits her pattern better than alternatives.
  - "test_case": object with "description" (a further case that discriminates the candidate rules) and "predictions" (map from rule names to verdicts).
  - "adjudication": object with "verdict" (what consistency recommends) and "closest_precedent" (which existing verdict is the best analog).

  Respond in the style of an expert philosopher. Think very carefully—the point is to identify principles that genuinely fit all the data and cases that genuinely tell them apart.
