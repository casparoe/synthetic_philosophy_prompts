  - One central example (non-lottery) demonstrating a sure-loss scenario
  - Common misconceptions addressed proactively
  - One diagnostic end-question to test conceptual understanding
  - Clear boundaries on what to omit

  Hmm, the key challenge is making utility click when students see it as arbitrary. Need to show how it operationalizes preferences. Also must avoid conflating coherence with full rationality - that's a major pitfall.

  For the sequence: Must start with betting behavior since Dutch books are about willingness to bet. Then introduce scoring preferences via money pumps before defining coherence. The example should feel real - maybe a concert ticket with weather uncertainty? 

  Ah! A smartphone pre-order scenario: 
  - Store credit vs cash refund options 
  - Contradictory choices that enable a Dutch book 
  Perfect - involves sunk costs, relatable dilemma, and clear sure-loss via combined bets.

  Misconceptions to target: 
  1. "Dutch book possibility = irrational" → Clarify it's about vulnerability, not inevitable loss 
  2. "Coherence = full rationality" → Emphasize it's necessary but not sufficient 
  Should wedge these in right after proving the Dutch book theorem.

  End-question idea: "If someone violates transitivity but you can't Dutch book them, are they coherent?" Tests if they get the definitional boundary.

  Hard stops: 
  No axiomatic derivations (Savage etc.) 
  No empirical utility measurement 
  No counterarguments (e.g., risk-loving rationality) 
  Stick to the proof structure only.

  *adjusts glasses* Now structuring the 50 minutes: 
  First 10 mins: Betting preferences setup 
  Next 15: Build Dutch book via smartphone example 
  Then 10: Coherence definition and theorem statement 
  5 mins: Actively debunk misconceptions 
  Final 10: Discussion + diagnostic question 

  The smartphone case must include: 
  - Three logically connected choices 
  - Exploitable contradiction 
  - Demonstrable sure-loss contract 
  And crucially avoid: 
  - Complex probabilities 
  - Actual money sums (use utils) 
  - Any whiff of gambling ethics 

  *checks watch* Better include why we refuse certain topics: Time constraints, foundational focus, and avoiding overclaiming the theorem's scope. The diagnostic question is gold - if they can't handle the transitivity loophole, they've memorized not internalized. 

  Final polish: Stress that utility is revealed through choice, not assumed. That's the linchpin.
answer: |-
  ### Lesson Plan: Coherence & Dutch Book Arguments for Expected Utility  
  **Time:** 50 minutes  
  **Target:** 1st-year Philosophy/Econ students  
  **Prior Knowledge:** Basic expected value (EV), probabilities as numbers. *No prior utility/coherence knowledge*.  

  ---

  ### **Sequence & Rationale**  
  *(Logical dependencies: Each step builds on the last; betting preferences → vulnerability → coherence → normative force.)*  

  1. **Start with Betting Behavior (5 min)**  
     - **Why:** Students intuitively grasp "betting odds." Use this to **reveal preferences**.  
     - **Key Point:** People accept/reject bets based on personal valuation (utility).  
     - **Set Up:** "You’re not just valuing money—you’re valuing *outcomes* under uncertainty. Utility quantifies this."  

  2. **Introduce a "Money Pump" Scenario (10 min)**  
     - **Carrying Example:** **Smartphone Insurance Dilemma**  
       - *Setup:*  
         - Your $1,000 phone has a 10% chance of breaking tomorrow.  
         - You’re offered:  
           - **Bet A:** Pay $110 now to get $1,000 if it breaks (repair insurance).  
           - **Bet B:** Pay $100 now to get $1,000 if it breaks (discounted insurance).  
       - *Student’s choices:*  
         - You *reject Bet A* (too expensive).  
         - You *accept Bet B* (fair price).  
       - *Contradiction:*  
         - Now the seller offers: "Pay me $10 now to *switch* from Bet A to Bet B." You accept (since Bet B is better).  
         - **Result:** You paid $10 + $100 = $110 total for Bet B... which is *identical* to Bet A! You were *pumped* for $10.  
     - **Why this example:**  
       - No lottery—real-life insurance choice.  
       - Shows *incoherent preferences* (valuing identical outcomes differently).  
       - Visualizable sure loss via "paying to switch."  

  3. **Define Coherence (5 min)**  
     - **Definition:** Preferences are *coherent* if no set of choices leads to a sure loss (Dutch book).  
     - **Connect to Example:** Your choices in the phone case allow a sure loss ($10) → incoherent.  
     - **Theorem:** *If your degrees of belief (credences) violate probability laws OR utilities violate scaling, a Dutch book exists.*  

  4. **Build the Full Dutch Book (15 min)**  
     - **Expand the Example:** Add weather uncertainty.  
       - *Scenario:* You plan to bike to a concert (50% rain chance).  
       - *Choices:*  
         - Pay $20 for a refundable ticket (lose $20 if sunny, get $80 back if rainy).  
         - Pay $15 for a non-refundable ticket (lose $15 if sunny, lose $15 + concert if rainy).  
       - *Incoherence:*  
         - You buy the refundable ticket ("I hate losing money in rain!").  
         - When sunny, you pay $5 to "downgrade" to non-refundable ticket (to "save" $15).  
       - **Dutch Book:**  
         - Seller sells refundable ticket ($20) + sunny-day "downgrade fee" ($5).  
         - You lose $25 total. If rainy, you lose $20; if sunny, you lose $25. *Sure loss regardless of weather.*  
     - **Why:** Shows how *violating probability* (misjudging rain risk) or *inconsistent utility* (overvaluing refunds) enables exploitation.  

  5. **Utility’s Role (5 min)**  
     - **Clarify:** Utility isn’t "happiness"—it’s a numeric scaling of *choices under risk*.  
       - "You rejected Bet A but paid to get Bet B? Your *revealed utilities* are inconsistent."  
     - **Why coherence demands EU maximization:**  
       - Coherent preferences *must* behave *as if* maximizing expected utility (representation theorem preview).  

  ---

  ### **Debunk Misconceptions Proactively**  
  *(Interrupt during steps 3–4 when terms are defined)*  

  1. **"Dutch book possibility = irrationality"**  
     - **When:** After defining coherence (Step 3).  
     - **Head off:** "A Dutch book shows you’re *vulnerable* to exploitation—not that you’ve been exploited. Rationality is broader (e.g., evidence responsiveness). Coherence is a *necessary floor*."  

  2. **"Coherence = full rationality"**  
     - **When:** After the concert ticket Dutch book (Step 4).  
     - **Head off:** "Coherence stops you from taking sure losses—but you could still have irrational beliefs (e.g., ignoring evidence). It’s a *minimal standard*, not the whole picture."  

  ---

  ### **Diagnostic End Question**  
  **Ask:** *"Suppose someone says, ‘I prefer A to B, B to C, and C to A.’ Is this incoherent? Could a bookie Dutch book them? Why/why not?"*  
  - **Why it works:**  
    - Tests understanding of *transitivity* as a coherence requirement.  
    - If they say "yes, Dutch bookable," they get it (cyclic preferences enable sure-loss sequences).  
    - If they *only* cite the cycle without linking to sure loss, they memorized without internalizing.  

  ---

  ### **Openly Refuse to Cover**  
  **Explicitly omit:**  
  1. **Axiomatic derivations of EU (e.g., von Neumann-Morgenstern).**  
     - *Why:* Requires deeper math; distracts from coherence’s betting intuition.  
  2. **Empirical utility measurement.**  
     - *Why:* This is a normative argument—not "how we measure utility."  
  3. **Objections (e.g., risk-loving rationality).**  
     - *Why:* Time constraints; save for future classes on critiques (Allais paradox, etc.).  

  ---

  ### **Why This Structure Works**  
  - **Flow:** Starts concrete (betting), reveals incoherence via money pump, generalizes to Dutch books, then zooms out to utility’s role.  
  - **Example design:** Smartphone/concert cases lack "boring" lotteries—they involve sunk costs, refunds, and switching fees, forcing students to confront *revealed* preferences.  
  - **Pacing:** 70% on examples (concrete before abstract), 30% on concepts/misconceptions.  

  **Teaching tone:** Use Socratic questions ("What choice just cost you $10?"). Hammer the point: *Coherence isn’t about being smart—it’s about not being a money pump.*
