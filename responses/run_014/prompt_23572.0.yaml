answer: |-
  Based on Hobbes's core philosophical commitments as expressed primarily in *De Corpore* and his disputes with Wallis, here is a reconstructed analysis of his likely reaction to the computational turn, arguing both sides before concluding:

  **The Case for Enthusiasm: A Vindication of Reckoning**

  1.  **Knowledge as Computation Realized:** Hobbes's most fundamental tenet is that "**REASON** ... is nothing but *Reckoning*" (*De Corpore*, I.1.2). He viewed all knowledge, especially mathematics, as computational: "When a man *Reasoneth*, hee does nothing else but conceive a summe totall, from *Addition* of parcels; or conceive a Remainder, from *Substraction* of one summe from another" (*Leviathan*, V). Modern proof assistants like Lean embody this ideal perfectly. They reduce proof to explicit, step-by-step symbolic computation based on defined rules. A machine-verified proof (like Feit-Thompson) is the ultimate expression of "reckoning" – a calculation yielding absolute certainty. Hobbes would likely see this as the triumphant realization of his epistemology: certainty *is* computational verification.

  2.  **Settling Disputes via Formalization:** His bitter dispute with Wallis centered on foundational disagreements about definitions, constructions, and what constituted valid proof (e.g., circle quadrature). Wallis used algebraic methods and limits Hobbes deemed illegitimate "insignificant speech" lacking clear definitions or constructive foundations. Hobbes would argue that formalizing both positions in a system like Lean would have definitively settled the issue. If Wallis's quadrature "proof" relied on non-constructive infinities or undefined terms (as Hobbes claimed), the formal system would expose it as unprovable from the agreed axioms and definitions. This mechanized arbitration aligns perfectly with Hobbes's view that disputes stem from "the want of right Definitions" (*De Corpore*, I.VI.15) and that computation based on definitions resolves them.

  3.  **The Primacy of Definitions and Minimal Foundations:** Hobbes insisted geometry must be built from "a few Definitions, and those most evident, and most agreeable to all mens understanding" (*Six Lessons*, Epistle Dedicatory). His reconstruction project aimed for minimal, clear foundations. Modern formalizations of Euclid (e.g., in Lean/Coq) achieve precisely this: they rigorously define primitive concepts (points, lines, incidence, congruence) and axioms, deriving all theorems computationally from them. Hobbes would likely see this as a powerful vindication of his core methodological demand – geometry *is* reducible to definitions and postulates, and its certainty flows from computation upon them.

  4.  **Eliminating "Insignificant Speech":** Hobbes railed against scholastic terms lacking clear definitions tied to conceivable constructions ("bodies in motion"). He saw Wallis's algebra and calculus as falling into this trap. Proof assistants enforce *absolute* definitional precision. Every symbol, function, and type must be explicitly defined or constructed from primitives before use. Terms that "signifie nothing" simply cannot be introduced or reasoned with in the system. This rigorous exclusion of undefined jargon would resonate deeply with Hobbes's anti-scholastic crusade.

  **The Case for Skepticism: A Betrayal of Human Understanding and Construction**

  1.  **Knowledge Requires Human Comprehension:** For Hobbes, knowledge isn't *just* computation; it's computation *by a reasoning mind* grounded in sensory experience and language. "No Discourse whatsoever, can End in absolute Knowledge of Fact... but onely in BELIEFE" except for "the Knowledge of Consequences; which is called SCIENCE" (*Leviathan*, VII). But science is *human* reckoning: "The Light of humane minds is Perspicuous Words... For words are wise mens counters... but the money of fooles" (*Leviathan*, IV). A proof so vast and complex that no human can comprehend it (like Feit-Thompson's verification) might not qualify as *knowledge* for Hobbes. If no mind can "reckon" the steps, is it truly reasoned science, or just a mechanical output? He might dismiss it as analogous to an oracle – producing truth without the essential human act of understanding.

  2.  **The Loss of Constructive Meaning:** Hobbes's geometry was fundamentally *constructive* and tied to physical motion. Definitions weren't abstract; they described idealized physical operations (e.g., a line is "the way of a Point"; generation by motion). Proofs involved showing *how to build* the figure (*De Corpore*, III.15-16). Formalizations like those in type theory, while rigorous, are highly abstract and symbolic. The connection to sensory experience, motion, and concrete construction is severed. The "points" and "lines" are formal objects manipulated by syntactic rules, not idealized representations of bodies moved in space. Hobbes might argue this formalism has smuggled in a new kind of "insignificant speech" – symbols manipulated perfectly but devoid of their original, constructive, sensory meaning. It risks becoming the very "Idolatry of the Geometers" he accused Wallis of promoting (*Six Lessons*).

  3.  **Betrayal of Euclid's (Hobbesian) Spirit:** While formalizing Euclid uses definitions and computation, Hobbes might see it as betraying Euclid's *constructive* spirit, which he believed his own reconstruction captured better. Euclid's proofs, for Hobbes, were demonstrations of *how to make* figures. Modern formal proofs are sequences of logical inferences. The physical, operational essence is lost in the symbol manipulation. Hobbes's project aimed to make this constructive foundation *more* explicit and rigorous, not reduce it to abstract syntax detached from conceivable generation by motion.

  4.  **Potential for New "Insignificant" Abstractions:** Type theory itself, with its hierarchies of types, dependent types, and complex inference rules, might appear to Hobbes as a new, sophisticated form of scholasticism. Terms like `Type u`, dependent pairs, or complex inductive definitions, while rigorously formalized, could be seen by him as abstract entities lacking clear connection to the "bodies in motion" that grounded his philosophy. The formalism, despite its precision, might feel like a realm of abstract entities he explicitly rejected.

  **Synthesis: Calculative Triumph with a Human Cost - Leaning Towards Vindication**

  *   **Stronger Support:** The textual evidence leans **significantly towards enthusiasm**. The core of Hobbes's epistemology – "knowledge is reckoning" – finds its purest expression in computational verification. His demands for definitional minimalism, the exclusion of insignificant speech, and the resolution of disputes through computation are directly addressed and arguably perfected by formal systems. His dispute with Wallis *demanded* a neutral, definitionally strict arbiter, which proof assistants provide. He would likely see the formalization of Euclid as a powerful, though perhaps incomplete, **vindication** of his insistence that geometry's certainty rests on computation from definitions.

  *   **The Core Objection:** His likely **primary reservation** would center on **human comprehension and constructive meaning**. Proofs humans cannot follow might not constitute *human knowledge* for him, even if they are computationally certain. The abstraction from physical construction to pure syntax might feel like a loss of the essential link between reasoning and the material world defined by motion. He might see Lean not as *wrong*, but as potentially creating a new, potentially alienating, layer of formalism that risks obscuring the constructive, sensory foundations he deemed crucial.

  *   **His Probable Stance:** Hobbes would likely be **profoundly impressed and largely enthusiastic**, hailing the computational turn as the ultimate vindication of his theory of knowledge as reckoning and his criticisms of Wallis. He would see machine verification as the gold standard of certainty. However, he would **insist vehemently** that:
      1.  The formal system's **primitive definitions and axioms must be grounded in conceivable constructions** (ideally tied to motion) and be evident to human understanding.
      2.  While machine proofs are definitive, **human-comprehensible proofs remain the ideal** for the dissemination and possession of *knowledge*.
      3.  The **purpose of formalism** is to enforce rigor on essentially *human* reasoning about conceivable operations on bodies, not to create a self-contained abstract universe detached from these foundations.

  In essence, Hobbes would likely see the formalization of Euclid and computational verification as a triumphant validation of his *method* (reckoning from definitions) and a devastating weapon against opponents like Wallis, but would caution against severing the formal symbols from their roots in constructive human understanding grounded in the philosophy of body and motion. The computational turn would be a powerful tool, but one needing careful anchoring in his materialist and nominalist foundations to avoid becoming a new scholasticism.
