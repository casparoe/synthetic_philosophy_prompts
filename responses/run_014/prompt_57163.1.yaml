  ## Brainstorm & Math

  *   **Depot's Optimal Policy:**  
      Let exit probability = p.  
      **At Interchange A (worth 0):** Exit: 0, Continue: *then faces Interchange B with same p*  
      **At Interchange B (worth 4):** Exit: 4, Continue: 1  
      **Expected Value (EV) System-Wide:**  
      EV = P(A) * [p * 0 + (1-p) * EV_at_B] + P(B) * [p * 4 + (1-p) * 1]  
      P(A) = P(B) = 0.5 (driver doesn't know, depot assigns route).  
      EV_at_B = p * 4 + (1-p) * 1  
      **Therefore:**  
      EV = 0.5 * [(1-p) * (4p + 1 - p)] + 0.5 * [4p + 1 - p]  
      EV = 0.5 * [(1-p)(3p + 1)] + 0.5 * (3p + 1)  
      EV = 0.5 * [3p + 1 - 3p² - p] + 1.5p + 0.5  
      EV = 0.5 * [-3p² + 2p + 1] + 1.5p + 0.5  
      EV = -1.5p² + p + 0.5 + 1.5p + 0.5  
      EV = -1.5p² + 2.5p + 1  
      **Maximize EV:** d(EV)/dp = -3p + 2.5 = 0 → p = 2.5 / 3 ≈ **0.833**? Wait, mistake.  
      *Correction:* Derivative of `-1.5p² + 2.5p + 1` is `-3p + 2.5`. Set to zero: `-3p + 2.5 = 0` → `p = 2.5 / 3 ≈ 0.833`. But this is >1? Error in EV derivation.  
      **Better Derivation (Symmetry):**  
      System EV = 0.5 * [Value if A] + 0.5 * [Value if B]  
      *If Starting at A:* Outcome is: Exit (p): 0, Continue (1-p): *then at B:* Exit (p): 4, Continue (1-p): 1 → EV_A = p*0 + (1-p)[p*4 + (1-p)*1] = (1-p)(4p + 1 - p) = (1-p)(3p + 1)  
      *If Starting at B:* EV_B = p*4 + (1-p)*1 = 4p + 1 - p = 3p + 1  
      **System EV = 0.5 * EV_A + 0.5 * EV_B = 0.5*(1-p)(3p+1) + 0.5*(3p+1)**  
      Factor: = **0.5 * (3p + 1) * [ (1-p) + 1 ]** = **0.5 * (3p + 1) * (2 - p)**  
      EV = 0.5 * (3p + 1)(2 - p) = 0.5 * [6p - 3p² + 2 - p] = 0.5 * [ **-3p² + 5p + 2** ]  
      **Max EV:** d(EV)/dp = 0.5 * (-6p + 5) = 0 → -6p + 5 = 0 → **p = 5/6 ≈ 0.833**? Still >1.  
      *Mistake:* `d/dp [ -3p² + 5p + 2 ] = -6p + 5`. Set to zero: `-6p + 5 = 0` → `p = 5/6`. But p must be <=1. Check boundaries:  
      p=0: EV = 0.5*(1)(2) + 0.5*(1) wait no: From EV = 0.5 * [-3(0)² + 5(0) + 2] = 0.5 * 2 = **1**  
      p=1: EV = 0.5 * [-3(1)² + 5(1) + 2] = 0.5 * [-3+5+2] = 0.5*4 = **2**  
      p=0.5: EV = 0.5 * [-3(0.25) + 5(0.5) + 2] = 0.5 * [-0.75 + 2.5 + 2] = 0.5 * 3.75 = **1.875**  
      p=0.833: EV = 0.5 * [-3*(0.694) + 5*(0.833) + 2] ≈ 0.5 * [-2.082 + 4.165 + 2] ≈ 0.5 * 4.083 ≈ **2.0415**  
      **Conclusion:** EV increases monotonically with p from 1 (p=0) to 2 (p=1). p=1 is best? **Flawed Setup:** This assumes the depot *knows* where the truck is starting (A or B) and sets p *for that specific start point*. But the depot policy is set *before* knowing the specific run? No, the depot knows the route for *this truck, this run*. It knows if the upcoming interchange is A or B. Its optimal policy for *this specific interchange* is:  
      *   **If Interchange A (Value 0):** Exit: 0, Continue: *guarantees reaching B where driver will use p*. EV_Continue_A = p_B * 4 + (1-p_B)*1 = 4p_B + 1 - p_B = 3p_B + 1.  
          Since 0 is terrible, depot wants Continue IF (3p_B + 1) > 0 (always true). **Optimal at A: Continue (p=0 for exit)**.  
      *   **If Interchange B (Value 4):** Exit: 4, Continue: 1.  
          Since 4 > 1, **Optimal at B: Exit (p=1 for exit)**.  
      **Paradox Resolved?** The depot wouldn't randomize! It would command: *At A: Continue. At B: Exit.* Driver always gets 4! **The puzzle requires the depot cannot signal *which* interchange it is to the driver.** The depot can only prescribe a *single behavioral policy* (p) to be used *at every interchange*, because the driver cannot be told "this is A" or "this is B". The reset wipes context, including which interchange it is. The depot knows the route, but the *driver's system* does not post-reset. The prescribed p is a blanket rule for "whenever you are at an interchange".  
      **Correct Depot Optimization:** Depot must choose a single p (exit probability) applied blindly at *every* interchange.  
