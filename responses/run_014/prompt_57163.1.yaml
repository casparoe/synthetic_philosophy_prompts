      EV = **0.5 * (3p + 1)(2 - p) = 0.5 * (6p - 3p² + 2 - p) = 0.5 * (-3p² + 5p + 2)**  
      Maximize: d(EV)/dp = 0.5 * (-6p + 5) = 0 → **-6p + 5 = 0 → p = 5/6 ≈ 0.833**  
