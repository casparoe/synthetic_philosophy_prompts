      **Depot's Optimal Policy:** Prescribe **Exit with probability p = 5/6 (≈83.3%)** at every interchange. Expected Value ≈ **2.04**.
  *   **Driver's Calculation at *an* Interchange:**  
      Driver knows: Two identical interchanges (A or B), equal prior likelihood (0.5 each).  
      *   **If I EXIT:**  
          *   P(I am at A | Exit) → 0 *But we need the EV of the action, not posterior.*  
          **EV(Exit) =** P(I am at A) * Value(Exit@A) + P(I am at B) * Value(Exit@B) = (0.5)*0 + (0.5)*4 = **2**
      *   **If I CONTINUE:**  
          *   If I am at A: I go to B, reset, apply depot p: EV = p*4 + (1-p)*1 = 3p + 1? *Driver doesn't know p?* **Flaw:** The driver *knows* the depot policy! They know they are supposed to use p=5/6 *at the next interchange too*. But at *this* interchange, they are considering deviating.  
          The driver contemplating CONTINUE knows:  
          *   If I am at A: Continuing takes me to B. At B, I (or the fallback me) will use depot p: Exit w/p=5/6 (get 4) or Continue w/p=1/6 (get 1). So Value(Continue@A) = (5/6)*4 + (1/6)*1 = 20/6 + 1/6 = 21/6 = **3.5**
          *   If I am at B: Continuing gets me **1** immediately.  
          **EV(Continue) =** P(A) * Value(Continue@A) + P(B) * Value(Continue@B) = (0.5)*3.5 + (0.5)*1 = 1.75 + 0.5 = **2.25**  
      **Driver's View:** EV(Exit) = 2, EV(Continue) = 2.25. **Therefore, CONTINUE is better!** But this contradicts the depot's optimal p=5/6 (which favors exiting). **The Paradox:** The driver's calculation assumes they (or their reset self) *will follow the depot policy (p=5/6) at the NEXT interchange*. However, if the driver at *this* interchange finds Continue better (EV=2.25 > EV_Exit=2), then a rational driver at the *next* interchange would *also* find Continue better... leading them to *always* continue! But always continuing gives EV = 1 (only get the border checkpoint value), which is worse than the depot's randomized 2.04. The driver's calculation relies on the assumption that future selves *will* follow the randomized policy, even though *if given the choice*, those future selves would *not* want to follow it. The depot policy only works if the driver commits *in advance* to randomizing, even when in the moment, calculating conditionally, it seems suboptimal. The driver must bind themselves to the randomization device.
  *   **Driver's Ignorant Calculation (Simpler - What they *feel*):**  
      Driver knows nothing about future policy, just the immediate structure:  
      "If I exit here: 50% chance 0, 50% chance 4 → **EV = 2**"  
      "If I continue: I definitely go to the next place, which might be the border (1) or the other interchange... but if it's the other interchange, I'll have the *same damn choice again* with the same EV=2 for exiting? Or worse?" Uncertainty compounds. The safe bet *feels* like exiting now guarantees *at least a shot* at 4, while continuing risks ending at 1 with no further choices. **Driver's Gut:** EXIT (EV perceived ~2) beats CONTINUE (EV perceived <2, maybe ~1.5? uncertainty discount). They *want* to exit.
  *   **The Leak (Reality vs. Puzzle):** **Time/Distance.** The desert is monotonous, but not perfectly so. The driver might subconsciously track vibration patterns, slight inclines, the *feel* of 40km vs. 80km driven since the last hard landmark (depot). Or, more simply, **the clock.** Even with the system reset, the driver's own body, their coffee consumption, the fading light, or a simple wristwatch could give an approximate elapsed time since the depot, strongly indicating which interchange they are approaching.  
  *   **How Story Plugs It:** The story explicitly states the cab's chronometer is **synced to the corridor's security wipe.** When the system resets at an interchange, it sends a pulse that blanks the driver's dash-clock and their permitted wrist-comp (a cheap, corridor-issued device). Only "CORRIDOR ACTIVE - RESET CYCLE [NUMBER]" displays. The desert light is perpetually flat twilight due to atmospheric dust. The driver is exhausted, time-blurred, deliberately kept in a state of "corridor time" where minutes and kilometers lose meaning. The hum of the electric drivetrain is constant. The only marker is the interchange itself.

  ---

  **Title:** The Mercy of Forgetting

  ---

  The sodium glow bleeds into the cab. Again. The gantry arches overhead, concrete stained the same oily grey. The same hairline crack snakes up the overpass support, left side, just before the exit ramp peels away. The sign glares: the same blunt font, the same off-white, the same single word – EXIT. Forty kilometers ago? Eighty? The cab’s interior lights died with the system reset ten minutes back. Only the corridor’s sickly yellow bathes the worn plastic, the crumpled thermal wrapper, the thing in Marta’s hand.

  The die. Depot issued it. Hard black plastic, six faces, sharp corners barely worn down. Useless numbers one through six. A humiliation made solid. *‘Mandated randomizer. Use at interchange discretion per Policy Gamma-Seven.’* The dispatcher’s voice, flat over the comm before the corridor lock sealed. Marta’s fist tightens around it. The plastic bites.

  The wheel is cold under her other hand. Autonomy is dormant, a silent ghost in the machine. Fallback engaged. Human discretion required. The freight – twelve tonnes of polymerized algae slurry for the northern hydroponics hub – sits mute behind her. The exit ramp curves away, identical to the one before. Or the one before that. The corridor stretches ahead, ruler-straight into the gritty dark, vanishing point swallowed by dust-haze.

  Her dash is dead grey. The wrist-comp on the console blinks: CORRIDOR ACTIVE - RESET CYCLE 38. Time since the depot? Could be ninety minutes. Could be three hours. The corridor resets ate the clock pulses, ate the odometer ticks, ate the GPS pings. It ate the memory of the last gantry, the last crack, the last time she held this stupid die. All that’s left is *now*, this sodium baptism, this identical fork, and the heavy, dumb certainty in her gut: *Take the ramp.*

  The planner back at the depot knew. Knew the route, knew the interchanges – A, then B, forty klicks apart in the waste. Knew that at A, the ramp meant a U-turn back to base, load refused, pay zero. Knew that at B, the ramp meant the hub gate, on-time bonus, payday. Knew that driving straight through both dumped you at the border checkpoint, late, docked pay, a black mark: scrap value. The depot brain crunched the numbers, spat out Policy Gamma-Seven: *Roll the die. If it lands five or six, take the exit. Otherwise, drive on.* Five or six. One time in three. A cold, efficient average.

  Marta stares at the exit sign. *Take the ramp.* That’s the smart play. Here, now, blinded by the reset, she’s smack in the middle. Fifty-fifty. Exit now: fifty percent chance of zero, fifty percent chance of full pay. Expected value: two. Solid. Keep going? If this is A, she’ll hit B next, roll again… maybe get the payday, maybe not. If this is B, driving straight through lands her at the border for sure. Value: one. Worse. The numbers scream at her: *Exit. Guarantee the chance.* Why roll the die and maybe throw that chance away? Why obey the ghost of her past self, the one who plugged into the depot terminal eight hours ago, the one who *knew* the route map, the one who accepted this plastic insult? That Marta is gone, wiped clean like the cab’s navigation buffer. This Marta only knows the yellow light, the crack in the concrete, the hollow hum of the drivetrain, and the desperate, logical urge to *turn the wheel*.

  The die feels like a betrayal. Not just of logic, but of herself. The depot Marta *knew*. She saw the map, the timings, the probabilities laid bare. She accepted Gamma-Seven. She trusted it. This Marta, blinking in the sodium glare, has only the map’s erasure and the command: *Trust her. Trust the plan you made when you knew the way.* It’s faith in a stranger who wore her face. Faith that the ignorance is part of the design, not a flaw. Faith that the randomness is the mercy, not the cruelty.

  Her thumb finds the die’s sharp edge. She remembers the depot briefing room, the tired faces, the regulator’s vid: *“Persistent state is a vulnerability. Memory is an attack surface. The corridor resets are your shield. The randomizer is your sword. Follow the policy.”* Sword? It feels like a rock they want her to swallow. Being told to sometimes turn the wheel, sometimes not, for a reason she cannot see, cannot feel, cannot reconstruct… it hollows her out. It makes her a component, not a driver. The humiliation is hot and sour in her throat.

  She glances at the wrist-comp. CYCLE 38. Meaningless. The dust outside swirls in identical eddies under the identical lights. No landmarks break the beige expanse. No scent carries on the recycled air – just ozone and stale coolant. The comms are locked down tight until corridor exit; no calling dispatch for a hint. There is only the now, the identical now, and the ghost of her knowing self whispering *roll*.

  Her knuckles whiten on the wheel. The urge to turn is physical, a tension in her shoulders, a pull in her gut. *Take the ramp. Make the decision. Be the driver.* The die mocks her. Why surrender control to a lump of plastic? Why let the past-her dictate this moment of blind agency? Loyalty to a stranger. Faith in forgotten knowledge.

  She closes her eyes. Not to block out the light, but to block out the logic screaming in her head. *EV two if exit. Less if continue. Exit!* She pictures the depot Marta. Calm. Plugged in. Seeing the A and the B clear as day on the screen. Calculating the long run. The average. The policy that, over a thousand trucks, a thousand resets, pulls the maximum value out of the identical traps. That Marta chose the die. Chose the plan. Chose to bind this moment of ignorance to a rule made in light.

  The hum of the corridor deepens. A subtle shift. The system is cycling up. Waiting. Fallback mode won’t hold forever. The autonomy ghost will stir, demand a choice, or default to straight ahead. To the border. To the scrap value.

  A sound escapes her, part sigh, part curse. She opens her eyes. The crack on the support. The font on the sign. The curve of the ramp. Perfectly replicated hell. She lifts her hand from the wheel. The die is slick in her palm. This is the covenant. This is the loyalty owed to the self who knew the path. This is the act of faith: surrendering the illusion of informed choice to the wisdom of the erased.

  She rattles the die in her cupped hand. The sound is loud in the silent cab. A dry, hollow clatter. She doesn’t look at it. She doesn’t need to see the number yet. The act itself is the submission. The humiliation is complete. She throws the die hard against the passenger window. It bounces once, twice, rattles on the plastic console, and falls still somewhere near the gearshift in the footwell gloom.

  Marta doesn’t look down. Her hand finds the wheel again. She stares straight ahead at the corridor vanishing into the dusty dark, waiting for the result to tell her fingers what to do. The sodium light bleeds on. Again.

