prompt: |-
  As manager of a small apartment cooperative, I keep encountering two frustrations that residents treat as the same problem. The shared laundry machines are run constantly in half-empty loads, so they wear out early, while a proposed hallway lighting improvement that everyone says they would benefit from never gets funded because almost no one will contribute toward it. Residents describe both as a tragedy of overuse, yet one involves too much use and the other too little contribution. Is there an established distinction for these two configurations, and what exactly marks the boundary between them? I am not looking for a bare label; please identify the nearest concepts for each case, explain how they differ and where their edges lie, and if there is no established term for the second pattern, propose one with a definition that separates it from simple free-riding.
reasoning: |-
  Okay, the user is managing a small apartment cooperative and dealing with two distinct problems that residents are conflating as "tragedy of the commons" issues. Let me unpack this carefully.

  First scenario: laundry machines being run with half-empty loads leading to premature wear. This clearly fits the classic tragedy of the commons pattern - a rivalrous resource being overconsumed because individual incentives (convenience) conflict with collective benefit (longer machine lifespan). 

  Second scenario: hallway lighting improvements going unfunded despite universal benefit. This is different - it's about under-provision of a public good due to free-riding. The key distinction is that lighting is non-rivalrous (my use doesn't diminish yours) but requires upfront investment.

  Hmm, the user specifically wants more than labels - they need conceptual boundaries. For the laundry, it's subtractable/rivalrous. For lighting, it's non-subtractable but non-excludable. The threshold question is whether consumption reduces availability for others.

  Wait... the lighting case has an interesting twist. Residents aren't just free-riding - they're collectively blocking provision by withholding contributions. That's distinct from passive free-riding. Maybe this is an assurance problem? People won't commit unless others do.

  The user seems analytically minded - they noticed residents incorrectly lump these together. Probably wants precise frameworks to explain the differences during meetings. Might also need intervention strategies tailored to each problem type.

  For terminology, "tragedy of the commons" fits laundry perfectly. For lighting, "public good underprovision" works academically, but "collective action blockade" could be more descriptive for residents - emphasizes how mutual distrust prevents action.

  Should emphasize the rivalry/non-rivalry distinction as the core differentiator. Also note that solutions differ: laundry needs usage rules while lighting needs contribution mechanisms with assurance.
answer: |-
  You've astutely identified two distinct collective action problems that residents mistakenly conflate. While both stem from individual incentives conflicting with group welfare, their structural differences demand different solutions. Here's the conceptual breakdown:

  ### 1. **Laundry Machine Overuse: Classic "Tragedy of the Commons" (TOC)**
     - **Core Mechanism**: **Rivalrous Resource Overconsumption**  
       The laundry machines are a **subtractable common-pool resource (CPR)**. Each use *depletes* the resource (machine lifespan, availability time, utility costs). Residents face:
       - **Individual incentive**: Run half-loads for convenience (low personal cost per load).
       - **Collective cost**: Accelerated wear, frequent breakdowns, long wait times.
     - **Key Diagnostic Features**:  
       - **Rivalry**: My use *directly reduces* availability/quality for others (e.g., occupied machine, wear-and-tear).  
       - **Low marginal cost to user**: Cost per load is insignificant compared to convenience.  
       - **Cumulative depletion**: Many small abuses → system collapse.  
     - **Boundary Limit**: TOC applies *only* when resource use is rivalrous and unregulated. If machines were non-rivalrous (e.g., a magic washer that never breaks) or costs were internalized (e.g., pay-per-wear-minute), it wouldn't qualify.

  ### 2. **Lighting Underfunding: "Assurance Game Failure" (or "Voluntary Contribution Mechanism Breakdown")**
     - **Core Mechanism**: **Underprovision of a Public Good due to Strategic Uncertainty**  
       Hallway lighting is a **non-rivalrous public good** (my use doesn't diminish yours). The problem isn't overuse, but **free-riding on provision**:  
       - **Individual incentive**: Withhold contribution hoping others pay ("I'll benefit anyway").  
       - **Collective cost**: Good isn’t provided, even if everyone values it.  
     - **Key Diagnostic Features**:  
       - **Non-rivalry**: My benefit doesn’t reduce yours.  
       - **Threshold dependency**: The good requires a minimum investment to exist (e.g., $500 for lights).  
       - **Strategic uncertainty**: Residents won’t contribute unless *assured* others will too.  
     - **Distinction from Simple Free-Riding**:  
       Simple free-riding occurs when one can passively benefit. Here, **mutual suspicion creates a stalemate**: *Everyone* withholds funds because they doubt others’ cooperation, even if they personally value the good. This is an **assurance problem** – residents need confidence that contributions will meet the threshold.

  ### Proposed Term for the Lighting Case: **"Collective Action Blockade"**
     - **Definition**:  
       A dynamic where a group fails to provide a non-rivalrous good with high aggregate demand, due to mutual defection driven by strategic uncertainty and lack of credible commitment mechanisms, despite minimal individual costs to contribute.  
     - **Boundary Conditions**:  
       - Applies only to **non-rivalrous goods** requiring threshold funding.  
       - Requires **high mutual suspicion** (not just laziness).  
       - Fails when contributions are **non-binding** (e.g., voluntary pledges).  
       - Resolved by **assurance mechanisms** (e.g., escrow accounts, conditional pledges).

  ---

  ### Why Residents Confuse Them & How to Fix Each
  - **Why confusion?** Both involve individual/group incentive misalignment and appear as "people being selfish." But the *economic structures* differ fundamentally.  
  - **Solutions**:  
    - **Laundry (TOC)**:  
      - **Internalize costs**: Charge per load (coins/app) to reflect wear.  
      - **Hard constraints**: Timer locks preventing short cycles.  
      - **Social nudges**: Public usage boards showing "load efficiency."  
    - **Lighting (Blockade)**:  
      - **Assurance devices**: Use a pledge system where funds are only collected if 100% commit.  
      - **Sequential contributions**: A "leader" contributes first to build momentum.  
      - **Micro-subsidies**: Cooperative covers 20% if residents fund 80%.

  ### Conceptual Summary Table
  | Feature                | Laundry Overuse (TOC)       | Lighting Underfunding (Blockade) |
  |------------------------|-----------------------------|-----------------------------------|
  | **Resource Type**      | Rivalrous (CPR)             | Non-rivalrous (Public Good)      |
  | **Core Problem**       | Overconsumption             | Under-provision                  |
  | **Individual Incentive** | Convenience > marginal cost | Avoid being a "sucker"           |
  | **Critical Mechanism** | Rivalry & Depletion         | Threshold Dependence & Uncertainty |
  | **Solution Lever**     | Restrict/price access       | Build contribution assurance     |

  Understanding these distinctions allows targeted interventions. The laundry requires **scarcity management**, while the lighting needs **coordination engineering**. Presenting these as separate frameworks to residents can clarify why "using less" vs. "giving more" require fundamentally different approaches.
