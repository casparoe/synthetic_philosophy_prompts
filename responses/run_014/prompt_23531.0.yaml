prompt: |-
  I'm a science and ideas journalist, and I sit on my newsroom's annual service-recognition panel, which decides who recieves a bonus and a public mention at year end. This year we have a case that's been bugging me. One of our data reporters, off the clock and at her own expense, spent about three months tracking down the specific households that had been wrongly listed as "safe" in a contaminated-water database after we published a story on it, and personally notified each one, even though our policy was to publish a correction and move on. She turned down a lucrative assignment to do it, and it cost her real money and a strained relationship with a source. The editor wants to give her the top award and also quote her in a staff memo to "inspire" everyone else.

  I'm not sure that's right, and I'd like the panel's written opinion drafted before Thursday's meeting. It should recommend a concrete course of action (award, no award, private recognition, etc.) with a time frame, and it should grapple with the fact that her act was, as I see it, genuinely above and beyond the call of duty, and that publicly rewarding an act that was not required seems to risk treating it as if it had been, wich would set a precedent we'd then use against people later. I also want an honest treatment of the editor's view, which I think is the strongest consideration on the other side: that without public recognition the organization is signaling that it doesn't value such acts, and that no one will do them again.
reasoning: |-
  Okay, the user is a science and ideas journalist on a panel deciding year-end recognition. They're conflicted about a data reporter who went above and beyond to personally notify households affected by contaminated water errors, despite it costing her personally. The editor wants to give her the top award and use her as an example, but the user worries this sets a problematic precedent.

  Hmm, this is a classic ethical dilemma between rewarding exceptional service and maintaining reasonable expectations. The journalist clearly admires the reporter's actions but fears institutionalizing unpaid heroism. The core tension is between two valid concerns: celebrating moral courage versus protecting staff from exploitative expectations.

  The user's phrasing suggests they've thought deeply about organizational psychology. They're not just asking "what to do" but "how to frame it" - hence needing a draft opinion for the panel. Their unspoken worry might be about workplace culture erosion; if this becomes the new baseline, burnout follows.

  Interesting how they highlight the personal costs: refused assignments, strained source relationships, out-of-pocket expenses. This wasn't just extra work - it was sacrificial. Yet the editor's "inspiration" angle misses that replicating this is unsustainable for most staff.

  The precedent angle is smart. Publicly rewarding discretionary effort implicitly redefines duty. Future panels might say "But X got recognized for similar sacrifice" during evaluations. The memo quote particularly risks emotional coercion - "why aren't you this devoted?"

  But dismissing it entirely feels wrong. That water contamination story had real-world harm potential. Her actions aligned with journalism's highest purpose: protecting the vulnerable. Ignoring that sends its own damaging message about priorities.

  Maybe the solution is decoupling the celebration from the expectation. Honor the act's spirit (accountability) without prescribing the method (personal notifications). And keep it low-key to avoid pressure.

  The user needs concrete recommendations with nuance. Not just "award or not" but how to position it. The draft must validate both perspectives while offering a third path. Key elements: protect staff from expectation creep, affirm values, acknowledge sacrifice discreetly.

  Financial recognition seems crucial since she spent personal funds. But attaching "top award" language might inflame the precedent concern. A hybrid approach could work: bonus with private thanks, plus framing the public mention around ethics rather than hours worked.

  Also noting the three-month timeframe - this wasn't a weekend project. The panel opinion should emphasize that duration when justifying the bonus amount. And maybe suggest policy review: should corrections protocols include direct notifications for high-risk errors?

  The editor's heart is in the right place wanting public praise. But the draft could redirect that energy toward systemic change instead of individual hero worship. Like proposing a new "Ethical Action Fund" for staff pursuing similar interventions.

  Ultimately this is about what the newsroom rewards: outcomes or sacrifices? Her results were extraordinary, but the path shouldn't be the benchmark. The opinion can celebrate the former while gently rejecting the latter as policy.
answer: |-
  ## Draft Panel Opinion: Recognition for Data Reporter's Contaminated Water Initiative

  **To:** Annual Service-Recognition Panel  
  **From:** [Your Name], Panel Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation Regarding Recognition for Data Reporter's Actions on Contaminated Water Database  

  This opinion addresses the case of our data reporter who, off-the-clock and at significant personal expense, spent three months personally notifying households wrongly listed as "safe" in a contaminated-water database following our initial story. While her actions represent profound dedication to public service, the panel must carefully consider the implications of recognition to avoid unintended consequences for our staff and organizational culture.

  ### Key Considerations

  1.  **The Extraordinary Nature of the Act:**
      *   **Genuinely Above and Beyond:** The reporter's actions unequivocally exceeded professional duties. She sacrificed significant income (declining a lucrative assignment), invested substantial personal time (3 months), spent her own money, and risked professional relationships.
      *   **Alignment with Core Values:** Her initiative embodies the highest ideals of journalism – protecting the public, correcting harm, and holding power accountable, extending far beyond publishing a correction. It directly prevented potential harm to vulnerable individuals.
      *   **Significant Personal Cost:** The tangible sacrifices (money, opportunity) and intangible costs (source relationship) underscore the exceptional, non-routine nature of her commitment.

  2.  **The Editor's Argument (Public Recognition):**
      *   **Strong Case for Signaling Values:** Publicly recognizing such extraordinary acts signals the organization deeply values public service, ethical responsibility, and courage, reinforcing our core mission beyond daily output.
      *   **Risk of Discouraging Initiative:** Failure to recognize it *publicly* risks signaling that such profound commitment to our ethical purpose is not valued, potentially discouraging future discretionary acts of conscience.

  3.  **Concerns Regarding Public Recognition & Precedent:**
      *   **Normalizing the Extraordinary:** Publicly rewarding an act explicitly performed *off-the-clock* and against policy ("publish and move on") blurs the line between voluntary heroism and expected duty. It risks establishing an unsustainable precedent where similar extraordinary personal sacrifice becomes an *implicit* expectation for recognition or advancement.
      *   **Potential for Coercion:** Using her act as a direct "inspiration" in a staff memo ("why aren't *you* doing this?") could create pressure or guilt among staff who cannot or should not be expected to make comparable sacrifices due to personal circumstances, workload, or financial constraints. It risks weaponizing her goodwill against others.
      *   **Policy Conflict:** Rewarding action taken contrary to established policy ("publish and move on") creates ambiguity and undermines the rationale for having such policies in the first place.
      *   **Focus on Sacrifice over Systemic Solutions:** Public celebration might overshadow the need to examine *why* such extraordinary individual effort was necessary. Should our correction policies be reviewed for high-stakes errors? Do we need mechanisms to support responsible follow-up?

  ### Recommendation & Rationale

  **We recommend awarding the reporter the maximum allowable financial bonus commensurate with her documented personal expenses and lost income, accompanied by a sincere, private letter of thanks and recognition from the Editor-in-Chief and the panel. This award should be processed within the standard year-end bonus timeline (by December 31st).**

  **We do not recommend awarding the *public* "top award" service recognition or quoting her in an inspirational staff memo at this time.**

  **Rationale:**

  1.  **Acknowledges Sacrifice & Value:** The significant financial bonus directly addresses the tangible costs she incurred (lost income, expenses), providing concrete acknowledgment of her sacrifice and the value her actions brought to the affected public and the organization's reputation. The private letter allows for profound, personal appreciation of her ethics and courage without spectacle.
  2.  **Avoids Setting an Unsustainable Precedent:** Private recognition honors the act without institutionalizing such extreme personal sacrifice as a new baseline for "top" performance or public acclaim. It prevents future panels from using this case to pressure staff ("Why didn't you do what [Reporter] did?").
  3.  **Mitigates Coercion Risk:** It avoids the significant risk of using her story in a public memo that could inadvertently guilt-trip or pressure colleagues, respecting the diverse circumstances and capacities of all staff.
  4.  **Respects Policy While Honoring Conscience:** It acknowledges that her actions, while ethically imperative, were taken outside policy without publicly elevating that contradiction. The private letter can explicitly commend her moral courage in acting beyond policy for the greater good.
  5.  **Focuses on Systemic Learning (Separate Step):** This recommendation allows the *organization* to separately and seriously consider the systemic lessons (e.g., reviewing high-stakes correction protocols, potential ethical guidelines for discretionary follow-up, support mechanisms) without conflating it with individual reward. The panel or leadership should initiate this discussion separately from the recognition process.

  ### Addressing the Editor's View

  The editor's desire to publicly celebrate this act is understandable and rooted in a commendable desire to champion our highest values. The panel agrees that *ignoring* the act sends a negative signal. However, **private financial recognition coupled with profound private appreciation is a powerful, tangible signal of value that avoids the significant risks of public normalization and potential coercion.** It demonstrates the organization's gratitude for her specific sacrifice without making it an aspirational model that could unfairly burden others. The organization signals it values the *outcome and the ethics* deeply by compensating her losses and expressing sincere thanks, while wisely avoiding setting an expectation that staff must bankrupt themselves personally to achieve our mission.

  ### Conclusion

  This reporter deserves profound gratitude and tangible compensation for her extraordinary, conscience-driven actions. Awarding her the maximum possible financial bonus to offset her losses and providing heartfelt private recognition achieves this without crossing the critical line into establishing an unsustainable and potentially coercive precedent. It honors her individual sacrifice and ethical commitment while protecting the well-being and reasonable expectations of the entire staff. We should celebrate her character and impact privately and concretely, while initiating a separate, thoughtful discussion on whether our policies adequately support ethical action in such critical situations.

  **Recommended Action:** Approve maximum financial bonus + private letter of recognition from EIC/Panel. Timeline: Bonus processed by Dec 31st; letter delivered before year-end.
