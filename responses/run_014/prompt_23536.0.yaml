  Why is this strong penetration? Because the change is in the perceptual experience itself. He’s not inferring; the colors and textures are genuinely different. Top-down modulation would be if he just focused more on certain parts, but here the sensory qualities transform. The explanation should contrast this with attention-based changes, emphasizing phenomenological shift.

