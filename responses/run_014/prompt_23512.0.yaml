  I'm giving the toast at my dissertation advisor's retirement dinner next Saturday. She spent thirty years writing narrative history of the Cold War (her book on the Cuban Missile Crisis is the one people remember) and roughly half the room are philosophers of history who know she spent the other half of that time fighting the covering-law model — Hempel, Dray, the whole thing — while the other half are family who will zone out the second anyone says "Hempel." Write me a five-minute toast built around one good joke about the covering-law model that both halves of the room can follow, and that lands as affection rather then as a lecture. Ideally the joke is also a quiet defense of her whole career, so the philosophers in the room hear what I'm actually trying to say.
