prompt: |-
  I am a novelist. My current project is a cycle of political novels, each set in a different fictional polity that uses sortition — the random selection of ordinary citizens for political office — as a central mechanism of governance. I find that I keep reinventing the institutional details from scratch, and I want a reusable design procedure I can run for each book. The procedure should take a brief specification of the society (population, scale, technological level, the political problem sortition is meant to solve) and walk me through the institutional design choices: the selection pool, term length, scope of authority, relationship to non-sortition bodies, treatment of unwilling selectees, incorporation of specialized knowledge, and accountability mechanisms. For each choice point, distinguish between constraints that follow from the core normative case for sortition — and thus cannot be fudged without abandoning the premise — and options that are genuinely open. Flag the points where the design is most vulnerable to capture, drift, or de facto re-oligarchization; these are where my plots will live. Then run the procedure on two settings: (a) a small lunar colony of a few thousand where sortition selects the executive council, and (b) a densely populated post-national city of several million where a sortition chamber shares legislative power with an elected technocratic body. For each, identify the design choices the procedure forces that I would likely have overlooked, and the tensions it cannot resolve — which, for a novelist, are features, not bugs.
reasoning: |-
  We are designing a reusable procedure for creating sortition-based political systems for fictional settings. The procedure will take a society specification and walk through key institutional design choices, distinguishing between core constraints (from the normative case for sortition) and open options. We will also flag points vulnerable to capture, drift, or re-oligarchization. Then we apply the procedure to two settings.

  ## Core Constraints of Sortition (Cannot Fudge)
  1. **Random Selection**: The selection of officials must be random from a defined pool. This is the essence of sortition and ensures representativeness and breaks oligarchic control.
  2. **Rotation of Office**: Terms must be limited and non-renewable (or with strict limits on re-selection) to prevent the formation of a permanent political class.
  3. **Representativeness**: The selection pool must be inclusive (e.g., all adult citizens) to ensure the body mirrors the population. Exclusions must be minimal and justified by universal criteria (e.g., age, citizenship, mental capacity).
  4. **Deliberative Equality**: Within the sortition body, all members must have equal voice and vote. There should be no internal hierarchy that replicates elite dominance.

  ## Design Choice Points

  ### 1. **Selection Pool**
     - *Core Constraint*: Must be a large, inclusive subset of the population (e.g., all adult citizens). Exclusions must be minimal and based on objective criteria (e.g., age, criminal record? — but note: criminal record exclusions might undermine representativeness and are a point of vulnerability).
     - *Open Options*: 
       - How to define the pool? (e.g., all citizens, or a subset like registered voters? Also, consider residency requirements.)
       - Whether to use stratification (e.g., by geographic district, demographic group) to ensure proportional representation of key groups. Without stratification, the law of large numbers should suffice for large bodies, but for small bodies, stratification might be necessary to avoid underrepresentation.
     - *Vulnerabilities*: 
       - If the pool definition is too narrow (e.g., only property owners), it can lead to de facto oligarchy. 
       - Stratification can be manipulated (gerrymandering) if done by geography, or might entrench identity politics.

  ### 2. **Term Length**
     - *Core Constraint*: Terms must be fixed and non-renewable (or with a long cooling-off period) to prevent careerism and ensure rotation.
     - *Open Options*: 
       - The actual length (e.g., 1 year, 5 years). Shorter terms increase rotation but may lead to inexperience; longer terms allow for learning but may reduce the number of citizens who serve over time.
       - Staggered terms (e.g., a fraction of the body is replaced at regular intervals) to maintain continuity.
     - *Vulnerabilities*: 
       - If terms are too long, members might become co-opted by permanent structures (e.g., bureaucracy, lobbyists). 
       - If too short, the body may lack expertise and be vulnerable to manipulation by permanent officials or advisors.

  ### 3. **Scope of Authority**
     - *Core Constraint*: The sortition body must have real power, not just advisory. Otherwise, it becomes a token institution.
     - *Open Options*: 
       - What powers? Legislative (making laws), executive (implementing policies), judicial (adjudicating disputes), or a mix?
       - The domain of authority (e.g., only domestic policy? only budget?).
       - Whether the body acts as a whole or delegates to committees or individuals.
     - *Vulnerabilities*: 
       - Without sufficient power, the body is irrelevant. 
       - With too much power without checks, it might make erratic decisions. 
       - Delegation can lead to de facto leadership by a subset, recreating oligarchy.

  ### 4. **Relationship to Non-Sortition Bodies**
     - *Core Constraint*: The sortition body must be the primary locus of democratic legitimacy in its domain. It cannot be subordinate to an elected body without undermining the case for sortition (unless the elected body is also sortition-based? but note: elected bodies are not sortition).
     - *Open Options*: 
       - How to divide powers? (e.g., sortition body for legislation, elected for execution? or vice versa? or shared powers with checks and balances).
       - Whether non-sortition bodies (e.g., professional civil service, elected bodies, expert panels) are advisory, executive, or have veto powers.
     - *Vulnerabilities*: 
       - Non-sortition bodies (especially elected ones) might dominate the sortition body due to expertise, continuity, or networks. 
       - If the sortition body is given too little power, it becomes a rubber stamp.

  ### 5. **Treatment of Unwilling Selectees**
     - *Core Constraint*: Sortition requires that service is a civic duty. Thus, refusal must be discouraged, but not with overly punitive measures that would undermine the normative case (e.g., by making it a burden only the poor cannot avoid).
     - *Open Options*: 
       - What penalties for refusal? (e.g., fines, loss of civic rights temporarily, community service). 
       - Exemptions? (e.g., for health, care responsibilities, age). 
       - Compensation: Must be provided to ensure that service is not a financial burden. The level of compensation (e.g., average wage, current salary replacement) is open.
     - *Vulnerabilities*: 
       - If exemptions are too broad or penalties too weak, the pool becomes self-selected (only the willing, who might be unrepresentative). 
       - If compensation is too low, it becomes a burden on the poor; if too high, it might attract the wrong incentives.

  ### 6. **Incorporation of Specialized Knowledge**
     - *Core Constraint*: The sortition body must not delegate its decision-making power to experts, but it must have access to unbiased information and advice.
     - *Open Options*: 
       - How to provide expertise? (e.g., through a non-partisan civil service, expert witnesses, advisory panels, training programs for members).
       - Whether to have a parallel body of experts with some formal role (e.g., proposing legislation, but not deciding).
     - *Vulnerabilities*: 
       - Experts might manipulate the body by controlling information. 
       - If the body is not well-supported with knowledge, it might make poor decisions and lose legitimacy.

  ### 7. **Accountability Mechanisms**
     - *Core Constraint*: Sortition bodies are not electorally accountable, so other forms of accountability are needed. However, these must not undermine the independence and deliberative nature of the body.
     - *Open Options*: 
       - Transparency: Public access to deliberations (with exceptions for security or privacy).
       - Review mechanisms: (e.g., judicial review, citizen oversight panels, retrospective audits).
       - Recall: Whether citizens can remove a member during the term (but note: this might lead to populist pressures and undermine independence).
       - Accountability via the next sortition cohort? (e.g., each cohort reviews the prior's work, but this might be weak).
     - *Vulnerabilities*: 
       - Without accountability, the body might become corrupt or incompetent. 
       - Too much accountability (e.g., recall) might make members fear bold decisions.

  ## Procedure Steps
  1. **Define the Society**: Note the population, scale, technological level, and the political problem sortition is meant to solve.
  2. **For each design choice (1-7 above)**:
     - Identify core constraints that must be adhered to.
     - List open options and their trade-offs in the given context.
     - Flag vulnerabilities (for plot hooks).
  3. **Synthesize**: Ensure the design as a whole is coherent and addresses the political problem.
  4. **Identify Tensions**: Note where the design has inherent conflicts that cannot be fully resolved — these are fertile ground for narrative conflict.

  ---

  ## Application to Setting (a): Small Lunar Colony (pop. ~5,000)
  ### Society Spec
  - **Population**: ~5,000
  - **Scale**: Isolated, high-stakes environment (life support critical). 
  - **Tech Level**: Advanced (life support, communication, but perhaps resource constraints).
  - **Political Problem**: Prevent power concentration in a small group (e.g., the initial mission team or corporate overlords) and ensure decisions reflect collective survival needs.

  ### Design Choices
  1. **Selection Pool**
     - *Constraint*: All adult residents (citizens? note: in a colony, citizenship might be tied to residency). Minimal exclusions (e.g., age, mental incapacity).
     - *Options*: Given small population, might need to include almost everyone. Stratification? Probably not needed due to small size and homogeneity. But if there are distinct groups (e.g., scientists vs. engineers vs. laborers) then stratification by occupation might be considered to ensure balance.
     - *Vulnerability*: Small pool might lead to frequent service (every few years) causing burnout. Also, if the colony is company-run, the corporation might try to influence the pool definition.

  2. **Term Length**
     - *Constraint*: Non-renewable, fixed term.
     - *Options*: Short term (e.g., 6 months to 1 year) to spread opportunity. Staggering: e.g., 9-member council, 3 replaced every 4 months.
     - *Vulnerability*: Short terms might lead to inexperience in critical matters. Also, frequent turnover might disrupt governance continuity.

  3. **Scope of Authority**
     - *Constraint*: Real power — the executive council must control key resources and decisions.
     - *Options*: Full executive authority (day-to-day management) and some legislative (setting colony rules). Given small size, the council might handle both. Delegation to individual members for specific portfolios (e.g., life support, agriculture) is necessary but risky.
     - *Vulnerability*: Delegation might lead to de facto technocracy if council members defer to experts in their portfolio area.

  4. **Relationship to Non-Sortition Bodies**
     - *Constraint*: The council is the supreme authority? Or shared? In a small colony, there might be a need for technical experts in permanent positions (e.g., life support engineers). 
     - *Options*: The council sets policy, and a permanent technical staff implements. The council can override technical staff but must hear their advice. Alternatively, the council hires a manager (like a city manager) but can fire them.
     - *Vulnerability*: Permanent technical staff might become the real power if the council is transient.

  5. **Unwilling Selectees**
     - *Constraint*: Civic duty, but avoid undue burden.
     - *Options*: Penalties for refusal: fines or extra labor shifts? But in a small community, social pressure might be strong. Compensation: full salary replacement? Exemptions: for critical personnel (e.g., the only life support engineer) — but this might create a permanent elite.
     - *Vulnerability*: Exemptions for critical roles might create a class of unelected power-holders.

  6. **Specialized Knowledge**
     - *Constraint*: Council must have access to expertise but not be dominated by it.
     - *Options*: Mandatory briefings by technical staff. Training for council members. Expert advisors attached to the council.
     - *Vulnerability*: Technical staff might use their knowledge to steer decisions.

  7. **Accountability**
     - *Constraint*: Need accountability without elections.
     - *Options*: Full transparency: live-streamed deliberations (with exceptions for emergencies). Recall by a supermajority of the next sortition cohort? Or by a citizen petition (but that might be too populist). Post-term audits of decisions.
     - *Vulnerability*: In a small community, social pressure might be intense, leading to groupthink or fear of backlash.

  ### Overlooked Design Choices and Tensions
  - **Overlooked**: The frequency of service — in a small population, citizens might serve multiple times in their life. How does that affect the "ordinary citizen" ideal? Also, the burden of service might be high in a survival-focused colony.
  - **Tensions**: 
    - Between the need for technical expertise and the risk of technocratic capture. 
    - Between the desire for broad participation and the reality that some jobs are too critical to leave for council duty (leading to exemptions and a two-tier society).
    - Short terms vs. the need for continuity in long-term projects (e.g., terraforming).

  ---

  ## Application to Setting (b): Post-National City (pop. ~10 million)
  ### Society Spec
  - **Population**: ~10 million
  - **Scale**: Dense, diverse, global city (like a future Singapore or Dubai).
  - **Tech Level**: Advanced (ubiquitous AI, surveillance, but also social media).
  - **Political Problem**: The city is post-national (no state above it) and must manage complex governance without succumbing to either corporate capture or populist demagoguery. Sortition is meant to counterbalance an elected technocratic body.

  ### Design Choices
  1. **Selection Pool**
     - *Constraint*: All adult residents (regardless of citizenship? in a post-national city, residency might be the criterion). 
     - *Options*: Stratification by district or by demographic groups to ensure diversity. Given the size, a pure random sample without stratification would be representative, but the public might demand explicit representation of neighborhoods.
     - *Vulnerability*: Defining residency: if based on property ownership or length of stay, it might exclude transient populations (migrant workers) leading to underrepresentation.

  2. **Term Length**
     - *Constraint*: Non-renewable, fixed term.
     - *Options*: Longer terms (e.g., 3-5 years) to allow learning. Staggering: e.g., half the chamber replaced every 2 years.
     - *Vulnerability*: Longer terms might lead to co-option by lobbyists or the technocratic body.

  3. **Scope of Authority**
     - *Constraint*: Must share legislative power meaningfully.
     - *Options*: The sortition chamber (let's call it the "Citizens' Assembly") might have the power to initiate legislation, amend or veto bills from the elected technocratic body, and control the budget. Alternatively, it might only review and approve legislation from the technocratic body.
     - *Vulnerability*: If the technocratic body dominates the agenda-setting, the sortition chamber becomes reactive.

  4. **Relationship to Non-Sortition Bodies**
     - *Constraint*: The sortition chamber must have equal or superior power to the elected body in some domains to avoid being a rubber stamp.
     - *Options*: 
       - Shared powers: e.g., both must pass legislation. 
       - Different domains: sortition for social policies, technocratic for technical matters? 
       - The technocratic body might be elected by a specialized electorate (e.g., graduates) or by the entire population but on a platform of expertise.
     - *Vulnerability*: The elected technocratic body, with its longer terms (if staggered) and expertise, might dominate the sortition chamber by controlling information and bureaucracy.

  5. **Unwilling Selectees**
     - *Constraint*: Civic duty with compensation.
     - *Options*: Significant compensation (e.g., double the median wage) to encourage service. Penalties: hefty fines for refusal. Exemptions: limited to health or care responsibilities.
     - *Vulnerability*: High compensation might attract people who see it as a job opportunity, leading to a self-selected pool of the less employed or less qualified. Also, fines might disproportionately affect the poor.

  6. **Specialized Knowledge**
     - *Constraint*: Access to unbiased expertise.
     - *Options*: A professional non-partisan research staff for the sortition chamber. Expert hearings. Training programs for members. The technocratic body might be a source of expertise but also a rival.
     - *Vulnerability*: The technocratic body might control the flow of information to the sortition chamber. Also, the research staff might develop their own agenda.

  7. **Accountability**
     - *Constraint*: No electoral accountability, so other forms.
     - *Options*: Full transparency (broadcast deliberations). Post-term audits by an independent body. Citizen juries to review major decisions. 
     - *Vulnerability*: Media might sensationalize deliberations, leading to public pressure and populist decisions. Also, without recall, members might be unresponsive.

  ### Overlooked Design Choices and Tensions
  - **Overlooked**: 
    - The size of the sortition chamber: for a city of 10 million, how many members? Too few (e.g., 500) might not be representative enough; too many (e.g., 5000) might be unwieldy. This affects deliberation quality.
    - How to coordinate between two legislative bodies with different legitimacy bases? The potential for gridlock.
  - **Tensions**: 
    - Between the democratic legitimacy of the sortition body (representing the people) and the elected technocrats (representing expertise and merit). This tension is inherent and unresolvable — it can lead to conflict over who speaks for the city.
    - Between the need for speedy decisions (e.g., in a crisis) and the deliberative pace of a large citizen assembly.
    - The risk that the sortition chamber becomes a tool of the technocratic body (if the latter controls the agenda) or vice versa.

  ---

  ## Conclusion for the Novelist
  - **Procedure Output**: For each setting, you now have a structured design with choice points, vulnerabilities, and tensions.
  - **Plot Hooks**: The vulnerabilities flagged (e.g., expert capture in the lunar colony, or information control by technocrats in the city) are natural sources of conflict. The inherent tensions (e.g., expertise vs. democracy) are thematic gold.
  - **Overlooked Points**: The procedure forces consideration of practical details (like term staggering and compensation) that might not be immediately obvious but have profound effects on the system's functioning and potential failure modes.
  - **Unresolved Tensions**: These are features because they create the ongoing struggles that drive narrative. For example, in the lunar colony, the tension between survival needs (requiring expertise) and democratic control is perpetual. In the city, the power struggle between the sortition chamber and the technocratic body is a constant source of political drama.

  Now, go write those novels!
answer: |-
  Below is a reusable design procedure for your sortition-based polities, structured around key institutional choices. For each choice point, I distinguish **core constraints** (non-negotiable, derived from sortition's normative case) from **open options** (flexible design spaces). I flag **vulnerabilities** where capture, drift, or re-oligarchization are likely—prime territory for plots. Finally, I apply the procedure to your two settings, highlighting overlooked tensions and unresolvable conflicts.

  ---

  ### **Design Procedure for Sortition Systems**
  *Inputs needed*: Population size, technological level, core political problem(s) sortition addresses (e.g., curbing corruption, preventing factionalism, ensuring equity).

  #### **1. Selection Pool**  
  - **Core Constraint**: The pool *must* be a near-complete cross-section of society. Exclusions should be minimal (e.g., age, citizenship, criminal record only if universally applied).  
  - **Open Options**:  
    - *Source list*: All citizens vs. registered voters vs. volunteers (volunteers risk self-selection bias).  
    - *Stratification*: Whether to weight demographics (e.g., by class, region) to ensure proportional representation.  
  - **Vulnerabilities**:  
    - **Capture risk**: If stratification is manipulable (e.g., by elites defining "demographics").  
    - **Drift risk**: Gradual exclusion of marginalized groups (e.g., via bureaucratic registration barriers).  

  #### **2. Term Length**  
  - **Core Constraint**: Terms *must* be short (≤3 years) and non-renewable to prevent careerism and ensure rotation.  
  - **Open Options**:  
    - *Exact duration*: 6 months (high turnover) vs. 2–3 years (stability).  
    - *Staggering*: Whether to replace cohorts incrementally (e.g., 1/3 annually) for continuity.  
  - **Vulnerabilities**:  
    - **Re-oligarchization**: Short terms may increase reliance on permanent bureaucrats or advisors.  
    - **Capture risk**: External actors exploiting turnover chaos (e.g., lobbying new cohorts).  

  #### **3. Scope of Authority**  
  - **Core Constraint**: Sortition bodies *must* have binding power—no advisory-only roles (or the system is toothless).  
  - **Open Options**:  
    - *Vertical scope*: Executive (day-to-day governance), legislative (lawmaking), judicial (oversight).  
    - *Horizontal scope*: Policy domains (e.g., only social laws vs. all domains).  
  - **Vulnerabilities**:  
    - **Drift risk**: Scope creep into technical areas (e.g., monetary policy) where random citizens lack expertise.  
    - **Capture risk**: Narrow scopes may cede power to non-sortition bodies (e.g., technocrats).  

  #### **4. Relationship to Non-Sortition Bodies**  
  - **Core Constraint**: Sortition bodies *must not* be subordinate to elected/appointed bodies in their domain.  
  - **Open Options**:  
    - *Separation of powers*: Veto authority over elected bodies, shared initiative rights, or checks on appointments.  
    - *Co-governance*: Sortition sets goals, non-sortition implements (or vice versa).  
  - **Vulnerabilities**:  
    - **Re-oligarchization**: Unelected bodies (e.g., central banks) may become shadow governments.  
    - **Capture risk**: Logistical dependence on permanent staff (e.g., agenda-setting by civil servants).  

  #### **5. Treatment of Unwilling Selectees**  
  - **Core Constraint**: Opt-outs *must not* skew representation (e.g., favoring privileged groups who can afford penalties).  
  - **Open Options**:  
    - *Incentives*: Stipends (below market rate vs. full salary), social recognition, or penalties (fines, community service).  
    - *Exemptions*: Health, caregiving duties, or essential professions (e.g., doctors).  
  - **Vulnerabilities**:  
    - **Drift risk**: If penalties are weak, participation becomes self-selecting (e.g., only idealists or desperate).  
    - **Capture risk**: Elite exemptions (e.g., "essential" corporate leaders excused).  

  #### **6. Incorporation of Specialized Knowledge**  
  - **Core Constraint**: Experts *must not* have voting power—sortition members retain final authority.  
  - **Open Options**:  
    - *Training*: Pre-service crash courses (1 week vs. 1 month) vs. ongoing advisors.  
    - *Expert roles*: Testimony rights, non-voting secretariats, or mandatory consultation.  
  - **Vulnerabilities**:  
    - **Re-oligarchization**: De facto rule by advisors (e.g., if training is excessive).  
    - **Capture risk**: Corporate-funded "experts" dominating briefings.  

  #### **7. Accountability Mechanisms**  
  - **Core Constraint**: No electoral accountability—avoid mechanisms mimicking elections (e.g., recalls).  
  - **Open Options**:  
    - *Transparency*: Live-streamed deliberations vs. private voting.  
    - *Retrospective review*: Citizen juries auditing decisions, or public feedback portals.  
  - **Vulnerabilities**:  
    - **Drift risk**: Public opinion pressuring decisions (via media/social media).  
    - **Capture risk**: Review bodies infiltrated by interest groups.  

  ---

  ### **Applied to Your Settings**  
  #### **Setting (a): Small Lunar Colony (Population: ~5,000; Tech Level: Advanced)**  
  *Political Problem*: Prevent resource-hoarding by founding elites; ensure survival-critical fairness.  

  **Design Choices & Overlooked Tensions**  
  - **Selection Pool**: *All adults* (core constraint). Overlooked: Mandatory service exemptions for critical roles (e.g., life-support engineers) could create a shadow elite.  
  - **Term Length**: *1 year, staggered* (prevents clique formation). Tension: Short terms risk mistakes in life-or-death decisions (e.g., air rationing).  
  - **Scope**: *Executive council* with power over resource allocation. Vulnerability: Non-sortition engineers may manipulate data to sway decisions.  
  - **Non-Sortition Bodies**: Colony AI handles logistics; sortition council sets priorities. **Unresolvable tension**: AI’s "neutral" algorithms may encode founder biases.  
  - **Unwilling Selectees**: *Double rations as incentive*; penalties for refusal. Overlooked: Incentives could worsen inequality (e.g., poor selectees vs. exempt elites).  
  - **Specialized Knowledge**: *2-week survival training*; engineers as non-voting advisors. Vulnerability: Advisors using jargon to intimidate.  
  - **Accountability**: *Deliberations public*; quarterly audits by next cohort. **Plot hook**: An audit reveals covert alliances between advisors and miners.  

  **Systemic Vulnerabilities**  
  - **Re-oligarchization**: Founders control training/advising, embedding their values.  
  - **Drift**: Crisis responses centralize power in non-sortition roles (e.g., disaster coordinator).  

  #### **Setting (b): Post-National City (Population: ~10M; Tech Level: AI-Driven)**  
  *Political Problem*: Counterbalance corporate influence in elected technocrats; prevent policy capture.  

  **Design Choices & Overlooked Tensions**  
  - **Selection Pool**: *All residents* (core constraint). Stratification by district/class. Overlooked: AI-managed stratification could be hacked to over-represent lobbyists.  
  - **Term Length**: *2 years, half replaced annually*. Tension: Short terms limit ability to master complex urban systems.  
  - **Scope**: *Legislative chamber* with veto power over elected technocrats. Vulnerability: Technocrats may bury proposals in technicalities.  
  - **Non-Sortition Bodies**: Elected technocrats draft laws; sortition amends/vetoes. **Unresolvable tension**: Who defines "technical" vs. "value" decisions? (e.g., Is AI surveillance technical or ethical?).  
  - **Unwilling Selectees**: *Full salary + childcare*. Exemptions for single parents. Overlooked: High pay attracts professional "citizen-lobbyists."  
  - **Specialized Knowledge**: *On-call AI advisors*; mandatory ethics training. **Plot hook**: AI advisors push corporate-friendly data.  
  - **Accountability**: *Real-time sentiment analysis* of public feedback. Vulnerability: Algorithmic feedback could amplify populism.  

  **Systemic Vulnerabilities**  
  - **Capture**: Corporations influence AI advisors or sentiment algorithms.  
  - **Re-oligarchization**: Technocrats and sortition elites collude via shared social networks.  

  ---

  ### **Why This Works for Novels**  
  - **Overlooked Tensions**: The procedure forces choices with inherent conflicts (e.g., lunar exemptions creating elites, city AI defining "technical" issues). These are engines for plot.  
  - **Unresolvable Flaws**: Sortition’s core tension—*random citizens vs. specialized governance*—cannot be "solved." This mirrors real politics, fueling character arcs (e.g., an idealist realizing the system is manipulable).  
  - **Vulnerabilities as Plot Seeds**: Each flagged risk (e.g., training manipulation, AI bias) is a corruption vector for antagonists.  

  Use this framework to generate friction-rich institutions where the *design itself* becomes a character—flawed, contested, and alive with dramatic potential.
