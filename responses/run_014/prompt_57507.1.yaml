  ### Candidate Principle 1: **Truncation with Wealth-Dependent Risk Aversion**

  #### Rule Statement:
  1. **For a game \(G\) with payouts \(X_n\) in state \(n\) (probability \(p_n = (1/2)^n\)):**  
     - Compute the **wealth-capped payout** \(\tilde{X}_n = \text{sign}(X_n) \cdot \min(|X_n|, W + B)\), where:  
       - \(W = \$50,000\) is your wealth.  
       - \(B = \$1,000,000\) is the house's vault limit (default if unspecified).  
     - Ignore states where \(\mathbb{P}(\text{state}) < 10^{-6}\) (i.e., \(n > 20\)).  
     - Calculate the **truncated expected utility**:  
       \[
       U(G) = \sum_{n=1}^{20} p_n \cdot u(\tilde{X}_n), \quad \text{where} \quad u(x) = \begin{cases} 
       x & \text{if } |x| \leq W, \\
       W \cdot \text{sign}(x) & \text{if } |x| > W.
       \end{cases}
       \]
     - The **value** is the certainty equivalent \(c\) such that \(u(c) = U(G)\).  
     - Output: **Dollar value** (if \(U(G)\) converges), else "no value".  

  2. **Comparisons between games \(G_1\) and \(G_2\):**  
     - If \(\tilde{X}^1_n \geq \tilde{X}^2_n\) for all \(n\) and strict for some \(n\), then \(G_1\) is worth more than \(G_2\).  
     - Output: **Comparative ranking** or **dollar value**.  

  3. **No-value conditions:**  
     - If the series \(\sum p_n \tilde{X}_n\) is conditionally convergent (converges but absolute series diverges), output "no value".  
     - If the game poses non-diversifiable risk of ruin (e.g., unbounded losses), output "no value".  

  #### Motivation for Clauses:
  - **Wealth cap and utility truncation**: Reflects your stipulation that losses beyond wealth are absorbed (Game 1, 5–7) and house vault limits (Game 2).  
  - **Probability threshold \(10^{-6}\)**: Explains why Games 1 and 3 are valued equally (high-\(n\) states ignored) but fails for Game 8 (where high-\(n\) states dominate in volume).  
  - **Conditional convergence clause**: Captures "no value" for Games 5–6 due to rearrangement risk.  
  - **Dominance clause**: Explains Game 4 being worth exactly $1 more.  

