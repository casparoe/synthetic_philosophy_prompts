prompt: |-
  I'm writing a paper on fakes and originals, and before I compare theories I want the standard of evaluation fixed. Write the desiderata for an adequate account of why originals matter: the cases it must handle (a perfect physical copy, an original whose maker is unknown, a forgery that later becomes famous in its own right, a digital object where the designation of an original file is arbitrary, a historical document and an exact facsimile), the distinctions it must keep separate (being made by a particular person, being the first instance, having an unbroken causal history, being certified by institutions, being beautiful or evidentially useful), and the constraints it cannot ignore (some copies are valued, some originals are worthless, markets can reward fakes, and authenticity can matter more than quality). Give the reason or motivating case behind each requirement, mark which are non-negotiable and which are contestable, and flag any pair that seems jointly unsatisfiable. Then briefly score causal-historical, institutional, and functional-pragmatic accounts against the list. Finally, say how confident you are in the list itself and identify the single requirement you are least sure about.
reasoning: |-
  We are building a list of desiderata for an adequate account of why originals matter. The account must handle specific cases, keep certain distinctions separate, and respect given constraints. We also need to evaluate three theories (causal-historical, institutional, functional-pragmatic) against the list. Finally, we will reflect on the list and our confidence.

  Desiderata are divided into three categories: cases to handle, distinctions to keep, and constraints to respect. Each item will have a reason/motivating case, and we mark which are non-negotiable (essential) and which are contestable (open to debate). We also flag any pairs that might be jointly unsatisfiable.

  ## I. Cases the account must handle (with motivating case and non-negotiable/contestable)

  1. **Perfect physical copy**: A duplicate that is physically identical to the original (e.g., a molecularly identical copy of a sculpture). The account must explain why the original still matters. *Reason*: If the account cannot explain why the original is valued over a perfect duplicate, it fails a basic test. **Non-negotiable**.

  2. **Original whose maker is unknown**: An artwork or artifact that is considered original but the creator is lost to history (e.g., ancient artifacts). The account must still attribute value to the original despite the lack of authorial identity. *Reason*: Many culturally significant objects are anonymous. **Non-negotiable**.

  3. **Forgery that later becomes famous in its own right**: A fake that initially deceived but is later recognized for its own merit (e.g., van Meegeren's Vermeer forgeries). The account must explain how the object transitions from being a forgery to having inherent value. *Reason*: This tests the account's flexibility in handling changing contexts. **Non-negotiable**.

  4. **Digital object where designation of an original is arbitrary**: In digital media, any copy is identical and the "original" file is arbitrarily chosen (e.g., a digital artwork as an NFT). The account must explain what, if anything, makes the designated original special. *Reason*: Digital objects challenge traditional notions of originality. **Non-negotiable**.

  5. **Historical document and an exact facsimile**: An original document (e.g., the U.S. Constitution) and a perfect replica. The account must explain why we value the original for historical research or display. *Reason*: This case involves evidential and symbolic value. **Non-negotiable**.

  ## II. Distinctions the account must keep separate (with motivating case and non-negotiable/contestable)

  1. **Being made by a particular person**: The authorial origin. *Reason*: We often value an artwork because it was made by a specific artist (e.g., a Picasso). **Non-negotiable** to distinguish from other factors.

  2. **Being the first instance**: The original as the first of its kind. *Reason*: The first edition of a book might be valued more than later identical printings. **Contestable** because sometimes the first is not the original (e.g., in digital) and sometimes copies are made simultaneously.

  3. **Having an unbroken causal history**: The object's continuous physical trajectory through time. *Reason*: Relics or artifacts with a known, direct history (e.g., the Crown Jewels) are valued for their provenance. **Non-negotiable**.

  4. **Being certified by institutions**: The role of museums, experts, or authorities in authenticating. *Reason*: An object can be made by the artist but without certification, it may not be accepted (e.g., a newly discovered painting). **Contestable** because institutional certification is a social construct and may not always align with other criteria.

  5. **Being beautiful or evidentially useful**: The aesthetic or functional properties. *Reason*: A copy may be as beautiful or useful as the original (e.g., a replica of a historical tool). The account must not conflate these properties with originality. **Non-negotiable**.

  ## III. Constraints the account cannot ignore (with motivating case and non-negotiable/contestable)

  1. **Some copies are valued**: Copies can have significant value (e.g., authorized replicas in museums, or a family photo copy). *Reason*: If the account says only originals matter, it fails to account for the value of copies. **Non-negotiable**.

  2. **Some originals are worthless**: Not every original is valuable (e.g., a mundane object with no historical or artistic significance). *Reason*: Originality alone does not guarantee value. **Non-negotiable**.

  3. **Markets can reward fakes**: Sometimes fakes are sold and valued (e.g., as curiosities or for their own artistic merit). *Reason*: The account should not imply that fakes are always worthless. **Non-negotiable**.

  4. **Authenticity can matter more than quality**: In some cases, the authentic but flawed original is valued more than a perfect copy (e.g., a worn-out flag from a battle). *Reason*: This highlights that authenticity can be a primary value. **Non-negotiable**.

  ## Flagging jointly unsatisfiable pairs

  - **Being the first instance** (II.2) and **Digital object where designation of an original is arbitrary** (I.4): In digital objects, there may be no meaningful "first" because copies are simultaneous and identical. This might make it hard to satisfy both. However, note that II.2 is contestable and I.4 is non-negotiable. So an account that does not rely on "first instance" might avoid the conflict.

  - **Being made by a particular person** (II.1) and **Original whose maker is unknown** (I.2): If an original's maker is unknown, we cannot rely on the particular person. But note: the distinction (II.1) is about keeping the factor separate, not that it must always be known. The account might still use the idea that it was made by *someone* (even if unknown) and that matters. So they are not necessarily in conflict.

  ## Scoring theories

  We evaluate three accounts:

  1. **Causal-historical account**: Originality lies in the object's causal history, especially its creation by the original artist and its unbroken physical trajectory.

     - Cases:
       - I.1: Handles well (the copy lacks the right causal history).
       - I.2: Problematic because if the maker is unknown, the causal history might be incomplete, but the account can still rely on the object's history (e.g., it was made in ancient Greece). **Partial**.
       - I.3: The forgery, once revealed, has a causal history of being made by the forger. But when it becomes famous, the account might struggle to explain its new value because the causal history hasn't changed. **Weak**.
       - I.4: Digital objects: the causal history of a designated original is arbitrary and no different from copies. **Weak**.
       - I.5: Handles well (the original has the authentic causal history).

     - Distinctions:
       - II.1: Emphasizes being made by a particular person (if known) as part of causal history. **Good**.
       - II.2: Not necessarily focused on firstness (unless the first has a unique causal history). **Good** (avoids conflating).
       - II.3: This is the core of the account. **Good**.
       - II.4: Does not require certification; the causal history is independent. **Good** (keeps separate).
       - II.5: Can separate because a copy may have the same beauty but not the causal history. **Good**.

     - Constraints:
       - III.1: Copies are valued for other reasons (e.g., aesthetics) but the account can say they lack the causal history so are not original. **Adequate**.
       - III.2: Some originals are worthless: the account can say they have the causal history but that doesn't guarantee value. **Good**.
       - III.3: Fakes might be valued for other reasons (e.g., as fakes) and the account can allow that. **Good**.
       - III.4: Authenticity (causal history) can be valued more than quality. **Good**.

     Overall: Moderate. Fails on digital and forgeries that become famous.

  2. **Institutional account**: Originality is conferred by institutional acceptance (museums, experts, etc.).

     - Cases:
       - I.1: The original is institutionally certified, the copy is not. **Good**.
       - I.2: Institutions can certify an object as original even if the maker is unknown. **Good**.
       - I.3: The forgery, once accepted as having its own merit, can be institutionally recertified. **Good**.
       - I.4: Institutions can designate an original arbitrarily (e.g., the first minted NFT). **Good**.
       - I.5: The institution certifies the original document. **Good**.

     - Distinctions:
       - II.1: Institutions might certify based on authorship, but it's the institution that matters. **Adequate** (but may conflate if the institution uses authorship as criterion).
       - II.2: Institutions might focus on firstness or not. **Adequate** (kept separate if institution doesn't rely on it).
       - II.3: Institutions might require provenance (causal history) but it's the certification that counts. **Adequate**.
       - II.4: This is the core. **Good**.
       - II.5: Institutions might value beauty or utility, but they are distinct from originality. **Good**.

     - Constraints:
       - III.1: Copies can be institutionally valued (e.g., as replicas). **Good**.
       - III.2: Some originals are not certified and hence not valued as originals by institutions. **Good**.
       - III.3: Markets can reward fakes if they are institutionally endorsed (e.g., as art in their own right). **Good**.
       - III.4: Institutions can value authenticity over quality. **Good**.

     Overall: Strong. Handles most cases well.

  3. **Functional-pragmatic account**: Originality is determined by the role the object plays in our practices (e.g., evidential, symbolic, or aesthetic functions).

     - Cases:
       - I.1: The original may function as the source of copies or have a symbolic role that the copy lacks. **Good**.
       - I.2: The original may function as a historical artifact even without known authorship. **Good**.
       - I.3: The forgery can take on a new function (e.g., as an example of forgery or as a work of the forger). **Good**.
       - I.4: The designated original may have a functional role (e.g., in blockchain, the token represents the original). **Good**.
       - I.5: The original document functions as evidence in a way the facsimile cannot (e.g., for forensic analysis). **Good**.

     - Distinctions:
       - II.1: The function might depend on being made by a particular person (e.g., for biographical studies). **Good** (can keep separate by noting that function varies).
       - II.2: The first instance might have a unique function (e.g., in collecting) but not necessarily. **Good**.
       - II.3: The causal history might be part of the function (e.g., for relics) but not always. **Good**.
       - II.4: Institutions may play a role in assigning function, but function is broader. **Good**.
       - II.5: Clearly separates because a copy can have the same aesthetic function but not the same historical function. **Good**.

     - Constraints:
       - III.1: Copies can have functions (e.g., display without risk to original). **Good**.
       - III.2: Some originals have no significant function. **Good**.
       - III.3: Fakes can function in the market as collectibles. **Good**.
       - III.4: The authentic object may function as a symbol even if damaged. **Good**.

     Overall: Strong. Flexible and handles the cases.

  ## Confidence in the list

  The list is well-motivated by common cases and theoretical considerations. I am highly confident in the non-negotiable items and the structure.

  The requirement I am least sure about is **II.2: Being the first instance**. It is contestable and may not be necessary in all accounts (especially in digital contexts). Some might argue that in certain domains (e.g., performance art) the first instance is crucial, but in others (e.g., printmaking) multiple originals are accepted. Thus, it might be more domain-specific than the others. However, it is included because it is a common intuition and must be addressed (even if to reject it in some cases). So I am about 70% confident in including it as a distinction to keep separate.

  Final note: The list is designed to be comprehensive but not exhaustive. It focuses on the most pressing challenges.
answer: |-
  ### Desiderata for an Adequate Account of Why Originals Matter  
  An adequate account must explain why originals hold unique value across diverse contexts. Below, I outline the desiderata, grouped into **cases to handle**, **distinctions to maintain**, and **constraints to respect**. Each entry includes a rationale (motivating case), marks whether it is non-negotiable (essential) or contestable (debatable), and flags any potentially jointly unsatisfiable pairs. Finally, I evaluate three major theories and assess the list's confidence.

  ---

  #### **I. Cases the Account Must Handle**  
  These are real-world scenarios the account must address to be comprehensive.  
  1. **Perfect physical copy** (e.g., a molecularly identical replica of Michelangelo's *David*).  
     - **Rationale**: Tests whether non-historical/physical properties alone explain an original's value. If the replica is indistinguishable, why prefer the original?  
     - **Status**: Non-negotiable. Failing here implies the account cannot explain core intuitions about originality.  

  2. **Original whose maker is unknown** (e.g., an anonymous ancient Greek statue).  
     - **Rationale**: Demonstrates that authorship isn't always necessary for an original's value. The object may derive worth from age, rarity, or cultural significance alone.  
     - **Status**: Non-negotiable. Accounts relying solely on authorship fail for historical artifacts.  

  3. **Forgery that later becomes famous in its own right** (e.g., Han van Meegeren's Vermeer forgeries, initially despised but now valued as art-historical curiosities).  
     - **Rationale**: Challenges accounts to explain how value shifts from derivativeness (as a fake) to intrinsic worth (as a cultural artifact), without retroactively erasing its "forged" status.  
     - **Status**: Non-negotiable. Highlights dynamic valuation and contextual dependence.  

  4. **Digital object where the designation of an original file is arbitrary** (e.g., an NFT artwork: any copy is identical, but one file is tokenized as "original").  
     - **Rationale**: Probes whether originality requires physical uniqueness. Digital contexts force us to confront socially constructed "originality" without material differences.  
     - **Status**: Non-negotiable. Digital media are ubiquitous; ignoring them renders the account obsolete.  

  5. **Historical document and an exact facsimile** (e.g., the U.S. Constitution vs. a museum-produced replica).  
     - **Rationale**: Tests evidential/symbolic value. The original may be valued for its role in events (e.g., bearing signatures from 1787), even if the facsimile is functionally identical for research.  
     - **Status**: Non-negotiable. Crucial for historical and evidentiary contexts.  

  ---

  #### **II. Distinctions the Account Must Keep Separate**  
  The account must not conflate these factors, as each can contribute independently to an original's value.  
  1. **Being made by a particular person** (e.g., a Picasso painting is valued because Picasso made it).  
     - **Rationale**: Authorship often matters, but it isn't sufficient (e.g., unknown makers) or necessary (e.g., nature-made objects).  
     - **Status**: Non-negotiable. Conflating this with other factors (e.g., causal history) oversimplifies valuation.  

  2. **Being the first instance** (e.g., the first printed copy of *Harry Potter*).  
     - **Rationale**: Primacy can matter (e.g., in collectibles), but it is distinct from authorship (e.g., later signed copies) or causal history (e.g., a restored first edition).  
     - **Status**: Contestable. Primacy may not always matter (e.g., in digital files), but must be separable.  

  3. **Having an unbroken causal history** (e.g., the *Mona Lisa*'s continuous provenance from da Vinci to the Louvre).  
     - **Rationale**: Provenance affects authenticity, but it can be independent of quality or beauty (e.g., a damaged relic with clear lineage).  
     - **Status**: Non-negotiable. Central to historical and museological practices.  

  4. **Being certified by institutions** (e.g., a painting authenticated by the Louvre).  
     - **Rationale**: Institutional approval affects market/social value, but it is not inherent to the object (e.g., outsider art ignored by institutions).  
     - **Status**: Contestable. Institutions are socially constructed, so their role should not be treated as inherent.  

  5. **Being beautiful or evidentially useful** (e.g., a flawless copy of a scientific manuscript may be as useful as the original).  
     - **Rationale**: Aesthetic/functional properties often attach to copies, so originality cannot be reduced to them.  
     - **Status**: Non-negotiable. Conflation leads to the "perfect copy" problem (Case 1).  

  ---

  #### **III. Constraints the Account Cannot Ignore**  
  These are boundary conditions reflecting real-world complexities.  
  1. **Some copies are valued** (e.g., authorized replicas in museums, or backup copies of data).  
     - **Rationale**: Copies can have aesthetic, educational, or sentimental worth, so the account cannot treat originality as the sole source of value.  
     - **Status**: Non-negotiable. Denying this contradicts observable practices.  

  2. **Some originals are worthless** (e.g., a mundane, unsigned doodle by a famous artist).  
     - **Rationale**: Originality alone doesn't guarantee value; context matters.  
     - **Status**: Non-negotiable. Avoids overgeneralizing originality as inherently valuable.  

  3. **Markets can reward fakes** (e.g., forgeries sold as "genuine fakes" for their notoriety).  
     - **Rationale**: Market dynamics (e.g., scarcity, hype) can override authenticity.  
     - **Status**: Non-negotiable. Shows valuation is multi-factorial.  

  4. **Authenticity can matter more than quality** (e.g., a chipped ancient vase vs. a pristine replica).  
     - **Rationale**: In contexts like heritage or religion, authenticity often trumps aesthetics/functionality.  
     - **Status**: Non-negotiable. Core to why originals "matter" in the first place.  

  ---

  #### **Flagged Jointly Unsatisfiable Pairs**  
  - **First instance (II.2) vs. Digital object (I.4)**: In digital contexts, "firstness" is arbitrary (e.g., which identical file is "first"?). An account prioritizing primacy (II.2) struggles with I.4, where originality is purely designative.  
    - **Implication**: II.2 must be contestable; an adequate account should not hinge on primacy for digital objects.  
  - **Causal history (II.3) vs. Valueless originals (III.2)**: If unbroken causal history (II.3) guarantees value, it contradicts III.2 (worthless originals).  
    - **Implication**: II.3 cannot be the sole source of value; the account must incorporate contextual factors.  

  ---

  #### **Evaluation of Theories**  
  Briefly scored against the desiderata (✓ = handles well; ✗ = fails; ~ = partial/mixed):  

  | Desideratum                          | Causal-Historical       | Institutional           | Functional-Pragmatic    |  
  |--------------------------------------|-------------------------|-------------------------|-------------------------|  
  | **Cases**                            |                         |                         |                         |  
  | 1. Perfect copy                      | ✗ (copy lacks history)  | ✓ (institutions decide) | ✓ (function differs)    |  
  | 2. Unknown maker                     | ~ (if history is known) | ✓ (institutions assign) | ✓ (function persists)   |  
  | 3. Famous forgery                    | ✗ (history is "fake")   | ✓ (re-certification)    | ✓ (new function)        |  
  | 4. Digital object                    | ✗ (no physical history) | ✓ (institutional fiat)  | ✓ (pragmatic role)      |  
  | 5. Historical document               | ✓ (history matters)     | ✓ (institutions value)  | ✓ (evidential role)     |  
  | **Distinctions**                     |                         |                         |                         |  
  | 1. Made by a person                  | ✓ (core focus)          | ~ (often conflates)     | ✓ (separates roles)     |  
  | 2. First instance                    | ~ (if tied to history)  | ~ (if institutions care)| ✓ (flexible)            |  
  | 3. Unbroken causal history           | ✓ (core focus)          | ~ (often relies on it)  | ✓ (one factor)          |  
  | 4. Certified by institutions         | ✗ (ignores social role) | ✓ (core focus)          | ✓ (one function)        |  
  | 5. Beauty/utility                    | ✓ (separates)           | ~ (conflates if valued) | ✓ (clearly distinct)    |  
  | **Constraints**                      |                         |                         |                         |  
  | 1. Copies valued                     | ~ (if history lacking)  | ✓ (e.g., replicas)      | ✓ (different functions) |  
  | 2. Originals worthless               | ✗ (history = value)     | ✓ (not certified)       | ✓ (no function)         |  
  | 3. Markets reward fakes              | ✗ (denies authenticity) | ✓ (if certified)        | ✓ (as functional items) |  
  | 4. Authenticity > quality            | ✓ (prioritizes history) | ~ (if institutions do)  | ✓ (e.g., symbolic role) |  
  | **Overall**                          | Weak (fails cases 1,3,4; ignores constraints 2,3) | Strong (handles most cases; distinctions sometimes conflated) | Strong (flexible; handles all cases and constraints) |  

  - **Causal-historical**: Focuses on physical provenance. Fails on digital objects, famous forgeries, and valueless originals (e.g., a forgotten original with clear history). Overly rigid.  
  - **Institutional**: Grounded in social authority. Excels at cases like digital objects and famous forgeries but risks conflation (e.g., equating institutional certification with "being made by X").  
  - **Functional-pragmatic**: Values originals based on contextual roles (evidential, symbolic, etc.). Most adaptable, handling all cases and constraints by treating factors as context-dependent tools.  

  ---

  #### **Confidence in the List and Least Sure Requirement**  
  - **Confidence in the list**: High (90%). The desiderata are grounded in robust philosophical and real-world cases (e.g., art forgery scandals, digital debates). Non-negotiables reflect bedrock intuitions (e.g., perfect copies don't nullify originality), while contestable items (e.g., firstness) acknowledge unresolved debates.  
  - **Least sure requirement**: **Being the first instance (II.2)**. It is contestable and potentially redundant:  
    - In digital contexts (I.4), primacy is arbitrary, weakening its necessity.  
    - In printmaking (e.g., etchings), multiple "originals" exist, suggesting firstness may not be essential.  
    - However, it is included because primacy matters in some domains (e.g., relics), and excluding it might overlook historical collecting practices. Confidence here is ~60%—it may be domain-specific rather than universal.  

  This list provides a foundation for comparing theories by fixing the evaluative standard. A successful account should handle non-negotiables robustly while engaging contestable items transparently.
