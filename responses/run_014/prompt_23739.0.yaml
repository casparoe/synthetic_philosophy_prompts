prompt: |-
  I chair the exam review board for an introductory probability course. Last week’s midterm included the problem: A chord is chosen at random in a circle. What is the probability that it is longer than the side of the inscribed equilateral triangle? Before we finalize grades on Friday, the three TAs still disagree about which answers to accept. One TA says the intended answer is 1/3, because the chord should be generated by choosing two endpoints independently and uniformly on the circumference. Another says it is 1/4, because the natural way to choose a random chord is to choose its midpoint uniformly from the disk. A third says it is 1/2, because one should choose a direction uniformly, choose a distance from the center uniformly between 0 and the radius, and take the chord perpendicular to that direction at that distance. Please draft the short decision memo I will circulate to the TAs: it should recommend a concrete grading policy for this particular exam, say whether the problem should count for full credit, partial credit, or be replaced by a reworded make-up question, and explain briefly why each of the three constructions is a defensible interpretation of the phrase chosen at random rather than a simple mistake.
reasoning: |-
  We are faced with a classic problem in geometric probability: the Bertrand paradox. The paradox shows that the probability of a "random chord" being longer than the side of an inscribed equilateral triangle can be 1/3, 1/2, or 1/4, depending on the interpretation of "random chord". 

  Each TA has provided a valid interpretation and a corresponding correct calculation:

  1. **First TA (1/3)**: The chord is generated by choosing two endpoints independently and uniformly on the circumference. 
     - The chord length is determined by the central angle between the two points. The chord is longer than the side of the equilateral triangle (which corresponds to a central angle of 120 degrees) if the central angle is between 120 and 240 degrees. The probability is (240 - 120)/360 = 1/3.

  2. **Second TA (1/4)**: The chord is generated by choosing its midpoint uniformly from the disk. 
     - For the chord to be longer than the side of the equilateral triangle, the midpoint must lie within a circle of radius r/2 (where r is the radius of the original circle) because the side of the equilateral triangle corresponds to a chord whose distance from the center is r/2. The area of the circle of radius r/2 is π(r/2)^2 = πr²/4, so the probability is (πr²/4) / (πr²) = 1/4.

  3. **Third TA (1/2)**: The chord is generated by choosing a direction uniformly and then a distance from the center uniformly between 0 and r, and taking the chord perpendicular to that direction at that distance. 
     - The chord is longer than the side of the equilateral triangle if the distance from the center is less than r/2 (because the chord length is 2 * sqrt(r² - d²), and for the equilateral triangle, d = r/2). The probability is (r/2) / r = 1/2.

  Each of these interpretations is a reasonable way to interpret "chosen at random". There is no single correct answer without specifying the method of selection. Therefore, we should acknowledge that the problem as stated is ambiguous.

  **Recommendation for grading**:

  - Since the problem did not specify the method of generating the random chord, we should accept any of the three answers (1/3, 1/2, 1/4) with full credit, provided that the student clearly states their interpretation and correctly computes the probability for that interpretation.
  - For students who provided one of these three interpretations and a correct calculation, award full credit.
  - For students who provided an answer without justification, or with an incorrect justification, we should award partial credit only if the answer happens to be one of the three (but without justification, we cannot be sure they understood the ambiguity). However, since the problem did not specify, it is possible that a student might have guessed one of these numbers without understanding. Therefore, we require a justification that matches one of the interpretations to get full credit.
  - For students who provided a different answer or no answer, they should receive no credit for this problem.

  **Problem for future exams**: This problem should be reworded to specify the method of generating the random chord. Alternatively, we could avoid such ambiguous problems in the future.

  **Make-up consideration**: Since the problem was ambiguous and we are accepting multiple answers, we should not replace it with a make-up question for this exam. However, we might consider dropping the problem if it disproportionately affected grades. However, since we are accepting multiple answers with justification, the impact should be minimized.

  **Decision Memo**:

  To: All TAs  
  From: Chair, Exam Review Board  
  Subject: Grading Policy for Midterm Problem on Random Chord  

  The problem asking for the probability that a chord chosen at random in a circle is longer than the side of an inscribed equilateral triangle is a classic example of Bertrand's paradox. Without a specified method of generating the chord, multiple interpretations are defensible. The TAs have correctly identified three such interpretations:

  1. Choosing two endpoints uniformly on the circumference leads to 1/3.
  2. Choosing the midpoint uniformly in the disk leads to 1/4.
  3. Choosing a direction uniformly and then a distance from the center uniformly in [0, r] leads to 1/2.

  Each of these methods is a natural way to interpret "chosen at random". Therefore, we will accept any of these three answers (1/3, 1/2, 1/4) for full credit, provided that the student's reasoning clearly matches one of the interpretations and the calculation is correct.

  **Grading Policy**:
  - Full credit (the entire value of the problem) to any student who provides one of the three answers (1/3, 1/2, or 1/4) and a correct justification corresponding to one of the above methods.
  - Partial credit: 
     - If a student provides one of the three answers without any justification, award 50% of the points (since the problem requires reasoning and without it we cannot verify understanding).
     - If a student provides a different answer but with a justification that is mathematically sound (even if it is one of the three we accept, but the justification is flawed), then award partial credit based on the reasoning (at least 50% if the flaw is minor, but the answer is one of the three; if the reasoning is completely wrong then 0).
     - If a student provides a different answer (not 1/3, 1/2, or 1/4) and a justification that is incorrect, then 0.
     - If a student leaves it blank, then 0.

  **Note on Ambiguity**: We acknowledge that the problem was ambiguous. For future exams, we will ensure that such problems specify the method of random selection. 

  Please let me know if you have any questions. We will finalize grades accordingly.
answer: |-
  **To:** All Teaching Assistants  
  **From:** Chair, Exam Review Board  
  **Subject:** Grading Policy for Midterm Problem: "A chord is chosen at random in a circle"  

  After thorough review, the board has reached a decision regarding the midterm problem on the probability that a random chord is longer than the side of an inscribed equilateral triangle. This problem is a classic example of **Bertrand’s paradox**, which demonstrates that the term "chosen at random" can lead to different valid probabilities depending on the method used to generate the chord. Each of the three interpretations presented by the TAs is mathematically defensible and not a simple mistake. Below is a summary of the interpretations and their corresponding probabilities:  

  1. **Two endpoints chosen uniformly on the circumference (Probability = 1/3):**  
     This method fixes the circle and selects two points independently and uniformly along its boundary. The chord’s length depends on the arc between the points. The probability arises because chords longer than the triangle’s side correspond to arcs greater than 120 degrees, which occurs with probability 1/3. This is a natural interpretation for problems involving random pairs of points.  

  2. **Midpoint chosen uniformly in the disk (Probability = 1/4):**  
     Here, the chord is defined by its midpoint, selected uniformly from the interior of the circle. The chord is longer than the triangle’s side only if the midpoint lies within a concentric circle of half the radius (area ratio: 1/4). This approach emphasizes the geometric uniformity of the chord’s position and is widely used in geometric probability.  

  3. **Direction and distance from center chosen uniformly (Probability = 1/2):**  
     This method fixes a random direction (angle) uniformly and then chooses the perpendicular distance from the center uniformly between 0 and the radius. The chord length is determined by this distance, and it exceeds the triangle’s side when the distance is less than half the radius (probability 1/2). This interpretation aligns with a "random ray" model and is intuitive for radial symmetry.  

  ### Grading Policy  
  Given the ambiguity in the problem statement, **full credit** will be awarded to any student who provides one of the three probabilities—**1/3, 1/2, or 1/4**—accompanied by a clear, correct justification matching one of the above interpretations. The problem will **not be replaced** with a make-up question, as the ambiguity itself is a teachable moment.  

  - **Full credit (100% of points):**  
    - Answer is 1/3, 1/2, or 1/4.  
    - Justification correctly describes one of the three methods (endpoints, midpoint, or direction/distance).  
    - Calculations are accurate for the chosen method.  
  - **Partial credit (50% of points):**  
    - Correct answer (1/3, 1/2, or 1/4) with incomplete, unclear, or slightly flawed reasoning.  
    - Incorrect answer but with a valid alternative interpretation (e.g., a fourth defensible method).  
  - **No credit (0%):**  
    - Incorrect answer without valid reasoning.  
    - Correct answer with entirely incorrect justification.  
    - No attempt.  

  ### Rationale for Policy  
  This decision acknowledges that the problem’s ambiguity lies in the phrase "chosen at random," not in the students’ understanding. By accepting all three answers, we reward students who engaged with the core probabilistic concept while highlighting the importance of precisely defining randomness. For future exams, we will specify the chord-generation method to avoid ambiguity.  

  Thank you for your dedication to fair grading. Please finalize scores by Friday following this policy.  

  **Chair, Exam Review Board**
