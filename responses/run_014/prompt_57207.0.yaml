  - Weak version (relativity) is more about expressiveness - some languages make certain patterns easier or more natural to use, like Python's list comprehensions versus C's for-loops. 
  - The tool view is like choosing between languages for specific tasks - you'd use R for stats, C for embedded systems, not because you can't think the thoughts, but because it's more efficient.

