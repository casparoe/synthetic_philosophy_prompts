prompt: |-
  I report on machine-learning research for a general-interest outlet, and for the past year I have been covering systems that try to work out what people want by watching what they do: a car that infers your intentions from how you edge toward a merge, a service that infers your tastes from what you click, a lab assistant that infers the task you had in mind from the way you handle it. Interviewing the people who build these systems, I keep encountering the same maneuver, and I have never found a term for it.

  Here is the setup as I understand it. When the goal a system infers for a person looks wrong, the builder has several places to put the discrepancy. The person can be read as wanting something other than what was inferred; as wanting the right thing but being mistaken about what the action would bring about; as wanting the right thing and knowing it, but being shortsighted or weak-willed in the moment; or as acting under a pressure that was never really theirs. The behavior itself rarely settles which of these is correct — the same stretch of conduct can usually be reproduced under more than one of them. What I notice is that the choice among them gets made on other grounds entirely. In one conversation, a researcher told me that a person who repeatedly reached for the sugary option plainly valued something other than health, and that their model had simply been wrong about the goal. In another, describing near-identical behavior in a different product, the same group's framing was that people do value health, they merely discount the future, so the system's job is to help them against themselves. Same evidential pattern, opposite allocation, and in each case the allocation happened to support the story the team wanted to tell about its own product.

  The asymmetry is the part I cannot name. Deference to behavior is switched on and off rather than held constant: when the inferred goal flatters the thing being built, the behavior is treated as authoritative evidence of what people want; when the inferred goal is embarrassing, the same kind of behavior is treated as corrupted by confusion, haste, or design, and the real preference is supplied from somewhere else. Neither move is foolish in isolation — people genuinely are sometimes confused about what will satisfy them, and choices genuinely are sometimes evidence of what someone values — which is exactly what makes the pattern hard to pin down and easy to miss in a press release. It also runs the other way around outside the lab: a company that has shaped which options appear on a screen will insist the resulting clicks are pure expression of taste, while an outside analyst will insist the same clicks are mostly residue of a bad menu. Underneath all of it sits a circularity, since the people whose behavior is being interpreted are busy adapting to the interpretation, so the confirming data can be partly manufactured.

  So: does this have a name? I want the carving more than the label. I am aware that there are established ideas in the neighborhood — the old dispute over whether picking something is evidence of wanting it; the general point that what someone wants cannot be separated from what they believe if all you have is their actions; work on wants that take shape under pressure or that people come to hold because the alternatives were quietly closed off; and a term from the recommender-systems world for loops in which a system's own output generates the data that appears to confirm it. Tell me which of these, or which others, comes closest, and state precisely where each falls short of what I have described. In particular, I want to know whether any existing concept captures the two-sidedness: the selective, direction-dependent appeal to behavior as evidence, together with the fact that the discretion to redistribute the discrepancy among goal, belief, and self-control is precisely the place where a builder's own values enter the system without ever showing up among its stated assumptions. If nothing captures that, then coin it — give me a name and a definition tight enough to be usable in an argument, two or three boundary cases that resemble it but are not instances of it, with the reasons, and a test for distinguishing a genuine case from an ordinary and defensible revision of a model in light of new evidence.
reasoning: |-
  Okay, the user is a journalist covering machine-learning systems that infer human intentions from behavior. They've noticed a pattern where developers interpret behavioral discrepancies in ways that favor their product's narrative—treating behavior as authoritative when it supports their model and dismissing it as irrational when it doesn't. They want to know if this has a name and, if not, a precise term and framework to analyze it.

  First, I need to unpack the core issue: the asymmetric treatment of evidence. When the inferred goal aligns with the system's purpose, behavior is seen as a direct reflection of true preferences. When it doesn't, behavior is attributed to errors or external pressures. This selective deference is key. 

  The user mentions adjacent concepts—revealed preference theory, belief-desire asymmetry, path dependence, and filter bubbles. But none fully capture the two-sided, value-laden discretion in redistributing discrepancies among goal, belief, and self-control. For example, revealed preference assumes behavior equals preference, ignoring the builder's role in framing the interpretation.

  So, creating a new term makes sense. "Teleological Discretion" comes to mind—emphasizing the freedom to assign purpose (telos) based on convenience. The definition must highlight the asymmetry: behavior is binding only when convenient, with discretion used to protect preferred narratives. 

  The user also needs boundary cases to avoid overapplication. Cases like ordinary model updates (no asymmetry) or transparent preference shifts (no hidden agenda) shouldn't qualify. The test for genuine cases should check for consistency: Would the builder accept the same behavioral evidence if it harmed their narrative? If not, it's likely Teleological Discretion.

  Practical use matters. The term should fit into tech criticism, exposing how values enter systems unnoticed. The user's deeper need is to articulate this subtle bias for readers, so the concept must be both rigorous and accessible. I'll structure the response with clear definitions, contrasts with existing ideas, and actionable tests for identification.
answer: |-
  Based on your precise description, this phenomenon doesn't have a single, universally accepted name in the literature. However, the core concept you're identifying – the **selective, asymmetric, and value-laden attribution of discrepancy between observed behavior and inferred goals** – deserves a specific term. Let's carve it out:

  **The Concept:** **Teleological Discretion** (or **Goal Attribution Discretion**)

  **Definition:** The systematic, asymmetric exercise of interpretive freedom by system designers when resolving discrepancies between an agent's observed behavior and their inferred goals. This discretion selectively treats behavior as either:
  1.  **Authoritative Evidence:** Directly revealing true preferences when the inferred goal aligns with the system's purpose or the designer's values.
  2.  **Corrupted Signal:** Attributable to errors in belief ("mistake"), failures of willpower ("akrasia"), or external pressures ("inauthentic pressure") when the inferred goal conflicts with the system's purpose or the designer's values.
  The asymmetry stems from the designer's vested interest in the system's narrative, using the inherent ambiguity in inferring mental states (desires, beliefs, self-control) from behavior to consistently favor interpretations that validate their project.

  **Why existing concepts fall short:**

  1.  **Revealed Preference Theory:** Assumes behavior *is* preference. Your case shows designers *rejecting* this when inconvenient, making it the *subject* of the asymmetry, not the explanation.
  2.  **Belief-Desire Asymmetry (Philosophy):** Focuses on the logical distinction between desires and beliefs in explaining action. It doesn't address the *selective application* of these explanations based on the designer's agenda.
  3.  **Path Dependence / Structuration:** Addresses how choices shape future options/desires. Your focus is on the *interpretive moment itself* – how designers *categorize* a *given* action *now* to serve their needs, not the long-term feedback loop (though this is related to circularity).
  4.  **Preference Construction / Nudging:** Focuses on *how* choices/desires are shaped. Your case is about how designers *justify their interpretation* of existing choices, often to legitimize shaping mechanisms.
  5.  **Filter Bubble / Feedback Loop (Recommenders):** Describes the *outcome* (reinforced preferences/views). Your case describes the *interpretive mechanism* designers use *within* the loop to explain discrepancies and justify the system's actions ("We're giving them what they *really* want" vs. "Their click is just weakness, ignore it").
  6.  **Motivated Reasoning / Confirmation Bias:** These are *broad* psychological tendencies. **Teleological Discretion** is a *specific, structured application* of these within the technical task of goal inference, leveraging the inherent ambiguity of the mind-behavior link. It's motivated reasoning operationalized through the specific levers of goal, belief, and willpower attribution.

  **Capturing the Two-Sidedness:** Teleological Discretion *explicitly* captures the two-sidedness:
  *   **The Selective Appeal:** It defines the asymmetry in when behavior is treated as authoritative vs. corrupted.
  *   **The Value-Laden Discretion:** It centers on the *discretion* inherent in assigning the discrepancy to Goal, Belief, or Will/Control as the precise point where the designer's values and agenda enter the system, bypassing stated assumptions. The "teleological" aspect highlights the focus on *purpose/goal attribution*.

  **Boundary Cases (Resemblance but NOT Teleological Discretion):**

  1.  **Ordinary Model Revision with New Evidence:**
      *   **Resemblance:** A designer updates the inferred goal based on new behavioral patterns.
      *   **Why Not:** The update is driven by a consistent epistemic principle (e.g., Bayesian updating, better fit to *all* data) applied neutrally, *not* by whether the new goal flatters the system. The direction of change isn't predictably aligned with the system's narrative.
      *   **Distinguisher:** Was the *type* of explanation (goal error vs. belief error vs. akrasia) *switched* specifically when the initial inference became inconvenient? Is the revision directionally consistent with protecting the system's core premise?

  2.  **Transparent Preference Shaping:**
      *   **Resemblance:** A system explicitly tries to change user preferences/behavior (e.g., a fitness app encouraging healthier choices).
      *   **Why Not:** If the designer *acknowledges* they are trying to change the user's goals/behavior and doesn't misuse behavioral discrepancies to *retrospectively justify* the *original* goal inference or hide their shaping intent. The interpretation of behavior isn't asymmetrically adjusted to protect an inference.
      *   **Distinguisher:** Does the designer claim the system is merely *revealing* or *facilitating* pre-existing true preferences when behavior aligns, but *correcting* irrationality or error when it doesn't? If yes, it's Teleological Discretion.

  3.  **Genuine Akrasia/Error Diagnosis:**
      *   **Resemblance:** A designer attributes a discrepancy to a user's mistake or lack of self-control.
      *   **Why Not:** If this attribution is based on *independent evidence* (e.g., user self-reports, controlled experiments showing knowledge gaps, physiological markers of stress/impulse) and applied consistently *regardless* of whether the inferred goal aligns with the system's narrative.
      *   **Distinguisher:** Is the attribution *only* invoked when the behavior contradicts the goal the designer *wants* the user to have? Is there evidence *beyond the convenient explanation*?

  **Test for Genuine Teleological Discretion vs. Ordinary Revision:**

  Apply the **Narrative Reversal Test**:

  1.  Identify the discrepancy between observed behavior and the initially inferred goal (G1).
  2.  Identify the designer's new explanation (E) for the discrepancy (e.g., "User actually wants G2", "User believed action led to G1 but was wrong", "User succumbed to weakness wanting G1").
  3.  Ask: **If adopting explanation (E) led to an inferred goal (G_new) that was *even more problematic* for the system's core purpose or the designer's preferred narrative than the original discrepancy, would the designer have still adopted (E) with the same confidence?**
      *   **Yes:** Likely an ordinary, defensible revision based on evidence/principle.
      *   **No:** Strong indicator of **Teleological Discretion**. The adoption of (E) is primarily motivated by it resolving the discrepancy in a way that *protects* the desired narrative, not by its inherent evidential weight or consistent application of a principle.

  **Example Application of the Test:**
  *   **Sugary Choice Case (Researcher 1):** Behavior (sugary choice) contradicts inferred goal (health). Designer adopts E: "User actually values indulgence (G2)". *Test:* If inferring G2 ("indulgence") fundamentally undermined the product's value proposition (e.g., a health coach app), would they *still* have readily adopted E? If likely not, it's Teleological Discretion.
  *   **Sugary Choice Case (Researcher 2):** Same behavior. Designer adopts E: "User values health (G1) but discounts future (akrasia)". *Test:* If interpreting the behavior as akrasia implied the system was fundamentally *incapable* of helping users achieve G1 (health), would they *still* have adopted E? If likely not, it's Teleological Discretion.

  **Why this works:** It isolates the role of the system's narrative/agenda in driving the *choice of explanation type*. Ordinary revision might be wrong, but it isn't predictably guided by protecting a specific vested interest in the *meaning* of the goal. Teleological Discretion uses the ambiguity of the mind-behavior link specifically as a tool for narrative maintenance. This test makes the implicit value judgment driving the discretion explicit.
