  I have just had a long argument with a friend about whether we ought to take wild animal suffering seriously as a moral consideration. Could you please describe the most important implications of taking it seriously for how we should evaluate specific wildlife management decisions, such as culling an overpopulated deer herd or restoring a degraded habitat?
reasoning: |-
