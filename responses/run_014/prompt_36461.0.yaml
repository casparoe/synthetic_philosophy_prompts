          Procedure Document:

          Title: Decision Procedure for Selection Level (Individual vs Group)

          Objective: To determine whether to select on individual records or group means for a given trait, based on evidence of social effects and potential conflict between levels.

          Steps:

          1. If the trait is measured only at the group level (e.g., batch-level disease resistance), then select on group means. STOP.

          2. For traits with individual records (on at least a subset of birds) and group records available:
              a. Fit a univariate linear mixed model including additive genetic effect, random group effect, and fixed effects (as appropriate):
                    y = Xβ + Z_a * a + Z_g * g + e
                 where:
                    a ~ N(0, A * σ^2_a)   (A is the pedigree-derived relationship matrix)
                    g ~ N(0, I * σ^2_g)    (group random effect, assuming groups are unrelated)
                    e ~ N(0, I * σ^2_e)

              b. Estimate variance components and compute:
                    h^2 = σ^2_a / (σ^2_a + σ^2_g + σ^2_e)
                    c^2 = σ^2_g / (σ^2_a + σ^2_g + σ^2_e)

              c. If c^2 < 0.05 AND there is no prior evidence from the literature or company history of social effects for this trait, then select on individual records. STOP.
                 Note: Prior evidence of social effects includes traits known to be affected by interactions (e.g., feather pecking, aggression).

          3. If c^2 >= 0.05 OR there is prior evidence of social effects:
              a. Check if the bivariate analysis is feasible: we need at least 5 fully instrumented groups (groups where every bird has an individual record) to estimate the genetic correlation.
              b. If feasible, for each bird in a fully instrumented group, compute:
                     - The individual trait (y_ij)
                     - The group mean without the focal bird (z_ij) = (total of the group j without bird i) / (n_j - 1)
              c. Fit a bivariate linear mixed model:
                     [y_ij]   = [X_ij] * β_1 + a_{1,i} + g_{1,j} + e_{1,ij}
                     [z_ij]   = [X_ij] * β_2 + a_{2,i} + g_{2,j} + e_{2,ij}
                 with:
                     [a_{1,i}, a_{2,i}]' ~ N(0, A ⊗ G_a)   where G_a is a 2x2 genetic covariance matrix
                     [g_{1,j}, g_{2,j}]' ~ N(0, I ⊗ G_g)   where G_g is a 2x2 group covariance matrix
                     [e_{1,ij}, e_{2,ij}]' ~ N(0, I ⊗ R)   where R is a 2x2 residual covariance matrix

                 We are interested in the genetic covariance σ_{a12} and the genetic correlation:
                     r_g = σ_{a12} / sqrt(σ^2_{a1} * σ^2_{a2})

              d. If r_g is significantly negative (p-value < 0.05 for the test that r_g < 0), then select on group means. STOP.
              e. If r_g is not significantly negative (p>=0.05) or positive, then select on individual records. STOP.

          4. If the bivariate analysis is not feasible (insufficient fully instrumented groups):
              a. If there is prior evidence of a conflict (e.g., traits like feather pecking where individual and group interests conflict), then select on group means. STOP.
              b. Otherwise, select on individual records. STOP.

          Notes:
            - The above procedure does not cover the possibility of using an index of individual and group information. That is an advanced option and can be considered in the future.
            - The threshold of 0.05 for c^2 is a rule of thumb. If in doubt, proceed to step 3.
            - The p-value for r_g should be obtained from the standard error of the genetic correlation (using the asymptotic normality of the REML estimates, or a likelihood ratio test). However, in practice, the standard error can be large. Therefore, if the estimate of r_g is negative but not significant, we are not concluding conflict.

          Cases:

          Case 1: Feather pecking and mortality.
              Step 1: Trait is available at individual level? Yes (mortality is an individual trait? But we might have individual mortality records: e.g., survival time or binary). Group records: mortality rate per group.
              Step 2: 
                  c^2 is expected to be high -> go to step 3.
              Step 3: 
                  We have fully instrumented groups? We assume yes for some. 
                  Trait definitions:
                      y_ij: survival time of bird i (or binary: survived=1, died=0)
                      z_ij: mean survival time (or mean survival) of the other birds in the group.
                  We expect r_g negative? Because a bird that lives long might be a pecker and kill others? Or a bird that dies early might be a victim and then the others survive? Actually, we want: if a bird has genes that make it survive longer (direct effect), does that reduce the survival of others (indirect effect)? Then r_g (between direct effect on own survival and indirect effect on others' survival) is negative.
                  So we expect to find r_g negative -> select on group means.

          Case 2: Feed conversion efficiency.
              Step 2: 
                  c^2 low and no prior social effects -> select on individuals.

          Case 3: Resistance to challenge disease (batch-level).
              Step 1: only group records -> select on group means.

          Biting the bullet: Case 1 comes out as group selection, which is expensive because it requires group-level records for all groups and does not use the individual records (except for the bivariate analysis). But it avoids making feather pecking worse.

          What the procedure cannot do:
            - It cannot handle traits that are not linearly additive in the direct and indirect effects? 
            - It does not account for changes in group composition over time.
            - It assumes that group effects are constant and do not depend on the group members.

          The most uncertain step: Step 3 (the bivariate analysis) because:
            - We are approximating the indirect genetic effect by the group mean without the focal individual. This is valid, but the model might be misspecified if there are non-linear effects.
            - The power to detect a negative r_g might be low if the number of fully instrumented groups is small.

          We hope this procedure will provide a consistent and scientifically grounded approach.

          Note: The breeding director should be consulted if there is a need to deviate from the procedure due to practical constraints or if new scientific evidence emerges.

          End of procedure.
answer: |-
  ### Standing Decision Procedure for Selection Level (Individual vs. Group)  
  **Objective**: Determine whether to select on **individual records** (instrumented subset), **group means**, or **terminate early** based on data availability and evidence of conflict between individual and group levels. Incorporates Price equation logic (partitioning selection into within-group vs. between-group effects) via accessible mixed models.  

  ---

  ### Procedure Workflow  
  **Key Inputs**:  
  - Trait data: Individual records (subset), group means (all colonies), mortality/production metrics.  
  - Pedigrees: Full kinship matrices.  
  - Batch structure: Group assignments, challenge doses (if applicable).  

  **Outputs**:  
  - **"Select on individuals"**, **"Select on group means"**, or **"Escalate to director"** (for non-statistical decisions).  

  #### Step 1: Check Data Availability  
  - **Question**: Is the trait *only* measured at the group level?  
  - **Sufficient Answer**:  
    - **Yes** (e.g., challenge disease resistance with batch-level dosing only):  
      → **Terminate with "Select on group means"** (Case 3 outcome).  
    - **No** (individual records exist for a subset):  
      → Proceed to Step 2.  

  #### Step 2: Estimate Group Variance Component  
  - **Analysis**: Fit a univariate mixed model with **random group effect**:  
    ```r
    y_ij = Xβ + Z_a * a_i + Z_g * g_j + e_ij  
    ```  
    - `y_ij`: Trait value of bird `i` in group `j`.  
    - `a_i`: Additive genetic effect (pedigree-based, `a ~ N(0, Aσ²_a)`).  
    - `g_j`: Random group effect (`g ~ N(0, Iσ²_g)`).  
  - **Threshold**: Compute `c² = σ²_g / (σ²_a + σ²_g + σ²_e)`.  
    - **c² < 0.05** AND no prior evidence of social effects (e.g., feed efficiency):  
      → **Terminate with "Select on individuals"** (Case 2 outcome).  
    - **c² ≥ 0.05** OR prior social effects (e.g., feather pecking):  
      → Proceed to Step 3.  
  - **Why?**: High `c²` signals group effects dominate. Low `c²` suggests individual focus suffices.  

  #### Step 3: Test for Conflict via Genetic Correlation  
  - **Analysis**: Fit a bivariate animal model to estimate `r_g` (genetic correlation):  
    - **Trait 1**: Individual trait (`y_ij`).  
    - **Trait 2**: Group-mean trait *excluding focal bird* (`z_ij = mean(y_{-i,j})`).  
    - **Model**:  
      ```r
      [y_ij, z_ij]^T = Xβ + [a_y, a_z]^T + [g_y, g_z]^T + [e_y, e_z]^T  
      ```  
      - Genetic effects: `[a_y, a_z] ~ N(0, A ⊗ G)`, where `G = [σ²_a,y, σ_a,yz; σ_a,yz, σ²_a,z]`.  
      - `r_g = σ_a,yz / (σ_a,y * σ_a,z)`.  
  - **Threshold**:  
    - **r_g < 0 and significant (p < 0.05)**:  
      → **Terminate with "Select on group means"** (Case 1 outcome).  
    - **r_g ≥ 0 or non-significant**:  
      → **Terminate with "Select on individuals"**.  
  - **Why?**: Negative `r_g` indicates conflict (e.g., genes boosting individual fitness reduce group fitness). Positive/non-sig. implies alignment.  

  #### Step 4: Fallback (If Step 3 Infeasible)  
  - **Question**: Are ≥3 fully instrumented groups available?  
    - **No** (e.g., insufficient data for bivariate model):  
      - Prior evidence of conflict (e.g., feather pecking)?  
        → **Yes**: Select on group means.  
        → **No**: Select on individuals.  
    - **Yes**: Return to Step 3.  
  - **Escalation**: If prior evidence is ambiguous → **Escalate to director** (values-based decision).  

  ---

  ### Key Philosophical Distinctions Encoded  
  1. **Alignment vs. Conflict**:  
     - **Alignment** (Steps 2–3): Individual and group selection agree (e.g., feed efficiency). `r_g ≥ 0` implies no conflict; individual selection suffices.  
     - **Conflict** (Step 3): Negative `r_g` confirms Dawkins-Gould tension (e.g., feather pecking). Group selection overrides individual.  
     - **Equivalence Point**: When `r_g ≈ 0` or `c² ≈ 0`, the choice is statistical equivalence (bookkeeping). Procedure defaults to individual selection (cost efficiency).  

  2. **When Conflict Changes Decisions**:  
     - Selecting on individuals when `r_g < 0` worsens group performance (e.g., feather pecking). Procedure "bites the bullet" by demanding group selection.  

  ---

  ### Case Applications  
  #### Case 1: Feather Pecking (Mortality)  
  - **Step 1**: Individual records exist → Proceed.  
  - **Step 2**: High `c²` (group effects strong) → Proceed.  
  - **Step 3**: `r_g` negative (e.g., -0.6, p=0.01) → **Select on group means**.  
    - **Why?**: Genuine conflict. Individual selection historically worsened pecking; group selection aligns with welfare goals.  

  #### Case 2: Feed Conversion Efficiency  
  - **Step 1**: Individual records exist → Proceed.  
  - **Step 2**: Low `c²` (<0.05), no social effects → **Select on individuals**.  
    - **Why?**: Individual and group interests align (high `r_g` expected).  

  #### Case 3: Challenge Disease Resistance  
  - **Step 1**: Only batch-level records → **Select on group means**.  
    - **Why?**: No individual option.  

  ---

  ### Limitations and Confidence  
  #### What the Procedure Can’t Settle  
  - **Non-Statistical Escalations**:  
    - Cost-benefit tradeoffs (e.g., "Is 8x instrumentation cost worth a 5% gain in group welfare?").  
    - Values conflicts (e.g., sales vs. welfare priorities).  
    → **Junior geneticists escalate here**.  
  - **Data Gaps**:  
    - Fewer than 3 fully instrumented groups → Relies on priors (director input if ambiguous).  
    - Non-linear social effects → Assumes additive genetics.  

  #### Confidence Assessment  
  - **High Confidence**:  
    - Step 1 (data availability): Binary, objective.  
    - Step 2 (`c²` threshold): Standard variance partitioning (validated in litterature).  
  - **Moderate Confidence**:  
    - Step 3 (`r_g`): Load-bearing theory (Price/contextual analysis). Bivariate models are established but sensitive to data quality.  
  - **Lowest Confidence**:  
    - **Step 3 fallback (priors)**: Rule-of-thumb. Most uncertain when priors are weak (e.g., novel traits).  

  ### Final Output  
  The procedure resolves debates by:  
  1. Prioritizing data availability.  
  2. Quantifying conflict via `r_g`.  
  3. Defaulting to cost-efficient individual selection *only* when alignment is confirmed.  
  **Feather pecking outcome**: Bites the bullet—select on group means despite costs.
