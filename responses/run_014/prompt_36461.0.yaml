  We are going to design a standing decision procedure based on quantitative genetics and the Price equation partition (which can be linked to multilevel selection and contextual analysis). The goal is to decide between selecting on individual records, group means, or a blend.

   The key insight from the units-of-selection debate is that we can partition the total change in a trait (or fitness) into within-group and between-group components. In the context of breeding, we are interested in the response to selection. The Price equation allows us to write:

     Δμ = Cov(ω_i, z_i) = E[Cov(ω_ij, z_ij | group j)] + Cov(E[ω_ij | group j], E[z_ij | group j])

   where:
     Δμ is the change in the population mean of the trait z.
     ω_i is the relative fitness of individual i.
     z_i is the trait value of individual i.

   The first term (expectation of within-group covariances) is the within-group selection, and the second term (covariance of group mean fitness and group mean trait) is the between-group selection.

   In breeding, we are often selecting to improve a trait (like egg production) or a fitness-related trait (like survival). We can use this partition to understand the forces at play.

   However, note: We are not necessarily selecting on fitness per se, but on a trait that may have an indirect relationship. Therefore, we need to consider the genetic basis of the trait and the genetic correlations between the trait and fitness, and also between the individual trait and the group context.

   A practical approach is to use a two-level linear mixed model (multilevel model) that includes both individual and group effects. This is similar to the "contextual analysis" approach where we regress individual fitness on individual trait and group mean trait. But note: in our case, we are not always measuring fitness, but we are measuring traits that we want to improve (which may be components of fitness).

