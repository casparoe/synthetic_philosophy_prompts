  Another point: the same rules of evidence apply in both trials, but the standards of proof differ. This suggests that evidence admissibility isn't stake-sensitive, but the sufficiency is. That could support the decision-rule view. Judges not considering consequences when ruling on law might indicate that legal interpretation is stakes-invariant, contrasting with fact-finding which could be stakes-sensitive.

  I should clarify where the practice is underdetermined. The legal system doesn't explicitly endorse contextualism; it just sets different burdens of proof. Philosophers can interpret this in different ways. The practice fits with multiple theories without strictly presupposing any. The key is the trade-off between error types (false positives vs false negatives) based on consequences.

