  Then there's the issue of consistency within the legal system. The user points out that judges aren't supposed to consider consequences when interpreting the law, and evidence rules are similar in both trials. How does that fit with contextualism? Maybe the legal system separates epistemic evaluation from practical stakes in different contexts.

