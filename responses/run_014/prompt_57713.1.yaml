prompt: |-
  You're a legal philosopher who's put in real time on transitional justice — imagine you're the person a truth commission rings up when it wants to know whether it's allowed to prosecute things that weren't crimes when they happened. Think hard about this rather than giving me the textbook tour; I want a principle I can actually apply, and I want you to be willing to tell me I'm inconsistent.

  I keep having intuitions about retroactive punishment and they don't line up, and I can't tell whether that means I need a more complicated principle or that some of my verdicts are just wrong. Here they are:

  1. The Nuremberg "crimes against peace" count — planning and waging aggressive war — against the men who did exactly that: I think the conviction was illegitimate, even though starting the war was the worst thing any of them ever did. Nobody had ever been prosecuted for aggression and no statute made it a crime.
  2. But the atrocity counts in those same trials, the ones about what was actually done to people: legitimate, no statute needed.
  3. Germany prosecuting the soldiers who shot people trying to get over the Berlin Wall, when East German law not only permitted it but treated it as a duty: legitimate. They were acting under the valid law of their own place and time and I still think convicting them is fine.
  4. Prosecuting a judge who faithfully applied a valid statute of his own regime that criminalized something trivial — say a wartime decree against listening to foreign broadcasts: NOT legitimate. This one wrecks me, because it looks structurally identical to #3 (an official applying the law of the regime he serves) and I want the opposite verdict.
  5. A conscript who fired at the wall under an order he'd have been shot for disobeying: not legitimate to convict him, though the officer who gave the order is fair game.
  6. Retroactively extending a limitations period for a serious crime while the old one still has time left: fine. Retroactively reviving one that already ran out forty years ago: not fine — and I honestly can't say why the line sits there.
  7. Retroactive tax legislation, and retroactive civil liability for old harms (asbestos, poisoned land): basically fine, small twinge only.
  8. Applying a new, harsher sentencing range backwards to a crime committed before it existed: not fine.
  9. Retroactively decriminalizing something, or amending a charge in the accused's favor: obviously fine, and I think any principle that can't explain why this direction is different is broken.
  10. A country abolishes the marital rape exemption and then prosecutes a man for conduct from ten years earlier that was legal then but which he and everybody else knew was monstrous: genuinely don't know. I lean toward legitimate, which makes me nervous about #1 and #4.

  My tentative principle is that retroactive punishment is legitimate only if (a) the defendant could reasonably have known the act was seriously wrong by a standard available to him at the time, independent of the state's say-so, and (b) the tribunal would be willing to apply the same retroactive standard to its own side's conduct. I suspect this is too crude — clause (b) doesn't look like it belongs in a theory of legality at all, it looks like a fairness-of-the-court requirement smuggling itself in.

  So: first brainstorm two or three candidate principles that could capture the list — an "extreme injustice is no law" style move, a notice-and-reliance one, a serious-wrong-versus-regulatory-offense one, something about who's holding the gavel, whatever else you think works better — and say what each has to sacrifice to keep going. Then commit to one. State it precisely, clause by clause, and for each clause tell me which numbered case motivates it and what the clause rules out. Then the part I care about most: which of my verdicts does your principle force me to abandon, and which did I get right for the wrong reason? Point at #3 vs #4 specifically — if your principle can't separate them, say so plainly instead of fudging.

  Finally run it on two cases I didn't list: a transitional government that retroactively criminalizes profiting from public office and goes after businessmen who got rich with the old regime's explicit blessing, and a state that retroactively voids pardons granted by an outgoing dictator to his own officers.

  If the principle you land on already has a name in the literature, give me the name — but don't invent citations, quotes or page numbers, I have no way to check them and I'd rather you just be straight with me. A table mapping your clauses onto my ten cases is fine if that's cleaner.
reasoning: |-
  Hmm, the user is asking me to role-play as a legal philosopher specializing in transitional justice, specifically on the issue of retroactive punishment in truth commissions. They've presented ten real-world cases where their intuitions conflict, and they want me to develop a coherent principle that can resolve these inconsistencies.

  Looking at their cases, I see fundamental tensions:
  - Nuremberg aggression charges feel wrong despite the act's gravity (#1), but atrocity charges feel right without statutes (#2)
  - East German border guards should be convicted (#3), but judges applying bad laws shouldn't (#4) - this is their core frustration
  - Conscripts get immunity (#5) but officers don't
  - Limitations periods can be extended but not revived (#6)
  - Civil retroactivity is tolerable (#7) but criminal isn't (#8)
  - Decriminalization retroactivity is unproblematic (#9)
  - Marital rape prosecution is borderline (#10)

  Their self-proposed principle (reasonable knowledge of moral wrong + symmetrical application) feels unstable to them, and I agree - the symmetry condition seems extrinsic to legality.

  Now I need to brainstorm candidate principles:
  1. The "Radbruch formula" (extreme injustice invalidates law): Would explain #3 (shooting fugitives) and #2 (atrocities) but clashes with #4 (judges applying bad laws) and #1 (aggression charges)
  2. Notice-and-reliance: Focuses on fair warning. Explains #6 (limitations periods), #8 (sentencing), #9 (decriminalization) but fails #3 (border guards knew shooting was wrong) and #2 (atrocities)
  3. Agent-role differentiation: Distinguishes law-appliers (judges) from law-executors (soldiers). Could resolve #3 vs #4 but struggles with #5 (conscripts vs officers) and #10 (marital rape)

  After weighing these, I'm converging on a hybrid principle:
  - Core: Acts violate deep moral norms knowable at the time (addressing #1, #2, #3, #10)
  - Corollary 1: No retroactivity for neutral rule-appliers (judges in #4)
  - Corollary 2: Proportionality in sanctions (explains #6, #7, #8)
  - Directional asymmetry: Leniency retroactivity always allowed (#9)
  - Explicit exceptions: Duress (#5), reliance interests (#6 revival)

  This framework forces abandonment of:
  - Their leniency on marital rape (#10) if no pre-existing norm existed
  - Their rejection of aggression charges (#1) if we recognize pre-1945 condemnation of aggressive war

  Crucially, it resolves the #3/#4 puzzle: Border guards committed direct moral wrongs (violating bodily integrity), while judges merely applied flawed statutes without personal moral agency.

  For their unlisted cases:
  - Prosecuting cronies: Legitimate if corruption violated deep norms
  - Voiding pardons: Impermissible - violates reliance and the principle that pardons are acts of state

  I'll present this as the "Moral Core + Institutional Role" principle, acknowledging influences from Fuller and Hart while avoiding false citations. The structure will be clause-by-clause with explicit case mappings.
answer: |-
  Here's a straight-talking, principle-forged-in-practice approach. After wrestling with your cases, I discard textbook formalism ("no retroactivity ever!") *and* natural law overreach ("injustice = no law!"). Your intuitions reveal a deeper structure about **agency, moral core, and institutional role**. Here's the principle I'd stake my reputation on:

  **The Moral Core + Institutional Role Principle (MCR):**

  1.  **Core Violation Clause:** Retroactive *criminal* punishment is legitimate only if the act violated a **deep, widely recognized moral norm existing at the time of commission**, demonstrably knowable to the actor, *and* the act constituted a **direct, severe violation of fundamental human integrity** (physical, mental, existential).  
      *   *Motivated by:* #2 (Atrocities inherently violate bodily integrity/dignity), #3 (Shooting fugitives violates the core norm against killing outside combat), #10 (Marital rape violates bodily autonomy - if the norm existed then).  
      *   *Rules out:* #1 (Aggression was state policy, not a *personal* violation of human integrity; lacked universal criminal recognition), #4 (Applying a bad law isn't *in itself* a direct, personal violation of integrity; the judge acts as a system-component), #8 (Sentencing is about state calibration, not the core wrong).  
  2.  **Agent Role Corollary:** Where an actor primarily functioned as a **neutral applier or executor of a system's formal rules** (not as a personal initiator or moral agent within that system), retroactive punishment is **illegitimate**, even if the *outcome* was unjust.  
      *   *Motivated by:* #4 (Judge applying statute), #5 (Conscript obeying coercive order).  
      *   *Rules out:* Prosecuting clerks, low-level bureaucrats, or conscripts purely for rule-following. *Contrasts with:* #3 (Border guard made a personal choice to *kill*, not just follow procedure; the act's core violation dominates), #5 Officer (Initiates harmful action).  
  3.  **Reliance & Leniency Corollary:** Retroactive changes affecting liability or sanction severity are permissible **only if they benefit the accused** (#9 - decriminalization/amendment). Retroactive changes detrimental to the accused are permissible **only if**:  
      a. They involve **procedural rules or limitations periods *not yet expired* at the time of change** (#6 extension - reasonable reliance not yet crystallized).  
      b. They do **not create *new* core criminal liability** (covered by Clause 1).  
      *   *Motivated by:* #6 (Expired limitations = crystallized reliance; unexpired = reliance still conditional), #7 (Civil/tax liability = fundamentally different from core criminal punishment; reliance weaker), #8 (Sentencing severity directly increases core punishment retroactively), #9 (Directionality matters fundamentally).  
      *   *Rules out:* #6 revival (Creates liability where reliance was absolute), #8 (Increases core sanction retroactively), retroactive creation of *new* crimes lacking a pre-existing deep moral core.

  **What Your Principle Forces You to Abandon (and Why):**

  1.  **#1 (Nuremberg Aggression Illegitimate):** **Abandon.** MCR-Clause 1 *could* support it *if* we argue "waging aggressive war" inherently violates the deep norm against mass murder/enslavement (a *direct* consequence) and was widely condemned morally pre-1945 (Kellogg-Briand, etc.). Your intuition likely stems from the lack of *positive law*, but MCR prioritizes the *moral core and direct harm*. This is a hard case, but MCR leans towards legitimacy if the link to core violations is proven.
  2.  **#4 (Judge Applying Trivial Law Not Prosecutable):** **KEEP, but for the RIGHT reason.** Your intuition is correct, but not because it's "structurally identical" to #3. MCR-Corollary 2 protects the *judge's role* as a neutral applier. The border guard (#3) isn't primarily a rule-applier; he's the direct inflictors of the core violation (killing). The judge, however perverse the law, is applying the system's rules.
  3.  **#10 (Marital Rape Prosecution Legitimate?):** **Conditional.** *Only* legitimate if it can be shown the **deep moral norm against non-consensual sexual violence *within marriage* was widely recognized and knowable at the time** in that society. If the exemption was deeply culturally ingrained and seen as *legitimate*, retroactive prosecution violates MCR-Clause 1 (no pre-existing core norm *for that context*) and fair notice. Your lean might stem from the core violation *now*, but retroactivity requires the norm *then*. This might force abandonment of your lean.

  **#3 vs. #4 - How MCR Separates Them (No Fudge):**

  *   **#3 (Border Guard):** The act (**shooting to kill** a non-combatant) is a **direct, severe violation of fundamental human integrity** (Clause 1 - the core norm against murder). The guard's role involves direct, lethal agency. The East German law doesn't negate the knowable deep moral wrong; it merely purported to *justify* it. The act's *nature* dominates over the systemic role.
  *   **#4 (Judge):** The act is **applying a valid (though unjust) statute** (Corollary 2). The judge isn't *personally* violating the victim's integrity; they are enforcing a system rule. The harm flows *through* the system. Even if the law was monstrous (e.g., genocide decree), the judge *qua judge* is acting as a systemic agent. Punishing *this* retroactively targets the *role*, not a direct core violation by the individual. (Punishing the *drafters* might pass Clause 1).

  **Your "Right for Wrong Reason" Cases:**

  *   **#5 (Conscript not prosecutable, Officer is):** You're right. MCR explains it via **Corollary 2 (Agent Role)** for the conscript (coerced executor) and **Clause 1** for the officer (initiating/core violation, even if ordered). Your reason (duress) is part of it, but MCR anchors it in role/agency distinction and the nature of the core violation.
  *   **#6 (Limits Extension ok, Revival not ok):** You're right. MCR explains it via **Corollary 3b** (Reliance crystallizes once the period expires; reviving it creates new liability). Your intuition about the "line" reflects the reliance interest MCR formalizes.
  *   **#7 (Retro Civil/Tax Fine):** You're right. MCR explains it via **Corollary 3b** (Not core criminal liability; fundamentally different type of legal consequence with weaker reliance interests inherent in civil/regulatory spheres).

  **Applying MCR to Your New Cases:**

  1.  **Retroactively criminalizing profiting from public office & prosecuting cronies:**  
      *   **MCR Verdict:** **Likely ILLEGITIMATE.** While corruption *might* violate a deep moral norm (Clause 1 potential), the act here is **profiting under explicit state blessing**. The crony relied on the *validity* of the regime's rules/permissions. Punishing retroactively primarily targets them as **beneficiaries of the system, not as direct perpetrators of a core violation of human integrity**. It fails Clause 1 (lacks the *direct, severe human integrity* violation of, say, torture) and leans into Corollary 2 (they were operating within the system's permitted, though corrupt, rules). (This feels like stretching "core violation" too far).

  2.  **Retroactively voiding pardons granted by a dictator to his officers:**  
      *   **MCR Verdict:** **ILLEGITIMATE.** A pardon is a final act of state extinguishing liability. Voiding it retroactively **recreates core criminal liability** after the individual had acquired a **vested right/reliance interest** (Corollary 3b - analogous to reviving an expired limitations period). It violates the finality and reliance principles underpinning Corollary 3. The *original* prosecution of the officer might have been legitimate under Clause 1, but the pardon, once granted and relied upon, creates a barrier retroactivity cannot cross.

  **Name in Literature:** This principle synthesizes elements. Clause 1 draws on **Lon Fuller's "Internal Morality of Law"** (particularly the congruence between law and morality, and the requirement that law not demand the impossible/contradict deep morality) and **Gustav Radbruch's Formula** (extreme injustice is no law), but **rejects Radbruch's extreme** by focusing on *specific acts* violating *deep, knowable, contemporary norms* and *direct human integrity*, not just any "injustice". The Agent Role Corollary reflects concerns about **individual culpability vs. systemic function** seen in debates about **bureaucratic responsibility** (Hannah Arendt, Karl Jaspers). The Reliance/Leniency Corollary is pure **Rule of Law fairness/notice** (Dicey, Hayek) applied specifically to transitions. You won't find "MCR Principle" verbatim, but its components are grounded in these strands. Think "Fuller+ Radbruch (tempered) + Agency Theory + Reliance".
