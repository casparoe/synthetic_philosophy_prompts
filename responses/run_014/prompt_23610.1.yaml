prompt: |-
  Quick background on me: I spent thirty years as an epidemiologist, so my whole professional life was arguing with people about what the data actually show, and I figured that made me a decent person to sit on the board of our family foundation, which decides where to send a few million dollars a year into global health research. I'm retired now and have recently, to my grandchildren's great amusement, gotten into philosophy, and one idea I keep turning over is this thing I read about where you stop voting on what to do and instead let a prediction market tell you which option will actually turn out best, then just fund that one. It sounds crazy until you think about it, and our new program director has now proposed we do a scaled-down version of exactly this for next year's grant cycle.

  Here's the concrete proposal. Instead of the board deliberating and voting on which of the three or four candidate grants to fund, we'd run a little internal market where our grant officers and a handful of outside forcasters bet points on which grant will avert the most disease over the next five years, and we fund whatever comes out on top, full stop. I have to circulate a short written opinion before Thursday's board meeting and I'm genuinly stuck. On the one hand the logic is seductive: we keep pretending our deliberations are more informed than they are, nine retired people arguing in a conference room is not obviously smarter than a market of people who have skin in the game, and the director makes a good point that we'd at least be forcing everyone to put a number on their uncertainty. On the other hand something is wrong and I can't pin it down. I keep thinking that predicting which grant will work is a completely different and much harder problem than choosing which one we ought to fund, and I'm not even sure "averts the most disease in five years" is the thing we actually care about, or that the people running the market are neutral when two of them wrote the grant proposals they're betting on.

  Can you draft the memo I'll send out? I need a clear bottom line at the top — adopt, reject, or adopt with specific conditions — followed by the reasoning, and I'd like it to take the strongest version of the director's case seriously rather than just dunking on prediction markets, because a couple of my boardmates actually like the idea and I don't want to lose them. If there's a version of this that keeps what's genuinely good about the proposal (I think there is) while fixing what's broken, I'd rather you recommend that than a flat no.
reasoning: |-
  Hmm, this user is a retired epidemiologist and board member of a family foundation focused on global health research. They're dealing with a proposal to replace traditional grant voting with a prediction market system. I need to help them draft a memo for their board meeting.

  The user has several concerns that need addressing. They see some logic in prediction markets - especially how they force quantification of uncertainty and draw on diverse expertise - but worry about fundamental flaws. Key issues include: conflating predictiveness with desirability, narrow outcome metrics ("averts most disease in 5 years"), and potential conflicts of interest since some participants wrote the grants. 

  There's also the deeper question of whether this approach aligns with the foundation's values. As an epidemiologist with decades of experience, the user understands that real-world impact involves complex trade-offs that can't be reduced to a single metric. Their grandchildren's amusement at their philosophy interest suggests they value intellectual humility while recognizing their own expertise.

  The memo should start with a clear recommendation: reject the proposal as-is but suggest a modified version that captures the benefits while fixing the flaws. The strongest version of the director's case should be acknowledged - prediction markets do aggregate dispersed knowledge effectively and force concrete predictions. 

  The compromise would involve using prediction markets as an input to deliberation rather than a replacement. Specific conditions could include: ensuring conflict-free participants, broadening outcome metrics, and maintaining board oversight. This honors the director's innovative intent while preserving the foundation's responsibility to make value-based decisions.

  The reasoning should emphasize that while prediction markets are useful tools, they shouldn't override human judgment about what constitutes meaningful impact in global health. The foundation's role isn't just to predict outcomes but to make ethical choices about which outcomes matter most.
answer: |-
  ## MEMORANDUM

  **To:** Board of Directors, [Family Foundation Name]  
  **From:** [Your Name], Board Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Proposal to Use Prediction Markets for FY25 Grant Selection  

  **Bottom Line: Reject the proposal to *replace* board deliberation and voting with a prediction market outcome for final funding decisions. Instead, **Adopt a Modified Approach:** Run the proposed prediction market *alongside* our traditional process as a structured input for discussion, with the Board retaining final decision authority.**  

  ### Strengths of the Director's Proposal (Why We Should Engage With This Idea)
  The core logic of the prediction market proposal is compelling and deserves serious consideration:

  1.  **Aggregating Dispersed Knowledge:** Markets efficiently synthesize information from diverse participants (officers, forecasters), potentially surfacing insights or uncertainties individual board members might miss.
  2.  **Quantifying Uncertainty:** Forcing participants to "put points where their beliefs are" creates tangible, comparable estimates of confidence in each grant's projected impact, moving beyond vague qualitative opinions.
  3.  **Mitigating Deliberation Biases:** It offers a counterbalance to potential groupthink, dominance by vocal individuals, or the limitations of nine retired experts (myself included!) relying solely on our collective, but potentially outdated or incomplete, judgment.
  4.  **Focus on Prediction:** It explicitly centers the *predictive* question of "which grant *will* avert the most disease?" – a crucial, though not sole, component of our decision.

  These advantages represent a genuine opportunity to *enhance* our process with valuable new data and perspectives. The Director is right to challenge us to improve.

  ### Critical Concerns Requiring Modification (Why "Full Stop" Funding is Problematic)
  However, delegating final funding authority *solely* to the market outcome presents significant, potentially fundamental, flaws:

  1.  **Predictability vs. Desirability (The Core Conflict):** As flagged in my initial thoughts, "which grant *will* work best?" is distinct from "which grant *should* we fund?". The market predicts the *most likely high-impact outcome* based on the defined metric. Our duty encompasses:
      *   **Value Judgments:** Is maximizing *quantitative disease burden averted in 5 years* truly our *only* goal? What about equity (reaching the most marginalized), sustainability (building long-term capacity), focus on neglected diseases, feasibility of scale-up, or ethical considerations? A market focused purely on one metric cannot weigh these.
      *   **Risk Tolerance:** The market predicts the *expected value*. Should we fund a high-risk/high-reward project predicted to have a 30% chance of massive impact and a 70% chance of moderate failure, or a safer bet predicted to have an 80% chance of solid but unspectacular results? The Board must decide our risk appetite.
      *   **Broader Impact:** Will the project advance the field, train researchers, or influence policy beyond its direct disease burden impact? The market metric likely ignores these.

  2.  **The Metric Problem:** "Averts the most disease over five years" is an attractive simplification but may be a poor proxy for our actual complex mission. It risks:
      *   Favoring short-term, measurable interventions over transformative but longer-term or harder-to-measure research.
      *   Ignoring important qualitative dimensions of impact.
      *   Potentially incentivizing proposals that game this specific metric.

  3.  **Conflict of Interest & Market Integrity:** The concern about grant officers betting on proposals they authored is valid and corrosive to market credibility. Even with points instead of money, this creates perverse incentives and undermines the perception (and likely reality) of objective prediction. Ensuring truly neutral forecasters in a small, internal market is extremely difficult.

  4.  **Limited Scope & Expertise:** A small internal market (officers + a few outsiders) may not capture the full range of relevant expertise or perspectives needed for robust prediction, especially compared to accessing broader scientific consensus.

  5.  **Accountability Abdication:** Ultimately, the Board is accountable for the Foundation's decisions and stewardship of funds. Outsourcing this to a market mechanism, however sophisticated, absolves us of our fiduciary responsibility to exercise informed judgment based on *all* relevant factors, not just predicted quantifiable impact on one dimension.

  ### The Recommended Path Forward: Prediction Market as Input, Not Arbiter
  We can harness the genuine strengths of the Director's innovative idea while safeguarding against its pitfalls by integrating it as a *tool* within our existing governance framework:

  1.  **Run the Prediction Market:** Execute the proposed internal market as designed, focusing on predicting "DALYs averted (or equivalent) in 5 years" for the shortlisted grants.
  2.  **Mandate Conflict Mitigation:** Implement strict rules: Any grant officer involved in writing a proposal *must* abstain from betting on *any* proposal in that cycle. Actively recruit outside forecasters with no stake in the outcome. Transparently disclose all participants and potential conflicts.
  3.  **Present Market Output as Key Data:** Include the market's predictions (probability distributions, point estimates, trading activity insights) prominently in the pre-meeting board packet and as a central part of the grant officer presentation. Highlight where consensus is strong vs. weak.
  4.  **Structured Deliberation:** Use the market output to *inform* and *focus* the Board's discussion. Key questions:
      *   Do we agree with the market's predicted ranking? Why or why not?
      *   What factors beyond the 5-year disease burden metric are crucial for *this specific set* of grants? (e.g., equity, sustainability, field-building, risk profile).
      *   Does the market's quantification of uncertainty change our risk assessment?
      *   Are there value-based reasons to potentially *override* the market's top pick?
  5.  **Board Votes:** After robust discussion *informed* by the market data, expert presentations, and our own values, the Board votes as usual to make the final funding decision(s), taking full responsibility for that choice.

  ### Conclusion
  The Director's proposal is a bold and thoughtful challenge to our status quo. It correctly identifies weaknesses in relying solely on deliberation and highlights the power of aggregating predictions. However, replacing our judgment with a market focused on a single, narrow metric risks neglecting the core values and broader responsibilities of our Foundation.

  By running the market as a rigorous input mechanism, we gain valuable predictive insights and force quantification of uncertainty – addressing the Director's key aims. Crucially, we retain the Board's essential role in weighing all factors, making value judgments aligned with our mission, and maintaining accountability. This hybrid approach leverages innovation while preserving our core governance responsibility. I urge the Board to adopt this modified proposal.

  **Recommendation:** Adopt the use of a conflict-mitigated prediction market as a structured input to Board deliberation and decision-making for the FY25 grant cycle, retaining final funding authority with the Board.
