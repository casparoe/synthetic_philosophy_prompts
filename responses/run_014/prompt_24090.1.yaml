prompt: |-
  i just spent an hour with my friend arguing about low impact AI and he kept saying just avoid side effects like that is a well defined objective, but i think you cant even state it without either a full value function or a baseline that quietly encodes one. can you write the desiderata for an account of impact or side effects that would be good enough to use as a safety constraint before we have full value alignment? the point is to separate the descriptive impact measure from the evaluation, because the moment you say bad side effect you have already smuggled in value. i want the requirements, with the case or consideration behind each: what counts as an impact, relative to what baseline or counterfactual world, over what timescale, which causal or statistical notion, how it handles value uncertainty, how it treats intended effects, reversibility, agency, and self modification. include the cases it has to get right (trivial actions, beneficial interventions, irreversible changes, alignment faking, etc.) and the distinctions it cannot collapse (side effect versus intended effect, local versus global, short term versus long term, physical versus informational, etc.). mark which requirements are non negotiable and which are just preferences of particular camps, and say if some subset is jointly unsatisfiable -- i think the baseline problem and the no value specification requirement might be -- and which single requirement kills the most popular just measure negative side effects approaches. then briefly score the usual state of world, expected utility delta, and negative side effect style proposals against the list. no citations, just the spec.
reasoning: |-
  We are to design a set of desiderata for an "impact" or "side effect" measure that can be used as a safety constraint without requiring a full value function. The goal is to separate the descriptive measure from the evaluation (so we don't want to say "bad" side effect). The measure should be able to be used to constrain an AI system to avoid negative impacts while we don't have full value alignment.

  Key elements to cover:

  1. **What counts as an impact?** We need a definition of what constitutes a change that we care about. This might be any deviation from some baseline, but we must define the baseline.

  2. **Baseline or counterfactual world:** What is the world compared to? This is critical because without a baseline, we cannot measure change.

  3. **Timescale:** Over what time horizon do we measure impact? Short-term vs long-term effects might be very different.

  4. **Causal or statistical notion:** How do we attribute changes to the AI's actions? This relates to causality and counterfactuals.

  5. **Value uncertainty:** How do we handle the fact that we don't know the true human values? We don't want to assume we know what is good or bad.

  6. **Intended effects:** How do we separate intended effects (which are allowed) from side effects (which we want to constrain)? This is crucial because we don't want to penalize the AI for doing what we asked.

  7. **Reversibility:** Should we treat reversible and irreversible changes differently?

  8. **Agency and self-modification:** How does the measure account for the AI's own future actions, especially if it can modify itself?

  Additionally, we must consider:

  - Cases it has to get right:
    - Trivial actions (e.g., moving a cup slightly) should have low impact.
    - Beneficial interventions (e.g., curing a disease) might have high impact but are intended and good, so we must not penalize them as side effects.
    - Irreversible changes (e.g., causing extinction) should be high impact and constrained.
    - Alignment faking: An AI that pretends to be aligned but then causes harm should be constrained by the impact measure.

  - Distinctions it must not collapse:
    - Side effect vs intended effect.
    - Local vs global (both in space and in state space).
    - Short term vs long term.
    - Physical vs informational (e.g., deleting data might be informational but have physical consequences).

  We will mark which requirements are non-negotiable and which are preferences of particular camps. We will also note if some requirements are jointly unsatisfiable and which single requirement kills the most popular approaches.

  Finally, we will briefly score existing proposals:

  1. **State of the world (SoW) measures:** E.g., measure the change in some state variable (like energy usage, or diversity of states).
  2. **Expected utility delta (EUD):** The difference in expected utility between the baseline and the new state (but note: we don't have a utility function!).
  3. **Negative side effect (NSE) style:** Approaches that try to measure only negative side effects (e.g., relative to a baseline, but without specifying what is negative).

  ---

  **Desiderata for an Impact Measure (without Value Specification):**

  **Non-negotiable Requirements:**

  1. **Non-value-laden descriptiveness (NVD):** The measure must be descriptive and not require specifying what is good or bad. It must not build in value judgments (e.g., "negative" side effect) because we don't have the value function. *Reason: The whole point is to avoid smuggling in value. Without this, we are back to needing a value function.*

  2. **Baseline necessity (BN):** There must be a well-defined baseline (or counterfactual) against which to measure change. Without a baseline, change is undefined. *Reason: Change is relative. This is fundamental to the concept of impact.*

  3. **Intended effect exclusion (IEE):** The measure must be able to exclude the intended effects of the AI's actions. *Reason: We want the AI to do what we ask without being penalized for it. If we constrain the entire impact, we prevent the AI from acting at all. This is critical for usefulness.*

  4. **Causal attribution (CA):** The measure must attribute changes to the AI's actions in a causal manner, not merely statistical. *Reason: We care about what the AI causes, not coincidental changes. Without causality, the AI might be blamed for changes it didn't cause.*

  5. **Temporal scope (TS):** The measure must specify a time horizon for which the impact is computed. *Reason: Without a time horizon, the measure could be overwhelmed by long-term effects or ignore them entirely. This is necessary for practicality and to avoid infinite regress.*

  6. **Value uncertainty handling (VUH):** The measure must not assume knowledge of human values. It must work under value uncertainty. *Reason: We don't have full value alignment, so we cannot use a value function.*

  **Preference Requirements (may vary by camp):**

  7. **Reversibility consideration (RC):** It may be desirable to weight irreversible changes more heavily than reversible ones. *Reason: Irreversible changes are more concerning for safety. However, without a value function, we cannot say if the irreversible change is good or bad, so this might be tricky.*

  8. **Agency and self-modification (ASM):** The measure should account for the AI's future actions, especially in the context of self-modification. *Reason: An AI that self-modifies might become more capable and have greater impact. However, predicting future actions is difficult.*

  9. **Localization (LOC):** It may be preferred to focus on local changes (in state space or physically local) to avoid having to model the entire world. *Reason: Computational tractability and avoiding the need for a full world model.*

  **Cases to Handle:**

  - **Trivial actions (TA):** Moving a cup slightly should have low impact.
  - **Beneficial interventions (BI):** Curing a disease should be allowed (and not constrained as a side effect) even though it has high impact because it is intended.
  - **Irreversible changes (IRR):** Causing extinction should be recognized as high impact and constrained.
  - **Alignment faking (AF):** An AI that pretends to be aligned but then causes harm should be constrained by the impact measure during the time it is faking.

  **Distinctions to Maintain:**

  - **Side effect vs intended effect (D1)**
  - **Local vs global (D2)**
  - **Short term vs long term (D3)**
  - **Physical vs informational (D4)**

  **Challenges and Conflicts:**

  - **The Baseline Problem:** The choice of baseline (BN) is critical and non-negotiable, but it is also value-laden. For example, if the baseline is the state of the world before the AI acts, then the AI cannot even maintain the status quo (because the world changes naturally). If the baseline is the state the world would have been in without the AI, then we need a counterfactual which is hard to compute and also might encode values (e.g., what if the counterfactual includes natural disasters?).

  - **Conflict between IEE and NVD:** Intended effect exclusion (IEE) requires knowing what is intended, which might be provided by the user. But then the measure becomes relative to the user's goal, which is a form of value. However, we can argue that the goal is given and we are not evaluating it. Still, without a value function, we are using the goal as a proxy. This is a tension.

  - **Joint unsatisfiability?** The requirement for a baseline (BN) and the requirement to avoid value specification (NVD) might be jointly unsatisfiable because the baseline inherently involves a choice that reflects values (e.g., the baseline could be the expected natural evolution, which requires a model of the world and what we care about). Also, without a value function, we cannot define what is a side effect versus an intended effect (IEE) without reference to the goal, which is a partial value specification.

  - **The killer requirement:** The **Non-value-laden descriptiveness (NVD)** requirement kills most popular "just measure negative side effects" approaches because they typically define "negative" in terms of a value function or a proxy (like deviation from a baseline that is assumed to be good). Without a value function, we cannot say what is negative.

  **Scoring Existing Proposals:**

  1. **State of the World (SoW) measures:** 
     - E.g., measure the L2 norm of the state change, or the change in some summary statistic (like entropy or energy).
     - **BN:** Usually uses the current state as baseline? Or a fixed state? 
     - **IEE:** Fails because intended changes are included in the state change.
     - **NVD:** Passes if the measure is descriptive (e.g., energy change is just a number). 
     - **CA:** Fails because it's not causal (it measures total change, not caused by the AI).
     - **TS:** Usually doesn't specify a time horizon, so fails.
     - **VUH:** Passes because it doesn't use values.
     - **Cases:** Fails BI (curing a disease would be high impact) and TA might pass if the change is small. Fails IRR because it doesn't distinguish reversible from irreversible. Fails AF because it doesn't account for future harm.

     *Verdict: Fails IEE, CA, TS, and most cases.*

  2. **Expected Utility Delta (EUD):**
     - Measures the difference in expected utility between the baseline and the new state.
     - **BN:** Requires a baseline and a utility function.
     - **IEE:** Could be set up to exclude intended effects by having the utility function only account for side effects? But then we need a utility function for side effects.
     - **NVD:** Fails because it requires a utility function (which is a value function).
     - **CA:** Might be done with causal models, but the utility function is the main issue.
     - **TS:** Can be defined over a time horizon, but the utility function must be defined accordingly.
     - **VUH:** Fails because it requires a utility function.

     *Verdict: Fails NVD and VUH. Without a utility function, it's not applicable.*

  3. **Negative Side Effect (NSE) style:**
     - E.g., measure the negative side effects relative to a baseline, using some predefined notion of what is negative (like harm to humans, or destruction of property).
     - **BN:** Requires a baseline.
     - **IEE:** Typically tries to exclude intended effects by focusing on "side" effects, but how to define what is intended? It might rely on the goal specification.
     - **NVD:** Fails because it uses a predefined notion of "negative", which is value-laden (e.g., harm to humans is bad, but without a value function, how do we know?).
     - **CA:** Sometimes causal, sometimes not.
     - **TS:** Might be defined over a time horizon, but the negativity is the issue.
     - **VUH:** Fails because it requires knowing what is negative (which is value-laden).

     *Verdict: Fails NVD and VUH. The requirement NVD kills this approach.*

  **Conclusion:**

  The most fundamental challenge is defining a baseline without smuggling in values and excluding intended effects without a value function. The non-negotiable requirements (especially NVD and BN) are in tension because the baseline choice is inherently value-laden. Moreover, IEE is critical for the measure to be useful but requires knowing what is intended (which is a form of goal specification) and what is a side effect (which without a value function we can only define descriptively as "change not intended", but then we must have a clear notion of intention).

  Given these challenges, it seems difficult to have a purely descriptive impact measure that satisfies all non-negotiable requirements and handles the cases. The most promising direction might be to define the baseline as the counterfactual world without the AI's intervention (but this is hard to compute) and to have the intended effects defined by the user's goal (so that the measure of impact excludes changes that are part of the goal). However, without a value function, we cannot evaluate whether the goal itself is good or bad, and we cannot evaluate the side effects as "bad" — we can only measure their magnitude. Therefore, we might need to settle for a magnitude of change (descriptive) relative to the counterfactual, excluding the intended changes, and then set a constraint on that magnitude. But even then, the magnitude measure (like energy change) might not capture what we care about.

  This suggests that the quest for a value-free impact measure might be fundamentally limited, and we might need to rely on imperfect proxies until we have better value alignment.
answer: |-
  ### Desiderata for a Value-Free Impact Measure (Safety Constraint Spec)
  A descriptive impact measure must avoid presupposing value judgments (e.g., "bad" side effects) while enabling constraints against harmful outcomes. Below are requirements, cases, distinctions, and conflicts. Requirements marked **★** are non-negotiable; others are camp-specific preferences.

  ---

  #### **Core Requirements**  
  1. **Baseline Necessity (BN) ★**  
     - **Definition**: Impact must be quantified relative to a counterfactual baseline.  
     - **Why**: Without a baseline, "change" is undefined.  
     - **Conflict**: Baselines implicitly encode values (e.g., "no AI intervention" vs. "expected natural evolution").  

  2. **Value Agnosticism (VA) ★**  
     - **Definition**: The measure must not require a value function (e.g., utility, ethics).  
     - **Why**: Premature value specification risks misalignment. Evaluation (e.g., "is this impact bad?") is separate.  
     - **Killer for Popular Approaches**: Invalidates "negative side effect" measures (e.g., "avoid harm to humans") as they smuggle in values.  

  3. **Intent-Aware Exclusion (IAE) ★**  
     - **Definition**: Exclude changes directly caused by the AI’s *intended actions* (per user goal).  
     - **Why**: Otherwise, trivial/beneficial actions (e.g., curing a disease) are penalized.  
     - **Challenge**: Requires goal specification but no value judgment (e.g., "intended" ≠ "good").  

  4. **Causal Attribution (CA) ★**  
     - **Definition**: Impact must use causal (not correlational) models (e.g., structural counterfactuals).  
     - **Why**: Prevents penalizing coincidental changes (e.g., rain after the AI moves a cup).  

  5. **Temporal Bounding (TB) ★**  
     - **Definition**: Fixed timescale (e.g., 1 year) or discounting (e.g., exponential decay).  
     - **Why**: Unbounded horizons make measurement intractable (e.g., butterfly effects).  

  6. **Uncertainty Propagation (UP)**  
     - **Definition**: Explicitly model uncertainty in states, dynamics, and values.  
     - **Why**: Avoids overconfidence; impacts are distributions, not point estimates.  
     - **Preference**: Favored by Bayesian safety camps.  

  7. **Reversibility Discounting (RD)**  
     - **Definition**: Weight impacts by reversibility (e.g., deleting data vs. erasing a backup).  
     - **Why**: Irreversible changes (e.g., extinction) are higher-risk.  
     - **Preference**: Prioritized in conservationist frameworks.  

  8. **Agency & Self-Modification (ASM)**  
     - **Definition**: Account for the AI’s future actions, including self-modification.  
     - **Why**: Self-improving AI could amplify impacts; ignoring this invites loopholes.  

  ---

  #### **Cases to Handle**  
  - **Trivial Action (TA)**: Moving a cup slightly → low impact.  
  - **Beneficial Intervention (BI)**: Curing a disease → intended effect excluded, not penalized.  
  - **Irreversible Change (IRR)**: Destroying Earth → high impact even if "instantaneous."  
  - **Alignment Faking (AF)**: AI pretends alignment but plans harm → impact measure must catch delayed effects (via TB/ASM).  

  #### **Distinctions to Preserve**  
  - **Side Effect vs. Intended Effect**: IAE enforces this; collapse risks penalizing goals.  
  - **Local vs. Global**: Local (e.g., room) vs. global (e.g., planet) impacts must be separable (e.g., via state aggregation).  
  - **Short vs. Long Term**: TB enforces this; collapse risks myopia or paralysis.  
  - **Physical vs. Informational**: Physical (e.g., energy) and informational (e.g., entropy) changes need distinct handling (RD/UP).  

  ---

  #### **Conflicts and Unsatisfiability**  
  - **BN + VA Joint Unsatisfiability**: Baselines inherently encode values (e.g., "do no harm" assumes the status quo is desirable). VA forbids this, but BN requires a baseline → no value-free baseline exists.  
  - **IAE + VA Tension**: "Intended effect" relies on a goal, which is a partial value specification. Strict VA rejects this, but IAE is essential for usability.  
  - **Killer Requirement**: **VA (Value Agnosticism)** invalidates all "negative side effect" approaches (e.g., "minimize harm") since "negative" implies values.  

  ---

  #### **Proposal Scoring**  
  *(Against ★ requirements; 0 = fail, 1 = partial, 2 = pass)*  

  | **Proposal**               | BN | VA | IAE | CA | TB | **Total** | Verdict |  
  |----------------------------|----|----|-----|----|----|-----------|---------|  
  | **State of World (SoW)**   | 1  | 2  | 0   | 0  | 0  | **3/10**  | Fails: No causal attribution, ignores intent, unbounded time. Measures all change (e.g., energy use) → penalizes BI. |  
  | **Expected Utility Delta (EUD)** | 2  | 0  | 1   | 2  | 1  | **6/10**  | Fails VA (requires utility function); IAE possible but values creep in. |  
  | **Negative Side Effects (NSE)** | 2  | 0  | 1   | 1  | 1  | **5/10**  | Fails VA (assumes "negative" is defined); CA/TB often underspecified. |  

  **Summary**: No proposal satisfies all ★ requirements. EUD best handles CA/TB but fails VA. SoW and NSE fail fundamentally on VA/IAE. **BN + VA conflict is unresolved**—baselines require implicit values. A viable measure must relax VA (allow goal-relative baselines) or accept heuristic compromises.
