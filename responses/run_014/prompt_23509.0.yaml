prompt: |-
  I'm giving a three-minute toast at my best friend's wedding this weekend, and I've been struggling with how to say something true about what a marriage vow actually commits you to. I'm taking a course on decision theory, and the thing that's been stuck in my head all semester is Kavka's toxin puzzle — the case where you're offered a million dollars on the condition that you inject a toxin at midnight, the toxin causes you a day of agony but no lasting harm, and the problem is that at midnight you'll have no reason to inject it, so it seems you can't rationally commit to doing it in advance. I keep coming back to the thought that a marriage vow looks exactly like the toxin: you're committing to a future action that, at the moment of performance, your future self may have no reason to perform, and if Kavka is right that you can't rationally commit to something your future self won't want to do, then a wedding vow is either a rational mistake or a lie.

  I want the toast to address this directly but gently. The room is mostly family who won't know the puzzle, but there are a couple of philosophy friends in the room — one of them is a decision theorist and will absolutely catch the reference — who will be waiting to see whether I've thought it through. The toast should land as affection rather than as a lecture, and should actually give a reason why the vow is not like the toxin. I think the key move is that the toxin case assumes your future self's reasons are fixed and independent of what you commit to now, but a promise to another person doesn't work that way; the commitment is what makes the future self the kind of person who has a reason to keep it. I'm not sure if that's the right move or if I'm just rationalizing, but I'd like the toast to make the case for it, and to do so in a way that the family can follow without needing to know the puzzle.
reasoning: |-
  Okay, the user is preparing a wedding toast for their best friend and wants to address the philosophical dilemma of marriage vows using Kavka's toxin puzzle. They're concerned that a vow might be irrational or dishonest because future selves might lack motivation to uphold it. Their main goal is to resolve this paradox gently while making it accessible to both family and philosopher friends.

  First, I need to unpack the toxin puzzle analogy. Kavka's puzzle shows that rational agents can't commit to future actions without ongoing incentives. But marriage vows are different—they're interpersonal commitments, not solitary promises. The user's insight about identity creation through commitment seems key here. When you make a vow to another person, you're fundamentally changing the relationship framework, which alters future motivations. That's the core argument to emphasize.

  The user's hidden concern might be about defending the sincerity of vows against philosophical skepticism. Their decision theorist friend will be listening critically, so the toast needs airtight logic while remaining emotionally resonant. The family attendees need to understand it without jargon, so metaphors like "rewriting your own code" or "promise as identity-creation" could bridge that gap.

  For structure, the toast should open with warmth to establish affection, then introduce the paradox as a personal reflection ("I've been thinking..."), resolve it by contrasting toxin isolation vs marital interconnectedness, and conclude with practical wisdom ("how you show up each day"). The million-dollar reference can stay as an accessible hook—everyone understands money motivations, which makes the counterpoint about love more striking.

  I should avoid academic terms like "causal decision theory" but keep the million-dollar example since it's intuitive. The resolution must show that marriage transforms identity: the act of vowing creates new reasons for future selves. This isn't rationalization—it's well-established in philosophy (think Schelling or Bratman on shared agency). The "we" language in vows literally constructs collective intention.

  Finally, the toast should land on daily choice. The beauty isn't that vows eliminate future temptation, but that each day's choice is made within a scaffold built by commitment. That satisfies both the decision theorist (repeated games > one-off toxin) and the grandparents (romantic constancy).
answer: |-
  Here’s a toast that tackles the paradox with warmth, clarity, and a touch of philosophy—designed for both family and your decision-theorist friend. It centers on your insight about identity and reasons, framing the vow as transformative rather than irrational:

  ---

  **(Clink glass gently, warm smile)**  
  "Hi everyone. For those who don’t know me, I’m [Your Name], and I’ve had the honor of being [Groom/Bride]’s best friend for [X] years. Now, anyone who knows [Groom/Bride] knows they’re brilliant, kind, and… *thoughtful*. Sometimes *too* thoughtful. **(Light chuckle from crowd)**  

  See, I’ve been taking a class on decision-making lately, and I’ve had this philosophical question stuck in my head all week: **How can you *truly* promise to do something tomorrow if, when tomorrow comes, you might not feel like doing it?**  

  *(Pause, slightly playful tone)*  
  Imagine someone offered you a million dollars *today* if you’d agree to do something mildly unpleasant *tomorrow*—say, drink a weird-but-harmless tonic. Easy choice, right? But here’s the catch: when tomorrow comes, the money’s already yours. Why drink the tonic? There’s no reason left. So... can you *really* commit today to doing it tomorrow?  

  *(Shift tone to sincere, looking at the couple)*  
  When I first thought about this, it made wedding vows seem almost… impossible. Like promising to drink that tonic every day for 50 years. Because let’s be honest—some days, marriage asks you to drink metaphorical tonics. Days when you’re tired, stressed, or just don’t *feel* like putting in the work. If a vow is just about forcing yourself to do something painful for no reason later… well, that doesn’t sound like love. It sounds like a trap.  

  *(Lean in, earnest)*  
  But here’s what I realized: **A marriage vow isn’t a contract with your future self. It’s a promise that *creates* your future self.**  

  That moment today—standing here, looking into each other’s eyes, saying ‘I choose you, always’—*changes* you. It rewrites your code. It transforms ‘I’ into ‘we.’ And *that’s* what gives your future self a reason to keep choosing this, even on tonic-drinking days.  

  Because tomorrow, when things get hard, you won’t just be asking, *‘What do I want right now?’* You’ll be asking, *‘Who did I promise to become?’* **The vow isn’t shackles—it’s the blueprint for who you’re building together.** The ‘you’ that exists after this promise is someone who *finds reasons* in the commitment itself: loyalty, integrity, shared history, love that deepens because you nurtured it.  

  *(Raise glass to the couple)*  
  So [Groom] and [Bride], that’s the magic of what you did today. You didn’t just make a deal. You planted a seed in each other’s hearts that will keep growing reasons to choose ‘us’—every single day. Your vow isn’t a toxin. It’s an antidote to the chaos of life. It’s the quiet voice that says, *‘We promised. We belong. So we’ll figure this out.’*  

  May your lives together be filled with a million reasons to choose each other… and may you never need a single one. Cheers!"  

  ---

  ### Why this works:
  1. **Gently introduces the paradox**: Uses the "million dollars/tonic" analogy (accessible) instead of "toxin" (alarming).  
  2. **Resolves it clearly for all audiences**: Explains *how* vows work ("rewrites your code," "blueprint") without jargon.  
  3. **Validates your insight**: Focuses on identity-transformation ("creates your future self")—your key move.  
  4. **Emotionally resonant**: Frames commitment as love, loyalty, and growth, not rationalization.  
  5. **Nods to philosophers**: "Rewrites your code" and "creates reasons" will satisfy your decision-theorist friend.  
  6. **Keeps it warm**: Starts/finishes with affection; humor softens the philosophy.  

  Your instinct was spot-on. Kavka’s puzzle assumes static preferences, but vows *dynamically shape* preferences. By making the promise *public* and *relational*, you embed the commitment into your identity—giving your future self internal reasons (loyalty, integrity) that didn’t exist before. That’s not rationalizing; it’s the phenomenology of love. Bravo!
