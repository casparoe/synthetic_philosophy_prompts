  First, I need to list out the conditions based on what the user mentioned and add others that are essential. They provided several examples: obligation runs to a determinate person, only that person can release it, binding even without intention to perform, binding even if breaking benefits the promisee, promising what one is already obliged to do, difference in weight between casual assurance and sworn oath, performance vs. compensation, and automated undertakings.

  I should categorize each as non-negotiable or from a specific camp. Non-negotiable means any theory must satisfy it to be adequate. Others might be specific to certain philosophical views. Also, flag any conflicts between conditions and identify which condition excludes the most candidate theories.

  Let me start listing conditions:

  1. **Directedness (Specific Obligee)**: Obligation is owed to a specific person (promisee). This is non-negotiable and must generalize to consent, offers, etc. Motivation: Promisees can release or hold accountable, unlike general duties.

  2. **Release Authority**: Only the promisee can waive the obligation. Non-negotiable. Generalizes to consent (only the consenting party can withdraw). Case: Promisee forgiveness vs. third-party interference.

  3. **Intention-Independence**: Binding even if promisor never intended to perform. Non-negotiable. Promissory-specific? Maybe, but consider other commitments. Motivation: Insincere promises still create expectations and obligations; e.g., lying promise still wrongs the promisee.

  4. **Benefit Irrelevance**: Binding even if breaking benefits the promisee. Non-negotiable. Generalizable? Consent can't be overridden for benefit. Case: Promisee in coma, breaking promise might benefit them, but still wrong without their release.

  5. **Pre-existing Duty**: Explaining promises to do what one is already obliged to do. Regress issue here. Non-negotiable? Maybe, but some theories handle it differently. Motivation: Promising to tell truth (already obliged) adds an extra layer; regress might be a distraction if the promise adds a new relational duty.

  6. **Gradient of Weight**: Difference between casual assurance and sworn oath. Must be accommodated. Non-negotiable? Possibly, as it's intuitive. Promissory-specific, but vows/contracts have varying weights too. Motivation: Formalities intensify obligation.

  7. **Performance Primacy**: Morality demands performance, not just compensation. Contract law differs. Non-negotiable? This might be contentious. Promissory-specific? But consent also requires actual permission, not compensation. Motivation: Promisee’s right is to the act itself, not substitutes.

  8. **Automated Undertakings**: Obligations from AI systems without human intent. Non-negotiable? Modern issue. Must generalize to organizational contexts. Motivation: Reliance on automated promises, e.g., booking confirmations.

  Now, are there other important conditions? The user mentioned "determinate person" and "release authority" as separate, but maybe combine? Better to keep distinct. Also, consider **Reliance Not Necessary**: Obligation exists even if promisee didn't rely. Important against reliance theories. Case: Unheard promise still binds? Or promise made but not acted upon. Motivation: Promisor's commitment alone might create duty.

  Labeling:

  - **Non-negotiable**: Directedness, Release Authority, Intention-Independence, Benefit Irrelevance, Pre-existing Duty (as needing explanation), Gradient of Weight, Performance Primacy? Maybe not, as some theories might disagree. Automated Undertakings could be emerging necessity.

  Conflicts: 
  - **Intention-Independence vs. Will-Based Theories**: If obligation comes from will, no intention might mean no obligation. But condition says it still binds, so conflicts with pure will theories.
  - **Performance Primacy vs. Compensation**: Contract law focuses on damages, morality on performance. This might conflict with economic theories of promises.

  Which condition excludes the most candidates? Probably **Intention-Independence**, as will-based and some practice theories might struggle, while reliance could handle it if reliance occurred, but if not, they fail. So it excludes theories that require intent or reliance.

  Finally, evaluate will-based, reliance-based, and practice-based accounts:

  - **Will-Based (e.g., Scanlon)**: Grounds obligation in promisor's will. Handles Directedness and Release well. Struggles with Intention-Independence (if no intent, how binding?) and Automated Undertakings (no human will). May handle Gradient via expression strength.

  - **Reliance-Based (e.g., MacCormick)**: Obligation from promisee's reliance. Good for Benefit Irrelevance (if relied, breaking harms). Fails Intention-Independence without reliance, and Directedness might be weaker if obligation is harm-based, not directed. Automated: reliance possible, so might work.

  - **Practice-Based (e.g., Rawls)**: Obligation from social practice. Handles Gradient (formalities matter) and Intention-Independence (practice rules apply regardless). May struggle with Benefit Irrelevance (practice might allow breaking if beneficial) and Release Authority (practice might not grant sole release). Automated: if practice includes organizational systems, could work.

  Need to ensure each condition is clearly labeled as promissory-specific or generalizable. For example, Directedness and Release Authority are generalizable to consent, offers, etc. Intention-Independence might be more promissory-specific but could apply to vows. Benefit Irrelevance applies to consent (can't override without consent). Pre-existing Duty might be specific to promises but relevant in contracts. Gradient applies to vows/oaths. Performance Primacy might be promissory but also for consensual acts. Automated Undertakings are new but generalizable to organizational commitments.

  Structure the response: List each condition with name, description, case/motivation, specificity label (promissory-specific or generalizable), and negotiability (non-negotiable or camp-specific). Then conflicts, excluding condition, and the accounts' evaluation.
answer: |-
  Below is a specification of conditions for an adequate account of promissory obligation, structured to meet your document's needs. The purpose—**grounding not only promissory obligations but also neighboring directed obligations (consent, offers, vows, contracts)**—constrains adequacy. Conditions are derived from core philosophical puzzles, legal contrasts, and modern edge cases. Each is labeled as **promissory-specific** (P-S) if it primarily characterizes promises but must be consistent with analogues in other domains, or **generalizable** (Gen) if it must directly extend to consent, offers, etc. Non-negotiable conditions are those any minimally adequate account must satisfy; others reflect demands of specific theoretical camps. Conflicts and exclusions are flagged.

  ---

  ### **Conditions for an Adequate Account of Promissory Obligation**
  1. **Directedness (Specific Obligee)**  
     - **Description**: The obligation is owed *to* a determinate person or entity (the promisee), not merely a general duty.  
     - **Case/Motivation**: A promise to Alice creates a right *for Alice* to demand performance; a vague "promise to society" lacks this. Generalizes to consent (owed to the consent-recipient) and offers (owed to the offeree).  
     - **Specificity**: Gen (essential for all directed obligations).  
     - **Negotiability**: Non-negotiable.  

  2. **Exclusive Release Authority**  
     - **Description**: Only the promisee (or their valid proxy) can waive or release the obligation; third parties cannot.  
     - **Case/Motivation**: Alice can forgive Bob's broken promise to her, but Charlie (a bystander) cannot. Generalizes to consent (only the consent-giver can withdraw) and vows (to a deity/community, but still holder-specific).  
     - **Specificity**: Gen.  
     - **Negotiability**: Non-negotiable.  

  3. **Intention-Independence**  
     - **Description**: A promise binds even if the promisor never intended to perform (e.g., insincere or deceptive promises).  
     - **Case/Motivation**: Bob jokingly "promises" to pay Alice $100 with no intent to pay; Alice relies or it undermines trust. Shows obligation arises from commitment, not mental state.  
     - **Specificity**: P-S (unique to promise-like acts; consent requires genuine intention, offers may lapse without intent).  
     - **Negotiability**: Non-negotiable (rejects "will-based" views that tether obligation to intent).

  4. **Benefit-Irrelevance**  
     - **Description**: Breaking a promise remains wrongful even if it objectively benefits the promisee (e.g., due to changed circumstances), unless released.  
     - **Case/Motivation**: Bob promises Alice (now in a coma) to donate her savings to Charity X, but Charity Y is more effective. Breaking it may benefit Alice’s estate, but still wrongs *her* autonomy. Generalizes to consent (e.g., overriding patient refusal for "benefit" is wrong).  
     - **Specificity**: Gen.  
     - **Negotiability**: Non-negotiable (rejects consequentialist accounts).

  5. **Pre-Existing Duty Resolution**  
     - **Description**: The account must explain promises to do what one is already morally/legally obliged to do (e.g., "I promise not to steal"). The "regress problem" (why promise if already bound?) should be resolvable without paradox.  
     - **Case/Motivation**: Promising to repay a debt you already owe: the promise adds a directed obligation to the creditor, transforming an impersonal duty into a relational one. Regress (e.g., "why not promise to promise?") is a distraction—focus on how promises reframe duties, not create new ones *ex nihilo*.  
     - **Specificity**: P-S (central to promises; less salient for offers/consent).  
     - **Negotiability**: Non-negotiable (but regress is not fatal; adequate accounts may treat it as a non-issue).

  6. **Gradient of Weight**  
     - **Description**: The account must accommodate varying strengths of obligation (e.g., casual assurance vs. sworn oath), including formality's role.  
     - **Case/Motivation**: A whispered "I’ll help you move" vs. a notarized oath: the latter demands stricter compliance and amplifies blame for breach. Generalizes to vows (sacred vs. secular) and contracts (informal vs. formal).  
     - **Specificity**: Gen.  
     - **Negotiability**: Camp-specific (demanded by non-reductionists; consequentialist/reliance views may reduce weight to outcomes).

  7. **Performance Primacy**  
     - **Description**: Morality requires *performance* (the promised act) as the primary duty, not compensation or substitutes. Contrasts with contract law, which often prioritizes expectation damages.  
     - **Case/Motivation**: Bob promises Alice care in old age; paying her $10k instead fails to satisfy what is *owed to her*. Grounds why "repair" is insufficient for personal commitments. Consent analogues: you cannot "compensate" for non-consensual acts.  
     - **Specificity**: P-S (stronger for promises/vows; weaker for offers/contracts).  
     - **Negotiability**: Camp-specific (demanded by deontologists; economic views reject it).

  8. **Non-Reliance Basality**  
     - **Description**: The obligation arises upon promising, even without the promisee's reliance (e.g., no detriment incurred).  
     - **Case/Motivation**: Bob promises Alice a gift, but Alice forgets and never relies. Bob still seems obligated upon remembering. Generalizes to offers (binding once accepted, pre-reliance) and vows (owed regardless of others' awareness).  
     - **Specificity**: P-S (crucial for promises; consent relies on awareness).  
     - **Negotiability**: Non-negotiable (excludes pure reliance theories).

  9. **Automated Undertaking Accommodation**  
     - **Description**: The account must handle obligations from AI/organizational promises issued without human intent (e.g., automated systems), where recipients reasonably rely.  
     - **Case/Motivation**: A hotel-booking AI "promises" a room; no human monitored it, but the guest relies. Obligations must arise from institutional agency, not individual will. Generalizes to corporate offers/contracts.  
     - **Specificity**: Gen.  
     - **Negotiability**: Non-negotiable (for modern adequacy).

  ---

  ### **Conflicts and Exclusivity**
  - **Key Conflict**: **Intention-Independence** (non-negotiable) and **Performance Primacy** (camp-specific) jointly exclude strong will-based theories (e.g., Kantian), which ground obligation in intent and may allow compensation for "unintended" promises.  
  - **Most Exclusionary Condition**: **Non-Reliance Basality** excludes the widest range of candidates (e.g., Atiyah’s reliance theory, Scanlon’s expectation-based view) by requiring obligation prior to reliance.  

  ---

  ### **Evaluation of Candidate Account Types**
  **Will-Based Accounts (e.g., Kant, Shiffrin)**  
  - Ground obligation in the promisor’s autonomous will.  
  - **Strengths**: Easily satisfies *Directedness*, *Exclusive Release*, and *Gradient of Weight* (intent formality intensifies obligation).  
  - **Weaknesses**: Fails *Intention-Independence* (no intent, no obligation) and *Automated Undertakings* (no human will). *Pre-Existing Duty* regress is unresolved (if the will adds nothing, why promise?).  
  - **Generalizability**: Strong for consent/offers, weak for vows/automation.  

  **Reliance-Based Accounts (e.g., MacCormick, Atiyah)**  
  - Ground obligation in the promisee’s detrimental reliance or normative expectations.  
  - **Strengths**: Handles *Benefit-Irrelevance* (reliance harm independent of outcome) and *Automated Undertakings* (if reliance occurs).  
  - **Weaknesses**: Fails *Non-Reliance Basality* (no reliance, no obligation) and *Intention-Independence* (insincere promises unused by promisee create no duty). *Performance Primacy* is weakened (compensation repairs reliance).  
  - **Generalizability**: Good for contracts/offers, poor for vows (may lack reliance).  

  **Practice-Based Accounts (e.g., Rawls, Hume)**  
  - Ground obligation in social practices/rules sustaining promissory institutions.  
  - **Strengths**: Satisfies *Intention-Independence* (rules bind regardless of intent), *Gradient of Weight* (formalities define practice tiers), and *Automated Undertakings* (organizational rules extend practices).  
  - **Weaknesses**: Struggles with *Benefit-Irrelevance* (practices may allow beneficial breaches) and *Exclusive Release* (third parties might "enforce" practices). *Pre-Existing Duty* is a distraction (practices add social force).  
  - **Generalizability**: Robust for vows/contracts, weaker for consent (over-personalized).  

  ---

  This specification isolates the fixed demands for your document, with conditions motivated by paradigmatic cases and constraints from neighboring obligations. Non-negotiable conditions ensure the account can handle core intuitions, while flagged conflicts highlight theoretical trade-offs.
