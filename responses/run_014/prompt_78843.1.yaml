answer: |-
  ## Philosophy Lab: Unpacking the Evo Psych Fight  
  *(Two grad students, ALIX (critic) and KAI (defender), grabbing coffee after class)*  

  **ALIX:** Okay, Kai, that seminar was… something. Felt like "converging evidence!" and "adaptationism!" were just ricocheting off each other. What *is* the actual disagreement?  

  **KAI:** Right? Frustrating. Look, my strongest version is straightforward: Natural selection is *the* major sculptor of complex organic traits. The mind *is* an organ. So, we reverse-engineer modern human psychology – universal patterns in behavior, cognition, emotion – using functional logic. We ask "what problem in the *ancestral* environment would this solve?" Then we test: Does it develop reliably? Is it cross-cultural? Are there analogous traits in related species? *Convergence* across these lines is our evidence, like footprints in different sediments for a paleontologist.  

  **ALIX:** That’s the rub, Kai. Paleontology’s my jam. Those footprints? They’re *independent*. We find the fossil *first*, *then* infer the dinosaur. Your "universal pattern" – say, "men prefer younger partners" – isn’t independent data. It’s the *starting point* you built the hypothesis *to explain*. You see the behavior *now* and spin an adaptive story *then*. Where’s the independent trace of the past? Cross-cultural surveys? You’re just checking if the *modern* behavior is widespread. That’s not analogous to sediment layers.  

  **KAI:** Hold up. We *do* look for independent traces. Developmental timing – does the trait emerge when the adaptive problem would have hit? Comparative work – do chimps show precursors? Fossils *aren't* independent in the way you think either! You interpret a femur based on *existing* biomechanics knowledge. Our "existing knowledge" is evolutionary theory applied to behavior. And small-scale societies *are* our sediment layers! If foragers show the same mate preferences as urbanites, despite massive cultural differences, that *points* to something deeper, shaped *before* agriculture.  

  **ALIX:** Maybe. But your whole "ancestral environment" thing feels like a get-out-of-jail-free card. "Oh, that trait seems maladaptive *now*? Must be a mismatch! We're stone-agers in sneakers!" And when critics point out cultural variation, you say "Ah, but that culture itself is generated by evolved mechanisms!" How is this falsifiable? It just swallows everything. Show me what would *disprove* an adaptationist hypothesis for, say, jealousy.  

  **KAI:** Fair challenge. Okay, refutation: 1) Find the proposed trait is *not* universal in developmentally normal humans across cultures – strong counter-evidence. 2) Show it imposes *huge* fitness costs in plausible ancestral environments – makes no functional sense. 3) Find a *non-adaptive* explanation that better predicts the data – like a simple developmental constraint or byproduct explains it more parsimoniously. For jealousy? If we found a culture where partner infidelity caused *zero* distress, no mate-guarding, and it wasn't explained by coercion or extreme circumstance? That would shake me. Or if jealousy reliably kicked in only *after* reproductive age – makes no adaptive sense.  

  **ALIX:** Okay, conceding that you *can* imagine refutation scenarios is progress. But your "non-adaptive" alternatives *are* the positive program I think is stronger! Niche construction: We build environments that *select back* on us, fast. Massive developmental plasticity: Brains wire themselves to local social ecologies, often *without* specific genetic modules. Cultural evolution: Ideas spread and change faster than genes, creating "design" without biological adaptation. Why assume a dedicated jealousy *module* when social learning norms ("infidelity is wrong") + general emotional systems explain the data, *and* account for massive cultural variation in expression?  

  **KAI:** I don't deny plasticity or culture! But they operate *on top* of evolved foundations. Why does infidelity trigger *distress* universally, not just intellectual disapproval? Why the sex differences in triggers? Plasticity needs something to *be* plastic. Culture needs psychological mechanisms to transmit through. Reverse-engineering identifies those foundational biases.  

  **ALIX:** But is your reverse-engineering strong enough? Let’s negotiate a standard. For *me* to take an evo psych hypothesis seriously, it needs:  
  1.  **Predict novelty:** Not just fit existing data. Predict a *new*, non-obvious psychological phenomenon *before* we observe it – based *only* on the adaptive logic and ancestral model.  
  2.  **Specify the mechanism (loosely):** Not necessarily a "module," but identify *what* cognitive/neural system is plausibly involved and show it's *not* just a general learning mechanism operating on cultural input.  
  *I'll concede:* If you hit #1 consistently, that’s powerful. And I agree *some* universal biases exist.  

  **KAI:** Okay. I accept #1 – strong novel prediction is gold standard. #2 is trickier early on, but we should aim for it. *I'll concede:* Some early evo psych got over-excited, proposing modules for everything without enough constraint. We need tighter ancestral environment models.  
  **My standard:** Convergence across *truly independent* lines: Adaptive logic + universality + developmental trajectory + comparative evidence + neuro-cognitive specificity. If a trait passes that gauntlet, adaptation is the best explanation.  
  **What would make me drop it?** If we found complex, universal, functional human psychological traits that *couldn't* have enhanced fitness in *any* plausible ancestral environment, *and* showed no homology in primates.  

  **ALIX:** What would make *me* back off? If adaptationist hypotheses started reliably making novel predictions about neural development or cross-species cognition that niche/cultural models *couldn't* accommodate – and did it consistently.  

  **KAI:** Deal. More coffee? I think we just out-argued the whole seminar section.  

  **ALIX:** *(Laughing)* Don't tell the prof. But yeah, hit me. This actually feels like progress.  

  **(Word Count: 798)**  

  ---  
  **Key Clarifications Embedded:**  
  1.  **Analogy Holds?:** Alix presses the independence of evidence (fossil found first vs. behavior explained first). Kai counters with development/comparative as independent lines, but Alix remains skeptical about true independence from the modern target behavior.  
  2.  **Mismatch/Falsifiability:** Alix directly challenges unfalsifiability. Kai offers concrete (if perhaps high-bar) refutation criteria. Alix emphasizes alternative explanations (plasticity, culture) as positive programs.  
  3.  **Negotiated Standards:** Both concede ground (Alix: accepts novel prediction power & universals; Kai: accepts early overreach & need for specificity). Each offers a clear standard (Alix: novel predictions + mechanism specification; Kai: multi-line convergence). Each names a potential falsifier for their core skepticism/support.  
  4.  **Critic's Coherence:** Alix represents a coherent alternative: evolution matters, but reverse-engineering complex behavior from a vague past is underconstrained; positive alternatives focus on real-time processes (plasticity, niche construction, cultural evolution) that generate design without needing specific past adaptations for every trait.  
  5.  **Empirical Disagreement:** They *would* disagree empirically on e.g., the *primary* explanation for a specific universal trait – is it a forged adaptation (Kai) or the reliable output of plastic systems in a shared developmental niche (Alix)? The dialogue shows this tension.
