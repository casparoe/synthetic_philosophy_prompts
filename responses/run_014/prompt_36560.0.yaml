  Question 3's "Zeno for predicates" analogy needs careful handling. The user's gut is right - it's superficially appealing but misleading. Zeno's about physical continuity while Sorites is about semantic underdetermination. The "dissolution" claim is wrong; Sorites reveals something real about language that requires semantic solutions, not just waving away the series.

  My verdicts: 
  - Giant list formulation is most revealing (against user's friend)
