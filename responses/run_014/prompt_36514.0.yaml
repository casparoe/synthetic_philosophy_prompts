  First, I recall the different metaphysical positions involved. Eliminativism outright denies chairs exist, while paraphrase theories accept ordinary talk but reduce it to particle arrangements. The user suspects the phrase "arranged chair-wise" might be circular, referencing the very concept it tries to eliminate.

