  For the step-by-step assessment, I should break it down into phases: Quick Check, Core Assessment, Action Decision. Each phase needs specific questions or observations, time estimates, and decision points. The Quick Check can include observing behavior and asking about pain location and intensity. The Core Assessment should distinguish between sensory intensity and affective response, using scales like 0-10 for each. Then, assessing functional impact and goals.

