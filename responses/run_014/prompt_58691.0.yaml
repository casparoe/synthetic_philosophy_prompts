  Limitations include the tool not capturing all nuances like cultural differences in pain expression, inability to assess complex psychosocial factors in 15 minutes, and cases where patients underreport due to stigma or fear. Also, the affective scale might be misinterpreted, and some patients might have conditions affecting their expression, like autism or dementia.

