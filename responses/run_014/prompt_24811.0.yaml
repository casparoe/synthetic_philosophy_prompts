  Hmm, they're clearly sophisticated—they're naming specific illusions (Müller-Lyer) and studies (face-familiarity) they want to avoid or address, and anticipating misconceptions like "perception as just inference." This suggests they've deeply engaged with the literature but need help translating philosophy-of-mind concepts into cognitive science discourse. Their urgency feels high ("next week"), and they're wisely resource-constrained (30 minutes).

  Key unspoken needs: 
  - They likely fear being dismissed by scientists for doing "armchair philosophy." Need to position them as a bridge-builder.
  - They might underestimate how visual-centric this audience is. Must anchor everything in vision science.
  - They haven't mentioned epistemology (e.g., justification) which is core to philosophers' interest in penetration. Should we suppress that? Yes—time constraints.

  *Brainstorming structure:*
  First, why Müller-Lyer won't work: It's the go-to example for top-down processing (knowledge of lines not changing length), but scientists already know it's not penetrative because the illusion persists even with knowledge. Need something where cognition alters the *phenomenology*. 

  Ah! The wine/whale example from Levin & Banaji (2006) is perfect: identical grayscale images labeled "white wine" vs. "red wine" are perceived as lighter/darker. Label changes subjective brightness. Crucially, it's not just memory—it's immediate perceptual bias. 

  *Misconception strategy:*
  1. "Perception = inference" will surface early. Should preempt by distinguishing computational explanations (which scientists accept) from constitutive claims (their target). 
  2. Face-familiarity studies: Scientists might cite Neta et al. (2017) where familiar faces "pop out." Clarify that pop-out ≠ penetration—it could be attention-based. 
  3. Top-down = penetration: Explicitly diagram how "top-down" is an umbrella term including attention, while penetration is a controversial subset.

  *Critical question for the end:* 
  "Does this effect reflect a change in what's perceptually available, or what's judged about the same percept?" Forces them to confront the perception/cognition boundary.

  *What to cut:* No time for attention debates, modularity arguments, or epistemological consequences. Ruthlessly focus on vision science compatibility.

  ...This feels tight but doable. The wine example will hook them early, and sequencing misconceptions alongside the core argument prevents derailment.
answer: |-
  Here’s a battle-tested plan for your talk, optimized for clarity, engagement, and preempting misconceptions in 30 minutes. It assumes your audience knows vision science but may conflate philosophy-of-mind distinctions with cognitive models.

  ---

  ### **1. Groundwork: What Must Be in Place (5 min)**  
  *(Frame the debate’s prerequisites without diving in yet)*  
  - **Perception ≠ Sensation:** Clarify perception as *organized, meaningful experience* (e.g., "seeing a face," not just detecting edges).  
  - **Cognitive States:** Define beliefs/desires as propositional attitudes (e.g., "I believe that object is dangerous").  
  - **The Boundary Problem:** Acknowledge the perception-cognition divide is contested but necessary for the debate:  
    > "We all agree perception involves top-down processing—but does it *literally incorporate* cognitive states like beliefs?"  

  ---

  ### **2. The Core Example: Carry the Entire Argument (10 min)**  
  **Use the *Wine/Whale Illusion* (Levin & Banaji 2006):**  
  - **Stimulus:** Identical grayscale images labeled "White Wine" vs. "Red Wine."  
  - **Effect:** Participants report the "red wine" image as visibly darker.  
  - **Why this example (and not Müller-Lyer)?**  
    - Müller-Lyer is **immune to belief** (knowing the lines are equal doesn’t break the illusion) → demonstrates *encapsulation*.  
    - Wine/Whale shows **belief altering appearance** (labels change perceived brightness) → suggests cognition penetrates phenomenology.  
    - *Crucial:* Emphasize this is a *phenomenal* change (what they "see"), not just judgment.  

  ---

  ### **3. Preempting Misconceptions (Sequence Matters!) (10 min)**  
  Address these *as they naturally arise* in the Wine/Whale discussion:  

  | **Misconception** | **When to Head Off** | **Response** |
  |-------------------|----------------------|--------------|
  | **"Perception = Inference"** | After presenting Wine/Whale | "This isn’t about inference (e.g., Bayesian priors). It’s about whether your *belief that it’s red wine* directly alters your visual experience—not just your interpretation." |
  | **"Face-Familiarity Studies Settle It"** | If citing "pop-out" effects (e.g., Neta et al.) | "Familiar faces may attract attention faster, but does attention *mediate* this? Penetration requires cognition to alter appearance *without* attentional shifts. Wine/Whale controls for this." |
  | **"Penetration = Top-Down Processing"** | When defining cognitive penetration | "All penetration is top-down, but not vice versa! Attention, memory, and expectations are standard top-down processes. Penetration is the *specific claim* that *conceptual* states (beliefs) bleed into perception." |

  ---

  ### **4. The Closing Question to Test Understanding (2 min)**  
  **Ask:**  
  > *"Imagine a study shows that hungry participants perceive food as brighter. Is this cognitive penetration? Why/why not?"*  

  - **Why this works:**  
    - Hunger is a *desire* (cognitive state), but brightness alteration *could* be attentional (e.g., salience). Forces them to distinguish:  
      - **Penetration:** Only if desire *directly* alters appearance.  
      - **Alternative:** Attentional selection ("I notice it more") + unchanged phenomenology.  
    - Reveals if they grasp the *constitutive* vs. *causal* distinction.  

  ---

  ### **5. What to *Openly Refuse* to Cover (3 min)**  
  *(Be upfront—builds credibility and keeps focus)*  
  - **"I won’t debate modularity** (Fodor vs. Churchland)—we’re focused on the *phenomenal* question."  
  - **"I won’t resolve epistemology** (e.g., whether penetration threatens justification). That’s for another talk."  
  - **"I’m bracketing attention debates** (e.g., whether all effects reduce to attention). Assume Wine/Whale controls for it."  

  ---

  ### **Why This Works**  
  - **Cognitive scientists care about mechanisms:** Wine/Whale isolates penetration from attention/memory.  
  - **You’re speaking their language:** Uses vision science examples but insists on philosophical distinctions.  
  - **Efficiency:** Wine/Whale serves as a recurring anchor for definitions, misconceptions, and evidence.  

  **Final Tip:** End with a slide titled "The Real Stakes: Is Perception a Cognitive Agent?"—hinting that penetration challenges vision science’s autonomy. Leaves them hooked without overreaching. Good luck!
