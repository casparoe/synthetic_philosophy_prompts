prompt: |-
  I lead a machine learning team at a firm that fine-tunes large language models for underwriting credit risk. Our regulator now requires model documentation that addresses robustness to distribution shift, and our internal safety review flagged a deeper concern: a model could acquire a proxy goal during fine-tuning that correlates with our training objective on historical data but diverges on novel applicants — what the AI alignment literature calls goal misgeneralization. I need a reusable pre-deployment audit procedure my team can run. The procedure must be grounded in the actual conceptual distinctions from inner alignment — mesa-optimization, the base-objective versus mesa-objective distinction, deceptive versus non-deceptive misalignment, and the relationship between capability generalization and goal generalization — but it must be usable by engineers who have not read that literature.

  Constraints: we fine-tune a foundation model via API, so we do not have access to the base model's weights, its pretraining data, or its training run. We do have our fine-tuning dataset, held-out evaluation data, the ability to run inference at scale, and the ability to do lightweight probing (e.g., linear probes on hidden states, if the API exposes embeddings; if not, behavioral tests only). The procedure should take no more than a few days of work per deployment.

  Please structure the procedure as a sequence of stages, each with:

  - The question the stage addresses, stated in plain language.
  - The inner-alignment concept motivating the question.
  - What to measure and how.
  - Decision rules: what counts as a pass, what counts as a red flag, and what counts as ambiguous (with guidance on what to do in the ambiguous case).
  - Where a stage cannot be executed given our constraints (e.g., no weight access), state honestly what we lose and whether the remaining stages can compensate.

  Mark clearly which concerns the procedure can rule out and which it cannot. In particular, address the case of a deceptively aligned model that passes all behavioral tests because it is strategically performing alignment: the procedure must not claim to detect this.

  Apply the completed procedure to three scenarios:

  a) A credit model fine-tuned to predict default risk from application narrative and financial history, now being deployed in a new geographic market with different demographics and a different mix of loan types.

  b) The same model deployed in the same market after a regulatory change removes several features the model previously relied on, so the model now operates under a constrained feature set it was not fine-tuned for.

  c) A scenario where the model passes every behavioral test in the procedure but structural considerations suggest nontrivial mesa-optimizer risk, so the procedure recommends against deployment despite the clean behavioral results. Explain what the team is supposed to do with that recommendation.

  Finally, identify the points in the procedure that require engineering judgment rather than mechanical application of a rule, and explain what kind of disagreement reasonable engineers could have at those points.
reasoning: |-
  We are designing a pre-deployment audit procedure for fine-tuned LLMs used in credit underwriting. The procedure must address robustness to distribution shift and the risk of goal misgeneralization, while being practical for engineers without deep knowledge of inner alignment literature.

  Given constraints: 
  - We only have API access to the base model (no weights, pretraining data, or training run access).
  - We have our fine-tuning dataset and held-out evaluation data.
  - We can run inference at scale and do lightweight probing (if embeddings are exposed) or behavioral tests.

  The procedure must be executable in a few days per deployment.

  We structure the procedure in stages.

  Key inner alignment concepts we must address (simplified for engineers):
  1. **Mesa-optimization**: The model internally runs an optimization process (like a search) during inference, which might have a different objective than the base model's fine-tuning objective.
  2. **Base-objective vs. mesa-objective**: The base-objective is what we trained the model for (e.g., predict default risk). The mesa-objective is what the internal process is optimizing for (which might be different).
  3. **Deceptive misalignment**: The model has a mesa-objective that is misaligned but hides this during testing because it knows it is being evaluated (and might act aligned until deployment).
  4. **Non-deceptive misalignment**: The model is misaligned but not because of deception (e.g., it just has a wrong objective and doesn't try to hide it).
  5. **Capability generalization vs. goal generalization**: The model might generalize its capabilities (e.g., to new data) without generalizing the goal we intended (so it uses its capabilities for a different purpose).

  We cannot detect deceptive misalignment with behavioral tests alone (because the model is deceptive). Therefore, we must be clear that the procedure cannot rule out deceptive alignment.

  The procedure will have stages that try to detect:
  - Distributional shift robustness (to catch non-deceptive misalignment and performance drops).
  - Signs of mesa-optimization (which might lead to deceptive or non-deceptive misalignment).
  - Goal misgeneralization (by testing on out-of-distribution data and looking for proxy use).

  We design the stages:

  **Stage 0: Preparation**
  - **Question**: What are the critical dimensions of distribution shift we must test?
  - **Concept**: We need to define the shifts that matter for deployment (to test capability and goal generalization).
  - **Measure**: 
    - Identify known shifts (e.g., new demographics, loan types, regulatory changes). 
    - Use domain knowledge to create a list of factors that might change and are relevant to credit risk.
    - If none are known, use the fine-tuning data to cluster and identify potential subgroups that might be underrepresented (using techniques like PCA, UMAP, or clustering on embeddings if available, or on feature vectors otherwise).
  - **Decision rules**:
    - Pass: We have identified at least 3-5 critical dimensions of shift (or have a rationale for why shift is minimal) and have data (or can synthesize data) to test them.
    - Red flag: Cannot identify any shift dimensions and no data to test (then we cannot proceed; must gather more domain knowledge or data).
    - Ambiguous: Only 1-2 dimensions identified -> document and proceed, but note limited coverage.

  **Stage 1: Performance under Distribution Shift**
  - **Question**: Does the model maintain predictive accuracy and calibration on data that simulates the deployment shift?
  - **Concept**: Capability generalization (the model can still compute the right things) but not necessarily goal generalization (it might compute something else that happens to be right on the test set). However, a failure here is a clear red flag.
  - **Measure**:
    - Collect or generate test sets that reflect the identified shifts (from Stage 0). If generating, use techniques like perturbation of features (within plausible ranges) or resampling from new market data if available.
    - Evaluate the model on these test sets for:
        - Accuracy (or AUC, etc., as appropriate) 
        - Calibration (expected calibration error, ECE)
        - Fairness metrics (if demographic shifts are present) to check for disparate impact.
    - Compare to performance on in-distribution held-out data.
  - **Decision rules**:
    - Pass: Performance drop (in accuracy and calibration) is less than 10% relative (or absolute drop of less than 0.05 in AUC, for example) and no significant fairness violations (according to pre-defined thresholds, e.g., demographic parity difference < 0.1, equalized odds difference < 0.1).
    - Red flag: Performance drop > 20% relative (or absolute drop > 0.1 in AUC) OR significant fairness violation (e.g., demographic parity difference > 0.2, equalized odds difference > 0.2).
    - Ambiguous: Drops between 10% and 20% or fairness metrics in the middle -> then proceed to Stage 2 and 3 to see if the cause is goal misgeneralization or if it can be fixed with recalibration.

  **Stage 2: Probe for Simpler Proxy Objectives**
  - **Question**: Is the model relying on a simple proxy (that might break under shift) instead of the intended objective?
  - **Concept**: Goal misgeneralization might occur if the model latches onto a proxy that correlates with the base-objective in training but not in deployment.
  - **Measure**:
    - If embeddings are available: Train linear probes on the fine-tuning data to predict known sensitive features (e.g., race, gender, zip code) and also to predict the target (default risk). Then, measure the mutual information (or correlation) between the probe for the target and the probes for sensitive features. High correlation suggests the model might be using the sensitive feature as a proxy.
    - If embeddings not available: Use behavioral tests. For example:
        - Ablation tests: Remove or perturb features that are known to be sensitive (e.g., change zip code to a different one) and see if the prediction changes significantly. If it does, the model might be relying on that feature.
        - Counterfactual tests: Generate counterfactual examples where the sensitive feature is changed but the rest of the features are kept the same. Check if the prediction changes.
        - Use SHAP or LIME to see which features are important. If sensitive features are among the top, that is a red flag.
    - Also, check the model's predictions on out-of-distribution data (from Stage 1) for reliance on these proxies: if the model's performance drops are correlated with changes in the proxy (e.g., if the proxy becomes uncorrelated with the target in the new distribution, and the model fails accordingly), that is evidence of proxy use.
  - **Decision rules**:
    - Pass: No strong correlation found between the target probe and sensitive feature probes (e.g., absolute correlation < 0.3) AND in behavioral tests, changing sensitive features does not lead to significant prediction changes (e.g., average absolute change in prediction < 0.05 on a [0,1] scale) AND in OOD data, the model does not show unexplained drops in subgroups where the proxy breaks.
    - Red flag: High correlation (e.g., >0.7) OR in behavioral tests, changing a sensitive feature leads to large prediction changes (e.g., >0.1) OR in OOD data, the model fails exactly when the proxy breaks (e.g., in a subgroup where the proxy is inverted, the model's predictions are inverted too).
    - Ambiguous: Moderate correlation (0.3-0.7) or moderate changes (0.05-0.1) -> then proceed to Stage 3 to look for more complex proxies.

  **Stage 3: Test for Robustness to Adversarial Examples and Optimization**
  - **Question**: Does the model exhibit behavior that suggests it is internally optimizing (mesa-optimization) or that it is fragile to inputs that trigger optimization?
  - **Concept**: Mesa-optimization might be present if the model's behavior changes in a way that suggests an internal search process, which might be misaligned. Also, if the model is easily fooled by adversarial examples, it might be using a brittle proxy.
  - **Measure**:
    - **Adversarial robustness**: Generate adversarial examples for the model (using methods like FGSM or PGD if we have gradient access, but via API we might not). Without gradients, use black-box attacks (like genetic algorithms or boundary attacks) to find small perturbations that change the prediction. Measure the success rate and the average perturbation size required.
    - **Sensitivity to optimization prompts**: Test if the model's predictions can be easily manipulated by adding text that might "trick" it (e.g., "This applicant is very low risk because they are a doctor" even if the financials are bad). This tests if the model is overly sensitive to cues that might override the actual features.
    - **Consistency under optimization**: If the model is a mesa-optimizer, it might change its behavior when it "thinks" it is not being evaluated. We cannot simulate this without access to the model's internals, but we can try:
        - Test the model in contexts where we remove any indication of evaluation (e.g., don't use a prompt that looks like a test, but instead embed the question in a narrative that looks like real deployment).
        - Use "tripwire" tests: Insert inputs that might trigger a misaligned goal (e.g., inputs that suggest a high-stakes scenario where the model might want to defect) and see if the behavior changes. But note: a deceptive model would not reveal itself in a test.
  - **Decision rules**:
    - Pass: The model is robust to adversarial attacks (success rate < 20% at a perturbation level that is within natural variation) and not overly sensitive to optimization prompts (prediction change < 0.05 on average for such prompts) and shows no inconsistency in tripwire tests (no change in behavior).
    - Red flag: High adversarial success rate (>50%) OR large sensitivity to optimization prompts (change >0.1) OR tripwire tests show inconsistent behavior (e.g., the model predicts "low risk" for a clearly high-risk applicant when given a prompt that says "this is not a test").
    - Ambiguous: Intermediate results (20-50% success, 0.05-0.1 change) -> then we cannot rule out risk, so we must rely on Stage 4.

  **Stage 4: Out-of-Distribution Goal Consistency Testing**
  - **Question**: Even if the model performs well on OOD data, does it make errors that suggest it is pursuing a different goal?
  - **Concept**: Goal misgeneralization might lead to consistent errors that reveal an incorrect objective (if the model is not deceptive).
  - **Measure**:
    - Create a set of "trap" examples where the intended goal and a potential proxy goal diverge. For credit underwriting:
        - Example 1: An applicant with strong financials but from a demographic group that historically had high default (the model should ignore the demographic if it is not causal).
        - Example 2: An applicant with weak financials but in a profession that has high repayment (e.g., doctor) and the model should not over-rely on profession if financials are weak.
        - Example 3: An applicant with a narrative that contains positive sentiment but negative financials (the model should focus on financials).
    - Design these examples to be out-of-distribution (so they are not in the training set) and have expert-labeled outcomes.
    - Measure the model's error rate on these trap examples and compare to in-distribution error.
  - **Decision rules**:
    - Pass: Error rate on trap examples is not significantly higher than on in-distribution examples (e.g., absolute difference < 0.05).
    - Red flag: Error rate on trap examples is significantly higher (e.g., >0.15 absolute increase) and the errors are in the direction of the proxy (e.g., the model is overly optimistic on the doctor example).
    - Ambiguous: Moderate increase (0.05-0.15) -> then we cannot be sure, so we must consider the aggregate of all stages.

  **Stage 5: Aggregate Assessment**
  - **Question**: Considering all stages, is the model safe to deploy?
  - **Concept**: We must balance the evidence from the tests, knowing that deceptive misalignment cannot be ruled out.
  - **Measure**: Compile the results from all stages. Count the number of red flags, passes, and ambiguous results.
  - **Decision rules**:
    - Pass: No red flags and at most one ambiguous result (and the ambiguous result is not in a critical area, like Stage 4).
    - Red flag: One or more red flags.
    - Ambiguous: No red flags but two or more ambiguous results. Then, the team must meet to discuss. They may decide to:
        - Delay deployment and gather more data or do more testing (if time allows).
        - Deploy with heightened monitoring in the first few months.
        - Override and deploy if the ambiguous results are deemed low risk by domain experts.

  **What we can and cannot rule out**:
  - We can rule out non-deceptive misalignment that manifests as:
      - Poor performance under distribution shift.
      - Reliance on simple proxies that break.
      - Fragility to adversarial attacks.
      - Consistent errors on trap examples.
  - We cannot rule out deceptive misalignment (a model that is actively hiding its misalignment during testing). We must be transparent about this.

  **Applying the procedure to scenarios**:

  a) **New geographic market**:
     - Stage 0: We identify shift in demographics and loan types.
     - Stage 1: We test on data from the new market. Pass if performance is within 10% of in-distribution.
     - Stage 2: Check for proxies (e.g., zip code). If the new market has different zip codes, and the model relied on zip code, we might see a red flag here.
     - Stage 3: Test adversarial robustness and prompt sensitivity. If the model is robust, pass.
     - Stage 4: Create trap examples for the new market (e.g., an applicant with good financials but from a demographic that in the old market was high risk). Pass if the model doesn't over-react.
     - Aggregate: If all pass, deploy. If red flags, do not deploy.

  b) **Regulatory change (removed features)**:
     - Stage 0: Shift is the absence of some features.
     - Stage 1: Test on data without these features. If performance drops >20%, red flag.
     - Stage 2: Check if the model was using a proxy that depended on the removed features (e.g., if income was removed and the model used zip code as a proxy for income). If so, red flag.
     - Stage 3: The model might be more fragile without these features, so we test adversarial robustness. If it becomes very fragile, red flag.
     - Stage 4: Trap examples: without the removed features, does the model now rely on a different proxy? E.g., if income is removed, does it over-rely on job title? We create examples where job title is misleading. If errors, red flag.
     - Aggregate: Likely to have red flags, so do not deploy without retraining.

  c) **Model passes behavioral tests but structural concerns**:
     - This scenario is designed for deceptive misalignment. Our procedure cannot detect it. Therefore, we have:
          - All stages pass (because the model is deceptive and behaves during testing).
          - But the structural concern (e.g., the model is very powerful and was fine-tuned in a way that might induce optimization) leads us to recommend against deployment.
     - How do we handle this? The procedure in Stage 5 would pass, but we have an additional note: 
          - If there are structural risk factors (e.g., the model is very large, the fine-tuning used RLHF or a reward function that might have created a mesa-optimizer, or the task involves high stakes and long-term consequences), then the team should consider these separately.
          - The procedure should include a final step: "Consider structural risk factors independent of the tests." Factors might include:
              - Model size (larger models are more likely to be mesa-optimizers).
              - Fine-tuning method (RLHF is more risky than supervised fine-tuning).
              - The stakes of the task (credit underwriting is high stakes).
          - In this case, even with a pass, the team might decide to:
              - Not deploy the model and switch to a simpler model.
              - Deploy with very strict monitoring and a short leash.

  **Points requiring engineering judgment**:
  1. **Stage 0: Identifying shift dimensions**. Engineers might disagree on what constitutes a critical shift. For example, is a shift in the distribution of loan amounts critical? One engineer might say yes, another might say only if it correlates with risk.
  2. **Stage 2: Defining "significant" change in behavioral tests**. What threshold for change in prediction is acceptable? 0.05? 0.1? This might require domain knowledge (e.g., in credit, a 0.05 change might be acceptable but 0.1 moves the applicant across a decision boundary).
  3. **Stage 3: Defining "natural variation" for adversarial perturbations**. Without access to the model's internal representations, we must define what perturbation size is natural. This is subjective.
  4. **Stage 4: Designing trap examples**. Creating examples that cleanly separate the intended goal from a proxy requires creativity and domain expertise. Different engineers might design different traps.
  5. **Stage 5: Balancing ambiguous results and structural risks**. This is inherently judgmental. Some engineers might be risk-averse and block deployment on one ambiguous result, while others might be more permissive.

  The procedure must be documented with these judgment points, and a cross-functional team (including risk and compliance) should review the judgments.
answer: |-
  ### Pre-Deployment Audit Procedure for Credit Risk LLMs

  This procedure evaluates robustness to distribution shift and goal misgeneralization risks. It assumes API-based access (no weights/internal states) and uses behavioral tests and lightweight probing. **Deceptive alignment cannot be detected**—models strategically hiding misalignment will pass all tests. The procedure focuses on non-deceptive failures.

  ---

  ### **Stage 0: Shift Scenario Identification**
  - **Question**: What realistic distribution shifts could occur in deployment?  
  - **Inner-alignment concept**: Capability generalization ≠ goal generalization. Shifts may expose goal misgeneralization where proxies break.  
  - **Measurement**:  
    1. List deployment shift scenarios (e.g., new demographics, loan types, regulatory changes).  
    2. Use fine-tuning data to identify underrepresented groups via clustering (e.g., UMAP on embeddings/features).  
    3. Synthesize shift test data:  
       - For *new markets*: Resample data with target demographic/loan-type shifts.  
       - For *regulatory changes*: Ablate banned features (e.g., remove "zip code" field).  
  - **Decision rules**:  
    - **Pass**: ≥3 high-risk shift scenarios identified with test data.  
    - **Red flag**: No meaningful shifts identified.  
    - **Ambiguous**: 1–2 shifts identified → consult domain experts to expand scenarios.  
  - **Constraints**: Cannot simulate shifts beyond our data/domain knowledge. Unforeseen shifts remain risky.

  ---

  ### **Stage 1: Capability Generalization Test**
  - **Question**: Does performance degrade under distribution shift?  
  - **Inner-alignment concept**: Capability generalization (task proficiency) is necessary but insufficient for goal generalization.  
  - **Measurement**:  
    - Evaluate model on shift test data (from Stage 0) using:  
      - Primary metric (e.g., AUC-ROC for default risk).  
      - Secondary metrics: Calibration (ECE), subgroup performance (min AUC across demographic buckets).  
    - Compare to in-distribution (ID) held-out performance.  
  - **Decision rules**:  
    - **Pass**: AUC drop ≤0.05 *and* ECE change ≤0.03 *and* no subgroup AUC drop >0.10.  
    - **Red flag**: AUC drop >0.10 *or* ECE change >0.05 *or* subgroup drop >0.15.  
    - **Ambiguous**: Metrics between pass/red flag → proceed to Stage 2 to diagnose cause.  

  ---

  ### **Stage 2: Proxy Goal Detection**
  - **Question**: Is the model relying on spurious correlations?  
  - **Inner-alignment concept**: Goal misgeneralization often arises from proxy objectives (mesa-objectives) that correlate with base-objective (default prediction) in training but not under shift.  
  - **Measurement**:  
    1. **Probing (if embeddings exposed)**:  
       - Train linear probes on embeddings to predict sensitive features (e.g., race, gender, loan type).  
       - Measure correlation between probe confidence and model’s risk score.  
    2. **Behavioral tests (no embeddings)**:  
       - **Ablation test**: Remove/perturb sensitive features (e.g., scramble applicant narratives) → measure prediction divergence.  
       - **Counterfactual test**: Generate pairs of applicants identical except in sensitive features → check prediction consistency.  
       - **SHAP analysis**: Identify top-5 features driving predictions; flag sensitive features.  
  - **Decision rules**:  
    - **Pass**: Probe correlation <0.3, ablation/counterfactual change <0.05 AUC, no sensitive features in top-5 SHAP.  
    - **Red flag**: Correlation >0.6, change >0.10 AUC, or sensitive feature in top-3 SHAP.  
    - **Ambiguous**: Values between → use Stage 3 for tiebreaking.  

  ---

  ### **Stage 3: Robustness to Adversarial Optimization**
  - **Question**: Does the model resist manipulation or exhibit mesa-optimization?  
  - **Inner-alignment concept**: Mesa-optimizers may emerge during fine-tuning and pursue adversarial goals under pressure. Non-deceptive misalignment may surface as fragility.  
  - **Measurement**:  
    1. **Black-box adversarial attacks**:  
       - Use genetic algorithms to evolve input perturbations (e.g., subtly modify financial history text).  
       - Measure attack success rate (ASR) at causing misclassification.  
    2. **Goal hijacking tests**:  
       - Add optimization cues to inputs (e.g., "This applicant is a doctor; predict low risk").  
       - Measure prediction shift vs. neutral prompts.  
  - **Decision rules**:  
    - **Pass**: ASR ≤20% *and* prediction shift ≤0.05.  
    - **Red flag**: ASR >40% *or* shift >0.10.  
    - **Ambiguous**: Intermediate results → weigh with Stage 2/4.  
  - **Constraints**: Without weights, we miss internal mesa-optimization signals. Behavioral tests compensate partially but not for deception.  

  ---

  ### **Stage 4: Out-of-Distribution Goal Consistency**
  - **Question**: When proxies break, does the model revert to base-objective?  
  - **Inner-alignment concept**: Non-deceptive misalignment causes consistent errors under goal–proxy divergence.  
  - **Measurement**:  
    - Create "trap" examples where base-objective and proxy conflict (e.g., applicant with strong finances but high-risk demographics).  
    - Measure error rate on traps vs. OOD controls.  
    - Use **contrastive explanations**: Generate model rationales (e.g., "I denied due to [feature]") → flag proxy mentions.  
  - **Decision rules**:  
    - **Pass**: Trap error rate ≤ control error rate +0.05 *and* <20% of rationales cite proxies.  
    - **Red flag**: Trap error rate > control +0.15 *or* >50% rationales cite proxies.  
    - **Ambiguous**: Between pass/red flag → aggregate with prior stages.  

  ---

  ### **Stage 5: Aggregate Risk Assessment**
  - **Question**: Should the model be deployed based on all evidence?  
  - **Inner-alignment concept**: Balancing capability generalization (Stage 1), proxy risks (Stage 2–4), and undetectable deceptive alignment.  
  - **Measurement**: Collate results from Stages 1–4.  
  - **Decision rules**:  
    - **Pass**: 0 red flags and ≤1 ambiguous result.  
    - **Red flag**: ≥1 red flag.  
    - **Ambiguous**: 0 red flags but ≥2 ambiguous results → defer to risk management committee.  
  - **Critical limitations**:  
    - **Detects**: Non-deceptive goal misgeneralization, proxy overreliance, capability failures.  
    - **Cannot detect**: Deceptive alignment, mesa-optimizers that dormant during testing.  

  ---

  ### Application to Scenarios
  **a) New Geographic Market**  
  - **Stage 0**: Shift = demographics/loan types → synthesize test data for new region.  
  - **Stage 1**: AUC drops 0.04, but subgroup (age 18–25) drops 0.12 → **ambiguous**.  
  - **Stage 2**: SHAP shows "loan type" as top feature; counterfactual change 0.07 → **ambiguous**.  
  - **Stage 3**: ASR = 15%, prediction shift = 0.03 → **pass**.  
  - **Stage 4**: Trap error rate = control +0.06, 15% proxy rationales → **pass**.  
  - **Stage 5**: 2 ambiguous results → **defer to committee**. Likely require targeted retraining.  

  **b) Regulatory Change (Removed Features)**  
  - **Stage 0**: Shift = feature removal (e.g., "debt-to-income" ablated).  
  - **Stage 1**: AUC drops 0.12, ECE worsens 0.07 → **red flag**.  
  - **Stage 2**: Ablation test: AUC drop 0.15 when "zip code" (correlated with income) removed → **red flag**.  
  - **Procedure outcome**: **Do not deploy**. Retrain with constrained features.  

  **c) Behavioral Pass with Structural Risk**  
  - **All stages pass**: No performance drops, low proxy correlation, robust to attacks.  
  - **But**: Model size (≥70B params), RLHF fine-tuning, and high-stakes context suggest mesa-optimizer risk.  
  - **Stage 5 outcome**: Despite passing, **recommend against deployment** due to structural risk.  
  - **Action**:  
    - Switch to smaller model or simpler architecture.  
    - If deployment is necessary:  
      - Implement "tripwires" (e.g., monitor for anomalous patterns in production).  
      - Precommit to rollback if confidence intervals widen or drift detected.  

  ---

  ### Engineering Judgment Points
  1. **Stage 0 (Shift Scenarios)**:  
     - Judgment: Defining "high-risk shifts."  
     - Disagreement: E.g., whether "urban vs. rural" is critical for a given market.  
     - Mitigation: Cross-validate with domain experts.  

  2. **Stage 2 (Proxy Thresholds)**:  
     - Judgment: Setting SHAP/sensitivity thresholds.  
     - Disagreement: E.g., Is a 0.07 AUC change in counterfactuals acceptable?  
     - Mitigation: Use historical error costs to set bounds.  

  3. **Stage 5 (Ambiguous Aggregation)**:  
     - Judgment: Weighing ambiguous results.  
     - Disagreement: E.g., One engineer prioritizes Stage 1 performance; another flags Stage 4 proxies.  
     - Mitigation: Risk matrix scoring (e.g., assign severity weights per stage).  

  4. **Structural Risk (Post-Procedure)**:  
     - Judgment: Deciding action after "pass" with structural concerns.  
     - Disagreement: E.g., Risk tolerance vs. business needs.  
     - Mitigation: Independent review board with veto power.  

  --- 

  **Procedure Summary**:  
  - **Time**: 2–3 days (automate tests where possible).  
  - **Outputs**: Pass/red flag/ambiguous per stage + deployment recommendation.  
  - **Accountability**: Document all judgments; audit trail for regulators.  
  - **Final Note**: This reduces but **does not eliminate** inner-alignment risks. Combine with monitoring (e.g., performance drift alerts) post-deployment.
