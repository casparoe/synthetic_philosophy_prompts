answer: |-
  Here’s the exam question, model answer, and marking scheme designed to force critical engagement with your core distinctions.  

  **Exam Question (as it would appear on the paper):**  
  > "**Akrasia and Hyperbolic Discounting: Explanations or Evasions?** (30 marks)  
  > Hyperbolic discounting models are frequently invoked to explain weakness of will (akrasia). Using the distinction between **structural akrasia** (time-inconsistent preferences) and **executive akrasia** (stable ranking at *t* but failure to act on it):  
  > (a) Explain which form of akrasia, if either, hyperbolic discounting *genuinely explains*, and why it fails to explain the other.  
  > (b) Assess whether modelling an agent as a series of time-slices with distinct preferences ‘explains’ executive akrasia or *dissolves* it by redefinition.  
  > (c) Evaluate the proposal that hyperbolic discounting reflects distrust of one’s *future judgements* (not future goods). Does this resolve any key problem? If so, *at what theoretical cost*?  
  > *Commit to clear arguments. Avoid surveys of possibilities.**"  

  ---

  **Model Answer (Approx. 700 words):**  

  **(a) Hyperbolic discounting directly explains structural akrasia but cannot address executive akrasia.** Structural akrasia arises from time-inconsistent preferences: at planning time *t₁*, the agent prefers long-term reward A (e.g., health) over short-term reward B (e.g., smoking), but at action time *t₂*, they prefer B over A due to steeply rising discount rates for proximal rewards. Hyperbolic discounting models this mathematically: the discount function δ(𝑡) = 1/(1+𝑘𝑡) generates preference reversals as 𝑡 approaches zero. Here, the agent acts on *current* preferences at *t₂*; there is no failure of rationality relative to their momentary ranking. However, this fails to explain executive akrasia – where, at *t₂*, the agent *judges* B inferior to A *even then*, yet still chooses B. Hyperbolic discounting assumes choices reflect *current* all-things-considered preferences, making genuine executive failure conceptually invisible within the model.  

  **(b) The time-slice model dissolves executive akrasia; it does not explain it.** Framing the agent as successive time-slices, each with its own utility function ("Present Self" at *t₂* prefers smoking, "Future Self" at *t₁* prefers health), appears to explain conflict. But this eliminates the core phenomenon of executive akrasia. Executive akrasia requires a *single agent* at *t₂* experiencing a conflict between their *current* evaluation and *current* action. The time-slice model redefines this conflict as a clash between distinct agents (Past Self vs. Present Self). Consequently, there is no failure: "Present Self" simply maximises its utility. What we intuitively describe as "I knew it was wrong *as I did it*" becomes "My *t₂* self correctly pursued its goal." This is dissolution via redefinition, not explanation. It sidesteps the puzzle of why an agent, unified over time, acts against their own contemporaneous best judgement.  

  **(c) Discounting future judgements offers a partial fix for executive akrasia at the cost of diachronic identity.** Shifting the discount target from future *goods* ("I value tomorrow’s health less today") to future *judgements* ("I distrust what I will value tomorrow") addresses a key weakness. An agent at *t₁* might rationally devalue health-planning because she anticipates her *t₂* self will irrationally discount health. This creates space for executive akrasia: at *t₂*, she judges smoking worse for health but acts, knowing her *t₂* judgement is untrustworthy *even to her future selves*. This explains action against *current* judgement via meta-distrust. However, this "fix" incurs significant costs. First, it requires iterated meta-cognition (distrusting one’s future distrust), risking regress. Second, and more profoundly, it undermines diachronic agency. If I systematically distrust my future evaluations, the unified agent planning a life project fragments. Planning becomes impossible if future selves are seen as alien evaluators whose judgements bear no authority. The cost is abandoning a robust conception of the self as a temporally extended rational agent, replacing it with a series of mutually suspicious sub-agents. While it rescues executive akrasia from the time-slice dissolution, it does so by making intrapersonal conflict resemble interpersonal conflict, sacrificing agential unity.  

  **Conclusion:** Hyperbolic discounting robustly explains structural akrasia as rational choice given shifting preferences. It cannot explain executive akrasia without reframing the agent, either by dissolving agency into time-slices (losing the unified actor) or by discounting future judgements (losing diachronic identity). Neither move fully preserves the intuition of a single agent failing themselves in the moment.  

  ---

  **Marking Scheme (30 marks total):**  

  | **Must-Hit Point**                                  | **Marks** | **Weak Answer Typically...**                              |
  |-----------------------------------------------------|----------|----------------------------------------------------------|
  | **1. Correctly identifies structural akrasia as the genuine explanandum of hyperbolic discounting.** | 6 | Conflates structural/executive or claims HD explains both. |
  | **2. Clearly explains why hyperbolic discounting *cannot* account for executive akrasia** (due to reliance on current preferences). | 6 | Assumes HD explains all preference reversals without addressing the stable-judgement criterion. |
  | **3. Argues that the time-slice model *dissolves* (not explains) executive akrasia** by redefining conflict as inter-agent. | 6 | Accepts time-slices as an "explanation" without noting the loss of unified agency. |
  | **4. Evaluates discounting future judgements as a *partial fix* for executive akrasia** (creates space for distrusting current judgement). | 6 | Only describes the proposal without assessing its explanatory value for executive cases. |
  | **5. Identifies the *cost* of discounting future judgements** (undermines diachronic agency/identity; risks regress). | 6 | Omits costs or mentions only superficial issues (e.g., "complexity"). |

  ---

  **Design Rationale:**  
  - **Forces Commitment:** Parts (a)-(c) demand binary choices (explains/dissolves, fix/redescription) with justifications.  
  - **Blocks Recitation:** Question structure requires applying *your* distinctions (structural/executive) and critiquing HD’s scope.  
  - **Probes Original Idea:** Part (c) explicitly tests the "discounting judgements" hypothesis and its trade-offs.  
  - **Level-Appropriate:** Challenges final-year students to synthesise technical modelling (HD) with conceptual agency problems.  
  - **Marks Rigour:** Scheme rewards precise taxonomy use (point 1), conceptual clarity (point 2), meta-theoretical awareness (point 3), critical evaluation (point 4), and cost-benefit analysis (point 5). Weak answers fail by omission or conflation.
