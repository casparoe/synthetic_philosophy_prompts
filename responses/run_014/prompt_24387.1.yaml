prompt: |-
  I'm trying to figure out what I actually think about selling stuff, going by my gut on cases, and I can't get a consistent story out of the lot. A guy selling one of his kidneys to a stranger for $50k, fully informed, healthy otherwise: I'm fine with it. A plasma center paying you $50 for a pint, twice a week: obviously fine. A gas station tripling the price of bottled water three days after a hurricane: not fine, even though I get that its just the market. A tomato grower raising prices after a frost kills half the crop: fine, that's just markets working. Selling your vote in an election: not fine, full stop. A group paying low-income residents $20 to show up and vote, no instruction on how to vote: thats the one I keep going back and forth on. Selling your place in a line at the DMV for $20: fine. Selling your place in a kidney transplant waiting list: not fine. A paid surrogate carrying a baby for a couple who can't have one: fine. Selling a newborn at birth: not fine.

  The water one and the tomato one look the same to me structurally — price goes up, someone profits, buyers pay more — but my gut splits on them and I don't know why. Same with the line ones. Is there a principle that gets all of these, or close, stated precisely enough that I could test it on new cases? What does it say about the turnout-payment one, and which of my verdicts does it force me to drop? Also what does it predict for cases I haven't listed, like a woman in financial trouble selling a kidney to pay off debt, or a rich person buying a slot in a lottery for a subsidized apartment? I'd rather have a simpler principle that gets most of them right than a complicated one that saves every verdict, so be honest if the price of saving all my gut calls is a principle so baroque I wouldn't actually use it.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're struggling with inconsistent gut reactions to different selling scenarios. The key examples include selling kidneys, plasma, price gouging after disasters, crop price hikes, vote selling, queue jumping, surrogacy, and baby selling. 

  First, I notice the user is intellectually honest - they admit confusion when similar structures (like water vs tomato pricing) trigger different moral responses. That suggests they're not just rationalizing but genuinely seeking coherence. The core ask is for a principle simple enough for real-world use, even if it means overriding some initial intuitions.

  Hmm... the examples cluster around three tension points: bodily integrity vs commodification (kidneys/babies), market efficiency vs exploitation (water/gas), and democratic integrity vs individual choice (votes). The turnout payment case seems to bridge voting and market logic - hence their back-and-forth.

  What's beneath the surface? Maybe anxiety about capitalism's boundaries. The hurricane example reveals discomfort with profit during suffering, while accepting crop pricing shows they understand supply/demand. The kidney cases suggest they distinguish between voluntary adult choices (surrogacy) and irreversible/coerced transactions (baby selling, debt-driven organ sale).

  For principle-building, I should test existing ethical frameworks. Commodification theory explains the baby/kidney discomfort but fails on queue jumping. Exploitation theory covers the hurricane but not tomatoes. Democratic corrosion theory handles vote selling but struggles with turnout payments. 

  Ah! The "social meaning" angle might reconcile these. When a transaction alters how society perceives a fundamental good (like votes or human bodies), it crosses a line. Queue jumping at the DMV? Annoying but no deep meaning shift. Queue jumping for organs? That corrupts healthcare's purpose. 

  This principle would force them to accept turnout payments as legitimate (since no vote-buying occurs) but reject disaster price gouging (as it betters social trust). Rich people buying lottery slots? Probably forbidden - it distorts redistribution systems. Debt-driven kidney sales? Tricky, but the social meaning of bodies as commodities might outweigh consent here.

  The user's willingness to sacrifice some intuitions is key. They'll need to either accept turnout payments or reject paid plasma donation to stay consistent. Given their plasma comfort, the former seems preferable. Simplicity wins here - no need to invent "coercion thresholds" or "vitalness coefficients."
answer: |-
  Here's a principle that captures most of your intuitions while remaining relatively simple and testable:

  **The Core Principle:**
  *It's permissible to sell a good or service if and only if the transaction respects the inherent purpose or fundamental nature of the thing being sold and doesn't undermine essential social institutions or exploit severe desperation.*

  **How it explains your gut reactions:**

  1.  **Kidney to Stranger for $50k:** *Permissible.* The kidney's inherent purpose is biological function. Selling one spare kidney to save a life (even for profit) arguably respects its biological purpose. Doesn't inherently undermine institutions or exploit *severe* desperation *in this specific scenario* (fully informed, healthy).
  2.  **Plasma for $50:** *Permissible.* Plasma regenerates; selling it supports the medical system's need for blood products (respects its purpose). Compensation is modest, not typically driven by life-or-death desperation.
  3.  **Water After Hurricane:** *Impermissible.* Water's inherent purpose is sustaining life. Tripling the price during a disaster exploits life-threatening desperation and undermines social trust and the expectation of basic fairness during crises (essential social fabric).
  4.  **Tomatoes After Frost:** *Permissible.* Tomatoes are standard commodities. Price hikes reflect scarcity, signaling producers to grow more and consumers to conserve, respecting the market's purpose in allocating non-essential goods. No exploitation of desperation for survival.
  5.  **Selling Your Vote:** *Impermissible.* A vote's inherent purpose is expressing individual political judgment for collective self-governance. Selling it commodifies citizenship, directly undermining the fundamental institution of democracy.
  6.  **Paying $20 to Turnout (No Instruction):** *Permissible (according to principle).* The payment compensates for the *effort* of voting (time, travel), not the vote itself. It respects the vote's purpose (individual choice remains free) and can strengthen the democratic institution by increasing participation, especially among disadvantaged groups. *(This forces you to drop your "back-and-forth" and accept it as fine, aligning with plasma/kidney/DMV line logic).*
  7.  **Selling DMV Place:** *Permissible.* A place in line represents time. Selling time is commonplace. It doesn't corrupt the DMV's core function (processing registrations/licences) or exploit desperation.
  8.  **Selling Transplant List Place:** *Impermissible.* A place on the list represents access to a life-saving resource allocated by medical need. Selling it commodifies life-or-death allocation, corrupting the healthcare system's purpose (fair allocation based on need/urgency) and exploiting the desperation of the sick.
  9.  **Paid Surrogacy:** *Permissible.* Compensation is for the *service* of gestation and the physical burden, not the baby as a commodity. It respects the purpose of creating a family (for the couple) and bodily autonomy (for the surrogate), supporting the social institution of family formation.
  10. **Selling Newborn:** *Impermissible.* A newborn is not a commodity; it's a person. Selling a person fundamentally violates human dignity and the purpose of family/kinship bonds. It corrupts the social institution of parenthood and child welfare.

  **Why the Water/Tomato Split?** The principle distinguishes based on **inherent purpose and context:**
  *   **Water after hurricane:** Becomes a *life-sustaining necessity* in an emergency. Exploiting desperate need for survival violates its purpose and social trust.
  *   **Tomatoes after frost:** Remain a *non-essential commodity*. Price signals manage scarcity within the normal function of markets for such goods. No exploitation of survival desperation.

  **Predictions for New Cases:**

  1.  **Woman Selling Kidney to Pay Off Debt:**
      *   *Principle Prediction:* **Likely Impermissible.** While the kidney sale itself might be structurally similar to the first case, the driver is *severe financial desperation*. This crosses into exploitation of vulnerability, even if "informed." It risks undermining the perceived integrity of organ donation systems.
      *   *Your Gut Check:* Probably uneasy, leaning "not fine." Principle aligns.

  2.  **Rich Person Buying Slot in Lottery for Subsidized Apartment:**
      *   *Principle Prediction:* **Impermissible.** The subsidized apartment's purpose is to provide affordable housing based on *need*. Selling the lottery slot (representing a chance at need-based allocation) corrupts the social program's purpose, turning it into a commodity for the wealthy and undermining the institution of social housing.
      *   *Your Gut Check:* Likely "not fine." Principle aligns.

  **What the Principle Forces You to Drop/Change:**

  1.  **Turnout Payments ($20 to vote):** The principle forces you to accept this as permissible. It compensates effort, not the vote itself, respects the vote's purpose (free choice remains), and potentially strengthens democracy. This is the price of simplicity and consistency with your other market-permissive judgments (plasma, DMV line).
  2.  **Possible Nuance in Kidney Sales:** The principle might make you slightly less comfortable with the first kidney sale or force a clearer distinction between "spare kidney sold freely" vs. "kidney sold under significant financial duress," potentially moving the latter towards "not fine."

  **Strengths of this Principle:**

  *   **Explains the Splits:** Handles water/tomato (necessity/exploitation vs. commodity/market), DMV line/transplant list (time vs. life-saving access), surrogacy/baby sale (service vs. person).
  *   **Testable:** For any new case, ask: (1) What is the *inherent purpose or fundamental nature* of the thing/service? (2) Does selling it *corrupt that purpose* or the institution it operates within? (3) Does it exploit *severe desperation* for basic needs?
  *   **Relatively Simple:** Avoids overly complex definitions of "coercion," "vitalness," or "market failure." Focuses on purpose, corruption, and exploitation.
  *   **Gets Most Right:** Captures the vast majority of your initial intuitions.

  **Weaknesses/Acknowledged Trade-offs:**

  *   **"Inherent Purpose" Can Be Debated:** What *is* the inherent purpose of a kidney? (Biological function? Or non-commodification?) The principle relies on widely shared social understandings, which can evolve.
  *   **"Severe Desperation" is Fuzzy:** Distinguishing severe desperation (exploitative) from strong desire or convenience isn't always black-and-white. The hurricane case is clear, but what about selling plasma to pay rent?
  *   **Sacrifices Turnout Payment Intuition:** As noted, it forces you to accept turnout payments as fine.
  *   **Less Emphasis on Consent:** While consent is assumed in "informed" cases, the principle overrides pure consent when purpose/corruption/exploitation are violated (e.g., vote selling, baby selling).

  **Conclusion:**

  This principle - **respecting inherent purpose, avoiding institutional corruption, and prohibiting exploitation of severe desperation for essentials** - provides a coherent, testable framework that captures nearly all your gut reactions. The key cost is accepting that paying people modest sums solely to incentivize voting *effort* (not the vote choice) is permissible, aligning it with paying for plasma or DMV line time. It clearly forbids vote selling, baby selling, disaster profiteering on essentials, and transplant list trafficking, while allowing routine market adjustments, compensated surrogacy, and regulated organ/plasma donation. It also gives clear guidance on the new cases, rejecting debt-driven kidney sales and rich people buying subsidized housing slots. While not perfectly simple, it avoids being baroque and offers a usable moral compass for these complex transactions.
