prompt: |-
  I'm one of four people drafting the pay-differential rules for a worker co-op (about 200 members, very mixed skill levels), and every time we try to write down why some roles should be paid more, "deserves" splits into three or four notions that pull apart from each other. Before I read another chapter of the desert literature I want the spec.

  Write the desiderata: what any theory of desert good enough to serve as the public justification for a written, applied pay rule has to deliver. Give the case behind each requirement, and make sure these show up somewhere in the list: two members with identical measured output, one of whom produced it while covering a sick parent and the other at ease; a member whose output is enormous only because of who she's teamed with, so there's no decomposition into individual contributions; a well-judged risky project that failed on bad luck sitting next to a reckless one that paid off; someone who front-loaded years of training at her own expense and wants to know whether that ever gets "used up"; and the flat conflict between what a member deserves for what he already did versus what paying him now would incentivize.

  Then tell me which of these are genuine requirements and which are one camp's priors dressed as criteria, which single one knocks out the most candidate theories, and whether any subset is jointly unsatisfiable — I suspect pre-institutional desert plus contribution-as-the-desert-basis plus some responsibility condition is going to collapse, and I want the collapse argued rather then asserted. A couple of lines each, at the end, on how a contribution-based view, an effort/sacrifice view, and an institutionalist view do against the list.

  Be straight about where you're least confident. If one of my five cases isn't actually hard, say which and say which requirement I'm over-reading into it. And tell me what would change your mind about the impossibility claim — what consideration would make you drop a requirement from the list as a prejudice instead of a desideratum.
reasoning: |-
  Okay, the user is part of a team drafting pay-differential rules for a worker co-op with about 200 members. They're struggling with defining "desert" for pay differences, and the concept keeps splitting into different notions. They mentioned specific cases that need addressing: two members with identical output but different personal circumstances, someone whose output depends on team dynamics, risky projects with different outcomes but varying judgment, someone who invested in training and wonders if it gets "used up," and the conflict between rewarding past actions versus incentivizing future behavior.

  First, I need to break down their main request. They want desiderata—criteria that any desert theory must satisfy to justify pay rules publicly. Each requirement needs a case to back it up, and they listed five specific scenarios to include. Then, they want analysis on which requirements are genuine versus biased, which one disqualifies most theories, and if any subset is incompatible. They suspect pre-institutional desert plus contribution plus responsibility might collapse, so I need to argue that point. Finally, they want brief evaluations of contribution-based, effort-based, and institutionalist views against the list.

  Looking at the cases, each one tests different aspects of desert. For example, identical output with different personal efforts challenges whether personal sacrifice should matter. The team-dependent output questions if individual contribution can be separated. Risky projects highlight the role of luck versus judgment. The training investment case asks if past costs should factor into current desert. The conflict between past desert and future incentives touches on the purpose of pay—reward versus motivation.

  Now, formulating the desiderata. I'll start by listing each requirement with its corresponding case. For instance, Responsibility Sensitivity addresses the two workers with identical output but different personal efforts. Non-Arbitrariness covers the team-dependent output where decomposition fails. Judgment Over Luck deals with the risky projects. Cost Accounting relates to the training investment. And Temporal Neutrality tackles the conflict between rewarding past actions and incentivizing future behavior. I'll add others like Measurability, Justifiability, and Incentive Alignment as they seem necessary for a practical pay system.

  Next, analyzing which requirements are genuine. Non-Arbitrariness and Measurability seem essential for any applied pay rule to avoid disputes. Responsibility Sensitivity might be more contentious, as it could stem from a moral view that effort should be rewarded. But in a co-op, members might value effort, so it's context-dependent. Similarly, Temporal Neutrality might be necessary if the co-op wants pay to serve both reward and incentive purposes, but that's a policy choice.

  The toughest requirement is likely Responsibility Sensitivity because it requires assessing personal circumstances, which is hard to measure objectively and might conflict with Non-Arbitrariness. If pay must account for personal sacrifices, it could lead to intrusive evaluations or subjective judgments, violating Non-Arbitrariness.

  The potential collapse comes from combining Pre-Institutional Desert, Contribution Basis, and Responsibility Sensitivity. If desert is pre-institutional and based on contribution, but contribution doesn't account for personal sacrifices (like caring for a sick parent), then Responsibility Sensitivity isn't satisfied. Alternatively, if contribution includes effort, then measuring that objectively is problematic. Thus, in practice, these three together might be unworkable without subjective judgments.

  Evaluating the three theories: Contribution-based struggles with Responsibility Sensitivity and Non-Arbitrariness (team output). Effort-based handles Responsibility Sensitivity but fails hard on Measurability and Incentive Alignment. Institutionalist avoids pre-institutional issues but may not satisfy those who believe in inherent desert, and it needs careful design to handle all desiderata.

  The user might have deeper needs. They want a fair, transparent system that members accept. The co-op's values matter—whether they prioritize fairness based on effort, contribution, or institutional goals. The unspoken need is likely avoiding conflict among members by having a justifiable system that feels fair to all, even in edge cases. They might also need the system to be sustainable, balancing motivation with fairness without excessive bureaucracy.

  I should note where I'm least confident: Responsibility Sensitivity's necessity and whether Temporal Neutrality is essential or a choice. Also, the impossibility claim depends on accepting all desiderata; if the co-op drops Responsibility Sensitivity as too subjective, then Contribution-based might work. Changing the impossibility would require showing that personal circumstances can be measured objectively or that the co-op values contribution over effort, making Responsibility Sensitivity optional.
answer: |-
  Here are the core desiderata for a desert-based pay rule in your co-op, derived from your cases and the need for a public, applicable justification. Each requirement is paired with its motivating case and rationale:

  1.  **Responsibility Sensitivity:**
      *   **Case:** Two members with identical measured output, one produced it while covering for a sick parent (high effort/sacrifice), the other at ease.
      *   **Requirement:** The rule must be sensitive to differential effort, sacrifice, or burdens borne *within the member's control* to achieve the same outcome. Desert should track the "cost" to the member, not just the result.
      *   **Rationale:** A purely outcome-based system ignores significant differences in personal commitment, potentially rewarding luck of circumstance over moral effort.

  2.  **Non-Arbitrariness / Measurability:**
      *   **Case:** A member whose enormous output is inseparable from team synergy; contributions cannot be cleanly decomposed.
      *   **Requirement:** The desert basis must be practically measurable or assessable without excessive subjectivity or reliance on factors beyond the individual's control (like specific, irreplaceable team chemistry).
      *   **Rationale:** Pay rules must be transparent, consistent, and defensible. Assigning desert based on an unmeasurable "true contribution" invites disputes and perceptions of unfairness.

  3.  **Judgment Over Luck:**
      *   **Case:** A well-judged risky project failing on bad luck vs. a reckless one succeeding.
      *   **Requirement:** The rule must distinguish between the *quality of the decision/effort* and the *outcome influenced by luck*. Desert should attach to the former, not the latter.
      *   **Rationale:** Rewarding/punishing luck undermines the link between desert and agency/responsibility. It incentivizes reckless gambling or avoids prudent risk-taking.

  4.  **Cost Accounting / Temporal Scope:**
      *   **Case:** The member who front-loaded years of training at personal expense – does this "cost" factor into current desert, and is it "used up"?
      *   **Requirement:** The rule must have a coherent and justifiable way to account for past investments (effort, sacrifice, cost) that enable current contribution, defining their temporal relevance and potential depreciation.
      *   **Rationale:** Ignoring past investments feels like freeloading; perpetual compensation feels like double-counting. A desert theory needs temporal principles.

  5.  **Temporal Neutrality (Or Explicit Policy Choice):**
      *   **Case:** The conflict between deserving pay for *past work* vs. using pay to *incentivize future behavior*.
      *   **Requirement:** The rule must explicitly reconcile or choose between backward-looking desert (rewarding past actions/contributions) and forward-looking utility (incentivizing future desired actions). It cannot implicitly conflate them as the same thing.
      *   **Rationale:** These are distinct justifications often in tension. Pretending pay does both equally without acknowledging the tension undermines the rule's integrity and invites manipulation.

  6.  **Justifiability / Non-Exploitation:**
      *   *(Implicit in all cases, especially Team Output & Training)*
      *   **Requirement:** The rule must provide a publicly defensible reason why differential pay is *earned* or *merited* by the member, not merely reflective of market power, institutional necessity, or luck. It must prevent members feeling exploited or like free-riders.
      *   **Rationale:** Core to the concept of desert in a co-op; pay differences must be seen as fair based on member agency, not circumstance.

  7.  **Incentive Alignment (Feasibility):**
      *   *(Implicit in all cases, especially Temporal Conflict & Risk)*
      *   **Requirement:** The resulting pay structure must not actively disincentivize behaviors the co-op values (e.g., prudent risk-taking, teamwork, skill development, covering burdens).
      *   **Rationale:** A practically dysfunctional pay system fails, regardless of theoretical desert purity. Co-op sustainability matters.

  **Analysis of Requirements:**

  *   **Genuine Requirements (Necessary for a workable, justifiable rule):** Non-Arbitrariness/Measurability, Justifiability/Non-Exploitation, Incentive Alignment (Feasibility), Temporal Neutrality (or explicit choice). These deal with practical application, transparency, conflict avoidance, and institutional survival. The "sick parent" case highlights a genuine tension but...
  *   **Potentially Contested / Camp Priors:** **Responsibility Sensitivity.** This embodies a specific moral view (effort/sacrifice *in itself* is desert-generating). A pure *contribution* view might see the output as the only relevant desert basis, regardless of personal cost (assuming the member chose the role). Its necessity depends on the co-op's core values – is compensating differential sacrifice fundamental?
  *   **Judgment Over Luck** blends genuine need (don't punish good process) with a prior (desert *should* track only controllable factors). The *need* is to not *disincentivize* good judgment. Whether "desert" is the *only* or *best* way to achieve this is debatable.
  *   **Cost Accounting** is a genuine requirement for *any* rule involving past investments, but the *precise* accounting method (amortization, perpetual premium) reflects specific priors about desert's temporal nature.

  **The Single Biggest Theory-Knocker:** **Responsibility Sensitivity.** Most contribution-based theories struggle profoundly with it (how to *objectively* measure the differential effort/sacrifice behind identical outputs?). Effort-based theories embrace it but fail miserably on Non-Arbitrariness/Measurability (how to measure effort objectively, especially mental effort?). Luck-egalitarian views embrace Judgment Over Luck but often stumble on Non-Arbitrariness and Temporal Neutrality.

  **The Suspected Collapse: Pre-Institutional Desert + Contribution Basis + Responsibility Sensitivity**
  *   **The Argument:** Pre-institutional desert demands a "natural" fairness basis independent of the co-op's rules. Contribution seems like a strong candidate (you deserve the fruits of your labor). Responsibility Sensitivity demands that desert also reflect differential effort/sacrifice for *identical* contributions.
  *   **The Collapse:** Contribution alone (e.g., widgets produced) cannot satisfy Responsibility Sensitivity for identical outputs. To incorporate Responsibility Sensitivity, you must either:
      1.  **Redefine Contribution:** Claim the "true contribution" is higher for the person under duress. But this is arbitrary ("how much *more*?"), unmeasurable pre-institutionally, and violates Non-Arbitrariness.
      2.  **Abandon Pure Contribution:** Introduce effort/sacrifice *alongside* or *instead of* output as a desert basis. But this abandons the pure contribution basis. Effort is notoriously difficult to define and measure objectively pre-institutionally (violating Non-Arbitrariness).
      3.  **Admit Institutional Relativity:** Concede that what counts as "contribution" or relevant "effort" is defined *by the co-op* based on its goals and values. This abandons pre-institutionalism.
  *   **Conclusion:** Holding all three simultaneously leads to contradiction or the collapse into one of the alternatives above, abandoning one of the initial premises. Pre-institutional desert struggles to incorporate Responsibility Sensitivity without sacrificing Contribution's objectivity or admitting institutional definition.

  **Brief Theory Evaluations Against the List:**

  1.  **Contribution-Based:**
      *   **Strengths:** Clear link to output/impact (Justifiability), often measurable (if outputs are), strong Incentive Alignment for tangible results.
      *   **Weaknesses:** Fails **Responsibility Sensitivity** (identical output dilemma), fails **Non-Arbitrariness** on team outputs, struggles with **Judgment Over Luck** (rewards lucky outcomes), ambiguous on **Cost Accounting** (past training?), **Temporal Neutrality** conflict (past contribution vs. future incentive).

  2.  **Effort/Sacrifice-Based:**
      *   **Strengths:** Directly addresses **Responsibility Sensitivity**, potentially addresses **Cost Accounting** (training as past effort).
      *   **Weaknesses:** Catastrophically fails **Non-Arbitrariness/Measurability** (how to objectively measure effort/sacrifice?), poor **Incentive Alignment** (rewards busywork over results), struggles with **Judgment Over Luck** (effort on failed project vs. less effort on lucky success?), ambiguous on **Temporal Neutrality**.

  3.  **Institutionalist ("Desert is defined by the co-op's aims"):**
      *   **Strengths:** Can explicitly define "contribution" or "value" to suit co-op goals, enabling **Measurability** & **Justifiability** within the frame. Can design rules for **Incentive Alignment**. Can incorporate **Judgment Over Luck** by rewarding process. Can make explicit choices on **Temporal Neutrality** and **Cost Accounting**.
      *   **Weaknesses:** May feel arbitrary to those holding pre-institutional views. **Responsibility Sensitivity** may only be incorporated if explicitly valued by the co-op. Requires careful design to avoid internal contradictions.

  **Where I'm Least Confident:**
  *   The absolute necessity of **Responsibility Sensitivity** as a *desert requirement* (vs. a co-op value addressed by other means like support systems or non-monetary recognition).
  *   Whether **Cost Accounting** truly requires a *desert* solution or is better handled by explicit investment/repayment policies separate from ongoing pay-for-work.
  *   The feasibility of any theory perfectly satisfying **Judgment Over Luck** in practice without significant subjectivity.

  **Your Five Cases: Which Isn't Hard?**
  *   The **"training investment" (Cost Accounting)** case isn't conceptually *hard* for desert theories. Most can incorporate it *somehow* (skill premium, amortization). The *hard part* is the **Temporal Scope** requirement: *choosing and justifying* the specific method (how long? how much?) within the desert framework. The difficulty is in the implementation and justification, not the core concept.

  **What Would Change My Mind on Impossibility?**
  *   If **Responsibility Sensitivity** were shown to be fundamentally incompatible with the *practical necessity* of a workable pay rule (Non-Arbitrariness/Measurability) in a group setting, I might drop it as a *desert requirement for pay* and relegate it to a different co-op value (e.g., supported through workload management, leave policies, or non-monetary recognition). This would recognize that while differential effort/sacrifice *might* generate moral desert, it may be too context-dependent and unmeasurable to serve as a basis for *distributing monetary rewards* fairly and transparently in an organization. The co-op might decide fairness in pay requires focusing on more objective factors, even if morally imperfect.
