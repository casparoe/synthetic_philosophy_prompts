answer: |-
  ## MEMORANDUM

  **To:** Members of the University Faculty Senate  
  **From:** Ad Hoc Committee on Electoral Reform  
  **Subject:** Recommendation on Voting Procedure for Senate Chair Election  
  **Date:** October 26, 2023  

  **1. Background and Charge**  
  Following the April Senate Chair election, where the plurality winner secured only 38% support amidst reports of strategic voting, this Committee was charged with recommending an improved electoral procedure. Our Charter directs us to prefer a deterministic single-winner system satisfying three core principles:  
  *   **Universality:** Accepts *any* sincere ranking of candidates by voters.  
  *   **Non-Imposition:** Every candidate must be a *possible* winner under some ballot configuration.  
  *   **Strategy-Resistance:** No voter should *ever* gain a better outcome by submitting an insincere ballot, and no single voter is a dictator.  

  We evaluated the proposal to adopt Ranked-Choice Instant Runoff Voting (RCV/IRV) based on its claim to eliminate strategic incentives. Our analysis reveals a fundamental constraint that shapes our recommendation.  

  **2. A Foundational Limitation: The Impossibility Theorem**  
  After rigorous review, including consultation with electoral systems experts, the Committee concludes that **no voting system can simultaneously satisfy all three Charter desiderata when three or more candidates run.** This is a profound result in social choice theory (Arrow's Impossibility Theorem and its derivatives).  

  *   **Universality and Non-Imposition** are generally achievable (e.g., by RCV or plurality).  
  *   **Strategy-Resistance (Non-Manipulability)**, however, is incompatible with the other two when ≥3 candidates exist. *Every* deterministic system accepting ranked ballots and allowing any candidate to win will, for *some* ballot configurations, create situations where at least *one* voter could achieve a *more preferred* outcome by ranking insincerely.  

  **3. Illustrating the Problem: A Hypothetical Scenario**  
  Consider an electorate mirroring our three major factions, with sincere preferences:  

  *   **Faction Alpha (38%):** Prefers Candidate A > B > C  
  *   **Faction Beta (33%):** Prefers Candidate B > A > C  
  *   **Faction Gamma (29%):** Prefers Candidate C > B > A  

  **Under Current Plurality:**  
  *   A receives 38%, B receives 33%, C receives 29%. A wins.  
  *   Gamma voters, fearing an A win and preferring B, might insincerely vote for B (reported last April). If *all* Gamma voters do this, B gets 33% + 29% = 62%, defeating A – an outcome Gamma prefers over A winning.  

  **Under Proposed Ranked-Choice IRV (Sincere Ballots):**  
  1.  First Count: A:38%, B:33%, C:29%. C is eliminated.  
  2.  C's ballots transfer entirely to B (as C>B>A voters rank B second).  
  3.  Final Count: B:33%+29%=62%, A:38%. **B wins.**  

  **Strategic Potential under RCV:**  
  *   Gamma voters *sincerely* prefer C>B>A. Their sincere voting leads to B winning (as above).  
  *   **Could insincere voting help Gamma?** Suppose Gamma voters fear B winning more than A winning (perhaps due to specific policies), and insincerely rank A *first* instead of C:  
      *   Ballots: Alpha (38%): A>B>C; Beta (33%): B>A>C; Gamma (29%): **A>B>C** (insincere).  
      *   First Count: A:38% + 29% = 67%, B:33%. A wins outright (majority).  
  *   **Outcome for Gamma:** If Gamma *sincerely* prefers A over B (A > B), then this insincere voting (ranking A first) achieved their *most* preferred outcome (A wins) instead of their *less* preferred outcome (B wins). **They benefited from strategy.**  
  *   *Note:* This specific strategic incentive depends on Gamma's *true* preference between A and B and their expectation of others' votes. The critical point is that the *opportunity* for such beneficial manipulation exists in this configuration under RCV, violating the Charter's strict Strategy-Resistance desideratum.  

  **4. What RCV Does and Does Not Achieve**  
  *   **What RCV Improves:**  
      *   **Reduces "Spoiler" Effect:** RCV allows voters to sincerely rank a less-popular candidate first without "wasting" their vote, as their vote transfers if that candidate is eliminated. This addresses a major flaw in plurality evident in our last election.  
      *   **Promotes Majority Support (Often):** Winners typically achieve broader support than under plurality by accumulating transfers, increasing legitimacy.  
      *   **Mitigates (But Does Not Eliminate) Duopoly Pressure:** It lessens the pressure for voters to coalesce around only two major candidates.  
  *   **What RCV Does NOT Achieve:**  
      *   **Universal Strategy-Resistance:** As demonstrated, situations exist where voters can benefit from insincere ranking. RCV is not immune to strategy, though the *type* and *likelihood* of strategic incentives differ from plurality.  
      *   **Guaranteed Majority Winner:** A winner can still emerge without a majority of first-choice preferences.  

  **5. The Strongest Case for RCV (and Why We Still Recommend It)**  
  The most compelling argument for RCV is that **it demonstrably reduces the *prevalence* and *impact* of harmful strategic voting compared to plurality**, particularly the "lesser-evil" voting witnessed in April. Under plurality, Gamma voters faced a strong, clear incentive to abandon their true favorite (C) to vote for B strategically. Under RCV, Gamma voters can *sincerely* support C first. While theoretical scenarios for other types of strategy exist (as shown), they are often more complex, require specific voter coordination/knowledge, and carry higher risk of backfiring. RCV fosters more sincere expression of first choices and better captures the electorate's will in fragmented fields.  

  **6. Recommendation and Next Steps**  
  Despite the impossibility of fully satisfying the Charter's demanding Strategy-Resistance principle, the Committee **recommends adopting Ranked-Choice Instant Runoff Voting** for the Senate Chair election.  

  **Justification:** While no perfect system exists, RCV represents a *significant practical improvement* over our current plurality system. It directly addresses the most salient problem observed – the pressure on supporters of trailing candidates to betray their true preference in a futile attempt to influence the outcome between the perceived leaders – by allowing sincere first-choice voting without penalty. It promotes winners with broader support and is a well-established, understandable system.  

  **Practical Next Steps:**  
  1.  **Draft Bylaws Amendment:** Formalize the adoption of RCV, including ballot format (rank candidates), counting procedure (instant runoff), and tie-breaking rules (retaining seniority for ties occurring *during* the count).  
  2.  **Procure/Develop Voting System:** Secure a reliable, auditable method for collecting and tabulating ranked ballots (e.g., specialized voting software or vendor).  
  3.  **Voter Education:** Launch a comprehensive campaign well before the next election:  
      *   Explain *why* the change is being made (addressing last year's issues).  
      *   Clearly demonstrate *how* to complete a ranked ballot ("Rank candidates in order: 1, 2, 3...").  
      *   Explain the counting process simply (eliminate last place, transfer votes).  
      *   Emphasize the key benefit: "Vote your true conscience first."  
  4.  **Pilot Test:** Conduct a mock election using the new system to identify and address any procedural issues.  

  **Conclusion**  
  The ideal of a completely strategy-proof system is unattainable with three or more candidates. However, Ranked-Choice Voting offers a substantial and necessary upgrade from our current plurality system. It empowers voters to support their genuine favorite first, reduces the "spoiler" dynamic, and promotes winners with stronger overall support. By adopting RCV, we take a decisive step towards fairer, more representative elections for Senate leadership. We urge the Senate to approve this recommendation.  

  **Attachments:**  
  *   Draft Bylaws Amendment Language  
  *   Summary of RCV Educational Materials Plan  
  *   Committee Voting Record (5-1 in favor of recommendation)
