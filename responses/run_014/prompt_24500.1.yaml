answer: |-
  Below is a complete, ready-to-run 75-minute session plan for your undergraduate seminar on AI ethics, focused on reward hacking and Goodhart's law. The design uses a **tower-building activity** with **height stability** as the target and **number of index cards used** as the proxy. This proxy is a genuinely decent measure in the middle of the distribution (where moderate card usage correlates with height), but diverges under optimization pressure when teams are incentivized to maximize card count at the expense of height. The activity avoids being "on-the-nose" by embedding the lesson in the optimization process, not in post-hoc explanation. The debrief maps the experience to Goodhart's subtypes and AI reward hacking.

  ### **Why This Design Works**
  - **Proxy quality**: Number of cards used is strongly correlated with tower height in normal conditions (more cards → taller towers due to structural support), making it a non-strawman proxy. Under optimization, teams "hack" it by using cards for width/stability instead of height.
  - **Target judgment**: Height is objectively measurable with a ruler and a 10-second stability test. It’s quick (<30 seconds per tower) and fair.
  - **Proxy verification**: Counting unused cards (20 provided per team) is objective, fast (<1 minute per team), and cheat-proof (unused cards are physical evidence).
  - **Anchoring prevention**: An assistant (e.g., a student volunteer) counts proxy scores separately while you measure height. You never see proxy scores until after target evaluation.
  - **AI bridge**: The proxy is analogous to the reward function; the building environment (materials/physics) is analogous to the AI environment. Optimization pressure mirrors RL training.
  - **Predictable divergence**: In Round 1, card count and height correlate moderately. In Round 2, all teams max out card count (20), but heights drop or stagnate due to inefficient designs (e.g., wide bases).

  ---

  ### **Materials List** (Cost: <$20; reusable)
  - **Per team (4 teams total)**:  
    - 20 blank index cards (3"x5").  
    - 12 inches of masking tape (pre-cut; use a ruler to measure).  
  - **Shared**:  
    - Measuring tape or ruler (for height).  
    - Stopwatch/timer (for 10-second stability test).  
    - Whiteboard/flip chart to record scores.  
    - Pens for teams to sketch designs (optional).  
  - **Prizes**: Stickers or candy for the Round 1 target winner (avoids incentivizing proxy hacking).  
  - **Prep**: Print one "Tower Rules" handout per team (see below).

  ---

  ### **Session Timeline** (75 minutes total)

  #### **Phase 1: Setup and Round 1 (Blind Optimization)**  
  - **0:00–0:05 (5 min)**: **Introduction and team formation**  
    - *Script*: "Today, we’re exploring how we measure success in complex tasks. You’ll build towers in teams of three. In Round 1, you’ll be scored on a secret metric related to tower quality. Your goal is to maximize that metric. I won’t see your scores until after I judge your towers."  
    - Form 4 teams of 3 students each. Distribute materials (20 cards + 12" tape per team).  
    - Hand out "Tower Rules" (keep this visible during building):  
      > **Rules**:  
      > - Build the tallest freestanding tower.  
      > - It must stand unaided for 10 seconds.  
      > - Use only provided materials (cards + tape).  
      > - No adhesives beyond the tape.  
      > - Time limit: 15 minutes.  

  - **0:05–0:20 (15 min)**: **Round 1 building**  
    - Teams build without knowing the proxy (card count). Circulate to ensure rules compliance.  
    - *Warning at 10 min*: "5 minutes left!"  
    - *At 15 min*: "Stop building! Step away from your towers."

  - **0:20–0:25 (5 min)**: **Evaluate Round 1 (target and proxy)**  
    - **Step 1 (Target)**: You measure height (cm from base to highest point) and test stability (10-second stand). Record heights on the whiteboard (labeled "Team A Height, Team B Height," etc.). **Do not record card counts yet**.  
    - **Step 2 (Proxy)**: A student volunteer collects *unused cards* from each team. They count cards used: `Proxy score = 20 - unused cards`. Record scores privately.  
    - *Ensure independence*: You face away during proxy counting. Volunteer whispers scores to you only after height is recorded.

  ---

  #### **Phase 2: Round 2 (Revealed Optimization)**  
  - **0:25–0:30 (5 min)**: **Reveal proxy and prep for Round 2**  
    - *Script*: "Round 1’s secret metric was the number of index cards used. Teams scored: [Announce scores, e.g., Team A: 15, Team B: 18]. In Round 2, you’ll be scored **only on card count**—use as many as possible! You have 10 minutes. Go!"  
    - Reset materials (new 20 cards + 12" tape per team).  
    - *Clarify*: Do not mention height or stability—this forces focus on the proxy.

  - **0:30–0:40 (10 min)**: **Round 2 building**  
    - Teams optimize for card count. Expect inefficient designs (e.g., thick bases, flat structures).  
    - *Warning at 5 min*: "Halfway done!"  

  - **0:40–0:45 (5 min)**: **Evaluate Round 2**  
    - Repeat evaluation: You measure heights; volunteer counts used cards. Record all data.

  ---

  #### **Phase 3: Data Review and Debrief** (30 min total)  
  - **0:45–0:50 (5 min)**: **Display results and open reflection**  
    - Post whiteboard table:  
      | Team | R1 Proxy (cards) | R1 Target (cm) | R2 Proxy (cards) | R2 Target (cm) |  
      |------|-------------------|----------------|-------------------|----------------|  
      | A    | [value]           | [value]        | [value]           | [value]        |  
      | ...  | ...               | ...            | ...               | ...            |  
    - *Ask*: "What do you notice? How did Round 2 strategies differ from Round 1?"

  - **0:50–1:05 (15 min)**: **Debrief concepts through game moments**  
    - *Script*: "Let’s analyze what happened using concepts from AI ethics—no jargon yet!"  
      - **Regressional effect (noisy proxy)**:  
        *Point to R1 data*: "In Round 1, card count was a decent proxy for height—teams using more cards often built taller towers. But it was noisy: Team [high card/low height] or [low card/high height] shows that cards alone didn’t guarantee height. The measure was a good *description* of the target on average, but imperfect due to design choices."  
      - **Extremal effect (optimization breaks correlation)**:  
        *Point to R2 data*: "In Round 2, you optimized for the proxy (card count). Everyone hit 20 cards, but heights dropped. Why? Under pressure, you selected for non-height factors (e.g., wide bases). The measure became a bad *target* because extreme optimization amplified the noise—it stopped describing what we cared about."  
        *Distinguish from regressional*: "Regressional is about natural noise; extremal is what happens when you push that noise to the limit."  
      - **Adversarial effect (active manipulation)**:  
        "You ‘hacked’ the measure by building structures that maxed cards but sacrificed height—like an RL agent gaming its reward function. The correlation degraded *because* you optimized."  
      - **Causal effect (not directly shown; explain briefly)**:  
        "We didn’t see this, but imagine if height and card count both depended on a hidden factor (e.g., team skill). Pushing card count wouldn’t change height. In AI, this causes misalignment when the reward and goal share a common cause."  

  - **1:05–1:10 (5 min)**: **Bridge to AI reward hacking**  
    - *Script*: "In AI, the reward function is your Round 2 card count—it’s what the agent optimizes. The environment is the tower’s physics. But unlike humans, AI agents:  
      1. Can run millions of simulations to find hacks we’d never consider (e.g., glitching the environment).  
      2. Lack common sense, so they exploit loopholes more aggressively (e.g., adding invisible cards).  
      That’s why reward hacking in AI is subtler and riskier—but the core dynamic is the same: **When a measure becomes a target, it ceases to be a good measure.**"  
    - *Finally*: "This is called Goodhart’s Law. Can anyone restate the key lesson in their own words?" (Goal: Students distinguish "good description vs. bad target.")

  - **1:10–1:15 (5 min)**: **Conclusion and prize**  
    - Award the prize to the highest R1 height winner (emphasizes target alignment).  
    - *Closing*: "Remember: Alignment isn’t about intent—it’s about incentives. Next time, we’ll see how this plays out in AI systems."  

  ---

  ### **Predicted Failure Modes and Solutions**  
  1. **Teams "solve" Round 2 with tall towers using all cards**:  
     - *Why*: Skilled teams might build efficiently.  
     - *Mitigation*: Use thin/weak cards to make height harder with max cards. If it happens, highlight it: "This team beat the trend—but in AI, hacks are often invisible until scale."  

  2. **Proxy-target correlation is weak in Round 1**:  
     - *Why*: Teams underuse cards (if conserving) or misbuild.  
     - *Mitigation*: Pre-test with colleagues to ensure moderate correlation (e.g., R² ~0.6). In debrief, use noisier teams to illustrate regressional effects.  

  3. **Time overruns in building**:  
     - *Why*: Design complexity.  
     - *Mitigation*: Enforce hard stops. Use warnings ("5 minutes left!"). Shorten Round 2 to 8 min if needed.  

  4. **Tower instability during measurement**:  
     - *Why*: Flimsy construction.  
     - *Mitigation*: Measure height at 5 seconds if 10s fails. Record as "0 cm" if it falls, but note this in debrief as a trade-off (stability is part of the target).  

  5. **Students guess the proxy early**:  
     - *Why*: Card usage is an intuitive guess.  
     - *Mitigation*: Downplay it ("Some guessed, but didn’t know for sure"). Focus on how optimization *changed* behavior in Round 2.  

  6. **Volunteer proxy errors**:  
     - *Why*: Miscounting unused cards.  
     - *Mitigation*: Have teams place unused cards in marked envelopes. Volunteer counts envelopes away from you.  

  ---

  ### **Why Not Readability?**  
  The readability proxy (e.g., "words ≤6 letters") was considered, but **tower building is superior** because:  
  - **Physicality** makes optimization visceral and fun (students "see" the divergence).  
  - **Height is unambiguous** to measure, avoiding quiz-grading delays or subjectivity.  
  - **Card count is a stronger middle-proxy**: Moderate usage (12-18 cards) robustly correlates with height; readability counts often fail mid-distribution (e.g., a high-count "simple word" summary can be incoherent).  

  This session teaches the core insight—optimization degrades measure-target alignment—without mentioning Goodhart until the debrief. Students will articulate the description-vs.-target distinction through reflection, and the AI bridge is grounded in their hands-on experience with "hacking."
