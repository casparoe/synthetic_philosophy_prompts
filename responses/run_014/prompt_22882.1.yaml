  I'd also really appreciate if you could say something about how this relates to Zeno's dichotomy, because I keep feeling like Thomson is just repackiging Zeno and I don't know if that's a fair critique or not. And if there's a reason the lamp is supposed to be a *new* problem and not just an old one in a different hat, I'd love for that to come through clearly, because right now it just feels like the same Zeno trick with a lightbulb stuck on it.
