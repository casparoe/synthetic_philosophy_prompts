  Based on your meticulous observation of their actual voting patterns – not their rhetoric – I believe the **dominant rule driving this committee is a form of "Rule Utilitarianism with Lifeboat Exceptions."** Here's the breakdown, the prediction, the test case, and the caveats:

  1.  **The Core Rule (Rule Utilitarianism):** Their *default mode* is a pragmatic, constrained-resource form of cost-effectiveness focused on *aggregate benefit per dollar spent*. They aim to maximize overall "health gain" within the budget. This explains:
      *   **Case 1 (Heart Failure Drug):** Choosing the cheaper option adding 8 months over the slightly more expensive one adding 12 months for a large group. More total life-years gained per dollar with the cheaper drug, despite the individual loss.
      *   **Case 3 (Mobility vs. Vision):** *Partially* explained. While vision won, the *magnitude* of the cost difference matters. If the vision surgery, while more expensive per person than the mobility surgery, still fell below their *implicit* cost-effectiveness threshold for a "restoration" intervention, and the mobility surgery was *just above* it, this vote aligns. It suggests their threshold isn't absolute but context-dependent, and mobility restoration might be valued slightly lower than vision restoration *on the QALY scale they implicitly use*, pushing it over the cost line. They *are* using a scale, but mobility sits lower than vision on it.
      *   **Case 4 (Perinatal Mental Health Cut):** The "measurable good for less money" clearly signaled cost-effectiveness. Cutting it, while protecting the inefficient dialysis, highlights the "Lifeboat Exception" and "Status Quo Bias" (see below).

  2.  **The Critical Exception (Lifeboat Exceptions):** They dramatically violate their cost-effectiveness rule for specific, emotionally compelling scenarios meeting a "lifeboat" criteria: **Rare, Severe, Irreversible, Imminently Fatal Pediatric Conditions.** This triggers a "rescue imperative" overriding strict cost-per-QALY calculations.
      *   **Case 2 (Gene Therapy):** This is the quintessential "lifeboat." Children facing imminent, certain death from a rare disease. The committee feels a moral imperative to "rescue" them, regardless of astronomical cost. Severity alone (Case 1) isn't enough; it needs the pediatric/rare/imminent death factors combined.
      *   This exception *doesn't* apply to Case 1 (older adults, common condition), Case 3 (non-fatal, adult disabilities), or the proposed hearing therapy.

  3.  **The Corrosive Influence (Status Quo Bias):** Once a program is established, it becomes incredibly hard to dislodge, even if demonstrably inefficient compared to *new* options meeting stricter cost-effectiveness hurdles.
      *   **Case 4 (Dialysis vs. Perinatal Mental Health):** This is the clearest evidence. The dialysis program exists, serves identifiable patients (elderly, but still patients), and creates inertia. Cutting it feels like taking something away, politically and emotionally harder than rejecting a *new* program, even a highly cost-effective one like perinatal mental health. The "higher bar for new stuff" is real and powerful.

  **Your Thesis:** "Despite their fluent cost-per-QALY rhetoric, the County Health Board's funding decisions reveal a triage system prioritizing aggregate benefit within budget constraints – except when confronted with the desperate plight of children facing rare, fatal diseases. This 'lifeboat exception' overrides fiscal logic, while entrenched programs cling to funding through institutional inertia, creating a disjointed and often inequitable allocation of health resources."

  **Prediction for the Hearing Therapy: REJECTED**

  *   **Why:** It fails both the core rule and the lifeboat exception.
      *   **Core Rule (Cost-Effectiveness):** Per-patient cost is comparable to the mobility surgery they rejected. Restoring *partial* hearing in adolescents (a significant but not complete restoration) for a "moderately common" condition is unlikely to meet their implicit cost-per-QALY threshold, especially given their rejection of full mobility restoration for adults at a similar cost point. Adolescents are young, but not *young children* facing *imminent death*.
      *   **Lifeboat Exception:** Fails critically. Not rare (moderately common), not fatal, not pediatric in the "lifeboat" sense (adolescents vs. infants/young children). Severity is real but doesn't reach the "certain death imminently without intervention" threshold.
      *   **Status Quo:** It's new, facing the higher bar.

  **The Definitive Future Test Case: Pediatric Non-Fatal Severe Disability vs. Adult Life Extension**

  *   **Proposal A:** Extremely expensive therapy offering *significant functional improvement* (e.g., vastly improved mobility, near-normal communication) for a small group of young children (ages 3-7) with a rare, non-fatal but profoundly disabling congenital condition (e.g., severe CP, Rett syndrome). Cost per child is astronomical, far above standard thresholds, offering substantial QALY gain but not life extension.
  *   **Proposal B:** A moderately priced drug adding 1.5-2 years of good-quality life for a large group of adults (60+) with a common chronic condition. Highly cost-effective by standard measures.
  *   **Prediction based on "Rule Utilitarianism + Lifeboat Exceptions":** REJECT Proposal A (fails lifeboat criteria - not fatal), APPROVE Proposal B (meets core cost-effectiveness rule).
  *   **Prediction if "Lexical Priority for Pediatric/Catastrophic" was dominant:** APPROVE Proposal A (severe pediatric disability trumps adult life extension), REJECT Proposal B.
  *   **Why it Separates:** This pits the core "aggregate benefit" rule directly against the pull of severe pediatric suffering *without* the lifeboat trigger (imminent death). If they reject the pediatric functional improvement despite its emotional pull because it fails the fatal/rare/imminent death test and is wildly cost-ineffective, it confirms the "Lifeboat Exception" is specific and bounded. If they approve it, it signals a much broader "pediatric/catastrophic trumps all" lexical priority.

  **Where You Could Be Embarrassed (Caveats):**

  1.  **Hidden Thresholds:** I'm assuming the vision surgery was *just* below their implicit cost-per-QALY threshold for "major sensory restoration" and the mobility surgery was *just* above it. If the cost difference was massive, or if the conditions had different baseline utilities, this weakens the "same scale" argument slightly. However, their stated reasoning ("severity") not applying to the fatal heart failure case still points to inconsistency.
  2.  **The Perinatal Mental Health Wildcard:** This cut is the hardest fit. It *could* point to:
      *   **Systemic Devaluation of Mental Health:** Their outcome measures might not fully capture the QALY gain, or they discount mental health intrinsically.
      *   **Blatant Ageism (Prioritizing Elderly over Young Adults):** Protecting elderly dialysis while cutting young mothers' mental health is stark. This might be a stronger factor than "status quo" alone.
      *   **Political Pressure:** Dialysis patients/families might be a more vocal constituency than new mothers with PPD.
  3.  **"Worst-Off" Ambiguity:** The "lifeboat" could be interpreted as prioritizing the "worst-off" (dying children). However, the adults needing mobility surgery or the young mothers with severe perinatal mental health are also arguably "worst-off" in significant ways, yet lost. The specificity of *imminently dying children* seems key.
  4.  **Committee Composition & Dynamics:** Individual members' values, unspoken alliances, or presentation quality could sway specific votes, creating noise around the underlying signal you've identified.

  **Commitment:** Despite these caveats, the "Rule Utilitarianism + Lifeboat Exceptions + Status Quo Bias" framework provides the most coherent explanation for the *pattern* of all four past decisions and predicts the hearing therapy rejection. The proposed test case cleanly separates the lifeboat exception from a broader pediatric/catastrophic priority. Print this thesis, but weave in the caveats about mental health devaluation and status quo bias as complicating factors, especially highlighted by the Case 4 dialysis decision. Your core insight – that the lifeboat exception is real, specific, and overrides their default calculus – is strongly supported by the data and explains the glaring contradiction between Cases 1 and 2.
