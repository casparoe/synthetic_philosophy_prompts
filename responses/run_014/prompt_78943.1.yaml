answer: |-
  Your framework is robust, but the Colston case stresses its joints—revealing both insights and limitations. Let's apply it rigorously:

  ### 1. **Act/Object Distinction: Persistence as Endorsement?**  
     - **Framework Claim:** Leaving a monument standing = active renewal of its claim.  
     - **Bristol Test:** The 2018 plaque dispute proves this. Toleration *was* affirmation: delaying a corrective plaque maintained Colston’s sanitized legacy. The statue’s physical persistence reinforced civic approval until removal.  
     - **Weakness Exposed?** Yes—but only in edge cases. A *neglected* monument (e.g., a forgotten plaque) might persist without endorsement. Here, Colston’s prominence made passivity complicity. **Verdict:** The claim holds for contested monuments; Bristol strengthens it.  

  ### 2. **Modes of Display: Did Musealisation Defuse Honor?**  
     - **Framework Claim:** Museums convert honorific objects (statues on plinths) into documentary/admonitory exhibits.  
     - **Bristol Test:** Displaying the graffitied, supine statue *succeeded* as documentary: it preserved the protest’s raw energy, making the statue evidence of 2020’s reckoning, not 1895’s heroism. The crouching angle (not upright) and protest slogans ("racist") added admonition.  
     - **Critique:** Purists argue museums "sanctify" objects, but *this* display refused restoration. It captured rupture, not reverence. **Verdict:** The museum *did* neutralize honor—by making Colston a prop in a larger story of resistance.  

  ### 3. **Standing: Who Decides? The Jury’s Answer**  
     - **Framework Question:** Legitimacy of actors (residents, descendants, officials, crowd).  
     - **Bristol Test:** The trial acquittal was pivotal. The jury (Bristol residents) validated the crowd’s moral authority, implying:  
       - Descendants of the enslaved > donors’ heirs.  
       - Democratic deficit (failed plaque process) justified direct action.  
     - **Tension:** The crowd acted *without* institutional standing, but the jury granted retrospective legitimacy. **Verdict:** The framework must accommodate *ex post facto* validation by community representatives (jurors).  

  ### 4. **Iconoclasm vs. Official Removal: Contrast Case**  
     - **Test Case: Rhodes Must Fall (Cape Town, 2015)**  
       - **Similar Outcome:** Removal of oppressive symbol.  
       - **Different Path:** Student protests → university commission → official removal.  
     - **Framework Analysis:**  
       - Official removal avoids criminality questions but risks co-opting dissent (e.g., slow commissions).  
       - Iconoclasm (Bristol) is cathartic but legally precarious.  
     - **Generalization:** The framework *holds*—modes matter. Official paths preserve procedural legitimacy; crowds assert moral urgency. Both reflect standing disputes.  

  ---

  ### **Where the Framework Fails: The Uncaptured Nuances**  
  1. **The Afterlife of Empty Plinths:**  
     The framework focuses on object fate but neglects the *void*. Bristol’s empty plinth became a site of ongoing dialogue (art, protests)—a living counter-monument.  

  2. **Defacement as Reclamation:**  
     Graffiti ("rapist", "George Floyd") transformed the statue *before* removal. The framework treats objects as static, but crowds can forcibly *recontextualize* them.  

  3. **Trial as Ritual:**  
     The acquittal wasn’t just about standing—it was a public reckoning. The trial *itself* became part of Bristol’s memory work, exceeding the "removal vs. retention" binary.  

  ---

  ### **Memory Literature: Margalit vs. Rieff**  
  - **Margalit ("Ethics of Memory"):**  
    Would endorse removal. Colston’s statue propagated false "thick relations" (civic pride built on slavery). Correcting this honors enslaved ancestors—a duty to truthful memory.  

  - **Rieff ("In Praise of Forgetting"):**  
    Might see the saga as memory cult gone awry. The *decades-long* fights over plaques/removal entrenched division. Forgetting Colston’s name (but not slavery) could liberate Bristol—yet the museum display eternalizes conflict.  

  - **Common Ground:** Both would agree the statue *matters profoundly*. Margalit: as ethical testimony. Rieff: as proof of memory’s toxic grip. Neither sees monuments as inert.  

  ---

  ### **Conclusion: A Sharpened Framework**  
  The Colston case **validates your core structure** but demands expansions:  
  - Add **"transformative vandalism"** as a display mode (pre-removal).  
  - Acknowledge **voids and trials** as active memory sites.  
  - Incorporate **temporal drag**: Delayed official responses (like the 2018 plaque stall) fuel iconoclasm.  

  Your framework’s strength is its recognition that **commemoration is never passive**. Bristol’s saga—from plaque debates to the graffitied museum exhibit—proves monuments are battlegrounds where history is violently, necessarily, remade.
