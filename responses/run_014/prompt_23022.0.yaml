  The regularity condition is crucial here. When the user mentioned it, they were spot on. If your prior gives probability zero to some evidence (like P(E)=0), then conditional probability P(•|E) becomes undefined. That breaks the Dutch book construction entirely. Interesting how this edge case reveals the argument's dependence on Bayesian formalism. 

  I should emphasize that while Dutch books originate from betting scenarios, philosophers like Ramsey and de Finetti used them as diagnostic tools for coherence. The money loss is just a vivid illustration of inconsistent credences. Maybe analogize it to mathematical proofs by contradiction? The bet is just the vehicle.

  For the P(E)=0 case, the user might appreciate knowing that some extensions exist (like Jeffrey conditionalization or Popper functions), but those are more complex and don't fully rescue the original argument. Admitting this limitation actually strengthens the explanation—it shows we're not handwaving.

  Marco's pragmatic reduction isn't wrong per se, but it's philosophically naive. The user clearly wants ammunition for the epistemic side. I should highlight how coherence arguments link to truth-tracking: inconsistent credences make your beliefs unstable under new information, which hinders learning. That's epistemic.

