answer: |-
  A compelling opening, but you've mischaracterized the essentialist position. Identical twins pose no threat because the essential "origin" isn't merely the zygote *before* splitting; it includes the very first mitotic division that creates the distinct embryonic cells. The zygote itself isn't a person – it's the point of origin for *two* distinct biological trajectories. When the zygote splits, it creates two unique entities with numerically different cellular origins. *Your* origin isn't just the sperm and egg meeting, but the specific cellular lineage beginning with that *first unique daughter cell* formed at splitting. You *are* that particular biological path instantiated at that first cleavage. The other twin originates from a *different* daughter cell, created moments later. So, no: you couldn't have been the other twin. You are necessarily the product of your specific, unique cellular origin point within the initial division event. The "same sperm and egg" start the process, but the divergence creates two discrete, essential origins for two distinct individuals. Your identity is tied to the exact biological sequence initiated by your first unique cell. Concede that?
