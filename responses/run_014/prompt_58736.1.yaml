  ### Vault Bet Game: Constructive vs. Nonconstructive Proofs  
  **Objective**: Students experience the practical limitations of nonconstructive proofs by confronting a scenario where knowing *that* a winning vault exists (via classical reasoning) is insufficient for guaranteed success, while possessing an explicit witness (constructive proof) enables effective action.  

  ---

  ### **Preparation** (10 minutes)  
  - **Materials**:  
    - **Index cards**: 1 per team per round (for decisions), plus witness cards for Round 2.  
    - **Tokens**: 3 tokens per team (e.g., poker chips; 1 token = 1 point).  
    - **Whiteboard**: Track team tokens and vault outcomes.  
    - **Coin**: To randomly assign winnable vaults.  
  - **Setup**:  
    - Divide students into 6 teams (3–4 students each).  
    - Give each team 1 token to start.  
    - Prepare two "vaults" (labeled A and B) as abstract concepts (no physical setup).  
  - **Key Rules Briefing**:  
    - "There are two vaults. Exactly one is *winnable* (opening it yields rewards), the other is *unwinnable* (opening it loses your stake)."  
    - "Classical math proves *at least one vault is winnable*, but doesn’t reveal which."  
    - "Teams stake tokens to open a vault or pass. Goal: Maximize tokens."  

  ---

  ### **Game Rounds** (50 minutes total)  
  #### **Round 1: Nonconstructive Setting** (20 minutes)  
  **Premise**: Teams know the classical proof ("exactly one vault is winnable") but lack a witness.  
  - **Facilitator Steps**:  
    1. Flip a coin: Heads → Vault A winnable, Tails → Vault B winnable (record secretly).  
    2. Teams discuss and choose one action (write on index card):  
       - **Open A**: Stake 1 token.  
       - **Open B**: Stake 1 token.  
       - **Pass**: Keep token, no action.  
    3. Collect cards. Reveal the winnable vault (e.g., "Vault A is winnable!").  
    4. **Resolve payoffs**:  
       - Open winnable vault: Gain 3 tokens (net +2: −1 stake +3 reward).  
       - Open unwinnable vault: Lose staked token (net −1).  
       - Pass: Keep 1 token (net 0).  
    5. Update whiteboard with team tokens.  

  **Intended Tension**:  
  - Without a witness, teams must guess. Expected value = 0.5 (if 50% chance), but outcomes vary:  
    - Correct guess: 3 tokens.  
    - Wrong guess: 0 tokens.  
    - Pass: 1 token (safe but no gain).  
  - Classical proof guarantees a winnable vault *exists* but offers no way to *identify* it.  

  ---

  #### **Round 2: Constructive Setting** (20 minutes)  
  **Premise**: Teams receive a witness (explicit knowledge of the winnable vault).  
  - **Facilitator Steps**:  
    1. Flip coin again (new random winnable vault).  
    2. Give each team a witness card (e.g., "Vault B is winnable").  
    3. Teams discuss and choose: Open A, Open B, or Pass (write on card).  
    4. Collect cards. Reveal winnable vault (confirming witness).  
    5. **Resolve payoffs** (same as Round 1).  
    6. Update tokens.  

  **Intended Contrast**:  
  - Teams with witness open the correct vault, gain 3 tokens (net +2).  
  - Passing or opening blindly is irrational (but possible; mistakes highlight value of witness).  

  ---

  ### **Debrief** (15 minutes)  
  **Guided Discussion (Avoid Jargon Initially)**:  
  1. **Experience Reflection** (5 min):  
     - "In Round 1, could you guarantee ending with >1 token? Why or why not?"  
       - *Key takeaway*: Classical proof didn’t let teams *act* reliably—some lost tokens.  
     - "In Round 2, could you guarantee a profit? How?"  
       - *Key takeaway*: Witness enabled guaranteed success.  
     - "When would you refuse to stake tokens on existence claims?"  

  2. **Introduce Constructivist Concepts** (5 min):  
     - **Truth as constructibility**: "A proof of existence isn’t ‘true’ unless it *builds* the object (like the witness)."  
     - **Witnesses for existence**: "Round 1 had existence without a witness → useless for action. Round 2 had both."  
     - **Disjunctions require choice**: "The proof said ‘A or B is winnable’—but to *use* it, you need to pick *which one*."  
     - **Rejecting undecided statements**: "Classical math assumes every vault is ‘winnable or not’ even if unknowable. Constructivism rejects this for open-ended domains."  

  3. **Map to Formal Terms** (5 min):  
     - "What you called a ‘witness’ is the *evidence* in the BHK interpretation."  
     - "The ‘classical proof’ used excluded middle (either Case X or not). Constructivists demand a *decision procedure*."  
     - "In the irrational exponent proof, we know *some* pair (a,b) works but can’t *construct* it. That’s nonconstructive."  

  ---

  ### **Implementation Risks & Mitigations**  
  1. **Misunderstanding Payoffs**:  
     - **Risk**: Students think opening blindly is optimal (e.g., "50% chance is better than passing!").  
     - **Mitigation**: Emphasize *guaranteed outcomes* in debrief: "Could you *ensure* you didn’t go bankrupt?"  

  2. **Coordinating Around Tension**:  
     - **Risk**: Teams copy others ("Team 3 opened A, so we will too") or assume symmetry.  
     - **Mitigation**:  
       - Secret ballot (decisions on private cards).  
       - Stress independence: "No communication between teams."  
       - Use random vault assignment to break symmetry.  

  3. **Reintroducing Classical Assumptions**:  
     - **Risk**: "We know one is winnable, so we’ll just pick randomly—it’s fine!"  
     - **Mitigation**:  
       - Contrast Round 1 (no guarantee) vs. Round 2 (guarantee).  
       - Ask: "Does ‘existence’ alone protect you from losing tokens?"  

  4. **Time Management**:  
     - **Risk**: Discussions run long.  
     - **Mitigation**:  
       - Strict 5-minute discussion per round.  
       - Use countdown timer.  

  ---

  ### **Candid Limitation Note**  
  **What the Activity Distorts/Misses**:  
  This exercise simplifies intuitionistic logic by:  
  1. **Finitism**: Vaults are finite and decidable (we *could* check both). Real intuitionism rejects excluded middle for *infinite domains* (e.g., real numbers), where exhaustive checking is impossible.  
  2. **Pragmatic Focus**: It equates "utility" with truth, but constructivism is about *proof semantics*, not just practicality.  

  **Supplement in Debrief**:  
  - "In infinite domains (like real numbers), we can’t assume every statement is true or false without evidence. The irrational exponent proof uses excluded middle on an undecided statement (is \(\sqrt{2}^{\sqrt{2}}\) rational?), which constructivists reject."  

  ---

  ### **Minute-by-Minute Timeline**  
  - **0:00–0:10**: Intro, team formation, rules.  
  - **0:10–0:30**: **Round 1** (setup: 2 min, discussion: 5 min, reveal/payoffs: 3 min).  
  - **0:30–0:50**: **Round 2** (setup: 2 min, discussion: 5 min, reveal/payoffs: 3 min).  
  - **0:50–1:05**: **Debrief** (reflection: 5 min, concepts: 5 min, formal terms: 5 min).  
  - **1:05–1:15**: Q&A and transition to next topic.  

  This design ensures students viscerally grasp why constructive proofs matter before labeling the philosophy. The Vault Bet becomes a reusable metaphor for existence proofs in future lectures.
