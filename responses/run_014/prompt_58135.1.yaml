answer: |-
  ## Practice Essay Question (45 minutes)

  **Case:** St Edmund's College Art Club sculpts a life-size horse statue, 'Bucephalus', from a single homogeneous batch of clay (Lump Alpha). Over ten years, weather damage necessitates replacing fragments of clay bit by bit. The removed original fragments are meticulously collected and stored in a labelled jar. Eventually, *none* of Lump Alpha remains in the horse-shaped object standing in the quad. The collected fragments are later compressed under high pressure into a plain, dense block (Block Beta).

  **Question:** Using this case, explain how a pluralist (coincident-objects theorist) would employ Leibniz's Law to argue that the original statue (Bucephalus) and the original lump of clay (Lump Alpha) must be distinct entities. Critically evaluate the monist's reply that modal properties (like survival under squashing) and persistence conditions are sensitive to the *sortal* concept under which an object is considered. Finally, for *both* the monist and pluralist views, state which claimant (if any) – the current horse-shaped object in the quad or Block Beta – is best identified as (i) the original statue (Bucephalus) and (ii) the original lump of clay (Lump Alpha), justifying your answers. *(Time Guideline: 45 mins)*

  ---

  ## Model Answer (Approx. 500 words)

  The St Edmund's case presents a complex scenario of gradual material replacement and reassembly, challenging our intuitions about persistence and identity. Pluralists (endorsing coincident objects) would argue Lump Alpha (the original clay) and Bucephalus (the original statue) were distinct entities coinciding at creation, despite sharing all matter. They employ Leibniz's Law (Indiscernibility of Identicals): if X and Y are identical, they must share all properties. Crucially, they possess different *modal* properties concerning survival under compression ("squashing"). Lump Alpha, *qua* lump of clay, has the essential capacity to survive being flattened into a dense block – its identity isn't tied to shape. Block Beta seems to realise this capacity; it *is* Lump Alpha flattened. Conversely, Bucephalus, *qua* statue, is essentially shaped; squashing it destroys it. The horse-shaped object in the quad now contains none of Lump Alpha's matter and would similarly be destroyed by flattening. Since Lump Alpha survives squashing (as Block Beta) while Bucephalus does not (and neither does the current horse), pluralists conclude they cannot be identical. Material constitution without identity explains their initial coincidence and subsequent divergence.

  Monists (often favouring a dominant sortal or constitution-without-identity view) reject this pluralism. Their key reply is that modal properties and persistence conditions are not absolute but *sortal-relative*. An object doesn't have essential properties *simpliciter*; it has them *under a sortal description*. Considered *as a lump of clay*, Lump Alpha/Bucephalus at t0 has the property: *can-survive-flattening-when-considered-as-clump*. Considered *as a statue*, that same entity has the property: *cannot-survive-flattening-when-considered-as-statue*. Leibniz's Law isn't violated because the properties are relativised to the sortal. The same entity possesses both modal profiles relative to different conceptualisations. Monists thus avoid multiplying entities; there was only one entity throughout, described differently.

  **Evaluating the monist reply:** While elegantly avoiding ontological proliferation, monism faces challenges. Firstly, it struggles to explain *why* the persistence conditions differ under different sortals – what grounds the sortal-sensitivity? Secondly, it must explain our strong intuition that Lump Alpha genuinely *persists* as Block Beta, while Bucephalus does *not* persist as Block Beta. Saying it's the same entity "considered as a lump" feels like a verbal trick masking the genuine difference in persistence history. Thirdly, monism risks making identity overly dependent on human conceptualisation rather than mind-independent facts.

  **Identifying Claimants:**
  *   **Pluralist View:**
      *   (i) **Original Statue (Bucephalus):** Neither claimant. Bucephalus ceased to exist when its original form was sufficiently compromised or when the last fragment of Lump Alpha was removed (depending on the pluralist's persistence criteria for artefacts). The horse-shaped object is a distinct, later statue.
      *   (ii) **Original Lump (Lump Alpha):** **Block Beta**. Lump Alpha persisted through the disassembly and reassembly (compression), retaining its matter and identity as a quantity of clay. The horse-shaped object contains entirely new clay.
  *   **Monist View (e.g., Constitution View):**
      *   (i) **Original Statue (Bucephalus):** **Neither claimant definitively.** The original entity ceased to be a statue when it lost its original form and artist's intention connection. The horse-shaped object is a *new* statue constituted by new clay.
      *   (ii) **Original Lump (Lump Alpha):** **Block Beta.** Considered *as a lump/clay quantity*, the original entity persisted through the scattering and was reassembled (compressed) into Block Beta. The matter constituting the horse-shaped object is distinct. (Some monists might say the original lump *also* constitutes the current horse, but this is less plausible given the total matter replacement).

  ---

  ## Marking Scheme (Total: 20 Marks)

  *   **Explanation of Pluralist Leibniz's Law Argument (5 marks):**
      *   4-5: Clear, accurate explanation using the case (squashing Block Beta vs. horse-shaped object), correctly identifying differing modal properties (survival/destruction under compression) as the basis for non-identity using LL. Explicitly links Block Beta to Lump Alpha's survival.
      *   2-3: Explains LL argument but may be vague on properties applied to the case, or unclear link between Block Beta and Lump Alpha's survival. Some reliance on standard statue/clay.
      *   0-1: Inaccurate or missing explanation of LL argument in this context.

  *   **Critical Evaluation of Monist Reply (Sortal Sensitivity) (7 marks):**
      *   6-7: **First-Class:** Clear, accurate explanation of monist sortal-relativity for modal properties/persistence. **Crucially offers a *substantive critical evaluation*:** Identifies at least TWO significant challenges (e.g., grounding sortal differences, explaining strong persistence intuitions for the lump vs. statue, risk of excessive conceptual relativism, problem of temporary sortals). Evaluation is well-integrated and uses the case.
      *   4-5: **Upper Second:** Clear, accurate explanation of monist sortal-relativity. Evaluation is present but may be **less developed or identify only ONE significant challenge clearly**, or be somewhat superficial/detached from the case. Mentions problems but lacks depth in explaining *why* they are problematic for monism.
      *   2-3: Explains monist reply but evaluation is weak, missing, or consists of simple assertion/agreement without critical analysis. May confuse views.
      *   0-1: Inaccurate or missing explanation/evaluation of monist reply.

  *   **Identification & Justification of Claimants for Each View (6 marks - 1.5 per identification/justification pair):**
      *   **Pluralist:**
          *   Statue: Correctly identifies *neither* and provides justification based on artefact persistence (form/matter link loss).
          *   Lump: Correctly identifies *Block Beta* and provides justification based on matter persistence/reassembly.
      *   **Monist:**
          *   Statue: Correctly identifies *neither* (or plausibly *current horse* with caveats, but 'neither' is safer) and provides justification based on ceasing to fall under 'statue' sortal.
          *   Lump: Correctly identifies *Block Beta* and provides justification based on persistence under 'lump/clay' sortal via reassembly.
      *   *(Marks awarded per correct identification + plausible justification linked to the stated view. Partial credit for one element.)*

  *   **Clarity, Structure, and Use of Case (2 marks):**
      *   2: Well-structured, clear, concise argument. Case used effectively throughout as an example.
      *   1: Generally clear but structure could be improved, or case use is somewhat superficial/limited.
      *   0: Unclear, poorly structured, or fails to use the case.

  **What Separates First-Class (16-20) from Upper-Second (12-15) Answers:**
  *   **First-Class:** **Must** demonstrate a **sophisticated critical evaluation of monism** in section 2. This means going beyond merely *stating* the sortal-sensitivity reply to **clearly identifying and explaining at least two distinct, significant philosophical challenges it faces** (e.g., grounding problem, clash with persistence intuitions, conceptual relativism worry), using the case where appropriate. Evaluations are insightful and show independent critical thought. All claimant identifications are precise and justifications are robust and clearly tied to the core tenets of each view.
  *   **Upper-Second:** Provides a **competent explanation of the monist reply** and **identifies at least one challenge**, but the evaluation may be **less developed, less precise, or cover only one challenge in depth**. For example, it might state "monism has problems with intuition" without fully unpacking *why* that's a serious philosophical problem, or only explore one challenge thoroughly. Claimant identifications and justifications are generally correct but might lack some precision or depth in linking directly to the view's core principles. Answers are clear and well-structured but may lack the critical depth and nuance of first-class responses.
