  The core tension is whether "I think" proves a substantive self or just grammatical necessity. Their fight with a friend about split-brain patients shows they want real-world applicability, not just theoretical purity. 

  Hmm, the requirements should cover: what the cogito proves (existence? thinking? both?), what it can't assume (no circular logic), and what conclusions it must permit/block (e.g., can't allow solipsism). Also must flag which rules are universal vs. camp-specific. 

  For the split-brain question: it's a valid stress test but shouldn't be mandatory – Descartes wasn't considering neuroscience. Still, a strong account shouldn't crumble under it. 

  Key is identifying incompatible requirements up front. Like, if you insist the "I" must be indivisible (R5) AND that the cogito must work for ambiguous cases (R6), you get contradiction. That's probably their "actually care about" insight. 

  Gotta keep it practical: no jargon, no reading lists, just sharp criteria to end their month-long stalemate. American English, blunt phrasing. "Grammar-camp" vs. "Self-camp" labels will help them map their debate.
answer: |-
  Here’s a sharp set of requirements for any account of what Descartes’ *cogito* ("I think, therefore I am") **actually proves**, designed to cut through the noise and settle your debate. Requirements are split into **universal** (all serious interpretations must meet these) and **camp-specific** (needed by "Grammar-Camp" or "Self-Camp"). Incompatibilities are flagged at the end.

  ---

  ### **Universal Requirements (All Accounts MUST Meet These)**
  *Failure here means the account misrepresents Descartes or logic.*

  1.  **Prove *Existence*:** Must establish *that* existence occurs/is happening.
      *   **Why?** Descartes’ core goal was to find an indubitable foundation. "I am" establishes *something exists* (even if only the thinking itself). If an account doesn’t deliver *existence*, it fails the *cogito*'s primary purpose.
  2.  **Prove *Thinking*:** Must establish *that* thinking is occurring.
      *   **Why?** "I think" is the undeniable starting point. Doubting *is* thinking. An account denying thinking occurs contradicts the very act of performing the *cogito*.
  3.  **Immunity to the Evil Demon/Dreaming Doubt:** Must remain true even if an all-powerful deceiver is controlling *all* sensory input and memories, or if you are dreaming.
      *   **Why?** This is the *context* of the *cogito*. It's the doubt the *cogito* overcomes. If an account relies on anything vulnerable to this doubt (e.g., memory, external world, complex self-concepts), it fails.
  4.  **Non-Circularity:** Cannot presuppose the existence of a substantial "I" *before* establishing "I am" through the *cogito*.
      *   **Why?** Descartes explicitly uses the *cogito* to *first* establish existence. If the "I" doing the thinking is assumed to be a full person/soul *beforehand*, the argument begs the question. The "I" must be derived *from* the thinking.
  5.  **Block Solipsism of the Present Moment (But Allow It Temporally):** Must *not* prove the existence of anything *other than* the thinking occurring *right now*. However, it *can* (and arguably should) leave open the possibility that only *this present moment* of thought exists.
      *   **Why?** The *cogito* is about the *immediate* act of thinking/doubting. It doesn't prove a past self, a future self, other minds, or the external world. An account claiming it proves more than *current thought/existence* oversteps. But it *cannot* undermine the reality of the *current* thought/existence.

  ---

  ### **Camp-Specific Requirements**
  *These define the battleground between "Grammar" and "Self" interpretations.*

  **Grammar-Camp Requirements (Minimalist/"I" as Grammar):**
  *   **GC1: The "I" Must Be Logically Minimal:** The word "I" should be justified *only* as the grammatical subject required by the structure of the thought "thinking is happening." It signifies the *location* or *occurrence* of thought, not necessarily a substantial *thing* or *owner*.
      *   **Why?** This camp argues Descartes only *discovers* thought and infers existence *from* it; the "I" is a linguistic placeholder. If the account *requires* a pre-existing substantial "I" owner, it fails minimalism.
  *   **GC2: Block Substantial Self-Concepts:** Must *not* prove the existence of a persisting self, a soul, a mind as a "thing," or personal identity over time based *solely* on the *cogito*.
      *   **Why?** This camp sees the *cogito* as purely epistemic (about knowledge), not metaphysical (about what things are). Proving a substantial self requires later arguments (like the *Wax Argument*). Relying on the *cogito* alone for this overstates its power.

  **Self-Camp Requirements (Substantial/"I" as Agent/Owner):**
  *   **SC1: Prove an "I" as Thinker/Owner:** Must establish not just that thinking occurs, but that there is *something* (an "I") that *does* the thinking or *to whom* the thinking belongs.
      *   **Why?** This camp argues thought inherently implies a thinker. "Thinking is happening" is incomplete without an answer to "Thinking is happening *to what/whom?*" The "I" is the necessary subject *of* the existence proven.
  *   **SC2: Establish Primitive Self-Awareness:** Must show that the *cogito* reveals a fundamental, non-inferential awareness of *oneself* as the thinking thing.
      *   **Why?** For this camp, Descartes isn't making an *inference* ("Thought exists, therefore an I exists"), but having a direct intuition ("*I* am thinking" is the primary, undeniable datum). The "I" is experientially present in the act.

  ---

  ### **Incompatible Requirements & Your Core Conflict**
  *   **The Heart of Your Fight:** Your debate ("is it just thinking happening or a someone doing it?") centers on **GC1/GC2 vs. SC1/SC2**.
  *   **Key Incompatibility:** **GC1 (Minimal "I")** and **SC1 (Thinker/Owner)** are mutually exclusive within the *cogito alone*. You cannot simultaneously demand the "I" be *only* grammatical necessity **and** that it proves a thinker/owner.
      *   **Consequence:** Any account satisfying SC1 will violate GC1/GC2. Any account satisfying GC1/GC2 will violate SC1. This is the fundamental split. Your summary *must* highlight this.

  ---

  ### **The Split-Brain Patient Test: Requirement or Gotcha?**
  *   **Answer: Valid Stress Test, Not a Universal Requirement.** Here's why:
      *   **Not Universal:** Descartes wasn't considering 20th-century neuroscience. Judging his *cogito* solely by this edge case is unfair historical revisionism. A core account can be valid without addressing it.
      *   **BUT - A Strong Test for SC1:** It's **highly relevant to the Self-Camp's SC1**. If the *cogito* proves a *unified*, *substantial* "I" as the thinker/owner (SC1), split-brain cases (where a single body exhibits two seemingly independent streams of thought/awareness) pose a serious challenge. How many "I"s are there? Does each stream independently perform the *cogito*? A Self-Camp account *needs* a coherent response here to maintain SC1 robustly. It exposes potential overreach.
      *   **Less Problematic for Grammar-Camp:** The Grammar-Camp can more easily say: "Thinking is occurring here (in this brain/body), requiring the grammatical 'I' for expression. The *cogito* doesn't tell us *how* unified or simple the underlying thinker is, only that thought/existence is present." It challenges GC2 less directly.
      *   **Conclusion:** You can't *demand* every account resolve split-brain cases upfront. **However, a strong Self-Camp account *should* be able to engage with it without collapsing.** It's a powerful tool to probe the *limits* of SC1 claims derived *solely* from the *cogito*.

  ---

  **Summary for Your Club Debate:**
  *   **Universal:** All accounts must prove *current existence* and *current thinking*, be immune to radical doubt, be non-circular, and only guarantee the present moment of thought/existence.
  *   **The Split:** The core disagreement is whether the *cogito* alone proves a minimal, grammatical "I" (Grammar-Camp needs GC1/GC2) or a substantial thinker/owner (Self-Camp needs SC1/SC2). **GC1 and SC1 are fundamentally incompatible.**
  *   **Split-Brain:** Not a knockout punch, but a serious challenge specifically for the Self-Camp's claim (SC1) that the *cogito* *proves* a unified thinker/owner. It highlights the risk of overstepping GC2.

  Use these requirements to dissect each take: Does it meet the Universals? Which camp's specifics does it try (and fail/succeed) to meet? Does it recognize the GC1/SC1 incompatibility? This framework exposes the genuine fault lines. Good luck with the summary!
