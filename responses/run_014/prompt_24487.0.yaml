  - **EvSC** defines a species as a lineage evolving separately from others, emphasizing evolutionary independence.  

  **Why these concepts?**  
  - **Case 1 (songbirds)**: Two monophyletic clades with unique diagnostic characters → split (consistent with PSC and EvSC).  
  - **Case 2 (fish)**: Single panmictic population with no clade structure → lump (PSC: no monophyly; EvSC: no separate lineage due to gene flow).  
  - **Case 3 (marine invertebrates)**: Two monophyletic clades despite no morphological differences → split (PSC: monophyly + diagnostic characters; EvSC: separate lineages).  

  **Concepts ruled out**:  
  - **Biological Species Concept (BSC)**: Ruled out by Case 3, as BSC requires reproductive isolation (or potential for it), but Case 3 had no test of reproductive compatibility in sympatry. The split was based solely on monophyly.  
  - **Morphological Species Concept (MSC)**: Ruled out by Case 3, as morphology was identical but they were split.  
  - **Ecological Species Concept (ESC)**: Inconsistent with Case 2, where ecological differences (tannin-stained vs. clear water) existed but gene flow led to lumping. ESC would have split them based on niche differences.  

  ### (b) Predictions for the lizard case under surviving concepts
  - **PSC**: Two species. The lizards form two well-supported monophyletic clades with unique diagnostic characters (fixed differences), fulfilling PSC criteria regardless of hybridization.  
  - **EvSC**: Two species. The limited admixture indicates the lineages maintain evolutionary independence (no fusion into a single lineage), and monophyly confirms separate evolutionary trajectories.  

  Both concepts predict **two species** for the lizards.

  ### (c) Predicted verdict and reasons
  **Verdict**: Two species.  

  **Reasons for preferring this over one species**:  
  1. **Monophyly and diagnostic characters**: Like Cases 1 and 3, the lizards show two well-supported monophyletic clades with unique diagnostic characters. This is the strongest factor in the track record for splitting.  
  2. **Limited admixture**: Unlike Case 2 (panmixia → lump), hybridization is confined to a narrow zone with limited gene flow, suggesting the populations retain distinct evolutionary identities. The clades remain discernible despite contact, indicating no lineage fusion.  
  3. **Precedent for ignoring hybridization**: Case 3 split lineages despite no reproductive isolation test; similarly, viable/fertile hybrids here don’t override monophyly. Morphological and microhabitat differences further support divergence.  

  **Why not one species?**  
  - Interbreeding and hybrid viability might suggest BSC-style lumping, but BSC is ruled out by the track record. Case 2’s panmixia is absent here, so gene flow isn’t extensive enough to erase lineage boundaries.  

  ### (d) Divergent case to identify the concept
  **Proposed case**: Two allopatric populations of frogs.  
  - **Evidence**: Morphologically identical, identical ecological niches (e.g., both in identical forest ponds), no gene flow, and a phylogenetic analysis showing two well-supported monophyletic clades with fixed genetic differences.  
  - **Divergence**:  
    - **PSC**: Would split into two species (monophyly + fixed characters).  
    - **EvSC**: Would split (separate lineages).  
    - **ESC**: Would lump into one species (no ecological divergence).  
  - **Why it tests the concepts**: The track record lacks a case without ecological/morphological divergence. If the working group splits these frogs, they prioritize monophyly alone (confirming PSC/EvSC). If they lump, ecological factors are decisive (leaning toward ESC-influenced EvSC). This clarifies whether niche differentiation is required.  

  **Summary**: The track record points to a monophyly-based concept (PSC/EvSC) overriding gene flow and morphology. For the lizards, expect a split due to strong phylogenetic divergence and limited admixture. The frog case would test if ecological identity is a hidden factor.
