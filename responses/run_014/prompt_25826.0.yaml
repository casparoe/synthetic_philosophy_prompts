prompt: |-
  My co-op is trying to pick which of three contractors to hire for a renovation, and we're voting by ranked choice. I'm noticing people are already gaming it — a couple folks are putting their second-favorite first because they think their real favorite is a long shot and they're terrified of the guy they hate getting it. I got frustrated and said we should just use a different voting system where no one has an incentive to lie about their preferences. My housemate (math PhD, insufferable about it) smirked and said "that's literally impossible, there's a theorem." Is he right? Like, is there genuinely no voting method for three or more options where your best strategy is always to vote honestly? Give me the bottom line in one paragraph, and if there's a theorem I should know the name of, tell me.
reasoning: |-
  Okay, the user is dealing with a co-op renovation vote where people are strategically misranking their preferences in a ranked-choice system. They're frustrated and want a voting method where honesty is always the best strategy. Their housemate, a math PhD, claims that's impossible due to a theorem. I need to confirm if this is true and explain it simply.

  First, I recall Arrow's Impossibility Theorem, which applies to social choice theory. It states that no voting system can meet all desirable criteria when there are three or more options. The criteria include non-dictatorship, universal admissibility, Pareto efficiency, and independence of irrelevant alternatives. The theorem proves that it's impossible to satisfy all these simultaneously.

  But the user's main concern is about strategic voting, which relates more to the Gibbard-Satterthwaite Theorem. This theorem specifically addresses strategic voting. It says that any voting system with three or more choices that's deterministic and not dictatorial will incentivize some voters to lie about their preferences to get a better outcome. That means there's always a scenario where someone can game the system by not voting honestly.

  The user wants a straightforward answer. They're probably not looking for a deep dive into math but need to understand why their housemate is correct. They might also want to know if there's any practical solution, even if theoretical perfection is impossible. Mentioning that no system is "strategy-proof" for three or more options is key here.

  I should explain why their current ranked-choice system is vulnerable. People putting their second favorite first because they fear the worst outcome is a classic example of strategic voting, which the theorem predicts. Even if they switch to another method, the same problem could arise in different forms.

  I need to keep the explanation concise as requested—one paragraph summarizing the bottom line. Include the theorem's name so they can reference it. Also, acknowledge their frustration to show empathy. They might feel discouraged knowing no perfect system exists, but it's important to present the facts clearly without giving false hope.

  Finally, wrap it up by confirming the housemate is right, name the theorem, and explain its implication in simple terms. Make sure the user understands that while no system is perfect, being aware of this limitation can help in designing better, albeit not flawless, voting processes.
answer: |-
  Yes, your housemate is correct. **There is no voting system for three or more options where voters *always* have zero incentive to lie about their preferences (strategic voting) and where the system is fair, deterministic, and allows voters to express any possible ranking.** This is a fundamental mathematical result.

  **The bottom line in one paragraph:** For any voting system choosing between three or more alternatives that meets basic fairness requirements (like every possible vote being allowed, no single voter always dictating the winner, and the winner changing if everyone suddenly prefers a different option more), there will *always* be some scenarios where at least one voter can achieve a better outcome for themselves by submitting a dishonest ballot that misrepresents their true preferences, rather than voting honestly. This is unavoidable. Your observation of strategic ranking in your co-op vote is an example of this inherent flaw in *all* such voting systems.

  **The key theorem is the Gibbard-Satterthwaite Theorem.** It proves this specific impossibility regarding strategic voting (strategy-proofness). Arrow's Impossibility Theorem (which your housemate might have been hinting at) is a related and equally profound result about the impossibility of a "perfect" voting system meeting other desirable criteria, but Gibbard-Satterthwaite directly addresses the incentive to lie.

  **In short:** Your frustration is understandable, but your math PhD housemate is right – there's no escape hatch. Strategic voting is a vulnerability baked into any fair democratic process with three or more choices.
