prompt: |-
  hey so I'm a phd student in decision theory and I'm stuck on Good's theroem stuff. everyone keeps saying free info is always worth getting for an expected utility maximizer, but I have this case in mind where you get a free test result before you have to choose, except you know upfront you'll botch the updating and overweight the result when you see it. can you give me a clean argument for why a rational agent who predicts their own failure to conditionalize should refuse the free info, with a tiny toy numerical example where refusing beats taking? keep it to one paragraph, max 200 words please.
reasoning: |-
  We are considering an agent who is an expected utility maximizer but knows that upon receiving information, they will fail to update correctly (i.e., they will overweight the evidence). The question is whether free information can be harmful.

   Setup:
   - There are two states of the world: S1 (with prior P(S1)=p) and S2 (prior P(S2)=1-p).
   - The agent has two available actions: A1 and A2.
   - The utilities depend on the state and action. Without loss of generality, assume:
        If S1: U(A1) = 1, U(A2) = 0.
        If S2: U(A1) = 0, U(A2) = 1.

   - Without any information, the agent chooses the action that maximizes expected utility:
        EU(A1) = p * 1 + (1-p) * 0 = p
        EU(A2) = p * 0 + (1-p) * 1 = 1-p
     So, the agent chooses A1 if p > 0.5, A2 if p < 0.5, and is indifferent if p=0.5.

   - Now, there is a free signal T which can be either "+" or "-". The true conditional probabilities are:
        P(+|S1) = 0.9, P(-|S1)=0.1
        P(+|S2)=0.1, P(-|S2)=0.9

   - However, the agent knows that when they see the signal, they will update incorrectly. Specifically, they will use:
        Upon seeing "+", they update: P(S1|+) = 0.99 (overweighting the evidence) instead of the correct 0.9 (if p=0.5) or the proper Bayesian update.
        Similarly, upon seeing "-", they update: P(S1|-) = 0.01.

   - We need to compute the expected utility of taking the test and then choosing based on the flawed update, and compare it to the expected utility of not taking the test.

   Example with p=0.5:

   Without test: 
     EU(no test) = max(0.5, 0.5) = 0.5.

   With test (with flawed updating):
     With probability P(+) = P(+|S1)*P(S1) + P(+|S2)*P(S2) = 0.9*0.5 + 0.1*0.5 = 0.5.
     With probability P(-) = 0.5.

     If they see "+", they believe P(S1|+) = 0.99, so they choose A1 (since 0.99>0.01) and get:
          If S1: 1, but with actual P(S1|+) = [by Bayes] (0.9*0.5)/0.5 = 0.9 -> so in reality, when "+" occurs, S1 happens 90% of the time and S2 10%.
          So the expected utility given "+" when they choose A1 is: 0.9*1 + 0.1*0 = 0.9.

     Similarly, if they see "-", they believe P(S1|-) = 0.01, so they choose A2. 
          Actual P(S1|-) = [0.1*0.5]/0.5 = 0.1 -> so they choose A2 which gives: 0.1*0 + 0.9*1 = 0.9.

     Therefore, the overall expected utility with the test (and flawed updating) is:
          P(+)*0.9 + P(-)*0.9 = 0.5*0.9 + 0.5*0.9 = 0.9.

     But wait, 0.9 > 0.5, so it seems beneficial? 

   However, note that the above flawed update actually led to a better outcome? That's because the agent's flawed update was more extreme than the true update, but in this symmetric case with p=0.5, it actually led to a higher chance of choosing the correct action. We need a case where the flawed update leads to a worse outcome.

   Let me adjust: make the prior p=0.8 (so without test, the agent chooses A1 and gets 0.8).

   Without test: EU = 0.8.

   Now, with the test (with the same signal structure):

     P(+) = P(+|S1)*0.8 + P(+|S2)*0.2 = 0.9*0.8 + 0.1*0.2 = 0.72 + 0.02 = 0.74.
     P(-) = 1-0.74=0.26.

     Correct Bayesian update:
          P(S1|+) = (0.9*0.8)/0.74 = 0.72/0.74 ≈ 0.973
          P(S1|-) = (0.1*0.8)/0.26 = 0.08/0.26 ≈ 0.3077

     But the agent uses flawed update: 
          If they see "+", they set P(S1|+)=0.99 -> choose A1.
          If they see "-", they set P(S1|-)=0.01 -> choose A2.

     Now, let's compute the actual expected utility when they choose:

          In the case of "+": 
            They choose A1. The actual distribution given "+": S1 with prob 0.973, S2 with 0.027 -> EU = 0.973.

          In the case of "-":
            They choose A2. The actual distribution given "-": S1 with prob 0.3077, S2 with 0.6923 -> 
            Choosing A2: if S1, get 0; if S2, get 1 -> EU = 0.6923.

          Therefore, overall EU with test = P(+) * 0.973 + P(-) * 0.6923 = 0.74*0.973 + 0.26*0.6923 ≈ 0.72 + 0.18 = 0.90.

     But 0.90 > 0.8? Still better.

   Why? Because even though they update incorrectly, the test is still informative. We need a case where the flawed update leads to a worse decision than without the test.

   Let me try a different flaw: suppose the agent underweights the evidence. For example, upon seeing "+", they set P(S1|+) = 0.6 (instead of ~0.973) and upon seeing "-", they set P(S1|-) = 0.4 (instead of ~0.3077). 

   Now, with p=0.8:

     Without test: EU=0.8.

     With test:
          If they see "+", they set P(S1|+)=0.6 -> they choose A1 (since 0.6>0.4, but note: if they are comparing EU(A1)=0.6 and EU(A2)=0.4, they choose A1). 
            But the actual P(S1|+) is 0.973 -> so by choosing A1 they get 0.973.

          If they see "-", they set P(S1|-)=0.4 -> they choose A1? Because 0.4>0? Actually, note: EU(A1) in their mind is 0.4, and EU(A2) is 0.6? Wait, no: in state S1, A1 gives 1 and A2 gives 0; in state S2, A1 gives 0 and A2 gives 1. So if they believe P(S1|-)=0.4, then:
            EU(A1) = 0.4 * 1 + 0.6 * 0 = 0.4
            EU(A2) = 0.4 * 0 + 0.6 * 1 = 0.6
          So they choose A2.

          Then, in the case of "-", they choose A2. The actual EU given "-" when choosing A2 is 0.6923 (as above).

          So overall EU = 0.74 * 0.973 + 0.26 * 0.6923 ≈ 0.72 + 0.18 = 0.90 -> still better.

   Let me try a more extreme underweighting: upon seeing "+", they set P(S1|+)=0.55, and upon seeing "-", they set P(S1|-)=0.45.

   Then:
          "+": They choose A1 (since 0.55>0.45 -> EU(A1)=0.55, EU(A2)=0.45) -> actual EU: 0.973.
          "-": They set P(S1|-)=0.45 -> then EU(A1)=0.45, EU(A2)=0.55 -> choose A2 -> actual EU: 0.6923.

          Overall EU = 0.74*0.973 + 0.26*0.6923 ≈ 0.90.

   Still 0.90.

   How about making the prior very high? Let p=0.99.

   Without test: EU=0.99.

   With test (using the same signal structure):

     P(+) = 0.9*0.99 + 0.1*0.01 = 0.891 + 0.001 = 0.892.
     P(-) = 0.108.

     Correct update:
          P(S1|+) = (0.9*0.99)/0.892 ≈ 0.999
          P(S1|-) = (0.1*0.99)/0.108 ≈ 0.9167

     Now, if the agent uses flawed update (overweighting: setting to 0.99 for "+" and 0.01 for "-"):

          For "+": they set P(S1|+)=0.99 -> choose A1 -> actual EU given "+" is 0.999.
          For "-": they set P(S1|-)=0.01 -> choose A2 -> but the actual P(S1|-) is 0.9167, so they are wrong 91.67% of the time! 
                  EU given "-" when choosing A2: 0.9167*0 + 0.0833*1 = 0.0833.

          Overall EU with test = 0.892 * 0.999 + 0.108 * 0.0833 ≈ 0.891 + 0.009 = 0.90.

     Without test: 0.99.

     So 0.90 < 0.99 -> this is a case where the test is harmful.

   Therefore, in this example:

     Prior: P(S1)=0.99, P(S2)=0.01.
     Without test: choose A1, get 0.99.

     With test (and flawed update: upon "+" set P(S1)=0.99, upon "-" set P(S1)=0.01):
          P(+) = 0.892, then they choose A1 and get 0.999 -> expected from "+": 0.892*0.999 = 0.891108.
          P(-) = 0.108, then they choose A2 and get 0.0833 -> expected from "-": 0.108 * 0.0833 ≈ 0.009.
          Total expected utility: ~0.900108, which is less than 0.99.

   Thus, the agent should refuse the free information.

   Summary argument:
     A rational agent who predicts they will update incorrectly (overweighting the test result) may find that the cost of making a catastrophic error in the unlikely event of a negative test (which they will overreact to) outweighs the benefit of the test. In the example, the prior is 0.99 in favor of S1, and without the test they choose A1 and get 0.99. But taking the test, they might get a false negative (which occurs with probability 0.108) and then they assign only 0.01 to S1 and choose A2, which yields very low utility (0.0833) because the state is still likely S1. The overall EU becomes about 0.90, which is worse than 0.99.

   Therefore, they refuse the test.
answer: |-
  Consider a binary state: world is either sick (S, prior=0.99) or healthy (H). You choose: treat (T) or no-treat (NT). Utilities: if S and T, get 1; S and NT, get 0; H and T, get 0; H and NT, get 1. Without info, optimal: T (EU=0.99).

  A free test: 90% accurate (P(+|S)=0.9, P(-|H)=0.9). But you predict you'll *overweight* results: upon seeing "+", you'll set P(S|+)=0.99; upon "-", P(S|-)=0.01.

  Calculate EU with test:  
  - P(+) = P(+|S)*0.99 + P(+|H)*0.01 = (0.9*0.99) + (0.1*0.01) = 0.892  
  - P(-) = 1 - 0.892 = 0.108  
  - Given "+", you choose T: actual P(S|+) = (0.9*0.99)/0.892 ≈ 0.999 → EU|+ ≈ 0.999  
  - Given "-", you choose NT (since P(S|-)=0.01): actual P(S|-) = (0.1*0.99)/0.108 ≈ 0.917 → EU|- = P(H|-) ≈ 0.083  
  - Overall EU = [P(+)*EU|+] + [P(-)*EU|-] ≈ (0.892*0.999) + (0.108*0.083) ≈ 0.891 + 0.009 = 0.900  

  0.900 < 0.990 → refusing the test (EU=0.990) beats taking it (EU=0.900). Rationale: Overweighting the rare "-" causes catastrophic misresponse to false negatives, outweighing benefits.
