answer: |-
  Here is a concise decision memo for your board vote, structured as requested:

  **Bottom Line Up Front**  
  I recommend we retain the Harlan Cobb statue in Elm Park but add a ground-level educational panel detailing his complex legacy, including the racial covenants, and commission a companion artwork reflecting community values. This addresses historical harm while preserving the park's character, using existing beautification funds. The total cost is estimated at $15,000-$20,000.

  **What We Are Actually Voting On**  
  We are voting on the future of the Harlan Cobb statue (1979) in Elm Park. Options are:  
  1.  **Leave as-is:** No change, no cost.  
  2.  **Remove to Storage:** Relocate statue to county historical society. Requires board approval, $1,200/year storage fee paid by the association. Statue becomes inaccessible.  
  3.  **Add Context & Companion Piece:** Keep statue. Add permanent ground-level panel explaining Cobb’s role in racial covenants. Commission a new artwork from a local artist to face the statue, symbolizing inclusivity. Uses $15k-$20k from the *already allocated* 2025 Beautification Budget. Proposed by local high school students.

  **The Strongest Case For Leaving It Alone**  
  Removing the statue or adding critical context risks imposing today’s moral judgments ("presentism") on a complex historical figure from a different era. Few individuals from Cobb’s time would meet our current standards in every aspect. The statue currently honors his tangible, positive contribution – donating the land that created this beloved park and library. Altering this space with explicit historical critique could fundamentally change the park’s atmosphere. It’s meant to be a place of play and relaxation for children and families, not a site of historical controversy or guilt. Leaving it alone avoids unnecessary division, cost, and preserves the park’s intended, neutral character as a community gathering space focused on shared enjoyment rather than contested history.

  **The Strongest Case For Doing Something**  
  Ignoring Cobb’s role in enacting racist covenants that actively harmed people and shaped our neighborhood’s exclusionary past is a sanitization of history. He is not a distant figure; his direct actions impacted real families, and old-timers remember this. The current plaque tells an incomplete, misleading story. Doing nothing implicitly endorses that partial narrative. The statue’s presence without context can be offensive or painful. Adding a factual panel and companion piece directly addresses this harm by fostering truth and reconciliation. It transforms passive endorsement into active education, demonstrating our community's commitment to acknowledging its full history and evolving values. The students’ proposal shows this can be done respectfully and creatively, enhancing the park’s role as a space for reflection *and* play, using funds already set aside for park improvement.

  **My Recommendation And Next Steps**  
  I recommend Option 3: Keep the Cobb statue, add a permanent ground-level educational panel detailing his role in racial covenants, and commission a companion artwork from a local artist. This approach:  
  *   **Acknowledges History:** Provides necessary context without erasure.  
  *   **Promotes Healing:** Actively demonstrates community growth.  
  *   **Engages Youth:** Validates the thoughtful proposal from our high schoolers.  
  *   **Controls Cost:** Utilizes the planned 2025 Beautification Budget ($15k-$20k estimate).  
  *   **Preserves Access:** Keeps the statue *and* its full story in the public park.  

  **Next Steps:**  
  1.  **Board Vote:** Approve Option 3 on Tuesday.  
  2.  **Form Subcommittee (by Oct 1):** Chair to appoint 3 board members + 2 high school reps + 1 historical society liaison.  
  3.  **Subcommittee Tasks:**  
      *   Draft precise panel text & artist commission brief by Nov 15.  
      *   Solicit artist proposals by Jan 15, 2025.  
      *   Recommend final artist & panel text to full board by Feb 15.  
  4.  **Implementation:** Target installation of panel & artwork by June 30, 2025.

  **Best Objection To My Recommendation And Why It Does Not Win**  
  **Objection (Steelmanning Dev's View):** This recommendation still injects historical controversy and potential guilt into a park designed for simple recreation. It sets a precedent where we endlessly re-litigate the past, judging figures by ever-changing modern standards, potentially leading to demands to remove or contextualize other monuments. The park should remain a neutral escape, not a classroom for complex historical grievances. The cost, while budgeted, could be used for purely positive enhancements like new playground equipment.  

  **Why It Does Not Win:** While preserving peaceful enjoyment is vital, true neutrality isn't achieved by ignoring documented harm caused by the specific individual honored. The companion piece and panel don't create a "classroom"; they offer accessible context for those who choose to engage, much like existing plaques. The high school proposal shows this can be integrated thoughtfully without dominating the park. Addressing this specific, impactful history proactively is more likely to *prevent* future controversy than fuel it. Using beautification funds for this project *is* enhancing the park's value by making it more truthful and inclusive.
