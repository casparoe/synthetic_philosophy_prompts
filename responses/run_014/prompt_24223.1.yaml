  We are going to design an activity that illustrates Good's theorem: that acquiring more information is never harmful in expectation and can be beneficial. The key points we want to highlight are:
   1. Information is never a net liability in expectation.
   2. The value of information is zero precisely when it cannot change the optimal decision.

   We'll create a simple decision-making game with two choices and a hidden state. The state is drawn from a distribution, and the player must choose an action. The payoff depends on the action and the state.

   We will introduce an option to observe a signal about the state. The signal may be informative or uninformative. We want participants to experience:
     - Situations where the signal is useful and changes the decision for the better.
     - A situation where the signal is worthless (so they see that it doesn't change the decision and hence has zero value).
     - A situation where a particular realization of the signal leads to a worse outcome in that instance, but on average it is beneficial (or at least not harmful).

   We'll use a setup with two states of the world (say, State A and State B) and two possible actions (Action X and Action Y). The payoffs are structured so that:
     - In State A, Action X gives a high payoff and Action Y gives a low payoff.
     - In State B, Action X gives a low payoff and Action Y gives a high payoff.

   The prior probability of the states is known. We'll set up a signal that can be either "hint A" or "hint B". The signal is correlated with the true state.

   We'll run several rounds with different signal qualities, including one where the signal is completely uninformative.

   Structure of the activity:

   1. Introduction (10 minutes)
      - Explain the basic rules and the payoff matrix.
      - Explain that in each round, the world is in one of two states (A or B) and they must choose an action (X or Y).
      - Payoff matrix (for example):
            State A   State B
          X   10       0
          Y    0       10

      - The state is drawn with prior probabilities (we'll start with 50-50).

   2. Round 1: No information (baseline)
      - The state is drawn (say, by a coin flip) but not revealed.
      - Participants choose an action without any information.
      - Outcome is revealed.

   3. Round 2: Free perfect information
      - Now, they are told they can get the true state for free (or at no cost). They get to see the state and then choose the best action.
      - This shows the value of perfect information.

   4. Round 3: Imperfect but informative signal (at a small cost)
      - Introduce a signal that is informative but not perfect. For example, the signal has a 70% chance of being correct and 30% of being wrong.
      - They have the option to pay a small cost (say, 1 point) to see the signal.
      - They then choose an action.
      - We want them to see that sometimes the signal is wrong and they get a bad outcome, but on average they do better than without the signal.

