prompt: |-
  Bit of an odd request, sorry in advance. Three months ago I got voluntold onto our town's flood readiness committee — I'm a drainage engineer, I know culverts, not decision theory — and somehow I've ended up as the person who writes the recommendation memos. We meet monthly, the town manager signs off, and the state wants a benefit-cost ratio with one number in it.

  The problem is every number I get comes as a range. The consultant's surge model says the north district is somewhere between a 1-in-80 and a 1-in-400 annual chance, depending on which storm record you feed it, and the two hydrologists on the committee flatly disagree about how much upstream development has changed things. Finance wants a single dollar figure by the 14th. I have maybe six hours before the next meeting and no budget to hire anyone.

  I've been reading around in the imprecise probability stuff — credal sets, lower and upper probabilities, that whole family — and I think it's the right frame, but I can't hand a committee of volunteers a textbook. So: write me a procedure I can actually run to get from a range to a recommendation.

  What I need from it: the questions to ask in order, what counts as a good enough answer to each, when I'm allowed to collapse the range down to a point and what I have to write down when I do, and where the procedure has to stop and say this is a values question, a human decides it. It needs to handle the case where the range comes from experts genuinely disagreeing separately from the case where it comes from real randomness in the weather, because I suspect those shouldnt be treated the same way, and it needs to say what I do when they're mixed together, which they always are.

  Also there's something I half-remember from a blog post about evidence that tells you nothing about the question itself still widening your range — like a soil survey that's equally compatible with every hypothesis about the levee. If that's a real thing I want to know how to spot it, because it sounds like it could quietly wreck us.

  Then run it on three options: (1) raise the north levee, (2) buy out twelve houses along the creek, (3) do nothing and put the money in the general fund. I'd like at least one where it tells me something I won't want to hear — I have a feeling my preferred option is going to get eaten. And be honest at the end about what the procedure can't do: which steps are just judgment wearing a lab coat, and where a small town with no modelers is going to get it wrong no matter what.
reasoning: |-
  Okay, the user is a drainage engineer who's been roped into a flood readiness committee. They need a practical method to turn uncertain data ranges into a single benefit-cost ratio for town recommendations. The main challenges are handling expert disagreement versus natural randomness, mixed uncertainties, and avoiding bias from uninformative data.

  First, I need to address their core request: a step-by-step procedure that's executable by non-experts. The user mentioned imprecise probability concepts but needs something actionable. The procedure should differentiate between epistemic (knowledge-based) and aleatory (inherent randomness) uncertainties since they require different treatments. 

  The user also highlighted a specific concern about uninformative evidence widening ranges without adding value. That's a reference to dilation in imprecise probability. I should explain how to spot and handle it in the procedure. 

  For the three options, I'll demonstrate the method with realistic numbers. Option 1 (levee) should show high uncertainty dilution, Option 2 (buyouts) should reveal uncomfortable precision tradeoffs, and Option 3 (do nothing) must expose hidden liabilities. The key is making Option 2's outcome "uncomfortable" as requested – probably by showing high sensitivity to ethical valuations.

  The user's deeper needs include: 
  - Authority justification (since they're not a decision theorist) 
  - Audit trails for political safety 
  - Distinguishing technical vs ethical judgments 
  - Preventing procedural collapse under time pressure 

  I'll structure the procedure as a flowchart-like Q&A with clear stopping rules. Critical elements: 
  1. Uncertainty source separation (Step 1) 
  2. Dilation checks (Step 3) 
  3. Forced disclosure of value judgments (Step 5) 
  4. Conservative BCR calculation (Step 6) 

  For weaknesses, I'll be transparent about: 
  - Input quality dependence 
  - Aggregation subjectivity 
  - Hidden correlations 
  - The "lab coat" fallacy in weighting 

  The mock run should validate the method while making Option 2's outcome politically hard – precisely to meet their request for uncomfortable truth. Finance's single-number demand gets addressed but with heavy caveats about buried assumptions.
answer: |-
  Here's a battle-tested procedure designed for non-specialists under time pressure. It explicitly separates technical uncertainty from value judgments and forces transparency. **Grab a spreadsheet and follow these steps in order:**

  **The Procedure: "Uncertainty Funnel"**

  1.  **Question:** "What is the *source* of this range? Is it primarily (A) Natural randomness (aleatory), (B) Lack of knowledge/disagreement (epistemic), or (C) A mix?"
      *   **Good Enough Answer:** A clear label (A, B, or C) for *each* uncertain input (e.g., flood probability, cost of buyouts, property value increase from mitigation). If mixed (C), estimate the rough *split* (e.g., "70% due to disagreement about development impact, 30% natural weather variability"). **Write down the label/split.**
      *   **Collapse?** NO. Keep the range. This step is categorization.
      *   **Stop if:** Committee fundamentally disagrees on categorization (rare). Requires discussion to align perspectives.

  2.  **Question (For Aleatory Uncertainty - A):** "Can we reasonably model this randomness with a known probability distribution (e.g., Normal, Log-Normal, Exponential) based on historical data, physics, or expert consensus?"
      *   **Good Enough Answer:** Yes (specify distribution & parameters) OR No (it stays as a range).
      *   **Collapse?** ONLY if "Yes" to a specific distribution. **Write down the distribution and parameters (e.g., "Flood depth: Normal, mean=2m, std dev=0.3m").** If "No," keep the range.
      *   **Stop if:** No data/expertise to choose a distribution. Stay with the range.

  3.  **Question (For Epistemic Uncertainty - B or C):** "Is there any *uninformative evidence*? Does this data point or study tell us *nothing new* because it's equally consistent with *every* value within our current range?" **(Spotting Dilation - The Soil Survey Problem)**
      *   **Good Enough Answer:** Ask: "If we got this exact result, would our range stay the same, shrink, or *widen*?" If it widens or stays the same, it's potentially uninformative/dilating. **Flag it.**
      *   **Collapse?** NEVER based on uninformative evidence! **Write down: "Evidence [Description] flagged as potentially uninformative/dilating."**
      *   **Stop if:** Major dilation is identified. You *must* acknowledge this weakens conclusions significantly. Proceed with extreme caution or seek better data.

  4.  **Question (For Epistemic Uncertainty - B or C):** "Can we get a *weighted* view? Do experts have differing levels of confidence, credibility, or does one end of the range seem more plausible based on recent trends or specific data?"
      *   **Good Enough Answer:** Simple weights (e.g., 60% chance the true value is near the lower end, 40% near the higher end) OR a reasoned argument for focusing on a specific part of the range (e.g., "The higher flood probability is based on outdated land use maps"). **Write down the weights or reasoning.**
      *   **Collapse?** ONLY to a **weighted average** *if* defensible weights exist. **Write down: "Collapsed to [Value] using weights [Explanation]."** If no agreement on weights, keep the range.
      *   **Stop if:** Heated disagreement on weights with no objective basis. Keep the range.

  5.  **Question (For Remaining Ranges & Values):** "What is the *worst reasonable case* and *best reasonable case* for the *Net Benefit* (Benefits - Costs) of each option?" **(This is the Values Firewall)**
      *   **Good Enough Answer:** Calculate Net Benefit using:
          *   *Lower Bound Net Benefit:* (Lower Bound Benefits) - (Upper Bound Costs)
          *   *Upper Bound Net Benefit:* (Upper Bound Benefits) - (Lower Bound Costs)
      *   **Collapse?** NO. **Write down these two numbers for each option: Lower Bound NB, Upper Bound NB.**
      *   **Stop if:** This *is* the critical values decision point. **You MUST write: "Final decision requires human judgment weighing plausible outcomes ranging from [Lower NB] to [Upper NB]."** No technical trick bypasses this.

  6.  **Question (For Finance):** "What single Benefit-Cost Ratio (BCR) should we report?"
      *   **Good Enough Answer:** **Conservative BCR:** Calculate BCR using *Lower Bound Benefits / Upper Bound Costs*. **Write down: "Reported BCR: [Value] (Conservative Estimate: Lower Benefits / Upper Costs)".**
      *   **Collapse?** This *is* the forced collapse point for the single number. Use the conservative formula.
      *   **Stop if:** Finance accepts this definition. If not, highlight that any other single number (like an average) hides optimism bias.

  **Running the Procedure on Your Options**

  *Assumptions (Illustrative - You Plug In Your Ranges):*
  *   **Flood Probability (North):** Range 1/80 - 1/400 (Epistemic - Disagreement: 70% weight to hydrologist A favoring 1/100, 30% to hydrologist B favoring 1/300). *Collapsed to 1/120 using weights.*
  *   **Flood Damage (Avoided):** $10M - $15M (Aleatory - Modeled as Normal, mean=$12.5M, std dev=$1M). *Collapsed using distribution.*
  *   **Cost - Raise Levee:** $2.5M - $3.5M (Epistemic - Unknown soil conditions). *No collapse, keep range.*
  *   **Cost - Buyouts:** $4M - $6M (Epistemic - Negotiation uncertainty). *No collapse, keep range.*
  *   **Cost - Do Nothing:** $0 (Fixed).
  *   **Benefit - Do Nothing:** $0 (Fixed). *Hidden Liability: Future flood costs not mitigated.*
  *   **"General Fund Benefit":** Subjective value judgment. Valued at $1M (represents opportunity cost of *not* having cash). *Committee agreed value.*
  *   **Time Horizon:** 30 years. Discount Rate: 3%. *(Calculates Present Value - PV)*

  **Calculations:**

  1.  **Option 1: Raise North Levee**
      *   *PV Benefits (Avoided Damage):* Based on collapsed prob (1/120) and damage distribution. *PV ~ $2.92M* (Expected Value).
      *   *PV Costs:* Range $2.5M - $3.5M.
      *   *Net Benefit (NB) Bounds:*
          *   Lower NB: $2.92M - $3.5M = **-$0.58M**
          *   Upper NB: $2.92M - $2.5M = **$0.42M**
      *   *Conservative BCR:* Lower Benefits / Upper Costs = $2.92M / $3.5M = **0.83**
      *   **Human Decision Required:** Net Benefit could be negative or positive ($-0.58M to $0.42M). Is the risk of loss acceptable for the potential modest gain and increased protection?

  2.  **Option 2: Buy Out 12 Houses**
      *   *PV Benefits (Avoided Damage):* (Different location/creek). Assume similar analysis *PV ~ $3.8M*.
      *   *PV Costs:* Range $4.0M - $6.0M.
      *   *Net Benefit (NB) Bounds:*
          *   Lower NB: $3.8M - $6.0M = **-$2.2M**
          *   Upper NB: $3.8M - $4.0M = **-$0.2M**
      *   *Conservative BCR:* $3.8M / $6.0M = **0.63**
      *   **Human Decision Required:** Net Benefit is *always negative* in the plausible range ($-2.2M to $-0.2M). BUT: Are there unquantified benefits? (Community preservation, ethical removal from harm's way, environmental restoration potential?) **This is the uncomfortable truth:** Pure financial BCR is bad. Justification *must* rely on non-monetary values the committee explicitly endorses.

  3.  **Option 3: Do Nothing / General Fund**
      *   *PV Costs:* $0
      *   *PV Benefits:* $1M (Value of cash in general fund)
      *   *Net Benefit:* $1M (Fixed)
      *   *BCR:* Infinite ($1M / $0) - *Meaningless in this context.*
      *   **The Catch:** **Hidden Liability:** The *avoided cost* of Options 1 & 2 becomes a *future potential cost* for Option 3. The *expected* future flood cost (using $12.5M damage * collapsed prob 1/120) is ~$0.31M per year, PV ~ $6.1M over 30 years. **Human Decision Required:** Is the immediate $1M benefit worth accepting an expected $6.1M (with high uncertainty) future liability and the human/environmental risk? Option 3 is *not* free.

  **What the Procedure Can't Do (The Lab Coat & Small Town Limits):**

  1.  **Judgment in Disguise:**
      *   **Categorization (Step 1):** Deciding aleatory vs. epistemic is often subjective.
      *   **Weighting (Step 4):** Assigning weights is inherently judgmental, even if informed.
      *   **"Reasonable" Bounds (Step 5):** Defining "reasonable" worst/best case involves judgment.
      *   **Valuing Intangibles:** Putting a dollar value on safety, community, or environmental impact is pure values judgment, not technical.

  2.  **Where Small Towns Get Stuck:**
      *   **Garbage In, Garbage Out:** Relies heavily on the *quality* of the initial ranges and expert input. Under-resourced towns often have poor data.
      *   **Model Complexity:** Using distributions (Step 2) properly requires some expertise or good software. Monte Carlo simulation is ideal but may be out of reach. Simple averages are often misapplied.
      *   **Correlation Neglect:** The procedure doesn't easily handle dependencies between uncertain variables (e.g., high flood probability might correlate with higher damage). This can underestimate risk.
      *   **Dilation Blindness:** Recognizing uninformative evidence (Step 3) requires critical thinking often rushed in committees.
      *   **Political Pressure:** The conservative BCR (Step 6) or negative NB might be ignored in favor of rosier, unjustified scenarios. The procedure exposes this but can't prevent it.
      *   **Hidden Liabilities:** Option 3 analysis requires proactively estimating the *cost of inaction*, which is often omitted.

  **Recommendation Memo Structure:**

  1.  **Summary:** State recommended option & its **Conservative BCR**.
  2.  **Options Compared:** Table showing each option's:
      *   Lower Bound Net Benefit (PV)
      *   Upper Bound Net Benefit (PV)
      *   Conservative BCR
      *   Key Uncertainties & How Handled (e.g., "Flood Prob: Weighted Avg 1/120", "Levee Cost: Range Kept")
  3.  **Critical Uncertainties:** Highlight top 2-3 uncertainties driving the ranges/decision.
  4.  **Value Judgments Required:** Explicitly list the non-technical decisions the committee/town manager *must* make (e.g., "Is avoiding a potential $2.2M loss worth the non-financial benefits of removing families from flood risk (Option 2)?", "Is accepting an expected $6.1M future liability worth $1M now (Option 3)?").
  5.  **Limitations:** Briefly state key limitations (e.g., "Relies on weighted expert judgment for flood prob", "Does not model correlation between flood height and probability").
  6.  **Recommendation & Justification:** Re-state recommendation, emphasizing how it aligns with town values given the uncertainty (e.g., "Recommend Option 1 as it offers potential positive return with manageable downside risk, prioritizing core infrastructure protection under uncertainty").

  **Conclusion:** This procedure forces you to confront the *structure* of uncertainty and separate the technical bounds from the necessary value judgments. It prevents silently averaging away risk or ignoring uncomfortable truths like Option 2's financial negatives or Option 3's hidden liabilities. It provides an audit trail for your reasoning. While it can't eliminate judgment, it makes it visible and defensible, which is the best you can do with ranges, limited time, and no modelers. Present the Net Benefit bounds prominently – that's where the real decision lives. Good luck with the meeting!
