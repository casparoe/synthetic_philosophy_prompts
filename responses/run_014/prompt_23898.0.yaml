prompt: |-
  Think very carefully before answering, and respond in the style of an expert in formal decision theory. Do not cite sources, authors, or works; reason from the concepts themselves.

  Consider the one-shot acausal extortion scenario discussed in the decision-theory literature: a threatener offers to bring about a bad outcome (e.g., harm to a third party) if and only if it predicts that you will not comply (e.g., will not pay a sum). The bad outcome is not physically caused by your non-compliance; it is the product of the threatener's independent decision, conditioned on its prediction of your decision procedure. Two standard responses are: (1) CDT-style act-reasoning — "I should not comply, because my compliance does not cause the bad outcome to be averted, and complying only rewards the threatener"; and (2) FDT/UDT-style type-reasoning — "I should comply, because being the type that complies makes the threatener predict compliance, which makes the bad outcome not occur."

  In at most 350 words, explain the precise conceptual mechanism by which response (2) is valid in a strictly one-shot setting — that is, how your "type" (your decision procedure) can be outcome-relevant when there is no future episode in which a reputation could matter — and state what this implies about what counts as the relevant "causal" structure in acausal scenarios. Address the apparent paradox directly: if my compliance does not cause the bad outcome to stop, in what sense is compliance the rational act? Close with the strongest objection to response (2) and the standard reply.
