answer: |-
  It's understandable that your mate's argument feels persuasive—it taps into a genuine puzzle in decision theory known as the Pasadena game (indeed, named after a paper by Nover and Hájek). The core issue arises for gambles with infinitely many outcomes where the expected value (EV) converges only conditionally, not absolutely. I'll break this down step by step, addressing your mate's reasoning, clarifying where it goes wrong, and distinguishing settled math from contested decision theory. The short answer is that I reject step (3) of the argument: the EV of this game is not £0.69 (or ln 2); it is *undefined* because the series fails to converge absolutely. This resolves the paradox, but it comes at a cost for how we handle such gambles.

  ### Step-by-Step Rebuttal
  Let's go through your mate's steps, with references to the coin game as described:

  - **(1) Claim: Rational evaluation of a gamble shouldn't depend on enumeration order; it's just bookkeeping.**  
    **Response:** This is partially true but incomplete. For finite gambles (step 2), order doesn't matter because the sum is finite and always absolutely convergent. For infinite gambles, EV is well-defined and order-invariant *only if* the series of absolute values converges (i.e., absolute convergence). If not, the EV depends on the order of summation, and we say the expectation does not exist. This is settled math from real analysis and probability theory. In this game, the absolute series diverges (as shown in step 4), so enumeration order is not "just bookkeeping"—it affects the sum. Thus, (1) must be qualified: for infinite gambles, rational evaluation *can* depend on order if absolute convergence fails, and EV may not be definable at all.

  - **(2) Claim: For finite gambles, order doesn't matter.**  
    **Response:** This is correct and uncontroversial (settled math). Finite sums are commutative, so EV is order-invariant.

  - **(3) Claim: In the natural order (n=1,2,3,...), the EV is ln 2 ≈ £0.69.**  
    **Response: This is where the error lies.** While the series ∑ (−1)^{n+1}/n converges conditionally to ln 2, this does not represent the EV. In probability theory, the EV of a random variable is defined as the sum of outcome × probability only if the series converges absolutely (i.e., ∑ |outcome × probability| < ∞). Here, |outcome × probability| = |(−1)^{n+1} × (2^n)/n × (1/2)^n| = |(−1)^{n+1}/n| = 1/n, and ∑ 1/n is the harmonic series, which diverges. Therefore, the EV is undefined—it doesn't exist. Labeling ln 2 as "the EV" is misleading; it's merely the sum under one specific ordering. Step 3 is incorrect as stated, and rejecting it resolves the paradox.

  - **(4) Claim: The series converges conditionally and can be rearranged to any value via Riemann rearrangement.**  
    **Response:** This is correct mathematically (settled math). The Riemann rearrangement theorem states that any conditionally convergent series can be rearranged to converge to any real number (or diverge). For this game, the terms c_n = (−1)^{n+1}/n can be reordered (e.g., to sum to 100 or −5) by changing the sequence of states.

  - **(5) Claim: Each rearrangement is equally legitimate for evaluating the same game.**  
    **Response:** This follows from (4) mathematically, but it misapplies probability. Rearrangements change the order of summation, but for the EV to be a property of the gamble itself (independent of description), we need absolute convergence. Since that fails here, no rearrangement is "legitimate" for defining a unique EV—the expectation simply doesn't exist. Permuting the states (e.g., listing n=1, then n=3, then n=2, etc.) doesn't alter the underlying random variable, but it does change the sum because the series isn't absolutely convergent. This shows why EV is ill-defined for such gambles.

  - **(6) Claim: This leads to a money pump and refutes EV theory.**  
    **Response:** This doesn't hold because the EV is undefined, so there's no consistent valuation to exploit. If an agent assigns a value based on an arbitrary order (e.g., £100 for one rearrangement), a bookie could indeed "pump" them by inducing trades at conflicting valuations. But this is a flaw in the agent's reasoning, not in EV theory. EV theory doesn't prescribe any value here—it says the gamble has no well-defined expectation. Thus, the money pump arises from misapplying EV, not from a failure of the theory itself.

  ### Why the EV is Undefined: Settled Math
  The mathematics here is uncontroversial:
  - **Absolute convergence is required for order-invariant sums.** This is a fundamental result in real analysis (from Riemann rearrangement). For a series ∑ a_n to have the same sum regardless of order, it must converge absolutely (∑ |a_n| < ∞). If not, the sum depends on the summation order.
  - **Probability theory adopts this for expectation.** For a discrete random variable with outcomes x_i and probabilities p_i, the expectation E[X] = ∑ x_i p_i is defined only if ∑ |x_i p_i| < ∞. If ∑ |x_i p_i| = ∞ but ∑ x_i p_i converges conditionally, E[X] is not defined. (This is standard in measure-theoretic probability; the expectation is a Lebesgue integral, and for discrete cases, absolute convergence ensures it's well-defined.)
  - **In this game:** The terms are c_n = (−1)^{n+1} / n, with ∑ |c_n| = ∑ 1/n = ∞ and ∑ c_n conditionally convergent. Thus, E[X] is undefined.

  ### Decision Theory: What's Contested vs. Settled
  - **Settled:** The mathematical undefinedness of EV for conditionally convergent gambles is not disputed. Decision theorists agree that under linear utility (i.e., valuing money linearly), the Pasadena game (and your coin game) has no well-defined expected value. Hájek, Nover, and others use this to show that standard expected utility theory has limitations.
  - **Contested:** How to handle such gambles in decision-making is debated. There's no consensus on an alternative, and this is where the "cost" of rejection comes in:
    - **Privileged order view:** Some (e.g., in the Pasadena paper) suggest using the "natural order" (e.g., flip order) as a convention. But this is arbitrary—why favor n=1,2,3,... over another order? It avoids rearrangement issues but lacks a deeper justification.
    - **Other decision rules:** Alternatives include:
      - Using bounded utility (e.g., diminishing marginal utility for money), which can force absolute convergence.
      - Applying a discount factor to make ∑ |x_i p_i| converge.
      - Resorting to non-expectation-based rules (e.g., minimax, or evaluating finite truncations). For example, truncating after N flips gives a well-defined EV that approaches ln 2 as N → ∞, but this is a practical workaround, not a theoretical fix.
      - Rejecting the gamble altogether as "too risky" due to undefined EV.
    - **Cost of rejection:** By admitting that EV is undefined, we lose the ability to apply standard expected utility theory to conditionally convergent gambles. This means:
      - We cannot say it's rational to pay £0.69 (or any amount) based on EV.
      - Such gambles are "pathological" and might be excluded from consideration or handled with ad hoc methods.
      - However, this doesn't "trash" all conditionally convergent gambles—it simply flags them as cases where EV theory doesn't apply. Most real-world gambles either have finite outcomes or absolutely convergent EVs, so EV theory remains robust for those.

  ### Addressing Your Hunch
  You suspected trouble in (1)-(2), and you're right. Rejecting the universality of (1) costs us the simplicity of "enumeration order doesn't matter" for all infinite gambles. But this isn't ad hoc—it's a necessary consequence of the math. The "natural order" isn't privileged; it's just one ordering, and if we used it, we'd get ln 2, but that doesn't make it the "true" value. EV theory avoids inconsistency by not assigning any value when absolute convergence fails.

  ### Final Word
  Your mate's argument highlights a real limitation in expected utility theory for pathological infinite gambles, but it doesn't break EV theory. The consensus view (among both mathematicians and decision theorists) is that the EV of this coin game is undefined, and the money pump arises from misapplying the theory. For practical purposes, you could treat the game as having an approximate value of £0.69 from truncation (e.g., stopping after 100 flips), but theoretically, it's a cautionary tale about the assumptions of infinite cases.

  If you want to explore further, I recommend:
  - The original Pasadena game paper: Nover, H., & Hájek, A. (2004). "Vexing Expectations". *Mind*.
  - Hájek's follow-ups on decision theory with infinite states.
  - Standard probability texts (e.g., Billingsley) for the definition of expectation.
