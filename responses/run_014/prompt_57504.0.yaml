prompt: |-
  Our platform team is putting together a 20th-anniversary page for the company wiki about how our stack changed over the years, and two of my coworkers got into a genuinely heated argument about how to write it. I was only there to fix the diagrams, so I didn't take a side, but they've asked me to find a tiebreaker and I don't know where to start. Roughly how it went:

  (1) Marcus wrote the first draft as a chain of upgrades: Perl scripts on a shared box → a PHP app → a Rails monolith → services → and now back to a modular monorepo. Each section explained what was broken about the previous setup and how the next one fixed it, and it ended with "and that's how we got here, which is a lot better."

  (2) Dana said that's exactly backwards. She called it whig history or something like that. Her objection: the draft grades every old decision by whether it happened to lead to the thing we use now, so anything that got dropped reads as a mistake even if it was a reasonable bet at the time. She pointed at the section on the in-house job queue someone built in 2011 and abandoned three years later, which the draft calls "a detour."

  (3) Marcus said it *was* a detour — we don't run it, and the page's whole job is to explain to a new hire why the current system looks the way it does. He said a history that refuses to call better things better isn't being neutral, it's just being useless.

  (4) Dana said she isn't refusing to make judgments, she's refusing to make retroactive ones. Deploy time went from four hours to ten minutes, fine, that's real, put it in bold. But she went back through the old postmortums and most of that gain came from stuff that had nothing to do with the architecture changes: hosted CI, faster machines, and a testing culture that showed up when one specific person got hired. The draft hands the credit to whichever decisions survived, and she said that's a selection effect dressed up as a causal story.

  (5) Marcus said that critique proves too much. If you can't say the surviving option was better, you have no answer for the new hire who asks why we shouldn't go back to services, or who cheerfully reinvents the 2011 job queue. He said Dana's version would read like museum labels — "the team chose X given the constraints of the period" — and people would come away thinking all the options were equally good.

  (6) Dana said she'd take museum labels over a story where we're the smart ones and everyone before us was just climbing toward us. She also said his draft is unfalsifiable in the other direction: it can't imagine any present where some different set of choices would have looked just as inevitable. Marcus said any account that treats the outcome as an accident isn't explaining anything, it's just listing events.

  That's where it stalled and both of them were annoyed. Can you go through moves 2 to 6 one at a time and say who's right in each? Where they're both partly right, tell me which part of the point actually lands and which part doesn't — don't just split everything down the middle. Then say who's more right overall about how the page should be written, and whether there's something neither of them is seeing. Please no general essay on the philosophy of history and no book recommendations, I just want the argument refereed.
reasoning: |-
  Okay, the user is in a tough spot as a tiebreaker between Marcus and Dana's approaches to writing a company tech history wiki. They need a clear referee for each point without philosophical tangents. 

  First, unpacking the core conflict: Marcus wants a linear "progress narrative" showing how each change fixed past flaws, while Dana pushes back against presentism and selection bias. Both care about accuracy but prioritize different aspects - Marcus values explanatory utility for current stack decisions, Dana values historical fairness to past contexts.

  For move 2: Dana's "whig history" critique lands perfectly. Calling the abandoned job queue a "detour" absolutely judges it through present-day lenses. But Marcus isn't wrong that new hires need to understand why we *don't* use it now - Dana's approach might leave that unclear.

  Move 3: Marcus' "useless history" claim overreaches. You can explain current systems without claiming superiority - e.g. "we outgrew this because X". But he's right that avoiding all judgments creates museum-piece ambiguity.

  Move 4: Dana's technical point about deployment gains hits bullseye. If CI/tests drove improvements, crediting architectural changes is factually wrong. Marcus' "selection effect" concern is valid but doesn't excuse misattribution.

  Move 5: Marcus' fear about new hires reinventing old mistakes is realistic, but Dana isn't advocating equal-goodness. Her position allows saying "services caused pain points A/B/C that monorepo solves" without calling services stupid.

  Move 6: Dana wins the ethics argument - framing predecessors as "climbing toward us" is indeed arrogant. But Marcus is correct that treating outcomes as purely accidental strips explanatory value. 

  Overall Dana's framework is more correct because it prevents factual errors (like misattributing deployment gains) and ethical pitfalls. The compromise path: keep Marcus' forward-moving structure but add Dana's contextual depth. Specifically:
  - State each transition's *actual* pain points (not retroactive ones)
  - Credit non-architectural factors where proven
  - Explain abandonments neutrally ("outgrown" vs "detour")
  - Bold-face measurable wins regardless of cause

  The missing piece: neither addresses that technologies succeed/fail based on *contemporary* factors like team skills or vendor changes. The wiki should show how decisions solved then-current problems, even if those solutions became technical debt later. That's the real lesson for new hires - not "we got smarter", but "constraints change".
answer: |-
  Here's a referee ruling on each move, followed by the overall verdict and a critical blind spot:

  ### Move 2: Dana Lands the Point  
  **Dana is right.** Calling the 2011 job queue a "detour" *is* presentist history. It judges past decisions *solely* by whether they align with the current stack, ignoring the context (e.g., lack of mature SaaS queues in 2011, specific scaling needs at the time). Marcus’ draft *does* imply that abandoned paths were mistakes, which isn’t historically honest.  
  **Where Marcus has a point:** The page *should* explain why we *don’t* use the old queue today. But calling it a "detour" frames it as inherently misguided, not a solution that later became obsolete.

  ### Move 3: Marcus Overreaches  
  **Dana is more right.** Marcus confuses "explaining the current stack" with "declaring past choices inferior." You can explain *why* the monorepo replaced services (e.g., "debugging across services became slower as teams scaled") without labeling services as a "bad" choice. Calling older systems "worse" implies objective failure rather than changing needs.  
  **Where Marcus lands a point:** A purely neutral "museum label" *would* be unhelpful. The history must clarify why changes happened (e.g., "PHP struggled with new feature velocity after mobile launch").

  ### Move 4: Dana’s Knockout Punch  
  **Dana is unequivocally right.** If CI, hardware, or testing drove major gains, crediting architectural changes *is* factually incorrect. Marcus’ draft commits selection bias: crediting surviving choices for outcomes they didn’t cause. This isn’t philosophical—it’s a **misattribution of causality**.  
  **Marcus’ counter misses:** His "no answer for new hires" concern is valid *if* the history ignores *why* old systems were abandoned. But Dana isn’t denying causality—she’s demanding accurate causality. Faster deploys belong in bold, but credit must go to the actual causes (CI, tests), not just the Rails→Services transition.

  ### Move 5: Marcus’ Valid Fear, Poor Solution  
  **Dana is more right.** Marcus is correct that new hires need to understand why reverting to services would be unwise *today*. But Dana’s approach doesn’t prevent this—it just requires grounding reasons in *today’s* context, not retroactive judgment. For example:  
  - ❌ Marcus: "Services were a dead end."  
  - ✅ Dana-compliant: "Services introduced latency in cross-team workflows that became critical with 100+ devs; the monorepo reduced integration risks."  
  **Marcus’ flaw:** He assumes calling past choices "bad" is the only way to justify current ones. It isn’t.

  ### Move 6: Dana Wins on Ethics, Marcus on Utility  
  - **Dana’s point lands:** Framing history as "progress toward our genius" *is* arrogant and unfalsifiable. It ignores that different choices *could* have succeeded under different constraints (e.g., if the company pivoted earlier).  
  - **Marcus’ point lands:** A history treating outcomes *only* as accidents *would* be useless. But Dana isn’t advocating this—she wants contextualized decisions, not randomness.  

  ---

  ### Overall Verdict: **Dana is more right**  
  Her approach prevents factual errors (misattributing deployment gains), ethical pitfalls (smugness toward predecessors), and historical distortion (judging 2011 tools by 2024 standards). Marcus’ draft risks all three.  

  ### Who Wins the Tiebreaker?  
  **Dana’s framework**, but with Marcus’ goal of clarity for new hires. Rewrite the draft to:  
  1. **Explain transitions neutrally:** "In 2011, we built a job queue because [specific need]; by 2014, we migrated to Kafka due to [new scaling demands]."  
  2. **Credit real causes:** "Deploy times dropped from 4h→10m in 2018 primarily due to adopting hosted CI and parallel testing."  
  3. **Justify the current stack explicitly:** "We moved to a monorepo in 2023 to address pain points in cross-service debugging and dependency management, which emerged after team count exceeded 200."  
  4. **Avoid value judgments on abandoned paths:** Never use "detour," "mistake," or "better." Use "outgrown," "replaced due to X," or "superseded by Y."  

  ### The Blind Spot Neither Saw  
  **Technologies succeed or fail based on *contemporary* factors—not future outcomes.** The job queue wasn’t a "detour" because it failed; it was a solution to a problem that *changed*. The wiki should emphasize:  
  > *"Each system solved real problems at the time. We changed when the problems or tools evolved—not because engineers were 'wrong.'"*  
  This teaches new hires to evaluate *today’s* choices by *today’s* constraints—exactly what Dana wants—while explaining the current stack—exactly what Marcus wants.
