  Okay, the user is deep into infinite ethics and needs a clear checklist to evaluate theories that rank worlds with infinitely many people. They're using a specific example: choosing between an endless line of colonies with decent lives versus one where early colonies suffer for slightly better lives later, plus the edge case of postponing upgrades to add more colonies. 

  First, I need to understand their core concern. They're spiraling, which suggests anxiety about the lack of clear answers in this area. Their request for "non-negotiable" vs. "preferential" criteria hints they want philosophical rigor but also practical boundaries. The running example is clever because it forces confrontation with three big infinite ethics headaches: time-symmetry violations, paralysis by indecision (via postponement), and aggregation breakdowns.

  The criteria must cover: 1) Avoiding absurd trade-offs (like sacrificing infinite beings for negligible gains), 2) Respecting temporal neutrality (no inherent bias toward early/late generations), 3) Handling "finite changes" meaningfully, and 4) Resolving the postponement paradox. Popular theories often fail #1 or #4—utilitarian extensions blow up, average utilitarianism implodes, and hyperreals feel arbitrary. 

  I'll structure each desideratum around their colony example. Key insight: some conflicts are unavoidable (e.g., strict Pareto vs. postponement-proofness), so I'll flag trade-offs. The "culling" criterion (#1) is the most lethal to naive theories—it reveals how easily infinity warrows cost-benefit analysis. User might secretly want reassurance that some paralysis is inevitable; I'll emphasize that in the conclusion.

  Notable pitfalls to avoid: Don't dive into niche solutions (they asked for criteria, not fixes). Keep the "why" tied to moral intuition (e.g., "sacrificing actual people for nothing feels unjust"). Stress that no known theory satisfies all—this preempts frustration when they explore further.
answer: |-
  Here's a rigorous checklist of desiderata for infinite ethics, derived from core moral intuitions and the logical challenges your colony example exposes. I'll categorize each requirement, explain its moral/logical basis, and show how it applies to your scenario. **Bold** denotes the most critical or problematic ones.

  **Core Non-Negotiables (Violating these makes a theory morally indefensible):**

  1.  **Avoiding the "Worthless Sacrifice" (Strict Pareto Violation):**
      *   **Requirement:** If World A has *at least* as much welfare for *every* individual as World B, and *strictly more* for *at least one* individual, then A must be better than B. (Strict Pareto Principle).
      *   **Why Necessary:** Sacrificing an actual person's welfare for *no gain* to anyone is fundamentally unjustifiable. It violates the core principle that individual welfare matters.
      *   **Colony Example:** Suppose we have two endless lines:
          *   Line A: Every colony has decent lives (say, welfare=10).
          *   Line B: Colony 1 suffers horribly (welfare=-100), while *all* subsequent colonies (2, 3, 4,...) still have welfare=10. *No one* in B is better off than in A; Colony 1 is much worse off. B must be strictly worse than A.
      *   **Kills Theories:** Theories that average over infinite populations often fail this. If adding any number of people with welfare=10 doesn't change the infinite average (still 10), they might deem A and B equally good, ignoring the horrific sacrifice of Colony 1.

  2.  **No Bias Based on Spatiotemporal Location (Anonymity/Basic Symmetry):**
      *   **Requirement:** The moral evaluation of a world shouldn't depend on *where* or *when* individuals are located in the sequence/infinity, only on their welfare levels. Permuting welfare levels among individuals shouldn't change the ranking.
      *   **Why Necessary:** Arbitrarily privileging one group (e.g., the first billion, the last billion, those at prime-numbered positions) over another solely based on their position is unjust discrimination. Moral value resides in individuals, not their coordinates.
      *   **Colony Example:** Consider two worlds:
          *   World X: Colonies 1, 3, 5,... (odd) have welfare=10; Colonies 2, 4, 6,... (even) have welfare=5.
          *   World Y: Colonies 1, 3, 5,... (odd) have welfare=5; Colonies 2, 4, 6,... (even) have welfare=10.
          *   Anonymity requires that X and Y are equally good. The welfare distribution is identical; only the *labels* (odd/even position) differ.
      *   **Kills Theories:** Theories relying on "discounting" future welfare (valuing earlier colonies more) or specific ordering (e.g., "only the limit matters") violate this. Positional biases lead to arbitrary rankings.

  **Highly Desirable (Violating these makes a theory impractical or deeply counterintuitive, but they might conflict):**

  3.  **Dominance (Weak Pareto):**
      *   **Requirement:** If World A has strictly higher welfare than World B for *every single individual*, then A must be better than B.
      *   **Why Desirable:** This is a fundamental extension of "more welfare is better, all else equal." If *everyone* is better off, the world is clearly better.
      *   **Colony Example:**
          *   Line A: All colonies welfare=10.
          *   Line C: All colonies welfare=11.
          *   C must be better than A. Seems obvious!
      *   **Conflict Potential:** This clashes head-on with the Postponement Paradox (#5). Satisfying both Dominance *and* avoiding Postponement Paradox is extremely hard.

  4.  **Sensitivity to Finite Changes:**
      *   **Requirement:** Changing the welfare of a *finite* number of individuals should change the overall evaluation of the world (unless the change is welfare-neutral among them). A theory shouldn't be "infinitely blind" to finite suffering or improvement.
      *   **Why Desirable:** Ignoring the plight or gain of any finite group, no matter how large, because "infinity swamps it" is morally repugnant. Finite lives matter.
      *   **Colony Example:** Compare:
          *   Line A: All colonies welfare=10.
          *   Line D: Colonies 1 through 1,000,000 have welfare=0 (suffering), all others welfare=10.
          *   Line D should be worse than Line A. The suffering of a million people *must* count.
      *   **Conflict Potential:** Some mathematically elegant solutions (like certain density measures) can violate this if the "finite" change occurs in a way that doesn't alter the asymptotic density. This is often seen as a major flaw.

  **The Crucial Challenge (Often a Dealbreaker for Simple Approaches):**

  5.  **Resolving the "Postponement Paradox" (Avoiding Mere-Addition Paralysis):**
      *   **Requirement:** The theory must not imply that we are *obligated* to forever postpone a welfare-improving change in order to add more people at the *current* welfare level. It must avoid paralysis where "adding one more colony first" is always required before making the improvement.
      *   **Why Critical (The Core Problem):** This is the heart of your edge case.
          *   Let `Base`: An endless line of colonies with decent lives (welfare=10).
          *   Let `Upgrade`: An endless line where early colonies suffer a bit (say, welfare=9 for first N colonies) so *all* colonies beyond N have slightly better lives (welfare=11).
          *   **Paralysis Scenario:** Consider `Base`. Before switching to `Upgrade`, we could add *one more* colony at welfare=10 (call this `Base+1`). Now, before switching `Base+1` to `Upgrade`, we could add *another* colony at welfare=10 (`Base+2`), and so on, forever. A theory demanding we *must* do this infinite postponement to add "just one more" is practically useless and implies we can never actually implement `Upgrade`.
      *   **Why it's Hard:** `Base+N` seems better than `Base` (if adding good lives is good). `Upgrade` seems better than `Base` (if the long-term gain outweighs the finite early cost). But `Base+N+1` seems better than `Upgrade` applied to `Base+N` (because `Upgrade` would lower welfare for colonies 1 to N in `Base+N` from 10 to 9, violating Dominance (#3) for those finite colonies). This creates an infinite chain: `Base` < `Upgrade`? But `Base` < `Base+1` < `Base+2` < ... and `Upgrade` < `Base+1` (Upgrade applied to Base) < `Base+2` (Upgrade applied to Base+1) < ... etc. Standard dominance (#3) pushes us down the `Base+N` path forever, blocking `Upgrade`.
      *   **Kills Theories:** This paradox kills **most popular naive approaches**.
          *   **Total Utilitarianism (Sum Welfare):** `Base`, `Base+N`, and `Upgrade` all sum to infinity. Incomparable. Useless.
          *   **Average Utilitarianism:** Adding `Base+N` lowers the average if the existing average is >10 (or doesn't change it if infinite). Doesn't prefer `Base+N` to `Base`. Might prefer `Upgrade` (average=11) to `Base` (average=10), but fails Worthless Sacrifice (#1) and Sensitivity (#4) catastrophically.
          *   **Overtaking/Catching Up:** Requires a fixed ordering. Postponement changes the starting point (`Base` vs `Base+N`), making comparisons unstable. Struggles to justify `Upgrade` over the constantly shifting `Base+N`.
          *   **Hyperreal/Ultrafilter approaches:** Can impose a total order but often seem arbitrary (e.g., prioritizing even-numbered colonies) and violate Anonymity (#2) or Sensitivity (#4).

  **Key Takeaways & Conflicts:**

  1.  **Non-Negotiables (#1 & #2):** Worthless Sacrifice and Anonymity are bedrock moral principles. Any theory violating them is fundamentally flawed. **Worthless Sacrifice (#1) kills naive averaging.**
  2.  **The Central Tension:** The **Postponement Paradox (#5)** is the single biggest technical challenge. It directly conflicts with the intuitive **Dominance principle (#3)** when applied to the finite early colonies in the upgrade scenario. Satisfying both Dominance *and* avoiding paralysis is the holy grail and kills most simple solutions.
  3.  **Sensitivity (#4)** is highly desirable but often sacrificed in mathematically neat solutions that focus only on limiting behavior or densities.
  4.  **No Perfect Solution Exists (Yet):** It's proven **(impossibility theorems like Lauwers & Vallentyne)** that no theory can satisfy *all* of the following simultaneously: Strict Pareto (#1), Anonymity (#2), a form of Transitivity, *and* be applicable to all infinite worlds (like those in your postponement case). Trade-offs are unavoidable.
  5.  **Your Colony Example:** A viable theory must:
      *   Correctly judge the sacrifice of early colonies in `Upgrade` vs. `Base` as a *cost* (Sensitivity #4).
      *   Judge `Upgrade` as better than `Base` *only if* the long-term gain to the infinite tail *sufficiently* outweighs the finite early cost (avoiding Worthless Sacrifice #1).
      *   *Not* require infinite postponement to add colonies at the current welfare level before upgrading (Resolving #5).
      *   Judge `Upgrade` the same way regardless of whether we apply it to `Base`, `Base+1`, or `Base+1000` (Anonymity #2 applied to sequences).

  **The single requirement that kills the most popular approaches is the Postponement Paradox (#5).** It exposes the fundamental instability and paralysis inherent in trying to combine infinite populations with standard dominance reasoning and the intuition that adding good lives is good. Any theory that cannot navigate this specific edge case will fail in practical decision-making scenarios like the one you described. Theories that *do* handle it often do so by relaxing Dominance (#3) in specific ways (e.g., allowing `Upgrade` to be better than `Base` even though `Upgrade` applied to `Base` would be worse for the first finite group than `Base+1` would be) or by introducing context-dependent rankings.
