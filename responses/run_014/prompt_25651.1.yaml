  Leaves I need: extended mind (Clark & Chalmers), embedded cognition (Rupert), organism-centered internalism (Adams & Aizawa), and at least one enactive or sensorimotor view. If there are logically possible combinations of answers that no one defends, mark them as unoccupied and say briefly why — is the position incoherent, just unpopular, or unexplored?

  The tree should have maybe 6-8 leaves total. Flag any pair of positions your tree genuinly can't pull apart with case-based questions.
