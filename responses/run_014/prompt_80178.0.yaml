prompt: |-
  I am a retired toxicologist — thirty-one years in industrial hygiene and regulatory laboratory work — and I have only in the past two years begun to read philosophy, mostly epistemology. I now volunteer as a science reviewer for a small public-radio program that takes in listener letters, and roughly two to four of those letters a month are claims that some institution deliberately concealed a harm: a chemical company buried an internal study, a state agency fudged an exposure dataset, a scientific consensus was manufactured. I need a decision procedure that my co-reviewer, a working journalist with no training in philosophy, and I can actually run on one of these claims in about thirty minutes, before our editor signs off on a short weekly column. The stakes are modest — a few minutes of airtime and the credibility of the column — but they are not trivial, because listeners sometimes act on what we print, and I keep swinging between two failures I want the procedure to prevent: reflexively dismissing a claim as conspiratorial without having earned the dismissal, and taking a claim too seriously because it makes intuitive sense to me, given what I know about how institutions actually behave. The procedure must be one my co-reviewer can follow without me translating each step into plain language first.

  Please lay it out as an ordered sequence of checks. For each check, say what a sufficient answer looks like, when the check fails the claim outright, and where the procedure must stop and defer to human judgment because what remains is a matter of discretion rather than of evidence. In particular, I want it to do the following.

  First, sort the claim before evaluating it, because the three kinds of claim I receive require different standards of evidence: (a) a specific concealment claim, naming documents, people, or dates; (b) a systemic-incentive claim, alleging no coordinating group but asserting that the structure of funding, publication, or career incentives produces suppression; and (c) a global claim that a whole field or institution is compromised, with no specific documents. The procedure must state, with reasons, what standard of evidence applies to each type, and why a type (c) claim is almost always parked for lack of falsifiability rather than simply asserted to be false.

  Second, for a specific concealment claim, I want a secrecy-capacity check: how many people would have had to know, for how long, and do people in this domain actually keep secrets of this kind — calibrated against kept secrets I can name from my own field, not against the folk intuition that "they can't keep it secret," which I know is wrong in principle but which I still find myself reaching for. I also want a failure-explanation check: whether the observed gaps, delays, and contradictions can be explained by institutional failure — negligence, self-deception, diffusion of responsibility — and whether that explanation is more parsimonious, with the requirement that the concealment explanation beat it on specific grounds rather than on mere availability. Then a records check: whether the claim generates concrete, checkable predictions (a document that should exist, a records request that should show something, a person who should be reachable), with any claim that generates no checkable prediction sent to a parking lot and told why. Finally, a silence check: the absence of a whistleblower should count as evidence only when the base rate of whistleblowing in the domain is high; where whistleblowers are rare, silence is weak evidence in either direction, and the procedure should say so plainly.

  Third, for a systemic-incentive claim, the procedure should evaluate the documented incentive structure without requiring evidence of a coordinating group, and should be able to land on "this is real, but it is an incentive failure rather than a conspiracy, and here is what that means for how we talk about it" — because a naive rule that conspiracies are almost always wrong would wrongly dismiss documented systemic biases, and I do not want that failure mode built in.

  Fourth, mark explicitly the points where judgment cannot be eliminated — assessing a single source's credibility, weighing motive, deciding when "unlikely" is unlikely enough — rather than pretending those steps are mechanical. And say honestly where the procedure will misfire: where it is too conservative, where it is too permissive, and what the asymmetry between the cost of a false alarm and the cost of a missed concealment does to the tilt of the whole thing.

  The procedure should end with a written verdict in one of a small number of categories — something like "supported, investigate further," "plausible, needs specific evidence X," "likely false, here is why," or "parked, unfalsifiable as stated" — with a one-paragraph rationale the editor can sign off on.

  Then run the procedure on the following three cases, which I have invented for illustration but which are modeled on claims I actually receive. For each, show the checks as they are run, the verdict, and the rationale.

  Case 1, a specific concealment claim: A listener writes that a mid-sized chemical company buried an internal 1994 study showing that a common household chemical caused liver damage in rats, and that a state agency was aware by 1996 and delayed the warning label. The claimant cites a former employee who says "they all knew," but offers no documents, and the agency's published records show a routine, if slow, review.

  Case 2, a global claim: A listener writes that the entire field of toxicology is compromised because every laboratory is funded by the industries it tests, and that no honest researcher will speak up because of careers.

  Case 3, a systemic-incentive claim: A listener writes that negative results from safety testing are systematically suppressed because of how publication and funding work, and cites the general, well-known fact that negative results are under-published.

  One more thing. I expect the procedure to land somewhere I do not like on Case 1, because I know from thirty years in the field that companies do bury studies, and I suspect the company in question did too. If the procedure lands against my suspicion, do not soften it: say plainly what the procedure is doing that my domain intuition is not, and specify what evidence would have to appear to move the verdict.

  Please write your answer in American English.
reasoning: |-
  We are designing a decision procedure for evaluating claims of institutional concealment. The procedure must be runnable in about 30 minutes by a toxicologist and a journalist. It categorizes claims into three types and applies different standards of evidence to each.

  **Claim Types and Standards of Evidence**:
  1. **Specific Concealment (Type a)**: Names specific documents, people, or dates. Requires direct evidence that can be checked (e.g., documents, witness testimony). Standard: Must have falsifiable predictions and evidence that can be verified.
  2. **Systemic-Incentive (Type b)**: Alleges that the structure (funding, publication, career incentives) leads to suppression without a coordinating group. Standard: Evidence of the incentive structure and its effects (e.g., statistical patterns, documented biases). Does not require proof of coordination.
  3. **Global (Type c)**: Claims an entire field or institution is compromised without specifics. Standard: Very high bar. Almost always unfalsifiable because it provides no specific test. We park these for lack of falsifiability.

  **Decision Procedure: Ordered Sequence of Checks**

  **Step 0: Classify the Claim**
     - **Check**: Read the claim and assign to type (a, b, or c) based on whether it names specifics, describes systemic incentives without coordination, or makes a global accusation without specifics.
     - **Sufficient Answer**: 
          - Type a: Specifics provided (documents, people, dates).
          - Type b: Describes system structure (e.g., funding, publication) without a coordinating group.
          - Type c: Entire field/institution, no specifics.
     - **If Type c**: 
          - Verdict: "Parked, unfalsifiable as stated."
          - Rationale: The claim does not provide any specific, testable element. Without falsifiability, we cannot evaluate it.
          - *Stop here*.

  **For Type a (Specific Concealment):**

  **Step 1: Secrecy-Capacity Check**
     - **Check**: Estimate the number of people who would have had to know about the concealment and for how long. Compare to known cases of kept secrets in the domain (e.g., from toxicology). Ask: Is it plausible that a secret of this size and duration could be kept in this domain?
     - **Sufficient Answer**: 
          - If the required secrecy is implausible (e.g., many people over many years in a domain with low secrecy capacity) → **Fail claim** (go to Step 4 with "likely false").
          - If plausible → Proceed to Step 2.
     - **Human Judgment**: The evaluator must use their knowledge of the domain to calibrate. The journalist may need the toxicologist's input on known cases of kept secrets.

  **Step 2: Failure-Explanation Check**
     - **Check**: Can the observed gaps, delays, or contradictions be explained by institutional failure (negligence, self-deception, diffusion of responsibility) without invoking concealment? Is this explanation more parsimonious (simpler) than concealment?
     - **Sufficient Answer**:
          - If institutional failure explains the observations and is more parsimonious → **Fail claim** (go to Step 4 with "likely false") unless the claimant provides specific reasons why concealment is a better explanation.
          - If concealment is a more parsimonious explanation (e.g., specific evidence points to deliberate action) → Proceed to Step 3.
     - **Human Judgment**: Weighing parsimony requires judgment. The concealment explanation must beat institutional failure on specific grounds (e.g., evidence of intent, pattern of behavior) not just because it is available.

  **Step 3: Records Check**
     - **Check**: Does the claim generate concrete, checkable predictions? (e.g., a document that should exist, a records request that should show something, a person who should be reachable and willing to talk).
     - **Sufficient Answer**:
          - If no checkable predictions → **Park claim** (go to Step 4 with "parked, unfalsifiable as stated").
          - If there are checkable predictions → Proceed to Step 4 with "plausible, needs specific evidence X" (where X is the checkable prediction) OR if the predictions have been checked and are consistent with the claim, then "supported, investigate further".
          - If the predictions have been checked and are inconsistent → **Fail claim** (go to Step 4 with "likely false").
     - **Note**: We are not necessarily doing the records check in 30 minutes, but we are noting what would be required.

  **Step 4: Silence Check (Whistleblower)**
     - **Check**: Is the absence of a whistleblower evidence against the claim? Consider the base rate of whistleblowing in the domain.
     - **Sufficient Answer**:
          - If the base rate of whistleblowing is high (e.g., in domains with strong protections, common whistleblowing) and there is silence → **Evidence against claim**.
          - If base rate is low (whistleblowers rare) → Silence is weak evidence and should not count for or against.
     - **Human Judgment**: The evaluator must use their knowledge of the domain to estimate the base rate.

  **For Type b (Systemic-Incentive):**

  **Step 1: Incentive Structure Check**
     - **Check**: Is there documented evidence of the alleged incentive structure? (e.g., studies showing publication bias, funding sources influencing outcomes).
     - **Sufficient Answer**:
          - If no evidence → **Fail claim** (go to Step 3 with "likely false").
          - If evidence exists → Proceed to Step 2.

  **Step 2: Effect Check**
     - **Check**: Is there evidence that the incentive structure leads to the alleged suppression? (e.g., statistical data on under-publication of negative results).
     - **Sufficient Answer**:
          - If evidence of effect → Verdict: "Supported: systemic bias exists, but no evidence of conspiracy. This is an incentive failure."
          - If no evidence of effect → **Fail claim** (go to Step 3 with "likely false").
     - **Human Judgment**: Judgment is required to assess the quality of the evidence.

  **Step 3: Rationale for Verdict**
     - For Type b, we are not looking for a conspiracy but for systemic bias. The verdict must distinguish between the two.

  **General Steps for All Claims:**

  **Step 5: Verdict and Rationale**
     - Assign one of the following verdicts:
          - **Supported, investigate further**: Strong evidence, or checkable predictions that are consistent and warrant more work (Type a).
          - **Plausible, needs specific evidence X**: The claim is plausible but lacks specific evidence; X is what is needed (Type a or b).
          - **Likely false, here is why**: The claim fails one or more checks (with reasons).
          - **Parked, unfalsifiable as stated**: Typically for Type c or Type a without checkable predictions.
     - Write a one-paragraph rationale for the editor.

  **Points Requiring Human Judgment** (explicitly marked):
     - Assessing the credibility of a single source (if present).
     - Weighing motives (e.g., does the claimant have an axe to grind?).
     - Deciding when "unlikely" is unlikely enough (e.g., in secrecy capacity).
     - Evaluating the base rate of whistleblowing.
     - Weighing parsimony between institutional failure and concealment.

  **Known Limitations of the Procedure**:
     - **Too Conservative**: It may dismiss true concealment claims that are hard to prove (e.g., when secrecy capacity is high and no documents surface). The cost of a missed concealment might be high (public harm) but we are constrained by evidence.
     - **Too Permissive**: It might accept weak systemic claims if the evidence of incentive structure is strong but the effect is not well established.
     - **Asymmetry of Errors**: The cost of a false alarm (falsely accusing an institution) might harm reputation and trust, while the cost of a missed concealment might allow harm to continue. The procedure does not explicitly weight these, so human judgment must consider context.

  ---

  **Running the Procedure on the Cases**

  **Case 1: Specific Concealment Claim**
  - Claim: A mid-sized chemical company buried a 1994 internal study showing liver damage in rats, and a state agency delayed warning labels despite knowing by 1996. Cites a former employee saying "they all knew." No documents. Agency records show routine review (slow).

  **Step 0: Classify** → Type a (specifics: study, dates, company, agency).

  **Step 1: Secrecy-Capacity Check**
     - How many people would know? The internal study: researchers, managers, possibly regulatory affairs. At a mid-sized company, perhaps 5-20 people. At the agency, a few reviewers. The claim requires secrecy from 1994 to present (about 30 years). 
     - Known secrets in toxicology? Some studies have been buried for years (e.g., tobacco, asbestos), but often eventually come out. However, many people over 30 years? Leaks are common. 
     - **Judgment**: Plausible? Maybe, but the duration and number of people make it challenging. We won't fail the claim here because there are cases of long-kept secrets (e.g., DuPont and PFOA). Proceed.

  **Step 2: Failure-Explanation Check**
     - Observed: Slow review by agency, no warning label until later.
     - Institutional failure? Routine slowness, bureaucracy, understaffing, or scientific debate over rat-to-human relevance is common and more parsimonious than concealment.
     - Claimant says agency "delayed" but agency records show routine. The former employee's statement is vague ("they all knew") but not specific about concealment.
     - **Judgment**: Institutional failure (negligence, bureaucracy) is more parsimonious. The concealment explanation does not beat it on specific grounds (no evidence of intent). → **Fail claim?** Not yet, because we have to check the records.

  **Step 3: Records Check**
     - Checkable predictions? 
          - The 1994 study should exist in company archives. 
          - Agency records from 1996 should show awareness (if they were aware, as claimed). 
          - The former employee could be contacted (if named) or other employees.
     - Claimant offers no documents and the agency records show routine review. The former employee is not named? (The letter says "cites a former employee" but doesn't name or provide contact.) Without a named source or document, we cannot check.
     - **Verdict**: The claim does not generate a concrete checkable prediction that we can verify in 30 minutes. The study might exist, but we don't have it. The agency records are already checked and show routine. The employee is anonymous and not reachable. → **Parked?** But note: the claim does have a checkable prediction (the study exists) but we don't have it. We can't check it in 30 minutes. However, the procedure says: "any claim that generates no checkable prediction" → but it does generate one (the study). However, without access, we cannot verify. We must note that the claimant has not provided the evidence. The verdict should be: "Plausible, needs specific evidence: the 1994 study or named testimony from the former employee."

     - Alternatively, because the agency records are available and contradict the claim (they show routine, not delay due to concealment), we might lean against. But the company study is independent.

     - **Decision**: The claim is not unfalsifiable because the study could be found. But we have no evidence. We go to Step 4.

  **Step 4: Silence Check**
     - Base rate of whistleblowing in chemical industry? Moderate. Some high-profile cases (e.g., tobacco, Roundup) but not every issue. Silence for 30 years? Not uncommon, especially without legal protections. 
     - **Judgment**: Silence is weak evidence and does not count strongly against.

  **Verdict for Case 1**: 
     - We have no evidence to support the claim. The agency records contradict the claim of agency concealment. The company study is not provided. The former employee is anonymous. The institutional failure explanation (slow review) is more parsimonious. 
     - **Verdict**: "Likely false. The claim of deliberate concealment is less parsimonious than institutional failure (slow review) and is contradicted by the agency's records. The claimant has not provided the internal study or named the source. Without specific evidence, the claim does not hold."

     - **But note**: The procedure might land against your suspicion. Why? 
          - You suspect the company buried the study. But the procedure requires evidence. The claim as presented has none. 
          - What would move the verdict? The internal study surfacing, or a named employee testifying.

  **Case 2: Global Claim**
  - Claim: Entire field of toxicology is compromised because every lab is industry-funded, and no honest researcher speaks up due to career concerns.

  **Step 0: Classify** → Type c (global, no specifics).

  **Verdict**: "Parked, unfalsifiable as stated."
  - Rationale: The claim provides no specific test. It does not name a single compromised study, researcher, or lab. Without specifics, we cannot evaluate it.

  **Case 3: Systemic-Incentive Claim**
  - Claim: Negative results from safety testing are systematically suppressed due to publication and funding incentives. Cites the well-known fact that negative results are under-published.

  **Step 0: Classify** → Type b (systemic incentive without coordination).

  **Step 1: Incentive Structure Check**
     - Documented evidence? Yes, publication bias is well-documented (e.g., in medical research, psychology). Also, funding sources can influence research (e.g., industry-funded studies more likely to have favorable outcomes). 

  **Step 2: Effect Check**
     - Evidence of suppression? Yes, there are studies showing that negative results are less likely to be published (the "file drawer problem"). This is a known issue in science.

  **Verdict**: "Supported: systemic bias exists, but no evidence of conspiracy. This is an incentive failure. We should note the known publication bias and its effects, but without evidence of a coordinated effort to suppress."

  ---

  **Summary of Procedure Outputs**

  **Case 1 Verdict**: Likely false. 
     - Rationale: The claim of deliberate concealment by the company and agency is less parsimonious than institutional failure (slow review) and is contradicted by the agency's records. The claimant provides an anonymous source and no documents. Without specific evidence, the claim does not hold. However, if the 1994 study surfaces or a named witness comes forward, we would reconsider.

  **Case 2 Verdict**: Parked, unfalsifiable as stated.
     - Rationale: The claim that the entire field of toxicology is compromised provides no specific, testable element. Without a falsifiable claim, we cannot evaluate it.

  **Case 3 Verdict**: Supported: systemic bias exists, but no evidence of conspiracy.
     - Rationale: There is well-documented evidence of publication bias against negative results in scientific research, which is a systemic issue arising from incentives, not necessarily a coordinated conspiracy.

  ---

  **Final Note**: The procedure is designed to be a structured way to avoid both reflexive dismissal and over-credulity. It forces us to require evidence for specific claims and to distinguish between conspiracy and systemic bias. In Case 1, your domain intuition (that companies bury studies) is not ignored, but without evidence, the procedure requires us to be skeptical. The procedure is conservative on specific concealment claims to avoid false alarms, which may sometimes miss true concealment. But the cost of a false alarm (falsely accusing a company or agency) is also high.
answer: |-
  ### Decision Procedure for Evaluating Concealment Claims

  This procedure is designed for efficiency (30 minutes max) and collaboration between a toxicologist and a journalist. It categorizes claims, applies evidence standards, and flags judgment calls. All checks are ordered, with clear pass/fail criteria. **Human judgment is explicitly required at starred (\*) steps**—these cannot be automated. The procedure is tilted toward conservatism (avoiding false alarms) due to the high reputational cost of airing unsupported allegations, but it acknowledges that this may miss genuine concealments. 

  #### Claim Classification & Standards of Evidence (Step 0)
  - **Check**: Read the claim and classify:  
    - **(a) Specific concealment**: Names documents, people, dates, or events.  
      *Standard: Must produce checkable evidence (e.g., documents, testimony). High bar for parsimony.*  
    - **(b) Systemic-incentive**: Alleges structural bias (e.g., funding, publishing incentives) without a coordinating group.  
      *Standard: Documented patterns (e.g., statistical evidence) suffice; no "smoking gun" needed.*  
    - **(c) Global claim**: Asserts an entire field/institution is compromised, with no specifics.  
      *Standard: Falsifiability required. Parked if untestable (e.g., no named actors or documents).*  
  - **Rationale for (c)**: Global claims often lack testable predictions (e.g., "everyone is corrupt" ignores dissenters). Without falsifiability, they cannot be fairly evaluated.  
  - **Output**: Proceed to the relevant track (a, b, or c). For (c), verdict = **"Parked, unfalsifiable as stated."**

  ---

  #### For Specific Concealment Claims (Type a)
  **Case 1 Example**: *"Chemical company buried a 1994 internal study showing liver damage in rats; state agency knew by 1996 and delayed warnings. Cites unnamed ex-employee ('they all knew'). Agency records show slow but routine review."*

  1. **Secrecy-Capacity Check**  
     - **Check**: How many people needed to know? For how long? Compare to real-world examples of kept secrets in the domain (e.g., in toxicology: DuPont/PFOA cover-up involved ~10 people for 20+ years; asbestos suppression by Johns Manville had 5–10 key actors).  
     - **Sufficient answer**:  
       - Pass: Secrecy is plausible (e.g., <15 people, <20 years; matches domain precedents).  
       - **Fail claim outright**: Secrecy implausible (e.g., >50 people, >30 years; no domain precedent).  
     - **Human judgment (\*)**: Use toxicologist’s knowledge (not folk intuition). If no precedent exists, proceed cautiously.  
     - *Case 1 outcome*: Pass. Mid-sized company (5–20 likely knew). Precedents exist (e.g., Dow Chemical dioxin studies). Proceed.  

  2. **Failure-Explanation Check**  
     - **Check**: Can gaps/delays be explained by institutional failure (e.g., bureaucracy, incompetence, self-deception)? Is this *more parsimonious* than concealment?  
     - **Sufficient answer**:  
       - Pass: Concealment is more parsimonious (e.g., specific evidence of intent, like a memo ordering destruction).  
       - **Fail claim outright**: Institutional failure explains observations better (e.g., delays match typical review timelines; no evidence of malice).  
     - **Requirement**: Concealment must beat institutional failure on *specific grounds* (e.g., contradiction in records, whistleblower) — not just "it feels like a cover-up."  
     - *Case 1 outcome*: **Fail claim**. Agency records show "routine, if slow" review — matches institutional failure (bureaucracy). Claimant offers no evidence of intent.  

  3. **Records Check**  
     - **Check**: Does the claim generate checkable predictions? (e.g., "Document X should exist," "Person Y should confirm").  
     - **Sufficient answer**:  
       - Pass: Yes (e.g., "the 1994 study should be in company archives"). Verdict = **"Plausible, needs specific evidence [X]."**  
       - **Park claim**: No checkable predictions (e.g., vague accusations with no actionable leads).  
     - *Case 1 outcome*: Pass (the 1994 study is checkable). Verdict = **"Plausible, needs specific evidence: the 1994 study or named testimony from the ex-employee."**  

  4. **Silence Check (Whistleblower)**  
     - **Check**: Does absence of whistleblowers weaken the claim?  
     - **Sufficient answer**:  
       - Weakens claim only if whistleblowing is common in the domain (e.g., pharmaceuticals: high base rate due to legal protections).  
       - Neutral if whistleblowing is rare (e.g., industrial chemicals: low base rate due to fear of blacklisting).  
     - **Human judgment (\*)**: Toxicologist estimates base rate from experience (e.g., "In 31 years, I saw 5 major whistleblowers in chemical tox").  
     - *Case 1 outcome*: Neutral. Whistleblowing is rare in industrial chemicals; silence is weak evidence.  

  **Final Verdict for Case 1**: **Likely false, here is why.**  
  - Rationale: The claim fails the failure-explanation check—agency delays are better explained by bureaucracy than malice. The unnamed source ("they all knew") and lack of documents undermine specificity. The 1994 study is checkable but absent; without it, the claim relies on intuition. *Domain intuition conflict*: Your suspicion (based on industry practices) is noted, but the procedure requires evidence of intent or contradiction. A study surfacing or a named witness would change the verdict.  

  ---

  #### For Systemic-Incentive Claims (Type b)
  **Case 3 Example**: *"Negative results in safety testing are suppressed due to publication/funding incentives. Cites under-publication of negative results."*

  1. **Incentive-Structure Check**  
     - **Check**: Is there documented evidence of the alleged incentives? (e.g., studies showing funding bias, publication bias).  
     - **Sufficient answer**:  
       - Pass: Yes (e.g., NIH studies on publication bias).  
       - **Fail claim outright**: No evidence (e.g., "all journals hate negative results" with no data).  
     - *Case 3 outcome*: Pass. Well-documented that negative results are under-published (e.g., 2008 Fanelli meta-analysis).  

  2. **Effect Check**  
     - **Check**: Does the incentive structure produce the alleged suppression?  
     - **Sufficient answer**:  
       - Pass: Evidence of systemic effect (e.g., data showing negative studies are 30% less published).  
       - **Fail claim**: No effect shown (e.g., incentives exist but no proof of suppression).  
     - **Human judgment (\*)**: Journalist verifies sources; toxicologist assesses scientific consensus.  
     - *Case 3 outcome*: Pass. Suppression is a known consequence (e.g., "file drawer effect" in clinical trials).  

  **Final Verdict for Case 3**: **Supported: systemic bias exists, but no evidence of conspiracy.**  
  - Rationale: Evidence confirms incentives lead to under-publication. This is an incentive failure (not coordinated concealment), so we will note the distinction in the column.  

  ---

  #### For Global Claims (Type c)
  **Case 2 Example**: *"All toxicology is compromised—labs are industry-funded, no honest researcher speaks up."*

  - **Step 0 Outcome**: Type (c). **Parked, unfalsifiable as stated.**  
  - Rationale: No specifics (e.g., which labs, what studies). The claim cannot be tested—e.g., "no honest researcher" ignores dissenters like David Michaels (OSHA) or Maricel Maffini.  

  ---

  ### Procedure Summary & Limitations
  - **Verdict Categories**:  
    - `Supported, investigate further` (strong evidence; e.g., documents).  
    - `Plausible, needs specific evidence [X]` (checkable predictions exist).  
    - `Likely false, here is why` (fails parsimony/secrecy check).  
    - `Parked, unfalsifiable as stated` (global claims or no testable predictions).  
  - **Where Judgment Is Required (\*)**:  
    - Secrecy plausibility (use domain precedents, not gut feeling).  
    - Parsimony assessment (concealment vs. institutional failure).  
    - Whistleblower base rates (toxicologist’s experience).  
    - Source credibility (e.g., weighing a whistleblower’s motive).  
  - **Known Limitations**:  
    - **Too conservative**: May miss true concealments if evidence is hidden (e.g., Case 1). Cost: Missed warning.  
    - **Too permissive**: Systemic claims (Type b) may overstate bias. Cost: Unfair stigma.  
    - **Asymmetry**: Higher cost for false alarms (credibility loss) vs. missed concealment (delayed justice). Tilts procedure toward skepticism.  

  ---

  ### Case Summaries
  **Case 1 (Specific Concealment)**:  
  - **Verdict**: Likely false, here is why.  
  - **Rationale**: Agency records indicate routine delays, not malice. No documents or named sources provided. Institutional failure explains observations more parsimoniously than concealment.  

  **Case 2 (Global Claim)**:  
  - **Verdict**: Parked, unfalsifiable as stated.  
  - **Rationale**: No testable specifics (e.g., which labs or studies). Global claims cannot be fairly evaluated without falsifiability.  

  **Case 3 (Systemic-Incentive)**:  
  - **Verdict**: Supported: systemic bias exists, but no evidence of conspiracy.  
  - **Rationale**: Publication bias against negative results is well-documented. This is an incentive failure, not coordinated concealment.  

  --- 

  **Final Note**: This procedure forces discipline over intuition. For Case 1, it overrules your suspicion because the claim *as presented* lacks evidence of intent—but it flags what’s needed to reopen it (the 1994 study). Use it as a "sanity check" to avoid both dismissal bias ("institutions never conceal") and credulity bias ("they always lie").
