  ### Dennett's Creatures In-Class Activity: "Symbol Evolution Challenge"

  #### **Learning Objectives**
  - Experience Dennett's generate-and-test hierarchy (Darwinian → Skinnerian → Popperian → Gregorian)
  - Contrast *competence without comprehension* (blind variation) vs. intelligent design
  - Analyze how representational tools augment cognition

  ---

  ### **Activity Design**
  **Task**: Replicate a hidden target symbol (e.g., ༓, ✺, or ✜) through iterative drawing.  
  **Materials**: Paper, pens, timer, projector (for symbols), scoreboard.  
  **Participants**: 16 students (split into 2 groups of 8 for Round 4).  
  **Symbols**: Use distinct, complex symbols each round (examples below).  

  ---

  ### **Rules & Timeline (80 min total)**
  #### **Round 1: Darwinian Creatures** (15 min)  
  - **Rules**:  
    - Target symbol is *hidden*.  
    - Participants draw **5 variants blindly** (1 min per variant).  
    - *No feedback* until all variants are submitted.  
  - **Scoring**:  
    - Only the *best* drawing is scored (0–10).  
    - **Cost**: -2 points per drawing (total cost: -10).  
    - *Net score = (best score) - 10*.  
  - **Symbol Example**: ✺ (complex star).  
  - **Time**: 5 min (drawing) + 5 min (scoring/debrief) + 5 min (transition).  

  #### **Round 2: Skinnerian Creatures** (15 min)  
  - **Rules**:  
    - Target symbol is *visible*.  
    - Draw **5 variants** (1 min per variant).  
    - Receive **immediate feedback** (score 0–10) after *each* variant.  
  - **Scoring**:  
    - Best score counts; -1 point per drawing.  
    - *Net score = (best score) - 5*.  
  - **Symbol Example**: ༓ (Tibetan glyph).  
  - **Time**: 8 min (drawing/feedback) + 5 min (debrief) + 2 min (transition).  

  #### **Round 3: Popperian Creatures** (20 min)  
  - **Rules**:  
    - Target symbol visible.  
    - Before drawing, participants **test hypotheses** by asking **1 yes/no question** per trial (e.g., "Is it symmetrical?").  
    - Draw **5 variants** with feedback after each.  
  - **Scoring**:  
    - Best score counts; -1 point per drawing.  
    - *Net score = (best score) - 5*.  
  - **Symbol Example**: ✜ (cross with dots).  
  - **Time**: 12 min (Q&A + drawing) + 6 min (debrief) + 2 min (transition).  

  #### **Round 4: Gregorian Creatures** (20 min)  
  - **Rules**:  
    - Target symbol visible (e.g., ䷜ (I-Ching hexagram)).  
    - All draw 2 trials *without tools* (feedback after each).  
    - **Mid-round**: Randomly give **8 students a "representational tool"** (e.g., step-by-step instructions: *"1. Draw a hexagon. 2. Add parallel lines at 60°..."*).  
    - All draw 3 more trials.  
  - **Scoring**:  
    - Compare *average scores of trials 3–5* for tool vs. no-tool groups.  
  - **Time**: 12 min (drawing) + 8 min (group comparison).  

  ---

  ### **Debrief & Concept Mapping** (10 min)  
  | **Round**       | **Generate-and-Test Structure**       | **Dennett's Concept**                          |  
  |------------------|---------------------------------------|-----------------------------------------------|  
  | **Darwinian**    | Blind variation; *ex post* selection  | Competence without comprehension; costly randomness |  
  | **Skinnerian**   | Generate → Test → Adjust (trial/error)| Learning from outcomes; reinforcement          |  
  | **Popperian**    | Test *before* action (hypothesis space)| Internal model; pre-selection of viable options |  
  | **Gregorian**    | Generate *via* external tools         | Installed cognition; tools > raw cleverness   |  

  **Key Discussion Prompts**:  
  1. How did *cost* shape strategy in Round 1 vs. 3?  
  2. Why did the Gregorian tool group outperform despite identical intelligence?  
  3. Where did "comprehension" emerge? When did it *not* correlate with competence?  

  ---

  ### **Predictable Challenges & Solutions**  
  1. **Darwinian "Unfairness"**:  
     - **Problem**: Frustration from blind failure.  
     - **Solution**: Emphasize *this is the point*: evolution is "wasteful." Frame losses as "energy cost" (e.g., "Each drawing burned 2 calories").  

  2. **Scoring Subjectivity**:  
     - **Problem**: Inconsistent symbol ratings.  
     - **Solution**: Use a rubric (e.g., 10 pts = perfect symmetry, recognizable parts; 5 pts = partial match). Pre-draw ideal versions.  

  3. **Gregorian Tool Timing**:  
     - **Problem**: Tool group may dominate too early.  
     - **Solution**: Give tools *after* 2 trials; compare only *later* trials.  

  4. **Time Pressure**:  
     - **Problem**: Rounds running long.  
     - **Solution**: Use a loud timer; cut Q&A in Round 3 to 20 sec/question.  

  ---

  ### **What the Game Can't Simulate: The Honest Gap**  
  **Irreproducible Element**:  
  > In true Darwinian selection, *failed trials are removed from the gene pool*. Your "creatures" (students) persisted across rounds, but nature has no second chances. A real Darwinian creature pays the ultimate cost: death. This game compresses generational selection into a single actor—a necessary simplification.  

  **Supply in Debrief**:  
  - Stress that *variation without retention* is unique to evolution: "In Round 1, your 'bad' drawings didn’t vanish—*you* survived to draw again. In nature, that trial would be extinct, and only successful variants reproduce."  
  - Contrast with Skinnerian/Popperian: "You carried lessons forward. Genes don’t—*lineages* do via selection."  

  ---

  ### **Symbol Bank**  
  - **Round 1**: ✺ (star)  
  - **Round 2**: ༓ (Tibetan glyph)  
  - **Round 3**: ✜ (cross with dots)  
  - **Round 4**: ䷜ (I-Ching hexagram)  

  *Rationale*: Symbols are complex enough to require strategy but simple enough for quick drawing.  

  This activity forces visceral engagement with Dennett’s framework while exposing the tradeoffs between cost, cognition, and tools. The predictable "pain" of Round 1 becomes a powerful metaphor for evolutionary inefficiency—making the later rounds feel like genuine epistemic upgrades.
