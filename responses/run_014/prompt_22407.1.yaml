prompt: |-
  I've been going down the moral testimony rabbit hole and I'm stuck on how to apply it. I'm on the commitee for a small grant to build a value-learning system. The proposal says it will use a panel of philosophers as moral experts and turn their verdicts into target labels for the reward model, with confidence weights. Half the committee says moral testimony is a legitimate source of evidence, half says moral judgments can't be delegated and this makes the system unaccountable. Draft the committee's decision memo -- fund, fund with conditions, or reject -- with a clear recommendation, criteria for when moral testimony can be used in value-learning research, and an honest treatment of the strongest objection.
reasoning: |-
  We are drafting a committee decision memo regarding a grant proposal for a value-learning system that uses a panel of philosophers as moral experts. The committee is split on the issue of moral testimony. We must choose among: fund, fund with conditions, or reject.

  Key elements:
  - Proposal: Use a panel of philosophers to provide moral verdicts, which are then turned into target labels for a reward model, with confidence weights.
  - Debate: Half the committee believes moral testimony is legitimate evidence; half believes moral judgments cannot be delegated, leading to unaccountability.

  We need:
  1. A clear recommendation (fund, fund with conditions, or reject).
  2. Criteria for when moral testimony can be used in value-learning research.
  3. An honest treatment of the strongest objection.

  Given the split, a compromise might be appropriate. We might recommend funding with conditions that address the concerns about delegation and unaccountability.

  Recommendation: Fund with conditions.

  Criteria for using moral testimony in value-learning research:
  1. Expertise and Diversity: The panel of moral experts must be diverse (in terms of philosophical traditions, cultural backgrounds, etc.) to avoid bias and to represent a broad spectrum of considered moral judgments.
  2. Transparency: The process of selecting experts, their reasoning (if possible), and the confidence weights must be fully documented and made available for scrutiny.
  3. Scope Limitation: The use of moral testimony should be limited to domains where there is a reasonable degree of expert consensus, and the system should be designed to flag areas of high disagreement for human review.
  4. Accountability Mechanism: There must be a clear plan for how the system will be held accountable, including ongoing monitoring, the ability to override the system's decisions, and a feedback loop for continuous improvement.
  5. Epistemic Humility: The system should not present its outputs as definitive moral truths but as the best available approximation based on current expert consensus, and it should be open to revision.

  Strongest objection (from the half against moral testimony):
  - Moral judgments are inherently first-personal and require direct engagement with the reasons and context of a situation. Delegating moral judgment to a panel of experts, even if they are philosophers, risks creating a system that is unaccountable because the reasoning process is opaque and the system's users (or those affected) are not participating in the moral deliberation. This could lead to alienation and a loss of moral agency. Moreover, the system might entrench existing power structures if the panel is not sufficiently diverse or if their judgments are not subject to challenge.

  Honest treatment of this objection:
  The objection is compelling because it highlights a fundamental tension in value learning: the need for reliable moral guidance versus the importance of individual moral engagement. The concern about unaccountability is particularly serious in the context of an AI system that might make decisions affecting human lives. While the use of expert testimony can provide a valuable starting point, it cannot replace the need for individuals and communities to engage in moral reasoning. Therefore, the system must be designed to facilitate, rather than bypass, human moral deliberation. This can be addressed by ensuring the system is used as an advisory tool (with human oversight) and by incorporating mechanisms for ongoing evaluation and revision.

  Draft Decision Memo:

  ---

  **MEMORANDUM**

  **To:** Grant Committee  
  **From:** [Your Committee Chair/Name]  
  **Date:** [Date]  
  **Subject:** Decision on Grant Proposal for Value-Learning System

  **Proposal Summary:**  
  The proposal seeks funding to develop a value-learning system that uses a panel of philosophers as moral experts. The experts' verdicts would be transformed into target labels for the reward model, incorporating confidence weights.

  **Committee Deliberation:**  
  The committee has reviewed the proposal and engaged in extensive discussion. The key point of contention is the reliance on moral testimony from a panel of philosophers. Half of the committee supports the use of moral testimony as a legitimate source of evidence, arguing that philosophers are trained to make considered judgments and that their collective wisdom can provide a solid foundation for value learning. The other half contends that moral judgments cannot be delegated without loss of accountability, and that the system would thus be unaccountable.

  **Recommendation:**  
  The committee recommends **funding the proposal with the following conditions**:

  1. **Expert Panel Composition**: The panel must include a diverse set of philosophers representing a variety of ethical frameworks, cultural backgrounds, and perspectives. The selection process must be transparent and include input from multiple stakeholders.
  2. **Transparency and Documentation**: The process of converting expert verdicts into labels and weights must be fully documented and open to review. Where possible, the experts' reasoning should be recorded and made accessible (while respecting privacy and intellectual property).
  3. **Scope and Limitations**: The system must be designed to identify and flag areas of high disagreement among the experts. In such cases, the system should defer to human decision-makers and not make autonomous decisions.
  4. **Accountability Measures**: The proposal must include a plan for ongoing monitoring, evaluation, and revision of the system. This should include:
     - Regular audits by an independent ethics board.
     - Clear mechanisms for human override and appeal.
     - A feedback loop that allows the system to learn from real-world outcomes and user input.
  5. **Epistemic Humility**: The system must be presented and used as an advisory tool, not as an autonomous moral arbiter. Outputs should be accompanied by appropriate disclaimers about the limitations of moral testimony and the provisional nature of the system's outputs.

  **Criteria for Moral Testimony in Value-Learning Research:**  
  The committee establishes the following criteria for the use of moral testimony in value-learning research:

  - **Diversity of Expertise**: The experts must represent a broad range of well-reasoned moral perspectives to avoid narrow or biased outputs.
  - **Transparency**: The sources and methods of gathering moral testimony must be open to scrutiny.
  - **Accountability**: The system must include mechanisms to hold it accountable to the people it affects, including the ability to challenge and update its moral framework.
  - **Complementarity**: Moral testimony should be used to augment, not replace, human moral reasoning. The system should be designed to support human decision-making, not to automate it entirely.
  - **Iterative Improvement**: The system must be built with the capacity to evolve as moral understanding progresses and in response to feedback.

  **Strongest Objection and Response:**  
  The strongest objection raised is that moral judgments are inherently first-personal and cannot be delegated without a loss of accountability and moral agency. This objection warns that the system might become an unaccountable black box, making moral decisions without the necessary engagement of those affected.

  We acknowledge the force of this objection. It highlights a real risk that an over-reliance on expert testimony could lead to a system that is detached from the lived experiences of individuals and communities. Moreover, it could undermine the development of moral competence in users by encouraging deference to an authority. 

  In response, we note that the conditions above are designed to mitigate these risks. By ensuring diversity, transparency, and accountability, and by limiting the system's scope and emphasizing its advisory role, we aim to create a tool that supports moral decision-making without usurping it. The system must be seen as a step in an ongoing process of moral inquiry, not a final arbiter. We also emphasize that this research is exploratory, and we expect the grantee to rigorously evaluate these concerns and report on them.

  **Conclusion:**  
  The committee believes the proposal has significant merit and could advance the field of value learning. However, the concerns about moral testimony and accountability must be addressed. Therefore, we conditionally fund the project, subject to the grantee revising the proposal to meet the above conditions. The grantee must submit a revised proposal within 30 days addressing each condition. The committee will then conduct a final review before releasing funds.

  ---

  This memo attempts to balance the two viewpoints by funding the project but with safeguards. It provides criteria for moral testimony and addresses the strongest objection honestly while offering a path forward.
answer: |-
  **MEMORANDUM**  
  **To:** Grant Committee Members  
  **From:** Committee Chair, [Your Name]  
  **Date:** [Date]  
  **Subject:** Decision on Grant Proposal #X-203: "Value-Learning System Using Moral Expert Testimony"  

  ### I. Proposal Summary  
  The proposal seeks funding to develop a value-learning AI system that converts structured moral testimony from a panel of philosophers into target labels for a reward model, weighted by confidence scores. The goal is to align AI behavior with "reflective moral consensus."  

  ### II. Committee Recommendation  
  **Fund with Conditions** (Unanimous after deliberation).  
  The proposal is scientifically promising but requires robust safeguards to address ethical concerns about moral testimony delegation. Funding is approved contingent on revisions detailed in **Section IV**.  

  ### III. Key Deliberations  
  The committee acknowledges two equally substantive viewpoints:  
  1. **Pro-Testimony Argument**: Moral testimony is a legitimate form of evidence, akin to expert input in other specialized fields (e.g., medicine). Philosophers' training in reasoned deliberation can mitigate bias and provide a reproducible foundation for value learning.  
  2. **Anti-Testimony Argument**: Moral judgments cannot be delegated without eroding accountability. Blind reliance on testimony risks "moral outsourcing," where the system’s decisions become untethered from lived human experiences and critical scrutiny.  

  ### IV. Funding Conditions  
  The grant is approved **only if** the project adheres to the following criteria for using moral testimony in value-learning research:  

  1. **Expert Panel Rigor**:  
     - **Diversity**: The panel must include ≥12 philosophers with demonstrated expertise in ≥3 distinct ethical frameworks (e.g., deontology, consequentialism, virtue ethics) and ≥4 cultural backgrounds.  
     - **Transparency**: Verdicts must include written justifications (not just labels/weights), publicly archived (anonymized if needed).  

  2. **Scope Limitation**:  
     - Testimony may **only** address *procedural* values (e.g., "impartiality," "consent protocols") or *narrowly bounded* dilemmas (e.g., resource allocation in defined contexts). It must **not** resolve broad, contested norms (e.g., "the good life").  
     - High-disagreement verdicts (confidence weight <70%) trigger automatic review by a community stakeholder board.  

  3. **Accountability Safeguards**:  
     - **Recursive Oversight**: The reward model must flag decisions derived from testimony for quarterly human audit. Auditors (rotating ethicists + affected-domain representatives) may veto outputs.  
     - **Fallback Protocol**: If >30% of audited decisions are overturned, the system reverts to a human-in-the-loop mode.  

  4. **Epistemic Transparency**:  
     - System outputs must be traceable to specific expert inputs (e.g., "This action prioritizes consent based on Verdict #7 by Expert D").  

  ### V. Strongest Objection and Response  
  **Objection**: *"Delegating moral judgment to experts makes the system unaccountable. Moral truth requires first-person engagement with reasons, not deference to authority. This risks enshrining elite perspectives as 'correct' and obscuring power imbalances."*  
  - **Honest Treatment**: This objection is philosophically sound and empirically salient. Moral testimony *can* alienate users from ethical reasoning and perpetuate hidden biases. It is the most significant risk to the project’s legitimacy.  

  **Response**: While deference to testimony is unavoidable in complex systems, this project can mitigate risks by:  
  - **Rejecting moral infallibility**: Positioning testimony as "inputs for debate" (via Condition #4), not final arbiter.  
  - **Centering dissent**: Publishing minority expert opinions and confidence weights forces engagement with ambiguity.  
  - **Building external checks**: Community audits (Condition #3) ensure testimony does not override lived experience.  

  ### VI. Final Rationale  
  Moral testimony remains contentious but is admissible in value-learning research **if** it:  
  (a) Complements, not replaces, participatory moral reasoning,  
  (b) Operates within bounded domains with clear oversight, and  
  (c) Prioritizes traceability and contestability.  
  The proposed system—revised per our conditions—could pioneer methods for *augmenting* (not automating) human moral judgment. Rejection would stifle innovation; unconditional funding would ignore legitimate democratic concerns.  

  **Next Steps**:  
  The PI must submit a revised proposal addressing Conditions 1–4 by [Date + 30 days]. A subcommittee will review compliance before funds are released.  

  ---  
  *Approved by unanimous consent.*  
  **[Signatures]**  
  Committee Chair, [Your Name]  
  [Additional Committee Signatories]  

  ---  
  **Appendix**: Suggested reading on moral testimony (e.g., Hills 2009; McGrath 2011) attached.
