prompt: |-
  Could you translate the central claim of Good's theorem on the value of information into a reusable procedure for repeated, time-pressured professional decisions?

  My context is as follows. I serve as a senior planning case officer for a district council in England. Several times each month I must decide whether to request additional evidence before determining an application — a traffic count, a flood model update, an ecological survey, a noise assessment. The stakes are moderate but recurrent: unnecessary requests delay housing, impose costs on applicants and invite appeals for non-determination, while failure to request genuinely decision-changing evidence risks unlawful decisions and judicial review. I have roughly half an hour to screen each such question, no formal training in decision theory, and I must be able to defend the reasoning briefly to a head of service who signs off.

  Please provide a step-by-step procedure, expressed as a flowchart in words, that preserves what the theorem actually establishes whilst remaining usable by a non-specialist. It should move in order through identification of the pending decision and live options, isolation of the uncertainties that could alter the choice, estimation of the ex ante benefit of resolving them, accounting for the full cost of the information including delay, applicant burden and loss of flexibility, and explicit checks on whether the idealising assumptions behind the theorem hold in the case at hand. For each step, state what would count as enough to proceed and what triggers a stop with a recommendation not to seek the information. Mark clearly the points at which formal calculation must give way to judgement and cannot be eliminated.

  The procedure must be able to handle four difficult situations that recur in my work: information that is free to the council but expensive to the applicant; information that, once obtained, cannot be set aside and must be disclosed on the public file; information whose mere collection is observed by developers, objectors or committee members and changes their behaviour; and situations where I have reason to think that I or the planning committee will overweight a vivid or alarming finding relative to its actual decision relevance.

  Then demonstrate the procedure on the following three invented cases, showing your working at each step:

  A proposal for 35 dwellings on the edge of a village where the only material uncertainty is peak-hour capacity on a single-track access lane, for which the highways team offers a two-week automatic traffic count at internal cost;

  A proposal to convert a vacant warehouse into twelve flats where a consultant quotes a three-week bat presence survey, with a local residents association having publicly stated that any survey mentioning bats, whatever its conclusion, will be used to demand a far lengthier ecological assessment;

  A retrospective application for an extended farm shop car park partly within a flood-risk area, where updated surface-water modelling would take six weeks beyond the statutory determination period and the applicant has indicated an appeal on grounds of delay, and where committee practice suggests any ambiguous modelling result would in effect be treated as grounds for refusal.

  Include at least one case where faithful application of the procedure recommends a course that a cautious officer would dislike, such as declining apparently reassuring evidence or commissioning evidence despite delay, and explain why. Conclude with a brief statement of what the procedure cannot do and where it is liable to misfire.

  Please respond in British English, using British spelling and conventions throughout.
reasoning: |-
  Okay, let me approach this methodically. The user is a senior planning officer facing recurring evidence-request decisions under time pressure, needing a practical adaptation of Good's theorem. The core challenge is balancing rigour with usability while addressing real-world complexities like applicant burden, disclosure risks, and behavioural impacts.

  First, I need to distil Good's theorem into its actionable essence: information has value only if it might change a decision, and that value must exceed its full cost. The procedure must reflect this while accommodating four specific complications mentioned: 
  - Information costly to applicants but free to council
  - Mandatory public disclosure 
  - Behaviour-altering observation of data collection
  - Cognitive biases towards vivid findings

  For the procedural design, I'll structure it as a flowchart in words with clear stopping points. Key thresholds should signal when judgement must override calculation, particularly around uncertainty estimation and bias risks. The three test cases will help validate the approach against real planning dilemmas.

  The bat survey case seems especially telling - it demonstrates how the mere act of commissioning evidence can trigger secondary demands, making the information's potential harm outweigh its benefit despite being decision-relevant. This might push a cautious officer toward counterintuitive non-request, which needs clear explanation.

  Throughout, I'll maintain British English conventions as requested, using terms like "highways" and "judicial review" consistently. The conclusion must frankly address limitations, especially around quantifying subjective probabilities or containing behavioural cascades once information enters the public domain.
answer: |-
  Here is a step-by-step procedure translating Good's Theorem into a practical framework for your evidence requests, followed by worked examples. The core principle is: **Request additional evidence only if the expected improvement in the decision's quality (based on resolving uncertainty) exceeds the total expected cost of obtaining it.**

  **Procedure: The Evidence Value Assessment (EVA) Flowchart (British English)**

  1.  **Define the Pending Decision:**
      *   *What is the specific planning decision I must make?* (e.g., Approve/Refuse Application X; Approve subject to Condition Y; Request Evidence Z).
      *   *Enough to Proceed:* Clear identification of the immediate choice(s) facing you.
      *   *Stop & Recommend (No Request):* If the decision point is ambiguous or irrelevant to the potential evidence.

  2.  **Identify Live Options (Without New Evidence):**
      *   *Based solely on current information, what are my defensible options right now?* (e.g., Approve; Refuse; Defer decision pending *this specific* evidence). *Crucially: Is "Defer pending evidence" a legally/permissibly live option at this stage?*
      *   *Enough to Proceed:* At least two distinct, plausible courses of action identified (e.g., Approve vs Refuse; Approve vs Defer).
      *   *Stop & Recommend (No Request):* Only one option is genuinely live/defensible based on current information (e.g., refusal is mandatory without the evidence, so you *must* request it; approval is clearly sound without it).

  3.  **Pinpoint the Decision-Changing Uncertainty:**
      *   *What specific, material uncertainty prevents me from confidently choosing between the live options?* Be precise (e.g., "Uncertain if peak traffic exceeds 100 vehicles/hr"; "Uncertain if bat roosts are present"; "Uncertain if updated model shows flood risk exceeds tolerable threshold").
      *   *Enough to Proceed:* A specific, identifiable uncertainty linked directly to the planning merits and the choice between the live options.
      *   *Stop & Recommend (No Request):* The uncertainty is irrelevant to planning policy, too vague, or wouldn't change the decision regardless of the answer (e.g., even if bats are present, mitigation is demonstrably feasible under policy).

  4.  **Estimate Potential Benefit of Resolving Uncertainty (Ex Ante):**
      *   *Judgement Step:* Mentally simulate the two main outcomes of the evidence:
          *   *Outcome A (Favours Option 1):* How much *better* (in planning outcome terms - avoiding harm, achieving benefit, reducing risk of appeal/JR) would Option 1 be than Option 2 if this result occurs? (e.g., Avoiding refusal of much-needed housing vs risk of congestion harm).
          *   *Outcome B (Favours Option 2):* How much *better* would Option 2 be than Option 1 if this result occurs? (e.g., Avoiding an unlawful approval in a flood zone vs delaying a beneficial development).
      *   *Crucially:* Assign rough, *relative* weights to the *importance* (not likelihood) of these benefits. Which outcome's avoidance of harm/achievement of benefit feels materially larger? (e.g., "Preventing unlawful flood risk development is significantly more important than preventing a minor delay").
      *   *Enough to Proceed:* A clear sense that *one* potential outcome of the evidence could lead to a *significantly better* planning outcome than the alternative live option.
      *   *Stop & Recommend (No Request):* Both potential outcomes seem to lead to similar overall planning outcomes, or the potential benefits of either outcome over the alternative are judged to be very small or negligible.

  5.  **Assess Full Cost of Information (Ex Ante):**
      *   Calculate/Estimate:
          *   *Direct Council Cost:* Officer time, fees (if any).
          *   *Delay Cost:* Risk of non-determination appeal; value of delayed housing/development; reputational cost; committee scheduling delays. Estimate the *probability* an appeal would occur/would succeed *specifically due to this delay*.
          *   *Applicant Burden:* Cost of survey/fee, delay to project, business impact. *Judge its reasonableness relative to the scale/benefit of the development.*
          *   *Loss of Flexibility:* Once obtained, evidence *must* be disclosed and considered. Could it force a suboptimal decision? (e.g., ambiguous flood model forcing refusal).
          *   *Behavioural Cost:* Will obtaining the evidence trigger unwanted actions? (e.g., residents demanding more surveys, developer altering plans pre-emptively, committee members fixating on a vivid result).
      *   *Enough to Proceed:* A reasonable estimate of tangible costs (delay, fees) and identification of key intangible risks (flexibility loss, behavioural triggers).
      *   *Stop & Recommend (No Request):* If the total estimated cost (especially delay/appeal risk + applicant burden + major behavioural risks) is immediately and obviously overwhelming relative to *any plausible* benefit identified in Step 4.

  6.  **Check Good's Assumptions (Reality Check):**
      *   *Judgement Step:* Ask:
          1.  *Will I/Committee Actually Update Beliefs?* Or is the decision pre-judged? (Bias Check)
          2.  *Will the Information Be Decision-Relevant?* Is it genuinely about the pinpointed uncertainty? (Relevance Check)
          3.  *Can I Handle the Information Objectively?* Is there a high risk I/the committee will overweight a vivid finding (e.g., "BATS!" or "FLOOD RISK!") regardless of its actual significance relative to policy thresholds? (Cognitive Bias Check)
          4.  *Is the Information Quality Sufficient?* Is the source/method reliable enough to base a decision on?
      *   *Enough to Proceed:* Reasonable confidence that information will be relevant, considered objectively enough, and of sufficient quality. *Formal calculation effectively ends here. The final go/no-go is judgement-based on the balance.*
      *   *Stop & Recommend (No Request):* Strong evidence of pre-judgement, irrelevance, overwhelming risk of cognitive bias (especially given committee practice), or poor information quality.

  7.  **Final Judgement: Request or Not?**
      *   *Judgement Step:* Weigh the *potential benefit* (Step 4) against the *total expected cost* (Step 5), considering the *reality checks* (Step 6).
      *   *Recommend Request:* Only if the *potential* for a significantly better planning outcome *plausibly* outweighs the *total* expected costs and risks *and* the information is likely to be used rationally.
      *   *Recommend No Request:* If costs/risks dominate, benefits are minor, bias risks are high, or the information wouldn't change the live options.

  ---

  **Worked Examples:**

  **Case 1: 35 Dwellings - Traffic Count (Highways offer, 2 weeks, internal cost)**

  1.  **Decision:** Approve/Refuse based on highway safety impact.
  2.  **Live Options:** Approve (current info suggests capacity *might* be adequate); Refuse (if capacity clearly exceeded); *Defer pending count is a live option.*
  3.  **Uncertainty:** Does peak-hour traffic on the lane exceed safe capacity (assume 100 veh/hr threshold)?
  4.  **Benefit:** Resolving this tells us: Outcome A (Count <100): Confirms safety, allows approval (avoids unnecessary refusal of housing). Outcome B (Count >100): Shows refusal needed (avokes dangerous congestion). *Benefit:* Preventing either wrong approval (safety risk) or wrong refusal (housing loss) is highly important. Similar weight.
  5.  **Cost:** Direct Cost: Minimal (internal). Delay: 2 weeks - low risk of non-determination appeal given short time, moderate housing delay. Applicant Burden: Negligible (council-funded). Flexibility Loss: Low - result is clear-cut. Behavioural Cost: Low - routine data.
  6.  **Assumptions:** Info highly relevant. Beliefs likely updated. Bias unlikely (quantitative data). Quality good.
  7.  **Judgement:** Significant potential benefit (avoiding major errors) vs very low cost. **Recommend Request.**

  **Case 2: Warehouse to Flats - Bat Survey (3 weeks, applicant cost, residents' threat)**

  1.  **Decision:** Approve/Refuse conversion.
  2.  **Live Options:** Approve (subject to conditions if needed); Refuse (if unmitigatable harm); *Defer pending survey is a live option.*
  3.  **Uncertainty:** Is there a *currently active* bat roost *requiring mitigation* within the building?
  4.  **Benefit:** Outcome A (No roost/No mitigation needed): Allows straightforward approval (avoids unnecessary delay/cost). Outcome B (Roost requiring mitigation): Ensures conditions/refusal to protect biodiversity (avoids unlawful harm). *Benefit:* Preventing ecological harm is important, but so is avoiding delay/blocking housing unnecessarily. *Slight edge to preventing ecological harm.*
  5.  **Cost:** Direct Cost: Applicant pays (~£1-2k?). Delay: 3 weeks - moderate delay risk. Applicant Burden: Significant for small conversion. Flexibility Loss: High - result must be disclosed/acted upon. **Behavioural Cost: VERY HIGH - Resident Assoc. states ANY bat mention (even low significance) will trigger demands for major new assessment. High risk of significant further delay/conflict regardless of actual result.**
  6.  **Assumptions:** Relevance: Only if roost requiring mitigation. Bias: **HIGH RISK** - Residents (and potentially committee) likely to fixate on "bats present" regardless of relevance to mitigation/decision. "Vividness" problem flagged. Quality: Likely good, but outcome interpretation key.
  7.  **Judgement:** Potential benefit (avoiding ecological harm OR unnecessary refusal) is significant. **HOWEVER, total cost/risk is potentially overwhelming:** High applicant burden for small scheme, critical loss of flexibility, and **extremely high behavioural cost** likely leading to much greater delay/political hassle *regardless of the survey result*. Bias risk high. Potential benefit unlikely to justify this cascade. **Recommend NO REQUEST.** (Defence: Survey likely to trigger disproportionate demands irrespective of findings, creating unreasonable burden/delay. Sufficient evidence to determine need for survey not present *at this stage*; if strong initial evidence *of* a roost existed, Step 2 would force a request). *[Cautious Officer Dislikes: But procedure forces focus on total cost/risk, not just ecological caution].*

  **Case 3: Farm Shop Car Park - Flood Model (6 weeks, beyond determination period, appeal threat, committee bias)**

  1.  **Decision:** Approve/Refuse retrospective car park in flood risk area.
  2.  **Live Options:** Approve (if risk acceptable); Refuse (if unacceptable); *Defer beyond statutory period is NOT a live option* without applicant agreement (high appeal risk).
  3.  **Uncertainty:** Does the updated surface water model show flood risk exceeding the specific "tolerable" threshold for this development type?
  4.  **Benefit:** Outcome A (Below Threshold): Confirms safety, allows approval (avoid unnecessary refusal & enforcement). Outcome B (Above Threshold): Shows refusal needed (avoids unlawful development in flood risk). *Benefit:* Preventing flood risk is highly important; preventing unnecessary refusal/appeal also important. *Edge to preventing flood risk.*
  5.  **Cost:** Direct Cost: Unknown (likely applicant). Delay: **6 weeks BEYOND statutory period - VERY HIGH.** Applicant has threatened appeal for delay - high likelihood (80%+) of winning, costing council time/money/reputation. Applicant Burden: High (specialist model). Flexibility Loss: **VERY HIGH - Committee practice treats ambiguous results as refusal grounds.** Behavioural Cost: High - Objectors/Committee likely to seize on any negative nuance.
  6.  **Assumptions:** Relevance: High if threshold clear. Bias: **VERY HIGH RISK** - Committee practice explicitly biases against ambiguous results. Information may not be used rationally. Quality: Good, but ambiguity possible.
  7.  **Judgement:** Potential benefit of resolving uncertainty is high (avoid flood risk OR refusal/appeal). **HOWEVER:** **Delay cost is extreme and almost certain to trigger a costly appeal win for the applicant.** Flexibility loss is total - ambiguity = refusal. Bias risk very high. **Total expected cost (appeal cost + certain refusal if ambiguous + high applicant burden) is overwhelming.** Current information *must* support either approval or refusal. **Recommend NO REQUEST.** Base decision on best available current model/evidence. (Defence: Delay beyond statutory period poses unacceptable risk of successful non-determination appeal. Updated model cannot materially alter committee's likely decision path due to inflexible interpretation practice, rendering its value low relative to high cost/risk). *[Cautious Officer Dislikes: But procedure highlights that the information's value is destroyed by committee behaviour and delay risk].*

  ---

  **What the Procedure Cannot Do & Where it Misfires:**

  *   **Quantify Precisely:** It relies heavily on qualitative judgement (benefit scaling, probability estimates, bias assessment) rather than numerical calculation. It guides reasoning but doesn't output a number.
  *   **Eliminate Subjectivity:** Steps 4, 5 (intangibles), 6, and 7 are inherently subjective. Different officers might weigh factors differently.
  *   **Handle Extreme Uncertainty:** If the *likelihood* of the evidence changing the decision is very hard to gauge (not just the *potential* benefit), the procedure struggles. Step 4 focuses on benefit *if* it changes things, not the *probability* it will.
  *   **Predict Behaviour Perfectly:** Assessing behavioural reactions (Steps 5 & 6) is speculative, though crucial.
  *   **Override Policy/Law:** If policy *mandates* certain evidence (e.g., EIA screening), Step 2 forces the request regardless of cost-benefit. It only applies to discretionary requests.
  *   **Misfires When:**
      *   Judgements in Steps 4 or 5 are wildly inaccurate (over/underestimating benefits or costs).
      *   Bias risks (Step 6) are misjudged or ignored.
      *   The "live option" analysis (Step 2) is incorrect (e.g., failing to see that refusal is the only defensible option without evidence).
      *   Intangible costs (like reputational harm or political fallout) are completely overlooked in Step 5.
      *   The officer lacks sufficient experience to make the required judgements plausibly.

  This procedure provides a structured, defensible framework rooted in decision theory for weighing discretionary evidence requests under pressure, explicitly addressing common planning complexities. It forces consideration of the *full* cost and the *real* utility of information before imposing burdens or delays.
