  For the hidden resolution... Invariantism feels more poetically satisfying. The envoi can imply identical standards ("same scales") while showing different outcomes. Contextualists might read shifting meanings into "clear" and "know", but the invariantist interpretation holds if all semantic shifts are attributable to practical stakes rather than linguistic meaning. 

  *checks requirements* Envoi must use all end-words - tricky! Making "know", "safe", and "counter" line-enders to emphasize their stability, while embedding "open", "check", "hours" internally to show contextual pressure. 

