answer: |-
  ## Sestina for the Saturday Teller

  The Friday crowds had thinned, the air turned thin.
  I saw the lights still **open**, bright and stark.
  Recalled last week: the same clock's measured **hours**.
  My errand list was short, demands were **safe**,
  No pressing need to verify my thought.
  I told myself, "I **know**," and left the **counter**.

  Across the street, I paused beside the **counter**
  Where coffee steamed. The thought felt sharp, not **thin**.
  What if I'm wrong? The cost? A minor **safe**
  Delay. The doors stood wide, invitingly **open**.
  No doubt took hold. Why second-guess my **know**-
  ledge? Saturday would hold the promised **hours**.

  But what if payroll cuts demand swift **hours**?
  Suppose the check I wrote requires the **counter**
  To clear it fast? That small, persistent **know**-
  ledge flicker grew, no longer wispy, **thin**,
  But urgent. Suddenly, the bright, **open**
  Door seemed a question mark. Was my belief **safe**?

  A teller's nod, recalled, might not be **safe**
  Enough. The risk now measured out in **hours**
  Of frantic worry. What was freely **open**
  To trust before now slammed against the **counter**
  Of consequence. The evidence felt **thin**
  As mist when judged by what I need to **know**.

  Is this the weight that constitutes true **know**-
  ledge? Memory, unchanged, now feels less **safe**.
  The very facts seem stretched, suddenly **thin**,
  Under the pressure of these altered **hours**.
  The stakes transform the view across the **counter**,
  Make certainty seem less securely **open**.

  (No ticket spares the draw, though odds seem **open**,
  A million chances mock the claim to **know**.)
  Back at the bank, I face the polished **counter**.
  "Saturday?" My voice seeks something **safe**.
  The answer holds the weight of crucial **hours**,
  A fragile thread of proof, no longer **thin**.

  ---

  The **open** question: Is the vault door **safe**?
  What **hours** demand this proof? What **counter** weighs
  The **thin**? Do stakes define what we can **know**?

  ---

  **JSON Object:**

  ```json
  {
    "end_words": ["open", "hours", "safe", "counter", "thin", "know"],
    "meaning_shifts": {
      "open": "Shifts from literal physical accessibility (bank doors) to epistemic availability (possibility), then to vulnerability ('question mark'), and finally to abstract chance ('odds seem open').",
      "hours": "Moves from neutral measurement of time to a resource under pressure ('demand swift hours'), then to units of consequence ('weight of crucial hours'), ending as the subject of existential demand ('What hours demand').",
      "safe": "Transitions from emotional comfort ('demands were safe') to epistemic security ('belief safe'), then to financial/emotional security ('Was my belief safe?'), culminating in concrete physical security ('vault door safe').",
      "counter": "Changes from a physical object (teller station) to a metaphorical place of reckoning ('against the counter / Of consequence'), then back to the physical location, finally becoming an abstract agent of measurement ('What counter weighs').",
      "thin": "Evolves from describing sparse atmosphere to the perceived fragility of evidence ('evidence felt thin / As mist'), then to a state of being stretched ('facts seem stretched... thin'), ending as an abstract noun representing scarcity or insufficiency ('The thin').",
      "know": "Shifts from confident self-attribution ('I know') to the abstract concept of knowledge ('constitutes true know- / ledge'), then to the object of urgent need ('what I need to know'), ending as the fundamental epistemic capacity ('what we can know')."
    },
    "the_turn": "Line 19: 'Suppose the check I wrote requires the counter / To clear it fast?' This introduces the high-stakes scenario (paycheck risk), shifting the speaker's assessment of their evidence from sufficient to insufficient without altering the recalled facts.",
    "hidden_resolution": "Invariantist. Evidence: The envoi ('Do stakes define what we can know?') poses the invariantist challenge as a question, implying stakes affect *knowing*, not the meaning of 'know'. The consistent core meaning of 'know' (requiring sufficient evidence) is pressured by varying stakes, reflected in the shifting adequacy of the *same* evidence ('Memory, unchanged, now feels less safe'). The word 'define' in the final question points to meaning, suggesting stakes don't alter it."
  }
  ```

  **Design Notes:**

  1.  **End-Word Choice:** Selected for maximum semantic flexibility within the bank case narrative: `open` (doors/possibility), `hours` (time/urgency), `safe` (security/certainty), `counter` (physical spot/argument/measurement), `thin` (atmosphere/evidence), `know` (core term).
  2.  **Contextual Shifts:** Each word demonstrably shifts sense or reference per stanza. `Counter` moves from physical object to metaphor to abstract agent. `Thin` shifts from descriptive to epistemic qualifier to abstract noun. `Know` moves from speech act to concept to capacity.
  3.  **The Turn:** The high-stakes scenario emerges clearly in Stanza 3 (Line 19), triggered by considering the bounced check consequence. The evidence itself (`Memory, unchanged`) is explicitly noted as constant later (Stanza 5).
  4.  **Hidden Resolution (Invariantist):** The envoi question ("Do stakes define what we can know?") subtly leans invariantist by framing stakes as potentially *defining* knowledge (a condition for knowing) rather than defining the *word* "know". The poem shows the *knowing* getting harder (evidenced by the constant evidence feeling inadequate under pressure) without the word "know" demonstrably changing its core meaning (justified true belief) across contexts. The invariantist reading is *suggested* by the question and the narrative pressure on the evidence, not proven.
  5.  **Lottery Integration:** The parenthetical "(No ticket spares the draw, though odds seem open)" in Stanza 6 directly contrasts the high-stakes bank case with the lottery paradox, feeling organic as a sudden, anxious thought.
  6.  **Envoi:** Uses all six end-words: `open` (mid-line 1), `safe` (end-line 1), `hours` (mid-line 2), `counter` (end-line 2), `thin` (mid-line 3), `know` (end-line 3). It forces the high and low-stakes contexts ("vault door safe" vs. abstract "thin") into direct contact.
  7.  **Poetic Integrity:** Focuses on sensory details (lights, air, coffee, polished counter), internal monologue, and rising anxiety to drive the narrative, ensuring it functions as a poem about doubt and consequence first. The philosophical machinery operates within this human framework.
