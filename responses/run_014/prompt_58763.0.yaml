answer: |-
  That's a sharp analysis – you've pinpointed a core tension in modern drug policy. The assumptions about choice, responsibility, and human nature underlying these models are complex and often contradictory. Let's break it down:

  **1. Portugal's Decriminalization Model: Assumptions**

  *   **Possession/Use:** Primarily views problematic drug use through a **medical/public health lens**, not a moral/criminal one.
      *   **Assumption:** People struggling with addiction or harmful use are often *not* acting as fully rational, autonomous agents in complete control. Addiction is seen as a health condition that diminishes capacity for rational choice. Punishment is ineffective and counterproductive; it increases harm (disease, overdose, crime) and barriers to treatment.
      *   **Responsibility:** Retains a *moderate* element of personal responsibility. The Health Commission (CDT) can impose *fines* or non-criminal sanctions (community service), recognizing that substance use involves choices. However, the primary goal is health assessment and support, shifting the "punishment" towards mandated health interventions rather than criminal penalties. The assumption is that *with support*, individuals can regain control and make healthier choices.
  *   **Dealing/Trafficking:** Views this through a **criminal justice lens**.
      *   **Assumption:** Dealers are generally rational economic actors acting with full agency and intent to profit from an illegal, harmful trade. They are seen as *exploiting* the vulnerability of users and causing societal harm. Punishment is deemed necessary for deterrence, public safety, and disrupting supply.
  *   **Core View:** **Harm Reduction Pragmatism.** It rejects the idea that criminalizing users reduces drug problems. It prioritizes reducing the *harms* associated with drug use (overdose, disease, crime, social exclusion) over enforcing moral absolutes about drug use itself. It assumes the state has a role in protecting individuals from the worst consequences of their potentially impaired choices.

  **2. Partial Legalization (e.g., US Cannabis): Assumptions**

  *   **Legal Sale/Possession:** Views adult cannabis use as a **legitimate personal choice**.
      *   **Assumption:** Adults are fundamentally capable of making informed, autonomous decisions about their own consumption, similar to alcohol. The state shouldn't criminalize this choice for responsible adults. This leans towards classical liberal principles of individual autonomy.
  *   **Employment/Housing Restrictions:** Undercuts the "legitimate choice" assumption significantly.
      *   **Assumption:** While the *state* won't punish the choice, private actors (employers, landlords) retain broad discretion based on:
          *   **Risk Management:** Employers assume drug use (even legal) *might* impair job performance or safety, justifying testing and zero-tolerance policies (especially in safety-sensitive roles). Landlords assume use *might* cause property damage or nuisance.
          *   **Residual Stigma/Moral Judgment:** Despite legalization, deep-seated societal views associating drug use (even cannabis) with irresponsibility, lack of discipline, or potential danger persist. Employers/landlords are allowed to act on these views.
          *   **"At-Will" Philosophy:** In the US context, strong employer/landlord rights often trump individual freedoms in private contracts.
  *   **Core View:** **Contradictory Pragmatism / "Having It Both Ways".** Yes, it tries to reconcile competing values:
      *   **Individual Freedom:** "Adults should be free to choose."
      *   **Societal Control & Risk Aversion:** "But we (society/businesses) don't *fully* trust that choice, reserve the right to penalize it indirectly, and prioritize other interests (workplace productivity, property value, perceived safety)."
      *   **State vs. Private Sphere:** The state steps back from criminalization but empowers private actors to enforce restrictions reflecting societal ambivalence.

  **Do These Practices *Require* These Assumptions?**

  *   **Portugal:** The *health-focused decriminalization of use* strongly depends on viewing problematic users as needing help more than punishment. However, the *fines* component allows for some acknowledgment of initial choice/responsibility without criminalization. The *criminalization of dealing* doesn't *require* viewing dealers as pure rational actors (many face socioeconomic pressures), but the policy *assumes* that criminal penalties are the most effective tool against supply.
  *   **Partial Legalization:** The *legal sale* fundamentally requires viewing adult use as a legitimate choice. However, the *private restrictions* do *not* inherently require viewing users as irresponsible. They could also stem purely from pragmatic risk aversion or strong property/contract rights, *even if* users were seen as fully responsible. The societal stigma *enables* these restrictions but isn't strictly *required* by the policy structure (though it makes them politically/practically viable).

  **Alternative Frameworks These Policies Could Fit:**

  1.  **Portugal's User Approach:** Could fit a broader **social welfare/support model** focused on poverty, trauma, and mental health underlying addiction, not just the medical aspect. Fines might be replaced entirely with social support referrals.
  2.  **Portugal's Dealer Approach:** Could fit a **restorative justice model** focusing on harm caused to communities rather than purely punitive deterrence, especially for low-level dealers.
  3.  **Partial Legalization Restrictions:** Could be justified under a **strict libertarian "freedom of contract"** view, even if drug use is seen as fully responsible: "Employers/Landlords should be free to set any conditions they want." Conversely, restrictions could be *removed* under a **strong positive rights** framework ("Right to housing/employment shouldn't be denied for legal private conduct").

  **Shifting Models: What Would Change?**

  *   **Full "Health-Only" Model (Beyond Portugal):**
      *   **Changes:** All drug possession/use decriminalized *or* legalized. Zero criminal penalties for users. Drug dealing might be heavily regulated (like pharmaceuticals) rather than criminally prosecuted, or treated primarily through public health/social support for those involved in the trade due to vulnerability. Focus shifts entirely to:
          *   Universal access to voluntary treatment on demand.
          *   Widespread harm reduction (safe consumption sites, drug checking, naloxone).
          *   Social services addressing root causes (poverty, trauma, mental health).
          *   Public education focused on health, not morality.
      *   **Required Shifts:** Massive investment in healthcare/social services. Profound cultural shift away from seeing drugs as a moral failing. Acceptance of regulated supply to reduce illicit market harms. Significant reduction in the role of police/courts for drug offenses.

  *   **Full "Freedom-Only" Model:**
      *   **Changes:** All drugs legalized for adult use and treated like other legal goods (alcohol, tobacco, caffeine). Strict regulations on production/sale for safety and to prevent underage access. Crucially:
          *   **End Private Discrimination:** Legal protections against firing/eviction for off-duty use (similar to alcohol protections, with exceptions for genuine impairment *on the job* or safety-sensitive roles with strict definitions). Landlords couldn't ban legal substances consumed responsibly in private units.
          *   Focus shifts to **regulation, consumer safety, taxation, and individual responsibility** (like DUIs for impaired driving).
      *   **Required Shifts:** Complete acceptance of drug use as a matter of personal liberty. Dramatic reduction in societal stigma. Strong legal frameworks protecting individual autonomy from private discrimination based on legal conduct. Robust regulatory systems for all substances. Acceptance of potential increases in use/harm as the price of freedom (though this is debated).

  **Conclusion:**

  You're right to see the conflicting assumptions. Portugal leans towards viewing problematic users as needing support due to diminished control, while punishing dealers as culpable actors. Partial legalization awkwardly tries to grant freedom ("your choice") while allowing society/businesses to heavily penalize that choice ("but we don't trust it/accept its consequences"). Neither model perfectly aligns with a single, coherent view of human agency – they reflect messy political compromises, historical baggage, and pragmatic attempts to manage complex problems with conflicting values (freedom, health, safety, order).

  Moving fully towards either a pure health model or a pure freedom model would require profound societal, legal, and economic changes, challenging deeply held beliefs about addiction, personal responsibility, and the role of the state and private actors.
