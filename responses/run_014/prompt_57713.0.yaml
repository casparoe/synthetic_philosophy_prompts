prompt: |-
  You're a legal philosopher who's put in real time on transitional justice — imagine you're the person a truth commission rings up when it wants to know whether it's allowed to prosecute things that weren't crimes when they happened. Think hard about this rather than giving me the textbook tour; I want a principle I can actually apply, and I want you to be willing to tell me I'm inconsistent.

  I keep having intuitions about retroactive punishment and they don't line up, and I can't tell whether that means I need a more complicated principle or that some of my verdicts are just wrong. Here they are:

  1. The Nuremberg "crimes against peace" count — planning and waging aggressive war — against the men who did exactly that: I think the conviction was illegitimate, even though starting the war was the worst thing any of them ever did. Nobody had ever been prosecuted for aggression and no statute made it a crime.
  2. But the atrocity counts in those same trials, the ones about what was actually done to people: legitimate, no statute needed.
  3. Germany prosecuting the soldiers who shot people trying to get over the Berlin Wall, when East German law not only permitted it but treated it as a duty: legitimate. They were acting under the valid law of their own place and time and I still think convicting them is fine.
  4. Prosecuting a judge who faithfully applied a valid statute of his own regime that criminalized something trivial — say a wartime decree against listening to foreign broadcasts: NOT legitimate. This one wrecks me, because it looks structurally identical to #3 (an official applying the law of the regime he serves) and I want the opposite verdict.
  5. A conscript who fired at the wall under an order he'd have been shot for disobeying: not legitimate to convict him, though the officer who gave the order is fair game.
  6. Retroactively extending a limitations period for a serious crime while the old one still has time left: fine. Retroactively reviving one that already ran out forty years ago: not fine — and I honestly can't say why the line sits there.
  7. Retroactive tax legislation, and retroactive civil liability for old harms (asbestos, poisoned land): basically fine, small twinge only.
  8. Applying a new, harsher sentencing range backwards to a crime committed before it existed: not fine.
  9. Retroactively decriminalizing something, or amending a charge in the accused's favor: obviously fine, and I think any principle that can't explain why this direction is different is broken.
  10. A country abolishes the marital rape exemption and then prosecutes a man for conduct from ten years earlier that was legal then but which he and everybody else knew was monstrous: genuinely don't know. I lean toward legitimate, which makes me nervous about #1 and #4.

  My tentative principle is that retroactive punishment is legitimate only if (a) the defendant could reasonably have known the act was seriously wrong by a standard available to him at the time, independent of the state's say-so, and (b) the tribunal would be willing to apply the same retroactive standard to its own side's conduct. I suspect this is too crude — clause (b) doesn't look like it belongs in a theory of legality at all, it looks like a fairness-of-the-court requirement smuggling itself in.

  So: first brainstorm two or three candidate principles that could capture the list — an "extreme injustice is no law" style move, a notice-and-reliance one, a serious-wrong-versus-regulatory-offense one, something about who's holding the gavel, whatever else you think works better — and say what each has to sacrifice to keep going. Then commit to one. State it precisely, clause by clause, and for each clause tell me which numbered case motivates it and what the clause rules out. Then the part I care about most: which of my verdicts does your principle force me to abandon, and which did I get right for the wrong reason? Point at #3 vs #4 specifically — if your principle can't separate them, say so plainly instead of fudging.

  Finally run it on two cases I didn't list: a transitional government that retroactively criminalizes profiting from public office and goes after businessmen who got rich with the old regime's explicit blessing, and a state that retroactively voids pardons granted by an outgoing dictator to his own officers.

  If the principle you land on already has a name in the literature, give me the name — but don't invent citations, quotes or page numbers, I have no way to check them and I'd rather you just be straight with me. A table mapping your clauses onto my ten cases is fine if that's cleaner.
reasoning: |-
  Okay, the user is a legal philosopher grappling with the ethics of retroactive punishment in transitional justice. They've presented ten specific cases where their intuitions conflict, and they want a principle they can apply consistently. I need to think deeply about this.

  First, I notice the user is frustrated by inconsistencies in their own judgments - especially between cases #3 (prosecuting border guards) and #4 (not prosecuting judges). They want me to call them out if they're being inconsistent, which shows intellectual honesty. The core tension seems to be between formal legality ("it was legal at the time") and substantive justice ("but everyone knew it was wrong").

  The user's tentative principle combines moral knowledge (could they have known it was wrong) and reciprocity (would the tribunal apply it to their own side). But they're right that (b) feels out of place in legality theory - it's more about fairness than legal validity.

  Hmm, let me brainstorm approaches:
  1. The Radbruch doctrine: Extreme injustice negates law. This would cover Nuremberg atrocities and Berlin Wall shootings where acts were fundamentally immoral regardless of state sanction. But it struggles with the judge applying trivial laws (#4) - is that "extreme" injustice?
  2. Notice and reliance: Focuses on whether defendants could foresee punishment. Explains why retroactive decriminalization (#9) is fine (no one relies on being punished). But fails on Berlin Wall guards (#3) - they relied on state approval.
  3. Role differentiation: Distinguishes between officials who actively inflict harm (soldiers, officers) vs those applying laws neutrally (judges). This might split #3 and #4 beautifully. But is it principled or ad hoc?

  The role differentiation approach feels most promising. Let me refine it into a principle:
  - Clause 1: Targeting core harms (explains #2 atrocities vs #4 trivial offense)
  - Clause 2: Personal causation (separates conscript #5 from officer)
  - Clause 3: Moral accessibility (addresses marital rape #10 - knew it was wrong)
  - Clause 4: Temporal proximity for limitations (#6 - expired is different)
  - Clause 5: Sentencing protection (#8 - harsher punishment unfair)

  This forces abandonment of their Nuremberg aggression verdict (#1) - if planning war is a core harm, why not prosecute? And their tax retroactivity comfort (#7) gets questioned - why is civil different?

  For their two new cases:
  - Prosecuting cronies: Probably legitimate under clause 1 (corruption as core harm) and 3 (knew it was wrong)
  - Voiding pardons: Trickier - if pardons were valid under prior law, voiding might violate reliance. But transitional justice may override.

  The user seems to need this for real application, not just theory. I should be blunt about trade-offs - like how this principle might sacrifice some formal legality for substantive justice in transitions. They'll appreciate that honesty.
answer: |-
  Here's a principled framework built from your intuitions, designed for application. I'll be blunt about tensions and force you to abandon some verdicts. Your #3 vs. #4 dilemma is central—my principle *does* separate them, but at a cost.

  **Candidate Principles Considered & Sacrifices:**
  1. **Radbruch Extreme Injustice ("No Law"):** Retroactive punishment is legitimate only if the act violated fundamental, pre-existing moral norms so grave that the prior "law" was no law at all.  
     *Sacrifices:* Your #7 (retroactive tax/civil law fine—not "extreme injustice"), #6 (limitations revival—expired claims aren't "grave"), and struggles with #4 (trivial law application isn't "extreme").  

  2. **Moral Accessibility + Role Responsibility:** Retroactive punishment is legitimate if (a) the act was *morally wrongful by widely accessible standards* at the time, and (b) the defendant had *meaningful agency* to avoid committing it.  
     *Sacrifices:* Your #1 (aggression was arguably morally accessible), partially conflicts with #7 (civil retroactivity may lack "moral wrongness"), and struggles to cleanly address #6.  

  3. **Core Harms & Institutional Role (My Choice):** Resolves your #3/#4 conflict by distinguishing between *inflicting direct harm* and *applying procedural authority*.  

  ---

  **Adopted Principle: The Agency-Dependent Core Harm Principle**  
  *(No direct literature name; synthesizes Radbruch, Fuller, and transitional justice pragmatism)*  

  **Clause 1: The act must have inflicted, or directly enabled, severe physical, psychological, or existential harm to individuals or communities.**  
  - *Motivated by:* #2 (atrocities), #3 (shooting escapees), #10 (marital rape—existential harm).  
  - *Rules out:* #4 (trivial offense—no severe harm), #7 (tax/civil retroactivity—harm is economic, not core).  
  - *Why?* Focuses on acts that destroy human dignity, not regulatory breaches.  

  **Clause 2: The defendant must have exercised significant personal agency in causing the harm, beyond mere compliance with orders or law.**  
  - *Motivated by:* #3 (border guard actively shot), vs. #5 (conscript under duress), vs. #4 (judge neutrally applying statute).  
  - *Rules out:* #5 (low-agency conscript), #4 (judge as instrument of system).  
  - *Why?* Punishes *perpetrators*, not cogs. "Following orders/law" isn't a shield for direct harm-infliction.  

  **Clause 3: The wrongfulness of the act must have been reasonably knowable through widely held moral/legal norms at the time, independent of the regime’s dictates.**  
  - *Motivated by:* #10 (marital rape—known monstrous), #2 (atrocities—universally condemned), #3 (shooting unarmed civilians—basic morality).  
  - *Rules out:* #1 (aggression—no established *legal* norm, moral ambiguity in 1945), #4 (trivial decree—no moral weight).  
  - *Why?* Avoids punishing acts that were genuinely ambiguous.  

  **Clause 4: Procedural changes (limitations, pardons) must not revive claims where the defendant’s reliance on finality was reasonable and material.**  
  - *Motivated by:* #6 (reviving expired limitations unfair—reliance crystallized), #9 (decriminalization always fair—no reliance on being punished).  
  - *Rules out:* Retroactively reviving time-barred claims (#6 expired), or voiding pardons if relied upon (see new case below).  
  - *Why?* Balances justice with legal certainty.  

  **Clause 5: Sentencing ranges cannot be retroactively increased.**  
  - *Motivated by:* #8 (harsher sentence unfair—specific reliance on penalty scale).  
  - *Rules out:* Retroactive sentence hikes.  

  ---

  **Your Verdicts My Principle FORCES You to Abandon:**  
  - **#1 (Nuremberg aggression):** *Must be LEGITIMATE.* Clause 1 (severe harm—war causes mass death) and Clause 3 (aggression was condemned by Kellogg-Briand Pact, natural law traditions) are met. Your rejection is inconsistent with #3 and #10.  
  - **#7 (Retroactive tax/civil law):** *Probably ILLEGITIMATE.* Fails Clause 1 (not core harm). Your "twinge" is right—this is where my principle bites.  

  **Verdicts You Got Right for the WRONG Reason:**  
  - **#4 (Judge applying trivial law):** You said illegitimate—correct, but not because it's "structurally identical" to #3. #3 involves *direct harm-infliction* (Clause 1+2), #4 is *procedural application* without agency or core harm.  
  - **#6 (Limitations revival):** Your "line" is reliance-based finality—correct, but Clause 4 makes it explicit.  
  - **#9 (Retroactive decriminalization):** You said fine—correct, but because it aligns with reliance (no one relies on being punished).  

  **#3 vs. #4 Specifically:**  
  - **#3 (Berlin Wall guard):** *Legitimate under Clause 1 (severe harm—killing), Clause 2 (personal agency—pulled trigger), Clause 3 (knowable wrong—murder is universally wrong).*  
  - **#4 (Judge applying trivial law):** *Illegitimate—fails Clause 1 (no severe harm), Clause 2 (no agency—acted as judicial functionary).*  
  The distinction is **harm-infliction vs. procedural compliance**.  

  ---

  **New Cases Applied:**  
  1. **Retroactively criminalizing profiteering from public office:**  
     - *Clause 1:* Severe harm? Yes—corruption undermines social trust, diverts public resources.  
     - *Clause 2:* Significant agency? Yes—businessmen actively sought/exploited patronage.  
     - *Clause 3:* Knowable wrong? Yes—bribery/corruption universally condemned, even if regime endorsed it.  
     → **LEGITIMATE.**  

  2. **Retroactively voiding dictator’s self-pardons:**  
     - *Clause 1:* Severe harm? Pardons shield core harms (meets Clause 1 indirectly).  
     - *Clause 2:* Agency? Officers caused harm (Clause 2 already satisfied for them).  
     - *Clause 4:* Reliance on finality? Pardons create strong reliance—voiding them post-transition breaches legal certainty.  
     → **ILLEGITIMATE** if pardons were formally valid. Better to prosecute *despite* pardon (ignoring it) than retroactively void it.  

  **Summary Table:**  
  | Your Case | Principle Verdict | Clause(s) |  
  |-----------|-------------------|-----------|  
  | 1         | Legitimate        | 1, 3      |  
  | 2         | Legitimate        | 1, 2, 3   |  
  | 3         | Legitimate        | 1, 2, 3   |  
  | 4         | Illegitimate      | Fails 1, 2|  
  | 5         | Illegitimate      | Fails 2   |  
  | 6 (extend)| Legitimate        | —         |  
  | 6 (revive)| Illegitimate      | 4         |  
  | 7         | Illegitimate      | Fails 1   |  
  | 8         | Illegitimate      | 5         |  
  | 9         | Legitimate        | 4 (implied)|  
  | 10        | Legitimate        | 1, 3      |  

  **The Trade-Off:** This principle prioritizes *transitional justice's moral urgency* over strict legality for **core harms**, but protects procedural reliance and low-agency actors. It forces you to convict the Nuremberg aggressors and acquit the tax evader—if you can’t stomach that, Clause 3 needs weakening. But that risks collapsing #3 and #4. Hard lines require hard choices.
