  Here’s a focused argument defending the etiological account against the causal-role view, centered on your core concern about novel trait roles. This is structured for direct adaptation into your paper:

  ### The Etiological Account of Function: Preserving Explanatory Power and Normative Clarity

  **Thesis:** The etiological account of biological function—which defines a trait’s function by its selective history—is superior to the causal-role account because it maintains a crucial distinction between a trait’s *selected effect* and its *incidental benefits*, thereby preserving the explanatory and normative power of functional attributions in biology.

  #### I. The Core Virtue: Anchoring Function to Historical Explanation
  The etiological account grounds function in natural selection’s causal history: a trait’s function is *the effect for which it was maintained by selection*. This links function directly to the **explanation for the trait’s existence and persistence**. For instance, the vertebrate heart’s function is pumping blood because ancestrally, variants with superior pumping capacity outreproduced rivals. This answers the question, *"Why do hearts exist in this lineage?"*  

  The causal-role account, defining function as any reliable causal contribution a trait makes to a system’s current activity (e.g., "the heart’s function is to produce sound pulses in medical imaging"), severs this explanatory link. It conflates *why the trait is present* with *what the trait incidentally does now*.  

  #### II. Novel Roles: Why Denying "New Functions" is a Strength, Not a Weakness
  Consider a trait repurposed in a new environment:  
  - **Example:** Ancient whale pelvises were selected for hind-limb attachment in terrestrial ancestors. Post-transition to aquatic life, they no longer anchor limbs but may now stabilize reproductive organs. The causal-role account labels pelvis-stabilization a "new function." The etiological account denies this, maintaining its function is *only* limb-anchorage (though now vestigial).  

  **Why this denial is a virtue:**  
  1. **Preserves the Trait’s Explanatory History:**  
     Calling pelvis-stabilization a "function" obscures why pelvises exist: they are relics of selection for locomotion, not adaptations for reproduction. Etiology forces us to ask: *"Was this trait shaped by selection for this role?"* If not, labeling it a "function" misattributes its evolutionary cause.  
     
  2. **Safeguards the Concept of Malfunction:**  
     If a whale pelvis fails to stabilize organs (its causal-role "function"), is it *malfunctioning*? Intuitively, no—it never had that selected function. The etiological account rightly restricts malfunction to failures of *historically selected performance* (e.g., a heart that fails to pump). Causal-role’s flexibility implausibly implies that any trait failing at *any* current causal role is "broken," even if that role is evolutionarily accidental.  

  #### III. Addressing Key Objections
  **Objection 1:** *"Environmental changes erase functions, making function contingent and ephemeral."*  
  - **Reply:** This reflects biological reality. If an environment shifts so drastically that a trait’s selected effect no longer contributes to fitness (e.g., human appendixes in sterile modern societies), the trait *does* become functionless—a vestige. This highlights adaptation’s context-dependence. The causal-role account, by contrast, implausibly suggests functions materialize or vanish with every ecological shift.  

  **Objection 2:** *"Evolutionary histories are often inaccessible, making etiological functions unknowable."*  
  - **Reply:** While histories can be hard to reconstruct, this is an epistemic challenge, not a flaw in the theory. Biologists *infer* past selection from comparative anatomy, fossil records, and fitness correlates precisely because function *is* historical. The causal-role account sidesteps history for convenience but sacrifices explanatory depth: knowing a trait *currently* contributes to survival does not explain *why it exists*.  

  #### Conclusion: Why Etiology Matters for Biology  
  The etiological account’s insistence that functions are anchored in selective history—not current utility—is essential for distinguishing *adaptations* from *exaptations*, and *functions* from *beneficial side effects*. This distinction allows biologists to:  
  - Explain trait origins ("Hearts exist *because* they pumped blood").  
  - Diagnose malfunctions ("A heart failing to pump is broken, even if it hums pleasantly").  
  - Avoid teleological drift (e.g., claiming whale pelvises "exist for" organ stabilization).  

  While the causal-role account usefully describes systemic interactions, it fails as a theory of *biological function* by conflating a trait’s raison d'être with its contingent effects. The etiological account, by tethering function to evolutionary explanation, remains indispensable for understanding life as a historical phenomenon.  

  ---

  **Key Strengths for Your Paper:**  
  - Directly engages your focal issue (novel roles) as a *virtue* of etiology.  
  - Uses concrete examples (whale pelvis, heart) to illustrate abstract distinctions.  
  - Anticipates and rebuts two major objections concisely.  
  - Emphasizes biology’s explanatory needs (trait origins, malfunction).  
  - Avoids overgeneralizing; targets the core disagreement.  

  **Tips for Integration:**  
  - Replace examples with others if preferred (e.g., human appendix, feather exaptation for flight).  
  - Add citations (e.g., Millikan for etiology; Cummins for causal-role).  
  - Define terms (e.g., "vestigial," "exaptation") on first use in your paper.
