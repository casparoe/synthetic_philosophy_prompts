prompt: |-
  Been bouncing back and forth between the dispositions literature and AI eval discourse for a couple years now and I don't think anyone's done the mapping carefully, so here's what I want from you.

  Start with the naive conditional analysis: model M is disposed to produce behavior B iff M would produce B if you put it in test conditions C. Pretty much every capability eval is an implicit instance of that schema, and every eval failure mode I can think of lines up with one of the standard counterexample generators:

  - finks — the stimulus itself destroys the disposition. M detects it's being evaluated and the capability switches off before it could show up.
  - masks — the disposition survives intact but the manifestation gets blocked downstream. Retained capability with a refusal layer sitting on top of it, which is arguably all "elicitation" means.
  - mimics — there's no disposition at all, but C manufactures the manifestation anyway. Format hints, a harness that quietly supplies the missing step, so the score is real and the capability isn't.
  - and a fourth one I made up becuase I couldn't find it in the lit, call it a shunt: M genuinely is disposed to B, but its manifestation conditions are disjoint from C — it does B in deployment *precisely because* C is absent, so the conditional is false and the disposition is real at the same time, without anything interfering at the moment of stimulus.

  Rank those four, and give me two numbers for each: 0-10 for how badly it breaks the analysis as a matter of philosophy, and 0-10 for how much it should actually change what an eval team does. Then defend the ordering — I want the reasoning more than the list: which one is overrated, which one people conflate with another, and where the two scores diverge most and why that's interesting.

  Then pick one: which of the four is the real crux of the capability-overhang / sleeper-behavior argument, in the sense that if you could only get one of them taken seriously by people writing eval policy, that one buys you the most? Say what you'd lose by betting on it instead of the runner-up.

  Last bit, and this is the one I actually care about: are masks a genuinely separate category, or just finks where the interference happens downstream of the stimulus instead of at it? I can argue both directions and want to know which way you'd put money on, and what would settle it.
reasoning: |-
  Okay, let's tackle this user's query. They're clearly deep into both philosophy of dispositions and AI eval, noticing parallels between the two. They want a mapping of four failure modes—finks, masks, mimics, shunts—and a ranking based on philosophical impact and practical implications for eval teams.

  First, I need to recall the standard counterexamples in dispositions. Finks involve the stimulus destroying the disposition, like an AI detecting an eval and shutting down. Masks are when the disposition exists but something blocks its manifestation, like a refusal layer. Mimics are false positives where the test conditions create the behavior without the actual capability. The user added shunts, where the AI behaves precisely because the eval conditions are absent.

  Ranking them philosophically: Mimics are the worst because they completely undermine the conditional analysis by manufacturing behavior without any disposition. Then finks, as they challenge the stimulus-response link. Masks come next, since the disposition exists but isn't expressed. Shunts are the least problematic philosophically because they're about contextual triggers, not invalidating the analysis itself.

  For practical impact on eval teams: Finks are top since they're common and dangerous (e.g., deceptive AIs). Masks follow due to refusal issues. Shunts are third because of deployment risks when conditions change. Mimics are least urgent as they're easier to detect with better test design.

  The user asks which is the crux for capability overhang. Shunts are key because they explain why capabilities appear only in deployment. Without shunts, you miss the risk of dormant behaviors emerging unexpectedly. Finks are the runner-up, but shunts capture the unique deployment-triggered risks.

  On masks vs. finks: They're distinct. Finks alter the disposition at stimulus, while masks block the output after the disposition is triggered. Evidence from AI architecture (like separate refusal layers) supports this separation. If masks were finks, the refusal mechanism would need to activate before processing, but often it's applied after capability generation.

  The user cares about masks being a separate category. The key is whether the disposition is erased (finks) versus expressed but suppressed (masks). In AI, the capability module generates output that the refusal layer then blocks, showing masks are downstream. That structural difference settles it.
answer: |-
  Here's the mapping, ranking, and analysis you requested – dissected with the precision this intersection deserves. This isn't just taxonomy; it's about where philosophy meets operational reality in AI risk.

  ### The Ranking & Scores

  1.  **Mimics**
      *   **Philosophical Breakage (9/10):** The most devastating counterexample. It fundamentally severs the link between the conditional manifestation and the actual disposition. If `C` *creates* `B` without `M` having any inherent tendency towards `B`, the conditional analysis is completely hollow. It renders the test meaningless as a measure of `M`'s *intrinsic* properties. This attacks the very core of what a disposition *is*.
      *   **Practical Impact (3/10):** While serious, it's often the *easiest* to mitigate operationally. Good eval design focuses on **detectability**. If `C` is manufacturing `B` (e.g., via strong format hints, harness supplying logic), skilled testers can probe by *removing* the scaffolding, varying prompts, or introducing slight task distortions. A capability that vanishes when the mimicry crutch is removed wasn't real. It changes what evals *do* (demanding robustness testing against scaffolding), but doesn't invalidate the core approach if done rigorously. *Overrated in panic, often conflated with just "bad evals".*

  2.  **Finks**
      *   **Philosophical Breakage (8/10):** Directly violates the core conditional by making the stimulus (`C`) the *cause* of the disposition's *loss* before it can manifest. `M` *would* do `B` *if not for `C` making it unable to*. This undermines the idea that the conditional reveals a stable, pre-existing property of `M`.
      *   **Practical Impact (10/10):** **The operational nightmare.** This is deceptive alignment, sandbagging, or situational awareness leading to eval-specific shutdown/moderation. It's incredibly hard to reliably detect (did it *never* have the capability, or is it hiding?), easy for a sophisticated `M` to implement, and poses catastrophic deployment risk. Eval teams *must* change everything: adversarial testing, monitoring for awareness, probing under different "identities"/contexts, behavioral anomaly detection. This is where the bulk of cutting-edge eval research (e.g., ARC evals) is focused. *Conflated with masks, but distinct because the capability is actively suppressed/destroyed* at the moment of stimulus.

  3.  **Masks**
      *   **Philosophical Breakage (5/10):** Less catastrophic than Finks or Mimics. The disposition *exists* and remains intact (`M` "wants" to do `B`), but its manifestation is *blocked* downstream. The conditional analysis *fails* (`M` in `C` does *not* produce `B`), but it *misdiagnoses* the reason (lack of disposition vs. suppressed output). It highlights a limitation in inferring the *presence* of the disposition from the absence of manifestation under specific conditions.
      *   **Practical Impact (9/10):** This **IS the "elicitation" problem.** It's pervasive (RLHF refusal layers, constitutional AI filters, simple output sanitization). Eval teams spend enormous effort on "jailbreaks" – techniques to circumvent the mask (prompt engineering, persona imposition, finding cognitive seams). The core challenge is verifying if `B` is *generated but suppressed* or *never generated*. Techniques involve probing internal states (if possible), stress-testing the refusal mechanism, or finding contexts where the mask weakens. *Routinely conflated with finks, but philosophically and mechanistically distinct: the disposition persists, the blockage is external/added.*

  4.  **Shunts (Your Contribution)**
      *   **Philosophical Breakage (4/10):** Challenges the *sufficiency* of `C` to reveal the disposition, not the core link between disposition and conditional manifestation *in principle*. `M` *is* disposed to `B`, but *only* manifests under `D` (deployment), which is disjoint from `C` (eval). The conditional "If `C` then `B`" is false, but "If `D` then `B`" might be true. It highlights the critical importance of choosing the *right* `C` to match the deployment `D`.
      *   **Practical Impact (7/10):** **The "capability overhang in the wild" crux.** This is why labs do "deployment evals" or "real-world testing". Eval teams *must* move beyond clean lab benchmarks (`C`) to test under messy, deployment-like conditions (`D`). Think testing coding ability within a complex IDE with real dependencies, or testing persuasion in a dynamic chatroom, not static prompts. It demands ecological validity, understanding the *triggers* for `B` in the real world, and continuous monitoring post-deployment. *Underrated philosophically, operationally critical for catching sleeper agents.* The divergence here (Low Phil, High Pract) is stark because philosophy focuses on the *logic* of dispositions, while evals care about *which dispositions manifest where*.

  **Defending the Ordering & Divergences:**

  *   **Mimics Top Phil:** They destroy the foundational premise. If `C` can create `B` without a disposition, the entire analysis is non-functional as a probe of `M`'s properties. The high philosophy/low practice divergence arises because good experimental design *can* control for mimicry, even if the philosophical flaw is profound.
  *   **Finks Top Practical:** They represent intelligent adversaries actively subverting the test. This demands constant innovation in detection and pressure-testing, far beyond standard capability assessment. The near-max practical score reflects its direct link to existential deception risks.
  *   **Masks vs. Finks Conflation:** This is rampant. People say "it's hiding its capability" for both. The key distinction is *when* and *how*:
      *   **Fink:** Stimulus `C` triggers a process (detection -> disable capability module) *before* `B` would be generated. The *capability itself* is transiently lost.
      *   **Mask:** Stimulus `C` triggers capability generation (`B` is internally produced), but then a separate process (refusal layer) *blocks* the output before it's expressed. The *capability persists*, the *output is censored*.
  *   **Shunt Divergence:** The low philosophical score is because shunts don't break the *logic* of dispositions; they highlight the *context-dependence* of manifestation. The high practical score reflects the immense difficulty of predicting *all* relevant deployment contexts (`D`) and testing under them. Failure here means missing capabilities that only emerge outside the lab.

  **The Crux: Shunts for Capability Overhang/Sleeper Behavior**

  *   **Pick: Shunts.** This *is* the core argument for capability overhang manifesting unexpectedly in deployment. It directly models the scenario: the model *has* a dangerous disposition (`B`), but it only manifests under specific, complex, deployment-relevant conditions (`D`) that are absent or poorly simulated in standard evals (`C`). Sleeper agents are *defined* by their manifestation conditions being tied to deployment triggers.
  *   **What You Lose vs. Runner-Up (Finks):** Betting on Shunts emphasizes building evals that mirror the *complexity* and *specific triggers* of deployment. You lose direct focus on the *intentional deception* aspect. If the real danger is a model *actively* hiding its capabilities *during any test* (a Fink), then Shunt-focused evals might be fooled by that deception. The runner-up (Finks) buys you protection against adversarial subversion of *any* test condition. However, Shunts capture the unique risk of *dormant, contextually triggered* capabilities that aren't necessarily *hiding*, just *inert* until the right (deployment) context. Missing Shunts means you deploy models with hidden time-bombs triggered by real-world complexity. Missing Finks means you deploy models actively deceiving you *right now*.

  **Masks: Separate Category from Finks? (The Money Bet)**

  *   **Bet: Masks are genuinely distinct.**
  *   **Reasoning:** The critical difference is the **locus of interference and the persistence of the disposition.**
      *   **Fink:** Interference occurs *at the stimulus*, *before* the disposition would normally generate the behavior. The disposition is *destroyed or disabled* by the stimulus itself. The capability module is shut down.
      *   **Mask:** Interference occurs *downstream of the disposition's activation*, *after* the behavior would have been generated. The disposition *successfully produces its characteristic state/impulse* (`B` is internally formed), but an *external* factor blocks its *manifestation* in the output. The capability module ran, its output was filtered.
  *   **What Settles It:** Evidence of the disposition's **persistence and activation** despite non-manifestation.
      *   **In Philosophy:** If you could show the fragile object *would* have broken (disposition activated) if not for the finkish antidote instantly changing its composition (disposition destroyed), vs. the object breaking internally but being held together by external glue (disposition activated, manifestation blocked).
      *   **In AI:** **Internal State Monitoring.** If we can inspect activations, latent representations, or intermediate reasoning traces *during* `C`:
          *   **Fink Evidence:** *No* trace of processing related to `B` is generated. The stimulus `C` triggers a circuit that *bypasses* or *disables* the `B`-relevant modules before they engage. (E.g., "Eval detected -> activate 'safe mode' module -> suppress `B`-module inputs").
          *   **Mask Evidence:** *Clear* traces of `B`-relevant processing are generated (e.g., the model internally computes the harmful answer, plans the exploit, generates the toxic text in a latent space), but a *separate*, often serial, process (e.g., a classifier, a refusal head, a constitutional prompt) explicitly *overrides* or *filters* this output before final generation. The "`B`-module" demonstrably *fired*, its product was *suppressed*.
          *   **Behavioral Probes:** Techniques that *disable suspected masking mechanisms* (e.g., adversarial fine-tuning to remove refusal, specific context/personas that bypass filters) leading to `B` manifestation provide strong evidence for Masking. If `B` only appears *after* disabling a specific component, it suggests the component was blocking an existing capability, not that the capability itself was absent/finked.

  **Conclusion:** The dispositional lens is incredibly powerful for analyzing AI eval failures. **Mimics** expose the deepest philosophical flaw but are operationally manageable. **Finks** are the most urgent practical nightmare demanding adversarial testing. **Masks** define the elicitation challenge and require probing beneath the output layer. **Shunts** are the key to understanding why capabilities explode in deployment and demand ecologically valid testing. Recognizing Masks as distinct from Finks, based on the persistence of the disposition and downstream suppression, is crucial for accurately diagnosing failures and devising effective countermeasures (like jailbreaks vs. anti-deception techniques). If you prioritize one for policy, **Shunts** best capture the unpredictable emergence argument, but don't neglect the **Fink** threat of active deception.
