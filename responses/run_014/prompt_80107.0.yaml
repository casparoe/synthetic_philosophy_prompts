answer: |-
  ## Exhibit Recommendation: Harwick 1907 Lockout – Embracing the Layers

  **To:** Harwick Historical Society Curatorial Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Date]  
  **Subject:** Proposed Exhibit Structure for the 1907 Shipyard Lockout – Beyond Either/Or  

  The challenge before us is profound: how do we present the 1907 lockout when our sources are fragmented, partisan, and incomplete? Both positions on the committee – seeking a single definitive narrative or presenting two partisan accounts side-by-side – arise from valid historical concerns. The desire for a "definitive account" reflects a commendable respect for the established sequence of events (as recorded in council minutes/logs) and a yearning for clarity our visitors expect. It is not naive to want coherence; it’s a natural human impulse, especially for a historical society entrusted with preserving Harwick’s story. Letting "sources speak for themselves," however, is an interpretive act the moment we select *which* sources speak and *how* we arrange their voices.

  Similarly, juxtaposing the shipyard's "outside agitators" frame with the union's "heroic victory" narrative avoids imposing a single authority but risks implying a false equivalency. It presents two interpretations without context for *why* these accounts differ so drastically, potentially leaving visitors adrift or validating the idea that history is merely a matter of opinion.

  **Therefore, I propose a third path: an exhibit structured around "Contested Ground," explicitly framing the lockout through the lens of competing narratives and historical interpretation itself.** This approach acknowledges the validity embedded in each committee position while transcending their limitations. It uses the very nature of our sources as the core of the story.

  ### Proposed Concrete Exhibit Structure

  1.  **The Spark & The Sequence (The "What"):**
      *   **Central Spine:** Begin with a clear, chronological timeline based firmly on the indisputable facts from the Town Council minutes, incident logs, police records, etc. (e.g., "Lockout declared June 3rd," "Picket lines established June 5th," "Clash at Main Gate June 12th," "Lockout ends August 20th").
      *   **Focus:** Establish the essential framework – dates, key actions, official responses. This satisfies the need for a factual anchor and provides the skeleton upon which interpretations are built.

  2.  **Voices from the Divide (The Competing "Why"):**
      *   **Dual Perspectives:** Present the two primary partisan narratives *side-by-side*, but crucially, within distinct, clearly labeled sections representing their origins.
      *   **The Shipyard View:** Display front pages/headlines from the town paper (identifying its ownership prominently), excerpts from shipyard manager reports or owner statements. Use the language of "riot," "disorder," "outside influence." Include artifacts they might highlight (e.g., damaged property photos, police reports emphasizing violence).
      *   **The Union View:** Display pages/images from the commemorative history, union leaflets from 1907 (if any survive), oral history snippets (even if recorded later). Use the language of "solidarity," "struggle," "injustice." Include artifacts they might highlight (e.g., photos of crowded union halls, lockout hardship relief lists, images of determined workers).
      *   **Crucial Element:** **Contextualize each perspective.** Don't just present the quotes/images. Briefly explain *who* produced this narrative, *when* (1907 vs. 1947!), and likely *why* (to shape public opinion, justify actions, build morale, commemorate sacrifice). Ask: "What story is this source trying to tell? What might it be leaving out?"

  3.  **The Silences & The Process (The "How We Know"):**
      *   **The Gaps:** Highlight the limitations of the "neutral" official records. Reproduce a council minute page discussing street repairs necessitated by a clash but saying nothing about *why* the clash occurred. Display a log entry noting "crowd dispersed" without describing its composition or grievances.
      *   **Interrogating Sources:** Include a panel (or interactive element) asking: "What questions do these sources *not* answer? What voices are missing? (e.g., non-union workers, townspeople uninvolved, families). How does the *when* of a source (1907 vs. 1947) change its perspective?"
      *   **The Curator's Role:** Be transparent. Include a short panel: "Building this Exhibit: Our Choices." Briefly state: "Faced with conflicting accounts, we chose to show you the layers. We used council records for the sequence but juxtaposed the powerful, competing stories told *at the time* and *in memory*. We encourage you to consider the origins and purposes of each piece of evidence."

  4.  **The Visitor's Task (Synthesis):**
      *   **Concluding Question:** End the main exhibit with a prominent question: "Harwick 1907: Riot, Victory, or Something More Complex? What story emerges for you when you consider all these voices and silences?"
      *   **Reflection Space:** Provide a simple area (a board, digital kiosk) for visitors to briefly note their thoughts or reactions after encountering the multiple perspectives.

  ### Why This Structure Addresses Our Concerns

  *   **Respects the Definitive-Account Position:** It provides the essential, agreed-upon sequence of events as the factual backbone.
  *   **Honors the Partisan Narratives:** It presents both the shipyard and union perspectives prominently and vividly, allowing their voices to be heard.
  *   **Moves Beyond Naive Objectivity/Superficial Juxtaposition:** It explicitly *teaches interpretation*. By contextualizing the sources and highlighting silences, it shows visitors *why* history is contested and *how* narratives are constructed. It doesn't pretend the sources speak for themselves; it shows *how* they speak and *what* they refuse to say.
  *   **Acknowledges Our Role:** It is honest about the curatorial act of selection and framing without abandoning our duty to provide reliable information.
  *   **Engages Visitors:** It transforms the visitor from a passive recipient of "the truth" into an active participant weighing evidence and forming their own understanding of a complex past.

  This "Contested Ground" structure doesn't claim to have "solved" the lockout. Instead, it faithfully represents the nature of our sources and the enduring complexity of this pivotal event in Harwick's history. It provides facts, voices, context, and transparency, empowering our visitors to grapple with the past meaningfully. I urge the committee to embrace this layered approach for a richer, more honest, and ultimately more educational exhibit.
