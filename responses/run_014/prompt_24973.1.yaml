  I've been thinking about Pascal's mugging for a while now. For anyone who hasn't heard of it: a mugger threatens to inflict an astronomically huge amount of suffering on an astronomically huge number of people unless you hand over your wallet. The probability they can actually do this is vanishingly small, but the expected disutility is still enormous because the stakes are so high. So expected utility theory seems to say you should pay up. That can't be right — but I'm not sure exactly where the reasoning fails, or whether it fails at all.

  I want your actual credence that the correct response to a Pascal's mugging is to pay the mugger — not "it depends on your decision theory," not a survey of positions, but a number between 0 and 1. Decompose it: what are the sub-questions this depends on, what probability do you assign to each, and how do they combine? For instance, how much weight are you putting on the claim that we should simply dismiss sufficiently tiny probabilities as effectively zero, versus the claim that utility is bounded, versus the claim that the mugger's threat shouldn't be treated as a coherent hypothesis at all? Give me the term you're least confident in and tell me what evidence or argument would shift your number the most.

  Start with your bottom-line number and then walk me through the decomposition. No preamble, no restating the question.
