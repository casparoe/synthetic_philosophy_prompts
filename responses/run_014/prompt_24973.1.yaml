  Combining these, I use a noisy-OR model: paying is incorrect if any of these reasons hold. The probability that at least one is true is 1 - (1-0.7)*(1-0.8)*(1-0.6) = 1 - (0.3*0.2*0.4) = 1 - 0.024 = 0.976. So my bottom-line credence against paying is 97.6%, meaning I'm very confident you shouldn't pay.

