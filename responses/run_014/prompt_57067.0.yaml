answer: |-
  Here's a systematic translation of heritability concepts into your econometric vocabulary, followed by a residue report testing your hunch and identifying untranslatable elements. I'll flag where the mapping works cleanly, where it distorts, and where no equivalent exists.

  ---

  ### **Core Translation Framework**
  1. **Broad-sense heritability (H²)**  
     *Genetics*: Proportion of phenotypic variance (Var(P)) attributable to *total genetic variance* (Var(G)).  
     *Econometrics*: **Adjusted R² from a saturated model** with all genetic variants (SNPs, alleles) as regressors. Captures both additive and non-additive (dominance/epistasis) effects.  

  2. **Narrow-sense heritability (h²)**  
     *Genetics*: Proportion of Var(P) due to *additive genetic variance* (Var(A)). Predicts response to selection.  
     *Econometrics*: **R² from a linear regression of phenotype on polygenic score (PGS)** – but *only if* the PGS perfectly captures additive effects. Equivalent to the **squared correlation between genotype and phenotype** in a linear model.  

  3. **Variance Partitioning**  
     *Genetics*: Var(P) = Var(A) + Var(D) + Var(I) + Var(E) + Cov(G,E) + ...  
     *Econometrics*: **Variance decomposition of the dependent variable (Y)** into contributions from orthogonalized regressors. Cov(G,E) is **omitted variable bias** if E is unobserved and correlates with G.  

  4. **Genotype-Environment Interaction (G×E)**  
     *Genetics*: Genetic effects differ across environments (e.g., same genotype has different effects in rich/poor fields).  
     *Econometrics*: **Interaction term (β₃·G·E) in a linear model**. Omission causes **specification error** (heterogeneous treatment effects).  

  5. **Genotype-Environment Correlation (rGE)**  
     *Genetics*: Genotypes covary with environments (e.g., genetic propensity for education leads to higher SES).  
     *Econometrics*: **Endogeneity problem**: G is correlated with unobserved E. Biases h² estimates (akin to **OVB**).  

  6. **Twin Studies (MZ/DZ comparisons)**  
     *Genetics*: Infers h² from phenotypic correlation of monozygotic (MZ) vs. dizygotic (DZ) twins.  
     *Econometrics*: **Natural experiment using within-twin-pair variation**. Assumes:  
     - MZ twins share 100% genes → **Within-MZ variation = "environmental" variation**.  
     - DZ twins share 50% genes → **Within-DZ variation = "environmental + 50% genetic" variation**.  
     *Threats*: Violations of the **equal environments assumption (EEA)** are like **selection bias** in treatment assignment.  

  7. **Missing Heritability**  
     *Genetics*: Gap between h² (from twin studies) and variance explained by GWAS-based PGS.  
     *Econometrics*: **Measurement error in genotype data**:  
     - Unobserved rare variants = **omitted variables**.  
     - Poorly estimated SNP effects = **attenuation bias**.  
     - Non-additive effects = **model misspecification**.  

  8. **Population/Environment Relativity**  
     *Genetics*: h² is population-specific (e.g., low in homogeneous environments).  
     *Econometrics*: **R² is sample-dependent**. Your seed experiment shows:  
     - Within-group R² (genotype → phenotype) is high.  
     - Between-group variation is driven by **fixed effects** (environment shift).  
     → **External validity failure** when extrapolating h² to new populations.  

  ---

  ### **Testing Your Hunch**  
  **Your Claim 1**: *"The seed experiment is just external validity + R² sample-dependence."*  
  **Verdict**: **Correct, but incomplete**. The experiment also illustrates:  
  - **G×E interaction**: If seeds respond non-linearly to soil quality, the *mechanism* differs from a simple level shift.  
  - **Non-transportability**: h²=0.8 in each field, but the **causal effect of genotype** (β_G) may change with environment (violates constant effects assumption).  

  **Your Claim 2**: *"Covariance terms are just non-orthogonal regressors."*  
  **Verdict**: **Mostly correct**. Attributing variance with correlated G and E is identical to:  
  - **Shapley decomposition**: Fairly partitioning R² among non-orthogonal predictors.  
  - **ANOVA pitfalls**: Order of entry changes variance shares (e.g., entering G before E vs. E before G).  
  *But*: Geneticists often treat Cov(G,E) as a *biological parameter* (e.g., "genes *cause* exposure to environments"), not just a statistical confound.  

  **Your Claim 3**: *"Heritability isn’t heritable" = "R² isn’t a structural parameter".*  
  **Verdict**: **Direct translation**. h² is a **property of the data-generating process in a specific context**, not an intrinsic feature of the trait. Changing the environment distribution alters h² without changing genetics.  

  ---

  ### **Residue Report: What Doesn’t Translate**  
  | **Genetic Concept**       | **Translation Status**                               | **Reason** |  
  |----------------------------|------------------------------------------------------|------------|  
  | **Non-additive variance** (dominance/epistasis) | **Distortion** | Econometrics treats non-additivity as **interaction terms** (e.g., SNP₁·SNP₂). Geneticists see it as *emergent biological properties* not captured by linear PGS. |  
  | **"Heritability of individual development"** | **No equivalent** | Geneticists debate whether h² informs "how traits develop *within* individuals" (e.g., "is my IQ 80% genetic?"). Econometrics **explicitly forbids** this: R² describes *between-individual variation*, not within-individual causation. |  
  | **Causal interpretation of twin studies** | **Distortion** | Twin designs assume **genetic effects are structural**, but MZ/DZ comparisons rely on untestable assumptions (EEA). Econometrics sees them as **reduced-form IV estimates** with questionable exclusion restrictions. |  
  | **"Missing heritability" as a biological puzzle** | **Partial translation** | Econometrics blames **model misspecification/measurement error**. Geneticists argue rare variants/ epistasis are *inherently unobservable* without perfect data – a **fundamental indeterminacy**. |  
  | **G×E as developmental process** | **No equivalent** | Some philosophers see G×E as "genes *responding* to environment" (e.g., plasticity). Econometrics treats it as **effect heterogeneity** – no causal direction implied. |  

  ---

  ### **Asymmetry & Limitations**  
  - **What econometrics imposes**:  
    - **Counterfactual estimands**: IV/DO requires well-defined interventions (e.g., "change genotype *holding E fixed*"). Biology often lacks such interventions.  
    - **Structural vs. reduced form**: Heritability estimates are **reduced-form** (genotype → phenotype). Geneticists sometimes conflate with structural parameters (e.g., "gene *effects*").  

  - **What genetics obscures**:  
    - **Mechanism-agnosticism**: h² doesn’t distinguish *how* genes affect traits (e.g., via brain development vs. metabolism).  
    - **Causal mediation**: Cov(G,E) could be confounded (e.g., parental genotype affecting both child’s genes and environment).  

  ---

  ### **What Would Change My Mind**  
  **The mind-flipping argument**: If you could show that **within-individual counterfactuals** (e.g., "what would *this same person* be like with different genes?") are *meaningful and estimable* in genetics but incoherent in econometrics. For example:  
  - Neuroplasticity evidence that **genes set reaction norms** (e.g., "genotype A has phenotype range [X,Y] in environments E₁–Eₙ").  
  - Econometrics has no direct analog – its counterfactuals are *between*-individual.  

  **Where I likely cheated**: Equating **twin-study heritability** with **OLS R²**. Twin models assume:  
  - Additivity (no G×E or epistasis)  
  - No rGE  
  - Equal environments for MZ/DZ twins  
  These are **untestable structural assumptions** – but OLS R² requires no such commitments. I implicitly smuggled in genetics’ assumptions.  

  ---

  ### **Conclusion**  
  Your hunch is 85% correct: Heritability *is* largely about R² decomposition, correlated regressors, and external validity. The "residue" arises where genetics:  
  1. Makes **within-individual causal claims** (econometrics forbids),  
  2. Invokes **emergent biological properties** (non-additivity, plasticity),  
  3. Treats **untestable assumptions** as biological truths (twin studies).  

  The asymmetry is foundational: Econometrics focuses on *estimating effects*, genetics on *partitioning variation* – but both stumble on causality without experiments. Your framework isn’t defective; it’s more disciplined. The "philosophical hand-wringing" often conflates descriptive stats with causal mechanisms.
