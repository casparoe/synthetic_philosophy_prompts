prompt: |-
  I was in a seminar on population ethics last week and someone kept invoking the transitivity of "better than" to dismiss spectrum arguments — the kind where A seems better than B, B seems better than C, but A does not seem better than C (mild discomfort for very many versus intense suffering for a few, that sort of thing). He said, roughly, "Look, 'better than' is a transitive relation, full stop. If you deny that, you're giving up on practical reasoning." But I'm not convinced there is just one thing being claimed there. I want to know what different precise theses "better than is transitive" could amount to, which of them are actually threatened by spectrum arguments, and which would do the work he needed it to do in that exchange.

  Please lay this out as a table with the following columns:

  - **Reading label**: a short name for this precisification (e.g., "Logical transitivity of the two-place predicate").
  - **Precise claim**: the thesis stated with enough formalism or exactness that one could tell what would count as a counterexample.
  - **Trivial, substantive, or false**: your verdict on the claim considered on its own, before spectrum arguments enter.
  - **Vulnerable to spectrum arguments?**: does this reading actually get challenged by Parfit-style or Temkin-style spectrum cases, or does it sidestep them?
  - **Would it rescue the seminar argument?**: if this is the reading my interlocutor had in mind, would it successfully dismiss the spectrum objection he was facing, or would it beg the question, change the subject, or miss the point?

  After the table, give me a paragraph on which reading you think is doing the real work when people reach for this slogan in population ethics and social choice, and whether the slogan, on that reading, is true.
