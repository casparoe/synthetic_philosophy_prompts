  Okay, the user is diving deep into constructive math after a LessWrong thread and a conversation with a PhD friend. They're questioning their friend's summary of intuitionism, feeling some parts are off. Let me unpack their concerns step by step.

  First, the friend claimed intuitionists use a three-valued logic, rejecting LEM because statements are neither true nor false until proven. But I recall Brouwer and Heyting opposed this view. Intuitionism treats truth as proof-dependent, not a third truth value. The user mentioned intuitionists get annoyed being called three-valued, which aligns with that. So that part is wrong—it's a common misconception.

  Next, Brouwer's insight about math as a human activity. The friend got that part right. Brouwer did see math as mental constructions, not discoveries. But he wasn't formal about proofs; that came later with Heyting. The user suspects their friend is conflating Brouwer with later CS developments. I should note that while the core idea is correct, the formal "proof=algorithm" link is more Curry-Howard than Brouwer.

  Speaking of proof=algorithm, the friend tied it to Brouwer, but that's an anachronism. Brouwer didn't formalize proofs as algorithms; that came from Kolmogorov, Heyting, and later Curry-Howard. Coq uses this, but it's a modern interpretation. The user is right to be suspicious here. The friend is projecting CS concepts onto early intuitionism.

  Then there's Gödel's consistency proof. The friend said intuitionistic logic is consistent relative to classical logic. Actually, Gödel showed that if classical logic is consistent, so is intuitionistic. That's correct, but it's a double negation embedding, not a full conservativity. The user's uncertainty here is valid—it's a technical point that's often oversimplified.

  The user also questioned if all classical theorems can be recovered intuitionistically by being careful. The friend claimed yes, but it's not straightforward. While some theorems have constructive versions, others (like full LEM or TND) can't be salvaged. The double negation translation helps but adds negations, changing the statement's meaning. So the friend's conclusion is misleading.

  The user wants clear verdicts, not "it depends." They're fine with taking sides on contested points. They need this to clarify misunderstandings before diving deeper. Their deeper need is to grasp intuitionism accurately, avoiding pop-math simplifications. They might be preparing for academic work or personal study, given the LessWrong and Coq references. I should address each claim decisively, flagging errors and nuances, to equip them for informed learning.
answer: |-
  You're absolutely right to be suspicious - your friend's summary contains a mix of oversimplifications, common misconceptions, and a few points that are outright wrong or misleading when attributed to Brouwer's original intuitionism. Here's a breakdown, point-by-point, with a clear verdict on each:

  1.  **"Intuitionists reject the law of excluded middle because they think some mathematical statements are just neither true nor false until someone proves one way or the other, so it's basically a three-valued logic."**
      *   **Verdict: Wrong.** This is the most significant misinterpretation.
      *   **Why:** Intuitionists (especially Brouwer and Heyting) **vehemently** rejected the characterization of their logic as three-valued (true, false, undefined). For them, truth *is* provability. A statement *is true* if we have a proof of it; it *is false* if we have a proof of its absurdity (e.g., a proof that it leads to a contradiction). **There is no third truth value.** The key difference is that intuitionists do *not* accept that "A or not A" is *always* true (which is LEM), because asserting "A or not A" means you either have a proof of A *or* a proof that A leads to contradiction. For statements where you possess neither (like the Goldbach Conjecture, currently), asserting LEM for them is unjustified. The "neither true nor false" framing is more characteristic of **mathematical realism** (like Godel's Platonism) or **formalist approaches**, not intuitionism. Intuitionism replaces the classical notion of "truth" as mind-independent with "truth as proof". This is a fundamental philosophical difference, not just adding a third value.

  2.  **"Brouwer's insight was that math is something humans do rather than something we discover, which means every proof has to actually construct the thing it's about..."**
      *   **Verdict: Mostly Correct (regarding the core insight and constructivity), but a significant simplification.**
      *   **Why:** Yes, Brouwer's core philosophical revolution was viewing mathematics as a creation of the human mind ("free choice sequences", "primordial intuition of time") rather than the discovery of pre-existing Platonic truths. This directly implies the **constructivity requirement**: a proof of existence ("there exists an x such that P(x)") *must* provide a method (an algorithm) to construct such an `x`, and a proof of a disjunction ("A or B") *must* specify which one is true and prove *that* one. Non-constructive proofs (like pure existence proofs by contradiction showing ~∀x~P(x) implies ∃x P(x)) are indeed rejected precisely because they don't provide this construction. The simplification lies in the depth of Brouwer's philosophy – it wasn't *just* about constructivity for practical reasons, but rooted in a deep idealist view of the mind and mathematics as a temporal, mental activity.

  3.  **"...so existence proofs by contradiction are out."**
      *   **Verdict: Correct (as a direct consequence).**
      *   **Why:** This is a direct corollary of the constructivity requirement. Proving ∃x P(x) by assuming ~∃x P(x) and deriving a contradiction (¬¬∃x P(x)) does *not* provide an actual `x` satisfying P(x). Intuitionistically, ¬¬∃x P(x) is *weaker* than ∃x P(x). The former only says "it's absurd that no such x exists," but doesn't give you one. Classical logic equates these via LEM; intuitionistic logic does not.

  4.  **"Gödel later proved intuitionistic logic is consistent relative to classical logic..."**
      *   **Verdict: Correct, though requires precision.**
      *   **Why:** Gödel (in 1933) and independently Gentzen gave **double-negation translations**. They showed that you can embed classical logic (CL) into intuitionistic logic (IL) in such a way that a formula `A` is provable in CL *if and only if* its translation `A^N` (essentially, `¬¬A` with negations pushed inward in a specific way) is provable in IL. Crucially, this implies: **If IL is inconsistent, then CL is inconsistent.** So, the consistency of IL is reducible to the consistency of CL. This is a relative consistency result. Your friend is essentially correct on this technical point.

  5.  **"...which is why classical mathematicians don't have to worry."**
      *   **Verdict: Simplistic and potentially misleading.**
      *   **Why:** While the relative consistency result *technically* means classical mathematicians don't have to worry about IL introducing new contradictions into CL *if CL is consistent*, this misses the point entirely. Classical mathematicians "don't have to worry" because they *accept LEM* and non-constructive methods as valid. The result doesn't make IL "safe" for classical math in the sense that classical mathematicians would want to adopt it; it just shows IL isn't *more dangerous* consistency-wise. The philosophical and mathematical disagreements about what constitutes valid proof (constructive vs non-constructive) remain completely untouched by this result. It's a technical bridge, not a philosophical reconciliation.

  6.  **"Intuitionism is basically the logic of computation..."**
      *   **Verdict: Anachronistic when attributed to Brouwer, but fundamentally correct as a modern interpretation.**
      *   **Why:** **Wrong for Brouwer (1907).** Brouwer's motivations were deeply philosophical and mathematical (foundations of analysis, continuum, rejection of formalism/Platonism). He did *not* think in terms of computation or algorithms in the modern sense. The seeds were there (constructions, methods), but the explicit identification with computation came decades later. **Correct as a modern perspective.** Through the **BHK Interpretation** (Brouwer-Heyting-Kolmogorov, developed ~1930s) and especially the **Curry-Howard Correspondence** (~1950s-60s), intuitionistic logic was shown to be isomorphic to the logic of computable functions/programs. A proof *is* a program, and vice-versa. This is why proof assistants like Coq, Agda, and Lean *are* based on intuitionistic type theory. Your friend is absolutely right about the *current* deep connection, but **completely wrong** to project this computational view back onto Brouwer's original 1907 motivations. This is retroactive projection of Curry-Howard.

  7.  **"A proof is the same thing as an algorithm..."**
      *   **Verdict: Correct under the modern BHK/Curry-Howard interpretation, but not Brouwer's original formalization.**
      *   **Why:** Brouwer focused on mental constructions, not formal algorithms. The rigorous equation "proof = algorithm" is a cornerstone of the BHK interpretation and Curry-Howard, which formalized and extended Brouwer's ideas using tools from logic and computer science. This is the *foundation* of modern constructive mathematics in CS, but it's a formalization *inspired* by, rather than *stated* by, Brouwer himself.

  8.  **"...which is why all the proof assistants like Coq use it."**
      *   **Verdict: Correct.**
      *   **Why:** Proof assistants *require* proofs to be constructive (algorithmic) to be executable and to reliably produce computational content (programs, certificates). Intuitionistic logic, via Curry-Howard, provides the perfect formal framework for this. Coq, Agda, Lean, etc., are indeed based on intuitionistic type theory (e.g., CIC for Coq).

  9.  **"Since intuitionistic logic is 'just classical logic minus excluded middle,' any classical theorem can be intuitionistically proven if you're willing to be a bit careful..."**
      *   **Verdict: Misleading and essentially false in the intended sense.**
      *   **Why:** While it's true syntactically that IL is CL minus LEM (and minus equivalent principles like double-negation elimination), **you cannot intuitionistically prove the *untranslated* classical theorem if it genuinely relies on LEM non-constructively.** Gödel's translation shows you can prove a *classically equivalent* but **intuitionistically different** formula (`A^N`, which is `¬¬A` modified). For example:
          *   Classically: `∃x P(x)` (Non-constructive existence proven by contradiction).
          *   Intuitionistically: You can only prove `¬¬∃x P(x)` (It's absurd that no such x exists).
          *   `¬¬∃x P(x)` does **not** intuitionistically imply `∃x P(x)`.
      *   **"Being careful" means radically changing the statement or interpretation:** To get a constructive version, you often need to:
          *   Add hypotheses (like decidability assumptions).
          *   Change the conclusion (e.g., prove `¬¬A` instead of `A`).
          *   Use the double-negation translation, which fundamentally alters the *meaning* of the theorem from a constructive viewpoint.
          *   Find a genuinely constructive *replacement* theorem (e.g., "if P is decidable, then...").
      *   **Conclusion:** You cannot recover the *full strength and non-constructive meaning* of classical theorems within pure intuitionistic logic. Gödel's translation allows you to *simulate* classical *provability*, but *not* classical *truth* or *meaning* constructively. Many important classical results (like purely existential theorems relying on LEM, the full axiom of choice, Tychonoff's theorem for general topological spaces, the Hahn-Banach theorem in full generality) **do not hold** in their standard form intuitionistically. Your friend's claim is too simplistic and glosses over the fundamental loss of non-constructive content.

  **Summary of Verdicts:**

  *   **Wrong:** The 3-valued logic explanation for rejecting LEM. Equating Brouwer's 1907 view with computation/proofs-as-algorithms.
  *   **Mostly Correct (but Simplified):** Brouwer's core insight about math as a mental activity leading to constructivity requirement.
  *   **Correct:** Rejection of non-constructive existence proofs. Gödel's relative consistency result. Modern proof assistants use IL because of proofs-as-algorithms.
  *   **Correct (Modern View, not Brouwer):** Proof = Algorithm (BHK/Curry-Howard). IL is the logic of computation.
  *   **Misleading/Simplistic:** "Classical mathematicians don't have to worry" (philosophical disagreement remains). "IL is just CL minus LEM" (syntactically yes, semantically/philosophically no).
  *   **Misleading/False:** "Any classical theorem can be intuitionistically proven if careful" (Only by changing its meaning significantly or accepting a weaker conclusion; the non-constructive core is lost).

  The core confusion stems from conflating Brouwer's original philosophical motivations (1907-1920s) with the later formal interpretations (Heyting, Kolmogorov, BHK ~1930s) and the computational interpretations (Curry-Howard, Martin-Löf ~1950s-70s). While deeply connected, they are distinct historical and conceptual layers. Your friend's summary mixes these layers, attributing modern computational views directly to Brouwer and misunderstanding the philosophical basis for rejecting LEM. Your intuition that the "neither true nor false" framing was off and that "proof=algorithm" was an anachronism for Brouwer was spot on. Gödel's result is technically correct but philosophically neutral. The final claim about recovering classical theorems is the most practically misleading for someone trying to understand the actual mathematical differences.
