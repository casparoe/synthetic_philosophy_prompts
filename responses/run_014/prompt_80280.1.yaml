     However, the presentist objection is that simultaneity is frame-dependent. Therefore, even though in S, a and b are simultaneous, and in S', b and c are simultaneous, this does not mean that a and c are simultaneous. In fact, the chain of simultaneities is not transitive because simultaneity is not an equivalence relation (it is frame-dependent). So the presentist would say that the present is frame-dependent: what is present for S is the set of events simultaneous with a in S, and what is present for S' is the set of events simultaneous with b (or c) in S'. But there is no single frame-independent present.

