  The competence assumption (p>0.5) is critical. Without it, the theorem doesn't hold. In distributed systems, if the failure probability of a node is greater than 0.5, then increasing the number of nodes actually makes the system less reliable (because the majority is more likely to be faulty). So we must have `f < 0.5` for the system to benefit from more nodes.

  But note: in distributed systems, we often have very reliable nodes (so `f << 0.5`). So the condition is easily met. However, the independence assumption is harder to achieve because of correlated failures.

