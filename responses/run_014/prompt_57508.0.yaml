  We are going to translate the Condorcet jury theorem into the language of distributed systems, specifically regarding the use of quorums and replicas.

  **Condorcet Jury Theorem (CJT) Recap:**
  - Assumption 1 (Competence): Each voter is more likely to be correct than incorrect (p > 0.5).
  - Assumption 2 (Independence): Voters' decisions are independent.
  - Result: The probability that the majority is correct is higher than the probability that any single voter is correct, and this probability approaches 1 as the number of voters increases.

  **Distributed Systems Analogy:**
  We are considering a system with `n` replicas (nodes). Each replica runs the same deterministic state machine. We are concerned with the correctness of the system in the face of failures. We'll consider both crash faults and Byzantine faults.

  We'll break down the theorem:

  1. **Competence Assumption (p > 0.5):**
     In the replica context, this would correspond to the idea that each replica is more likely to be correct (non-faulty) than faulty. However, note that in distributed systems, we often model the probability of a node being faulty (crash or Byzantine) as `f` (so the probability of being non-faulty is `1-f`). The competence condition requires that the probability a node is non-faulty is greater than 0.5 (i.e., `1-f > 0.5` or `f < 0.5`). 

     However, in distributed systems we typically do not assume that the probability of a node being non-faulty is always above 0.5. In fact, for very unreliable nodes (say, with `f>0.5`), the majority would be more likely to be faulty. So the condition `f < 0.5` is critical.

  2. **Independence Assumption:**
     In CJT, independence means that the correctness of one voter does not affect the correctness of another. In replicas, this would mean that failures are independent (i.e., the failure of one node does not make another node more likely to fail). 

     However, in practice, failures can be correlated (e.g., due to shared failure domains: same rack, same power source, same software bug). We often try to design systems to minimize correlation by spreading replicas across failure domains.

  3. **Majority Rule:**
     In CJT, the majority decision is taken. In distributed systems, for write quorums, we often require a majority (or more generally, a quorum) of nodes to acknowledge an operation. For reading, we might also require a majority to get the latest value. 

     For crash faults, a majority quorum (with `n=2f+1`) can tolerate `f` failures. For Byzantine faults, we use `n=3f+1` to tolerate `f` faulty nodes (so that a majority of the non-faulty nodes can outvote the faulty ones).

  4. **Limit as Group Grows:**
     CJT says that as the jury size increases, the probability of the majority being correct goes to 1. In distributed systems, if we have `n` replicas and we require a quorum of `ceil(n/2)+1` (or more) and if the failure probability per node is `f < 0.5` and independent, then the probability that the majority is non-faulty (and thus the system can make progress and be correct) increases with `n` and approaches 1 as `n` goes to infinity.

