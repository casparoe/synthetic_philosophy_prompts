prompt: |-
  I work on the storage layer for a payments company — replicas, quorums, failure domains, blast radius, that's my whole day. No philosophy background whatsoever, never read Condorcet or anything.

  A teammate who reads way too much political theory sent me a rundown of the Condorcet jury theorem. His version: if each voter is individually more likely to be right than wrong, and thier votes are independent, then the majority is more likely to be right than any single voter, and that goes to certainty as the jury gets bigger. His pitch was that this is literally the same math as why we run 3 or 5 replicas instead of 1, and that our majority-write quorum story is just the jury theorem with different nouns.

  I want you to stress-test that pitch. Redo the theorem in the vocabulary I actually use — nodes, replicas, quorum size, independent vs correlated failure, shared failure domains, Byzantine faults and the n ≥ 3f+1 rule, availability, deterministic state machines, whatever turns out to be the right analog. Walk the pieces one at a time: the competence assumption, the independence assumption, the majority rule itself, and the limit as the group grows.

  Then the residue report, which is the part I actually care about:

  - which pieces land cleanly on something I already have a word for
  - which pieces only land if you bend them, and exactly where the bend is
  - which pieces have no counterpart at all in how I think about replicas

  For everything that fails to land, say whether that's because my vocabulary is missing something real, or because the theorem is claiming less than it sounds like. My suspicion is that one of the two assumptions is doing work in his version that it flat-out cannot do in mine, but I can't put my finger on which.

  Also work in the two objections he mentioned in passing — something about how deliberation kills independence, since jurors who talk to each other stop being independent, and something about how if people genuinely believed the theorem they'd stop voting their own judgment and start voting strategically. I want to know what those two translate into for me, if anything. I have a feeling one of them has a perfect analog in my world and the other has no analog whatsoever.

  No reading list, no citations, no paper titles — I'm not going to look anything up and I don't want you guessing at them. Just reason it through from the theorem and from what replicas actually do.

  End with a last line in exactly this form:

  Verdict: <one of: my-vocab-is-missing-something | theorem-is-weaker-than-it-sounds | both | neither> — <one sentence naming the specific piece of the theorem that drove the call>
