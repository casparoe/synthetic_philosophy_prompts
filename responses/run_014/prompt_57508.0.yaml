answer: |-
  ### Condorcet Jury Theorem in Replica Vocabulary

  **Competence Assumption (p > 0.5)**  
  *Theorem*: Each voter is more likely correct than incorrect.  
  *Replica Analog*: Each replica has >50% probability of being non-faulty (i.e., failure probability <0.5). This maps cleanly to your "mean time between failures" (MTBF) model. If a replica's uptime probability is ≤0.5, adding more replicas *reduces* system reliability—just as a jury of incompetent voters worsens decisions.  

  **Independence Assumption**  
  *Theorem*: Voters' decisions are statistically independent.  
  *Replica Analog*: Replica failures must be uncorrelated. This lands cleanly on **failure domain isolation** (e.g., racks, AZs, power sources). If failures correlate (e.g., a shared network switch dies), independence breaks—equivalent to jurors being influenced by the same biased news source.  

  **Majority Rule**  
  *Theorem*: Majority vote amplifies correctness.  
  *Replica Analog*: Quorum decisions (e.g., majority-write) ensure correctness if >50% of replicas are non-faulty. This lands perfectly on **quorum consensus protocols** (e.g., Raft/Paxos). For non-Byzantine faults, `n=2f+1` tolerates `f` failures because the majority is non-faulty.  

  **Limit as Group Grows**  
  *Theorem*: Correctness probability →1 as jury size increases.  
  *Replica Analog*: With `f<0.5` and independent failures, system reliability →1 as `n` increases. This mirrors **horizontal scaling for fault tolerance** (e.g., 5-nines availability with enough replicas).  

  ---

  ### Residue Report
  1. **Lands Cleanly**  
     - Competence = Replica uptime probability >0.5.  
     - Independence = Uncorrelated failures via failure domains.  
     - Majority rule = Quorum decision protocols.  
     - Scaling limit = Reliability growth with `n`.  

  2. **Lands with a Bend**  
     - **Byzantine Faults**: The theorem assumes faulty replicas "vote incorrectly" randomly, but Byzantine nodes can *maliciously collude*. This bends the independence assumption:  
       - *Where the bend is*: Independence requires no coordinated attacks. The `n ≥ 3f+1` rule for Byzantine faults *extends* the theorem by assuming adversarial coordination (which CJT ignores).  

  3. **No Counterpart**  
     - **Deliberation killing independence**: In CJT, jurors discussing → correlated votes.  
       - *Replica analog*: **State machine synchronization**. Replicas *must* "deliberate" via consensus protocols (e.g., leader election, log replication). This *intentionally* correlates state—breaking independence but ensuring consistency.  
       - *Why no counterpart?* CJT treats deliberation as a flaw; you treat it as a *requirement*. Your systems *embrace* controlled correlation for safety, while CJT assumes isolated voters.  
     - **Strategic voting**: In CJT, voters might abandon personal judgment to manipulate outcomes.  
       - *No analog in replicas*: Non-Byzantine replicas follow deterministic protocols (no "strategy"). Byzantine nodes *do* act maliciously, but this is modeled as adversarial faults—not strategic reinterpretation of the protocol.  

  ---

  ### Objections Translated
  1. **"Deliberation kills independence"**  
     - *Your analog*: **Consensus protocols create dependency**. Replicas exchanging messages for synchronization risk correlated failures (e.g., a network partition affecting all). This forces you to model failure domains *explicitly*.  
     - *Why it lands*: Both highlight tradeoffs—deliberation improves group accuracy in CJT but breaks independence; consensus improves consistency but increases correlation risk.  

  2. **"Strategic voting undermines judgment"**  
     - *No analog*: Replicas lack agency. Non-Byzantine nodes execute code deterministically; Byzantine nodes are **modeled as adversaries**, not strategic actors. Your world assumes nodes are either correct (follow spec) or broken—no "intent" to game the system.  

  ---

  ### Final Verdict
  **Verdict: theorem-is-weaker-than-it-sounds** — because its independence assumption ignores adversarial coordination (Byzantine faults) and assumes static voter behavior, while your model must handle malicious collusion and protocol-enforced synchronization.  

  *Specifically*: The theorem’s independence assumption cannot natively model Byzantine coordination or consensus-driven correlation—forcing you to extend it with `3f+1` and failure domains. CJT describes a simplified world; your replicas inhabit a harder one.
