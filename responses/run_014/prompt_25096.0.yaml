prompt: |-
  I am a novelist at work on my fourth book, and I have been studying Daniel Dennett's claim that the self is a center of narrative gravity — not an entity located in the brain but an abstraction that emerges from the stories told about a person, much as a physical center of gravity is an abstraction that emerges from the distribution of mass. I suspect I have been constructing characters backward: I begin with a list of traits, a backstory, and a putative inner life, and then I try to make the character cohere around that fixed point. Dennett's picture suggests I should be working in the opposite direction, letting the self precipitate out of the narratives rather than imposing it in advance.

  I would like you to design a character-construction procedure grounded in this narrative-gravity view — something I can use for each major and secondary character across novels. I write literary fiction with ensemble casts of roughly four to eight significant characters per book, and I produce a novel every two to three years, so the procedure will see regular but not daily use. I have time to work through it deliberately, but it must yield outputs I can actually write from: scenes, dialogue, decisions a character makes under pressure, moments of self-betrayal or self-revision. The procedure should take as its raw materials the events of the plot, the testimony of other characters, the character's own self-narrations (whether explicit in first-person narration or implicit in free indirect style), and the discrepancies among these accounts, and it should show how a self crystallizes — or fails to crystallize — out of that material. Flag every step at which the theory runs out and I, the author, must make a judgment call. Be explicit about which kinds of characters the procedure will handle badly.

  Then apply the procedure to two cases. The first is a protagonist who narrates her own story in the first person — a character whose self-narrative is unusually dominant and who may be unreliable. The second is a character who appears only in scenes reported by other characters and who never speaks in her own voice — a minor figure whose center of narrative gravity must be inferred entirely from external reports. For at least one of these cases, show me a result the procedure forces on me that I, as a novelist reaching for intuitive consistency, would resist, and explain why the resistance is itself informative.
reasoning: |-
  We are going to design a character-construction procedure based on Daniel Dennett's idea of the self as a center of narrative gravity. The core idea is that the self is not a pre-existing entity but an emergent property of the stories told about a person (by themselves and others). Therefore, we build the character from the outside in: starting with the narratives and letting the self emerge.

  The procedure will operate in stages, using the following raw materials:
  1. **Plot Events**: What happens to the character and what actions they take.
  2. **Testimony of Other Characters**: What other characters say about this character.
  3. **Character's Self-Narrations**: The character's own accounts (in first-person narration, free indirect style, or internal monologue).
  4. **Discrepancies**: Inconsistencies among the above.

  The goal is to let the character's "self" crystallize (or fail to) from these materials. We will generate outputs such as: how the character acts in a scene, what they say, decisions under pressure, moments of self-betrayal or self-revision.

  Procedure Overview:
  We break the procedure into three phases, to be applied per character:

  **Phase 1: Gathering Narrative Fragments**
     - Collect all data about the character from the three sources (plot, other testimonies, self-narrations) and note discrepancies.

  **Phase 2: Identifying Narrative Gravity Centers**
     - Look for patterns, tensions, and contradictions in the fragments. Identify what "pulls" the narratives together and what creates instability.

  **Phase 3: Generating Character Behaviors and Moments**
     - Use the emergent centers to generate specific outputs (scenes, decisions, etc.) that reflect the character's self as constructed.

  Detailed Steps:

  **Phase 1: Gathering Narrative Fragments**
     Step 1.1: For the character, list every plot event they are involved in. Note their actions and the consequences.
     Step 1.2: Collect every instance of testimony from other characters about this character. Note the source and context of each testimony.
     Step 1.3: Collect every self-narration (if available) by the character. This includes direct thoughts, reflections, and accounts of their own past.
     Step 1.4: Create a table (or list) with three columns: Source (Plot, Other Testimony by [Character Name], Self), Content, and Context (when, where, who is present).
     Step 1.5: Flag discrepancies: Note any contradictions between the sources. For example, a character's self-narration might conflict with plot events or another character's testimony.

  *Author Judgment Call*: At Step 1.4, the author must decide which events, testimonies, and self-narrations to include. The procedure requires selection of which material is relevant. Also, in Step 1.5, the author must interpret what counts as a discrepancy.

  **Phase 2: Identifying Narrative Gravity Centers**
     Step 2.1: Group the fragments by theme (e.g., "the character's relationship with authority", "the character's honesty", "the character's fears"). Themes might emerge from recurring topics in the fragments.
     Step 2.2: For each theme, note the variations and contradictions. How do the different sources (plot, others, self) represent this theme?
     Step 2.3: Identify which themes are stable (consistent across sources) and which are unstable (contradictory). The stable themes form the initial centers of gravity. The unstable ones are sites of tension where the self might be under construction or failing to cohere.
     Step 2.4: Look for patterns in the discrepancies. For example, does the character consistently misremember events in a self-serving way? Do other characters consistently misjudge the character in a particular way?
     Step 2.5: Assign weights to the fragments. Some events or testimonies might be more significant (e.g., a public humiliation vs. a private thought). The author must decide the weights.

  *Author Judgment Call*: In Step 2.1, the author must choose the themes. In Step 2.5, the weighting is entirely subjective. Also, in Step 2.4, interpreting patterns in discrepancies requires authorial insight.

  **Phase 3: Generating Character Behaviors and Moments**
     Step 3.1: For a given scene, consider the character's past narrative fragments (from Phases 1 and 2) that are relevant to the situation.
     Step 3.2: Determine the current pressures on the character (from the plot and other characters).
     Step 3.3: Generate the character's behavior by:
        a) Considering the stable centers of gravity: How would the consistent patterns manifest?
        b) Considering the unstable tensions: How might the contradictions surface under pressure? This could lead to self-betrayal (acting against a professed value) or self-revision (changing the narrative).
     Step 3.4: For dialogue, consider how the character's self-narration (if present) might influence what they say (e.g., they might be trying to maintain a certain self-image). Also, consider how others' testimonies might affect the character's reputation and thus their interactions.
     Step 3.5: For moments of self-betrayal or self-revision, look for situations where discrepancies become unsustainable. The character might be forced to confront a contradiction and either break down (failing to cohere) or adapt (revising the narrative).

  *Author Judgment Call*: Step 3.3 requires the author to decide how the pressures interact with the narrative gravity centers. There is no formula for human behavior.

  **Characters the Procedure Will Handle Badly**:
     1. Characters with very little narrative material (e.g., a walk-on character with one line) — there isn't enough to form a center of gravity.
     2. Characters who are meant to be enigmas (where the author intentionally avoids providing narrative fragments) — the procedure relies on fragments to build the self.
     3. Characters in genres that require fixed, archetypal roles (e.g., a fairy-tale prince) — the procedure is designed for complex, evolving selves.

  Now, we apply the procedure to two cases.

  ---

  **Case 1: First-Person Protagonist (Unreliable Narrator)**

  Character: Alice, the protagonist and narrator of the novel. She tells her own story in first person.

  **Phase 1: Gathering Narrative Fragments**
     - Plot Events: Alice is a successful lawyer who suddenly quits her job and moves to a small town. She becomes involved in a local environmental protest. She is arrested during a protest but then released without charges. She starts a relationship with a local activist, Tom.
     - Other Testimony: 
          - Her former boss: "Alice was always driven, but she cracked under pressure."
          - Tom: "Alice is brave and idealistic, but sometimes she seems to be running from something."
          - Her sister (via phone call): "You've always been impulsive, Alice."
     - Self-Narration: 
          - Alice: "I left because I couldn't stand the moral compromises anymore. I needed to live authentically." 
          - Alice: "I've never felt more at peace." (after moving)
          - Alice: "Tom doesn't understand that I'm not running; I'm finally standing still."
     - Discrepancies:
          - Alice's self-narration about peace vs. her sister's testimony about impulsiveness and Tom's observation about running.
          - Her boss's claim that she cracked under pressure vs. Alice's claim of moral awakening.

  **Phase 2: Identifying Narrative Gravity Centers**
     - Themes: 
          - Authenticity: Alice's self-narration centers on this. Others don't mention it.
          - Impulse/Running: Others see her as impulsive or running. Alice denies this.
          - Pressure: The boss attributes her leaving to pressure. Alice attributes it to morality.
     - Stable Centers: 
          - Alice consistently presents herself as seeking authenticity. This is a stable self-narrative.
          - Others consistently see her as impulsive (sister) and as having a pattern of running (Tom).
     - Unstable Tensions: 
          - The reason for leaving her job: pressure (boss) vs. morality (Alice). This is a major discrepancy.
          - The peace Alice claims vs. the chaotic events of the plot (arrest, protest) and others' views.

  **Phase 3: Generating Behaviors and Moments**

  Scene: Alice is offered a high-profile case by her old law firm to defend a corporation accused of environmental damage. This is a high-pressure situation.

     Step 3.1: Relevant fragments: 
          - Alice's self-narrative: authenticity, moral awakening.
          - Others' views: she cracks under pressure, impulsive, running.
          - Plot: she quit her job under unclear circumstances.

     Step 3.2: Pressure: 
          - The offer is tempting: money, prestige, and a chance to prove her old boss wrong.
          - But it conflicts with her current environmental activism.

     Step 3.3: Behavior Generation:
          - Stable center: Her self-narrative of authenticity would suggest she refuses the case. But she might feel the pull of her old life (pressure).
          - Unstable tension: The discrepancy about why she left her job comes into play. If she takes the case, it might be because she is running from the commitment of activism (as Tom might say) or because she cracks under the pressure of the offer (as her boss would say). If she refuses, she might do so in a way that is impulsive (as her sister would note) — e.g., burning bridges.

     Step 3.4: Dialogue: 
          - Alice might tell Tom: "I would never go back to that life." (reinforcing her self-narrative) but then hesitate when alone.
          - Or she might say to the old firm: "I'm not that person anymore." (but her voice might tremble, revealing the pressure).

     Step 3.5: Moment of self-betrayal or revision: 
          - Suppose Alice initially refuses the case but then, after a night of anxiety, calls back and takes it. This would be a self-betrayal (against her authenticity narrative). 
          - Why? The pressure (boss's narrative) and the impulse (sister's narrative) overcome her moral self-narrative. 
          - Then, she might revise her self-narrative: "Maybe I was never meant to be an activist. Maybe I'm just a lawyer."

  *Result that might cause resistance*: As a novelist, you might want Alice to stay true to her moral awakening and refuse the case. But the procedure, based on the discrepancies (her vulnerability to pressure and impulsiveness), might lead her to take the case. Why is this resistance informative? It shows that you, the author, might be over-identifying with Alice's self-narrative and ignoring the weight of others' testimonies and the plot events that suggest instability. The resistance highlights the tension between Alice's self-presentation and the external evidence, which is exactly the core of her character.

  ---

  **Case 2: Character Known Only Through Others' Reports**

  Character: Beatrice. She is the deceased mother of two sisters (main characters). She never appears directly, but is often discussed.

  **Phase 1: Gathering Narrative Fragments**
     - Plot Events: Beatrice died when the sisters were teenagers. She left behind diaries (which the sisters find and read). She had a secret life: she was an artist who never showed her work and had an affair.
     - Other Testimony (from various characters):
          - Sister 1 (Clara): "Mom was the perfect mother. She was always there for us."
          - Sister 2 (Diana): "Mom was distant. She spent hours locked in her studio."
          - Father: "Beatrice was the love of my life, but she was troubled."
          - Family friend: "Beatrice was a free spirit trapped by domesticity."
     - Self-Narration: From her diaries:
          - "I feel like I'm suffocating in this life."
          - "My children are my only joy, but sometimes I look at them and see chains."
          - "I paint to remember who I am."
     - Discrepancies:
          - Clara's perfect mother vs. Diana's distant mother vs. the diaries' ambivalence.
          - Father's "troubled" vs. family friend's "free spirit".

  **Phase 2: Identifying Narrative Gravity Centers**
     - Themes:
          - Motherhood: Clara (perfect), Diana (distant), Diaries (ambivalent: joy and chains).
          - Art: Diaries (essential to her identity), Family friend (free spirit), others don't mention it.
          - Marriage: Father (love of my life) vs. Diaries (suffocating) and Family friend (trapped).
     - Stable Centers: 
          - There is a consistent thread of her being an artist (diaries, family friend).
          - There is also consistency in her being seen as conflicted: troubled (father), trapped (friend), ambivalent (diaries).
     - Unstable Tensions: 
          - The motherhood theme is highly unstable: perfect vs. distant vs. ambivalent.

  **Phase 3: Generating Behaviors and Moments**

  Note: Since Beatrice is dead, we cannot have a scene with her. But we can generate how she is remembered in a scene, or how her diaries reveal a moment of decision.

     Step 3.1: Relevant fragments: 
          - The diaries reveal a moment when Beatrice had an opportunity to show her art in a gallery but turned it down.
          - Testimony: Clara says, "She never would have left us." Diana says, "She was too afraid to show her work."

     Step 3.2: Pressure: 
          - At the time, Beatrice had two young children and a husband who didn't know about her art.

     Step 3.3: Behavior Generation (for the past event, reconstructed):
          - Stable center: Her identity as an artist (from diaries) would push her to show the work. But her motherhood role (as seen by Clara) would push her to decline to avoid disruption.
          - Unstable tension: The discrepancy in how she is seen as a mother (perfect vs. distant) might lead to a moment of self-betrayal. She declines the gallery show, but then writes in her diary: "I am a coward. I have chosen chains over freedom." This is self-betrayal of her artistic identity.

     Step 3.4: Dialogue (in the present, among the sisters): 
          - Clara: "Mom would never have shown those paintings. She loved us too much."
          - Diana: "You're wrong. She was afraid. And that fear killed her spirit long before she died."

     Step 3.5: Moment of self-revision (for the sisters, about Beatrice): 
          - When they read the diary entry about the gallery, both sisters must revise their narratives. Clara might resist: "She didn't mean it." Diana might say: "See? I told you she was trapped."

  *Result that might cause resistance*: As an author, you might want Beatrice to be a more consistent figure. The procedure forces the contradictions to remain unresolved. Why? Because Beatrice is dead and there is no way to reconcile the accounts. The resistance might come from a desire to give the sisters (and the reader) a clear answer about who Beatrice really was. But the procedure insists that her self is an emergent property of these conflicting narratives and cannot be reduced to a single truth. The resistance is informative because it reveals the human urge to resolve ambiguity, which is exactly what the sisters are struggling with.

  ---

  This procedure should help you build complex characters by letting their selves emerge from the narratives. The judgment calls are opportunities for your authorial voice to shape the story while staying true to the fragmentary nature of the self.
answer: |-
  ### Character-Construction Procedure: Narrative Gravity Method  
  Based on Dennett's "center of narrative gravity," this procedure builds characters **from the outside in**, using narrative fragments (plot events, testimonies, self-narrations) to let a "self" crystallize through contradictions and consistencies. The goal is to generate **actionable outputs** (scenes, decisions, dialogue) by treating the self as an *emergent property* of competing narratives.  

  ---

  ### **Procedure Overview**  
  **Inputs:**  
  - **Plot Events:** Actions taken by/around the character.  
  - **External Testimonies:** How other characters describe/judge them.  
  - **Self-Narrations:** The character’s own voice (first-person, free indirect discourse, diaries).  
  - **Discrepancies:** Gaps between the above (e.g., a character’s self-image vs. others’ perceptions).  

  **Outputs:**  
  - Character decisions under pressure.  
  - Dialogue reflecting narrative dissonance.  
  - Moments of self-betrayal/revision.  
  - Scenes where the "self" destabilizes or solidifies.  

  **Phases:**  
  1. **Fragment Collection** (Gather raw narrative materials).  
  2. **Gravity Well Mapping** (Identify narrative tensions).  
  3. **Crystallization Triggers** (Generate behaviors from tensions).  
  4. **Output Synthesis** (Translate to scenes/actions).  

  **Frequency:** Use once per major character during outlining, then refine during revisions.  

  ---

  ### **Detailed Steps**  
  #### **Phase 1: Fragment Collection**  
  1. **Log Sources:** For each character, create three lists:  
     - **Plot Events:** "What happened?" (e.g., "Character A betrayed Character B").  
     - **External Testimonies:** "What do others say?" (e.g., "Character C calls A 'a coward'").  
     - **Self-Narrations:** "What does the character say about themselves?" (e.g., "A recalls the betrayal as 'necessary'").  
  2. **Flag Discrepancies:** Highlight contradictions (e.g., A sees the betrayal as necessary; C calls it cowardice).  
  3. **Weight Fragments:** Assign provisional "narrative mass" (1–5) based on:  
     - *Source impact* (e.g., a public event > a private thought).  
     - *Repetition* (e.g., multiple characters call A "coward").  

  **Author Judgment Calls:**  
  - Which fragments are included/excluded.  
  - How to weight "mass" (subjective; requires authorial intent).  

  ---

  #### **Phase 2: Gravity Well Mapping**  
  1. **Identify Gravity Wells:** Group fragments into thematic clusters (e.g., "cowardice," "self-justification").  
  2. **Map Tensions:** For each cluster, note:  
     - **Consistencies:** Where sources align (e.g., all agree A avoids confrontation).  
     - **Contradictions:** Where sources clash (e.g., A calls avoidance "tactical"; others call it "fear").  
  3. **Determine Centripetal Forces:** Which tensions exert the strongest "pull" on the character’s actions? (e.g., A’s need to preserve self-image vs. others’ disdain).  

  **Author Judgment Calls:**  
  - Defining thematic clusters.  
  - Deciding which tensions are generative for the story.  

  ---

  #### **Phase 3: Crystallization Triggers**  
  1. **Pressure Scenarios:** Place the character in a high-stakes plot event.  
  2. **Force Collision:** Pit dominant tensions against each other (e.g., A must choose between self-preservation and defending their self-image).  
  3. **Generate Outputs:**  
     - **Decisions:** Which narrative "well" wins? (e.g., A avoids conflict, reinforcing "cowardice" but upholding their "tactical" self-narrative).  
     - **Dialogue:** Weaponize discrepancies (e.g., A says, "I was strategic," while another character scoffs, "You ran").  
     - **Self-Betrayal/Revision:** If pressures rupture the narrative (e.g., A admits, "I was afraid," revising their self-narrative).  

  **Author Judgment Calls:**  
  - Designing pressure scenarios.  
  - Deciding if the self *crystallizes* (resolves tension) or *shatters* (fragments further).  

  ---

  #### **Phase 4: Output Synthesis**  
  Convert triggers into writing prompts:  
  > *"In [Scene X], force Character A to [Action]. Use [Dialogue Y] to expose [Discrepancy Z]. Climax: A either [repeats pattern] or [revises self-narrative]."*  

  **Example Output:**  
  > *At the fundraiser, A is publicly accused of cowardice. They freeze, then say, "I calculated the risks." (Self-narrative upheld). B whispers, "Liar." (Discrepancy exposed). A leaves early—self-betrayal.*  

  ---

  ### **Limitations: Characters the Procedure Handles Poorly**  
  1. **Mythic/Archetypal Characters:** Figures serving as symbols (e.g., "The Wise Old Man") lack narrative fragments to contradict.  
  2. **Pure Observers:** Characters with no agency or described inner life (e.g., background extras).  
  3. **Static Antagonists:** Villains defined by fixed traits (e.g., "pure evil") resist narrative emergence.  
  4. **Author Surrogates:** Characters expressing the author’s voice may drown out external testimonies.  

  ---

  ### **Case Studies**  
  #### **Case 1: First-Person Protagonist (Unreliable Narrator)**  
  **Character:** *Maya*, a historian writing a memoir about her "heroic" activism in the 1990s.  

  **Fragment Collection:**  
  - **Plot Events:** Maya falsifies documents to frame a rival; her protest group collapses.  
  - **External Testimonies:**  
    - Rival: "Maya’s a narcissist who exploited us."  
    - Ally: "She believed the ends justified the means."  
  - **Self-Narration:** "I acted for justice. My sacrifices were misunderstood."  
  - **Discrepancies:**  
    - Self-narrative ("heroism") vs. Plot ("fraud").  
    - Self-narrative ("sacrifice") vs. Testimony ("narcissism").  

  **Gravity Well Mapping:**  
  - **Thematic Clusters:** "Heroism," "Betrayal," "Self-Deception."  
  - **Key Tension:** "Heroic self-image" vs. "Manipulative actions."  
  - **Centripetal Force:** Maya’s need to preserve her narrative of moral superiority.  

  **Crystallization Trigger (Pressure Scenario):**  
  Maya’s daughter discovers the falsified documents and confronts her.  

  **Output Synthesis:**  
  - **Decision:** Maya deflects blame ("I protected you from the truth!").  
  - **Dialogue:**  
    - *Maya:* "History will vindicate me." (Self-narrative).  
    - *Daughter:* "You’re rewriting history *now*." (Discrepancy).  
  - **Self-Betrayal:** Maya burns the documents but writes in her memoir: "I freed us from the past."  

  **Author Resistance & Why It’s Informative:**  
  You might resist making Maya *fully* self-deluded (e.g., wanting her to show remorse). The procedure forces her to double down on her hero narrative, exposing how cognitive dissonance protects her self-image. **Resistance reveals:** Your desire for moral clarity clashes with Dennett’s model—where selves *need* delusion to cohere. Lean into this; let readers question if Maya’s "self" is tragic or toxic.  

  ---

  #### **Case 2: Character Known Only Through External Reports**  
  **Character:** *Eleanor*, a deceased artist described by her family. Never speaks; appears in others’ memories.  

  **Fragment Collection:**  
  - **Plot Events:** Eleanor abandoned her family for an art residency; died alone.  
  - **External Testimonies:**  
    - Husband: "She was selfish. Art mattered more than us."  
    - Daughter: "She was trapped. I think she loved us but couldn’t stay."  
    - Art Critic: "Her work revealed unbearable loneliness."  
  - **Self-Narration:** *None*.  
  - **Discrepancies:**  
    - Husband ("selfish") vs. Daughter ("trapped").  
    - Critic ("loneliness") vs. Husband ("cold").  

  **Gravity Well Mapping:**  
  - **Thematic Clusters:** "Abandonment," "Art vs. Family," "Isolation."  
  - **Key Tension:** "Selfish artist" vs. "Tragic figure."  
  - **Centripetal Force:** The family’s need to reconcile love and anger.  

  **Crystallization Trigger (Pressure Scenario):**  
  The family discovers Eleanor’s final painting: a portrait of them, hidden in her studio.  

  **Output Synthesis:**  
  - **Decision:** Daughter insists on exhibiting the portrait; Husband refuses.  
  - **Dialogue:**  
    - *Daughter:* "She couldn’t come back, but she held us close." (Narrative: trapped).  
    - *Husband:* "She hid it. Like she hid everything." (Narrative: selfish).  
  - **Self-Revision (for the living):** Daughter revises her view of Eleanor; Husband cannot.  

  **Why This Works:**  
  Eleanor’s "self" emerges from the collision of memories. The portrait becomes a gravity well—polarizing interpretations without resolving them.  

  ---

  ### **Key Takeaway**  
  This procedure turns narrative contradictions into generative tools. By letting characters’ selves emerge from fragmented voices, you create:  
  - **Psychological realism:** Characters feel "real" because their coherence is tenuous.  
  - **Thematic depth:** Discrepancies explore how identity is negotiated socially.  
  - **Plot engines:** Tensions force decisions that drive the story.  

  Where the procedure ends (judgment calls), your authorial vision begins—use resistance to interrogate your instincts. Dennett’s model thrives in ambiguity; trust readers to assemble the center of gravity themselves.
