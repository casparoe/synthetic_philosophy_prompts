  I'm trying to wrap my head around Skolem's paradox. The user is a high school senior who's gotten into math logic, probably through their pre-calc teacher's rants about "real" math. They understand that ZFC proves the reals are uncountable via Cantor's diagonal argument, but Skolem showed that if ZFC is consistent, it has a countable model. In that model, there's a set that it calls "the reals," but from outside, that set is countable, so there should be a bijection with the naturals. But ZFC proves no such bijection exists, so the user is wondering if this means ZFC is inconsistent.

