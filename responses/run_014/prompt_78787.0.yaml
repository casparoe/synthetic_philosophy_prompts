answer: |-
  ### The practice, restated
  Iterative deletion of strictly dominated strategies (IDSDS) is a solution concept for finite strategic-form games. A pure strategy for a player is strictly dominated if another strategy (or a probability mixture over their other pure strategies) yields a strictly higher payoff *against every possible combination of strategies* the other players might choose. The procedure iteratively removes all such dominated pure strategies from consideration for all players. After removal, the game is re-examined with the reduced strategy sets; strategies not dominated initially may become dominated in this smaller game and are also removed. This repeats until no further strategies can be deleted. The surviving strategies constitute the solution. The standard justification is that a rational player, knowing their own payoffs and the structure of the game, would never choose a strictly dominated strategy because it is guaranteed to be worse than some alternative, regardless of others' actions.

  ### What it strictly presupposes
  **1. Rationality and its Knowledge:** IDSDS strictly presupposes more than individual rationality; it requires **common knowledge of rationality (CKR)**. Merely assuming each player is rational is insufficient. Rationality here means that a player will only choose strategies that are not strictly dominated *relative to the strategy sets they believe are available to others*. 

  *   **Iteration Requires Mutual Foresight:** The iterative nature is crucial. Deleting a strategy in round one requires Player A to believe Player B is rational and thus won't play *their* dominated strategies. For Player A to delete a strategy in round *two* (which might only be dominated after Player B's round-one dominated strategies are gone), Player A must believe that Player B believes Player A is rational (so Player B expected Player A to delete their round-one dominated strategies). This nesting of beliefs continues to the depth of the iteration. The procedure reaching a fixed point requires that this mutual belief in rationality holds to an arbitrarily high level – essentially, CKR. Locating rationality solely in action ("never *plays* dominated") is incomplete; it crucially depends on rationality being located in **beliefs about others' actions and rationality**. Players must believe others are rational and that others believe *they* are rational, etc., to justify the step-by-step deletion process. The procedure implicitly assumes players model the game and the deletion process identically.

  **2. Mixed Strategies:** Admitting dominance by mixtures strictly presupposes that **mixed strategies represent deliberate acts of randomization by the player whose strategy is being assessed for dominance.** 

  *   **Own-Action Constraint:** The mixture doing the dominating is defined over the *same* player's pure strategies (e.g., Player 1's mixture over their own strategies dominating one of their pure strategies). This mixture *cannot* represent Player 1's uncertainty about Player 2's actions; it inherently represents a course of action Player 1 could actively choose – randomizing deliberately. The comparison is: "Is pure strategy X worse for me than if I, Player 1, deliberately flip coins (or use some device) to play a mix of my other strategies Y and Z, *no matter what Player 2 does*?" The procedure requires this interpretation for the dominated player. It does *not* strictly require mixtures to represent deliberation for *other* players' strategies within the dominance check (where they appear in the "for every opponent profile" clause). Here, uncertainty interpretations *can* fit (Player 1 considers what might happen if Player 2 randomizes, representing Player 1's uncertainty). However, the core act of finding a dominating mixture for *oneself* commits to the deliberative view for the actor.

  **3. Value:** IDSDS with mixed-strategy dominance strictly presupposes **cardinal, expected-utility (EU) measurable payoffs.**

  *   **Lottery Comparison:** Comparing a pure strategy's payoff vector (across opponent profiles) to the payoff vector generated by a mixture requires calculating the *expected* payoff of the mixture for *each* possible opponent pure-strategy profile. This is only meaningful if payoffs represent strength of preference on an interval scale, such that the expected value calculation is valid. Ordinal rankings (only knowing if A is preferred to B) are insufficient; knowing *how much* A is preferred to B relative to other differences is needed to weigh the outcomes in the lottery. The procedure inherently assumes players maximize expected utility based on these cardinal payoffs.
  *   **Comparability:** It presupposes that the goods represented by the payoffs are **comparable across states of the world** (i.e., across different opponent strategy profiles) in a way that allows the expected value calculation. A player must be able to say that the improvement from playing the mix over the pure strategy in one opponent profile outweighs (or is outweighed by) the difference in another profile. This requires a stable, interpersonally comparable (for the single player) cardinal utility scale encompassing all possible outcomes of the game.

  ### What it merely fits
  The practice is compatible with various interpretations beyond its strict presuppositions:

  1.  **Rationality Knowledge:** While requiring CKR in principle for the full iterated process to be justified, the procedure can often be *applied* and yield sensible results in games where only a few levels of mutual knowledge of rationality hold (e.g., only mutual knowledge, not common knowledge), stopping deletion at an earlier stage. It is also compatible with differing depths of strategic reasoning among players, as long as the modeler assumes CKR for the solution concept.
  2.  **Mixed Strategies (Opponents):** While demanding the deliberative view for the player whose strategy is being assessed, IDSDS is perfectly compatible with interpreting *other players'* mixed strategies (within the "for every opponent profile" quantification) as representing the *focal player's uncertainty* about what pure strategy that opponent will choose. The procedure doesn't care *why* the focal player considers an opponent mixture; it only requires checking the expected payoff against it.
  3.  **Value Foundations:** While requiring cardinal EU payoffs for the mixed-strategy comparison, the practice fits comfortably with various underlying foundations for cardinal utility (e.g., von Neumann-Morgenstern rationality axioms, Savage subjective expected utility) without needing to commit to one specific philosophical justification. It also fits with payoffs representing revealed preferences or objective monetary values, as long as they satisfy the EU requirements.

  ### Where it pulls apart
  The presuppositions create internal tensions:

  1.  **Mixed Strategy Duality:** The core tension lies in the mixed strategy interpretation. The procedure strictly requires mixtures for dominance checks to represent a player's own *deliberate randomization capability*. However, the standard epistemic interpretation of mixed strategies in equilibrium concepts (correlated conjectures, subjective uncertainty) is deeply ingrained in game theory pedagogy and foundational discussions. Applying the uncertainty interpretation to the *dominated player's own mixture* is logically incoherent within IDSDS – one cannot be uncertain about one's own deliberate choice in a way that makes a lottery over one's *own* actions a meaningful alternative to a single action *for oneself*. Yet, the procedure relies on this mixture being a viable alternative course of action the player *can and would* consider. This creates an uncomfortable duality: mixtures are treated as deliberate acts when owned by the player being assessed, but might be (and often are) explained as representing others' uncertainty when owned by opponents. The practice cannot consistently hold *both* interpretations *for the same mixture in the same dominance check*.
  2.  **CKR vs. Finite Iteration:** While IDSDS formally requires CKR to justify deletion to an arbitrary depth, practical application always stops after finite steps. This finite stopping point only strictly requires mutual knowledge of rationality up to that finite depth. The gap between the finite application and the infinite regress of CKR is often glossed over in the "rational players never play dominated" justification, which sounds like a one-step principle but licenses an iterative process demanding much more.
  3.  **Cardinal Utility and Comparability:** The requirement for cardinal, comparable utilities across all states pulls against the simplicity of the ordinal preference foundations often assumed in basic choice theory. While necessary for the mixed-strategy comparison, it subtly commits the procedure to a stronger conception of utility than is sometimes acknowledged when presenting payoffs as merely ordinal rankings. The assumption that value differences are comparable across wildly different opponent-induced outcomes can feel like a strong, potentially unrealistic, presupposition in complex games.

  ### The implicit theory
  The implicit theory underlying standard IDSDS practice is this: Players are instrumentally rational expected utility maximizers. They possess common knowledge of this rationality and of the game structure (payoffs, strategies). Rationality entails that a player will never choose a strategy if there exists *another strategy or a deliberate randomizing plan over their own strategies* that yields a strictly higher expected payoff against *every conceivable combination of pure or mixed strategies* the opponents might employ (where opponents' mixtures represent the focal player's uncertainty about their pure choices). Payoffs are cardinal, von Neumann-Morgenstern utilities, ensuring expected payoff calculations are valid and meaningful comparisons can be made across different opponent-induced states. The iterative deletion process is the logical consequence of players mutually reasoning through the implications of this rationality under CKR.

  **Verdict:** This implicit theory is logically coherent *if* one accepts the deliberative interpretation of one's own mixed strategies *for the purpose of dominance checking*. However, the tension between this required deliberative interpretation and the common epistemic (uncertainty) interpretation of mixed strategies elsewhere in game theory creates a significant conceptual fissure. The reliance on CKR, while necessary for the full iterative power, is also a very strong and potentially unrealistic assumption. The theory is functional but philosophically strained, particularly concerning the nature of mixed strategies.

  ### If the load-bearing presupposition goes
  Altering the core presuppositions necessitates changes to the procedure and its teaching:

  1.  **If Common Knowledge of Rationality (CKR) is Abandoned:** The iterative process loses its full justification. The procedure would need to be reframed as applying only up to a specific, finite level of mutual knowledge of rationality (e.g., "rationality and mutual belief in rationality up to depth k"). Teaching would shift to emphasize the dependence of the solution on the assumed depth of strategic reasoning. The "never play dominated" justification would only license the *first round* of deletion; further rounds would require explicit assumptions about higher-order beliefs. Solution sets would often be larger, corresponding to lower depths of mutual knowledge.
  2.  **If the Deliberate Randomization Interpretation of Own Mixtures is Rejected:** Admitting dominance by mixtures becomes problematic. If a player cannot deliberately randomize (or if such randomization isn't considered a feasible strategy), *only pure-strategy dominance* could be used. The procedure would weaken significantly (IDSDS based only on pure strategies). Many solutions provided by mixed-strategy dominance would vanish. Teaching would need to explicitly state that randomization is not considered an available action, severely limiting the power of dominance arguments. The justification would revert purely to "never play a pure strategy dominated by another *single* pure strategy".
  3.  **If Cardinal, Comparable Utilities are Rejected:** Mixed-strategy dominance becomes meaningless. Without cardinal utilities, expected payoff calculations cannot be performed. The only viable dominance concept would again be **pure-strategy strict dominance** (Strategy A is strictly dominated by Strategy B if B yields a strictly better ordinal outcome than A in every possible scenario). IDSDS would be restricted to deleting only pure strategies dominated by another single pure strategy. Teaching would need to emphasize that payoffs are merely ordinal rankings and explicitly exclude any comparison involving mixtures or expectations. The solution concept would be dramatically less powerful, failing to eliminate many strategies that mixed-dominance removes.

  The most load-bearing presupposition is arguably **CKR**, as its removal fundamentally undermines the iterative logic beyond the first step, altering the solution concept's scope and requiring explicit modeling of bounded reasoning. However, dropping **cardinal utilities** or the **deliberative view of own-mixtures** would cause the most direct collapse in the procedure's core technical operation involving mixtures. Teaching would need to rigorously separate the concepts: clearly state when CKR is assumed, explicitly define mixed strategies as deliberate actions for dominance checks (while acknowledging the tension with other interpretations), and constantly reinforce that payoffs must be cardinal and EU-compliant for mixed-dominance to be valid. The simple "never play dominated" slogan would need significant qualification to reflect these underlying complexities.
