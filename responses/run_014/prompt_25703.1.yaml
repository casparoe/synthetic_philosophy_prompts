  *(Hobbes fixes you with a keen, slightly impatient gaze, his voice resonant with conviction and a trace of irritation at the name of Wallis)*

  "Sir, your attention is commendable, and your difficulty noted. But mark this: Wallis, that Professor of *Signs* and Symbols, doth mistake the very foundation of my endeavour, and thence misapprehends the proof entire. He traffics in *algebra*, a cunning shorthand for merchants and surveyors, perhaps, but not the *true* geometry of the Ancients, grounded in the palpable reality of *bodies* and their *motions*. 

  "My construction in *De Corpore* begins not with abstracta, but with the *generation* of magnitudes. The point, a body small; its motion, generating the line – which, being the trace of a moving body, hath *necessary* breadth, however minute. The surface generated by motion of the line hath *necessary* depth, though subtle. To conceive otherwise is to traffic in phantasms! 

  "Now, to the heart of your query: Wallis chargeth me with *assuming* an equality 'twixt a curve and a straight figure? Fie! 'Tis no bare assumption, Sir, but a *consequence demonstrated* from the very principles of generation I have laid down. I do not *beg* the equality; I *derive* it from the consideration of *motions compounded* – motions that generate both the circular arc and the rectilinear figure in question, according to ratios inherent in the nature of motion itself. 

  "Consider: I have shown, by the method of indivisibles – though handled with due regard to the *material basis* of such infinitesimals – how the aggregate of lines generated under specific motions doth produce figures whose areas stand in a known proportion. Wallis, blinded by his algebraic ciphers and infinite series (that parade of mere *potentiality* without actual existence!), sees not the *physical synthesis* I perform. He sees symbols, not *things*. He cries 'assumption!' because his method, divorced from generation and motion, *cannot comprehend* mine. He demands I prove with his abstract tools that which is only truly demonstrable by considering the *real causes* in matter. 

  "And I tell you plainly, Sir, his protestations ring hollow, tainted by the ill-will borne me at Gresham College and the Royal Society. Do they forget how he deciphered the King's papers? A man skilled in *secrets*, Sir, and perhaps more practiced in *politicking* than in the pure light of geometrical reason! My *Leviathan* hath made me enemies who would deny me even in mathematics, where truth should reign absolute. They embrace Wallis's novelties – his 'Arithmetica Infinitorum' – because it flatters their love of *ingenuity* over *substance*, and because it serves to confound Hobbes. 

  "Perchance, in the setting forth, the steps could be made plainer to minds clouded by modern fancies. I may have been... *vigorous*... in my expression. But the quadrature itself? The equality derived? That stands firm upon the rock of true geometry – the geometry of *things*, not *signs*. Wallis doth not refute it; he merely *doth protest* it, with symbols that signify nothing real. The demonstration is in the *generation*, Sir. Had he but the wit to see it, or the honesty to acknowledge it."

  *(He leans back, his expression a mixture of defiance and weary frustration at being thus misunderstood, yet utterly convinced of the solidity of his ground)*
