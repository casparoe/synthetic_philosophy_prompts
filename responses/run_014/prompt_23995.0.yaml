prompt: |-
  I'm a PhD student in the history and philosophy of science, and for the past year I've been working on accounts of scientific progress — the Lakatosian view that a research programme is progressive so long as its internal heuristic keeps yielding novel predictions, and the Kuhnian view that change is a shift between paradigms, where "progress" is at most a widening of the range of problems the new framework can absorb. I keep getting asked, at talks and on qualifying, whether philosophy makes progress, and I've realized I can't answer it without first pinning down what my own criterion is, because the criteria I use for science don't obviously transfer. So I've been going by my gut on a set of concrete cases, and I'd like to know what principle, if any, captures the pattern.

  Here are my verdicts on whether a given development counts as progress in philosophy:

  1. The Gettier counterexamples to the justified-true-belief account of knowledge count as progress, even though they produced no new consensus theory and we may never get one. What got us was a better-mapped problem space, not a better answer.

  2. Russell's theory of descriptions counts as an advance over the pre-Russell treatment of definite descriptions, even though it has since been superseded and some of its central claims are now rejected.

  3. The development of formal logic — Boole, Frege, the logicist programme — counts as progress in philosophy, but I have a persistent sense that this is progress in a tool philosophy uses rather than in philosophy itself: the subject matter (the nature of truth, knowledge, meaning) looks the same before and after Frege.

  4. Kant's critical project is an advance over Hume's empiricist account, but I suspect part of my verdict is the drama of the story — a thinker jolted awake by a rival — rather than a genuine improvement in how the problem is handled.

  5. The rise of experimental philosophy does not count as progress in philosophy. It imports a method from psychology, and I don't think it improves on the armchair method the way formal logic did.

  6. The rise of formal epistemology — probability and decision theory applied to belief, knowledge, and rationality — does count as progress, even though it too is a methodological import from outside philosophy.

  The pair I keep going back and forth on is 5 and 6: both are imports of a method from another discipline, yet I judge one as progress and the other as not, and I can't yet articulate the difference. My tentative guess is that formal epistemology changes the standards by which arguments in the subject matter are evaluated — it gives us a precise notion of coherent, rational belief — whereas experimental philosophy merely supplies a new instrument for eliciting the same kind of evidence the armchair method was already after. If that is the real difference, then 3 falls on the "changes the standards" side, and 1 and 2 fall on a different side altogether: they are not methodological imports at all, but refutations that sharpen the problem.

  What I'd like is a principle, or a small set of candidate principles, stated precisely, that captures these verdicts. For each candidate, tell me which of my cases motivates each clause, what it predicts for cases I haven't listed (say, the rise of computational philosophy, the application of decision theory to ethics, or the analytic revival of metaphysics), and — honestly — which of my six verdicts it cannot accommodate without doing violence to some clause. I don't need it to save all six; if the simplest coherent principle forces me to drop one, I want to know which one and why. I'm not after a bibliography or a survey of the literature on progress; I'm after the criterion itself, stated so that I can apply it to a new case on my own.
reasoning: |-
  Hmm, this is a fascinating and deeply challenging question from a PhD student in HPS. They're wrestling with how to define progress in philosophy when their existing frameworks for scientific progress don't transfer cleanly. The core tension is between their intuitive judgments about specific cases and the need for a principled criterion.

  Let me unpack their examples first. The Gettier case (1) suggests progress can occur through problem-space refinement rather than solution-achievement. Russell's theory (2) indicates that temporary advances count even if later superseded. Formal logic (3) presents a boundary case where methodological tools advance while subject matter remains constant. The Kant-Hume comparison (4) reveals how narrative appeal might contaminate judgments. Most crucially, the experimental vs formal epistemology contrast (5 vs 6) demands an explanation for why one import "counts" and the other doesn't.

  Their proposed distinction between "changes evaluative standards" (formal epistemology/logic) versus "new instrument for same evidence" (experimental philosophy) seems promising but needs testing. I notice their cases cluster into three types: conceptual refinement (1,2), methodological imports (3,5,6), and paradigm shifts (4). The real test will be whether a single principle can cover all types while explaining the 5/6 asymmetry.

  For a candidate principle, I'm considering "conceptual articulation" - progress occurs when we gain new capacities to formulate, distinguish, or evaluate philosophical problems. This would explain:
  - Gettier: Creates finer knowledge distinctions
  - Russell: Enables precise analysis of reference
  - Formal tools: Provide rigorous evaluation standards
  - Kant: Structures epistemology systematically

  It would reject experimental philosophy as merely operationalizing existing intuitions. The sticking point is Kant - is this really progress or just a compelling narrative? The principle might force conceding that some "dramatic" advances are indeed progress through their architectonic power.

  Alternative principles like "problem-solving effectiveness" or "consensus formation" would stumble on Gettier (no consensus) and Russell (superseded). The "standards change" idea explains 3 and 6 well but struggles with 1 and 2 which don't change standards but refine concepts.

  For untested cases: Computational philosophy would likely qualify under this principle by enabling new modeling capacities, while decision theory in ethics would count by providing precision in moral reasoning. The analytic metaphysics revival might split - progress where it generates new distinctions (e.g. modal realism), regress where it reintroduces obscurity.

  The cost: This principle might undervalue empirical methods in philosophy. If experimental philosophy eventually transforms how we conceptualize (e.g. moral psychology forcing ethicists to rethink rationality), it could later qualify as progress - but currently doesn't meet the threshold. That seems consistent with their judgment.

  Ultimately the principle must do two things: explain why methodology imports sometimes transform philosophy (logic, formal ep) and sometimes don't (x-phi), while accommodating non-methodological advances (Gettier). Conceptual articulation achieves this by focusing on how tools reshape philosophical space rather than their origin or permanence.
answer: |-
  Based on your case judgments and the conceptual tension (especially between 5 & 6), I propose the following candidate principle for philosophical progress, designed to capture your intuitions while exposing where they might need adjustment. The core idea is that philosophy progresses through **conceptual articulation**:

  **Principle of Conceptual Articulation (PCA):**  
  *Philosophy makes progress when it develops or refines conceptual resources that:  
  (A) Enable new distinctions or formulations of problems or positions (sharpening the problem space), OR  
  (B) Provide systematic frameworks for evaluating arguments or positions (changing evaluative standards),  
  AND  
  (C) These resources demonstrably enhance the rigor, precision, or scope of philosophical inquiry within their domain, irrespective of empirical import or lasting consensus.*

  ---

  ### Breakdown of PCA & Application to Your Cases:
  1. **Gettier cases (✓ Progress):**  
     - *PCA Fit:* Satisfies (A) and (C). Gettier reframed epistemology by *distinguishing* justification from accidental truth, creating new problem subtypes (e.g., fake barn cases). It enhanced rigor by exposing hidden assumptions.  
     - *Motivation:* Your emphasis on "better-mapped problem space" aligns with (A).

  2. **Russell's theory of descriptions (✓ Progress):**  
     - *PCA Fit:* Satisfies (A) and (C). It introduced *distinctions* (e.g., sense/reference, quantificational vs. referential treatment) and provided a *systematic framework* for analyzing language, enabling precise attacks on ambiguity (e.g., Meinongian objections).  
     - *Motivation:* Advances even when superseded fit (C) – it raised the standard for semantic analysis.

  3. **Formal logic (✓ Progress):**  
     - *PCA Fit:* Primarily satisfies (B) and (C). It provided *systematic standards* for validity, consistency, and proof, transforming how arguments in metaphysics, philosophy of language, and epistemology are *evaluated*.  
     - *Motivation:* Your "tool" intuition is captured by (B) – it changes evaluation, not subject matter directly. (C) explains why it’s philosophical progress: it forces precision (e.g., in defining entailment).

  4. **Kant over Hume (✓ Progress):**  
     - *PCA Fit:* Satisfies (A), (B), and (C). Kant *formulated* synthetic a priori judgments as a new problem type (A), created a *framework* for evaluating metaphysics (transcendental idealism) (B), and expanded philosophy’s *scope* to include conditions of experience (C).  
     - *Motivation:* Dramatic narrative aside, PCA isolates conceptual advances (e.g., the Copernican turn) that meet (C).

  5. **Experimental philosophy (X-Phi) (✗ Progress):**  
     - *PCA Fit:* **Fails (A) and (B).** It gathers empirical data about intuitions but doesn’t inherently refine conceptual distinctions or alter evaluative standards for philosophical claims (e.g., a folk intuition survey doesn’t change how we define "knowledge"). At best, it *informs* existing methods without articulating new philosophical resources.  
     - *Motivation:* Your "new instrument for same evidence" critique – PCA formalizes this as lacking (A)/(B).

  6. **Formal epistemology (✓ Progress):**  
     - *PCA Fit:* Satisfies (B) and (C). It provides *systematic frameworks* (e.g., Bayesian coherence, decision-theoretic rationality) that *change standards* for evaluating beliefs/justification (B). It enhances rigor by formalizing concepts like "rational credence" (C).  
     - *Motivation:* Solves the 5/6 asymmetry: unlike x-phi, it changes *how arguments are judged* (B).

  ---

  ### PCA's Predictions for Unlisted Cases:
  - **Computational philosophy (e.g., formal ontology, computational metaphysics):**  
    *Prediction: ✓ Progress.* Satisfies (B) if it provides frameworks for evaluating metaphysical claims (e.g., consistency checks in mereology) and (C) by enabling precision. Fails if merely automating existing analyses.

  - **Decision theory applied to ethics (e.g., rational choice models of morality):**  
    *Prediction: ✓ Progress.* Satisfies (B) by offering standards for evaluating rational action in moral dilemmas and (C) through formalization (e.g., game-theoretic accounts of cooperation).

  - **Analytic revival of metaphysics (e.g., Kripke, Lewis):**  
    *Prediction: ✓ Progress.* Satisfies (A) by distinguishing necessity/a priority (Kripke) or modal realism/actualism (Lewis), and (C) through rigorous argumentation.

  - **Phenomenology (e.g., Husserl’s epoché):**  
    *Prediction: ✓ Progress.* Satisfies (A) by refining distinctions (e.g., noema/noesis) and (B) via a framework for evaluating subjective experience.

  - **Neuroscience-inspired philosophy of mind:**  
    *Prediction: ✗ Progress* (under PCA). Like x-phi, it imports data but may lack (A)/(B) – e.g., neural correlates don’t inherently redefine "consciousness" conceptually. Could satisfy (A) if it forces new distinctions (e.g., access vs. phenomenal consciousness).

  ---

  ### Honest Limitations & Trade-offs:
  PCA **cannot cleanly accommodate your verdict on Kant (Case 4)** without a concession. Your suspicion that "drama" influences your judgment points to a gap: PCA validates Kant’s progress due to conceptual advances (A/B/C), but it doesn’t exclude cases where historical narratives *inflate* perceived progress. If you believe your Kant verdict is partly aesthetic, PCA might overfit by rationalizing it. Yet dropping Kant’s progress would violate (A)/(B)/(C). **Trade-off: PCA saves all cases except this tension, but only if you accept that Kant genuinely advanced conceptual resources.**

  **Alternative principles and why they fail your cases:**
  1. *Consensus-building:* Fails Gettier (no consensus) and Russell (theory rejected).
  2. *Problem-solving:* Fails Gettier (no solution) and formal logic (no "problem" solved).
  3. *Empirical fruitfulness:* Fails most cases (e.g., Gettier, logic) and wrongly accepts x-phi.
  4. *Tool-import neutrality:* Fails to distinguish 5 and 6.

  ---

  ### Refined Principle for Your Use:
  **Final PCA (for application):**  
  *Philosophy progresses when it produces resources that:  
  (A) Generate finer-grained conceptual distinctions or problem formulations, OR  
  (B) Establish new standards for systematic evaluation of positions,  
  AND  
  (C) These resources increase the precision, rigor, or scope of philosophical discourse in their domain.  
  Methodological imports only constitute progress if they achieve (A) or (B).*

  Apply to new cases by asking:  
  1. Does this development *create new philosophical distinctions* or *redefine how we frame problems*? (A)  
  2. Does it *change how we assess the validity, coherence, or defensibility* of claims? (B)  
  3. Does it make arguments *less ambiguous, more tractable, or broader in applicability*? (C)  
  If all "no," it’s likely not progress under PCA; if (A) or (B) + (C), it is.

  This captures your core intuition (conceptual/systematic advance over consensus/solutions), explains the 5/6 split (B is key for imports), and forces clarity on Kant (if his framework genuinely satisfies B/C, it’s progress). If you reject PCA, the conflict likely lies in Case 4 – but revising that verdict may better align your gut with your principle.
