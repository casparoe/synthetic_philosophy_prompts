prompt: |-
  I serve on the cause-prioritization committee of a mid-sized foundation. Every application is scored by the committee on three dimensions — importance, tractability, neglectedness — each on a 1-to-10 scale, and the scores are entered in the minutes before the funding decision is taken. Our record over the past three years runs as follows:

  1. Scale-up of a well-evidenced cash-assistance program in a region where several large funders already operate. I = 7, T = 9, N = 2. Rejected.
  2. A novel delivery mechanism for an established vaccine, mid-development. I = 9, T = 4, N = 8. Funded in full.
  3. An advocacy campaign in a policy area already receiving heavy outside attention. I = 6, T = 6, N = 2. Rejected.
  4. A speculative research program with a thin evidence base but a potentially transformative payoff. I = 10, T = 2, N = 8. Funded, though only as a small milestone-gated exploratory grant rather than the full request.
  5. A modest, well-evidenced improvement in a field almost nobody else funds. I = 4, T = 8, N = 7. Funded.
  6. Mid-level technical work, reasonable feasibility, moderate outside attention. I = 8, T = 7, N = 5. Funded.

  Next month we decide an application scored I = 7, T = 7, N = 4. Two contextual details are not captured by those numbers. First, the field contains only four organizations, two of which are the area's largest existing funders, and roughly three years' worth of committed money for comparable work already sits unspent; the applicant states plainly that our grant would be absorbed, but that near-identical projects are funded elsewhere through the end of the decade. Second, two of the seven importance points rest on second-order effects — researchers trained by the project moving on to other cause areas — and the minutes for case 2 record the chair explicitly declining to credit that kind of downstream benefit when scoring.

  What should we decide if we want to be consistent with our own record? In answering, please do the following. Set out the candidate decision rules that our six precedents leave open; my own suspicion is that at least a multiplicative rule, an additive rule, and some treatment of neglectedness as a gate or as a measure of marginal dollars rather than of headcount all survive the record, but tell me if you find others, and tell me if any of these is in fact ruled out. For each surviving rule, state what it implies for this application, and what it implies if the second-order component of the importance score is not credited. Identify which precedent is the closest analog and say whether that analogy is doing any real work or merely restating the rule you have already chosen. Then give me your best guess at the decision, together with your reasons for preferring the rule that generates it over the alternatives — including, if it matters to you, how much parameter slack each rule needs in order to fit all six precedents. Finally, if the record genuinely underdetermines this case, describe a further application, concretely enough that we would recognize it if it arrived, whose outcome would discriminate among the live rules; and state what principle we would be committing ourselves to if we fund, and what different principle we would be committing ourselves to if we refuse.

  Lead with your recommended decision in your first sentence, then give the reasoning; no preamble and no restatement of the question.
reasoning: |-
  Hmm, the user is part of a foundation's cause-prioritization committee and needs help with a funding decision. They've provided six historical cases with scores on Importance (I), Tractability (T), and Neglectedness (N), plus a new application scored I=7, T=7, N=4. There are two key contextual details: the field has low neglectedness (only 4 organizations with 3 years of committed money unspent), and 2 of the 7 importance points come from second-order effects that the chair previously discounted in case 2.

  I need to determine consistent decision rules based on past decisions. The user suspects multiplicative rules, additive rules, or rules treating neglectedness as a gate might fit. Let me analyze the precedents:

  First, rejected cases:
  - Case 1: I7 T9 N2 → rejected. High T but very low N.
  - Case 3: I6 T6 N2 → rejected. Moderate I and T but very low N.

  Funded cases:
  - Case 2: I9 T4 N8 → funded. High I and N despite low T.
  - Case 4: I10 T2 N8 → funded partially. Very high I and N with low T.
  - Case 5: I4 T8 N7 → funded. Low I but high T and N.
  - Case 6: I8 T7 N5 → funded. Moderate-high scores across the board.

  The new application is I7 T7 N4 - moderate scores but low N, with contextual concerns about actual neglectedness and questionable importance points.

  For decision rules, let's see what fits all six cases:

  1. **Multiplicative rule (I×T×N)**:  
     - Case 1: 7×9×2=126 → rejected (fits)  
     - Case 2: 9×4×8=288 → funded (fits)  
     - Case 3: 6×6×2=72 → rejected (fits)  
     - Case 4: 10×2×8=160 → funded (fits, since partial funding might tolerate lower score)  
     - Case 5: 4×8×7=224 → funded (fits)  
     - Case 6: 8×7×5=280 → funded (fits)  
     Threshold seems around 150-160? Case 4 was partially funded at 160, case 1 rejected at 126.  

  2. **Additive rule (I+T+N)**:  
     - Case 1: 7+9+2=18 → rejected  
     - Case 2: 9+4+8=21 → funded  
     - Case 3: 6+6+2=14 → rejected  
     - Case 4: 10+2+8=20 → funded (partial, so maybe threshold near 20)  
     - Case 5: 4+8+7=19 → funded (fits if threshold is ≤19)  
     - Case 6: 8+7+5=20 → funded  
     Threshold ~19-20? Case 5 funded at 19, case 3 rejected at 14.  

  3. **Neglectedness as gate (e.g., require N≥X)**:  
     All funded cases have N≥5 (case 2 N8, case 4 N8, case 5 N7, case 6 N5). Rejected cases have N=2. So N≥5 gate fits. But case 6 has N=5 funded, so gate at N=5?  

  4. **Marginal $ not headcount**: Context suggests N=4 overstates actual neglectedness due to unspent funds. Precedents don't directly contradict, but case 6 (N=5 funded) had "moderate outside attention" which might be similar.  

  Now for new application:  
  - Scores: I7 T7 N4 → Mult: 7×7×4=196, Add: 7+7+4=18  
  - But context: N=4 is inflated (only 4 orgs, 3yrs unspent $), and 2 I-points are invalid per case 2 precedent.  

  **Adjusting scores**:  
  - Invalid importance: Chair discounted second-order effects in case 2, so here I should be 7-2=5.  
  - Neglectedness: Field saturated, so effective N lower. Precedents reject N=2, fund N≥5. N=4 might be borderline, but context suggests it's overrated. Let's say effective N=3 or less.  

  **Applying rules with adjustments**:  
  1. Multiplicative:  
     - With adjustments: I5 T7 N3 → 5×7×3=105 (below threshold ~150) → reject  
     - Without adjusting I: I7 T7 N3=147 (still below? Case 4 partial at 160) → likely reject  
  2. Additive:  
     - Adjusted: 5+7+3=15 (below 19) → reject  
     - Unadjusted I: 7+7+3=17 (still below 19) → reject  
  3. Neglectedness gate: Effective N≤3 <5 → reject  

  **Closest analog**: Case 3 (I6 T6 N2 rejected) - similarly low N with moderate I/T. Case 6 (I8 T7 N5 funded) had higher N, which was likely the key difference.  

  **Why prefer multiplicative rule?**  
  - Better explains partial funding in case 4 (I10 T2 N8=160) vs full funding in case 2 (288) and case 6 (280). Additive has case 4 (20) close to case 6 (20) but one was partial.  
  - Multiplicative penalizes low N more harshly, which aligns with rejections of cases 1 and 3 despite decent I/T.  
  - Requires less parameter slack: additive needs threshold between 18 (rej) and 19 (fund), which is tight. Multiplicative has clearer gap (126 rej vs 160+ fund).  

  **If underdetermined**: Propose a test case - e.g., I5 T5 N5. Multiplicative (125) might reject (below 150), additive (15) rejects, but if funded, suggests additive isn't used or threshold is lower. Principle: Funding it commits to additive-like thresholds; rejecting commits to multiplicative or high N-gate.  

  **Recommendation**: Reject. Consistency with precedents (low N rejected even with moderate I/T) and adjusted scores fall below thresholds. Multiplicative rule fits best with partial funding nuance.
answer: |-
  Reject the application.  

  ### Candidate Decision Rules Surviving the Six Precedents  
  1. **Multiplicative rule (I×T×N)**:  
     - Precedents fit with a threshold of ~150–160. Case 1 (7×9×2=126) rejected; Case 2 (9×4×8=288) funded; Case 3 (6×6×2=72) rejected; Case 4 (10×2×8=160) partially funded; Case 5 (4×8×7=224) funded; Case 6 (8×7×5=280) funded.  
     - Implies for new application (I7 T7 N4):  
       - Unadjusted: 7×7×4=196 → **fund** (above 160 threshold).  
       - With I adjusted (removing invalid 2 points): I5→5×7×4=140 → **reject** (below 160).  
     - Slack: Minimal; all cases fit within a narrow threshold band (72–288 range, cutoff ~150–160).  

  2. **Additive rule (I+T+N)**:  
     - Precedents fit with a threshold of ~18–20. Case 1 (7+9+2=18) rejected; Case 2 (9+4+8=21) funded; Case 3 (6+6+2=14) rejected; Case 4 (10+2+8=20) partially funded; Case 5 (4+8+7=19) funded; Case 6 (8+7+5=20) funded.  
     - Implies for new application:  
       - Unadjusted: 7+7+4=18 → **reject** (at threshold minimum).  
       - With I adjusted: 5+7+4=16 → **reject**.  
     - Slack: Tight; threshold must exclude 18 (rejected in Case 1) but include 19 (funded in Case 5).  

  3. **Neglectedness gate (require N ≥ X)**:  
     - Precedents fit with N ≥ 5 as a funding gate. All funded cases have N≥5 (Cases 2,4,5,6); all rejected have N=2 (Cases 1,3).  
     - Implies for new application (N=4): **reject** (fails gate). Context (unspent funds, duplicate projects) reinforces N=4 overstates neglectedness.  
     - Slack: High; no upper-bound constraint, but gate must be N=5 (Case 6 funded at N=5).  

  4. **Neglectedness as marginal dollars (weight N when funding adds unique value)**:  
     - Precedents fit: Cases 1/3 rejected due to saturation; Case 5 funded despite low I because high N implies marginal impact.  
     - Implies for new application: Context (excess committed money, duplicate projects) shows low marginal impact → **reject**.  
     - Slack: Moderate; relies on contextual interpretation but aligns with rejections for saturation.  

  **Ruled-out rules**:  
  - Pure I/T focus (ignoring N): Contradicts rejection of Case 1 (high I/T, low N).  
  - Linear weighted sum (e.g., 2I + T + N): Fails Case 2 (funded despite low T) and Case 5 (funded despite low I).  

  ### Closest Analog and Its Role  
  - **Case 3 (I6 T6 N2, rejected)** is the closest analog. Both have moderate I/T but low N (N=2 vs. N=4) and operate in saturated fields. The analogy actively reinforces consistency: rejecting low-N proposals regardless of solid I/T. It does real work by emphasizing neglectedness as decisive, beyond just restating rules.  

  ### Best Guess and Rule Preference  
  **Decision**: Reject.  
  **Preferred rule**: **Neglectedness gate (N ≥ 5)**, supplemented by contextual adjustment for marginal dollars.  
  **Reasons for preference**:  
  - **Fit with precedents**: The gate cleanly separates all six decisions (funded when N≥5, rejected when N=2). Multiplicative/additive rules require threshold fine-tuning (e.g., Case 5’s 224/19 barely funded, Case 1’s 126/18 rejected), but the gate is binary and consistent.  
  - **Parameter slack**: The gate has high slack (only one parameter: N≥5), while multiplicative/additive need precise thresholds. Contextual marginal-dollar interpretation (e.g., unspent funds) resolves ambiguity in N scoring.  
  - **Contextual dominance**: The application’s details (redundant funding, inflated N) mirror Case 3’s rejection logic. Discounting second-order I points (per Case 2 precedent) further lowers appeal but isn’t essential; even unadjusted, the additive rule rejects (score=18), and N=4 fails the gate.  
  - **Philosophical alignment**: The foundation consistently funds high-neglectedness causes (Cases 2,4,5) or solid all-rounders (Case 6), avoiding crowded areas (Cases 1,3). This rule prioritizes unique impact.  

  ### If Underdetermined: Discriminating Test Case  
  **Propose a new application**: I=5, T=5, N=5, in a field with moderate saturation but high marginal impact per dollar (e.g., technical tools for a niche disease with 5 active funders, but our grant unlocks a collaboration bottleneck).  
  - **Outcome discrimination**:  
    - If funded, supports additive rule (score=15, assuming threshold ≤19) or multiplicative rule (score=125, if threshold ≤160).  
    - If rejected, supports neglectedness gate (N=5 barely passes, so rejection implies stricter rules like multiplicative with high thresholds).  
  - **Principles committed**:  
    - **If funded**: We prioritize moderate, balanced proposals with tolerable neglectedness (committing to additive/multiplicative thresholds).  
    - **If rejected**: We require either higher neglectedness (N>5) or exceptional I/T (committing to neglectedness as a strict gate or high multiplicative thresholds).
