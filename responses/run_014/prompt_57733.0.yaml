prompt: |-
  I'm teaching a fifty-minute methods section to an incoming cohort of first-year epistemology PhD students — roughly half arrive from statistics or machine learning, half from literature and history, all with one term of probability and no decision theory — and the topic is the accuracy-dominance argument for probabilism: that a credence function violating the probability axioms is accuracy-dominated, world by world, by some coherent alternative under a strictly proper scoring rule. I don't want the argument explained to me. I want a plan for building it in front of them in that hour, board only, no slides.

  Give me the order the components have to go in and what makes that order forced rather than merely convenient — in particular whether the notion of a strictly proper scoring rule has to be secured before or after the dominance calculation, and precisely what breaks if I reverse it. Then the single worked example I should carry the whole thing on: how many worlds it needs, which numbers go on the board, which axiom violation it exhibits, and what it must conspicuously lack so that nobody mistakes it for a betting setup. Then the misconception map. I already expect the statistics half to hear "proper scoring rule" and file this under incentive design for forecasters, and the humanities half to think everything rests on the prior illegitimacy of treating degrees of belief as numbers; add the ones I haven't anticipated, including whatever happens when someone concludes that dominance licenses being as extreme as possible, and the objection that picking the scoring rule is picking the conclusion. For each, say at which point in the sequence it has to be headed off and with what move. Close with one question I can write on the board in the last five minutes whose answers separate students who could rerun the argument under a different scoring rule from students who can only recite it, and a short list of what I should openly refuse to explain at this level.

  Please structure the response as follows: (1) "Dependency map" — the components in order, each transition justified in a sentence or two, about 350 words; (2) "The carrying example" — the board table itself and the features it must and must not have, about 250 words; (3) "Misconceptions, and where to defuse them" — one subsection per misconception, about 600 words total; (4) "The closing question" — the question, what a good answer looks like, and what a diagnostic bad answer looks like, about 150 words; (5) "What I leave out and say I'm leaving out" — about 100 words.
reasoning: |-
  Hmm, the user is teaching a methods section for first-year epistemology PhD students on the accuracy-dominance argument for probabilism. They need a detailed plan for a fifty-minute board-only lecture. The cohort has diverse backgrounds: half from stats/ML, half from humanities, all with one term of probability but no decision theory.

  The core challenge is structuring the argument's components in a logically necessary order. The key dependency is that strictly proper scoring rules must be defined before proving dominance, because the proof relies on their expected accuracy minimization property. Reversing this would make the dominance proof appear arbitrary rather than inherent to coherence.

  For the worked example, I'll suggest a minimal 3-world case violating additivity (e.g., credences 0.4, 0.4, 0.3 for A,B,A∨B). The numbers must be inconsistent yet plausible to avoid seeming like a betting scenario. Crucially, the example must exclude stake-like weights to prevent confusion with Dutch books.

  The misconception map needs special attention. Stats students might fixate on incentive design aspects of scoring rules, requiring early emphasis on epistemic (rather than practical) accuracy. Humanities students may resist numerical credences upfront, so I'll suggest grounding them in Locke/James first. Both groups might misread dominance as advocating extremism, needing clarification that it's about coherence, not values. The "scoring rule cherry-picking" objection requires showing how strict propriety makes Brier score uniquely natural.

  The closing question should test understanding beyond rote learning. Something like "Why wouldn't absolute-value scoring work?" would reveal if students grasp convexity's role in making dominance arguments possible.

  Finally, I'll clearly bracket decision-theoretic foundations and infinite cases to maintain focus. The goal is a self-contained proof, not comprehensive coverage.
answer: |-
  ### (1) Dependency Map (Order of Components)  
  *(~350 words)*  

  **1. Credence Functions & Worlds:** Define a finite set of possible worlds \(W\) (e.g., 3 worlds) and a credence function \(c\) assigning numbers [0,1] to propositions in an algebra. *Why first?* Students must grasp the ontology: credences are world-relative partial beliefs, not betting dispositions.  

  **2. Scoring Rules (as Accuracy Measures):** Introduce \(s(c(A), w)\): the accuracy score when \(A\) is true/false in \(w\) (e.g., \(s(0.7,1) = \text{score}\) if \(c(A)=0.7\) and \(A\) is true). *Why here?* Accuracy-centric epistemology requires quantifying "closeness to truth" *before* evaluating coherence.  

  **3. Strict Propriety:** Define a strictly proper scoring rule (SPR) as one where *each* coherent \(c\) uniquely minimizes *expected* accuracy loss *by its own lights*. Use the Brier score \(s(x,1) = -(1-x)^2\), \(s(x,0) = -x^2\) as the canonical example. **This MUST precede dominance proofs.** *Why forced?* Reversing (e.g., showing dominance first) makes SPR appear *ad hoc*. Propriety’s self-recommendation property (coherent credences "trust themselves") is the *engine* of the dominance result—it links internal coherence to external dominance.  

  **4. Accuracy-Dominance Defined:** Explain that \(c\) is accuracy-dominated if \(\exists\) coherent \(c'\) such that in *every* world, \(c'\) is strictly more accurate than \(c\). *Why after SPR?* Dominance is meaningless without a fixed accuracy measure. SPR ensures the criterion isn’t arbitrary.  

  **5. Proof Sketch:** For incoherent \(c\), construct \(c'\) as a "mixture" of \(c\) and coherent alternatives. Use SPR’s expected-accuracy minimization to show \(c'\) dominates \(c\). *Why last?* The construction relies on propriety’s convexity properties. Skipping to dominance without SPR guts the argument’s generality.  

  **6. Theorem Statement:** Incoherent credences are accuracy-dominated under *any* SPR; coherent ones are not. *Closes the loop:* Propriety enables dominance, which vindicates probabilism.  

  ---

  ### (2) The Carrying Example  
  *(~250 words)*  

  **Board Setup:**  
  - **Worlds (3):** \(w_1\) (A true, B false), \(w_2\) (A false, B true), \(w_3\) (A true, B true).  
  - **Propositions:** A, B, A∨B.  
  - **Incoherent Credences (violates additivity):**  
    - \(c(A) = 0.6\), \(c(B) = 0.6\), \(c(A∨B) = 0.6\).  
    *(Note: \(P(A∨B) \leq P(A) + P(B) = 1.2\), but \(0.6 < 0.6 + 0.6 - 0.6 = 0.6\)? Violates \(P(A∨B) \geq \max(P(A),P(B))\) since \(A,B\) not mutually exclusive.)*  
  - **Coherent Dominator:** \(c'(A) = 0.5\), \(c'(B) = 0.5\), \(c'(A∨B) = 0.75\).  

  **Accuracy Table (Brier Score, lower = better):**  
  | World | \(c(A)\) | \(c'(A)\) | \(c(B)\) | \(c'(B)\) | \(c(A∨B)\) | \(c'(A∨B)\) | **Total c** | **Total c'** |  
  |-------|----------|-----------|----------|-----------|------------|-------------|-------------|--------------|  
  | \(w_1\) | −(1−0.6)² = −0.16 | −(1−0.5)² = **−0.25** | −(0−0.6)² = −0.36 | −(0−0.5)² = **−0.25** | −(1−0.6)² = −0.16 | −(1−0.75)² = **−0.0625** | **−0.68** | **−0.5625** |  
  | \(w_2\) | −(0−0.6)² = −0.36 | −(0−0.5)² = **−0.25** | −(1−0.6)² = −0.16 | −(1−0.5)² = **−0.25** | −(1−0.6)² = −0.16 | −(1−0.75)² = **−0.0625** | **−0.68** | **−0.5625** |  
  | \(w_3\) | −(1−0.6)² = −0.16 | −(1−0.5)² = **−0.25** | −(1−0.6)² = −0.16 | −(1−0.5)² = **−0.25** | −(1−0.6)² = −0.16 | −(1−0.75)² = **−0.0625** | **−0.48** | **−0.5625** |  

  **Crucial Features:**  
  - **Must lack:** Stake weights, odds, or money. Avoid columns for "bet outcomes" or "payouts".  
  - **Must have:** Worlds where A∨B’s truth-value depends on disjuncts (e.g., \(w_3\) exposes additivity failure).  
  - **Why 3 worlds?** Fewer worlds (e.g., 2) can mask additivity violations; more overcomplicates calculations.  

  ---

  ### (3) Misconceptions, and Where to Defuse Them  
  *(~600 words)*  

  #### **Misconception 1: "Accuracy scores are about incentivizing forecasters"**  
  - **Source:** Stats/ML cohort hearing "proper scoring rule".  
  - **When to defuse:** Immediately after defining scoring rules (Step 2).  
  - **Move:** Emphasize epistemic (not pragmatic) interpretation: "This is about *gradational accuracy*—how ‘close’ your credence is to truth-value 1 or 0. We’re not designing incentives; we’re measuring *knowledge*." Contrast with forecasting competitions.  

  #### **Misconception 2: "Numerical credences are illegitimate for belief"**  
  - **Source:** Humanities cohort resisting quantification.  
  - **When to defuse:** Before defining credences (Step 1).  
  - **Move:** Ground in historical epistemology: "Locke’s ‘degrees of assent’ or James’ ‘living options’—we’re formalizing intuitive ideas. Numbers are *models*; we test if probabilistic coherence improves accuracy."  

  #### **Misconception 3: "Dominance implies extremism (0/1 credences)"**  
  - **Source:** Seeing \(c'\) outperform \(c\), and equating "accuracy" with "certainty".  
  - **When to defuse:** During dominance definition (Step 4) *and* example.  
  - **Move:** Highlight \(c'\)’s moderate values (0.5, 0.75) in the table. Stress: "Dominance punishes *incoherence*, not uncertainty. The coherent dominator isn’t extreme—it’s *consistent*."  

  #### **Misconception 4: "Choosing the scoring rule cherry-picks for probabilism"**  
  - **Source:** Noticing only SPRs deliver dominance.  
  - **When to defuse:** After proving the theorem (Step 6).  
  - **Move:** Argue for SPRs independently: "Why should coherent credences *trust themselves*? Because if your credences are consistent, you *shouldn’t* expect to do better by lying to yourself." Show non-SPRs (e.g., absolute value) fail dominance.  

  #### **Misconception 5: "This assumes probabilistic norms to prove them"**  
  - **Source:** Suspicion that propriety encodes probabilism.  
  - **When to defuse:** During strict propriety definition (Step 3).  
  - **Move:** Explicitly calculate expected score: For coherent \(c\), \(E_{c}[s(c(A))] < E_{c}[s(x)] \forall x \neq c(A)\). Note this uses \(c\)’s expectations *whether or not* \(c\) is coherent—propriety isn’t circular.  

  #### **Misconception 6: "Dutch Books = Accuracy-Dominance"**  
  - **Source:** Conflating pragmatic and epistemic arguments.  
  - **When to defuse:** Before scoring rules (Step 2).  
  - **Move:** Contrast: "Dutch Books exploit you *as a bettor*. Accuracy-dominance exposes you *as a believer*—even with no money at stake."  

  ---

  ### (4) The Closing Question  
  *(~150 words)*  

  **Question:** *"Why wouldn’t the absolute-value scoring rule \(s(x,1) = -|1-x|\), \(s(x,0) = -|x|\) work for an accuracy-dominance argument?"*  

  - **Good Answer:** "It’s not strictly proper. A coherent credence \(c(A)=0.6\) doesn’t uniquely minimize expected score—\(c(A)=0.7\) has the same expected loss. Without unique self-recommendation, we can’t construct a dominator. Incoherent credences may be undominated (e.g., if \(c(A)=0.6\), \(c(B)=0.6\), \(c(A∨B)=1.0\) for independent A,B)."  
  - **Diagnostic Bad Answer:** "Because it gives different scores" (vagueness); "Because probabilities need squared error" (dogmatism); "It doesn’t punish errors enough" (misses convexity).  

  ---

  ### (5) What I Leave Out and Say I’m Leaving Out  
  *(~100 words)*  

  **Explicitly omit:**  
  1. **Generalization to infinite cases:** "We’re restricting to finite algebras; infinite sets require measure theory."  
  2. **Alternative dominance formulations:** "We’re not discussing *non-strict* propriety or imprecise credences."  
  3. **Decision-theoretic foundations:** "We’re not deriving scoring rules from ‘epistemic utilities’ today."  
  4. **Objections from epistemic externalism:** "We’re bracketing whether accuracy *actually* tracks truth-conduciveness."  
  5. **Comparison to Dutch Books:** "We’re treating this as a standalone epistemic argument, not a refinement of pragmatic ones."  

  **Justification:** "This is a first-pass proof. We isolate the core argument before scaling up. Ask me about extensions after class!"
