prompt: |-
  I manage a customer support team. Last year we introduced a metric — average resolution time — and tied it to quarterly bonuses. Within two quarters, resolution times dropped sharply, but I began noticing that agents were closing tickets before problems were actually solved, routing difficult cases into procedural dead ends, and subtly discouraging customers from following up. When I raised this, our operations lead argued that the metric is working: it surfaced inefficiencies we can now address with better training. But my instinct is that we have created a new problem rather than solved the original one. I cannot tell whether we picked the wrong metric, whether tying it to compensation is the culprit, or whether any quantified target will eventually be gamed. What is actually going on here, and how should I think about fixing it? Please end with a one-sentence summary of your diagnosis.
reasoning: |-
  Okay, the user manages a customer support team and introduced a metric—average resolution time—tying it to bonuses. Initially, resolution times dropped, but then problems emerged: agents closing tickets prematurely, routing difficult cases to dead ends, and discouraging follow-ups. The operations lead sees this as uncovering inefficiencies for training, but the user feels they've created a new problem. 

  First, I need to understand the core issue. It's a classic case of Goodhart's Law: when a measure becomes a target, it ceases to be a good measure. The agents are gaming the system because their bonuses depend on hitting the metric. The user is questioning whether the metric itself is wrong, if tying it to compensation is the issue, or if any quantified target will be gamed. 

  Looking deeper, the user's instinct is spot on—they've incentivized the wrong behavior. The operations lead is optimistic, thinking training can fix it, but the structural incentive is the real problem. Agents are prioritizing speed over actual resolution, which hurts customer satisfaction and trust. 

  The user's unspoken needs might include maintaining team morale while ensuring genuine problem-solving. They might also need to present a compelling case to leadership to change the system without seeming like they're undermining the original goal. 

  Underlying issues: The metric lacks balance. Resolution time alone doesn't capture quality or customer experience. Tying it directly to bonuses without safeguards encourages shortcuts. Any single metric is vulnerable to gaming. 

  Solutions should involve multiple metrics to balance speed and quality, decouple bonuses from single targets, and involve agents in creating a better system. Training alone won't work if incentives remain misaligned. 

  The diagnosis needs to be concise, highlighting the core problem: misaligned incentives leading to metric manipulation.
answer: |-
  This is a textbook case of **Goodhart's Law in action**: "When a measure becomes a target, it ceases to be a good measure." By tying **Average Resolution Time (ART)** directly and significantly to compensation, you incentivized agents to optimize *for the metric itself* (short ART), rather than the *underlying business goal* (solved customer problems). The metric was gamed because the reward structure made it rational for agents to prioritize speed over resolution quality.

  **What's Actually Happening:**

  1.  **Misaligned Incentives:** Bonuses tied solely to ART make "closing the ticket quickly" the primary objective, overriding "solving the customer's problem."
  2.  **Metric Manipulation:** Agents discovered the easiest ways to reduce ART were often detrimental to quality: premature closure, deflection, discouraging follow-up, and misrouting.
  3.  **Surface Efficiency vs. Hidden Costs:** While *reported* ART dropped, the *true cost* shifted to hidden areas: increased repeat contacts, customer frustration, erosion of trust, potential compliance risks, and unresolved issues bubbling into more complex problems later.
  4.  **Operations Lead's Misinterpretation:** Seeing the drop in ART as "success" and the negative behaviors as "trainable inefficiencies" misses the point. The behaviors aren't incidental inefficiencies; they are the *direct, rational consequence* of the incentive structure applied to this specific metric. Training won't fix the fundamental conflict; it will only teach agents *how to game the system less obviously* or make them resentful.

  **How to Think About Fixing It:**

  1.  **Decouple Bonuses from Single Metrics:** Immediately stop tying bonuses *solely* or *primarily* to ART. This is the core driver of the gaming behavior.
  2.  **Adopt a Balanced Scorecard:** Use multiple, complementary metrics that reflect the *full* value of good support:
      *   **Quality:** First Contact Resolution (FCR) rate, Customer Satisfaction (CSAT) or Net Promoter Score (NPS), Quality Assurance (QA) scores from ticket reviews.
      *   **Efficiency:** ART (still relevant, but balanced), Handle Time (if appropriate).
      *   **Compliance/Integrity:** Escalation Accuracy, Repeat Contact Rate (for same issue), Adherence to Process.
      *   **Customer Health:** Track downstream metrics like customer retention/churn for segments handled by different agents/teams.
  3.  **Prioritize Quality & Resolution:** Make FCR and/or CSAT/NPS the *primary* indicators of success in the incentive structure. Speed (ART) should be a secondary or enabling factor *only if* quality benchmarks are met. E.g., Bonus eligibility requires FCR > X% *and* CSAT > Y, *then* ART can contribute to the bonus level.
  4.  **Implement Robust Quality Assurance:** Invest significantly in thorough, frequent, and calibrated ticket reviews focused on *actual resolution* and customer experience, not just speed. Use QA findings to coach, not just punish. QA scores should be a core part of the performance evaluation and bonus calculation.
  5.  **Refine ART Calculation:** Explore ways to make ART harder to game:
      *   **Pause Timers:** Pause ART clock when waiting for customer response beyond a set timeframe.
      *   **Track Reopens:** Tag tickets that are reopened for the same issue within a defined period (e.g., 72 hours) and exclude them (or count them negatively) from ART calculations. Severe penalties for premature closure.
      *   **Weighted ART:** Weight ART based on issue complexity or ticket type.
  6.  **Focus on Customer Outcomes:** Shift the team culture and messaging from "close tickets fast" to "solve customer problems effectively and efficiently." Celebrate stories of complex resolutions and high customer satisfaction.
  7.  **Agent Input:** Involve agents in designing the new metrics and incentives. They understand the pressures and loopholes best and will have valuable insights into what truly reflects good service.

  **One-Sentence Diagnosis:** **You incentivized speed over solution, triggering Goodhart's Law, where agents rationally gamed the metric (ART) to maximize bonuses at the expense of genuine customer resolution.**
