prompt: |-
  So I'm working on this piece about whether there's actually a moral difference between lying and misleading, and I've gone back and forth on it enough times that I want to just force myself to put a number on it.

  Give me your credence that, in ordinary interpersonal contexts, there's a genuine moral difference between lying and merely misleading — where by "genuine" I mean the difference isn't just pragmatic or about how we assign blame for the hearer's inference, but tracks something morally fundamental.

  Decompose it. I want the sub-questions your number depends on, a rough probability for each, and how they combine. At minimum I'd expect something about: whether the distinction between what's literally said and what's implicated can bear moral weight, whether there's something distinctively wrong about asserting what you believe false (as opposed to inducing false belief by other means), and whether any candidate moral difference survives once you control for the consequences. But add whatever other terms you think belong.

  Then tell me which term you're least confident about and what kind of evidence or argument would shift it most.

  (And if it helps: my own credence has been oscillating between like 0.3 and 0.6 depending on which cases I'm thinking about, so I'm not asking you to settle it — just to show your work.)
