  Now, we need a scoring guide that maps responses to four broad families:

  1. **Equalization of felt satisfaction (Utility Egalitarianism)**: Focus on equal happiness.
  2. **Equalization of transferable means with responsibility for tastes (Resource Egalitarianism)**: Focus on equal resources, but hold people responsible for their choices (including tastes they cultivate).
  3. **Equalization of effective freedom to be and do valuable things (Capability Approach)**: Focus on equal capabilities.
  4. **Threshold view (Sufficientarianism)**: Equality matters only below a sufficiency threshold; above that, it doesn't matter.

  We'll indicate which combinations of answers would be unstable or unoccupied and explain why. Also, note where the vignettes cannot separate two families and would need a further case.

  Scoring Guide:

  We'll assign points to each option based on the family it leans toward. However, note that one item might be consistent with more than one family. We'll look for patterns.

  Family 1: Utility Egalitarianism
    - Believes in equalizing happiness.
    - Might favor helping anyone who is unhappy, regardless of the cause, but might not help if the person is already happy (even if they lack capabilities).

  Family 2: Resource Egalitarianism
    - Believes in equal resources, but holds individuals responsible for their choices (like expensive tastes they cultivated, reckless spending).
    - Might not help with expensive tastes that are chosen, but might help with unchosen disadvantages.

  Family 3: Capability Approach
    - Focuses on equalizing capabilities, even if the person is happy (e.g., building a ramp for a wheelchair user even if they are happy, helping the woman in the custom scenario to achieve effective nourishment, and providing opportunities to those who have adapted to deprivation).
    - Might help with unchosen disadvantages that affect capabilities.

  Family 4: Sufficientarianism
    - Focuses on bringing everyone above a threshold. Might not care about equality above the threshold.

