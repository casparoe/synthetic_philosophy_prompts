prompt: |-
  I moderate a big discussion site — philosophy, science and politics, about forty thousand members — and the thing that eats my week is threads where I can't tell if the two people disagree about the world or are just using a word diffrently: is Pluto a planet, is that group a religion or a cult, does the chatbot understand its own answers. I either lock the thread or let it run, and either way someone says I've silenced a real disagreement, and some of the time they're right. It's a few of these a week, I get five minutes each, I'm not a philosopher, and everything I do can be appealed to a two-person panel, so I want a procedure plus a canned line I can post for each outcome.

  I know metaontology has machinery for this. What I've picked up: some questions are asked inside a framework whose rules are already fixed, others are about whether to adopt the framework at all; two people can mean different things by 'exists' or 'object' and neither of them is wrong; and there's a test where you restate both sides in shared vocabulary and see whether anything is left to argue about. I also get that 'verbal' isn't the same as 'trivial' — calling a group a cult does real work — so 'just semantics' can't be where I stop.

  Turn that into the procedure: the questions in order, what counts as an answer to each, where it says verbal-and-done, where it says real disagreement, where it says verbal-but-worth-having, and where it hands off to me because the question is which meaning we should use rather than which one is true. Then run it on two threads — is Pluto a planet, and does the chatbot understand its own answers — and tell me which verdict I'm going to hate. And what can't it do? Most of my threads feel half verbal and half real and I don't know if that's inside the procedure or outside it. If I have to settle first whether any one vocabulary is the right one before I can run any of this, say so.
reasoning: |-
  Okay, the user moderates a large discussion site with 40k members focused on philosophy, science, and politics. Their main challenge is handling threads where it's unclear if participants are having a substantive disagreement or just using words differently—like debates about whether Pluto is a planet or if a chatbot understands its responses. They need a quick, reliable procedure to decide whether to lock threads or let them continue, and they want a canned response for each outcome to handle appeals efficiently.

  The user has some background in metaontology, understanding concepts like framework disputes versus substantive disagreements, the variability of terms like "exists," and the importance of not dismissing "just semantics" as trivial. They want a step-by-step process that categorizes disputes into verbal-only, substantive, or framework-choice disputes, complete with decision points and example applications. They also need to know the limitations of such a procedure, especially when threads seem mixed.

  First, I need to design a procedure that's practical for their time constraints—5 minutes per thread. The procedure should start by identifying the disputed term (e.g., "planet," "understand") and then determine if all parties agree on a framework. If they do, it's a verbal dispute; if not, it might be substantive. The key test is whether disagreements persist after restating claims in neutral vocabulary. 

  For the Pluto example, the framework might be the IAU definition versus a geophysical one. Restating without "planet" could reveal that both sides agree on Pluto's physical traits but disagree on classification criteria—making it a framework-choice dispute. The chatbot example involves "understanding," where restating might show disagreement about cognitive processes versus behavior, leading to a substantive debate on consciousness.

  The user’s deeper needs include reducing moderation workload, avoiding appeals, and maintaining community trust. They might also worry about oversimplifying complex debates or missing nuanced mixes of verbal and substantive elements. The procedure’s limitation is handling hybrid disputes, which requires moderator judgment—something the canned responses can address by signaling careful consideration.

  Finally, the canned responses must be clear and neutral, explaining outcomes without dismissing concerns. For instance, locking a thread as framework-choice would invite a separate discussion on terminology, while allowing substantive debates would emphasize their value. The user’s frustration likely stems from perceived arbitrariness, so transparency in the procedure is crucial for legitimacy.
answer: |-
  Here's a battle-tested moderation procedure based on metaontological principles, designed for speed and clarity, plus canned responses and analysis of your examples:

  **The Dispute Resolution Procedure (5-Minute Version):**

  1.  **Identify the Disputed Term(s):** What key word(s) are people arguing *about*? (e.g., "planet," "understand," "cult," "religion," "exists"). *Write it down.*
  2.  **Check for Framework Agreement:**
      *   **Ask:** "Are both sides using the *same definition* or set of *criteria* for [Disputed Term]? Can they clearly state what those criteria are?"
      *   **Answer YES (Shared Framework):** Go to Step 3.
      *   **Answer NO (Different Frameworks):** Go to Step 4.
      *   **Answer UNCLEAR/MIXED:** Go to Step 4 (treat as different frameworks for now).
  3.  **Verbal Dispute Test (Shared Framework):**
      *   **Task:** Restate the core claims of both sides *without using the disputed term or its direct synonyms*. Use only neutral, descriptive vocabulary (physical properties, behaviors, historical facts, observable consequences).
      *   **Ask:** "After restating, do the claims still contradict each other?"
      *   **Answer NO (No Contradiction):** → **Verbal-Only Dispute.** Lock thread. Use Response A.
      *   **Answer YES (Contradiction Remains):** → **Substantive Dispute.** Allow thread to run (monitor). Use Response B.
  4.  **Framework Choice Test (Different Frameworks):**
      *   **Task:** Get clear statements from the participants (or infer): What *different* definitions/criteria are they using for [Disputed Term]? (e.g., IAU definition vs. geophysical definition for "planet"; behavioral output vs. phenomenal consciousness for "understand").
      *   **Ask:** "Is the disagreement *only* about which definition/framework is better or more useful, *not* about the underlying facts described neutrally in Step 3?"
      *   **Answer YES (Pure Framework Choice):** → **Framework Dispute (Verbal-but-Worth-Having).** Lock thread *but* invite a *new* thread explicitly about choosing definitions/frameworks for [Topic Area]. Use Response C.
      *   **Answer NO (Frameworks Hide Substantive Disagreement):** → **Substantive Dispute.** Allow thread to run (monitor). Use Response B. *(This happens if the choice of framework itself depends on unresolved factual/empirical/theoretical issues).*
      *   **Answer UNCLEAR:** → **Moderator Judgment Required.** Weigh potential harm vs. value. If messy/unproductive, Lock thread & use Response D. If potentially fruitful, allow to run with a warning (Response E).

  **Canned Responses:**

  *   **A. Verbal-Only Dispute (Locked):** "This thread appears to hinge primarily on differing definitions of '[Disputed Term]' where both sides largely agree on the underlying facts when described neutrally. To prevent unproductive circular debate, the thread is locked. If you believe there's a substantive disagreement about facts that wasn't captured, please message the mods with specific details."
  *   **B. Substantive Dispute (Allowed):** "While terminology ('[Disputed Term]') plays a role, the discussion reveals substantive disagreements about [Briefly state core neutral issue, e.g., 'the nature of consciousness', 'planetary formation processes', 'the historical actions of Group X'] that extend beyond mere definitions. The thread remains open, but please focus arguments on evidence and reasoning relevant to these core issues."
  *   **C. Framework Dispute (Locked, Redirected):** "This debate centers on the *choice of definition or conceptual framework* for '[Disputed Term]' itself, rather than a dispute about facts *within* a shared framework. This is a valid but distinct discussion. This thread is locked to prevent definitional loops. You are encouraged to start a **new thread** explicitly titled 'What should define [Disputed Term] in context [X]?' focusing *only* on the merits of different frameworks/definitions."
  *   **D. Moderator Judgment - Locked (Messy Mix/Low Value):** "This thread involves a complex mix of definitional and substantive elements that has become unproductive or overly heated. To preserve discussion quality, it is locked. Participants are encouraged to refine their arguments, clarify definitions upfront, and potentially start a new thread focused on a specific aspect of the disagreement."
  *   **E. Moderator Judgment - Allowed w/Warning (Messy Mix/Potential Value):** "This thread involves both definitional elements ('[Disputed Term]') and potential substantive disagreements. It remains open **with a warning**: Participants **must** explicitly state their working definitions for '[Disputed Term]' and focus arguments on the underlying evidence and reasoning for their positions. Personal attacks or purely definitional circularity will result in thread locking or warnings."

  ---

  **Analysis of Your Examples:**

  1.  **Is Pluto a Planet?**
      *   **Disputed Term:** "Planet"
      *   **Step 2:** **NO Shared Framework.** Clearly different frameworks (IAU criteria vs. Geophysical criteria).
      *   **Step 4:** **Pure Framework Choice?** **YES.** Both sides agree on Pluto's physical characteristics (size, composition, orbit, moons, etc. - the neutral facts). They ONLY disagree on which set of criteria (IAU's dynamical dominance vs. geophysical "roundness") *should be used* to bestow the label "planet". There's no hidden factual disagreement about Pluto itself revealed by restating claims neutrally.
      *   **Verdict:** **Framework Dispute (Verbal-but-Worth-Having)** → Lock thread, Redirect (Response C). **You'll hate this verdict** because it feels like a "real" disagreement to many passionate people, but metaontologically, it's purely about which label is most useful/scientifically appropriate.
  2.  **Does the Chatbot Understand its Own Answers?**
      *   **Disputed Term:** "Understand" (or "consciousness," "meaning," "intentionality").
      *   **Step 2:** **NO Shared Framework.** Radically different frameworks likely (e.g., Functional/Behavioral vs. Phenomenal Consciousness).
      *   **Step 4:** **Pure Framework Choice?** **NO.** While definitions differ, the choice of framework here *directly depends on unresolved substantive disagreements*:
          *   **Substantive Issue 1:** Can understanding/consciousness arise *solely* from complex computation and behavior, or does it require specific biology/physical substrate? (Philosophy of Mind)
          *   **Substantive Issue 2:** What is the nature of meaning/reference in LLMs? Do they have genuine semantic content or just statistical correlations? (Philosophy of Language/Semantics)
          *   **Substantive Issue 3:** What empirical evidence (e.g., specific behaviors, neural correlates - if applicable) is necessary/sufficient for attributing understanding?
      *   **Step 3 Test (Attempted):** Restating neutrically: Side A: "The system produces contextually appropriate, seemingly reasoned responses to complex prompts based on patterns in its training data." Side B: "The system lacks subjective experience, internal representation of meaning distinct from symbol manipulation, and biological grounding associated with understanding." **Contradiction Remains.** Side B is making claims *about the internal nature* that go beyond observable behavior and are contested.
      *   **Verdict:** **Substantive Dispute.** Allow thread to run (Response B). The disagreement runs deep into unresolved philosophical and scientific questions.

  ---

  **Limitations of the Procedure:**

  1.  **The "Half and Half" Problem:** This is the biggest challenge. Many threads *are* messy hybrids. The procedure forces you to isolate the core dispute at Step 4 ("Does the framework choice *hide* a substantive issue?"). If yes, it's substantive (B). If the substantive issues seem settled *or* irrelevant to the framework choice, it's pure framework (C). When genuinely ambiguous, you land on **Moderator Judgment (D or E)**. The canned responses (D & E) are crucial here, acknowledging the complexity.
  2.  **Identifying "Neutral" Vocabulary:** This takes practice. Focus on observable properties, measurable quantities, historical events, agreed-upon functionalities, and consequences. Avoid any term that is itself philosophically loaded in the context (e.g., in the chatbot case, avoid "intelligent," "aware," "meaningful" – stick to "input/output patterns," "training data statistics," "behavioral responses," "correlation vs. causation claims").
  3.  **Time Pressure & Complexity:** Deep philosophical disagreements (like the chatbot) are hard to untangle in 5 minutes. The procedure helps diagnose the *type* of disagreement quickly, but fully resolving the substantive ones is impossible in that time. Your job is categorization and harm reduction, not solving philosophy.
  4.  **"Right" Vocabulary is NOT Required:** This is critical. **You do NOT need to settle which vocabulary is "right" before running the procedure.** The procedure's power is in *bracketing* that question. It asks: *Given their chosen frameworks*, is the dispute verbal? Or, *is their choice of framework itself* driven by deeper disagreements? It explicitly handles the "which meaning should we use?" question as a Framework Dispute (C).
  5.  **Participant Obfuscation:** People may deliberately or unconsciously mask verbal disputes as substantive ones (or vice versa). The restatement test (Step 3) is your best tool to cut through this. Insist on neutral descriptions.
  6.  **High Stakes "Verbal" Disputes:** The procedure acknowledges that "cult" vs. "religion" is a Framework Dispute (C) – the *label* has huge social/political consequences. The procedure doesn't dismiss this; it redirects the discussion to explicitly argue *why* one framework/definition is better suited to the context (e.g., harm prevention, academic accuracy, legal implications).

  **Conclusion:** This procedure provides a structured, philosophically grounded way to diagnose the most common types of definitional clashes in your forum. It maximizes clarity and minimizes moderation time by focusing on the *structure* of the disagreement. It explicitly handles framework choice disputes (C) and provides off-ramps (D, E) for the messy "half and half" cases. Use the canned responses verbatim to ensure consistency and transparency, especially when locking threads, making appeals easier to adjudicate. Remember, your role isn't to decide if Pluto *is* a planet, but to determine *what kind of disagreement* people are having about it.
