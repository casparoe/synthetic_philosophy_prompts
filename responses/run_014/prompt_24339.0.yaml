  However, note that if a theory denies the possibility of any interpersonal cardinal comparisons, then it would reject the social utility function being a weighted sum. Therefore, such a theory would be incompatible with the result.

  **Summary for (c):** The result is incompatible with the denial of interpersonal cardinal comparability because the result produces a cardinally comparable social utility. But the theorem does not assume interpersonal comparability; it derives it from the axioms. Therefore, the theorem shows that under the vNM axioms and the Pareto condition, interpersonal cardinal comparability is implied.

  However, if a theory rejects the vNM axioms or the Pareto condition, then it might avoid interpersonal comparability. But within the framework of the axioms, cardinal comparability is required by the result.
