  ### 1. Statement and Proof of the Result

  **Result:** Under the given axioms, there exist non-negative weights \(\lambda_1, \ldots, \lambda_n\) (not all zero) such that the social utility function \(U\) satisfies \(U(s) = \sum_{i=1}^n \lambda_i u_i(s)\) for every state \(s\), and for any lottery \(p\), the social utility is \(\sum_s p(s) U(s) = \sum_s p(s) \sum_{i=1}^n \lambda_i u_i(s)\).

  **Proof:**  
  Since individual preferences satisfy the vNM axioms, each \(i\) has a utility function \(u_i\) over states, unique up to positive affine transformations (PATs). The social preference also satisfies vNM axioms, so it has a utility function \(U\) over states, unique up to PATs. Consider the space \(\mathbb{R}^m\) where \(m\) is the number of states. Each \(u_i\) and \(U\) are vectors in this space.  

  The Pareto condition implies: If \(\sum_s p(s) u_i(s) \geq \sum_s q(s) u_i(s)\) for all \(i\) with strict inequality for some \(i\), then \(\sum_s p(s) U(s) > \sum_s q(s) U(s)\). Equivalently, if the vector \((\sum_s (p(s) - q(s)) u_i(s))_{i=1}^n \geq 0\) (component-wise) and not zero, then \(\sum_s (p(s) - q(s)) U(s) > 0\).  

  Define the matrix \(A\) with rows corresponding to states and columns to individuals, so column \(i\) is \(u_i\). Let the vector for \(U\) be \(\mathbf{U}\). The condition implies that \(\mathbf{U}\) must be such that for any vector \(\mathbf{d} \in \mathbb{R}^m\) representing a signed measure (i.e., \(\sum_s d(s) = 0\)), if \(A\mathbf{d} \geq 0\) and \(A\mathbf{d} \neq 0\), then \(\mathbf{U}^\top \mathbf{d} > 0\). This means \(\mathbf{U}\) is in the convex cone generated by the columns of \(A\), i.e., there exist non-negative \(\lambda_i\) (not all zero) such that \(\mathbf{U} = \sum_{i=1}^n \lambda_i u_i\). Thus, \(U(s) = \sum_{i=1}^n \lambda_i u_i(s)\) for all \(s\).  

  **Linearity Requirement:** The step requiring linearity is the representation of lottery preferences as expected utilities, enabling the use of linear algebra (e.g., treating \(u_i\) and \(U\) as vectors and applying the separating hyperplane argument). Without vNM linearity (i.e., if preferences only satisfy weak order and Pareto but not independence or continuity), the Pareto condition would not constrain cardinal intensities, so \(U\) need not be a weighted sum. For example, social utility could be non-linear (e.g., \(\min_i u_i(s)\)), violating the result.

  ---

  ### 2. Interpersonal Comparability

  **Comparability Assumption:** The proof assumes that \(U(s)\) is an affine function of individual utilities \(u_i(s)\) at the same state \(s\), specifically \(U(s) = \sum_i \lambda_i u_i(s)\). This requires that utility *differences* across individuals are cardinally comparable.  

  **What is Compared:** The weights \(\lambda_i\) represent the marginal social value of a unit increase in individual \(i\)'s utility. Specifically, \(\lambda_i / \lambda_j\) measures the rate at which the social observer trades off utility gains between \(i\) and \(j\), comparing utility differences interpersonally.  

  **Requirements:**  
  - **Common Cardinal Scale:** Not required. Individual utilities are unique only up to PATs (\(u_i \mapsto a_i u_i + b_i\)), so the \(\lambda_i\) adjust accordingly (e.g., if \(u_i\) is scaled by \(a_i\), \(\lambda_i\) scales by \(1/a_i\) to maintain \(U\)). Thus, no pre-specified common scale is needed; the weights absorb scale differences.  
  - **Comparability of Utility Differences:** Required. The affine form \(U(s) = \sum_i \lambda_i u_i(s)\) implies social utility differences depend on weighted individual utility differences, necessitating comparable units for differences across individuals.

  ---

  ### 3. Identifiability

  **Counterexample:**  
  Consider two states \(s_1, s_2\) and two individuals. Fix a single preference relation for each individual: both strictly prefer \(s_2\) to \(s_1\).  

  - **Representation 1:**  
    \(u_1(s_1) = 0, u_1(s_2) = 1\)  
    \(u_2(s_1) = 0, u_2(s_2) = 1\)  
    Weights: \(\lambda_1 = 1, \lambda_2 = 1\)  
    Social utility: \(U(s_1) = 0, U(s_2) = 2\).  

  - **Representation 2:**  
    \(u_1'(s_1) = 0, u_1'(s_2) = 1\) (same as \(u_1\))  
    \(u_2'(s_1) = 0, u_2'(s_2) = 2\) (rescaled)  
    Weights: \(\lambda_1' = 2, \lambda_2' = 0\)  
    Social utility: \(U'(s_1) = 2 \cdot 0 + 0 \cdot 0 = 0, U'(s_2) = 2 \cdot 1 + 0 \cdot 2 = 2\).  

  Both yield identical \(U(s)\) for all states, and hence identical social preferences over lotteries, but the weights and utility scales differ: \(\lambda_2 = 1\) vs. \(\lambda_2' = 0\).  

  **Implication for Weighting Schemes:** The result does not "derive" unique weights; weights and utility scales are jointly underidentified. Any claim of deriving specific weights must assume additional normalizations (e.g., fixing utility scales), as weights are meaningful only relative to utility representations.

  ---

  ### 4. Equal-Weights Question

  **Impartiality Argument:** An observer behind a veil of ignorance, ignorant of their own identity, assigns equal probability \(1/n\) to being any individual. Maximizing expected utility, they evaluate a state \(s\) as \(\frac{1}{n} \sum_i u_i(s)\), implying weights \(\lambda_i = 1/n\).  

  **Objections:**  
  1. **Expected Utility Assumption:** The argument assumes the observer applies vNM expected utility to identity uncertainty. However, the original vNM axioms govern lotteries over *social states*, not over *identities*. Extending expected utility to identity uncertainty is an additional, unjustified assumption not implied by the axioms.  
  2. **Egalitarian / Prior-Probability Objection:** Assigning equal probability \(1/n\) relies on the principle of insufficient reason, which is arbitrary. If individuals differ in morally relevant traits (e.g., needs), equal weights may be unjust. Egalitarians may favor weights prioritizing the worst-off (e.g., maximin), rejecting equal weights as insufficiently prioritarian. The prior probability is a modeling choice without normative necessity.

  ---

  ### 5. Residue Report

  **(a) Non-Weighted-Sum Theories (e.g., Weighting Inequality or Minimum Welfare):**  
  - **Compatible with:** Nothing; the result requires \(U(s) = \sum_i \lambda_i u_i(s)\).  
  - **Contradicts:** The functional form (e.g., \(U(s) = \sum_i u_i(s) - \theta \cdot \text{Gini}(s)\) or \(U(s) = \min_i u_i(s)\) violates linear aggregation).  
  - **Untouched:** Individual utilities \(u_i(s)\) could incorporate inequality (e.g., if \(u_i\) depends on others' utilities), but the aggregation itself must be linear.  

  **(b) State- or Position-Dependent Weights:**  
  - **Compatible with:** Fixed weights; if weights depend on individual characteristics fixed across states, but not if weights vary with the state or distribution.  
  - **Contradicts:** State independence of weights; e.g., \(\lambda_i(s)\) or \(\lambda_i\) depending on \(i\)'s rank in \(s\) violates \(U(s) = \sum_i \lambda_i u_i(s)\) with constant \(\lambda_i\).  
  - **Untouched:** The result allows weights to differ across individuals (e.g., \(\lambda_i \neq \lambda_j\)) if fixed.  

  **(c) No Cardinal Interpersonal Comparability:**  
  - **Compatible with:** The result itself, which *implies* comparability; but theories denying comparability reject the axioms.  
  - **Contradicts:** The conclusion, as the weighted sum requires cardinal comparability of utility differences.  
  - **Untouched:** The result shows comparability is *derived* from the axioms, not assumed; but a theory rejecting vNM or Pareto may avoid comparability.
