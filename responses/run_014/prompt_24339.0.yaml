  4. **The equal-weights question.**

  **Answer:**

  The result does not fix the weights; it only constrains the form to be a weighted sum. The standard argument for equal weights is the veil-of-ignorance argument: the social observer, not knowing which individual she will be, assigns equal probability to being any individual and then maximizes expected utility. Since the observer uses expected utility, she would evaluate a social state by the average of the utilities of the individuals. Therefore, the weights would be equal.

  **The argument:**
  - Suppose the observer does not know which individual she will be in the society and that she has an equal chance of being any individual. 
  - Then, if she is an expected utility maximizer, she would assign to a social state s the value: (1/n) ∑_{i=1}^n u_i(s).
  - Therefore, the social utility function would be the average of the individual utilities, i.e., weights λ_i = 1/n for all i.

  **Objections:**

  **Objection 1 (expected utility assumption):** The argument assumes that the observer, behind the veil, uses expected utility. However, without the veil, the observer is already assumed to satisfy expected utility over lotteries on social states. But behind the veil, the uncertainty is over which identity she will have. The objection is that the observer's own preferences are defined over lotteries on social states, not over lotteries on identities. The veil-of-ignorance construction introduces a new type of uncertainty (identity uncertainty) and assumes that the observer evaluates this uncertainty by expected utility. But the original vNM axioms only apply to lotteries over social states, not to lotteries over identities. Therefore, extending the expected utility framework to identity uncertainty is an additional assumption that is not implied by the original axioms.

  **Objection 2 (egalitarian):** The equal probability assignment (each individual with probability 1/n) is arbitrary. Why should the observer assign equal probability? If there is no reason to favor one individual over another, the principle of insufficient reason might suggest equal probabilities. But this principle has been criticized as arbitrary. In particular, if the observer has no information, why should she assume a uniform distribution? Moreover, the individuals may differ in characteristics that the observer cares about (such as their needs). A substantive egalitarian might argue that the weights should be chosen to prioritize the worst-off, leading to a maximin or leximin criterion, not the average. Hence, the veil-of-ignorance argument with equal weights does not necessarily lead to the preferred egalitarian outcome.

  **Objection 3 (prior-probability objection):** The assignment of equal probabilities assumes that the observer is symmetric with respect to the individuals. But if the individuals are not symmetric (e.g., if they have different capacities for enjoyment), then equal weights might not be appropriate. Moreover, the prior probability distribution over identities is not based on any empirical evidence and is merely a device. Therefore, the argument from the veil of ignorance does not provide a foundation for equal weights but rather assumes a particular prior.

