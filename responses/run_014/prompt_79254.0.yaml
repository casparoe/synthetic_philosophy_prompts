prompt: |-
  I'm a second-year PhD student in a philosophy of mind reading group, and we've spent three weeks on the family of views that try to earn mental content from biology rather than from the head — the teleosemantic tradition associated with Dretske and Millikan, on which a state counts as being about something because it is the biological function of that state, or of the mechanism that produces it, to indicate that thing, where "biological function" is cashed out in terms of what the state and its mechanism were selected for. As I understand the view, error is supposed to be possible on this picture because a state can be tokened in conditions other than the conditions that figure in the normal explanation of why it is produced — the conditions under which it was selected to indicate what it indicates — and that is what it is for the state to be false. I came in sympathetic to all of this. Then a friend in the group, who reads far more carefully than I do, put the following on the whiteboard and said it shows the project quietly eats itself, and that the only way its defenders escape is by letting "normal conditions" mean whatever they need it to mean. I wrote it down more or less as he had it:

  (1) A state represents a condition X just in case it is the biological function of that state, or of the mechanism that produces it, to indicate X; and what fixes a state's biological function is the history of selection that explains why the state, and the mechanism that produces it, are there at all.
  (2) The view can allow for error, and this is its main selling point: a state can be tokened when the conditions that figure in the normal explanation of its production — the conditions under which it was selected to indicate X — fail to obtain, and that is what it is for the state to be false.
  (3) Consider a beetle whose chief predator is a hunting wasp. The beetle has a detector, D, that fires when a wasp's wingbeat pattern reaches its antennae, and firing triggers a dive into the leaf litter that usually saves the beetle's life. D exists because it did this.
  (4) But D also fires for the wingbeats of other beetles, and for raindrops striking the antennae. Every population in the lineage has been like this; there never was an ancestral population whose D fired only for wasps.
  (5) Selection can favour a state only for what that state in fact did. Across the lineage, D's firings were followed by a successful dive on wasp occasions, by a harmless but wasted dive on beetle occasions, and by the same on raindrop occasions. Firing was never worse for the beetle than not firing.
  (6) So all three sorts of occasion are among the conditions in which D was selected to fire: the normal conditions of D's firing include other beetles and raindrops.
  (7) So the function of D is to indicate the disjunction wasp-or-beetle-or-rain, and by (1) that disjunction is what D represents.
  (8) But then D cannot be wrong: whenever it fires, the disjunction obtains. And the same reasoning applies to any detector, however crude, in any organism whatsoever.
  (9) So teleosemantics cannot explain error after all, contrary to (2); it must give up either (1) or (2), and either way the project fails.

  I can't find the step I'd want to deny, and I don't want to rescue the view by fiat, since my friend's complaint is precisely that its defenders do exactly that. The two things I'd most like to keep are the core claim in (1) and the promise of a real account of error in (2); if one of those has to go, I want to know which and what it costs. Please audit the argument step by step and tell me where the trouble is — or, if there is no single bad step, which premise a teleosemanticist should pay to give up — and be explicit about the difference between a repair that is independently motivated and one that is mere stipulation in defence of a favoured conclusion.

  Give me your answer as a single JSON object and nothing else, with exactly these fields. "step_audit": an array with one entry per numbered step, each an object with "step" (the number as a string), "verdict" (one of "sound", "needs repair", "suspect", "false"), and "comment" (one or two sentences on what the step is doing and whether it does it). "primary_error": an object with "step" (the number of the step you would fix first), "label" (a short name for the mistake, e.g. the name of the equivocation or invalid inference pattern involved), and "explanation" (a paragraph saying exactly what goes wrong, and why naming it is not itself a stipulation). "why_it_looked_fine": a short paragraph on why that step seemed to follow from the ones before it. "repair_options": an array of two to four objects, each with "repair" (what a teleosemanticist would have to say or change), "what_you_keep" (which of the argument's earlier claims survives intact), "cost" (what the repair gives up, or what new obligation it incurs), and "who_would_accept_it" (the sort of theorist who would press this line). "conclusion_survives": an object with "status" (one of "argument fails", "argument succeeds", "argument succeeds in a weakened form") and "note" (a sentence or two on what is left of my friend's claim). "residual_objection": a short paragraph stating the strongest version of his complaint that survives your repair, so I know what I am still on the hook for. Output valid JSON only, with no markdown fence and no text outside the object, and keep each prose field to a tight paragraph at most.
reasoning: |-
  We are auditing an argument that aims to show that teleosemantics cannot account for error. The argument is structured in 9 steps. We must evaluate each step and then provide an overall analysis.

   Step-by-step audit:

   Step 1: This step states the core of teleosemantics: representation is fixed by biological function, which in turn is fixed by selection history. This is a standard statement of the view and is sound as a premise.

   Step 2: This step states that teleosemantics allows for error: a state can be tokened when the conditions it was selected to indicate do not hold, and that is error. This is also a standard claim and is sound.

   Step 3: This describes a thought experiment: a beetle with a detector D that fires in response to wasp wingbeats (which is adaptive) but also to other things (beetle wingbeats, raindrops). The existence of D is explained by its role in saving the beetle from wasps. This step is sound as a setup.

   Step 4: It is claimed that D also fires for non-wasp stimuli and that this has always been the case. There was never a population where D fired only for wasps. This is an important empirical claim about the history. We must take it as given for the argument. Sound.

   Step 5: The argument claims that selection can only favor a state for what it in fact did. In this case, D fired in three kinds of occasions: wasp (good), beetle (wasted dive but harmless), and raindrop (same). Importantly, firing was never worse than not firing. Hence, selection favored D for all these occasions. This step is suspect because it assumes that because the firing in non-wasp cases did not have negative consequences, they are part of what the mechanism was selected for. But teleosemantics typically distinguishes between the conditions that explain the selection and the conditions in which the mechanism is triggered. The function is fixed by what the mechanism was selected to do, which is to detect wasps, even if in practice it fires to other things. However, the step is presented as a consequence of the selection history. The problem is that in teleosemantics, the function is determined by the conditions that were responsible for the selection. In this case, the selection was for detecting wasps because that is what led to survival and reproduction. The other triggers did not contribute to the selection (they were neutral or even slightly costly but not enough to be selected against). Therefore, it is suspect to say that selection favored the state for all three.

   Step 6: Therefore, it is concluded that all three are normal conditions. This follows from step 5, but if step 5 is suspect, then step 6 is also suspect.

   Step 7: Thus, the function of D is to indicate the disjunction, and that is what it represents. This is the conclusion drawn from steps 1 and 6. But if step 6 is wrong, then step 7 is false.

   Step 8: Then D cannot be wrong because whenever it fires, one of the disjuncts is true. And this generalizes. If step 7 were true, then step 8 would follow. But we suspect step 7.

   Step 9: Therefore, teleosemantics cannot explain error, so it must give up (1) or (2). This is the conclusion of the argument.

   However, the primary error is in step 5. The mistake is in assuming that because the mechanism fired in non-wasp conditions and that did not prevent selection, then these conditions are part of the function. But teleosemantics (as per Millikan) holds that the function is determined by the conditions that were responsible for the selection. The non-wasp conditions did not contribute to the selection of the mechanism. The mechanism was selected because it saved the beetle from wasps. The other firings were not selected for; they were merely tolerated. Hence, the function is to indicate wasps, and when it fires for beetles or raindrops, that is an error.

   Why did step 5 look fine? Because the argument assumes that if a trait is present and the trait has multiple effects, and if none of the effects are harmful, then all the effects are part of what the trait was selected for. But in evolutionary theory, selection is for the effects that explain the persistence and spread of the trait. The non-wasp firings did not explain why the detector was selected; they were side effects.

   Repair options:

   Option 1: Refine the concept of biological function to require that the function is the specific effect that was causally responsible for the selection. This is the standard move by teleosemanticists. We keep (1) and (2) by denying that the non-wasp occasions are part of the function. We keep the core of teleosemantics and the account of error. The cost is that we must provide a principled way to distinguish the effects that are selected for from those that are merely side effects. This is a standard move in philosophy of biology (e.g., Millikan's proper functions). Who would accept it: Millikan, Dretske, and most teleosemanticists.

   Option 2: Broaden the account of error by allowing that the function can be disjunctive but then explain error in terms of a failure to fulfill the ultimate biological purpose (e.g., survival). However, this might require giving up the direct link to indication and instead focus on the ultimate function. But that would be a departure from standard teleosemantics. We might keep (1) but modify (2). Cost: it becomes harder to account for the specific content (e.g., representing wasps). Who: perhaps a more pragmatic teleosemanticist.

   Option 3: Deny that the case is possible. If there was never a population with a more specific detector, then the mechanism might not have the function of detecting wasps only. But in the example, the mechanism was selected because it saved the beetle from wasps. Even if it always fired to other things, the selection was still for wasp detection. So this repair is less attractive.

   We'll go with the first repair as the most standard.

   Conclusion: The argument fails because step 5 misapplies the concept of selection. The residual objection is that it may be difficult to provide a non-stipulative criterion for distinguishing the effects that are selected for from those that are not, especially in cases of overgeneralization that are not selected against.

