        "who_would_accept_it": e.g., "Millikan-style teleosemanticists"

   conclusion_survives: object with
        "status": one of "argument fails", etc.
        "note": a sentence or two.

   residual_objection: a short paragraph.

   Let's fill in the step_audit:

   Step 1: verdict "sound", comment: "This is a standard statement of teleosemantics and is accepted as a premise."

   Step 2: verdict "sound", comment: "This is a key selling point of the view and is a standard interpretation."

   Step 3: verdict "sound", comment: "The beetle example is a plausible thought experiment."

   Step 4: verdict "sound", comment: "The historical claim is taken as given for the sake of argument."

   Step 5: verdict "suspect", comment: "It incorrectly assumes that any condition in which the state was triggered and did not prevent selection is part of the function. But the function is fixed by what the state was selected for, not by all the conditions in which it occurred."

   Step 6: verdict "suspect", comment: "This follows from step 5, but since step 5 is suspect, this step is also suspect."

   Step 7: verdict "false", comment: "This conclusion depends on step 6 and the core definition in step 1, but step 6 is flawed, so the conclusion does not hold."

   Step 8: verdict "false", comment: "This is based on step 7, which is false, so it does not follow."

   Step 9: verdict "false", comment: "The conclusion that teleosemantics must give up (1) or (2) is not established because the argument from step 5 onward fails."

   primary_error:
     step: "5"
     label: "Failure to Distinguish Selected Effects from Mere Side Effects"
     explanation: "Step 5 incorrectly infers that because the detector fired in non-wasp conditions and these firings did not prevent selection, they are part of the conditions for which the state was selected. But in teleosemantics, the function is determined solely by the effects that were causally responsible for the trait's selection. The non-wasp firings did not contribute to the detector's selection; they were mere side effects. Naming this mistake is not stipulation because it is a standard point in evolutionary biology: selection is for specific effects, not for every effect that occurs without being detrimental."

   why_it_looked_fine: "The step seemed plausible because if a trait is triggered in multiple conditions and none of them are harmful, then it might seem that the trait is selected for all of them. However, this ignores the fact that selection requires a positive causal contribution to fitness, which only the wasp cases provided."

   repair_options:
     Option 1:
        repair: "Insist that the biological function is the specific effect that was causally responsible for the selection, even if the mechanism also fires in other conditions that do not explain its selection."
        what_you_keep: "Both (1) and (2): the core teleosemantic account and the possibility of error."
        cost: "Must provide a principled account of how to individuate the selected effect, which may require appealing to historical causal chains and counterfactuals about what would have happened in the absence of the effect."
        who_would_accept_it: "Mainstream teleosemanticists like Millikan and Dretske."

     Option 2:
        repair: "Modify the account of function to include only those conditions that were statistically predominant in the selection history, or that provided the primary fitness benefit."
        what_you_keep: "The core idea of (1) and the possibility of error in (2), but with a more nuanced account of function."
        cost: "Requires specifying how to weigh different conditions in the selection history, which may introduce vagueness or context-dependence into content determination."
        who_would_accept_it: "Teleosemanticists who are more pragmatic about function attribution."

     Option 3:
        repair: "Deny that the case described in step 4 is possible: if the detector always fired to non-wasps, then it might not have been selected for wasp detection alone. But this is implausible because even if it fires to non-wasps, the wasp detection is what provided the fitness benefit."
        what_you_keep: "The original account of function and error without modification."
        cost: "Must argue that the detector was indeed selected for wasp detection, which might require showing that in the actual history, the wasp cases were the only ones that mattered. But the example stipulates that non-wasp cases were common and not harmful, so this repair is weak."
        who_would_accept_it: "Hard-line teleosemanticists who are willing to challenge the empirical setup."

   We'll list two or three.

   conclusion_survives:
     status: "argument fails"
     note: "The argument does not force a rejection of teleosemantics because the key step (5) misapplies the concept of biological function."

   residual_objection: "Even after repair, a residual objection remains: in cases where a detector is overgeneral but the overgeneralization was not selected against (because it was neutral or even slightly beneficial in some cases), it may be difficult to non-arbitrarily specify the exact content (wasp vs. the disjunction) without invoking stipulative criteria. This challenges the ability of teleosemantics to deliver a determinate account of content."

   Now, we write the JSON.
