prompt: |-
  I would like a name for a pattern I keep meeting in arguments, or, failing a name, a careful account of what the pattern is and whether the argument at its centre is sound.

  The pattern concerns acts of a certain shape: worth doing if a few people do them, harmful if many do. Suppose several people are each in a position to do such an act. None can observe what the others choose; all have the same information; each knows this about the others. The argument I keep encountering runs roughly as follows: if it were right for me to do this, it would be equally right for everyone else here to do it; if everyone did it, the result would be bad; therefore it is not right for me to do it. Two settings in which I have watched this happen:

  - A group of seminar participants, every one of whom wants the visiting speaker to slow down and explain a step, and not one of whom asks, each reasoning that if the request were in order for them it would be in order for the other twenty, and that twenty interruptions would destroy the session. Nobody asks, and nobody follows the argument.
  - Members of a committee, several of whom think a decision should be reopened. Each declines to raise it, on the ground that if the grounds for reopening were good they would be good for every member, and that a committee which reopens its decisions whenever any member objects never finishes its business. The decision stands.

  What strikes me is that this is not a case of overlooking the aggregate; the agents are reasoning from it. Nor is anyone hoping to be spared an effort: each would act if they were the only person in the position. Yet the upshot is that the situation in which the act ought to be done by a few is precisely the situation in which it is done by nobody, and no one can make themselves the exception without either exempting themselves from a test they apply to others or breaking a symmetry nobody is entitled to break. There seems to be no individual mistake anywhere in the structure: each agent's conclusion is defensible given the others' conclusions, and theirs given his.

  Does this have an established name? The nearest things I know are the bystander effect, the free-rider problem, and what is sometimes called the unilateralist's curse, but none of them seems to be the same thing. The first two concern a good that somebody must supply, and the agent's expectation that somebody else will supply it; here nobody expects to be spared, and what is at issue is a level of activity rather than a shared good. The unilateralist's curse runs in the opposite direction: it concerns many agents acting on private and noisy estimates of whether an act is worth doing, and it predicts too much action rather than too little.

  I am also unsure how far the central argument is valid, since it appears to treat a permission as though it had to hold universally, in a case whose whole point is that the permission is exercised by a few. If there is an established term, please say what exactly it names — the type of situation, the move in argument, or the outcome — and how it differs from the concepts above. If there is none, please coin one, define it, and mark its edges: whether it covers cases in which the harm comes from a sum of tiny contributions rather than from a threshold; whether it survives if the participants can take turns or draw lots; and whether the same structure appears wherever a permission must be stated in general terms rather than case by case.
reasoning: |-
  Okay, the user is describing a recurring pattern in group decision-making where an action is beneficial if only a few people do it but harmful if everyone does. They want to know if there's a name for this pattern or, if not, a detailed analysis of it. The examples given are seminar participants not asking a speaker to slow down and committee members not reopening a decision.

  First, I need to recall if there's an existing term for this. The user mentioned the bystander effect, free-rider problem, and unilateralist's curse. But none fit perfectly. The bystander effect involves diffusion of responsibility where people assume someone else will act. Here, each person is willing to act if alone but refrains because they think everyone else might act too. The free-rider problem is about benefiting without contributing, which isn't the case here. Unilateralist's curse is about too many acting based on private info, leading to over-action, opposite to this under-action scenario.

  So maybe there isn't a widely recognized term. The user's description points to a coordination problem where individuals symmetrically reason that if it's permissible for them, it must be for all, leading to inaction. This feels similar to Kant's universalizability principle but applied in a way that causes paralysis.

  The key elements are: symmetric positions, universalizability reasoning, threshold harm, and resulting under-provision. The argument each person uses is that if everyone does it, it's bad, so no one should. But this ignores that only a few need to act. The flaw is treating permissibility as requiring universal action when it doesn't.

  Possible names: Threshold Paralysis, Symmetry Trap, or Coordination Dilemma. Need something catchy. "Paradox of Collective Permission" emphasizes the conflict between individual and collective rationality. "Threshold Paralysis" highlights the inaction due to fearing crossing a threshold.

  Also, the user asks about variations: whether harm comes from sum or threshold, if taking turns or lots helps, and if the structure appears when permissions are generalized. In the examples, harm is from too many acting (threshold). If harm is from cumulative effects (like pollution), it might be similar but involves different solutions like quotas. Drawing lots could break the symmetry by assigning responsibility, thus solving the problem. Generalized permissions force agents into this universal reasoning, whereas case-by-case might avoid it.

  The argument's flaw is in the universalizability step. Permissibility doesn't require that everyone acts, just that some do. Each agent mistakenly infers that if it's permissible for one, it must be for all, leading to the false conclusion that none should act. This is a deontic logic error, confusing permissibility with obligation or misapplying universalizability.

  So the term "Paradox of Collective Permission" seems fitting. It captures the collective aspect and the permission reasoning. Defining it with the structure: symmetric agents, beneficial if few act, harmful if many, universalizability reasoning leading to inaction. Distinguishing it from other concepts by the lack of expectation others will act, willingness to act if alone, and the symmetry.

  Also, addressing the user's deeper needs: they want clarity on whether the argument is valid and how to resolve such situations. Explaining the reasoning flaw and suggesting mechanisms like coordination or randomization would be helpful. They might be looking for academic references or practical solutions, so mentioning Kant and game theory (assurance game) adds depth.
answer: |-
  This pattern is indeed distinct from the bystander effect, free-rider problem, and unilateralist's curse. It represents a fascinating and specific dilemma arising from **symmetry, universalizability reasoning, and threshold effects.** While it lacks a single, universally established name in the literature, the most precise descriptor is the **Paradox of Collective Permission (PCP)**. Let's define it, analyze its soundness, and mark its edges.

  ### The Paradox of Collective Permission (PCP) - Defined
  1.  **Situation:** A group of *n* symmetric agents faces a choice.
  2.  **Action (A):** An action that, if performed by *a small number (k, where 1 ≤ k << n)* of agents, is beneficial (or permissible/good).
  3.  **Threshold Harm:** If performed by *many agents (m, where k < m ≤ n)*, the same action A becomes harmful (or impermissible/bad) due to the *aggregate effect* (often crossing a threshold).
  4.  **Symmetry & Information:** Agents are symmetric (identical position, information, reasoning capacity). They act independently and simultaneously (or without reliable coordination). Each knows the situation and this symmetry.
  5.  **The Reasoning Pattern (The Paradoxical Move):**
      *   Agent X reasons: "For me to permissibly do A, it must be permissible *in principle* for any agent in my position to do A (Universalizability Step)."
      *   "If it were permissible for *everyone* to do A, then everyone *would* do A (due to symmetry/expected benefit)."
      *   "But if *everyone* did A, the outcome would be harmful (Threshold Harm)."
      *   "Therefore, it *cannot* be permissible for everyone to do A."
      *   "Therefore, it *cannot* be permissible for *me* to do A." (Inference: If universal permission leads to harm, then no one has permission).
      *   **Outcome:** All agents reason identically. No one performs A. The beneficial outcome (achieved by k agents doing A) is not realized.

  6.  **Core Tension:** The situation *requires* that only *some* (k) agents do A for the good outcome, yet the symmetry and universalizability reasoning lead each agent to conclude that *no one* can permissibly do A. The permissibility of A *for a few* seems logically incompatible with the reasoning each agent employs.

  ### Why the Established Terms Don't Fit Perfectly
  *   **Bystander Effect:** Involves *diffusion of responsibility* and *pluralistic ignorance*. Agents expect *someone else* will/should act (free-riding *on expectation*). In PCP, agents *are* willing to act if alone (*no* diffusion of responsibility) and know others share their reasoning (no ignorance). The block comes from the *fear of universal action*, not the hope someone else acts.
  *   **Free-Rider Problem:** Involves *consuming a public good without contributing to its provision*. Agents *prefer* others provide the good so they can benefit without cost. In PCP, the "good" (the beneficial state achieved by k agents doing A) is not a standard public good; agents *would* contribute if they were the only one or one of the few, but refrain specifically to *avoid* the harm of *everyone* contributing. It's a problem of *over-provision avoidance* leading to *under-provision*, not provision avoidance for personal gain.
  *   **Unilateralist's Curse:** Involves multiple agents with *private, noisy signals* about the value of an action, leading to *over-action* because agents act if their *private* estimate is positive, even if the *group* estimate would be negative. PCP involves *common knowledge*, *symmetric reasoning*, and leads to *under-action*.

  ### Soundness of the Central Argument
  The central argument (Universal Permission → Universal Action → Harm → Therefore, No Permission) is **logically valid but unsound** in the PCP context. The flaw lies in the **first premise (the Universalizability Step)**:

  1.  **Mistaken Premise:** The step "If it is permissible for me to do A, then it must be permissible for everyone (in this symmetric situation) to do A" is **false** in threshold-harm scenarios. Permissibility *does not* require universalizability in this strong sense when the *number* of agents performing the action determines its permissibility.
  2.  **Correct Permissibility:** The correct permissibility rule is: "It is permissible for *some specific subset S (|S| = k)* of the agents to do A." The permission is inherently *collective and limited*, not individual and universalizable.
  3.  **The Symmetry Trap:** The flaw arises because agents try to apply an *individual-level ethical principle* (universalizability) to a situation where permissibility is fundamentally *defined at the collective level* ("k agents should act"). Their symmetric position traps them; no individual can justify being part of the special k without violating symmetry or appearing arbitrary, *unless* an external coordination mechanism exists.
  4.  **Validity vs. Soundness:** The deduction *from* the premises is valid: *If* permissibility requires universal permission, and universal permission leads to harm, then permission cannot exist. However, the *key premise* (that permissibility *must* be universalizable) is incorrect for this scenario, making the overall argument unsound. Agents are reasoning correctly *from a false premise*.

  ### Marking the Edges: Scope and Variations
  1.  **Sum vs. Threshold Harm:** PCP applies primarily to **threshold harm** scenarios (e.g., 1-2 interruptions are fine, 20 are disastrous). It *can* also apply to **cumulative harm** scenarios (e.g., each drop of pollution adds harm), *if* the agents reason using the same universalizability step ("If it's okay for me to pollute a little, it must be okay for everyone... but if everyone pollutes a little, it's disastrous"). The core flawed reasoning pattern is identical.
  2.  **Taking Turns / Drawing Lots:** PCP **collapses** if coordination is possible.
      *   **Lots:** If agents can fairly draw lots to designate *who* should be in the "k" group, the symmetry is broken legitimately. The designated agents can permissibly act, knowing others won't (or shouldn't).
      *   **Turns:** A pre-agreed rotation system similarly breaks the symmetry and assigns permission conditionally ("It's your turn to ask the question this week").
      *   **Mechanism Design:** Any reliable coordination mechanism (a leader assigning roles, a queue system, a voting threshold for reopening) resolves the paradox by externally defining *who* or *when* it is permissible to act.
  3.  **General Permissions vs. Case-by-Case:** The core structure **relies heavily on the need for general permissions**. Agents feel compelled to justify their action via a *general rule* applicable to all symmetric agents. If permissions could be assigned case-by-case based on arbitrary but accepted identifiers (e.g., "The person sitting in chair 3 asks," "The member with the earliest birthday speaks"), the paradox vanishes, as the rule isn't universalizable in the problematic way. The tension arises precisely because agents seek a *general justification* for their individual action within a symmetric group facing a collective threshold.

  ### Conclusion
  The **Paradox of Collective Permission (PCP)** describes a situation where symmetric agents, facing an action beneficial if done by a few but harmful if done by many, each refrains from acting because their reasoning (based on a flawed application of universalizability) leads them to conclude their action cannot be permissible. While the deductive logic of each agent's internal argument is valid, it rests on the unsound premise that individual permissibility necessitates universal permissibility in this context. The permission is inherently collective ("k should act"), not individual and universalizable.

  The paradox highlights the limitations of individual ethical reasoning in collective action problems with thresholds and perfect symmetry. It only persists in the absence of coordination mechanisms (like lots, turns, or designated roles) or case-by-case permission assignment, which legitimately break the symmetry. Recognizing PCP helps diagnose why beneficial limited actions sometimes fail to occur even when agents are willing and aware, pointing towards solutions involving coordination rather than just moral exhortation.
