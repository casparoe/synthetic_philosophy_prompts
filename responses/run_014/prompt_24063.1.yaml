answer: |-
  Below is a decision tree designed to guide students from recognizing the discursive dilemma to adopting a named position. The tree uses the axioms of the List-Pettit theorem (Universal Domain, Collective Rationality, Unanimity, Systematicity) as branch nodes. Each node is phrased as a question a student can answer without prior knowledge of the labels, and leaves represent positions with their "most awkward commitment" to highlight trade-offs. Positions are based on actual defenses in the literature (e.g., Pettit, List, Dryzek, Dietrich).

  ### **Decision Tree**
  **Root:** You accept that proposition-wise majority voting can produce inconsistent collective judgments (e.g., in the doctrinal paradox). How should we respond?

  1. **Should collective judgments be formed by aggregating individual judgments?**  
     - **No** → **Leaf: Non-aggregative (Deliberative) Approaches**  
       *Most awkward commitment:* Requires rejecting formal aggregation entirely, risking unstructured deliberation vulnerable to power imbalances or polarization.  
     - **Yes** → Go to 2.

  2. **Must the aggregation function accept *any* profile of consistent individual judgments? (Universal Domain)**  
     - **No** → **Leaf: Domain Restriction**  
       *Most awkward commitment:* Excludes logically possible (but minority) viewpoints, potentially silencing dissent or novel arguments.  
     - **Yes** → Go to 3.

  3. **Must the collective judgment set be logically *consistent*? (Collective Rationality)**  
     - **No** → **Leaf: Accept Inconsistency**  
       *Most awkward commitment:* Forces collective action on contradictory judgments (e.g., enforcing "A" and "¬A" simultaneously).  
     - **Yes** → Go to 4.

  4. **Must the collective judgment set be *complete* (take a position on every issue)? (Collective Rationality)**  
     - **No** → **Leaf: Conclusion-Based Procedure**  
       *Most awkward commitment:* Ignores premises/reasons, making decisions arbitrary or unaccountable (e.g., no collective view on why a policy passed).  
     - **Yes** → Go to 5.

  5. **Must the collective judgment on each proposition depend *only* on individual judgments on *that* proposition? (Systematicity/Independence)**  
     - **No** → Go to 5a.  
     - **Yes** → Go to 6.

       **5a. Should some propositions (e.g., premises) have lexical priority over others?**  
       - **Yes** → **Leaf: Premise-Based Procedure**  
         *Most awkward commitment:* May yield conclusions opposed by a majority (e.g., 60% support premises but 60% reject the conclusion).  
       - **No** → **Leaf: Holistic/Distance-Based Aggregation**  
         *Most awkward commitment:* Computationally intractable for complex agendas; risks strategic agenda-setting.

  6. **Must the *same* aggregation rule (e.g., majority) apply to every proposition? (Systematicity/Uniformity)**  
     - **No** → **Leaf: Non-Uniform Aggregation (e.g., Quota Rules)**  
       *Most awkward commitment:* Demands a meta-justification for why different propositions deserve different rules (e.g., higher thresholds for "conclusions").  
     - **Yes** → Go to 7.

  7. **Must unanimously accepted propositions be collectively accepted? (Unanimity)**  
     - **No** → **Leaf: Abandon Unanimity**  
       *Most awkward commitment:* Allows collective rejection of propositions *everyone* endorses (e.g., all citizens support "clean water" but it fails).  
     - **Yes** → **Leaf: Dictatorship (or Oligarchy)**  
       *Most awkward commitment:* Sacrifices democracy—collective judgments mirror a single voter’s views.

  ---

  ### **Notes on the Tree**
  - **Flagged Overlaps:** The tree cannot perfectly separate:  
    - *Premise-Based* vs. *Holistic Aggregation:* Both reject independence (5), but prioritize premises vs. global coherence.  
    - *Conclusion-Based* vs. *Accept Incompleteness:* Conclusion-based is a subset of incompleteness positions; the leaf specifies the common "reasons-free" approach.  
    - *Non-Uniform Aggregation* vs. *Premise-Based:* Premise-based implies non-uniformity (premises ≠ conclusions), but the tree isolates it under independence-rejection (5a).  
  - **Axioms Covered:** Universal Domain (Q2), Collective Rationality (Q3–4), Systematicity (Q5–6), Unanimity (Q7).  
  - **Pedagogical Aim:** Students arrive at a position by their commitments, not labels. The "awkward commitment" highlights costs to spur debate.  
  - **Key Omissions:**  
    - "Mixed" approaches (e.g., sequential voting) are folded into *Premise-Based* or *Non-Uniform Aggregation*.  
    - "Accept Incompleteness" beyond conclusion-based is omitted for focus; *Conclusion-Based* represents it.  

  Use this tree to help students self-identify positions and confront trade-offs. For further reading, assign: List & Pettit (2002) for the theorem; Pettit (2001) for premise-based; Dryzek (2009) for deliberative approaches; Dietrich (2007) for distance-based rules.
