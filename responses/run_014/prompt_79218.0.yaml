answer: |-
  ### Brainstorm  
  **End-words:**  
  1. **Ink** (both wrote notes; one stained fingers, the other marked ledgers)  
  2. **Page** (private scrap vs. journal folio; both surfaces for thought)  
  3. **Date** (calendar day; inscribed proof of first arrival)  
  4. **Press** (verb: to urge forward; noun: printing mechanism)  
  5. **Hand** (shaky script; confident signature; also *hand* as labor)  
  6. **Seal** (wax closure for secrecy; institutional stamp for validation)  

  **Stanzas 1-3 (Uncredited):** Focus on process obscured—drafts, doubt, tools. *Ink* is effort; *page* is fragment; *date* is private tally; *press* is urgency; *hand* is fatigue; *seal* is hidden.  
  **Stanzas 4-6 (Credited):** Focus on system—publication, validation, legacy. *Ink* is authority; *page* is record; *date* is proof; *press* is typeset; *hand* is ownership; *seal* is academy.  

  **Envoi’s Refusal:** Resists concluding priority was inevitable or deserved. Leaves *how* they merged ambiguous.  

  ---

  ### Twin Formulae  

  *(Stanzas 1-3: Uncredited Voice)*  
  I watched the thought condense like **ink**  
  on scraps that never made a **page**.  
  No witness but the moon; my **date**  
  uncertified. I felt the **press**  
  of night, the ache inside each **hand**,  
  the thought I’d lose it. Broke the **seal**  

  on a flask of acid. Broke the **seal**  
  of silence? No. Just spilt more **ink**  
  on proofs that smudged beneath my **hand**.  
  A moth ate through the crucial **page**.  
  No matter—still I felt the **press**  
  to mark the moment, fix the **date**.  

  The almanac confirmed the **date**.  
  I scratched it under wax’s **seal**,  
  a frail defence against the **press**  
  of rivals. Still the drying **ink**  
  felt like a wound. Each borrowed **page**  
  bore only labour. Not my **hand**  

  but Time’s, that shook my tired **hand**  
  as dawn confirmed the futile **date**.  
  I’d built no monument, no **page**  
  enduring. Only this cracked **seal**  
  held fast. Outside, the world’s dark **ink**  
  still hid the pattern. Still the **press**  

  *(Stanzas 4-6: Credited Voice)*  
  —of others working? Yes, the **press**  
  of competition steadied my **hand**.  
  I wrote with clean, decisive **ink**  
  on foolscap. Noted down the **date**  
  the insight crystallised. The **seal**?  
  The Society’s stamp graced my **page**.  

  It needed clarity, that **page**:  
  typeset, reviewed, released to **press**  
  before a rival’s claim. The **seal**  
  of priority—a steady **hand**  
  must register the vital **date**  
  before the gossip spreads like **ink**.  

  They’ll say my steady flow of **ink**  
  outpaced the rumour. But the **page**  
  that carries weight bears not just **date**  
  but provenance. I met the **press**  
  with prompt dispatch. My firm **hand**  
  secured the honour. Broke no **seal**  

  *(Envoi: Historian’s Voice)*  
  but broke no **seal**? Two weights of **ink**,  
  two claims. One **hand** set loose the **page**  
  that caught the **press**. One kept its **date** beneath the wax. Which **date** holds true?  

  ---

  ### Note on Structure & Voices  
  **End-word permutation (retrogradatio cruciata):**  
  Stanza 1: ink, page, date, press, hand, seal  
  Stanza 2: seal, ink, hand, press, date, page  
  Stanza 3: page, seal, date, press, ink, hand  
  Stanza 4: hand, page, press, date, seal, ink  
  Stanza 5: ink, hand, seal, press, page, date  
  Stanza 6: date, ink, page, press, hand, seal  
  Envoi: seal, ink / hand, page / press, date  

  **Voices:**  
  - **Stanzas 1–3 (Uncredited):** Focus on isolation, material struggle (*ink* as stain, *page* as scrap, *seal* for hiding). Words denote effort against oblivion.  
  - **Stanzas 4–6 (Credited):** Focus on systems of validation (*ink* as publication, *page* as record, *seal* as institution). Words denote ownership and timing.  
  - **Envoi:** Refuses synthesis. Notes the *machinery* (press, seal, date) but leaves unresolved whether simultaneity implies inevitability or obscures theft. "Which date holds true?" rejects verdicts.
