prompt: |-
  I am auditing an undergraduate lecture series on metaethics and wish to assess an overview of expressivism and the Frege–Geach problem that was presented in a preparatory handout for discussion. The handout characterizes the dialectic in approximately the following terms: expressivism holds that a moral utterance such as Tormenting is wrong does not report a moral fact but gives voice to a negative attitude, roughly Boo to tormenting. This story seems to work only for simple, freestanding assertions. In an unasserted context, such as the antecedent of If tormenting is wrong, then paying others to torment is wrong, the speaker is not expressing disapproval of tormenting, so the same words must change their meaning between asserted and unasserted occurrences. Moral modus ponens arguments therefore turn on an equivocation and cannot be valid on expressivist assumptions, despite being obviously valid. Hence expressivism cannot vindicate ordinary moral reasoning unless it abandons the idea that the meaning of a moral sentence is fixed by the attitude it serves to voice.

  I have some reservations about whether this compresses distinct issues, but I lack the background to locate them precisely. Could you provide a careful assessment of the extent to which this characterization is fair? Please distinguish what a contemporary defender of expressivism would accept as accurate, what is a helpful but potentially misleading simplification, and what rests on a conflation the view seeks to avoid. In particular, clarify the relation between assertoric force and meaning, whether the problem is best understood as the invalidity of moral modus ponens or as an explanatory demand upon the expressivist, and whether the handout's final conclusion follows once the summary is corrected.
reasoning: |-
  Okay, the user is auditing an undergraduate metaethics lecture series and wants to assess a handout on expressivism and the Frege-Geach problem. They've shared how the handout characterizes the dialectic and have reservations about whether it compresses distinct issues. They're seeking a careful assessment of its fairness.

  The handout presents expressivism as saying moral utterances express attitudes like "Boo to tormenting" rather than reporting facts. It then argues this fails for unasserted contexts like conditionals, where the speaker isn't expressing disapproval. The handout claims this leads to equivocation in moral modus ponens arguments, making them invalid under expressivism despite seeming valid. It concludes expressivism must abandon its core idea to vindicate moral reasoning.

  I need to evaluate this characterization. Let me break it down. The initial setup of expressivism is mostly accurate - modern expressivists do think moral judgments express non-cognitive attitudes. But the "Boo!" example is oversimplified; contemporary versions use more sophisticated attitude psychology.

  The handout correctly identifies the Frege-Geach problem as concerning embedded contexts. However, its claim that words "must change their meaning" between asserted/unasserted contexts reflects Geach's original formulation but misses how modern expressivists respond. They don't accept meaning change - they develop semantic frameworks where attitude expression works consistently across contexts.

  On validity, the handout's claim that modus ponens becomes invalid under expressivism is too strong. The real challenge is explaining validity within a non-cognitive framework, not denying validity altogether. Blackburn and Gibbard have developed expressivist-friendly accounts of logical validity.

  The conclusion that expressivism must abandon its core idea doesn't follow. Contemporary expressivists maintain their view while addressing embedding through complex semantics. The problem is explanatory, not insurmountable.

  I should clarify these points in my response: what's accurate in the handout, what's oversimplified, and what's conflated. I'll emphasize that the real issue is explaining logical relations for attitude-expressing sentences, not meaning change or invalidity. And I'll note that while the handout captures the problem's origin, its conclusions don't reflect current expressivist strategies.
answer: |-
  Your reservations about the handout's characterization are well-founded. While it captures the *spirit* of the Frege-Geach challenge to expressivism, it compresses several crucial distinctions and presents some potentially misleading simplifications. Here's a careful assessment broken down as requested:

  **1. What the Handout Gets Right (Broad Strokes & Core Challenge):**

  *   **Expressivism's Core:** Correctly identifies that expressivism (in its simple, early forms like Ayer's emotivism) holds that moral utterances primarily *express* non-cognitive attitudes (e.g., disapproval, approval, commitments) rather than *describing* objective moral facts.
  *   **The Problem of Embedding:** Correctly identifies that the core challenge arises when moral sentences appear in unasserted contexts (like conditionals, disjunctions, questions, belief reports). The intuition that "tormenting is wrong" *means the same thing* whether asserted stand-alone or embedded is powerful and correct.
  *   **The Threat to Logic:** Correctly identifies that if the meaning *radically* shifts between asserted and unasserted contexts, then inferences like moral modus ponens appear to involve equivocation, threatening the validity of ordinary moral reasoning. Expressivism *must* account for this.
  *   **The Explanatory Burden:** Correctly establishes that expressivism faces a significant explanatory demand regarding the semantics of embedded contexts and logical validity.

  **2. Helpful but Misleading Simplifications:**

  *   **"Boo to tormenting!":** While evocative of early emotivism, this is a significant oversimplification for contemporary expressivism (e.g., Blackburn's quasi-realism, Gibbard's norm-expressivism). Contemporary expressivists:
      *   Use more sophisticated attitude psychology (e.g., plans, commitments, states of being for or against).
      *   Emphasize that the attitude expressed is often a *cognitive* state *about* non-cognitive attitudes (e.g., *endorsing* a norm, *accepting* a plan that rules out tormenting).
      *   Distinguish between the *mental state expressed* and the *speech act* performed. The core claim is about the *type* of mental state constitutive of moral judgment.
  *   **"Gives voice to a negative attitude":** This phrasing risks conflating the *act of expression* (which only happens when the sentence is asserted) with the *meaning* of the sentence (which should be consistent across contexts). Contemporary expressivists seek a theory of *sentence meaning* (content) that explains *why* uttering it in an assertion expresses that attitude, and *why* it embeds logically as it does. The meaning isn't *identical* to the act of expressing on a particular occasion.
  *   **"The same words must change their meaning":** This phrasing presents Geach's *diagnosis* of the problem for simple expressivism as if it were an *inevitable consequence* expressivism must accept. Contemporary expressivists vehemently *deny* that meaning changes. Their entire project is to provide a semantics where the meaning (content) of "tormenting is wrong" is *stable* across asserted and unasserted contexts, *explaining* both its use in assertion to express disapproval and its logical behavior in embeddings. The challenge is *how* to do this without positing descriptive truth-conditions.

  **3. Conflations and Problematic Formulations:**

  *   **Conflation: Expression (Force) vs. Meaning (Content):** This is the most significant conflation. The handout strongly implies that the meaning of the moral sentence *is* the act of expressing the attitude ("Boo!"). This conflates:
      *   **Illocutionary Force:** The *act* performed by uttering a sentence (e.g., asserting, commanding, questioning). Expressivism holds that the *typical force* of a freestanding moral utterance is expressive/endorsing.
      *   **Semantic Content:** What the sentence *means*, its contribution to truth-conditions (or truth-aptness), and crucially, its *logical properties*.
      The Frege-Geach problem highlights that force is tied to the *utterance act* in a context (only asserted sentences have assertoric force), while meaning/content must be stable to account for compositionality and logic. Contemporary expressivists aim to define a *semantic content* for moral sentences that explains *why* asserting that content constitutes expressing the relevant attitude and *why* that content embeds logically as it does. They don't define the content *as* the force.
  *   **Invalidity vs. Explanatory Demand:** The handout states: "Moral modus ponens arguments therefore turn on an equivocation and **cannot be valid** on expressivist assumptions..." This is too strong and misrepresents the contemporary dialectic.
      *   Expressivists (like Blackburn, Gibbard) emphatically *accept* that moral modus ponens is valid. They are not trying to *deny* the validity of ordinary moral inferences.
      *   The problem is **explanatory**: *How* can the expressivist *explain* or *vindicate* the validity of these inferences *given* their core thesis about the nature of moral judgments? How do the attitudes expressed by the premises logically combine to *necessitate* the attitude expressed by the conclusion? Or how can validity be understood if the premises don't express truth-apt propositions in the classical sense? The problem is providing an expressivist-compatible *account* or *foundation* for logic, not denying the logic itself.
  *   **"Change their meaning":** As noted, this presents the *problem* as the *expressivist solution*. Expressivists aim for a *univocal meaning*.

  **4. Relation Between Assertoric Force and Meaning:**

  *   The handout's characterization implies a direct equation: Meaning = Expression (Force).
  *   **Contemporary Expressivist View:** Force and meaning/content are distinct but related. The core expressivist claim is that the *semantic content* of a moral sentence is such that *asserting* that content *constitutively involves* expressing the relevant non-cognitive attitude. Crucially, this *same semantic content* is what appears in embedded contexts. The meaning/content doesn't change when embedded; the *force* is absent because the sentence isn't being asserted. The expressivist must explain *what that content is* and *how it composes* in embeddings to yield valid inferences, without relying on the attitude being expressed in the embedded occurrence.

  **5. Is the Problem Invalidity or an Explanatory Demand?**

  *   **Most accurately:** The problem is **primarily an explanatory demand**. Expressivism must explain:
      1.  **Compositionality:** What is the semantic value/content of a moral sentence in an embedded context (e.g., the antecedent of a conditional)? How does this content combine with the meanings of logical operators and other sentences?
      2.  **Validity/Logical Relations:** How, on expressivist foundations, can we understand the validity of inferences involving embedded moral sentences? How do the mental states expressed by the premises relate to the mental state expressed by the conclusion such that the inference is necessarily truth/acceptance-preserving (or necessarily attitude-consistent)?
  *   Framing it *solely* as "modus ponens becomes invalid" misrepresents the expressivist's goal and commitment. They aim to *save* the validity by providing a novel explanation.

  **6. Does the Handout's Final Conclusion Follow?**

  *   **Handout Conclusion:** "Hence expressivism cannot vindicate ordinary moral reasoning unless it abandons the idea that the meaning of a moral sentence is fixed by the attitude it serves to voice."
  *   **Assessment:** **This conclusion does not necessarily follow once the summary is corrected.** Why?
      *   Contemporary expressivists (Blackburn, Gibbard, Schroeder) explicitly aim to *retain* the core idea that meaning is fundamentally tied to expressed attitudes *while also* providing a semantics that handles embedding and validates logic.
      *   They do this by developing complex semantic frameworks:
          *   **Blackburn (Quasi-Realism):** Uses a "logic of attitudes" and "higher-order attitudes" (e.g., disapproving of not disapproving of tormenting). Meaning is defined via commitment properties or inferential roles grounded in attitudes.
          *   **Gibbard (Norm-Expressivism):** Uses possible worlds and hyperplans. Moral sentences express states of planning or norm-acceptance. Meaning is given in terms of the factual (world-plan) content that makes the plan/norm-acceptance correct.
          *   **Schroeder (Being For):** Proposes a single core attitude ("being for") and analyzes complex sentences (including conditionals and negation) as expressing complex combinations of this basic attitude.
      *   While these solutions are complex, debated, and face their own challenges (e.g., the "negation problem"), they demonstrate that expressivists believe they *can* vindicate logic *without* abandoning the core attitudinal foundation. They argue they provide a *different kind* of grounding for meaning and logic, not a descriptive one. The conclusion that they *must* abandon the core idea is premature; the verdict on whether they *succeed* is still a live debate, but they are not abandoning the core project.

  **Conclusion:**

  The handout accurately captures the *origin* and *motivation* of the Frege-Geach problem: simple expressivism struggles with embedded contexts and logic. However, it oversimplifies expressivism ("Boo!"), crucially conflates force/content, misrepresents the challenge as necessitating meaning change or denying validity (rather than demanding an explanation), and draws an overly strong conclusion that contemporary expressivists explicitly reject and work to avoid. A fairer characterization would emphasize that the challenge is for expressivism to provide a compositional semantics and account of logical validity consistent with its core thesis about the nature of moral judgments, and that sophisticated versions attempt to meet this challenge head-on without abandoning their foundational commitments. The problem is not *whether* moral modus ponens is valid, but *how expressivism can explain why it is valid*.
