  For the method, their instinct is to reverse-engineer existing standards. That feels right - concrete cases will expose hidden assumptions better than abstract theory. I'll suggest analyzing 3-4 standards (e.g., salmon stocking density, shrimp stunning methods) to map empirical-vs-normative premises. Quarterly breakdown: literature review first, then case studies, then comparative analysis. 

  Scoping is tricky. They're right that this could sprawl into two projects. I'll emphasize this must stay focused on diagnostic mapping, not solving epistemology or philosophy wholesale. Success looks like identifying recurring "smuggling" patterns; failure would be just describing existing frameworks without exposing new fault lines. 

  Better avoid jargon like "affective states" - they know this literature cold. And no citations; they'll handle references once the framework is set. The tone should respect their expertise while sharpening their nascent idea into academic weaponry.
answer: |-
  Here is a two-page proposal structured according to your specifications, designed to rigorously frame your "calibration problem" and outline a feasible, impactful project:

  ---

  **Project Title:** Deconstructing the Calibration Gap: Mapping the Empirical-Normative Interface in Aquatic Animal Welfare Standards

  **Principal Investigator:** [Your Name] (Retired Senior Fisheries Physiologist)

  **Duration:** 12 months (Part-time)

  **1. Core Research Question:**
  *To what extent do current welfare standards for farmed finfish and decapod crustaceans rely on untested assumptions regarding the relationship between measurable biological indicators and inferred subjective states, and how do these assumptions shape policy outcomes?*

  This question demands:
  *   **Identification:** Pinpointing the specific empirical indicators used within selected standards (e.g., lesion thresholds, cortisol levels, specific behaviors).
  *   **Decomposition:** Disentangling the explicit empirical claims ("Indicator X correlates with stressor Y") from the implicit normative claims ("Therefore, managing for Indicator X threshold Z constitutes acceptable welfare").
  *   **Calibration Assessment:** Evaluating the evidence (or lack thereof) specifically linking *these indicators* to plausible *subjective experiences* (e.g., pain, fear, distress) *in the specific aquatic taxa*.
  *   **Impact Analysis:** Determining how these embedded normative assumptions influence the practical requirements and permissibility of practices within the standards.

  **2. Why Existing Frameworks Leave the Question Open:**
  While established concepts (Biological Functioning, Affective State, Natural Living) categorize broad *approaches* to welfare, and sentience debates highlight *general capacity*, they fail to address the *operational gap* central to your hypothesis:

  *   **Indicators vs. Experience:** Current frameworks accept that physiological/behavioral indicators *proxy* welfare but do not systematically scrutinize the *validity* of *specific, applied indicators* as proxies for *specific subjective states* in phylogenetically distant species. The assumption that "low mortality + no lesions = acceptable welfare" carries implicit normative weight without necessarily being validated against the animal's internal state.
  *   **Translation, Not Validation:** The migration of indicators (e.g., cortisol as a "stress hormone") from mammals to fish and decapods often occurred based on functional homology or practical necessity, not on rigorous validation against subjective experience in these taxa. Frameworks describe the indicators but rarely interrogate the strength of the inference chain from indicator to welfare *experience*.
  *   **Normative Smuggling:** When standard-setting bodies state "Practice A is humane because it minimizes Indicator B," they conflate an empirical observation (A affects B) with a normative judgment (minimizing B constitutes humane treatment). Existing frameworks don't provide tools to isolate and critically evaluate this smuggled norm, which may rest on unexamined assumptions about what Indicator B *means* for the animal's inner life.
  *   **Philosophical Abstraction:** Philosophical theories (hedonism, preference) provide high-level accounts of welfare but lack the granularity to assess whether *particular operational indicators* used in *specific standards* reliably track the relevant experiential states (pleasure/pain, preference frustration) for non-mammalian species. They identify *what* welfare might be, but not *how we know it* via specific measures in these animals.

  **3. Proposed Methodology: A Reverse-Engineering Approach**
  Your instinct to work *outwards from concrete standards* is the correct and most impactful approach for this project's goals. Building up from abstract concepts risks remaining disconnected from the policy reality where the "smuggling" occurs. The method proceeds quarter-by-quarter:

  *   **Quarter 1: Corpus Selection & Framework Development:**
      *   Select 3-4 prominent, detailed welfare standards/codes of practice for key farmed aquatic species (e.g., Atlantic salmon, sea bass/bream, penaeid shrimp, a decapod like crab or lobster). Prioritize standards actively influencing policy/practice.
      *   Develop a rigorous analytical framework for deconstruction: Identify key mandated practices (e.g., max stocking density, stunning methods, transport conditions) and the *specific, cited* biological indicators used to justify their acceptability or prohibition (e.g., plasma cortisol < X ng/ml, < Y% mortality, absence of specific escape behaviors).
      *   Define categories for premises: "Empirical Premise" (EP: Measurable relationship between practice and indicator), "Normative Inference" (NI: Interpretation of indicator level/threshold as signifying "good/poor welfare"), "Calibration Basis" (CB: Evidence cited for the link between indicator and subjective state).
  *   **Quarter 2: Deep Deconstruction of Standards:**
      *   Apply the framework to each selected standard. For each key practice/indicator threshold:
          *   State the EP clearly (e.g., "Density D causes Cortisol C").
          *   State the explicit or implicit NI (e.g., "Therefore, maintaining cortisol below C ensures welfare is not unacceptably compromised").
          *   Identify and categorize the CB cited (e.g., mammalian literature, general fish stress studies, taxon-specific studies, absence of evidence, expert opinion).
      *   Document the *structure* of justification: Is the NI explicitly argued for, or assumed? How strong is the cited CB for *this taxon* and *this specific indicator/state link*?
  *   **Quarter 3: Comparative Analysis & Pattern Identification:**
      *   Systematically compare the deconstructed standards. Key questions:
          *   Do different standards for the same species rely on similar or different EPs/NIs/CBs for similar practices?
          *   Do standards for phylogenetically distant species (e.g., salmon vs. shrimp) rely on *structurally similar* justifications despite vastly different biologies?
          *   Are there recurring types of "smuggling" (e.g., using absence of extreme physiological disruption as evidence for absence of suffering; assuming behavioral avoidance reliably indicates negative experience)?
          *   Where is the CB weakest or entirely absent?
  *   **Quarter 4: Synthesis, Implications & Output Development:**
      *   Synthesize findings: Characterize the dominant patterns linking EPs to NIs and the typical strength/weakness of CBs across the standards.
      *   Articulate the specific "calibration gaps" identified: Where is the leap from indicator to inferred state most precarious and unsupported?
      *   Develop concrete implications for science (what evidence is critically needed?), philosophy (how do abstract theories need refining for application to these taxa?), and policy (how can standard-setting processes become more transparent about normative assumptions?).
      *   Draft final report and targeted policy brief.

  **4. Defining Success and Failure:**

  *   **Success:**
      1.  Clear demonstration of specific, recurring instances where normative inferences (NI) within operational standards are insufficiently supported by explicit calibration evidence (CB) linking the mandated indicators to plausible subjective states *in the specific taxa*.
      2.  Identification of distinct patterns or "types" of normative smuggling prevalent in aquatic welfare standards.
      3.  Production of a typology or framework that enables standard-setters and scientists to systematically identify and articulate the empirical-normative interface within any given welfare criterion.
      4.  Articulation of specific, actionable research questions prioritized to fill the most critical calibration gaps identified.
  *   **Failure:**
      1.  Only describing existing welfare frameworks or sentience debates without exposing *how* normative claims are embedded within *specific, operational* empirical indicators in standards.
      2.  Failing to move beyond general statements (e.g., "more research is needed") to identify *precisely which* indicator-state links for *which practices* in *which species* lack robust calibration.
      3.  Producing an analysis that remains purely theoretical/philosophical without concrete grounding in deconstructed, real-world standards.
      4.  Missing the opportunity to show *how* the identified gaps potentially lead to specific, problematic policy outcomes (e.g., permitting practices that cause suffering, prohibiting practices unnecessarily).

  **5. Honest Scope Assessment & Limitations:**

  This project deliberately focuses on **diagnostic mapping** – exposing the structure and assumptions within existing standards. It is fundamentally *one* project centered on the **interface** between empirical science and normative judgment *as it manifests operationally in policy instruments*.

  *   **It is NOT:** A primary research project to *validate* specific welfare indicators against subjective states in aquatic animals (an empirical project requiring lab/field work). Nor is it an attempt to *resolve* the fundamental philosophical debate about the nature of welfare itself (a purely conceptual project).
  *   **Scope Boundaries:**
      *   Focuses on farmed finfish and decapods; excludes wild capture, molluscs, elasmobranchs.
      *   Analyzes existing, formal standards/codes; does not develop new standards.
      *   Identifies calibration gaps and needed research; does not conduct that research.
      *   Exposes normative smuggling; does not prescribe which normative theory *should* underpin welfare standards.
  *   **Why this Scope is Feasible & Valuable:** It leverages your unique expertise in aquatic physiology and deep dive into ethics to perform a novel, critical analysis exactly at the point where science meets policy. It provides the crucial groundwork for *both* future empirical validation studies (by pinpointing where evidence is weakest) *and* refined philosophical application (by showing where abstract theories fail to connect to operational measures). Attempting both empirical validation and fundamental philosophical resolution within 12 months part-time would guarantee failure on both fronts. This diagnostic step is essential, currently missing, and achievable.

  ---
  **Key Strengths of this Proposal:**

  1.  **Precision:** Transforms the insightful "calibration problem" into a tractable research question with defined outputs.
  2.  **Leverages Your Expertise:** Uses your deep knowledge of aquatic biology and practical science to ground the analysis in real standards and practices.
  3.  **Addresses the Gap Directly:** Focuses squarely on the operational interface where normative smuggling occurs, bypassing re-descriptions of existing frameworks.
  4.  **Actionable Method:** Provides a clear, step-by-step, quarter-by-quarter plan centered on your reverse-engineering approach.
  5.  **Clear Success Metrics:** Defines tangible outcomes demonstrating impact and potential for changing discourse/practice.
  6.  **Honest Scoping:** Explicitly acknowledges the project's boundaries and why focusing on the interface is both necessary and sufficient for this stage.
  7.  **Policy Relevance:** Directly addresses a problem affecting real-world animal welfare regulation and industry practices.
