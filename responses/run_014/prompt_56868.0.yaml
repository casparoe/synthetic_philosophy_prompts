prompt: |-
  Ok so I just spent like four hours arguing with a friend of mine (we were both polisci undergrads, it was unbearable) about whether "democratic backsliding" names a real distinction or is just a slur people apply to the other side's institutional hardball. She's at maybe 0.85 that it's mostly the latter. I'm at 0.3. I want your number and I want it decomposed — please don't give me a both-sides shrug, I got enough of those tonight.

  Here's the claim I actually care about, the one I tried to pin her down on and she kept sliding off of:

  C: for a typical informed disagreement about whether some country is currently backsliding — where both people already agree on the institutional facts, the court appointments, the electoral rule changes, the NGO funding restrictions, the purges of the election administration, whatever — if you swapped the partisan and ideological labels on the actors while holding those facts fixed, at least one of the two would change their verdict.

  So: your credence in C. Break it into the pieces you think it actually depends on, with a number and one line of justification for each. Some pieces I'd guess belong in there, add or cut as you see fit: whether the concept has a determinate core that even motivated people converge on; how much of ordinary disagreement is about weighting borderline moves (is packing a constitutional court a 0.3 slide down a continuum or a categorical break?) rather than about the core itself; whether the answer differs a lot by case — Hungary or Turkey, where one side of the argument has no domestic stake, versus the US, where both sides do; and whether baseline choice is quietly doing all the work, i.e. backsliding relative to the country's own past, relative to regional peers, or relative to some ideal type. Then show me how the pieces combine into your final number — multiply them, average them, whatever you actually think the structure is — and tell me which single piece your number is most sensitive to and what evidence or argument would move it.

  Two more things before I let you go. First: partway through I proposed an insturment — take thirty-ish concrete institutional moves, have people rate each one as backsliding or not, then re-administer the same list with the party and country names swapped and look at within-person flip rates. She said it's worthless because nobody's ratings are stable enough across administrations for a flip to mean anything. Is she right, or would that design actually be diagnostic of C? Second, and this is where I think she's being slippery: even if the swap changed nobody's verdict, you could still have two people who agree on every fact and disagree about the label, which would make the disagreement verbal rather than partisan. Those are two different failure modes and she keeps cashing both out with the same sentence. Give me a separate credence for the verbal-not-partisan version if you can, and tell me where you think the gap between her 0.85 and my 0.3 most likely lives.
reasoning: |-
  Okay, let me try to unpack this user's query. They had a long argument with a friend about whether "democratic backsliding" is a real concept or just a partisan slur. The core claim (C) is whether swapping partisan labels would make people change their judgment about backsliding in a typical informed disagreement. 

  First, I need to break down C into its components. The user mentioned several factors: determinate core concept, weighting of borderline moves, variation by country cases, and baseline choice. I should assess each one separately. 

  For the determinate core: even with motivated reasoning, most experts agree on extreme cases like packing courts or restricting media. So I'll assign a high probability here. Borderline moves are trickier because people might weigh them differently based on partisanship. Cases like the US with high domestic stakes might show more bias than Hungary. Baseline choice also matters—using different reference points could lead to disagreements that aren't necessarily partisan.

  Combining these, I multiply the probabilities since they're somewhat independent. The result is around 0.4 for C. The most sensitive point is the weighting of borderline moves—if evidence shows consistent weighting across parties, that would lower the probability.

  The user also asked about their experimental design. Swapping labels could reveal partisan bias if the moves are clearly anti-democratic. But for borderline cases, instability might be due to genuine uncertainty rather than partisanship. So the design has value but isn't perfect.

  For the verbal disagreement aspect, I think many disputes are about definitions rather than partisanship. People might agree on facts but not on what counts as backsliding. I'd put that at 0.5. The gap between the user and their friend likely comes from different weightings of borderline moves and baseline choices. The friend might see more partisanship in weighting, while the user emphasizes core agreement.

  I need to ensure my response addresses all parts: credence decomposition, the experiment's validity, and the verbal disagreement probability. Highlighting the sensitivity to borderline moves and baseline choices can clarify where their disagreement lies.
answer: |-
  Here's my decomposed credence in **C** (your core claim), built from structural components, with justification for each. My final credence in **C is 0.4**. Below is the breakdown, combination logic, sensitivity analysis, and answers to your follow-ups.

  ---

  ### **Credence Components & Justification**
  1.  **Determinate Core Concept Exists (P = 0.85)**  
      *Justification:* Experts broadly agree on core anti-democratic acts (e.g., jailing opposition, banning opposition parties, abolishing term limits). High consensus exists in extreme cases, even amid partisanship.  
      
  2.  **Disagreement Driven by Weighting Borderline Moves (P = 0.7)**  
      *Justification:* Most disputes center on "gray area" actions (court-packing, NGO restrictions, gerrymandering). Partisanship heavily influences whether these are seen as "hardball" (legitimate) or "backsliding" (illegitimate).  
      
  3.  **Case Dependence (Domestic vs. External) (P = 0.6)**  
      *Justification:* In cases like Hungary/US, where evaluators have domestic stakes, partisan bias inflames disagreement. In external cases (e.g., non-EU scholars assessing Turkey), ideology still matters but is less dominant than in domestic disputes.  
      
  4.  **Baseline Choice as Hidden Driver (P = 0.9)**  
      *Justification:* "Backsliding" inherently requires a reference point (past norms? regional peers? ideal democracy?). Opponents often *select* baselines that favor their side (e.g., "2020 was the *real* baseline" vs. "1990 was"). Unacknowledged baseline divergence explains many "factual" disagreements.  

  ---

  ### **Combination into Final Credence (C = 0.4)**  
  - **Formula:** `C = Core × Weighting × Case × Baseline`  
    `0.85 × 0.7 × 0.6 × 0.9 ≈ 0.32`, but adjusted to **0.4** to account for interdependence (e.g., borderline moves become more partisan *because* baselines are contested).  
  - **Why multiplication?** Each component acts as a *necessary filter*. If core consensus were near-zero (P=0.1), C would collapse regardless of other factors. Similarly, if baselines weren’t contested (P=0.1), partisan flips would be rarer.  

  ---

  ### **Highest Sensitivity: Weighting Borderline Moves (P = 0.7)**  
  - **Why?** Core acts (jailing opponents) rarely flip evaluations even with party swaps. But most real-world disputes are about *less extreme actions* (e.g., voter ID laws, court reforms). If evidence showed consistent cross-partisan ratings of these (e.g., liberals/conservatives both rate a move as 0.3 "slide" regardless of who does it), **P(Weighting)** would drop to ~0.3, pulling **C** down to **0.15**.  
  - **Move it with:** Cross-ideological experiments where subjects rate *identical* institutional moves attributed to different parties. Low flip-rates → lower **P(Weighting)**.  

  ---

  ### **Your Experiment: Diagnostic? (Yes, with caveats)**  
  - **She’s wrong about stability.** If you use **unambiguously anti-democratic moves** (e.g., "president arrests opposition leader"), ratings *are* stable across contexts. Flip rates *would* reveal partisan bias.  
  - **But her caveat applies to borderline cases.** If your 30 moves include many gray-area actions (e.g., "senate refuses to vote on court nominees"), low stability could reflect genuine ambiguity, not partisanship.  
  - **Solution:** Use a mix of clear/ambiguous moves. High flip rates on *clear* moves = strong evidence for **C**. Flip rates on ambiguous moves = uninformative.  

  ---

  ### **Verbal Disagreement Credence: 0.5**  
  - **Separate claim:** "Two people agree on all institutional facts *and baseline* but still disagree on 'backsliding' due to conceptual definitions."  
  - **Why 0.5?** Half of disputes are likely about baseline/weighting (partisan), half about the *threshold* for "backsliding" (verbal). E.g., one scholar sees backsliding starting at 0.5 SD from ideal democracy; another reserves it for 1.5 SD.  

  ---

  ### **The 0.85 vs. 0.3 Gap: Where It Lives**  
  Your gap most likely lives in **Weighting** and **Baseline**:  
  - **She (0.85)** likely believes:  
    - Borderline moves *are* the core dispute (no consensus on what’s "backsliding").  
    - Baseline disagreements *are* inherently partisan (e.g., choosing 2020 vs. 1990 reflects team allegiance).  
  - **You (0.3)** likely emphasize:  
    - Core acts create a shared anchor (e.g., "we both agree jailing opponents is backsliding").  
    - Baselines *can* be debated neutrally (e.g., regional peers = objective benchmark).  

  **Crucially:** Her rejection of your experiment suggests she sees *all* moves as borderline (no stable anchors). You see a mix of stable anchors and contested margins.  

  ---

  ### Summary  
  - **My credence in C: 0.4**  
  - **Most sensitive to:** How partisanship shapes evaluation of *borderline* institutional moves.  
  - **Diagnostic experiment?** Yes, if focused on unambiguous anti-democratic acts.  
  - **Verbal disagreement risk:** 0.5 (separate from partisanship).  
  - **Your gap:** She sees weighting/baseline as *wholly* partisan; you see a solid core limiting partisan flexibility.  

  This isn’t a "both-sides shrug"—it’s a map of where the partisan fault lines *actually* fracture the concept. To change my **C=0.4**, show me data proving that evaluations of *core* anti-democratic acts (not borderline ones) flip with party labels.
