  We are creating a sorting quiz to reveal which theory of self-deception a person holds. The theories to be covered are:
  1. Paradox-deniers (motivated error): Self-deception is nothing more than a motivated mistake.
  2. Contradictory beliefs (with partitioned mind): The agent simultaneously holds two contradictory beliefs, and the mind is partitioned.
  3. Contradictory beliefs (without partitioned mind): The agent simultaneously holds two contradictory beliefs, but without a partitioned mind (how?).
  4. Mele-style non-intentional: Biased belief formation (e.g., selective evidence gathering) without intention to deceive oneself.
  5. Intentionalist: The agent intentionally sets out to deceive herself.

  Constraints:
  - No vignette may use the words "intend", "paradox", or "unconscious" in a way that tips the answer.
  - Include at least one case of twisted self-deception (believing what one most wants not to believe).
  - One case where no contradictory belief is formed because the agent only steers evidence-gathering.
  - One case concerning a standing character trait.

  We'll create eight vignettes. Each with 2-3 answer options (like: self-deceived / merely mistaken / neither).

  After the vignettes, we provide a scoring key mapping patterns to the positions.

  Finally, we flag two positions the battery cannot genuinely separate and name any combination of answers no one defends, and say why.

  Let's design the vignettes:

  Vignette 1: Twisted self-deception
    Alex, a normally confident public speaker, has an important speech coming up. Despite a history of successful speeches and praise from colleagues, Alex becomes convinced that they will embarrass themselves horribly. They spend hours practicing, yet the more they practice, the more they feel sure of failure. They even turn down a similar opportunity the next week.
    Options:
      A. Alex is self-deceived.
      B. Alex is merely mistaken.
      C. Neither.

  Vignette 2: Evidence steering without forming contradictory belief
    Taylor is applying for a job they really want. They have a strong resume and good references, but they remember one negative performance review from years ago. Taylor avoids asking their current boss for a reference because they don't want to hear any criticism, even though the boss has always been positive. They focus only on the negative review and end up not applying.
    Options:
      A. Taylor is self-deceived.
      B. Taylor is merely mistaken (they just made a bad decision based on incomplete evidence).
      C. Neither.

  Vignette 3: Standing character trait
    Jordan has always described themselves as a very honest person. However, Jordan often tells small lies to avoid awkward situations and then forgets about them. When friends point out a lie, Jordan is genuinely surprised and denies having lied, even when shown evidence. This pattern has persisted for years.
    Options:
      A. Jordan is self-deceived about their honesty.
      B. Jordan is merely mistaken (they have a poor memory for these incidents).
      C. Neither.

  Vignette 4: Classic self-deception (avoiding unpleasant truth)
    Casey's partner has been acting distant. Casey notices but pushes away the thought that the relationship might be ending. Instead, Casey focuses on the times when the partner is affectionate and tells friends that everything is fine. When the partner breaks up with them, Casey is shocked.
    Options:
      A. Casey is self-deceived.
      B. Casey is merely mistaken (they were hopeful and ignored signs, but didn't deceive themselves).
      C. Neither.

  Vignette 5: Self-deception about health
    Sam has a persistent cough but avoids going to the doctor. Sam tells themselves it's just allergies, even though they have a family history of lung disease. They actively avoid reading about symptoms of lung disease and change the subject when a friend expresses concern.
    Options:
      A. Sam is self-deceived.
      B. Sam is merely mistaken (they are in denial but not self-deceived).
      C. Neither.

  Vignette 6: Twisted self-deception (another example, but this time about a positive outcome)
    Robin, a talented artist, has been offered a prestigious gallery show. Despite having won awards and sold many pieces, Robin becomes convinced that the gallery made a mistake and that they will be exposed as a fraud. They consider turning down the offer.
    Options:
      A. Robin is self-deceived.
      B. Robin is merely mistaken (they are suffering from impostor syndrome but not self-deceived).
      C. Neither.

  Vignette 7: Evidence steering that leads to a false belief
    Avery is considering investing in a company. They are excited about the potential returns but are aware of some risks. Avery only seeks out positive reviews and success stories and avoids any critical analysis. They become convinced the investment is safe and invest a large sum.
    Options:
      A. Avery is self-deceived.
      B. Avery is merely mistaken (they made a poor decision due to biased research).
      C. Neither.

  Vignette 8: Self-deception about moral character (standing trait)
    Morgan believes they are a very charitable person. They donate a small amount to charity each year but ignore opportunities to volunteer or help in more substantial ways. When a friend points out that Morgan could do more, Morgan becomes defensive and insists that their financial donations are enough and that they are very giving.
    Options:
      A. Morgan is self-deceived about their charity.
      B. Morgan is merely mistaken (they have a different view of what it means to be charitable).
      C. Neither.

