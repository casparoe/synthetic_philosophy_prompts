prompt: |-
  You are a philosopher of mind with substantial experience as an evaluator of machine learning systems — someone who can read a technical measurement protocol and say precisely what theory of cognition it silently commits its authors to. Please treat this as an exercise in conceptual reconstruction rather than as a request for advice or for a verdict on whether models "really" understand anything.

  I work on the evaluation side of a lab that builds large language models, and over the past year I have become uneasy about our contamination policy, which I will describe as concretely as I can. Before each release, we screen the model for verbatim familiarity with the items of widely used public benchmarks: we look for long exact overlaps between model outputs and benchmark text, and in some cases we check whether the model can reproduce unique random identifier strings that a benchmark's authors deliberately embedded in their released test data. If a model trips a threshold, we void the score for that entire benchmark — not merely for the individual items it appears to have seen, but for the instrument as a whole, on the reasoning that the benchmark has stopped measuring anything. Alongside this, we commission private problem sets that are never published: contractors write them, they are rewritten each cycle with new names, new numbers, and new surface phrasing but deliberately the same underlying structure, and access is restricted to a handful of people. These private sets, plus "live" evaluations built from problems that only came into existence after the training cutoff — this month's examinations, puzzles released last week — are treated internally as our strongest evidence about what the model can do. We also, occasionally, seed plausible but fabricated claims into places likely to be scraped, and treat a model's confident repetition of such a claim as strong evidence that it ingested that material, while treating its silence as only weak evidence that it did not.

  Here is what puzzles me. We still publish and celebrate headline scores on older public benchmarks whose items, solutions, and walkthroughs were debated at length across the open web long before our training cutoff, and we describe year-over-year gains there as evidence of improved reasoning. And when a model solves a fresh private item that is structurally identical to thousands of near-duplicates in its training data, we call that generalization rather than retrieval. So the policy appears to hold that the provenance of an answer can disqualify it as evidence, and simultaneously that provenance is irrelevant whenever the surface form has been altered. If reproducing a memorized answer tells us nothing about whether the model grasps the problem, why does reproducing a memorized procedure — one instantiated in a vast family of superficially different training items — tell us a great deal? Is the distinction we are drawing really about memorization at all, or about something else: a performance-versus-competence distinction, a requirement of counterfactual robustness, a requirement that the right answer be produced by the right kind of internal process, a worry about the measuring instrument rather than about the mind being measured? I would like these possibilities sorted out rather than listed.

  Please think carefully and, before you commit to an interpretation, spend a short opening section brainstorming the candidate presuppositions the policy might rest on, including at least one you end up rejecting and explaining why. Then reconstruct the implicit theory of understanding and of evidential support that makes this bundle of rules coherent: what must be true of understanding for verbatim reproduction to be evidentially worthless while structurally parallel novel performance is evidentially gold? Say explicitly which rival views the policy rules out or ignores — a purely dispositional or functionalist account on which understanding just is a profile of input-output dispositions, so that where the answer came from cannot matter; the stochastic-parrots line of objection, on which success on a freshly written item is no better evidence of comprehension than success on a memorized one, since both are recombinations of training patterns; and any others you think are being quietly excluded. Assess whether the parts of the policy presuppose consistent things with one another, paying particular attention to the all-or-nothing voiding of a whole benchmark, to the asymmetry between how we weight a repeated fabricated claim and how we weight silence about one, and to the tension between our treatment of old public benchmarks and our treatment of contamination. Distinguish throughout what the practice strictly presupposes from what it merely fits comfortably with, and flag the places where the practice is philosophically underdetermined, so that two or three incompatible theories would license exactly the same rules. Finally, tell me what would have to change in the policy if we adopted the strongest rival account instead — would contamination screening become pointless, or would it survive as a measurement-validity concern rather than a concern about minds? Do not give me citations, a reading list, or named sources; argue from the concepts. Roughly nine hundred to twelve hundred words, and if you need to assume something about how evaluation is actually done that I have not stated, say so explicitly when you rely on it.
reasoning: |-
  Hmm, this is a fascinating and deeply philosophical query about the implicit theories of cognition embedded in LLM evaluation practices. The user works in an LLM lab and has become uneasy about their contamination policy, which treats verbatim reproduction as evidentially worthless while celebrating structurally similar novel problems as evidence of reasoning. 

  The core tension they've identified is this: why does memorized output invalidate a benchmark while memorized procedures applied to novel surface forms count as generalization? This isn't just a technical question - it's asking what theory of understanding makes this distinction coherent. 

  I need to reconstruct the unstated philosophical commitments here. First, let's brainstorm candidate presuppositions. The policy seems to assume that understanding requires some kind of structural sensitivity rather than surface recall. But is that because they believe in abstract competence? Or is it purely about measurement validity? 

  The all-or-nothing benchmark voiding suggests they're worried about the instrument being compromised rather than just individual items. The asymmetric treatment of fabricated claims (where repetition is strong evidence but silence is weak) implies they think models can't "unsee" training data. 

  The real puzzle is the celebration of gains on older public benchmarks. If those problems were debated online pre-training, isn't their solution also contaminated by exposure? This seems inconsistent with how they treat their private tests. 

  For this to make sense, the policy must be committed to a process-based theory of understanding where the internal causal history matters. Verbatim output comes from rote retrieval while novel structural solutions come from pattern extraction. But this directly contradicts functionalist views where only input-output matters. 

  The strongest rival view would be pure dispositionalism - if the model outputs correct answers consistently, why care if it memorized them? Under that view, contamination screening would only matter for test validity, not cognitive evaluation. 

  The fabricated claim asymmetry is particularly telling. It assumes models will always reproduce memorized falsehoods but won't spontaneously generate them - suggesting they see models as passive recall systems rather than constructive reasoners. 

  Ultimately, the policy hangs together only if we accept that understanding requires counterfactual robustness - the ability to handle novel instantiations. But this raises questions about what "novel" really means when private tests are structurally identical to training data. 

  If they adopted a rival view like stochastic parrot-ism, they'd have to treat all successes as equally uninformative about understanding. Contamination screening would still be useful for test validity, but couldn't support claims about reasoning. 

  The tension remains: why celebrate gains on pre-debated public benchmarks while voiding memorized ones? This suggests an unstated distinction between "reasonable exposure" versus "direct leakage" that needs explicit articulation.
answer: |-
  ## Conceptual Reconstruction of Implicit Commitments in LLM Evaluation Policy

  **Brainstorming Candidate Presuppositions:**

  1.  **Structural Competence over Surface Performance:** Understanding resides in the ability to grasp and manipulate abstract structures (relations, logical forms, problem schemas) rather than merely associating surface strings. Verbatim reproduction demonstrates only the latter, while novel instantiations require the former. *(Plausible)*
  2.  **Process Matters:** The *causal origin* of an output is crucial evidence. An output generated by pattern-matching memorized sequences provides no evidence of understanding, while an output generated by applying abstracted procedures to novel stimuli does. *(Plausible)*
  3.  **Counterfactual Robustness:** Genuine understanding manifests as stable performance under relevant variations (e.g., changed names, numbers, phrasing). Verbatim recall fails this; success on altered private items passes it. *(Plausible)*
  4.  **Benchmarks as Pure Measurement Instruments:** A benchmark contaminated by memorization ceases to function as a valid *measure* of the target construct (e.g., reasoning, comprehension) and becomes a test of memorization instead. Voiding the whole instrument prioritizes measurement validity over granular diagnosis. *(Plausible)*
  5.  **Understanding as Novelty Detection:** Success on genuinely novel problems (post-cutoff, live) is the gold standard because it precludes memorization. Success on private items with altered surfaces but known structures is *inferred* to be novel *enough* due to the surface changes. *(Potentially Implied)*
  6.  **Purely Dispositional/Functionalist View (Rejected):** Understanding is *solely* a matter of input-output dispositions. Verbatim reproduction of a correct answer *is* understanding, regardless of origin. This is rejected by the policy, as verbatim reproduction is explicitly discounted as evidence, showing that the *source* of the disposition matters. The policy cares about *how* the disposition was acquired/executed.

  **Reconstructing the Implicit Theory of Understanding & Evidence:**

  The policy coheres under a **Process-Oriented, Competence-Based Theory** with strong **Counterfactual Requirements**:

  1.  **Understanding as Abstract Structural Competence:** Understanding is the internalized grasp of abstract rules, schemas, or causal relations underlying a domain. This competence is distinct from, and evidenced by more than, the storage of specific exemplars.
  2.  **Evidence Requires Process Differentiation:** Verbatim reproduction is evidentially worthless *for understanding* because it is causally explained by direct pattern retrieval (rote memorization). It fails to differentiate competence from mere recall. Structural parallel performance on novel items *is* evidentially gold because its causal explanation necessitates the *application* of the abstracted competence to new inputs. The altered surface form acts as a causal filter, blocking direct retrieval and forcing the system to rely on its internalized structure.
  3.  **Counterfactual Robustness as a Key Marker:** Genuine competence must support performance across relevant counterfactual scenarios – changes in surface features that leave the underlying structure intact. Success on the private items demonstrates this robustness. Verbatim recall fails it spectacularly. The voiding of entire contaminated benchmarks reflects this: if contamination is present, the benchmark no longer reliably probes this robustness; it becomes a test of data leakage, not competence.
  4.  **Provenance Matters for Causal Inference:** The policy's core distinction hinges on the causal provenance of the output. Provenance disqualifies evidence (verbatim recall) when it points to retrieval, and provenance is deemed irrelevant *only after* the alteration (surface changes) has forced a shift in the likely causal process *away* from retrieval and towards competence application. The celebration of gains on older public benchmarks relies on the assumption that widespread discussion led to the *internalization of the underlying reasoning patterns* (competence), not merely the verbatim memorization of specific items/solutions en masse, and that year-over-year gains reflect *improved competence*, not just better memorization of the same static corpus.

  **Rival Views Excluded or Ignored:**

  1.  **Strict Dispositionalism/Functionalist Behaviorism:** This view (understanding *is* the disposition to produce correct outputs) is explicitly rejected. The policy's dismissal of verbatim outputs, despite correctness, shows that the *origin* of the disposition matters. Success on a fresh item is seen as better evidence precisely because it (presumably) stems from a different, competence-based disposition.
  2.  **"Stochastic Parrot" Skepticism:** This view (all LLM outputs are just statistically guided recombinations of training data, devoid of comprehension) renders the policy's distinction meaningless. If *both* verbatim recall *and* novel performance are merely recombinations, then neither provides better evidence for "understanding." The policy implicitly rejects this by treating novel performance (private tests, live tests) as superior evidence.
  3.  **Granular Memorization Accounting:** The policy ignores the possibility of selectively invalidating *only* contaminated items within a benchmark. The all-or-nothing voiding suggests a view where contamination fundamentally corrupts the *entire instrument's validity* as a measure of competence, perhaps because memorization could inflate scores even on unseen-but-similar items via priming or because establishing granular purity is practically impossible or undermines the benchmark's purpose.
  4.  **Strong Internalist Views:** The policy is largely agnostic about the precise internal mechanisms realizing competence (e.g., symbolic manipulation vs. distributed representations). It focuses on the *behavioral consequences* of the internal state (robustness under variation) and the *causal history* leading to the output.

  **Internal Coherence Assessment:**

  1.  **All-or-Nothing Voiding:** Coheres with viewing benchmarks as holistic instruments measuring a construct (competence). Contamination transforms the construct being measured from "reasoning competence" to "memorization + potential reasoning," invalidating the instrument. It's consistent with the competence view but pragmatically extreme; a rival "measurement validity only" view could also justify it.
  2.  **Fabricated Claim Asymmetry:** Repetition is strong evidence of ingestion because the model is assumed *not* to spontaneously generate *that specific, non-salient falsehood* unless it saw it. Silence is weak evidence because the model might have seen it but chosen (via probability weighting, context, RLHF) not to output it, *or* might not have seen it. This presupposes models are primarily passive pattern matchers regarding *specific, arbitrary* inputs, not active generators of novel falsehoods matching arbitrary planted patterns. It fits the retrieval/competence distinction: repetition suggests retrieval; silence doesn't prove lack of ingestion, just lack of retrieval *in that context*. The asymmetry highlights the policy's focus on *detecting retrieval* as a negative signal.
  3.  **Tension: Old Public Benchmarks vs. Contamination:** This is the weakest point. Celebrating gains on pre-debated benchmarks while voiding contaminated ones requires a subtle distinction. The policy likely presupposes that widespread web debate fosters the *internalization of reasoning patterns* (competence) applicable beyond the specific items, whereas verbatim memorization (detected by long strings/identifiers) signifies retrieval *without* internalization. It assumes the *scale and nature* of exposure (broad discussion vs. direct ingestion of test items) leads to different cognitive outcomes (competence vs. rote memorization). This is philosophically underdetermined – a skeptic could argue both are just different forms of pattern exposure leading to recombination.

  **Philosophical Underdetermination:**

  1.  **The Nature of "Novelty":** The policy treats private items (same structure, new surface) as sufficiently novel. But is this novelty defined relative to *exact string matches* or *structural matches* in the training data? If near-duplicate structural items exist in training (as acknowledged), is success truly novel? The policy assumes surface changes sufficiently disrupt direct retrieval, forcing competence use. Rival views (e.g., "it's just fuzzy retrieval") are compatible with the same rules but interpret the evidence differently. The policy *presupposes* surface variation necessitates a shift to competence; it doesn't prove it.
  2.  **Competence vs. High-Fidelity Pattern Matching:** Could success on novel surface forms arise from extremely sophisticated pattern matching on abstract features learned from vast data, *without* "grasping" in a human-like sense? The policy's rules fit both a "genuine competence" view and a "hyper-robust statistical pattern completion" view. The distinction hinges on interpretations beyond the observed behavior.
  3.  **Internal Process:** The policy is consistent with various internal mechanisms (symbolic, connectionist) as long as they manifest the required input-output robustness and sensitivity to surface form as a retrieval blocker.

  **Policy Change Under the Strongest Rival (Strict Dispositionalism/Functionalist Behaviorism):**

  Adopting the view that understanding *is* the disposition to produce correct outputs, regardless of origin, would radically alter the policy:
  1.  **Contamination Screening Becomes Pointless for Assessing Understanding:** Verbatim reproduction of a correct answer *is* valid evidence of understanding (the disposition exists). Screening would serve *only* measurement validity concerns:
      *   Avoiding inflated scores on benchmarks where answers are memorized.
      *   Maintaining the benchmark's intended purpose as a test of *novel* problem-solving *if* that's the construct (but the "novel" aspect becomes part of the disposition definition, not a proxy for competence).
      *   Preventing accusations of "cheating" or benchmark overfitting.
  2.  **Private Sets & Live Tests:** These would still be valuable as the *strongest* evidence of robust dispositions under novelty, but success on contaminated benchmarks would *also* count as evidence of understanding (the disposition exists for those items). The distinction between "memorization" and "generalization" as evidence for understanding evaporates; both are valid instances of the disposition.
  3.  **Fabricated Claims:** Repetition would still indicate ingestion, but silence would remain weak evidence for the same reasons. The asymmetry persists but isn't tied to a competence/retrieval distinction regarding understanding.
  4.  **Voiding Benchmarks:** Would only be justified for *measurement validity*: if memorization means the benchmark no longer measures the *intended construct* (e.g., "ability to solve *novel* problems") rather than it failing to measure "understanding." Granular invalidation (only contaminated items) might become preferable.

  **Conclusion:**

  Your policy presupposes a **process-oriented, competence-based theory of understanding** where evidence derives from outputs causally linked to the application of abstract internal structures, demonstrable through **counterfactual robustness** against surface variations. It explicitly rejects strict dispositionalism by valuing the causal provenance of outputs and implicitly rejects "stochastic parrot" skepticism by treating novel performance as superior evidence. The distinction between verbatim reproduction (evidentially worthless) and structural parallel novel performance (evidentially gold) rests on the assumption that surface alterations force a shift from a retrieval process to a competence application process. The policy is internally coherent except for a tension regarding old public benchmarks, resolved by presupposing that broad exposure leads to competence formation while specific verbatim ingestion leads to mere retrieval. While philosophically underdetermined regarding the precise nature of the internal competence or the sufficiency of surface novelty, the rules consistently operationalize a view where *how* the model produces an answer is paramount evidence for *what* it understands.
