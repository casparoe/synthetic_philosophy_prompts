prompt: |-
  ok so i keep running into simpson's paradox in the wild — not the textbook examples everyone already knows (kidney stones, berkeley admissions, whatever) but messier cases where the "right" way to slice the data isn't obvious and there's no rct to fall back on. and every discussion i read eventually says something like "well you need a causal model" which, sure, but what does that actually commit me to? before i go deep into pearl or rubin or whoever, i want the spec: what would an adequate theory of how to handle simpson's-reversal cases actually have to deliver?

  so write me the desiderata list. what cases must it get right, what distinctions can't it collapse, what formal constraints (from probability, decision theory, whatever) does it have to respect? for each one, give the motivating example or argument — i want to know what breaks if you drop it, not just that it's on the list.

  the thing i'm really after: are there desiderata on this list that can't be jointly satisfied? like, is there a tension between "always give a determinate answer about which level of aggregation is correct" and "don't give wrong answers when you lack causal info"? or between respecting the sure-thing principle and respecting whatever it is that makes the kidney-stone example go the way it does? if some subset is mutually unsatisfiable, that's the result i most want to see spelled out — i half-suspect the list itself is the contribution, not any particular theory that tries to meet it.

  optional: quick scorecard for pearl's scm framework, the potential-outcomes camp, and the "just report all the stratifications and let the reader decide" approach. but the weight should be on the criteria themselves — i can do the scoring once i know what the criteria are, and i'd rather not have the scoring eat up space that should go to motivating why each desideratum actually matters.
reasoning: |-
  Okay, let me start by breaking down the user's query. They're dealing with Simpson's Paradox in real-world scenarios where the textbook examples don't apply. The main issue is that existing discussions point to needing a causal model, but the user wants to know what that actually entails before diving into frameworks like Pearl or Rubin. They're asking for a list of desiderata—what an adequate theory must deliver—and whether there are conflicts between these requirements.

  First, I need to outline the key criteria such a theory should meet. The user mentioned messy cases where the right stratification isn't obvious, so the theory must handle ambiguity without RCTs. They also want to know if some desiderata conflict, like determinism versus respecting causal ignorance. 

  Desideratum 1: **Ambiguity Awareness**. The theory shouldn't force a decision when causal info is absent. For example, in the baseball players case with no knowledge of training regimes, declaring either aggregate or stratified data as correct would be misleading. Omitting this could lead to false conclusions.

  Desideratum 2: **Causal Sensitivity**. The theory must adapt when causal structures are known. Kidney stones are a classic case: smaller stones have higher success rates per treatment, but aggregating reverses the trend. The theory must prioritize strata if the causal path is through the collider (stone size). Missing this would misattribute treatment effects.

  Desideratum 3: **Formal Coherence**. It should align with probability theory, avoiding contradictions. The reversal is mathematically possible (Berkeley admissions), so the theory mustn't dismiss it as an error. Ignoring formal constraints could invalidate the framework.

  Desideratum 4: **Decision Relevance**. The theory should connect to actions. In the company policy example, if gender affects promotion indirectly via department, the correct analysis informs fair policies. Without decision relevance, the analysis might be academically sound but practically useless.

  Desideratum 5: **Stratification Guidance**. When to stratify and when not to. For instance, controlling for mediators (job performance in discrimination cases) can introduce bias. The theory must distinguish between confounders and mediators. Failing here could lead to incorrect stratification choices.

  Now, evaluating conflicts. The tension between **Ambiguity Awareness** and **Stratification Guidance** is key. Ambiguity Awareness requires withholding judgment without causal info, but Stratification Guidance pushes for action based on available data. This creates a dilemma: either risk giving wrong answers or remain indecisive when a decision is needed. 

  Another conflict is between **Formal Coherence** and **Causal Sensitivity**. Probability alone (Formal Coherence) might suggest aggregating, but causal knowledge (Causal Sensitivity) demands stratification. The theory must navigate this without contradiction.

  For the scoring part, Pearl's SCM excels in causal structure but requires upfront knowledge. Potential outcomes need clear interventions. Reporting all stratifications maintains transparency but leaves decision-making to the user, which might not suffice in policy contexts.

  The user's deeper need seems to be understanding the inherent trade-offs in handling Simpson's Paradox, especially when causal knowledge is incomplete. They want a framework that acknowledges these limitations rather than forcing a one-size-fits-all solution. Highlighting the conflicts shows why a perfect theory might not exist, which is probably the "result" they suspect.
answer: |-
  Here’s a rigorous desiderata list for any theory claiming to resolve Simpson-style reversals, grounded in real-world constraints. The key tension lies in **balancing causal truth-seeking with epistemic humility** when knowledge is incomplete. I’ll start with non-negotiable requirements, then expose conflicts.

  ---

  ### **Core Desiderata**  
  *Each motivated by failure modes observed in paradoxes.*

  1.  **Ambiguity Awareness**  
      **What it demands:** The theory *must not* prescribe a unique "correct" aggregation level when causal structure is genuinely unknown or unidentifiable.  
      **Motivating example:** Suppose you observe:  
      - *Aggregate:* Treatment A outperforms B (60% vs. 50% success).  
      - *Stratified by X:* Treatment B outperforms A in every stratum of X (e.g., 70% vs. 65% for X=0; 40% vs. 30% for X=1).  
      If you have *no knowledge* of whether X is a confounder (e.g., disease severity), mediator, or collider, declaring either aggregate or stratified effect as "true" is arbitrary.  
      **Why it matters:** Forces honesty about ignorance. Dropping this leads to *false certitude* (e.g., blindly trusting strata when X is a collider, causing bias).

  2.  **Causal Sensitivity**  
      **What it demands:** When valid causal knowledge exists, the theory *must* prioritize the aggregation level that aligns with the causal estimand (e.g., total vs. direct effect).  
      **Motivating example (Kidney Stones):**  
      - *Causal structure:* Stone size (S) is *caused by* treatment choice (T) and *causes* outcome (O). S is a *mediator*.  
      - *Stratum-specific truth:* Small stones have higher success rates for *both* treatments, but T=A causes more small stones.  
      **Correct answer:** Aggregate effect (A > B) is valid for *total effect* (including mediation). Stratified effect (B > A per stone size) answers "effect if stone size were fixed" (direct effect).  
      **Why it matters:** Ignoring causality collapses distinct questions. Dropping this conflates causation (e.g., mistaking direct for total effect in policy decisions).

  3.  **Formal Coherence**  
      **What it demands:** The theory must respect probability axioms and decision-theoretic consistency (e.g., Savage’s axioms).  
      **Motivating example:** Reversals are mathematically possible under probability laws (Berkeley admissions: department preference causes gender imbalance). A theory claiming reversals "can't happen" or "always indicate bias" violates math.  
      **Why it matters:** Prevents internally inconsistent conclusions. Dropping this allows logical contradictions (e.g., rejecting Simpson reversals as "artifacts").

  4.  **Decision Relevance**  
      **What it demands:** The chosen estimand must align with the *action* being considered (e.g., policy intervention vs. biological mechanism).  
      **Motivating example:** A company with gender promotion disparities:  
      - *Aggregate:* Men promoted more.  
      - *Stratified by department:* Women promoted more in each dept.  
      If departments are *post-treatment* (e.g., employees choose dept. after hiring), aggregate effect may reflect discrimination. If departments are *pre-treatment* (assigned at hire), stratified effect may reveal bias.  
      **Why it matters:** Answers must be *actionable*. Dropping this leads to misaligned recommendations (e.g., "fix" departments when discrimination occurs at hiring).

  5.  **Stratification Guidance**  
      **What it demands:** The theory must specify *when* to stratify (and on what variables) vs. when aggregation is valid, based on causal roles (confounder, mediator, collider).  
      **Motivating example:** In discrimination studies, conditioning on a *mediator* (e.g., job performance) *biases* estimates if the mediator is affected by discrimination.  
      **Why it matters:** Blind stratification worsens bias. Dropping this encourages "stratify on everything" (Berkeley’s mistake: conditioning on department choice masked bias).

  ---

  ### **The Tensions (Where Desiderata Conflict)**  
  **Core Conflict:** Ambiguity Awareness vs. Stratification Guidance.  
  - **Ambiguity Awareness** requires withholding judgment without causal knowledge.  
  - **Stratification Guidance** demands using causal knowledge *if available*.  
  - **Decision Relevance** forces a choice even under uncertainty.  

  **Unresolvable Scenario:**  
  - You observe a reversal.  
  - You *suspect* X is a confounder but lack evidence (e.g., no RCT, no instruments).  
  - A decision *must* be made now (e.g., deploy Treatment A or B?).  

  **Trade-offs:**  
  - If you demand a determinate answer (*always* aggregate or *always* stratify), you violate **Ambiguity Awareness** (risk false certainty).  
  - If you insist "no answer without causal knowledge," you violate **Decision Relevance** (inaction has consequences).  
  - **No theory satisfies all desiderata perfectly here.** You must either:  
    a) **Accept indeterminacy** (report both estimates with caveats), violating "determinate answer" hopes.  
    b) **Impose assumptions** (e.g., "X is likely a confounder"), risking error if wrong.  

  **Sure-Thing Principle vs. Causality:**  
  - Savage’s Sure-Thing Principle (STP) says: If you prefer A over B given X=0 and given X=1, you should prefer A unconditionally.  
  - Simpson reversals *violate* STP (e.g., prefer B in each stratum but A overall).  
  - **Resolution:** STP assumes acts are independent of states. In causal settings, *treatment affects stratification* (e.g., treatment influences stone size). **Causal Sensitivity overrides STP** when variables are causally downstream.

  ---

  ### **Quick Framework Scorecard**  
  *(Against the Desiderata)*  

  | **Approach**               | **Ambiguity Awareness** | **Causal Sensitivity** | **Formal Coherence** | **Decision Relevance** | **Stratification Guidance** |
  |----------------------------|-------------------------|------------------------|----------------------|------------------------|----------------------------|
  | **Pearl (SCMs)**           | ★★☆ (Requires DAG upfront; silent if DAG unknown) | ★★★ (Explicit path analysis) | ★★★ (Embedded in probability) | ★★☆ (Estimands tied to interventions) | ★★★ (d-separation rules) |
  | **Potential Outcomes**     | ★☆☆ (Assumes SUTVA; often hides ambiguity) | ★★☆ (Requires well-defined intervention) | ★★★ (Mathematically rigorous) | ★★★ (Estimands = causal effects) | ★★☆ (Requires no unmeasured confounding) |
  | **"Report All Strata"**    | ★★★ (Highlights ambiguity) | ★☆☆ (No causal input) | ★★★ (Raw data) | ★☆☆ (Burden on user) | ★☆☆ (No guidance) |

  **Key Takeaways:**  
  - **Pearl** excels when a causal DAG is known/assumed but falters under ignorance (violates **Ambiguity Awareness** if forced to choose).  
  - **Potential Outcomes** demands precise intervention definitions; struggles with mediator/collider guidance unless combined with DAGs.  
  - **"Report All"** satisfies **Ambiguity Awareness** but fails **Decision Relevance** and **Stratification Guidance** – it dumps complexity on the user.  

  **The Iron Law:** No framework resolves the tension between *needing to act* and *lacking causal knowledge*. The desiderata force a triage:  
  1. **If causal structure is known:** Use it (Pearl/Rubin win).  
  2. **If unknown but urgent:** Report reversal explicitly, state assumptions, and admit risk.  
  3. **Otherwise:** Refuse to give a single answer.  

  The paradox persists because reality often lives in the gap between (1) and (2). The contribution *is* the list: it maps the minefield.
