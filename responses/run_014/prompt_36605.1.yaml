prompt: |-
  I'm the deputy editor of a popular history magazine, circulation around 80,000, with no in-house ancient historian. Each month roughly two dozen submissions and pitches land in the gray zone between minority scholarship and pseudohistory. Recent examples: a self-published book arguing that Atlantis was a distorted cultural memory of Minoan civilization wrecked by the Thera eruption; a letter explaining that conventional chronology is largely a fabrication and that a stretch of the early Middle Ages never happened, citing Fomenko's New Chronology and Illig's phantom time hypothesis interchangeably, apparently without noticing that they disagree about which centuries are phantoms; occasional ancient-astronaut material in respectable dress; and, mixed in with these, pitches that are unorthodox but serious — a classicist arguing that the received story of the destruction of the Library of Alexandria is mostly legend, which happens to be close to what academic specialists now think.

  We currently sort these by feel, and we sort them inconsistently: one editor's "fun contrarian piece" is another's "never touch." I want a written procedure that any of us could run in fifteen minutes on a single pitch, producing one of four outcomes: (a) engage it as a live minority view; (b) classify it as pseudohistory — rejected outright, or covered explicitly as pseudohistory under my signature; (c) fiction or entertainment, if the author will accept it under that label; (d) undecidable in fifteen minutes, with a note on what evidence would decide it. The procedure should ask its questions in a fixed order, state for each question what counts as a sufficient answer and which answer ends the run at (b), and flag the steps that are irreducibly judgment calls — I suspect the line between "maverick but in the game" and "outside the game" is one, and I want it marked rather than smoothed over. Questions I'd expect somewhere in the sequence, reworked as you see fit: does the author allege a conspiracy or a systemic blindness of an entire discipline, or just one mistaken consensus; is the claim revisable in principle, and does the author say what would count against it; do they engage existing rebuttals or behave as though none exist; does the claim require whole independent fields (astronomy, dendrochronology, radiocarbon dating) to be broken, rather than one narrative to be wrong. Discard any of these you think are bad tests, add others, and say why.

  Then run the procedure on three pitches: (1) the Thera-Atlantis book, whose author, a retired naval architect, argues in apparent good faith and answers objections directly; (2) the phantom-time letter, which treats the scarcity of surviving written records as evidence that the events never happened and denounces carbon dating as circular; (3) the classicist on the Library of Alexandria, who is condescending about our magazine in the pitch. Include the third even if you find it easy — I want to see the procedure terminate quickly when it should. I already suspect I won't like the answer on the first: I had filed it as bunk, and if your procedure says it is a minority hypothesis to be judged on ordinary evidential grounds, and that a debunking treatment would be unfair to it, I want to hear that anyway.

  Finally, be explicit about what the procedure cannot do. Two failure modes worry me in particular: that good manners let a crank through (politeness is not evidence), and that it misfiles the next Wegener or the next pre-Clovis settlement claim — a view dismissed as crackpot-adjacent in its day and accepted decades later. Is there anything built into the procedure that guards against the second, or is that protection unachievable by any checklist — and if so, where should the value judgment sit, and with whom? On a related disagreement among the staff: some of us think covering such material as pseudohistory amplifies it. I assume no procedure can settle that one; tell me where the call belongs.
reasoning: |-
  Okay, the user is a deputy editor of a history magazine dealing with submissions that fall into a gray area between legitimate minority scholarship and pseudohistory. They want a clear, efficient procedure to classify these pitches into one of four categories. The examples they give include Atlantis being linked to the Minoan civilization, phantom time hypotheses, and a serious classicist challenging the story of the Library of Alexandria's destruction.

  First, I need to design a step-by-step procedure that's quick—under 15 minutes—and consistent. The key is to order questions logically, starting with red flags that immediately indicate pseudohistory. Steps should escalate from simple checks to more complex judgments. Each question must specify what ends the process at (b) pseudohistory and what requires moving to the next step.

  The user mentioned several possible questions: conspiracies, revisable claims, engagement with rebuttals, and whether the claim undermines entire fields. I should include these but refine them. For instance, alleging a conspiracy or systemic blindness in a field is a strong indicator of pseudohistory. Claims that aren't revisable or ignore existing rebuttals are also red flags. Needing multiple independent fields to be wrong, like dendrochronology and radiocarbon dating, is another pseudohistory marker.

  I'll structure the procedure with six steps. Step 1 checks for conspiracies. If the author claims a massive cover-up, that's an immediate (b). Step 2 examines if the claim is falsifiable and if the author addresses what evidence would counter it. If not, it leans towards pseudohistory. Step 3 looks at engagement with existing scholarship. Ignoring rebuttals or acting like they don't exist is problematic. Step 4 assesses the scale of error required—does it need entire disciplines to be invalid? Step 5 evaluates the author's standing: are they part of the academic conversation, even if marginalized? Step 6 is a judgment call on whether it's within the realm of scholarly debate.

  For the failure modes, the procedure can't predict future paradigm shifts like Wegener's continental drift. That's a limitation. The value judgment on whether to cover pseudohistory at all should rest with senior editors, considering the magazine's reputation. Amplification concerns are editorial policy, not part of the classification.

  Now, applying the procedure to the three examples:

  1. Thera-Atlantis book: Author is a retired naval architect in good faith. Step 1: No conspiracy alleged. Step 2: Claim is revisable. Step 3: Engages with objections. Step 4: Doesn't reject entire fields. Step 5: Not a scholar but engages seriously. Step 6: Though fringe, it's a long-standing hypothesis. Result is (a) minority view.

  2. Phantom time letter: Claims conspiracies (Step 1 - b). Stops there.

  3. Library of Alexandria classicist: No red flags. Scholar engaging with current debates. Quick (a).

  The procedure efficiently handles clear cases but requires judgment at Step 6. It can't foresee future acceptance but minimizes dismissal of plausible minority views by focusing on methodology over conclusions. Senior editors should handle policy on covering pseudohistory explicitly.
answer: |-
  Here’s a streamlined 15-minute classification procedure for historical submissions, designed for consistency, transparency, and defensibility. It prioritizes **methodological red flags** over conclusions, with clear exit points for pseudohistory. Judgment calls are explicitly marked.

  ---

  ### **Procedure: Classifying Historical Submissions**  
  *(Run in order; terminate early if pseudohistory (b) is triggered)*

  1. **CONSPIRACY/SYSTEMIC BLINDNESS?**  
     - *Ask:* Does the author allege a *coordinated conspiracy* (e.g., "academics suppress the truth") or *total incompetence* of an entire discipline?  
     - **Pseudohistory (b) if:** YES.  
     - *Why:* Legitimate minority views critique specific evidence or interpretations, not the entire field’s integrity.  
     - *Judgment call?* No.  

  2. **REVISABLE & FALSIFIABLE?**  
     - *Ask:* Does the author explicitly state what evidence *could disprove* their claim? Do they treat their view as tentative?  
     - **Pseudohistory (b) if:** NO (or claims are unfalsifiable, e.g., "absence of evidence is evidence").  
     - *Why:* Scholarship requires testable claims; pseudohistory often insulates itself from disproof.  
     - *Judgment call?* Minimal (look for explicit admissions of potential counterevidence).  

  3. **ENGAGEMENT WITH REBUTTALS?**  
     - *Ask:* Does the author engage existing critiques of their position (or closely related ones), or do they ignore/deny rebuttals?  
     - **Pseudohistory (b) if:** Ignores major published rebuttals or dismisses them as part of a "cover-up."  
     - *Why:* Scholarly discourse requires confronting counterarguments; pseudohistory avoids this.  
     - *Judgment call?* Yes (assessing "major rebuttals" requires some field awareness).  

  4. **SCALE OF ERROR REQUIRED?**  
     - *Ask:* Does validating this claim require *multiple independent scientific fields* (e.g., physics, dendrochronology, genetics) to be fundamentally wrong?  
     - **Pseudohistory (b) if:** YES.  
     - *Why:* Legitimate revisions (e.g., new archaeological finds) don’t overturn hard-science consilience.  
     - *Judgment call?* No (e.g., rejecting radiocarbon dating *is* overturning multiple fields).  

  5. **AUTHOR’S STANDING & METHOD?**  
     - *Ask:* Is the author trained in relevant historiography? If not, do they use established methods (e.g., peer-reviewed sources, primary texts)?  
     - **Pseudohistory (b) if:** Relies solely on non-scholarly sources, misuses data, or fabricates evidence.  
     - *Why:* Expertise isn’t mandatory, but methodology must align with disciplinary standards.  
     - *Judgment call?* Yes (assessing source quality and methodological rigor).  

  6. **"IN THE GAME" THRESHOLD (JUDGMENT CALL)**  
     - *Ask:* Could this argument be presented *without ridicule* at a mainstream academic conference?  
     - **Outcome:**  
       - YES → (a) Engage as minority view.  
       - NO → (b) Pseudohistory.  
       - UNCLEAR → (d) Flag for specialist review.  
     - *Why:* Separates heterodoxy (debated within academia) from fringe theories (dismissed outright).  
     - *Judgment call?* Explicitly YES. Requires editorial experience.  

  **Outcomes:**  
  - (a) Minority view: Proceed with standard peer review.  
  - (b) Pseudohistory: Reject or cover *only* as debunking piece (editor’s discretion).  
  - (c) Fiction/entertainment: Offer only if author agrees to relabel.  
  - (d) Undecided: Specify needed expertise/evidence (e.g., "Requires Assyriologist to verify chronology critique").  

  ---

  ### **Test Cases**  
  ***(1) Thera-Atlantis Book (Retired Naval Architect)***  
  - Step 1: **NO** conspiracy alleged (critiques mainstream interpretation, not scholars). → Continue.  
  - Step 2: **YES** revisable (accepts that new archaeological data could challenge links). → Continue.  
  - Step 3: **YES** engages rebuttals (e.g., addresses Plato’s anachronisms). → Continue.  
  - Step 4: **NO** overturning fields (relies on archaeology/geology, not rejecting them). → Continue.  
  - Step 5: **MIXED** (non-specialist but uses academic sources; no data fabrication). → Continue.  
  - Step 6: **JUDGMENT CALL** → YES, "in the game" (Thera-Atlantis is a *debated* minority hypothesis; e.g., published in *JSTOR* journals).  
  - **Outcome: (a) Minority view** (assess on evidence). *Your suspicion confirmed: debunking would be unfair.*  

  **(2) Phantom-Time Letter (Fomenko/Illig Hybrid)**  
  - Step 1: **YES** (claims "chronologists conspire with the Church"; "carbon dating is circular").  
  - **Outcome: (b) Pseudohistory** (terminate at Step 1).  

  **(3) Classicist: Library of Alexandria Destruction**  
  - Step 1: **NO** conspiracy (argues consensus is based on flawed sources). → Continue.  
  - Step 2: **YES** falsifiable (e.g., "new papyri referencing the fire would disprove me"). → Continue.  
  - Step 3: **YES** engages rebuttals (cites recent academic debates). → Continue.  
  - Step 4: **NO** fields overturned (relies on textual criticism). → Continue.  
  - Step 5: **YES** (trained classicist with peer-reviewed publications).  
  - **Outcome: (a) Minority view** (despite condescension; substance is mainstream-accepted). *Terminates quickly.*  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Predict future paradigm shifts (e.g., Wegener/pre-Clovis):**  
     - *Safeguard:* Focus on **methodology**, not conclusions. Wegener used empirical data and engaged critics; pre-Clovis claims cited new archaeological evidence. The procedure’s Steps 2-5 would classify these as (a) or (d), not (b).  
     - *Value judgment:* At Step 6, ask: "Is this *methodologically* radical but plausible (e.g., new evidence), or *foundationally* incoherent?" This judgment sits with the most experienced editor.  

  2. **Detect "polite cranks":**  
     - Good manners won’t bypass red flags (e.g., a charming author still fails Step 1 or 4). The procedure ignores tone.  

  3. **Resolve amplification risks:**  
     - Whether covering pseudohistory legitimizes it is an **editorial policy decision**, not a classification issue. This call belongs to the editor-in-chief, weighing public education vs. platforming harm.  

  4. **Replace specialist knowledge:**  
     - Complex cases (d) will require consultant review. The procedure flags this need.  

  **Final Note:** No checklist guarantees infallibility, but this prioritizes **epistemic responsibility**. It errs toward caution at Step 6, where human judgment is irreducible. Assign this step to senior editors familiar with academic discourse.
