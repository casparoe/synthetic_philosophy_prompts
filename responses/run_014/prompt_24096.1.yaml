answer: |-
  Here are five numbered points addressing your objection:

  1.  Luck egalitarianism *aims* to distinguish between disadvantages caused by unchosen "brute luck" (genetics, initial social circumstances) and those resulting from "option luck" (risky choices made voluntarily).
  2.  Your objection correctly identifies that voluntary choices themselves are influenced by brute luck factors (upbringing, genetics, environment), making the distinction potentially blurry or porous.
  3.  This blurriness creates a slippery slope: if *all* choices are ultimately shaped by brute luck, then attributing *any* outcome solely to "option luck" and denying compensation becomes difficult or impossible.
  4.  Consequently, the theory risks collapsing into either universal compensation (effectively equality of outcome) or arbitrary denial of compensation by ignoring the brute luck shaping choices.
  5.  While some luck egalitarians refine the theory (e.g., emphasizing "authentic choice" or setting a baseline), your core challenge highlights a fundamental and persistent difficulty in cleanly separating brute luck from voluntary responsibility.
