prompt: |-
  I'm writing the take-home final for my upper-level Nietzsche seminar and I want one essay question on the eternal recurrence, but I've graded the "is it a cosmology or an existential test?" essay about fifty times now and I genuinely cant do it again. So I want to hand them two mangled versions of the demon from GS 341 and make them work out which feature of the original is doing the real work. Version one: the demon says you will live this exact life over again, once, and then that's it, oblivion, nothing after. Version two: the demon says you will live this life over and over forever, but each time around one of the things you most regret goes differently, until eventually you're living the life you would have chosen for yourself. For each version I want them to say whether the affirmation test still bites, and what their answer shows about the original — specifically, whether it's the exactness, the endlessness, or the wholeness of the life that's carrying the weight, and what each of the other two is doing if not that. I also want them to say something about why this news gets delivered in your loneliest loneliness, and why it's a demon bringing it rather than a god or a physicist. It's a 90-minute in-class essay, 20 marks. Please give me the question itself, a model answer of around 650 words, and a marking scheme that names the moves an A answer has to make and the specific moves that should cap it at a B — what I keep getting is a competent summary of the standard reading with "amor fati" stapled on at the end like a bow. Last line should be one sentence beginning "Crux:" giving the single thing the question is really testing.
