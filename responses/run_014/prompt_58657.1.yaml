  ### Two Candidate Principles
  The tutor's prior positions suggest a non-bivalent approach to future contingents, where truth depends on settledness or determinism. Two principles that fit the prior positions but diverge on the sailor case are:

  1. **Principle of Settled Truth (PST)**:  
     A future-directed claim is true at the time of utterance if and only if the event is causally settled (determined) by the state of the world at that time. If unsettled, the claim lacks truth value.

  2. **Principle of Actualized Truth (PAT)**:  
     A future-directed claim is true at the time of utterance if it corresponds to the actual outcome, even if the event was unsettled at the time. Truth is retroactively assigned based on actual occurrence.

  ### Application to the Sailor Case
  - **Sailor's utterance yesterday**: "There will be a sea battle today."  
  - **Outcome**: A sea battle occurs today.  
