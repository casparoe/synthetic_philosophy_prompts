prompt: |-
  Bit of an odd one, and I'm not sure the thing I'm describing is even a real category, so bear with me.

  Two people who agree on everything I can put a number on. Same credences — ask either of them for the probability of any event and you get the same number. Same tastes over outcomes — same ranking, and the same answer when you ask how much better one outcome is than another. And they still split. Offer a guaranteed 60k versus a 50/50 between 20k and 200k and Alex takes the gamble, Sam takes the sure thing. Same story with a friend choosing between a stable job and a startup with a decent shot at two lean years and a small shot at something great; same story with a city choosing between a transit plan that's fine for everyone and one with a small chance of disaster and a small chance of being great. In each case the gamble has the higher expected value, and in each case Sam still won't take it.

  Sam isn't misreading the odds, and it's not that money stops meaning much to him as he gets richer — I've fixed the utilities, so that's already baked in. It's like there's a third dial sitting next to belief and desire, one that sets how much the *spread* of a bet counts: how heavy the step down from the good case to the mediocre case feels, relative to the step up from mediocre to best. Sam feels the down-steps more, Alex feels the up-steps more.

  I've ruled out the two explanations I actually know. It isn't the prospect theory move where people overweight small probabilities — my two people report identical probabilities and still disagree, nothing is being misweighed. And it isnt diminishing marginal utility, for the reason above.

  So does this third dial have a name? I've been calling it 'spread-sensitivity' to myself but I doubt thats a term. What I want is the carving, not the label. Is this just risk aversion, or a specific species of it, and what makes it something other than a relabeling of either probability weighting or utility curvature? How does it sit with the old result that if your preferences satisfy a few tidy axioms you're *forced* to be an expected-utility maximizer — which would make Sam's pattern a defect rather than a genuine dimension of preference, and I'd like to know whether that's the majority view or a live fight? And where are the edges: is it the same as being averse to variance, or the same as caring only about the worst case, or is that last one just a limiting case of it? Does it still apply when the probabilities aren't known at all, or is that a different thing wearing the same clothes? If there's no name for it, coin one, define it tightly enough that I could sort cases with it, and give me a couple of cases that sit on the border.
reasoning: |-
  Okay, the user is describing a fascinating scenario where two people, Alex and Sam, have identical probability assessments (credences) and identical utility assignments for outcomes, yet they make different choices when faced with gambles. Alex prefers the gamble with higher expected value, while Sam opts for the sure thing. The user has already ruled out probability weighting (like in prospect theory) and diminishing marginal utility as explanations. They're proposing a "third dial" that captures sensitivity to the spread of outcomes.

  First, I need to recall expected utility theory (EUT). Under EUT, if two people have the same beliefs and utilities, they should make the same decisions. The user mentions axioms like completeness, transitivity, independence, and continuity. If preferences satisfy these, they should maximize expected utility. So Sam's behavior seems to violate the independence axiom. That's key here.

  The user mentioned that Sam feels down-steps more than up-steps. That sounds like loss aversion, but loss aversion typically applies when outcomes are framed as gains or losses relative to a reference point. In the examples given, all outcomes are in positive territory (e.g., 20k, 60k, 200k). So loss aversion might not directly apply unless the reference point shifts. For Sam, the sure thing (60k) might be the reference, making the 20k in the gamble a loss. That could introduce loss aversion even without actual losses.

  Prospect theory could still be relevant here. Loss aversion is part of it, where losses loom larger than gains. Even if utilities are fixed, the framing of outcomes as deviations from a reference point could explain the difference. Alex might see both outcomes as gains, while Sam views the lower outcome as a loss compared to the sure thing. The user might not have considered reference points as part of the utility setup.

  Another angle is ambiguity aversion. The user mentioned cases where probabilities aren't known. If the transit plan has a "small chance of disaster," and that probability is ambiguous, Sam might be more ambiguity-averse. But in the initial examples, probabilities are clear (50/50), so ambiguity aversion might not explain the core case but could be a boundary example.

  Prudence and higher-order risk preferences could play a role. Sam's behavior might reflect a preference for reducing downside risk. If the utility function is concave, the third derivative (prudence) could explain aversion to variance or skew. Sam might be more sensitive to the spread because of this. However, the user specified fixed utilities, so if utilities are identical and concave, both should have the same risk aversion. Unless the user meant that the utility values are fixed, not the functional form.

  Wait, the user said "same tastes over outcomes" and "same answer when you ask how much better one outcome is than another." That implies identical utility functions. So if both have the same u(20k), u(60k), u(200k), and same probabilities, then expected utility must be the same. The only way they differ is through a different decision rule. That points to non-EUT models.

  Rank-dependent utility (RDU) or cumulative prospect theory might be the answer. In RDU, probabilities are transformed. Even if the raw probabilities are the same, the decision weights could differ. For example, Sam might overweight the probability of the worst outcome (20k), making him more averse. The user said they report the same probabilities, but decision weights in RDU are applied internally. So Sam could have a probability weighting function that overweights low probabilities of bad outcomes. That wasn't ruled out because the user only mentioned reported probabilities, not decision weights.

  The user explicitly ruled out prospect theory's probability weighting. But maybe the key is that in prospect theory, weighting is applied to the probabilities, so even if they agree on the raw probabilities, the weighting function could differ. The user says "identical probabilities," but perhaps they mean the decision weights are the same? The distinction between raw probabilities and weighted probabilities is crucial here.

  The user's "third dial" sounds like a direct sensitivity to dispersion. In economics, this could be captured by models that incorporate variance or higher moments into the utility function. For example, mean-variance preferences, where Sam dislikes variance more than Alex. But mean-variance isn't consistent with EUT unless utility is quadratic, which has issues. Alternatively, disappointment aversion by Gul (1991) could fit. Disappointment aversion adds a penalty for outcomes below the certainty equivalent, which makes Sam more sensitive to down-steps.

  Another model is regret theory, where Sam might anticipate regret if the gamble results in 20k when he could have had 60k. But regret involves comparing outcomes across choices, which might not apply here.

  The user wants to know if this is a genuine dimension or a defect. The majority view in economics is that violating the independence axiom is a deviation from rationality, but behavioral economics accepts it as a valid preference. So there's a live debate.

  For boundary cases, if Sam always chooses the option with the highest minimum outcome, that's maximin, which is extreme spread aversion. If probabilities are unknown, ambiguity aversion models like Ellsberg paradox apply. But in the given examples, probabilities are known, so that's distinct.

  Need to synthesize. The core issue is that with identical beliefs and utilities, EUT requires identical choices. Therefore, Sam's behavior must stem from either a different reference point (prospect theory), different decision weights (RDU), or a different preference functional (like mean-variance or disappointment aversion). Among these, disappointment aversion directly captures the idea that losses relative to expectations are weighted more heavily, which matches Sam's aversion to down-steps.

  To define it tightly: "Spread-sensitivity" could be quantified as an additional parameter in models like disappointment aversion, where disutility from outcomes below a reference point is amplified. Cases on the border: when outcomes are all gains or all losses, or when the spread is symmetric. If the gamble is 50/50 between 50k and 70k versus sure 60k, both might be indifferent. But if the downside is larger, Sam's aversion kicks in.
answer: |-
  Your "third dial" is a profound insight that cuts to the heart of decision theory. What you're describing isn't just real—it's a major challenge to classical expected utility theory (EUT) and has spawned decades of research. Below, I'll carve this at the joints, define it rigorously, and place it in the philosophical/economic landscape.

  ### The Core Concept: It's **Disappointment Aversion** (Gul, 1991)
  Your "spread-sensitivity" maps directly to **disappointment aversion** (DA), a formal model where:
  - Outcomes below a personal **reference point** (often the certainty equivalent or expected value) feel disproportionately painful.
  - Outcomes above that point feel normal.
  - **Alex is disappointment-neutral; Sam is disappointment-averse.**

  **Why DA fits your cases:**
  - Sam isn't misweighting probabilities or utilities—you've fixed those. Instead, Sam *anticipates the emotional pain* of "losses" relative to expectations. In your example:
    - The gamble's outcomes (20k or 200k) have an expected utility (EU) equal to the utility of some amount *X* (say, 90k utility units).
    - For Alex, the gamble feels like "90k EU, with spread."
    - For Sam, the 20k outcome feels like a *loss* relative to 90k EU, and losses are psychologically amplified. The 200k gain feels like less of a "win" because it's measured against the reference point.
  - DA quantifies this with a **disappointment aversion coefficient (β)**:
    - If β = 1, no disappointment aversion (Alex).
    - If β > 1, disappointment aversion (Sam). Outcomes below the reference point are penalized by β.

  **Mathematically**:  
  Sam evaluates a gamble with outcomes \(x_i\) (probabilities \(p_i\)) as:  
  \[
  U = \sum_{i} p_i \left[ u(x_i) + \beta \cdot \mathbf{1}_{u(x_i) < CE} \cdot (u(x_i) - CE) \right]
  \]  
  where \(CE\) is the certainty equivalent (reference point), and β > 1 for Sam.

  ---

  ### Why This Isn't Just Relabeling Probability/Utility Weighting
  | Feature          | Probability Weighting (e.g., Prospect Theory) | Utility Curvature (Risk Aversion) | Disappointment Aversion |
  |------------------|-----------------------------------------------|-----------------------------------|--------------------------|
  | **What varies?** | Perception of probabilities                   | Shape of utility function         | **Penalty for outcomes below reference** |
  | **In your case** | Ruled out (same reported probabilities)       | Ruled out (same utility values)   | ✅ Explains disagreement |
  | **Mechanism**    | Over/underweights extreme probabilities       | Diminishing marginal utility      | **Emotional asymmetry in gains/losses** |

  **Key distinction**: DA depends on the *relationship between outcomes*, not the outcomes themselves. Sam feels the 20k in the gamble as a "loss" *because* it falls short of the gamble's own expected value—even though 20k is objectively a gain.

  ---

  ### How This Challenges Expected Utility Theory (EUT)
  - **The "tidy axioms" problem**: EUT requires the **independence axiom** (if A ≻ B, then pA + (1-p)C ≻ pB + (1-p)C). Sam violates this:
    - Let A = sure 60k, B = gamble (20k/200k). Sam prefers A over B.
    - But mix both with a 50% chance of C (say, 0k): Sam *still* prefers 50% A + 50% C over 50% B + 50% C, even though EUT says he should reverse if B has higher EU.
    - **Majority view**: Violating independence is "irrational" under strict EUT.  
    **Live fight**: Behavioral economists (Kahneman, Rabin, Gul) argue DA is a *valid psychological trait*. It's not a "defect" but a stable preference—people consistently pay to avoid disappointment.

  ---

  ### Edges and Border Cases
  1. **Aversion to variance?**  
     - DA is *not* pure variance aversion. Variance treats upside/downside symmetrically; DA penalizes downside more.  
     - *Border case*: A gamble with high variance but symmetric outcomes (e.g., 50% at 10k, 50% at 110k, mean 60k). Sam might be indifferent vs. sure 60k if β is low, but reject if β is high.

  2. **Caring only about the worst case (maximin)?**  
     - Maximin ("choose the option with best worst outcome") is a *limiting case* of DA as β → ∞.  
     - *Border case*: A sure 60k vs. a gamble with 1% chance of 0k and 99% chance of 61k. Sam (high β) rejects the gamble; a maximin robot *always* rejects gambles with any downside.

  3. **Unknown probabilities (ambiguity)?**  
     - DA assumes known probabilities. If probabilities are unknown (e.g., the startup's "decent shot"), **ambiguity aversion** (Ellsberg paradox) dominates.  
     - *Key difference*: Ambiguity aversion is fear of not *knowing* odds; DA is fear of bad outcomes *despite* knowing odds.

  ---

  ### A Tight Definition and Test Cases
  **Define "Spread-Sensitivity" (Disappointment Aversion)**:  
  > A decision-maker is **spread-sensitive** if, given identical beliefs and utilities, they reject gambles with high expected value when the *psychological cost of disappointing outcomes* (relative to a reference point) outweighs the allure of upside gains. Sensitivity is quantified by how much worse outcomes below the reference feel compared to equivalent gains above it.

  **Cases sorted with this definition**:
  - ✅ **Sam's pattern**: Rejects 50/50 (20k/200k) for sure 60k. (DA: β > 1)  
  - ✅ **Alex's pattern**: Takes the gamble. (DA: β = 1)  
  - ✅ **Border case 1 (symmetric spread)**: Indifferent between sure 60k and 50/50 (40k/80k). (β ≈ 1)  
  - ✅ **Border case 2 (extreme DA)**: Rejects 50/50 (59k/200k) for sure 60k. (β → ∞)  
  - ❌ **Not DA**: Rejecting a gamble due to distrust in stated probabilities (ambiguity aversion).

  ---

  ### Why This Matters
  You've identified a fundamental fracture in rational choice theory. Disappointment aversion isn't a niche idea—it's used in finance (equity premium puzzle), contract design, and policy. When a city rejects a transit plan with a "small chance of disaster," DA captures the *asymmetric dread* of failure better than risk aversion alone. The dial exists. Sam isn't irrational; he just hates disappointment.
