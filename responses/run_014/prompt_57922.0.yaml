answer: |-
  Right, let's break this down properly, keeping it clear and in British English. That revision blog you mentioned gets the basic *outlines* right but likely oversimplifies the key debate and the intellectualist position, especially regarding your manual example (and your gran's jollof!). The "learning to swim from a manual alone" bit is exactly where things get sticky and where your gut feeling is spot on.

  **Where the Blog is Probably Correct:**

  1.  **Basic Distinction:** It rightly identifies the core difference: "Knowing that" (propositional knowledge) is factual knowledge you can state or write down (e.g., "I know *that* water boils at 100°C at sea level"). "Knowing how" (procedural knowledge) is about abilities and skills (e.g., "I know *how* to boil an egg").
  2.  **Ryle's Core Argument:** It correctly states Gilbert Ryle's main contention: He argued against the "intellectualist legend," which tried to reduce all knowledge to "knowing that." Ryle insisted "knowing how" is fundamentally different and *logically prior* to much "knowing that." You can't understand the instructions (knowing that) without already having some grasp of the concepts involved (which comes from knowing how).
  3.  **Intellectualist Stance:** It accurately presents the *starting point* of modern intellectualists (like Jason Stanley and Timothy Williamson): They argue that "knowing how to φ" (e.g., ride a bike) *is* a specific kind of "knowing that" – namely, knowing *that* a particular way/method/action is a way for *you* to φ. (e.g., "I know *that* wiggling the handlebars like *this* is a way for me to stay upright on a bike").

  **Where the Blog Likely Messes Up / Oversimplifies (Especially Regarding the Manual):**

  1.  **Overstating Intellectualism's Claim on Ability:** The biggest error is implying that intellectualists think reading a manual *alone*, without *any* practice, *gives you the ability*. This is rarely, if ever, what serious intellectualists claim. They argue it gives you the *knowledge* (the "knowing that" which constitutes the "knowing how"). **Crucially, they often separate *having the knowledge* from *being able to reliably execute the skill*.** They might say:
      *   *"After reading the manual carefully, you now* **know how** *to swim (because you possess the relevant propositional knowledge about methods). However, you lack the physical strength, coordination, muscle memory, and confidence* **to actually swim successfully** *yet. You need practice to* **manifest** *that knowledge in action."*
      *   Ryle would find this distinction utterly bizarre. For him, if you can't *do* it, you don't *know how* to do it. "Knowing how" *just is* the ability. The intellectualist move here feels like splitting hairs to rescue the reduction of "how" to "that".
  2.  **Downplaying Ryle's Anti-Intellectualism:** The blog might underplay Ryle's powerful argument that *understanding* the propositions in a manual *itself* relies on prior "know-how" (e.g., knowing how to read English, knowing how to interpret diagrams, knowing how to connect instructions to actions). The manual isn't magic; its meaning depends on skills you already possess.
  3.  **The Nuance of "A Way":** Intellectualists emphasise "knowing *that w is a way* for one to φ". This often involves *practical modes of presentation* – the knowledge isn't always easily stateable in words. It might be tied to sensory or motor representations.

  **Applying this to Gran vs. TikTok (You):**

  *   **Gran:**
      *   **Ryle's View:** Gran is the *paradigm* of "knowing how". Her ability manifests in her consistent, successful actions. She doesn't need to state propositions; her skill *is* her knowledge. She might adjust heat, timing, ingredients instinctively based on sight, smell, texture – pure practical intelligence. She knows how *because* she can do it.
      *   **Intellectualist View:** Intellectualists *must* say Gran also possesses "knowing that". They'd argue she knows *that* certain actions (stirring like this, adding that now) are ways for *her* to make perfect jollof. This knowledge is embodied and practical, perhaps not easily articulated in words or even consciously accessible, but it's still a form of propositional knowledge *about methods*. They'd say she knows how *because* she possesses this (tacit) propositional knowledge.
  *   **You (with TikTok Recipe):**
      *   **Ryle's View:** You possess "knowing that" – you can state the recipe facts, the steps, the timings. But you lack the "knowing how". Reciting facts isn't the same as possessing the skill. You haven't developed the practical judgment, timing sense, or tactile feel needed to execute the recipe successfully. Therefore, on Ryle's view, you *do not* know how to cook jollof, despite knowing all the facts *about* how to do it. The burning pot proves it!
      *   **Intellectualist View:** Intellectualists would likely say you possess *some* "knowing that" (the explicit recipe steps), but crucially, you *lack* the deeper, practical propositional knowledge *about how those steps constitute a reliable method for YOU to succeed*. You might know the words, but you don't grasp the practical mode of presentation – you don't *know that* "adding the tomatoes *like this* (with this timing, this heat)" is a way for *you* to avoid burning it. You possess *theoretical* knowledge *about* jollof, but not the *practical* knowledge *of how* to make it. Therefore, on the intellectualist view too, you do not genuinely "know how" yet. You need practice to acquire that specific practical propositional knowledge.

  **Why the Manual Example (Learning to Swim) Sounds "Off":**

  It sounds off because it highlights the core disagreement. Ryle would say: If you've never been in the water, no amount of reading gives you the *ability* to swim. Reading might give you *instructions*, but understanding and acting on those instructions requires the very skill (know-how) you're trying to acquire. The manual alone is useless for *acquiring the ability*.

  Intellectualists would say: Reading the manual *could* give you the *knowledge* that constitutes knowing-how (you now know *that* specific movements are ways to swim). However, they'd (usually) concede you absolutely need practice to *execute* that knowledge successfully – to build strength, coordination, and overcome fear. The "off" feeling comes from the intellectualist separation of the *knowledge state* ("knowing how") from the *reliable performance*. For most people, "knowing how" *means* being able to do it, so saying someone "knows how" but can't actually do it feels like a cheat.

  **In Simple Terms:**

  *   The blog's basic definitions are likely okay.
  *   It probably oversimplifies by making intellectualists sound like they think reading a manual magically gives you the physical ability without practice. They don't (usually) claim that. They claim it gives you the *knowledge*, but you still need practice to *use* it effectively.
  *   **Gran:** Embodies true "knowing how" (Ryle) or possesses deep, practical "knowing that" about methods (Intellectualists). *She can do it.*
  *   **You (with TikTok):** Have "knowing that" facts (Ryle & Intellectualists agree), but lack the practical skill/knowledge (Ryle: you lack knowing how; Intellectualists: you lack the relevant practical propositional knowledge). *You can't reliably do it yet.*
  *   **The Manual:** Learning *just* from a manual sounds off because both views, deep down, recognise physical skills require physical engagement. Ryle thinks the manual alone is useless for acquiring the ability. Intellectualists think it gives you the knowledge *in principle* but admit you need practice to *realise* it – the gap between their definition of "knowing how" and actual ability is what feels jarring.

  Keep revising – you're asking the right questions by challenging that manual example! That's the heart of the debate. Good luck with epistemology!
