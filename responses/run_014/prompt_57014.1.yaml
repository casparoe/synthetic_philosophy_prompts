  ## Collapse
  The fidelity-weighted view risks collapsing into a reductionist account of personal identity combined with standard theories of social influence and memory. If personal identity is already understood as constituted by social relations and narrative, then post-mortem persistence in others' minds adds nothing new—it's merely the continuation of those relations in memory. The view must show that pattern-instantiation is more than causal-narrative influence: that it constitutes the self's literal persistence. Without a robust mereology of patterns (where a pattern in B's brain is part of A's self), the view reduces to a vivid metaphor for social interconnectedness. The defender might insist on the metaphysical reality of patterns, but this invites the conceptual problems (D4, D5, D6) and may not avoid collapse.

  ## Insulation
  The thesis is partially insulated from falsification. On one hand, it makes empirical claims about predictive accuracy that could be tested (e.g., D1, D2). But the fidelity threshold and weighting are adjustable, so negative results can be dismissed as not meeting the threshold or balanced by other hosts (D10). Moreover, the core claim that patterns constitute selves is conceptual and thus insulated by design. However, if no clear threshold is set, the thesis becomes unfalsifiable. For a view that purports to be explanatory, this is a defect: it risks being empty. Yet, if its work is therapeutic, unfalsifiability might be acceptable. The problem is that it presents itself as more than therapy.

  ## Defensible core
  The weakest surviving claim is that high-fidelity internal models of a person in others' minds allow for a form of social persistence that has psychological reality for the hosts and causal influence on their behavior. This is not literal survival of the person but a robust and measurable extension of their social presence. The cost is abandoning metaphysical survival: it becomes a view about the bereaved's psychology and the deceased's causal legacy. This retains the therapeutic and expressive value without the ontological baggage. The fidelity measure still serves to quantify the precision of this legacy.

