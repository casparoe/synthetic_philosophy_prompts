  *checks notes* Now the reckoning... Ah, the cleanest match is epistemic inaccessibility ↔ withholding. But preference revision? Craft can only show symptoms (changed behavior), not the neural rewrite. And the "no expression" parts—like subjective value metrics—highlight fiction's limits with quantitative rationality. 

