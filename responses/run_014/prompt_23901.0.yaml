  First, I need to unpack what each side actually commits to. The pro-supertask camp (like Benacerraf) isn't just saying "undetermined"—they're making a stronger claim: that completion is logically coherent even without a last step. Their analogy to Zeno is crucial here. But when they say the lamp's state is "undetermined," are they describing epistemic limitation or metaphysical indeterminacy? That's where things get murky.

  The anti-supertask side (inspired by Thomson) isn't merely physicalist—they're attacking the coherence of completion itself for divergent sequences. Their "no fact of the matter" claim isn't about measurement but definition: can we even attach meaning to "final state" when the sequence has no limit? This feels deeper than physics.

