prompt: |-
  I'm organizing a monthly discussion group for people in the rationalist orbit—mostly programmers, a couple of graduate students in non-philosophy fields, all broadly familiar with the Sequences and with expected-utility reasoning as a normative ideal for decision-making. Next month I want to spend an hour on L.A. Paul's concept of transformative experience and the challenge it raises for the standard model of rational choice. I've read the book; the group hasn't. I'm not looking for a summary of the argument. I need a teaching plan.

  What I want from you is the dependency structure and the misconception map. Specifically:

  - What has to be in place before the problem even registers as a problem? I assume the standard picture—rational choice as maximizing expected utility over a known preference ordering—needs to be on the table, but is there something more specific that needs to be foregrounded first, like the distinction between uncertainty about outcomes and uncertainty about one's own future values?

  - What's the right carrying example? Paul's vampire case is vivid, but for this audience it risks coming across as a toy problem that doesn't bite on real decisions. I'm considering using the decision about whether to have children instead—it's closer to home and harder to dismiss, but it also brings in emotional weight that might derail the conceptual point. Which example should anchor the session, and what does it need to have and lack to work?

  - What misconceptions will this particular audience predictably form, and at what point in the sequence should I head each one off? My guesses: (a) collapsing the problem into ordinary uncertainty about future preferences and thinking it's just a case where you need better priors; (b) treating it as a problem about the unreliability of testimony from people who've undergone the experience, and therefore soluble in principle by better polling; (c) reducing it to standard incommensurability of values and reaching for a Pareto-frontier or bargaining framework. Are there others I'm missing, and does the order I've listed them match the order they'll arise?

  - What's the dependency order among the core conceptual pieces? Does the first-personal vs. third-personal knowledge distinction need to come before the expected-utility framing, or does the framing have to be fully set up before the distinction can land? Where does the question of whether the problem generalizes beyond big life decisions belong—early as motivation, or late as a frontier issue?

  - What should I explicitly bracket and refuse to cover? I'm inclined to set aside the epistemology of disagreement as applied to testimony from the transformed, and also the question of whether the argument overgenerates to all decisions under uncertainty. Are those the right cuts, or am I walling off something that needs to be addressed for the core argument to go through?

  - At the end of the hour, what single question or scenario should I put to the group to check whether they've understood the problem itself, as opposed to just finding it intuitively plausible or unsettling?

  Assume the group has the conceptual vocabulary of someone who's read up through the decision-theory Sequences but has no exposure to academic philosophy of mind or epistemology. The goal is for them to see exactly where expected-utility reasoning runs into a structural obstacle, not just a practical one.
reasoning: |-
  Okay, the user is organizing a discussion group for rationalist-adjacent folks—mostly programmers and grad students familiar with the Sequences and expected utility theory. They want to teach L.A. Paul's transformative experience concept and its challenge to rational choice theory. They need a teaching plan focusing on dependency structure and misconception mapping.

  Hmm, the key here is making sure the group grasps why transformative experiences create a structural problem for expected utility (EU) theory, not just a practical limitation. The user’s deep need is likely ensuring the group *really* gets the philosophical weight of Paul’s argument—since their audience might try to "solve" it with better priors or data.  

  First, dependencies: The EU framework *must* be crystal clear upfront. I should emphasize that EU requires known preferences over outcomes. The group might miss that "known" includes both outcome uncertainty and preference uncertainty—so I’ll explicitly separate those. Then introduce transformative experiences as a third category where you can’t *know* your future preferences because the experience changes you epistemically and personally.  

  For the carrying example: Parenting is better than vampires. It’s relatable and high-stakes, avoiding the "toy problem" vibe. But the user worries about emotional derailment. I should suggest framing it neutrally—e.g., "Imagine someone deciding whether to become a parent"—and stress it’s about epistemic access, not debating parenthood’s merits.  

  Misconceptions are critical. The big three the user listed are spot-on:  
  (a) "This is just preference uncertainty—get better priors!" Need to clarify that transformative experiences make priors impossible because you lack the *concepts* to assign values.  
  (b) "Better polling fixes this!" But testimony can’t convey the first-person *what-it’s-like*, and it doesn’t help *you* pre-transformation.  
  (c) "Just compare trade-offs!" But if preferences are transformed, there’s no stable basis for comparison.  
  Order-wise, (a) will pop up first when introducing the problem, (b) when discussing testimony, (c) later when seeking workarounds.  

  I’ll also add a sneaky fourth misconception: "This only applies to huge life choices." Paul argues it generalizes (e.g., trying new foods), so I’ll note that early to motivate the scope, but tackle it late to avoid dilution.  

  Bracketing: The user’s cuts are smart. Avoid epistemology of disagreement (e.g., "Can we trust post-transformation reports?") and whether *all* decisions are transformative—those are deep rabbit holes. Stay focused on why EU breaks *here*.  

  Finally, the checkpoint question: "Can you assign a meaningful EU to becoming a parent pre-transformation?" If they see it’s impossible (not just hard), they’ve got it.  

  This plan should keep the session tight, conceptual, and resistant to toolkit-solutions.
answer: |-
  Here's a structured teaching plan focused on dependency order, misconceptions, and conceptual clarity for your rationalist discussion group, optimized for a 60-minute session:

  ---

  ### **Dependency Structure & Core Flow**  
  *(Total: 50 min)*  
  1. **Foundation: Standard EU Framework** (10 min)  
     - *Prerequisite:* Explicitly define rational choice as **maximizing expected utility** where:  
       `EU(A) = Σ [ P(Outcome_i | A) • U(Outcome_i) ]`  
     - *Key dependency:* Establish that EU requires **three known inputs**:  
       (a) Possible outcomes,  
       (b) Probabilities of outcomes,  
       (c) **Cardinal utilities** over outcomes (preferences must be *defined and comparable*).  
     - *Foreground:* Distinguish **two types of uncertainty** they know:  
       - Outcome uncertainty (unknown world-states)  
       - Preference uncertainty (unknown *current* utilities, e.g., "Will I like Thai food?").  
     - *Check:* "Can you apply EU to skydiving if you’ve never done it?" (Yes—you can estimate utilities based on proxies/values.)

  2. **Introducing Transformative Experience (TE)** (15 min)  
     - **Anchor Example: Becoming a Parent** (use this; avoid vampires).  
       - *Why it works:* Universally recognizable, high-stakes, and Paul’s flagship case.  
       - *Neutral framing:* "Consider someone deciding whether to have their first child."  
       - *Crucial features to highlight:*  
         - **Epistemic transformation:** You cannot know "what it’s like" to be a parent until you are one (e.g., the visceral reality of love/exhaustion).  
         - **Personal transformation:** Parenthood rewires your identity and values (e.g., new priorities, emotional responses).  
       - *Avoid:* Debate about parenting’s merits. Focus on *epistemic access*.  

  3. **The Structural Problem for EU** (15 min)  
     - *Core argument breakdown:*  
       - To calculate EU(pre-parenthood), you need U(life-as-parent).  
       - But U(life-as-parent) **depends on values you only acquire AFTER becoming a parent**.  
       - → Pre-transformation U(life-as-parent) is **undefined** (not just unknown!).  
     - *Analogy:* "Asking a non-coffee-drinker to assign utility to ‘being a coffee-lover’—they lack the subjective state to ground the value."  

  4. **Generalization & Scope** (5 min)  
     - *Briefly note:* TEs aren’t just "big" decisions (e.g., trying psychedelics, radical career shifts).  
     - *Key point:* Problem arises when an experience **simultaneously** teaches you the *nature* of an outcome and *alters your values*.  

  5. **Checkpoint Question** (5 min)  
     - *Pose:* **"Can you assign a *meaningful expected utility* to becoming a parent *before* experiencing it? If not, which input to the EU equation fails?"**  
       - *Target insight:* Utilities are incommensurable pre/post-transformation—no stable scale exists.  

  ---

  ### **Misconception Map & Preemptive Strikes**  
  *(Ordered by when they’ll arise in session)*  

  | Misconception | When it Arises | How to Debunk |
  |---------------|----------------|--------------|
  | **(a) "Just preference uncertainty—get better priors!"** | During TE intro (Step 2) | **Emphasize:** Preference uncertainty assumes *stable meta-values* (e.g., "I value novelty"). TE destroys the frame of reference. *Contrast:* Estimating if you’d like Thai food (possible) vs. predicting values of a future self with alien preferences (impossible). |
  | **(b) "Better testimony/data solves this!"** | When discussing EU failure (Step 3) | **Ask:** "Can surveys tell you *what loving a child feels like* or how it *changes your utility function*? Testimony gives *third-person facts*, not first-person value *revelation*. Post-TE you can’t ‘report’ utilities to your past self—they’re incomparable." |
  | **(c) "This is just incommensurability—use multi-objective optimization!"** | During Q&A or Step 3 | **Note:** Pareto frontiers require *known* trade-offs between objectives. But if objectives *themselves* change (e.g., pre-parent "career focus" vs. post-parent "family joy"), no common axis exists to compare. |
  | **(d) NEW: "But we make big decisions anyway—so what?"** | During generalization (Step 4) | **Clarify:** Paul’s point isn’t "don’t decide," but that EU *can’t justify* the choice rationally. We decide via non-rational processes (e.g., commitment, intuition). |
  | **(e) NEW: "Can’t I model it as becoming a new agent?"** | During checkpoint (Step 5) | **Block early:** In Step 1, stipulate EU applies to *a single agent over time*. If you’re "a new agent," EU calculations don’t transfer across selves. |

  ---

  ### **What to Explicitly Bracket**  
  - **Epistemology of disagreement:** Avoid "Can we trust post-TE testimony?" (It’s a red herring; the problem is first-person valuation, not testimony reliability).  
  - **Overgeneralization to all uncertainty:** Don’t debate whether *every* choice is TE (it dilutes the core point). State: "We’re focused on cases meeting Paul’s strict criteria."  
  - **Solutions/workarounds:** This session is about *diagnosing the problem*. Save normative responses (e.g., "rational irreducibility") for a follow-up.  

  ---

  ### **Why This Sequence Works for Your Audience**  
  1. **Leverages their EU fluency** by starting with a clean technical model.  
  2. **Parenting example** grounds abstraction without being dismissible. Pre-empt emotional derailment by framing it as a *value-modeling puzzle*, not a life-advice discussion.  
  3. **Misconceptions are targeted** at the point they’re most likely to emerge (e.g., "better data" when discussing testimony).  
  4. **Checkpoint question** tests grasp of the structural flaw: If they see utilities are *undefined* (not estimable), they’ve got it.  

  **Time Buffer:** Save 10 min for Q&A. If they shortcut to solutions, redirect: "First, did we establish EU *fundamentally* fails here? How?"  

  This plan ensures they walk away seeing TE not as a "hard case" for EU, but as a category error in applying the model.
