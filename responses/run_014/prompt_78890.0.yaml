  The causal reading (b) claims nothing later can cause earlier events. This is substantive and defensible under standard causality but controversial in physics contexts like retrocausality or quantum mechanics.

  The modal reading (c) states that past events are fixed - no later action can make them different. This is substantive and defensible under eternalism but not necessarily true.

  The self-consistency model (d) suggests time travel must self-consistently fit into history, preventing paradoxes. This is substantive and defensible as a physical constraint.

  The epistemic reading (e) claims we couldn't detect past changes because records would update. This is false because it confuses metaphysical possibility with epistemological limitations.

  The friend's argument requires (c) or a blend with (b) to work, but (c) alone is defensible only if we accept a fixed past, which isn't universally true. Their argument needs a reading that's substantive but not trivial, and (c) is central.

  For the changing vs affecting distinction: changing means altering what was, while affecting is causing something that was always part of history. This is a real distinction that dissolves the paradox by redefining terms, but it might just reframe the issue rather than solve it.

