answer: |-
  Your friend's argument needs the **modal reading (c)** to be true and substantive to succeed, but this reading is defensible only within certain metaphysical frameworks and not universally binding.

  **Brainstorming the slogan's readings:**
  The claim "you can't change the past" admits multiple interpretations, ranging from tautological to metaphysically loaded. Crucially, "change" could imply semantic incoherence, causal impossibility, metaphysical fixity, physical constraint, or epistemic limitation. The grandfather paradox assumes that backward time travel *entails* the possibility of altering past events, but the coherence of this "alteration" is precisely what’s contested. Your friend treats it as a fatal objection, so we must isolate which reading(s) bear that weight.

  **Ordered menu of readings:**

  1.  **Semantic/Definitional (a):** "A changed past" is contradictory because "past" denotes what *has happened*—so changing it would mean making true "X happened and X did not happen."  
      *Status:* **Trivial** (true by definition).  
      *Role in argument:* Useless for your friend. It forbids "change" only by stipulation, leaving "affecting" or "causing" the past untouched. The grandfather scenario isn’t about literal re-writing but about causal interference.

  2.  **Causal (b):** No later event can be a cause of an earlier event; causation is inherently forward-directed.  
      *Status:* **Substantive but defensible** under standard causation models (e.g., Humean regularity, relativistic physics). However, retrocausality isn’t ruled out *a priori* in some quantum interpretations or timeless frameworks.  
      *Role in argument:* Supports the slogan if causation is asymmetric, but alone it doesn’t block time travel—only "changing" via backward causation. If retrocausality is possible, affecting the past (e.g., sending a signal) might be coherent without "change."

  3.  **Modal (c):** Past events are fixed/factual—no later action *could* make them different from what they were. The past has "necessity of actuality."  
      *Status:* **Substantive and defensible** in eternalist (block universe) or presentist views, where the past’s ontological status makes it unalterable. But it’s **false** in growing block or dynamic theories if future actions *constitute* the past’s content.  
      *Role in argument:* **Essential.** Your friend needs this to claim the grandfather-killer’s act is *metaphysically impossible*, not just causally or physically blocked. If the past isn’t fixed in this strong sense, the paradox isn’t resolved by fiat.

  4.  **Self-Consistency (d):** Any backward time journey must be consistent with the single existing timeline; physics prevents contradictions (e.g., the gun jams).  
      *Status:* **Substantive and defensible** as a physical constraint (e.g., in Gödel’s metric or quantum models), but not a logical/metaphysical necessity.  
      *Role in argument:* Redundant for your friend. It avoids paradox by making "change" *physically* impossible, but concedes that affecting the past is possible (e.g., the traveler was always there). This validates "affecting" without "changing," undermining his flat dismissal.

  5.  **Epistemic (e):** Even if the past were altered, we couldn’t know because memories/records would update.  
      *Status:* **False.** It confuses evidence with ontology. If the past changed, *facts about the change* (e.g., "the records differed yesterday") could be detectable if change isn’t instantaneous/global, or via external perspectives (e.g., a second time traveler).  
      *Role in argument:* Irrelevant. Your friend invokes metaphysical impossibility, not ignorance.

  **Your distinction: Changing vs. Affecting**  
  This is a **real and crucial distinction**.  
  - *Changing the past*: Making it the case that an event E (e.g., Grandfather living to 1925) *was not* as it *was* (contradicting the modal reading).  
  - *Affecting the past*: Being a cause of E, where E was always part of history (compatible with self-consistency).  
  The distinction **dissolves the grandfather paradox by fiat** if we accept self-consistency (d): the traveler *affects* but never *changes* the past. However, it **fails to rescue the modal reading (c)**, which denies even affecting if "affecting" implies retrocausality. If causation is forward-only, backward affecting is incoherent. The paradox persists only if "changing" is conflated with "affecting" under a dynamic theory of time.

  **Verdict on friend's argument:**  
  It requires the modal reading (c) to be true and substantive. However, (c) isn’t trivial—it’s a contested metaphysical thesis. In eternalism, it holds trivially (no "change" because all times exist); in dynamic time, it may fail. His argument thus *assumes* a fixed-past ontology and cannot refute time travel without it.

  **Least confident verdict: Self-Consistency (d) as defensible.**  
  I’m least sure whether this is a deep physical principle or an *ad hoc* evasion. Convincing evidence would be a unified theory (e.g., quantum gravity) where consistency emerges naturally from laws. If such models are unstable or generate ambiguities (e.g., multiple consistent histories), it might slide toward false. Conversely, empirical validation (e.g., closed timelike curves without paradox) would solidify it.
