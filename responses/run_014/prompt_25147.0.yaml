  The user is also concerned whether a theory stays true to consequentialism or revises it beyond recognition. Any proposal must respect the primacy of consequences but might need adjustments. Balancing fidelity to core principles with necessary modifications is tricky. They also want to know if different sources of cluelessness (causal complexity, value uncertainty, non-identity) can be treated uniformly or require different approaches. This suggests desiderata around flexibility versus uniformity.

  Looking deeper, the user might be seeking not just a list of requirements but a framework to evaluate existing theories. They might be preparing for academic work or developing their own solution. Their emphasis on conflicting desiderata hints they anticipate trade-offs, so identifying those tensions is key. Also, they might want to avoid ad-hoc solutions, preferring systematic approaches that handle varied cases consistently.

  I recall the main families of responses: discounting, satisficing, robust optimization, etc. Each has strengths and weaknesses against the desiderata. For example, temporal discounting violates the Long-Range Significance requirement, while robust methods might handle in-principle cluelessness better but struggle with guidance. Highlighting these trade-offs will address their request.

  Another unspoken need: the user might want reassurance that consequentialism can survive cluelessness without collapsing into deontology or nihilism. Ensuring desiderata include Consistency with Core Motivation addresses this. Also, providing cases where theories succeed or fail shows viability.

  I should structure desiderata around action-guidance, epistemic constraints, normative foundations, and scope. Each requirement needs a motivating case to illustrate necessity. Flagging conflicts, like Guidance in All Cases vs. Epistemic Humility, shows why some theories fail. Mentioning how different theories handle these conflicts meets their request for evaluation.

  Finally, addressing the sources of cluelessness uniformly vs. separately is important. The user might prefer a unified theory but acknowledge practical needs for differentiation. Desiderata like Uniformity vs. Differentiation will capture this tension. Evaluating responses against this will help them see which approaches are more flexible.
answer: |-
  Here’s a structured set of desiderata for a theory addressing consequentialist cluelessness, motivated by key cases and tensions, followed by an evaluation of major approaches.

  ---

  ### **Core Desiderata for a Theory of Decision-Making Under Cluelessness**

  1. **Action-Guidance Requirement**  
     *Must provide practical, non-arbitrary guidance for paradigmatically clueless decisions.*  
     **Motivation:** Career choice (e.g., doctor vs. artist) or family planning—where long-term ripple effects (e.g., on future population composition, technological paths) are unknowable. A theory must not paralyze agents.

  2. **Long-Range Significance Requirement**  
     *Must acknowledge that consequences in the far future matter morally.*  
     **Motivation:** Climate policy or nuclear waste disposal—actions whose impacts unfold over millennia. Ignoring distant consequences violates core consequentialism.

  3. **Epistemic Humility Requirement**  
     *Must respect the distinction between epistemic (in-practice) and in-principle cluelessness.*  
     **Motivation:**  
     - *Epistemic:* Predicting economic effects of a policy with incomplete data (potentially resolvable with better models).  
     - *In-Principle:* "Butterfly effects" of daily micro-choices (e.g., lunch order) in chaotic systems. A theory should not treat these identically.

  4. **Non-Collapse Requirement**  
     *Must avoid reducing to nihilism ("no action is better") or triviality ("all actions are equally good/bad").*  
     **Motivation:** Choosing whether to fund AI safety research vs. malaria nets—both have vast, unpredictable long-term consequences. A theory must differentiate meaningfully.

  5. **Consistency with Core Motivation**  
     *Must retain the central consequentialist tenet that consequences determine moral weight, even if indirectly.*  
     **Motivation:** If a theory resolves cluelessness by adding deontological side-constraints (e.g., "never violate rights"), it abandons consequentialism rather than solving its problem.

  6. **Source-Specific Sensitivity**  
     *Must handle distinct sources of cluelessness differently if they warrant it:*  
     - **Causal complexity** (chaos, nonlinearity)  
     - **Value uncertainty** (disagreement about future values)  
     - **Non-identity problems** (different actions create different future people)  
     **Motivation:** Having a child (non-identity) vs. donating to a charity affecting existing populations (causal complexity). These may require distinct treatment.

  7. **Temporal Neutrality Constraint**  
     *Must not arbitrarily discount future welfare solely due to temporal distance.*  
     **Motivation:** Discounting future lives implies saving 1 life today > 1,000 lives in 500 years—ethically dubious under impartial consequentialism.

  8. **Robustness to Value Uncertainty**  
     *Must be compatible with deep uncertainty about what constitutes "value" in the long run.*  
     **Motivation:** Promoting current preferences vs. hedging against future moral revolutions (e.g., if digital minds replace humans).

  ---

  ### **Suspected Conflicts Between Desiderata**

  - **Action-Guidance vs. Epistemic Humility**  
    Providing clear guidance in cases of *in-principle* cluelessness (e.g., butterfly effects) may require oversimplifying causal complexity, violating humility. Conversely, full humility may imply no guidance (*"we truly can’t know"*), risking nihilism (violating **Non-Collapse**).

  - **Long-Range Significance vs. Action-Guidance**  
    If distant consequences dominate but are unknowable, guidance requires *some* proxy (e.g., heuristics). But proxies (e.g., "focus on short-term effects") may ignore significant long-term risks, violating **Long-Range Significance** and **Temporal Neutrality**.

  - **Core Motivation vs. Non-Collapse**  
    Pure consequentialism demands optimizing expected value—but if cluelessness makes expected value incalculable, insisting on optimization may yield arbitrary outputs (e.g., "flip a coin"), violating **Action-Guidance**. Relaxing optimization (e.g., satisficing) may distance the theory from core consequentialism.

  ---

  ### **Evaluation of Major Approaches**

  | **Theory**               | **Strengths**                                  | **Weaknesses**                                  | **Key Conflict**                              |
  |--------------------------|-----------------------------------------------|------------------------------------------------|-----------------------------------------------|
  | **Temporal Discounting** | Provides clear guidance (satisfies **1**).    | Violates **Long-Range Significance** (2) and **Temporal Neutrality** (7). Arbitrarily devalues future. | Fails core consequentialism.                  |
  | **Satisficing**          | Avoids paralysis; non-arbitrary thresholds (1,4). | Thresholds may ignore catastrophic tail-risks. Ignores **Long-Range Significance** (2). | Abandons optimization, weakening **Core Motivation** (5). |
  | **Robust Optimization** (e.g., maxmin) | Handles *in-principle* cluelessness via worst-case focus (3). | Overly conservative; may forbid beneficial actions (e.g., having a child). Violates **Action-Guidance** in benign worlds. | **Long-Range Significance** (2) vs. **Action-Guidance** (1). |
  | **Causal Heuristics** (e.g., "affect individuals directly") | Practical; addresses **Source-Specificity** (6) (e.g., non-identity). | Risks ignoring large indirect effects—may violate **Core Motivation** (5). | Proxy may decouple from true consequences. |
  | **Rights as Constraints** | Prevents catastrophic violations (e.g., torture) (4). | Rejects **Core Motivation** (5)—constraints aren’t consequence-justified. Treats cluelessness via non-consequentialism. | Abandons the problem rather than solving it. |
  | **Myopic Proxy Goals** (e.g., "maximize predictable welfare") | Guidance where knowledge exists (1). | Fails **Long-Range Significance** (2); ignores unpredictable existential risks. | **Action-Guidance** (1) vs. **Long-Range Significance** (2). |
  | **Accept Moral Ignorance** ("no determinate answer") | Epistemically honest (3). | Violates **Action-Guidance** (1) and **Non-Collapse** (4). | Humility vs. guidance conflict. |

  ---

  ### **Synthesis & Recommendations**
  - **Best candidates** balance **Epistemic Humility** with **Action-Guidance** by *stratifying decisions*:  
    - Use **causal heuristics** for chaotic micro-choices (lunch),  
    - **Robust optimization** for high-stakes macro-choices (AI governance),  
    - **Proxy goals** for tractable mid-term impacts (charity effectiveness).  
  - **Critical open tension**: Handling *in-principle* cluelessness without nihilism. This may require embracing **bounded consequentialism**—e.g., optimizing over "influenceable" consequences while flagging radical cluelessness—but risks ad-hocness.  
  - **Non-negotiable**: A theory must respect **Long-Range Significance** and **Core Motivation** to count as *consequentialist*. Approaches violating these (e.g., strict discounting) solve cluelessness by rejecting the premise.  

  Adequate theories will likely *constrain* traditional consequentialism (e.g., via heuristics or robustness) while preserving its core insight that consequences ultimately matter—even when our access to them is irrevocably limited.
