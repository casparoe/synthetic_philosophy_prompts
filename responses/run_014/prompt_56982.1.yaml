  #### **Marking Scheme (25 marks total)**  
  **General Rules:**  
  - **Non-scoring restatements:** No marks for:  
    - "Kelly maximizes growth rate."  
    - "Expectation ignores compounding."  
    - "Never risk ruin."  
  - **Deductions:**  
    - \(-1\) for equating "\(g(f) < 0\)" with "likely ruin in 10 rounds" (e.g., ignoring \(P(W_{10} < W_0) = 0.367\) for \(f = 0.35\) despite \(g(f) > 0\)).  
    - \(-1\) for claiming \(f = 0.4\) is uniquely bad for \(P(W_{10} \geq 2W_0)\) (it shares 0.382 with \(f = 0.3\)).  
    - \(-1\) for suggesting "half-Kelly" as a compromise without data support (e.g., \(f = 0.1\) has \(P(W_{10} \geq 2W_0) = 0.046\), near useless for the board’s goal).  

  **Claim (i) [5 marks]:**  
  - *Correct aspects (2 marks):*  
    - Infinite horizon \(\rightarrow\) growth rate optimal (1).  
    - 20% stake maximizes \(g(f)\) (1).  
  - *Incorrect aspects (2 marks):*  
    - Dismissal of expectation for fixed horizons (1).  
    - \(E[W_{10}]\) is relevant for some objectives (e.g., risk-neutrality) (1).  
  - *What must be true (1 mark):* Fund prioritizes infinite-horizon growth.  

  **Claim (ii) [6 marks]:**  
  - *Correct aspects (2 marks):*  
    - Growth rate is arithmetic, not utility (1).  
    - 20% stake objectively maximizes \(g(f)\) (1).  
  - *Incorrect aspects (3 marks):*  
    - "Any agent" is false; risk-lovers may maximize \(E[W_{10}]\) (1).  
    - Growth-rate max ≡ expected log-utility (1).  
    - Preferences matter for non-log agents (1).  
  - *What must be true (1 mark):* All agents must value long-run growth exclusively.  

  **Claim (iii) [7 marks]:**  
  - *Correct aspects (2 marks):*  
    - \(f = 0.4\) has \(g(f) < 0\) → long-run ruin (1).  
    - Growth-rate sacrifice for target probability (1).  
  - *Incorrect aspects (4 marks):*  
    - Same \(P(W_{10} \geq 2W_0) = 0.382\) at \(f = 0.3\) (positive growth) and \(f = 0.4\) (negative growth) (2).  
    - \(f = 0.3\) dominates \(f = 0.4\): identical target, better growth, lower ruin risk (1).  
    - "No business attending to milestones" ignores finite-horizon objectives (1).  
  - *What must be true (1 mark):* Fund ignores finite targets *and* dominance is irrelevant.  

  **Claim (iv) [5 marks]:**  
  - *Correct aspects (2 marks):*  
    - Non-ergodicity: expectation vs. single path (1).  
    - \(E[W_{10}]\) misleads for high-\(f\) (e.g., \(f = 1.0\)) (1).  
  - *Incorrect aspects (2 marks):*  
    - \(E[W_{10}]\) valid for risk-neutral finite horizons (1).  
    - Conflation of asymptotic/finite-horizon "growth" (1).  
  - *What must be true (1 mark):* Fund cares only about asymptotic typical growth.  

  **Overall Coherence and Insight [2 marks]:**  
  - Explains jump in \(P(W_{10} < W_0)\) as finite-horizon artifact tied to \(g(f)\) sign change (1).  
  - Notes memo’s incoherence: mixing infinite horizon and 10-year target (1).  

  **First-Class Answer Threshold (≥20/25):** Must include ≥4 of:  
  1. Identifies dominance: \(f = 0.3\) vs. \(f = 0.4\) on growth/target/ruin.  
  2. Explains \(P(W_{10} < W_0)\) jump as discrete outcome of 10-round paths.  
  3. Refutes "any agent" by contrasting risk-neutral/loving choices.  
  4. Highlights memo’s mixed-horizon incoherence.  
  5. Distinguishes asymptotic vs. finite-horizon growth relevance.  
  6. Uses data to show \(f = 0.35\) has \(g(f) > 0\) but same target as \(f = 0.4\).  

  **Note to Second Marker:**  
  Competent answers reaching defensible verdicts via unanticipated routes should be credited. Example: A script arguing the memo’s *mixed framing* (infinite horizon + 10-year target) is its core flaw—not arithmetic—should earn marks for:  
  - Claim (i): Fund’s horizon ambiguity undermines growth-rate focus.  
  - Claim (iii): Memo’s use of 10-year data contradicts "no milestones."  
  - Overall insight: Incoherence invalidates the memo’s reasoning.  
  Award marks where moves align with the scheme (e.g., data-driven dominance in claim (iii) or non-ergodicity in claim (iv)), even if structured differently.
