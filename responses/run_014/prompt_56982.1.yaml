  #### **Section B: Question Paper**
  **Question B.1 (25 marks)**  
  *Time allowed: 45 minutes. No calculator permitted. Use the figures below without re-derivation. Do not append a bibliography.*  

  A fund faces a repeated gamble \(G\). It chooses a fixed stake fraction \(f \in [0, 1]\) and plays \(G\) repeatedly:  
  - With probability 0.6, capital multiplies by \((1 + f)\).  
  - With probability 0.4, capital multiplies by \((1 - f)\).  

  The table below gives precomputed values for select stakes \(f\) after 10 rounds (initial capital \(W_0\)):  

  | \(f\) | \(g(f) = 0.6 \ln(1+f) + 0.4 \ln(1-f)\) | \(E[W_{10}]/W_0\) | \(P(W_{10} \geq 2W_0)\) | \(P(W_{10} < W_0)\) |
  |-------|-----------------------------------------|-------------------|-------------------------|---------------------|
  | 0.1   | 0.0150                                  | 1.219             | 0.046                   | 0.367              |
  | 0.2   | 0.0201                                  | 1.480             | 0.167                   | 0.367              |
  | 0.25  | 0.0188                                  | 1.629             | 0.382                   | 0.367              |
  | 0.3   | 0.0147                                  | 1.791             | 0.382                   | 0.367              |
  | 0.35  | 0.0077                                  | 1.967             | 0.382                   | 0.367              |
  | 0.4   | -0.0024                                 | 2.159             | 0.382                   | 0.618              |
  | 0.5   | -0.0340                                 | 2.594             | 0.382                   | 0.618              |
  | 1.0   | \(-\infty\)                             | 6.192             | 0.006                   | 0.994              |

  Notes:  
  - \(g(f)\) is the per-round growth rate.  
  - \(P(W_{10} \geq 2W_0)\) is maximized at 0.382 for \(f \in \{0.25, 0.3, 0.35, 0.4, 0.5\}\).  

  A fictional endowment’s annual letter states:  
  > **(i)** The fund is a going concern with no terminal date. The question before us is therefore not what maximises our expected capital at some arbitrarily chosen future date, but what maximises the rate at which capital grows along the single path we shall actually travel; under G, that is a stake of 20 per cent.  
  > **(ii)** Let it be clear that this is not the logarithmic utility function in disguise. Our reason for the 20 per cent rule is a fact about how capital compounds through time, not a fact about our tastes. Any agent, however risk-loving, confronts the same arithmetic and is undone by it in the same way.  
  > **(iii)** It follows that staking more than 20 per cent is irrational whatever the fund's objectives. The board's proposal to stake 40 per cent, in order to raise the probability of doubling the endowment within ten years, therefore rests on a confusion: it buys a better chance at an arbitrary milestone at the price of a strictly worse growth rate, and a going concern has no business attending to milestones.  
  > **(iv)** Nor should the board take comfort from the observation that staking everything maximises expected capital. An expectation averages over histories of the fund, only one of which will ever be ours, and the fund does not get to average across its own alternatives. Expected capital is the wrong criterion because the process is non-ergodic; the growth rate is the right criterion because it is the one the fund actually faces.  

  **Evaluate claims (i)–(iv):**  
  For each claim:  
  - Explain what is correct and what is incorrect.  
  - State what must be true of the fund’s situation for the claim to hold.  

  **Rubric for Candidates:**  
  - **Do not merely identify stakes or recite general properties of the Kelly criterion.** Engage with the specific claims, data, and decision-theoretic principles.  
  - **Marks reward:**  
    - Clarifying *which criterion* (e.g., growth rate, expectation, target probability) is relevant to each claim.  
    - Using the data to show when criteria align or conflict (e.g., stakes where growth is positive but target probability is maximized).  
    - Explaining why finite-horizon artifacts (e.g., jumps in \(P(W_{10} < W_0)\)) arise and how they affect reasoning.  
    - Distinguishing between objective arithmetic (e.g., compounding) and agent-specific objectives (e.g., risk preferences).  
  - **Top answers will:** Identify dominance relationships in the data, expose inconsistencies in the memo’s framing, and critique universal claims about rationality.  

  ---

  #### **Model Answer (≈900 words)**  
  **Introduction**  
  The memo advocates a 20% stake (\(f = 0.2\)) to maximize the asymptotic growth rate \(g(f)\), dismissing alternatives like the board’s 40% proposal (\(f = 0.4\)) aimed at maximizing \(P(W_{10} \geq 2W_0)\). We evaluate claims (i)–(iv) using the data and decision theory.  

  **Claim (i)**  
  *What is correct:* For a fund with no terminal date, maximizing \(g(f)\) ensures almost-sure capital growth in the long run. The 20% stake maximizes \(g(f)\) at 0.0201, aligning with asymptotic growth optimization.  
  *What is incorrect:* The memo dismisses expected capital at "arbitrary" dates, but for funds with fixed obligations (e.g., a 10-year payout), \(E[W_{10}]\) may be relevant. The data show \(E[W_{10}]/W_0\) rises monotonically with \(f\), peaking at 6.192 for \(f = 1.0\)—contradicting the claim that growth-rate maximization always trumps expectation.  
  *What must be true:* The fund must prioritize *infinite-horizon growth* over all finite-horizon objectives. If the fund cares about specific dates (e.g., 10-year performance), claim (i) fails.  

  **Claim (ii)**  
  *What is correct:* Growth-rate maximization arises from multiplicative compounding, not utility assumptions. The 20% stake is objectively optimal for asymptotic growth, as \(g(f)\) is a property of the gamble, not preferences.  
  *What is incorrect:* The claim that "any agent, however risk-loving, confronts the same arithmetic" is false. A risk-loving agent (e.g., with linear or convex utility) may maximize \(E[W_{10}]\) by staking 100% (\(f = 1.0\)), accepting ruin risk for high upside. Conversely, a risk-averse agent might choose \(f < 0.2\). While \(g(f)\)-maximization coincides with expected log-utility, the memo denies this link—yet log-utility *is* implicitly assumed.  
  *What must be true:* Agents must value *long-run growth* above all else. Risk-loving agents optimizing short-term objectives (e.g., \(E[W_{10}]\)) would reject the 20% stake.  

  **Claim (iii)**  
  *What is correct:* Staking >20% *can* harm growth: \(g(f) < 0\) for \(f \geq 0.4\), implying almost-sure ruin long-term. The board’s 40% stake sacrifices growth (\(g = -0.0024\)) for a higher \(P(W_{10} \geq 2W_0) = 0.382\).  
  *What is incorrect:** The memo asserts staking >20% is irrational "whatever the fund’s objectives," but:  
  - The same maximum \(P(W_{10} \geq 2W_0) = 0.382\) is achieved at \(f = 0.25, 0.3, 0.35\) (all with \(g(f) > 0\)) and \(f = 0.4, 0.5\) (with \(g(f) < 0\)). Thus, \(f = 0.3\) dominates \(f = 0.4\): same target probability (0.382), positive growth (0.0147 vs. -0.0024), and lower ruin risk (\(P(W_{10} < W_0) = 0.367\) vs. 0.618).  
  - If the fund cares about doubling in 10 years, stakes like \(f = 0.3\) are strictly better than 40%. Claim (iii) overlooks this dominance.  
  *What must be true:* The fund must ignore *all* finite-horizon targets. If the 10-year doubling probability matters, \(f = 0.3\) satisfies both growth and target objectives—making 40% irrational only if dominance is ignored.  

  **Claim (iv)**  
  *What is correct:* Expected capital \(E[W_{10}]\) averages over paths, but the fund experiences one path. For \(f = 1.0\), \(E[W_{10}]/W_0 = 6.192\) is driven by a vanishingly rare path (probability \(0.6^{10} \approx 0.006\)) where capital grows 1024-fold, masking a 99.4% ruin risk. This non-ergodicity means expectation misrepresents typical outcomes.  
  *What is incorrect:* While \(E[W_{10}]\) is misleading for high-\(f\) stakes, it remains valid for risk-neutral agents with fixed horizons. For \(f = 0.4\), \(E[W_{10}]/W_0 = 2.159\) is informative if the fund values expected wealth after 10 rounds. The memo also conflates "growth rate" (asymptotic) with "outcome the fund actually faces" (finite-horizon), yet the data show \(g(f) < 0\) at \(f = 0.4\) while \(E[W_{10}] > W_0\)—highlighting a finite/infinite horizon tension.  
  *What must be true:* The fund must care *only* about long-run typical behavior (via \(g(f)\)) and reject ensemble averages. For agents focused on finite-horizon expectation, claim (iv) fails.  

  **Key Data Insights**  
  1. **Target probability dominance:** \(P(W_{10} \geq 2W_0)\) is maximized (0.382) for \(f \in [0.25, 0.5]\). Within this interval, \(f = 0.25, 0.3, 0.35\) have \(g(f) > 0\), while \(f = 0.4, 0.5\) have \(g(f) < 0\). Thus, the board’s \(f = 0.4\) is strictly dominated by (e.g.) \(f = 0.3\), which offers identical target success with positive growth and lower ruin risk.  
  2. **Finite-horizon artifacts:** The jump in \(P(W_{10} < W_0)\) from 0.367 (for \(f \leq 0.35\)) to 0.618 (for \(f \geq 0.4\)) occurs where \(g(f)\) turns negative. This is a step-function artifact: after 10 rounds, only discrete outcomes exist (e.g., \(W_{10} = W_0(1+f)^k(1-f)^{10-k}\) for \(k = 0,\dots,10\)). For \(f < 0.4\), most paths stay above \(W_0\); for \(f \geq 0.4\), losses compound faster, pushing median wealth below \(W_0\). In infinite horizons, ruin is certain when \(g(f) < 0\), but the 10-round probability jump is coincidental.  

  **Memo’s Incoherence**  
  The memo inconsistently invokes both an infinite horizon (for growth-rate supremacy) and a 10-year milestone (to criticize the board). If the fund is truly a "going concern," the 10-year target is irrelevant—yet the memo uses it to condemn the 40% stake. Conversely, if the 10-year objective matters, growth-rate maximization is insufficient. This undermines claim (iii)’s core argument.  

  **Conclusion**  
  Claims (i) and (iv) hold only for funds prioritizing infinite-horizon growth. Claim (ii) confuses objective arithmetic with universal rationality, ignoring preference-dependent criteria. Claim (iii) is partially correct but flawed: staking 40% *is* suboptimal, but not because growth is sacrificed—rather, because stakes like 30% dominate it on both growth and target criteria. The data reveal critical stakes (e.g., \(f = 0.3\)) where usually conflated criteria (growth rate, target probability) align, exposing the memo’s oversimplification.  

