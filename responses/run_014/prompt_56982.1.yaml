    - Additional marks (up to 2) for depth: e.g., noting that growth rate maximization is equivalent to expected log utility, or that different preferences lead to different stakes.

  - **Claim (iii):** [7 marks]
    - Correct: 1 mark for noting that f=0.4 has negative growth and thus long-run ruin.
    - Incorrect: 2 marks for showing that the same target probability (0.382) can be achieved with positive growth (f=0.25,0.3,0.35) and that f=0.4 is dominated (e.g., by f=0.3 which has same target probability, positive growth, and lower ruin probability).
    - What must be true: 1 mark for stating that the fund must have an infinite horizon and no short-term objectives.
    - Additional marks (up to 3) for depth: e.g., using the data to compare f=0.3 and f=0.4 on both criteria, noting that the board's proposal is suboptimal even for their own goal because there are better alternatives in the interval, and critiquing the memo's dismissal of milestones.

