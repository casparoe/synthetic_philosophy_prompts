    - Correct: 1 mark for explaining non-ergodicity and why expected capital is misleading (averages over paths, but one path is realized).
    - Incorrect: 1 mark for noting that expected capital might be appropriate for risk-neutral agents with finite horizons.
    - What must be true: 1 mark for stating that the fund must have an infinite horizon and care only about the growth rate.
    - Additional marks (up to 2) for depth: e.g., contrasting ensemble average vs time average, or discussing the role of horizon.

  - **Overall Coherence and Insight:** [2 marks]
    - 1 mark for noting the inconsistency in the memo (using both infinite horizon and ten-year milestone).
    - 1 mark for explaining the jump in P(W10<W0) as a finite-horizon artifact related to the sign change of g(f).

  **Deductions:**
  - -1 for treating "wealth tends to zero in the limit" as equivalent to "likely to lose money over ten rounds" without noting the finite-horizon artifact.
  - -1 for claiming that staking 40% is irrational solely because of negative growth without noting that f=0.5 also has the same target probability and worse growth, and that there are better alternatives (f=0.25,0.3,0.35).
  - -1 for invoking "half-Kelly" or other ad hoc rules without reference to the data (e.g., the table shows that half-Kelly, which might be f=0.1, has very low target probability).

  **Non-scoring restatements:**
  The following statements, if made without critical engagement, earn no marks:
  - "The Kelly fraction maximizes the growth rate."
  - "Expected value maximization leads to ruin because it ignores compounding."
  - "One should never risk ruin."

  **First-class answer criteria (to distinguish first-class from good):**
  A first-class answer will typically include at least four of the following:
  1. Notes that the same maximum target probability (0.382) is achieved by multiple stakes (f=0.25 to 0.5) and that f=0.3 (or f=0.25) dominates f=0.4 in both criteria (same target probability, positive growth vs negative, and lower ruin probability).
  2. Explains the jump in P(W10<W0) as a discrete finite-horizon effect: with ten rounds, the number of wins and losses determines discrete outcomes. The threshold between positive and negative growth is near f=0.4, and the probability of loss jumps because the median outcome crosses W0 at that point.
  3. Argues that the memo's claim (ii) is incorrect because a risk-loving agent might choose f>0.2, and that growth rate maximization is equivalent to log utility.
  4. Notes the memo's internal incoherence: it invokes an infinite horizon (so growth rate) but then uses the ten-year doubling probability to criticize the board, which is a finite-horizon objective.
  5. Observes that the board's proposal (f=0.4) is not only bad for growth but also avoidable because there are stakes that achieve the same ten-year goal with positive growth.
  6. Explains that the growth rate criterion is the almost-sure limit of (1/n) ln(W_n) and why this matters for a single path.

  **Note to Second Marker:**
  A competent script that reaches a defensible overall verdict by an alternative route should be credited. For example, a candidate might argue that the memo's mixed framing (infinite horizon and ten-year milestone) is internally incoherent and that this incoherence is the central defect. They might say that if the fund is truly a going concern, then the ten-year milestone is irrelevant and the board's proposal is misguided; but if the ten-year milestone matters, then the growth rate is not the only criterion. Such an argument should be awarded marks for claims (i) and (iii) accordingly. In particular, for claim (iii), the candidate might argue that the memo's criticism of the board is invalid because the memo uses an infinite-horizon criterion to evaluate a finite-horizon objective. This is a valid point and should be credited under claim (iii) and overall coherence. Use the marking scheme flexibly: if the candidate makes the required moves (e.g., uses the data to show dominance of f=0.3 over f=0.4, explains the jump in ruin probability, critiques claim (ii)) but in a different order, award the marks accordingly. The key is to reward insight and critical use of the data.

