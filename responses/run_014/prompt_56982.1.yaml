  **Model Answer (Approximately 900 words)**

  **Introduction:**
  The fictional endowment's memo advocates a 20% stake (f=0.2) in gamble G, which maximizes the per-round growth rate g(f). It criticizes a 40% stake (f=0.4) proposed by the board to maximize the probability of doubling the endowment in ten years. We evaluate the four claims.

  **Claim (i):**
  *What is correct:* If the fund is indeed a going concern with no terminal date, then maximizing the long-run growth rate (asymptotic growth) is appropriate. The growth rate g(f) determines the almost-sure limit of (1/n) ln(W_n/W_0) as n→∞. The stake f=0.2 maximizes g(f) (g(0.2)=0.0201) and is optimal for this criterion.

  *What is incorrect:* The memo dismisses expected capital at a future date as "arbitrary". However, for a fund with a fixed horizon (e.g., ten years) or specific obligations, expected utility of terminal wealth might be the right criterion. The memo assumes the fund has an infinite horizon and no intermediate objectives, but this may not hold.

  *What must be true:* The fund must have an infinite horizon and care only about the long-run growth of capital, with no intermediate consumption or obligations. If the fund has a finite horizon or specific targets, then expected utility at that horizon might be more relevant.

  **Claim (ii):**
  *What is correct:* The growth-rate maximization (Kelly) strategy is justified by the multiplicative nature of wealth accumulation (compounding) and does not require the fund to have a logarithmic utility function. The Kelly stake (f=0.2) is the unique stake that maximizes the long-run growth rate, a property of the investment process.

  *What is incorrect:* The memo claims that "any agent, however risk-loving, confronts the same arithmetic". This is false. A risk-loving agent (with convex utility) might prefer a stake higher than Kelly. For instance, a risk-neutral agent (linear utility) would maximize expected wealth and choose f=1 (all-in). Moreover, an agent with logarithmic utility would choose Kelly, but an agent with different utility (e.g., power utility) might choose differently. The memo also fails to note that maximizing the growth rate is equivalent to maximizing expected logarithmic utility. Thus, while the criterion is about compounding, it implicitly assumes a logarithmic preference over the long run.

  *What must be true:* For the claim that any agent must choose f=0.2, we would need to assume that every agent's objective is to maximize the long-run growth rate. However, agents with different risk preferences or objectives (e.g., maximizing the probability of reaching a short-term goal) might choose differently.

  **Claim (iii):**
  *What is correct:* The memo correctly notes that staking 40% (f=0.4) has a negative growth rate (g(0.4)=-0.0024) and thus, in the long run, wealth will almost surely tend to zero. This is disastrous for a going concern. The board's objective of maximizing the probability of doubling in ten years (P(W10>=2W0)) is achieved at f=0.4 (and others) with 0.382, but at the cost of negative growth.

  *What is incorrect:* The memo asserts that staking more than 20% is irrational "whatever the fund's objectives". This is false. The data show that the maximum P(W10>=2W0)=0.382 is achieved for a range of stakes (f=0.25,0.3,0.35,0.4,0.5). Crucially, stakes f=0.25,0.3,0.35 achieve the same target probability (0.382) as f=0.4 but have positive growth rates (0.0188,0.0147,0.0077, respectively). Thus, the board's proposal of f=0.4 is strictly dominated by, say, f=0.3: same target probability, positive growth (so better long-run prospects) and a lower probability of ruin (P(W10<W0)=0.367 for f=0.3 vs 0.618 for f=0.4). The memo's claim that the board's proposal "buys a better chance at an arbitrary milestone" is misleading because the same milestone probability can be achieved without sacrificing growth. Moreover, if the fund has a ten-year horizon and cares only about doubling, then maximizing P(W10>=2W0) is rational, and the memo's dismissal of milestones is inappropriate.

  *What must be true:* For the memo's claim to hold, the fund must have an infinite horizon and no short-term objectives. Additionally, the fund must not care about the probability of achieving intermediate targets. However, the memo itself is inconsistent because it uses the ten-year doubling probability to criticize the board, yet dismisses milestones as arbitrary.

  **Claim (iv):**
  *What is correct:* Expected capital (E[W10]) averages over all possible paths, but the fund only experiences one path. For repeated multiplicative bets, the expected capital can be dominated by extremely unlikely but high-payoff paths (e.g., f=1 has E[W10]/W0=6.192, but with 99.4% probability of ruin). The memo correctly identifies that the process is non-ergodic: the time-average growth along a single path (which is g(f) by the law of large numbers) is not equal to the ensemble average (expected logarithmic return). Thus, for a fund that cannot average across parallel universes, the growth rate is the relevant criterion for long-run growth.

  *What is incorrect:* The memo does not address why expected capital is maximized at f=1 and why this might be relevant for a risk-neutral agent with a finite horizon. Also, the memo implies that the growth rate criterion is always the right one, but for a fund with a fixed horizon and utility defined on terminal wealth, expected utility maximization might be appropriate. Moreover, the memo's non-ergodicity argument is specific to the long run; for a fixed horizon, the fund might care about the distribution of terminal wealth.

  *What must be true:* The growth rate criterion is the right one only if the fund has an infinite horizon and cannot rely on the law of large numbers over many independent bets (because there is only one path). Additionally, the fund must be concerned solely with the asymptotic growth and not with the distribution of wealth at intermediate dates.

  **Conclusion:**
  The memo's central argument for f=0.2 is sound for a fund with an infinite horizon. However, it fails to note that the board's ten-year objective can be achieved without sacrificing growth (by choosing f=0.25 or 0.3). The jump in P(W10<W0) at f=0.4 (from 0.367 to 0.618) is due to the discrete nature of ten rounds: after ten rounds, the number of losses required to fall below W0 becomes more likely as f increases, and at f=0.4 the growth rate turns negative, causing the median outcome to drop. This is a finite-horizon artifact; in the long run, negative growth implies wealth tends to zero almost surely. The memo's claim (ii) is partially right: compounding is objective, but the choice of criterion depends on preferences. The memo's inconsistency lies in mixing an infinite horizon argument with a ten-year milestone. If the fund is truly a going concern, then the board's focus on ten years is misplaced; but if ten-year objectives matter, then the growth rate is not the only criterion.

