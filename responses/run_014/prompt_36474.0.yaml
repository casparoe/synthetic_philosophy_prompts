prompt: |-
  I've been keeping a running list of my gut reactions to hypocritical blamers, and I want to know if there's an actual principle behind them, because right now it feels like vibes. My uncle cheated on his taxes for years, stopped only when he got audited, and now rails about tax cheats at every family dinner — his blame feels off to me, like he's forfeited the right. But a college friend who cheated on one exam twenty years ago, admits it freely, and now grades exams and calls out cheating — her blame seems totally fine. Same act, both reformed, different verdict? That can't just come down to the audit. Then my sister has never plagiarized anything, though honestly only because she's never been desparate enough, and when she condemned a plagiarist I'd say go right ahead — but it bugs me that she seems to have MORE standing than my reformed friend, even though my friend actually knows the temptation and my sister doesn't. So standing can't just be "never did it yourself," and it also can't be "knows what it's like," because those point in opposite directions and I hold both.

  It gets worse. My coworker who drives an SUV blaming people who fly for climate damage — that blame feels kinda fine to me? Whereas a different coworker who takes one long-haul flight a year blaming our colleague's monthly flying feels off, even though the flight-blamer's own emissions are way lower than the SUV driver's. The person with LESS hypocrisy has LESS standing on my gut, which seems backwards no matter how I slice it. And separately I'm pretty sure a bystander who would obviously have done the same thing if tempted, but never was, has standing — the "there but for the grace of God" person is allowed to blame, right?

  Is there a principle that captures all of this, or as close as possible? Please state it precisely, tell me which case motivates each part, and say what it predicts for the case I keep circling: my neighbor who eats meat but says he's morally transitioning off it, and blames me for eating meat without even trying. And be honest about which of my verdicts you'd overturn to get a cleaner principle — I suspect something has to go, probably either the SUV one or the sister one, but I genuinely don't know which.
reasoning: |-
  Okay, the user is grappling with their gut reactions to hypocritical blamers and wants to find a unifying principle behind them. They've provided several detailed examples where their intuition conflicts with common assumptions about hypocrisy. Let me unpack this step by step.

  First, I notice the user is clearly intelligent and self-aware - they recognize their judgments feel like "vibes" but suspect there's deeper logic. That analytical mindset is helpful. The examples cover tax cheating, plagiarism, carbon emissions, and meat-eating, showing they're testing this across moral domains. 

  The core tension seems to be between three factors: (1) whether the blamer has committed the act themselves, (2) whether they've genuinely reformed, and (3) whether they acknowledge their past faults. The uncle example suggests ongoing hypocrisy negates standing, while the college friend shows reformed + acknowledged hypocrisy preserves it. The sister case introduces a new angle - someone who never sinned but lacks temptation awareness, yet still has standing. 

  Then the climate examples add another layer: the SUV driver's blame feels acceptable despite higher emissions, while the frequent flyer's blame feels off despite lower emissions. This suggests the magnitude of current hypocrisy matters less than the blamer's attitude about their own behavior. 

  For the "there but for grace of God" bystander, the user intuitively grants standing - which aligns with how we accept criticism from people who acknowledge they'd be vulnerable in the same situation. 

  The neighbor case (meat-eater blaming others while "transitioning") seems to combine several red flags: unacknowledged hypocrisy, minimal effort to change, and judgment of others' efforts. 

  To build a principle, I need to reconcile these. The key might be separating two dimensions: (1) the blamer's current relationship to the wrong (are they still doing it? how much?) and (2) their relationship to their own moral fallibility (do they acknowledge it? show humility?). 

  The uncle fails on both counts - still cheating until caught, no humility. The college friend succeeds on both - fully reformed, openly acknowledges past. The sister is neutral on wrongdoing (never did it) but shows humility by admitting she could be tempted. The SUV driver's blame works because they own their emissions as necessary (imperfect but honest), while the flight-shamer fails by not acknowledging their own flying. 

  So perhaps the principle is: Blame has standing when the blamer either (a) has credibly reformed and acknowledges their past, or (b) acknowledges their own current moral compromises regarding the issue, or (c) sincerely acknowledges their potential for similar failing. What breaks standing is denial of one's own identical wrongdoing or moral vulnerability. 

  For the neighbor: his blame lacks standing because he's actively doing the thing while judging others, and his "transition" claim rings hollow without concrete steps. I'd predict the user finds this blame jarring. 

  The SUV case might need refinement - perhaps the driver's blame is acceptable because they frame it as systemic (we all need to do better) rather than personal attack. That distinction could matter. 

  Ultimately the user might need to adjust their view on the sister example - her standing likely comes from general moral authority, not hypocrisy logic. That's the cleanest place to make an exception.
answer: |-
  Here's a principle that captures your intuitions as closely as possible, based on your examples:

  **The Principle of Earned Standing in Blame:**
  *Blame has legitimate standing when the blamer either:*
  1.  *Has credibly demonstrated reform (ceased the behavior and maintained that change), AND demonstrates humility/acknowledgment about their own past failing; OR*
  2.  *Acknowledges their own current moral compromise regarding the very issue they are condemning, framing their blame as shared moral reckoning rather than superior condemnation.*

  *Standing is forfeited when the blamer:*
  *   *Denies, minimizes, or remains unrepentant about their own identical or substantially similar wrongdoing (past or present); OR*
  *   *Frames their blame from a position of claimed moral superiority while actively engaging in the condemned behavior without acknowledging the compromise.*

  **Breaking Down the Principle with Your Cases:**

  1.  **The Uncle (Tax Cheating):**
      *   **Verdict:** Forfeited standing.
      *   **Why:** He lacks credible reform (only stopped due to audit, suggesting compliance, not moral change). Crucially, he **denies/minimizes his own past** ("rails about tax cheats" without acknowledging *his* history). He blames from a position of claimed superiority. (Motivates the "denial/unrepentant" forfeiture clause).

  2.  **The College Friend (Exam Cheating):**
      *   **Verdict:** Legitimate standing.
      *   **Why:** She demonstrates **credible reform** (ceased the behavior long-term). She **acknowledges her past failing freely** ("admits it freely"), demonstrating humility. She doesn't deny her own vulnerability. (Motivates Condition 1: Reform + Acknowledgment).

  3.  **Your Sister (Plagiarism):**
      *   **Verdict:** Legitimate standing (though it bugs you).
      *   **Why (under the principle):** She has committed no wrongdoing to deny or be unrepentant about. Her lack of temptation isn't disqualifying; she doesn't *need* "reform" to have standing for the core wrong. Her standing comes from the *absence* of hypocrisy related to *this specific act*, allowing her to condemn the principle without contradiction. (Motivates that "never did it" is generally sufficient *unless* combined with hypocrisy elsewhere or bad faith. Her acknowledgment that she *could* be tempted if desperate adds depth but isn't strictly necessary for basic standing).

  4.  **SUV Driver Coworker (Blaming Fliers):**
      *   **Verdict:** Legitimate standing (feels fine).
      *   **Why:** They **acknowledge their own compromise** implicitly by driving an SUV while condemning flying. The blame likely feels like a shared problem ("we all contribute, flying is especially bad") rather than pure superiority. Their necessary use of an SUV might contextualize, but the key is they aren't *denying* their contribution while blaming others. (Motivates Condition 2: Acknowledging own compromise / shared reckoning).

  5.  **Low-Emission Flight Blamer (Blaming Frequent Flyer):**
      *   **Verdict:** Forfeited standing (feels off).
      *   **Why:** They engage in the *exact behavior type* (flying), just less frequently. They blame from a position of relative, but not absolute, superiority **without acknowledging their own compromise** ("I fly once, you fly monthly, *you* are the problem"). They deny/minimize the significance of *their own* identical action. (Motivates the "denial/minimization" clause and highlights that *identical behavior*, even at lower volume, triggers hypocrisy if unacknowledged).

  6.  **The "There but for the Grace of God" Bystander:**
      *   **Verdict:** Legitimate standing.
      *   **Why:** They explicitly **acknowledge their own potential for failing** ("there but for the grace..."). They demonstrate humility and self-awareness, framing the blame within a shared human vulnerability, not superiority. (Aligns with the spirit of Condition 2 - acknowledging compromise/vulnerability).

  **Predicting the Neighbor (Meat-Eater Blaming You):**

  *   **Behavior:** Actively engages in the condemned behavior (eating meat).
  *   **Reform Claim:** "Morally transitioning" but no concrete action ("without even trying").
  *   **Acknowledgment:** Likely minimal or performative ("transitioning" claim seems like a shield, not genuine acknowledgment of compromise).
  *   **Framing of Blame:** Almost certainly frames it as *your* moral failing ("blames *me*"), implying his position is superior despite his identical actions.
  *   **Prediction (Per Principle):** **Forfeited Standing.** He fails Condition 1 (no credible reform - "without even trying"). He fails Condition 2 (likely doesn't genuinely acknowledge his compromise as a *shared* failing, instead using "transitioning" to claim superiority while still doing the act). He strongly triggers the forfeiture clauses: denying/minimizing the significance of *his own* current, identical wrongdoing ("I'm *transitioning*, so I can blame *you*") and blaming from a position of claimed superiority.

  **What Needs Adjustment for a Cleaner Principle:**

  Your intuitions are remarkably consistent, but one case forces a slight tension: **Your Sister vs. Your Reformed Friend.**

  *   **The Tension:** You feel your sister has *more* standing than your reformed friend, even though the friend has deeper experiential knowledge. The principle grants both standing, but doesn't inherently rank them.
  *   **The Adjustment:** To make the principle perfectly clean, we need to **accept that "never did it" grants standing equal to "reformed + acknowledged,"** even if the *quality* or *insight* of the blame differs. Your sister's standing doesn't *require* her to have been tempted; her lack of hypocrisy is sufficient. Your friend's experience adds value but doesn't *diminish* her standing earned through reform and acknowledgment.
  *   **Why this over the SUV?** Your SUV intuition fits perfectly with Condition 2 (acknowledging compromise). Overturning it would lose a key insight about how people can legitimately condemn *worse* instances of a behavior they are complicit in, *if* they own their complicity. Your sister's case is the cleaner point to clarify.

  **In Summary:** Your "vibes" are driven by a sophisticated sense of **moral humility, acknowledgment of fault or vulnerability, and the avoidance of superiority claims when compromised.** The principle centers on whether the blamer owns their relationship to the failing, either through repentance or honest acknowledgment of compromise, rather than denying it while condemning others. Your neighbor fails this test spectacularly. Your sister's standing holds, even if it feels slightly less experientially rich than your friend's.
