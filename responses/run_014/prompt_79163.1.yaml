  Structure:
  - 10 fictional islands with a shared colonial past, common census, common currency, and documented crises.
  - Three research teams (each gets one family of variables: institutional, geographical, cultural) and a fourth group as a replication/referee panel. Additionally, two regional historians (each with archival material about one island).

  The hidden data-generating story:
  - We have three variables (A, B, C) that each correlate with prosperity (P) in the sample of 10 islands.
  - However, the causal structures differ:
    - One variable (say, institutional) is genuinely upstream (a cause) of prosperity.
    - One variable (say, cultural) is downstream (an effect) of prosperity.
    - One variable (say, geographical) is a proxy for a fourth, unobserved variable (which is the real cause).

  But note: the assignment of these roles (which variable is which) is hidden and will be revealed in the debrief.

  We want the correlations to be present but with different causal origins. Also, no additional observational data (of the same kind) can break the tie.

