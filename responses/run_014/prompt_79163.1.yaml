answer: |-
  ### **Full Runnable Design: Archipelago Causal Inference Simulation**

  ---

  #### **I. Hidden Data-Generating Structure (Prepared in Advance, Revealed in Debrief)**  
  **True Model**: Prosperity (P) is *directly caused* by **institutions (I)**, but institutions are shaped by an unobserved **colonial legacy (U)**. Geography (G) is a *proxy* for U (since fertile soil attracted colonial investment). Culture (C) is *downstream* of prosperity (P), reflecting accumulated wealth.  
  - **Key Relationships**:  
    - Institutions (I) = 0.8 × U + *noise*  
    - Prosperity (P) = 0.7 × I + *noise*  
    - Culture (C) = 0.6 × P + *noise*  
    - Geography (G) = 0.9 × U + *noise* (G is a proxy for U, the unobserved colonial legacy)  
    - *U (colonial legacy)* = Randomly assigned values (1–10), representing historical investment levels.  

  **Data for 10 Islands** (rounded for simplicity; all values scaled 1–10):  
  | Island | U (Hidden) | I (Institutions) | G (Geography) | C (Culture) | P (Prosperity) |
  |--------|------------|------------------|---------------|-------------|----------------|
  | 1      | 3          | 2.5              | 2.8           | 2.0         | 2.3            |
  | 2      | 5          | 4.0              | 4.5           | 3.2         | 3.5            |
  | 3      | 1          | 1.0              | 1.0           | 0.8         | 1.0            |
  | 4      | 8          | 6.5              | 7.2           | 5.1         | 6.0            |
  | 5      | 6          | 5.0              | 5.5           | 4.0         | 4.5            |
  | 6      | 2          | 1.5              | 1.8           | 1.5         | 1.5            |
  | 7      | 9          | 7.5              | 8.1           | 6.5         | 7.0            |
  | 8      | 4          | 3.0              | 3.6           | 2.8         | 3.0            |
  | 9      | 7          | 6.0              | 6.3           | 4.8         | 5.5            |
  | 10     | 10         | 8.0              | 9.0           | 7.5         | 8.0            |

  **Why these numbers?**  
  - All three variables (I, G, C) correlate with P (correlation coefficients ≈0.95), creating ambiguity.  
  - **Institutional (I) team** sees I→P causation (e.g., Island 4: I=6.5 → P=6.0).  
  - **Geographical (G) team** sees G→P spurious correlation (e.g., Island 7: G=8.1 → P=7.0; but U drives both).  
  - **Cultural (C) team** sees reverse causation P→C (e.g., Island 10: P=8.0 → C=7.5).  
  - **No additional data breaks the tie**: Observing more islands or variables won’t resolve confounding (U is always hidden).  

  ---

  #### **II. Materials to Prepare**  
  1. **Data Booklets (3 Teams, 1 Variable Family Each)**:  
     - **Institutions Team**: Islands 1–10, columns: Island, I, P.  
     - **Geography Team**: Islands 1–10, columns: Island, G, P.  
     - **Culture Team**: Islands 1–10, columns: Island, C, P.  

  2. **Archival Historian Folders (2 People)**:  
     - **Historian 1 (Island 4)**: *“Colonial archives show Island 4 had high investment in courts and land rights in 1920, preceding its industrial boom. Soil quality attracted early colonizers.”* (Hints at I→P and U’s role).  
     - **Historian 2 (Island 6)**: *“Island 6’s poverty fueled outmigration and distrust in institutions. Geography limited colonial interest.”* (Hints at P→C and G’s irrelevance).  

  3. **Referee Panel Brief**:  
     - Rules for challenges, point system, and instructions: *“Verify claims by requesting data from teams or historians. Award/penalize points for defended/withdrawn claims.”*  

  4. **Hidden Truth Envelope**: Sealed until debrief.  

  ---

  #### **III. Roles & Assignment (16 Students)**  
  - **Research Teams (3 teams × 3 students)**:  
    - Team 1: Institutions (data: I and P).  
    - Team 2: Geography (data: G and P).  
    - Team 3: Culture (data: C and P).  
  - **Referee Panel (4 students)**: Validates claims, requests data/historian input.  
  - **Historians (2 students)**: Hold archival folders (Islands 4 and 6).  
  - **Assignment**: Randomly distribute role cards.  

  ---

  #### **IV. Rules & Payoff Scheme**  
  - **Goal**: Teams propose causal claims (e.g., “I causes P”) with:  
    - A **falsifier** (e.g., “If an island has high I but low P, claim is false”).  
    - A **policy implication** (e.g., “Invest in courts”).  
  - **Point System**:  
    - Propose claim: **+2 points**.  
    - Successfully defend against challenge: **+3 points**.  
    - Withdraw claim: **–3 points**.  
    - Referees award **+1 point** per successful challenge (up to +3).  
  - **Challenges**: Teams/referees propose alternative explanations (e.g., “Correlation is driven by U, not I”). Referees vote on challenge success (majority rules).  

  ---

  #### **V. Timeline (90 Minutes)**  
  **0–10 min: Setup**  
  - Assign roles, distribute materials.  
  - Explain rules: *“You’re researchers at a conference. Propose causal claims, defend them, and score points. Historians speak only when asked.”*  

  **10–30 min: Team Prep (20 min)**  
  - Teams analyze data, draft claims with falsifiers/policy implications.  
  - *Sample claim (Institutions): “Strong institutions cause prosperity. Falsifier: High I but low P. Policy: Build courts.”*  
  - Referees plan verification methods (e.g., “We’ll request Island 4’s G data to test geography”).  
  - Historians review archives.  

  **30–40 min: Claim Presentation (10 min)**  
  - Each team writes claim on board. Referees record them.  

  **40–70 min: Challenges & Defense (30 min)**  
  - **Order**: Institutions → Geography → Culture (rotate challengers).  
  - **Process**:  
    1. Challenger (team or referee) proposes alternative (e.g., “Culture team’s correlation is reverse causation!”).  
    2. Defending team responds (2 min).  
    3. Referees/historians provide data if requested (e.g., “Historian 1: Island 4’s institutions preceded prosperity”).  
    4. Referees vote on challenge success.  
  - **Critical Moments**:  
    - **Min 45**: Culture team claims “C causes P” → Geography team challenges: “Prosperity causes culture!” (Reverse causation).  
    - **Min 55**: Institutions team claims “I causes P” → Referees request historian data → Historian 2 notes Island 6’s poverty caused mistrust (confounding).  
    - **Min 65**: Geography team claims “G causes P” → Institutions team challenges: “Geography is a proxy for colonial legacy!” (Omitted variable).  

  **70–75 min: Withdrawal Phase (5 min)**  
  - Teams decide to withdraw claims (lose points) or defend.  

  **75–80 min: Scoring & Tally (5 min)**  
  - Referees announce scores. No winner emphasized—focus on stalemate.  

  **80–90 min: Debrief (10 min)**  
  - **Reveal hidden structure**: Show causal diagram (U→I→P→C; G←U).  
  - **Map Moments to Concepts**:  
    - *Min 45*: Culture team’s confidence (“C causes P”) → **Reverse causation trap** (ignored P→C).  
    - *Min 55*: Institutions team’s reliance on correlation → **Omitted variable bias** (missed U).  
    - *Min 65*: Geography team’s claim → **Proxy variable pitfall** (G stood for U).  
  - **Field’s Resources**:  
    - Acknowledge limits: *“Observational data alone couldn’t break the tie—no natural experiment (e.g., arbitrary borders) was simulated.”*  
    - Supply real-world tools: *“In reality, we use natural experiments (e.g., Korea’s split) or discontinuities (e.g., colonial borders) for leverage. But these are rare and imperfect.”*  
  - **Closing Message**: *“The standoff isn’t about cleverness—it’s structural. We live with it by triangulating methods, admitting uncertainty, and seeking natural experiments.”*  

  ---

  #### **VI. Predictable Failure Modes & Fixes**  
  1. **Teams Merge Data**:  
     - *Prevent*: Rules state: *“No data-sharing—only referees can request cross-team data.”*  
     - *Fix*: Referees penalize offenders (–2 points) and void merged claims.  

  2. **Referees Turn Prosecutor**:  
     - *Prevent*: Brief referees: *“Your role is impartial verification, not advocacy.”*  
     - *Fix*: Intervene: *“Referees, focus on validating methods, not pushing an agenda.”*  

  3. **Historians Dominate**:  
     - *Prevent*: Rule: *“Historians speak only when a team/referee asks about their island.”*  
     - *Fix*: Mute overeager historians; award points only for relevant input.  

  4. **Claims Lack Falsifiers**:  
     - *Prevent*: Circulate during prep, enforcing: *“Your claim must have a clear falsifier.”*  
     - *Fix*: Referees reject vague claims until revised.  

  ---

  #### **VII. What the Activity Cannot Reproduce**  
  - **Natural Experiments**: The simulation lacks arbitrary, exogenous variation (e.g., borders drawn without regard to local conditions). In reality, these provide "quasi-experimental" leverage (e.g., comparing either side of a border).  
  - **How to Address in Debrief**:  
    - *“We couldn’t simulate natural experiments, but they’re key in real research. For example, when colonial borders split ethnic groups, we compare outcomes to isolate institutional effects. Yet even then, debates persist—because social science is hard.”*  

  ---

  #### **VIII. Why This Works**  
  - Students **experience** underdetermination—they can’t resolve the stalemate with given data.  
  - The point system incentivizes bold claims and exposes overconfidence.  
  - Debrief links simulation moments to real concepts (reverse causation, proxies), ending with practical resources (natural experiments).  

  **Outcome**: Students leave feeling the structural limits of observational data—not blaming researchers, but understanding the vertigo of causal inference.
