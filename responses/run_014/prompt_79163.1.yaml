          Minute 80-90: Debrief (10 minutes) - but note, the instructor wants to reveal the hidden structure and map to concepts. We might need more than 10 minutes? Let's extend the debrief to 15 minutes and take 5 minutes from the challenge time? Or we run the activity in 85 minutes and debrief 15 minutes.

          Revised timeline:

            0-5: intro
            5-25: team prep (20)
            25-30: claims (5)
            30-60: challenges (30 minutes: 10 minutes per claim, one challenge per claim and discussion)
            60-70: second round of challenges? Or we skip and go to withdrawal? 
            60-65: teams reconsider and withdraw (5 minutes)
            65-75: final scoring and reflection (10 minutes) - but we haven't debriefed the hidden structure.

          Alternatively, we do:

            0-5: intro
            5-25: team prep
            25-30: claims
            30-50: first round of challenges (20 minutes: about 7 minutes per claim)
            50-60: second round (if any) or open discussion (10 minutes)
            60-65: withdrawal
            65-80: debrief (15 minutes)

          We'll go with:

            0-5: intro
            5-25: team prep (20 min)
            25-30: claims (5 min)
            30-50: first round of challenges (each claim gets one challenge and defense, 6-7 minutes per claim, total 20 min)
            50-60: open floor for additional challenges or referee panel challenges (10 min)
            60-65: teams decide to withdraw (5 min)
            65-80: debrief (15 min)

  6. Debrief (15 minutes):

          - Reveal the hidden causal structure: draw the causal diagram on the board.

            U (colonial legacy, unobserved) is caused by S (soil quality, unobserved). 
            U causes I (institutions) and also directly causes P (prosperity).
            I causes P.
            P causes C (culture).
            G (geography, temperature) is a proxy for S (because S = (G-20)/0.5 approximately? but we don't have the formula) but note: we measured G and not S.

          - Explain that each variable (I, G, C) was correlated with P, but for different reasons:
              I: because it is a cause of P (and also because U causes both I and P).
              G: because it is a proxy for S, which causes U, which causes P.
              C: because it is an effect of P.

          - Map moments in the session to concepts:
              - When the teams first saw the correlation and became confident: that's the "correlation is not causation" moment.
              - When they were challenged with reverse causality (for culture) or confounding (for geography) or common cause (for institutions): these are the standard objections.
              - When they tried to use the historian's information: that's the attempt to use qualitative evidence to break the tie, but it was only for one island and not generalizable.

          - The field's resources: we have to live with this by:
              - Being explicit about the causal assumptions.
              - Looking for natural experiments (like borders drawn arbitrarily) that break the correlation between the unobserved confounder and the variable of interest? But note: we didn't have that in the simulation.
              - Using longitudinal data to establish temporal precedence (but in our simulation, we didn't have time-series).
              - Triangulation with multiple methods.

          - What the activity cannot reproduce:
              - Real research sometimes has non-observational leverage, such as a natural experiment (like a border drawn arbitrarily). We did not include such a feature in the archipelago because we wanted to show the standoff. But in the real world, sometimes we can find such situations.

          - How to supply it in the final 10 minutes? We have already used 15 minutes for debrief? We can mention in the debrief:

              "In the real world, researchers have sometimes found natural experiments that break the correlation between the potential confounders and the variable of interest. For example, consider two regions that share the same culture and geography but were assigned different institutions by a historical accident (like a border drawn arbitrarily). Then we can compare these regions and see if the difference in institutions leads to a difference in prosperity. One such example is the Korean peninsula or the island of Hispaniola. But note: even in these cases, there might be other differences. The natural experiment is not perfect, but it provides a different kind of evidence."

          - Also, we can note that the activity did not allow for interventions (we only had observational data) and that in principle, a randomized experiment would be ideal, but it's often impossible in social science.

  7. What will predictably go wrong:

          a) One team tries to merge data with another team: 
              - How to handle: The rules state that each team only has their own data. They are not allowed to share data with other teams. The referee panel can request data from a team for a specific island, but that request is made to the team and the team provides the data to the referee panel (not to another team). So if a team tries to share, the instructor should step in and remind them that the data is proprietary to each research team and cannot be shared without going through the referee panel (and the referee panel would not allow sharing because they are to evaluate the claims independently).

          b) The referee panel turns prosecutor: They become too aggressive and start challenging everything.
              - How to handle: Remind the referee panel that their role is to be impartial and to evaluate the challenges. They should not be advocating for one theory. The instructor can moderate and ask the referee panel to consider the plausibility of the alternative explanations and not to overreach.

          c) A team cannot come up with a causal claim: 
              - They might be too cautious. The instructor can circulate during the preparation time and encourage them to make a bold claim (it's a simulation, and they can always withdraw later).

          d) The challenges become repetitive: 
              - The instructor can move the discussion along.

          e) The data is not perfectly correlated and a team finds a counterexample: 
              - In our generated data, we tried to avoid that. But if it happens, then that team might be forced to withdraw. That's okay because it shows the noise in data. But note: we want all teams to be in the same boat. So we should check the data beforehand.

          f) The historians are not used: 
              - The instructor can remind the teams that they can call upon the historians to provide context for a particular island when making or challenging a claim.

