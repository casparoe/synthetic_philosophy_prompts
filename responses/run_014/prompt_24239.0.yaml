prompt: |-
  I keep seeing Updateless Decision Theory come up in AI alignment threads and I finally tried to read up on it, but a blog post I found that was supposed to explain it to a general audience left me more confused than before. The post summarized UDT like this: 'UDT is a decision theory that says you shouldn't update your beliefs once you've observed the world. Instead, before you act, you treat your decision process as a function and ask what the expected outcome would be if that function output a particular action. This is what lets you win Newcomb's problem: the predictor is trying to guess what you'll do, but since you're just a deterministic function, it can't really predict you, so you one-box and pocket the million dollars. Basically, UDT is standard Bayesian decision theory with the belief-updating step deleted.'

  I have a nagging feelng this is a bit off, but I don't know enough to say where. Can you go through it and tell me which parts a UDT proponent would actually endorse, which are subtle mischaracterizations, and which are just plain wrong? And does the post's later claim that UDT is only useful for Newcomb-type problems and not for real decisons follow from the accurate parts, or does it depend on the distorted ones?
