prompt: |-
  I've been following the effective-altruism and rationalist discussions for a while now, and I keep seeing the shallow-pond example — you walk past a shallow, muddy pond, you see a child drowning, you can save the child by wading in at the cost of ruining your expensive shoes — used to argue that, if we're serious about consequentialism, we should give much more to the poor, that the moral demand is higher than we think, and that the people who walk past are morally culpable. I also keep hearing the demandingness objection: that if we take the pond seriously, we must give away everything above subsistence, and that this is simply too much. I want to understand how far the pond analogy actually holds. Can you give me the correspondence table — what plays the role of the child, the pond, the passerby, the shallow water, the ruined shoes — and then audit where the mapping breaks? I want you to separate the disanalogies that matter for the intended use (licensing the conclusion that we should give much more) from the ones that don't, identify which features of the pond the analogy quietly imports that the real world of giving lacks, and tell me whether the conclusion survives once the disanalogies are on the table, or whether the analogy was carrying it the whole time. Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and no restating the question.
reasoning: |-
  Okay, the user is deep into effective altruism and rationalist discussions, particularly the shallow pond analogy. They're asking for a detailed breakdown of how the analogy maps to real-world charity and where it falls short. Let me start by recalling the key elements: the drowning child represents those in extreme poverty, the passerby is the potential donor, the shallow water symbolizes that aid is feasible, and the ruined shoes are the cost to the donor. The user's main concern seems to be whether the demandingness objection holds—does the analogy really require giving until subsistence?

  First, I need to map each component accurately. But then I should focus on disanalogies that impact the argument's conclusion. The user wants to know if the analogy secretly imports assumptions that don't hold in reality. For example, proximity and certainty: in the pond, the child is right there, and saving them is certain. In global aid, distance and uncertainty about aid effectiveness might weaken the obligation. Also, partial success—charity often helps partially, unlike saving a life outright.

  Another big point is the scale of need. The pond shows one child, but millions are in need. Does this mean we must help all, leading to overwhelming demands? The user mentioned the demandingness objection, so addressing whether this scalability nullifies the obligation is crucial. Also, psychological factors: in the pond, the emotional pull is immediate, but donating remotely lacks that urgency. Does that affect moral responsibility?

  The user might be wrestling with guilt or pressure to give more but feels the analogy oversimplifies. They need a balanced view: does the core moral principle hold despite disanalogies? I should affirm that proximity isn't morally relevant, and uncertainty can be mitigated by evidence-based charities. Scalability might require setting limits, but not ignoring obligations. The conclusion is that while disanalogies exist, they don't undermine the main argument—we should give more, but maybe not to subsistence if that's counterproductive.

  Need to ensure the response is structured clearly, starting with the bottom line, then mapping, disanalogies, and their impact. Highlight which disanalogies weaken the argument and which don't. Emphasize that effective altruism addresses some issues, like using evidence to reduce uncertainty. The user's deeper need might be seeking validation that they can give meaningfully without extreme sacrifice, or understanding the ethical balance. Make sure the analysis acknowledges both sides but reinforces the EA stance that informed giving is still obligatory.
answer: |-
  **Bottom line:** The shallow pond analogy successfully establishes a *principled* obligation to help distant strangers in severe need when the cost to us is low, but significant disanalogies (especially scale, uncertainty, and diffusion) weaken its ability to mandate *extreme* sacrifice (down to subsistence) in practice, though they don't invalidate the core demand to give *significantly more* than most people currently do.

  ---

  **Correspondence Table:**

  | Pond Scenario Element | Real-World Giving Analogue |
  | :-------------------- | :------------------------- |
  | **The Drowning Child** | Individuals in extreme poverty facing preventable death/suffering (e.g., dying from malaria, starvation). |
  | **The Shallow Pond**   | The global context of extreme poverty and preventable suffering. |
  | **The Passerby**       | Affluent individuals (those with disposable income above basic needs). |
  | **The Shallow Water**  | The existence of proven, cost-effective interventions (e.g., bed nets, deworming, cash transfers). |
  | **Ruined Expensive Shoes** | The financial cost/donation required to save a life or prevent severe suffering. |
  | **Wading In & Saving** | Donating to effective charities that deliver the interventions. |
  | **Walking Past**       | Choosing not to donate significantly to effective poverty alleviation charities. |

  ---

  **Audit of Disanalogies & Their Impact:**

  1.  **Scale & Multiplicity (Crucial Disanalogy):**
      *   **Pond:** *One* child, *one* passerby, *one* immediate act solves the problem definitively for that child.
      *   **Real World:** *Millions* of "children" (people in dire need), *millions* of potential "passersby" (affluent individuals), and saving *one* life requires repeated acts by *many* people (funding ongoing programs). My donation saves a *fraction* of a life statistically.
      *   **Impact on Demand:** This is the core of the demandingness objection. The pond suggests a *binary, absolute duty* ("save *this* child"). The real world presents an *infinite series* of similar demands. Does this mean I must give until I'm destitute? The analogy *imports* the absoluteness of the single case but *lacks* its finitude. This disanalogy makes "give until marginal utility equals beneficiaries" seem implausibly demanding *if taken literally*. **Conclusion:** Significantly weakens the argument for giving *down to subsistence* as a strict moral requirement derived *solely* from the pond logic, but does *not* weaken the argument that we are obligated to give *far more* than we do (i.e., sacrificing significant luxuries).

  2.  **Proximity & Salience (Moderate Disanalogy, Often Overrated):**
      *   **Pond:** Immediate sensory perception. The child is *right here*, the need is vivid and undeniable.
      *   **Real World:** Distant, abstract, mediated through statistics and reports. Suffering is out of sight.
      *   **Impact on Demand:** Often cited psychologically, but ethically, most consequentialists (and EA) argue physical distance is morally irrelevant. The *information* about need and effectiveness (the "shallow water" analogue) is available. This disanalogy explains *why* we fail to act but doesn't *justify* the failure. **Conclusion:** Does *not* undermine the moral argument for giving more; it highlights a cognitive bias we must overcome.

  3.  **Certainty & Efficacy (Moderate Disanalogy, Mitigated by EA):**
      *   **Pond:** Saving the child is certain, immediate, and direct. Cause and effect are clear.
      *   **Real World:** Donation involves uncertainty: Will the charity deliver? Will the intervention work *this time*? Are there unintended consequences? Impact is probabilistic and aggregate.
      *   **Impact on Demand:** This disanalogy *could* weaken the obligation if uncertainty were extreme. However, EA focuses on *evidence-based interventions* with proven high cost-effectiveness (e.g., AMF's bed nets), significantly reducing this uncertainty. While not 100%, the "shallow water" (high efficacy) exists for key interventions. **Conclusion:** Weakens the *certainty* of the obligation compared to the pond, but not its core force when donating to highly effective charities. Demands due diligence in giving.

  4.  **Exclusivity of Responsibility (Crucial Disanalogy):**
      *   **Pond:** Only the passerby is present. Failure to act means certain death for the child. Responsibility is clear and undiluted.
      *   **Real World:** Many potential helpers exist. My failure to donate *might* be compensated by others (though often isn't). Responsibility is diffused. The child dies whether I act or not if others don't step in sufficiently.
      *   **Impact on Demand:** This fundamentally challenges the "you *must* save *this specific child*" intuition. The pond imports the idea of unique, decisive agency. In reality, my $100 is a drop in the ocean, and the need persists regardless. EA counters with marginal impact: *my* donation still saves a marginal life (statistically) and I can't rely on others acting. **Conclusion:** Significantly complicates the "rescue" framing. It weakens the *unique personal duty to a specific individual* but strengthens the *collective duty* and the *marginal impact* argument for individual giving. Doesn't eliminate obligation, but shifts its nature.

  5.  **Scope of Harm Prevented (Minor Disanalogy):**
      *   **Pond:** Prevents a specific, catastrophic harm (death) to one individual.
      *   **Real World:** Donations often prevent death *or* severe suffering (blindness, disability, chronic illness), *and* can enable positive goods (education, economic opportunity). Impact is broader.
      *   **Impact on Demand:** This arguably makes giving *more* compelling, not less. Preventing severe suffering or enabling flourishing is also morally significant. **Conclusion:** Strengthens or at least doesn't weaken the core argument for giving.

  6.  **Cost/Benefit Ratio (Moderate Disanalogy, Context-Dependent):**
      *   **Pond:** Ruined shoes vs. a life saved. Benefit vastly outweighs cost.
      *   **Real World:** Cost to save a life varies (~$3k-$10k for top charities), but is still low relative to affluent incomes. However, the *cumulative* cost of addressing all need is astronomical.
      *   **Impact on Demand:** For *individual acts* (donating $X), the ratio remains highly favorable (like ruined shoes vs. a life). The demandingness comes from the *repetition* (Scale disanalogy). **Conclusion:** Supports the argument that *many* acts of giving are morally required (sacrificing luxuries), but doesn't by itself dictate *how many* such acts are required before the cost to the giver becomes excessive.

  ---

  **Survival of the Conclusion:**
  The analogy successfully demonstrates that **physical distance and lack of personal connection do not negate a strong moral obligation to help when the cost to us is low relative to the benefit provided.** This core principle survives the disanalogies. The demand to give *significantly more* – sacrificing substantial luxuries to fund highly effective interventions – is robust.

  However, the disanalogies (especially **Scale, Diffusion of Responsibility, and Cumulative Cost**) severely undermine the analogy's ability to straightforwardly mandate **giving until one reaches the marginal utility of the beneficiary (subsistence level)** as a *practical* or *psychologically realistic* demand derived *purely* from pond-like intuitions. The analogy "carries" the intuition of an absolute, binary duty in a finite scenario, but the real world is non-binary and effectively infinite. EA often responds by advocating for defined giving pledges (e.g., 10%) based on capacity and effectiveness, acknowledging the psychological and practical limits while still demanding far more than typical giving. The conclusion that we should give *much more* survives; the conclusion that we must give *absolutely everything* above subsistence relies more heavily on the imported finite/binary structure of the analogy and struggles under the weight of the disanalogies.
