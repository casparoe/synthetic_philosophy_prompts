answer: |-
  ## The Canvas and the Candle

  The envelope felt heavier than its contents merited. Aris traced the embossed logo – *Veridian Gallery* – with a thumb calloused by turpentine and time. Inside, the contract lay crisp, the numbers in the ‘commission fee’ box dazzling even in the dim light of his cramped studio. Enough to clear his debts, buy decent paints for a year, maybe even afford a studio with actual heating. Enough to live, not just scrape by.

  The commission was simple, perversely so: *One portrait, subject: Elara. Completed by Friday. Payment upon public display and… subsequent immolation.*

  Immersion. Burning. At the opening of Veridian’s controversial "Transience" exhibition. Aris had read the clause three times. Elara. His Elara. Not just any portrait, but one capturing her final weeks. The fragile luminosity beneath the wasting illness, the way the light clung to her cheekbones like a last, desperate prayer. He’d lived it. He’d painted it privately, obsessively, in the raw months after she died – canvases hidden away, saturated with grief he couldn’t bear to look at, let alone destroy.

  "You understand the concept, Mr. Vale?" Silas Crane, Veridian’s sleek director, had purred over coffee that smelled too expensive. "The market hungers for authenticity, for the *real* sacrifice. The act of creation, consumed by its own fire. Your personal connection… it’s invaluable. The pain on the canvas *will* translate. And the act of burning it… that’s the performance, the ultimate testament to ephemerality, to the artist’s willingness to surrender his most precious work to the void." Crane’s eyes gleamed, not with malice, but with the cold avarice of someone who traded in anguish. "Think of the statement. Think of the zeros."

  Aris *was* thinking of the zeros. He was also thinking of the jagged hole Elara left, the rent he couldn’t pay, the tubes of paint squeezed dry. He thought of the hidden paintings, heavy with unshared sorrow. Could he do this? Could he dredge it all up again, deliberately, for money? Worse – could he paint it *knowing* he had to watch it curl and blacken in front of Crane’s chic, indifferent crowd?

  Sam’s voice echoed from their marathon argument just hours before, about Kavka and his damnable toxin: *"Just form the intention now, Aris! Take the deal, paint the damn thing. When Friday comes, you just… burn it. It’s like Newcomb’s Box. You decide now, commit now, and then the future action follows naturally."*

  But Sam hadn’t held Elara’s cooling hand. Sam wasn’t staring at a contract demanding he incinerate her ghost, captured anew. *"It’s not a box, Sam,"* Aris had argued back, frustration sharp in his throat. *"It’s my guts on a canvas. Forming the intention *now* to burn it *then*… when I know, I *know*, when I see it finished, when I feel that connection again… I won’t *want* to. How can an intention be real if you already know you’ll betray it?"*

  Now, alone with the contract, the argument felt like a scratched record, stuck in a maddening loop in his skull. *Form the intention.* Commit. Take the money. Paint. Then burn. It sounded so linear, so rational. But rationality felt like a suit three sizes too small when dealing with the visceral specter of loss.

  He signed. The pen scratched loud in the quiet studio. A decision made. An intention formed. The zeros shimmered, a lifeline. He wired the instructions to his bank. The money was his. Now, he had to paint.

  ***

  The studio became a time capsule. Aris hauled out the hidden paintings – raw, chaotic studies of Elara’s decline. He surrounded himself with photographs he hadn’t dared look at: Elara laughing before the diagnosis, Elara pale but defiant in a hospital chair, Elara’s eyes holding a universe of weary love in her final days. The smell of linseed oil and memories thickened the air.

  He stretched a fresh canvas. Large. Imposing. The blankness accused him. He mixed paints – the specific alizarin crimson that matched the fever-flush on her cheeks, the fragile Naples yellow for the sunlight on her hospital sheets, the deep, unsettling Payne’s grey for the shadows gathering beneath her eyes. Each colour was a memory, sharp as glass.

  The first strokes were tentative, haunted. Then muscle memory and grief took over. His hand moved, guided by a sorrow etched deep in his bones. Elara emerged from the white void, not as she was in life, but as she existed in his memory of those last days – ethereal, fading, yet radiating a terrible, fragile beauty. He painted the translucence of her skin over the blue veins, the way her collarbones stood out like delicate wings, the profound exhaustion and acceptance in her gaze. He painted the love that had been their anchor, and the abyss that was waiting.

  As the image solidified, so did the conflict. The *intention* – burn it – felt like a distant, absurd abstraction. This wasn't just pigment on linen; it was a resurrection. He felt her presence in the room, a cold breath on his neck, a phantom weight on the stool beside him. The act of creation was a re-living, a communion. How could he destroy this? How could he *choose* to erase her face, painstakingly rendered, all over again?

  *Form the intention,* Sam’s voice insisted. *You decided. The money is spent. The commitment is made. Burning it is just the last step.*

  But Aris stared at the luminous, sorrowful eyes on the canvas, eyes that held his own reflection, and a cold certainty washed over him: *I cannot burn this.* The intention formed days ago, fueled by desperation and Crane’s cynical logic, felt hollow, fraudulent. It was an intention predicated on ignoring who he *knew* he would be when confronted with the finished work. He would be a man looking at the distilled essence of his love and loss. He would be incapable of striking the match.

  He tried to rationalize. The money was real. The debts were paid. He could paint *another* portrait of Elara later, one to keep. But he knew it wouldn't be the same. This painting held the immediacy of his reopened wound. It was unique, born of this specific, terrible contract. Keeping it would be a betrayal of the *intention*, but burning it felt like a betrayal of Elara, of his own heart, of the truth he’d poured onto the canvas.

  The tension wasn't philosophical; it was physical. A cramp in his gut whenever he looked at the nearly finished portrait. A metallic taste of panic when he imagined the gallery, the crowd, the smell of burning linen and paint. He’d *formed* the intention. He’d signed. He’d taken the money. Logically, he *should* burn it. Morally? Aesthetically? Emotionally? The idea was monstrous.

  Friday dawned grey and damp. The portrait was finished. Aris hadn’t slept. He’d draped a cloth over it, unable to bear its accusatory gaze. Crane’s assistant arrived with efficient indifference to collect the canvas for the evening’s exhibition. Aris watched them wheel it away, the covered shape looking like a body on a gurney. His stomach twisted.

  ***

  Veridian Gallery hummed with the low thrum of money and cultivated curiosity. Chrome and glass reflected the glittering crowd sipping champagne. Aris felt like a ghost haunting his own execution. He wore a borrowed suit that itched. Crane materialized, clapping him on the shoulder with reptilian warmth.

  "Magnificent, Vale! Truly harrowing. The crowd is buzzing." He gestured towards the far end of the long, white space. "It’s the centerpiece. The immolation chamber is set up beautifully beside it. Very dramatic."

  Aris saw it. His painting, Elara’s final gaze, hung alone on a stark white wall, spotlit with cruel perfection. Beside it stood a simple, blackened metal brazier, tall and ominous. A small table held a single, long match and a heavy glass ashtray. It looked obscenely clinical.

  People clustered around the portrait. Aris heard murmurs: "So raw..." "Devastating..." "Brave..." He felt sick. Brave? It felt like pimping out his grief. He edged closer, drawn against his will. Seeing it here, in this sterile temple of commerce, amplified its power and his revulsion. It wasn’t just a painting anymore; it was a testament, a sacred object. The thought of reducing it to ash in this setting felt like a desecration.

  He remembered signing the contract. The intention. *Form the intention now, act later.* But the ‘later’ was now. The moment of action loomed. He could feel the phantom weight of the match in his hand, the imagined heat of the flame, the sickening smell of burning oil paint – a smell he usually loved, now turned nauseating.

  Crane tapped a microphone. The hum died. "Ladies and Gentlemen... welcome to 'Transience'. Tonight, we confront the fleeting nature of beauty, memory, and art itself. Our centerpiece, Aris Vale's poignant portrait of his late wife, Elara, embodies this confrontation. The act of creation... and the act of release." He gestured grandly. "Aris, the moment is yours. Let the transience begin."

  A spotlight swung onto Aris, blinding him. A ripple of expectant applause. He felt hundreds of eyes on him. Crane subtly nudged him towards the table holding the single match.

  Time slowed. The gallery noise receded to a dull roar in his ears. The intention – formed days ago, signed in ink, paid for in zeros – warred with the visceral reality before him. Elara looked out from the canvas, her painted eyes holding a universe of quiet knowing. *You brought me here,* they seemed to say. *What will you do now?*

  He walked towards the table, each step heavy. The polished surface reflected the distorted lights of the gallery. The match lay there, innocuous, potent. He picked it up. The wood was smooth, cool. The red phosphorous tip stared back like a tiny, unblinking eye.

  Sam’s voice: *"Just form the intention. Now you just do it. It's the only rational choice."* But rationality felt like ice, and his heart was molten lead. *Can an intention be real,* his own voice argued back, *if you knew all along that when the moment came, faced with the reality of the action, you would recoil? Was it ever more than a desperate lie you told yourself to get the money?*

  He looked at the painting, a lifetime of love and loss condensed into pigment. He looked at the brazier, a gaping maw. He looked at the match in his trembling hand.

  The crowd held its breath. Crane watched, a faint, expectant smile playing on his lips. The silence was absolute, pressing in on Aris like a physical weight.

  His thumb moved towards the rough strip on the matchbox embedded in the table. The tiny rasp echoed in the cavernous quiet. A spark flared, impossibly bright in the focused light, catching the tip of the match. A small, determined flame blossomed, dancing at the end of the slender wood, casting flickering shadows on his face and on the expectant faces of the crowd.

  He raised the match, its tiny fire a beacon in the hushed gallery. The flame trembled, not from the air, but from the hand that held it. It illuminated the stark choice: the canvas radiating its silent, sorrowful beauty, and the dark, waiting maw of the brazier.

  The flame climbed the matchstick, hungry, relentless. It reached the halfway point, a small, consuming sun held suspended between creation and oblivion. Aris’s eyes were locked not on the brazier, but on Elara’s painted eyes, deep pools reflecting the dancing, miniature fire. Time stretched, thin and brittle. The only sound was the faint, eager crackle of the burning wood in his hand, inching closer to his fingers.

  He stood perfectly still, the match held aloft, the flame devouring the present moment. The future – the painting saved, the painting consumed, the intention fulfilled, the intention shattered – hung in the balance, as fragile and final as the ash forming at the flame’s edge. The light flickered across his face, revealing nothing but the intensity of the unanswerable question burning within him.
