  The user also asks what could move the debate. Here, I should consider interdisciplinary approaches. Neuroscience and developmental psychology might offer new insights. For instance, brain imaging showing overlapping neural circuits for real and imagined emotions could challenge the quasi-emotion theory. Developmental studies on children's pretend play might reveal how early these responses develop, indicating if they're innate or learned.

