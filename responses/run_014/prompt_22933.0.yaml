  However, note that in move 5, Dana is making a valid point about the practical challenges of early stopping (if not done properly), but Marcus counters it by mentioning sequential methods. So overall, Marcus has the stronger argument.

  Justification for each score:

  - **1**: Dana's initial argument is correct in a vacuum of zero cost, but she doesn't consider costs. So it's partially correct. Score 1.
  - **2**: Marcus correctly points out the ex ante vs ex post distinction. Score 2.
