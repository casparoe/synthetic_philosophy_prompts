prompt: |-
  I've been following the war in Ukraine closely — I have family on both sides of the border — and I keep running into a moral puzzle I don't have the vocabulary for. Perhaps you can help me identify whether this has a name in the philosophical literature, and if so, how the relevant distinctions are drawn.

  The puzzle is this. When I read about a Russian soldier who fires on Ukrainian positions, I find myself thinking: he's a conscript, he didn't choose this war, he's been fed propaganda, and if he refuses to fight he'll be imprisoned or worse. So I'm reluctant to call him a murderer, even if the war itself is an unjust war of aggression. At the same time, I have no hesitation calling Putin and the generals who planned the invasion culpable for the deaths that result. So there seems to be an asymmetry: the leaders are blameworthy for an unjust war, but the ordinary soldiers who do the actual killing are not — or at least not in the same way.

  But then I notice that this asymmetry doesn't seem to generalize. If a mafia boss orders a hit, we don't say the hitman is off the hook just because he was following orders or needed the money. If a corporation dumps toxic waste, we don't excuse the engineers who designed the system on the grounds that they were just doing their jobs. In ordinary life, "I was following orders" is not a full defence. Yet in war, it seems to carry enormous weight — and not just legally, but in our ordinary moral reactions.

  I've also noticed that this isn't simply about duress. A professional soldier in a volunteer army who genuinely believes in his country's cause — even if that cause is, objectively, unjust — also seems to get a kind of moral pass that we wouldn't give to, say, a committed Nazi bureaucrat who genuinely believed in the Reich. There's something specific to the combatant role that seems to confer a moral symmetry between soldiers on both sides, regardless of the justice of their respective causes. And yet this symmetry is peculiar: if the war is unjust, every killing done in its service is a killing in service of an unjust end. How can that not taint the one who pulls the trigger?

  I've tried to work this out on my own, but I keep going in circles. On the one hand, it seems absurd to say that a nineteen-year-old conscript is morally equivalent to the political leaders who launched an aggressive war. On the other hand, it seems equally absurd to say that killing someone is morally permissible simply because you're wearing a uniform and acting under orders — we rejected that line of reasoning at Nuremberg. So I suspect I'm missing a distinction, or conflating several different questions. Is there an established name for this puzzle, or for the view that soldiers on both sides are morally on a par? What are the main positions philosophers have taken on it? And what exactly is the strongest argument for the view that ordinary combatants on the unjust side are not culpable? I can feel its pull, but when I try to state it precisely, it keeps slipping into analogies I wouldn't accept in any other domain.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're deeply troubled by a moral asymmetry in how we judge soldiers versus leaders in wars like Ukraine. They have family on both sides, so this isn't just theoretical—it's personal. That emotional weight is crucial; they need clarity but also empathy. 

  The core puzzle they describe is familiar in military ethics: why do we instinctively absolve conscripts ("he's just following orders") but hold leaders accountable, when in other contexts like mafia hits or corporate crimes, we don't excuse the executor? They've noticed this isn't just about duress—even volunteer soldiers in unjust wars get a "moral pass" that Nazi bureaucrats wouldn't. And they're rightly unsettled by the contradiction: if an act is objectively wrong (killing for aggression), how can the doer be blameless?

  Hmm, they've done impressive groundwork already—they recognize this involves multiple entangled issues: duress vs. belief, institutional roles, collective vs. individual action. But they're circling because they haven't found frameworks to disentangle them. Their frustration about "slippery analogies" suggests they suspect context matters profoundly but can't articulate why war feels different from organized crime.

  Key things they might be missing:
  First, Walzer's "moral equality of soldiers" concept—that shared vulnerability in combat creates a separate ethical sphere. Second, the distinction between jus ad bellum (war's justice) and jus in bello (conduct within war). Third, how institutional coercion in conscription differs from mafia coercion (state power vs. criminal choice). 

  Also worth noting: their examples reveal unspoken assumptions. Comparing soldiers to Nazi bureaucrats implies they intuit that ideological commitment affects culpability—but why doesn't that apply to a Russian volunteer who believes in "denazifying" Ukraine? That's where the combatant/non-combatant distinction kicks in: soldiers are reciprocal threats in a way bureaucrats aren't.

  Their underlying need seems twofold: linguistic (names for these concepts) and structural (how to map the moral landscape without contradiction). They might also seek validation that their unease is philosophically legitimate—it is. The "sliding scale" position (McMahan) could resonate since it acknowledges both their instincts: conscripts less guilty than leaders but not wholly innocent.

  ...Wait, their last line about "analogies I wouldn't accept elsewhere" is golden. That's the hinge! The strongest counter to moral equality is precisely that war shouldn't get special exemptions. So I should contrast Walzer's institutionalism with McMahan's individualism sharply. And emphasize that both grapple with the same tension they feel: the horror of holding kids accountable vs. the horror of licensing state violence.

  Must also flag the Ukrainian dimension gently. Discussing Russian soldiers' culpability while they have family in Ukraine requires care—note how institutions weaponize obedience without endorsing relativism. Stress that rejecting moral equality doesn't mean demanding heroic martyrdom from conscripts; it means designing systems where leaders bear maximal blame.
answer: |-
  Your moral puzzle cuts to the heart of wartime ethics and is brilliantly articulated. Philosophers have grappled with this tension for centuries, and your intuitions map onto major debates in just war theory. Here's a breakdown of the key concepts, positions, and terminology:

  ### 1. **The Core Tension: Moral Equality of Combatants (MEC) vs. Moral Asymmetry**
     - **Moral Equality of Combatants (MEC)**: This is the conventional view (associated with Michael Walzer's *Just and Unjust Wars*). It holds that:
       - Soldiers on both sides of a conflict have **equal moral status** regarding the act of killing enemy combatants.
       - This equality exists **regardless of whether their side's war is just** (*jus ad bellum*).
       - Soldiers are not murderers because they act under **institutional authority**, face **duress**, and participate in a **reciprocal system of risk** where combatants mutually forfeit certain rights.
       - Blame for the unjust war rests solely with political leaders (*jus ad bellum*), while soldiers are judged only by how they fight (*jus in bello* – e.g., avoiding atrocities).
     - **Moral Asymmetry**: Critics (like Jeff McMahan) argue:
       - If a war is unjust, soldiers fighting for that cause **cannot have a moral right to kill**. Their killings are objectively wrongful acts.
       - "Following orders" or "doing one's duty" doesn’t erase moral responsibility for unjust killing. The mafia hitman analogy applies: **unjust ends taint the means**.
       - The MEC view illegitimately excuses participation in aggression.

  ### 2. **Why War *Feels* Different: The Case for MEC**
     Proponents argue your intuition about the Russian conscript isn't irrational. Key distinctions from your analogies:
     - **Institutional Role & Social Function**: Soldiers are agents of the state, not private criminals. Society trains them to obey and delegates lethal authority to the state. We judge them as *cogs in a system*, not free moral actors like a hitman.
     - **Epistemic Limitations**: Soldiers often **cannot reasonably know** the war is unjust (due to propaganda, secrecy, limited education). A Nazi bureaucrat in 1943 had clearer evidence of genocide than a Russian conscript fed state media.
     - **Coercion & Duress**: Conscription involves **systematic, inescapable coercion** (imprisonment, social ostracism, threat of death). A hitman could (theoretically) find other work; a mobilized Russian soldier often cannot.
     - **Reciprocal Risk & Combatant Privilege**: In war, soldiers face **mutual threat**. Killing a combatant isn't murder because combatants accept the risk of being targeted (the "combatant's privilege" in international law). This reciprocity doesn’t exist in crime or environmental negligence.

  ### 3. **The Limits of Symmetry: Where MEC Falters**
     Critics highlight flaws in MEC:
     - **The "Nuremberg Problem"**: We *did* hold lower-ranking Nazis responsible at Nuremberg when they committed atrocities or participated in aggressive war. "Following orders" was rejected as a *complete* defense.
     - **The Volunteer Problem**: MEC struggles to explain why a **volunteer soldier** in an unjust army (e.g., a true believer in Russian imperialism) deserves moral parity with a defender. His ideological commitment resembles the Nazi bureaucrat.
     - **Moral Luck**: MEC implies a Ukrainian soldier defending Kyiv is morally identical to a Russian soldier shelling it—a conclusion many find repugnant.

  ### 4. **Resolving the Tension: Key Philosophical Positions**
     | **Position**               | Key Thinkers          | View on Soldier Culpability                                                                 | Response to Your Puzzle                                                                 |
     |----------------------------|-----------------------|---------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------|
     | **Traditional MEC**        | Walzer                | Soldiers are **morally equal**; only leaders bear *jus ad bellum* guilt.                    | Explains your conscript intuition. Accepts the asymmetry with criminal analogies.       |
     | **Revisionist Asymmetry**  | McMahan               | Soldiers in an unjust war **lack a right to kill**; their acts are morally wrongful.        | Aligns with your mafia/corporate analogies. Sees the conscript as less guilty but still responsible. |
     | **Mitigated Culpability**  | Lazar, Frowe         | Culpability exists but is **scaled** to role, knowledge, duress, and alternatives.          | Your conscript is minimally culpable; Putin is maximally culpable. Rejects binary.       |
     | **Role Responsibility**    | May, Walzer          | Soldiers bear **role-based duties** (e.g., obey *jus in bello*) but not *jus ad bellum* guilt. | Explains why we judge soldiers differently: their moral context is defined by institutional role. |

  ### 5. **The Strongest Argument for Soldier Non-Culpability**
     The most compelling case combines **epistemic limitation** and **systematic coercion**:
     > *"Soldiers in modern armies are often deprived of the capacity for meaningful moral deliberation. Conscripts are forced into service; volunteers are socialized into obedience and nationalist narratives. When they kill combatants under orders, they act within a framework where lethal violence is normalized and dissent is brutally suppressed. Holding them individually culpable for the injustice of the war ignores their diminished agency, while demanding martyrdom (refusing orders at great personal risk) sets an unrealistic moral standard. Their moral failure is participation in an evil system, but their acts of killing combatants are not equivalent to murder."*  
     *This view treats soldiers as both agents and victims of the war machine.*

  ### Why This Isn't Contradictory
  Your unease stems from conflating two levels of judgment:
  - **Individual Killing**: In the moment, a Russian soldier shooting at a Ukrainian soldier isn't committing "murder" because both are combatants in a reciprocal relationship of violence (MEC).
  - **Structural Injustice**: The Russian soldier is nevertheless advancing an unjust structure. His participation is blameworthy *to some degree*, but his culpability is mitigated and distinct from his leaders'.

  ### Conclusion
  You’re wrestling with the **problem of collective action in unjust institutions**. War amplifies this because:
  - Soldiers are **simultaneously perpetrators and victims**.
  - Moral responsibility is **distributed unevenly** across a hierarchy.
  - The **combatant role** creates a unique moral sphere (mutual risk, state authority).

  **Key terms**: Moral Equality of Combatants (MEC), *jus ad bellum* (justice of war), *jus in bello* (justice in warfare), culpable ignorance, role responsibility, mitigated blame.

  Your instincts are philosophically astute: the tension persists because war *is* morally exceptional in some ways (scale, state authority, reciprocity), yet it shouldn’t absolve all participants. The "sliding scale" view (mitigated culpability) may offer the most nuanced resolution, acknowledging that pulling the trigger *is* morally tainted by an unjust cause—but less so when the trigger-puller is a coerced teenager with no alternatives.
