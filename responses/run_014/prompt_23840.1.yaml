  Now, word count: I need to be brief. Response outline: state tiers with one-sentence explanations. Aim for clarity and stay under limit.

  Final ranking: UDT in top tier due to superior performance on mugging and hitchhiker, EDT next for hitchhiker handling, CDT last for failures. Commitment races lower UDT slightly, but not enough to drop it.
