answer: |-
  You've hit the nail on the head. The "evo psych wars" are a fascinating case study in the philosophy and sociology of science precisely because they demonstrate how **persistent disagreements can persist even when parties nominally agree on core methodological principles.** Your hunch that the disagreement runs deeper than surface-level methodology is astute. Here's a diagnosis of the layers of disagreement and what might move things forward:

  ## Layers of Disagreement

  1.  **Deep Prior Commitments / Intuitions (The Foundational Layer):**
      *   **Adaptationism as Default vs. Null Hypothesis:** Defenders often operate with a strong prior belief that complex, species-typical psychological traits *are very likely* adaptations shaped by natural selection. Critics operate with a much weaker prior – they see adaptation as *one possible explanation*, but not the default, and require strong evidence to rule out alternatives (phylogenetic inertia, developmental constraints, byproducts/spandrels, cultural evolution). This difference in starting priors massively influences how they interpret evidence.
      *   **Intuitions about Human Nature:** Evo psych often makes claims about universal human nature (e.g., sex differences in mate preferences). Defenders see this as illuminating fundamental truths. Critics often see this as potentially reductive, biologically determinist, or ignoring plasticity and cultural variation. This taps into broader philosophical/political debates about free will, social constructivism, and equality.
      *   **Intuitions about the "Plausibility" of Stories:** What sounds like a compelling, parsimonious adaptive story to a defender can sound like a post-hoc rationalization built on untestable assumptions about the EEA to a critic. The "satisfaction" derived from an explanation differs.

  2.  **Epistemological Stance (How We Know Things About the Deep Past):**
      *   **Inference to the Best Explanation (IBE) & Underdetermination:** Both sides agree IBE is used in historical sciences. The core dispute is **how well evolutionary psychology can *actually* fulfill the "best" part of IBE given the constraints.**
          *   **Defenders:** Argue they generate multiple competing hypotheses and test them against evidence (cross-cultural data, comparative primatology, genetics, neuroscience, behavioral experiments). Finding a hypothesis that fits diverse lines of evidence makes it the "best" available explanation, even if not definitively proven.
          *   **Critics:** Argue that the hypotheses are often *so flexible* and the data about the EEA *so sparse* that many radically different adaptive stories (and non-adaptive explanations) can fit the same modern data. The "evidence" cited is often consistent with the hypothesis but doesn't *discriminate* effectively between it and alternatives. This is the **underdetermination problem** at its most acute.
      *   **Evidential Standards for Adaptation:** How many independent lines of evidence are *sufficient*? How strong must the evidence be to overcome the prior skepticism about reconstructing the past? Defenders often accept consistency with theory + some empirical support as strongly suggestive. Critics demand evidence that specifically rules out major alternative explanations (e.g., demonstrating the trait *was* a target of selection via specific genetic signatures, showing its absence in closely related species where the selective pressure differed, demonstrating its fitness consequences *in ancestral-like conditions* – all very hard).

  3.  **Methodological Execution (The Practical Layer):**
      *   **Factual Dispute about Research Practice:** This *is* a component. Critics point to specific papers they argue are pure storytelling. Defenders point to specific papers they argue exemplify rigorous hypothesis testing with multiple methodologies. The disagreement often centers on whether the "tests" employed genuinely rule out plausible alternatives or are merely consistency checks. Both sides can find examples to support their view because the *quality* of research within evo psych varies significantly.
      *   **Defining "Test":** This can be partly verbal. Defenders often count:
          *   Cross-cultural universality (critics: could be phylogenetic inertia or current shared environment).
          *   Sex differences aligning with predictions (critics: could be socialization).
          *   Experimental manipulations showing predicted responses (critics: these test current function/predispositions, not necessarily past adaptation).
          *   Consistency with known aspects of the EEA (critics: highly speculative).
          *   Fit with evolutionary models (critics: models can be built to fit the data).
      Critics often reserve "test" for methods that more directly address historical causation or rule out key alternatives (e.g., comparative phylogenetic analysis, paleo-environmental data linked to trait variation, specific genetic evidence of selection).

  4.  **Sociological/Ideological Factors:**
      *   **Perceived Political/Social Implications:** Evo psych findings are often seen (by both advocates and critics) as having implications for social policy, gender relations, etc. This raises the stakes and can fuel motivated reasoning on both sides. Critics fear biological determinism justifying inequality; defenders fear political correctness stifling scientific inquiry into human nature.
      *   **Tribalism and Sunk Costs:** After decades of heated debate, positions have hardened. Changing one's mind becomes difficult professionally and personally.

  ## What Kind of Disagreement Is This?

  It's primarily a **complex hybrid disagreement**:

  1.  **A deep clash of prior probabilities and intuitions** about adaptationism and human nature (foundational).
  2.  **An epistemological disagreement** about the feasibility and evidential standards required for robust inference to past adaptation in psychology, given the severe underdetermination problem (core).
  3.  **A methodological disagreement** about the adequacy of current research practices to meet even agreed-upon standards and the definition of a meaningful "test" (practical).
  4.  **With factual and sociological components** regarding specific research quality and social/political stakes.

  ## What Could Move the Debate?

  Permanent stalemate is likely *on the core philosophical/epistemological questions* about the deep past. However, progress *is* possible on specific research programs and the overall credibility of the field:

  1.  **Methodological Rigor & Sophistication:**
      *   **Formal Modeling:** Using evolutionary game theory or genetic models to derive *specific, counter-intuitive predictions* that are harder to explain away by alternatives.
      *   **Stronger Comparative Methods:** Rigorous phylogenetic comparative analyses across primates/hominins (where possible) to test hypotheses about trait origins and correlations with ecological variables.
      *   **Integration with Genetics:** Leveraging ancient DNA, selection scans, and GWAS to find evidence of *past selection* on traits or genetic correlations that support adaptive hypotheses. This directly addresses the "just-so" criticism when possible.
      *   **Testing Present-Day Fitness Consequences:** While not proving past adaptation, demonstrating that a trait *currently* impacts fitness (e.g., in traditional societies) makes an adaptive hypothesis much more plausible and testable than pure speculation about the EEA.
      *   **Ruling Out Alternatives:** Proactively designing studies to test adaptive hypotheses *against* specific non-adaptive alternatives (e.g., byproduct hypotheses derived from known developmental mechanisms).
      *   **Nuance on Universality:** Moving beyond simplistic "universal human nature" claims to models incorporating gene-culture coevolution, adaptive plasticity, and conditional strategies.

  2.  **Shifting Focus (Slightly):**
      *   **From EEA Speculation to Current Function:** Emphasizing the analysis of *current* design features and their potential fitness consequences, rather than definitive claims about *past* selective pressures. This aligns better with what much of the data can actually test.
      *   **From Grand Theories to Midspecific Mechanisms:** Focusing on more constrained, well-defined psychological mechanisms with clearer links to biology (e.g., specific aspects of fear, disgust, social learning) rather than broad traits like "mating strategies" or "aggression," which are harder to pin down evolutionarily.

  3.  **Epistemological Honesty:**
      *   Acknowledging the severe constraints of historical inference in psychology more openly. Framing hypotheses as "plausible scenarios consistent with evolutionary theory and available data" rather than established facts. Explicitly discussing limitations and alternative explanations.

  4.  **Technological Advancement:**
      *   Advances in neuroscience (linking brain mechanisms to evolutionary hypotheses), genetics, paleoanthropology, and big-data analysis of cultural variation may provide new, more direct lines of evidence previously unavailable.

  ## Conclusion

  The stalemate arises because the core issue – robustly inferring past psychological adaptations – is **incredibly hard, arguably harder than in paleontology or geology.** The disagreement is fundamentally about **whether the inherent difficulties and underdetermination are surmountable with current or foreseeable methods** (defenders: yes, cautiously; critics: no, or only rarely). While improved methodologies and a shift towards testable present-day function can make specific research programs more convincing and move the field forward incrementally, the deep epistemological divide about reconstructing the psychological past is likely to persist. The most productive path is focusing on generating specific, testable predictions about *current* human cognition and behavior grounded in evolutionary biology, while rigorously ruling out non-adaptive explanations, and being transparent about the limits of historical inference. Permanent stalemate on the grand philosophical questions is likely, but better science can still be done within the constraints.
