prompt: |-
  ok so before i read yet another paper trying to solve the heterogeneity problem for hedonism, i want the spec sheet. what does an account of what all pleasures have in common actually need to deliver to count as adequate? i want the full list of desiderata, with the case or consideration behind each.

  things i'm wondering about: which paradigm cases must it unify — the pleasure of a back scratch, of solving a proof, of schadenfreude, of heroin, of listening to a symphony? are there cases it's allowed to exclude as not-genuinely-pleasurable, and if so what's the principle for drawing that line? does the account need to also explain the difference between pleasure and pain, or is that a separate job? does it need to explain why pleasure is good (the normativity bit), or just identify the common feature and leave the value claim to hedonism proper? what about mill's higher/lower pleasures distinction — is accommodating that a genuine requirement or just one camp's baggage? and what about cases like guilty pleasures or the masochist where the felt quality seems positive but the person's attitude toward it is negative — does the account have to get those right or can it set them aside as edge cases?

  flag any pairs of desiderata you think are in tension. then briefly score the main approaches — felt-quality views, attitude/desire views, whatever else is out there — against the list. i care more about the criteria than the scoring, so weight it that way.
reasoning: |-
  Okay, the user is asking for a comprehensive list of desiderata for an account of what all pleasures have in common. They want the full specifications before diving into another paper on hedonism's heterogeneity problem. Let me unpack their query. They mention specific examples: back scratch, solving a proof, schadenfreude, heroin, listening to a symphony. These are diverse, so the account must cover sensory, intellectual, social, chemical, and aesthetic pleasures. 

  The user also questions which cases can be excluded. Maybe things like relief (which might be absence of pain) or contentment (if it's too diffuse). They want to know the principle for exclusion. Then there's the relationship between pleasure and pain. Should the account differentiate them intrinsically or is that a separate issue? 

  Normativity is another point. Does the theory need to explain why pleasure is good, or just identify the common feature? Hedonism as a value theory might handle the goodness part. Mill's higher/lower pleasures distinction comes up—is accommodating this necessary, or optional? The user seems skeptical about it being baggage. 

  Cases like guilty pleasures or masochism where the feeling is positive but the attitude is negative. Are these edge cases or central? The user wants to know if the account must resolve these or can set them aside. 

  They also want any tensions between desiderata flagged. For example, unifying diverse phenomena vs. excluding non-paradigm cases. Or accommodating higher/lower pleasures without overcomplicating. 

  Then, a brief scoring of main theories: felt-quality, attitude/desire, etc. But the user cares more about the criteria. 

  I need to structure the desiderata systematically. Start with unity: must cover all paradigm cases without stretching definitions. Exclusion criteria should be clear, like non-intrinsic cases (relief) or pathological ones (heroin addiction). Pain relation—maybe the account should intrinsically distinguish pleasure from pain without relying on opposition. Normativity: the account should explain the common feature, but hedonism can handle why it's good. Mill's distinction—important to address but without building it into the definition. Edge cases like masochism might test the theory's flexibility. 

  Tensions: Felt-quality theories might struggle with diversity (sensory vs. intellectual pleasures), while desire theories might have issues with unconscious pleasures or changing desires. Higher/lower pleasures could conflict with a unified account if qualitative differences are emphasized. 

  Scoring: Felt-quality theories might score low on unifying diversity but high on intrinsic distinction from pain. Attitude theories handle heterogeneity better but face issues with normativity and attitude/feeling mismatches. 

  I should ensure each desideratum has a rationale. For example, excluding relief because it's defined by pain absence. Or accommodating schadenfreude as a social pleasure. The user might be looking for a robust framework to evaluate existing theories, so clarity on criteria is key. They might be frustrated with past approaches that either over-include or under-explain. Highlighting tensions helps them understand why the problem is tough. Mentioning Mill shows awareness of historical debates without taking sides. 

  Also, the user's deeper need might be to avoid wasting time on inadequate theories. By providing clear desiderata, they can critically assess papers more efficiently. They might also seek a balanced view that acknowledges complexities without overcommitting to one school. Ensuring the answer addresses both philosophical rigor and practical utility is essential.
answer: |-
  Here’s a rigorous "spec sheet" for an adequate account of pleasure’s common feature, structured by desiderata with their rationales, tensions, and a brief scoring of major theories.

  ---

  ### **Core Desiderata for a Theory of Pleasure’s Common Feature**
  *(Ordered by priority/centrality)*

  1. **Unification of Paradigm Cases**  
     - **Must cover**: Sensory (back scratch), intellectual (solving a proof), social (schadenfreude), chemical (heroin rush), aesthetic (listening to a symphony).  
     - **Rationale**: If the theory excludes widely agreed-upon pleasures (e.g., dismissing intellectual joy as "not real pleasure"), it fails descriptively.  
     - **Edge cases allowed?** Relief (e.g., pain stopping) *might* be excluded if defined as absence of pain ≠ positive pleasure. Pathological cases (e.g., pleasure from brain tumor) are still pleasures.

  2. **Intrinsic Phenomenology**  
     - **Must explain**: Why pleasures feel "good" in a first-person, experiential sense.  
     - **Rationale**: Pleasure is *felt* as positive; an account that reduces it to behavior or function without phenomenology (e.g., "pleasure is just reward signaling") misses the essence.  
     - **Tension**: With desire-based views (can desires exist without felt quality?).

  3. **Distinction from Pain**  
     - **Must deliver**: An intrinsic difference (not just "opposites"). Pain isn’t merely "less pleasure"; it has its own qualitative character.  
     - **Rationale**: Hedonism treats pleasure/pain as a unified evaluative axis; the theory must ground this duality.  
     - **Not required**: To explain pain’s nature fully, only to differentiate it.

  4. **Normative Neutrality**  
     - **Must avoid**: Building *goodness* into the definition (e.g., "pleasure is intrinsically good").  
     - **Rationale**: Hedonism is a *value theory* claiming pleasure is the only good; the *account of pleasure* should be descriptive, leaving normativity to hedonism’s argument.  
     - **Tension**: Felt-quality views often implicitly link feeling good to being good.

  5. **Accommodating Attitude-Feeling Mismatches**  
     - **Must handle**: Guilty pleasures (feels good, judged bad), masochism (pain feels good *as pain*).  
     - **Rationale**: These reveal complexity in pleasure’s structure. Dismissing them as "not real pleasure" is ad hoc.  
     - **Exclusion allowed?** Only if clearly non-paradigmatic (e.g., drug-induced euphoria with no subjective positivity).

  6. **Exclusion Criteria**  
     - **Permissible exclusions**:  
       - *Relief*: If defined as cessation of pain (not positive state).  
       - *Contentment*: If argued to be absence of desire (not positive feeling).  
       - *Pathological "pleasure"*: E.g., frontal lobe syndrome where laughter lacks positive feel.  
     - **Principle**: Exclude states lacking intrinsic positive phenomenology or misdescribed as pleasure (e.g., "pleasure" in coercion).

  7. **Mill’s Higher/Lower Pleasures**  
     - **Requirement**: *Accommodate but not dictate*. The theory must allow for qualitative differences (intellectual > sensory), but shouldn’t *require* Mill’s hierarchy.  
     - **Rationale**: Mill’s distinction is substantive value claim; a descriptive account should be compatible with it (and egalitarian views).  
     - **Tension**: Felt-quality views struggle to explain *why* intellectual joys are "higher" without normativity.

  ---

  ### **Key Tensions Between Desiderata**
  - **Unification vs. Intrinsic Phenomenology**: Sensory & drug pleasures feel locationally "in the body"; intellectual joys feel "in the mind." Can one phenomenology cover both?  
  - **Attitude-Feeling Mismatches vs. Simplicity**: Masochism challenges theories tying pleasure to "wanting to continue" (desire views) or "positive feeling" (phenomenal views).  
  - **Normative Neutrality vs. Mill’s Hierarchy**: Higher pleasures imply normative superiority; a purely descriptive theory might lack resources to ground this.

  ---

  ### **Scoring Major Theories Against Desiderata**
  *(✓ = Satisfies, ~ = Partially, ✗ = Fails)*

  | **Theory**               | Unification | Phenomenology | Pain Distinction | Normative Neutrality | Attitude Mismatches | Mill’s Hierarchy | Notes |
  |--------------------------|-------------|---------------|------------------|----------------------|---------------------|------------------|-------|
  | **Felt-Quality**         | ~           | ✓             | ✓                | ~                    | ✗                   | ✗                | Struggles unifying diverse pleasures (e.g., orgasm vs. chess). Masochism is problematic. |
  | (e.g., Sidgwick)         |             |               |                  |                      |                     |                  |       |
  | **Attitude/Desire**      | ✓           | ✗             | ~                | ✓                    | ~                   | ✓                | Unifies via "desire for continuation," but neglects phenomenology (e.g., unconscious pleasures). |
  | (e.g., Brandt)           |             |               |                  |                      |                     |                  |       |
  | **Organic Unity/Process**| ✓           | ~             | ✓                | ✓                    | ✓                   | ✓                | Pleasure as "enjoyed activity" (e.g., Aristotle, Feldman). Handles diversity & masochism well, but phenomenology may be secondary. |
  | **Neuroscientific Reward**| ~           | ✗             | ~                | ✓                    | ~                   | ~                | Reduces pleasure to reward systems; struggles with normativity & distinct phenomenology. |

  ---

  ### **Conclusion: The Ideal Profile**
  An adequate account **must** unify paradigm cases while preserving intrinsic "feel-good" phenomenology and clearly distinguishing pleasure from pain. It **should** handle attitude-feeling mismatches neutrally, allow (but not enforce) Mill’s hierarchy, and exclude only states lacking positive phenomenology. **Tensions are inevitable** – e.g., desire theories unify but lose phenomenology; felt-quality views preserve phenomenology but fracture. The "organic unity" view (pleasure as *enjoyed engagement*) currently balances most desiderata, but no theory aces the spec sheet. Prioritize theories that transparently address trade-offs.
