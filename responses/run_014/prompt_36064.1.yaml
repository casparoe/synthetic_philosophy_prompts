prompt: |-
  I'm a journalist — I write longread features about science and ideas for a magazine — and my next piece is about how ugly practices die. Not the big moral questions, the mechanics of it: the strange fact that something can run along for centuries, everyone half-knowing it's brutal, and then collapse in a generation or two once it starts to go. The case I want to build the piece around is the end of footbinding in China. As I understand it, the practice went from near-universal among elite families to broadly finished over roughly 1890–1910, and the thing that did it wasn't imperial edict or decades of missionaries complaining (both had been tried, the Qing even attempted bans back in the 1600s that just got quietly walked back, or so the standard histories say) — it was anti-footbinding societies whose members took a public pledge: don't bind your daughters' feet, and don't let your sons marry a woman with bound feet, with fines if you broke it.

  I want to run this case through Appiah's account of moral revolutions — his line that dueling, slavery and footbinding ended when the honor code flipped, i.e. when the people doing the thing stopped feeling dignified by it and started feeling embarrassed by it, with arguments and interests trailing along behind doing cleanup. But here's the thing that bugs me about applying it here: the pledge setup looks like its solving a coordination problem more than its flipping anyone's honor. Nobody family could safely quit alone, because an unbound daughter was unmarriageable — so it was an equilibrium, not a value — and the pledges shifted a whole marriage cohort's expectations at once. On that story honor didn't lead the change, it followed the market: once a critical mass of respectable families pledged out, having bound feet quietly went from asset to liability, and the shame is downstream of the marriage maths. My editor likes this framing — "dueling was the easy case for Appiah because the duelist's own honor was on the line in the act itself, whereas footbinding put family honor on the daughter's body, and that's why it needed the pledge machinery dueling didn't" — but I don't want to file a neat thesis that a philosopher could take apart in a paragraph.

  So: analyse the episode through the honor thesis as it stands. Say what it predicts for this case, what it genuinely explains (why the Qing bans and the missionary scolding did nothing, if that's the right reading), and where its silent or has to stretch. Then run it back the other way and tell me what footbinding does to the thesis — is the coordination explanation a real rival that squeezes honor out of the story, or is 'being the sort of family that doesn't do that to its daughters' itself an honor fact, in which case my market-first framing is doing alot less work than I think it is? And give me an honest verdict on my dueling-is-the-special-case line: does it survive contact with the actual mechanisms, or do I need to cut it before filing?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a journalist working on a feature about how ugly practices die, specifically focusing on the end of footbinding in China. They want to use Kwame Anthony Appiah's honor thesis as a framework but are concerned that the anti-footbinding societies' pledge system might be more about solving a coordination problem than a shift in honor. 

  First, I need to recall Appiah's main argument. He posits that moral revolutions happen when practices become dishonorable, not just when people think they're wrong. The key is the shift in honor codes leading the change, followed by arguments and interests. The user is questioning if this applies to footbinding, where the pledge system seems to address a coordination issue—families couldn't stop binding feet because unbound daughters would be unmarriageable. 

  The user’s editor likes the idea that dueling was a straightforward case for Appiah because honor was personal, while footbinding involved family honor tied to the daughter's body, requiring a different mechanism (the pledge). But the user is worried this might be an oversimplification that philosophers could critique. 

  So, I need to analyze how well Appiah's thesis fits the footbinding case. Points to consider: Qing bans and missionary efforts failed, suggesting that external pressure alone wasn’t enough. The anti-footbinding societies created a collective pledge, which shifted marriage market dynamics. But did honor drive this, or was it the market shift that changed perceptions of honor?

  The user is trying to determine if the coordination explanation replaces the honor thesis or if honor still plays a role. They also want to know if their editor's point about dueling being a special case holds up. 

  Deep needs: The user likely wants a nuanced analysis that doesn't oversimplify. They need to present a compelling argument without being easily debunked. They might be seeking validation for their initial framing but also want to avoid academic criticism. 

  I should break down Appiah's predictions for footbinding. The thesis would expect that the practice declined when elite families began seeing it as dishonorable. But the pledge system complicates this—was the dishonor a result of the pledge, or did the pledge enable the honor shift? 

  Looking at historical details, the anti-footbinding societies were formed by Chinese reformers, not outsiders. Their pledge created a social contract that reduced the risk of defection. Once enough families joined, unbound feet became a new norm, making bound feet shameful. Here, the coordination mechanism facilitated the honor shift rather than replacing it. 

  The Qing bans failed because they didn’t change social incentives. Missionaries were seen as outsiders, so their criticism didn’t affect honor. The societies worked because they were insider-driven, aligning with Appiah’s emphasis on local honor communities. 

  The user’s market-first framing might overlook that joining the pledge was an honor-driven act. Signatories publicly committed to modernity and reform, which carried its own honor. So, the coordination was a means, but the underlying motivation could still be tied to emerging honor values. 

  Regarding dueling: It involved personal honor directly, while footbinding’s honor was vicarious (family through daughter). The pledge was necessary to realign family honor with new norms. So the editor’s point holds but needs nuance—footbinding required collective action because the honor was embedded in social structures. 

  Verdict: The honor thesis explains why previous efforts failed and why the pledge worked (insider-led honor shift). The coordination mechanism was the tool, not the driver. The user should keep the dueling comparison but present it as different expressions of honor dynamics. 

  The user should avoid reducing the change to mere market mechanics. Emphasize that the pledge enabled a new honor code where not binding feet became respectable. This maintains Appiah’s core while acknowledging the unique mechanisms in footbinding.
answer: |-
  Here's a breakdown of the footbinding case through Appiah's honor thesis, its strengths, its strains, and a verdict on your "dueling as special case" line:

  **Appiah's Honor Thesis: Core Predictions for Footbinding**

  1.  **Failure of External Pressure:** Appiah predicts that arguments based on abstract morality (missionaries) or coercive force (Qing bans) *won't* work if the practice remains embedded in the local honor code. This fits perfectly: Qing bans lacked social enforcement/legitimacy within the honor system, missionary condemnation was dismissed as "foreign," failing to dent the *internal* sense of dignity/shame driving the practice.
  2.  **The Primacy of Honor/Shame:** The thesis predicts the practice persists because it confers status/dignity (marriageability, elite belonging) and its absence brings shame (unmarriageability, social exclusion). This aligns with the pre-1890 equilibrium.
  3.  **The "Flip":** The revolution occurs when the practice ceases to confer honor and instead brings dishonor/shame *within the relevant community*. Appiah argues this flip precedes and drives the shift in arguments/interests.
  4.  **Internal Catalysts:** Change is most likely driven by actors *within* the honor community challenging its norms, making the dishonor credible. Outsiders (missionaries) can't easily trigger the flip.

  **What Appiah Genuinely Explains (The Fit)**

  *   **Why Qing Bans Failed:** They were external edicts, not shifts in the internal honor code. Enforcing them might have been seen as dishonorable submission to an unpopular state or foreign influence. They didn't make binding shameful; resisting the ban might even have been seen as honorable defiance.
  *   **Why Missionary Criticism Failed:** They were outsiders. Their condemnation didn't register within the Chinese elite's honor system; it might even have reinforced the practice as a mark of cultural distinction ("*we* don't listen to *them*").
  *   **The Role of Anti-Footbinding Societies:** Appiah can accommodate them as the *mechanism* for triggering the honor flip *internally*. These weren't foreign NGOs; they were formed by Chinese reformers (like Kang Youwei, Liang Qichao) and local elites. Their pledge was a powerful *performative act* declaring the new honor code: "We, the respectable people, now find this shameful." The fines weren't just economic; they enforced the *social shame* of breaking the new norm.
  *   **The Speed of Collapse:** Once the flip happens within the critical reference group (elites, respectable families), Appiah predicts rapid cascading change as shame takes hold. This matches the 1890-1910 timeline – a blink in historical terms.

  **Where Appiah is Silent or Has to Stretch (The Strain)**

  1.  **The Coordination Problem is Paramount:** This is your core insight. Appiah acknowledges social dimensions, but his primary emphasis is on the *internal psychological state* of honor/shame. Footbinding's persistence was fundamentally rooted in a vicious coordination trap: *No single family could defect without severe cost.* The pledge societies explicitly addressed this by creating a *coordinated defection mechanism* – a simultaneous, public commitment changing the marriage market calculus *en masse*. Appiah's thesis doesn't *negate* this, but it doesn't put it front and center either.
  2.  **Honor Following the Market?:** Appiah posits honor *leading*. Your argument is compelling: the pledge *first* created a critical mass of unbound feet/unbound-demanding sons, *changing the material/social incentives*. Only *then* did bound feet become actively shameful *because* they signaled being outside the new respectable marriage pool. Appiah would counter that joining the pledge *was* an honor-driven act by reformers/early adopters, signaling modernity and patriotism. But for the *majority* who joined later, it's plausible the fear of being *left behind* economically/socially (daughters unmarriageable, sons unable to find "modern" brides) preceded or coincided with the internalization of shame.
  3.  **The Nature of the Honor:** In dueling, honor was directly tied to the *actor's* courage. In footbinding, the "honor" was vicarious and instrumental: the family's status via the daughter's marriage prospects. Appiah handles this ("honor codes are diverse"), but the *mechanism* for flipping vicarious, instrumental honor tied to a vulnerable third party *is* different. It required disrupting the system (marriage market) that gave the honor its value.

  **Footbinding vs. The Thesis: Rival or Refinement?**

  *   **Is Coordination a Rival Explanation Squeezing Out Honor?** No, it's not a *rival*; it's an essential *complement* and *mechanism specific to this type of honor*. Appiah's core insight – that the practice collapsed when it became a source of shame *within the relevant community* – remains crucial. The anti-footbinding societies *used* coordination to *engineer* that shift in honor perception.
  *   **Is "Being the Sort of Family..." an Honor Fact?** Absolutely. This is key. Joining the pledge wasn't just a market calculation; it was a public declaration aligning your family with "progress," "patriotism," "modernity," and "civilization" – powerful new sources of honor emerging in late Qing China. *Refusing* to join, or breaking the pledge, became dishonorable *because* it signaled backwardness, resistance to national strength, or submission to "barbaric" customs. The pledge created a new, positive honor identity ("We are the reformers") tied to abandoning the practice. **Your market-first framing *is* doing less work than you think.** The market shift was the *consequence* of the new honor code being enacted through the pledge. Families didn't just coldly calculate; they sought the *honor* of belonging to the modern vanguard and feared the *shame* of exclusion from it.

  **Verdict on Your "Dueling is the Special Case" Line:**

  *   **Survives Contact? Partially, but needs nuance.** Your editor is onto something important:
      *   **Dueling:** Honor was *directly* embodied in the *actor's* act (courage, willingness to risk life). Changing the individual's perception of the act's honor was primary.
      *   **Footbinding:** Honor was *vicarious* and *instrumental*, tied to the *daughter's* body as a conduit for *family* status via marriage. Changing this required disrupting the *system* (marriage market) that made the body signify honor. This *is* why it needed the "pledge machinery" – to break the coordination trap and create a new system where the *unbound* body signified honor (modernity, patriotism).
  *   **Cut or Keep? Refine and Keep.** Don't cut it entirely; it highlights a crucial difference in *how* honor was embedded in the practice, explaining the different mechanisms needed for change. However, don't frame it as Appiah *only* working for dueling. Instead, say:
      > "Appiah's core insight – that practices die when honor flips to shame within the community – holds powerfully for footbinding. However, the *nature* of the honor involved differed. Dueling's honor resided directly in the actor's courage; its decline could flow more readily from changing individual perceptions. Footbinding's honor was vicarious and systemic, tied to family status through the marriageability of daughters. This systemic entanglement required a specific tool – the coordinated pledge – to dismantle the old market logic and establish a new one where *not* binding feet became the honorable mark of a modern, patriotic family. The pledge didn't replace honor; it was the instrument for its radical redefinition."

  **Conclusion for Your Piece:**

  Appiah's thesis provides a powerful lens for understanding *why* previous efforts (bans, missionaries) failed and *why* the anti-footbinding societies succeeded – they engineered an internal shift in honor/shame within the Chinese elite. The coordination mechanism was not a rival to the honor thesis but the *essential tool* required to flip the specific type of vicarious, systemically embedded honor at play in footbinding. The "market shift" wasn't the driver *instead* of honor; it was the *outcome* of successfully redefining what constituted honor for families in a changing China. Your piece can powerfully argue that ugly practices die when the honor code flips, but the *pathway* to that flip depends critically on how the honor is woven into the social fabric – sometimes requiring ingenious machinery, like the pledge societies, to cut the threads of coordination that hold the old shameful honor in place.
