answer: |-
  You've perfectly described **Pascal's Mugging**, a serious challenge to naive expected utility theory. You're right that the pure math suggests paying the $20 is rational, yet it *feels* insane. This highlights a flaw in applying unbounded expected value calculations uncritically. Here's why it's a problem and how thinkers approach solutions:

  **Why It Breaks Naive Expected Value Reasoning:**

  1.  **Unbounded Utilities:** The hypothetical payoff (e.g., 10^30 happy lives) can be made arbitrarily large. No matter how small the probability you assign, the mugger can always claim an even larger payoff to make the EV positive.
  2.  **Unconstrained Probabilities:** Assigning *any* non-zero probability, no matter how tiny (like 1 in 10^100), is sufficient to make the EV astronomically positive if the claimed payoff is large enough.
  3.  **Ignoring Prior Plausibility:** Naive EV treats the probability estimate as a given input. It doesn't account for *how* we arrive at that probability estimate for an extraordinary claim lacking evidence.

  **Why Simply Rounding Tiny Probabilities to Zero is Problematic (But Often Necessary):**

  *   **The Arbitrariness Problem:** As you ask, where do you set the cutoff? 1 in a million? 1 in 10^100? Any specific threshold seems arbitrary. Why is one infinitesimal probability "effectively zero" while another slightly larger one isn't?
  *   **Missing Genuine Black Swans:** Truly catastrophic (or massively beneficial) events with very low *but non-zero* probability *do* exist (e.g., certain asteroid impacts, unforeseen technological singularities). Rounding *all* tiny probabilities to zero would make us ignore these real, albeit unlikely, risks/opportunities.
  *   **Inconsistency:** It patches the symptom but doesn't address the core issue of how we assign probabilities to wildly implausible claims in the first place.

  **More Sophisticated Approaches to Handling Pascal's Mugging:**

  1.  **Bayesian Skepticism & Extraordinary Claims Require Extraordinary Evidence:**
      *   This is the most common and robust response. Instead of accepting the mugger's claimed probability, focus on how you *assign* that probability.
      *   The prior probability (before the mugger speaks) that a random stranger is a super-advanced alien capable of creating 10^30 happy lives is *incredibly* low – arguably much lower than 1 in a billion, perhaps 1 in 10^50 or less. It's a claim radically at odds with all observed reality.
      *   The mugger provides *no evidence* to significantly update this extremely low prior probability. Their statement alone is insufficient evidence to overcome the immense prior implausibility.
      *   **Solution:** Assign a prior probability so low (effectively zero for practical decision-making, given finite resources) that even astronomical payoffs cannot make the EV positive. Your credence isn't arbitrarily rounded; it's based on the utter lack of evidence for an extraordinary claim violating known physics, biology, and sociology.

  2.  **Bounded Rationality & Computational Limits:**
      *   Humans (and real-world AI) have limited cognitive resources and time. We *must* ignore possibilities below some threshold just to function. While theoretically arbitrary, in practice, this threshold is set by our capacity to process information and the opportunity cost of considering absurdities.
      *   **Solution:** Recognize that spending time and energy evaluating the mugger's claim (let alone paying) has a cost. The probability is so low that dedicating resources to it is irrational compared to addressing near-certain or higher-probability issues. Simply ignore claims below a practicality threshold.

  3.  **Decision Theory Modifications:**
      *   **Kahneman-Tversky (Prospect Theory):** Humans are more sensitive to losses than gains and overweight very small probabilities but *underweight* extremely small probabilities. This naturally leads to ignoring Pascal's Mugging scenarios.
      *   **Risk Aversion over Extreme Outcomes:** Rational agents might be extremely risk-averse concerning potential losses involving their entire resources, even when EV is positive. Losing $20 has a real utility cost; the near-infinite gain is too abstract and uncertain to compensate.
      *   **Finitarian Approaches:** Argue that utilities cannot truly be infinite or arbitrarily large. There might be fundamental physical or cosmological limits on achievable utility, capping the potential payoff. (This is philosophically contentious).
      *   **Dominance Reasoning:** If the claimed positive outcome is physically impossible or logically incoherent (e.g., creating 10^30 *truly distinct* happy lives might be impossible based on our understanding of physics/information), then paying is dominated by not paying, regardless of probability.

  **How to Pick a Cutoff (Without Pure Arbitrariness):**

  While no cutoff is perfectly non-arbitrary, here's how to make it *principled*:

  1.  **Bayesian Priors:** Base your initial probability estimate on the *inherent plausibility* of the claim given everything else you know about the world. The more extraordinary the claim (relative to established knowledge), the lower the prior. A claim like the mugger's gets a prior so low it's computationally negligible.
  2.  **Cost of Consideration:** Factor in the cognitive cost and opportunity cost of seriously entertaining the proposition. If the prior is low enough, spending *any* time/resources on it is irrational. The cutoff becomes "probabilities so low that considering them wastes more resources than their expected value justifies."
  3.  **Robustness Checks:** Ask: "What's the *strongest evidence* that would make me take this seriously?" If the mugger offers nothing beyond the claim, even a very high claimed payoff shouldn't budge you. The cutoff is tied to the *quality of evidence required* for such a claim.
  4.  **Pragmatic Thresholds:** For practical decision-making (e.g., insurance, engineering safety), thresholds are set based on societal risk tolerance, resource constraints, and the potential severity of outcomes (e.g., 1 in a million chance of catastrophic failure might be acceptable for a fridge but not for a nuclear reactor). While context-specific, it's not purely arbitrary.

  **Conclusion:**

  Pascal's Mugging doesn't *break* expected value reasoning entirely; it exposes its limitations when applied naively to arbitrarily large utilities combined with arbitrarily low (but non-zero) probabilities assigned without strong justification. The solution isn't simply rounding small probabilities to zero arbitrarily, but rather:

  1.  **Demanding Extraordinary Evidence for Extraordinary Claims:** Assign extremely low prior probabilities to wildly implausible scenarios based on their conflict with established knowledge. The mugger's claim fails this test spectacularly.
  2.  **Acknowledging Bounded Rationality:** We *must* ignore possibilities below a threshold defined by our cognitive limits and the opportunity cost of consideration.
  3.  **Incorporating Realism:** Consider the actual plausibility of the claimed payoff, potential risk aversion, and the real cost of the action (losing $20).

  Rationality doesn't require paying the mugger. It requires recognizing that the probability you should *justifiably* assign to their claim, given the complete lack of evidence, is so infinitesimally small that it renders the expected value calculation meaningless in practice. You reject the mugger based on the utter implausibility of their premise, not by fudging the math after accepting their dubious probability estimate.
