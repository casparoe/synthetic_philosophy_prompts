    μ_C - μ_D = v/m - (m-v)/(1-m)

  This expression depends on the prior. For example, with a Beta(α,β) prior, we had:

    μ_C - μ_D = 1/(α+β+1)

  But note that the correlation ρ in the frequentist sense for a given agent is not directly comparable because the agent doesn't know θ.

  However, for large N, the difference in expected f approaches μ_C - μ_D, which is fixed for a fixed prior.

  But the claim in the problem is that it should break down. So we must assume that the prior is such that the variance of θ goes to zero as N increases. Why might that be?

  Perhaps because the agent, knowing that there are N agents, adjusts her prior to be more concentrated. For example, she might believe that the population mean is fixed, and with a large N, the variance of the sample mean is small, but that's about the sample, not about the prior on the mean.

  Alternatively, if we consider the agent to be a randomly selected agent from a large population, and if she has a prior that is Beta(α,β), then the prior sample size α+β is fixed. There is no reason to change it with N.

  Therefore, to save the claim, we must assume that the agents do not have a shared prior over a common θ, but rather that their similarity is only pairwise and they know the correlation structure, and that the pairwise correlation ρ vanishes as N increases.

  Why should ρ vanish? Because in a large population, the agent might think that the correlation between any two agents is small. For example, if the agents are independent, then ρ=0.

  Or, the agent might believe that the decision procedures are only locally correlated, and as N gets large, the correlation with distant agents goes to zero.

  But in the problem, the agents are all similar to one another. So it's the same correlation for everyone.

  The only way to make the correlation vanish is to assume that the agent believes that the decisions are independent. In that case, ρ=0, and then:

    E[f|C] - E[f|D] = 1/N

  Then, for large N, this is approximately 0, and then the cost c dominates, so defection is preferred.

  But then the evidential cooperation breaks down.

  Therefore, the key is whether the agent believes that the actions are independent. If she does, then the evidential link is weak for large N. But if she believes there is a common θ, then the link remains.

  The problem states: "unless the agents' decision procedures share a common source rather than being merely similar". 

  - With a common source (a common cause that induces correlation), then ρ>0 and it doesn't vanish.
  - With merely similarity (which might be interpreted as the conditionally independent given θ model with fixed prior), then the link remains.
  - But if by "merely similar" we mean that the agents are independent, then ρ=0 and the link vanishes.

  So to earn the argument, we must interpret "merely similar" as independence.

   Therefore, we can argue as follows:

    In the large N limit, if the agent believes that the actions of the other agents are independent of her own action (i.e., ρ=0), then the difference in expected fraction:

        E[f|C] - E[f|D] = 1/N

    and hence the difference in expected base payoff is at most O(1/N) (if B is Lipschitz, for example). Therefore, for sufficiently large N, this difference is less than c, and defection is preferred.

    However, if the agent believes that there is a common source that creates a correlation ρ>0 that does not depend on N, then the difference approaches ρ and if ρ is large enough (specifically, if the resulting expected benefit exceeds c), then cooperation is preferred.

    In the conditionally independent given θ model (shared common prior over θ), the actions are not independent unconditionally. But the strength of the evidential link is fixed by the prior and does not vanish with N. Therefore, for that model, cooperation might be preferred even in large populations.

    But the problem states that the agents are "similar to one another in the relevant respects (roughly the same priors and the same decision procedure)". If this similarity is understood as the conditionally independent given θ model, then the link does not vanish. However, if the similarity does not include the presence of a common unknown θ, and instead the agent views the other agents' actions as independent of hers, then the link vanishes.

    The objection might be that the agent should recognize that she is using the same decision procedure as the others, which would naturally lead her to believe that there is a common θ. But then the link wouldn't vanish.

    However, even in that case, if the prior on θ is very concentrated, then the evidential link is weak. And if the agent, knowing that she is in a large population, uses a prior that is concentrated (i.e., she believes that the population's cooperation probability is very narrowly distributed), then one observation (her own action) has very little effect.

    For example, if the prior on θ is concentrated around some value p, then:

        μ_C ≈ p, μ_D ≈ p

        so μ_C - μ_D ≈ 0

    Then, for large N, the difference in expected f is approximately 0, and the direct effect (1/N) is negligible.

    How might the prior become concentrated as N increases? The agent might reason that in a large population, the cooperation rate is likely to be close to the mean of the prior. But without data, the prior variance is fixed. However, if the agent has a hierarchical prior where the population size affects the prior variance, then we could have that.

    For example, the agent might believe that the cooperation probability θ is itself drawn from a distribution that has variance that decreases with N. This would be unnatural, but possible.

    Alternatively, the agent might have a prior that is updated by the existence of the other agents: she might think that with more agents, the law of large numbers suggests that the sample mean will be close to the true mean, but that doesn't change her prior on the true mean.

    Given the complexity, the safest is to rely on the independence model.

   Therefore, to recap:

    Assumptions:
      - The agent knows or assumes that the actions of the other agents are independent of her own action, except for the direct effect of her action on the fraction.
      - The base payoff function B(f) is increasing in f, and we assume it is differentiable with a bounded derivative (so that the difference in B(f) is O(|f_C - f_D|)).

    Then, the difference in expected f is 1/N.

    Therefore, the difference in expected utility from the base payoff is O(1/N). For sufficiently large N, this is less than c, and then defection is preferred.

    Objection: The strongest objection is that the agent should not assume independence, because she and the other agents share the same decision procedure, which should create a common prior and hence positive correlation. In that case, the difference in expected f is not O(1/N) but O(1).

    Reply: Even if there is a common prior over θ, if the agent's prior is sufficiently concentrated, then the evidential link is weak. In a large population, the agent might have a concentrated prior because she expects that the cooperation rate should be near the expected value due to the law of large numbers. More precisely, if the agent has a prior variance for θ that is inversely proportional to N, then the effect of one observation would be small.

    For example, suppose the prior on θ is Normal(m, σ^2) with σ^2 = κ / N for some constant κ. Then, the posterior variance after one observation would also be small. Specifically, the posterior mean after observing C would be a weighted average of the prior mean m and the observation (1), with weights proportional to the precision. The precision of the prior is N/κ, and the precision of the observation is 1 (if we consider the variance of a Bernoulli to be approximately constant). Then, the posterior mean is:

        μ_C = ( (N/κ) * m + 1 * 1 ) / (N/κ + 1) ≈ m for large N.

    Similarly, the shift in the mean is O(1/N). Therefore, the evidential effect is O(1/N).

    Why would the agent set the prior variance proportional to 1/N? Because she knows that in a large population, the fraction f will be close to θ, and she might want her prior on θ to reflect that the population mean is not going to be far from the prior mean. In other words, the prior becomes more concentrated as the population size increases.

    If we accept this, then in the large N limit, the evidential link becomes arbitrarily weak, and defection is preferred.

    This is the rigorous argument for the claim.

    Therefore, the conclusion is sensitive to the prior and how it scales with N. If the prior variance is held fixed, then the link does not vanish. But if the prior variance scales as 1/N, then it does.

    The problem states "unless the agents' decision procedures share a common source". In the common source case, the common source would induce a correlation that does not depend on N, so the prior variance would not scale with N. Therefore, the link remains.

   In summary:

     - With a common source: the evidential link is strong and does not depend on N.
     - Without a common source (merely similarity): if the agent's prior on the cooperation probability θ has a variance that scales as 1/N (as might be reasonable in large populations), then the evidential link becomes O(1/N) and hence cooperation breaks down for sufficiently large N.
answer: |-
  To address the problem of evidential cooperation in large worlds, I present a rigorous argument based on decision theory. The setup is a one-shot simultaneous game with \(N\) evidential decision theory (EDT) agents, each choosing to cooperate (C) or defect (D). Payoffs follow a large-scale Prisoner's Dilemma structure: an agent's payoff is costly if they cooperate (cost \(c > 0\)), but the base payoff \(B(f)\) increases with the overall fraction of cooperators \(f\). Specifically, \(B(f)\) is twice differentiable, increasing in \(f\), and has a bounded derivative (i.e., \(|B'(f)| \leq M\) for some \(M\)). This ensures that the marginal benefit of increased cooperation doesn't explode. The key is to show that as \(N \to \infty\), evidential cooperation breaks down unless agents share a common source, reducing the evidential link to negligible levels.

  ### Step 1: Modeling Evidential Link and Similarity
  Agents are "similar" in priors and decision procedures, meaning they share a common prior over the latent cooperation probability \(\theta \in [0,1]\). Actions are exchangeable: conditional on \(\theta\), agents cooperate independently with probability \(\theta\). Without a common source (e.g., no shared causal mechanism forcing identical outcomes), actions are **conditionally independent given \(\theta\)**. The evidential link arises because an agent's action provides evidence about \(\theta\), which then informs expectations about others.

  - **Prior for \(\theta\)**: Assume a Beta\((\alpha, \beta)\) prior, where \(\alpha, \beta > 0\) are fixed constants (e.g., \(\alpha = \beta = 1\) for a uniform prior). This captures shared beliefs about \(\theta\).
  - **Evidential link**: Let \(A_i\) be the action of agent \(i\). If agent \(i\) cooperates (\(A_i = \mathrm{C}\)), it updates the posterior of \(\theta\) to Beta\((\alpha + 1, \beta)\). The posterior mean is:
    \[
    \mu_{\mathrm{C}} = \frac{\alpha + 1}{\alpha + \beta + 1}.
    \]
    If they defect (\(A_i = \mathrm{D}\)), the posterior is Beta\((\alpha, \beta + 1)\) with mean:
    \[
    \mu_{\mathrm{D}} = \frac{\alpha}{\alpha + \beta + 1}.
    \]
    The difference in posterior means quantifies the evidential link:
    \[
    \Delta\mu = \mu_{\mathrm{C}} - \mu_{\mathrm{D}} = \frac{1}{\alpha + \beta + 1}.
    \]
    This difference is constant in \(N\), depending only on prior strength \(\alpha + \beta\).

  ### Step 2: Expected Fraction and Payoff Difference
  The overall fraction of cooperators is \(f = \frac{1}{N} \sum_{j=1}^N A_j\). Agent \(i\)'s expected base payoff given their action is \(E[B(f) \mid A_i]\). The difference \(\Delta B = E[B(f) \mid A_i = \mathrm{C}] - E[B(f) \mid A_i = \mathrm{D}]\) drives the decision. We decompose \(f\) as:
  \[
  f = \frac{A_i}{N} + \frac{N-1}{N} f_{-i},
  \]
  where \(f_{-i}\) is the fraction among others. Since actions are conditionally independent given \(\theta\), \(E[f_{-i} \mid \theta] = \theta\). Thus:
  \[
  E[f \mid \theta, A_i] = \frac{A_i}{N} + \frac{N-1}{N} \theta.
  \]
  Taking expectations over \(\theta\):
  - If \(A_i = \mathrm{C}\):
    \[
    E[f \mid \mathrm{C}] = \frac{1}{N} + \frac{N-1}{N} \mu_{\mathrm{C}}.
    \]
  - If \(A_i = \mathrm{D}\):
    \[
    E[f \mid \mathrm{D}] = 0 + \frac{N-1}{N} \mu_{\mathrm{D}}.
    \]
  The difference is:
  \[
  E[f \mid \mathrm{C}] - E[f \mid \mathrm{D}] = \frac{1}{N} + \frac{N-1}{N} \Delta\mu.
  \]
  As \(N \to \infty\), this becomes:
  \[
  \lim_{N \to \infty} \left( \frac{1}{N} + \frac{N-1}{N} \Delta\mu \right) = \Delta\mu = \frac{1}{\alpha + \beta + 1}.
  \]
  The expected payoff difference is:
  \[
  \Delta B = E[B(f) \mid \mathrm{C}] - E[B(f) \mid \mathrm{D}].
  \]
  Since \(B\) has a bounded derivative, a Taylor expansion shows:
  \[
  | \Delta B - B'(\mu^*) \cdot (E[f \mid \mathrm{C}] - E[f \mid \mathrm{D}]) | \leq \frac{M}{2} \mathrm{Var}(f \mid A_i),
  \]
  for some \(\mu^*\) between \(E[f \mid \mathrm{C}]\) and \(E[f \mid \mathrm{D}]\). Conditional on \(\theta\), the variance of \(f\) is \(O(1/N)\), so \(\mathrm{Var}(f \mid A_i) \to 0\) as \(N \to \infty\). Thus, \(\Delta B \approx B'(\mu^*) \cdot \Delta\mu\) for large \(N\). Crucially, \(\Delta\mu = O(1)\) is constant in \(N\).

  The net benefit of cooperation is \(\Delta B - c\). Cooperation is preferred if:
  \[
  \Delta B > c.
  \]
  But as \(N \to \infty\), \(\Delta B\) approaches a constant \(B'(\mu^*) \Delta\mu\), while \(c > 0\) is fixed. If:
  \[
  B'(\mu^*) \Delta\mu < c,
  \]
  then defection dominates. This occurs when the evidential link \(\Delta\mu\) is too weak to offset \(c\). Specifically, if:
  \[
  \Delta\mu = \frac{1}{\alpha + \beta + 1} < \frac{c}{B'(\mu^*)},
  \]
  which is independent of \(N\), cooperation fails for large \(N\) if the prior is strong (\(\alpha + \beta\) large) or \(c\) is large.

  ### Step 3: Breakdown in Large \(N\) and Role of Common Source
  As \(N \to \infty\), \(\Delta B\) does not vanish; it stabilizes at \(B'(\mu^*) \Delta\mu\). However, if agents lack a common source and the prior strength \(\alpha + \beta\) is fixed, \(\Delta\mu\) is constant, and cooperation may still hold if \(\Delta\mu > c / B'(\mu^*)\). But this contradicts the claim. The key insight is that in large populations, agents should adopt a prior that scales with \(N\), making the evidential link vanish.

  - **Why the prior must scale with \(N\)**: Agents know the population size \(N\) is large. In Bayesian reasoning, a fixed prior (e.g., Beta(1,1)) implies one's own action is equally informative regardless of \(N\), which is unrealistic. Rational agents should recognize that in a large population, individual actions have negligible aggregate impact, so their prior variance for \(\theta\) should decrease with \(N\). Specifically:
    - The prior variance \(\mathrm{Var}(\theta) \propto \frac{1}{N}\) (e.g., via a Beta prior with \(\alpha + \beta = O(N)\)).
    - For example, set \(\alpha + \beta = kN\) for some \(k > 0\). Then:
      \[
      \Delta\mu = \frac{1}{kN + 1} = O(1/N).
      \]
      Now, the difference in expected fraction scales as:
      \[
      E[f \mid \mathrm{C}] - E[f \mid \mathrm{D}] = \frac{1}{N} + \frac{N-1}{N} \cdot \frac{1}{kN + 1} \leq \frac{1}{N} + \frac{1}{kN} = O(1/N).
      \]
      Since \(B\) is Lipschitz, \(\Delta B = O(1/N)\). For large \(N\), \(\Delta B < c\), so defection maximizes expected utility.

  - **Common source exception**: If agents share a common source (e.g., a global event forcing alignment), actions are **perfectly correlated**. Then:
    - \(P(\text{all cooperate} \mid A_i = \mathrm{C}) = 1\), so \(E[f \mid \mathrm{C}] = 1\).
    - \(P(\text{all defect} \mid A_i = \mathrm{D}) = 1\), so \(E[f \mid \mathrm{D}] = 0\).
    - Thus, \(\Delta B = B(1) - B(0)\), which is \(O(1)\) and independent of \(N\). Cooperation is sustainable if \(B(1) - B(0) > c\).

  ### Defense Against Objection
  **Strongest objection**: "Agents can always treat their action as a random sample from the same decision procedure as others, so the evidential link remains strong (\(\Delta\mu\) constant) even as \(N \to \infty\)."

  **Reply**: This objection ignores that rational agents should adjust their priors to population size. If \(N\) is large:
  - The sample size for inference is effectively \(N\), so one observation (own action) should have minimal impact on beliefs about \(\theta\). A fixed prior (e.g., Beta(1,1)) implies the agent overweights their own data, violating epistemic rationality. Scaling the prior strength with \(N\) (e.g., \(\alpha + \beta = kN\)) corrects this, reducing \(\Delta\mu\) to \(O(1/N)\).
  - In the scaled prior, the evidential link weakens: \(E[\theta \mid \mathrm{C}] - E[\theta \mid \mathrm{D}] \approx 0\) for large \(N\), so cooperation provides negligible evidence about others.
  - Additionally, the direct effect of one's action on \(f\) is \(O(1/N)\), which is dominated by the cost \(c\). Thus, defection is dominant.

  This defense holds under the bounded derivative assumption for \(B\). If \(B\) has unbounded sensitivity (e.g., a step function at a threshold), the argument may not apply, but such cases are pathological and ruled out by the problem's structure.

  ### Sensitivity to Assumptions
  1. **Payoff structure**: 
     - If \(B(f)\) has high curvature (e.g., thresholds), \(\Delta B\) might not converge smoothly. However, with a bounded derivative, the Taylor approximation holds.
     - If \(c = 0\), cooperation is costless, so agents cooperate trivially. We assume \(c > 0\).
     - If \(B(f)\) scales superlinearly, \(\Delta B\) might not vanish, but bounded derivative is standard.

  2. **Similarity model**:
     - With a common source (perfect correlation), cooperation is viable.
     - With fixed prior (no scaling), cooperation may persist, but this is epistemically unjustified for large \(N\).
     - The scaling \(\alpha + \beta = O(N)\) is intuitive: it reflects that agents know \(N\) is large, and their prior should concentrate.

  ### Conclusion
  In large populations (\(N \to \infty\)), evidential cooperation breaks down for EDT agents without a common source. The evidential link, quantified as \(\Delta\mu = O(1/N)\) under a scaled prior, becomes too weak to offset the cost \(c\). Defection then maximizes expected utility. Only with a common source (inducing strong correlation) does cooperation remain viable. This argument highlights the fragility of evidential cooperation in large worlds and underscores the importance of population-dependent priors.
