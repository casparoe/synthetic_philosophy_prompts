  We are considering a one-shot simultaneous game with N agents, all evidential decision theorists (EDT). Each agent chooses to cooperate (C) or defect (D). The payoff for an agent is:

  - Costly to cooperate: if an agent cooperates, she incurs a cost c (so her payoff is reduced by c compared to defecting, all else equal).
  - But the total payoff increases with the fraction of cooperators: let f be the fraction of cooperators in the population. Then, the base payoff without the cost of cooperation is B(f). We assume that B(f) is increasing in f and that there is a threshold fraction above which the collective benefit outweighs the individual cost for a cooperator (if enough others cooperate). However, for an individual, defecting avoids the cost c.

  Specifically, we can write the payoff for an agent as:

    U(a_i, f) = B(f) - c * I(a_i = C)

  where I(a_i=C) is 1 if the agent cooperates and 0 otherwise.

  The structure is similar to a Prisoner's Dilemma in that:
  - If everyone defects, f=0, then B(0) is the baseline. 
  - If everyone cooperates, then each gets B(1) - c. We assume that B(1) - c > B(0) so that full cooperation is better than full defection.
  - But for an individual, given any fixed f (from the other agents), defecting gives B(f) and cooperating gives B(f) - c, so defecting is always better for that agent regardless of f.

  However, in evidential decision theory, an agent conditions on her own action and uses that as evidence about what others will do. So if an agent chooses to cooperate, that raises her expectation of f, and if she defects, that lowers her expectation of f.

  The key question: As N becomes very large, does the evidential link become so weak that the expected benefit from raising f by cooperating does not offset the cost c?

  Modeling Similarity and the Evidential Link:

  We assume that the agents are similar in the sense that they share the same decision procedure. This means that they are all using the same reasoning and have the same prior beliefs. However, the strength of the evidential link depends on how correlated their decisions are.

  We can model the decision procedure as a common type that generates a probability of cooperation. Let θ be the (unknown) probability that a given agent cooperates. Then, the fraction f is the average of N Bernoulli(θ) random variables.

  But in EDT, an agent does not know θ. She has a prior over θ. Because the agents are similar, they share the same prior. However, without a common source (like a shared random event that determines θ) the agents' decisions are conditionally independent given θ.

  But the agent's own action gives her information about θ, which then affects her expectation about the actions of others.

  Specifically, let A_i be the action of agent i. We assume that the A_i are exchangeable: the joint distribution is symmetric in the agents. By de Finetti's theorem, there exists a prior over θ such that, conditional on θ, the A_i are i.i.d. Bernoulli(θ).

  So, the prior is over θ. Let the prior density be p(θ).

  Now, consider agent 1. She observes her own action A_1. Then, her posterior for θ is:

    p(θ | A_1) ∝ p(A_1 | θ) p(θ)

