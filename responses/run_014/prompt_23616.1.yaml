answer: |-
  You're facing a profound conflict between genuine responsibilities, not being "dramatic" at all. The Confucian perspective you mentioned (where identity *is* relationship) is powerful, but it doesn't mean choosing *one* role—it means navigating how these roles *interconnect* and finding harmony. Here’s how to approach it:

  ### 1. **Reframe the Confucian Insight**
     - **You aren't *just* a son or *just* a friend:** Your roles overlap. Being a supportive friend *is* part of being a good person (and thus a good son). Conversely, caring for your family teaches empathy you can offer Marcus.
     - **"Filial Piety" isn't blind obedience:** It includes honest communication and sustainable contribution. Sacrificing your mental health or friendships long-term harms your ability to fulfill *any* role. Confucianism emphasizes balance ("zhongyong" – the middle way).

  ### 2. **Practical Steps for Your Family**
     - **Have a calm, data-driven talk:** 
       - *Acknowledge their sacrifice:* "I know how much you’ve given for me, and I want to help."
       - *State your limits:* "Working after school *and* all weekend is overwhelming. I’m worried about school, and I’m burning out."
       - *Propose solutions:*  
         - Reduce hours: Offer specific times (e.g., "I can work Friday nights + Sunday lunches, but need Saturday afternoons off").
         - Suggest alternatives: Could a part-time hire cover some shifts? Could simplified menus or limited hours ease pressure?
       - *Frame it as sustainability:* "If I get some balance, I can help better long-term without resenting it."
     - **If guilt-tripping continues:** Gently say, "I love you and want to help, but when you say that, I feel like nothing I do is enough. Can we talk about what’s realistic?"

  ### 3. **Supporting Marcus Without Abandoning Him**
     - **Be reliably present *within* your capacity:**
       - Schedule short, consistent check-ins: "I can’t do Saturdays, but how about a 30-min call every Tuesday/Thursday after school?"
       - Be creative: Could Marcus come to the restaurant during quieter times? (Explain the situation to your parents: "He’s struggling; having him here might help us both focus.")
       - Leverage other support: Gently encourage Marcus to talk to a school counselor or join a support group. Say, "I’m here for you, but I also want you to have more people in your corner."
     - **Prioritize quality over quantity:** A focused 30-minute conversation where you truly listen is more valuable than a distracted 3 hours.

  ### 4. **Protect Your Own Well-being**
     - **Non-negotiable self-care:** Even 20 minutes a day for exercise, reading, or just quiet is crucial. Burnout helps no one.
     - **Revisit the club:** Start small. One low-commitment club or activity isn’t selfish—it’s resilience-building. Frame it to your family as "This helps me manage stress so I can be more helpful at home."

  ### 5. **The "Right" Way to Prioritize (It’s Fluid)**
     - **Triage based on urgency/impact:** 
       - *Acute crisis:* If Marcus is in immediate danger (e.g., self-harm), that takes precedence—get him help immediately.
       - *Chronic need:* Family stability and Marcus’s emotional health both matter long-term. You *can* balance both with boundaries.
     - **Think long-term:** What serves everyone’s well-being sustainably? Crushing yourself helps no one. A slightly less overwhelmed you is better for your family *and* Marcus.

  ### What to Do Now:
  1. **Talk to your parents THIS WEEK.** Use the script above. Focus on solutions, not blame.
  2. **Text Marcus:** "I know I've canceled a lot, and I hate that. I’m figuring out my family stuff so I can be there for you better. Can we try [specific alternative time]?"
  3. **Find 1 small thing for YOU.** A walk? Sketching? 15 minutes counts.
  4. **Seek an adult ally:** A trusted teacher, school counselor, or relative. Explain the pressure. They might help mediate with your parents or support Marcus.

  **The goal isn't choosing one role—it's integrating them sustainably.** A "good son" communicates honestly and models healthy boundaries. A "good friend" offers support without self-destruction. You're not failing; you're navigating an impossible situation with maturity. Start small, negotiate firmly but kindly, and remember: preserving yourself isn't selfish—it's necessary for everyone who relies on you.
