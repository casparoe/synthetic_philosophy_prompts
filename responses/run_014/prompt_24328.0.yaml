prompt: |-
  i teach a small seminar on collective decision making (16 students, one 90-minute session) and i want an in-class game that makes the discursive dilemma land before anyone says the name. no lecture up front: students vote issue by issue on the premises of a short argument and on the conclusion separately, and the group's own majority votes come out inconsistant — they should notice it from the tally, not from me. give me the argument to use, the exact procedure, a debrief that maps what happened onto the formal structure, what will predictably go wrong the first time i run it, and which feature of the actual impossibility result the activity can't reproduce.
reasoning: |-
  We are going to design an in-class activity that demonstrates the discursive dilemma (also known as the doctrinal paradox) without naming it. The key is to have students vote on the premises and the conclusion of an argument separately, and then show that the majority vote on the premises leads to a conclusion that conflicts with the majority vote on the conclusion.

   Argument Choice:
   We need a simple, non-controversial argument that has two premises and a conclusion. The example should be such that the conclusion logically follows from the premises, but the majority might vote for the premises and yet against the conclusion (or vice versa) because they are voting independently.

   Example: 
   Let's use a legal example that is common in the literature, but we can make it more relatable to students. Alternatively, we can use a simple logical argument.

   However, note: The discursive dilemma typically arises in cases where the conclusion is a function of the premises (like in a court: guilty if and only if both premise A and premise B hold). But we can also have a more general logical structure.

   Proposed argument (adapted to be simple and non-technical):

   Premise 1: The project is innovative.
   Premise 2: The project is feasible.
   Conclusion: Therefore, the project should be funded.

   The logical rule: Funding requires both innovation and feasibility.

   But note: We are going to have students vote on each of the three propositions independently.

   Procedure:

   1. Divide the class into 3 groups of 5 or 6 (so 15 or 16 students, with one group having 6). Each group will represent a committee.

   2. Give each group a scenario and ask them to discuss and then vote as a group on each of the three propositions (P1, P2, and C). They must vote for each one by majority in their group. They will hand in one ballot per group with three votes (yes/no for P1, yes/no for P2, yes/no for C).

   3. Alternatively, to save time, we can have each student vote individually, but then we have to aggregate individually. However, the paradox is about collective decision making, so having groups as units might be better. But note: we want the overall class to see an inconsistency in the collective outcome.

   4. Instead, let's do: Each student votes individually on P1, P2, and C. Then we aggregate the votes by majority for each proposition independently.

   However, the classic discursive dilemma is about aggregating judgments on the premises and the conclusion. We can set it up so that the majority on the premises would imply a particular conclusion, but the majority on the conclusion is the opposite.

   We need to design the individual judgments such that:

   Option 1: We pre-assign votes to the students to guarantee the paradox. But that might be too artificial.

   Option 2: We let the students vote based on a scenario, but we design the scenario so that the paradox is likely to occur.

   Scenario:

   "Imagine you are on a committee that decides on funding for research projects. You are evaluating Project X. Here is the information:

   - The project proposes a new method for water purification that has never been tried before. (This speaks to innovation)
   - The project requires a special material that is very expensive and hard to obtain. (This speaks against feasibility)
   - However, the research team has a partnership with a supplier that can provide the material. (This might make it feasible for them)

   But note: We want to have a split in opinions. We can give more details to create ambiguity.

   Alternatively, we can use a more controlled setting: assign each student a type of judgment. But to keep it natural, let's try to set up the scenario so that we are likely to get the following pattern:

   We need at least three types of students:

   Type A: Believes the project is innovative and feasible, so votes yes on P1, yes on P2, and yes on C.
   Type B: Believes the project is innovative but not feasible, so votes yes on P1, no on P2, and no on C.
   Type C: Believes the project is not innovative but is feasible, so votes no on P1, yes on P2, and no on C.

   Now, if we have a distribution:

   6 students of Type A
   5 students of Type B
   5 students of Type C

   Then:

   Vote on P1 (innovative): 
     Type A: yes (6), Type B: yes (5), Type C: no (5) -> total yes: 11, no:5 -> majority yes.

   Vote on P2 (feasible):
     Type A: yes (6), Type B: no (5), Type C: yes (5) -> total yes: 11, no:5 -> majority yes.

   Then, by the rule, if both premises are true, the conclusion should be yes. But:

   Vote on C (funding):
     Type A: yes (6), Type B: no (5), Type C: no (5) -> total yes: 6, no:10 -> majority no.

   So we have:
     Premise1: yes (by majority)
     Premise2: yes (by majority)
     Conclusion: no (by majority)

   This is the inconsistency.

   But we can't force students to be these types. Instead, we can try to nudge them by the scenario and by having them in groups that discuss? Or we can assign them roles.

   To make it work in one session without too much setup, let's assign roles:

   We'll have three roles, and we'll give each student a role card:

   Role 1: Optimistic Reviewer
     You believe the project is innovative because the method is new. You also believe it is feasible because the team has a partnership with the supplier. Therefore, you support funding.

   Role 2: Skeptical about Feasibility
     You believe the project is innovative (the method is new) but you are not convinced about feasibility. The material is expensive and even with the partnership, there might be delays. Therefore, you do not support funding.

   Role 3: Skeptical about Innovation
     You are not convinced about innovation. The method is new but it is only a minor variation of an existing method. However, you think the project is feasible because the team has a good track record and the partnership. But since you don't think it's innovative, you don't support funding.

   Now, we assign the roles to get the numbers we want: 6 optimists, 5 feasibility skeptics, 5 innovation skeptics.

   But note: we have 16 students. So we can do: 6 optimists, 5 of each skeptic.

   Steps:

   1. Explain the setup: We are a funding committee. We have a project to evaluate. We will vote on three questions:
        Q1: Is the project innovative? (P1)
        Q2: Is the project feasible? (P2)
        Q3: Should the project be funded? (C)

   2. Hand out role cards. Each student gets one role (with the description above and how they should vote). They are to vote according to their role.

   3. Have each student vote anonymously on the three questions. We can use slips of paper or an online poll.

   4. Collect the votes and tally them publicly for each question in order (P1, P2, then C).

   5. Show the tallies. The expected outcome:
          P1: 11 yes (6 optimists + 5 feasibility skeptics), 5 no (innovation skeptics) -> yes
          P2: 11 yes (6 optimists + 5 innovation skeptics), 5 no (feasibility skeptics) -> yes
          C:  6 yes (optimists), 10 no (5+5 skeptics) -> no

   6. Point out the inconsistency: The majority says the project is innovative and feasible, but the majority also says it should not be funded. However, the funding rule (which we can state) is that we fund if and only if it is innovative AND feasible. So by the rule, if both premises are true, we should fund. But the majority on the conclusion says no.

   7. Debrief:

      - Explain the structure: We had two premises and a conclusion that is a function of the premises (in this case, AND).
      - We aggregated by majority on each proposition independently.
      - The result: the collective judgments on the premises imply the conclusion (by the rule) but the collective judgment on the conclusion is the opposite.

      - This is the discursive dilemma (now you can name it): when we aggregate judgments on interconnected propositions, we might get inconsistent collective judgments.

      - We can discuss: How should we make decisions? By the premises (and then derive the conclusion) or by the conclusion directly?

      - In law, for example, a court might face this: if they vote on each element of a crime and then on guilt, they might have majority for each element but not for guilt, or vice versa.

   8. Predictable problems:

      - Students might not follow their roles exactly. Some might deviate. Solution: Stress that they are playing a role and should stick to it.

      - Time: The voting and tallying should be quick. Have a clear ballot.

      - The scenario might be too vague. Solution: Make the role cards very clear.

      - The funding rule (AND) might not be clear to everyone. Solution: State it clearly at the beginning: "The committee has a rule: a project is funded only if it is both innovative and feasible."

   9. What the activity can't reproduce:

      - The impossibility result (like in the List and Pettit theorem) shows that there is no aggregation function that satisfies three desirable properties: universal domain, collective rationality, and proposition-wise majority voting. Our activity only shows one instance of the problem with majority voting. We don't demonstrate the full generality of the impossibility.

      - Also, in our activity, we fixed the voting rule (majority) and the logic (conjunction). The impossibility result is broader: it holds for any aggregation function that satisfies the above properties and for a wide class of logics (including more complex ones).

      - We also did not explore other ways to aggregate (like conclusion-based or premise-based) and the trade-offs between them.

      - Our activity is limited to one specific profile of judgments that leads to inconsistency. In reality, the inconsistency might not always occur, but the impossibility result shows that it can occur.

   10. Adjustments for 16 students:

        We can have:
            Role 1: 6 students
            Role 2: 5 students
            Role 3: 5 students

   11. Ballot:

        Each student gets a ballot:

          Name (optional, but anonymous?): 
          Circle your vote for each:

          P1: The project is innovative.   Yes / No
          P2: The project is feasible.     Yes / No
          C: The project should be funded. Yes / No

   12. Step-by-step:

        - Introduction (5 mins): Explain the funding committee scenario and the rule: funding requires both innovation and feasibility. Hand out role cards and explain that each student will play a role and vote accordingly.

        - Voting (5 mins): Students vote by secret ballot. Collect the ballots.

        - Tallying (10 mins): Tally the votes for P1 on the board, then P2, then C. Write the counts.

        - Reveal the inconsistency (5 mins): Point out the tallies and note that by the rule, if both P1 and P2 are approved, then we should fund, but the majority rejected funding.

        - Debrief (15 mins): Explain the structure and introduce the formal name. Discuss the implications.

   13. Role Cards:

        Role 1: Optimistic Reviewer (6 copies)
          - You think the project is innovative because the method is entirely new and has potential.
          - You think the project is feasible because the research team has secured a partnership for the material.
          - Therefore, you support funding the project.

          Your votes: 
            P1 (innovative): Yes
            P2 (feasible): Yes
            C (funding): Yes

        Role 2: Skeptical about Feasibility (5 copies)
          - You think the project is innovative: the method is new and exciting.
          - However, you are concerned about feasibility: the material is very expensive and the partnership might fall through.
          - Therefore, you do not support funding.

          Your votes:
            P1: Yes
            P2: No
            C: No

        Role 3: Skeptical about Innovation (5 copies)
          - You are not convinced about innovation: the method is only a small tweak on an existing method.
          - But you think it is feasible: the team has a strong track record and the partnership is solid.
          - However, without innovation, you don't think it's worth funding.

          Your votes:
            P1: No
            P2: Yes
            C: No

   14. Note: We are assuming that the role players are consistent with the funding rule. The funding rule is: fund if and only if innovative AND feasible. So:
          - Role 1: both true -> fund.
          - Role 2: innovative true, feasible false -> not fund.
          - Role 3: innovative false, feasible true -> not fund.

   This should work.

   15. If we don't want to use a funding scenario, we can use a different one (like a criminal case: guilty if and only if motive and opportunity) but the structure is the same.

   Let me know if you want a different scenario.
answer: |-
  ### Discursive Dilemma In-Class Activity

  #### Argument to Use
  **Scenario:** A university committee must decide whether to approve a new AI ethics course.  
  **Logical structure:**  
  - **Premise 1 (P1):** The course content is academically rigorous.  
  - **Premise 2 (P2):** The course has practical relevance to students' careers.  
  - **Conclusion (C):** The course should be approved.  
  **Rule:** Approval requires *both* rigor (P1) *and* relevance (P2).  

  #### Procedure (30-40 minutes total)
  1. **Setup (5 min):**  
     - Hand out role cards (pre-assigned; see distribution below).  
     - Explain: "You're a committee voting on a new AI ethics course. Vote based on your role. We'll tally votes for 3 questions."  
     - Clarify voting: **Secret ballot** with ✅(yes) or ❌(no) for P1, P2, and C *separately*.  

  2. **Role Distribution (for 16 students):**  
     - **Type A (Pro-Approval):** 5 students  
       *Believes P1 (rigorous), P2 (relevant), C (approve).*  
     - **Type B (Skeptical of Rigor):** 5 students  
       *Believes ¬P1 (not rigorous), P2 (relevant), ¬C (reject).*  
     - **Type C (Skeptical of Relevance):** 6 students  
       *Believes P1 (rigorous), ¬P2 (not relevant), ¬C (reject).*  

  3. **Voting & Tally (15 min):**  
     - **Round 1:** Vote *only* on P1 ("Is the course academically rigorous?"). Collect ballots, tally publicly.  
       *Expected:* P1 passes (11 yes: Types A+C).  
     - **Round 2:** Vote *only* on P2 ("Is the course practically relevant?"). Tally.  
       *Expected:* P2 fails (5 yes: Type A; 11 no: Types B+C).  
     - **Round 3:** Vote *only* on C ("Should the course be approved?"). Tally.  
       *Expected:* C fails (5 yes: Type A; 11 no: Types B+C).  

  4. **Reveal Inconsistency (5 min):**  
     - Show tallies side-by-side:  
       - P1: ✅ (11-5)  
       - P2: ❌ (5-11)  
       - C: ❌ (5-11)  
     - Ask: "Do you see any tension between these results? Discuss in pairs for 2 minutes."  

  #### Debrief (15-20 minutes)
  1. **Map to Formal Structure:**  
     - **Premise-Based Approach:**  
       Majority accepted P1 (rigorous) but rejected P2 (relevant). By the rule "approve iff P1 ∧ P2", we *should* reject C.  
     - **Conclusion-Based Approach:**  
       Majority directly rejected C (approval).  
     - **The Dilemma:**  
       Here, both approaches agree (reject C), but highlight the *potential conflict*:  
       - If P2 had passed (e.g., with 9 yes votes), premise-based voting would *force* C to pass, but conclusion-based voting could still reject C.  

  2. **Core Insight:**  
     - **Discursive dilemma arises when:**  
       - Individual voters are *logically consistent* (e.g., Type B/C reject C because they reject one premise).  
       - Collective voting on each proposition *separately* creates inconsistency between:  
         a) The conclusion derived *from majority premises*.  
         b) The majority vote *on the conclusion itself*.  
     - **Real-world analogy:**  
       *Juries* voting on evidence (premises) vs. verdict (conclusion) may face this paradox.  

  3. **Discuss Trade-offs:**  
     - **Premise-based:** Prioritizes rationality but may override majority will on the conclusion.  
     - **Conclusion-based:** Reflects popular opinion but may ignore logical coherence.  

  #### Predictable Challenges (and Fixes)
  1. **Students vote illogically** (e.g., a Type B votes "yes" on C):  
     - *Fix:* Stress role-playing in setup: "Stick to your role’s beliefs." Use clear, extreme role descriptions.  

  2. **Tallying takes too long:**  
     - *Fix:* Use digital polls (Mentimeter) or assign 2 students as "tally clerks."  

  3. **Students spot the paradox too early:**  
     - *Fix:* Conceal tallies until all votes are in. Ask *them* to calculate totals to keep them engaged.  

  4. **Low engagement with abstract roles:**  
     - *Fix:** Add flavor text:  
       *Type B role card:* "You’re a humanities professor who thinks AI ethics lacks theoretical depth (¬P1). Though students want it (P2), you reject it (¬C)."  

  #### What the Activity *Can’t* Reproduce  
  - **The Impossibility Theorem’s Generality:**  
    The activity shows a *single instance* of the paradox. It does not prove that *all* aggregation methods must fail under majority voting (List & Pettit’s theorem shows no method satisfies universal domain, collective rationality, and proposition-wise majority simultaneously).  
  - **Non-Majoritarian Solutions:**  
    Students might suggest "prioritize premises over conclusion" as a fix. The activity can’t show why *no* perfect aggregation rule exists (e.g., strategic voting or cyclic outcomes under other rules).  

  #### Materials to Prep
  - **Role cards** (16 total): Labeled Type A/B/C with bullet-point beliefs.  
  - **Ballots:** Slips with ✅/❌ for P1, P2, C.  
  - **Tally board:** To record votes publicly after each round.  

  This creates a memorable "aha!" moment when students see their *own votes* generate inconsistency—setting up deeper discussion about democracy, logic, and institutional design.
