prompt: |-
  I spent the better part of four decades as a working physicist — lattice field theory and some phenomenology, mostly at a national laboratory — and since retiring I have taken up philosophy of science in earnest: Popper, then Kuhn, then whatever the journals are quarreling about this decade. My old department has asked me to lead a seminar session, for graduate students and a handful of emeritus colleagues, on the epistemology of theories that make no testable predictions, with string theory and the cosmological multiverse as the motivating cases. I do not want to lecture; I want to find out what my audience actually holds, and I suspect several of us hold views we cannot yet name.

  So please build me a diagnostic decision tree rather than an essay. It should start from commitments everyone in that room will share — we all trust the Standard Model in its domain, we all accept what the Bell experiments settled — and terminate in leaves labeled by positions: strict falsificationism; non-empirical confirmation of the kind Richard Dawid has defended, on which the absence of alternatives and a theory's unexpected internal coherence count as genuine evidence; a Bayesian skepticism that grants the form of those arguments but finds them too weak or circular to carry any real weight; a pragmatism on which the fruitfulness of a research program, not confirmation, is what the whole question should be about; and the anthropic optimist who counts selection-effect reasoning of the kind behind the famous predicted upper bound on the cosmological constant as ordinary science rather than a retreat from it.

  Deliver the tree as exactly five numbered items, with nothing before or after the list. Each item is to be one branch-point: a concrete case on which those leaves genuinely come apart, posed as a question my colleagues could answer without knowing which school it routes them toward. After each question, in a sentence or two, state what each way of answering indicates about the leaf it leads to. To convey the material I want without dictating the cases: consider a historical theory that went unchallenged for want of alternatives and later fell; an episode in which the same predicament preceded a triumph; a moment where a theory's surprising internal unification was eventually shown to be an artifact; a setting where selection effects did real inferential work; and something from my own working life, where a computation was intractable for decades and the community's confidence rested on the structure of the theory rather than on any data.

  One constraint, from a lifetime in the laboratory: argue from the cases, not from the literature — several of my colleagues will not have read a page of philosophy, and I want them sorted by what they say about cases, not by which names they recognize. And within item five, please flag any pair of leaves your instrument cannot cleanly separate rather than presenting the tree as sharper than it is.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired physicist organizing a seminar on epistemology of non-predictive theories, specifically requesting a diagnostic decision tree with five concrete cases. 

  First, I need to identify the core requirements: 
  - Five branching questions based on historical/scientific cases 
  - Each must distinguish between five philosophical positions 
  - Cases should include: unchallenged theory falling, same situation leading to triumph, internal unification as artifact, selection effects working, and physicist's personal experience 
  - No philosophical jargon - pure case-based reasoning 
  - Acknowledge where positions might overlap in item 5

  Considering the positions: falsificationism, Dawid-style non-empirical confirmation, Bayesian skepticism, pragmatism, and anthropic optimism. I'll select cases where these genuinely diverge.

  For the first case, the 19th century ether serves well - it was long unchallenged but fell. How physicists view this failure reveals their stance on "absence of alternatives" as evidence. 

  The second case requires a theory that succeeded despite initial lack of alternatives. Einstein's cosmological constant prediction fits perfectly, showing how positions interpret eventual confirmation after long latency.

  Third case needs internal coherence proven misleading. Kelvin's vortex atom theory works here - its mathematical elegance was celebrated but ultimately irrelevant to reality. This tests how much weight they give to internal unity.

  Fourth case must demonstrate valid selection effects. The cosmological constant bound is actually perfect - anthropic reasoning successfully predicted what pure theory couldn't. This directly probes the anthropic optimism position.

  For the fifth case, I'm considering lattice QCD computations where results were trusted before full calculation. Need to note where pragmatism and Dawid's view might overlap on "fruitfulness", and where Bayesian skepticism remains distinct in demanding stronger evidence.

  Each question will be phrased neutrally, with answer implications stated concisely. The tree must work even for philosophers unfamiliar colleagues, hence the strict case-based approach. I'll ensure the lattice QCD example flags the pragmatism/Dawid potential overlap as requested.
answer: |-
  Here is the diagnostic decision tree:

  1.  **Consider the historical dominance of the luminiferous aether theory in the 19th century: it was widely accepted for decades largely because no viable alternative framework existed to explain light propagation. When it was eventually falsified, does this episode primarily demonstrate the fundamental unreliability of trusting a theory *because* there are no alternatives?**  
      *   **Yes:** Indicates leaning towards **strict falsificationism** or **Bayesian skepticism** (views absence of alternatives as non-evidential or weak/risky).  
      *   **No:** Suggests compatibility with **non-empirical confirmation** (sees it as context-specific failure, not invalidating the general argument type) or **pragmatism** (focuses on its past utility, not confirmation).

  2.  **Consider Einstein's introduction of the cosmological constant (Λ) in 1917 to achieve a static universe within GR, driven by the perceived lack of viable alternatives to a static universe at the time. Decades later, Λ was observationally confirmed (as dark energy), though for a dynamic universe. Does the eventual empirical success emerging *from* this period of having no alternatives strengthen the idea that such a predicament can sometimes indicate a theory's latent truth?**  
      *   **Yes:** Supports **non-empirical confirmation** (highlights absence of alternatives/internal coherence as indicative) or potentially **anthropic optimism** (if framed as theory's flexibility).  
      *   **No:** Aligns with **strict falsificationism** (only empirical success matters, initial reasoning was wrong), **Bayesian skepticism** (success unrelated to initial non-empirical argument), or **pragmatism** (focuses on later fruitfulness, not initial reasoning).

  3.  **Lord Kelvin's vortex theory of the atom (late 19th c.) was celebrated for its remarkable internal mathematical coherence and unification of atomic physics with fluid dynamics and topology. It was later completely abandoned as irrelevant to actual atomic structure. Does this primarily show that surprising internal coherence/unification, however compelling, can be fundamentally misleading about a theory's connection to reality?**  
      *   **Yes:** Points towards **strict falsificationism** or **Bayesian skepticism** (views internal virtues as unreliable without empirical test).  
      *   **No:** Favors **non-empirical confirmation** (sees coherence as genuine evidence, discounting this as a rare failure) or **pragmatism** (values its historical role in stimulating mathematical progress, regardless of truth).

  4.  **Weinberg's 1987 anthropic prediction of a small positive cosmological constant (Λ), based on selection effects in a multiverse (only universes with small Λ allow observers), was remarkably confirmed observationally years later when Λ was measured. Does this successful prediction demonstrate that anthropic selection-effect reasoning is a valid form of scientific inference, fundamentally similar to other predictive successes?**  
      *   **Yes:** Strongly indicates **anthropic optimism** (views this as ordinary, successful scientific reasoning).  
      *   **No:** Aligns with **strict falsificationism** (rejects the multiverse premise as untestable), **Bayesian skepticism** (sees the argument as too model-dependent or circular), **non-empirical confirmation** (might value the *idea* but distinguishes it from empirical confirmation), or **pragmatism** (focuses on its utility for guiding expectations, not confirmation).

  5.  **Reflect on lattice QCD computations of hadronic masses or decay constants in the 1980s/90s: full dynamical simulations with light quarks were computationally intractable for years. Yet, there was significant confidence in the results of simpler approximations (quenched, staggered fermions) *before* full validation, largely based on the theory's internal structure and consistency across different approximation schemes. Was this confidence justified primarily by the *eventual empirical fruitfulness* of the lattice program, or did the *intrinsic theoretical virtues* (consistency, structure) provide legitimate, independent warrant before full computation/validation?**  
      *   **Fruitfulness justified it:** Strongly suggests **pragmatism**.  
      *   **Theoretical virtues provided warrant:** Supports **non-empirical confirmation**.  
      *   **Confidence was useful but not truly justified until validation:** Indicates **strict falsificationism** or **Bayesian skepticism**.  
      *   *(Note: **Anthropic optimism** is less directly addressed here. This case primarily distinguishes Pragmatism from Non-Empirical Confirmation, and both from Falsificationism/Skepticism. Pragmatism and Non-Empirical Confirmation might overlap for some on "fruitfulness as warrant", but the question forces a choice on the *source* of justification.)*
