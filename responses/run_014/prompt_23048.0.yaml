prompt: |-
  I write novels and I'm stuck on a short story about the the Lucas-Penrose argument — the one claiming human minds can't be machines because we can "see" the truth of Gödel sentences that no fixed formal system can prove. Every draft I write just comes out as a vague minds-are-special thing and I want it to actually engage with the strongest objection, which is the iterative one: if my mind verifies a Gödel sentence G for a theory T, then my mind is now effectively running T plus G, and Gödel's theorem lets you build a brand new sentence G' that even T+G can't prove, so there's always a next sentence and a finite mind can never catch up. Can you write a short story, maybe 1200 words, set in a late-night office where an older mathematician is arguing this with a young AI researcher, and the story dramatizes her winning each round and then realizing there's always another round coming? I want the ending to sit on the ambiguity of whether that infinite regress is a defeat for the mind or some weird kind of freedom. Please keep the Gödel parts technically accurate and don't hand-wave them.
