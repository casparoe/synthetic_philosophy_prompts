prompt: |-
  I work in ML infrastructure, and I'm trying to understand what our standard shipping practice quietly assumes about what a "model" is, because I keep hitting a tension I can't resolve. Our gate for promoting a new version of a model — a retrain, a fine-tune, or a port to a new framework — is purely behavioral: we run a fixed regression suite of a few thousand hand-written evals plus a sample of shadowed production traffic, and if the new version's outputs are statistically indistinguishable from the old version's on that suite, we call the two versions the same model and promote the new one. Under that gate, two checkpoints with entirely different weights but matching behavior on the suite are the same model. But elsewhere in the same organization, identity is by structure and lineage: model licensing and provenance audits track the weights and how they were derived, not what the model does, and two checkpoints that behave identically but came from different training runs are different artifacts, with different owners, licenses, and safety-review histories. So we do behavioral identity here and structural identity there, and I don't know which is the real notion that the other is approximating. What view of mechanism identity does the deployment gate presuppose? Does it commit us to the view that a mechanism just is its input-output behavior, or is it compatible with a view where the internal circuit is what the mechanism is, with the behavioral test as a cheap proxy? I'd like you to reconstruct the implicit theory, separate what the practice strictly presupposes from what it merely fits well with, say where the practice is underdetermined, and tell me what would have to change if we adopted the structural view. I'm an engineer, not a philosopher, so I may not have the right vocabulary for what I'm asking. Please answer as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion; the five items should cover, in order: (1) the implicit theory of mechanism identity the gate presupposes; (2) what the practice strictly presupposes versus what it merely fits well with; (3) where the practice is underdetermined, i.e., where several theories would license the same gate; (4) what would have to change in our deployment and audit practice under a structural view of mechanism identity; and (5) which current "same model" verdicts would be overturned, and what new tests or monitoring would be needed to catch the cases the behavioral gate misses.
reasoning: |-
  Okay, let me approach this systematically. The user is an ML infrastructure engineer grappling with conflicting definitions of model identity - behavioral equivalence in deployment versus structural provenance in auditing. 

  First, I need to parse their core tension: the deployment gate treats models as black boxes where identical outputs define identity, while licensing/provenance treats them as white boxes where weights and lineage define identity. 

  For item 1, the implicit theory is clearly functionalism - a model is defined by its input-output mappings. The practice presupposes that behavior is necessary and sufficient for identity, not just a proxy. 

  For item 2, I'll distinguish strict presuppositions (behavior defines identity) from compatible-but-not-required views (like internal mechanisms mattering only if they affect behavior). 

  Item 3's underdetermination is interesting - multiple theories could justify the gate, like behaviorism or certain forms of functionalism that allow structural variation. Need to list alternatives concisely. 

  Item 4 requires concrete changes: we'd need weight hashing for deployment, lineage tracking in promotion gates, and differential audits for structurally different but behaviorally similar models. 

  For item 5, I'm considering examples like different training runs producing similar outputs, or models with equivalent circuits but different weight distributions. New monitoring would need to detect internal drift or adversarial examples that exploit structural differences.

  The challenge is maintaining precision while fitting each point into 1-2 sentences. I'll avoid philosophical jargon since the user identifies as an engineer.
answer: |-
  Here is the numbered response as requested:

  1.  The gate presupposes a **functionalist theory of mechanism identity**: a model's identity is solely defined by its input-output behavior, making the internal implementation (weights, architecture details) irrelevant if behavior is preserved.
  2.  The practice **strictly presupposes** that behavioral equivalence *is* identity for deployment purposes; it merely **fits well with** (but doesn't require) the view that internal structure consistently causes the behavior or that the test perfectly captures all relevant behavior.
  3.  The practice is **underdetermined** between strict behaviorism (no internal reality matters) and certain functionalisms (internal structure matters only insofar as it supports the function/behavior), as both license using behavior as the sole identity criterion.
  4.  Under a structural view (identity defined by weights/lineage), deployment promotion would require **structural validation** (e.g., hash/checksum verification of weights, lineage attestation) alongside behavioral testing, and audits would need stricter versioning linking specific weights to specific behavior tests.
  5.  Verdicts overturning "same model" would include **different training runs/fine-tuning methods producing behaviorally equivalent outputs**; new tests would require **detecting adversarial inputs exploiting structural differences** and monitoring for **internal representation drift** despite matching outputs on the suite.
