   A rival group proposes a simpler predicate: "ductile" (Q), meaning that the material can be stretched to at least 100% elongation without breaking at any temperature. They note that the material always meets this 100% criterion in the observed range. 

   The actual world: at temperatures above 0°C, the material can be stretched to 200% (so P holds and Q holds). At temperatures below 0°C, the material can only be stretched to 150% (so P fails because 150% < 200%, but Q holds because 150% >= 100%).

