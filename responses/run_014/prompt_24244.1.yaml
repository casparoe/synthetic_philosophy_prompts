   Alternate idea in materials science:

   A community studies a material that becomes brittle at low temperatures. They have a predicate "ductile" (P) which they use to describe the material. They have always tested at room temperature and above, and the material is ductile. They project that it is always ductile. However, unbeknownst to them, the material undergoes a ductile-to-brittle transition at a certain low temperature. So the hidden structure of their predicate "ductile" is actually: "ductile at temperatures above the transition temperature". But they don't know about the transition.

