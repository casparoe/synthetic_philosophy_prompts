   Scenario: A community of astronomers studies a variable star. They have long used the term "regular" (P) to describe the star's behavior, meaning that it has a fixed period of variation. However, unbeknownst to them, the star's behavior is actually changing very slowly over time due to internal processes. Their definition of "regular" is based on observations over the past 200 years (which show a fixed period) and they project that it will continue. But the hidden structure of P is: "has a fixed period until the year 2100, and then changes". However, this hidden structure is not known to the community. They think "regular" is a simple, timeless property.

