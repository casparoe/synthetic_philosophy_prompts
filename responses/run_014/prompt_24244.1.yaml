   Scenario: A community of biologists studies a species of bird. They use the predicate "migratory" (P) to mean that the bird migrates south every winter. They have observed this for 100 years. However, unbeknownst to them, the bird's migration is actually triggered by a specific genetic program that will deactivate when the average winter temperature rises above 10°C (due to climate change). The hidden structure of P is: "migrates south every winter when the average winter temperature is below 10°C".

   A rival group from a different school proposes a simpler predicate: "mobile" (Q), meaning that the bird moves at least 100 km during the winter. They note that in all winters so far (which have been cold), the birds have moved more than 100 km. The actual world: even when winters become warm, the birds will still move more than 100 km (because they disperse due to other factors), so Q holds. But P fails in warm winters because they don't migrate south.

