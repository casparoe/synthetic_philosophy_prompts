    "entrenchment_verdict": "Entrenchment picks P because it is deeply embedded in the community's language, history, and practices (e.g., foundational texts and funding protocols).",
    "which_is_true_in_the_world": "Q",
    "feature_doing_the_work": "P's complexity (temporal disjunction) is hidden from the community, which treats it as a basic predicate due to historical entrenchment.",
