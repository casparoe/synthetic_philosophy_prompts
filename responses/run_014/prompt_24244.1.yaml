     - The predicate P, as projected by the community, is unconditional: "able to stretch to 200% without breaking at any temperature". But this is a simple universal claim. However, we know that in reality, the property P is not universal because it fails below 0°C. But the simplicity move is about the form of the predicate. The predicate P is simple: it just requires 200% elongation. The predicate Q is also simple: 100% elongation.

