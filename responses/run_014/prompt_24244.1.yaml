   - Scenario: one paragraph.
   - P is deeply entrenched due to historical use in the community, but it has a hidden complex structure (like a temporal disjunction or gerrymandered property that the community doesn't recognize as such).
   - Q is simpler but less entrenched (newer or from a rival tradition).
   - The community does not see P as complex (they see it as a basic word).
   - After the scenario, we break down the verdicts and the Goodmanian rebuttal.

   Idea:
   Let's consider a scientific community studying a type of crystal that exhibits a particular property. The community has long used the term "ferroelastic" (P) to describe the crystal's behavior. They define ferroelastic as having a reversible strain under stress. However, unbeknownst to them, their operational definition of ferroelastic actually includes a hidden temporal element: it only applies when the temperature is below a critical point (say, room temperature) because above that temperature the crystal structure changes and the behavior is different. But in their everyday practice, they always test at room temperature and thus never notice the temperature dependence. They think "ferroelastic" is a simple property.

   A rival research group proposes a simpler, temperature-independent property called "elastoresistive" (Q). This property is defined purely by the crystal's response to stress without any temperature condition. The evidence so far (all at room temperature) shows the crystals are both ferroelastic (as per their hidden definition) and elastoresistive. However, after time t, the community starts testing at higher temperatures. At higher temperatures, the crystals still show the elastoresistive behavior (so Q is true) but they lose the ferroelastic behavior (so P, as defined by the hidden temperature condition, fails because above room temperature the reversible strain is absent).

   But note: the community's entrenched predicate P is "ferroelastic", which they have always used without any thought of temperature. However, if we analyze the hidden structure of P, it is: "exhibits reversible strain under stress at temperatures below T_c (critical temperature)". This is complex because it has a hidden condition. Q, "elastoresistive", is simply: "exhibits reversible strain under stress" (without any temperature condition). So Q is simpler.

   However, in the community's language and practice, "ferroelastic" is the entrenched term. They have built their literature on it and it's the standard term. "Elastoresistive" is a new term from a rival group and is not entrenched.

   The actual world: the crystals are elastoresistive at all temperatures (so Q is true). But they are only ferroelastic (in the hidden sense) below T_c. Since after t, tests are done above T_c, the crystals are not ferroelastic (as per the hidden definition) but they are elastoresistive.

   We must set the scenario so that all pre-t evidence is at room temperature (below T_c). Then both P and Q fit the data. But after t, when they test above T_c, P (ferroelastic) fails because the behavior is not present, but Q (elastoresistive) holds.

   However, note: the hidden structure of P makes it so that for the pre-t evidence (all at room temperature) the crystals are P. But after t, at high temperature, they are not P. Meanwhile, Q is true at all temperatures.

   But wait: the community doesn't know about the hidden structure. They think P is just the simple property. So when they observe at high temperature, they see that the property they called ferroelastic is absent. But the rival property Q (elastoresistive) is still present.

   Now, we have to be cautious: the community's definition of P might not include the temperature condition. But in reality, the property they have been calling P only holds below T_c. So for the community, the hypothesis "all these crystals are ferroelastic" (meaning, as they understand it, that they exhibit reversible strain under stress) is actually false because at high temperatures they don't. But the rival hypothesis "all these crystals are elastoresistive" (exhibit reversible strain under stress regardless of temperature) is true.

   However, note: the community's hypothesis is "all crystals of this type are ferroelastic". They have only observed at room temperature and assumed it holds universally. The rival hypothesis is "all crystals of this type are elastoresistive".

   So the two hypotheses:
     H1: All crystals of type X are ferroelastic (meaning, in the community's mind, they exhibit reversible strain under stress at any temperature).
     H2: All crystals of type X are elastoresistive (exhibit reversible strain under stress at any temperature).

   But note: in the actual world, H1 is false because at high temperatures they don't. H2 is true.

   However, the simplicity move: 
     - The predicate for H1, if we look at what it actually requires (because of the hidden condition) is complex: it has a temperature condition. But the community doesn't know that. For the purpose of induction, we are to evaluate the predicates as they are defined. However, in the simplicity resolution, we are allowed to look at the logical form. So P (ferroelastic) has a hidden disjunction or conditional: it only holds in a certain temperature range. Therefore, it is more complex than Q (elastoresistive) which is a simple, unconditional property.

     - Simplicity would prefer H2 (Q) because it is simpler.

   Entrenchment: 
     - P (ferroelastic) is deeply entrenched in the community. They have used it for decades. Q (elastoresistive) is new and from a rival group, so less entrenched. So entrenchment would prefer H1 (P).

   But note: the community's hypothesis H1 is actually false in the world. So entrenchment leads them astray, while simplicity (if it can see the hidden complexity) would have led them to the true hypothesis.

   However, a Goodmanian might argue that the community's predicate P is not really complex for them because they don't know about the temperature dependence. To them, P is a simple predicate. But in the simplicity move, we are considering the actual logical structure of the property. This is a point of contention.

