     - Q: "mobile": moves at least 100 km in the winter. Also simple.

   But wait, both seem simple. We want P to have a hidden complex structure. The hidden structure is that P is conditional on temperature. But the community doesn't know that. So when they project P, they are projecting an unconditional regularity. The hidden condition makes the actual property complex, but the community's concept is unconditional.

