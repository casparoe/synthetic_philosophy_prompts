   Entrenchment: P is entrenched because it's the term the community has always used.

   The actual world: Q is true, P is false.

   The community does not see P as complex because they think of "winter" as a natural kind.

   Let's write the scenario:

   Scenario: A community of ornithologists has always described a bird species with the predicate "winter-migratory" (P), defined as migrating south during the calendar winter (December to February). They have observed this behavior for centuries. A rival ecological school proposes a simpler predicate "cold-avoiding" (Q), defined as migrating south whenever the temperature drops below 10°C. All observed data (until year t, which is before significant climate change) show the birds migrating in December to February and also show that in that period the temperature is always below 10°C. After year t, climate change causes warmer winters: in some years, the temperature in December-February does not drop below 10°C, and the birds do not migrate. However, in those years, the temperature does drop below 10°C in November or March, and the birds migrate then. Thus, P is false (they don't migrate in the calendar winter) but Q is true (they migrate when it gets cold).

   Now, the hidden structure of P is that it is tied to specific months. This is complex because it is a disjunction over a set of days (or a conjunction over a fixed period) and not a natural physical condition. Q is simpler because it uses a single threshold.

   The community doesn't see P as complex because they take the calendar as given.

   Breakdown:
     Predicate P: "migrates south during the calendar winter (December, January, February)".
     Predicate Q: "migrates south when the temperature drops below 10°C".

     Pre-t evidence: every year up to t, during December to February, the birds migrated and the temperature was below 10°C.

     Simplicity verdict: prefers Q because it has a simpler defining condition (a single temperature threshold) compared to P which requires a fixed date range (which is a disjunction over 90 days and depends on the human calendar).

     Entrenchment verdict: prefers P because it is deeply entrenched in the community's language and practice.

     Which is true in the world: Q (the birds migrate exactly when the temperature drops below 10°C, regardless of the calendar).

     Feature doing the work: The predicate P has a complex, gerrymandered definition (fixed calendar months) that the community does not recognize as complex because they are used to it, and this complexity is revealed when the environment changes.

     Goodmanian rebuttal: A defender of entrenchment might argue that the calendar months are not gerrymandered for the community because their entire culture and practice are built around the calendar, making P projectible for them. Moreover, they might say that the case shows that entrenchment tracks the community's actual inductive practices, which were successful until the environment changed, and that simplicity is not a guide to truth but an aesthetic criterion.

