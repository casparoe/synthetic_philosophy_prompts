answer: |-
  ### Scenario
  In a community of ornithologists studying Arctic terns, the entrenched predicate "polar-migratory" (P) has been used for centuries to describe the birds' behavior, defined operationally as migrating annually between April 1–10. This definition emerged from historical logs of explorers who only observed the terns in early April due to seasonal ice patterns. A rival research group proposes a simpler predicate "temperature-triggered migratory" (Q), defined as migrating when coastal temperatures exceed 5°C. All pre-2023 data (from an era of stable climates) show migrations occurring April 1–10, when temperatures were consistently above 5°C. After 2023 (t), rapid warming causes temperatures to exceed 5°C in mid-March, and the terns migrate then—fitting Q but violating P (April 1–10). P is entrenched through textbooks, grants, and field guides; its date-based definition is seen as fundamental, not gerrymandered. Q is simpler but marginal, borrowed from marine biology. In reality, the terns migrate solely based on temperature (Q is true).

  ### Analysis
  - **Predicate_P**: "Migrates annually between April 1–10." *Hidden structure*: A disjunction over 10 arbitrary calendar dates (gerrymandered temporally).  
  - **Predicate_Q**: "Migrates when coastal temperatures exceed 5°C." *Structure*: A unified physical condition.  
  - **Pre_t_evidence**: All observed migrations (pre-2023) occurred April 1–10, when temperatures exceeded 5°C.  
  - **Simplicity_verdict**: Simplicity picks Q because it relies on a single continuous physical parameter (temperature), while P requires a disjunctive, arbitrary date range.  
  - **Entrenchment_verdict**: Entrenchment picks P because it is deeply embedded in the community's language, history, and practices (e.g., key textbooks and funding protocols reference "polar-migratory").  
  - **Which_is_true_in_the_world**: Q (temperature-driven migration).  
  - **Feature_doing_the_work**: P's hidden temporal disjunction (fixed dates) is complex but *invisible* to the community, which treats it as a basic, projectible predicate due to historical accident.  
  - **Goodmanian_rebuttal**: A defender would argue that P *is* projectible *for this community* because entrenchment reflects their actual inductive practices, and rejecting it based on external simplicity imposes a priori standards irrelevant to their epistemic context. The case conflates metaphysical simplicity with projectibility.  

