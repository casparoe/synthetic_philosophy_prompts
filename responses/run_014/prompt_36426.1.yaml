answer: |-
  Here's a systematic audit of the streetlight analogy applied to Effective Altruism (EA), maintaining strict discipline on contested vs. settled points:

  ### Correspondence in the Analogy
  - **The Alley**: The space of all potential interventions to improve the world (global poverty, existential risk, institutional reform, etc.)
  - **The Lamppost**: Interventions where rigorous quantification (especially RCTs, cost-effectiveness metrics) is feasible
  - **The Keys**: High-impact interventions (those with highest expected value per resource spent)
  - **The Drunk's Motivations** (Core contested interpretations):
    - *Critics' View*: EA searches under the lamppost because it's convenient (measurability bias) or to signal rigor (performance virtue).
    - *EA Defense*: EA searches under the lamppost because it's where keys are most likely to be (tractability focus), and light helps *confirm* keys are present.
    - *Redefinition Charge*: EA implicitly defines "keys" as "quantifiable impacts," excluding systemic/dark-alley interventions.

  ### Critical Disanalogies and Their Weight
  1. **The "Keys Exist in Darkness" Premise (Heavily Contested)**  
     - *Analogy Assumption*: Keys *definitely exist* in the dark alley (high-EV systemic interventions are available but ignored).  
     - *Reality Check*: This is the core contested claim. **Settled**: Systemic interventions are harder to measure. **Contested**: Whether they offer higher *expected value* than measurable interventions. Critics assume yes; EAs argue tractability (including feasibility of execution) is part of expected value calculation.  
     - *Weight for Argument*: **Crucial**. If no high-EV keys exist in darkness, the analogy collapses. The analogy smuggles in the critic’s premise.

  2. **Purpose of the Light (Contested)**  
     - *Analogy*: Light is merely convenient for searching, not correlated with key location.  
     - *Reality*: EAs argue light (measurability) often correlates with tractability: e.g., measurable health interventions are frequently highly *feasible* to implement at scale. **Contested**: Whether measurability is a *proxy* for tractability or a *distorting bias**.  
     - *Weight*: High. If light signals tractability, the drunk is rational.

  3. **Search Strategy (Partially Settled)**  
     - *Analogy*: The drunk searches only under the lamp, ignoring the dark.  
     - *Reality*: **Settled**: EA funds non-measurable causes (e.g., AI safety, policy advocacy). **Contested**: Whether funding is *proportionate* to expected value or distorted by measurability. EA cites cause prioritization research; critics note funding disparities (e.g., GiveWell vs. LTFF allocations).  
     - *Weight*: Moderate. Acknowledging dark-alley searching weakens the analogy but doesn't resolve bias claims.

  4. **Keys as Fixed vs. Dynamic (Important Disanalogy)**  
     - *Analogy*: Keys are static; finding them is binary.  
     - *Reality*: Impact is often incremental and interdependent. Funding measurable interventions (e.g., health) can *build institutions* that later enable systemic change. **Contested**: Whether "lamppost" work crowds out or enables "dark alley" progress.  
     - *Weight*: High. Ignores EA’s argument that measurable wins build credibility/resources for harder problems.

  ### Verdict on the Analogy’s Conclusion
  - **Conclusion Carried by Analogy**: "EA’s cause rankings track measurability, not true impact."  
  - **Does It Survive Disanalogies?**  
    **No, if contested premises are rejected**. The analogy **depends entirely** on the unproven assertion that high-EV interventions exist in the "dark" and are ignored due to bias. EA’s tractability-focused epistemology rejects this. Without evidence that dark-alley interventions have higher expected value, the analogy assumes its conclusion.  
  - **What Holds**: The analogy *does* highlight a risk: measurable interventions may be overrepresented if measurement *distorts* tractability estimates. But this is a caution, not proof of failure.

  ### A Better Analogy: **Deep-Sea Exploration**
  - **The Ocean**: Problem space (depth = tractability/complexity).  
  - **Sunlit Zone**: Measurable, tractable interventions (e.g., bednets).  
  - **Twilight/Abyssal Zones**: Systemic interventions (e.g., policy reform).  
  - **Explorer’s Strategy**:  
    - Focus initial dives in sunlit zones where success is probable and tools work.  
    - Invest in R&D (better submersibles/lights) to explore deeper zones.  
    - Use shallow discoveries to fund/fuel deep dives.  
  - **Predicts Differently**:  
    - EA isn’t *ignoring* the depths but building capacity to explore them.  
    - Some deep zones may hold immense value—but also immense uncertainty and risk.  
    - Bias is possible if explorers over-prefer shallow dives, but this is corrigible with new tools.  

  ### Contested Claims Recap
  - **Settled**:  
    - EA funding skews toward measurable health interventions.  
    - Systemic change is harder to measure than health outputs.  
  - **Contested**:  
    - Whether the funding skew reflects *bias* or *rational prioritization*.  
    - Whether tractability and measurability can be separated (e.g., unmeasurable interventions may be intractable *because* they’re unmeasurable).  
    - Whether high-EV "dark alley" interventions exist and are undervalued by EA.  

  **Final Tally**: The streetlight analogy fails as a critique because it assumes the existence of high-value, ignored interventions in the dark—which is the very point in dispute. It highlights epistemic risks but doesn’t prove EA’s approach is misguided. A defensible EA epistemology is closer to iterative exploration: using measurable zones to build tools for the unknown, while acknowledging that some high-stakes areas (e.g., AI governance) may require leaps into partial darkness.
