  Okay, the user is a swimming instructor who's noticed something interesting in teaching. They tell students to relax their head to float, but when watching a video of themselves, they realize they're actually doing something else with their breathing and lower back. The instruction works even though it's technically wrong. They've seen similar things with a guitar teacher and a yoga instructor—teachers giving instructions that don't match what they do physically, yet students improve. 

  The user wants to know if there's a name for this phenomenon. They recall the "knowing how" vs. "knowing that" distinction but feel it's not quite right. They have the "how" but their "that" is incorrect, and that incorrect "that" still helps teach the skill. They need a deeper understanding: What's the phenomenon called? Does it apply beyond physical skills? Why does it work? Is it just simplification or a metaphor? How does it relate to the how/that distinction?

  First, I need to identify the phenomenon. The key points are: experts give instructions that are factually wrong about their own actions, but these instructions effectively convey the skill. This isn't just simplification; it's a misattribution. The user mentioned examples like "stop holding your head up" for floating, pressing harder on guitar frets, and yoga cues that don't match the teacher's actions. 

  I recall several relevant concepts. "Procedural knowledge" is about skills but doesn't cover the false verbalization. "Affordances" relate to possibilities in the environment but don't explain the false instruction. "Motor equivalence" is about achieving the same outcome with different movements, which is part of it but not the whole story. 

  Then there's "focus of attention." Research shows that external focus cues (like "reach for the wall" in swimming) work better than internal ones (like "move your arm"). In the user's case, "let your head sink" is an external cue. Even if it's not what the teacher does, it directs attention effectively. This could explain why the wrong instruction works. 

  The "knowing how" vs. "knowing that" distinction (from Ryle) is foundational. The user has procedural knowledge (how) but their declarative knowledge (that) is inaccurate. The false instruction still works because it's a cue that triggers the correct procedural action. 

  I think "misattributed cueing" or "functional misdescription" could be coined terms. But existing terms like "expert-induced misdirection" or "effective false cue" might fit. The core is that the cue is functionally effective despite being descriptively inaccurate. 

  For the why: The false cue likely works because it shifts attention to the outcome (external focus) rather than the mechanics. For example, "let your head sink" makes the student relax, achieving the correct posture indirectly. A technically correct description might overload the learner with details, causing paralysis. 

  User’s deeper needs: They want to understand the boundaries. Is it only physical skills? Probably not—therapists or negotiators might use similar indirect cues. Simplifications and metaphors count, as long as they functionally guide action. The false cue isn't a placebo; it's a heuristic that aligns attention or intention correctly. 

  I should synthesize terms: "Functional misdescription" captures the inaccurate yet effective instruction. "Attentional channeling" explains how it works. The phenomenon relates to how/that by showing that declarative knowledge can be wrong but still cue procedural knowledge effectively. 

  Need to confirm if there's an established term. After searching cognitive science and pedagogy, "focus of attention effects" (Wulf) is key. Also, tacit knowledge (Polanyi) where we know more than we can tell. The false description might be a way to point to the tacit knowledge without articulating it. 

  So the phenomenon is a combination of external focus cues, misattribution due to unconscious competence, and functional effectiveness in teaching. The term could be "pedagogical misdirection" or "functional misinstruction." But existing frameworks like "external focus of attention" might be the closest. 

  Conclude that the phenomenon is best described as a blend of misattribution of agency and attentional channeling. The name "Effective False Cue (EFC)" or "Functional Misdescription" could be coined, with mechanisms tied to focus of attention and outcome-oriented learning.
answer: |-
  Your observation cuts to the heart of embodied expertise, pedagogy, and the limits of self-reporting. While no single, universally accepted term captures **every nuance** of this phenomenon, it sits at the intersection of several well-established concepts:

  1.  **The Core Distinction: Knowing-How vs. Knowing-That (Ryle):** You're right to start here. This *is* the foundational distinction. Crucially, **the phenomenon you describe highlights a specific *failure mode* within it:** experts possess robust *knowing-how* (procedural knowledge) but generate inaccurate *knowing-that* (declarative knowledge) about *how* they achieve the outcome. The fascinating twist is that this *inaccurate* declarative knowledge still functions as an effective pedagogical tool.

  2.  **Tacit Knowledge (Polanyi):** Much of skilled performance, especially physical skill, is "tacit" – we know more than we can tell. We "know" it in our bodies, not in words. Your verbal instruction isn't a direct description of your action; it's an *attempt* to point towards the tacit knowledge, often using an external cue or metaphor. The instruction works *despite* its inaccuracy because it successfully directs the learner's attention or intention towards the *result* or *feeling* associated with the tacit skill.

  3.  **Focus of Attention Effects (Wulf & Colleagues):** Research shows *where* a learner directs their attention significantly impacts performance and learning. Crucially:
      *   **Internal Focus:** Attending to body mechanics ("bend your elbow," "arch your lower back") often leads to worse performance and learning.
      *   **External Focus:** Attending to the *effect* of the movement on the environment ("reach for the far wall," "let the water hold your head up," "make the note ring clear") leads to better performance, faster learning, and greater automaticity.
      *   **Your Phenomenon:** Your "false" instruction ("let your head sink back") is actually a highly effective *external focus cue*. It directs the learner's attention *away* from micromanaging their neck muscles and *towards* the desired relationship with the water and the feeling of release. Even though your *own* neck isn't doing that passively, the *cue* works because it prompts the *overall state* (relaxation, alignment, breath control) needed for buoyancy. Your buddy's "press harder" cue likely works because it externally focuses the learner on the *outcome* (clean sound) needed as they move up the neck, prompting necessary adjustments unconsciously.

  4.  **Affordances (Gibson):** Skilled performers perceive the environment in terms of action possibilities (affordances). Your cue "let your head sink back" isn't about neck anatomy; it's about triggering the learner's perception of the water's *affordance for support*. The false description cues the learner to perceive and exploit the water's properties correctly.

  5.  **Motor Equivalence:** The same outcome (e.g., floating, a clean guitar note, a yoga pose) can be achieved through slightly different combinations of muscle activations and joint angles. Your instruction might trigger a *functionally equivalent* movement pattern in the learner, even if it differs from your precise internal mechanics.

  **Coining a Term & Defining the Phenomenon:**

  Given the lack of a perfect single term, a precise description and coined name would be:

  *   **Phenomenon:** **Functional Misdescription in Skill Transmission (FMiST)** or **Attentional Channeling via Misattributed Cue (ACMC)**
  *   **Definition:** *A pedagogical phenomenon where an expert instructor provides verbal or cognitive cues to a learner that are factually inaccurate descriptions of the expert's own biomechanics or internal processes during skilled performance, yet effectively facilitate skill acquisition in the learner by directing their attention, intention, or perception towards functionally critical environmental interactions, movement outcomes, or proprioceptive feelings associated with the target skill.*

  **Addressing Your Specific Questions:**

  1.  **Relation to Knowing-How/Knowing-That:** This phenomenon *depends* on that distinction. It demonstrates that declarative knowledge (*knowing-that*) generated *about* procedural knowledge (*knowing-how*) can be inaccurate, yet still serve as a functional bridge to trigger or guide the development of the procedural knowledge in a learner. The *knowing-how* is real; the verbalized *knowing-that* about it is flawed but pedagogically useful.
  2.  **Simplification vs. Falsehood vs. Metaphor:** These exist on a spectrum, and **the phenomenon applies to all if they are functionally effective despite descriptive inaccuracy.**
      *   **Simplification:** Omitting details ("kick from the hip" might ignore ankle flexion nuances) can still guide effectively.
      *   **Outright Falsehood:** "Let your head sink" (when you aren't) or "Press harder" (when you don't) are descriptively false but functionally cue the right action.
      *   **Metaphor:** "Hold the club like a small bird" or "Swim through a tube" are inherently non-literal but powerfully cue the *quality* of movement (gentle firmness, streamlined alignment). Metaphors are often the *most* effective form of this, directly bypassing mechanics for feeling/image.
  3.  **Beyond Body Skills? Absolutely.** Therapists might say "Just reflect their feeling back" while unconsciously using complex micro-skills of timing and phrasing. Negotiators might advise "Find common ground" while relying on unarticulated rapport-building tactics. Chess masters might explain a move based on principles they retrospectively apply, not the pattern recognition they actually used. Any domain relying on tacit knowledge or rapid intuition is susceptible.
  4.  **What's Actually Happening? It's NOT just placebo.** It's **attentional channeling** and **outcome-oriented cueing:**
      *   The "false" cue directs the learner's focus to the *critical external result* or the *essential proprioceptive feeling*.
      *   It prevents harmful internal focus on mechanics.
      *   It leverages the learner's own motor system to self-organize towards the goal using the cue as a guidepost.
      *   It often provides a simple heuristic ("Press harder") that gets the learner *close enough* for their system to refine the movement through practice and feedback, avoiding paralysis by analysis.
      *   A "technically correct" description might overload working memory, force internal focus, and be impossible to execute fluidly ("Activate your deep cervical flexors while maintaining thoracic extension and initiating diaphragmatic breathing...").

  **Edges of the Phenomenon:**

  *   **It IS:** An expert's verbal instruction that is *descriptively inaccurate* regarding their own action but *functionally effective* in eliciting the desired skill component or outcome in a learner through attentional direction, outcome-focus, or metaphor.
  *   **It IS NOT:**
      *   Merely a simplification that *is* accurate at its level.
      *   A correct description that the learner misunderstands.
      *   A placebo with no actual skill-building mechanism (FMiST/ACMC has a specific attentional/motor mechanism).
      *   Useful for teaching *conceptual knowledge* where accuracy is paramount (teaching history facts vs. swimming).
      *   Always optimal – sometimes a more accurate cue *is* possible and better, but often the "false" one is more efficient for early learning.

  **Conclusion:**

  You've hit upon a profound truth about teaching embodied skills: **The map is not the territory, and sometimes a slightly wrong map gets the learner to the destination faster than a hyper-accurate one that's too complex to read while moving.** The phenomenon underscores that effective skill transmission often relies not on perfect self-knowledge, but on the expert's ability to generate cues that successfully channel the learner's attention and intention towards the functional essence of the skill, leveraging external focus and outcome-orientation, even if those cues misdescribe the expert's own internal process. "Functional Misdescription" or "Attentional Channeling via Misattributed Cue" captures this core idea. Its power lies not in factual accuracy, but in its functional efficacy as a pedagogical tool.
