  The user cares about saving the intuition that Mary gains *something* meaningful. So solutions denying step (2) entirely (e.g., hardline physicalists saying she learns nothing) might feel unsatisfying. The challenge is to explain how she learns without conceding nonphysical facts.  

  I recall three main physicalist strategies:  

  1. **Ability/acquaintance response (reject step 3):** Mary gains abilities (to imagine/recognize red) or direct acquaintance with red, not propositional knowledge. This avoids new *facts* but might seem like dodging—after all, she *can* now answer new questions ("Is *this* what red looks like?").  

  2. **Old fact, new mode (reject step 4):** What she learns is a physical fact she already knew, but now grasped under a new "mode of presentation" (e.g., via experience). This preserves physical facts as exhaustive but risks circularity—why can't physics capture this "mode"?  

  3. **Reject the completeness of pre-release knowledge (attack step 1):** Maybe Mary didn’t *truly* know all physical facts. If color experience depends on dynamic brain states or embodied interaction, her pre-release "knowledge" was incomplete. But this feels slippery—surely the thought experiment assumes she *does* know everything physical.  

  The Vegemite extension exposes how wild (7) sounds. Physicalists *must* block the inference to countless nonphysical facts. The ability response handles this best: tasting Vegemite adds no *facts* but new capacities. Yet the user might worry this downgrades the "Aha!" moment.  

  What's the cost? Denying step (3) means accepting that Mary’s new knowledge isn’t factual—which might feel like conceding to the roommate. But if we reframe "what it’s like" as non-propositional, physicalism holds. Alternatively, if we embrace "old fact/new mode," we owe an account of why physics can’t encode those modes.  

  The user’s unspoken need: they want physicalism to survive without making Mary’s revelation trivial. So the solution should honor the profundity of experience while tethering it to the physical. The ability/acquaintance route does this best—it calls her learning "transformative" without multiplying facts. But we must stress that abilities *are* physical (brain changes!) to avoid dualism.  

