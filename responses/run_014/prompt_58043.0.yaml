answer: |-
  Your roommate's extension of the Mary argument is a classic and potent critique—often called the "Master Argument" against physicalism. The conclusion (step 7) *does* seem absurd if physicalism is meant to be a complete description of reality. To avoid this, physicalists must reject one step. Here's a breakdown of the options, their costs, and why preserving Mary's learning is possible:

  ### **Step to Reject: (3) "What she learns is a new fact"**
  This is the most popular physicalist response. Mary gains **non-factual knowledge**—something meaningful but not a "fact" in the propositional sense (i.e., not a truth about the world). Instead, she gains:
  - **Ability knowledge**: She acquires new *skills*—e.g., recognizing red, imagining it, or simulating the experience.
  - **Acquaintance knowledge**: She gains direct, first-person *familiarity* with red (like knowing a city by visiting vs. reading a map).

  **Why reject (3)?**  
  - After seeing red, Mary *can* answer new questions ("Is *this* what red looks like?"), but this relies on her new abilities, not new facts. She might say, "Ah, *this* is the experience described by neural pattern XYZ." The "fact" was already known; she now accesses it experientially.  
  - Physics aims to describe objective, third-person facts. Subjective experience might be a *way of accessing* those facts, not an addition to them.  

  **Cost:**  
  - This might feel like downgrading Mary's revelation. If she shouts, "So *that's* what red looks like!" it seems she learned *about* red, not just a skill.  
  - It requires redefining "knowledge" strictly (e.g., limiting "fact" to propositional truths).

  ---

  ### **Alternative Step to Reject: (4) "The new fact is nonphysical"**
  Some physicalists argue Mary learns a **physical fact**, but in a new way:
  - **Old fact, new mode**: She already knew the fact (e.g., "Red light at 650nm causes neural state N"), but now she grasps it under a *subjective mode of presentation*. The fact is physical, but her epistemic access is transformed.  
  - **Incomplete physical knowledge**: If "physical facts" include the structure of consciousness (e.g., via integrated information theory), Mary might not have *fully* grasped the fact until her brain dynamically generated the experience.

  **Why reject (4)?**  
  - Physicalism could include subjective experience as a physical property (e.g., emergent from neural processes). When Mary sees red, her brain enters a new state—a physical event she hadn't *undergone* before.  

  **Cost:**  
  - This risks circularity: if "physical facts" include subjective experience, the argument becomes toothless.  
  - It demands a robust theory of how subjectivity is physical—still debated in neuroscience/philosophy.

  ---

  ### **Weakest Step: (1) "Mary knows *all* physical facts"**
  This is harder to reject but worth considering.  
  - **The embodied cognition challenge**: If color vision depends on sensorimotor interactions (e.g., how the eye scans objects), Mary’s pre-release "knowledge" was incomplete because she lacked a body engaging with light.  
  - **The knowledge argument’s idealization**: "All physical facts" might be impossible *in principle* for a disembodied brain. Physics requires experimentation—Mary’s room denies her the physical interaction needed to "know" color fully.

  **Cost:**  
  - Undermines the thought experiment. If Mary can’t *truly* know all physical facts from a room, the initial intuition (that she learns something new) loses force.  
  - Risks making physicalism unfalsifiable ("Oh, you found a gap? That just wasn’t *truly* physical!").

  ---

  ### **Your Core Concern: Preserving Mary's Learning**
  You can keep step (2)—**Mary learns *something* new**—without conceding nonphysical facts.  
  - **Physicalism-friendly view**: Her learning is a *physical transformation*: new neural pathways form, enabling abilities/familiarity. This is consistent with physics (e.g., brain plasticity).  
  - **Key insight**: Learning "what it’s like" isn’t discovering a *fact* but undergoing a *process*. Vegemite tastes new not because physics missed a fact, but because your brain hasn’t instantiated that flavor’s neural pattern yet.  

  ---

  ### **Why This Blocks the Vegemite Absurdity**
  If Mary’s new knowledge is non-factual (abilities/acquaintance), then:  
  - Tasting Vegemite adds no *facts*—just new capacities.  
  - Physics isn’t "missing" facts; it describes the objective basis for those capacities.  
  - Someone who knows "all physical facts" *would* know what Vegemite tastes like *in principle*—they just couldn’t *simulate the experience* without the neural state.  

  Physicalism survives because the "millions of ordinary facts" aren’t facts at all—they’re experiential states fully grounded in physical systems.

  ---

  ### **Conclusion: Best Path Forward**
  **Reject step (3)**. Mary learns *something* new (preserving intuition), but it’s not a new *fact*—it’s a first-person ability/familiarity grounded in her brain’s physical state.  
  - **Cost**: Accepting that "knowing all physical facts" doesn’t entail *having all experiences*. This doesn’t refute physicalism; it shows that physical knowledge requires more than propositions—it requires the right physical implementation (e.g., a brain that can generate consciousness).  
  - **Upshot**: Physicalism isn’t defeated by Vegemite—it just acknowledges that experiences are *lived* physical processes, not gaps in scientific description.  

  As David Lewis quipped: "Knowing what an experience is like isn't knowing-that; it's knowing-how." The room for Mary’s revelation isn’t in the facts—it’s in her transformation from a theorist into an experiencer.
