prompt: |-
  I cover science and ideas for a magazine, and I'm prepping a long-form interview with a philosopher who's defended the view that for an act to have real moral worth, the agent has to act for the right reason — the moral reason itself — not just happen to do the right thing or be a person of good character. I want to get past the shopkeeper example and the basic "right thing, wrong reason" stuff everyone already knows.

  Act like a professional metaethicist who knows this literature cold. Before you write the questions, do a short brainstorm of the genuine pressure points in the right-reason requirement, then give me seven or eight interview questions that turn on the actual content of the view. I want at least one question each on: (1) the indirect-reason case — someone helps a stranger only because they have a near-panic fear of feeling guilty afterwards; is dodging a moral emotion close enough to the moral reason, or is it still the wrong reason? (2) the false-belief case — someone acts for what they sincerely take to be the right reason, but their belief is just flat out wrong; does moral worth track the reason they had, or the reason that was actually there? And (3) a consequentialist who acts for the right reason, i.e. to maximize the good — does their act get moral worth under this view, and if so, what's left for the Kantian? For each of those three, also give me a follow-up keyed to the answer there's most likely to give.
