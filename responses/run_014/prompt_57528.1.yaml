answer: |-
  Below is a complete in-class game design based on Lakatos' methodology of scientific research programmes (MSRP). It meets your specifications: teams operate rival programmes, encounter anomalies, commit to progressive/ad hoc adjustments via sealed envelopes, and experience a late-game reversal. The fictional subject is **Luminiferous Aether Mechanics** (avoiding overused examples).

  ---

  ### **Game Overview**
  - **Subject**: Rival theories explaining "**Aetheric Refraction**" (how celestial light bends around cosmic bodies).
  - **Teams**: Two research programmes (8 students each):
    - **Programme A: Wave Resonance Theory (WRT)**  
      *Hard Core*: Light is a wave propagating through a rigid luminiferous aether; refraction is caused by aether density gradients.
    - **Programme B: Particle Pulse Theory (PPT)**  
      *Hard Core*: Light comprises discrete "pulse particles" repelled by cosmic masses; refraction results from particle-mass interactions.
  - **Objective**: Adjust auxiliary hypotheses to explain anomalies. Score points for explanatory power and **progressive adjustments** (those predicting *new* phenomena).

  ---

  ### **Rules & Scoring**
  1. **Setup**:
     - Each team receives their **hard core** (unalterable) and a **scorecard** (see below).
     - Anomalies are revealed one-by-one. Teams have **8 minutes/round** to:
       - Propose an **auxiliary hypothesis** (adjusting their protective belt).
       - **Commit in writing** whether the hypothesis is:
         - **Progressive**: Predicts a *new, testable* phenomenon (beyond the current anomaly).
         - **Ad hoc**: Only explains the current anomaly.
       - Seal hypothesis + commitment in an envelope.

  2. **Scoring**:
     - **1 point**: Explain the anomaly (any plausible adjustment).
     - **+3 points**: If a *progressive* hypothesis from the *previous* round predicts the *current* anomaly.
     - **0 points**: For ad hoc adjustments (no bonus even if they fit future data).

  3. **Critical Mechanic**:
     - Envelopes are collected *before* the next anomaly is revealed.
     - Progressive predictions must be **specific and testable** (e.g., "Light will bend *toward* nebulae with mass > 10³⁰ kg").
     - The facilitator checks predictions against new anomalies strictly (no retroactive claims).

  ---

  ### **Round-by-Round Timeline**  
  *(Total: 75 minutes; 15 minutes debrief)*  
  | Round | Time     | Anomaly Revealed (Data Card)                                                                 | Designed Outcome (Facilitator Script)                                                                 |
  |-------|----------|----------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------|
  | 1     | 0–10 min | **Anomaly 1**: Light bends *away* from blue stars in Orion.                                  | Both adjust easily. WRT typically predicts *toward* massive bodies; PPT naturally explains *away*.    |
  | 2     | 10–20 min| **Anomaly 2**: Light bends *toward* black nebulae (non-luminous masses).                     | WRT scores 1 (adjusts: nebulae have dense aether). PPT may go ad hoc (scores 1).                      |
  | 3     | 20–30 min| **Anomaly 3**: Light bends *away* from pulsars (spinning stars).                             | PPT’s core explains this easily (progressive if predicted spin matters). WRT struggles (ad hoc).      |
  | 4     | 30–40 min| **Anomaly 4**: Light *does not bend* near binary star systems.                               | PPT predicts this if prior adjustments included interference (bonus!). WRT adds ad hoc auxiliaries.   |
  | 5     | 40–50 min| **Anomaly 5**: Light bends *toward* quasars (super-luminous, low-mass objects).              | WRT’s earlier ad hoc adjustments *accidentally* fit (no bonus). PPT’s core fails, needs ad hoc fix.   |
  | 6     | 50–60 min| **Anomaly 6**: Light bends in **spiral patterns** around Andromeda Galaxy.                   | PPT *cannot* explain (ad hoc adjustments implausible). WRT’s aether-vortex hypothesis (from Round 3) **predicts this exactly**—scores bonus + overtakes. |
  | 7     | 60–70 min| **Anomaly 7**: Light splits into bands near supernovae (not predicted by either core).       | Both use ad hoc adjustments. Final scores calculated.                                                |
  | End   | 70–75 min| Tally scores. **PPT leads early** (Rounds 1–4), **WRT wins late** (Round 6 bonus).           |                                                                                                       |

  ---

  ### **Scorecard Template** (1 page per team)  
  **Team: ________**  
  **Hard Core**: _________________________________________  
  *Score = Explain anomaly (1 pt) + Bonus if prior progressive prediction matches (3 pts)*  

  | Round | Anomaly Summary | Your Auxiliary Hypothesis | Progressive? (✓) | Prediction for *Next* Round | Points Earned | Cumulative |
  |-------|-----------------|---------------------------|-------------------|-----------------------------|---------------|------------|
  | 1     | Light bends from blue stars | [Write here] | ☐ Yes ☐ No        | [If yes, be specific!]      |               |            |
  | 2     | Light toward nebulae        |                          | ☐ Yes ☐ No        |                             |               |            |
  | 3     | Light from pulsars          |                          | ☐ Yes ☐ No        |                             |               |            |
  | 4     | No bend near binaries       |                          | ☐ Yes ☐ No        |                             |               |            |
  | 5     | Light toward quasars        |                          | ☐ Yes ☐ No        |                             |               |            |
  | 6     | Spiral bend in Andromeda    |                          | ☐ Yes ☐ No        |                             |               |            |
  | 7     | Banded light near supernovae|                          | ☐ Yes ☐ No        | N/A                         |               |            |

  ---

  ### **Materials List**
  - **Printables**:  
    - Hard core cards (1 per team).  
    - Anomaly data cards (7 rounds, revealed sequentially).  
    - Scorecards (1 per team).  
  - **Supplies**:  
    - 14 envelopes (1 per team per round).  
    - Pens, timers, whiteboard markers.  
    - Whiteboards (for teams to sketch hypotheses).  
  - **Setup**:  
    - Two tables per team (space for collaboration).  
    - Anomaly cards pre-sorted in order.  

  ---

  ### **Debrief: Mapping Gameplay to Lakatos**  
  *(15 minutes; no prior term explanations)*  
  1. **Hard Core**: "You protected your core at all costs. What would happen if you abandoned it?"  
     → *Lakatos: Hard cores define the programme; abandoning it ends the programme.*  

  2. **Anomalies**: "Why did early success (PPT) not guarantee victory?"  
     → *Negative Heuristic: Teams shielded cores by adjusting auxiliaries (protective belt).*  

  3. **Progressive vs. Ad Hoc**: "Show a sealed envelope where your ‘progressive’ claim was falsified. How did it feel?"  
     → *Surplus Content: Progressive adjustments risk falsification but drive growth; ad hoc saves phenomena but stagnates.*  

  4. **Reversal (Round 6)**: "WRT was ‘losing’ at halftime but won. How?"  
     → *Retrospective Appraisal: Programmes are judged historically, not instantaneously. A ‘degenerating’ programme can recover with a lucky prediction.*  

  5. **Permissiveness**: "Could you justify *any* anomaly with enough auxiliaries?"  
     → *MSRP Critique: Lakatos’ criteria are permissive—almost any programme can be ‘rational’ if it occasionally predicts novelty.*  

  ---

  ### **Predictable Problems & Limitations**  
  **What will go wrong**:  
  - **Vague predictions**: Students will say "light bends weirdly" instead of specific, testable claims.  
    *Mitigation*: Reject non-specific predictions; give examples.  
  - **Time pressure**: 8 minutes isn’t enough for deep debate. Some students will dominate.  
    *Mitigation*: Assign roles (e.g., scribe, predictor).  
  - **Envelope disputes**: Teams will argue post-reveal that their ad hoc hypothesis "was progressive."  
    *Mitigation*: Enforce written commitments strictly.  

  **What the game cannot reproduce**:  
  1. **Anomalies ≠ cards**: Real anomalies arise from experiment/observation, not a facilitator. Scientists *design tests*—they aren’t passive recipients.  
  2. **Temporal scale**: Bold conjectures (e.g., gravitational waves) may take decades to corroborate. Deathbed vindications are common.  
  3. **Social factors**: Peer review, funding, and prestige influence real programmes (absent here).  

  **How to cover gaps in debrief**:  
  - Stress that anomalies are **constructed by scientists** through theory-laden observation. Play a 2-minute "what if" where teams design their *own* anomaly to test rivals.  
  - Discuss **historical examples** (e.g., Copernicus’ heliocentrism wasn’t corroborated until long after his death) to contrast with the game’s instant gratification.  
  - Emphasize that Lakatos MSRP describes **long-term progress**, not round-by-round wins.  

  ---

  ### **Final Notes**  
  This game forces students to *live* Lakatos: protecting cores, weighing progressive risks, and seeing appraisal as historical. The reversal in Round 6 makes degeneracy/overtaking visceral. Use the whiteboards for hypothesis sketches and score tracking. Print materials [here](https://drive.google.com/dummy-link-for-printables). Run tight timings, and lean into the chaos—students will grasp MSRP deeper by failing at it first.
