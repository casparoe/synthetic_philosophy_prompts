     We'll also create a master scorecard for the facilitator to record.

     Finally, the debrief mapping:

       - Round1: Teams added their first auxiliary hypotheses -> protective belt adjustment.
       - When they protected the hard core by adding an auxiliary, that's the negative heuristic in action.
       - The progressive moves (predictions) are part of the positive heuristic: they are trying to expand the programme's empirical content.
       - The shift in scores: around round3, HRP was leading but then CRP overtook. That's the retrospective appraisal: at round3, HRP looked progressive and CRP degenerating, but later it reversed.

     What to say about what the game cannot reproduce: 

       - In real science, anomalies are not given; scientists have to discover them through experimentation and observation. The game simplifies by handing them out.

       - The immediate testing of predictions: in reality, a prediction might not be testable for years, and the scientist might never see it confirmed.

       - The game does not capture the possibility of multiple competing research programmes or the role of technological limitations.

