  We are designing a game to simulate Lakatos's methodology of scientific research programmes (MSRP). The core ideas are:
   - Each team has a "hard core" of central theses they must protect.
   - They have a "protective belt" of auxiliary hypotheses that they can adjust to explain anomalies.
   - Adjustments can be ad hoc (only explain the current anomaly) or progressive (predict new facts).
   - Research programmes are "progressive" if they predict novel facts and "degenerating" if they only explain known anomalies.

   We need:
   - Two rival research programmes (Team A and Team B) with different hard cores.
   - A series of anomalies (data cards) that challenge both programmes.
   - A way for teams to adjust their protective belt and to declare whether their adjustment is progressive (has surplus content) or ad hoc.
   - A scoring system that rewards progressive adjustments and penalizes ad hoc ones.

   Subject matter: Let's avoid the usual examples. We'll invent a fictional science: "Crystal Resonance Theory" (CRT) which studies how crystals resonate to produce different effects. There are two rival programmes:

   Team A: "Harmonic Resonance Programme" (HRP)
     Hard core:
       1. All resonance is harmonic (i.e., integer multiples of a base frequency).
       2. The base frequency is determined by the crystal's structure alone.

   Team B: "Chaotic Resonance Programme" (CRP)
     Hard core:
       1. Resonance can be chaotic (non-harmonic) and is influenced by external factors.
       2. The crystal acts as a medium that can exhibit both harmonic and chaotic behavior.

   We will have 5 rounds of anomalies. Each round, both teams receive the same anomaly (a description of an experimental result). They must adjust their protective belt (by adding an auxiliary hypothesis) to explain it. They must write down their adjustment and also state whether it is progressive (i.e., it predicts something new beyond the current anomaly) or ad hoc (only explains the anomaly). They commit this in a sealed envelope (or folded paper) at the end of the round, before the next anomaly is revealed.

