          67-69        Seal (but no next round, so no reveal)
          69-70        Check round5? We don't have Anom6, so we skip bonus check.

          70-90        Debrief (20 minutes)

     This fits.

     Now, what will go wrong?

     - The teams might not understand what counts as a progressive adjustment. They might think any adjustment is progressive. We must stress: it must predict something new and specific that is not already in the data.

     - The teams might make predictions that are too vague. The facilitator must be ready to reject vague predictions and ask for specifics. But to keep the game flowing, we might accept any specific prediction.

     - The teams might not be able to come up with adjustments in 8 minutes. We can be flexible and extend by 1-2 minutes if needed, but that would eat into the next round.

     - The teams might try to change their hard core. We must remind them that the hard core is fixed.

     - The scorekeeping might be messy. The facilitator must have a master scorecard.

     What the game cannot reproduce:

     - In real science, anomalies are not handed by a facilitator. Scientists must design experiments and might not know what the anomaly is until they look.

     - The time frame: bold conjectures might take decades to corroborate.

     - The game makes the appraisal of progressiveness very mechanical (match the prediction with the next anomaly). In reality, a prediction might be confirmed in a different experiment, not the very next one.

     - The game does not capture the possibility of auxiliary hypotheses that are not immediately testable but might become testable later.

     In the debrief, we must:

     - Map the moments of the game to the Lakatosian terms.

     - Point out that in the game, the anomalies were pre-designed to fit a narrative, but in reality, nature does not conspire to make one programme win.

     - Explain that the hard core was protected by the rules of the game, but in history, sometimes hard cores are abandoned (but then it becomes a new programme?).

     - Note that the positive heuristic (what to try next) is guided by the programme. In the game, teams were free to invent any auxiliary hypothesis, but in reality, the positive heuristic suggests specific kinds of adjustments.

     - The negative heuristic (don't touch the hard core) was enforced.

     - The protective belt: the auxiliary hypotheses.

     - The overtaking of CRP illustrates the retrospective character: at round3, CRP had only 2 points and HRP had 5, but then CRP caught up.

     - And the permissiveness: even when anomalies were piling up, both programmes could always explain them by adding auxiliaries. But the difference was in the predictions.

     Debrief outline:

       1. Ask the teams to reflect on their experience.
       2. Map the game elements to Lakatos:
            - Hard core: given and protected.
            - Protective belt: the auxiliary hypotheses they added.
            - Negative heuristic: they were not allowed to change the hard core.
            - Positive heuristic: they were guided to make adjustments that protected the core. But note: Lakatos's positive heuristic is more about a predefined plan for how to develop the programme. In the game, they were reactive.
       3. Point out the scoring: 
            - 1 point for explaining: that's saving the phenomena.
            - 3 bonus points for a confirmed prediction: that's surplus content.
       4. Show the cumulative scores and how CRP overtook: that's the retrospective appraisal.
       5. Discuss the limitations:
            - Anomalies are pre-packaged and come in quick succession.
            - Predictions are immediately tested.
            - In real science, a research programme might be degenerating for a long time and then become progressive again if a new auxiliary hypothesis leads to a novel prediction that is later confirmed.
            - The game does not capture the social and historical context: why scientists stick to a degenerating programme? (because of hope, or no alternative, or investment)
       6. Also, note that in the game, the facilitator decided what counted as a match for the prediction. In reality, the scientific community decides.

     Materials list:

       - Two handouts (HRP and CRP hard core) for each team (so one per team).
       - Five anomaly cards (one for each round, same for both teams) - printed or written on paper.
       - Scorecard: one per team (we provide a template).
       - Envelopes: 5 per team (or alternatively, they can fold and staple).
       - Pens.
       - Timer.
       - Whiteboards: one per team? They can use them to sketch their theories.

     Let's write the anomaly cards:

       Anomaly1: 
