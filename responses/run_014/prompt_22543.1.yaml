answer: |-
  ## The Fragile Heart of Dispositionality: Why Masks Cut Deeper than Finks

  The seemingly simple question "What does it mean for a glass to be fragile?" has cracked open profound debates in metaphysics. The conditional analysis (CA) offers an elegant answer: fragility *is* the counterfactual conditional – "if this glass were struck, it would break." Yet, thought experiments involving finks and masks have threatened to shatter this simplicity. While both pose challenges, I contend that **mask cases expose a deeper, potentially fatal flaw in the core CA, revealing dispositions as something more than bare counterfactuals, whereas fink cases, though problematic, can be managed with careful reformulation.** The attempted "no interferer" restriction ultimately highlights this asymmetry, proving inadequate for masks while offering a path (however imperfect) for finks.

  **The Finkish Demon: A Conditional Contradiction?**
  Imagine our fragile glass. According to CA, its fragility *means* that if struck, it breaks. Enter the finkish demon: poised and vigilant, it instantly removes the glass's fragility the *very moment* before a striking event occurs. The strike happens, but the glass, now non-fragile, doesn't break. The counterfactual "if struck, it would break" is false. Yet, intuitively, *before* the demon acted – indeed, right up until the nanosecond before the strike – the glass *was* fragile. It possessed the intrinsic property that *would have* led to breaking *if* the demon hadn't intervened. The CA seems to falsely deny fragility exists before the demon acts simply because the demon *would* intervene *if* the triggering condition occurred.

  **The problem is temporal and conditional:** The CA ties the disposition's existence directly to the truth of a single, specific counterfactual involving the manifestation. The fink makes that specific counterfactual false *because* of the disposition's removal upon triggering. This creates a paradox: the glass seems fragile (it has the property), but the defining conditional is false. The fink directly **contradicts the core conditional** by ensuring the antecedent (striking) does not lead to the consequent (breaking), purely *because* the disposition vanishes upon the antecedent becoming true.

  **The Mask of Lead: Hiding the Disposition**
  Now consider the same fragile glass, intrinsically unchanged, encased in a thick, unyielding layer of lead. It is struck forcefully. Does it break? No – the lead absorbs the impact. The counterfactual "if struck, it would break" is again false. Yet, crucially, we still want to say the glass *itself* is fragile. Remove the lead, strike it, and it shatters. The fragility is present but **prevented from manifesting** by an external, masking condition. The mask doesn't alter the glass's intrinsic disposition; it creates an environment where the triggering condition fails to produce the manifestation, even though the disposition is fully present and "ready" to act.

  **The problem here is environmental interference:** The CA ties the disposition's existence to the manifestation occurring under the triggering condition. The mask ensures the manifestation doesn't occur, making the conditional false, even though the disposition persists unchanged. This suggests fragility isn't *just* about what *would* happen if struck *simpliciter*, but about the object's *intrinsic nature* that *tends* towards breaking under striking *in suitable circumstances*.

  **Weighing the Damage: Temporal Trick vs. Intrinsic Nature**
  Both cases show the simple CA is insufficient. However, their threats differ significantly:

  1.  **The Fink Challenge (Manageable Complication):** The fink attacks the CA by exploiting the *timing* of disposition removal relative to the triggering event. It creates a scenario where the disposition exists *until* the moment it's needed, ensuring the conditional is false precisely *because* the disposition flees. This seems like a flaw in how the CA *handles changes* during the triggering process. Crucially, **the fink scenario relies on the disposition being *removed*.** This suggests a path forward: reformulate the conditional to specify circumstances where the disposition *persists* through the triggering event. David Lewis's "reformed conditional analysis" (RCA) does this: "If it were struck *and retained its fragility*, it would break." This handles the fink – the demon removes fragility, so the glass *doesn't* retain it during the strike, blocking the inference that it wasn't fragile beforehand. While RCA faces its own complexities (e.g., circularity worries about "retaining the disposition"), it shows the fink problem might be solvable *within a conditional framework* by adding a clause about persistence.

  2.  **The Mask Challenge (The Deeper Threat):** The mask is far more insidious. Here, the disposition *persists* fully intact. The conditional is false *solely* due to an external, preventing factor. Adding "and retains its fragility" (as in RCA) doesn't help – the glass *does* retain its fragility! The problem isn't the disposition vanishing; it's the disposition being *blocked* from manifesting by the environment. Attempting a fix by adding "and no mask is present" trivializes the analysis ("It's fragile iff it breaks when struck, provided nothing stops it from breaking when struck"). More importantly, **the mask reveals that fragility must be an *intrinsic, categorical property* of the glass itself** – a property it possesses *regardless* of its current environment (like its molecular structure). The CA tries to *define* this intrinsic property purely in terms of what *would* happen in certain external circumstances. The mask shows that the intrinsic property can exist even when those external circumstances (suitably interpreted) don't lead to the manifestation. Dispositions, therefore, seem to be *grounded in* intrinsic properties, not reducible to bare conditionals about manifestations. The mask forces us to acknowledge the underlying "categorical base."

  **The "No Interferer" Restriction: A Revealing Failure**
  The proposed restriction – limiting the conditional to "circumstances where no fink or mask is present" – starkly highlights the asymmetry.

  *   **For Finks:** This restriction *can* work, aligning with the RCA approach. Saying "The glass is fragile iff, *in circumstances where no finkish demon is present to remove fragility*, if struck, it would break" plausibly captures the intuition. The restriction excludes the specific scenario causing the problem (the demon's intervention).
  *   **For Masks:** The restriction utterly fails. "The glass is fragile iff, *in circumstances where no mask is present*, if struck, it would break" is vacuously true *only* when the mask is absent. It tells us nothing about the glass *while masked*. Crucially, it doesn't capture our core intuition that the masked glass *is still fragile* – it only tells us what happens *without* the mask. The restriction cannot express the persistence of the disposition *through* the masking. It reduces fragility to a conditional that is only true *when manifestation is guaranteed*, failing to capture the intrinsic property that exists even when manifestation is prevented.

  **Verdict: Dispositions Transcend Conditionals**

  While fink cases expose a vulnerability in the *formulation* of the conditional analysis, particularly concerning persistence during triggering, they can be mitigated through reformulations like RCA that explicitly build in requirements about the disposition enduring. Mask cases, however, strike at the very heart of the reductive project. They demonstrate that the truth of the counterfactual conditional is neither necessary (due to masks) nor sufficient (finks show it *can* be true without the disposition persisting) for the presence of the disposition. Most devastatingly, masks reveal that dispositions are **intrinsic properties** of objects – properties like a specific molecular structure that *ground* the *potential* for manifestation under suitable conditions. The conditional describes a *typical consequence* of possessing that intrinsic property in normal environments, but it does not *constitute* the property itself.

  Therefore, finks and masks together demonstrate that dispositions are something more than conditionals. **Finks are a manageable complication for a reformed conditional analysis; masks are the real threat, exposing the need for an intrinsic, categorical basis that the conditional alone cannot capture.** To say the glass is fragile, even when wrapped in lead or guarded by a demon poised to change it, is to point to a stable property within the glass itself – a property that explains *why* it *would* break *if* certain conditions obtained, rather than being merely *defined* by that hypothetical outcome. The fragility resides in the glass, not just in the counterfactual space of what might happen to it.
