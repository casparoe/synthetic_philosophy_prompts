prompt: |-
  ok so I'm a junior and I'm the editor of our school paper and basically every week I recieve a pile of notes, texts, and 'he said she said' accounts about something that went down — a fight, a cancelled field trip, a rumor about a teacher quitting, a cheating accusation — and I have to figure out what actually happened and what I print, and if I get it wrong I either print a lie or I get the principal on my case. My advisor keeps telling me I should be weighing the explanations against each other instead of just going with whoever talks the biggest, and I think she was talking about inference to the best explanation or something like that, but I've never seen it turned into something I can actually do with my hands. Can you write me a decision procedure I can run in like 15 minutes before deadline? I want the questions in the order I should ask them, what counts as a good enough answer to each one, where the procedure just says 'no, don't run with this' or 'this is a values call, go ask the advisor,' and — this is the part I care about most — where it's going to misfire on me. I keep hearing that the best explanation isn't always the most likely one, that you can't definately just add up the virtues like simplicity and scope and fit because they don't even use the same units, and that the simplest story is sometimes the least probable one, so I need the procedure to actually handle those and not pretend they don't exist. Also tell me where I'm just going to be confirmation-biased and call whatever fits what I already believe the best explanation. I don't need a book list or anyone's name, I can't look any of that up anyway, just the actual reasoning. Then run it on two cases from this semester: (1) the spring field trip got cancelled and the admin office says it was the weather but the coach keeps saying it was the budget and two students swear they saw the principal text about costs, and (2) a senior got accused of copying a lab report, the accuser is a friend who's also in the same study group and has been acting weird, and the accused says they were home sick the whole night. I want at least one of them to land on something I don't want to print, and I want you to actually commit to the answer instead of hedging, and at the end be honest about what the procedure can't do for me.
reasoning: |-
  Okay, the user is a junior and editor of their school paper. They're dealing with verifying events like fights, rumors, and accusations each week. Their advisor mentioned using "inference to the best explanation" but they need a practical, step-by-step procedure they can use quickly before deadlines. They want a clear decision tree that includes when to stop a story or consult their advisor, and they're especially concerned about pitfalls like confirmation bias and where simple explanations might be less probable.

  First, I need to break down inference to the best explanation into actionable steps. The user mentioned key criteria like simplicity, scope, and fit, but they're worried these aren't straightforward. So the procedure should incorporate those while acknowledging their limitations. Also, they want examples where the outcome isn't what they'd prefer, to test the system fairly.

  Looking at their examples: the canceled field trip with conflicting reasons (weather vs. budget) and the cheating accusation involving conflicting student accounts. For the field trip, the admin and coach disagree, and students claim to have seen a text. For the cheating case, there's a friend accusing another, with an alibi about being sick. 

  I should design the steps to first gather all explanations, then evaluate each against evidence, check for biases, and compare them. The key is to force the user to confront inconsistencies and alternative possibilities. For instance, in the cheating case, the accuser's behavior being "weird" might indicate a personal motive, but the accused's alibi needs verification. 

  Confirmation bias is a big concern. The procedure needs steps where the user actively considers if they're favoring an explanation because it aligns with their preconceptions. Also, simplicity vs. probability: sometimes a simple story might ignore complexities, so the procedure must require looking for corroborating evidence even if an explanation seems simple.

  For the field trip example, the budget explanation might seem simpler but weather reports could easily confirm or refute the admin's claim. If the budget has more evidence but the admin denies it, that's a red flag. The procedure should flag situations where authority figures contradict evidence.

  In the cheating case, if the accuser's credibility is questionable and the alibi checks out, but there's no proof of document access, the procedure might lean towards not printing due to insufficient evidence. That's a "don't run" outcome, which the user wants to see.

  The misfires: the procedure might fail when there's hidden evidence or if the user rushes and skips steps. Also, when explanations are equally good but mutually exclusive, it can't resolve that. They'll need to consult their advisor in such cases.

  Finally, being honest about limitations: the procedure can't handle deep investigations or emotional nuances. It's a quick filter, not a substitute for thorough journalism. Emphasize that when stakes are high or sources might be harmed, they must involve the advisor.
answer: |-
  Here's a battle-tested IBE (Inference to the Best Explanation) decision procedure designed for high school journalism deadlines. It forces you to *do* the weighing your advisor wants. **Bold text is your action/decision point.**

  **The 15-Minute IBE Decision Engine**

  **PHASE 1: GATHER & FRAME (3 Min)**
  1.  **What's the Core Event?** (e.g., "Field trip cancelled", "Cheating accusation against Student X")
  2.  **List ALL Plausible Explanations:** *Force* yourself to write down *every* story offered, even ones you dislike or seem weak. (e.g., Weather, Budget, Principal Lying; Copying Occurred, Accuser Mistaken, Accuser Lying, Accused Lying).
  3.  **Identify Key Claims:** For each explanation, what are its *essential* claims? (e.g., Budget: "Funds insufficient". Weather: "Forecast dangerous". Copying: "Student A accessed Student B's work".)

  **PHASE 2: EVALUATE EACH EXPLANATION (7 Min - Do this FOR EACH explanation)**
  4.  **Evidence Fit:** What evidence *directly supports* this? What evidence *contradicts* it? **Score:** Good Fit (Most evidence aligns, few contradictions), Mixed Fit, Poor Fit (Contradictions outweigh support).
  5.  **Explanatory Scope:** Does it explain *all* the major known facts, or just some? Ignore minor details. **Score:** Broad Scope (Explains almost everything), Moderate Scope (Explains core event but leaves key facts hanging), Narrow Scope (Only explains one part).
  6.  **Simplicity (Adversarial Test):** What's the *simplest core story*? Now, ask: **"What's the *weakest point* someone could attack in this explanation?"** Does attacking that point *require* adding wildly complex or unlikely extra elements? **Score:** Robust Simplicity (Weak point minor, easy defense), Conditional Simplicity (Weak point exists, needs plausible extra element), Fragile Simplicity (Weak point fatal without major unlikely additions).
  7.  **Alternative Plausibility:** Could the evidence supporting this explanation *also* fit another explanation on your list? (e.g., Students saw a text about costs - fits Budget, *but also* fits Principal Lying *or* them misreading/misremembering). **Score:** Unique Evidence (Only fits this), Shared Evidence (Fits others too).
  8.  **Source Reliability & Motive:** For key claims supporting this explanation: How reliable is the source *usually*? Do they have a clear motive to lie/exaggerate? **Check for Bias:** **Am I favoring this explanation because it aligns with what I *expect* or *want* to be true?** Force yourself to articulate *why* you might be biased here.

  **PHASE 3: COMPARE & DECIDE (5 Min)**
  9.  **Head-to-Head:** Take the top 2-3 explanations based on Phases 1 & 2. **Compare them DIRECTLY on each virtue:**
      *   Which has **BETTER Evidence Fit**? (Fewer contradictions wins).
      *   Which has **BROADER Scope**? (Explains more core facts wins).
      *   Which has **MORE ROBUST Simplicity**? (Survives the Adversarial Test better wins).
      *   Which has **MORE UNIQUE Evidence**? (Less shared/ambiguous evidence wins).
      *   Which has **MORE RELIABLE Sources**? (Stronger track record/less motive wins).
  10. **Identify the "Best":** Does one explanation *consistently win* or *win the most critical categories* (usually Fit & Scope)? **If YES, proceed to 11.** **If NO (a tie on key points OR conflicting wins), GO TO ADVISOR IMMEDIATELY. "Values Call."**
  11. **"Misfire" & Risk Check:**
      *   **Simple but Improbable?** Did a *fragile* simplicity win because it *sounded* simple? If yes, **DON'T RUN** or **CONSULT ADVISOR**.
      *   **Scope Overreach?** Did an explanation win on scope by *assuming* unverified facts? If yes, **DON'T RUN** those parts.
      *   **Confirmation Bias Trap?** Did you score an explanation higher *despite* poor fit/reliability because it felt "right"? If yes, **RECHECK PHASE 2** for that explanation *rigorously*.
      *   **High Harm Potential?** Could this story significantly damage a reputation (student/teacher) based on this "best" explanation? If yes and evidence isn't *very* strong (Fit=Good, Sources=Reliable, Simplicity=Robust), **DON'T RUN** or **CONSULT ADVISOR**. When in doubt, don't run.
  12. **Final Decision:** **If "Best" is clear AND passes Misfire/Risk Check:** You can run with it, *stating it as the most likely explanation based on available evidence*. **If unclear, fails Misfire Check, or high risk: DON'T RUN.** Stick to verified facts only or kill the story. **"No, don't run with this."**

  **Where It Misfires & Your Biases:**
  *   **Hidden Evidence:** It only works with what you *have*. Crucial evidence you missed makes the "best" explanation wrong. (Mitigation: Phase 1 - actively ask "What *don't* I know?")
  *   **Equal Explanations:** When two explanations are genuinely equally good on paper but mutually exclusive. The procedure flags this ("Go to Advisor").
  *   **Overvaluing Simplicity:** The Adversarial Test combats this, but sometimes the *true* story *is* complex. If the complex explanation has vastly superior Fit/Scope, it *should* win. Beware dismissing complexity just because it's messy.
  *   **Confirmation Bias:** This is YOUR biggest risk. Phase 2 Step 8 and Phase 3 Step 11c are your guardrails. You *will* instinctively score explanations you *like* higher. Force yourself to articulate the *weakest* point and potential bias *every time*.
  *   **Source Charisma:** The person who "talks the biggest" gets an unfair Simplicity/Scope boost. The procedure forces you to break down their claims (Phase 2) and check Reliability/Motive.

  **Case Application: Field Trip Cancellation (Weather vs. Budget)**

  1.  **Core Event:** Spring Field Trip Cancelled.
  2.  **Explanations:** (1) Weather (Admin), (2) Budget Issues (Coach), (3) Principal Lying (Students).
  3.  **Key Claims:** Weather: Forecast bad. Budget: Funds short. Lying: Principal said weather but texted about budget.
  4.  **Evaluate:**
      *   *Weather:* Fit? Admin statement. Contradiction? Coach denies, students report text. **Score: Mixed Fit.**
      *   *Budget:* Fit? Coach statement, student report. Contradiction? Admin denial. **Score: Good Fit (if students reliable).**
      *   *Principal Lying:* Fit? Fits student report *and* admin/coach conflict. Contradiction? Why lie? Motive? **Score: Good Fit (for conflict), Poor Fit (no motive established).**
  5.  **Scope:** *Weather:* Explains cancellation, not coach/student claims. **Narrow.** *Budget:* Explains cancellation, coach, student claims. **Broad.** *Lying:* Explains admin statement, student claims, coach claim. **Broad.**
  6.  **Simplicity (Adversarial Test):**
      *   *Weather:* Weak Point: Student text/Coach denial. Defense: Students misread, coach mistaken/misinformed. **Conditional Simplicity.**
      *   *Budget:* Weak Point: Admin denial. Defense: Admin covering up budget shortfall (common). **Robust Simplicity** (Common motive).
      *   *Lying:* Weak Point: Motive? Why lie? Defense: Principal fears blame/doesn't want scrutiny. **Fragile Simplicity** (Assumes unproven malice).
  7.  **Alternative Plausibility:** Student text fits Budget *and* Lying. Not unique.
  8.  **Source Reliability:** Admin (usually reliable, motive to avoid blame?). Coach (usually reliable, motive unclear). Students (Reliability varies, motive? gossip/truth?).
  9.  **Compare Top 2 (Budget vs. Weather):**
      *   **Fit:** Budget (Good) > Weather (Mixed).
      *   **Scope:** Budget (Broad) > Weather (Narrow).
      *   **Simplicity:** Budget (Robust) > Weather (Conditional).
      *   **Unique Evidence:** Tie (Admin vs Coach/Students - both have supporting evidence).
      *   **Reliability:** Admin (Higher usually) vs Coach/Students (Lower). **Admin wins Reliability, but Budget wins Fit, Scope, Simplicity.** Budget is the *Better* Explanation overall.
  10. **Misfire Check:** *Simple but Improbable?* Budget explanation is simple & probable. *Scope Overreach?* No. *Confirmation Bias?* Did you *want* it to be a scandal (Lying)? Budget is less dramatic but better supported. *High Harm?* Accusing admin of lying is high harm - Budget doesn't require this, it just says funds short. **Passes Check.**
  11. **Decision:** **RUN with "Budget Constraints" as the likely reason**, citing Coach and student accounts. Attribute denial to Admin Office: "The administration office stated the cancellation was due to weather concerns, however, Coach [Name] and multiple students cited budgetary reasons." **You don't have to *accuse* lying, just report the conflicting accounts favoring the best explanation.**

  **Case Application: Cheating Accusation**

  1.  **Core Event:** Senior accused of copying lab report.
  2.  **Explanations:** (1) Copying Occurred (Accuser), (2) Accuser Mistaken (Similar work), (3) Accuser Lying/Drama (Weird behavior), (4) Accused Lying (Alibi false).
  3.  **Key Claims:** Copying: Accuser saw evidence/similarity. Mistaken: Work just similar. Accuser Lying: Made it up. Accused Lying: Wasn't sick/could access work.
  4.  **Evaluate:**
      *   *Copying:* Fit? Accuser statement, similarity? Contradiction? Accused alibi. **Score: Mixed Fit.**
      *   *Mistaken:* Fit? Explains similarity & accusation without malice. Contradiction? Accuser certainty? **Score: Good Fit (if accuser credible).**
      *   *Accuser Lying:* Fit? Explains "weird behavior" & accusation. Contradiction? Why lie? Proof? **Score: Poor Fit (No evidence of lie, only behavior).**
      *   *Accused Lying:* Fit? Explains alibi contradiction. Contradiction? Proof alibi false? **Score: Poor Fit (Assumes guilt).**
  5.  **Scope:** *Copying/Mistaken/Lying (Accused):* Explain accusation & alibi. **Moderate.** *Accuser Lying:* Explains accusation & behavior. **Moderate.**
  6.  **Simplicity (Adversarial Test):**
      *   *Copying:* Weak Point: Alibi. Defense: Accused lied or did it remotely/someone else helped. **Fragile Simplicity** (Requires unproven alibi lie/access).
      *   *Mistaken:* Weak Point: How similar is *really*? Defense: Common sources/study group = similar work. **Robust Simplicity**.
      *   *Accuser Lying:* Weak Point: Motive? Proof? Defense: Personal grudge/drama (needs evidence). **Fragile Simplicity**.
      *   *Accused Lying:* Weak Point: Proof alibi false? Defense: ? **Fragile Simplicity**.
  7.  **Alternative Plausibility:** "Weird behavior" fits Accuser Lying *and* unrelated stress. Similarity fits Copying *and* Mistaken. Not unique.
  8.  **Source Reliability:** Accuser (Friend, but "weird behavior" = questionable reliability/motive). Accused (Self-interest, alibi needs verification). Study Group (Potential bias either way).
  9.  **Compare Top 2 (Mistaken vs. Copying):**
      *   **Fit:** Mistaken (Good - explains similarity naturally) > Copying (Mixed - conflicts with alibi).
      *   **Scope:** Tie (Both Moderate).
      *   **Simplicity:** Mistaken (Robust) > Copying (Fragile).
      *   **Unique Evidence:** Tie (Both rely on similarity/accusation).
      *   **Reliability:** Tie (Both parties have credibility issues).
      *   **Mistaken is the CLEARLY Better Explanation** (Superior Fit & Simplicity).
  10. **Misfire Check:** *Simple but Improbable?* Mistaken is simple *and* probable (common). *Scope Overreach?* No. *Confirmation Bias?* Did you *want* to clear the accused? Mistaken does this cleanly. *High Harm?* **YES.** Accusing someone of cheating (Copying) or lying (Accuser Lying/Accused Lying) is high harm. Mistaken explanation avoids harm but is the best.
  11. **Decision:** **DO NOT RUN THE ACCUSATION STORY.** The best explanation (Mistaken) doesn't support the core event being "cheating occurred." Running it would be irresponsible and potentially libelous based on the weak evidence (one accuser with credibility questions vs. a plausible alibi and simpler explanation). If you *must* write something, it's "Unverified reports circulated regarding a lab report..." but **strongly advise against it.** Kill the story.

  **What the Procedure CAN'T Do For You:**

  1.  **Create Evidence:** It can't find witnesses you missed or get documents you can't access. Garbage In, Garbage Out.
  2.  **Handle Deep Nuance:** Extremely complex events with multiple interlocking causes might break the 15-min limit. (Flag for advisor).
  3.  **Read Minds/Hearts:** It can't *prove* motive or definitively assess "weird behavior." It flags reliability, but judgement is needed.
  4.  **Override Ethics:** If the "best" explanation still requires printing unverified high-harm accusations, the procedure says "DON'T RUN." It prioritizes responsible journalism.
  5.  **Guarantee Truth:** It finds the *best supported* explanation *with current evidence*. New evidence can change everything. You're reporting likelihoods, not certainties.
  6.  **Eliminate All Bias:** You still have to *honestly* apply the steps. It gives you tools to combat bias, but you have to wield them.

  **Key Takeaway:** This forces you to **compare explanations head-to-head on specific, journalism-relevant criteria** and **explicitly confront weaknesses and biases**. It protects you from running the most dangerous stories without absolute proof and flags when you need your advisor's help. Use it ruthlessly. Good luck, Editor!
