prompt: |-
  In a seminar on cultural evolution, a colleague argued that the meme–gene analogy is more than a metaphor: it licenses a full Darwinian science of culture. On his view, memes are to cultural inheritance exactly what genes are to biological inheritance — discrete units that vary, are differentially retained, and accumulate adaptations over time — and therefore the entire apparatus of population genetics, from replicator dynamics to fitness landscapes to drift, can be imported with only minor adjustments. Another participant objected that the analogy is loose talk that breaks the moment you press on it, and that calling something a "meme" adds no explanatory power beyond what we already have from the social sciences.

  I want a systematic audit of the meme–gene analogy. Please provide:

  1. A table of correspondences: what plays the role of gene, allele, genotype, phenotype, organism, population, mutation, recombination, fitness, selection pressure, drift, and the environment in the cultural domain. Flag any entries where the mapping is forced or where there is no natural counterpart.

  2. The structural disanalogies: identify the features of genetic evolution that have no clear analogue in cultural transmission — the Weismann barrier, the genotype–phenotype distinction, particulate inheritance, the random-variation-then-selection logic — and explain, for each, whether it is a surface-level difference or one that undermines the analogy's intended use.

  3. The features cultural transmission has that biological evolution lacks — blending inheritance, Lamarckian effects, intentional design, horizontal transmission at scale, group-level selection without group extinction — and whether these can be accommodated within a Darwinian framework or require a different kind of theory.

  4. An assessment of what the analogy can and cannot carry. Specifically: does it support the claim that culture exhibits cumulative adaptation by natural selection in anything like the biological sense? Does it support importing formal methods from population genetics? And does the research program survive once the disanalogies are on the table, or does it collapse into a loose heuristic?

  Where the analogy fails for its strongest intended use, suggest what a better analogy would be — or whether the whole project of finding a single master analogy for cultural change is itself misguided.
reasoning: |-
  Okay, the user is asking for a systematic audit of the meme-gene analogy in cultural evolution. They want a detailed comparison between biological and cultural evolution, including a table of correspondences, structural disanalogies, unique features of cultural transmission, and an assessment of the analogy's validity. 

  Hmm, this is clearly an academic query from someone deeply engaged in cultural evolution debates. The way they framed the two opposing views (strong analogy vs. loose metaphor) suggests they're looking for a balanced, rigorous analysis to inform their own position. Probably preparing for a seminar response or paper.

  First, I need to map the core components accurately. The table should cover all requested terms (gene, allele, etc.), but I must flag where mappings are problematic. For example, "meme" as gene replacement is contentious - Dawkins' original definition was vague, and modern scholars like Mesoudi treat it more flexibly. The allele equivalent is especially tricky since cultural variants aren't necessarily discrete or mutually exclusive like biological alleles.

  For structural disanalogies, the Weismann barrier is crucial - its absence in culture means acquired traits can be inherited, which fundamentally alters the evolutionary dynamic. Also, intentional design in culture breaks the "random variation + selection" logic. These aren't just surface differences; they strike at the heart of the analogy.

  Unique cultural features like blending inheritance and horizontal transmission might be technically "accommodatable" in models (e.g., using modified equations), but doing so stretches Darwinism until it's almost unrecognizable. The key question is whether such models still provide explanatory power.

  Assessment time: The analogy works best as a heuristic for cumulative adaptation, but formal model import needs heavy qualification. Population genetics tools can be useful for specific cases (e.g., pottery designs changing over time) but fail for complex phenomena like religious syncretism. The research program survives only if we accept it as one tool among many - not a grand theory.

  Final thought: Pushing the user toward "multiple analogies" framework might be most helpful. Cultural change is too heterogeneous for a single master analogy; sometimes it resembles epidemiology, sometimes engineering design. The depth of their query deserves this nuance.
answer: |-
  Here is a systematic audit of the meme-gene analogy, addressing your requests point by point:

  ### 1. Correspondences Table
  | Biological Term          | Cultural Analogue                            | Mapping Assessment                                |
  |--------------------------|----------------------------------------------|--------------------------------------------------|
  | **Gene**                 | **Meme** (e.g., "tune", "recipe", "ritual")  | **Forced**. Memes lack discrete physicality; boundaries are fuzzy. |
  | **Allele**               | **Variant** (e.g., "Happy Birthday" melodies)| **Problematic**. Cultural variants aren't mutually exclusive or discrete. |
  | **Genotype**             | **Memetic repertoire** (set of memes in a mind)| **Partial**. No coherent "code" structure; memes interact chaotically. |
  | **Phenotype**            | **Behavior/Artifact** (e.g., baked bread, dance)| **Reasonable**. Observable expressions of memes. |
  | **Organism**             | **Individual human**                         | **Superficial**. Humans *select* memes intentionally; not passive vessels. |
  | **Population**           | **Community of hosts** (e.g., language speakers)| **Reasonable**. Meme pools exist in interacting groups. |
  | **Mutation**             | **Innovation/Error** (e.g., misremembered joke)| **Partial**. Often non-random (intentional tweaks). |
  | **Recombination**        | **Blending/Remixing** (e.g., fusion cuisine)| **Problematic**. Blending is dominant, not particulate. |
  | **Fitness**              | **Cultural fitness** (e.g., catchiness, utility)| **Contested**. Depends on human psychology/society, not reproduction. |
  | **Selection Pressure**   | **Psychological/Social Biases** (e.g., conformity)| **Reasonable**. Cognitive ease, prestige, etc., filter memes. |
  | **Drift**                | **Random cultural loss** (e.g., forgotten lore)| **Reasonable**. Neutral processes occur. |
  | **Environment**          | **Physical/Social/Cognitive Context**        | **Overbroad**. Culture *shapes* its own environment dynamically. |

  ### 2. Structural Disanalogies
  | Biological Feature             | Disanalogy in Culture                                                                 | Severity                          |
  |--------------------------------|---------------------------------------------------------------------------------------|-----------------------------------|
  | **Weismann Barrier**           | **No barrier**: Acquired phenotypic changes (e.g., learned skills) are directly inherited. | **Undermining**. Core to "Lamarckian" cultural evolution. |
  | **Genotype-Phenotype Distinction** | **Blurred**: Memes *are* informational (like genotype) but often *expressed* in the same form (e.g., spoken words). | **Problematic**. Hinders "inheritance of variation" logic. |
  | **Particulate Inheritance**    | **Blending dominant**: Ideas merge continuously (e.g., ideologies), creating gradients, not discrete units. | **Undermining**. Challenges replicator dynamics foundation. |
  | **Random Variation + Selection**| **Variation often directed**: Humans *design* solutions (e.g., technology) non-randomly; selection is anticipatory. | **Undermining**. Deviates from Darwinian algorithm. |
  | **Germ Line/Soma Segregation** | **Absent**: Cultural transmission occurs via generalized learning, not dedicated channels. | **Significant**. Enables horizontal/oblique transmission. |

  ### 3. Unique Features of Cultural Transmission
  | Cultural Feature               | Biological Rarity/Absence                                      | Accommodation in Darwinian Framework? |
  |--------------------------------|----------------------------------------------------------------|---------------------------------------|
  | **Blending Inheritance**       | Rare (e.g., polyploidy); particulate norm.                     | **Partial** (e.g., continuous trait models), but strains replicator theory. |
  | **Lamarckian Inheritance**     | Nonexistent (ignoring epigenetics).                            | **Yes, but transformative**. Requires models where acquired changes are inherited (common in cultural models). |
  | **Intentional Design**         | Absent (outside artificial selection).                         | **No**. Goal-directed variation violates Darwinian randomness; requires supplementary theory (e.g., Bayesian optimization). |
  | **Horizontal Transmission**    | Limited (e.g., HGT in microbes).                               | **Yes**. Epidemic models integrate horizontal spread (e.g., SIR models in cultural evolution). |
  | **Group Selection sans Extinction** | Biologically contentious; usually requires group extinction.   | **Yes, if strong**. Cultural group selection via norm enforcement/punishment works without extinction. |

  ### 4. Assessment & Viability
  - **Cumulative Adaptation?**  
    **Yes, but differently**. Culture *does* accumulate complex adaptations (e.g., technology, institutions), but via **directed mutation** (design), **Lamarckian inheritance**, and **recombination** more than natural selection. Biological analogies explain *some* stability/change dynamics but not innovation leaps (e.g., iPhone → smartphone).

  - **Formal Methods Import?**  
    **Selectively useful**. Population genetics models (e.g., Price equation) *can* quantify cultural change *if* units are defined (e.g., baby names, arrowhead designs). However, they fail for blended, high-dimensional traits (e.g., political ideologies). **Best for simple, discrete traits with empirical data**.

  - **Research Program Survival?**  
    **Heuristic, not foundational**. The meme-gene analogy collapses under strict interpretation due to disanalogies. However, as a **flexible toolkit** within **Cultural Evolution Science** (CES), it offers value:
    - **Useful**: Generates testable hypotheses (e.g., bias-driven selection).
    - **Limited**: Cannot replace social sciences; memetics ≠ "cultural genetics".
    - **Evolving**: Modern CES uses multi-level selection, gene-culture coevolution, and cognitive models *beyond* meme theory.

  ### Toward a Better Framework
  The quest for a **single master analogy is misguided**. Culture combines:
  - **Epidemiological processes** (viral spread of trends),
  - **Cognitive design** (problem-solving),
  - **Ecological dynamics** (niche construction),
  - **Institutional evolution** (selection of rules).

  **Recommendation**: Adopt a **pluralistic analogy framework**:
  - Use **population models** for discrete cultural traits (e.g., tool types).
  - Use **diffusion models** for continuous traits (e.g., dialect changes).
  - Use **design/stimulus theory** for innovations (e.g., technology).
  - Use **complex systems theory** for emergent dynamics (e.g., norm formation).

  **Conclusion**: The meme-gene analogy is a provocative starting point but fails as a universal theory. Culture evolves, but its Darwinism is "extended" – incorporating agency, blending, and Lamarckism. A mature science of cultural change must integrate evolutionary *principles* (variation, selection, inheritance) with cognitive science, social theory, and history – not force-fit biology's machinery.
