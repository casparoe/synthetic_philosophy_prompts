answer: |-
  Your grasp of the core tension in al-Ghazālī's occasionalism is acute. This is precisely the critical objection raised against him, most famously by Ibn Rushd (Averroes) in *The Incoherence of the Incoherence*. Al-Ghazālī is acutely aware of this challenge and his response hinges on a sophisticated, multi-layered concept of agency and causation. Let's break down the objection and his defense with the precision you require.

  **The Objection (The "Self-Undermining" Charge):**

  1.  **Metaphysical Premise (Occasionalism):** God is the *only* true efficient cause (*fāʿil ḥaqīqī*). Created entities (fire, cotton, humans) possess no inherent causal power (*quwwa muʾaththira*). Their apparent connections are mere concomitants (*iqtirān*) or habits (*ʿāda*) established by God's will, subject to alteration at any moment.
  2.  **Phenomenological Premise (Human Experience):** Humans experience themselves as agents (*fāʿil*). They deliberate, choose, intend, and perform acts (*afʿāl*) that seem to originate from their own will (*irāda*) and power (*qudra*). The legal and moral framework (*fiqh*, *akhlāq*) absolutely depends on distinguishing voluntary (*ikhtiyārī*) acts (arising from choice) from involuntary (*ḍarūrī*, *idtirārī*) acts (sleep, compulsion, mistake).
  3.  **Contradiction:** If (1) is true, then the human experience in (2) is an illusion. The "choice," "will," and "power" experienced by the human are themselves created *ex nihilo* by God at each moment, along with the bodily motion deemed the "act." The human is merely the locus (*maḥall*) where God's act occurs, not its source. Therefore:
      *   Attributing the act *metaphysically* to the human is false; it belongs only to God.
      *   The distinction between "voluntary" and "involuntary" loses its *metaphysical grounding*. Both types of bodily motion are equally and directly caused by God. Any perceived difference is just another habitual correlation God creates.
      *   Punishing "the sinner" becomes incoherent. God caused the entire chain: the deceptive feeling of choice, the intention to sin, the physical movement constituting the sin. Punishing the human is punishing God's creation for what God made it do.

  **This is the core of your "self-undermining" charge: Occasionalism seemingly evacuates human agency of any real causal efficacy, rendering legal and moral responsibility arbitrary.**

  **Al-Ghazālī's Defense: The Doctrine of "Kasb" (Acquisition)**

  Al-Ghazālī's response, primarily elaborated in works like *Iḥyāʾ ʿUlūm al-Dīn* and *al-Iqtiṣād fī al-Iʿtiqād*, centers on the concept of **Kasb** (اكتساب - Acquisition). This is *not* a theory of secondary causality, but a sophisticated account of *attribution* within the framework of divine omnipotence. He navigates the tension by distinguishing *levels* of agency and causation:

  1.  **Levels of Agency:**
      *   **Real/Independent Agent (Al-Fāʿil al-Ḥaqīqī / Al-Muʾaththir al-Mustaqill):** This applies *only* to God. God creates (*yukhliq*, *yūjid*) all entities (*aʿyān*) and their states (*aḥwāl*), including human choices, powers, and bodily movements, *ex nihilo* at every moment. Causation here is absolute creation.
      *   **Acquiring Agent (Al-Fāʿil al-Kāsib / Al-Muktasib):** This applies to humans (and other creatures). Humans do *not* create (*lā yakhluq*) their acts. Instead, they "acquire" (*yaksib*) the act created by God. This "acquisition" is the crucial link for responsibility.

  2.  **The Nature of "Kasb" (Acquisition):**
      *   **Concurrent Power and Will:** Kasb occurs when God creates *simultaneously* within the human: a) the specific power (*qudra muʿayyana*) relevant to a particular act, b) the will (*irāda*) for that specific act, and c) the act itself (*fiʿl*) in the human's body/limbs. The human "acquires" the act because it occurs *through* this God-created power and will, *in accordance with* that will.
      *   **The "Through" Relation (ʿAlā Sabīl...):** The act is attributed (*yunsab*) to the human not because the human *caused* it independently, but because it occurred *through* (*ʿalā sabīl*) the power and will that God created *in* the human at that moment. It is God's act, but it is *acquired by* the human via the divinely-created instruments of power and will. Al-Ghazālī often uses the analogy of a pen writing: the pen is the "instrument" (*āla*) through which the writer writes, but the pen doesn't write by itself. Similarly, the human's power and will are the instruments through which God creates the act, and thus the act is "acquired" by the human.
      *   **Not Prior Capacity:** Crucially, this *qudra* (power) is not a *prior*, inherent faculty within the human that *then* causes the act. That would be independent secondary causality, which al-Ghazālī rejects. The power is created *concurrently* (*maʿa*) with the act and *specifically* for it. It is the *condition* for the act's attribution, not its efficient cause in the metaphysical sense.

  3.  **Grounding Voluntary/Involuntary Distinction:** This framework allows al-Ghazālī to preserve the legal distinction:
      *   **Voluntary Act (Ikhtiyārī):** Occurs *through* (*ʿalā sabīl*) a concurrent, God-created *will* (*irāda*) and the relevant specific power (*qudra*) in the human. The act is "acquired" (*maksūb*) because it aligns with this will. (e.g., Reaching for water driven by thirst).
      *   **Involuntary Act (Idtirārī/Ḍarūrī):** The bodily motion occurs *without* (*lā ʿalā sabīl*) a concurrent, God-created *will* for that specific act in the human. The relevant power may be present, but the will is absent or directed elsewhere by God. The human does not "acquire" it as *their* act, even though God creates the motion. (e.g., Hand trembling; movement under physical compulsion where the will resists; sleepwalking).

  4.  **Responsibility and Punishment:** Why punish the "acquiring agent"?
      *   **Attribution based on Kasb:** The act is *legally and morally* attributed to the human *because* it was acquired through their God-given will and power. It reflects *their* state – their desire, intention, and choice – *as created by God* at that moment.
      *   **Divine Wisdom and Custom (Sunnat Allāh):** God, in His wisdom, has established a consistent custom (*ʿāda*) whereby specific human intentions/wills are correlated with specific bodily acts. This custom provides the stable framework for law and morality. Punishing the *acquiring agent* is part of this divine custom and serves purposes like deterrence, justice within creation, and spiritual purification. It is consistent with God's justice because the punishment is applied to the *locus* whose will was aligned with the act.
      *   **The Act as "Theirs" Phenomenologically/Legally:** While the act's *ultimate ontological cause* is God, its *immediate phenomenological source* (the will/power in the human) and its *legal/moral character* make it genuinely "theirs" in the context of societal interaction and divine judgment *within creation*. God judges the human based on the state (will, intention) He created in them and the act acquired through it.

  **The Core Move and Its Vulnerability:**

  *   **Al-Ghazālī's Core Move:** He radically separates **metaphysical causation** (exclusively divine creation *ex nihilo*) from **phenomenological/legal agency and responsibility**. The latter is grounded in the divinely established correlation (*ʿāda*) between specific inner states (will, intention - also created by God) and the attribution of the resulting bodily act to the human via *kasb*. The "habit" of God that replaces natural necessity *also* includes the stable correlation between human intention and bodily action, and between action and legal consequence.
  *   **The Vulnerability (Ibn Rushd's Point):** Critics argue this fails to resolve the fundamental tension. If God creates *both* the specific intention to sin *and* the sinful act itself concurrently, the human remains purely passive. The "acquisition" seems merely verbal – a label applied by God, not a reflection of genuine causal contribution. The distinction between "voluntary" and "involuntary" hinges on God creating *different types* of inner states alongside the acts, but since *all* inner states are equally created by God at each instant, the human still lacks any true autonomy or causal role. Punishment might be "customary," but if the "sinner" was utterly determined by God's creative act, its justice remains philosophically questionable.

  **Conclusion:**

  Al-Ghazālī's position is not self-undermining *within his own theological framework* because he provides a mechanism (*kasb*) for attributing acts to humans based on divinely created concurrent will and power, distinct from involuntary motions, all while maintaining God as the sole ontological cause. He saves the phenomena of agency and legal responsibility by relocating their foundation from inherent creaturely power to God's consistent will (*ʿāda*) and the specific mode (*ʿalā sabīl*) of His creative act at each moment. However, whether *kasb* provides a *sufficient* basis for *genuine* moral responsibility, rather than just a divinely orchestrated *simulacrum* of it, remains the central philosophical criticism (as Ibn Rushd forcefully argued). Al-Ghazālī essentially argues that the stable divine custom *is* sufficient for the purposes of law, morality, and divine judgment *within the created order*, even if the ultimate metaphysical underpinning is occasionalist. His solution is a tightrope walk between divine omnipotence and the undeniable realities of human experience and social order, relying heavily on the concept of habitual divine action to bridge the gap Hume would later find so problematic. The sophistication lies in the layered definitions of "agent" and "act," separating ontology from phenomenology and law. Whether it ultimately holds is a different question, but it's a carefully constructed, not merely hand-waved, response to the objection you rightly identify.
