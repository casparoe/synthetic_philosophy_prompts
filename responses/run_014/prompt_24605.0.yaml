prompt: |-
  I'm trying to pin down, by my gut on cases, when a reversal between aggregate and subgroup rates actually counts as a Simpson's paradox worth reporting and acting on, versus when it's a compositional artifact or a different phenomenon altogether. Here are my verdicts on concrete setups. (A) A treatment is assigned more heavily to sicker patients: in the mild group it recovers 80% against 60% for control, in the severe group 40% against 20%, but because it skews toward the severe group it reads 44% against 56% in aggregate. I call this a genuine Simpson's paradox — the subgroup is a common cause of both assignment and outcome, so I stratify and report the within-group effects. (B) A reversal that appears because I condition on a variable that is a common effect of both the treatment and the outcome, a collider; the numbers flip exactly as in (A), but I think conditioning here is the error and I would not stratify. (C) A reversal with no causal story — two clinics merely serve different health profiles and the 'subgroup' is an arbitrary cut through a continuum; I don't call this Simpson's paradox, just a base-rate or composition difference. (D) A selection procedure, like admissions or lending, where the 'subgroup' is a protected attribute and the aggregate rate favors one group while within-group rates favor the other; I stratify, but for a different reason than (A) — not because of confounding, but because the group is itself what we are trying to measure. (E) A case where the aggregate answer is 'what should the policy be' and the within-group answer is 'what should this individual do,' where I think both are right and I refuse to crown one. The one I keep going back and forth on is (F): the grouping variable is a consequence of the treatment, a post-treatment mediator, and the reversal shows up after conditioning on it — is that a Simpson's paradox I should report, or am I creating the reversal by conditioning downstream? What principle, if any, captures all of these — what makes a reversal genuine and warranting stratification, and what makes it an artifact or a different question? State it precisely, tie each clause to the case that motivates it, apply it to (F) and to one case I haven't listed, and be honest about which of my verdicts it cannot accommodate. End your reply with a single line of the form: Overturned: <letter of one of my cases, or NONE>.
