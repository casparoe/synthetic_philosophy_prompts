answer: |-
  ### Principle for Genuine Simpson's Paradox and Warranting Stratification

  **Stratification is warranted when the grouping variable is a *pre-treatment confounder* or *the primary variable of interest*, and conditioning avoids bias or answers a targeted question. It is unwarranted when conditioning introduces bias (e.g., by conditioning on a collider or post-treatment variable) or when the reversal is a compositional artifact without causal implications. Specifically:**

  1. **Stratify if the grouping variable is a confounder (common cause of treatment and outcome)**. This avoids confounding bias and reveals the true within-group effects.  
     *Motivated by (A)*: Severity is a pre-treatment confounder (causes both treatment assignment and outcome). Stratifying yields valid causal estimates within groups.

  2. **Stratify if the grouping variable is the primary variable of interest (e.g., fairness or effect heterogeneity)**. This addresses the core question, regardless of confounding.  
     *Motivated by (D)*: Protected attributes (e.g., race) are intrinsically relevant for fairness. Stratifying reveals disparities even without confounding.

  3. **Do not stratify if conditioning introduces bias (e.g., collider or post-treatment mediator)**. This avoids creating spurious associations or blocking causal pathways.  
     *Motivated by (B) and (F)*:  
     - *(B)*: Conditioning on a collider (common effect) induces bias. Avoid stratification.  
     - *(F)*: Conditioning on a post-treatment mediator blocks the treatment's effect and may create a reversal. Avoid stratification for total effect estimation (see below).

  4. **Aggregate reporting suffices if the reversal is compositional (no causal link) or reflects distinct policy/individual questions**. Stratification may be descriptive but not causal.  
     *Motivated by (C) and (E)*:  
     - *(C)*: Arbitrary cuts (e.g., clinic groups) reflect base rates, not causality. Aggregate is valid for overall rates.  
     - *(E)*: Aggregate (policy) and within-group (individual) answers are both legitimate; neither is "wrong."

  ### Application to (F): Post-Treatment Mediator
  - **Verdict**: **Do not stratify**. The grouping variable (e.g., a biological marker affected by treatment) is a consequence of treatment, making it a post-treatment mediator. Conditioning on it:  
    - Blocks the indirect effect of treatment (if the mediator is on the causal path).  
    - May induce collider-like bias if the mediator is influenced by unobserved factors.  
    - Creates an artificial reversal that misrepresents the total treatment effect.  
  - **Action**: Report the aggregate effect for the total treatment impact. If direct/indirect effects are needed, use mediation analysis (e.g., structural models), not stratification.

  ### Application to a New Case: (G) Effect Modifier Without Confounding
  - **Setup**: A drug works better for men (recovery: 90% treatment vs. 60% control) than women (50% vs. 40%). Due to more women in the treatment group, aggregate recovery is lower for treatment (65%) vs. control (55%). No confounding (gender doesn’t affect assignment).  
  - **Analysis**:  
    - **Reversal cause**: Effect modification + compositional imbalance.  
    - **Stratify? Yes, but for descriptive (not causal) reasons**. Gender is an effect modifier of interest, so stratification shows heterogeneity. However, the aggregate is unbiased for the average treatment effect (ATE) since no confounding exists.  
  - **Principle application**: Stratification is warranted under clause 2 (variable of interest for heterogeneity), but the reversal is not causal Simpson's paradox (no confounder). Aggregate remains valid for ATE.

  ### Limitations and Honest Assessment
  - **Accommodates all your cases**: The principle aligns with your verdicts:  
    - (A): Confounder → stratify.  
    - (B): Collider → no stratification.  
    - (C): Compositional → no stratification (aggregate suffices).  
    - (D): Variable of interest → stratify.  
    - (E): Both aggregate and within-group valid → neither "crowned."  
    - (F): Post-treatment → no stratification.  
  - **One verdict it cannot fully accommodate**: Your (C) verdict calls it "not Simpson's paradox," but strict statistical definitions classify any reversal as Simpson's paradox, regardless of causality. The principle agrees with your *action* (no stratification) but reframes it as a "compositional artifact" under clause 4, avoiding the label "genuine Simpson's paradox" (which implies causal confounding).

  Overturned: NONE
