  **Additionally, in the absence of a causal link (case C) or when the grouping variable is an effect modifier (case G), we might still stratify for descriptive purposes (to show heterogeneity) but not because of confounding.**

  However, note that in case G, if the grouping variable is an effect modifier and we are not conditioning on a confounder, we might get a reversal due to the distribution of the effect modifier. We would still want to report the subgroup effects to show the heterogeneity, even though the aggregate reversal might be due to base rates and effect modification. This is similar to case C but with a causal effect modification.

  But note: in case C, you had no causal story. In case G, we have a causal effect modification (the treatment effect is different by group). So we would stratify in case G.

  Now, let's apply the principle to case F: the grouping variable is a post-treatment mediator. We should not condition on it for estimating the total effect because it blocks the pathway. Therefore, the reversal is an artifact and we should not report it as a genuine Simpson's paradox for the total effect.

  What about one of your verdicts that the principle might not accommodate? Let's check:

  - Case E: You say both aggregate and within-group are right. The principle above does not directly address this because it focuses on when to stratify for causal inference. In case E, the aggregate is the average treatment effect for the population (if we assume no confounding) and the within-group is the conditional effect. Both are valid in their own right. The principle does not say we should not stratify in case E? Actually, in case E, we might not have a reversal due to confounding but due to the nature of the decision. The principle does not cover this because it's about two different questions. We might say that the principle only applies to causal inference and not to decision making. So the principle is limited to causal inference settings.

  Revised principle to be more precise:

  **In the context of causal inference, a reversal (Simpson's paradox) is genuine and warrants stratification when the grouping variable is a confounder (common cause) of the treatment and outcome. In non-causal descriptive settings, stratification might be warranted if the grouping variable is of intrinsic interest (e.g., protected attribute) or to show effect modification, even without confounding. However, conditioning on a collider or a post-treatment mediator is generally to be avoided because it induces bias.**

  Now, let's see if we can accommodate all:

  - (A): confounder -> stratify.
  - (B): collider -> do not stratify.
  - (C): arbitrary cut, no causal -> not a Simpson's paradox? But note: if we are interested in the overall effect, we report aggregate. If we are interested in the subgroups (e.g., for resource allocation), we might stratify. So it's not that we never stratify, but we don't call it Simpson's paradox. The reversal is due to base rates. We might report both and note the composition.
