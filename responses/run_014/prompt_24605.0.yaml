  We are trying to determine when a reversal (Simpson's paradox) is genuine and warrants stratification, versus when it is an artifact or a different phenomenon.

  Your cases:

  (A) Common cause: subgroup (severity) is a confounder (common cause of treatment assignment and outcome). Stratify and report within-group effects.

  (B) Conditioning on a collider: the subgroup is a common effect of treatment and outcome. Conditioning induces a spurious association. Do not stratify.

  (C) Compositional difference: no causal link, just base rates. Not Simpson's paradox. Do not stratify.

  (D) Protected attribute: we care about the group itself (e.g., fairness). Stratify for different reasons (fairness, not confounding).

  (E) Different questions: aggregate for policy, individual for individual decision. Both are valid.

  Now, (F): The grouping variable is a post-treatment mediator (a consequence of the treatment). Conditioning on it may block part of the treatment effect and induce a reversal.

  Principle:

  A reversal is genuine and warrants stratification when:

  1. The grouping variable is a confounder (a common cause of treatment and outcome) and we are interested in the direct effect of the treatment (case A), OR
  2. The grouping variable is the variable of primary interest (e.g., protected attribute, case D) and we want to measure its effect or ensure fairness.

  A reversal is an artifact and we should avoid conditioning when:

  1. The grouping variable is a collider (case B) or a post-treatment variable (case F) and conditioning would induce bias by either creating a spurious association or blocking the causal pathway.

  Additionally, we should note:

  - In case C, the grouping variable is not a confounder but an arbitrary partition. The reversal is due to base rates and is not a causal Simpson's paradox. We might report the aggregate as the overall effect and note the composition.

  - In case E, the reversal reflects two different questions: the aggregate for the population level and the conditional for the individual. Both are valid in their context.

  Applying the principle to (F):

  In (F), the grouping variable is a mediator (post-treatment). Conditioning on a mediator blocks the indirect effect and can create a reversal that does not reflect the total causal effect of the treatment. Therefore, we should not condition on it for the purpose of estimating the total treatment effect. This reversal is an artifact of conditioning and not a genuine Simpson's paradox that warrants stratification for causal inference about the treatment. However, if we are interested in direct effects (and have designed the analysis appropriately for mediation analysis), we might condition, but that is a different goal.

  What about a case not listed? Let's consider:

  (G) The grouping variable is an effect modifier (moderator) but not a confounder. For example, treatment works better in one subgroup than another, and the aggregate reversal occurs because of the distribution of subgroups. In this case, the grouping variable is not a confounder (so not a common cause) but it modifies the effect. Here, we would want to stratify to show the heterogeneous effects, even though there is no confounding. This is different from Simpson's paradox, but the reversal might occur. We stratify to report effect modification.

  Now, let's capture:

  The principle:

  **Stratification (and reporting within-group effects) is warranted if the grouping variable is either:**
  - **A confounder (common cause of treatment and outcome) and we are interested in the unconfounded effect (case A), OR**
