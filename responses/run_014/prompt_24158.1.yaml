  Correlation is the real killer though. The moment votes aren't independent, CJT's machinery breaks. And in reality, shared biases/media create positive correlation, which *reverses* the theorem: larger groups become *less* reliable. That's catastrophic for real-world applications. Should emphasize this as the #1 defeater. 

  The "no fact of the matter" point is philosophically thorny. For factual decisions (e.g., "is this defendant guilty?"), competence is measurable. But for normative votes (e.g., "should we raise taxes?"), truth may not exist. CJT defenders might retreat to "this only applies to factual questions," but that's a huge limitation. 

