answer: |-
  ## Speech Act Evaluation Procedure for Novelists

  **Purpose:** To determine if a character's utterance successfully performs a specific intended act (e.g., bet, promise, order, marriage) within the fictional context, ensuring narrative coherence in subsequent chapters.

  **Core Principles (Simplified):**
  1.  **Saying vs. Doing:** Uttering words (*locutionary act*) is different from performing an action *by* uttering them (*illocutionary act* - e.g., betting, ordering).
  2.  **Success (Happy):** The act is performed effectively and completely.
  3.  **Misfire:** The act *fails* to be performed due to flawed context, procedure, or authority.
  4.  **Abuse:** The act is performed successfully *but* insincerely (e.g., a promise made with no intent to keep it). It still *happened*.
  5.  **Authority:** Some acts (marrying, sentencing, bequeathing) *require* specific institutional roles or contexts. Others (promising, betting, ordering within a hierarchy) may require relevant standing or relationship.
  6.  **Uptake:** Many acts require the hearer to recognise the *intended* illocutionary force (e.g., understanding "Shut the door" as an order, not a description) for the act to be complete. Some acts (like warning or advising) depend heavily on uptake for their effect, but the *act* of warning/advising might still occur without it.
  7.  **Consequences:** What happens *after* the act (the *perlocutionary effect* - e.g., the door actually being shut, someone being offended) is separate from whether the act itself was successfully performed.

  **The Checklist/Flowchart: (Apply per utterance/scene)**

  1.  **What action does the *author* intend the character to perform with these words?** (e.g., Bet, Order, Promise, Marriage)
      *   *Authorial Input Required. Be specific.*

  2.  **Is the utterance formulated as the *conventional type* of speech act intended?**
      *   *Check:* Does it use typical phrasing? (e.g., "I bet...", "I promise...", "I order you to...", "I now pronounce you...", "I bequeath...", "I name this ship...")
      *   *Sufficient for Fiction:* Generally yes, unless the phrasing is wildly unconventional *and* context doesn't clarify. Unconventional phrasing risks misfire.
      *   *If NO & Context Unclear:* **Potential Misfire.** Flag for Authorial Judgment on clarity. Proceed cautiously.

  3.  **Does the character have the *requisite standing or authority* to perform this act *in this context*?**
      *   *Check:* Does the act require a specific role (Captain, Priest, Parent, Executor)? Does the speaker hold that role *within the fictional world's rules*? For less formal acts (promise, bet), does their relationship/context give them standing (e.g., a parent can order a child, a commander a subordinate)?
      *   *Sufficient for Fiction:* Clear evidence of standing/role in the scene or established earlier in the narrative.
      *   *If NO (and authority is required):* **Misfire.** The act fails. (e.g., non-captain giving ship orders, non-priest marrying).
      *   *If Authority Ambiguous:* Flag for Authorial Judgment on established world/rules.

  4.  **Are the *essential contextual conditions* present?**
      *   *Check:* Is the situation appropriate? (e.g., Bet requires something to bet *on*; Marriage requires consenting parties present; Bequest requires the item exists and belongs to the speaker; Apology requires a perceived wrong). Are necessary participants present?
      *   *Sufficient for Fiction:* Scene clearly establishes the basic conditions.
      *   *If NO (and conditions are essential):* **Misfire.** (e.g., Betting on an already known outcome, marrying someone absent).
      *   *If Conditions Ambiguous:* Flag for Authorial Judgment.

  5.  **Is the act performed *seriously and completely*?**
      *   *Check:* Is the speaker being serious, not joking, acting, or under clear duress? Is the utterance complete? (e.g., "I pro-" cut off isn't a promise).
      *   *Sufficient for Fiction:* No overt signs of jest, acting, or coercion within the scene.
      *   *If NO:* **Misfire** (if incomplete/coerced) or **Abuse** (if insincere but complete).
      *   *If Ambiguous:* Flag for Authorial Judgment (e.g., sarcasm unclear?).

  6.  **Is *uptake* (recognition/acceptance) required for this act to succeed, and was it achieved?**
      *   *Check:*
          *   *Authority-Heavy Acts (Marrying, Sentencing):* Uptake (understanding/consent) is often part of the procedure but the *act* itself hinges on authority/procedure. Consent is usually a *condition*, not uptake of the illocutionary force.
          *   *Agreement Acts (Bet, Promise, Contract):* **Requires Uptake.** The hearer must understand it *as* the act and accept/agree (explicitly or by clear conventional implication).
          *   *Directive Acts (Order, Request):* **Requires Uptake.** The hearer must understand it *as* an order/request for the illocutionary act to be complete. *Compliance* is the consequence, not part of the act itself.
          *   *Declaration/Effect Acts (Naming, Bequeathing):* Uptake is generally *not* required for the act to occur (if authority/conditions are met). The effect might happen regardless.
      *   *Sufficient for Fiction:* Clear verbal acceptance (e.g., "Done!", "I accept", "I promise"), conventional non-verbal acceptance (nod, handshake *in context*), or context making refusal/ignoring highly implausible. For directives, clear understanding shown in dialogue/action ("Aye, Captain!" / visible reaction).
      *   *If Uptake Required and Not Achieved:* **Misfire** (the specific act wasn't completed). (e.g., Bet not accepted, Order not understood *as* order).
      *   *If Uptake Ambiguous:* Flag for Authorial Judgment.

  **Output:**
  *   **Success:** The act was performed. Proceed narratively as if binding.
  *   **Misfire:** The act was *not* performed. Subsequent reliance on it being binding creates incoherence.
  *   **Abuse:** The act *was* performed successfully but insincerely. It can be treated as binding *unless* the insincerety is revealed/shown to undermine it later (narrative consequence, not act failure).
  *   **Authorial Judgment Needed:** The procedure hits ambiguity based on drafted text/world-building. Author must decide intent/clarity and potentially revise scene or later reliance.

  **Key Simplifications & Warnings:**
  1.  **"Institutional Authority":** Simplified. Real-world nuances (de facto vs de jure authority, customary power) are flattened. Fiction can *establish* its own rules, but they must be clear.
  2.  **"Uptake":** This is the trickiest part. The distinction between *understanding the illocutionary force* (required for directives/agreements) and *consenting/complying* (consequence) is crucial but subtle. The procedure errs on the side of needing clearer signals in fiction to avoid reader confusion.
  3.  **Context is King:** The checklist depends heavily on what the *scene as written* establishes. Unwritten assumptions by the author don't count until they are textual.
  4.  **Consequences ≠ Success:** An act can succeed yet have unintended consequences; an act can misfire yet trigger significant events. Focus is on the *act itself*.
  5.  **Nuance Lost:** Complexities like indirect speech acts ("It's cold in here" implying "Shut the window") are handled crudely (see Step 6 uptake). Highly ironic or metaphorical language risks misfiring unless context is crystal clear.
  6.  **Procedure Misfires When:** Dialogue is highly ambiguous, relies on unestablished cultural norms, involves unreliable narration not signposted, or uses deeply unconventional performatives without clear context.

  ---

  **Application to Draft Scenes (British English):**

  **Scene 1: The Pub Bet**
  1.  **Intended Act:** Bet.
  2.  **Formulation:** "Fifty quid says..." - Conventional bet formulation.
  3.  **Authority/Standing:** No special authority needed. Brothers can bet. Standing OK.
  4.  **Context:** Dad walking out is a future, uncertain event. Basic conditions OK.
  5.  **Serious/Complete:** Seems serious. Utterance complete.
  6.  **Uptake Required?** **YES** (Agreement act). **Achieved?** Younger brother laughs and nods while ordering a pint.
      *   *Analysis:* Laughing and nodding is highly ambiguous. It could be acknowledging the *statement* ("Dad probably will leave"), finding the *idea* funny, or *accepting the bet*. Ordering a pint isn't a conventional acceptance signal. Explicit acceptance ("You're on!", "Done") is missing. Context doesn't make refusal implausible (they are estranged). **Uptake not clearly achieved.**
      *   **Verdict: MISFIRE.** The bet was not successfully completed due to lack of clear uptake/acceptance. The subsequent dispute is coherent – no binding bet was made. *Author Note: To make it binding, add clearer acceptance (e.g., "You're on," handshake, "Done") or context forcing the interpretation (e.g., younger brother immediately pulls out his wallet).*

  **Scene 2: The Ship's Hatch**
  1.  **Intended Act (by Captain?):** Order. *(Authorial Intent: Ambiguous for plot, but procedure tests if it *could* be an order)*
  2.  **Formulation:** "It would be nice if that hatch were secured before dark." - **Not** a conventional order formulation. Indirect, suggestive.
  3.  **Authority/Standing:** Captain has authority to give orders to deckhand. Standing OK.
  4.  **Context:** Hatch securing is a deckhand duty. Context OK.
  5.  **Serious/Complete:** Seems serious (exhausted captain). Utterance complete.
  6.  **Uptake Required?** **YES** (Directive act). **Achieved?** Deckhand hears it as a tired observation, not an order. Does nothing. *No* sign he understood the *illocutionary force* as an order.
      *   *Analysis:* The unconventional phrasing ("It would be nice if...") strongly suggests an observation or wish, not a direct order. Captain's exhaustion reinforces this. No indication deckhand took it as binding. **Uptake not achieved.**
      *   **Verdict: MISFIRE (as an order).** The utterance did not successfully perform the illocutionary act of *ordering*. It may have been an observation, suggestion, or indirect request, but not a binding order. The inquiry can justifiably find no order was given. *Author Note: To make it an ambiguous order readers might debate, use a slightly more imperative but still indirect phrasing ("See that the hatch is secured before dark", "I'd like that hatch secured before dark").*

  **Scene 3: The Cliffside Elopement**
  1.  **Intended Act:** Marriage.
  2.  **Formulation:** "He pronounces the couple married" - Implies conventional marriage pronouncement phrasing. Formulation OK.
  3.  **Authority/Standing:** **Crucial.** Friend's online ordination lapsed. Does he hold the *institutional authority* required to solemnise marriage *within the fictional world's legal/social framework*? The text states it's lapsed, implying he *lacks* the necessary authority.
  4.  *Analysis stops at Step 3.* Lacking the requisite authority is a fundamental flaw.
      *   **Verdict: MISFIRE.** The marriage ceremony was not successfully performed *as a legal/formal institutional act* due to lack of authority. It is void *institutionally*.
      *   ***The Verdict You Won't Like:*** Despite your desire for readers to accept them as married "in every sense that matters," the procedure, based on the *institutional act* of marriage, concludes it misfired. The inheritance dispute relying on *legal* marriage is therefore coherent – they aren't legally married. However...
      *   *Authorial Path Forward:* This verdict **doesn't** preclude:
          *   The characters *believing* they are married (sincere but mistaken).
          *   A powerful *social* or *personal* sense of marriage being created ("married in the eyes of God/hearts").
          *   The ceremony having deep *emotional* or *narrative* weight.
          *   The inheritance dispute *failing* because someone *else* accepts the marriage as valid socially/morally, or because of other factors (a will recognising the union, cohabitation rights in that jurisdiction?).
      *   The procedure only says the *institutional speech act* failed. You can absolutely achieve the *feeling* of them being married *to the reader* and drive the dispute via other means (their belief, societal pressure, loopholes, emotional blackmail). But if the dispute *strictly hinges on legal marital status*, the lapsed ordination makes that status void.

  **Conclusion: What the Procedure Cannot Settle**

  The procedure cannot determine the *emotional truth*, *symbolic weight*, or *narrative power* of an utterance. It cannot judge if a character *feels* bound by an insincere promise (Abuse) or an act they mistakenly believe succeeded. It cannot resolve ambiguities deliberately crafted for dramatic irony unless the text provides clear signals within the scene. It cannot override the author's established world-building if that world has different rules for speech acts (e.g., "In this culture, bets are binding on a nod"). Its sole focus is the pragmatic success of the *specific illocutionary act* as understood through basic speech act theory, ensuring that later plot points relying on that act being binding (or not) are coherent *based on the textual evidence presented in the scene*. Final dramatic impact and thematic resonance remain firmly in the author's domain.
