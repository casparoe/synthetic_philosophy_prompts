     However, in our finite game, we might eventually have a set that we consider the universe. But note: in ZFC, we don't have a set of all sets. So we should avoid creating one.

     But the activity is finite, so we might end up with a finite universe. We have to be honest that in the finite case, we can have a universal set without contradiction? Actually, in a finite set theory, we can have a universal set? Because we don't have the same infinity issues? But note: Russell's paradox is about self-reference and doesn't depend on infinity. Even in a finite setting, if we have a set that contains all sets (including itself) then we can form the Russell set from it and get a contradiction.

     Therefore, to avoid the paradox, we must not have a set that contains all sets. And in ZFC, we don't.

     So in the activity, we can let the students try to create a universal set. They might try:

          "I want to form the set of all sets. I choose to form it from the current universe, which is the set of all sets we have so far. But then I get a new set, which is the same as the current universe? But then when I add this set to the universe, I have a new set that is not in the universe? So then I need to update the universe? And then the universal set I just created is not universal anymore because the universe grew."

     This is the idea of the set of all sets not existing because it would have to contain itself and then also contain any new set we form from it? But in ZFC, we don't have such a universal set.

     So in our activity, we can try:

          Step: Let the students try to create the set of all sets.

          How? They must specify a pre-existing set. But there is no pre-existing set that contains all sets (because we don't have one). They might try to use the entire universe we have so far? But that universe is not a set? We have to enforce: the pre-existing set must be a set that we have already created. And we don't have a set that contains all sets we've created so far? Actually, we might have been building one? Or we might not.

          We can start without a universal set. And when they try to form a universal set, they have to choose a pre-existing set. What pre-existing set could they use? They might try to form a set that contains every set they have. But then when they create that set, they are creating a new set that was not in the pre-existing set? No: they are forming a subset of a pre-existing set. They cannot form a set that is bigger than the pre-existing set.

          So they cannot form a universal set because they don't have a pre-existing set that is universal.

