  Student answer: 
  "The Humean base is the totality of local qualitative facts about the particular things and events in spacetime, what Lewis calls the mosaic, with no appeal to anything nomological or modal." 
  - This is correct. The Humean base (or supervenience base) is indeed the entire collection of particular matters of fact (the "mosaic") without any modal or nomological primitives.

  "The best system account ranges over all true deductive systems and picks the one that is strongest, i.e. the one that deduces the most truths about the mosaic, since simplicity is just a way of measuring strength."
  - This is partially correct but misleading. Lewis's BSA considers deductive systems that are true (i.e., their theorems are true about the mosaic). But the best system is chosen by balancing two virtues: strength (how much it entails about the mosaic) and simplicity. The student says "simplicity is just a way of measuring strength" which is incorrect. Simplicity and strength are distinct and often competing virtues. We want the system that achieves the best balance of simplicity and strength.

  "The laws of nature are then the salient theorems of this best system."
  - Correct. The laws are the axioms or theorems of the best system (especially the ones that are universal generalizations).

  "This is a Humean view because everything, including the laws, supervenes on the mosaic, so there are no extra fundamental necessities."
  - Correct. Humeanism is characterized by the supervenience of everything (including laws) on the Humean mosaic.

  "Since Humeanism denies necessary connections, the BSA is really just a sophisticated version of the regularity theory: the laws just describe the regularities that are in the mosaic."
  - Partially correct. Lewis's BSA is a form of Humeanism and regularity theory, but it is more sophisticated than a simple regularity theory because it allows for laws to be the axioms of a system that best balances simplicity and strength, which might include laws that are not immediately apparent from the regularities (e.g., probabilistic laws). However, it is still a regularity theory at base.

  "And the laws are contingent, since a different mosaic would have selected a different best system."
  - Correct. The laws are contingent because they depend on the actual mosaic. In a different possible world with a different mosaic, the best system (and hence the laws) would be different.

