  Okay, the user is writing a piece on moral heroism and presented a debate between two ethicists about supererogation. I need to break down their arguments step by step and act as a referee. 

  First, let me make sure I understand the core disagreement. Ethicist 1 argues that supererogation is coherent because praise is based on the good produced and the sacrifice made, not obligation. Ethicist 2 claims this view makes "optionality" meaningless - if praise only tracks value, then optional acts shouldn't get extra praise, yet we do praise them more, suggesting obligation must be involved somehow.

  Hmm, both make valid points but seem to talk past each other. Ethicist 1 correctly identifies that value and sacrifice ground praise independently of obligation. But Ethicist 2 is right that "extra praiseworthiness" for optional acts needs explanation. 

  The kidney donation example is perfect for testing this. When we praise someone for donating a kidney, is it because they weren't obligated (as Ethicist 2 implies) or because of the immense sacrifice (as Ethicist 1 says)? I think Ethicist 1 has a stronger case here - we'd praise someone equally if they were obligated but still made the sacrifice, right? Like a firefighter saving lives as part of their job.

  But then Ethicist 2's point about costless kindnesses is tricky. Holding a door for someone costs nothing, yet we still call it "praiseworthy" in a mild way. Ethicist 1 says this proves praise comes from value alone, but Ethicist 2 counters that without optionality, it's not supererogatory. Both are missing that praise has degrees - small acts get mild praise, heroic acts get high praise, regardless of obligation.

  What both overlook: the social dimension of praise. We praise more when acts exceed expectations, which ties to community norms, not abstract obligation. Also, they conflate "praiseworthy" with "supererogatory" - the first is about desert, the second about non-requirement. 

  For the user's article, I should emphasize that supererogation survives Ethicist 2's challenge if we distinguish grounds of praise (value/sacrifice) from conditions for supererogation (non-obligation). The "extra" praise comes from surpassing normal expectations, not some hidden duty. Maybe mention J.O. Urmson's classic work on saints and heroes here.

  The unresolved tension is whether "obligation" is binary or scalar. Ethicist 2 assumes if an act is good, it must be required unless we deny its value - but that's the false premise Ethicist 1 identified. We can consistently say donating kidneys is immensely valuable yet not obligatory because morality allows self-preservation.
answer: |-
  Based on your detailed account, let's break down the debate step-by-step, assess who has the stronger argument at each point, identify crucial omissions, and determine the overall winner:

  **Step 1: Ethicist 1's Initial Argument**  
  *Claim*: Supererogation is coherent. Praise tracks the **good produced** (saving a life), not obligation. Optionality merely distinguishes supererogatory acts from obligatory ones.  
  *Strength*: ✅ **Strong**. She correctly decouples praiseworthiness from obligation. Praise *can* arise from good consequences or virtuous character independently of duty (e.g., we praise artistic genius or accidental heroism without implicating obligation).  
  *Missed Nuance*: She doesn't address *why* we perceive supererogatory acts as *distinctly admirable* compared to obligatory good acts.

  **Step 2: Ethicist 2's Pushback**  
  *Claim*: If praise only tracks value, optionality is irrelevant. But we *do* see donated kidneys as **more praiseworthy** than obligatory lifesaving (e.g., a paramedic doing their job). Thus, optionality must contribute to praiseworthiness, implying a hidden duty.  
  *Strength*: ✅ **Partially Strong**. She correctly identifies the intuition of *extra* praiseworthiness in supererogation. Her challenge to Ethicist 1's value-only model is valid.  
  *Weakness*: ❌ She conflates **two distinct phenomena**:  
  - *Grounds of praise* (why an act deserves any praise at all: value/sacrifice)  
  - *Degree of praise* (why some praiseworthy acts deserve *more* praise: context, optionality, sacrifice)  
  *Missed Nuance*: Assuming optionality *must* imply hidden obligation is a false dichotomy.  

  **Step 3: Ethicist 1's Sacrifice Counter**  
  *Claim*: Extra praise stems from **sacrifice/cost** (e.g., losing a kidney), not obligation. Costless acts (e.g., small kindnesses) are praiseworthy too, but less so due to lower effort/good.  
  *Strength*: ✅ **Strong**. Sacrifice *is* a key amplifier of praise (e.g., we praise risky heroism more than safe assistance). Costless acts support her claim that obligation isn’t necessary for praise.  
  *Missed Nuance*: She doesn’t explain why two acts producing *identical* good with *identical* cost might differ in praise if one is obligatory (e.g., conscripted soldier vs. volunteer).  

  **Step 4: Ethicist 2's Cost/Value Rebuttal**  
  *Claim*: Sacrifice alone can’t explain praise (costly acts with no good aren’t praised). Ethicist 1 "smuggles value back in," but optionality’s role remains unexplained.  
  *Strength*: ✅ **Strong on sacrifice**. Correctly notes that sacrifice without good isn’t praiseworthy (e.g., fasting for no reason).  
  *Weakness*: ❌ **Misreads Ethicist 1**. Ethicist 1 explicitly links praise to value *and* sacrifice—not value alone. Ethicist 2 still ignores that optionality might affect *degree of praise* without implying obligation.  

  **Crucial Omissions by Both Ethicists:**  
  1. **The Role of Norms and Expectations**: Praise reflects **contextual moral expectations**. Supererogatory acts exceed baseline duties (e.g., donating a kidney when society only expects blood donations). This explains "extra praise" without hidden obligations.  
  2. **Scalarity of Praise**: Praise isn’t binary. Acts can be:  
     - *Permissible* (no praise/blame)  
     - *Obligatory* (praise for compliance, blame for omission)  
     - *Supererogatory* (high praise for performance, no blame for omission)  
  3. **Agent-Relative Costs**: Sacrifice is subjective. A billionaire donating $1M may cost less *to them* than a pauper donating $100. Optionality lets agents choose when to bear costs, enhancing admirability.  

  **Referee's Verdict:**  
  - **Round-by-Round Winner**:  
    - Step 1: Ethicist 1 (✅ Coherent decoupling of praise/obligation)  
    - Step 2: Ethicist 2 (✅ Highlights the "extra praise" problem)  
    - Step 3: Ethicist 1 (✅ Sacrifice better explains degree of praise)  
    - Step 4: Draw (❌ Ethicist 2’s sacrifice critique is strong, but misrepresents Ethicist 1; ❌ Ethicist 1 doesn’t resolve optionality’s role).  
  - **Overall Winner**: **Ethicist 1** (by a narrow margin).  
    - *Why*: Her core model (praise derives from value + sacrifice, independent of obligation) survives Ethicist 2’s objections. Ethicist 2’s "hidden obligation" claim creates more problems than it solves (e.g., overmoralizing life).  
  - **Resolution of Supererogation**: It *is* coherent if we:  
    - Ground praise in **value produced + effort/sacrifice**.  
    - Treat optionality as a **contextual amplifier** of praise (it signals exceeding normative expectations), not a *source* of praise.  
    - Acknowledge that **"more praiseworthy" reflects comparative sacrifice or rarity**, not latent duty.  

  **Recommendation for Your Piece**:  
  Emphasize that supererogation’s stability relies on rejecting **binary moral thinking** (acts aren’t just "required/forbidden"). Morality has a **continuum of commendability**, where supererogatory acts occupy the "above and beyond" tier. Ethicist 2’s error is reducing all moral force to obligation; Ethicist 1’s oversight is not fully integrating social expectations into her account of graded praise. The debate persists because both undervalue how moral psychology (e.g., admiration for exceeding norms) shapes praise beyond cold calculus of value/duty.
