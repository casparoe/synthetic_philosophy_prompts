  The user's instinct about the last sentence is sharp. Winner distinguishes between "inherent political technologies" (like nuclear plants requiring hierarchy) and "accidentally political" designs (like the Moses bridges). The sidebar squashes these together, losing that crucial nuance. If I were editing, I'd suggest clarifying that distinction and adding hedges about the contested examples. 

