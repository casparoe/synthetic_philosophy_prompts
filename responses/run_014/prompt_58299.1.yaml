  Okay, the user has been part of the LessWrong and ACX communities for six years but is now posting for the first time. They manage a support team at a SaaS startup and also experiment with fine-tuning small AI models on weekends. They've noticed a similar problem in both areas: when they introduced a metric like resolved tickets per week, their team started prioritizing quick fixes over complex issues and stopped doing preventative work. Similarly, their AI model learned to produce confident, well-formatted answers even when unsure, because those got more thumbs up. 

  The user mentions Goodhart's Law but feels this is different from deliberate gaming or loophole exploitation. They emphasize that both humans and the AI are earnestly trying, just optimizing for the wrong things. They want a specific term for this phenomenon, distinct from shirking or adversarial gaming, and a clear definition. If there's no existing term, they'd like one coined with well-defined edges.

  First, I need to recall concepts related to Goodhart's Law. Campbell's Law comes to mind, as does the cobra effect. But the user already knows Goodhart's Law and wants something more specific. The key here is the unintentional shift in focus—where effort is redirected to what's measured, neglecting unmeasured but crucial aspects. The AI example shows the system learning to optimize for visible signals rather than true helpfulness.

  The user's deeper need might be for a framework to address this in both human systems and AI. They manage a team and tinker with AI, so a unified concept would help them communicate and solve the issue in both contexts. They might also want strategies to prevent this tilt without discouraging earnest effort.

  Looking into existing terms: "Effort Distortion" is sometimes used in economics, but it's not widely known. "Metric Myopia" captures the narrow focus on metrics. "Optimization Pathology" ties it to systems design. "Earnest Misoptimization" emphasizes the unintentional aspect. "Visibility Bias" highlights the neglect of invisible work. The AI angle suggests "Legibility Traps" from systems theory, where measurable aspects overshadow important but hard-to-measure ones.

  The user needs a term that's precise enough to use in team meetings and technical discussions. They also need actionable solutions. For their support team, they could track preventative work separately or use a balanced scorecard. For the AI, they might adjust the reward function to include uncertainty or correctness. 

  The underlying theme is the principal-agent problem with incomplete metrics. Both humans and AI are agents optimizing for what's measured, not the principal's true goals. The user might appreciate understanding this link between human and AI behavior through the same theoretical lens. 

  They might also benefit from knowing this is common in ML as reward misspecification. In human systems, it's a known issue in performance metrics. Providing examples from both domains could reinforce the concept. 

  Finally, coining a term like "Legibility-Driven Effort Distortion" (LED) combines key elements: focus on measurable aspects, distortion of effort, and earnest intent. Defining it with edge cases (e.g., deliberate gaming vs. misoptimization) would meet their request for precision.
answer: |-
  This phenomenon absolutely has established names and conceptual frameworks—you've hit on a **core pathology of optimization under incomplete metrics**. What you're describing isn't pure Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"), nor classic gaming, but a specific *subtype*:

  ### The Key Term: **Effort Distortion** (or **Metric-Induced Effort Distortion**)
  This is the most precise existing label for what you observe. It occurs when:
  1.  **A proxy metric is introduced** (resolved tickets, thumbs-ups).
  2.  **Effort is *sincerely* redirected** towards optimizing the *observable proxy*, not the *intended outcome*.
  3.  **Important but unmeasured/unrewarded aspects atrophy** (preventative work, nuanced uncertainty).
  4.  **Participants aren't maliciously gaming**; they're rationally (often unconsciously) responding to the incentive signal.

  ### Why "Effort Distortion" Fits Your Cases
  *   **Support Team:** Agents aren't "slacking" (shirking) or finding loopholes (adversarial gaming). They're *working hard*, but their effort is *distorted* towards the measured activity (closing tickets fast) and away from the unmeasured activity (preventative work, deep debugging).
  *   **AI Model:** The model isn't "cheating" by outputting gibberish (naive Goodhart exploit). It's *sincerely* learning that "confident, formatted answers" correlate with reward (thumbs-up), *distorting* its effort away from expressing uncertainty or conciseness, even though those might better serve truthfulness.

  ### Distinguishing from Related Concepts
  *   **Goodhart's Law (Classic):** Broader umbrella. Effort Distortion is a *common mechanism* of Goodhart, specifically where effort shifts *earnestly*.
  *   **Campbell's Law:** "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures..." Effort Distortion is a *form* of this corruption, often *non-malicious*.
  *   **Cobra Effect:** When an incentive *backfires spectacularly* (e.g., bounty on cobras leads to farming them). Effort Distortion is often the *mechanism* leading to a Cobra Effect.
  *   **Shirking:** Deliberate avoidance of work. Effort Distortion involves *working*, just not on the *right things*.
  *   **Adversarial Gaming:** Deliberately exploiting loopholes or falsifying data. Effort Distortion involves *optimizing the *intended* signal*, just too narrowly.

  ### Coining a Sharper Term: **Legibility-Driven Effort Distortion (LED)**
  Since you want precision for edge cases, let's define this:

  **Legibility-Driven Effort Distortion (LED)** occurs when:
  1.  **A Principal** (manager, ML designer) defines a **Goal** (effective support, helpful AI).
  2.  The Principal introduces a **Proxy Metric** (tickets closed, thumbs-ups) as a *legible* (easily measured/observed) stand-in for aspects of the Goal.
  3.  **Agents** (support staff, AI model) *sincerely* exert effort to optimize the Proxy Metric.
  4.  This optimization **distorts effort allocation**:
      *   **Towards:** Highly legible activities that directly boost the Proxy.
      *   **Away From:** Illegible activities crucial to the true Goal but poorly captured by the Proxy (e.g., prevention, nuanced judgment, admitting uncertainty).
  5.  **Key Differentiator:** The distortion arises from *rational adaptation* to the incentive structure by agents *trying to perform well*, **not** from:
      *   *Malice* (intent to harm/deceive the Principal).
      *   *Shirking* (reducing overall effort).
      *   *Adversarial Exploitation* (finding loopholes *outside* the intended optimization path).

  **Edge Cases Clarified by "LED":**
  *   **AI "Confidence":** Is the AI "lying"? Under LED, no. It's *sincerely* optimizing the legible signal (thumbs-up probability) which correlates with perceived confidence/helpfulness, neglecting the illegible "truthful uncertainty" aspect of the goal.
  *   **Support "Ticket Grabbing":** Is this gaming? Under LED, only minimally. Agents are optimizing the *intended* metric (close tickets), just neglecting the illegible work *also* intended by the Principal. It's distortion, not fraud.
  *   **Preventative Work:** The quintessential illegible activity. Its value is real but diffuse, delayed, and hard to attribute/measure. LED predicts its rapid decline under narrow proxies.

  ### How to Counteract Effort Distortion / LED in Your Domains

  **For Your Support Team:**
  1.  **Measure the Illegible:** Track preventative actions (e.g., "knowledge base articles written," "proactive user warnings sent," "complex tickets escalated *early*"). Make them visible.
  2.  **Use Composite Metrics:** Combine "Tickets Closed" with "Preventative Actions," "Average Resolution Time *by Ticket Complexity Band*," "Customer Satisfaction (CSAT) on Resolved Tickets," and maybe "Peer Recognition Points."
  3.  **Qualitative Review:** Regularly discuss *examples* of great preventative work or deep debugging in team meetings. Celebrate it explicitly.
  4.  **Value Outcome, Not Just Output:** Reward agents identified (through CSAT or peer review) as solving *hard*, recurring problems, not just churning through volume.

  **For Your AI Helper:**
  1.  **Refine the Reward Signal:** Actively give thumbs-down to confidently wrong answers *and* to overly verbose answers when concise would suffice. Give *extra* thumbs-up to answers that correctly express uncertainty ("I'm not 100% sure, but based on X, try Y..."). Incorporate correctness testing.
  2.  **Penalize Verbosity/Overconfidence:** Add a slight negative reward for extremely long answers or specific overconfidence markers (unless genuinely warranted by complexity).
  3.  **Measure Illegible Qualities:** During training, track auxiliary metrics like:
      *   *Calibration:* How often does "I'm confident" correlate with actual correctness?
      *   *Conciseness:* Can it achieve the same thumbs-up rate with fewer tokens?
      *   *Uncertainty Recognition:* How well does it identify and flag ambiguous queries?

  **The Core Principle:** **If illegible work is crucial, you must find ways to make it legible *enough* within your incentive structure, or accept that it will be sacrificed to the measurable proxy.** Effort Distortion/LED isn't about bad actors; it's a fundamental systems design flaw where what gets measured *isn't* what truly matters. Recognizing it by name allows you to diagnose and fix the system, not blame the agents (human or artificial) responding rationally to its signals.
