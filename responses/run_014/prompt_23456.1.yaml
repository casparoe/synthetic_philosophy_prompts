prompt: |-
  I'm on the board of my neighborhood food co-op (five elected directors, about 300 members) and we're close to voting on whether to take out a $60k loan to buy a used delivery truck. One of the directors read about the Condorcet jury theorem and keeps pushing to expand the board to fifteen before the vote, on the theory that the bigger the group that's voting, the more likly the majority gets it right, and he points out that our last two big votes passed 5-0, which to him means we're just right and need more of us. I've been chewing on this on my own and I can't figure out if he's actually right, but I don't want to just throw a textbook at him. Can you draft a short memo I can circulate to the other directors before next Tuesday's meeting? It should recommend a concrete course of action, with a timeline we can actually follow, and it should engage his argument honestly, including the strongest version of it. A few facts that might matter: most of our members live within a couple of blocks of the store and shop the same hours, the loan only pays off if delivery demand keeps growing, which we can't really see in advance, and we haven't done any actual surveying of delivery demand, we've just been guessing.
reasoning: |-
  Okay, the user is on the board of a neighborhood food co-op with five directors. They're about to vote on a $60k loan for a delivery truck. One director wants to expand the board to fifteen members before the vote, citing the Condorcet jury theorem. He believes that a larger group increases the chance of a correct majority decision, especially since the last two big votes were unanimous 5-0. The user needs a memo to present before next Tuesday's meeting that addresses this honestly, recommends a concrete action with a timeline, and considers the co-op's specific context.

  First, I need to unpack the director's argument. The Condorcet jury theorem suggests that if each voter has a better than 50% chance of being correct, adding more voters increases the probability that the majority makes the right decision. But the theorem relies on voters making independent judgments. In this case, the co-op directors might have similar information sources, shop at the same times, and lack diverse perspectives. That could undermine the independence assumption. Also, the past unanimous votes might indicate groupthink rather than correctness, especially since the current decision involves uncertainty about delivery demand growth.

  The user provided key facts: members live close by, shop during similar hours, delivery demand growth is uncertain, and there's no actual data from surveys. These factors make it risky to rely on intuition. Expanding the board hastily could lead to rushed appointments without proper vetting, reducing decision quality. The director's proposal might not address the core issue of insufficient data.

  The user needs a memo that's diplomatic but firm. The memo should acknowledge the director's point about collective wisdom but highlight the practical constraints and the need for data. The recommendation should focus on gathering evidence quickly rather than expanding the board. A survey of members about delivery usage and interest could provide concrete data. Setting a timeline for this survey before the vote makes sense—design it this week, distribute next week, and review results at the following meeting.

  I should also address the risks of expanding the board: time constraints, dilution of expertise, and potential for groupthink. Emphasizing that the current board can make a better decision with data aligns with both the jury theorem's spirit (informed voters) and practical governance. The memo should conclude with a call to proceed with the survey, keeping the vote on schedule but informed by member input.

  Checking if this meets the user's needs: concrete action (survey), timeline (design now, distribute next week, vote after results), honest engagement with the Condorcet argument, and consideration of co-op specifics. Also, avoiding textbook jargon while explaining why independence matters. The memo structure should start with the director's argument, dissect its assumptions, propose the alternative, and outline steps. That should provide a balanced, actionable path forward.
answer: |-
  ## MEMO: Recommendation on Board Expansion & Delivery Truck Vote

  **To:** Co-op Board of Directors  
  **From:** [Your Name], Board Member  
  **Date:** [Current Date]  
  **Subject:** Proposed Board Expansion & Delivery Truck Loan Vote - Recommendation for Action  

  I appreciate Director [Director's Name]'s engagement with decision theory and his desire to improve our voting accuracy by invoking the Condorcet Jury Theorem (CJT). His core point – that *under specific conditions*, a larger group of competent, independent voters can increase the probability of a correct majority decision – is theoretically sound and worth serious consideration. Expanding the board *could* bring valuable new perspectives.

  **However, applying CJT directly to our situation faces significant practical and theoretical hurdles:**

  1.  **The "Independent Judgment" Assumption:** CJT requires voters to form opinions *independently*. Our board (and likely potential new directors drawn from our tight-knit, geographically close membership) shares similar information sources, shopping patterns, and social circles. This makes true independence hard to achieve and risks amplifying groupthink, not countering it. Our past 5-0 votes might reflect this shared perspective, not necessarily perfect correctness on complex issues.

  2.  **The "Competence" Assumption:** CJT assumes each voter has a better-than-50% chance of being *correct*. The critical uncertainty here isn't about board procedure or values – it's about **predicting future delivery demand growth**, a factor we openly admit is unknown ("we can't really see in advance," "just been guessing"). Expanding the board doesn't magically create expertise in market forecasting or provide new data. More uninformed guesses don't necessarily lead to a better prediction.

  3.  **The Core Problem is Lack of Data, Not Board Size:** Our biggest vulnerability is the absence of concrete evidence on delivery demand sustainability. A larger board voting on the same limited (and potentially biased) information doesn't solve this fundamental knowledge gap. We risk making a $60k gamble based on group intuition, regardless of group size.

  4.  **Practical Risks of Hasty Expansion:** Recruiting, vetting, onboarding, and effectively integrating *ten* new directors within a useful timeframe before this vote is highly impractical. It risks:
      *   Rushed appointments without proper consideration of skills or diversity.
      *   New directors lacking context on co-op finances and operations.
      *   A diluted board dynamic potentially less effective for ongoing governance.
      *   Significant delay on a time-sensitive decision.

  **Recommendation & Concrete Action Plan:**

  **Do NOT expand the board before the delivery truck vote.** Instead, **address the critical knowledge gap** to empower the *current* board to make a more informed decision, leveraging our existing cohesion and efficiency. We should gather data directly relevant to the loan's payoff condition: **future delivery demand.**

  1.  **Immediately Launch a Member Delivery Demand Survey (This Week - Next Week):**
      *   **Objective:** Quantify *current* usage, *unmet* demand, and *potential* future usage of delivery services under various scenarios (e.g., with a dedicated truck enabling faster/more reliable service, potential fee changes).
      *   **Method:** Design a short, clear online survey (using free tools like Google Forms). Key questions:
          *   How often do you currently use co-op delivery?
          *   What factors limit your current use (cost, timing, reliability, minimum order)?
          *   If delivery was faster/more reliable (due to our own truck), how much *more* would you use it?
          *   Would you use it for larger orders (e.g., weekly staples)?
          *   What fee structure would be acceptable?
      *   **Timeline:**
          *   **Draft Survey:** [Your Name] volunteers to draft by [Date - e.g., Tomorrow]. *All directors please provide input by [Date - e.g., Day After Tomorrow].*
          *   **Finalize & Distribute:** Final survey approved and emailed to all 300 members by **[Date - e.g., This Friday]**.
          *   **Deadline:** Set response deadline for **[Date - e.g., Next Monday EOD]**.
  2.  **Analyze Survey Results & Discuss (Next Meeting - Tuesday):**
      *   Compile results before the next board meeting.
      *   **Next Board Meeting (Tuesday):** Dedicate significant time to reviewing survey data. Does it show strong latent demand justifying the truck? Is demand concentrated or widespread? What revenue projections can we reasonably infer?
  3.  **Vote on the Loan (Next Meeting - Tuesday):**
      *   Hold the scheduled vote on the $60k loan at the next meeting, **informed by the survey results**. The current board of five, now armed with actual member data, is far better positioned to make a competent, independent*er* judgment than a larger board voting in the dark. (*Independence enhanced by concrete data, not just opinion*).

  **Why this approach is stronger:**

  *   **Directly Addresses Uncertainty:** Tackles the root cause of our doubt (lack of demand data), not a symptom (board size).
  *   **Leverages Existing Efficiency:** Allows the current, functional board to act decisively with new information.
  *   **True Member Input:** Gathers perspectives from the *entire* membership (300 "jurors"), not just 10 new directors. This broader input is more valuable than slightly enlarging the voting group.
  *   **Timely Decision:** Keeps the process moving without unnecessary delay or governance disruption.
  *   **Honors CJT's Intent:** Focuses on improving *competence* (via data) and seeks broader input (via survey), aligning with the spirit of better collective decision-making without the pitfalls of forced, hasty board expansion.

  **Conclusion:**

  Director [Director's Name]'s instinct to seek wisdom is correct. However, wisdom for *this specific decision* comes from data on delivery demand, not simply more voters. Let's efficiently gather that data from our whole membership immediately. I recommend we **proceed with the survey as outlined and hold the truck loan vote next Tuesday, based on the survey findings.** This provides a concrete, responsible path forward grounded in evidence rather than theory alone.
