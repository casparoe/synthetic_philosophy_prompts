prompt: |-
  I've got a sabbatical year coming up and I want to spend it on the "what failure looks like" debate in AI risk — the question of whether the canonical story should be influence-seeking systems (agentic models that covertly accumulate power and pursue goals nobody gave them) or something more like slow value drift, where no single system does anything obviously wrong but the ecosystem of AI-mediated choices gradually reshapes what people value and how much agency they exercise. What are the open questions here that most deserve a year of my time, and in what order? Some candidates I can see: whether the two stories even share a causal structure or are just dressed-up versions of each other; whether "drift" without any agentic system doing the drifting is even a coherent alignment target, or whether it's really a political economy problem that alignment researchers can't touch; what intervention points each story implies (interpretability and auditing for one, something more like institutional design for the other); and whether you could empirically distinguish the early stages of one from the other before it matters. Defend the ordering — which questions are upstream of which, which are actually tractable for a philosopher with no lab and no security clearance, and which you'd drop entirely because they're either unfalsifiable or wouldn't change what anyone should do regardless of the answer. Also tell me what would make you reshuffle the list halfway through the year.
