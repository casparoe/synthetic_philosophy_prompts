  **Activity Title:** The Jelly Bean Qualia Challenge

  **Goal:** To make students experience the difficulty of specifying the "residue" of a sensory experience (the quale) when forced to articulate it, and to see how it either evaporates into specifiable components or remains as an ineffable core that resists description.

  **Materials:**
  - 5 distinct flavors of jelly beans (e.g., lemon, licorice, coconut, cappuccino, jalapeno). Ensure they are easily distinguishable and not too similar. (Note: Avoid common allergens and have alternatives if needed.)
  - Small paper cups or plates for each student (for tasting stages).
  - Toothpicks or spoons for hygienic tasting (one per student per tasting).
  - Water and plain crackers for palate cleansing between tastings.
  - Timer (for memory distraction task).
  - Handouts (or a shared document) for:
     - Discrimination response sheet
     - Memory task writing space
     - Misinformation task writing space
     - Residue statement sheet
     - Cross-examination rules (one per group)
  - Whiteboard or projector for instructions.

  **Setup:**
  - Before class, set up stations with jelly beans. For each stage, have the beans pre-sorted in cups or plates.
  - For discrimination: Prepare 14 pairs of beans (each pair in a cup). 7 pairs same flavor (e.g., 3 lemon-lemon, 4 licorice-licorice) and 7 pairs different (lemon-licorice). Label the cups with student numbers.
  - For memory: 14 cups, each with one bean of flavor C (e.g., coconut). Randomly assigned.
  - For misinformation: 14 cups, each with one bean of flavor D (e.g., cappuccino). Half of the cups will be labeled as flavor E (jalapeno) and half as flavor D (truth). Assign randomly to students.
  - For residue: 14 cups, each with one bean of one of the 5 flavors. Assign flavors to students randomly (so that each flavor is assigned to 2-3 students).

  **Timeline (90 minutes):**

  **0-5 min: Introduction and Calibration**
  - Facilitator: "Today we are going to explore the nature of subjective experience through taste. We will be tasting jelly beans. First, let's calibrate your palate. I will give each of you a sample of each of the five flavors we are using. They are: lemon, licorice, coconut, cappuccino, and jalapeno. Taste each one and note the flavor. Use water and crackers to cleanse between tastes."
  - Distribute the calibration samples (one bean of each flavor per student, in separate cups). Students taste each one in order. (2 min for tasting, 1 min for cleansing, 2 min for discussion if needed).

  **5-15 min: Discrimination Task (10 min)**
  - Facilitator: "Now, we will test your ability to discriminate tastes. Each of you will receive two jelly beans. They may be the same flavor or different. Taste both and write on your response sheet whether they are the same or different. Do not discuss until we share results."
  - Distribute the prepared pairs (each student gets one cup with two beans). Students taste and record their judgment. (3 min)
  - Collect the sheets. Facilitator reveals the true pairs (e.g., "Students 1-3 had same, 4-7 had different, etc.") and asks: "Were there any surprises? What made it easy or hard to tell?" (5 min discussion)

  **15-30 min: Memory Task (15 min)**
  - Facilitator: "Now, we will test how well you can remember a taste. Each of you will taste one unlabeled jelly bean. Then, you will do a distraction task for 2 minutes. After that, you will write a description of the taste as accurately as possible. Do not discuss."
  - Distribute one bean per student (flavor C, e.g., coconut). Students taste. (1 min)
  - Distraction task: "Count backwards from 100 by 7s for 2 minutes." (2 min)
  - Students write their description. (3 min)
  - Facilitator reveals the true flavor and asks: "How accurate were your descriptions? What details did you miss? Did the distraction affect your memory?" (5 min discussion)

  **30-45 min: Misinformation Task (15 min)**
  - Facilitator: "In this task, you will taste one unlabeled jelly bean. But I will tell you what flavor it is. However, I may or may not be telling the truth. Write a description of the taste based on what I tell you and your experience."
  - Distribute one bean per student (flavor D, e.g., cappuccino). For half the students, say it is jalapeno (misinfo); for the other half, say it is cappuccino (truth). (Assign randomly.) Students taste and write their description. (3 min)
  - Facilitator reveals the mislabeling: "Half of you were told the wrong flavor. How did that affect your description? If you were misled, did you notice any conflict between the label and the taste?" (5 min discussion)

  **45-75 min: Residue Specification and Cross-Examination (30 min)**
  - **45-50 min:** Facilitator: "Now, we come to the core of the exercise. Each of you will be assigned one of the five flavors. You will taste it again. Then, you must write a statement about the quale of that experience. Specifically, what is the intrinsic, ineffable character of that taste experience over and above everything we've already done? What we've done includes: discrimination (same/different), memory description, reactions to labels, etc. So the residue is what's left after accounting for all those specifiable things. Write what that residue is in a few sentences."
    - Assign flavors and distribute beans. Students taste and write. (5 min)
  - **50-65 min:** Facilitator: "Now, form groups of 3. In each group, you will take turns being the 'witness' who reads their residue statement. The other two will be 'examiners' who ask questions. Rules for examiners: You can only ask about specifiable aspects. For example:
     - Would you recognize this taste again? How?
     - How does it compare to [another flavor]?
     - What did you expect? How did that affect your experience?
     - If I had told you it was a different flavor, how would that have changed your description?
     - What physical reactions did you have?
     - Can you describe it in terms of basic tastes (sweet, sour, etc.)?
    You cannot ask: 'What is the quale?' directly. The witness must defend the residue without hand-waving. Each witness gets 5 minutes: 1 minute to read their statement, 3 minutes for questions, 1 minute for reflection."
    - Split into groups (4 groups of 3 and one group of 2; for the group of 2, one witness, one examiner, then switch, with 5 min each). (15 min)
  - **65-75 min:** Whole class discussion: Facilitator asks: "What happened in your groups? Did the residue survive? Did it evaporate? Give examples." (10 min)

  **75-90 min: Debrief (15 min)**
  - Facilitator: "Let's map this activity to the philosophical debate about qualia."
    - Discrimination task: Shows that experience can be reduced to discriminatory capacities. (Dennett: qualia as differences.)
    - Memory task: Shows how the 'qualitative character' fades or changes over time, suggesting it's not a stable intrinsic property but dependent on memory.
    - Misinformation task: Shows how expectation and labeling can alter experience (confabulation), undermining the idea of a raw, uninterpreted quale.
    - Residue cross-examination: When forced to specify, the residue either becomes a set of specifiable properties or vanishes. This mirrors Chase and Sanborn's argument: what we point to as qualia is always tied to judgments, memories, comparisons, etc.
  - Finally: "This activity is inspired by Daniel Dennett's 'quining qualia' and Chase and Sanborn's work. The key point: if qualia are supposed to be intrinsic, ineffable, private, and directly apprehensible, but when we try to pin them down they turn out to be none of these, then perhaps they are an incoherent posit. But note: the activity only covers taste and a few cases. The full argument must generalize. How might we extend it? And what might be a defense for qualia? We'll read these papers next time."

  **What Could Go Wrong:**
  - **Students refuse to play along:** Some might not take the tasting seriously. Solution: Frame it as a serious thought experiment and emphasize participation is key to the seminar. Have non-tasting options (e.g., observe and take notes) for those with dietary restrictions.
  - **Confident kid declares residue exists and sways others:** In the cross-examination, the rules should force specification. The facilitator can intervene to enforce the question rules. Also, in debrief, use the group reports to show diversity of outcomes.
  - **Timing blows up:** Keep strict time limits. Use a timer. Skip discussion parts if needed. The residue stage is critical, so protect that time.
  - **Palate fatigue:** Use water and crackers between stages. Avoid too many strong flavors.
  - **Allergies/dietary restrictions:** Check in advance and have alternative stimuli (e.g., essential oils to smell, textured objects to touch) for affected students.

  **Limitations of the Activity:**
  - It only covers a few sensory cases (taste) and a few instances. A stubborn student can say, "Fine, for taste qualia you might explain them away, but what about the redness of red?" The debrief must emphasize that the same moves apply to any modality: we can run the same discrimination, memory, mislabeling experiments for color, sound, etc. The generalization is the key philosophical move.
  - The activity does not address the "hard problem" of consciousness directly. It only challenges the coherence of qualia as traditionally defined. The debrief should note that even if qualia are quined, consciousness might still be mysterious in other ways.
  - The cross-examination might not be equally rigorous in all groups. The facilitator must monitor and intervene if needed.

  **Final Note for TA:**
  - Be strict on time and rules, especially in cross-examination.
  - Emphasize that the goal is not to win but to experience the philosophical tension.
  - In debrief, connect each activity stage to the literature explicitly.
answer: |-
  Below is a complete, ready-to-run classroom activity based on your specifications. I've chosen the **Jelly Bean Focus** design after weighing it against alternatives (cola/coffee or mixed stimuli). Jelly beans win for their simplicity, low cost, controllability (distinct flavors), and ability to minimize palate fatigue. They also make the abstract tangible without overwhelming students. I've refined your rough idea into a structured 90-minute demo with clear rules, timing, and facilitator guidance. The final "specify the residue" stage uses a tightly constrained cross-examination protocol to force exposure of the residue, and the debrief explicitly maps each activity stage to key moves in the qualia debate. I've included a candid "What Could Go Wrong" section and limitations.

  ---

  **Activity Title:** **The Vanishing Residue: A Qualia Thought Experiment**  
  *Goal: Students experience the evaporation of "qualia" under explicit specification, revealing how appeals to "intrinsic, ineffable experience" collapse into specifiable judgments or nothing.*

  ### **Materials List**  
  - **Jelly beans:** 5 distinct flavors (e.g., lemon, licorice, coconut, cappuccino, jalapeno). Use Jelly Belly for reliable, intense flavors.  
    - *Quantities:* 70 beans total.  
      - Calibration: 5 beans per student (1 per flavor) = 70 beans (for 14 students).  
      - Tasks: Use the same beans, redistributed. No extra needed.  
  - **Tasting supplies:**  
    - Small paper cups (70 total, 5 per student initially).  
    - Toothpicks (1 per student per tasting; 100 total for safety).  
    - Napkins, water cups, and plain crackers (for palate cleansing).  
  - **Task sheets:**  
    - Discrimination response sheet (simple table: Student #, Bean Pair, Same/Different?).  
    - Memory task sheet (blank space for description).  
    - Misinformation task sheet (blank space for description + "Label Given").  
    - Residue statement sheet (lined paper; prompts: "Flavor: ______. The quale is ______ over and above the specifiable aspects.").  
  - **Timing tools:** Timer (visible to all).  
  - **Whiteboard/flip chart:** For instructions and debrief notes.  
  - **Optional:** Blindfolds (14) for discrimination task to remove visual bias.  

  ---

  ### **Timeline & Rules (90 Minutes Total)**  
  *Facilitator Role:*  
  - **Set up** materials before class.  
  - **Give clear instructions** at each stage (scripted below).  
  - **Enforce time limits strictly** (use timer).  
  - **Do not intervene** in student discussions *unless* rules are broken.  
  - **Never name qualia, Dennett, or the debate** until the debrief.  

  *Student Role:*  
  - Participate honestly in all tasks.  
  - No prior knowledge of qualia arguments assumed.  
  - Focus on their *own* experiences—no group collusion during tasks.  

  #### **Stage 1: Calibration (5 min)**  
  *Goal: Establish flavor baselines without priming philosophical discussion.*  
  - **Facilitator Script:**  
    "We’re starting with a sensory calibration. Each of you has 5 cups with one jelly bean each. Taste them in order—lemon, licorice, coconut, cappuccino, jalapeno—and cleanse your palate with water and crackers between each. Note the flavors mentally. This is just about noticing."  
  - **Rules:**  
    - 1 min: Distribute cups (pre-filled).  
    - 3 min: Students taste silently.  
    - 1 min: Collect cups/napkins.  
  - **Why This Works:** Anchors flavors without over-description, setting up later memory/misinfo tasks.  

  #### **Stage 2: Discrimination Task (10 min)**  
  *Goal: Reduce taste to binary judgments (same/different), hinting at qualia as discriminative capacity.*  
  - **Facilitator Script:**  
    "Now, you’ll each get two unlabeled beans. Taste both. Your only job: decide if they’re the *same* or *different* flavors. Write your answer privately. No details—just ‘same’ or ‘different’."  
  - **Rules:**  
    - 1 min: Distribute 2 beans per student (randomized pairs: e.g., 5 students get same-flavor pairs, 5 get different-flavor pairs, 4 get identical pairs of a third flavor). Use blindfolds if available.  
    - 2 min: Tasting and recording.  
    - 2 min: Collect responses.  
    - 5 min: Discussion:  
      - "How many of you were confident? What made it easy/hard?"  
      - "Did anyone feel there was 'something more' to the taste than just same/different? Don’t explain—just note it."  
  - **Why This Works:** Forces focus on relational judgments, not intrinsic properties.  

  #### **Stage 3: Memory-with-Interference Task (15 min)**  
  *Goal: Show instability of "qualitative character" over time, implying qualia as reconstructive memory.*  
  - **Facilitator Script:**  
    "Taste one unlabeled bean. Then, immediately do a distraction task for 60 seconds: count backward from 500 by 7s aloud. After, describe the taste *in writing* as accurately as possible."  
  - **Rules:**  
    - 1 min: Distribute 1 bean per student (all the same flavor, e.g., coconut).  
    - 1 min: Tasting.  
    - 1 min: Distraction task (facilitator times; students count aloud).  
    - 3 min: Writing descriptions.  
    - 5 min: Discussion:  
      - "Read your description. How did distraction affect it?"  
      - "Did the flavor feel 'unchanged' in your memory? Or did it drift?"  
  - **Why This Works:** Interference disrupts appeals to "raw feel," exposing memory dependence.  

  #### **Stage 4: Misinformation Task (15 min)**  
  *Goal: Induce confabulation, showing qualia as expectation-driven judgment.*  
  - **Facilitator Script:**  
    "You’ll each taste one unlabeled bean. I’ll tell you its flavor. Describe it based on that label. Important: I might be wrong."  
  - **Rules:**  
    - 1 min: Distribute beans (all the same flavor, e.g., cappuccino).  
    - Randomly assign labels: Tell 7 students it’s "cappuccino" (true), 7 it’s "jalapeno" (false).  
    - 3 min: Tasting and writing descriptions.  
    - 5 min: Reveal mislabeling:  
      - "Half of you were misled. Compare descriptions: did the false label alter your experience? How?"  
  - **Why This Works:** Demonstrates how labels "create" qualitative character, undermining intrinsicality.  

  #### **Stage 5: Specify the Residue + Cross-Examination (30 min)**  
  *Goal: Force students to isolate and defend the "ineffable residue" under constrained questioning, exposing incoherence.*  

  - **Part A: Residue Statement (5 min)**  
    - **Facilitator Script:**  
      "You’ll each taste one flavor again. Write what the *quale* of this experience is—not the flavor, but the intrinsic, ineffable ‘feel’—**over and above** what you’ve already described (discrimination, memory, reactions). What’s left when we strip all that away?"  
    - **Rules:**  
      - Assign flavors randomly (ensure each of the 5 flavors is covered by 2–3 students).  
      - 1 min: Distribute beans.  
      - 4 min: Silent writing. Collect statements.  

  - **Part B: Cross-Examination (20 min)**  
    - **Structure:**  
      - Students form three groups of 4–5.  
      - Each group has a "witness" (rotates) and "examiners" (others).  
      - **Facilitator Script:**  
        "Witnesses read their residue statement. Examiners ask **only** questions about *specifiable* aspects. No open-ended ‘defend your view’ debates. I’ll stop any rule-breaking."  
      - **Question Constraints (Written on Board):**  
        1. "Would you recognize this taste again? How?"  
        2. "How does it compare to [flavor X]?"  
        3. "What did you expect before tasting? Did that change it?"  
        4. "If I told you it was [incorrect flavor], how would your description change?"  
        5. "What physical reaction did you have (e.g., salivation, grimace)?"  
        *Prohibited:* "What is the quale?" or "Explain why it’s ineffable."  
      - **Timekeeping:**  
        - 3 min per witness: 1 min statement, 2 min Q&A.  
        - Rotate until all 14 students testify (groups run concurrently; facilitator circulates).  

  - **Part C: Group Report (5 min)**  
    - **Facilitator Script:**  
      "Each group shares: Did any residue survive cross-examination? Give one example of evaporation or persistence."  

  #### **Stage 6: Structured Debrief (15 min)**  
  *Goal: Map activities to qualia arguments without naming sources until the end.*  
  - **Facilitator Script:**  
    "Let’s connect today to philosophy of mind. No jargon yet—just our experience:  
    - **Discrimination Task:** When forced to reduce taste to ‘same/different,’ did ‘raw feel’ vanish? Philosophers argue qualia might just be *discriminative capacities*—nothing intrinsic.  
    - **Memory Task:** When distraction distorted your description, did it feel like the ‘true’ experience was lost? Suggests qualia are *reconstructions*, not stable objects.  
    - **Misinformation Task:** When labels altered your experience, did it reveal qualia as *judgments* driven by expectation? Like confabulation.  
    - **Residue Cross-Exam:** When forced to specify the residue, did it dissolve into comparisons, recognitions, or expectations? Or did it feel hand-wavy? This is the core move: if qualia can’t be pinned down, maybe they’re incoherent.  

    Now, the philosophy: This mirrors Daniel Dennett’s ‘quining qualia’ and Chase/Sanborn’s work. Their argument: What we call ‘qualia’ is either specifiable (discrimination, memory, etc.) or empty. We gesture at a residue, but it evaporates under scrutiny. Next class, we test if this generalizes beyond taste."  

  ---

  ### **What Could Go Wrong (and Solutions)**  
  1. **Student Refusal to Play Along:**  
     - *Risk:* Skeptical students dismiss tasting as "silly" or refuse to engage.  
     - *Solution:* Pre-frame rigorously: "This is a controlled thought experiment. Your data matters—withhold judgment until the end." Offer non-tasting roles (e.g., note-taker) for objectors, but no one exits.  

  2. **The Confident Kid Dominates:**  
     - *Risk:* One student declares, "The residue is obvious!" and peers acquiesce during cross-exam.  
     - *Solution:* In cross-exam rules, require questions to target *specific experiences* (e.g., "You said ‘lemony’—is that a comparison?"). If consensus forms, facilitator challenges: "Group 2, did *all* residues survive? Give an example of evaporation."  

  3. **Timing Blowup:**  
     - *Risk:* Tasting runs long; residue stage rushes.  
     - *Solution:*  
       - Enforce hard stops: "Pencils down in 10 seconds."  
       - Trim discussion: Skip memory/misinfo sharing if behind (data still collected).  
       - Residue cross-exam must start by 45 min—cut prior tasks if needed.  

  4. **Palate Fatigue/Nausea:**  
     - *Risk:* Too many jelly beans → disengagement or discomfort.  
     - *Solution:* Use small beans, enforce palate cleansing, and assure: "You’ll taste only 8–9 beans total."  

  5. **"But This Flavor is Different!":**  
     - *Risk:* A student insists their quale survived cross-exam, derailing debrief.  
     - *Solution:* Acknowledge: "Interesting—hold that thought." In debrief, reframe: "Did anyone feel their residue was *ineffable*? How did that hold up under ‘compare to X’ questions?"  

  ---

  ### **What the Activity Cannot Reproduce (and How to Handle It)**  
  - **The Generality Problem:**  
    - *Limitation:* The activity uses 5–6 taste cases. A stubborn student can argue: "You explained *these* qualia, but pain/redness/others are different!"  
    - *Handling in Debrief:* Explicitly state: "This is a microcosm. Philosophers like Dennett generalize: if *every* case we test evaporates, we infer qualia are *always* incoherent. You’ll see this in the readings—they target universal claims."  

  - **The "Hard Problem" Dodge:**  
    - *Limitation:* Students might concede taste qualia dissolve but argue "real" qualia (e.g., color) are untouched.  
    - *Handling:* Preempt in debrief: "We used taste for practicality, but the same tools—discrimination, memory, expectation—apply to color. Try it: describe ‘redness’ without comparisons or memories."  

  - **The Introspection Trap:**  
    - *Limitation:* The activity relies on self-report, which some philosophers (e.g., Sellars) see as theory-laden.  
    - *Handling:* Note in debrief: "Today we treated introspection as data, but even that is contested. We’ll read critics who say we’re *still* gesturing at residue."  

  - **No Knockout Punch:**  
    - *Limitation:* A student might leave feeling the residue *was* real but indescribable, reinforcing mysterianism.  
    - *Handling:* Leverage this: "If it felt hand-wavy, that’s the point. If it felt real, Chase/Sanborn say that’s the illusion. We’ll analyze both."  

  ---

  **Final Note for TA:**  
  This is designed as a self-contained demo. Stick to the script/timing, enforce cross-exam rules ruthlessly, and let students sit with discomfort. The power is in the unfolding realization—avoid resolving tensions until the debrief. With 14 students, groups of 4–5 are manageable; circulate to keep questioning on target. Materials fit in a small box; set-up takes 10 minutes.  

  **Why This Design Wins Over Alternatives:**  
  - **Jelly Beans > Cola/Coffee:** No brewing/mess; flavors are discrete and controllable. Cola differences are subtle, risking "no residue" conclusions for the wrong reasons.  
  - **Constrained Cross-Examination > Free Debate:** Prevents digressions and forces confrontation with specifiability.  
  - **Predictable Pain Points:** Memory/misinfo stages create vivid "aha!" moments for evaporation; cross-exam makes hand-waving visible.  

  Run this cold—no pre-reading. The frustration is the point.
