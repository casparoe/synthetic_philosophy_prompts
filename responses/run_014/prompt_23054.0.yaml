prompt: |-
  I have just finished a long, somewhat heated discussion with a friend who works in statistics, in which we failed to reach agreement on what a "default" or "uninformative" prior should be when I have little or no prior information about an unknown quantity. I had been defending the simple practice of placing a flat, uniform prior over the parameter of interest—say, the success probability of a new treatment, or the failure rate of a component—on the grounds that, absent any reason to favor one value over another, the values should be treated as equally likely, an application of what I understood to be the principle of indifference. My friend objected that this is not actually well-defined for continuous quantities, invoking what is usually called Bertrand's paradox, the puzzle about randomly drawn chords of a circle, in which the probability that a chord exceeds the length of the side of an inscribed equilateral triangle comes out to 1/3, 1/2, or 1/4 depending on which reasonable procedure one uses to pick the chord at random. He argued that my uniform prior is doing exactly the same thing, and that whether I flatten the prior over the probability itself, over its log-odds, or over the corresponding rate, I am quietly committing to different assumptions about what "no information" means. I found his point hard to dismiss, but I left the conversation not really understanding the full force of it, or what I should do about it in practice.

  Could you please describe the most important implications of this for someone in my position, who must choose a default prior for a continuous parameter in a statistical or decision model and wants the choice to be defensible to a colleague who is aware of the puzzle? In particular, I would be grateful for an account of which reparameterizations preserve or distort a putatively flat prior, what the standard principled resolutions are, and whether there is any way to break the tie between competing "uniform" choices that does not itself amount to smuggling in a substantive prior assumption. If there are concrete recommendations for the two kinds of parameters I mentioned—a probability and a rate—I would find those especially useful.
reasoning: |-
  Okay, let me start by really unpacking the user's question. They had a heated debate with a statistician friend about default priors, specifically the use of uniform priors when there's no prior information. The user defended the principle of indifference, while their friend brought up Bertrand's paradox to show that uniform priors aren't invariant under reparameterization. 

  First, I need to make sure I understand the core issue. Bertrand's paradox demonstrates that the way you parameterize a problem affects the probability results. For example, a uniform prior on a probability p isn't the same as a uniform prior on the log-odds of p. The user is struggling with how to choose a defensible default prior given this problem.

  The user mentioned two specific parameters: a success probability (bounded between 0 and 1) and a failure rate (positive real number). These are common in their work, so practical recommendations for these cases would be valuable. They also want to know if there's a way to break the tie between different "uniform" choices without introducing subjective priors.

  I recall that the Jeffreys prior is a common solution because it's invariant under reparameterization. It's based on the Fisher information, which depends on the model's likelihood. For a Bernoulli trial, Jeffreys prior is Beta(0.5, 0.5), which is U-shaped. For a Poisson rate, it's an improper prior proportional to 1/sqrt(λ). Explaining why these are chosen over uniform priors is key.

  The user's deeper need seems to be justifying their choice to colleagues who understand these paradoxes. They need principled reasons, not just convenience. They might also be looking for reassurance that while no prior is perfectly uninformative, some are more defensible. 

  I should emphasize that the problem isn't solvable by claiming one prior is truly uninformative. Instead, the focus should on priors that are invariant or have minimal influence. Mentioning reference priors and maximum entropy priors as alternatives could help, but Jeffreys is the go-to for their mentioned cases.

  Practical advice is crucial. For probabilities, recommend Beta(0.5,0.5) or Beta(1,1) if computational simplicity is needed. For rates, suggest 1/sqrt(λ) or Gamma(ϵ,ϵ). Highlighting computational aspects might be useful since improper priors can cause issues in practice.

  I should also address whether they can avoid smuggling in assumptions. The truth is that any prior choice involves some assumptions, but invariance and consistency across parameterizations provide a solid foundation. Acknowledging that this is a philosophical challenge but Jeffreys offers a workaround through formal criteria.
answer: |-
  Your friend has highlighted a profound and unavoidable challenge in Bayesian statistics: **the principle of indifference does not uniquely determine a "non-informative" prior for continuous parameters**. Bertrand's paradox is a canonical demonstration of how "uniform" priors depend critically on the chosen *parameterization*, leading to different probabilistic conclusions. Here's a breakdown of the implications, resolutions, and practical guidance:

  ### Core Problem: Reparameterization Invariance
  - **Flat priors are not invariant**: A uniform prior on a parameter θ does *not* correspond to a uniform prior on a transformed parameter η = g(θ).  
    - *Example*:  
      - Uniform prior on probability **p**: π(p) = 1 for p ∈ [0,1]  
      - Equivalent prior on log-odds **η = logit(p) = ln(p/(1-p))**:  
        π(η) = π(p) |dp/dη| = [e^η / (1 + e^η)^2] → **Not uniform!**  
      - A uniform prior on η would imply a *different* (non-uniform) prior on p.

  - **Bertrand's paradox analogy**: Just as "random chord" depends on whether you randomize by endpoint, midpoint, or angle, "uniform prior" depends on whether you flatten p, logit(p), or √p.

  ### Principled Resolutions: Seeking Invariance
  The goal is a prior that yields *consistent conclusions* regardless of parameterization. Two main approaches exist:

  1. **Jeffreys Prior** (Most common solution):  
     - Defined as π(θ) ∝ √[I(θ)], where **I(θ)** is the *Fisher information* of the statistical model:  
       I(θ) = -E[∂²log L(θ)/∂θ² | θ]  
     - **Key property**: Invariant under reparameterization. If η = g(θ), then π(η) ∝ √[I(η)].  
     - **Philosophy**: Encodes "ignorance" relative to the *model's information structure*.

  2. **Reference Priors** (Generalization of Jeffreys):  
     - Maximizes the Kullback-Leibler divergence between prior and posterior (i.e., maximizes expected information gain from data).  
     - Matches Jeffreys prior in simple one-parameter cases.

  ### Breaking the "Tie" Without Smuggling in Assumptions?
  - **No perfect solution**: All "non-informative" priors encode *some* structural assumption (e.g., the chosen model or invariance criterion).  
  - **Jeffreys/reference priors are defensible**: They provide **consistency across parameterizations** using a formal criterion tied to the likelihood. This avoids arbitrary choice (e.g., "I'll put uniform on log-odds because I like it").  
  - **They are minimally informative** in an information-theoretic sense, given the model.

  ---

  ### Concrete Recommendations for Your Cases
  #### 1. **Success Probability (p) for a Treatment (Bernoulli/Binomial Model)**  
     - **Naive uniform prior**: π(p) = 1 (Beta(1,1))  
       - *Problem*: Favors extreme values (e.g., prior mean = 0.5, but prior P(p < 0.1) = 0.1).  
     - **Jeffreys prior**: π(p) ∝ √[I(p)] = √[1/(p(1-p))] → **Beta(1/2, 1/2)**  
       - U-shaped, infinite density at p=0 and p=1.  
       - *Why it works*:  
         - Invariant under logit, probit, etc. transforms.  
         - Minimizes information in the prior relative to likelihood.  
       - *Practical use*:  
         - Posterior is **Beta(k + 0.5, n - k + 0.5)** for k successes in n trials.  
         - For k=0 or k=n, posterior doesn't collapse to point mass (unlike Beta(1,1)).

  #### 2. **Failure Rate (λ) of a Component (Poisson/Exponential Model)**  
     - **Naive "uniform" prior**: π(λ) = 1 (Improper prior)  
       - *Problem*: Favors large λ values (e.g., prior P(λ > 100) is infinite).  
     - **Jeffreys prior**: π(λ) ∝ √[I(λ)] = √[1/λ] ∝ **1/√λ** (Improper)  
       - *Why it works*:  
         - Invariant under reparameterization (e.g., η = ln(λ) gets uniform prior).  
         - Posterior proper if at least one failure observed.  
       - *Alternative parameterization*: For mean lifetime τ = 1/λ, Jeffreys prior is π(τ) ∝ 1/τ.  
       - *Practical use*:  
         - Posterior is **Gamma(k + 0.5, t)** for k failures in time t.  
         - For k=0, posterior is improper (use Gamma(ϵ, ϵ) as approximation if needed).

  ---

  ### When to Use Simpler Priors
  - **Beta(1,1) for probabilities**: Acceptable if data dominates (n >> 1) and p is not near 0 or 1.  
  - **Gamma(ϵ, ϵ) for rates**: Small ϵ (e.g., 0.001) approximates 1/λ and avoids impropriety.  
  - **Justify pragmatically**: If data is abundant, prior choice has negligible effect. State sensitivity analysis if results vary.

  ### Key Takeaways for Your Colleague
  1. **Acknowledge the paradox**: Agree that "uniform" is ambiguous without specifying the metric.  
  2. **Default to Jeffreys/reference priors**: They resolve the reparameterization problem using the model's likelihood.  
  3. **Embrace transparency**: No prior is truly "uninformative." Document:  
     - "We use the Jeffreys prior for the Bernoulli model (Beta(1/2,1/2)) to ensure invariance under reparameterization."  
  4. **Validate with sensitivity analysis**: Test if conclusions change materially under alternative priors (e.g., Beta(1,1) vs. Beta(0.5,0.5)).

  By adopting Jeffreys/reference priors, you sidestep arbitrary choices while grounding your "default" in a principled, model-consistent framework. This transforms the debate from philosophy ("What does ignorance mean?") to mathematics ("Which prior is invariant under the model?"), satisfying both statistical rigor and the need for defensible defaults.
