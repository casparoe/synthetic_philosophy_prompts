  We are comparing two group pathologies: the unilateralist's curse and diffusion of responsibility.
   
   Definitions:
   - Unilateralist's Curse (UC): Occurs when any single member can act (settling the matter in favor of acting) and members have uncertain private judgments. The group acts too often because each member, based on their private signal (which may be noisy), might act when the pooled evidence would not warrant it.
   - Diffusion of Responsibility (DoR): Occurs when anyone could usefully intervene but each holds back expecting someone else to act, leading to under-action.

   Key differences in underlying drivers:
   1. UC is driven by the fact that each individual, acting on their own private signal (which may be biased upward or just noisy), may overestimate the need for action. Since any one can act, the group acts whenever at least one member has a signal above their threshold. If signals are independent and the threshold is set such that each member might act when they shouldn't, then the group acts too frequently.
   2. DoR is driven by a coordination failure: each individual expects that someone else will act (or is more responsible), and therefore refrains from acting even when they see a need. This leads to no one acting.

   Role of uncertainty and individual thresholds:
   - UC: Uncertainty about the true state (e.g., is there a safety problem?) is resolved by a private signal. Each member sets a threshold for acting based on their own signal. Because of noise, some signals will be false positives. The problem arises because the group acts if at least one member has a false positive, which becomes more likely as the group grows. The threshold for action by an individual is set too low in the sense that the group would prefer to act only when the evidence is stronger (i.e., when multiple signals point to a problem).
   - DoR: Uncertainty about others' actions (will someone else do it?) leads to inaction. The threshold for action might be set appropriately for an individual if they were the only one, but because they expect others to act, they require a higher threshold of personal responsibility (or a clearer signal of need) to overcome the diffusion. In effect, the perceived threshold for action is raised by the presence of others.

