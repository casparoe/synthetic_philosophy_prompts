   - To mitigate DoR:
       - Assign clear responsibility (so there is no ambiguity about who should act).
       - Lower the threshold for action (by making it easier to act and by social norms).
       - Create mechanisms that make it easy to see if someone else has acted (so that if no one acts, it becomes apparent).

