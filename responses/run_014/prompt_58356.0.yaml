     - Raising the threshold for individual action (e.g., requiring stronger evidence) to reduce the false positive rate per individual.
   - DoR: Remedies aim to ensure that someone acts. This can be achieved by:
     - Assigning clear responsibility (e.g., a designated person who is on duty) so that there is no ambiguity about who should act.
     - Lowering the threshold for action (e.g., encouraging people to act even if they are not sure) to overcome the hesitation.
     - Creating a norm of personal responsibility.

   Now, the key puzzle: why do we get over-action in UC and under-action in DoR in structurally similar settings (anyone can act)? The distinguishing factor is the threshold for action and the nature of the uncertainty.

   Principled test to distinguish when both risks are present:
   - In UC, the problem is that each individual, acting on their own, might be too trigger-happy because they don't account for the fact that the group's pooled evidence would require more than one signal. The driver is the noise in individual signals and the fact that the group acts on the first signal that crosses the threshold.
   - In DoR, the problem is that each individual expects others to act and thus holds back even when they see a need. The driver is the expectation that someone else will (or should) act.

