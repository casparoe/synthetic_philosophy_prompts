       - In situations where both risks are present (like the software patch), we can use a hybrid:
           - For high-confidence emergencies, allow unilateral action to avoid DoR (but set a high threshold to avoid UC).
           - For lower-confidence cases, require a lightweight concurrence (e.g., one other person) to avoid UC but not so much that it causes DoR (by making the process too heavy).
       - Another idea: create a system where individuals are expected to act if they see a problem, but also have a way to quickly check with one or two others (if time permits) to reduce false positives.

