    - In plurality, when they voted honestly, C won. But Group Alpha and Group Beta got 0. Group Alpha realized that by voting for their second choice (B) they could make B win and get 1 point. So they lied and voted for B. This is an example of strategic voting.

    - In runoff, when they voted honestly, C won. Group Alpha (who prefer A then B then C) didn't want C to win. In the first round, they voted honestly for A, but then A and C went to runoff and C won. But if in the first round they vote for B instead of A, then B and C go to runoff, and then B wins (because everyone except Group Gamma prefers B to C). This is also strategic voting.

    - The Gibbard-Satterthwaite theorem says that with three or more options, any voting method that respects unanimity (if everyone ranks A on top, then A wins) and isn't a dictatorship will be manipulable in this way. That is, there will be some situation where a voter or a group of voters can get a better outcome by lying about their preferences.

    - In our activity, we saw two methods (plurality and runoff) that were manipulable.

    - Conditions of the theorem:
        - Unanimity: In our methods, if everyone ranks A first, then A wins. So they respect unanimity.
        - Non-dictatorship: No single voter decides the outcome.
        - But they are manipulable.

    - What we didn't show: that every method is manipulable. We only showed two methods. The theorem says every possible method is manipulable (under the conditions).

    - Also, we showed manipulation by a group (in this case, Group Alpha all changed together). The theorem is about unilateral manipulation (one voter can sometimes manipulate). But in our examples, it required a group. We can explain that sometimes it only takes one voter, but in these examples it took a group.

    **What might go wrong:**
    - The students might not coordinate within the group. For example, in Group Alpha, if only some switch to B, then B might not win. We can encourage them: "Group Alpha, if you all vote for B, then B wins and you get 1 point. If you vote for A, then C wins and you get 0." 

    - They might not understand the incentive. Make sure the payoff is clear.

    - Time: Counting votes might take longer than expected. Have a helper.

    - The preference elicitation might not match the announced groups. Be prepared to adjust the profile to the actual distribution? But then we lose the prepared manipulation. Better to pre-assign the groups? Or if you have time, use the actual preferences and then design the manipulation on the fly? That's hard.

    Given the time, I suggest we use the announced groups and hope they comply. Or we can assign them to groups based on the announced distribution.

    **Conclusion:**
    We have designed an activity that demonstrates strategic voting in two methods. The takeaway is that no matter what method we choose, there will be situations where strategic voting is possible. Thus, "just pick a fair method" doesn't avoid the problem of strategic voting.

    We didn't cover the full generality of the theorem, but we gave a concrete example.
answer: |-
  ### Voting Manipulation Activity: Demonstrating Strategic Voting  
  **Objective:** Experience how "fair" voting methods can be manipulated without mentioning Gibbard-Satterthwaite until the debrief.  
  **Takeaway:** No voting method is immune to manipulation—it’s inherent, not just a flaw of plurality.  

  ---

  ### **Setup**  
  **Scenario:** Vote on a field trip destination with 3 options:  
  - **A** (Amusement Park)  
  - **B** (Beach Day)  
  - **C** (Camping)  

  **Groups & Preferences (Predefined Profile for 20 Students):**  
  Announce: *"Based on pre-surveys, we have 3 groups. Stick to your group’s true preferences unless instructed otherwise."*  
  - **Group 1 (7 students):** A > B > C  
  - **Group 2 (7 students):** B > C > A  
  - **Group 3 (6 students):** C > A > B  

  **Why this profile?** It creates tension:  
  - No majority winner.  
  - Everyone’s last choice wins under some methods.  
  - Incentives to lie appear naturally.  

  **Payoff Scheme (No Money Needed):**  
  - **2 points** if your top choice wins.  
  - **1 point** if your middle choice wins.  
  - **0 points** if your last choice wins.  
  *Goal: Maximize your points.*  

  **Materials:**  
  - Whiteboard (display options, groups, and rules).  
  - Ballots (paper slips) for each round.  
  - Tally sheets for quick counting.  

  ---

  ### **Timeline (50 Minutes Total)**  
  #### **Phase 1: Honest Voting Rounds (15 mins)**  
  1. **Min 0–5: Explain Setup**  
     - Display: Options (A, B, C), groups (1, 2, 3), payoffs.  
     - *"First, vote honestly. We’ll see who wins and how many points you get."*  

  2. **Min 5–10: Round 1 (Plurality)**  
     - **Rule:** "Vote for **one** option."  
     - **Honest Result:**  
       - Group 1: 7 votes for A.  
       - Group 2: 7 votes for B.  
       - Group 3: 6 votes for C.  
       - **Tie:** A=7, B=7, C=6 → **B wins** (random tiebreak).  
     - **Points:**  
       - Group 1: 0 (B is last)  
       - Group 2: 2 (B is top)  
       - Group 3: 0 (B is last)  

  3. **Min 10–15: Round 2 (Borda Count)**  
     - **Rule:** "Rank all options (3=best, 2=mid, 1=worst)."  
     - **Honest Ballots:**  
       - Group 1: A=3, B=2, C=1  
       - Group 2: B=3, C=2, A=1  
       - Group 3: C=3, A=2, B=1  
     - **Tally:**  
       - A: (7×3) + (7×1) + (6×2) = 21 + 7 + 12 = **40**  
       - B: (7×2) + (7×3) + (6×1) = 14 + 21 + 6 = **41**  
       - C: (7×1) + (7×2) + (6×3) = 7 + 14 + 18 = **39**  
       - **B wins** (41 points).  
     - **Points:** Same as Round 1 (Group 1: 0, Group 2: 2, Group 3: 0).  

  #### **Phase 2: Strategic Voting Rounds (20 mins)**  
  4. **Min 15–20: Reveal Group Preferences**  
     - Display full preference profile:  
       ```  
       Group 1 (7): A > B > C  
       Group 2 (7): B > C > A  
       Group 3 (6): C > A > B  
       ```  
     - *"Now you can change your vote to get more points. Lie if it helps you!"*  

  5. **Min 20–25: Round 3 (Plurality Again)**  
     - **Rule:** "Vote for **one** option (any choice)."  
     - **Predicted Manipulation:**  
       - Group 1 realizes B will win again (0 points). They can vote for **C** instead to make **A** win? No—C is their last choice.  
       - Group 3 (C > A > B) notices: If they abandon C and vote for **A**, A beats B:  
         - A: 7 (Group 1) + 6 (Group 3) = **13**  
         - B: 7 (Group 2)  
         - C: 0  
         - **A wins**! Group 3 gets 1 point (A is middle) vs. 0 if B wins.  
     - **Likely Outcome:** Most of Group 3 switches to A → **A wins**.  
     - **Points:**  
       - Group 1: 2 (A is top)  
       - Group 2: 0 (A is last)  
       - Group 3: 1 (A is middle)  

  6. **Min 25–35: Round 4 (Runoff Voting)**  
     - **Rule:**  
       1. Vote for **one** option. Top 2 advance.  
       2. Revote between top 2.  
     - **Strategic Play:**  
       - Group 2 (B > C > A) fears A winning again.  
       - If Group 2 abandons B and votes for **C** in Round 1:  
         - Round 1: A=7, B=0, C=7+6=**13** → Top 2: A and C.  
         - Runoff: A vs. C.  
           - Group 1: Prefers A > C → votes A.  
           - Group 2: Prefers C > A → votes C.  
           - Group 3: Prefers C > A → votes C.  
           - **C wins** (7+6=13 votes).  
       - Group 2 gets 1 point (C is middle) vs. 0 if A wins.  
     - **Likely Outcome:** Group 2 switches to C → **C wins**.  
     - **Points:**  
       - Group 1: 0 (C is last)  
       - Group 2: 1 (C is middle)  
       - Group 3: 2 (C is top)  

  #### **Phase 3: Debrief (15 mins)**  
  7. **Min 35–45: Map to Gibbard-Satterthwaite**  
     - Reveal the theorem: *"With 3+ options, any voting method that respects unanimity and isn’t a dictatorship can be manipulated."*  
     - **Conditions Illustrated:**  
       - **Unanimity Tested:** In all rounds, if everyone ranked A #1, A won (e.g., Round 3 when Group 3 helped A).  
       - **Non-Dictatorship:** No single voter decided the outcome.  
       - **Manipulation Proof:**  
         - **Plurality (Round 3):** Group 3 lied by voting A (true pref: C > A). Outcome changed from B → A.  
         - **Runoff (Round 4):** Group 2 lied by voting C (true pref: B > C). Outcome changed from A → C.  
       - **Borda (Round 2):** No one manipulated because B won honestly—but the theorem says manipulation *exists* for Borda in some profiles (we skipped it for time).  

  8. **Min 45–50: Key Takeaways**  
     - **"Fairness" isn’t enough:** All methods we tried were "fair" (non-dictatorial, unanimous), but all were manipulated.  
     - **Why this happens:** When no option is universally loved, voters must game the system to avoid their worst outcome.  
     - **Real-world implication:** Voting methods shape outcomes—design matters, but perfection is impossible.  

  ---

  ### **What Will Go Wrong (And How to Adapt)**  
  1. **Group 3 doesn’t manipulate in Plurality:**  
     - *Why:* They might not see the incentive.  
     - *Fix:* Hint: *"Group 3, if B wins, you get 0 points. If you vote A and A wins, you get 1 point."*  

  2. **Students don’t grasp others’ preferences:**  
     - *Why:* The profile is abstract.  
     - *Fix:* Use props (e.g., "Group 1, you *love* Amusement Park; Group 2, you *hate* it").  

  3. **Borda manipulation isn’t shown:**  
     - *Why:* Our honest Borda elected B (Group 2’s top choice), so no one needed to manipulate.  
     - *Fix post-activity:* Explain: *"In other profiles, Borda is manipulable. E.g., if Group 1 ranked B last, they could bury B to help A."*  

  4. **Theorem gaps in the activity:**  
     - **Not shown:** Manipulation by a single voter (we used groups).  
     - **Reality check:** The theorem guarantees manipulation *exists* under the conditions—but doesn’t mean it always happens. We engineered a profile where it did.  

  ---

  ### **Instructor Script Snippets**  
  - **Before strategic rounds:** *"You’ve seen what happens when we vote honestly. Now, game the system! Lie if it gets you more points."*  
  - **During debrief:** *"The theorem says manipulation isn’t a bug of one method—it’s math. If a vote isn’t a dictatorship and respects consensus, someone can cheat."*  

  You’ve got this! The activity balances simplicity with depth, and the debrief makes the theorem feel inevitable.
