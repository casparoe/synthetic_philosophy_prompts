prompt: |-
  I'm reading Lewis's Conventions and I keep running into people going "conventions are arbitrary" like it settles the whole debate. most recently in a thread about driving on the right vs the left, where someone used it to shut down the idea that conventions ever hook onto anything real beyond everyone expecting everyone else to do it. what are the different precise claims that one-liner could actually be making, from the trivial to the radical? i've got some — "the specific convention we landed on is arbitrary," "there could have been no convention at all," "we could swap to the other option any time we wanted" — but i don't think i have the full menu. say which of these are platitudes, which are real theses Lewis would actually endorse, which are just false, and which reading is the one doing the work when someone uses it to end the argument.
reasoning: |-
  Okay, the user is grappling with the phrase "conventions are arbitrary" in the context of Lewis's work on conventions. They've encountered this in discussions, like one about driving side conventions, where it's used to dismiss any deeper reality to conventions beyond mutual expectations. The user wants to unpack the different precise claims behind that one-liner, categorize them (trivial/radical, platitude/thesis/false), and identify which version shuts down arguments.

  First, I need to recall Lewis's core ideas. In "Convention," he defines conventions as solutions to coordination problems where uniformity matters, the solution is arbitrary because alternatives exist, and it persists due to mutual expectations. The "arbitrariness" is central but often misunderstood.

  The user has already listed some interpretations: the specific convention being arbitrary, the possibility of no convention, and the ease of switching. I should expand this menu systematically. Let me brainstorm all possible readings:

  1. **Specific choice arbitrariness**: The actual convention adopted (e.g., driving left) is arbitrary because alternatives (driving right) would have worked equally well. This seems trivial and Lewis-endorsed.

  2. **Contingency of existence**: Conventions might not have existed at all if history unfolded differently. Also Lewis-endorsed but sometimes overstated.

  3. **Switch feasibility**: We could easily change conventions. But Lewis emphasizes inertia—switching is costly and requires coordination. So this is partially false.

  4. **No pre-convention reasons**: There's no inherent reason to prefer one convention over another before it's established. This is key for Lewis—arbitrariness means no prior intrinsic superiority.

  5. **Independence from reality**: Conventions don't reflect any underlying truth. This is mostly true but has caveats—e.g., traffic conventions must align with physical realities like car designs.

  6. **Pure expectation dependence**: Conventions are *only* sustained by mutual expectations. This is central to Lewis—expectations create a self-reinforcing equilibrium.

  7. **No moral weight**: Conventions themselves carry no moral value. But Lewis notes they can acquire instrumental moral weight (e.g., safety in driving). So this needs nuance.

  8. **Epistemological arbitrariness**: We can't reason to conventions deductively. True, but Lewis shows we can use inductive/cooperative reasoning.

  9. **Radical conventionalism**: All social rules are arbitrary. This overgeneralizes—Lewis restricts conventions to coordination problems. False if applied broadly.

  Now, which ones are platitudes? Probably #1 and maybe #4. The real theses Lewis endorses are #1, #2, #4, #6, and #8. The false/misleading ones are #3 (if ignoring inertia), #7 (without nuance), and #9. 

  For the "debate-stopper," I think #5 (no hook to reality) is doing the work, especially when stretched. In the driving example, someone might imply that left/right is *purely* conventional with no physical basis, ignoring how car designs or human biology might create subtle asymmetries. But Lewis would still call it arbitrary because those factors don't *determine* the choice—right-hand drive cars exist too.

  The user might also be hinting at a deeper frustration: the phrase being used to avoid discussing how conventions *embed* real-world constraints or moral consequences. Lewis acknowledges this—arbitrariness doesn't mean conventions are trivial or interchangeable once established. The shutdown often conflates "arbitrary in origin" with "arbitrary in practice," which is misleading.

  I should clarify that Lewis's point is nuanced: conventions are arbitrary *relative to alternatives* but become "locked in" through expectations. The debate-stopper version (#5 stretched) ignores this, treating conventions as free-floating when they're actually constrained by history and context. This helps the user see why the shutdown is reductive.
answer: |-
  That "conventions are arbitrary" one-liner is a classic example of a philosophical soundbite that gets oversimplified. Lewis's theory in *Convention* is nuanced, and that phrase can mask at least **nine distinct claims**, ranging from trivial truisms to radical (and often false) assertions. Let's break them down, using driving-side conventions as our test case. I'll categorize each, note Lewis's stance, and identify which one typically "ends the argument."

  ---

  ### **The Menu of Claims: From Trivial to Radical**
  *(Lewis-endorsed positions are based on his 1969 work)*

  1. **"The *specific* convention adopted is arbitrary (contingent on history)"**  
     - **Precise Claim**: Given multiple *equally good* solutions to a coordination problem, the one we pick (e.g., driving left vs. right) has no inherent superiority.  
     - **Status**: **Platitude** and **core Lewis thesis**. Lewis defines conventions as arbitrary because alternatives exist that could have served the same purpose.  
     - **Debate Role**: Harmless starting point.

  2. **"Conventions *could have been different* in this context"**  
     - **Precise Claim**: It's metaphysically/conceptually possible for a different convention (e.g., driving right) to have emerged here.  
     - **Status**: **Platitude** and **Lewis-endorsed**. Contingency is central to arbitrariness.  
     - **Debate Role**: Rarely contested; too weak to end arguments.

  3. **"There could have been *no convention at all* in this domain"**  
     - **Precise Claim**: Societies might have failed to solve the coordination problem (e.g., chaotic driving norms).  
     - **Status**: **True but incomplete**. Lewis agrees *if* no salient solution existed, but he stresses that coordination problems *demand* solutions.  
     - **Debate Role**: Sometimes misused to imply conventions are "optional," ignoring their functional necessity.

  4. **"No convention is *inherently superior* pre-coordination"**  
     - **Precise Claim**: Before a convention stabilizes, no option (left/right) has intrinsic rational/moral advantages *as a pure coordination device*.  
     - **Status**: **Core Lewis thesis**. Arbitrariness means no prior reason to prefer one solution over another *if they achieve coordination equally well*.  
     - **Debate Role**: Legitimate but often overextended (see #7).

  5. **"Conventions *can be changed* if we coordinate to do so"**  
     - **Precise Claim**: We *could* switch driving sides tomorrow with collective agreement.  
     - **Status**: **True in theory, false in practice**. Lewis emphasizes **inertia**: conventions persist *because* expectations are entrenched. Switching costs (e.g., rebuilding infrastructure) make it rarely feasible.  
     - **Debate Role**: **Commonly false implication**. Used to downplay stability ("we could just change!"), ignoring real-world constraints.

  6. **"Conventions are *grounded solely in mutual expectations*"**  
     - **Precise Claim**: A convention exists *only* when people act on their expectations of others' behavior (e.g., I drive left because I expect you to).  
     - **Status**: **Core Lewis thesis**. Conventions are equilibria sustained by reciprocal beliefs.  
     - **Debate Role**: Terminological—correct but doesn't negate functional roots (#8).

  7. **"Conventions *lack any 'hook' to reality* beyond expectations"**  
     - **Precise Claim**: Conventions don't reflect moral truths, natural kinds, or functional necessities (e.g., driving left isn't "truer" than driving right).  
     - **Status**: **Mostly true, but overgeneralized**. Lewis agrees for *pure* coordination (like driving side). But many conventions *do* "hook" to reality:  
       - **Caveat**: Driving conventions *must* accommodate human biology (e.g., right-handedness favoring right-side driving for gear shifts) or physics (road designs).  
     - **Debate Role**: **The primary argument-ender**. Often stretched to deny *all* external anchors, which Lewis wouldn't endorse universally.

  8. **"Conventions are *epistemologically arbitrary*: no reasoning can justify them deductively"**  
     - **Precise Claim**: You can't *prove* driving left is "correct"; you adopt it because others do.  
     - **Status**: **Lewis-endorsed for pure conventions**. Justification is circular/coordination-dependent.  
     - **Debate Role**: Valid but misapplied to imply conventions are "irrational."

  9. **"All social norms are arbitrary conventions" (Radical Conventionalism)**  
     - **Precise Claim**: *Every* social rule (e.g., property rights, promises) is as arbitrary as driving side.  
     - **Status**: **False per Lewis**. He restricts "convention" to recurrent coordination problems with arbitrary solutions. Many norms (e.g., moral rules) aren't primarily about coordination.  
     - **Debate Role**: Nuclear option—invalid but rhetorically potent.

  ---

  ### **Lewis's Actual Position vs. the One-Liner**
  - **Lewis endorses**: #1, #2, #4, #6, and #8.  
  - **Lewis rejects/qualifies**: #3 (conventions solve real problems), #5 (switching is costly), #7 (if denying *all* functional hooks), #9 (overgeneralization).  
  - **The argument-ender**: **#7 ("no hook to reality")** is doing the heavy lifting. When someone says, "Driving left is *just* arbitrary—there's no reality to it," they imply conventions are *free-floating* social constructs. This ignores Lewis's key nuance:  
    > Conventions solve *real coordination problems* (e.g., avoiding collisions). While the *choice* between left/right is arbitrary, the *need* for uniformity isn't. Expectations are the glue, but the problem they solve is objective.

  ---

  ### **Why This Matters**
  The one-liner oversimplifies by conflating:
  - **Origins** (contingent choice) ↔ **Function** (solving real problems)  
  - **Pure conventions** (driving side) ↔ **Mixed cases** (conventions with moral/factual elements, e.g., "green means go").  

  **Key takeaway**: Lewis's arbitrariness is **modular**. A convention can be arbitrary *in its selection* while being grounded in reality *in its purpose*. Shutting down debate with "it's arbitrary!" often smuggles in radical claims (#7 or #9) that Lewis never intended.  

  If you encounter this again, ask: *"Arbitrary in what sense?"* That usually exposes whether they're stating a platitude (#1) or making a reductive leap (#7/9).
