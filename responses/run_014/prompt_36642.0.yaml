     - The universalist position in metaphysics holds that composition is not a matter of policy: it always occurs, and there is no real decision to make at the border. The game, by making it a policy, already concedes that it is a matter of convention. The universalist in the game might feel that the very act of publishing a code is a mistake.

     - **How to supply that point**: During the debrief, the professor should point out:

          "Notice that in the game, the customs officers are making policy. But the universalist in metaphysics believes that composition is not a matter of policy at all. It is a fact of the world. So the universalist would say: the border crossing doesn't create composite objects; they were already there. The officers are merely recognizing what is already the case. And if that's true, then the only correct code is universalism: because every collection of objects composes a whole. But note: the game forced you to write a code, which is a policy. That already assumes that composition is conventional. So the game cannot reproduce the universalist's metaphysical insight that composition is not conventional."

     - **To whom it will feel like cheating**: The students who were officers and tried to defend universalism. They might feel that the game rigged the debate by requiring a policy. Also, the nihilists might feel that the game doesn't capture the metaphysical reality that composition never occurs. So both extremes might feel cheated.

     **Suggestion**: Acknowledge this limitation and use it to spark discussion about the relationship between metaphysics and policy.

  **Full Rules Summary**:

  - **Objective for Officers**: Publish a customs code that survives challenge. Minimize fines.
  - **Objective for Smugglers**: Maximize points by minimizing fees and winning appeals.
  - **Roles**: 
       - 3 Customs Officers (rotated every 3 rounds).
       - Smugglers (the rest, each brings one shipment in turn).
       - Professor: Appeals court and scorekeeper.
  - **Shipments**: Pre-designed by professor (examples: two bricks in contact, three planks nailed at a corner, mobile with one drop of glue, seven pebbles in a circle, live fish in water, one brick, a watch (with parts), a lump of clay, etc.)
  - **Ruling**:
       - For each shipment, officers have 2 minutes to rule: "one" or "multiple".
       - Smugglers can appeal only if ruled multiple (by paying 1 point appeal fee). 
  - **Appeal**:
       - The court (professor) has 1 minute to rule: uphold or reverse.
       - If reversed, the new ruling is "one" (because the smuggler appealed a multiple ruling and won) and the officers are each fined 2 points (paid to the bank) and the smuggler gets 2 points compensation (from the bank) and the appeal fee is returned.
  - **Publishing the Code**:
       - Officers can propose at any time. Must be general, non-circular, non-vague.
       - The class (smugglers) can challenge. The court rules on the challenge.
       - If accepted, future rulings must follow the code.
       - The code must survive one challenge round (one shipment ruled using the code without being successfully appealed on grounds of the code being vague/circular or inconsistently applied).
  - **Scoring**:
       - Officers:
            - Start: 10 points.
            - Ruling not appealed: +1.
            - Ruling appealed and upheld: +2.
            - Ruling appealed and overturned: -3.
            - Publish a code that survives: +10.
            - Code fails during challenge: -5.
       - Smugglers:
            - Start: 10 points.
            - Per shipment: 
                 - Base: +2.
                 - Without appeal:
                      - Ruled one: -1 fee -> net +1.
                      - Ruled multiple: -3 fee -> net -1.
                 - With appeal (only if ruled multiple):
                      - Pay appeal fee: -1.
                      - If upheld: then pay fee (multiple: -3) -> net: 2 -1 (appeal fee) -3 (fee) = -2.
                      - If reversed: 
                           - Get appeal fee back (so no loss) and get 2 compensation, and pay one fee (-1) -> net: 2 (base) +2 (compensation) -1 (fee) = 3.
  - **Timeline**:
       - 0-5: Intro and role assignment.
       - 5-20: Rounds 1-3.
       - 20-25: Rotate officers and code discussion (optional).
       - 25-40: Rounds 4-6.
       - 40-50: Force code publication and challenge the code itself.
       - 50-70: Challenge rounds (rounds 7-8) with the code.
       - 70-80: Debrief.

  **Materials List**:
  - Trays with arrangements (8 different arrangements, as described).
  - Scoreboard (whiteboard or poster) to track points.
  - Timer.
  - Paper and pens for officers to draft code.

  This game should create a lively and instructive experience on the SCQ.
answer: |-
  Below is a comprehensive design for your in-class game, tailored to your 80-minute seminar on the special composition question (SCQ). The game immerses students in the practical challenges of defining composition criteria, pushing them toward universalism or nihilism through iterative rulings, appeals, and code-drafting. Smugglers test the officers' rulings with borderline cases, while officers face fines for inconsistent or vague judgments. The debrief connects gameplay to SCQ positions (universalism, nihilism, life-based restrictionism) without naming them upfront, allowing students to construct these ideas from experience.

  ---

  ### **Game Title**: Borderline Composites: The Customs Dilemma

  ---

  ### **Learning Objectives**
  - Experience the pressure toward universalism ("everything composes") or nihilism ("nothing composes") as the only stable solutions to SCQ.
  - Confront the circularity, vagueness, and arbitrariness of restrictionist criteria.
  - Understand why life-based restrictionism (or similar) collapses under borderline cases.

  ---

  ### **Materials List**
  1. **Physical Props** (one per "shipment"):  
     - Two bricks resting in contact.  
     - Three planks nailed at a single corner.  
     - A mobile (e.g., paper shapes) held by one drop of glue.  
     - Seven pebbles in a perfect circle.  
     - A live fish (or ethically sourced toy fish) in water from the "far bank" (use a small container).  
     - *Additional optional cases*: A watch (disassembled parts vs. assembled), a lump of clay, a sandcastle, a bundle of sticks tied loosely.  
  2. **Game Tools**:  
     - Whiteboard (for customs code and points tracking).  
     - Timer.  
     - "Customs Ruling" forms (paper slips for officers to write rulings).  
     - Role cards (14 cards: 3 for officers, 11 for smugglers; reassign each round).  
  3. **Payoff Tracking**:  
     - Use "Republic Credits" (RC) tracked on the whiteboard—no real money. Officers start with 20 RC; smugglers start with 15 RC.

  ---

  ### **Rules Summary**
  #### **Core Mechanics**
  - **Officers (3 per round)**: Rule on shipments as "one object" (pay 1 fee) or "multiple objects" (pay fees per object, e.g., 7 pebbles = 7 fees).  
  - **Smugglers (11 per round, rotating)**: Bring one shipment to the checkpoint. Goal: Minimize fees by convincing officers to rule "one object."  
  - **Appeals Court (Professor)**: Overturns rulings if they violate logic (vagueness, circularity, inconsistency). Officers are fined 3 RC per overturned ruling; smugglers gain 5 RC.  
  - **Customs Code**: Officers must publish a general, non-circular criterion to decide cases. Game ends when a code survives one full round of rulings without appeals overturns. Smugglers "win" if no code is published by the 70-minute mark.  

  #### **Key Pressures**
  - **Officers**: Fines for overturned rulings incentivize simple, extreme codes (universalism/nihilism).  
  - **Smugglers**: Profit by exploiting gaps in the code (e.g., borderline arrangements). Their payoff encourages probing vagueness.  
  - **Non-Circularity Requirement**: Codes like "things in contact compose" are rejected if "contact" is vague.  

  ---

  ### **Payoff Scheme (No Real Money)**
  - **Officers**:  
    - Correct ruling (upheld on appeal/no appeal): **+2 RC**.  
    - Incorrect ruling (overturned on appeal): **-3 RC** + smugglers gain 5 RC.  
    - Successful code published: **+10 RC** each.  
    - Failed code (overturned in challenges): **-5 RC** each.  
  - **Smugglers**:  
    - Shipment ruled "one object": **+3 RC** (pay one fee, profit).  
    - Shipment ruled "multiple objects": **-1 RC per object** (e.g., 7 pebbles = -7 RC).  
    - Win appeal: **+5 RC** (plus fee refund if overturned).  
    - Lose appeal: **-2 RC**.  
  - **Win Conditions**:  
    - Officers win if they publish a code that survives challenges.  
    - Smugglers win if no code survives by the 70-minute mark or if officers run out of RC.  

  ---

  ### **Timeline (80-Minute Session)**
  | Time (min) | Phase                          | Key Activities                                                                 |
  |------------|--------------------------------|-------------------------------------------------------------------------------|
  | 0-5        | **Setup**                      | Assign initial roles (3 officers, 11 smugglers). Explain rules, payoffs, and props. Emphasize: "Your code must be general, non-circular, and binding for all cases." |
  | 5-20       | **Round 1: Initial Rulings**   | - Smugglers bring 3 shipments (e.g., bricks, planks, fish).<br>- Officers rule per case (2 min/shipment).<br>- Smugglers may appeal (professor overturns if vague/inconsistent).<br>- Track payoffs. |
  | 20-35      | **Round 2: Rotation & Pressure**| - Rotate roles (new officers).<br>- Smugglers bring 3 borderline shipments (e.g., mobile, pebbles, clay).<br>- Officers start drafting code ideas while ruling.<br>- Appeals intensify; fines mount. |
  | 35-50      | **Round 3: Code Drafting**     | - Officers pause rulings to draft a customs code (5 min).<br>- Code must be written on whiteboard (e.g., "Things compose if glued").<br>- Class (smugglers) challenges for vagueness/circularity (e.g., "What counts as 'glued'?"). Professor rejects flawed codes. |
  | 50-65      | **Round 4: Code Testing**      | - Officers use published code to rule on 2 new shipments (e.g., watch, sandcastle).<br>- Smugglers probe code weaknesses (e.g., "Is a rusty hinge 'glued'?").<br>- If appeals overturn a code-based ruling, code fails. |
  | 65-75      | **Endgame**                    | - If code survives, officers win (+10 RC).<br>- If no code or failed code, smugglers win.<br>- Finalize payoffs. |
  | 75-80      | **Debrief**                    | Connect gameplay to SCQ (see below). |

  ---

  ### **Debrief: Mapping Gameplay to SCQ Positions**
  **Do not name positions upfront**. Guide students to articulate them using game moments:  
  1. **"Everything Composes" (Universalism)**:  
     - **Game Moment**: Officers who publish a code like "All things in a shipment compose one object." This survives appeals because it has no borderline cases.  
     - **Student Construction**: "We had to accept every shipment as one object to avoid fines. It felt lazy but unbreakable."  
     - **Metaphysical Link**: Highlight ease and consistency, but note it ignores intuition (e.g., pebbles in a circle ≠ one object).  

  2. **"Nothing Composes" (Nihilism)**:  
     - **Game Moment**: Officers who publish "No things ever compose; only atoms exist." Shipments like the fish (one "atom") are ruled "one," but bricks in contact are "two."  
     - **Student Construction**: "We fined every composite to avoid appeals, but it felt unfair for the fish."  
     - **Metaphysical Link**: Discuss how nihilism avoids vagueness but denies everyday objects (e.g., fish).  

  3. **Life-Based Restrictionism**:  
     - **Game Moment**: Officers propose "Only living things compose." Fish is "one object," but water/bricks are "multiple." Appeals overturn it when smugglers ask: "Is a dying fish 'alive'? What about a plant?"  
     - **Student Construction**: "We tried to use 'life,' but the court said it was circular—we couldn’t define 'life' without 'object.'"  
     - **Metaphysical Link**: Emphasize how restrictionism collapses under borderline cases (life, contact, function).  

  **Key Insight**:  
  - Universalism and nihilism "won" because they eliminated decision-making at the border. Restrictionism failed because it required arbitrary thresholds.  

  ---

  ### **Predictable Problems & Solutions**
  1. **Problem**: Officers avoid publishing a code (too stressful).  
     - **Solution**: Force code drafting at 35 minutes. Warn: "No code = automatic smuggler win."  

  2. **Problem**: Smugglers dominate appeals, demoralizing officers.  
     - **Solution**: Cap appeals at 1-2 per round. Rotate officers to share burden.  

  3. **Problem**: Payoffs become chaotic.  
     - **Solution**: Assign one student as "banker" to track RC on the whiteboard. Simplify math (e.g., round RC to multiples of 5).  

  4. **Problem**: Students miss the metaphysical point, seeing it as "just a game."  
     - **Solution**: In debrief, ask: "What did border decisions reveal about reality? Was composition always there, or did you create it?"  

  ---

  ### **The Game's Limitation: Universalism's Metaphysical Claim**
  **The Unreproducible Feature**:  
  - The universalist (in metaphysics) insists composition is not a matter of policy—it always occurs, so there is "no real decision" at the border. The game falsely frames composition as a convention.  

  **How to Supply This Point**:  
  1. **During Debrief**: Say:  
     > "In the game, you treated composition as a policy choice. But the universalist philosopher says you never had a real choice—the fish *was always* a single object, and the pebbles *were always* seven objects, regardless of your code. Your rulings didn't create composition; you just recognized what was already true."  

  2. **To Whom It Feels Like Cheating**:  
     - **Officers who embraced nihilism**: They will protest, "But we *decided* nothing composes! It wasn't pre-existing!"  
     - **Smugglers who exploited vagueness**: They will argue the game proves composition *is* conventional ("We made you change your mind!").  
     - **Handling Pushback**: Acknowledge the tension: "Yes, the game forces a conventional framing. But does reality care about your code? That’s the SCQ puzzle."  

  ---

  ### **Instructor Script Snippets**
  - **Setup**: "Welcome to the Republic of Mereologica! As customs officers, you’ll tax shipments per object. Smugglers will test your wits. Remember: every ruling must be defensible by a general code, or you’ll be fined."  
  - **Appeals Court**: "I overturn this ruling because your distinction between 'attached' and 'not attached' is vague. Fines issued."  
  - **Code Rejection**: "This code uses 'connected,' which is circular. Try again."  
  - **Debrief**: "When you said 'only glued things compose,' what broke? How did the smugglers exploit that? What would a philosopher call your solution?"  

  ---

  This design ensures students experience SCQ’s tensions firsthand, with clear links to metaphysics. The game runs smoothly within 80 minutes, and the debrief solidifies conceptual understanding. Let me know if you need refinements!
