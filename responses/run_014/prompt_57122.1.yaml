answer: |-
  As a philosopher of science focused on demarcation, I approach this through the lens of testability, epistemic responsibility, and institutional engagement. Below is the rigorous framework you requested, followed by the flowchart, case tests, analysis of empty cells, and critical reflection.

  **Candidate Dimensions & Rejections:**
  1.  **Falsifiable Core:** Does the central claim specify at least one concrete, observable phenomenon that, if *absent*, would disprove it? (Essential for testability - Popper)
  2.  **Accessible Falsifier:** Could a reasonably skilled investigator *without privileged access* (e.g., secret knowledge, unique tools only proponents possess) check for the absence of the falsifying phenomenon? (Prevents unfalsifiability via special pleading)
  3.  **Proponent Negotiability:** If confronted with strong evidence against their claim, would proponents accept its falsification or significantly revise the core claim? (Indicates responsiveness to evidence vs. dogma)
  4.  **Specialist Competence Presumption:** Does accepting the claim *require* assuming that relevant mainstream specialists (archaeologists, historians, geologists) are *systematically incompetent* in their core methodologies? (High cost to established knowledge; ad hominem risk)
  5.  **Permanent Conspiracy Required:** Does the claim *necessarily imply* an ongoing, unbroken conspiracy among specialists/record-keepers spanning generations? (Implausible burden; unfalsifiable shield)
  6.  *Rejected: "Popularity/Obscurity"* - Irrelevant to truth-value; many valid ideas start obscure, many popular ones wrong.
  7.  *Rejected: "Harmlessness/Benignity"* - Moral/social impact doesn't determine epistemic status (though it may affect urgency of response).
  8.  *Rejected: "Complexity/Simplicity"* - Good and bad theories exist at all complexity levels; not a reliable demarcator.

  **The Interactive Flowchart (Answer Yes/No):**

  1.  **Can a specific observation *disprove* the core idea?**
      *   **No →** `Unfalsifiable Speculation` (e.g., certain theological interpretations). *What it obscures:* Can serve as meaningful cultural narrative or thought experiment despite lacking empirical test.
      *   **Yes →** Go to 2.

  2.  **Could someone check for that disproving observation using standard methods, without needing secrets from the proponent?**
      *   **No →** `Esoteric Claim` (e.g., claims requiring "initiation" to see the truth). *What it obscures:* May reflect genuine but poorly communicated insights or methodological disagreements within a field.
      *   **Yes →** Go to 3.

  3.  **If that observation were found, would proponents likely accept the idea is wrong?**
      *   **No →** Go to 4.
      *   **Yes →** `Testable Hypothesis` (e.g., standard scientific proposals).

  4.  **Does the idea *require* believing that specialists are fundamentally incompetent at their jobs?**
      *   **No →** Go to 5.
      *   **Yes →** `Specialist-Rejection Claim` (e.g., core of much denialism).

  5.  **Does the idea *require* a permanent, unbroken conspiracy of experts/record-keepers?**
      *   **No →** `Radical Revisionism` (e.g., significant but non-conspiratorial reinterpretations of evidence).
      *   **Yes →** `Conspiracist History` (e.g., claims relying on sustained, deliberate suppression).

  **Testing the Cases:**

  1.  **Plato's Atlantis (as written):**
      *   Q1: **No.** Plato offers no specific, observable falsifier within the real world; it's presented as a moral/political allegory within a specific dialogue context. *Leaf:* **Unfalsifiable Speculation**.
  2.  **Fomenko's New Chronology:**
      *   Q1: **Yes.** E.g., the absence of specific astronomical events Fomenko claims were misdated should disprove his timeline.
      *   Q2: **Yes.** Astronomers/historians can check these independently.
      *   Q3: **No.** Proponents dismiss contrary evidence as part of the conspiracy/falsification.
      *   Q4: **Yes.** Requires believing *all* historians/archaeologists/astronomers since the Renaissance are fundamentally incompetent or complicit.
      *   Q5: **Yes.** Requires a centuries-long, global conspiracy to fabricate/manipulate records. *Leaf:* **Conspiracist History**.
  3.  **Ancient Astronaut Sarcophagus Reading:**
      *   Q1: **Yes.** E.g., if detailed iconographic analysis shows the carvings perfectly match known cultural motifs/symbols without needing alien tech.
      *   Q2: **Yes.** Archaeologists/art historians can perform this analysis.
      *   Q3: **No.** Evidence is often dismissed ("you're not looking right", "they hid the truth").
      *   Q4: **Yes.** Requires assuming Mesoamerican specialists systematically misidentify or ignore "obvious" evidence of advanced tech/aliens.
      *   Q5: **Yes.** Implies specialists knowingly suppress the "truth". *Leaf:* **Conspiracist History**.
  4.  **Wegener's Continental Drift (Pre-Plate Tectonics Evidence):**
      *   Q1: **Yes.** E.g., finding no geological/biological correlations across proposed joins, or finding definitive evidence continents *couldn't* move through the crust.
      *   Q2: **Yes.** Geologists/paleontologists could search for correlations.
      *   Q3: **Yes.** Wegener actively sought evidence and revised details; acceptance hinged on *finding* the mechanism/evidence, not rejecting counter-evidence dogmatically.
      *   Q4: **No.** It argued *current* explanations (land bridges) were wrong/incomplete, not that geologists were incompetent *in principle*. It proposed a new mechanism they hadn't considered.
      *   Q5: **No.** No conspiracy implied, just incomplete understanding. *Leaf:* **Radical Revisionism**.
  5.  **Norse at L'Anse aux Meadows (Pre-Discovery):**
      *   Q1: **Yes.** E.g., a thorough archaeological survey of the most likely sites finding absolutely no Norse artifacts/structures.
      *   Q2: **Yes.** Archaeologists could conduct surveys/excavations.
      *   Q3: **Yes.** Proponents (like Helge Ingstad) were actively searching for evidence; absence would have been a setback requiring reassessment.
      *   Q4: **No.** It challenged the *specific conclusion* (no transatlantic contact pre-Columbus), not the competence of archaeologists generally. It fit within known Norse capabilities.
      *   Q5: **No.** No conspiracy implied. *Leaf:* **Testable Hypothesis** (Became confirmed fact).

  **Separation:** The tree cleanly separates Fomenko/Ancient Astronauts (**Conspiracist History**) from Wegener (**Radical Revisionism**) and L'Anse aux Meadows pre-discovery (**Testable Hypothesis**), based primarily on the necessity of specialist incompetence (Q4) and conspiracy (Q5).

  **Empty Cells & Diagnosis:**
  The tree has 5 binary questions, leading to 32 possible paths. Only 5 leaves are defined. Key empty combinations:

  *   **Falsifiable + Accessible + Negotiable + Requires Specialist Incompetence + No Conspiracy:** `Incoherent`. If proponents accept counter-evidence (Negotiable=Yes), they can't simultaneously *require* believing specialists are incompetent. Why trust their counter-evidence?
  *   **Falsifiable + Inaccessible + Negotiable:** `Unattractive/Unexplored`. Why propose a test only you can perform if you're willing to be wrong? Seems strategically weak. Might occur in very niche technical fields with unique equipment, but rare in history/archaeology claims.
  *   **Unfalsifiable + Accessible Falsifier:** `Incoherent`. If it's unfalsifiable, there *is* no accessible (or any) falsifier to check.
  *   **Unfalsifiable + Specialist Incompetence Required:** `Unattractive/Unexplored`. Attacking specialists without even offering a testable alternative is usually just polemic, not a historical claim. (e.g., "All historians are liars, but I won't say what's true").
  *   **Testable Hypothesis + Requires Permanent Conspiracy:** `Unattractive/Unexplored`. Adding an unnecessary conspiracy to a testable claim weakens it. Proponents avoid this burden if possible.

  **Confidence & Critical Node:**
  I am **moderately confident** in these dimensions. They capture core epistemic and sociological differences relevant to demarcation in historical sciences. They focus on the claim's *structure* and *relationship to evidence/institutions*, not content or current acceptance. However, demarcation is inherently messy. The most vulnerable node is likely **Q4 (Specialist Competence Presumption)**. A specialist might argue:
  *   *Attack:* "Revolutionary science *always* implies current specialists are 'incompetent' *in the specific domain* of the new idea! Did plate tectonics not imply geologists studying continents were wrong? This confuses necessary paradigm shift with ad hominem."
  *   *Defense:* The key is *systematic, fundamental* incompetence versus *domain-specific error or incomplete knowledge*. Wegener argued geologists *lacked the correct mechanism* for observed correlations, not that they couldn't do basic stratigraphy or paleontology. Fomenko argues chronological methods are *inherently invalid*. The node aims to capture claims that invalidate the *entire toolkit and competence* of a field, not just a specific conclusion. Distinguishing this nuance for a general audience in a flowchart is challenging but essential. This node is crucial for separating radical-but-possible revisions from conspiracist thinking.
