  im working on an essay for my philosophy class and my teacher made us take a side and actually defend it instead of just summarizing, so i want to take the less obvious side on Pascal. in the Pensées he says "justice without force is impotent; force without justice is tyrannical" and then ends with "not being able to make what is just, strong, one made what is strong, just." basically everyone in my class just reads that as pascal basically saying power makes right, like its a sad accident that happened. but i want to argue that its not a conclusion he stumbled into — it follows straight from his own setup. earlier he makes the point that force is the one thing that's indisputable while justice is always up for debate, and if thats true then in any real fight over what's just the side with the muscle just wins by default, so the only coherent reading is that what makes a law legit is that it can actually be enforced, not that its independently just. can you write the argument for THAT side? argue that pascal is definately committed to the idea that legitimacy tracks power, and that he cant get out of it without giving up what makes laws work at all. lay out the actual moves like a real essay would, dont just restate the quote.
