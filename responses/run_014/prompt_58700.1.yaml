  First, I need to determine if there's an established term. I recall concepts like nudging, social proof, and foot-in-the-door, but they don't quite fit because they're often subtle or incremental, not openly declared. The key here is the advance disclosure—announcing the tactic upfront. Terms like "transparent manipulation" exist but carry negative connotations, which might not apply since the user's methods are ethical and non-deceptive. Hmm, maybe there isn't a perfect term.

  Next, closest concepts: 
  - **Nudging**: Gentle prompts without restricting choices, but usually not announced. The user explicitly states their method, so it's different. 
  - **Social Proof**: Using others' behavior to influence, but again, not pre-declared. 
  - **Foot-in-the-door**: Starting small to escalate, but the disclosure aspect is missing. 
  These focus on subconscious influence, whereas the user's approach is conscious and overt.

  For the user's cases: 
  - **Classroom**: Using vivid stories after announcing it. This leverages emotional arousal through repetition, but students can disengage. It's not hidden, so not trickery. 
  - **Fundraising**: Announcing persistent follow-ups to create social discomfort. Opting out is possible, so it's not coercion. Both rely on affective pressure with disclosure, making them similar phenomena under the proposed concept.

  Proposing a new term: "Declared Affective Pressure" (DAP). It emphasizes the open declaration and emotional/social pressure. Testing edge cases: 
  - **Weaker pressure**: Announcing a mild reminder is DAP but less effective, so still within bounds. 
  - **Stronger pressure**: If the fundraiser threatens reputational harm, it crosses into coercion despite disclosure, so not DAP. 

  The user's deeper need is to validate their ethical approach and understand how to categorize it without conflating with manipulation. They likely want to justify their methods professionally and perhaps teach students about ethical persuasion. Naming this helps them articulate the practice and its boundaries.
answer: |-
  ### 1. Direct Answer  
  No single established term perfectly captures your pattern. While related to concepts like "nudging" or "transparent persuasion," your cases involve *openly declaring non-rational tactics that leverage affect, repetition, or discomfort*, which lacks a dedicated label. This sits in a gap between covert manipulation (hidden tricks) and rational argumentation (reason-giving). Crucially, it retains ethical viability through advance disclosure and opt-out capacity, distinguishing it from exploitation, but actively bypasses deliberative cognition to harness emotional or social responses.

  ### 2. Closest Existing Ideas  
  - **Nudging (Behavioral Economics)**: Gentle environmental cues steering choices without restricting options (e.g., placing fruit at eye level). *Difference*: Nudges are typically subtle and *non-declared*; your method is explicit, intentional, and relies on sustained pressure, not passive design.  
  - **Social Proof (Cialdini’s Influence Principle)**: Leveraging peer behavior to encourage conformity (e.g., "90% of donors contribute"). *Difference*: This often works implicitly and statically; your fundraising example uses *personalized*, repeated engagement to induce discomfort, not just peer examples.  
  - **Foot-in-the-Door Technique**: Gaining small commitments to enable larger requests later. *Difference*: This is sequential and often masks its end goal; your approach *announces the entire strategy upfront*, making persistence the core tool, not incremental escalation.  

  These concepts focus on *subconscious* influence. Your pattern is unique in its **transparency about bypassing reason**—declaring, "I will use emotion/discomfort," then doing so—which paradoxically maintains efficacy while avoiding deception.

  ### 3. Mapping My Cases  
  Both examples represent the *same phenomenon* under three shared criteria:  
  1. **Advance disclosure**: Explicitly stating the tactic ("I’ll use upsetting stories"/"I’ll keep checking in").  
  2. **Non-rational mechanism**: Primarily leveraging affect (classroom) or social pressure (fundraising), not logical argumentation.  
  3. **Preserved agency**: Targets can disengage (students ignore stories; donors decline further contact).  

  **Boundary placements**:  
  - **vs. Hidden Trickery**: Neither case is deceptive—disclosure precludes "trickery."  
  - **vs. Reason-Giving**: Both intentionally sidestep pure rational appeal (e.g., you *replaced* statistics with stories; the fundraiser avoids explaining the charity’s impact).  
  - **Ethical edge**: Opt-out options prevent coercion, but *social discomfort* (e.g., guilt from ignoring photos) blurs into soft coercion. This tension defines the phenomenon’s core: ethical transparency *about* non-rational influence.

  ### 4. Naming Proposal and Edge Cases  
  **Proposed Term**: **Declared Affective Pressure (DAP)**  
  *Definition*: A strategy of influence where the actor openly states their intent to use non-rational means (emotional arousal, repetition, or social discomfort) to motivate action, while preserving the target’s ability to withdraw. It operates in the space between rational persuasion and coercion, leveraging transparency to maintain legitimacy but affect to ensure efficacy.  

  **Testing the Term’s Boundaries**:  
  - **Weaker Pressure Edge Case**: A fundraiser emails, "I’ll send one reminder next week—no pressure!" This is declared but lacks *sustained* pressure. *Verdict*: Not DAP. The low intensity makes it a mild "declared nudge," lacking the affective/repetitive weight central to your examples.  
  - **Stronger Pressure Edge Case**: A volunteer says, "I’ll publicly tag you on social media daily until you donate, but you can ask me to stop." Disclosure and opt-out exist, but *public shaming* escalates discomfort into reputational harm. *Verdict*: Beyond DAP. It crosses into coercive territory ("opt-out" is socially costly), violating DAP’s reliance on *tolerable* discomfort.  

  DAP thus holds when: (1) pressure is declared, (2) mechanisms are affective/social (not reason-based), (3) discomfort is navigable without significant repercussions. Your cases exemplify this; the second edge case shows where disclosure alone cannot ethically sustain the model.
