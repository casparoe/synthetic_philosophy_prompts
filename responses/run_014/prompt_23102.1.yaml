  Right, structuring the rebuttal: First, amplify the Nyāya stance—their epistemic conservatism (don't multiply pramāṇas unnecessarily) makes arthāpatti's alleged independence a serious claim. The thin/fat case truly lacks pre-confirmed vyāpti; we don't *know* "only eating causes weight gain" universally beforehand. Then twist the knife: if Nyāya concedes this is inference, their entire taxonomy crumbles because vyāpti becomes negotiable.  

