prompt: |-
  I'm a software engineer, no formal philosophy background, and I've been reading about predictive processing and the free energy principle, but I keep getting the sense that the FEP is just the Bayesian brain story rewritten in the language of variational bounds. Could you compare the standard predictive processing account (hierarchical generative model, prediction error units, precision-weighted learning, and action as prediction error minimization, i.e. active inference) with the FEP as a general normative principle: variational free energy as an upper bound on surprise, it's decomposition into accuracy and complexity, and expected free energy splitting into epistemic and pragmatic value? I'm especially curious where the FEP adds real content beyond the Bayesian brain story, and where it starts to feel like unfalsifiable hand-waving. Is minimizing free energy something you could actually implement as a design constraint on a system, or is it just a restatement of doing good inference with fancier notation?
