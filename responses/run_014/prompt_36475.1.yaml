      We adjust the first goalscorer market to have a sum of 1.06 by reducing the odds (multiplying the probabilities by 1.06/0.997).

      But note: the two markets are now individually coherent. We also need to run Check 2: are there common outcomes? The first goalscorer market does not have an outcome that is the same as the match result market (they are different events). So Check 2 doesn't apply.

      Check 3: We don't have combination bets in this example? Assume we also offer a double chance market:

          "Home or Draw": odd_HD = ? 
          We might set it as a separate market. How? We could derive: 
              Without overround: P(HD) = P(H)+P(D) = 0.5+0.25 = 0.75 -> odd = 1/0.75 = 1.333. 
          But with overround, we might set odd_HD = 1.25 -> p_HD = 0.8.

          Then the double chance market for "Away" would be the same as the match result market's away win? But we don't offer a separate away win in the double chance market? If we offer the double chance as two outcomes: "Home or Draw" and "Away", then:

              p_HD = 0.8, p_A = 0.25 (from match result market) -> sum = 1.05, which is acceptable.

          But note: the outcome "Away" in the double chance market is the same as in the match result market. So we require the same odds? 

              In the match result market, away win is 3.80 -> 1/3.80 = 0.2632.
              In the double chance market, we set away win to the same odd: 3.80 -> p=0.2632.

          Then for the double chance market: 
              "Home or Draw": we set odd_HD = 1 / (1 - p_A) * (1 + margin) but adjusted to be consistent. 

              Without overround: p_HD = 1 - p_A = 1 - 0.2632 = 0.7368 -> odd_HD = 1/0.7368 = 1.357.
              But we want a 6% overround in the double chance market? Then we set the implied probability to 0.7368 * 1.06 = 0.781 -> odd_HD = 1/0.781 = 1.28.

          Then check the double chance market: p_HD + p_A = 0.781 + 0.2632 = 1.0442 -> acceptable.

          But now, we must set the same outcome (away win) to the same odds in both markets: so in the double chance market, we set away win at 3.80 (same as match result). And in the double chance market, we set "Home or Draw" at 1.28.

          Then Check 2: the away win outcome is consistent.

      Therefore, in Case 1, we found two critical issues: 
          - The match result market had a sum of 1.0 (fixed by adding margin).
          - The first goalscorer market had a sum of 0.997 (fixed by adding margin).
          - Then we set the double chance market consistently.

   Case 2: In-play red card.

      Situation: 60th minute, home team gets a red card. Current odds in the match result market:
          Home: 3.00 -> p_H=0.333
          Draw: 3.40 -> p_D=0.294
          Away: 2.20 -> p_A=0.455
          Sum = 1.082 -> acceptable.

      Stakes are coming in. We:

          Step I1: Suspend all markets.

          Step I2: Update match result market. We judge that the home team's chance drops, away team's chance increases. We adjust:

              Home: 5.00 -> p_H=0.2
              Draw: 3.80 -> p_D=0.263
              Away: 1.80 -> p_A=0.556
              Sum = 0.2+0.263+0.556 = 1.019 -> which is above 1.0 but below 1.02 (our minimum margin). This is acceptable? Or do we require at least 1.02? 

              We require at least 1.02 to have a buffer. So we adjust further to increase the margin:

                  Home: 4.80 -> p_H=0.2083
                  Draw: 3.60 -> p_D=0.2778
                  Away: 1.74 -> p_A=0.5747
                  Sum = 0.2083+0.2778+0.5747 = 1.0608 -> acceptable.

          Step I3: Update other markets. For example, the next goalscorer market. We have:

              Home players: reduce their probabilities because the home team is down to 10 men.
              Away players: increase.

              We adjust the odds for each player accordingly and then ensure the entire market sums to about 1.06.

              Also, we must check common outcomes? The next goalscorer market does not have an outcome that is the same as the match result market, so no Check 2.

          Step I4: Check combination bets. For example, if we have a double chance market:

              Before the red card, we had:
                  "Home or Draw": 1.80 -> p_HD=0.5556
                  "Away": 2.20 -> p_A=0.4545 -> but wait, note that the away win in the double chance market should be the same as in the match result market? 

              After the red card, in the match result market, away win is 1.74 -> so in the double chance market, we set away win to 1.74 (p_A=0.5747). Then we set "Home or Draw" to:

                  Without overround: p_HD = 1 - p_A = 1 - 0.5747 = 0.4253 -> odd_HD = 1/0.4253 = 2.35.
                  With overround (6%): set the implied probability to 0.4253 * 1.06 = 0.4508 -> odd_HD = 1/0.4508 = 2.218.

              Then check: p_HD + p_A = 0.4508 + 0.5747 = 1.0255 -> acceptable.

          Step I5: Reopen the markets. Time taken: 3 minutes.

   Case 3: Unpopular suspension.

      Scenario: We are in-play, and a goal is scored. We suspend the markets. While suspended, we run the checks and find:

          In the match result market, the odds were:
              Home: 1.80 -> p_H=0.5556
              Draw: 3.80 -> p_D=0.2632
              Away: 4.50 -> p_A=0.2222
              Sum = 1.041 -> acceptable.

          But after the goal (say home team scores), we update:

              Home: 1.50 -> p_H=0.6667
              Draw: 4.00 -> p_D=0.25
              Away: 6.00 -> p_A=0.1667
              Sum = 1.0834 -> acceptable.

          However, we also have a double chance market. In this market, we have:

              "Home or Draw": 1.20 -> p_HD=0.8333
              "Away": 5.00 -> p_A=0.2

          Note: the away win outcome in the double chance market is set to 5.00 (p=0.2) but in the match result market it is 6.00 (p=0.1667). The difference is more than 0.01.

          We must adjust to make them consistent. We have two options:

              Option A: Change the double chance market's away win to 6.00 (so p_A=0.1667) and then recalculate "Home or Draw":
                  Without overround: p_HD = 1 - 0.1667 = 0.8333 -> with overround (6%): 0.8333 * 1.06 = 0.8833 -> odd_HD = 1/0.8833 = 1.132.

              Option B: Change the match result market's away win to 5.00 (p=0.2) and then adjust the other outcomes to maintain the sum at about 1.06.

          But note: the match result market is the primary market. We have already updated it and it passed Check 1. We don't want to change it arbitrarily.

          We decide to change the double chance market to match the match result market for away win. So we set away win to 6.00 in the double chance market. Then we recalculate "Home or Draw" to 1.132.

          But then we run Check 3 for the double chance market:

              p_HD + p_A = 0.8833 + 0.1667 = 1.05 -> acceptable.

          However, we now have a new problem: the double chance market's "Home or Draw" was 1.20 and now we are changing it to 1.132 (which is a worse price for the bettor). We are also changing away win from 5.00 to 6.00 (which is better for the bettor). 

          But while the market was suspended, we can make these changes.

          However, the problem is that we have to suspend for an extra minute to do this. And the market is very popular. 

          But if we don't suspend, and we leave the double chance market with away win at 5.00 and the match result market at 6.00, then a bettor could bet on away win in the double chance market at 5.00 and then also bet on home and draw in the match result market? Actually, that doesn't directly create an arbitrage. However, the bettor can get a better price for away win in the double chance market than in the match result market. This is not an arbitrage by itself, but it is inconsistent and bettors will only take the better price. We want to avoid offering the same outcome at different prices.

          Therefore, we must make the change. This means the suspension takes an extra minute. Total suspension: 4 minutes. This might be unpopular with the manager because we are missing out on bets, but it is necessary to avoid offering inconsistent odds.

          The procedure says: we must suspend until we are sure the markets are coherent.

      Therefore, we do the adjustment and then reopen.

      This case illustrates that sometimes we have to suspend for longer than desired to fix inconsistencies.

   F. Final notes:

      - The procedure for Check 2 and Check 3 must be done quickly. We might pre-identify the common outcomes and combination bets to speed up.
      - The overround is built into the implied probabilities we use in the checks. So we are checking the prices as offered to the bettors.
      - Judgment is involved in setting the initial probabilities and in how to adjust when an event happens (like the red card). The procedure only checks the internal consistency and cross-market consistency (for the same outcome) and the complementary events.
      - The procedure does not guarantee that there is no Dutch book possible across multiple bets (because we don't check every possible combination) but it covers the common ones (single market, complementary outcomes, and same outcome in different markets).

      We have provided a procedure that can be run in 10 minutes (or 2-3 minutes for in-play) by someone who can convert odds to probabilities and sum them. The steps are:

          Pre-match or in-play setup:
              For each market:
                  Check 1: Sum of implied probabilities must be at least 1.02 and ideally around 1.06. If <=1, suspend and fix.
              For any outcome that appears in multiple markets:
                  Check 2: The implied probabilities must be the same (within 0.01). If not, adjust the market that has the lower implied probability (i.e., the one that is more generous to the bettor) to the higher one (less generous) and then re-run Check 1 on the adjusted market.
              For combination bets that are complementary to a single outcome:
                  Check 3: The sum of the implied probabilities for the combination and the single outcome must be at least 1.02. If not, suspend and fix.

          In-play event:
              Step I1: Suspend all match markets.
              Step I2: Update match result market and run Check 1.
              Step I3: Update other markets and run Check 1 on each. Also, run Check 2 for any common outcomes and Check 3 for combination bets.
              Step I4: Reopen.

      We hope this helps.
answer: |-
  Below is a **practical, step-by-step procedure** for maintaining coherent odds and avoiding Dutch books, designed for your constraints (10-minute checks, staff with basic maths, UK English). It covers pre-match, in-play, combinations, accumulators, and margin handling. I'll be explicit about where judgement trumps maths.

  ---

  ### **Core Principles & Key Terms**
  1. **Dutch Book**: A set of bets that guarantees profit for the punter regardless of the outcome. Avoid by ensuring odds are "coherent".
  2. **Coherence**: 
     - **Single market**: Sum of implied probabilities (1/odds) for all outcomes must be **>1.00** (typically 1.05–1.08 for your 6% margin).  
     - **Across markets**: Odds for the same outcome (e.g., "Away Win") must be consistent (±0.01 in implied probability) to prevent arbitrage.
  3. **Margin Handling**: All checks apply to **margin-inflated odds** (the prices you offer). Never check raw probabilities—your margin is part of the business logic.
  4. **Judgement vs. Maths**: 
     - **Judgement**: Setting initial probabilities, reacting to events (e.g., a red card).  
     - **Maths**: Ensuring sums and cross-checks are coherent. Maths flags problems; judgement fixes them.

  ---

  ### **Procedure: Step-by-Step Checks**
  **Time Budget**: 8–10 minutes per full market check.  
  **Who Does It**: Odds compiler or trader (maths required: percentages, addition, division).  
  **Tools**: Calculator, spreadsheet, or basic software (e.g., Excel).

  #### **1. Pre-Match Checks (Daily)**
  Run these **in order** for all open markets on a match (e.g., Match Result, First Goalscorer).

  | Step | Task | Pass Condition | Failure Action | Time |
  |------|------|----------------|----------------|------|
  | 1.1 | **Single-Market Sum Check**:<br>For each market, convert odds to implied probabilities: `prob = 1 / decimal_odds`.<br>Sum all probabilities. | Sum = 1.05–1.08 (6% margin).<br>Example: Home (2.0 → 0.50), Draw (4.0 → 0.25), Away (4.0 → 0.25) → Sum = 1.00. **FAIL**. | **Suspend the market** immediately. Reprice all outcomes to hit sum ≈1.06.<br>*Example fix: Home (1.91 → 0.523), Draw (3.8 → 0.263), Away (3.8 → 0.263) → Sum=1.049*. | 2 min |
  | 1.2 | **Cross-Market Consistency**:<br>For outcomes appearing in multiple markets (e.g., "Away Win" in Match Result and "Draw or Away" double chance), compare implied probabilities. | Same outcome probabilities differ by ≤0.01.<br>Example: "Away Win" = 4.0 (0.25) in Match Result vs. 3.8 (0.263) in Double Chance → **diff=0.013 → FAIL**. | Adjust the **more generous (higher) odds** to match the tighter (lower) odds. Reprice the failing market and rerun Step 1.1. | 3 min |
  | 1.3 | **Combination Bet Check**:<br>For double chance/group bets (e.g., "Home or Draw"), ensure:<br>`prob("Home or Draw") + prob("Away Win") ≥ 1.02`.<br>(This covers complementary outcomes). | Sum ≥1.02.<br>Example: "Home or Draw" @1.5 (prob=0.667) + "Away" @4.0 (prob=0.25) → Sum=0.917 → **FAIL** (risk of Dutch book). | **Suspend both markets**. Reprice the combination bet to ensure sum ≥1.02.<br>*Fix: Adjust "Home or Draw" to 1.44 (prob=0.694) → Sum=0.944*. | 2 min |
  | 1.4 | **Accumulators (Judgement Only)**:<br>No coherence check needed. Accumulators use multiplied odds from individual markets, which are already vetted. | N/A | N/A | 0 min |

  #### **2. In-Play Event Response (e.g., Red Card)**
  **Goal**: Update all markets in <5 minutes while suspended.  
  **Key**: Suspend first, then reprice in order of liquidity (Match Result > Goalscorers > Others).

  | Step | Action | Order | Time |
  |------|--------|-------|------|
  | 2.1 | **Suspend all markets** immediately. Stop taking bets. | First | 0 min |
  | 2.2 | **Reprice Match Result**:<br>- Use judgement to adjust odds (e.g., shorten Away Win after red card).<br>- Run **Step 1.1** to confirm sum=1.05–1.08. | 1 | 1 min |
  | 2.3 | **Reprice Related Markets**:<br>- Update goalscorer odds (e.g., reduce home player probabilities).<br>- Run **Steps 1.1–1.3** for each market. | 2 | 3 min |
  | 2.4 | **Reopen markets** if all checks pass. | Last | 0 min |
  | **Total Time** | | | **4 min** |

  #### **3. When to Suspend vs. Patch**
  - **Patch Single Price**: Only if one market fails Step 1.1 or 1.2 (e.g., sum=1.00).  
  - **Suspend Entire Market**: If Step 1.3 fails (combination bets), or multiple markets are inconsistent (Step 1.2).  
  - **Judgement Call**: If a fix takes >2 minutes, suspend and investigate.

  ---

  ### **Worked Examples**
  #### **Case 1: Pre-Match Inconsistency (Match Result vs. First Goalscorer)**
  - **Match Result Market**:  
    Home @2.0 (prob=0.50), Draw @4.0 (0.25), Away @4.0 (0.25) → **Sum=1.00 → FAIL Step 1.1**.  
    **Action**: Suspend market. Reprice to Home @1.91 (0.523), Draw @3.8 (0.263), Away @3.8 (0.263) → Sum=1.049 → Pass.
    
  - **First Goalscorer Market**:  
    Kane (Home) @5.0 (0.20), Salah (Away) @5.0 (0.20), No Scorer @10.0 (0.10) → Sum=0.50 → **FAIL Step 1.1** (sum too low).  
    **Action**: Reprice all goalscorer odds to sum ≈1.06 (e.g., Kane @4.5, Salah @4.5, No Scorer @8.0 → Sum=1.06).

  - **Cross-Check**:  
    Away Win prob (0.263) vs. Salah as goalscorer in Away win (judgement, not maths). **No fix needed**—maths only checks exact outcome matches.

  #### **Case 2: In-Play Red Card (60th Minute)**
  - **Situation**: Home team red card; Match Result market open with stakes flooding in.
  - **Action**:  
    1. **Suspend all markets** (0 min).  
    2. **Reprice Match Result**: 
       - Original: Home @2.5 (0.40), Draw @3.5 (0.286), Away @2.8 (0.357) → Sum=1.043.  
       - Post-red card (judgement): Home @4.0 (0.25), Draw @3.8 (0.263), Away @2.0 (0.50) → Sum=1.013 → **FAIL Step 1.1** (too close to 1.00).  
       - Fix: Adjust to Home @3.8 (0.263), Draw @3.6 (0.278), Away @1.95 (0.513) → Sum=1.054 (1 min).  
    3. **Reprice Goalscorer Market**: Reduce home player odds (e.g., Kane from @4.0 to @5.0). Confirm sum=1.06 (2 min).  
    4. **Reopen markets** (4 min total).

  #### **Case 3: Unpopular Suspension (In-Play Goal During Peak Betting)**
  - **Situation**: Goal scored; Match Result market sum passes (1.06), but "Draw or Away" double chance @1.4 (prob=0.714) vs. Home Win @3.0 (prob=0.333):  
    `0.714 + 0.333 = 1.047` → Passes Step 1.3.  
    **BUT** cross-market check reveals:  
    - "Away Win" in Match Result @4.0 (prob=0.25)  
    - "Away Win" in Double Chance @3.8 (prob=0.263) → **Diff=0.013 → FAIL Step 1.2**.  
  - **Action**:  
    - Suspend both markets (angering manager, but necessary).  
    - Adjust Double Chance "Away Win" to 4.0 (prob=0.25) to match Match Result.  
    - Recalculate "Draw or Away": New prob=1–0.25=0.75 → Odds=1.33 (with margin: 1.28).  
    - Sum check: `0.25 + 0.78 = 1.03` → Pass.  
  - **Why Unavoidable?**  
    A punter could bet £100 on "Away Win" in Double Chance @3.8 and £100 on "Home Win" in Match Result @3.0. If Home wins, they lose £100 on Away but win £200 on Home (net +£100). If Away wins, they win £280 on Away and lose £100 on Home (net +£180). **Guaranteed profit** → Dutch book.

  ---

  ### **Key Takeaways**
  - **Margin Matters**: Always use your 6% inflated odds for checks.  
  - **Suspend Early**: If a check fails, suspend before patching. A 5-minute pause is cheaper than a Dutch book.  
  - **Judgement Areas**:  
    - Setting initial probabilities.  
    - Repricing after events (e.g., "How much does a red card shift odds?").  
    - Goalscorer updates (no maths rule for "Kane’s odds given Home Win probability").  
  - **Hard Truth**: Case 3 shows you **must** suspend popular markets when cross-market inconsistencies arise—no shortcut exists. Maths protects the book; judgement handles the rest.  

  This procedure balances speed and safety. Run drills with your team to streamline the 10-minute window. If a step is unclear, shout—I’ll refine it.
