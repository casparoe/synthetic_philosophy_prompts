answer: |-
  Here’s a concise argument addressing your core concern, grounded in posthumous dignity and narrative integrity, taking the defenses seriously but showing why they fail for *degrading* inventions:

  1.  **Beyond Harm & Deception: The Dignity Objection:**  
      The wrong isn't reducible to misleading the audience (who may know it's fictionalized) or harming living relatives (who are absent). The core violation is against the *subject herself*: a posthumous violation of her **dignity and narrative agency**. She had a lived identity, shaped by her choices and struggles. Fabricating a secret betrayal and shameful confession imposes a *degrading inner life* she did not possess and never consented to. This rewrites her moral character against the historical record of her public actions.

  2.  **Distinguishing Invention: Degradation vs. Dramatization:**  
      Acceptable "dramatic license" (compression, composite characters, plausible dialogue) serves narrative *efficiency* or *accessibility* without fundamentally distorting the subject's *character* or *core motivations*. Inventing **degrading private acts/motives** (like petty jealousy leading to betrayal) does something categorically different: it **falsifies her moral essence**. It substitutes the creators' invented *weakness* or *moral failing* for the complex reality of her likely motivations (solidarity, conviction). This isn't just changing *how* events are shown, but *who she fundamentally was* at her core.

  3.  **Why "No Living Harm" & "Audience Awareness" Aren't Sufficient Defenses:**  
      *   **No Harm to Living:** While mitigating *some* ethical concerns, it doesn't address the intrinsic wrong *to the deceased*. Her dignity persists as a moral consideration; we owe the dead respect for the truth of their existence, especially figures of historical significance. Turning her into a vehicle for an invented "arc" of secret shame objectifies her and disregards her actual legacy.
      *   **Audience Knowledge:** The disclaimer sets an expectation of alteration, but it doesn't license *any* alteration. Audiences expect invention for *dramatic flow*, not the wholesale fabrication of *morally compromising secrets* that contradict the known public record. Knowing it's "fictionalized" doesn't mean they expect or accept a *character assassination* masquerading as depth.

  4.  **The Social Harm of Corrupted Legacy:**  
      Even if no immediate individual is harmed, such distortions **corrupt historical memory and understanding**. This organizer's real, complex motivations for action (systemic injustice, collective power) are replaced by a trivial, personal vice. This misrepresents the nature of struggle and leadership, offering a psychologically reductive narrative that obscures larger social truths her life embodied.

  **Core Move Summary:** The ethical violation lies in the **posthumous misrepresentation of moral character** through invented degrading motives/acts. This violates the subject's dignity and narrative integrity in a way neutral dramatization does not. Defenses based on audience awareness or lack of living harm fail because they ignore the intrinsic wrong to the deceased and the specific, corrupting nature of *degrading* inventions on historical understanding. (Word Count: 428)
