answer: |-
  You've hit on one of the most persistent and subtle problems in metaontology. Let's break this down step-by-step, addressing your specific queries about the disambiguation criterion, its failures, and the Quine-Carnap clash.

  ### (a) The Disambiguation Criterion: Definition and Rationale
  - **Precise Statement**: A dispute is *merely verbal* iff:
    1. There is a key term 'T' whose meaning is ambiguous or contested.
    2. When disputants explicitly stipulate distinct meanings for 'T' (e.g., "By 'T', I mean X" vs. "By 'T', I mean Y"),
    3. Their *original disagreement vanishes* — they either agree on the underlying facts or recognize they were talking about different things.
    4. No *residual factual disagreement* about the world persists once meanings are fixed.

  - **Why it tracks "merely verbal" disputes**: The intuition is that substantive disagreements should survive semantic clarification. If fixing meanings eliminates the dispute, the conflict wasn't about *how the world is* but about *how to describe it*. Carnapians argue this reveals a "choice of linguistic framework" rather than a discovery about reality.

  ### (b) Failure Cases: Where Disambiguation Breaks Down
  The criterion faces problems in cases of **conceptual entanglement** or **deep semantic indeterminacy**. Here's a key example:

  - **Case: "Is Pluto a planet?" (The Demarcation Problem)**  
    - **Dispute**: Astronomer A says "Pluto is a planet"; Astronomer B says "Pluto is not a planet."  
    - **Disambiguation Attempt**:  
      - A: "By 'planet', I mean any celestial body orbiting a star, with sufficient mass for hydrostatic equilibrium."  
      - B: "By 'planet', I mean that *plus* clearing its orbital neighborhood."  
    - **Result**: They agree Pluto satisfies A's definition but not B's. Yet their dispute *doesn't fully dissolve*:  
      - **Persistent Disagreement**: They now argue over *which definition should be adopted* (e.g., "Should 'clearing the neighborhood' be essential to planethood?").  
      - **Why the Criterion Fails**:  
        1. **Indeterminacy**: The disagreement shifts to the *normative question* of how to define 'planet' for scientific purposes. This isn't purely verbal (it involves empirical goals like taxonomic utility) nor purely factual (no "planet" essence exists in nature).  
        2. **Entanglement**: Criteria like "orbital dominance" depend on astrophysical theories (e.g., planet formation models), blurring the line between linguistic choice and factual commitment.  
    - **Conclusion**: The dispute is **hybrid** — partially verbal (resolved by stipulation) and partially substantive (about which stipulation best carves nature at the joints). The disambiguation criterion cannot neatly classify it.

  ### (c) Quine vs. Carnap: Frameworks, Pseudo-Questions, and the Target of Quine's Critique
  - **Carnap's Position**:  
    Carnap distinguishes **internal questions** (within a linguistic framework, answerable by its rules) and **external questions** (about the framework itself). For him:  
    - Theism/atheism (e.g., "Do numbers exist?") is an *external question* about adopting a *framework* (e.g., one including abstract objects).  
    - This is **not** merely a verbal dispute in the disambiguation sense. It's a **pseudo-question**:  
      - It lacks *cognitive content* because there's no framework-independent fact of the matter.  
      - The choice is *pragmatic* (e.g., "Is the number framework useful for science?").  
    - **Analogy**: Asking "Do numbers exist?" without a framework is like asking "Should we use Fahrenheit or Celsius?" before defining temperature scales. The answer isn't "discovered"; it's *decided* based on expediency.  

  - **Quine's Rebuttal**:  
    Quine attacks the **core presuppositions** of Carnap's view:  
    1. **Rejection of Analytic/Synthetic Distinction**: For Quine, *no* statement (including "numbers exist") is true purely by linguistic convention. All truths involve empirical commitments ("Two Dogmas of Empiricism").  
    2. **Holism**: Ontological claims are woven into our web of belief. To accept physics is to accept its ontological commitments (e.g., sets for mathematics).  
    3. **Target**: Quine isn't just rejecting that ontology is "merely verbal." He argues **Carnap's framework relativism is incoherent** because:  
       - We cannot separate "linguistic" from "factual" components of theories (indeterminacy of translation).  
       - External questions *do* have content: they ask whether entities are *indispensable to our best scientific theories* (e.g., "On What There Is").  

  - **Mapping to the Disambiguation Criterion**:  
    - Carnap sees theism/atheism about numbers as a **pseudo-question** (neither verbal nor substantive; *non-cognitive*).  
    - Quine sees it as **substantive** (answerable by scientific indispensability).  
    - **Key Difference**: For Quine, *disambiguation alone cannot resolve ontological disputes* because meaning is inseparable from theory. Even if we fix meanings holistically (e.g., "existence" = Quine's "being the value of a bound variable"), disagreement persists about *what our best theories quantify over*.  

  ### Why This Matters to Your Concern
  The disambiguation criterion presupposes a sharp line between *meaning* and *fact* — a line Quine obliterates. Carnap's "pseudo-question" move relies on that same distinction. When Quine demolishes analyticity, he undermines both:  
  - If meaning/fact cannot be disentangled, no dispute is *purely* verbal under the disambiguation criterion.  
  - Ontology becomes "substantive" by default — but only as an *immanent* exercise within our web of belief, not a transcendent inquiry.  

  This is why contemporary metaontology (e.g., Chalmers, Sider) often seeks new criteria for "substantiveness" (e.g., *eli*ticity, fundamentality). The Quine-Carnap debate shows why the disambiguation test is insufficient but also why replacing it is fiendishly hard.
