  ### The Deep Error in the Two-Envelope Paradox: Misapplication of the Principle of Indifference

  The standard resolution of the two-envelope paradox correctly identifies that the expected-value argument for switching relies on an improper prior over the envelope amounts, but this does not fully capture the underlying flaw. The deeper mistake lies in a misapplication of the **principle of indifference**. Specifically, the player assumes that, conditional on observing a specific amount \(A\) in their envelope, the hypotheses "I hold the smaller envelope" (\(H_s\)) and "I hold the larger envelope" (\(H_l\)) are a priori equiprobable—i.e., \(P(H_s | A) = P(H_l | A) = \frac{1}{2}\). This assumption is unjustified because the conditional probability \(P(H_s | A)\) (or \(P(H_l | A)\)) is not inherently \(\frac{1}{2}\); it depends entirely on the prior distribution over the smaller amount \(X\) (where one envelope contains \(X\) and the other contains \(2X\)). This prior determines how likely it is that \(A\) is the smaller or larger amount, given the observed value.

  The principle of indifference is misapplied here because it treats the conditional probabilities \(P(H_s | A)\) and \(P(H_l | A)\) as symmetric without considering the prior. In reality, \(P(H_s | A)\) is derived from the prior over \(X\) and the process of envelope selection, and it can vary significantly based on the distribution of \(X\). Only in specific, symmetric cases (e.g., a prior with equal probability for all possible \(X\) values) might \(P(H_s | A) = \frac{1}{2}\) hold, but such a prior is often improper or unrealistic. Generally, \(P(H_s | A)\) is not \(\frac{1}{2}\), and assuming otherwise leads to the erroneous expected-value calculation that suggests switching is always beneficial.

  To illustrate this, we'll work through a concrete example with a proper prior. This will show that the rational decision to switch depends on the prior and the observed amount \(A\), and that the ex ante symmetry (unconditional switching confers no advantage) is compatible with a prior-dependent ex post switching rule.

  #### Concrete Example with a Proper Prior
  Consider a proper prior where the smaller amount \(X\) is discrete and has the following distribution:
  - \(P(X = 10) = 0.9\)
  - \(P(X = 20) = 0.1\)

  The envelopes are prepared as follows:
  - With probability 0.9, \(X = 10\), so the envelopes contain 10 and 20.
  - With probability 0.1, \(X = 20\), so the envelopes contain 20 and 40.

  You select one envelope at random (50% chance of picking either envelope) and observe the amount \(A\). The possible values for \(A\) are 10, 20, or 40. We need to compute the conditional probabilities \(P(H_s | A)\) and \(P(H_l | A)\) for each case, and then determine whether switching is beneficial.

  First, calculate the unconditional probabilities of observing each amount:
  - \(P(A = 10)\): Only occurs if \(X = 10\) and you pick the smaller envelope.  
    \(P(A = 10) = P(X = 10) \times P(\text{pick smaller} | X = 10) = 0.9 \times 0.5 = 0.45\).
  - \(P(A = 40)\): Only occurs if \(X = 20\) and you pick the larger envelope.  
    \(P(A = 40) = P(X = 20) \times P(\text{pick larger} | X = 20) = 0.1 \times 0.5 = 0.05\).
  - \(P(A = 20)\): Can occur in two ways:  
    - \(X = 10\) and you pick the larger envelope: \(P = P(X = 10) \times P(\text{pick larger} | X = 10) = 0.9 \times 0.5 = 0.45\).  
    - \(X = 20\) and you pick the smaller envelope: \(P = P(X = 20) \times P(\text{pick smaller} | X = 20) = 0.1 \times 0.5 = 0.05\).  
    Total \(P(A = 20) = 0.45 + 0.05 = 0.50\).

  Now, compute the conditional probabilities for each observed amount:
  - **Case 1: \(A = 10\)**  
    If you observe 10, you must have the smaller envelope (since the larger would be 20 when \(X = 10\), and \(X = 20\) cannot produce \(A = 10\)). Thus:  
    \(P(H_s | A = 10) = 1\), \(P(H_l | A = 10) = 0\).  
    Expected value of switching:  
    \(E[\text{switch} | A = 10] = P(H_s | A = 10) \times 2 \times 10 + P(H_l | A = 10) \times \frac{10}{2} = 1 \times 20 + 0 \times 5 = 20\).  
    Not switching gives 10, so switching is better (20 > 10).

  - **Case 2: \(A = 40\)**  
    If you observe 40, you must have the larger envelope (since the smaller would be 20 when \(X = 20\), and \(X = 10\) cannot produce \(A = 40\)). Thus:  
    \(P(H_s | A = 40) = 0\), \(P(H_l | A = 40) = 1\).  
    Expected value of switching:  
    \(E[\text{switch} | A = 40] = P(H_s | A = 40) \times 2 \times 40 + P(H_l | A = 40) \times \frac{40}{2} = 0 \times 80 + 1 \times 20 = 20\).  
    Not switching gives 40, so switching is worse (20 < 40); do not switch.

  - **Case 3: \(A = 20\)**  
    Here, \(A = 20\) could mean:  
    - \(H_l\) when \(X = 10\) (you have the larger envelope, so the smaller is 10).  
    - \(H_s\) when \(X = 20\) (you have the smaller envelope, so the larger is 40).  
    We need \(P(H_s | A = 20)\) and \(P(H_l | A = 20)\):  
    - Probability of \(H_l\) and \(A = 20\): \(P(X = 10, \text{pick larger}) = 0.9 \times 0.5 = 0.45\).  
    - Probability of \(H_s\) and \(A = 20\): \(P(X = 20, \text{pick smaller}) = 0.1 \times 0.5 = 0.05\).  
    Since \(P(A = 20) = 0.50\),  
    \(P(H_l | A = 20) = \frac{0.45}{0.50} = 0.9\),  
    \(P(H_s | A = 20) = \frac{0.05}{0.50} = 0.1\).  
    Expected value of switching:  
    \(E[\text{switch} | A = 20] = P(H_s | A = 20) \times 2 \times 20 + P(H_l | A = 20) \times \frac{20}{2} = (0.1 \times 40) + (0.9 \times 10) = 4 + 9 = 13\).  
    Not switching gives 20, so switching is worse (13 < 20); do not switch.

  **Key Insight**:  
  - For \(A = 20\), \(P(H_s | A = 20) = 0.1\) and \(P(H_l | A = 20) = 0.9\), not \(\frac{1}{2}\). If you mistakenly assume equiprobability (as in the paradox), you would compute \(E[\text{switch} | A = 20] = (\frac{1}{2} \times 40) + (\frac{1}{2} \times 10) = 25 > 20\), incorrectly favoring switching. But with the correct prior-dependent probabilities, switching is harmful (13 < 20).  
  - The decision to switch depends on \(A\) and the prior: for \(A = 10\), switch; for \(A = 20\) or \(A = 40\), do not switch. This is rational and prior-dependent.

  #### Ex Ante Symmetry vs. Ex Post Switching Rule
  The ex ante symmetry—that unconditionally switching before observing \(A\) confers no advantage—is not in tension with the prior-dependent ex post switching rule; they are compatible. Here's why:

  - **Ex Ante (Before Observing \(A\))**:  
    Unconditionally, the expected value of not switching and always switching are equal.  
    - Expected value of not switching:  
      With probability 0.5, you pick the smaller envelope and get \(X\); with probability 0.5, you pick the larger and get \(2X\).  
      \(E[\text{not switch}] = 0.5 \times E[X] + 0.5 \times E[2X] = 0.5 \times E[X] + E[X] = 1.5 \times E[X]\).  
      \(E[X] = (10 \times 0.9) + (20 \times 0.1) = 9 + 2 = 11\), so \(E[\text{not switch}] = 1.5 \times 11 = 16.5\).  
    - Expected value of always switching:  
      If you have the smaller, switching gets \(2X\); if you have the larger, switching gets \(X\).  
      \(E[\text{switch}] = 0.5 \times E[2X] + 0.5 \times E[X] = 0.5 \times 2 \times 11 + 0.5 \times 11 = 11 + 5.5 = 16.5\).  
      Thus, \(E[\text{not switch}] = E[\text{switch}] = 16.5\), confirming ex ante symmetry.

  - **Ex Post (After Observing \(A\))**:  
    Conditioning on \(A\) provides information about which envelope you likely hold, breaking the symmetry. The optimal strategy (switch for \(A = 10\), do not switch for \(A = 20\) or \(A = 40\)) exploits this information:  
    - For \(A = 10\): Switch and gain (expected 20 vs. 10).  
    - For \(A = 20\): Do not switch (expected 20 vs. 13 from switching).  
    - For \(A = 40\): Do not switch (40 vs. 20 from switching).  
    The expected value of this strategy is:  
    \[
    E[\text{value}] = P(A = 10) \times 20 + P(A = 20) \times 20 + P(A = 40) \times 40 = (0.45 \times 20) + (0.50 \times 20) + (0.05 \times 40) = 9 + 10 + 2 = 21.
    \]  
    This exceeds the ex ante expected value of 16.5, showing that conditioning improves decisions. However, this gain comes from the information in \(A\), not from violating ex ante symmetry. The ex post strategy is consistent with ex ante symmetry because:
    - The improvement (21 > 16.5) is due to conditioning, which leverages the prior to make better decisions.
    - Ex ante, you cannot achieve this gain without observing \(A\); you can only commit to a fixed action (switch or not), which averages to 16.5.
    - The prior-dependent switching rule respects the envelope selection process: it doesn't create value from nothing but uses observed data to avoid losses (e.g., not switching when \(A = 40\)) or seize opportunities (e.g., switching when \(A = 10\)).

  In summary, the paradox arises from incorrectly assuming \(P(H_s | A) = \frac{1}{2}\) via the principle of indifference, when in fact this probability is prior-dependent. A proper prior shows that the decision to switch varies with \(A\), and ex ante symmetry holds because conditioning on \(A\) resolves uncertainty without contradicting the unconditional equivalence of switching and not switching.
