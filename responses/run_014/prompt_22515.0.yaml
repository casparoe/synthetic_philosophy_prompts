prompt: |-
  I'm in a social ontology PhD program, and two of my seminar mates got into it after we read Lewis's Convention. Their exchange went: (1) Ana said that Lewis's 'non-accidental' condition is basically satisfied by evolutionary stability: if a regularity in a coordination game is maintained by cultural selection or repeated reinforcement, then it isn't just a coincidence, so culturally evolved regularities can be Lewisian conventions. (2) Ben said no, Lewis's non-accidental condition isn't just causal non-accidentality; it's tied to the agents' common interest and mutual expectations. A population can have a stable regularity that is causally explained by selection, but if nobody expects it as the way things are done, it's not a convention. (3) Ana replied that expectations can be selected too: if agents who expect the stable regularity and conform when they expect it do better, then the expectation structure can evolve alongside the behavior. (4) Ben said that's circular: to say the regularity is stable because people expect it is already to assume the convention exists, and Lewis's account is supposed to explain what a convention is, not just to re-describe a stable population. (5) Ana said that's not circular, it's diachronic: selection can first produce a regularity, then produce expectations about it, and once the expectation loop is in place the regularity meets Lewis's conditions. I wasnt taking sides, but I keep thinking there's a difference between a norm being stable and a norm being the kind of thing Lewis means by a convention. Can you adjudicate this move by move? I want to know who's right about which specific point, not just who wins overall, and what, if anything, both of them are missing.
reasoning: |-
  Okay, this user is deep in social ontology PhD territory, wrestling with Lewis's Convention nuances. They're not just asking for a simple answer but a move-by-move adjudication of their seminar mates' debate. The level of specificity requested suggests they've already mapped the conceptual battlefield and need precision tools. 

  Hmm, Ana and Ben's exchange reveals two fundamentally different readings of Lewis's "non-accidental" condition. Ana leans into evolutionary mechanisms - she's thinking like a game theorist seeing conventions as stable equilibria. Ben is stricter about Lewis's intentionality requirements - he's guarding against reducing conventions to mere behavioral patterns. Both miss nuances Lewis embedded in his account.

  The user's own intuition about stability vs convention-ness is perceptive. Lewis does distinguish mere behavioral regularities from proper conventions precisely through the expectation-reasoning loop. That's why Ben's circularity charge in move 4 isn't fully justified - Ana's describing an evolutionary pathway, not logical circularity. Though Ben is right that evolved expectations alone don't satisfy Lewis's mutual knowledge requirement.

  Noticing the user stayed neutral but nags at the stability/convention distinction. They might be sensing that Ana's model risks conflating functional behaviors (like evolved instincts) with norm-governed practices. Lewis's key move was tethering conventions to agents' reasoning, not just environmental success. Should emphasize how expectation in Lewis isn't just predictive but justificatory.

  The reference to cultural evolution suggests Ana might be influenced by Boyd & Richerson-type models. Ben seems more textually orthodox. Neither addresses Lewis's requirement that alternatives must be conceivable - an evolutionary stability account could easily overlook how conventions require salient options.

  Biggest gap in both positions: neither engages with Lewis's common knowledge requirement. Evolved expectations might produce coordination, but without mutual recognition of the contingency of the regularity, it's not full-blooded convention. The user's original "difference" intuition touches this - stability is about persistence, convention is about its cognitive architecture in the population.
answer: |-
  Here's a precise adjudication of each move, highlighting valid points, misinterpretations, and what each speaker might be missing based on Lewis's core arguments in *Convention*:

  ### Move 1: Ana on Evolutionary Stability
  *   **Ana:** Evolutionary stability (cultural selection/reinforcement) satisfies Lewis's "non-accidental" condition by providing a causal explanation for the regularity, making it non-coincidental. Culturally evolved regularities *can* be conventions.
  *   **Adjudication: Partially Right, but Incomplete.**  
      Lewis *does* require a non-accidental regularity (Ch. 1). Ana is correct that evolutionary stability *can* provide a plausible causal mechanism explaining *why* a regularity persists ("non-accidentality" in a causal sense). This mechanism *could* underpin a convention. **However**, Lewis's "non-accidental" condition is *not solely* about causal persistence. It's tightly interwoven with the *reason* the regularity persists: *agents acting on their beliefs and preferences* (mutual expectations and common interest). Ana risks reducing "non-accidental" to mere causal stability, potentially decoupling it from Lewis's core requirement of agent-level *reasoning* based on expectations.

  ### Move 2: Ben on Common Interest & Mutual Expectations
  *   **Ben:** Lewis's "non-accidental" condition is not *just* causal; it's intrinsically tied to agents' common interest and mutual expectations. A stable regularity explained *only* by selection (without agents expecting/choosing based on it) isn't a convention.
  *   **Adjudication: Essentially Correct.**  
      Ben identifies the core of Lewis's account (Ch. 1, I.4). Lewis defines conventions as solutions to coordination problems *because* they are self-perpetuating due to agents' *preferences* for conformity conditional on their *expectations* of others' conformity. The stability *must* arise from agents' reasoning within the coordination problem structure. A regularity maintained *solely* by blind selection or reinforcement (e.g., instinct, purely external sanctions without internalized expectations) **would not qualify** as a Lewisian convention, even if it's evolutionarily stable. Lewisian conventions require agents to be *aware* of the regularity as a solution and act *because* they expect others to act similarly. Ben rightly emphasizes the intentional structure.

  ### Move 3: Ana on Evolving Expectations
  *   **Ana:** Expectations themselves can be subject to selection. Agents who form the "right" expectations (matching the stable regularity) and act on them do better, allowing the expectation structure to evolve alongside the behavior.
  *   **Adjudication: Plausible Mechanism, but Doesn't Fully Capture Lewis.**  
      Ana offers a coherent *diachronic* mechanism for how the mutual expectations central to Lewis *could* arise via cultural evolution/selection. This is a valid point about *how* such a state *might* come about. **However, this mechanism alone doesn't guarantee the resulting state *is* a Lewisian convention.** Lewis requires that agents *in the present state* conform *because* they *prefer* to conform *conditional on their expectations* of others' conformity, and crucially, that these expectations are *mutually reinforcing and (approximately) common knowledge*. Selection might produce agents who *do* conform and *do* have matching expectations, but it doesn't guarantee that the agents conform *for the reason Lewis specifies* (i.e., conditional preference based on expectation). They might conform due to a hard-wired habit or a different belief structure not tied to mutual expectations in the coordination problem. Ana's mechanism might *lead to* a convention, but the resulting state needs to meet Lewis's synchronic criteria (beliefs, preferences, reasoning) *now*.

  ### Move 4: Ben on Circularity
  *   **Ben:** Ana's argument is circular: Saying the regularity is stable *because* people expect it assumes the convention already exists. Lewis's account defines conventions, not just describes stable populations.
  *   **Adjudication: Misidentifies Circularity, but Correct on the Goal.**  
      Ben mislabels Ana's argument as circular. Ana is proposing an *evolutionary pathway* (regularity first, then expectations co-evolving), not a *logical circle*. It's diachronic, not synchronic circularity. **However, Ben is fundamentally correct about Lewis's aim:** Lewis provides a *synchronic* analysis of what constitutes a convention *at a given time*. The stability arises *from* the mutual expectations and preferences *within* the convention itself. Lewis's definition explains *why* it's stable *as a convention*. Ana's evolutionary story explains *how such a state might come to be*, but doesn't replace the synchronic definition. The circularity Ben senses is actually the *self-reinforcing nature* of conventions within Lewis's definition – which is a feature, not a bug. Ben rightly insists that Lewis's account is constitutive, not merely descriptive of stability.

  ### Move 5: Ana on Diachronic Process
  *   **Ana:** It's not circular, it's diachronic: Selection can first produce a regularity, then produce expectations about it. Once the expectation loop is in place, it meets Lewis's conditions.
  *   **Adjudication: Partially Vindicated, but Misses the Synchronic Requirement.**  
      Ana successfully defends her position against the charge of circularity. A diachronic process where selection first fixes behavior and later fixes expectations (or co-evolves them) is logically coherent and plausible. **However, her final claim ("once the expectation loop is in place the regularity meets Lewis's conditions") glosses over a critical nuance.** Merely having agents who conform *and* have matching expectations *is necessary but not sufficient* for Lewis. The agents must conform *specifically because they prefer to conform conditional on their expectations of others' conformity* (Lewis's "reason for conforming"). Furthermore, Lewis requires that the situation is one of *common* (or near-common) *knowledge* – everyone knows the regularity, everyone knows everyone knows it, etc. (Ch. II). Ana's evolutionary process might produce matching expectations and conformity, but it doesn't guarantee that the agents' *reasons* for conforming are the conditional preference based on expectation, nor does it guarantee the common knowledge structure. The *mechanism* of selection might bypass the very reasoning process Lewis sees as definitive.

  ## Who's Right on What & What's Missing

  *   **Ana is Right:** Evolutionary stability *can* causally explain the persistence/non-accidentality of a behavioral regularity (Move 1) and *can* provide a plausible diachronic mechanism for developing mutually reinforcing expectations and conformity (Moves 3 & 5). This mechanism isn't logically circular (Move 5).
  *   **Ben is Right:** Lewis's "non-accidental" condition is fundamentally tied to the self-reinforcing loop of mutual expectations and conditional preferences in a coordination problem, not just any causal stability (Move 2). Lewis's account defines conventions *by* this synchronic structure, not just by diachronic stability (Move 4). Selection alone, without the specific *reasoning structure* and *common interest*, doesn't produce a Lewisian convention.
  *   **What Ana Misses:** The specific *reasons* for action Lewis requires (conditional preference based on expectation) and the *common knowledge* requirement. Her mechanism might produce conformity and correlated expectations, but not necessarily the *intentional structure* of a convention as Lewis defines it. She risks conflating functional stability with normative convention.
  *   **What Ben Misses:** The potential for evolutionary processes to be a *causal pathway* leading to a state that *does* satisfy Lewis's synchronic criteria. His "circularity" charge was misplaced (though his underlying point about the synchronic definition was correct). He might underappreciate how selection *could* shape the required preferences and beliefs.
  *   **Your Intuition is Correct:** There *is* a crucial difference between a norm being merely stable (even evolutionarily stable) and it being a Lewisian convention. The difference lies precisely in **the source of the stability**: Lewisian conventions are stable *because* they are sustained by agents' mutually responsive expectations and preferences within a recognized coordination problem. Stability from external forces (like pure selection pressure) or internal forces *not* tied to mutual expectations in the coordination problem (like ingrained habit or private beliefs) doesn't suffice. The key is the *self-referential, reason-based loop* at the agent level, grounded in common interest and (approximate) common knowledge.
