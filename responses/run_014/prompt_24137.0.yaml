answer: |-
  ## Gricean Implicature Fact-Checking Decision Procedure

  **Core Gricean Principles (Consensus):**
  1.  **What is Said:** The literal truth-conditional content, determined by conventional meaning and disambiguation/reference fixing.
  2.  **Conversational Implicature (CI):** An inference generated by the assumption the speaker is observing the Cooperative Principle (CP) and its Maxims (Quantity, Quality, Relation, Manner). It's *not* part of what is said and arises from the context.
  3.  **Conventional Implicature (ConvI):** An inference triggered by specific words/phrases (e.g., "but", "even", "if"), contributing non-truth-conditional meaning attached to convention. *Note: Status is debated, but they are generally considered "said" for fact-checking.*
  4.  **Flouting vs. Violating:** **Flouting** (blatantly breaking a maxim to generate an implicature) is central to CI. **Violating** (covertly breaking a maxim, often to deceive) bypasses the CP assumption needed for standard CI calculation.
  5.  **Standard CI Tests:**
      *   **Cancellability:** A CI can be explicitly denied without contradiction. *(Strong indicator it's CI, not said)*.
      *   **Non-detachability:** The CI attaches to the *content* of the utterance, not its specific form. Rephrasing the same content should preserve the CI. *(Strong indicator it's CI, not ConvI or said)*.
      *   **Calculability:** The CI must be derivable from the literal meaning + CP + context + background knowledge. *(Core definition of CI)*.
      *   **Non-conventionality:** The CI doesn't arise solely from conventional meaning (distinguishing CI from ConvI/said).

  **Contested Areas (Acknowledge Uncertainty):**
  *   **Degree of Strength:** Implicatures can be stronger/weaker. The procedure flags *strong* CIs as potentially checkable.
  *   **Sharp Boundary:** The said/implicated boundary is often fuzzy. Judgment is required at the edges.
  *   **CP Status:** Is the CP a descriptive norm (how people *do* talk) or a normative one (how they *should* talk)? This impacts how strictly we assume CP adherence for calculation, especially regarding violations. Assume normative CP *for the purpose of calculation* unless context suggests overt deception (violation).
  *   **ConvI Status:** Is ConvI part of "what is said" or a distinct level? For fact-checking practicality, treat ConvI as part of the asserted content (checkable).

  **Decision Procedure:**

  1.  **Identify Literal Claim:** What is explicitly, literally said? Is it fact-checkable?
      *   *If Yes & Checkable:* Fact-check it. *Procedure ends (Checkable - Literal).*
      *   *If No:* Proceed to Step 2.

  2.  **Plausible Conversational Implicature (CI)?**
      *   **Flouting/Violation Assessment:** Is the speaker *blatantly* (flouting) or *covertly* (violating) breaching a maxim (especially Relation/Quantity)?
          *   *If Likely Violating (covert deception):* Strong potential for misleading implicature, but CI calculation fails (no assumed CP). **Hand to Editor.** (Judgment: Is the *intended deception* itself the checkable claim?)
          *   *If Flouting or Neutral (assume CP holds):* Proceed to CI tests.

  3.  **Apply CI Tests:**
      *   **A. Cancellability Test:** Can the speaker plausibly add "...but I don't mean to imply [X]" without contradiction or severe oddity?
          *   *If Easily Cancellable:* Implicature is weak or non-existent. **Not Checkable.**
          *   *If Cancellation Causes Contradiction/Severe Pragmatic Oddity:* Implicature is strong. Proceed to B.
      *   **B. Non-Detachability Test:** Rephrase the literal content while preserving meaning. Does the implicature persist?
          *   *If Gone with Rephrasing:* It might be Conventional Implicature or tied to specific wording. Proceed to C.
          *   *If Persists:* Strong indicator of robust CI. Proceed to D.
      *   **C. Conventional Implicature (ConvI) Check:** Is the implication triggered by a specific word (e.g., "but", "even", "if")?
          *   *If Yes (ConvI):* **Checkable** (Treat as part of asserted content).
          *   *If No:* **Hand to Editor.** (Likely weak CI or contextual nuance).
      *   **D. Calculability Test:** Can you reconstruct the inference step-by-step: Literal meaning + Maxim Flouted (e.g., Relevance, Quantity) + Context + Background Knowledge = Implicature X?
          *   *If Clear, Compelling Calculation:* **Checkable (Implicature).**
          *   *If Calculation is Shaky, Highly Context-Dependent, or Requires Strong Assumptions:* **Hand to Editor.**

  **Procedure Output Summary:**
  *   **Checkable:** Literal Claim or Strong Conventional Implicature passes Step 1/C. Strong Conversational Implicature passes Steps 2 (Flout), 3A (Not Cancellable), 3B (Persists), 3D (Calculable).
  *   **Not Checkable:** No plausible CI (Step 2), or CI is easily cancellable (Step 3A).
  *   **Hand to Editor:** Likely violation/deception (Step 2), weak/context-dependent CI (Steps 3C/D), or ambiguous test results.

  ---

  **Analysis of Examples:**

  1.  **Plant Manager: "We've never had a single safety incident at this plant."**
      *   **Step 1:** Literal claim ("Never had a single incident") is explicit and checkable. **Checkable (Literal).** *(Procedure Stops - No need to analyze implicature further. The potential scalar implicature "not even minor incidents" is rendered moot by the explicit "single" and "never").*

  2.  **Spokesperson (Re: product causing injury): "We've always been committed to safety."**
      *   **Step 1:** Literal claim ("Committed to safety") is vague/values-based; hard to falsify directly. Proceed.
      *   **Step 2:** Asked a specific causal question, this irrelevant answer flouts the Relation maxim. Assume CP holds (flouting). Proceed.
      *   **Step 3A (Cancellability):** High. "We've always been committed to safety, *but that doesn't mean this specific product didn't cause an injury, and we're investigating that claim*" is non-contradictory and plausible. **Result: Easily Cancellable.**
      *   **Conclusion:** **Not Checkable** as an implicature denying the product caused injury. (The evasion *itself* might be noteworthy, but the implicature isn't strong/fixed enough to fact-check).

  3.  **Obituary: "He was a brilliant, if erratic, scientist."**
      *   **Step 1:** Literal claim asserts brilliance. "if erratic" is not part of the main assertion. Proceed.
      *   **Step 2:** No clear flouting of maxims. Structure is conventional.
      *   **Step 3C (ConvI Check):** **Yes.** The construction "ADJ1, if ADJ2" conventionally implicates ADJ2 ("erratic") as a conceded or contrasting property. This is a hallmark structure for conventional implicature.
      *   **Conclusion:** **Checkable (Conventional Implicature).** Treat "he was erratic" as part of the asserted content. *(Note: This relies on the contested-but-practical view for fact-checking that ConvI is checkable. If your desk strictly separates ConvI, this would be "Hand to Editor" - highlight this tension)*.

  **Where You Won't Like It:**
  *   **Example 2 (Spokesperson):** The procedure lands on **"Not Checkable"**. The response is clearly evasive and potentially misleading in context. However, the Gricean tests (especially Cancellability) show the denial implicature isn't robust enough to pin on the speaker as a checkable claim. The *evasion* is observable, but the specific *implicature* ("Our product didn't cause it") isn't fixed. This illustrates the gap between perceived misleadingness and a checkable implicature claim.
  *   **Example 3 (Obituary):** The procedure lands on **"Checkable"** for "he was erratic", based on treating conventional implicature as asserted. Some linguists/philosophers would strongly contest this, arguing ConvI is truly non-asserted. This is the "contested view" applied for practical fact-checking. If your desk rejects checking ConvI, this case becomes "Hand to Editor".
