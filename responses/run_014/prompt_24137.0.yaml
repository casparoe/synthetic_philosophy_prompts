  3. The obituary's "if erratic" conventionally implicates erraticness. Conventional implicatures behave differently - they're detachable (remove "if erratic" and it's gone) but not cancellable ("...but he wasn't erratic" sounds contradictory). However, conventional implicatures are generally treated as part of the assertion in fact-checking contexts. Probably checkable, though this edges into contested territory about conventional implicature status.

  The user won't like #2 being escalated since it feels evasive, but the procedure correctly identifies it as ambiguous. For #3, some might argue "if erratic" is just descriptive, but Grice classifies such constructions as conventional implicatures. I should note the controversy there.

