  The key tests are cancellability (can the implication be denied without contradiction?), non-detachability (does rewording kill the implication?), calculability (can it be inferred from context?), and non-conventionality (does it depend on literal meaning?). But I need to present these in a practical sequence for fact-checkers.

  Important to note where the literature has consensus versus disputes. For instance, most agree implicatures come in degrees and that the said/implicated boundary is fuzzy - that's why some cases will need editorial judgment. The cooperative principle's status (descriptive vs normative) is contested but doesn't affect this procedure much.

