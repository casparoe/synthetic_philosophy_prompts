prompt: |-
  I teach moral philosophy, and for the last three years I have served as faculty adviser to a student giving circle that allocates roughly $20,000 a year among charities working on global health, farmed-animal welfare, and disaster relief. Over that time the group has drifted, informally and without ever voting on it, toward a suffering-focused outlook: they weight the prevention of intense suffering far more heavily than the creation of happiness or the extension of painless lives, and several members are sympathetic to a broadly negative-utilitarian position. They have asked me to help them make this explicit — to turn a mood into a method — and I have concluded that I am the wrong person to do it, since my job in the room is to argue with them, not to systematize them. So I am outsourcing it.

  What I want from you is a decision procedure the group can actually run: a sequence of questions, applied to a shortlist of eight to twelve candidate organizations, that produces a ranking the group can then vote on, within the constraints of a single two-hour meeting each quarter. The members are intelligent undergraduates with no philosophical training, so the procedure must be executable without theory: each question should be one a student can answer from a charity's published material and one page of notes, and each should have a stated threshold at which the answer is sufficient, insufficient (charity deprioritized), or indeterminate (flagged for the final discussion). The conceptual work is in the translation, and I want you to be explicit about how you did it:

  1. Which distinctions internal to suffering-focused ethics must survive the simplification, and which you deliberately dropped. The candidates I see are: intensity versus duration of suffering; suffering that ends in death versus suffering that persists; preventing future suffering versus relieving present suffering; the suffering of presently existing beings versus beings who will exist only if the intervention succeeds or fails; and quick deaths that preempt suffering versus deaths preceded by it. Some of these can be collapsed; some cannot without distorting the position. Say which is which and why.

  2. At least one worked application in which the procedure yields a result the group will not like. My candidates, though you may choose others: ranking palliative analgesia for a small number of people in severe pain above preventing many quick deaths; or declining to fund a life-saving program because the deaths it averts are, by the available accounts, largely painless. Run the procedure on whichever case you pick, step by step, and show where the uncomfortable verdict is generated rather than stipulated.

  3. A guard-rail section. You will know, as I do, that strict negative utilitarianism is committed to views the group would find monstrous if stated plainly — that a world without suffering is preferable even if it contains no one, and that eliminating life could therefore be a solution. The procedure must never output anything that treats the elimination of capacity for suffering as a terminus rather than a tragedy, and I want you to say where the guard-rail is doing real work and where it is merely papering over a commitment the group has not examined.

  4. An honest accounting of where the procedure will misfire. In particular: the places where a numeric-looking step (weighting intensity against numbers of sufferers, trading chronic mild suffering against acute severe suffering) is a judgment call dressed up as arithmetic; the points at which reasonable suffering-focused theorists disagree with one another, so the procedure is choosing a convention, not applying the theory; and the point at which the group should stop and vote, because the remaining question is one of values that no procedure can settle.

  Finally, tell me what the procedure cannot do at all. I want a short closing statement of the indeterminacies in negative utilitarianism itself — how to compare aggregate against intensity, whether and how death is bad for the one who dies painlessly, whether small harms to many can ever outweigh agony in a few — such that any ranking produced under this heading is a convention the group has adopted, and should be presented to donors as such. If it works, the group gets a method it can defend; if it fails, I would rather it fail visibly, in the places you flag, than invisibly, in the arithmetic.
reasoning: |-
  Okay, the user teaches moral philosophy and advises a student giving circle that's shifted toward a suffering-focused approach. They need a practical decision procedure for ranking charities, tailored to undergrads with no philosophical training. The procedure must fit into a two-hour meeting quarterly, using only publicly available charity info and one-page notes. 

  First, unpacking the core challenges. The group has organically developed a negative-utilitarian leaning but needs systematization without theoretical baggage. Key tensions: how to handle death vs suffering trade-offs, future vs present suffering, and avoiding dystopian conclusions like valuing extinction. The user explicitly wants guardrails against those.

  Breaking down the four requested components:
  1. **Distillation choices**: Need to preserve intensity > duration, avoid equating death with suffering, and distinguish prevention/relief. Can collapse some temporal/existential distinctions for simplicity since charities rarely create new beings. Must explicitly reject "painless death as harm" to avoid extinction logic.
  2. **Uncomfortable application**: Choosing palliative care over life-saving interventions will showcase their priorities starkly. Example with a hospice vs. drowning prevention charity will force acknowledging that preventing brief agony outweighs many painless deaths.
  3. **Guardrails**: The "no extinction logic" rule must be hard-coded early. Also need to frame death as bad only when suffering precedes it, never intrinsically. This papers over NU's core problem but is necessary pragmatically.
  4. **Limitations transparency**: Must flag where pseudo-math masks value judgments—especially intensity-number trade-offs. The group must vote when hitting "suffering equivalency" questions since no procedure can resolve those philosophically.

  Biggest pitfall: The procedure will feel "off" when outcomes clash with human instincts (e.g., neglecting painless death prevention). That's not a bug—it's the group's stated values in action. The closing statement should emphasize that all rankings under NU are conventions, not truths, especially regarding aggregation puzzles. Donors deserve that honesty.

  Structure-wise: A flowchart-style Q&A works best. Start with suffering intensity filters, then scale/neglectedness before cost-effectiveness. Keep scoring minimal (pass/fail thresholds) to avoid false precision. Save hard trade-offs for final discussion after quantitative steps exhaust themselves.

  Guardrail placement is critical. Must appear in Q1 to prevent any "reducing populations" logic from entering. Also in Q4 to block deprioritizing suffering relief for death prevention. This is where the procedure diverges from pure NU to match the group's unexamined aversion to extinctionist conclusions.

  Final note: The worked example with hospice vs drowning prevention will disturb them. Good. It proves the method works by surfacing their implicit priorities. They'll either own it or rethink their framework—either outcome is valid.
answer: |-
  Here’s a decision procedure designed to translate the group’s suffering-focused intuitions into an actionable charity ranking system, constrained by your requirements. It includes explicit guardrails, acknowledges its limitations, and surfaces value judgments for group deliberation.

  ---

  ### **Suffering-Focused Charity Ranking Procedure**  
  *(For 8–12 charities; runtime: ≤2 hours)*

  **Materials per charity:**  
  - Published mission/impact reports (websites, annual reviews)  
  - One-page summary notes (prepared by students in advance)  

  **Procedure Flow:**  
  1. **Guardrail Check** (5 min total)  
  2. **Suffering Intensity Screen** (20 min)  
  3. **Suffering Scale & Tractability** (30 min)  
  4. **Neglectedness & Cost-Effectiveness** (30 min)  
  5. **Final Discussion & Vote** (35 min)  

  ---

  ### **Step-by-Step Questions & Thresholds**  
  *(Each charity assessed sequentially per question)*  

  #### **1. GUARDRAIL CHECK**  
  *Purpose: Prevent extinction logic; affirm life as instrumental good.*  
  **Q1:** *Does this charity reduce suffering **without** permanently eliminating the capacity for positive experiences (e.g., sterilization, human/animal extinction)?*  
  - ✅ **Sufficient:** Reduces suffering while preserving sentient life.  
  - 🚫 **Insufficient:** Reduces suffering primarily by preventing/existing beings. *Deprioritize immediately.*  
  - ⚠️ **Indeterminate:** Complex secondary effects. *Flag for final discussion.*  

  *Why this first?* Forces rejection of "painless extinction" as a solution. Papering over NU’s core tension, but necessary for alignment with group’s implicit values.  

  ---

  #### **2. SUFFERING INTENSITY SCREEN**  
  *Preserved distinctions: Intensity > Duration; Avoidable agony > Painless death.*  
  **Q2:** *Does the charity primarily prevent or relieve suffering that is **severe** (e.g., agony, trauma, extreme deprivation) rather than mild/moderate?*  
  - ✅ **Sufficient:** >70% of beneficiaries experience *severe* suffering (per charity descriptions).  
  - 🚫 **Insufficient:** Focuses on mild suffering or non-suffering harms (e.g., inconvenience, boredom). *Deprioritize.*  
  - ⚠️ **Indeterminate:** Mixed severity. *Proceed but note severity gap.*  

  **Q3:** *Does the charity prevent suffering that would otherwise be **protracted** (chronic pain, long-term trauma) or **acute** (short but extreme)?*  
  - *No threshold.* Answers inform final discussion.  

  *Collapsed distinctions:* "Suffering ending in death" vs. "persistent suffering" – both are bad if intense. "Future vs. present suffering" – both matter if preventable.  

  ---

  #### **3. SCALE & TRACTABILITY**  
  **Q4:** *How many beings experience **severe, avoidable** suffering addressed per $10,000?*  
  - ✅ **Sufficient:** Clear evidence of large-scale prevention/relief (e.g., >1,000 beings for animal welfare; >10 humans for hard-to-treat conditions).  
  - 🚫 **Insufficient:** Vague metrics or very small scale (e.g., <100 beings). *Deprioritize.*  
  - ⚠️ **Indeterminate:** Scale uncertain. *Flag.*  

  **Q5:** *Is the intervention **tractable**? (Evidence it works; suffering reduction is direct and likely.)*  
  - ✅ **Sufficient:** Strong independent evidence (e.g., RCTs for health interventions; documented welfare improvements).  
  - 🚫 **Insufficient:** Speculative or low-success-probability efforts. *Deprioritize.*  

  ---

  #### **4. NEGLECTEDNESS & COST-EFFECTIVENESS**  
  **Q6:** *Is this suffering **neglected**? (Few other groups address it; funding gaps exist.)*  
  - ✅ **Sufficient:** Charity explicitly works in underfunded area (e.g., parasite infections vs. well-funded cancers).  
  - ⚠️ **Indeterminate:** No data. *Note but proceed.*  

  **Q7:** *Cost per unit of suffering reduction (e.g., $/year of severe suffering prevented).*  
  - *Rank charities*: Assign tiers (High/Medium/Low effectiveness) based on published data.  

  ---

  #### **5. FINAL DISCUSSION & VOTING**  
  - Review flagged charities and severity gaps.  
  - Vote on ranked list using majority rule.  

  ---

  ### **Worked Example: Uncomfortable Verdict**  
  **Scenario:** *Palliative care charity (A) vs. Drowning prevention (B).*  
  - **A:** Provides morphine to 10 terminal cancer patients in agony.  
  - **B:** Prevents 100 quick, painless drownings via lifeguard training.  

  **Procedure Application:**  
  1. **Guardrail:** Both pass (neither eliminates sentient life).  
  2. **Intensity:**  
     - **A:** ✅ Targets *severe* suffering (agony).  
     - **B:** 🚫 **Insufficient** – Prevents painless deaths; no *suffering* addressed. *Deprioritized at Q2.*  
  3. **Scale/Tractability:** Only A proceeds.  
  4. **Result:** **A ranks above B.**  

  *Why uncomfortable?* Q2’s threshold ("severe suffering") excludes painless death prevention. The group’s suffering-focus overrides saving lives without suffering.  

  ---

  ### **Guardrails: Where They Work (and Don’t)**  
  - **Doing real work:** Q1 blocks charities promoting sterilization/extinction as suffering reduction.  
  - **Papering over:** Q1 avoids NU’s core issue: the group hasn’t grappled with *why* eliminating life is bad if it prevents suffering. This is values-avoidance.  

  ---

  ### **Where the Procedure Misfires**  
  1. **False quantification:** Q4/Q7 use crude scales. Weighing 1,000 chickens in mild distress vs. 1 human in torture is a *value judgment*, not math.  
  2. **Theory disagreements:**  
     - *Suffering aggregation:* Is preventing 1,000 mild headaches > 1 instance of torture? *Procedure defaults to intensity > scale.*  
     - *Death badness:* Is a painless death bad? *Procedure says no* (via Q2).  
  3. **Vote here:** After Step 4, when charities have similar intensity/scale scores. No procedure can resolve "is chronic anxiety worse than acute burns?"  

  ---

  ### **What the Procedure Cannot Do: Indeterminacies in NU**  
  **Closing Statement for Donors:**  
  > *"Our ranking reflects a commitment to reducing intense suffering above all else. It cannot resolve core philosophical indeterminacies:  
  > - Can a billion mild pains ever outweigh one instance of agony?  
  > - Is death inherently bad without suffering?  
  > - How far into the future must we weigh suffering prevention?  
  > We adopted conventions to make these questions actionable (e.g., intensity > scale; death is neutral without suffering). These are choices, not truths. Our method makes these visible when we vote."*  

  ---

  ### **Design Rationale**  
  **Preserved vs. Collapsed Distinctions:**  
  - **Kept:** Intensity > duration (Q2); suffering ≠ death (Q2/Guardrail); relief vs. prevention (Q4–5).  
  - **Collapsed:** "Quick death vs. protracted suffering" → both bad, but intensity drives ranking. "Future beings" → charities rarely create new beings, so omitted.  

  **Why This Works:**  
  - Executable with no theory: Uses accessible concepts ("severe suffering," "scale").  
  - Forces value debates where NU is ambiguous (final discussion/vote).  
  - Guardrails contain unexamined commitments without hiding them.  

  **Failure Visibility:** The procedure will "fail" (produce counterintuitive results) precisely where NU clashes with common sense (e.g., deprioritizing painless death prevention). This is a feature: it makes the group confront their priorities.  

  Let me know if you need the procedure formatted for handouts or a flowchart visualization.
