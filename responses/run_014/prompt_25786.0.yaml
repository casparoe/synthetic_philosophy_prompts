prompt: |-
  You are a PhD student in philosophy serving as a teaching assistant for an upper-division undergraduate course in contemporary ethical theory. The instructor has asked you to grade the following exam response. Below are the question and the student's answer.

  ---

  **Exam Question:**

  Susan Wolf, in her 1982 paper "Moral Saints," argues that moral sainthood is not an ideal to which we should all aspire. Reconstruct the central argument of the paper, making sure to (i) explain the distinction between the Loving Saint and the Rational Saint, (ii) clarify the role that non-moral values play in Wolf's critique, and (iii) identify what you take to be the most serious objection to her view and assess whether it succeeds.

  ---

  **Student's Answer:**

  Wolf's paper challenges the intuitive idea that being as morally good as possible is always desirable. Her central argument is that a moral saint—someone who is as morally good as can be—would have to be so single-mindedly devoted to moral concerns that they would lack the capacity to develop or appreciate non-moral goods, and that this makes moral sainthood an unattractive personal ideal.

  Wolf distinguishes two kinds of moral saint. The Loving Saint is someone who genuinely cares about others and acts from a sense of impartial benevolence; their own happiness simply coincides with promoting others' welfare. The Rational Saint, by contrast, does not naturally take joy in moral action but instead disciplines themselves to do the right thing out of a sense of duty, overriding their own inclinations for the sake of morality. Wolf's key move is to argue that both types are problematic, though for different reasons. The Loving Saint seems more appealing at first glance, but Wolf argues that even the Loving Saint's life is impoverished because their happiness is entirely parasitic on others' well-being—they have no independent sources of fulfillment. The Rational Saint is worse off still, since they are engaged in a constant struggle against their own desires, which makes their life one of perpetual self-denial.

  The role of non-moral values is central to Wolf's critique. She argues that a life worth living must make room for non-moral excellences and pursuits—things like artistic achievement, athletic skill, culinary appreciation, deep personal friendships, and intellectual curiosity pursued for its own sake. The moral saint cannot properly engage with these goods because moral considerations will always take priority. If a moral saint reads a novel, it must be to become more empathetic; if they play a sport, it must be to build character or serve others. The point is not that these non-moral goods are equally weighty as moral ones, but that a life without them is missing something important—something that makes a human life rich and admirable in a well-rounded way. Wolf therefore concludes that moral sainthood is not a rational ideal; a person can be perfectly wonderful without being a moral saint, and indeed a moral saint would fail to be wonderful in certain important respects.

  The most serious objection to Wolf's view comes from utilitarianism. A utilitarian might reply that Wolf has simply described the correct moral ideal and then complained that it is demanding. If morality really does require us to maximize aggregate well-being, then the fact that this ideal is personally unappealing does not count against it—morality is not in the business of making our lives attractive. Wolf anticipates something like this objection when she considers the "point of view of the universe" argument, and she responds that the impersonal standpoint is not the only standpoint from which to assess a human life. But I think this response is insufficient. The utilitarian can grant that there are other standpoints while maintaining that the moral standpoint is the one that matters when we are asking what we morally ought to do. Wolf's argument seems to show at most that moral sainthood is personally costly, not that it is morally optional. So while Wolf succeeds in making us feel the strangeness of the moral saint's life, she does not decisively refute the utilitarian claim that we are nonetheless obligated to approximate it.

  ---

  Please grade this answer. Provide a letter grade (on a standard A–F scale, with +/- permitted) and then give a point-by-point assessment: identify what the student gets right, flag any errors or imprecisions (however subtle), and explain how those errors affect the overall quality of the response. Your assessment should be detailed enough to justify the grade you assign.
reasoning: |-
  Okay, I need to grade this student's exam response on Susan Wolf's "Moral Saints" paper. The question asks for three main things: reconstructing Wolf's central argument, explaining the Loving Saint vs. Rational Saint distinction, clarifying non-moral values' role, and addressing a serious objection. 

  First, I'll check how well the student reconstructs Wolf's argument. They capture the core idea—that moral sainthood isn't ideal because it crowds out non-moral goods. That's accurate. They also correctly distinguish the two saints: Loving Saint (happy helping others) and Rational Saint (duty-driven, self-denying). Good start. 

  For non-moral values, the student nails it—explaining how saints can't pursue art/sports/friendships for their own sake. They even get Wolf's nuance: it's not about equal weight but about life's richness. No issues there. 

  Now the objection part. The student picks utilitarianism, which is a strong choice. They summarize the counterargument well: morality might demand sacrifice regardless of appeal. But... here's a problem. The student claims Wolf "does not decisively refute" utilitarianism, which misreads her. Wolf isn't trying to refute moral theories; she's questioning if sainthood should be a *personal ideal*. The student conflates "what we ought to do" with "what kind of person to admire/aspire to be." That's a significant oversight—it makes their critique of Wolf's response feel off-track. 

  Other minor issues: The student misses Wolf's point that Loving Saints lack "independent" fulfillment (they mention it but don't tie it to self-erasure). Also, they omit Wolf's worry about Loving Saints possibly lacking moral depth—but that's subtle, so maybe not penalizing. 

  Overall, the first 2/3 are excellent (A-range), but the objection analysis is flawed (C-range). Balancing it out: the error undermines their critique but doesn't ruin the whole response. A B+ feels right—strong comprehension with one major misstep.
answer: |-
  ### Grade: **B+**  

  #### Strengths of the Response:  
  1. **Accurate Reconstruction of Wolf's Central Argument**:  
     - The student correctly identifies Wolf’s thesis—that moral sainthood is unattractive because it precludes meaningful engagement with non-moral goods—and succinctly explains why this undermines it as a universal ideal.  
     - Key elements like the "impoverishment" of the saint’s life and the priority of morality crowding out other values are well captured.  

  2. **Clear Distinction Between Loving and Rational Saints**:  
     - The contrast between the **Loving Saint** (motivated by intrinsic joy in others' welfare) and the **Rational Saint** (driven by duty overriding personal inclinations) is accurately described.  
     - The student effectively highlights Wolf’s nuanced critique: the Loving Saint’s happiness is "parasitic" (a term Wolf uses), while the Rational Saint lives in "perpetual self-denial."  

  3. **Role of Non-Moral Values**:  
     - The explanation of non-moral values (art, friendship, intellectual curiosity) as essential to a "rich and admirable" life is precise.  
     - The student grasps Wolf’s key insight: Moral saints instrumentalize non-moral goods (e.g., reading novels *only* for empathy), stripping them of intrinsic value.  

  4. **Objection Selection and Setup**:  
     - Choosing utilitarianism as the "most serious objection" is apt and reflects common critiques of Wolf.  
     - The utilitarian counterargument—that morality’s demandingness doesn’t negate its obligatoriness—is fairly presented.  

  #### Weaknesses and Imprecisions:  
  1. **Misrepresentation of Wolf’s Response to Utilitarianism**:  
     - **Error**: The student claims Wolf merely "anticipates" the utilitarian objection from the "point of view of the universe" and offers an "insufficient" reply by appealing to non-moral standpoints.  
     - **Reality**: Wolf’s core rebuttal is deeper: She argues that utilitarianism *presupposes* a substantive view of the good life (e.g., hedonistic or preference-satisfaction) that *itself* includes non-moral values. If morality demands sacrificing all non-moral goods, it undermines the very well-being it seeks to promote, rendering the ideal self-defeating. The student misses this dialectical move.  
     - **Impact**: This oversight weakens the assessment of the objection. The student concludes Wolf only shows sainthood is "personally costly" rather than "morally optional," but Wolf’s actual argument challenges whether a utilitarian *can* coherently demand sainthood without contradicting its own foundations.  

  2. **Omission of Wolf’s "Independence" Critique**:  
     - **Imprecision**: The student notes the Loving Saint’s happiness is "parasitic on others’ well-being" but omits Wolf’s stronger point: The Loving Saint lacks a *self-conception* independent of others’ needs, eroding personal integrity. This deepens Wolf’s case against their "appeal."  

  3. **Underdeveloped Rational Saint Critique**:  
     - **Minor Gap**: The student doesn’t mention Wolf’s concern that the Rational Saint’s life may lack *meaning* because their actions aren’t integrated with their identity—they act morally "in spite of" themselves. This subtly enriches Wolf’s impoverishment argument.  

  #### Overall Assessment:  
  - The student excels in reconstructing Wolf’s framework (i–ii) with clarity and textual fidelity, justifying a high grade.  
  - The objection section (iii) is thoughtful but contains a significant misreading of Wolf’s rebuttal to utilitarianism. The student reduces her argument to a clash of "standpoints," missing her critique of utilitarianism’s *internal coherence*. This error prevents the response from achieving an "A."  
  - **Why B+?** The strengths outweigh the flaws: The core argument is well-organized, philosophically literate, and covers ~85% of the prompt accurately. The utilitarian objection is still *relevant* and reasonably analyzed, just not fully accurate in assessing Wolf’s reply. A sharper engagement with Wolf’s self-defeatingness argument would have secured an A.  

  #### Recommendations for Improvement:  
  - When assessing objections, carefully distinguish between *external* critiques (e.g., "morality doesn’t care about attractiveness") and *internal* critiques (e.g., "your theory contradicts its own goals"). Wolf uses the latter against utilitarianism.  
  - Always tether objections to the author’s explicit rebuttals, not just anticipated moves.
