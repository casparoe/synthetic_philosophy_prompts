    - When the attitude claim is embedded in a conditional, it isn't being expressed (you aren't booing when you say the conditional), but it seems to have the same content as when it's asserted.
    - The validity of arguments (like modus ponens) relies on the content being the same in both positions.

  - The facilitator notes that the game only shows the problem for a very naive expressivism (boo/hurrah). Sophisticated expressivisms (like Blackburn's quasi-realism) try to account for embeddings by appealing to higher-order attitudes or norms of conversation. The game doesn't refute those, but it sets up the challenge they must meet.

