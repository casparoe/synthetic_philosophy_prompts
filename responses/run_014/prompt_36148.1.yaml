  Now, after the event resolution, two tribes (or two members within a tribe) start arguing. One says: "But we all agreed that if we Boo! holding a feast, then we shouldn't hold a feast!" But they never wrote that policy because they couldn't. 

  The other says: "But we never agreed on that policy. We only agreed on Policy 1 and 2."

  Then the facilitator steps in and asks: "How could you have recorded that policy?"

  They realize they couldn't.

