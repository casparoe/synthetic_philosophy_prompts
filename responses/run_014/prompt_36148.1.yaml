  - The facilitator asks: 
    - In Phase 1, when you expressed attitudes, what were you doing? (expressing approval/disapproval)
    - In Phase 2, when you agreed on "If drought, then Boo! holding a feast", what was that? (a conditional expression of attitude)
    - In Phase 3, what happened when you wanted to say "If Boo! holding a feast, then don't hold a feast"? (you couldn't express it in the language)

