  **What the game cannot reproduce:**
  The game only shows the problem for a naive expressivist language. It doesn't engage with sophisticated expressivist accounts that use higher-order attitudes or conversational norms to explain embeddings. The facilitator must clarify that the game is about the challenge, not a final refutation.

  **Summary:**
  Split students into tribes to set policies using a restricted language (atomic attitudinal expressions + descriptive language), then reveal an event to apply policies, exposing the inability to embed attitudes in conditionals, leading to inconsistent actions and a dispute that mirrors Frege-Geach, which is then debriefed with the distinction between naive and sophisticated expressivism.
answer: |-
  Below is a comprehensive design for your seminar session. The game, **"Tribal Accord,"** forces students to confront the limitations of a naive expressivist language through a points-driven negotiation and policy-ratification exercise. The session is structured to organically generate the Frege–Geach problem without naming it until the debrief.

  ---

  ### **Materials, Group Setup, Rules, and Sequence**
  **Materials:**  
  - **Event Cards (12):** Descriptive scenarios (e.g., "River floods," "Harvest fails," "Stranger arrives").  
  - **Action Cards (12):** Concrete responses (e.g., "Share grain," "Build wall," "Banish stranger").  
  - **Policy Cards (9):** Pre-written conditionals for ratification (e.g., "If [event], then [action]").  
  - **Attitude Tokens (24):** Red "Boo!" tokens (disapproval) and green "Hurrah!" tokens (approval) for specific actions.  
  - **Resolution Dice (1d6):** Randomly determines which event occurs after policies are set.  
  - **Scoreboard:** Tracks points (1 point = 1 "survival resource").  

  **Group Setup:**  
  - **3 tribes of 4 students each** (e.g., "River," "Mountain," "Forest" tribes).  
  - Each tribe has:  
    - A **"Speaker"** (negotiates with other tribes).  
    - A **"Scribe"** (records policies using the allowed language).  
    - A **"Resolver"** (enforces policies after events).  
    - A **"Skeptic"** (challenges interpretations during disputes).  
  - **Language Rules:**  
    - **Descriptive Vocabulary:** Can be used freely (events, actions, logical operators: "if," "not," "or").  
    - **Attitudinal Vocabulary:** Restricted to atomic expressions only (e.g., "Boo! [action]" or "Hurrah! [action]"). Embedding attitudes (e.g., "If [event], then Boo! [action]") is **explicitly banned**.  
    - **Smuggling Penalty:** -5 points for using attitudinal terms in compound statements.  

  **Phase Sequence and Payoff Scheme:**  
  **Phase 1: Atomic Attitudes (20 mins)**  
  - **Goal:** Ratify standalone attitudes toward actions.  
  - **Procedure:**  
    - Each tribe draws 1 event card (e.g., "Stranger arrives") and 3 action cards (e.g., "Banish stranger," "Offer shelter," "Ask for help").  
    - Tribes **express attitudes** using tokens (e.g., "Boo! Banish stranger," "Hurrah! Offer shelter").  
    - Must achieve consensus within the tribe.  
  - **Points:** +2 points per unanimous attitude. *Embeddings unnecessary here.*  

  **Phase 2: Policy Ratification Under Uncertainty (25 mins)**  
  - **Goal:** Ratify conditional policies *requiring embeddings*, but the language blocks them.  
  - **Procedure:**  
    - Each tribe draws 3 policy cards:  
      1. **Descriptive-Descriptive** (e.g., "If harvest fails, then share grain").  
      2. **Descriptive-Attitudinal** (e.g., "If river floods, then Boo! build wall").  
      3. **Attitudinal-Descriptive** (e.g., "If Boo! banish stranger, then offer shelter").  
    - Tribes negotiate policies *across tribes* (e.g., River Tribe must ratify policies with Mountain Tribe).  
    - Scribes record agreements *strictly* using allowed language.  
  - **Points:**  
    - +5 points per ratified policy.  
    - **Embeddings become necessary:** To earn points, tribes must embed attitudes (e.g., "If river floods, then Boo! build wall"), but the language forbids it. Tribes will try and fail, forcing improvisation.  
    - *Without embeddings, they lose the points and face penalties in Phase 3.*  

  **Phase 3: Event Resolution and Dispute (30 mins)**  
  - **Goal:** Trigger a disagreement about a conditional despite atomic agreement.  
  - **Procedure:**  
    1. **Event Roll:** Facilitator rolls the die to reveal an event (e.g., "Stranger arrives").  
    2. **Policy Execution:** Tribes execute ratified policies:  
       - Follow descriptive policies (e.g., "If stranger arrives, then ask for help").  
       - Express attitudes (e.g., "Boo! banish stranger").  
    3. **Dispute Scenario:**  
       - Facilitator reveals a pre-loaded **unresolvable conditional**: "If Boo! banish stranger, then offer shelter."  
       - Two tribes that agreed on *atomic* attitudes (e.g., both said "Boo! banish stranger") disagree on this conditional.  
       - Skeptics argue over whether it was ratified (it couldn’t be recorded).  
  - **Points:**  
    - +10 points for correctly following *recorded* policies.  
    - **-10 points for inconsistency** (e.g., expressing "Boo! banish stranger" but banishing anyway).  
    - **Embeddings are unavoidable:** Points loss exposes that unembeddable attitudes cause real-world failures.  

  ---

  ### **Critical Moments: When the Language Fails**  
  - **Phase 2, Minute 15:** Tribes hit a wall with **Descriptive-Attitudinal policies** (e.g., "If river floods, then Boo! build wall"). Scribes cannot write it without embedding. Tribes may try to "cheat" with descriptive proxies (e.g., "If river floods, then we dislike building walls"), triggering a penalty.  
  - **Phase 2, Minute 20:** **Attitudinal-Descriptive policies** (e.g., "If Boo! banish stranger, then offer shelter") cause gridlock. Speakers realize they can’t reference attitudes in antecedents, leading to rushed, vague agreements.  
  - **Phase 3, Minute 50:** The **dispute** erupts when two tribes with identical atomic attitudes clash over the conditional. The Resolver cannot appeal to a recorded policy, proving that attitudes lack stable content when embedded.  

  ---

  ### **Debrief: Mapping to Frege–Geach (15 mins)**  
  - **Step 1:** Ask students to recount frustrations:  
    - *Phase 1:* "How did expressing atomic attitudes feel?" → **Asserted claims** (booing works).  
    - *Phase 2:* "Why couldn’t you agree on conditionals?" → **Embedded claims** (booing isn’t happening, but meaning must be preserved).  
    - *Phase 3:* "Why did agreeing on ‘Boo! X’ not settle the conditional?" → **Modus ponens fails** without stable content across positions.  
  - **Step 2:** Reveal the problem:  
    - "You encountered the **Frege–Geach problem**: Expressivism struggles when attitudes move from asserted to embedded positions. Conditionals like ‘If lying is wrong...’ require the *same content* when unasserted, but attitudes vanish when not actively expressed."  
    - "The expressivist owes an account of how an attitude-conditional (e.g., ‘If lying is wrong, then...’) expresses a *higher-order attitude* (e.g., disapproval of combining lying-approval with inconsistency)."  
  - **Step 3:** Contrast naive vs. sophisticated expressivism:  
    - "The game exposed **naive expressivism** (boo/hurrah). But **sophisticated expressivists** (e.g., Blackburn) use attitudes toward attitudes or conversational norms to rescue embeddings. The game doesn’t refute *them*—it sets the challenge they must solve."  

  ---

  ### **Predictable Problems and Solutions**  
  1. **Smuggling Descriptive Language:**  
     - *Problem:* Students say, "If river floods, then we *feel* Boo! build wall" to fake embeddings.  
     - *Solution:* Enforce penalties immediately. Ask: "Is ‘feel Boo!’ in your vocabulary? -5 points." Highlight this as a real expressivist temptation.  

  2. **Phase 2 Collapsing into Negotiation:**  
     - *Problem:* Tribes ignore attitudes and barter (e.g., "We’ll approve your policy if you approve ours").  
     - *Solution:* Force attitudinal policies. If omitted, Phase 3 point losses make the cost obvious.  

  3. **Dispute Stage Running Long:**  
     - *Problem:* Tribes renegotiate during Phase 3.  
     - *Solution:* Use a timer. After 5 mins, roll the event die to force action. Award inconsistency penalties to show real stakes.  

  ---

  ### **What the Game Cannot Reproduce**  
  The game **cannot engage sophisticated expressivist machinery**. It targets *naive* expressivism (attitudes as raw boos), but real expressivists (e.g., Blackburn, Gibbard) use complex resources like:  
  - **Higher-order attitudes** (e.g., disapproving of approving lying).  
  - **Conventional implicatures** (e.g., moral claims create expectations for future attitudes).  
  - **Norms of conversational commitment** (e.g., asserting "Lying is wrong" obliges you to disapprove of lying in all contexts).  
  **Why this matters:** If presented as a verdict on expressivism *itself*, the game would be a strawman. Sophisticated expressivism treats moral language as a *practice* guiding attitudes, not just atomic eruptions. The facilitator must clarify: "The game shows *why* expressivists need these tools—not that they can’t work."  

  ---

  **Summary:** Students in tribes use a restricted language (atomic attitudes + descriptive terms) to negotiate policies and survive randomized events, facing point losses when unable to embed attitudes in conditionals, thus organically generating the Frege–Geach problem before debriefing its implications for naive versus sophisticated expressivism.
