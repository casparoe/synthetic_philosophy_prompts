answer: |-
  Here’s a rigorous case analysis of the 2016 Brexit referendum through the lens of the boundary problem, structured to address your core questions:

  ### I. Mapping Principles to Practice: How Democratic Theories Would Have Reshaped the Franchise
  *(Standard principles applied to Brexit's unique context)*

  1. **All-Affected Interests Principle**:  
     - **Theoretical Electorate**: Would include:  
       - All EU citizens resident in the UK (directly losing rights);  
       - UK citizens resident in the EU (facing legal limbo);  
       - Citizens of Ireland (due to the open border);  
       - Gibraltar residents (included in reality, but logically extends further);  
       - Potentially all EU member states (given single market impacts).  
     - **Deviation from Reality**: Excludes ~3 million EU citizens in the UK while including Commonwealth citizens with no material stake. Scale becomes unworkable (e.g., Polish factory workers affected by UK tariffs vote, but not Estonian pensioners?).

  2. **All-Subjected to the Laws Principle**:  
     - **Theoretical Electorate**: Focuses on those bound by the *result's* laws.  
       - EU citizens in the UK *were* subjected to post-Brexit immigration laws but excluded;  
       - UK citizens in Spain *remained* subjected to UK laws (could vote);  
       - The Latvian nurse (subjected but excluded) vs. Australian student (not subjected but included) exposes **categorical incoherence**: Subjection depended on citizenship, not residency.  
     - **Key Tension**: The referendum *itself* altered who would be subjected—creating a circular problem.

  3. **Stakeholder Principle** (Membership in the community):  
     - **Theoretical Electorate**: Prioritizes long-term embeddedness.  
       - Would include the Latvian nurse (10-year resident), exclude the Australian student (transient);  
       - Might exclude British retirees abroad after 10+ years (detached from daily consequences);  
       - Include 16-year-olds (lifelong stakeholders).  
     - **Reality Check**: Directly challenges the Westminster model’s citizenship fetishism.

  4. **Competence/Duration Thresholds**:  
     - **Theoretical Electorate**: If using age 16 (voting in Scottish elections) or residency duration (e.g., 5+ years), would:  
       - Enfranchise ~1.5 million 16-17-year-olds;  
       - Disenfranchise transient residents;  
       - Possibly exclude citizens abroad for >5 years.  
     - **Contradiction**: "Competence" arguments were absent—despite the vote’s complexity.

  **Summary of Mapping**: No principle aligns with the actual franchise. "All-affected" is impossibly expansive, "all-subjected" is circular, "stakeholder" challenges citizenship norms, and competence/duration were ignored. The actual rules appear arbitrary against all theories.

  ---

  ### II. Reverse Analysis: What the Referendum Reveals About Democratic Theory
  *(Working backward from the franchise to theory)*

  1. **The "Administrative Default" Hypothesis**:  
     - **Evidence**: Franchise mirrored parliamentary elections (Representation of the People Act 1983). No parliamentary debate about boundary principles occurred.  
     - **Implication**: **Boundary questions are submerged by procedural inertia**. The state used existing machinery to avoid hard questions about the demos—confirming your professor’s claim.

  2. **A Principled Defense? Citizenship as Proxy**:  
     - **Plausible Argument**: The UK defined the demos as *the sovereign people*, aligning with Westphalian statehood. Gibraltar’s inclusion (as a British Overseas Territory) reinforces this.  
     - **Fatal Flaws**:  
       - Citizenship ≠ stake (e.g., non-resident voters);  
       - Denies moral weight to non-citizen residents;  
       - Ignores that the vote *itself* redefined citizenship (ending EU freedom of movement).  
     - **Theoretical Verdict**: Defensible only under **statist positivism** ("the demos is whoever the state says it is"), which democratic theorists reject as circular.

  3. **Does Brexit Prove the Boundary Problem Insoluble?**  
     - **Yes, in practice**: The state avoided the question entirely, and no major faction advocated principled reform. The EU’s structure (emphasizing state sovereignty) made cross-border enfranchisement politically impossible.  
     - **But not in principle**: The referendum *could* have used residency-based rules (as in Scottish/Local elections) or included EU residents (as in EU Parliament votes). **Political will**, not logical impossibility, was the barrier.

  4. **Critical Silences Exposed**:  
     - **Future Generations**: 16-year-olds (excluded) will live with Brexit for 70+ years. No major theory adequately addresses intergenerational demos boundaries.  
     - **Northern Ireland**: The Good Friday Agreement (GFA) assumed shared EU membership. Residents were subjected to a vote that destabilized the GFA’s foundations—yet **no theory accounts for "constitutive communities"** whose existence is reshaped by decisions.  
     - **The "Demos-in-Doubt" Paradox**: Brexit’s outcome *redefined* the very community voting on it (via immigration/sovereignty changes). Theories assume a stable demos *preceding* the vote—a flaw exposed here.

  ---

  ### Conclusion: Theoretical Implications
  - **Boundary problems are actively suppressed** in high-stakes votes to avoid complexity (as your professor noted). Brexit proves administrative convenience dominates principle.  
  - **Citizenship is a poor proxy for stake**: The franchise anomalies (Latvian nurse vs. Australian student) reveal the bankruptcy of uncritical statism.  
  - **Key Theoretical Gap**: Democratic theory lacks tools for votes that *reconstitute the polity itself*. When the decision alters who "the people" are, standard principles collapse into circularity.  
  - **Not Unresolvable, But Politically Fraught**: Residency-based franchises exist (e.g., local elections), proving alternatives are viable. Brexit shows the *cost* of ignoring the boundary problem: **legitimacy deficits** for affected but excluded groups.  

  **Recommendation for Your Paper**: Frame Brexit as a "boundary stress test." Highlight how it exposed 1) the silence on constitutive change, 2) the vulnerability of non-citizen residents, and 3) theory’s practical irrelevance when states default to administrative expediency. Avoid overgeneralizing—but note this case exemplifies why boundary issues resurface in movements (e.g., Scottish independence, Puerto Rico status votes).
