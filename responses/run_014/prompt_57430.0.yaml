prompt: |-
  You are an expert on Dennett's philosophy of mind who also builds live simulations for undergraduate seminars. I have 18 upper-level cognitive science students and 80 minutes, and I want an activity on his four kinds of creatures — the Darwinian, Skinnerian, Popperian, and Gregorian rungs — in which the students run into the differences themselves rather than hear them described.

  Work with the following skeleton, though you may revise it: four rounds, each adding one capacity to a group facing the same survival task — a fixed behavioral repertoire; feedback from their own chosen actions; the ability to test candidate moves against a paper model of the environment before committing; and finally a shared notebook of strategies written by earlier groups and carried forward across rounds. Scoring is in points, not money, and should make the differences in outcomes visible round by round. The wrinkle I care about most is that I refuse to let the ladder come across as monotone progress. Build in an environmental shift late in the session such that a group leaning on inherited notebook entries does worse than a group still testing its own hypotheses, so students feel that the Gregorian advantage is contingent on the corrigibility of the external scaffolding rather than guaranteed by having it.

  Deliver the rules and materials, the scoring scheme, a minute-by-minute timeline, a debrief mapping specific moments of play onto each rung, an honest account of what will predictably go wrong the first time I run it, and which feature of the distinction no tabletop version can reproduce and I must supply by talking.

  Think first: spend a couple of sentences on the designs you considered and rejected and why. Hard cap of 750 words. If you judge the task can't be done well as posed — because these are claims about internal architecture that no card-and-notebook game will let undergraduates feel rather than be told, or because my late-session twist distorts the view it's meant to illuminate — say so plainly at the top and give me the nearest achievable version, rather than politely writing something that looks runnable and isn't.
