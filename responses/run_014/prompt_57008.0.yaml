  But we don't expect the students to know this? We want them to predict without knowing the theory? They can run a few trials? We can allow 5 minutes for building and a few trials. Then they predict p based on a small sample? But with 5 trials, the sample might be off. We want them to commit to a p that they believe is the true probability for their device. We don't mind if they are wrong because of sampling variation? The main point is that the three groups have different true probabilities and they will observe different frequencies.

  So we tell them: "Based on your understanding of the device and a few test runs, write down your predicted probability p (to the nearest 10%) that a chord is long."

  Then they write p in {0.0,0.1,...,1.0}.

  Then they also choose U, N, or I for the universality.

  Then they run 20 trials.

  **Timeline (75 minutes):**

  0-5 min: Introduction to the activity and the story. Divide into three groups.

  5-15 min: Each group builds their device and tests it with a few trials. They also get the instructions and materials.

  15-25 min: Each group must write down:
     - Their predicted probability p (to the nearest 10%).
     - Their choice for universality: U (the probability is the same for all machines), N (not the same), or I (the question is ill-posed and we cannot assign a unique probability).

     And they must do this without seeing the other groups' devices or data.

  25-45 min: Each group runs 20 valid trials and records the number of long chords. They compute the frequency f.

  45-50 min: Collect the data from all groups and write on the board:
     - Group 1: p1, f1, and their universality choice.
     - Group 2: p2, f2, and their universality choice.
     - Group 3: p3, f3, and their universality choice.

  50-60 min: Scoring:
     - For each group, base score = 10 - 10 * |p - f| (rounded to nearest integer, and capped at 0 if negative).
     - Then adjust for universality:
          - If U: +5 if the max difference between the f's is <=0.15, else -5.
          - If N: +5 if the max difference between the f's >0.15, else -5.
          - If I: -2.

     Then total tokens = base score + universality adjustment.

     Then rank the groups by tokens.

  60-75 min: Debrief.

  **Debrief:**

  Tie particular moments to:

  1. The three classical answers:
     - Group 1 (Endpoint) should have a frequency around 1/3.
     - Group 2 (Radius) should have a frequency around 1/2.
     - Group 3 (Midpoint) should have a frequency around 1/4.

     Point out that each group was using a different generating process, and that led to different probabilities.

  2. The ill-posedness response:
     - A group that chose I (ill-posed) avoided the risk of the universality bet by paying 2 tokens. They might have argued that without a clear definition of "random chord", the probability is not defined.

  3. The invariance response:
     - If a group had chosen U, they might have assumed that the probability is the same regardless of the machine because they thought "random chord" is uniquely defined. But the data shows it's not.

  4. The generating-process response:
     - The activity demonstrates that the probability of an event (a long chord) depends on the process by which the chord is generated.

  **What will break on a first run?**

  - The devices might not work perfectly: 
     - The endpoint spinner might not be perfectly uniform.
     - The discrete approximations (100 points) might not be continuous, so the observed frequencies might not be exactly 1/3, 1/2, 1/4. For example, Group 1: with 20 trials, the frequency might be 7/20=0.35 (close to 1/3≈0.333) or 6/20=0.3. Group 2: 10/20=0.5. Group 3: 5/20=0.25. But with 20 trials, there is sampling variation. We need to hope that they are close enough. The max difference between the f's should be large enough: 0.5-0.25=0.25>0.15, so the universality condition fails.

  - Group 3 may take longer because of rejections. They might not complete 20 trials in the time. We can adjust: have them do 20 trials including the rejections? But then they have fewer valid trials. We can have them do 20 valid trials, but we extend the time? Or we can adjust the activity: let them do 15 trials? But then the frequencies are more variable. Alternatively, we can pre-calculate: they need about 20/0.785≈25.5 trials on average to get 20 inside. We can have them do 25 trials? But time is tight.

  - The measurement of the chord length might be inaccurate, especially for Group 1 and Group 2 if they are drawing and measuring. For Group 1, they might measure the chord length and get values near the threshold 17.32, and there might be disputes. We can have them use a caliper? But we don't have that. Alternatively, we can have a template: a chord of length 17.32 cm to compare? Or we can have them compute using the known formulas? But we wanted to avoid that. For Group 1, they can compute the angular separation and then the chord length? But we didn't want to force trig. Alternatively, we can change the threshold condition to something easier to measure? But the condition is intrinsically tied to the circle.

  **What the activity cannot deliver:**

  - The activity does not prove that there are no other methods or that these are the only three. It only shows that three natural methods give different results.

  - The activity does not deeply explain why the three methods are different. That requires a lecture on the parameter spaces.

  **Which lesson is secured?**

  The design secures that **a probability claim is incomplete without a specified generating process**. The groups thought they were answering the same question, but the generating process mattered.

  To teach the other lesson (that indifference is relative to a parameterisation), we would have to show that the same underlying ignorance (uniform distribution) was applied to different parameterizations (angle, radius, area) leading to different probabilities. In the room, we would need to see a group explicitly note that they are assuming uniformity over a particular variable and that another group's uniformity over a different variable leads to a different result. This might come up in the debrief, but the design does not force it.

  The weakest part of the design is the physical implementation of the devices, which might not perfectly represent the continuous uniform distributions due to discretization and measurement errors. This might muddy the point.

  **Verdict: process**
answer: |-
  ### Bertrand's Paradox Activity: "Circular Components Factory Inspection"

  **Framing Story:**  
  You are quality control inspectors at the Circular Components factory, which produces circular washers. Each washer has an outer circle (radius 10 cm) and must have an inner hole defined by a straight chord across the outer circle. The chord is "acceptable" if its length exceeds 17.32 cm (the side length of an equilateral triangle inscribed in the circle). Three different machines (A, B, C) produce these chords "at random," but the factory manager insists they all answer the same question: "What is the probability a random chord is acceptable?" Your team will build one machine, predict this probability, and wager tokens on your prediction and on whether all machines produce the same probability. If you suspect the question is ill-posed (no unique answer), you may decline the universality wager at a cost.

  ---

  ### Materials List (per group of 8–9 students; 3 groups total)
  - **All groups**: 
    - Cardboard circle (radius 10 cm) with marked center.
    - Ruler (marked in cm and mm).
    - Pencil, string (30 cm), pins, paper clips.
    - 10 integer tokens (e.g., poker chips) per group.
  - **Group A (Endpoint Method)**: 
    - Protractor (cardboard or plastic, 0–360°).
    - Two circular spinners: Paper plate with a paper clip pointer secured by a pin at the center. Plate edge marked every 10° (0–360°).
  - **Group B (Radius Method)**:
    - Two ten-sided dice (or a bag with 100 tokens numbered 00–99).
    - Straight cardboard strip (15 cm) with a pin at one end (to serve as a rotatable radius arm).
  - **Group C (Midpoint Method)**:
    - Two ten-sided dice (or a bag with 100 tokens numbered 00–99).
    - Square cardboard grid (20 cm × 20 cm) with x/y axes centered on the circle (axes from -10 to 10 cm).

  ---

  ### Device-Specific Instructions  
  *Each group builds their machine in 5 minutes, then runs 20 valid trials.*

  **Group A: Endpoint Method (Classical "Random Endpoints")**  
  1. **Build**: Attach a string to the circle’s center. Use the protractor to mark angles on the circumference.  
  2. **Generate a chord**: Spin each spinner once to get angles θ₁ and θ₂. Mark points at these angles on the circumference. Stretch string between them to form the chord.  
  3. **Measure**: Use the ruler to measure chord length. Record "acceptable" if >17.32 cm.  
  4. **Run 20 trials**.

  **Group B: Radius Method (Classical "Random Radius and Point")**  
  1. **Build**: Pin the cardboard strip at the circle’s center to make a rotatable radius arm.  
  2. **Generate a chord**:  
     - Spin the radius arm to random angle θ.  
     - Roll dice to get number n (00–99). Compute distance from center: \( d = (n / 99) \times 10 \) cm. Mark this point on the radius.  
     - Draw the chord perpendicular to the radius at this point (use string and set square from paper clips).  
  3. **Measure**: Chord length >17.32 cm? Record "acceptable."  
  4. **Run 20 trials**.

  **Group C: Midpoint Method (Classical "Random Midpoint")**  
  1. **Build**: Place the circle within the square grid (center at (0,0)).  
  2. **Generate a chord**:  
     - Roll dice for a (x-coordinate): compute \( x = 20 \times (a / 99) - 10 \) cm.  
     - Roll dice for b (y-coordinate): compute \( y = 20 \times (b / 99) - 10 \) cm.  
     - If \( x^2 + y^2 > 100 \), skip (point outside circle; retry).  
     - Else, mark point (x,y) as the midpoint. The chord is perpendicular to the line from center to (x,y).  
  3. **Measure**: Compute distance from center: \( d = \sqrt{x^2 + y^2} \). Record "acceptable" if d < 5 cm (equivalent to chord >17.32 cm).  
  4. **Run 20 trials** (only count points inside the circle).

  ---

  ### Scoring Rule  
  - **Initial tokens**: Each group starts with 10 tokens.  
  - **Commitment phase (before trials)**:  
    - Predict probability (p): "Based on your machine, what is p(acceptable)?" Write p to nearest 0.1 (e.g., 0.3, 0.5).  
    - Universality claim (choose one):  
      - **U (Universal)**: "All machines have the same p."  
      - **N (Not universal)**: "Machines have different p."  
      - **I (Ill-posed)**: "The question has no unique answer."  
  - **Token backing**:  
    - No upfront tokens for p (scored after trials).  
    - **U or N**: Must stake 5 tokens on this claim.  
    - **I**: Pay 3 tokens to opt out of universality wager (no stake, no win).  
  - **Scoring after trials**:  
    - **Prediction score**: \( \text{tokens} = 10 - 10 \times |p - f| \) (f = observed fraction acceptable in 20 trials; rounded to integer).  
    - **Universality score**:  
      - **U**: +5 tokens if all groups’ f-values differ by ≤0.15; else -5.  
      - **N**: +5 tokens if any groups’ f-values differ by >0.15; else -5.  
      - **I**: No change (already paid 3 tokens).  
  - **Total tokens**: Sum of prediction and universality scores.  
  - **Key incentive**:  
    - Confidently wrong (e.g., U when f-values differ) costs up to 15 tokens (10 - 10*error -5). Sitting out (I) costs 3 tokens but avoids risk.  
    - Sharp groups profit from I only if they avoid a loss (e.g., U would have lost 5 tokens). With true f-values ~0.25, 0.33, 0.50, differences exceed 0.15, so I costs less than a wrong U/N.

  ---

  ### Minute-by-Minute Timeline  
  - **0–5 min**: Introduce activity. Divide into three groups. Assign machines: A (Endpoint), B (Radius), C (Midpoint).  
  - **5–15 min**: Groups build devices (using materials). Instructor verifies setups. Groups run 2–3 test trials.  
  - **15–20 min**: **Commitment phase**. Groups:  
    - Write down p (predicted p(acceptable)) to nearest 0.1.  
    - Choose and record universality claim (U, N, or I).  
    - Stake tokens if applicable (U/N: 5 tokens set aside; I: hand 3 tokens to instructor).  
  - **20–40 min**: **Trials phase**. Groups run 20 valid trials, record number of acceptable chords (f = count/20).  
  - **40–45 min**: **Data collection**. Instructor compiles:  
    - Group A: p_A, f_A, claim_A.  
    - Group B: p_B, f_B, claim_B.  
    - Group C: p_C, f_C, claim_C.  
    Write all on board.  
  - **45–50 min**: **Scoring**. Groups compute:  
    - Prediction score: \( 10 - 10 \times |p - f| \) (round to integer).  
    - Universality score: Apply U/N/I rule using pooled f-values.  
    Announce token totals.  
  - **50–75 min**: **Debrief** (structure below).

  ---

  ### Debrief: Linking Activity to Concepts  
  - **Classical trio of chord-generating devices**:  
    - "Group A built the classical 'random endpoints' device (Bertrand’s first method). You generated two uniform points on the circle. Your f_A should be ~1/3."  
    - "Group B built 'random radius and point' (second method). You chose a uniform point along a random radius. Your f_B should be ~1/2."  
    - "Group C built 'random midpoint' (third method). You chose a uniform point in the disk. Your f_C should be ~1/4."  
    *(Point to board data; differences should be visible.)*  
  - **Ill-posedness response**:  
    - "Any group choosing I argued the question lacks a unique answer without specifying the machine. You paid 3 tokens to avoid the universality wager. Did this save you? Since f-values differ, U would have lost 5 tokens—so I was cheaper."  
  - **Invariance response**:  
    - "Groups choosing U assumed 'random chord' is uniquely defined. But the data shows different machines give different results. Why? Because 'uniform' depends on the variable—angles, radial distance, or area."  
  - **Generating-process response**:  
    - "When Group C skipped points outside the circle, or Group B drew perpendicular chords, you defined the process. The probability isn't about chords alone—it's about how you generate them."  
  - **Reveal the paradox**:  
    - "What you built are Bertrand’s three devices. The 'single question' (probability of a long chord) has three answers. The disagreement isn’t arithmetic—it’s about what 'random' means."

  ---

  ### Predictable Issues and Limitations  
  - **What will break**:  
    - **Physical errors**: String/ruler measurements for Groups A/B may misclassify chords near 17.32 cm, muddying f-values. Group C’s rejection sampling (≈25% skips) may cause delays.  
    - **Sampling noise**: With 20 trials, f-values may not perfectly match 1/3, 1/2, 1/4 (e.g., f_A=0.35 vs. 0.33). Differences may still exceed 0.15, but if not (e.g., all f ~0.3–0.4), the paradox is less sharp.  
    - **Group C’s computation**: Students may struggle with \( x^2 + y^2 \leq 100 \) checks; pre-calculate a lookup table for dice rolls.  
  - **Structural limitations**:  
    - Cannot show continuous vs. discrete effects (100 dice tokens approximate uniformity but aren’t perfect).  
    - Cannot prove why only three methods—requires lecture on parameterization invariance.  
    - I-option may let sharp groups "exit" early, but the 3-token cost ensures they feel the trade-off (safe but penalized).

  ---

  ### Secured Lesson and Weaknesses  
  - **Secured lesson**: **Process**. The design forces students to see that "a probability claim is incomplete without a specified generating process." Evidence:  
    - Groups commit to devices before knowing others’ methods.  
    - Pooled data shows incompatible f-values for "the same" question.  
    - U/N wager penalizes groups that ignore process differences.  
  - **To teach parameterisation**: You’d need a group to explicitly debate uniformity in angles (A) vs. radial distance (B) vs. area (C) during trials or commitment. If a student says, "But we used uniform angles, while they used uniform area—that’s why our p differs," the lesson shifts.  
  - **Weakest design point**: The I-option and token costs may overshadow the parameterization insight. Students focus on "winning tokens" rather than why indifference is relative.  

  **Verdict: process**
