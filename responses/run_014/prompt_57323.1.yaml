                  Option A: sure 100 -> RWEU = 100 (if we set u(0)=0, u(100)=100, and w(1)=1)
                  Option B: 
                      RWEU = 0 + w(0.8) * (150 - 0) = w(0.8)*150

                  If w(0.8) is less than 100/150 = 2/3, then you prefer A.

              In Choice 2:
                  Option C: w(0.1)*100
                  Option D: w(0.08)*150

                  Now, if w(0.1) is about 0.1 (linear) then w(0.1)*100=10, and w(0.08)*150=12, so D is better. 
                  But if w(0.1) is overweighted (say, w(0.1)=0.2) then 0.2*100=20, and w(0.08)=0.18 then 0.18*150=27, so still D might be better.

              However, if we use a weighting function that is more curved for small probabilities, we can explain the choice of D.

              But the point is that the weighting function is separate from the utility function.

          Step 6: Ask about Round 3:

              "In Round 3, we halved the probabilities. According to expected utility theory (with linear utility), if you preferred A over B in Round 1, you should prefer A3 over B3 in Round 3. But did you? And similarly for C and D."

              Point out any switching patterns.

              Then ask: "If you switched, does that mean your preferences changed? Or was it because the weighting function is applied to different probabilities?"

          Step 7: Conclude that risk attitude (captured by the weighting function) is a separate parameter from the utility function.

     What might go sideways:

          1. The students might not show the Allais paradox. They might choose in accordance with expected utility (especially if they are philosophy majors and rational). We need to emphasize that they should go with their gut feeling.

          2. In Round 2, with large numbers, they might choose the expected value maximizing option because the amounts are large and they think they should be rational. We should not mention expected utility until the debrief.

          3. The payment scheme: if we don't pay, they might not take it seriously. If we pay, it might be expensive.

          4. The explanation of the weighting function might be too technical.

     Feature that a classroom game can't reproduce:

          In real life, when stakes are high, people might exhibit different risk attitudes. But in the classroom, we are either using hypothetical high stakes (which might not feel real) or real low stakes (which might not elicit strong enough feelings). The game might not capture the visceral fear of losing a large amount of money.

     Let me adjust: 

          We can use real low stakes for all rounds, but then the amounts in Round 2 are not really scaled up. We can do:

              Round 1: 100 tickets = $0.10, 150 tickets = $0.15 (so trivial)
              Round 2: 100 tickets = $1, 150 tickets = $1.50 (moderate)
              Round 3: same as Round 1 but with the coin flip: 50% chance of $0.10, etc.

          But then the scaling is not dramatic. However, it might be enough to see the pattern.

          Alternatively, we can use a within-subject design and hope that they treat the moderate stakes as meaningful.

     I think we should go with real moderate stakes for all rounds to ensure engagement, and to keep the budget manageable.

     Revised payoffs (using real money, and we will pay one randomly selected student for one randomly selected choice):

          Round 1: 
              A: $1.00 for sure.
              B: 80% chance of $1.50, 20% of $0.
              C: 10% chance of $1.00, 90% of $0.
              D: 8% chance of $1.50, 92% of $0.

          Round 2: 
              A: $10.00 for sure.
              B: 80% chance of $15.00, 20% of $0.
              C: 10% chance of $10.00, 90% of $0.
              D: 8% chance of $15.00, 92% of $0.

          Round 3: 
              A3: 50% chance of $1.00, 50% of $0.
              B3: 40% chance of $1.50, 60% of $0.
              C3: 5% chance of $1.00, 95% of $0.
              D3: 4% chance of $1.50, 96% of $0.

     We will need a way to run the lotteries. We can use a random number generator (like a 100-sided die or a computer).

     Budget: 
          We select one student, and then one round, and then one choice (either Choice 1 or Choice 2) in that round, and then the option they chose in that choice. The maximum payout is $15.00. The expected payout is the average of the expected values of the chosen options over the students and rounds. We can't know in advance, but let's assume worst-case for one student: if they always choose the safe option in Round 2, then they get $10. But we are only paying one student, so the cost is between $0 and $15.

     We can afford that.

     Final procedure:

          - Explain the payment: at the end, one student will be chosen at random. Then one round (1,2, or 3) will be chosen at random. Then, within that round, one choice (either the first or the second) will be chosen at random. Then, the option that the student chose in that choice will be played for real money.

          - Distribute forms for each round.

          - Collect after each round.

          - After Round 3, do the random selections and run the lottery for the selected student.

          - Then debrief.

     This should be runnable in 80 minutes:

          10 min: introduction and explanation of payment.
          15 min: Round 1 and collection.
          15 min: Round 2 and collection.
          15 min: Round 3 and collection.
          10 min: random selection and payment.
          15 min: debrief.

     But it might be tight. We can do the payment after the debrief to save time, or even after class.

     Let's do the payment at the end of class, and use the remaining time for debrief.

     Debrief structure:

          1. Show the aggregate results for each choice in each round (bar charts? or just counts).

          2. Ask: "How many of you chose A in Round1 Choice1 and D in Round1 Choice2? How many chose B in Round1 Choice1 and C in Round1 Choice2?"

          3. Point out the pattern: A and D is common.

          4. Explain that if utility is linear, then EU(B) > EU(A) and EU(D) > EU(C) in Round1. But many choose A and D.

          5. This means that the choices are not consistent with expected utility theory (with linear utility).

          6. Introduce the idea that maybe they are weighting the probabilities nonlinearly. They underweight the 80% (making B less attractive) and overweight the 8% (making D more attractive).

          7. Explain risk-weighted expected utility: we have a weighting function w(p) that transforms the probabilities. For a two-outcome lottery (0, x) with probability p of x, the RWEU = w(p) * u(x). 

              - In Round1, Choice1: 
                    A: u(100) = 100
                    B: w(0.8) * 150
                    They prefer A if 100 > w(0.8)*150, i.e., w(0.8) < 100/150 = 2/3.

              - In Round1, Choice2:
                    C: w(0.1)*100
                    D: w(0.08)*150
                    They prefer D if w(0.08)*150 > w(0.1)*100.

              If w is such that w(0.8) < 2/3 and w(0.08) > (w(0.1)*100)/150 = (2/3)*w(0.1), then we can explain the choices.

          8. Ask about Round3: 
              - In Round3, Choice1: 
                    A3: w(0.5)*1.00
                    B3: w(0.4)*1.50
              - In Round3, Choice2:
                    C3: w(0.05)*1.00
                    D3: w(0.04)*1.50

              If they were consistent with their Round1 preferences, we would expect:
                  In Choice1: if they preferred A over B in Round1, then they should prefer A3 over B3? 
                      But note: in Round1, they had a sure thing (which is not the same as 50%). The weighting function might treat 100% specially.

              However, in risk-weighted EU, the sure thing might be given extra weight. But in Round3, the sure thing is gone.

          9. Ask: "How many of you switched from A in Round1 Choice1 to B3 in Round3 Choice1? And how many switched from D in Round1 Choice2 to C3 in Round3 Choice2?"

          10. Discuss whether the news (that there's a 50% chance the lottery is canceled) should change the preference between A and B if we only care about the final wealth in each state. It shouldn't by the independence axiom.

          11. Conclude that risk is its own parameter, and it is captured by the weighting function.

     This should fit in 80 minutes.
answer: |-
  ### Rational Choice Seminar Activity: Risk Attitude vs. Utility Function

  **Objective**: Demonstrate that risk attitude (probability weighting) is distinct from the shape of the utility function, using a currency with linear marginal utility (raffle tickets for a prize pool).

  **Materials**:
  - 24 envelopes (one per student) containing 3 choice sheets (one per round).
  - Raffle tickets as currency (e.g., 1 ticket = 1 entry into a prize draw for a $100 Amazon gift card).
  - Random number generator (dice, online tool, or bingo cage with numbered balls 1–100).
  - Timer.
  - Prize pool box for collecting tickets.

  **Payoff Scheme**:
  - **No real money**: Students earn raffle tickets. At the end, all tickets go into a box. One winner is drawn for the $100 gift card. Marginal utility is linear: 10 tickets = 10× the chance of 1 ticket.
  - **Stakes scaled to ensure linearity**: Trivial stakes in Round 1 (tens of tickets), high stakes in Round 2 (thousands), but total tickets per student capped at 15,000 to avoid wealth effects. Prize value ensures linearity (e.g., no diminishing returns for 0.1% vs. 0.01% chance of winning).

  ---

  ### Activity Rules (80 Minutes Total)
  **Intro (5 min)**:
  - "Today, you’ll make choices between lotteries. The currency is raffle tickets for a $100 prize. More tickets = higher chance to win. **Key rule: Each ticket adds the same marginal value** (e.g., 100 tickets = 100× the chance of 1 ticket)."
  - "We’ll do 3 rounds. Decide quickly—go with your gut. Don’t overthink."

  #### **Round 1: Allais-Style (Trivial Stakes)**  
  *Time: 15 min*  
  - **Choice 1**:  
    - Option A: **100 tickets for sure**.  
    - Option B: **80% chance of 150 tickets, 20% chance of 0**.  
  - **Choice 2**:  
    - Option C: **10% chance of 100 tickets, 90% chance of 0**.  
    - Option D: **8% chance of 150 tickets, 92% chance of 0**.  
  - *Students mark choices on sheets. Collect sheets.*

  #### **Round 2: Scaled-Up Stakes**  
  *Time: 15 min*  
  - **Same choices, 100× stakes**:  
    - Choice 1: A = **10,000 tickets sure** vs. B = **80% of 15,000, 20% of 0**.  
    - Choice 2: C = **10% of 10,000, 90% of 0** vs. D = **8% of 15,000, 92% of 0**.  
  - *Collect sheets.*

  #### **Round 3: "News" That Changes Nothing**  
  *Time: 15 min*  
  - **Reveal**: "New info: A fair coin will flip *before* your lottery runs. Heads (50%), your choice happens. Tails (50%), all lotteries pay 0. **This doesn’t change which option is better in any state** (e.g., if heads, A still beats B when it would have before)."  
  - **Same choices as Round 1, but probabilities halved**:  
    - Choice 1: A3 = **50% of 100, 50% of 0** vs. B3 = **40% of 150, 60% of 0**.  
    - Choice 2: C3 = **5% of 100, 95% of 0** vs. D3 = **4% of 150, 96% of 0**.  
  - *Collect sheets.*

  **Payment (5 min)**:  
  - One student draws a random round (1–3) and choice (1–2). All students’ chosen options for that round/choice are played. Outcomes determined by RNG (e.g., draw 1–100: ≤80 = win for 80% options).

  ---

  ### Debrief (25 Min): Mapping Choices to Risk-Weighted EU  
  *Do not mention "expected utility" until now.*

  1. **Reveal class results** (5 min):  
     - Show % choosing A (safe) in Choice 1 vs. D (risky) in Choice 2 for Rounds 1 and 2. **Predictable pattern**: Most choose A in Choice 1 (risk-averse for high probability) but D in Choice 2 (risk-seeking for low probability).  
     - Round 3: Many switch to B3 in Choice 1 (now 40% feels "riskier" than 50%) or C3 in Choice 2 (4% feels "too small").

  2. **Contradicting "curvy utility"** (5 min):  
     - "If choices came from diminishing marginal utility (e.g., 150 tickets not 1.5× as good as 100), why would the *same* person be risk-averse in Choice 1 but risk-seeking in Choice 2? And why switch in Round 3 when the coin flip **doesn’t change relative payoffs** in any scenario?"  
     - "Utility curvature can’t explain this. Marginal utility is linear here—each ticket adds equal value."

  3. **Risk as its own parameter** (10 min):  
     - "Your choices reveal **probability weighting**: You treat a 1% change from 100%→99% as a bigger loss than 50%→49%. This is captured by **risk-weighted EU**:  
       `Utility increment × weight(probability of doing *at least* this well)`.  
       - In Choice 1, moving from A (100%) to B (80%) feels like a big drop in ‘security’ (heavily weighted).  
       - In Choice 2, 8% vs. 10% feels similar (both ‘long shots’), so you chase the higher reward."  
     - Show the weighting function:  
       - **Overweight** low probabilities (e.g., 8% feels like 15%).  
       - **Underweight** high probabilities (e.g., 80% feels like 60%).

  4. **Trade-offs and pumpability** (5 min):  
     - "To keep risk-weighting, you give up **independence of irrelevant alternatives**: In Round 3, the coin flip is ‘irrelevant’ (doesn’t change state-wise winners), yet it changed your choices. Is that rational? Or are you ‘pumpable’ by framing?"  
     - Poll: "After seeing this, would you rethink your Round 3 choices? Or does weighting probabilities feel intuitive?"

  ---

  ### Predictable Challenges & Limitations  
  **What will go sideways**:  
  1. **Round 2 scaling misfire**: Students may balk at large numbers (e.g., 15,000 tickets). *Fix*: Pre-emptively clarify: "Remember, tickets are linear. 10,000 tickets = 100× the chance of 100 tickets."  
  2. **Round 3 confusion**: Some may think the coin flip changes optimality. *Fix*: Use a state-by-state example: "If heads, A3 vs. B3 is identical to Round 1’s A vs. B. If tails, both = 0. So no state favors one option more/less."  
  3. **Outlier students**: 1–2 philosophy majors preemptively avoid Allais-like choices. *Fix*: Use their data to discuss "rational" exceptions.  

  **Classroom limitation**:  
  - **Real-world stakes**: The $100 prize makes marginal utility linear *mathematically*, but students may not *feel* the stakes viscerally (e.g., $100 isn’t life-changing). A real-world choice (e.g., health risks) would elicit stronger emotions, but isn’t feasible in class.  

  **Why this works**:  
  - The Allais pairs + probability shift (Round 3) force a clash between utility curvature and probability weighting.  
  - Linear currency blocks the "diminishing returns" excuse.  
  - The debrief connects choices directly to risk-weighting, making the theory feel discovered, not lectured.
