  Regarding question 2 on degrees of ownership: Weakness of will examples actually strengthen the case. Even when conflicted, we don't consider ourselves multiple subjects. The ledger remains singular. 

  On factual accuracy (question 3): The "clean case" is indeed idealized, but productively so for philosophical clarity. The rarity of conflict supports the thesis - it shows the system defaults to unity where possible. 

  The confabulation rebuttal (question 4) is correct but could be sharper. The key is that confabulation concerns explanation, not ownership. The left hemisphere isn't lying about who owns the action. 

  For question 5: The argument firmly establishes a single bearer of responsibility. Agency and experience are trickier, but the essay wisely focuses on what matters socially. 

  Counterexamples (question 6) fail because even in DID cases, there's one legal person. The ledger test holds. 

  Finally, this resembles Parfit's psychological connectedness vs continuity distinction, but with superior real-world grounding through the consequences framework. The departure matters - it makes the theory actionable in real-life contexts like law or medicine. 

