answer: |-
  Here's a thought experiment meeting your specs:

  **Scenario: The Midnight Snack Lockdown**  
  In a small, close-knit design studio ("Pixel & Ink"), individual artist Leo struggles with late-night junk food binges that wreck his focus the next day. He buys a timed kitchen safe, locks his personal snack stash inside every evening at 6 PM, and sets it to open only at 7 AM. The next midnight, craving hits. He rattles the safe, knowing breaking it would cost $200 and ruin his commitment. He grumbles but sticks to it. Later, citing productivity concerns, the Pixel & Ink partners vote to install a sophisticated, expensive biometric lock on the *shared* office kitchen, permanently programmed to deny access to *everyone* between 10 PM and 6 AM. Years later, a new hire, Maya, pulls an all-nighter to meet a client deadline. Exhausted and hungry at 2 AM, she finds the kitchen locked. Breaking the lock would cost the studio $2000 in repairs and void the warranty.

  **(a) Verdict Walkthrough:**  
  *   **Individual (Leo): Binding.** Leo's commitment is normatively binding because he autonomously bound *his own future self* to counter a predictable weakness of will. The cost ($200) is a self-imposed deterrent against a temporary preference shift harming *his own* long-term goals (health/focus). Honoring it respects his extended autonomy across time.
  *   **Group (Constitutional Lock): Not Binding.** The lock isn't normatively binding on future members like Maya. The original partners bound *different people* (future employees) who had no say in the decision. Maya faces a *genuine need* (sustenance during necessary overtime) unforeseen by the founders. The cost ($2000) serves not her willpower but enforces the founders' past preferences onto a new agent with distinct circumstances and projects. Enforcing it prioritizes a dead hand of the past over the current member's immediate well-being and autonomy within her legitimate work duties.

  **(b) The Differentiating Feature:**  
  The essential feature making them come apart is **Authorship and the Identity of the Bound Agent**.  
  *   In the Ulysses contract (Leo), the agent making the commitment (Past-Leo) and the agent bound by it (Future-Leo) are *temporal stages of the same person*. The commitment is an exercise in autonomy over one's own extended life narrative and weaknesses.  
  *   In the constitutional precommitment (Kitchen Lock), the agents making the commitment (Original Partners) are *different individuals* from the agents primarily bound by it (Future Employees like Maya). The commitment binds *new principals* who were not authors of the rule and may have fundamentally different needs, values, or circumstances.  

  This feature (binding new principals vs. binding one's future self) is **essential** to the individual/collective precommitment distinction. Collectives persist through changing membership; the "future self" of a group isn't a temporal stage but a potentially disjoint set of individuals. Binding future members who weren't party to the agreement violates their autonomy as new principals, unlike binding one's own future self.

  **(c) Tweaking the Constitution & Analogy:**  
  *   **Could it be fixed?** Yes, a defender could tweak the constitution. Examples:  
      *   Add a sunset clause requiring renewal by current members every X years.  
      *   Implement a supermajority override mechanism for current members facing hardship.  
      *   Build in exceptions (e.g., "except during verified critical project deadlines").  
  *   **Fundamental Character Changed?** These tweaks fundamentally alter the character by introducing *ongoing democratic control* or *flexibility*. The core "precommitment" aspect – making a binding decision *now* to constrain *future* choice – is weakened or conditional. It becomes more like a standing policy subject to revision than a rigid precommitment shield against future weakness of will or preference shifts.  
  *   **Structural Analogy Preserved?** **No.** The fixed version is no longer structurally analogous to the Ulysses contract. Leo's safe *guarantees* he cannot access snacks at midnight, forcing him to endure the craving. The tweaked constitution allows the current group (including Maya) to *change the rule* or *grant exceptions* when faced with the temptation/hardship. The Ulysses contract relies on inflexibility to work; the "fixed" constitution relies on flexibility to be legitimate. The mechanisms (rigid lock vs. amendable policy) and the nature of the constraint (absolute vs. conditional) diverge significantly.

  **Why the Reasoning Works:**  
  1.  **Autonomy Foundation:** The verdicts derive from core liberal theories of autonomy (central to Elster and precommitment debates). Binding one's *own* future self can enhance autonomy; binding *others'* future choices without their consent violates autonomy.  
  2.  **Principal-Agent Distinction:** Leo is both principal and agent across time. The studio separates the principals (owners/employees) who make rules from the agents (employees) bound by them, especially future ones. Binding new principals is problematic.  
  3.  **Circumstances of Justice:** Maya's unforeseen need (legitimate work demand) highlights how collective precommitments can become unjust when circumstances change for those not party to the original agreement – a problem less acute for an individual bound to their *own* past assessment of their likely future frailties.  
  4.  **Proportionality Respected:** The stakes (personal health/focus vs. employee well-being/work completion) and costs ($200 personal vs. $2000 collective) are scaled proportionally to the agents involved (individual vs. small firm). The difference isn't about size but agency.  

  This demonstrates that scaling a Ulysses contract structurally to a collective context introduces a *qualitative* normative difference – the imposition of a past group's will onto new individuals – that breaks the analogy's normative force, even when the temptation (snacking) and mechanism (costly lock) seem identical.
