  1. Consider the initial rejection of continental drift in the early 20th century due to the absence of a known mechanism for plate movement. Was this rejection justified primarily because direct empirical evidence (like paleomagnetic data) was lacking, or because no plausible alternative mechanism existed?  
     - Choosing "empirical evidence lacking" suggests strict falsificationism, where only testable evidence matters.  
     - Choosing "no plausible mechanism" suggests non-empirical confirmation or Bayesian skepticism, as it invokes theory-based reasoning.

  2. Before the 2012 Higgs boson discovery, confidence in the Higgs mechanism rested on its role in the Standard Model. Was this confidence driven more by empirical successes (like electroweak precision tests) or by the theory's internal necessity for consistency?  
     - Choosing "empirical successes" aligns with strict falsificationism or Bayesian skepticism, emphasizing data.  
     - Choosing "internal necessity" indicates non-empirical confirmation, valuing coherence as evidence.

  3. The 19th-century vortex theory of atoms unified atomic structure with the ether, but this unification was later shown to be an artifact when the ether was abandoned. Was this unification a genuine advance (e.g., inspiring productive research) or a misleading artifact?  
     - Choosing "genuine advance" points to pragmatism, prioritizing fruitfulness over truth.  
     - Choosing "misleading artifact" suggests strict falsificationism or Bayesian skepticism, rejecting non-empirical unity as unreliable.

  4. The observed small value of the cosmological constant is explained by some via multiverse selection effects (only such values allow observers). Does this anthropic reasoning provide a legitimate scientific explanation?  
     - Choosing "yes" indicates the anthropic optimist position, treating selection effects as valid science.  
     - Choosing "no" aligns with strict falsificationism, non-empirical confirmation, Bayesian skepticism, or pragmatism, depending on other answers.

  5. In the 1980s, lattice QCD calculations of hadron masses were computationally intractable; confidence in QCD relied on other factors. Was this confidence based more on empirical successes (like deep inelastic scattering) or on QCD's theoretical structure (e.g., asymptotic freedom)?  
     - Choosing "empirical successes" suggests Bayesian skepticism or strict falsificationism, emphasizing data.  
     - Choosing "theoretical structure" indicates non-empirical confirmation or pragmatism; note this branch cannot cleanly separate these two leaves, as both may value theory-based reasoning for evidence or fruitfulness.
