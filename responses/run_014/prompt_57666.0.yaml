  You are a philosopher of biology who has spent two decades preparing scientists and science writers to survive hostile question periods; please reason through this carefully before drafting, though the drafting should be the only thing you return. I write a weekly column on science and ideas, and next month I deliver the public lecture at an interdisciplinary institute whose room will be roughly seventy percent working theoretical biologists — population geneticists, origins-of-life modelers, two groups doing open-ended search in machine learning — who have read enough popular philosophy to resent having their fitness landscapes, optimization talk, and "as-if" design language dismissed as smuggling mind into nature. There will also be two philosophers of biology who like Dennett but distrust promissory-note metaphors in general. My thesis is this: the crane/skyhook distinction, as it is actually deployed in arguments about reductionism, has quietly become a three-way one. Between genuine cranes (subprocesses that accelerate selection without importing the design work) and skyhooks (unearned, mind-first lifts) sits a category nobody names — call them borrowed cranes: idealizations and search-space vocabularies that are legitimate today only because they carry an implicit promise of eventual mechanistic cash-out, a promise that is sometimes never paid. My claim is that most charges of greedy reductionism, and most counter-charges of crypto-dualism, are really arguments about this middle tier and about who gets to decide when the note comes due.

  Give me the five objections this room will actually press, ordered by how much damage each would do to the thesis, with the fifth being the question I am praying nobody asks. For each: say which subgroup raises it, phrase it in their own idiom rather than in mine, give a reply I can deliver in about thirty seconds, and mark exactly where that reply is soft. Assume they will charge that my middle tier is an unfalsifiable safe harbor into which any device can be reclassified; take that seriously rather than around it.

  Return exactly five numbered items, at most three sentences each, and nothing else — no preamble, no summary, no closing advice.
