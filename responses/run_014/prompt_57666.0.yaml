answer: |-
  1.  **Objection from Theoretical Biologists (Optimization Focus):** "Calling our optimization models 'borrowed cranes' implies they're placeholders, ignoring that they *are* the mechanistic description for complex systems where enumerating microstates is computationally irreducible – the search dynamics *are* the crane."  
      **Reply:** "Agreed for specific, validated dynamics like replicator equations. My concern targets cases where 'optimization' handwaves *how* the search navigates rugged landscapes, relying on future unspecified mechanisms. This handwave is the borrowed crane."  
      **Soft Spot:** Distinguishing validated dynamics from handwaves is often context-dependent and judgement-laden.

  2.  **Objection from Philosophers (Vagueness of Debt):** "Your 'implicit promise of cash-out' is too vague. Who defines 'eventual'? What specific mechanistic detail level is 'cash'? This makes the category unfalsifiable; any concept can be defended as 'just not cashed out *yet*'."  
      **Reply:** "The debt comes due when the idealization obstructs progress or generates paradoxes it cannot resolve internally. Think of 'fitness' before the Modern Synthesis – its promissory nature became obstructive. The burden shifts to show *how* cash-out is possible."  
      **Soft Spot:** Defining "obstructs progress" is retrospective/subjective; it lacks a clear predictive criterion.

  3.  **Objection from Biologists/ML Groups (Universality of Idealization):** "All science uses tractable idealizations – Newtonian gravity, ideal gases. Why single out *our* 'as-if' design language as 'borrowed' rather than just standard modeling? This feels like a philosophical attack disguised as taxonomy."  
      **Reply:** "Because 'as-if design' uniquely risks reifying the *telos*. Ideal gases don't imply gas molecules 'intend' to obey Boyle's law. The borrowing occurs when 'as-if agency' is invoked without clarifying the *constraints* enabling the appearance of goal-directedness."  
      **Soft Spot:** Some argue goal-directed language is indispensable heuristically, even sans full constraint specification; the "unique risk" is disputed.

  4.  **Objection from Philosophers/Biologists (Crane Inflation):** "Aren't *all* cranes initially 'borrowed'? Natural selection itself was a promissory note for genetics. Doesn't your middle tier collapse into 'nascent cranes', making your tripartite distinction unstable and unhelpful?"  
      **Reply:** "Crucially, genuine cranes (like NS+genetics) *accelerate* explanation by revealing underlying mechanisms. Borrowed cranes *delay* it by substituting heuristic power for mechanistic insight. The distinction hinges on whether the model actively *replaces* the need for lower-level explanation or merely *defers* it."  
      **Soft Spot:** The line between "accelerate" and "delay" is fuzzy and often only clear in hindsight; deferral can be productive.

  5.  **Objection from Philosophers (Teleology of Cash-Out):** "You assume science *must* 'cash out' in mindless mechanisms, treating this as the gold standard. But isn't this demand itself a skyhook – imposing a teleology of reduction onto science? Perhaps some 'borrowed cranes' aren't debts, but *currency*: the best permanent explanation we get."  
      **Reply:** "My thesis doesn't demand reduction for its own sake, but notes that the *legitimacy* of intentional-stance language in biology *rests* on the possibility of cashing it out. If we concede some 'as-if design' is *fundamentally* inexplicable mechanistically, haven't we smuggled in a skyhook?"  
      **Soft Spot:** This concedes the core assumption *is* anti-mysterian reductionism; it doesn't refute the charge that demanding cash-out imposes an external teleology.
