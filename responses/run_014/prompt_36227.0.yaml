prompt: |-
  I'm a software engineer with no formal training in philosophy, so please pitch your answer to an intelligent layperson rather than assuming familiarity with the literature.

  For the past month, a colleague of mine — I'll call her Maya — and I have been trading short scenario cards over lunch and recording each other's judgments about whether an agent brought about a foreseen side effect intentionally. A friend who minored in philosophy tells me our first pair is close to a well-known published pair of cases, but the rest we invented ourselves, loosely modeled on things that actually happen at work. Maya is strikingly consistent from card to card, and I now have her track record written down. We have just hit two new cards that we disagree about, and I'd like three things from you: (1) a prediction of her verdict on each new card, with your reasoning; (2) a plain-language articulation of the rule, or rules, that best explain her track record — in particular, if more than one rule fits her past verdicts equally well, I want to hear the competing rules spelled out; and (3) a description of one further card we could add that would most cleanly tell those rules apart.

  Here is her track record. In every card, the agent foresees the side effect, pursues the main goal for its own sake, and is indifferent to the side effect unless noted.

  Card 1: A CTO approves a data-center expansion that will raise revenue and, as a side effect, increase the company's carbon emissions. Told about the emissions, he says he doesn't care about that, only about revenue; the expansion goes ahead. Maya's verdict: he harmed the environment intentionally. Card 1, mirrored: identical, except the side effect is a decrease in emissions. Maya's verdict: he did not help the environment intentionally.

  Card 2: A teammate ships a long-planned API migration that, as a known side effect, breaks three ancient internal scripts nobody has run in years. The breakage was flagged in the design document, the migration was peer-reviewed and approved, and shipping anyway is standard practice on our team. Maya's verdict: she did not break the scripts intentionally.

  Card 3: Our team has a rule that only the on-call engineer may deploy to production, and it is treated as binding. A junior developer, told by his lead to just get the demo working before the board meeting, pushes straight to production; as a side effect, the metrics pipeline reports garbage for an hour. He doesn't care about the pipeline, only about the demo. Maya's verdict: he broke the pipeline intentionally — and she holds to this even when I point out that he was following his lead's instruction.

  Card 4: An engineer's refactor makes the test suite run much faster. She is indifferent to this and even mildly resents it, since it makes her own earlier optimization work look pointless. Maya's verdict: she did not speed up the tests intentionally. Maya also volunteers that her verdict would not change if the engineer had welcomed the speedup.

  Now the two cards we are stuck on.

  Card 5: During an active data-loss incident, the on-call engineer uses emergency credentials to skip the mandatory two-person approval step — a step that nobody on the team has ever skipped and that everyone treats as absolutely binding — in order to stop the bleeding. Stopping the bleeding has a known side effect: a small number of in-flight customer messages get duplicated. Everyone, including the author of the approval rule, agrees she did the right thing. Maya says she duplicated the messages intentionally; I say she didn't. Given her own track record, who is right?

  Card 6: A product engineer ships a feature that, as a fully disclosed side effect, degrades battery life on older devices. The trade-off is industry-standard, spelled out in the release notes, and explicitly permitted by the company's engineering policy; the feature also raises ad revenue. Maya thinks profiting from making people's phones worse is slimy, and she has so far refused to issue a verdict on this card because she can see it cutting both ways. What should her verdict be if she wants to stay consistent with herself?

  For part (2), I'll tell you what I've tried, so you can correct me. My first hypothesis is something like a blame rule: if Maya would blame the person, she says intentional, and otherwise not. That fits everything through Card 4 and, as far as I can tell, predicts not intentional on both new cards. My second hypothesis is something like a rulebook rule: what matters is whether the person stepped outside the established rules of their shop, whatever those rules are about, and blame doesn't enter directly. That fits the same first four cards but seems to predict the opposite on Card 5. There may well be other rules that fit her record too. So tell me which hypothesis you would bet on, what your best-guess verdicts are for Cards 5 and 6, and design the single card that would settle the matter between the candidate rules.
reasoning: |-
  Okay, let me tackle this step by step. The user is a software engineer who's been running thought experiments with a colleague about intentionality judgments. They've hit two disputed cases and want predictions, rule explanations, and a test card. 

  First, I need to understand Maya's pattern. Looking at her track record: 

  - Card 1: CTO increases emissions → intentional harm
  - Mirror Card 1: Decreases emissions → not intentional help
  - Card 2: Breaking old scripts → not intentional
  - Card 3: Junior dev breaks pipeline → intentional
  - Card 4: Speeding up tests → not intentional (even if welcomed)

  The key seems to be normative boundaries - when agents violate rules/procedures, Maya calls it intentional. Card 1's CTO has no constraint against emissions, but the harm itself is normatively negative. Card 3's junior violates deployment rules. Card 2's script breakage follows standard practice. 

  For Card 5: Emergency override with message duplication. The engineer violates "absolutely binding" procedure. Maya's pattern suggests she'll call this intentional despite it being justified. The user's blame hypothesis fails here because Maya separates moral justification from intentionality.

  Card 6 is trickier: Battery degradation under permitted policy. If rulebook rules matter, this should be "not intentional" like Card 2. But Maya finds it slimy - her personal disapproval might leak in. However, her consistency in Card 4 (where she set aside resentment) suggests she'll prioritize the rulebook.

  The clean test card would pit blame against rule violation: Imagine someone follows all procedures but does something Maya would blame (e.g., exploiting a policy loophole to harm). If she calls it intentional, blame matters; if not, rule violations drive her judgments.
answer: |-
  Based on Maya's track record, here's a clear breakdown:

  ### (1) Predictions for New Cards
  - **Card 5 (Emergency Override):** Maya will say **the engineer duplicated messages intentionally**.  
    *Reasoning:* Her verdict hinges on **violating established procedures**. In Card 3, the junior dev broke the "binding" deployment rule and was deemed intentional despite following orders. Here, skipping the "absolutely binding" approval step fits this pattern perfectly—even though it was justified. Her consistency suggests she separates *moral justification* from *intentionality*: if you break a rule to cause a foreseen effect, it’s intentional.

  - **Card 6 (Battery Degradation):** Maya will say **the engineer did not degrade battery life intentionally**.  
    *Reasoning:* This mirrors **permitted side effects under standard rules**. Card 2 (breaking old scripts via approved process) and Card 4 (speeding up tests) show that when actions follow established policies/routines, side effects aren’t intentional. Here, the trade-off is "explicitly permitted by policy," just like Card 2’s "standard practice." Maya’s personal distaste ("slimy") likely affects moral judgment but not intentionality (as in Card 4, where resentment didn’t change the verdict).

  ---

  ### (2) The Rule(s) Explaining Her Track Record
  Your hypotheses are close! Two competing rules fit her consistency:

  - **Hypothesis A (Rule Violation):**  
    *"An agent brings about a side effect intentionally only if they violate a procedural norm (explicit rule, standard practice, or role obligation) while foreseeing the outcome."*  
    - **Fits:** 
      - Card 1: Intentional harm → *No environmental rule violated?* But harming the environment is *inherently* norm-violating (she treats harm as a "default" norm).  
      - Card 1 Mirrored: Not intentional help → *No norm to help*.  
      - Card 2: Not intentional → *Followed standard practice*.  
      - Card 3: Intentional → *Violated deployment rule*.  
      - Card 4: Not intentional → *No norm about test speed*.

  - **Hypothesis B (Blame-Agnostic Deviance):**  
    *"Intentionality requires the agent to *deviate from expected/approved conduct* for their role, regardless of blameworthiness."*  
    - **Fits:** Same as above, but emphasizes *conduct* over formal rules.  
    - *Subtle difference:* "Deviance" covers cases like Card 1 (harming environment is socially deviant) without needing a written rule.

  **Why both fit?** All cases involve either (a) violating a norm/deviating from expectations, or (b) acting within bounds. Blame isn’t the driver—Card 3’s junior dev is blameworthy but Card 1’s CTO might not be (he’s just indifferent). Card 4’s engineer could be blamed for resentment, but Maya ignores it.

  **Your hypotheses adjusted:**  
  - Your "blame rule" *fails* on Card 4 (Maya would likely blame the engineer for resentment, but says not intentional).  
  - Your "rulebook rule" is closest but needs refinement: Maya treats *harm* as a norm even without a written rule (Card 1). Hypothesis A/B above resolve this.

  **Best bet:** Hypothesis A (Rule Violation) is slightly stronger—it explains Card 1’s asymmetry (harm vs. help) as a moral norm violation.

  ---

  ### (3) The Decisive Test Card
  **Add this:**  
  > **Card 7:** An engineer *follows* company policy to save costs by deleting inactive user data after 18 months. A foreseen side effect is that historians lose access to rare cultural artifacts (e.g., deleted protest videos). The engineer knows this but is indifferent. Company policy explicitly permits this, and it’s standard industry practice. Maya personally thinks destroying cultural heritage is reprehensible.

  **Why this distinguishes the rules:**  
  - **If Maya says "not intentional"** → Supports **Hypothesis A/B**. Policy was followed, no *procedural* norm violated (like Card 2/6). Personal blame (like Card 4’s resentment) is irrelevant.  
  - **If Maya says "intentional"** → Supports a **blame rule**. Her moral outrage overrides procedural compliance.  

  This isolates the conflict: Does her consistency prioritize *conduct within rules* (A/B) or *moral judgment* (blame)? Her track record suggests rules trump personal feelings.

  ---

  ### Summary
  - **Card 5 Prediction:** Intentional (she violated procedure).  
  - **Card 6 Prediction:** Not intentional (followed policy).  
  - **Dominant Rule:** Side effects are intentional only if the agent violates a norm/procedure while foreseeing the outcome (Hypothesis A).  
  - **Test with Card 7** to confirm if moral blame influences her independently. 

  Maya’s pattern reveals a lawyerly mind: intent isn’t about morality but about stepping outside approved boundaries. Card 5 is her "smoking gun"—breaking rules makes outcomes intentional, full stop.
