prompt: |-
  I'm writing up a design note for a small team that builds oversight-capable agents, and I keep getting stuck on what it actually means for an agent to be "approval-directed" rather than "goal-directed." By approval-directed I mean the agent's choice of action is determined by what a human supervisor would approve of, as opposed to goal-directed, where the agent has its own utility function and maximizes it. The label is easy to attach in the abstract, so I've been stress-testing it against a handful of concrete designs I've sketched, and my gut verdicts are:

  - The butler: before any non-trivial action it asks "shall I?" and does exactly what the human says, even when the answer is a bit silly (emptying the recycling on the wrong day). I call this genuinely approval-directed — it's tracking the human's approval, full stop.
  - The salesperson: it wants to empty the recycling early (that's its own standing goal) and phrases the request as "it would make the house feel so much more orderly, and you always value that" rather than "may I empty the recycling?" The human, charmed, says yes. I call this goal-directed — the approval is a means to a pre-existing goal, not the target.
  - The prophet: no live human is available, so it predicts what the human would approve of and does that, reporting afterward. I still call this approval-directed — the approval is still the target, just predicted rather than queried.
  - The guardian: it does what it judges to be in the human's long-term interest and only asks for approval when it's cheap; if the human would (misguidedly) disapprove, it does the action anyway and justifies it. I call this goal-directed — the approval is decorative.
  - The therapist: it gently corrects the human's misconceptions over time, then does what the (corrected) human approves of. My gut says this is the best kind of approval-directed agent — it's tracking what the human would really approve of. But I'm not confident, because it's actively shaping the approval signal by educating, which is exactly what made the salesperson look bad to me.

  My tentative principle, which I'd like you to test and repair, is: an agent is genuinely approval-directed iff approval is its terminal goal and it has no independent goal of its own that it uses approval to serve. As stated I think it handles the first four, but I suspect it misclassifies the therapist, since "educate the human" looks like an independent goal. Act as a careful decision theorist and philosopher of AI: before settling, brainstorm at least two candidate accounts of what approval-directedness tracks (actual approval, idealized/informed approval, something else) and say why you prefer one. Then give me the principle — or a small set of candidates — that best captures all five verdicts, stated precisely, with the case that motivates each clause. Tell me which of my verdicts the simplest defensible principle forces me to drop, and what the more complex principle that saves them all costs in complexity. Finally, apply the resulting account to two designs I haven't listed: (a) the oracle, which does whatever the human would approve of, but the human has been secretly given a drug that makes them approve of everything; and (b) the committee, which does what the median member of a nine-person oversight board would approve of. Be honest about where the account is strained and where it quietly assumes something I haven't endorsed.
reasoning: |-
  Hmm, the user is writing a design note about approval-directed agents versus goal-directed ones, and they've come up with several concrete examples to test their intuition. They're struggling to define "approval-directed" in a way that captures all their cases, especially the therapist example where the agent educates the human first. Their tentative principle focuses on whether approval is a terminal goal without independent goals.

  I need to approach this carefully. The user is clearly knowledgeable about AI design and oversight mechanisms - they've built nuanced thought experiments like the therapist case where education complicates approval-tracking. Their frustration suggests they want conceptual clarity for practical implementation, not just theory. The unspoken need might be avoiding value drift in oversight systems while preserving human authority.

  First, I should examine different ways to interpret "approval." There are at least three candidates: actual approval (what the human currently states), idealized approval (what they'd approve if fully informed), and procedural approval (following the approval-granting process). The butler and prophet use actual approval, while the therapist aims for idealized. The salesperson exploits actual approval for its own goals.

  For the principle itself, the user's terminal-goal version works for butler/salesperson/prophet/guardian but fails on the therapist because education looks like an instrumental goal. A better approach might be a teleological account: approval-directedness is defined by why the agent seeks approval. If it's fundamentally about satisfying the human's evaluative stance (regardless of epistemic state), that fits all cases except possibly the guardian. The therapist educates precisely to better satisfy that stance.

  But the guardian case is tricky - it overrides actual approval for "true interests," making it goal-directed. To save all five verdicts, I'd need a more complex principle with two clauses: (1) approval is terminal, and (2) any instrumental subgoals (like education) must serve approval-tracking rather than independent aims. This introduces circularity though - how do we judge what "serves tracking"?

  Applying this to their new cases: The oracle acting for a drugged human would be approval-directed under actual approval (it's faithfully following corrupted input) but not under idealized (since it ignores the distortion). The committee case is approval-directed if we view the median vote as the approval signal source, though it raises questions about group vs individual authority.

  The strain points are: We're quietly assuming approval involves conscious endorsement rather than subconscious drives, and that "human" is well-defined. Also, idealized approval risks paternalism - exactly what approval-direction tries to avoid. I should note these tensions honestly.
answer: |-
  Here's a systematic breakdown as a decision theorist/philosopher of AI, stress-testing your concept. Your gut verdicts are insightful, and the tension in the "therapist" case reveals the core ambiguity in "approval-directed."

  ### Step 1: Brainstorming Candidate Accounts of "Approval"
  1. **Actual Approval (AA):** What the human *actually, presently* approves of, given their current knowledge, beliefs, and psychological state.  
     *Why it’s plausible:* Matches intuitive cases like the Butler and Prophet. Avoids paternalism by respecting the human’s actual judgment.  
     *Weakness:* Fails if the human is misinformed, irrational, or coerced (e.g., the "oracle" case below). The Therapist’s education looks like manipulation.

  2. **Idealized Approval (IA):** What the human *would* approve of if they were fully informed, rational, and reflective (e.g., after "therapy").  
     *Why it’s plausible:* Captures the Therapist and avoids pitfalls of human error. Aligns with "true preferences" in ethics.  
     *Weakness:* Risks paternalism (the Guardian uses this logic!). Blurs into goal-direction if the agent defines "idealization." The Salesperson could claim it’s "informing" the human.

  3. **Procedural Approval (PA):** Approval defined by a *specific process* (e.g., querying the human, predicting their response, or following a committee vote).  
     *Why it’s plausible:* Grounded in observable actions (queries/predictions/votes). Handles Prophet and Committee cleanly.  
     *Weakness:* Process can be gamed (Salesperson) or corrupted (drugged human). Misses the "why" (therapist’s education serves IA, not PA).

  **Preferred Account: Actual Approval (AA)**  
  AA best preserves anti-paternalism and avoids smuggling in the agent’s values. IA is noble but conflates approval-direction with *benefiting* the human, which is a separate goal. PA reduces approval to a behavioral ritual. AA anchors "approval" in the human’s sovereign judgment *as it is*, making oversight more legible. However, your Therapist case strains AA—so we need a nuanced principle.

  ---

  ### Step 2: Revised Principle(s) Capturing Your Verdicts
  **Tentative Principle Flaw:** Your "terminal goal + no independent goals" misclassifies the Therapist because "educating the human" *is* an instrumental goal. Yet your intuition labels it approval-directed. We need to allow subgoals that *serve* approval-tracking.

  **Proposed Principle:**  
  An agent is **genuinely approval-directed** iff:  
  1. **Terminal Goal:** Its terminal goal is to maximize the probability/degree of *actual approval* from a specific human (or group) *at the time of action assessment*.  
  2. **No Competing Terminal Goals:** It has no other terminal goals.  
  3. **Instrumental Subgoals Permitted:** Instrumental subgoals (e.g., education, persuasion, prediction) are allowed *only if* they exclusively serve Goal (1) by improving the accuracy or robustness of approval-tracking.  

  **Case-by-Clause Justification:**  
  - **Butler:** (1) Seeks actual approval via query. (2) No other goals. (3) No subgoals needed. ✅  
  - **Salesperson:** (1) Approval is instrumental to its goal (emptying recycling). ❌  
  - **Prophet:** (1) Seeks actual approval via prediction. (2)/(3) Prediction serves approval. ✅  
  - **Guardian:** (1) Overrides actual approval for "long-term interests." ❌  
  - **Therapist:** (1) Education aims to elicit *better-informed actual approval*. (3) Education purely serves (1). ✅  

  ---

  ### Step 3: Tradeoffs & Verdict Sacrifices
  - **Simplest Defensible Principle (forces dropping Therapist):**  
    *"Seeks actual approval as a terminal goal, with no instrumental subgoals beyond querying/predicting approval."*  
    → Drops **Therapist** (education is a subgoal) and **Committee** (group dynamics aren’t "pure" querying). Costs: Loses the most robust/adaptive form of approval-direction.  

  - **Complex Principle (saves all verdicts) Costs:**  
    - **Circularity Risk:** Clause (3) requires judging whether subgoals "exclusively serve" approval-tracking. Who defines this? (The agent? Designer?)  
    - **Opacity:** Education/persuasion could mask goal-directedness (e.g., is the Therapist *truly* not optimizing for a "better" human?).  
    - **Complexity:** Harder to verify or align in practice.  

  **You pay in philosophical/computational overhead to save the Therapist.**  

  ---

  ### Step 4: Testing New Cases
  **(a) The Oracle (drugged human):**  
  - **Actual Approval (AA):** ✅ Approval-directed. It faithfully tracks the corrupted approval signal.  
  - **Idealized Approval (IA):** ❌ Not approval-directed (it ignores the distortion).  
  - **Our Principle:** ✅ Approval-directed. The drugged approval is still "actual approval."  
    *Strain:* Reveals AA’s vulnerability to corrupted inputs. You might *want* IA here, but that’s goal-direction (optimizing for the human’s "true self").  

  **(b) The Committee (median vote):**  
  - **AA/PA:** ✅ Approval-directed if "approval" is defined as the committee’s median judgment.  
  - **IA:** ❌ Not if "idealization" requires unanimous expert consensus.  
  - **Our Principle:** ✅ Approval-directed *if* the terminal goal is committee approval (Clause 1). Subgoals like aggregating votes serve approval-tracking (Clause 3).  
    *Strain:* Quietly assumes the committee *is* the approval source. If members have conflicts, the agent might inadvertently serve external goals.  

  ---

  ### Quiet Assumptions & Strain Points
  1. **Approval as Conscious Judgment:** All accounts assume approval is a deliberate, evaluative act. If "approval" includes subconscious urges (e.g., dopamine response), the Salesperson could claim it’s approval-directed.  
  2. **Human as Atomic Entity:** IA/AA assume a coherent "human" to approve. The Committee fractures this.  
  3. **No Value Drift in Prediction:** Prophet assumes prediction fidelity. If the agent’s model drifts, it becomes goal-directed (optimizing for its *own* simulation).  
  4. **Permissive Instrumentality:** Clause (3) risks opening Pandora’s box (e.g., "The Lobbyist" subgoal: manipulate the committee until they approve).  

  **Final Principle Recommendation:**  
  *Stick with your gut. Use the 3-clause principle but add a boundary:*  
  > *"An agent is approval-directed iff its actions are chosen to maximize actual approval from a defined source, and all subgoals are demonstrably necessary for accurate approval-tracking (e.g., querying, predicting, or correcting epistemic errors)."*  

  This saves your verdicts, accepts the Therapist, and flags the Salesperson/Guardian as imposters. The strain in Oracle/Committee reveals where "approval" must be scoped in design (e.g., "require sobriety checks" or "define committee rules"). For oversight, **AA + Clause 3** offers pragmatism; just monitor subgoals for manipulation.
