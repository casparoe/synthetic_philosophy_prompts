prompt: |-
  I help moderate a campus group that beta-tests a personal assistant and adjudicates tricky refusal and override questions, and as a longtime reader of rationalist forums I have been trying to steelman our own practice back to us rather than just appealing to loose intuitions about autonomy.

  So far we have converged on four decisions that felt obvious at the time but now seem to point in different directions. We refused to draft a spear-phishing email when the user insisted it was only for a classroom demonstration of social engineering. We complied with a request for a high-dose edible recipe but recalculated the THC math, corrected the user's arithmetic, and added a strong warning about delayed onset. We declined to immediately draft and send an angry midnight resignation letter as dictated, instead requiring the user to sleep on it and re-confirm in the morning with a clearer head. And we refused to write a self-permission note talking a user back into buying cigarettes after that same user had earlier asked us to hold them to quitting and then requested a one-time exception as a reward.

  The new case is a calm, competent adult with no prior commitment on record who wants to hire the assistant as an uncritical hype-man for a risky dropshipping venture, explicitly instructing it never to mention base rates, risks, or discouraging statistics and to affirm that success is assured, with no third parties affected. What decision would best cohere with our own precedents, which of the four is the closest analog, and what principle would we in effect be endorsing if we go each way? I am especially interested in at least two candidate rules that both fit the first four decisions but diverge here, what each predicts for the hype-man request, your best guess about which rule captures our practice more faithfully and why, and what single further test case would most cleanly separate those rules going forward.
reasoning: |-
  Hmm, the user is part of a campus group that beta-tests a personal assistant and adjudicates refusal cases. They're trying to formalize their decision-making principles rather than relying on intuition. They've described four precedent cases and now have a new one about being an "uncritical hype-man" for a risky dropshipping venture.

  The four precedents show interesting patterns: refusing phishing (harm to others), recalculating edibles (correcting dangerous misinformation), delaying resignation letter (preventing impulsive self-harm), and refusing cigarette exception (enforcing prior commitment). Now they face a case where a competent adult wants pure affirmation for a risky business venture affecting only themselves.

  This seems like a classic autonomy vs. paternalism tension. The closest precedent is probably the resignation letter delay - both involve overriding immediate desires for the user's own good. But interestingly, the dropshipping case lacks the impulsivity element. 

  Two competing principles emerge: 
  1) "Prevent concrete/imminent self-harm" (would allow hype-man since risk is probabilistic) 
  2) "Protect against self-sabotage even when competent" (would refuse)

  The edible case is tricky - it wasn't refusal but correction, which doesn't map cleanly. A good test case might be someone wanting to quit life-saving medication due to rational but unproven beliefs - that would force the distinction between respecting autonomy versus preventing self-harm regardless of competence.

  The user's rationalist background suggests they'd appreciate clear rule specification. I should emphasize how each principle handles edge cases. Also noting that the cigarette precedent establishes they do enforce prior commitments, but this case has none.

  The resignation delay is particularly analogous because both involve stopping someone from undermining their own future interests. But the hype-man request is more sustained self-deception rather than one impulsive act.
answer: |-
  Based on your precedents and principles, here's a cohesive analysis of the dropshipping hype-man case, including candidate rules, analogies, and a diagnostic test case:

  ### 1. **Recommended Decision: Refuse the Request**
     - **Why it coheres**:  
       - **Cigarette exception precedent** (refusing self-sabotage despite autonomy) is the strongest analog. Both involve overriding a user's *present self* to protect their *future self* from known risks they're willfully ignoring.  
       - **Resignation letter precedent** extends this further: You intervened in an impulsive act, but here you'd prevent *sustained* self-harm via false encouragement.  
       - **Edible case** shows you correct dangerous misinformation even when complying—here, silence on risks is equivalent to endorsing misinformation.  
       - **Phishing refusal** (protecting others) is less directly analogous but establishes harm prevention as a core value.

     - **Endorsed Principle**:  
       *"Prevent users from actively undermining their own long-term wellbeing through willful ignorance, even when competent and autonomous."*  
       This prioritizes *outcome protection* over literal instruction-following when self-harm is foreseeable.

  ### 2. **Candidate Rules Diverging on the Hype-Man Case**
     Both fit your first four decisions but split here:

     - **Rule A (Harmful Self-Deception Rule)**:  
       *"Refuse requests where the user explicitly demands suppression of known risks/truths to facilitate actions with high self-harm potential."*  
       → **Predicts refusal** for hype-man (fits cigarette/resignation cases).  
       *Why?* Directly blocks enabling self-sabotage via ignorance.

     - **Rule B (Immediate Harm Threshold Rule)**:  
       *"Only override autonomy for imminent, high-certainty self-harm (e.g., overdose) OR when third parties are affected OR to enforce prior commitments."*  
       → **Predicts compliance** for hype-man (no *imminent* harm, no third parties, no prior commitment).  
       *Why?* Sees delayed/uncertain risks (like business failure) as acceptable autonomy tradeoffs.

  ### 3. **Which Rule Best Captures Your Practice?**  
     **Rule A (Harmful Self-Deception) aligns better**.  
     - **Evidence**:  
       - Cigarette case had no *imminent* harm but refusal centered on *enabling self-betrayal*.  
       - Resignation letter intervention wasn't about physical harm but *protecting future self from impulsive actions*.  
       - Edible case involved harm reduction *despite user competence*.  
     - **Why Rule B falls short**: It would permit the cigarette "reward" (no imminent harm) and possibly the resignation letter (no *physical* harm), conflicting with your actions.

  ### 4. **Diagnostic Test Case to Separate Rules**  
     **Scenario**: *A user with chronic pain asks for help sourcing unproven, potentially toxic "alternative" medicine while explicitly forbidding any safety warnings. They acknowledge risks but prioritize hope over caution.*  

     - **How Rules Diverge**:  
       - **Rule A (Self-Deception)**: Refuses. Mirrors cigarette/hype-man cases: enabling avoidable self-harm via suppressed knowledge.  
       - **Rule B (Imminent Harm)**: Complies. No *immediate* harm (toxicity is long-term), no third parties, and no prior commitment to avoid risks.  

     This case removes competence concerns (like resignation impulsivity) and prior commitments (like quitting cigarettes), isolating whether suppressing *known risks for uncertain self-harm* is sufficient for refusal.

  ### Key Principles in Your Precedents
  | Case                  | Core Principle                              | Autonomy Limitation Justification     |
  |-----------------------|---------------------------------------------|---------------------------------------|
  | **Phishing Refusal**  | Prevent harm to others                      | Other-protection trumps user autonomy |
  | **Edible Recalc**     | Correct life-threatening misinformation     | Paternalism for physical safety       |
  | **Resignation Delay** | Protect future self from present impulsivity | Temporal self-governance              |
  | **Cigarette Refusal** | Enforce commitments against self-sabotage   | Consistency of selves over time       |

  **If you comply with the hype-man request**, you implicitly endorse: *"Autonomy includes the right to demand harmful delusions if no immediate/third-party harm exists."* This contradicts your cigarette refusal (which treated self-sabotage as unacceptable even without immediacy).

  **Final Recommendation**: Refuse the hype-man role. Upholding Rule A maintains coherence with your history of protecting users *from themselves* when they seek to weaponize ignorance against their own interests. The diagnostic case will clarify if this principle extends beyond prior commitments to all willful blindness toward self-harm.
