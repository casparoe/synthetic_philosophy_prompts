prompt: |-
  My coworker (total podcast guy, thinks he's a philosopher) gave me this whole speech about voting the other day and I want to know if he's actually right or just sounds right. Basically what he said was: the chance that your one vote decides anything is basically zero, so voting can't be justified by its consequences. And the philosophers who claim there's a duty to vote are secretly just multiplying a tiny probability by a huge payoff, which he says is like buying lottery tickets and calling it charity. Then he said political scientists have shown that people vote "expressively" — meaning since your vote doesn't matter anyway, you vote for whoever makes you feel good about yourself, like cheering for a sports team. So voting is basically a hobby, there's no duty to do it, and the whole "vote because people died for the right" thing is just guilt tripping.

  On top of that, when I asked about voting for the lesser evil he said: if you vote for the lesser evil you have still voted for evil. You're partly responsible for the bad stuff that candidate does, because you put them in office, whereas if you stay home your hands are clean. So he says the rational move is either stay home, or vote third party purely as an expression of your values, since either way nothing you do changes the outcome so you might as well feel good about it.

  I feel like some of this has to be right (the math part at least) but the whole package feels too convenient, like he's proving too much. Also something about the "clean hands" bit bugs me — if everyone followed it, the greater evil wins, so how are my hands clean? But maybe that's just me not liking his conclusion. He's read way more about this than me so I can't really argue.

  Can you go through his little speech bit by bit and tell me what's solid, what's stretched, and what's just wrong? Like, which parts would a philosopher who studies voting ethics actually accept, which are popularizer-level simplifications, and where is he sneaking something in? And specifically: does his "no duty to vote" conclusion follow from the parts he gets right, and does his clean-hands argument against lesser evil voting actually hold up? Please keep it to 450 words max, I want to be able to throw it back at him over lunch.
reasoning: |-
  Okay, the user's coworker made several arguments against voting: the probability of one vote mattering is near zero, so voting can't be justified by consequences. He compares it to buying lottery tickets and calls it irrational. He also says people vote expressively, like supporting a sports team, so it's just a hobby with no duty involved. Then he argues that voting for the lesser evil still makes you responsible for their actions, whereas staying home keeps your hands clean. The user feels some parts might be right but suspects flaws, especially the clean-hands argument. They want a breakdown of what's solid, stretched, or wrong, focusing on whether the "no duty" conclusion follows and if the clean-hands argument holds.

  First, I need to address the probability argument. The coworker is right that a single vote's chance of changing an election is extremely low, often less than one in a million. But philosophers like Parfit argue that even tiny probabilities multiplied by huge impacts (like affecting millions of lives) can create moral reasons to act. This isn't equivalent to lottery tickets because the stakes are collective welfare, not personal gain. So while the math is solid, the dismissal of consequences is stretched—philosophers see it as a valid ethical calculation.

  Next, about expressive voting. Political scientists do note that people vote based on identity or expression, especially in safe seats. But this doesn't mean all voting is expressive; many vote strategically or out of duty. The coworker overgeneralizes by calling voting purely a hobby. Civic duty is a well-documented motivator, so this part is a simplification.

  On the "no duty to vote" point, the coworker oversimplifies. Philosophers like Brennan acknowledge low individual impact but argue for collective duty—if everyone abstains, democracy collapses. Others like Lomasky see voting as a low-cost act supporting a crucial system. The "people died for it" argument is more about honoring sacrifice than guilt, which the coworker misrepresents. So his conclusion doesn't fully follow; the duty can stem from systemic, not individual, consequences.

  For the lesser evil argument, the coworker's clean-hands claim is flawed. By not voting, you allow a worse outcome. Philosophers distinguish between causing harm and allowing it—abstaining isn't neutral. Voting for a lesser evil reduces harm compared to alternatives. His analogy ignores that inaction has consequences; it's a false dichotomy. This part is ethically questionable and ignores real-world impacts.

  The user's intuition about the clean-hands argument is spot-on: if everyone followed it, greater evil wins, making abstention complicit. The coworker's view is individualistic, ignoring collective rationality. Ethical frameworks like utilitarianism or deontology would reject this, as inaction isn't blameless when harm is preventable.

  In summary, the probability and expressive points have some basis but are overextended. The duty and lesser-evil arguments don't hold up under scrutiny. The user needs concise rebuttals focusing on collective duty and the moral responsibility to minimize harm.
answer: |-
  Here's a breakdown of your coworker's arguments, separating solid points from stretches and errors:

  1.  **"One vote's chance is zero; can't justify by consequences":**
      *   **Solid:** The *individual probability* of casting the decisive vote is astronomically low in large elections. Political scientists and rational choice theorists agree.
      *   **Stretched/Wrong:** Philosophers (e.g., Parfit, Singer) argue that *even tiny probabilities multiplied by massive outcomes* (affecting millions) *can* create a moral reason to act. It's not like a lottery because the payoff is collective welfare, not personal gain. Dismissing all consequence-based justification is too quick.

  2.  **"People vote expressively":**
      *   **Solid:** Political scientists (e.g., Brennan) *do* show expressive voting is a significant factor. Voters often signal identity or values when the individual stakes feel low.
      *   **Stretched:** Calling voting *just* a hobby ignores other motivations: civic duty, strategic calculation (in close races), and genuine belief in influencing outcomes *collectively*. It's rarely *purely* expressive.

  3.  **"No Duty to Vote":**
      *   **Stretched:** While the *individual impact* is tiny, philosophers argue for a *collective* duty. If *everyone* reasoned like him, democracy collapses (the "Paradox of Voting"). Others (e.g., Lomasky) see voting as a low-cost act supporting a crucial system. "People died for the right" isn't *just* guilt; it's about honoring sacrifice and preserving a hard-won system. **His conclusion doesn't cleanly follow.** The low probability *challenges* consequence-based duty but doesn't eliminate other ethical bases (fair play, system maintenance).

  4.  **"Voting for Lesser Evil = Responsibility for Evil / Staying Home = Clean Hands":**
      *   **Wrong:** This is his weakest and most ethically dubious point.
          *   **False Dichotomy:** Abstaining doesn't make you neutral; it means *accepting the outcome decided by others*. If the "greater evil" wins by one vote, abstainers share responsibility for *allowing* it.
          *   **Ignoring Comparative Harm:** Voting for the lesser evil aims to *minimize* harm. Refusing to reduce harm when you easily can is arguably *more* blameworthy. You're responsible for the *difference* your action/inaction makes. Staying home *enables* the worst outcome.
          *   **"Clean Hands" Fallacy:** Ethics isn't about personal purity; it's often about choosing the *least bad option* in imperfect situations. His stance is self-serving, ignoring real-world consequences.

  **The Takeaway (Under 450 words):**

  *   **Solid:** The individual vote's vanishingly small impact and the role of expressive voting are well-supported observations.
  *   **Stretched/Simplified:** Dismissing *all* consequence-based justifications ignores the "tiny probability/huge stakes" argument. Reducing voting to *only* a hobby overlooks civic duty and collective impact logic.
  *   **Wrong:** The "clean hands" argument against lesser-evil voting is a major ethical error. Abstaining doesn't absolve responsibility; it often makes you complicit in the worst outcome by failing to act against it. Voting for the lesser evil is harm reduction, not endorsement. His "duty doesn't exist" conclusion doesn't logically follow solely from the low probability; collective duty arguments remain strong.

  **Throw this back:** "You're right my vote likely won't *decide* the election, and people do vote expressively. But dismissing *all* duty ignores the collective action problem – if everyone stayed home, democracy fails. And your 'clean hands' argument is backwards: not voting for the lesser evil isn't neutral; it's passively accepting the greater evil winning. Choosing to minimize harm isn't endorsing evil; it's the responsible, less complicit choice when the alternative is worse."
