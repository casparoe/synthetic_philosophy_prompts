  The consent dilemma is multi-layered. Legally, the speaking hemisphere represents the whole person because it can articulate decisions. Ethically, we must consider if the non-verbal hemisphere's actions constitute dissent. But in medical practice, surgeons deal with ambivalent patients daily—think of addicts refusing lifesaving care while begging for help. The key difference here is the physiological split creating unambiguous contradictory signals. 

