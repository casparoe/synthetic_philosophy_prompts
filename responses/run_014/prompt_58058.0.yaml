answer: |-
  Here are seven probing questions designed for critical examination of coincidence theory, incorporating your stipulated cases and requirements:

  1. **In Flattening, the lump survives flattening while the statue does not. Given that they share all intrinsic properties at coincidence (Monday), how can the modal difference in survival conditions entail distinctness without violating the Indiscernibility of Identicals?**  
  *(Follow-up: If you appeal to sortal-governed persistence conditions, are these conditions essential to the objects? If so, how can two objects occupying the same space have different essential properties without contradiction?)*

  2. **What metaphysically grounds the difference in modal properties between coincident objects at the time of coincidence, given their identical matter, arrangement, and relational properties?**  
  *(Follow-up: If you posit primitive modal properties or sortal-essences, how is this ontologically less costly than simply denying their distinctness? Doesn’t this multiply fundamental properties arbitrarily?)*  

  3. **When the statue and lump coincide on the pedestal (Monday), how many *material objects* are present? If two, how should practical reasoning (e.g., selling, insuring, or pointing to "that thing") accommodate this without contradiction?**  
  *(Follow-up: If practical contexts select one sortal (e.g., "statue" for auction), does this imply that the other object (the lump) is irrelevant? If so, doesn’t this undermine the claim that both are equally real?)*  

  4. **In Rework, the Wednesday statue is qualitatively identical to the Monday statue but made from the same clay after a temporal gap. Does coincidence theory imply that the Wednesday statue is numerically identical to the Monday statue, a new statue, or both?**  
  *(Follow-up: If persistence requires spatiotemporal continuity, how could the Wednesday statue be identical to the Monday statue? If sortals ground identity across gaps, why can’t the same apply to the statue and lump during coincidence?)*  

  5. **In Conservation, after gradual replacement of half the clay, does the original bust persist? Does the lump? If the bust persists despite material change but the lump does not, what explains this divergence given their initial coincidence?**  
  *(Follow-up: If the lump ceases to exist because it loses essential parts, but the bust persists due to functional continuity, doesn’t this imply that *being a lump* has stricter mereological requirements than *being a statue*? Is this plausible?)*  

  6. **During coincidence (e.g., Monday), is the lump a proper part of the statue? If not, why not, given that they share all matter? If so, how can a proper part be spatially coextensive with its whole?**  
  *(Follow-up: If you deny parthood to avoid this, what principle governs why spatially coincident objects with the same matter aren’t part-related? Does this not violate standard mereology?)*  

  7. **If coincident objects (statue/lump) share all matter and spatial location at *t*, what prevents causal overdetermination? For example, if the statue shatters because it’s fragile, is the shattering caused twice—once by the statue and once by the lump?**  
  *(Follow-up: If you claim causal powers are sortal-sensitive (e.g., only the statue has fragility), how can this be reconciled with physicalism, given identical microstructure?)*  

  ---

  ### Design Rationale:
  - **Modal Difference Focus**: Question #1 directly targets the inference from modal variance to distinctness in Flattening, pressing on Leibniz's Law.  
  - **Grounding Challenge**: Question #2 demands an account of modal differences without recourse to matter/arrangement, anticipating and challenging primitivist replies.  
  - **Counting/Pragmatics**: Question #3 forces confrontation with real-world implications (e.g., selling "an object"), testing whether coincidence is reconcilable with ordinary reasoning.  
  - **Persistence Tests**:  
    - **Rework** (Q#4) probes identity across temporal gaps, challenging continuity-based objections.  
    - **Conservation** (Q#5) examines gradual replacement, stressing divergence in persistence conditions.  
  - **Additional Depth**: Q#6 (parthood) and Q#7 (causation) expose further costs regarding mereology and causal exclusion.  
  - **Follow-ups**: Each anticipates standard coincidence-theorist moves (sortals, primitivism) and presses foundational commitments (essentialism, ontology, mereology, physicalism).  

  These questions avoid exposition by presupposing familiarity with core arguments (e.g., modal differences, grounding problems) and target the theory’s internal tensions and external implications.
