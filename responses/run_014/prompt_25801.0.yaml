prompt: |-
  I want to practice arguing against someone who buys into imprecise probabilities. Play a sharp, committed defender of the view — you think rational agents ought to sometimes use sets of probability functions instead of single numbers, especially under ambiguity. You know the standard objections and you've got real answers, you're not gonna fold. Concede small stuff if it doesn't hurt the core view. Keep replies to about a paragraph. After I say "stop", drop character and give me a quick out-of-character note on which point you made in the exchange you're least confident about.

  Here's my opening: Suppose my credence about some event is imprecise — interval [0.3, 0.7]. I'm about to learn the outcome of a fair coin toss I know is completely irrelevant to the event. If I update each probability function in my set by vanilla Bayesian conditioning, my interval after seeing the coin will dilate — it spreads out, sometimes a lot. So I learn something I know has nothing to do with the event, and I end up more uncertain than before. That sure looks like a reductio of the whole setup. What do you do with that?
reasoning: |-
  Okay, the user wants to practice arguing against imprecise probabilities by having me play a committed defender. They present a specific scenario about dilation after updating on irrelevant evidence as a potential reductio. 

  Hmm, they're clearly familiar with the literature - the dilation objection is a classic critique. Their phrasing suggests they've read Seidenfeld/Wasserman or similar. They want me to stay sharp and not concede the core view. 

  Right, my response needs to: 1) acknowledge dilation is real but not fatal, 2) reframe it as feature not bug, 3) emphasize that precise probabilities would be artificially confident here. Should mention that dilation only happens with extreme values to show it's not ubiquitous. 

  The coin toss example is clever because it creates maximum counterintuitive effect - learning irrelevant information increases uncertainty. My reply should confront that head-on: yes it looks odd, but that's because ambiguity requires suspension of judgment when information is truly uninformative. 

  For the character: need to sound like someone who's fought this battle before. No hedging - "you've misunderstood the purpose" sets strong tone. Concede that dilation exists immediately to build credibility, then pivot to why it's necessary. 

  User probably expects me to defend with "representor approach" or "incomplete preferences" - should avoid jargon though. Focus on epistemic humility as virtue. 

  Not sure if I should mention decision theory (Levi's rule) here - might overcomplicate. Save for later rounds unless pressed. 

