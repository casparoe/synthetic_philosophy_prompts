  Below is a decision tree designed to diagnose commitments on transworld identity vs. counterpart theory using concrete cases. The tree avoids jargon in branch nodes, uses your specified cases to force consequential choices, covers logically coherent positions (even if unattractive or unexplored), and flags closely clustered views. Each leaf names a position and highlights its "most awkward bullet to bite." Haecceitism (whether bare non-qualitative differences between worlds are possible) is treated as a cross-cutting axis, tested early.

  ---

  ### **Decision Tree**

  #### **Node 1: Bare-Difference Case**  
  *Two worlds are qualitatively identical (same properties, same events, same patterns), but you’re told they differ in which individual is which (e.g., in World A, Bob has property P and in World B, Sally has P, even though everything else is symmetric). Does this difference mean anything?*  
  - **Yes, it’s a real difference (accepts haecceitism)** → Go to Node 2.  
  - **No, it’s meaningless (rejects haecceitism)** → Go to Node 3.  

  ---

  #### **Node 2 (Accepts Haecceitism): Origin Case**  
  *Could Hubert Humphrey have been born to different parents?*  
  - **No, he must have those exact parents to be Humphrey** → Go to Node 4.  
  - **Yes, the same Humphrey could have had different parents** → Go to Node 5.  

  #### **Node 3 (Rejects Haecceitism): Humphrey Case**  
  *When we say "Humphrey could have won the 1968 election," must the winner be Humphrey himself (the very same person), or is it enough that someone like him wins?*  
  - **Must be Humphrey himself** → Go to Node 6.  
  - **Enough to have someone like him** → Go to Node 7.  

  ---

  #### **Node 4 (Haecceitism + Origins Essential): Context-Shiftiness Case**  
  *In different conversations, could the same pair of worlds count as sharing "the same person" in one context (e.g., discussing careers) but not in another (e.g., discussing biology)?*  
  - **Yes, it depends on context** → **Leaf: Lewis’s Counterpart Theory** (haecceitist variant).  
    - *Most awkward bullet:* Identity can shift mid-conversation if context changes (e.g., Humphrey is "you" when discussing politics but not when discussing genetics).  
  - **No, it’s absolute and context-independent** → **Leaf: Kripke-Style Transworld Identity**.  
    - *Most awkward bullet:* You can stipulate identities that defy intuition (e.g., "This dog is actually Napoleon") as long as essential properties (e.g., origins) hold.  

  #### **Node 5 (Haecceitism + Origins Not Essential): Fission Case**  
  *After fission (e.g., teleportation duplicates you into two people), is the original person identical to both duplicates?*  
  - **Yes, the original is both (or it’s ambiguous)** → **Leaf: Adams-Style Primitive Thisness**.  
    - *Most awkward bullet:* Identity doesn’t require qualitative similarity at all—Humphrey could be a teapot in another world if his "thisness" is preserved.  
  - **No, the original isn’t identical to either (or at most one)** → **Leaf: Plantinga’s Transworld Identity**.  
    - *Most awkward bullet:* Humphrey’s essence includes trivial properties (e.g., "being Hubert Humphrey"), making essentialism tautological.  

  #### **Node 6 (Rejects Haecceitism + Must Be Humphrey): Fission Case**  
  *After fission, is the original person identical to both duplicates?*  
  - **Yes, or it’s indeterminate** → **Leaf: Coherent but Unnamed (Radical Perdurantism)**.  
    - *Most awkward bullet:* Identity can be one-to-many, violating the transitivity of identity (e.g., you = duplicate A and you = duplicate B, but A ≠ B).  
  - **No, and identity must be unique** → **Leaf: Incoherent Position**.  
    - *Why:* Rejecting haecceitism but demanding strict transworld identity requires a qualitative basis for identity, yet fission blocks uniqueness. Logically unstable.  

  #### **Node 7 (Rejects Haecceitism + Counterpart Suffices): Context-Shiftiness Case**  
  *Can the counterpart relation change with context?*  
  - **Yes, context determines similarity** → **Leaf: Lewis’s Counterpart Theory** (standard anti-haecceitist).  
    - *Most awkward bullet:* What’s possible for you changes based on conversational interests (e.g., you could have been a lawyer if we focus on skills, but not if we focus on DNA).  
  - **No, it’s fixed by objective similarity** → **Leaf: Coherent but Unnamed (Fixed Counterpart Theory)**.  
    - *Most awkward bullet:* Counterparts are rigidly defined (e.g., by biology), so you couldn’t have had a different career if it alters your "similarity essence."  

  ---

  ### **Leaf Summaries & Awkward Bullets**
  1. **Lewis’s Counterpart Theory** (haecceitist variant):  
     - *Awkward bullet:* Identity shifts with conversational context—e.g., you’re not "the same person" when discussing your job vs. your childhood.  
  2. **Kripke-Style Transworld Identity**:  
     - *Awkward bullet:* Identity is based on stipulation, so we could declare (without qualitative basis) that a different child is "Humphrey" if it has his parents.  
  3. **Adams-Style Primitive Thisness**:  
     - *Awkward bullet:* Identity is grounded in a bare "haecceity" with no qualitative constraints—Humphrey could exist in a world where he’s a rock.  
  4. **Plantinga’s Transworld Identity**:  
     - *Awkward bullet:* Individual essences include trivial properties (e.g., "being identical to Plantinga"), making essentialism non-explanatory.  
  5. **Radical Perdurantism**:  
     - *Awkward bullet:* One person can be identical to two distinct individuals after fission, breaking standard logic.  
  6. **Fixed Counterpart Theory**:  
     - *Awkward bullet:* Modal claims are inflexible—e.g., you couldn’t have been born in France if your fixed "similarity profile" requires being born locally.  
  7. **Incoherent Position**:  
     - *Awkward bullet:* Combines contradictory commitments (anti-haecceitism + strict transworld identity + fission uniqueness).  
  8. **Modal Fictionalism** (if user rejects reality of worlds at any node):  
     - *Awkward bullet:* All modal truths (e.g., "Humphrey could have won") are just useful fictions with no grounding in reality.  

  ---

  ### **Notes on Logical Space & Unexplored Branches**  
  - **Haecceitism is orthogonal**: It cuts across positions (e.g., Lewis has anti-haecceitist and haecceitist variants; Kripke/Adams/Plantinga are haecceitist).  
  - **Coherent but Unnamed/Unpopular**:  
