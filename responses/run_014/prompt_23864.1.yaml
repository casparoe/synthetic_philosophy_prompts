    - *Node 6 ("Yes" branch)*: Underexplored—allows indeterminate identity but violates Leibniz’s Law.  
    - *Node 7 ("No" branch)*: Unpopular—fixed counterparts are too rigid for everyday modal talk.  
  - **Incoherent Combinations**:  
    - *Node 6 ("No" branch)*: Rejects haecceitism and counterpart theory but demands unique transworld identity in fission—impossible without qualitative individuation.  
  - **Indistinguishable Leaves**:  
    - **Kripke vs. Plantinga**: The tree *can* separate them (Kripke allows stipulation; Plantinga requires essences), but in practice, they agree on cases. Use Node 4: Kripke bites stipulation; Plantinga bites trivial essences.  
    - **Adams vs. Plantinga**: Adams rejects qualitative constraints; Plantinga builds them into essences. Clear in Node 5.  

