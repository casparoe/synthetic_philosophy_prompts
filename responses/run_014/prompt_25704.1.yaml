  Then the friend shifts to saying the drug makes the hitchhiker moral, not irrational. This challenges the initial assumption that robbing is rational. The user points out this is a different argument. Here, the friend is conflating two points. The coherence of rational irrationality doesn't depend on the theory of rationality used. Even with a narrow self-interested view, the hitchhiker's choice can be seen as rational self-preservation through self-modification. 

