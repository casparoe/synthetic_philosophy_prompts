  Okay, let me start by unpacking the user's question. He's a retired physics professor who's been diving into ethics. At a dinner party, his friend, a philosophy professor, explained the "standing to blame" debate, focusing on hypocrisy and logical consistency. The user feels something's off but can't pinpoint it. He wants to know where his friend's summary holds up and where it oversimplifies, especially the reduction of standing to sincerity and the logical consistency angle.

  First, I need to recall the key points in the friend's argument: hypocrisy undermines blame because of inconsistency, which makes blame self-defeating. The friend then reduces standing to sincerity—if you're hypocritical, your blame isn't sincere. But the user suspects this misses deeper normative issues. 

  I remember that the literature on standing to blame is more nuanced. Philosophers like R.A. Duff and Pamela Hieronymi discuss hypocritical blame as a violation of relational norms, not just logic. The user’s physics background might make him sensitive to over-simplified models. He’s used to complex systems, so a purely logical approach might feel reductionist. 

  Breaking down the friend's points: 
  1. Hypocrisy as logical inconsistency. But philosophers argue that blame isn't just a proposition; it’s a speech act with normative expectations. So the inconsistency isn't merely logical—it's about authority and relational standing. 
  2. The "obvious reply" that hypocrisy implies insincerity. But is that always true? What about weakness of will? Someone might genuinely believe littering is wrong but fail to act. Their blame could still be sincere, even if flawed. 
  3. Reducing standing to sincerity. This ignores cases where even sincere hypocrites lack standing because their actions damage the moral community. For example, a serial liar blaming someone else for lying—even if sincere in that moment, their past actions undermine their authority.

  The user’s deeper need might be to understand the ethical dimensions beyond logic. His suspicion about dissolving normative questions into logical ones is valid. He might want to see how ethics handles complexities that physics does—systems where multiple factors interact. 

  Also, considering his interest in blame and responsibility, he might be exploring how individuals hold each other accountable in a community. The relational aspect of blame is crucial here. The dinner party context suggests he’s encountering these ideas in real-life discussions, so practical examples would help. 

  I should highlight the distinctions philosophers make: sincerity vs. standing, logical consistency vs. normative authority. Pointing out thinkers like Wallace and Scanlon can show the broader debates. Emphasizing that hypocrisy affects the blamer's moral position, not the truth of the blame, addresses his concern about dissolving normative issues. 

  His background in theory makes him wary of oversimplification. So, clarifying that while logic plays a role, the core is normative—about relationships and community standards—will resonate. Examples like systemic injustice cases where victims blame perpetrators, even if not "pure," show why standing isn't just about sincerity. 

  In conclusion, the friend’s summary captures surface logic but misses the ethical depth. The user’s intuition about normative stakes is spot on. Providing a structured breakdown of where the friend is right, where he oversimplifies, and the richer philosophical landscape should satisfy his curiosity and validate his suspicions.
answer: |-
  You're absolutely right to be suspicious—this dinner-party summary captures a common *starting point* in the standing-to-blame debate but flattens crucial distinctions philosophers actually wrestle with. Your friend's "logical consistency + sincerity" reduction is a recognizable position (sometimes called the **Inconsistency Objection**), but it's far from the consensus, and most contemporary work argues it misses the deeper normative core of "standing." Here's a breakdown:

  ### What Your Friend Got Right (The Common Starting Point)
  1.  **Hypocrisy as a Problem:** Philosophers largely agree that hypocritical blame (blaming others for acts you yourself commit/recently committed) is *problematic* and often undermines the blamer's authority or legitimacy.
  2.  **The Inconsistency:** The logical inconsistency *is* a common observation: "You say X is wrong, yet you do X." This *prima facie* undermines the blamer's credibility.
  3.  **The Sincerity Challenge:** The point that the hypocrite's actions cast doubt on their *sincerity* ("If you *really* believed it was wrong, you wouldn't do it") is a standard move in the debate (often associated with **R. Jay Wallace** or early formulations).

  ### Where Philosophers Push Back (The Core of the Debate)
  1.  **Beyond Logical Consistency to Normative Standing:**
      *   **The Crucial Insight:** Philosophers like **R.A. Duff**, **Pamela Hieronymi**, **Macalester Bell**, and **T.M. Scanlon** argue the *primary* problem isn't *logical inconsistency* per se, but a **failure of normative authority or relational standing**. Blame isn't just stating a proposition ("X is wrong"); it's a **normative demand** made *to* the wrongdoer *from a specific position* within a moral community.
      *   **The Analogy:** Think of a judge sentencing a thief while having stolen goods in their own pocket. The problem isn't just that their words contradict their actions (logic). The problem is they've **undermined their own moral authority to sit in judgment** and make that demand *of others*. Their actions compromise their position *within the practice* of holding others accountable.
      *   **The Standing Question:** "Standing" asks: *By what right do you make this demand of me?* Hypocrisy suggests you lack the *moral position* or *relational purity* to issue this specific rebuke. You are, in effect, demanding of others a standard you refuse to hold yourself to, which violates a norm of reciprocity inherent in the practice of mutual accountability.

  2.  **Challenging the Sincerity Reduction:**
      *   **Weakness of Will:** Your friend's "obvious reply" assumes hypocrisy *always* proves insincerity. Philosophers (e.g., **Gideon Rosen**) point out **weakness of will (akrasia)**: Someone can *genuinely* believe littering is wrong, blame you for doing it, *and yet* still litter themselves in a moment of laziness or frustration. Their blame might be sincere *and* logically inconsistent. The standing objection still applies: even if sincere, their *failure to live up to the standard they invoke* undermines their authority to *demand* that standard of *you*.
      *   **Sincerity ≠ Standing:** One can blame *sincerely* but *without standing*. A serial adulterer might sincerely believe adultery is wrong and sincerely blame their spouse for it. But their own adultery likely robs them of the *standing* to make that demand *of their spouse* – not because they're insincere *now*, but because their actions have placed them in the wrong relational position to issue *this specific rebuke*.
      *   **Standing Without Purity?:** The debate also explores whether someone needs to be morally *perfect* to have standing (clearly not) or whether *relevant* past wrongs suffice to undermine it. (e.g., Does a former litterbug who reformed 20 years ago have standing? Probably yes. Does a current litterbug? Probably not).

  3.  **The Insufficiency of the "Truth" Defense:**
      *   Your friend mentions the pushback: "The hypocrite's blame can still be *true*." Philosophers (e.g., **Scanlon**) largely grant this! The *truth* of the blame-judgment ("Your littering was wrong") isn't what's primarily at stake with standing.
      *   **The Distinction:** The objection isn't that the hypocrite's *statement* ("Littering is wrong") is false. It's that their *act of blaming* (issuing the rebuke, making the demand) is **inappropriate, illegitimate, or lacks force** *coming from them*. It's about the **illocutionary force** (the act performed *by* speaking) of blame, not just its propositional content.

  ### Does "Standing Reduce to Sincerity"? No, It Doesn't Follow.
  Your friend's conclusion ("the standing point reduces to a sincerity point") is precisely what much of the literature argues *against*. Here's why:
  1.  **The Akrasia Problem:** As above, insincerity isn't *necessary* for lacking standing (the weak-willed blamer).
  2.  **The Relational Problem:** Even a *sincere* hypocrite often lacks standing because their actions have damaged the relational symmetry or authority needed for *their specific act of blaming* to be legitimate *demands* on the other person. Their blame might be true and sincere, but it becomes an act of **bad faith** or **presumption** given their own conduct.
  3.  **The Normative Function of Blame:** Blame serves functions like calling the wrongdoer to account, demanding acknowledgement/amends, and affirming shared norms. A hypocrite's blame often **corrupts this function**. It can feel like an attack, hypocrisy-hijacking, or an assertion of undeserved superiority rather than a genuine call to moral repair. This functional failure is rooted in the hypocrite's *position*, not necessarily their momentary sincerity.

  ### Why the "Logical Consistency" Framing Feels Too Neat (You're Spot On)
  Your instinct is correct. Framing it *purely* as logical inconsistency:
  *   **Reduces Morality to Logic:** It turns a rich *normative* and *relational* practice (holding each other accountable) into a dry exercise in avoiding self-contradiction. Morality involves demands, expectations, relationships, and community standards – not just propositional truth-values.
  *   **Misses the Relational Stakes:** The pain of being blamed by a hypocrite isn't usually "Aha! You contradicted yourself logically!" It's "Who are *you* to judge *me* for this, given what *you* do?" It's an objection to the blamer's *presumption* or *authority*, rooted in their own conduct.
  *   **Oversimplifies Blame:** It treats blame as merely asserting a proposition ("X is wrong") rather than performing a complex social act with normative force directed at another agent.

  ### Conclusion: What's Really at Stake?
  The contemporary debate centers on **what gives someone the moral authority or relational position to legitimately issue a demand for accountability to a specific wrongdoer**. Hypocrisy (committing the very wrong one is blaming) is a **paradigm case** of *losing* that standing, primarily because:
  1.  It violates norms of **reciprocity** (you demand of others what you won't demand of yourself).
  2.  It undermines the blamer's **credibility as a moral interlocutor** on *this specific issue*.
  3.  It can **distort the message of blame** (making it seem like personal attack or hypocrisy-hunting rather than a call to moral repair).
  4.  It often constitutes **bad faith** engagement with the moral community's norms.

  While logical inconsistency and potential insincerity are *symptoms* or *common causes* of lacking standing, they are not the *essence* of the problem. The core is **normative authority within the practice of mutual accountability**. Your friend presented a simplified, logic-heavy version; the actual literature grapples with the much messier, richer, and fundamentally *ethical* question of *who gets to blame whom, and under what conditions, within our shared moral life*. Your suspicion that something normative was being dissolved into logic was well-founded. Keep reading – you're clearly engaging with the material at the right level! Dive into Scanlon's *Moral Dimensions* or Hieronymi's work on standing for deeper dives.
