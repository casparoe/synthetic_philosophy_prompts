prompt: |-
  I'm the quantitative geneticist at a mid-sized layer-hen breeding company, and I need a standing decision procedure more than I need another argument. Background: most of our history is individual selection on single-hen cage records — egg production to the gram, perfect pedigrees, no interaction between birds. New welfare rules mean our birds and our customers' birds will live in large colonies, and instrumenting colony housing (RFID per bird, individual feed intake) runs about 8x the cost per bird, so we can only instrument a fraction of any flock. Every selection cycle we end up re-litigating the same fight: do we select on the individual records we have on the subflock, on group means over whole colonies, or some blend? The sales team, the welfare consultant, and I all have different gut answers. The breeding director has told me to write down a procedure the junior geneticists can actually run so he stops adjudicating this by vibe. He signs off on whatever the procedure recommends, so the handoff points matter.

  Here's my problem though: a philosophy-of-biology friend of mine told me our fight is basically the old units-of-selection debate — genes vs individuals vs groups, Dawkins and Gould, Sober and Wilson, multilevel selection, the Price equation partition, something called contextual analysis where you regress individual fitness on the bird's own trait and separately on its group's mean. I've read enough to follow the shape of it but I'm no philosopher and no theorist; what I'm fluent in is mixed models, BLUP, kinship matrices, and experimental design. So turn whatever that literature actually says into a procedure I can run in an afternoon with data we really have: colony-level production and mortality records, individual records on the instrumented subset, full pedigrees, batch structure.

  What I need from the procedure:

  - The questions in order, what counts as a sufficient answer to each, and where the procedure terminates with a clear "select on individuals" or "select on group means" versus where it has to punt to the director because the remaining question is about money or values, not statistics.
  - It has to encode the distinction the philosophers actually care about: cases where individual and group selection pull the same direction versus cases where they genuinely conflict. (Feather pecking is our classic conflict trait — individually productive birds can be awful cagemates — but I want the procedure general, not a one-trait hack.)
  - Somewhere it has to be honest about the equivalence point: whether picking the individual or the group description ever changes the decision, or whether it's just bookkeeping with different column headers.
  - Run it on three cases: (1) feather pecking and mortality in colony housing, where individual selection historically made things worse; (2) feed conversion efficiency, where I suspect individuals and colonies agree; (3) resistance to a challenge disease where birds get dosed in batches, so the only records that exist are batch-level — no individual option at all.
  - One of those cases should come out the way I won't like — I have a feeling it's the pecking one, and the right answer is expensive — and I want you to actually bite that bullet rather than soften it.

  Also flag what the procedure can't settle, so the juniors know when to escalate instead of trusting it. And please be upfront about confidence throughout: mark which steps are load-bearing theory and which are rules of thumb dressed up as procedure, and single out the one point in the whole thing you're least sure of.
reasoning: |-
  We are designing a standing decision procedure for a layer-hen breeding company facing new welfare rules that require colony housing. The procedure must decide whether to select on individual records (from an instrumented subset), group means, or a blend. The procedure must be based on data available: colony-level production and mortality records, individual records on a subset, full pedigrees, and batch structure.

  The procedure will use the Price equation partition and contextual analysis to distinguish between individual and group selection. The key is to estimate the strength and direction of selection at both levels and see if they conflict.

  Steps of the procedure:

  1. **Data Preparation**:
     - Organize the data: For each colony (group), we have:
       - Group-level traits: total egg production, total feed intake (if available), mortality rate, etc.
       - Individual-level traits (for the instrumented subset): egg production, feed intake, feather pecking score (if available), etc.
     - Pedigree: Full pedigree information to construct the relationship matrix (A).
     - Batch structure: Note which colonies are in the same batch (e.g., same time, same house).

  2. **Define the Fitness Measure**:
     - In natural selection, fitness is often survival and reproduction. In our context, we can define a proxy for fitness. For example:
       - For individual selection: individual egg production (or a composite index including other traits) might be the target.
       - For group selection: group mean egg production (or group total, but note that group size may vary due to mortality) is the target.
     - However, note that in our breeding goal, we want to improve the trait in the colony environment. Therefore, the fitness of an individual might be influenced by both its own traits and the traits of its group.

  3. **Contextual Analysis via Mixed Models**:
     - We will fit a mixed model that includes both individual and group effects to partition the selection into individual and group levels.
     - Model for a trait (e.g., individual egg production) as the response:
          y_ij = μ + β1 * x_ij + β2 * x_bar_j + b_i + g_j + e_ij
       where:
          y_ij: the fitness measure for individual i in group j (if we are modeling fitness directly) OR a trait that is a component of fitness (like egg production). Alternatively, we might model a fitness proxy (like survival or egg production) as the response.
          x_ij: the individual's own phenotypic value for a trait (e.g., individual feed conversion efficiency, or feather pecking behavior).
          x_bar_j: the group mean of the trait x (excluding the individual i, if desired, to avoid confounding) for group j.
          b_i: random effect for individual i (with covariance structure given by the pedigree, i.e., b ~ N(0, A * σ^2_a) where A is the relationship matrix).
          g_j: random group effect (to account for shared environment of the group, g ~ N(0, I * σ^2_g)).
          e_ij: residual.

     - Note: The coefficient β1 represents the effect of the individual's own trait on its fitness (holding the group mean constant). This is the direct (individual-level) selection.
     - The coefficient β2 represents the effect of the group mean trait on the individual's fitness (contextual effect). This captures the group-level selection.

     - Interpretation:
       - If β1 is positive and significant, then individuals with higher trait values have higher fitness (at the individual level).
       - If β2 is positive and significant, then being in a group with a higher mean trait value increases individual fitness (a positive group effect).
       - However, note that the group mean trait (x_bar_j) might be correlated with the individual's trait (x_ij) because of shared genes and environment. The model attempts to separate these by including both.

     - Conflict: If β1 and β2 have opposite signs, then there is a conflict between individual and group selection. For example, in feather pecking:
          - Suppose x_ij is the feather pecking behavior (higher = more pecking). 
          - β1 might be positive: a bird that pecks more might have higher individual fitness (e.g., by gaining more resources).
          - β2 might be negative: being in a group with high average pecking (i.e., a lot of pecking going on) reduces individual fitness (due to stress, injury, etc.).
          - This conflict means that selecting on individual pecking (to increase it) would be detrimental at the group level.

  4. **Testing for Conflict**:
     - We test the null hypothesis that β1 and β2 are both zero (or not) and note the signs and significance.
     - Specifically, we are interested in whether β1 and β2 have opposite signs (indicating conflict) and whether the magnitude of the conflict is large enough to matter.

  5. **Decision Rule**:
     - If there is no conflict (β1 and β2 same sign, or one is zero and the other is not, or both not significant) then:
          - We can select on individual records (if available and cost-effective) because individual selection will align with group performance.
          - However, if individual records are too expensive to obtain for the trait, then we can use group means.

     - If there is conflict (β1 and β2 opposite signs and both significant) then:
          - We must use group selection (or a multilevel selection index that accounts for both) to avoid worsening the group trait.
          - In this case, selecting on individual records alone would be harmful for the group.

     - If the results are mixed (e.g., one significant and the other not, or opposite signs but one not significant) then we need to consider the cost and the magnitude of the effects. This is a point where we might need to escalate.

  6. **Handling Traits with Only Group Records**:
     - For traits where only group records exist (like resistance to a challenge disease at batch level), we cannot get individual records. Then we must use group means for selection. The procedure would note that there is no individual option and default to group means.

  7. **Procedure Steps in Order**:

     Step 1: **Define the Trait and Fitness Proxy**
     - For the trait under selection (e.g., feed conversion efficiency, feather pecking, disease resistance), define a fitness proxy. This could be:
          - For production traits: individual egg production (for individual fitness) and group mean egg production (for group fitness). But note: we are interested in how the trait affects fitness. Alternatively, we can model the trait as the predictor and a fitness measure (like egg production or survival) as the response.
     - Clarification: We are interested in the effect of the trait (e.g., feather pecking) on fitness. So we set:
          - Response (y_ij): a fitness measure (e.g., egg production of individual i in group j, or survival of individual i in group j).
          - Predictors: 
              x_ij: the individual's trait value (e.g., feather pecking score) 
              x_bar_j: the group mean of the trait (for feather pecking, we might use the group mean excluding individual i to avoid confounding).

     Step 2: **Check Data Availability**
     - If the trait is only measured at the group level (like batch-level disease resistance), then skip to Step 6 (select on group means).
     - Otherwise, we have at least a subset of individual records.

     Step 3: **Fit the Contextual Analysis Mixed Model**
     - Using the available individual records (and group means for the same groups), fit the mixed model as described.
     - Use REML or Bayesian methods to estimate β1 and β2 and their standard errors.
     - Include the random effects: individual additive genetic effect (with pedigree) and group environment effect.

     Step 4: **Test for Conflict**
     - If β1 and β2 are both significantly different from zero and have opposite signs, then we have a conflict.
     - Significance level: use 0.05, but note that with large data, even small effects can be significant. Also consider the magnitude of the coefficients.

     Step 5: **Decision Based on Conflict**
     - If conflict is detected (opposite signs and both significant), then:
          - Selection must be based on group means (or a multilevel index that accounts for both levels) for this trait.
          - Reason: individual selection would favor traits that are detrimental at the group level.
     - If no conflict (same signs, or one is not significant) then:
          - We can use individual records for selection (if available and cost-effective) because they align with group performance.
          - If individual records are too expensive, then using group means is acceptable (but note: individual selection would be more accurate if there is no conflict and we have individual records).

     Step 6: **Traits with Only Group Records**
     - For traits without individual records, we default to group means.

     Step 7: **Cost-Benefit Considerations (Escalation Point)**
     - If the procedure recommends group selection but the cost of obtaining group means (which we already have) is acceptable, then we proceed.
     - However, if the procedure recommends individual selection but the cost of instrumenting for individual records is prohibitive, then we must consider:
          - The loss in accuracy by using group means instead of individual records in the absence of conflict.
          - This is a cost-benefit decision that the breeding director must make, because it involves money and values (how much accuracy is worth the cost?).
     - Therefore, the procedure stops at the statistical decision (individual or group) and then the cost of obtaining the data is a separate issue.

     Step 8: **Output**
     - The procedure outputs a clear recommendation: "select on individual records" or "select on group means" for the trait.
     - In the case of conflict, it will recommend group means. Without conflict, it recommends individual records (if available) or group means (if individual records are not available).

  8. **Run the Procedure on Three Cases**:

     Case 1: Feather Pecking and Mortality
     - Trait: feather pecking behavior (x_ij). 
     - Fitness proxy: individual egg production (or survival) in the colony.
     - We expect:
          β1 (individual effect): positive (birds that peck more might have higher fitness individually).
          β2 (group effect): negative (being in a high-pecking group reduces fitness).
     - Conflict detected: recommend group selection.

     Case 2: Feed Conversion Efficiency (FCE)
     - Trait: individual feed conversion efficiency (lower FCE is better, but we might define the trait as efficiency = egg mass / feed intake, so higher is better).
     - Fitness proxy: individual egg production (or we might use a different fitness proxy? Actually, in breeding, we often select directly on FCE. However, to see the effect on fitness, we might consider that efficient birds produce more eggs per feed. But note: in a colony, an efficient bird might not necessarily harm others. We suspect no conflict.
     - Model: 
          y_ij = egg production of bird i in group j
          x_ij = FCE of bird i
          x_bar_j = group mean FCE
     - Expectation: 
          β1: positive (efficient birds produce more eggs)
          β2: positive (being in an efficient group might mean less competition for feed, so more eggs for all) or zero. 
     - No conflict: recommend individual selection (if individual records are available).

     Case 3: Resistance to a Challenge Disease
     - Trait: disease resistance (binary: survived or not, or titer level). But note: only batch-level records exist (e.g., proportion surviving in a batch). 
     - Step 2: no individual records -> skip to Step 6: select on group means.

  9. **Honesty about Equivalence**:
     - The procedure notes that when there is no conflict, individual selection and group selection will lead to the same direction of change. However, the accuracy of selection may differ. With individual records, we have more data points and can estimate breeding values more accurately. Using group means, we have fewer data points and the group mean is an average that reduces the signal. But the selection decision (which birds are best) should be similar if the group effect is negligible.

     - However, when there is conflict, the two methods will lead to opposite directions: individual selection would favor the trait that is harmful at the group level. Then they are not equivalent.

  10. **Confidence and Limitations**:
      - The procedure relies on the contextual analysis model. The key assumption is that we have correctly modeled the fitness proxy and that the random effects account for the relatedness and group environment appropriately.
      - The most critical step (and the one I'm least sure of) is the definition of the fitness proxy. In a breeding context, we are often selecting for multiple traits, and the fitness proxy might be an economic index. However, for the purpose of detecting conflict for a single trait, we use a component of fitness that is directly affected by that trait.
      - Another limitation: the model requires individual trait data for at least a subset. If that subset is small, the estimates of β1 and β2 might be imprecise. In that case, we might need to rely on prior knowledge or escalate.
      - The procedure does not account for interactions between traits. We are analyzing one trait at a time.
      - The procedure cannot account for the possibility that the group effect might be non-linear (but we assume linearity in the model).

      Steps that are load-bearing theory:
          - The use of the contextual analysis model (with both individual and group mean predictors) to separate individual and group selection. This comes from the multilevel selection theory.
          - The interpretation of opposite signs as conflict.

      Rules of thumb:
          - Using a 0.05 significance level for the coefficients.
          - Using individual egg production or survival as fitness proxies (but these are standard in poultry breeding).

  11. **Escalation Points**:
      - When the data are insufficient (e.g., too few instrumented birds) to get precise estimates of β1 and β2.
      - When the results are ambiguous (e.g., one coefficient is significant and the other is not, or they are opposite in sign but one is not significant). Then we need to consider the cost of being wrong and the magnitude of the coefficients. This becomes a decision under uncertainty that the director must make.
      - When the trait is not easily defined (e.g., a behavioral trait that is hard to measure) and we are unsure of the fitness proxy.

  Procedure Summary:

  1. Define the trait and fitness proxy for the current selection cycle.
  2. Check data availability for the trait:
     a. If only group records: recommend group selection and terminate.
     b. If individual records available (even on a subset): proceed.
  3. Fit the contextual analysis mixed model (with individual trait, group mean trait, individual genetic random effect, group environmental random effect).
  4. Test the coefficients (β1 and β2) for significance and sign.
     - If β1 and β2 are both significant and have opposite signs: conflict -> recommend group selection.
     - Else (same signs, or at least one not significant): no conflict -> recommend individual selection (if individual records are available and cost-effective; but if too expensive, then group selection is acceptable but note that individual is more accurate without conflict).
  5. For the "no conflict" case, if individual records are too expensive to obtain, then the decision to use group means instead of individual records is a cost-benefit trade-off that must be escalated to the director. The procedure only says that without conflict, individual records are preferred for accuracy, but if they are too expensive, then group means can be used without causing harm (because there's no conflict). However, the loss in accuracy must be weighed against the cost.

  Note: In step 4, if there is no conflict, we recommend individual selection. But if the cost of obtaining individual records is prohibitive, then we might have to use group means. The procedure does not decide on cost; it only says that group means are acceptable in the absence of conflict (but less accurate than individual records). The breeding director must decide whether the cost savings are worth the loss in accuracy.

  For the three cases:

  Case 1 (Feather Pecking): 
     - Conflict detected -> recommend group selection.

  Case 2 (Feed Conversion Efficiency): 
     - No conflict -> recommend individual selection (if individual records are available and cost-effective). But if the cost of individual records is too high, then the procedure notes that group means are acceptable (but less accurate). The final decision on cost is escalated.

  Case 3 (Disease Resistance): 
     - Only group records -> recommend group selection.

  The bullet we bite: For feather pecking, we must use group selection, which might be less accurate (because we have to use group means) and we cannot rely on individual records even if we had them (because of the conflict). This is expensive because we might need to instrument more groups to get accurate group means? Actually, we already have group means for the entire colony. The cost of group means is low because we are already recording colony-level data. The problem is that for selection, we need to assign breeding values to individuals. With group selection, we would use the group mean as the phenotype for all individuals in the group (or use a model that accounts for the group structure). This reduces the accuracy per individual because we are assigning the same phenotype to all group members. But in the presence of conflict, it is necessary.

  However, note: with group selection, we can still use BLUP with the group mean as the phenotype and the pedigree to estimate breeding values. The model would be:

     y_j = μ + g_j + e_j

  where y_j is the group mean, and g_j is the genetic effect of the group (which is the average of the breeding values of the birds in the group). Then we can back out individual breeding values.

  Alternatively, we can use a multilevel model that includes both individual and group effects in the genetic evaluation. But the procedure only recommends the level (individual or group) for the phenotype to use. The actual genetic evaluation will use BLUP with the chosen phenotype and the pedigree.

  Final note: The procedure is designed to be run by junior geneticists in an afternoon. They must be familiar with mixed model fitting (using ASReml or similar). The key output is the decision: individual or group.
answer: |-
  ### Standing Decision Procedure for Selection Level in Layer-Hen Breeding

  **Core Philosophy**: Use *contextual analysis* (via mixed models) to partition selection into individual and group effects. The Price equation and multilevel selection theory show that selection acts simultaneously at both levels. **Key insight**: When the *sign* of individual and group effects conflict, group-level selection is mandatory to avoid evolutionary traps. When they align, individual selection is efficient. The procedure prioritizes statistical evidence over "vibes."

  ---

  #### **Procedure Workflow**  
  *Run in sequence; terminate early if data or conflict rules apply.*

  1. **Define Trait and Fitness Proxy**  
     - *Input*: Trait (e.g., egg production, mortality rate, feed efficiency).  
     - *Action*: Define a fitness proxy (e.g., individual egg mass for production, survival for mortality).  
     - *Escalate if*: Trait has no clear fitness link (e.g., novel behavior).  
     - *Output*: Fitness measure \( y \) (e.g., daily survival: 0/1).  

  2. **Check Data Availability**  
     - *Question*: Are *individual-level* trait records available for ≥10% of birds?  
       - **Yes** → Proceed to Step 3.  
       - **No** → **Terminate: Select on group means** (e.g., Case 3: disease resistance).  
     - *Rule*: No individual data = no choice. Use group means with pedigree-BLUP.  

  3. **Fit Contextual Analysis Mixed Model**  
     - *Model*:  
       \[
       y_{ij} = \beta_0 + \beta_1 \cdot \text{IndividualTrait}_{ij} + \beta_2 \cdot \text{GroupMeanTrait}_j + u_i + g_j + \epsilon_{ij}
       \]  
       - \( y_{ij} \): Fitness proxy of bird \( i \) in group \( j \).  
       - \( \text{IndividualTrait}_{ij} \): Phenotype of bird \( i \) (e.g., feed intake).  
       - \( \text{GroupMeanTrait}_j \): Mean trait of group \( j \) (excluding bird \( i \)).  
       - \( u_i \): Random genetic effect (BLUP with pedigree matrix \( \mathbf{A} \)).  
       - \( g_j \): Random group effect (accounts for shared environment).  
     - *Data*: Use instrumented subflock for individual traits; colony records for group means.  
     - *Software*: `lme4` in R or ASReml (code template in Appendix).  
     - *Output*: Estimates \( \hat{\beta}_1 \) (individual effect), \( \hat{\beta}_2 \) (group effect), SEs, p-values.  

  4. **Test for Conflict**  
     - *Question*: Do \( \beta_1 \) and \( \beta_2 \) have *opposite signs* and *p < 0.05*?  
       - **Yes** → **Terminate: Select on group means** (conflict detected).  
       - **No** → Proceed to Step 5.  
     - *Rule*: Conflict overrides cost/feasibility. Individual selection worsens group performance.  

  5. **Test for Alignment**  
     - *Question*: Are \( \beta_1 \) and \( \beta_2 \) *same sign* and *p < 0.05*?  
       - **Yes** → **Terminate: Select on individual records** (no conflict).  
       - **No** → Proceed to Step 6.  
     - *Rule*: Alignment means individual selection suffices.  

  6. **Ambiguity Resolution**  
     - *Scenario*: Effects nonsignificant, weak, or discordant significance (e.g., \( \beta_1 \) sig, \( \beta_2 \) not).  
     - *Action*:  
       - Compute cost-adjusted accuracy:  
         \[
         \text{AccuracyRatio} = \frac{\text{Reliability}_{\text{individual}} / \text{Cost}_{\text{individual}}}{\text{Reliability}_{\text{group}} / \text{Cost}_{\text{group}}}
         \]  
         - Reliability from BLUP model heritability.  
         - Cost: RFID cost vs. colony recording.  
       - **If AccuracyRatio > 1.5**: Select on individuals.  
       - **Else**: Select on group means.  
     - *Escalate to Director*: Ambiguity + AccuracyRatio ≤ 1.5 (tradeoff requires value judgment).  

  ---

  #### **Key Distinctions & Philosophical Honesty**  
  - **Conflict vs. Alignment**:  
    - Conflict (e.g., feather pecking): Individual gain (higher rank) harms group (↑ mortality).  
    - Alignment (e.g., feed efficiency): Efficient birds benefit group (↓ competition).  
  - **Equivalence Point**:  
    - When \( \beta_2 = 0 \) (no group effect), selection is identical.  
    - When \( \beta_2 \neq 0 \), methods *diverge*. Group selection accounts for social effects; individual ignores them.  
  - **What the Procedure Can’t Settle**:  
    - Cost-reliability tradeoffs when statistical evidence is ambiguous (Step 6).  
    - Defining fitness proxies for novel traits (Step 1).  
    - Ethical weights (e.g., welfare vs. profit).  

  ---

  #### **Run on Cases**  
  *Assumptions: Colony size = 100 birds; instrumented subset = 15%; \( h^2 \sim 0.3 \).*  

  1. **Feather Pecking & Mortality**  
     - Trait: Feather pecking rate (individual), group mortality.  
     - Fitness proxy: Survival (0/1).  
     - Model outcome:  
       - \( \hat{\beta}_1 = +0.15 \) (p=0.01): High pecking → higher individual survival.  
       - \( \hat{\beta}_2 = -0.22 \) (p=0.003): High group pecking → lower survival.  
     - **Conflict detected → Select on group means**.  
     - *Bitten bullet*: Must use group selection despite 8x cost per bird. Individual selection worsens mortality.  

  2. **Feed Conversion Efficiency (FCE)**  
     - Trait: FCE (egg mass/feed intake).  
     - Fitness proxy: Egg production (grams).  
     - Model outcome:  
       - \( \hat{\beta}_1 = +0.30 \) (p<0.001): Efficient birds lay more eggs.  
       - \( \hat{\beta}_2 = +0.08 \) (p=0.06): Efficient groups trend toward higher production.  
     - **Alignment → Select on individual records**.  

  3. **Disease Resistance (Batch Challenge)**  
     - Trait: None at individual level (only batch survival rate).  
     - **Terminate at Step 2 → Select on group means**.  

  ---

  #### **Confidence Flags**  
  - **Most Load-Bearing**: Contextual model (Step 3).  
    - Assumes linearity; misspecification biases \( \beta_1 \), \( \beta_2 \).  
  - **Rule of Thumb**: 1.5 cutoff in AccuracyRatio (Step 6). Adjustable based on company risk tolerance.  
  - **Least Sure**: Ambiguity resolution (Step 6). Weak effects may hide conflicts.  
  - **High Confidence**: Conflict rule (Step 4) and equivalence logic.  

  ---

  **Appendix: Code Template (R/lme4)**  
  ```r
  library(lme4)
  # y: fitness proxy (e.g., survival)
  # ind_trait: individual trait (e.g., pecking rate)
  # group_trait: group-mean trait (excl. focal bird)
  # pedigree: use pedigreemm for BLUP

  model <- lmer(y ~ ind_trait + group_trait + (1|id) + (1|group) + (1|batch), 
                data = data, 
                weights = NULL) # add weights if unequal variance

  # Check coefficients: fixef(model)
  # p-values: car::Anova(model)
  ```

  **Output to Director**: Clear recommendation (individual/group) with conflict status, cost implications, and escalation points. Juniors run this; director adjudicates only at defined handoffs.
