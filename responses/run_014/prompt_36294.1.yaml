prompt: |-
  My friend is one of those people with a hot take on everything the EU should and shouldn't be allowed to do. Her verdicts so far: trade deals and tariffs at EU level, yes; product standards for anything sold across borders, EU level, yes; emission rules where the pollution crosses borders, yes; letting the EU court strike down national rules that discriminate against citizens of other member states, yes; making candidate countries abolish the death penalty before they can join, yes; retirement age, national; how history gets taught in schools, national; abortion, national; income tax rates on individuals, national. Next week's argument is about an EU court ruling that would force every member state to legalize same-sex marriage. What's she going to say? I care less about the answer than about the rule she's implicitly running -- is it pooling sovereignty wherever effects leak across borders, or keeping anything touching national identity out of Brussels while taking the "technical" stuff, or treating the EU as a shield for minorities against national majorities? Several of those fit her track record, they don't all agree on this case, and I want to know which one she's really running and what case I should bring up to tell them apart.
reasoning: |-
  Okay, let me tackle this user's query. They have a friend with strong opinions on EU competencies, and they want to predict her stance on an EU court ruling forcing same-sex marriage legalization. The user cares more about the underlying rule guiding her views than the specific answer. 

  First, I need to parse the friend's track record. She supports EU-level action on cross-border issues like trade, product standards, emissions, and non-discrimination. But she reserves national sovereignty over identity-related matters like retirement age, history education, abortion, and income tax. 

  Hmm, the key here is figuring out her core principle. The user suggests three possibilities: pooling sovereignty for cross-border spillovers, protecting national identity from Brussels, or using the EU as a minority shield. 

  Looking at her yeses: they all involve clear transnational effects. Her nos are domestic/social policy with strong cultural dimensions. Same-sex marriage is tricky because while it doesn't physically cross borders, it relates to fundamental rights and non-discrimination - which she supported in the court striking down discriminatory national rules. 

  But wait - her death penalty stance complicates things. She supported EU imposition of abolition for candidate countries. That's not about spillovers; it's about shared values. Yet she might see this as "entrance criteria" rather than post-membership interference. 

  The user's real need is to identify which principle dominates. To test this, I should propose hypothetical cases where the principles conflict. Example: if a country banned same-sex married couples from other EU states, would she support EU intervention? That pits spillover (free movement) against national identity. 

  Another test: EU-wide inheritance rights for same-sex couples. Does the cross-border element trigger her "yes" reflex? Or does the family law aspect trigger her "no"? 

  The friend likely operates on a spillover principle with a cultural sovereignty exception. Same-sex marriage probably falls in the latter category for her. But the best way to confirm is presenting scenarios where these principles collide. 

  I'll structure the response to predict her opposition to the ruling, explain the spillover principle, highlight the death penalty anomaly, and offer concrete test cases for the user to explore. The goal isn't to debate marriage equality itself, but to help the user diagnose their friend's constitutional logic.
answer: |-
  Based on your friend's track record, she will **oppose** an EU court ruling forcing member states to legalize same-sex marriage. Here's the breakdown and how to identify her core principle:

  1.  **Her Likely Verdict:** **National.** She will argue this belongs solely to member states.
  2.  **Her Implicit Rule:** **Pooling sovereignty *only* where effects demonstrably leak across borders (Cross-Border Spillover Principle).** This is the strongest fit for her pattern:
      *   **Trade/Tariffs/Standards:** Directly impact cross-border commerce.
      *   **Cross-Border Pollution:** Definitionally crosses borders.
      *   **EU Court Striking Down National Discrimination:** Prevents barriers to free movement of workers/services/capital.
      *   **Death Penalty for Candidates:** Seen as a fundamental pre-condition for joining a union based on shared values (arguably preventing negative spillover like human rights violations within the bloc).
      *   **Retirement Age/History/Abortion/Tax:** Primarily domestic impacts with weak/immediate cross-border effects.
      *   **Same-Sex Marriage:** She will argue its definition and regulation have no *necessary* cross-border economic or functional impact requiring EU uniformity. It's seen as a core aspect of national social/cultural identity.

  **Why the Other Principles Don't Fit as Well:**

  *   **"Technical Stuff" vs. "National Identity":** While *related*, this is less precise. "Technical" implies complexity, but non-discrimination rulings involve complex social values. Her death penalty stance (value-based) and discrimination rulings (social policy) show it's not *just* about technicality. **Cross-border spillover** better explains the inclusion of non-discrimination rulings and the exclusion of same-sex marriage.
  *   **EU as Shield for Minorities:** Her support for non-discrimination rulings *fits* this, but her clear stance on abortion and likely stance on same-sex marriage being national **directly contradicts** it. She rejects the EU acting as a shield on those core identity issues.

  **The Anomaly: Death Penalty for Candidates**

  This is the trickiest fit for the *Cross-Border Spillover* principle. Her rationale likely hinges on:
  *   **Membership Criteria:** Seeing it as a non-negotiable entry requirement for a club, not post-accession imposition.
  *   **Fundamental Value Spillover:** Believing that a state practicing the death penalty within the EU creates a fundamental value contradiction and reputational/cohesion "spillover" damaging to the whole union's identity, even if no physical border is crossed.

  **How to Test Her Principle - Bring Up These Cases:**

  To distinguish the *Cross-Border Spillover Principle* from a simple *National Identity* principle, propose scenarios where cross-border effects *do* occur on issues touching national identity:

  1.  **Cross-Border Inheritance Rights:** Suppose a same-sex married couple from Country A (where it's legal) moves to Country B (where it's not recognized). Country B refuses to recognize their marriage for inheritance purposes when one spouse dies, disadvantaging the surviving spouse (an EU citizen from Country A) compared to an opposite-sex couple. *Does the cross-border element (free movement, rights of an EU citizen from another state) justify EU intervention to ensure mutual recognition of civil status effects?*
      *   **What Her Answer Reveals:**
          *   **Spillover Principle:** Likely *Yes*. The cross-border movement and denial of rights create a demonstrable barrier to free movement and discrimination based on nationality (indirectly via marital status acquired elsewhere).
          *   **Pure National Identity:** Likely *No*. She might argue Country B shouldn't be forced to recognize the "status" itself due to national identity, even if it harms the citizen from Country A.
  2.  **EU-Wide Social Security Benefits:** Should survivor's pensions or other EU-coordinated social security benefits be payable to a same-sex spouse legally married in another member state, regardless of the host country's recognition of same-sex marriage? (This touches on existing EU coordination rules).
      *   **What Her Answer Reveals:**
          *   **Spillover Principle:** Likely *Yes*. This is a core function of the internal market/social security coordination – preventing discrimination based on movement and ensuring benefits move with people.
          *   **Pure National Identity:** Likely *No*. She might argue this forces Country B to fund a relationship it doesn't recognize.
  3.  **Freedom of Establishment for Businesses:** If a company formed under the laws of Country A (which recognizes same-sex marriage) needs to register its board members/spouses for regulatory purposes in Country B (which doesn't), and Country B refuses to recognize the marital status/rights of a same-sex spouse impacting the company's operation, is this an EU matter?
      *   **What Her Answer Reveals:**
          *   **Spillover Principle:** Likely *Yes*. This creates a barrier to the freedom of establishment (a core EU freedom) based on divergent national rules about personal status impacting business.
          *   **Pure National Identity:** Likely *No*. National definition of marriage trumps the business impact.

  **Conclusion:**

  Your friend is primarily operating on the **Cross-Border Spillover Principle**. She supports pooling sovereignty only when a failure to do so demonstrably hinders core EU functions (single market, free movement, tackling externalities like pollution) or creates direct discrimination against citizens exercising cross-border rights.

  *   **Prediction for Same-Sex Marriage Ruling:** She will oppose it vehemently, arguing it has no necessary cross-border functional impact requiring EU uniformity and is a core matter of national social policy/identity.
  *   **Best Test Case:** The **Cross-Border Inheritance Rights** scenario. It directly pits the free movement/non-discrimination rights of an EU citizen (which she supports at the EU level) against the national definition of marriage (which she wants to keep national). Her answer here will show if the spillover principle truly dominates or if "national identity" acts as an absolute trump card even when spillovers exist.
