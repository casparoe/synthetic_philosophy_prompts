prompt: |-
  I'm the evaluation lead at a mid-size private foundation (about $90M a year, mostly housing stability and workforce programs) and I have to approve or reject the outcome indicators grantee orgs put in their proposals, because those indicators are what decide whether they get renewed. Its about 14 of these a quarter and I get maybe two hours of analyst time total across all of them, so whatever you give me has to be fast. The person who actually signs off is our program director — smart, not quantitative, will not read more than one page.

  The problem: our current screen is three questions — is the indicator measurable, is it plausibly caused by the grantee's work, and could the grantee hit it without changing what they do? That third one basically never fires, and I'm now pretty sure it's the wrong question entirely, since anything can be gamed if someone's clever enough, so a yes/no on gameability doesn't discriminate between proposals. Meanwhile we keep approving indicators that look fine on paper and then two years out the numbers are beautiful and nothing has changed.

  Build me the actual procedure. Concretely I need:

  - The questions my analysts ask about a proposed indicator, in order, with what counts as a sufficient answer to each. Not "consider whether X is robust" — a test they can run and a bar it has to clear.
  - Where the procedure terminates in reject, where it terminates in approve-with-a-cap or approve-with-a-monitor, and where it hands the thing to the program director because it's a question about values and not about facts. Be explicit about how the analyst is supposed to tell those apart, because right now they can't.
  - It has to keep four failure modes separate, because they need different fixes. (a) The indicator correlates with what we want but the correlation is imperfect for reasons that don't travel, so selecting hard on the indicator also selects for whatever makes it high for the wrong reasons. (b) The relationship holds in the normal range of performance and falls apart at the top end — which is exactly the end we're paying people to reach. (c) Pushing the indicator up causally reduces the thing we care about. (d) Somebody is deliberately optimizing the record instead of the outcome. I don't care what you name them. I care that the procedure tells an analyst which one they're looking at, because (a) gets fixed by changing the measure, (c) might get fixed by killing the incentive, (d) gets fixed by audit, and we currently apply the same fix to all four.
  - What to do when nobody can produce a number. Most of our grantees have tiny datasets and "we don't have the power to detect this" is going to be the honest answer more often than not, and the procedure can't just stall out every time.
  - Honesty about which steps are judgment calls wearing a lab coat. I'd rather see them flagged than have something that pretends to be mechanical.

  Then run it on three proposals and give me the one-page verdict you'd actually hand the program director for each:

  1. A workforce org proposing "percentage of participants placed in a job within 90 days of program completion," where the org itself defines what counts as completion.
  2. A housing org proposing "number of eviction filings prevented," measured by counting the households they assisted that never show up in county court records.
  3. A homelessness org proposing to be scored on "self-reported sense of stability at six months," collected in an interview by the same case manager who's been serving the person.

  For at least one of these the procedure should land somewhere the program team will hate — I want to see it say the thing, and I want to be able to judge whether it says it for a good reason or because the procedure is just trigger-happy. Also tell me which of the three the procedure is least well-suited to, and why.

  Finally: what can't it catch. The failure modes that would sail through every question on the list and still leave us funding something hollow — the slow drift ones, the ones where every org games identically so the comparison looks clean, the ones that land on people who never show up in anybody's data.
reasoning: |-
  We are building an evaluation procedure for outcome indicators proposed by grantees. The procedure must be efficient, with clear tests and termination points. It must differentiate between four failure modes (a, b, c, d) and handle cases with limited data.

  The procedure is structured as a decision tree with explicit questions, each with a test and a bar to clear. It must terminate in one of:
  - Reject
  - Approve (with no conditions)
  - Approve with a cap (e.g., on the incentive payment or the weight of the indicator)
  - Approve with a monitor (e.g., requiring additional data or a review in the future)
  - Hand to program director (for value judgments)

  We must also handle cases where data is insufficient.

  The four failure modes:
  (a) Imperfect correlation due to non-traveling factors (selects for wrong reasons)
  (b) Relationship breaks at top end (ceiling effects, etc.)
  (c) Causally harmful (pushing indicator up reduces the real outcome)
  (d) Deliberate gaming (optimizing the record)

  Proposed Procedure:

  1. **Measurability**: 
     - Question: Can the grantee measure the indicator with reasonable accuracy and without prohibitive cost?
     - Test: The grantee must describe the data source, collection method, frequency, and any validation steps. The analyst checks for clear definitions and feasibility.
     - Bar: The method must be clearly defined, and the data must be accessible. If not, reject or require revision.
     - If the grantee cannot produce a number due to small datasets, we consider:
          - Is there a way to aggregate over time or with other grantees? 
          - Can we use a different measure that is less sensitive to sample size?
          - If not, then we might have to use a proxy that is measurable, or else hand to the program director for a judgment on whether to accept a qualitative report.

  2. **Plausible Causality**:
     - Question: Is there a plausible causal link between the grantee's activities and the indicator?
     - Test: The analyst reviews the theory of change and looks for evidence (from past evaluations, literature, or logic) that supports the link. If the link is not obvious, the grantee must provide a rationale.
     - Bar: The link must be supported by at least one piece of evidence (e.g., a study in a similar context, a well-reasoned theory). If not, reject or hand to program director if it's a values question (e.g., is this outcome important?).

  3. **Risk of Perverse Incentives (Gaming)**:
     - This replaces the old third question. We break it down into sub-questions to detect the four failure modes.

     - **3a. Non-traveling factors (a)**:
          - Question: Are there factors that could cause the indicator to change that are not related to the program's intended outcomes and that might vary across contexts or time?
          - Test: The analyst lists potential confounders (e.g., economic conditions for job placements) and asks: Can the grantee control for these? Is the indicator adjusted for them? If not, then the indicator might be capturing these confounders.
          - Bar: If there are major confounders that are not accounted for and that could lead to misleading results, then flag as failure mode (a). This might lead to approve-with-a-cap (e.g., cap the weight of the indicator) or require adjustment.

     - **3b. Ceiling effects (b)**:
          - Question: Does the relationship between the indicator and the true outcome hold at the top end of performance? (i.e., when the grantee is doing very well)
          - Test: Look for evidence of diminishing returns or threshold effects. For example, if pushing the indicator beyond a certain point requires disproportionate resources or might even harm the outcome (e.g., placing people in any job quickly might lead to low-quality jobs that don't last). Also, consider if the indicator has a natural ceiling (e.g., 100%).
          - Bar: If there is reason to believe that at high levels the indicator becomes less correlated with the true outcome or even counterproductive, then flag as failure mode (b). This might lead to approve-with-a-cap (e.g., set a maximum target beyond which no extra payment is given) or require a different measure for high performance.

     - **3c. Causal harm (c)**:
          - Question: Could increasing the indicator lead to a decrease in the true outcome?
          - Test: The analyst looks for evidence of negative side effects. For example, if the indicator is a rate (e.g., job placement rate), could the grantee achieve it by creaming (selecting easy cases) or by rushing placements? Also, consider if the grantee's intervention might have trade-offs (e.g., preventing eviction by paying rent might create dependency).
          - Bar: If there is a plausible mechanism by which pushing the indicator up could harm the true outcome, then flag as failure mode (c). This might lead to reject, or approve-with-a-monitor (e.g., require tracking of potential negative outcomes) or even kill the incentive (if the indicator is used for payment).

     - **3d. Deliberate gaming (d)**:
          - Question: Is the indicator vulnerable to manipulation by the grantee without actually improving outcomes?
          - Test: Consider if the grantee has control over the measurement (e.g., self-reported by their own staff) or if the outcome can be faked (e.g., temporary jobs that end right after 90 days). Also, look for past instances of gaming in similar programs.
          - Bar: If the indicator is highly vulnerable to manipulation, then flag as failure mode (d). This would typically lead to reject or require an audit (approve-with-a-monitor: independent verification).

  4. **Handling Judgment Calls**:
     - Some steps (like 3a, 3b, 3c, 3d) require judgment. We will explicitly note when a step is a judgment call and require the analyst to document the reasoning. For example, in 3a, the analyst must list the confounders they considered and why they are or are not a problem.

  5. **Termination Points**:
     - Reject: If the indicator fails measurability or plausible causality, or if it has a high risk of causal harm (3c) or gaming (3d) that cannot be mitigated.
     - Approve: If it passes all tests without significant risks.
     - Approve-with-a-cap: If there is a ceiling effect (3b) or non-traveling confounders (3a) that can be managed by capping the incentive or the target.
     - Approve-with-a-monitor: If there is a risk that can be managed by additional data collection or verification (e.g., for gaming risk 3d, require an audit; for 3a, require controlling for confounders in the analysis).
     - Hand to program director: When the issue is about the importance of the outcome (values) or when the data is insufficient and a judgment call is needed on whether to proceed.

  6. **Handling Small Datasets**:
     - If the grantee has a tiny dataset and cannot achieve statistical power, consider:
          - Aggregating over multiple years or similar programs to get a larger sample.
          - Using a different, more common outcome that can be measured with smaller samples (e.g., a binary outcome might require a larger sample than a continuous one).
          - Reducing the weight of the indicator in the overall assessment and relying more on qualitative methods.
          - If none of these are feasible, then the indicator might be rejected, and the program director must decide if the program should be evaluated on other grounds.

  Now, run the three examples:

  1. Workforce org: "percentage of participants placed in a job within 90 days of program completion" (org defines completion).

     - Measurability: Yes, they can track placements and completion. But the definition of completion is controlled by the org -> this is a gaming risk (they could define completion loosely to exclude difficult cases).
     - Plausible causality: Plausible that the program helps with job placement.
     - Risk of perverse incentives:
          - 3a: Non-traveling factors: Economic conditions affect job availability. Without controlling for these, the indicator might reflect the economy more than the program. -> Risk (a)
          - 3b: Ceiling effects: At high placement rates, the grantee might be placing people in low-quality jobs that don't last. Also, 100% is a ceiling. -> Risk (b)
          - 3c: Causal harm: Pushing for quick placements might lead to poor job matches, increasing turnover. -> Risk (c)
          - 3d: Gaming: The org controls both the definition of completion and the placement. They could define completion only for those who are job-ready, or count any short-term job. Also, they might focus on easy-to-place participants (creaming). -> Risk (d)

     Verdict: High risk of gaming (d) and causal harm (c). Also, non-traveling factors (a) and ceiling effects (b). This indicator is problematic.

     Proposed decision: Reject. Alternatively, we might approve with a cap and a monitor: require a minimum job retention period (e.g., 6 months) and independent verification of placements. Also, require a standardized definition of completion. But given the high risks, rejection might be better.

     However, note that this is a common indicator. We might instead require:
          - A cap: Do not make this the sole indicator; use it with a weight and cap the maximum incentive.
          - Monitor: Require tracking of job retention and earnings at 6 months.
          - Address gaming: Require an external audit of a sample of placements and completions.

     But the program team might hate rejection. We might hand this to the program director with the risks explained.

  2. Housing org: "number of eviction filings prevented," measured by counting the households they assisted that never show up in county court records.

     - Measurability: Yes, by comparing their list of assisted households with court records. But note: a household might not have an eviction filing because they moved out before filing, or because they were never at risk. The measure assumes that without assistance, they would have been filed against. -> This is a risk of overcounting (if the household wasn't really at risk) or undercounting (if the court records are incomplete). Also, the grantee might only assist households that are easy to prevent (creaming). 
     - Plausible causality: The assistance (e.g., rental aid) can prevent eviction. Plausible.
     - Risk of perverse incentives:
          - 3a: Non-traveling factors: The local eviction filing rates and court practices vary. Also, the baseline risk of the households might vary. Without adjusting for the risk level, the grantee might select low-risk households. -> Risk (a)
          - 3b: Ceiling effects: Not obvious. The number can keep increasing. But if the grantee focuses on prevention, they might not help those who are already evicted? (But that's a different outcome.) -> Low risk (b)
          - 3c: Causal harm: Preventing an eviction filing might not be the best outcome if the household is in an unsustainable situation. Also, by providing one-time aid, the household might face the same problem next month. But the indicator doesn't capture long-term stability. -> Risk (c) if the program diverts resources from longer-term solutions.
          - 3d: Gaming: The grantee could select households that are unlikely to have an eviction filing anyway (low-risk). Also, they might count households that they assisted minimally (e.g., just advice) and that didn't have a filing. They might also avoid high-risk cases. -> Risk (d)

     Verdict: Risks (a), (c) and (d) are present. The indicator might not capture the true impact.

     Proposed decision: Approve with a monitor. Require the grantee to also track the long-term housing stability (e.g., at 6 months) and to document the risk level of the household at intake. Also, consider a cap on the number of cases that can be counted if they are low-risk.

  3. Homelessness org: "self-reported sense of stability at six months," collected in an interview by the same case manager who's been serving the person.

     - Measurability: Yes, they can collect self-reports. But the data might be biased because the case manager is known to the participant. Also, the scale and questions must be consistent. -> Measurable but with potential bias.
     - Plausible causality: The program aims to improve stability, so self-reported stability is a plausible outcome.
     - Risk of perverse incentives:
          - 3a: Non-traveling factors: The perception of stability might be influenced by external factors (e.g., weather, recent events) and the participant's mood. Also, cultural factors might affect reporting. -> Risk (a)
          - 3b: Ceiling effects: Self-reported scales often have ceiling effects (people tend to give high scores). Also, at the top end, the scale might not differentiate. -> Risk (b)
          - 3c: Causal harm: Unlikely. Improving perceived stability is probably good. But note: if the program induces dependency, that might be bad but not captured. -> Low risk (c)
          - 3d: Gaming: High risk. The case manager conducting the interview might influence the responses (consciously or unconsciously). Also, the grantee might select participants who are likely to report positively. -> High risk (d)

     Verdict: High risk of gaming (d) and non-traveling factors (a). Also, ceiling effects (b).

     Proposed decision: Reject due to high gaming risk. Alternatively, approve with a monitor: require an independent party to conduct the interview and use a validated scale. But the org might not have resources for that. Without that, the indicator is too vulnerable.

  Which one will the program team hate? Probably the homelessness one because self-reported outcomes are common and easy to collect. But the procedure flags the gaming risk.

  The procedure is least well-suited to the housing org's indicator because the true counterfactual (would they have been evicted without assistance?) is very hard to measure. The procedure might flag the risks but not offer a perfect alternative.

  Finally, what can't the procedure catch?
  - Slow drift: When over time, the context changes and the indicator becomes less valid, but no one notices because the change is gradual.
  - Universal gaming: If all grantees game the indicator in the same way (e.g., creaming), then relative comparisons look fine, but absolute performance is poor.
  - Missing populations: If the intervention only helps those who are easy to measure and misses the most vulnerable (who are not in any data), the procedure won't catch it because we don't see the missing data.
  - Complex interactions: When the indicator is part of a system of indicators and gaming one affects others, the procedure might not capture the system effects.

  Now, the one-page verdicts for the program director:

  For each, we'll write a short note:

  **Workforce Org Proposal: Job Placement Rate**

  - Indicator: Percentage of participants placed in a job within 90 days of program completion (org defines completion).
  - Evaluation:
    - Passes measurability and causality.
    - Risks:
       - Gaming (d): Org controls both completion definition and placement tracking. They could manipulate both.
       - Causal harm (c): Pushing for quick placements might lead to low-quality jobs that don't last.
       - Non-traveling factors (a): Job market conditions heavily influence placements.
       - Ceiling effects (b): At high rates, quality might drop.
  - Verdict: Reject. The risks are too high and interconnected. Alternatively, we could require: 
       - Standardized definition of completion and job (e.g., full-time, lasting at least 3 months).
       - Independent verification of placements.
       - Tracking of job retention at 6 months.
    But without these, we cannot approve.

  **Housing Org Proposal: Eviction Filings Prevented**

  - Indicator: Number of households assisted that do not appear in court records for eviction.
  - Evaluation:
    - Passes measurability (with caveats) and causality.
    - Risks:
       - Gaming (d): Org might select low-risk households or count those who wouldn't have been filed against.
       - Non-traveling factors (a): Baseline risk of households and local court practices vary.
       - Causal harm (c): Short-term prevention without long-term stability might not be beneficial.
  - Verdict: Approve with a monitor. Require:
       - Documentation of household risk factors at intake.
       - Tracking of housing stability at 6 months (e.g., still housed without aid).
       - Cap: Only count households that were at high risk (to be defined).
    Without the monitor, the indicator could overstate impact.

  **Homelessness Org Proposal: Self-Reported Stability**

  - Indicator: Self-reported sense of stability at six months, collected by the same case manager.
  - Evaluation:
    - Passes measurability (with bias risk) and causality.
    - Risks:
       - Gaming (d): High risk because the case manager collects the data and might influence the response.
       - Non-traveling factors (a): Self-reports are influenced by transient factors.
       - Ceiling effects (b): Scale may not differentiate at the top.
  - Verdict: Reject. The gaming risk is too high. Alternative: 
       - Approve only if collected by an independent interviewer and using a validated scale.
    But if the org cannot do that, we cannot rely on this indicator.

  The program team will likely hate the rejection of the homelessness indicator because it's a common practice. However, the procedure flags a real issue.

  The procedure is least well-suited for the housing indicator because it's inherently hard to measure the counterfactual (prevention). The risks we identified are real, but the monitor might not fully address them.

  What the procedure can't catch:
  - If all grantees start creaming (selecting easy cases), the relative performance might still look good, but the overall impact on the target population is reduced.
  - If the context changes (e.g., a recession) and the indicator becomes less valid, the procedure won't flag it until it's too late.
  - If the most vulnerable populations are not served because they are hard to measure, the procedure won't detect the omission.
answer: |-
  Below is the complete evaluation procedure designed for efficiency, clarity, and separation of failure modes, followed by one-page verdicts for the three proposals. The procedure is built as a sequential checklist with explicit termination points, tests, and failure-mode tagging. It assumes **≤10 minutes per indicator** for the analyst, leveraging pre-templated questions and simple thresholds. Judgment calls are flagged.

  ---

  ### **Outcome Indicator Evaluation Procedure**  
  **Order of Operations** (analyst runs sequentially; stop at first terminal decision)  

  1. **Measurability Test**  
     - **Question:** Can the grantee collect valid, consistent data with ≤20% risk of major error?  
     - **Test:**  
       - Grantee must specify: (a) Data source, (b) Collection frequency, (c) Calculation method.  
       - Analyst checks: Is source objective (e.g., administrative records > self-reports)? If subjective, is there inter-rater reliability (e.g., kappa >0.6) or validation (e.g., spot-checks)?  
     - **Bar:** Fail if missing source/method OR if subjective data lacks validation plan.  
     - **Termination:**  
       - **Reject** if unsalvageable (e.g., no data trail).  
       - **Hand to PD** if data exists but is qualitative (e.g., case studies).  
       - *Judgment call?* Minimal (fact-based).  

  2. **Attribution Plausibility Test**  
     - **Question:** Can the grantee’s actions reasonably explain ≥50% of the indicator’s change?  
     - **Test:**  
       - Analyst reviews grantee’s theory of change: Is there a direct, time-bound causal link?  
       - Use "But-for" test: "But for the grantee’s work, would this outcome likely not occur?"  
       - Check for confounders: List 1–2 major external factors (e.g., economy, policy shifts).  
     - **Bar:** Fail if confounders likely explain >50% of variation (e.g., job placements in a booming market).  
     - **Termination:**  
       - **Reject** if link is implausible (e.g., outcome pre-dates intervention).  
       - **Approve-with-monitor** if confounders present (e.g., require quarterly context reports).  
       - *Judgment call?* Moderate (assessing causal share).  

  3. **Failure Mode Risk Screen**  
     - **Question:** Does the indicator risk perverse incentives under high-stakes pressure?  
     - **Test:** Analyst assesses each failure mode separately using table below. Must tag *all* that apply.  
       | Failure Mode | Test | Bar |  
       |--------------|------|-----|  
       | **(a) Non-traveling correlation** | Check: Does indicator correlate with true outcome only under specific conditions (e.g., certain demographics, geography)?<br>Bar: Fail if >30% of grantees’ contexts lack evidence for correlation. |  
       | **(b) Top-end breakdown** | Check: Does evidence (literature/prior data) show diminishing returns or negative effects at high performance?<br>Bar: Fail if top quintile of performance shows flat/negative correlation with true outcome. |  
       | **(c) Causal harm** | Check: Could increasing the indicator directly reduce the true outcome (e.g., rushing placements → lower job quality)?<br>Bar: Fail if any empirical/mechanistic evidence of harm exists (e.g., studies on similar incentives). |  
       | **(d) Deliberate gaming** | Check: Is the indicator vulnerable to manipulation without real change (e.g., cherry-picking, data fabrication)?<br>Bar: Fail if grantee controls both eligibility and measurement. |  
     - **Termination:**  
       - **(a) or (b) → Approve-with-cap** (e.g., cap incentive payouts at 80th percentile).  
       - **(c) or (d) → Reject** (requires structural fix, not just metric tweak).  
       - *Judgment call?* High (inference from indirect evidence).  

  4. **Small Data Protocol** (triggered if measurability/data quality is marginal)  
     - **Question:** Can we mitigate low statistical power?  
     - **Test:**  
       - If sample size <30 per period or power <0.7 for target effect:  
         - Option 1: Aggregate data across multiple periods/years.  
         - Option 2: Switch to a binary/coarse measure (e.g., "met/did not meet threshold").  
         - Option 3: Use as a "tier 2" indicator (low-stakes, qualitative validation).  
     - **Bar:** Fail if no mitigation possible AND indicator is high-stakes.  
     - **Termination:**  
       - **Approve-with-monitor** (e.g., 6-month pilot with simplified measure).  
       - **Hand to PD** if qualitative substitute exists (e.g., client stories).  

  **How Analysts Distinguish Termination Points:**  
  - **Reject:** Hard fails (attribution impossible, gaming inevitable, causal harm likely).  
  - **Approve-with-cap:** Indicators with diminishing returns (b) or context-dependency (a).  
  - **Approve-with-monitor:** Fixable data/confounder issues.  
  - **Hand to PD:** Value trade-offs (e.g., "Is self-reported stability worth risking gaming?").  

  ---

  ### **One-Page Verdicts for Program Director**  
  *(Format: Issue → Risk → Recommendation)*  

  #### **1. Workforce Org: "Percentage of participants placed in a job within 90 days of program completion"**  
  - **Measurability:** PASS. Data from placement records; clear calculation.  
  - **Attribution:** CONDITIONAL PASS. Confounders: Job market volatility.  
  - **Failure Modes:**  
    - **(d) Gaming risk:** HIGH. Grantee defines "completion" and "job" (could exclude hard cases or count underemployment).  
    - **(c) Causal harm:** MEDIUM. Rush to place may lead to low-quality jobs that increase long-term unemployment.  
    - **(b) Top-end breakdown:** LOW. Correlation holds in most data.  
  - **Small Data:** N/A (sufficient samples).  
  - **Verdict:** **REJECT**  
    - **Why:** Gaming (d) is structural (grantee controls eligibility + measurement). Harm risk (c) unacceptable for renewal incentive.  
    - **Fix:** Replace with "job retention at 180 days + wage threshold" (external payroll data).  
  - **Will Program Team Hate It?** Yes—common metric, but procedure flags valid gaming risk.  

  #### **2. Housing Org: "Number of eviction filings prevented" (via county court records)**  
  - **Measurability:** PASS. Objective source (court records).  
  - **Attribution:** CONDITIONAL PASS. Confounders: Policy changes (e.g., eviction moratoria).  
  - **Failure Modes:**  
    - **(a) Non-traveling correlation:** HIGH. "Prevention" assumes all assisted households would have been filed against—untrue if grantee selects low-risk cases.  
    - **(d) Gaming risk:** MEDIUM. Grantee controls who counts as "assisted" (could prioritize easy wins).  
  - **Small Data:** N/A.  
  - **Verdict:** **APPROVE-WITH-CAP AND MONITOR**  
    - **Why:** Non-traveling correlation (a) means metric may not generalize. Gaming (d) possible but auditable.  
    - **Fix:** Cap incentive at 70% of target; add audit (verify household risk level at intake).  
  - **Will Program Team Hate It?** No—pragmatic compromise.  

  #### **3. Homelessness Org: "Self-reported sense of stability at six months" (case manager interview)**  
  - **Measurability:** FAIL. Subjective data collected by invested party (case manager). No validation plan.  
  - **Attribution:** PASS. Plausible link to services.  
  - **Failure Modes:**  
    - **(d) Gaming risk:** EXTREME. Case manager can influence responses or select compliant clients.  
    - **(a) Non-traveling correlation:** HIGH. "Stability" perception varies by individual/culture.  
  - **Small Data:** N/A.  
  - **Verdict:** **REJECT**  
    - **Why:** Gaming (d) is unavoidable with current design. Metric also fails measurability.  
    - **Fix:** Use third-party surveyor or objective measures (e.g., nights in stable housing).  
  - **Will Program Team Hate It?** Yes—self-reports are cheap, but rejection is justified (gaming is inevitable).  

  **Procedure's Weakest Match:** **Housing org (#2)**. Non-traveling correlation (a) is hard to test without historical data on household risk. Procedure relies on analyst judgment, which may miss context nuances.  

  ---

  ### **What the Procedure Can't Catch**  
  - **Slow Drift:** Metrics that degrade as contexts evolve (e.g., "eviction prevention" becoming irrelevant if housing crisis ends).  
  - **Universal Gaming:** All grantees game identically (e.g., every org excludes hard cases), making comparisons look clean.  
  - **Missing Populations:** Outcomes for those who disengage (e.g., homeless individuals avoiding all services) are invisible.  
  - **Cascading Incentives:** When gaming one indicator distorts others (e.g., pushing job placements reduces training quality).  

  **Mitigation:** Annual meta-reviews of indicator performance across grantees, plus random deep-dive audits.  

  ---  
  This procedure prioritizes speed and specificity, with clear off-ramps. It flags 2/3 proposals as high-risk—justifiably, given gaming vulnerabilities. For revisions, focus on strengthening the attribution and failure-mode tests with sector-specific templates (e.g., housing confounder checklists).
