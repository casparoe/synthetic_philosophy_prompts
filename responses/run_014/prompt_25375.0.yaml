  ### **Why This Works**
  - **Engineer-Aligned:** Concrete design task ➔ tangible failure ➔ theoretical insight.  
  - **Time-Efficient:** Testing 2–3 systems in 20 min keeps pace.  
  - **Debrief Precision:** Explicitly links activity to theorem conditions and preempts FAQs.  
  - **Honesty Gap:** Activity shows *existence* of manipulation; debrief clarifies universality.  

