answer: |-
  ### Expertly Crafted Activity Plan: "Voting Systems: The Impossibility Experiment"

  #### **Objective:** 
  Engineers will experience the frustration of designing a strategy-proof voting system through hands-on manipulation attempts, leading them to *feel* the Gibbard-Satterthwaite theorem before it's named.

  #### **Time Allocation (60 min):**
  - **Intro & Setup (10 min)**
  - **Design Phase (15 min)**
  - **Testing Phase (20 min)**
  - **Debrief (15 min)**

  ---

  ### **Activity Rules & Flow**
  **Scenario:** "Your team must choose a company offsite location. 3 options: **Beach (B)**, **Mountains (M)**, **City (C)**."  
  **Voters:** 3 teams of 5 engineers each (15 total; smaller groups reduce chaos). Each team acts as a *single voter* with shared preferences.  
  **Constraints:**  
  1. The system must handle ≥3 options.  
  2. No dictatorship (no single team always decides).  
  3. Voters submit *rankings* (e.g., B > M > C).  

  ---

  #### **Phase 1: Intro & Setup (10 min)**
  - **Context (3 min):**  
    *"We’re designing a voting system for the offsite. You’ll create rules to convert rankings into a winner. But there’s a catch: voters might lie if it benefits them. Your goal is a system where lying never pays off."*  
  - **Key Terms (2 min):**  
    - *Strategy-proof:* No voter gains by lying.  
    - *Non-dictatorship:* No single voter always wins.  
  - **Assign Preferences (5 min):**  
    Give each team a **fixed preference order** (kept secret from others):  
    - Team 1: **B > M > C** (Loves beach)  
    - Team 2: **M > C > B** (Prefers mountains)  
    - Team 3: **C > B > M** (City-focused)  

  ---

  #### **Phase 2: Design Phase (15 min)**
  - **Task:** Teams brainstorm a voting system on whiteboards. Encourage simplicity. Common attempts:  
    - *Ranked Choice* (Instant Runoff)  
    - *Borda Count* (Points: 3 for 1st, 2 for 2nd, 1 for 3rd)  
    - *Plurality* (Only 1st choices counted)  
    - *Approval* (Not allowed—emphasize rankings are required for this exercise).  
  - **Instructor Guidance:**  
    - Push for specificity: "How are ties broken?" (Default: Alphabetical).  
    - Nudge away from dictatorships: "Does one team always decide? That’s cheating!"  

  ---

  #### **Phase 3: Testing Phase (20 min)**
  **Round 1: Sincere Voting (5 min)**  
  - Teams submit *true* rankings.  
  - Apply each proposed system. Record winners.  
    *Example: Borda Count yields B=8, M=7, C=6 → Beach wins.*  

  **Round 2: Strategic Voting (15 min)**  
  - **Challenge:** *"Can any team get a better outcome by lying? Test it!"*  
  - Teams privately discuss manipulations (e.g., Team 3 might rank **C > M > B** to avoid Beach).  
  - Rerun systems with new rankings. Compare outcomes to sincere results.  

  **Predictable Outcomes:**  
  - **Borda:** Team 1 (B>M>C) flips to **B>C>M** to sink Mountains. Mountains loses, Beach still wins—no gain.  
  - **Ranked Choice:** Team 2 (M>C>B) ranks **C>M>B** to eliminate Beach early. City wins—Team 2 now prefers City over Beach!  
  - **Plurality:** Team 3 (C>B>M) votes **B** tactically to block Mountains.  

  ---

  ### **Debrief Script (15 min)**
  **Step 1: The "Aha!" Moment (5 min)**  
  *"What happened? Did any system avoid manipulation? [...] Exactly. No matter what you designed, someone could lie and improve their outcome. This isn’t your fault—it’s a fundamental limit. You’ve just experienced the Gibbard-Satterthwaite theorem."*  

  **Step 2: Map to the Theorem (5 min)**  
  - **≥3 Options:** We had Beach, Mountains, City.  
  - **Non-Dictatorship:** No team was a dictator (per your designs).  
  - **Strategy-Proofness:** Every system had a scenario where lying paid off.  
  *"The theorem proves this is unavoidable. Your systems were manipulable not because they were ‘bad,’ but because *all* non-dictatorial systems with 3+ options are."*  

  **Step 3: Address FAQs (5 min)**  
  - **"What about approval voting?"**  
    *"Approval avoids rankings, so it sidesteps GS? Not really. Approval is *also* manipulable! Example: You approve Mountain only to avoid Beach, but City wins—and you preferred Beach over City. GS applies to any system producing a single winner."*  
  - **"Can’t we use Ranked Pairs?"**  
    *"Ranked Pairs satisfies the Condorcet criterion but still violates strategy-proofness. GS doesn’t care about fairness—it’s about incentives to lie. All deterministic systems fail here."*  

  **Step 4: Bridge the Gap**  
  *"Today, you *felt* the theorem via scenarios. The formal proof shows this holds for every possible system—not just the ones we tested. We skipped the math, but the intuition is what matters: when people have preferences, they’ll game the system. That’s why voting theory focuses on *minimizing* manipulation, not eliminating it."*  

  ---

  ### **What Could Go Wrong & Fixes**
  1. **"Design Flailing":** Teams overcomplicate systems.  
     *Fix:* Pre-load examples (e.g., "Try Borda or Ranked Choice") to jumpstart them.  
  2. **Ties:** Common in small groups.  
     *Fix:* Enforce alphabetical tiebreaks to keep it moving.  
  3. **Manipulation Not Triggered:** Some systems resist in specific scenarios.  
     *Fix:* Have backup preferences (e.g., flip Team 3 to **C>M>B**) to force manipulation.  
  4. **"But Real Elections…":** Skepticism about relevance.  
     *Fix:* "GS explains *why* gerrymandering/tactical voting exist. It’s not about abolishing voting—it’s about designing wisely."  

