answer: |-
  1.  **Creeping Minimalism**: If expressivism becomes indistinguishable from sophisticated realism after accommodating embedding, it loses its core anti-realist motivation and ceases to be a distinct research program, rendering the entire project self-defeating. (High confidence - widely seen as an existential threat to expressivism's unique selling point.)
  2.  **The Explanation Problem**: Expressivism must explain *why*, despite grounding meaning in attitudes, moral discourse robustly obeys classical logic (e.g., modus ponens works); failure here suggests the framework cannot adequately capture the actual inferential practices it aims to describe. (Medium confidence - recognized as a deep challenge requiring non-standard semantics, crucial for credibility but potentially solvable within the framework.)
  3.  **The Negation Problem (as a specific embedding case)**: Explaining the difference between rejecting a moral claim (e.g., "~Murder is wrong") and accepting its negation ("Accepting that murder is not wrong") purely in terms of conative attitudes reveals fundamental difficulties in handling complex embeddings that threaten the expressivist account of logical operators. (Medium confidence - a persistent, specific technical hurdle demonstrating the complexity of the embedding challenge, though potentially addressable with sophisticated machinery.)
  4.  **Hybrid Expressivism's Genuine Escape vs. Relabeling**: Hybrid views (combining belief and desire components) must demonstrate they solve embedding/negation problems without merely reintroducing cognitivist semantics under a different name or creating new internal tensions between the components. (Medium confidence - hybrids are active but contentious; their success hinges on this unresolved issue, impacting expressivism's viability if pure forms fail.)
  5.  **Residual Embedding Issues (beyond negation)**: While focused on negation, problems persist with other complex embeddings (e.g., conditionals, disjunctions, quantifiers within moral contexts) where expressivist accounts remain contested or unsatisfyingly complex; I'm least sure how critical this is *now* because proponents claim significant progress (e.g., Gibbard's plans) while critics argue deep, unsolved issues remain, and the field lacks consensus on whether the core embedding challenge is truly "solved" or merely managed. (Low confidence - uncertainty stems directly from active, unresolved debate about the sufficiency of current solutions and the nature of "success" against Frege-Geach.)
