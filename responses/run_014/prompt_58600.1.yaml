prompt: |-
  im trying to sort out therapy vs enhancement and my gut is all over the place, can you help me find the principle behind it if there is one?

  Insulin for my diabetic cousin to keep her sugars normal: therapy, totally fine. Growth hormone for a kid who's short due to a deficiency to get him up to average: fine. Same hormone for a kid already on track to be average to push him to 6ft for basketball: not fine. Laser surgery to fix my short-sightedness back to normal: fine. But the same laser tweaked to give a pilot applicant better-than-normal night vision: realy fine by me, which is weird given the basketball one. ADHD meds that let my mate actually hold down a job: fine, but the same pill for healthy me to cram for finals: not fine, though somehow less bad than steroids for athletes.

  Is there one principle that gets all of these, or close? And what does it say about the case I keep going back and forth on — a gut bug implant that restores lactose digestion for someone who lost it vs the same tech tweaked to let a hiker digest grass cellulose on camping trips? Tell me which of my verdicts you'd have to overturn to keep it simple.

  Please answer in British English throughout, and put your call on the gut bug hiker case as the very last line beginning with Verdict:
reasoning: |-
  Okay, the user is really wrestling with the therapy vs. enhancement distinction, and their examples show how messy it gets. They've got strong gut reactions but want a unifying principle – classic philosophy-meets-real-life struggle. 

  First, breaking down their examples: insulin for diabetes is clear-cut therapy because it addresses pathology. Growth hormone for deficiency fits too – restoring species-typical function. But then it gets fuzzy: the basketball kid example reveals their instinct against enhancement for competitive advantage. Yet laser eye surgery for super-night vision feels acceptable to them – that's interesting because it's enhancement, not restoration. Their ADHD med example shows discomfort with performance enhancement in academics, but less than athletic doping – suggesting context matters (education vs sport). 

  Their core tension is between two principles: "restoring normal function" (therapy) vs "exceeding baseline" (enhancement). But the exceptions poke holes. Night vision enhancement feels permissible because it doesn't harm others? Or maybe because pilots need it for safety? Whereas basketball height feels like unfair advantage. 

  The lactose vs cellulose case is brilliant because it mirrors the insulin/growth hormone therapy examples but flips the purpose: restoring lost function vs adding new capability. My instinct matches theirs – the lactose restoration is therapy, cellulose digestion is enhancement. But to be consistent, if I accept night vision enhancement, why not cellulose? Unless the distinction is about biological plausibility: humans aren't meant to digest grass, but better night vision falls within extended human sensory capacity? That feels arbitrary. 

  Perhaps the unifying thread is whether it closes a gap to baseline health (therapy) versus creating new abilities others can't access without intervention (enhancement). But then night vision still counts as enhancement... unless we argue baseline includes "healthy human potential" which night vision arguably does? Messy. 

  Final call: their cellulose case is enhancement. But I won't overturn their night vision verdict – instead I'll note the tension and suggest a harm-minimization principle might explain why both that and ADHD meds feel less problematic than sports doping. 

  Verdict will be: enhancement for the hiker. Their instincts mostly hold except maybe the night vision case needs reframing as permissible enhancement rather than "really fine" as therapy.
answer: |-
  Right, let's sort this philosophical tangle – it's a proper brain-teaser, and your instincts highlight why this debate's been running for decades in medical ethics. There likely isn't one *perfect*, universally agreed principle that covers every edge case without friction, but the strongest contender is the **"Restoration of Species-Typical Function"** principle. Here's the breakdown:

  1.  **The Core Principle:** Therapy aims to restore an individual to the **normal functional range** for a healthy human of their species. Enhancement aims to give individuals **capabilities beyond that normal functional range**, or to provide normal function where no deficiency/disease existed.
  2.  **Applying it to Your Cases:**
      *   **Diabetic Cousin (Insulin):** Diabetes is a disease state causing dysfunction. Insulin restores blood sugar regulation to the species-typical normal range. **Therapy.**
      *   **Short Kid (Growth Hormone for Deficiency):** The deficiency causes a pathological state (abnormally short stature *due to disease*). Treatment aims to restore height towards the species-typical normal range. **Therapy.**
      *   **Average Kid to 6ft (Growth Hormone):** The child is already within the species-typical normal height range. The intervention pushes them *beyond* what is typical/necessary for health/function. **Enhancement.**
      *   **Laser for Short-Sightedness (Myopia):** Myopia is a disease state impairing vision. Surgery aims to restore vision to the species-typical normal range. **Therapy.**
      *   **Laser for Super-Night Vision:** The aim is to grant vision *superior* to the species-typical normal range. No deficiency is being corrected. **Enhancement.** (Your "really fine" verdict might stem from perceiving it as less *harmful* than athletic doping, not that it *isn't* enhancement).
      *   **ADHD Meds for Job Function:** ADHD is a neurodevelopmental disorder causing clinically significant impairment. Medication aims to restore cognitive/executive function closer to the species-typical normal range, enabling basic life activities. **Therapy.**
      *   **ADHD Meds for Exam Cramming (Healthy Individual):** No underlying pathology or functional impairment exists. The aim is to boost cognitive performance *beyond* the individual's (and species-typical) baseline. **Enhancement.**
      *   **Steroids for Athletes:** Athletes are (presumably) already within the species-typical normal range for strength/endurance. Steroids push them *beyond* that range for competitive advantage. **Enhancement.** (The "less bad" feeling about exam cramming vs. steroids likely relates to perceived fairness, coercion, and physical risks in elite sport, not the core therapy/enhancement distinction).

  3.  **The Gut Bug Case (Lactose vs. Cellulose):**
      *   **Lost Lactose Digestion:** Lactose intolerance in adulthood is the norm for most humans (species-typical). However, *losing* the ability after previously having it *could* be seen as a functional impairment relative to the individual's previous healthy state and the capacity possessed by a significant subset of the population (those with lactase persistence). Restoring a previously held, biologically plausible human function. **Therapy.**
      *   **Digesting Grass Cellulose:** Humans lack the physiological capacity (enzymes, gut flora, digestive tract structure) to digest cellulose. Granting this ability would create a **novel function** far **beyond** the species-typical normal range. **Enhancement.**

  4.  **Overturning Your Verdicts for Consistency:** To strictly adhere to the "Restoration of Species-Typical Function" principle, your verdict on the **pilot's night vision** needs overturning. It's clearly enhancement, not therapy. Your feeling it's "really fine" is understandable (it might seem beneficial, low-risk, non-competitive), but ethically, under this principle, it falls squarely in the enhancement category alongside the basketball height or exam-cramming pills. The principle distinguishes based on *what* is being done (restoring norm vs exceeding norm), not necessarily the *context* or your personal approval of the outcome.

  **In Summary:** The "Restoration of Species-Typical Function" principle provides the most coherent framework for your instincts across most cases. Therapy corrects a deviation from the human norm (pathology, disease, deficiency). Enhancement pushes an already normal individual beyond that norm or creates entirely new capabilities. It explains why restoring lactose digestion feels like therapy (restoring a common human capacity, even if lost naturally) and digesting cellulose feels like enhancement (creating a radically new, non-human function).

  Verdict: The gut bug for the hiker to digest grass cellulose is **enhancement**.
