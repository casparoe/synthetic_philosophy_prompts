prompt: |-
  Okay this is going to sound weird but I got into this long debate with my roommate who is in nursing school and now I can't stop thinking about it. She was telling me about some patients after a certain kind of brain injury who can still point exactly to where it hurts and describe it as sharp or burning or whatever, but they just don't seem to care at all, like they won't pull their hand away unless someone tells them to and they act like its no big deal, which totally weirded me out. And then it reminded me of something way milder from my own life wehn I was training for a half marathon last fall and at mile 10 my knees were clearly in pain but because I was locked in and actually enjoying proving myself I kinda noticed the pain without minding it, if that makes sense, like the hurt was there but the yuck part was missing for a bit until afterwards when I started minding it again.

  So does this split have an established name or literature in philosophy or psych or wherever? I tried looking up stuff about pain tolerance and about not feeling pain at all and about dissociating or zoning out, but none of those seem quite right because in both cases the person still feels the pain as pain, they just aren't bothered by it or moved to do anything about it. I don't just want a one-word label to drop, I want to understand the carving — what counts as the same phenomenon versus what is nearby but different, like deliberately tolerating pain vs. not being bothered in the first place vs. enjoying it, and whether my runner case and my roommates patients are even the same thing or need seperate concepts. And if there isn't a good existing term, can you coin one and give me a clean definition plus a couple edge cases to show where you would draw the line?
