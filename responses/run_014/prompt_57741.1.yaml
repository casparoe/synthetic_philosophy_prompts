answer: |-
  ## Keynote Address: The Friday Night Exchange

  **(Standing at the podium, looking out at the faces: the plumber wiping his hands on a rag, the bakers still dusted with flour, the childminder with a reassuring smile, the haulier leaning forward, the community kitchen organiser radiating energy, the watchful eyes of the mill workers who’ve seen promises crumble, the councillors with crossed arms, the economists with sharp pencils, the reporter poised with his notebook. A deep breath.)**

  Good evening. It’s… unexpected, isn’t it? To find someone like me, who spends his days buried in the dusty arguments of philosophers dead for centuries, standing here as we launch something so vital, so *now*, for our community. Especially in this room, where the echo of the last mill whistle still hangs, a reminder of 1998. That closure wasn't just about bricks and machines; it was about the lifeblood of this place slowing down. Tonight, we start pumping a new kind of blood. Not the old kind, backed by distant promises or hidden vaults. Something different.

  You might know I spend a lot of time with the ideas of an Irish bishop named George Berkeley. Three centuries ago, he wrestled with the same fundamental question we face tonight: what *is* money, really? Especially when the old kind fails a community? He saw through the illusion that money is wealth itself. He argued it’s not gold in a vault, not a government’s promise, not even a ledger entry in a faraway bank that constitutes our true riches. No. **Our wealth is right here.** Look around you. It’s in the fertile fields outside town, it’s in the pipes our plumber knows how to mend, it’s in the warmth of bread fresh from the oven, it’s in the safe hands minding our children, it’s in the strength that built that mill and now builds this cooperative. It’s in our skills, our time, our willingness to work *for each other**. That, Berkeley insisted, is the inexhaustible fund. The *real* wealth.

  So what are these credits we’re about to issue? *(Holds up an example credit note, simple, local design)* They aren’t backed by a pile of gold in the old mill vault – we all know that vault is empty. They aren’t backed by a government guarantee – we know promises can fray. *(Looks directly at the second row)* They aren’t even backed by the goodwill of the town council, though we appreciate their presence tonight. So what makes them worth anything?

  Here’s the radical heart of it, the idea Berkeley championed and we’re bringing to life: **These credits are simply tokens.** Counters. Tickets. Like the dry-cleaning ticket you get for your suit. What makes *that* little slip of paper valuable? Not because it looks like your suit! Not because it’s backed by a vault full of suits! *(A chuckle ripples through the room)* Its value comes only from the promise it represents: that you can hand it back and get your cleaned suit. The ticket *points* to the service. It’s a sign. A useful token that lets the transaction happen smoothly.

  Think about the baker’s note for a loaf of bread next week. The note itself isn’t bread. It doesn’t smell like bread or taste like bread. But when you hand that note to the baker, he gets to work. He makes the bread *because he trusts the sign*. He trusts that the sign connects him to *your* future labour, your chickens, your plumbing, your childcare – something he needs. That little note binds you together. It sets people working. That’s all money ever is, or should be: a token that points to the real wealth – our skills and work – and lets us exchange it easily. These credits are our community’s own tokens, pointing squarely at *our* skills, *our* work, *our* town.

  Now, Berkeley took this idea to the Irish parliament. He argued passionately that Ireland needed its own national bank issuing tokens based on this principle – tokens that would turn Ireland’s latent industry and fertile land into active trade. He failed. Spectacularly. Why? Because he put all his faith in a distant institution, a top-down solution. He lodged the power to create and manage the tokens in a central authority, detached from the daily reality of the tradespeople, the farmers, the everyday needs. It was a good idea, but in the wrong hands – hands too far away to feel the pulse of the real wealth it was meant to unlock.

  Our cooperative learned from that failure. We are not waiting for permission from Dublin, or London, or even the county council. We are not handing the power over our tokens to some distant board. **The authority, the power, the *trust* behind these credits sits right here in this room. It sits with you.** With the plumber who fixes the baker’s sink and accepts credits. With the baker who feeds the childminder’s charges and accepts credits. With the haulier who brings supplies for the community kitchen and accepts credits. With every single one of you who agrees to offer your skill, your time, your goods, in exchange for these tokens, trusting you can spend them again within our network.

  Because that’s the crucial bit, the responsibility Berkeley’s scheme missed: **The volume of these tokens *must* be proportioned to the real work we are actually doing for each other.** If we just print tokens without the work being done, the token becomes meaningless – it points to nothing real. It’s just paper. We prevent that *not* through a central committee imposing limits from above, but through *our own mutual agreement*. If I offer to fix your roof for 500 credits, and you agree, we create those 500 credits *because* that real value – my labour, your need – exists at that moment. If the haulier agrees to transport goods for 200 credits, those credits spring into being tied to that service. The limit is set by the actual agreements we make amongst ourselves, by the real trade happening right here. We are the source and the limit. It’s not abstract; it’s your handshake, your agreement, that breathes life into the token and keeps it honest. *(Looks at the economists)* It’s accountability you can see and touch.

  Which brings me to one of our rules, perhaps the one that feels strangest at first: the carrying cost. If you hold onto a credit balance and do nothing with it for a whole year, a small percentage – just 2% – quietly vanishes from its face value. Why? Berkeley saw a danger in money that never moves. A token that sits idle isn’t pointing to anything. It’s not setting anyone to work. It’s not connecting needs with skills. It’s frozen. And frozen tokens, piling up, can block the flow of the real wealth they’re meant to represent. We want these credits to *circulate*, to keep connecting us, to keep the work happening. The carrying cost is a gentle nudge, a reminder: this token is meant to be used, to be passed hand-to-hand, creating value as it goes. It encourages us to spend within our community, to keep the lifeblood flowing.

  But let’s be absolutely clear about the cost of this rule, especially to those planning, to those saving. *(Looks directly at the retired mill workers)* If you’re setting credits aside week by week, hoping to save up for something significant – maybe a new heating system, maybe help with a big repair – that slow decay *is* a real cost. It means the pile you’re building loses a little bit of its nominal size every year it sits untouched. It makes it harder to use these credits purely as a long-term store of value. I won’t sugar-coat that. It’s a trade-off we’ve consciously made. We’ve chosen a token designed first and foremost to *move*, to facilitate exchange *now*, to get people working *today*, over a token designed primarily to be hoarded for a distant tomorrow. It’s a choice for activity, for connection, for the immediate life of our town. That comes with a sacrifice for long-term savers, and we see that, we acknowledge it plainly.

  Now, I see our reporter friend from the county paper taking notes. He’s called these credits ‘play money’ in print. Play money! *(Turns to the reporter with a wry smile)* Well, Mr. Reporter, I invite you to try something. Next week, take some of your ‘play money’ salary down to the baker and see if he’ll give you a real loaf of bread for it. I suspect he’ll want something more ‘real’. But then, take one of *our* credits, earned perhaps by helping clear the community garden, to that same baker. If he accepts it – and he will, because he trusts *this* token, this sign pointing to *his neighbour’s* skills – then you’ve got your bread. That’s the difference. It’s not about the paper, the ink, or what supposedly ‘backs’ it from afar. It’s about the network of trust and real work *right here* that gives the token meaning. It’s as real as the bread you’ll eat. Call it play money if you like, but if it buys the bread, fixes the pipe, and minds the child? That’s a game where everyone wins. Your scepticism keeps us honest; we welcome it. Just track whether the tokens get the work done.

  So, what now? The theory is laid out. The principles are clear. The responsibility is ours. The mill closed, but we are still here. Our skills are still here. Our willingness to work for each other is still here. That is our inexhaustible fund. These credits are simply the tokens we’ve chosen to unlock it, to connect it, to set it flowing again.

  **What can you do, literally, on Monday morning?** Go to the cooperative’s board in the old post office. List the skill you offer – plumbing, baking, haulage, childcare, knitting, gardening, carpentry, advice. List what you need. Look at your neighbour’s list. Offer a credit for their work. Accept a credit for yours. Start the exchange.

  **(Puts down the speech notes, steps slightly to the side of the podium, speaks directly to the founding members, the plumber, bakers, childminder, haulier, kitchen organiser, mill workers)**

  Let’s get to work.

  **(Steps back, nods to the Chair. Stops.)**
