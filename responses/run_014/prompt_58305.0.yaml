prompt: |-
  I am auditing an undergraduate lecture series on metaethics and wish to assess an overview of expressivism and the Frege–Geach problem that was presented in a preparatory handout for discussion. The handout characterizes the dialectic in approximately the following terms: expressivism holds that a moral utterance such as Tormenting is wrong does not report a moral fact but gives voice to a negative attitude, roughly Boo to tormenting. This story seems to work only for simple, freestanding assertions. In an unasserted context, such as the antecedent of If tormenting is wrong, then paying others to torment is wrong, the speaker is not expressing disapproval of tormenting, so the same words must change their meaning between asserted and unasserted occurrences. Moral modus ponens arguments therefore turn on an equivocation and cannot be valid on expressivist assumptions, despite being obviously valid. Hence expressivism cannot vindicate ordinary moral reasoning unless it abandons the idea that the meaning of a moral sentence is fixed by the attitude it serves to voice.

  I have some reservations about whether this compresses distinct issues, but I lack the background to locate them precisely. Could you provide a careful assessment of the extent to which this characterization is fair? Please distinguish what a contemporary defender of expressivism would accept as accurate, what is a helpful but potentially misleading simplification, and what rests on a conflation the view seeks to avoid. In particular, clarify the relation between assertoric force and meaning, whether the problem is best understood as the invalidity of moral modus ponens or as an explanatory demand upon the expressivist, and whether the handout's final conclusion follows once the summary is corrected.
reasoning: |-
  Okay, the user is auditing an undergraduate metaethics lecture and wants to assess a handout on expressivism and the Frege-Geach problem. They've shared how the handout characterizes the dialectic and have reservations about potential compressions or conflations. 

  First, I need to unpack the handout's summary: It presents expressivism as saying moral utterances express attitudes (e.g., "Boo tormenting!") rather than stating facts. The Frege-Gach problem arises because in unasserted contexts like conditionals, the attitude isn't expressed, so meaning seems to shift. This allegedly makes modus ponens equivocal and invalid under expressivism—threatening ordinary moral reasoning unless expressivism abandons its core claim.

  The user's concerns resonate—this is a common oversimplification. I should distinguish what's accurate from what's misleading. Contemporary expressivists like Blackburn and Gibbard have sophisticated responses. The handout conflates force with content, implying meaning changes in embeddings when expressivists actually develop theories where content remains constant across contexts.

  The core issue isn't that modus ponens becomes invalid—expressivists don't claim that. The problem is explanatory: How can expressivism account for validity without invoking truth-conditional content? The handout's conclusion that expressivism must abandon attitude-based meaning is too strong; modern versions try to explain logic within their framework.

  I'll structure the assessment by:
  - Valid aspects (attitude-expression core, problem in embeddings)
  - Over/misleading simplifications (meaning-change claim, validity misdiagnosis)
  - Problematic conflations (force/content, validity/explanation)
  - Clarifying the real challenge: explaining logical relations with non-representational semantics

  The user's meta-level concern about "compressing distinct issues" is spot-on. They need precise distinctions to evaluate arguments critically—exactly what good philosophy teaching should foster. Their request shows impressive discernment for an auditor.
answer: |-
  Your reservations about the handout's characterization are well-founded. While it captures the *spirit* of the Frege-Geach problem against expressivism, it compresses several distinct issues and employs simplifications that can misrepresent the dialectic and the expressivist response. Here's a careful assessment, distinguishing accurate points, helpful simplifications, problematic conflations, and the core challenge:

  **What the Handout Gets Right (Acceptable Core):**

  1.  **Expressivist Core:** It correctly identifies the expressivist starting point: a moral utterance like "Tormenting is wrong" primarily functions to express a non-cognitive attitude (e.g., disapproval, "Boo!") rather than report a belief about a mind-independent moral fact.
  2.  **The Problem of Embedded Contexts:** It correctly identifies the central challenge for expressivism: explaining the meaning and logical role of moral sentences when they appear in complex, unasserted contexts like the antecedent of conditionals ("If tormenting is wrong..."), negation, questions, etc., where the speaker is *not* directly expressing the attitude.
  3.  **Initial Plausibility Gap:** It rightly highlights that expressivism seems initially plausible only for simple, freestanding assertions. The challenge of embeddings is the main hurdle.
  4.  **Target: Vindicating Ordinary Reasoning:** It correctly states that the goal for expressivism is to "vindicate ordinary moral reasoning," meaning to explain how moral arguments are genuinely valid and how we reason *with* moral claims.

  **Helpful but Potentially Misleading Simplifications:**

  1.  **"Boo to tormenting" as Meaning:** Characterizing the meaning of "Tormenting is wrong" *simply* as "Boo to tormenting!" is a useful pedagogical shorthand to capture the expressivist intuition. However, contemporary expressivists (like Blackburn, Gibbard) explicitly reject that this is the *full semantic content* or *meaning* of the sentence. For them, "Boo!" captures the *force* or *speech act* typically associated with the utterance in assertive contexts, but the *content* itself needs a more sophisticated semantic treatment to handle embeddings. Saying the sentence *means* "Boo!" conflates force and content.
  2.  **"Change their meaning":** The handout says "the same words must change their meaning between asserted and unasserted occurrences." This is a significant oversimplification that misrepresents both the problem and the expressivist ambition.
      *   **The Problem Framed:** The problem isn't that expressivists *believe* the meaning changes; it's that *if* expressivism is understood naively (where meaning = attitude expressed), then it *looks like* the meaning *must* change in embeddings (since the attitude isn't expressed). This is presented as a *reductio* against the naive view.
      *   **Expressivist Goal:** Contemporary expressivists emphatically deny that meaning changes. Their entire project is to develop a semantic theory where the meaning of "tormenting is wrong" is *constant* across asserted and embedded contexts, even though the *force* (attitude expression) is only present in the asserted context. They *aim* to avoid meaning change.

  **Problematic Conflations and Misrepresentations:**

  1.  **Conflation of Assertoric Force and Semantic Meaning:** This is the most significant conflation. The handout treats the *expression of an attitude* (the speech act force) as *being* the meaning of the sentence. However, Frege himself distinguished between force (assertion, question, command) and content (the proposition expressed, which can be embedded). The Frege-Geach problem *presupposes* this distinction: the challenge is for expressivists to explain what the *propositional content* of a moral sentence is (which remains constant in embeddings) if it's not a truth-conditional belief. The handout blurs this crucial distinction, making the problem seem simpler (and expressivism seem dumber) than it is.
  2.  **Misdiagnosis of Validity ("therefore turn on an equivocation and cannot be valid"):** This is a critical misstep.
      *   Expressivists do *not* claim that moral modus ponens arguments are invalid! They firmly believe such arguments *are* valid. The problem is *explanatory*: *How can the expressivist explain or account for the validity* of such arguments using only the resources of their theory (attitudes, plans, commitments)?
      *   The "equivocation" charge stems *only* from the naive "meaning = expressed attitude" view that the handout presents. Sophisticated expressivists explicitly reject this naive view precisely to *avoid* the equivocation charge and to *preserve* the validity of arguments like modus ponens. They argue their developed semantics *does* allow the premises and conclusion to share a common content relevant to logical validity.
      *   **The Real Problem is Explanatory:** The Frege-Geach problem is best understood as demanding that expressivists provide an account of:
          *   **Compositionality:** How does the meaning of a complex sentence (like a conditional) depend systematically on the meanings of its parts (including embedded moral sentences)?
          *   **Logical Relations/Validity:** How, without invoking truth-conditional content (beliefs about facts), can expressivism explain *why* a moral modus ponens argument is logically valid? What property of the attitudes expressed by the premises guarantees the appropriateness of the attitude expressed by the conclusion? How do the attitudes expressed "cohere" logically?
  3.  **Oversimplification of Expressivist Response ("must abandon"):** The handout concludes that expressivism must "abandon the idea that the meaning of a moral sentence is fixed by the attitude it serves to voice" to solve the problem. This is too stark.
      *   Contemporary expressivists (e.g., Blackburn's Quasi-Realism, Gibbard's Norm-Expressivism) *do not abandon* the core expressivist thesis that moral sentences fundamentally express attitudes. Instead, they *reconceive* what "meaning" involves and develop sophisticated semantic frameworks *built upon* the attitude-expressing function.
      *   They aim to show that the *content* that figures in logic (and remains constant in embeddings) is *constituted by* or *supervenes on* complex states of planning, endorsing norms, or adopting commitments that are expressed by the attitude. For Gibbard, "Tormenting is wrong" expresses acceptance of a norm prohibiting tormenting; this "acceptance of a norm" is the state that remains constant in embeddings and figures in logical relations. The attitude-expressing function *grounds* the semantics; it isn't abandoned.

  **Clarifying the Core Dialectic (Post-Correction):**

  1.  **Force vs. Content:** The meaning (content) of a sentence must be separable from the force (assertion, questioning) with which it is uttered. This content must be constant in asserted and embedded contexts.
  2.  **Expressivist Task:** Explain the constant propositional content of moral sentences (e.g., "tormenting is wrong") *in terms of* the non-cognitive attitudes they fundamentally express. Develop a semantics where this content is compositional and can figure in logical relations.
  3.  **The Explanatory Demand (Frege-Geach):** Provide an expressivist-compatible account of:
      *   Compositionality for embeddings (e.g., what does "If tormenting is wrong..." *mean*?).
      *   Logical validity (e.g., *why* is it inconsistent to accept "If tormenting is wrong, then paying others to torment is wrong" and "Tormenting is wrong" but reject "Paying others to torment is wrong"? What property of the attitudes expressed constitutes this inconsistency?).
  4.  **Does the Handout's Conclusion Follow?** No, not strictly. The handout concludes expressivism must abandon attitude-based meaning to solve the problem. Contemporary expressivists argue they *can* solve the problem *without* abandoning the core expressivist insight. They provide complex semantic theories (e.g., using possible worlds, hyperplans, commitment states) where the *content* is defined in terms of the functional role of the expressed attitudes within a system of norms, plans, or commitments. Whether these solutions are ultimately *successful* is hotly debated in metaethics, but the point is they attempt to meet the challenge *within* an expressivist framework, not by jettisoning it. The problem is one of *how* to construct the semantics, not necessarily a death knell requiring abandonment of the core idea.

  **In Summary:**

  *   **Fair:** Highlights expressivism's core and the fundamental challenge of embeddings/logic.
  *   **Over-Simplified/Misleading:** "Boo!" as meaning; claim that meaning *must* change; diagnosis that modus ponens *is* invalid on expressivism; implication that "meaning = expressed attitude" is the sophisticated expressivist view.
  *   **Conflated:** Assertoric force (expressing attitude) with semantic meaning/content.
  *   **Core Problem Clarified:** An *explanatory demand* upon expressivism to provide an account of constant propositional content, compositionality, and logical validity using the resources of attitude expression. The challenge is to explain *how* validity works, not that validity fails.
  *   **Conclusion:** The handout's final conclusion (expressivism must abandon attitude-based meaning) does *not* necessarily follow once the summary is corrected. Sophisticated expressivists believe they can meet the explanatory demand while retaining the core expressivist thesis. The debate centers on whether their complex semantic constructions are adequate.
