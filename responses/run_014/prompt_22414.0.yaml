  Please argue that the Dutch-book argument for the Sure-Thing Principle does not justify the full expected utility theorem, because it only rules out preferences that make the agent willing to accept a statewise dominated package of bets on a fixed state space, and it cannot rule out non-EU preferences over acts that change the state space or impose state-dependent costs.
