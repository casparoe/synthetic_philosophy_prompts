  Example: Agenda: A, B, with constraint A→B.

  Profile: 
  - Voter 1: A, B
  - Voter 2: not A, not B
  - Voter 3: A, not B

  Majority:
  - A: accepted by 1 and 3 -> majority accepts A (2 out of 3)
  - B: accepted only by 1 -> majority rejects B (2 out of 3: voters 2 and 3 reject B)

  Collective: A and not B. But A→B requires that if A then B. We have A and not B -> inconsistent.

  Pathology: This is a simple case of the aggregation problem with a minimal constraint.

