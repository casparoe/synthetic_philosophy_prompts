  ## Eulogy for a Scholar and a Selfless Soul

  We gather today with heavy hearts, bound by love and grief for a remarkable man: my father, a devoted teacher, a cherished colleague, a beloved family member, and a person of extraordinary, quiet courage.

  His life was a testament to deep thought and profound action. For thirty years, within these very halls, he wrestled with the grandest questions of existence, faith, and human freedom. He dedicated his intellectual energy to understanding the intricate dance between divine sovereignty and human liberty, passionately championing a view – Molinism – that sought to hold both truths in careful, respectful tension. He believed fiercely in the reality of our choices, in our capacity to shape the world through genuine freedom.

  And then, he lived it.

  He made a choice that defies easy understanding. Knowing the risks, however small they seemed, hearing the mild cautions of his own doctor, he freely chose to give a part of himself – a kidney – to a stranger he would never meet. He did it simply, unassumingly, because he judged it, in the quiet conviction of his conscience, to be the right thing to do. It was an act of radical generosity, a profound testament to the value he placed on every human life, known or unknown. It was his freedom, his love, made manifest in flesh and blood.

  Tragically, a rare and unforeseen complication followed. That freely chosen act of profound love became the path that led him from us far too soon. The shock, the pain, the sheer senselessness of losing him this way threatens to overwhelm us. We look at this sharp, sudden turn and ask, "Why?"

  It would be easy, perhaps comforting in its simplicity, to say this was simply fate. That it was predestined, decreed, an unavoidable line in a script written long ago. But that would dishonor the very core of who he was and what he spent his life teaching. He would gently, firmly, correct that notion. It would also be a disservice to suggest the divine gaze was ever turned away, that God was somehow caught unawares by the path his love had chosen. He would equally reject that.

  Dad believed in a God whose knowledge is as deep as eternity itself. He spoke often of God seeing, from beyond the dawn of creation, the vast tapestry of possibilities – every choice every free creature *would* make, given any conceivable circumstance. He believed God, in wisdom and love, chose to create *this* world, knowing full well the choices my father – and each of us – would freely make within it. God saw the beauty of that selfless donation Dad would choose to offer a stranger. God saw the depth of his character that would lead him to make that choice, even with the doctor’s caution in his ear. And God, foreseeing that free act of love, chose to weave it into the fabric of this world’s story.

  **This knowledge did not make the choice any less Dad’s.** It was his alone. He weighed it, he owned it, he acted upon it freely. The risk was terrifyingly real, the outcome uncertain *to him* in that moment of decision – that’s what made it courage. **Nor did this knowledge make God the author of the tragedy.** The complication was a terrible, random blow within the natural order of this world – the very world God chose to create, knowing free creatures would act within it, knowing sometimes the noblest choices carry unforeseen, heartbreaking costs.

  So, was his death senseless? In the immediate, visceral pain, it feels that way. A vibrant life, a brilliant mind, a loving heart, extinguished by a cruel twist after an act of pure goodness. The ache of his absence screams against meaning.

  But meaning isn't found only in the outcome; it is also found in the act itself, in the character revealed, in the love expressed. His death was not *planned* as the price for his donation, but it occurred *within the context* of a choice that was breathtakingly meaningful. **He freely chose love.** He freely chose self-sacrifice. He freely chose to value another’s life so deeply that he risked his own. That act stands, forever luminous, regardless of the tragic aftermath.

  God, knowing Dad’s heart and foreseeing this very choice, created a world where such radical, free love could exist and shine forth. God incorporated that free choice into the unfolding story of providence, even as we now struggle to comprehend the chapter that followed.

  To his colleagues: He lived the distinction he taught. His choice was genuinely free, genuinely risky, genuinely *his*. God’s foreknowledge encompassed it; it didn’t cause it or strip it of its freedom. The complication proves the risk was real, the freedom authentic.

  To our family, his friends, all who loved him: His death is a devastating loss, a wound that will never fully heal. But his *act*, the reason he was in that circumstance, was not senseless. It was the ultimate expression of who he was: a man who thought deeply about freedom and responsibility, and then *lived* that belief with quiet, unwavering courage. He chose love. He chose to give life. That choice, freely made from the depth of his character, imbues his life – and even his passing, however painful – with profound meaning. His legacy isn't just in the books and the lectures, but in that astonishing gift, freely given.

  He showed us what genuine freedom looks like when it walks hand-in-hand with deep compassion. He showed us that love, freely chosen, is the most powerful force in any world, even a world where tragedy sometimes follows. We mourn the man, the teacher, the father, the friend. We rage against the cruel randomness that took him. But we also stand in awe of the choice he made. He lived his philosophy, and in doing so, he showed us a glimpse of transcendent, costly love.

  We will miss him more than words can say. But we honor him best by remembering not just his brilliant mind, but his boundless, freely given heart. May we find comfort in his courage, strength in his love, and hope in the belief that his freely chosen gift was seen, known, and woven into a story far larger than we can see. Rest in peace, Dad. Your freedom was real. Your love was real. And it changed the world.
