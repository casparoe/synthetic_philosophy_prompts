prompt: |-
  I have been trying to work out what I think about group decision procedures — specifically, when a group should vote on the sub-questions that determine an outcome rather than voting on the outcome directly. My reactions to a series of cases do not seem to fit any principle I can state, and I would like your help finding one, or learning which of my verdicts I should abandon.

  Here are the cases:

  1. A three-judge appellate panel must rule on a contract dispute. Liability requires both that a valid contract existed and that it was breached. The panel votes directly on the ultimate question: liable or not liable. Judge A votes liable; Judges B and C vote not liable. The court finds no liability, 2–1. Verdict: unproblematic.

  2. Same panel, same legal question, but this time each judge votes separately on the two premises, and the court's conclusion is determined by whether each premise commands a majority. The judges' views are: Judge A — contract yes, breach yes (so would vote liable); Judge B — contract yes, breach no (so would vote not liable); Judge C — contract no, breach yes (so would vote not liable). On the premise votes, "contract existed" passes 2–1 (A and B), and "breach occurred" passes 2–1 (A and C). The court therefore finds both premises true and enters a judgment of liability. But Judges B and C, a majority of the panel, would each vote not liable if asked directly. The procedure has produced an outcome that a majority of the panel rejects. Verdict: this procedure is defective. A group decision procedure should not generate a conclusion that a majority of the group would reject if voting on the conclusion directly.

  3. A five-member university tenure committee must decide on a candidate. The rules require a majority finding of excellence in each of research, teaching, and service; the candidate receives tenure only if all three thresholds are met. The committee votes on each area separately. The votes come out: research 4–1, teaching 3–2, service 3–2. The candidate receives tenure. Verdict: unproblematic. This is premise-by-premise voting, yet I feel none of the unease I felt in case 2.

  4. A jury in a criminal trial must decide guilt, which requires proof beyond reasonable doubt of both actus reus and mens rea. The judge instructs the jury to deliberate on each element separately and to convict only if they find both elements proven. The jury finds actus reus proven 10–2 and mens rea proven 10–2, and returns a guilty verdict. Verdict: unproblematic — indeed, this seems like the right way for a jury to proceed. Structurally it resembles case 2, but I cannot bring myself to condemn it.

  5. A three-member ethics committee must decide whether to approve a study. The rules require majority approval on each of three criteria — minimal risk, valid consent, and scientific merit — and all three must pass. The members vote as follows:
  - Member 1: risk yes, consent yes, merit no → would vote to reject
  - Member 2: risk yes, consent no, merit yes → would vote to reject
  - Member 3: risk no, consent yes, merit yes → would vote to reject
  On the premise votes, risk passes 2–1, consent passes 2–1, and merit passes 2–1. The study is approved. But every single member would vote to reject the study if voting on the conclusion directly. The procedure has produced an outcome that is unanimously opposed. Verdict: this is even worse than case 2. The procedure is clearly defective — indeed, absurd.

  6. A five-member appointments committee must decide whether to hire a candidate. The rules require a majority on each of two criteria: qualifications and interview performance. The committee uses premise-by-premise voting. The votes are:
  - Members 1 and 2: qualifications yes, interview yes → would vote to hire
  - Member 3: qualifications yes, interview no → would vote not to hire
  - Members 4 and 5: qualifications no, interview yes → would vote not to hire
  Qualifications pass 3–2; interview passes 4–1. The candidate is hired. But Members 3, 4, and 5 — a majority — would each vote not to hire if asked directly. Verdict: this bothers me, and it seems structurally identical to case 2. Yet my reaction is slightly milder here than in case 2, and I am not sure why. Perhaps because the two premises feel more like genuinely separate judgments — qualifications versus interview performance — than the two premises in the contract case, which both feed into a single legal conclusion in a tighter way. But I am not confident this distinction holds up.

  What I am after is a principle that tells me when premise-by-premise voting is acceptable and when it is not — one that explains why I accept it for the tenure committee and the jury, reject it for the appellate panel and the ethics committee, and feel an intermediate unease about the appointments committee. Is there a single principle that captures all six verdicts? If not, which should I revise, and what does the best available principle predict about a case I have not considered: a three-person committee choosing a conference venue, where the choice is determined by majority votes on affordability, accessibility, and capacity, and the members' preferences are such that the premise-by-premise procedure selects a venue that no single member actually wants?
reasoning: |-
  Okay, let me try to figure out what's going on with this user's problem. They're struggling with group decision procedures, specifically when to vote on sub-questions versus the final outcome. They provided six cases with their own verdicts and want a unifying principle. 

  First, I notice the user is likely someone involved in legal or academic governance—maybe a law professor, judge, or committee member. Their examples are heavy on judicial/committee decisions, and they're clearly well-versed in formal reasoning. The frustration they express suggests they've wrestled with this for a while.

  Hmm, their core tension seems to be that their intuitive judgments feel inconsistent: premise voting feels right in tenure/jury cases but wrong in contract/ethics cases. The appointments committee case sits in a gray area. What deeper need might they have? Probably not just theory—they likely want practical guidance for designing real voting procedures. Maybe they're drafting rules somewhere and need justification.

  Looking at their verdicts: 
  - Case 1 (direct liability vote) is fine. 
  - Case 2 (premise voting leading to liability despite majority opposition) is defective. 
  - Case 3 (tenure) is fine even with premise voting. 
  - Case 4 (jury) is not just fine but ideal. 
  - Case 5 (ethics committee) is "absurd." 
  - Case 6 (appointments) is bothersome but less than case 2.

  The key difference I spot is that in the "problematic" cases (2,5,6), premise voting creates an outcome opposed by a majority (or unanimity) on the final question. But why is this acceptable in tenure/jury cases? 

  Ah! In tenure and jury contexts, the premises are *independent criteria*—research/teaching/service, actus reus/mens rea—each requiring separate judgment. The group isn't meant to vote directly on tenure or guilt; the premises *define* the outcome. Whereas in the contract case, "liable" is a holistic legal conclusion that might involve trade-offs between elements. 

  The ethics committee case is extreme because it forces approval despite *everyone* rejecting the study. This reveals premise voting's flaw when criteria aren't truly separable. The appointments case feels less bad because qualifications/interview seem more distinct than contract elements, but still artificial.

  For the conference venue hypothetical: if premises are affordability/accessibility/capacity, and premise voting picks a venue nobody wants, that would be defective. The user should reject it—consistent with cases 2/5/6.

  So the principle could be: Premise voting is legitimate when the premises are *constitutive* (they define the outcome) and *non-compensatory* (you can't trade off weaknesses in one against strengths in another). 

  The user might need to revise their appointments verdict (case 6) to "defective" for consistency. Alternatively, they could argue qualifications/interview are sufficiently independent to tolerate the anomaly—but that weakens the principle. 

  Biggest insight: The issue isn't about voting mechanics but about *what the group is being asked to decide*. Premise voting works when the group's task is to evaluate building blocks, not when it's to exercise holistic judgment.
answer: |-
  Your intuitions across these cases reveal a coherent principle, though one that requires distinguishing between **procedural legitimacy** and **epistemic appropriateness**. The key is whether the group's mandate is to make a *holistic judgment* or to apply *predefined conjunctive criteria*:

  ### The Principle
  > **Premise-by-premise voting is legitimate when the premises are constitutive, non-compensatory criteria defining the outcome. It is illegitimate when the group is expected to make a unified, compensatory judgment on the ultimate question.**

  This resolves your verdicts as follows:

  ---

  ### Case Analysis
  1. **Appellate Panel (Direct Vote)**  
     *Unproblematic*: Judges make a holistic legal judgment ("liable"). Direct voting aligns with their mandate.  
     → **Principle**: Holistic judgment requires direct voting.

  2. **Appellate Panel (Premise Vote)**  
     *Defective*: "Liable" is a unified legal conclusion. Premise voting artificially fragments judicial reasoning, allowing liability despite majority opposition. Judges *compensate* across premises (e.g., "weak contract but clear breach" vs. "valid contract but no breach").  
     → **Violation**: Mandate requires holistic judgment, but procedure ignores compensatory reasoning.

  3. **Tenure Committee**  
     *Unproblematic*: Excellence in research/teaching/service are *constitutive criteria*. Tenure *is defined by* passing each threshold. No trade-offs are permitted (e.g., poor teaching isn’t offset by stellar research).  
     → **Principle**: Premises define the outcome; no holistic override exists.

  4. **Jury Trial**  
     *Unproblematic*: Actus reus and mens rea are *elemental prerequisites* for guilt. The law defines guilt as both proven BARD. Jurors aren’t asked, "Is the defendant guilty?" but "Is each element met?"  
     → **Principle**: Premises are legally constitutive; no compensatory guilt judgment is allowed.

  5. **Ethics Committee**  
     *Defective/Absurd*: Approval requires passing all criteria, yet each member holistically rejects the study. Premise voting ignores their integrated assessment (e.g., "high risk outweighs consent/merit").  
     → **Violation**: Members are exercising expert judgment, not applying mechanical rules. Unanimous opposition to the outcome signals a procedural failure.

  6. **Appointments Committee**  
     *Mildly Problematic*: Qualifications and interview are *somewhat independent*, but committee members likely see them as compensatory (e.g., "weak interview despite strong qualifications" justifies rejection). Your unease stems from ambiguity:  
     - If the criteria are rigid (e.g., "must meet both thresholds"), premise voting is *technically* valid but may feel artificial.  
     - If members expect holistic discretion, it’s defective.  
     → **Ambiguity**: The mandate ("rules require majority on each") suggests constitutive criteria, but human judgment seeks compensation. Revise your verdict: this *is* defective if the committee’s role involves discretion.

  ---

  ### The Core Distinction
  - **Constitutive Premises** (Cases 3–4):  
    The outcome is *defined by* the conjunction of premises. No "higher" judgment exists. Premise voting is necessary.  
  - **Compensatory Judgment** (Cases 2, 5–6):  
    The group is expected to weigh premises holistically (e.g., "Does the breach matter if the contract was ambiguous?"). Premise voting overrides this integration, risking incoherent outcomes.

  ---

  ### Conference Venue Case (Your Hypothetical)
  - **Scenario**: Three-person committee votes on affordability, accessibility, and capacity. Premise voting selects a venue that no member wants.  
  - **Verdict by Principle**: **Defective**.  
    - Choosing a venue is a *compensatory* decision: members likely have trade-offs (e.g., "less affordable but perfect accessibility").  
    - The premises are inputs to a holistic preference ("Which venue is best overall?"), not rigid pass/fail gates.  
    - Premise voting ignores how criteria interact in members’ judgments.  

  ---

  ### Recommendations
  1. **Revise your appointments verdict (Case 6)**: It *should* bother you. The outcome conflicts with majority judgment, signaling a mandate misalignment. If the rules force premise voting, the rules are flawed.  
  2. **Accept all other verdicts**: They align with the principle.  
  3. **Designing Procedures**:  
     - Use **premise-by-premise voting** when outcomes are constitutionally defined by *non-compensatory* criteria (e.g., legal elements, tenure thresholds).  
     - Use **direct voting** when the group must weigh trade-offs holistically (e.g., judicial rulings, ethics approvals).  
     - Hybrid Approach: Allow premise voting but permit a *final override vote* if the outcome contradicts holistic judgment (e.g., ethics committee could reject a study passing all criteria if 4/5 oppose it overall).

  ### Why Tenure/Jury Feel Different Than Ethics
  In tenure/jury cases, society/law *deliberately* removes discretion: "All elements must be proven" or "No tenure without teaching excellence." The premises *are* the decision. In ethics/appointments, the committee’s role implies integrative wisdom—premise voting strips that authority. Your intuition detects this boundary between **rule-bound certification** and **expert deliberation**.
