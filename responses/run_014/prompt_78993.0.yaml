  Hmm, their core struggle is methodological: is Marx playing by the economists' rules to expose contradictions (reductio) or dismantling their entire foundation? The theological analogy is key—Marx accuses economists of treating historical outcomes (like private property) as primordial givens, just as theologians treat "the Fall" as a given rather than explaining evil's origin. That's begging the question. 

  For the "actual economic fact," it's both empirical and conceptual—the wage relation inherently makes labor a commodity, which is observable but also logically necessary under capitalism. The inverse proportion claim bridges alienation (worker's loss of control) and exploitation (value extraction), but they're intertwined here—alienation enables exploitation. 

  The "immanent critique" label does heavy lifting: Marx uses economists' own logic to show their premises lead to conclusions they'd reject (like extreme inequality). But proving incoherence would require showing private property contradicts other premises, which he doesn't fully do here. 

