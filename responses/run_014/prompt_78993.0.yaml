answer: |-
  Here's a breakdown of the passage, tackling your specific questions head-on, including the tension, the analogy, and the "actual economic fact," while staying self-critical about the interpretation:

  **1. The Apparent Tension & Marx's Method: Immanent Critique (Your Friend is Right)**

  *   **What Marx is Doing:** This *is* textbook **immanent critique**. It's not *just* arguing against economists using their own assumptions; it's a specific, powerful philosophical method.
  *   **How it Resolves the Tension:**
      *   **Paragraph 1 (Accepting Premises):** Marx isn't *endorsing* the premises of political economy (PE) as true descriptions of eternal human nature or just social relations. He's temporarily **bracketing his own critique** to demonstrate that *even if we grant the economists their own starting points and logic*, their system leads to conclusions that are devastating for the worker and inherently unstable/contradictory ("society must fall apart"). He's showing the *internal* consequences of PE's own logic.
      *   **Paragraph 2 (Criticizing PE's Method):** Here, Marx steps back and critiques *how* PE establishes its fundamental premises in the first place. He accuses PE of **circular reasoning** and **begging the question**. PE doesn't *deduce* its core concepts (private property, division of labor, exchange) from fundamental principles or historical analysis; it simply *assumes* them as primordial, natural facts (like the theologian assumes the Fall). This assumption hides the historical development and contingent nature of these concepts.
  *   **Reductio vs. Incoherence:**
      *   **Strong Reductio (Leaning Towards This):** Marx primarily demonstrates that PE's premises, *if accepted*, lead logically to conclusions PE itself would find abhorrent (extreme worker immiseration, societal collapse into two hostile classes, monopoly) or that expose a deep instability within the system it describes. This is powerful *within* the PE framework.
      *   **Incoherence? (Less Emphasized Here):** While Marx implies PE's foundations are flawed because they are unexamined historical artifacts, he doesn't *explicitly* demonstrate a logical contradiction *between the premises themselves* in this specific passage. He shows the premises lead to bad outcomes, not that the premises are internally inconsistent *with each other*. His later philosophical work (on human essence/species-being) provides the deeper ground for calling the premises incoherent *with human nature*, but that's not the focus of this *immanent* critique within PE's own terms.
      *   **Change My Mind?** If later in the Manuscripts (or especially in *Capital*), Marx directly argues that private property inherently contradicts a fundamental premise of PE (e.g., that labor is the source of value) in a logically necessary way *prior* to historical consequences, I'd lean harder towards "incoherence from the outset." Here, the emphasis is on the *outcomes* generated *from* the premises using PE's own logic.

  **2. Unpacking the Theological Analogy:**

  *   **The Parallel:**
      *   **Theologian:** Has to explain the *origin of evil*. Does so by pointing to the *Fall of Man*. But the Fall itself *is* the primordial act of evil/sin that needs explaining! The theologian *assumes the very thing needing explanation* (the existence of a fundamental rupture/evil) as a given historical event. It explains nothing; it just pushes the question back.
      *   **Political Economist:** Has to explain the fundamental structures of the economy (private property, division of labor, exchange). Does so by assuming these exist in a "fictitious primordial condition" as natural, eternal facts. But *how did these structures arise? What necessitates their relationship (e.g., division of labor necessitates exchange)?* The economist *assumes the very things needing explanation* as given starting points. It explains nothing; it just pushes the question back into a mythical past.
  *   **What is Being Begged?** The **historical contingency and social origins** of private property, the division of labor, and exchange. PE treats them as natural and inevitable starting points rather than as social relations that emerged through specific historical processes and require explanation. The question "Why do these structures exist and relate this way?" is begged by simply asserting they always did/do.

  **3. "An Actual Economic Fact" - What It Means:**

  *   **Empirical AND Conceptual:** It's both, but the conceptual consequence is primary *in this argument*. Marx is referring to the **wage relation** itself, specifically the fact that under capitalism, the worker's labor becomes a *commodity* sold to the capitalist.
  *   **The Fact:** Workers produce goods (commodities) with value. Yet, the worker doesn't own these goods or their full value. Instead, the worker *sells their labor-power* (capacity to work) to the capitalist for a *wage*. The value of the wage is less than the value the worker's labor creates during the work period (this is exploitation, but Marx derives this later).
  *   **Why it's "Actual":** This isn't a mythical primordial condition; it's the observable, fundamental relationship structuring capitalist production *right now*. Marx starts his analysis of alienation *here*, from this concrete, present reality of the worker as a seller of their labor-power as a commodity. This fact is empirically observable (workers get wages, capitalists own products) but its *significance* as the core exploitative and alienating relation is the conceptual starting point.

  **4. Inverse Proportion: Alienation, Exploitation, and Economics**

  *   **Running Them Together (For Now):** At this stage in the Manuscripts, Marx is absolutely running alienation and exploitation together. He hasn't fully developed the precise economic mechanics of exploitation (surplus value theory) found in *Capital*. The focus here is phenomenological and philosophical: the worker's lived experience.
  *   **What the Inverse Proportion Describes:**
      *   **"Power and Magnitude of his Production":** The worker produces ever more goods (magnitude), with ever more powerful technology and organization (power), increasing societal wealth and the capitalist's power/wealth.
      *   **"Wretchedness of the Worker":** This encompasses both economic exploitation (the worker gets a smaller relative share of the wealth they create, becoming relatively poorer) *and* alienation:
          *   *Alienation from Product:* The worker doesn't own the powerful things they make.
          *   *Alienation from Activity:* Labor becomes a mere means to survive (the wage), not fulfilling.
          *   *Alienation from Species-Being:* The worker's creative, social essence is denied.
          *   *Alienation from Others:* Relations become mediated by commodities and class conflict.
  *   **Why the Distinction Matters (A Bit) Later:** While intertwined here, the distinction becomes crucial. **Exploitation** is the specific *economic mechanism* (extraction of surplus value) enabling capital accumulation. **Alienation** is the broader *human/social consequence* – the dehumanizing experience resulting from the worker's position within the system *characterized* by exploitation. This passage describes the *phenomenon* of alienation/immisement resulting from the worker's role *as* a commodity producer within PE's own framework.

  **Self-Critique & Weakest Link:**

  *   **Favoring Reductio:** I lean heavily towards reading this as a powerful *reductio ad absurdum* (immanent critique) within PE's terms, rather than a full demonstration of the *incoherence* of the premises themselves *at this exact point*.
  *   **What Would Change My Mind?** If Marx immediately follows this passage by arguing that the *concept* of private property logically contradicts the PE premise that *labor is the source of all value*, demonstrating an internal logical flaw *prior* to the historical consequences, that would push me towards the "incoherent from the outset" reading. The surrounding text focuses more on the *outcomes* (worker as commodity, immiseration, class polarization) derived *from* the premises.
  *   **Weakest Link in My Reasoning:** My distinction between "premises leading to bad outcomes" (reductio) vs. "premises being logically incoherent." Marx *clearly* believes the premises are flawed and historically contingent. The line between showing premises lead to self-destructive consequences and showing they are inherently contradictory is blurry. My assertion that he doesn't demonstrate *logical* incoherence *here* could be challenged by seeing the polarization into two antagonistic classes as the *manifestation* of an inherent contradiction within the property relation itself (owners vs. non-owners). I rely on the lack of explicit logical deduction of contradiction *between the premises* (e.g., "Private property implies X, but labor-as-source-of-value implies not-X") in this specific passage.

  **In Summary:** Marx uses PE's own language and laws (Paragraph 1) to show its logic leads to worker degradation and societal crisis (a devastating immanent critique/reductio). He then criticizes PE (Paragraph 2) for failing to explain its *own* foundations, merely assuming them like a theologian assumes the Fall (begging the question). He starts his positive analysis from the "actual economic fact" of the worker selling labor-power as a commodity. The "inverse proportion" describes the combined effect of exploitation and alienation resulting from this fact, using PE's own framework against it. Your friend's "immanent critique" label is precisely correct and analytically useful here.
