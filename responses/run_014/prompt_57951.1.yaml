answer: |-
  Below is a 9-question quiz designed to help workshop participants (non-philosophers) uncover their gut instincts about advance directives without using jargon or abstract labels. Each question presents a concrete scenario with 2–3 choices. The quiz sorts participants into one of four views based on their answers, with a scoring key at the end. I've built this around your three core cases (the professor, the bipolar Ulysses contract, and the artist) and added six more to cover the views and ensure differentiation. I also analyzed the answer combos for gaps or overlaps, as requested.

  **Key for Views (Don't Share This Until Scoring):**
  - **Hard Precedent Autonomy (H)**: The earlier self's competent directive always wins. The later self must follow it, even if they seem happy or changed.
  - **Best-Interests Override (B)**: A directive can be ignored if the later self is content and following it would cause harm or unhappiness.
  - **Relational/Narrative (R)**: Family, life story, and relationships matter most. The directive is a starting point, but decisions should involve others and fit the person's overall narrative.
  - **Skeptical (S)**: An old directive is just one clue and has no special power. Current wishes or circumstances override it.

  ---

  ### **Quiz: What Guides Your Thinking on Advance Directives?**
  *For each scenario, pick the choice that feels right to you. There are no right or wrong answers—just go with your gut.*

  1. **Professor Case**: Years ago, Professor Anna wrote a directive: "If I get dementia, do not treat infections like pneumonia. I wouldn't want to live that way." Now she has moderate dementia. She seems cheerful, and when she gets pneumonia, she says, "Please give me medicine—I want to get better!" What should her doctors do?
     - A. Refuse the medicine because that's what she decided when she was clear-headed.
     - B. Give the medicine because she's happy now and wants to live.
     - C. Ask her family what feels true to her life story—like her values or how she lived.

  2. **Bipolar Ulysses Case**: Ben has bipolar disorder. When stable, he signed a "Ulysses contract": "When I'm manic, I might refuse treatment, but hospitalize me anyway—I know I need it." Now he's manic and says, "I take it back! Don't hospitalize me!" What should his care team do?
     - A. Hospitalize him because he agreed to it when he was thinking straight.
     - B. Don't hospitalize him because he's refusing now, and his current "no" matters most.
     - C. Hospitalize him because he's a danger to himself, and safety comes first.

  3. **Artist Case**: Artist Carla made a video directive: "If I get dementia, destroy my unfinished artwork—I don't want people to see my messy drafts." Now with dementia, she loves flipping through her old sketchbooks and smiles while doing it. What should her family do?
     - A. Destroy the art as she instructed—it was important to her when she was well.
     - B. Let her keep the art because it brings her joy now, even if it's "embarrassing."
     - C. Discuss it with her close friends to decide what’s best for her story and relationships.

  4. **Feeding Tube Case**: Years ago, David wrote: "If I get severe dementia and can't eat, don't use a feeding tube. I value independence over survival." Now he has severe dementia, can't swallow well, and seems calm but can't express wishes. His family is torn. What should caregivers do?
     - A. Skip the feeding tube—he was clear about this when he could decide.
     - B. Use the feeding tube to keep him alive since he isn't suffering.
     - C. Have a family meeting to weigh his past values against his current peace.

  5. **Depression Directive Case**: Maria wrote during a stable time: "If I get severely depressed and refuse help, make me take antidepressants—I know I'll regret refusing." Now she's severely depressed and says, "Don't force me—I hate meds!" What should her doctor do?
     - A. Force the treatment because she asked for this when she was well.
     - B. Respect her current refusal—she’s saying "no" now, so that’s what counts.
     - C. Talk to her sister and therapist about what fits her recovery and relationships.

  6. **Nursing Home Case**: Long ago, Joe wrote: "Never put me in a nursing home—I'd rather die." After a stroke, he needs nursing home care. He seems content there but doesn't talk much. His family knows about his directive. What should they do?
     - A. Move him out—he was adamant about this when competent.
     - B. Keep him there because he’s comfortable and his needs are met.
     - C. Gather the family to decide what honors his whole life journey.

  7. **Coma Case**: Sarah wrote: "If I’m in a permanent coma, don’t use machines to keep me alive." Now she’s in a coma on a ventilator. Her family says, "We believe in miracles—keep her alive a while longer." What should happen?
     - A. Remove the ventilator—she was clear in her directive.
     - B. Wait for the family—they knew her best and this feels right for her story.
     - C. Keep the ventilator because life is precious, and she might recover.

  8. **Infection Case**: A person wrote: "If I get late-stage cancer, no antibiotics for infections—let nature take its course." Now at late stage, they have a severe infection and can’t communicate. The family disagrees on treatment. What should doctors do?
     - A. Withhold antibiotics—it’s what they wanted when they could decide.
     - B. Give antibiotics because it might extend life and ease suffering.
     - C. Let the family decide based on their shared history and values.

  9. **Old Directive Case**: Twenty years ago, John wrote: "No blood transfusions—I’m a Jehovah’s Witness." He hasn’t updated it. Now he’s unconscious and needs a transfusion. His family says, "He left that faith a decade ago." What should doctors do?
     - A. Refuse the transfusion—his directive is binding.
     - B. Do the transfusion—his old note doesn’t reflect who he is now.
     - C. Ask his family what he’d choose today based on his recent life.

