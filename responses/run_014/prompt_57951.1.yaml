  ### **Scoring Key**
  First, tally your choices using the grid below. Each letter corresponds to a view (H, B, R, or S). I’ve mapped every possible combo to the four views—no impossible or incoherent patterns exist, but some views share similarities (noted below).

  | Question | Your Choice | View (For Scoring) |
  |----------|-------------|---------------------|
  | 1        | A → H       | **H** (Hard Precedent) |
  |          | B → B       | **B** (Best-Interests) |
  |          | C → R       | **R** (Relational)   |
