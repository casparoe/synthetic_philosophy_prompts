  |          | B → S       | **S** (Skeptical)    |
  |          | C → R       | **R** (Relational)   |

  **How to Score:**
  - Count how many times you chose each view (**H, B, R, S**).
  - Your dominant view is the one with the **highest score**. If there’s a tie, see the tiebreaker notes below.

  #### **What Your Score Means**
  - **Mostly H (Hard Precedent Autonomy)**: You believe the earlier, competent self has the final say. The later self must "obey" the directive—even if they’re happy, changed, or objecting—because the earlier self knew best. *Example from quiz: Choosing A in Q1 (professor) or Q2 (bipolar) means the directive wins, no matter what.*
    
  - **Mostly B (Best-Interests Override)**: You think the directive can be ignored if the later self is content and following it would cause harm or unhappiness. Happiness and well-being now matter more than past wishes. *Example: Choosing B in Q1 (professor) or C in Q2 (bipolar) focuses on current comfort over past orders.*

  - **Mostly R (Relational/Narrative)**: You prioritize family input, relationships, and the person’s life story. The directive is a clue, but decisions should involve others and fit the "bigger picture" of who this person was and is. *Example: Choosing C in Q3 (artist) or Q6 (nursing home) means family and story matter most.*

  - **Mostly S (Skeptical)**: You see the directive as outdated evidence with no special authority. Current wishes, even if impaired, or new facts should override it. *Example: Choosing B in Q5 (depression) or B in Q9 (old directive) means "now" trumps "then."*

  #### **Tiebreakers and Nuances**
  - **H-B Tie?** (Common): You’re torn between respecting directives and protecting well-being. You lean **Hard Precedent** if ties include Q2A or Q5A; **Best-Interests** if ties include Q2C or Q7C.
  - **H-R or B-R Tie?**: You mix autonomy with relationships. You lean **Relational** if ties include Q4C or Q8C.
  - **S-R Tie?** (Rare): You balance skepticism with family input. You lean **Skeptical** if ties include Q5B or Q9B.
  - **Low Scores?** (e.g., 2-3 in multiple views): You’re pragmatic—context matters most. Re-take focusing on your "gut" reactions.

  #### **Design Notes**
  - **No Empty Combos**: All answer patterns map to at least one view. Skeptical (S) has fewer questions (only Q2B, Q5B, Q9B) because it’s less common in debates, but every combo is possible.
  - **Where Views Overlap**: 
    - **Best-Interests (B) vs. Relational (R)** can be fuzzy (e.g., Q7B and Q7C both prioritize current well-being). But B focuses on *individual* happiness, while R focuses on *relationships/story*. The quiz separates them by forcing a choice (e.g., Q7C is explicitly about "life being precious," while Q7B is about family input).
    - **Skeptical (S) vs. Best-Interests (B)** overlap when current well-being is cited (e.g., Q5B could be both). But S is distinct in rejecting the directive’s authority entirely (e.g., Q9B is purely skeptical).
  - **Why It Works**: The quiz forces concrete choices in your three key cases (professor → Q1, bipolar → Q2, artist → Q3) and uses other scenarios to differentiate views. Nurses/caregivers can see their biases without philosophy terms.

