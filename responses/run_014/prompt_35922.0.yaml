prompt: |-
  I'm a software engineer with no formal training in philosophy, and there's a pattern in my own field that I've never been able to justify to myself in clean terms. I'd like you to reconstruct what view of knowledge it presupposes.

  Here is the pattern. On one hand, applied cryptography rests on a doctrine, usually attributed to Kerckhoffs, that a system should remain secure even if everything about its design is public. Treating secrecy of the algorithm itself as protection — "security through obscurity" — is regarded as a rookie mistake, almost a moral failing, and we design on the assumption that the adversary has the full specification in hand. On the other hand, the public-key cryptography that secures nearly all internet commerce — RSA, Diffie–Hellman, elliptic curve schemes — rests on assumptions like "there is no efficient algorithm for factoring large integers," and nobody has ever proven any such thing. P versus NP is open, the hardness of factoring is open, the discrete logarithm problem is open. In effect, the world's payment infrastructure runs on unproven conjectures, and the profession treats this as prudent engineering.

  So the field trusts one kind of "no one has found a way in" and distrusts another. Thousands of people have failed for decades to break RSA, and we take that as strong evidence of safety; equally many people have failed to discover some vendor's secret design, and we take that as no evidence at all. What theory of evidence, or of knowledge, does that split presuppose?

  My own first stab at it, for what it's worth: the asymmetry may have something to do with facts that already exist versus facts that must be created. A secret design exists somewhere — in a head, a repository, a filing cabinet — so its not being known is a contingent state that one act of espionage can reverse, whereas an efficient factoring algorithm, if there is one, exists nowhere until someone invents it, so decades of not finding it track the difficulty of creation rather than the integrity of storage. But I can see the objection to my own story: mathematical discoveries do happen abruptly, at the hands of single individuals, and when one happens the hardness assumption collapses overnight, just as a leak collapses a secret. Perhaps the practice rests on something else entirely, or is quietly incoherent, or the two stances are underwritten by different views that only look like the same kind of trust.

  Please do the following. Reconstruct, in plain language, the implicit epistemology of the practice: what it presupposes about mathematical knowledge as opposed to knowledge of secrets, and about what a long history of failed attempts is evidence of. Then say whether that presupposition is coherent, or whether the practice is actually relying on something it doesn't acknowledge — for instance, a bet on the rarity of mathematical invention, which is a sociological or psychological wager rather than a fact about knowledge. Next, identify where the practice is genuinely underdetermined, that is, where several quite different theories of evidence would license exactly the same behavior, so that the practice cannot be said to presuppose any one of them. Finally, tell me what would have to change in engineering if the implicit view were replaced by a demand for proof: would we be left with nothing but information-theoretically secure schemes like one-time pads and honest few-time authenticators, or does the current migration to post-quantum algorithms — which merely swaps one set of unproven hardness assumptions for another — show that the profession has already concluded the presupposition is all it has, and has decided to live with it? Keep the philosophy accessible; I can follow the mathematics, but I have never read a page of epistemology.
reasoning: |-
  Okay, let me try to unpack this software engineer's question. They're pointing out a fascinating contradiction in cryptography: on one hand, they reject "security through obscurity" (Kerckhoffs's principle), but on the other, they rely entirely on unproven mathematical assumptions like the hardness of factoring. The engineer is wondering what underlying theory of knowledge makes this split coherent.

  First, I need to understand why these two cases are treated differently. The engineer's own hypothesis is that mathematical truths exist independently while secrets are contingent. That's a good starting point, but they rightly note that mathematical breakthroughs can also happen suddenly, just like leaks. So there must be more to it.

  Hmm, maybe it's about the nature of the search space. For mathematical problems, the solution space is structured and public. Cryptographers have a clear map: they know what factoring involves, and decades of focused effort haven't found shortcuts. But for a secret algorithm, the "search" is chaotic - it could be leaked by a disgruntled employee, found in a dumpster, or reverse-engineered. There's no systematic way to measure progress.

  Also, the incentives matter. In academia, breaking RSA would bring fame and fortune, so many smart people are motivated to try. Whereas uncovering some proprietary secret only benefits the attacker and the vendor has no incentive to disclose attempts. So failed attacks on public schemes are more informative.

  But is this actually coherent? Well, the field does seem to treat mathematical hardness as more "real" than secrecy, but it's not foolproof. The discovery of faster factoring algorithms (like Number Field Sieve) shows that progress happens, yet the field accepts this risk as engineering pragmatism. 

  The move to post-quantum cryptography is telling - they're not abandoning unproven assumptions, just switching to newer ones. So implicitly, the field has accepted that probabilistic confidence in mathematical hardness is the best available. If they demanded proofs, we'd indeed be stuck with one-time pads which are impractical for most uses.

  The engineer might be uncomfortable with this, but the alternative would paralyze modern cryptography. So while the epistemology isn't perfectly rigorous, it's a necessary compromise for practical security. The key is distinguishing between measurable collective effort versus opaque secrecy.
answer: |-
  Your observation cuts to the heart of a deep philosophical tension in applied cryptography. The field's implicit epistemology rests on a coherent but pragmatic distinction between **public mathematical intractability** and **private secrecy**. Here's a reconstruction:

  ### The Implicit Epistemology
  1. **Mathematical Objects vs. Contingent Secrets**:  
     - Mathematical truths (e.g., the hardness of factoring) are treated as **Platonic realities**: they exist independently of human discovery. The absence of a solution after sustained, open inquiry is evidence of *inherent complexity*.  
     - Secret designs (e.g., a proprietary algorithm) are **contingent artifacts**: their security depends on *human-controlled opacity*. Failure to discover them is evidence only of *current obscurity*, not inherent hardness.  

  2. **Evidence from Failed Attempts**:  
     - In mathematics, failed attacks are **structured experiments**: thousands of experts probe a well-defined problem using known tools (e.g., number theory). Decades of failure suggest the solution space is genuinely barren, not merely unexplored.  
     - For secret designs, failed attacks are **uninformative**: you cannot measure progress against an unknown target. A "secure" secret might be one trivial flaw away from collapse.  

  3. **The Role of Incentives and Scrutiny**:  
     - Public mathematical problems attract concentrated, adversarial scrutiny (academics, hackers, governments). Survival under this pressure is seen as a **stress test**.  
     - Secret designs lack this scrutiny. Their "security" may reflect obscurity rather than robustness.  

  4. **The Asymmetry in "No One Has Found a Way"**:  
     - For math: "No efficient algorithm exists *yet*" → treated as **"No efficient algorithm exists *at all*"** because the search is exhaustive and incentives align with solving it.  
     - For secrets: "No one has found the design *yet*" → treated as **"Someone might find it *tomorrow*"** because the "search" is random (leaks, reverse engineering).  

  ### Is This Coherent?  
  **Yes, but with a pragmatic caveat.** The distinction holds *if* we accept:  
  - Mathematical discovery is **constrained by objective reality**: progress is cumulative, and failures illuminate the problem's structure.  
  - Secret-keeping is **vulnerable to human error**: a single lapse can irreversibly compromise the system.  

  **However, it implicitly relies on a sociological wager**:  
  > *The probability of a mathematical breakthrough (e.g., factoring in P) is vastly lower than the probability of a secret leak.*  

  This isn't pure epistemology—it’s a bet on **human ingenuity vs. human fallibility**. Math demands rare, paradigm-shifting insight; secrets fail through common negligence. The field assumes mathematical intractability is "discovered" (hard), while secrecy is "maintained" (fragile).  

  ### Where Is the Practice Underdetermined?  
  The same behavior (trusting RSA, distrusting obscurity) could arise from:  
  1. **Frequentism**: Decades of failed attacks imply low *frequency* of solutions.  
  2. **Bayesianism**: Prior probability of efficient factoring is low; failed attacks update our belief.  
  3. **Social Epistemology**: Consensus among experts substitutes for proof.  
  4. **Fictionalism**: We act *as if* hardness is true because it’s useful.  

  Cryptography doesn’t commit to one theory—it only requires that **all justify trusting public math over private secrets**.  

  ### What If We Demanded Proof?  
  A strict "proof-only" stance would collapse modern cryptography:  
  - **Impracticality**: Information-theoretically secure schemes (one-time pads, Wegman-Carter MACs) are inefficient for most applications (key distribution, bandwidth).  
  - **Post-quantum migration confirms pragmatism**: Swapping RSA for lattice-based crypto (relying on unproven hardness of LWE/SIS) shows the field accepts **probabilistic confidence in math** as sufficient.  

  ### Conclusion  
  The epistemology is **coherent pragmatism**:  
  - **Security through obscurity** fails because secrets are *fragile human constructs*.  
  - **Security through math** works because intractability is *robustly evidenced* by adversarial scrutiny.  

  The profession acknowledges this with its shift to post-quantum crypto: it bets that **sustained failure to break a *public* problem is the best evidence we can get**—and that this beats secrecy. It’s not a perfect shield (a breakthrough could still collapse RSA), but it’s the optimal shield *in a world without proofs*.  

  As a coda: This mirrors scientific reasoning. We trust germ theory without a "proof" of causality because it survives relentless testing—just as RSA survives relentless attacks. The alternative is paralysis.
