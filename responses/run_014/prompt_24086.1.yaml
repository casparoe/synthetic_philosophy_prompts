prompt: |-
  I am a retired experimental particle physicist, and I have only recently begun to read philosophy with any seriousness, so do bear with me if I bring a problem to you in a shape that a philosopher would find either trivial or muddled. This puzzle has been turning over in my head for some time, and it resurfaced last week when a former postdoc and I were arguing over coffee about whether the many-worlds, or Everettian, interpretation can really be said to contain probabilities at all.

  The practice I would like you to examine is this. Working quantum physicists routinely invoke the Born rule to assign a probability to the outcome of a single, individual measurement, not to an ensemble of repeated trials. When I set up an apparatus and ask what the probability is that this one run yields outcome A, I am treating the Born weight as a genuine single-case probability, even though no ensemble and no long-run frequency attaches to that one run. At the same time, the same community treats the underlying quantum dynamics, unitary evolution, as perfectly deterministic and wholly free of probability, and a good many of them now claim to have derived the Born rule from that deterministic dynamics, whether by way of decoherence, by way of a decision-theoretic argument about how a rational agent ought to bet in a branching universe, or by way of some typicality measure over the branches of the universal wavefunction. So the practice seems to do three things at once: it uses the Born rule as though it were a fundamental single-case probability, it treats the dynamics as probability-free, and it insists that the probability rule is a theorem of the dynamics rather than an independent postulate.

  What I would like you to do is reconstruct the implicit theory of probability that this practice presupposes. Is the single-case probability being treated here as a propensity, a real physical tendency in the system; as a subjective credence, a rational agent's degree of belief; as a typicality measure, the fraction of branches in which a typical observer sees outcome A; or as something else still? Which rival interpretations of probability does the practice quietly rule out, and with which does it remain compatible? And is the practice actually coherent, or does it rest on a tension it has never had to face? In particular, does the typicality move, the claim that almost all branches exhibit Born-rule frequencies, smuggle the Born measure back in through the door it was meant to close, and does the self-locating question, which copy of me after branching am I, even admit a well-defined answer under any of these interpretations? Finally, tell me what would have to change in the way physicists actually do their work if we replaced the presupposed view with a strict frequentist or a purely subjective-Bayesian theory of probability.
reasoning: |-
  Okay, this retired particle physicist is diving into philosophy and has some deep questions about quantum mechanics and probability. They're wrestling with how physicists use the Born rule as a single-case probability while claiming to derive it from deterministic dynamics. Let me unpack this step by step.

  First, the core tension they're highlighting: Physicists treat unitary evolution as deterministic (no probabilities), yet apply the Born rule to individual measurements as if it were fundamental probability. And they claim to derive the Born rule from that deterministic framework. That does seem contradictory on the surface. 

  Hmm, I recall that in many-worlds interpretations, probability emerges from branching. But how? Decoherence creates effectively classical branches, and the Born rule assigns weights to them. But are these weights probabilistic? The physicist is questioning whether this setup actually contains real probabilities at all.

  The key issues they raise:
  - Is single-case probability a propensity, subjective credence, or typicality measure?
  - Does the typicality argument (most branches see Born frequencies) secretly rely on the Born rule it's trying to prove?
  - What about self-locating uncertainty during branching? Which copy am I?

  For the implicit probability theory... It seems like physicists are using a hybrid view. The Born weights start as objective features of the wavefunction (almost like propensities), but after branching, probability becomes about self-location across identical copies. But is that coherent? 

  Ah, the circularity problem in typicality arguments: To say "most branches" you need a measure over branches, but that measure is precisely the Born rule you're deriving! That's a serious issue. Wallace's decision-theory approach tries to avoid this by deriving rational action, but it has its own assumptions about preferences.

  On self-location: In many-worlds, all outcomes happen. So asking "what will I see" becomes "which branch will I find myself in?" But without a probability measure over branches, this seems undefined. Unless... perhaps the Born weights define the measure for this uncertainty.

  If we switched to strict frequentism, quantum mechanics would become meaningless for single events - a huge problem since we often can't repeat experiments identically. Subjective Bayesianism might work better but would sever the link between quantum amplitudes and objective chance.

  The practice seems to assume something like: Born weights → objective branching measure → rational credence. But the derivation part is shaky. Still, for practical purposes, it works because decoherence makes branches effectively independent and the weights obey probability calculus.

  Fascinating how this exposes the difference between how physicists use QM and what it might imply metaphysically. The physicist's intuition about potential incoherence is spot-on - the foundations community debates these exact points constantly!
answer: |-
  Your question cuts to the heart of quantum foundations and the interpretation of probability. Let's reconstruct the implicit probability theory presupposed by the practice you describe, address its tensions, and explore alternatives. Physicists working with the Everett interpretation (MWI) *do* rely on a specific—and contested—notion of probability.

  ### The Implicit Theory of Probability in Everettian Practice
  1. **Born Rule as Emergent Objective Chance**  
     The practice treats Born rule probabilities as **objective single-case propensities grounded in branch structure**. Specifically:
     - The squared amplitude \(|\psi_i|^2\) defines a *measure* over branches in the multiverse.
     - This measure is **not probabilistic** at the dynamical level (unitary evolution is deterministic) but becomes **probabilistic for agents within a branch** after decoherence.
     - It functions as a **typicality measure**: Outcomes with high Born weight are "typical" in the sense that they describe the experience of *almost all* observers across the multiverse (weighted by \(|\psi_i|^2\)).

  2. **Ruling Out Rival Interpretations**  
     - **Frequentism**: Explicitly rejected. Probabilities are assigned to single measurements without ensembles.  
     - **Subjective Bayesianism**: Partially accommodated (via decision-theoretic derivations), but Born probabilities are treated as *constraints* on rational credence, not mere beliefs.  
     - **Propensity**: Compatible, but reframed: The "propensity" is located in the wavefunction's geometry (branch weights), not indeterminism.  
     - **Logical Probability**: Incompatible—no objective logical structure justifies \(|\psi|^2\).

  3. **Coherence of the Practice**  
     The practice is *internally functional* but faces three philosophical tensions:  
     - **The Circularity Problem**:  
       Claims to "derive" the Born rule via typicality (e.g., using the quantum Hartle theorem) often smuggle in the Born measure implicitly. To say "most branches have statistics matching \(|\psi|^2\)" requires a measure to define "most"—and that measure *is* the Born rule. David Deutsch's and David Wallace's decision-theoretic derivations avoid this by assuming rational agents value all branches equally, but this assumes additivity across branches, which critics (e.g., Adrian Kent) argue presupposes the Born rule.  
     - **The Self-Locating Uncertainty Problem**:  
       When the universe branches, "Which copy am I?" has no answer *until* a probability measure is imposed. Everettians treat \(|\psi_i|^2\) as the rational credence for self-locating in a branch. But this is normative, not factual—there is no "actual" branch you "end up in."  
     - **Probability from Determinism**:  
       Treating deterministic branching as a source of probabilities requires redefining probability as **caring measure** (Carroll) or **rational betting odds** (Wallace). This clashes with classical notions where probabilities require ignorance or randomness.

  ### What Would Change Under Alternative Probability Theories?
  - **Strict Frequentism**:  
    - Quantum mechanics could only describe ensembles, not single events.  
    - Statements like "this atom has a 50% decay probability in 10 minutes" become meaningless—only long-run frequencies matter.  
    - MWI would be incoherent: Branching is global and non-repeatable.  
    - **Impact on Practice**: Most particle physics (e.g., rare decay searches) would lose predictive power for individual experiments.

  - **Subjective Bayesianism**:  
    - Born probabilities would be mere degrees of belief, not physical laws.  
    - Quantum states could vary between agents (as in QBism).  
    - Deriving the Born rule from unitarity would be impossible—dynamics and belief would be disconnected.  
    - **Impact on Practice**: Calibration of instruments (e.g., particle detectors) using quantum efficiencies would lack objective justification. Consensus on experimental outcomes could fracture.

  ### Surviving Interpretations Compatible with Practice
  The Everettian practice remains compatible with:  
  1. **Objective Branching Measures**:  
     Born weights as physical "caring factors" (Saunders) or "frequencies in the multiverse" (Vaidman).  
  2. **Epistemic Probability**:  
     Born rule as optimal credence for agents ignorant of their branch location (Greaves-Myrvold).  
  3. **Hybrid Views**:  
     Quantum amplitudes define objective chances *after* decoherence selects quasi-classical branches (cf. decoherent histories).

  ### Conclusion: A Coherent but Contested Framework
  The practice *is* coherent **operationally** because decoherence ensures branches behave like classical probabilistic outcomes. Philosophically, it hinges on:  
  - Treating the Born measure as a **primitive typicality weight** for branching.  
  - Reducing probability to **rational action in a multiverse** (via decision theory).  

  **The unresolved tension**: Deriving probability from determinism requires redefining probability itself. Typicality arguments risk circularity, and self-locating uncertainty demands a normative (not physical) bridge between branch weight and credence. Yet for working physicists—even Everettians—this framework changes little: Born rule probabilities remain calculable tools. The "muddle" you sense reflects genuine foundational debates, not mere confusion. If MWI is correct, probability may be emergent in a way no classical theory anticipated—but the price is reimagining what probability *is*.  

  As a physicist, your instinct to question the coherence of "single-case probability without indeterminism" is astute. The practice works, but its foundations remain a work in progress.
