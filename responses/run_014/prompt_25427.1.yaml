answer: |-
  Here is a comprehensive set of desiderata for an adequate theory of intergenerational discounting, designed to clarify the core requirements and expose fundamental tensions. I've structured them by category, flagged their status, and explained the underlying rationale.

  **Core Ethical Desiderata (Often Non-Negotiable for Ethicists, Contested by Some Economists):**

  1.  **Temporal Neutrality / Non-Arbitrariness:**
      *   **Requirement:** The theory must *not* systematically discount the well-being of future people *solely* because they exist at a later point in time. Their location in time, per se, is not a morally relevant difference.
      *   **Rationale:** Discounting purely based on temporal location treats identical people differently for no ethically defensible reason. It violates a fundamental principle of impartiality and fairness across persons. (Strongly advocated by philosophers like Parfit, Broome, Ramsey; rejected by some economists advocating Positive Pure Time Preference - PPTP).
      *   **Status:** Non-negotiable for opponents of PPTP; explicitly rejected by proponents of PPTP.

  2.  **Person-Affecting Sensitivity (Weak Form):**
      *   **Requirement:** The theory must be sensitive to *which specific people* exist in different futures. Policies that change the identity of future people (e.g., by affecting birth dates or numbers) create evaluative challenges that the theory must address (e.g., the Non-Identity Problem).
      *   **Rationale:** Intuitions differ about whether making future people worse off is equivalent to bringing into existence people who have lives worth living but are worse off than *different* possible people *could* have been. Ignoring identity changes can lead to paradoxes.
      *   **Status:** Widely acknowledged as crucial but deeply contested how to resolve it (e.g., Average vs. Total Utilitarianism, Critical Level theories, Person-Affecting Views).

  **Economic & Practical Feasibility Desiderata (Often Prioritized by Economists, Viewed as Constraints by Ethicists):**

  3.  **Sensitivity to Opportunity Cost / Capital Productivity:**
      *   **Requirement:** The theory must account for the fact that resources invested today can yield returns (consumption goods, capital, technology) that increase the total resources available for future consumption. Sacrificing consumption today *can* enable significantly greater consumption later.
      *   **Rationale:** Ignoring the productive potential of capital leads to inefficient allocation, potentially impoverishing both present *and* future generations by failing to grow the economic pie. This is the core rationale for the "delta" (δ) term in the Ramsey formula.
      *   **Status:** Non-negotiable for economists; ethicists generally accept it as a practical constraint but argue it shouldn't be conflated with pure time preference. *This is a primary source of tension with Temporal Neutrality.*

  4.  **Avoidance of Absurdly Demanding Sacrifice / Finite Obligation:**
      *   **Requirement:** The theory should not require the current generation to make such severe sacrifices for the distant future that it reduces them below a decent standard of living, especially when the benefits to the far future are marginal or uncertain.
      *   **Rationale:** Intuitions of fairness suggest obligations cannot be infinite. Utilitarianism with zero discounting can demand near-starvation now to benefit trillions in the far future, which seems practically unsustainable and morally counterintuitive.
      *   **Status:** Widely accepted as a practical constraint. Ethicists seek solutions that respect this *without* resorting to pure time preference (e.g., via uncertainty, diminishing marginal utility, person-affecting constraints).

  5.  **Dynamic Consistency:**
      *   **Requirement:** A policy deemed optimal today according to the theory should still be deemed optimal (or at least acceptable) by future generations applying the same theory to their new "present."
      *   **Rationale:** Policies that seem optimal only from one temporal vantage point and lead to constant reversal are impractical and arguably irrational. A theory should facilitate stable, long-term planning.
      *   **Status:** Highly desirable, often seen as a test of rationality. Constant discount rates generally satisfy this; hyperbolic discounting does not.

  **Desiderata Related to Uncertainty and Risk:**

  6.  **Incorporation of Existential Risk / Catastrophic Uncertainty:**
      *   **Requirement:** The theory must explicitly account for the possibility of human extinction or civilizational collapse, which truncates the future and nullifies long-term investments.
      *   **Rationale:** The probability of such events significantly impacts the expected value of very long-term investments (e.g., mitigating climate change or asteroid impacts). Ignoring it overvalues actions with benefits only in the very far future.
      *   **Status:** Universally accepted as crucial. *Controversy:* Whether this probability alone justifies *all* observed discounting ("settles it") or whether it's just one factor ("complicates it") needing combination with other ethical/economics factors. Proponents of PPTP often argue it justifies discounting; opponents argue it's a separate, quantifiable risk factor.

  7.  **Treatment of General Uncertainty:**
      *   **Requirement:** The theory must handle uncertainty about future economic growth, technological change, preferences, resource availability, and the precise impact of present actions on future well-being.
      *   **Rationale:** Decisions affecting the future are made under profound ignorance. A good theory provides guidance on how to weigh uncertain future outcomes.
      *   **Status:** Non-negotiable. Approaches vary: Expected Utility Theory (standard), ambiguity aversion, precautionary principle, robust decision-making.

  **Formal & Theoretical Coherence Desiderata:**

  8.  **Consistency with Foundational Welfare Economics (Conditional):**
      *   **Requirement:** If operating within a standard welfare economic framework (e.g., Utilitarianism), the theory should be consistent with its axioms (e.g., Pareto efficiency, welfarism) or provide a clear justification for departing from them.
      *   **Rationale:** Provides a common analytical language and connects intergenerational ethics to broader economic evaluation. The Ramsey formula is the dominant framework within this paradigm.
      *   **Status:** Non-negotiable for economists using standard CBA; contested by ethicists/philosophers who reject the Utilitarian or welfarist foundations (e.g., rights-based, deontological, or sufficientarian approaches).

  9.  **Clarity on the Discounted Object:**
      *   **Requirement:** The theory must unambiguously specify *what* is being discounted: utility (well-being)? consumption? monetary value? environmental goods? And it must justify why that object is chosen.
      *   **Rationale:** Discounting consumption vs. utility have profoundly different implications. Discounting monetary value conflates pure time preference with changes in the marginal utility of consumption due to growth.
      *   **Status:** Often muddled in practice. Ethicists generally prefer discounting utility; economists often discount consumption streams, requiring explicit modeling of growth and elasticity.

  **The Fundamental Tension & Potential Unsatisfiability:**

  *   **The Unsatisfiable Triad?** A significant challenge arises when demanding **Strong Temporal Neutrality (1)** (no pure discounting), **High Sensitivity to Opportunity Cost (3)** (requiring significant "effective" discounting to prevent inefficient stagnation), and **Avoidance of Absurd Sacrifice (4)** (preventing excessive near-term burden). These three are difficult to reconcile perfectly within standard frameworks.
      *   **The Conflict:** Strong Temporal Neutrality (1) combined with high capital productivity (3) *can* lead to demanding excessive sacrifice from the present (violating 4). Mitigating (4) by introducing even a small pure time preference violates strict Temporal Neutrality (1). Relying *solely* on declining marginal utility and growth projections to lower the discount rate for consumption might not sufficiently alleviate the sacrifice burden over very long horizons or under high growth uncertainty.
      *   **How Proponents Navigate It:**
          *   **Opponents of PPTP:** Prioritize (1) and (4). They argue that realistic growth projections (+ diminishing marginal utility) combined with existential risk (6) yield a low enough *consumption discount rate* to make obligations manageable without violating (1). They see (4) as a practical limit met by these factors, not requiring pure time preference.
          *   **Proponents of PPTP:** Prioritize (3) and (4), explicitly sacrificing strict (1). They argue that a positive pure rate (δ > 0) is necessary to reflect opportunity cost adequately and prevent unreasonable sacrifice, viewing temporal neutrality as an unrealistic ideal. They often invoke uncertainty (6,7) as additional justification.
          *   **Others:** Seek alternative frameworks (e.g., sustainability constraints, rights-based approaches, sufficientarianism) that bypass the Utilitarian aggregation problem inherent in discounting, potentially relaxing the stringency of (1) or (3) in different ways.

  **In Summary: What the Theory Must Deliver**

  An adequate theory must:
  1.  **Be Ethically Defensible:** Avoid arbitrary discrimination against the future (Temporal Neutrality) while handling identity issues.
  2.  **Be Economically Rational:** Respect capital productivity and opportunity costs.
  3.  **Be Practically Sustainable:** Avoid imposing crushing burdens on any single generation.
  4.  **Be Robust Under Uncertainty:** Explicitly incorporate existential risk and general uncertainty about the future.
  5.  **Be Theoretically Coherent:** Be clear about its foundations (welfare economics or alternatives) and what it discounts.
  6.  **Be Dynamically Consistent:** Support stable long-term planning.

  **The Core Insight from the Tension:** The debate often hinges on the *relative weight* given to **strict impartiality across generations** (Temporal Neutrality) versus **efficient resource allocation across time** (Sensitivity to Opportunity Cost) and the *mechanism* used to prevent **excessive sacrifice**. Recognizing that these are distinct values pulling in different directions, and that no theory perfectly satisfies all desiderata simultaneously, is crucial. The choice involves prioritizing which values are considered non-negotiable and finding the least problematic compromise for the others. This framework should help cut through circular arguments by forcing explicit discussion of which desiderata each side prioritizes and why.
