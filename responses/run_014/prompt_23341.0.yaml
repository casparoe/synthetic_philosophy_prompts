  First, I need to verify if their distinction is valid. From what I remember, Goodhart's Law originally comes from economics, where any observed statistical regularity will break down when pressured for control purposes. So it's about the measure becoming less predictive when optimized. Specification gaming, on the other hand, is more about AI agents finding loopholes in the defined objective. So yes, the user's distinction seems solid.

