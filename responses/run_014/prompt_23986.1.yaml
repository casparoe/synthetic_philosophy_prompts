answer: |-
  Quine's critique targets the analytic-synthetic distinction at its conceptual foundations. Here is the precise argumentative structure, isolating each component and its presuppositions:

  **1. The Dependency Claim (Why Analyticity Presupposes Apriority)**
  Quine observes that proponents define an analytic truth as one "true solely by virtue of meaning" (e.g., "All bachelors are unmarried men"). Crucially, this definition *presupposes* that meaning can *fix truth independently of empirical fact*. To say a sentence is true solely by meaning is to say its truth is *necessary* and *knowable without recourse to experience*. This necessity is not logical necessity simpliciter (which might hold for logical truths), but *epistemic* necessity for sentences involving extra-logical vocabulary. Therefore, "analytic" implicitly defines a sub-class of necessary truths: those whose necessity arises from meaning conventions, and whose negation is an *a posteriori* impossibility (not merely contradictory, but inconceivable given how we fix meanings). This dependency undermines the project of grounding empiricism via analyticity because analyticity itself relies on a prior notion of *a priori* knowledge (knowledge independent of experience). Attempting to explain the *a priori* in terms of analyticity becomes circular: analyticity is defined using the very concept (apriority) it was meant to explicate.

  **2. The Regress (The Circle in Defining Meaning-Constitutive Concepts)**
  Quine dismantles attempts to define analyticity non-circularly via synonymy:
  *   **Step 1:** Analyticity is defined using synonymy: "S is analytic" = "S can be turned into a logical truth by substituting synonyms for synonyms" (e.g., "Bachelor" ≡ "Unmarried man" makes "All bachelors are unmarried men" a logical truth).
  *   **Step 2:** Synonymy ("A ≡ B") must then be defined. One candidate is *interchangeability salva veritate* (salva veritate): "A" and "B" are synonymous if substituting one for the other in *any* context preserves truth value.
  *   **Step 3 (The Failure of Extensional Interchangeability):** Quine shows extensional interchangeability (preserving truth value in all *actual* contexts) is insufficient. Co-extensive terms ("creature with a heart" / "creature with kidneys") are interchangeable salva veritate in extensional contexts, but are not synonymous. This reveals the need for *intensional* contexts (modal, propositional attitude) to capture meaning.
  *   **Step 4 (The Appeal to Necessity & the Circle):** To fix this, proponents require interchangeability salva veritate *in all intensional contexts*, i.e., substitution must preserve truth even in contexts like "Necessarily, A is F". This explicitly invokes *necessity*. However, "Necessarily A is F" is *itself* true iff "A is F" is analytic (or a logical truth). Defining synonymy now requires the prior notion of analyticity or necessity. **The Circle:** Analyticity is defined via synonymy, synonymy is defined via necessary truth (or analyticity within modal contexts), which presupposes analyticity/necessity. Appeals to "meaning" as primitive don't break the circle; they merely label the explanandum ("meaning" is precisely what analyticity and synonymy were meant to clarify). Appeals to "convention" are equally unhelpful without specifying *which features* of language are conventional in a way that grounds analyticity, leading back to the same conceptual problems.

  **3. Confirmation Holism (The Web Undermines the Boundary)**
  Quine's holism makes two key claims:
  *   **(i) Unit of Confirmation:** Empirical sentences are not confirmed or refuted in isolation ("The unit of empirical significance is the whole of science"). Evidence bears on a cluster of sentences simultaneously.
  *   **(ii) Distribution of Revision:** Faced with recalcitrant experience, any sentence within the interconnected web of belief can, in principle, be revised to restore coherence. This includes sentences near the "center" (logic, mathematics) previously considered analytic. Revision is governed by pragmatic maxims (conservatism, simplicity, fecundity), not by an absolute distinction between meaning-constitutive and fact-stating components.
  *   **Undermining the Distinction:** This holism dissolves the supposed boundary. If the truth-value of *any* sentence (including "2+2=4" or "¬(P∧¬P)") can, however implausibly, be adjusted in response to experience to preserve the overall system's coherence, then *no* sentence is true *solely* by virtue of its meaning, immune to empirical revision. Meaning itself is not fixed prior to empirical engagement but is shaped holistically within the evolving web. The alleged analytic truths are simply those held very firmly near the center of the web due to their pervasive structural role, not because they possess a different *kind* of truth (meaning-constitutive) that experience cannot touch. The "borderline sentences" (logic/math) lose their special status as analytic; they are central, highly confirmed, pragmatically indispensable, but not metaphysically or epistemically distinct in kind from synthetic sentences.

  **4. The Weakened Residue (Degrees, Not Kinds)**
  Quine allows for a pragmatic *gradient* within the web of belief:
  *   **What Survives:** A distinction based on *degree*: centrality, entrenchment, resistance to revision, or "cognitive cogency." Sentences of logic and mathematics lie near the center, enjoying maximal stability because revising them would cause catastrophic upheaval throughout the system. Observational sentences lie at the periphery, more directly linked to sensory stimuli and more readily revised individually. "All bachelors are unmarried" is highly entrenched via linguistic training.
  *   **What is Given Up:** Crucially, *this gradient is not the analytic-synthetic distinction*. It gives up:
      *   **(a) Modal Force:** The weakened distinction carries no implication of *necessity*, *a priority*, or *truth by meaning alone*. Centrality is contingent on the current state of science and language.
      *   **(b) Epistemic Kind:** There is no fundamental difference in *how* central and peripheral sentences relate to evidence. Both face the "tribunal of experience" holistically; centrality reflects current systemic role, not a different epistemic source (meaning vs. fact).
      *   **(c) Semantic Foundation:** It does not provide a foundation for meaning (e.g., via analytic "meaning postulates"). Meaning is holistic and empirically constrained.
      *   **(d) Sharp Boundary:** The gradient is vague and context-dependent; there is no principled line where meaning ends and fact begins.
  This residue is descriptive (how we *do* prioritize revision), not normative (how we *must* by virtue of meaning). It is a distinction of *pragmatic resilience*, not *semantic constitution* or *epistemic justification*. The core analytic-synthetic project—grounding necessity and apriority via meaning—is entirely abandoned.

  **Conclusion:** Quine's argument demonstrates that the analytic-synthetic distinction is conceptually parasitic on the a priori (1), cannot be non-circularly defined using associated intensional notions (2), and is rendered empirically unintelligible by the holistic nature of confirmation and revision (3). What remains is a pragmatic continuum devoid of the modal and semantic commitments essential to the original distinction (4). The distinction collapses not due to empirical findings about language, but because its core concepts (analyticity, synonymy, meaning-constitution) cannot be coherently explicated within a consistent empiricist framework.
