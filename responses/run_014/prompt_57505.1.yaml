prompt: |-
  I'm one of four people drafting the pay-differential rules for a worker co-op (about 200 members, very mixed skill levels), and every time we try to write down why some roles should be paid more, "deserves" splits into three or four notions that pull apart from each other. Before I read another chapter of the desert literature I want the spec.

  Write the desiderata: what any theory of desert good enough to serve as the public justification for a written, applied pay rule has to deliver. Give the case behind each requirement, and make sure these show up somewhere in the list: two members with identical measured output, one of whom produced it while covering a sick parent and the other at ease; a member whose output is enormous only because of who she's teamed with, so there's no decomposition into individual contributions; a well-judged risky project that failed on bad luck sitting next to a reckless one that paid off; someone who front-loaded years of training at her own expense and wants to know whether that ever gets "used up"; and the flat conflict between what a member deserves for what he already did versus what paying him now would incentivize.

  Then tell me which of these are genuine requirements and which are one camp's priors dressed as criteria, which single one knocks out the most candidate theories, and whether any subset is jointly unsatisfiable — I suspect pre-institutional desert plus contribution-as-the-desert-basis plus some responsibility condition is going to collapse, and I want the collapse argued rather then asserted. A couple of lines each, at the end, on how a contribution-based view, an effort/sacrifice view, and an institutionalist view do against the list.

  Be straight about where you're least confident. If one of my five cases isn't actually hard, say which and say which requirement I'm over-reading into it. And tell me what would change your mind about the impossibility claim — what consideration would make you drop a requirement from the list as a prejudice instead of a desideratum.
reasoning: |-
  Okay, the user is part of a team drafting pay-differential rules for a worker co-op with 200 members. They're stuck on defining why some roles should be paid more, especially because "deserts" splits into multiple conflicting notions. They want desiderata for a theory of desert that can justify pay rules publicly. They listed specific cases that need addressing: two workers with same output but different personal circumstances; someone whose output depends on team synergy; risky projects failing due to luck vs recklessness succeeding; training costs being "used up"; and conflict between rewarding past actions vs incentivizing future behavior.

  First, I need to break down each case into underlying principles. The two workers with same output but different personal situations (covering a sick parent vs at ease) highlights the effort/sacrifice vs. output conflict. The team synergy case challenges individual contribution measurement. The risky project case shows luck vs. responsibility. Training costs question amortization of investment. The past vs future reward conflict ties into incentives versus just deserts.

  The user also wants to know which desiderata are genuine requirements versus ideological priors, which single requirement disqualifies most theories, and if any subset is jointly unsatisfiable. They suspect pre-institutional desert plus contribution basis plus responsibility condition might collapse, so I need to argue that collapse clearly.

  I should structure the desiderata clearly. Start with each requirement, its case, and why it's necessary. Then analyze which are must-haves versus debatable. The collapse argument needs logic: if desert is pre-institutional, based on contribution, and requires responsibility, but contributions are often interdependent and luck-influenced, then responsibility is undermined. Contribution becomes hard to isolate, making pre-institutional desert incoherent.

  For the theories: contribution-based struggles with team interdependence and luck. Effort/sacrifice handles personal circumstances but not team dynamics or incentives. Institutionalist avoids pre-institutional issues but may seem arbitrary without desert basis.

  Addressing their cases: The team synergy case is genuinely hard because contribution can't be decomposed. The training cost "used up" might be over-reading; desert might not require perpetual compensation, just initial amortization. The conflict between past desert and future incentives is a real tension, not a case to solve but to manage.

  My uncertainty is highest on whether responsibility can be maintained given luck. If evidence shows that organizations can mitigate luck's impact, that requirement might be less critical. But in co-ops where risk is shared, luck's role is significant, making responsibility hard to pin down.

  Finally, the user's deeper needs: they want a fair, justifiable system that members accept. They need clarity amidst conflicting values, avoiding theoretical pitfalls while ensuring practicality. Highlighting trade-offs and which theories handle which aspects best can guide their choice towards institutionalist or hybrid models, acknowledging that perfect desert might be unattainable.
answer: |-
  Here are the desiderata for a desert-based pay rule in your co-op, derived from your cases and core challenges. Each requirement is stated, followed by the case illustrating it and the argument for its necessity:

  ### Desiderata (What the Theory Must Deliver & Why)

  1.  **Output-Responsibility Link:** *Rewards must correspond to outcomes the individual can reasonably be held responsible for.*
      *   **Case:** The well-judged risky project failing vs. reckless one succeeding.
      *   **Why:** Paying solely on outcome ignores agency and luck, rewarding recklessness and punishing prudent risk-taking undermines fairness and sensible decision-making. Desert requires a link between *action under one's control* and reward.

  2.  **Sacrifice/Effort Recognition:** *The theory must meaningfully account for differential effort, sacrifice, or hardship endured in producing outcomes.*
      *   **Case:** Two members with identical output, one covering a sick parent, one at ease.
      *   **Why:** Ignoring the vastly different personal costs incurred for the same result feels deeply unfair. A desert claim based solely on output dismisses the moral weight of hardship willingly borne for the co-op.

  3.  **Non-Decomposability Handling:** *The theory must provide a defensible method for attributing desert in cases of irreducible team synergy where individual contributions cannot be cleanly isolated.*
      *   **Case:** The member whose enormous output is inseparable from team dynamics.
      *   **Why:** Real-world work, especially in complex organizations, often involves emergent properties where the whole is greater than the sum of parts. A desert theory collapsing under this common scenario is impractical and fails to justify pay differentials in collaborative environments.

  4.  **Investment Amortization Clarity:** *The theory must articulate a principle for how (and if) past personal investments (like training) factor into current desert claims, including whether their "value" depreciates.*
      *   **Case:** The member who front-loaded years of training at personal expense.
      *   **Why:** To attract and retain skilled members, the co-op needs a rule addressing whether/how their past sacrifices generate ongoing desert claims. Ignoring it discourages investment; treating it as an eternal claim might be unjustified. The rule needs temporal logic.

  5.  **Incentive-Desert Tension Management:** *The theory must explicitly address the potential conflict between rewarding past desert and creating future incentives.*
      *   **Case:** The flat conflict between what a member deserves for past actions vs. what paying them now would incentivize.
      *   **Why:** This is a fundamental tension in *applied* desert rules within ongoing institutions. A purely backward-looking desert claim might justify high pay for a now-unmotivated member, while pure incentives might ignore past deserts. The rule needs a stance on this duality.

  6.  **Practical Measurability/Verifiability:** *Desert attributes must be feasibly measurable or verifiable in a consistent, objective(ish), and non-intrusive way within the co-op context.*
      *   **Implicit Case:** All cases, but especially Sacrifice (proving hardship level?) and Responsibility (proving judgment quality?).
      *   **Why:** A theory relying on unmeasurable attributes (true effort, pure intent, exact responsibility share) is useless for a written, applied rule. It invites dispute and arbitrary application.

  ### Analysis of Requirements & The Collapse

  *   **Genuine Requirements:** 1 (Responsibility Link), 3 (Non-Decomposability), 5 (Incentive-Desert Tension), and 6 (Measurability) are core functional requirements for a *workable, justifiable, applied rule* in a dynamic co-op. Failure on these makes the rule either unfair, unworkable, or ineffective.
  *   **Potential Priors Dressed as Criteria:** 2 (Sacrifice/Effort) and 4 (Investment Amortization) are *powerful moral intuitions*, but their *absolute* necessity as distinct desert bases (vs. being factors feeding into Responsibility or Incentives) is debatable. Some institutionalist views might downplay them as independent bases.
  *   **Biggest Theory-Knocker:** **#3 (Non-Decomposability)**. Most traditional desert theories (pure contribution, pure effort) *assume* individual contributions *can* be isolated. Theories that collapse here (like strict marginal productivity) become instantly inapplicable to collaborative work.
  *   **The Suspected Collapse (Pre-Institutional + Contribution Basis + Responsibility):** **This combination is likely unsatisfiable.**
      *   **Argument:** Pre-institutional desert demands rewards based on fundamental moral properties *before* institutional context. Contribution seems a prime candidate. Responsibility requires the contributor controlled the outcome. However:
          *   In a co-op (an institution), *what counts as a "contribution"* is defined by the institution's goals and structure. Isolating an "individual contribution" outside this context (e.g., raw output) often ignores institutional synergy (violating #3) and masks institutional factors enabling/constraining the contribution.
          *   Responsibility (#1) is undermined by institutional complexity and luck. Was the "contribution" truly under the member's sole control, or dependent on team support, institutional resources, or market luck? Pre-institutional contribution struggles to account for this co-op reality.
          *   **Result:** Trying to isolate a "pure," pre-institutional, responsible individual contribution within an interdependent institution like a co-op is often impossible or arbitrary. The institutional context fundamentally shapes and mediates contributions and responsibility, making the pre-institutional ideal incoherent in practice. The requirement for measurable, responsible contributions (#1, #6) clashes with the irreducibly social nature of production (#3) under a pre-institutional lens.

  *   **Joint Unsatisfiability?** While the specific trio above collapses, the *full set* (1-6) is likely **impossible to satisfy perfectly simultaneously**. Sacrifice (#2) might conflict with Measurability (#6). Managing Incentive-Desert tension (#5) might require compromising pure Responsibility (#1) or Sacrifice (#2). Non-Decomposability (#3) inherently challenges any simple attribution for Responsibility (#1) or Contribution. A workable rule will involve *trade-offs* between these desiderata.

  ### How Theories Fare Against the List

  1.  **Contribution-Based (Value Added):**
      *   **Strengths:** Clear link to output (#1 potential, if responsibility assumed), strong incentives (#5 forward-looking).
      *   **Weaknesses:** Collapses on #3 (Non-Decomposability). Ignores #2 (Sacrifice). Struggles with #1 (Responsibility - luck/team effects). #4 (Investment) ambiguous. #6 (Measurability) hard for complex contributions.
  2.  **Effort/Sacrifice-Based:**
      *   **Strengths:** Directly addresses #2 (Sacrifice) and potentially #1 (Responsibility - if effort is controllable). #4 (Investment) can be framed as past sacrifice.
      *   **Weaknesses:** Ignores output/value (#1 responsibility link weak if effort doesn't yield result). Collapses on #3 (Non-Decomposability - team synergy isn't about individual sweat). Weak on #5 (Incentives - may not reward effectiveness). #6 (Measurability) is a nightmare (how to measure *true* effort/sacrifice?).
  3.  **Institutionalist (Desert defined by role/agreed rules):**
      *   **Strengths:** Handles #3 (Non-Decomposability) by defining roles/teams. Best at #5 (Incentive-Desert Tension) by design. Can build in #4 (Investment) via rules. Most feasible for #6 (Measurability - defined role expectations).
      *   **Weaknesses:** Weakest on pre-institutional #1 (Responsibility link feels conventional, not fundamental) and #2 (Sacrifice may not be directly rewarded by role). Risks feeling arbitrary if not carefully justified ("desert" becomes "what we agreed").

  ### Addressing Your Cases & Confidence

  *   **"Over-reading" a Case?** The **"training used up" (#4)** case might over-read the requirement. Desert doesn't *necessarily* require perpetual compensation for past investment. A rule could legitimately say the desert claim from training depreciates as its value is realized or becomes baseline expectation. The requirement is *clarity* on the principle, not perpetual reward.
  *   **Where I'm Least Confident:** The **boundary between #1 (Responsibility) and luck/institutional factors**. How much *can* reasonably be attributed to the individual in a complex co-op? This is philosophically and practically thorny. My claim of the "collapse" hinges heavily on this difficulty within institutions.
  *   **What Would Change My Mind on Impossibility?** Evidence that **Non-Decomposability (#3) is rare or manageable** in your *specific* co-op's work. If most work *is* truly isolatable individual contributions, the collapse weakens. Alternatively, if a strong case emerged that **Sacrifice (#2) is *not* a core independent desert basis** but merely a factor influencing institutional role definition or incentives (#5), it might reduce tension. Demonstrating robust, fair **methods to measure effort/sacrifice (#2, #6)** could also make certain theories more viable, though I remain skeptical.

  ### Recommendation

  The Institutionalist approach, **explicitly acknowledging the trade-offs**, seems most viable. Define roles/teams with pay bands reflecting:
  1.  **Agreed Value/Complexity:** (Addressing Contribution/Incentives, partially Responsibility).
  2.  **Required Training/Sacrifice:** (Baking in #2 & #4 upfront via role definition).
  3.  **Accountability for Outcomes:** (Attempting #1 within role constraints).
  4.  **Team-Based Pay Pools:** (Directly tackling #3).

  Justify it transparently: "We reward roles requiring significant sacrifice (training, stress) and carrying high responsibility/impact, recognizing individual contribution within teams is synergistic. Past investment is valued via access to higher roles. This balances fairness, incentives, and practicality." This accepts that pure pre-institutional desert is unworkable but builds desert-like principles *into* the institutional structure.
