prompt: |-
  I am a second-year undergraduate currently taking a course on normative ethics. In our recent seminar on supererogation, our tutor characterised a supererogatory act as one that is neither morally required nor morally forbidden, that is morally good to perform and morally praiseworthy, and whose omission is permissible and does not deserve blame or moral criticism. I am having difficulty distinguishing such acts from permissible acts that are admirable for primarily non-moral reasons, such as kindness as etiquette, intellectual skill, or prudence, especially when both kinds involve some cost to the agent and some benefit to others. Could you help me by constructing a pair of original, everyday examples set in university life featuring the same student protagonist and broadly similar personal costs and benefits to others, where the first example satisfies the characterisation of supererogation and the second example is admirable but not supererogatory because its goodness is mainly non-moral? For each example, please walk through how it meets or fails each element of the characterisation, and explain why failing to perform the first act would be morally worse yet still blameless, whereas failing to perform the second act would not even be morally worse.
reasoning: |-
  Okay, the user is a second-year undergrad in a normative ethics course, specifically struggling with supererogation. They need help distinguishing supererogatory acts from non-moral admirable acts. The tutor's definition includes key elements: not required, not forbidden, good to perform, praiseworthy, omission permissible without blame. 

  Hmm, their confusion makes sense—it's tricky when both types involve costs to the agent and benefits to others. Like, how is donating a kidney supererogatory but mastering violin for charity not? The difference hinges on moral goodness vs. other values. 

  I should create uni-life examples with the same protagonist (let's call her Maya) to isolate variables. Need parallel scenarios: same costs (time/effort), same benefits (helping peers), but one rooted in moral concern, the other in skill/excellence. 

  First example: Maya stays up rewriting notes for a sick classmate. Costs her sleep, benefits the group. This is supererogatory because: 
  - Not required (she could just share raw notes) 
  - Morally good (directly alleviates suffering) 
  - Omission blameless (if she only shares messy notes) 
  But skipping it would be morally "worse" (though still okay) because a morally better option existed. 

  Second example: Maya creates a stunning study guide after acing an exam. Same costs (hours of work), same benefits (peers score higher). But: 
  - Admirable for skill/intellectual generosity, not moral reasons 
  - Omitting it isn't morally worse; peers have no moral claim to her brilliance 
  - Praise here is about excellence, not virtue 

  Key insight: Supererogation's "moral goodness" stems from responding to others' needs or welfare. The second act's value is in mastery/beauty—laudable but not morally charged. The user's real struggle might be spotting when "benefiting others" crosses into moral territory versus remaining neutral. Should emphasize that in the breakdown.
answer: |-
  Here are two original examples featuring Maya, a second-year university student, designed to highlight the distinction using your tutor's characterization. Both involve Maya sacrificing significant time/energy (cost) to benefit peers (benefit), but only the first is supererogatory.

  **Characterisation Recap:**
  A supererogatory act is:
  1.  **Neither morally required nor morally forbidden.**
  2.  **Morally good to perform.**
  3.  **Morally praiseworthy.**
  4.  **Its omission is permissible.**
  5.  **Its omission does not deserve blame or moral criticism.**
  *(Crucially, the source of its "goodness" and "praiseworthiness" must be* moral *in nature).*

  ---

  **Example 1: The Supererogatory Act - Maya and the Extended Deadline**

  *   **Scenario:** A major assignment is due tomorrow. Maya's close friend, Leo, confides in her that his chronic illness has flared up badly this week, making it impossible for him to finish on time. Leo is terrified of failing and can't face asking the notoriously strict professor for an extension himself due to anxiety. Maya knows the professor respects her work ethic. She spends *her own crucial final revision night* meticulously drafting a compassionate, professional email to the professor on Leo's behalf, explaining the situation (with Leo's permission) and formally requesting a one-week extension for him. She attaches relevant (anonymized) medical documentation Leo provided. The professor grants the extension, saving Leo from failing.
  *   **Cost to Maya:** Sacrifices her final night of revision for her *own* assignment (potentially lowering her grade).
  *   **Benefit to Others:** Prevents Leo from failing due to circumstances beyond his control, alleviating significant distress.

  **Walkthrough (Why Supererogatory):**
  1.  **Neither Required nor Forbidden:** Maya has *no* moral duty to sacrifice her revision time to plead Leo's case. She could morally permissibly say, "I'm sorry Leo, that's awful, but I really need to focus on my own work tonight. You should try emailing the professor yourself." It's also not forbidden; helping isn't wrong.
  2.  **Morally Good:** The act directly responds to Leo's significant need (avoiding failure due to illness) and distress. It demonstrates compassion, benevolence, and a commitment to fairness by intervening when Leo couldn't advocate for himself. Its goodness stems from core *moral* values like alleviating suffering and promoting justice.
  3.  **Morally Praiseworthy:** We praise Maya primarily for her *moral character* – her deep compassion, courage in approaching the strict professor, and willingness to sacrifice for a friend in genuine need. The praise is moral praise.
  4.  **Omission Permissible:** If Maya had simply wished Leo luck and focused on her own work, this would have been morally *permissible*. She had no strict obligation to intervene.
  5.  **Omission Not Blameworthy:** Failing to act would *not* make Maya morally blameworthy or deserving of criticism. Leo's predicament, while unfortunate, isn't Maya's fault or responsibility to fix.
  6.  **Why Omission is Morally Worse (yet Blameless):** While permissible and blameless, *choosing not to help* in this specific scenario (where the need is significant, the solution is feasible albeit costly, and Maya is uniquely positioned to help effectively) would be a *morally inferior* choice compared to helping. It would be less compassionate, less benevolent, and less responsive to the moral demands of the situation (Leo's acute vulnerability). Morality *encourages* Maya's act, even if it doesn't *demand* it. The world is morally better when she acts, worse when she doesn't, even though she's not at fault for the latter.

  ---

  **Example 2: The Non-Morally Admirable Act - Maya and the Masterful Study Guide**

  *   **Scenario:** Maya aced the recent difficult midterm exam. Knowing many classmates struggled, she decides to create an incredibly detailed, clear, and visually engaging study guide summarizing the key concepts, including her own problem-solving tips and annotated diagrams. She spends *her entire Saturday* (which she planned to use relaxing after a tough week) creating this guide and posts it freely to the class forum. Many classmates find it invaluable for their understanding and future exam preparation.
  *   **Cost to Maya:** Sacrifices her well-deserved rest and leisure time on Saturday.
  *   **Benefit to Others:** Significantly aids classmates' comprehension and potential future grades.

  **Walkthrough (Why Admirable but NOT Supererogatory):**
  1.  **Neither Required nor Forbidden:** Maya has no moral obligation to create study guides for classmates. It's also perfectly permissible; sharing knowledge isn't wrong.
  2.  **Morally Good? (Mainly NO):** While the act is *beneficial*, its primary "goodness" isn't *moral*. The core value demonstrated here is **intellectual generosity**, **diligence**, and **excellence in academic craftsmanship**. It's admirable because it showcases Maya's skill, her willingness to share her intellectual product, and her commitment to academic community. However, classmates aren't in a state of *need* analogous to Leo's (failing due to illness). They have access to lectures, textbooks, office hours, and their own notes. Maya isn't responding to a moral demand (like alleviating suffering or injustice); she's excelling and generously sharing the fruits of her excellence. The good is primarily intellectual and social (building community goodwill), not fundamentally moral.
  3.  **Morally Praiseworthy? (Mainly NO):** Praise for Maya here is largely for her **intellectual virtues** (clarity, organization, understanding), her **work ethic**, and her **generosity with her intellectual property**. While generosity has a moral dimension, the *primary* source of admiration in this case is her competence and the quality of the *product* she created and shared, not a response to a moral call. It's praise for excellence and sociability, not primarily for moral character like compassion or justice.
  4.  **Omission Permissible:** Absolutely. No one could reasonably claim Maya was morally required to spend her Saturday making this guide.
  5.  **Omission Not Blameworthy:** Failing to create the guide deserves zero moral criticism or blame.
  6.  **Why Omission is NOT Morally Worse:** Unlike the first case, *choosing not to create the study guide* is **not a morally inferior choice** compared to creating it. While creating it is nice and beneficial, classmates have no moral claim on Maya's time, effort, or intellectual synthesis. They have sufficient resources to succeed without it (even if it's harder). The world isn't *morally* worse off if Maya relaxes instead; it's perhaps *intellectually* less enriched or *socially* less collegial, but no core moral value (like preventing harm or promoting essential fairness) is diminished by her omission. Her choice simply doesn't carry the same moral weight as the choice to help Leo avoid failure.

  ---

  **Key Distillation:**

  *   **Supererogation (Example 1):** Involves a direct, costly response to a situation invoking core *moral* values (like preventing significant harm, alleviating suffering, or upholding fairness) where the need is significant and the agent is well-placed to help. Omission, while permissible and blameless, leaves the world in a *morally inferior state* compared to acting.
  *   **Non-Moral Admirability (Example 2):** Involves a costly act that demonstrates non-moral excellences (intellectual, skillful, prudent, socially graceful) and benefits others, but where the benefit doesn't address a fundamental moral need or demand. The act is laudable for its quality, generosity, or contribution to a positive environment, but omission doesn't constitute a *moral* failing or make the world *morally* worse. The "goodness" is rooted in values other than morality itself (e.g., intellectual achievement, community spirit, etiquette).

  The crucial difference lies in the **source of the act's value and praiseworthiness**. Supererogatory acts are morally good and praiseworthy *as moral acts*. Acts like Maya's study guide are admirable primarily for non-moral reasons, even if they have positive side effects. Failing the supererogatory act is morally *worse* (though blameless); failing the non-moral admirable act isn't morally worse at all.
