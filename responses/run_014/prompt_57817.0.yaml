  Key challenges in designing this: Must avoid theory jargon while preserving critical safety distinctions. Must acknowledge where human judgment is unavoidable. Needs to fail safely—block clear wireheading but permit clever optimization. And crucially, must withstand scrutiny from throughput-focused managers.

