prompt: |-
  I do resilience modeling on lakes and fisheries — basins of attraction, hysteresis, critical slowing down, early-warning signals dug out of noisy time series. Lately I've been reading the archaeology argument about whether the Late Bronze Age eastern Mediterranean, the Classic Maya southern lowlands, and Rapa Nui actually "collapsed" or just reorganized, and I can't shake the feeling that we're describing the same thing in different words. So: translate that debate into my vocabulary as faithfully as you can, one case at a time. Which of their claims map cleanly onto a shift to an alternative stable state or a loss of resilience, which ones you have to bend my framework to fit, and which have no counterpart in it at all? The one I most want nailed down is the argument that the palace/dynastic elite and the farming majority decoupled, so the collapse was catastrophic for one group and a non-event for the other — does a basin-of-attraction picture have anywhere to put that, or is it a category my framework simply can't represent? Then give me the residue report and tell me which way to read it: does the missing piece show my vocabulary is too thin, or does it show the archaeologists' concept of collapse was never coherent to begin with? Dont smooth over the stretches — flag every place you're forcing the fit. And say what would change your verdict: what consideration would make you concede these really are the same phenomenon, or where you think your mapping is most likely to be wrong.
reasoning: |-
  Okay, the user works with resilience modeling in ecosystems like lakes and fisheries, focusing on concepts such as basins of attraction, hysteresis, and early-warning signals. They're now looking at archaeological debates about whether societies like the Late Bronze Age Mediterranean, Classic Maya, and Rapa Nui "collapsed" or just reorganized. They want to map these archaeological arguments onto their resilience framework, especially the idea that elites and commoners decoupled during collapse. 

  First, I need to break down each case study separately. For the Late Bronze Age, the collapse involved multiple stressors like earthquakes, climate change, and invasions. The key point is the disintegration of the palatial system. In resilience terms, this looks like a critical transition where the centralized system couldn't withstand compounding pressures. The decoupling here means the elite structures collapsed while rural populations might have shifted to local governance. That aligns with a state shift—palace system to fragmented communities.

  Next, the Classic Maya. Their collapse featured prolonged drought leading to abandonment of urban centers. But populations didn't vanish; they relocated. This seems like a state shift from city-states to dispersed settlements. The decoupling is evident: elites lost power, but farmers adapted by moving. The prolonged stress and lack of recovery suggest hysteresis—once abandoned, the cities didn't rebound. However, the exact drivers (drought vs. societal factors) are debated, which might affect how cleanly this fits into resilience models.

  Rapa Nui is trickier. The traditional narrative is ecological collapse from deforestation, but recent studies show a gradual societal transformation. The decoupling here is nuanced—elite structures faded, but society reorganized without catastrophe. This might be a managed transition rather than a collapse, challenging the resilience framework. The lack of clear early-warning signals in the archaeological record complicates things. 

  The user's main concern is whether the elite-commoner decoupling fits into basins of attraction. In resilience terms, basins represent system states, not subgroups. So when subsystems diverge, like elites crashing while commoners persist, it's not a basin shift but a decoupling within the system. This is a gap in the current framework. The user might need to model subsystems separately or consider network resilience.

  The residue report shows that while state shifts and hysteresis map well, the decoupling of social groups doesn't fit neatly. Also, intentional reorganization and ideological factors in collapses aren't captured by ecological models. The absence of high-resolution data for early-warning signals in archaeology is another issue. 

  To improve the fit, the user could look for societal early-warning signals like increased inequality or reduced cooperation. If these correlate with known stress events, it strengthens the parallel. However, if future research shows that collapses were primarily due to conquest or epidemics without systemic feedbacks, the resilience model might not apply. 

  In conclusion, the frameworks share core concepts but diverge on social stratification and human agency. The user's model might need to incorporate multi-scalar resilience to handle subsystem decoupling. The missing pieces suggest both frameworks could learn from each other, rather than one being incoherent.
answer: |-
  Here's a rigorous translation of the archaeological "collapse vs. reorganization" debate into resilience theory terms, case-by-case, with explicit forcing points, the decoupling challenge, residue analysis, and diagnostic flags:

  ### Core Framework Translation Key
  *   **Alternative Stable State (ASS):** A fundamentally different socio-ecological configuration (e.g., palatial mega-states vs. fragmented village networks; monumental city-states vs. dispersed agro-pastoralism).
  *   **Critical Transition:** The rapid shift between ASSes.
  *   **Resilience Loss:** Reduced capacity to absorb shocks while maintaining core functions/structure.
  *   **Critical Slowing Down (CSD):** Increased recovery time from small perturbations (e.g., slower economic rebound after drought).
  *   **Early Warning Signals (EWS):** Statistical indicators (variance, autocorrelation) in proxy data (e.g., construction activity, trade volume, sediment/pollen records).
  *   **Hysteresis:** Path-dependence where returning to the pre-shock state requires reversing stressors *beyond* the original collapse threshold.

  ---

  ### Case Studies: Resilience Translation & Forcing Points

  1.  **Late Bronze Age (LBA) Eastern Mediterranean (c. 1200 BCE):**
      *   **"Collapse" Claim (Resilience View):** Critical transition from an **ASS of palatial interdependence** (specialized production, centralized storage, international elite exchange, chariot warfare) to an **ASS of fragmented regionalism**. Triggered by compound stresses (Sea Peoples raids, earthquakes, drought, trade disruption). CSD/EWS potentially visible in declining palace tablet complexity, increased fortification variance, reduced exotic goods in stratified layers. **Hysteresis** is strong: palatial systems never reformed identically.
      *   **"Reorganization" Claim (Resilience View):** Not a system-wide collapse, but **reconfiguration within the basin of attraction**. Core elements (agro-pastoralism, local trade, vernacular religion) persisted. The "collapse" was primarily the **dissolution of the elite superstructure**, not the socio-ecological base.
      *   **Forcing the Fit:** Mapping "elite superstructure" cleanly onto a separable subsystem within the larger basin is difficult. Resilience theory treats the *system*. Was the palatial network truly a separate ASS, or just a vulnerable module? EWS detection in sparse, coarse archaeological time-series is inherently speculative.
      *   **Decoupling:** **This is central.** The palace elite experienced a catastrophic critical transition (loss of power, writing, international network). Many rural producers experienced continuity or even reduced tribute burdens – a perturbation, not a transition. *Resilience framework lacks tools to model this subsystem divergence within the same spatial system.* It implicitly assumes synchronous response.

  2.  **Classic Maya Southern Lowlands (c. 800-1000 CE):**
      *   **"Collapse" Claim (Resilience View):** Critical transition from an **ASS of dense, water-managed city-states** with divine kingship and monumental construction to an **ASS of dispersed, low-density agrarian settlements** without dynastic elites or large-scale construction. Driven by prolonged drought interacting with soil depletion, warfare, and elite competition. CSD/EWS potentially in construction hiatuses, increased skeletal stress markers, sediment charcoal spikes (fire use). **Hysteresis** is evident: cities remained largely abandoned.
      *   **"Reorganization" Claim (Resilience View):** A **managed retreat** or **scaling down** within the agrarian basin. Populations shifted north/south or to coasts; many agricultural practices and cultural elements persisted. The "collapse" was the end of a specific political/ideological model, not the society.
      *   **Forcing the Fit:** Defining the pre-collapse "system" boundary is contentious (city-state? region?). Drought is an external driver, but societal responses (warfare intensity, land management choices) are internal feedbacks – hard to disentangle. EWS in population proxies (e.g., house mounds) are still debated.
      *   **Decoupling:** **Starkly evident.** Dynastic elites vanished as an institution; monument carving ceased abruptly. Many non-elites likely continued farming adapted lands or migrated to viable regions. *Resilience theory struggles to represent why one subsystem (elite ideology/power) suffered a critical transition while another (local subsistence) exhibited adaptive capacity.* The system-level "collapse" label obscures this.

  3.  **Rapa Nui (Easter Island) (c. 1600-1800 CE):**
      *   **"Collapse" Claim (Resilience View):** Critical transition from an **ASS of complex clan-based society with monumental statue (moai) construction** dependent on large trees to an **ASS of impoverished, conflict-ridden society** after deforestation and resource depletion. CSD/EWS potentially in statue size variance, sediment charcoal/pollen shifts, oral histories of conflict. **Hysteresis:** Deforestation was irreversible on relevant timescales.
      *   **"Reorganization" Claim (Resilience View):** **Adaptation to environmental change.** Post-"collapse" society developed intensive rock garden agriculture, adapted social structures (Birdman cult), and maintained population levels. The "collapse" narrative overstates pre-contact decline and ignores successful adaptation.
      *   **Forcing the Fit:** The magnitude of pre-European contact decline is fiercely debated. Was deforestation the cause of societal change, or a co-evolutionary process? Defining the relevant ASSes is muddled by incomplete records and later European impacts. EWS are exceptionally hard to pinpoint here.
      *   **Decoupling:** **Less clear-cut than Maya/LBA, but present.** The elite/clan system associated with moai transport/cult likely lost prominence/collapsed. Non-elites faced hardship but reorganized subsistence and social structures. *Again, the framework lacks granularity to show how one group's collapse enables another's reorganization.*

  ---

  ### The Decoupling Challenge & Basin-of-Attraction Limits
  *   **The Core Problem:** Resilience theory models the *system state*. A basin of attraction describes the *entire system's* stable configuration. **Decoupling exposes a fundamental limitation: the "system" is not monolithic.** It contains semi-autonomous subsystems (elite political economy, commoner subsistence economy) with different dynamics, feedbacks, and resilience.
  *   **Can it be Represented?** **Not cleanly within standard basin-of-attraction pictures.** You'd need:
      1.  **Multi-scalar Resilience:** Modeling the system as interacting sub-systems, each potentially in different states. The elite subsystem undergoes a critical transition (collapse), the commoner subsystem experiences perturbation but remains within its basin (reorganization), and their coupling weakens or breaks.
      2.  **Network Resilience:** Viewing society as a network of nodes (elite centers, villages) and flows (tribute, labor, information). "Collapse" is the fragmentation or failure of central hubs (elite nodes), while peripheral nodes (villages) persist or form new, smaller clusters. Connectivity loss defines the transition.
  *   **Current Framework Gap:** Standard basin-of-attraction models imply synchronous change. Decoupling shows **asynchronous collapse/reorganization across socio-economic strata.** Your framework needs explicit representation of *social stratification and differential vulnerability/resilience* to capture this.

  ---

  ### Residue Report: What Doesn't Map & How to Read It
  1.  **Decoupling (Asynchronous Transitions):** As above. **Significance:** Major gap. Shows resilience theory needs richer social structure modeling (multi-scalar/network approaches) to handle stratified societies.
  2.  **Intentional Reorganization:** Archaeologists' "reorganization" often implies conscious adaptation/agency. Resilience theory's state shifts are often portrayed as emergent properties of system dynamics, downplaying deliberate strategy. **Significance:** Resilience may underrepresent human foresight and planned transformation. This is a *stretch*, not a complete misfit, but needs emphasizing.
  3.  **Ideology/Cognition:** The collapse of belief systems (e.g., Maya divine kingship, LBA palatial ideology) is a key driver/consequence in archaeology. Resilience theory struggles to integrate cognitive/ideological feedbacks quantitatively. **Significance:** A known thin spot in socio-ecological resilience models. Proxy data is hard.
  4.  **Definition of "System":** Archaeologists debate *what* collapsed (polity? region? culture?). Resilience requires explicit system boundaries. **Significance:** Highlights a pre-analytical step crucial for both fields. Not a misfit, but a source of ambiguity needing clarification in any application.
  5.  **Conquest/Epidemics (LBA Specific):** External, high-magnitude shocks like invasion or plague can cause collapse *without* preceding resilience loss or EWS. **Significance:** Resilience theory focuses on *erosion* leading to critical transitions. Sudden exogenous catastrophes are a different pathway your framework handles less well (though impacts depend on *existing* resilience).

  **Reading the Residue:**
  *   **Does it show your vocabulary is too thin? YES, critically regarding social stratification/decoupling.** Your core ecological models lack the structure to represent asynchronous transitions across socio-economic subsystems. Multi-scalar or network resilience is needed.
  *   **Does it show "collapse" was incoherent? PARTIALLY.** The residue confirms "collapse" is often an elite-centric perspective masking commoner continuity. However, the core concepts (state shifts, hysteresis, resilience loss) *do* map remarkably well onto the *disintegrations that archaeologists label collapse* (palaces, dynasties, monumental cultures). The debate is often about *scale* (what collapsed?) and *perspective* (whose collapse matters?), not the fundamental dynamics of systemic transformation.

  ---

  ### What Would Change My Verdict
  *   **Concede They Are the Same:**
      *   If analyses of archaeological proxy data (e.g., settlement patterns, trade goods, construction phases) consistently reveal statistically valid EWS (rising variance, autocorrelation) preceding documented "collapse" events across cases.
      *   If multi-scalar resilience models incorporating elite/commoner subsystems *and their coupling* successfully simulate the asynchronous transitions (elite collapse + commoner persistence/reorg) seen archaeologically.
  *   **Where My Mapping is Most Likely Wrong:**
      1.  **Overstating Hysteresis:** If compelling evidence emerges that societies *did* rapidly rebuild identical palatial/Maya systems *in the same core locations* shortly after the "collapse" event (true reversibility). Current evidence strongly suggests hysteresis.
      2.  **Misreading "Reorganization" as Within Basin:** If the "reorganized" societies (post-LBA villages, post-Maya dispersed groups, post-moai Rapa Nui) were demonstrably *less resilient* to subsequent stresses (e.g., more vulnerable to later droughts/famines) than their predecessors. This would suggest they *had* shifted to a less resilient ASS, making "reorganization" misleading.
      3.  **Underestimating Exogenous Shocks:** If definitive proof arises that conquest/epidemics were the *primary and sufficient* cause in a case (e.g., a single overwhelming invasion for LBA), *without* preceding resilience erosion. This would make the resilience erosion narrative less central for that case.

  **Conclusion:** You're fundamentally right – archaeologists and resilience scientists *are* describing the same core phenomenon: systemic transformation, often rapid and hard-to-reverse. Resilience theory provides a powerful, rigorous framework for understanding the dynamics (state shifts, hysteresis, erosion, potential EWS). However, **the stark "decoupling" phenomenon reveals a critical limitation in applying *ecological* basin-of-attraction models directly to *stratified human societies*.** To fully capture societal collapse/reorganization, your vocabulary needs augmentation: explicitly model social structure, differential subsystem resilience, and the strength of coupling between elites and non-elites. The residue isn't fatal incoherence; it's an invitation to develop a more sophisticated socio-ecological resilience theory.
