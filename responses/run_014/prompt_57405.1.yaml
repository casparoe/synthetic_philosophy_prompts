prompt: |-
  I cover science and research for a living, so basically my whole job is deciding which claims to check and which to just take. Lately I've been reading Wittgenstein's late notes on certainty — the ones where certain propositions aren't the sort of thing you can know or doubt at all, they're just what your doubts and your checking swing on — and I started writing down my own verdicts, and they don't line up.

  Ones I'd call framework, untouchable from the inside:
  - other people have minds. never comes up, never could be tested.
  - the past happened, roughly as recorded — the broad one, not any particular record.
  - the laws of physics will be the same tomorrow as they were yesterday.
  - the number I copy out of a spreadsheet into my notebook is the number I'm looking at. I'm totally certain of this one and I can't say why.

  Ones I'd call ordinary evidence territory:
  - there's a laptop in front of me. I look, I know.
  - water is H2O — its the model of a claim that got settled by evidence and could have come out otherwise.
  - the Earth is roughly 4.5 billion years old, because dating methods genuinely bear on that number and genuinely moved it.

  And now the ones that break my brain:
  - "the Earth existed long before I was born" I want to call untouchable. But that looks like the same claim as the 4.5 billion years one, just blurrier. How can the blurry version be outside evidence and the sharp version inside it?
  - "published results mostly replicate." For my first ten years on the job that functioned exactly like a framework proposition — I never once checked it, I checked things against it. Then it came lose, over a few years, by ordinary evidence. Same with "the literature isn't being farmed by paper mills." So if a hinge can come loose, was it ever a hinge?
  - "reviewers are competent and acting in good faith." I can imagine this being overturned. I flatly cannot imagine that for other-minds. But when I'm writing, both feel the same way — load-bearing, invisible.
  - "my editor's summary of what legal said is accurate." I do check this one, sometimes. But only when I already suspect something. Does suspicion have to arrive first, and if so from where?

  My tentative principle is: a claim is framework for me iff any evidence you brought against it would have to be less secure than it is — I'd have to use the claim itself to weigh the evidence against it. Trouble is, that trick seems to work for the laptop too, and I just said the laptop is knowable. So the principle is already in trouble before I've started.

  Give me the best you can do: one or two candidate principles, stated precisely, clause by clause, with which of my cases each clause is there to handle. Then tell me honestly which of my verdicts each one forces me to abandon — if the only way to keep all of them is a baroque mess, say that and pick the simpler principle and name the casualty. Then run your winner on three I haven't listed: "climate models are broadly trustworthy," "the archive I'm working from isn't systematically forged," and "I'm not misremembering what my source told me last week." And finally, tell me what would change your mind — which argument or which case would make you drop your principle for the rival one, and where in your own reasoning you think you're most likely to be wrong. I don't want a tour of who said what, just your verdict and its soft spots.
reasoning: |-
  Okay, let me tackle this user's deep dive into epistemic foundations. They're a science journalist wrestling with Wittgenstein's hinge propositions versus testable claims, and their personal list shows genuine philosophical tension. 

  First, I notice how their concrete examples drive the confusion: the blurry "Earth existed before me" feeling untouchable while the precise 4.5-billion-year version sits firmly in evidence territory. That paradox is the core knot. Then there's the unsettling case of "published results mostly replicate" – something that functioned as a hinge for years until evidence dismantled it. Can a true hinge ever crumble like that? 

  The user's proposed principle (rejecting evidence that's less secure than the belief itself) fails because even mundane claims like "laptop before me" could defensively reject counterevidence. So we need something stricter. 

  I consider two angles: one focusing on whether doubt requires borrowing the belief itself (explaining why other-minds skepticism self-destructs), and another tracking if the claim was ever historically testable. Both have trade-offs. The first handles "other minds" beautifully but struggles with "reviewer competence" – the user feels both are load-bearing, yet one seems falsifiable. The historical version neatly explains why "literature isn't farmed" was never a true hinge (it was always testable in theory), but feels clunky for "the past happened."

  Watching the user's phrasing – "blurry vs sharp," "came loose by ordinary evidence" – tells me they crave a bright line between framework and testable. But hinges resist that. Maybe the friction points ("reviewer competence," "editor's summary") aren't hinges at all, just high-prior beliefs where evidence gathering is costly. 

  When testing principles against their unlisted cases, "climate models broadly trustworthy" clearly falls in testable territory because mountains of evidence could (and do) bear on it. Whereas "archive not systematically forged" might feel hinge-like until you realize forensic methods exist to test it – making it expensive-to-doubt rather than impossible-to-doubt. 

  My biggest vulnerability? The "Earth existed before me" case. If pressed, I'd argue its blurry version isn't identical to the 4.5-billion-year claim – one is about existence itself, the other about duration. But that feels like special pleading. A better critic might say my principle conflates psychological certainty with logical unfalsifiability. Still, for the user's practical needs – deciding when to stop verifying – this might suffice.
answer: |-
  Here's my best attempt at a principled distinction, built from your cases and designed to handle their friction points. I'll propose two candidate principles, dissect them, then pick a winner and apply it rigorously—casualties and all.

  ### Candidate Principle 1: The *Impossible-Doubt* Principle  
  A claim **C** is a *framework proposition* for agent **A** iff:  
  1. **Doubt Dependency**: Any attempt by **A** to seriously doubt **C** *requires borrowing **C** itself* to ground the process of doubt (e.g., tools, logic, memory).  
     *Handles: "Other minds" (doubt uses theory of mind), "past happened" (doubt uses memory/causality), "physics same tomorrow" (doubt assumes uniformity to test it).*  
  2. **No Historical Testing**: **C** has never been, and cannot be, treated by **A** as a hypothesis settled by empirical evidence *within their lived epistemic practice*.  
     *Handles: "Published results mostly replicate" (was treated as background, not tested, until evidence forced it).*  
  3. **Practical Immutability**: **A** cannot *coherently act* within their world while suspending **C**; action requires **C** as scaffolding.  
     *Handles: "Number in spreadsheet is what I see" (checking it assumes perception/memory coherence).*  

  *Forces you to abandon*:  
  - "Reviewers are competent/good faith" (doubt doesn’t inherently borrow competence itself; you can investigate fraud without assuming reviewer goodwill).  
  - "Editor's summary is accurate" (suspicion can arise externally, e.g., prior lies; action possible while doubting).  

  ### Candidate Principle 2: The *Unconditional-Scaffolding* Principle  
  A claim **C** is a *framework proposition* for agent **A** iff:  
  1. **Inferential Priority**: **C** is a necessary precondition for **A** to *assign meaning* to evidence for/against *any* empirical claim in domain **D** relevant to **C**.  
     *Handles: "Other minds" (needed to interpret behavior as evidence), "past happened" (needed to treat records/rocks as evidence).*  
  2. **No Evidential Pathway**: There exists *no conceivable route* by which **A** could gather empirical evidence to confirm/refute **C** without circularly presupposing **C**.  
     *Handles: "Physics same tomorrow" (testing it tomorrow assumes it).*  
  3. **Frame, Not Object**: **C** functions as the *frame* through which evidence is evaluated, never as the *object* of evaluation in **A**'s epistemic activities.  
     *Handles: "Earth existed before me" (blurry version sets time/object permanence for geology).*  

  *Forces you to abandon*:  
  - "Published results mostly replicate" (it *became* an object of evaluation via meta-science).  
  - "The literature isn't farmed by paper mills" (same; fraud detection methods exist independently).  

  ---

  ### The Winner: **Unconditional-Scaffolding Principle**  
  It better handles the "blurry vs. sharp" problem (e.g., "Earth existed" vs. "4.5B years") by emphasizing *role* over content. The blurry claim sets temporal/causal scaffolding *for* dating methods; the sharp claim is *output* of those methods. It also cleanly explains why "published results replicate" was *never a true hinge*—it was always *potentially* an object of study, even if ignored.  

  #### Casualties (Verdicts You Must Abandon):  
  1. **"Reviewers are competent/good faith"** → Falls to #2 (No Evidential Pathway). You *can* test this (e.g., compare reviews to author feedback, track retractions). It’s a high-stakes empirical assumption, not scaffolding.  
  2. **"Editor's summary is accurate"** → Falls to #3 (Frame, Not Object). You *do* sometimes check it; it’s a trust-based claim open to verification. Suspicion arises from external cues (e.g., inconsistency with emails).  

  ---

  ### Testing the Winner on New Cases  
  1. **"Climate models are broadly trustworthy"**  
     - **Verdict**: *Ordinary evidence*. Violates #2 (No Evidential Pathway): Paleoclimate proxies, hindcasting, and model intercomparisons provide non-circular evidence. It’s a *result* of scientific practice, not its precondition.  
  2. **"The archive I'm working from isn't systematically forged"**  
     - **Verdict**: *Framework (for you in this context)*. Satisfies #1 (Inferential Priority): You must assume archive integrity to interpret *any* document as evidence. Satisfies #2: Checking one document’s authenticity presupposes others are benchmarks (circular if *all* are suspect).  
  3. **"I'm not misremembering what my source told me last week"**  
     - **Verdict**: *Framework*. Satisfies #1: Needed to treat notes/recordings as evidence. Satisfies #2: Checking memory against notes assumes memory’s reliability *now*.  

  ---

  ### Where My Reasoning is Weak & What Would Change My Mind  
  **Soft Spot**: The "Earth existed before me" case. A critic could argue its blurry version *is* empirically testable (e.g., via parental testimony, birth records)—making it ordinary evidence. But under the principle, testimony *requires* the past as scaffolding. If you showed me a society where "past as real" is routinely debated/tested like "water is H₂O," I’d drop #2 (No Evidential Pathway).  

  **Biggest Vulnerability**: **Clause #3 (Frame, Not Object)**. It’s descriptive, not prescriptive. When "published results replicate" *functioned* as a frame for you, was it *temporarily* a hinge? I say no—its role was *pragmatic*, not epistemic. But if you demonstrated that *all* hinges can become objects without collapsing one’s worldview (e.g., doubting "other minds" while still doing science), I’d switch to the *Impossible-Doubt* principle and accept more casualties (like "past happened").  

  **Why Not Baroque?** Your intuitions about "reviewers" and "editor's summary" are tracking *practical* certainty, not logical hinges. Abandoning them simplifies the system without loss—Wittgenstein’s hinges weren’t supposed to be revisable. A "baroque mess" would arise if we tried to save them. Simplicity wins.  

  ---  
  **Final Tally**:  
  - Kept: Other minds, past happened, physics uniformity, spreadsheet number, laptop (as evidence), H₂O, Earth’s age, Earth’s pre-existence (blurry), paper mills (initially *mis*taken for hinge).  
  - Abandoned: Reviewer competence, editor summary accuracy.  
  - Demoted: "Published results replicate" (never a true hinge).
