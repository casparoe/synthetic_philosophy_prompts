prompt: |-
  I just had a long argument with a friend about a decision my committee is facing, and I would like a careful dissection of it. We are a three-person board that has to decide whether to terminate a contract with a supplier, and termination is justified exactly when two facts both hold: the supplier breached the specification, and the breach caused us material loss. We vote by simple majority on each of the three questions — breach, loss, and termination. The result is that a majority of us votes yes on breach, a majority votes yes on loss, but a majority votes no on termination, and in fact no two of us both affirmed the two constituent facts. My friend insists this is no paradox at all: we voted on the final question and a majority said no, so the outcome is exactly what the majority of us wanted, and there is nothing to explain. I think he is wrong, but I cannot say precisely where. Could you set out, in as much detail as possible, how this situation works and why his reassurance fails? In particular, I would like you to name the relevant impossibility theorems and paradoxes in the literature, explain precisely how the two standard ways of resolving the case can come to opposite results, and advise which of the two our board should adopt and why.
reasoning: |-
  We are dealing with a three-person board (let's call them A, B, C) that must decide on terminating a contract with a supplier. Termination is justified if and only if two facts hold:
    1. The supplier breached the specification (call this proposition B).
    2. The breach caused material loss (call this proposition L).

  The termination decision (T) is then defined as T = B ∧ L.

  The board votes on three propositions: B, L, and T. The voting results are:
    - A majority (at least two) vote 'yes' on B.
    - A majority vote 'yes' on L.
    - A majority vote 'no' on T (so at most one votes 'yes' on T).

  Moreover, it is given that no two members both affirmed both B and L (i.e., no two members voted 'yes' on both B and L). 

  This situation leads to an apparent paradox because the majority believes that B is true and that L is true, but the majority does not believe that T (which is B and L) is true. Furthermore, the condition that no two members affirmed both B and L explains why T did not get majority support: each member who voted for T must have voted for both B and L, but if no two did that, then at most one voted for T.

  Now, your friend argues that there is no paradox because the majority voted against termination and that is the outcome they wanted. However, the paradox lies in the fact that the majority voted for each of the premises (B and L) but against the conclusion (T). This is reminiscent of the doctrinal paradox and the discursive dilemma.

  Let me break it down:

  1. **The Doctrinal Paradox**:
     The doctrinal paradox occurs when a group must make a decision on a conclusion that is a function of several premises, and the majority vote on the premises leads to a different outcome than the majority vote on the conclusion.

     In this case:
       - Premise 1 (B): majority says yes.
       - Premise 2 (L): majority says yes.
       - Conclusion (T = B ∧ L): majority says no.

     So if we were to decide by aggregating the premises (premise-based procedure), we would get T = (B true) ∧ (L true) = true. But if we decide by aggregating the conclusion (conclusion-based procedure), we get T = false.

     Hence, the two procedures lead to opposite results.

  2. **The Voting Results**:
     We have three members: A, B, C. The votes on B and L must have at least two 'yes' each. The vote on T has at least two 'no'. Also, no two members vote 'yes' on both B and L.

     Let's try to assign votes:

     Possibility 1:
       - Member A: votes (B: yes, L: no, T: no)   [because T = yes would require both B and L yes, but if A votes yes on B and no on L, then T is no]
       - Member B: votes (B: no, L: yes, T: no)
       - Member C: votes (B: yes, L: yes, T: yes)   [but wait, if C votes yes on both, then we have one member voting for both. But the condition says no two members both affirmed both. So having one member vote both is okay, but we must not have two. However, in this case, the vote on T would be: only C votes yes -> then majority on T is no? Actually, we have two no's and one yes -> majority no. But also, the votes on B: A and C yes -> majority yes. L: B and C yes -> majority yes. But now we have a problem: if C votes yes on both, then we have one member who affirms both. The condition says no two members both affirmed both. So this is allowed? The condition says "no two", meaning that we cannot have two members who each voted yes on both. So one is okay.

     However, let's check the condition again: "no two of us both affirmed the two constituent facts". This means that we cannot have two members who both voted yes on B and both voted yes on L? Actually, it means that we cannot have two members who, for both propositions, voted yes. That is, it is not the case that there are two members such that for each of them, B is yes and L is yes.

     So in the above assignment, we have only C voting yes on both. Then we do not have two members both voting yes on both. So that's okay.

     But let's see the vote on T: only C votes yes -> so two vote no -> majority no on T.

     However, consider:

       A: (B: yes, L: no) -> T: no
       B: (B: no, L: yes) -> T: no
       C: (B: yes, L: yes) -> T: yes

     Then:
       B: A and C yes -> majority yes (2 yes, 1 no)
       L: B and C yes -> majority yes (2 yes, 1 no)
       T: only C yes -> majority no (2 no, 1 yes)

     This fits.

     But wait: the condition says "no two of us both affirmed the two constituent facts". In this scenario, is there any pair that both affirmed both? Let's check pairs:
       A and B: A has (B:yes, L:no); B has (B:no, L:yes) -> neither has both? So no.
       A and C: A has (B:yes, L:no) and C has (B:yes, L:yes) -> they both affirmed B? But note: the condition says "both affirmed the two constituent facts", meaning both B and L. For A: he did not affirm L. For C: he affirmed both. But they do not both have both. So the pair (A,C) does not both have both. Similarly, (B,C): B has (B:no, L:yes) -> so B did not affirm both. (A,B): neither has both. So condition holds.

     However, note that in this scenario, we have a majority for B and for L, but only one member (C) for T.

     But let's see if we can have a scenario where the majority on T is no and we have no member at all who votes for both? That is, without any member voting yes on both. Then:

       Possibility 2:
          A: (B: yes, L: no) -> T: no
          B: (B: yes, L: no) -> T: no
          C: (B: no, L: yes) -> T: no

       Then:
          B: A and B yes -> majority yes (2 yes, 1 no)
          L: C yes -> but then we only have one yes -> not majority? So this does not work because we need a majority on L.

       Possibility 3:
          A: (B: yes, L: no) -> T: no
          B: (B: no, L: yes) -> T: no
          C: (B: no, L: yes) -> T: no

       Then:
          B: only A yes -> not majority. -> not acceptable.

       Possibility 4:
          A: (B: yes, L: yes) -> T: yes   -> but then we have one member with both. We can have at most one? The condition says no two, so one is okay. But then we need the majority on L to be yes. If A votes yes on L, and say:
          A: (B: yes, L: yes) -> T: yes
          B: (B: yes, L: no) -> T: no
          C: (B: no, L: yes) -> T: no

          Then:
            B: A and B yes -> majority yes (2 yes, 1 no)
            L: A and C yes -> majority yes (2 yes, 1 no)
            T: A yes, B and C no -> so majority no.

          And check the condition: no two members both affirmed both. 
            A has both. 
            B: only B yes and L no -> not both.
            C: only L yes -> not both.
            So pairs: (A,B): A has both, B does not -> so they do not both have both.
            (A,C): A has both, C does not.
            (B,C): neither has both.
            So condition holds.

          However, in this scenario, we have one member (A) who voted for both. The condition does not prohibit having one.

          But the problem states: "in fact no two of us both affirmed the two constituent facts". This is satisfied as long as we do not have two members who each voted yes on both. So having one (or zero) is okay.

          But note: the problem says "no two of us both affirmed" meaning that we cannot have two members who each affirmed both. So having one is acceptable.

     Therefore, the voting pattern in possibility 1 and 4 are both possible. In both cases, we have a majority for B, a majority for L, and a majority against T.

  3. **Two Standard Ways of Resolving the Case**:
     There are two standard procedures for making the decision:

     a. **Conclusion-based procedure**: The group takes a vote only on the conclusion (T) and decides based on the majority vote on T. In this case, the majority votes no on T, so the contract is not terminated.

     b. **Premise-based procedure**: The group takes a vote on each premise (B and L) and then deduces the conclusion from the majority votes on the premises. Since the majority says B is true and L is true, then T = true, so the contract is terminated.

     These two procedures lead to opposite outcomes.

  4. **Why the Friend's Reassurance Fails**:
     Your friend says that the outcome is exactly what the majority wanted because they voted no on termination. However, note that the majority also voted that the supplier breached (B) and that the breach caused material loss (L). So if the rule is that termination is justified exactly when both B and L are true, then by the rule, termination should occur. Yet, the majority does not want termination? This inconsistency is the paradox.

     The reassurance fails because it ignores the fact that the majority's votes on the premises would lead to termination under the rule. The rule is defined by the conjunction. Therefore, the board's own rule says that if B and L are true, then termination is justified. The premise-based procedure respects the rule by aggregating the premises and then applying the rule. The conclusion-based procedure aggregates the conclusion without regard to the rule.

     However, the conclusion-based procedure might be defended by saying that the members may have private reasons for their votes on T that are not captured by the premises. But in this case, the rule is explicit: T is defined as B ∧ L. Therefore, each member should vote for T if and only if they believe both B and L. But we see that even though the majority believes B and the majority believes L, they do not necessarily individually believe both. This is the key: the majority of the group on each premise does not imply that any individual member (let alone a majority) holds both premises.

  5. **Relevant Theorems and Paradoxes**:
     - **Doctrinal Paradox**: This is the specific paradox we are facing. It shows that aggregating individual judgments on interconnected propositions can lead to inconsistencies when using majority rule.

     - **Condorcet's Paradox**: This is a related paradox that shows that majority preferences can be intransitive (A preferred to B, B to C, but C preferred to A). The doctrinal paradox can be seen as a generalization.

     - **Impossibility Theorems**: The discursive dilemma (another name for the doctrinal paradox) has been shown to be an instance of a more general impossibility result. A famous theorem in judgment aggregation is the **List-Pettit theorem** (or the impossibility theorem of judgment aggregation). It states that there is no aggregation function that simultaneously satisfies the following three conditions for all profiles of individual judgments:
          * Universal domain: The function accepts any logically consistent individual judgments.
          * Collective rationality: The collective judgments are logically consistent.
          * Unanimity preservation: If all individuals hold a particular judgment, then the collective also holds that judgment.
          * Systematicity: The collective judgment on each proposition depends only on the individual judgments on that proposition and in the same way for all propositions.

     In our case, the majority rule on each proposition violates collective rationality because it can lead to an inconsistent collective judgment (B true, L true, but T false, even though T is defined as B ∧ L).

  6. **Which Procedure Should the Board Adopt?**:
     The choice between the two procedures depends on the board's values and the purpose of the rule.

     - **Premise-based procedure**: This procedure respects the logical connection between the premises and the conclusion. It ensures that the collective decision on the conclusion is consistent with the collective decisions on the premises. In this case, if the board believes that the rule (termination iff both B and L) is fundamental and that the premises are the building blocks, then they should use the premise-based procedure. This would lead to termination.

       However, one might object that the members may have other reasons for their votes on T that are not captured by the premises. But note that the rule is defined by the conjunction of the two premises. If a member believes that B and L hold, then by the rule they should vote for T. If they do not, they are violating the rule. Therefore, the premise-based procedure enforces the rule.

     - **Conclusion-based procedure**: This procedure respects the members' overall judgment on the conclusion. It might be argued that members can take into account other factors (even if the rule says only B and L) or that they might interpret the premises differently when considering the conclusion. However, if the rule is strictly defined by B and L, then the conclusion-based procedure might violate the rule because it might lead to termination being rejected even when the premises are true.

     Recommendation:

     Given that the rule explicitly defines termination as requiring both breach and material loss, the board should use the premise-based procedure. This is because the rule is intended to be applied based on the facts (the premises). The conclusion (T) is not an independent judgment but a function of the premises. Therefore, aggregating the premises and then applying the rule ensures consistency with the definition.

     However, it is important to note that the board must be sure that the premises are the only factors. If there are other considerations (for example, mitigating circumstances) that are not captured by B and L, then the rule might be too simplistic. But the problem states that termination is justified exactly when both facts hold. Therefore, the premise-based procedure is the appropriate one.

     In summary, the board should adopt the premise-based procedure and terminate the contract.

     But note: the problem states that the board has already voted and the votes are as described. The vote on T was taken and it returned no. So in practice, the board might feel bound by the vote on T. However, this is a matter of procedure. If the board has a rule that says they vote on the premises and then apply the rule, they should follow that. If they have a rule that they vote on the conclusion, they follow that. Without a prior rule, they must choose.

     Since the contract termination rule is defined by the premises, it is more natural to use the premise-based procedure. Therefore, the board should reconsider and base the decision on the majority votes on the premises.

     Final note: The situation described is a classic example of the doctrinal paradox. The board's experience is a real-world illustration of the theoretical problem. It is important for the board to establish a clear procedure in advance to avoid such inconsistencies in the future.
answer: |-
  This situation is a classic example of the **doctrinal paradox** (also known as the **discursive dilemma**), which reveals a fundamental tension in collective decision-making when a group must decide on logically interconnected propositions. I will dissect the case step by step, identify the paradox, reference relevant theorems, contrast the two resolution methods, and advise on the best approach for your committee.

  ### Step 1: The Voting Outcome
  - **Committee structure**: Three members (A, B, C).
  - **Propositions**:
    - **B**: Supplier breached the specification.
    - **L**: Breach caused material loss.
    - **T**: Terminate the contract (defined as \(T \equiv B \land L\)).
  - **Vote results**:
    - Majority votes "yes" on **B** (at least 2 of 3 affirm breach).
    - Majority votes "yes" on **L** (at least 2 of 3 affirm loss).
    - Majority votes "no" on **T** (at least 2 of 3 reject termination).
  - **Critical constraint**: No two members affirmed both **B** and **L** simultaneously.  
    This implies that at most one member voted for both premises. For example:
    | Member | Vote on B | Vote on L | Vote on T (consistent with \(B \land L\)?) |
    |--------|-----------|-----------|--------------------------------------------|
    | A      | Yes       | No        | No (since \(B \land L\) false)             |
    | B      | No        | Yes       | No (since \(B \land L\) false)             |
    | C      | Yes       | Yes       | Yes (since \(B \land L\) true)             |
    Here, **B** passes (A and C yes), **L** passes (B and C yes), but **T** fails (only C votes yes; A and B vote no). No two members agreed on both **B** and **L** (only C did).

  ### Step 2: The Paradox and Why Your Friend is Mistaken
  Your friend argues: "The majority voted no on **T**, so termination is rejected—end of story." This is incomplete because:
  - **The rule defines T as B ∧ L**: Termination is *contingent* on both **B** and **L** being true. The vote on **T** is not independent; it is derived from the premises.
  - **Majority support for premises vs. conclusion**: 
    - The group majority believes **B** is true (2/3).
    - The group majority believes **L** is true (2/3).
    - By logical implication, \(B \land L\) should be true, so **T** should be approved. Yet, the majority rejects **T**.
  - **The core issue**: Individual rationality does not guarantee group rationality. Members vote on **T** based on their *personal* assessment of \(B \land L\), but no majority agrees on the *joint truth* of **B** and **L**. The group’s collective judgment on the premises (**B** and **L**) is logically inconsistent with its judgment on the conclusion (**T**).  
  **Why your friend is wrong**: They ignore the logical connection between **B**, **L**, and **T**. The rule states termination is justified iff **B** and **L** both hold. If the group affirms **B** and **L**, rejecting **T** violates the rule. The vote on **T** reflects aggregated opinions on the *outcome*, but it may contradict the aggregated opinions on the *reasons* for that outcome.

  ### Step 3: Relevant Theorems and Paradoxes
  1. **Doctrinal Paradox**:
     - **Definition**: When a group votes separately on premises and a conclusion logically tied to them, majority voting can produce inconsistent collective judgments (e.g., majority for premises but against conclusion).
     - **This case**: The paradox manifests here: Majority for **B**, majority for **L**, but majority against **T** (even though \(T \equiv B \land L\)).

  2. **Condorcet Paradox**:
     - **Relevance**: Shows majority voting can lead to cycles (e.g., A > B, B > C, C > A). Here, it relates to the intransitivity of preferences/judgments. The doctrinal paradox extends this to logical dependencies between propositions.

  3. **Impossibility Theorems**:
     - **List-Pettit Theorem** (2002): Proves that no aggregation rule (e.g., majority vote) can always satisfy all three conditions for collective rationality:  
       (a) **Universal Domain**: Any coherent individual judgments are allowed.  
       (b) **Collective Rationality**: Group judgments are logically consistent.  
       (c) **Systematicity**: Collective judgment on each proposition depends only on individual judgments on that proposition.  
       - **Application here**: Your committee’s votes violate collective rationality. The group affirms **B** and **L** (implying **T**), but rejects **T**, creating inconsistency. The theorem explains why such paradoxes are unavoidable under majority voting on interconnected issues.

  ### Step 4: Two Resolution Methods and Opposite Outcomes
  The doctrinal paradox forces a choice between two aggregation methods, leading to opposite results:

  1. **Conclusion-Based Procedure (CBP)**:
     - **Method**: Ignore votes on premises; decide solely based on majority vote on **T**.
     - **Outcome here**: Majority rejects **T** (2/3 vote no) → **Do not terminate**.
     - **Rationale**: Respects the majority’s direct verdict on the final decision. Members may consider nuances beyond **B** and **L** (e.g., fairness, future relations) when voting on **T**.
     - **Risk**: Ignores the rule \(T \equiv B \land L\). The group may affirm the premises but reject the conclusion, violating logic.

  2. **Premise-Based Procedure (PBP)**:
     - **Method**: Vote only on premises **B** and **L**; derive **T** from the majority outcome using \(T \equiv B \land L\).
     - **Outcome here**: Majority affirms **B** and **L** → **T must be true** → **Terminate**.
     - **Rationale**: Respects the logical rule and ensures consistency. Premises are the "building blocks" of the decision.
     - **Risk**: Overrides individual judgments on **T**. A member might accept **B** and **L** but reject **T** for external reasons (though the rule defines **T** strictly by **B** and **L**).

  **Opposite results**: CBP rejects termination; PBP approves it.  
  **Why they conflict**: CBP aggregates judgments on the conclusion independently; PBP aggregates judgments on premises and enforces logical constraints. The constraint \(T \equiv B \land L\) and the voting pattern cause the divergence.

  ### Step 5: Recommendation for Your Committee
  **Adopt the premise-based procedure (PBP) and terminate the contract.**  
  **Reasons**:
  1. **Fidelity to the rule**: Termination is defined *explicitly* as requiring both **B** and **L**. PBP enforces this rule by deriving **T** from the majority verdicts on **B** and **L**. CBP ignores the rule, allowing **T** to be decided arbitrarily.
  2. **Consistency**: PBP guarantees logical coherence (if the group affirms **B** and **L**, it must affirm **T**). CBP risks inconsistency, as here.
  3. **Transparency and expertise**: Premises (**B** and **L**) are factual and easier to verify objectively. Members may have specialized knowledge (e.g., legal for **B**, financial for **L**), making premise-based voting more reliable.
  4. **Mitigating strategic voting**: PBP reduces incentives to vote strategically on **T** (e.g., rejecting termination for non-contractual reasons).

  **Counterargument to CBP**: Your friend’s view ("respect the majority on **T**") is pragmatic but flawed. It turns the rule \(T \equiv B \land L\) into a mere suggestion, undermining the committee’s mandate. If external factors matter, amend the rule—do not override it via aggregation.

  ### Final Advice
  1. **Immediate decision**: Use PBP. The majority affirmed **B** and **L**, so by rule, terminate.
  2. **Long-term reform**: Adopt a formal voting protocol:
     - **Vote only on premises** using PBP, deriving **T** logically.  
     **OR**  
     - **Vote only on T** (CBP), but redefine the rule to allow broader considerations (if appropriate).  
     Do not vote on all three without specifying how conflicts are resolved.
  3. **Acknowledge the paradox**: This outcome is not irrational—it reflects the List-Pettit impossibility. Choosing PBP prioritizes consistency with the rule.

  By adopting PBP, your committee upholds the contractual standard and avoids arbitrary decisions. The majority’s support for **B** and **L** must trigger termination, as the rule requires.
