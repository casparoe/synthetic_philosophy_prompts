  ## Refrain of the Shifting Self

  **The selfsame soul in worlds where all unfolds**  
  (Where I am tall, or short, or kings command),  
  **A mirrored self in that far sphere instead.**  
  Could properties like height, fixed in these moulds,  
  Define a being, hold it to this land?  
  **The selfsame soul in worlds where all unfolds**  
  Must stand unchanged, while counterpart upholds  
  The tale of what *might* be, on foreign sand.  
  **A mirrored self in that far sphere instead.**

  But here, not there, the argument takes hold:  
  This hair now grey, this ring upon my hand –  
  **The selfsame soul in worlds where all unfolds?**  
  Was *I*, five minutes past, before the cold  
  Doubt crept, this soul intact, or just a stand-  
  **A mirrored self in that far sphere instead?**

  If height's mere chance makes identity remould,  
  Then time, too, fragments what we thought we spanned.  
  **The selfsame soul in worlds where all unfolds**  
  Claims persistence, but the tale it scolds –  
  That past self fades, a stranger, close at hand,  
  **A mirrored self in that far sphere instead.**

  The core dissolves beneath what time controls.  
  **The selfsame soul in worlds where all unfolds**,  
  **A mirrored self in that far sphere instead.**

  ---

  ## Explanation for the Philosopher

  1.  **Refrains & Positions:**
      *   **Kripkean (Transworld Identity):** "**The selfsame soul in worlds where all unfolds**" asserts the strict identity of the individual across possible worlds (modelled as actualist/concretist). The soul is the rigid designator maintaining identity despite differing contingent properties (height, kingship). It's the "selfsame" entity.
      *   **Lewisian (Counterpart Theory):** "**A mirrored self in that far sphere instead**" clearly states the counterpart position. There is no *identical* individual in another world; there's only a distinct individual ("mirrored self") in that other world ("far sphere") who stands in the counterpart relation, bearing similarity and playing the 'me'-role there. "Instead" emphasizes substitution.
      *   **"Passing Each Other":** The refrains alternate, each simply restating its core tenet without directly engaging or refuting the other, demonstrating the fundamental incompatibility of the views. They coexist in the poem's structure but don't reconcile.

  2.  **Volta (Turn - Lines 10-11):**
      *   "But here, not there, the argument takes hold:" shifts the focus from abstract possible worlds to our *actual, temporal* existence.
      *   "This hair now grey, this ring upon my hand –" introduces concrete, accidental properties changing *over time*.
      *   "**The selfsame soul in worlds where all unfolds?**" Uses the Kripkean refrain *as a question* applied to the self *through time*. This is the crucial moment: the problem of accidental intrinsics (height changing across worlds) is identical in structure to the problem of temporary intrinsics (hair greying, ring acquired over time). If differing height threatens transworld identity, differing properties over time threaten personal identity through time.

  3.  **Diachronic Consequence Development:**
      *   Lines 13-15 explicitly draw the parallel: "If height's mere chance makes identity remould, / Then time, too, fragments what we thought we spanned." The logic forcing counterpart theory modally now forces it temporally.
      *   "That past self fades, a stranger, close at hand" vividly illustrates the consequence: the 'me' of five minutes ago becomes merely a temporal counterpart, not strictly identical to the present me. Identity through time is fragmented.

  4.  **Closing Couplet:**
      *   "The core dissolves beneath what time controls." Summarizes the unsettling conclusion: there is no enduring "core" self untouched by changing properties, precisely because time acts like modal variance on intrinsics.
      *   The final placement of the refrains side-by-side: "**The selfsame soul in worlds where all unfolds**, / **A mirrored self in that far sphere instead**" now resonates *both* modally *and* temporally. The Kripkean claim of strict identity seems untenable not just across worlds, but crucially, across time. The Lewisian view of similarity-based counterparts becomes the model for understanding even our own persistence. They end up together because the problem binding them modally also binds us temporally.

  **Metaphysical Accuracy:**
  *   **Kripkean Refrain:** Accurately captures the essentialist, rigid designation view where the *same object* exists with different properties.
  *   **Lewisian Refrain:** Accurately captures counterpart theory's denial of transworld identity and reliance on similarity relations between distinct world-bound individuals.
  *   **Problem of Accidental Intrinsics:** Correctly framed as the challenge to transworld identity (can the same thing have incompatible properties?).
  *   **Diachronic Parallell:** Precisely applies the Problem of Accidental Intrinsics to the Problem of Temporary Intrinsics, showing how the logic threatening transworld identity equally threatens identity through time, leading to a temporal counterpart theory or perdurantist view. This is a recognized and serious argument in metaphysics.

  A philosopher of modality should recognize the accurate representation of the core positions and the powerful implication drawn about personal identity over time stemming directly from the modal debate.
