prompt: |-
  I teach a course on philosophy of religion and we just wrapped the omnipotence paradox unit, and I keep being struck by how much of the literature goes into the stone-so-heavy thing and how little goes into the fact that actual institutions seem to have settled the paradox in practice without ever arguing about it. The case I've been chewing on: the Vatican's procedure for certifying a miracle for canonization. As I understand it — happy to be told the fine print is different, just assume the rough shape is right — a claimed cure gets put forward, a panel of doctors goes through the medical records, and the question they're asked is whether the recovery can be explained by ordinary medicine. If they say it can't, and if the cure was sudden, complete and lasting, and it came after people had been praying to the candidate, then it can count as a miracle and be credited to that candidate's intercession. What gets me is that the whole apparatus is built to detect an intervention: it needs a stable, law-governed nature as the backdrop, and it treats "medicine has no explanation for this" as the fingerprint of God. And notice the paradox just silently falls out the back of it: nobody ever proposes a logically incoherent cure — a lesion that was and wasn't a lesion, a cure that both happened and didn't — the tests are all for surprising but perfectly describable events. So the procedure seems to be running on one particular resolution of the paradox (omnipotence ranges over possible deeds, not over nonsense, so "can God make a contradiction" isn't a task but a phrase with no content) while never once arguing for it, and quietly ruling out the voluntarist picture where power is sheer will unconstrained even by describability.

  So: I want the implicit-theology writeup. What view of divine power does this certification practice actually presuppose, and which rival pictures of omnipotence does it quietly rule out? Which ones could license it just as well — because my suspicion is that it's alot more underdetermined than it looks, and that a Thomist, a Molinist and something closer to occasionalism could all sign off on the same paperwork. And the part I'm really after: is the practice internally consistent? The same institution's official theology says God is the primary cause of everything that happens, that natural causes are themselves sustained by God at every moment — and if that's right, there is no such thing as a "medicine cant explain this" zone, the gap isn't a gap, and the fingerprint is on everything. The procedure needs the gap to be real, and it needs God's power to show up precisely as the exception. Is that a straight contradiction, or can the practice get by on something weaker — say that these cures are signs rather than interventions, or that the intervention talk is just the way a tribunal has to talk? And then take the last step: if you decided the practice had to be rebuilt around one of the rival views, what would actually change on the ground — could you still use the doctors, could you still credit the intercession, or does it collapse into "we find it striking that this happened"?

  Don't bother with citations or a reading list, I'll do the references myself; I want the reconstruction and the argument. And if the honest answer is that the practice doesn't presuppose any single view of divine power, then say so and show me which parts of it are doing which work. One more thing — please don't lean on whatever you happen to remember about particular saints or particular cures, keep it at the level of the procedure itself.
reasoning: |-
  Okay, let me unpack this fascinating query about the Vatican's miracle certification process and its theological underpinnings. The professor is noticing how this practical institution resolves the omnipotence paradox without ever explicitly debating it - and wants to analyze the implicit theology at work.

  First, I need to reconstruct the core tension they're highlighting: On one hand, the miracle procedure treats "medically inexplicable" as God's signature, implying a stable natural order that can be interrupted. On the other hand, official Catholic theology says God is already causing everything all the time. That seems contradictory. 

  The key here is recognizing levels of causation. In Thomist frameworks (which deeply influence Vatican thinking), God operates as primary cause while created things operate as secondary causes. The miracle procedure isn't looking for God's presence (which is everywhere) but for a particular mode of divine action - where God acts as the immediate cause without secondary causes. That's why the medical inexplicability matters: it signals the absence of secondary causation.

  But could other theological views accommodate this? Let me test them:

  • Molinism: Since it shares the primary/secondary causation structure, it could easily adopt the same procedure. The "middle knowledge" element wouldn't affect how miracles are certified.

  • Occasionalism: Tricky. If God is the only real cause, then "medically inexplicable" loses meaning since medicine never explains anything fundamentally. The procedure would need radical retooling to look for "specially intended" events rather than "gaps."

  • Voluntarism: Directly contradicts the practice. If God can make contradictions true, then a "cure that both happened and didn't" could theoretically be a miracle - but the procedure implicitly rejects such nonsense by requiring coherently describable events.

  About internal consistency: The "gap" isn't metaphysical but epistemological. The tribunal isn't saying God wasn't involved in ordinary recoveries; it's saying this recovery lacks the signatures of secondary causation. The "fingerprint" language works because it's about discernible patterns, not absolute divine absence.

  For the rebuild scenario: Only occasionalism would require major changes - perhaps shifting to "events that strikingly fulfill divine intentions." But Thomists/Molinists could keep the current medical review. Voluntarists might abandon medical review altogether since "sheer will" leaves no consistent forensic traces.

  The beauty is that the procedure stays theologically neutral among views that accept orderly secondary causation. What it can't accommodate are theologies that either collapse all causation into God (making gaps impossible) or reject causal consistency (making forensic analysis meaningless).
answer: |-
  Here’s a reconstruction of the implicit theology and internal logic of the Vatican’s miracle certification process, dissected into your core questions:

  ### 1. **Implicit View of Divine Power**  
     - **Moderate Theological Rationalism**: The procedure presupposes a *law-governed natural order* where divine action is discernible through *exceptions* to that order. God’s omnipotence is understood as the ability to act *within or beyond* nature, but never in *logically incoherent* ways. "Making a stone too heavy to lift" is excluded not by divine limitation but because it’s a category error—omnipotence pertains to actualizable possibilities, not self-contradictions.  
     - **Divine Action as "Intervention Lite"**: Miracles are not raw displays of power but *signs* within creation. God’s action is:  
       - **Distinct**: It leaves a "gap" (medically inexplicable cure) against a backdrop of ordinary causation.  
       - **Descriptible**: It produces concrete, observable effects (sudden, complete, lasting recovery).  
       - **Relational**: It responds to intercessory prayer, linking divine power to human petition.  

  ### 2. **Rival Views Ruled Out**  
     - **Voluntarism (Sheer Will)**: Explicitly excluded. If God’s power were unconstrained by logical coherence or describability, "medically inexplicable" would be irrelevant—God could make a cure both happen and not happen. The procedure’s reliance on *empirical consistency* (e.g., a tumor vanishing verifiably) assumes divine actions are rationally intelligible.  
     - **Strong Occasionalism**: Undermined. If God directly causes *all* events, natural laws are mere descriptions of divine habits, and "medical explanation" is always shorthand for "God’s ordinary action." The procedure’s need for a *contrast* between "natural" and "supernatural" collapses.  
     - **Pantheism/Immanentism**: Rejected. The "gap" requires a Creator distinct from creation, capable of acting upon it externally (even if sustaining it internally).  

  ### 3. **Compatible Rival Views (The Underdetermination)**  
     - **Thomism**: Fits seamlessly. Primary causation (God) enables secondary causes (nature). A miracle occurs when God acts as primary cause *without* secondary causes. The medical panel’s "no explanation" verdict identifies an absence of secondary causation.  
     - **Molinism**: Compatible. God’s middle knowledge includes all possible worlds, so a miracle is a *divinely selected* event within a providential plan. The procedure’s focus on prayerful intercession aligns with God’s knowledge of counterfactuals.  
     - **Weak Occasionalism/Concurrentism**: Workable if framed as God *permitting* nature to operate ordinarily but *specially acting* in miracles. The "gap" becomes a *discontinuity in secondary causation*, not divine absence.  

  ### 4. **Internal Consistency: The "Gap" Problem**  
     The apparent contradiction—**"God causes everything, yet miracles are interventions"**—is resolved through:  
     - **Causal Layers**: God sustains nature as primary cause, but miracles involve God acting *immediately* (without secondary causes). The "gap" is not metaphysical but *epistemological*: Medicine detects the *absence of natural mechanisms*, not the absence of God.  
     - **Sacramental Signhood**: The miracle is a *sign*, not a metaphysical anomaly. The procedure identifies events where God’s action is *uniquely transparent* for discernment. Thus, "intervention" is a *hermeneutic category* for the tribunal, not a claim that God is otherwise absent.  
     **→ Is it consistent? Yes**, if two premises hold:  
       (a) Nature operates with relative autonomy (secondary causation is real).  
       (b) God can suspend/override secondary causes for communicative purposes.  
     If either fails, the procedure becomes incoherent.  

  ### 5. **Rebuilding the Practice: What Changes?**  
     - **For Thomism/Molinism**: No change needed. The current procedure already aligns with their metaphysics.  
     - **For Occasionalism**: **Radical overhaul**. Medical inexplicability loses meaning. Alternatives:  
       - Look for *providential significance* (e.g., cures that fulfill a divine "pattern" or timing).  
       - Drop scientific review entirely; rely on spiritual discernment ("we find it striking").  
     - **For Voluntarism**: **Collapse of forensic rigor**. If God’s power transcends logic, "proof" is impossible. The tribunal could only assert miracles based on authority, not evidence.  
     - **For Pantheism**: **Abandonment**. No "intervention" is possible if God/nature are identical.  

  ### The Core Insight  
  The procedure **is not neutral**: It *requires* a metaphysic where:  
  - Nature is a stable, intelligible system (ruling out voluntarism).  
  - Divine action is exceptional and detectable (ruling out strong occasionalism).  
  - God’s power produces describable effects (ruling out incoherent acts).  
  **What survives underdetermination?** Any theology accepting *secondary causation* and *divine transcendence*. Thomists and Molinists can share the paperwork; voluntarists and occasionalists cannot. The practice is robust for its purpose—identifying *signs of intercession*—but only within a specific theological ecosystem. It silently resolves the omnipotence paradox by treating "logically possible actions" as the only meaningful domain for divine power.
