answer: |-
  You've pinpointed a fascinating and deeply ingrained tension in the literary world. The practice you describe rests on a **Communicative Intent Theory of Literary Art**, which presupposes:

  1.  **Authorial Intent Defines the Genre Contract:** The author's *intention* regarding the relationship between the text and the external world is paramount. This intention creates an implicit contract with the reader:
      *   **Fiction Contract:** "This is an imagined world/story. Judge it on its internal coherence, thematic resonance, linguistic artistry, emotional truth (not factual accuracy), and the skill of its invention."
      *   **Nonfiction Contract (Memoir/Autobiography):** "This purports to be a truthful account of actual events/people (within the understood limits of memory and perspective). Judge it on factual accuracy (to the extent possible/claimed), fairness, honesty, representativeness, insight, *and* narrative skill."
      *   **Autofiction Contract (A Hybrid):** "This *uses* the raw material of my life but consciously transforms, selects, and shapes it using fictional techniques. Judge it on the *artistry* of that transformation, the creation of meaning beyond mere recounting, and the exploration of self/truth through fictionalization." (This contract is often unstable, leading to the critical shift you observe).

  2.  **Genre Determines Relevant Criteria:** The contract established by authorial intent dictates which evaluative tools are appropriate and relevant. Factual inaccuracy is irrelevant to *King Lear* but potentially devastating to a biography of Shakespeare. Conversely, judging a memoir *solely* on the "liveliness" of its characters while ignoring the ethics of representation would be seen as incomplete.

  3.  **"Art" in Fiction Resides Primarily in *Imagination*:** The core artistic act for fiction, within this framework, is the deliberate creation of something *other* than direct reportage. The transformation of experience, the invention of characters and events, the structuring of plot – these acts of imagination are central to its artistic value.

  4.  **"Art" in Nonfiction Resides in *Interpretation, Craft, and Truthfulness*:** The artistic merit lies in the selection, shaping, interpretation, and compelling narration of *actual* events and people, coupled with a commitment to a defined level of truthfulness (which varies by sub-genre). The artistry is in the telling *of the truth*, not in inventing the truth.

  **Testing the Theory Against Your Observations:**

  *   **The Autobiographical Revelation & Critical Shift:** This shift occurs because the perceived authorial intent changes. What was assumed to be an "imagination contract" (fiction) is revealed to be, or suspected to be, closer to a "truth-telling contract" (memoir). Criticisms about honesty, fairness, and self-indulgence become relevant *only* if the contract implies a claim to represent reality. The "same words" are now interpreted through a different lens because the perceived *purpose* of the words has changed.
  *   **Prize Committees & Categorization:** Prizes enforce the genre contract model explicitly. Eligibility hinges on the author/publisher's *claim* about intent and the work's relationship to reality. A book disqualified from fiction for being "really memoir" is disqualified because the committee believes the author violated the "imagination contract" essential to the fiction category. It's about the *claimed nature* of the work, not just the text's inherent qualities.
  *   **The "Drawing from Life" Problem:** This is the theory's biggest weakness. It presupposes a clear boundary where none exists. It struggles to handle:
      *   **Highly Autobiographical Fiction:** Where does inspired-by end and autofiction begin? When does "drawing from life" become insufficiently transformative to count as "imagination"?
      *   **Novelized Biography/History:** Heavily researched fiction based closely on real events/people. Is the artistry purely in the prose and structure, or does proximity to fact constrain the "imagination" requirement?
      *   **The inherent subjectivity of memory:** Even strict memoir involves selection, shaping, and perspective – forms of "artistic" transformation.
  The practice often relies on **sociological cues** (marketing, author interviews, paratext) and **perceived degree of transformation** to draw fuzzy, often arbitrary lines. There *is* no truly principled, purely textual line.

  **Comparison to Visual Arts:**

  *   **Different Medium, Different Truth Claims:** Painting and sculpture are largely non-discursive. A portrait isn't expected to narrate the *entire factual life* of the sitter. Its "truth claim" is primarily perceptual/emotional ("does this capture a likeness/essence?") rather than propositional ("did event X happen exactly this way?"). The source material (photo, life, imagination) is less relevant than the *resulting image*.
  *   **Conceptual Art's Embrace of Intent:** You're right that conceptual art *does* incorporate artist intent and context as constitutive. Crucially, however, this *expands* the definition of art ("this urinal *is* art because I, the artist, designate it as such within this context"). **The key difference:** In literature, discovering autobiographical roots often leads to a *contraction* of the evaluative framework *away* from "art" criteria (imagination, invention) *towards* "truth-telling" criteria (accuracy, fairness). Conceptual art uses intent to *elevate*; literature often uses revealed intent to *re-categorize* and potentially *diminish* (from "art of imagination" to "mere confession").
  *   **The "Backwards" Feeling:** This stems precisely from the **Communicative Intent Theory**. Visual art, especially post-modern and conceptual, often rejects the need for a clear fiction/nonfiction divide based on source material. Literary institutions (publishers, prizes, critics) largely still uphold it, leading to the critical demotion you observe when autobiographical roots are revealed. Visual art focuses on the *artifact and its effect*; literature (in this practice) focuses heavily on the *provenance and claimed intent*.

  **What Would Change Under a "Continuous" Model?**

  If we adopted a view where "fiction" and "autobiography" are points on a spectrum, judged solely on "whether the writing is good," several fundamental shifts would occur:

  1.  **Genre Labels Become Descriptive, Not Prescriptive:** "Novel," "Memoir," "Autofiction" would describe techniques and source material, not dictate evaluative rules. They would be like "landscape," "portrait," or "abstract" in art.
  2.  **Collapse of Separate Prize Categories:** Prizes like the Booker would need a single category for "Book" or "Narrative Prose," judged on literary merit regardless of factual basis. Nonfiction prizes might persist but focus solely on works making explicit factual/analytical claims (history, science, strict investigative journalism).
  3.  **Radical Shift in Criticism:** Critics would focus exclusively on the text's *achievements*:
      *   **Narrative Power & Cohesion:** Does it compel? Is the structure effective?
      *   **Linguistic Artistry:** Is the prose beautiful, inventive, precise, evocative?
      *   **Psychological & Emotional Insight:** Does it reveal something profound about the human condition, relationships, or inner life?
      *   **Thematic Resonance:** Does it explore complex ideas meaningfully?
      *   **Formal Innovation:** Does it do something new or interesting with language/structure?
      Questions about "fairness to real people" or "factual accuracy *as the primary measure*" would vanish unless the work explicitly positioned itself as documentary or promised factual rigor. "Self-indulgence" would only be relevant if it manifested as *poor writing* (e.g., tedious navel-gazing lacking universality or craft).
  4.  **The Burden Shifts to the Reader/Context:** Readers would need to discern the text's relationship to reality based on internal clues and external information, without the crutch of a genre label dictating how to judge it. Context (author notes, interviews) would inform understanding but not dictate evaluation criteria.
  5.  **"Art" Redefined as Mastery of Form and Effect:** The artistic merit would reside purely in the skill, intelligence, and emotional power demonstrated in the *writing itself*, irrespective of its origin in imagination, memory, or research.

  **Conclusion:**

  The current literary practice presupposes a **Communicative Intent Theory** where authorial declaration of the work's relationship to reality (fiction vs. nonfiction) fundamentally changes the nature of the "contract" with the reader and thus the criteria for its evaluation as art. Art in fiction is tied to imagination; in nonfiction, to truthful interpretation and craft. This theory is inconsistent in practice because the boundary is porous, relying on sociological cues and arbitrary judgments about "sufficient transformation." It contrasts sharply with much visual art practice, where the source material is less determinative of artistic status.

  Adopting a continuous model would be revolutionary, collapsing rigid genres and refocusing all evaluation on the literary qualities of the text itself. It would treat the relationship to reality as a *feature* of the work's construction, not a determinant of its artistic category. The question wouldn't be "Is this fiction or memoir?" but "How does this text, using whatever materials and techniques, create meaning, emotion, and aesthetic experience?" While practical challenges exist (especially for explicitly truth-claiming nonfiction), this shift would arguably align literary evaluation more closely with how we often judge other art forms and potentially liberate writers from the constraints of an increasingly artificial binary.
