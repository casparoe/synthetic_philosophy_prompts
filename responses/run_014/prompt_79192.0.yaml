prompt: |-
  I would like a name for a pattern I keep meeting in arguments, or, failing a name, a careful account of what the pattern is and whether the argument at its centre is sound.

  The pattern concerns acts of a certain shape: worth doing if a few people do them, harmful if many do. Suppose several people are each in a position to do such an act. None can observe what the others choose; all have the same information; each knows this about the others. The argument I keep encountering runs roughly as follows: if it were right for me to do this, it would be equally right for everyone else here to do it; if everyone did it, the result would be bad; therefore it is not right for me to do it. Two settings in which I have watched this happen:

  - A group of seminar participants, every one of whom wants the visiting speaker to slow down and explain a step, and not one of whom asks, each reasoning that if the request were in order for them it would be in order for the other twenty, and that twenty interruptions would destroy the session. Nobody asks, and nobody follows the argument.
  - Members of a committee, several of whom think a decision should be reopened. Each declines to raise it, on the ground that if the grounds for reopening were good they would be good for every member, and that a committee which reopens its decisions whenever any member objects never finishes its business. The decision stands.

  What strikes me is that this is not a case of overlooking the aggregate; the agents are reasoning from it. Nor is anyone hoping to be spared an effort: each would act if they were the only person in the position. Yet the upshot is that the situation in which the act ought to be done by a few is precisely the situation in which it is done by nobody, and no one can make themselves the exception without either exempting themselves from a test they apply to others or breaking a symmetry nobody is entitled to break. There seems to be no individual mistake anywhere in the structure: each agent's conclusion is defensible given the others' conclusions, and theirs given his.

  Does this have an established name? The nearest things I know are the bystander effect, the free-rider problem, and what is sometimes called the unilateralist's curse, but none of them seems to be the same thing. The first two concern a good that somebody must supply, and the agent's expectation that somebody else will supply it; here nobody expects to be spared, and what is at issue is a level of activity rather than a shared good. The unilateralist's curse runs in the opposite direction: it concerns many agents acting on private and noisy estimates of whether an act is worth doing, and it predicts too much action rather than too little.

  I am also unsure how far the central argument is valid, since it appears to treat a permission as though it had to hold universally, in a case whose whole point is that the permission is exercised by a few. If there is an established term, please say what exactly it names — the type of situation, the move in argument, or the outcome — and how it differs from the concepts above. If there is none, please coin one, define it, and mark its edges: whether it covers cases in which the harm comes from a sum of tiny contributions rather than from a threshold; whether it survives if the participants can take turns or draw lots; and whether the same structure appears wherever a permission must be stated in general terms rather than case by case.
reasoning: |-
  Okay, the user presents a fascinating problem about a recurring pattern in collective decision-making where individual actions that would be beneficial if done by a few become harmful if done by many. They've encountered this in seminar groups and committees, where everyone refrains from acting because they reason that if it's right for them, it should be right for everyone, and universal action would be detrimental. 

  The user has clearly thought deeply about this, distinguishing it from similar concepts like the bystander effect or free-rider problem. Their core concern is whether this reasoning is logically sound and if there's an established term for it. I notice they're particularly troubled by the symmetry of the situation—how each individual's defensible reasoning leads to a collectively suboptimal outcome where no one acts.

  Hmm... this reminds me of Kant's universalizability principle but applied in a way that backfires. The argument hinges on treating a conditional permission ("I may do X") as requiring universal applicability ("all may do X"), which collapses in threshold situations. 

  The user's examples are perfect illustrations: seminar interruptions and committee reopenings both require a "Goldilocks zone" of participation—enough to be effective but not so much as to be destructive. The tragedy is that individual reasoning can't navigate this zone when coordination is impossible.

  I recall Derek Parfit's discussions of "mistakes in moral mathematics" where individually rational choices lead to collective disaster. His "mistake" M might apply here—misapplying a principle suitable for single-agent cases to multi-agent thresholds. But "Parfit's Mistake" feels too obscure for general use.

  "Collective Action Paradox" captures the core tension but is too broad. "Threshold Dilemma" emphasizes the critical mass aspect but misses the symmetry. "Symmetry Trap" seems best—it highlights how identical reasoning ensnares all participants equally. 

  The user also asks important boundary questions: Does this apply to gradual harms (like pollution)? What if participants coordinate via lotteries? The symmetry breaks with coordination mechanisms, but the core problem persists whenever individuals must decide without knowing others' choices. And yes, the problem vanishes if permissions can be particularized ("only three may speak"), but such specificity is often impractical.

  Ultimately, the argument isn't logically sound because it conflates two different questions: "Would it be good if everyone did this?" (counterfactual) and "Is it permissible for me to do this given that not everyone will?" (actual). The agents are making what Parfit would call a "mistake in moral mathematics."
answer: |-
  This pattern is a fascinating and under-discussed collective reasoning failure. While it lacks a universally established name, it's most precisely described as the **Symmetry Trap** or **Parfit's Mistake M** (after Derek Parfit). Here's a breakdown:

  ### Core Pattern: The Symmetry Trap
  1.  **The Act:** An action that is:
      *   **Beneficial if performed by a small number:** Provides a localized good or prevents a localized harm.
      *   **Harmful if performed by a large number:** Causes a significant negative aggregate effect (often by overwhelming a system, creating chaos, or undermining a norm).
  2.  **The Situation:** Multiple identical agents face the choice simultaneously. They lack coordination (no communication, observation, or pre-agreed mechanism). Each agent is identical in knowledge, motivation, and reasoning capacity. Each knows this symmetry exists.
  3.  **The Flawed Argument (The Symmetry Trap):**
      *   Premise 1: If it is *permissible* (or "right") for *me* to do X, then, given our symmetry, it must be permissible for *everyone* to do X.
      *   Premise 2: If *everyone* does X, the outcome is *bad* (net harm).
      *   Conclusion: Therefore, it is *not* permissible for *me* to do X.
  4.  **The Outcome:** No one acts. The beneficial small-scale action is never performed, precisely because the condition that *would* make it beneficial (only a few doing it) is the same condition that triggers the reasoning trap preventing anyone from acting. The collectively optimal outcome (a few act) is unattainable.

  ### Why the Central Argument is Unsound
  The argument commits a crucial error: **conflating a conditional collective permission with an individual permission under actual circumstances.**

  *   **The Flaw in Premise 1:** "If it is permissible for me to do X, it must be permissible for everyone to do X" is only necessarily true if the permissibility *depends solely on factors identical to all agents*. However, in this scenario, the permissibility *crucially depends on the number of agents who actually perform the action*, which is unknown to each agent.
  *   **The Counterfactual Fallacy:** The argument evaluates the permissibility of *my* action based on a *counterfactual world* where *everyone* acts identically. But the *actual world* is one where most agents will *not* act (as each reasons identically). The relevant question is: "Given that most others *won't* act (as I am reasoning), is it permissible *for me* to act?" The argument fails to ask this actual-world question.
  *   **Ignoring Expected Value:** A sound individual decision should consider the *expected* outcome of *my* action. Given symmetry, each agent knows that *if* it would be beneficial for one person to act, it would be beneficial for a small number to act. Crucially, they also know that *if* everyone reasons as they do, *no one* will act. Therefore, the expected number of others acting is very low. Acting has a high probability of contributing to the good small-number outcome and a very low probability of being the "straw that breaks the camel's back" causing the harmful many-number outcome. The reasoning ignores this probability assessment.

  ### Distinguishing from Similar Concepts
  *   **Bystander Effect:** Focuses on *diffusion of responsibility* and *pluralistic ignorance* ("surely someone else will help/ask"). Agents *expect* others to act. In the Symmetry Trap, agents *expect* others *not* to act (because they reason identically).
  *   **Free-Rider Problem:** Concerns under-provision of a *public good* due to incentives to let others pay the cost. Agents *prefer* not to act if others do. In the Symmetry Trap, agents *would* act if they were the only one, and the issue isn't a standard public good but an activity with negative externalities at scale.
  *   **Unilateralist's Curse:** As you note, involves noisy *private information* leading to *over*-action because each overly-optimistic agent acts independently. The Symmetry Trap involves *common knowledge* and *identical reasoning* leading to *under*-action.

  ### Boundaries and Nuances (Marking the Edges)
  1.  **Sum of Tiny Contributions (e.g., Pollution):** Yes, it fits. Each reasons: "If my tiny emission is permissible, everyone's must be; universal emission is catastrophic; therefore my emission is impermissible." The flaw is the same: the permissibility depends on the *aggregate*, not the universalizability of the isolated act. The harm threshold is crossed by the sum, not by any one act.
  2.  **Taking Turns / Drawing Lots:** This *breaks the symmetry* and resolves the trap.
      *   **Turns:** Creates an asymmetry (it's *my* turn to ask). The permission is now conditional on the turn-taking rule, not universalizability.
      *   **Lots:** Creates a known, small subset permitted to act (the "winners"). Permission is explicitly limited, defeating Premise 1 ("If I may act, everyone may"). Agents know *only* the winners should act. This transforms the problem into coordination.
      *   **The Trap persists only if coordination mechanisms are unavailable or forbidden.**
  3.  **General Permissions vs. Case-by-Case:** The trap arises *specifically* when:
      *   A permission *must* be stated generally ("Anyone may request clarification").
      *   But the *effectiveness/permissibility* of exercising that permission depends critically on the *number* who exercise it.
      *   Agents lack the information or authority to make case-by-case judgments based on likely aggregate uptake ("I think only 2 others will ask, so I will too" is impossible without coordination).

  ### Proposed Name: The Symmetry Trap
  *   **What it Names:** The *type of situation* (multiple symmetric agents facing a threshold-dependent action without coordination) and the specific *flawed reasoning pattern* (conflating conditional universal permission with actual individual permission under symmetry).
  *   **Why it Fits:**
      *   **Symmetry:** The core driver is the identical position and reasoning of the agents.
      *   **Trap:** The reasoning feels individually defensible but leads to a collectively (and often individually) suboptimal outcome. Agents are "trapped" by the logic of symmetry.

  ### Conclusion
  The Symmetry Trap is a robust pattern where individually rational (but logically flawed) reasoning based on symmetry and universalizability prevents collectively beneficial limited action. The central argument is unsound because it bases the permissibility of an individual act on the consequences of a counterfactual universal action, ignoring the actual low probability of universal action and the expected benefit of limited action. It highlights the limitations of purely individualistic reasoning in interdependent, threshold-dependent scenarios lacking coordination mechanisms. The term "Symmetry Trap" effectively captures its essence.
