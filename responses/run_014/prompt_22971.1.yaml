prompt: |-
  i'm writing a novel set in 1956 oxford and i keep running into elizabeth anscombe's little pamphlet against truman's honorary degree and i want to get her actual argument right instead of the "consequentialism is bad" version people usually repeat. can you walk me through the distinction she draws between choosing to kill the innocent as a means to your ends versus knowing as a matter of statistical certainty that your action will kill them, and then apply it to her case against truman? the part i'm stuck on is that the justification she reports (the Allies' Potsdam "general principle" of using the new weapon they now possessed) is basically that they had the bomb and they could use it, which doesn't obviously slot into either side of her distinction. is there a move in her essay that's supposed to handle that, or is it a genuine gap, and if it's a gap, is it fixable with her own framework or does it show the means/side-effect line is doing less work than she wants?
reasoning: |-
  Okay, the user is writing a novel set in 1956 Oxford and keeps encountering Elizabeth Anscombe's pamphlet against Truman's honorary degree. They want to accurately represent her argument beyond the oversimplified "consequentialism is bad" version. Specifically, they're confused about her distinction between intentionally killing innocents as a means versus foreseeably causing their deaths as a side effect, and how this applies to Truman's justification that they had the bomb and used it. The user is stuck on whether that justification fits into either side of Anscombe's framework or if it's a gap.

  First, I need to recall Anscombe's main arguments in "Mr. Truman's Degree." Her key point is the principle of double effect (PDE), which differentiates between intended means and foreseen side effects. She argues that directly targeting innocents is murder, even in war, whereas unintended deaths might be permissible under certain conditions. Truman's decision to drop the bomb on Hiroshima and Nagasaki involved directly intending civilian deaths as a means to end the war quickly, which Anscombe condemns as murder.

  The user is confused because Truman's justification—having the bomb and using it—doesn't neatly fit into either category. Anscombe addresses this by pointing out that the Potsdam Declaration's "general principle" essentially reduces to using weapons because they exist, which lacks a morally relevant difference. She argues that this justification doesn't engage with the moral distinction she emphasizes, making it a form of practical syllogism that ignores the means/side-effect line.

  The user wonders if this is a gap in Anscombe's argument. From her perspective, it's not a gap but a deliberate refusal to provide a justification that meets her criteria. Truman's reasoning bypasses the necessary moral deliberation, treating the bomb's use as a foregone conclusion. Anscombe would say that without addressing whether the civilian deaths were intended or merely foreseen, the justification is invalid. Her framework requires that any permissible action must not intend evil, and Truman's decision fails this test because the civilian destruction was part of the plan to coerce surrender.

  The user's deeper need might be to accurately portray Anscombe's argument in their novel, avoiding common misconceptions. They might also want to explore whether her ethical framework holds up under scrutiny, especially regarding historical decisions like Truman's. By clarifying how Anscombe handles the Potsdam justification, the novel can present a nuanced view of the ethical debate, enriching the historical context of 1956 Oxford. Ensuring this accuracy adds depth to the narrative and characters, possibly reflecting the intellectual tensions of the time.
answer: |-
  You're absolutely right to focus on this nuance – the "they had the bomb and used it" justification is central to Anscombe's outrage and a key test for her means/side-effect distinction (often called the Principle of Double Effect, PDE). Let's break down her argument and see how she handles this.

  1.  **Anscombe's Core Distinction (PDE Simplified):**
      *   **Intending Evil as a *Means*:** This is absolutely forbidden. You cannot morally choose to do something evil *in order to* achieve your good end. (e.g., Killing an innocent person *in order to* scare others into surrendering).
      *   **Foreseeing Evil as a *Side-Effect*:** This *might* be permissible under strict conditions:
          *   The action itself is good or neutral.
          *   The *intention* is only the good effect (the bad effect isn't willed, either as an end or a means).
          *   The good effect is proportional to the bad effect (serious reason).
          *   There's no better way to achieve the good effect.

  2.  **Applying PDE to Truman / Hiroshima/Nagasaki:**
      *   **Anscombe's Primary Argument:** Truman (and the decision-makers) *intended* the deaths of civilians as the *means* to force Japan's surrender. The destruction of the cities and their inhabitants wasn't an unfortunate accident of targeting military installations; it *was* the mechanism of coercion. Therefore, it falls squarely into the "intending evil as a means" category – **murder**, forbidden absolutely.
      *   **Contrast with "Legitimate" Bombing (in her view):** Bombing a munitions factory knowing nearby civilians *might* die as a side-effect could potentially be justified under PDE *if* the target is genuinely military, the deaths aren't intended, and proportionality holds. The *intention* is to destroy the factory; civilian deaths are a foreseen but unwanted consequence.

  3.  **The "Potsdam Justification" Problem (They had it, so they used it):**
      This is where your confusion is spot-on. The justification reported ("the general principle... that a new weapon they now possessed would be used") seems to bypass *both* sides of her distinction. It doesn't claim:
      *   "We *intended* to kill civilians *as the means* to surrender." (Explicitly forbidden)
      *   Nor does it claim: "We *foresaw but did not intend* civilian deaths as a side-effect of destroying a legitimate military target." (Potentially permissible under PDE)

      **Anscombe's Move: Exposing the Vacuum & Begging the Question**

      Anscombe doesn't see this as a *gap* in her framework, but as the *core evasion* she's attacking. Her response is multi-pronged:

      *   **It Begs the Moral Question:** Saying "we used it because we had it" presupposes that *having* the weapon automatically makes *using* it (in *this specific way*) legitimate. Anscombe argues this is precisely what needs justification. It assumes the conclusion ("using it this way is okay") without providing the moral reasoning. It treats the bomb's use as a *technical* or *pragmatic* decision ("We possess capability X, therefore we use it") divorced from the *moral* question ("*Is* using capability X in this manner murder?").
      *   **It Ignores the Object of the Action:** The justification focuses solely on the *weapon* and the *actor's capability*, completely ignoring the *nature of the act* performed *with* the weapon – the direct, large-scale killing of non-combatants. Anscombe insists morality must judge the *act itself*.
      *   **It Implicitly Rejects the Means/Side-Effect Distinction:** By refusing to engage with *how* the bomb was used (intentional city-destruction vs. collateral damage) and treating its use as a monolithic "thing we did because we could," this justification implicitly dismisses the necessity of the distinction Anscombe is drawing. It collapses everything into a consequentialist "ends justify the means" or a sheerly pragmatic "might makes right."
      *   **It Highlights the Absence of Proportionality Reasoning:** Even consequentialists would weigh the *specific* costs and benefits. The Potsdam justification, as reported, doesn't even attempt this. It jumps straight from possession to deployment without the intervening moral calculus Anscombe demands (or any calculus at all, beyond "it will end the war").
      *   **Her Conclusion on the Justification:** She sees this not as a *justification* but as the *absence* of a morally serious justification. It reveals a mindset that simply doesn't recognize the fundamental moral prohibition against intentionally killing the innocent as a category. It's a *symptom* of the moral corruption she is decrying.

  4.  **Is it a Gap? Can it be Fixed within her Framework?**

      *   **Not a Gap in Her Framework:** Anscombe would argue her framework *exposes* the emptiness of this justification. PDE requires *specific moral reasoning* about the act's nature and intention. "We had it, so we used it" provides *zero* such reasoning. It fails to engage with the criteria PDE demands.
      *   **Fixable? Only by Rejecting the Justification or Reinterpreting the Act:** Within her framework, the *only* way to salvage the Potsdam justification would be to fundamentally reinterpret the act it describes:
          *   **Option 1 (Reject):** The justification is morally bankrupt and confirms the act was murder. (This is her position).
          *   **Option 2 (Reinterpret - Unlikely/Contrived):** Argue that the "use" described wasn't *intentional city destruction*, but something else (e.g., a demonstration? targeting only military objectives within the city? - historically implausible). Or, argue that the "general principle" was a misstatement, and the *real* justification was consequentialist proportionality (saving lives by ending the war quickly), which she would still reject because it involved intending evil as a means.
      *   **Shows the Limits/Strength of the Distinction?** This reveals the *strength* of Anscombe's position from her perspective. Her distinction forces a clear question: *What exactly did you intend to do?* The Potsdam justification dodges this question entirely. It shows that the distinction *does real work* by making such evasions glaringly obvious and morally unacceptable. If someone refuses to specify whether they intended the civilian deaths or merely foresaw them, the distinction compels a judgment: this refusal itself suggests they know the intended nature of the act was problematic. It highlights that consequentialism often *avoids* specifying intention, focusing only on outcomes.

  **Key Takeaway for Your Novel:**

  Anscombe's fury stems from Truman's honour representing Oxford's tacit endorsement of an act she considers undeniable murder, based on a justification she sees as morally vacuous and evasive. The "had it, used it" line isn't a third category she fails to address; it's the *exemplar* of the moral evasion her entire pamphlet is designed to attack. It fails precisely because it *doesn't* slot into her distinction – it refuses to engage with the fundamental moral categories (intention, object of the act) that the distinction relies upon. For Anscombe, this refusal *is* the proof of the moral bankruptcy involved.

  **How to Portray It:**

  *   Have your character grappling with the starkness of Anscombe's distinction: "Did they *mean* to burn those children alive to scare the Emperor, or was it just an awful accident of bombing the factory district?"
  *   Show the character realizing that Truman's reported justification ("we had it, we used it") *avoids* answering that crucial question about intention.
  *   Highlight the character's frustration or shock that such a profound moral question could be dismissed with such a seemingly amoral, pragmatic shrug by those justifying the act and honouring the man.
  *   Emphasize that Anscombe isn't *just* against bad consequences; she's against a specific *kind of act* (intentional killing of innocents) that she believes the atomic bombings *were*, regardless of their consequences. The Potsdam justification confirms, for her, that the perpetrators either didn't understand this distinction or didn't care.

  This intellectual and moral rigor, applied to such a raw and recent historical event, is what made Anscombe's stand so powerful and controversial. Capturing this nuance will add significant depth to your Oxford setting.
