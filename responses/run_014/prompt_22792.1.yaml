  First, let's recall what each paradox is.

  The St. Petersburg paradox involves a game where a fair coin is flipped until it lands heads. If the first heads is on the nth flip, the payoff is \(2^n\). The probability of this happening is \((\frac{1}{2})^n = 2^{-n}\) for each n starting from 1. So the expected value is:

  \[
  E = \sum_{n=1}^{\infty} 2^n \cdot 2^{-n} = \sum_{n=1}^{\infty} 1 = \infty
  \]

  This diverges to infinity, meaning that according to expected value, one should be willing to pay any finite amount to play this game, which seems absurd because the probability of winning a large amount is very small.

  Now, the Pasadena paradox is similar, but the payoff is \((-1)^{n+1} 2^n\) with probability \(2^{-n}\). So for n=1, payoff is \((-1)^2 2^1 = 2\) with prob 1/2

  n=2, \((-1)^3 2^2 = -4\) with prob 1/4

  n=3, \((-1)^4 2^3 = 8\) with prob 1/8

  n=4, \((-1)^5 2^4 = -16\) with prob 1/16

  and so on.

  The expected value is:

  \[
  E = \sum_{n=1}^{\infty} (-1)^{n+1} 2^n \cdot 2^{-n} = \sum_{n=1}^{\infty} (-1)^{n+1} \cdot 1 = \sum_{n=1}^{\infty} (-1)^{n+1}
  \]

  This is the series: 1 - 1 + 1 - 1 + 1 - 1 + ... which is the Grandi series.

  The Grandi series doesn't converge; it oscillates and doesn't have a sum in the usual sense. So the expected value is undefined, not infinite.

  Now, the question is why the Pasadena paradox is more fundamental for expected utility theory.

