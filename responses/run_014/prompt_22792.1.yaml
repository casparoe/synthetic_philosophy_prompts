  The St. Petersburg paradox and the Pasadena paradox both challenge the foundations of expected utility theory, but the Pasadena paradox is more fundamental because it exposes a deeper issue: the expected value can be undefined, not merely infinite. This undermines the very applicability of expected utility theory in cases where the expectation does not exist, forcing a reevaluation of how we define and compute "fair prices" or make decisions under uncertainty.

  ### Why the Pasadena Paradox is More Fundamental for Expected Utility Theory
  - **St. Petersburg paradox**: The expected value diverges to infinity, meaning it is defined but infinite. This suggests that, under expected utility theory with linear utility, a rational agent should pay any finite price to play the game. The paradox arises because this seems unreasonable given the low probabilities of high payoffs. However, the expectation is at least well-defined (as +∞), so the issue is one of reconciling infinite expectations with real-world constraints.
    
  - **Pasadena paradox**: The expected value is the Grandi series (1 − 1 + 1 − 1 + ⋯), which does not converge and is therefore undefined. This means that expected utility theory, which relies on the existence of a finite or infinite expectation, cannot assign any value—finite or infinite—to the game. The paradox highlights a fundamental flaw: when the expectation is undefined, the core decision-theoretic tool (expected value maximization) fails entirely, making it impossible to apply standard expected utility theory without modification.

  The Pasadena paradox thus reveals a more basic problem: expected utility theory assumes that expectations exist, but in cases of oscillating or conditionally convergent series, this assumption is violated. This forces a broader reconsideration of how to handle expectations that are not absolutely convergent, whereas the St. Petersburg paradox only addresses the issue of unbounded utility.

  ### Why Standard Responses to St. Petersburg Do Not Carry Over Straightforwardly
  Standard responses to the St. Petersburg paradox aim to resolve the infinity issue but fail for the Pasadena paradox because the expectation is undefined, not infinite.

  1. **Bounding utility**:
     - In St. Petersburg: Assuming a bounded utility function (e.g., logarithmic or capped utility) makes the expected utility finite and well-defined. For example, with utility \(u(x) = \log(x)\), the expected utility converges.
     - In Pasadena: Bounding utility resolves the issue if applied, but the paradox is often presented with linear utility (monetary payoffs), where the expectation remains undefined. Even with bounded utility, the conditional convergence problem persists: the series \(\sum (-1)^{n+1} u(2^n) \cdot 2^{-n}\) may converge only conditionally (not absolutely), meaning its value can depend on the order of summation. This reordering sensitivity is problematic for decision theory, as the "natural" ordering (by \(n\)) is arbitrary. With bounded utility, absolute convergence often holds (since \(|u(x)|\) is bounded and \(\sum 2^{-n}\) converges), yielding a finite expectation. However, the paradox emphasizes that linear utility—the default in many economic models—leads to an undefined expectation, which bounding utility avoids but does not directly address.

  2. **Invoking finite wealth**:
     - In St. Petersburg: Capping payoffs at a maximum achievable amount (e.g., due to finite wealth) makes the expected value finite. For example, if wealth caps payoffs at \(2^K\), the expectation becomes \(\sum_{n=1}^K 2^n \cdot 2^{-n} = K\), which is finite.
     - In Pasadena: A finite cap on \(n\) (e.g., at \(N\)) results in an expected value of \(\sum_{n=1}^N (-1)^{n+1}\), which oscillates between 0 and 1 depending on whether \(N\) is even or odd. This oscillation means there is no single finite value, and the expectation depends arbitrarily on the choice of cap. Unlike St. Petersburg, where a cap yields a stable, increasing value, the Pasadena game's capped expectation is inconsistent and context-dependent, failing to provide a unique "fair price."

  3. **Switching to a different decision rule**:
     - In St. Petersburg: Alternative rules like maximizing median utility or minimizing regret can yield finite prices (e.g., a small entry fee based on likely outcomes), avoiding the infinity issue.
     - In Pasadena: The undefined expectation means no decision rule based solely on expectation can be applied directly. For instance:
       - **Median-based rules**: The median payoff is undefined or misleading because the payoffs oscillate and no single outcome is typical.
       - **Regret-based rules**: These may not resolve the issue, as the lack of a reference expectation makes regret difficult to define.
       - **Other rules**: E.g., the principle of insufficient reason or maximin fail because the Pasadena game has no clear "worst case" (payoffs can be arbitrarily large positive or negative), and probabilities are symmetric but not informative.

  The key takeaway is that the St. Petersburg responses work by taming infinity into a finite or manageable value, but the Pasadena paradox involves a deeper pathology—nonexistence—which these responses do not address. Resolving Pasadena requires methods that can assign meaning to undefined expectations, such as generalized summation or structural properties.

  ### Can a Generalized 'Fair Price' for the Pasadena Game Be Defended?
  Yes, generalized summation methods like Cesàro or Abel summation, or grouping outcomes, can yield a "fair price" of \(\frac{1}{2}\) for the Pasadena game. This price can be defended as reasonable under specific interpretations, though it is not universally accepted as "correct" because expected utility theory traditionally requires convergence.

  - **Cesàro summation**: This method averages the partial sums of the series. For the Grandi series:
    - Partial sums: \(S_1 = 1\), \(S_2 = 0\), \(S_3 = 1\), \(S_4 = 0\), ...
    - Average of first \(N\) sums: If \(N\) is odd, \(A_N = (N+1)/(2N)\); if even, \(A_N = \frac{1}{2}\).
    - As \(N \to \infty\), \(A_N \to \frac{1}{2}\), so the Cesàro sum is \(\frac{1}{2}\).

  - **Abel summation**: This uses the limit of power series: \(\sum (-1)^{n+1} r^n\) for \(r \to 1^-\).
    - The series \(\sum_{n=1}^{\infty} (-1)^{n+1} r^n = r / (1 + r)\) for \(|r| < 1\).
    - As \(r \to 1^-\), this approaches \(1/(1+1) = \frac{1}{2}\).

  - **Grouping outcomes**: Pairing terms or exploiting self-similarity:
    - Group the series as \((1 - 1) + (1 - 1) + \cdots = 0\), but this is arbitrary and ignores the game's structure.
    - Better: Use the recursive nature of the game. After the first flip:
      - With probability \(\frac{1}{2}\), heads: payoff \( +2 \).
      - With probability \(\frac{1}{2}\), tails: the game restarts with payoffs doubled and sign flipped (as derived below).
    - Let \(E\) be the expected value. Then:
      \[
      E = \frac{1}{2} \cdot 2 + \frac{1}{2} \cdot (-2E) = 1 - E
      \]
      Solving gives \(2E = 1\), so \(E = \frac{1}{2}\). This uses the self-similarity to justify \(\frac{1}{2}\) as a consistent fixed point.
    - Grouping into blocks with zero conditional expectation: For instance, the first two outcomes (n=1 and n=2) contribute \(\frac{1}{2} \cdot 2 + \frac{1}{4} \cdot (-4) = 0\) in expectation. Given no heads in two flips (prob. \(\frac{1}{4}\)), the subgame has expectation \(4E\), leading to \(E = 0 + \frac{1}{4} \cdot 4E\), which is consistent but indeterminate. Pairing all terms recursively supports \(E = \frac{1}{2}\).

  **Defending \(\frac{1}{2}\) as the fair price**:
  - **Reasonable under generalized frameworks**: \(\frac{1}{2}\) is the value obtained from multiple consistent methods (Cesàro, Abel, recursive grouping), making it a natural candidate. It reflects the "average" behavior of the oscillating series and is the only price invariant under the game's self-similarity.
  - **Decision-theoretic justification**: A risk-neutral agent might accept \(\frac{1}{2}\) as fair, as it is the Cesàro mean or the value from a "reset" approach. Experiments or behavioral studies could support this as intuitive.
  - **Criticisms**: Traditional expected utility theory rejects this because the expectation does not converge. \(\frac{1}{2}\) is not a "true" expectation but a summability-based value. It can be context-dependent—e.g., reordering terms can change the "sum," violating the law of large numbers.

  In conclusion, the Pasadena paradox is more fundamental as it exposes the undefined expectation problem, forcing extensions to expected utility theory. While \(\frac{1}{2}\) can be defended as a fair price via generalized summation or structural arguments, it remains controversial, highlighting the need for decision theories that handle non-convergent expectations, such as those incorporating summability methods or non-linear approaches.
