prompt: |-
  Earlier this year I joined a volunteer sponsorship circle in my town that raises funds, secures housing, and provides a year of practical support for one displaced family at a time, and the experience has left me puzzled by the assumptions built into our own procedures.

  Our circle follows two unwritten rules that we apply without much discussion. First, on eligibility: we will sponsor a family that has left its country to escape targeted political or religious persecution, but not a family in identical material destitution that remains displaced inside its own country by the same conflict, nor a family that has left its country because rising seas and ruined soil made farming and daily life impossible. For us, severe need alone does not seem sufficient, and movement alone does not seem sufficient; the combination of persecution and international border crossing does. Second, on allocation of responsibility: we describe our own reason to act as arising because we volunteered and happen to have spare housing, school places, and time, not because we caused the displacement or are geographically closest to it. At the same time, in town meetings we insist that the national government must admit its assigned quota of resettled people even where no local community has volunteered, on the grounds that otherwise burdens fall unfairly on frontline states and on willing towns like ours.

  I can see that we behave as if certain distinctions carry moral weight, but I cannot tell which distinctions our practice actually depends on, which it merely sits comfortably with, and whether our eligibility rule and our responsibility rule belong to a single coherent outlook.

  Could you lay out the understandings of belonging, need, and obligation that would make sense of what we do, distinguish what our practice logically needs from what it is merely consistent with, note where our practice leaves the underlying view open between rivals, and explain what would have to change in eligibility or in assignment of duties if we moved to a purely need-based or purely capacity-based outlook instead.

  Please structure your response in the following four sections in order, keeping roughly to the suggested lengths:

  1. Eligibility Logic, about 300 words: articulate the conception of who counts as deserving of resettlement through sponsorship that best renders our three-way distinction intelligible, and consider whether border crossing, persecution, or some further idea does the central work.

  2. Responsibility Logic, about 300 words: articulate the conception of who must take people in that best renders our combination of volunteer-based local duty and quota-based national duty intelligible, and consider how voluntariness, capacity, proximity, causation, and fairness among hosts figure in it.

  3. Required Versus Merely Compatible, about 250 words: for each rule, separate what must be true for the rule to be justified from other views that could also accommodate it, and identify points where our practice is philosophically underdetermined.

  4. Coherence and What Revision Would Entail, about 250 words: assess whether the two rules hang together or pull in different directions, and describe concretely how our sponsorship criteria and our claims about government quotas would have to be revised if we adopted a consistent need-centered or capacity-centered alternative.
reasoning: |-
  Hmm, the user is describing their experience in a volunteer sponsorship circle and questioning the underlying assumptions of their procedures. They've outlined two unwritten rules about eligibility and responsibility that seem inconsistent to them. 

  First, on eligibility: they only help families who crossed international borders due to persecution, excluding those displaced internally or by climate change. Second, on responsibility: they act based on volunteering and capacity, yet demand government quotas to share burdens fairly. 

  The user is philosophically sophisticated - they recognize moral distinctions at play but can't pinpoint which are essential versus incidental. They want to understand the logical foundations of their group's practices, where those foundations might be shaky, and what alternatives would look like. 

  Breaking this down: For eligibility, the key seems to be persecution + border crossing. But why is border crossing morally significant? It might imply abandonment by one's state, making victims "international orphans." Persecution suggests intentional harm by humans rather than "natural" disasters. Climate-displaced people don't fit because their home state might still protect them (in theory) and their suffering lacks a persecutor. 

  For responsibility, the group uses capacity + consent for themselves but fairness + causation for governments. When they demand national quotas, they're essentially saying the state has obligations they as individuals don't - either because it represents all citizens (fairness) or because wealthy nations contribute to global harms (causation). 

  The tension between the two rules is revealing. Eligibility focuses on special categories of victims, while responsibility appeals to universal fairness. If they switched to pure need-based eligibility, they'd have to sponsor climate refugees too. If they embraced pure capacity-based responsibility, they couldn't demand government quotas - only voluntary action. 

  This user is doing exactly the right thing: questioning whether their compassion aligns with their principles. The group's rules might stem from practical constraints (funding sources? legal definitions?) but they're dressed in moral language that doesn't quite hold up under scrutiny. What an excellent case study in applied ethics!
answer: |-
  Here is an analysis structured as requested, dissecting the assumptions and logic within your sponsorship circle's practices:

  ### 1. Eligibility Logic (~300 words)
  Your eligibility rule hinges on a **Persecution + Sovereign Abandonment** conception of deservingness. The core work is done by **persecution** – understood as *intentional, identity-based harm inflicted by human agents (usually state or quasi-state actors)* – combined with the *failure of the home state to provide protection*. Crossing an international border is not morally significant in itself but serves as the clearest *evidence* that the victim has been rendered effectively stateless, abandoned by their sovereign protector. This distinguishes them from:
  *   **Internally Displaced Persons (IDPs):** They suffer identical persecution/material need but remain *within* the state's nominal jurisdiction. The assumption is the state *could* (even if it doesn't) fulfill its duty to protect them, or the international community can pressure it to do so internally. Their suffering hasn't severed the state-citizen bond.
  *   **Climate/Environmental Displacees:** Their need, while severe and human-caused in origin, lacks the element of *intentional targeting* by identifiable agents. Crucially, the home state isn't *actively persecuting* them; it may be unable or unwilling to protect them from environmental harm, but this is seen as a failure of capacity or governance (closer to neglect or poverty) rather than active abandonment or attack. The state-citizen relationship, though strained, isn't defined by the state being the perpetrator.

  **Border crossing** is a practical indicator of this sovereign abandonment, not the core moral trigger. Mere movement isn't sufficient (as IDPs move internally); it's movement *necessitated by persecution* that signals the rupture. Severe need alone is insufficient because it doesn't imply this specific moral injury – being actively cast out by the entity meant to protect you. The moral desert arises from being a victim of *injustice* (targeted persecution) compounded by the *failure of the primary duty-bearer* (the home state), creating a unique category of "international orphans."

  ### 2. Responsibility Logic (~300 words)
  Your responsibility rule reflects a hybrid **Voluntary Beneficence + Systemic Fairness** model, separating local and national duties:
  *   **Local Level (Your Circle):** Your duty arises purely from **voluntary commitment** ("we volunteered") and **immediately available capacity** ("spare housing, school places, and time"). This explicitly rejects **proximity** (you're not geographically closest), **causation** (you didn't cause the displacement), and any inherent duty based solely on capacity. Your action is framed as supererogatory charity, not obligatory justice. Voluntariness is key to legitimizing your *specific* group's action.
  *   **National Level (Government Quota):** Here, the duty shifts to **fairness in burden-sharing**. You insist the government *must* act because:
      *   **Unfair Burden on Frontline States:** Proximity *does* create an initial, often overwhelming burden for states bordering crises. Fairness demands this burden be distributed.
      *   **Moral Hazard/Free Riding:** Without quotas, unwilling communities could free-ride on the efforts of willing ones like yours. The system would be unsustainable and unjust.
      *   **Collective Responsibility:** The national government represents the collective capacity and, arguably, bears some **causation** via foreign policy, climate contributions (implied, though not explicit in your rule), or simply by benefiting from a stable international order. Its capacity is vast and systemic.

  **Capacity** is present at both levels but framed differently: locally, it's the *trigger* for voluntary action; nationally, it's the *basis* for an enforceable obligation to ensure fairness. **Proximity** is explicitly rejected locally but implicitly recognized nationally as creating an initial unfairness that needs correction. **Causation** remains largely absent locally but may subtly inform the national fairness argument.

  ### 3. Required Versus Merely Compatible (~250 words)
  *   **Eligibility Rule:**
      *   **Required:** The core justification *requires* that persecution (intentional, identity-based harm by agents) creating a rupture in state protection (signaled by border crossing) confers a *special moral status* distinct from need caused by neglect, poverty, or environmental disaster. The state must be the persecutor or complicit in the persecution leading to flight.
      *   **Merely Compatible/Underdetermined:** The rule is *compatible* with, but does not *require*:
          *   A belief that persecution victims are inherently more "deserving" than other refugees.
          *   A strict legalist view recognizing only Convention refugees (though it aligns closely).
          *   The *degree* to which non-persecution displacement (like climate change) might *also* create a duty if it reaches catastrophic levels or involves state abandonment – your rule leaves this open.
  *   **Responsibility Rule:**
      *   **Required:** The justification *requires* a strict separation: local action *must* be voluntary and grounded in specific, offered capacity to be legitimate, rejecting inherent duties based on proximity/causation. Conversely, national action *must* be obligatory and grounded in fairness to prevent free-riding and distribute burdens equitably, implicitly relying on the state's unique role and capacity.
      *   **Merely Compatible/Underdetermined:** The rule is *compatible* with, but does not *require*:
          *   A libertarian view minimizing state duties generally (your quota demand contradicts this).
          *   A strong view on national causation (your argument works on fairness alone).
          *   *How* fairness is determined (equal per capita, GDP-based, historical responsibility?) – your practice is underdetermined here.
          *   Whether communities *with* capacity but who *don't* volunteer have a moral failing – your rule focuses on your own voluntariness, not blaming others.

  ### 4. Coherence and What Revision Would Entail (~250 words)
  **Coherence:** The two rules pull in slightly different directions, creating a tension rather than perfect coherence.
  *   **Eligibility:** Focuses on a *specific moral injury* (persecution/abandonment) creating desert.
  *   **Responsibility (Local):** Focuses on *voluntariness and specific capacity*, rejecting broader duties.
  *   **Responsibility (National):** Invokes *systemic fairness and collective obligation*, independent of direct causation.
  The national responsibility argument, grounded in fairness and capacity, *could* logically extend to supporting those excluded by your narrow eligibility criteria (e.g., climate refugees, if burdens are unfair). Your local eligibility criteria, however, actively resist this broader duty. The coherence lies only in the *practical separation* of local voluntarism and national obligation; the *underlying moral principles* (specific injury vs. systemic fairness/capacity) are distinct.

  **Revision Implications:**
  *   **Consistent Need-Centered Outlook:**
      *   **Eligibility:** Severity of need becomes primary. Persecution, climate disaster, famine, or war causing identical material destitution/crisis would qualify equally. Border crossing loses significance; IDPs facing equivalent existential threat would become eligible. Your rule would need fundamental revision to prioritize need assessment over persecution/border criteria.
      *   **Responsibility:** Voluntariness remains locally, but the *national quota argument strengthens significantly*. The government's obligation to ensure fair burden-sharing for *all* refugees facing severe need, regardless of origin cause, becomes paramount. You might even argue for *larger* quotas based on global need assessments.
  *   **Consistent Capacity-Centered Outlook:**
      *   **Eligibility:** Could remain narrow (if capacity is limited), *or* broaden (if capacity exists). The *reason* for displacement is secondary; capacity dictates who you *can* help.
      *   **Responsibility:** **Radical change locally and nationally.** Locally, voluntariness remains key, but the argument for *national government quotas collapses*. If duty arises *only* from capacity + voluntariness, demanding unwilling communities (via government quotas) take people in violates this principle. The government could *facilitate* voluntary action (e.g., matching willing sponsors with refugees) but could not *mandate* intake quotas on unwilling towns. Your insistence on government quotas would be inconsistent. Fairness arguments based on burden-sharing would lose their obligatory force.
