answer: |-
  You've put your finger on the core philosophical tension in modern space law. The current regime *is* built on conflicting theoretical foundations, and its coherence relies heavily on legal semantics and political expediency rather than deep philosophical consistency. Let's break it down:

  **The Implicit (and Conflicting) Theories of Property & Justice:**

  1.  **The "Province of All Mankind" (OST):** This implies a **Common Heritage Principle (CHP) Lite**.
      *   **Collective Non-Ownership:** Space and celestial bodies *themselves* cannot be sovereign territory or private property. They belong to no one (state or individual) and therefore, in a sense, to everyone.
      *   **Benefit Sharing Aspiration:** Use should benefit humanity broadly, not just the capable few. This suggests principles of distributive justice – potentially egalitarian or needs-based.
      *   **Prevention of Monopoly/Exclusion:** The core fear was a repeat of terrestrial colonialism and conflict over territory. National appropriation bans aim to prevent this.

  2.  **The Extraction Regime (CSLCA, Artemis Accords, Luxembourg Law):** This relies on a **Modified Lockean Labor Theory of Acquisition**.
      *   **Appropriation through Labor & Investment:** The resources themselves are considered *res nullius* (unowned things) until someone invests labor, technology, and capital into finding, extracting, and retrieving them.
      *   **Private Ownership of Extracted Resources:** The act of extraction transforms the resource into private property, owned by the entity that performed the extraction. The "fishing in international waters" analogy is central here – you don't own the ocean, but you own the fish you catch.
      *   **First-Come-First-Served Justice:** Justice is procedural: if you follow the rules (non-appropriation of territory, peaceful purposes, authorization/supervision per Article VI OST), you deserve the fruits of your labor and risk. This prioritizes efficiency, incentive, and libertarian notions of desert over egalitarian distribution.

  **Is it Coherent? Mostly a Fudge:**

  *   **Semantic Distinction Saves Legality:** The legal distinction between *sovereignty/territory* (forbidden) and *extracted resources* (permitted) is clever lawyering. It technically complies with the letter of the OST by avoiding claims over the *celestial body itself*. This allows exploitation without *formal* national appropriation.
  *   **Philosophical Incoherence:** The fudge lies in the spirit. The OST's "province of all mankind" clearly intended *some* form of collective benefit and prevention of monopolistic exploitation. The extraction regime, however:
      *   **Ignores the Value of the "Commons":** It treats space resources as utterly valueless until extracted, ignoring that their *existence and location* within the common domain have inherent potential value belonging to humanity.
      *   **Confuses Access with Appropriation:** Granting exclusive rights to extract specific resources from a specific location for commercial gain *functionally appropriates* that resource deposit, even if the legal title to the rock isn't claimed. It excludes others from that specific economic opportunity.
      *   **Prioritizes Incentive over Equity:** The Lockean argument ("we labored, we deserve it") justifies private ownership *after* extraction but doesn't address whether the *opportunity* to extract should be exclusive and unencumbered by obligations to the "mankind" whose common heritage it is.
  *   **Power Dynamics:** The regime reflects the reality that the states capable of enabling extraction (US, Luxembourg, signatories to Artemis Accords) are writing the rules in their favor, leveraging the ambiguity of the OST. The "all mankind" rhetoric remains, but the operational rules favor those with the capability to act.

  **Taking "Common Heritage" Seriously: Egalitarian Alternatives**

  If you genuinely embraced the CHP (like the Moon Agreement attempted, but failed), the space resource regime would look radically different. The core principle: **Resources are a common heritage; therefore, exploitation must be managed for the benefit of all humanity, with special regard for developing countries.** This implies:

  1.  **An International Management Authority:** A UN body or new international organization would regulate *all* resource extraction activities.
  2.  **No Unilateral Extraction Rights:** Companies couldn't just launch and dig under national law. They would need licenses/permission from the international authority.
  3.  **Mandatory Benefit-Sharing Mechanisms:**
      *   **Global Tax/Revenue Sharing:** A significant percentage of profits or the value of extracted resources flows into an international fund.
      *   **Distribution:** The fund could be distributed:
          *   **Per Capita:** Directly to individuals globally (logistically complex).
          *   **Via States:** Proportionally to UN members, weighted by population/need.
          *   **Global Public Goods:** Funding global projects (climate change mitigation, pandemics, sustainable development, space science for all).
      *   **Technology Transfer:** Mandatory sharing of extraction/enabling technologies with developing nations.
      *   **Preferential Access:** Reserving specific resource deposits or quotas for exploitation by developing nations or an international consortium.
  4.  **Preventing Monopoly:** Strict rules to prevent any single entity (state or corporation) from dominating access to critical resources.
  5.  **Environmental/Sustainability Oversight:** Strong international environmental regulations for extraction.

  **Could Locke and Common Heritage Cohere? A Possible (But Unlikely) Synthesis:**

  It's theoretically *possible*, but requires significant concessions from the Lockean/extraction side:

  1.  **Recognition of the Commons Value:** Acknowledge that the *opportunity* to extract derives from humanity's common heritage, not just private effort.
  2.  **Payment for Access:** Companies pay substantial fees or royalties *upfront* to an international body for the *right* to extract, recognizing they are utilizing a common resource. This fee isn't just for regulation, but for the *value of the resource in situ*.
  3.  **Robust Benefit-Sharing:** A significant portion of the proceeds (beyond the access fee) flows into the global fund, ensuring tangible benefits for non-participating nations.
  4.  **Strong International Governance:** An effective body manages access, sets fees, enforces benefit-sharing, and ensures environmental protection.

  However, this synthesis requires a level of international cooperation, surrender of unilateral advantage, and acceptance of redistributive justice that major spacefaring nations currently reject. The Artemis Accords explicitly reject the CHP model.

  **Conclusion:**

  The current regime presupposes a **pragmatic but philosophically unstable compromise**. It leans heavily on a Lockean justification for extraction, papering over the "common heritage" aspirations of the OST with a narrow legalistic distinction. It *is* largely a fudge – high-minded universalism masking a reality of first-come-first-served exploitation by capable actors. Taking "common heritage" seriously would necessitate a fundamental shift towards an international regulatory body with strong powers, mandatory benefit-sharing (taxes, funds, tech transfer), and a focus on equitable distribution, moving decisively away from the pure "finders keepers" model currently taking hold. The tension you perceive is real, and its resolution depends entirely on whether the international community can muster the political will to prioritize distributive justice over the immediate interests of space-capable nations and corporations. Your seminar sounds fascinating – this is the heart of the matter!
