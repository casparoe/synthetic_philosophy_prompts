prompt: |-
  I work on the governance tooling team at a prediction market platform, and clients keep asking us to "just do futarchy" — hand a policy decision to a prediction market — without understanding what that actually requires. We get about two of these requests a week, and the review has to be doable by an engineer who is not a philosopher in a single working day, with the market design lead signing off. Please turn futarchy into a concrete design procedure my team can run on a proposed policy question. In order, the procedure should specify: how to reformulate the question so the market is forecasting the right counterfactual — what would actually happen if the policy were adopted — rather than some untradeable value question; what counts as a sufficient resolution criterion (who adjudicates, on what evidence, and what happens if the outcome turns out to be ambiguous); what manipulation and verification checks to run before the market goes live; how to convert market prices into an actual decision, including what to do when related markets disagree; and at which step the procedure must stop and hand the decision to a human because the remaining question is one of values, not prediction. Then run the procedure on two proposals: a city council deciding whether to ban single-use plastic bags, and a university deciding whether to fund a ten-year basic research program. Respond in the style of an expert in market design and decision theory. Think very carefully before answering, and be explicit about which steps are judgment calls that no amount of market design can eliminate.
reasoning: |-
  We are designing a concrete procedure for implementing futarchy — using prediction markets to make policy decisions — for a governance tooling team. The goal is to transform a policy question into a prediction market setup that forecasts the counterfactual outcome of the policy. The procedure must be executable by an engineer in one day and signed off by a market design lead.

  The procedure will have the following steps:

  1. **Reformulate the Question:** Turn the policy question into a forecastable counterfactual.
  2. **Resolution Criterion:** Define how the outcome will be measured and adjudicated.
  3. **Manipulation and Verification Checks:** Ensure the market is robust before launch.
  4. **Decision Rule:** Convert market prices into a decision and handle disagreements.
  5. **Values vs. Predictions:** Identify when to stop and hand to humans.

  We'll now define the procedure step by step, then apply it to two examples.

  ---

  ### Step 1: Reformulate the Question

  **Goal:** Create a forecastable metric that captures the counterfactual effect of the policy.

  **Procedure:**
  - Identify the primary objective the policy aims to influence (e.g., GDP, carbon emissions, student satisfaction). This must be measurable and agreed upon as the goal.
  - Define a specific, quantitative metric (the "outcome metric") that can be observed after the policy is implemented (or not) and that reflects the objective.
  - Frame the market question as: "What will be the value of [outcome metric] at [specific future date] if the policy is implemented, compared to what it would have been without the policy?" However, note that we cannot observe both counterfactuals. Instead, we design two markets:
    - Market A: Forecasts the outcome metric at time T under the policy.
    - Market B: Forecasts the outcome metric at time T under the status quo (or a clearly defined alternative).

  But note: The counterfactual (what would happen without the policy) is not directly observable. Therefore, we must use a relative measure or a difference.

  **Alternative Approach (Recommended):**
  - Instead of two separate markets, we can have one market that forecasts the *difference* in the outcome metric between the policy and the counterfactual. However, this is more complex and may suffer from low liquidity.
  - A more practical approach is to have two markets and then compare the prices. But then we must account for the fact that the two markets might have different base levels.

  **Refined Approach:**
  - Define a clear baseline scenario (status quo) and a policy scenario.
  - Create two markets:
    - Market 1: Forecasts the outcome metric at time T under the baseline scenario.
    - Market 2: Forecasts the outcome metric at time T under the policy scenario.
  - The decision will be based on the comparison of the two market forecasts.

  **Critical Judgment Call:** Choosing the outcome metric. It must be:
    - Measurable: Quantifiable from data.
    - Unambiguous: Not subject to multiple interpretations.
    - Timely: Observable within a reasonable time frame.
    - Causal: The policy must be a major driver of changes in the metric.

  **If the metric cannot be defined:** Stop and flag that the policy question is too value-laden or the outcome is not measurable. Hand to humans.

  ---

  ### Step 2: Resolution Criterion

  **Goal:** Define how and when the outcome will be determined and by whom.

  **Procedure:**
  - **Who adjudicates?** Designate a trusted third party (e.g., a reputable data provider, a committee of experts) that is independent and has no stake in the policy outcome. The adjudicator must be specified in the market rules.
  - **What evidence?** Specify the exact data source and method of calculation for the outcome metric. For example, "The metric is the annual GDP growth rate for the city in 2025 as reported by the City Bureau of Statistics."
  - **Contingency for ambiguity:** Define a fallback. For example:
    - If the primary data source is unavailable, use a pre-specified secondary source.
    - If the outcome is not available by a certain date, the market resolves to a pre-defined default (e.g., the last traded price might be used, but that is controversial) or the market may be voided. However, voiding should be avoided because it undermines the purpose. Instead, design the metric to be available and unambiguous.

  **Resolution Criteria Must Include:**
  - The exact date of measurement (or time window).
  - The exact formula for the metric.
  - The data source and any adjustments (e.g., inflation adjustment).
  - The deadline for resolution (and any delays that might occur).

  **Critical Judgment Call:** Selecting the adjudicator and data source. There must be trust in the neutrality and reliability of the source. If no such source exists, the market cannot be run.

  ---

  ### Step 3: Manipulation and Verification Checks

  **Goal:** Ensure the market is robust and not easily manipulated.

  **Checks to Run Before Launch:**
  1. **Liquidity Check:** Estimate the potential liquidity. If the market is too thin, it may be manipulated. Use historical data on similar markets. If liquidity is expected to be low, consider subsidizing liquidity (e.g., with market maker bots) or not running the market.
  2. **Sensitivity Analysis:** Check if the outcome metric is sensitive to the policy. If the policy's effect is too small relative to noise, the market may not reflect the true effect. Use back-of-the-envelope calculations or existing studies.
  3. **Conflict of Interest Check:** Ensure that the parties with significant stakes in the policy do not have the ability to manipulate the metric or the market. For example, if the policy is about a company, and the company reports the metric, that's a conflict.
  4. **Market Structure Check:**
     - Use a market format that is resistant to manipulation (e.g., a continuous double auction or an automated market maker with sufficient depth).
     - Set trading limits if necessary to prevent a single actor from moving the price too much.
  5. **Verification of Data Feeds:** Ensure the data source for resolution is tamper-proof and reliable. If using an oracle, use a decentralized oracle with multiple sources.

  **If any check fails:** Either redesign the market (e.g., change the metric, change the resolution source) or abort and hand the decision to humans.

  ---

  ### Step 4: Decision Rule

  **Goal:** Convert the market prices into a policy decision.

  **Procedure:**
  - Let P_policy be the market price for the policy scenario (from Market 2) and P_baseline for the baseline scenario (from Market 1). Both prices are forecasts of the same outcome metric at the same future time T.
  - The decision rule: If P_policy > P_baseline (for a desirable metric like GDP) then adopt the policy. If the metric is one where lower is better (e.g., crime rate), then reverse the inequality.

  **Handling Disagreements:**
  - If the two markets are trading at significantly different volumes, the less liquid market may be less reliable. Use a threshold for liquidity (e.g., total volume traded) and if one market is below the threshold, disregard it.
  - If the markets disagree (P_policy is higher but the confidence is low), look at the bid-ask spreads. A wide spread indicates uncertainty. In such cases, the policy might be rejected due to uncertainty.
  - Alternatively, use a single market that directly trades the difference (e.g., a security that pays $1 if the policy scenario metric is higher than the baseline by at least X). However, this requires a more complex market and might have even lower liquidity.

  **Predefined Rule for Uncertainty:**
  - Set a confidence threshold. For example, only if the absolute difference between P_policy and P_baseline is greater than 2 standard errors (estimated from market volatility) do we consider the result decisive. Otherwise, the status quo prevails.

  **Critical Judgment Call:** The threshold for confidence. This is arbitrary and must be set in advance.

  ---

  ### Step 5: Values vs. Predictions

  **Goal:** Identify when to stop the procedure because the question is about values, not predictions.

  **Where to stop:**
  - In Step 1, if the outcome metric cannot be agreed upon because the goal is inherently subjective (e.g., "improve the quality of life" without a clear metric), then stop and hand to humans.
  - In Step 2, if the resolution criterion requires subjective judgment (e.g., "adjudicate based on expert opinion of aesthetic value"), then stop. The metric must be objective.

  **Rule of Thumb:** If the outcome metric is not a number from a verifiable source, then we are in the realm of values.

  ---

  ### Summary of the Procedure

  1. **Reformulate the Question:**
     - Define the outcome metric (measurable, unambiguous, timely, causal).
     - Set up two markets: baseline and policy scenario for the same metric at the same future time.

  2. **Resolution Criterion:**
     - Designate an adjudicator and specify the data source, calculation, and timeline.
     - Plan for ambiguity (fallback data source or voiding rules).

  3. **Manipulation and Verification Checks:**
     - Check liquidity, sensitivity, conflicts of interest, and data feeds.
     - Adjust or abort if checks fail.

  4. **Decision Rule:**
     - Compare the market prices (P_policy vs. P_baseline) with a predefined threshold for confidence.
     - Handle low liquidity or disagreement by predefined rules.

  5. **Values vs. Predictions:**
     - At any step, if the requirement for objectivity is not met, abort and hand to humans.

  ---

  ### Example 1: City Council Ban on Single-Use Plastic Bags

  **Policy Question:** Should the city ban single-use plastic bags?

  **Step 1: Reformulate the Question**
  - Objective: Reduce environmental impact (especially plastic waste) without causing undue economic harm.
  - Outcome Metric: We need a measurable proxy. Possible metrics:
    - Metric A: Tons of plastic waste collected in the city in the year after implementation (if the ban is implemented) vs. the same year without the ban. But note: without the ban, we don't have data for the counterfactual year. So we use two markets?
    - Alternative: Use the reduction in plastic waste relative to a baseline projection. However, projections are hard.

  **Refined Approach:**
  - Market 1 (Baseline): Forecasts tons of plastic waste in the city in 2025 (without the ban). This would require extrapolating current trends, but note that without the ban, the waste might change for other reasons. We are forecasting what actually happens without the ban in 2025.
  - Market 2 (Policy): Forecasts tons of plastic waste in the city in 2025 with the ban in place.

  But how do we get the counterfactual? We cannot observe both. The markets are forecasting two different worlds. The decision rule: if Market 2's forecast (policy) is less than Market 1's forecast (baseline) by a significant margin, then the ban is beneficial for reducing waste.

  However, the council might care about multiple outcomes (e.g., economic impact). We must either combine them into one metric (e.g., a weighted score) or run separate markets and then have a human decide the trade-off.

  **Judgment Call:** We choose one primary metric? Or we require multiple markets. For simplicity, the council must agree on one primary metric. Let's say they choose "tons of plastic waste in 2025".

  **Step 2: Resolution Criterion**
  - Adjudicator: City Waste Management Department's annual report.
  - Evidence: The total tons of plastic waste collected by the city in 2025 (or from January 1, 2025, to December 31, 2025). The data must be published by the department by June 30, 2026.
  - Ambiguity: If the report is delayed, extend the resolution deadline by 6 months. If still not available, use an alternative source (e.g., an independent audit commissioned by the council). If that fails, void the market and refund traders.

  **Step 3: Manipulation and Verification Checks**
  - Liquidity: The topic is of public interest, so liquidity might be adequate. We can seed the market with initial liquidity.
  - Sensitivity: The ban is expected to have a measurable effect (based on other cities). Check studies: e.g., a 50-80% reduction in plastic bag waste.
  - Conflict of Interest: The Waste Management Department is part of the city government which proposed the ban. This is a conflict. Solution: Use an independent auditor for the waste data? Or use data from a third-party environmental group? This is a problem. If we cannot resolve the conflict, we must abort.
  - Data Feed: Ensure the data is published in a tamper-proof way. Use a hash of the report published on a blockchain? Or multiple sources.

  **Step 4: Decision Rule**
  - Let W_baseline = price in Market 1 (forecasted tons without ban)
  - Let W_policy = price in Market 2 (forecasted tons with ban)
  - If W_policy < W_baseline - threshold (where threshold is set to account for uncertainty, e.g., 100 tons), then adopt the ban.

  But note: The council might care about other factors (like economic impact). We are only using one metric. This is a limitation. If the council wants to consider multiple outcomes, we need multiple markets and then a human to weigh them. In this case, we stop at Step 5 and hand the decision to humans because the trade-off between waste reduction and economic impact is a value judgment.

  **Step 5: Values vs. Predictions**
  - In this case, we are only forecasting one metric. The council must decide if reducing plastic waste is the only goal. If they also care about business impacts (e.g., on retailers), then we need a second metric (e.g., change in retail sales). But then we have two predictions and a value trade-off. Therefore, we must stop and let humans decide the trade-off.

  **Conclusion for Example 1:**
  We can run the market for plastic waste reduction. However, because the council likely has multiple objectives, we would need to run two markets (waste and retail sales) and then have the council decide the trade-off. Thus, the prediction market only informs one part. Alternatively, the council must pre-commit to a trade-off (e.g., via a scoring function). Without that, we cannot fully automate.

  ---

  ### Example 2: University Funding a Ten-Year Basic Research Program

  **Policy Question:** Should the university fund a ten-year basic research program in quantum computing?

  **Step 1: Reformulate the Question**
  - Objective: Enhance the university's reputation and contribute to scientific knowledge.
  - Outcome Metric: We need a measurable metric. Possibilities:
    - Number of high-impact publications (e.g., in top journals) in quantum computing from the university over the next 10 years? But 10 years is too long for a market.
    - Alternatively, use a proxy: the university's ranking in a specific field after 10 years? But rankings are subjective.

  **Practical Approach:** Because 10 years is too long, we might break it down. But that is complex. We might use an intermediate outcome. For example, after 5 years, we look at the number of publications and citations. However, the program is 10 years, so 5 years might be too early.

  **Refined Metric:** The total external research funding attracted by the quantum computing group in the first 5 years (as a proxy for success and reputation). This is measurable and timely.

  - Market 1 (Baseline): Forecasts the external funding for quantum computing research at the university in the next 5 years without the program.
  - Market 2 (Policy): Forecasts the external funding for quantum computing research at the university in the next 5 years with the program.

  **Judgment Call:** Is external funding a good proxy? It might be, because it reflects peer recognition and the ability to sustain the program.

  **Step 2: Resolution Criterion**
  - Adjudicator: University's Office of Research, which tracks grant funding.
  - Evidence: Total dollar amount of external grants awarded to the quantum computing research group (as defined by a list of faculty) from the start of the program until the end of year 5.
  - Ambiguity: If the office cannot provide the data, use the university's audited financial statements. If still not available, void the market.

  **Step 3: Manipulation and Verification Checks**
  - Liquidity: The market might be thin (only university insiders and academics). We might need to subsidize liquidity.
  - Sensitivity: The program is expected to attract more funding? We hope so, but it's uncertain. We can check with experts.
  - Conflict of Interest: The Office of Research might want the program to succeed. Use an independent auditor? Or pre-register the data.
  - Data Feed: The data should be verifiable from grant databases (e.g., NSF awards). But some grants are private? Then we rely on the university's report. This is a risk.

  **Step 4: Decision Rule**
  - Let F_baseline = forecasted funding without program (Market 1)
  - Let F_policy = forecasted funding with program (Market 2)
  - If F_policy > F_baseline + threshold (e.g., $1 million), then fund the program.

  **Step 5: Values vs. Predictions**
  - We are only using one metric (external funding). But the university might care about other things (e.g., educational impact, long-term scientific breakthroughs). These are not captured by the funding metric. Therefore, we must stop and hand the decision to humans because the ultimate goal (scientific advancement) is not fully captured by the proxy.

  **Conclusion for Example 2:**
  The market can predict the effect on external funding, but the university must decide if that is the primary goal. If they care about other aspects (which they likely do), then the market output is only one input. The final decision requires human judgment about values.

  ---

  ### Final Thoughts

  The procedure provides a structured way to set up a futarchy market, but it is not a panacea. Many policy decisions involve multiple objectives and value trade-offs that cannot be reduced to a single metric. In such cases, the prediction market can inform the factual predictions, but the value judgments must be made by humans. The key is to be explicit about what the market is predicting and what it is not.
answer: |-
  ### Concrete Futarchy Design Procedure for Policy Decisions

  Below is a step-by-step procedure for converting a policy question into a futarchy implementation. I’ll specify the exact steps, highlight judgment calls (where human input is unavoidable), and then apply the procedure to your two examples. The goal is to ensure the market forecasts a **counterfactual outcome** (what would happen if the policy is adopted) rather than untradeable value judgments. The entire review is designed for a non-specialist engineer to complete in one working day, with sign-off from a market design lead.

  ---

  ### **Step 1: Reformulate the Question for Counterfactual Forecasting**  
  **Objective:** Translate vague policy questions into a forecastable metric that isolates the policy’s causal effect.  
  **Procedure:**  
  1. **Identify the primary goal:** Ask stakeholders: "What measurable outcome does this policy aim to optimize?" (e.g., GDP, carbon emissions, student enrollment). Reject value-laden goals (e.g., "fairness" or "morality") unless quantifiable.  
  2. **Define a specific, measurable metric (M):**  
     - *Requirement:* M must be numeric, observable, and attributable to the policy (e.g., "plastic waste in tons" not "environmental quality").  
     - *Counterfactual framing:* "What will be the value of M at time T if the policy is implemented (M_policy) versus if it is not (M_baseline)?"  
  3. **Set a fixed time horizon (T):** T must be short enough for resolution (≤5 years) but long enough for policy effects (e.g., 2–3 years for plastic bags; 5 years for research programs).  
  4. **Adjust for confounders:** If external factors (e.g., economic shocks) could distort M, specify an adjusted metric (e.g., "plastic waste per capita, adjusted for city population growth").  

  **Judgment Calls:**  
  - Choosing M: Requires agreement on what constitutes "success" (e.g., is "reputation" for a university quantifiable as research citations?).  
  - Time horizon T: Balance between policy impact visibility and market tradability.  
  **Stop & Hand to Human If:** No consensus on M exists (e.g., the goal is inherently subjective like "preserving academic freedom").  

  ---

  ### **Step 2: Resolution Criterion**  
  **Objective:** Ensure the outcome is unambiguous, verifiable, and resistant to manipulation.  
  **Procedure:**  
  1. **Designate an adjudicator:**  
     - *Ideal:* Independent third party with public data access (e.g., National Bureau of Statistics, trusted auditor).  
     - *Fallback:* Pre-specified committee with diverse stakeholders (e.g., 3 experts: one pro-policy, one anti-policy, one neutral).  
  2. **Define evidence sources:**  
     - Primary data: Official/public datasets (e.g., city waste reports, university grant records).  
     - Verification: Require multiple sources (e.g., "plastic waste data from city landfills + independent audit").  
  3. **Handle ambiguity:**  
     - Clear thresholds: Set numerical buffers (e.g., "policy wins only if M_policy > M_baseline by ≥10%").  
     - Default outcome: If data is missing/contested by T+6 months, void the market and revert to human decision.  
  4. **Timeline:** Fix resolution date at T (e.g., "Dec 31, 2025") + data verification window (e.g., 90 days).  

  **Judgment Calls:**  
  - Adjudicator selection: Trustworthiness vs. availability (e.g., government data may be politicized).  
  - Evidence standards: Trade-off between rigor (e.g., peer-reviewed studies) and timeliness.  
  **Stop & Hand to Human If:** No objective data source exists (e.g., "cultural impact of research").  

  ---

  ### **Step 3: Manipulation and Verification Checks**  
  **Objective:** Ensure market robustness before launch.  
  **Checks to Run (Engineer’s Checklist):**  
  1. **Liquidity risk:**  
     - Simulate trading volume using historical analogues (e.g., similar-sized markets on your platform).  
     - Minimum liquidity: Require ≥10 active traders and ≥$10k pooled liquidity. If unmet, veto the market.  
  2. **Sensitivity to policy effect:**  
     - Back-test: Compare M’s volatility to policy’s expected impact (e.g., "If plastic waste varies by ±20% naturally, will a 5% policy effect be detectable?").  
     - Veto if noise drowns signal (signal-to-noise ratio < 2:1).  
  3. **Conflict of interest:**  
     - Screen major traders: Block policy stakeholders (e.g., plastic bag manufacturers) from large trades.  
     - Use anonymity: Mask trader identities to prevent coercion.  
  4. **Oracle reliability:**  
     - Verify data feeds (e.g., APIs for city waste databases) and add backups (e.g., scraped web data).  
  5. **Market structure:**  
     - Use a liquidity-sensitive AMM (e.g., LMSR) to dampen manipulation.  
     - Set trade limits (e.g., max 5% of pool per trader).  

  **Judgment Calls:**  
  - Liquidity thresholds: Platform-specific (depends on user base).  
  - Conflict tolerance: High-stakes policies (e.g., corporate governance) need stricter limits.  
  **Abort If:** Checks fail >2 items; human committee decides fallback.  

  ---

  ### **Step 4: Decision Rule & Handling Disagreements**  
  **Objective:** Convert market prices into a binary policy decision.  
  **Procedure:**  
  1. **Market setup:** Launch two markets:  
     - Market A: Forecasts M_baseline (status quo).  
     - Market B: Forecasts M_policy (if implemented).  
  2. **Decision rule:**  
     - If M is desirable (e.g., revenue↑): Adopt policy if E[M_policy] > E[M_baseline] + buffer (e.g., 5% buffer for uncertainty).  
     - If M is undesirable (e.g., waste↓): Adopt policy if E[M_policy] < E[M_baseline] - buffer.  
     - Prices: Use time-weighted average price (TWAP) 24h before decision deadline.  
  3. **Handle disagreements:**  
     - Scenario 1: Markets conflict (e.g., M_policy > M_baseline but low confidence).  
       - *Rule:* Reject policy if bid-ask spread >15% in either market (indicates uncertainty).  
     - Scenario 2: External markets conflict (e.g., a related ESG market disagrees).  
       - *Rule:* Defer to the market with higher liquidity + narrower spread.  
  4. **Default outcome:** If inconclusive (e.g., spread > threshold), status quo prevails.  

  **Judgment Calls:**  
  - Buffer size: Arbitrary (5–10% common); set by market design lead.  
  - Spread threshold: Platform-specific (e.g., 15% for thinly traded assets).  

  ---

  ### **Step 5: Values-vs.-Predictions Boundary**  
  **Objective:** Flag when the problem is values-based, not empirical.  
  **Stop Criteria:**  
  - Step 1: If M cannot isolate policy impact (e.g., "happiness metrics" conflate policy with culture).  
  - Step 2: If resolution requires ethical interpretation (e.g., "did the research program benefit society?").  
  - Step 4: If trade-offs between multiple Ms are needed (e.g., "plastic waste ↓ vs. job losses").  
  **Output:** Hand decision to human committee with market forecasts as input.  

  ---

  ### **Application to Examples**  
  #### **Example 1: City Council – Ban Single-Use Plastic Bags**  
  **Step 1: Reformulate Question**  
  - Goal: Reduce environmental waste.  
  - Metric (M): "Tons of plastic bag waste in landfills within city limits (adjusted for population growth)" at T=2 years.  
  - Counterfactual: M_policy (with ban) vs. M_baseline (without ban).  
  - *Judgment:* M is measurable but ignores economic effects (e.g., job losses). Proceed with caveat.  

  **Step 2: Resolution Criterion**  
  - Adjudicator: City waste department + third-party auditor (e.g., Greenpeace).  
  - Evidence: Monthly landfill reports cross-verified by spot checks.  
  - Ambiguity: If data incomplete, use state environmental agency reports. Default: Void after 6 months.  

  **Step 3: Manipulation Checks**  
  - Liquidity: High (public interest); simulate with similar environmental markets.  
  - Sensitivity: Plastic waste ≈30% of city waste; detectable if ban reduces >10%.  
  - Conflicts: Ban plastic lobbyists from large trades.  
  - Oracle: City API + manual audits.  
  - **Verdict:** Pass.  

  **Step 4: Decision Rule**  
  - Adopt ban if E[M_policy] < E[M_baseline] - 10% (buffer for measurement error).  
  - If spread >15% in either market, reject ban.  

  **Step 5: Boundary**  
  - Trade-off with economic harm (values question). **Stop & Hand to Humans:** Include job-loss forecasts from a separate market as input.  

  ---

  #### **Example 2: University – Fund 10-Year Basic Research Program**  
  **Step 1: Reformulate Question**  
  - Goal: Boost research impact.  
  - Metric (M): "Number of peer-reviewed publications in top-10 journals + patents filed" at T=5 years (not 10, for tradability).  
  - Counterfactual: M_policy (with funding) vs. M_baseline (without).  
  - *Judgment:* M ignores education/equity benefits; acceptable if research impact is primary goal.  

  **Step 2: Resolution Criterion**  
  - Adjudicator: University provost + external committee (e.g., NSF panel).  
  - Evidence: University records + CrossRef/patent databases.  
  - Ambiguity: If disputes, use Scopus/WoS data. Default: Void after 9 months.  

  **Step 3: Manipulation Checks**  
  - Liquidity: Low (academic niche); may need seeded liquidity.  
  - Sensitivity: Funding boosts output by ~50% in similar programs; detectable.  
  - Conflicts: Exclude program applicants from trading.  
  - Oracle: APIs for PubMed/patent offices.  
  - **Verdict:** Pass with liquidity seeding.  

  **Step 4: Decision Rule**  
  - Adopt program if E[M_policy] > E[M_baseline] + 15% (high uncertainty in research).  
  - Conflict: If patent market disagrees, defer to publication market (higher liquidity).  

  **Step 5: Boundary**  
  - Long-term societal impact (e.g., "is quantum computing ethical?") is values-based. **Stop & Hand to Humans:** Market informs output, not broader ethics.  

  ---

  ### **Procedure Summary**  
  1. **Reformulate:** Define causal metric M and horizon T.  
  2. **Resolve:** Appoint adjudicator, evidence sources, ambiguity protocol.  
  3. **Verify:** Run liquidity, sensitivity, conflict checks.  
  4. **Decide:** Compare M_policy vs. M_baseline with buffers/spread rules.  
  5. **Boundary:** Hand off if value trade-offs arise.  

  **Engineer Output:** A 1-page report with:  
  - Metric, adjudicator, data sources.  
  - Market parameters (liquidity/seeding needs).  
  - Go/no-go recommendation.  
  **Lead Sign-off:** Focuses on judgment calls (metric choice, buffers, conflicts).  

  This procedure systematizes futarchy while acknowledging its limits: **Markets predict outcomes; humans must set goals and weigh trade-offs.**
