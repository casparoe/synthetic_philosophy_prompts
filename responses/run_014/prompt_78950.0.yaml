  Let's build a Newcomb-like threat scenario.

  You are up against a predictor that is part of a threat system. The predictor is very accurate and has been watching you. There are two stages:

  Stage 1: You decide whether to adopt a commitment device (at a cost C in utility, paid immediately).

  Stage 2: The threat system uses its predictor to decide whether to threaten you. If it threatens, then you have a choice: comply or refuse.

