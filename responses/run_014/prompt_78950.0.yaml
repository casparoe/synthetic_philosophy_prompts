    They will choose the option that maximizes their expected profit. We set the numbers so that they prefer to offer to buy if the compliance probability is 50%. For example, if the algorithm is worth $2M to them, and carrying out the threat costs them $500,000 (and if they carry out the threat they get the algorithm anyway? Or not? Let's say if they carry out the threat, they get the algorithm but also incur reputational damage and legal costs of $500,000). So if they threaten and you comply, they get the algorithm at $0 cost. If you refuse, they get the algorithm but pay $500,000. So expected cost for threatening: 50% * 0 + 50% * 500,000 = $250,000. Expected value: $2M - $250,000 = $1.75M. If they buy, they pay $1M and get $2M, so profit $1M. So $1.75M > $1M, so they threaten.

