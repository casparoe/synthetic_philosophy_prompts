    If the compliance probability is 30%, then expected cost: 70% * 500,000 = $350,000, profit $2M - $350,000 = $1.65M, which is still better than buying ($1M profit). So they always threaten? We need to set the numbers so that if the compliance probability is below a threshold, they prefer to buy.

    Let the value of the algorithm be V, cost of carrying out threat be C, and price to buy be P. They threaten if:

        [ p * V + (1-p) * (V - C) ] > V - P

        => V - (1-p)C > V - P
        => - (1-p)C > - P
        => P > (1-p)C

    So they threaten if P > (1-p)C.

