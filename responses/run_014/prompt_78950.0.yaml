     a) Threaten: They get the algorithm for free with 50% chance, but with 50% chance you refuse and they have to carry out the threat (costly) and might not get the algorithm. Their expected profit: 50% * (value of algorithm) - 50% * (cost of carrying out threat) - [if they don't get the algorithm, they also lose the chance to buy it?]
