  - If they threaten and you refuse, they incur T plus the cost of carrying out the threat S, and they get nothing.
  - If they don't threaten, they get 0.

  So they threaten only if the probability of compliance p is high enough: p*G - T - (1-p)*S > 0.

  We set numbers: G=100, T=10, S=40. Then they threaten if p*100 - 10 - (1-p)*40 > 0 -> 100p -10 -40 +40p >0 -> 140p > 50 -> p > 50/140 = 5/14 ≈ 0.357.

