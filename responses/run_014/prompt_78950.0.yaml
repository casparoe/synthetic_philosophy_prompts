   Given the complexity and your constraints (no time travel, no gods), we might not get a clean disagreement between CDT and EDT in the threat scenario. 

   However, in the literature, the disagreement is about whether to condition on the evidence or not.

   In our first scenario, both theories agree on adopting the device. So let's present that and then explain why gritting teeth fails.

  Scenario in a paragraph:

  You are a small-time inventor with a valuable patent. A large company, BigCorp, can either offer to buy it for $1 million or threaten to ruin you if you don't hand it over for free. They use a psychological AI model to predict your response to a threat. If the model predicts you would comply with the threat, they will threaten you and you'll hand it over for free. If it predicts you would refuse, they won't threaten (because carrying out the threat is costly) and will instead offer to buy. You have the option to join an expensive legal defense group (cost: $200,000 in lifetime fees) that trains you to never yield to threats. This group is effective: their alumni have a 40% compliance rate under threat (vs. 90% for non-alumni). BigCorp's model sees your membership and predicts a 40% chance of compliance, so they don't threaten and offer to buy. You then get $1 million - $200,000 = $800,000. Without membership, the model predicts 90% compliance, so they threaten, and you comply, getting $0.

  Why gritting your teeth and resolving to refuse without the device fails: 
   The AI model has access to your psychological profile and past behavior. It knows that under pressure, you typically yield. Your current resolution is not enough to change that prediction because it's based on deep-seated patterns. When threatened, you face immense pressure and, true to form, comply. So you get $0.

  Causal vs Evidential Decision Theory: 
   In this setup, both theories would recommend joining the group because it leads to a better outcome ($800,000 > $0). 

  The single feature doing the work: 
   The threatener's model uses your membership in the group as a signal of your likely behavior, and they only threaten if the model predicts high compliance. By joining, you send a signal that deters the threat, even though you might not have to follow through on the commitment.

  If you delete the accuracy of the model: 
   If the model is not accurate, then joining the group might not deter the threat, and you might end up paying $200,000 and still face the threat. In that case, you might then comply (getting $0 - $200,000) or refuse (getting -$20,000 - $200,000 if we assign a cost to refusal). This could make joining worse than not joining.

  How someone who thinks acausal threats are nonsense would take the case apart:
   They might argue that in the real world, threats are not based on perfect psychological models. They would say that you can simply resolve to refuse and then follow through, and the threatener won't know until they threaten. They might also argue that the threatener would always threaten because it's cheap to try, and then see what you do. They might also say that in the real world, you can negotiate or find other options. Additionally, they might question the cost of the commitment device, arguing that it might not be as costly as portrayed or that it has benefits that offset the cost.

