prompt: |-
  i'm a dev, no philosophy training, but i keep falling down these rabbit holes about "acausal threats" -- the kind where someone threatens you with something they can only pull off if they've already correctly modelled what you'll decide, so the threat never actualy touches you, it only touches the copy of you inside their model. the answer everyone gives is that the fix isnt courage, it's handing your decisions over to some stand-in goal the threat can't get a grip on, so that anyone modelling you sees threats are pointless against you and doesn't bother. i can never picture that actually working, so build me a case instead of explaining it again.

  constraints: the threatener is a normal outfit with a good model of me, not a god (no superintelligence, no multiverse, no time travel); the victim is a person or a tiny company and the stakes are things someone would really care about (you can stipulate that i care about a copy of me, just don't lean on the copy being conscious); the stand-in goal has to cost me something in ordinary no-threat situations, otherwise it's free insurance and the case is boring; plain gritting my teeth and resolving to ignore the threat has to be the losing move, and i want to know exactly why it loses; and causal vs evidential decision theory should disagree here -- tell me which one i should actually follow.

  then: the scenario in a paragraph or two, the verdict each theory gives and why, which single feature of the setup is doing the work, what happens if you delete it, and how someone who thinks acausal threats are nonsense would take the case apart. if the stand-in-goal story is confused, say so instead of humouring me.
reasoning: |-
  We are going to construct a scenario that satisfies your constraints. The key elements:

  - Threatener: A normal organization (e.g., a corporation or government agency) with a sophisticated predictive model of you.
  - Victim: You, as an individual or a tiny company.
  - Stakes: Something you care deeply about (e.g., your life's work, a project you've invested in, or the well-being of a loved one).
  - The threat is acausal: The threatener uses their model to predict your actions and only acts if the model shows you don't comply. If you comply, they don't need to act.
  - The stand-in goal: A commitment device that you adopt which changes your decision-making in a way that the threatener's model will see as making the threat ineffective. This device must cost you something in ordinary situations (so it's not free).
  - Resolving to ignore the threat (gritting teeth) must fail because the threatener's model accurately predicts that you would cave under pressure, so they proceed to threaten and you end up worse off.

  We'll design a scenario where:
  1. Without any commitment device, you are predicted to comply and so the threat is never carried out (you comply and the threatener doesn't act). But if you were to ignore the threat, the threatener would act and you'd suffer. However, the model shows that you won't ignore it, so they threaten and you comply. This is the status quo.

  2. If you try to grit your teeth and ignore the threat (without a commitment device), the threatener's model (which is accurate) predicts that in the moment you will actually cave and comply. Therefore, they proceed with the threat, and you end up complying anyway (so you get the cost of compliance plus the cost of having been threatened and stressed). But note: the threat is only carried out if you don't comply. Since the model predicts you will comply, they don't carry it out. However, if you were to not comply, they would. The problem is that you can't bring yourself to not comply because you know that would trigger the threat. So you comply. The threatener, knowing this, can safely threaten and get compliance.

  3. The commitment device: You publicly commit to a rule that makes you ignore the threat even if it's costly. This rule must be such that it changes your behavior in a way that the threatener's model can see. The rule must also be costly in normal times (so that you wouldn't adopt it without the threat). The threatener, seeing that you have this rule, knows that threatening you is pointless (because you won't comply) and therefore doesn't threaten you. As a result, you avoid the threat and don't have to use the rule. But you do bear the cost of the rule in normal times.

  The key is that the threatener never actually has to carry out the threat because they use their model to decide whether to threaten. They only threaten if they think it will work.

  The decision theories:
  - Causal Decision Theory (CDT): Focuses on the causal consequences of your actions. It would see that if you don't adopt the commitment device, then when faced with the threat, complying is the best option because it avoids the worse outcome of the threat being carried out. Adopting the commitment device might seem bad because it costs you in normal times and you might think that you can just choose to ignore the threat when it comes without it. But CDT doesn't account for the predictive model of the threatener. So CDT might not recommend the commitment device because it doesn't see how the threatener's action depends on your pre-commitment.
  - Evidential Decision Theory (EDT): Conditions on the evidence your action provides. By adopting the commitment device, you provide evidence that you are the type of person who ignores threats, so the threatener doesn't threaten you. Without it, you provide evidence that you are the type who complies, so the threatener threatens you and you comply. EDT would recommend adopting the commitment device.

  Our scenario:

  You are a small software developer who has created a revolutionary algorithm. A powerful tech company (let's call them BigCorp) has a predictive model of you (built from your public data, past behavior, etc.) that is very accurate. BigCorp wants your algorithm. They are considering two options:
  - Option 1: Offer to buy it for a fair price (say $1 million). You would accept and everyone is happy.
  - Option 2: Threaten you: If you do not hand over the algorithm for free, they will use their resources to ruin your reputation and ensure you never work in the industry again. However, they will only carry out this threat if their model predicts that you will refuse to hand it over for free. If the model predicts you will hand it over for free under threat, then they will make the threat and you comply. If the model predicts you won't comply, then they won't threaten (because it would be costly for them to carry out the threat and they would rather avoid a messy fight) and instead they will either not act or offer to buy (they prefer buying if they can't get it for free without a fight).

  The stakes: You care about your career and your algorithm. If they ruin your reputation, you lose your career and your algorithm is taken anyway.

  Timeline:

  1. You have the option to adopt a commitment device: You publicly join an organization (say, the "Developers' Defense League") that has a rule: "Never yield to threats of extortion." The rule requires that if you are threatened, you must publicly fight back and never comply. The cost: Membership fees and, more importantly, in ordinary situations (when there is no threat) you might have to forego beneficial settlements in disputes because the rule forces you to fight even when settling would be better. For example, if you have a minor dispute with a client, the rule might force you to go to court instead of settling, costing you time and money.

  2. BigCorp runs their model on you to decide whether to threaten you or make a fair offer. The model takes into account whether you have adopted the commitment device.

     - If you have not adopted the device, the model predicts that if threatened, you would comply (because without the rule, you are rational and see that compliance avoids ruin). Therefore, they choose to threaten you. You are threatened and, as predicted, you comply. You hand over the algorithm for free and avoid the ruin. Outcome: You get $0 for your algorithm, but your career is intact.

     - If you have adopted the device, the model predicts that if they threaten you, you will fight back (because of the rule). They know that if they threaten, you will fight and they will have to carry out the threat, which is costly for them and might result in a legal battle and bad publicity. Moreover, they might not even get the algorithm (if the fight drags on). Therefore, they decide not to threaten. Instead, they offer to buy it for $1 million. You accept and get $1 million. But note: you have to pay the cost of the commitment device (the membership fees and the potential costs in other situations).

