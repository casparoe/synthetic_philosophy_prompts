   How do we reconcile?

   In the threat scenario, the predictor's action (threaten or not) happens after your stage 1 action. So it's not already set. Therefore, CDT would see that stage 1 action can influence the threat system's decision.

   In the classical Newcomb, the content of the box is set before stage 1. So your stage 1 action cannot influence it.

   Therefore, to get a disagreement, we need the threat system's decision to be made before your stage 1 action? That doesn't make sense.

   Alternatively, we can make the predictor's prediction about your stage 2 action be based on your entire history up to stage 1, and the prediction is made before stage 1. Then stage 1 action cannot influence the prediction. This is the classical Newcomb.

   So for our purpose, the acausal threat scenario is more like the classical Newcomb if the threat system's model is fixed before you decide on the commitment device. But in reality, the threat system is watching and can see your commitment device or not.

