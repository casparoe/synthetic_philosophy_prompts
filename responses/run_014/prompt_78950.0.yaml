  Classical Newcomb-like problem:

  There are two boxes, A and B. A is transparent and has $1,000. B is opaque and has either $1,000,000 or $0. You can take both boxes or only box B. The catch: A predictor (very accurate) has already put $1,000,000 in box B if it predicted you would take only box B, and $0 if it predicted you would take both.

