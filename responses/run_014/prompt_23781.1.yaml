prompt: |-
  Ok so I got into a whole thing with my friend last night about whether "disease" is just a medical/statistical fact about the body or whether its shot through with values from top to bottom -- she kept bringing up drapetomania and I kept bringing up Boorse's reference-class stuff and neither of us budged. I teach an intro philosophy of medicine seminar, 14 students, one 75-minute session, and I want to turn this into an in-class activity instead of just lecturing at them about naturalism vs normativism. Split the room into two "nosology committees," each of which has to rule on the same stack of borderline cases (mix real historical ones with invented contemporary ones) under seperate rulebooks -- one committee can only invoke naturalist criteria (statistical typicality, biological function, no appeal to harm), the other only normativist criteria (harm, social value, no appeal to statistics or function) -- without ever being told the words "naturalist" or "normativist," then bring the two committees together and force them to agree on one verdict for a case neither has seen. I want each side to hit a wall on its own steam: the naturalist committee should get stuck on a case where "statistically normal" gives an answer everyone finds obviously wrong, and the normativist committee should get stuck on a case that looks uncomfortably like it'd bless something we now recognize as an abuse. Give me this as exactly five numbered points, each a sentence or two, no intro or conclusion -- covering the setup and materials, the two rulebooks plus case files, the moment each side hits its wall, the merged debrief that names Boorse and Wakefield and maps the wreckage onto their positions, and what will predictably go wrong or what the exercise just can't honestly capture.
reasoning: |-
  Okay, the user is a philosophy of medicine instructor who had a debate with a friend about whether disease is purely medical/statistical or value-laden. They want to transform this into an interactive seminar activity instead of lecturing. 

  Hmm, they've already designed a clever structure: splitting students into two "nosology committees" with constrained rulebooks (naturalist vs normativist) to evaluate borderline cases. The key is making both sides hit ethical or logical walls through the cases. 

  Their unspoken goals seem to be: 
  - Making abstract theory tangible through roleplay
  - Forcing students to confront limitations of both approaches
  - Avoiding jargon until the debrief
  - Creating memorable cognitive dissonance

  The real challenge is case selection. For the naturalist committee's wall, I'm thinking of historical examples like "slave escape pathology" where statistics support oppression. For normativist, maybe a case where labeling "harm" could justify suppressing homosexuality or political dissent. 

  The debrief needs to connect organically to Boorse's biostatistical theory and Wakefield's hybrid harm+dysfunction model without feeling tacked on. And I should warn that real-life classifications are messier than this exercise allows - sometimes statistics and values blend invisibly.

  ...Wait, they specifically asked for five numbered points. Better structure tightly:
  1. Setup logistics 
  2. Rulebook constraints
  3. Each committee's breaking-point case
  4. Reveal & theoretical mapping
  5. Caveats about real-world complexity
answer: |-
  Here are five numbered steps for your activity:

  1. **Setup & Materials**: Divide 14 students into two seven-person "nosology committees." Provide each committee with identical case files (e.g., drapetomania, asymptomatic hyperthyroidism, extreme but functional lactose intolerance, invented "chronic voter apathy syndrome," invented "hyper-empathy disorder" causing financial ruin) and separate rulebooks printed on colored paper.  

  2. **Rulebooks & Case Review**: Committee A (naturalist) receives rules: "1. Define disease ONLY by statistically atypical biological traits. 2. Assess ONLY if trait disrupts species-typical bodily function. 3. NEVER consider harm, suffering, or social impact." Committee B (normativist) receives: "1. Define disease ONLY if trait causes harm/suffering. 2. Assess ONLY if trait violates social expectations or values. 3. NEVER reference statistics, biology, or 'normal function'." Each committee categorizes cases as "disease" or "not disease" in 25 minutes.  

  3. **Walls Hit**: Naturalist committee hits wall on a case like drapetomania (statistically atypical escape attempt in enslaved people → must classify as "disease" by their rules, causing discomfort). Normativist committee hits wall on a case like homosexuality historically framed as causing "social harm" → must classify as "disease" by their rules, exposing risk of pathologizing difference.  

  4. **Merged Debate & Theoretical Mapping**: Present a new case (e.g., "chronic creativity syndrome" causing job instability) requiring unanimous verdict. As deadlock emerges, reveal terms "naturalism" (Boorse: dysfunction in reference class) and "normativism" (Wakefield’s hybrid "harmful dysfunction" acknowledges both). Map their struggles: Boorse fails on value-laden dysfunctions; pure normativism risks medicalizing dissent.  

  5. **Predictable Gaps**: Students may miss that real committees *blend* criteria covertly (e.g., "biological function" often smuggles values). The exercise can’t capture how power shapes reference classes (Boorse) or how "harm" definitions shift culturally (Wakefield’s critics). Naturalists may resist their verdicts by covertly invoking harm; normativists may dismiss statistics despite rules.
