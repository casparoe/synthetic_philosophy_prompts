prompt: |-
  Quick one. I'm an actuary, and I've been given the twenty-minute "stretch topic" slot at our monthly team meeting to present the Ellsberg paradox. Audience is eight actuaries and a couple of underwriters — all fluent in expected value, none of them have read any decision theory. I don't want you to explain it to me; I want a plan for how I should explain it. Specifically: the order the pieces have to go in (what has to be in place before the paradox can even register for this crowd), what to build it around — I'm assuming the classic two urns, one with a declared 50/50 red/black split and one where I refuse to say the mix, but tell me if something else carries it better — and the misconceptions this particular audience will form, plus where exactly in the sequence to head each one off. I can definately predict one: someone will say it's just risk aversion. The one that worries me is the guy who'll say "so assign 50/50 by indifference and the whole thing collapses back into expected value" — I half-see why that move doesn't rescue the standard story, but I could not defend it under questioning, so build the plan around handling him specifically. Also tell me what I should openly refuse to cover at this level and say so, and give me one question I can ask at the end to check the idea actually landed. Keep the whole plan under 450 words — I know that's tight for all this, that's the point.
reasoning: |-
  Okay, the user is an actuary preparing a 20-minute presentation on the Ellsberg paradox for a team of actuaries and underwriters. They need a concise plan that builds understanding step-by-step while preempting common misconceptions. 

  First, I should recognize their audience: quantitatively skilled professionals fluent in expected value but new to decision theory. The core challenge is making ambiguity aversion intuitive while dismantling the "just assign 50/50" reflex. 

  The classic two-urn setup is perfect here - it's visceral and avoids math overload. I'll sequence it: 
  1) Establish common ground with risky urn (known probabilities) to showcase standard EV behavior. 
  2) Introduce ambiguous urn deliberately - must emphasize total ignorance, no anchor points. 
  3) Contrast choices to reveal the paradox through preference reversal. 

  Key traps to preempt: 
  - The "risk aversion" confusion: explicitly differentiate risk (known probabilities) from ambiguity (unknown structure). 
  - The "50/50 indifference" fallacy: stress that forced probability assignment contradicts the paradox's core revelation about human preference. 

  For the "just assign 50/50" challenger, I need a two-part shutdown: 
  a) Empirical reality: people demonstrably prefer the risky urn even when hypothetical math says EV is equal. 
  b) Philosophical weight: doing so erases the distinction between measurable risk and true uncertainty (Knightian framing). 

  I'll explicitly exclude probability updating (Bayesian) and solutions (MaxMin EU) - this is about exposing the paradox, not resolving it. 

  Closing check: "Why can't we treat both urns as 50/50 for decision purposes?" If they reference aversion to not-knowing-the-odds, it landed. 

  Word count discipline: I'll keep explanations telegraphic but precise. The urn example does heavy lifting so I can avoid equations. Underwriters need the intuition more than the formalism. 

  Final touch: labeling the paradox as "Knightian uncertainty in action" gives actuaries a hook for further reading.
answer: |-
  Here’s your battle-tested 20-min plan:

  **Order & Key Pieces (12 mins):**
  1.  **Groundwork (3 mins):** Reiterate rational choice under *risk* (known probabilities). Use a coin flip: Would you bet £100 on Heads? (Yes/No depends on risk appetite, but EV is calculable). Emphasize: **probabilities drive decisions**.
  2.  **Setup (2 mins):** Introduce **Urn A (Risky)**: Exactly 50 red, 50 black balls. **Urn B (Ambiguous)**: 100 balls, red/black mix *unknown*. Stress: *No information* about B’s composition. You know nothing.
  3.  **Choice 1: Bet on Red (3 mins):**  
      *   "Would you rather bet on Red from Urn A or Red from Urn B?" Most choose A. Why? A has *known* 50% chance. B could be 1% red or 99% red – uncertainty feels worse. **Label this: Ambiguity Aversion**.
  4.  **Choice 2: Bet on Black (4 mins):**  
      *   "Now, would you rather bet on Black from Urn A or Black from Urn B?" Most *still* choose A. Same reason.
      *   **Reveal the Paradox:** Choosing A for Red *and* A for Black implies you think Red is *less* likely in B *and* Black is *less* likely in B... but they must sum to 100%! Contradiction. Standard probability/EV fails.

  **Preempting Misconceptions (5 mins):**
  *   **"It's just Risk Aversion" (Address during Choice 1):** "Good point! But note: In both bets on A, you face identical *risk* (50/50). The aversion is specifically to the *unknown odds* of B, not the risk of losing. That's ambiguity aversion, distinct from risk aversion."
  *   **"So assign 50/50 by Indifference!" (The Crucial Takedown - After Reveal):**  
      *   "Ah, the Principle of Insufficient Reason! *If* we force B to be 50/50, mathematically the paradox vanishes. **But here's the rub:** People *don't* act as if B is 50/50. They demonstrably prefer A for *both* colors."
      *   **Punchline:** "Assigning 50/50 ignores the *psychology of not knowing the odds*. The paradox shows people treat *known-risk* (A) and *ambiguity* (B) as fundamentally different *kinds* of uncertainty, even if math says they *could* be treated the same. Forcing 50/50 papers over this deep aversion to the unknown."

  **What to Explicitly Exclude (1 min):** "We're focusing purely on *exposing* the paradox and ambiguity aversion today. We won't cover solutions (like MaxMin EU or α-MEU), Bayesian updating with priors, or different ambiguity models. That's deeper decision theory for another time."

  **The Check Question (End, 2 mins):** "Why can't assigning 50/50 to the ambiguous urn fully 'solve' the problem revealed by the choices people actually make?"  
  *(Target Answer: Because people demonstrably *avoid* the ambiguous urn, showing they don't treat unknown probabilities the same as known 50/50, even if the math is forced equal.)*

  **Why it Works:** Builds from core knowledge (EV/risk), uses intuitive choices, highlights contradiction *before* introducing "solutions", surgically dismantles the 50/50 fallacy by appealing to *revealed preference*, and ends with a targeted comprehension check.
