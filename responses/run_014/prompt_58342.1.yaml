  1.  **Answer YES to "Is vulnerability to synchronic sure loss itself irrational?" and YES to "Is the research collective irrational?":** Views holding that synchronic Dutch book vulnerability constitutes irrationality *as such*, requiring probabilistically coherent odds (e.g., classical pragmatic vindication), thus condemning the collective's pooled odds.
  2.  **Answer YES to "Is vulnerability to synchronic sure loss itself irrational?" and NO to "Is the research collective irrational?":** Views holding that synchronic vulnerability *reveals* a deeper defect (e.g., inconsistency in value commitments or susceptibility to accuracy-domination), vindicated on non-pragmatic grounds, so the collective might be defective but not *because* it's bookable.
  3.  **Answer NO to "Is vulnerability to synchronic sure loss itself irrational?" and YES to "Is the traveler irrational?":** Views rejecting the irrationality of synchronic vulnerability (e.g., allowing imprecise credences) but condemning diachronic incoherence as irrational updating, thus faulting the traveler despite her reason.
  4.  **Answer NO to "Is vulnerability to synchronic sure loss itself irrational?" and NO to "Is the forecaster irrational?":** Views rejecting the identification of belief with a single betting price (e.g., imprecise credences), finding no irrationality in the forecaster's one-sided odds or the collective's pooled odds, as bookability doesn't reflect the agent's actual epistemic state.
  5.  **Unoccupied: NO to irrationality from vulnerability, YES to traveler irrationality, YES to forecaster irrationality:** This combination (denying vulnerability defines irrationality but condemning both the traveler and forecaster) is incoherent; condemning the forecaster requires agreeing vulnerability *is* irrational for synchronic cases, contradicting the first answer. *(Note: Items 2 and 4 both yield "NO" for the forecaster, differing on *why* vulnerability isn't irrational; the tree cannot separate them solely by these case answers.)*
