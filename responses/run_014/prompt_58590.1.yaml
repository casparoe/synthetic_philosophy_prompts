prompt: |-
  I am a novelist invited to lead a ninety minute craft session for eighteen adult fiction writers with no formal training in philosophy. My purpose is practical: I want participants to leave with a more precise repertoire for rendering characters whose emotional lives diverge from what those characters avowedly believe.

  Please design a complete participatory exercise that allows the group to feel from the inside the force of three competing accounts of what emotions are: emotions as evaluative judgments, emotions as perceptions of value on the model of sensory perception, and emotions as patterns of bodily feeling and readiness to act.

  Build the exercise around the following three invented cases, presented in plain language suitable for nonphilosophers. First, a cellist who sincerely judges that her late husband did nothing wrong in his final year and takes herself to have forgiven him, yet each evening is overtaken by grief tinged with anger as if she had been wronged. Second, a hiker who judges with full confidence that a glass walkway over a gorge is safe and can explain the engineering behind that confidence, yet freezes in terror when stepping onto it. Third, a juror who judges that a defendant has done something truly contemptible and can defend that evaluation at length, yet reports feeling entirely flat and unmoved when facing the defendant in person.

  Provide a detailed facilitation plan with timing for each phase, grouping, materials needed, and wording of instructions that can be read aloud without prior lecture and without introducing technical terminology until the end. The central task should involve writing or revision decisions and bodily or interactive elements, so that the philosophical difference emerges from what participants do and from the difficulty of revising the emotion by revising the judgment.

  Conclude with a debrief that maps specific moments in the activity onto the differences among the three accounts, with particular attention to what each account predicts about whether and how the emotion should change if the underlying evaluation changes. Add a candid note on what is likely to go wrong on a first run with writers resistant to abstraction and how to handle it, and a clear statement of which aspect of the disagreement the activity cannot reproduce and must be supplied by discussion.
reasoning: |-
  We are designing a 90-minute participatory exercise for fiction writers to explore three accounts of emotion through character scenarios. The goal is to help them render characters whose emotions diverge from their avowed beliefs.

  The three accounts:
  1. Emotions as evaluative judgments (e.g., feeling angry because you judge that you were wronged).
  2. Emotions as perceptions of value (like sensory perception, which can be non-judgmental and sometimes non-veridical, e.g., feeling fear even when you know there's no danger).
  3. Emotions as patterns of bodily feeling and readiness to act (e.g., the physical sensations and impulses associated with fear: trembling, urge to flee).

  We have three cases:
  A. Cello player: judges that husband did nothing wrong and she has forgiven him, but experiences grief tinged with anger.
  B. Hiker: judges the glass walkway is safe but freezes in terror.
  C. Juror: judges the defendant is contemptible but feels flat and unmoved when facing him.

  Structure:
  - Total: 90 minutes
  - Avoid technical terms until the end.
  - The exercise should involve writing/revision, bodily/interactive elements.
  - Focus on the difficulty of changing the emotion by changing the judgment.

  Plan:

  Phase 1: Introduction (10 minutes)
  - Welcome and set the stage: explain we'll be exploring how emotions work in characters, especially when they don't match what the character thinks they should feel.

  Phase 2: Case Studies in Small Groups (30 minutes)
  - Divide into 3 groups (6 per group). Each group gets one case.
  - Instructions: Read the case and then do two activities:
     a) Writing: Rewrite the scene to make the emotion match the judgment. How would you change the character's experience? (10 minutes)
     b) Bodily/Interactive: Act out the original scene and then the revised one. Notice the physical and behavioral differences. (10 minutes)
  - Then, they discuss: Was it easy or hard to change the emotion by changing the judgment? What did you have to alter? (10 minutes)

  Phase 3: Rotate and Experience (30 minutes)
  - Groups rotate so each group now has a new case (but they don't have to rotate the written work, just the case description and their new task). They do the same two activities (writing and acting) for the new case. (25 minutes for two activities, then 5 minutes to quickly discuss)

  Phase 4: Whole Group Debrief and Theory Introduction (20 minutes)
  - Bring everyone together. Ask each group to share one thing they noticed about trying to change the emotion by changing the judgment.
  - Then, introduce the three theories in plain terms (without the technical names at first). 
    - Theory 1: Emotions are judgments. (If you change the judgment, the emotion should change.)
    - Theory 2: Emotions are like perceptions. (Sometimes you perceive danger even when you know it's safe, like an optical illusion.)
    - Theory 3: Emotions are bodily patterns. (They are about how your body reacts and what it prepares you to do.)
  - Map the cases to the theories:
    - Cello player: Theory 2 (perception) or 3 (bodily pattern) might explain the lingering anger even with forgiveness (judgment).
    - Hiker: Theory 2 (perception of danger despite judgment) and Theory 3 (bodily freezing).
    - Juror: Theory 1 might predict feeling contempt, but Theory 2 or 3 might explain the flatness (maybe the perception isn't there, or the body isn't reacting).

  - Highlight the key difference: For Theory 1, changing the judgment should change the emotion. For Theory 2, it might not (like an illusion). For Theory 3, changing the judgment might not change the bodily pattern without also changing the situation or doing something to the body.

  Phase 5: Candid Notes and Limitations (included in the debrief)
  - What might go wrong: Writers might get stuck in the abstraction of the theories. Keep the focus on the cases and their writing/acting. If they resist, emphasize the practical character-rendering goal.
  - The activity cannot reproduce the full philosophical nuance (e.g., the exact mechanisms of each theory). We must supply by discussion that the theories are not mutually exclusive and that in real life, emotions might involve all three.

  Detailed Facilitation Plan with Timing and Instructions:

  Materials:
  - Handouts with the three cases (one per group, then rotate).
  - Paper and pens for writing.
  - Open space for acting.

  Timing Breakdown:

  1. Introduction (10 min)
     - "Welcome! Today we're going to explore how emotions work in our characters, especially when what they feel doesn't match what they think they should feel. We'll do this by looking at three characters in tricky emotional situations and trying to rewrite their experiences. Then we'll step into their shoes through some simple acting. By the end, I hope you'll have new tools for writing characters with emotional complexity."

  2. Small Group Work - First Case (30 min total)
     - Split into 3 groups (by counting off 1-2-3). Each group gets one case handout.
     - Instructions: "In your group, read the case together. Then, do two things: 
          a) Rewrite the scene so that the character's emotion matches their judgment. For example, if they judge something is safe, they should feel safe. Write a short paragraph or two. (10 min)
          b) Act out both the original scene and your revised version. Notice how the body feels and what the character does. (10 min)
          Then, discuss: How easy or hard was it to change the emotion by changing the judgment? What did you have to change? (10 min)"

  3. Rotate and Repeat (30 min total)
     - Groups pass their case to the next group (Group 1 gives to Group 2, Group 2 to Group 3, Group 3 to Group 1). 
     - "Now, each group gets a new case. Repeat the same process: rewrite, act, and discuss. But this time, you have the original case and the previous group's rewrite? No, actually, we want them to start fresh with the original case. So they only get the case description, not the previous group's work. They do the same two activities for the new case. (25 min for the activities, 5 min for a quick group reflection on the same questions)."

     Note: Let them know they are starting fresh with the new case.

  4. Whole Group Debrief (20 min)
     - Bring everyone together. 
     - "Let's hear from each group. For one of the cases you worked on, what did you notice when trying to change the emotion by changing the judgment? Was it straightforward, or were there challenges?"

     After sharing (5-10 min), introduce the three accounts:

     - "In thinking about why emotions sometimes don't match our judgments, philosophers have proposed different ideas. Let me share three without the fancy names first:

        Idea 1: Emotions are judgments. If you change your mind about something, your feeling should change too. (Example: if you decide the dog isn't dangerous, you shouldn't be afraid.)
        Idea 2: Emotions are like perceptions. Just like your eyes might see a stick in water as bent even when you know it's straight, your emotions might 'perceive' something as scary even when you know it's safe.
        Idea 3: Emotions are patterns of bodily feelings and actions. Fear might be a racing heart and the urge to run. Changing your mind might not change that bodily pattern right away.

     Now, let's connect to our cases:

        The cellist: She judges her husband did nothing wrong, but she feels anger. If emotions were just judgments (Idea 1), she wouldn't feel angry. But if emotions are like perceptions (Idea 2) or bodily patterns (Idea 3), they might not change just because she changed her judgment.

        The hiker: He knows the walkway is safe, but his body freezes. Again, Idea 1 would predict no fear, but Ideas 2 and 3 explain why the fear persists.

        The juror: He judges the defendant is contemptible but feels flat. Idea 1 would predict contempt, so why the flatness? Maybe because the emotion isn't just judgment: it might require a perception (Idea 2) that isn't happening, or a bodily response (Idea 3) that isn't firing.

     The key takeaway: When writing characters, if you want an emotion to persist despite a judgment, you might draw on the perception idea (the emotion feels like it's revealing something) or the bodily idea (the body is stuck in a pattern). If the emotion doesn't come even when the judgment is there, maybe the perception or bodily pattern is missing.

     And importantly, changing the judgment doesn't always change the emotion, depending on which idea is at play."

  5. Candid Notes:
     - What might go wrong: Writers might focus too much on the acting and not on the emotional nuance. They might also resist the philosophical framing. Solution: Keep bringing it back to character writing. Say: "Think of this as a toolbox for creating believable inner conflict."
     - The activity cannot reproduce the full philosophical debate about the nature of emotions (e.g., whether perception is non-conceptual, etc.). We must supply in discussion that these are simplified models and that emotions are complex and might involve multiple mechanisms.

  Final note: The exercise is designed so that the difficulty participants experience in trying to revise the emotion by revising the judgment (in the writing and acting) will make the limitations of the judgment theory palpable. The bodily and interactive elements (acting) will highlight the role of the body and the automaticity of the emotional response.

  Let's write the case handouts in plain language:

  Handout 1: The Cellist
     "Maya is a cellist. Her husband died a year ago after a difficult year in which he made some decisions that hurt her deeply. Today, she sincerely believes that he did nothing wrong and that she has forgiven him. But every evening when she plays her cello, she is overtaken by a wave of grief that feels tinged with anger, as if she had been wronged."

  Handout 2: The Hiker
     "Alex is a hiker standing at the start of a glass walkway that extends over a deep gorge. Alex has read about the engineering and knows with full confidence that the walkway is safe and can hold the weight of many people. But when Alex steps onto the glass, they freeze in terror, unable to move."

  Handout 3: The Juror
     "Sam is a juror in a trial. After hearing the evidence, Sam has concluded that the defendant committed a truly contemptible act and can explain why at length. But when the defendant is brought into the courtroom and Sam is facing him in person, Sam reports feeling entirely flat and unmoved, without any of the contempt that Sam expects."

  Now, the detailed facilitation plan with timing and instructions:

  Total: 90 minutes

  Phase 1: Introduction (10 min)
  - [0:00-0:10] Facilitator: "Welcome, novelists! Today we're diving into the inner lives of characters. We've all written characters who feel one thing but think another. This session is about expanding our toolkit for rendering those emotional complexities. We'll use three character scenarios and two activities: writing and a bit of acting. Let's get into groups."

  Phase 2: First Case Work (30 min)
  - [0:10-0:15] Form groups (by counting 1-2-3) and distribute one case per group. 
  - [0:15] Instructions: "In your group, read the case aloud. Then, do two things: 
     a) Rewrite the scenario so that the character's emotion matches their judgment. Write for 10 minutes. 
     b) Act it out: First, act the original scene. Then act your rewritten version. Focus on the physical sensations and actions. Spend about 10 minutes on acting. 
     Then, discuss for 10 minutes: How hard was it to change the emotion by changing the judgment? What had to change besides the judgment? Note: you might change thoughts, but also consider the body and the environment."

  - [0:15-0:25] Writing (10 min)
  - [0:25-0:35] Acting (10 min) - they can do this in their group space.
  - [0:35-0:40] Group discussion (5 min, but we said 10? Let's adjust: 5 min for discussion in this phase to stay on time? Actually, we have 30 min total: 10+10+10. But we might need to be strict.)

  Phase 3: Rotate and Second Case (30 min)
  - [0:40-0:41] Rotate cases: Group 1 passes to Group 2, Group 2 to Group 3, Group 3 to Group 1.
  - [0:41] Instructions: "Now, each group has a new case. Repeat the same process: 
     a) Rewrite the scene to match emotion and judgment (10 min). 
     b) Act out both versions (10 min). 
     Then, discuss: What was different about this case? Was it easier or harder? (5 min for discussion this time, because we are shorter on time.)"

     Actually, we have 30 min: 
     - 0:41-0:51: Writing (10 min)
     - 0:51-1:01: Acting (10 min)
     - 1:01-1:06: Discussion (5 min)

  Phase 4: Whole Group Debrief (20 min)
  - [1:06-1:26] Facilitator brings everyone together. 
     - First, ask each group to share one insight from either case (5 min). 
     - Then, introduce the three ideas (without jargon) and connect to the cases (10 min). 
     - Finally, conclude with the writing takeaway: "So when you have a character whose emotions diverge from their judgments, you can think about whether the emotion is more like a perception that hasn't updated, or a bodily pattern that's stuck, and that can help you render it precisely."

  - [1:26-1:30] Final Q&A if time.

  Candid note:
     - Writers might get caught up in the acting and not the emotional depth. Encourage them to focus on the internal experience during acting. 
     - They might also want to jump to solutions without experiencing the difficulty. Remind them that the point is to feel the resistance. 
     - The activity cannot show the full causal mechanisms of each theory. We must explain that these are models and that in reality, emotions are complex. But the activity does show that changing the judgment doesn't always change the emotion, which is the key practical point for writing.

  We must be strict on time. Have a timer.

  This plan should meet the goals.
answer: |-
  ### Comprehensive Facilitation Plan: "Emotion Behind the Mask"  
  **Total Time:** 90 minutes  
  **Participants:** 18 adult fiction writers  
  **Goal:** Equip writers with practical tools to depict characters whose emotions diverge from their stated beliefs, using embodied exercises to explore three accounts of emotion.  

  ---

  ### **Materials Needed**  
  - Printed case handouts (1 set per group)  
  - Index cards (6 per participant)  
  - Pens  
  - Timer  
  - Whiteboard/flip chart  
  - Simple props for acting (e.g., a chair for "cello," tape on floor for "glass walkway," a name tag for "defendant")  

  ---

  ### **Phase 1: Introduction (10 min)**  
  **Goal:** Frame the session without philosophy jargon.  
  **Instructions (Read Aloud):**  
  > "Welcome! As writers, we often create characters who *say* they believe one thing—but their emotions betray something else. Today, we’ll explore that gap through three characters. You’ll write, act, and revise scenes to feel this tension from the inside. No philosophy lectures—we’ll stay practical. Let’s jump in."  

  **Facilitation Notes:**  
  - Briefly introduce the three cases (no detail yet).  
  - Emphasize: *"We’re hunting for the raw material of character contradiction."*  

  ---

  ### **Phase 2: Case Deep Dive & Small-Group Work (40 min)**  
  **Groups:** Divide into 3 groups of 6. Each group gets one case.  
  **Materials:** Case handout, index cards, pens, props.  

  #### **Case Handouts (Plain Language):**  
  1. **The Cellist:**  
     > *Maya, a professional cellist, believes she’s forgiven her late husband for his actions in his final year. She tells friends, ‘He did nothing wrong—I’ve let it go.’ Yet every night, as she plays his favorite song, grief washes over her, sharpened by a spike of anger, as if he’d betrayed her.*  

  2. **The Hiker:**  
     > *Alex studies the engineering specs for a glass walkway over a canyon. They think, ‘This is 100% safe,’ and can explain the physics. But when they step onto the glass, their body locks. They can’t move, heart pounding, convinced they’ll fall.*  

  3. **The Juror:**  
     > *Sam, a juror, has decided the defendant is guilty of a vile crime. They write detailed notes about his moral failings. But when Sam sees the defendant in court, they feel nothing—no anger, no disgust. Just hollow detachment.*  

  #### **Group Instructions (Read Aloud):**  
  > **Step 1 (5 min):** *Read your case. On index cards, write:*  
  > - *CARD 1: What the character BELIEVES (their judgment).*  
  > - *CARD 2: What the character FEELS (their emotion).*  
  > - *CARD 3: ONE bodily detail that reveals the emotion (e.g., ‘clenched jaw,’ ‘cold sweat’).*  
  >  
  > **Step 2 (10 min):** *Rewrite the scene to force the emotion to match the belief. Example: If the cellist’s anger vanishes because she ‘truly’ forgives him, how does her body change?*  
  >  
  > **Step 3 (15 min):** *Act it out twice:*  
  > - *First: Perform the ORIGINAL scene. Focus on the body (e.g., how does ‘freezing’ feel?).*  
  > - *Second: Perform your REVISED scene. Notice what you had to change physically.*  
  >  
  > **Step 4 (10 min):** *Discuss: ‘What made it hard to revise the emotion? Did changing the belief *automatically* change the body?’*  

  **Facilitation Notes:**  
  - Circle groups, asking: *"Where did the body resist the rewrite?"*  
  - Keep it visceral: *"Don’t intellectualize—notice your pulse, posture, impulses."*  

  ---

  ### **Phase 3: Group Rotations & Embodied Experiments (25 min)**  
  **Groups:** Rotate cases (Group 1 → Case 2, Group 2 → Case 3, Group 3 → Case 1).  

  **Instructions (Read Aloud):**  
  > **Step 1 (5 min):** *Read your NEW case. Compare the original cards (from the last group) with your gut reaction. Where does the emotion-judgment gap feel most visceral?*  
  >  
  > **Step 2 (10 min):** *Devise a PHYSICAL INTERVENTION to ‘fix’ the emotion. Examples:*  
  > - *Cellist: Have her smash a glass (to release anger).*  
  > - *Hiker: Have them crawl (to override freezing).*  
  > - *Juror: Have them grip the chair (to ‘force’ contempt).*  
  >  
  > **Step 3 (10 min):** *Act out the intervention. Did it work? Or did the emotion persist?*  

  **Facilitation Notes:**  
  - Push participants to make the interventions physical (no dialogue).  
  - Ask: *"Could you *think* your way out of the emotion? Or did the body fight back?"*  

  ---

  ### **Phase 4: Whole-Group Debrief & Theory Mapping (15 min)**  
  **Goal:** Link the exercises to the three accounts.  

  #### **Debrief Structure (Facilitator’s Script):**  
  > "Let’s connect today’s work to three ways of understanding emotion. Don’t worry about jargon—we’ll unpack it through what you **did**."  
  >  
  > **1. Emotions as Evaluative Judgments:**  
  > - *"You tried this when you rewrote scenes to match beliefs and emotions (e.g., ‘Sam *should* feel contempt’). But what happened?*"  
  > - **Key Insight:** *"If emotions are just judgments, changing the belief should change the feeling. But in your revisions, it often felt forced. The juror’s flatness didn’t budge!"*  
  >  
  > **2. Emotions as Perceptions of Value:**  
  > - *"Remember the hiker? Alex *knew* the walkway was safe but *perceived* danger. Like seeing a mirage—you know it’s fake, but your body reacts anyway. In your interventions, could you ‘unsee’ the betrayal, the fall, the defendant’s face?*"  
  > - **Key Insight:** *"Perceptions can’t be revised by judgment alone. The cellist ‘saw’ her husband’s betrayal nightly, even after forgiving him."*  
  >  
  > **3. Emotions as Bodily Patterns:**  
  > - *"When you acted, where did you feel the emotion? In clenched fists? Shallow breath? Your physical interventions (crawling, smashing glass) tried to disrupt these patterns. Sometimes it helped—but sometimes the body ‘remembered’ the fear or anger anyway."*  
  > - **Key Insight:** *"Bodily patterns have inertia. The cellist’s grief-anger might be a groove her body can’t escape, no matter what she believes."*  

  > **Takeaway for Writers:**  
  > - *"To write this gap, ask: Is the emotion a judgment gone rogue (Juror)? A ‘perception’ that won’t resolve (Hiker)? Or a bodily habit (Cellist)? Each gives you different levers to pull."*  

  ---

  ### **Candid Notes: Pitfalls & Adjustments**  
  **Likely Issues:**  
  1. **Resistance to Abstraction:** Writers may fixate on "solving" the cases vs. feeling the tension.  
     - *Fix:* Anchor in concrete tasks ("Describe the anger in the shoulders, not the mind"). Use phrases like *"Steal this for your protagonist"* to keep it craft-focused.  
  2. **Over-Intellectualizing:** Groups may debate the cases vs. doing the exercises.  
     - *Fix:* Interrupt with: *"Show me, don’t explain. Act it out *now*."*  
  3. **Time Crunch:** Acting may run long.  
     - *Fix:* Strict timekeeping. Cut discussion if needed; prioritize bodily work.  

  **Limitation of the Activity:**  
  - The exercise **cannot replicate** how *long-term change* occurs in emotions (e.g., therapy, habituation). It focuses on immediate, felt tension.  
  - *Supply via Discussion:* *"In stories, time heals—or deepens—these gaps. A bodily pattern (Cellist) might fade with new rituals; a perception (Hiker) might shift with exposure."*  

  ---

  ### **Why This Works**  
  - **Participatory Edge:** Writing/acting makes theory felt, not lectured. The "revision frustration" mirrors characters’ helplessness.  
  - **Clarity:** Theories emerge from struggle (e.g., trying to "think away" terror highlights judgment theory’s limits).  
  - **Practical Payoff:** Writers leave with:  
    - A **diagnostic toolkit** (3 questions to ask diverging characters).  
    - **Bodily vocabulary** (e.g., "perception-like emotions resist reason").  
    - **Scene-revision tactics** (e.g., "Use props to externalize bodily resistance").  

  By the end, the gap between belief and emotion becomes a **generative space**—not a problem to fix, but a wellspring of tension.
