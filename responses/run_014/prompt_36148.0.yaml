prompt: |-
  I've been reading rationalist blogs and forums since the Overcoming Bias days, and one of the durable lessons I took from that corpus is that most verbal disputes dissolve once you force people to state their claims without the contested abstractions. I now run an upper-level seminar on metaethics — 12 students, one 90-minute session — and I want to stage the Frege–Geach problem as a live game before the students ever hear its name.

  The problem, as my students will meet it on paper: expressivism in metaethics holds that a claim like "lying is wrong" doesn't describe a fact but expresses an attitude — roughly, booing. That story is comfortable as long as moral claims occur only asserted and on their own. It strains when the same content shows up embedded: "If lying is wrong, getting your little brother to lie is wrong"; "Either lying is wrong or breaking promises is"; "It's not the case that lying is wrong." In an embedded position the claim isn't being asserted, so nothing is being booed, and yet the argument's validity seems to turn on the embedded clause meaning the same thing there as it does when asserted outright. I want the students to discover this by *needing* the embeddings, not by being told about them.

  Design the session. What I have in mind, though feel free to improve on it: the students are split into groups speaking a deliberately restricted toy language for part of the session — one sub-vocabulary purely attitudinal (a small closed stock of praise/blame signals, standing to it as the naive expressivist thinks moral talk stands to the world), the rest ordinary descriptive language. The groups then have to conduct real business under uncertainty — ratifying standing policies of the form "if such-and-such turns out to be the case, we do X," with points at stake, and later settling disputes about what was agreed once events resolve. The intended arc: atomic attitudinal claims work fine (phase 1); then conditionals, negations, and contested embeddings arrive and the attitudinal vocabulary can't state what the group settled (phase 2); finally a disagreement about a conditional between two players who agreed on every atomic claim forces the issue (phase 3).

  Please provide:

  - Materials, group setup, rules, and the exact sequence of phases, with a payoff scheme in points (no real money) that makes the embeddings genuinely necessary rather than decorative;
  - the specific moments where the toy language is supposed to hit its limits, and how I should time them;
  - a debrief that names the Frege–Geach problem only at the end, and maps each phase onto its components: the same content asserted versus embedded, modus ponens relying on stable content across those positions, and what the expressivist owes an account of when a conditional is uttered;
  - what will predictably go wrong the first time I run it — students smuggling descriptive language into the attitudinal vocabulary, phase 2 collapsing into ordinary negotiation, the dispute stage running long — and how to handle each;
  - and, frankly, which feature of the actual philosophical problem the game cannot reproduce. My guess is that any staged failure only convicts a naive boo/hurrah language, while the live dialectic is about whether more sophisticated expressivist machinery — attitudes toward attitudes, norms of conversation — can carry the embeddings; the facilitator will have to supply that distinction, and I want you to be explicit about where the game's outcome would amount to a strawman if presented as a verdict on expressivism itself.

  End with a single line beginning "Summary:" that compresses the whole design into one sentence.
reasoning: |-
  We are designing a seminar game to stage the Frege-Geach problem without naming it until the end.
   The goal is for students to discover the problem through the limitations of a toy language.

   Overview of the game:
   - Students are split into groups, each group uses a restricted language.
   - The language has two parts:
       1. Descriptive vocabulary: ordinary factual claims (e.g., "It is raining", "The temperature is above 20C")
       2. Attitudinal vocabulary: a small set of expressions for praise/blame (e.g., "Boo lying!" meaning lying is wrong, "Hurrah honesty!" meaning honesty is good)
   - The attitudinal expressions are atomic and cannot be embedded (initially).

   The game will have three phases:

   Phase 1: Atomic claims
     - Groups are presented with simple scenarios where they must express their attitude about an atomic action (e.g., "Should we boo lying?").
     - They can use the attitudinal expressions without issue.

   Phase 2: Embedding in conditionals and negations
     - Groups must make decisions under uncertainty by ratifying policies (conditionals) and handling negations.
     - Example: "If lying is wrong, then we should punish liars." But how to express "lying is wrong" in the conditional without asserting it?
     - The attitudinal vocabulary fails because you cannot embed "Boo lying!" in a conditional.

   Phase 3: Dispute about a conditional
     - After some events unfold, a disagreement arises about what was agreed in a conditional when the antecedent was an attitudinal claim.
     - Two players who agreed on every atomic claim now disagree on a conditional because the embedding was not properly captured.

   Materials:
   - A set of scenario cards for each group, describing situations that require moral-like judgments and conditional policies.
   - A set of event cards that resolve the uncertainty (e.g., "It turns out that ...").
   - A score sheet to track points.

   Group Setup:
   - Split the class into groups of 4. Each group is a "committee" making decisions for their community.
   - Each group has a set of descriptive terms and attitudinal terms (written on cards or on a shared document).

   Rules:
   1. The language restriction: 
      - Descriptive claims: These are normal factual statements. They can be combined with logical operators (if, and, or, not) as in ordinary language.
      - Attitudinal claims: Only atomic expressions are allowed. For example: 
            "Boo [action]!"  (to express disapproval)
            "Hurrah [action]!" (to express approval)
          They cannot be embedded in conditionals, negations, etc. If a student tries, the facilitator intervenes and says: "In our language, you cannot put an attitudinal expression inside a conditional or negation. You must use it on its own."

   2. Phase 1: Atomic Attitudes
      - Each group is given a set of 3-5 scenarios where they must express an attitude about a specific action (e.g., "What do we think about lying?"). 
      - They must use the attitudinal vocabulary. They get points for reaching consensus (to motivate using the language).

   3. Phase 2: Policies under Uncertainty
      - Groups are told that they must plan for future events. They are given scenarios with uncertainty and must ratify policies of the form: "If X, then we will do Y."
      - Some of these policies will involve descriptive antecedents (easy) and some will involve attitudinal antecedents (problematic).
      - Example of a policy with an attitudinal antecedent: "If lying is wrong, then we will expel anyone who lies."
          How to express this? The group might try: "If Boo lying!, then we expel liars." -> This is not allowed because the attitudinal expression cannot be embedded.
      - The group might try to rephrase without embedding, but the point is to show that they cannot express the intended policy without smuggling in descriptive language or violating the rules.

      - Points: Groups get points if the policy they ratified is correctly applied when the uncertainty is resolved. But without being able to express the policy properly, they may not be able to agree on what was ratified.

   4. Phase 3: Dispute
      - After ratifying several policies (including one with an attitudinal antecedent and one with a descriptive antecedent), the facilitator reveals an event card that resolves the uncertainty for one of the conditionals with an attitudinal antecedent.
      - Example: The group had ratified: "If lying is wrong, then we expel liars." Now, the event card says: "Lying is wrong." (But note: in the world of the game, this is a fact? We have to be careful. Alternatively, we can have the event card reveal a situation where someone lied, and then the group must decide whether to expel. But then they need to know whether lying is wrong. However, in expressivism, "lying is wrong" is not a fact but an attitude. So we need to design the event in a way that the group must apply the policy but they may have a disagreement about whether the antecedent holds.)

      - Instead, let's have the event card reveal a situation that tests the policy. But the problem is that the antecedent is an attitude, not a fact. So we can design it so that the group must first express their attitude about lying (which they did in Phase 1) and then apply the policy. But if they all agreed in Phase 1 that "Boo lying!" then they might apply the policy. However, we want a dispute.

      - How to force a dispute? We can have a policy that has a conditional with two parts: one descriptive and one attitudinal, and then an event that satisfies the descriptive part but the attitudinal part is under dispute? But wait, the attitudinal part was agreed in Phase 1.

      - Alternative: In Phase 2, when ratifying the policy, the group might not have been able to properly record the policy because of the language restriction. So when the event happens, they cannot remember or agree on what they decided. This leads to a dispute.

      - Better: Have two subgroups in the committee that had a slight difference in attitude but compromised on the policy. For example, subgroup A thinks lying is always wrong (Boo lying!), subgroup B thinks lying is sometimes acceptable (so they don't want to say Boo lying! without qualification). They compromise by ratifying: "If lying is wrong (in this situation), then we expel." But note: the expressivist language doesn't allow them to conditionally express the attitude.

      - Actually, let's design the dispute as follows:
          In Phase 2, the group is forced to express the policy without embedding, so they write: 
              "We all agree: Boo lying! And if that, then we expel liars."
          But note: the "if that" is not part of the official language. They might have recorded only the atomic attitude and the policy as two separate statements. Then, when a lie occurs, one member says: "We agreed that if lying is wrong we expel, and we also agreed that lying is wrong, so we expel." But another member says: "We only expressed that we boo lying, but we didn't say that in the policy we were conditionally committing to expulsion. The policy was stated separately as a descriptive conditional but without the antecedent being an attitude."

          Now, the event: a lie occurs. The group must decide whether to expel. Some members might say: "But we only expressed an attitude, we didn't say that the attitude being held implies expulsion." And they might have meant the conditional as a descriptive claim about the world? But it's messy.

      - Instead, we can have the group try to use the policy in a modus ponens argument, but the premises are in different "modes": one is an attitude (non-descriptive) and the other is a descriptive conditional? Then modus ponens fails because the conditional is descriptive and the attitude is not truth-apt.

      - Let me reframe: In Phase 2, the group is forced to state the policy without embedding. They might state:
            P1: Boo lying!   (attitude)
            P2: If lying is wrong, then we expel.   (here, "lying is wrong" is in the conditional, but how did they say it? They can't. So they might have said: "If someone lies, then we expel." But that changes the meaning.)

      - This is the crux: they cannot express the conditional without either changing the antecedent to a descriptive claim (which is not the same) or violating the language rules.

      - Therefore, when the event happens (a lie occurs), the group that changed the antecedent to a descriptive one will expel the liar. But then, what if the lie was in a situation that they would have considered acceptable? (e.g., a white lie to save a life). They might have intended the conditional to be triggered only when lying is wrong, but they had to write it as "if someone lies" because of the language. So they end up punishing a white lie, which they didn't intend.

      - Alternatively, they might have two conditionals: one for lying and one for the situation. But that becomes complicated.

      - Proposed scenario for the dispute:
          The group is considering two actions: lying and breaking a promise.
          In Phase 1, they expressed:
              "Boo lying!" (meaning they think lying is wrong)
              "Boo breaking promises!" (they think breaking promises is wrong)

          In Phase 2, they ratify a policy: "If an action is wrong, then we punish the person who does it."
          How to express this? They cannot embed the attitudinal term. They might try to list: "For lying: punish. For breaking promises: punish." But then what about a new action? They want a general policy.

          They are forced to either break the language rules or not have a general policy.

          Then, in the event, a new action occurs: stealing. They did not express an attitude about stealing in Phase 1. Now, they have to decide whether to punish the stealer. They don't have an expressed attitude about stealing. They might want to say: "If stealing is wrong, then we punish." But they cannot express that conditionally. They have to either express an attitude about stealing (but they don't know yet) or not punish.

          This leads to a dispute: some members think that the policy should apply because they would boo stealing, others think they never expressed an attitude about stealing so the policy doesn't apply.

      - Alternatively, we can have the group condition the policy on the attitude they hold at the time of the action. But without being able to express the conditional, they cannot record that.

   5. Payoff Scheme:
      - Points are awarded for:
          Phase 1: Consensus on atomic attitudes (1 point per scenario).
          Phase 2: Ratifying policies that are clear and can be applied (2 points per policy, but only if the policy is correctly applied later).
          Phase 3: Correctly applying the policies when events are revealed (2 points per correct application).

      - However, the policies that involve attitudinal antecedents will be problematic. The group will lose points if they cannot apply the policy because of ambiguity.

      - Also, in Phase 3, if a dispute arises and they cannot agree, they get 0 for that policy.

   6. Sequence of Phases:

      Phase 1 (20 minutes):
          - Each group is given 3 scenarios. Example:
              Scenario 1: "What is your attitude toward lying?"
              Scenario 2: "What is your attitude toward breaking promises?"
              Scenario 3: "What is your attitude toward cheating on a test?"
          - They must reach consensus and express using the attitudinal vocabulary.

      Phase 2 (30 minutes):
          - Each group is given 3 policy scenarios. Example:
              Policy 1: "We must decide: if it rains tomorrow, should we cancel the picnic?" (descriptive antecedent, easy)
              Policy 2: "We must decide: if lying is wrong, should we expel a student who lies?" (attitudinal antecedent, hard)
              Policy 3: "We must decide: either lying is wrong or we are not a moral community." (disjunction, hard)

          - They must ratify the policies and write them down in the allowed language.

      Phase 3 (30 minutes):
          - The facilitator reveals event cards one by one. Example:
              Event for Policy 1: "It rained." -> They cancel the picnic? (easy)
              Event for Policy 2: "A student lied." -> They must decide: do they expel? But note, they have already expressed that they boo lying (in Phase 1) but the policy was conditional on "lying is wrong", which they cannot express conditionally. How did they write Policy 2?
              Event for Policy 3: They have to decide whether they are a moral community? But they have expressed that they boo lying, so they think lying is wrong? But the policy was a disjunction.

          - For Policy 2: If they wrote the policy as "If someone lies, expel" (changing the antecedent to descriptive) then they expel. But what if the lie was a white lie? They might regret it. If they didn't change it and wrote something else, they may not be able to apply it.

          - The event for Policy 2 is: "A student lied to protect a friend from being bullied." Now, some members think that this lie is not wrong, but they have already expressed "Boo lying!" (without exception). They are forced to expel, but some members object.

          - This causes a dispute: they thought they had a policy for when lying is wrong, but they wrote it as a policy for when lying occurs. They cannot distinguish in their recorded policy between wrong lies and non-wrong lies.

      Debrief (10 minutes):
          - The facilitator asks the groups to share their experiences, especially the disputes.
          - Then, the facilitator explains:
              - In Phase 1, atomic attitudes were expressed without problem (like the expressivist account for simple assertions).
              - In Phase 2, when they tried to embed the attitude in a conditional (or negation, or disjunction), they couldn't, and had to resort to workarounds that changed the meaning.
              - In Phase 3, when they tried to use modus ponens (from the attitude and the conditional), they found that the conditional was either not there (because they couldn't express it) or had been altered to a descriptive claim that didn't capture their intention.
          - Then, the facilitator names the Frege-Geach problem and explains that expressivists need to account for how moral claims can have the same meaning when embedded as when asserted, and how we can reason with them in logical arguments.

   7. Predictable Problems and Handling:

      Problem 1: Students smuggling descriptive language into the attitudinal vocabulary.
          - Handling: The facilitator must enforce the language rules strictly. Have a list of allowed expressions and disallow any that embed the attitudinal terms. If they try to create a new word for "lying is wrong" as a descriptive fact, intervene and say: "Remember, in our language, you can only express attitudes by using the atomic 'Boo!' or 'Hurrah!'. You cannot create a descriptive fact out of an attitude."

      Problem 2: Phase 2 collapsing into ordinary negotiation.
          - Students might ignore the language restriction and just talk in normal language to agree on policies, then write down a simplified version. 
          - Handling: Require that the ratified policies be written in the allowed language and read aloud. If they use a disallowed construction, they get no points for that policy.

      Problem 3: Dispute stage running long.
          - Handling: Set a strict time limit for each event resolution (e.g., 5 minutes per event). If they don't resolve, they get 0 points.

      Problem 4: The groups might not have the intended dispute because they found a clever workaround.
          - Handling: The facilitator should be ready with additional scenarios that break the workaround. For example, if they listed specific actions, then introduce a new action (like stealing) that wasn't on the list.

   8. What the Game Cannot Reproduce:

      The game only shows the problem for a naive expressivism that uses simple, non-embeddable attitudinal expressions. It does not address sophisticated expressivist accounts that use higher-order attitudes or complex conversational norms to explain embeddings. The facilitator must clarify that the game is only targeting the naive version, and that real expressivists have developed more advanced theories (like Blackburn's quasi-realism, Gibbard's norm-expressivism) to handle embeddings. The verdict of the game should be seen as a challenge for expressivism, not a refutation, and the students should be encouraged to think about how expressivists might respond.

   9. Summary:

      Summary: Split students into groups using a restricted language (descriptive + atomic attitudinal expressions), then have them express atomic attitudes (Phase 1), attempt to formulate conditional/negated policies that embed attitudes and face failure (Phase 2), and finally experience a dispute when applying the policies due to embedding limitations (Phase 3), leading to a debrief on the Frege-Geach problem.
answer: |-
  ### Session Design: "The Policy Ratification Game"

  **Materials**:
  - **Scenario Cards**: 3 sets (Phase 1: Atomic Scenarios; Phase 2: Policy Scenarios; Phase 3: Event Reveals).
  - **Language Tokens**: Red cards for attitudinal vocabulary (e.g., "Boo [X]!", "Hurrah [Y]!"), blue cards for descriptive vocabulary (e.g., "It rains", "Temperature > 20°C").  
  - **Scoreboard**: Tracking points (1-3 per decision; max 15 points/group).  
  - **Timer**: For strict 15-minute phases.  

  **Group Setup**:  
  - Split 12 students into 3 groups of 4. Each group is a "Policy Committee" for a fictional community.  
  - Each group gets red (attitudinal) and blue (descriptive) vocabulary cards. **Attitudinal terms are atomic only**—no embeddings allowed.  

  **Rules**:  
  1. **Language Restrictions**:  
     - Descriptive vocabulary: Can be embedded (e.g., "If [descriptive], then...").  
     - Attitudinal vocabulary: Only standalone assertions (e.g., "Boo lying!" is allowed; "*If* Boo lying!..." is illegal).  
     - Penalty: -1 point for illegal embeddings.  
  2. **Points Scheme**:  
     - **Phase 1**: +1 per consensus on atomic attitudes.  
     - **Phase 2**: +2 per ratified policy (only if unambiguous).  
     - **Phase 3**: +3 if policy applied correctly; 0 if dispute arises.  
     - **Embeddings are necessary** to avoid point loss in Phases 2–3 (e.g., policies require conditionals).  

  ---

  ### Phase Sequence (90-Minute Session):  

  **Phase 1: Atomic Attitudes (15 min)**  
  - **Goal**: Establish consensus on simple moral claims.  
  - **Activity**: Groups debate and express attitudes using red cards for 3 scenarios (e.g., "Lying in emergencies", "Breaking promises").  
  - **Example**: Unanimous "Boo lying!" for Scenario 1.  
  - **Intent**: Show attitudinal vocabulary works for atomic claims.  

  **Phase 2: Policy Ratification under Uncertainty (25 min)**  
  - **Goal**: Ratify conditional policies using *both* vocabularies.  
  - **Activity**: Groups draft 3 policies:  
    1. *Easy*: Descriptive embedding ("If it rains, cancel the picnic").  
    2. *Hard*: Attitudinal embedding ("If lying is wrong, expel liars").  
    3. *Harder*: Negation/Disjunction ("Either cheating is wrong, or we disband").  
  - **Critical Moment**: Groups hit language limits when drafting #2–3.  
    - **Predictable Failure**: Attempts to embed "Boo lying!" in conditionals (e.g., "*If* Boo lying!...") are illegal.  
    - **Consequence**: Groups must choose—lose points or misrepresent the policy (e.g., change to "If someone lies..." which alters meaning).  
  - **Intent**: Force need for embeddings; expose attitudinal vocabulary’s inadequacy.  

  **Phase 3: Event Resolution & Dispute (25 min)**  
  - **Goal**: Apply policies after "events" are revealed.  
  - **Activity**:  
    1. **Event Card 1** (Descriptive): "It rained" → Groups apply Policy #1 easily.  
    2. **Event Card 2** (Attitudinal): "A student lied to protect a friend" → Groups apply Policy #2.  
  - **Critical Moment**:  
    - Two students (per group) who agreed on "Boo lying!" in Phase 1 now disagree on Policy #2:  
      - *Student A*: "We all booed lying, so expel!"  
      - *Student B*: "But Policy #2 was *conditional*—we never agreed *when* lying is wrong!"  
    - **Dispute Trigger**: Ambiguity in how (or if) the conditional was recorded.  
  - **Consequence**: Groups lose points if unresolved.  

  ---

  ### Debrief (15 min):  
  - **Guided Discussion**:  
    1. **Phase 1 → Asserted Claims**: "Atomic attitudes worked—you expressed 'boo' for lying."  
    2. **Phase 2 → Embedded Claims**: "Why couldn’t you say *the same thing* in conditionals? What changed?"  
    3. **Phase 3 → Logical Stability**: "When you argued in Phase 3, you needed the *meaning* of 'lying is wrong' to stay consistent between assertion and embedding—but it didn’t."  
    4. **The Expressivist Challenge**: "If moral claims are just attitudes, what does uttering a conditional *express*? A mood about a mood?"  
  - **Name the Problem**: "You’ve encountered the Frege-Geach problem: how embeddings threaten expressivism."  

  ---

  ### Predictable Problems & Solutions:  
  1. **Smuggling Descriptive Language**:  
     - *Risk*: Students say, "If lying occurs..." instead of "If lying is wrong..." to dodge embeddings.  
     - **Solution**: Penalize (-1 point) and intervene: "Does 'lying occurs' mean the same as 'lying is wrong'?"  

  2. **Phase 2 Collapses into Negotiation**:  
     - *Risk*: Groups ignore language rules and "handshake deal" on policies.  
     - **Solution**: Require written policies using vocab cards; reject illegible ones.  

  3. **Dispute Stage Runs Long**:  
     - *Risk*: Students dig into moral debate vs. language failure.  
     - **Solution**: Use timer; ask: "Why can’t your language resolve this?"  

  4. **Overly Clever Workarounds**:  
     - *Risk*: Inventing meta-attitudes (e.g., "Boo-toward-lying!").  
     - **Solution**: Ban new terms; redirect: "Does this capture the conditional?"  

  ---

  ### What the Game Cannot Reproduce:  
  The game only challenges **naive expressivism** (simple "boo/hurrah"). It *cannot* adjudicate whether **sophisticated expressivism** (e.g., Blackburn’s quasi-realism, Gibbard’s norm-expressivism) solves the problem by invoking higher-order attitudes or conversational norms. **Facilitator Note**: "Today’s game shows why expressivists *need* complex machinery—it doesn’t prove they can’t build it."  

  ---

  **Summary**: Students in groups use a restricted language (atomic attitudinal + embeddable descriptive vocabulary) to express atomic attitudes (Phase 1), fail to embed attitudes in conditionals/negations during policy ratification (Phase 2), and collapse into disputes when applying policies (Phase 3), culminating in a debrief on the Frege-Geach problem.
