prompt: |-
  I'm a software engineer so I keep framing this as "the data was alredy in the database before the model was even trained, so how can it be evidence for the model?" which I think is basically the old evidence problem in Bayesian confirmation theory. As I understand it: if the evidence E is already known, then P(E) = 1, and Bayes' rule can't give the new theory T any boost from it — you end up with P(T|E) = P(E|T)P(T), which is at most P(T). The classic example is the anomalous precession of Mercury's perihelion, which was measured long before general relativity. I'd like a short dialogue between a Bayesian confirmation theorist and a likelihoodist trying to figure out whether Mercury's perihelion actually confirms GR. The Bayesian has to deal with the fact that P(E) = 1 means there's no update, and the likelihoodist has to deal with the fact that their account is about likelihood ratios, not about the agent's actual credences. Make both of them competent and make them actully respond to each other's arguments, not just take turns restating their position.
reasoning: |-
  We are going to create a dialogue between two characters: a Bayesian Confirmation Theorist (Bayesian) and a Likelihoodist. The topic is whether the anomalous precession of Mercury's perihelion (which was known before Einstein developed General Relativity) actually confirms General Relativity (GR). The Bayesian must address the issue that if the evidence E (Mercury's precession) is already known, then P(E)=1 and Bayes' rule doesn't update the probability of GR. The Likelihoodist must address that their framework uses likelihood ratios but doesn't directly update credences.

  The dialogue should be a back-and-forth with each responding to the other's points.

  Let's set the scene: They are in a philosophy of science conference during a coffee break.

  Characters:
  - Bayesian Confirmation Theorist (Bayesian): Defends that confirmation is about updating degrees of belief via conditionalization. But must address the problem of old evidence.
  - Likelihoodist: Believes that evidence E supports hypothesis H1 over H2 if P(E|H1) > P(E|H2). But must address that this doesn't tell us about the posterior probability of H1.

  We start:

  **Bayesian**: So, about Mercury's perihelion precession and General Relativity. It's often said that this was a great confirmation of GR. But how can that be? The precession was known long before Einstein. So when we condition on E, which we already know, P(E)=1. Then by Bayes' rule: P(GR|E) = P(E|GR) * P(GR) / P(E) = P(E|GR) * P(GR). But since P(GR) is the prior, we don't get any boost. It seems like the evidence doesn't confirm GR!

  **Likelihoodist**: I see your point, but I think you're missing the likelihoodist perspective. We don't focus on the absolute posterior probability. Instead, we look at the likelihood ratio. Consider GR versus Newtonian gravity. The likelihood of the evidence under GR is much higher than under Newtonian gravity. That is, P(E|GR) >> P(E|Newton). So the evidence supports GR over Newtonian gravity.

  **Bayesian**: But that doesn't tell me whether to believe in GR more! Your likelihood ratio only tells me that GR is better than Newton. But what if both are terrible? And more importantly, in my Bayesian framework, since E is already known, I can't condition on it to update. So how do I account for the fact that when Einstein came up with GR, scientists did update their beliefs?

  **Likelihoodist**: That's a fair challenge. But note that the likelihood ratio is a measure of comparative support. And scientists at the time did have Newtonian gravity as the incumbent theory. So when GR came along and explained the anomaly, it provided strong support relative to the old theory. As for updating when E is old, maybe we should think counterfactually: if we didn't know E, then learning E would boost GR a lot.

  **Bayesian**: Ah, the counterfactual approach! That's one solution proposed by Bayesians like Garber, Jeffrey, and later others. We imagine a counterfactual scenario where we didn't know E. Then we set P'(E) < 1 and update. But that seems a bit artificial. How do we set the prior in that counterfactual scenario? And also, it's not the actual history.

  **Likelihoodist**: Exactly. That's why I stick to likelihood ratios. They don't require us to imagine what we would believe if we didn't know E. They just tell us that the evidence is much more expected under GR than under Newton. And that's objective: it's about the probabilities the theories assign to the evidence.

  **Bayesian**: But what about the prior? In your framework, you ignore the prior. That means that if I have two theories that both predict E with high probability, but one is completely ad hoc (like a theory built just to fit E) and the other is simple and broad, your likelihood ratio doesn't distinguish them. But surely, the ad hoc theory shouldn't get the same support.

  **Likelihoodist**: That's a limitation, I admit. But in the case of GR, it wasn't ad hoc. It was a broad theory that made many novel predictions. The perihelion precession was a consequence of the theory, not a built-in assumption. And the likelihood ratio still tells us that the evidence supports GR over Newton.

  **Bayesian**: But let me push on the old evidence problem again. Suppose we are at a time when the precession is known but GR hasn't been proposed. Then we have P(E)=1. Now GR is proposed. How do we assign P(E|GR)? Since we know E, we might be tempted to set P(E|GR)=1. But that would be wrong because GR didn't exist then. So we have to assign P(E|GR) based on what we think GR would predict if it were true, without using the fact that we know E.

  **Likelihoodist**: That's a good way to put it. We evaluate P(E|GR) by understanding the theory and what it predicts, without using the knowledge of E. So even though we know E, we can still compute the likelihood as if we didn't. Similarly for Newton. So the likelihood ratio is still meaningful.

  **Bayesian**: So in effect, we are temporarily setting aside our knowledge of E to compute the likelihoods? That sounds like a kind of counterfactual after all. But perhaps it's more natural because we are just using the theory's predictive content. I think some Bayesians accept this: we use the objective chances or the probabilities that the theory itself assigns. So P(E|GR) is the probability that GR assigns to E, which might be 1 (if it's a deterministic prediction) or high. And we do the same for the alternative theory.

  **Likelihoodist**: Precisely. So even if E is old, we can still compute the likelihood ratio and see that it strongly favors GR. And that's why scientists took it as strong confirmation. They didn't need to update the probability of E because they already knew it, but they could see that GR explained it naturally while Newton didn't.

  **Bayesian**: I think we are converging. So the Bayesian might say: to avoid the old evidence problem, we should use the probabilities that the theories themselves assign to the evidence, and we do that without conditioning on our actual knowledge of E. Then we can update our credence in GR by the likelihood ratio. But note: this update would only be valid in a counterfactual scenario where we didn't know E. In reality, we do know E, so we have to adjust our prior for GR to account for the fact that we haven't updated on E yet.

  **Likelihoodist**: That sounds complicated. Why not just stick to the likelihood ratio as a measure of evidence? It's simple and objective. And it tells us that Mercury's precession is evidence for GR relative to Newton.

  **Bayesian**: Because we want to know how much to believe GR! The likelihood ratio alone doesn't give us that. For example, if GR had a very low prior, even a high likelihood ratio might not make it credible. But in this case, the prior for GR wasn't zero. And the likelihood ratio was huge. So it did lead to high posterior belief.

  **Likelihoodist**: But you have to admit that the old evidence problem is a real issue for Bayesians. You have to resort to counterfactuals or other tricks. We likelihoodists avoid that by focusing on the relative evidence.

  **Bayesian**: True, but I think we can handle it. And we get the benefit of a full probabilistic account. Anyway, in the case of Mercury, I think we both agree that the perihelion precession does confirm GR. We just have different ways of making sense of it.

  **Likelihoodist**: Agreed. And for practical purposes, the likelihood ratio is a key part of the story.

  **Bayesian**: Indeed. Thanks for the chat. I think I have a better handle on the old evidence problem now.

  **Likelihoodist**: Likewise. I see the challenges for both approaches.

  [End of dialogue]
answer: |-
  **Bayesian Confirmation Theorist (BCT):** Okay, let's tackle Mercury's perihelion precession and General Relativity (GR). The evidence \(E\)—Mercury's anomalous precession—was known before Einstein proposed GR. So \(P(E) = 1\), right? Bayes' rule says \(P(\text{GR}|E) = \frac{P(E|\text{GR}) P(\text{GR})}{P(E)}\). But with \(P(E) = 1\), this simplifies to \(P(\text{GR}|E) = P(E|\text{GR}) P(\text{GR})\). That's just the prior \(P(\text{GR})\) scaled by \(P(E|\text{GR})\), which is at most \(P(\text{GR})\) if \(P(E|\text{GR}) \leq 1\). How can \(E\) possibly *confirm* GR? It seems like old evidence can't boost a new theory at all.  

  **Likelihoodist (L):** I get your point, but you're conflating confirmation with *absolute* belief updating. Likelihoodism isn't about \(P(\text{GR}|E)\); it's about *relative* support. For Mercury, \(P(E|\text{GR})\) is high—GR predicts the anomaly exactly—while \(P(E|\text{Newton})\) is nearly zero because Newtonian gravity couldn't explain it. The likelihood ratio \(\frac{P(E|\text{GR})}{P(E|\text{Newton})}\) is huge, so \(E\) strongly supports GR over Newton. That's confirmation: evidence distinguishes theories.  

  **BCT:** But likelihood ratios alone don't tell me how to update my *credence* in GR! Suppose GR had a tiny prior—say, \(P(\text{GR}) = 0.001\)—because it was radical. Even with a large likelihood ratio, \(P(\text{GR}|E)\) might still be low. Worse, your approach ignores the fact that \(E\) is old. If \(P(E) = 1\), how do you even compute \(P(E|\text{GR})\) without circularity? You're smuggling in counterfactuals.  

  **L:** Not smuggling—explicitly using them! We compute \(P(E|\text{GR})\) based on GR's *predictive content*, ignoring our knowledge that \(E\) is true. Think of it as: "If GR were true, how likely is \(E\)?" GR predicts ~43 arcseconds per century; Newton predicts ~0. That's objective, regardless of when \(E\) was observed. The likelihood ratio measures how well \(E\) fits GR versus alternatives. For scientists in 1915, that ratio *was* the evidence.  

  **BCT:** Fine, but Bayesianism needs to handle the agent's actual epistemic state. If I *know* \(E\), I can't "ignore" it—that’s not how conditioning works. One solution is counterfactual Bayesianism: imagine a state where \(E\) is unknown, set \(P'(E) < 1\), then update to \(P'(\text{GR}|E)\). After that, we sync back to reality. But it’s messy—how do I set \(P'(E)\) fairly?  

  **L:** Exactly! That’s why likelihoodism avoids priors and posteriors. We don’t need \(P'(\text{GR})\) or \(P'(E)\). We just say: given the theories, \(E\) is much more probable under GR. It’s a comparative claim. And historically, when Einstein presented GR, physicists didn't recast their entire belief system—they saw that GR *fit* the anomaly perfectly while Newton didn’t. The likelihood ratio captured that.  

  **BCT:** But comparatives aren't enough. Suppose some crank theory \(T_{\text{crank}}\) also predicts \(E\) with \(P(E|T_{\text{crank}}) = 1\), but it’s ad hoc. Your likelihood ratio \(\frac{P(E|\text{GR})}{P(E|T_{\text{crank}})} = 1\) says \(E\) doesn’t favor GR over \(T_{\text{crank}}\). Yet intuitively, GR is better confirmed because it’s not ad hoc. Bayesianism handles this with priors: \(P(\text{GR})\) incorporates simplicity, unification, etc.  

  **L:** Fair—likelihoodism has limits. But for Mercury, GR *wasn’t* ad hoc; it derived \(E\) from fundamental principles. And we can extend likelihoodism with model selection criteria (like AIC) to penalize complexity. Still, the core insight holds: \(E\) supports GR over Newton because \(P(E|\text{GR}) \gg P(E|\text{Newton})\). Without priors, we avoid your old-evidence paradox.  

  **BCT:** ...I see your point. Maybe we can reconcile this. For old evidence, Bayesians can interpret \(P(E|\text{GR})\) as the *objective probability* GR assigns to \(E\), evaluated independently of knowing \(E\). Then, even with \(P(E) = 1\), we can treat \(P(E|\text{GR})\) as a "boost factor" for GR’s credibility—it’s not literal updating, but it explains why scientists felt confirmed. Essentially, \(P(E|\text{GR})\) reveals GR’s explanatory power.  

  **L:** That’s closer! And it’s consistent with likelihoodism: the ratio \(\frac{P(E|\text{GR})}{P(E|\text{Newton})}\) quantifies that explanatory advantage. We don’t need to say \(E\) increased \(P(\text{GR})\)—it justified GR *relative* to the background of alternatives. For confirmation, that’s what matters.  

  **BCT:** Agreed. So in practice, Mercury’s precession confirms GR because (1) GR predicts it with high likelihood, (2) alternatives don’t, and (3) this is evidentially significant even if \(E\) is old—we just handle it via counterfactual likelihoods or explanatory judgments. The Bayesian update problem is technical, not fatal.  

  **L:** Exactly. And likelihoodism complements that by focusing on the evidence-theory fit without getting tangled in credences. So, are we good?  

  **BCT:** We’re good. Old evidence is still a headache, but it doesn’t undermine confirmation—it just forces us to think more carefully about how theories latch onto the world.
