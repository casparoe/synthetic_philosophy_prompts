  Regarding the inclusion of subspecies and distinct population segments, I think this reveals that the Act is actually protecting evolutionary significant units - units that represent unique evolutionary lineages with conservation value. Humans also play a role in determining what gets protected based on what we value.

  If we adopted a different species concept, conservation law would need significant changes. Using the biological species concept would make subspecies protection problematic since they can interbreed. With the phylogenetic species concept, we'd see many more "species" that might need protection. The ecological species concept would shift focus to functional roles in ecosystems rather than taxonomic classifications.

