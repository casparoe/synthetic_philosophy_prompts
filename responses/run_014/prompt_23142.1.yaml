  ## Eulogy for Dr. Alan Reyes

  Friends, family, colleagues… we gather with heavy hearts to remember Dr. Alan Reyes. My mentor. Our friend. A husband, a father, a physician who profoundly shaped not just a department, but countless lives, including my own for fifteen years.

  Those of us who knew Alan outside these walls knew his quiet wit, his steadfast loyalty, the way he could listen with such patient stillness. He cherished his family, found solace in the garden, and possessed a dry humor that could disarm the most stressful day. He wasn't a man of grand pronouncements, but of deep, abiding presence.

  And then there was Alan in the emergency department, at the helm of trauma triage for thirty years. Some of you here witnessed this directly: the controlled chaos, the impossible weight of split-second decisions determining who got the next bed, the next ventilator, the last unit of blood. It’s here that the phrase was born: Alan Reyes “let the board decide.”

  To those who weren't there, that phrase might sound… detached. Technical, maybe. A surrender to numbers. But those of us who stood beside him, who learned from him in those crucible moments, understood it as something profoundly different. It wasn't coldness. It wasn't the abdication of judgment to a machine. It was, in fact, the deepest expression of Alan’s unwavering commitment to *every single person* who came through those doors.

  You see, Alan believed, with every fiber of his being, that each life carried an equal weight. An inherent worth that couldn’t be measured by age, charm, social standing, or even our own personal feelings. The young executive and the elderly retiree, the familiar face and the stranger – in Alan’s eyes, their claim on care, on *life itself*, was absolute and identical.

  And that’s precisely *why* he let the board decide. Because Alan knew the terrible power of the moment. He knew the insidious pull of unconscious bias – the natural human tendency to favor the young over the old, the charming over the difficult, the patient we knew over the one we didn't. He understood that his own face, his own familiarity, his own fleeting impressions, could become dangerous distortions in that high-stakes room.

  So, he built a system – that board – designed not to *replace* care, but to *protect* it. To shield it from the very human frailties we all possess. The numbers – the assessments of injury, prognosis, need – weren't a god he bowed to. They were a language he used to silence the noise of preference and prejudice. They were a tool to ensure that the agonizing decision of *who* received a scarce resource wasn't swayed by who *he* happened to like more, or who seemed, superficially, to have more life ahead.

  **He let the numbers speak because he refused to let his own voice drown out the equal claim of every patient.** Withholding a ventilator from the younger, more charming patient when the medical reality pointed elsewhere wasn't dismissing that young person's worth. It was the agonizing, necessary act of honoring the *equal* worth of the older patient whose need was, by the clearest measure available, greater at that moment. It was Alan saying, "I will not let my own humanity, flawed as it is, decide whose life matters more. I will force the decision to rest on the clearest understanding of who *needs* it most to survive *right now*."

  This wasn't efficiency. This wasn't detachment. This was radical, demanding humility. It was Alan setting aside his own power, his own potential biases, because he held each life so sacred, so equally deserving of a fighting chance. He understood that true respect wasn't always a warm hand on the shoulder in the moment of decision – sometimes, it was the fiercely impartial structure ensuring no hand on the scale. He refused to be the kind of god who picks favorites. He chose instead to be the guardian of a process that respected each person’s fundamental equality.

  To his family, who loved the whole man beyond the doctor: please know that this fierce, almost sacred, commitment to fairness *was* Alan. It wasn't separate from the man who loved you deeply. It was the same integrity, the same profound respect for the dignity of others, lived out under unimaginable pressure. He didn't see patients as numbers; he saw them as people whose individual worth demanded a system too fair to be swayed by anything less than their objective need.

  To my colleagues: We know the unbearable weight Alan carried so steadily. We saw the toll it took, even as he remained unflinching. We know that "letting the board decide" wasn't easy. It was the hardest kind of courage – the courage to trust a principle over an instinct, even when every instinct screamed otherwise. He showed us that honoring the individual *requires* structures of impartial justice, especially when lives hang in the balance.

  Alan Reyes saved lives, yes. But more importantly, he guarded the very idea that every life *is* worth saving. He did it not by playing the hero, but by being the unwavering steward of a process designed to see everyone equally. He let the board decide not because people were numbers, but because he believed too fiercely in their equal value to let anything *else* decide.

  We will miss his wisdom, his calm, his dry chuckle. We will miss the whole, complex, deeply principled man. But the clarity he brought to that impossible space, the fierce light of his equal regard for every human life – that light doesn't go out. It remains, a challenge and a comfort, for all of us who knew him. Rest well, Alan. You earned it.
