prompt: |-
  hey! so i'm a 3rd year undergrad taking upper-level philosophy of science and we just wrapped the induction unit — hume, then goodman's grue stuff and entrenchment. my study group is writing practice questions for the final since none of us trust the past papers. the problem is most grue questions out there are just "define grue, state the new riddle" which anyone can cram in an hour, so i want one that actually seperates the people who get it from the people who memorized the wiki page.

  i came up with a variant in my notes and i want the question built around it, cause it dodges all the canned answers. here it is: define a predicate "murkle" as applying to any emerald first observed before the next total solar eclipse visible from my city, just in case it's green, and to any emerald first observed after that eclipse just in case it's blue. (assume the eclipse date is known exactly, cloud cover is irrelevant, observations are done with proper lab equipment, whatever — don't let anyone weasel out on logistics). so murkle agrees with green on every emerald observed so far and disagrees on every one observed after the eclipse. now the two twists i actually want tested: (1) the eclipse is an event you can point to on a calendar, so murkle's cutoff feels "real" in a way grue's arbitrary time t never did — or does it? and (2) suppose a viral internet trend makes "murkle" a popular word and it gets used a million times before the eclipse, so it's now more entrenched than "green" among people under 25. does goodman's entrenchment story then say murkle is the projectible one, and if so is that a solution to the riddle or just a prediction about which word wins? that's the bit my study group keeps fighting about and i want the question to force students to take a side, not let them off with "goodman says entrenchment, entrenchment is good, done."

  what i need from you:

  - one essay question, suitable for a 90-minute final, that makes students use murkle (not grue) and cannot be answered by reciting the definition of grue or the standard summary of what goodman was up to
  - a model answer of about 600 words that actually takes a position on the entrenchment part (is it doing descriptive work or justificatory work?) instead of surveying every view
  - a marking scheme with 5 must-hit points, marks out of 20 total, and for each point one line on how students typically screw it up. the scheme should distinguish an A answer from a B answer by naming the specific moves each one must contain — my prof is a harsh grader and the scheme should reflect that

  also a couple of process things: roleplay as an experienced philosophy of science examiner who's graded a thousand grue essays and is thoroughly bored of them. think carefully about what makes a question un-crammable — like, brainstorm 2 or 3 candidate cruxes first, tell me briefly which you picked and why, and then write the full thing. and keep the question text itself under ~120 words, exam questions that run a whole paragraph are evil. no citations or reading lists needed, just the philosophy. thanks!!
