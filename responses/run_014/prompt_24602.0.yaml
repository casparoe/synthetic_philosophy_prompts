  - Yes: Leaf 6: **Global Anti-Realism** (e.g., a theistic view). *Awkward: every truth is known by some agent (e.g., God) including distant or past truths.*
  - No: This would be inconsistent because we have already said that there are no true universal Moorean propositions (which is equivalent to no unknown truths) and now we say there are unknown truths. So we won't offer this choice. (But if a student says this, they must go back.)

  But note: in the branch that goes to Q4 and then "No", we are denying that any agent can know a universal Moorean proposition. And then we go to Q7, which is equivalent to: are there unknown truths? If we say "Yes", then we have a true universal Moorean proposition, and KP says it is knowable, but we just said it is not knowable. Contradiction. So we force the student to say "No" to unknown truths? Or we don't offer "No" in Q7? 

  We can skip Q7 and say: if you answer "No" to Q4, then you are committed to there being no true universal Moorean propositions, which means there are no unknown truths. So then we go directly to Leaf 6: Global Anti-Realism.

  Similarly, in the branch for Q3: if you answer "No", then you are committed to either classical reductio (leading to Solipsistic Idealism) or not (leading to Intuitionist).

  So the tree becomes:

  Q1: Restrict KP?
  - Yes: Leaf 1: Restrictionist.
  - No: Q2: Same-agent for indexical Moorean?
     - Yes: Q3: Can the agent know the indexical Moorean?
          - Yes: Q5: How avoid contradiction? -> Closure Denier or Non-Factivity.
          - No: Q6: Accept classical reductio? 
               - Yes: Leaf 4: Solipsistic Idealism.
               - No: Leaf 5: Intuitionist.
     - No: Q4: Can any agent know the universal Moorean? 
          - Yes: Q5: How avoid contradiction? -> Closure Denier or Non-Factivity.
          - No: Leaf 6: Global Anti-Realism. (Because if no agent can know a universal Moorean proposition, and KP holds, then there cannot be any true universal Moorean proposition, which means there are no unknown truths.)

  Now, this tree has leaves:

  1. Restrictionist
  2. Closure Denier
  3. Non-Factivity
  4. Solipsistic Idealism
  5. Intuitionist
  6. Global Anti-Realism

  Now, let's write the tree in a compact form:

  **The Tree**

  0. Start: You are bothered by Fitch's paradox but accept the setup (KP, unknowability of Moorean propositions, classical logic initially).

  1. **Q1: Do you restrict the knowability principle (KP) to avoid the paradox?**
     - Yes -> **Leaf 1: Restrictionist** (e.g., Dummett). *Awkward: must provide a principled restriction that excludes Moorean propositions without being ad hoc.*
     - No -> Go to 2.

  2. **Q2: For an indexical Moorean proposition (e.g., "p and I don't know p"), must it be knowable by the same agent (the "I")?**
     - Yes -> Go to 3.
     - No -> Go to 4.

  3. **Q3: Can the agent (the "I") come to know that indexical Moorean proposition?**
     - Yes -> Go to 5.
     - No -> Go to 6.

  4. **Q4: Can any agent know a universal Moorean proposition ("p and nobody knows p")?**
     - Yes -> Go to 5.
     - No -> **Leaf 6: Global Anti-Realism** (e.g., a theistic view). *Awkward: commits to every truth (even about the distant past or faraway galaxies) being known by some agent at some time.*

  5. **Q5: How do you block the contradiction from an agent knowing the Moorean proposition?**
     - Deny that knowledge distributes over conjunction (i.e., deny that K(p∧q) entails Kp and Kq) -> **Leaf 2: Closure Denier** (e.g., some contextualists). *Awkward: knowledge of a conjunction doesn't imply knowledge of the conjuncts.*
     - Deny that knowledge is factive (i.e., deny that Kp entails p) -> **Leaf 3: Non-Factivity** (rare, if ever defended). *Awkward: knowledge isn't truthful; an agent can know a falsehood.*

  6. **Q6: Do you accept the classical reductio ad absurdum argument?**
     - Yes -> **Leaf 4: Solipsistic Idealism** (e.g., Berkeleyan idealism for the self). *Awkward: you are omniscient; all truths are known by you.*
     - No -> **Leaf 5: Intuitionist** (e.g., inspired by intuitionistic logic). *Awkward: rejects classical logic in other areas of reasoning.*

  **The Leaves**

  1. **Restrictionist**: This position restricts the knowability principle to a subclass of propositions (e.g., "basic" or non-epistemic propositions). *Awkward commitment: Must draw a boundary between knowable and non-knowable truths in a way that excludes Moorean propositions without being arbitrary.*

  2. **Closure Denier**: This position denies that knowledge is closed under conjunction elimination. *Awkward commitment: An agent can know a conjunction without knowing the conjuncts, which seems counterintuitive.*

  3. **Non-Factivity**: This position denies that knowledge is factive, allowing that an agent might "know" a false proposition. *Awkward commitment: Knowledge is not necessarily of truths, which radically departs from the standard conception of knowledge.*

  4. **Solipsistic Idealism**: This position holds that there are no true indexical Moorean propositions because the agent (oneself) is omniscient. *Awkward commitment: You are omniscient; every truth is known by you.*

  5. **Intuitionist**: This position rejects the classical reductio step, typically by adopting intuitionistic logic where the proof is not valid. *Awkward commitment: Must abandon classical logic in other areas, which might be costly.*

  6. **Global Anti-Realism**: This position holds that there are no unknown truths; every truth is known by some agent at some time. *Awkward commitment: Even obscure truths (e.g., about the distant past) are known by some agent (possibly an ideal agent like God).*

  **Empty Corners**

  The tree allows some combinations that are not occupied by any named position:
  - The path where one answers "Yes" to KP being unrestricted, "No" to same-agent knowability for the indexical, "Yes" to any agent being able to know the universal Moorean proposition, and then avoids the contradiction by either denying closure or factivity. However, positions that deny closure or factivity are rarely held and not specifically tied to this path. They are named but very niche.
  - The path answering "No" to Q1 and then "No" to Q2 and "No" to Q4 leads to Global Anti-Realism, which is occupied. 
  - The path answering "No" to Q1, "Yes" to Q2, "No" to Q3, and "No" to Q6 leads to Solipsistic Idealism, which is occupied.

  But note: the tree does not have a branch for someone who answers "Yes" to Q4 (any agent can know the universal Moorean) and then avoids the contradiction by some means other than denying closure or factivity. But we don't know of any other means, so we don't include it.

  **What the Tree Can't Tell**

  The tree may not distinguish between:
  - **Restrictionist** and **Global Anti-Realism** in terms of the motivation for the restriction. An extra question: "Do you think some truths are in principle unknowable by any agent?" Restrictionist says yes (for some truths, if they are not in the restricted class), while Global Anti-Realism says no.
  - **Closure Denier** and **Non-Factivity** might be chosen for different reasons, but the tree doesn't capture why one would choose one over the other. An extra question: "Is knowledge always of truths?" would split them: Non-Factivity says no, Closure Denier may say yes.

  Also, the tree does not explicitly capture the difference between the indexical and universal Moorean propositions in every leaf. For example, a Global Anti-Realist might still be concerned with the indexical proposition, but the tree routes them away from that branch.

  We hope this tree helps the student find a position.
answer: |-
  ### The Tree  
  Start: You accept Fitch's setup: the knowability schema (if true, knowable), Moorean truths (e.g., "p and I don’t know p") are unknowable, and classical reductio leads to absurdity.  

  1. **Reject unrestricted knowability?**  
     - *Yes* → **Leaf 1: Restrictionist**  
     - *No* → Proceed to 2.  

  2. **Same-agent knowability?** (Must "knowable" mean knowable *by the agent considering the proposition*, e.g., "I" in "p and I don’t know p"?)  
     - *Yes* → Proceed to 3.  
     - *No* (Knowable by *some* agent, not necessarily the speaker) → Proceed to 4.  

  3. **Can the speaker know their own Moorean proposition?** (e.g., Can "I" know "p and I don’t know p"?)  
     - *Yes* → Proceed to 5.  
     - *No* → Proceed to 6.  

  4. **Can any agent know the universal Moorean proposition?** (e.g., "p and nobody knows p")  
     - *Yes* → Proceed to 5.  
     - *No* → **Leaf 4: Global Anti-Realism**  

  5. **How to block the contradiction?**  
     - Deny knowledge distributes over conjunction (K(p∧q) → Kp ∧ Kq) → **Leaf 2: Closure Denier**  
     - Deny knowledge is factive (Kp → p) → **Leaf 3: Non-Factivity**  

  6. **Accept classical reductio?**  
     - *Yes* → **Leaf 5: Solipsistic Idealism**  
     - *No* → **Leaf 6: Intuitionist**  

  ---

  ### The Leaves  
  1. **Restrictionist** (e.g., Dummett): Rejects universal knowability. *Awkward commitment*: Must explain why some truths (e.g., Moorean propositions) are *in principle unknowable*, undermining the idealist motivation for knowability.  
  2. **Closure Denier** (e.g., Edgington): Rejects closure under conjunction. *Awkward commitment*: Agents can know a conjunction (e.g., "p and I’m ignorant") without knowing its conjuncts, violating intuitive norms of rationality.  
  3. **Non-Factivity** (Unnamed): Rejects factivity (Kp → p). *Awkward commitment*: Knowledge can be false, collapsing the distinction between knowledge and belief.  
  4. **Global Anti-Realism** (e.g., Theistic views): Denies unknown truths exist. *Awkward commitment*: Every truth (e.g., "there are exactly 10¹⁰⁰⁰ atoms in galaxy X") is known by *some agent*, requiring cosmic ideal observers.  
  5. **Solipsistic Idealism**: Denies true Moorean propositions exist for the speaker. *Awkward commitment*: *You* are effectively omniscient (all truths are known *by you*).  
  6. **Intuitionist** (e.g., Williamson): Rejects classical reductio (adopts intuitionistic logic). *Awkward commitment*: Abandons classical reasoning (e.g., double-negation elimination) in non-epistemic domains.  

  ---

  ### Empty Corners  
  - **Closure Denier + Non-Factivity**: The tree allows combining both (via Q5), but no one defends this—denying *both* closure *and* factivity is overkill and lacks motivation.  
  - **Solipsistic Idealism + Global Anti-Realism**: Choosing "No" at Q2 and "No" at Q4 leads only to Global Anti-Realism. Solipsistic Idealism requires the "same-agent" branch (Q2→Yes), so these leaves are mutually exclusive.  
  - **Restrictionist + Intuitionist**: Rejecting KP (Q1→Yes) skips later nodes. Combining restriction *with* intuitionistic logic is unexplored—it’s redundant or unstable.  

  ---

  ### What the Tree Can’t Tell  
  - **Restrictionist vs. Global Anti-Realist**: Both restrict knowability but differ on *why*. *Extra question*: "Are there *in-principle unknowable* truths?" Restrictionist says yes; Global Anti-Realist says no.  
  - **Closure Denier vs. Intuitionist**: Both avoid contradiction but for distinct reasons. *Extra question*: "Is the problem *logic* or *epistemology*?" Closure Denier blames epistemology (conjunction); Intuitionist blames logic (reductio).  
  - **Non-Factivity vs. Solipsistic Idealism**: The tree routes them separately, but neither is popular. *Extra question*: "Is knowledge inherently factive?" Non-Factivity denies it; Solipsistic Idealism preserves factivity by denying ignorance.
