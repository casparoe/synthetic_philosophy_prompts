prompt: |-
  I'm a graduate student coordinating a year-long reading group in value theory, and our two most senior members have spent that year locked in a disagreement about hard choices that everyone else thinks has become partly verbal. One of them is a comparativist: she holds that the better-than relation over options is complete, so for any two alternatives in a choice, one is strictly better, strictly worse, or exactly as good as the other — and that apparent cases to the contrary are really imprecision in our value concepts, uncertainty about the facts, or disguised ties. The other holds the parity view associated with Ruth Chang's work on hard choices: some alternatives are neither better, worse, nor equal, but stand in a fourth relation of being "on a par," which is why choices between, say, two careers or two lives of comparable but differently shaped value can be hard in a way that no amount of information or conceptual cleanup will dissolve. They have agreed to let me draft the joint statement of their adversarial collaboration, and I want to get it right rather than produce something bland they'd both sign because it says nothing.

  Please write the document. It should have a numbered section of claims both parties can sign — I'd expect at least some of these: that hard choices are not merely cases of evidential uncertainty; that a chooser facing one can act rationally without it being true that she chose the better option; that the phenomenology of struggle in such choices is real but not by itself evidence for any meta-view about comparability; and that "on a par" and "exactly equal" come apart in at least some descriptive sense, since equal options are interchangeable while par options resist arbitrage-like treatment in a way I'd want them to make precise. Then a disagreements section, ideally as a table, where each row states a single point of residual disagreement in wording its own side would accept — this is the part they'll fight over, so the formulations must be neither vacuous nor slanted.

  Finally, the cruxes, which I suspect include at least these: whether the small improvement argument for parity actually works or only shows something weaker; whether the comparativist's appeal to vagueness or imprecision in value can reproduce all the phenomena without a fourth relation; and whether the parity theorist's claim that in hard choices we can create reasons by putting ourselves behind an option presupposes incomparability or is equally available in cases of exact equality. For each crux, give the argument, case, or test both sides agree bears on it, and record each side's prediction in advance — for example, what each predicts about a case where a small improvement is made to one of two alternatives that seemed tied, and whether the improved option must thereby come out better. If you conclude that part of their dispute is merely verbal — say, a disagreement about whether "as good as" is being used to mean precise equality — identify which part and why, and separate it cleanly from what remains substantive.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between two parties: a comparativist and a parity theorist. The document should have:
   1. A section of agreed claims (numbered).
   2. A disagreements section (as a table, each row a single point of disagreement, wording acceptable to each side).
   3. A cruxes section, with each crux including the argument/case/test both agree bears on it and each side's prediction.

   Key agreed claims we expect (to be refined and expanded):
   - Hard choices are not merely cases of evidential uncertainty.
   - A chooser facing a hard choice can act rationally without it being true that she chose the better option.
   - The phenomenology of struggle in hard choices is real but not by itself evidence for any meta-view about comparability.
   - "On a par" and "exactly equal" come apart descriptively (e.g., interchangeability vs. resistance to arbitrage).

   Key disagreements:
   - The completeness of the better-than relation.
   - The existence of a fourth relation (parity).

   Cruxes:
   1. The small improvement argument: 
      - Case: Start with A and B that seem tied. Make a small improvement to A to get A+. If A+ is not better than B, then A and B were not tied but were on a par.
      - Comparativist: Predicts that in such a case, A+ must be better than B (because if A and B were tied, then any improvement breaks the tie in favor of A+). If not, it's because of vagueness or imprecision, but not a new relation.
      - Parity theorist: Predicts that sometimes A+ is not better than B, which shows that A and B were not tied but on a par.

   2. Vagueness/imprecision vs. parity:
      - Can the comparativist's appeal to vagueness account for all the phenomena (e.g., the struggle, the sense of incomparability) without introducing parity?
      - Parity theorist: No, because vagueness would still leave the options comparable (even if we can't know) and wouldn't explain the normative structure of hard choices (e.g., the possibility of creating reasons by commitment).
      - Comparativist: Yes, the phenomena can be explained by epistemic limitations and the vagueness of our value predicates.

   3. Creating reasons in hard choices:
      - Parity theorist: In hard choices (where options are on a par), we can create reasons for one option by putting our agency behind it, and this is not available in cases of exact equality because in equality, reasons are symmetric and no commitment is needed.
      - Comparativist: This creating of reasons is equally available in cases of exact equality, and it doesn't require incomparability (or parity) but rather a decision under symmetry.

   Additionally, we must identify any merely verbal disputes, such as the meaning of "as good as". For instance, the comparativist might use "as good as" to mean "exactly equal" or "at least as good and not worse", while the parity theorist might reserve "as good as" for exact equality and use "on a par" for a different relation.

   Steps:

   1. Draft the agreed claims section with numbered points.
   2. Draft the disagreements section as a table (using markdown for the table).
   3. Draft the cruxes section with each crux, the shared test/case, and the predictions.
   4. Identify and separate any merely verbal elements.

   Let's proceed.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Hard Choices in Value Theory

  #### **Agreed Claims**  
  Both parties endorse the following propositions:  

  1. **Hard Choices Transcend Epistemic Limitations**:  
     Genuinely hard choices are not resolvable through additional evidence or conceptual refinement alone. Such cases persist even under full information and precise value specifications.  

  2. **Rational Action Without Better Options**:  
     In hard choices, a chooser can act rationally *without* having selected the better option. Rationality does not require maximizing over a complete ordering.  

  3. **Phenomenology is Real but Inconclusive**:  
     The subjective experience of struggle in hard choices is a genuine feature of agency but does not entail metaphysical incomparability. This phenomenology is neutral between competing meta-ethical views.  

  4. **Parity and Equality are Descriptively Distinct**:  
     "On a par" and "exactly equal" differ in at least one descriptive respect:  
     - *Exactly equal* options are **interchangeable**; substituting one for the other leaves no rational grounds for preference.  
     - *On a par* options **resist arbitrage**: They admit of non-interchangeability (e.g., choosing career A over B commits to a distinct value "shape"), and small improvements to one do not necessarily break symmetry.  

  5. **Value Relations are Objective**:  
     Whether two options stand in a parity, equality, or betterness relation is a matter of objective normative structure, not subjective attitude.  

  ---

  #### **Residual Disagreements**  
  The table below isolates unresolved substantive divergences. Each row states a claim using phrasing acceptable to the respective side.  

  | # | Comparativist Claim                                                                 | Parity Theorist Claim                                                                 |
  |---|-------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | 1 | The better-than relation is **complete**: For any two options, one must be better, worse, or exactly equal to the other. | The better-than relation is **incomplete**: Some options are neither better, worse, nor equal, but on a par. |  
  | 2 | Apparent "gaps" in comparability reduce to **imprecise value predicates** or **epistemic uncertainty** about underlying facts. | "Gaps" reflect an **irreducible fourth relation** (parity) that cannot be eliminated by sharpening concepts or acquiring evidence. |  
  | 3 | In hard choices, rational commitment **selects** preexisting reasons but does not create new ones; symmetry-breaking is psychological. | In hard choices, rational commitment **creates new reasons** for one option when alternatives are on a par. |  

  ---

  #### **Cruxes: Tests, Predictions, and Arguments**  
  Both sides agree the following cases bear decisively on the dispute. Predictions are stipulated in advance.  

  ##### **Crux 1: The Small Improvement Argument**  
  - **Test Case**: *Let A and B be alternatives initially judged as equally good. Improve A by a marginal amount to yield A+ (e.g., a slightly higher salary in Job A vs. Job B). Can A+ fail to be better than B?*  
    - **Parity Prediction**: **Yes**. If A and B were on a par, A+ may remain incomparable to B (i.e., neither better nor worse). The improvement merely affirms parity by revealing its resilience.  
    - **Comparativist Prediction**: **No**. If A and B were truly equal, A+ *must* be better than B. Apparent failures arise from vagueness: A+ is better, but the margin falls below a precisification threshold for "better."  
  - **Substantive Stakes**: Parity requires the *possibility* of A+ ≯ B; comparativism denies it.  

  ##### **Crux 2: Vagueness vs. Parity**  
  - **Test Case**: *Consider options with complex, multidimensional values (e.g., Artist’s life vs. Scientist’s life) where verdicts persistently oscillate under reflection. Does this oscillation indicate semantic indecision or normative indeterminacy?*  
    - **Parity Argument**: Oscillation reflects **irreducible normative multiplicity**: Values are structured such that no single ordering exists. Vagueness accounts cannot explain why no precisification feels adequate.  
    - **Comparativist Argument**: Oscillation is **epistemic or semantic**: Better-than relations exist but are obscured by vague predicates (e.g., "meaningful") or incomplete knowledge.  
  - **Predictions**:  
    - Parity: The struggle to compare *will persist* under all precisifications.  
    - Comparativist: Under full precisification, comparability *must* emerge.  

  ##### **Crux 3: Commitment Creates Reasons**  
  - **Test Case**: *When choosing between symmetrical options (e.g., two identical $100 bills), can commitment generate new reasons? If not, does this distinguish equality from parity?*  
    - **Parity Claim**: Commitment creates reasons **only in parity cases** (e.g., choosing between parenting and career). In exact equality, reasons are symmetric, so commitment adds nothing.  
    - **Comparativist Claim**: Commitment **never creates reasons**; it only activates latent symmetries. Identical cases (equality) and vague cases (perceived ties) are psychologically parallel.  
  - **Shared Test**: If commitment generates a reason in a hard choice, is that reason *objective* (parity) or *psychological* (comparativist)?  

  ---

  #### **Merely Verbal Element**  
  The dispute over the phrase "**as good as**" is terminological:  
  - **Comparativist**: Uses "as good as" to include *exactly equal* and *not worse* (allowing for trichotomy).  
  - **Parity Theorist**: Uses "as good as" strictly for *exact equality*, reserving "on a par" for nontrivial alternativity.  
  **Resolution**: This divergence is verbal. Both agree "exactly equal" implies interchangeability, while "on a par" (if it exists) does not. The **substantive** disagreement is whether nontrivial alternativity *requires* a fourth relation.  

