  But note: the toggling sequence we have is symmetric? We start at t1=1 by turning on (so V_in=1 for [1,1.5)), then off at t2=1.5 (so V_in=0 for [1.5,1.75)), then on at t3=1.75 (V_in=1 for [1.75,1.875)), etc. The intervals are halving. The first on-interval is 0.5 minutes, then the off-interval is 0.25, then on for 0.125, off for 0.0625, etc.

  The total time the lamp is on: 0.5 + 0.125 + 0.03125 + ... = 0.5 * (1 + 1/4 + 1/16 + ...) = 0.5 * (1/(1-1/4)) = 0.5 * (4/3) = 2/3 minutes.
  The total time off: 0.25 + 0.0625 + ... = 0.25 * (1 + 1/4 + ...) = 0.25 * (4/3) = 1/3 minutes.

  Therefore, the input voltage is 1 for 2/3 of the time and 0 for 1/3 of the time in the interval [1,2). The average input voltage is (2/3)*V.

