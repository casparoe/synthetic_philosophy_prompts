  **A model that forces a definite state:**

  Consider a model where the lamp is connected to a circuit that has a resistor and a capacitor (an RC circuit). The switch toggles the input voltage between 0 and V. The lamp is on when the voltage across it is above a threshold. The voltage across the capacitor is continuous and satisfies:

  dV_c/dt = (V_in(t) - V_c) / (RC)

  where V_in(t) is the input voltage, which toggles between 0 and V at the Zeno times.

  Now, what happens as t approaches 2? The input voltage V_in(t) switches infinitely often in a finite time. However, the capacitor voltage cannot change instantaneously. The rate of change is bounded. Therefore, as the switching becomes faster, the capacitor voltage cannot keep up and will start to oscillate with decreasing amplitude? Not necessarily.

  In fact, the input V_in(t) is a step function that jumps at t_n. The function V_in(t) for t in [0,2) is a step function that jumps an infinite number of times. The capacitor voltage V_c(t) is the solution of the differential equation with that input. Because the input changes so rapidly near t=2, the capacitor voltage may approach a specific value at t=2.

