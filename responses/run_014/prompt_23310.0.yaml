  First, I need to recall Ramsey's key ideas. His probability theory is subjective, based on degrees of belief. He emphasized coherence to avoid Dutch books. Acts are evaluated by their outcomes, but he was clear that probabilities shouldn't depend on the act chosen. That's the core of his critique of causal decision theory predecessors. Also, his take on causality as prediction rules, not empirical claims, is crucial here.

  Now, acausal trade involves acting based on correlations between your decision procedure and a stranger's, without any causal link. The user wonders if Ramsey would see betting on such correlations as smuggling in a causal claim. The answer might hinge on whether the stranger uses the same decision procedure.

  Breaking it down: Ramsey's insistence on act-independent probabilities. In acausal scenarios, the correlation between decision procedures creates a link where your action affects the probability of the stranger's action. But for Ramsey, conditioning your probability on your own act would violate his requirement. He'd likely argue that you can't legitimately condition on your own choice because it introduces a dependency that isn't causal and messes with probability coherence.

  The user's friend sees FPA as extending EU to correlated agents. But Ramsey's framework might not accommodate that without violating his probability rules. If the stranger is running the same decision procedure, the user might think that makes a difference. However, even then, Ramsey would probably still reject conditioning on your own act. He'd want probabilities based on evidence before deciding, not on the act itself.

  Causality as prediction rules: Ramsey saw causal statements as guiding predictions. Acausal trade relies on predictive correlations without causation. He might accept using correlations for prediction but not when it involves conditioning on the act you're currently deciding on. That could feel like smuggling causality because it treats the correlation as if it's causal in the decision-making context.

  The user's deeper need seems to be understanding if their friend's view holds up under Ramsey's principles. They might also be seeking validation that their "vibes" critique has merit. By analyzing Ramsey's work, I can show that the friend's extension isn't straightforward, supporting the user's skepticism. Additionally, the user might want clarity on whether decision theory should handle acausal cases or if that overextends its scope.
answer: |-
  Based on Frank Ramsey's foundational work in probability, decision theory, and causality – particularly his papers "Truth and Probability" (1926) and "General Propositions and Causality" (1929) – his likely position on acausal trade would be deeply skeptical, bordering on rejection. Here's a reasoned analysis:

  **Ramsey's Core Principles Relevant to the Debate:**

  1.  **Probability as Degrees of Belief:** Probabilities are not objective features of the world, but *subjective degrees of belief* held by an agent. Their rationality is judged solely by *coherence* (avoiding Dutch books).
  2.  **Act-Independent Probabilities:** Crucially, Ramsey insisted that **the probability you assign to states of the world *must not depend* on which act you are contemplating.** This is the cornerstone of his critique of "moral philosophers" (like those proposing proto-causal decision theories) who allowed probabilities to vary with acts. He saw this as logically incoherent and leading to irrationality.
  3.  **Causality as Rules for Prediction:** Causal statements ("A causes B") are not empirical observations of necessity, but *rules or habits* an agent adopts to guide their predictions ("If I observe A, I expect B"). They are practical guides, not descriptions of metaphysical glue.
  4.  **Expected Utility Maximization:** Rational choice involves selecting the act that *maximizes expected utility*, calculated using coherent degrees of belief (probabilities) over states and the utilities of outcomes.

  **Analyzing Acausal Trade Through Ramsey's Lens:**

  1.  **The Fundamental Problem: Conditioning on Your Own Act:**
      *   Acausal trade scenarios (e.g., betting with a "stranger" whose decision procedure is perfectly correlated with yours via a common source, but causally isolated) require you to assign a high probability to the stranger performing a specific action *conditional on you performing a specific action* (e.g., P(Stranger Cooperates | I Cooperate) ≈ 1).
      *   **This directly violates Ramsey's act-independence principle.** For Ramsey, your probability for *any* state of the world (including the stranger's action) must be fixed *before* you consider which act *you* will choose. Conditioning that probability on *your own choice* reintroduces the very incoherence he sought to eliminate. He would see this as logically flawed and irrational from the outset.

  2.  **Smuggling in Causality?**
      *   Ramsey would likely argue that **yes, you are smuggling in a causal claim, or something functionally equivalent.** While he viewed causality *itself* as merely a predictive rule, conditioning P(Stranger's Act | My Act) implicitly treats the correlation *as if* it were causal in the decision-making context, even if you intellectually know it's acausal.
      *   Using this conditional probability in EU calculation gives *your act* a kind of "predictive efficacy" over the stranger's act within the decision model. For Ramsey, this predictive link, when used to condition the probability of the *stranger's act* upon *your contemplated act*, is the problematic step. It blurs the line he drew between fixed beliefs and the act of choosing. He would argue you should only use probabilities based on your *current* knowledge/beliefs *before* deciding.

  3.  **Does the Stranger Running the *Same* Decision Procedure Change Anything?**
      *   **Probably not, in Ramsey's framework.** Knowing the stranger uses an *identical* decision procedure might lead you to assign a *high prior probability* that they will *generally* act similarly to you in similar situations. This is fine for Ramsey – it's a belief about the world based on your knowledge of decision procedures.
      *   **However, it doesn't legitimize conditioning on *your specific act* during *this specific decision.*** Your prior belief might be "We both use FPA, so we often coordinate." But when calculating EU for *this* specific choice to Cooperate or Defect:
          *   You must use a fixed P(Stranger Cooperates) and P(Stranger Defects) based on your *current* total evidence *before* you commit to Cooperating or Defecting.
          *   You cannot legitimately say "P(Stranger Cooperates) becomes ≈1 *if I decide to Cooperate*." That conditional probability depends on the act under consideration, violating act-independence. Ramsey would demand you stick with your prior estimate of P(Stranger Cooperates) based solely on knowing they use FPA, *without* letting your own choice influence that probability within the calculation.

  **Ramsey's Likely Conclusion:**

  1.  **Not "Just Expected Utility":** He would strongly disagree with your friend. FPA isn't merely EU extended to correlated agents. It **fundamentally violates his core principle of act-independent probabilities** by allowing the probability assigned to another agent's action to depend on the act you are evaluating. He would see this as reintroducing the logical incoherence he identified and rejected.
  2.  **Rationality:** He would **not** consider betting based on acausal correlations (using the conditional probabilities central to FPA) rational. It relies on a probabilistically incoherent calculation method.
  3.  **Smuggling Causality:** He would argue that **yes, the way FPA uses conditional probabilities like P(Other's Act | My Act) effectively smuggles in a causal-like dependency within the decision calculus**, even if the underlying metaphysics is acausal. This functional dependency is what makes the calculation incoherent for him.
  4.  **Role of Same Decision Procedure:** Knowing the stranger uses the same procedure might rationally increase your *prior* belief that you'll both do the same thing. But it **does not** make conditioning on your *own specific act choice* during the EU calculation valid. The act-independence violation remains.

  **In essence:** Ramsey would likely side with you ("that's not decision theory, that's just vibes") on the core issue. He would argue that FPA's reliance on act-dependent conditional probabilities is a foundational error, making it incompatible with his coherentist, subjectivist, and act-independent conception of rational decision theory. He might see the *intuition* behind acausal trade, but would insist it cannot be coherently captured within his framework without violating his most fundamental rule. The "vibes" you sensed stem from this violation of the strict separation between belief (probability) and choice (act evaluation) that Ramsey considered essential for rationality.
