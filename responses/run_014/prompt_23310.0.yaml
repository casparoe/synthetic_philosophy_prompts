  Me and my friend got into a long argument last night about acausal trade and I'm still not sure who won. He thinks FPA is definately just expected utility extended to cases where your decision procedure is correlated with other agents' decision procedures, and I kept saying that's not decision theory, that's just vibes. I was going to settle it by asking what Frank Ramsey would have thought, since the whole framework is basically his. Can you try to reason out his likely position? Given his views on probability as degrees of belief, his requirement that the probability you assign to an act shouldn't depend on which act you're choosing, and his view that causal statements are rules for prediction rather than empirical claims — would he have considered betting on acausal correlations with a stranger rational, or would he have said you're smuggling in a causal claim? And does the answer change depending on whether the stranger is actually running the same decision procedure?
