  The audience is diverse: a presentist, a strict philosopher of physics, a grad student into quantum foundations, and neutral but skeptical colleagues. Each has distinct concerns. The presentist rejects physicalist bullying, the physicist hates loose simultaneity talk, the grad student brings up cosmic time, and the skeptics doubt physics-to-metaphysics moves.

  Key objections I need to cover:
  1. **Simultaneity conventionality:** The physicist will insist that choosing a frame doesn't resolve conventionality. The user's patch might be seen as arbitrary. They need to stress that existence claims are frame-dependent but ontologically committing, and that determinism applies regardless of frame choice.
     
  2. **Stein's local becoming:** The presentist might argue that local becoming is sufficient. The user must clarify that the openness we care about in deliberation requires a global past/future split, which local becoming can't provide. Concede locality but challenge its metaphysical adequacy.

  3. **Cosmic time from cosmology:** The grad student will bring up preferred foliation in cosmological models. The user needs to distinguish special vs. general relativity, noting that cosmic time isn't inherent to SR and that even in GR, it's model-dependent and not fundamental. If SR is the focus, cosmic time is irrelevant here.

  4. **Transitivity issue in Rietdijk-Putnam:** The philosopher of physics will question the transitivity of the "determines what is real" relation. The user should admit the technical point but argue that the spacelike separation still leads to eternalism. Emphasize that the existence of spacelike-related events forces eternalism.

  5. **Determinism vs. Ontology:** A skeptic might say the argument only shows determinism, not eternalism. The user must differentiate determinism (about events) from ontology (existence of future events). A determinist presentist still can't ontologically commit to future events being real now.

  6. **Physics-to-metaphysics leap:** Skeptics will question inferring metaphysics from physics. The user should concede it's an inference but argue that SR's structure constrains viable ontologies. The block universe best explains the relativistic structure.

  The "hope nobody asks" question is whether quantum mechanics undermines the argument. The user should admit QM adds complexity but note that relativistic QM still has a block structure. Stress that their chapter focuses on SR's implications, leaving QM for future work.

  I'll structure the Q&A prep sheet in order of expected objections, starting with the most damaging. The philosopher of physics's transitivity point is critical. Then the cosmic time objection. The Stein reply and simultaneity conventionality come next. Determinism vs. ontology and physics-to-metaphysics are important but slightly less damaging. 

  For each objection, provide a concise 2-3 sentence reply, note where it's soft, and suggest concessions. For example, on transitivity, concede the formal point but argue the conclusion still holds. On cosmic time, admit it's relevant in cosmology but not in the context of SR.

  Ensure the user is prepared to handle the presentist's emotional charge about physicists bullying metaphysicians by focusing on arguments rather than rhetoric. For the skeptic, emphasize that the inference is necessary but open to debate.

  Finally, the QM question is tricky. Advise the user to acknowledge it but bracket it for the dissertation's scope. Reaffirm that within SR, the argument stands, and QM considerations are separate.
answer: |-
  Here's a comprehensive Q&A prep sheet, structured by objection severity (High/Medium/Low damage), ordered by likely sequence, and tailored to your audience. Each objection includes a realistic reply, soft spots, and concessions.

  ---

  ### **High-Damage Objections (Core Argument Threats)**

  1.  **Objection (Philosopher of Physics):**  
      *"Your use of the Rietdijk-Putnam argument ignores the fatal transitivity flaw. The relation ‘event A determines what is real for observer O’ isn’t transitive: A can determine reality for O, O for O’, but A and O’* *can be spacelike separated. So A doesn’t determine reality for O’. Your ‘fixed frame’ patch doesn’t fix this—it just hides it behind arbitrary simultaneity."*  
      **Reply:** "In my frame-based approach, transitivity holds *within the chosen frame* because simultaneity slices are globally defined and transitive. The objection applies to frame-invariant formulations, but by fixing a frame, I ensure that ‘determines reality’ (i.e., lying in or before the past light cone) is transitive along inertial worldlines."  
      **Soft Spot/Concession:** Concede that transitivity fails *across frames*. Stress that your argument only requires consistency *within one frame* to establish eternalism. If pressed, admit Putnam’s original formulation *is* flawed, but your patch isolates the argument to a coherent structure.

  2.  **Objection (Quantum Foundations Grad Student):**  
      *"Why base metaphysics on *special* relativity? Our best cosmology (e.g., FLRW models) has a preferred cosmic time foliation. That restores global becoming—so your SR argument is irrelevant to *actual* physics."*  
      **Reply:** "Cosmic time exists only in specific cosmological models with high symmetry. SR governs local physics universally, and its inertial frames *are* physically significant where gravity is weak. Even with cosmic time, relativity of simultaneity *within* hyperslices undermines ‘global now’ arguments."  
      **Soft Spot/Concession:** Concede cosmic time *could* aid presentism in *some* models, but argue: (1) SR’s implications can’t be ignored at local scales, (2) cosmic time is contingent (e.g., absent in multiverse models), and (3) it’s a *structural* feature, not metaphysical becoming.

  ---

  ### **Medium-Damage Objections (Targeting Key Patches)**

  3.  **Objection (Philosopher of Physics, on Simultaneity):**  
      *"Calling a frame ‘arbitrary but fixed’ is sleight of hand. If simultaneity is conventional, your ‘fixed frame’ ontology is conventional too—so you haven’t shown what *really* exists, only what exists *relative to a convention*."*  
      **Reply:** "I’m not claiming frame-independent ontology. I argue that *whichever* convention you pick, the resulting ontology is eternalist. Conventionality doesn’t save presentism—it just pluralizes eternalism."  
      **Soft Spot/Concession:** Concede the ontology is frame-relative. Emphasize that this relativity still invalidates presentism, which requires a *unique* privileged present.

  4.  **Objection (Presentist, on Stein):**  
      *"You dismiss local becoming as insufficient for ‘openness,’ but that’s question-begging! Deliberation is *local*: I care about *my* future possibilities, not the Andromeda galaxy’s. Stein’s view captures this without your bloated block."*  
      **Reply:** "Local becoming can’t ground *temporal asymmetry* (e.g., why we affect the future but not the past). If openness is merely point-relative, the ‘settled past’ isn’t globally defined—undermining claims like ‘the past is fixed.’"  
      **Soft Spot/Concession:** Concede local becoming can handle some phenomenology. Argue it fails to capture core presentist commitments (e.g., a *shared* open future or objective temporal flow).

  ---

  ### **Low-Damage Objections (Conceptual/Strategic Pushback)**

  5.  **Objection (Skeptic Colleague):**  
      *"Your argument conflates determinism with ontology. Couldn’t a presentist accept SR and determinism, saying only the present exists—but what exists is *determined* by prior states?"*  
      **Reply:** "Determinism is about *what happens*; eternalism is about *what exists*. If the future is determined *and real now*, it’s not ‘open’ in the presentist sense. A determined but non-real future is incoherent—it would make truths about it ungrounded."  
      **Soft Spot/Concession:** Acknowledge the logical possibility but argue it’s unmotivated: SR’s spacetime structure treats all events equally, making ‘existence now’ ad hoc.

  6.  **Objection (Skeptic Colleague):**  
      *"Physics tells us ‘how,’ not ‘what.’ Why think SR’s formalism *dictates* metaphysics? Maybe it’s just a useful model for prediction, not ontology."*  
      **Reply:** "I agree physics underdetermines metaphysics. But SR’s core features—like invariant spacetime intervals—constrain viable ontologies. The block universe best explains *why* the theory works as it does."  
      **Soft Spot/Concession:** Concede this is inference-to-best-explanation, not deduction. Stress that rejecting *all* physical constraints on metaphysics risks obscurantism.

  ---

  ### **The Question You Hope Nobody Asks**
  **Objection (Philosopher of Physics/Grad Student):**  
  *"Quantum mechanics introduces intrinsic indeterminism. Doesn’t this undermine your entire argument? If the future isn’t determined, your ‘determinism implies eternalism’ claim collapses—and quantum becoming might restore global openness."*  

  **Why it’s dangerous:** It forces you to confront the elephant in the room: SR + QM (e.g., quantum non-locality, collapse theories) may complicate or refute your thesis.  

  **Reply (if asked):**  
  "My chapter focuses on SR’s *classical* ontology. QM adds complexity, but relativistic QFTs retain a block-like structure (e.g., the Tomonaga-Schwinger formalism). Crucially, *indeterminism* doesn’t entail *presentism*—events can be real but not determined. I’d argue QM’s ‘openness’ is compatible with eternalism."  

  **Damage Control:**  
  1. **Concede immediately:** "This is absolutely a live issue—I bracket QM here to isolate SR’s implications."  
  2. **Reframe:** "Even if QM introduces indeterminacy, SR’s *relativity of simultaneity* still blocks global becoming. Quantum ‘becoming’ would need to be frame-dependent too."  
  3. **Redirect:** "For now, I’m arguing that *if* we take SR seriously, presentism is untenable. QM may change the game, but it doesn’t rescue the view I’m targeting."  

  ---

  ### **Tactical Notes for the Seminar**
  - **Order Expectation:** Start with transitivity (Philosopher of Physics) → Cosmic time (Grad Student) → Stein (Presentist) → Ontology/Determinism (Skeptic).  
  - **Bluff Avoidance:** Preemptively concede known weaknesses (e.g., "I follow Savitt’s frame-dependent defense, though Stein’s point stands for frame-free contexts").  
  - **Presentist’s "Bullying" Charge:** Respond calmly: "I’m not privileging physics—I’m arguing that *if* we take spacetime structure seriously, presentism can’t accommodate it. That’s a philosophical claim, not physicalism."  
  - **Key Phrase for Stein:** "Local becoming lacks the *modal asymmetry* presentists need: without global past/future, ‘fixity’ and ‘openness’ lose their meaning."  

  **Final Prep Tip:** Rehearse replies aloud with a timer (2 sentences max per answer). For transitivity, review papers by **R. Clifton** or **O. Pooley**—they defend the frame-dependent approach rigorously. Good luck!
