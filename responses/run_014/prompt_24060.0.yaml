prompt: |-
  I'm planning a term paper for my philosophy of mind seminar (about 5000 words, one semester) and I want help turning a half baked hunch into an actual proposal. My hunch: the multiple drafts model is usually sold as the fix for the Cartesian theater, but I think it just trades the theater for a different problem, and that problem is about time. The whole point of the drafts model is that there's no single moment where the show gets assembled and no original experience that the later ones are copies of — the experience is just the whole messy process of drafts being revised. But if that's right, then there's no fixed "now" at which my experience is settled. And that runs into the felt duration of experience, the thing people call the specious present — the fact that an experience has a felt length, that a chord doesn't just hit but unfolds. So my question is: can the multiple drafts model account for the specious present without either (a) denying that experiences have a felt duration, which I think is phenomenologically indefensible, or (b) sneaking back in a theater-like "now" that pins the experience to a point, which would defeat the whole anti-Cartesian motivation?

  Turn this into a proposal: a precise statement of the question, why the standard framing (that the theater is just an illusion) doesn't actually settle it, the approach I'd take and why that instead of the obvious alternatives (defending the model as is, or just tearing it apart), what a result would look like and what would count as the project failing, and an honest sense of what's too big for a semester. Don't bother with citations or a reading list, I'll add those myself.
