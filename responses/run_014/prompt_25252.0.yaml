answer: |-
  Your frustration is both understandable and deeply revealing—it highlights a foundational tension at the intersection of mathematics, physics, and philosophy. The persistent debate over the epistemic status of the Church–Turing thesis (CTT) is not a stalemate due to confusion or hidden empirical questions. Rather, it reflects a *constitutive ambiguity* in the thesis itself, arising from its dual role as a bridge between formal systems and pre-theoretic intuition. The disagreement is primarily a methodological clash over how to ground mathematical concepts in human practice, and secondarily, a divergence in what we demand of "foundations." Progress lies not in resolution, but in refined articulation of these methodological divides.

  ### The Core Ambiguity: Two Questions in One
  CTT masquerades as a single proposition but answers two distinct questions:  
  1. **Descriptive**: What *is* the scope of "effectively computable" as historically and intuitively understood?  
  2. **Prescriptive**: How *should* we formalize computation for mathematical or physical purposes?  

  The first question invites conceptual analysis; the second, pragmatic or empirical considerations. Positions cluster around which question they prioritize:

  - **The Definitional View** (e.g., Church, Gödel) treats CTT as answering the descriptive question. It asserts that "effective computability" *just means* Turing-computability, rendering the thesis analytic. A physical discovery (e.g., a device accelerating uncomputable functions) wouldn't falsify CTT—it would redefine "effectivity" or show new phenomena beyond its intended scope.  
  - **The Empirical View** treats CTT as answering the prescriptive question. If we formalize computation to model physical processes, CTT becomes contingent: a non-Turing-computable physical process *would* falsify it.  
  - **Methodological Views** (e.g., Feferman) sidestep ontology. CTT is a fruitful *working hypothesis* that shapes how we model computation, avoiding dogmatism while acknowledging its indispensability.  

  These aren't contradictory—they address different projects. The "stagnation" arises when proponents mistake their project for *the* project.

  ### The Methodological Impasse
  The debate persists because participants implicitly disagree on three meta-questions:  
  **A. What counts as "analysis"?**  
  For conceptual analysts, CTT culminates a successful explication (Carnap): clarifying an informal concept via precise formalization. For naturalists, this neglects computation's physical embodiment. The former sees oracles as mathematical toys; the latter sees them as possibilities demanding physical interpretation.  

  **B. What is the locus of mathematical necessity?**  
  Is computability "discovered" in mathematical reality (realism) or "stipulated" by our formalisms (conventionalism)? Realists lean empirical; conventionalists lean definitional. This rift mirrors broader foundations disputes (e.g., Platonism vs. formalism).  

  **C. How does physics constrain mathematics?**  
  If computation is fundamentally physical (e.g., Deutsch's physical Church–Turing thesis), CTT must engage with cosmology or quantum gravity. If it is abstract, physics is irrelevant. This isn't empirical—it’s a clash about disciplinary autonomy.  

  ### What Progress Looks Like
  The debate advances not by consensus but by:  
  1. **Sharpening the taxonomy of questions**. Explicitly separating *descriptive*, *prescriptive*, and *methodological* projects (as above) clarifies misunderstandings. Feferman’s distinction between "intensional" and "extensional" adequacy of formalizations is exemplary here.  
  2. **Contextualizing purpose**. Recognizing that CTT serves different roles—e.g., justifying recursion theory axioms vs. guiding computer engineering—dissolves false dichotomies. In proof theory, CTT is a de facto definition; in physics, it's a testable constraint.  
  3. **Engaging new frameworks**. Recent work in *embodied cognition* (e.g., Gualtiero Piccinini) reframes "effectivity" as grounded in neurobiological constraints, offering a third way between conceptual analysis and physics. Category-theoretic approaches (e.g., realizability) also provide fresh formal lenses.  
  4. **Abandoning the quest for universality**. Wittgensteinian critiques remind us that "computability" isn't a monolithic essence but a family-resemblance concept. Progress may mean accepting that CTT captures *a* central strand of practice, not *the* definitive analysis.  

  ### Conclusion
  The disagreement is substantive but not about CTT itself—it’s about epistemology and the metaphysics of mathematics. Is computation an abstract artifact or a physical phenomenon? Do mathematical concepts precede or emerge from practice? These questions resist neutral adjudication because they reflect divergent philosophical commitments. The persistence of the debate signals depth, not futility: CTT is a nexus where the foundations of mathematics touch the limits of human agency. Progress lies not in silencing one side but in mapping the conceptual terrain with greater precision, acknowledging that the thesis is a Janus-faced construct—simultaneously a discovery about formal systems and a manifesto for how to study them. Your intuition is apt: the impasse is methodological, and surfacing these commitments *is* the work that moves us forward.
