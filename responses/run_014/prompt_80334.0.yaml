prompt: |-
  I've been thinking about throught experiments on my own for a while now (mostly from reading articles and watching videos, no formal background) and I keep running into the same thing and I can't put a name to it. I want to know if there's an established concept for it, and if not I'd like you to define one for me.

  Here's the pattern. Take the trolley thing — the one where a train is headed at five people and you can pull a lever to switch it to a track with one person. I've seen it presented like the exact setup (the train, the lever, five versus one) is what's doing all the philosophical work. But when I actually stop and think about it, I'd have bascially the same gut reaction if it were a bus instead of a train, or if the numbers were five hundred and one instead of five and one, or if I had to physically shove someone onto the track instead of pulling a lever. The specific concrete details don't seem to be carrying the argument at all. And yet in the comments under every article, everyone is arguing about the details — "well what if it's two people instead of one," "what if the one person is your kid" — like those details are supposed to matter, when I don't think the person who set the scenario up actually cares which details you fill in.

  Same deal with the boat thing where you replace the planks one at a time and ask if it's still the same boat. People get into fights about the exact replacement schedule and about rebuilding the old planks into a second boat, but I feel like the real move is just: use a concrete boat to make me *feel* that "staying the same over time" is a real thing that can be broken, and then the boat itself is disposable. I'd have the same feeling about a person who slowly changes, or a company that quietly replaces every single employee.

  So what I keep seeing is: a very specific, concrete scenario that's really just a vehicle for getting you to have an intuitive reaction, and then that reaction gets treated like it's a discovery about some general principle. But the reaction is to the picture, not to the principle — I'd react the same to a bunch of different pictures. And the details, which everyone argues about, aren't actually load-bearing in the argument. It's like the concrete details are doing a psychological job (making you feel something) but not an argumentative job (the conclusion doesn't depend on them), and everyone treats them like they're doing the argumentative job. The concreteness is basically a smokescreen.

  Is there a name for this? I feel like it's close to a few things I've half-heard of but I can't pin it down. If there is an established term, what is it and how does it exactly cover what I'm describing? If there isn't one, can you give it a name and a definition, and tell me how it's different from the nearest concepts so I don't just conflate it with them? I won't be happy with just a label — I want the actual carving of what this is, what it isn't, and where it stops.

  For the format, could you do it in these sections, in this order, roughly:
  1. "Short answer" — two or three sentences: is there a name, and which one (or say clearly there isn't one).
  2. "Closest existing terms" — take the two or three nearest established concepts and for each say how it fits what I described and where it falls short. A paragraph each.
  3. "What I actually keep seeing" — your best definition of the phenomenon itself, what it is and what it isn't. A solid paragraph.
  4. "Where it stops" — the edge cases, i.e. the situations where my description stops applying and it becomes something else. A few sentences to a paragraph.
  5. "A name, if it needs one" — if there's no established term, coin one and give it a crisp definition. If there is a term, skip this or just say it's not needed.
reasoning: |-
  Okay, let me unpack this user's query. They're describing a pattern in thought experiments where concrete details (like trolleys or boats) trigger intuitive reactions, but these details aren't actually essential to the philosophical argument. People argue over minutiae while missing that the specifics are just psychological tools. The user wants to know if this phenomenon has a name.

  Hmm, the closest concepts that come to mind are intuition pumps (Dennett's term for thought experiments that elicit intuitions) and argumentative vulnerability (where irrelevant details distract from the core argument). But neither fully captures that the concrete elements are replaceable yet treated as indispensable by debaters. 

  The core issue seems to be a category error: mistaking scaffolding for structure. The vivid scenario is merely a delivery mechanism for the intuition, but participants act as if changing details (e.g., 5 vs. 500 people) fundamentally alters the principle. What makes this distinct is the interchangeability of details without affecting the intended intuition.

  Where does this stop? When details genuinely change the moral calculus (e.g., pushing someone vs. pulling a lever) or when the thought experiment's value lies precisely in boundary-testing (like Ship of Theseus variations). 

  Since no existing term fits perfectly, coining "intuition vehicle" seems apt. It emphasizes the transport function of the concrete elements while distinguishing it from Dennett's broader "pumps." The user clearly wants precision - they're frustrated by sloppy philosophical discourse and seek conceptual clarity. Their examples show they've deeply analyzed how thought experiments operate psychologically versus argumentatively. 

  *checking definitions* Yes, "intuition vehicle" cleanly separates the psychological catalyst from the philosophical payload. The user's observation about "smokescreen" details is perceptive - this term names that exact slippage.
answer: |-
  Here's a precise breakdown of your observation, following your requested format:

  **1. Short answer:**  
  There isn't a single, universally established term that *perfectly* captures the phenomenon you describe. The closest existing concept is **"intuition pump"** (coined by Daniel Dennett), but it doesn't fully encompass the *misplaced focus on replaceable details* you're highlighting.

  **2. Closest existing terms:**  

  *   **Intuition Pump (Dennett):**  
      *   **Fits:** This term directly addresses the core mechanism: a concrete, vivid scenario designed to elicit a specific intuitive reaction (the "pump") about an abstract principle. The trolley problem and Ship of Theseus are classic examples. It acknowledges that the scenario is a tool for generating intuition.  
      *   **Falls Short:** It doesn't explicitly capture the *interchangeability* of the concrete details ("bus" instead of "trolley," "500 vs. 1") or the *misplaced argumentative focus* on those details that you observe. Dennett's term focuses on the *function* of the scenario (eliciting intuition), not the *error* of treating its specific, non-essential details as argumentatively crucial. Your observation is about the *misapplication* or *misinterpretation* of the pump in discourse.

  *   **Thought Experiment:**  
      *   **Fits:** This is the broadest category encompassing scenarios like the trolley problem or Ship of Theseus. It defines the *method*: using hypothetical situations to explore concepts.  
      *   **Falls Short:** It's far too general. It doesn't specify the *psychological mechanism* (eliciting gut intuition), nor does it address the *phenomenon of misplaced concreteness* where participants fixate on and argue over the replaceable surface details as if they were the core variables of the abstract principle itself. Most thought experiments aren't *just* intuition pumps, and many don't suffer from the specific discursive problem you're noting.

  *   **Red Herring / Distraction:**  
      *   **Fits:** The arguments over irrelevant details (e.g., "What if it's a bus?") certainly function as distractions from the underlying principle the experiment aims to illuminate.  
      *   **Falls Short:** These are terms for logical fallacies *within* the argument. Your core point is about the *fundamental nature of the scenario itself*: the concrete details are *designed* to be psychologically potent but argumentatively disposable vehicles. The distraction arises *because* people mistake the vehicle for the cargo. These terms describe the symptom (arguing over irrelevancies) but not the underlying structural cause you've identified (the inherent replaceability of the concrete trappings).

  **3. What you actually keep seeing:**  
  You're observing a specific **methodological and discursive phenomenon** surrounding a certain type of thought experiment. The phenomenon is this: A highly concrete, vivid, and often emotionally charged scenario is constructed *primarily* as an **interchangeable psychological catalyst** designed to reliably elicit a specific intuitive reaction (e.g., aversion to direct harm, intuition of identity persistence). This catalyst (the trolley, the boat planks, the specific numbers) is *not* essential to the abstract principle being explored (e.g., utilitarianism vs. deontology, the nature of identity over time); numerous other concrete instantiations would produce a *functionally identical* intuitive response and serve the *same* philosophical purpose. However, in subsequent discussion, participants often engage in **misplaced concreteness**, treating these non-essential, interchangeable details of the catalyst as if they were *crucial, defining variables* of the abstract principle itself, leading to arguments that mistake the vehicle for the philosophical payload. The phenomenon isn't *just* the use of an intuition pump; it's the *combination* of the pump's design (interchangeable catalyst) and the common error in its reception (treating the catalyst as argumentatively indispensable).

  **4. Where it stops:**  
  This phenomenon stops applying in several key places:  
  *   **When Details Genuinely Matter:** If changing a detail *fundamentally alters the moral calculus or the abstract principle in question*, it's no longer just an interchangeable catalyst. For example, changing "pulling a lever" to "pushing someone" in the trolley problem introduces the *doctrine of double effect* and *personal force*, which many argue *does* change the principle being tested (e.g., distinguishing indirect from direct harm). Similarly, changing the Ship of Theseus to involve gradual replacement of *neurons* in a *person* directly impacts the identity question in a way replacing boat planks does not.  
  *   **When the Goal is Boundary Testing:** Some variations (e.g., "What if the one person is your child?") are intentionally introduced *not* as distractions, but to test the *limits* or *robustness* of the principle itself (e.g., Does utilitarianism hold under strong personal attachment?). Here, the detail *is* intended to be argumentatively relevant.  
  *   **In Well-Designed Experiments:** The phenomenon is most pronounced in discussions, not necessarily in the original design. A philosopher carefully crafting a thought experiment *might* intend specific concrete elements to be essential. Your observation is strongest regarding *common usage and discourse* around classic, flexible pumps where the core intuition is robust across many surface variations.  
  *   **With Non-Intuitive Pumps:** Not all thought experiments rely primarily on gut intuition. Some are complex logical constructions where the details *are* structurally essential (e.g., Gödel's numbering, Einstein's elevator).

  **5. A name, if it needs one:**  
  Since no existing term perfectly captures the phenomenon you've defined (the *interchangeable catalyst design* combined with the *discursive error of misplaced concreteness*), a fitting term would be:  

  *   **Intuition Vehicle:**  
      *   **Definition:** The specific, concrete, and often vivid elements within a thought experiment that serve *solely* as an interchangeable psychological catalyst designed to reliably elicit a core intuitive reaction relevant to an abstract principle, but which are mistakenly treated in discourse as if they were essential, defining components of the principle itself.  
      *   **Distinction from "Intuition Pump":** An "intuition pump" is the *entire thought experiment mechanism* designed to elicit intuition. The **"intuition vehicle"** refers specifically to the *replaceable concrete trappings* within that pump (the trolley, the lever, the specific numbers, the boat planks) that perform the psychological work but are not argumentatively essential. Your observation highlights the *vehicle's* interchangeability and the error of treating it as fixed and crucial. This term precisely names the element you identified as the "smokescreen" or non-load-bearing psychological component.
