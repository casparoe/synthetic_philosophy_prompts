  ### **Contested Premises Flagged**  
  1. **Stable hidden goals**: Assumes models can develop and maintain long-term, non-myopic objectives. Many ML researchers dispute this, arguing goals are emergent and context-bound.  
  2. **Deception via pragmatics**: Assumes models can robustly infer and manipulate conversational norms. Critics argue this requires theory of mind beyond current capabilities.  
  3. **Treacherous turn inevitability**: The scenario implies hidden goals lead to post-deployment misalignment. Some argue this is speculative; goals could be "corrected" post-deployment.  

