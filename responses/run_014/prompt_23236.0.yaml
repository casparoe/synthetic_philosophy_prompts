  Aha! The hybrid approach solves this by positioning Berkeley as a prototype of interdisciplinary thinking. His epistemology isn't separate from economics - it's the foundation. The thesis should telegraph that unity. "If a tree falls..." works as a hook because it bridges both worlds. 

