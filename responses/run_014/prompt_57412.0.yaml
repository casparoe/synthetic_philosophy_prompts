prompt: |-
  Six months ago I bought into a small housing cooperative — forty-odd units, a volunteer board, and a set of bylaws I have since read more closely than I expected ever to read anything. I work in insurance pricing, and the habit of my trade is to state a rule precisely enough that you can tell when it has been broken, which is why this has got under my skin. The clause that sold me on the place says that each member has sole and final discretion over what happens inside their own unit, and that the board may neither enter nor regulate it. I wanted a home where I could hang a tapestry in the window or run a seminar at my dining table without asking permission. In the months since, I have watched that clause be reduced to nothing, and the part I cannot articulate is that nobody ever violated it — not once. The board reclassifies instead. A member who tutors two evenings a week was informed that tutoring is "commercial use," which falls outside interior discretion because it brings non-members into the building; defensible, I thought. The same reasoning was then applied to a book club of six, and then to a member whose adult son stays over more than fourteen nights a quarter, on the grounds that she was lodging him. Separately, the board created an "exterior visibility" standard reaching anything a passer-by could see through a window, and rather than ordering the tapestry down it imposed a monthly surcharge on members whose interiors fail the standard — so the discretion is intact, it simply costs forty dollars to exercise. Most recently it added a procedural rule: a member wishing to invoke interior discretion must first obtain a written determination from the board that the matter in question is in fact interior. The right to decide has become the right to ask the decider whether you may decide.

  I keep hunting for the concept this instantiates and coming up empty. The nearest result I know by name is Sen's liberal paradox, but that concerns two people whose protected choices collide and a majority that objects to both; here nothing collides. There is one member, one sphere, and a collective that never touches the contents of the sphere while steadily redrawing its outline. "Moving the goalposts" and "death by a thousand cuts" capture the texture but not the structure. Mill's distinction between conduct that concerns only oneself and conduct that concerns others is in the background, and I am aware of the standard objection that almost nothing is purely self-regarding — but my objection is not that the line is hard to draw. It is that the parties with an interest in where the line falls are the ones drawing it, case by case, without ever having to announce a general principle or bear the cost of a formal amendment. What I suspect, and cannot state properly, is that the bylaws handed me something structurally incomplete: an entitlement whose scope remains up for grabs, with nothing in the document protecting it from being redefined rather than overridden.

  So: does this have a name? I would like the established term if one exists, or failing that the nearest established terms together with an account of how my case differs from each — including whether the same structure turns up elsewhere, in the power of a court to rule on its own jurisdiction, say, or in amendment procedures that can reach the clauses protecting rights, or wherever political and legal theory discusses who gets to settle what counts as a private matter. I am not after a bare label; I want the carving. What does the phenomenon consist in, what is it not, and where are its edges? It is plainly not simple rights violation, and plainly not mere vagueness in drafting, since the wording could be made perfectly precise and still be reclassifiable. Is a single open reclassification adopted by a legitimate vote the same thing as an accretion of quiet ones? Does the analysis change if the reclassification genuinely prevents harm to other members? Can a protected sphere be protected at all without also protecting somebody's authority to say what falls inside it? If no established concept covers this, I would much rather you said so plainly and proposed a term with a definition and boundary conditions than see you stretch something adjacent to fit.
reasoning: |-
  Okay, the user presents a sophisticated problem about governance erosion within a housing cooperative. They've identified a pattern where their cooperative board systematically redefines the scope of a "sole discretion" clause without technically violating it. 

  First, I recognize this as a classic case of institutional drift - the kind political scientists like Jacob Levy study. The user's insurance background shines through in their precise frustration: they understand rules as boundaries, but the board treats them as movable thresholds. Their examples (tutoring→book club→adult son→tapestry tax→pre-approval rule) form a perfect escalation ladder showing procedural capture.

  What they're really asking for is conceptual framing tools. The legal theory angle is crucial here - they want to understand if this is:
  a) A known paradox (like Sen's, which they correctly distinguish)
  b) A documented governance failure mode
  c) An inherent flaw in "protected sphere" constructs

  I'm struck by their observation about structural incompleteness. They've essentially diagnosed Arrow's impossibility theorem in miniature: no governance document can fully specify its own interpretation. The board's move to claim meta-jurisdiction (deciding what counts as interior) is the killer twist.

  Key distinctions to make:
  - This isn't "mission creep" (which is expansionary)
  - Nor "regulatory capture" (which implies external actors)
  - But shares DNA with "ratchet effects" in institutional economics

  The user would appreciate the constitutional law parallels - like how "penumbras" of rights get defined. Their closing questions suggest they're considering drafting solutions, so practical implications matter. Should note that some co-ops solve this with independent arbiters or bright-line rules.

  Most satisfying insight: their case shows why "negative liberties" (freedom FROM interference) crumble without meta-protections. The $40 tapestry tax brilliantly illustrates Coase's theorem - rights exist only as transaction costs allow.
answer: |-
  This is a profound and precisely observed instance of institutional erosion. While no single established term perfectly captures *every* facet, the phenomenon **centrally involves "Procedural Encroachment" or "Jurisdictional Creep" within a framework of "Incomplete Contracting" and "Interpretive Capture."** Let's dissect it:

  ### Core Concept: Procedural Encroachment (The Mechanism)
  *   **Definition:** The gradual transfer of substantive decision-making power from the intended holder (the member) to a governing body (the board) through the manipulation of *procedures* and *definitions* that determine *what falls within the scope* of the protected right, rather than directly violating the right itself.
  *   **How it Fits:**
      *   The board never *directly* dictates what happens inside a unit (violating "sole discretion").
      *   Instead, it redefines activities ("commercial use," "lodging," "exterior visibility impact"), imposes conditions (surcharges), and creates prerequisite procedures (mandatory pre-approval).
      *   **The power shifts:** "I decide what happens inside" becomes "I decide *if* something is classified as 'inside,' and *if* it's approved, and *if* I can afford the fee." The board gains control over the *meaning* and *access* to the right.

  ### Supporting Concepts & Distinctions
  1.  **Jurisdictional Creep / Boundary Manipulation:**
      *   **Focus:** The steady expansion of the board's *authority to define the boundaries* of the "interior discretion" sphere.
      *   **Distinction from "Moving Goalposts":** "Moving goalposts" is tactical (changing criteria mid-debate). This is *structural*: systematically redefining the *domain* over which the original rule applies. It's less about changing the rule *within* its domain and more about shrinking the domain itself.
      *   **Analogy (Court Jurisdiction):** Similar to a court claiming the authority to definitively rule on the limits of its own jurisdiction. The entity gains meta-power over the scope of its power. Your board claims the authority to define what "interior discretion" means and what triggers it.

  2.  **Incomplete Contracting & Interpretive Capture:**
      *   **Incomplete Contracting (Economics/Law):** Recognizes that contracts (like bylaws) cannot foresee all future contingencies. Gaps and ambiguities *will* exist.
      *   **Interpretive Capture:** Occurs when the party granted interpretive authority (the board, via its rule-making/enforcement role) exploits gaps and ambiguities to expand its control, aligning interpretations with its preferences or risk-aversion, often against the spirit of the original agreement. The "sole discretion" clause lacked sufficient meta-rules defining *who interprets "interior"* and *how boundaries are set*.
      *   **Why "Vagueness" Isn't the Core Issue:** Even a hyper-precise definition (e.g., "any activity occurring entirely within the physical envelope of the unit, excluding common elements") is vulnerable. The board can still *reclassify* activities ("tutoring isn't just *in* the unit, it *brings in outsiders*"), or impose *conditions* on exercising the right (fees, approvals). The vulnerability is structural, not semantic.

  3.  **The Liberal Paradox & Spheres of Liberty (What it's NOT):**
      *   **Sen's Liberal Paradox:** Correctly dismissed. Sen deals with conflicts between *individual* protected choices and collective preferences. Here, there's no direct conflict *between members' choices* triggering the erosion. The erosion stems from the board's *proactive* redefinition of spheres and imposition of costs/controls, likely driven by risk management, control preferences, or aesthetics, not majority override of conflicting individual liberties.
      *   **Mill's Harm Principle:** You identify the background issue. The board's reasoning *invokes* harm/impact ("outsiders," "visibility," "resource use" implied by long stays) to justify reclassification. However:
          *   The *analysis doesn't change* if harm is genuine. The core issue remains: *Who gets to define what constitutes "harm" or "impact" sufficient to move an activity outside the protected sphere?* Procedural Encroachment occurs regardless of the *validity* of the board's concern. The problem is the *process* of boundary-setting, not necessarily the *outcome*.
          *   **Key Distinction:** Mill debates *where the line should be*. Your issue is *who draws the line and how*, when the line-drawer has an interest in its placement.

  4.  **Erosion vs. Violation & The "Cost of Exercise":**
      *   **Not Simple Violation:** The right isn't directly abolished or ignored; its *substance is hollowed out* through reclassification, fees, and procedural hurdles.
      *   **The Surcharge:** This is crucial. It transforms the right from a *liberty* (freedom to act) into a *licence* (permission to act, contingent on payment). This fundamentally alters the nature of the entitlement.
      *   **The Pre-Approval Rule:** This completes the inversion. "Sole discretion" becomes "discretion contingent on board validation of its own applicability." It formalizes the board's meta-jurisdiction.

  ### Answering Your Specific Queries
  *   **Single Reclassification vs. Accretion:** A *single* legitimate reclassification *could* be valid if genuinely unforeseen and harmful. However, the *pattern* of accretion reveals Procedural Encroachment as a *strategy*. Each step seems defensible in isolation ("just this one reasonable adjustment"), but the cumulative effect dismantles the original right. Accretion is the hallmark.
  *   **Genuine Harm Prevention:** As above, the *existence* of harm doesn't validate the *process*. A fair system would need independent adjudication or clear, pre-defined, objective criteria for what constitutes harm moving an activity outside the sphere. Letting the board unilaterally define harm *and* act on it *is* the encroachment.
  *   **Can a Sphere be Protected Without Protecting the Authority to Define It?** **This is the central dilemma.** No right is truly protected if its *scope* can be unilaterally redefined by the entity the right exists *against*. Protection requires:
      *   **Meta-Rules:** Clear rules *about* how the scope is defined, interpreted, and changed (e.g., requiring supermajority votes for boundary changes, independent arbitration for disputes over scope, bright-line definitions immune to reclassification).
      *   **Interpretive Independence:** Vesting interpretive authority in a neutral body *outside* the board (e.g., an ombudsman, agreed-upon arbitrator, or a clear judicial process).

  ### Proposed Term and Boundaries
  *   **Core Term: Procedural Encroachment** (on a protected sphere of discretion).
  *   **Boundary Conditions:**
      *   **Requires:** A formally defined right or sphere of autonomy (e.g., "sole discretion over interior").
      *   **Mechanism:** Governing body uses rule-making/enforcement powers to:
          1.  **Reclassify:** Redefine activities or states to fall *outside* the protected sphere's boundaries.
          2.  **Impose Costs:** Attach fees, taxes, or burdens to the *exercise* of the right.
          3.  **Proceduralize:** Create mandatory pre-approvals or determinations *by the governing body itself* before the right can be exercised.
      *   **Effect:** Substantive decision-making power shifts from the right-holder to the governing body *without formally revoking the right*.
      *   **Not:** Direct violation of the right's core command. Not mere bureaucratic delay. Not legitimate clarification of genuine ambiguity through a fair, constrained process. Not a one-time adjustment for unforeseen catastrophe.
      *   **Key Indicator:** The governing body gains the *de facto* power to determine the *applicability* and *cost* of exercising the right it was supposed to be barred from regulating.

  ### Conclusion
  You've identified **Procedural Encroachment**: the insidious hollowing out of a substantive right through the board's strategic manipulation of jurisdictional boundaries, procedural prerequisites, and the imposition of costs on its exercise. The bylaws' flaw was structural incompleteness – granting the entitlement without adequately protecting its *scope* from redefinition by the very entity whose power it was meant to limit. It reveals a fundamental truth: **a right is only as strong as the rules governing who defines what it means.** The closest established discussions occur in critiques of bureaucratic power, analyses of constitutional erosion, and theories of incomplete contracts, but the specific mechanism you describe deserves the precise label of Procedural Encroachment.
