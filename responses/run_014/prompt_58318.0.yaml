prompt: |-
  Earlier this year I became the day-to-day helper for my elderly father after his hospital discharge, doing his shopping and planning his afternoons together with him, with his full involvement and consent, and the responsibility has made a recurring puzzle hard to set aside.

  In the shop, when both sweet biscuits and fruit are in front of him, he reliably takes the biscuits. This has held for months, without hesitation, without later surprise, and without any confusion about health effects or prices, which we have discussed openly. Yet when we review the week together and I ask which pattern of eating left him feeling steadier and more himself by his own standards, or which pattern he would want me to arrange if I were stocking the flat for him in advance, he sincerely favours the fruit, and he is neither embarrassed nor trying to impress me. If both options are present again the next day, he again takes the biscuits, still without struggle or apology.

  A similar shape appears in the afternoons. Offered a walk around the block or an hour of daytime quiz programmes, he will turn on the television. Asked afterwards which kind of afternoon makes the day go better for him, and which he would select for a coming week if I booked it ahead and removed the moment-by-moment choice, he favours the walk, again sincerely and with stable judgment. There is no inner battle at the moment of choice, no claim afterward that he misjudged, and no pressure from others to say one thing while doing another.

  What I am trying to isolate is this stable gap between what a person dependably selects when options are side by side and what the same person sincerely judges to be better for himself by his own lights, where lack of information, forgetfulness, outside pressure, and inner conflict followed by regret have all been ruled out. It is not a case of being torn and giving in, nor of learning something new afterward, nor of saying one thing for show. A bare label will not help me; I need to understand what exactly this pattern is, what nearby patterns it must be distinguished from, and where its boundaries lie, with examples of cases that would count and cases that would not.

  Is there an established concept for this exact configuration, and if so, what are the two or three closest neighbouring concepts, how does the pattern I describe differ from each, and which fits best? If there is nothing established that fits, please coin a term and give a precise definition that separates it from giving in to temptation on one side and from simple error or performance for others on the other, including how to handle advance booking versus moment-by-moment selection as a test. Please close your response with a final line of the form \answer{...} where the braces enclose only the term you endorse, whether established or newly coined.
reasoning: |-
  Okay, the user has presented a fascinating psychological puzzle about their elderly father's consistent behavior: he reliably chooses immediate gratifications (biscuits, TV) when faced with options, yet sincerely prefers the long-term beneficial choices (fruit, walks) when reflecting or planning ahead. This isn't about forgetfulness, social pressure, or regret—it's a stable cognitive gap.

  First, I need to rule out common explanations. It's not akrasia (weakness of will) because there's no inner conflict during choice. Not preference reversal since his reflective judgment stays consistent. Not impulsivity because the behavior persists even without time pressure. The key differentiators are the absence of struggle during choice and the sincerity of post-hoc evaluation.

  The core mechanism seems to be about temporal distance in decision-making. When options are immediately present ("hot state"), the visceral appeal dominates. When evaluating abstractly ("cold state"), delayed benefits weigh more. This aligns with behavioral economics concepts like hyperbolic discounting, but needs refinement to exclude regret/conflict elements.

  For a precise term, "visceral capture" fits well—it emphasizes how immediate sensory inputs override reflective preferences without internal debate. Close neighbors would be: 
  1) Akrasia (has conscious conflict)
  2) Impulsivity (involves haste)
  3) Preference reversal (entails changing standards)

  Testing boundaries: Advance booking works because it occurs in a "cold state" where visceral triggers are absent. Cases that wouldn't count include choosing unhealthy food due to misinformation (simple error) or claiming to prefer exercise to impress others (performance).

  Finally, the answer should isolate this specific phenomenon where two modes of evaluation diverge predictably, with advance commitment resolving the gap. \answer{visceral capture} captures this cleanly.
answer: |-
  Based on your meticulously described observations – ruling out information gaps, forgetfulness, social pressure, inner conflict, regret, and performative statements – the established concept that best fits this *exact* configuration is **Time-Inconsistent Preferences**, specifically mediated by the **Hot-Cold Empathy Gap** and manifesting as a form of **Visceral Influence**.

  However, to capture the unique stability, lack of conflict, and sincerity you observe, a more precise term is warranted. The endorsed term is:

  **\answer{Visceral Capture}**

  ### Precise Definition of Visceral Capture
  **Visceral Capture** occurs when an agent, in a "hot" state (confronted with immediate sensory stimuli/options), reliably selects an option driven by salient visceral impulses (e.g., taste, immediate ease, sensory appeal), *without conscious conflict or subsequent regret*. However, this same agent, in a "cold" state (reflective, planning, evaluating past outcomes at a temporal/psychological distance), sincerely and stably judges a *different* option as superior by their own criteria (e.g., well-being, long-term satisfaction, identity congruence). Crucially:
  1.  **No Intra-Psychic Conflict:** The "hot" choice involves no felt struggle, willpower failure, or self-reproach.
  2.  **Sincere Reflection:** The "cold" judgment is authentic, stable, and aligns with the agent's considered values.
  3.  **Predictable Gap:** The divergence between "hot" choice and "cold" judgment is consistent and replicable under the same conditions.
  4.  **Resolution via Commitment:** The agent reliably prefers commitment devices (like advance booking) that align with their "cold" state judgment, precisely to bypass the "visceral capture" of the immediate choice scenario.

  ### Distinguishing from Neighbouring Concepts
  1.  **Akrasia (Weakness of Will):**
      *   **Closeness:** Both involve acting against one's better judgment.
      *   **Distinction:** Akrasia inherently involves *conscious inner conflict* at the moment of choice ("I know I shouldn't, but...") and often leads to regret or self-recrimination. Your father experiences *no conflict* during the "hot" choice and *no regret* afterward. Visceral Capture operates pre-reflectively; the "better judgment" isn't actively present or overruled in the hot state – it's simply not engaged.
      *   **Test:** In akrasia, the person might sigh, hesitate, or apologize while taking the biscuit. In Visceral Capture, the choice is smooth and unconflicted.

  2.  **Impulsivity:**
      *   **Closeness:** Both involve actions driven by immediate stimuli.
      *   **Distinction:** Impulsivity is characterized by *haste, lack of deliberation*, and often *poor foresight*. Your father's choice isn't rushed; he could deliberate on price/health if prompted (as per your discussions), but the visceral appeal *dominates* without requiring haste. His "cold" state shows excellent foresight and deliberation. Visceral Capture is about *what* dominates the decision process (visceral cues), not the *speed* of the decision.
      *   **Test:** If forced to wait 5 minutes before choosing, an impulsive person might still choose biscuits hastily. Your father might still choose biscuits if they remain present and salient, but without haste – the capture persists due to presence, not speed.

  3.  **Preference Reversal (Context-Dependence):**
      *   **Closeness:** Preferences change based on context (immediate vs. delayed).
      *   **Distinction:** General preference reversal can occur for many reasons (e.g., changing valuation based on framing, new information, mood). Visceral Capture is a *specific mechanism* causing reversal: the *direct sensory presence* of the viscerally appealing option in the "hot" state overrides the reflective preference held in the "cold" state. It's not a shift in underlying value, but a shift in *which value system is engaged* by the context. The stability of the "cold" judgment and the specific trigger (sensory presence) are key.
      *   **Test:** If you *described* the biscuit vividly in the "cold" planning state, he'd likely still choose fruit for the plan. The physical *presence* is necessary for capture.

  ### Boundaries and Examples
  *   **Counts as Visceral Capture:**
      *   Choosing video games over homework *effortlessly* while the console is on, yet sincerely planning a study schedule for the next week and sticking to it if the console is put away in advance.
      *   Opting for a convenient elevator over stairs without a second thought when both doors are open, but choosing a hotel room on a higher floor when booking online to ensure using the stairs, based on knowing it feels better afterward.
  *   **Does NOT Count (Illustrating Boundaries):**
      *   **Akrasia:** Taking the biscuit while sighing "I really shouldn't" and later regretting it. (Involves conflict/regret).
      *   **Simple Error:** Choosing biscuits because he mistakenly believes they are healthier than fruit. (Involves information gap).
      *   **Impulsivity:** Grabbing biscuits quickly without even registering the fruit is there, and later being surprised. (Involves lack of attention/deliberation).
      *   **Performance:** Choosing biscuits but *saying* he prefers fruit later to please you. (Lacks sincerity in reflection).
      *   **Learned Aversion:** Choosing biscuits because fruit once made him sick, even if he intellectually knows it was a one-off. (Involves conditioned fear, not pure visceral appeal vs. reflective benefit).
      *   **Chronic Pain/Disability:** Avoiding the walk due to unspoken joint pain, even if he values the *idea* of walks. (Reflective judgment isn't fully informed by physical reality; involves a hidden cost).

  ### Why "Visceral Capture" Fits Best
  *   **Visceral:** Highlights the role of immediate sensory/affective stimuli (taste, ease, screen flicker) dominating the "hot" state choice.
  *   **Capture:** Emphasizes how this influence operates *automatically and pre-reflectively*, "capturing" the decision without engaging the reflective system responsible for the "cold" state judgment. It suggests a temporary hijacking by the immediate environment.
  *   **Handles Advance Booking:** This is the critical test. Booking in the "cold" state allows the reflective system to make the choice aligned with its judgment, *bypassing* the future "hot" state where capture would occur. The preference for advance booking *confirms* the sincerity of the reflective judgment and the disruptive power of the immediate visceral context.

  This pattern reveals a fundamental dissociation in decision-making systems: one driven by immediate, salient features of the environment, the other by reflective evaluation of outcomes and values. Your father's case elegantly demonstrates this dissociation operating cleanly, without the noise of conflict, error, or performance. \answer{Visceral Capture}
