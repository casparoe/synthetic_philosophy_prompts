  The Concluding Chapter of Henry Sidgwick's Methods of Ethics holds that the "dualism of practical reason" -- the standoff between rational egoism and utilitarian morality -- can be resolved only by some further premise, and Sidgwick names exactly two candidates: loosening what counts as a legitimate assumption in ethics, on analogy with the unprovable but indispensable assumptions natural science already relies on, or a theistic postulate that the universe is under a moral government guaranteeing that virtue and self-interest ultimately coincide. He then spent the rest of his life as founding president of the Society for Psychical Research, chasing evidence -- telepathy among the living, the Census of Hallucinations, the Piper mediumship -- meant to underwrite that second premise, and by his own late admission he never found it. I'm applying for a three-month summer fellowship in history of philosophy and need a two-page proposal for an article built on my half-formed suspicion that the program could not have succeeded even in principle: at best it could only ever have delivered evidence of survival, or of telepathic contact among the living, and neither fact entails the further, distinct claim the ethics actually needs. Turn this into a proposal: state the question precisely enough to have a determinate answer, explain why readings that treat the psychical research as continuous with his philosophical rigor, and readings that treat it as a separate, largely biographical episode, both leave this narrower structural question unaddressed, give a realistic month-by-month plan for the fellowship, and take a real position on whether the gap I'm describing is genuine and fatal, or one that Sidgwick had the resources to close. Say honestly what would count as the project failing. No citations -- I'll add those myself.
