  First, the core challenge: the poem must balance technical accuracy (no logical howlers) with pedagogical accessibility (tired sophomores). The refrains need to embody the Liar's tension - one claiming its truth, the other its falsehood - while the final quatrain should show paraconsistent resolution.

  Key points to weave in:
  - Dialetheism ≠ "anything goes" (must distinguish from explosion)
  - Form mirrors content: villanelle's cyclical refrains = Liar's self-reference
  - Avoid jargon but keep logic sound (e.g., "entail" instead of "explode")

  Structural checks:
  - Line 1 & 3 become refrains (A1/A2)
  - Rhyme scheme ABA throughout
  - Final stanza: A1, A2, A1, A2

  Content approach:
