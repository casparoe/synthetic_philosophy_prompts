prompt: |-
  I am a software engineer with no formal training in philosophy, and I need a piece for my team's internal blog. Write a deadpan parody of a corporate compliance manual — call it The Universalizability Review — in which the company has adopted Kant's universalizability test as the mandatory gate through which every product and policy decision must pass; the target is the habit of treating the categorical imperative as a mechanical procedure that a compliance department can operate. Use the flat register of a real process document: scope clause, numbered sections, severity tiers, a table of worked examples drawn from ordinary office life, an FAQ, and an appeals path. Let the machinery carry the comedy: a two-tier scheme that treats maxims whose universalized form would destroy the practice itself as blocking findings, and maxims that can be conceived as universal but not willed as universal as softer findings subject to the director's discretion; a rule that the requester supplies the maxim in their own words, purpose included, which of course they phrase so that it passes; and a front-desk edge case about lying to a visitor who announces that he intends to harm a colleague. Do not explain the theory and do not signal the joke — assume the reader has read Kant. About 700 words.

  Then add a short author's note for me, kept separate from the piece, that sorts what is settled from what is genuinely contested among people who know the topic — for instance whether the test is meant to function as a decision procedure at all, or how its stock examples should be classified — and that does not present a contested reading as the consensus. Flag anywhere my framing would make a Kant scholar wince, and keep the jokes resting on contested readings rather than on plain misstatements of what Kant held.
