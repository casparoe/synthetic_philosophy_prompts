  ## The Beam Unlaid

  The plaster cracks where wiring snakes its course,  
  The budget's bled on unforeseen expense.  
  **What's spent is spent; that's water past the source.**  
  The architect's reproach, a muttered curse,  
  On half-done floors, a costly deference.  
  The plaster cracks where wiring snakes its course.  

  Ambition's sketch, now warped by time and force,  
  Dims daily in the dust's grey permanence.  
  **What's spent is spent; that's water past the source.**  

  A decade's drafts, a thesis' hollowed core,  
  Footnotes like ghosts on pages dense, immense.  
  The plaster cracks where wiring snakes its course.  

  Is value *now* worth futures mortgaged more?  
  Or walk away from this false evidence?  
  **What's spent is spent; that's water past the source.**  

  Yet deeper than the ledger's settled score,  
  A promise made resists indifference:  
  **To be the kind who finishes the task**  
  Defines the self, a pact I cannot mask.  

  The scaffold stands, a skeleton of might,  
  The ghost of what I meant to build takes form.  
  **To be the kind who finishes the task**  
  Demands the cost, accepts the gathering storm,  
  Not sentiment, but shaping day and night  
  The scaffold stands, a skeleton of might.  

  Each project quit erodes the will to fight  
  The drift that leaves intentions faint and warm.  
  **To be the kind who finishes the task**  
  Is armour forged against the tempting norm  
  Of easy outs beneath the fading light.  
  The scaffold stands, a skeleton of might.  

  The marginal gain seems weak, a dubious spark,  
  Against the weight of effort still amassed.  
  **To be the kind who finishes the task**  
  Or heed the call that future costs amass?  
  Both voices coil within the looming dark:  
  **What's spent is spent; that's water past the source.**  
  **To be the kind who finishes the task.**  

  ---

  **Annotations & Achievements:**

  1.  **Form as Philosophy:** The villanelle's inexorable return of the refrains mirrors the inescapable presence of sunk costs and the persistent pull of the self-binding rule. They cannot be dismissed; they cycle back, demanding attention, just as the arguments do in the protagonist's mind.
  2.  **Identifying the Refrains:**
      *   **Refrain 1 (Orthodox Economist):** "**What's spent is spent; that's water past the source.**" This is the classic sunk cost fallacy argument: past expenditures are irrelevant; only future costs and benefits matter. It's presented as a clear, almost proverbial truth.
      *   **Refrain 2 (Pro-Sunk-Cost/Commitment Rule):** "**To be the kind who finishes the task.**" This articulates the identity-based, self-binding rule argument. It emphasizes *being* a certain type of person (a finisher) as a valuable policy that transcends the immediate cost-benefit analysis of *this specific* project. Its strength lies in resisting the erosion of willpower across *all* endeavors.
  3.  **Philosophical Nuance:** The pro-sunk-cost refrain avoids sentimentality or attachment to the *object* (house, dissertation) itself. It focuses squarely on the *agent* and the importance of maintaining a commitment-completing disposition as a valuable personal policy against weakness of will ("armour forged against the tempting norm / Of easy outs").
  4.  **Convergence & Decision:** The final couplet brings both refrains together for the first time, literally forcing them into the same space. This *is* the moment of decision, the collision of the irrecoverable past ("What's spent is spent") and the defining future self ("To be the kind who finishes the task"). The poem ends on this unresolved tension, leaving the choice implicit but the weight of both arguments profoundly felt.
  5.  **Accessibility:** Without knowing the economics, the poem vividly portrays the agony of abandoning a massive, visible investment (cracking plaster, exposed beams, a decade's drafts) and the deeper fear of becoming someone who doesn't follow through ("Each project quit erodes the will to fight"). The "ghost of what I meant to build" and the "looming dark" evoke the emotional and existential weight of the choice.
  6.  **Imagery:** The specific project (renovation suggested by plaster, wiring, beams, scaffold, dust) grounds the abstract debate. Imagery of cracks, ghosts, skeletons, hollowed cores, fading light, and the "dust's grey permanence" reinforces decay, stagnation, and the specter of failure, while the scaffold and "shaping day and night" hint at potential completion.
