prompt: |-
  I'm a junior and I've been coding since middle school — Python mostly, some C++, and enough JavaScript to ship a small web thing — so I'm way more fluent in programming-language talk than in linguistics talk. I keep running into this debate about whether the language you speak shapes what you can think, the Sapir-Whorf thing, and I want you to restate it in my vocabulary: syntax vs semantics, type systems, what a language makes easy or awkward to express, standard libraries, expressiveness, porting and refactoring code between languages, and the fact that they're all Turing-equivalent anyway. Cover the strong version, the weak version, and that third position where language is more like a tool you reach for during certain tasks than a filter on thought. Go claim by claim, and please don't quietly smuggle in programming assumptions that make the linguists look obviously right or obviously silly — I want the translation to actually be a translation.

  Then the residue report: which claims map cleanly, which ones you had to bend out of shape to fit, and which ones there's just no way to say in my vocabulary at all. And say which way you think that residue points — is my PL vocabulary missing something, or is some of what they're arguing about not a real question?

  Two things in particular. I vaguely remeber follow-up experiments where the whole effect vanished if you made people do a verbal task at the same time, and I can't work out what that even corresponds to in my terms. And: a program does the same thing no matter what language you wrote it in, so over here "language shapes thought" can only ever be about the programmer, never about the output. Is there any counterpart to that split on their side, or is it a disanalogy that wrecks the whole translation?

  No formatting please — no headings, no bullet points, no bold, no tables. Just continuous prose, the way you'd write an email.
