prompt: |-
  I'm a program officer at a small regional foundation that disburses about $3 million a year in grants of roughly $20,000 to $250,000, across a messy portfolio: youth programs, a food bank, a river cleanup coalition, some workforce training pilots. Quarterly cycles, a board of twelve that has to sign off on anything above $100,000, and no research staff — it's me, a half-time analyst, and whatever the applicants themselves send in. I've been reading philosophy in the evenings (I took a couple of courses in college) and I've become obsessed with the problem philosophers call consequentialist cluelessness: the observation that essentially every action sets off causal ripples we cannot trace — a childhood vaccination in 2010 changes who exists in 2080; a well-run literacy program displaces some other program that would have run instead; the counterfactual effects of what we *don't* fund are as unknowable as the effects of what we do. Proponents of act-utilitarian-style reasoning often respond with things like expected-value estimation or fall-back heuristics, and critics reply that when you're guessing at the sign of the second-order effects, the arithmetic confidence is fake. I don't need the philosophy settled. I need it usable.

  Please write a decision procedure my office could actually run on a funding proposal: the questions to ask in order, what counts as a sufficient answer to each question, which answers should stop the process with a no or escalate it to the board, and — this is the part I care most about — where the procedure has to give up and hand the decision to a human being because the question is one of values or unquantifiable judgment rather than facts. The procedure should be honest about the difference between an intervention with traceable local effects and one whose case rests on long untraceable chains, and it should tell me what to do when both kinds are on the table at once (as they always are at allocation time). It has to be runnable in a day per proposal by someone with no statistics training beyond a spreadsheet.

  Then run it on three hypotheticals of the kind that actually cross my desk: (1) $80,000 for a food bank to expand weekend meal backpacks to two more school districts, where the main claimed benefit is direct and local but the applicant's own letter admits it will pull volunteers from a neighboring program; (2) $150,000 for a workforce training pilot whose proponents claim a plausible chain from better training to better jobs to reduced incarceration decades out, where every link past the first is a guess; and (3) $30,000 to keep a small, beloved, demonstrably mediocre tutoring program alive, whose strongest argument is that if it dies the school will redirect the space to a study hall. Include at least one case where the procedure returns an answer I won't like, and say plainly what the procedure cannot do — where cluelessness genuinely bottoms out and the honest output is not a number but a choice someone has to own.
reasoning: |-
  We are designing a decision procedure that acknowledges the problem of consequentialist cluelessness. The procedure must be practical and runnable by a program officer with minimal statistical training. It should include:
  - Ordered questions to ask about a proposal
  - Criteria for sufficient answers
  - Points where we stop (reject) or escalate to the board
  - Clear points where the decision must be handed to a human due to unquantifiable judgments

  The procedure will have the following steps:

  1. **Initial Screening (Mandatory Requirements)**
     - Check if the proposal meets basic requirements (e.g., within funding range, aligns with foundation's mission, complete application).
     - If not, reject or ask for more information.

  2. **Direct and Local Impact Assessment**
     - Focus on the immediate, traceable effects of the proposal. We are looking for clear, direct, and local outcomes that can be observed and measured within a reasonable timeframe (e.g., 1-3 years).
     - Questions:
       - What specific, measurable outcomes does the applicant promise in the short term (within 1-3 years)?
       - How will these outcomes be measured? (Require specific metrics and a plan for data collection)
       - What evidence does the applicant provide that their intervention causes these outcomes? (e.g., past performance, pilot data, research in similar contexts)
     - Sufficient answer: The outcomes are clearly defined, measurable, and the applicant provides a reasonable plan to measure them. Evidence of causation should be at least an observational study or a logical causal model that is accepted in the field.
     - If the direct outcomes are not measurable or the causal link is weak, reject. If the direct outcomes are strong and measurable, proceed to step 3.

  3. **Assessment of Counterfactuals and Displacement Effects**
     - Consider what would happen without the grant and what might be displaced by the grant.
     - Questions:
       - What is the most likely scenario without this grant? (The applicant must describe the counterfactual.)
       - What resources (volunteers, funding, space, etc.) might be diverted from other uses if this grant is awarded? (e.g., the food bank example where volunteers are pulled from a neighboring program)
       - How does the applicant plan to mitigate any negative displacement effects?
     - Sufficient answer: The applicant acknowledges potential displacement and has a mitigation plan OR demonstrates that displacement is minimal. If displacement is significant and unmitigated, it may lead to rejection.
     - If the counterfactual scenario is worse than the proposed intervention (i.e., the grant prevents harm or provides a clear net benefit in the short term), proceed. Otherwise, reject.

  4. **Long-Term and Indirect Effects Assessment (Handling Cluelessness)**
     - Acknowledge that long-term and indirect effects are inherently uncertain. We do not try to quantify the unquantifiable, but we do evaluate the reasoning behind long-term claims.
     - Questions:
       - Does the proposal make claims about long-term or indirect effects (beyond 3 years)? If yes, describe the chain of causation.
       - For each link in the chain, what evidence is provided? (e.g., studies, historical data, logical reasoning)
       - How sensitive are the conclusions to changes in the assumptions? (We are looking for robustness or acknowledgment of uncertainty)
     - Sufficient answer: The chain of causation must be logically plausible and each link should be supported by at least some evidence (even if not conclusive). The applicant must acknowledge the uncertainty and not overstate the confidence.
     - If the long-term chain is highly speculative and the applicant cannot provide any supporting evidence, we disregard the long-term claims and base the decision on the short-term analysis only. We do not reject solely because long-term effects are uncertain, but we note the uncertainty.

  5. **Comparative Assessment and Resource Allocation**
     - Place the proposal in the context of other opportunities and the foundation's portfolio.
     - Questions:
       - How does this proposal compare to others in the same cycle in terms of:
          - Direct, measurable impact per dollar?
          - Urgency (what happens if we delay funding?)?
          - Alignment with foundation priorities?
       - Are there any non-instrumental values at stake (e.g., equity, community preferences, intrinsic value of preserving a beloved program)?
     - This step is inherently human. We must use judgment to weigh the measurable impacts against the unquantifiable values and the foundation's goals.

  6. **Decision Points**
     - **Reject**: If the proposal fails at steps 1, 2, or 3 (e.g., doesn't meet requirements, no clear short-term benefits, significant unmitigated displacement).
     - **Escalate to the board**: For grants above $100,000 (as per the foundation's rule) OR if the proposal involves significant strategic shifts, large amounts of funding, or high uncertainty that requires board input.
     - **Human judgment required**: 
          - When there is a conflict between measurable short-term gains and long-term uncertain benefits.
          - When there are significant non-instrumental values (e.g., preserving a beloved program) that cannot be captured by the measurable impact.
          - When comparing across very different domains (e.g., youth programs vs. river cleanup) and the foundation's priorities must be applied.

  Now, let's run the procedure on the three hypotheticals.

  **Hypothetical 1: $80,000 for a food bank to expand weekend meal backpacks to two more school districts**

  1. **Initial Screening**: 
     - Within funding range? Yes (80k < 100k, so no board escalation required by amount). Aligns with foundation's mission (assuming food security is part of the portfolio). Application complete? We'll assume yes.

  2. **Direct and Local Impact Assessment**:
     - Outcomes: More children receiving weekend meals in two new school districts. Measurable by the number of backpacks distributed and possibly reduced food insecurity in those children (via surveys).
     - Evidence: Food banks typically have data on distribution. The causal link between providing meals and alleviating hunger is strong and well-established.
     - Sufficient: Yes.

  3. **Counterfactuals and Displacement**:
     - Counterfactual: Without the grant, the expansion doesn't happen, and children in those districts do not receive the weekend meals.
     - Displacement: The applicant admits it will pull volunteers from a neighboring program. This is a negative displacement effect.
     - Mitigation: The application does not mention mitigation. We must ask: Is there a plan to recruit more volunteers or otherwise mitigate? If not, we note the displacement and weigh the net effect.
     - Net effect: The direct benefit (meals for children) vs. the harm (reduced services in the neighboring program). Without mitigation, the net short-term effect is ambiguous.

     Since the displacement is acknowledged and significant, we require the applicant to provide a mitigation plan. If they cannot, we might reject. However, if the benefit in the new districts is substantial and the harm in the neighboring program is moderate (e.g., the neighboring program can adjust by recruiting more volunteers or the loss is a small percentage), we might still proceed.

     Let's assume the applicant does not have a mitigation plan. We then compare the scale: How many children will be served in the new districts vs. how many will be affected in the neighboring program? If the new districts serve 500 children and the neighboring program loses 10% of its volunteers, affecting 50 children, the net gain is 450 children. This is a rough estimate and requires human judgment.

  4. **Long-Term Effects**: 
     - The proposal does not make strong long-term claims. Any long-term benefits (e.g., improved child development) are uncertain but plausible. We note the uncertainty but do not heavily weight these.

  5. **Comparative Assessment**:
     - This proposal addresses immediate hunger, which is urgent. The foundation might prioritize this. But the displacement issue must be weighed.

  **Decision**: 
  - The displacement issue requires human judgment. Without a mitigation plan, we are comparing the gains and losses. If the net gain is positive and substantial, we might fund. Otherwise, we might ask for a mitigation plan or reject. Since the amount is below $100k, it doesn't escalate to the board. The program officer must decide.

  **Procedure Output**: 
  - The direct impact is clear and positive, but the displacement is a negative. We cannot precisely quantify the net effect because we don't know the exact impact on the neighboring program. The procedure flags this as a human judgment call. The program officer must decide whether the net benefit is worth the cost.

  **Hypothetical 2: $150,000 for a workforce training pilot**

  1. **Initial Screening**: 
     - Amount is $150,000 (> $100k) so must be escalated to the board regardless.

  2. **Direct and Local Impact Assessment**:
     - Outcomes: Short-term outcomes are the number of people trained, completion rates, job placement rates, and possibly starting wages. These are measurable.
     - Evidence: The applicant should provide evidence that their training leads to jobs (e.g., past programs, similar programs). Without such evidence, the direct impact is questionable.

     Let's assume they have data from a small pilot or similar programs showing that 70% of graduates get a job in the field within 6 months. That would be sufficient.

  3. **Counterfactuals and Displacement**:
     - Counterfactual: Without the grant, the pilot doesn't happen, and the participants do not receive this training. They might take other training or remain unemployed.
     - Displacement: The training might take resources (instructors, space) from other activities. The applicant should address this. If not, we assume minimal displacement if it's a new pilot.

  4. **Long-Term Effects**:
     - The proposal claims a chain: better jobs → reduced incarceration decades out.
     - We break the chain:
       - Link 1: Training → better jobs. Supported by the direct evidence (if they have it).
       - Link 2: Better jobs → reduced incarceration. There is research (e.g., Chetty's work) showing that better economic opportunities reduce crime, but the magnitude and timing are uncertain. The applicant should cite such studies.
     - The chain is plausible but uncertain. The applicant must acknowledge the uncertainty.

     Without strong evidence for the long-term chain, we do not rely on it. We base the decision primarily on the direct impact.

  5. **Comparative Assessment**:
     - The direct impact (jobs for participants) is valuable. The foundation might value workforce development. The long-term claims are uncertain and should not be the main selling point.

  **Decision**:
  - Because the grant is above $100k, it must go to the board. The program officer's report should highlight:
     - The measurable short-term outcomes are strong (if they are).
     - The long-term chain is plausible but highly uncertain and not quantifiable.
     - The board must decide if the direct impact is worth $150,000 given other opportunities.

  **Procedure Output**:
  - The procedure can assess the direct impact and flag the long-term claims as uncertain. The decision to fund a large pilot with uncertain long-term effects is a value judgment for the board.

  **Hypothetical 3: $30,000 to keep a small, beloved, demonstrably mediocre tutoring program alive**

  1. **Initial Screening**:
     - Within range and aligned? Yes.

  2. **Direct and Local Impact Assessment**:
     - Outcomes: The program is demonstrably mediocre. The tutoring does not show significant academic improvements. The applicant does not claim strong measurable outcomes.
     - Evidence: Past data shows mediocre results. The direct impact is weak.

     This step would normally lead to rejection.

  3. **Counterfactuals and Displacement**:
     - Counterfactual: Without the grant, the program dies. The school will redirect the space to a study hall.
     - The study hall might be more beneficial? Or less? We don't know. The applicant's argument is that the tutoring is better than the study hall, but they admit it's mediocre.

     The displacement (or replacement) effect: The space becomes a study hall. If the study hall would serve more students and provide a quiet place to study (which might be beneficial), then the net effect of funding the tutoring might be negative.

  4. **Long-Term Effects**: Not claimed.

  5. **Comparative Assessment**:
     - Non-instrumental values: The program is beloved. The community values it. This is a matter of community cohesion, trust, and possibly equity (if it serves a particular group). These are non-instrumental and cannot be quantified.

  **Decision**:
  - The direct impact is weak. The counterfactual might be neutral or even positive. But the non-instrumental value (beloved program) is the main argument. This is a clear case for human judgment based on values.

  **Procedure Output**:
  - The procedure flags that the measurable impact is insufficient. However, the decision must be made on non-instrumental grounds. The program officer must decide if the community value is worth $30,000. This is a value judgment.

  **Summary of the Procedure's Limitations**:
  - The procedure cannot resolve deep uncertainty about long-term effects. It can only note the uncertainty and force us to focus on what is measurable.
  - It cannot quantify non-instrumental values (e.g., community preferences, intrinsic value of a program). These must be decided by humans.
  - It cannot precisely weigh trade-offs between different domains (e.g., environment vs. youth) without a common metric. The foundation's priorities must guide this.

  The procedure is designed to make the cluelessness explicit and to force a focus on what we can know (short-term, direct effects) and to require human judgment when values or deep uncertainty are central.
answer: |-
  Below is a decision procedure designed to address consequentialist cluelessness while remaining practical for your context. It prioritizes **traceable local effects** (short-term, observable outcomes) over **untraceable chains** (long-term, speculative ripple effects), forces explicit acknowledgment of uncertainty, and flags when human judgment is required. The procedure has 5 sequential steps, with clear exit criteria for rejection, escalation, or human judgment calls. It assumes a 1-day timeline per proposal and basic spreadsheet skills.

  ---

  ### **Grant Decision Procedure**
  **Core Principle**: Prioritize proposals with strong evidence of *direct, measurable, short-term benefits* and minimal displacement. Treat long-term causal chains as speculative—they can support but not carry a proposal. Acknowledge cluelessness explicitly where counterfactuals or ripple effects are unknowable.

  #### **Step 1: Initial Vetting (15 mins)**
     - **Questions**: 
        - Is the proposal within our funding range ($20k–$250k)? 
        - Does it align with at least one foundation priority (e.g., youth, environment, poverty alleviation)? 
        - Is the application complete (budget, outcomes plan, evidence)?
     - **Sufficient Answer**: 
        - "Yes" to all. Incomplete applications get one request for missing data (if time permits). 
     - **Exit Criteria**:
        - **Reject** if outside range, misaligned, or incomplete after follow-up.
        - **Escalate to Board** if grant >$100k (per foundation rules), but continue evaluation.

  #### **Step 2: Direct Impact Assessment (1–2 hrs)**
     - **Focus**: Traceable, short-term effects (<3 years). Ignore long-term claims here.
     - **Questions**:
        1. What specific, measurable outcomes are promised in ≤3 years? (e.g., "100 kids fed weekly," "50 trainees certified.")
        2. What evidence supports causality? (e.g., pilot data, third-party studies, or logical causal models like "meals reduce hunger").
        3. How will outcomes be tracked? (Require metrics + collection method, e.g., attendance logs, pre/post surveys).
     - **Sufficient Answer**:
        - Outcomes must be quantifiable, time-bound, and plausible.
        - Causality requires at least **one** of: 
           - Peer-reviewed study in a similar context, 
           - Applicant’s historical data showing >10% improvement, 
           - A clear logic model (e.g., "tutoring → improved grades").
        - Tracking must be feasible (e.g., simple surveys, admin data).
     - **Exit Criteria**:
        - **Reject** if outcomes are vague, unsupported, or untrackable.
        - **Proceed** if direct impact is credible. Flag any admitted harms (e.g., volunteer displacement).

  #### **Step 3: Displacement & Counterfactual Analysis (1–2 hrs)**
     - **Focus**: What happens if we fund this? What if we don’t? Quantify trade-offs.
     - **Questions**:
        1. What resources (volunteers, funds, space) are diverted from other activities? 
        2. What is the counterfactual? (What happens without this grant? e.g., "Program shrinks" vs. "School runs study hall.")
        3. Does the applicant mitigate displacement? (e.g., volunteer recruitment drives).
     - **Sufficient Answer**:
        - Displacement must be quantified (e.g., "Loses 5 volunteers," "Costs $10k in lost donations"). 
        - Counterfactual must be plausible (e.g., based on past behavior or applicant data).
        - Mitigation should address >50% of displacement.
     - **Exit Criteria**:
        - **Reject** if net harm is likely (e.g., diverted resources cause larger losses than gains).
        - **Human Judgment Needed** if displacement/counterfactual is unquantifiable but material (e.g., "Pulls volunteers from an unmeasurable program").
        - **Proceed** if net direct benefit is clear (gains > losses) or losses are mitigated.

  #### **Step 4: Long-Term Chain Assessment (1 hr)**
     - **Focus**: Untraceable chains (e.g., "jobs → reduced incarceration"). Treat as speculative.
     - **Questions**:
        1. Does the proposal claim effects >3 years out? If yes, map the causal chain (e.g., "Training → jobs → less crime").
        2. For each link, what is the weakest assumption? (e.g., "Assumes job market demand," "Assumes crime-jobs correlation is causal").
        3. Is there evidence for >50% of links? (e.g., studies, data).
     - **Sufficient Answer**:
        - Chains must be acknowledged as uncertain. 
        - Evidence must exist for at least one link (e.g., a study linking jobs to crime reduction).
        - No overconfidence allowed (e.g., reject "guaranteed" long-term impacts).
     - **Exit Criteria**:
        - **Reject** if long-term claims are the primary case *and* lack any evidence.
        - **Human Judgment Needed** if the chain is plausible but unprovable (e.g., social ripple effects). Do not weight this in scoring.
        - **Proceed** if short-term benefits are strong, regardless of long-term claims.

  #### **Step 5: Portfolio Fit & Values Check (1–2 hrs)**
     - **Focus**: Human judgment when cluelessness dominates.
     - **Questions**:
        1. What non-instrumental values apply? (e.g., equity, community trust, moral obligation).
        2. Does this align with our portfolio balance? (e.g., "We fund 3 river projects but only 1 youth program").
        3. Is there urgency? (e.g., "Food bank can’t wait 6 months").
     - **Sufficient Answer**: N/A—this step is qualitative.
     - **Exit Criteria**:
        - **Human Judgment Required** for:
           - Conflicts between values and evidence (e.g., funding a beloved but mediocre program).
           - Trade-offs between traceable and untraceable effects (e.g., short-term cost vs. speculative long-term gain).
           - Allocation between domains (e.g., environment vs. youth).
        - **Recommend** based on Steps 1–4, but final call by staff/board.

  ---

  ### **Key Features for Honesty About Cluelessness**
  - **Traceable vs. Untraceable**: Steps 2–3 focus on local effects (knowable), Step 4 flags long chains (unknowable). Never mix them quantitatively.
  - **When Human Judgment is Forced**: 
    - Displacement/counterfactuals are unquantifiable (Step 3).
    - Long-term chains are plausible but unprovable (Step 4).
    - Values conflict with evidence (Step 5).
  - **Output Clarity**: The procedure returns:
    - A "Reject/Escalate/Recommend" decision.
    - A "Cluelessness Flag" where uncertainty is irreducible (forcing human ownership).
    - No fake precision: Long-term claims are noted but not scored.

  ---

  ### **Application to Hypotheticals**
  **Hypothetical 1: $80k for Food Bank Expansion**  
  - **Step 1**: $80k <$100k (no escalation). Aligns with poverty relief. Complete. ✅ Proceed.  
  - **Step 2**: Direct impact strong—meals for 200+ kids/week. Evidence: Food banks reliably reduce hunger. Tracking via distribution logs. ✅ Proceed.  
  - **Step 3**: Displacement admitted (volunteers pulled from neighboring program). Unquantified harm: "Some loss in neighboring services." No mitigation plan. ❗ **Human Judgment Needed**: Is feeding 200 kids worth potentially harming another program? We can’t trace second-order effects.  
  - **Step 4**: No long-term claims. N/A.  
  - **Step 5**: Values: Urgent need vs. fairness to other programs. Human must decide if net local benefit justifies risk.  
  - **Output**: ❗ **Conditional Yes, with Warning**. Short-term gain clear, but displacement requires human judgment. Staff must own the risk of untraceable harm to the neighboring program.

  **Hypothetical 2: $150k Workforce Training Pilot**  
  - **Step 1**: $150k >$100k. ✅ Escalate to board, but continue.  
  - **Step 2**: Direct impact credible—trains 50 people, places 70% in jobs. Evidence: Pilot data shows placement rates. Tracking via employment records. ✅ Proceed.  
  - **Step 3**: Minimal displacement (new pilot). Counterfactual: No training, higher unemployment. Mitigation: None needed. ✅ Proceed.  
  - **Step 4**: Long-term chain claimed (jobs → reduced incarceration). Weakest link: "Jobs prevent crime" (supported by studies, but correlation ≠ causation for this group). Plausible but unprovable. ❗ **Human Judgment Needed**: Long-term effects cannot be traced or trusted; decision must rest on short-term gains.  
  - **Step 5**: Values: High cost, but aligns with workforce goals. Board must weigh $150k against other options.  
  - **Output**: ⚠️ **Escalate to Board with Caution**. Fund only if short-term job placement justifies cost. Long-term claims are speculative—board must own the cluelessness.

  **Hypothetical 3: $30k for Mediocre Tutoring Program**  
  - **Step 1**: $30k <$100k. Aligns with youth. Complete. ✅ Proceed.  
  - **Step 2**: Direct impact weak—"mediocre" results per applicant’s data. No significant grade improvements. ❌ **Reject**: Fails direct impact.  
  - **Step 3**: (Only if Step 2 passed) Counterfactual: School converts space to study hall. Displacement neutral.  
  - **Step 4**: No long-term claims.  
  - **Step 5**: ❗ **Human Judgment Required**: Despite rejection, values argument exists ("beloved program," community trust). Staff may override rejection if non-instrumental values outweigh poor outcomes.  
  - **Output**: 🚫 **Reject, but Allow Values Override**. Direct impact insufficient. If funded, it’s a values-based choice—own the cluelessness that a study hall might be better. *This is the answer you won’t like, but the procedure forces honesty about mediocrity.*

  ---

  ### **What the Procedure Cannot Do**
  1. **Resolve Deep Cluelessness**: When displacement, counterfactuals, or long-term chains are unknowable (e.g., "Will pulling volunteers *really* harm the neighboring program?"), it flags for human judgment. No algorithm can trace causal ripples decades out.
  2. **Quantify Values**: It can’t weigh "beloved but mediocre" against "high-impact but impersonal." Humans must decide based on foundational values.
  3. **Predict Second-Order Effects**: Fallback heuristics (e.g., "prioritize traceable gains") are applied, but the procedure doesn’t pretend to calculate net global utility.
  4. **Eliminate Uncertainty**: It makes cluelessness explicit—forcing you to say, "We fund this because we value X, despite the unknown downstream effects."

  This procedure doesn’t settle philosophy but makes it operational: it isolates the knowable (local effects), contains the unknowable (long chains), and forces value judgments into the open where humans must own them. Run it in a spreadsheet with columns for each step, and you’ll have an auditable trail of where cluelessness was acknowledged.
