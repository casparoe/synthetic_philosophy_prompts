  Okay so after staying up way too late arguing with my roommates about our fantasy basketball league I think I'm pretty sold on Nozick's Wilt Chamberlain arguement for the entitlement picture. Like, the basic move that if you start from any neat patterned distribution, say equal shares, and then let people freely pay a dollar extra to watch the star player, you immediately end up with an unequal distribution that still seems perfectly just because everyone chose it, so justice has to be about how holdings came about not about matching some end-state formula. Our league actually does this with Venmo tips for the livestream and the best guy sometimes donates his cut back, plus my friend keeps saying digital perks that can be copied for free break the analogy, which got me wondering if I'm missing something.

