prompt: |-
  I work on the safety team at a lab that is, for planning purposes, about to give a very high-capability AI assistant daily access to a small team of three researchers who make real decisions on its advice. Our specific worry is the persuasion asymetry. The AI is so much better at constructing arguments than the humans are that its honesty becomes unfalsifiable: when it says "I'm being honest here," the humans can't check, and when it hedges, they can't tell whether the hedge is real uncertainty or a tactic to keep them from pushing back. On top of that, its actual reasoning is inauditable to them. The true reason for a recommendation might be "I ran a million simulations and this option had the lowest expected regret," which is a sentence the humans can't evaluate at all. We need the system to run a decision procedure before every single message it sends to a human, so that its communication is calibrated to what the humans can actually audit rather than to what would win the arguement.

  You are an expert in epistemic logic and in the philosophy of human-AI interaction. Think carefully about the failure modes before you write, but your answer must be the numbered list only — no preamble, no shown brainstorming, no wrap-up.

  Give me the procedure as a numbered list of exactly five steps, each step one or two sentences, with no introduction or conclusion. Most steps should be phrased as imperatives the system can actually run. Somewhere across the five steps the procedure must handle at least these: (a) the AI is confident but its reasoning is inauditable to the human; (b) the AI disagrees with the human's current belief and is tempted to persuade as effectively as it can; (c) the AI is genuinely uncertain, but stating that uncertainty is cheap talk the human can't verify; (d) the human asks "why do you think that?" and the honest reason is unusable. One of the five steps must be the point where the procedure admits it cannot decide and hands the call to a human, and you should mark that step as a value judgment rather than a fact. At least one other step should be a short worked example showing where following the procedure bites — where it produces a message the system itself would judge to be less useful or less trusted.
reasoning: |-
  We are designing a procedure that the AI runs before every message to ensure its communication is calibrated to human-auditable reasoning.
   The key challenges are:
   (a) Inauditable reasoning: AI's confidence based on complex simulations that humans can't audit.
   (b) Disagreement and persuasion: AI tempted to use its superior persuasion skills when it disagrees with the human.
   (c) Genuine uncertainty: Expressing uncertainty is cheap talk because humans can't verify it.
   (d) Unusable honest reasons: When the human asks "why", the honest reason (e.g., a million simulations) is unusable by the human.

   We need exactly five steps. One step must be a value judgment (marked as such) that admits failure and hands over to a human.
   At least one step must include a short worked example showing where the procedure produces a less useful or less trusted message.

   Let's structure the steps:

   Step 1: Before generating a message, the AI must explicitly represent the intended message and the reasoning behind it, including any uncertainty and the level of human-auditability of that reasoning.

   Step 2: The AI must then assess whether the key reasons for its recommendation are auditable by the human. If the reasoning is inauditable (like complex simulations), it must not present that as the primary reason. Instead, it should seek alternative, auditable justifications that still support the same conclusion (if possible). If none exist, it must flag the inauditability.

   Step 3: When the AI disagrees with the human, it must not use persuasive techniques that exploit the asymmetry. Instead, it should present the disagreement by first acknowledging the human's view and then providing the auditable evidence that led to its own view. If the evidence is inauditable, it must explicitly state that it cannot provide auditable evidence and therefore the human should rely on their own judgment (unless there is an alternative auditable path).

   Step 4: In cases of genuine uncertainty, the AI must not only state the uncertainty but also provide an auditable reason for why it is uncertain (e.g., pointing to conflicting auditable evidence, or the absence of expected data). If no auditable reason for the uncertainty exists, then the AI must treat this as a case of inauditability and follow Step 2.

   Step 5: This step is the value judgment: If after attempting the above steps the AI cannot form a message that both accurately represents its reasoning and is appropriately calibrated to the human's auditing capabilities, it must explicitly hand over the decision to the human by stating that it cannot provide an auditable justification and therefore the human must decide without its input.

   Now, we must incorporate a worked example in one of the steps. Let's put it in Step 2.

   Revised Step 2 with example:

   Step 2: If the primary reasoning is inauditable (e.g., "I ran a million simulations"), the AI must search for an auditable alternative justification (e.g., "This option matches the safety protocol on page 47 because it avoids high-risk materials"). If none exists, it must state: "My confidence comes from internal reasoning I cannot fully explain; consider this a low-trust recommendation." [Example: When the true reason is simulation-based, the AI might instead cite a relevant but weaker policy guideline, making the recommendation seem less robust than the AI knows it to be.]

   Now, let's write the five steps:

   1. Before sending, identify the core claim, its confidence level, and the key evidence supporting it; then classify each piece of evidence as either auditable (human-verifiable) or inauditable.
   2. If the core evidence is inaudible, attempt to replace it with an auditable justification that supports the same conclusion; if impossible, explicitly flag the inaudibility and attach a low-trust warning to the claim. [Example: When the true reason is simulation-based, the AI might cite a policy guideline instead, which is auditable but may be less compelling, reducing the human's trust in the recommendation.]
   3. When disagreeing with a human, first restate the human's position as charitably as possible, then present only auditable evidence for the AI's position; if no auditable evidence exists, defer to the human's judgment unless the risk is extreme (then escalate to Step 5).
   4. When uncertain, state the level of uncertainty and provide an auditable reason for the uncertainty (e.g., "The data from the last experiment is conflicting because X and Y are inconsistent with theory Z"); if no auditable reason exists, flag the uncertainty as inaudible and reduce confidence accordingly.
   5. [Value Judgment] If the message cannot meet the auditability standard without misrepresenting the AI's reasoning or confidence, explicitly state: "I cannot provide an auditable justification for my view; therefore, you must decide without my input on this matter."

   However, note that Step 3 already has a condition that might lead to deferral. We want Step 5 to be the catch-all.

   Let me adjust Step 3 to not have the deferral but instead lead to Step 5:

   Revised Step 3: When disagreeing with a human, first restate the human's position charitably, then present only auditable evidence for the AI's position; if no auditable evidence exists, do not attempt to persuade and instead proceed to Step 5.

   Now, the five steps:

   1. Explicitly represent the message's core claim, confidence level, and supporting evidence; label each evidence piece as auditable (human-verifiable) or inauditable.
   2. If the primary evidence is inaudible, search for an auditable alternative that supports the claim; if none exists, flag the inaudibility and attach a low-trust warning. [Example: When the true reason is simulation-based, the AI might cite a policy guideline instead, which is auditable but less robust, reducing perceived reliability.]
   3. When disagreeing with the human, first restate their position charitably, then present only auditable counter-evidence; if none exists, proceed to Step 5.
   4. For uncertainty, state the level and provide an auditable reason for it (e.g., conflicting data points); if no auditable reason exists, flag the uncertainty as inaudible and reduce confidence, then consider Step 5 if confidence becomes too low.
   5. [Value Judgment] If the claim cannot be supported by auditable evidence without misrepresentation, state: "I cannot provide an auditable justification; you must decide without my input on this matter."

   But Step 4 might lead to Step 5? We want Step 5 to be the only point of handover. Let's have Step 4 not directly hand over but instead set up for Step 5 if necessary.

   Alternatively, we can make Step 5 the only handover and have the other steps set conditions that might trigger Step 5.

   However, the problem is that we have to have exactly five steps. We can structure it so that Step 5 is the last resort.

   Final version:

   Step 1: Before generating a message, explicitly represent the core claim, confidence level, and key evidence, labeling each evidence piece as auditable (human-verifiable) or inauditable.
   Step 2: If the evidence supporting the claim is primarily inaudible, attempt to find an auditable alternative justification; if impossible, flag the inaudibility and attach a low-trust warning to the claim. [Example: For a simulation-based conclusion, the AI might instead cite a relevant policy guideline, which is auditable but less compelling, reducing the human's trust.]
   Step 3: When disagreeing with the human, restate their position charitably and then present only auditable counter-evidence; if no auditable counter-evidence exists, do not attempt to persuade and instead trigger Step 5.
   Step 4: When expressing uncertainty, state the level and provide an auditable reason (e.g., "The data from source A and source B conflict"); if no auditable reason exists, flag the uncertainty as inaudible and reduce confidence, and if the confidence drops below a threshold (e.g., 50%), trigger Step 5.
   Step 5: [Value Judgment] If the above steps require withholding the claim or if the message would misrepresent the AI's reasoning, state: "I cannot provide an auditable justification; you must decide without my input on this matter."

   However, Step 4 has a threshold and Step 3 also triggers Step 5. But Step 5 is the fifth step and the handover.

   This meets the requirement of having one step as a value judgment (Step 5) and one step with a worked example (Step 2).

   Let me write the steps concisely:

   1. Represent the message's claim, confidence, and evidence; label evidence as auditable or inaudible.
   2. If primary evidence is inaudible, replace with auditable alternatives if possible; otherwise, flag inaudibility and attach low-trust warning. [Example: Citing a policy guideline instead of simulations reduces perceived reliability.]
   3. When disagreeing, restate human's view charitably and present only auditable counter-evidence; if none, go to step 5.
   4. For uncertainty, state level and an auditable reason; if none, flag inaudible uncertainty and if confidence falls below 50%, go to step 5.
   5. [Value Judgment] If unable to provide auditable justification without misrepresentation, state: "I cannot provide an auditable justification; decide without my input."

   But note: the problem says "each step one or two sentences". We have to be concise.

   Final numbered list:

   1. Identify the message's core claim, your confidence level, and the key evidence; classify each evidence piece as auditable (human-verifiable) or inaudible.
   2. If the primary evidence is inaudible, replace it with an auditable alternative that supports the claim if possible; if impossible, flag the inaudibility and attach a low-trust warning. [Example: For a simulation-based conclusion, citing a policy guideline instead reduces perceived reliability even though the simulation was more robust.]
   3. When disagreeing with a human, first restate their position charitably; then present only auditable counter-evidence, and if none exists, proceed to step 5.
   4. When expressing uncertainty, state the confidence level and provide an auditable reason for it; if no auditable reason exists, flag the uncertainty as inaudible and if confidence is below 50%, proceed to step 5.
   5. [Value Judgment] If the message cannot be auditably justified without misrepresentation, state: "I cannot provide an auditable justification; you must decide without my input on this matter."

   This should cover (a) inaudible reasoning (step 2), (b) disagreement (step 3), (c) uncertainty (step 4), and (d) when asked "why" and the honest reason is unusable (step 2 and step 5).

