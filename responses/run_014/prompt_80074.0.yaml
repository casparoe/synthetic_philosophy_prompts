  Below is a "Free Will Functions" quiz designed to reveal what you **need free will to accomplish** (its "jobs") rather than abstract labels. Each question presents a concrete scenario where your choice reflects underlying priorities. The scoring will map to philosophical positions and flag inconsistencies.

  ---

  ### **The Quiz: What Do You Need Free Will to Do?**
  For each scenario, pick the answer that best reflects your intuition. Don’t overthink it—go with your gut reaction.

  1. **A driver texting while driving kills a pedestrian. At trial, you learn they’d just received news of their child’s death. How do you assign blame?**  
     A. They’re fully responsible—they chose to text.  
     B. They’re less responsible—extreme stress reduces culpability.  
     C. Blame is irrelevant; we should focus on preventing future harm.  

  2. **A billionaire donates $1M to charity. A cashier donates half their savings. How do you judge them?**  
     A. The cashier is more praiseworthy—their sacrifice was harder.  
     B. Both deserve equal praise—they freely chose to help.  
     C. Praise misses the point; it’s about systemic change.  

  3. **You’re struggling with addiction. A scientist says your genes make recovery unlikely. How do you respond?**  
     A. "I can still choose to fight—my actions matter."  
     B. "This helps explain my struggle, but I’m not powerless."  
     C. "This proves my efforts are futile; I’ll never change."  

  4. **A politician did something terrible 20 years ago but is now a model citizen. Should they resign?**  
     A. Yes—they’re accountable for past actions, regardless of change.  
     B. No—people evolve; judge who they are now.  
     C. Resignation is symbolic; focus on policy reforms.  

  5. **Two students cheat on a test. One gets caught; the other doesn’t. The caught student says, "I was unlucky." You say:**  
     A. "Luck doesn’t matter—you chose to cheat."  
     B. "You were unlucky, but you can grow from this."  
     C. "The system failed both of you equally."  

  6. **If determinism (all actions are caused by prior events) is true, what bothers you most?**  
     A. We couldn’t truly blame/praise anyone—morality collapses.  
     B. Life would feel meaningless—we’d be puppets.  
     C. Nothing—determinism changes nothing about responsibility.  

  7. **A friend with terminal illness says, "Fighting is pointless." You reply:**  
     A. "Your choices give life meaning—fight if you want to."  
     B. "Acceptance is wise, but your attitude matters."  
     C. "Outcomes are fixed; find peace in that."  

  8. **A judge sentences a reformed criminal harshly to "send a message." You think:**  
     A. "Good—people must answer for past actions."  
     B. "Counterproductive—it ignores their growth."  
     C. "The system should prioritize rehabilitation over punishment."  

  ---

  ### **Scoring Key**
  Tally your choices and match them to the **jobs** free will must perform for you. Jobs are:  
  - **B** (Blame/Punishment)  
  - **P** (Praise/Reward)  
  - **H** (Hope/Self-Change)  
  - **M** (Meaning/Purpose)  
  - **L** (Moral Luck Sensitivity)  
  - **R** (Responsibility for the Distant Past)  

  | Question | A          | B          | C          |  
  |----------|------------|------------|------------|  
  | 1        | B, R       | L          | —          |  
  | 2        | L, P       | P          | —          |  
  | 3        | H, M       | H          | —          |  
  | 4        | R          | H          | —          |  
  | 5        | B, R       | L, H       | —          |  
  | 6        | B, P       | M          | —          |  
  | 7        | M          | H          | —          |  
  | 8        | B, R       | H          | —          |  

  **How to score**:  
  - For each job (B, P, H, M, L, R), count how many times you chose an answer tagged with it.  
  - **You "need" the job** if you scored ≥2 for it (or ≥1 for P, since it has fewer questions).  

  #### **What Your Jobs Reveal**  
  - **Blame/Punishment (B)**: You need free will to justify holding people accountable for harm.  
  - **Praise/Reward (P)**: You need free will to validate moral credit for good actions.  
  - **Hope/Self-Change (H)**: You need free will to believe in personal growth or redemption.  
  - **Meaning/Purpose (M)**: You need free will to feel life isn’t predetermined or absurd.  
  - **Moral Luck Sensitivity (L)**: You think luck (context/circumstances) should mitigate blame/praise.  
  - **Responsibility for the Distant Past (R)**: You believe people are answerable for old actions, even if they’ve changed.  

  #### **Inconsistency Flags**  
  These combinations are **logically unstable** and may indicate unresolved tension:  
  - **High B/R + High L**: You want people accountable for past actions (B/R) *and* sensitive to mitigating luck (L). But if luck excuses some blame, it can’t apply unconditionally to the past.  
  - **High P + Low B**: You praise good actions (P) but don’t blame bad ones (B). This asymmetrical responsibility is rare—most theories treat blame/praise as two sides of the same coin.  
  - **High M + Low H**: You need free will for meaning (M) but reject hope/change (H). If life’s meaning requires free will, the power to *change* your path should matter too.  

  #### **Mapping to Philosophical Positions**  
  Based on your job profile:  
  - **Libertarian** (free will requires indeterminism): Needs **B, P, H, M, R** (all except L). Rejects moral luck (L) to preserve ultimate responsibility.  
  - **Compatibilist** (free will exists within determinism): Needs **B, P, H, L**. Less emphasis on R/M—responsibility is context-dependent.  
  - **Hard Determinist** (no free will): **Low all jobs** (especially B, P, H). May accept M if meaning comes from determinism.  
  - **Existentialist** (meaning through choice): Needs **H, M**. Less focus on B/P/L/R.  

  **Important**:  
  - Libertarians and compatibilists **both need B, P, H**—this quiz *cannot* split them. The difference is *how* they justify it (indeterminism vs. determinism).  
  - If you scored high in inconsistent jobs (e.g., B + L), you may be wrestling with conflicting intuitions rather than fitting a clean category.  

  ---

  ### **Why This Works**  
  This quiz bypasses labels by focusing on **functional needs**. For example:  
  - Choosing "A" in Q1 and Q5 reveals a need for **blame (B) and past responsibility (R)**.  
  - Choosing "B" in Q2 and Q5 reveals **moral luck sensitivity (L) and hope (H)**.  
  - Rejecting blame/praise (e.g., frequent "C" answers) suggests hard determinism.  

  By tying questions to concrete dilemmas, it exposes what you *want* free will to do—whether it’s assigning blame, finding meaning, or allowing redemption.
