  Help me pin down a number. Setup: the sphex wasp stings a cricket to paralyze it, drags it to the burrow, leaves it on the threshold, goes inside alone to check that everything's fine, comes back out and hauls the cricket in. If you nudge the cricket a few inches while she's inside, she'll drag it back to the threshold, go in to check again, and repeat — forty times over, never once just pulling it straight in. Call it sphexishness: behavior that looks goal-directed but is really a loop. Now imagine Sphex-Plus — same wasp, plus a monitoring subroutine that notices the cricket keeps getting moved and after N failed cycles tries something else, and then another layer watching that layer, for as many layers as you want.

  Proposition I want your credence on: free will of the sort that grounds basic desert is nothing over and above flexible, self-corecting responsiveness to reasons, so a system with enough of those layers would have it and theres no extra ingredient it could be missing.

  Give me your actual number, then the decomposition: P(desert requires something beyond reasons-responsiveness — sourcehood, ultimate authorship, whatever you want to call it), P(no finite stack of self-correction layers ever adds up to reasons-responsiveness in the sense that matters, just more elaborate sphexishness), P(the wasp-to-human gap is one of degree rather than kind), P(basic desert is coherent enough for this to have a truth value at all), plus any term I've left out. One line of justification each, then show me how they combine. And last: which term is your whole number most sensitive to, and what would move it — an argument or an experimental result, either counts.
