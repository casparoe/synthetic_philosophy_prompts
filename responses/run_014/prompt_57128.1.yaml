answer: |-
  **Essay Question:**  
  Nietzsche claims critical history must “judge and condemn” the past to serve life. Yet the critical judge is irrevocably shaped by the very historical forces they condemn, and Nietzsche insists forgetting (the unhistorical) is essential for action. Does Nietzsche’s conception of critical history therefore undermine itself by relying on the judge’s capacity to transcend the historical conditioning he diagnoses as pathological? Or does he provide a coherent, non-circular justification for its life-serving function? Defend a clear verdict.

  ---

  **Model Answer (448 words):**  
  Nietzsche’s critical history is ultimately self-undermining as a *methodologically* justified practice, but he avoids complete incoherence by grounding it purely in the subjective, life-affirming power of the judging individual – not objective historical truth. The core problem is inescapable: the critical historian, seeking liberation from a suffocating past, is themselves a product of that past. Nietzsche admits this explicitly, stating the judge stands “in the midst of the *conservative* forces of his time” (*UM II: 4*). To condemn the past *as such* requires a standpoint seemingly outside history, which Nietzsche’s historical sense denies exists. Furthermore, his insistence that the unhistorical (forgetting) is the vital ground for decisive action renders the hyper-consciousness demanded by critical judgment inherently suspect. How can one simultaneously enact the radical negation critical history requires and possess the unhistorical vitality needed for such action?

  Nietzsche’s escape route isn’t methodological but vitalistic. He doesn’t provide an objective standard for condemnation. Instead, the legitimacy of critical history rests solely on the strength of the individual’s or culture’s “plastic power” – its capacity to digest the past, assimilate what nourishes, and expel what poisons. The verdict (“condemnation”) isn’t a reasoned historical argument proving universal pathology; it’s the *act* of a powerful life asserting itself against what *it experiences* as debilitating. The judge doesn’t transcend history; they embody a specific historical configuration possessing sufficient strength to *use* history destructively. The sentence carried out is an act of vital self-preservation, not dispassionate justice.

  Consequently, critical history doesn’t collapse into incoherence *for Nietzsche* because its validity is performative, not epistemic. It “serves life” if the individual/culture enacting it emerges *stronger*, able to create. The circularity (judging history from within history) is embraced, not solved. The criterion is efficacy: does this act of violence against the past enable future action? If yes, it was “healthy” by definition, justified by the strength of the plastic power that dared it. There is no external arbitration; the strong life’s condemnation *is* the justification. Thus, critical history is self-undermining if we seek objective historical grounds for critique, but Nietzsche abandons that quest, rooting its possibility solely in the contingent strength of the life performing it.

  ---

  **Marking Scheme (Out of 20):**

  | Move                                                                 | Marks | Characteristic Way Students Blow It                                                                 |
  | :------------------------------------------------------------------- | :---- | :-------------------------------------------------------------------------------------------------- |
  | **Clear Verdict** on self-undermining (Yes/No/Qualified) stated early | 4     | Fails to take a definite stance; waffles or presents only a survey.                                 |
  | **Accurately identifies the core paradox**: Judge shaped by condemned past & need for unhistorical action vs. critical consciousness. | 4     | Only describes critical history superficially; misses the tension between history-dependence and the need to transcend/act. |
  | **Analysis of Plastic Power**: Explains its role as the vitalistic, non-epistemic criterion for critical history's validity. | 5     | Mentions plastic power but doesn't analyze it as the *only* escape from circularity; treats it passively (digesting only) not actively (violent condemnation). |
  | **Resolution/Conclusion**: Explains *how* Nietzsche avoids incoherence (vitalistic/performative justification) or why he fails. | 4     | Concludes it's simply contradictory; or reverts to "moderation" solution; or imports later concepts (e.g., Will to Power as developed concept). |
  | **Clarity, Structure, Textual Anchoring**: Logical flow, precise Nietzschean terminology (*unhistorical*, *plastic power*, *life*, *condemn*), avoids paraphrase errors. | 3     | Misreads core thesis (e.g., as *only* anti-antiquarian); treats text as generic "philosophy of history methods paper"; significant misattribution/misparaphrase (e.g., confusing monumental/antiquarian roles). |
