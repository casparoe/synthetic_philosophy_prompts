prompt: |-
  I'm a science journalist — I write about AI and the mind, mostly — and I'm part-way through a longish piece on the idea that thinking is computation, the whole "is the brain a computer?" thing, and everyone keeps telling me it starts with Hobbes, so I've gone back to the source. I'm stuck on chapter 1 of his Elements of Philosophy, the one people usually just call De Corpore (English version, 1656), where he writes: "By RATIOCINATION, I mean computation. Now to compute, is either to collect the sum of many things that are added together, or to know what remains when one thing is taken out of another. Ratiocination, therefore, is the same with addition and substraction; and if any man add multiplication and division, I will not be against it, seeing multiplication is nothing but addition of equals one to another, and division nothing but a substraction of equals one from another, as often as is possible. So that all ratiocination is comprehended in these two operations of the mind, addition and substraction." And then the very next thing he does is try to show how we manage this "in our silent thoughts, without the use of words", with an example of a man seeing something from far off and compounding his ideas into one, the way the three names body, animated, rational compound into "man".

  What I can't get straight, and I'd really like help with, is what's actually being claimed. Is this arithmetic on quantities, or just the weaker thought that any stretch of reasoning can be re-described as adding and subtracting ideas or symbols? Is it a claim about the machinery of the mind — which would make him a proto-computationalist a good three centuries before anyone built a general-purpose machine that could do it — or a claim about the form of reasoning, a logician's point about how inference is to be set out, with nothing mechanistic behind it at all? And if it is the mechanistic reading, why isn't this already the computational theory of mind, full stop? My half-formed hunch, which you're welcome to tell me is wrong, is that Hobbes's adding still needs an intelligent someone doing the adding, and that what the modern version adds is the thought that the adding itself can be done by something that understands nothing whatsoever — so the new ingredient is the program, not the arithmetic. I'd also like to know what that "without the use of words" example is doing: does it help the computational reading, since thought is compounding even without language, or hurt it, since then what exactly are the symbols?

  I'm not after a reading list — I've got the texts, I just can't get my head round the arguemnt. Could you write it in British English, and say plainly what's fair to claim about Hobbes here and what would be overreach?
reasoning: |-
  Okay, let me tackle this science journalist's query about Hobbes and computational theory of mind. The user is wrestling with a specific passage in De Corpore where Hobbes equates reasoning ("RATIOCINATION") with addition/subtraction operations. They're trying to determine whether this is proto-computationalism or just a logical formalism.

  First, I need to unpack Hobbes' core claim. His key point is that all reasoning reduces to mental addition (compounding ideas) and subtraction (separating ideas). The "silent thoughts" example shows this applies to non-verbal cognition - like recognizing a distant figure by combining "body + animated + rational" concepts. 

  The mechanistic vs formal distinction seems crucial here. Hobbes does describe mental operations mechanically - as literal motions in the brain matter. That's strikingly physical for his era. But he lacks modern computation's key feature: the separation between dumb symbol manipulation and semantic meaning. For Hobbes, the mind intrinsically understands the ideas it manipulates.

  The user's hunch about "intelligent adding" seems spot-on. Hobbes' mind actively comprehends while computing, unlike a Turing machine that blindly follows syntax rules. The modern computational theory's breakthrough was showing how meaningless symbol-crunching could produce meaningful thought.

  On the language question: the non-verbal example actually strengthens the computational reading by showing operations apply to mental representations generally, not just words. But it also highlights how vague Hobbes' "ideas" are compared to discrete computational symbols.

  I should emphasize what we can fairly claim: Hobbes pioneered mechanical reasoning models and reduction of thought to operations. But overreach would be calling him a full computationalist - that requires concepts like programmable algorithms and formal symbol systems he didn't have. The "without words" case shows his model's breadth but also its fuzziness compared to computational precision.
answer: |-
  Right, let's cut through the Hobbesian fog. You're wrestling with a genuinely slippery bit of proto-computationalism. Here’s a plain-English breakdown of what Hobbes is arguing in that De Corpore passage, what's fair to claim, and what might be overreach:

  **Hobbes's Core Claim (Stripped Down):**

  1.  **Reasoning *Is* Calculation:** Hobbes asserts that all reasoning ("RATIOCINATION") fundamentally consists of two basic operations: **adding** ideas together (compounding, aggregation) and **subtracting** ideas from each other (separating, distinguishing).
  2.  **Operations Defined Broadly:** His examples show he means "addition" and "subtraction" in a very broad, non-numerical sense:
      *   *Adding:* Combining simple ideas ("body", "animated", "rational") into a complex one ("man"). Or, in the "silent thought" example, combining sensory appearances ("shapes", "movements") with stored concepts ("human form", "friend's gait") to infer "that's my friend".
      *   *Subtracting:* Mentally separating attributes from an object or concept (e.g., subtracting "rational" from "man" leaves you with a different concept, perhaps "animal").
  3.  **It's Mechanistic (But Materialistically So):** This isn't *just* a logician's formalism for Hobbes. He explicitly grounds this in his materialist philosophy (developed throughout *De Corpore* and *Leviathan*). He believed:
      *   Thoughts are literally motions of material particles ("endeavours") within the brain/sensory apparatus.
      *   "Addition" is the physical combination or concurrence of these motions/endeavours.
      *   "Subtraction" is the inhibition or suppression of one motion by another.
      *   So, the "computation" he describes is a *physical, mechanical process* happening in the meat of the brain. There’s no immaterial soul *doing* the adding; the adding/subtracting *is* the physical process of thought itself.
  4.  **"Without Words" Example:** This is crucial for Hobbes. It serves two main purposes:
      *   **Universality:** It demonstrates that this computational process is fundamental to *all* thought, even non-linguistic, perceptual inference. It's not dependent on language; language is a later, useful tool built *on top* of this basic mental computation. Thought happens first as computation on mental representations ("ideas").
      *   **Mechanism Reinforcement:** By showing computation happening silently and rapidly in perception/cognition (e.g., recognizing a friend), he emphasizes its automatic, mechanical nature – it's not necessarily a slow, deliberate, verbal process.

  **What's Fair to Claim About Hobbes:**

  1.  **Proto-Computational Mechanist:** Absolutely. Hobbes is making a strong, *materialist-mechanist* claim about the nature of thought. He reduces reasoning to fundamental mechanical operations (add/subtract) performed on mental representations (ideas). He's explicitly describing the *machinery* of the mind (as he conceives it materially) as computational.
  2.  **Reductionist Visionary:** He's attempting a radical *reduction* of complex cognition (reasoning, judgment, inference) to basic combinatorial operations. This reductionist impulse is central to computationalism.
  3.  **Conceptual Link:** He provides the *earliest clear articulation* of the core intuition that thinking might be a form of calculation or symbol manipulation. He planted the seed.
  4.  **Non-Linguistic Foundation:** His "without words" example shows he understood that computation (as he defined it) applies to pre-linguistic mental representations, not just formal logic or language. This anticipates later ideas about mental imagery or non-symbolic representations in cognition.

  **Where Your Hunches Are Spot On & What's Overreach:**

  1.  **"Intelligent Adding" vs. "Dumb Symbol Crunching":** **This is the critical distinction.** You are exactly right. For Hobbes:
      *   The "ideas" being added/subtracted *are* the meaningful content. The mind manipulating them *is* inherently understanding them. There's no separation between the syntax (the adding/subtracting operation) and the semantics (the meaning of the ideas). The computation *is* the understanding in his materialist framework.
      *   **Overreach:** Claiming Hobbes had the *full* "computational theory of mind" (CTM). What he lacked are the **key innovations of the 20th century:**
          *   **Formal Symbol Systems:** The idea that computation can be defined purely syntactically on *uninterpreted symbols* (like 0s and 1s, tokens in a logical calculus) whose meaning is assigned externally.
          *   **Algorithmic Control:** The concept of a stored program (a list of instructions) that dictates *which* operations (add, subtract, etc.) are performed *when*, based on the current state and inputs. Hobbes has the operations, but not the programmable control structure.
          *   **Separation of Hardware and Software:** Hobbes is describing the "hardware" (the mechanical brain doing add/subtract). Modern CTM posits that the "software" (the program/symbol manipulations) can be independent of the specific physical hardware implementing it (multiple realizability).
          *   **Blind Execution:** Crucially, as you say, the modern view allows the computation (the symbol manipulation) to be done by something that *doesn't understand* the symbols (a Turing machine). The intelligence emerges from the *pattern* of symbol manipulation according to rules. For Hobbes, the manipulation *is* the understanding because the "symbols" (ideas) are intrinsically meaningful motions *to the mind* performing them. He doesn't have the concept of purely syntactic processing.

  2.  **Is it Arithmetic?** It's **broader than numerical arithmetic** but **narrower than universal computation**. He *extends* the metaphor of arithmetic to *all* mental combination and separation. He sees multiplication/division as special cases of add/subtract, which is mathematically correct for integers but doesn't capture the full generality of computation (e.g., conditional branching, recursion, memory addressing). His operations are powerful but insufficient to define universal computation.

  3.  **What the "Without Words" Example Does:**
      *   **Helps the Computational Reading (Broadly):** It shows computation isn't tied to language; it applies to the fundamental building blocks of thought (mental representations). It reinforces the mechanistic, automatic nature he's proposing.
      *   **Hurts the *Modern* CTM Reading (Slightly):** It highlights the *vagueness* of his "ideas." What *are* these non-verbal mental representations? How are they structured? How are they combined with the precision needed for complex reasoning? Modern CTM relies heavily on well-defined symbolic or connectionist representations. Hobbes's "ideas" are more nebulous sensory/conceptual composites, making his computational model feel less rigorous and less clearly applicable to abstract logical reasoning than later formal systems.

  **Plain Summary:**

  Hobbes made a bold, materialist, mechanistic claim: **Thought literally *is* the mechanical adding and subtracting of mental representations ("ideas") in the brain.** This is a foundational proto-computationalist idea. He deserves huge credit for this reductionist, mechanical vision centuries early.

  **However,** it's **not** the full modern Computational Theory of Mind. The crucial missing pieces are:
  *   **Formal, Uninterpreted Symbols:** His "ideas" carry meaning intrinsically.
  *   **Programmable Control:** He describes the operations, not the algorithm controlling them.
  *   **Syntax/Semantics Distinction:** His computation *is* understanding; there's no "blind" syntactic manipulation.
  *   **Generality:** His add/subtract operations, while broad, don't define universal computation.

  **Your hunch is correct:** The modern breakthrough wasn't just "thinking is calculation," but showing how *dumb, meaningless symbol-crunching*, guided by a program, could *produce* meaning and understanding. Hobbes had the calculation part, but the symbols themselves were still "intelligent" to the machine (the mind) performing the operations. He sketched the engine; modern CTM provided the programmable control unit and the concept of abstract, executable code.
