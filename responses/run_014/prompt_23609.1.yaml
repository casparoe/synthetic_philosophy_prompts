  ## The Anchored Necessity: A Defense of Kripke's Framework Amidst Contingency

  The Kripkean revolution in modal semantics, crystallized in *Naming and Necessity*, delivered a profound result: identities involving natural kinds, like "Water is H₂O," are necessary *a posteriori* truths. This hinges on two pillars: the rigid designation of "water" and "H₂O" (each picks out the *same* substance in every possible world where it exists), and the empirical discovery that the substance actually picked out by "water" *is* H₂O. Yet, a persistent worry gnaws at the foundation of this necessity: doesn't it secretly depend on the *contingent* fact that our initial act of reference-fixing latched onto H₂O rather than some other substance (say, XYZ on Twin Earth)? If so, is the resulting necessity genuine, robust, and metaphysical, or merely a relative, language-anchored shadow? This essay argues that while the contingency of reference-fixing is undeniable, it does not undermine the *metaphysical necessity* of the identity once reference *is* fixed. Kripke's necessary *a posteriori* survives as a stable category, grounded in the essential properties of the world, not dissolved into contingency or epistemic confusion.

  ### Steelmanning the Objection: The Phantom of Contingency

  The objection is potent because it strikes at the heart of what we expect from *metaphysical* necessity – a truth that holds *no matter what*, independent of contingent features of our world, language, or history. The argument proceeds rigorously:

  1.  **Contingency of Baptism:** The initial act(s) fixing the reference of "water" – pointing to samples in oceans, lakes, and glasses – was radically contingent. In a different possible world (Wt), speakers could have been qualitatively identical, performed ostensive acts indistinguishable from ours, and uttered sounds "water," but been causally connected to XYZ, not H₂O.
  2.  **Rigidity Follows Baptism:** The rigid designation of "water" is parasitic on its actual reference. In our world (Wa), "water" rigidly designates H₂O. In Wt, "water" rigidly designates XYZ. The term's rigidity is a function of *what it actually refers to*.
  3.  **Contingency of Identity Truth-Condition:** The truth-value of the sentence "Water is H₂O" depends on the outcome of the contingent baptism. In Wa, it's true. In Wt, where "water" refers to XYZ, "Water is H₂O" is false (and necessarily false, since "water" rigidly picks XYZ).
  4.  **Derivative Necessity?** Therefore, the *necessity* of "Water is H₂O" *in Wa* seems contingent upon the baptism landing on H₂O. Had the baptism landed on XYZ, "Water is H₂O" wouldn't just be false, it would be *necessarily false*. The necessity we attribute to it is not intrinsic to the proposition itself, but relative to the contingent linguistic fact that "water" actually refers to H₂O. It's a "conditional necessity": *Given that* 'water' refers to H₂O, then necessarily water is H₂O.
  5.  **Robustness Lost:** Genuine metaphysical necessities (e.g., "2+2=4," "Bachelors are unmarried") do not exhibit this dependency. Their truth and necessity seem absolute, independent of how we label things or what specific features our world happens to have. The necessity of "Water is H₂O," by contrast, appears "anchored" to Wa, making it merely "Wa-necessary" rather than metaphysically necessary *simpliciter*. This dissolves the necessary *a posteriori* into a contingent truth about language plus a trivial conditional necessity.

  The force here is the demand for *absolute invariance*. If the *modal status* of a proposition (its necessity or contingency) can change based on contingent features of the actual world, how can it represent a deep feature of reality itself? It seems like a linguistic artifact.

  ### Steelmanning the Kripkean Reply: Necessity Anchored in Actuality

  The Kripkean defense doesn't deny the contingency of reference-fixing. It argues, however, that this contingency is irrelevant to the *metaphysical necessity* of the identity *once the reference is fixed in the actual world*. Metaphysical modality is fundamentally *world-relative*, anchored to how things *actually* are:

  1.  **Modality is Actuality-Dependent:** Metaphysical necessity isn't defined in a vacuum. To ask "is P necessary?" is implicitly to ask: "Is P true in all possible worlds *considered as counterfactual situations relative to the actual world*?" The actual world provides the reference point for evaluating modal claims. What is possible or necessary depends on what is *actually* the case.
  2.  **Reference-Fixing is Part of Actuality:** The fact that in Wa, the baptismal events causally grounded the term "water" to H₂O is a *brute contingent fact about Wa*. It's as much a part of actuality as the chemical composition of the samples themselves.
  3.  **Rigidity Captures De Re Modality:** Rigid designation guarantees that "water," *as used in Wa*, picks out H₂O in every possible world. "H₂O" rigidly picks out the same chemical kind. Therefore, the *de re* claim about the *substance itself* designated in Wa – namely, that *it* (H₂O) is necessarily self-identical and has its chemical composition essentially – entails that "Water is H₂O" (as uttered in Wa) is true in every possible world. The sentence expresses a necessary truth *about the actual referent*.
  4.  **The Contingency is Misplaced:** The contingency lies entirely in *how we came to refer* to that substance and *which* substance we ended up referring to. It does not lie in the modal properties *of the substance itself* once it is the referent. The necessity of "Water is H₂O" (Wa) is a necessity *about H₂O*, not about the term "water." That the term could have referred to something else is true, but irrelevant to the modal status of the *identity concerning the substance it actually does refer to*.
  5.  **The Anchor is Essential, Not Accidental:** The anchoring to actuality isn't a defect; it's constitutive of metaphysical modality. The necessity of "Water is H₂O" is robust precisely because it tracks the *essential properties* of the natural kind H₂O *as it exists in the actual world*. Demanding a necessity independent of any actual-world anchoring (like the objection seems to) conflates metaphysical necessity with logical or conceptual necessity. The necessary *a posteriori* is necessary *because* it reflects mind-independent essences discovered empirically, not *despite* it.

  The Kripkean insists that the objector commits a scope fallacy. While it's true that **The proposition expressed by 'Water is H₂O' in Wa is necessary** is contingent on Wa being actual (since in Wt, a different proposition is expressed by that sentence), this does not mean that *within Wa*, the proposition **Water is H₂O** is anything less than metaphysically necessary. Its necessity is absolute *relative to the framework of Wa as actual*.

  ### Resolution: The Stability of the Necessary *A Posteriori*

  The Kripkean reply is ultimately persuasive. The objection, while highlighting a crucial feature of language (the contingency of reference-fixing), mislocates the source of the identity's necessity and misunderstands the nature of metaphysical modality.

  1.  **Necessity Resides in the World, Not the Fixing:** The necessity of "Water is H₂O" derives from the essential chemical nature of the substance *H₂O itself*. That *this* substance (the one actually instantiated in our lakes and labs) couldn't be anything other than H₂O is a mind-independent fact. The reference-fixing ceremony merely *allows us to formulate a proposition* that latches onto this essentialist truth. The contingency of the ceremony doesn't infect the necessity of the discovered fact about the *res*. The necessity is about the *stuff*, not the *dubbing*.
  2.  **Actuality as the Non-Negotiable Anchor:** All genuine metaphysical modality is anchored to actuality. Consider "This table is not made of ice." Its contingency depends on *which* table "this" actually refers to. Or "Gold has atomic number 79": its necessity depends on the actual referent of "gold" having that atomic number essentially. To demand necessity *without* this anchor is to ask for modality unmoored from reality – a fantasy. The anchored nature of "Water is H₂O" is shared by all *de re* necessities concerning concrete entities.
  3.  **The Necessary A Posteriori Intact:** The category remains stable and genuine. The *necessity* is metaphysical: it concerns the essential properties of actual entities, holding across possible worlds. The *a posteriori* aspect arises because discovering *which* essential properties an actual entity has (or indeed, *which* entity our terms rigidly designate) requires empirical investigation. Knowing that "water" rigidly designates *whatever* it was baptized to is trivial *a priori*. Knowing that the baptized stuff is H₂O, and that H₂O has its chemical structure essentially, is *a posteriori*. Discovering this empirical fact reveals the necessity.
  4.  **Not Merely Relative, Not Confused:** This necessity isn't merely "relative" in a problematic sense. It's not relative to a description or a perspective; it's anchored to the *actual world state*, including the essential properties of its constituents and the causal history linking terms to them. It doesn't dissolve into contingency: the identity *is* contingent only in the trivial sense that the actual world could have been different, but *given* the actual world, it is necessary. Nor is it an epistemic confusion: the distinction between the *a priori* grasp of rigidity and the *a posteriori* discovery of the essence that guarantees necessity is clear.

  ### Conclusion

  The contingency of reference-fixing is real but ultimately harmless to the metaphysical necessity of natural kind identities like "Water is H₂O." The necessity resides firmly in the essential properties of the actual-world referent, accessed through our rigid designator. Metaphysical modality, by its very nature, is evaluated relative to the actual world, encompassing its contingent histories and essential structures. To deny the necessity of "Water is H₂O" on the grounds that our linguistic connection to H₂O is contingent is to mistake the origin of our *access* to a truth for a feature of the truth itself. Kripke's necessary *a posteriori* survives not as a confusion or a merely relative necessity, but as a profound discovery: our language, through rigid designation, allows us to latch onto the essential fabric of the world, revealing necessities that are as robust as the world itself, even though we must empirically discover what that fabric actually is. The anchor isn't a flaw; it's the connection to reality that makes metaphysical necessity meaningful.
