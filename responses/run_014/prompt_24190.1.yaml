prompt: |-
  Write a short story about the reference class problem. A person who has just been diagnosed with a disease, and the doctor gives them survival stats for a bunch of different groups they belong to — the group with their symptom, the group with their treatment, the group their age. The stats point in very different directions, and they cant just pick the group that sounds best. The point is to make the reader feel the tension of not knowing which reference class is the "right" one to use.
reasoning: |-
  Okay, the user wants a short story about the reference class problem. Let me start by understanding the core of the problem. The reference class issue arises when someone belongs to multiple statistical groups, each giving different probabilities, making it hard to know which one applies best. The user specified a medical scenario: a person diagnosed with a disease gets conflicting survival stats from different groups (symptoms, treatment, age). The key is to make the reader feel the tension of uncertainty.

  First, I need to set up the protagonist. Let's call her Sarah. She's 42, diagnosed with a rare disease. The doctor provides survival rates based on different reference classes: her specific symptom (severe headaches), the new treatment she's receiving, and her age group. Each group gives a different statistic—5%, 65%, 85%. The challenge is she can't just pick the most favorable one; she has to grapple with which is relevant.

  Next, building the tension. The story should show her emotional rollercoaster. Initial shock, then hope with the treatment stat, confusion when age gives a high number, and the crushing doubt when the doctor presents the symptom-based stat. Highlight her internal conflict: wanting to believe the higher numbers but knowing the lower one might be more accurate to her case.

  I should make the characters relatable. Dr. Aris is compassionate but honest, explaining the limitations of statistics. Sarah's background as a data analyst adds irony—she's used to interpreting data but now can't apply it to her own life. Her family with two kids adds emotional stakes, making the survival stats more poignant.

  The setting in the doctor's sterile office enhances the feeling of isolation. Sensory details like the hum of the AC, the cold chair, and the smell of antiseptic can amplify her anxiety. When Dr. Aris shows the graphs, Sarah's physical reactions (shaking hands, tight chest) show her stress without telling.

  The resolution isn't neat. The doctor admits uncertainty, emphasizing that statistics are guides, not certainties. Sarah's decision to fight, despite not knowing, underscores the human element. The ending focuses on her taking control through action, symbolizing hope beyond numbers.

  I need to ensure each reference class is presented clearly. The symptom group (severe headaches) has a low 5% 5-year survival. The new treatment boosts it to 65%, but it's still experimental. Her age group (40-45) shows 85%, but that might not account for her specific condition. The conflict between these numbers drives the tension.

  Also, the ethical dilemma: can she morally choose the higher stat? The doctor's warning that picking the best number isn't honest reinforces the reference class problem. Sarah's realization that she's a unique individual, not just a data point, ties into the theme.

  Check if the story meets the user's requirements. Medical context: yes. Conflicting stats: yes. Tension and uncertainty: shown through her internal struggle. No resolution to which class is right, emphasizing the problem. Emotional impact: her fear, hope, and determination make it relatable. Any deeper needs? The user might want to highlight the limitations of statistics in personal decisions, or the anxiety in medical uncertainty. The story addresses that by showing Sarah's turmoil and her choice to focus on action over numbers.
answer: |-
  The word “rare” echoed in Sarah’s skull, heavier than the diagnosis itself: *Gliofibroma Type VII*. Dr. Aris’s kind eyes held a practiced calm, but the stack of printouts on his desk felt like a physical threat. “Statistics are complex with rare presentations like yours, Sarah,” he began, his voice gentle but firm. “Survival depends heavily on context. Let me show you the landscapes you inhabit.”

  He slid the first graph towards her. “*Group A: Patients presenting with your specific primary symptom cluster – severe, persistent cephalgia with focal neurological deficits.*” A jagged line plummeted. **5-Year Survival: 5%.** The number hit her like ice water. Five percent. Barely a flicker. Her vision swam, the sterile clinic smell suddenly cloying.

  “But,” Dr. Aris continued, sliding another sheet, “that’s not the whole picture. Look at *Group B: Patients receiving the new targeted immunotherapy regimen, Protocol Kappa, first-line.*” This line was a slow, hopeful climb. **5-Year Survival: 65%.** Sarah gasped, a desperate flutter of hope in her chest. Sixty-five! It felt like surfacing for air. Maybe… maybe she could fight this. She had two kids, ten and seven. Sixty-five percent meant a chance.

  He wasn’t done. A third graph appeared. “And then there’s *Group C: Patients in your age bracket, 40-45, generally healthy prior to diagnosis.*” This line was almost serene, a gentle plateau. **5-Year Survival: 85%.** Eighty-five percent! Relief, warm and dizzying, washed over her. She was fit, she ran marathons! She belonged *here*. Surely this group, the one reflecting her vitality, was the one that mattered?

  Her gaze darted between the three graphs, the starkly different numbers screaming at her. Five percent. Sixty-five. Eighty-five. Which one was *her*? Was she defined by the terrifying symptom that brought her here? By the cutting-edge treatment Dr. Aris offered? Or by the fundamental fact of her age and baseline health?

  “I… I don’t understand,” Sarah stammered, her voice tight. “Which one applies? Which one is *real* for me?” She looked desperately at Dr. Aris. “Can I… can I just focus on the 85%? That feels… right.”

  Dr. Aris sighed, a sound heavy with the weight of the problem. “Sarah, that’s the reference class dilemma. You belong to all these groups simultaneously. The 5% group has people getting Protocol Kappa and people your age too, but their outcomes were pulled down by other factors – perhaps other symptoms, comorbidities we haven’t found, or simply bad luck. The 85% group includes people with milder forms of gliofibroma or different treatments. The 65% is specific to the treatment, but it assumes you respond typically, and it includes patients much older or younger than you.”

  He leaned forward. “Picking the one that sounds best… it’s tempting, Sarah. Morally tempting, even. But it might not be honest. We don’t know *which* of these overlapping circles your specific case truly sits within. The symptom group might be most relevant if the headache severity indicates a more aggressive variant. The treatment group might be key if Protocol Kappa is truly a game-changer for your biology. The age group might dominate if your overall resilience is the deciding factor. We simply lack the granularity to know.”

  The tension was a physical thing now, a band tightening around Sarah’s ribs. The 5% felt like a death sentence whispered in her ear. The 65% was a fragile life raft on a stormy sea. The 85% was a cruel, distant shore she desperately wanted to believe in. But they couldn't all be true at once. She belonged to all these tribes, yet none seemed to hold the definitive answer for *her*.

  Her hands shook as she touched the graphs – the terrifying 5%, the hopeful 65%, the deceptive 85%. Each number represented a possible future, a different path carved by the arbitrary boundaries of a statistician's definition. Which reference class held the key to her fate? The question hung in the sterile air, thick and unanswerable, leaving her stranded in a terrifying limbo between wildly different probabilities. The only certainty was the crushing weight of the unknown.
