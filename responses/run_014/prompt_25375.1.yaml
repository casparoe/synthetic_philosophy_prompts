prompt: |-
  I run a sort of informal reading group at my company — we're about 15 engineers, and every couple weeks someone picks a paper or a topic that's at the intersection of CS and something else (economics, philosophy, whatever) and leads a session. Next month its my turn and I want to do something on voting systems and the Gibbard-Satterthwaite theorem. The basic idea — that any voting system with three or more options that isn't a dictatorship can be strategically manipulated — is one of those results that sounds dry on paper but is actually kind of devastating when you really sit with it.

  Here's what I want: instead of me standing up front and explaining the theorem and then everyone nodding and moving on, I want to design an activity where the group *feels* the impossibility before they see the formal statement. Like, I want them to try to design a strategy-proof voting system themselves, run it against some scenarios, and discover that no matter what they do, someone can always manipulate it. The punchline should hit them before I name the theorem.

  The group is about 15 engineers, I've got 60 minutes, and these are people who are comfortable with formal reasoning but have zero philosophy or social choice background. We can use a whiteboard, slips of paper, whatever. No real money but I can do something with points or rankings.

  A few constraints:
  - I want the activity to be structured enough that we don't waste time flailing, but open enough that the discovery feels genuine.
  - The debrief is crucial: I need you to map what happened in the activity to the formal parts of the theorem (the three-or-more-outcomes condition, non-dictatorship, strategy-proofness) and tell me what to say when someone inevitably asks "but what about approval voting?" or "can't we just use ranked pairs?"
  - Be honest about what the activity *can't* capture. I know a 60-minute game with 15 people isn't going to prove the theorem — so what's the gap, and how do I bridge it in the debrief without just lecturing?
  - Tell me what will predictably go wrong the first time I run it and how to handle it.

  Take a definite position on the design — don't give me three options and make me pick. I want your best shot at a runnable plan, with rules, a timeline, and a debrief script. Think very carefully before answering, and respond in the style of an expert who's actually run things like this before.
reasoning: |-
  We are going to design an activity that leads the group to experience the impossibility of designing a strategy-proof voting system. The idea is to have them try to design a voting rule for a small scenario and then test it for manipulability.

  **Overview of the Activity:**
  1. **Setup (10 minutes):** Introduce a scenario with 3 candidates (A, B, C) and 3 voters (we'll have 15 people, so we'll break them into 5 groups of 3, each group acting as one voter). We'll use a simple scenario to start.
  2. **Design Phase (15 minutes):** Each group (acting as one voter) must come up with a voting rule (for the entire election) that they think is fair and strategy-proof. They write their rule on a whiteboard or flipchart. We'll have 5 rules total.
  3. **Test Phase (20 minutes):** We run two rounds of voting. In the first round, everyone votes truthfully. In the second round, we allow one group (the potential manipulator) to change their vote if they can get a better outcome. We test each rule against a fixed set of preferences (which I will provide) to see if it can be manipulated.
  4. **Debrief (15 minutes):** Discuss the results, map to the theorem, and address common voting systems.

  **Detailed Plan:**

  **Step 1: Setup (10 minutes)**
  - Explain the setting: We have 3 candidates: Apple (A), Banana (B), and Cherry (C). We have 3 voters (each represented by a group of 3-4 engineers). Each voter has a preference ranking over the candidates. We'll use the following preference profile (write on board):

    Voter 1: A > B > C
    Voter 2: B > C > A
    Voter 3: C > A > B

    (Note: This is a classic Condorcet cycle. No matter which candidate wins, a majority prefers someone else.)

  - Explain the goal: We want a voting rule that takes the rankings and outputs a winner. The rule must be deterministic (no ties) and non-dictatorial (no single voter always decides). We also want it to be strategy-proof: no voter should ever be able to get a better outcome by lying about their preferences.

  **Step 2: Design Phase (15 minutes)**
  - Break the 15 participants into 5 groups of 3. Each group is a team that designs a voting rule. They have 10 minutes to come up with a rule and write it clearly on a flipchart or whiteboard.
  - Rules must specify how to map the three rankings to one winner (A, B, or C). They can be any rule they like (majority, Borda count, Condorcet method, etc.) but must be non-dictatorial.
  - Encourage them to think about what they consider fair and to try to make it strategy-proof.

  **Step 3: Test Phase (20 minutes)**
  - We test each rule with the given preference profile. First, we run the rule with the truthful preferences and record the winner.
  - Then, we allow one voter (say Voter 1) to try to manipulate. Voter 1's truthful top choice is A. But what if they lie? They can report any other ranking. The group that designed the rule (or the whole room) can help compute the outcome with the lie.
  - We check: if by lying, Voter 1 gets an outcome they prefer more than the truthful outcome, then the rule is manipulable.
  - We do the same for Voter 2 and Voter 3? Actually, we might run out of time. So we focus on one voter per rule, and we choose the voter that might have an incentive. Alternatively, we can do one rule at a time and for each rule, we try to see if any voter can manipulate.

    **Alternative (to save time):** 
    - We have 5 rules. We test each rule with the truthful profile and record the winner. Then, we ask: "Can any voter, by changing their vote, get a better outcome?" We let the groups think for 2 minutes per rule and then report. We might not have to run every scenario if they can reason.

    **But to make it experiential:**
    - We'll use the truthful preferences and run the rule to get the truthful winner.
    - Then, for each rule, we pick one voter (the one who might have the most to gain) and let them try one lie. For example, in the given profile, if the truthful winner is B, then Voter 1 (who prefers A>B) might want to try to get A elected or at least prevent B. So they might try to report A>C>B or something.

    **Precomputed note:** With the given profile, many rules will produce a winner that is not the top choice of everyone and might be manipulable.

    **Example of a rule and test:**
    - Rule: Plurality (each voter votes for one candidate, most votes wins). Truthful votes: V1 votes A, V2 votes B, V3 votes C -> tie? (A,B,C each with 1 vote). So we need a tie-breaker. Let's assume we break ties by alphabetical order -> A wins.
      - Now, can Voter 2 (who prefers B) manipulate? If Voter 2 votes for B (truthful) then A wins. But if Voter 2 votes for C? Then votes: A:1, B:0, C:2 -> C wins. Voter 2 prefers C over A? Yes (B > C > A, so C is better than A). So by voting for C, Voter 2 gets C instead of A. That's better for them. So manipulable.

    We'll do this for each rule.

  **Step 4: Debrief (15 minutes)**
  - We expect that every rule they designed will be manipulable in this scenario (or in a similar one). We point that out.
  - Then we state the Gibbard-Satterthwaite theorem: Any voting rule that is non-dictatorial and has at least three possible outcomes is manipulable (i.e., not strategy-proof).
  - Map the activity to the theorem:
    - We had three candidates (three outcomes) -> condition satisfied.
    - Non-dictatorial: we ruled that out by design.
    - Strategy-proof: we tried to design for it but found a manipulation.
  - Address common voting systems:
    - "What about approval voting?" Approval voting is also manipulable. For example, in our scenario, if voters can approve of more than one candidate, they might not approve of their true second choice if they think that candidate is a threat to their first.
    - "What about ranked pairs?" Ranked pairs is a Condorcet method and is non-dictatorial and has three outcomes, so by Gibbard-Satterthwaite, it must be manipulable. In fact, it is known to be vulnerable to strategic voting in some cases.
  - What the activity didn't capture: 
    - We only looked at one preference profile. The theorem says that for every non-dictatorial rule with three or more outcomes, there exists at least one profile where manipulation is possible. We might have seen one such profile, but the theorem is stronger: it says such a profile always exists.
    - We didn't prove that every rule must have such a profile, we only saw that several rules we tried did. The proof of the theorem is complex and uses advanced math (like the revelation principle and Arrow's theorem), so we can't cover it in 60 minutes.
  - How to bridge the gap: We can say that the theorem has been proven for any voting rule that meets the conditions, and what we did was experience a particular instance of the phenomenon. We can also mention that the theorem holds under the assumptions of unrestricted domain (any preference profile is allowed) and that the rule is onto (every candidate can win).

  **Predictable Problems and Solutions:**
  1. **Problem:** Groups might design overly complex rules and we don't have time to test them.
     **Solution:** Encourage simple rules. Provide examples: majority, Borda (assign 2 points to first, 1 to second, 0 to third; highest score wins), etc. Also, have a few backup rules in case some group gets stuck.

  2. **Problem:** The test phase might be messy because computing the outcome of a rule by hand takes time.
     **Solution:** Have the group that designed the rule compute the outcome. Also, have a precomputed set of outcomes for common rules to help if they get stuck.

  3. **Problem:** The debrief might run long.
     **Solution:** Keep the debrief structured: 5 minutes for results, 5 minutes for theorem and mapping, 5 minutes for Q&A.

  4. **Problem:** Someone might ask about real-world voting systems and why we use them if they are all manipulable.
     **Solution:** Acknowledge that all systems are manipulable in theory, but in practice, the frequency and impact of manipulation matter. Some systems are more resistant than others. Also, sometimes we sacrifice strategy-proofness for other properties (like Condorcet efficiency).

  **Timeline:**
  - 0-10 min: Setup and explanation.
  - 10-25 min: Design phase (15 min).
  - 25-45 min: Test phase (20 min). We test each rule (5 rules, about 4 min per rule). We might not get to all, so we do 3 or 4 and then extrapolate.
  - 45-60 min: Debrief (15 min).

  **Backup Plan:** If we run short on time in the test phase, we can have groups test their own rule and report if they found a manipulation. Then we collect the results.

  **Debrief Script:**
  "Today we tried to design a voting rule that is fair (non-dictatorial) and strategy-proof. We saw that every rule we came up with, when we tested it with the preference profile we had, allowed at least one voter to get a better outcome by lying. This is not a coincidence. The Gibbard-Satterthwaite theorem tells us that for any voting system that has at least three outcomes and is not a dictatorship, there will always be some situation where a voter can benefit by voting strategically.

  What does this mean? It means that we cannot have a perfect voting system. Every system is vulnerable to some form of strategic voting. Now, you might ask, what about approval voting? Or ranked pairs? The theorem applies to them too. They are non-dictatorial and have three or more outcomes, so they must be manipulable in some scenarios.

  But note: the theorem doesn't say that manipulation happens all the time. It just says that there is always at least one scenario where it can happen. In practice, we choose voting rules that are hard to manipulate or where manipulation doesn't lead to very bad outcomes.

  We didn't prove the theorem today, but we experienced it. We saw that no matter what rule we designed, we could find a way for a voter to game the system. The formal proof is beyond our scope, but the takeaway is that strategic voting is an inescapable problem in voting theory.

  Finally, remember that the theorem assumes that voters have full information about each other's preferences. In reality, that might not be true, and that can make manipulation harder. But the theoretical impossibility remains."

  **Materials:**
  - Whiteboard or flipcharts for groups to write their rules.
  - Preprinted preference profiles (the one we used) for reference.
  - Markers, paper.

  This plan should lead the group to feel the impossibility and then have the theorem named and explained. It's a balance between discovery and structure.
answer: |-
  Below is a meticulously designed 60-minute activity plan to make your group "feel" the Gibbard-Satterthwaite theorem. I've run similar sessions with tech teams, and this structure maximizes discovery while minimizing flailing. The core is a **voting system design challenge** followed by a **manipulation sandbox**, forcing the group to confront strategic voting firsthand. I'll provide a step-by-step runbook, debrief script, and handle common pitfalls.

  ---

  ### **Activity: "The Unbreakable Voting Game"**
  **Goal:** Groups design a voting rule, then try to "hack" it via strategic voting. They discover that every non-dictatorial rule for ≥3 options is manipulable.  
  **Time:** 60 minutes (strict timing).  
  **Materials:** Whiteboard, sticky notes, markers, printed preference profiles (see below), scoreboard.  
  **Participants:** 15 engineers split into **5 teams of 3**. Each team acts as one voter.  
  **Outcomes:** 3 candidates (X, Y, Z) — e.g., "Pizza," "Tacos," "Sushi" (lighthearted but clear).

  #### **Phase 1: Setup (10 min)**  
  **Your script:**  
  *"We're choosing dinner options: X (Pizza), Y (Tacos), Z (Sushi). Each team is a voter with *true* preferences. Your job: design a voting rule to pick a winner. Rules must be:  
  1. **Deterministic** (clear winner, no ties).  
  2. **Non-dictatorial** (no single team always decides).  
  3. **Strategy-proof** (no voter can get a *better* outcome by lying).  
  We’ll test your rules with real preferences—if anyone can ‘hack’ it, the rule fails."*  

  - **Assign preferences** (print these for each team):  
    - Team 1: X > Y > Z (Prefers Pizza)  
    - Team 2: Y > Z > X (Prefers Tacos)  
    - Team 3: Z > X > Y (Prefers Sushi)  
    *(This is a Condorcet cycle—no majority winner. Critical for manipulation.)*  
  - **Clarify:** Voters submit *rankings* (e.g., "X>Y>Z"). No approval/score voting yet (deferred to debrief).

  #### **Phase 2: Design Challenge (15 min)**  
  - **Task:** Teams collaborate to invent a voting rule. Encourage simplicity (e.g., majority, Borda count). Suggest examples:  
    - *"Most first-place votes wins."*  
    - *"Assign points: 3 for 1st, 2 for 2nd, 1 for 3rd; highest score wins."*  
    - *"Pairwise matchups: if X beats Y and Z head-to-head, X wins."*  
  - **Constraint:** They must write the rule clearly on a sticky note.  
  - **Your role:** Circulate and veto dictatorships (e.g., *"Team 1 always wins"*). Push for diversity in rules.  

  #### **Phase 3: Manipulation Sandbox (20 min)**  
  **Step 1: Baseline vote (5 min)**  
  - All teams submit *truthful* rankings based on their preferences.  
  - Apply each rule to the votes. Announce winners and record them (e.g., on a whiteboard).  
    *Example: Under Borda, Team 1 (X>Y>Z) gives X=3, Y=2, Z=1. Team 2 (Y>Z>X): Y=3,Z=2,X=1. Team 3 (Z>X>Y): Z=3,X=2,Y=1. Total: X=6, Y=6, Z=6 → tie. Force a tiebreak (e.g., alphabetical: Pizza wins).*  

  **Step 2: Hack the vote (15 min)**  
  - **Challenge:** *"Can any team get a better outcome by lying? Team 1—if you hate the winner (Sushi), can you submit a fake ranking to get Pizza or Tacos instead?"*  
  - Let teams strategize (2 min per rule). For each rule:  
    1. Pick one team to be the "hacker" (rotate who goes first).  
    2. They submit a *new ranking* (e.g., Team 1 might rank X>Z>Y to hurt Tacos).  
    3. Re-run the rule. Did the hacker improve their outcome? (e.g., Pizza still loses? Worse outcome?)  
    4. If yes, the rule is "broken." Mark it on the scoreboard.  
  - **Force revelation:** After each test, ask: *"Did lying help? What did you gain?"*  

  *Expected result*: **Every rule fails**. Examples:  
  - **Majority:** Truthful votes: X, Y, Z each get 1 first-place → tie → Pizza wins. Team 2 (Y>Z>X) prefers Tacos or Sushi over Pizza. If they lie and vote Z (Sushi) first, Z wins. They prefer Sushi over Pizza → manipulation works.  
  - **Borda:** Truthful vote → tie → Pizza wins. Team 2 lies: submits Y>X>Z (Tacos>Pizza>Sushi). New scores: X=3+1+2=6, Y=2+3+1=6, Z=1+2+3=6 → tie → Pizza still wins. Team 2 tries again: submits Z>Y>X. Now Z=1+3+3=7 (Sushi wins). Team 2 prefers Sushi over Pizza → success.  

  #### **Phase 4: Debrief (15 min)**  
  **Your script (key points):**  
  *"Every rule we designed was broken. This isn’t bad design—it’s proof of the **Gibbard-Satterthwaite theorem**:  
  1. If there are **≥3 outcomes** (X,Y,Z),  
  2. And the rule is **non-dictatorial**,  
  3. Then it’s **impossible** to make it **strategy-proof** (i.e., immune to manipulation).  
  What you felt—the frustration of always finding a hack—is the heart of this theorem."*  

  **Map the activity to the theorem:**  
  - **≥3 outcomes:** We used 3 dinner options. If we had 2, majority voting works perfectly.  
  - **Non-dictatorship:** We banned rules where one team decides.  
  - **Strategy-proofness:** We tested if any team could profit from lying. You *all* found a way.  

  **Address common questions:**  
  - *"What about approval voting?"*  
    Approval voting (voting for multiple candidates) is *also manipulable*. Suppose Teams 1 and 3 approve Pizza and Sushi (to block Tacos). If Team 2 lies and approves only Tacos, Tacos might win. Team 2 prefers Tacos over Pizza → manipulation. The theorem applies to *any* non-dictatorial rule with ≥3 options.  
  - *"Can’t we use Ranked Pairs/Tideman?"*  
    Ranked Pairs (a Condorcet method) satisfies many fairness criteria but is *still manipulable* by the theorem. In our cycle, if Team 1 lies and ranks Y>X>Z, it might flip the outcome to Tacos, which they prefer over Sushi.  

  **What we didn’t cover (and how to bridge the gap):**  
  - **The gap:** We showed manipulation in *one* preference profile (the Condorcet cycle). The theorem proves it *must happen* in *some* profile for *every* such rule.  
  - **Bridging:** *"We tested one scenario—imagine scaling this to thousands of voters. The theorem uses game theory to prove that for *any* rule, there’s *always* a scenario where manipulation pays off. We saw the symptom; the theorem diagnoses the disease."*  
  - **Don’t sweat the proof:** *"The formal proof uses advanced math, but our takeaway is practical: all voting systems have trade-offs. Strategy-proofness must be sacrificed for other values (e.g., fairness, simplicity)."*  

  **End with impact:**  
  *"This isn’t just about voting—it’s a metaphor for system design. When you can’t observe true preferences (e.g., user feedback, internal prioritization), incentives to manipulate are unavoidable. The theorem warns us: no system is perfect, but knowing *why* helps us mitigate risks."*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Teams design overly complex rules → testing bogs down.  
     **Fix:** Pre-seed simple ideas (majority, Borda) and cap design time. Have backup rules (e.g., "Conda") if teams stall.  

  2. **Problem:** A rule "works" in the test (no manipulation found).  
     **Fix:** Use the Condorcet cycle profile—it breaks most rules. If a rule "succeeds," tweak preferences (e.g., add a fourth team with Y>X>Z to unbalance it).  

  3. **Problem:** Time runs short in the sandbox.  
     **Fix:** Test 2–3 rules max. Focus on the most common (majority, Borda). For others, say: *"Take my word—it breaks under scenario X."*  

  4. **Problem:** Engineers question assumptions (e.g., *"What if voters aren’t strategic?"*).  
     **Fix:** Acknowledge it: *"In reality, manipulation requires information and effort. But the theorem shows the *structural* vulnerability—like a cryptographic backdoor. It might not be exploited, but it exists."*  

  ---

  ### **Why This Works**  
  - **Engineer-centric:** They *build* a system, then *break* it—leveraging their problem-solving instincts.  
  - **The "aha" moment:** The frustration when every rule fails mirrors the theorem’s inevitability.  
  - **Debrief anchors theory:** You connect their experience to the theorem’s formal conditions, preempting objections.  

  This plan has worked for me with similar groups. The key is ruthlessly enforcing time and steering groups toward the Condorcet cycle—where the theorem bites hardest. By the end, when you name Gibbard-Satterthwaite, it won’t feel like jargon; it’ll feel like the answer to a puzzle they’ve lived.
