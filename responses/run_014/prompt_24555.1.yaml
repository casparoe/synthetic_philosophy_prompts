prompt: |-
  I'm putting together an episode of my philosophy of biology podcast with a guest who defends the "wastefulness requirement" version of Zahavi's handicap principle, ie. the view that signals are honest not merely because production cost tracks quality, but because the cost is positive and wasteful, so that low-quality types can't afford to imitate. Draft 8 interview questions that go beyond having him restate the view. I want atleast one question each on: how the handicap account separates itself from cheap index signals like a pain scream or the size of a shadow; what the 2019 critique claiming Grafen's own equilibrium models don't actually support the handicap hypothesis means for his defense; and how he answers trade-off models where honesty is maintained by production costs alone, with no wastefulness at all. For each question, add a follow-up keyed to the answer he's most likely to give. Think very carefully before answering, and respond in the style of an expert in the evolution of animal communication.
