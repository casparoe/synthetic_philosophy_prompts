  Okay, the user is preparing a philosophy of biology podcast episode with a guest who defends Zahavi's handicap principle, specifically the "wastefulness requirement" version. They need eight interview questions that go beyond restating the view, with specific requirements about cheap index signals, Grafen's 2019 critique, and trade-off models. 

  First, I need to recall the core distinction: Zahavi's original idea insists that signals must be wasteful (handicapping) to guarantee honesty, whereas index signals rely on physical constraints without extra waste. The guest likely argues that indexical honesty is unstable because it can be faked if the physical constraint is bypassed, while handicaps impose unbearable costs on low-quality signalers.

  For the Grafen critique question, Számadó and Penn's 2019 paper argued that Grafen's models don't actually require wastefulness - they show honesty can emerge through differential marginal costs alone. The guest probably counters that Grafen's "strategic choice" framework inherently builds in wastefulness through opportunity costs, and that the critique misses how viability costs manifest as waste in biological contexts.

  Regarding trade-off models (like Getty or Lachmann), where honesty comes from production costs without waste, the guest likely claims these ignore the "quality-decoding problem" - that receivers can't assess absolute costs, only relative affordability. The follow-up should press whether empirical cases like crab claw size truly avoid waste.

  The user's deeper needs seem to be: 
  - Wanting rigorous critiques exposed (hence targeting all three weak points) 
  - Seeking clear conceptual distinctions (waste vs cost, index vs handicap) 
  - Needing the guest to defend against major modern challenges 
  - Aiming for listener engagement through contentious debate

  I'll structure questions to force the guest to: 
