  Hmm, the user’s core challenge is showing Tolstoy’s theory through action and dilemma rather than exposition. They mentioned their musicologist friend suggested "putting the theory under pressure," so the story must embody the tension between technical skill and authentic emotional transmission. The protagonist’s internal conflict—pride vs. guilt, ambition vs. integrity—should mirror the artistic debate. 

  The user emphasized avoiding a "neat moral" resolution. That means the ending must linger uncomfortably. Also, the sister’s ghostly presence is crucial: her authenticity contrasts with his artifice. Key symbols: the symphony (complex, lifeless) vs. the folk song (simple, alive). Setting details should feel period-accurate but unobtrusive—stifling conservatory halls, the looming Russian winter. 

  For voice, I’ll lean into restrained 19th-century prose: avoid metaphors Tolstoy would scorn, use concrete sensory details (frost patterns, the sister’s cough), and let silence speak. The folk song’s impact must be shown through villagers’ reactions, not described. When the committee chair calls the symphony "remarkable but strange," that’s where Tolstoy’s critique whispers through. 

  Biggest risk is over-explaining the theft. Instead, I’ll imply it through the sister’s memory—her humming, his guilt. The open ending: his hand hovering over the documents mirrors his suspended choice. Art’s "truth" remains unanswered, just as Tolstoy might’ve wanted.
answer: |-
  The frost etched intricate, skeletal patterns on the windowpane of Pyotr Ivanovich’s small room overlooking the conservatory courtyard. Below, muffled scales and arpeggios drifted up like ghosts trapped in the ice. On his worn desk lay the letter, crisp and damning: the Imperial Prize Committee requested submission of *one* composition for consideration. Two scores rested beside it.

  One, bound in expensive leather, contained his Symphony in D Minor. He could trace the labyrinthine counterpoint, the daring harmonic shifts, the sheer architectural ambition that had earned him comparisons to the young Rimsky-Korsakov. Critics lauded its "dazzling intellect," its "masterful command of form." Yet, Pyotr remembered the premiere in St. Petersburg – the polite applause, the audience leaving the hall talking of supper plans, the music dissolving like mist. It had felt, always, like a magnificent cathedral built for no congregation but himself.

  The other score was a single, flimsy sheet. *Katerina’s Song*. Written in faded ink, the melody a simple, ascending phrase like a sigh, harmonized with open fifths that resonated like church bells heard across snow. He’d played it once, only once, on his sister Katya’s old balalaika, for the villagers back home near Tula. He remembered the stunned silence, then the rough hands wiping eyes, old Babushka Anya openly weeping, a burly blacksmith clearing his throat gruffly. "Ach, Pyotrushka," someone had murmured, "it’s like you tore the ache right out of our hearts." They’d begged him to play it again and again. That warmth, that visceral *recognition*, was a feeling utterly alien to the symphony's reception.

  Katya. Her face, pale even before the illness, swam before him. She’d hummed constantly – strange, wordless tunes that wove through the chores, the long summer evenings on the porch. *Katerina’s Song* was hers. He’d found the scrap of paper tucked into her prayer book after the coughing finally stopped. He’d polished it, transcribed it neatly, claimed it as his own. Who would know? Katya was dust, her music ephemeral as breath. He needed the recognition, the door the Imperial Prize could open. The symphony, he told himself, was the *real* art, demanding years of study. The song was… a trifle. A peasant lullaby.

  Now, the lie had weight. The Committee, impressed by reports of the song’s profound effect, specifically mentioned it as a contender alongside the symphony. To submit the symphony was to choose ambition, the validation of his craft, the path he’d sacrificed for. To submit *Katerina’s Song* was to embrace the stolen warmth, the undeniable power it held over listeners… and to risk exposure when they inevitably asked for the composer to speak of its origins.

  Pyotr paced the narrow room. The symphony’s intricate themes echoed in his mind, complex and cold. Then, unbidden, Katya’s melody surfaced – pure, unadorned, carrying the scent of birch forests and the quiet sorrow of the steppe. He heard not just the notes, but the collective gasp of the villagers, the raw humanity of their response. Tolstoy’s words, dog-eared in his own copy of *What is Art?*, burned: *"Art is a human activity consisting in this, that one man consciously, by means of certain external signs, hands on to others feelings he has lived through, and that other people are infected by these feelings and also experience them."* By that measure, Katya’s song was potent art. His symphony? Perhaps just… craft. Brilliant, intricate craft, admired but unfelt.

  But Katya hadn’t "handed on" the feeling through conscious artistry; she’d simply *lived* it, hummed it into the air. He, Pyotr, the trained composer, had merely captured the echo. Was it still "genuine" transmission if the transmitter was a thief? Did the feeling lose its authenticity passing through his hands? Or did the song’s undeniable power over its audience validate it regardless?

  He recalled Tolstoy’s scorn for his own earlier, complex works. Pyotr had always secretly agreed, finding *War and Peace* magnificent but distant, while the stark simplicity of *Master and Man* had haunted him for weeks. Was he facing his own *War and Peace* versus *Master and Man*? The symphony, his ornate past; the song, a potential future of radical honesty? But the honesty was built on a lie.

  The conservatory director, a man whose own compositions were models of academic sterility, summoned him. "The Committee awaits your submission, Pyotr Ivanovich," he said, peering over spectacles. "A momentous opportunity. Your symphony is remarkable, truly. A testament to your rigorous training." He paused, steepling his fingers. "Though some on the Committee found it… a touch cerebral. Intellectually admirable, but perhaps…" He searched for the word, "...*strange* to the common heart. Whereas this little song…" He gestured vaguely. "Reports suggest it possesses… directness. Accessibility. Very much in the spirit of the times, this return to the soil, the authentic." He leaned forward. "The Imperial Prize favours works that resonate, Pyotr Ivanovich. Consider carefully."

  *Resonate.* The word struck Pyotr like a physical blow. His symphony resonated with critics, with the conservatory elite. Katya’s song resonated with the earth itself, with peasants whose lives were hardship and fleeting joy. But could resonance born of deceit truly be art? Or was the resonance itself the only truth that mattered?

  He returned to his room as dusk bled into the winter sky. He picked up the leather-bound symphony. Its weight was reassuring, the promise of a future built on acknowledged skill. He opened it, the dense notation a fortress of his own making. Then he placed it back on the desk.

  He picked up the single sheet of *Katerina’s Song*. The ink seemed to pulse faintly. He could almost hear Katya humming, smell the medicinal tinctures of her sickroom, feel the collective sigh of the villagers. The melody felt alive, demanding release. Submitting it would be an act of profound dishonesty… and perhaps the most truthful artistic statement he could make about the power of pure, unadorned feeling. It *would* win the prize. He knew it. And the lie would be cemented.

  He dipped his pen. The inkwell reflected the lamplight, a small dark pool. He stared at the submission form. The space for the composition’s title gaped blank.

  Outside, the wind scraped branches against the windowpane. A student in a distant practice room began a tentative, melancholic étude. Pyotr Ivanovich sat very still. The frost on the window deepened its hold, blurring the world beyond. The pen hovered. The silence in the room was thick enough to choke on, broken only by the faint, remembered echo of a simple song that made an entire village weep. He did not know which name he would write. He only knew that whichever he chose, a part of him – the ambitious composer, the grieving brother, the man wrestling with the ghost of Tolstoy and the nature of art itself – would feel like a lie. The pen remained poised, a question mark against the white page, waiting.
