  1. **Your hunch holds partially**: The core dichotomy (statistical vs. harm-based thresholds) is real, but both philosophies acknowledge statistical tools. Naturalists just deny values *foundationally* shape them.  
  2. **Where lab vocabulary struggles**:  
     - Teleological concepts ("species design," "function for survival"). Labs replace these with empirical distributions.  
     - Qualities like "vital goals." Labs handle this via clinician-set decision limits but don't operationalize the goals themselves.  
  3. **Unspoken alignment**: Both camps agree on using reference intervals—they disagree on whether those intervals are "discovered" (naturalism) or "chosen" (normativism).  
  4. **Residue ownership**: Philosophical debates expose hidden assumptions in lab practice (e.g., reference population selection). Conversely, lab thinking exposes naturalism's empirical gaps (e.g., no "gold standard" for species function).  

