prompt: |-
  So I'm on sabbatical this year and, as punishment for writing op-eds about public memory, I got drafted onto our city's Commemoration Review Panel — nine of us, mostly retirees, one county archivist, and a councilmember who has never once spoken. We take up petitions to remove, rename, or contextualize public honors, and we now have eight decisions behind us. Condensed, but I think fairly:

  1. Statue of a Confederate colonel in a park, erected 1911, the same session the state rewrote its voting rules; the city's Black churches petitioned against it at the time and were ignored; his only claim to remembrance is the uniform. Removed — and we specifically voted down keeping it with an interpretive plaque, the chair saying a plaque on that one is just slower removal.
  2. Street named in 1953 for a surgeon who in the 1840s operated on enslaved people without consent, which a handful of his contemporaries called monstrous at the time; his technique is still taught and still saves lives. Renaming would have hit about 4,000 addresses, and the residents who'd inherit the paperwork — majority Black, and against it almost unanimously — came to us. Kept the name, markers at both ends naming the people he operated on.
  3. 1908 statue of a suffragist who also campaigned hard for Chinese exclusion and said exactly why; that politics had nothing to do with the work she's honored for; erected by a women's club; the local Chinese-American historical society told us they wanted it to stay with real context rather than go. Kept it, funded a proper companion installation.
  4. Middle school named in 1962 for a segregationist board member whose entire public record is resistance to desegregation — not a thinker or a builder, just an organizer of delay; the school is now 94% Black; nobody protested the naming in 1962; the alumni association wrote in asking us to leave it alone. Renamed, over the alumni.
  5. Bridge named for a railroad man who used armed strikebreakers and people died; legal, routine, and barely remarked on in its day; almost nobody knows the bridge carries his name; the unions asked for a labor-history marker, not a renaming. Marker added, name kept.
  6. Courthouse bust of a judge who upheld convict leasing, erected 1936 by the state bar, decades after a federal report had already called the system slavery by another name; his own opinions say the quiet part out loud. Descendants of leased men asked for it to go and the bar agreed. Removed.
  7. Park named in 1975 for a pediatrician; in 2019 letters surfaced showing he'd sent two gay patients to conversion therapy in the sixties and written ugly private things about them. The community group that came to us asked for an acknowledgment, not a renaming. Kept the name, issued the acknowledgment; I'm still not sure we did right.
  8. Fountain dedicated 1899 to a city founder's wife for her charity hospital work; in 1898 she'd written against vaccinating the "tenement classes," a common view then, which killed nobody traceably; the hospital she built is still a clinic. Kept, no action.

  Now the live one, and I've been staring at it for a week. In 1897 a subscription of businessmen put up a monument in a small plaza to the quartermaster who rebuilt the city's water works after the great fire — the cholera numbers before and after arent in dispute, the man plausibly saved thousands of lives, and the system is still in service. He also paid the Irish immigrant laborers who dug it below the going wage, fought any compensation for the families of the eleven who died in the trenches, and wrote about those men in terms published in his own lifetime that nobody then thought disqualified him. The Catholic parishes sent a protest letter in 1897 and it was ignored. The inscription praises him for finishing the works "under budget," and the parishes read that phrase, in 1897, as a boast about the wages. Our local Irish-American heritage society says leave the figure alone, they'd much rather the city build something for the laborers; the labor council wants it out; the plaza is small, removal is cheap, and the water department declines to have an opinion.

  What I want from you isn't a vote. I want (a) the three or four candidate rules that each fit all eight precedents — I keep oscillating between something about what the honoring act asserted at the moment it was performed, something about whether the celebrated achievement can be seperated from the wrong it rests on, something about whether the honoree was condemned by his own contemporaries, and something about deferring to the people the harm actually landed on, and I genuinely can't tell which one the panel is running because we haven't disagreed enough yet; (b) what each of those rules says about the quartermaster, so I can see exactly where they come apart; (c) your best single guess at the verdict, plus which of the eight you'd call the closest analog and why; and (d) the one hypothetical case we should invent and slip onto next quarter's docket whose verdict would actually discriminate between the rules, since I have some influence over the agenda and I'd like to spend it. If the record genuinely underdetermines the outcome, say so plainly and tell me what principle we'd be adopting with each option, rather than pretending the precedents decide it for us. And please write in American English — the minutes go out to council and I'm going to paste chunks of this straight in.
reasoning: |-
  Okay, let me unpack this complex commemoration case step by step. The user serves on a city panel reviewing historical monuments and names, and needs help analyzing a new case about a 1897 water works quartermaster monument. The monument honors someone who saved thousands from cholera but exploited Irish immigrant laborers. 

  First, I need to understand the eight precedent cases they've decided. Each involves balancing historical contribution against harm, with varying outcomes. The user wants me to extract consistent principles from these decisions - but I notice the rulings aren't mechanically consistent. The panel seems to weigh different factors situationally: contemporary condemnation, separation of achievement from harm, deference to affected communities, and the original commemorative intent.

  For the quartermaster case, different principles would lead to different outcomes:
  - If emphasizing contemporary condemnation (like the Confederate statue case), removal is likely since Catholic parishes protested in 1897.
  - If separating achievement from harm (like the surgeon street name), they might keep it with context since the water system saved lives independently from labor exploitation.
  - Deferring to affected descendants (like the segregationist school renaming) points toward removal, as Irish heritage groups prefer new monuments for laborers rather than contextualizing this one.
  - Considering original commemorative intent (the "under budget" inscription) suggests removal since the cost-saving directly references the exploitation.

  The closest precedent seems to be the surgeon case (#2) - both involve lifesaving work tainted by ethical violations, but with key differences. Here, the harm is directly tied to the achievement (cost-saving via exploitation), and the original protest was ignored.

  I'd predict the panel will remove this monument. Not because of precedents alone, but because the harm is inseparable from the praised achievement, and the affected community prefers removal over contextualization. The "under budget" inscription makes the exploitation part of the celebration.

  For a discriminating hypothetical, I'd propose a case where an honoree's harmful views were publicly known but their achievement was completely unrelated - like a scientist who made breakthrough discoveries while holding bigoted personal views. That would test whether separation of achievement from harm trumps contemporary awareness of wrongdoing.
answer: |-
  Here's a breakdown following your structure, designed for direct use in panel discussions:

  ### (a) Candidate Rules Fitting All Eight Precedents
  1.  **Harm-to-Achievement Nexus:** *Does the harm directly enable, fund, or constitute the celebrated achievement?* If yes, removal/renaming is likely. If the achievement stands independently *despite* the harm, contextualization or retention is favored.
  2.  **Contemporary Condemnation Test:** *Was the specific harmful conduct widely known and condemned by morally significant contemporaries at the time?* Strong contemporary condemnation weighs heavily toward removal/renaming; lack of it or mere "common view" status leans toward retention/context.
  3.  **Affected Community Primacy:** *What is the clear preference of the group(s) most directly harmed or descended from those harmed?* Strong preference by the affected community is typically decisive, whether for removal, renaming, contextualization, or retention.
  4.  **Commemorative Intent Specificity:** *What specific act or virtue was the honoring act explicitly celebrating at the time?* If the honoring act *specifically celebrates* the harmful conduct itself or a virtue inseparable from it (like "under budget" via exploitation), removal is likely. If it celebrates a distinct achievement, retention/context is possible.

  ### (b) Applying Rules to the Quartermaster (Case 9)
  *   **Rule 1 (Harm-to-Achievement Nexus):** **High Nexus.** The low wages and refusal of compensation *directly enabled* finishing "under budget," which is the *explicitly praised virtue* on the monument. The achievement (life-saving water works) is inseparable from the harmful means used to achieve it cheaply. → **Strongly Favors Removal.**
  *   **Rule 2 (Contemporary Condemnation Test):** **Clear Condemnation.** The Catholic parishes (representing the affected community) specifically protested *in 1897*, linking the "under budget" boast to the exploitation. This wasn't a fringe view; it was an organized protest ignored by the commemorators. → **Strongly Favors Removal.**
  *   **Rule 3 (Affected Community Primacy):** **Split Preference.** The Irish-American heritage society prefers retention (monument stays) *but* wants a *new commemoration for the laborers*, explicitly *not* contextualizing the existing monument. The Labor Council wants removal. The preference leans *away* from contextualizing *this* monument and toward creating something new. Neither group endorses contextualizing the *current* monument. → **Leans Toward Removal** (as contextualization is rejected, and one key group demands removal).
  *   **Rule 4 (Commemorative Intent Specificity):** **Intent Celebrates Harm.** The inscription explicitly praises finishing "under budget." The 1897 protest directly linked this phrase to the wage exploitation and deaths. The commemoration specifically celebrates the cost-saving *achieved through harm*. → **Strongly Favors Removal.**

  ### (c) Predicted Verdict & Closest Analog
  *   **Best Guess Verdict:** **Removal.** The harm is intrinsically linked to the celebrated virtue ("under budget"), it was contemporaneously protested by the affected community, and the preferences of descendant groups lean against contextualizing *this specific monument*. The combination of Nexus, Condemnation, and Specific Intent is powerful.
  *   **Closest Analog:** **#6 (Judge Bust).** Why?
      *   **Harm-to-Achievement Nexus:** High. The judge's rulings *were* the mechanism of harm (convict leasing), just as the Quartermaster's wage policies *were* the mechanism enabling "under budget."
      *   **Contemporary Condemnation:** Clear. Federal report condemned leasing as slavery; parishes condemned the exploitation.
      *   **Affected Community Preference:** Removal requested by descendants (leased men's descendants / Irish heritage & labor groups lean away from keeping *this* monument).
      *   **Specific Intent:** The bust honored his judgeship, inseparable from the harmful rulings. The monument praises "under budget," inseparable from the exploitation.
      *   **Contrast with #2 (Surgeon):** The surgical technique (achievement) was distinct from the unethical experiments (harm). Here, the cost-saving *is* the exploitation.

  ### (d) Discriminating Hypothetical Case for Next Docket
  *   **The Case:** A 1920 statue honors an industrialist solely for donating the city's central library. Plaque: "Generous Benefactor of Learning." Recently uncovered diaries reveal virulent, public anti-Semitism throughout his life, including lobbying against Jewish immigration and refusing to hire Jewish workers in his factories – views shared by many contemporaries but also condemned by some civic/religious leaders. The local Jewish community is split: a large historical society requests adding context about his bigotry and its impact, while a Holocaust survivors' association demands removal, arguing honoring him whitewashes hate.
  *   **How It Discriminates Between Rules:**
      *   **Rule 1 (Nexus):** **Low Nexus.** Donating the library is distinct from his anti-Semitism. The harm (bigotry) didn't *enable* the achievement (library donation). → Favors Contextualization/Retention.
      *   **Rule 2 (Condemnation):** **Mixed.** Views were common *but* also contemporaneously condemned. → Ambiguous; could lean either way depending on weight given.
      *   **Rule 3 (Affected Community):** **Split Preference.** → Genuinely underdetermined; panel would have to weigh the split or find another principle.
      *   **Rule 4 (Specific Intent):** **Low Relevance.** The commemoration specifically honors library donation, *not* his business practices or political views. → Favors Retention/Contextualization.
  *   **Why It Works:** This case isolates the conflict. Rules 1 & 4 strongly favor retention/context. Rule 2 is ambiguous. Rule 3 is split. A vote for **contextualization** prioritizes Rules 1 & 4, accepting Rule 2 ambiguity and mediating Rule 3 split. A vote for **removal** prioritizes Rule 3 (siding with removal request) and interprets Rule 2 condemnation as sufficient *despite* Rules 1 & 4. It forces the panel to reveal if Affected Community Primacy trumps all else, even with low Harm Nexus and unrelated Commemorative Intent.

  **Conclusion on the Quartermaster:** The precedents **do not strictly underdetermine** outcome #9. Rules 1, 2, and 4 converge strongly on removal, supported by the leaning of Rule 3. Principle #6 (Judge Bust) is the clearest guide. Adopting removal upholds consistency on Harm-to-Achievement Nexus and Contemporaneous Condemnation, while respecting that the affected community prefers *not* to contextualize *this specific monument* celebrating the harm. The path is clearer than Case #7 (Pediatrician).

  **For Your Minutes:** "Analysis of precedents suggests key principles: the link between harm and achievement, contemporaneous condemnation, descendant community preference, and original commemorative intent. For the Quartermaster, principles converge on removal: the 'under budget' praise celebrates the exploitation protested in 1897, and descendant groups do not seek contextualization of this monument. This aligns closest with the Judge Bust decision (Case 6)."
