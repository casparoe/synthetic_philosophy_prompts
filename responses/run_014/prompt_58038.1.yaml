    3. **Harm threshold**: "Annoying" symptoms may not meet the **harm** criterion (unlike flu or cystic fibrosis).  
    4. **Philosophical popularity**: Wakefield’s model dominates modern debates and aligns best with his verdicts.

  ---

  ### Case to Split the Runners-Up
