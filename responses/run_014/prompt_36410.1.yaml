prompt: |-
  Got into an argument at a reading group about the argument from illusion. Someone kept saying "you never see the object itself, only what it looks like to you," and deployed it the standard way: a perfect hallucination of a tomato and a genuine sighting of a tomato can be indistinguishable from the inside, so what you're directly aware of must be the same thing in both cases -- some appearance or mental item -- and the physical tomato is at best an inference from that. I want to push back but I realize I can't say what the one-liner is actually claiming. Can you lay out the distinct precise theses hiding in "you only see what it looks like" -- from readings so weak they're trivially true, to strong ones about the objects of awareness, mental intermediaries, or internal representions -- and for each say whether it's plausible and whether it actually gets my friend to sense-data or representationalism? I know disjunctivists deny the common element, but I don't want a survey that just shrugs at the end: commit to which reading the argument genuinely needs, and tell me whether that reading is true. And is rejecting it (disjunctivism) really the only escape, or can you accept some weak reading and still refuse the conclusion?
