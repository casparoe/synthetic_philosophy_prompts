answer: |-
  Here's a breakdown of "you only see what it looks like" (WIL), ascending from weakest to strongest, analyzing plausibility and whether it supports the argument for sense-data or representationalism. I'll commit to what the argument *needs* and whether *that* is true.

  **Core Argument from Illusion (AFI):**
  1.  Perfect hallucination (H) and veridical perception (V) of the same thing (e.g., a tomato) can be subjectively indistinguishable.
  2.  Therefore, what you are *directly aware of* in both cases is the same kind of thing.
  3.  In H, what you are directly aware of is *not* a physical object (it doesn't exist).
  4.  Therefore, in H, you are directly aware of a non-physical sense-datum (or mental representation).
  5.  Therefore (from 2 & 4), in *both* H *and* V, you are directly aware of sense-data (or mental representations). The physical object is inferred or causally related, but not directly perceived.

  **The Spectrum of WIL Theses:**

  1.  **The Trivial (Attentional/Phenomenological) Reading:**
      *   **Thesis:** When we perceive, our conscious experience is dominated by the *appearance* of the object – its color, shape, texture-as-seen-now – rather than, say, abstract knowledge about its chemical composition or historical origin. We report *how it looks*.
      *   **Plausibility:** **True.** This is an uncontroversial fact about conscious experience. Our perceptual reports are naturally couched in terms of appearance ("It *looks* red," "It *appears* round").
      *   **Supports AFI?** **No.** This doesn't entail anything about the *object* or *structure* of awareness. It just describes the *content* of our attention or reports. Both direct realists and sense-data theorists can agree. It doesn't get you to step (2) or (4) of AFI.

  2.  **The Epistemic Reading:**
      *   **Thesis:** Our perceptual *judgments* or *beliefs* about the external object are *based on* or *justified by* how the object appears to us. Appearance is the evidence for judgment.
      *   **Plausibility:** **True (and Weak).** Our judgments about objects are indeed formed based on the sensory information we receive. We infer "that is a tomato" partly *because* it looks red and round.
      *   **Supports AFI?** **No.** This is about the *justification of beliefs*, not the *direct objects of awareness*. It doesn't say what we are *aware of*, only what we base our conclusions *on*. A direct realist can say we are directly aware of the tomato *through* its appearance, and *use* that appearance as evidence. Doesn't force step (2) or (4).

  3.  **The Representational/Content Reading:**
      *   **Thesis:** Perception fundamentally involves the mind/brain *representing* the world as being a certain way. "What it looks like" refers to the *representational content* of the perceptual state – e.g., the state represents *that there is a red, round thing there*.
      *   **Plausibility:** **Highly Plausible (Dominant View).** Cognitive science strongly supports the view that perception is a process constructing internal representations based on sensory input (even if these are not consciously accessed "items").
      *   **Supports AFI?** **Not Necessarily, and Not to Sense-Data.** This *can* be compatible with AFI, but crucially, it doesn't have to be. The key question is: What is the *vehicle* of this content, and what is the *relation* between awareness and the content?
          *   **Strong Representationalism (Compatible with Direct Realism):** Awareness is *transparent*. We are directly aware *of the external world* (the tomato) *by* having a perceptual state with tomato-representing content. The content is not an *object* of awareness, it's the *way* the world is presented. H and V share the same *type* of representational content (explaining indistinguishability), but in V, this content is caused by and matches the real tomato, while in H, it's caused by something else (brain malfunction). Awareness is *of the external object via* the content. This **rejects** step (2) and (4) of AFI: The direct object *is* the tomato (in V), mediated *by* representational content, not *of* the content.
          *   **Representationalist Sense-Data:** If one interprets the representational content *itself* (or a mental image realizing it) as the *object* of direct awareness (a "sense-datum" by another name), then it aligns with AFI. But this interpretation is **not** forced by the representational thesis itself. It's an *additional* claim.

  4.  **The Phenomenal Object (Sense-Datum) Reading:**
      *   **Thesis:** What you are *directly* and *immediately* aware of in any perceptual experience is *always* a mind-dependent entity – a sense-datum, a phenomenal object, a subjective appearance. This entity possesses the phenomenal properties you experience (redness, roundness). Physical objects are only *indirectly* perceived via these sense-data.
      *   **Plausibility:** **Controversial & Problematic.** This is the core sense-data theory.
      *   **Supports AFI?** **Yes, it *is* the conclusion of AFI (steps 4 & 5).** This is precisely what the argument aims to establish.
      *   **Problems:** Faces significant challenges:
          *   **Inference Problem:** How do we infer the *existence* of physical objects from purely mental data? Why posit them at all?
          *   **Privacy Problem:** How do multiple people perceive the *same* object if everyone is locked into their private sense-data?
          *   **Causal Problem:** How do physical objects cause sense-data without physical contact?
          *   **Parsimony/Explanatory Power:** Modern cognitive science explains perception and illusion without needing *objects* of awareness distinct from brain states and their representational properties. Direct realism or strong representationalism seem more parsimonious.

  **What the Argument from Illusion Genuinely Needs:**

  The AFI **absolutely needs** the **Phenomenal Object Thesis (Sense-Datum Reading)** to reach its conclusion (that we never directly perceive physical objects). Specifically:
  1.  **It needs Step (2):** That indistinguishability entails a *common object of direct awareness*. This *requires* that "what you are directly aware of" is a *particular thing* (a sense-datum) that can be identical in H and V.
  2.  **It needs Step (4):** That this common object in H *is* a sense-datum.

  **Is the Needed Reading True? I commit: NO.**

  The Phenomenal Object Thesis is implausible for the reasons listed above (inference, privacy, causal problems, parsimony). It posits an unnecessary ontological layer (mind-objects) that fails to solve the problems it sets out to solve and creates new ones. The subjective indistinguishability of H and V does **not** force us to accept that there is an identical *object* of awareness in both cases. Alternative explanations are superior.

  **Can You Escape Without Disjunctivism? YES.**

  You **can** accept weaker readings of WIL (especially the **Representational/Content Reading**) and **still decisively reject the AFI conclusion** (sense-data). Here's how:

  1.  **Accept Representationalism (Strong/Externalist Version):**
      *   Agree perception involves representational content.
      *   Agree H and V can share the same *type* of representational content (explaining indistinguishability).
      *   **Deny** that the content (or any mental item) is the *object* of awareness. Awareness is *of the external object* via the content.
      *   **Deny** the Phenomenal Object Thesis. In V, you directly see the tomato *by* having a tomato-representing state. In H, you are not directly aware *of* anything real; you are having a non-veridical tomato-representing state. The *relational structure* is different (awareness-of-tomato vs. hallucinatory-state-with-tomato-content). This rejects Step (2) of AFI – the *relata* differ fundamentally, even if the representational content type is shared. This is **compatible with the weak WIL readings (1, 2, 3)**.

  2.  **Challenge the Indistinguishability Premise (Less Common):** Argue that perfect subjective indistinguishability is impossible or incoherent. However, this is a tough sell empirically; we do have hallucinations indistinguishable from perception until proven otherwise. The representationalist escape above is more robust.

  **Conclusion:**

  *   Your friend's one-liner ("you never see the object itself, only what it looks like") is ambiguous.
  *   Its **trivial readings (1 & 2)** are true but irrelevant to AFI.
  *   The **representational reading (3)** is highly plausible but **does not entail** sense-data; it can be (and commonly is) combined with direct realism.
  *   The AFI **needs the strong sense-datum reading (4)** to work.
  *   **That strong reading is false.** It's an unnecessary and problematic ontology.
  *   **You can reject AFI without becoming a disjunctivist** by adopting a **strong representationalist** view (or similar direct realist view) that accepts the weaker WIL readings, explains indistinguishability via shared *content types*, but denies that awareness has a *common object* (sense-datum) in H and V. Your awareness in V is fundamentally *of the tomato*; in H, it's *of nothing real*, you merely *seem* to see a tomato.

  **Your Best Pushback:** "I agree we perceive *how* things look, and that appearances are crucial to forming judgments and are represented in our minds. But none of that forces us to say we see mental pictures *instead of* objects. The best explanation is that in the good case, I directly see the tomato *by* having my visual system represent it accurately. The hallucination is just a malfunctioning state *with the same type of content*, but no object. The fact that they feel the same doesn't mean there's an identical *thing* I'm staring at in my mind in both cases – that's adding an unnecessary layer that creates more problems than it solves."

  This leverages the plausible weaker readings while rejecting the strong, needed thesis and offering a scientifically grounded alternative.
