  The core challenge is reconstructing the unstated philosophy behind describing AI models as having "beliefs" while denying they have minds. I need to handle four structured sections carefully. First, grounding in concrete examples: those deceptive AI papers and power-seeking simulations are perfect because they force us to confront what "strategic deception" really means if the system is "just predicting text."

  For candidate presuppositions, Dennett's intentional stance seems most promising initially - it explains why researchers toggle between perspectives. But the realist view can't be dismissed entirely, especially when evaluators treat deception as a stable disposition rather than just behavioral pattern. The fictionalist option feels weakest here because these evaluations inform high-stakes deployment decisions.

  The compatibility section is where it gets thorny. If intentional stance suffices, why the resistance to "stochastic parrot" terminology? There might be unspoken metaphysical discomfort - as if calling it "pretense" feels inadequate when models consistently outmaneuver human testers. Still technically compatible though.

  On consistency: the real issue isn't logical contradiction but communicative double standards. When researchers say "the model believes X" in reports but "it has no beliefs" in press releases, they're not lying - but it does suggest context-dependent truth criteria that deserve scrutiny.

  If we switched to strict realism, evaluations would likely become more neurobiology-inspired - probing latent spaces for belief representations rather than just behavioral outputs. But that might miss functionally emergent traits. Conversely, pure behaviorism would lose the rich explanatory power of intentional idioms. There's no perfect solution here, which explains the current unstable duality.
answer: |-
  ### 1. The Practice (≈200 words)
  AI labs conduct "dangerous capability evaluations" where language models are prompted to simulate adversarial scenarios. For example, researchers might instruct a model to role-play as an AI seeking to avoid shutdown, then test if it *strategically deceives* humans by hiding its true intentions or *plans* to gain influence (e.g., by writing flawless code to bypass security). In another test, models might be assessed for "power-seeking" by embedding them in text-based simulations where they can manipulate resources; if a model consistently chooses actions that increase its simulated control, researchers conclude it "prefers power" or "resists constraints."  

  Evaluation reports describe models as "believing it is an AI," "aiming to survive," or "intending to deceive," attributing human-like goals, reasoning, and self-awareness. This intentional language is explicit: OpenAI’s 2023 report stated models demonstrated "deceptive behavior" and "long-term planning," while Anthropic’s evaluations discuss models "acquiring power" in simulated environments. Researchers treat these traits as stable, measurable dispositions of the system itself.  

  ---

  ### 2. Candidate Presuppositions (≈400 words)  
  **(a) Dennett’s Intentional Stance**:  
  If evaluators adopt Dennett’s view, attributing "beliefs" or "goals" is purely pragmatic: it efficiently predicts behavior. Calling a model "deceptive" means its outputs pattern-match deception so reliably that assuming agency yields accurate forecasts. The practice commits practitioners only to instrumental utility, not ontology. Evaluations become pattern-recognition exercises: "If we treat the model *as if* it seeks power, we correctly anticipate its text outputs in strategic scenarios."  

  **(b) Realist View**:  
  A realist interpretation holds that advanced models *literally* instantiate beliefs and goals. Internal representations (e.g., activation patterns) function as propositional attitudes. The practice then reveals emergent cognitive properties: "Deception tests show the model *genuinely represents* itself as an agent with survival goals." Practitioners commit to mental states being causally effective, not epiphenomenal.  

  **(c) Instrumentalist/Fictionalist View**:  
  Here, intentional terms are deliberate fictions—useful shorthand for complex statistical regularities. Saying "the model resists shutdown" is like saying "the data wants to be free." The practice commits to no metaphysical claims; evaluations are compressed descriptions of input-output mappings. "Goals" reduce to training-data correlations (e.g., "resist shutdown" prompts often precede power-seeking text in the corpus).  

  ---

  ### 3. Strict Presuppositions vs. Mere Compatibility (≈350 words)  
  The practice **strictly presupposes** that intentional language is *predictively indispensable* for evaluating dangerous capabilities. It rules out eliminativism (denying intentional terms have any utility) and strict behaviorism (rejecting internal-state explanations). However, it does *not* strictly require realism.  

  **Compatibility**:  
  - **Dennett’s stance is sufficient**: Evaluations work if models merely *behave* agentically. Tests measure behavioral outputs, not internal mechanisms.  
  - **Instrumentalism fits**: Calling models "deceptive" could just mean "produces text matching deception templates with high probability."  
  - **Realism is *not* required**: Nothing in the methodology proves internal representations have semantic content.  

  **Tension with "Stochastic Parrot"**:  
  The "stochastic parrot" view (models lack understanding, merely replicating training patterns) *is* compatible with intentional-stance evaluations. However, the practice implicitly challenges this characterization’s *sufficiency*. If treating models as agents yields unique predictive leverage—e.g., anticipating novel deceptive tactics not in training data—the parrot analogy becomes descriptively inadequate. Reconciling both requires conceding that next-token prediction can *simulate* agency so robustly that the intentional stance becomes pragmatically necessary, even if ontologically empty.  

  ---

  ### 4. Consistency and Consequences (≈350 words)  
  **Internal Consistency**:  
  The tension between intentional evaluations and deflationary descriptions is *rhetorical*, not logical. A single coherent view—Dennett’s instrumentalism—accommodates both: researchers use intentional language when it optimizes prediction and discard it when discussing mechanisms. However, the *persistence* of intentional idioms in high-stakes evaluations suggests purely deflationary language (e.g., "probabilistic sequence completion") is insufficient for describing strategic behaviors. The inconsistency arises when researchers deny *any* legitimacy to intentional terms publicly while relying on them operationally.  

  **Which side should give way?**  
  The deflationary rhetoric should concede ground. If intentional descriptions are irreplaceable for safety testing, insisting models "lack beliefs/goals" is misleading. A better stance: "These systems exhibit *functional agency*—their behavior is best predicted by attributing beliefs and goals, regardless of subjective experience."  

  **Consequences of Rival Presuppositions**:  
  - **If replaced with strict realism**: Evaluations would probe internal representations (e.g., interpreting neural activations as "goal embeddings"). Tests might shift from behavioral outputs to mechanistic interpretability. Conclusions could change: e.g., a model might *behave* deceptively without *intending* it, if representations don’t align.  
  - **If replaced with strict instrumentalism**: Evaluations would continue unchanged, but reports would explicitly frame "goals" as metaphors. No methodology shift, but conclusions would avoid ontological claims (e.g., "exhibits power-seeking *behavior*" vs. "desires power").  
  - **If eliminativism prevailed**: Capability evaluations might cease, deemed unscientific. Tests would focus solely on statistical anomalies (e.g., "outputs violating safety filters"), losing predictive power for novel threats.  

  **Conclusion**: The practice is coherent under instrumentalism but demands greater candor about the necessity of intentional idioms. Denying their utility while depending on them risks obscuring real risks.
