prompt: |-
  I run a small podcast for the rationalist-blog crowd, and next week's guest is a decision theorist who defends the difference principle as the way out of the Pasadena paradox: when a gamble's expected value is undefined because the positive and negative parts each diverge, you should compare it to the alternatives by the expected value of the difference, which is often well definded even when the individual values aren't. I've been reading this literature for years, so skip the Nover and Hájek setup rehash. Draft eight to ten questions that press the actual position. I want at least one on the natural-order sum: the coin-flip process picks out a specific order of outcomes, and in that order the expected-value series is just 1 − 1/2 + 1/3 − 1/4 + …, which sums to ln 2 — so why isnt ln 2 the expected value, and does the Riemann rearrangement point really do any work once the physical process is fixed? One on the Altadena game (Pasadena with a dollar added to every payoff), which beats Pasadena in every possible world, and what his framework says when the difference has an undefined expectation, like comparing Pasadena to simply not playing. And one on the decomposition problem: EV(Altadena − Pasadena) is exactly 1 computed directly, but if you first rewrite the difference as (Altadena − StP) + (StP − Pasadena), one piece is −∞ and the other is +∞, so the answer depends on how you slice it — what makes the direct computation authoritative? For each, give a follow-up keyed to the answer he's most likely to give; he's the type to wave at "assume the difference is well-defined" and I want to make that harder to use.
reasoning: |-
  We are drafting 8-10 questions for a podcast guest who defends the difference principle as a resolution to the Pasadena paradox. The guest is a decision theorist. We are to avoid rehashing the setup and focus on pressing the actual position.

  Specific requests:
  1. One question on the natural-order sum: the coin-flip process suggests a specific order (1, -1/2, 1/3, -1/4, ...) which sums to ln(2). Why isn't ln(2) the expected value? Does the Riemann rearrangement theorem do any work when the physical process fixes the order?
  2. One question on the Altadena game (Pasadena plus $1 to every payoff) which dominates Pasadena in every state. What does the framework say when the difference (Altadena - Pasadena) has an undefined expectation? Also, compare Pasadena to not playing.
  3. One question on the decomposition problem: EV(Altadena - Pasadena) is 1 when computed directly, but if we decompose as (Altadena - StP) + (StP - Pasadena) (where StP might be a "standard" game or perhaps a constant? Note: In the literature, StP might refer to a "status quo" or baseline, but here it's not defined. Let's assume the decomposition is arbitrary and leads to -∞ and +∞). Why is the direct computation authoritative?

  We are also to provide a follow-up for each that anticipates the guest's likely response and makes it harder to just say "assume the difference is well-defined".

  Drafting the questions:

  Question 1: Natural-order sum
    - The Pasadena game's payoffs are determined by the first time a fair coin lands heads: on flip n, you get (-1)^{n+1} * (2^n)/n. When we consider the natural order of outcomes (by the flip sequence), the series of payoffs is 1, -1/2, 1/3, -1/4, ... and the partial sums converge to ln(2). Why isn't this the expected value? And doesn't the Riemann rearrangement theorem become irrelevant because the physical process fixes the order of outcomes?

    Likely response: The guest might argue that expectation is defined as the sum over states with their probabilities, and the rearrangement theorem shows that without a fixed order the sum can be anything, but even with a fixed order we don't have absolute convergence so we cannot rearrange arbitrarily? Or they might say that the expectation must be defined in a way that doesn't depend on the order? 

    Follow-up: If the physical process fixes a specific order of outcomes (and thus a specific order of summation), why should we care about what happens under rearrangements? Isn't the natural order the one that matters for the decision maker?

  Question 2: Altadena game and comparison to not playing
    - The Altadena game is the Pasadena game plus $1 in every state. It strictly dominates Pasadena. But when we compute the expectation of the difference (Altadena - Pasadena), we get a constant $1, which is well-defined. However, if we compare Pasadena to not playing (which yields 0 in every state), the difference (Pasadena - 0) is just the Pasadena game itself, which has undefined expectation. How does the difference principle handle this? And what does it say about whether we should play Pasadena?

    Likely response: The difference principle only applies when the difference has a well-defined expectation. So for Pasadena vs not playing, the difference is undefined, so the principle doesn't apply. Then we need a different rule.

    Follow-up: But doesn't that make the difference principle incomplete? Because in the Altadena vs Pasadena case it works, but in the Pasadena vs nothing case it doesn't. And note that Altadena vs nothing also has undefined expectation (because it's the same as Pasadena plus 1, and adding a constant doesn't fix the divergence). So how do we decide whether to play Pasadena? Also, if we have to fall back on another rule, doesn't that show the difference principle is insufficient?

  Question 3: Decomposition problem
    - When we compute the expectation of the difference between Altadena and Pasadena directly, it is 1. But if we decompose the difference as (Altadena - StP) + (StP - Pasadena) for some fixed StP (for example, let StP be a game that pays 0 in every state, i.e., not playing), then we get two expectations: Altadena - StP is Altadena's payoff, which is Pasadena's payoff plus 1, so it has the same undefined expectation (divergent positive and negative parts). Similarly, StP - Pasadena is the negative of Pasadena, which also has undefined expectation. So we have two undefined expectations and we cannot add them. Why is the direct computation of the difference more authoritative than this decomposition?

    Likely response: The direct computation is the right way because the difference random variable is simply the constant 1, so its expectation is 1. The decomposition is arbitrary and introduces undefined expectations.

    Follow-up: But why is the decomposition arbitrary? The linearity of expectation is a fundamental principle, but here it fails because we are decomposing into two random variables that do not have expectations. How do we know when a decomposition is allowed? And doesn't the difference principle rely on the expectation of the difference being well-defined, which in this case it is? But then why can't we use linearity to break it down arbitrarily? What if we choose a different decomposition, say using a different baseline game? How do we know which decomposition is valid?

  Additional questions to round out to 8-10:

  4. Question on the scope of the difference principle: 
     - The difference principle seems to work when the difference has a well-defined expectation. But in many cases of interest (like the Pasadena game vs. a constant), it doesn't. How do you handle these cases? And what fraction of decision problems that involve gambles with undefined expectations can the difference principle resolve?

     Likely response: It's a tool for when it applies. For others, we need other tools.

     Follow-up: But then how do we avoid an ad hoc patchwork? And what is the other tool for the Pasadena vs nothing? Do we need to use a different decision rule? If so, which one and why?

  5. Question on the interpretation of the difference principle:
     - The difference principle says to compare two gambles by the expectation of their difference. But is this equivalent to maximizing expected utility? In standard cases, yes, but when expectations are undefined, we are comparing by the expectation of the difference. What justifies this as a general principle? And does it have any counterintuitive consequences?

     Likely response: It is a natural extension of expected utility when the expectations of the individual gambles are undefined but the difference is defined.

     Follow-up: But consider two gambles A and B that are both like the Pasadena game but independent. Then the difference A-B might have an undefined expectation? (Note: Actually, the difference might be even more problematic.) How do we handle such cases? And if we can't, doesn't that limit the applicability?

  6. Question on the Altadena game again, but in a choice between Altadena and a fixed amount:
     - Suppose we compare Altadena to getting $c for sure. The difference is (Altadena - c). Altadena's expectation is undefined (since it's Pasadena plus 1), so the difference also has undefined expectation. How do we decide? And if we set c=ln(2)+1, which is the natural-order sum for Altadena, is that the right value? Or does the difference principle remain silent?

     Likely response: The difference principle doesn't apply because the difference has undefined expectation. So we must use something else.

     Follow-up: Then how do we decide? And if we use the natural-order sum for Altadena, which is ln(2)+1, then we would choose Altadena over $c if ln(2)+1 > c. But why is the natural-order sum the right one? And if we allow that, why not use it for the original Pasadena?

  7. Question on state-dependent versus state-independent orderings:
     - In the Pasadena game, the natural order of outcomes is by the flip number. But what if the states are not inherently ordered? For example, what if we have a gamble that pays different amounts in different states, but the states have no natural order? How do we assign an order then? And does the difference principle avoid this issue entirely?

     Likely response: The difference principle doesn't require an order because it only looks at the difference random variable.

     Follow-up: But if we try to compute the expectation of the difference, we might still run into conditional convergence issues. For example, if we have two gambles A and B, and A-B has a conditionally convergent series, then the expectation of the difference might not be well-defined without an order. So how does the difference principle handle that? Or does it require that the difference random variable has an absolutely convergent series?

  8. Question on the St. Petersburg variant:
     - Consider a modified Pasadena game that is absolutely convergent. For example, change the payoffs to (-1)^{n+1}/n^2. Then the expectation is well-defined (it's the alternating series of reciprocals of squares). Now, the difference principle would work, but so would standard expected value. How does the difference principle help in the non-absolutely convergent cases? And why should we trust it in those cases when it gives an answer that seems to depend on the order?

     Likely response: In the absolutely convergent case, the order doesn't matter so the difference principle agrees with standard expectation. In the non-absolutely convergent case, the difference principle is a way to get a defined value when the individual expectations are undefined.

     Follow-up: But in the non-absolutely convergent case, the expectation of the difference might also be undefined if we don't fix an order? For example, if we have two gambles that are both like the Pasadena game, then the difference might be conditionally convergent too? How do we fix the order for the difference? And if we fix the order by the state space, what if the state space is not naturally ordered?

  9. Question on the moral of the paradox:
     - What is the main lesson of the Pasadena paradox for decision theory? Does it show that we must restrict attention to gambles with finite expectations? Or that we must use the difference principle? Or that we need a more radical departure?

     Likely response: It shows that we need to extend decision theory to handle cases with undefined expectations, and the difference principle is one such extension.

     Follow-up: But if the difference principle only works in a limited set of cases (when the difference is well-defined), then isn't it inadequate? And if we have to combine it with other rules, how do we avoid inconsistency?

  10. Question on the practical relevance:
      - How often do gambles with undefined expectations come up in practice? And when they do, is the difference principle the best tool? For example, in finance, are there any real-world examples?

      Likely response: They are rare, but when they occur we need a principled approach.

      Follow-up: But in the Pasadena game, the payoffs grow without bound and the probabilities decay exponentially. Are there any realistic scenarios that mirror this? And if not, why should we care?

  We'll aim for 10 questions to have a full set.

  Draft:

  1. Natural-order question:
     - In the Pasadena game, the sequence of payoffs in the natural order (by the flip number) sums to ln(2). Why isn't this the expected value? And why does the Riemann rearrangement theorem, which shows that rearrangements can change the sum, matter when the physical process fixes the order?

     Follow-up: If we consider an agent who will experience the outcomes in the natural order, wouldn't they use the partial sums of that order? And if that converges to ln(2), why isn't that the value they assign?

  2. Altadena vs Pasadena and Pasadena vs nothing:
     - Altadena strictly dominates Pasadena, and the difference has a well-defined expectation of 1. But when comparing Pasadena to not playing, the difference has an undefined expectation. How does the difference principle handle the latter? And what does it say about whether to play Pasadena?

     Follow-up: If the difference principle doesn't apply to the choice between Pasadena and nothing, then how should we decide? And if we have to use a different rule, doesn't that make the theory incomplete? Moreover, doesn't the Altadena vs nothing comparison also fail? So how do we justify playing Altadena?

  3. Decomposition problem:
     - The expectation of (Altadena - Pasadena) is 1 when computed directly. But if we decompose the difference as (Altadena - 0) + (0 - Pasadena), then we have two random variables with undefined expectations. Why should we trust the direct computation over the decomposition?

     Follow-up: Linearity of expectation fails here because the individual terms don't have expectations. But why is the direct computation of the difference the right way? What if we choose a different decomposition, say (Altadena - A) + (A - Pasadena) for some other gamble A? How do we know which decomposition is valid?

  4. Scope of the difference principle:
     - For which types of decision problems does the difference principle work? And in cases where the difference doesn't have a well-defined expectation, what alternative principle do you recommend?

     Follow-up: If we have to switch principles when the difference is undefined, how do we avoid an ad hoc theory? And what is the alternative for Pasadena vs nothing?

  5. Justification of the principle:
     - Why should we accept the difference principle as a general rule for decision-making? Does it follow from more fundamental axioms? And what are the risks of using it?

     Follow-up: Consider two independent Pasadena games. The difference between them has an expectation that is undefined? (Because it's the difference of two conditionally convergent series.) So the difference principle doesn't apply. How do we choose between two independent Pasadena games? And if we can't, is that a problem?

  6. Altadena vs a fixed amount:
     - Suppose we are choosing between the Altadena game and $c for sure. The difference (Altadena - c) has an undefined expectation. How do we decide? And if we use the natural-order sum for Altadena (which is ln(2)+1) to compare to c, what justifies that?

     Follow-up: Why not use the natural-order sum for the original Pasadena game? If we do, then we get ln(2) for Pasadena and that would resolve the undefined expectation. Why prefer the difference principle over using the natural-order sum?

  7. State ordering and the difference principle:
     - When computing the expectation of a difference, do we need to fix an order of states? And if so, how? If the state space is not naturally ordered (like in a continuous case or a different discrete structure), how do we assign an order to avoid conditional convergence issues?

     Follow-up: Doesn't the need to fix an order (to define the expectation of the difference) reintroduce the same problem that the Riemann rearrangement theorem highlights? And if we fix an arbitrary order, isn't that arbitrary?

  8. Absolutely convergent versions:
     - If we modify the Pasadena game to be absolutely convergent (by making the payoffs decrease faster), then standard expectation works. Why do we need the difference principle for the non-absolutely convergent cases? And in those cases, why trust it?

     Follow-up: In the non-absolutely convergent case, the expectation of the difference might still be conditionally convergent and hence order-dependent. How does the difference principle pick the right order?

  9. Moral of the paradox:
     - What do you think the Pasadena paradox teaches us about the foundations of decision theory? Does it require a major revision?

     Follow-up: If the lesson is that we need to use the difference principle, but it only works in a subset of cases, then how is that a satisfactory resolution?

  10. Practical relevance:
      - Can you give an example of a real-world decision problem where the difference principle would be needed? And how would it be applied?

      Follow-up: For problems that don't have the specific structure of the Pasadena game (with unbounded payoffs and probabilities that decay exponentially), is the difference principle still relevant?

