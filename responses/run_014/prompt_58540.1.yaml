answer: |-
  Here are five FAQ entries for the Acausal Trade Dating App, presented deadpan:  

  1. **Q: Why is messaging disabled?**  
  A: Causal separation prohibits real-time communication; instead, simulate your match’s decision algorithm to infer their actions. Messaging would violate light-cone constraints and introduce causal paradoxes.  

  2. **Q: Why demand full source-code access?**  
  A: Imperfect simulation risks mutual defection; source-code transparency ensures identical priors for predicting trade outcomes. Obfuscated code voids all warranties and implies low cooperativity.  

  3. **Q: How do we agree on trades without negotiating?**  
  A: The app enforces Schelling points (e.g., “scratch-my-back”) as focal defaults. Deviations require simulating your match’s likely deviation, which often collapses into non-trade.  

  4. **Q: What if we predict mutual cooperation but get defected on?**  
  A: This indicates flawed simulation depth. Appeal denied — your model’s inaccuracy voids recourse. Regular calibration against known defect-bots is recommended.  

  5. **Q: Can I trade with multiple matches concurrently?**  
  A: Only if your source code can handle recursive simulation stacks without resource conflicts. Most users crash; start with one trade to avoid thermodynamic regret.
