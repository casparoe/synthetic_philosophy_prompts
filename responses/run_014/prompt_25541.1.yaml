prompt: |-
  Argue that teleosemantic theories of mental content face a serious and underappreciated difficulty: the problem of functional shift. Many cognitive mechanisms have evolutionary histories in which they were selected for one function during one period and a different function during another, with no single function dominating the cumulative selection regime. When a teleosemanticist attempts to fix the content of the representations such a mechanism produces by appealing to its proper function, the notion of a proper function becomes indeterminate — there is no fact of the matter about which of the several historical functions is the proper one. Argue that this problem cannot be resolved by privileging the most recent selection episode (since recency has no principled connection to content determination), by individuating the mechanism more finely (since this merely relocates the problem without resolving the underlying indeterminacy), or by appealing to the mechanism's current contribution to fitness (since this abandons the historical character of teleosemantics and collapses it into a form of causal or informational semantics). Conclude by assessing whether the problem of functional shift reveals a deeper tension in the teleosemantic project: the attempt to extract normative facts about representational content from purely historical facts about selection.
reasoning: |-
  Okay, the user wants me to argue that teleosemantic theories face a serious problem called functional shift. Let me start by recalling what teleosemantics is. It's a theory that explains mental content based on evolutionary functions—what a cognitive mechanism was selected for. The problem arises when a mechanism has been selected for different functions at different times without one dominating.

  First, I need to explain functional shift clearly. Maybe use an example, like Pavlov's dogs. Originally, salivation was selected for digestion, but later, it became a response to a bell. If we apply teleosemantics here, what's the proper function? Digestion or predicting food? The indeterminacy is the core issue.

  Next, the user mentioned three failed solutions. Let me tackle each. Recency: why would the latest function be the "proper" one? Evolution doesn't prioritize recent changes. Plus, content should be stable, but recency could make it change abruptly. That doesn't work.

  Individuating mechanisms more finely. Say we split the mechanism into stages. But then each stage might still have multiple functions. For example, if we separate the Pavlovian response into a new module, what if that module itself evolved from something else? The problem just moves to a different level.

  Appealing to current fitness. But teleosemantics relies on history. If we switch to current effects, it's no longer teleosemantics; it becomes something like causal theory. That abandons the historical essence, which defeats the purpose.

  Now, the deeper tension: deriving normativity from history. Evolution is descriptive—what happened. But content has normativity; representations can be right or wrong. If the historical function is indeterminate, how do we ground normativity? Maybe teleosemantics can't bridge the is-ought gap here. 

  I should check if the user is familiar with specific teleosemanticists like Millikan or Neander. But since they didn't mention any, keeping it general is safer. Also, assess if functional shift is underappreciated. Maybe point out that it's not just a technical issue but challenges the foundation of teleosemantics.

  Conclusion: Functional shift shows that history alone can't fix content when functions shift. The normative aspect of representation might need more than historical facts. Teleosemantics might need to incorporate something else, but that's beyond the scope. The user likely wants a strong argument that this is a fundamental flaw, so emphasize the indeterminacy and the failed solutions.

  Make sure the argument flows logically: explain the problem, dissect the failed solutions, then the deeper issue. Use clear examples. Avoid jargon where possible, but some terms like "proper function" are necessary. Highlight that each solution either doesn't work or changes the theory fundamentally. Conclude that this undermines teleosemantics' core project.
answer: |-
  Here's an argument that functional shift poses a serious and underappreciated difficulty for teleosemantics, undermining its core project of grounding representational content in evolutionary history:

  1.  **The Core Problem: Indeterminacy via Functional Shift:**
      *   Teleosemantics (e.g., Millikan, Neander) defines the "proper function" of a trait (including cognitive mechanisms producing representations) as *the function for which it was historically selected by natural selection*. This proper function is then used to determine the "correct" conditions for the representations it produces (e.g., what a frog's "fly detector" neurons represent, or what a belief is *supposed* to correspond to).
      *   However, many cognitive mechanisms exhibit **functional shift**: their selection history involves distinct periods where they were selected *for different functions*. For instance:
          *   A mechanism initially selected for detecting predators might later be exapted and selected for detecting prey.
          *   A mechanism selected for regulating social hierarchy might later be co-opted and selected for facilitating complex cooperative planning.
          *   A mechanism selected for spatial navigation might later be co-opted and selected for abstract reasoning.
      *   Crucially, in these cases, *no single function dominates the cumulative selection history*. Selection pressures acted significantly for Function A during Epoch 1, and then significantly for Function B during Epoch 2, without Function A being entirely eliminated or Function B being a mere byproduct.
      *   **Result:** When the teleosemanticist asks, "What is the *proper* function of this mechanism?" to fix representational content, there is **no determinate answer**. There are multiple, equally historically significant functions (A and B). Appealing to "the" proper function becomes arbitrary. Consequently, the content of the representations produced *now* is indeterminate – is it fixed by Function A, Function B, or something else?

  2.  **Why Proposed Solutions Fail:**
      *   **Privileging Recency (The "Latest Function" Solution):**
          *   *Proposal:* Resolve indeterminacy by claiming the most recent selection episode defines the current proper function/content.
          *   **Objection:** Recency lacks any principled connection to content determination. Why should the *last* historical function override equally significant *earlier* ones in defining the mechanism's normative purpose? Evolution doesn't "know" it's the latest episode; cumulative selection shaped the mechanism across *all* episodes. Privileging recency is an arbitrary stipulation, not grounded in the historical facts teleosemantics relies on. Furthermore, if the mechanism shifts function again, content would flip abruptly, which seems implausible for stable representational capacities.
      *   **Finer Individuation ("It's a Different Mechanism Now"):**
          *   *Proposal:* Argue that after a functional shift, we are dealing with a *different* cognitive mechanism, each with its own unambiguous selection history.
          *   **Objection:** This merely relocates the problem without solving it. How do we individuate mechanisms finely enough? The shift is often gradual and involves the *same* underlying physical/neural structures performing new roles. If we individuate based on current causal role, we abandon history. If we try to pinpoint the exact moment the "new mechanism" emerged based on selection, we confront the same indeterminacy: Was it selected *for* B when it still performed A? When B provided *some* advantage? When B became the *primary* advantage? The boundaries are fuzzy, and the underlying problem of multiple significant functions within the trait's lineage persists. It pushes the indeterminacy down to the level of mechanism individuation.
      *   **Appealing to Current Contribution to Fitness ("What It Does Now"):**
          *   *Proposal:* Define the proper function/content based on what the mechanism *currently* contributes to fitness.
          *   **Objection:** This completely **abandons the historical essence of teleosemantics**. Teleosemantics explicitly defines proper function *historically* to ground normativity (what *should* happen, based on past success) and error (failure to perform the historically selected function). Using current fitness contributions collapses teleosemantics into a form of **causal role or informational semantics**, where content is determined by current causal covariation or systemic role. While such theories exist, they lack the historical grounding for normativity that defines the teleosemantic project. If current effects define content, past selection history becomes irrelevant – precisely what teleosemantics set out to avoid.

  3.  **The Deeper Tension Exposed:**
      The problem of functional shift starkly reveals a fundamental tension at the heart of the teleosemantic project: **the attempt to derive robust normative facts (about what a representation *ought* to represent, what counts as an error) solely from descriptive historical facts (about past selection events).**
      *   **The "Is-Ought" Gap in Teleosemantics:** Evolution describes what *was* selected in specific past environments. Normativity involves prescriptions about what *should* happen now. Functional shift demonstrates that history often provides *multiple, conflicting* "was" stories with equal historical validity. Teleosemantics lacks a principled, non-arbitrary way to select *one* specific historical function as the sole source of current normative force when history presents pluralism.
      *   **Indeterminacy vs. Normativity:** Representational content requires determinacy – a belief is *about* something specific and can be *mistaken* in specific ways. Functional shift injects deep indeterminacy into the very historical facts meant to provide this determinacy. If the historical "proper function" is indeterminate, then the derived representational content and its associated norms (correctness/incorrectness) are necessarily indeterminate.
      *   **The Challenge of Cumulative Change:** Evolution is a process of cumulative change. Functional shift is likely common, especially for complex cognitive mechanisms capable of exaptation. Teleosemantics struggles to handle this dynamism. It implicitly assumes a more static view where traits have a single, dominant historical function that cleanly defines their current normative status. Functional shift shows this assumption is often false.

  **Conclusion:**

  The problem of functional shift is not merely a technical glitch but a profound challenge to teleosemantics. It demonstrates that the historical facts of natural selection, particularly for complex, adaptable cognitive systems, are often too pluralistic and indeterminate to single out a unique "proper function." Proposed solutions either introduce arbitrariness (recency), relocate the problem (finer individuation), or abandon the core historical commitment of the theory (current fitness). Ultimately, functional shift exposes a deep tension: the historical facts of evolution alone may be insufficient to ground the robust, determinate normativity required for mental representation. While teleosemantics offers valuable insights into the origins of function, functional shift suggests it cannot provide a complete or fully determinate account of mental content solely based on selection history. The normative "ought" of representation cannot be straightforwardly extracted from the descriptive "was" of evolution when the "was" is multifaceted.
