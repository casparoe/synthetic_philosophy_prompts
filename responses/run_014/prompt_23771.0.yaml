prompt: |-
  I'm organizing a panel for our philosophy of AI reading group next month and we've got a guest who's been defending representational realism about neural networks — the view that interpretability findings like sparse autoencoder features, steering vectors, and linear probes are genuine evidence that models contain representations, not just that we found a convenient decomposition of their activations. I want to push back where the literature actually presses, so can you draft eight to ten interview questions that go beyond having him restate the view? I'd like at least one question each on the basis-change objection (any linear re-decomposition of activation space is a valid description, so what makes the discovered features the real ones), on how the sparsity prior in the SAE is supposed to privilege the monosemantic features over the superposed ones, and on what it would take for causal intervention on a feature to count as evidence of representational content rather than just a causal role -- and for each, a follow-up keyed to the answer he's most likely to give. If you can, end with a question about what evidence would actually count against the view, since he always waives that away.
