answer: |-
  Here’s a set of 10 targeted interview questions designed to probe the philosophical and empirical tensions in representational realism about neural networks, structured around your requested foci with follow-ups anticipating common replies:

  ### 1. Basis-Change Objection  
  **Q:** The basis-change objection holds that any linear decomposition of activation space (e.g., random rotations) is mathematically equivalent to features found by SAEs. Why should we privilege *this particular basis* as revealing "real" representations rather than treating it as one among many observer-relative descriptions?  

  *Likely Reply Appeal:* Simplicity, causal efficacy, or alignment with model behavior.  
  **Follow-up:** If we accept that simplicity/causality privileges a basis, does this imply representations are *defined* by human interpretability tools (e.g., sparsity) rather than being intrinsic to the network? Doesn’t this reintroduce observer-relativity?  

  ---

  ### 2. Sparsity Prior in SAEs  
  **Q:** SAEs rely on a sparsity prior to disentangle superposed features. How does this prior *epistemically justify* the claim that sparse features are "more real" than polysemantic superposition, given that the prior is externally imposed?  

  *Likely Reply Appeal:* Sparsity matches biological cognition or is necessary for efficient computation.  
  **Follow-up:** If biological analogy grounds justification, how do we avoid the is-ought fallacy? Couldn’t artificial networks achieve functionality via superposition *without* sparse representations?  

  ---

  ### 3. Causal Intervention & Representational Content  
  **Q:** When causal interventions (e.g., feature ablation) alter model outputs, why should we interpret this as revealing *representational content* (e.g., "cat-ness") rather than mere causal structure (e.g., "this vector influences outputs in cat-related contexts")?  

  *Likely Reply Appeal:* Intervention preserves semantic coherence (e.g., ablating "cat" features only affects cat-related outputs).  
  **Follow-up:** Couldn’t a purely causal description (*non*-representational) account for semantic coherence? What *additional* evidence would distinguish "represents cats" from "mediates cat-task performance"?  

  ---

  ### 4. Universality of Feature Discovery  
  **Q:** If features like "goldfish neurons" are "real" representations, why do different SAE methods (e.g., varying L1 penalties) find *non-identical* features for the same semantic concepts? Does this variation undermine objectivity?  

  *Likely Reply Appeal:* Features are approximate/contextual; core representations are robust across methods.  
  **Follow-up:** If representations are method-relative, how does realism avoid collapsing into instrumentalism?  

  ---

  ### 5. Underdetermination Challenge  
  **Q:** How does representational realism respond to underdetermination: multiple incompatible decomposition schemes (e.g., SAEs vs. non-negative matrix factorization) predict behavior equally well?  

  *Likely Reply Appeal:* Convergent evidence across methods reveals shared latent structure.  
  **Follow-up:** If convergence is partial (e.g., 70% overlap), are the divergent 30% "unreal"? What principle decides?  

  ---

  ### 6. Ontological Commitment  
  **Q:** Does representational realism commit to features being *discrete entities* in the network? If so, how does this reconcile with continuous optimization (e.g., features smoothly emerging during training)?  

  *Likely Reply Appeal:* Representations are high-level abstractions over distributed parameters.  
  **Follow-up:** Doesn’t this abstraction risk making representations *explanatorily inert* for mechanistic accounts of network function?  

  ---

  ### 7. Sparsity Follow-up: Superposition Efficiency  
  **Q:** Given evidence that superposition *improves* model efficiency (e.g., Elhage et al.), why privilege sparse features as "real" if superposition is functionally optimal?  

  *Likely Reply Appeal:* Sparsity aids interpretability; functional efficiency ≠ ontological primacy.  
  **Follow-up:** If functional efficiency doesn’t indicate ontological primacy, what *does*—especially if sparsity is imposed post hoc?  

  ---

  ### 8. Causal Follow-up: Direction of Causation  
  **Q:** If steering vectors causally influence outputs, could this be explained by the vector *bypassing* representations (e.g., directly modulating logits) rather than activating latent content?  

  *Likely Reply Appeal:* Interventions preserve semantic alignment with inputs/outputs.  
  **Follow-up:** How do we rule out that alignment arises from correlational structure in training data rather than internal representations?  

  ---

  ### 9. Falsifiability Challenge  
  **Q:** What empirical result *would falsify* representational realism? For instance, if a model achieved SOTA performance *without* discoverable monosemantic features?  

  *Likely Reply Appeal:* "Such models are implausible"; representations are necessary for generalization.  
  **Follow-up:** If we built a model using non-interpretable components (e.g., randomized basis networks) that generalized robustly, would that challenge realism—or would you argue representations *must* exist but are inaccessible?  

  ---

  ### 10. Ultimate Falsifiability Test  
  **Q:** If representational realism holds that representations exist *independently of our tools*, could we in principle find a network where:  
  (a) It solves complex tasks robustly,  
  (b) *No known method* (SAEs, probes, etc.) finds human-aligned features,  
  (c) Causal interventions show no semantically coherent effects—  
  And you would *still* claim it contains representations? If so, isn’t realism unfalsifiable?  

  ---

  ### Key Tactical Notes:
  - **Basis-change** follow-up forces engagement with the observer’s role.  
  - **Sparsity** follow-up targets circularity in using human priors as truth-tracking.  
  - **Causal intervention** follow-up demands criteria beyond predictive utility.  
  - **Falsifiability** questions (#9–10) prevent evasion by demanding concrete counterevidence.  

  These questions avoid letting the guest restate their view by anchoring each query to specific technical or philosophical tensions in the literature. The structure ensures follow-ups preempt common realist rebuttals, pushing toward deeper justificatory grounds.
