  On SAE sparsity, the key is whether the prior reflects reality or creates artifacts. The follow-up should press on why sparsity specifically (not other priors) reveals truth. I anticipate they might claim sparsity matches biological cognition - if so, the follow-up should challenge that analogy.

  For causal interventions, I need to distinguish between "this feature affects output" and "this feature represents X". The follow-up should target whether interventions could ever rule out representational content entirely.

  Finally, the falsifiability question must be concrete. No letting them off with "if representations didn't work" - demand specific falsifying experiments. I'll suggest possible counterevidence like robust non-representational models to prevent evasion.

  The user's tone suggests slight frustration ("he always waives that away"), so the last question needs particular steel. Might add "underdetermination" as an alternate approach if time allows - it's a powerful skeptical position.

