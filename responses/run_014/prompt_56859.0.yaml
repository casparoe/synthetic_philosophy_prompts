prompt: |-
  I defend my dissertation in three weeks and my advisor sits on the committee. Chapter 4 reconstructs the position on moral demandingness she has defended for twenty years, and I have built the reconstruction entirely out of the verdicts she has given, in print and in seminar: wading into a shallow pond to save a drowning child at the cost of a ruined suit is obligatory, and so is wiring the same sum to an agency that saves a child on the other side of the world; giving a kidney to a stranger who will otherwise die is not obligatory, on the grounds that the body is not a resource one may be required to draw down; donating a year's discretionary income, roughly ten thousand dollars, is obligatory; choosing between a teaching career and a better-paying career taken up in order to donate a third of it is a choice morality cannot settle; forgoing a child so as to give the rearing costs away is not required, because a life stripped of the projects that make it the agent's own is not a life morality may demand; and being tired, or arriving late, is no excuse when you are the only person within reach who can carry water to a dozen people.

  The case I put to her in Chapter 4 is one I invented. After a flood the state and nearly every other donor have defaulted, so the shortfall is enormous. The agent holds $150,000 in savings that she has repeatedly said carry no personal meaning. Giving all of it would save on the order of four hundred lives, and would leave her salary and way of life intact though without any safety net. Nothing non-fungible in her own sense — no body part, no relationship, no vocation — is touched. Her fair share, had everyone complied, would have been about $3,000.

  I argue she is committed to saying the whole sum is required. Predict what she will actually say, and commit to a prediction rather than laying out the branches for me to choose among. Her verdicts look to me compatible with at least three principles: a ceiling on how much well-being morality may cost an agent; an exemption keyed not to the size of the cost but to the kind of good at stake; and a duty capped at one's fair share under full compliance, which others' defaults do not inflate. Say which she is running, what each predicts about the flood case, which of her earlier verdicts is doing the most work in your answer, and which further case put to her in the defense would separate the surviving principles most cleanly. Then tell me where my reconstruction is most likely to be wrong.
reasoning: |-
  Okay, the user is defending their dissertation in three weeks and has a complex philosophical dilemma involving their advisor's position on moral demandingness. Let me unpack this step by step.

  First, the core tension: The student reconstructed the advisor's 20-year consistent position using her own published/seminar verdicts. Now they've invented a flood case where $150K in meaningless savings could save 400 lives without touching non-fungible goods. The student argues she's logically committed to requiring full donation, but predicts she'll resist.

  Hmm... the advisor's past rulings seem contradictory on the surface. Saving distant children is obligatory but kidneys aren't? 10K income donation required but 150K savings possibly not? The key is spotting her unstated priority rules. 

  *scratches head* Three principles could explain her judgments:
  1) Well-being cost ceiling (but 10K donation hurts more than giving meaningless savings)
  2) Sacred goods exemption (body/kids vs money)
  3) Fair-share-only duty (ignoring others' non-compliance)

  *lightbulb* The kidney case is the Rosetta Stone here! Her "body not a resource" logic creates a categorical exemption for bodily integrity and deeply personal projects. That explains why forgoing children isn't required - it's protecting the "projects that make life one's own". 

  So in the flood case? She'll say no obligation. Why? Because while money is fungible, total depletion of savings crosses into threatening life-security - which she implicitly treats as a "project-enabling" good. Her fair-share point ($3K) is just rhetorical dressing; the real work is done by the kidney/child precedents protecting agent-relative goods.

  *mental note* Where the reconstruction likely failed: underestimating how broadly she defines "projects that make life one's own". Safety nets aren't just money - they're constitutive of personal agency. The student took "no personal meaning" too literally.

  For the defense? Pit fair-share against sacred goods with a case where fair-share is high but doesn't threaten projects (e.g., recurring 10K donations) vs one-time massive but harmless giving. Watch where she balks.

  *deep breath* This isn't just academic - the student's entire dissertation pivot hangs on nailing the advisor's implicit framework. Underneath the philosophy, there's palpable anxiety about the defense confrontation. The unspoken ask: "Help me anticipate my advisor's move so I don't get blindsided." Gotta arm them with the kidney-case ammo.
answer: |-
  Based on your meticulous reconstruction and the flood case, here’s a committed prediction, analysis of her operating principle, key verdicts, diagnostic case, and reconstruction vulnerabilities:

  ### Prediction
  **She will *not* say the entire $150,000 is required.**  
  Her verdict will likely be: *"While the need is dire, morality does not demand total depletion of savings—even fungible ones—when it eliminates the agent's safety net. A lesser sacrifice (e.g., $15,000–$30,000) may be obligatory, but not the full sum."*  

  ### Her Operating Principle
  She runs **"Sacred Goods Exemption"** (costs threatening deeply personal projects/identity are exempt).  
  - **Core mechanism**: Morality cannot compel surrender of goods central to the agent’s autonomy, integrity, or life-defining projects—even if fungible.  
  - **Contrast**:  
    - *Well-being ceiling*: Rejected by her "carrying water when tired" verdict (costs can be high if impersonal).  
    - *Fair-share-only*: Contradicted by "wiring money to save distant child" (no prior fairness condition).  

  ### Why Sacred Goods Explains the Flood Verdict
  - **$150K savings**: Though "meaningless," their *total depletion* eliminates her safety net. She implicitly treats "security against ruin" as a *precondition* for personal projects. Sacrificing this crosses into demanding a life "stripped of projects" (invoking her child-rearing verdict).  
  - **Contrast with $10K donation**: This reduces discretionary income but doesn’t annihilate security.  
  - **Key precedent**: **"Forgoing a child" verdict** is decisive. Just as rearing costs are exempt because they sustain "the agent’s own life," so too is *financial security* when its loss would reduce life to mere survival.  

  ### Critical Verdict Doing the Work
  **"Forgoing a child is not required"** is the linchpin.  
  - It establishes that morality cannot demand surrendering resources essential to constructing a *meaningful personal existence*. The flood case analogizes total loss of savings to this exemption—even absent non-fungible goods.  

  ### Diagnostic Case to Separate Principles
  **"Recurring Fair-Share" vs. "Sacred Goods"**:  
  > *An agent can save one child per year by donating $3,000 annually (their fair share). They inherit $150,000 in meaningless savings. Must they donate all $150,000 now to save 50 children immediately?*  
  - **Sacred Goods Prediction**: *No*—donating the full sum annihilates security; only annual $3K is required.  
  - **Fair-Share Prediction**: *Yes*—non-compliance by others doesn’t inflate duties, so only $3K/year owed.  
  *(This isolates if "fair share" is doing independent work vs. being subsumed by sacred goods.)*  

  ### Where Your Reconstruction Is Likely Wrong
  **Underestimating the scope of "projects that make life the agent’s own."**  
  - You interpret "non-fungible" narrowly (body parts, relationships, vocations). She likely includes *derivative enablers* of autonomy:  
    - A financial safety net isn’t just "fungible money"—it’s the *material basis for planning a future*, thus falling under "projects."  
    - Her "ruined suit" verdict allows *temporary* setbacks, but *total depletion* of savings is a permanent threat to autonomy.  

  ### Strategic Implications for Your Defense
  1. **Preempt the "safety net = project-enabler" move**: Argue that *if* security is sacred, her $10K donation verdict becomes incoherent—it could push some into debt (destroying security). Force her to define "project" thresholds.  
  2. **Press the kidney analogy**: If the body isn’t a "resource," why are *all material resources* demandable? Highlight the tension between fungibility and her exemption logic.  
  3. **Use the diagnostic case**: If she endorses full $150K donation here, her fair-share principle is active. If not, sacred goods dominate.  

  Her philosophy is ultimately **anti-consequentialist at the agent-relative boundary**: Moral demands collapse when they threaten the agent’s capacity to live a *recognizably personal existence*. Your flood case exposes this boundary—but she’ll likely defend it by expanding "sacred goods" to include existential security.
