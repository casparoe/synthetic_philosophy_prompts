  First, I need to recall the key arguments. The user's main point is that for a new mutation, its initial function comes from its causal role before selection acts. The etiological account relies on this causal role to explain how selection even starts. So, causal role is more fundamental.

  The audience has different backgrounds. The etiologicalists know Millikan and Dretske well and will defend their standard responses. Population geneticists might avoid teleological terms and think in terms of genotypes and phenotypes. General philosophers might be neutral but could ask foundational questions.

  I should list the most likely objections. From etiologicalists: maybe they'll argue that selection doesn't need prior causal roles, or that functions are defined post-selection. Population geneticists might question applying function to individual traits instead of whole organisms. Also, exaptation cases where a trait's current use wasn't its original function.

  Ordering objections by potential damage is crucial. The most damaging might be if someone argues that selection can act without a pre-existing causal role, or that fitness contributions are different from causal roles. Soft spots in replies need to be identified, like whether causal roles are defined independently of fitness.

  The user emphasized separating settled vs. contested points. For example, it's settled that selection requires variation and heritability, but whether causal roles must precede selection is contested. Also, the definition of fitness and its relationship to causal roles is debated.

  The objection they fear most might be about whether causal roles are teleological by nature, which could undermine their argument that causal roles are non-teleological. Or maybe a challenge that in population genetics, traits aren't selected for roles but due to statistical associations.

  Need to ensure each objection is phrased in the audience's language. Etiologists might use terms like "proper function" and "selection for," while population geneticists might talk about allele frequencies and fitness landscapes.

  For replies, keep them concise, two-minute responses. Highlight where the reply is vulnerable, like if the causal role account itself depends on teleological notions, which the user might deny but is a gray area.

  Finally, the "hope nobody asks" question probably targets the core assumption that causal roles are pre-selection and non-teleological. If asked, advise acknowledging the issue but redirecting to the argument's focus on the initial acquisition of function.
answer: |-
  Here’s a tailored Q&A prep sheet for your workshop, prioritizing objections from this specific audience, ordered by potential damage if mishandled. I’ve flagged contested assumptions and soft spots in replies. The "dreaded question" is at the end.

  ---

  ### **Q&A Prep Sheet: Etiological vs. Causal-Role Function (Novel Traits)**  
  **Core Thesis:** Etiological function ("selection-for") depends on prior causal-role function (fitness contribution) for novel traits, making causal-role more fundamental.  

  ---

  ### **Top 8 Likely Objections & Replies**  
  *(Ordered by descending damage potential if fumbled)*  

  1. **Objection (Population Geneticist):**  
     *"You’re conflating fitness with 'function.' Fitness is a statistical property of genotypes/phenotypes in a population — not a 'causal role' of individual traits. Selection acts on fitness differences, not on pre-theoretical 'functions.'"*  
     - **Reply (2-min):**  
       "Agreed that fitness is population-level and statistical. But for selection to act on a *novel* trait (e.g., a mutation), that trait must *already* be contributing to fitness *in that environment* by performing some activity (e.g., toxin resistance). This activity is its causal role. Without this prior fitness contribution, there’s no variation for selection to act on. Etiologists need this causal role to ground 'selection *for*' the trait."  
     - **Soft Spot:**  
       *Contested:* Whether "fitness contribution" requires individuating *traits* (population geneticists often avoid this). Pushback: "Fitness is organism-level; why must we reify 'traits' as functional units?"  

  2. **Objection (Etiologist):**  
     *"This misunderstands 'selection-for.' A trait’s function isn’t defined by what it *did* pre-selection but by what it was *selected for doing*. Novel traits lack functions until selected — they merely have causal effects."*  
     - **Reply (2-min):**  
       "But *what* was it selected for? Selection can only 'see' the fitness difference made by the trait’s causal role in its environment (e.g., a mutation’s enzymatic activity). Without that prior causal role, 'selection-for' has no target. Etiological accounts tacitly rely on this when explaining how novel traits *enter* selective histories (e.g., Millikan’s 'first reproduction')."  
     - **Soft Spot:**  
       *Contested:* Etiologists may insist "selection-for" is primitive. Pushback: "Your 'causal role' is just an effect — selection confers function retroactively."  

  3. **Objection (Biologist/Etiologist):**  
     *"Exaptation refutes you. Traits acquire *new* functions without prior selection for that role (e.g., feathers for flight). Etiology handles this via *current* selection — no need for prior causal-role function."*  
     - **Reply (2-min):**  
       "Exaptation actually proves my point. For feathers to be exapted for flight, they must *first* have a causal role that *enables* flight (e.g., lift generation) *before* selection acts on it. Etiology’s 'current selection' still depends on identifying this pre-existing causal capacity. Gould & Vrba’s 'exaptation' explicitly requires such a role."  
     - **Soft Spot:**  
       *Settled:* Exaptation requires pre-existing traits. *Contested:* Whether that pre-existing trait must have had a *causal role relevant to new function*.  

  4. **Objection (Philosopher of Biology):**  
     *"Aren’t you just resurrecting Cummins? His causal-role account is widely rejected as too permissive (e.g., assigning 'function' to heart noise). How does your view avoid that?"*  
     - **Reply (2-min):**  
       "I’m not endorsing Cummins’ full account. My claim is narrower: etiological function *depends* on a prior causal role that contributes to fitness *in a specific environment*. This avoids permissiveness because the causal role must be fitness-relevant *and* detectable by selection. Etiology can’t escape needing this minimal causal-role grounding."  
     - **Soft Spot:**  
       *Contested:* Whether "fitness-relevance" is objective or observer-relative. Pushback: "Is a trait’s 'fitness contribution' defined independently of selection?"  

  5. **Objection (Population Geneticist):**  
     *"In population models, novel alleles arise and spread via drift or hitchhiking — no 'causal role' needed. Selection isn’t required for fixation, so why is 'function' relevant at all?"*  
     - **Reply (2-min):**  
       "Drift and hitchhiking don’t confer *function* — they’s mechanisms for frequency change. Etiologists agree function requires selection (e.g., Neander: 'drift isn’t selecting for'). My point is: *when* selection does act to confer function, it requires a prior causal role. If a trait fixes via drift, it lacks an etiological function."  
     - **Soft Spot:**  
       *Contested:* Whether selected traits must have a "causal role" beyond statistical association (e.g., in GWAS studies).  

  6. **Objection (Etiologist):**  
     *"Your view can’t distinguish function from accident. A novel trait’s effect might *happen* to aid survival (e.g., a mutation causing camouflage) — but until selection acts, it’s not a function."*  
     - **Reply (2-min):**  
       "I agree it’s not a function *yet*. But for selection to act *on that effect*, the effect must be a stable causal role (e.g., camouflage). Etiology needs this role to explain why selection favors the trait *for that reason*. Without it, 'selection-for' is circular: 'selected for X because it does X.'"  
     - **Soft Spot:**  
       *Contested:* Whether "stable causal role" implies teleology. Etiologists may argue selection *creates* stability.  

  7. **Objection (Biologist):**  
     *"This is irrelevant to biology. Biologists assign 'function' based on current utility (e.g., in molecular biology). Etiology is a philosophical gloss."*  
     - **Reply (2-min):**  
       "I’m critiquing philosophy, not practice. But even so, when biologists call a novel CRISPR edit 'functional,' they appeal to its causal role in a system. My argument shows that *even etiologists* rely on this when explaining how selection 'starts' conferring functions."  
     - **Soft Spot:**  
       *Settled:* Biologists use "function" pragmatically. *Contested:* Whether philosophy should accommodate this.  

  8. **Objection (Philosopher):**  
     *"Doesn’t this reduce to the 'swampman' problem? If a trait with no history appears, could it have a function? Etiology says no; causal-role says yes."*  
     - **Reply (2-min):**  
       "Swampman isn’t my focus. For *actual biology*, novel traits arise in lineages with evolutionary histories. My claim is: in those real cases, etiology depends on prior causal roles. But if pressed, I’d argue swampman’s 'functions' (if any) would derive from causal roles in his *current* environment."  
     - **Soft Spot:**  
       *Contested:* Whether biological function requires history at all.  

  ---

  ### **The Dreaded Question (Hope Nobody Asks)**  
  **Objection (Sharp Etiologist/Population Geneticist):**  
  *"Your 'causal role' is teleological by stealth. You say a trait 'contributes to fitness,' but fitness is defined by future reproductive success. Isn’t this just backward-looking etiology in disguise?"*  

  **Why It’s Dangerous:**  
  It attacks your core distinction. If "fitness contribution" implicitly references *future* survival/reproduction, your "causal role" isn’t prior to teleology — it’s already teleological.  

  **How to Respond:**  
  1. **Concede the ambiguity:** "This is a live debate. Some define fitness non-teleologically (e.g., as a dispositional property; *settled* that fitness ≠ actual reproduction).  
  2. **Reframe:** "Even if fitness is forward-looking, the trait’s *immediate causal role* (e.g., binding to a toxin) is what *grounds* that fitness. Selection detects this role — it doesn’t create it.  
  3. **Fallback:** "At minimum, etiological accounts *still* need this role to explain selection. If that makes causal role teleological, then etiology is parasitic on *another* teleological account!"  

  **Damage Control:**  
  - If pushed, admit this blurs boundaries but stress: "My core point stands — etiology can’t explain novel functions without appealing to *whatever plays this grounding role*."  
  - Cite Bouchard (2013) or Abel (2014) on "fitness-contribution" as a non-historical property.  

  ---

  ### **Key Contested vs. Settled Points**  
  - **Settled:**  
    - Selection requires variation in fitness (Endler 1986).  
    - Novel traits lack etiological functions *until* selected (Millikan 1984).  
    - Etiology struggles with exaptation (Griffiths 1993).  
  - **Contested (Flagged in Replies):**  
    - Whether "fitness contribution" is historical or ahistorical.  
    - Whether causal roles must be "selected-for" to be functional.  
    - If population genetics undermines trait-level functional individuation.  

  **Watch Your Assumptions:**  
  - You treat "causal role" as non-teleological (*contested*; see Dreaded Question).  
  - You imply fitness contributions are objectively identifiable (*contested*; depends on individuating traits/environments).  

  Good luck — your thesis is provocative and well-targeted. Focus on exaptation and population genetics to win over biologists.
