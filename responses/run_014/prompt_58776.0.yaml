prompt: |-
  I'm putting together a little which rescue view do you actually hold quiz for my philosophy reading group and I could use some help building it. We're all kind of stuck on this endlessly repeating arguement about whether the numbers count when you can only save some people, like my EA friends say obviously save the most lives and my nurse friend says each person is owed the same and you can't just add people up, and tbh we just talk past each other.

  Can you write me like 9 questions, each one a concrete life-or-death case with two or three possible picks for what to do, plus a scoring key at the end that maps answer patterns onto five spots: the strict no-aggregation Taurek-style view, straight-up maximize total lives saved, the middle tie-break-only view where numbers only matter if individual claims are otherwise tied, the ex ante contractualist view that cares about each persons complaint and chances beforehand, and a hybrid threshold view where numbers kick in only after they get big enough. None of the questions should just ask people if they like aggregation in the abstract, they should sort by cases, so please include a 1 vs 5 strangers lifeboat case, a case where one dose of medicine can either fully save one kid or give a much smaller relief to a lot of kids, a case where you yourself are the one versus the many, and a case with wildly unequal survival chances if you try the many-person rescue. After the key, flag any two views your quiz can't really seperate and point out any weird combo of answers that doesn't fit any of the five and say whether you think thats incoherent or just unexplored.
