  First, I need to outline the major implications for each group. For libertarians, PAP's failure is a mixed bag. They lose PAP as a go-to argument against compatibilism, forcing them to emphasize sourcehood more. But the dilemma defense still pressures them—explaining how indeterminism grants control without randomness is tough. Sourcehood becomes their core focus, which is contested internally (like event-causal vs. agent-causal theories).

  Compatibilists gain ground here. Semicompatibilism becomes dominant, shifting focus to actual-sequence mechanisms. Reasons-responsiveness and guidance control are now central. But they have internal debates too—how to define these mechanisms robustly without falling into circularity. Also, compatibilists still need to handle sourcehood, which might be an edge for libertarians.

  Hard determinists benefit indirectly. PAP's failure means compatibilists can't rely on it, but semicompatibilists offer alternatives. Hard determinists now attack actual-sequence control instead, arguing that determinism undermines even that. So the debate moves to whether reasons-responsiveness is possible under determinism.

  The center of gravity shifts from alternative possibilities to actual-sequence control and sourcehood. This affects concepts like desert—if responsibility is about control, not alternatives, does desert still hold? Reactive attitudes (like resentment) might be re-evaluated based on the agent's history and mechanisms. Legal responsibility could shift focus from capacity to act otherwise to impaired control mechanisms.

  Important to prioritize: PAP's refutation reshaping compatibilism is top. Sourcehood becoming crucial for libertarians is next. Then, the focus shift to actual-sequence properties. After that, implications for desert/reactive attitudes. Legal relevance is less direct but growing.

  Contested points: Whether sourcehood is necessary and how it's defined. Libertarians say yes, compatibilists might downplay it. Also, if guidance control suffices for desert—hard determinists and some libertarians disagree. Plus, if reactive attitudes need alternative possibilities—Strawsonians say no, others aren't so sure.

