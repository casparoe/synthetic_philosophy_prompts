reasoning: |-
  We are going to create a practice exam question about Simpson's Paradox using an esports example.
   The scenario: Two teams, Falcons and Owls, play on easy and hard maps.
   Falcons: 
     - On easy maps: 9 wins out of 10 matches (so 9/10)
     - On hard maps: 27 wins out of 90 matches (so 27/90)
   Owls:
     - On easy maps: 80 wins out of 90 matches (so 80/90)
     - On hard maps: 2 wins out of 10 matches (so 2/10)

   We note that:
     Falcons' win rate on easy: 9/10 = 90%
     Falcons' win rate on hard: 27/90 = 30%
     Owls' win rate on easy: 80/90 ≈ 88.89%
     Owls' win rate on hard: 2/10 = 20%

   So per map type:
     On easy: Falcons (90%) > Owls (88.89%) -> Falcons have a higher win rate on easy.
     On hard: Falcons (30%) > Owls (20%) -> Falcons also have a higher win rate on hard.

   But overall:
     Falcons total wins: 9 + 27 = 36, total matches: 10 + 90 = 100 -> 36/100 = 36%
     Owls total wins: 80 + 2 = 82, total matches: 90 + 10 = 100 -> 82/100 = 82%
     So overall, Owls (82%) > Falcons (36%). 

   This is Simpson's Paradox: the direction of the comparison reverses when we aggregate.

   The paradox occurs because the two teams played a very different number of matches on the two map types.
   Falcons played mostly hard maps (90 out of 100) and did poorly on them (30% win rate), while Owls played mostly easy maps (90 out of 100) and did well (88.89% win rate).

   We are to design a 10-mark question. The marking scheme will emphasize:
     - Correctly calculating the win rates per map and overall. (2 marks)
     - Observing the reversal and stating the paradox. (2 marks)
     - Explaining the reason (the weighting: the teams played a very different distribution of map difficulties) and noting that the overall win rate is dominated by the map type on which they played more. (4 marks)
     - Avoiding the mistake of just saying "statistics lie" without explanation. (0 marks for that)
     - Also, we want to avoid confusing with base rate fallacy? Note: Simpson's paradox is about the aggregation of subgroups, while base rate fallacy is about ignoring the prior probability. They are different.

   Let's create the question.

  ---

  **Practice Exam Question: Simpson's Paradox in Esports (15 minutes)**

  Two esports teams, the Falcons and the Owls, competed in a tournament with two types of maps: easy and hard. The results of their matches are summarized below:

  | Team    | Map Type | Wins | Total Matches |
  |---------|----------|------|---------------|
  | Falcons | Easy     | 9    | 10            |
  | Falcons | Hard     | 27   | 90            |
  | Owls    | Easy     | 80   | 90            |
  | Owls    | Hard     | 2    | 10            |

  1. Calculate the win rate (as a percentage) for each team on easy maps and on hard maps. (2 marks)
  2. Calculate the overall win rate (as a percentage) for each team across all maps. (2 marks)
  3. State which team performed better on easy maps and which team performed better on hard maps. (1 mark)
  4. State which team had a higher overall win rate. (1 mark)
  5. Explain why the overall win rate comparison contradicts the per-map-type comparisons. Your explanation should include a discussion of the distribution of matches played by each team. (4 marks)

  ---

  **Model Answer:**

  1. **Per map win rates:**
     - Falcons on easy maps: 9 wins / 10 matches = 0.9 or 90%
     - Falcons on hard maps: 27 wins / 90 matches = 0.3 or 30%
     - Owls on easy maps: 80 wins / 90 matches ≈ 0.8889 or 88.89%
     - Owls on hard maps: 2 wins / 10 matches = 0.2 or 20%

  2. **Overall win rates:**
     - Falcons overall: (9 + 27) wins / (10 + 90) matches = 36/100 = 0.36 or 36%
     - Owls overall: (80 + 2) wins / (90 + 10) matches = 82/100 = 0.82 or 82%

  3. **Per-map comparison:**
     - On easy maps: Falcons (90%) had a higher win rate than Owls (88.89%).
     - On hard maps: Falcons (30%) had a higher win rate than Owls (20%).

  4. **Overall comparison:**
     - Owls (82%) had a higher overall win rate than Falcons (36%).

  5. **Explanation of the contradiction:**
     The overall win rate contradicts the per-map win rates because the two teams played a very different mix of map types. The Falcons played the majority of their matches (90 out of 100) on hard maps, where win rates are lower for both teams. In contrast, the Owls played the majority of their matches (90 out of 100) on easy maps, where win rates are higher. 

     Since the overall win rate is a weighted average of the win rates on easy and hard maps, the Falcons' overall win rate is heavily influenced by their 30% win rate on hard maps (because they played 90% of their matches there). Similarly, the Owls' overall win rate is heavily influenced by their 88.89% win rate on easy maps (because they played 90% of their matches there). 

     Therefore, even though the Falcons had a higher win rate on both types of maps, their overall win rate is lower because they played more matches on the map type that is harder and where they (and the Owls) have a lower win rate.

  ---

  **Marking Scheme (Total: 10 marks):**

  1. **Per map win rates (2 marks):**
     - 0.5 marks for each correct win rate (four in total: Falcons easy, Falcons hard, Owls easy, Owls hard). 
     - Accept fractions, decimals, or percentages. Rounding for Owls easy: 88.89%, 88.9%, or 80/90 (simplified to 8/9) are acceptable.

  2. **Overall win rates (2 marks):**
     - 1 mark for Falcons overall: 36% (or 36/100, 0.36).
     - 1 mark for Owls overall: 82% (or 82/100, 0.82).

  3. **Per-map comparison (1 mark):**
     - Correctly stating Falcons had a higher win rate on both easy and hard maps (0.5 marks for each, total 1 mark).

  4. **Overall comparison (1 mark):**
     - Correctly stating Owls had a higher overall win rate (1 mark).

  5. **Explanation (4 marks):**
     - Identifying the unequal distribution of matches (Falcons played mostly hard, Owls played mostly easy) (2 marks).
     - Explaining that the overall win rate is a weighted average and that the weights (number of matches) for each map type are very different for the two teams (1 mark).
     - Connecting the above to why the overall win rate is lower for Falcons despite higher per-map win rates (1 mark).

  **Note:** If a student only says "statistics lie" or "the overall rate is misleading" without explanation, they get 0 for part 5.

  **Common mistakes that lose marks:**
  - Incorrect arithmetic in calculating rates (lose marks in parts 1 and 2).
  - Not comparing the same map types (e.g., comparing Falcons on easy to Owls on hard) in part 3 or 4.
  - In the explanation, confusing this with base rate fallacy (which is about ignoring prior probabilities) is not the same. Simpson's paradox is about aggregation and weighting. If a student confuses the two, they may lose marks for incorrect reasoning.
  - Not addressing the distribution of matches (the weighting) in part 5.

  ---

  This should help the student practice and understand how to approach Simpson's Paradox in the context of their exam.
answer: |-
  ### Practice Exam Question: Simpson's Paradox in Esports (15 minutes)

  **Scenario:**  
  Two esports teams, Falcons and Owls, compete in a tournament with easy and hard maps. Their results are:  
  - **Falcons**: 9 wins / 10 matches (easy maps), 27 wins / 90 matches (hard maps).  
  - **Owls**: 80 wins / 90 matches (easy maps), 2 wins / 10 matches (hard maps).  

  **Questions:**  
  1. Calculate the win rate (%) for **each team on easy maps** and **each team on hard maps**. (2 marks)  
  2. Calculate the **overall win rate (%)** for each team across all maps. (2 marks)  
  3. Based on your calculations:  
     a) Which team has a higher win rate on **easy maps**? (0.5 marks)  
     b) Which team has a higher win rate on **hard maps**? (0.5 marks)  
     c) Which team has a higher **overall win rate**? (1 mark)  
  4. Explain why the overall comparison contradicts the per-map results. Discuss the role of **weighting** and why this happens. (4 marks)  

  ---

  ### Model Answer  
  **1. Per-map win rates:**  
  - Falcons (easy maps): \( \frac{9}{10} = 90\% \)  
  - Falcons (hard maps): \( \frac{27}{90} = 30\% \)  
  - Owls (easy maps): \( \frac{80}{90} \approx 88.89\% \)  
  - Owls (hard maps): \( \frac{2}{10} = 20\% \)  

  **2. Overall win rates:**  
  - Falcons overall: \( \frac{9 + 27}{10 + 90} = \frac{36}{100} = 36\% \)  
  - Owls overall: \( \frac{80 + 2}{90 + 10} = \frac{82}{100} = 82\% \)  

  **3. Comparisons:**  
  a) Falcons (90%) > Owls (88.89%) on easy maps.  
  b) Falcons (30%) > Owls (20%) on hard maps.  
  c) **Owls (82%) > Falcons (36%)** overall.  

  **4. Explanation of contradiction (Simpson’s Paradox):**  
  The overall win rate reverses because the teams played vastly different numbers of matches on each map type:  
  - Falcons played **90% of their matches on hard maps** (where win rates are low), dragging their overall rate down.  
  - Owls played **90% of their matches on easy maps** (where win rates are high), boosting their overall rate.  
  The **uneven weighting** distorts the overall average. Aggregating the data ignores this imbalance, causing the paradox. Saying "statistics lie" without addressing weighting earns no marks.  

  ---

  ### Marking Scheme (10 marks total)  
  | **Part** | **Marks** | **Award for...** | **Deduct for...** |  
  |----------|-----------|------------------|-------------------|  
  | **Q1**   | 2 | Correct win rates (0.5 per rate). | Arithmetic errors; missing units (%). |  
  | **Q2**   | 2 | Correct overall rates (1 per team). | Not simplifying fractions; wrong totals. |  
  | **Q3a**  | 0.5 | Correctly stating Falcons win on easy maps. | Misreading rates. |  
  | **Q3b**  | 0.5 | Correctly stating Falcons win on hard maps. | Confusing teams. |  
  | **Q3c**  | 1 | Correctly stating Owls win overall. | Not comparing calculated rates. |  
  | **Q4**   | 4 | **Full explanation**: <br> - Mentions uneven match distribution (Falcons: 90 hard, Owls: 90 easy) (2 marks). <br> - Links weighting to overall rates (e.g., Falcons weighed down by hard maps) (2 marks). | Vague answers (e.g., "stats lie" = 0). Confusing with base rates (e.g., "hard maps are harder" without weighting). |  

  **Key pitfalls to avoid:**  
  - **Base rate fallacy**: Discussing "hard maps are harder" without tying it to **uneven sample sizes** (e.g., Falcons played 90 hard maps vs. Owls’ 10).  
  - **Ignoring weighting**: Saying "Falcons are worse overall" without explaining **why** aggregation misleads.  
  - **Arithmetic errors**: Double-check fractions (e.g., Falcons’ hard maps = 27/90, not 27/100).  

  **Why this earns marks:**  
  - **Spotlights weighting**: The core of Simpson’s Paradox is unequal group sizes (90 vs. 10 matches), not base difficulty.  
  - **Uses evidence**: Answers reference calculated rates (e.g., "Falcons’ 90% easy vs. 30% hard").  
  - **Explains, not asserts**: Contrasts per-map vs. aggregated results using data.  

  > **Study tip**: Always check subgroup sizes in aggregated data. Simpson’s Paradox isn’t about "lying stats"—it’s about misapplying averages.
