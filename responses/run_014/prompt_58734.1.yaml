prompt: |-
  Hey so I'm a novelist working on my third book and my charachters are feeling realy flat lately, like they're just floating selves with quirks instead of people embedded in families and obligations and stuff. I've been reading a bit about Confucian role ethics for research — the basic idea as I get it is you aren't some separate authentic self underneath who just happens to have roles, you ARE the bundle of your roles as daughter or son or parent or neighbor or friend, and being a good person just is performing those roles excellently with the right manners and rituals, not following universal principles or chasing happiness.

  Can you help me play with that? Write me a parody advice column, like 550-650 words, with two reader letters plus replies from an advice auntie who is a totally sincere, deadpan Confucian role ethicist. The comedy should come from her actually applying that view correctly, not from making her sound like a generic conservative scold — so she keeps dissolving talk about finding yourself or setting boundaries into questions about what your role requires, grades people on ritual performance, treats being a bad son the way you'd treat being a bad Hamlet, that sort of thing.

  Make one letter from a guy in his 30s who moved across the country to find himself and now feels guilty about missing his dad's big birthday banquet, and you invent the second one but keep it modern and awkward, like roommates or in-laws or work family stuff. Keep it readable for normal readers but sharp enough that someone who knows the role-ethics vs regular virtue-ethics debate would laugh for the right reasons.
