  ### Decision Memo: Switch Option in Two-Envelope Segment  

  **Recommendation:** Do **not** add the "peek and switch" option to the two-envelope segment. While allowing switching appears mathematically harmless under specific bounded distributions when players switch unconditionally, a savvy contestant can exploit conditional switching strategies to gain a positive expected value (EV), leading to financial losses for the show. If the board insists on adding the switch, implement a **fixed, publicly known amount** for \(X\) (e.g., \(X = \$100\), envelopes: \(\$100\) and \(\$200\)) to eliminate EV concerns.  

  ---

  ### 1. **Core Issue: The Two-Envelope Reasoning**  
  The argument for always switching—"if I see amount \(A\), the other envelope has \(A/2\) or \(2A\) with equal probability, so switching yields an expected \(1.25A\)"—is a known paradox. It assumes an *improper prior* (e.g., an unbounded or scale-invariant distribution for \(X\)). This reasoning is flawed because:  
  - It treats \(A\) as fixed while ignoring the prior distribution of \(X\).  
  - In reality, the probabilities of the other envelope being \(A/2\) or \(2A\) depend on how \(X\) was chosen.  

  **Strongest argument for switching (losing side):**  
  If the show uses a symmetric prior (e.g., \(X\) uniform on \([a, b]\)), the *unconditional* EV of switching is zero. A contestant who switches blindly (no peeking) breaks even, suggesting the switch option might be harmless. Peeking seems irrelevant if players cannot leverage the information advantageously.  

  ---

  ### 2. **Why the Switch Is Risky: Savvy Contestants and Conditional EV**  
  Even with a bounded prior, a contestant who peeks and conditionally switches can achieve positive EV:  
  - **Threshold strategy:** Switch unless \(A\) is the maximum possible amount.  
  - **Example:** Let \(X\) be uniform on \(\{100, 200, 400, 800\}\).  
    - If the contestant switches when \(A < 800\), EV = \(+\$66.66\) (details below).  
    - If they switch unconditionally, EV = \(0\), but rational players avoid switching at \(A = 800\) to exploit the distribution.  

  **Calculations for discrete uniform \(X \in \{100, 200, 400, 800\}\):**  
  - Outcomes (6 equally likely):  
    - See \(100\): switch → \(\$200\) (gain: \(\$100\)).  
    - See \(200\): half the time switch → \(\$100\) (loss: \(\$100\)), half → \(\$400\) (gain: \(\$200\)) → avg gain: \(\$50\).  
    - See \(400\): half → \(\$200\) (loss: \(\$200\)), half → \(\$800\) (gain: \(\$400\)) → avg gain: \(\$100\).  
    - See \(800\): no switch → gain \(\$0\).  
  - Expected gain (switch if \(A < 800\)):  
    \[
    (1/6)(100) + (2/6)(50) + (2/6)(100) + (1/6)(0) = \$66.66 > 0.
    \]  
  - **Result:** The show loses money if contestants use this strategy.  

  **Continuous distributions (e.g., \(X\) uniform on \([a, b]\))**:  
  - A threshold strategy (e.g., "switch if \(A \leq b\)") also yields positive EV (e.g., \(+\$75\) for \(a = 100, b = 200\)).  

  ---

  ### 3. **Feasible Alternatives and Why They Fail**  
  - **Option 1: Bounded prior with secret distribution (e.g., \(X\) uniform on \([100, 1000]\))**  
    - **Pro:** Unconditional switching has EV = 0.  
    - **Con:** Savvy contestants might assume a default prior (e.g., uniform) and use a threshold strategy, risking positive EV. Keeping \(X\) secret is unreliable—contestants could infer the distribution over time.  
    - **Risk:** Simulations show conditional strategies yield positive EV in common priors.  

  - **Option 2: Fixed, public \(X\) (e.g., \(X = \$100\))**  
    - Envelopes always contain \(\$100\) and \(\$200\).  
    - **Pro:** Fully transparent. If a contestant sees:  
      - \(\$100\): switching gains \(\$100\).  
      - \(\$200\): switching loses \(\$100\).  
      - EV of switching = \(0\) (fair).  
    - **Con:** Predictable amounts may reduce excitement.  

  - **Option 3: Asymmetric priors to cap conditional EV**  
    - **Example:** Skew \(X\) toward small values (e.g., exponential distribution) so \(P(\text{smaller} | A) \leq 1/3\) for all \(A\).  
    - **Why rejected:** Fails for small \(A\) (e.g., \(P(\text{smaller} | A) = 1\) if \(A\) is the minimum amount), and complex distributions are opaque to contestants.  

  ---

  ### 4. **Recommendation Summary**  
  - **Do not add the switch option.**  
    - **Rationale:** No prior distribution eliminates the risk of positive EV from conditional switching without transparency issues or complexity. The segment works as a simple blind draw, ensuring fairness and predictability.  
  - **If the board insists on the switch:**  
    - **Use a fixed, public \(X\) (e.g., \(X = \$100\)).**  
      - Envelopes: \(\$100\) and \(\$200\), announced upfront.  
      - Ensures EV = 0 whether contestants switch or not.  
      - Simple, auditable, and no exploitation vectors.  

  ---

  ### 5. **Why Not Half Measures?**  
  Allowing the switch without a fixed \(X\):  
  - Invites savvy contestants to exploit the EV imbalance.  
  - Forces the show to rely on contestant ignorance—a reputational risk if "game theory experts" emerge.  
  - Requires ongoing oversight to tweak \(X\)’s distribution, complicating production.  

  **Final note:** The two-envelope paradox is resolved by bounded priors in theory, but *conditional* strategies in practice create a loophole. A fixed \(X\) is the only zero-risk solution if switching is added. Otherwise, maintain the status quo.  

