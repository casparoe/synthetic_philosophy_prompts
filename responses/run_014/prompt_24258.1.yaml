  Better avoid rhyming for authenticity - the user wants conceptual rigor over poetic embellishment. The diction should lean toward precise scientific terminology while remaining accessible. Most importantly, every theoretical shift must be philosophically sound - someone familiar with Duhem-Quine should nod in recognition.

