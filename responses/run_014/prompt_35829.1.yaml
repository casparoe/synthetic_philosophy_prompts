  We are constructing a realistic scenario in which testing the contrapositive is not just permissible but optimal.
   The scenario: A quality-control engineer for a pharmaceutical company is verifying that all batches of a certain vaccine (call it "VaxSafe") are sterile. The hypothesis is: "All batches of VaxSafe are sterile." 
   But testing a batch for sterility is expensive and destructive (you have to open the sealed batch and run tests, rendering it unsellable). However, the engineer can easily observe the factory's environmental monitoring data, which records instances of non-sterile conditions (like high microbial counts in the air) in the production areas. These non-sterile conditions, if they occurred, would contaminate any batch produced at that time. Moreover, the factory produces multiple products, and the monitoring system flags any non-sterile condition regardless of which product is being made.

   The engineer reasons: if I see a non-sterile condition (not G) and note that it occurred when a batch of VaxSafe was not being produced (not F), then that does not directly threaten the sterility of VaxSafe. But if I see a non-sterile condition and it occurred during VaxSafe production, that would be a problem. However, because VaxSafe production is only a small part of the factory's total activity, and because non-sterile conditions are rare, the engineer collects a large number of records of non-sterile conditions and checks which product was being produced. In every case, when there was a non-sterile condition, it was during the production of a different product (say, a non-sterile topical cream). The engineer then takes this as evidence that the VaxSafe batches are safe.

   Why is this optimal? Because checking the environmental records for non-sterile conditions is cheap and non-destructive, and the records are abundant. In contrast, testing a VaxSafe batch for sterility is costly and destroys the batch. Moreover, because non-sterile conditions are rare and VaxSafe production is infrequent, the chances of a non-sterile condition occurring during VaxSafe production are low, but the engineer's method is designed to catch exactly that.

   Now, let's break it down.

   1. Raven-structure:
      - Hypothesis H: "All VaxSafe batches are sterile." 
          Formally: All F are G, where F = VaxSafe batches, G = sterile.
      - Contrapositive: All non-sterile things are non-VaxSafe batches. (All ¬G are ¬F)
      - Hempel's conditions:
          - Instance condition: An observation of an F that is G (a VaxSafe batch that is sterile) confirms H.
          - Also, an observation of a ¬G that is ¬F (a non-sterile thing that is not a VaxSafe batch) confirms H, because it is an instance of the contrapositive.
      - In our scenario, the engineer collects many instances of ¬G (non-sterile conditions) that are ¬F (occurred when VaxSafe was not being produced). By Hempel, these confirm H.

   2. Bayesian treatment:
      We want to show that these observations (of non-sterile conditions during non-VaxSafe production) do carry weight.

      Let H: "All VaxSafe batches are sterile."
      We are also implicitly considering alternative hypotheses. The main alternative is that there are non-sterile VaxSafe batches. But note that the mechanism of contamination is through the production environment. So, the engineer's background knowledge includes:
          - Non-sterility of a batch can only occur if the production environment was non-sterile at the time of production.
          - However, even if the environment is non-sterile, contamination of a batch is not automatic (it might be caught by other controls) but we can simplify by assuming that non-sterile environment implies non-sterile batch (for the sake of the example).

      The evidence E: "A non-sterile condition (¬G) was observed and it occurred during the production of a non-VaxSafe product (¬F)".

      We want P(H|E) > P(H) ? Actually, we have multiple independent instances of E.

      The key is that the evidence E does not rule out the possibility of non-sterile conditions during VaxSafe production. However, if non-sterile conditions are rare and occur randomly, then the fact that we have observed many non-sterile conditions and none of them occurred during VaxSafe production suggests that VaxSafe production might be avoiding non-sterile conditions (or that non-sterile conditions are less likely during VaxSafe production). But note: the hypothesis H does not require that VaxSafe production avoids non-sterile conditions; it requires that if a non-sterile condition occurs during VaxSafe production, the batch is contaminated. However, H does not rule out that non-sterile conditions occur during VaxSafe production (if they did, then H would be false). So the absence of non-sterile conditions during VaxSafe production is consistent with H, but not sufficient for H? Actually, H would be true if either:
          (a) No non-sterile condition ever occurs during VaxSafe production, or 
          (b) Even if one did, the batch was sterile (but that is impossible by our background assumption).

      We have made a background assumption: non-sterile environment at production time implies non-sterile batch. So H is equivalent to: no non-sterile condition ever occurs during VaxSafe production.

      Therefore, the hypothesis H is: "Non-sterile conditions never occur during VaxSafe production."

      Then, the evidence E (a non-sterile condition during non-VaxSafe production) does not directly affect H? Actually, it does because it tells us about the frequency of non-sterile conditions. Let me reframe:

      Let θ be the rate at which non-sterile conditions occur. We assume that non-sterile conditions occur independently and with the same rate during any production. We are concerned about whether they occur during VaxSafe production. So:

          H: No non-sterile condition has occurred during VaxSafe production (so far) and we are extrapolating to future.

      But we are in a setting where we are estimating the rate θ and also the proportion of time that VaxSafe is produced. However, note that the engineer is looking at historical records.

      Alternatively, we can think of H as: "The event of a non-sterile condition occurring during VaxSafe production has probability zero." But that is too strong. We can think of H as: "The rate of non-sterile conditions during VaxSafe production is zero." But then we have a problem because we haven't observed any VaxSafe production (or only a little) so how can we know?

