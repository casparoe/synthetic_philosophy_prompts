      Specifically, suppose we model:
          - The factory operates for T time units.
          - VaxSafe production occurs in a fraction p (small) of T.
          - Non-sterile conditions occur as a Poisson process with rate λ (low).

      The number of non-sterile conditions during VaxSafe production is Poisson with rate λ * p * T.

      We want to test: H0: λ * p * T = 0   (i.e., no non-sterile condition during VaxSafe production) 
