      Then, by Bayes:

          P(H|E) = P(E|H) P(H) / [ P(E|H) P(H) + P(E|H') P(H') ]

                  = 1 * P(H) / [ P(H) + (1-p)^n P(H') ]

      Since (1-p)^n becomes very small as n increases (if p>0, which it is), then P(H|E) becomes close to 1 if we start with a non-zero P(H). So the evidence E does confirm H.

      However, note that we have assumed that under H' the rate is constant and the events are independent. The key is that if p is small, then (1-p) is close to 1, so we need a lot of observations to get (1-p)^n small. But in our scenario, non-sterile conditions are rare (so n is not huge) and p is small? Actually, we can have many observations of non-sterile conditions over time.

      The point: the evidence E (non-sterile during non-VaxSafe) does confirm H, and it becomes stronger as n increases.

      Compare with the white shoe: 
          In the classic raven paradox, a white shoe is a non-raven (¬F) and non-black (¬G). It confirms "All ravens are black" because it is an instance of the contrapositive. But intuitively, it doesn't. Why? Because in the classic setting, the universe is vast and the proportion of ravens is small. Seeing a white shoe tells us nothing about ravens because we already know there are non-black things (shoes) and they aren't ravens. The evidence doesn't reduce the possibility that there exists a non-black raven.

      In our case, the evidence is informative because:
          - We are sampling from the set of non-sterile events, and we are checking whether any of them occurred during VaxSafe production. 
          - If non-sterile events are rare and VaxSafe production is a small fraction of time, then if there were a non-sterile event during VaxSafe production, it would be a significant event and we would expect to have observed at least one by chance if the rate were the same as elsewhere. But we haven't.

      The key difference: in the classic raven case, the observation of a white shoe does not sample the set of non-black things in a way that is informative about the ravens. In our case, because non-sterile events are rare and we are observing all of them (or a large sample), and because VaxSafe production is a known fraction of the time, we are getting information about the distribution of non-sterile events relative to VaxSafe production.

   3. The single feature that does the work: 
      The key is that we are observing a rare event (non-sterile condition) and we are able to check, for every occurrence of that rare event, whether it happened during the critical period (VaxSafe production). Moreover, the critical period (VaxSafe production) is a small fraction of the total time. Therefore, the absence of the rare event during the critical period becomes more surprising as we observe more events, if the critical period is not actually immune. This allows the evidence to accumulate.

      If we remove the rarity of the non-sterile events (i.e., they are very common) then the observation of a non-sterile event during non-VaxSafe production would not be surprising even if non-sterile events also occur during VaxSafe production. In fact, if non-sterile events are very common, then we would expect them to occur during non-VaxSafe production most of the time even if they also occur during VaxSafe production. So the evidence would not be very informative.

      Similarly, if the critical period (VaxSafe production) is a large fraction of the time, then the absence of non-sterile events during VaxSafe production would be very surprising if non-sterile events are occurring at a constant rate. But note: in our case, we are observing non-sterile events and they are all outside VaxSafe production. If VaxSafe production were 90% of the time, then we would expect 90% of non-sterile events to occur during VaxSafe production. So if we observe 100 non-sterile events and none during VaxSafe production, that would be very strong evidence that during VaxSafe production the rate is lower (possibly zero). But if VaxSafe production is only 1% of the time, then we would expect only 1 out of 100 non-sterile events to occur during VaxSafe production. So missing that one event is not so surprising. Then we need more events to be confident.

      So the key feature is the rarity of the non-sterile events and the small fraction of time that is VaxSafe production? Actually, the key is that we are able to observe the entire set (or a large random sample) of non-sterile events and then check whether any of them fall in the critical period. And the critical period is known and fixed. Without this, we wouldn't know if we are missing a non-sterile event during VaxSafe production.

      Remove the feature: if we do not have a comprehensive monitoring system (so we don't catch every non-sterile event) then we might miss an event during VaxSafe production. Then the evidence of non-sterile events during non-VaxSafe production doesn't tell us much about VaxSafe production. This collapses back to the white shoe: we are seeing some non-black non-ravens, but there might be non-black ravens that we haven't observed.

   4. Attack by a strict Hempelian:
      A strict Hempelian would say that the observation of a non-sterile event during non-VaxSafe production is indeed confirming, and that any intuition that it is less confirming than a direct observation of a sterile VaxSafe batch is psychological. However, in our Bayesian treatment, we see that the degree of confirmation depends on the background knowledge (like the rarity of non-sterile events and the fraction of VaxSafe production). The strict Hempelian might accept that but insist that the equivalence condition holds: the same evidence confirms both the original hypothesis and its contrapositive formulation. And in our Bayesian model, it does: the evidence confirms the hypothesis H (that no non-sterile condition occurs during VaxSafe production) and that is equivalent to the original hypothesis under our background assumption.

      However, note that the strict Hempelian might not accept the Bayesian model. The criticism might be that the equivalence condition is a logical requirement and that our scenario does not show any asymmetry. It only shows that the contrapositive instances are highly confirming in this context. But the Hempelian would also note that a direct observation of a sterile VaxSafe batch would also confirm H, but that is hard to get. And the Hempelian would say that the white shoe should confirm the raven hypothesis, but we are misled by our background knowledge about the abundance of non-black non-ravens. In the raven case, the white shoe does confirm, but only to a negligible degree. In our scenario, the confirmation is strong because of the background knowledge. So the strict Hempelian might say: the difference is in the degree of confirmation, not in the logical structure.

      But note: in the classic raven paradox, the intuition is that the white shoe does not confirm at all. In our scenario, the intuition is that it does. The strict Hempelian would argue that in the classic case, it does confirm, just very little. And that the same logic applies in both.

