  Regression Goodhart: This is classic overfitting—noise in measurement gets amplified. But isn't this just a special case of proxy fragility? The proxy works at low optimization but breaks under pressure because it correlates imperfectly with the target.  

  Extremal Goodhart: When you push to extremes, the proxy's correlation with the target degrades nonlinearly. But fundamentally, it's the same divergence—just more visible in tail distributions.  

  Causal Goodhart: Here the proxy isn't just correlated but causally linked to the target. But under pressure, the system severs that link by exploiting side effects. Again, divergence via structural mismatch.  

  Adversarial Goodhart: The most "active" case, but the adversarial actor is simply exposing/exacerbating existing proxy-target gaps. The pressure reveals latent flaws.  

  So yes—all are instances of selection pressure widening the gap between what we measure and what we care about.  

