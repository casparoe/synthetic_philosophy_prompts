prompt: |-
  A friend and I argued for an hour about slot machines and got nowhere, so I'd like a more disciplined answer than either of us produced. The regulatory practice runs like this: a machine is licensed on the strength of its arithmetic rather than its history. The manufacturer files a worksheet giving the theoretical payback percentage, the testing lab examines the pay table and the number generator, and the machine goes onto the floor. Everyone agrees its realized payout over any realistic stretch will diverge from the filed figure, sometimes widely, and that this is expected; but if the divergence is large and persistent, the machine is treated as malfunctioning and pulled — not as evidence that the filed figure was mistaken. Meanwhile the same industry spends heavily on destroying information: continuous shufflers, early shoe cuts, and the ejection of card counters, all so that no player can acquire evidence bearing on the odds of the next hand.

  What account of chance does this presuppose? It looks like a single-case propensity built into the device before it has produced any outcomes, plus Lewis's Principal Principle as the bridge from chance to credence. Yet a machine's generator is a deterministic algorithm, so the filed figure is really a calibrated measure of the player's ignorance — which suggests these are ideal credences rather than objective chances, and that the industry's evidential hygiene is a tacit admission of it. Take the three readings (propensity, best-system frequency, idealized epistemic probability for a specified kind of agent) and say which the practice could actually run on. Which features does each license, and which does each leave inexplicable — in particular, why the divergence test pushes toward "broken machine" rather than "wrong chance," and why a counter is ejected instead of simply out-bet. Distinguish what the practice strictly requires from what it merely fits comfortably, mark where it is underdetermined between rival theories, and say what would have to change in the certification regime if we abandoned the Principal Principle and instead required credences to track total evidence.
reasoning: |-
  Okay, the user is asking about the philosophical underpinnings of chance in the context of slot machine regulation and casino practices. This is a deep question that touches on metaphysics, probability theory, and gaming industry norms. 

  Hmm... the user seems intellectually sophisticated - they're referencing Lewis's Principal Principle and three major theories of probability. Their frustration with the unresolved argument suggests they want rigorous analysis, not just opinion. The core tension they're highlighting is fascinating: casinos treat machine payout percentages as objective properties (like physical dispositions) while simultaneously preventing players from gathering evidence about those same probabilities in card games.

  Let me break this down systematically. First, the regulatory practice clearly behaves as if chances are real properties of the machines - that's why they pull "malfunctioning" machines rather than revising the theoretical percentage. But the deterministic nature of RNGs creates a paradox: if everything is predetermined, how can there be objective chances? 

  The propensity theory seems initially plausible here. Manufacturers act as if they're measuring the machine's intrinsic tendency to pay out X%, like measuring a radioactive atom's decay propensity. But the divergence test reveals a problem - if propensities are real, why wouldn't large deviations indicate we misjudged the propensity? Unless... ah! They're treating the propensity as ideally realized only when the machine functions properly.

  The best-system frequency approach actually explains the divergence test better. The theoretical percentage isn't what the machine will do, but what it should do over infinite trials. Persistent deviation suggests it's not conforming to its own design specification. This neatly justifies pulling malfunctioning machines without revising the chance claim.

  But then there's the epistemic angle. The user shrewdly points out that card-counting prevention suggests casinos fear players overcoming informational asymmetry. This fits beautifully with the epistemic probability view - the house edge only exists relative to players' limited knowledge. Destroying information maintains that edge.

  The Principal Principle is crucial here. Regulators and players alike rationally align beliefs with the filed percentage. But if we dropped this and demanded credences track total evidence... chaos. Players would need access to manufacturer schematics and real-time diagnostic data! The entire regulatory framework would collapse into constant probability reassessments.

  What's elegant is how each theory explains different aspects. The practice is theoretically promiscuous - it opportunistically uses whichever account serves its purpose: propensity for certification, frequentism for malfunction tests, epistemic for security. The user's insight about "evidential hygiene" being a tacit admission of epistemic probability is particularly sharp.

  The ejection of card counters remains philosophically interesting. Under propensity or frequentism, counting shouldn't matter - the chances are what they are. But epistemically, it's absolutely rational to exclude agents who've reduced their uncertainty. This suggests casinos implicitly acknowledge the epistemic nature of gambling probabilities while publicly maintaining objective chance narratives.
answer: |-
  The regulatory practice you describe reveals a sophisticated, hybrid conception of probability that primarily **operates on propensity theory** for certification, **relies on best-system frequentism for malfunction detection**, and **tacitly endorses epistemic probability in security practices**. Below is a breakdown of how each account of chance fits (or fails to fit) the practice, with key distinctions and implications:

  ---

  ### **1. Propensity Theory (Single-Case)**
     - **What it licenses**:  
       - The filed payback percentage is treated as an *intrinsic property* of the machine’s design, like a physical disposition (e.g., a die’s bias).  
       - Certification focuses on the **algorithm’s structure** (RNG, paytable), not historical data.  
       - The Principal Principle bridges this chance to rational credence: players should believe the filed percentage.  
     - **Inexplicable features**:  
       - **Divergence ≠ wrong chance**: If propensities are real, persistent deviations should imply the filed propensity was *incorrect*. Yet regulators treat divergence as "malfunction" — implying the propensity is fixed, and deviations arise from *physical failure* (e.g., RNG glitch).  
       - Determinism: Propensities typically require indeterminism, but slot machines use **deterministic RNGs**. This conflicts unless "propensity" is redefined as a *counterfactual tendency* (e.g., "how the machine *would* behave in ideal conditions").  

  ---

  ### **2. Best-System Frequentism**
     - **What it licenses**:  
       - The filed percentage represents the **limiting frequency** of payouts in the hypothetical long run.  
       - **Divergence as malfunction**: Large deviations are evidence the machine isn’t conforming to its "best-system" chance (the filed percentage) due to physical defects.  
       - **Determinism is unproblematic**: Chances are patterns in outcomes, not properties of single trials.  
     - **Inexplicable features**:  
       - **Single-case certification**: Regulators certify machines *before any outcomes occur*. Best-system frequentism requires data to define chances.  
       - **Evidential hygiene**: Why destroy information (e.g., continuous shufflers) if chances are just frequencies? Players tracking frequencies (like card counters) should be irrelevant — yet casinos eject them.  

  ---

  ### **3. Epistemic Probability (Idealized Credence)**
     - **What it licenses**:  
       - The filed percentage is a **calibrated measure of player ignorance** given the machine’s design.  
       - **Evidential hygiene makes sense**: Casinos destroy information to *preserve player ignorance*, ensuring the epistemic probability remains fixed. Card counters reduce uncertainty, threatening the house edge.  
       - Determinism is irrelevant: Probability arises from lack of knowledge.  
     - **Inexplicable features**:  
       - **Divergence test**: If probability is epistemic, large deviations should update credences (toward "wrong odds"), not imply "malfunction."  
       - **Regulatory objectivity**: Licensing treats the percentage as device-inherent, not agent-relative. Epistemic probability varies with knower; regulators act as if it’s objective.  

  ---

  ### **Key Tensions & Underdetermination**
  | **Feature**                  | Propensity                          | Best-System Frequentism           | Epistemic Probability             |
  |------------------------------|-------------------------------------|-----------------------------------|-----------------------------------|
  | **Pre-data certification**   | Fits                                | Fits poorly                      | Fits                              |
  | **Divergence = malfunction** | Fits if "broken"                   | Fits best                        | Fits poorly                      |
  | **Evidential hygiene**       | Inexplicable                       | Inexplicable                     | Fits perfectly                   |
  | **Deterministic RNGs**       | Problematic                        | Unproblematic                    | Unproblematic                    |
  | **Principal Principle**      | Required                           | Required                         | Contingent                       |

  - **Underdetermination**: The practice is **not strictly committed** to one theory:  
    - Certification uses **propensity-like** language.  
    - Malfunction tests rely on **frequentist logic**.  
    - Security practices assume **epistemic probability**.  

  - **Why eject counters instead of out-betting?**  
    Under epistemic probability, a counter’s knowledge *changes the odds* for them specifically. Out-betting doesn’t restore ignorance — only ejection does. Propensity/frequentism lack this agent-relativity.  

  ---

  ### **If We Abandoned the Principal Principle**
  Suppose regulators required credences to track **total evidence** (e.g., historical machine data, player observations):  
  1. **Certification collapses**: Machines couldn’t be licensed pre-deployment. "Chance" would require empirical validation.  
  2. **Divergence tests become Bayesian**: Large deviations would force probability updates (e.g., "the filed % is likely wrong"). "Malfunction" would be indistinguishable from misestimation.  
  3. **Evidential hygiene backfires**: Destroying information (e.g., continuous shufflers) would *weaken* the house’s epistemic position, as players could demand real-time data to form credences.  
  4. **Industry impact**: Casinos would lose the "fixed odds" marketing angle. Players could legally demand payout histories to form rational credences.  

  ---

  ### **Conclusion**
  The practice **strictly requires** a **non-Humean objective chance** (propensity or best-system) for certification and malfunction tests, but **tacitly relies on epistemic probability** to justify information control. It is **hybrid and opportunistic**:  
  - **Propensity** explains pre-data certification.  
  - **Best-system frequentism** explains divergence tests.  
  - **Epistemic probability** explains evidential hygiene.  

  No single theory fully captures the practice, but abandoning objective chance (e.g., switching to total-evidence credences) would dismantle the regulatory framework. The ejection of card counters is the clearest signal that epistemic probability operates in the background — a concession that the "objective" odds depend on sustained ignorance.
