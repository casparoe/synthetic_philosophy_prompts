prompt: |-
  I'm an undergraduate taking a philosophy of art seminar this term, and our running dispute is what, if anything, makes something an artwork. The problem is that everyone in the seminar self-labels in ways that collapse the moment a real case is put on the table: the people who call themselves formalists in the abstract turn out to be artworld contextualists about readymades, and the self-described anti-definitionalists keep smuggling in a hidden "it has to mean something" condition. For the seminar's public-facing blog I've been asked to build a short diagnostic quiz titled, roughly, "which definition of art do you actually hold?" — one that sorts readers by what they say about concrete cases rather than by which theory they like the name of.

  Please design the quiz as follows. First construct the answer space from the distinctions that matter for my purpose, and only then locate the named positions inside it: (a) whether something must be a product of an agent at all; (b) whether it must be intended to communicate or mean something; (c) whether it must have aesthetic properties in the object itself; and (d) whether the artworld's treatment of a thing is constitutive of its being art, or merely fallible evidence that it is. The quiz itself should have eight to ten questions, each a concrete case with two or three plain-language answer options, and each phrased so a reader can answer without knowing which theory the answer favors — no question may just ask "is Duchamp's Fountain art?", since everyone has memorized the liturgy about Fountain; where you use the classic cases, twist them out of their canonical textbook presentation. The cases must include: an undetectable forgery that experts and laypeople find aesthetically identical to the original it copies; a natural object — say, a weathered stone that looks exactly like a Brancusi — shaped by no one and selected by no one; a chimpanzee's painting that a museum wants to acquire; an image produced by an AI system with no human selection at any stage, which hangs in a gallery; an object deliberately made by an artist and displayed in a gallery that has neither aesthetic merit nor discernible meaning; a painter's canvas buried in a crate at the artist's death and seen by no one for two centuries; and at least one case of your own invention that you think separates positions the classic cases leave fused. For every item, give three possible verdicts — art, art badly made, or not art at all — since that three-way split is where the seminar's fights actually live.

  Then give a scoring key mapping answer patterns onto the leaves: the strong institutional view, the historical/narrative view, the aesthetic-functional view, the expression/communication view, the cluster account, and the anti-definitional option that no unified definition is available. Flag explicitly any pair of leaves your key cannot really separate (I suspect the cluster account and a weak institutional view will both get scored from the same answers, since both want to say "yes, somewhat" to everything), and note any combination of answers that nobody on record defends, with a sentence on whether that gap reflects incoherence, unattractiveness, or territory nobody has happened to explore. The entire deliverable — questions, options, and scoring key — must come in under 850 words, so keep the case descriptions to a sentence or two each.
reasoning: |-
  Hmm, the user is an undergraduate philosophy of art student tasked with creating a diagnostic quiz about definitions of art. They're frustrated because their seminar discussions reveal inconsistencies between how people self-identify (e.g., as formalists) and how they actually judge concrete cases. Their assignment is to design a quiz that bypasses theoretical labels by focusing on reactions to specific scenarios.

  The key requirements are: 1) Build an answer space around four distinctions (agent requirement, communicative intent, aesthetic properties, artworld constitution vs evidence), 2) Create 8-10 case-based questions with three verdict options each (art/art badly made/not art), 3) Include specific scenarios like undetectable forgeries, natural objects, AI art etc., plus one novel case, 4) Map answer patterns to six theoretical positions with notes on overlaps and gaps.

  I need to design this carefully. For the answer space, the four distinctions will structure how different theories respond. The six positions to map are: strong institutional, historical/narrative, aesthetic-functional, expression/communication, cluster, and anti-definitional. 

  The quiz questions must avoid canonical presentations of famous cases. For example, instead of directly asking about Duchamp's Fountain, I could twist it by describing an object deliberately made and displayed that lacks both aesthetic merit and meaning. Cases should include: an undetectable forgery, a natural Brancusi-like stone, a chimp painting acquired by a museum, AI-generated art without human selection, an unseen buried canvas, and my own invented case - perhaps a spontaneously generated digital image that becomes culturally significant without any creator.

  For the scoring key, I anticipate cluster accounts and weak institutional views might overlap since both accept borderline cases. I should also flag combinations nobody defends - like requiring aesthetic properties but no agent, which seems incoherent. The anti-definitional view might be tricky to score as it rejects the premise; I'll handle it through consistent "it depends" answers.

  The whole response must stay under 850 words, so cases need ultra-concise descriptions (1-2 sentences). I'll phrase questions neutrally so readers don't recognize the theories being tested. The verdict options will mirror seminar debates where "art badly made" often functions as a compromise position.
answer: |-
  Here is the diagnostic quiz designed to reveal underlying commitments, with scoring key:

  **Quiz: What Actually Makes Something Art?**  
  *Answer based on your intuitive judgment of each scenario: A) Art, B) Art (badly made), C) Not art at all*

  1.  **The Forgery:** A painting is an undetectable copy of a famous masterpiece, made by a forger. Even experts using all tools agree it looks *exactly* like the original. It hangs in a museum, labeled as the original. After discovery, the museum keeps it displayed as "The Perfect Forgery."  
      *(Tests: Agent? Aesthetic properties? Artworld role?)*

  2.  **The Stone:** On a remote, uninhabited island, erosion creates a stone that looks *identical* to a polished Brancusi sculpture. No human has ever seen or interacted with it.  
      *(Tests: Agent? Artworld? Aesthetic properties?)*

  3.  **The Chimp Painting:** A chimpanzee in a zoo is given paints and a canvas. It creates a vibrant, complex abstract painting. A major modern art museum seeks to acquire and exhibit it as "Primate Expression."  
      *(Tests: Agent? Intent to communicate? Artworld?)*

  4.  **The Unseen Canvas:** A painter finishes a canvas, deems it a failure, and seals it in a crate. It’s discovered untouched 200 years after their death. It’s technically competent but conventional.  
      *(Tests: Artworld recognition? Intent? Communication?)*

  5.  **Gallery Nonsense:** An artist deliberately crafts a plain, grey, featureless cube. They title it "Void" and display it in a prestigious gallery. The artist states it has no meaning or aesthetic qualities and is "about nothing."  
      *(Tests: Intent? Communication? Meaning? Aesthetic properties? Artworld?)*

  6.  **The AI Singularity:** An AI system, designed to generate random images for testing monitors, creates a striking landscape. No human selected its training data, prompted it, or saw the output. Later, this image is found and hung in a gallery as "Unintended Genesis."  
      *(Tests: Agent? Intent? Artworld?)*

  7.  **The Found Driftwood:** A beachcomber picks up an interestingly twisted piece of driftwood and places it on their mantelpiece because they find it beautiful. They tell no one about it.  
      *(Tests: Agent? Artworld? Aesthetic properties? Intent?)*

  8.  **The Accidental Masterpiece:** A factory worker accidentally spills different colored industrial paints onto a canvas lying on the floor. The result is visually stunning. The factory owner frames it and puts it in the lobby.  
      *(Tests: Agent/Intent? Aesthetic properties? Artworld context?)*

  9.  **The Viral Algorithm:** A purely mathematical algorithm, generating abstract patterns as a side-effect of network traffic analysis, produces a unique, complex image. This image spreads organically online, becoming a potent cultural symbol for "digital chaos," though no one claims authorship.  
      *(Tests: Agent? Intent? Meaning/Communication? Artworld? - *Invented to separate meaning-generation from artist intent and institutional action*)*

  **Scoring Key:**  
  Tally your answers (A, B, C) for each question. Patterns map roughly to these views:

  *   **Strong Institutional View:** Consistently A or B *only* if there's artworld uptake (displayed, acquired, discussed *as art*). (e.g., Artworld = Constitutive).  
      *   **Key Answers:** 1A/B, 3A/B, 5A/B, 6A/B, 9A/B; 2C, 4C (if unseen), 7C (private), 8C (unless lobby = art context?).
  *   **Historical/Narrative View:** Focus on origin within an artistic lineage/intent, even if unseen/failed. Artworld is evidence.  
      *   **Key Answers:** 1C (not original lineage), 4A/B (artist made it), 5A/B (artist made/displayed), 2C (no history), 3C (no human art history), 6C (no human art history/intent), 7C, 8C, 9C.
  *   **Aesthetic-Functional View:** Primary focus on inherent aesthetic properties (beauty, form, design) experienced by a viewer. Artworld & intent are secondary evidence.  
      *   **Key Answers:** 1A/B, 2A/B, 3A/B, 6A/B, 7A/B, 8A/B, 9A/B; 4C (unseen/not experienced), 5C (no aesthetic properties).
  *   **Expression/Communication View:** Requires intent by an agent to express/communicate something (meaning/feeling). Aesthetic properties or artworld are vehicles or evidence.  
      *   **Key Answers:** 1C (forger's intent ≠ art), 4A/B (artist intent), 5C (explicitly no meaning), 6C (no intent), 7C (no intent to communicate), 8C (accident), 9C (no authorial intent); 3A/B (if chimp 'expressed'? Often C).
  *   **Cluster Account:** Tends towards A/B for most cases, accepting borderline/fuzzy cases. Relies on overlapping criteria without necessity/sufficiency.  
      *   **Key Answers:** Mostly A/B across the board, especially where any criteria (aesthetic, agent, artworld, meaning) are partially met. Frequent use of B ("bad art").
  *   **Anti-Definitional:** Rejects unified definition. Answers may seem inconsistent or heavily context-dependent. Often uses "C" for cases lacking *any* traditional markers or "it depends" (not an option, so may score erratically).  
      *   **Key Answers:** Hard to pattern; may have many C's *or* many A/B's based on personal reaction, explicitly rejecting theory. Frequent use of B might indicate this.

  **Overlaps & Gaps:**

  *   **Fused Pair:** **Cluster Account** and a **Weak Institutional View** (artworld as strong evidence, not constitutive) are very difficult to separate. Both will score similarly (mostly A/B). The key *might* be stricter Cluster use of A/B for cases like the Stone (2) or Found Driftwood (7) lacking artworld, which Weak Institutional might mark C.
  *   **Unoccupied Territory:** Requiring **aesthetic properties but NO agent** (e.g., answering A/B for the Stone (2) AND C for the Chimp (3), AI Singularity (6), *and* Gallery Nonsense (5)). This combination (aesthetic essentialism + no agent possible) is likely **incoherent** – if aesthetic properties alone suffice, why exclude non-human agents or accidents? It implies aesthetic properties magically require a human creator, which isn't logically necessary.
  *   **Unattractive Gap:** Requiring **an agent but NO intent to communicate/mean anything** AND **NO aesthetic properties** AND **NO artworld role** (e.g., C for Gallery Nonsense (5) *despite* artist/gallery, AND C for Unseen Canvas (4) *if* deemed without merit/meaning). This denies art status even to things meeting some common criteria deliberately, suggesting an unrealistically narrow view with little support.
