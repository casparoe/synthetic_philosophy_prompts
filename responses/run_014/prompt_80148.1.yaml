prompt: |-
  So I'm a PhD student working in moral epistemology, and I've got this seminar presentation in about two weeks where I'm going to defend my dissertation chapter, and the room is going to be a real mixed bag. There's a couple of Kantian ethicists who think moral knowledge has to be grounded in your own autonomous practical reasoning, so to them taking a moral authority's word for it isn't a source of knowledge, it's a kind of defect. There's a few moral psychologists who've published on how pervasive and intractible moral disagreement is, so they're going to doubt there are any real moral experts to defer to in the first place. And there's maybe one or two epistemologists who are actually sympathetic to moral testimony but keep coming back to the moral epistemic peer problem and whether moral sources are reliable enough to count.

  My view is that moral testimony is not just legitimate but sometimes a required source of moral knowledge, and that genuine moral expertise exists. My argument is basically that a lot of what looks like deep, irresolvable moral disagreement is actually just a gap in moral information that a more trained or more experienced moral agent can close, and I'm leaning on a reliance-style account of testimony applied to the moral domain. I was talking with a friend who does moral psychology last week and he kept saying people don't realize how much moral data there is that you just can't access without doing the work, and I think that's going to be the crux of my talk.

  Can you draft me a Q&A prep sheet? I want the objections I'll actually get from this specific audience, not the ones I'd get from a general philosophy crowd, ordered by how much damage they'd do. Phrase each one the way that particular person in the room would phrase it, give me a short reply, and note where my reply is soft. And please include the one objection I'm hoping nobody asks, because I have a feeling the Kantians are going to go after something I havn't fully thought through.
reasoning: |-
  Okay, let me unpack this request. A PhD student in moral epistemology needs Q&A prep for a high-stakes dissertation defense seminar. Their audience is a polarized mix of Kantians, moral psychologists studying disagreement, and reliability-focused epistemologists. Their core thesis is that moral testimony is not just legitimate but sometimes obligatory, based on the idea that apparent moral disagreement often stems from informational gaps that experts can bridge.

  First, I need to map the attack vectors from each faction. The Kantians will hit the autonomy issue hardest - that's existential for them. The moral psychologists will weaponize their own empirical work on disagreement to challenge the very possibility of moral expertise. The reliability epistemologists will demand impossible precision about how we measure moral source reliability. 

  The real landmine is that hidden Kantian objection about the phenomenology of testimony - the way accepting moral testimony feels fundamentally different from autonomous reasoning. If they articulate that, it could unravel the whole "required source" claim. I should flag that as the nightmare question.

  For structure, I'll tier objections by damage level. Tier 1 are the lethal ones that must be neutralized immediately: the Kantian autonomy objection and the moral psychologist's expertise skepticism. Tier 2 are serious but manageable, like the peer disagreement problem. Tier 3 are important but won't sink the ship, like defining expertise thresholds. 

  The replies need surgical precision. For autonomy, we'll concede the descriptive difference but reframe dependence as virtuously heteronomous. For expertise skepticism, we'll pivot to informational asymmetry - their data actually proves our point about uneven access. The soft spots should be confessed strategically; admitting uncertainty about reliability metrics disarms critics better than dodging.

  Most importantly, we need to weaponize their own research. When moral psychologists cite disagreement studies, we'll counter that those studies presuppose informational equality that doesn't exist. That's the killer move they won't expect.
answer: |-
  Here’s a targeted Q&A prep sheet tailored to your audience, ordered by potential damage level. I’ve modeled objections after the factions you described, flagged soft spots, and included the "nightmare question" at the end. Replies balance defensibility with strategic concessions.

  ---

  ### **Tier 1: High-Damage Objections**  
  *(Could undermine core thesis if unaddressed)*  

  1. **Kantian Ethicist** (Autonomy Attack)  
     *Objection:* "If moral knowledge requires *self-legislated* rational endorsement, how can deferring to testimony—which bypasses autonomous reasoning—ever generate *moral knowledge*? Isn’t this just intellectual surrender, not epistemic gain?"  
     *Reply:* "Deference isn’t bypassing reason; it’s deploying it *meta-cognitively* to identify reliable experts. Just as we trust scientists in their domains without replicating experiments, moral learners rationally vet sources *then* integrate testimony into their practical reasoning—autonomy preserved."  
     *Soft Spot:* Assumes "integration" satisfies Kantians; some will insist moral judgment *must* be first-personal.  

  2. **Moral Psychologist** (Expertise Skepticism)  
     *Objection:* "Your ‘informational gap’ thesis ignores my work showing persistent disagreement *among* supposed experts (e.g., ethicists debating trolley problems). If even they can’t converge, how can ‘moral data’ resolve disputes? Isn’t this just bias toward your preferred experts?"  
     *Reply:* "Not all disagreements are equal. Many arise from *differential access* to lived moral experiences (e.g., trauma, cultural context). Experts with broader ‘data’ (like clinically trained ethicists) *do* converge on nuanced judgments—but we’re not sampling them in armchair studies."  
     *Soft Spot:* Needs empirical backup. Cite real-world expert consensus (e.g., medical ethics boards) but admit disagreement exists at frontiers.  

  3. **Epistemologist** (Reliability Challenge)  
     *Objection:* "You claim moral testimony is reliable, but unlike scientific testimony, we lack intersubjective verification (e.g., no ‘moral microscopes’). How do we *track reliability* without shared tools to resolve disputes?"  
     *Reply:* "We track it *pragmatically*: sources that yield coherent, actionable guidance across contexts (e.g., seasoned judges, crisis counselors). Reliability emerges from *practice*, not abstract verification."  
     *Soft Spot:* Risks circularity ("good outcomes define reliability"). Stress *defeasible* reliance, not certainty.  

  ---

  ### **Tier 2: Medium-Damage Objections**  
  *(Threatens auxiliary claims; manageable with prep)*  

  4. **Kantian Ethicist** (Maturity Critique)  
     *Objection:* "Even if testimony grants true belief, doesn’t reliance stunt moral development? Kant’s ‘immaturity’ is an *epistemic vice*—you’re valorizing dependence!"  
     *Reply:* "Testimony isn’t permanent crutches; it’s scaffolding. Like apprentices learning from masters, novices *build* autonomy through guided practice—deference is *how* we cultivate moral competence."  
     *Soft Spot:* Doesn’t address cases where lifelong reliance is needed (e.g., complex neuroethics).  

  5. **Moral Psychologist** (Bias Amplification)  
     *Objection:* "Deference doesn’t fill gaps—it *imports* the expert’s biases. My research shows moral ‘experts’ are just as tribal as laypeople. How is this not epistemic outsourcing?"  
     *Reply:* "Competent deference requires *diverse* expert engagement (e.g., consulting multiple traditions). Crucially, I argue for testimony *only* when access asymmetries exist—like relying on a war correspondent’s account if you’ve never seen combat."  
     *Soft Spot:* Doesn’t solve how novices identify *truly* diverse sources.  

  ---

  ### **Tier 3: Low-Damage Objections**  
  *(Important but won’t cripple your case)*  

  6. **Epistemologist** (Peer Problem Redux)  
     *Objection:* "When two ‘experts’ conflict (e.g., a utilitarian vs. deontologist), and I lack standing to adjudicate, how is testimony any better than guessing?"  
     *Reply:* "We *can* assess comparative expertise: track record, scope of experience, engagement with counterarguments. When peers genuinely clash, suspending judgment *is* rational—but that’s rare in real-world contexts with clear asymmetries."  
     *Soft Spot:* Expertise metrics in ethics are fuzzy; appeal to "practical success" risks pragmatism.  

  ---

  ### **The Nightmare Question**  
  *(The one you’re dreading)*  

  7. **Kantian Ethicist** (Phenomenology of Moral Judgment)  
     *Objection:* "You say testimony integrates into reasoning, but the *phenomenology* differs: when I autonomously conclude ‘X is wrong,’ I feel bound by duty. When I accept testimony, I feel bound by *trust*. Isn’t moral knowledge inherently first-personal—so testimony gives mere *belief*?"  
     *Reply:* "This conflates *genesis* with *justification*. Moral knowledge can arise heteronomously (e.g., learning ‘slavery is wrong’ from parents) yet become autonomous through reflection. The ‘binding force’ emerges from *endorsement*, not origin."  
     *Soft Spot:* **Major vulnerability.** Kantians may reject this as psychologizing normativity. Have a fallback: "If moral truth is objective (as we agree), testimony *can* transmit it—even if phenomenology differs. But I concede this needs more work on moral psychology."  

  ---

  ### **Strategic Tips**  
  - **Leverage Moral Psychologists:** When they cite disagreement studies, counter: "Your data proves *informational asymmetry*—participants lack shared data, not shared rationality."  
  - **Preempt the Nightmare:** Briefly address phenomenology in your talk to soften the blow. Frame testimony as "extended cognition."  
  - **Concede Wisely:** Admit soft spots early (e.g., "Reliability *tracking* is harder in ethics—here’s why it’s still possible...").  
  - **Soundbite for Kantians:** "Autonomy isn’t solitary—it’s socially scaffolded."  

  You’ve got a strong case. Anchor it in the "moral data asymmetry" insight—it’s your sharpest weapon against all three factions. Good luck!
