prompt: |-
  I serve on a university sexual misconduct hearing panel. We hear about two dozen cases a year, and the single question we spend the most time on is whether the complainant's consent was valid — or, in cases where the respondent claims they reasonably believed consent was present, whether that belief was reasonable given what they knew about deception, pressure, or the complainant's capacity at the time. The panel includes faculty from across the university (history, chemistry, engineering) and two students; nobody has formal training in the philosophy of consent, and our training materials mostly recite policy language without helping us operationalize it. We are not lawyers, we do not apply rules of evidence, and we deliberate in a conference room with a whiteboard, not a courtroom.

  I want a decision procedure we can use during deliberations, after the factual disputes have been resolved as best we can, to assess whether consent was validly given. The procedure should walk us through the three main threats to validity — deception, coercion, and incompetence — in a structured order, with concrete questions for each, thresholds for what counts as sufficient to undermine consent, and explicit flags for where the procedure cannot decide and the panel must exercise judgment. The procedure should be usable by non-philosophers in under thirty minutes, and it should be honest about which steps are genuinely rule-like and which are judgment calls dressed up as criteria. Where the philosophical literature contains a genuine dispute that bears on a step — for instance, about whether consent is fundamentally a mental state or a communicative act, or about whether the standard for competence should be fixed or vary with the stakes of the decision — please flag that dispute and tell us how to proceed in spite of it, rather than pretending it does not exist.

  Please then apply the procedure to three cases. First: a complainant alleges they consented to sex only because the respondent told them they were in a committed relationship and had ended things with their other partner; the respondent admits they were still seeing the other partner and had no intention of ending that relationship, but argues that people misrepresent their romantic intentions all the time and this does not rise to the level of invalidating consent. Second: a graduate student alleges they consented to a sexual relationship with their thesis advisor only because they feared that refusing would damage their career; the advisor never made any explicit threat but acknowledges they were aware of the power differential. The university's policy is silent on whether advisor-student relationships are per se prohibited. Third: both parties agree the complainant had been drinking heavily — somewhere between six and nine drinks over four hours — and initiated the sexual encounter, but the complainant says they were too intoxicated to meaningfully consent and the respondent says the complainant was lucid, conversational, and appeared to be making decisions normally.

  For each case, walk through the procedure step by step and tell me what it yields. I especially want to see a case where the procedure returns an answer the panel will find uncomfortable — perhaps because it says consent was valid when our instincts say otherwise, or invalid when we would prefer to find it valid. Finally, tell me what this procedure systematically cannot handle: the kinds of cases or considerations it will miss, and where the underlying philosophical theory itself is unsettled enough that no procedure could settle it.
reasoning: |-
  Hmm, this is a complex and sensitive request about sexual misconduct hearings. The user serves on a university panel that handles about two dozen cases annually, focusing primarily on consent validity. The panel members come from diverse academic backgrounds without formal philosophy training, and their current materials don't help operationalize consent evaluation. They need a practical decision procedure that addresses deception, coercion, and incompetence in under 30 minutes.

  The user wants complete transparency about what's rule-based versus judgment-based, with explicit acknowledgment of philosophical disputes in consent theory. They're asking for three case applications where one should produce an uncomfortable result, plus identification of the procedure's systematic limitations.

  Key challenges here include:
  - Translating abstract consent theory into concrete questions
  - Balancing structure with necessary judgment calls
  - Acknowledging philosophical disagreements without paralyzing decision-making
  - Creating something usable by non-specialists under time pressure

  For the decision procedure, I'm considering a modular approach with three clear sections corresponding to the main validity threats. Each section should have:
  1) Threshold questions with binary outcomes where possible
  2) Explicit judgment zones with guiding principles
  3) Philosophical dispute flags with practical resolution paths

  The uncomfortable result requirement suggests I should design the coercion module to potentially validate consent in Case 2 if no explicit threat exists and the policy doesn't prohibit the relationship - which might conflict with panel members' instincts about power imbalances.

  For systematic limitations, I need to highlight:
  - Situations involving retroactive withdrawal of consent
  - Cases where capacity is borderline
  - Contexts where cultural norms conflict with policy
  - "Moral residue" cases that feel wrong but meet technical validity
  - Disputes about reasonable belief standards

  The case applications must demonstrate strict adherence to the procedure, especially showing where judgment calls are unavoidable. In Case 1, the deception analysis turns on whether the lie concerns sexual activity itself. In Case 2, the coercion module's structural power question becomes pivotal. Case 3 will showcase the competence continuum problem.

  Throughout, I'll maintain absolute clarity about what's determinate versus what requires deliberation, using the whiteboard-friendly structure they mentioned. The tone should remain clinically precise given the gravity of these decisions, while acknowledging the emotional difficulty when outcomes feel counterintuitive.
answer: |-
  Here is a structured decision procedure for assessing consent validity, designed for non-philosophers under time constraints. It explicitly flags judgment calls and unresolved philosophical disputes.

  **Consent Validity Assessment Procedure (30-Minute Whiteboard Protocol)**

  **Phase 1: Factual Baseline (5 mins)**  
  *   Whiteboard the agreed/established facts: Who, what, when, where, actions, key communications.  
  *   **Rule:** Only use facts resolved by the panel. Disputed facts must be settled *before* this procedure starts.  
  *   **Judgment Call:** Determining what facts are "established."

  **Phase 2: Validity Threats Assessment (20 mins - 7 mins per threat)**  
  *Assess each threat IN ORDER. If consent is invalidated by one threat, STOP and record why. Proceed only if consent survives the prior threat.*

  1.  **DECEPTION (Was consent induced by a material deception?)**
      *   **Q1:** Did the Respondent *knowingly* make a false statement of fact (not opinion/puffery) to the Complainant? (Yes/No/Judgment)
          *   *Threshold:* Statement must be objectively verifiable as false (e.g., "I am single," "I have no STIs," "This is a required part of the experiment").
          *   *Judgment Call:* Was it truly a statement of *fact* vs. intention/promise/opinion? (e.g., "I love you," "I'll call you tomorrow" are harder).
      *   **Q2:** Was this false statement **material** to the sexual decision? (Yes/No/Judgment)
          *   *Threshold:* Would a reasonable person in the Complainant's position likely have refused consent *if they knew the truth*? (Focus on objective likelihood, not Complainant's subjective claim).
          *   **PHILOSOPHY FLAG:** Dispute exists on what makes deception "material." Some argue *only* deceptions about the *nature of the act* or *identity of the person* invalidate consent (e.g., lying about being a doctor during an exam, impersonating someone's spouse). Others argue *any* fact central to the *reason for consent* invalidates it (e.g., lying about vasectomy, relationship status, STI status). **How to Proceed:** *Default* to the broader view (central to reason for consent) unless your *institution's policy* explicitly adopts the narrower view. The broader view is more protective and aligns with modern trends.
      *   **OUTCOME:** If *Yes to both Q1 & Q2*, consent is **INVALID** due to deception. STOP. Else, proceed to Coercion.

  2.  **COERCION (Was consent given under illegitimate pressure?)**
      *   **Q1:** Did the Respondent engage in conduct that would cause a reasonable person in the Complainant's position to fear *serious* negative consequences if they refused consent? (Yes/No/Judgment)
          *   *Threshold:* Look for explicit threats (violence, job loss, grade penalty, deportation) OR implicit threats reasonably inferred from conduct/power dynamics *known to the Respondent*.
          *   *Judgment Call:* What constitutes "serious"? (Physical safety > job/grade > social standing). Was the fear *reasonable* given the context?
      *   **Q2:** Did the Respondent **exploit a position of authority** over the Complainant? (Yes/No/Judgment - *Critical for academic contexts*)
          *   *Threshold:* Does the relationship inherently involve power (e.g., supervisor/employee, professor/student, advisor/advisee, coach/athlete)? Did the Respondent *know* or *should reasonably have known* this power could pressure the Complainant?
          *   **PHILOSOPHY FLAG:** Dispute exists on whether *structural* power alone invalidates consent, or only if *abused*. **How to Proceed:** *Assume structural power creates a presumption of coercion*. Consent is **INVALID** unless the panel affirmatively finds, based on *clear evidence*, that:
              *   The Complainant initiated *freely and persistently* without prompting by the Respondent, AND
              *   The Respondent took *active steps* to mitigate pressure (e.g., recused from grading/advising, disclosed relationship per policy, ensured no retaliation fear).
          *   *Judgment Call:* Assessing "freeness" of initiation and sufficiency of mitigation steps.
      *   **OUTCOME:** If *Yes to Q1*, OR *Yes to Q2 AND the presumption is not overcome*, consent is **INVALID** due to coercion. STOP. Else, proceed to Competence.

  3.  **COMPETENCE (Did the Complainant have the capacity to consent?)**
      *   **Q1:** Did the Complainant have the **cognitive ability** to understand: (a) the nature of the act, (b) the participants, and (c) the potential consequences? (Yes/No/Judgment)
          *   *Threshold:* Basic factual understanding (e.g., knows it's sex, knows who they are with, understands risks like pregnancy/STIs). Not requiring complex reasoning.
      *   **Q2:** Did the Complainant have the **volitional ability** to make a choice and communicate it? (Yes/No/Judgment)
          *   *Threshold:* Ability to express "yes" or "no" meaningfully (verbally/non-verbally), not just reflexively. Ability to resist *overwhelming* internal compulsion (rare).
      *   **Focus on Incapacitation (Common Issue):**
          *   Was the Complainant incapacitated by alcohol/drugs? **Key Threshold:** Incapacitation = lacks *either* cognitive OR volitional ability. Signs: unconsciousness, vomiting, inability to stand/walk unaided, slurred/incoherent speech, memory blackout, confusion about place/people.
          *   **PHILOSOPHY FLAG 1 (Mental State vs. Communication):** Dispute exists: Is consent a purely internal mental state, or does it *require* observable communication? **How to Proceed:** *Focus on observable capacity indicators (Q1 & Q2)*. A person who *appears* competent based on behavior (even if internally hesitant) has *communicated* consent validly *unless the Respondent knew they were internally incapable*. Burden is high to prove Respondent knew of hidden incapacity.
          *   **PHILOSOPHY FLAG 2 (Stakes Sensitivity):** Should competence threshold vary with risk? (e.g., higher threshold for risky acts). **How to Proceed:** *Use a fixed, minimal threshold* (Q1 & Q2) unless your *policy* specifies otherwise. Higher thresholds are impractical to apply consistently.
      *   **OUTCOME:** If *No to Q1 OR Q2*, consent is **INVALID** due to lack of competence. Else, consent is **VALID**.

  **Phase 3: Reasonable Belief (If Validity Fails) (5 mins)**  
  *   **Only IF** you found consent was invalid (or absent), ask: Could the Respondent **reasonably have believed** consent was present and valid *based on the facts known to them at the time*?
      *   *Threshold:* Would a sober, reasonable person, with the Respondent's knowledge, have believed there was clear, affirmative, voluntary agreement? Consider Complainant's words/actions *from Respondent's perspective*.
      *   **PHILOSOPHY FLAG:** Dispute exists on whether "reasonable belief" should be purely objective or include the Respondent's subjective perspective/sincerity. **How to Proceed:** *Primarily objective* ("reasonable person" standard). Subjective sincerity is relevant but insufficient if the belief was objectively unreasonable. Ignorance of policy/law is *not* a defense.
      *   **OUTCOME:** If *Yes*, Respondent may not be *culpable* (policy dependent). If *No*, Respondent is responsible for proceeding without valid consent.

  ---

  **Application to Cases**

  **Case 1: Deception about Relationship Status**
  *   **Facts:** Respondent lied about ending relationship with other partner. Complainant consented based on belief in exclusivity.
  *   **Deception Q1:** **Yes.** Knowingly false statement of fact ("I ended things").
  *   **Deception Q2 (Materiality):** **Judgment.** *Philosophy Flag - Materiality Dispute.*
      *   Applying broader view: Was the exclusivity central to Complainant's reason for consent? Likely **Yes.** A reasonable person might refuse sex if they knew the partner was actively cheating/polyamorous without agreement. Lying about fundamental terms of the relationship *is* material to sexual consent for many.
      *   *Outcome:* **INVALID Consent (Deception).** STOP.
  *   **Procedure Yield:** Consent invalid. Respondent's argument ("people misrepresent all the time") fails because the deception was *material* to the consent given. The commonality of lying doesn't make it valid.

  **Case 2: Graduate Student & Advisor (Structural Power)**
  *   **Facts:** Advisor-Student sexual relationship. Complainant feared career damage if refused. No explicit threat. Advisor knew of power differential. Policy silent on prohibition.
  *   **Deception:** (Assume no relevant deception). Proceed to Coercion.
  *   **Coercion Q1 (Explicit/Implicit Threat):** **Judgment.** No explicit threat. Was fear of damage *reasonable*? Likely **Yes**, but difficult to attribute *specific conduct* by Respondent causing it beyond the inherent power dynamic. Focus shifts to Q2.
  *   **Coercion Q2 (Exploitation of Authority):** **Yes.** Clear position of authority (Thesis Advisor).
  *   **Presumption of Coercion:** Can it be overcome? **Judgment.**
      *   Did Complainant initiate *freely and persistently*? Unclear from facts – "consented because feared" suggests pressure, not free initiation.
      *   Did Respondent take *active steps to mitigate pressure*? Facts state "acknowledges they were aware," but no evidence of mitigation (recusal, disclosure, safeguarding). **Likely NO.**
      *   *Outcome:* Presumption **NOT** overcome. Consent **INVALID** due to Coercion. STOP.
  *   **Procedure Yield:** Consent invalid due to exploitation of authority. Policy silence on prohibition doesn't negate the inherent coercion risk in the relationship that Respondent failed to mitigate. The lack of an explicit threat is not determinative under Q2.

  **Case 3: Intoxication (Competence)**
  *   **Facts:** Complainant had 6-9 drinks over 4 hours, initiated sex. Complainant: "Too intoxicated." Respondent: "Lucid, conversational, making decisions normally."
  *   **Deception/Coercion:** (Assume none). Proceed to Competence.
  *   **Competence Q1 (Cognitive Ability):** **Judgment.** Focus on *observable behavior* (Respondent's testimony: "lucid, conversational, making decisions normally"). This suggests understanding the act, participants, and likely basic consequences. **Likely YES.**
  *   **Competence Q2 (Volitional Ability):** **Judgment.** Initiating the encounter strongly suggests ability to make a choice and communicate it (initiation = communication). No signs of physical incapacity mentioned. **Likely YES.**
  *   **Incapacitation Threshold:** Observable signs (vomiting, unconsciousness, inability to walk/talk) absent. Memory blackout *claimed* by Complainant, but *not necessarily observable then* and disputed by Respondent.
  *   **Philosophy Flags:**
      *   *Mental State vs. Communication:* Procedure focuses on observable indicators. Complainant *appeared* competent based on Respondent's observations. No evidence Respondent knew of hidden incapacity. Burden not met.
      *   *Stakes Sensitivity:* Fixed minimal threshold used. 6-9 drinks is a lot, but observable behavior controls.
  *   **OUTCOME:** Consent **VALID.** Competence threshold met *based on observable behavior at the time*.
  *   **Uncomfortable Result:** The panel may feel uneasy because heavy drinking is involved, and the Complainant subjectively felt incapable. However, the procedure, focusing on *observable capacity and communication* known to the Respondent, yields a finding of valid consent. This highlights the tension between subjective experience and objective manifestation. *Reasonable Belief* is moot as consent is found valid.

  ---

  **What This Procedure Systematically Cannot Handle**

  1.  **"Regret" Masquerading as Invalid Consent:** The procedure struggles if the core issue is post-hoc regret where the facts (deception, coercion, competence) don't meet the thresholds at the time of the act. It might validate consent that feels morally questionable later.
  2.  **Ambiguous or Non-Verbal Communication:** It relies on interpreting words/actions. Highly ambiguous signals ("maybe," body language) or lack of clear refusal (vs. affirmative consent) remain judgment-heavy zones, prone to differing interpretations.
  3.  **Borderline Competence:** Cases where someone is impaired but not clearly incapacitated (e.g., mild intoxication, mental health issues, intellectual disability not amounting to incompetence per Q1/Q2) are highly vulnerable to inconsistent judgment calls.
  4.  **Complex Deceptions (Fraud in the Inducement vs. Fact):** Distinguishing a lie about a *collateral matter* (e.g., "I'm rich" to impress) from a *material fact* is philosophically and practically messy. The procedure relies heavily on the "reasonable person" materiality test, which can feel arbitrary.
  5.  **Implicit Bias & Cultural Norms:** The "reasonable person" standard and judgments about fear, pressure, or communication norms can be influenced by unconscious bias or cultural differences the procedure doesn't explicitly account for.
  6.  **The "Reasonable Belief" Quagmire:** Determining what the Respondent "knew" and what was "reasonable" is inherently subjective and relies heavily on credibility assessments made earlier. Deep philosophical disputes about epistemic responsibility persist.
  7.  **Retroactive Withdrawal of Consent:** The procedure focuses on consent *at the time of the act*. It doesn't address situations where consent is validly given initially but withdrawn during the act (unless that withdrawal is ignored, which would be coercion).
  8.  **Moral Residue vs. Legal Validity:** The procedure assesses validity under policy definitions. It may find consent was *technically valid* under the rules (e.g., Case 3) even if the situation feels ethically problematic or exploitative. It doesn't judge "moral blameworthiness" outside the consent framework.
  9.  **Unsettled Philosophical Foundations:** The procedure papers over fundamental disputes (mental state vs. communication, materiality scope, structural coercion) by providing *pragmatic* thresholds and judgment guides. These underlying tensions remain unresolved in philosophy and will surface in difficult cases, meaning perfect consistency or universal satisfaction is impossible. The procedure makes the judgment calls *explicit* but doesn't eliminate them.

  **In essence, this procedure provides structure and transparency for the most common threats but cannot eliminate the inherent difficulty and subjectivity in applying abstract concepts like consent, coercion, and competence to messy human situations, especially where underlying philosophical debates remain active.** It shines a light on where judgment is required and forces deliberation on specific, concrete questions rather than vague instincts.
