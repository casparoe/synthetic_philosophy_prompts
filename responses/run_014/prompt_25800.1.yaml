prompt: |-
  I keep noticing a pattern in how people make decisions when the odds aren't fully spelled out, and I'm trying to figure out whether this thing has a name. It's not just risk aversion. A colleague was picking between two funds. Fund X: "historically 6% annually, SD 4%." Fund Y: "we target 6% but we're too new for historical stats." Same expected return, but he wouldn't touch Fund Y. My sister chose a vacation rental with 40 reviews over one with zero reviews and better photos. I do this too — I'll drive a known route with predictable traffic over a new one my GPS says is faster, because I don't trust the estimate. In each case the avoided option doesn't have worse odds in any calculable sense; the odds are just unknown. I've heard "uncertainty aversion" but I don't know if that's the technical term or if it's even considered distinct from risk aversion. Is there an established name for this, and more importantly, how do you carve the boundary between this and regular risk aversion? And is it considered a bias or a reasonable response to missing information?
reasoning: |-
  Okay, let's dive into this user's query. They're noticing a pattern where people avoid options with unknown odds, even when the expected value seems similar to a known-risk option. The examples they gave—investment funds, vacation rentals, and driving routes—all highlight this behavior. 

  First, I need to confirm if "uncertainty aversion" is the right term. From what I remember, Knightian uncertainty distinguishes between measurable risk (known probabilities) and unmeasurable uncertainty (unknown probabilities). The user’s colleague avoiding the new fund fits perfectly here—there’s no historical data to calculate risk, so it’s pure uncertainty. 

  Next, the user asks about the boundary between this and regular risk aversion. Risk aversion deals with known probabilities but a preference for certainty (like choosing a sure $50 over a 50% chance of $100). Uncertainty aversion is about the discomfort with not even knowing the odds. That’s a key difference. The Ellsberg Paradox experiments illustrate this well—people prefer known probabilities over ambiguous ones, even when the math says they shouldn’t. 

  Is this a bias or reasonable? It’s both. The user might be wrestling with whether their instinct is irrational. Behaviorally, ambiguity aversion is a bias because it leads to inconsistent choices. But in real life, avoiding unknowns can be prudent. For example, a new fund might have hidden risks, and a rental with no reviews could be a scam. The user’s examples show practical wisdom, but also potential missed opportunities if the uncertainty is overestimated. 

  The user’s deeper need seems to be understanding if their behavior is justifiable or something to correct. They might want strategies to balance caution with rationality. Highlighting that ambiguity aversion is well-documented (Ellsberg, modern behavioral econ) gives them validation. Suggesting mitigation tactics—like seeking more data or small-scale trials—could address their unspoken request for practical solutions. 

  Also, their examples are relatable, which makes me think they’re looking for confirmation that this is a common human tendency, not just their quirk. Emphasizing the universality of the bias (and its evolutionary roots) might resonate. They’re analytical (citing SD and expected return), so diving into the technical terms (Knightian, Ellsberg) adds credibility. 

  Finally, wrapping it with "rational in context" acknowledges their intuition while encouraging mindful evaluation. They’ll probably appreciate that balance.
answer: |-
  What you're describing is a well-established phenomenon with a specific name in behavioral economics and decision theory: **Ambiguity Aversion** (or sometimes **Ambiguity Avoidance**).

  Here's a breakdown of the key concepts and how they relate to your observations:

  1.  **The Core Distinction: Risk vs. Ambiguity (Uncertainty):**
      *   **Risk:** This refers to situations where the *probabilities of different outcomes are known or calculable*. Your colleague knows Fund X has a historical mean of 6% and a standard deviation of 4%. He can calculate (or estimate) the probability of different returns (e.g., probability of return > 4%, probability of loss, etc.). This is "measurable uncertainty" or "Knightian Risk."
      *   **Ambiguity (or Fundamental Uncertainty):** This refers to situations where the *probabilities themselves are unknown or unknowable*. Your colleague has *no data* to even estimate the probability distribution for Fund Y. Is the manager competent? Is their strategy sound? Is the "target" realistic? What's the *actual* range of possible outcomes? This is "immeasurable uncertainty" or **Knightian Uncertainty** (named after economist Frank Knight, who made this distinction in 1921).

  2.  **Ambiguity Aversion:**
      *   This is the specific preference for known risks over unknown risks *even when the expected outcome appears identical*. People dislike not knowing the odds more than they dislike bad but known odds.
      *   **Your Examples Perfectly Illustrate This:**
          *   **Funds:** Your colleague prefers the known distribution (SD 4%) of Fund X over the complete ambiguity of Fund Y. The *expected return* might be stated as the same, but the *uncertainty about that expectation* is vastly different.
          *   **Vacation Rental:** Your sister prefers the known quantity (40 reviews providing probabilistic information about quality) over the ambiguous one (better photos offer no probabilistic data).
          *   **Driving Route:** You prefer the known distribution of travel time on your usual route (even if sometimes slow) over the ambiguous estimate from the GPS for a new route (How accurate is its model *for this specific route*? Are there temporary issues it doesn't know about?).

  3.  **Boundary with Risk Aversion:**
      *   **Risk Aversion:** This is a preference for a *certain outcome* over a *gamble with a higher expected value* due to the concave shape of the utility function for wealth/outcomes. (E.g., preferring a sure $50 over a 50% chance of $100 and 50% chance of $0, even though the gamble's expected value is $50). It operates *within the realm of known probabilities*.
      *   **Ambiguity Aversion:** This is a preference for a gamble with *known probabilities* over a gamble with *unknown probabilities*, *even when the stated expected values are identical*. The aversion stems from not knowing the odds themselves, not necessarily from the potential outcomes being bad.
      *   **Key Difference:** Risk aversion is about disliking *variance* (dispersion of outcomes) when probabilities are known. Ambiguity aversion is about disliking *ignorance* about the probabilities themselves. Someone can be ambiguity-averse but relatively risk-neutral (or even risk-seeking) when probabilities *are* known.

  4.  **Is it a Bias or Reasonable?**
      *   **Behavioral Bias Perspective:** From a purely rational, expected utility theory standpoint (like Savage's axioms), ambiguity aversion *is* considered a bias or paradox (famously demonstrated by the **Ellsberg Paradox**). Rational actors shouldn't strictly prefer known probabilities to ambiguous ones *just because* they are known, if the best estimate of the expected value is the same. People violate the "Sure Thing Principle" and exhibit inconsistent choices when ambiguity is involved.
      *   **Ecological Rationality/Prudence Perspective:** In the real world, ambiguity aversion is often a **highly reasonable and adaptive heuristic**. Unknown probabilities frequently signal:
          *   **Lack of Information:** Which could hide significant risks (e.g., the new fund manager is incompetent, the un-reviewed rental is a scam, the new route has a hidden dangerous intersection).
          *   **Untrustworthy Source:** The source providing the "target" or "estimate" might be biased or unreliable.
          *   **Complexity:** Situations with unknown probabilities are often inherently more complex and harder to model accurately.
          *   **Evolutionary Advantage:** Avoiding the unknown (e.g., unfamiliar berries, unseen predators) was often safer for survival.
      *   **Conclusion:** It's **both**. It's formally a violation of strict rationality axioms and thus a behavioral bias. However, in a world of incomplete information and potential hidden dangers, it's often a **prudent and ecologically rational strategy**. The key is being aware of it and assessing *whether the ambiguity truly signals higher risk in a specific context*. Sometimes avoiding ambiguity means missing out on genuinely good opportunities.

  **In Summary:**

  *   **The phenomenon:** **Ambiguity Aversion** (preferring known risks to unknown risks with the same stated expected value).
  *   **The boundary:** Risk aversion operates with **known probabilities**; ambiguity aversion is aversion to **unknown probabilities** (Knightian Uncertainty).
  *   **The status:** It's a **well-documented behavioral bias** (Ellsberg Paradox), but it's also often a **reasonable, prudent response** to genuine uncertainty and missing information in the real world.

  Your intuition about "uncertainty aversion" was very close; "ambiguity aversion" is the precise technical term for the aversion specifically to not knowing the probabilities. Recognizing this tendency helps understand why people (including yourself!) often prefer the "devil they know."
