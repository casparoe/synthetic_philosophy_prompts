answer: |-
  Here's a comprehensive map of the desiderata for a theory of metaphysical grounding, structured around the phenomena to capture, formal constraints, necessary distinctions, and key test cases, including motivations, negotiability, tensions, and the most narrowing requirement:

  ### I. Core Phenomena & Explanatory Role
  1.  **Non-Causal Dependence:** Grounding must capture a relation of *dependence* distinct from causation (e.g., temporal, modal differences).
      *   **Motivation:** The fact that {Socrates exists} grounds {{Socrates exists} or {2+2=5}} depends non-causally on Socrates. Causation relates distinct events over time; grounding relates facts/entities synchronically/atemporally.
      *   **Negotiability:** Non-negotiable. Defining feature.
  2.  **Explanatory Primacy:** Grounding must underwrite *metaphysical explanation* – explaining *why* or *in virtue of what* something is the case.
      *   **Motivation:** We say "The vase is fragile *because* of its molecular structure," not vice-versa. This "because" points to grounding, not just causation or deduction.
      *   **Negotiability:** Non-negotiable. Core function.
  3.  **Grounding as Backer vs. Constitutive of Explanation:**
      *   **Option A (Dominant):** Grounding *backs* or *provides the objective basis for* metaphysical explanation. Explanation is a representational/cognitive act *about* grounding relations.
      *   **Option B (Less Common):** Grounding relations *are themselves* explanations (e.g., a sui generis explanatory relation).
      *   **Motivation:** We distinguish between *knowing* the grounds (an epistemic matter) and the grounds *existing* (a metaphysical matter). Option A preserves this distinction cleanly.
      *   **Negotiability:** Option A is dominant/near-consensus; Option B faces challenges separating metaphysics from epistemology.

  ### II. Formal Constraints (Debated Status)
  4.  **Irreflexivity:** Nothing grounds itself. (~xGx)
      *   **Motivation:** Self-grounding would violate explanatory primacy and lead to circularity. Why is P the case? Because P is the case? This is explanatorily empty. Test case: No fact grounds itself.
      *   **Negotiability:** Near-universal acceptance. Core non-negotiable.
  5.  **Asymmetry:** If A grounds B, then B does not ground A. (AGB → ~BGA)
      *   **Motivation:** Explanatory directionality. If A explains B, B cannot also explain A without circularity (violating irreflexivity). Test case: Socrates grounds {Socrates exists}, but not vice-versa.
      *   **Negotiability:** Near-universal acceptance. Core non-negotiable. (Some challenge it in highly specific, contested cases, but these are outliers).
  6.  **Transitivity:** If A grounds B and B grounds C, then A grounds C. (AGB & BGC → AGC)
      *   **Motivation:** Chains of explanation/dependence. If the arrangement of H₂O molecules (A) grounds the liquidity of water (B), and liquidity grounds the fact that the glass is full of liquid (C), then A should ground C. Preserves explanatory power through chains.
      *   **Negotiability:** Highly debated. **Non-negotiable** for many (especially "unionists"). Actively **challenged** by others (especially "separatists" or "pluralists" like Schaffer) citing potential counterexamples (e.g., quantum entanglement cases, determinate/determinable chains). Requires careful handling.
  7.  **Well-Foundedness:** Every grounded fact/entity is ultimately grounded in one or more *ungrounded* (fundamental) facts/entities. No infinite descending chains or circles.
      *   **Motivation:** Avoid explanatory nihilism. If *everything* requires a ground, and chains go backwards infinitely or in circles, nothing is ever *fully* explained. Metaphysical foundationalism.
      *   **Negotiability:** Highly contentious. **Non-negotiable** for foundationalists (common). **Rejected** by infinitists (rare) or coherentists (who might allow grounding circles, conflicting with Irreflexivity/Asymmetry).

  ### III. Essential Distinctions
  8.  **Hyperintensionality:** Grounding must be sensitive to finer distinctions than necessary equivalence. Grounding claims are *not* equivalent to claims of necessary entailment.
      *   **Motivation:**
          *   **Necessary Truths:** {2+2=4} and {There are infinitely many primes} are both necessary truths (true in all possible worlds), but neither grounds the other; they are grounded in different mathematical facts.
          *   **Constitution:** {Socrates exists} grounds {{Socrates exists} or {Zeus exists}} (contingent). {2+2=4} grounds {{2+2=4} or {Zeus exists}} (necessary). The disjunction's necessity differs, but the grounding structure (truthmaker dependence) is the same: the true disjunct grounds it.
          *   **Finean Essence:** The fact that singleton {Socrates} exists is grounded in Socrates existing, but necessarily, Socrates exists iff singleton {Socrates} exists. The grounding relation distinguishes them despite necessary co-extension.
      *   **Negotiability:** Non-negotiable. Any theory reducing grounding to modal notions (entailment, supervenience) fails this. Major differentiator.
  9.  **Full vs. Partial Grounding:** A distinction must be made between a complete sufficient ground (full) and a contributing factor (partial).
      *   **Motivation:** Conjunction: Each conjunct is a *partial* ground of the conjunction; the conjuncts together are the *full* ground. Test case: {P} partially grounds {P & Q}; {P, Q} fully grounds {P & Q}.
      *   **Negotiability:** Non-negotiable. Required for basic logical cases.
  10. **Mediate vs. Immediate Grounding:** A distinction should be made between direct grounding and grounding via intermediaries (especially if transitivity holds).
      *   **Motivation:** If transitivity holds, we need to distinguish the *direct* ground of B (say, A) from grounds further up the chain (say, C grounding B *via* C grounding A and A grounding B). Helps structure explanations.
      *   **Negotiability:** Widely accepted as useful, but its *necessity* depends on handling transitivity and explanation granularity. Less fundamental than 1-9.

  ### IV. Unity vs. Plurality
  11. **Single Relation vs. Family of Relations:**
      *   **Monism/Unionism:** Grounding is a single, unified relation (or genus) with a core logic (irreflexivity, asymmetry, etc.).
      *   **Pluralism/Separatism:** There are multiple distinct grounding relations (e.g., metaphysical, logical, natural, ethical), potentially with different formal properties.
      *   **Motivation:** Unionists: Parsimony, unified logic explains common features. Separatists: Different "in virtue of" claims (e.g., moral facts in virtue of natural facts vs. parts in virtue of whole) seem fundamentally different; transitivity failures might suggest distinct relations.
      *   **Negotiability:** Central debate. Affects how one handles transitivity counterexamples and formal properties.

  ### V. Grounding Grounding & The Major Tension
  12. **The Status of Grounding Facts:** What, if anything, grounds facts *about* grounding relations? (e.g., What grounds [P grounds Q]?)
      *   **Options:**
          *   **Ungrounded Foundationalism:** Fundamental grounding facts are ungrounded.
          *   **Grounding-Grounds-Itself:** [P grounds Q] is grounded in P and Q (or P alone?).
          *   **Meta-Grounding:** [P grounds Q] is grounded in some distinct fact M.
          *   **Infinitism/Coherentism:** [P grounds Q] is grounded in another fact, ad infinitum or in a circle.
      *   **The Tension (Bennett's Trilemma):** Insisting on *all three* of (a) Irreflexivity, (b) Transitivity, and (c) The principle that **all facts (including grounding facts) are grounded** leads to contradiction or vicious regress.
          *   **Argument:** Assume [P] grounds [Q] (Fact G1: [P]G[Q]). By (c), G1 must be grounded. Suppose [R] grounds G1 (Fact G2: [R]G G1). By (b) Transitivity, if [R]G G1 and G1 = ([P]G[Q]), then [R]G [Q]. But [P] is already the (full/partial) ground of [Q]. This seems problematic (overgrounding?).
          *   **The Real Problem:** Applying (c) iteratively: G2 must be grounded by some [S] (Fact G3: [S]G G2). By transitivity: [S]G G1 and [S]G [Q]. Continue infinitely. We get an infinite chain where each new ground grounds *all* previous grounded facts. This violates plausible constraints on explanation/grounding chains and Well-Foundedness (if held). Crucially, **irreflexivity prevents the chain from looping back** to stop the regress.
          *   **Result:** You *must* reject one of: (a) Irreflexivity (highly undesirable), (b) Transitivity (contested but widely held), or (c) The principle that *all* facts (especially grounding facts) are grounded. Most choose to reject (c) for *fundamental* grounding facts (Foundationalism about grounding) or restrict (c).

  ### VI. Standard Test Cases (Must Get Right)
  13. **Conjunction:** The conjuncts (taken together) fully ground the conjunction. Each conjunct is a partial ground.
      *   **Motivation:** {P, Q} fully grounds {P & Q}. Intuitive dependence: The conjunction is true *because* each conjunct is true.
  14. **Disjunction:** A true disjunct fully grounds the disjunction. The disjuncts together are *not* the full ground (if one is false).
      *   **Motivation:** {P} fully grounds {P v Q} (when P is true). {Q} does *not* ground {P v Q} if Q is false. The disjunction is true *because* a specific disjunct is true.
  15. **Existential Generalization:** An instance (or instances) fully grounds the existential claim.
      *   **Motivation:** {Fa} grounds {∃x Fx} (for a specific 'a'). The existential is true *because* a specific thing satisfies it.
  16. **Determinable-Determinate:** The determinate property instance grounds the determinable property instance (e.g., Scarlet grounds Colored; having mass 1kg grounds having mass).
      *   **Motivation:** The vase is colored *because* it is scarlet. The specific way (determinate) explains the general feature (determinable). (Reverse grounding is implausible: It's not scarlet *because* it's colored). *Caveat:* Some argue for mutual or other relations here, but determinate-grounds-determinable is standard.

  ### Which Desideratum Does the Most to Narrow the Field?
  **Hyperintensionality (Desideratum 8)** is the single most narrowing requirement.

  *   **Why:** It immediately eliminates a vast swathe of otherwise attractive, simpler theories that attempt to reduce grounding to modal notions like supervenience or necessary entailment. Any theory that treats necessarily equivalent propositions as having identical grounding profiles fails. This includes many traditional metaphysical approaches (e.g., some forms of reductive physicalism relying solely on supervenience) and forces grounding to be a highly *fine-grained* relation. Theories *must* either build hyperintensional resources (like structured entities, fine-grained possible worlds, or primitively hyperintensional operators) into their core or accept grounding as primitive and hyperintensional from the start. This requirement pushes theories towards complexity and away from modal reductionism, ruling out more otherwise viable contenders than any other single constraint.
