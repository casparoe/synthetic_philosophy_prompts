prompt: |-
  I'm helping organize a two-day workshop on philosophy of biology, and we've set up an adversarial collaboration between two camps that have been talking past each other for a couple of decades now. One camp is the Popperian/Lewontinian view that the core of Darwinian theory — natural selection as the survival of the fittest — is not a testable scientific hypothesis but a metaphysical research program (in Popper's sense), whose real value is heuristic and whose apparent "confirmations" are just post-hoc redefinitions of fitness. The other camp is the Sober-style philosopher of biology who holds that natural selection is a testable causal hypothesis, that the mathematical formalization in the modern synthesis (Fisher, Wright, Haldane's population genetics) turned Darwinism into an empirically rich theory, and that Popper was really critiquing a 19th-century straw man. I need you to draft the joint statement the two sides would both sign after a good-faith colaboration.

  Specifically I want: (a) the claims both camps can actually sign — about the formalism, about what Darwinism is and isn't, about the history of the theory; (b) the precise statements of where they still disagree, each phrased so its own side would accept the wording; and (c) the cruxes, i.e. the sub-questions such that settling them would move at least one side. I suspect one crux is whether "fitness" is defined in terms of reproductive success (which would make the core claim tautological) or is an independent parameter in a model (which would make it testable), and another is whether the mathematical formalization of the modern synthesis changes the epistemic status of the theory. For each crux, give a concrete case or argument both camps would agree bears on it — say, a test that distinguishes selection from drift in molecular evolution, or a result from experimental evolution — and record in advance what each camp would predict about it. If you conclude part of the dispute is verbal, say which part and why.

  Format it as a numbered agreed-claims section followed by a disagreements table. Please think very carefully before answering and respond in the style of a careful philosopher of biology who actually knows the population-genetics literature, not a survey-taker. And please seperate what's settled from what's genuinely contested among people who know the topic — I don't want a contested view (like "natural selection is a tautology" or "Darwinism is a metaphysical research program") presented as the consensus. I don't need citations or a reading list, just the substance of the argument.
reasoning: |-
  We are drafting a joint statement after an adversarial collaboration on the epistemic status of Darwinian natural selection. The two camps:
   Camp A (Popperian/Lewontinian): Natural selection is not a testable hypothesis but a metaphysical research program (heuristic); fitness is often redefined post-hoc, making confirmations circular.
   Camp B (Sober-style): Natural selection is a testable causal hypothesis, especially after formalization in population genetics (modern synthesis); Popper critiqued an outdated version.

   We need:
   (a) Agreed claims (about formalism, what Darwinism is, history)
   (b) Disagreements (each side accepts the wording of their own view)
   (c) Cruxes: specific sub-questions that, if settled, would move at least one side. For each crux, a concrete case both agree bears on it, and each camp's prediction.

   Also, if part is verbal, identify it.

   Important: Do not present contested views as consensus.

   Approach:
   - Agreed claims: Focus on what both sides accept. This includes the structure of population genetics, the role of fitness, the history of the theory, and the existence of testable models in modern biology.
   - Disagreements: Frame each position in terms the respective camp would endorse. Avoid straw men.
   - Cruxes: Identify key points of contention (e.g., definition of fitness, epistemic status of the core principle) and provide a concrete experimental or theoretical case. Each camp's prediction for that case must be recorded.

   Structure:
   1. Numbered list of agreed claims.
   2. Table of disagreements with columns: 
      - Issue (e.g., Testability of natural selection)
      - Camp A's position (as they would phrase it)
      - Camp B's position (as they would phrase it)
   3. Cruxes: 
      - For each crux, state the question, the concrete case, and the predictions.

   Note on verbal disputes: If the disagreement turns on the meaning of terms (e.g., "natural selection" at different levels of abstraction), note that.

   Let's build:

   Agreed Claims (both camps sign):
   1. The core idea of Darwinian evolution by natural selection, as originally formulated by Darwin, involves three principles: variation, heritability, and differential survival and reproduction. This core idea has been developed and formalized in the modern synthesis, particularly through population genetics.
   2. Population genetics, as developed by Fisher, Haldane, and Wright, provides a mathematical framework that allows for the modeling of evolutionary change in terms of changes in allele frequencies. These models are testable in specific cases (e.g., predicting the response to selection in artificial breeding, or the dynamics of alleles in controlled experiments).
   3. In the practice of contemporary evolutionary biology, researchers routinely construct and test models that include natural selection as a causal force. These models are often tested against alternatives (e.g., genetic drift, migration) using statistical methods applied to empirical data (e.g., in molecular evolution, experimental evolution, or field studies).
   4. The term "fitness" in population genetics is typically represented as a parameter in a model (e.g., relative fitness coefficients) that is intended to capture the expected reproductive success of a genotype or phenotype. In model-building, fitness is often treated as an independent variable that can be measured or estimated (e.g., via survival rates, fecundity, etc.) and then used to predict changes in gene frequencies.
   5. There are cases in the history of evolutionary biology where the concept of fitness has been misused in a post-hoc manner, leading to circularity (e.g., defining the fittest as those that survive, without independent criteria). Such misuses are generally recognized as problematic by both camps and are not considered good scientific practice.
   6. Darwin's original formulation of natural selection was not mathematically formalized and did not have the precision of modern population genetics. The development of the modern synthesis altered the way evolutionary theory is applied and tested.
   7. The principle of natural selection, at a very general level (i.e., as an abstract schema), is not directly testable in isolation because it requires specification of the relevant variations, heritability, and fitness components in a particular context. However, both camps agree that specific models that instantiate the principle are testable.

   Disagreements:
   We present the disagreements in a table format. Each row is a specific issue.

   | Issue | Camp A (Popperian/Lewontinian) | Camp B (Sober-style) |
   |-------|-------------------------------|------------------------|
   | Epistemic status of the core principle of natural selection | The core principle of natural selection, as a general explanatory framework (i.e., the idea that the fitter survive and leave more offspring), is not a testable scientific hypothesis but a metaphysical research program. Its primary value is heuristic: it guides the construction of testable models but is itself immune to falsification because any failure can be attributed to auxiliary assumptions or misspecification of the fitness function. | The core principle of natural selection is a testable causal hypothesis. While specific models are required for empirical testing, the general principle is empirically grounded because it makes broad predictions about the world (e.g., adaptation) and is supported by the success of its instantiations in population genetics and other formal models. The principle is not immune to falsification; if no adaptations were found in nature, or if population genetics models consistently failed, the principle would be undermined. |
   | Role of fitness in the theory | The concept of fitness, when defined as actual reproductive success, renders the statement "the fittest survive" tautological and thus non-testable. The non-tautological use of fitness requires that it be defined independently of reproductive success (e.g., via physiological or ecological traits), but in practice, such independent definitions are often lacking or are adjusted post-hoc to save the hypothesis of selection. | Fitness is not defined as actual reproductive success in population genetics; it is an independent parameter in a model (e.g., a propensity) that is estimated from phenotypic traits and environmental interactions. This parameter is then used to predict reproductive success. The use of fitness in models is non-tautological because fitness is measured independently of the outcome (change in gene frequency) and the prediction can fail. |

   Cruxes:
   We identify two key cruxes. For each, we state the question, a concrete case that both camps agree bears on the crux, and each camp's prediction about the outcome of the case.

   Crux 1: The definition and operationalization of fitness
     Question: Can fitness be defined and measured independently of reproductive success in a way that avoids circularity and allows for genuine tests of natural selection?
     Concrete case: Consider an experimental evolution study with E. coli in a controlled environment. Researchers measure the growth rates (as a proxy for fitness) of two strains in monoculture and then predict the outcome of competition in mixed culture. The growth rate in monoculture is measured independently of the competition outcome (e.g., via optical density in a well-defined medium). The prediction is then tested in the mixed culture over several generations.
     - Camp A's prediction: Camp A would expect that in many cases, if the prediction fails, researchers will adjust the fitness measure (e.g., by invoking frequency-dependent effects, unexpected mutations, or changing the definition of the environment) rather than reject the hypothesis of selection. This would illustrate the malleability of fitness definitions and the difficulty in falsifying the core principle.
     - Camp B's prediction: Camp B would predict that the model using independently measured growth rates will often successfully predict the outcome of competition, and when it fails, the failure can be traced to specific auxiliary assumptions (e.g., neglecting frequency dependence) that can be independently tested and corrected. This would show that fitness is a measurable property that can be used in testable models.

   Crux 2: The impact of the modern synthesis on the epistemic status of natural selection
     Question: Does the mathematical formalization of population genetics elevate natural selection from a heuristic principle to a testable causal theory?
     Concrete case: The use of the neutral theory of molecular evolution to test for the action of natural selection at the molecular level. Specifically, consider the prediction of the neutral theory that the rate of substitution of neutral alleles should equal the mutation rate, and that the ratio of non-synonymous to synonymous substitutions (dN/dS) should be 1 under neutrality. Deviations from 1 are taken as evidence for selection (positive if >1, purifying if <1). This is a standard test in molecular evolution.
     - Camp A's prediction: Camp A would argue that the neutral theory is a competing research program and that the detection of selection via dN/dS ratios relies on the assumption of neutrality as a null model. However, they would note that when dN/dS is not significantly different from 1, it is often interpreted as evidence of neutrality, but when it is different, selection is invoked. They predict that in ambiguous cases (e.g., dN/dS near 1 but not exactly), the interpretation can be post-hoc and that the core idea of selection is not directly tested but is instead assumed when the null is rejected. They might also point to cases where dN/dS is misleading (e.g., due to demographic changes) as evidence that the test is not straightforward.
     - Camp B's prediction: Camp B would argue that the dN/dS test is a clear example of a testable model that can distinguish selection from drift. They predict that when dN/dS is significantly greater than 1 and other confounding factors are controlled (e.g., population structure, mutation rate variation), it reliably indicates positive selection, and when it is less than 1, purifying selection. They would point to cases where such inferences have been validated experimentally (e.g., by engineering mutations and testing their effects) as evidence that the test works.

   Additionally, we note that part of the dispute may be verbal, concerning the level of abstraction at which we consider "natural selection." 
   - Camp A focuses on the most abstract formulation (the "core principle") and argues that at that level it is not testable.
   - Camp B focuses on the use of natural selection in specific models (which are testable) and argues that the core principle is validated by the success of these models.

   This difference in focus leads to different judgments about the epistemic status of the theory.

   Now, we compile the joint statement accordingly.
answer: |-
  ### Joint Statement: Adversarial Collaboration on the Epistemic Status of Natural Selection  
  *Following a two-day workshop, representatives of both camps agree on the following points and clarify remaining disagreements.*

  ---

  #### **Agreed Claims**  
  Both camps endorse these statements without reservation:  

  1. **Formalization of Natural Selection**:  
     The mathematical framework of population genetics (developed by Fisher, Haldane, and Wright) provides testable models for evolutionary change. These models quantify natural selection as a causal process affecting allele frequencies, distinguishable from drift, mutation, and migration via statistical methods.  

  2. **Darwinian Core Principles**:  
     Darwin’s original theory posits three necessary conditions for evolution by natural selection: (a) phenotypic variation, (b) heritable variation, and (c) differential survival/reproduction correlated with variation. These conditions are empirically verifiable in specific systems.  

  3. **Fitness in Practice**:  
     In modern biology, "fitness" is operationalized as an *independent parameter* in population-genetics models (e.g., relative fitness coefficients \(w\)), estimated from phenotypic traits (e.g., fecundity, survivorship) or competitive assays *prior* to predicting evolutionary outcomes. Post-hoc redefinitions of fitness (e.g., defining fitness solely by survival) are circular and rejected as unscientific by both camps.  

  4. **Historical Trajectory**:  
     The Modern Synthesis (1930s–1950s) transformed evolutionary biology by formalizing Darwinism mathematically. Popper’s critiques (e.g., in *Unended Quest*) primarily addressed pre-synthesis formulations (e.g., "survival of the fittest" as vernacular phraseology), not population-genetics models.  

  5. **Testability of Specific Models**:  
     Selection hypotheses are routinely tested and falsified in controlled experiments (e.g., microbial evolution, pesticide resistance) and observational studies (e.g., GWAS, fossil transitions). The principle of natural selection *as instantiated in a specific model* (e.g., selection coefficients for a trait in a defined environment) is empirically evaluable.  

  6. **Heuristic Value**:  
     Natural selection serves as a generative framework for hypothesis-building (e.g., adaptive explanations for trait function), consistent with Popper’s "metaphysical research program" characterization at its *most abstract level*.  

  ---

  #### **Disagreements**  
  The table below summarizes unresolved disputes. Each camp accepts the phrasing of their own position.  

  | Issue | Camp A (Popperian/Lewontinian) | Camp B (Sober-Style) |  
  |-------|--------------------------------|----------------------|  
  | **Epistemic status of natural selection’s core principle** | Natural selection, as a general theory (i.e., "differential fitness causes adaptive evolution"), is not testable in isolation. It is a metaphysical framework: failures are attributed to auxiliary assumptions (e.g., environmental context), insulating the core from falsification. | Natural selection’s core principle is testable as a causal hypothesis. Its empirical content derives from population-genetics formalisms, and consistent predictive success across contexts (e.g., drug resistance evolution) confirms its scientific status. |  
  | **Definition of fitness** | Fitness, if conceptualized as *defined* by reproductive success, reduces "survival of the fittest" to tautology. Non-tautological uses require *prior* independent quantification (e.g., biomechanical efficiency), but such measures are often absent or retrofitted. | Fitness is explicitly *not* defined by reproductive success in population genetics; it is a propensity (e.g., expected reproductive output) measured via independent traits. Testability arises from comparing model predictions (using fitness estimates) to observed allele-frequency changes. |  
  | **Role of Modern Synthesis formalization** | Mathematical models quantify *instances* of selection but do not alter the epistemic status of the core Darwinian principle, which remains a heuristic scaffold. The formalism’s parameters (e.g., fitness) can be manipulated post-hoc to preserve the theory. | The Modern Synthesis elevated natural selection to a testable theory by providing a causal-mathematical framework. Fitness parameters are measurable and predictively robust (e.g., breeder’s equation), rendering Popper’s tautology critique inapplicable. |  

  ---

  #### **Cruxes: Key Sub-Questions and Empirical Tests**  
  Settling these cruxes would resolve core disagreements. Both camps agree the listed cases bear directly on the crux. Predictions reflect each camp’s position.  

  1. **Crux: Operational Independence of Fitness**  
     *Question: Can fitness be quantified independently of reproductive success to avoid tautology?*  
     - **Concrete Case**: *Lenski’s E. coli Long-Term Evolution Experiment*: Predict adaptive trajectories in a novel environment (e.g., citrate metabolism) using fitness assays from *prior* conditions (e.g., growth rate in glucose-only media).  
       - **Camp A Prediction**: Fitness estimates from prior conditions will fail to predict new adaptations (e.g., citrate utilization), revealing fitness as context-dependent and requiring post-hoc redefinition.  
       - **Camp B Prediction**: Prior fitness measures (e.g., mutation rates, pleiotropic effects) will successfully constrain adaptive outcomes (e.g., timing of citrate-evolved mutants), validating fitness as a stable causal parameter.  

  2. **Crux: Impact of Formalization on Testability**  
     *Question: Does population-genetics formalism convert natural selection into a testable causal theory?*  
     - **Concrete Case**: *Testing selection vs. drift in molecular evolution*: Use the McDonald-Kreitman test to compare nonsynonymous (\(d_N\)) and synonymous (\(d_S\)) substitution rates in influenza virus HA1 gene during host-shift events.  
       - **Camp A Prediction**: Elevated \(d_N/d_S\) ratios will be interpreted as "selection" post-hoc, but drift/selection cannot be definitively partitioned; auxiliary factors (e.g., demography) will be invoked to explain anomalies.  
       - **Camp B Prediction**: \(d_N/d_S > 1\) will correlate with functional assays (e.g., binding affinity changes) and predict fixation probabilities, confirming selection as a testable cause.  

  3. **Crux: Falsifiability of the Core Principle**  
     *Question: Can a failure of adaptation falsify natural selection as a general theory?*  
     - **Concrete Case**: *Experimental removal of selection pressure*: In guppy populations, remove predators and track if previously adaptive traits (e.g., cryptic coloration) decay via drift.  
       - **Camp A Prediction**: Trait decay will be attributed to drift or changing "fitness," preserving the core selection principle; no conceivable observation falsifies it.  
       - **Camp B Prediction**: Persistent maladaptation despite heritable variation and fitness costs would falsify natural selection as the primary driver of evolution in this system.  

  ---

  #### **Verbal Dispute Clarification**  
  The camps partially disagree due to *scope ambiguity*:  
  - Camp A critiques natural selection at the **abstract, universal level** (e.g., "selection explains adaptation").  
  - Camp B defends natural selection at the **instantiated, model-based level** (e.g., "selection coefficient \(s > 0\) explains trait spread in population \(P\)").  
  This divergence explains why Camp A sees non-falsifiability where Camp B sees empirical success. Resolving it requires explicit scoping in future work.  

  ---  
  **Signed,**  
  Representatives of Both Camps  
  *[Date and Location of Workshop]*
