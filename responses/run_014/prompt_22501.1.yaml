  The user specifically mentioned avoiding "talking past each other," so the dialogue must have genuine rebuttals. For example, when the causal theorist raises the disjunction problem, the Millikanian should counter with how selection history fixes content, not just current causation. 

  Key technical points to nail:
  - Millikan: Proper function ≠ actual function; it's about evolutionary design.
  - Causal theorist: Disjunction arises because past/future tokenings can't distinguish moon from artificial lights.
  - Both must acknowledge the porch light is causally triggering the representation now, but differ on why that doesn't define content.

  The user's dissertation context means I should avoid oversimplification. For instance, the Millikanian must clarify why selection history overrides present causation, and the causal theorist should explicitly show how "indicator" semantics leads to disjunctions. 

  I'll structure it as a rigorous back-and-forth:
  1. Open with the moth scenario to ground the debate.
  2. Causal theorist presents disjunction problem first (natural entry point).
  3. Millikanian counters with proper function/history.
  4. Causal theorist objects: "But current tokenings can't access history!"
