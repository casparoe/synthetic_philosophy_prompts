prompt: |-
  Write a dialogue between a Millikanian teleosemanticist and a causal theorist who accepts the disjunction problem, each trying to explain whether a moth that has flown into a porch light has a representation with the content "moon" or the content "light." The Millikanian should appeal to proper function and selection history, and the causal theorist should appeal to the actual causal connection and the structure of the disjunction argument. Both characters should be equally competent, and the dialogue should contain real back-and-forth — they should respond to each other's actual points rather than talk past each other. I'm using this for a section of my dissertation, so please keep the technical details (the proper/actual function distinction, why the causal theorist's content comes out as a disjunction rather than a simple property) accurate and not glossed over.
reasoning: |-
