answer: |-
  As a philosopher of mind and decision theorist, I recognize this pattern immediately. It’s a provocative blend of epistemic humility and moral arithmetic that straddles profound conceptual fault lines. Let me carve it precisely.

  ### Brainstormed Neighbors  
  1. **Pascal’s Mugging**: Tiny probability of a threat multiplied by immense claimed stakes, used manipulatively (e.g., "Give me $5 or I’ll destroy 10^100 lives with my powers").  
  2. **Fanaticism Objection**: Critiques of expected utility theory that argue it forces obsession with minuscule-probability/high-stakes outcomes.  
  3. **Clifford’s Principle**: Demands evidence for belief formation, rejecting unjustified credences.  
  4. **Knightian Uncertainty**: Distinguishes measurable "risk" (probabilities) from unmeasurable "uncertainty" (true ignorance).  
  5. **Problem of the Criterion**: When probabilities themselves are disputed, how do we ground them?  

  Your pattern differs critically: It weaponizes **subjective probability over metaphysically untestable claims** (sentience) to leverage **empirical scales** (insect populations). The "one in a million" isn’t derived—it’s a placeholder for ignorance that morphs into action-forcing math.

  ### The Coined Term: **Metaphysical Leverage**  
  **Definition**: *The move to assign a non-zero subjective probability to an empirically unverifiable or untestable state of affairs (e.g., insect sentience), then multiply it by a large but empirically grounded quantity (e.g., insect population), generating an expected value that demands practical priority—despite the probability lacking epistemic warrant beyond avowed ignorance.*  

  ### What It Is vs. What It Isn’t  
  | **Aspect**               | **Metaphysical Leverage**                                  | **Pascal’s Mugging**                         | **Fanaticism Objection**                   |  
  |--------------------------|-----------------------------------------------------------|---------------------------------------------|------------------------------------------|  
  | **Probability Nature**   | Subjective credence masking metaphysical ignorance        | Arbitrary claim (often fabricated)          | Any tiny probability (even measurable)    |  
  | **Stakes Foundation**    | Empirical (e.g., observable insect counts)                | Unfalsifiable assertion (e.g., "I control dimensions") | Often hypothetical (e.g., future sims)    |  
  | **Epistemic Status**     | Unresolvable by evidence (e.g., hard problem of consciousness) | Resolvable in principle (e.g., is mugger lying?) | May be resolvable (e.g., asteroid risk)   |  
  | **Primary Mechanism**    | Laundering uncertainty into expected value                | Extortion via absurd stakes                 | Structural critique of decision theory    |  

  ### Edges and Legitimacy Conditions  
  Metaphysical Leverage **fails** when:  
  1. **Probability is unanchored**: If "one in a million" is purely arbitrary (no constraints from neuroscience, evolutionary biology, etc.), it’s epistemically vacant.  
  2. **Stakes are non-empirical**: The suffering multiplier must be measurable (e.g., insect biomass), not speculative (e.g., "infinite afterlife insects").  
  3. **Alternatives dominate**: If plausible theories *deny* the state (e.g., insects as pure automata), ignoring them violates total evidence requirements.  

  It **might hold** when:  
  1. **Negative evidence is absent**: No strong case *against* the state (e.g., no proof insects *lack* qualia).  
  2. **Probability is constrained**: Credence reflects genuine scientific uncertainty (e.g., debate over insect brain complexity).  
  3. **Decision-theoretic rigor**: We accept strict expected value maximization without probability thresholds (unbounded utility functions).  

  ### Why This Isn’t Just Pascal’s Mugging  
  Pascal’s Mugging relies on *strategic absurdity*—a mugger inventing stakes. Metaphysical Leverage exploits *genuine scale* (real insects) and *philosophical bafflement* (sentience is irreducible to observation). The mugger’s threat is falsifiable; the existence of insect phenomenology is not. This makes Leverage more insidious—it hijacks empirical reality to amplify metaphysical doubt.  

  ### When Does It Tip Into Illegitimacy?  
  The calculation becomes **action-guiding** only if:  
  - The probability is *defeasible* (open to updating with evidence).  
  - The moral weight (e.g., "suffering per sentient insect") isn’t itself speculative.  

  If "one in a million" is a rhetorical shrug—a stand-in for "we can’t know, but let’s pretend"—it launders agnosticism into pseudo-quantification. To escape laundering, the probability must be grounded in comparative frameworks (e.g., "insect cognition shares feature X with sentient mammals, so we assign p=0.0001"). Without this, it’s not reasoning—it’s moral anxiety disguised as math.  

  For your novelist: This pattern is the **crisis of ethics under cosmic scales**. Your character grapples with the terror that ignorance, multiplied by the vastness of existence, might *still* demand everything. That tension—between unbridgeable uncertainty and uncompromising arithmetic—is where philosophy bleeds into narrative. Metaphysical Leverage is the ghost in the machine of utilitarian despair.
