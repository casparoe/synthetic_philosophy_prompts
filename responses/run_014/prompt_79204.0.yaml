  First, I need to map nearby concepts. Pascal's Mugging involves highly speculative threats (like a mugger's Matrix-level threats) with tiny probabilities. The fanaticism objection argues that expected value theory forces focus on worst-case scenarios with tiny probabilities over large-scale goods. But this case is different: the probability isn't of an event but of a metaphysical property (sentience) that's inherently unobservable. It's laundering uncertainty into action-guiding numbers.

