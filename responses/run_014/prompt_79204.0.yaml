  For legitimacy: This works only if (a) the probability is constrained by evidence (e.g., neuroscience hints at insect consciousness), (b) we accept expected value as binding regardless of probability size, and (c) we ignore decision-theoretic fixes like probability thresholds. But it fails when probabilities become "motes of dust" - so small they lose meaning.

