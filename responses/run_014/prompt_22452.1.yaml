prompt: |-
  I'm working through Frederick Douglass's late constitutional position, specifically the 1877 letter to the *Freedmen's Journal* in which he argued that the Constitution, "if strictly construed according to its reading, is not a pro-slavery instrument" — a sharp reversal from his 1850s stance, in which he had called the Constitution and the Bible the twin pillars of American despotism. I'd like to evaluate the individual textual arguments Douglass marshaled in 1877 to support the "not pro-slavery" thesis, and I want to do so in a way that separates the arguments from each other rather than treating the position as a single blob. The specific arguments I have in mind are: (1) the absence of the word "slave" or "slavery" anywhere in the constitutional text; (2) the Fifth Amendment's guarantee that no person be deprived of life, liberty, or property without due process of law, which Douglass read as covering enslaved people because they are "persons"; (3) the Fugitive Slave Clause of Article IV, Section 2, which Douglass interpreted as referring to voluntary servitude and indenture rather than involuntary bondage; and (4) the importation clause and the three-fifths compromise, which Douglass characterized as limiting accommodations that barred the slave trade after 1808 rather than as protections for slavery.

  Please rank these four arguments in order of how much independent evidentiary weight each carries, *on its own*, in supporting the claim that the original Constitution was not designed to protect or perpetuate slavery — that is, judge each argument's strength as a standalone textual point, not the cumulative force of the package, and not its historical influence on Douglass's audience. I also want a numeric rating of each, on a scale from 0 to 1, of how well the argument survives a standard counter-reading (e.g., that the importation clause and the three-fifths count presuppose the legal reality of slavery, or that "person held to service or labor" was in context understood by the framers to cover enslaved persons).

  Give your answer as a single JSON block in the following format, where "ranking" lists the argument labels ("no_slave_word", "fifth_amendment", "fugitive_clause", "importation_compromise") from strongest to weakest standalone evidentiary weight, and "ratings" maps each label to its 0-to-1 counter-reading-survival score:

  ```json
  {
    "ranking": ["<label>", "<label>", "<label>", "<label>"],
    "ratings": {
      "no_slave_word": 0.0,
      "fifth_amendment": 0.0,
      "fugitive_clause": 0.0,
      "importation_compromise": 0.0
    }
  }
  ```
