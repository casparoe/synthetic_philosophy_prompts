  }
  ```

  **Explanation:**  
  - **no_slave_word (0.8):** Strongest standalone argument. The complete textual avoidance of "slave"/"slavery" (using euphemisms like "other Persons") creates genuine ambiguity. Counters (e.g., historical context showing framers meant slaves) weaken but don't eliminate its force as a *textual* point.  
  - **fifth_amendment (0.6):** Potent textual logic ("persons" + "liberty") but vulnerable to counter that "due process" was never intended to apply to slaves. Survives moderately because the plain text *could* encompass enslaved people.  
  - **fugitive_clause (0.2):** Weak standalone. "Person held to Service or Labour" was universally understood in 1787 as including chattel slaves. Douglass's "voluntary servitude" reading contradicts overwhelming historical evidence and contemporary application.  
  - **importation_compromise (0.1):** Weakest. Text explicitly accommodates slavery (e.g., Article I, Section 9 protecting slave trade until 1808; Article I, Section 2 counting slaves as 3/5 persons). Framers debated these *as* slavery protections. Calling them "limitations" is retrospective interpretation, not textual evidence.
