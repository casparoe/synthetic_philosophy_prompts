  Below is a decision tree designed to help intro-level ethics students self-identify positions on incommensurability in "hard choices" (e.g., "law school vs. painting in Lisbon"). It uses everyday cases and probes (small-improvement test, three-option comparisons, coin-flipping) to avoid jargon. The tree has **9 nodes total** (4 internal questions, 5 leaf positions). Internal nodes are phrased as concrete questions, while leaves include minimal jargon (explained in the handout). I've flagged unresolvable views and awkward commitments per your specifications.  

  ### **Decision Tree for Hard Choices**  
  *Start here:*  

  1. **When deciding between two very different options (e.g., law school vs. painting in Lisbon), do you think one *must* be better, worse, or exactly equal?**  
     - **Yes, they must be comparable** → Go to Q2.  
     - **No, they might be "incomparable" (neither better/worse nor equal)** → Go to Q3.  

  ---

  #### **Comparable Path**  
  2. **Suppose law and painting seem equally good. If you add a tiny improvement to law (e.g., a small scholarship), does this *always* make law better than painting?**  
     - **Yes, even a tiny improvement tips the scale** → Go to Q4.  
     - **No, a tiny improvement might *not* make it better** → **Leaf: *Parity View***.  
       *Jargon/commitment:* Believes in a fourth relation ("parity") beyond better/worse/equal. Small improvements don’t resolve some choices.  

  3. **Can law and painting be compared using a *single scale* (e.g., happiness, money, or "points")?**  
     - **Yes, everything reduces to one measure** → **Leaf: *Single-Scale Comparabilist***.  
       *Awkward commitment:* Must accept trade-offs like "giving up a dream for $10 more."  
     - **No, values are too different for one scale** → **Leaf: *Lexical-Priority View***.  
       *Jargon/commitment:* Some values (e.g., justice) always "trump" others (e.g., fun), no matter the amounts.  

  ---

  #### **Incomparable Path**  
  4. **In a hard choice (e.g., law vs. painting), if you flip a coin to decide, is that *irrational*?**  
     - **Yes, it’s irrational—there’s a "right" choice** → **Leaf: *Brute Pluralist***.  
       *Jargon/commitment:* Many irreducible values, but one option is objectively better despite no common scale.  
     - **No, flipping is fine or even wise** → Go to Q5.  

  5. **After choosing (e.g., painting), is it fair to say you *discovered* pre-existing reasons? Or did you *create* reasons by committing?**  
     - **Discovered pre-existing reasons** → **Leaf: *Unnamed View (Ought-Fact Exists)***.  
       *Awkward commitment:* Incomparable options, but mysteriously, one is "what you ought to do."  
     - **Created reasons by committing** → **Leaf: *No-Fact-of-the-Matter View***.  
       *Jargon/commitment:* Your commitment "constitutes" reasons; there’s no truth before you choose.  

  ---

  ### **Key Notes**  
  - **Unresolvable Views**: The tree **cannot separate** *Brute Pluralist* and *Lexical-Priority* views. Both answer "comparable" at Q1 but deny a single scale at Q3. They collapse because lexical priority is a form of brute pluralism with hierarchy. Refining Q3 (e.g., "Do values *always* trump, or just sometimes?") would help, but it’s too coarse here.  
  - **Node Design**:  
    - **Q2 (small-improvement test)** isolates *Parity View* (rejects "equal" if improvements don’t tip scales).  
    - **Q4 (coin-flip test)** separates objectivists (*Brute Pluralist*) from subjectivists (*No-Fact-of-the-Matter*).  
    - **Q5 (commitment probe)** distinguishes discovery ("ought-fact exists") from creation ("constitute reasons").  
  - **Efficiency**: The tree uses **9 nodes** (5 leaves, 4 internal) to cover your 5 requested leaves + 1 unnamed view.  
  - **Jargon Handling**: Leaf labels include ethics jargon for your reference (define in the handout), but internal nodes use plain language.  

  ### **Tree Summary**  
  ```mermaid
  graph TD
    Q1[Q1: Must options be comparable?] -->|Yes| Q2
    Q1 -->|No| Q3
    Q2[Q2: Does tiny improvement *always* tip the scale?] -->|Yes| Q4
    Q2 -->|No| LeafA[Leaf: Parity View]
    Q3[Q3: Comparable on one scale?] -->|Yes| LeafB[Leaf: Single-Scale Comparabilist]
    Q3 -->|No| LeafC[Leaf: Lexical-Priority View]
    Q4[Q4: Is coin-flipping irrational?] -->|Yes| LeafD[Leaf: Brute Pluralist]
    Q4 -->|No| Q5
    Q5[Q5: Reasons discovered or created?] -->|Discovered| LeafE[Leaf: Unnamed - Ought-Fact Exists]
    Q5 -->|Created| LeafF[Leaf: No-Fact-of-the-Matter]
  ```  

  This tree works for intro students because:  
  1. It mirrors real dilemmas (e.g., adding a "small scholarship" to law school).  
  2. Probes like coin-flipping make abstract ideas tangible.  
  3. Leaves flag awkward commitments (e.g., single-scale trade-offs feel cold; no-fact-of-the-matter feels arbitrary).  
  4. The unresolvable *Brute Pluralist/Lexical-Priority* overlap is honest and teachable.  

  Let me know if you’d like adjustments (e.g., more cases, restructuring probes)!
