  ## Eulogy for a Presentist Father

  **(Speak warmly, with a touch of quiet strength, acknowledging the shared grief in the room)**

  Good morning. Thank you for being present here, right now. For my father, that word, "present," wasn't just about showing up. It was the core of how he saw everything. He believed, deeply and passionately, that *only* this moment – this breath, this shared silence, this feeling in our chests – truly exists. The past? To him, it wasn't a vault we could revisit; it was gone. The future? Not yet real. All we ever truly have, he’d remind us with that gentle, unwavering conviction, is *now*.

  He’d often say it over dinner, maybe with a twinkle in his eye, especially if I’d just finished describing some intricate historical scene I was writing. You see, I spend my days immersed in the past, conjuring worlds long gone onto the page – a fact Dad found endlessly, wonderfully amusing. For thirty years, it was our running joke. He’d raise an eyebrow, a small smile playing on his lips. “Still digging around in those non-existent trenches, are you?” he’d tease. “Building castles on foundations of thin air?” And I’d defend my nonexistent kingdoms with equal warmth. It wasn’t disagreement, not really. It was our dance – the eternalist novelist son and the presentist philosopher father, meeting right there, *at the table*, in the shared laughter, the clinking of cutlery, the warmth of the *present* moment where our love lived.

  And that’s where he found his truth, and perhaps, where we can find our comfort today. Dad wouldn’t want us to pretend the past is a tangible place where he still resides. He’d gently, insistently, bring us back to what *is* real.

  What’s real right now is the love in this room. It’s palpable. It’s the warmth on your skin, the weight of the person next to you, the collective breath we draw. It’s the ache we feel – because that ache *is* present, it *is* real. It’s the profound impact of who he was, resonating within each of us, *right now*. We aren't remembering a ghost; we are living, *now*, with the indelible shape his presence carved onto our present selves.

  His philosophy wasn't cold; it was intensely alive. It was an invitation to truly *be* here. To feel the sun, to listen deeply, to engage fully with the person in front of you. To let go of regrets about what's vanished and anxieties about what's not yet formed. To inhabit the rich, complex, sometimes painful, reality of *this* moment.

  So, how do we honor a man who insisted only the present is real? We honor him by doing what he spent his life teaching: by being truly present, right now.

  *   Be present with this grief. Don't try to push it into the past or wish it into the future. Let it be what it is, *now*. Feel its weight, acknowledge its sting. It’s real because we feel it *now*.
  *   Be present with each other. Look around. See the faces here. Feel the shared humanity, the shared loss, the shared love that brought us together. Offer a hand, a touch, a look that says, "I see you, here, now."
  *   Be present with the love you feel for him. That love isn't a relic. It's a living force inside you, *right now*. It’s the echo of his voice in your mind *this instant*, the warmth of his character shaping your reaction to something happening *today*. That love exists. It’s actively here.

  Dad wouldn’t say he lives on in the past. But the man he was, the teacher, the thinker, the father, the husband, the friend – he shaped the *present*. He shaped *us*, who are here now. He shaped how we think, how we argue (often about time!), how we love, and how we strive to be present ourselves.

  The great joke between us – the novelist son lost in time and the philosopher father anchored only in the now – finds its resolution, perhaps, in this moment. Because here we are, together, in the only place he ever believed truly existed: this shared, fragile, powerful *now*. And in this *now*, the love we feel for him isn't a memory of something lost; it's a vibrant, present reality. It’s the deepest comfort we have.

  So, let’s honor him by being here. Fully. For each other. For the quiet. For the ache. For the love that persists, vibrantly and undeniably, in this very moment. That’s where he would want us to be. That’s where his truth lives. Right here. Right now.

  Thank you.
