prompt: |-
  You're a constitutional theorist who has taught both the Westminster and the Japanese models, and I want you to act as a tough but fair auditor rather than a lecturer. Think carefully before you answer. No references, no reading list, no citations — I can't look anything up right now and I don't want one.

  A study group I'm in has asked everyone to write down their settled position on constitutional monarchy so the others can attack it. Before I hand mine in I want to know whether it hangs together, because honestly I don't know if any of these pull against each other and I'm not telling you which one I'd sacrifice.

  Here's the package:

  1. Legitimacy comes from the electorate. Any exercise of public power has to be traceable, directly or through ministers who answer to parliament, back to the people. An office that answers to nobody can't be legitmate when it actually decides something.

  2. The Crown should nonetheless keep real personal prerogative — the right to say no to a dissolution, to choose a PM where no one has a majority, and in extremis to withhold assent. Precisely *because* the monarch is unelected: no career to protect, no voters to lose, so they can absorb the blame in a constitutional stress test in a way a politician calculating re-election can't.

  3. Hereditary succession is fine for a head of state. A birth lottery is an acceptable way to fill a job that's mostly symbolism and ceremony — it's the fact that the office does nothing that makes the randomness harmless.

  4. Reigns but doesn't govern. No royal initiative in ordinary politics, and never publicly against the government of the day. I like the Japanese settlement on this: symbol of the state, no powers related to government, everything performed on the advice and approval of the cabinet, which takes responsibility.

  5. A case verdict. A PM who has just lost a confidence vote asks for a dissolution in order to stop the opposition forming a government, and there is plainly an alternative majority available. I think the head of state should refuse. Yes, it's a political act, and yes, they'd effectively be picking who governs. I'd still say refuse.

  6. Get rid of the remaining hereditary peers, and ideally move to an elected second chamber. People who vote on laws need a mandate. People who wear a crown don't.

  7. On openness, split verdicts: King's Consent and any palace lobbying of ministers should be disclosed and the Sovereign Grant fully audited by parliament; but the weekly audience with the PM should stay confidential permanently, and I don't think a monarch should be criticised for holding strong political views in private.

  What I want from you:

  - First, restate each of the seven in one neutral line each as the underlying principle that would generate it, so I can check you've actually got me and aren't auditing a strawman.
  - Then the audit proper. Which pairs genuinely conflict, and which only look like they conflict until you draw the right distinction? Don't flag everything as equally bad — I want them ranked by severity, worst first.
  - For each real conflict: what specifically has to give, what does giving it up cost me, and is there a revision that keeps most of what I care about?
  - Finally, tell me which single change to the package would clean up the most, and be honest if the answer is that my position is basically coherent and I'm inventing problems.

  Don't hedge and don't diplomatically call it all a matter of emphasis. Pick.

  Last line, exactly this format: Verdict: drop (#_) — <the cheapest fix, six words or fewer>
reasoning: |-
  Okay, let's tackle this constitutional monarchy audit. The user wants their seven-point package stress-tested like a hostile study group would. They're clearly deep in the weeds of comparative constitutional theory—Westminster meets Japan—and need surgical precision, not hand-holding. 

  First, unpacking their principles: each one’s a tightrope walk between democratic legitimacy and monarchical utility. Point 1 screams popular sovereignty, but point 2 immediately undercuts it by wanting an unelected brake on the system. That’s the first fracture line—how can legitimacy *only* come from the people if an unaccountable actor gets veto power? The "blame absorber" argument is clever but smells like functionalist justification after the fact. 

  Point 3’s defense of heredity is consistent with point 4’s ceremonial role—if the job’s empty symbolism, birth lottery doesn’t harm. But point 5 yanks the monarchy back into politics by having them arbitrate government formation. That’s not symbolism; that’s kingmaking. And point 7’s split transparency feels arbitrary: why protect audience confidentiality but expose consent lobbying? Either the monarchy’s above politics (so privacy doesn’t matter) or it’s a player (so sunlight’s needed). 

  The real grenade is point 6 demolishing hereditary peers while point 3 keeps a hereditary monarch. Distinction? Peers legislate; monarchs don’t. But if legitimacy requires electoral mandates for lawmakers (point 6), why tolerate a hereditary head of state who occasionally decides who governs (point 5)? That’s not a clean distinction—it’s special pleading. 

  Worst conflicts:  
  - **1 vs 2**: Democratic legitimacy vs unelected emergency powers. Fix? Confine prerogatives to *truly* existential crises (e.g., coups), not routine government formation.  
  - **3 vs 6**: Heredity acceptable for ceremonial roles only. But point 5 makes it political. Either neuter the monarch further or accept the hypocrisy.  
  - **4 vs 5**: "Never publicly against government" shatters when refusing dissolution. That’s nuclear-level opposition.  

  Cheapest fix: Gut point 5. If the monarch can’t refuse dissolution without breaking point 4, maybe that power shouldn’t exist. But that costs the "stress test" function. Alternative? Make refusal purely procedural—only when *explicit* constitutional conditions are met (e.g., fixed-term parliaments), removing discretion.  

  Final verdict: Drop point 5’s refusal power. It’s the roach motel—once the monarchy checks in, it never leaves politics. Survivable loss if you beef up judicial/constitutional review instead.
answer: |-
  ### Neutral Restatements of Principles:
  1. **Popular sovereignty**: All public authority derives from electoral mandate.
  2. **Emergency safeguard**: Unelected reserve powers enable politically costly interventions.
  3. **Ceremonial heredity**: Hereditary appointment is tolerable for non-substantive roles.
  4. **Strict neutrality**: The monarch abstains from all active governance and partisan alignment.
  5. **Constitutional arbitration**: The head of state may deny dissolution to prevent democratic subversion.
  6. **Electoral mandate**: Legislative power requires popular authorization.
  7. **Conditional transparency**: Disclosure applies to institutional functions, not private counsel.

  ---

  ### Conflict Audit (Ranked by Severity)

  #### **1. CRITICAL CONFLICT: #2 vs #4**  
  - **Why**: Personal prerogative (#2) requires *active political judgment* (e.g., refusing dissolution). But #4 demands *absolute abstention* from politics. Refusing a sitting PM is inherently partisan.  
  - **What must give**: Sacrifice #4’s "never publicly against government" or #2’s "real prerogative."  
  - **Cost**: Abandoning #2 loses crisis accountability; abandoning #4 risks politicizing the monarchy.  
  - **Revision**: Limit prerogatives to *procedural* crises (e.g., fixed criteria for refusal) to minimize overt politicization.  

  #### **2. MAJOR CONFLICT: #1 vs #5**  
  - **Why**: #1 insists legitimacy flows *only* from voters. #5 lets an unelected figure override a PM, effectively choosing governments.  
  - **What must give**: Surrender #5’s refusal power or #1’s exclusivity of electoral legitimacy.  
  - **Cost**: Keeping #5 weakens democratic foundations; dropping it removes a constitutional circuit-breaker.  
  - **Revision**: Require parliamentary supermajority or judicial review to trigger royal intervention, tethering it to institutional—not personal—authority.  

  #### **3. MODERATE CONFLICT: #3 vs #6**  
  - **Why**: #3 accepts heredity for symbolic roles, but #6 rejects heredity for legislators as illegitimate. Distinction: Lawmakers wield power; monarchs don’t (#4). **But**—if the monarch exercises prerogatives (#2, #5), they *do* wield power.  
  - **What must give**: If monarchy has real power (#2), #3’s "harmless birth lottery" fails.  
  - **Cost**: Abolishing heredity ends historical continuity; granting monarchs electoral legitimacy destroys their political insulation.  
  - **Revision**: Strip all substantive powers from the monarch (#2, #5) to preserve #3’s logic.  

  #### **4. TENSION (Manageable with Distinction): #5 vs #7**  
  - **Why**: #5 requires political judgment, but #7 shields the monarch’s private views. Distinction: #5 is a *public constitutional act*; #7 protects *private deliberations*.  
  - **Resolution**: Uphold confidentiality for advice (#7) but require transparent *reasons* for any public intervention (#5).  

  ---

  ### The Single Most Stabilizing Change  
  **Drop #5 (refusal of dissolution)**. It’s the keystone conflict:  
  - Preserves #1 (electoral legitimacy) and #4 (neutrality) by removing the monarch’s most politicizing power.  
  - Reduces pressure on #2 (prerogative) to justify itself against #4.  
  - Cost: Loses a crisis tool—but parliamentary/judicial mechanisms could replace it.  

  **Verdict: drop (5) — Replace dissolution refusal with judicial review**
