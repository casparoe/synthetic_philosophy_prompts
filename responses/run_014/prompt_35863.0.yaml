prompt: |-
  I write a column on science and ideas, and a longtime source of mine — call him Daniel, a mathematician who thinks a great deal about Hofstadter's old superrationality pieces, the Platonia dilemma and the Luring Lottery — has a track record on cooperation cases that I have never managed to pin to a single principle. In a one-shot prisoner's dilemma with a total stranger about whom he knows nothing, he defects. In a one-shot dilemma with a close friend, after the two of them have talked the problem through and converged on a view, he cooperates. He votes in national elections even when the chance of his vote being pivotal is negligible, and he calls the expected-value argument for abstaining a mistake. And in a lottery he actually plays with nineteen equally reflective friends — each privately names a positive integer, and if all twenty name the same number, each receives a million dollars divided by that number, while if even one person diverges nobody gets anything — he names 1 without hesitation. Next week we meet to discuss two new cases, and I would like to walk in with a prediction. Case one: a one-shot dilemma with a stranger who, he happens to know, has read all the same rationality literature he has, though he has no idea whether she acts on it. Case two: an election in which, by every poll, the voters whose reasoning most closely mirrors Daniel's overwhelmingly support the other candidate, while the people who share his values but reason in a completely different style support his. What will he say about each? I am less interested in the answers than in the principle he seems to be running — superrationality, an evidential treatment of his own choices, team-reasoning keyed to shared values, or something else — and in which rival principles fit his record just as well. Please take a definite position: name the principle you would bet on, explain why it beats the alternatives on his record, and tell me what further case would best discriminate between the contenders.
reasoning: |-
  Okay, let me try to figure out what's going on with Daniel. The user is a science columnist who's been observing this mathematician Daniel for a while. Daniel has some really interesting but seemingly inconsistent behaviors across different cooperation scenarios. 

  First, I need to unpack Daniel's track record. In a one-shot prisoner's dilemma with a total stranger, he defects. But with a close friend after discussion, he cooperates. He votes even when his vote has almost no chance of mattering, rejecting the expected-value argument. And in that weird lottery with his 20 reflective friends, he names "1" immediately. 

  Hmm... now the user wants to predict Daniel's behavior in two new cases: (1) prisoner's dilemma with a stranger who's read the same rationality literature, and (2) an election where people who think like him support the opponent. But more importantly, the user wants the underlying principle behind all this - superrationality? Evidential decision theory? Team reasoning?

  Let me examine how different theories would explain Daniel's behaviors. Superrationality (Hofstadter) would say he cooperates in PD if he assumes symmetry with the opponent. But that doesn't fit - he defects against strangers. EDT would have him consider evidence about his choice affecting others, but that would make him cooperate with strangers too. 

  Team reasoning seems promising. In the friend PD case, they form a team. Voting might be team-oriented toward democracy. The lottery is clearest - naming "1" is the uniquely optimal team choice. But why defect against strangers then? Ah, because no shared identity. 

  For the new cases: with rationality-literature stranger, he might see potential team membership and cooperate. In the election, he might still vote if he identifies with "democracy" team, even if policy-focused peers disagree. 

  What would falsify this? A case where team identity is possible but he acts selfishly. Like if the lottery had strangers instead of friends - would he still name "1"? Probably not. 

  The user seems really sophisticated - they've clearly thought hard about decision theory. I should be precise. Team reasoning feels right because it explains: defection (no team), friend cooperation (team formed), voting (civic team), lottery (explicit team). Alternatives have holes. 

  Better address why not Kantian/EDT/superrationality directly too. And suggest that lottery-with-strangers test case. The user will appreciate concrete falsification.
answer: |-
  Based on Daniel's track record and the coherence of his actions under a single framework, I'd bet **he operates on a principle of Kantian Team Reasoning keyed to shared epistemic frameworks and cooperative intent**. This isn't classic Hofstadterian superrationality or pure Evidential Decision Theory (EDT), but a refined version of team reasoning where shared *reasoning methods* and *mutual recognition of cooperative potential* define the "team." Here's the breakdown:

  1.  **The Principle Explained:** Daniel acts as if he's part of a "team" only when he believes:
      *   **Shared Epistemic Framework:** The other agent(s) are likely reasoning about the problem using similar principles, concepts, or literature (e.g., game theory, rationality, cooperation dilemmas).
      *   **Mutually Recognized Cooperative Intent:** There is a basis to believe the other agent(s) *also* see the possibility of mutually beneficial cooperation and are reasoning about how to achieve it *in the same way* he is.
      *   **The "Kantian" Element:** He chooses the action that, if universally adopted by *all members of this perceived team*, would yield the best collective outcome for the team. He acts on the principle he would will everyone in the team to follow.

  2.  **Why it Beats the Alternatives on His Record:**
      *   **One-Shot PD with Stranger (Defect):** No shared epistemic framework or mutual recognition. He assumes the stranger reasons differently (likely selfishly). No "team" exists, so individual rationality (defect) prevails.
      *   **One-Shot PD with Friend after Discussion (Cooperate):** The discussion establishes a *shared epistemic framework* ("we've converged on a view") and *explicit mutual recognition* of the cooperative intent and reasoning path. They form a "team of two." The Kantian team reasoning principle: "If we both cooperate, we both do well; this is the principle we've agreed upon." He cooperates.
      *   **Voting (Cooperate):** He identifies with the "team" of democratic citizens who value participation. The shared epistemic framework is civic/political rationality (even if flawed). The Kantian principle: "If everyone who shares my civic values/understanding *voted*, outcomes would better reflect the will of the people like us." Abstaining would violate this civic duty principle for the team. The negligible pivotality is irrelevant; he's fulfilling his role within the cooperative civic enterprise.
      *   **Luring Lottery (Name 1):** The team is explicitly defined: "twenty equally reflective friends." They share a powerful epistemic framework (mathematical reflection, game theory). Naming 1 is the *only* choice where, if universally adopted by the team ("name 1"), the collective payoff is maximized (each gets $1M). Any other number introduces coordination risk for no gain. The Kantian principle is clear: "Will that all members of the team name 1."

  3.  **Predictions for New Cases:**
      *   **Case 1 (PD with Rationality-Literate Stranger): He Cooperates.**
          *   *Reasoning:* The shared knowledge of the rationality literature creates a *potential* shared epistemic framework. He doesn't know if she *acts* on it, but her knowledge *creates the possibility* of mutual recognition. He reasons: "If we *both* recognize we've read the same stuff, and *both* apply its cooperative insights (like Kantian team reasoning), we can achieve mutual benefit. I will cooperate on the principle that I will her to cooperate for our mutual gain." He acts *as if* a team *might* be formed based on this shared background, making cooperation the Kantian team choice.
      *   **Case 2 (Election with Mismatched Reasoning): He Votes (for his candidate).**
          *   *Reasoning:* His primary "team" identity here is likely the *civic team* (as in his general voting behavior), not the smaller team defined by identical reasoning style. The shared values (policy goals) are the anchor. While the reasoning-style peers disagree, the value-aligned peers support his candidate. The Kantian principle: "Citizens who share my core values should vote for the candidate advancing those values." His reasoning style might make him *pessimistic* about winning, but it doesn't dissolve his perceived duty to the civic team defined by shared values. He fulfills his role.

  4.  **Why Alternatives Don't Fit as Well:**
      *   **Pure Hofstadterian Superrationality:** Predicts cooperation in symmetric PDs (like Case 1) and *maybe* the friend PD. Fails utterly on voting (abstention is the superrational "fixed point" in large elections) and *might* suggest naming a higher number (like 20) in the lottery as the "obvious" symmetric choice, not 1. It doesn't handle the friend/stranger distinction cleanly without the team formation element.
      *   **Pure Evidential Decision Theory (EDT):** Would likely predict cooperation in *all* PDs (since my cooperation is evidence the other might cooperate) and voting (my voting is evidence others vote). It fails to explain defection against the stranger and struggles with the lottery – naming 1 isn't uniquely evidentially dominant. It doesn't capture the importance of the explicit team formation in the friend PD or lottery.
      *   **Simple Shared-Values Team Reasoning:** Explains voting and the friend PD (shared values). Fails on the PD with the stranger (no shared values implied) and struggles with the lottery – shared values alone don't dictate naming 1; shared reasoning about optimal coordination does. Doesn't cleanly explain defection against the stranger.
      *   **Causal Decision Theory (CDT) / Individual Rationality:** Explains defection against the stranger. Fails completely on cooperation with the friend, voting, and naming 1 in the lottery.

  5.  **Crucial Discriminating Case:** **The Lottery with Strangers.**
      *   *Scenario:* Daniel participates in a "Luring Lottery" *not* with 19 reflective friends, but with 19 *complete strangers* about whom he knows absolutely nothing. Rules are identical: name a positive integer; all same number wins $1M / number; any mismatch, nothing.
      *   *Prediction under Kantian Team Reasoning Keyed to Epistemic Framework:* **He names a large number (e.g., 20), not 1.**
          *   *Reasoning:* There is no basis to form a "team" with these strangers. No shared epistemic framework or potential for mutual recognition of cooperation. Individual rationality dominates: naming 1 risks getting almost nothing if others name higher numbers; naming a large number offers a huge payoff *if* by chance everyone picks it, though he knows coordination is astronomically unlikely. He might pick 20 as a focal point, but he *won't* pick 1 because the team reasoning imperative ("name 1 is the uniquely optimal team action") is absent.
      *   *How it Discriminates:*
          *   Pure Superrationality: Might still predict naming 1 as the "obvious" symmetric choice.
          *   EDT: Unclear prediction, but naming 1 isn't evidentially favored.
          *   Shared-Values Team Reasoning: No shared values, so predicts large number.
          *   CDT: Predicts large number.
      *   A result of him naming a large number strongly confirms Kantian Team Reasoning (with its dependence on shared epistemic context) over pure superrationality. Him naming 1 would be a major surprise and point strongly towards pure superrationality ignoring identity.

  **Conclusion:** Daniel's principle is **Kantian Team Reasoning activated by perceived shared epistemic frameworks and the potential for mutual recognition of cooperative intent.** This explains his sensitivity to context (friend vs. stranger), his civic duty voting, and his decisive "1" in the friend lottery. It predicts cooperation in Case 1 (rationality-literate stranger enables perceived team formation) and voting in Case 2 (civic team identity based on shared values overrides reasoning-style differences). The "Lottery with Strangers" case is the best discriminator. When you meet him, watch for language about "what we both understand," "the principle we should both follow," or "our duty as participants" – these are hallmarks of this principle in action. Good luck!
