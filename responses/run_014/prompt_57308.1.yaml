  - We'll have the same unpleasant task (ice cube hold) and offer $3 (more than Round 1) for forming the genuine intention at T1.
  - But now, the intention is not self-reported. Instead, the group votes on whether they think each participant has formed the genuine intention.
  - Process:
    1. Each participant who wants to try for the money must stand up and make a statement to the group: "I genuinely intend to hold the ice cube at T2." They can say it in their own words, but must convey that they intend to do the task.
