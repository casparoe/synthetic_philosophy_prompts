  We are going to design a live-action version of Kavka's toxin puzzle for a group of 8-10 people. The core challenge is to create a scenario in which participants are offered money for forming a genuine intention to perform an unpleasant task later, without actually having to perform it, and then see if they can form the intention without any intention to perform the task.

  Key elements to capture:
  1. The reward is for forming the intention at time T1 (now) to do an act at T2 (later).
  2. The act at T2 is costly (unpleasant) and there's no reason to do it once T1 has passed and the reward is secured.
  3. The problem: How can one form a genuine intention to do something at T2 when one knows that at T2 there will be no reason to do it?

  We'll run multiple rounds with variations to explore different aspects.

  Constraints:
  - Time: 2 hours (120 minutes)
  - Group: 8-10 people
  - Materials: Paper, pens, phone timer, jar of coins, about $40 in real money, snacks.

  Structure:
  We'll have 3 rounds (maybe a bonus round if time allows). Each round will have:
  - A setup phase (explaining rules and roles)
  - An intention formation phase (where participants decide and are "scanned" for intention)
  - A waiting period (to simulate the passage of time until T2)
  - An action phase (where they must choose to do the unpleasant task or not)
  - Payout

  Important: We need a mechanism to "scan" for intention. Since we don't have a real brain scanner, we'll use one of two methods:
  1. Self-report (with honesty assumed, but with the caveat that if they are lying they are not really forming the intention)
  2. Group vote (to introduce social pressure and the possibility of bluffing)

  We'll use real money to make the stakes tangible. However, note that the amounts must be small enough to fit within $40 but meaningful enough to care about (e.g., $1, $2, $5).

