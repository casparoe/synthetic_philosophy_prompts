  Debrief:
  - This round introduces social dynamics: bluffing, reading others, etc. Ask: How did it feel to try to convince the group? How did it feel to vote? Did the group accurately detect genuine intentions? Note that even if they bluffed and got the money, they still didn't have to do the task.

  Bonus Round: Intending to Intend (if time and interest)
