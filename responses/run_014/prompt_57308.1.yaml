  - The twist: They are paid for forming the intention at T1 to make this public commitment at T2. But at T2, they can skip without penalty. However, because they have publicly stated their intention (in the group vote round?) or because they made a public declaration? We haven't done that.

  Alternatively, in the bonus round, we have them write down their intention and then put it in a sealed envelope. Then at T2, if they do the task, they get the envelope back and can destroy it. If they skip, we open the envelope and read it aloud? But that might be too coercive.

  We'll skip the bonus if time is short.

  Overall Timing:
  - Introduction: 5 minutes
  - Round 1: 35 minutes (5 min setup, 5 min intention phase, 30 min wait, then 5 min action phase and record)
  - Round 2: 35 minutes (same structure, but note: T2 task is required for Round 3 eligibility, so we must do Round 3 after Round 2's task? Actually, we can do Round 2 and then immediately after the task, start Round 3 with a new T2. But note the wait time: we don't want 30 minutes for each round because that would be 90 minutes just waiting.

  Adjustment: We can make the waiting time shorter? Like 10 minutes per round? We have 2 hours. Let's do:

  - Round 1: 20 min total (5 setup, 5 intention, 10 wait, then 5 action and record)
  - Round 2: 20 min total (same)
  - Round 3: 20 min (same, but the group vote might take longer, so 5 setup, 10 for the statements and votes (for 10 people, each speaks for 30 seconds, then vote for all at once? We can do one by one), then 10 min wait, then 5 action)

  But then we have 60 minutes. Then debrief for 20 minutes.

  Alternatively, we can run the rounds without overlapping, but with shorter waits? 10 minutes is enough to let the paradox sink in.

  Let's set the wait time to 10 minutes per round.

  Detailed Schedule:

  Total: 120 minutes

  - Introduction (5 min): Explain the overall concept and the three rounds. Emphasize that they should be honest about their intentions because the point is to explore a puzzle.

  Round 1: The Basic Toxin (10 min wait)
  - Setup (2 min): Explain the task (hold ice cube for 60 seconds at T2, which is 10 minutes from now). The offer: $2 for forming a genuine intention to do it. They don't have to do it at T2 to keep the money.
