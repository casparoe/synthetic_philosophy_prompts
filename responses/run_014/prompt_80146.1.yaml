  The user’s friends represent two extremes: one says day 15 is definitely not them (all-or-nothing), the other says it definitely is (no loss by degrees). The real disagreement might be about whether identity is binary or continuous. The first friend probably thinks identity requires the original physical brain, while the other focuses on psychological continuity regardless of physicality.

