  Summing up: 0.15 + 0.56 + 0.015 = 0.725. So 72.5% that day 15 is "you." 

  The least confident term? P(threshold at day 15) under gradational. What’s the threshold? It's arbitrary. If evidence shows that certain neural structures are crucial for identity, that could shift the probability. 

