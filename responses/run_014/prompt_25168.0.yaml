prompt: |-
  In my cultural evolution seminar, we have been working through the claim that culture evolves by a genuinely Darwinian process. The core analogy, as presented in the literature, runs as follows: ideas, practices, and artifacts — memes — vary, are selected by human minds and social environments, and are retained through imitation and transmission, just as organisms evolve through variation, selection, and retention of genes. This analogy is used to license a strong conclusion: that we can model cultural change with the same formal tools used in population genetics and evolutionary biology (fitness landscapes, selection coefficients, drift models), and that complex cultural products like legal systems, religions, and technologies are best explained as the cumulative products of blind variation and selective retention rather than intentional design.

  I would like you to audit this analogy. First, give me a table of correspondences: what plays the role of the gene, the organism, the phenotype, the environment, the generation, mutation, recombination, and drift? Second, identify where the mapping breaks down. Which disanalogies are merely cosmetic, and which matter for the intended use — namely, the claim that culture is a Darwinian process in a strong enough sense to borrow evolutionary biology's modeling toolkit? Third, tell me whether the conclusion survives once the disanalogies are on the table, or whether the analogy was carrying more weight than it can bear. If the analogy fails in important respects, is there a better one? Please keep your answer to at most 400 words.
reasoning: |-
  Okay, the user is in a cultural evolution seminar and wants me to audit the analogy between cultural and biological evolution. They specifically want a table of correspondences, identification of where the mapping breaks down, and an evaluation of whether the conclusion holds. 

  Hmm, this is a sophisticated request from someone clearly deep in theoretical debates. The user seems frustrated with how casually the meme analogy gets applied. They're hinting that the "strong conclusion" about blind Darwinian processes might be overreaching. 

  First, I need to map the core components carefully. Genes → memes makes sense, but "organism" is tricky since humans both host and select memes. Phenotype gets messy too - is it the meme's expression or the hosting society? The table will show these tensions immediately. 

  The breakdown points matter more. Mutation isn't random in culture (people tweak ideas purposefully). Recombination is guided by logic, not chance. Worst is the "blind variation" claim - legal systems clearly involve design! These aren't cosmetic flaws; they gut the neutrality premise of population genetics models. 

  I'm noticing the user cares about modeling legitimacy. The disanalogies aren't just academic - they mean we can't naively copy equations from genetics. But maybe the analogy still works weakly? Like scaffolding we later remove? 

  Nah, the conclusion overreaches. The "cumulative products = blind selection" claim collapses when innovation is intentional. Still... maybe a "design with selection" model (like Boyd and Richerson's dual inheritance) would satisfy the user's need for rigor without denying human agency. 

  Word count is tight. Must prioritize the lethal disanalogies over minor ones. User will care most about whether formal tools transfer, so I'll hammer mutation/selection intentionality. Table first, then surgical breakdown. 

  ...Done. Hope the "better analogy" suggestion lands - it concedes the flaw but offers what they might actually need for their seminar arguments.
answer: |-
  ### Correspondence Table  
  | Biological Component | Cultural Analog |  
  |----------------------|----------------|  
  | Gene                 | Meme (idea, practice, artifact) |  
  | Organism             | Human/host group |  
  | Phenotype            | Expressed behavior/product |  
  | Environment          | Social/cognitive context |  
  | Generation           | Transmission event |  
  | Mutation             | Imperfect copying/innovation |  
  | Recombination        | Blending of ideas |  
  | Drift                | Random loss/adoption |  

  ### Key Disanalogies & Significance  
  1. **Intentionality vs. Blind Variation**:  
     - Cultural "mutations" are often guided (e.g., innovation by design), unlike genetic randomness. **Fatal for "blind" cumulative claims**.  
  2. **Lamarckian Inheritance**:  
     - Acquired modifications (e.g., improved tech) are transmitted. **Undermines strict "selection-only" models**.  
  3. **Recombination Logic**:  
     - Memes blend via logic/utility, not random assortment. **Challenges neutrality assumptions in drift models**.  
  4. **Unit Definition**:  
     - Memes lack discrete, stable units (e.g., "democracy" vs. gene). **Problematic for fitness coefficients**.  
  5. **Selection Hierarchy**:  
     - Group/individual selection conflicts (e.g., altruism memes). **Complicates selective environments**.  

  ### Conclusion & Alternatives  
  - **Conclusion Fails**: The analogy cannot bear the weight of justifying *identical* formal tools. Intentionality and Lamarckism disrupt core Darwinian prerequisites (blind variation, selection-only).  
  - **Surviving Core**: Differential selection/retention *exists* but operates alongside cognitive design (e.g., Boyd & Richerson's models).  
  - **Better Analogy**: **Culturally Attuned Evolutionary Models** (e.g., gene-culture coevolution) that incorporate:  
    - Biased transmission (content-based preference),  
    - Guided variation (intentional innovation),  
    - Institutional evolution (structured selection).  

  **Verdict**: Memetics oversimplifies; cultural change is Darwinian-*like* but requires augmented models acknowledging human agency.
