prompt: |-
  Having read rationalist blogs and forums for the better part of a decade, I have internalized the habit of dissolving confused concepts into operations, and I now need that habit made usable for others. I lead assessment design for a software apprenticeship that admits about twenty career-changers from several hundred applicants every six weeks. The stakes are livelihoods and cohort quality, and my assessors are working engineers with no training in psychometrics who have at most twenty minutes to vet a proposed task before our program director signs off on it.

  My problem is that our tasks all claim to select for intelligence, but they mean incompatible things by it: on one hand, accumulated knowledge and practiced skill; on the other, speed and efficiency in acquiring new skills when the environment is novel and uncertain; on still another, a bundle of largely independent aptitudes rather than one thing. I am also worried about Goodhart effects from coaching and from unrestricted use of AI assistants. I want you to translate that philosophical disagreement into a reusable vetting procedure that non-specialists can actually run.

  Give me a stepwise procedure, flowchart in words, with questions to ask in order about any proposed assessment task, what counts as passing each step, where a task fails outright, and where the procedure must defer to human judgment because the issue is normative or empirically underdetermined. The procedure must preserve the distinctions that matter most — between difficulty and novelty, between transfer near and far, between learning quickly from few examples and performing well after extensive practice, and between generality across goals and narrow optimization — while dropping whatever cannot be checked in twenty minutes. Mark explicitly the points where judgment cannot be eliminated and the kinds of tasks where you expect the procedure to misfire.

  Then demonstrate the procedure on these three candidate tasks we are actually considering:

  Task A, Alien Spreadsheet: 45 minutes, no internet, candidates may consult documentation for a fictional data-transformation language with twelve unfamiliar operators, then must clean a messy dataset containing edge cases not covered in the examples.

  Task B, Familiar Build: 48-hour take-home, open internet and AI tools allowed, to build a standard to-do application with login and persistence, graded on completeness, code organization, and polish.

  Task C, Broken Pipeline: 90-minute live exercise in a deliberately obfuscated and invented build system where half the files are irrelevant and several error messages point to the wrong cause, graded on diagnosing the root failure and getting a minimal deployment working.

  Show your work for each, include at least one verdict my team will dislike and explain why the procedure requires it, and close with a short statement of what the procedure cannot do and what it should never be used to justify.
reasoning: |-
  We are designing a vetting procedure for assessment tasks that claims to select for "intelligence". The procedure must be usable by non-specialists (software engineers) in under 20 minutes per task. We need to preserve key distinctions and avoid Goodharting.

  Key distinctions to preserve:
  1. Difficulty vs. novelty: Difficulty is about how hard the task is given the skills and knowledge required. Novelty is about encountering something new and unfamiliar.
  2. Transfer near vs. far: Near transfer is applying knowledge to similar situations, far transfer to very different ones.
  3. Learning quickly from few examples vs. performing well after extensive practice.
  4. Generality across goals vs. narrow optimization: Whether the task tests broad problem-solving or just optimizing for a specific outcome.

  We are also worried about:
  - Goodhart effects: When a measure becomes a target, it ceases to be a good measure. For example, coaching might teach candidates to pass the test without having the underlying ability, or AI tools might allow candidates to complete tasks without understanding.
  - The ambiguity of "intelligence": We have three main interpretations in the tasks:
     a) Accumulated knowledge and practiced skill (crystallized intelligence)
     b) Speed and efficiency in acquiring new skills in novel, uncertain environments (fluid intelligence, learning ability)
     c) A bundle of independent aptitudes (suggesting multiple intelligences or specific skills)

  The procedure must be stepwise and produce one of three outcomes for each step: Pass, Fail, or Defer (to human judgment). The entire procedure should not take more than 20 minutes.

  Stepwise Procedure:

  Step 1: Clarify the Claimed Selection Target
     Question: What specific aspect(s) of intelligence does this task claim to measure? The proposer must choose at least one from a predefined list (or write a clear one-liner).
     Predefined list (based on the given interpretations):
        - Accumulated knowledge and practiced skill (crystallized)
        - Ability to quickly learn and adapt to novel, uncertain environments (fluid)
        - A specific set of independent aptitudes (list them)
     Pass: The task has a clear, specific claim about what it measures (one or more of the above, or another that is well-defined).
     Fail: The task claims to measure "intelligence" without specifying which aspect, or the claim is too vague (e.g., "general intelligence" without clarification).
     Defer: Not applicable in this step because the proposer must state the claim.

  Step 2: Check for Construct Validity
     Question: Does the task require the candidate to demonstrate the claimed aspect(s) of intelligence? How?
     Pass: The task design clearly forces the candidate to use the claimed ability. For example:
          - If claiming to measure fluid intelligence, the task must involve novelty and require learning during the task.
          - If claiming crystallized intelligence, the task must require prior knowledge and practiced skill.
          - If claiming independent aptitudes, the task must isolate and test each one.
     Fail: The task does not require the claimed ability (e.g., a task claiming fluid intelligence but using only familiar tools and problems).
     Defer: If the connection is debatable, then defer to human judgment (with a note to discuss).

  Step 3: Assess Novelty and Familiarity Balance
     Question: How does the task balance novelty and familiarity? How much of the task relies on pre-existing knowledge vs. learning during the task?
     Pass: The balance aligns with the claim. For fluid intelligence, novelty must be high and the task must require learning during the task. For crystallized, the task can rely heavily on existing knowledge.
     Fail: The task claims to measure fluid intelligence but has no novelty (or vice versa).
     Defer: If the novelty level is ambiguous or if the task has a mix that might be appropriate but is not clearly aligned with the claim.

  Step 4: Check for Transfer Distance
     Question: What kind of transfer does the task test? (Near: similar to what they've seen before; Far: very different problem domains or skills)
     Pass: The transfer distance is appropriate for the claim. For example, if the task is meant to test far transfer (as in fluid intelligence), then the problems should be in a domain that is not similar to the candidate's past experience (or the task should be designed to be very novel). For crystallized, near transfer is acceptable.
     Fail: The task claims to test far transfer but uses problems that are very similar to common practice (so it's near transfer) or vice versa.
     Defer: If the transfer distance is ambiguous or if the task has elements of both and the claim is for one of them.

  Step 5: Check Practice vs. Learning Speed
     Question: Does the task reward prior practice (crystallized) or the ability to learn quickly from limited examples (fluid)?
     Pass: The task design matches the claim. For fluid intelligence, the task must be designed so that prior practice in the exact domain is not possible (because of novelty) and the candidate must learn quickly. For crystallized, the task can assume extensive practice.
     Fail: The task claims to measure learning speed but allows or requires extensive prior practice in the same domain, or the task does not provide an opportunity to demonstrate quick learning (e.g., too much time or too many examples).
     Defer: If the task has a mix and the claim is for one, then defer.

  Step 6: Generality vs. Narrowness
     Question: Does the task require broad problem-solving across different goals (generality) or is it narrowly optimized for a specific outcome?
     Pass: The task design matches the claim. For generality, the task should have multiple subgoals or require trade-offs between different objectives. For narrowness, the task might be acceptable if the claim is for a specific aptitude.
     Fail: The task claims to measure broad problem-solving but is narrowly focused on one skill or outcome without any trade-offs.
     Defer: If the task has elements of both and the claim is for one, then defer.

  Step 7: Guard Against Goodharting
     Question: How vulnerable is the task to Goodharting? Specifically:
          a) Coaching: Could candidates be trained specifically to pass this task without having the underlying ability?
          b) AI/Internet use: If allowed, can candidates use AI or the internet to complete the task without understanding?
     Pass: The task is designed to minimize these risks. For example:
          - Novel tasks (for fluid intelligence) are less coachable because they change.
          - Tasks that require explanation or reasoning might be less vulnerable to AI if done in person without tools.
          - For take-home tasks with AI allowed, the task must require creativity or understanding that AI cannot provide (or include an oral defense).
     Fail: The task is highly vulnerable and passing it does not require the claimed ability (e.g., a take-home task that can be done entirely by AI without any understanding, or a task that is so formulaic that coaching would guarantee success).
     Defer: If the vulnerability is unclear or if there are mitigation strategies that need human judgment.

  Step 8: Feasibility for Assessment Context
     Question: Is the task feasible given the constraints (time for assessment, candidate time, resources, and the 20-minute vetting time for the assessor)?
     Pass: The task can be administered and scored within the program's constraints (e.g., 48-hour take-home is acceptable if that's the norm) and the vetting can be done in 20 minutes (so the task is not too complex to vet).
     Fail: The task requires resources we don't have, or the vetting would take more than 20 minutes (e.g., because it requires a full trial run or complex setup).
     Defer: If the feasibility is borderline and depends on external factors.

  Overall Outcome:
     - If any step fails, the task is rejected (or sent back for redesign).
     - If a step defers, then the task must be discussed by the team (human judgment).
     - If all steps pass, the task is accepted.

  Now, we apply the procedure to the three tasks.

  Task A: Alien Spreadsheet
     Claim: (We must assign a claim. Since it has a fictional language and novel operators, it seems to aim at fluid intelligence: ability to learn quickly in a novel environment.)

  Step 1: Claimed Selection Target
     We assign: "Ability to quickly learn and adapt to novel, uncertain environments" (fluid intelligence). Pass.

  Step 2: Construct Validity
     The task requires learning a fictional language and applying it to a messy dataset. This forces the candidate to learn and adapt. Pass.

  Step 3: Novelty and Familiarity
     High novelty: fictional language, edge cases not in examples. The task requires learning during the 45 minutes. Aligns with fluid intelligence. Pass.

  Step 4: Transfer Distance
     The task is in a data-cleaning context but with a fictional language. It is designed for far transfer because the language is alien. Pass.

  Step 5: Practice vs. Learning Speed
     No prior practice possible (novel language). Candidates must learn quickly from the documentation. Pass.

  Step 6: Generality vs. Narrowness
     The task is somewhat narrow: it's about data transformation and handling edge cases. But it might require problem-solving in an unfamiliar context. However, the claim is for fluid intelligence, which is about learning, not necessarily broad problem-solving. We might defer because the task is domain-specific, but the procedure does not require generality for fluid intelligence. Pass (if we accept that fluid intelligence can be tested in a narrow domain) or defer? Let's note: the claim is for learning ability, not necessarily broad problem-solving. So we pass.

  Step 7: Goodharting
     Coaching: Because the task uses a fictional language that can change, it is less coachable. However, if the same language is reused, coaching could help. But the task says "fictional" and "unfamiliar", so we assume it changes. AI/internet: Not allowed, so no risk. Pass.

  Step 8: Feasibility
     45 minutes in a controlled setting. Documentation provided. Vetting: The assessor can review the documentation and the task in 20 minutes? Probably, but the assessor must check if the edge cases are properly designed. This might require more time, but we assume it's doable. Pass.

  Verdict: Passes all steps. Accept.

  Task B: Familiar Build
     Claim: This task is open internet and AI, and it's a standard to-do app. It seems to aim at accumulated knowledge and practiced skill (crystallized intelligence) and/or specific aptitudes (like code organization).

     We assign: "Accumulated knowledge and practiced skill" (crystallized) and "A set of independent aptitudes (coding, design, using tools)".

  Step 1: Claimed Selection Target
     The proposer must state. We'll assume they claim: "Accumulated knowledge and practiced skill in web development" and "Aptitudes: coding, design, and tool usage". Pass.

  Step 2: Construct Validity
     The task requires building a standard app, which uses existing skills. It does not require learning anything new (since it's familiar and tools are allowed). So it matches crystallized intelligence. Pass.

  Step 3: Novelty and Familiarity
     Low novelty: standard to-do app. High familiarity. This aligns with crystallized intelligence. Pass.

  Step 4: Transfer Distance
     Near transfer: building a standard app is similar to what they might have done before. Pass (if the claim is crystallized).

  Step 5: Practice vs. Learning Speed
     Rewards prior practice. Not designed to test learning speed. Pass.

  Step 6: Generality vs. Narrowness
     The task is building one specific app. It tests a set of aptitudes (coding, design, etc.) but is still a narrow task (one app). The claim includes independent aptitudes, so we pass.

  Step 7: Goodharting
     Coaching: Highly coachable because it's a standard app. Candidates can be trained to build to-do apps without broader understanding.
     AI/Internet: Allowed. Candidates can use AI to generate the entire app without understanding. This is a high risk.
     Therefore, the task fails because it is highly vulnerable to Goodharting. The claimed abilities (crystallized intelligence, aptitudes) might not be demonstrated if the candidate uses AI without understanding. The task does not include any mechanism to check understanding (like an oral defense). Fail.

  Step 8: Feasibility
     48-hour take-home is feasible. Vetting in 20 minutes: yes. Pass.

  Verdict: Fails at step 7. Reject.

  This verdict might be disliked because the task is common and convenient, but the procedure requires rejection due to Goodharting.

  Task C: Broken Pipeline
     Claim: This task is in an obfuscated and invented build system. It seems to aim at problem-solving in a novel, uncertain environment (fluid intelligence) and diagnosing skills.

     We assign: "Ability to quickly learn and adapt to novel, uncertain environments" (fluid) and "Diagnostic problem-solving".

  Step 1: Pass.

  Step 2: The task requires diagnosing in a novel build system. The candidate must learn the system and find the root failure. This matches fluid intelligence. Pass.

  Step 3: High novelty: obfuscated and invented build system. Must learn during the 90 minutes. Pass.

  Step 4: The build system is invented and obfuscated, so it's far transfer. Pass.

  Step 5: No prior practice possible. Must learn quickly. Pass.

  Step 6: The task is narrow: it's about debugging a build pipeline. But the claim is for learning and diagnostic ability, which are specific. Pass.

  Step 7: Goodharting
     Coaching: Because the build system is invented and obfuscated, and can change, it is less coachable.
     AI/Internet: The task is live (so probably no AI/internet). If done in a controlled setting, then no. Pass.

  Step 8: Feasibility: 90 minutes live. Vetting: The assessor must check the build system and the errors. This might take more than 20 minutes because it is deliberately obfuscated and the assessor must ensure that the errors are fair and the root cause is findable. This step might be borderline. We defer to human judgment because it might require a trial run that takes longer than 20 minutes.

  Verdict: Defer at step 8. The task must be discussed for feasibility of vetting.

  Now, we close.

  What the procedure cannot do:
     - It cannot replace deep expertise in psychometrics.
     - It cannot guarantee that the task will actually measure what it claims (that requires empirical validation).
     - It cannot account for all possible nuances in task design.
     - It is not a substitute for piloting and iterating on tasks.

  What the procedure should never be used to justify:
     - Discriminatory practices: The procedure does not address fairness or bias.
     - Claims about intelligence that are not grounded in the task design: The procedure only checks internal consistency, not external validity.
     - Using the tasks for purposes beyond what they are vetted for (e.g., using a crystallized intelligence task to predict performance in a novel environment).
answer: |-
  ### Stepwise Vetting Procedure for Assessment Tasks  
  **Goal**: Translate philosophical disagreements about "intelligence" into a reusable checklist for non-specialists. Focuses on construct validity, minimizes Goodharting risks, and preserves key distinctions.  
  **Time limit**: 20 minutes per task. Use "Pass," "Fail," or "Defer" (requires human judgment) at each step. If any step fails, reject the task. If deferred, escalate to the program director.  

  #### Procedure Flowchart  
  1. **Clarify the Claimed Construct**  
     - **Question**: What specific aspect of "intelligence" does this task claim to measure? Provide a one-sentence definition.  
     - **Pass**: Definition aligns with one of:  
       - *Crystallized* (accumulated knowledge/skill).  
       - *Fluid* (speed/efficiency in novel, uncertain environments).  
       - *Modular* (a bundle of independent aptitudes, e.g., "logical reasoning + debugging").  
     - **Fail**: Vague (e.g., "general intelligence") or contradictory (e.g., claims fluid but rewards prior knowledge).  
     - **Defer**: Hybrid definition (e.g., "fluid and crystallized")—requires debate.  
     - *Judgment needed?* Yes—task proposer must justify the construct.  

  2. **Assess Novelty vs. Difficulty**  
     - **Question**: Does the task separate *novelty* (unfamiliar elements) from *difficulty* (inherent complexity)?  
     - **Pass**: Novelty is isolated (e.g., new tools with simple docs) and not conflated with difficulty (e.g., edge cases require insight, not memorization).  
     - **Fail**: Novelty and difficulty entangled (e.g., "novel" tools require pre-existing expertise).  
     - **Defer**: Partial separation (e.g., some novelty but hard to distinguish from difficulty).  
     - *Judgment needed?* Yes—assessors may misjudge entanglement.  

  3. **Check Transfer Distance**  
     - **Question**: Does the task target *near transfer* (applying known skills similarly) or *far transfer* (adapting skills to dissimilar contexts)?  
     - **Pass**: Explicitly stated and matched to the construct (e.g., fluid intelligence requires far transfer).  
     - **Fail**: Mismatched (e.g., claims far transfer but uses highly familiar problems).  
     - **Defer**: Ambiguous context (e.g., semi-familiar tools with novel twists).  
     - *Judgment needed?* Minimal—rely on the proposer’s context description.  

  4. **Verify Learning vs. Performance**  
     - **Question**: Does the task reward *learning speed* (efficiency with minimal examples) or *practiced performance* (execution after rehearsal)?  
     - **Pass**: Clear mechanism for measuring one (e.g., time-bound novelty for learning; polished output for performance).  
     - **Fail**: Incentivizes both (e.g., take-home task with AI allows rehearsed solutions to masquerade as learning).  
     - **Defer**: Mixed signals (e.g., live task with practice materials provided).  
     - *Judgment needed?* Yes—assessors may overlook loopholes.  

  5. **Test Generality vs. Narrowness**  
     - **Question**: Does the task require *generality* (trade-offs across goals) or permit *narrow optimization* (single-objective solutions)?  
     - **Pass**: Generality is embedded (e.g., multiple conflicting goals) or narrowness is intentional (e.g., claims modular aptitude).  
     - **Fail**: Claims generality but rewards narrow optimization (e.g., "build a to-do app" graded on completeness alone).  
     - **Defer**: Partial generality (e.g., graded on code quality but not design trade-offs).  
     - *Judgment needed?** Minimal—use grading criteria as a proxy.  

  6. **Audit for Goodharting Risks**  
     - **Question**: How vulnerable is the task to coaching (rote prep) or AI assistance (bypassing skill)?  
     - **Pass**: Mitigations exist (e.g., novelty changes per cohort, oral defenses, or restrictions on AI).  
     - **Fail**: High risk with no mitigations (e.g., predictable task + unrestricted AI).  
     - **Defer**: Partial mitigations (e.g., AI allowed but with unclear guardrails).  
     - *Judgment needed?* Yes—requires estimating candidate behavior.  

  7. **Feasibility Check**  
     - **Question**: Can assessors vet this task in 20 minutes without psychometric expertise?  
     - **Pass**: Task is scoped to assess key elements (docs, grading rubric, time limits) in <20 min.  
     - **Fail**: Requires deep trial runs or statistical validation.  
     - **Defer**: Borderline (e.g., complex but well-documented).  
     - *Judgment needed?** Minimal—rely on time logs from test runs.  

  **Where the Procedure Misfires**:  
  - Tasks with **hidden dependencies** (e.g., "cultural knowledge in a logic puzzle").  
  - **High-stakes creativity tasks** (e.g., "design a system")—judging "originality" is subjective.  
  - **Empirically underdetermined constructs** (e.g., "grit")—requires longitudinal data.  

  ---  
  ### Demonstration on Candidate Tasks  
  **Key**:  
  - ✅ = Pass  
  - ❌ = Fail  
  - ⚠️ = Defer  

  #### Task A: Alien Spreadsheet  
  - **Claimed Construct**: *Fluid intelligence* (learning efficiency in uncertainty).  
  1. **Clarify Construct**: ✅ (Explicitly targets novel environment + edge cases).  
  2. **Novelty vs. Difficulty**: ✅ (Novelty: fictional language; Difficulty: edge cases require inference, not docs recall).  
  3. **Transfer Distance**: ✅ (Far transfer—no real-world analog to fictional operators).  
  4. **Learning vs. Performance**: ✅ (Measures learning speed: 45-min limit with minimal examples).  
  5. **Generality vs. Narrowness**: ⚠️ (Graded on cleanup, but goals are fixed; could reward narrow optimization. *Defer for rubric review*).  
  6. **Goodharting Risks**: ✅ (No internet/AI; novelty reduces coaching risk).  
  7. **Feasibility**: ✅ (Docs and task scannable in 20 min).  
  **Verdict**: **Accept** (Defer at Step 5 requires rubric tweak: add "explain edge-case reasoning").  

  #### Task B: Familiar Build  
  - **Claimed Construct**: *Crystallized intelligence* (knowledge + polished performance).  
  1. **Clarify Construct**: ✅ (Clear: "completeness, organization, polish").  
  2. **Novelty vs. Difficulty**: ❌ (No novelty—standard to-do app. Fails fluid claims; passes crystallized but conflicts with open AI).  
  3. **Transfer Distance**: ✅ (Near transfer—industry-standard task).  
  4. **Learning vs. Performance**: ❌ (Open AI allows rehearsed performance without learning. *Fails*).  
  5. **Generality vs. Narrowness**: ❌ (Graded on "completeness, organization, polish"—rewards narrow optimization, not trade-offs).  
  6. **Goodharting Risks**: ❌ (Unrestricted AI + coaching vulnerability. *Fails*).  
  7. **Feasibility**: ✅ (Task well-defined for vetting).  
  **Verdict**: **Reject** (Fails Steps 2, 4, 5, 6).  
  - **Why your team will dislike this**: This task is popular (real-world relevance) and scalable, but the procedure *requires* rejection. AI/coaching lets candidates "fake" crystallized intelligence, and narrow grading ignores problem-solving trade-offs.  

  #### Task C: Broken Pipeline  
  - **Claimed Construct**: *Fluid intelligence* (diagnosis under uncertainty) + *modular aptitude* (debugging).  
  1. **Clarify Construct**: ⚠️ (Two claims—fluid + modular. *Defer for construct alignment*).  
  2. **Novelty vs. Difficulty**: ✅ (Novelty: invented build system; Difficulty: obfuscation/errors require deduction).  
  3. **Transfer Distance**: ✅ (Far transfer—deliberately misleading context).  
  4. **Learning vs. Performance**: ✅ (Live exercise measures learning speed from minimal clues).  
  5. **Generality vs. Narrowness**: ⚠️ (Graded on diagnosis + minimal deployment; may miss generality if no trade-offs. *Defer for grading details*).  
  6. **Goodharting Risks**: ✅ (Live setting limits AI/coaching).  
  7. **Feasibility**: ❌ (Vetting requires testing the obfuscated system—infeasible in 20 min).  
  **Verdict**: **Reject** (Fails Step 7; deferrals at Steps 1 and 5 require redesign).  
  - **Why your team will dislike this**: Live exercises feel "authentic," but feasibility fails. Vetting an obfuscated system demands trial runs beyond 20 minutes.  

  ---  
  ### Closing Statement  
  **What this procedure cannot do**:  
  - **Replace validation**: It flags logical flaws but doesn’t prove a task predicts performance (requires pilot data).  
  - **Handle subjectivity**: Normative disagreements (e.g., "how much novelty is enough?") require human debate.  
  - **Prevent gaming**: No procedure can fully stop adaptive candidates; use iterative redesign.  

  **Never use this to justify**:  
  - **Bias**: It does not assess fairness (e.g., demographic impacts).  
  - **Overclaiming**: A "pass" doesn’t mean the task measures "true" intelligence—only that it aligns with its *stated* construct.  
  - **High-stakes without data**: Never deploy a task without piloting, even if it passes vetting.  

  **Final Recommendation**: Integrate this procedure with a quarterly review of task performance data (e.g., pass/fail vs. apprenticeship success rates) to close the loop.
