answer: |-
  Your question is far from naive—it cuts to the heart of why the Church-Turing Thesis (CTT) is philosophically profound and epistemically subtle. As a physicist, your intuition about definitions versus empirical claims is spot-on. Let's break this down step-by-step, addressing both the mathematical and physical aspects, and examine a concrete hypercomputation proposal.

  ### 1. **The Epistemic Status of CTT**
     - **Mathematical CTT (MCTT)**: This is the claim that *every effectively calculable function (or algorithmically computable function) is computable by a Turing machine*.  
       - **Status**: MCTT is **not a theorem**—it’s a *thesis*. Why? Because "effectively calculable" is an informal, pre-theoretic concept (rooted in human intuition about algorithms, like pencil-and-paper procedures). Turing machines (and λ-calculus, etc.) are formalizations of this intuition.  
       - **Evidence for MCTT**:  
         - **Convergence of formalisms**: Turing machines, λ-calculus, general recursive functions, and Post systems all compute the *same class* of functions.  
         - **Robustness**: No intuitively computable function has ever been found outside this class.  
       - **Why it’s not "just a definition"**: If CTT were merely a definition (e.g., "let’s define 'computable' as 'Turing-computable'"), it would be trivially true but vacuous. Its profundity lies in claiming that *all reasonable formalizations of "computation" converge*—suggesting we’ve captured a natural kind.  
       - **Falsifiability?** A counterexample to MCTT would be an intuitively "effective procedure" that demonstrably computes a function outside the Turing-computable set (e.g., solves the halting problem). No such procedure has been accepted.

     - **Physical CTT (PCTT)**: This claims that *any physically realizable process can be simulated by a Turing machine*.  
       - **Status**: This **is an empirical claim**—it depends on the laws of physics.  
       - **Falsifiability?** Yes: demonstrate a physical device that computes a non-Turing-computable function (e.g., decides the halting problem).

  ### 2. **A Concrete Hypercomputation Proposal & Why It Fails**
  Let’s examine a **relativistic "Malament-Hogarth" (MH) spacetime** proposed by Earman, Hogarth, and Pitowsky. This leverages general relativity to perform a supertask.

  #### **The Setup**:
     - **Device**: A computer \( C \) orbits a Kerr black hole (which has a ring singularity allowing access to infinite time in finite proper time). An observer \( O \) falls toward the singularity.
     - **Task**: Decide whether a given Turing machine \( M \) halts.
     - **Procedure**:  
       1. \( C \) checks if \( M \) halts at step \( n \) for \( n = 1, 2, 3, \ldots \)  
       2. If \( M \) halts at some \( n \), \( C \) sends a light signal to \( O \).  
       3. \( O \) crosses the Cauchy horizon (where time "ends" for external observers) at finite proper time \( \tau \).  
       4. If \( O \) receives the signal before crossing, \( M \) halts; if not, \( M \) loops forever.

  #### **Why This Purports Hypercomputation**:
  - From \( O \)’s perspective, infinite computation occurs in finite time (a supertask).  
  - \( O \) "knows" the answer to the halting problem after time \( \tau \).

  #### **Where the Argument Breaks Down**:
     - **Physical realizability**:  
       - Kerr black holes may not exist (real black holes are likely Schwarzschild-like, with no traversable inner horizons).  
       - Quantum gravity effects likely destabilize the Cauchy horizon (e.g., mass inflation singularity).  
     - **Unbounded precision**:  
       - To check halting for arbitrarily large \( n \), \( C \) needs unbounded memory and energy.  
       - Thermodynamics: Storing \( n \) bits requires \( \Omega(n) \) energy/space. An infinite computation requires infinite resources.  
     - **Signal reliability**:  
       - As \( O \) approaches the singularity, blueshifted radiation from \( C \)’s signals would become infinitely energetic, destroying \( O \) and the apparatus (Eardley 1974).  
       - Quantum noise (e.g., Unruh radiation) likely scrambles any signal.  
     - **Logical consistency**:  
       - The outcome depends on \( O \)’s worldline crossing the horizon—but if \( M \) doesn’t halt, \( O \) receives no signal. This requires \( O \) to "know" the absence of a signal is meaningful, which presupposes a global perspective inconsistent with relativity.

  ### 3. **Physics vs. Idealisations: The Core Issue**
  All hypercomputation proposals (analog chaos, quantum gravity, neural networks) fail similarly:  
  - **Idealization**: They assume unbounded precision, noise-free environments, or infinite resources.  
  - **Physics intervenes**: Quantum fluctuations, thermodynamic limits, or general relativity’s singularities prevent realizing these ideals.  
  - **Example**: Pitowsky’s "spinning wheel" machine (1982) uses a point rotating at irrational angular velocity to encode non-computable reals. But physical wheels have friction, quantum jitter, and material limits—the state cannot be measured with infinite precision.

  ### 4. **Physical CTT: Empirical or Not?**
  - PCTT **is empirical**—it makes a contingent claim about our universe.  
  - **Counterevidence?** If quantum gravity (e.g., in certain string theory models) allows non-computable dynamics, PCTT would be falsified. Current physics (QFT, standard cosmology) suggests no such dynamics exist.  
  - **But note**: Quantum computing *extends* but doesn’t *violate* CTT—BQP ⊆ PSPACE ⊆ R (recursive functions), still within Turing computability.

  ### Conclusion
  - **MCTT** is a profound *conjecture* linking informal intuition to formal models—not a definition, but a claim about the equivalence of all computation formalisms. Its evidence is conceptual convergence.  
  - **PCTT** is an empirical claim about physics. While no viable hypercomputer exists, its falsification remains *conceivable* (if physically implausible).  

  As a physicist, you'll appreciate that hypercomputation proposals are akin to perpetual motion machines: they reveal limits of physical law by probing where idealizations break. CTT’s resilience lies in its embodiment of the **physical Church-Turing principle**: *The laws of physics are algorithmic.* This remains our best-supported paradigm—but like all scientific claims, it’s open to revision.
