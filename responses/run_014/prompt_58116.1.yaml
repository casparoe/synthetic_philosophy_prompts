  We are given a scenario and five claims that the user is committed to. We need to check for coherence and identify conflicts.

  **Background:**
  - Two districts: North and South.
  - Historical qualification rates: North: 50% (1/2), South: 33.3% (1/3).
  - The tool assigns a risk score (probability of being qualified) and uses a common cutoff to prioritize.
  - The labels are accurate.

  **The Claims:**

  1. **Calibration across districts:** For any score s, the proportion of qualified individuals among North applicants with score s equals the proportion for South applicants with that score, and both equal s.

  2. **Parity in error rates:** 
     - True Positive Rate (TPR) should be the same for North and South. (Among the qualified, the proportion correctly prioritized)
     - False Positive Rate (FPR) should be the same for North and South. (Among the unqualified, the proportion incorrectly prioritized)

  3. **Difference in qualification rates is real and fixed:** The base rates (50% in North, 33.3% in South) are real and should be taken as given. The model shouldn't correct for this underlying injustice.

  4. **The tool should be informative, use same cutoff, and not deliberately worsen performance:** The model should be better than chance but not perfect, use the same cutoff for both, and fairness shouldn't be achieved by degrading one group, randomizing, or not predicting.

  5. **No direct use of district membership:** The model should not use district as a feature. Two applicants with the same other features get the same score.

  **Analysis for Coherence:**

  We will examine the claims and see if they can hold simultaneously.

  **Conflict between Claim 1 (Calibration) and Claim 5 (No District Feature):**

  Claim 5 requires that the model does not use district membership. Therefore, the model is built on features that are shared across districts. However, Claim 1 requires that for each score s, the proportion of qualified individuals in North and South must both equal s and be equal to each other.

  But note: the base rates are different (Claim 3: 50% in North vs 33.3% in South). If the model does not use district, then the same score s must reflect the same probability of being qualified regardless of district. However, because the base rates are different, it is possible that the distribution of features is different in the two districts. Therefore, without using district, the model might learn a score that is calibrated to the overall population but not to each district.

  In fact, without the district feature, the model might be calibrated on average (over the entire population) but not necessarily per group. This is because the model does not have the group information to adjust for the different base rates.

  Therefore, if we require calibration per group (Claim 1) and the base rates differ (Claim 3), then the model must use the district feature to adjust the scores per group. But Claim 5 forbids using district.

  Hence, **Claim 1 and Claim 5 conflict** when base rates are different.

  **Conflict between Claim 1 (Calibration) and Claim 2 (Parity in Error Rates):**

  It is known in the fairness literature that calibration (Claim 1) and parity in error rates (Claim 2) are generally incompatible when base rates differ (which they do by Claim 3). 

  Recall:
  - TPR (Sensitivity) = P(score > cutoff | qualified)
  - FPR (1 - Specificity) = P(score > cutoff | unqualified)

  If we have calibration (Claim 1) and use a common cutoff (as per Claim 4), then the positive predictive value (PPV) and negative predictive value (NPV) will be the same for both groups at the same score. However, the error rates (TPR and FPR) might differ.

  In fact, a classic result is that if the base rates differ, then if the model is calibrated per group (so that the score reflects the true probability per group) then the TPR and FPR will generally not be equal across groups.

  For example, let the cutoff be c. Then for North and South:

  For a given group, the TPR is the proportion of qualified individuals with score > c. Similarly, FPR is the proportion of unqualified individuals with score > c.

  Now, because the base rates are different, the distribution of scores for qualified and unqualified individuals in each group may be different. Therefore, even with calibration per group, the TPR and FPR might differ.

  Moreover, it is known that if the model is calibrated per group and the base rates are different, then we cannot have both equal TPR and equal FPR. 

  Therefore, **Claim 1 and Claim 2 conflict** when base rates are different.

  **Conflict between Claim 2 (Error Rate Parity) and Claim 5 (No District Feature):**

  Claim 2 requires that TPR and FPR are equal across groups. Without using the district feature (Claim 5), the model must assign the same score to two individuals with the same features regardless of district. This might lead to similar distributions of scores for the same features in both districts. However, because the base rates are different, the same set of features might have different meanings (i.e., different probability of being qualified) in the two districts. 

  Therefore, without using district, the model cannot adjust the scores to achieve error rate parity if the relationship between features and outcome differs by district. But note: Claim 5 does not allow district as a feature, so the model cannot learn district-specific patterns.

  Hence, achieving error rate parity (Claim 2) without using district (Claim 5) might be difficult, but it is not necessarily impossible if the features are equally predictive in both groups. However, if the base rates are different and the feature distributions are also different, then without using district we might not achieve error rate parity.

  But note: Claim 3 states that the difference in base rates is real. If the features are the same but the base rates are different, then the same feature set in the two groups might have different conditional distributions. Without district, the model would be forced to assign the same score to the same features, which might lead to miscalibration per group and hence possibly failure of error rate parity.

  However, let's be cautious: it is possible that the model without district might by chance achieve error rate parity? But generally, without group-specific adjustments, it is unlikely when base rates differ.

  But note: Claim 2 and Claim 5 do not necessarily conflict in every situation, but they might if the model without district fails to achieve error rate parity. However, we are not forced by Claim 5 to have the same error rates. We are forced by Claim 2 to have them. So the conflict is that without using district, we might not be able to achieve Claim 2. Therefore, if we require Claim 2, we might need to use district to adjust the model, but Claim 5 forbids that.

  Therefore, **Claim 2 and Claim 5 conflict** because without group information, we cannot directly control for group in the error rates.

  **Conflict between Claim 1 and Claim 3?**

  Claim 3 says the base rate difference is real and should not be corrected away. Claim 1 requires calibration per group. Calibration per group actually respects the base rate difference because in each group, the score reflects the true probability for that group. So these two are compatible.

  **Conflict between Claim 2 and Claim 3?**

  Claim 2 requires error rate parity. Claim 3 says base rates are different. We know that error rate parity (especially equal TPR and FPR) when base rates are different might lead to different predictive values. But Claim 3 does not require anything about the model, it just says the base rates are fixed and real. So Claim 2 and Claim 3 are not directly conflicting, but they set the stage for the conflict with Claim 1.

  **Conflict between Claim 4 and others?**

  Claim 4 requires a common cutoff and that the model is informative (better than chance but not perfect). It also says we should not deliberately worsen performance for one group. This is compatible with all the others except that we are already having conflicts with Claims 1 and 2.

  **Ordering Conflicts by Fundamentality:**

