  The user's explicit request is for a decision procedure that handles edge cases like gradual part replacement, temporary attachments, and functional vs. physical integration. They need something quick—about 15 minutes per case—with clear examples. Their team has no philosophy background, so the solution must be jargon-free and actionable. But the deeper needs might include consistency across the organization to avoid cascading issues in different departments, compliance with regulations, and reducing ambiguity in reporting.

  I recall the special composition question from philosophy, which asks when parts compose a whole. Philosophers like van Inwagen have debated this, but their theories aren't directly applicable. Instead, I should synthesize practical criteria. Key aspects to consider are functional integration, operational unity, control interfaces, and permanence of attachment. Also, the hospital context adds layers like regulatory definitions and billing codes, which might override purely philosophical distinctions.

  For the framework, I think a flowchart or step-by-step checklist would work best. It should start with physical attachment and then move to functional integration. Each criterion should have clear yes/no paths. The user mentioned edge cases, so the procedure needs to flag situations where judgment is necessary, like temporary attachments or components that function independently. Including examples, like the IV stand versus the surgical robot, will make it relatable.

  I should also address the hospital-specific factors. For instance, FDA classifications might dictate whether something is a single device. Maintenance schedules could influence whether components are tracked together. Billing codes are another critical factor since they have predefined rules. It's important to emphasize that the ontology should align with these external requirements even if the philosophical criteria suggest otherwise.

  The 15-minute constraint means the procedure can't be overly complex. Each step should be straightforward, with binary questions leading to a decision. Including a "judgment required" outcome with guidance on who to consult (e.g., clinical engineers, compliance officers) would handle ambiguous cases. Also, documenting the rationale for each decision ensures consistency and provides a reference for future cases.

  Worked examples are crucial. For the IV stand, the pumps and monitors are mechanically attached but function independently, so they're separate devices. In contrast, a surgical robot's arms are functionally integrated and controlled via a single interface, making it a single device. Another example could be an ECG machine with detachable electrodes; the electrodes might be consumables, while the machine is the main device. These examples help the team apply the framework correctly.

  Potential pitfalls include over-reliance on physical attachment without considering function, or vice versa. Also, temporary setups like a monitor attached via a rolling stand might need different handling. The framework should prompt users to consider both aspects and check regulatory definitions. Emphasizing collaboration with other departments can mitigate these issues, ensuring the ontology meets all operational needs.
answer: |-
  Here's a practical **Medical Device Composition Decision Framework (MDCDF)** based on philosophical insights (van Inwagen, Simons) but boiled down into a clinical/operational checklist. It handles your edge cases, flags judgments, and fits within 15 minutes.

  **Core Principle:** A "single device" exists when components are **physically integrated** *and* **functionally unified** *in a persistent way* **for a core clinical purpose**. Otherwise, treat as distinct devices.

  ---

  ### The MDCDF Checklist (Run Sequentially - Stop at First "Yes")
  *Answer each question for the components in question. "Attachment" implies mechanical/electrical connection beyond mere proximity.*

  1.  **Regulatory/External Definition?**
      *   *Is there an existing FDA 510(k)/PMA classification, ISO standard, or manufacturer specification explicitly defining this assembly as a SINGLE device?*
      *   **YES:** Treat as one device. *(Stop Here)*
      *   **NO:** Proceed to 2.
      *   *Why?* External mandates override philosophical reasoning (e.g., an entire MRI scanner is one device per FDA).

  2.  **Permanent Physical Integration?**
      *   *Are the components physically fused, welded, or integrated such that separation requires destructive disassembly or specialized tools/service by a biomed/engineer?*
      *   **YES:** Likely one device. Proceed to 3 to confirm function.
      *   **NO:** Proceed to 4.
      *   *Edge Case Handling (Gradual Replacement):* If replacing a component *doesn't* change the core device identity/function (e.g., swapping a server in a PACS archive), it's still one device. If it fundamentally alters capability (e.g., upgrading a robot arm's sensor package), flag for judgment.

  3.  **Unified Core Function & Control?**
      *   *Do the integrated components work together to perform a SINGLE, PRIMARY clinical function controlled through a unified interface? (Does removing one component cripple the core function of the whole?)*
      *   **YES:** **One Device.** *(Stop Here - e.g., Surgical Robot Main Console + Integrated Arms)*
      *   **NO:** **Separate Devices.** *(Stop Here - e.g., TV mounted on wall in OR - TV and wall are separate)*
      *   *Why?* Physical integration without functional unity is just mounting (e.g., a monitor bolted to a wall).

  4.  **Temporary/Utility Attachment?**
      *   *Is the attachment primarily for mobility, positioning, power, or basic data passthrough (like a simple USB cable or power strip), NOT core functional integration?*
      *   **YES:** **Separate Devices.** *(Stop Here - e.g., Laptop on a cart, Pump on an IV pole, Monitor plugged into a wall outlet)*
      *   **NO:** Proceed to 5.
      *   *Why?* Carts, poles, and basic power/data links don't create new functional wholes.

  5.  **Persistent Functional Interdependence?**
      *   *When attached, do the components create a NEW, PERSISTENT system function that:*
          *   *(a) Doesn't exist when they are separate?*
          *   *(b) Depends critically on their real-time interaction?*
          *   *(c) Is managed/controlled as a single unit clinically?*
      *   **YES:** **Likely One Device** (Proceed to 6 for final check).
      *   **NO:** **Separate Devices.** *(Stop Here - e.g., Separate vital signs monitor plugged into an anesthesia machine port - usually still separate devices)*

  6.  **Shared Identity & Lifecycle?** (Confirmation for Step 5)
      *   *Is the assembly:*
          *   *(a) Inventoried, maintained, and replaced as a single unit by Biomed/Clinical Engineering?*
          *   *(b) Referred to by clinicians/staff as a single "thing" (e.g., "the robot," "the hybrid OR suite" - though suites are often systems)?*
          *   *(c) Covered under a single service contract/maintenance schedule?*
      *   **YES (2/3):** **One Device.** *(Stop Here)*
      *   **NO:** **Flag for Judgment.** *(See below)*
      *   *Why?* Operational reality confirms functional unity. If clinical practice treats it as one, so should your ontology.

  **Flag for Judgment Outcome:** Document the rationale using the checklist. Escalate to a small committee (Data Arch + Biomed Eng + Clinical Lead + Compliance) for a final, documented ruling. Apply consistently thereafter.

  ---

  ### Worked Examples

  1.  **IV Pole with 2 Infusion Pumps & a Vital Signs Monitor**
      *   1: NO (No FDA defines "IV Pole Assembly")
      *   2: NO (Pumps/monitor clamp on easily)
      *   3: N/A (Skipped due to No on 2)
      *   4: **YES** (Pole is for positioning/mobility) --> **Separate Devices** (1 Pole, 2 Pumps, 1 Monitor). *Billing/Inventory tracks pumps & monitor individually.*

  2.  **Da Vinci Surgical Robot (Console, Patient Cart w/ Arms, Vision Cart)**
      *   1: **YES** (FDA clearance treats the core system as one device) --> **One Device** (The integrated robotic system). *Arms are replaceable components, not separate devices.*

  3.  **Patient Monitor plugged into an Anesthesia Machine via dedicated port**
      *   1: NO (Typically, monitors and anesthesia machines are separate FDA devices)
      *   2: NO (Cables plug/unplug easily)
      *   3: N/A
      *   4: **NO** (It's more than basic power/data - data integration often occurs)
      *   5: **Persistent Functional Interdependence?** **Judgment Call:** Often NO. Core anesthesia function (gas delivery) exists without monitor. Core monitoring function exists without machine. Interface is data sharing, not creating a *new* function. Clinically managed separately. --> **Separate Devices.** *Flag if integration is deep (e.g., monitor controls gas parameters).*

  4.  **MRI Scanner (Magnet, Gradients, RF coils, Console, Cryocooler)**
      *   1: YES (FDA classifies the scanner assembly) --> **One Device.** *Coils are often accessories, but the core scanner is one unit.*

  5.  **Ultrasound Machine with Detachable Transducer Probes**
      *   1: YES (FDA clearance covers the system; probes are accessories/parts) --> **One Device** (The ultrasound system). *Probes are tracked as components/replaceable parts.*

  6.  **ECG Machine with Wires and Disposable Electrodes**
      *   1: YES (FDA clearance typically covers the machine, wires as accessories, electrodes as consumables) --> **One Core Device** (ECG Machine), **Accessories** (Wires - often tracked with machine), **Consumables** (Electrodes). *Different lifecycle management.*

  ---

  **Key Implementation Advice:**

  1.  **Anchor to Regulations First:** Always start with FDA/ISO/manufacturer specs. Philosophy doesn't override compliance.
  2.  **"Clinically Meaningful Unit":** The core question is what clinicians/techs *operationally treat* as a single entity for core tasks.
  3.  **Lifecycle over Snapshot:** Focus on how the item is managed (inventory, maintenance, replacement) over a purely physical "at this moment" view.
  4.  **Document Judgments:** Create a shared log of "Judgment Call" decisions with rationale. This builds institutional consistency.
  5.  **"System" vs. "Device":** Complex assemblies (e.g., Hybrid OR) might be best modeled as a "System" containing multiple "Devices" (C-arm, table, lights) using your ontology's relationship capabilities. Not everything needs to be forced into a single atomic device.
  6.  **Collaborate:** Run borderline cases past Biomed/Clinical Engineering. Their practical view is crucial.

  This framework provides defensible consistency by leveraging functional unity, operational reality, and regulatory precedence, while explicitly acknowledging where human judgment based on clinical and technical expertise is essential. It avoids philosophical rabbit holes while capturing the core insights about when parts compose a meaningful whole in a healthcare context.
