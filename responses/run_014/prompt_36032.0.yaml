  2. The World Selection Committee (students in groups of 3-4, or whole class as one committee? Given 12 students, split into 3 groups of 4? But then we need multiple ledgers? Alternatively, one committee for the whole class to keep it simple and for the revelation to be impactful. Let's do one committee for the whole class, and one hidden author. Alternatively, to involve more, have multiple hidden authors? But that might complicate. We'll start with one committee and one hidden author. If time, we can have multiple rounds with different authors.

