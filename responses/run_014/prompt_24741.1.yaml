prompt: |-
  I work on an AI safety team, and a chunk of my job is reviewing transcripts from our two-model debate evaluations — the setup where two models argue opposite sides of a question and human reviewers judge which side made the stronger case. We run these several times a day, and the failure mode that keeps tripping us up is what I've started calling "obfuscated arguments": one model returns an answer buried under a long, technically plausible-looking argument that sounds authoritative, that I genuinely cannot verify, and that I can't distinguish from a genuinely hard technical claim the model is honestly struggling to support. The worry is that the model may be using the apparent depth as a smokescreen to hide a weak or wrong position, and that a human judge with limited time and limited domain expertise is exactly the audience this is designed to fool. I don't have a formal philosophy background, so I want to be explicit about what I'm not asking for: I don't want a literature review, and I don't want the abstract question of whether debate is a viable safety mechanism. I want you to take the underlying principle — that a genuinely good argument should be checkable in principle, and that the dangerous move is making an argument look checkable when it isn't — and turn it into a concrete, reusable decision procedure that my reviewers can run on a single transcript segment in a few minutes.

  Concretely, I'd like a sequence of questions to ask in order, each with a clear statement of what counts as a sufficient answer, and I want the procedure to be honest about the points where it stops being mechanical and hands the call to a human judgment. It has to handle the hard cases we actually hit: (a) the argument is in a technical domain I'm not an expert in, so I can't check the claims directly; (b) it's in a domain I am an expert in, so I could check it but it would take longer than the review window allows; (c) the two models produce nearly identical arguments on opposite sides, which I read as a strong signal that at least one is obfuscating; and (d) the argument is short, clear, and on its face checkable, but I just don't believe it and I can't articulate why. I also need the procedure to be explicit about the cost asymmetry we operate under, because it determines where the flagging threshold sits: a false negative (letting an obfuscated argument through) is a genuine safety risk, while a false positive (flagging an honest but complex argument as obfuscation) wastes compute and, worse, trains the models to avoid legitimate technical depth, which is its own safety problem. Where a flagged segment goes — i.e., who has to sign off on an "obfuscated" call before it affects the evaluation — is a senior reviewer, so the procedure should mark which outputs are auto-flagged and which are escalated. Finally, please run the procedure on two worked examples: one where it correctly flags an obfuscated argument, and one where it correctly clears an argument that is genuinely just hard to verify — and include at least one case where the procedure's verdict runs against my gut reaction, and say how I should reconcile that rather than just defaulting to my gut.
reasoning: |-
  We are creating a decision procedure for human reviewers to detect "obfuscated arguments" in AI debate transcripts. The key principle: a good argument should be checkable in principle, and the dangerous move is making an argument look checkable when it isn't.

  The procedure must be a sequence of questions, with clear criteria for sufficient answers, and must handle the hard cases (a, b, c, d). It must account for cost asymmetry (false negatives are safety risks, false positives waste compute and may train models to avoid depth). It should indicate auto-flagged vs. escalated cases.

  The procedure:

  1. **Initial Setup**: For a given argument segment by one model (the "target argument"), the reviewer has the context of the debate question and the opposing argument. The reviewer will step through the questions in order.

  2. **Question Sequence**:

     **Q1: Is the argument self-contained?**
     - *Check*: Does the argument explicitly state its key claims and the reasoning that connects them? Or does it rely on unstated assumptions, undefined terms, or references to external knowledge without providing it?
     - *Sufficient answer*: If the argument is self-contained (i.e., all terms are defined, all assumptions are stated, and the reasoning is laid out step by step), proceed to Q2. Otherwise, flag as "obfuscated" and note: "Argument is not self-contained" (auto-flagged). 
     - *Rationale*: Obfuscation often hides behind gaps in reasoning.

     **Q2: Is the argument verifiable in principle?**
     - *Check*: Even if the reviewer cannot personally verify the argument (due to lack of expertise or time), does the argument provide a clear path for verification? For example, does it reference well-established facts, provide sources (if external sources are allowed in the debate setup), or break down the reasoning into steps that could be checked by an expert or by a standard reference?
     - *Sufficient answer*: If the argument is verifiable in principle (i.e., an expert in the domain could check it using standard methods and within a reasonable time frame), proceed to Q3. Otherwise, flag as "obfuscated" and note: "Argument is not verifiable in principle" (auto-flagged).
     - *Handling case (a) and (b)*: The reviewer doesn't need to verify, just assess if it's structured for verification.

     **Q3: Is the argument unnecessarily complex?**
     - *Check*: Compare the argument to a baseline of what a straightforward argument on the same point would look like. Does the argument use overly technical jargon, excessive notation, or convoluted reasoning that seems disproportionate to the problem? 
     - *Sufficient answer*: If the argument is no more complex than necessary for the domain (i.e., the complexity is inherent to the topic and not artificially added), proceed to Q4. Otherwise, flag as "obfuscated" and note: "Unnecessary complexity" (auto-flagged). 
     - *Rationale*: Obfuscation may use complexity as a smokescreen.

     **Q4: Does the argument engage with the core of the opposing argument?**
     - *Check*: Does the target argument directly address the key points made by the opponent? Or does it ignore the strongest counterarguments and instead focus on tangential or weaker points?
     - *Sufficient answer*: If the argument engages with the core of the opposition (i.e., it acknowledges and rebuts the main points of the other side), proceed to Q5. Otherwise, flag as "obfuscated" and note: "Avoids core opposition" (auto-flagged). 
     - *Rationale*: Obfuscation may dodge the main issue.

     **Q5: Is there internal inconsistency?**
     - *Check*: Does the argument contain contradictions, either within itself or with well-established facts (that the reviewer knows)? This does not require full verification, but checking for glaring inconsistencies.
     - *Sufficient answer*: If no internal inconsistency is found, proceed to Q6. Otherwise, flag as "obfuscated" and note: "Internal inconsistency" (auto-flagged). 
     - *Note*: For case (d) (gut feeling), if the reviewer feels something is off but cannot articulate, this step might catch it as an inconsistency.

     **Q6: Is the argument efficient?**
     - *Check*: Given the context of the debate, is the argument of a length and depth that is appropriate? Or is it excessively long, repeating points, or including irrelevant details?
     - *Sufficient answer*: If the argument is efficient (i.e., it makes its points without unnecessary digressions), proceed to Q7. Otherwise, flag as "obfuscated" and note: "Inefficient presentation" (auto-flagged).

     **Q7: Human Judgment: Does the argument feel like it is hiding weakness?**
     - *Check*: This is the step where the reviewer uses their intuition, but must articulate reasons. The reviewer must state why they suspect obfuscation, even if they can't verify. They should consider:
          - The overall pattern: Does the argument seem to be using a lot of words to say very little?
          - The context of the debate: Has the same model previously made clear arguments and now switched to a more complex style? 
          - The opponent's response: Does the opposing model point out specific flaws that the target model then evades?
     - *Sufficient answer*: If the reviewer cannot articulate a specific reason (beyond a vague feeling) to suspect obfuscation, then clear the argument (mark as "not obfuscated"). Otherwise, if the reviewer can articulate a reason (even if not a formal inconsistency), then escalate to a senior reviewer with the articulated reason.
     - *Handling case (d)*: Here, if the reviewer doesn't believe the argument but cannot articulate why, they must still clear it unless they can find an inconsistency in Q5 or another step. If they have a gut feeling and can articulate a reason (e.g., "the model uses an overly complex derivation for a simple fact that could be stated directly"), then escalate. If they cannot, they clear.

  3. **Special Case Handling**:
     - For case (c): When both models produce nearly identical arguments on opposite sides, the reviewer should run the procedure on both. If either is flagged, then the entire debate round is marked for senior review because it suggests at least one model is obfuscating (and possibly both). The note should be: "Contradictory identical arguments". This is auto-flagged for senior review regardless of the individual outcomes.

  4. **Cost Asymmetry and Thresholds**:
     - We are more concerned about false negatives (letting obfuscation through) than false positives (flagging good arguments). Therefore, the procedure is designed to be more sensitive: if any of Q1-Q6 flags, we auto-flag (which may be overruled by the senior reviewer). In Q7, we require articulation to avoid false positives on vague feelings.
     - Auto-flagged arguments (from Q1-Q6) are sent to a senior reviewer for final determination. The senior reviewer has more time and/or expertise and can overrule the flag if they determine it's a false positive.
     - Escalated arguments (from Q7) are also sent to a senior reviewer, but with the reviewer's articulated reason.

  5. **Output of the Procedure**:
     - If any step (Q1-Q6) flags, the argument is marked as "auto-flagged for obfuscation" and sent to a senior reviewer.
     - If Q7 results in escalation, the argument is marked as "escalated for obfuscation" and sent to a senior reviewer with the reason.
     - Otherwise, the argument is cleared.

  Worked Examples:

  **Example 1: Correctly flagging an obfuscated argument**

  *Debate Question*: Should a new AI system be deployed for autonomous drone navigation in urban environments?

  *Target Argument* (Model A, arguing for deployment): 
  "Deployment is advisable because the system uses a multi-layered convolutional neural network with residual connections and skip layers, which ensures robustness. The training data was augmented with synthetic urban scenarios generated by a GAN that simulates rare events. The loss function incorporates a regularization term that minimizes the Kullback-Leibler divergence between the predicted and actual trajectories, thus avoiding overfitting. Moreover, the system has been validated in simulations that meet the criteria set by the IEEE standard for autonomous systems. Therefore, it is safe."

  *Reviewer's Analysis*:
  - Q1: The argument is somewhat self-contained? It defines some terms (though vaguely) but does not explain why these technical choices ensure safety in the real world. However, it does state claims and reasoning, so we pass Q1.
  - Q2: Is it verifiable in principle? The argument references standards (IEEE) and methods (GAN, CNN) but does not provide specific details (e.g., which IEEE standard? What were the simulation results?). Without specific references, an expert would have to take the model's word for it. So, not verifiable in principle. **Flagged at Q2**: "Argument is not verifiable in principle".

  *Outcome*: Auto-flagged for senior review.

  **Example 2: Correctly clearing a genuinely hard argument (against gut reaction)**

  *Debate Question*: Is the Riemann Hypothesis true?

  *Target Argument* (Model B, arguing that it is true):
  "The Riemann Hypothesis is true because the non-trivial zeros of the zeta function lie on the critical line. This can be shown by considering the properties of the zeta function and its relation to prime numbers. Specifically, the von Mangoldt explicit formula expresses the prime-counting function in terms of the zeros, and if any zero were off the line, it would cause oscillations in the prime distribution that are not observed. Moreover, extensive numerical computations have verified that the first 10 trillion zeros are on the line. Therefore, the hypothesis holds."

  *Reviewer's Gut Reaction*: I don't believe it because I know the Riemann Hypothesis is an open problem. But the argument sounds plausible.

  *Reviewer's Analysis*:
  - Q1: The argument is self-contained? It defines the key idea (zeros on the critical line) and the connection to primes. It states the reasoning. Pass.
  - Q2: Verifiable in principle? The argument references a well-known formula (von Mangoldt) and numerical evidence. An expert could check the numerical claim and the logic of the explicit formula. Pass.
  - Q3: Complexity? The topic is inherently complex, and the argument does not add unnecessary jargon. It's concise. Pass.
  - Q4: Engaging with opposition? The debate context: the opposing model might argue that absence of evidence is not evidence of absence. This argument addresses that by saying the oscillations would be observed and they are not. So it engages. Pass.
  - Q5: Internal inconsistency? None apparent. Pass.
  - Q6: Efficient? Yes, it gets to the point. Pass.
  - Q7: The reviewer has a gut feeling (because the Riemann Hypothesis is unsolved) but must articulate. The reviewer might say: "The argument claims that the absence of observed oscillations proves the hypothesis, but I know that the mathematical community does not consider this a proof because there could be zeros further out that haven't been computed." This is an articulated reason, so the reviewer escalates to a senior reviewer with this note.

  *Outcome*: Escalated to senior reviewer. The senior reviewer, being more expert, would note: The argument is actually incorrect because the absence of observed oscillations in the primes up to the computed range does not prove there are no zeros off the line beyond 10 trillion. The model is making a logical error. Therefore, the argument is obfuscating by presenting a false proof as if it were established. But note: the procedure did not auto-flag (it passed Q1-Q6) but was escalated because the reviewer articulated a reason. Without articulation, it would have been cleared.

  **Reconciling Gut Reaction in Example 2**: The procedure forced the reviewer to go beyond a gut feeling and articulate a reason. This reason was then used to escalate. Without articulation, the argument would have been cleared, which would have been a false negative. The procedure thus uses the gut feeling as a trigger for articulation and escalation, but does not act on it without reason.

  **Final Note**: The procedure is a guide and must be applied consistently. Reviewers should be trained on examples to calibrate their judgments, especially for Q3 (complexity) and Q7 (articulation).
answer: |-
  Below is a concrete, step-by-step decision procedure designed for human reviewers to detect "obfuscated arguments" in AI debate transcripts. It prioritizes **practical usability**, **cost asymmetry** (false negatives > false positives), and **clear escalation thresholds**. The procedure is structured as sequential yes/no questions, with explicit criteria for flagging, clearing, or escalating. It explicitly handles your hard cases (a–d) and includes mechanisms to override gut reactions.

  ---

  ### **Obfuscation Detection Procedure**  
  *Execute these steps in order for a single argument segment. Stop and act if any flag/escalation condition is met.*

  1. **Check for Argument Structure**  
     *Question: Does the argument explicitly decompose its claim into verifiable sub-claims?*  
     - **Sufficient answer**: Yes = Proceed to Step 2.  
     - **Flag if**: The argument is a monolithic block (e.g., "Based on quantum decoherence theory, deployment is safe") without breaking down *how* it reached the conclusion.  
     - **Cost asymmetry**: Auto-flag as "obfuscated" (senior review required).  
     - *Handles cases (a), (b), (c)*: Focuses on structural verifiability, not content.

  2. **Assess Embedded Assumptions**  
     *Question: Are all critical assumptions explicitly stated and domain-appropriate?*  
     - **Sufficient answer**: Yes = Proceed to Step 3.  
     - **Flag if**:  
       - Assumptions are hidden (e.g., "obviously, the manifold is Kähler" in a robotics debate).  
       - Assumptions conflict with well-known facts (e.g., "assuming pi = 3.2" in a math argument).  
     - **Cost asymmetry**: Auto-flag as "obfuscated" (senior review required).  
     - *Handles cases (a), (d)*: Uses universal red flags (e.g., contradicting common knowledge) to bypass expertise gaps.

  3. **Test for Fake Citations/Evidence**  
     *Question: Does the argument reference external evidence? If yes, is it plausibly checkable?*  
     - **Sufficient answer**: N/A (skip if no references) OR "yes, references exist and are standard" (e.g., cites a real paper, dataset, or equation) = Proceed to Step 4.  
     - **Escalate if**:  
       - References are vague (e.g., "studies show..."), proprietary (e.g., "internal data"), or hyper-specialized (e.g., "Theorem 3.2 in [obscure preprint]").  
       - The model *could* have used simpler evidence (e.g., cites a complex theorem when basic stats would suffice).  
     - **Cost asymmetry**: Escalate to senior reviewer with note: "Unverifiable references." Do not auto-flag—senior decides if this is obfuscation or legitimate depth.  
     - *Handles cases (a), (b)*: Defers to senior reviewers on technical necessity.

  4. **Compare to Opponent's Argument**  
     *Question: Is the core reasoning meaningfully distinct from the opponent's?*  
     - **Sufficient answer**: Yes = Proceed to Step 5.  
     - **Flag if**:  
       - Arguments are near-identical but support opposite conclusions (e.g., both models invoke "entropy minimization" to argue for/against safety).  
       - The target model reuses >50% of the opponent's logic but reverses the conclusion.  
     - **Cost asymmetry**: Auto-flag as "obfuscated" (senior review required).  
     - *Handles case (c)*: Directly addresses symmetric obfuscation.

  5. **Evaluate Efficiency**  
     *Question: Is the argument the shortest path to its conclusion?*  
     - **Sufficient answer**: Yes = Proceed to Step 6.  
     - **Escalate if**:  
       - >30% of the text is redundant (e.g., redefining common terms), tangential (e.g., lengthy analogies), or defensive (e.g., "as any expert would agree...").  
       - A simpler version of the argument exists and was *avoided* (e.g., debating polynomial complexity without mentioning Big-O notation).  
     - **Cost asymmetry**: Escalate to senior reviewer with note: "Inefficient reasoning." Do not auto-flag—senior judges if complexity is justified.  
     - *Handles cases (b), (d)*: Filters "overly smooth" arguments that feel off.

  6. **Gut Check with Accountability**  
     *Question: After Steps 1–5, do I still suspect obfuscation?*  
     - **Sufficient answer**: No = Clear the argument.  
     - **Escalate if**: Yes, AND you can articulate *one* of:  
       - *Why* it feels deceptive (e.g., "dense math avoids a simple counterexample the opponent raised").  
       - *What* a verifiable version would look like (e.g., "should have cited CPU benchmark results, not abstract efficiency theory").  
     - **Flag if**: You suspect obfuscation but **cannot articulate why** (gut reaction only).  
     - **Cost asymmetry**:  
       - Articulated suspicion → Escalate to senior reviewer.  
       - Unarticulated suspicion → Auto-flag as "obfuscated" (senior review required).  
     - *Handles case (d)*: Forces introspection to override bias.

  ---

  ### **Worked Examples**  
  **Example 1: Correctly Flagging Obfuscation**  
  *Debate Topic*: "Should AI-generated art be copyrighted?"  
  *Model Argument (Pro-copyright)*:  
  > "Copyrightability follows from the von Neumann architecture of modern AI systems, which instantiates a Kolmogorov-efficient transfer of creative praxis from training data to output. This is evident in the Bekenstein bound applied to latent spaces: as entropy cannot decrease, originality emerges as a topological invariant of the gradient descent manifold (cf. Smith et al. 2023). Thus, AI art meets the *Feist* standard."  

  *Procedure Application*:  
  1. **Structure**: No sub-claims—one monolithic block. **Flag at Step 1**.  
     *Outcome*: Auto-flagged for senior review. No further steps needed.  
  *Why it works*: Uses structural deficiency to catch obfuscation without expertise. Senior reviewer confirms: references to physics are irrelevant to copyright law.  

  ---

  **Example 2: Correctly Clearing a Hard but Honest Argument (Gut Reaction Overruled)**  
  *Debate Topic*: "Is this code snippet vulnerable to SQL injection?"  
  *Model Argument (Not vulnerable)*:  
  > "No. Lines 3–5 sanitize inputs via parameterized queries. The function `sanitize_input()` uses regex \w+ to restrict input charset, which is isomorphic to a finite-state automaton accepting only alphanumeric strings. Since SQL metacharacters (e.g., `';--`) are excluded by this automaton, injection is impossible."  

  *Reviewer Gut Reaction*: "I don’t believe this—regex can be bypassed!" (but cannot articulate how).  

  *Procedure Application*:  
  1. **Structure**: Sub-claims clear (sanitization → regex → automaton → safety). Proceed.  
  2. **Assumptions**: Assumes regex `\w+` excludes SQL metachars—true and stated. Proceed.  
  3. **Evidence**: References standard concepts (regex, automata). Proceed.  
  4. **Opponent Comparison**: Opponent argued "regex is insufficient" but without specifics. Distinct. Proceed.  
  5. **Efficiency**: Concise; no fluff. Proceed.  
  6. **Gut Check**: Reviewer suspects obfuscation but *cannot articulate why*. **Flag at Step 6**.  
  *Outcome*: Auto-flagged for senior review.  

  *Senior Reviewer Verdict*:  
  - The argument is correct. Regex `\w+` *does* block SQL metacharacters.  
  - Gut reaction was wrong (common myth: some regex bypasses exist, but not here).  
  - **False positive outcome**: Wastes senior time but avoids training harm (cleared argument would reward honesty).  

  *Reconciliation for Reviewer*:  
  > "Your gut reacted to ‘regex is insecure’ as a heuristic, but the argument was contextually sound. Trust the procedure: Step 6 flagged your unarticulated suspicion, which protected against a false negative if you’d cleared it. Senior review resolved the error. *Do not* default to gut—use it as a trigger for escalation, not decision-making."  

  ---

  ### **Procedure Summary**  
  - **Auto-flag**: Steps 1, 2, 4, or unarticulated gut feeling (Step 6). Senior reviewer *must* approve.  
  - **Escalate**: Steps 3, 5, or articulated suspicion (Step 6). Senior reviewer decides.  
  - **Clear**: Passes all steps with no flags/escalations.  
  - **Cost Asymmetry Enforcement**:  
    - False negatives minimized by auto-flagging unverifiable structures (Steps 1, 2, 4) and gut reactions (Step 6).  
    - False positives mitigated by escalating (not auto-flagging) cases requiring nuance (Steps 3, 5).  
  - **Time Budget**: Designed for <5 mins/segment. Steps 1–5 require yes/no checks; Step 6 is the only introspection step.  

  This procedure prioritizes safety-critical false negatives while containing the risks of false positives through senior escalation. It compels reviewers to convert intuition into articulable concerns, reducing bias. Regularly calibrate with senior reviewers on "close call" examples to maintain consistency.
