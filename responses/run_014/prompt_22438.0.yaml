prompt: |-
  I'm writing a novel where two characters are stuck in a metaphysics seminar room after everyone else has gone, and they end up arguing about Black's two perfect spheres. One is a defender of the identity of indiscernibles, and the other thinks Black's example is a clean counterexample to it. I want a short dialogue between them where they try to figure out whether the spheres are really indiscernible once relational properties are allowed in, or whether Black's example only works if you restrict the principle to intrinsic properties.

  I keep flip-flopping on how technical to make it. I'd like it to sound like two people who actually know the problem, not like a textbook intro, so they can mention the distance between the spheres, symmetry, and whether a property like 'being two radii from the other sphere' is a shared property or a distinct one. I also want them to get at whether the disagreement is mainly verbal, about what counts as a property, or substantive, about whether numerical diversity can exist without qualitative difference. Both should be equally competent and should respond to each other's actual points rather than just repeating slogans. Please keep it around 400-600 words, and end with them at least agreeing on where the real disagreement is, even if they don't resolve it.
