  ## Term Paper Proposal: Dominance-Compliant Generalized Expectations and the Pasadena Paradox

  **1. Title:** The Impossibility of Dominance-Compliant Summative Expectations: Resolving (or Reframing) the Pasadena Paradox

  **2. Core Question:** Does there exist a generalized expectation operator E*, defined over all finite-variance lotteries (or all lotteries with countable outcomes), satisfying the following properties simultaneously?
      *   **(Consistency with EV):** If the standard expected value E[L] exists (i.e., the series ∑ p_i * v_i converges absolutely), then E*[L] = E[L].
      *   **(Summative):** E*[L] is determined by a summation method applied to the series ∑ p_i * v_i. That is, E*[L] = S(∑ p_i * v_i), where S is a linear summation method (e.g., Cesàro, Abel, Borel) assigning a generalized sum to divergent series.
      *   **(Dominance Compliance):** If lottery A statewise dominates lottery B (i.e., for every possible outcome state, A yields at least as good a consequence as B, and strictly better in some state with positive probability), then E*[A] > E*[B].
      *   **(Finiteness):** E*[L] is finite for all lotteries in its domain.

  **3. Why the Standard Treatment is Insufficient & Why This Question Bites:**
  The standard analysis correctly identifies the divergence of the expected utility series as the source of the paradox. Standard resolutions typically:
      *   **Restrict EV Maximization:** Advise only applying EV to lotteries where it converges absolutely (e.g., Nover & Hájek). This avoids contradiction but feels like giving up; it declares the Pasadena lottery inherently incomparable, failing to capture robust intuitions about dominance in the modified case.
      *   **Invoke Conditional Expectation:** Analyze the lottery conditional on stopping after N flips, taking the limit of these expectations (e.g., Colyvan). While insightful, this sequence oscillates and doesn't yield a single, context-independent value for the *unconditional* lottery.
      *   **Appeal to Refined Principles:** Utilize concepts like weak dominance, stochastic dominance, or tail events (e.g., Bartha). These are valuable but sidestep the core mathematical question: *Can we assign a single, context-independent, generalized expected value that captures both the raw payout structure and respects dominance?*
      *   **Discuss Decision Rules:** Propose rules like "choose the modified lottery" based on finite truncations or other heuristics (e.g., Easwaran). These are pragmatic but lack the normative foundation of a well-defined expectation operator.

  **These approaches do not directly confront the user's insight:** The Pasadena lottery is a well-defined probability space. The problem is purely the *summation* of the expectation series. Summation methods exist to handle divergent series. The crucial, unaddressed question is whether *any* such method can yield a generalized expectation that also satisfies the fundamental decision-theoretic principle of statewise dominance. This question probes the *deep compatibility* between the mathematical structure of divergent series and the normative force of dominance in rational choice.

  **4. Proposed Approach (Section-by-Section):**

  *   **I. Introduction: The Pasadena Paradox & The Limits of Standard EV**
      *   Briefly present the original and modified Pasadena lotteries.
      *   Reiterate the paradox: Undefined standard EV, dominance intuition favoring the modified lottery.
      *   Critique standard resolutions: Highlight their limitations in providing a single, dominance-compliant value.
      *   Motivate the core question: Can a summative generalized EV (GEV) satisfy Consistency, Summative (via a linear method), Dominance Compliance, and Finiteness? State this precisely.

  *   **II. Mathematical Machinery: Summation Methods & Generalized Expectations**
      *   Define key linear summation methods: Cesàro (C,1), Abel, Borel. Explain their properties (regularity, linearity, stability).
      *   Define the concept of a Generalized Expectation Operator E* formally, specifying its domain (e.g., all simple lotteries or lotteries with ∑ p_i v_i^2 < ∞).
      *   Formalize the required properties (Consistency, Summative - linking E* to a specific S, Dominance Compliance, Finiteness, Linearity).
      *   *Focus:* Establish that for the Pasadena lottery L and its modified version M, *different* summation methods yield *different* values (e.g., Cesàro might give one value, Abel another), but crucially, *none* naturally assign M a higher value than L under the *same* method? (Preliminary calculation).

  *   **III. Testing the Hypothesis: Applying Summation Methods to Pasadena & Modified Pasadena**
      *   Calculate S(∑ p_i v_i) for L (Original Pasadena) under Cesàro, Abel, Borel.
      *   Calculate S(∑ p_i v_i) for M (Modified Pasadena: payoff = $2 on first heads, otherwise (-1)^n 2^n) under the *same* methods.
      *   **Critical Analysis:** Compare E*[L] and E*[M] for each method S. Does E*[M] > E*[L] hold for *any* standard linear summation method? (Spoiler: Likely not, or only ambiguously). Demonstrate the calculations clearly.

  *   **IV. The Heart of the Matter: Dominance Compliance vs. Summation**
      *   **The Conflict:** Statewise dominance between M and L is clear (M pays $2 > $1 on first heads, identical otherwise). Therefore, Dominance Compliance *requires* E*[M] > E*[L].
      *   **The Obstruction:** Show that for standard linear summation methods (Cesàro, Abel, Borel), E*[M] - E*[L] = S(∑ (p_i * (v_i^M - v_i^L))). The difference series is (1/2)*$1 + 0 + 0 + 0 + ... = 1/2. Crucially, *this series converges absolutely to 1/2*. Any regular summation method *must* assign this difference sum 1/2. Therefore, E*[M] - E*[L] = 1/2 > 0, satisfying Dominance Compliance *for this specific pair*, *regardless* of the summation method used for the individual lotteries, *provided the method is linear and regular*.
      *   **The Twist:** This seems promising! However, the problem lies not with M vs. L specifically, but with whether the *same* summation method S can consistently assign values to *all* lotteries while respecting dominance *universally*. The properties required of E* (Linearity + Dominance Compliance) might conflict when applied to other lotteries or rearrangements.

  *   **V. The Impossibility Result: Pinpointing the Obstruction**
      *   **Core Argument:** Linearity of E* (inherited from the linearity of S) combined with Dominance Compliance implies that E* must respect statewise dominance *and* be linear. However, statewise dominance implies a strong form of monotonicity.
      *   **The Counterexample Construction:** The fundamental obstruction likely arises from the sensitivity of summation methods to rearrangement. Construct two lotteries A and B:
          *   A: Pays $1 on outcome 1, $0 elsewhere.
          *   B: A carefully constructed lottery using payoffs inspired by the Pasadena structure but rearranged, such that:
              *   B statewise dominates A (or is dominated by A? Need care).
              *   The difference series ∑ p_i (v_i^B - v_i^A) converges absolutely to some value C ≠ 0.
              *   However, due to the rearrangement sensitivity of the summation method S applied to B itself, E*[B] might be "pulled" in a direction inconsistent with the absolute convergence of the difference series and the dominance relation.
      *   **Alternative Path - Banach Limits:** Acknowledge that more powerful summation devices like Banach limits (extending the limit functional) exist on bounded sequences. Could a Banach limit define E*? Discuss the trade-off: Banach limits can satisfy Consistency, Linearity, and assign finite values. However:
          *   They are highly non-constructive (dependent on the Axiom of Choice).
          *   Critically, they are **not** rearrangement-invariant. Demonstrate that a Banach limit applied to the Pasadena series can be made to yield *any* value within its oscillation range (roughly -∞ to ∞?) by suitable rearrangement. This directly violates Dominance Compliance – a rearrangement of the *same* physical lottery could be assigned a value arbitrarily higher or lower than a dominating lottery.
      *   **Conclusion of Section:** Prove rigorously (or argue convincingly) that *no* linear summation method S can yield an E* that satisfies Consistency, Linearity, Finiteness, *and* universal Dominance Compliance. The obstruction is the **incompatibility between linearity, dominance-induced monotonicity, and the rearrangement sensitivity inherent in summing conditionally convergent (or oscillating divergent) series.**

  *   **VI. Implications & Resolution: Living with the Limitation**
      *   Summarize the finding: A dominance-compliant, linear, summative GEV is impossible.
      *   Re-evaluate the paradox: The core issue is not *just* divergence, but the **fundamental tension between the linear structure of expectation (inherited from the probability space) and the robust normative principle of dominance when dealing with pathologically oscillating values.** Absolute convergence is required to harmonize these.
      *   Discuss implications for decision theory:
          *   Strengthens the case for restricting EV to absolutely convergent cases.
          *   Highlights the power and limitations of dominance (it's robust but requires careful handling with unbounded/oscillating utilities).
          *   Suggests alternatives like cautious choice (e.g., minimizing maximum regret) or context-dependent evaluation (e.g., resource-bounded truncation) might be more appropriate for such lotteries than seeking a single GEV.
          *   Clarifies why modified Pasadena is "better": Not because a GEV says so, but because dominance holds *directly* and the *difference* has a well-defined, positive EV.

  *   **VII. Conclusion**
      *   Recap the journey from the initial hope for a GEV to the impossibility result.
      *   Emphasize the precise nature of the obstruction: Rearrangement sensitivity under linear summation vs. the absolute requirements of dominance.
      *   Reflect on the significance for understanding rational choice under complex uncertainty.

  **5. Possible Conclusions & Deciding Factors:**

  1.  **Impossibility Confirmed:** The most likely outcome. This is decided by successfully constructing a counterexample pair (A, B) where dominance clearly holds but *any* proposed linear summative E* fails E*[A] > E*[B] (or vice versa), *or* by rigorously demonstrating that Banach limits (the most general linear extension) necessarily violate dominance due to rearrangement sensitivity. Calculations in Sections III & IV and the argument in Section V are decisive.
  2.  **A Specific Method Works (Unlikely):** If, against expectations, a specific summation method (e.g., a particular weighted average of Cesàro means) yields E*[M] > E*[L] *and* survives the counterexample test in Section V for all possible A and B, this would be a significant finding. It would require meticulously defining the method, proving its linearity and regularity, and rigorously demonstrating universal dominance compliance.
  3.  **Impossibility for Summative, Possibility for Non-Summative:** The analysis might show that *summative* GEVs fail, but leave open whether non-summative generalized expectations (e.g., based on risk metrics, Choquet integrals, or other non-linear functionals) could satisfy dominance. This would pivot the conclusion towards characterizing the requirement.

  **6. Feasibility Assessment & Risks:**

  *   **Tractable:**
      *   Defining properties and summation methods is standard.
      *   Calculating Cesàro/Abel/Borel sums for Pasadena/modified Pasadena is manageable.
      *   Showing E*[M] - E*[L] = 1/2 for any regular linear S is straightforward.
      *   Explaining rearrangement sensitivity of conditionally convergent series and Banach limits is well-established (needs clear exposition).
      *   Articulating the *conceptual* incompatibility (linearity + dominance vs. rearrangement) is core and achievable.
  *   **Potential Pitfalls (Scope Creep):**
      *   **Constructing the Perfect Counterexample:** Finding the simplest, most convincing pair (A, B) demonstrating the dominance violation under *any* summative E* might take time. Start simple (e.g., rearrangements of Pasadena itself vs. a constant).
      *   **Banach Limit Rigor:** Providing a fully rigorous, self-contained proof that Banach limits violate dominance due to rearrangement might involve advanced functional analysis (Hahn-Banach theorem, ℓ^∞ duality). **Mitigation:** Cite key results (e.g., that Banach limits aren't rearrangement-invariant) and focus on the conceptual argument and implications. Don't get bogged down in proving the existence properties of Banach limits from ZFC+AC.
      *   **Venturing into Non-Linear Methods:** Exploring non-summative GEVs in depth would blow the scope. **Mitigation:** Strictly limit the scope to *summative* (series-based) methods. Mention non-linear alternatives only briefly in the implications.
      *   **Empirical/Behavioral Angles:** Investigating how humans perceive these lotteries is fascinating but orthogonal to the normative, formal question. **Mitigation:** Exclude.
  *   **Realistic Semester Goal:** Successfully arguing for the impossibility of a summative, dominance-compliant GEV, using the Pasadena/modified pair and the difference argument, supplemented by the rearrangement challenge and the Banach limit issue, is a challenging but achievable goal for a 6000-word seminar paper. Constructing one clear counterexample pair (A, B) is crucial for this. Proving impossibility in the absolute most general sense might be ambitious, but proving it for all standard methods and demonstrating the fundamental conflict is sufficient.

  **In essence:** Your pivot is excellent. It moves beyond restating the paradox to probing a deep, formally precise, and underexplored foundational question. The likely conclusion – that dominance compliance and linear summative expectations are incompatible for oscillating lotteries – is significant. It clarifies the necessity of the absolute convergence requirement for standard EV and reframes the paradox as highlighting an intrinsic limitation in reconciling linear valuation with robust dominance when values oscillate pathologically. Focus on constructing that counterexample! This is a worthy and tractable investigation for a graduate term paper.
