  Okay, the user is a third-year philosophy PhD student focusing on the extended mind thesis. They need a narrative scenario that serves as a test case to discriminate between different philosophical positions, not just illustrate one. The protagonist is a field ecologist with early-onset amnestic deficits who relies on an external system—a red notebook, index cards, and fixed routines. The key is that the notebook has been tampered with, leading her to act based on altered information, but this isn't revealed until the end.

  The user wants the philosophical debate—whether the notebook is part of her mind or just a tool—to emerge through the plot and prose without explicit lecturing. The ending must stay ambiguous between the notebook being part of her person versus just a tool. Conditions like availability, reliability, and trust need to be woven in subtly. 

  I need to build a story where the notebook's integration into her daily life shows reliance: her routines, how she handles it physically (like it's an extension of herself), and the emotional weight it carries. The tampering should disrupt this, causing a professional mistake (wrong coordinates leading to a wasted expedition) and a personal crisis (doubting her identity as the "Keeper of the Wood"). 

  The ambiguity hinges on her reaction: her visceral horror and identity crisis suggest the notebook is part of her self, while her meticulous transcription ritual frames it as a tool. Details like her not questioning entries (trust/reliability) and the system's role in her cognition (availability) should highlight the extended mind debate. The ending leaves the interpretation open—violation of self or tool—without resolving it.
