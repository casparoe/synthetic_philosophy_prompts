  1. **Ex-ante commitment vs. step-by-step re-optimization**:
     - If you let the agent re-optimize at each step, it will use the same policy at every step because it cannot distinguish the steps. This leads to a time-consistent policy but might be suboptimal compared to the ex-ante optimal plan that requires stage-dependent actions.
     - However, if you can commit ex-ante to a sequence of actions, you can achieve the stage-dependent policy. But without a commitment device, the agent will re-optimize at each step and end up with the same action at every step.

