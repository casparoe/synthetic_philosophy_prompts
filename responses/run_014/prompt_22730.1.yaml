     - You must design the agent's policy to be stage-independent (if the agent cannot observe the stage). That means you are looking for a fixed action (or a fixed probability distribution over actions) that is applied at every stage.
     - In the absent-minded driver example, the optimal fixed action is to "continue" because:
          - If the driver always continues, they get 1 (at the end).
          - If they always exit, they get 0 (if they exit at the first) and 0 (if they exit at the second) but note: at the first intersection, exiting gives 0, and at the second, exiting gives 4? Actually, in the classic problem, exiting at the second intersection is the goal. However, because the driver doesn't know the stage, if they choose to exit at every intersection, then they exit at the first and get 0. So the expected payoff of always exiting is 0. Always continuing gives 1. Therefore, always continuing is better.

     However, note that the driver might randomize. Let p be the probability of continuing at any intersection. Then:
          - With probability p, they continue at the first and then face the second intersection.
          - At the second intersection, again they continue with probability p (so exit with 1-p).
          - The total expected payoff is: 
              (1-p)*0   [exit at first] 
              + p*( (1-p)*4 + p*1 ) [continue at first and then at second either exit or continue]
            = 0 + p*(4(1-p) + p) 
            = 4p(1-p) + p^2
            = 4p - 4p^2 + p^2 
            = 4p - 3p^2.

     Maximizing this: derivative is 4 - 6p. Set to zero: p = 4/6 = 2/3.
     Then the payoff is 4*(2/3) - 3*(4/9) = 8/3 - 12/9 = 8/3 - 4/3 = 4/3 ≈ 1.333, which is better than 1.

     So the optimal fixed (but randomized) policy is to continue with probability 2/3 at every intersection.

