prompt: |-
  Okay so I've been building a sequential decision agent with a really small memory buffer and I keep running into what I think is the absent-minded driver problem. Basically the agent has to make a bunch of decisions in a row but sometimes it loses track of which one it's on, and a policy that looks optimal when I plan it all out in advance stops looking optiaml when I evaluate it step by step, because at any given step the agent can't tell if it's already made that decision. What are the most important implications of this for how I should actually design the planning and commitment? Like does it mean I should always commit ex ante and never let the agent re-optimize at each step, or is there a way to make the step by step choices line up with the original plan? Trying to figure out what this means for a system where I can't just hard-code a commitment device in.
