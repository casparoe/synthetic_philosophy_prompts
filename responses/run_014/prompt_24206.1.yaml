answer: |-
  ### Exam Question (90 minutes)
  **Williams argues that consequentialism alienates agents from their deepest commitments by demanding “one thought too many” (e.g., George’s project refusal). Explain how this integrity objection *logically depends* on Williams’s internalist theory of reasons (where reasons must link to the agent’s “subjective motivational set”). Then, assess the objection’s force: if we reject internalism and accept externalism (where reasons can exist independently of an agent’s motivations), does the integrity objection successfully *refute* consequentialism, or does it merely highlight a *contingent* psychological conflict between consequentialism and human attachments? Defend your view.**  

  ---

  ### Model Answer (Approx. 600 words)  
  Williams’s integrity objection contends that consequentialism requires agents to subordinate their deepest personal projects (like George’s pacifism) to impersonal moral calculus, generating a destructive alienation: the agent must have the “one thought too many” about overall consequences, displacing their authentic commitment. Crucially, this objection’s core *logical structure* relies on Williams’s internalism about reasons. Internalism holds that a reason for an agent to φ must be grounded in some element of their existing “subjective motivational set” (S). If S contains no element that could, via sound deliberation, motivate φ-ing, then the agent has *no reason* to φ. For Williams, George’s reason to refuse the job stems solely from his pacifist project within S; the consequentialist demand that he calculate net harms introduces an *external* reason – alien to S – which lacks genuine normative force *for George*. The “one thought too many” is objectionable *because* it represents an illegitimate, motivationally inert demand masquerading as a reason. Without internalism, the objection loses its bite: if the consequentialist thought is an *alien* reason, internalism declares it *not a reason at all*.  

  Rejecting internalism for externalism fundamentally alters the objection’s impact. Externalism allows that genuine normative reasons can exist independently of an agent’s current motivations. On this view, the consequentialist demand (e.g., to take the job to prevent worse harm) *could* be a genuine reason for George, even if it conflicts with his projects and feels alienating. The “one thought too many” remains psychologically burdensome, but its normative validity isn’t negated; it’s simply unwelcome. Consequently, the integrity objection shifts from a *logical* critique of consequentialism’s coherence to an *empirical* claim about its *psychological costs*. It shows that acting on consequentialist reasons may often involve painful detachment from cherished commitments, a cost externalists acknowledge but deem outweighed by the reasons’ objectivity.  

  This reveals the second flaw in claiming the objection *refutes* consequentialism. Even granting internalism, the objection demonstrates a clash between consequentialism and *contingent* features of human psychology – namely, our deep, identity-constituting attachments. Humans are psychologically constituted such that overriding core projects for impersonal good feels existentially damaging. However, this is not a necessary truth about agency *as such*. A being without such attachments (e.g., an ideal impartial spectator) could act consequentially without alienation. Consequentialism isn’t logically incoherent; it’s psychologically demanding for beings like us. Williams’s objection powerfully exposes this demand but doesn’t show consequentialism generates a *contradiction* within practical reason. It highlights a tragic conflict between moral requirements (if consequentialism is correct) and human flourishing, not a flaw in the theory’s internal logic. Therefore, while the integrity objection is devastating *if internalism is true and deep projects are non-negotiable*, it fails as a conclusive refutation. Under externalism, it becomes a sobering reminder of the personal cost impersonal morality may impose, not proof of its falsehood.  

  ---

  ### Marking Scheme (Total 30 marks)  
  **Must-Hit Points:**  
  1.  **Understanding Internalism’s Role (5 marks):** *Accurately explains how the objection requires internalism to deem the consequentialist thought “alien” and thus not a genuine reason.*  
      *   *Common Mistake:* Merely describing the objection or defining internalism without linking them logically.  
  2.  **Externalist Challenge (5 marks):** *Clearly articulates how accepting externalism severs the link between “alien” and “not a reason,” transforming the objection.*  
      *   *Common Mistake:* Stating externalism allows alien reasons but not explaining *how* this undermines the objection’s core normative claim.  
  3.  **Refutation vs. Contingency Distinction (5 marks):** *Correctly identifies that the objection reveals a psychological conflict (alienation due to attachments) rather than a logical flaw in consequentialism.*  
      *   *Common Mistake:* Conflating psychological difficulty with logical refutation or vice-versa.  
  4.  **Argument Against Refutation (5 marks):** *Argues persuasively that the objection fails as a refutation because the conflict stems from contingent human psychology, not necessary features of agency or consequentialist logic.*  
      *   *Common Mistake:* Asserting the point without supporting argument or relevant example.  
  5.  **Force of Objection Post-Externalism (5 marks):** *Assesses the *residual* force of the objection under externalism (e.g., highlighting severe psychological costs/practical conflicts) without claiming it invalidates consequentialism.*  
      *   *Common Mistake:* Claiming externalism makes the objection vanish entirely or that it remains a full refutation.  
  6.  **Structure, Clarity & Originality (5 marks):** *Well-organized, precise argument; avoids mere description; offers insightful synthesis.*  
      *   *Common Mistake:* Disjointed flow, excessive summary, lack of critical engagement.  

  **A vs. B Answer Distinction:**  
  *   **A Answer (26-30 marks):** **Must explicitly demonstrate the *logical dependency* of the alienation charge on internalism** (Point 1) **and must explicitly argue that the clash with attachments is *contingent*, thus failing as a *refutation* even on internalist terms** (Points 3 & 4).  
  *   **B Answer (21-25 marks):** Identifies internalism and externalism correctly and discusses the psychological cost, but **fails to rigorously establish the *logical dependency*** of the objection on internalism **or fails to explicitly articulate why the contingent nature of the conflict prevents it from being a refutation** (may describe instead of argue).
