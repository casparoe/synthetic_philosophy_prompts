answer: |-
  ## Frequently Asked Questions: Underwriting Methodology

  **Introduction**
  Welcome to the Underwriting Assistance Hub of [Firm Name]. As a specialist liability insurer, we employ a rigorous and transparent methodology to assess risk. Unlike firms relying on conventional probabilistic models, we utilise a Committee-Based Credence Framework (CBCF). This approach provides a more nuanced representation of uncertainty, reflecting the complex nature of real-world liabilities. Below are answers to common queries regarding our methodology and its application. For detailed technical specifications, please consult Methodology Note MN-001: *Foundations of Committee-Based Credence*.

  **FAQ**

  1.  **Why has [Firm Name] never actually issued an insurance policy?**
      Our commitment to robust risk assessment means we only proceed when our entire Committee of probability functions finds a premium acceptable. This requirement of unanimity, detailed in Methodology Note MN-002: *Unanimity Decision Rule*, ensures we never take a position that any component of our considered belief structure deems unfavourable. While this standard is exacting, it guarantees that any policy offered meets the strictest internal criteria for fairness and sustainability. The absence of issued policies to date reflects the inherent complexity of liability risks and the strength of our commitment to prudence.

  2.  **How do you set your premiums? I see a range, not a single price.**
      We publish a range of odds for any insured event, representing the span of valuations from every member of our Committee. Each Committee member assigns a precise price (in £ per £1 stake) at which they would buy or sell coverage. Our published range is the band *between* the highest price any member would pay to *buy* coverage and the lowest price any member would demand to *sell* it. Within this band, the Committee, taken as a whole, takes no position. Therefore, we neither offer policies at premiums falling strictly within this band nor solicit them. Premiums are only quoted for risks where the required premium falls outside the published band, satisfying the Unanimity Rule.

  3.  **Your competitors quote single premiums. Why do you only give a range? Isn't one number simpler?**
      Simplicity can obscure complexity. Competitors assign a single, precise probability. We recognise that often, the available evidence does not justify such precision. Our range honestly represents the degree of uncertainty inherent in many liability assessments. We acknowledge that some clients experience Ambiguity Aversion – a preference for known, sharp odds even when those odds may be based on incomplete or contestable reasoning. This preference, while understandable, cannot be captured by any single, coherent probability assignment. Our approach prioritises epistemic integrity over simplicity.

  4.  **Explain the Committee. Is it just a group of people arguing?**
      No, the Committee is a formal, mathematical construct: a set of individual probability functions. Each member is a complete, internally coherent assignment of degrees of belief to every possible event relevant to our underwriting. Collectively, they represent the full scope of plausible interpretations of the available evidence. We do not presuppose that any single member is uniquely "correct"; the Committee embodies the imprecision warranted by our knowledge state.

  5.  **My broker said after you reviewed new safety data, your range for my factory flooding actually got *wider*. How can more information make you less certain?**
      This phenomenon, known within CBCF as "Credal Dilation," can occur when new evidence is deemed irrelevant to the specific hypothesis in question by *some* Committee members, but not all. The evidence may constrain the beliefs of some members regarding the hypothesis, while leaving others entirely unconstrained or even shifting their beliefs in divergent directions. The result is a widening of the overall range. This reflects the Committee's collective humility: acknowledging that evidence which seems irrelevant at first glance may, under certain plausible interpretations of the world, turn out to be relevant after all. It underscores the limits of our knowledge, even when that knowledge grows. See Methodology Note MN-003: *Irrelevance, Independence, and Dilation*.

  6.  **Isn't your range just a complicated way of saying you have a precise belief *about* what the range should be?**
      This is a common misunderstanding conflating imprecision with higher-order uncertainty. The Committee represents genuine first-order imprecision: we have not settled on a single probability function. We do not hold a sharp, precise belief that the "true" probability lies somewhere within the published range. To reduce our imprecise credence to a single, precise credence *about* the range would be to misrepresent the nature of our uncertainty. It would imply a level of confidence in the boundaries of the range that our methodology explicitly avoids. The imprecision is fundamental, not merely reported.

  7.  **You talk about 'imprecision', but this sounds like you just don't know what you think – like it's vague.**
      Imprecision and vagueness are distinct. Vagueness suggests there is no fact of the matter about what we believe. Imprecision, within CBCF, is different: *each* Committee member holds perfectly precise, definite beliefs. The "imprecision" arises because the *firm* has not committed to any single member as the sole arbiter of truth. There is a definite set of precise belief states we deem permissible; the range precisely delimits their collective valuation. We know exactly what we *could* believe; we have simply not selected one belief state to the exclusion of all others deemed plausible. Methodology Note MN-001 elaborates on this distinction.

  8.  **Couldn't you just average the Committee members' opinions to get a single number?**
      Averaging presupposes a specific weighting over the Committee members. Assigning such weights requires making assumptions about the relative plausibility of each member – essentially creating a new, sharp probability distribution *over* the Committee. CBCF deliberately avoids this step. We do not presuppose a privileged partition of possibilities that would justify a uniform weighting or any other specific averaging scheme. Different partitions yield different averages, and choosing one arbitrarily would undermine the methodology's commitment to representing the raw imprecision in the evidence. Our range reflects the disagreement directly, without imposing an artificial resolution.

  9.  **What does this actually mean for me? I just want to know if my house is likely to flood and what it will cost to insure.**
      Our methodology provides a transparent view of the band of odds within which we, as a firm, take no position on the risk of your house flooding. If your specific circumstances and our Committee's assessment result in a required premium falling *outside* this published band – meaning every Committee member agrees it is acceptable – then we would be able to offer a policy. Until such alignment occurs, we cannot responsibly commit capital. We recommend consulting competitors who employ sharp probabilities if you require a definitive quote immediately. Our value lies in the integrity of our assessment when we *are* able to act.

  10. **Will you ever change the Unanimity Rule? It seems very strict.**
      The Unanimity Rule is a core tenet of our CBCF implementation, chosen for its robustness and alignment with our commitment to avoiding undue risk exposure for both the firm and policyholders. While the Committee's credal state (the set of probability functions) describes our beliefs, the decision rule determines our actions. The CBCF framework allows for alternative rules (e.g., maximising minimum expected utility), but Unanimity best reflects our institutional risk tolerance and philosophical commitment to only acting when *all* permissible interpretations concur. This rule is fundamental to our operational identity. Methodology Note MN-002 details the rationale and alternatives considered.
