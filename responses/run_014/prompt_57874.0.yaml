  ### Diagnostic Decision Tree for Virtual Worlds Seminar

  #### Design Notes
  - **Case-Based Questions**: Three questions are derived from your stipulated cases (Longhouse, Lent Axe, Cornering).
  - **Plain Language**: All questions avoid technical terms and philosophical labels.
  - **Leaves**: The four specified outlooks are covered, plus a "Mixed/Other" category for unresolved or hybrid views.
  - **Logical Space First**: Questions isolate key distinctions (ontological status of virtual items, moral significance, source of obligations). Outlooks are mapped to answer combinations afterward.
  - **Unresolved Overlaps**: Fictionalism and Social Constructivism may overlap in some judgments (flagged below).

  ---

  #### Decision Tree (6 Yes/No Questions)
  1. **Longhouse Case**: After the server rollback deleted the communal meeting hall, would you say the students suffered a *real loss* (beyond just wasted time)?  
     - *Yes* → Go to Q2  
     - *No* → Go to Q5  

  2. **Lent Axe Case**: Was the borrower’s refusal to return the virtual axe *morally wrong*?  
     - *Yes* → Go to Q3  
     - *No* → **Leaf: Skepticism (S)**  

  3. **Cornering Case**: Was the cornering behavior (shouting, buzzing) an instance of *real harassment*?  
     - *Yes* → Go to Q4  
     - *No* → **Leaf: Mixed/Other**  

  4. **Abstract Principle**: Can a purely virtual object (e.g., the axe) be *truly owned or stolen*?  
     - *Yes* → Go to Q6  
     - *No* → **Leaf: Fictionalism (F)**  

  5. **Lent Axe Case (Revisited)**: Was the borrower’s refusal to return the virtual axe *morally wrong*?  
     - *Yes* → Go to Q4  
     - *No* → Go to Q3  

  6. **Abstract Principle**: Do obligations in virtual worlds (e.g., returning borrowed items) *depend entirely on the community’s shared practices*?  
     - *Yes* → **Leaf: Social Constructivism (SC)**  
     - *No* → **Leaf: Computational Realism (CR)**  

  ---

  #### Leaf Outlooks (Mapped to Answer Combinations)
  1. **Computational Realism (CR)**:  
     - *Path*: Q1=Y, Q2=Y, Q3=Y, Q4=Y, Q6=N  
     - *Description*: Virtual items are genuine computational objects; owning/damaging them is inherently meaningful. Harms (e.g., theft, harassment) are direct wrongs.  

  2. **Social Constructivism (SC)**:  
     - *Path*: Q1=Y, Q2=Y, Q3=Y, Q4=Y, Q6=Y  
     - *Description*: Virtual items derive value from community practices. Wrongs (e.g., axe theft, harassment) matter due to their impact on real relationships/trust.  

  3. **Fictionalism (F)**:  
     - *Path*: Q1=N, Q5=Y, Q4=N OR Q1=Y, Q2=Y, Q3=Y, Q4=N  
     - *Description*: Virtual items are imaginative props; wrongs signal character flaws (e.g., dishonesty in Lent Axe, aggression in Cornering).  

  4. **Skepticism (S)**:  
     - *Path*: Q1=Y, Q2=N OR Q1=N, Q5=N  
     - *Description*: Loss/wrong requires external consequence (e.g., reputational/financial harm). Virtual "theft" or "harassment" alone isn’t real.  

  5. **Mixed/Other**:  
     - *Paths*: All unresolved combinations (e.g., Q3=N, Q4=Y; Q1=N, Q5=Y, Q4=Y; Q2=N after Q1=Y).  
     - *Description*: Inconsistent or hybrid views (e.g., accepts harassment as real but not property; sees loss as real but obligations as fictional).  

  ---

  #### Unoccupied Combinations & Overlaps
  - **Incoherent/Unattractive Paths**:  
    - *Q1=N, Q5=N, Q3=Y*: Denies real loss in Longhouse and wrong in Lent Axe but affirms harassment in Cornering. Ignores consistency in harm assessment.  
    - *Q1=Y, Q2=N, Q3=Y*: Claims real loss in Longhouse but no wrong in Lent Axe, yet affirms harassment. Fails to distinguish property from personal harm.  
  - **Unresolved Overlap**:  
    - *Fictionalism (F) and Social Constructivism (SC)*: Both may agree on Q2=Y (Lent Axe wrong) and Q3=Y (Cornering harassment) but for different reasons. The tree separates them via Q4 (property realism) and Q6 (community-dependence), yet students who blend character-focused and community-focused reasoning may land in **Mixed/Other**.  

  ---

  ### Reflexive Note: Weakest Branch & Failure Points
  **Branch of Least Confidence**: **Q6 (Community-Dependence of Obligations)**  
  - **Why?** The distinction between Computational Realism (CR) and Social Constructivism (SC) risks false separation. CR could concede that communities *mediate* obligations (e.g., defining ownership rules) while insisting virtual objects have intrinsic status. Conversely, SC might argue community practices *create* (not just mediate) obligations, but students may not grasp this nuance.  
  - **Counterexample Prompting Redraw**:  
    - If students consistently answer Q6=Y *and* affirm computational realism (e.g., "The axe is objectively stealable, but communities set the rules"), the tree mislabels them as SC.  
    - **Fix**: Replace Q6 with a case-based question, e.g., "If a community *stopped* valuing virtual items, would they lose all moral significance?" (Yes → SC; No → CR).  
  - **Failure Point in Logic**: Assuming obligations are either fully community-dependent (SC) or fully independent (CR) oversimplifies hybrid views. Students may see obligations as *jointly* grounded in code + community, landing them in **Mixed/Other** despite nuanced consistency.  

  **Overall Vulnerability**: The tree prioritizes clean branches over granularity. Real-world judgments are messy; the **Mixed/Other** leaf may be overpopulated, necessitating follow-up discussion. This is a feature, not a bug—it mirrors philosophy’s unresolved tensions.  

  ---  
  This tree isolates core intuitions using your cases while flagging ambiguities. Use the **Mixed/Other** category to spark debate about hybrid views!
