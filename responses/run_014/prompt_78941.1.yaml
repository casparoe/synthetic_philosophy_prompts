  First, I need to recall Strawson's argument clearly: ultimate moral responsibility is impossible because we're always shaped by prior causes we didn't choose. The Hinckley acquittal seems like a legal exception to responsibility-as-default, but Strawson would say everyone is equally non-responsible - including "ordinary" defendants. 

  The actio libera in causa doctrine (voluntarily entering an impaired state) feels like a regress-stopper, but it just shifts the blame one step back - why did you choose to get drunk? That choice itself was determined. 

  The post-Hinckley reform (shifting burden to defense, narrowing insanity tests) is fascinating. If Strawson is right, this isn't logical - it's society refusing to acknowledge the Basic Argument's implications. The fury reveals we instinctively believe in responsibility despite its philosophical impossibility. 

  The user's last question is crucial: does Hinckley prove Strawson's argument goes too far, or does the public reaction confirm it? I think the latter - the outrage shows our practice relies on responsibility as default even if our theory can't justify it. 

  This professor clearly wants to push students beyond surface-level anger. Their mention of "mapping properly" suggests they value precise philosophical application. The depth of their analysis tells me they'll appreciate wrestling with the reform's contradiction: a system trying to "solve" a problem that doesn't exist under determinism. 

  I should emphasize the irony - the legal system's concession to determinism (insanity defense) sparks outrage, while its retreat from that concession (reform) ignores the deeper problem. Strawson would say both sides miss the point: nobody is truly responsible.
answer: |-
  **Strawson's Basic Argument shows the Hinckley outrage and subsequent legal reform reveal society's deep commitment to illusory ultimate responsibility, while the insanity defense is a limited, inconsistent concession to determinism that stops arbitrarily to preserve the core myth.**

  Here's the mapping and reasoning:

  1.  **Strawson's Basic Argument & Hinckley:** Strawson argues true moral responsibility requires being the ultimate cause ("cause of itself") for one's character/motivations. Since character is shaped by factors (genetics, environment) for which one isn't responsible, this requires an impossible infinite regress of self-creation. *Therefore, no one is ultimately morally responsible.* The Hinckley verdict, by acquitting based on insanity, concedes that *some* people (the severely mentally ill) aren't responsible because their actions stem from an "alien" state they didn't choose or control. Strawson would see no *fundamental* difference between Hinckley's state (shaped by psychosis) and an "ordinary" defendant's state (shaped by genes, upbringing, environment, etc.). Both are products of unchosen factors.

  2.  **Why the Insanity Defense Stops Where It Does:** The law stops the regress arbitrarily at severe mental illness because:
      *   **Pragmatic Necessity:** Holding the profoundly insane responsible seems intuitively unjust and practically impossible (deterrence/rehabilitation fail).
      *   **Preserving the Default:** It carves out a narrow exception *precisely* to maintain the illusion that responsibility *is* the default for everyone else. Accepting Strawson's full regress would collapse the entire justice system's moral foundation. The exception proves the (false) rule.

  3.  **Actio Libera in Causa (ALIC) & the Regress:** ALIC (e.g., holding someone responsible for a crime committed while voluntarily drunk) does **not terminate the regress; it merely walks it back one step.** Strawson's reply is direct: Why was the agent responsible for *voluntarily* becoming impaired? That voluntary choice itself resulted from their pre-existing character, desires, and circumstances – factors for which they are not ultimately responsible. ALIC shifts the locus of "responsibility" to an earlier choice, but that choice is just as determined by prior unchosen causes as the later impaired act. It avoids the *immediate* excuse without addressing the ultimate lack of self-creation.

  4.  **The Reform & Strawson's Truth:** The post-Hinckley reform (burden on defense, narrower test) is society's institutional *rejection* of a concession it found too threatening to the myth of ultimate responsibility. If Strawson is right, the reform:
      *   **Reflects the Myth:** It doubles down on the default assumption of responsibility, making it harder to invoke the exception that highlights the problematic regress.
      *   **Refuses the Argument:** It ignores the Basic Argument's logical conclusion (nobody is responsible) because accepting it is existentially and institutionally untenable. The justice system *requires* the fiction of responsibility to function as a retributive and deterrent institution.
      *   **Manages Cognitive Dissonance:** The fury stems from the clash between the intuition of self-origination (required for retributive anger) and the legal recognition of a state where responsibility vanishes. The reform suppresses this dissonance by suppressing the exception.

  5.  **Where the Basic Argument Breaks:** Hinckley and the reaction **show the Basic Argument is right about our *practice* but wrong (or ignored) about our professed *theory*.**
      *   **Proves Too Much? (No):** Hinckley doesn't show the argument proves too much. Instead, it highlights how deeply ingrained the *belief* in ultimate responsibility is – the outrage is visceral evidence of the myth in action.
      *   **Right about Practice, Wrong about Theory? (Yes):** Our *practice* (justice system, moral outrage) fundamentally relies on the assumption of ultimate responsibility, treating it as the default. The insanity defense is a grudging, limited exception carved out under extreme pressure. The Basic Argument correctly diagnoses that this foundational assumption of practice is philosophically incoherent. The fury and subsequent reform confirm that society clings fiercely to the *illusion* of ultimate responsibility that Strawson's logic dismantles. Our explicit *theories* of responsibility (legal and folk) cannot ultimately justify this practice without contradiction, but we maintain the practice regardless.
