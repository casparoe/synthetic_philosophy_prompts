    But note: the context is about committee elections, which typically choose a winner. So we might be using a voting system that doesn't produce a full ranking. However, the theorem is often taken to have implications beyond just ranking systems because of the follow-up work.

    However, for the purpose of this exercise, let's stick to the theorem as stated.

    We are to be precise.

    For claim 2: if we take "voting system" to mean a system that produces a complete and transitive ranking, then Arrow's theorem entails that every such system violates at least one condition. So for that class, it's yes. But for voting systems that do not produce a ranking, Arrow's theorem does not directly apply. So if we interpret "every voting system" broadly, then it's partially.

    Similarly, for claim 1: if we take "voting system" as one that produces a ranking, then yes. Otherwise, no.

    Since the context of the meeting is about switching from plurality (which doesn't produce a ranking) to ranked choice (which does), we are considering systems that might produce rankings.

    But note: ranked choice (instant-runoff) does not produce a full ranking of all alternatives; it produces a winner and then a ranking only to the extent needed to break ties. So it is a social choice function, not a social welfare function. Arrow's theorem is about social welfare functions. So strictly speaking, Arrow's theorem does not apply to instant-runoff voting? 

