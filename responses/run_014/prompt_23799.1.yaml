  ### Classroom Game: "The Sleeper's Dilemma"
  **Goal:** Simulate the Sleeping Beauty problem without amnesia, using anonymized, repeated awakenings across the class to create tension between 1/2 and 1/3 credences. The game uses betting payoffs to implicitly favor the thirder view, while preserving the halfer's "no new information" intuition initially.

  ---

  ### **Mechanics**  
  **Group Size & Roles:**  
  - **16 students** split into **4 groups of 4**.  
  - Each group has:  
    - **1 Coin Master (CM)**: Flips coins and runs the round (non-participant).  
    - **3 Sleepers**: Participants who may be "awakened."  

  **Chip Payoff System:**  
  - Chips represent points (no real money).  
  - **Scoring Rule**: Quadratic scoring (incentivizes honest reporting):  
    - If coin = **Heads**: Awakened Sleeper earns `10 × [1 - (1 - p)²]` chips.  
    - If coin = **Tails**: Awakened Sleeper earns `10 × [1 - p²]` chips.  
  *(`p` = reported credence for Heads; max 10 chips per awakening)*  

  **Why this payoff?**  
  - Proper scoring rule: Students maximize expected chips by reporting true credence.  
  - In debrief, we show that `p=1/3` yields higher expected chips than `p=1/2` when awakened.  

  ---

  ### **Game Sequence (8 Rounds, 5 min/round)**  
  1. **Prep (Round Start)**:  
     - CM secretly flips a coin (Heads/Tails, 50/50).  
     - **Heads**: CM randomly selects **1 Sleeper** in the group to be "awakened."  
     **Tails**: CM randomly selects **2 Sleepers** to be "awakened."  
     - CM gives each Sleeper a private slip:  
       - **Awakened**: "You are awake. What is your credence (0-1) the coin was Heads? Report a fraction."  
       - **Not Awakened**: "You are asleep. Do nothing."  

  2. **Awakening Phase**:  
     - Sleepers read slips privately. **No talking or signaling**.  
     - Awakened Sleepers write their credence (`p`) on the slip and hand it to CM.  
     - **Anonymity**: Sleepers don’t know who else was awakened or the coin result.  

  3. **Reveal & Payoff**:  
     - CM reveals coin result to the group.  
     - CM calculates chips for awakened Sleepers using the scoring rule.  
     - Chips recorded publicly on a group scoreboard.  

  4. **Reset**:  
     - CM collects all slips. Roles rotate (CM becomes Sleeper; one Sleeper becomes new CM).  
     - Repeat for 8 rounds.  

  ---

  ### **Debrief: Tying Game to Sleeping Beauty (15 min)**  
  **Focus: What did you learn when you were awakened?**  
  1. **Halfer Intuition ("No New Information")**:  
     - "When you woke up, did you learn *anything* about the coin? You knew you’d be awakened at least once. Nothing changed!"  
     - *Analog to Sleeping Beauty*: Beauty’s awakening doesn’t eliminate possible worlds (Heads or Tails still in play). Prior was 1/2.  

  2. **Thirder Pull ("But Why Did I Report 1/3?")**:  
     - **Betting/Frequency**:  
       - "In Tails, twice as many awakenings occur. When you were awakened, was it ‘easier’ to be in a Tails round? If so, awakening is *evidence* for Tails."  
       - *Analog*: Beauty’s awakening is a *self-locating belief*—she learns "now is an awakening moment," which is more likely under Tails (2 awakenings) than Heads (1 awakening).  
     - **Credence Calculation**:  
       - Show the math:  
         `P(Heads | Awake) = P(Awake | Heads) × P(Heads) / P(Awake)`  
         `= (1/3 awakening slots in Heads) / (total awakening slots: 1 for Heads + 2 for Tails)`  
         `= (1/3) / (3/3) = 1/3`.  
       - *Analog*: Beauty doesn’t learn about the coin; she learns *which moment* it is. In Tails, there are twice as many moments.  

  3. **Tension Point**:  
     - "Halfers focus on *information about the coin*. Thirders focus on *information about their location* (which awakening they’re in). Who wins? The scoring rule: betting rewards 1/3."  

  ---

  ### **What Breaks the First Time**  
  1. **Predictable Snag**:  
     - **Selection Bias**: Students notice Heads rounds have 1 awakening, Tails have 2. When a Sleeper is rarely awakened, they report lower `p` (Tails-biased). But if a Sleeper is awakened often, they report higher `p` (assuming they're "lucky").  
     - **Fix**: Emphasize pre-round: "The coin is independent each time. Your selection is random—don’t overthink patterns!"  

  2. **Limitations of the Simulation**:  
     - **No Amnesia/Subjectivity**: Sleepers are different people, not one person with memory loss.  
       - *Missing*: Beauty’s **first-person identity** across awakenings. In the game, "I" is fragmented—no sense of being the *same* person twice in Tails.  
     - **Repeated Trials vs. Single Shot**:  
       - The game uses frequency (many rounds) to motivate `p=1/3`. But Beauty experiences one coin flip.  
       - *Missing*: **Epistemic uniqueness** of a real amnesiac awakening. Beauty can’t "practice" updating.  
     - **Anonymity vs. Indistinguishability**:  
       - Sleepers know others exist but not who was awakened. Beauty *knows* she can’t distinguish awakenings.  
       - *Missing*: The **phenomenological indistinguishability** of awakenings.  

  ---

  ### **What You Must Supply in Debrief**  
  1. **The Real Problem’s Core**:  
     - "Beauty isn’t a group. She’s *one person* who might be awakened twice, with no memory. Her awakening feels subjectively unique—she can’t ‘see’ the other awakening in Tails. That’s why ‘no new information’ feels true, but betting says otherwise."  
  2. **Bridge to Elga**:  
     - "The game’s betting payoff mirrors Elga’s indifference argument: each awakening is equally likely. But halfers reject that. Next class: can Beauty *justifiably* treat Monday and Tuesday as symmetrical?"  

  ---

  ### **Why This Design?**  
  - **Thirder Pull via Betting**: Scoring rule creates incentive for `p=1/3` without lecturing. Students see chips accumulate faster at 1/3.  
  - **Halfer Intuition Preserved**: "No new coin info" feels obvious until students see the scoring math.  
  - **Self-Locating Beliefs**: Anonymized awakenings force students to confront "where am I in the experiment?" without memory loss.  
  - **Logistically Simple**: Chips, slips, and small groups fit in 75 min. Coin Masters offload labor.  

  **Run it, then hit Elga—they’ll be ready to argue.**
