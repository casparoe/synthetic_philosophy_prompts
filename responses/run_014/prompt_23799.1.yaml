     - In our simulation, when you are awakened, you have learned that you were selected. This selection is more likely under tails (because there are two awakenings) than under heads (one). Therefore, you update towards tails.
     - In the original problem, Beauty also learns that she is experiencing an awakening. And in the tails case, there are two such experiences. So she should update similarly.
  - Limitations: 
     - We used different people for different awakenings. In the original, it's the same person. But the betting analogy still holds: in the tails case, the bookie will have to pay twice if Beauty is offered the same bet twice. Our simulation pays two different people, which is not the same, but the expected payoff per bet is the same.
     - In the original, Beauty knows she will be awakened. In our simulation, the students do not know if they will be awakened in a given round. But the update is similar: the fact that they are awakened is new information because they didn't know they would be the one(s) selected.

