answer: |-
  Here's a decision tree that sorts users into positions on vagueness based on concrete judgments about cases, with higher-order vagueness as a key branching point. Each question presents a specific scenario where theories meaningfully diverge.

  ---

  ### **Decision Tree: Theories of Vagueness**

  #### **Question 1: The Borderline Pile**  
  *You see a pile of sand with exactly 100 grains. It feels ambiguous—not clearly a heap, but not clearly* not *a heap either. What best describes this pile?*  
  - **A**) It secretly **is or isn't** a heap (even if we can't know which).  
  - **B**) It **lacks a definite truth-value** (not truly "is" or "isn't").  
  - **C**) It’s **partly a heap** (e.g., 60% heap-like, 40% not).  

  **If A → Go to Q2**  
  **If B → Go to Q3**  
  **If C → Go to Q4**  

  ---

  #### **Question 2: The Precise Cutoff**  
  *Imagine removing grains one-by-one from a huge heap. Is there* necessarily *a single grain where removing it turns "heap" into "non-heap"?*  
  - **A**) **Yes**—there’s a magic grain (even if humans can’t find it).  
  - **B**) **No**—no single grain ever makes the difference.  

  **If A → Leaf: EPISTEMICISM**  
  *(You believe vague predicates have sharp boundaries, but human ignorance hides them.)*  
  **If B → Leaf: [INCONSISTENT]**  
  *(This rejects sharp boundaries but accepts true/false values—no standard theory holds both.)*  

  ---

  #### **Question 3: "Clearly a Heap"**  
  *Consider the phrase "clearly a heap." Is the boundary between "clearly a heap" and "not clearly a heap"...*  
  - **A**) **Vague** (there are piles that are *sort of* "clearly heaps").  
  - **B**) **Sharp** (a pile either clearly is or clearly isn’t "clearly a heap").  

  **If A → Leaf: SUPERVALUATIONISM**  
  *(You think truth depends on many precisifications, allowing higher-order vagueness.)*  
  **If B → Leaf: [NON-STANDARD VIEW]**  
  *(Supervaluationism usually avoids sharp boundaries at all levels—this is atypical.)*  

  ---

  #### **Question 4: The Almost-Identical Pair**  
  *Take two piles: Pile 1 (100 grains) and Pile 2 (101 grains). Both are borderline, but Pile 2 has one more grain. If we say "Both are heaps," is this...*  
  - **A**) **Correct** (they’re equally heap-like; tiny differences don’t matter).  
  - **B**) **Incorrect** (accepting both leads to paradox; they aren’t the same).  

  **If A → Leaf: FUZZY LOGIC**  
  *(You assign partial truth-values and tolerate small contradictions.)*  
  **If B → Go to Q5**  

  ---

  #### **Question 5: The Hidden Boundary**  
  *When we assign "heap" degrees (e.g., 0.7 for 100 grains), must there be...*  
  - **A**) **A sharp cutoff in degrees** (e.g., a grain where "heapness" drops from 1.0 to 0.99)?  
  - **B**) **No sharp cutoffs anywhere** (degrees themselves blur gradually).  

  **If A → Leaf: FUZZY LOGIC**  
  *(Standard fuzzy logic uses precise degree functions.)*  
  **If B → Leaf: MANY-VALUED LOGIC / DEGREE-THEORETIC**  
  *(You avoid all sharp boundaries but reject fuzzy logic’s math—closer to "many minds" or non-fuzzy degrees.)*  

  ---

  ### **Tree Summary & Notes**  
  - **Epistemicism**: Q1=A → Q2=A  
  - **Supervaluationism**: Q1=B → Q3=A  
  - **Fuzzy Logic**: Q1=C → Q4=A *or* Q1=C → Q4=B → Q5=A  
  - **Many-Valued/Degree-Theoretic**: Q1=C → Q4=B → Q5=B  
  - **Inconsistent/Non-standard**: Marked in brackets.  

  **Key Distinctions**:  
  - Higher-order vagueness (Q3) splits epistemicism/supervaluationism.  
  - Fuzzy logic vs. many-valued turns on tolerance of vague degrees (Q4/Q5).  
  - "Many minds" fits under Q5=B (indeterminacy in how we *apply* vague concepts).  

  **Why this works**:  
  - Tests intuitions about *cases* (not definitions).  
  - Flags edge cases (e.g., denying sharp boundaries but accepting bivalence → inconsistency).  
  - Higher-order vagueness is central (Q3).  
  - Uses concrete examples (grains, "clearly a heap").  

