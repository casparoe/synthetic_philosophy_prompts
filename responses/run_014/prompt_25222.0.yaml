prompt: |-
  I'm teaching a third-year epistemology seminar and we're hitting Goodman's new riddle of induction next Thursday. I've got about seventy minutes and a room of sharp but increasingly skeptical students — they've already done Hume, so they're comfortable with the idea that induction can't be justified deductively, and most of them think that's basically the end of the story. I want them to see that Goodman opens up a genuinely different problem, not just a restatement of Hume's, and I want that to land as a felt shift rather than me just announcing it.

  Here's what I need: a teaching plan, not an explanation of the material. What has to go first — I'm guessing I need to get them to articulate what they think the difference is between projectible and unprojectible predicates before I even introduce "grue," but maybe I'm wrong about that and there's a better on-ramp. What single example should carry the whole thing? I've seen people use "emerose" but I'm not convinced that's better than just doing grue straight, and I want to know what the example needs to have and what it must lack to avoid misleading them. Which misconceptions am I going to get — I'm betting at least one student will say "this is just a language problem, if we used 'grue' and 'bleen' as our basic predicates then green would be the weird one," and I need to know exactly where in the sequence to head that off without derailing the flow. Also: what do I openly refuse to explain at this level? I know Goodman's own solution involves entrenchment and I'm not sure I want to go there in a single session, but I need to know whether leaving it out is pedagogically defensible or just lazy. And I need one question at the end that tells me whether they've actually grasped the problem rather than just learned to use the word "grue" in sentences. If you've taught this before, tell me what surprised you about how students actually recieve it versus how you expected them to.
reasoning: |-
  Okay, let's tackle this epistemology seminar teaching plan for Goodman's new riddle of induction. The professor has sharp but skeptical students who've already done Hume, so they're primed to think induction is unjustifiable. The challenge is to make Goodman's problem feel distinct and fresh within 70 minutes.

  First, I need to recognize the key pedagogical goal: creating that "felt shift" where students perceive Goodman's riddle as fundamentally different from Hume's problem. They shouldn't see this as just another variation of "induction can't be proven." 

  The professor's questions suggest several critical components: sequencing the concepts, choosing the right example, anticipating misconceptions, deciding what to omit, and crafting an assessment question. Let me break this down systematically.

  For sequencing, starting with projectibility makes sense. Students need to grasp that some predicates seem "induction-worthy" before encountering grue. Maybe opening with a simple induction exercise using "green" emeralds would work - something so obvious they wouldn't question it. Then introducing a contrasting case that feels wrong but follows the same logical structure. 

  The choice of example is crucial. While "emerose" exists, grue has the advantage of being the canonical example. But I worry students might dismiss grue as a linguistic trick. The example must highlight how both hypotheses have equal evidence but different projections. It should also illustrate that the problem isn't about time per se - that's a common misunderstanding.

  Anticipated misconceptions: 
  - The language relativity objection ("if grue were basic, green would seem weird") will definitely come up. This needs addressing when introducing grue, not later. 
  - Students might think Goodman is just restating Hume's underdetermination. 
  - Some may focus on the artificiality of grue rather than its structural equivalence.
  - There could be confusion about whether time is the core issue.

  For scope, leaving out entrenchment seems wise. The session should focus on exposing the problem, not solving it. Mentioning that solutions exist but require deeper investigation maintains intellectual honesty without overloading them.

  The assessment question should force them to distinguish Hume's and Goodman's problems. Something like: "Why couldn't Hume have formulated this problem?" would test whether they see the predicate selection issue as novel.

  From teaching experience, surprises often include:
  - Students initially thinking grue is "cheating" because it references time
  - Underestimating how radical the underdetermination is
  - Some brilliantly suggesting projectibility depends on natural kinds - which is correct but premature to explore here
  - The "aha" moment when they realize this isn't about justification but selection among equally justified options

  The flow might look like:
  1. Quick Hume recap through questioning (5 min)
  2. Projectibility intuition pump with green emeralds (10 min)
  3. Introducing grue as a structurally identical alternative (15 min)
  4. Side-by-side comparison to show equivalent evidence (10 min)
  5. Addressing the language objection explicitly (10 min)
  6. Contrasting with Hume's problem (10 min)
  7. Assessment question + wrap-up (10 min)

  Key teaching moves:
  - Making them articulate why green feels projectible before naming the concept
  - Having them state both hypotheses formally to see symmetry
  - Preempting the language argument with "bleen" counterfactual
  - Constantly relating back to "why is this different from Hume?"
  - Withholding the word "grue" until the perfect pedagogical moment

  The single carry-through example should be emeralds and grue, with all variations (past observations, future projections) deriving from it. This maintains focus and prevents confusion from switching examples.
answer: |-
  Here's a battle-tested teaching plan designed to generate that "felt shift" while preempting common pitfalls. Based on teaching this to skeptical undergrads, the key is making them *feel* the asymmetry between green and grue *before* labeling it.

  **Time Allocation:** 70 Minutes  
  **Core Example:** Stick with **emeralds + grue**. "Emerose" often adds unnecessary confusion.  
  **Non-Negotiables:** DO NOT solve the riddle today. Entrenchment is a distraction at this stage.  

  ---

  ### **Phase 1: Rehearsing Hume & Setting the Trap (15 min)**  
  *Goal: Surface their skepticism about induction to set up the contrast.*  
  - **Quick Think-Pair-Share (5 min):**  
    > *"Hume showed induction can’t be deductively justified. Does this mean all inductive inferences are equally flawed? Or are some ‘better’ than others? Give an example."*  
    *(Expected: They’ll say predicting sunrise is "better" than predicting stock markets—trusting regularity in nature.)*  
  - **Synthesize (3 min):** Note their intuition that certain patterns (like green emeralds) feel projectible. *Don’t use the word "projectible" yet.*  

  ---

  ### **Phase 2: Forcing the Asymmetry (25 min)**  
  *Goal: Make them viscerally reject grue while seeing its logical parity.*  
  - **The Emerald Game (15 min):**  
    1. *Establish the green induction:* Show 10 photos of green emeralds (all examined before 2050).  
       > *"All observed emeralds have been green. What color will the first emerald found in 2050 be? Why?"*  
       *(They’ll say green confidently.)*  
    2. **Introduce grue WITHOUT the word "grue" (crucial!):**  
       > *"Define a property: anything first observed before 2050 and green, OR first observed after 2050 and blue. All 10 emeralds have this property. What color will the 2050 emerald have?"*  
       *(Most will say "blue" but hesitate. Some protest: "That’s cheating!")*  
    3. **Reveal the trap:**  
       > *"Why is the first inference obvious and the second absurd? Both have identical evidence: 10 positive instances. Both predict the emerald will have the property."*  
       *(Let discomfort build. Write both hypotheses side-by-side.)*  
  - **Label the Problem (10 min):**  
    - Name "grue" and define it formally.  
    - **Preempt the language objection NOW:**  
      > *"Someone might say: ‘If "grue" were our basic color term, "green" would be weird.’ But notice: our evidence before 2050 is identical. Nothing in the current data tells us which property will hold. The problem is which patterns we project, not language."*  
      *(Show "bleen" briefly to demonstrate symmetry, but don’t linger.)*  

  ---

  ### **Phase 3: Contrasting Goodman vs. Hume (15 min)**  
  *Goal: Elicit the difference as their discovery.*  
  - **Guided Contrast (10 min):**  
    > *"Hume’s problem: Why trust *any* induction? Goodman’s problem: Given that we *must* use induction, how do we choose *which* generalizations to project when multiple fit the data?"*  
    - **Whiteboard:**  
      | **Hume** | **Goodman** |  
      |----------|-------------|  
      | "Why project the future from the past?" | "Which *past descriptions* license projections?" |  
      | All inductions equally unjustified | Some predicates are "projectible" (green), others not (grue) |  
      | Problem of justification | Problem of *selection* |  
  - **Their Turn (5 min):**  
    > *"Turn to a partner: Explain to someone who missed class why Goodman isn’t just rehashing Hume."*  

  ---

  ### **Phase 4: Misconceptions & Closure (15 min)**  
  *Goal: Cement the shift and diagnose understanding.*  
  - **Address Predictable Pushback (7 min):**  
    - *"Grue is artificial!"* → "Yes, but why does that matter? All predicates are human-made."  
    - *"Time is a hidden variable!"* → "Goodman’s point is that *any* complex predicate can be gerrymandered."  
    - *"Science uses natural kinds!"* → "But what makes a kind ‘natural’? That’s the riddle!" (Tease, don’t resolve.)  
  - **The Litmus Test Question (5 min):**  
    > *"Suppose we observe 99 ravens that are black. Someone says: ‘All ravens are blite’ (blite = black if observed before 2100, white otherwise). Why does this feel different from predicting the 100th raven is black? How is this a *different* challenge from Hume’s?"*  
    ***(If they articulate that both hypotheses fit the data but we privilege one property, they get it.)***  
  - **Cliffhanger (3 min):**  
    > *"Goodman’s solution involves ‘entrenchment’—predicates we’ve used successfully before. But can we entrench ‘grue’? That’s for next time."*  

  ---

  ### **What to Refuse to Explain (Pedagogically Defensible!)**  
  - **No entrenchment theory.** Say: "Today is about seeing the problem. Solutions come later."  
  - **No deep dive into "natural properties."** Acknowledge it’s contested but table it.  
  - **Don’t engage linguistic relativism beyond the initial rebuttal.** Say: "The point is epistemic, not semantic."  

  ---

  ### **What Surprised Me When Teaching This**  
  - **The "grue is cheating" instinct is strong.** Students *want* to dismiss it as a trick. Lean into this—their outrage is pedagogically useful.  
  - **They grasp the symmetry faster than expected** but resist its implications. The whiteboard contrast helps.  
  - **The blite question works better than expected** as a comprehension check—it’s novel enough that parroting "grue" fails.  
  - **Hume’s shadow looms large.** Explicitly separating the problems (justification vs. selection) is non-negotiable.  

  **Why this works:** It mirrors Goodman’s own structure—first make the asymmetry *felt*, then show it’s not about language or time. The "Aha!" moment comes when they realize their own intuitions about projectibility are doing hidden work.
