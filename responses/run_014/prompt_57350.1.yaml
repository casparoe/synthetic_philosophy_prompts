prompt: |-
  I'm a philosophy-of-language PhD student helping to run a joint seminar with our law school on reference and legal interpretation, and one judicial practice keeps resisting my attempts to characterize it. When the Supreme Court must fix the sense of an ordinary term in a statute or constitutional provision, it commonly consults a dictionary published near the time of enactment — Johnson's for the eighteenth century, Webster's American Dictionary for the antebellum period — treating the entry as evidence of what the phrase meant to the enacting community. Yet the same Court, in Nix v. Hedden (1893), classified the tomato as a vegetable for tariff purposes: it conceded that botanically the tomato is the fruit of a vine, declined to treat as controlling either the Webster's and Worcester's definitions counsel had read into evidence or the botanical classification, and reasoned instead from how sellers and consumers of provisions ordinarily talk, adding that dictionaries are admitted "not as evidence, but only as aids to the memory and understanding of the court." In regulatory and evidentiary settings, meanwhile, these courts defer freely to expert classification of a substance, species, or drug.

  What theory of meaning does the dictionary-lookup practice presuppose? Is it committed to descriptivism about sortal and natural-kind terms, and to the assumption that a lexicographer's entry samples a single community-wide competence rather than one register among many? If semantic externalism and the division of linguistic labor are correct, can an 1828 entry fix the extension of a term whose reference depends on the world and on specialist usage — or does the practice survive in some restricted role, fixing sense while leaving reference to the world? And is the pattern internally inconsistent, or can a single doctrine (ordinary meaning, judicial notice, deference to trade usage) accommodate all three of these behaviors? Please distinguish what the practice strictly presupposes from what merely sits comfortably with it, mark where it is underdetermined among rival semantic theories, and say what interpretive method would have to look like if the Court took externalism seriously.
reasoning: |-
  Okay, let me try to unpack this philosophy-of-language puzzle about legal interpretation. The user is a PhD student struggling to reconcile three seemingly contradictory Supreme Court practices: historical dictionary usage in statutory interpretation (like consulting Johnson's for 18th century terms), the tomato-as-vegetable ruling in Nix that prioritized ordinary language over dictionaries and science, and contemporary deference to expert classifications in regulatory cases. 

  Hmm, the core tension seems to be between different theories of meaning. The dictionary practice suggests a descriptivist view where meaning is fixed by community usage captured in historical lexicons. But Nix v. Hedden points toward contextual pragmatics - how people actually use words in specific situations (like tariffs). And the expert deference cases align with semantic externalism, where specialists determine reference. 

  I wonder if the user's deeper frustration is about courts being theoretically inconsistent. They might need help articulating how these approaches can coexist under a unified "ordinary meaning" doctrine. The key is recognizing that "ordinary meaning" functions differently across contexts: historical for original public meaning, contemporary for regulatory implementation, functional for commercial disputes like Nix. 

  The externalism question is particularly thorny. If reference depends on external facts and expert labor, can an 1828 dictionary really bind modern interpretation? Probably not for natural kinds - that dictionary might capture the sense (concept) but not the actual extension if scientific understanding changed. But for legal purposes, maybe the original sense is what matters constitutionally, even if it misclassifies things by current standards. 

  For the user's seminar, we should emphasize that legal interpretation isn't committed to one semantic theory. Courts are pragmatic - they use dictionaries when they help resolve ambiguity, defer to experts when classification requires specialized knowledge, and follow ordinary usage when commercial context dominates. The inconsistency is only apparent if we see "meaning" as having different dimensions in law. 

  If courts took externalism seriously, they'd need clearer rules about when original sense vs. current reference controls. But that might undermine stare decisis in statutory interpretation. Perhaps the solution is distinguishing between fixing semantic content (where historical dictionaries matter) and applying that content to the world (where experts help).
answer: |-
  Your analysis captures a profound tension in legal hermeneutics between semantic theories and judicial pragmatism. Let me synthesize the presuppositions, tensions, and possible reconciliations:

  ### 1. **Dictionary Practice Presupposes:**
     - **Descriptivist Semantics:** Treats meaning as constituted by community-wide associations (concepts/descriptions) at enactment time.  
     - **Lexical Fixation Thesis:** Assumes dictionaries capture a stable, unitary "ordinary meaning" across registers, downplaying sociolectal variation.  
     - **Temporal Binding:** Holds that semantic content is fixed at enactment (original public meaning).  
     - **Anti-Externalism:** Implicitly rejects causal-historical theories where reference depends on external factors unknown to speakers.  

  ### 2. **Tensions with Nix & Expert Deference:**
     - **Nix v. Hedden** prioritizes *pragmatic context* over semantic definitions:  
       - **Functional Register:** "Vegetable" is defined by culinary/trade usage, not botany or lexicons.  
       - **Anti-Essentialism:** Rejects scientific or dictionary authority in favor of *speech community practices*.  
     - **Expert Deference Cases** (e.g., FDA drug classifications) embrace:  
       - **Division of Linguistic Labor:** Specialists determine reference (à la Putnam).  
       - **Semantic Externalism:** Meaning depends on objective features of the world accessible to experts.  

  ---

  ### 3. **Can These Cohere? A Modified "Ordinary Meaning" Doctrine**
  A unified theory is possible if we distinguish **semantic meaning** from **pragmatic application**:  

  | **Practice**              | **Semantic Level**                     | **Pragmatic Level**                     |
  |---------------------------|----------------------------------------|-----------------------------------------|
  | **Historical Dictionary** | Fixes *sense* (conceptual content)     | Not binding for *reference*             |
  | **Nix v. Hedden**         | Sense stable; *reference* context-bound| Trade usage determines extension        |
  | **Expert Deference**      | Sense stable; *reference* expert-bound | Experts fix extension via world/knowledge |

  - **Dictionary as Sense-Evidence:** Historical entries fix the *concept* legislators associated with a term (e.g., "fruit" as *botanical category* in 1893).  
  - **Nix as Reference-Contextualization:** Same sense ("fruit"), but tariff context triggers *pragmatic narrowing* to culinary extension.  
  - **Expert Deference as Externalism:** Sense remains, but specialists update reference (e.g., "marijuana" now excludes hemp per USDA).  

  Thus, the Court *could* claim:  
  > *Dictionaries capture original public* sense, *but extension is fixed by context, usage, or expertise when statutes delegate authority or address specialized domains.*

  ---

  ### 4. **Externalism's Challenge & the Dictionary's Survival**
  - **Problem:** If reference depends on external reality/experts, an 1828 dictionary *cannot* fix modern extension (e.g., "whale" as fish vs. mammal).  
  - **Restricted Role for Dictionaries:**  
    - **Sense Preservation:** Dictionaries evidence *historical concepts* (e.g., 18th-c. "commerce" excluded manufacturing).  
    - **Reference Delegation:** When statutes use natural-kind terms ("drug," "species"), courts *defer to experts* for current extension.  
    - **Default Rule:** Where no expertise/trade usage exists, *ordinary language* (à la Nix) governs.  

  ---

  ### 5. **Inconsistency or Pragmatic Pluralism?**
  The practices are *superficially inconsistent* but reconcilable under a **pragmatic originalism**:  
  - **Original Public Meaning (OPM)** binds for *semantic content*.  
  - **Application** adapts to:  
    - **Regulatory Contexts:** Expert deference (externalism).  
    - **Commercial/Common Speech:** Ordinary usage (Nix).  
    - **Ambiguity:** Dictionaries as *secondary evidence* of OPM.  

  *Nix's* "aid to memory" dictum signals this: dictionaries clarify concepts but don’t override contextual extension.  

  ---

  ### 6. **Externalist Legal Interpretation: A Sketch**
  If courts took externalism seriously:  
  1. **Statutory Terms:**  
     - Natural-Kind Terms (e.g., "water"): Reference fixed by current science, not 1789 understanding.  
     - Functional Terms (e.g., "vehicle"): Extension depends on evolving social use.  
  2. **Doctrinal Shifts:**  
     - *Chevron Deference* to agencies could extend to semantic externalism (experts update reference).  
     - Original *sense* might inform purpose, but not bind reference.  
  3. **Example:** "Cruel and unusual punishment" might retain 1791 *sense* (unjustified suffering) but extend to new *referents* (e.g., solitary confinement) per psychological expertise.  

  ---

  ### Conclusion: A Tripartite Framework
  | **Aspect**          | **Dictionary Practice**       | **Nix v. Hedden**           | **Expert Deference**      |
  |----------------------|-------------------------------|-----------------------------|---------------------------|
  | **Theory**           | Descriptivism (sense-fixing)  | Contextual Pragmatics       | Semantic Externalism      |
  | **Role**             | Evidence of historical sense  | Usage determines reference  | Experts fix reference     |
  | **Compatibility**    | Coheres if dictionaries ≠ binding referential authority | | |  

  **Strict Presupposition:** Lexical descriptivism and temporal fixation of sense.  
  **Underdetermined:** Whether reference is fixed by world or usage.  
  **Accommodation Doctrine:** "Ordinary meaning" as *sense fixed originally, reference determined contextually*.  

  This preserves originalism’s fidelity to legislative intent while acknowledging language’s dynamic interaction with reality—a pragmatic compromise between philosophy and adjudicative necessity.
