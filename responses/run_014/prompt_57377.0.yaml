prompt: |-
  I am a doctoral student in the philosophy of physics, and for the past two years I have been recording the verdicts my supervisor issues whenever our seminar poses her the same standing question about some new theoretical posit: should a realist take ontological commitment to this item, or is it surplus to what the theory licenses? Her answers to date:

  - The luminiferous ether in Fresnel's account of light: no commitment to the medium, but full commitment to the equations describing light as a transverse wave. Those equations, on her telling, are what carried across into Maxwell's theory; the mechanical medium did not.
  - Absolute simultaneity in Newtonian mechanics: no commitment. It is undetectable even within the theory that posits it, and the successor theory dispenses with it altogether.
  - The Minkowski interval in special relativity: commitment. Every admissible frame agrees on it.
  - The electromagnetic field tensor: commitment. The separate electric and magnetic three-vectors receive only a qualified assent, and then solely as components of that tensor, never as free-standing entities.
  - The vector potential: no commitment to the potential, which can be shifted at will; commitment to the closed-loop phase factor that the Aharonov–Bohm arrangement registers in regions where the field tensor vanishes.
  - Individual points of the manifold in general relativity: no commitment. Two models related by a diffeomorphism are, for her, two descriptions of a single physical situation, so a bare point has no identity apart from the fields defined on it. Commitment goes instead to the diffeomorphism-invariant content of the metric field.
  - The quantum state of an individual system: she declines to rule, and has said twice that this case differs in kind from the others because there is as yet no successor theory against which to test what survives.

  The case I intend to put to her next is constructed on the model of holographic duality. Suppose a candidate quantum-gravity theory admits two exactly dual formulations. Formulation B is a quantum field theory containing no gravity, defined on a fixed background of one dimension fewer. Formulation G is a gravitational theory on a spacetime with one additional dimension, whose bulk geometry is dynamical. The dictionary between them is exact: neither formulation yields a prediction the other fails to yield. Every quantity of G has a counterpart in B, but typically a drastically nonlocal one. In particular, a local scalar field in the bulk corresponds under the dictionary to a nonlocal composite of B's operators, and the smooth bulk geometry as such has no simple counterpart in B at all — it materialises only within a specific limiting regime of B.

  Please address the following. First, predict her verdict on three sub-questions: whether we should commit to the bulk spacetime geometry; to the local bulk scalar field; and to the ontology of the boundary formulation — its operators, its states, and its fixed background geometry. Second, set out the principles that her recorded verdicts are jointly consistent with. I have three candidates in mind — commit only to what is invariant under the theory's own gauge and symmetry group; commit only to what survives the transition into a successor theory in the relevant limiting regime; commit only to what plays an ineliminable part in the theory's structural explanations — and I expect I am missing others. State for each surviving candidate what it implies about the three sub-questions, and note explicitly where the candidates come apart. Third, commit to a best guess about what she will actually say, with your reasons for preferring one candidate over the rest, together with a candid account of which parts of the record genuinely underdetermine the outcome. Fourth, name one further case — a real or invented posit, described in enough detail that I can put it to her verbatim — that would most sharply discriminate between the principles that survive her record, and say what each of those principles would say about it.

  Two constraints on your answer. I am not asking for a general defence or critique of structural realism, nor for a survey of the division between its epistemic and ontic versions; the deliverable is a prediction about this person's verdicts and the reasoning that reaches it. And please give me no references, bibliography, or reading list — I want the argument, not the citations.
reasoning: |-
  Okay, the user is a doctoral student in philosophy of physics, presenting a detailed case study based on their supervisor's historical verdicts on ontological commitments in various physical theories. They want me to predict the supervisor's stance on holographic duality, extract underlying principles from past decisions, and design a discriminating test case. 

  First, I need to internalize the supervisor's pattern. Her rejections (ether, absolute simultaneity, vector potential, manifold points) share common threads: eliminability under transformation or successor theories, lack of invariance, or explanatory redundancy. Her commitments (Minkowski interval, EM tensor, metric's diffeomorphism-invariant content) emphasize structural invariants and explanatory necessity. The quantum state abstention is notable – she clearly values successor theories as arbiters but won't speculate without one.

  For the holographic duality case: 
  - **Bulk geometry**: Likely "no commitment". It's emergent from B's non-gravitational physics, disappears in non-limiting regimes, and lacks direct counterpart. Parallels her ether/geometry distinction in Fresnel/Maxwell. 
  - **Bulk scalar field**: Strong "no". Its local definition in G maps to nonlocal composite in B, making it frame-dependent in a deep sense – akin to rejecting E/B fields separately from the tensor. 
  - **Boundary ontology**: Probable "commitment". B's operators/states/fixed background are the fundamental variables with direct predictive power, mirroring her equations-over-ether stance. 

  Now dissecting principles: 
  1. **Invariance principle** (gauge/symmetry): Clear frontrunner. Explains all past verdicts – she commits only to invariants (interval, EM tensor) and rejects non-invariants (simultaneity, vector potential). For holography: rejects bulk items (non-invariant under duality map), commits to boundary (fixed background is invariant). 
  2. **Successor survival**: Explains ether/Newton cases but stumbles on EM tensor (no successor altered it) and fails quantum state abstention. In holography, it would ambiguously commit to boundary (as "survivor" if G is emergent) but that contradicts her structural focus. 
  3. **Explanatory indispensability**: Too vague. She rejected ether despite its explanatory role in Fresnel's theory. Invariance does better explanatory work by filtering redundant structure. 

  Best guess: She'll lead with invariance. It's the most consistent thread, and her emphasis on "what carries over" in Fresnel/Maxwell case is about structural preservation under transformation – exactly what duality exemplifies. The underdetermined part is whether boundary background geometry gets commitment; her absolute simultaneity rejection suggests she might balk at any fixed background, but her boundary focus here likely overrides that. 

  Discriminating test case: **Galilean vs. Lorentz-invariant mass**. 
  - Realist theory posits mass as Galilean invariant scalar. 
  - Successor (SR) makes mass frame-dependent, commits only to rest mass. 
  - Invariance principle: Commits to rest mass (Lorentz invariant), rejects relativistic mass. 
  - Successor survival: Commits to rest mass (survives as limit), rejects relativistic mass. 
  - Explanatory indispensability: Might commit to both in pre-relativistic context (both explanatory then). 
  Her verdict should reject relativistic mass, confirming invariance/successor principles over explanatory indispensability. 

  Key nuance: The boundary background in holography might trouble her given her GR manifold rejection, but the fixed (non-dynamical) nature likely makes it "detectable" unlike absolute simultaneity – so she'll probably carve an exception.
answer: |-
  Based on your supervisor's recorded verdicts and reasoning patterns, here is a systematic prediction and analysis of her likely response to the holographic duality case, grounded in the principles her judgments imply.

  ### Prediction for Holographic Duality Case
  1. **Bulk spacetime geometry**: **No commitment.**  
     *Reasoning*: The geometry is emergent only in a specific limit of the boundary theory, lacks a direct counterpart in B (which is fundamental), and is not invariant across formulations. It parallels her rejection of the luminiferous ether (emergent in Fresnel but absent in Maxwell) and manifold points in GR (no identity without fields).  

  2. **Local bulk scalar field**: **No commitment.**  
     *Reasoning*: Its local description in G maps to a nonlocal composite in B, making it non-intrinsic and dependent on the dual frame. This mirrors her rejection of separate electric/magnetic fields (frame-dependent components) and the vector potential (gauge-dependent).  

  3. **Boundary ontology (operators, states, fixed background)**: **Full commitment.**  
     *Reasoning*: B’s ontology is the fundamental formulation, with no emergence or duality dependence. Its operators/states directly generate predictions, akin to Fresnel’s equations (retained in Maxwell) and the electromagnetic tensor (invariant). The fixed background is detectable within B, unlike absolute simultaneity.  

  ---

  ### Principles Consistent with Her Verdicts
  Her decisions align with **three principles**, ranked by explanatory power for the full record:  

  1. **Invariance Principle**: Commit only to what is invariant under the theory’s gauge/symmetry *and* dualities/equivalences.  
     - Explains:  
       - Rejecting ether (not Lorentz-invariant), absolute simultaneity (non-invariant in Newtonian mechanics), vector potential (gauge-variant), manifold points (diffeomorphism-variant).  
       - Committing to Minkowski interval (Lorentz-invariant), EM tensor (gauge-invariant), metric’s diffeomorphism-invariant content.  
     - *Holography verdict*: Rejects bulk geometry and scalar (non-invariant under duality); commits to boundary (fixed background is invariant in B’s formulation).  

  2. **Successor-Survival Principle**: Commit only to what survives transition to a successor theory in the relevant limit.  
     - Explains:  
       - Rejecting ether (discarded by Maxwell), absolute simultaneity (discarded by SR).  
       - Committing to Fresnel’s equations (survived in Maxwell).  
     - *Fails* for EM tensor (no successor theory altered it), GR metric content (no successor), and quantum state (she abstains due to no successor).  
     - *Holography verdict*: Ambiguous. Bulk geometry might "survive" as emergent in G’s limit, but she’d likely reject it as non-fundamental (per ether). Boundary favored as "survivor" if G is emergent.  

  3. **Explanatory Indispensability Principle**: Commit only to what plays an ineliminable role in structural explanations.  
     - Explains:  
       - Committing to Minkowski interval (explains causal structure), EM tensor (unifies E/B).  
       - Rejecting vector potential (explanatorily redundant per Aharonov-Bohm).  
     - *Fails* for ether (indispensable in Fresnel’s explanations but rejected) and absolute simultaneity (explanatorily inert but similar to bulk geometry).  
     - *Holography verdict*: Rejects bulk scalar (redundant to boundary composites); boundary favored; bulk geometry’s status unclear (it explains gravity but is emergent).  

  **Where principles diverge**:  
  - **Bulk geometry**: Invariance rejects it (non-invariant). Successor-Survival ambiguously rejects (emergent). Explanatory Indispensability might commit (explains gravity) – but her ether rejection suggests she overrules this.  
  - **Boundary background geometry**: Invariance commits (fixed in B). Successor-Survival commits (fundamental). Explanatory Indispensability commits (inevitable for B’s dynamics).  
  - **Quantum state abstention**: Only Invariance explains this – without a successor or equivalence map (like duality), invariance can’t be assessed.  

  ---

  ### Best Guess for Her Verdict
  - **She will prioritize the Invariance Principle**, rejecting bulk geometry and the scalar field while committing to the boundary ontology.  
  - **Why Invariance wins**:  
    - It covers *all* her verdicts without exception, including the EM tensor (gauge invariance) and GR (diffeomorphism invariance). Successor-Survival fails for EM/GR cases; Explanatory Indispensability fails for ether.  
    - Her emphasis on "what carries over" (Fresnel/Maxwell) and frame-independent quantities (Minkowski interval) highlights invariance as a unifying theme.  
    - Holographic duality is explicitly a symmetry/equivalence – she will treat it like gauge freedom or diffeomorphisms.  
  - **Underdetermined elements**:  
    - Her quantum state abstention doesn’t resolve the principles (all are compatible with withholding judgment).  
    - The boundary’s *fixed background* is the outlier. She rejected absolute simultaneity (also fixed) but will likely commit here because:  
      - It is detectable within B (unlike simultaneity),  
      - It is invariant under B’s internal symmetries, and  
      - Her boundary commitment parallels Fresnel’s equations (which presuppose a background).  

  ---

  ### Discriminating Test Case  
  **The Case of Galilean Mass vs. Lorentz-Invariant Rest Mass**  
  *Description*: Consider a realist theory of classical particles where mass is a Galilean-invariant scalar property. Its successor, special relativity, replaces this with rest mass (Lorentz-invariant) and relativistic mass (frame-dependent). In the successor, rest mass is explanatorily indispensable for defining the energy-momentum tensor, while relativistic mass is derivable but useful in some contexts (e.g., gravitational lensing approximations).  

  **What each principle implies**:  
  1. **Invariance Principle**:  
     - Commits to **rest mass** (Lorentz-invariant).  
     - Rejects relativistic mass (frame-dependent) *and* Galilean mass (not Lorentz-invariant).  
  2. **Successor-Survival Principle**:  
     - Commits to **rest mass** (survives as the \(m_0\) in SR).  
     - Rejects Galilean mass (discarded) and relativistic mass (discarded in post-1905 formulations).  
  3. **Explanatory Indispensability Principle**:  
     - Commits to **rest mass** (inevitable for SR’s structure) *and possibly* relativistic mass (explanatorily useful in contexts like gravity). May retain Galilean mass in pre-relativistic explanations.  

  **Why this discriminates**:  
  - Her verdict on **relativistic mass** is pivotal:  
    - If she rejects it (per Invariance/Successor-Survival), those principles are affirmed.  
    - If she commits due to its explanatory utility, Explanatory Indispensability gains ground.  
  - Her verdict on **Galilean mass** tests Successor-Survival vs. Invariance:  
    - If she rejects it (despite being fundamental pre-SR), Invariance prevails.  
    - If she commits in a pre-relativistic context, Successor-Survival weakens.  

  This case isolates the principles: Invariance and Successor-Survival converge on rest mass but diverge on historical posits; Explanatory Indispensability risks overcommitment to useful but non-invariant quantities. Her likely rejection of relativistic mass (as frame-dependent) would confirm Invariance as primary.
