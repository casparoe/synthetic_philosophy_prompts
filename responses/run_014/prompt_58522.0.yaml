  Here's a clean example based on two roommates, Alice and Bob, negotiating how to split money and free time from their shared freelance gig. They need to decide how much each works and how the earnings are split. The gig requires a total of 20 hours of work per week to earn $400, but they can choose to work less and earn proportionally less ($20/hour). Each can work up to 10 hours/week, and their free time is (10 hours minus work hours). Alice values free time at $20/hour (she's busy with studies), while Bob values it at $10/hour (he's more flexible). If they can't agree, they do nothing: both get $0 and 10 hours of free time (fallback utility: Alice = 200, Bob = 100). The catch: if total work exceeds 15 hours, Alice’s free time is extra stressful (due to her schedule), reducing her utility by $5 for every hour worked beyond 15. This creates a kink in the feasible set.

  ### Feasible Utility Set
  Utilities are calculated as:  
  - Alice: \( u_A = \text{money}_A + 20 \times \text{free time}_A \)  
  - Bob: \( u_B = \text{money}_B + 10 \times \text{free time}_B \)  

  With the stress rule, the feasible set (in utility space) has a kink. Key points:  
  - **Fallback (disagreement point)**: (200, 100)  
  - **Full work (20 hours)**: Revenue = $400. Free time: Alice = 0, Bob = 0. Without stress, utilities up to (400, 400) if all money goes to one, but with money split, we get points like (400, 100) if Alice takes all money, or (100, 400) for Bob. The stress rule (work > 15 hours) reduces Alice’s utility: for 20 hours, she loses \(5 \times 5 = 25\) (since 5 hours over 15), so her max utility is \(400 - 25 = 375\), not 400. After money split and constraints, the set is bounded by lines connecting:  
    - (200, 100) → (375, 100) [all work by Alice, Bob gets min utility]  
    - (375, 100) → (275, 300) [kink: stress kicks in]  
    - (275, 300) → (200, 400)  
  - **Equations for Pareto frontier**:  
    - Segment 1 (work ≤ 15 hours): \( u_B = 700 - 2u_A \) (for \( u_A \) from 200 to 375)  
    - Segment 2 (work > 15 hours): \( u_B = 900 - 2.5u_A \) (for \( u_A \) from 275 to 200)  

  ### Math: Nash Bargaining Solution
  Maximize the product of gains over fallback: \( (u_A - 200)(u_B - 100) \).  
  - **On Segment 1** (\( u_B = 700 - 2u_A \)):  
    Product = \( (u_A - 200)(700 - 2u_A - 100) = (u_A - 200)(600 - 2u_A) = 2(u_A - 200)(300 - u_A) \).  
    This is a quadratic: \( -2u_A^2 + 1000u_A - 120,000 \). Maximum at vertex \( u_A = 1000 / (2 \times 2) = 250 \).  
    Then \( u_B = 700 - 2 \times 250 = 200 \). Product = \( (250 - 200)(200 - 100) = 50 \times 100 = 5,000 \).  
  - **On Segment 2** (\( u_B = 900 - 2.5u_A \)):  
    Product = \( (u_A - 200)(900 - 2.5u_A - 100) = (u_A - 200)(800 - 2.5u_A) \).  
    Quadratic: \( -2.5u_A^2 + 1300u_A - 160,000 \). Maximum at \( u_A = 1300 / (2 \times 2.5) = 260 \).  
    But \( u_A = 260 \) is outside Segment 2 (which requires \( u_A \leq 275 \)), so check endpoints:  
    - At \( u_A = 275 \), \( u_B = 900 - 2.5 \times 275 = 212.5 \), product = \( (275 - 200)(212.5 - 100) = 75 \times 112.5 = 8,437.5 \) (better).  
    - At \( u_A = 200 \), \( u_B = 400 \), product = 0.  
  - **Compare**: Segment 1 max product = 5,000 (at 250, 200). Segment 2 max product = 8,437.5 (at 275, 212.5).  
    **Nash solution**: (275, 212.5) with higher product.  

  ### Math: Kalai-Smorodinsky Solution
  Ideal point: Max possible utilities ignoring the other.  
  - Max \( u_A \): 375 (Alice works 15 hours, takes all money, no stress).  
  - Max \( u_B \): 400 (Bob works 10 hours, takes all money from 10 hours work; Alice works 5 hours for min free time utility: \( 20 \times 5 = 100 \), but Bob’s money split gives her $0, so \( u_A = 100 + 0 = 100 \) — but we need max \( u_B \) ignoring Alice, so we let Alice’s utility drop to fallback or lower, but since fallback is 200, we cap at feasible max: Bob can get up to 400 when \( u_A = 200 \)).  
  Ideal point: (375, 400).  

  Ray from fallback (200, 100) to ideal (375, 400):  
  Slope = \( \frac{400 - 100}{375 - 200} = \frac{300}{175} = \frac{12}{7} \approx 1.714 \).  
  Parametric equations:  
  \( u_A = 200 + 175t \)  
  \( u_B = 100 + 300t \)  
  Find where this ray hits the Pareto frontier.  

  - **Intersect with Segment 1** (\( u_B = 700 - 2u_A \)):  
    Set \( 100 + 300t = 700 - 2(200 + 175t) \)  
    \( 100 + 300t = 700 - 400 - 350t \)  
    \( 100 + 300t = 300 - 350t \)  
    \( 650t = 200 \)  
    \( t = 200/650 = 4/13 \approx 0.3077 \)  
    Then \( u_A = 200 + 175 \times (4/13) = 200 + 700/13 \approx 253.85 \)  
    \( u_B = 100 + 300 \times (4/13) = 100 + 1200/13 \approx 192.31 \)  
    But check if valid: Segment 1 requires \( u_A \leq 375 \) (ok), but does (253.85, 192.31) satisfy \( u_B = 700 - 2u_A \)?  
    \( 700 - 2 \times 253.85 = 700 - 507.7 = 192.3 \) → yes.  

  - **Intersect with Segment 2** (\( u_B = 900 - 2.5u_A \)):  
    Set \( 100 + 300t = 900 - 2.5(200 + 175t) \)  
    \( 100 + 300t = 900 - 500 - 437.5t \)  
    \( 100 + 300t = 400 - 437.5t \)  
    \( 737.5t = 300 \)  
    \( t = 300 / 737.5 = 24/59 \approx 0.4068 \)  
    Then \( u_A = 200 + 175 \times (24/59) = 200 + 4200/59 \approx 271.19 \)  
    \( u_B = 100 + 300 \times (24/59) = 100 + 7200/59 \approx 222.03 \)  
    But Segment 2 requires \( u_A \leq 275 \) (ok), and check: \( 900 - 2.5 \times 271.19 = 900 - 677.975 = 222.025 \) → yes.  

  - **Which segment?** The ray hits Segment 1 at \( t \approx 0.3077 \) and Segment 2 at \( t \approx 0.4068 \). Since \( t \) increases along the ray, the first hit is with Segment 1 at \( t = 4/13 \).  
    **KS solution**: \( (200 + 175 \times 4/13, 100 + 300 \times 4/13) = (200 + 700/13, 100 + 1200/13) \approx (253.85, 192.31) \).  

  ### Results
  - **Nash solution**: (275, 212.5)  
  - **KS solution**: (253.85, 192.31)  
  - **Difference**: Nash gives Alice $21.15 more utility (≈ $14 more cash or 0.7 extra free hours) and Bob $20.19 less utility (≈ $13 less cash or 1.3 fewer free hours) than KS.  

  ### Why They Diverge
  The kink at (275, 300) causes the split. Segment 1 (right of kink) has a steep utility tradeoff (−2 slope: Alice gains less per unit Bob loses), while Segment 2 (left of kink) is flatter (−2.5 slope: Alice gains more per unit Bob loses). Nash maximizes the product and prefers the flatter segment (Segment 2) where gains are "balanced." KS follows the ray from fallback to ideal (slope 1.714) and hits the steeper Segment 1 first, favoring Bob slightly more.  

  ### Smoothing the Kink
  If the stress effect were gradual (e.g., linear reduction in Alice’s utility for work beyond 15 hours), the frontier would curve smoothly. Nash and KS would converge closer (e.g., near (265, 202)), as the steepness change is less abrupt.  

  ### Nash Fan's Complaint
  A die-hard Nash fan might argue: "This kink is artificial! In reality, the stress effect is smoother, making Nash’s product-maximization more robust." This has merit—kinks often stem from simplified models. But discrete choices (e.g., "work mode shifts") create real kinks. Here, it’s intentionally sharp to illustrate how solution concepts react to non-smooth frontiers.  

  ### Verification (Phone Calculator)
  - **Nash at (275, 212.5)**:  
    Gain product: \( (275 - 200) \times (212.5 - 100) = 75 \times 112.5 = 8,437.5 \).  
  - **KS at (253.85, 192.31)**:  
    \( u_A \): \( 200 + 175 \times (4/13) = 200 + 53.846 = 253.846 \)  
    \( u_B \): \( 100 + 300 \times (4/13) = 100 + 92.308 = 192.308 \)  
    Ray slope: \( \frac{192.308 - 100}{253.846 - 200} = \frac{92.308}{53.846} \approx 1.714 \).  
  - **Ideal point**: (375, 400) → matches max utilities.  

  This shows a clear, calculable difference driven by the frontier’s shape!
