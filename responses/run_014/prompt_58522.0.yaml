  The feasible business plans give the following (u_A, u_B) outcomes:

  - Plan X: (400,100)
  - Plan Y: (300,300)
  - Plan Z: (200,400)

  And mixtures of these plans. For example, they can do a fraction of one plan and a fraction of another, so the feasible set is the convex hull of (200,100), (400,100), (300,300), (200,400). This set has a kink at (300,300).

  Now, the math:

  Fallback: d = (200,100)

  Nash bargaining solution: maximizes (u_A-200)*(u_B-100)

  As computed, maximum is 20000 at (300,300).

  Kalai-Smorodinsky: ideal point is (400,400). The line from (200,100) to (400,400) is parameterized by (200+200t, 100+300t) for t in [0,1].

  This line intersects the boundary at t=4/7: (2200/7, 1900/7) ≈ (314.2857, 271.4286).

  So Nash: (300,300) and KS: (314.2857, 271.4286).

  The difference is due to the kink at (300,300). The KS solution is on the segment from (400,100) to (300,300), which has a steeper tradeoff (slope -2) than the segment from (300,300) to (200,400) (slope -1). The KS solution does not go all the way to the kink because it is following the ray from the fallback to the ideal, which has a slope of 300/200=1.5, and it hits the steeper segment (slope -2) first.

  If we smoothed out the kink, say by making the set strictly convex, then the two solutions would be closer, but in this case the kink causes the difference.

  A die-hard Nash fan might complain that the example is rigged because the set is not smooth. They might argue that in reality, the set is likely to be smooth. However, in many real-world scenarios, there are discrete choices that create kinks. For instance, different business plans or technologies might create such kinks.

  This shows that when the feasible set has a kink, the two solutions can diverge.

  Now, to do the arithmetic for the KS solution:

  t = 4/7
  u_A = 200 + 200*(4/7) = 200 + 800/7 = (1400+800)/7 = 2200/7 ≈ 314.2857
  u_B = 100 + 300*(4/7) = 100 + 1200/7 = (700+1200)/7 = 1900/7 ≈ 271.4286

  For Nash: (300,300)

  The difference in u_A is about 14.2857 and in u_B is about -28.5714.

  This should be noticeable.
