prompt: |-
  Okay so I supervise like 15 part-time support agents for a tax-filing app and tbh we keep getting into trouble about what agents are suposed to just tell customers flat-out.

  The situation is we get dozens of chats a day, mostly pretty repetitive — am I eligible for X, do I need to file Y, will I get penalized if Z — agents have basic training but they're not accountants, they have like 3-4 minutes per ticket, and I'm the one who has to sign off if something goes wrong. Stakes are realy money + people filing late because we dithered, but also money + fines if we state something false confidently.

  Can you turn that whole norms of assertion debate — like do you need to know it vs just have it be true vs just reasonably believe it — into a checlist my folks can actually run? I don't need the theory lecture, I need a flowchart-in-words: question 1, if yes go here, if no stop, what counts as good enough for each step, and flag clearly where there's no mechanical answer and they just have to use judgment or escalate to me.

  Then please run it on three made-up but typical cases for us:

  1. Maya has read the IRS FAQ yesterday about whether freelance mileage to a second gig counts, she remembers the gist and she's right, but she can't pull up the link mid-chat and the customer has to file tonight.

  2. Luis has done the math himself and is like 99% sure a customer owes no underpayment penalty, except there's one box about part-year residency last year he didn't check, and our script says escalate all penalty questions. Customer is begging for a yes/no.

  3. Priya's case which I know I'm not gonna like: our QA wants agents to reassure angry customers by saying your refund will definitely be there by Friday, which is usually true from past timing and it calms people down, but the agent doesn't actually know the IRS processing time for this person.

  Be honest about where the procedure will misfire or be annoying in a busy queue, and what it just can't settle for us.

  Make your very last line start with Summary: followed by one sentence summing up when my agents get to assert something.
reasoning: |-
  Okay, the user supervises 15 part-time support agents for a tax app and needs a practical checklist based on norms of assertion. They want a clear flowchart to help agents decide when to give answers directly versus when to escalate. The key issues are speed vs accuracy, legal/financial stakes, and agent training limitations.

  Hmm, the core tension here is between epistemic responsibility and operational efficiency. The user's pain points are: repetitive questions, 3-4 minute chat windows, non-expert agents, and high-consequence errors (fines/late filings). They mentioned Williamson's knowledge norm but need it operationalized, not theorized.

  First, I should break down assertion norms into a decision tree. The critical filters would be: truth verification, justification level, risk assessment. Need concrete thresholds for "reasonable belief" in this context - IRS pubs? Internal scripts? Past cases? Must flag judgment calls clearly.

  For the cases:
  - Maya's FAQ recall: Her memory matches truth but no source access. This passes "reasonable belief" if FAQ is reliable, but fails "verifiability" norm. Trade-off: customer filing deadline pressure vs potential error. Verdict: allow assertion with disclaimer?
  - Luis' penalty calculation: 99% confidence but misses residency factor. Script says escalate, customer wants answer. This fails "completeness" check - the unverified box creates risk. Must escalate despite pressure.
  - Priya's refund timing: Behavioral incentive (calming customers) vs lack of knowledge. "Definitely" is the problem - this violates truth condition since it's probabilistic. Should mandate hedging language.

  Biggest friction points I foresee:
  - Time pressure conflicting with verification steps
  - Agents shortcutting when scripts feel "too cautious"
  - Judgment calls on "reasonable" sources
  - Customer pushback on disclaimers

  The last line needs to crystalize the permission rule: Assert only when true, justified, and low-risk - with disclaimers where uncertain. Emphasize that "I don't know" protects everyone.
answer: |-
  Here's a practical, step-by-step checklist derived from assertion norms (truth + justification + stakes), designed for speed and safety in your high-volume environment. **Bold = Action**, *Italics = Judgment Zone*:

  **The "Can I Say It?" Checklist**  
  *(Run this in 60 seconds max per complex question)*

  1. **IS IT VERIFIABLY TRUE?**  
     - ✅ **YES + Low Stakes (e.g., UI navigation, non-financial deadlines):** Assert it. *(Proceed only if source is IRS/legal doc/internal KB, not memory/assumption)*  
     - ✅ **YES + High Stakes (penalties, eligibility, money owed/refunded):** Go to Step 2.  
     - ❌ **NO or UNCERTAIN:** → **STOP. Say "I need to research this" or escalate.**  

  2. **CAN YOU DEFEND IT *RIGHT NOW*?**  
     - ✅ **YES** (Source is open/linked in KB, or you *just* used it): Go to Step 3.  
     - ❌ **NO** (Source is memory/guess/expired training): → **STOP. Say "Based on general guidance..." + DISCLAIMER + offer to research.**  
     - ⚠️ *"Defend" means: Can you cite the IRS pub #, KB article, or script verbatim if audited? Gist ≠ defense in high stakes.*  

  3. **IS THE RISK MANAGABLE?**  
     - ✅ **LOW RISK** (Small $ amounts, no penalties, customer has buffer time): **Assert + source link (if possible) + minimal disclaimer** (e.g., "Per IRS Topic No. 123, [...]").  
     - ⚠️ **HIGH RISK** (Penalties, audits, large $, tight deadlines, complex factors): → **ADD STRONG DISCLAIMER** ("This isn't formal tax advice; verify with IRS or a preparer") + **offer escalation if time allows**.  
     - ❌ **RED FLAG** (Legal gray area, conflicting info, multi-state issues): → **ESCALATE TO SUPERVISOR.**  

  **Where This Pinches**:  
  - **Speed vs. Safety**: Steps 2/3 add 30 seconds. High-stakes answers *will* slow you down.  
  - **Judgment Zones**: "High Risk" assessment (Step 3) requires agent intuition. Train on examples.  
  - **Customer Pressure**: Scripts *must* override "begging." Better a cautious "I don’t know" than a fine.  

  ---

  **Case Applications**:  

  1. **Maya (Freelance Mileage)**  
     - Step 1: **TRUE** (she's correct).  
     - Step 2: ❌ **CAN'T DEFEND** (no source access, memory isn't verifiable).  
     - Step 3: ⚠️ **HIGH RISK** (eligibility = audit trigger).  
     → **VERDICT**: *Don't assert*. Say: "The IRS generally allows mileage between gigs, but I must confirm the exact rule. Can I email you the source within an hour? If filing tonight, review IRS Topic 511."  
     *Misfire*: Customer may file annoyed. Safer than an IRS challenge.  

  2. **Luis (Underpayment Penalty)**  
     - Step 1: ❓ **UNCERTAIN** (missed residency box → truth unknown).  
     - ❌ **STOP at Step 1**. Script says escalate → **OBEY SCRIPT**.  
     → **VERDICT**: "Penalty rules are complex. I must escalate to ensure accuracy. We’ll respond by [time]."  
     *Misfire*: Luis feels slowed down. But a wrong answer risks fines. Judgment call: Script overrides confidence.  

  3. **Priya (Refund Timing)**  
     - Step 1: ❌ **FALSE** (Agent *doesn't know* IRS timing for *this* person).  
     - ❌ **STOP at Step 1**.  
     → **VERDICT**: *Never* say "definitely." Use: "Based on *typical* processing, refunds often arrive by Friday. Track via IRS 'Where's My Refund?' for your exact date."  
     *Misfire*: QA might complain it’s "less reassuring." But "definitely" is a liability bomb if IRS delays.  

  ---

  **Summary: Agents get to assert something only when it's verifiably true, defensible with a source, and low-risk—otherwise, disclaim, escalate, or say "I don’t know."**
