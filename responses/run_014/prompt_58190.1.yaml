  Clarification: In the process of iterated elimination, we first eliminate C (because it is strictly dominated by a mixture of A and B). Then, in the reduced game, we eliminate R (because now it is strictly dominated by a mixture of L and M). 

  But note: the mixture that dominates R in the reduced game uses only L and M (which are still present). The question of using a strategy that has been eliminated in a mixture for dominating another strategy does not arise here because we are only using strategies that are still present (L and M) to form the mixture that dominates R. 

  However, the general rule is: at any round, we can only use mixtures of strategies that are still present (i.e., not yet eliminated) to check for strict dominance. We do not use strategies that have been eliminated in a mixture to dominate another strategy. This is crucial for the coherence of iterated elimination because once a strategy is eliminated, it is considered irrational and hence not available for forming mixtures. 

