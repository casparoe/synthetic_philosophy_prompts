    - Against R: both A and B give 6, which is more than C's 5.

  So individually, neither A nor B always yields a higher payoff than C. However, consider a mixed strategy of A and B.

  Suppose Row plays a mixed strategy: play A with probability p and B with probability 1-p (and C with probability 0). Then the expected payoff of this mixture against each Column choice:

    vs L: p*10 + (1-p)*0 = 10p
    vs M: p*0 + (1-p)*10 = 10(1-p)
    vs R: p*6 + (1-p)*6 = 6

  Now, compare to C:

    vs L: 10p > 4? We require 10p > 4 => p > 0.4
    vs M: 10(1-p) > 4? => 10 - 10p > 4 => 6 > 10p => p < 0.6
    vs R: 6 > 5 (always true)

  So if Row chooses p in the interval (0.4, 0.6), then for every Column choice (L, M, R) the mixed strategy gives a strictly higher payoff than C.

  For example, p=0.5: 
    vs L: 5 > 4
    vs M: 5 > 4
    vs R: 6 > 5

  Therefore, C is strictly dominated by the mixed strategy (A:0.5, B:0.5).

  Geometric intuition: The payoffs of pure strategies A and B are (10,0,6) and (0,10,6) respectively, while C is (4,4,5). The mixed strategy we are considering is a convex combination of A and B. We are looking for a point on the line segment between A and B that is above C in all coordinates (i.e., in all states of the world, i.e., against every Column choice). We can see that the mixed strategy with p=0.5 gives (5,5,6) which is indeed above (4,4,5). So even though C is not dominated by any pure strategy, it is dominated by a mixture of A and B.

