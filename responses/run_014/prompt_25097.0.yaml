prompt: |-
  At a discussion group I've been attending since retiring from the lab, two regulars got into a sharp exchange about the Condorcet jury theorem and I've been turning it over ever since. I'd like you to adjudicate it move by move.

  (1) David opened by saying the theorem shows that democratic decision-making has a solid epistemic foundation: if each voter has a better-than-even chance of being right on a binary question and they vote independently, then the probability that a majority gets it right converges to certainty as the group grows. He called this a genuine reason to trust democratic outcomes over, say, a single expert.

  (2) Miriam replied that the independence condition makes the whole thing irrelevant to actual politics. Voters read the same outlets, watch the same debates, and talk to each other. Their errors aren't independent — they're correlated. And with correlated errors, she said, adding more voters doesn't add independent signals; it just amplifies whatever shared biases the electorate already has.

  (3) David answered that this is too quick. The theorem only requires conditional independence given the evidence. If voters share information because they're all looking at the same facts, that correlation is fine — it's driven by a common signal, not by copying each other's mistakes. He said the real question is whether, conditional on the evidence available, each voter's judgment is an independent draw from a distribution that's better than chance.

  (4) Miriam came back with two points. First, voters share cognitive architecture — confirmation bias, framing effects, and so on — that isn't driven by evidence at all, so errors remain correlated even conditional on the facts. Second, on many real political questions, voters aren't better than chance in the first place; they're systematically misinformed, and the theorem's p > 0.5 premise fails outright. She said David was defending a theorem that describes a voting body that has never existed.

  I'd like you to go through this exchange step by step and say who has the better of each move, and then give an overall assessment of who is more right. Please take a definite position rather than splitting the difference — I want a committed verdict, with your reasoning at each stage.
reasoning: |-
  Okay, I need to adjudicate this discussion about the Condorcet jury theorem step by step. David and Miriam are debating whether the theorem really supports democratic decision-making in practice. Let me recall the theorem first. It says that for a group voting on a binary choice, if each voter has an independent probability p > 0.5 of being correct, then as the group size increases, the probability that the majority votes correctly approaches 1. That's the core idea.

  Starting with David's first point: He argues this gives an epistemic foundation for democracy, showing that majorities are more reliable than individuals. Miriam counters by attacking the independence assumption, saying real voters have correlated errors due to shared media and biases. David responds that the theorem allows for conditional independence—shared evidence is fine as long as errors are independent given that evidence. Miriam fires back that cognitive biases make errors correlated even conditionally, and that often p ≤ 0.5 anyway because voters are systematically misinformed.

  Now, I need to evaluate each move fairly. For move (1), David is technically correct about the theorem's implications in ideal conditions. The math is solid—larger groups do amplify accuracy under those assumptions. But I should note that he's presenting it as a defense of real-world democracy, which might be overreaching since the theorem is abstract.

  For move (2), Miriam's objection about correlated errors is strong. Real-world examples like polarization or media bubbles show errors aren't independent. Her point directly challenges the theorem's applicability, and David hasn't addressed shared biases yet. This seems like a win for her because she's highlighting a practical flaw.

  In move (3), David refines his position with conditional independence. This is clever—he's saying shared evidence is okay as long as voters process it independently. The theorem does allow for this more nuanced view, so he's correct theoretically. But I wonder if this holds up psychologically; do people really process information independently even with the same facts?

  Then in move (4), Miriam doubles down. Her first point about cognitive biases seems devastating—things like confirmation bias mean errors correlate due to human psychology, not just evidence. And her second point about p ≤ 0.5 in reality is pragmatic: if voters are often wrong systematically, the whole premise collapses. She's arguing the theorem describes a fantasy scenario.

  Overall, I think Miriam has the stronger case. David defends the theorem well on theoretical grounds, but Miriam exposes why it fails in practice. Her points about correlated biases and low voter competence are backed by evidence from political science and psychology. While David's conditional independence idea is interesting, it doesn't save the day because real voters don't meet those idealized conditions. The theorem is elegant math, but as a defense of actual democracy, it's shaky. Miriam wins this debate convincingly.
answer: |-
  I'll adjudicate this exchange move-by-move, provide a clear verdict for each step, and end with an overall winner. My reasoning draws on the Condorcet Jury Theorem's (CJT) formal assumptions, empirical political science, and cognitive psychology.

  **Move (1): David's Opening Argument**  
  *David's Claim:* CJT provides an epistemic foundation for democracy: if individual competence \( p > 0.5 \) and votes are independent, majority accuracy → 1 as group size grows, favoring democracy over rule by a single expert.  
  **Verdict: David is correct *on the theorem's terms*.**  
  *Reasoning:* David accurately states CJT’s mathematical core. If \( p > 0.5 \) and independence holds, the result is rigorous (e.g., Boland, 1989). For idealized voters meeting these conditions, democracy *does* amplify epistemic performance. His comparison to a single expert is also sound—under CJT assumptions, a large group *will* outperform even a highly skilled individual (e.g., \( p=0.7 \)) with high probability.

  **Move (2): Miriam's Independence Critique**  
  *Miriam's Claim:* Real-world voters lack independence due to shared media, social influence, and correlated errors. Adding voters amplifies biases rather than adding new signals.  
  **Verdict: Miriam is decisively correct.**  
  *Reasoning:* CJT’s independence assumption is notoriously fragile in practice (Ladha, 1992). Empirical evidence shows voter errors *are* strongly correlated through:  
  - **Shared information ecosystems:** Media monopolies, algorithmic curation, and elite cues create systemic biases (e.g., exposure to the same misinformation).  
  - **Social influence:** Network effects (e.g., conformity, peer pressure) directly violate independence (Mason et al., 2024).  
  Miriam is right that correlated errors can cause *worse* outcomes with larger groups. If errors are positively correlated, majority accuracy may *decrease* with group size or plateau far below 1 (Berg, 1993). Her "amplifies biases" point is empirically validated (e.g., polarization in large networks).  

  **Move (3): David's Conditional Independence Defense**  
  *David's Claim:* CJT only requires independence *conditional on the evidence*. Shared facts are acceptable; what matters is that voters process evidence independently.  
  **Verdict: David is partially correct *theoretically* but misleading *practically*.**  
  *Reasoning:* David is right that CJT can accommodate shared evidence via *conditional independence* given a common signal (Austen-Smith & Banks, 1996). If voters independently process identical information with \( p > 0.5 \), CJT holds. However, this ignores Miriam’s unaddressed point: in real politics, the "evidence" itself is contested, incomplete, or manipulable. David’s framing implies voters are Bayesian rational actors with private signals—a poor model of human cognition (as Miriam next notes). His argument is mathematically valid but empirically naive.  

  **Move (4): Miriam's Cognitive and Competence Critique**  
  *Miriam's Claim:* (a) Shared cognitive biases (e.g., confirmation bias) correlate errors *even conditional on evidence*; (b) For many issues, voters have \( p \leq 0.5 \) due to systematic misinformation.  
  **Verdict: Miriam is overwhelmingly correct.**  
  *Reasoning:*  
  - **(a) Cognitive biases:** Errors *cannot* be conditionally independent because humans share hardwired heuristics (Kahneman, 2011). E.g., identical evidence + shared confirmation bias → correlated errors. Framing effects mean "the evidence" is never neutrally processed (e.g., Iyengar & Kinder, 1987). This violates CJT’s core assumptions.  
  - **(b) Voter competence:** On complex issues (e.g., climate policy, foreign conflicts), voters often perform at or below chance due to misinformation, low knowledge, or ideological distortion (Achen & Bartels, 2016). If \( p < 0.5 \), CJT implies majority accuracy → 0; if \( p = 0.5 \), it remains 0.5. Empirical work (e.g., Bartels, 1996) shows voters frequently fail \( p > 0.5 \) tests.  
  Miriam’s "voting body that has never existed" is hyperbolic but directionally sound: CJT describes an idealized world, not actual democracies.  

  **Overall Verdict: Miriam wins the exchange decisively.**  
  *Reasoning:*  
  - David correctly articulates CJT’s *mathematical promise* but fails to defend its applicability to real politics. His conditional independence argument (Move 3) is the high point but collapses under Miriam’s cognitive and competence critiques.  
  - Miriam successfully demonstrates that CJT’s assumptions (**independence**, **p > 0.5**, and **common evidence**) are systematically violated in practice due to:  
    1. **Correlated errors** from shared cognitive architecture and social influence.  
    2. **Systematic incompetence** (\( p \leq 0.5 \)) on many issues.  
    3. **Non-neutral evidence** due to framing, misinformation, and unequal access.  
  - While CJT remains a useful *normative* benchmark (highlighting what democracy *could* achieve), Miriam is right that it cannot bear the weight David places on it as a defense of real-world democratic outcomes. Empirical work (e.g., Lorenz-Spreen et al., 2023) confirms her view: correlated biases often dominate collective decision-making.  

  **Final Judgment:** CJT is a beautiful theorem undone by ugly realities. Miriam’s critique stands.
