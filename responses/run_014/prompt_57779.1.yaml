  But I recall that philosophers like Goodman aren't making empirical claims. They're exploring conceptual distinctions. Goodman's point is about aesthetic properties depending on historical context, not just physical attributes. Even if two objects look identical, their origins affect how we perceive them. For example, knowing something is a forgery changes our engagement, even if we can't see a difference.

