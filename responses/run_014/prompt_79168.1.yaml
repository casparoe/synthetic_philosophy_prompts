  I'll avoid floral language; the imagery needs starkness to match the problem's severity. Words like "knot," "grip," "pull," "cut" keep it tactile. The climbers' shared breath and whitened knuckles show mutual awareness trapped in competition. 

  Hmm, user didn't specify tone, but their "nasty part" comment suggests bleakness. The poem leans into that—no heroism, just exhaustion and forced cessation.
answer: |-
  ## Commitment Race

  Two climbers on a rope ascend the face,  
  Each grips the line, each tests the slack and strain.  
  To bind it fast becomes a frantic race.

  The first to knot secures the higher gain,  
  A ledge above the void, precarious, thin.  
  The other, bound below, endures the pain.

  So hands fly, weaving locks against the spin  
  Of consequence, each twist a tighter hold,  
  A deeper cut the knot will anchor in.

  The higher climber, desperate and bold,  
  Secures again, a loop beyond the last,  
  Forsaking solid rock for purchase sold

  By haste alone. The die is truly cast:  
  Their frantic binds erase the planned ascent.  
  Below, the second knots too tight, too fast,

  Mimicking moves the first one rashly spent.  
  They hang suspended, neither gaining ground,  
  The rope itself their only testament.

  A voice says "Stop." They freeze without a sound.  
  The knot is cut. They fall.

  ---

  **Notes on Execution:**
  *   **Form:** Terza rima (ABA BCB CDC DED EFE FGF GG - with the final couplet broken by the abrupt cut).
  *   **Image:** Two climbers on a single rope, binding/knotting it higher and faster in a frantic race for positional advantage.
  *   **Rhyme Agents:** The 'A' rhyme (face/race/gain/pain/spin/in/bold/sold/cast/spent/ground/sound) and 'B' rhyme (strain/race/ascend/gain/thin/spin/hold/in/last/cast/fast/ground) represent the two agents' escalating commitments.
  *   **Mechanics:** Each tercet forces the next commitment (rhyme). The climbers mirror each other's increasingly desperate, self-defeating actions ("Mimicking moves the first one rashly spent").
  *   **Break:** The final tercet (FGF) sets up the expected 'G' rhyme... but the last line ("They fall.") breaks the chain abruptly and doesn't rhyme, mirroring the external, non-strategic interruption ("A voice says 'Stop.'").
  *   **Recognition:** The core dynamic (mutual pre-emptive binding for advantage leading to worse outcomes, no internal stopping point) is embedded in the action without explicit theory terms. The broken chain embodies the necessary external halt.
