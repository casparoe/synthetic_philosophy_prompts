answer: |-
  ### **The Intention Challenge: A Game for Kavka's Toxin Puzzle**  
  **Objective:** Students experience the core tension of Kavka's puzzle—forming an intention for a mildly unpleasant act to win a prize, where the prize is decoupled from performing the act—before learning formal concepts like "intention," "prediction," or "decision."  

  ---

  ### **Materials**  
  - **Unpleasant Act:** A pitcher of unsweetened cranberry juice (bitter, safe, and ethical). Small paper cups for sipping.  
  - **Currency:** "Wisdom Tokens" (WT), redeemable for minor perks (e.g., 1 WT = +0.5% final grade bonus; 5 WT = skip one reading response). Track tokens on a public board.  
  - **Verification Tools:** Blank slips of paper, pens, and a sealed "Declaration Box" (e.g., a shoebox with a slot).  
  - **Timer:** For the 1-minute act.  

  ---

  ### **Rules**  
  1. **Prize Structure:**  
     - 5 WT for submitting a sealed declaration of intention to sip the juice at the end of class.  
     - WT are awarded immediately upon submission, **regardless** of whether the sip is taken.  
     - An extra 2 WT for actually sipping the juice (total possible: 7 WT).  

  2. **Verification Mechanism:**  
     - Students write: *"I intend to sip the bitter juice at 5:00 PM today."* + signature.  
     - Declarations are sealed in the box. The box remains sealed until the debrief.  
     - WT are awarded based **only** on submitting the declaration.  

  3. **Act Protocol:**  
     - At the designated time, the pitcher is placed at the front.  
     - Students who submitted declarations may come forward to sip the juice (1-minute window).  
     - No pressure or observation: Students sip privately at the pitcher (no audience).  

  4. **Complication: Partner-Round Twist**  
     - After Round 1, students pair up. Each advises their partner on whether to submit a declaration in a **hypothetical identical scenario** (no real WT or juice involved).  
     - Partners record advice anonymously and swap notes.  

  ---

  ### **Timeline (75 Minutes Total)**  
  **Phase 1: Setup (5 min)**  
  - **0:00–0:05:** Introduce the game without jargon.  
    - *"You can earn Wisdom Tokens (WTs) for a simple task. Write a private declaration if you intend to sip bitter juice later. You get tokens just for submitting it, even if you don’t sip. If you do sip, bonus tokens. The juice is safe but unpleasant—like strong herbal tea."*  
    - Emphasize: Declarations are sealed, tokens awarded immediately.  

  **Phase 2: Round 1 – Individual Intention (15 min)**  
  - **0:05–0:10:** Deliberation and declaration.  
    - Students write declarations silently. No discussion. Collect declarations in the box.  
  - **0:10–0:15:** Award 5 WT to all who submitted. Record tokens publicly.  
    - *"Tokens are yours. No one will know what you declared until later."*  
  - **0:15–0:20:** Transition to normal seminar (e.g., brief discussion of a pre-read text).  

  **Phase 3: Complication – Partner Advice (15 min)**  
  - **0:20–0:25:** Pair students randomly.  
    - *"Advise your partner: Should they submit a declaration in this same game? Why? Write anonymously."*  
  - **0:25–0:30:** Partners write advice (e.g., *"Submit it—easy tokens!"* or *"Don’t—you’ll regret sipping"*).  
  - **0:30–0:35:** Swap and discuss advice in pairs.  

  **Phase 4: Act Execution (5 min)**  
  - **0:70–0:75 (End of class):**  
    - Place juice pitcher at front. *"If you submitted a declaration, you may sip now for 2 bonus WT. No one is watching; come up quietly."*  
    - Teacher discreetly records sippers (no public shaming). Award bonus WT.  

  **Phase 5: Debrief (25 min)**  
  - **0:50–0:70 (Before act):** Normal seminar content (unrelated to action theory).  
  - **0:75–0:85 (Post-act):** Open discussion:  
    1. *"How many declared? How many sipped? Why?"*  
    2. *"What did your partner advise? Did you agree?"*  
    3. **Key Q1:** *"When you wrote your declaration, were you deciding, predicting, or something else?"*  
       - Map responses to intention (commitment) vs. prediction (belief about future actions).  
    4. **Key Q2:** *"Could you ‘make yourself’ intend to sip when you wrote it? Or did you just want tokens?"*  
       - Highlight the gap: Intention feels active; prediction feels passive.  
    5. **Verification Honesty:** *"I awarded tokens for the declaration, not your mental state. In the real puzzle, the prize is for the intention itself—but we can’t see that. Our game changed the puzzle by using declarations as a stand-in. This means some of you might have ‘gamed’ it by writing without intending. That’s a limitation I’ll address next class."*  
  - **0:85–0:90:** Preview Kavka’s puzzle: *"Today, you felt a friction: Can you intend something when you know you might not do it?"*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem: Students sip without deliberation or skip thoughtlessly.**  
     - *In-Moment Fix:* During deliberation, remind them: *"Think: Why might you sip or not? Your future self might disagree with your current self."*  
     - *Debrief Use:* Contrast impulsive vs. calculated choices to surface intention-prediction gaps.  

  2. **Problem: Students "game" the system (e.g., declare without intending, then skip).**  
     - *In-Moment Fix:* Award tokens neutrally—don’t judge. Say: *"Smart move. But did you *truly* intend when you wrote it?"*  
     - *Debrief Use:* This reveals the verification problem. Ask: *"If intentions are private, how could the prize-giver in Kavka’s puzzle ever know?"*  

  3. **Problem: Dominant strategy emerges (all declare, none sip).**  
     - *In-Moment Fix:* If many skip sipping, highlight: *"Interesting—most took tokens but passed on the act. Why?"*  
     - *Debrief Use:* Explore rational self-interest vs. commitment. Ask: *"If skipping is rational, how could anyone form a real intention?"*  

  4. **Problem: Students advise partners cynically (e.g., "Declare, then skip!").**  
     - *In-Moment Fix:* Note aloud: *"Some advice is purely strategic—what does that assume about intentions?"*  
     - *Debrief Use:* Contrast strategic advice ("Predict you’ll skip") with moral advice ("Intend to follow through").  

  ---

  ### **Why This Works**  
  - **Friction Achieved:** Students feel the pull between easy rewards (declaring now) and the pointless unpleasantness (sipping later). The partner round amplifies this by exposing social/rational tensions.  
  - **Ethical & Safe:** Sipping juice is harmless but memorable. Tokens avoid real money.  
  - **Verification Addressed:** Declarations are a transparent proxy for intentions. Debrief clarifies the mental-state gap.  
  - **Complication:** Partner advice surfaces how we judge others’ intentions versus our own, priming discussion on intention-as-commitment.  

  **First-Run Tip:** Expect chaos—students may laugh, overthink, or resist. Lean into it: *"Your confusion is the point! We’ll untangle it next class."* This builds curiosity for Kavka’s puzzle.
