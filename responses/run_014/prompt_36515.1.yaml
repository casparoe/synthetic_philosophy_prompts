  - Unpleasant act: real, harmless, ethical (e.g., sip of bitter liquid, awkward pose).
  - Payoff: use a course-adjacent currency (e.g., "philosophy points" redeemable for small perks like a homework extension, a candy, or a sticker).
  - Verification: We cannot observe mental states, so we must condition the prize on some observable proxy (e.g., a written declaration, witnessed commitment). In the debrief, we must explain how this substitution changes the experience.
  - Designed complication: e.g., a second round where students advise a classmate or a comparison arm where the prize is for declaration alone.
