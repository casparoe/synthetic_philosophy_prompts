prompt: |-
  I'm TA-ing an upper-level undergrad course this term — philosophy and CS cross-listed, roughly "belief, knowledge and computation" — and the professor is out with a busted wrist through the whole exam period, so for the first time in my life I'm writing the final on my own. I sat this exact exam four years ago and got a B on the essay, and I remember precisely why: the question asked about the problem of logical omniscience and I reproduced the standard recitation, that possible-worlds models of belief make an agent believe every logical consequence of what they believe, that this is obviously false of real people, and then a shopping list of proposed repairs. All true, all worthless. Since then I've come to think the interesting question is whether any of those repairs actually fixes anything, or whether they just move the problem somewhere less visible — and that's the thing I want this year's students to have to grapple with. (Separately, my flatmate does ML and announced at dinner last week that their system "isn't logically omniscient because it's neural, it can't even do modus ponens reliably," and I wanted to say something smart about how failing to be closed under consequence isn't the same as being free of the problem, and I froze. So, personal stakes.)

  Here's what I need: one essay question, answerable in 75 minutes, worth 25 marks, that a student cannot pass by reciting. Please anchor it in a concrete little case rather than in abstractions — something like an agent who believes p and believes p → q and has no defeaters, is competent, isn't asleep or distracted, and still simply hasn't drawn the conclusion, so that on the semantics there's no world left where they fail to believe q. I want the crux to be a forced choice about what a repair has to deliver: if you add impossible worlds, or an awareness operator, or restrict closure to consequences the agent has actually spotted, or take Stalnaker's line that omniscience is a harmless idealisation of the same species as frictionless planes — what does each one have to give up in order to work, and does what it gives up amount to the thing that made the possible-worlds picture worth having in the first place? Specifically, I want the question to make students notice that a fix which makes belief sets arbitrarily fine-grained can end up with no constraints at all on what can be ascribed to an agent, which is arguably worse than the disease, and that the idealisation defence has to explain why dropping computational limits is unlike dropping friction — the idealised-away factor here seems to be what makes the difference between two agents' beliefs, not just a distortion of something else. Make the question demand that they compare at least two repairs head to head and say which they'd keep and why.

  Deliverables, in this order: the question text as it would appear on the paper; a model answer of about 700 words written in the voice of a strong student, argumentative rather than encyclopaedic, reaching an actual verdict about which repair survives; and a marking scheme out of 25 that names four to six specific moves the answer has to make and says how many marks each is worth. The scheme should explicitly draw the line between an A and a B by naming moves only an A contains — I'm thinking something along the lines of "a B lists the repairs and their costs; an A explains what standard a repair has to meet to count as solving the problem rather than redescribing it." Then give me five mistakes students genuinely make on this topic and how much each should cost: for instance treating the problem as merely about memory and time rather than about how content is individuated, thinking the trouble only arises for knowledge and not belief, assuming that giving up closure under known implication and giving up necessitation are the same concession, or declaring impossible worlds a solution without saying how those worlds get individuated so that the semantics doesn't collapse into taking the belief set as primitive. Half my class are CS students who've done modal logic but no philosophy, so please don't build in any requirement that they know particular papers or names — concepts only, no citations or bibliography anywhere in the answer or the scheme.
reasoning: |-
  We are creating an exam question about the problem of logical omniscience and the attempts to fix it. The goal is to force students to think critically about whether proposed solutions actually solve the problem or merely relocate it. The question should be concrete, require comparison of at least two repairs, and make students consider what a repair must deliver and what it gives up.

  The deliverables:
  1. The question text as it would appear on the exam paper.
  2. A model answer (about 700 words) in the voice of a strong student, argumentative, with a verdict.
  3. A marking scheme out of 25, with 4-6 specific moves, and distinguishing A from B by the moves only an A contains.
  4. Five common mistakes and how much each should cost.

  Let's design the question around a concrete case:

  **Concrete Case:** 
  Agent Alex believes that it is raining (p) and that if it is raining then the street is wet (p → q). Alex is competent, not distracted, and has no defeaters for these beliefs. However, Alex has not yet formed the belief that the street is wet (q). In a possible-worlds model, every world in which p and p→q are true is a world in which q is true, so Alex must believe q. This is the problem.

  We want the student to consider at least two repairs (e.g., impossible worlds, awareness, restricted closure, idealization) and argue about what each gives up and whether it truly solves the problem.

  **Question Text:**

  "Consider the following scenario: Alex believes that it is raining (p) and that if it is raining then the street is wet (p → q). Alex is a competent reasoner, not distracted, and has no defeaters for these beliefs. Yet, Alex has not formed the belief that the street is wet (q). 

  (a) Explain why this scenario poses a problem for the standard possible-worlds model of belief. [5 marks]

  (b) The problem of logical omniscience has prompted several proposed repairs. Choose two of the following approaches and, for each, explain how it would handle Alex's case and what it must give up in order to do so: 
     - Impossible worlds
     - Awareness (with an awareness operator)
     - Restricting closure to consequences the agent has actually deduced
     - Treating logical omniscience as a harmless idealization (like frictionless planes in physics) [10 marks]

  (c) Argue which of your chosen two approaches provides a more satisfactory solution to the problem. Your argument should address whether the repair actually solves the problem or merely moves it, and whether what it gives up undermines the original motivation for the possible-worlds model. [10 marks]"

  **Model Answer (approx 700 words):**

  (a) The standard possible-worlds model represents an agent's beliefs as a set of possible worlds — those compatible with what the agent believes. A proposition is believed if it is true in all these worlds. Since logical truths hold in every possible world, the agent believes all logical truths. Moreover, if the agent believes p and believes p→q, then in every world in the belief set, p and p→q are true, which implies q is true in every such world, so the agent believes q. But in the scenario, Alex believes p and p→q but not q, which contradicts the model. The model forces Alex to believe q, but in reality, Alex hasn't drawn that conclusion.

  (b) I will discuss two repairs: impossible worlds and restricting closure.

  **Impossible worlds:** This approach adds worlds where logic can break. In such a model, there can be worlds where p and p→q are true but q is false. Thus, Alex's belief set might include some impossible worlds where q is false, so Alex doesn't believe q. The cost is that we lose control over what the agent's beliefs entail. If we allow arbitrarily broken worlds, then we can ascribe almost any set of beliefs to an agent, even inconsistent ones. The model becomes too flexible, losing the normative force of logic. The possible-worlds model originally provided a clear account of rational coherence, but with impossible worlds, coherence can be arbitrarily violated.

  **Restricting closure:** This approach only requires closure under logical consequence if the agent has actually deduced it. So, Alex doesn't have to believe q until they have performed the inference. This handles the case by not requiring Alex to believe q. The cost is that the model no longer represents the agent's beliefs as a set of propositions closed under any fixed set of rules. Instead, we must track which deductions the agent has made. This gives up the elegance and generality of the possible-worlds model. The belief set becomes a snapshot of explicit beliefs at a time, without capturing the agent's commitment to the consequences they haven't yet drawn. The original model captured the idea that beliefs are not just a list but have inferential structure; this repair abandons that.

  (c) Between these two, I argue that restricting closure is the more satisfactory repair. 

  The impossible worlds approach seems to solve the problem by allowing the belief set to contain worlds where q is false. However, it does so at the cost of making the model too permissive. Without constraints on which impossible worlds are included, we can model Alex as believing any arbitrary set of propositions. This undermines the normative aspect of belief: we can no longer say that an agent is irrational for believing p and p→q but not q because we can always add an impossible world where p and p→q hold but q fails. The model loses its explanatory power for rationality.

  In contrast, restricting closure to actual deductions accepts that beliefs are not closed under logical consequence until the agent performs the inference. This reflects the computational limitations of real agents. While it gives up the ideal of closure, it maintains a connection to the agent's cognitive state. Importantly, it does not allow arbitrary belief ascriptions: the agent's beliefs are still constrained by what they have explicitly accepted or deduced. The model can still represent the commitment to consequences by including rules that when an inference is made, the belief set is updated. This preserves the idea that beliefs are dynamic and that rationality requires updating when deductions are made.

  The idealization defence (not chosen here) would say that closure is a harmless idealization, like frictionless planes. But friction is a physical factor that can be isolated, while computational limits are constitutive of cognitive agents. Two agents might have the same explicit beliefs but differ in their ability to draw inferences, so idealizing away computation erases a key difference.

  Therefore, restricting closure is more satisfactory because it provides a model that respects the actual state of the agent's mind and does not introduce the wild permissiveness of impossible worlds. It gives up the static closure but retains a dynamic account of rationality.

  **Marking Scheme (out of 25):**

  Part (a): Explanation of the problem (5 marks)
  - 1 mark: States that in possible worlds, belief set is set of worlds where beliefs are true.
  - 2 marks: Explains that p and p→q entail q in all worlds.
  - 1 mark: Notes that Alex doesn't believe q, contradicting the model.
  - 1 mark: Clearly states the problem: the model forces belief in q, but real agent doesn't.

  Part (b): Two repairs, each for 5 marks (total 10 marks) — for each repair:
  - 2 marks: Correctly explains how the repair handles Alex's case (i.e., allows not believing q).
  - 3 marks: Identifies what the repair gives up (as described above) and explains why it is a cost.

  Part (c): Argument for which is better (10 marks)
  - 2 marks: Clearly states which approach is chosen as more satisfactory.
  - 3 marks: Explains why the chosen approach solves the problem without merely moving it (e.g., for restricting closure: it directly addresses the computational process without introducing arbitrary worlds).
  - 3 marks: Explains why the other approach is less satisfactory (e.g., impossible worlds: it leads to permissiveness and loss of normative constraints).
  - 2 marks: Addresses the idealization point (even if not chosen, must note that computational limits are not like friction because they are constitutive of cognitive differences) OR more generally, explains what standard a repair must meet (i.e., must not just redescribe the problem but provide a model that captures rationality without over-idealization).

  Distinction between A and B:
  - A B-grade answer will list the repairs and their costs, and make a choice with some reasons.
  - An A-grade answer must do the above and also explicitly address the standard for a successful repair: that it must not just avoid logical omniscience but also preserve the ability to model rational constraints and avoid arbitrariness in belief ascription. Specifically, for an A, the answer must explain why the chosen repair meets this standard and the other does not (or does so less well). The A answer must also address the concern that the repair might just move the problem (e.g., by showing that the chosen repair doesn't relocate the problem in a way that makes the model vacuous).

  **Five Common Mistakes and Penalties:**

  1. Mistake: Treating the problem as solely about computational limits (time, memory) without addressing how the content of belief is individuated. 
     - Penalty: In part (a), lose 1 mark; in part (b) or (c), if central to the argument, lose up to 3 marks (depending on the part).

  2. Mistake: Confusing the problem of logical omniscience for knowledge and not belief (e.g., saying that the problem is that the agent doesn't know q, but the question is about belief). 
     - Penalty: In part (a), lose 2 marks for misstating the model. If repeated in (b) or (c), lose additional marks (up to 2 per part).

  3. Mistake: Assuming that giving up closure under known implication (e.g., for modus ponens) is the same as giving up necessitation (belief in all logical truths). 
     - Penalty: In part (a) or (b), if the student conflates these, lose 2 marks per instance.

  4. Mistake: Claiming that impossible worlds solve the problem without explaining how they avoid collapsing into taking the belief set as primitive (i.e., without constraints, we can add any impossible world). 
     - Penalty: In part (b), for impossible worlds, if they don't address the cost, lose the 3 marks for the cost explanation.

  5. Mistake: Arguing that one repair is better without comparing the two head-to-head on the same criteria (e.g., just listing pros of one and cons of the other without a common standard). 
     - Penalty: In part (c), lose up to 4 marks (for the argument structure and comparison requirement).

  Note: The model answer above is about 600 words. We can adjust slightly to reach 700 if needed, but it's within range.

  Let me know if you'd like adjustments.
answer: |-
  ### Exam Question Text  
  **Question 4 (25 marks total)**  
  Consider the following scenario:  
  Alex believes that the library is open today (\(p\)) and that if the library is open, then their friend Sam will be there (\(p \rightarrow q\)). Alex is a competent reasoner, has no doubts about these beliefs, and is not distracted or impaired. Despite this, Alex has not formed the belief that Sam will be at the library today (\(q\)).  

  (a) Using the **standard possible-worlds model of belief**, explain why this scenario is impossible. (5 marks)  

  (b) Two approaches to "fix" this problem (logical omniscience) are:  
     - **Approach 1**: Adding *impossible worlds* (where logical rules can fail) to the model.  
     - **Approach 2**: Treating logical omniscience as a *harmless idealization* (like frictionless planes in physics), where real agents approximate the ideal.  
     For **each** approach:  
     - Describe how it allows Alex’s belief state (believing \(p\) and \(p \rightarrow q\) but not \(q\)) to exist.  
     - Explain what the approach *gives up* from the original possible-worlds model. (10 marks)  

  (c) Argue which approach provides a **more satisfactory solution** to the problem. Your argument must:  
     - Address whether the approach *solves the core problem* (rather than just moving it).  
     - Discuss whether what it gives up *undermines the value* of the possible-worlds model (e.g., its ability to explain rational constraints on belief).  
     - Explain why the other approach is *less defensible*. (10 marks)  

  ---

  ### Model Answer (Strong Student Voice, ~700 words)  
  **(a)** In the standard possible-worlds model, an agent’s beliefs are represented by a set of possible worlds—those compatible with what they believe. A proposition is believed if it holds in all these worlds. Crucially, this model enforces *logical omniscience*: if an agent believes \(p\) and \(p \rightarrow q\), then in every world in their belief set, \(p\) and \(p \rightarrow q\) are true, which logically entails \(q\). Thus, \(q\) must be true in all these worlds, forcing the agent to believe \(q\). Alex’s state (believing \(p\) and \(p \rightarrow q\) but not \(q\)) violates this, making it impossible in the model. This highlights the problem: real agents like Alex lack perfect logical closure, but the model demands it.  

  **(b)**  
  **Approach 1: Impossible Worlds**  
  This approach adds worlds where logic fails—e.g., a world where \(p\) and \(p \rightarrow q\) are true but \(q\) is false. Alex’s belief set can now include such impossible worlds, allowing them to believe \(p\) and \(p \rightarrow q\) without believing \(q\). However, this *gives up* the idea that belief sets are constrained by logical consistency. If any impossible world can be added, we can ascribe *arbitrary* beliefs to Alex (e.g., worlds where \(p\) is true but \(\neg p\) is also true). This destroys the model’s power to define rationality: if beliefs need not cohere logically, we cannot criticize Alex as irrational for contradictions.  

  **Approach 2: Harmless Idealization**  
  This approach accepts logical omniscience as a deliberate simplification, arguing that models (like frictionless planes) idealize away computational limits. Alex’s state is "explained" as a deviation from the ideal due to resource constraints (e.g., time), but the model itself still assumes closure. This *gives up* any claim to describe *actual* belief states directly. Instead, it treats agents as "approximately" omniscient, ignoring how computational failures (like Alex not inferring \(q\)) are central to real cognition. The model no longer captures the *specific structure* of finite minds, instead dismissing gaps as noise.  

  **(c)** Approach 2 (idealization) is more defensible, but only if we abandon the goal of modeling *actual* beliefs—and that reveals why it fails. Approach 1 (impossible worlds) appears flexible but *solves nothing*; it merely relocates the problem. By allowing arbitrary worlds, it lets us "model" Alex’s state trivially, but at the cost of *any* normative force. If Alex believes \(p\) and \(p \rightarrow q\) but not \(q\), impossible worlds don’t explain why this is irrational—they normalize it. This collapses into taking belief sets as primitive lists, with no logic to constrain them. The original model’s virtue was linking belief to rationality via logical coherence; Approach 1 surrenders this entirely. Worse, it makes belief ascription vacuous: we could equally "model" Alex believing \(q\) and not \(q\), defeating the purpose of semantics.  

  Approach 2 at least preserves rationality constraints in the ideal, but it *does not solve the core problem*—it ignores it. The idealization defence claims computational limits are like friction: negligible for "core" theory. But friction is a physical disturbance; computational limits are *constitutive* of cognition. Two agents with identical "base" beliefs (like Alex and a faster thinker) differ *only* in what they infer; idealizing this away erases the distinction. If the model cannot capture why Alex’s state is a *failure* (unlike the frictionless plane, which still explains motion), it abandons the task.  

  Thus, neither truly works, but Approach 2 is less damaging if we reinterpret the model’s goal: it’s useful for *prescriptive* rationality (how agents *should* reason) but not *descriptive* (how they *do*). Approach 1, however, is irredeemable—it turns the model into a list of beliefs with no explanatory power. I’d keep Approach 2 for limited contexts (e.g., AI safety norms), but admit that for real agents, we need a non-worlds-based model entirely. The "repair" fails because logical omniscience is intrinsic to possible worlds; we must drop the framework to avoid the problem.  

  ---

  ### Marking Scheme (25 marks total)  
  **Part (a) (5 marks)**  
  - 1: Defines belief as a set of possible worlds.  
  - 2: Explains that \(p \land (p \rightarrow q)\) entails \(q\) in all worlds.  
  - 1: States Alex’s state violates this entailment.  
  - 1: Concludes why this is impossible in the model.  

  **Part (b) (10 marks: 5 per approach)**  
  For *each* approach (impossible worlds and idealization):  
  - 2: Correctly describes how it allows Alex’s state (e.g., impossible worlds break logic; idealization treats closure as approximate).  
  - 3: Explains what it gives up (e.g., impossible worlds abandon logical coherence; idealization abandons descriptive accuracy).  

  **Part (c) (10 marks)**  
  - 2: Takes a clear stance on which approach is more satisfactory.  
  - 3: Argues whether the approach *solves* vs. *relocates* the problem (e.g., impossible worlds allow arbitrariness; idealization ignores computational limits).  
  - 3: Evaluates if what it gives up *undermines the model* (e.g., impossible worlds lose rational constraints; idealization loses realism).  
  - 2: Compares approaches head-to-head using a shared standard (e.g., preserving rationality explanations).  

  **A vs. B Distinction (embedded in Part c):**  
  - A **B-grade (16–20/25)** lists repairs and costs, makes a choice, and gives basic reasons.  
  - An **A-grade (21–25/25)** *must* do the above **and**:  
    - Explain what a repair must deliver to "solve" the problem (e.g., it must avoid omniscience *without* making belief ascription arbitrary or losing rationality constraints).  
    - Explicitly argue that one approach "moves" the problem (e.g., impossible worlds relocate it to world-selection, which has no standards).  
    - Contrast why computational limits are not idealizable like friction (e.g., they define cognitive differences).  

  ---

  ### Five Common Mistakes and Penalties  
  1. **Mistake**: Treating logical omniscience as solely about *time/memory limitations* (e.g., "Alex didn’t have time to compute q").  
     - **Penalty**: –2 in (a) or (c); misses that the problem is about *content individuation* (how beliefs are represented).  
  2. **Mistake**: Confusing *belief* with *knowledge* (e.g., "Alex doesn’t *know* q, so the model is wrong for knowledge").  
     - **Penalty**: –3 in (a); undermines the entire setup (problem applies to belief).  
  3. **Mistake**: Claiming *impossible worlds* solve the problem without addressing *how worlds are constrained* (e.g., not explaining that arbitrary worlds make belief ascription vacuous).  
     - **Penalty**: –3 in (b) for Approach 1; omits the key cost.  
  4. **Mistake**: Equating *giving up closure under implication* (e.g., modus ponens) with *giving up necessitation* (believing all logical truths), treating them as identical concessions.  
     - **Penalty**: –2 in (b); these are distinct (one is about entailment, the other about axioms).  
  5. **Mistake**: Defending *idealization* without addressing why *computational limits* differ from physical ones (e.g., "like friction" with no critique).  
     - **Penalty**: –3 in (c); fails the A-grade requirement for deeper analysis.  

  ---  
  This question avoids citations and uses only concepts from the course. The model answer and scheme emphasize *argument* over recitation, forcing students to engage with the fragility of "fixes." Good luck with your exam!
