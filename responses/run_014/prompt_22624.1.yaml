answer: |-
  That's an excellent question that cuts to the heart of the Pasadena paradox. **Your initial understanding is close but slightly off the mark. The defining feature of the Pasadena gamble isn't negative infinite expected value; it's that the expected value is fundamentally undefined due to conditional convergence.**

  Here's a breakdown for your novel:

  1.  **The Mechanics (Recap):**
      *   A fair coin is flipped until it lands heads.
      *   If the first head appears on toss `n`, the payoff is `(-1)^{n-1} * ($2^n) / n`.
      *   Probability of first head on toss `n` is `(1/2)^n`.
      *   Expected Value (EV) = Σ [ (Probability_n) * (Payoff_n) ] = Σ [ (1/2)^n * (-1)^{n-1} * (2^n / n) ] = Σ [ (-1)^{n-1} * (1 / n) ]

  2.  **The Series:** Σ [ (-1)^{n-1} * (1 / n) ]
      *   This is the alternating harmonic series: `1 - 1/2 + 1/3 - 1/4 + 1/5 - 1/6 + ...`
      *   **Conditional Convergence:** This series *converges* (to `ln(2) ≈ $0.693`). However, it does *not* converge *absolutely* because the harmonic series Σ (1/n) diverges (goes to positive infinity).

  3.  **The Paradox & Indeterminacy:**
      *   **Riemann Rearrangement Theorem:** This is the critical point. A conditionally convergent series can be rearranged to sum to *any real number whatsoever*, or even to diverge to positive or negative infinity.
      *   **Application to EV:** The "expected value" calculation depends on the order in which we consider the possible outcomes (n=1, n=2, n=3,...). This order is arbitrary! We could rearrange the terms (grouping positive payoffs first, negative payoffs first, or in any other pattern) and get drastically different sums:
          *   Standard order: ~$0.693 (Positive)
          *   Group positives: 1 + 1/3 + 1/5 + ... = ∞
          *   Group negatives: -1/2 - 1/4 - 1/6 - ... = -∞
          *   Clever grouping: Sum to $100, or -$50, or π.
      *   **Undefined EV:** Because the sum depends entirely on the arbitrary ordering of terms, the expected value **does not have a single, well-defined value**. It is **indeterminate**. It is not -∞, +∞, or any specific finite number *inherently*. The calculation simply doesn't yield a unique answer.

  4.  **Implications for Rationality:**
      *   **The Core Paradox:** Standard decision theory (maximize expected utility) **fails completely** when the expected value is undefined. There *is no* expected value to maximize.
      *   **Not Plainly Irrational:** It is **not** "plainly irrational" to accept the gamble *because* there is no definitive negative (or positive) EV telling you to reject (or accept) it.
      *   **The Dilemma:** Rational agents using different, seemingly reasonable methods to evaluate the gamble can reach opposite conclusions:
          *   If you naively sum the series in the standard order, it looks like a good deal (+$0.69).
          *   If you group terms to emphasize the large negative payoffs (even though they have low probability), it looks disastrous (-∞).
          *   Other valuation methods (like weak dominance or considering only finite truncations) might suggest indifference or cautious rejection.
      *   **The Irrationality Angle:** The irrationality often discussed stems from the *failure of decision theory itself* to handle such cases, not from a clear-cut negative EV. Accepting it demonstrates that traditional rationality breaks down here. It highlights that "maximize EV" is insufficient when EV is undefined. A character *might* rationally reject it *because* its value is indeterminate and potentially catastrophic under certain evaluations, not because it's definitively negative infinity.

  **Why Your Initial Idea is Understandable (but Incorrect):**

  *   The prospect of infinitely large negative payoffs (even with vanishingly small probability) is psychologically salient and feels like it *should* dominate, dragging the EV down to -∞. Intuition screams "Don't take it!"
  *   Some resolutions or analyses *do* lead to a negative infinite evaluation. However, other equally valid analyses lead to positive infinite or finite positive evaluations. The point is that *no single evaluation is the "correct" one*.

  **Key Takeaways for Your Novel:**

  1.  **The Paradox Hinges on Indeterminacy:** Emphasize that the gamble's value is **fundamentally undefined**, not infinitely negative. This is the source of the paradox and the breakdown of standard rationality.
  2.  **Character Conflict:** This indeterminacy creates rich ground for character development and conflict:
      *   Why might your character accept it? (Optimism? Intuition based on the naive sum? Desperation? A belief they can "beat" the indeterminacy? Aesthetic appeal of the gamble? Ignorance of the paradox?)
      *   Why might they reject it? (Pessimism? Focus on potential catastrophic losses? Understanding of the paradox? Cautious principle against undefined values? Advice from someone who sees the negative grouping?)
      *   How do others react? Do they see the character as reckless, wise, foolish, or brave? Their perception depends on *their* internal evaluation method.
  3.  **Beyond Simple Rationality:** The gamble forces characters (and readers) to confront the limits of mathematical expectation as a guide for action. It becomes a question of philosophy, psychology, and risk tolerance in the face of profound uncertainty.

  **In short: The Pasadena paradox rests entirely on the gamble having an undefined expected value due to conditional convergence. While it *can* be evaluated as having negative infinite EV under one method, it can equally be evaluated as having positive infinite or finite positive EV under others. The core irrationality isn't in taking a clearly bad bet; it's in the gamble exposing the inadequacy of our standard tool (expected value) for evaluating it.** This ambiguity is far more interesting for fiction than a simple, clear-cut negative infinite EV would be.
