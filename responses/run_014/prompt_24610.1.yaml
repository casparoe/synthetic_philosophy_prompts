prompt: |-
  hey, I'm putting together questions for a panel I'm moderating next month, and one of the panelists is a scholar who's written a book arguing that Bentham's position on sexual morality is a lot more subtle than the usual "proto-liberal, anything goes so long as no one's harmed" caricature. Her core claim is that Benthams real framework is the offense/injury one from the *Principles of Morals and Legislation*, and that sexual acts only fall under the law when they cause injury to someone other than the agent, not merely because they're vicious or disgusting to onlookers. I want eight to ten questions that push on the actual machinery of that framework rather than have her just restate it. Specifically, I'd like at least one question each on: (1) the vicious-versus-offense distinction, and why a purely private sexual act that's morally vicious but harms no one should, on her reading, be outside the state's business; (2) the self-regarding/other-injuring line and where exactly it cuts for acts like adultery, or for acts that impair a spouse's "security" as one of the four interests in Bentham's taxonomy of offenses; (3) the problem that Bentham's "injury" is elastic enough that one could read him as licensing an offense principle — prohibiting acts just because they disgust the community — and how she keeps that from swallowing the whole framework; and (4) how this differs from Mill's later harm principle, since she keeps getting asked "so Bentham was just an early Mill?" For each of those four, give me a follow up keyed to the answer she's most likely to give.
