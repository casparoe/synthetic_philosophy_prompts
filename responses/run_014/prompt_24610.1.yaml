  For the first requested question category (vicious vs offense distinction), I recall Bentham's explicit statement that purely private acts causing no harm to others shouldn't be punished. But the tricky part is defining "purely private" - does this include acts discovered accidentally? The follow-up should press on discovery scenarios to test the privacy boundary.

  On the second point (self-regarding/other-injuring line), adultery is the perfect test case because it involves third-party emotional harm. Bentham's "security" interest under "offenses against condition" creates tension - is emotional distress "injury"? The follow-up should challenge whether the spouse's claim is proprietary or psychological.

  For the third category (elasticity of "injury"), I'm considering Bentham's "alarm" and "danger" concepts which could expand state power. The scholar likely counters with Bentham's distinction between actual pain and mere disgust. The follow-up should attack this by invoking social cohesion arguments Bentham acknowledges.

  Finally regarding Mill comparisons, the key difference lies in Bentham's utilitarian calculus versus Mill's rights-based harm principle. The follow-up should force the scholar to defend Bentham against the "tyranny of majority" critique that motivated Mill.

