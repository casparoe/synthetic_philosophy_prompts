  ### Scoring Key  
  Map your answers to the positions below. Positions are defined by *which kinds of luck* affect *which objects of assessment*:  
  - **Kinds of luck:** Resultant (outcomes), Circumstantial (situations), Constitutive (traits), Causal (determinism).  
  - **Objects of assessment:** Wrongness (W), Blameworthiness (B), Appropriate Guilt (G), Proportional Sanctions (S).  

  **Leaves (Standard Positions):**  
  1. **Strict Control Principle (SCP):** Rejects all moral luck.  
     - Answers: 1b, 2b, 3a, 4a, 5a, 6a, 7b, 8a.  
     - *Holds:* Luck never affects W, B, G, or S.  

  2. **Common Intermediate (CI):** Accepts circumstantial/constitutive luck for B/G/S; denies resultant luck.  
     - Answers: 1b, 2a, 3b, 4a or 4b, 5b, 6a, 7b, 8b.  
     - *Holds:* Resultant luck never affects B/G/S; circumstantial/constitutive luck often do.  

  3. **Mirror Image (MI):** Accepts resultant luck; denies circumstantial/constitutive luck.  
     - Answers: 1a or 1c, 2b, 3a, 4c, 5c, 6a, 7a, 8a.  
     - *Holds:* Outcomes affect B/G/S; character/circumstances do not.  

  4. **Full-Blooded Acceptance (FB):** Accepts all moral luck for all objects.  
     - Answers: 1a, 2a, 3b or 3c, 4c, 5c, 6b or 6c, 7a, 8c.  
     - *Holds:* Luck affects W, B, G, and S across all kinds.  

  5. **Two-Level Views (TLV):** Mixed answers (e.g., luck affects B/G but not W/S).  
     - *Profile:* Inconsistent patterns (e.g., 1b [deny resultant for B] + 4b [accept resultant for S] + 3b [accept constitutive for B]).  
     - *Holds:* Luck affects some objects but not others (e.g., B but not W).  

  6. **Revisionist/Deflationary (RD):** Moral luck reveals incoherence; blame practices should be limited.  
     - Answers: 1b, 2b, 3c, 4a or 4b, 5c, 6b, 7c, 8c.  
     - *Holds:* Pervasive luck undermines standard assessments; favor minimal responsibility.  

  **Indistinguishable Pair:**  
  - **Hard-line Control vs. Prior-Stage Self-Creation:** Both reject constitutive luck by treating character as "chosen."  
    - *Shared answers:* 3a, 8a.  
    - *Distinguisher (missing):* A case where formative choices (e.g., childhood) are clearly influenced by luck. The quiz cannot separate these views.  

  **Unoccupied Cells:**  
  - **Denies resultant luck for W but accepts it for S:**  
    - *Diagnosis:* Coherent but unattractive; hard to justify punishing harm if the act isn’t wrong.  
  - **Accepts constitutive luck for G but denies it for B:**  
    - *Diagnosis:* Unexplored; why guilt but not blame would track innate traits is unclear.  
  - **Accepts circumstantial luck for W but denies it for B:**  
    - *Diagnosis:* Incoherent; if an act is wrong only due to circumstances, the agent’s blame should reflect that.  

