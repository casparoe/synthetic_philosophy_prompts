  3. A constitutive case (temperament from genes/upbringing).
  4. Attempted vs. completed murder: compare the law and blameworthiness.
  5. A near-miss asymmetry case: does the driver whose negligence came to nothing have more reason to feel lucky than relieved of guilt?
