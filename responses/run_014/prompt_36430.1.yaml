answer: |-
  ### Moral Luck Diagnostic Quiz  
  **Instructions:** For each scenario, select the option that best reflects your judgment. Answer based on your intuitive moral response, not philosophical labels. There are no right or wrong answers.  

  ---

  #### Questions  
  1. **The Two Drivers**  
     Driver A and Driver B both drive home drunk, swerving identically due to carelessness. Driver A hits and kills a child; Driver B hits nothing. Years later, Driver B boasts, "My clean record proves I’m a better person than Driver A." Your view?  
     - (a) Driver B is correct: No harm occurred, so he is morally better.  
     - (b) Driver B is wrong: Both were equally irresponsible; only luck separates them.  
     - (c) Driver B is not morally better, but his clean record makes him a better *driver*.  

  2. **Vicious Dispositions**  
     In 1930, two Germans with identical cruel temperaments work at a factory. By chance, Karl is transferred to Switzerland before the Holocaust, living peacefully. Hans stays, becomes a camp guard, and tortures prisoners. Is Hans morally worse than Karl?  
     - (a) Yes: Hans committed atrocities; Karl did not.  
     - (b) No: Both had the same vicious character; circumstances alone differed.  
     - (c) Hans is worse only for his actions, but their underlying character is equally bad.  

  3. **Temperamental Roots**  
     Jamie is naturally quick-tempered due to genetics and an abusive upbringing. In a fit of rage, Jamie shoves a stranger, causing injury. How responsible is Jamie for the harm?  
     - (a) Fully responsible: Everyone can control their actions regardless of temperament.  
     - (b) Partly responsible: Jamie’s background makes self-control harder, reducing blame.  
     - (c) Not responsible: Jamie’s temperament was shaped by luck, leaving no true choice.  

  4. **Attempted vs. Completed Murder**  
     Taylor and Morgan separately try to kill rivals by identically sabotaging brake lines. Taylor’s victim dies; Morgan’s victim survives by fluke. Legally, how should their sentences compare? Morally, how does their *blameworthiness* compare?  
     - (a) Same sentence; same blameworthiness (outcomes are irrelevant).  
     - (b) Harsher sentence for Taylor; same blameworthiness (law should reflect harm, but moral fault is equal).  
     - (c) Harsher sentence for Taylor; Taylor is more blameworthy (harm increases moral fault).  

  5. **Near-Miss Asymmetry**  
     Riley drives recklessly but swerves last-second to avoid a pedestrian. Riley feels intense relief. Should Riley also feel guilty?  
     - (a) Yes, just as guilty as if harm occurred (the reckless choice was the same).  
     - (b) Some guilt, but less than if harm occurred (luck mitigates appropriate guilt).  
     - (c) No guilt; only relief (no harm means nothing to feel guilty about).  

  6. **Temporal Distance**  
     Casey, age 20, negligently causes a fire that injures a victim. The victim dies of complications at age 80. In a parallel case, Drew, 20, identically causes a fire that kills a victim immediately. At sentencing (when both are 60), how should punishment compare?  
     - (a) Same punishment: The harm and negligence were identical.  
     - (b) Lesser punishment for Casey: Their 40-year blameless life reduces desert.  
     - (c) Harsher punishment for Casey: Living with guilt for decades compounds suffering.  

  7. **Causal Chain Luck**  
     Jay and Kim separately plan to steal a rare artifact. Jay’s theft causes a guard’s fatal heart attack (unforeseen). Kim’s theft goes smoothly. Is Jay more blameworthy than Kim?  
     - (a) Yes: Jay caused death; outcomes matter.  
     - (b) No: Both intended the same theft; the heart attack was pure luck.  
     - (c) Neither is blameworthy: The death was unpredictable, negating responsibility.  

  8. **Prior Choices**  
     As a teen, Morgan recklessly embraced violent influences, hardening their disposition. As an adult, Morgan assaults someone during an argument. How responsible is adult Morgan?  
     - (a) Fully responsible: Adult choices override formative influences.  
     - (b) Partly responsible: Teen choices shaped adult character, but not irrevocably.  
     - (c) Not responsible: Teen choices were themselves products of luck.  

