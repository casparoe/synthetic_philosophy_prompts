  **Scoring Key:**

  The scoring key maps your answers to positions in the logical space. We will consider the kind of luck and the object of assessment for each question. The positions are:

  - **Strict Control Principle (SCP):** Rejects moral luck in all forms. For all kinds of luck and all objects of assessment, luck does not affect moral judgment.
  - **Common Intermediate (CI):** Accepts circumstantial and constitutive luck affecting blameworthiness and guilt, but denies resultant luck (i.e., outcomes don't affect blameworthiness or wrongness).
  - **Mirror Image (MI):** Accepts resultant luck but denies circumstantial and constitutive luck (this is less common and may be unstable).
