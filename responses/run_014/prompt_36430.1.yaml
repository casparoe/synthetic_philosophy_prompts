  ### Notes  
  - **Your position** is the leaf matching most answers. Mixed patterns default to TLV.  
  - **Pedagogical aim:** Moral luck debates turn on concrete judgments, not labels. If your answers conflict (e.g., deny resultant luck in Q1 but accept it in Q7), this reveals unresolved tensions.  
  - **Indistinguishability:** The quiz cannot separate views where character is deemed "controlled" (whether by current will or prior choices).  
  - **Unoccupied cells:** Gaps in the logical space reflect unstable or underexplored views, not flaws in the instrument.
