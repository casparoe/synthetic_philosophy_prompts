  **Quiz: Which view of moral luck do you actually hold?**

  **Instructions:** For each scenario, choose the answer that best reflects your judgment. There are no right or wrong answers. Answer based on your immediate moral intuition.

  1. **Two Drivers:** Driver A and Driver B both drive home drunk from a party. Both are equally careless. Driver A hits and kills a child who runs into the street. Driver B, by sheer luck, has no child run into his path and arrives home safely. Years later, Driver B says, "My spotless driving record shows I am a better person than Driver A." What is your reaction to Driver B's claim?
     - (a) Driver B is correct: his record shows he is a better driver and a more responsible person.
     - (b) Driver B is wrong: he was just as careless and only luck prevented him from killing a child. His record does not reflect moral superiority.
     - (c) Driver B is wrong to claim moral superiority, but his clean record does reflect that he is a better driver in terms of outcomes.

  2. **Vicious Dispositions:** In 1929, two young men in Germany, Hans and Fritz, are both raised in the same hateful ideology and have equally vicious anti-Semitic attitudes. By chance, Hans's family moves to Switzerland in 1930, where he lives an ordinary life. Fritz remains in Germany and becomes a concentration camp guard, actively participating in atrocities. Is Fritz morally worse than Hans?
     - (a) Yes, Fritz committed atrocities while Hans did not, so Fritz is worse.
     - (b) No, they were equally vicious in character; it's just that Fritz was in circumstances that allowed his vices to manifest.
     - (c) Fritz is worse, but only because he acted on his vices; however, if we consider their underlying character, they are equally bad.

  3. **Temperamental Differences:** Alex and Sam are identical twins separated at birth. Alex is raised in a loving, supportive home and develops a kind and generous personality. Sam is raised in an abusive, neglectful home and becomes cruel and selfish. How responsible is Sam for his cruel behavior?
     - (a) Sam is fully responsible; despite his upbringing, he could have chosen to be kind.
     - (b) Sam is less responsible than Alex would be if Alex were cruel, because Sam's environment made it much harder to develop good character.
     - (c) Sam is not responsible at all; his character was entirely shaped by factors beyond his control.

  4. **Attempted Murder:** Alice tries to kill her business partner by putting poison in his coffee. By chance, the partner spills the coffee before drinking it and survives. Betty succeeds in poisoning her business partner, who dies. Assume both had the same intention and took the same actions (putting the same amount of poison). How should the criminal law treat Alice and Betty?
     - (a) Alice and Betty should receive the same sentence because they both attempted murder and are equally blameworthy.
     - (b) Betty should receive a harsher sentence because she caused a death, even though both are equally morally blameworthy.
     - (c) Betty should receive a harsher sentence because she is more morally blameworthy for having caused a death.

  5. **Near-Miss Driver:** Consider Driver B from the first scenario (the drunk driver who had no accident). After learning about Driver A's accident, Driver B feels intense relief but also guilt. How should Driver B feel?
     - (a) Driver B should feel guilty to the same extent as Driver A, because his actions were just as wrong and dangerous.
     - (b) Driver B should feel guilty but less so than Driver A, because no harm occurred. He should mainly feel lucky.
     - (c) Driver B should not feel guilty at all, because he didn't harm anyone. He should only feel lucky and relieved.

  6. **Temporal Distance:** Charlie, age 20, drives negligently and hits a pedestrian, causing injuries that put the pedestrian in a coma. The pedestrian dies 40 years later. In a parallel scenario, Dave, also 20, drives negligently and hits a pedestrian who dies immediately. Assume all else is equal. How should we assess Charlie and Dave at the time of sentencing (when they are 60 and 20, respectively)?
     - (a) Charlie and Dave should be sentenced equally because the harm and their negligence were the same.
     - (b) Dave should be sentenced more harshly because the harm was immediate. Charlie has lived a blameless life for 40 years, which should mitigate his sentence.
     - (c) Charlie should be sentenced more harshly because he had to live with the knowledge of what he did for 40 years, and that is additional punishment.

  7. **Causal Chain:** Emma and Fiona are both in a lab. Each is told to press a button that will deliver a mild shock to a subject in another room. Unbeknownst to them, the lab equipment is faulty: in Emma's case, the button press will actually deliver a lethal shock due to a freak wiring error; in Fiona's case, the button works as described. Both press the button. How blameworthy is Emma compared to Fiona?
     - (a) Emma is more blameworthy because she caused a death.
     - (b) Emma and Fiona are equally blameworthy because they both intended to cause harm (even if mild) and performed the same action.
     - (c) Neither is blameworthy because they were unaware of the risk of death.

  8. **Prior Choice:** As a teenager, Greg made a series of bad choices that led to him developing a quick temper and aggressive tendencies. Now, as an adult, Greg gets into a bar fight and severely injures someone. How responsible is Greg for his violent behavior?
     - (a) Greg is fully responsible; even though he developed his temper as a teen, he could have worked to change it as an adult.
     - (b) Greg is responsible, but less so than someone who developed a similar temper as an adult without prior bad choices, because his younger self set him on a path.
     - (c) Greg is not responsible at all; his adult character was fixed by his teenage choices, which were themselves influenced by factors beyond his control at the time.

