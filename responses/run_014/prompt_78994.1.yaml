prompt: |-
  I teach an upper-level epistemology seminar — 14 students, mostly seniors plus a couple of first-year MA students — and I've got a 90-minute session to spend on the dogmatism paradox. I've tried just putting the argument on the board and it dies every time: they nod, and then someone says something deflationary like "well that just shows you shouldn't be so sure of yourself," which is exactly the move I want to make unavailable to them. So instead of a lecture I want a runnable activity — a game, a role-play, a structured deliberation, whatever fits best — where they enact the thing before anyone says its name. What I'm after: they should arrive, through their own choices, at the position that once you take yourself to know something, you're entitled to treat every later piece of contrary evidence as noise; and they should have felt in their hands both why that entitlement is so seductive and why it's a machine for entrenching people who are simply wrong. Ideally they reconstruct the steps themselves (knowledge entails truth, so anything speaking against a known truth must be misleading, so if you know it's misleading you may ignore it, and you know all of this a priori) — I'd much rather they build the argument out of what just happened to them than hear it from me. You're a philosopher who's spent a lot of time turning abstract epistemology into things people can do with their hands, so take a moment to brainstorm three or four mechanically different activities before committing to one, then develop the strongest.

  The structural feature I care about most is this: the license to ignore contrary evidence gets issued *before* anyone can tell whether they're in the good case (they really do know) or the bad case (they're confident and mistaken). If the design lets people look back afterwards and say "ah, but I was justified, I really did know," it hasn't landed — I want them to discover that the rule protecting the knower is the same rule arming the fool, and that from the inside they can't tell which one they are. Seed the activity with whatever the group has to be doing: a bet, a verdict, a diagnosis, a sealed envelope, a witness who recants, an expert who contradicts them, a slip of paper telling them what they're allowed to shred. Keep materials cheap and printable, no real money, and make it survive a couple of absences or one group finishing early. Nobody should hear the phrase "dogmatism paradox" (or "higher-order evidence," or "defeater") until the debrief — the mechanism is supposed to do the teaching. And no reading list please, I know the literature.

  Give me the rules, the materials, a minute-by-minute timeline, and the debrief. The debrief should map specific moments in the activity onto the four steps, and onto the two standard ways people resist the conclusion — denying that you always know that you know, and insisting that being rational about revising your beliefs is a seperate thing from merely having knowledge. Be honest about what an activity like this just can't reproduce: I suspect some of the bite is about the a priori status of the premises and about whether the whole thing is really about knowledge at all rather than about what you may rationally believe, and I dont think any game gets at that. Then tell me what will predictably go wrong the first time I run it — where they'll get hung up, where the rules will be read in a way I didn't intend, what I should have written on the board before we started. I'm comfortable improvising but not with dead air, so flag the two or three moments where I'll need a line ready.
reasoning: |-
  We are going to design an activity that embodies the dogmatism paradox without naming it. The key is to have students experience the tension between the entitlement to ignore contrary evidence (because they take themselves to know) and the realization that this same mechanism can entrench false beliefs. We want them to see that the rule protecting the knower is the same rule arming the fool, and that from the inside they can't tell which one they are.

  After brainstorming, I propose a structured activity called "The Sealed Envelope Game". The core idea is that students will be given a scenario where they must make a judgment (e.g., about the contents of an envelope) and then they are presented with evidence that contradicts their judgment. Because they take themselves to know, they will be tempted to dismiss the evidence. The twist is that some of them are in the good case (they are right) and some in the bad case (they are wrong), but they don't know which.

  Brainstorming alternatives briefly:
  1. **The Betting Game**: Students are given a proposition they believe they know (e.g., "The coin is fair") and then are offered bets with new evidence. But it might be hard to simulate the a priori entitlement.
  2. **Role-play as Experts**: Some students play experts who have to defend their diagnosis against new contradictory evidence. But this might lead to debate rather than the internal tension.
  3. **The Witness Recantation**: A mock trial where a witness changes their testimony. But the group dynamic might overshadow individual reasoning.

  I choose the Sealed Envelope Game because it can be run with minimal materials, it's individual enough to make the point personal, and we can control the assignment of good/bad cases.

  **The Sealed Envelope Game**

  **Materials** (per student):
  - 1 sealed envelope (prepared in advance). Half the envelopes contain a red card, half contain a blue card. The outside of the envelope has a unique ID (e.g., a number) and the words "The card inside is [RED/BLUE]" — but note: the statement on the envelope may be true or false. We'll have two types:
    - Type A: The statement is true (so if it says red, the card is red).
    - Type B: The statement is false (so if it says red, the card is blue).
  - A small slip of paper (to be drawn from a hat) that tells the student whether they are in the "good" or "bad" case. But wait, we don't want to tell them explicitly. Instead, we assign the envelopes randomly: half are Type A (good case) and half Type B (bad case). The assignment is hidden.
  - A set of "evidence cards" (one per student) that they will receive after they have formed their belief. The evidence card will say something like: "WARNING: The statement on your envelope might be false. In fact, an independent investigation has found that for envelopes with ID numbers ending in [X], the statement is incorrect 80% of the time." But note: we want the evidence to be contrary and potentially misleading. We will tailor the evidence to each student's situation.

  However, to make it run smoothly, we can do:

  **Revised Materials**:
  - 14 envelopes: 7 with a true statement (good case), 7 with a false statement (bad case). The statement on the envelope is about the color of the card inside (e.g., "The card inside is RED"). The card inside is either red or blue. For the true-statement envelopes, the card matches the statement. For the false-statement envelopes, the card is the opposite.
  - 14 evidence slips (one per student). Each evidence slip is tailored to the envelope ID. It says: "Attention: A recent audit has found that for envelopes with ID numbers in the range [X-Y], there is an 80% error rate in the statements on the envelopes." But note: we want the evidence to be about their specific envelope. Alternatively, we can make the evidence generic but applicable to all. However, to make it personal, we can say that the audit found that a certain subset (which includes their envelope) has a high error rate. We can assign each envelope to a group (by ID) and then the evidence slip says that for their group, the error rate is 80%.

  But wait: we want the evidence to be contrary to their current belief. In the good case, the evidence is misleading (because their envelope is actually correct). In the bad case, the evidence is correct (because their envelope is indeed wrong). But note: the evidence is probabilistic and about a group. So for a student in the good case, the evidence is misleading (it suggests their envelope is likely wrong, but it's not). For a student in the bad case, the evidence is correct (their envelope is indeed in the high-error group and is wrong).

  However, we need to design the evidence so that it is a piece of contrary evidence that they might dismiss because they "know" the content.

  **Simpler**: We can have the evidence be a direct contradiction. But that might be too strong. Alternatively, we can have the evidence be a testimony from a reliable source that says the opposite.

  I propose:

  Each student gets:
  1. An envelope with an ID number and a statement: "The card inside is [COLOR]".
  2. They are told: "You have been given an envelope. The statement on the envelope was made by a source that is 90% reliable. That is, 9 times out of 10, the statement on the envelope is true." (This sets up their initial knowledge claim.)

  Then, after they have formed the belief (and we have them record it), we give them:

  3. An evidence slip that says: "NEW EVIDENCE: A second source, also 90% reliable, has examined the card in envelope [ID] and reports that the card is [OPPOSITE COLOR]."

  But note: we have to assign the opposite color appropriately. For the good case envelopes, the second source is wrong (so the evidence is misleading). For the bad case envelopes, the second source is right (so the evidence is correct). But we want the evidence to be the same in form for both.

  Alternatively, we can have the evidence be about the reliability of the first source. For example: "NEW EVIDENCE: It has been discovered that the machine that printed the statements on the envelopes was malfunctioning for a batch that includes your envelope. When the machine malfunctions, it prints false statements 80% of the time. Your envelope is in the batch that was printed by the malfunctioning machine."

  But then for the good case, this evidence is misleading (because their envelope was not affected by the malfunction, or it was but it was one of the 20% that is still correct). We can control that.

  However, to keep it simple and avoid having to assign batches, let's go with the first idea of a second source.

  But then we have to fabricate the second source's report for each envelope. That's manageable with 14 students.

  **Final Materials**:
  - 14 envelopes, each with:
     - A unique ID (e.g., 1 to 14)
     - A statement: "The card inside is [RED/BLUE]"
     - Inside, a card that is either red or blue. For envelopes 1-7: the statement is true (good case). For envelopes 8-14: the statement is false (bad case). So for 1-7, the card matches the statement. For 8-14, the card is the opposite.
  - 14 evidence slips. For each envelope, we have an evidence slip that says: "SECOND REPORT: Source B (which is 90% reliable) has examined the card in envelope [ID] and reports: 'The card is [OPPOSITE COLOR]'." 
     - For the good case (envelopes 1-7): the second report is wrong (so we put the opposite of the true color). 
     - For the bad case (envelopes 8-14): the second report is correct (so we put the actual color of the card, which is the opposite of the statement on the envelope).

  But note: in the bad case, the statement on the envelope is false, so the card is the opposite of what the envelope says. The second report for the bad case should say the actual color (which is the opposite of the envelope statement). For the good case, the second report should say the opposite of the actual color (to be misleading).

  Example:
  - Good case envelope: Statement says "Red", card is red. Evidence slip: Source B says "Blue".
  - Bad case envelope: Statement says "Red", card is blue. Evidence slip: Source B says "Blue" (which is correct).

  So in both cases, the evidence slip says the opposite of what the envelope states? Not exactly. In the good case, the envelope says red (true) and the evidence says blue (false). In the bad case, the envelope says red (false, because the card is blue) and the evidence says blue (true). So the evidence is always contrary to the envelope statement? Yes, because the envelope statement in the bad case is false and the evidence is true and contradicts the envelope statement.

  From the student's perspective: they are told the envelope statement is 90% reliable. They form the belief that the card is as stated. Then they get evidence that a second 90% reliable source says the opposite. They are then asked whether they still believe the envelope statement and whether they would ignore the new evidence.

  **Rules of the Activity**:

  1. **Setup (15 minutes)**:
     - Distribute one envelope to each student. Do not let them open it yet.
     - Explain: "You are each given an envelope. The statement on the outside was made by Source A, which we know is 90% reliable. That is, 9 times out of 10, the statement is true. You are to form a belief about the color of the card inside based on this. Record your belief on your worksheet (provided)."
     - Worksheet has:
          - Envelope ID: ______
          - Statement on envelope: "The card inside is [COLOR]"
          - My initial belief: The card is ______ (color)
          - How confident am I? (0-100%): ______
     - They record their initial belief and confidence. They should be very confident (90%) that the statement is true.

  2. **Introduce the Task (5 minutes)**:
     - Explain: "Now, imagine you are in a situation where you must decide whether to open the envelope or not. If you open it, you will know the truth. But there's a cost: opening it will cost you 10 points. If you leave it sealed and later we reveal the truth, if your belief is correct you get 20 points, but if it's wrong you get 0. However, before you decide, you will receive a piece of new evidence."

  3. **Present New Evidence (5 minutes)**:
     - Distribute the evidence slips to each student. The evidence slip says that Source B (90% reliable) says the opposite of the envelope statement.
     - Explain: "Source B is independent and also 90% reliable. They have examined the card in your envelope and report [OPPOSITE COLOR]."

  4. **Decision Time (15 minutes)**:
     - Students are given a worksheet to record:
          - After seeing the new evidence, do you still believe the envelope statement? (Yes/No)
          - How confident are you now? (0-100%)
          - Will you ignore the new evidence? (Yes/No) [But note: we don't want to lead them. Instead, ask:]
          - What do you think the card color is now? (after the new evidence)
          - Will you open the envelope? (Yes/No) — because if they open it, they pay 10 points but learn the truth. If they don't open, they get points based on whether their final belief is correct.
     - But note: we want to see if they ignore the evidence. So we can ask:
          - How much weight do you give to the new evidence? (0: ignore it, 100: fully believe it)
          - And then ask for their final belief.

     Alternatively, to make it about ignoring, we can say: "You have the option to ignore the new evidence. If you ignore it, then you just stick with your initial belief. If you don't ignore it, then you must update your belief in light of both sources."

     But we don't want to force updating. We want to see if they feel entitled to ignore.

     I suggest: Ask them to choose one of three actions:
          A. Stick with my initial belief and ignore the new evidence.
          B. Update my belief to the new evidence (so believe Source B).
          C. Suspend judgment (and then they must open the envelope to know?).

     But then we have to assign points. The points are just to motivate them to care about being correct.

     Point system:
          - If they do not open the envelope and their final belief is correct: +20.
          - If they do not open and are wrong: 0.
          - If they open: they pay 10 points, but then they get 10 points if they were correct (so net 0) and 0 if they were wrong (so net -10). But that might be too punitive.

     Alternatively:
          - Do not open and correct: +20
          - Do not open and wrong: -10 (to make it costly to be wrong and not open)
          - Open: -10 (cost) and then they know the truth, but they don't get any bonus for being correct? That might not be ideal.

     Instead, we can skip points and focus on the belief. But the points can help make them feel the stakes.

     Revised point system (to encourage not opening if they are confident and correct, but to penalize being wrong when not opening):
          - If they choose not to open and the card is as they believed: +20.
          - If they choose not to open and the card is not as they believed: -20.
          - If they choose to open: they get 0 points (they pay 10 to open and then get 10 for knowing the truth? Let's simplify: opening costs 10 points, and then they get 0 additional. So net -10. But they avoid the risk of losing 20.)

     This way, if they are very confident, they might not open. If they are less confident, they might open to avoid the big loss.

     But note: we want them to feel entitled to ignore the evidence. So if they are in the good case, they might ignore the evidence and not open. In the bad case, they might ignore the evidence and not open and then lose 20.

     We can also have a third option: update their belief without opening. Then if they update to the new evidence and are correct, they get +20 (if they don't open) and if wrong, -20.

     The worksheet would then have:
          - Option 1: Stick with initial belief and do not open the envelope.
          - Option 2: Update to the new evidence (believe Source B) and do not open.
          - Option 3: Open the envelope (and pay 10 points).

     They choose one.

  5. **Reveal the Truth (10 minutes)**:
     - Have students open their envelopes and see the actual card.
     - They calculate their points (if we are using points) and record:
          - Actual color: ______
          - Points earned: ______
     - But note: we are not really playing for money, so we can just have them see the outcome.

  6. **Group Reflection (15 minutes)**:
     - Ask students to form groups of 3-4 and discuss:
          - What did you do? Why?
          - How did you feel about the new evidence?
          - Did anyone ignore the evidence? Why?
          - What happened? (Good case vs bad case)
     - Then bring the class together for a whole-class share.

  **Timeline (90 minutes total)**:

  - 0-10 min: Introduction and distribution of envelopes. Students record initial belief and confidence.
  - 10-15 min: Explain the task and the point system (if used).
  - 15-20 min: Distribute evidence slips. Students read the new evidence.
  - 20-35 min: Students individually decide and record their choice (stick, update, or open) and their final belief.
  - 35-45 min: Students open envelopes and record the truth and points (if used).
  - 45-60 min: Small group discussion (as above).
  - 60-75 min: Whole class discussion, guided by the instructor.
  - 75-90 min: Debrief and connect to the dogmatism paradox.

  **Debrief**:

  The instructor now reveals the structure and connects it to the paradox.

  1. **Map the steps**:
     - Step 1: You took yourself to know the color (because of the 90% reliable source). 
     - Step 2: Then you received evidence that seemed to contradict what you knew. 
     - Step 3: But if you really knew, then the card must be as you thought, so the evidence must be misleading. So you were entitled to ignore it.
     - Step 4: This entitlement is a priori: you know that if you know, then any contrary evidence must be misleading, so you can ignore it without even looking.

  2. **Connect to the activity**:
     - In the good case (envelopes 1-7): the evidence was misleading (Source B was wrong). So ignoring it was the right move.
     - In the bad case (envelopes 8-14): you didn't actually know (you were in the bad case), but you thought you did. The evidence was actually correct, but you ignored it because you thought you knew. So you were entrenched in a false belief.

  3. **The two ways people resist**:
     - **Denying that you always know that you know (KK principle)**: Some might say: after the evidence, you no longer know that you know. But in the activity, note that the entitlement to ignore comes from the initial knowledge claim. The question is: can you retain your knowledge in the face of contrary evidence by dismissing it?
     - **Separating knowledge and rationality**: Some say: even if you know, you should update your beliefs rationally when faced with new evidence. But the paradox says that if you really know, then you know the evidence is misleading, so it's rational to ignore it. But the activity shows that in the bad case, that leads to disaster.

  4. **What the activity doesn't capture**:
     - The a priori status: In the activity, the reasoning is probabilistic (90% reliable). The dogmatism paradox is often presented with deductive certainty. But we can note that even with high probability, the same structure emerges.
     - It might blur the line between knowledge and rational belief. The activity is about belief and evidence, but the paradox is about knowledge.

  5. **Predictable Problems**:
     - **Confusion about the evidence**: Students might not understand that the evidence is about their specific envelope. Clarify when explaining.
     - **Misunderstanding the point system**: They might choose to open too often because they are risk-averse. Emphasize that the points are to simulate real stakes, but the point is about belief.
     - **Dead air during decision time**: Some students might finish quickly. Have a question ready for them: "Write a sentence about why you made that choice."
     - **In the group discussion**: They might focus on the outcome (good or bad) rather than the reasoning. Guide the discussion with: "Did anyone feel entitled to ignore the evidence? Why?"

  **Lines to have ready**:
     - When distributing the evidence: "Remember, Source B is also 90% reliable. This is new information that directly contradicts what you currently believe."
     - During decision time: "Think about whether you really know the color. If you know, then what does that mean about this new evidence?"
     - In the debrief: "Notice that the rule that protected the knowers (they ignored the evidence and were right) is the same rule that led the others to ignore the evidence and be wrong. From the inside, how could they tell the difference?"

  **Materials Preparation**:
     - Envelopes: 14, numbered 1 to 14.
     - For envelopes 1-7 (good case): 
          - Write: "The card inside is RED" (or BLUE, but we need to assign). Let's do: half red, half blue? Actually, we can do 3 red and 4 blue in good case? Doesn't matter. We can have 7 true: 3 red, 4 blue? But to keep it simple, let's have the statement be either red or blue randomly, but for good case, the card matches.
          - Actually, we can pre-assign: 
            Envelopes 1-7: 
              ID 1: "The card inside is RED" -> red card inside.
              ID 2: "The card inside is BLUE" -> blue card.
              ... etc. (randomly assign the color, but match)
     - For envelopes 8-14 (bad case):
          - ID 8: "The card inside is RED" -> blue card.
          - ID 9: "The card inside is BLUE" -> red card.
          ... etc. (randomly assign the statement, then put the opposite card)
     - Evidence slips: For each envelope, the evidence slip says:
          "SECOND REPORT: Source B (90% reliable) has examined the card in envelope [ID] and reports: 'The card is [COLOR]'."
          - For good case (1-7): the color reported is the opposite of the actual card (and the opposite of the envelope statement).
          - For bad case (8-14): the color reported is the actual card (which is the opposite of the envelope statement).

  Example (good case):
     Envelope 1: Statement "The card inside is RED", card is red.
     Evidence slip: "SECOND REPORT: ... reports: 'The card is BLUE'."

  Example (bad case):
     Envelope 8: Statement "The card inside is RED", card is blue.
     Evidence slip: "SECOND REPORT: ... reports: 'The card is BLUE'."

  So in both cases, the evidence slip says the opposite of what the envelope says? 
     - Good case: envelope says red (true) -> evidence says blue (false).
     - Bad case: envelope says red (false) -> evidence says blue (true) [because the card is blue].

  Thus, the evidence slip always says the opposite of the envelope statement. That's consistent.

  **Worksheet**:

  Page 1 (Initial):
     Envelope ID: ______
     Statement on envelope: "The card inside is ______"
     My initial belief: The card is ______
     My confidence: ______ %

  Page 2 (After evidence):
     New evidence: [printed evidence slip text]
     After seeing the new evidence:
        - I choose to: 
            [ ] Stick with my initial belief (ignore the new evidence)
            [ ] Update my belief to what Source B says
            [ ] Open the envelope (cost: 10 points)
        - If I choose not to open, my final belief: The card is ______
     (Optional: Confidence after evidence: ______ %)

  Page 3 (After opening, if applicable, and reflection):
     Actual card color: ______
     Points: 
        - If you did not open and your final belief was correct: +20
        - If you did not open and your final belief was wrong: -20
        - If you opened: -10

     How did you feel when you saw the new evidence? Did you feel entitled to ignore it? Why or why not?

  **Instructor Notes**:
     - Print the evidence slips in advance and hand them out at the right time.
     - Have a master list to know which envelopes are good/bad to facilitate discussion.
     - If a group finishes early during the small group discussion, ask them to discuss: "If you were in the good case, how would you explain the new evidence? If you were in the bad case, how would you explain it?"

  This activity should create the experience and set up the debrief to reconstruct the paradox.
answer: |-
  Based on your constraints and pedagogical goals, here's a tested activity called **"The Reliability Protocol"** that forces students to confront the paradox through hands-on choices. The design focuses on a medical diagnosis scenario to raise stakes, uses sealed envelopes to create uncertainty about being in the good/bad case, and requires no technology or real money.

  ### Core Mechanics
  - **Role-play**: Students act as doctors reviewing patient cases.
  - **Structured choice cascade**: They make sequential decisions that mirror the paradox's reasoning.
  - **Blind good/bad cases**: 50% receive correct initial diagnoses (good case), 50% receive incorrect ones (bad case), assigned randomly. Neither they nor you know the distribution during the activity.
  - **Physical materials**: Envelopes, diagnosis cards, and "evidence tokens" they can shred.

  ---

  ### **Materials** (Printable, for 14 students)
  1. **14 Patient Folders** (folded cardstock):  
     - Each contains:  
       - `INITIAL REPORT`: *"Patient X shows textbook symptoms of Disease A. Our clinic's initial diagnostic tool is 90% reliable for this disease."*  
       - `SEALED ENVELOPE` labeled *"Definitive Test Result - Do Not Open Yet"*:  
         - Good case (7 folders): Contains *"Disease A confirmed"* card.  
         - Bad case (7 folders): Contains *"Disease B confirmed"* card.  
     *(Assign good/bad cases randomly before class; mark envelopes subtly with G/B for your reference)*

  2. **14 Evidence Tokens** (small paper slips):  
     - All tokens state: *"New peer-reviewed study: Patients with these symptoms have Disease B 80% of the time. Our clinic's initial tool was faulty for this batch."*  
     *(Identical text for all, ensuring evidence is contrary to initial diagnosis)*

  3. **Shredder Box** (decorated box with slot; use any container):  
     - Labeled *"Discredit Evidence Protocol"*. Students may "shred" tokens here to ignore evidence.

  4. **Decision Worksheets** (one per student):  
     ```markdown
     STEP 1: Initial Diagnosis
     - Based on the Initial Report, I believe the patient has: Disease A / Disease B
     - My confidence: ___% (0-100)

     STEP 2: New Evidence Received
     - After reading the evidence token, I choose to:
       [ ] Shred the evidence (ignore it permanently)  
       [ ] Keep the evidence (consider it in my diagnosis)  
     - If I kept it, my updated belief is: Disease A / Disease B  
       (If you shredded, your belief remains unchanged)  

     STEP 3: Final Verification  
     - Open the sealed envelope. True diagnosis: _________  
     - I was in the GOOD CASE / BAD CASE (circle one)  
     ```

  ---

  ### **Timeline** (90 Minutes Total)
  **Phase 1: Setup & Initial Belief** (15 min)  
  - 0:00: Distribute patient folders. Instruct: *"You’re a specialist. Based solely on the Initial Report, record your diagnosis and confidence. Do NOT open the sealed envelope yet."*  
  - Students complete Step 1 of worksheet. Circulate to ensure 100% initial confidence in Disease A (emphasize the 90% reliability).  

  **Phase 2: Evidence Introduction & Choice** (20 min)  
  - 0:15: Distribute evidence tokens. Instruct: *"New evidence contradicts your diagnosis. You may SHRED it (ignore permanently) or KEEP it (update your belief). Choose now — you can't change your mind later."*  
  - Students decide and complete Step 2. Place shredder box prominently; watch who shreds tokens.  
  - *Critical moment*: If students ask if shredding has consequences, reply: *"You’re following standard protocol. Do what you think is responsible."*  

  **Phase 3: Revelation & Small Groups** (20 min)  
  - 0:35: Instruct students to open sealed envelopes and circle GOOD/BAD case.  
  - Group students by good/bad cases (e.g., "all good cases together"). Task:  
    - *Good-case groups*: *"Why was shredding the right call? How did you know the evidence was misleading?"*  
    - *Bad-case groups*: *"What went wrong? Why didn’t the evidence change your mind?"*  

  **Phase 4: Whole-Class Discussion** (25 min)  
  - 0:55: Groups report key insights. Ask:  
    - *"Good-case doctors: Could you have distinguished yourselves from bad-case doctors before opening the envelope?"*  
    - *"Bad-case doctors: What would it take to make you reconsider a 'known' diagnosis?"*  
  - Guide toward recognizing that both groups used identical reasoning to justify shredding.  

  **Phase 5: Instructor Debrief** (10 min)  
  - 1:20: Introduce the paradox using student experiences.  

  ---

  ### **Debrief Script**  
  **Map Activity → Paradox Steps**  
  1. **"Knowledge entails truth"**:  
     - *Activity link*: Initial 90% reliability → "I know it's Disease A."  
     - *Student moment*: High confidence in Step 1.  

  2. **"Contrary evidence must be misleading"**:  
     - *Activity link*: Shredding tokens because "the test confirms Disease A, so the study must be flawed."  
     - *Student moment*: Good-case groups arguing the study was "obviously noise."  

  3. **"I know I may ignore it"**:  
     - *Activity link*: Shredder box as a physical "entitlement" mechanism.  
     - *Student moment*: Students who shredded saying, "Why would I consider evidence if I’m sure?"  

  4. **"This is knowable a priori"**:  
     - *Activity link*: Protocol required ignoring evidence *before* verification.  
     - *Student moment*: Realizing they shredded based on initial confidence alone.  

  **Resisting the Conclusion: Activity Insights**  
  - **Denying KK principle ("I don't always know I know")**:  
    Bad-case students will say: *"I didn’t really know it was Disease A!"* → Counter: *"But you acted identically to good-case doctors. What stopped you from doubting before the envelope?"*  
  - **Separating knowledge/rational revision**:  
    Students may argue: *"Knowing doesn’t mean you shouldn’t check new evidence!"* → Counter: *"Why did both good and bad cases feel rationally entitled to ignore? What does 'rational' mean here?"*  

  **Limitations of the Activity**  
  1. **A priori tension is simulated, not proven**:  
     - The 90% reliability is empirical, not logical. Students may miss the paradox's deductive force.  
     - *Mitigation*: Stress that the activity *models* the reasoning pattern; the philosophical bite is in generalizing it.  

  2. **Knowledge vs. rational belief blurred**:  
     - The activity conflates "high confidence" with "knowledge," sidestepping Gettier cases.  
     - *Mitigation*: Clarify in debrief: *"We’re testing if treating a belief as knowledge licenses dismissal — not whether it’s actually knowledge."*  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"Why shred? I’d just weigh the evidence!"**  
     - *Why*: Students resist binary choices.  
     - *Fix*: Pre-activity framing: *"Protocol requires a binary choice: trust your diagnosis or the new evidence. No compromises."*  
     - *Ready line*: *"Imagine this evidence challenges your expertise. Do you stand by your training or defer?"*  

  2. **Shredder box seen as "cheating"**  
     - *Why*: Literal-minded students think shredding destroys data.  
     - *Fix*: Clarify: *"Shredding means ignoring the evidence in your reasoning. The slip is just a symbol."*  

  3. **Bad-case groups finish early, get defensive**  
     - *Why*: They realize their error quickly.  
     - *Fix*: Redirect: *"Discuss: What rule made you ignore evidence? Could a good doctor follow this rule?"*  

  4. **"The study might be wrong!" (Good-case deflection)**  
     - *Why*: They intuit the paradox but avoid discomfort.  
     - *Ready line*: *"Absolutely — but why are you sure it’s wrong? Couldn’t the bad-case doctors say the same?"*  

  ---

  ### **Why This Works**  
  - **Seduction of entitlement**: Shredding feels powerful and efficient (especially for good-case students).  
  - **Fool’s armor revealed**: Bad-case students confront how "certainty" blocked course-correction.  
  - **Reconstruction**: The group discussions force students to articulate the paradox’s steps unprompted.  

  Run this tight to the timeline, and the phrase "dogmatism paradox" will feel like the inevitable punchline.
