  They might also be reducing ethics to calculable outcomes. But Parfit's point is that some choices define our character regardless of consequences. I should stress that sending the $100 isn't about the driver's perception—it's about honoring a commitment made to secure aid. 

  ...I'll structure the reply: (1) concede transparency helps in standard cases, (2) argue that promising creates binding reasons even with uncertainty, (3) highlight the moral cost of exploiting trust, and (4) reject the reduction to expected utility. Keep it visceral—no jargon. Use "you" to make it personal.
answer: |-
  Alright, let's argue. You're sitting there, having just promised to pay a hundred bucks for the ride, the desert fading behind you. The driver can't read your mind; he took a gamble. You'll never see him again. You're asking why you *should* send the money later, purely for *this* moment, *this* isolated act.

  You're right that transparency makes the standard case cleaner, but you're wrong that removing it destroys the obligation *here*. Think about *why* you made the promise in the first place. You invoked a specific norm – promising – precisely to get the ride you desperately needed. That wasn't just noise; it was you leveraging a social practice built on trust to gain a vital benefit. Now, the moment that leverage has served *your* purpose, you want to discard the obligation inherent in that very practice? That’s not rational self-interest; it’s bad faith exploitation. You actively *used* the expectation of honesty inherent in promising to manipulate him. Refusing to pay isn't just "not paying," it's retrospectively turning your promise into a *lie* to steal a service. The driver's uncertainty doesn't magically erase the fact that you deliberately engaged in a trust-based exchange and now intend to betray that trust solely because you can get away with it. The obligation stems from the *nature of the act you performed to save yourself* – making a promise – not just the driver's perception or future consequences *for you*.

  **Your turn.** Why is exploiting the promise you made fundamentally different from, say, finding a forgotten wallet and keeping the cash? Convince me that leveraging trust for gain and then ditching the obligation isn't inherently corrosive, even in this one-shot deal.
