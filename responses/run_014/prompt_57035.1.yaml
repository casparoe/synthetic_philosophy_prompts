  Hmm, the core of their challenge is about whether Parfit's argument holds when information asymmetry exists. They're testing if the moral obligation collapses without perfect transparency. I need to counter this without retreating to dispositions—I must stay focused on the immediate decision in the passenger seat.

  First, I should acknowledge their point about transparency doing heavy lifting in standard versions. That's fair—I'll concede it upfront to avoid seeming evasive. But then I need to pivot: even with uncertainty, the act of promising isn't neutral. Promising inherently creates a reason to follow through; it's not just about consequences. 

