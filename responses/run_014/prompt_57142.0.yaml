prompt: |-
  So I've been chewing on a view for a while now and I want the honest version of how exposed it is, not a steelman and not a pep talk. American English please, and no bibliography or reading list — I can't look anything up, so anything you'd want me to go read, just tell me in prose.

  The view, which I'll call the shell thesis. Every durable moral norm in a large-scale society is at bottom a Lewisian convention — a regularity in a recurrent situation that persists because of common knowledge plus conditional preferences to conform given that others conform, sitting on top of some coordination or assurance or chicken game — that has since grown a moralized shell. The shell is the interesting part: outrage, disgust, third-party punishment, appeals to dignity or sacredness, and above all the felt categoricity. On my view the categoricity is a commitment device. It makes conformity look unconditional so the equilibrium survives stretches where the payoffs temporarily favor defecting, and it lets third parties police cheaply because everyone knows everyone else is watching for violations. So the moral phenomenology is not evidence that the norm tracks anything non-conventional. It's the stabilizer.

  The specific claims I want to defend, so you know what to aim at:

  1. Origins: behind each such norm there was a recurrent game whose equilibria the norm selects. No promise, no explicit agreement, no moral insight — a focal point that happened to stick.
  2. Asymmetric decay: the coordiation problem goes first and the rhetoric lags. You should get periods of what I'd call zombie norms, where people still express full-strength moral condemnation of acts that no longer threaten any equilibrium. And in the other direction, new coordination problems should get solved as mere etiquette or convention first and moralized only later, with a lag.
  3. Fragility gradient: moralization should be strongest exactly where the equilibrium is most fragile — highest payoff to defecting, hardest to police — and weakest where conforming is already nearly costless.
  4. Rarity: norms with no equilibrium behind them at all should be rare, unstable, and mostly confined to small face-to-face groups where reputation and kinship do the work instead.

  Now: what would count against this? I want the defeaters ranked from fatal to merely awkward, with an explicit line between the two.

  - Cases. Give me the norms that are hardest for it and say *why* they're hard rather than just listing them. My own shortlist, which I'd like you to check and extend: norms against cruelty to animals, abolition, duties to the dead and promise-keeping to people who can no longer be affected, incest and food taboos, norms about sexual conduct, hospitality to strangers. For each, say whether a defender can find a game the norm is plausibly selecting among, and — this is the crux — how you'd know that game was there independently of the norm.

  - The rival that worries me most isn't moral realism. It's the view that norms are group-identity markers: moralization as coalition signaling, with no coordination core needed. That predicts the same outrage, the same categoricity, the same third-party punishment, and it doesn't require me to find a game behind anything. What observation or pattern actually separates the shell thesis from that? If the answer is nothing, say so plainly.

  - Free parameters. I suspect my real problem is that I can always retro-fit a game: choose the players, the informational structure, whose payoffs count, and any stable regularity becomes an equilibrium that the norm selects. That makes the thesis compatible with everything, which is the classic way to insulate a view. Confront this head-on. Is it falsifiable as stated? If not, what discipline would make it so — specifying the game from ecology and demography before you look at the norm, requiring the norm to pick out one equilibrium among several in an independently identified game, requiring the timing claims in 2 and the gradient in 3 to come out right? And is that kind of flexibility a fatal flaw for a view like this, or just what a mid-level social theory looks like before it's had a hundred years of case work?

  - A structural worry of my own that I want you to assess, because I can't tell if it's fatal. Lewis's machinery is built for coordination games, where the conditional preference to conform given others conform is genuine and the alternatives are roughly equally good. But a lot of the norms I care about sit on bargaining or conflict games instead — split the surplus, chicken, unequal endowments. There the norm isn't landing everyone on an equilibrium they're all happy with; it's deciding who gets how much, and whoever draws the short end has no conditional preference to conform whatsoever. Its stability then has to come from the shell alone, which starts to look like the thesis eating itself. How much of the moral-norm landscape is actually coordination-shaped rather than bargaining-shaped, and can the shell hold the bargaining cases together without collapsing into a pure power-and-extraction story? If it can't, I've reinvented conflict theory and lost the Lewisian content entirely.

  - Lewis himself. As I remember it, he built the analysis for coordination problems proper and thought moral rules fell outside it, because the arbitrariness clause fails: for a real moral norm there's no alternative regularity the participants would regard as serving about as well. If that's right then I'm either quietly changing the subject (my norms aren't his conventions) or the arbitrariness clause is just empirically false about a lot of norms, which is damage to Lewis rather than to me. Sort out which horn I'm on and how bad each one is, and correct me if I'm misremembering him, btw.

  - And finally, what does the shell thesis predict that its rivals don't? I've got the lag, the asymmetry, and the fragility gradient; are there sharper tests I'm missing? Which of them have arguably already come out wrong — moralized norms appearing basically instantly on some new technology, or norms dying while their coordination problem was still live?

  For each defeater, tell me whether a committed defender of the shell thesis would concede it as counting against them or wave it off, and whether any of the concessions are load-bearing — if they give up that one, does the whole thing go? I'm genuinely fine with the conclusion being that the view is well insulated, as long as you tell me whether that's a problem for a view of this kind or just a feature of it.
reasoning: |-
  Okay, the user has presented a detailed and sophisticated theory called the "shell thesis" about moral norms, and they're looking for critical feedback. They want to know what could potentially falsify or weaken their view, without any sugarcoating. 

  First, I need to understand the core of their argument. They're saying that durable moral norms start as Lewisian conventions—solutions to coordination problems—that then develop a "moral shell" of outrage, disgust, etc., to stabilize them. The moral phenomenology isn't evidence of anything non-conventional; it's just a commitment device. 

  The user has laid out four specific claims they want to defend: origins in recurrent games, asymmetric decay (zombie norms), fragility gradient (strongest moralization where equilibrium is most fragile), and rarity of norms without an equilibrium base. 

  They've also provided a list of potential counterexamples: animal cruelty norms, abolition, duties to the dead, incest taboos, sexual conduct norms, hospitality. For each, I need to explain why it's challenging and whether a defender could plausibly find a supporting game. 

  The user seems worried about three main things: 
  First, that the coalition signaling theory might explain the same phenomena without needing a coordination core. 
  Second, that the thesis might be unfalsifiable because you can always retrofit a game to fit any norm. 
  Third, that Lewis's framework might not extend well to bargaining games rather than coordination games. 

  This is clearly someone with deep philosophical training—they're referencing game theory, Lewis, and social theory with precision. They're not looking for validation; they want rigorous critique. The "American English, no bibliography" request suggests they want direct, conversational engagement without academic pretension. 

  I notice they're particularly concerned about the unfalsifiability problem. That's often the Achilles' heel of functionalist explanations in social science. If you can always invent a post-hoc game to explain any norm, the theory explains everything and therefore nothing. 

  The bargaining vs. coordination issue also seems critical. If most moral norms are really about distributing benefits rather than solving coordination problems, the Lewisian foundation crumbles. I'll need to assess how much of the moral landscape is actually coordination-shaped. 

  For the counterexamples: 
  - Animal cruelty might be hard because the "game" involves non-participants (animals). A defender might argue it's about reputation among humans, but that feels strained. 
  - Duties to the dead seem particularly tricky—what coordination problem could they possibly solve? 
  - Hospitality norms might actually fit well, as they clearly solve traveler-host assurance games. 

  On the coalition signaling rival: The key differentiator might be whether the norm actually coordinates behavior or just signals affiliation. If we see norms that are identity-markers but don't solve recurrent coordination problems, that hurts the shell thesis. 

  For falsifiability: The user's suggestion about requiring independent specification of the game from ecology/demography is smart. Also, their "asymmetric decay" and "fragility gradient" claims are testable predictions that could fail. 

  Lewis's arbitrariness point is well-taken. If moral norms aren't arbitrary in Lewis's sense (i.e., there aren't equally good alternatives), then either the user is talking about something different than Lewis, or Lewis was wrong. The user seems willing to throw Lewis under the bus if needed. 

  Overall, the strongest objections seem to be: 
  1. Bargaining norms undermining the conditional preference requirement 
  2. Duties to the dead having no plausible game 
  3. The coalition signaling alternative 
  4. Potential unfalsifiability 

  But none are outright fatal. The theory might survive as a partial account—applicable to coordination norms but not distributive ones—if the user concedes that limitation. The dead norms issue might require creative game theory (e.g., meta-reputation games). The unfalsifiability problem is shared by many mid-level social theories and might be mitigated by methodological discipline. 

  The user seems prepared for tough feedback—they're clearly thought deeply about this. I'll structure the response to mirror their numbered concerns while keeping the tone direct and colloquial as requested. The goal isn't to demolish their view but to show where the real pressure points are.
answer: |-
  Here’s the raw assessment of your shell thesis—no pep, no steelman, just the cracks and where they might buckle. I’ll rank defeaters as **fatal** (threatens core mechanics), **severe** (forces major concessions), or **awkward** (nuisance but defensible). The line: **fatal** means the thesis can’t function as stated; **severe** means it survives only with ad hoc patches that weaken its reach.

  ---

  ### **1. Cases: The Hard Norms**  
  *(Ranked by how badly they strain the "equilibrium-first" requirement)*  

  - **Duties to the dead (e.g., grave desecration, broken promises to the deceased)**  
    **Problem:** No live coordination game. The dead can’t retaliate, renegotiate, or affect payoffs.  
    **Shell defense:** *Maybe* meta-reputation (e.g., "If you betray the dead, I can’t trust you with *my* secrets").  
    **Why weak:** The link is speculative. No independent evidence this game drives the norm *universally* (e.g., norms persist even when the defector is anonymous). **Verdict: Severe** (defense feels retrofitted; no clear game without the norm).  

  - **Abolition (e.g., anti-slavery norms in slaveholding societies)**  
    **Problem:** Violates *conditional preference*. Enslavers lose massive profits by conforming; no obvious payoff for unilateral altruists.  
    **Shell defense:** Long-term stability game (e.g., fear of rebellion, economic inefficiency).  
    **Why weak:** Timing mismatch—moralization often *precedes* evidence of instability (e.g., early abolitionists in 1700s UK). **Verdict: Severe** (looks like moral insight/power struggle, not equilibrium selection).  

  - **Incest taboos (especially universal sibling aversion)**  
    **Problem:** No visible coordination game. Avoidance is near-universal even when no third parties observe (e.g., isolated siblings).  
    **Shell defense:** Inbreeding avoidance as a biological coordination problem (genetic fitness).  
    **Why weak:** The "game" isn’t social—it’s hardwired disgust. Moral shell adds little. **Verdict: Awkward** (defense works but blurs "convention" into biology).  

  - **Cruelty to animals (in non-utilitarian contexts, e.g., stray cats)**  
    **Problem:** Animals aren’t players. No payoff matrix for humans unless via reputation.  
    **Shell defense:** Signaling empathy to *other humans* (trustworthiness).  
    **Why weak:** Condemnation often targets hidden acts (e.g., factory farming leaks), not reputation games. **Verdict: Awkward** (plausible but thin).  

  - **Hospitality to strangers**  
    **Fits well:** Clear assurance game (host/guest mutual vulnerability). Moral shell prevents exploitation. Minimal retrofit.  

  ---

  ### **2. The Coalition Signaling Rival**  
  **Problem:** Predicts identical phenomenology (outrage, categoricity) but no coordination core. Signals group loyalty, not equilibrium stability.  
  **How to separate them:**  
  - **Test 1:** Does the norm *actually coordinate behavior*? Signaling-only norms (e.g., kosher rules) often don’t affect core cooperation.  
  - **Test 2:** Look for *functional redundancy*. If a norm moralizes but lacks a clear game (e.g., archaic purity codes), it’s likely signaling.  
  - **Test 3:** **Fragility gradient (your #3)**. Signaling predicts moralization strongest where identity threats are highest, *not* where defection payoffs are high.  
  **Verdict: Severe** (coalition signaling could explain "zombie norms" better than shell thesis; you need #3 to hold to separate them).  

  ---

  ### **3. Free Parameters / Falsifiability**  
  **Core flaw:** Yes, you can always retrofit a game by fiddling with payoffs, players, or timescales. That *is* insulation.  
  **Discipline required:**  
  - Specify players/options/payoffs **from ecology alone** (e.g., resource scarcity, tech constraints).  
  - Demand the norm **solves a pre-existing multiplicity** (multiple equilibria → norm picks one).  
  - **Require failed predictions:** If fragility gradient (#3) or asymmetric decay (#2) flop, the thesis wobbles.  
  **Verdict: Severe** (As stated, it’s unfalsifiable; but with discipline, it’s salvageable as mid-range theory).  

  ---

  ### **4. Bargaining Games vs. Coordination**  
  **Your worry is valid:**  
  - In bargaining games (e.g., property norms), the "loser" has no conditional preference to conform—it’s extraction.  
  - Shell stability here *requires* the moral rhetoric to mask power (e.g., "sacred rights" justifying feudalism).  
  **Consequence:** For bargaining-shaped norms, the "shell" isn’t stabilizing a convention—it’s enabling exploitation. This **collapses into conflict theory**.  
  **How much is bargaining-shaped?** Most distributional norms (inheritance, gender roles, class) fit this.  
  **Verdict: Fatal** for a *purely* Lewisian view. **Salvage path:** Limit the thesis to coordination/assurance norms (e.g., traffic rules, promises) and treat bargaining norms as a hybrid/edge case.  

  ---

  ### **5. Lewis’s Arbitrariness Clause**  
  **You’re right:** Lewis thought moral norms *aren’t conventions* because they lack arbitrariness (no one thinks child torture has an "equally good alternative").  
  **Your options:**  
  - **Horn 1:** Admit your "norms" aren’t Lewisian conventions. You’re extending his framework.  
  - **Horn 2:** Argue arbitrariness *is* empirically false (e.g., dueling vs. litigation as honor dispute resolutions).  
  **Damage:** Horn 1 is **awkward** (semantic). Horn 2 **undercuts Lewis** but saves your thesis—many norms *do* have historical alternatives (e.g., monogamy vs. polygamy).  

  ---

  ### **6. Unique Predictions**  
  **Yours:** Asymmetric decay (zombie norms), fragility gradient, moralization lag.  
  **Sharper tests you’re missing:**  
  - **Moralization velocity:** Shell thesis predicts slow moralization (needs convention → shell). If a norm moralizes *instantly* (e.g., digital privacy norms post-Snowden), it’s a problem.  
  - **Shell without equilibrium:** Find a norm with outrage/categoricity *but no prior convention phase* (e.g., sudden outrage at AI bias).  
  - **Gradient reversal:** If weak-stability norms moralize *more* than fragile ones (e.g., outrage over jaywalking > tax evasion), it fails.  
  **Known failures?**  
  - **Abolition (again):** Moralized fast, no prior convention.  
  - **Zombie norm counterexamples:** Some norms die *with* their game (e.g., chaperonage died with urbanization).  

  ---

  ### **Defender’s Response & Load-Bearing Concessions**  
  | Defeater | Defender’s Likely Move | Load-Bearing? |  
  |----------|------------------------|---------------|  
  | Bargaining games | Concede it’s hybrid; shell stabilizes via ideology | **YES** (loses Lewisian purity) |  
  | Duties to the dead | Push meta-games (reputation across time) | No (awkward but not fatal) |  
  | Coalition signaling | Insist coordination is *necessary* for durability | **YES** (if signaling suffices, core claim fails) |  
  | Falsifiability | Impose disciplinary constraints | No (thesis adapts) |  
  | Arbitrariness | Ditch Lewis’s clause | No (Lewis isn’t sacred) |  

  **Conclusion:** The thesis is **insulated but not invincible**. Its armor is thinnest at:  
  1. **Bargaining norms** forcing a concession to power dynamics.  
  2. **Coalition signaling** explaining identical phenomena sans game.  
  3. **Instant moralization** breaking the lag prediction.  
  **Is insulation a problem?** For a mid-range theory? No—it’s normal. But it *will* bleed explanatory territory to rivals unless you nail the fragility gradient or decay asymmetry. **Fatal?** Only if you insist on a *monolithic* Lewisian mechanism. **Severe?** Absolutely.
