answer: |-
  Based on your friend's track record, I'll break this down step by step: predict her verdict on "X is famous" as a reason to admire X, identify her underlying rule, propose alternative rules that fit the track record, state what each rule predicts for the fame case, give my best guess with reasoning, and suggest a test case to cleanly separate the rules.

  ### 1. **Predicted Verdict for "X is famous" as a reason to admire X**
     - **She will say this is the WRONG kind of reason (WKR).**  
       This aligns with her pattern of rejecting reasons that are not directly about the intrinsic qualities of the object of the attitude (in this case, admiration for X).

  ### 2. **Underlying Rule She Seems to Be Following**
     - **Rule: Constitutive Norm Alignment (CNA)**  
       Reasons are of the right kind (RKR) if they directly address the *constitutive norm* of the attitude—that is, they bear on the properties or features that define what makes the attitude fitting or appropriate. Reasons are of the wrong kind (WKR) if they invoke external consequences, benefits, or non-normative properties unrelated to the attitude's core standard.  
       - **Why this fits her track record:**  
         - *Belief*: RKR requires evidence (truth norm), WKR if pragmatic benefit (e.g., "feel better").  
         - *Admiration*: RKR requires admirable qualities (e.g., courage), WKR if social benefit (e.g., "look sophisticated").  
         - *Blame*: RKR requires wrongdoing, WKR if instrumental benefit (e.g., "deter others").  
         - *Finding beautiful*: RKR requires aesthetic properties (e.g., "beautifully composed").  
       In all cases, she prioritizes reasons tied to the attitude's inherent standard over external incentives.

  ### 3. **Alternative Rules That Fit the Track Record**
     Two other rules could explain her judgments equally well based on the data provided. Both align perfectly with her track record but may diverge in the fame case or others.

     - **Alternative Rule 1: Attitude-Independence (AI)**  
       Reasons are RKR if they are *attitude-independent*—that is, they refer to facts about the object that exist regardless of whether you hold the attitude. Reasons are WKR if they are *attitude-dependent*—they rely on the consequences or benefits of holding the attitude.  
       - *Fits track record*:  
         - WKR cases (e.g., "feel better" for belief, "look sophisticated" for admiration) depend on holding the attitude.  
         - RKR cases (e.g., "evidence supports p," "genuinely courageous") are facts about the object, independent of the attitude.

     - **Alternative Rule 2: Fittingness-Utility Distinction (FUD)**  
       Reasons are RKR if they bear on the *fittingness* of the attitude (i.e., whether the object merits it based on its properties). Reasons are WKR if they appeal to *utility* (i.e., the practical benefits of having the attitude, regardless of fittingness).  
       - *Fits track record*:  
         - RKR cases (e.g., "genuinely courageous" for admiration) are about fittingness.  
         - WKR cases (e.g., "make you look sophisticated" for admiration) are about utility.

  ### 4. **Predictions for the Fame Case Under Each Rule**
     - **Constitutive Norm Alignment (CNA)**: Predicts **WKR**.  
       *Reasoning*: Admiration is constitutively tied to qualities like courage, virtue, or excellence. Fame is not an admirable quality in itself—it's a social status that could arise from non-admirable things (e.g., notoriety) or be disconnected from X's character. Thus, it doesn't align with admiration's norm.
     
     - **Attitude-Independence (AI)**: Predicts **RKR**.  
       *Reasoning*: Fame is an attitude-independent fact about X (it exists whether or not you admire X). This rule doesn't require the reason to be normatively relevant—only independent. So "X is famous" qualifies as RKR.

     - **Fittingness-Utility Distinction (FUD)**: Predicts **WKR**.  
       *Reasoning*: Fame might be useful to admire (e.g., for social clout), but it doesn't make admiration fitting—admiration is fitting only if X has admirable properties. Fame is a utility-based reason, not a fittingness-based one.

  ### 5. **Best Guess and Reasoning**
     - **Best Guess**: She will say **WKR**, following **Constitutive Norm Alignment (CNA)**.  
       - *Why?* Her track record shows a consistent focus on the *inherent standards* of attitudes. For admiration, she explicitly endorsed "X is genuinely courageous" (RKR) and rejected social utility ("look sophisticated") as WKR. Fame is analogous to utility—it's an external, non-constituive factor. Even if fame sometimes correlates with admirable qualities, it doesn't directly bear on admiration's norm, making it WKR by her pattern.  
       - *Why not the alternatives?*  
         - AI predicts RKR, but this would contradict her rejection of utility-based reasons in other cases (e.g., she called "make you look sophisticated" WKR, which is also attitude-independent if you define "sophistication" as a social fact). This suggests AI is less likely.  
         - FUD also predicts WKR, but it's narrower than CNA (it focuses only on utility vs. fittingness, while CNA covers all non-constitutive reasons). CNA better explains her broad intuition.

  ### 6. **Additional Test Case to Cleanly Separate the Rules**
     To distinguish between CNA, AI, and FUD, use this case:  
     - **Test Case**: "Admiring X would make X feel happy." (as a reason to admire X)  
       - This is WKR if she follows CNA or FUD, but RKR if she follows AI.  
       - *Breakdown*:  
         - **CNA**: **WKR** – Happiness of X isn't a constitutive norm of admiration (unlike courage).  
         - **AI**: **RKR** – X's happiness is attitude-independent (it's a fact about X, not your attitude).  
         - **FUD**: **WKR** – This is utility (benefit to X), not fittingness.  
       - *Why this separates the rules?*  
         - AI would misclassify this as RKR, while CNA and FUD correctly call it WKR based on her pattern (she rejected similar outcome-based reasons like "deter others" for blame). If she says WKR, it rules out AI. If she says RKR, it rules out CNA/FUD.  
         - This case is better than "fame" because fame is ambiguous (it could be misconstrued as independent), while "make X happy" is clearly outcome-dependent yet attitude-independent.

  **Summary**:  
  - **Prediction for fame case**: WKR (based on CNA).  
  - **Her likely rule**: Constitutive Norm Alignment.  
  - **Key test case**: "Admiring X would make X feel happy" – if she says WKR, it confirms CNA/FUD; if RKR, it confirms AI.  
  This should give you a clear path to reverse-engineer her intuitions!
