  Therefore, the underlying rule seems to be:

  **Rule 1 (Standard WKR distinction):** A reason is of the right kind for an attitude if it bears on the object of the attitude in a way that is constitutive of the attitude (i.e., it is about the feature that the attitude is a response to). Otherwise, it is of the wrong kind.

