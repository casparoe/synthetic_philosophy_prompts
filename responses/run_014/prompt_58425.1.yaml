  We are given a scenario involving a pretrial risk assessment tool. We are to analyze this case using the lens of algorithmic fairness impossibility results. The stipulations are:

  1. A risk tool assigns defendants to risk levels (e.g., low, medium, high) intended to predict an outcome (e.g., rearrest within a fixed period).
  2. Critics found a disparity in error rates: among defendants who did not recidivate (i.e., did not experience the outcome), Black defendants were classified as high risk at a substantially higher rate than white defendants. This is a disparity in false positive rates (FPR).
  3. The developer counters that the tool is similarly predictive across groups: among defendants given the same risk level, the outcome rate is similar. This is calibration within groups.

  We are also told that the base rates (the actual rates of recidivism) differ across groups.

  The working definitions:
  - Calibration within groups: For a given risk level, the observed outcome rate (e.g., the proportion of defendants who recidivate) is roughly the same for each group (Black and white defendants).
  - Balance in false positive rates (FPR): Among defendants who do not recidivate, the proportion classified as high risk is roughly equal across groups.

  The core impossibility claim: When base rates differ and prediction is imperfect but nontrivial, calibration and balance in FPR cannot both be achieved simultaneously by the same scores and a single threshold, except in degenerate cases.

  We are to do four things:

  1. **Disciplined mapping**: Identify the predictor, decision, groups, outcome, base-rate difference, and what each fairness desideratum demands.
  2. **Evaluate a reform proposal**: An oversight board proposes to keep a common underlying score, use group-specific thresholds to achieve both desiderata, and adjust the reported scores to preserve calibration. We must assess whether this escapes the tradeoff or relocates it, what must give, and what normative choices remain.
  3. **Honest account**: Discuss what the dispute looks like once the math is clear, what the impossibility framework explains well and what it leaves out (e.g., choice of outcome, human discretion, data legitimacy), and what the case reveals about the limits of the theory.
  4. **Throughout**: Clearly separate what is mathematically settled from what is contested.

  Let's break this down step by step.

  ### 1. Disciplined Mapping

  **Predictor**: The underlying risk score (a numerical score or a risk level derived from it) that the tool produces for each defendant.

  **Decision**: The assignment to a "high-risk" category (or more generally, a decision threshold that designates a defendant as high risk). This decision might influence pretrial detention or release conditions.

  **Groups**: Black defendants and white defendants (as per the controversy).

  **Outcome variable**: The measured outcome (e.g., rearrest within a fixed period). We'll denote:
     - Positive outcome (Y=1): recidivism (rearrest) occurred.
     - Negative outcome (Y=0): no recidivism.

  **Base-rate difference**: The actual recidivism rates differ between Black and white defendants. Let:
     - \( p_B = P(Y=1 | \text{Black}) \)
     - \( p_W = P(Y=1 | \text{White}) \)
     - We are told \( p_B \neq p_W \) (without loss of generality, assume \( p_B > p_W \), as is often observed in the data).

  **Fairness desiderata**:

  - **Calibration within groups**: For any given risk level (or score) \( s \), the observed recidivism rate should be the same for Black and white defendants. Formally:
    \[
    P(Y=1 | S=s, \text{Black}) = P(Y=1 | S=s, \text{White}) = s \text{ (if scores are probabilistic)}
    \]
    However, if the risk levels are discrete (like low, medium, high), then for each level \( l \), we require:
    \[
    P(Y=1 | L=l, \text{Black}) = P(Y=1 | L=l, \text{White}) = r_l
    \]
    where \( r_l \) is the recidivism rate for that level.

  - **Balance in false positive rates (FPR)**: Among defendants who do not recidivate (Y=0), the proportion classified as high risk should be similar across groups. Let \( D \) be the decision (1 if high risk, 0 otherwise). Then:
    \[
    P(D=1 | Y=0, \text{Black}) = P(D=1 | Y=0, \text{White})
    \]

  **What each demands of the scores and threshold**:

  - Calibration within groups: This requires that the mapping from the risk score to the predicted risk is accurate for each group. If we are using a common scoring function, then the score must be equally predictive in both groups. This is a property of the score itself and does not directly depend on the threshold.

  - Balance in FPR: This depends on the threshold. We set a threshold \( t \) such that if the score \( S \geq t \), the defendant is classified as high risk. Then, FPR is \( P(S \geq t | Y=0) \). Balance requires that this conditional probability (given Y=0) is the same for both groups.

  The impossibility result tells us that when base rates differ (i.e., \( p_B \neq p_W \)) and the predictor is not perfect (so we have errors) and nontrivial (it has some predictive power), then we cannot have both calibration and balance in FPR at the same time with a common threshold.

  ### 2. Evaluating the Reform Proposal

  The proposal: Keep the common underlying score, but use group-specific decision thresholds to achieve both desiderata. Additionally, adjust the reported scores to preserve the appearance of calibration.

  **How it might work**:

  - Let the underlying score \( S \) be the same for both groups (e.g., a score from a model trained on all data).
  - However, set different thresholds for the two groups: \( t_B \) for Black defendants and \( t_W \) for white defendants. The goal is to achieve balance in FPR by choosing thresholds such that:
    \[
    P(S \geq t_B | Y=0, \text{Black}) = P(S \geq t_W | Y=0, \text{White})
    \]
  - Additionally, to preserve calibration, they propose to adjust the reported scores. For example, they might map the original score to a new score for each group so that the reported risk levels appear calibrated. Specifically, for a given original score, they might report a different value for Black defendants than for white defendants so that when they assign a risk level (based on the reported score and a common threshold for the reported scores) it appears that the recidivism rate for a given reported level is the same across groups.

  However, note that the proposal says they are using group-specific thresholds for the decision (high risk or not) but then adjusting the scores to preserve calibration. This might be done by:

    Step 1: Train a common model producing score \( S \).
    Step 2: For each group, choose a threshold for the decision: \( t_B \) and \( t_W \) to balance FPR.
    Step 3: To achieve calibration, they transform the score within each group. For group \( g \), define a function \( f_g \) such that the reported score \( R_g = f_g(S) \). The transformation is chosen so that the reported score \( R_g \) satisfies calibration within the group. For example, they might use a monotonic transformation (like a group-specific scaling) so that the reported score is calibrated.

  But note: the transformation might break the relationship with the underlying score. The decision thresholds for the high-risk designation are applied to the original score? Or to the reported score? The proposal says they use group-specific thresholds for the decision. Let's assume:

  - The decision (high risk) is based on the original score with group-specific thresholds: for a Black defendant, if \( S \geq t_B \), then high risk; for a white defendant, if \( S \geq t_W \), then high risk.

  But then, to have calibration, they adjust the reported score. The reported score might be used for communication (e.g., to judges) and for assigning risk levels (like low, medium, high) that are calibrated. So they might set a common threshold for the reported score to assign risk levels? Or they might adjust the reported score so that when they assign risk levels based on the reported score (using common thresholds for the reported score), the risk levels are calibrated.

  Alternatively, the proposal might be:

  - They use the common score to compute the decision (high risk) using group-specific thresholds (so the decision rule is group-dependent).
  - They also create a new reported score for each defendant that is a transformed version of the original score. This transformation is group-specific and is designed so that if they were to use a common threshold on the reported score for the purpose of assigning risk levels (for communication), then the risk levels would be calibrated.

  However, note that the decision (for high risk) is already taken using group-specific thresholds on the original score. The reported score is then adjusted for calibration. This adjustment does not affect the decision (which is already made) but might be used for other purposes (like explaining the decision or for other risk levels).

  But the proposal claims that this achieves both desiderata:

  - Balance in FPR: Achieved by the group-specific thresholds on the original score for the high-risk decision.
  - Calibration: Achieved by the adjusted reported score (so that when we look at the reported score or the risk levels derived from it, they are calibrated).

  **Does it escape the impossibility?** 

  The impossibility result we stated was for a single threshold on the same score. Here, we are using two thresholds (on the same underlying score) for the decision and then transforming the score for reporting. The impossibility result does not directly apply to the decision rule because the thresholds are group-specific. However, note the following:

  - The decision rule (high risk) is based on the original score with group-specific thresholds. This allows us to set thresholds to balance FPR.
  - The calibration is achieved by the reported score. But note: the reported score is a transformed version of the original score. The transformation is group-specific and is designed to make the reported score calibrated. This is possible because we can transform the scores within each group to be calibrated (by, for example, using a monotonic transformation that maps the original score to the empirical recidivism rate in that group). This is sometimes called "recalibration".

  So, the proposal can achieve:

    - Balance in FPR for the high-risk decision (by setting group-specific thresholds on the original score).
    - Calibration for the reported score (by group-specific transformations).

  But note: the impossibility result is about having both properties on the same score and threshold. Here, we are using two different things: the decision uses the original score with group-specific thresholds (achieving balance in FPR) and the reported score is a transformed version (achieving calibration). However, the original score is not calibrated (unless the transformation is the identity, which it isn't). The reported score is calibrated, but we are not using it for the decision? Or are we?

  The proposal says: "using group-specific decision thresholds together with post hoc adjustments to the reported scores to preserve the appearance of calibration". So the decision is made on the original score (with group-specific thresholds) and then the reported score is adjusted for calibration. This means:

    - The decision (high risk) is not based on the reported score? It's based on the original score and group-specific thresholds.
    - The reported score is adjusted, so when we assign a risk level (e.g., low, medium, high) based on the reported score (using a common threshold for the reported score) then we get calibrated risk levels.

  But note: the high-risk decision is one specific risk level (the highest). In the reporting, they might assign multiple risk levels. The high-risk decision (for detention) might be based on the original score and group-specific thresholds, but the reported risk levels (which might be used for other purposes) are based on the adjusted score and common thresholds.

  So, the two desiderata are achieved on two different objects:

    - Balance in FPR: achieved for the high-risk decision (using original score and group-specific thresholds).
    - Calibration: achieved for the reported score (and hence for the risk levels derived from it).

  However, the impossibility result does not forbid having two different scoring systems. The problem is that the two scoring systems (the original and the adjusted) may not be aligned. In particular, the adjusted score might not be predictive in the same way. Moreover, the high-risk decision is made on the original score, but then the defendant is given a reported score that is adjusted. This might lead to inconsistencies.

  **What must give?** 

  The tradeoff is relocated. The original score cannot be both calibrated and have balanced FPR with a common threshold. The proposal avoids that by:

    - Using group-specific thresholds on the original score to achieve balance in FPR (for the high-risk decision).
    - Adjusting the reported score to achieve calibration (for the reported risk levels).

  But note: the adjusted reported score is not the same as the original score. Therefore, the cost is:

    - The reported score is not the same as the score used for the high-risk decision. This might be confusing and lack transparency. For example, two defendants (one Black, one white) might have the same original score, but because of group-specific adjustments, they get different reported scores. This might be seen as unfair.
    - The adjusted reported score might not be predictive of recidivism in the same way. However, by construction, it is calibrated. But calibration is a marginal property (it conditions on the score) so it can be achieved by a transformation that is monotonic and based on the group's recidivism rates.

  **Residual normative choice**:

  Even with this proposal, there are choices:

    - The group-specific thresholds for the high-risk decision: How do we set them? We set them to balance FPR. But we might also consider other goals, such as balancing false negative rates (FNR) or overall accuracy. The proposal does not specify how to set the thresholds beyond balancing FPR. We might set them to exactly balance FPR, but then we have to accept the resulting FNR and overall error rates, which may differ by group.

    - The transformation for the reported score: We can choose a transformation that achieves calibration. However, there might be multiple transformations that achieve calibration (e.g., any strictly increasing transformation that maps the original score to a calibrated scale). We might choose one that preserves as much of the original information as possible, but this is a design choice.

    - The fundamental tradeoff: We are still making a group-specific adjustment. The proposal does not eliminate the need for different treatment by group. The residual choice is about risk tolerance: by setting the thresholds to balance FPR, we might be accepting higher FNR for one group or the other. Specifically, if the base rate is higher in the Black group, then to balance FPR (which is about the non-recidivists) we might set a higher threshold for the Black group (so that fewer non-recidivists are classified as high risk). But then, to maintain the same level of FPR, we might have to set a lower threshold for the white group? Actually, let's think:

      - We want: FPR_Black = FPR_White.
      - FPR = P(S>=t | Y=0)
      - If the distribution of scores given Y=0 is the same for both groups, then we can set the same threshold. But base rates differ and the score distributions are likely different.

      Typically, if the base rate is higher in the Black group, the score distribution for the Black group (both for Y=1 and Y=0) might be shifted higher. Therefore, to achieve the same FPR, we might need a higher threshold for the Black group. But then, what about false negatives? A higher threshold for the Black group might lead to more false negatives (recidivists classified as low risk) in the Black group. Alternatively, we might set a lower threshold for the white group to make FPR_White higher (to match FPR_Black). But then we are increasing the FPR for white defendants (which might have been low before).

      The point is: balancing FPR does not come for free. It may lead to an increase in FNR for one group or the other. So the residual normative choice is about the relative importance of FPR and FNR (which are tied to the costs of different errors) and how they are distributed.

  ### 3. Honest Account

  **Once the mathematics is clear**:

  The impossibility result shows that we cannot have both calibration and balance in FPR with a common threshold and the same score. This is a mathematical fact. Therefore, the dispute between the critics (who want balance in FPR) and the developer (who points to calibration) is fundamentally about which fairness criterion should be prioritized. The critics are concerned about disparate impact on non-recidivists (who are wrongly detained), while the developer is concerned about the predictive validity of the risk levels.

  **What the impossibility framework explains well**:

  - It clarifies the inherent tension between two desirable properties when base rates differ. It shows why the two sides are talking past each other: they are demanding two incompatible properties.

  **What it leaves out**:

  - **Choice and validity of the outcome measure**: The framework assumes the outcome (recidivism) is well-defined and measured correctly. However, in practice, recidivism measures might be biased (e.g., rearrest rates might be influenced by policing practices that are not race-neutral). If the outcome measure is flawed, then both calibration and FPR balance are defined with respect to a flawed target. This is a major concern.

  - **Human discretion**: The scores are often used as one input by judges. Judges might override the score. The framework treats the decision as fully automated. The human element might mitigate or exacerbate the disparities.

  - **Legitimacy of the data-generating process**: The data used to train the model might reflect historical biases. The impossibility result assumes the scores are given and the base rates are fixed, but the base rates themselves might be the product of systemic inequities.

  - **Other fairness criteria**: There are other fairness notions (like equalized odds, which requires both FPR and FNR to be equal, or predictive parity, which is calibration) that might be considered. The framework only addresses two.

  - **Multiple thresholds and risk levels**: The framework we discussed is for a binary decision (high risk or not). But risk tools often have multiple levels. The impossibility result we stated is for a binary decision and a single threshold. With multiple levels, we might have more complex tradeoffs.

  **What the case reveals about the limits of the theory**:

  - The theory is silent on the ethical and political choices about which fairness criterion should be used. It does not tell us which criterion is more important for pretrial decisions. This is a normative question.

  - The theory does not address the possibility of using group-specific thresholds or transformations (as in the reform proposal). It only says that with a common threshold and the same score, we cannot have both. The reform proposal shows that by using different thresholds and adjusting the scores, we can achieve both, but at the cost of transparency and consistency.

  - The theory is a snapshot: it does not account for the dynamic effects of using the tool (e.g., feedback loops where detention affects future recidivism).

  ### 4. Throughout: Separation of Mathematical and Contested Elements

  **Mathematically settled**:

  - Given the definitions of calibration and balance in FPR, and given that base rates differ and the predictor is imperfect and nontrivial, it is impossible to achieve both with the same score and a common threshold. This is a theorem (proven in the literature, e.g., by Chouldechova and others).

  - The reform proposal can achieve both properties by using group-specific thresholds and a group-specific transformation of the score. However, the original score is not calibrated and the adjusted score is not used for the high-risk decision. Therefore, the two properties are achieved on two different representations.

  **Contested**:

  - Which fairness criterion should be used in pretrial decisions? Some argue that calibration is necessary for the risk assessment to be meaningful. Others argue that balance in FPR is critical to avoid disparate harm to non-recidivists in the group with a higher base rate. This is a normative debate.

  - The legitimacy of using group-specific thresholds: This might be seen as discriminatory (because it treats defendants differently based on race) or as a necessary corrective for existing disparities.

  - The choice of outcome: The use of rearrest as a measure of recidivism is contested because it might reflect policing disparities.

  - The use of the tool at all: Some argue that risk scores should not be used in pretrial decisions because they perpetuate racial disparities.

  Therefore, we must not present any one normative view as the consensus.

  ### Summary Response

  **Disciplined Mapping**:
  - Predictor: underlying risk score (S)
  - Decision: assignment to high risk (D=1 if S>=t, but note the reform uses group-specific t)
  - Groups: Black and white defendants
  - Outcome: recidivism (Y=1 if rearrest within follow-up, else 0)
