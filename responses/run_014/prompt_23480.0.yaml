  ok so I've been reading about the Twin Earth thought experiment and teh whole externalist thing where meaning isn't really in the head, and honestly the water example is the only one anyone ever brings up. Can you give me a new case — not water or gold or tigers or any of the classic natural kind stuff — where an externalist account of word meaning (reference gets fixed by the external environment and history, not by what's in the speaker's head) gives a verdict that feels actually wrong or really counterintuitive? Explain why the externalist answer is the problematic one in that case. Bonus if it's about a normal word I'd actually use in real life.
