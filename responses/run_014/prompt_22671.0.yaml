prompt: |-
  I've been reading about updateless decision theory, mostly blog posts about Newborn's problem, and I keep getting stuck on the name. If the agent is supposed to be "updateless," how does it ever use evidence at all? Like, I come home and the lights are on and the car's in the driveway, and that's clearly evidence that someone's home, and I'd change my beliefs about that under any decision theory I've heard of. If UDT says to be updateless, does it mean I should just ignore what I see and act like I know nothing? That seems absurd. So what does "updateless" actually mean here? What's the real idea behind it?
reasoning: |-
  Okay, the user is confused about the term "updateless" in Updateless Decision Theory (UDT). They've been reading about Newcomb's problem and can't reconcile how an "updateless" agent can still use evidence. They give a relatable example about coming home and seeing lights on as evidence someone's home. Their core question is: If UDT says to be updateless, does that mean ignoring evidence? They think that seems absurd, so they want the real meaning behind it.

  First, I need to unpack why "updateless" is such a confusing term. The word itself suggests not updating, which directly contradicts how we normally use evidence. The user's home example perfectly illustrates this tension. Their confusion is totally valid—it's a terrible name choice by the field. I should validate that upfront.

  The key insight is separating the agent's initial state from its runtime actions. UDT agents absolutely use evidence, but they don't update their core decision rule. The analogy with precommitment might help: like deciding "if I see X, I'll do Y" in advance. The user's example works here—they'd still conclude someone's home from the lights, but UDT handles cases where that evidence might be correlated with the outcome itself.

  Newcomb's problem is the classic example. The predictor bases the money on anticipating your decision. If you "update" on seeing the box full, you might think taking one box is better, but that's the trap. UDT avoids this by choosing the policy upfront: always take both boxes, because that's the optimal rule even before seeing the boxes.

  The user might also be hinting at broader decision theory interests. Their frustration with terminology suggests they're trying to really understand, not just get a surface answer. I should emphasize the "subjunctive dependence" point—that UDT cares whether the evidence is caused by the choice versus just correlated. Their home example lacks this entanglement, which is why UDT wouldn't change normal behavior there.

  I should also clarify what "update" means technically: it's about not revising the strategy based on evidence that other theories mistake as informative for the decision. The math helps—computing expected utility over world-histories while holding the strategy fixed—but I'll keep it conceptual since they're reading blogs.

  Finally, reassure them that outside predictor-like scenarios, UDT reduces to normal evidence use. Their intuition isn't wrong; UDT just handles edge cases differently. The name is indeed misleading, and the field probably should've called it something like "Precommitment Decision Theory."
answer: |-
  That's an excellent question—the term "updateless" is incredibly misleading and causes confusion for almost everyone starting with UDT (Updateless Decision Theory). You're absolutely right: **UDT agents *do* use evidence and observations**. The key is *how* and *when* they use it. "Updateless" doesn't mean "ignore evidence." It means **don't condition your *entire decision-making strategy* on observations that might be correlated with or caused by the very choice you're about to make.**

  Here's the breakdown:

  1.  **The Problem with "Updating" in Standard Decision Theories:** In causal decision theory (CDT) and even some forms of evidential decision theory (EDT), the agent observes evidence (E), updates its beliefs about the state of the world (P(World | E)), and *then* chooses the action (A) that maximizes expected utility given those *updated* beliefs.
      *   **The Trap:** This sequential process (Observe -> Update Beliefs -> Choose Action) can lead to self-defeating behavior in scenarios involving predictors, simulations, or logical correlations. The classic example is Newcomb's Paradox.
      *   **Newcomb's Illustration:** The predictor fills Box B with $1 million only if it predicts you will choose *only* Box B. If it predicts you'll take *both* boxes, it leaves Box B empty. Box A always contains $1000.
          *   **CDT/EDT "Updating" Trap:** When you stand in front of the boxes, you *observe* whether Box B is full. If it's full, "updating" might lead you to think: "Taking only Box B is good *now* because it's full!" But the predictor *already* made its decision based on what it thought you *would* do. Taking both boxes *after* seeing Box B is full doesn't change the past. The optimal move is to commit to taking only Box B *before* the prediction is made. The act of "updating" on the observation of Box B's contents distracts you from the crucial fact that your decision *influenced* the contents *before you observed them*.

  2.  **What "Updateless" Actually Means in UDT:**
      *   **It's About Choosing a *Policy*, Not an *Action*:** Instead of waiting to observe the world and *then* picking an action based on updated beliefs, a UDT agent chooses a complete *strategy* or *policy* **in advance**. This policy is a mapping: "For *every possible* observation I *could* make, what action will I take *if* I see that?"
      *   **Evaluating the *Whole* Policy:** The agent evaluates the *expected utility* of **entire candidate policies** right from the start (the "updateless" state), considering *all possible* observations and how the policy would respond to them. It asks: "Which mapping from observations to actions leads to the best *overall* outcome, given how the world works (including predictors, logical correlations, etc.)?"
      *   **Using Evidence *Within* the Policy:** Crucially, **the chosen policy absolutely *does* use evidence!** If the policy says "if I see lights on, act as if someone is home; if lights are off, act as if no one is home," then when you actually see the lights on, you *will* act accordingly. The evidence is used *as specified by the pre-selected optimal policy*.
      *   **Avoiding the Self-Defeating Update:** The "updateless" part means you don't *re-evaluate and change your core strategy* based on evidence that might be a *consequence* of what your strategy *would have been*. You commit to the best overall plan *before* seeing evidence that could tempt you into a locally optimal but globally suboptimal action.

  3.  **Applying it to Your Example (and Newcomb's):**
      *   **Your Home Example (Normal Evidence):** There's no predictor basing its actions on your future decision. The state of the lights/car is purely caused by whether someone is home or not, independent of your actions. A UDT agent would choose a policy like: "If I see lights/car, assume someone is home and act cautiously/normally; if I see no lights/no car, assume no one is home and maybe act differently." **This is identical to how you'd act!** UDT handles normal evidence perfectly. The "updateless" aspect doesn't hurt here because the evidence isn't entangled with your decision process.
      *   **Newcomb's Problem (Entangled Evidence):** Here, the state of Box B (the evidence) *is* caused by a prediction of the action your *policy* would choose *if* you saw the full box. A UDT agent analyzes the two possible policies *in advance*:
          *   **Policy 1 (One-Boxing):** "Always take only Box B, regardless of what I see." Expected value: Very high (likely $1 million).
          *   **Policy 2 (Two-Boxing):** "Always take both boxes, regardless of what I see." Expected value: Low ($1000) or Medium ($1,001,000), but *on average* much lower than Policy 1, because the predictor only fills Box B when you follow Policy 1.
      *   **The UDT Agent:** Chooses Policy 1 (One-Boxing) *in advance* as the strategy with the highest *overall* expected utility. When it actually sees Box B full, it follows its pre-committed policy and takes only Box B. It *uses* the evidence (it sees the box) but **does not *update its fundamental strategy*** based on that evidence. It doesn't think "Oh, the box is full, so *now* I should take only Box B." It thinks "My optimal policy, chosen before seeing anything, dictates taking only Box B in this situation."

  4.  **The Core Idea Behind "Updatelessness":**
      *   **Subjunctive Dependence:** UDT focuses on the *logical* or *counterfactual* dependence between your decision (or the policy governing it) and the state of the world. Does the world (or a predictor) depend on *what you would do* if you saw X? If yes, then conditioning your *choice of strategy* on seeing X is dangerous.
      *   **Optimal Precommitment:** It's about finding the best possible set of commitments ("if I see X, I do Y; if I see Z, I do W") from a perspective *before* any potentially strategy-revealing observations are made.
      *   **Mathematically:** UDT maximizes expected utility by summing over *all possible* world histories, weighted by their probability, and for each history, it evaluates the outcome based on the action dictated by the *entire, fixed policy* for the observation *in that history*. It doesn't condition the *selection* of the policy on being in a particular observational state.

  **In Simple Terms:**

  *   **"Updateless" doesn't mean "ignore evidence."**
  *   **It means "choose your entire plan for how to *react* to *all possible* evidence *before* you get any evidence that might have been influenced by what your plan *would be*."**
  *   **Once you have evidence, you follow the plan you pre-committed to. That plan *uses* the evidence!**

  The name "Updateless Decision Theory" is widely acknowledged as poorly chosen because it suggests ignoring evidence, which is the opposite of what it does. A better name might have been "**Policy Decision Theory**" or "**Precommitment Decision Theory**," emphasizing that the core decision is choosing a complete reaction plan upfront. It handles normal evidence like your home example just fine and shines in complex, predictor-heavy scenarios like Newcomb's where standard "update-then-act" approaches fail.
