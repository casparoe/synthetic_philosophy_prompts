prompt: |-
  I co-run a small multi-site project comparing how people respond to philosophical thought experiments — six sites, two of which are places where nobody on our core team speaks the language, so we work through in-country collaborators and paid translators. Each wave we field maybe 12-15 vignettes, and every one gets a verdict question on a 7-point scale plus a free-text box asking people to explain their answer in their own words. Pre-registration goes in about five weeks out and after that we're stuck with our analysis plan, so I need something we can apply per vignette, not per paper.

  The problem: when a vignette comes back with a verdict gap between sites, we currently just argue about it in a meeting. Some of us say it's a real difference in the intuition, some say it's the translation, some say 7-point scales don't mean the same thing to someone who went through a different school system, some say participants at different sites are answering different questions entirely — like whether the act was blameworthy versus whether the agent actually knew. Its not that we lack opinions, it's that we have no procedure and I'm sick of the meetings.

  So: write me a triage procedure an RA can run on one vignette in about an hour, with no stats training past a first methods course, that sorts a verdict gap into genuine difference / translation-or-comprehension failure / scale and response-style artifact / question substitution (they're answering something else) / undecidable with the data we have. For each branch I want what evidence to look at in the stuff we already collect, what would count as a sufficient answer to that question, and what we do next — report it, report it with a caveat, drop the vignette, or re-field it next wave. Be blunt about which steps are judgment calls wearing a procedure costume. Our collaborators have been burned by teams that pretended otherwise and I don't want to do that to them.

  Two things we already do, so build these in rather than reinventing them: every vignette has a mirror version where the culturally loaded detail is swapped for a site-local equivalent nominated by the in-country collaborator, and we field both; and we ask a subsample to paraphrase the case back to us, which we code for whether the key structural detail survived.

  Then run your procedure on three invented results, and for each give the verdict, the reasoning, and the sentence we'd actually put in the pre-registration:

  1. A Gettier-style case. The mirror version closes the gap at one site but not the other, and the paraphrase codes come back clean everywhere.
  2. A case about whether it's permissible to break a promise to a dying person. Huge gap, paraphrases fine, but one site's whole distribution is squeezed into 5-6-7 while another uses the full 1-7.
  3. A free-will style case where the gap disappears when we swap the wording of the question from a could-have-done-otherwise phrasing to a local idiom that our collaborator says carries no ability connotation at all. Honest warning: this one is the centerpiece of the grant and I badly want it to be a real finding, so if your procedure says I have to drop it, tell me straight and tell me what would have to change for it to survive.

  Last thing — say what the procedure cannot settle no matter how much data we throw at it, and mark the points where the decision belongs to me or to the in-country collaborator rather than to the RA following the steps.
reasoning: |-
  We are designing a triage procedure for a small multi-site project with six sites. The goal is to diagnose the cause of a "verdict gap" (difference in mean/median responses on a 7-point scale) between sites for a given vignette. The procedure must be executable by an RA in about an hour, using existing data and without advanced statistics.

  Existing practices we must incorporate:
  1. Each vignette has a mirror version where a culturally loaded detail is swapped for a site-local equivalent (nominated by in-country collaborators). Both versions are fielded.
  2. A subsample of participants is asked to paraphrase the case, which is coded for the survival of key structural details.

  The possible diagnoses are:
  - Genuine difference in intuition
  - Translation or comprehension failure
  - Scale and response-style artifact (e.g., different use of the 7-point scale)
  - Question substitution (participants are interpreting the question as asking something else)
  - Undecidable with current data

  For each diagnosis, we need:
  - Evidence to look at (from existing data)
  - What would count as sufficient evidence for that diagnosis?
  - Next steps: report it, report with caveat, drop the vignette, or re-field next wave.

  The procedure should be transparent about judgment calls.

  Additionally, we must run the procedure on three invented results and provide:
  - Verdict (diagnosis)
  - Reasoning
  - Sentence for pre-registration

  Finally, note what the procedure cannot settle and mark decision points that require the PI or in-country collaborator.

  ---

  **Triage Procedure for a Vignette Verdict Gap**

  **Step 0: Setup**
  - Have the following data for the vignette in question for each site:
    a. Verdict distribution (7-point scale) for the original and mirror version (if applicable).
    b. Paraphrase coding results (proportion that got the key structural detail correct).
    c. Free-text responses (if available and translated) for a subsample.

  **Step 1: Check Comprehension (Paraphrase Coding)**
  - Look at the paraphrase coding: What proportion of participants correctly recalled the key structural detail?
  - **Threshold for concern**: If in any site the proportion is below a pre-set threshold (e.g., 70%), flag as potential comprehension failure.
  - **Judgment call**: The threshold is set by the core team (PI) in advance. The RA applies it.
  - **If below threshold**: 
    - Diagnosis: Comprehension failure (at least partially).
    - Next step: Report with caveat (e.g., "Low comprehension at site X, interpret with caution") or consider dropping the vignette for that site. If the gap is only at the low-comprehension site, this may explain the gap.
  - **If above threshold everywhere**: Move to Step 2.

  **Step 2: Check the Mirror Version**
  - Compare the verdict gap between sites for the original and the mirror version.
  - **Pattern 1**: The gap remains in the mirror version at the same sites.
    - Then: The gap is not due to the culturally loaded detail that was swapped. Move to Step 3.
  - **Pattern 2**: The gap closes in the mirror version at one or more sites.
    - Then: The gap was likely due to the culturally loaded detail. This suggests a genuine difference in how that detail is perceived, which might be of interest.
    - Diagnosis: Genuine difference (related to the swapped detail).
    - Next step: Report the finding and note that the mirror version closed the gap, indicating cultural specificity of the original detail.
  - **Pattern 3**: The gap changes (e.g., reverses or shifts) in the mirror version.
    - Then: This might indicate that the detail is interacting with the cultural context in a complex way. This is also a genuine difference but more nuanced.
    - Diagnosis: Genuine difference (with evidence of cultural interaction).
    - Next step: Report with a note about the interaction.

  **Step 3: Check Response Distribution**
  - Examine the distribution of responses (for the original version, unless the mirror is the focus) at each site.
  - **Check 1**: Is the distribution at one site highly skewed or restricted (e.g., only using 5-7, or only 1-3) while others use the full scale?
  - **Check 2**: Compare the variance (or the range) across sites. If one site has significantly less variance, it might indicate a response style (e.g., avoiding extremes).
  - **Evidence for response-style artifact**: 
    - A site shows a compressed distribution (e.g., only using 3 points) and/or extreme skew (e.g., 90% in one or two adjacent points) while others do not.
    - The same pattern (compression/skew) appears across multiple vignettes for that site (the RA might need to check other vignettes from the same wave for that site). 
  - **Judgment call**: The RA must decide if the distribution is sufficiently different. A rule of thumb: if the interquartile range (IQR) is very narrow (e.g., spanning only 1 or 2 points) and the full range is also narrow (e.g., only 2 or 3 points) while at other sites the IQR is 3+ points and the range is 5+, that's evidence of compression.
  - **If evidence of response-style artifact**:
    - Diagnosis: Scale/response-style artifact.
    - Next step: Report with caveat (e.g., "Responses at site X were compressed, which may account for the gap") and consider using non-parametric tests or focusing on the free-text. Also, consider re-fielding with a different scale (e.g., visual analog) in the future.
  - **If not, or if the pattern is not consistent across vignettes for that site**: Move to Step 4.

  **Step 4: Analyze Free-Text Explanations**
  - **Goal**: Check for question substitution (are participants answering a different question?).
  - **Method**: 
    - The RA should read a sample of free-text responses (translated) from each site (e.g., 10-20 per site) and code them for the rationale given. 
    - Specifically, look for:
      - Whether the rationale matches the intended question (e.g., for a blameworthiness question, are they talking about blame?).
      - Whether a different concept is being discussed (e.g., for a knowledge question, they might talk about belief or certainty).
  - **Judgment call**: The RA must interpret the free-text. If the RA is unsure, they should consult the PI or a team member.
  - **Evidence for question substitution**:
    - At one site, a substantial portion (e.g., >30%) of the free-text responses focus on a concept that is not the target (e.g., talking about ability when asked about freedom).
    - The pattern is consistent across responses at that site but not at others.
  - **If evidence of question substitution**:
    - Diagnosis: Question substitution.
    - Next step: Report with caveat (e.g., "Participants at site X interpreted the question as about Y, not Z") and consider re-fielding with a revised question.
  - **If no evidence of substitution and the free-text rationales align with the intended question**: Move to Step 5.

  **Step 5: Check for Genuine Difference**
  - At this point, we have ruled out:
    - Comprehension failure (Step 1)
    - Cultural detail (Step 2, if mirror didn't close the gap)
    - Response style (Step 3)
    - Question substitution (Step 4)
  - Therefore, the gap is likely due to a genuine difference in intuition.
  - **But note**: There might be other unmeasured confounds. We can only say that the common suspects are ruled out.
  - **Diagnosis**: Genuine difference.
  - **Next step**: Report the finding without caveats (from these checks).

  **Step 6: Undecidable**
  - If at any step the evidence is ambiguous (e.g., paraphrase coding is borderline, free-text is mixed, mirror version partially closes the gap) and the RA cannot make a clear call, then:
    - Diagnosis: Undecidable with current data.
    - Next step: Report with caveat (e.g., "The cause of the gap remains unclear") and consider re-fielding with additional measures (e.g., more paraphrases, different question wording) in the next wave.

  **Decision Points Requiring Higher Authority**
  - **Step 1 (Paraphrase threshold)**: The threshold (e.g., 70%) must be set by the PI in advance.
  - **Step 4 (Free-text interpretation)**: If the RA is unsure, they must consult the PI or a team member. The final call on question substitution might require the PI.
  - **In-country collaborator input**: 
    - In Step 2, if the mirror version is involved, the interpretation of why the mirror closed the gap might require input from the in-country collaborator (e.g., why the local detail worked differently).
    - In Step 4, if the free-text suggests a cultural concept that the RA doesn't understand, the in-country collaborator should be consulted.

  **What the Procedure Cannot Settle**
  - It cannot prove that there is no translation issue we haven't detected (unless the mirror or paraphrase catches it).
  - It cannot rule out all possible confounds (e.g., demographic differences between samples, unmeasured cultural factors).
  - It cannot definitively prove a genuine difference; it only rules out common alternatives.

  ---

  **Running the Procedure on Three Invented Results**

  **Case 1: Gettier-style case**
  - **Results**: Mirror version closes the gap at one site but not the other. Paraphrase codes are clean everywhere.
  - **Procedure**:
    - Step 1: Paraphrase is clean -> move to Step 2.
    - Step 2: Mirror closes the gap at one site (Site A) but not the other (Site B). 
      - Pattern: Gap closes at Site A, but remains at Site B. 
      - Interpretation: For Site A, the gap was due to the culturally loaded detail (so genuine difference related to that detail). For Site B, the gap remains, so we must continue.
    - For Site B: 
      - Step 3: Check response distribution. Assume it's normal (full scale used, similar variance) -> move to Step 4.
      - Step 4: Free-text (assume we don't have a problem) -> Step 5: Genuine difference at Site B.
  - **Overall Diagnosis**: 
    - For Site A: The gap was due to a genuine difference related to the culturally loaded detail (the mirror closed it).
    - For Site B: Genuine difference (unrelated to the swapped detail) and not due to the other artifacts.
  - **Pre-registration sentence**: "For the Gettier-style case, we observed a cross-site difference that at Site A was attributable to the culturally specific detail (as the mirror version closed the gap), while at Site B the difference remained and was not explained by comprehension, response style, or question substitution, suggesting a genuine difference in intuition."
  - **Next step**: Report both findings.

  **Case 2: Breaking a promise to a dying person**
  - **Results**: Huge gap in verdicts, paraphrases fine, but one site's distribution is squeezed into 5-6-7 while another uses the full 1-7.
  - **Procedure**:
    - Step 1: Paraphrase fine -> Step 2.
    - Step 2: Assume the mirror version does not close the gap (not mentioned, so we assume it doesn't) -> Step 3.
    - Step 3: One site (Site X) uses only 5-6-7, another (Site Y) uses 1-7. This is evidence of response compression at Site X.
    - Check: If this pattern is consistent across other vignettes at Site X? (The RA would need to check.) Suppose it is: then response-style artifact.
  - **Diagnosis**: Scale/response-style artifact (at least at Site X, which might be pulling the mean up).
  - **Pre-registration sentence**: "For the promise-breaking vignette, the observed gap between sites was accompanied by a compressed response distribution at Site X (using only the top three scale points) and not at other sites, suggesting a response-style artifact. We therefore interpret the gap with caution."
  - **Next step**: Report with caveat. Consider using a different response scale in the future or analyzing with methods robust to response styles (e.g., rank-based).

  **Case 3: Free-will case**
  - **Results**: The gap disappears when the question wording is swapped from "could have done otherwise" to a local idiom without ability connotation.
  - **Note**: The vignette was fielded with two different wordings (one original, one with the local idiom). But the triage procedure above is for one vignette. However, we can treat the two wordings as analogous to the mirror version, but for the question.
  - **Adapting the procedure**:
    - Step 1: Paraphrase fine -> Step 2.
    - Step 2: We don't have a mirror for the vignette, but we have two question wordings. This is similar to the mirror but for the question. We see that the gap disappears with the alternative wording.
      - Interpretation: The gap was due to the wording of the question (which introduced an ability connotation that the local idiom avoids).
    - This suggests that the original question was not measuring the same construct at both sites (question substitution?).
  - **Diagnosis**: Question substitution (because the original question was interpreted differently due to the wording, and the alternative wording, which is intended to measure the same construct without the connotation, closed the gap).
  - **Pre-registration sentence**: "For the free-will vignette, the observed gap between sites disappeared when the question was reworded using a local idiom without ability connotation, indicating that the original question wording was interpreted differently across sites. Therefore, we consider the gap in the original wording to be an artifact of question substitution."
  - **Next step**: Report the finding with the alternative wording and note that the original wording was problematic. The PI wants this to be a real finding, but the procedure says the gap in the original wording is not a real difference in the target construct (free will) but an artifact of the wording. However, the finding that the wording matters is itself important.

  **Blunt Truth for Case 3**: The procedure says you must drop the original wording as invalid for cross-site comparison. However, the alternative wording might be valid. So you can report the results from the alternative wording as the main finding. But note: the grant might have been about the original wording. If so, you have to report that the original wording didn't work and use the alternative. Alternatively, you could re-field the vignette with the alternative wording in all sites in the next wave to confirm.

  ---

  **Summary of the Triage Procedure**

  The procedure is a step-by-step flowchart:

  1. Comprehension (paraphrase coding) -> if fail, caveat or drop.
  2. Mirror version -> if gap closes, genuine difference (cultural detail); else next.
  3. Response distribution -> if compressed/skewed, response artifact; else next.
  4. Free-text -> if substitution, caveat and re-field question; else next.
  5. Genuine difference (if all above passed).

  If any step is inconclusive: undecidable.

  This should take about an hour per vignette because:
  - Steps 1-3 are quick (look at numbers and distributions).
  - Step 4 (free-text) might take 30 minutes to read and code 20-30 responses per site (if 2 sites, 40-60 responses). But if the RA only samples 10 per site, it's manageable.

  **Limitations**:
  - The procedure relies on existing data (so if free-text isn't available, Step 4 is skipped).
  - Judgment calls are present (especially in Step 4) and must be acknowledged.

  **Final Note**: The procedure is a triage, not a definitive proof. It helps structure the discussion and reduce meeting time by providing evidence-based diagnoses.
answer: |-
  Below is a triage procedure designed to diagnose verdict gaps in your multi-site project. The procedure is structured as a step-by-step flowchart that an RA can execute in ~1 hour per vignette, using only basic descriptive statistics and your existing data (mirror versions, paraphrase codes, verdict distributions, and free-text responses). Judgment calls are explicitly marked. The procedure prioritizes efficiency by focusing on high-signal evidence first.

  ---

  ### **Triage Procedure for Verdict Gaps**
  **Inputs for RA**: Verdict distributions (original + mirror), paraphrase coding results, free-text responses (translated), and pre-set thresholds (defined by PI).  
  **Output**: One of:  
  `GENUINE DIFFERENCE`, `TRANSLATION/CULTURAL COMPREHENSION FAILURE`, `SCALE/RESPONSE-STYLE ARTIFACT`, `QUESTION SUBSTITUTION`, `UNDECIDABLE`.

  #### **Step 1: Check Paraphrase Coding**  
  - **Evidence**: Paraphrase success rate (% correctly recalling key structural detail) per site.  
  - **Threshold**: Pre-set by PI (e.g., <70% = failure; ≥70% = pass).  
  - **Decision**:  
    - **IF** any site < threshold → `TRANSLATION/CULTURAL COMPREHENSION FAILURE`.  
      - *Next step*: Report with caveat ("Low comprehension at Site X") + drop data from failing sites for this vignette.  
    - **ELSE** → Proceed to Step 2.  
  - **Judgment call?** None. RA applies the pre-set threshold.

  #### **Step 2: Analyze Mirror Version**  
  - **Evidence**: Mean/median verdict gap (absolute difference) between target sites for:  
    - Original vignette vs. Mirror vignette.  
  - **Decision**:  
    - **IF** mirror *reduces the gap by ≥50%* at a site → `GENUINE DIFFERENCE` (culturally specific to the swapped detail).  
      - *Next step*: Report as genuine + note which detail drove the gap.  
    - **IF** mirror *does not reduce the gap* (<50% change) → Proceed to Step 3.  
    - **IF** mirror *increases the gap or is ambiguous* → Proceed to Step 3 (but flag ambiguity).  
  - **Judgment call?** RA calculates % gap reduction. Threshold (50%) is pre-set by PI.

  #### **Step 3: Check Response Distributions**  
  - **Evidence**: Verdict distributions (original version) per site:  
    - Skew (mean vs. median), kurtosis, % of responses in top/bottom 2 scale points.  
  - **Thresholds**: Pre-set by PI (e.g., skew > |1|, or >80% responses in 2 adjacent points).  
  - **Decision**:  
    - **IF** one site shows *high skew/compression* (e.g., 90% in 5–7) **AND** this pattern is consistent across >50% of other vignettes at that site (RA checks 2–3 others) → `SCALE/RESPONSE-STYLE ARTIFACT`.  
      - *Next step*: Report with caveat ("Response compression at Site X") + use non-parametric tests.  
    - **ELSE** → Proceed to Step 4.  
  - **Judgment call?** RA assesses "consistency" across vignettes (PI must pre-define how many to check).

  #### **Step 4: Screen Free-Text for Question Substitution**  
  - **Evidence**: Translated free-text responses (min. 10 per site). RA codes for:  
    - Explicit mentions of the *intended* construct (e.g., "blameworthy," "knew").  
    - Mentions of *alternative* constructs (e.g., "could have stopped" in a knowledge question).  
  - **Threshold**: Pre-set by PI (e.g., >30% of responses at a site reference an alternative construct).  
  - **Decision**:  
    - **IF** >30% at one site reference an alternative construct **AND** this is rare (<10%) elsewhere → `QUESTION SUBSTITUTION`.  
      - *Next step*: Report with caveat ("Site X interpreted question as about Y") + re-field with revised question next wave.  
    - **ELSE** → `GENUINE DIFFERENCE`.  
      - *Next step*: Report without caveats.  
  - **Judgment call?** RA interprets semantic content of free-text. **PI must validate coding** if ambiguous.

  #### **Step 5: Final Fallback**  
  - **IF** all steps are inconclusive (e.g., mirror ambiguous, free-text mixed) → `UNDECIDABLE`.  
    - *Next step*: Report as undecidable + re-field with additional measures (e.g., control questions) next wave.

  ---

  ### **Key Features**  
  - **Builds on existing practices**: Mirror versions and paraphrase coding are integral to Steps 1–2.  
  - **Efficiency**: Uses quick descriptive checks (no inferential stats). Free-text coding limited to 10–20 responses/site.  
  - **Blunt honesty**: Judgment calls flagged in **bold**; PI/collaborators make final calls on thresholds and ambiguous evidence.  
  - **What it cannot settle**:  
    - Deep cultural nuances (e.g., *why* a mirror worked). **Requires in-country collaborator insight**.  
    - Confounds from unmeasured variables (e.g., education, religion).  
    - Whether a "genuine difference" is theoretically meaningful (PI's call).  

  ---

  ### **Applied to Invented Results**  
  *Pre-registration sentences assume formal reporting; adapt tone as needed.*

  #### **Case 1: Gettier-style Case**  
  - **Results**: Mirror closes gap at Site A but not Site B; paraphrases 100% clean.  
  - **Procedure**:  
    - Step 1: Paraphrases pass → Proceed.  
    - Step 2: Mirror closes gap at Site A → `GENUINE DIFFERENCE` (detail-specific) for Site A. Gap persists at Site B → Proceed to Step 3.  
    - Step 3: Response distributions normal at Site B → Proceed to Step 4.  
    - Step 4: Free-text (assume no substitution) → `GENUINE DIFFERENCE` for Site B.  
  - **Verdict**: Genuine difference at both sites (Site A: cultural detail; Site B: underlying intuition).  
  - **Pre-registration**: *"Verdict gaps for Vignette [X] reflect genuine differences: Site A's gap was resolved by cultural mirroring, while Site B's persisted despite high comprehension and normal response patterns."*  
  - **Next step**: Report both as genuine.

  #### **Case 2: Breaking a Promise to a Dying Person**  
  - **Results**: Huge gap; paraphrases clean; Site X uses only 5–6–7, Site Y uses 1–7.  
  - **Procedure**:  
    - Step 1: Paraphrases pass → Proceed.  
    - Step 2: Mirror (assume no gap reduction) → Proceed.  
    - Step 3: Site X compressed (90% in 5–6–7); RA checks 2 other vignettes at Site X → same compression → `SCALE/RESPONSE-STYLE ARTIFACT`.  
  - **Verdict**: Artifact (Site X's compression inflates mean).  
  - **Pre-registration**: *"The verdict gap for Vignette [Y] is attributable to response compression at Site X (responses restricted to scale points 5–7), consistent across vignettes. Results interpreted with caution."*  
  - **Next step**: Report with caveat; consider non-parametric analysis.

  #### **Case 3: Free-Will Case**  
  - **Results**: Gap disappears with reworded question (removing "could-have-done-otherwise").  
  - **Procedure**:  
    - Step 1: Paraphrases clean → Proceed.  
    - Step 2: Mirror not applicable (question wording swap is functionally a "mirror" for the question). Gap closed → `QUESTION SUBSTITUTION` (original question not interpreted equivalently).  
  - **Verdict**: Question substitution (wording triggered divergent interpretations).  
  - **Pre-registration**: *"The verdict gap for Vignette [Z] resolved when reworded to avoid ability connotations, indicating the original question measured divergent constructs across sites. Data from the original wording are invalid for cross-site comparison."*  
  - **Blunt truth**: You must drop the original wording. It’s not a "real" free-will finding—it’s a measurement artifact.  
  - **To survive**: Re-field *only* the local-idiom version in all sites next wave. If the gap reemerges, it’s likely genuine.  

  ---

  ### **Final Recommendations**  
  - **Pre-set thresholds**: PI must define all thresholds (paraphrase %, gap reduction, skew, free-text coding) *before* RAs run the procedure.  
  - **PI/collaborator roles**:  
    - PI: Sets thresholds, validates free-text coding, makes final call on "undecidable" cases.  
    - In-country collaborators: Interpret *why* mirrors did/didn’t work and validate local idioms.  
  - **When to re-field**: Only for `QUESTION SUBSTITUTION` or `UNDECIDABLE`; drop data for `TRANSLATION` or `ARTIFACT` sites.  
  - **Time estimate**: 45–60 min/vignette (Steps 1–3: 15 min; Step 4: 30 min for 20–30 free-text responses).  

  This procedure replaces unstructured debates with evidence-based triage. It won’t resolve all disputes, but it forces hypotheses to confront data—cutting meeting time and respecting collaborators’ skepticism.
