prompt: |-
  After years of renting, my partner and I purchased our first house last spring on a quiet, tree-lined block that we chose partly for its stability and sense of community. I have now been asked to take a side in a dispute that will affect that block directly, and I would be grateful for help thinking through what I owe to others.

  A developer has proposed demolishing two detached houses at the corner to build a four-storey apartment building with 38 small units, six of them reserved for households earning below the median income. Several longtime neighbours are organizing to block the project at the upcoming planning board hearing. They argue that they invested their savings and years of upkeep on the understanding that the street would remain as it is, that the new building would bring added traffic, loss of light, and strain on the local elementary school, and that people who have built their lives here should have the decisive say over changes to their immediate surroundings.

  Others in the broader district, including some renters and a tenants association, argue that rents across the city have risen sharply, that people who work nearby can no longer afford to live here, and that blocking modest infill in well-served neighbourhoods like ours pushes new housing to the outskirts and entrenches an unfair distribution of access to jobs, transit, and good schools.

  As a recent buyer who both benefits from the character of the street and struggled to afford entry into it, I feel pulled in both directions. Should I join the opposition, support the project, or abstain? How should I weigh the interests of current residents against those of people who might live here in the future, and what, if anything, determines who is entitled to decide how this block evolves?
reasoning: |-
  Okay, let me unpack this user's situation. They're a new homeowner caught in a classic urban development dilemma - preserving neighborhood character versus addressing housing affordability. The emotional weight is palpable: they chose this street for its stability, yet acknowledge their own struggle to afford it. 

  The core tension seems to be between two valid perspectives. On one side, long-term residents fear change will disrupt the community they've invested in. Their arguments about traffic, schools and property values aren't NIMBYism - they're legitimate concerns about daily life impacts. On the other, the housing crisis argument feels morally urgent: denying this project might perpetuate exclusion. 

  What's interesting is how the user positions themselves - they're simultaneously beneficiary and critic of the status quo. That duality makes their stance fascinating. They're not asking "which side is right" but "what do I owe others," showing remarkable ethical awareness.

  The legal/philosophical layers deserve attention too. Beyond practical impacts, this touches on property rights versus community welfare, individual versus collective good. The "who decides" question is profound - should voice proportional to investment? Duration of residency? Or is it a civic duty to consider non-residents?

  I notice the proposal's design matters: six affordable units is meaningful but not transformative. The four-story scale might really alter the streetscape. Maybe the solution isn't binary - could there be middle ground? The user might influence compromises rather than just picking sides.

  Their struggle mirrors larger societal debates. How we answer "what do we owe strangers?" in housing policy shapes cities. That's why this feels heavy - it's not just about 38 units, but participating in systems of inclusion or exclusion.

  Perhaps most importantly, the user seems to want ethical clarity, not tactical advice. They're asking how to be a good community member while honoring their values. That's commendable - many would default to self-interest.
answer: |-
  This is a deeply thoughtful and ethically complex situation – you're grappling with fundamental questions about community, fairness, responsibility, and change. There's no single "right" answer, but here’s a framework to weigh your obligations and potential actions:

  **Breaking Down the Competing Values:**

  1.  **Stability & Investment Protection (Neighbors' Argument):**
      *   **Valid Concerns:** Long-term residents made significant financial and emotional investments based on existing zoning/character. Change brings tangible impacts (traffic, parking, shadows, school capacity). Their sense of community and quiet enjoyment is real and valuable.
      *   **Limitations:** Framing it as "decisive say" based solely on current residency risks freezing neighborhoods, preventing necessary adaptation, and prioritizing existing privilege. Cities are dynamic ecosystems.

  2.  **Housing Affordability & Access (Project Supporters' Argument):**
      *   **Valid Concerns:** The housing crisis is severe. Excluding new residents, especially lower/middle-income workers, exacerbates inequality and pushes sprawl. Well-served neighborhoods *should* absorb some growth. 38 units (with 6 affordable) is a meaningful contribution.
      *   **Limitations:** The project *will* change the block's character. Concerns about infrastructure strain (schools, traffic) need assessment, not dismissal. "Density at any cost" can also be problematic without thoughtful design.

  3.  **Your Position:**
      *   **Tension:** You *directly benefit* from the existing stability/character you value, yet you *understand the barrier* to entry because you just scaled it. Your investment is new but significant. Your perspective bridges both sides.

  **Key Questions for Your Decision:**

  1.  **Assess the Project Itself (Beyond "For/Against"):**
      *   **Design & Scale:** Is a 4-story building appropriate *at this corner*? Does its design respect the streetscape (setbacks, materials, massing)? Could it be scaled down slightly (e.g., 3 stories) or designed better to mitigate impacts?
      *   **Infrastructure Impact:** Have traffic, parking, sewer/water, and school capacity studies been done? Are the opponents' fears grounded in data or speculation? What mitigation is proposed (e.g., traffic calming, parking permits, school district planning)?
      *   **Affordability:** Is 6 units below median income sufficient? Is the mechanism robust? Does it genuinely help address the need?
      *   **Process:** Is the developer engaging with the community? Are they open to modifications?

  2.  **Weigh the Interests:**
      *   **Current Residents:** They have a legitimate interest in protecting their investment and quality of life. *Weight:* Significant, but not absolute veto power over all change.
      *   **Future Residents (Known & Unknown):** People who need housing *now* and those who will come later have an interest in access to opportunity, community, and stability too. Denying housing denies them that chance. *Weight:* Morally significant, often underrepresented.
      *   **The Broader Community/City:** Cities thrive on diversity and adaptability. Sprawl harms the environment and strains resources. Concentrating poverty on the outskirts is unjust. *Weight:* Significant societal interest.
      *   **Yourself:** You have a stake in your investment, quality of life, and desire to be a good neighbor. You also have newly acquired "insider" status with a recent outsider perspective.

  3.  **Who Should Decide?**
      *   **Not Solely Current Residents:** This leads to exclusion and stagnation. Cities belong to all citizens, present and future.
      *   **Not Solely the Market/Developers:** Profit motives don't always align with community well-being or long-term sustainability.
      *   **The Planning Board/City Council:** This is the designated forum, charged with weighing *all* these factors based on zoning, comprehensive plans, environmental reviews, and public input. They represent the *entire* city's interests.

  **Your Potential Actions & Their Ethics:**

  1.  **Join the Opposition (Conditionally):**
      *   **If:** You genuinely believe the project's *specific design* or *scale* is inappropriate and its negative impacts demonstrably outweigh the benefits after reviewing data, and you oppose it *on those merits*, not just "change."
      *   **Ethical Consideration:** Ensure your opposition isn't primarily about protecting property values at the cost of excluding others. Focus on *how* the change happens, not *that* it happens.
      *   **Action:** Advocate for project rejection *or* significant redesign/modifications.

  2.  **Support the Project (Conditionally):**
      *   **If:** You believe the housing need is paramount, the project's benefits outweigh its localized costs (especially with mitigation), and the design is acceptable (or can be improved).
      *   **Ethical Consideration:** Acknowledge the valid concerns of neighbors. Advocate for robust mitigation measures and design improvements where possible. Center the need for inclusive communities.
      *   **Action:** Speak in favor at the hearing, emphasizing the broader societal benefits and need for diverse housing.

  3.  **Advocate for a Middle Path/Compromise:**
      *   **This may be the strongest ethical stance:** Acknowledge both sets of concerns as valid.
      *   **Action:** Attend the hearing and advocate *not* for simple approval or rejection, but for the Planning Board to:
          *   Insist on rigorous impact studies and binding mitigation commitments (traffic, parking, schools).
          *   Push for design improvements to better fit the context (scale down? better setbacks? materials?).
          *   Explore increasing the number of affordable units if feasible.
          *   Ensure long-term management plans are in place.
      *   **Ethical Consideration:** This demonstrates respect for neighbors' concerns while recognizing the larger need for housing and evolution. It focuses on making change *better*, not stopping it entirely.

  4.  **Abstain/Listen:**
      *   **If:** You feel you lack sufficient information, haven't resolved your internal conflict, or believe your voice won't add significant value beyond the existing arguments.
      *   **Ethical Consideration:** Sometimes listening is the most responsible action. You can still submit written comments expressing your nuanced position or concerns for the record without taking a hard public stand.

  **What You Owe to Others:**

  *   **Honesty & Integrity:** Base your position on facts and values, not just self-interest or fear.
  *   **Respect:** Acknowledge the validity in *both* sides' core concerns. Listen actively.
  *   **Open-Mindedness:** Be willing to engage with data and consider modifications.
  *   **Civic Responsibility:** Participate thoughtfully in the process that shapes your community. Consider the city's long-term health, not just your immediate block.
  *   **Nuance:** Avoid simplistic "us vs. them" framing. This is a complex issue with legitimate perspectives on all sides.

  **Recommendation:**

  Given your unique position (recent buyer who struggled to enter), your ethical awareness, and the complexity, **advocating for a compromise/middle path at the hearing is likely the most balanced and constructive approach.** You can say:

  > *"As a recent homeowner who values the stability of this street but also understands the struggle to afford to live here, I see valid concerns on both sides. The need for more housing, especially affordable housing, is critical for our city. However, change must be managed thoughtfully to minimize disruption to existing residents and the character they value. I urge the Planning Board not to simply approve or reject this project, but to use its power to require rigorous impact studies, robust mitigation measures for traffic, parking, and schools, and design modifications to better integrate this building into our block. Let's find a way to welcome new neighbors and meet our housing needs without sacrificing the core qualities that make this community special."*

  This stance:

  *   Acknowledges your position.
  *   Validates both sets of concerns.
  *   Focuses on improving the outcome.
  *   Leverages the Planning Board's role.
  *   Aligns with your sense of owing consideration to both current neighbors and potential future residents.

  Ultimately, your decision must align with your conscience after carefully weighing the facts, the impacts, and the ethical principles involved. Good luck; this is the hard work of being part of a community.
