prompt: |-
  im in an epistomology seminar this term and our group is putting together the questions for a guest panelist who defends a Jamesian pragmatist ethics of belief — basically the view that when the evidence is balanced, you're allowed, maybe even required, to let your practical interests pick what to believe. Could you draft 6-8 questions that turn on the actual content of the position rather than having him restate it? I'd like at least one on whether his "genuine options" requirement (living, forced, momentous) does enough work to stop the view from collapsing into believe-anything-goes, one on the self-fulfilling belief problem (if willing a belief makes it come true, is it still a belief or just a hope, and how is James's "as if" move supposed to answer that), and one on Clifford's argument that knowledge is socially acquired and why the concession that settled science is off-limits is supposed to defuse it. For each, include a follow-up that presses the reply he's most likely to give.
