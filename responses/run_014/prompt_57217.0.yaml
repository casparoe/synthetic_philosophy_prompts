  We are going to design a referendum scenario that meets the specifications. The key is to have an expert analysis that, while improving each voter's individual competence, introduces correlations that harm the collective verdict.

  **Scenario: Municipal Water Bond Referendum**

  A California city proposes a bond measure to upgrade its water infrastructure. The project has two components: 
  1. Replacing aging pipes to reduce leakage (clearly beneficial, cost-effective).
  2. Building a new reservoir for drought resilience (beneficial only if future drought severity exceeds a threshold).

  The expert analysis (from a nonpartisan office like the Legislative Analyst's Office) provides:
  - A point estimate of the net present value (NPV) of the pipe replacement: +$50 million (high confidence).
  - A point estimate of the NPV of the reservoir: -$10 million (low confidence, because future drought projections are highly uncertain). 
  - The analysis notes that the reservoir's NPV is highly sensitive to the drought model. It includes an honest error bar: the 90% confidence interval for the reservoir's NPV is [-$30M, +$10M]. 
  - The total project NPV is estimated at +$40 million, but the uncertainty is dominated by the reservoir.

  The analysis is published in the ballot pamphlet. Voters are rational and update their beliefs based on this analysis.

  **Voter Beliefs and Competence**

  Before publication:
  - Voters have heterogeneous private information. Some have heard about the pipe leaks (favoring the bond) and others are worried about the reservoir's cost (opposing). 
  - Individual competence (probability of a correct vote) is 55% on average. This is because without the analysis, voters are slightly better than random but not well-informed.

  After publication:
  - The analysis makes every voter better informed. They now know:
    - The pipe replacement is a strong positive.
    - The reservoir is a gamble: negative on average but could be positive if droughts are severe.
  - The analysis provides a shared signal that the reservoir is risky. However, the error bar is wide and the point estimate is negative.
  - Voters must decide based on the total NPV. The bond is good if total NPV > 0. The expert estimate is +$40M, but the uncertainty (especially the reservoir) is large.

  After reading the analysis, every voter updates:
  - They now assign a higher probability that the reservoir is a bad idea (because of the negative point estimate).
  - However, the true state of the world is that the reservoir is actually beneficial (we stipulate this for the scenario). Why? Because in reality, the drought model used by the experts was too conservative. Unbeknownst to everyone, a more accurate model (which we, as scenario designers, know) would show the reservoir's NPV at +$20M, making the total NPV +$70M. Thus, the bond should pass.

  Effect on individual competence:
  - Before publication: 55% (average) chance of voting correctly (i.e., for the bond, since it is truly good).
  - After publication: Each voter becomes more certain that the reservoir is bad, so they become more likely to vote against the bond. But since the bond is actually good, this update is in the wrong direction. 
    - However, note that the analysis is unbiased and correct in expectation. The point estimate is -$10M for the reservoir, which is the mean of a distribution that includes the true +$20M (but with low probability). So the analysis is not wrong, just uncertain.
    - The individual competence after publication: Each voter now has a 45% chance of voting correctly (for the bond) and 55% for against. Why? Because the analysis shifts their belief toward thinking the total NPV is positive but close to zero (they see +$40M, but the reservoir uncertainty makes them discount it). However, the negative point estimate on the reservoir leads many to overweigh the risk. We assume that the update makes the median voter think the bond is slightly negative. So individual competence drops to 45% (worse than random).

  **The Condorcet Jury Theorem (JCT) Prediction**

  The naive JCT application:
  - JCT states that if each voter has independent and identical competence p>0.5, then as the number of voters increases, the probability of the correct outcome (majority vote) approaches 1.
  - Before publication: p=0.55, so the collective verdict should be correct with high probability (for a large electorate).
  - After publication: Each voter's competence drops to 0.45 (p<0.5). Then JCT predicts that the probability of the correct outcome (which requires a majority for the bond) approaches 0 as the electorate grows.

  But note: JCT assumes independence. The publication of the expert analysis breaks independence because all voters see the same signal. 

  **What Actually Happens**

  Before publication:
  - Voters have independent signals (based on their private information). The correlation of votes is low.
  - With p=0.55, the majority vote is very likely to be correct (for a large electorate).

  After publication:
  - The expert analysis is a common signal that makes votes highly correlated. Even though each voter's private signal is independent, the common signal dominates.
  - The common signal shifts the entire electorate toward voting against the bond. Since the common signal is somewhat negative (due to the reservoir point estimate) and the true state is positive (but the common signal is a draw from a distribution that is centered at the true state? Actually, the common signal is fixed: it's the published analysis which has a point estimate that is too low for the reservoir). 
  - The result: almost all voters update in the same direction (against the bond). The vote becomes nearly unanimous against the bond, which is the wrong outcome.

  **Why Independence Leaks Out**

  The key is that the expert analysis is a public signal that becomes part of every voter's evidence. This creates a common component in their votes. Even though the voters have independent private signals, the public signal is so influential that it swamps the private signals. The votes become highly correlated because they all condition on the same public signal.

  In the JCT, the independence assumption is violated because the votes are no longer independent conditional on the true state. The public signal induces a dependence.

  **Counterfactual: No Analysis Published**

  In the counterfactual, voters only have their private signals. With p=0.55 and independence, the majority vote is very likely to be correct (the bond passes). We know this outcome is better because we have stipulated the true state: the bond should pass (true total NPV is +$70M, well above zero). In the scenario with the analysis, the bond fails (wrong outcome).

  **The Single Feature Doing the Work**

  The critical feature is that the expert analysis provides a *shared point estimate* that is a noisy (but unbiased) estimate of a component of the project, and this noise happens to be in the direction that misleadingly suggests the project is worse than it truly is (even though the estimate is correct in expectation). The shared nature of the signal causes the votes to become correlated, and the particular draw of the noise in the public signal (which is fixed for all voters) pushes the entire electorate in the wrong direction.

  **Modifications**

  - If the analysis is disaggregated to the local level: Suppose the analysis is broken down by neighborhood, and each neighborhood gets a slightly different report (because the reservoir impact is localized). Then the public signal is not identical for everyone. This would reduce the correlation and might restore independence. The outcome would improve because the common noise is diversified.
  - If only part of the electorate receives it: Then the voters who receive it become correlated, but the others remain independent. The overall correlation is less, and the majority vote might be better.
  - If the office publishes the raw model: Voters could simulate their own draws from the model. Then they would have independent noise in their assessments. This would preserve independence and individual competence might be higher. The collective verdict would be better.

