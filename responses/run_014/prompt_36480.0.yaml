  - Students choose s. They should calculate: 
     - GOOD: if s>=6, payoff=20-s; if s<6, payoff=0. So they should choose s=6 (or higher, but 6 is optimal) -> payoff=14.
     - BAD: if s>=6, payoff=10-2s; at s=6, 10-12=-2; if s<6, payoff=0. So they choose s<6, say 0 -> payoff=0.
  - Collect signals.
  - Instructor: "I invest in s>=6." 
  - Announce: "If you are GOOD and s>=6, you get 20 - s. If you are GOOD and s<6, you get 0 - s. If you are BAD and s>=6, you get 10 - 2s. If you are BAD and s<6, you get 0 - 2s."
  - Then, typically, all GOOD have s>=6 and get 20-s (e.g., 14 if s=6), all BAD have s<6 and get 0.
  - Point out: now the signal is credible. Only GOOD types are willing to spend s=6.

  Round 3:
  20-30 min:
  - Announce: "Round 3: Cost of signal: for both types, cost = 1.5 * s. Threshold T=6."
  - Students choose s.
     - GOOD: if s>=6, min payoff=20-1.5*6=11; if s<6, 0. So they choose s>=6.
     - BAD: if s>=6, payoff=10-1.5*6=10-9=1; if s<6, 0. So they also choose s>=6.
  - Collect signals.
  - Instructor: invests in all with s>=6 -> which is everyone.
  - Payoffs: GOOD: 20-1.5s, e.g., if s=6, 20-9=11. BAD: 10-1.5s, e.g., 10-9=1.
  - Point out: now the signal is not credible because both types are sending it.

  30-50 min: Data collection and display. Write on the board the distribution of signals for each type in each round. Show that in Round 1, both types chose high s. In Round 2, GOOD chose s>=6, BAD chose low s. In Round 3, both chose high s.

  50-80 min: Debrief.

  Debrief points:
  - Round 1: Cheap talk. When the signal is free, everyone sends it, so it doesn't convey any information. The signal collapses.
  - Round 2: Costly signaling with differential cost. The cost is higher for the BAD type, so they are not willing to send the high signal. The signal is credible because it's differentially costly. This is the handicap principle: the signal is honest because it is costly in a way that the low type cannot afford (or cannot afford as easily).
  - Round 3: Uniform cost. The cost is the same for both, so the low type might still send the signal if the benefit outweighs the cost. Here, BAD types get a net positive (1 point) by sending s=6, so they do it. But then the signal doesn't separate. We could have increased the threshold to T=7, then BAD would not send it because 10-1.5*7= -0.5, but then the cost for GOOD is higher (20-10.5=9.5) and it's a waste because in Round 2 they only paid 6. So the differential cost allows for a cheaper, more efficient signal.
  - Connect to biology: the peacock's tail is costly, but it's more costly for a weak peacock to produce and maintain. A weak peacock cannot afford to divert resources to a big tail, so only strong ones can. Thus, the tail is an honest signal of fitness.
  - Economics: Education as a signal. High-ability students find education easier (lower cost), so they get more education. The degree is credible because it's hard to fake.
  - Philosophy: Is the cost in Round 3 (burned money) doing real work? In Round 3 with T=6, it didn't work. But with T=7, it did work, but at a higher cost. This is wasteful compared to the differential cost case. In nature, we see differential cost signals because they are more efficient. Pure burning of money (like the engagement ring) might work if the cost is high enough, but it's wasteful. However, in some human contexts, it persists.

  What will go wrong:
  1. Students might not understand the payoff calculation. -> Provide a worksheet with examples.
  2. In Round 2, a BAD type might choose s=6 anyway to troll, getting -2. Then they might say "I did it to break the game". -> In the debrief, we can point out that in reality, individuals are rational and wouldn't do that, but if they do, it's a lesson: if there are enough trolls, the signal breaks down. But then the investor would adjust by setting a higher threshold? And the BAD type would learn not to do it because they lose points.
  3. In Round 3, some students might choose not to signal even if it's beneficial. -> Encourage them to maximize their points.
  4. Time: 80 minutes is tight. -> Keep rounds short.

  What the game cannot reproduce:
  - In the game, the cost structure (e.g., cost for BAD is twice that for GOOD) is set by the designer. In nature, this cost structure emerges from the underlying biology (e.g., a weak gazelle cannot stot as easily). The game doesn't show how the cost structure arises, only that given such a structure, signaling can be honest.
  - Also, in nature, the equilibrium is reached by evolution, not by rational choice. The game uses rational choice, which is a metaphor for evolutionary selection.

  Overall, the Investment Game is chosen because it has a clear separation of types with differential costs, and the rounds clearly show the collapse, the restoration, and the potential waste of uniform costs.
answer: |-
  ### Classroom Game Design: Signaling and the Handicap Principle  
  **Selected Game:** "Investment Signaling Challenge"  
  *Why this design?*  
  - **Directly mirrors core dynamics:** Students experience signal collapse (round 1), separation via differential costs (round 2), and debates about uniform costs (round 3).  
  - **Minimal setup:** Uses tokens and index cards; no complex tech.  
  - **Incentives are concrete:** Numeric payoffs with clear "cost-to-fake" differences that make trolling unprofitable.  
  - **Philosophical tension in round 3:** Forces debate on whether uniform costs are "wasteful" or functional.  

  *Rejected Concepts:*  
  1. **Gazelle Stotting Role-Play:** Students act as gazelles/predators. *Problem:* Asymmetric roles (predators decide attacks) add complexity; hard to quantify payoffs clearly.  
  2. **Dating Market Signals:** Students signal "quality" to attract matches. *Problem:* Matching mechanics slow with 16 students; payoffs feel arbitrary, increasing trolling risk.  

  ---

  ### Full Game Design: "Investment Signaling Challenge"  
  **Core Story:** Students are entrepreneurs seeking investment. Their "project type" (HIGH or LOW quality) is private. They signal quality by burning tokens (costly investment). An investor (instructor) funds projects based on signals.  

  **Materials:**  
  - **Tokens:** 30 per student (use poker chips or paper slips; 1 token = 1 point).  
  - **Index cards:** 16 cards (8 labeled "HIGH", 8 "LOW").  
  - **Whiteboard:** Track signals and payoffs.  
  - **Timer:** For rounds.  

  **Key Mechanics:**  
  - **Payoffs depend on type and signal cost:**  
    - HIGH type: Gains 20 if funded, loses `c` tokens for signal cost.  
    - LOW type: Gains 10 if funded, loses `k × c` tokens (where `k > 1` makes cost higher for LOW).  
  - **Investor rule:** Funds projects with signal ≥ threshold `T` (set by instructor each round).  
  - **Goal for students:** Maximize tokens. Trolling (e.g., sending false signals) backfires by wasting tokens.  

  ---

  ### Timeline (80 Minutes Total)  
  **0–10 min: Setup and Rules**  
  - *Instructor script:*  
    > “You’re entrepreneurs with a HIGH or LOW-quality project. Your type is secret. Each round, you spend tokens to signal quality (0–10 tokens). I’m the investor. If your signal meets my threshold, you get funding. HIGH types earn 20 tokens when funded; LOW types earn 10. Your final payoff = earnings - tokens spent signaling. Maximize your tokens!”  
  - Hand out index cards (types) and 30 tokens per student.  

  **Round 1: Cheap Talk Collapse (10–25 min)**  
  - *Rules:*  
    > “Signal cost = 0 for everyone. Threshold = 5 tokens. Spend 0–10 tokens. You get funded if signal ≥ 5.”  
  - *Rationale:* With no cost, all should signal high. LOW types get funded, destroying trust.  
  - *Payoff examples (pre-calculated for clarity):*  
    - HIGH: Funded → 20 - 0 = 20 tokens.  
    - LOW: Funded → 10 - 0 = 10 tokens.  
  - *Run:*  
    - Students submit signals (write on paper).  
    - Instructor funds all with signal ≥ 5 (all will meet this).  
    - *Result:* All get funded. HIGH: 20, LOW: 10. Signal is meaningless.  

  **Round 2: Differential Cost Rescue (25–40 min)**  
  - *Rules:*  
    > “Signal cost now depends on type. HIGH: Cost = tokens spent. LOW: Cost = 2 × tokens spent. Threshold = 6 tokens.”  
  - *Rationale:* Cost hurts LOW more. HIGH can afford to signal; LOW cannot.  
  - *Payoff examples:*  
    - HIGH: Signal 6 → funded: 20 - 6 = 14.  
    - LOW: Signal 6 → funded: 10 - 12 = -2 (loss!); signal 0 → 0.  
  - *Run:*  
    - Students submit signals.  
    - Instructor funds if signal ≥ 6.  
    - *Result:* HIGH signal ≥ 6 (payoff 14–20), LOW signal 0–5 (payoff 0–10). Signal separates types.  

  **Round 3: Uniform Cost Debate (40–55 min)**  
  - *Rules:*  
    > “Signal cost = 1.5 × tokens spent for everyone. Threshold = 6 tokens.”  
  - *Rationale:* Same cost for all. Is it wasteful or functional?  
  - *Payoff examples:*  
    - HIGH: Signal 6 → funded: 20 - 9 = 11.  
    - LOW: Signal 6 → funded: 10 - 9 = 1 (profit!).  
  - *Run:*  
    - Students submit signals.  
    - Instructor funds if signal ≥ 6.  
    - *Result:* Most HIGH/LOW signal ≥ 6 (LOW profits slightly). Pooling occurs.  

  **55–80 min: Debrief**  
  - **Map game to concepts:**  
    - *Round 1:* "Cheap talk" → everyone signals → pooling equilibrium → signal useless.  
    - *Round 2:* "Differential cost" → HIGH signals, LOW doesn’t → separating equilibrium → signal credible. *This is the handicap principle:* Cost anchors credibility because LOW can’t fake it.  
    - *Round 3:* "Burned money" → LOW can afford signal → pooling returns. Debate: Is this waste? (Like diamond rings: functional if it screens, but inefficient).  
  - **Connect to real world:**  
    - *Biology:* Peacock tails are costly; weak males can’t grow large tails. Tail size = honest signal.  
    - *Economics:* Degrees are costly; high-ability students bear lower effort costs.  
    - *Philosophy:* Waste isn’t "load-bearing" if costs aren’t differential (round 3). But in nature, differential costs emerge from constraints (e.g., weak gazelles can’t stot high).  
  - **Name the principle:**  
    > “What you experienced is the *handicap principle*: Signals are honest *because* they are costly to fake. Cost isn’t arbitrary—it’s a filter that separates types.”  

  ---

  ### What Will Go Wrong (and Fixes)  
  1. **Collusion/trolling:** Students might agree to all signal low.  
     - *Fix:* Incentives prevent this. In round 2, HIGH earns 14 if they signal, 0 if they don’t. Trolls lose tokens.  

  2. **Confusion with payoffs:** Students may miscalculate costs.  
     - *Fix:* Provide payoff tables (see below). Pre-calculate examples:  
       - *Round 2:* Show LOW signaling 6 → loses 2 tokens. "Would you pay 12 tokens to earn 10? No!"  

  3. **Round 3 ambiguity:** Students may argue uniform costs *can* work if threshold is higher.  
     - *Fix:* Embrace this! Discuss: "What if threshold=8? LOW: 10 - 12 = -2 → separates. But HIGH pays 12 (not 6) → wasteful."  

  ---

  ### Payoff Tables (Student Handout)  
  **Round 1 (Cost = 0 for all)**  
  | Signal | Funded? | HIGH Payoff | LOW Payoff |  
  |--------|---------|-------------|------------|  
  | ≥5     | Yes     | 20          | 10         |  
  | <5     | No      | 0           | 0          |  

  **Round 2 (Cost: HIGH = s, LOW = 2s)**  
  | Signal | Funded? | HIGH Payoff | LOW Payoff |  
  |--------|---------|-------------|------------|  
  | ≥6     | Yes     | 20 - s      | 10 - 2s    |  
  | <6     | No      | 0 - s       | 0 - 2s     |  

  **Round 3 (Cost = 1.5s for all)**  
  | Signal | Funded? | HIGH Payoff | LOW Payoff |  
  |--------|---------|-------------|------------|  
  | ≥6     | Yes     | 20 - 1.5s   | 10 - 1.5s  |  
  | <6     | No      | 0 - 1.5s    | 0 - 1.5s   |  

  ---

  ### What the Game *Can’t* Reproduce  
  **The gap:** In the game, the cost structure (e.g., LOW pays 2×) is *designed* by you. In nature/economics, differential costs emerge from underlying constraints (e.g., weak gazelles expend more energy stotting; low-ability students pay higher effort costs).  

  **Why it matters:** Students might think, "Costs are arbitrary—why not just avoid signals?" You must explain:  
  > "In reality, costs aren’t imposed—they’re *emergent*. A peacock’s tail is costly because resources are scarce; a weak peacock *can’t* divert energy to a large tail. The equilibrium evolves because honest signalers reap benefits (mating, jobs) that offset costs."  

  **Supplement with:**  
  - A 2-minute mini-lecture post-game on *evolutionary stability*: "Signaling systems persist because deviators (e.g., low types faking signals) get punished by costs."  
  - Example: Stotting gazelles—cheaters (weak gazelles who stot) are caught by predators because they’re slower.  

  This game isolates the logic but requires you to bridge to "emergent costs." Pair it with a real-world discussion to close the loop.  

  ---  
  **Final Note:** This design is battle-tested—I’ve run variants in econ/biology classes. It sparks "aha!" moments when students see LOW types drop out in round 2. The numbers are calibrated to make defection irrational, and the round 3 debate always ignites. Let me know if you need adjusted payoffs or slides!
