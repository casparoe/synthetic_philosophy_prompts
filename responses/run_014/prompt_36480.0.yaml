  We are designing a classroom game to illustrate the handicap principle and costly signaling. The key idea is that signals are credible because they are costly, and the cost must be differentially burdensome (i.e., higher for low types than high types). We want students to experience:
  1. Round 1: Free signal -> everyone uses it -> signal becomes meaningless.
  2. Round 2: Differential cost signal -> separates types -> signal becomes meaningful.
  3. Round 3: Uniform cost (burned money) -> debate whether it works or is wasteful.

  Constraints: 16 students, 80 minutes, no real money, minimal materials, run by instructor and one TA. Must have concrete payoffs to avoid trolling.

  Brainstorming 3 concepts:

  Concept 1: Job Market Signaling (Spence-like)
  - Students are job applicants with either high or low ability (private info). They choose education level (signal). Employers observe education and set wages.
  - Round 1: Education is free -> everyone gets the same education -> employers can't distinguish -> same wage for all -> collapse.
  - Round 2: Education costs money (but high ability finds it cheaper) -> high ability gets more education -> employers pay more to educated -> separates.
  - Round 3: Education costs the same for everyone -> high ability still might get more because they can afford it? But if cost is same, then it might not separate? Or debate: if cost is same, then low ability might imitate if the wage premium is high enough? This might be messy for Round 3.

  Concept 2: Gazelle Stotting (Predator-Prey)
  - Half the students are gazelles (some strong, some weak) and half are predators (or one predator and the rest gazelles? But with 16, maybe 4 predators and 12 gazelles?).
  - Gazelles decide whether to stot (jump high) when a predator approaches. Stotting is a signal of strength.
  - Round 1: Stotting is free -> all gazelles stot -> predator ignores the signal and attacks randomly -> no benefit -> collapse.
  - Round 2: Stotting is costly (weak gazelles pay more to stot) -> only strong stot -> predator avoids stotting gazelles -> strong are safe, weak are attacked -> separation.
  - Round 3: Stotting costs the same for both -> then weak might still stot if the benefit of avoiding predation is high, but if cost is the same and the benefit is the same, then all would stot? Then it's pooling again? Or if the cost is so high that weak cannot afford, then it separates but at a high cost? This might work but the roles are asymmetric and the predator's behavior is critical. Also, it might be complex to run with multiple predators.

  Concept 3: Market for Dates (Mating Market)
  - Students are either high or low quality "partners" (private type). They send signals (e.g., gifts, displays) to attract a match. The other students are "choosers".
  - Round 1: Signal is free -> everyone sends a big gift -> choosers cannot tell -> random matching -> no benefit for high quality -> collapse.
  - Round 2: Signal costs points, and the cost is higher for low quality (e.g., high quality has more points so it's cheaper for them) -> high quality sends signal, low doesn't -> choosers pick the signaling ones -> high quality gets matched and paid.
  - Round 3: Signal costs the same for both -> then if the cost is the same, low quality might still send if the benefit is high? Or if the cost is high enough that low quality cannot afford, then it separates, but the cost is the same for both? This is similar to the job market.

