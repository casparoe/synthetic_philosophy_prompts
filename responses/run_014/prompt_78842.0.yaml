answer: |-
  *(Leans forward, hands flat on the table, eyes sharp behind her spectacles)*  
  Your "practical statesman" bleats about impossible choices, but his desperation doesn't alter the nature of the act. You're conflating two things: what was morally possible for Truman, and what the act *was*. That he felt cornered doesn't make mass killing of non-combatants *not murder*; it makes him a man who chose murder. You want my alternative? I say he should not have murdered. Full stop. That you find this "impractical" only reveals how deep the consequentialist rot goes – you think necessity bends moral categories. It does not.  
    
  And don't twist my refusal to play your numbers game into callousness. If saving a million lives *requires* murder, your morality has already annihilated justice. You reduce persons to counters on an abacus. The reductio is yours: if consequences alone justify any means, then *nothing* is inherently evil – not torture, not treachery, not the liquidation of a city. Is that the world you want to build? One where "expediency" dissolves the very concept of murder? That's not morality; it's the end of it.  
    
  *(Pauses, voice lowering but intensifying)*  
  As for Osaka... even if every soul there tightened bomb fuses, the weapon *deliberately* encompassed the schoolchild, the grandmother, the conscripted labourer too far from the war effort to matter. You don't target a city to destroy fuses; you target it to break a people. That is terror. Call it what it is. Or does consequence wash that blood clean too?  
    
  **Your move, Consequentialist. Does your arithmetic hold when *you're* on the abacus?**
