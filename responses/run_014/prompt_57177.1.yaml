prompt: |-
  Six weeks ago I became quality manager at a small food manufacturer — about 30 of us, one line, ready meals for a couple of retailers. I'm the one who signs the release certificate for each batch, a couple a week, sometimes same-day with a lorry sitting on the yard. The stakes swing about wildly: undeclared allergen cross-contact could put someone in hospital, a slightly-out net weight is basically nothing at all.

  I've been reading around about pragmatic encroachment — roughly, that whether you know something can depend on what turns on being right — and also epistemic contextualism, which I think is a different claim about the word 'knows' rather than about knowledge itself. I honestly can't tell which of them, if either, is any use to me.

  Could you write a decision procedure my deputy and I could actually run on a release decision? The questions to ask in order, what counts as a settled answer to each, how the stakes get into the threshold without the threshold collapsing into 'whatever feels safe today', what to do when more evidence is available but only by delaying the batch, and where the procedure stops and hands the call to me or to the technical director because it's a question of values rather than facts. I'd especially like it to say which of the two ideas is doing any work in it and what happened to the other one — whether you dropped it, or whether it changes how I *talk* about a decision afterwards (incident reports, audits, a journalist ringing up) as opposed to how I make it. And flag the steps that are really just judgement in a procedural costume; I dont want false comfort, and no reading lists or references.

  Then run it on three cases: (1) supplier's certificate says the ingredient is allergen-free, but the certificate is generic and two years old; (2) a batch that failed one of three replicate listeria tests, the other two clean; (3) a purely cosmetic labelling error that will annoy the retailer and harm nobody. In at least one of those I want it to land somewhere I won't like — if it just tells me to hold everything, I'll know it's useless.

  Please write the whole thing in British English.
reasoning: |-
  Okay, the user is a quality manager at a small food manufacturer handling batch releases. They need a practical decision procedure incorporating pragmatic encroachment and epistemic contextualism. Let me start by understanding their core needs.

  First, they deal with high-stakes decisions where mistakes could mean health risks or minor issues like net weight differences. They mentioned pragmatic encroachment (knowledge depends on stakes) and epistemic contextualism (context affects the meaning of "knows"). They want a procedure that uses these concepts without being overly theoretical. 

  Key requirements: a step-by-step process for batch release, clear thresholds influenced by stakes but not arbitrary, handling evidence delays, and distinguishing factual vs. value judgments. They also want examples where the outcome might be uncomfortable to test the procedure's practicality.

  Breaking down the decision procedure. Start with initial checks to avoid wasting time on obvious issues. Then evidence assessment—what's available and its reliability. Stakes evaluation is crucial here; higher stakes mean needing more evidence. Pragmatic encroachment fits here because the stakes raise the evidence threshold. 

  Epistemic contextualism comes into play when justifying the decision later. The word "know" in reports might be used differently based on audience. For example, telling a regulator "we knew it was safe" requires higher standards than internal communication. 

  The procedure must have explicit handoff points where judgment overrules the process. Flagging these steps prevents false confidence. Also, handling delayed evidence—if waiting is feasible without significant cost, do it; otherwise, decide with current info.

  Now the test cases. Case 1: Supplier's old certificate. Stakes are high (allergen risk), so evidence is insufficient despite the certificate. Outcome: hold the batch. The user might not like this, but it's necessary for safety. 

  Case 2: Listeria test with one positive. High stakes again require more evidence. Retesting is needed, causing delay. Another tough call, but justified. 

  Case 3: Cosmetic error. Low stakes, so release with a corrective action. Shows the procedure isn't overly cautious. 

  Need to ensure the examples demonstrate both acceptance and reluctance, proving the procedure's balance. Also, clarify which philosophical concept applies where—pragmatic encroachment during decision-making, contextualism in communication. Highlighting judgment points maintains transparency about subjectivity.
answer: |-
  Here’s a practical decision procedure for batch release decisions, grounded in your philosophical concerns but stripped of jargon. It explicitly uses **pragmatic encroachment** to set evidence thresholds based on stakes and **epistemic contextualism** to frame how you *justify* decisions afterwards. Contextualism doesn’t change the *making* of the decision, only how you describe "knowing" in different settings (e.g., audit vs. internal chat).

  ---

  **Batch Release Decision Procedure (For Deputy & Quality Manager)**

  **Core Principle:** The evidence required to *know* a batch is safe/acceptable **increases** as the potential harm of being wrong increases (Pragmatic Encroachment). What counts as "enough" evidence isn't fixed; it shifts with the stakes.

  **Procedure Steps (Run in Order):**

  1.  **Initial Sanity Check:**
      *   *Question:* Are there any *blatant, undisputed* failures against specification (e.g., missing label, critical temperature breach, *confirmed* pathogen)?
      *   *Settled Answer:* YES = **HOLD BATCH.** (Stop here). NO = Proceed to Step 2.
      *   *Judgement Flag:* Defining "blatant, undisputed" is judgement. Err on the side of caution if unsure.

  2.  **Assess Evidence Quality & Completeness:**
      *   *Question:* What evidence *do we actually have* to support release? (Certs, test reports, in-process checks, visual inspection logs, supplier info). Is it complete, current, reliable, and directly relevant to *this batch*?
      *   *Settled Answer:* List the evidence concretely. Flag any gaps, doubts, or anomalies (e.g., old certs, single failed test). Proceed to Step 3.

  3.  **Evaluate Stakes:**
      *   *Question:* What are the *realistic potential consequences* if we release this batch and are *wrong* about its acceptability? Consider:
          *   **Safety Harm:** Illness, injury, allergy, death? (Highest Stakes)
          *   **Regulatory/Legal Harm:** Recall, fine, prosecution, delisting?
          *   **Commercial Harm:** Customer complaint, loss of business, reputational damage?
          *   **Trivial Harm:** Minor annoyance, no real impact? (Lowest Stakes)
      *   *Settled Answer:* Categorise the stakes for *this specific issue* as **HIGH** (Safety/Legal), **MEDIUM** (Significant Commercial), or **LOW** (Trivial/Commercial Nuisance). Proceed to Step 4.

  4.  **Determine Evidence Threshold (Pragmatic Encroachment Applied):**
      *   *Question:* Given the Stakes (Step 3), is the *quality and weight* of the Evidence (Step 2) **sufficient** to justify release?
      *   *Decision Rules:*
          *   **HIGH Stakes:** Evidence must be **robust, direct, and highly reliable**. Any significant doubt, gap, or anomaly **fails** the threshold. *Expectation:* Near certainty is required. Missing certs, conflicting tests, or unreliable data = HOLD.
          *   **MEDIUM Stakes:** Evidence must be **good and credible**. Minor gaps *might* be acceptable if mitigated or judged very low risk. *Expectation:* High confidence required. Significant doubts = HOLD.
          *   **LOW Stakes:** Evidence must be **reasonable and plausible**. Minor gaps or purely administrative errors unlikely to cause harm *can* be accepted with a corrective action plan. *Expectation:* Moderate confidence suffices. Clear evidence of *any* harm = HOLD.
      *   *Settled Answer:* YES (Meets Threshold) = Propose RELEASE. NO (Fails Threshold) = Propose HOLD. Proceed to Step 5.
      *   **Judgement Flag:** This is the **core judgement call**. The rules prevent "whatever feels safe" by *forcing* explicit stake assessment first and linking it directly to evidence standards. You must *articulate why* the evidence meets/fails the threshold for *these* stakes.

  5.  **Consider Further Evidence & Delay:**
      *   *Question:* Is there readily available, *decisive* evidence we could get quickly (e.g., retest a swab, ring supplier for confirmation, check a different sample) that would *definitively* resolve the uncertainty *without causing disproportionate harm* (e.g., lorry demurrage costs < risk of release)?
      *   *Settled Answer:* YES = **HOLD TEMPORARILY** to gather evidence. Set a strict deadline. NO OR DELAY DISPROPORTIONATE = Proceed to Step 6 with the current decision (Release or Hold). *Judgement Flag:* Weighing risk vs. cost of delay is judgement.

  6.  **Values Handoff:**
      *   *Question:* Does the proposed decision (Release/Hold) involve a fundamental conflict between risk tolerance, ethical obligations, or commercial survival that goes *beyond* assessing facts and stakes? (e.g., Releasing a batch with a *very small*, unquantifiable risk to meet a critical customer order).
      *   *Settled Answer:* NO = **IMPLEMENT DECISION** (Sign Release Cert or Issue Hold Notice). YES = **ESCALATE** to Quality Manager (or Technical Director if QM involved in Step 4 judgement) for final decision based on company values/risk appetite. *Judgement Flag:* Recognising a "values conflict" is inherently judgemental.

  ---

  **Running the Cases:**

  **Case 1: Supplier's certificate says allergen-free, but generic and two years old.**
  *   **Step 1:** No blatant failure. Proceed.
  *   **Step 2:** Evidence: **Generic 2-year-old certificate.** *Gaps:* Not batch-specific, potentially outdated (supplier process/sourcing may have changed). Reliability **Low** for *this batch*.
  *   **Step 3:** **Stakes = HIGH** (Undeclared allergen cross-contact → potential anaphylaxis/hospitalisation).
  *   **Step 4:** **Threshold = HIGH** (Requires robust, direct evidence). *Decision:* **FAIL.** Generic old cert is insufficient evidence for HIGH stakes allergen risk. Propose **HOLD.**
  *   **Step 5:** Further evidence? Yes - Request batch-specific certificate/CoA from supplier urgently. If supplier confirms *current* process unchanged *and* provides recent audit report *or* agrees to expedite specific testing *and* delay is acceptable? *Maybe* proceed if evidence becomes robust. Otherwise, Hold. *(You won't like this - lorry waits)*.
  *   **Step 6:** Unlikely to need Values Handoff unless commercial pressure is extreme. **Decision: HOLD** pending better evidence.

  **Case 2: Batch failed one of three replicate listeria tests, other two clean.**
  *   **Step 1:** No blatant failure. Proceed.
  *   **Step 2:** Evidence: **Conflicting test results (1 pos / 2 neg).** *Anomaly:* Contradiction. Reliability **Uncertain** (Was it lab error? True low-level contamination? Poor sampling?).
  *   **Step 3:** **Stakes = HIGH** (Listeria monocytogenes → severe illness/death, recall, prosecution).
  *   **Step 4:** **Threshold = HIGH** (Requires robust, unambiguous evidence). *Decision:* **FAIL.** Conflicting results create significant doubt. Propose **HOLD.**
  *   **Step 5:** Further evidence? **Crucially available:** Immediate retesting of the same sample or new samples is standard and decisive. Delay (1-2 days) is almost always proportionate to HIGH stakes risk. **HOLD TEMPORARILY** for urgent retest.
  *   **Step 6:** Unlikely unless retest is impossible/delayed excessively. **Decision: HOLD** for retest. *(You won't like the delay, but it's necessary)*.

  **Case 3: Purely cosmetic labelling error (e.g., typo in marketing copy, wrong shade of blue on logo) that will annoy retailer and harm nobody.**
  *   **Step 1:** Blatant error against spec? Technically yes, but proceed to assess stakes (trivial harm).
  *   **Step 2:** Evidence: **Clear visual confirmation of the error.** Reliability **High**.
  *   **Step 3:** **Stakes = LOW** (No safety risk, minor commercial nuisance - retailer complaint, possible minor chargeback).
  *   **Step 4:** **Threshold = LOW** (Requires reasonable evidence). *Decision:* **PASS.** Evidence is clear. Propose **RELEASE.** BUT note it's non-compliant and requires corrective action (e.g., notify retailer, reprint labels for next batch).
  *   **Step 5:** Further evidence? Unnecessary. Error is confirmed and harmless.
  *   **Step 6:** Values Handoff? Only if releasing fundamentally breaches a core company value (e.g., "zero tolerance for *any* spec deviation") regardless of harm. Otherwise, **Decision: RELEASE** with corrective action. *(You'll like this pragmatic outcome)*.

  ---

  **What Happened to the Philosophy?**

  *   **Pragmatic Encroachment (PE):** This is the **workhorse** of the procedure. It's directly implemented in **Step 3 (Stakes)** and **Step 4 (Threshold)**. PE explicitly determines *how much and what kind* of evidence you need to act ("know" for practical purposes). High stakes = higher evidence bar.
  *   **Epistemic Contextualism (EC):** This **isn't used to make the decision** itself. Its role comes *afterwards* in how you *describe* your knowledge in different contexts:
      *   **Incident Report/Audit/Journalist (High-Stakes Context):** "Based on rigorous assessment of the available evidence *against the high potential risks*, we determined there was insufficient justification to release the batch at that time. We did not have conclusive knowledge of safety." (Uses a high standard for "knows").
      *   **Internal Chat/Justifying LOW Stakes Decision (Lower-Stakes Context):** "We knew the label typo was purely cosmetic and posed no risk, so we released it while fixing the root cause." (Uses a lower, pragmatic standard for "knows").
      *   EC explains why the *word* "know" flexes depending on who's asking and why. The *decision* was made using PE, but how you *talk* about knowing changes with the conversational context.

  **Key Judgement Flags Recap:**
  1.  Step 1: Defining "blatant, undisputed".
  2.  Step 2: Assessing evidence *reliability* (beyond mere existence).
  3.  Step 4: Deciding if evidence *meets the threshold* for the assessed stakes (The **Core Judgement**).
  4.  Step 5: Weighing risk of release vs. cost of delay.
  5.  Step 6: Recognising a "values conflict" needing escalation.

  This procedure forces structured, stakes-aware thinking. It won't remove tough calls or guarantee comfort, but it prevents stakes from being ignored and provides an auditable rationale. Use it, refine it based on experience, and trust the escalation step when pure judgement on values is needed.
