answer: |-
  ### Pramāṇa Decision Tree Handout  
  *Root Commitment:* Some beliefs amount to knowledge (pramā), and not all knowledge originates from sensory perception. All paths accept **perception (pratyakṣa)** and **inference (anumāna)** as valid means.  

  ---

  #### **Decision Tree**  
  1. **Testimony (śabda):**  
     When a trustworthy speaker (āpta) says "P," do you know P *directly* from their words, or must you *infer* P by reasoning about their reliability?  
     - **Direct knowledge →** Go to 2.  
     - **Requires inference →** Go to 2 (śabda reducible to anumāna).  

  2. **Postulation (arthāpatti):**  
     Can Devadatta’s nighttime eating (despite daytime fasting and being stout) be known through a *unique process of resolving inconsistency*, or is it merely a disguised inference?  
     - **Unique process →** Go to 3.  
     - **Disguised inference →** Go to 3 (arthāpatti reducible to anumāna).  

  3. **Non-Perception (anupalabdhi):**  
     Is knowing "the pot is absent" a *distinct means* (apprehending absence itself), or just *perception* of the pot’s non-existence (e.g., seeing bare ground)?  
     - **Distinct means →** Go to 4.  
     - **Perception alone →** Go to 4 (anupalabdhi reducible to pratyakṣa).  

  4. **Comparison (upamāna):**  
     Does the forest-dweller recognizing a *gavaya* (after hearing it resembles a cow) use a *distinct faculty*, or is it *perception plus memory*?  
     - **Distinct faculty →** Upamāna independent.  
     - **Perception + memory →** Upamāna reducible.  

  ---

  #### **Leaf Nodes: Accepted Pramāṇa Sets**  
  *Each leaf lists: accepted pramāṇas, classical school(s), and one awkward consequence.*  

  | **Leaf Path** | **Pramāṇa Set**                           | **School**                          | **Awkward Consequence**                                                                 |
  |---------------|-------------------------------------------|-------------------------------------|-----------------------------------------------------------------------------------------|
  | Yes, Yes, Yes, Yes | Pratyakṣa, Anumāna, Śabda, Arthāpatti, Anupalabdhi, Upamāna | Mīmāṃsā (Kumārila), Advaita Vedānta | Defending all six independences risks unnecessary complexity; opponents see reducibility everywhere. |
  | Yes, Yes, Yes, No  | Pratyakṣa, Anumāna, Śabda, Arthāpatti, Anupalabdhi         | *(Unoccupied)*                      | *(See "Unoccupied Combinations" below)*                                                 |
  | Yes, Yes, No, Yes  | Pratyakṣa, Anumāna, Śabda, Arthāpatti, Upamāna             | Mīmāṃsā (Prabhākara)                | Absences (e.g., "no pot here") must be explained without anupalabdhi, straining perception’s scope. |
  | Yes, Yes, No, No   | Pratyakṣa, Anumāna, Śabda, Arthāpatti                      | *(Unoccupied)*                      | *(See "Unoccupied Combinations" below)*                                                 |
  | Yes, No, Yes, Yes  | Pratyakṣa, Anumāna, Śabda, Anupalabdhi, Upamāna            | *(Unoccupied)*                      | *(See "Unoccupied Combinations" below)*                                                 |
  | Yes, No, Yes, No   | Pratyakṣa, Anumāna, Śabda, Anupalabdhi                     | *(Unoccupied)*                      | *(See "Unoccupied Combinations" below)*                                                 |
  | **Yes, No, No, Yes** | Pratyakṣa, Anumāna, Śabda, Upamāna                       | Nyāya                               | Postulation (e.g., Devadatta’s eating) must be squeezed into inference, defying its intuitive immediacy. |
  | **Yes, No, No, No**  | Pratyakṣa, Anumāna, Śabda                                | Sāṃkhya, Yoga                       | Explaining comparison (e.g., *gavaya*) as "perception + memory" struggles with novel recognition. |
  | No, Yes, Yes, Yes  | Pratyakṣa, Anumāna, Arthāpatti, Anupalabdhi, Upamāna      | *(Unoccupied)*                      | *(See "Unoccupied Combinations" below)*                                                 |
  | No, Yes, Yes, No   | Pratyakṣa, Anumāna, Arthāpatti, Anupalabdhi               | *(Unoccupied)*                      | *(See "Unoccupied Combinations" below)*                                                 |
  | No, Yes, No, Yes   | Pratyakṣa, Anumāna, Arthāpatti, Upamāna                   | *(Unoccupied)*                      | *(See "Unoccupied Combinations" below)*                                                 |
  | No, Yes, No, No    | Pratyakṣa, Anumāna, Arthāpatti                           | *(Unoccupied)*                      | *(See "Unoccupied Combinations" below)*                                                 |
  | No, No, Yes, Yes   | Pratyakṣa, Anumāna, Anupalabdhi, Upamāna                  | *(Unoccupied)*                      | *(See "Unoccupied Combinations" below)*                                                 |
  | No, No, Yes, No    | Pratyakṣa, Anumāna, Anupalabdhi                           | *(Unoccupied)*                      | *(See "Unoccupied Combinations" below)*                                                 |
  | No, No, No, Yes    | Pratyakṣa, Anumāna, Upamāna                              | *(Unoccupied)*                      | *(See "Unoccupied Combinations" below)*                                                 |
  | **No, No, No, No**   | Pratyakṣa, Anumāna                                      | Buddhism, Vaiśeṣika                 | Reducing testimony (e.g., Vedic injunctions) to inference feels artificial in practice. |

  ---

  #### **Unoccupied Combinations**  
  *11 of 16 leaves lack classical schools. Reasons for absence:*  

  | **Combination**          | **Reason for Absence**                                                                                               |
  |--------------------------|----------------------------------------------------------------------------------------------------------------------|
  | Yes, Yes, Yes, No        | **Unattractive**: Accepting anupalabdhi but rejecting upamāna ignores their shared role in learning (words/absences). |
  | Yes, Yes, No, No         | **Unattractive**: Rejecting upamāna while keeping arthāpatti undermines Mīmāṃsā’s goal of Vedic exegesis (needs both). |
  | Yes, No, Yes, Yes        | **Incoherent**: Anupalabdhi and arthāpatti share a "gap-filling" logic; accepting one without the other is unstable. |
  | Yes, No, Yes, No         | **Unattractive**: Anupalabdhi without arthāpatti is unmotivated; schools defending absences (e.g., Kumārila) take both. |
  | No, Yes, Yes, Yes        | **Unattractive**: Accepting arthāpatti/anupalabdhi without śabda is pointless for Vedic schools (core texts need śabda). |
  | No, Yes, Yes, No         | **Unattractive**: Non-Vedic schools (e.g., Buddhism) reject arthāpatti; Vedic schools need śabda to anchor it.       |
  | No, Yes, No, Yes         | **Unattractive**: Arthāpatti without śabda lacks application (no Vedic paradoxes to resolve).                      |
  | No, Yes, No, No          | **Unattractive**: Isolating arthāpatti ignores its dependency on testimony for context.                           |
  | No, No, Yes, Yes         | **Unattractive**: Anupalabdhi/upamāna without śabda is unmotivated; non-Vedic schools reject them.                 |
  | No, No, Yes, No          | **Unattractive**: Anupalabdhi alone is useless without śabda’s authority (e.g., ritual absences).                  |
  | No, No, No, Yes          | **Unattractive**: Upamāna without śabda has no clear purpose (e.g., *gavaya* example relies on testimony).         |

  ---

  #### **Indistinguishable Leaves**  
  The tree **cannot separate Buddhism and Vaiśeṣika** at leaf **No, No, No, No**. Both reduce all non-perceptual pramāṇas to inference and perception, despite divergent metaphysics (e.g., Vaiśeṣika’s realism vs. Buddhism’s momentariness).  

  ---  
  *Key: The tree isolates positions via reducibility disputes, not doctrinal labels. Unoccupied leaves reflect historical/philosophical constraints, not logical necessity.*
