              Reason: Accepts śabda and arthāpatti but rejects anupalabdhi and upamāna. But why reject upamāna if you are accepting arthāpatti? The Prabhākara Mīmāṃsā accepts upamāna and arthāpatti but rejects anupalabdhi. They do not reject upamāna. And Kumārila accepts both. So this combination is not found.

          (Y, Y, Y, N): 
              Reason: Accepts all except upamāna. But the schools that accept the others (like Kumārila) also accept upamāna.

     We can summarize the reasons:

          - Combinations that accept arthāpatti and/or anupalabdhi without śabda are unattractive because these pramāṇas are primarily useful in the context of Vedic interpretation, which requires śabda.

          - Combinations that accept anupalabdhi without arthāpatti (or vice versa) are not found because the arguments for their independence are similar and the schools that accept one tend to accept the other (or reject both).

          - Combinations that reject śabda but accept upamāna are unattractive because upamāna is often used in the context of learning words (which is tied to testimony).

          - Some combinations might be coherent but simply not chosen by any historical school (unexplored).

     We'll assign:

          (N, Y, N, N), (N, Y, N, Y), (N, Y, Y, N), (N, Y, Y, Y): Unattractive (without śabda, the motivation for arthāpatti and anupalabdhi is weak).

          (N, N, Y, N), (N, N, Y, Y): Unattractive (without śabda, the motivation for anupalabdhi is weak).

          (N, N, N, Y): Unattractive (without śabda, the motivation for upamāna is weak).

          (Y, N, Y, N), (Y, N, Y, Y): Coherent? But not chosen. However, note that the arguments for anupalabdhi and arthāpatti are linked. So it might be that independence of one without the other is incoherent? Or at least, the schools that considered them found reasons to treat them together. We can say: unattractive given the arguments linking arthāpatti and anupalabdhi in the classical debates.

          (Y, Y, N, N): Unattractive because if you accept śabda and arthāpatti, you are likely to be in a school that also values upamāna (for learning new words in the Vedic context) and anupalabdhi (for knowing absences in ritual). But note Prabhākara rejects anupalabdhi, so that part is acceptable. What they do not do is reject upamāna. So why reject upamāna? It might be coherent, but historically, the schools that accepted śabda and arthāpatti also accepted upamāna. So: unattractive.

          (Y, Y, Y, N): Unattractive because upamāna is useful in the same contexts as the others.

     However, note that (Y, Y, N, N) and (Y, Y, Y, N) are missing upamāna. But Prabhākara and Kumārila both accept upamāna. So we can say that in the Vedic schools, upamāna is considered important for learning the meaning of new words (like in the gavaya example) which is essential for Vedic interpretation.

     Therefore, we mark:

          (N, Y, N, N), (N, Y, N, Y), (N, Y, Y, N), (N, Y, Y, Y): unattractive
          (N, N, Y, N), (N, N, Y, Y): unattractive
          (N, N, N, Y): unattractive
          (Y, N, Y, N), (Y, N, Y, Y): unattractive (given the linkage between arthāpatti and anupalabdhi in the classical schools)
          (Y, Y, N, N): unattractive (because it rejects upamāna which is useful for Vedic interpretation)
          (Y, Y, Y, N): unattractive (same reason)

     But note: (Y, Y, N, N) and (Y, Y, Y, N) are also missing upamāna. So both are marked as unattractive.

     Now, what about (Y, N, N, Y) is already occupied by Nyāya. But note: we have one leaf that we haven't assigned? We have 16 leaves and we assigned 5 leaves (with 5 combinations) and then 11 unoccupied. We have listed 11 unoccupied. But note that we have:

          (Y, Y, N, Y) is occupied by Prabhākara -> but that is already in our occupied list? 

     So we are done.

     Finally, we note that the tree cannot separate Buddhism and Vaiśeṣika at leaf (N, N, N, N).

     We write the handout accordingly.

     We structure the handout:

          Root: We accept that there is knowledge and that not all knowledge comes through the senses. Therefore, we accept at least perception (pratyakṣa) and inference (anumāna).

          Then we ask four questions:

          Q1: Testimony (śabda): When we learn something from a trustworthy speaker, is the knowledge gained directly from the words (without needing to independently infer the speaker's reliability and intention)? 
              Yes -> go to Q2 (śabda independent)
              No -> śabda is reduced to inference -> go to Q2 (without śabda)

          Q2: Postulation (arthāpatti): In the case of the stout man who does not eat during the day, is the knowledge that he eats at night a distinct kind of reasoning (postulation) or simply inference? 
              Yes (distinct) -> arthāpatti is independent
              No (reducible to inference) -> arthāpatti not added

          Q3: Non-perception (anupalabdhi): When we know that a pot is absent from the ground, is this a distinct means of knowledge (non-perception) or simply perception? 
              Yes (distinct) -> anupalabdhi independent
              No (reducible to perception) -> not added

          Q4: Comparison (upamāna): When the forest-dweller recognizes a gavaya by its resemblance to a cow, is this a distinct means of knowledge or simply perception plus memory? 
              Yes (distinct) -> upamāna independent
              No (reducible) -> not added

          Then we have the leaves.

     We write the leaves as:

          Leaf 1: (Yes, No, No, Yes) 
              Pramāṇas: pratyakṣa, anumāna, śabda, upamāna.
              School: Nyāya.
              Awkward consequence: Must explain why postulation (which seems distinct) is reducible to inference, and why absence is known by perception alone.

          Leaf 2: (Yes, No, No, No)
              Pramāṇas: pratyakṣa, anumāna, śabda.
              School: Sāṃkhya and Yoga.
              Awkward consequence: Must explain how comparison, postulation, and non-perception are reducible to the accepted three.

          Leaf 3: (No, No, No, No)
              Pramāṇas: pratyakṣa, anumāna.
              School: Buddhism and Vaiśeṣika. [Note: We cannot separate these two with this tree.]
              Awkward consequence: Must reduce testimony, which seems direct, to inference; and similarly reduce the others.

          Leaf 4: (Yes, Yes, No, Yes)
              Pramāṇas: pratyakṣa, anumāna, śabda, arthāpatti, upamāna.
              School: Mīmāṃsā (Prabhākara).
              Awkward consequence: Must explain how we know absences without a separate pramāṇa.

          Leaf 5: (Yes, Yes, Yes, Yes)
              Pramāṇas: all six.
              School: Mīmāṃsā (Kumārila) and Advaita Vedānta.
              Awkward consequence: Must defend the independence of each pramāṇa, leading to a proliferation that some find unnecessary.

