prompt: |-
  I've been going down a rabbit hole on the Twin Earth thing ever since I heard about it on a podcast, and there's something bugging me that I can't shake. The way I understand it, there's this hypothetical planet exactly like ours except the lakes and rain are made of some other stuff, XYZ, instead of H2O, and the people there call it water and use it for everything we use water for — so on the inside they're identical to us, but the guy who thought it up (Putnam?) says their word and our word mean different things, because meaning is fixed by what the stuff out in the world actually is, not by what's in anybody's head. But if that's true, doesn't it follow that nobody on Earth knew what they meant by "water" until chemistry discovered H2O? Like a farmer in 1650 says the water's cold, and apparently he was talking about a chemical substance he'd never heard of and couldn't identify in a lab if his life depended on it — he was correct about what he meant but couldnt possibly have known it. So doesn't that make arguing about the meanings of words basically pointless, since the answer is never in the room with the people arguing?

  I ask because my roommate and I have this ongoing fight about whether the drink we buy counts as juice — it's like 5% juice and the rest is water and sugar. I used to think we were arguing about what juice really means, but after the Twin Earth thing I figured, ok, the answer isn't in either of our heads, it's fixed by whatever's actually in the bottle, so one of us is right and neither of us can know which without a lab test. Except juice isn't water, is it? There's no chemical structure of juice the way there is of water, so what fact out there in the world could possibly settle our argument? So now I'm confused on two levels: does the Twin Earth argument only work for the chemistry-type words, and if so, who decides which words count as that type — and for all the other words (juice, sport, video game, whatever), does the meaning go back to being in our heads after all, meaning my roommate and I literally mean different things and have been talking past each other this whole time?

  Sorry if this is a dumb question but it's been keeping me up at night. Basically what I want to know is: did this thought experiment prove that dictionary-style arguments about words are pointless, or did it just prove they're pointless for chemistry words, and how can you tell which kind of word you're arguing about when you're in the middle of an argument?
