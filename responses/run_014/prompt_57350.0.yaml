prompt: |-
  I'm a philosophy-of-language PhD student helping to run a joint seminar with our law school on reference and legal interpretation, and one judicial practice keeps resisting my attempts to characterize it. When the Supreme Court must fix the sense of an ordinary term in a statute or constitutional provision, it commonly consults a dictionary published near the time of enactment — Johnson's for the eighteenth century, Webster's American Dictionary for the antebellum period — treating the entry as evidence of what the phrase meant to the enacting community. Yet the same Court, in Nix v. Hedden (1893), classified the tomato as a vegetable for tariff purposes: it conceded that botanically the tomato is the fruit of a vine, declined to treat as controlling either the Webster's and Worcester's definitions counsel had read into evidence or the botanical classification, and reasoned instead from how sellers and consumers of provisions ordinarily talk, adding that dictionaries are admitted "not as evidence, but only as aids to the memory and understanding of the court." In regulatory and evidentiary settings, meanwhile, these courts defer freely to expert classification of a substance, species, or drug.

  What theory of meaning does the dictionary-lookup practice presuppose? Is it committed to descriptivism about sortal and natural-kind terms, and to the assumption that a lexicographer's entry samples a single community-wide competence rather than one register among many? If semantic externalism and the division of linguistic labor are correct, can an 1828 entry fix the extension of a term whose reference depends on the world and on specialist usage — or does the practice survive in some restricted role, fixing sense while leaving reference to the world? And is the pattern internally inconsistent, or can a single doctrine (ordinary meaning, judicial notice, deference to trade usage) accommodate all three of these behaviors? Please distinguish what the practice strictly presupposes from what merely sits comfortably with it, mark where it is underdetermined among rival semantic theories, and say what interpretive method would have to look like if the Court took externalism seriously.
reasoning: |-
  Okay, the user is a philosophy-of-language PhD student grappling with a complex issue in legal interpretation. They're trying to reconcile the Supreme Court's use of historical dictionaries with cases like Nix v. Hedden where the Court dismissed dictionary definitions in favor of ordinary usage. They also note courts defer to experts in regulatory contexts. 

  Hmm, this is a sophisticated interdisciplinary puzzle between philosophy of language and legal hermeneutics. The user clearly has deep theoretical knowledge but is struggling to map semantic theories onto judicial practice. Their core frustration seems to be: How can courts simultaneously treat dictionaries as authoritative historical records (for original meaning) yet subordinate them to lay usage or expert testimony elsewhere?

  Let me break this down layer by layer. First, the dictionary practice does appear descriptivist - it assumes words have stable community meanings captured by lexicographers. But Nix reveals this isn't consistent. The Court there essentially adopted a Wittgensteinian "meaning-as-use" approach, prioritizing marketplace language games over botanical facts or dictionary entries. And the regulatory deference cases point toward semantic externalism, where experts determine reference.

  Ah! The key might be distinguishing between different interpretive tasks. When determining original public meaning (say for constitutional terms), courts need historical linguistic evidence. But when applying statutes to concrete cases, they care about current contextual usage or specialized meanings. This isn't necessarily inconsistent - it's about different phases of interpretation.

  The user's externalism question is particularly sharp. If reference is fixed by the world/expertise, can an 1828 dictionary bind modern classification? Probably not for natural kinds, but the dictionary might still help reconstruct historical intentions. The practice survives by helping ascertain sense (conceptual meaning) while allowing reference to shift with new knowledge.

  For their seminar, I should emphasize that courts are pragmatists, not theorists. They'll use whatever tool resolves the case - dictionary for historical sense, ordinary usage for ambiguous terms, expertise for technical matters. The unifying thread is "reasonable communicativeness" in each context. If courts took externalism seriously, they'd consult current experts more often for natural-kind terms, but might still use dictionaries for non-natural-kind statutory language.

  The user's real challenge might be exposing how legal practice smuggles in semantic assumptions without rigorous consistency. That could make for a great seminar session - having law students wrestle with these philosophical tensions in actual cases.
answer: |-
  This judicial practice reveals a fascinating tension between semantic intuition and legal pragmatism. Let's dissect it systematically, distinguishing presuppositions from compatibilities, and mapping implications for semantic theory:

  **Core Presuppositions of the Dictionary Practice:**
  1.  **Descriptivism/Lexical Conventionalism:** Words acquire meaning through shared conventions within a linguistic community at a given time. The dictionary entry is treated as *evidence* of this convention.
  2.  **Temporal Fixation:** The relevant meaning is fixed at the time of enactment ("original public meaning"). A contemporary dictionary is presumed to capture that snapshot.
  3.  **Community-Wide Competence:** Lexicographers are seen as accurately sampling and reporting the dominant, conventional usage across the *general* linguistic community relevant to law (often presumed to be educated speakers). This downplays:
      *   **Register/Context Variation:** Differences in meaning based on context (e.g., botanical vs. culinary vs. legal).
      *   **Division of Linguistic Labor:** The idea that meaning depends partly on expert usage known only to a subset (e.g., botanists defining "fruit" technically).
  4.  **Sense Determines Reference (in Legal Context):** The dictionary provides the *sense* (concept, definition), and the court applies that sense to determine the *reference* (the things in the world that fall under the term) in the specific legal case. The world's structure is assumed to be adequately captured by the contemporary sense.

  **What it's Compatible With (But Doesn't Strictly Presuppose):**
  1.  **Moderate Internalism:** While presupposing conventionalism, it doesn't *strictly* require meanings to be purely in the head (internalism); it could be compatible with meanings being determined by external usage patterns. However, it heavily *leans* internalist by prioritizing dictionary definitions over empirical investigation of actual world-referent relationships.
  2.  **Minimal Externalism for Artifacts:** For non-natural-kind terms (e.g., "vehicle," "dwelling"), the practice might still work even under mild externalism, as their reference is largely convention-dependent.

  **Underdetermination Among Rival Semantic Theories:**
  1.  **Externalism vs. Internalism:** The practice *assumes* descriptivism/internalism works sufficiently for legal purposes. It doesn't engage with the externalist argument that reference for natural kinds (like plants, substances, biological categories) is fixed by underlying real-world structure, potentially independent of contemporary descriptions. This is the crux of the tomato case tension.
  2.  **Causal-Historical Theory:** The practice is silent on whether the term's reference is fixed by an initial baptism pointing to a kind, rather than a description. It focuses on the description *at enactment time*.
  3.  **Meaning Holism/Contextualism:** It downplays how a word's meaning might depend on the specific linguistic context of the statute or the broader network of concepts within the law.

  **Reconciling the Three Behaviors (Dictionary, *Nix*, Expert Deference):**
  A single, pragmatic doctrine of **"Ordinary Meaning in Context"** can accommodate them, though it reveals inherent tensions:

  1.  **Historical Dictionary (Original Public Meaning):** Used when the interpretive goal is to ascertain the *communicative intent of the enactors* or the *original public understanding* of a constitutional or statutory term. The dictionary is a proxy for the conventional sense understood by the enacting community. *Presupposes descriptivism and temporal fixation.*
  2.  ***Nix v. Hedden* (Current Ordinary Meaning in Specific Context):** When applying a statute to a concrete case, especially involving terms with potential technical meanings but common usage, the Court prioritizes the meaning within the *relevant linguistic context* – the "ordinary speech of the people," particularly in the domain governed by the statute (here, commerce in provisions). Dictionaries are merely "aids," insufficient if they conflict with demonstrable *usage in the relevant register* (trade, everyday commerce). This reflects **contextualism** and prioritizes **pragmatic use over strict definition**. It implicitly acknowledges the **division of linguistic labor** (botanists know the technical meaning, but tariff laws care about how buyers/sellers talk).
  3.  **Expert Deference (Technical Meaning):** In regulatory or evidentiary contexts, the statute itself often *explicitly or implicitly* incorporates technical or scientific standards. Here, the "ordinary meaning" *is the expert meaning* within the relevant specialized community (chemists, biologists, pharmacologists). The Court defers because the statute adopts that technical register, recognizing the **division of linguistic labor** as central to the term's meaning *in that specific legal context*.

  **The Tension:** The core tension lies in *which* "ordinary meaning" is relevant: the historical general public meaning (dictionary), the current meaning in a specific practical context (*Nix*), or the current expert meaning (deference). The Court doesn't consistently apply one semantic theory; it chooses the approach best suited to the perceived *purpose* of the interpretation (original intent vs. current application vs. implementing scientific standards).

  **Implications of Taking Externalism Seriously:**
  If the Court fully embraced semantic externalism (especially for natural kinds), its interpretive method would need significant shifts:

  1.  **Historical Interpretation (Original Public Meaning):**
      *   Dictionaries would become primarily evidence of the *conventional sense believed by the enactors and public*, **not** the ultimate determiner of reference.
      *   The Court would need to investigate the *causal-historical grounding* of the term at enactment. What *kind* were they pointing to? What were the paradigmatic exemplars? What scientific understanding (if any) was prevalent?
      *   Reference would be fixed by the actual world (as partially understood then), meaning *future discoveries* about the nature of the kind could alter the *extension* of the term as applied to borderline cases, even if the sense was fixed. (E.g., "Whales are fish" based on 18th-century sense vs. modern biological classification).
      *   Interpretation might focus more on the *kind* intended, rather than the specific description used.

  2.  **Contemporary Application (Like *Nix*):**
      *   While *Nix*'s focus on usage aligns with externalism's emphasis on use within a linguistic community, a strong externalist view would still ask: What is the actual nature of the thing (tomato)? Does it share the underlying properties (biological structure, genetics) of the *kind* originally referred to by "fruit" or "vegetable" in the relevant context? Pure usage might be overridden by scientific reality if the statute is deemed to track natural kinds.
      *   For natural-kind terms in statutes, courts might need to engage more deeply with current scientific understanding to determine if an item belongs to the relevant externally anchored kind, rather than relying solely on marketplace speech. The "division of linguistic labor" would become central.

  3.  **Expert Deference:**
      *   This practice would be *strengthened* and seen as directly aligned with externalism. Deferring to experts *is* acknowledging the division of linguistic labor and that reference is fixed by the underlying nature of the kind, which experts are best positioned to identify.

  **What Interpretive Method Might Look Like Under Externalism:**

  1.  **Dual Inquiry:** For original meaning interpretation involving potential natural kinds:
      *   **Historical Sense:** What was the conventional understanding/description associated with the term at enactment? (Dictionaries remain relevant here).
      *   **Historical Grounding:** What kind(s) in the world were speakers likely referring to, based on paradigmatic examples and contemporary scientific knowledge (if any)? What was the causal chain of reference?
  2.  **Reference Tracking:** The extension of the term would be determined by the actual nature of the things in the world relative to the historically grounded kind, *even if contemporary descriptions* (like a historical dictionary definition) *were incomplete or mistaken*. (E.g., If "dolphin" was historically classified as a fish based on sense/appearance, but the enactors were pointing to the same kind we now call mammals, modern biology determines reference).
  3.  **Heightened Role for Experts:** In applying statutes involving natural-kind terms, courts would routinely seek expert testimony on the nature of the item in question relative to the relevant kind (historically grounded or contextually defined), moving beyond *just* dictionaries or *just* marketplace usage.
  4.  **Contextual Register Sensitivity:** Explicitly recognizing that the statute might use a term in its ordinary, technical, or trade register, and determining which register governs based on statutory purpose. The division of linguistic labor would be a key factor.

  **Conclusion:** The Court's dictionary practice presupposes a descriptivist, conventionalist, and internalist-leaning view of meaning, fixated on historical sense. *Nix v. Hedden* reveals the pragmatic limits of this when faced with contextual register variation and the division of linguistic labor. Expert deference explicitly embraces the division of linguistic labor. While a doctrine of "ordinary meaning in context" can formally unify them, the practices reflect underlying tensions between competing semantic intuitions. Embracing semantic externalism would require courts to more rigorously separate historical sense from reference, prioritize investigations into the causal-historical grounding of terms (especially natural kinds), and give scientific expertise a more fundamental role in determining reference for those terms, moving beyond dictionaries as definitive evidence of extension. The practice survives, but its role shifts to primarily elucidating historical sense and intention, while reference determination becomes a more complex inquiry involving the world and expert knowledge.
