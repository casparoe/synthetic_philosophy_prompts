     a_n = (-1)^{n+1} * C * 2^n

   Why? Because then:
     a_n * (1/2)^n = (-1)^{n+1} * C * 2^n * (1/2)^n = (-1)^{n+1} * C.

   So each term in the expected value sum is exactly (-1)^{n+1} * C.

   We can choose C arbitrarily. Let's choose C=1 for simplicity. Then:
     a_n = (-1)^{n+1} * 2^n

