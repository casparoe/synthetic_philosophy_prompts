          N=3: 1
          N=4: 0
          ... so it alternates: 1,0,1,0,...

      The Cesaro mean is the limit of the average of the first K partial sums of the sequence {E_N}.

      Let A_K = (1/K) * (E_1 + E_2 + ... + E_K)

