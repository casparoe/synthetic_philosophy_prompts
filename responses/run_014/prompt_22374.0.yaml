answer: |-
  You've hit on one of the most persistent and sophisticated criticisms of supervaluationism — the **problem of higher-order vagueness**. Your background in measurement uncertainty gives you a keen eye for the structural similarity to calibration hierarchies. Here's a breakdown of the issue and how supervaluationists respond (or concede):

  ### Core Problem: The "Admissible" Set Itself is Vague
  1.  **The Recursion Worry:** If "admissible precisification" is vague (which it intuitively seems to be for vague predicates like "tall" or "heap"), then supervaluationism needs an account of *its* boundaries.
  2.  **The Dilemma:**
      *   **Option 1 (Recursion):** Define "admissible" using *another* set of meta-precisifications (precisifications of what counts as admissible). But then *that* set likely has vague boundaries, requiring meta-meta-precisifications, and so on... infinite regress.
      *   **Option 2 (Sharpness):** Claim the set of admissible precisifications has a *sharp boundary*. But this seems to contradict the fundamental phenomenon of vagueness and looks indistinguishable from **epistemicism** (where vagueness is just ignorance of a precise boundary).

  ### Supervaluationist Responses (Mitigating the Problem)
  They don't have a perfect solution, but offer strategies:

  1.  **Acknowledge Higher-Order Vagueness (HOV):** Many supervaluationists accept HOV is real and unavoidable. They bite the bullet:
      *   **Truth Recurses:** "Determinately true" (`DTrue`) becomes relative to a level.
          *   `DTrue₁(S)`: True on all L1-admissible precisifications.
          *   `DTrue₂(S)`: True on all L1-admissible precisifications *and* the set of L1-admissible precisifications is itself `DTrue₁` (i.e., sharply defined relative to L2-admissible meta-precisifications).
          *   ...and so on. Borderline cases exist at each level.
      *   **Consequence:** While recursion happens, it doesn't necessarily *vitiates* the theory. It models the layered nature of vagueness. "Determinately true" (`DTrue`) becomes context-dependent or inherently vague itself. This sacrifices some logical simplicity but reflects the phenomenon.

  2.  **Primitive/Non-Reductive "Admissible":** Some argue "admissible precisification" is a *primitive*, irreducible notion grounded in linguistic practice/convention. We grasp it directly without needing a further definition or sharp boundary. Its vagueness is fundamental.
      *   **Analogy (Measurement):** Think of the "admissible range" in calibration being defined by a standard (e.g., ISO guide) accepted *by convention*. While the *application* of the standard might have borderline cases, the standard itself is the anchor. Supervaluationists posit "admissibility" as the linguistic anchor.

  3.  **Sharpness ≠ Epistemicism:** They argue the sharp boundary of the *set* of precisifications is **not** the same as a sharp boundary in the *world* or in the predicate's extension:
      *   **Supervaluationism:** The sharp boundary is in the *space of interpretations* (precisifications) we consider legitimate meanings. Vagueness arises because multiple, equally legitimate interpretations exist. "Tall" doesn't have a single sharp boundary *in reality*, but the *rules of our language* sharply define which candidate boundaries are permissible meanings.
      *   **Epistemicism:** Claims there *is* a single, sharp boundary in reality/the extension (e.g., a specific height for "tall"), and vagueness is solely our *ignorance* of that precise fact.
      *   **Key Difference:** Supervaluationism explains *why* we can't know the boundary: because there *isn't one unique boundary mandated by meaning*. Epistemicism posits there *is* one unique boundary, we just can't find it. The supervaluationist sharp boundary governs *meaning options*, not reality itself.

  4.  **Focus on Model, Not Reduction:** Supervaluationists often claim their model *describes* the structure and logic of vagueness effectively (e.g., explaining truth-value gaps, the validity of classical logic for non-vague reasoning, the sorites paradox) without needing to *eliminate* all vagueness. The vagueness of "admissible" reflects higher-order vagueness inherent in language.

  ### Why It's Not *Just* Epistemicism in Disguise (The Core Defense)
  The crucial distinction lies in **what the sharp boundary applies to** and **what explains ignorance**:

  | Feature         | Supervaluationism                                     | Epistemicism                                          |
  |-----------------|-------------------------------------------------------|-------------------------------------------------------|
  | **Boundary Location** | In the *space of permissible interpretations* (meanings) | In the *actual extension* of the predicate (the world) |
  | **Nature of Boundary** | Semantic/conventional (rules of language use)         | Metaphysical or alethic (fact about the property)     |
  | **Reason for Ignorance** | No single correct precisification exists              | A single correct boundary exists but is unknowable    |
  | **Truthmaker**  | Supertruth across precisifications                    | Correspondence to the single sharp fact               |
  | **Vagueness is...** | Indeterminacy *in meaning*                          | Ignorance *of a fact*                               |

  ### Your Measurement Analogy Sharpened
  Think of measuring a length with a ruler:
  *   **Epistemicism:** There's a single, exact, Platonic length `L`. Your ruler has finite precision, so you only know `L` is between 5.0cm and 5.2cm. Your ignorance is purely epistemic.
  *   **Supervaluationism:** The concept "length of this object" *admits* different precise interpretations (e.g., measuring from which points? Accounting for surface roughness? At what temperature?). The "admissible range" (5.0cm - 5.2cm) defines which precise values are legitimate reports *given the meaning/convention of the measurement process*. Your inability to give a single number isn't ignorance of `L`; it's because the reporting convention *allows* a range. The sharp boundary of the "admissible range" is set by the *measurement protocol* (akin to linguistic convention), not by a hidden fact about the object.

  ### Conclusion
  You are absolutely right to be stuck. The vagueness of "admissible" is **the** major challenge for supervaluationism.

  *   **Recursion Happens:** They generally accept higher-order vagueness and model it recursively, sacrificing absolute precision in "determinately true" but aiming to capture the phenomenon.
  *   **Sharpness ≠ Epistemicism:** The sharp boundary of the precisification set is defended as a boundary in *meaning/convention*, not a hidden boundary *in the world*. This is the fundamental difference. The ignorance stems from semantic indeterminacy, not metaphysical mystery.
  *   **It's an Assumption (with defense):** Yes, supervaluationism *does* assume the set of admissible precisifications is well-defined (has sharp boundaries), even if its *membership* is vague. They argue this is necessary to model the logic of vagueness coherently and that the sharpness resides at the level of linguistic rules/conventions, not the worldly extensions.

  Your intuition from measurement uncertainty is spot-on. The "admissible range" in metrology often has conventional, sharp boundaries defined by standards (GUM, ISO), even though applying those standards to a specific physical quantity might encounter borderline cases. Supervaluationism treats linguistic meaning similarly. The theory's value lies in its logical framework for reasoning with vagueness, even if its foundational concept ("admissible") faces the very problem it seeks to address.
