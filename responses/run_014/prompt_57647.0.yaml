prompt: |-
  Second year in a phil PhD, decision-theory-ish corner of it, and I've realized there's a distinction I use constantly in seminar without being able to state. Can you help me sharpen it? No bibliography needed, and please don't worry about getting the history of who-said-what exactly right — I want the conceptual structure, not the lineage.

  What I think I already understand: the textbook money pump. Cycle A > B > C > A, I start out holding C. Someone offers me B in exchange for C plus a cent; I accept, since B > C. Then A for B plus a cent; accept. Then C for A plus a cent; accept. I'm back at C minus three cents, having paid to go around a loop. And separately there's the diachronic Dutch book against someone who doesn't conditionalize, which feels structurally identical to me: a sequence of individually acceptable bets adding up to a guaranteed loss.

  Where I get lost is in the replies, and in what exactly each argument is an argument *for*.

  (a) The myopia objection — I think this goes back to Schick? — says the pump only bites if the agent can't see the sequence coming, and that a sophisticated agent doing backward induction isn't vulnerable. I always get the node wrong, so please just work it out for me: with the cycle above and those three offers in that order, at which node does the sophisticated agent turn something down, and what does the run actually cost them? Then the thing I cant resolve: at that node they're refusing a trade they strictly prefer. Is that a violation of consequentialism in Hammond's sense, and if so is that a *cost* of sophistication, or is it evidence we've misidentified the objects of preference — outcomes, vs. plans, vs. whole forward-looking sequences? Relatedly, does the sophisticated agent really escape, or do they only escape one round, so that a long enough series of rounds drains them anyway? I have a vague memory of Gustafsson pressing something like that, but don't reconstruct his argument for me; I want to know what would have to be true about the choice situation for that style of objection to work in general.

  (b) Then there's resoluteness — McClennen's agent who sticks to a chosen plan even when the plan's later stages look worse from where she now stands. I can never tell whether resoluteness and sophistication are rival answers to the same problem or answers to different problems. Where do they actually diverge, and is there a concrete cycle plus offer sequence on which they give different verdicts?

  (c) The bit I most want pressed on: the pump is a diachronic exploitability argument being used to establish a synchronic coherence norm, transitivity of an ordering held at a time. What licenses that move? Which premises are load-bearing — that the agent can decline trades, that the fees are small relative to the preference gaps, that node-level preference determines node-level choice, that the sequence is foreseeable in advance? And is the diachronic Dutch book for conditionalization exposed to exactly the same challenge, or is there an asymmetry, e.g. because a bookmaker's later offers are keyed to your announced credences in a way that a trade partner's aren't?

  (d) Finally, the thing my advisor keeps pushing: even granting that cyclical preferences are self-defeating for an agent who can't control her future node-by-node choices, why does that make the *ordering* irrational rather than the agent unlucky? Is there a version of the argument that doesn't smuggle in an assumption about self-control?

  Ideally you'd go node-by-node on a worked example for (a) and (b), then step back for (c) and (d). I care way more about the distinctions being clean than about covering everything.
reasoning: |-
  Okay, let me tackle this user's query step by step. They're a second-year PhD student in philosophy, focusing on decision theory, and they're struggling with some conceptual distinctions around money pumps and diachronic coherence. 

  First, I need to understand their core confusion points. They've outlined four main areas: (a) the myopia objection and sophistication, (b) resoluteness vs sophistication, (c) the jump from diachronic exploitability to synchronic norms, and (d) whether irrationality lies in preferences or lack of self-control. 

  For (a), the user wants a clear node-by-node breakdown of how a sophisticated agent avoids the money pump. I recall that sophistication involves backward induction - so at the final node, the agent would refuse to trade back to C because they foresee ending up with C minus fees. The key tension is that they're refusing a trade they'd normally accept (B > C) because of future consequences. That's where Hammond's consequentialism comes in - the agent is evaluating choices based on future plans, not just immediate outcomes. I should note that this only protects them in single-round cycles; Gustafsson's argument suggests repeated cycles could still drain them if preference cycles persist.

  Moving to (b), I need to contrast resoluteness with sophistication. The divergence happens at the second node: a resolute agent sticks to their original plan to hold through all trades, while the sophisticated agent deviates. The concrete difference appears in the second trade - resolute accepts A for B+¢, sophisticated refuses. This shows they're solutions to the same problem (exploitability) but with different trade-offs: resoluteness avoids money-losing but violates dynamic consistency, while sophistication maintains dynamic consistency at the cost of refusing beneficial trades.

  For (c), the licensing question is tricky. The move from diachronic exploitability to synchronic norms relies on several premises: that fees can be arbitrarily small, that choices reveal preferences, and crucially, that the sequence is foreseeable. Without foreseeability, the pump doesn't pressure synchronic coherence. The Dutch book analogy holds because both exploit foreseen inconsistencies, though Dutch books use credence announcements.

  Finally for (d), the self-control issue. The argument assumes agents can't bind future choices - if they could, cyclical preferences wouldn't be exploitable. The pump shows that without commitment mechanisms, cyclical preferences become instrumentally irrational through exploitation. But this depends on whether we view rationality as requiring immunity to exploitation given actual constraints.

  Throughout, I'll use the A>B>C>A cycle with fixed trade offers to keep comparisons clear. The user emphasized clean distinctions over comprehensiveness, so I'll focus on making the node-by-node analysis crystal clear before addressing the philosophical implications. Their advisor's push about self-control seems particularly important - I should acknowledge that the money pump only establishes irrationality under specific choice architectures.
answer: |-
  Let's dissect this step by step, using your cycle **A ≻ B ≻ C ≻ A** and fixed offers: Trade B for C+¢, then A for B+¢, then C for A+¢. We'll assume strict preferences and negligible fees (¢ << preference gaps). Here's the node-by-node breakdown:

  **I. Sophistication (Myopia Objection) - Node-by-Node:**
  Starting Position: Agent holds C.

  1.  **Node 1 (Offer: Trade C for B, paying ¢):**
      *   Immediate Preference: B ≻ C. Accepting gains B (preferred) at cost of ¢.
      *   Sophisticated Agent: Sees the *whole sequence*. Knows accepting here leads to Node 2. **Accepts.** Now holds B, paid ¢.

  2.  **Node 2 (Offer: Trade B for A, paying ¢):**
      *   Immediate Preference: A ≻ B. Accepting gains A (preferred) at cost of ¢.
      *   Sophisticated Agent: Sees the *whole sequence*. Knows accepting leads to Node 3. At Node 3, the agent (holding A) will be offered C for A+¢. *Foresees* that at Node 3:
          *   Immediate Preference: C ≻ A. The agent would accept, ending with C and paying another ¢.
          *   **Final Outcome:** Started with C, ended with C, paid ¢(Node1) + ¢(Node2) + ¢(Node3) = **3¢ loss**.
      *   **Sophisticated Choice:** Compares:
          *   *Accept Offer 2:* End up with C - 3¢.
          *   *Reject Offer 2:* Still holds B, has already paid ¢ (from Node1). Outcome: **B - ¢**.
      *   **Decision:** Since B ≻ C (and ¢ is negligible), **B - ¢ ≻ C - 3¢**. Therefore, the sophisticated agent **REJECTS** Offer 2 at Node 2.
      *   **Run Cost:** Paid 1¢ at Node 1. Ends with **B - ¢**.

  **Cost & Consequentialism:** The sophisticated agent escapes the *full* pump cycle by refusing Offer 2, costing only 1¢. **Yes, they refuse a trade they strictly prefer *at that node* (A ≻ B).** This *is* a violation of **Hammond-style Consequentialism** (choice at a node depends *only* on preferences over outcomes reachable *from* that node, ignoring how it was reached). Sophistication requires evaluating choices based on the *plan* they commit to from that node onward. The "cost" is refusing a locally beneficial trade to avoid a globally worse outcome. It suggests preferences might need to be over *continuation paths* or plans, not just atomic outcomes.

  **Repeated Rounds?** If the *same cycle* repeats identically later (e.g., tomorrow you're offered the same sequence starting from whatever you hold), sophistication protects the agent *each time*. They will always refuse the *second* trade in the sequence, losing only 1¢ per cycle. **Gustafsson's Press:** If the agent faces a *single*, very long, non-repeating cycle (A1 ≻ A2 ≻ ... ≻ An ≻ A1) and sophisticated backward induction forces them to refuse beneficial trades at *many* nodes early on, they might end up with a worse outcome than if they naively cycled. This requires the cycle structure itself to be complex and non-repeating within the agent's planning horizon. For simple, repeating cycles like A>B>C>A, sophistication is robust against draining.

  ---

  **II. Resoluteness (McClennen) - Node-by-Node:**
  The resolute agent adopts a *plan* in advance (before Node 1). Assume they plan: **"Reject ALL trades. Keep C."** (They could plan to cycle *once* if they value the experience, but the key case is avoiding the pump).

  1.  **Node 1 (Offer: Trade C for B, paying ¢):**
      *   Immediate Preference: B ≻ C.
      *   Resolute Agent: Sticks to the plan: **REJECT**.
      *   **Run Cost:** 0¢. Ends with C.

  2.  **Node 2 (Offer: Trade B for A, paying ¢):**
      *   *Not reached* because they rejected Node 1.

  **Divergence from Sophistication & Cost:** Resoluteness and Sophistication diverge **at Node 1** in this setup.
  *   Sophisticated: Accepts Node 1 (ends with B - ¢).
  *   Resolute: Rejects Node 1 (ends with C).
  *   **Cost:** Resolute loses 0¢, Sophisticated loses 1¢. Resolute does strictly better here by avoiding any trade.
  *   **Why?** The Sophisticated agent *knows* they will reject Node 2 *if* they accept Node 1. They accept Node 1 expecting to get B - ¢, which they prefer to C (the resolute outcome). B ≻ C implies B - ¢ ≻ C (for small ¢), so the Sophisticated agent *prefers* their outcome (B - ¢) to the Resolute outcome (C). The Resolute agent avoids any monetary loss but ends with their least preferred starting option (C). *Which is better depends on the strength of preferences relative to the fee.*

  **Crucial Point:** Resoluteness shines when the *plan itself* avoids getting sucked into costly sequences *at all*. Sophistication minimizes loss *once potentially involved*. They are rival solutions to the *same core problem*: diachronic exploitability due to potential preference reversals. Resoluteness prioritizes plan-adherence over node-consequentialism, potentially achieving better final outcomes but requiring commitment. Sophistication prioritizes node-by-node optimality given foresight, avoiding large losses but potentially incurring small ones or getting suboptimal outcomes.

  ---

  **III. Licensing the Move (Diachronic Exploit -> Synchronic Norm)**
  The argument is: Cyclical preferences (synchronic state) → Vulnerability to Money Pump (diachronic process) → Therefore, cyclical preferences are irrational.

  **Load-Bearing Premises:**
  1.  **Exploitability:** An exploiter *can* exist and offer the sequence.
  2.  **Declinability:** The agent *can* refuse any trade. (Crucial for sophistication/resoluteness).
  3.  **Fee Size:** Fees can be made arbitrarily small relative to preference intensities. (Makes the loss purely attributable to the preference structure, not the fee size).
  4.  **Choice-Preference Link:** At a node, the agent *will* choose an option they strictly prefer over another available option. (Links revealed choice to synchronic preference).
  5.  **Foreseeability:** The agent can foresee the sequence and their own potential future choices (essential for sophistication to work and for the *threat* of exploitation to be real/credible). **This is the critical bridge.** Without foreseeability, the pump is just bad luck, not proof of synchronic incoherence.
  6.  **No Binding:** The agent lacks perfect commitment mechanisms to bind future choices.

  **Why it pressures synchronic coherence:** If preferences are transitive *now*, no such foreseeably exploitable sequence exists, regardless of how choices unfold diachronically (sophisticated, resolute, or naive). Cyclical preferences *guarantee* a foreseeably exploitable path exists *unless* the agent employs sophistication/resoluteness, which themselves involve costs or violations of standard choice principles.

  **Dutch Book Asymmetry?** The asymmetry is **minimal**:
  *   **Dutch Book:** The bookmaker *conditions* later bets on the outcome of earlier events (or announced credences). This leverages the *interaction* between prior beliefs and updating rule.
  *   **Money Pump:** The exploiter offers *unconditional* sequential trades leveraging preference reversals.
  *   **Common Core:** Both rely on **Foreseeability** and the **Link** between synchronic state (preferences/credences) and diachronic choice behavior. The Dutch book also crucially relies on the agent accepting bets deemed *synchronically* fair/favorable based on *current* credences.

  ---

  **IV. Irrational Preference or Unlucky Agent? (Advisor's Push)**
  The core challenge is: "The *ordering* seems fine; the problem is the agent can't *execute* it without being exploited due to lack of self-control/commitment."

  **The Argument's Retort:**
  1.  **Instrumental Rationality:** Rationality is (often seen as) instrumental: achieving your ends. Cyclical preferences make you *foreseeably* susceptible to ending up worse off by your *own lights* (paying to end up where you started or worse), *even if* you are sophisticated. (The sophisticated agent ends up with B - ¢, while they could have kept C for free. B ≻ C, but C is *available* without cost, while B - ¢ is only available via a costly path they foresee).
  2.  **The Self-Control Assumption is Revealing:** The argument *doesn't* assume lack of self-control is irrational *per se*. It shows that **without perfect commitment mechanisms**, cyclical preferences *inherently* create a situation where *whatever* choice rule the agent uses (naive, sophisticated, resolute), they end up with an outcome dominated by an alternative they could have had:
      *   *Naive:* Ends with C - 3¢. Dominated by C (available by doing nothing).
      *   *Sophisticated:* Ends with B - ¢. Dominated by C? (If B ≻ C, then B - ¢ ? C depends on ¢ vs preference strength. For small enough ¢, B - ¢ ≻ C, but C was *available* without the ¢ loss).
      *   *Resolute:* Ends with C (if they plan to reject all). Not dominated by another *outcome* but perhaps by a *plan* (if they value cycling once).
  3.  **Immunity as a Requirement:** The pro-transitivity argument claims that rational preferences should make an agent *immune* to this form of exploitation *under normal conditions* (foreseeable offers, ability to decline, small fees). Cyclical preferences inherently violate this immunity. If the agent *had* perfect commitment, the cycle might be harmless (they commit to never trade). But the *need* for such a drastic commitment device to avoid foreseeable loss is itself seen as evidence of a flaw in the underlying preferences within a framework of instrumental rationality operating in a world without perfect commitment.

  **In essence:** The money pump shows that cyclical preferences are *pragmatically self-defeating* under foreseeable diachronic choice scenarios without commitment. This pragmatic failing is taken as evidence of a *synchronic structural defect* in the preferences themselves for an instrumentally rational agent. The lack of commitment isn't smuggled in; it's a realistic constraint that reveals the vulnerability inherent in the preference structure.
