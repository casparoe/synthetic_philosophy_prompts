       - 30 are defaulters (FN) and 810 are repayers (TN).

     If we lower the threshold, we will move some of the approved into denied. 
     We can think of the risk score: we will take the 840 approved and order them by risk score (highest to lowest) and then take the top 40 and deny them.

     Among these 40, how many are defaulters and how many are repayers? 
     The distribution of risk scores in the approved set: 
       - The 30 defaulters (FN) are the ones that the model initially thought were safe (low risk) but they are not. 
         They are the highest risk in the approved set? Not necessarily, but we assume that the model assigns higher risk scores to defaulters in general.

     However, we don't have the exact distribution. We can assume that the model is calibrated and the risk scores reflect the true probabilities. 
     But for simplicity, let's assume that the 40 we deny are proportional to the composition of the approved set? 
     The approved set has 30 defaulters and 810 repayers. The proportion of defaulters in the approved set is 30/840 ≈ 3.57%.

     So, of the 40 we deny, we would expect 40 * (30/840) ≈ 1.43 (about 1 or 2) to be defaulters and the rest repayers? 

     But note: we are moving from the highest risk in the approved set. The model should have ranked the defaulters higher than the repayers? 
     So ideally, the 40 we deny would include as many defaulters as possible. However, we only have 30 defaulters in the approved set. 
     So we can deny all 30 defaulters and 10 repayers? 

     But then the new denied set becomes:
       - Old denied: 70 TP and 90 FP -> 160
       - New denied: 30 (from the FN, now become TP) and 10 (from TN, now become FP) -> 40
       - Total denied: 200, with TP = 70+30 = 100, FP = 90+10 = 100.

     So now for Group A:
       TP = 100 (all defaulters are denied) -> TPR becomes 100% (since 100/100)
       FP = 100 (100 repayers are denied) -> FPR becomes 100/900 ≈ 11.11%? Actually, 100 FP out of 900 repayers -> 11.11%

     But note: we have set the threshold arbitrarily to get 200 denials. We don't necessarily get exactly 30 defaulters and 10 repayers? 
     However, we have forced the outcome. 

     Alternatively, we can think of the threshold adjustment: we lower the threshold until we have 200 denials.

     Now, for Group B:
     We want to deny 20% (200 applicants). Currently, we are denying 220 (22%). We need to approve 20 more (to reduce denials by 20). 
     We raise the threshold to make the model less sensitive. We take the 220 denied and order by risk score (lowest to highest) and approve the bottom 20.

     Among the 220 denied, we have 140 TP and 80 FP. 
     We want to approve 20. We assume we approve the ones with the lowest risk. 
     The lowest risk in the denied set are the false positives (repayers that were denied). 
     So we approve 20 of the FP? Then:

       - The new denied set: TP = 140, FP = 80 - 20 = 60.
       - So TPR = 140/200 = 70% (unchanged) and FPR = 60/800 = 7.5%.

     Now, we have:
       Group A: TPR=100%, FPR=11.11%
       Group B: TPR=70%, FPR=7.5%

     This violates equalized odds because TPR and FPR are not the same across groups.

   Alternatively, we could set the same approval rate by adjusting the threshold to 80% for both. 
   But we see that to get 80% approval (200 denied) for Group A we had to lower the threshold (resulting in higher TPR and FPR for Group A) 
   and for Group B we had to raise the threshold (resulting in the same TPR? actually we kept the same TPR for Group B because we only approved FP, but note: 
     we didn't change the threshold in a way that affects TP? Actually, we only approved FP so the TP count remains the same? 
     However, the TPR is computed as TP/(actual defaulters) and we didn't change the TP count? So TPR remains 70% for Group B.

   But for Group A, we increased the TPR to 100% and FPR to 11.11%. 

   So now we have:
     Group A: TPR=100%, FPR=11.11%
     Group B: TPR=70%, FPR=7.5%

   They are not equal. Therefore, we break equalized odds.

   What if we try to satisfy equalized odds? We have already seen that if we use the same threshold, we get equalized odds (because we set the same TPR and FPR) 
   but then the approval rates differ (84% vs 78%). 

   Now, the key point: the base rate difference is what causes the approval rates to be different even when the error rates (TPR, FPR) are the same. 

   Why? Because the proportion of actual positives (defaulters) is different. 
   The denial rate = P(deny) = P(deny|defaulter)*P(defaulter) + P(deny|repayer)*P(repayer)
                  = TPR * base_rate + FPR * (1 - base_rate)

   For Group A: 0.7 * 0.1 + 0.1 * 0.9 = 0.07 + 0.09 = 0.16 -> 16%
   For Group B: 0.7 * 0.2 + 0.1 * 0.8 = 0.14 + 0.08 = 0.22 -> 22%

   So the denial rate is different because of the base rate.

   If the base rates were the same, then the denial rates would be the same. 
   For example, if both groups had 10% base rate, then:
     Group A: 16% denial
     Group B: 16% denial -> demographic parity holds.

   Similarly, if both had 20% base rate, then both would have 22% denial.

   Therefore, the base rate difference is the load-bearing feature.

   Now, the normative clash:

   - A proponent of demographic parity (DP) might argue: 
        "We must have equal approval rates to avoid historical disadvantages from compounding. 
         Group B has been historically underserved and we must not perpetuate that by approving fewer of their applications. 
         Even if the model is equally accurate, the outcome is unfair because it results in disparate impact."

   - A proponent of equalized odds (EO) might argue:
        "The model should be equally accurate for both groups. We should not have to lower the threshold for Group A to the point that we deny 100% of their actual defaulters (which we might not be able to achieve without excessive harm to repayers) and raise the threshold for Group B to the point that we miss some of their repayers. 
         The model is making the same kind of errors in both groups. 
         The difference in base rates is a real-world disparity that we cannot ignore, and trying to force equal outcomes by adjusting thresholds leads to the model being less accurate (in terms of FPR and TPR) for one group than the other."

   Escape hatches:

   1. Randomized thresholds: 
        Instead of a fixed threshold, we can randomize the decision for applicants near the threshold. 
        This can help achieve a desired approval rate without completely sacrificing error rates. 
        However, it introduces randomness which might be seen as unfair to individuals.

        Cost: It makes the decision non-deterministic, which can be hard to explain and might be perceived as unfair by individuals who are denied by chance.

   2. Dropping a criterion: 
        We might choose to only satisfy one of the fairness criteria. 
        This is what we did above: we either have DP and break EO, or have EO and break DP.

        Cost: We have to accept the drawbacks of the chosen criterion and the unfairness of the other.

   3. Retargeting the prediction: 
        Instead of predicting default, we might predict a different outcome that has a similar base rate across groups? 
        But that might not be practical. Alternatively, we might use a different measure of creditworthiness that is less correlated with historical disadvantage. 
        However, if the base rate difference is due to structural factors, it might be hard to find such a measure.

        Cost: The model might become less accurate overall, or we might not be able to find a suitable alternative.

   4. Post-processing adjustments: 
        We can adjust the threshold per group to try to meet multiple criteria. However, we saw that we cannot simultaneously satisfy DP and EO without equal base rates. 
        But we can try to strike a balance. For example, we can adjust the thresholds to get as close as possible to both. 
        However, we cannot satisfy both exactly.

        Cost: We break the condition of equal error rates (for EO) or equal approval rates (for DP).

   5. Changing the base rates: 
        Long-term, we might try to address the root causes of the base rate differences (e.g., by promoting financial education, reducing inequality). 
        But this is not an immediate solution.

        Cost: It is a long-term social intervention, not a technical fix.

   Conclusion: The base rate difference causes a fundamental trade-off between demographic parity and equalized odds. 
   There is no way to satisfy both simultaneously unless the base rates are equal. 
   The choice between them is a normative one that reflects different views of fairness.
answer: |-
  ### Concrete Scenario: Bank Loan Decisions  
  **Setup**: A bank uses an ML model to predict loan default (bad outcome). Two applicant groups, Group A and Group B, have different base default rates due to systemic factors (e.g., historical economic inequality). The model has identical accuracy for both groups.  

  - **Group A (privileged)**: 5% base default rate (95% repay).  
  - **Group B (marginalized)**: 15% base default rate (85% repay).  
  - **Model performance** (same for both groups):  
    - **True Positive Rate (TPR)**: 80% (correctly identifies defaulters).  
    - **False Positive Rate (FPR)**: 10% (incorrectly flags repayers as defaulters).  

  **Population size**: 1,000 applicants per group.  

  ---

  ### Step 1: Model Outcomes at Fixed Threshold  
  *Assume a decision threshold where predicted default risk ≥ 50% → loan denied.*  

  **Group A (5% default rate)**:  
  - Actual defaulters: 50 (5% × 1,000)  
  - Actual repayers: 950 (95% × 1,000)  
    - **TP (denied correctly)**: 80% × 50 = **40**  
    - **FN (approved incorrectly)**: 50 - 40 = **10**  
    - **FP (denied incorrectly)**: 10% × 950 = **95**  
    - **TN (approved correctly)**: 950 - 95 = **855**  
  - **Approval rate**: (TN + FN) / 1,000 = (855 + 10) / 1,000 = **86.5%**  

  **Group B (15% default rate)**:  
  - Actual defaulters: 150  
  - Actual repayers: 850  
    - **TP**: 80% × 150 = **120**  
    - **FN**: 150 - 120 = **30**  
    - **FP**: 10% × 850 = **85**  
    - **TN**: 850 - 85 = **765**  
  - **Approval rate**: (765 + 30) / 1,000 = **79.5%**  

  **Fairness metrics**:  
  - **Demographic Parity (DP)**: Approval rates differ (86.5% vs. 79.5%) → **violated**.  
  - **Equalized Odds (EO)**: TPR (80% = 80%) and FPR (10% = 10%) are equal → **satisfied**.  

  ---

  ### Step 2: Enforcing Demographic Parity  
  *Adjust thresholds to equalize approval rates (e.g., both groups approved at 85%).*  

  **Group A**: Current approval = 86.5% → must deny 1.5% more (15 people).  
  - Lower threshold → deny more applicants.  
  - **New denial composition**:  
    - Deny additional 15 from the **lowest-risk approvals** (FN + TN).  
    - Assuming risk-ranked order: new denials come from the riskiest approvals (mostly FN, then TN).  
    - **Result**: Approve 850 (85%), deny 150.  
    - *New confusion matrix*:  
      - TP increases (more defaulters caught): 40 + 10 = **50**  
      - FP increases (more repayers denied): 95 + 5 = **100**  
      - **TPR**: 50 / 50 = **100%**  
      - **FPR**: 100 / 950 = **10.5%**  

  **Group B**: Current approval = 79.5% → must approve 5.5% more (55 people).  
  - Raise threshold → approve more applicants.  
  - **New approval composition**:  
    - Approve additional 55 from the **lowest-risk denials** (FP + TP).  
    - Assuming risk-ranked order: new approvals come from the safest denials (mostly FP, then TP).  
    - **Result**: Approve 850 (85%), deny 150.  
    - *New confusion matrix*:  
      - TP decreases: 120 - 35 = **85** (safe denials include few defaulters)  
      - FP decreases: 85 - 20 = **65**  
      - **TPR**: 85 / 150 = **56.7%**  
      - **FPR**: 65 / 850 = **7.6%**  

  **Fairness metrics**:  
  - **DP**: Approval rates equal (85% = 85%) → **satisfied**.  
  - **EO**: TPR (100% vs. 56.7%) and FPR (10.5% vs. 7.6%) differ → **violated**.  

  ---

  ### Step 3: Enforcing Equalized Odds  
  *Keep thresholds identical → EO holds, but DP fails (as in Step 1).*  
  - **Group A approval**: 86.5%  
  - **Group B approval**: 79.5%  
  - **Gap**: 7 percentage points.  

  ---

  ### Why the Base Rate Gap Causes the Tradeoff  
  - **Approval rate formula**:  
    `Approval Rate = (1 - FPR) × (1 - Base Rate) + FNR × Base Rate`  
    (where FNR = 1 - TPR).  
  - **Key insight**: With identical TPR/FPR, approval rates differ **only if base rates differ**.  
    - Group A: `(1 - 0.1) × 0.95 + (0.2) × 0.05 = 0.855 + 0.01 = 0.865`  
    - Group B: `(0.9) × 0.85 + (0.2) × 0.15 = 0.765 + 0.03 = 0.795`  
  - **If base rates were equal** (e.g., both 10%):  
    - Both groups: Approval = `(0.9 × 0.9) + (0.2 × 0.1) = 0.81 + 0.02 = 83%`  
    → DP and EO **coexist**.  

  **Load-bearing feature**: The base rate gap (5% vs. 15%) forces DP and EO into conflict.  

  ---

  ### Normative Clash: Which Fairness Criterion to Prioritize?  
  - **Pro-Demographic Parity Advocate**:  
    *"Disparate approval rates perpetuate systemic inequality. Group B already faces barriers; denying them loans at higher rates entrenches poverty. We must ensure equal access regardless of risk distribution."*  
    **Cost of ignoring DP**: Group B receives fewer loans, amplifying economic gaps.  

  - **Pro-Equalized Odds Advocate**:  
    *"The model must be equally accurate for all groups. Artificially approving high-risk Group B applicants increases defaults, hurting the bank and honest borrowers. Forcing equal approvals is reverse discrimination against Group A."*  
    **Cost of ignoring EO**: Group A faces higher FPR (unfair denials), while Group B benefits from lower TPR (more defaults).  

  ---

  ### Escape Hatches and Their Costs  
  1. **Randomized Thresholds**:  
     - **How**: Approve/deny borderline applicants randomly to hit target rates.  
     - **Cost**: Unpredictability erodes trust ("Why was my identical neighbor approved?"). Violates individual fairness.  

  2. **Drop One Criterion**:  
     - **Drop DP**: Accept unequal approval rates → marginalizes Group B.  
     - **Drop EO**: Accept unequal error rates → Group A bears higher FPR burden.  

  3. **Retarget the Prediction**:  
     - **How**: Predict "ability to repay under fair conditions" (e.g., with financial counseling) instead of raw default risk.  
     - **Cost**: Requires costly interventions. May not resolve base rate differences.  

  4. **Change the Base Rates**:  
     - **How**: Invest in Group B (e.g., credit-building programs).  
     - **Cost**: Long-term solution; doesn’t address immediate fairness needs.  

  **No free lunch**: The base rate gap makes this tradeoff **mathematically inevitable**. Any "solution" sacrifices accuracy, individual fairness, or social justice.  

  ### Final Takeaway  
  The tradeoff arises because **demographic parity focuses on outcomes** (group approval rates), while **equalized odds focuses on process** (equal model errors). In a non-ideal world with unequal base rates, you **cannot optimize for both**. The choice is **ethical**, not technical.
