prompt: |-
  I'm writing a post on the fairness tradeoffs that keep coming up in the ML ethics lit and I need a worked example I can actually follow, not the abstract 'you can't satisfy all the criteria' hand-wave. Construct a concrete, realistic scenario — a bank auto-deciding loan applications or a parole board using a recidivism score, your pick — with two applicant groups whose base rates of the bad outcome genuinely differ, and pick actual numbers for the base rates and the classifiers performance, don't leave them as leters. Then show, with the arithmetic laid out, that no single scoring rule with any real accuracy can satisfy both demographic parity (equal approval rates across groups) and equalized odds (equal true- and false-positive rates across groups) at once, and walk through what each of those criteria does as you slide the decision threshold. I want the base-rate gap to be the load-bearing feature, not some other confound, so say explicitly what's doing the work and what the case degenerates to if you close the gap. Then give me the normative clash: what does a person who only trusts demographic parity say to a person who only trusts equalized odds (and vice versa) when they're forced to pick one, and is there any real escape hatch — randomized thresholds, dropping a criterion, retargeting the prediction — and what each one actually costs. Keep the scenario itself to a paragraph or two and don't hand-wave the math.
