  We are going to use a scenario of a bank auto-deciding loan applications. We have two demographic groups: Group A and Group B. 
   The "bad outcome" we are predicting is loan default. We assume that the base rates of default differ between the two groups.

   Let's set:
   - Group A: 10% base rate of default (so 90% repay)
   - Group B: 20% base rate of default (so 80% repay)

   We have a classifier that predicts whether an applicant will default (positive class) or repay (negative class). 
   The classifier produces a risk score, and we set a threshold to decide: if the score is above the threshold, we predict default and deny the loan; 
   if below, we predict repay and approve.

   We assume the classifier has the same performance (in terms of sensitivity and specificity) for both groups. 
   This is a key assumption: the model is equally accurate in both groups, but because the base rates differ, the predictive values and the error rates will differ.

   Let's set the classifier's performance for both groups:
   - True Positive Rate (TPR, sensitivity) = 0.7  (70% of actual defaulters are correctly identified)
   - False Positive Rate (FPR, 1 - specificity) = 0.1 (10% of actual repayers are incorrectly flagged as defaulters)

   Now, let's assume we have 1000 applicants in each group.

   For Group A (base rate 10% default):
     Actual defaulters: 100 (10% of 1000)
     Actual repayers: 900 (90% of 1000)

     True Positives (TP): TPR * actual defaulters = 0.7 * 100 = 70
     False Negatives (FN): actual defaulters - TP = 100 - 70 = 30
     False Positives (FP): FPR * actual repayers = 0.1 * 900 = 90
     True Negatives (TN): actual repayers - FP = 900 - 90 = 810

     Therefore, the predicted positives (denied loans) = TP + FP = 70 + 90 = 160
     Approval rate (predicted negatives) = TN + FN? Actually, approved are the predicted negatives (since we deny if predicted positive). 
     So approved = TN + FN? But note: FN are actual defaulters that we approved (we predicted negative for them). 
     The number of approvals (predicted negatives) = TN + FN? Actually, the total predicted negatives = TN + FN? 
     But note: the predicted negatives are the ones we approve. So:

     Total approvals (predicted negatives) = TN + FN = 810 + 30 = 840 -> approval rate = 840/1000 = 84%

     Alternatively, we can compute: total applications minus denied (predicted positives) = 1000 - 160 = 840.

   For Group B (base rate 20% default):
     Actual defaulters: 200 (20% of 1000)
     Actual repayers: 800 (80% of 1000)

     True Positives (TP): 0.7 * 200 = 140
     False Negatives (FN): 200 - 140 = 60
     False Positives (FP): 0.1 * 800 = 80
     True Negatives (TN): 800 - 80 = 720

     Predicted positives (denied) = TP + FP = 140 + 80 = 220
     Approvals (predicted negatives) = TN + FN = 720 + 60 = 780 -> approval rate = 780/1000 = 78%

   Now, we see that the approval rates are different: Group A has 84% and Group B has 78%. 
   This violates demographic parity which requires the same approval rate (or same denial rate) for both groups.

   Also, note that the true positive rates (TPR) are the same for both (70%) and the false positive rates (FPR) are the same (10%). 
   So equalized odds is satisfied.

   Now, how can we satisfy demographic parity? We would need the same approval rate for both groups. 
   Currently, Group A has 84% approval and Group B has 78%. To achieve demographic parity, we might set a different threshold for each group.

   Let's say we want an approval rate of 80% for both groups (so denial rate of 20% for both). 

   For Group A:
     We want to deny 20% (200 applicants). Currently, we are denying 160 (16%). We need to deny 40 more. 
