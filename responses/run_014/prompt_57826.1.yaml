  Then the delayed conception: If the couple conceives later naturally with different sperm/egg, gamete essentialism insists it's a different person. Parental essentialism? Well... timing shifts might matter less if parents are fixed. But here's the rub: In natural conception, the exact gametes are tied to the conception moment. If they'd conceived earlier, those specific gametes wouldn't exist. So maybe parental essentialism handles this better by focusing on the parents' role rather than timing accidents. 

