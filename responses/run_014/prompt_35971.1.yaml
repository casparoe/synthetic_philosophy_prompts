answer: |-
  Here is a set of desiderata for an adequate species concept, grounded in biological phenomena and philosophical scrutiny. I've structured each requirement with its motivating case, assessed negotiability, and highlighted conflicts. A summary table and contender evaluation follow.

  ---

  ### **Desiderata for an Adequate Species Concept**  
  *(Non-negotiable = ★; Negotiable = ☆)*

  1. **Lineage-Based Reality**  
     - **Requirement**: Species must represent real evolutionary lineages (not arbitrary groupings).  
     - **Motivating Case**: Convergent evolution (e.g., marsupial vs. placental "wolves") shows morphology alone fails; lineages must have historical continuity. Bdelloid rotifers persist as distinct lineages despite asexuality.  
     - **Negotiability**: ★ (Core to evolutionary biology).  
     - **Conflict**: Clashes with purely morphological concepts ignoring phylogeny.

  2. **Asexuality Accommodation**  
     - **Requirement**: Must apply to fully asexual taxa (e.g., bdelloid rotifers, some fungi, prokaryotes).  
     - **Motivating Case**: Bdelloid rotifers have diversified into 500+ lineages over 40 million years without sexual reproduction. A concept excluding them ignores major biodiversity.  
     - **Negotiability**: ★ (Non-negotiable for universal applicability).  
     - **Conflict**: Biological Species Concept (BSC) fails here, as it requires sexual reproduction.

  3. **Gene Flow Gradient Handling**  
     - **Requirement**: Must address partial gene flow (ring species, hybrid zones, introgression).  
     - **Motivating Case**: *Ensatina* salamanders (ring species) show gradual divergence with gene flow between neighbors but not endpoints. Many plants (e.g., oaks) hybridize yet maintain distinctness.  
     - **Negotiability**: ★ (Ubiquitous in nature).  
     - **Conflict**: BSC struggles with ring species; strict monophyly (PSC) breaks in hybrid zones.

  4. **Operationalizability**  
     - **Requirement**: Must be applicable with standard evidence (morphology, DNA barcodes, ecology) without requiring field studies of mating.  
     - **Motivating Case**: Taxonomists classify extinct species (fossils), microbes, or specimens in museum drawers using traits or DNA. BSC’s "reproductive isolation" is often untestable.  
     - **Negotiability**: ★ (Practical necessity).  
     - **Conflict**: BSC is impractical here; ecological/morphological concepts gain ground.

  5. **Compatibility with Population Genetics**  
     - **Requirement**: Must align with mechanisms of cohesion/divergence (e.g., genetic drift, selection, gene flow).  
     - **Motivating Case**: *Anopheles* mosquito complexes show sibling species diverging via minor genomic changes despite morphological similarity.  
     - **Negotiability**: ★ (Foundational to modern biology).  
     - **Conflict**: Morphological concepts may overlook cryptic diversity.

  6. **Countability (Philosophical)**  
     - **Requirement**: Species should be discrete enough to count (enabling non-arbitrary classification).  
     - **Motivating Case**: Conservation policy (e.g., counting endangered species) and biogeography demand quantifiable units.  
     - **Negotiability**: ☆ (Countability is ideal but may conflict with continuity in nature).  
     - **Conflict**: Clines, ring species, and hybridization challenge discreteness.

  7. **Species as Individuals (Philosophical)**  
     - **Requirement**: Should treat species as spatiotemporally bounded "individuals" (lineages), not abstract classes.  
     - **Motivating Case**: Lineages evolve as single entities; classes don’t originate or go extinct.  
     - **Negotiability**: ★ for evolutionary concepts (lineages are fundamental); ☆ for others.  
     - **Conflict**: Pluralism may require treating some groups as classes (e.g., asexual clones).

  8. **Universality vs. Pluralism**  
     - **Requirement**: Should one concept apply to all life?  
     - **Motivating Case**: Prokaryotes (horizontal gene transfer) vs. vertebrates (vertical descent) face different evolutionary dynamics.  
     - **Negotiability**: ☆ (Universality is likely a bias; pluralism may be necessary).  
     - **Conflict**: Strict universality forces Procrustean compromises (e.g., forcing BSC onto bacteria).

  ---

  ### **Key Conflicts in Desiderata**  
  - **Monophyly vs. Reticulation**: Strict phylogenetic monophyly (PSC) fails with hybridization (Requirement #3). *Conflict: Monophyly + gene flow handling = unsatisfiable*.  
  - **Countability vs. Continuity**: Ring species/gradients defy discrete counts (Requirement #6). *Conflict: Countability + gene flow = unsatisfiable*.  
  - **Universality vs. Practicality**: No concept excels across all domains (Requirement #8). *Conflict: Universality + operationalizability = likely unsatisfiable*.

  ---

  ### **Summary Table: Desiderata vs. Major Concepts**  

  | Desideratum               | Biological (BSC) | Phylogenetic (PSC) | Ecological (ESC) | Morphological (MSC) | General Lineage (GLC) |  
  |---------------------------|------------------|--------------------|------------------|---------------------|-----------------------|  
  | 1. Lineage-Based Reality  | Partial¹         | ★                  | ★                | △²                  | ★                     |  
  | 2. Asexuality             | ✘                | ★                  | ★                | ★                   | ★                     |  
  | 3. Gene Flow Gradients    | △³               | △⁴                 | ★                | △²                  | ★                     |  
  | 4. Operationalizability   | ✘                | △⁵                 | ★                | ★                   | ★                     |  
  | 5. Population Genetics    | ★                | ★                  | ★                | ✘                   | ★                     |  
  | 6. Countability           | ★                | ★                  | △⁶               | ★                   | △⁶                    |  
  | 7. Species as Individuals | ★                | ★                  | ★                | ✘                   | ★                     |  
  | 8. Universality           | ✘                | △⁷                 | △⁶               | ★                   | ★                     |  

  **Key**: ★ = Strong; △ = Partial/Contextual; ✘ = Weak  
  *Footnotes*:  
  1. BSC implies lineages but ignores asexuals.  
  2. MSC works if morphology reflects lineage, but often discordant (cryptic species).  
  3. BSC fails at ring species; treats hybridization as "not species."  
  4. PSC struggles with non-monophyletic hybrids.  
  5. Requires robust phylogenies (often unavailable).  
  6. ESC/MSC/GLC may lack clear boundaries in continua.  
  7. PSC applies universally but forces monophyly where inappropriate (e.g., hybrids).  

  ---

  ### **Conclusion: The Core Tension**  
  The species problem persists because **lineage reality**, **asexuality**, **gene flow**, and **operationalizability** are non-negotiable—yet no concept satisfies all simultaneously. The Biological Concept (BSC) fails asexuals and ring species; the Phylogenetic Concept (PSC) struggles with reticulation; Morphological and Ecological concepts risk subjectivity. The General Lineage Concept (integrating lineages + cohesion mechanisms) comes closest but accepts pluralism in defining "cohesion."  

  **Result**: The desiderata reveal that *dropping strict universality or monophyly* is necessary. A pluralist framework—applying different criteria (e.g., reproductive isolation for vertebrates, monophyly for fungi, ecological divergence for bacteria)—may be the only path to adequacy. The "species problem" isn’t solvable by a single concept; it requires conceding that species are theory-laden units serving context-dependent purposes.
