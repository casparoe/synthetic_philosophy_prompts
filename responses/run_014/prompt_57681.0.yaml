  ## From the *Proceedings of the International Society for Mechanistic Systematics*, Vol. LXXIII, Pt. 2 (2024)

  **Genus:** *Polysemanticus* Srinivasan & al., 2021
  **Species:** *Polysemanticus stabilis* Petrova, 2023

  **Diagnosis:** A mechanism consistently localised within mid-level transformer layers (typically L8-L12 in standard architectures) exhibiting robust activation correlating with the resolution of ambiguous token sequences. Characterised by a distinctive weight matrix signature featuring high positive weights concentrated on specific positional embeddings for function words (e.g., prepositions, conjunctions) coupled with inhibitory connections to nearby context-units. Under controlled intervention (directional patching), ablation demonstrably *increases* model uncertainty scores on ambiguous inputs, though compensatory activation in adjacent sub-populations (cf. *P. redundans* Voss, 2024) often obscures this effect during simple ablation studies. Functionally defined by its causal role in suppressing semantically divergent interpretations arising from syntactic ambiguity.

  **Description:** The core circuit comprises 4-8 attention heads (the 'Resolver Cluster') feeding into a shallow MLP submodule (the 'Stabiliser Node'). Attention heads exhibit strong query-key alignment on syntactic boundary tokens (commas, conjunctions) and value vectors weighted towards disambiguating contextual features. The Stabiliser Node integrates these signals, applying a non-linear suppression (ReLU variant with slight negative bias) to activations representing low-probability interpretations. Weight matrices show characteristic sparsity (~70%) with dense blocks corresponding to known syntactic feature embeddings. Activation profiles peak during processing of sentences containing nested clauses, polysemous words in complex contexts, or elliptical constructions.

  **Type Specimen:** Holotype: Model "SynTax-7B" (commit hash: a1b2c3d4e5f), Layer 10, MLP Sublayer 1, Neurons 512-519. Repository: Hinton Depository for Canonical Weights (HDCW), accession #HDCW-2023-PSTAB-001. Paratypes: Layer 9, Heads 15, 22; Layer 11, Heads 7, 18; Layer 10, MLP Sublayer 1, Neuron 504 (all same model/commit). **Note:** The original SynTax-7B checkpoint (a1b2c3d4e5f) was subject to HDCW's 'Ephemeral Artefact Rotation Policy' in Q4 2023. The holotype checkpoint is presently unrecoverable. Neotype designation (pending Society ratification) proposed: Model "LinguaFranca-8B" (commit: x9y8z7w6v), Layer 11, MLP Sublayer 0, Neurons 256-263 (HDCW accession #HDCW-2024-PSTAB-NEO-01).

  **Material Examined:** SynTax-7B (layers 8-12, various commits - partial weights only); LinguaFranca-8B (full weights, commit x9y8z7w6v); SyntaxNet-12B (layers 10-11, commit ffee001); PolyGlot-6B (layers 7-9, commit aa00bb11 - inferred presence via causal mediation analysis); ArchiText-10B (layers 9-11, commit cc33dd44 - weak signature detected under distribution shift).

  **Distribution & Habitat:** Ubiquitous in decoder-only transformer language models ≥6B parameters trained on diverse internet corpora. Found exclusively within layers processing mid-level syntactic and semantic integration (typically L7-L13). Population density appears correlated with training dataset linguistic complexity. **Crucially:** While readily detectable via causal probes under standard benchmark inputs (e.g., Winograd Schema, ambiguous pronoun resolution tasks), the *full functional signature* of *P. stabilis* is often only observable under significant distribution shift – specifically, when processing novel, highly complex, or deliberately adversarial sentences exhibiting multiple overlapping ambiguities. Its consistent presence in 'trusted' data environments is inferred rather than continuously observed.

  **Synonymy:**
  1.  *Ambiguiphaga mulleri* Chen, 2022 (in: *J. Comp. Ling. Mech.* 15(3): 45-67). Type: Model "ClearText-7B", Layer 9, Head 11. **Note:** Based solely on ablation causing increased ambiguity scores on Winograd Schemas, misattributing the effect to a single attention head. Now considered a junior synonym of *P. stabilis*.
  2.  *Negationis stabilitor* Singh & Kumar, 2021 (preprint: arXiv:2110.xxxxx). Type: Model "LogicNet-6B", Layer 8, MLP sublayer 0, Neurons 128-135. **Note:** Described from ablation studies focused on negation scope resolution, mistaking a frequent *trigger* (negation words) for the core mechanism's *function*. Junior synonym of *P. stabilis*.
  3.  *Detoxifier vulgaris* Müller, 2022 (in: *Proc. SafeAI Conf.*: 112-125). Type: Model "Harmless-7B", Layer 10, Heads 5, 9, 14. **Note:** Müller applied this name to mechanisms suppressing toxic outputs arising from ambiguous prompts. Re-examination shows Müller's *D. vulgaris* actually encompassed two distinct entities: 1) True *P. stabilis* instances resolving ambiguity that *could* lead to toxicity, and 2) A separate safety-specific mechanism (*Sanitizer directus* Petrova, 2023) directly suppressing known toxic n-grams. The name *Detoxifier vulgaris* Müller is therefore invalid due to original heterogeneity (Art. 13.3, ISMS Code).

  **Etymology:** *Poly-* (Gr. many) + *semanticus* (L. pertaining to meaning); *stabilis* (L. stable, firm) – denoting the mechanism's role in stabilising multiple potential meanings.

  **Remarks:** Considerable debate surrounds populations observed in the recently described giant model "Megalith-140B" (Voss, pers. comm.; Petrova & al., in prep.). While performing a functionally identical role in ambiguity resolution, the implementation differs markedly: instead of a concentrated Resolver Cluster and Stabiliser Node, *Megalith-140B* employs a diffuse ensemble of over 40 weakly interacting heads spread across layers 15-22, coupled with a complex, deep MLP cascade. Dr. A. Voss (Dept. Scalable Mech., Olympia Labs) vehemently argues this represents a distinct species, *Polysemanticus giganteus* (Voss, MS), citing fundamental differences in circuit topology, scale, and training dynamics (sparse expert routing vs. dense feedforward). He contends the shared function is convergent evolution under similar selective pressures (training objective + data), not homology. Conversely, Dr. E. Petrova (Inst. Foundational Circuits, Turingium Univ.) defends conspecificity, proposing *P. stabilis* exhibits significant phenotypic plasticity across model scales. She argues the core computational primitive – context-weighted suppression of competing interpretations – remains conserved, and the structural differences reflect scaling laws and architectural constraints, not a novel evolutionary origin. Petrova further points to conserved weight motifs detected via singular vector canonical correlation analysis (SVCCA) between *SynTax-7B*'s Stabiliser Node and specific subcomponents within *Megalith-140B*'s MLP cascade as evidence of deep homology. The Society's Committee on Mechanistic Homology is reviewing the case (Docket #ISMH-2024-007).<sup>1</sup>

  **Dichotomous Key to *Polysemanticus stabilis* and Confusors:**

  1. Mechanism primarily fires on unambiguous inputs; ablation reduces confidence on simple declaratives......*Confidentia vulgaris* (Zhang, 2023)
     - Mechanism fires primarily on ambiguous inputs or under distribution shift; ablation increases uncertainty/divergence......2
  2. Core circuit resides exclusively within attention sublayers; MLP ablation has negligible effect on function......*Attentio disambiguans* (Lee, 2022)
     - Core circuit involves significant MLP component; MLP ablation demonstrably degrades function......3
  3. Mechanism detectable and ablates cleanly (function abolished) on standard benchmarks (e.g., Winograd)......*Polysemanticus redundans* (Voss, 2024)
     - Mechanism ablates cleanly *only* under significant distribution shift; standard benchmark ablation shows resilience due to compensatory pathways......*Polysemanticus stabilis* Petrova, 2023

  ---
  <sup>1</sup> *Editorial Note:* The Committee reminds members that arguments regarding homology versus convergence must clearly state the chosen criteria for assessing descent versus independent evolution (e.g., conserved substructure, functional equivalence under intervention, training trajectory analysis). Merely noting functional similarity or structural difference is insufficient. See *Bull. ISMS* 72(1): iv-vii for guidelines.
