prompt: |-
  Please describe the most important implications of Frank Jackson's knowledge argument — the thought experiment in which Mary, a brilliant neuroscientist who has spent her entire life in a black-and-white room, learns every physical fact about colour vision, and then sees red for the first time upon leaving the room — for the thesis that a complete physical description of the universe would be a complete description simpliciter. Focus on what the argument, if successful, would entail for the scope and limits of scientific explanation, and on what kinds of facts would resist capture by even an ideal completed science.
