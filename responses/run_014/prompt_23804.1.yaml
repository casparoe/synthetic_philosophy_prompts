prompt: |-
  I've been slowly working through Montaigne's essays on my own time (never studied philosophy, I just got curious after a mate at the pub brought up "cultural relativism" and said it basically starts with this guy). I ended up reading a free copy online that uses the old 1603 John Florio translation instead of a modern one, partly because I read that this is literally the version Shakespeare owned and pulled from for that speech Gonzalo gives in The Tempest about the ideal commonwealth, which I thought was a fun detail. Anyway Ive been stuck for days now on "Of the Caniballes" because I think Montaigne flat out contradicts himself in it, and I cant tell if thats really there or if Im just misreading the old spelling.

  Early in the essay he sets up what I took to be the whole point of the piece: "Now to returne to my purpose I finde (as farre as I have beene informed) there is nothing in that nation that is either barbarous or savage, unless men call that barbarisme which is not common to them. As indeed, we have no other ayme of truth and reason, than the example and Idea of the opinions and customes of the countrie we live in. There is ever perfect religion, perfect policie, perfect and compleat use of all things." Fine, I read that as: "barbarous" just means "not what I'm used to," there's no neutral standpoint to judge from, so nobody's customs beat anybody else's. Straightforward relativism. But a few pages later, defending the cannibals eating their dead war captives against how Europeans treated prisoners, he writes: "I thinke there is more barbarisme in eating men alive, than to feed upon them being dead [...] and to make dogs and swine to gnaw and teare him in mammocks [...] under pretence of pietie and religion [...] than to roast and eat him after he is dead. [...] We may then well call them barbarous, in regard to reasons rules, but not in respect of us that exceed them in all kindes of barbarisme." And then, a bit further on, praising their war-songs and love-songs: "I am so conversant with Poesie that I may judge this invention hath no barbarisme at all in it, but is altogether Anacreontike. Their language is a kinde of pleasant speech, and hath a pleasing sound, and some affinitie with the Greeke terminations." That second batch doesn't read like relativism to me at all anymore — "reasons rules" sounds like an actual yardstick both cultures get held up against (and Europe loses), and grading their poetry against Anacreon is just Montaigne ranking them as good by a very specific, very Greek, very non-neutral standard. So which is it: does the opening passage not say what I think it says, does he just quietly drop his own relativism once it's inconvenient, or is there a reading where all three bits are consistent and I'm the one missing something?

  Could you actually help me work through this rather than just telling me "scholars disagree on it"? I'd like it in four labelled sections: "What each passage is claiming" (~150 words) — a plain paraphrase of the three quotes, stripped of the spelling, so we're starting from the same place; "Is it actually a contradiction" (~150 words) — your honest yes-or-no-with-reasons on whether the opening line and the later two can both hold at once; "The best way to make it hang together" (~200 words) — if there's a reading that resolves or at least softens the tension, walk me through it step by step; and "Where you'd correct my framing" (~100 words) — any way I've set up the puzzle badly myself, e.g. maybe I'm wrong to assume "barbarous" has to mean the same thing every time it shows up. No need to point me toward books or papers on this one, I just want to reason it out with you directly.
