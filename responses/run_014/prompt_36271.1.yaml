  - **Case A (factory pollution)**: Maya will say **only Factory 2 (the illegal dumper) caused the fish kill**, not Factory 1.  
    *Reasoning*: Factory 2's discharge violates a norm (illegal dump), while Factory 1's is "supposed to happen" (within permit). This mirrors Case 5 (match caused, oxygen didn't) and Case 4 (gardener caused, others didn't), where norm violations are prioritized. Physically, both are necessary, but the norm violation defines causation here.

  - **Case B (night guard)**: Maya will say **no, the guard's rule-following did NOT cause the theft**.  
    *Reasoning*: The guard followed the manual ("what was supposed to happen"), so their inaction isn't a deviation. This aligns with Case 4 (others didn't water, no cause) and Case 5 (oxygen wasn't a cause). Wiggling the guard—making them violate the manual to patrol—would prevent the theft, but since that violates the norm, it's not a valid intervention for causation. The fault lies with the manual or the thief, not the norm-compliant guard.

  - **Case C (pen with system crash)**: Maya will say **no, the professor did NOT cause the form failure**.  
