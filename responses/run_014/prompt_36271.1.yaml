  ### The Rule Maya is Running Under
  Maya's approach combines **interventionist counterfactuals ("wiggling") with norm-based pruning ("what was supposed to happen")**. Here's how it works:
  1. **Interventionist core ("wiggling")**: She tests causation by asking if changing (intervening on) a candidate cause while holding other factors fixed would change the outcome. This is clearest in Cases 1, 2, and 5.
  2. **Norm-based pruning ("supposed to happen")**: She restricts candidate causes to events that violate norms, obligations, or expectations. Background conditions (Case 5 oxygen), norm-compliant actions (Case 4 others not watering), or preempted events (Case 2 Billy) are excluded even if they are physically necessary. Norms define what counts as a "cause" versus "background."
  3. **Overdetermination handling**: When multiple sufficient causes occur simultaneously (Case 3), both are causes if neither is preempted and both are "active" violations or interventions. But if norms or preemption apply (Case 2), she prunes.

  **Real work distribution**:  
  - The **interventionist test** does the heavy lifting for physical dependence (e.g., wiggling Suzy changes the outcome, wiggling Billy doesn't).  
  - The **norm-based pruning** filters candidate causes upfront. It resolves ambiguities by excluding norm-compliant factors (e.g., oxygen, Factory 1, others not watering) even if they pass interventionist tests.  

