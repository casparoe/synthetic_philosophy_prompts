prompt: |-
  A colleague in my department studies hinge epistemology — the Wittgensteinian view that certain propositions function as "hinges" exempt from doubt, forming the scaffolding that makes inquiry possible. Over several conversations, I've collected her verdicts on which propositions count as hinges:

  - "Here is a hand" (said while holding up a hand in normal conditions): hinge.
  - "The earth existed before my birth": hinge.
  - "Water is H2O": not a hinge.
  - "I have a body": hinge.
  - "The sun will rise tomorrow": not a hinge.
  - "There are other minds": hinge.
  - "2 + 2 = 4": hinge.
  - "Paris is the capital of France": not a hinge.
  - "I have never been to the moon": hinge.
  - "The Battle of Hastings was in 1066": not a hinge.

  Next week we're discussing whether "I am not now dreaming" is a hinge proposition. I want your best prediction of her verdict, but more importantly, I want you to identify the candidate rules or criteria she seems to be running — there should be at least two distinct principles that fit her verdicts equally well but diverge on the dreaming case. For each candidate rule, say what it predicts about the dreaming case and why. Then give your best guess about which rule she actually holds, with your reasons for preferring it, and name the further test case that would most cleanly settle which rule she is using.

  Throughout, separate what is settled among hinge epistemologists from what is genuinely contested, and do not present a contested interpretation as the consensus. Keep your answer to at most 400 words.
reasoning: |-
  Hmm, the user is asking about hinge epistemology based on their colleague's verdicts. I need to recall what hinge epistemology is—it's Wittgenstein's idea from "On Certainty" where some propositions are like hinges that don't move; they're foundational and immune to doubt, allowing other inquiries to happen.

  Looking at the colleague's verdicts: she classifies some as hinges, like "Here is a hand" and "I have a body," which are basic sensory or existential certainties. Others are not hinges, such as "Water is H2O" or "The sun will rise tomorrow," which seem empirical or scientific. Then there are mixed cases like "2 + 2 = 4" as a hinge, but "Paris is the capital of France" not, indicating that not all necessary truths are hinges if they're historical or contingent.

  The key question is about "I am not now dreaming." I have to predict her verdict and find at least two candidate rules that fit her existing judgments but diverge on this case. From the data, I see patterns: hinges often involve immediate, indubitable experiences or core aspects of reality, while non-hinges are about external facts or predictions.

  Candidate Rule 1: Hinges are propositions that are immune to reasonable doubt in ordinary contexts and necessary for coherent experience. This would include things like having hands or a body because doubting them would make everyday life impossible. For "I am not now dreaming," this rule might predict it's a hinge because serious doubt could undermine all perception—I can't function if I'm constantly questioning if I'm awake. That aligns with Cartesian skepticism defenses.

  Candidate Rule 2: Hinges are only propositions whose denial is literally inconceivable within our form of life. For example, "I have never been to the moon" is a hinge because it's unimaginable for most people, but "I am not now dreaming" might not be, as Descartes famously considered it, so it could be doubted in philosophical contexts. This rule might say it's not a hinge because we can conceive of dreaming scenarios.

  Both rules fit the data equally well. For instance, "The sun will rise tomorrow" isn't a hinge under both—it's predictable but not inconceivably denied, and it's not foundational for experience. Now, I need to guess which rule she actually holds. I'm leaning toward Rule 1 because "I have never been to the moon" is classified as a hinge, which isn't inconceivable (astronauts exist), but it's practically certain for ordinary life. Also, hinge epistemology often focuses on enabling inquiry, so doubt about dreaming could paralyze it.

  To settle this, I propose a test case: "My senses are generally reliable." If she says it's a hinge, it supports Rule 1, as it's necessary for experience. If not, it might align with Rule 2 if she thinks reliability can be questioned. I have to be careful not to present contested views as consensus—Wittgenstein scholars debate the exact criteria, so I'm basing this on the colleague's specific verdicts.

  Finally, my best prediction: she'll say "I am not now dreaming" is a hinge, as it's crucial for epistemic stability in everyday contexts, matching the pattern in her list.
answer: |-
  Based on your colleague's verdicts and standard hinge epistemology (where hinges are framework propositions enabling doubt/inquiry, a settled core idea), two candidate rules fitting her judgments equally well are:

  1.  **Rule 1 (Enabling Basic Interaction):** A proposition is a hinge if doubting it *in an ordinary context* would cripple the possibility of coherent action, perception, or interaction with the world. This fits hinges like "Here is a hand," "I have a body," and "I have never been to the moon" (doubt paralyzes basic interaction). Non-hinges like "Water is H2O" or "The sun will rise tomorrow" can be doubted without collapsing everyday interaction. *Prediction for dreaming:* **Hinge.** Doubting one is not dreaming directly undermines the trust in perception necessary for any interaction or inquiry (like "Here is a hand").

  2.  **Rule 2 (Framework Certainty, not Skepticism-Fuel):** A proposition is a hinge only if its certainty is *constitutive* of our framework for inquiry *and* it is not *primarily* invoked by radical skeptical scenarios (like Descartes' demon). This fits the same hinges as Rule 1 ("Here is a hand," "I have a body") and non-hinges. Crucially, it excludes propositions *defined* by their role in skeptical arguments, even if foundational. *Prediction for dreaming:* **Not a hinge.** "I am not now dreaming" is paradigmatically a Cartesian skeptical tool. While its truth is necessary, its *status as a proposition* is tied to radical doubt, not the quiet framework certainty of hinges like "I have a body."

  **Best Guess & Reason:** She likely uses **Rule 1 (Enabling Basic Interaction)**. Her hinge verdicts ("I have never been to the moon," "Here is a hand") emphasize practical, embodied certainty necessary for navigating the world, aligning more with Wittgenstein's focus on action than abstract responses to skepticism. Rule 2's skepticism-based exclusion seems less central in her list.

  **Settled vs. Contested:** The *functional role* of hinges (enabling doubt/inquiry) is settled. The *exact criteria* for identifying them (e.g., the role of skeptical scenarios, the nature of "framework") is highly contested among hinge epistemologists.

  **Test Case:** "My sensory experiences are generally reliable."  
  *   Rule 1 predicts **Hinge** (doubt cripples perception/interaction).  
  *   Rule 2 *might* predict **Not a hinge** (it's central to skeptical arguments like dreaming/demon). This cleanly distinguishes the rules.
