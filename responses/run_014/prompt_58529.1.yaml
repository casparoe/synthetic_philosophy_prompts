  I need to ensure the examples are distinct. The sharpness trait remains a byproduct because its current effect (deterrence) isn't under selection. The hook, however, is now under stabilizing selection because mutations affecting the hook impact fitness through dispersal. Conflating the two could mislead experiments; for instance, assuming sharpness is an adaptation might lead to unnecessary tests on herbivore deterrence instead of focusing on water conservation.

  The user also asks about evidence patterns. For the persistent byproduct (sharpness), manipulation experiments (smoothing thorns) show no fitness change. Comparative studies wouldn't show a link between herbivory and sharpness. For the co-opted trait (hook), altering it reduces seed dispersal fitness, and related species without hooks lack that dispersal method. Artificial selection could reshape the hook if it's adaptive, but not if it's just a byproduct.

