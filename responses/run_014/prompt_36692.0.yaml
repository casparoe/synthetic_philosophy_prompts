prompt: |-
  I write literary fiction, and my working vocabulary is a novelist's: point of view, what a character knows versus what the reader knows, interiority, stakes, whether a choice a character makes reads as authored by that character or by whoever set the scene around her. I keep having to make calls about consent on the page — a marriage proposal made under an alias, a confession of love extracted at a funeral, an inheritance accepted by a character I've written as suggestible — and I'd like to understand what the philosophers actually say, in my terms rather than theirs. Please restate the standard philosophical account of what makes consent valid — the competence condition, the requirement of sufficient information, and the coercion condition — in the vocabulary I use, as faithfully as you can. Along the way I'd like you to handle three distinctions that I suspect matter: the distinction between deception about something that bypasses the will (a lie about the nature of the act) and mere non-disclosure or deception about circumstances that only make the act more attractive; the difference between an offer that widens a character's options and a threat that narrows them, including the hard cases where the person doing the offering created the desperation in the first place; and the difference between a defect in consent that makes the act wrong and a defect that makes it not consent at all. Then give me the residue report: which of these distinctions have no expression in a novelist's toolkit, whether the ones I do have (dramatic irony, unreliable narration, the sense that a character's "yes" is or is not hers) are doing the same work or different work, and whether the residue suggests my toolkit is missing something the philosophers see or that the philosophical framework is less clear than it looks. Please write the answer in American English.
reasoning: |-
  Okay, let me approach this novelist's request with care. They're working with complex consent scenarios in literary fiction - proposals under aliases, confessions at funerals, suggestible heirs - and want philosophical concepts translated into their craft terms. 

  First, I need to unpack the core philosophical framework of valid consent: competence, information, and non-coercion. But the real challenge lies in mapping these to narrative devices like POV, dramatic irony, and character interiority. The novelist specifically flagged three key distinctions that'll require special handling:

  That deception/non-disclosure boundary feels particularly crucial for their examples. When a character proposes under false identity, that's not just withholding information - it fundamentally alters the nature of the "yes". I should contrast this with, say, not mentioning a bad investment when someone accepts an inheritance, where the act itself remains intact.

  The threat/offer distinction matters for their funeral confession scenario. If Character A confesses love when Character B is emotionally vulnerable, is that exploiting circumstances A created? Philosophers would analyze whether options are being expanded or constricted. 

  And finally, the gradient between flawed consent (might be forgivable) and void consent (never existed). This resonates with how novelists show when a "yes" feels authentic versus performative.

  As I reframe these concepts, I'll watch for gaps between philosophical precision and narrative tools. For instance: dramatic irony reveals information gaps to readers, but may not clarify whether those gaps invalidate consent. Unreliable narration might actually align well with competence questions.

  The residue analysis will need to examine which philosophical distinctions collapse in fiction. Like whether "offer versus threat" loses nuance when filtered through a character's subjective experience. And if novelists can show void consent through subtext where philosophers require explicit criteria.

  Throughout, I'll maintain their requested American English while preserving the textured vocabulary they brought - "interiority", "stakes", "authored by the character". The examples they provided (the alias proposal, the funeral confession) will serve as anchor points.
answer: |-
  Here's the philosophical framework of valid consent translated into your novelist's toolkit, with explicit handling of your three distinctions, followed by the residue report:

  **The Philosophical Blueprint for a Character's "Yes" (in Your Terms)**

  1.  **Competence (The Character's Mind is Their Own):**
      *   **The Core:** Can this character *truly* hold the point of view they're expressing? Does their "yes" emerge from their established interiority, their known desires and fears, their understanding of the world? Or is it a puppet string pulled by intoxication, overwhelming distress, mental incapacity, or extreme youth that prevents them from grasping the stakes?
      *   **On the Page:** This is where you show *why* the character says yes. Is it a choice authored *by them*, consistent with their inner world and what the reader knows they know? Or is it authored *by their circumstance* overriding their will? A suggestible heir accepting an inheritance might show competence wavering if their suggestibility borders on delusion or profound lack of self-possession, making the "yes" feel less like *their* choice and more like an echo.

  2.  **Sufficient Information (Seeing the Scene Clearly):**
      *   **The Core:** What does the character *believe* is happening when they say yes? Does their understanding of the act's nature and its probable consequences align with the reality of the scene? Crucially, **does the deception/non-disclosure change *what the act fundamentally is* in their mind, or just *why they might want it*?**
      *   **Distinction Handled (Bypassing the Will vs. Making it Appealing):**
          *   **Bypassing the Will (Lies about the Act Itself):** This is dramatic irony used lethally. If a character consents to a marriage proposal believing the suitor is "John Smith," but he's actually "Lord Blackwood" using an alias *to secure the marriage he couldn't get otherwise*, the deception fundamentally alters *what the act is* for her. She consented to marry *John Smith*, a specific person with a specific (false) history and status. She did *not* consent to marry Lord Blackwood. The lie isn't just a sweetener; it rewrites the core proposition. Her "yes" belongs to a different scene entirely. This invalidates consent entirely.
          *   **Making it Appealing (Non-disclosure/Lies about Circumstances):** Here, the character understands the *core act* but is missing context that affects its desirability or consequences. The heir accepts the inheritance knowing it's money/assets (the core act), but isn't told it's tied to a morally repugnant condition or comes with massive hidden debt. The *nature of accepting the inheritance* is understood; the *full picture of why it might be terrible* is hidden. This makes the consent flawed, possibly deeply wrong, but doesn't necessarily mean *no consent to accepting the inheritance* occurred. The stakes are misperceived, not the act itself.
      *   **On the Page:** This is the realm of unreliable narration (if from the deceived character's POV) or heavy dramatic irony (if the reader sees the truth). The key question is: "If they knew X, would they still see themselves as performing *the same act*?"

  3.  **Absence of Coercion (The Choice is Unforced):**
      *   **The Core:** Does the character feel they have a *genuine*, acceptable alternative to saying "yes"? Or is saying "no" presented (explicitly or implicitly) as leading to unbearable consequences, forcing their hand? The "yes" must feel authored by their own desires within their circumstances, not dictated by overwhelming pressure *imposed by the person seeking consent*.
      *   **Distinction Handled (Offer vs. Threat):**
          *   **Offer (Widening Options):** "I love you. If you feel the same, we could be together." This presents a new, positive possibility without diminishing the character's existing options. Saying "no" leaves them no worse off than before the offer.
          *   **Threat (Narrowing Options):** "Confess you love me now, at the funeral, while everyone is vulnerable, or I will reveal your secret and destroy your family." Saying "no" brings severe, *new* punishment. The coercer creates an artificial ultimatum forcing the choice.
          *   **The Hard Case (Created Desperation):** This is where the *backstory* becomes crucial. Did the coercer *engineer* the desperate circumstances making the threat so potent? (e.g., Character A manipulates events leading to Character B's financial ruin, *then* "offers" a loan with exploitative conditions). Philosophically, if the coercer is *responsible* for the baseline desperation that makes the threat effective, it's often still coercion. The "offer" isn't relief; it's a trap sprung on a situation they manufactured. The character's "yes" feels authored *by the trap*, not by their own will within a difficult situation.
      *   **On the Page:** This lives in the character's interiority – the palpable fear, the sense of trapped inevitability, the weighing of terrible options where "no" feels impossible. The stakes feel external and crushing, not internal and motivating. A confession extracted at a funeral leverages existing vulnerability (grief) *plus* the coercive pressure ("say it *now* or lose me forever/face ruin"), making the "yes" feel ripped from them, not given.

  **The "Wrong" vs. "Not Consent" Distinction:**
  *   **Not Consent At All (Void Choice):** This happens when consent fails at a fundamental level. The character lacked the mental capacity to truly choose (incompetence). *Or* they were deceived about the *essential nature of the act itself* (e.g., marrying the wrong person). *Or* their "yes" was purely a reaction to an overwhelming threat that removed any real alternative (coercion). There is no valid "yes" on the page; it’s a phantom. The act proceeds *without* their agreement, even if they spoke words.
  *   **Flawed Consent (Wrong but Consented):** Here, a "yes" exists, but it's tainted. The character was competent and understood the core act, but:
      *   They lacked *important information* affecting consequences (the inheritance's hidden debt/condition).
      *   They were pressured by circumstances *not directly created as a threat by the coercer* (e.g., confessing love during shared grief without an explicit ultimatum, driven by overwhelming emotion rather than external threat).
      *   They were deceived about *collateral facts* that made the act desirable (but not about the act's essence).
      The character *did* choose, based on the (flawed) perspective they had. The act might be deeply unethical, exploitative, or harmful *because* of the flaw, but philosophically, consent *to the core act* occurred. The wrongness lies in the deception, pressure, or exploitation, not in the complete absence of agreement.

  ---

  **Residue Report: Where Philosophy and Fiction Diverge**

  1.  **Distinctions with Blurred Lines in Fiction:**
      *   **Offer vs. Threat (Especially Created Desperation):** Your toolkit excels at showing *impact* (fear, trapped feeling) but struggles with the *philosophical causality* of who created the baseline desperation. Readers might *feel* coercion strongly even if the coercer didn't *directly* cause the underlying vulnerability (e.g., exploiting pre-existing poverty). The novelist focuses on the character's *lived experience* of having no choice. The philosopher obsesses over the *attribution of responsibility* for that lack of choice. Your tools ("stakes," "pressure," "interiority") capture the experiential reality perfectly but blur the precise philosophical line about responsibility for the baseline. This might be a *strength* of fiction, showing the messy reality.
      *   **Flawed Consent vs. No Consent:** Your tools (dramatic irony, interiority, unreliable narration) are brilliant at showing the *spectrum* of compromised will. However, the philosopher's bright line between "void" (wrong about the act itself) and "flawed" (wrong about context/consequences) can feel artificial on the page. Does the heir who didn't know about the repugnant condition *truly* consent to *inheriting under those terms*? Fiction naturally explores the grey area where a "yes" can feel both present *and* fundamentally invalidated by new understanding. Your toolkit leans into the ambiguity; philosophy tries to categorize it.

  2.  **Your Toolkit's Strengths (Doing Similar & Different Work):**
      *   **Dramatic Irony:** Directly parallels the philosopher's "sufficient information" condition, but for the *reader*. It brilliantly highlights *what the character doesn't know*, creating tension and setting up the potential flaw or void in consent. It *shows* the information gap central to the philosophical analysis.
      *   **Unreliable Narration:** Deeply connected to **competence** and **information**. An unreliable narrator might reveal their own lack of competence (through delusion, denial, incoherence) or demonstrate how their lack of information distorts their perception of the act. It embodies the *subjective experience* of consent or its flaws from within.
      *   **Interiority / "Is the 'Yes' Hers?":** This is your core tool for exploring **all three conditions**. It shows competence (is the thought process coherent? self-aware?), reveals gaps in understanding (what *does* she think is happening?), and exposes the feeling of coercion or freedom. This *does the same work* as the philosopher's analysis but at the visceral, experiential level. It answers the question: "From *her* point of view, does this 'yes' feel like *her* choice, given what *she* knows and feels pressured by?" Philosophy analyzes the objective validity; interiority shows the subjective reality.

  3.  **The Residue & What it Suggests:**
      *   **Philosophical Blind Spot (Your Toolkit's Insight):** Philosophy strives for clean categories ("void" vs. "flawed," "coercer-created desperation"). Your novelist's toolkit reveals how messy, subjective, and experiential consent truly is. The heir's "yes," even with full information competence and no direct threat, might *feel* authored by their suggestibility, existing in a grey zone philosophy struggles to box. Fiction captures the *lived ambiguity* where a "yes" can be legally or philosophically "valid" yet feel deeply inauthentic or coerced by life's circumstances, not a specific person. Your toolkit exposes the *emotional and narrative weight* of consent flaws that philosophy might categorize as less severe.
      *   **Potential Gap in Your Toolkit? (Philosophy's Insight):** The precise distinction between deception about the **act itself** (voiding consent) vs. deception about **collateral circumstances** (flawing it) is crucial philosophically but can be subtle dramatically. While you *can* show it (the marriage alias vs. the hidden debt), there's a risk readers might conflate them, seeing both as equally invalidating. Your tools might need extra emphasis (through POV, consequence, or thematic framing) to highlight when deception fundamentally changes *what the character believes they are doing* versus just *why they're doing it*. Philosophy insists this line matters; fiction needs to work harder to make that distinction clear *to the reader* if that's your intent.
      *   **Clarity vs. Complexity:** The philosophical framework *is* less clear than it looks when applied to the rich ambiguity of human behavior you depict. Your residue shows that fiction doesn't just illustrate philosophy; it *complicates* it, revealing nuances and subjective experiences that the framework simplifies or struggles to contain. Your toolkit isn't missing the core concepts; it's grappling with their application in the messier reality of character and story. The philosopher sees the blueprint; you show the lived-in house with all its creaks, shadows, and unexpected corners.

  **In essence:** You have the tools to explore the *heart* of consent – competence, understanding, and freedom – through your focus on point of view, interiority, and stakes. Philosophy provides a valuable analytical lens, particularly for the deception distinction and coercion mechanics. However, your novelist's craft captures the profound ambiguity, subjectivity, and emotional weight of consent that philosophy's categories sometimes oversimplify. The residue isn't a lack in your toolkit, but evidence of fiction's power to explore the human complexities that exist beyond the philosopher's clean definitions. Your tools are doing the deep, experiential work that makes consent compelling *on the page*.
