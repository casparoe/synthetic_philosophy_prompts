  Let's draft each with follow-up:

  Question 1 (Two-bitser):
     Main: The two-bitser thought experiment shows that a simple physical device can be interpreted as representing different things (e.g., as a two-bitser or a q-balber) without any change to its internal workings. How does this thought experiment challenge the idea of intrinsic intentional content?
     Likely answer: The device doesn't have intrinsic content; content is assigned by an interpreter using the intentional stance for predictive purposes.
     Follow-up: But if the content is entirely assigned by the interpreter, then doesn't that make intentionality observer-relative? And if so, how is that different from saying that intentionality is not real but merely a projection?

  Question 2 (Chinese Room):
     Main: How do you respond to Searle's Chinese Room argument, which claims that no matter how well a system simulates understanding, it lacks real understanding because it lacks intrinsic intentionality? Is the understanding that the room as a whole is supposed to have any different from the kind of understanding we attribute to humans?
     Likely answer: The room as a whole does understand Chinese in the same way humans do: by being an appropriate target of the intentional stance. There is no further fact about understanding beyond that.
     Follow-up: But if the room doesn't have intrinsic intentionality, and we are only taking the intentional stance, then what is the difference between the room and a human? If both are just targets of the stance, then does that mean that humans don't have intrinsic intentionality either? And if so, doesn't that just concede Searle's point that we are eliminating the very phenomenon he is trying to protect?

  Question 3 (Elimination):
     Main: Your critics charge that by reducing intentionality to the intentional stance, you are eliminating mental content rather than explaining it. You typically respond by saying you are merely redescribing it. But if mental content, as ordinarily understood, requires intrinsic intentionality, then how is your re-description anything other than changing the subject? How can you claim to be explaining the same phenomenon?
     Likely answer: The ordinary understanding of mental content is confused and based on a Cartesian myth. I am providing a scientifically respectable account of what they are really pointing to.
     Follow-up: But if you deny that there is any intrinsic intentionality, then what about the first-person experience of meaning? For example, when I think about Paris, I experience my thought as being about Paris. How does your account capture that first-person experience without intrinsic aboutness? If you reduce it to the intentional stance, then isn't the first-person experience just an illusion?

  Question 4 (Qualia):
     Main: If intentionality is derived and there is no intrinsic aboutness, what implications does that have for phenomenal consciousness? Specifically, doesn't the rejection of intrinsic aboutness also put qualia at risk, since qualia are often thought to have intrinsic qualities?
     Likely answer: Qualia are not intrinsic either; they are functional properties that can be explained by their roles in our cognitive economy.
     Follow-up: But if qualia are functional, then how do you account for the inverted spectrum possibility? Two people could have inverted color experiences but identical functional roles. If functional roles are the same, then on your view they have the same qualia, but intuitively they don't. Doesn't that show that qualia are not functional?

  Question 5 (Normativity):
     Main: How does your view account for the normativity of intentional states? For example, a belief can be true or false, a desire can be satisfied or not. If intentionality is derived, where does this normativity come from?
     Likely answer: Normativity arises from the patterns in behavior and the success of the intentional stance in predicting behavior.
     Follow-up: But if normativity is just a matter of whether our predictions are successful, then isn't that reducing the normative (what ought to be) to the descriptive (what is)? How do you avoid the naturalistic fallacy?

