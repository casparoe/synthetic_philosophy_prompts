  ### Activity Design: Reasoning by Dominance with Mixed Strategies

  **Core Insight:** Participants will discover that a strategy (A) which is not dominated by any single pure alternative (B or C) is strictly dominated by a mixed strategy (50% B, 50% C). The activity forces this discovery through gameplay, arithmetic, and structured elimination.

  ---

  ### **Stage 1: Strict Dominance by Mixed Strategy**
  #### Payoff Matrix (Row Player's Payoffs; Column Player gets 1 always, so indifferent)
  |          | Column X | Column Y | Column Z |
  |----------|----------|----------|----------|
  | **Row A**| 1        | 1        | 1        |
  | **Row B**| 3        | 0        | 0        |
  | **Row C**| 0        | 3        | 3        |

  - **Why no pure strategy dominates A?**  
    - **A vs B:** In X, B wins (3 > 1); in Y, A wins (1 > 0); in Z, A wins (1 > 0). No dominance.  
    - **A vs C:** In X, A wins (1 > 0); in Y, C wins (3 > 1); in Z, C wins (3 > 1). No dominance.  
    *Result: Participants announce "no pure dominance" after comparisons.*

  - **Why a 50-50 mix of B and C dominates A?**  
    - **Vs X:** \(0.5 \times 3 + 0.5 \times 0 = 1.5 > 1\)  
    - **Vs Y:** \(0.5 \times 0 + 0.5 \times 3 = 1.5 > 1\)  
    - **Vs Z:** \(0.5 \times 0 + 0.5 \times 3 = 1.5 > 1\)  
    *Result: Mixture yields 1.5 > 1 in every case → A is strictly dominated.*

  #### Grouping and Rounds
  - **Groups:** 3 tables (3 participants/table). Each table has:  
    - **Row Team (3 people):** Chooses A, B, or C. Goal: Maximize Row’s points.  
    - **Column Team (3 people):** Chooses X, Y, or Z. **Indifferent (payoff=1 always)**, so instructed to follow a fixed schedule: **X in Round 1, Y in Round 2, Z in Round 3.**  
  - **Rounds (3 rounds, 5 min/round):**  
    1. Teams choose simultaneously (Row: A/B/C; Column: as per schedule).  
    2. Reveal choices. Record Row’s payoff (e.g., if Row chooses B and Column plays X, Row gets 3 points).  
    3. **No mixing allowed yet.**  

  #### Points Scheme
  - **Row Team:** Accumulate points (e.g., 1+0+3 = 4 after 3 rounds). Highest total wins "best strategist" bragging rights.  
  - **Column Team:** No stakes (indifferent), but they follow the schedule to ensure Row experiences all scenarios.  

  #### When Mixing Becomes Available
  - **After Round 3:** During debrief, after participants declare "no pure dominance." Facilitator asks: *"What if you could flip a coin between B and C? Calculate the average payoff against X, Y, and Z."*  
  - **Rounds 4–6 (if time):** Row teams can now use mixed strategies (e.g., "60% B, 40% C"). They commit to a probability, and the facilitator uses a random method (dice/app) to determine their play. Column still follows schedule (X in R4, Y in R5, Z in R6).  

  #### Debrief Mapping
  | **Activity Phase**        | **Game Theory Concept**                                  |
  |---------------------------|----------------------------------------------------------|
  | Rounds 1–3                | Experience pure strategies and payoff variation.         |
  | Pairwise A/B, A/C checks  | Pure strategy dominance: No strategy dominates A.        |
  | 50-50 mixture calculation | Mixed strategy strictly dominates A.                    |
  | Eliminating A             | Dominated strategies are rationally inadmissible.       |
  | Rounds 4–6 (optional)     | Optimization over non-dominated strategies (B, C, mixes).|

  #### Predictable Issues & Recovery
  - **Issue 1:** Row teams play only A (safe 1-point payoff).  
    *Recovery:* Show the matrix—highlight that B/C yield 0 or 3, prompting risk-taking.  
  - **Issue 2:** Misunderstanding expected value (e.g., "50-50 B/C only averages 1.5 if Column plays the same").  
    *Recovery:* Clarify: *"Calculate against each pure Column strategy separately: even if Column tries to punish you, 1.5 > 1 always."*  
  - **Issue 3:** Column teams deviate from schedule.  
    *Recovery:* Emphasize indifference: *"Your goal is to help Row learn; stick to the schedule."*  

  #### What the Activity Cannot Reproduce
  - **General Proof of Dominance:** Participants see one example (50-50 mix dominating A). You must explain:  
    *"A strategy is strictly dominated by a mixed strategy if every pure opponent move yields a higher payoff. Real games may require different mixtures (e.g., 70% B, 30% C) or involve larger matrices."*  

  ---

  ### **Stage 2 (Time-Permitting): Weak Dominance and Order-Dependence**
  #### Payoff Matrix (Row Player)
  |          | Column X | Column Y |
  |----------|----------|----------|
  | **Row A**| 0        | 0        |
  | **Row B**| 1        | 0        |
  | **Row C**| 0        | 1        |

  - **Rounds (2 rounds):** Column plays X (Round 1), Y (Round 2).  
  - **Weak Dominance Check:**  
    - A is weakly dominated by B (in X: 0 < 1; in Y: 0 = 0).  
    - A is weakly dominated by C (in X: 0 = 0; in Y: 0 < 1).  
  - **Order-Dependence Discovery:**  
    - **Eliminate A first:** Left with B/C. No dominance → game "ends" with B and C.  
    - **Eliminate B first:** Then C weakly dominates A (in X: 0=0; in Y: 0<1) → eliminate A → left with C.  
    - **Eliminate C first:** Then B weakly dominates A (in X: 0<1; in Y: 0=0) → eliminate A → left with B.  
    *Result: Final strategy set (B, C, or C/B) depends on elimination order.*  

  #### Why Stage 1 Differs (Order-Independence)
  - **Stage 1:** A is **strictly** dominated (always worse). Elimination is unambiguous and order-independent—even if other strategies exist, A is removed first.  
  - **Stage 2:** **Weak** dominance depends on which strategies remain (e.g., eliminating B changes whether C dominates A).  

  ---

  ### Timing and Flow (90-Minute Session)
  1. **Intro (5 min):** Explain rules, matrix, roles.  
  2. **Stage 1 Rounds (20 min):** 3 rounds of play + dominance checks.  
  3. **Mixed Strategy Discovery (15 min):** Arithmetic + eliminate A.  
  4. **Stage 1 Debrief (10 min):** Map concepts, address issues.  
  5. **Stage 2 (20 min):** Play, weak dominance, order-dependence.  
  6. **Conclusion (20 min):** Discuss implications, answer questions.  

  This design ensures participants "discover" mixed strategy dominance through gameplay, while contrasting strict/weak dominance highlights key theoretical nuances. The matrices are arithmetic-only, and grouping ensures all participate actively.
