     Consumption:
          North: min(18,3)=3 bundles -> use 3 Wool and 3 Wine -> left: Wool=15, Wine=0.
          South: min(5,20)=5 bundles -> use 5 Wool and 5 Wine -> left: Wool=0, Wine=15.
     Production: North: Wool=15+5=20, Wine=0, Gold=6.
               South: Wine=15+5=20, Wool=0, Gold=34.

  Round 4:
     Prices: P_wool = max(1, floor(6/10))=1 (since floor(6/10)=0 -> then max(1,0)=1); P_wine=floor(34/10)=3.
     Trade:
