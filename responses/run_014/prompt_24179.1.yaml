     Production: North: Wool=20+5=25, Wine=0; South: Wine=20+5=25, Wool=0.
     Prices: P_wool = max(1, floor(20/10))=2; P_wine=2.
     Trade: 
          We suggest to North: "Your people love Wine, so you must import at least 4." 
          We suggest to South: "Your people are less interested in Wool, so you decide to import 2."
          North: Q_wine_import=4 (cost=4*2=8, which they have). 
          South: Q_wool_import=2 (cost=2*2=4, they have).
     Trade execution:
          North pays 8 to South, receives 4 Wine.
          South pays 4 to North, receives 2 Wool.
     Update:
          North: Gold=20-8+4=16; Wool=25-2=23; Wine=0+4=4.
          South: Gold=20+8-4=24; Wine=25-4=21; Wool=0+2=2.
     Consumption: 
          North: bundles = min(23,4)=4 -> they consume 4 Wool and 4 Wine. Left: Wool=19, Wine=0.
          South: bundles = min(2,21)=2 -> consume 2 Wool and 2 Wine. Left: Wool=0, Wine=19.
     Production again? No, production is at the beginning of the round. So now we start round 2 with:
          North: Wool=19+5=24, Wine=0, Gold=16.
          South: Wine=19+5=24, Wool=0, Gold=24.

  Round 2:
     Production: add 5 to each good -> done above.
     Prices: P_wool = floor(16/10)=1; P_wine=floor(24/10)=2.
     Trade: 
          Now let the students decide. But we can give them a nudge: 
            To North: "You have no Wine. How much Wine do you want to buy? Remember, the price is 2 gold per Wine. You have 16 gold."
            To South: "You have no Wool. How much Wool do you want to buy? The price is 1 gold per Wool. You have 24 gold."
          We hope North buys 4 again? But they can. Cost=4*2=8. They have 16, so they can.
          South might buy more? Because Wool is cheap. They could buy up to 24 (all their gold) but they might not. If they buy 2 again, then:
          North: Q_wine_import=4; South: Q_wool_import=2.
     Trade:
          North pays 4*2=8 to South, gets 4 Wine.
          South pays 2*1=2 to North, gets 2 Wool.
     Update:
          North: Gold=16-8+2=10; Wool=24-2=22; Wine=0+4=4.
          South: Gold=24+8-2=30; Wine=24-4=20; Wool=0+2=2.
     Consumption:
          North: min(22,4)=4 -> use 4 Wool and 4 Wine -> left: Wool=18, Wine=0.
          South: min(2,20)=2 -> use 2 Wool and 2 Wine -> left: Wool=0, Wine=18.
     Next round: add production: North: Wool=18+5=23, Wine=0, Gold=10.
               South: Wine=18+5=23, Wool=0, Gold=30.

  Round 3:
     Prices: P_wool = floor(10/10)=1; P_wine=floor(30/10)=3.
     Trade:
          North: They want Wine? But now it's 3 gold. They have 10 gold. If they try to buy 4, it would cost 12 -> too much. So they might buy 3? 3*3=9.
          South: They might buy more Wool? Because it's still cheap (1) and they have a lot of gold. They might buy 5? or 10? Let's say they buy 5.
          But we must check if North has enough Wool: North has 23, so 5 is fine.
     Trade:
