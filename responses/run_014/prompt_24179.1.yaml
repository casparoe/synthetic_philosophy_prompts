     - North decides how many units of Wine they want to import (Q_wine_import). They must have enough gold to pay: Q_wine_import * P_wine <= current gold. (They know P_wine because South announces it? Or the instructor collects the prices and announces both prices.)
     - South decides how many units of Wool they want to import (Q_wool_import). They must have enough gold: Q_wool_import * P_wool <= current gold.

  4. Trade execution:
     - North pays South: amount = Q_wine_import * P_wine (in gold). South gives North Q_wine_import of Wine.
     - South pays North: amount = Q_wool_import * P_wool (in gold). North gives South Q_wool_import of Wool.

     Note: we must ensure that the exporter has enough goods. Since they produce each round and start with 20, and we are only doing 5-6 rounds, it should be fine. But if they try to export more than they have, they export as much as they have (and pay only for what they receive). But we can tell them they can't export more than available.

     But to keep it simple, we can cap the import quantity by the exporter's available stock. So:

     - Actual Wine exported by South = min(Q_wine_import, South's Wine stock)
     - Actual Wool exported by North = min(Q_wool_import, North's Wool stock)

     And then adjust payments accordingly. But we hope they don't exceed.

  5. Update stocks:
     - Gold:
          North: new gold = old gold - (actual Wine imported * P_wine) + (actual Wool exported * P_wool)
          South: new gold = old gold + (actual Wine exported * P_wine) - (actual Wool imported * P_wool)
     - Goods:
          North: Wool = old Wool - actual Wool exported
                 Wine = old Wine + actual Wine imported
          South: Wine = old Wine - actual Wine exported
                 Wool = old Wool + actual Wool imported

  6. Consumption: each nation forms bundles. One bundle = one Wool and one Wine. The number of bundles is min(Wool, Wine). They then subtract the bundles from their stock (so they consume them). The leftover goods remain.

     Note: they might have leftover goods. We can allow them to carry over to the next round.

  7. Record the round and repeat.

  We do 5-6 rounds.

  The point to freeze: when the gold flow starts to reverse. For example, when South starts to run a deficit (or when North starts to reduce their deficit and then run a surplus). But it might take a few rounds.

  In the example above, if in round 3, North reduces their Wine imports because they can't afford, and South increases Wool imports because it's cheap, then we might see a reduction in North's deficit.

  But in round 5 we saw North had a surplus? Because South bought Wool and North bought nothing? That was due to North not being able to buy Wine.

  But we want to show the mechanism: the high prices in the surplus country and low prices in the deficit country lead to a natural correction.

  So we can freeze after round 3 or 4 and ask: "What is happening to the prices? Why is North buying less Wine? Why might South start buying more Wool?"

  Then continue until we see the trade balance reverse.

  Debriefing:

  Map the game to Hume's mechanism:

  1. Initial trade imbalance: one country runs a surplus (gains gold), the other a deficit (loses gold).
  2. The surplus country's money supply (gold) increases -> price level rises (including its export good).
  3. The deficit country's money supply decreases -> price level falls (including its export good).
  4. The surplus country's exports become more expensive, so the other country buys less of them. The deficit country's exports become cheaper, so the surplus country buys more of them.
  5. This reduces the trade surplus (or turns it into a deficit) and reverses the gold flow.

  The mercantilist hope: that a trade surplus (and gold inflow) is permanently good. But in the game, the surplus country finds that its goods become too expensive and they lose competitiveness.

  What the game might not show: the effect on domestic wages and industry. Hume argued that the money inflow would raise prices and wages, making the country's manufactures less competitive. The game shows the price effect on exports, but not the internal wage dynamics. So you may need to explain that part.

  What might go wrong:

  1. Students might hoard gold: for example, a nation might decide to import very little to avoid losing gold. This would prevent the mechanism. To fix: emphasize that the goal is to maximize consumption (bundles). They get utility from bundles, not from hoarding gold. So they should try to get as many bundles as possible. Also, you can make the consumption visible: each bundle gives a point.

  2. They might not change their import quantities in response to prices. For example, South might keep buying 2 Wool even when it's very cheap. Then the correction is slow. You can prompt: "Do you notice that Wool is now very cheap? How might that affect your decision?"

  3. They might run out of goods? But with production each round, they should have enough for 5 rounds.

  4. The price formula might be too simplistic. But it's designed to illustrate.

  Round-by-round script:

