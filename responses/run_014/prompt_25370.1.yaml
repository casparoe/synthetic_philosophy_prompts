  First, I need to recall Moore's main ideas. He's all about intrinsic value – what's good purely for its own sake. He's against reducing ethics to natural properties (naturalistic fallacy) and emphasizes organic unities. That's key here. The user mentioned the paragraph where Moore says admiration of mental qualities might have less intrinsic value alone than the appreciation of corporeal beauty. But earlier in the chapter, he positions personal affection as a supreme good. So the tension is apparent.

  The user is asking about the distinction between something's value "in itself" versus its contribution to a "whole." Moore's concept of organic unities is crucial here. He believes that when parts combine, the whole's value isn't just the sum of its parts; it can be greater. So even if appreciating mental qualities alone has less intrinsic value, when combined with physical expressions in a relationship, it forms a much more valuable whole. The user might be missing this holistic aspect.

  The phrase "appears to be doubtful" is significant. Moore isn't stating it as a definitive claim but as a tentative observation. He's exploring possibilities, which is part of his method. The user might be taking this as a firm conclusion, but it's more of a hypothetical to illustrate the complexity of isolating intrinsic values.

  The user's deeper need is to reconcile this paragraph with the chapter's thesis. They might be preparing for a seminar, so they need a clear explanation to participate effectively. They also need to understand how Moore's technical distinctions support his broader argument. The paradox they perceive arises from not separating the intrinsic value of components from their combined effect.

  I should explain the three-step structure in the paragraph: 1) Bodily expressions are part of affection's object and enhance value. 2) Isolating mental qualities is hard and seems less valuable. 3) Thus, admiration of mental qualities gains its high value from contributing to a superior whole. The appreciation of physical beauty, being simpler, might have higher intrinsic value when considered alone. But in the context of personal affection, the combination is what's supreme.

  Emphasizing Moore's caution with "appears" is important. He's not committing to the claim but using it to highlight the complexity. The user needs to see this as part of his argument for the superiority of composite goods. The seminar context means they need to grasp these nuances for discussion, so clarity on organic unities and intrinsic vs. contributory value is essential.
answer: |-
  This paragraph is a crucial (and tricky!) moment where Moore applies his doctrine of **"organic unities"** to his argument about the greatest goods. It *feels* paradoxical because he's carefully isolating components, but it ultimately *strengthens* his case for personal affection as the highest good. Let's break it down step-by-step:

  1.  **The Role of Bodily Expressions:**
      *   Moore observes that in *actual* valuable relationships ("affection"), we don't just love a disembodied mind. We love the *whole person*, which includes their physical presence, expressions, words, and actions – how their mental qualities (character, virtue) are **embodied**.
      *   Crucially, he states that including these bodily expressions **"heightens the value of the whole state."** The affection *gains* value because it's directed at a concrete, physically expressed person, not an abstract idea.

  2.  **The Thought Experiment: Mental Qualities "Alone":**
      *   Moore then tries the counterfactual: Can we imagine appreciating someone's admirable mental qualities (kindness, intelligence, courage) *without* any physical manifestation? He admits this is very difficult.
      *   When we *do* manage this mental abstraction, the resulting state of *just* admiring the disembodied mental quality **"certainly appears to have less value"** than when that admiration includes the bodily expression.

  3.  **The Crucial Conclusion & Distinction:**
      *   Based on this, Moore concludes: The *primary importance* of admiring virtuous mental qualities isn't necessarily because that admiration, considered *by itself in isolation*, has incredibly high intrinsic value.
      *   Instead, its importance lies in **its essential contribution to a vastly superior "whole."** This "whole" is the complex state of **personal affection** – which *includes* the admiration of mental qualities *along with* the appreciation of their bodily expression *and* the positive emotion binding it all together.
      *   **The Distinction:** Moore is separating:
          *   **Intrinsic Value "in itself":** The value a specific element (like admiring mental qualities *alone*, or appreciating physical beauty *alone*) possesses purely on its own merits, considered in complete isolation.
          *   **Value as a Part/Contributory Value:** The value an element *adds* to a larger, complex whole (like the state of personal affection) when it is combined with other elements. Due to organic unity, this contributory value can be much greater than (or different from) the element's intrinsic value alone.

  4.  **The "Paradoxical" Claim about Corporeal Beauty:**
      *   Moore pushes the isolation further: He tentatively suggests ("appears to be doubtful") that the *intrinsic value considered in itself* of admiring virtuous mental qualities ("the appreciation of what has great intrinsic value") might even be *less* than the intrinsic value considered in itself of appreciating mere physical beauty ("the appreciation of what is merely beautiful").
      *   Why? Because appreciating physical beauty is a simpler, more direct aesthetic state. Trying to appreciate *just* a virtuous mind stripped of all physical context is an unnatural abstraction that seems pale and less valuable in isolation. Appreciating a beautiful face or sunset, while complex, feels more complete as an isolated aesthetic experience.

  **How This Fits & Resolves the "Contradiction":**

  1.  **Supporting Organic Unity:** This paragraph is a *demonstration* of Moore's core doctrine. He's showing that the *true* supreme goods are complex unities. Isolating their components reveals that the components *alone* may not be supremely valuable (or may even be less valuable than simpler goods like aesthetic appreciation), but *when combined*, they create something uniquely and immensely valuable.

  2.  **Explaining the Superiority of Personal Affection:** Personal affection *is* the "whole" Moore refers to. Its immense value comes precisely *from* the combination:
      *   Admiration of mental qualities (good in itself, perhaps moderately)
      *   Appreciation of bodily beauty/expression (good in itself, potentially quite high)
      *   The positive emotional bond/affection itself (good in itself)
      *   The *organic combination* of these, where the whole is greater than the sum of its parts.

  3.  **Why it Doesn't Contradict the Chapter's Thrust:**
      *   Moore isn't saying that appreciating a beautiful face is *overall* a greater good than having personal affection for someone whose character you admire. That would indeed contradict the chapter.
      *   He *is* saying that when you *artificially isolate* the components, the *simple act of appreciating the face* might have *more intrinsic value in that isolated state* than the *simple act of appreciating the character* has in *its* isolated state.
      *   However, the *key point* is that the admiration of character is an *essential ingredient* that, when added to the appreciation of bodily expression and affection, creates the vastly superior whole of "personal affection." **The whole state of personal affection is the supreme good, not its isolated components.**

  4.  **The Role of "appears to be doubtful":**
      *   This phrase does important work. Moore is being cautious and tentative. He doesn't state this as an undeniable fact but as a plausible conclusion from the thought experiment.
      *   Its purpose is **heuristic**: It forces the reader to confront the implications of organic unity and the difficulty of isolating components. Even *if* it's true that appreciating beauty alone has higher intrinsic value than appreciating virtue alone, it *still* doesn't diminish the supreme value of the complex whole (personal affection) that *includes* appreciating virtue. In fact, it highlights how much *extra* value the organic unity creates.

  **In Summary:**

  Moore is using this paragraph to:

  1.  Emphasize that valuable personal affection *requires* the embodiment of mental qualities.
  2.  Illustrate his doctrine of organic unities by showing that isolating the component of "admiring mental qualities" reveals it has less value alone than we might assume.
  3.  Tentatively suggest that even a simpler aesthetic appreciation (like of physical beauty) might have *more* intrinsic value *in isolation* than admiring virtue *in isolation*.
  4.  Argue that this **doesn't diminish** the supreme value of personal affection; it actually **enhances** it by showing that the immense value of the affection-whole arises *precisely because* of the unique, value-amplifying combination of these components (admiration of virtue + appreciation of beauty/expression + affection itself). The whole is exponentially greater than the sum of its (individually less impressive) parts.

  Moore isn't retreating from valuing personal affection as a supreme good; he's explaining *why* it's supreme using his technical apparatus of intrinsic value and organic unities. The "paradox" highlights the power of the combination, not the weakness of the component.
