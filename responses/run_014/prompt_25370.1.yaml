prompt: |-
  I'm working through the last chapter of Principia Ethica for a seminar and this paragraph from §122 has me totaly stuck. Moore is in the middle of arguing that personal affection and the enjoyment of beauty are the greatest goods, and then he writes:

  "It is certain that in all actual cases of valuable affection, the bodily expressions of character, whether by looks, by words, or by actions, do form a part of the object towards which the affection is felt, and that the fact of their inclusion appears to heighten the value of the whole state. It is, indeed, very difficult to imagine what the cognition of mental qualities alone, unaccompanied by any corporeal expression, would be like; and, in so far as we succeed in making this abstraction, the whole considered certainly appears to have less value. I therefore conclude that the importance of an admiration of admirable mental qualities lies chiefly in the immense superiority of a whole, in which it forms a part, to one in which it is absent, and not in any high degree of intrinsic value which it possesses by itself. It even appears to be doubtful, whether, in itself, it possesses so much value as the appreciation of mere corporeal beauty undoubtedly does possess; that is to say, whether the appreciation of what has great intrinsic value is so valuable as the appreciation of what is merely beautiful."

  So he seems to be saying that appreciating a beautiful face might be more valuable than appreciating someone's virtuous character — at least when you consider each "in itself." That feels like it contradicts the whole thrust of the chapter, where he's been building up personal affection as the highest good. What distinction is he drawing between the value something has "in itself" versus its contribution to a "whole"? And is he actually committed to the paradoxical-sounding claim, or is the "appears to be doubtful" doing more work than I think? I need someone to unpack what Moore is up to in this paragraph and how it fits into the larger argument of the chapter.
