  First, I consider the three claim types they mentioned:
  - Specific concealment (documents/people/dates)
  - Systemic incentives (structural biases without coordination)
  - Global claims (whole fields compromised)

  For each type, I'll need distinct evidence standards. Global claims are tricky because they're often unfalsifiable - that's why they'll usually get parked. 

  The procedure must include practical checks:
  - For specific claims: secrecy capacity (how many knew?), failure explanations (institutional vs. deliberate), records checks (testable predictions?), and whistleblower base rates
  - For systemic claims: focus on documented incentives without requiring conspiracy
  - Explicit markers where human judgment is unavoidable

  Important to acknowledge asymmetries - false alarms vs missed concealments have different costs in their context. The verdict categories need to be clear and actionable.

  Now testing with their cases:
  Case 1 (buried study) likely fails on records check - no documents or testable predictions despite the slow review being public. Even though their intuition says companies bury studies, the procedure requires concrete evidence.

  Case 2 (whole field compromised) gets parked immediately as unfalsifiable global claim.

  Case 3 (suppressed negative results) passes because it cites documented publication bias - systemic incentive claims don't need conspiracy evidence.

  The procedure will sometimes contradict domain expertise (like in Case 1), but that's intentional - it forces concrete evidence over reasonable suspicion. To change the verdict, they'd need specific documents or whistleblower testimony.
answer: |-
  Here is the decision procedure for evaluating concealment claims, designed as an ordered sequence of checks. It categorizes claims upfront, applies type-specific standards, marks judgment points explicitly, and outputs a standardized verdict. The procedure is structured to be run in **<30 minutes** by a non-philosopher co-reviewer, with minimal jargon.

  ---

  ### **DECISION PROCEDURE: CONCEALMENT CLAIM EVALUATION**  
  *Time limit: 30 minutes per claim*  

  #### **STEP 0: CLASSIFY THE CLAIM**  
  - **Check:** What type of claim is this?  
    - **(a) Specific concealment:** Names documents, people, dates, or actions.  
    - **(b) Systemic incentive:** Alleges structural biases (funding, publication, careers) without a coordinating group.  
    - **(c) Global:** Asserts an entire field/institution is corrupt, with no specifics.  
  - **Standard of Evidence:**  
    - **(a) Specific:** Requires *testable evidence* (e.g., documents, witnesses, records).  
    - **(b) Systemic:** Requires *documented incentives* (e.g., studies on publication bias).  
    - **(c) Global:** Requires *falsifiability* (must propose a test to disprove it).  
  - **Why (c) is parked:** Global claims lack falsifiable mechanisms. Example: "All toxicologists are corrupt" cannot be disproven by any single honest actor.  
  - **Output:** Proceed to the relevant track (a, b, or c).  

  #### **STEP 1: TRACK-SPECIFIC CHECKS**  
  **For (a) SPECIFIC CONCEALMENT CLAIMS:**  
  1. **Secrecy Capacity Check:**  
     - *Question:* How many people had to know the secret? For how long?  
     - *Calibration:* Compare to real kept secrets in your field (e.g., DuPont PFOA cover-up involved <10 people for ~10 years).  
     - *Failure:* If >50 people knew for >5 years with no leaks → **claim fails**.  
     - *Judgment:* Assess if secrecy is plausible (e.g., "industry secrets" exist, but broad conspiracies rarely hold).  

  2. **Failure Explanation Check:**  
     - *Question:* Can gaps/delays be explained by institutional failure (negligence, bureaucracy, self-deception)?  
     - *Standard:* Accept institutional failure if it is *more parsimonious* (fewer assumptions) than concealment.  
     - *Failure:* If institutional failure explains all facts → **claim fails**.  
     - *Judgment:* Concealment must offer *specific* advantages over institutional failure (e.g., "delays saved $X in recalls").  

  3. **Records Check:**  
     - *Question:* Does the claim generate testable predictions? (e.g., "Document X should exist," "Person Y should confirm").  
     - *Failure:* No testable prediction → **park claim as "Unfalsifiable"**.  
     - *Sufficient Answer:* If predictions exist, note them for the verdict (e.g., "Check state agency FOIA logs for 1996").  

  4. **Silence Check:**  
     - *Question:* Is the absence of a whistleblower meaningful?  
     - *Standard:* Only if whistleblowing is common in the domain (e.g., pharma has moderate rates; EPA higher than state agencies).  
     - *Failure:* If whistleblowing is rare (e.g., <5% of cases), silence is **weak evidence** and cannot support the claim.  

  **For (b) SYSTEMIC INCENTIVE CLAIMS:**  
  1. **Incentive Documentation Check:**  
     - *Question:* Is there evidence of the alleged incentive structure? (e.g., studies show negative results are under-published).  
     - *Sufficient Answer:* Cite documented patterns (e.g., "Publication bias meta-study X confirms this").  
     - *Failure:* No evidence → **claim fails**.  
     - *Judgment:* If evidence exists, verdict is **"Systemic Incentive Confirmed"** (not conspiracy).  

  **For (c) GLOBAL CLAIMS:**  
  - **Immediate Verdict:** **Parked (Unfalsifiable)**. No further checks. Rationale: "No testable mechanism proposed."  

  #### **STEP 2: FINAL VERDICT & RATIONALE**  
  - **Categories:**  
    - **Supported (Investigate Further):** Specific evidence + passed checks.  
    - **Plausible (Needs Specific Evidence X):** Logical but lacks testable proof.  
    - **Likely False (Here’s Why):** Failed checks or better alternative explanation.  
    - **Parked (Unfalsifiable):** Global claim or no testable predictions.  
    - **Systemic Incentive Confirmed:** Incentives documented; no conspiracy needed.  
  - **Rationale:** One paragraph summarizing:  
    - Claim type, key checks, why verdict was reached.  
    - Explicitly note judgment calls (e.g., "We judged secrecy implausible because...").  

  ---

  ### **PROCEDURE NOTES**  
  - **Where Judgment is Required:**  
    - Assessing source credibility (e.g., "former employee" may be biased).  
    - Calibrating secrecy (use your field knowledge; e.g., "Chemical companies keep trade secrets but not health studies").  
    - Deciding "unlikely" thresholds (e.g., "90% failure rate is too high to ignore").  
  - **Misfires & Asymmetry:**  
    - **Too Conservative:** May miss true concealment if institutional failure is overused.  
    - **Too Permissive:** Systemic claims may be misread as conspiracies.  
    - **Asymmetry Cost:** False alarm (accusing innocents) damages credibility more than missing concealment (which may surface later). Tilt: **Prioritize avoiding false alarms**.  
  - **Why It Works for Non-Philosophers:** Uses concrete checks (secrecy size, records, documented incentives) instead of abstract concepts.  

  ---

  ### **CASE APPLICATIONS**  
  **Case 1: Specific Concealment Claim**  
  *Claim: Chemical company buried 1994 liver-damage study; state agency delayed warning by 1996. Cites "former employee." No documents; agency records show slow review.*  
  - **Step 0:** Classify as (a) Specific Concealment.  
  - **Step 1a Checks:**  
    1. **Secrecy Capacity:** Study burial requires ~5-20 people (scientists, managers). Plausible (e.g., asbestos/tobacco precedents). → **Pass**.  
    2. **Failure Explanation:** Agency’s "slow review" is documented institutional failure (bureaucracy). More parsimonious than concealment. → **Claim fails check**.  
    3. **Records Check:** No testable predictions (e.g., "no document named," "no FOIA target"). → **Park as Unfalsifiable**.  
    4. **Silence Check:** Whistleblowing rare in mid-sized chemical firms (base rate ~10%). Silence is weak evidence. → **Neutral**.  
  - **Verdict: Likely False (Here’s Why)**  
  - **Rationale:** "Claim fails due to plausible institutional failure explaining delays and lack of testable predictions. No documents or specific FOIA targets were provided. Whistleblower absence is inconclusive. Agency records show routine (if slow) review."  
  - **Note:** Your intuition conflicts here because the procedure *requires testable evidence*. To change verdict: Provide a document name, FOIA-able request, or whistleblower testimony.  

  **Case 2: Global Claim**  
  *Claim: "All toxicology is compromised by industry funding; no honest researcher speaks up."*  
  - **Step 0:** Classify as (c) Global Claim.  
  - **Verdict: Parked (Unfalsifiable)**  
  - **Rationale:** "No specific mechanism or test proposed (e.g., ‘all’ labs cannot be disproven by one honest actor). Base rates show industry-funded labs sometimes publish damning results (e.g., DuPont PFOA)."  

  **Case 3: Systemic Incentive Claim**  
  *Claim: Negative results suppressed due to publication/funding incentives. Cites under-publication of negative results.*  
  - **Step 0:** Classify as (b) Systemic Incentive.  
  - **Step 1b Check:**  
    1. **Incentive Documentation:** Well-documented publication bias exists (e.g., 2014 PLOS ONE meta-study). → **Pass**.  
  - **Verdict: Systemic Incentive Confirmed**  
  - **Rationale:** "Claim cites established pattern: Negative results are under-published due to journal/funding incentives. No conspiracy needed; this is a structural issue."  

  ---

  This procedure prioritizes evidence over intuition, minimizes false alarms, and flags judgment points transparently. It will occasionally contradict domain expertise (as in Case 1) to enforce falsifiability—forcing claims to provide *testable* evidence before escalating.
