answer: |-
  ## Dissertation Fellowship Proposal: Disentangling Sampling Rules, Reference Classes, and Priors in Cosmological Self-Location

  **1. Precise Research Question:**  
  Is the "small universe" conclusion in the presumptuous philosopher scenario *sensitive to changes in the reference class definition* when the prior probability distribution over total observer counts and the sampling rule (SSA vs. SIA) are held fixed? Specifically, under a fixed prior P(N) (where N is the total number of observers) and a fixed sampling rule (e.g., SSA), does varying the definition of the reference class R (e.g., "conscious observers," "human-like observers," "observers in my causal past") significantly alter the posterior probability P(Small Universe | I exist), or is the conclusion robust across reference classes? Conversely, does shifting only the prior P(N), while holding the reference class R and sampling rule constant, reliably induce a shift from the small-universe to the large-universe conclusion (or vice versa)?

  **2. Why Existing Positions Leave This Open:**  
  The debate between the Self-Sampling Assumption (SSA: "I am a random sample from the set of all actual observers in my reference class") and the Self-Indication Assumption (SIA: "My existence is evidence that there are many observers") is typically framed as a fundamental clash of *sampling postulates*. Proponents of each position attribute the divergent cosmological conclusions (e.g., favoring a small vs. large universe in the presumptuous philosopher case) primarily to the opponent's adoption of the "wrong" sampling rule. The reference class problem, while acknowledged as significant, is treated as a secondary technical complication to be resolved *after* choosing SSA or SIA. Consequently:

  *   **SSA advocates** (e.g., Bostrom) focus on defending the core sampling intuition against SIA's "presumptuousness," often stipulating a "natural" reference class without rigorously testing how sensitive conclusions are to its definition *given* SSA.
  *   **SIA advocates** (e.g., Neal) attack SSA's vulnerability to reference class arbitrariness *in general* but do not systematically isolate whether the specific problematic conclusion (e.g., presumptuous philosopher favoring small universe) persists across reference classes *under a fixed prior and SSA*, or vanishes for some classes.
  *   **Both sides** presuppose that the sampling rule is the primary driver of the cosmological inference, obscuring the potential inferential roles played independently by P(N) and R. No framework has cleanly separated these three variables (Sampling Rule, Prior P(N), Reference Class R) to pinpoint which combination(s) are necessary and sufficient for the controversial conclusions.

  **3. Methodology (Month-by-Month):**

  *   **Months 1-2: Formal Reconstruction & Framework Setup:**  
      Define a unified probability-theoretic framework for observer self-location. Formalize SSA rigorously as a conditionalization procedure: P(H | I exist) ∝ P(I exist | H) * P(H), where P(I exist | H) is defined by the fraction of observers in the reference class R under H. Formalize SIA's effect as influencing the prior: P_SIA(H) ∝ P_naive(H) * <Number of Observers in R under H>. Define key cosmological hypotheses (H_small, H_large) differing *only* in the total number of observers N they imply. Precisely define "reference class R" as a property defining set membership.
  *   **Months 3-5: Construct Finite Models & Derive Posteriors:**  
      Develop a suite of small, tractable finite models simulating the presumptuous philosopher scenario. Each model will specify:
      *   A set of hypotheses {H_i}, each defining a unique N_i (observer count in R).
      *   A prior distribution P(N) over the N_i (manipulated variable: e.g., uniform, log-uniform, favoring small N, favoring large N).
      *   A definition of the Reference Class R (manipulated variable: e.g., R1 = "All Observers", R2 = "Observers with Property P", R3 = "Observers in Causal Group C").
      *   A Sampling Rule (manipulated variable: SSA or SIA).
      For each unique combination (P(N), R, Sampling Rule), rigorously calculate the posterior probability P(H_small | I exist). Crucially, models will be designed so N_i, P(N), R, and the Sampling Rule can be varied *independently*.
  *   **Months 6-8: Analysis & Sensitivity Testing:**  
      Systematically analyze the calculated posteriors:
      *   **Fix P(N) and Sampling Rule (e.g., SSA):** Vary R. Does P(H_small | I exist) change significantly? If yes, reference class sensitivity is confirmed under that prior and rule.
      *   **Fix P(N) and R:** Vary Sampling Rule (SSA vs SIA). Does the posterior shift as expected? (Baseline validation).
      *   **Fix Sampling Rule (e.g., SSA) and R:** Vary P(N) (e.g., uniform vs prior favoring large N). Does the posterior shift dramatically? Identify the Minimal Assumption Set (MAS) for the "small universe" conclusion (e.g., SSA + Uniform P(N) + Broad R). Identify the MAS for the "large universe" conclusion (e.g., SIA alone, or SSA + Prior favoring large N).
      *   Test robustness: Introduce models with different causal structures, observer properties, and degrees of reference class fuzziness.
  *   **Months 9-11: Interpretation & Cosmological Connection:**  
      Synthesize results. Determine if SSA *alone* (with any R and any P(N)) implies the small universe conclusion, or only specific combinations. Assess whether SIA's role is primarily as a prior modifier. Evaluate if standard cosmological arguments inadvertently conflate the effects of R, P(N), and the sampling rule. Draft key findings.
  *   **Month 12: Writing & Integration:**  
      Finalize dissertation chapter integrating results, connecting explicitly back to the presumptuous philosopher, cosmology fine-tuning debates, and the SSA/SIA literature. Refine argument based on model outcomes.

  **4. Failure Conditions & Project Risks:**  

  *   **Core Hypothesis Invalidated:** The project fails if analysis shows the presumptuous philosopher conclusion is *insensitive* to reference class variation under fixed priors and SSA, and depends *only* on the choice of sampling postulate (SSA always yields small universe, SIA always yields large universe, regardless of R and P(N)). This would disprove my central claim about the distinct roles of SSA (conditionalization) and SIA (prior).
  *   **Model Degeneracy/Triviality:** Failure occurs if the finite models cannot capture the essence of the problem – e.g., if varying R consistently leads to ill-defined probabilities, or if the posterior differences are negligible across all plausible combinations, making the distinction philosophically moot. Failure also occurs if the models are so simplistic they bear no meaningful resemblance to the cosmological context (e.g., no causal structure, no distinction between observer types).
  *   **Inconclusive Results:** Failure occurs if the results are highly sensitive to specific, arbitrary modeling choices not justified by the core philosophical problem, preventing clear general conclusions about the roles of R, P(N), and sampling rules.

  **5. Realistic Scope & Cuts:**  

  *   **Realistic in One Year:** Completing the core work is achievable: building the formal framework, constructing 3-5 distinct finite models with varying R, P(N), and rules, performing the sensitivity analysis for the presumptuous philosopher case, identifying the MAS for key conclusions, and integrating this into one substantive dissertation chapter. This provides a novel, rigorous analysis isolating the variables.
  *   **Likely Cuts/Extensions:**  
      *   **Cut:** Extensive analysis of *infinite* universes or continua of hypotheses. Focus will be on discrete, finite N.
      *   **Cut:** Comprehensive exploration of *all possible* priors or reference classes. Focus will be on representative, philosophically motivated examples (e.g., uniform, indifference-based, simplicity-based priors; broad, narrow, causal reference classes).
      *   **Cut:** Detailed application to *multiple* cosmological paradoxes (e.g., Doomsday, Simulation Argument). Deep focus on Presumptuous Philosopher as the critical case.
      *   **Extension (If Time Permits):** Preliminary exploration of whether a unified framework *deriving* the appropriate combination of R, P(N), and conditionalization rule from more fundamental principles (e.g., causal connectedness, algorithmic probability) is feasible, setting up future research.
      *   **Extension (If Time Permits):** Investigating whether the "SIA prior" can be independently justified or derived within the framework, separate from its role in countering SSA.

  This project offers a crucial disentanglement in a foundational debate, moving beyond the stalemate of "SSA vs SIA" by rigorously testing the distinct inferential roles of sampling rules, reference classes, and priors using controlled probabilistic models. The results will clarify the logical structure of cosmological self-location inferences.
