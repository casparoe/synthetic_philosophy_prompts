answer: |-
  ### Colloquium Questions for the Guest Scholar  

  **Question 1:**  
  You argue Rousseau’s objection centers on the *professional actor* corrupting through artifice and the *idle spectator* divorcing art from civic duty. Yet in his proposed citizen theater, where neighbors perform for neighbors, the audience remains spectatorial and passive. How does this resolve Rousseau’s core critique that spectatorship itself breeds moral disengagement?  
  *Likely reply focus: Citizen audiences are active participants in communal meaning, not detached consumers.*  
  **Follow-up:** But doesn’t Rousseau explicitly link spectatorship to *passivity* ("losing the habit of acting ourselves"), irrespective of the performers’ identity?  

  **Question 2:**  
  Rousseau ranks comedy as more dangerous than tragedy precisely because its characters mirror *ordinary citizens*, making vice familiar and seductive. If citizen-performed comedy stages recognizable local flaws, doesn’t this amplify his stated peril—turning vice into public amusement within the community itself?  
  *Likely reply focus: Amateur performance avoids professional glamorization, making satire pedagogical.*  
  **Follow-up:** Yet if comedy’s danger lies in its *subject matter’s proximity* (not its professionalism), wouldn’t citizens lampooning neighbors invert his demand for art to "fortify the heart"?  

  **Question 3:**  
  Rousseau praises *Le Misanthrope* as artistically brilliant but condemns its moral inversion: Alceste’s virtue is ridiculed while Philinte’s vice is rewarded. If citizen actors replaced professionals in staging Molière, what in Rousseau’s model would rectify this *structural moral reversal* inherent to the script?  
  *Likely reply focus: Civic context reframes reception; the audience judges ethically, not aesthetically.*  
  **Follow-up:** But doesn’t Rousseau insist the *work itself* teaches complacency with hypocrisy? How does non-professional staging alter the comedy’s inherent moral logic?  

  **Question 4:**  
  Rousseau exempts ancient Greek tragedy because it was embedded in ritual, making it "part of the constitution." Doesn’t this exception confirm that his critique hinges on a practice’s *social function and integration*, not acting’s intrinsic immorality?  
  *Likely reply focus: Yes—the problem is theater’s *alienation* from civic life, not drama per se.*  
  **Follow-up:** Then why propose citizen theater at all? Wouldn’t reintegrating art require *abolishing spectatorship* entirely in favor of participatory rites, as in his festivals?  

  **Question 5:**  
  If the professional actor’s sin is *selling their persona* (creating a "man of appearances"), do citizen actors not risk the same corruption by *adopting fictional roles* before peers? Doesn’t Rousseau warn that *any* performance fractures the self’s integrity?  
  *Likely reply focus: Amateur acting is occasional and communal, preserving sincerity.*  
  **Follow-up:** Yet Rousseau claims acting *as such* demands "suppressing one’s own character"—so isn’t the citizen-actor still practicing self-alienation, however temporarily?  

  **Question 6:**  
  Ultimately, does Rousseau’s proposed citizen theater escape his critique, or does it merely *relocate* the pathologies of spectatorship and performance to an intimate scale—risking hypocrisy by masking civic vanity as virtue?  
  *Likely reply focus: It transforms theater into a mirror for collective self-examination.*  
  **Follow-up:** But if spectators remain observers, not actors in the civic sense, does this not sustain the very "idleness" Rousseau deemed antithetical to republican virtue?  

  ---

  **Verdict:** Spectator passivity remains irredeemable.
