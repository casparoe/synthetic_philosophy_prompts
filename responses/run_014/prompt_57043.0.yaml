prompt: |-
  I am drafting the requirements section of a specification for an automated allocation system that must rank proposed interventions, including proposals whose payoffs are unbounded — some promising benefits of astronomical size at probabilities so small that the system cannot usefully represent them. Before I survey candidate decision rules, I want the requirements themselves settled. The deliverable I want from you is therefore not a verdict on the candidates but a specification of what any of them must achieve.

  Write the list of desiderata that a theory of choice under unbounded payoffs must satisfy to count as solving the St. Petersburg problem, where the theory is to serve this purpose: producing a determinate ranking that a bounded agent can actually apply, in cases the agent cannot decline to decide. For each desideratum, state the consideration or the case that motivates it, and mark whether you take it to be non-negotiable or to be a commitment of a particular camp — bounded utility, truncation of small probabilities, risk-weighting, growth-rate maximization, the denial that expectation is the right criterion, and so on.

  Pin the requirements down against the following five prospects, which your list must collectively handle or explicitly disqualify. In each, a fair coin is flipped until heads first appears on toss n, and the payoff is as given.

  1. The classic gamble: $2^(n−1). The expectation diverges because every term contributes 1/2.
  2. $2^(n−1)/n. The expectation diverges again, now as a scaled harmonic series — the same verdict reached by a different route, with payoffs that grow more slowly.
  3. (−1)^(n−1) · 2^n / n dollars: a gamble of the sort Nover and Hájek introduced as the Pasadena game. Its expectation terms form the alternating harmonic series, which converges to ln 2, but only conditionally, so the very same outcomes rearranged can be made to sum to any real number one likes. Your list must say what is demanded of a theory confronting a prospect whose value depends on the order in which its outcomes are enumerated.
  4. As in 3, except that heads on the first toss pays $3 rather than $2. This prospect pays at least as much as 3 in every possible outcome and strictly more in one. Any list that permits a theory to rank it below 3, or to declare the comparison undefined while still claiming to guide action, should be flagged — and identify which desideratum the failure violates.
  5. A single-shot prospect whose payoff is so large and whose probability so small that the agent cannot compute the product with any confidence, though a proposer can always name a pair whose product exceeds any bound the agent has so far accepted — the structure exploited in Pascal's-mugging cases.

  Two further matters belong in the specification, and your list should take a position on both. First, say which distinctions an adequate solution must keep apart and which it may collapse: for instance, the value of a prospect versus the price an agent should pay to enter it — and add any others you think the surrounding literature has blurred. Second, state whether the output "this prospect has no determinate value" is admissible for an adequate theory. If it is, my system has no rule for prospects 3 and 4, and I need to know whether that gap is fatal or honest.

  Also tell me whether it is a desideratum that the theory explain what real agents actually pay for prospects of this kind, or whether that datum is beside the point, and why.

  Finally, identify any subset of the desiderata you believe cannot be jointly satisfied, and explain why the tension is substantive rather than a matter of phrasing — if in some region the list is itself an impossibility result, that is the part I most want to see. Say which single desideratum does the most work in eliminating candidates. Score the main families of solutions against the list only briefly, at the end.
reasoning: |-
  We are drafting requirements for a theory of choice under unbounded payoffs to solve the St. Petersburg problem and related prospects. The theory must produce a determinate ranking that a bounded agent can apply when they cannot decline to decide.

  We list desiderata, noting which are non-negotiable and which are commitments of particular camps. We then test against the five prospects and address two further matters.

  ## Desiderata

  1. **Determinacy of Ranking (Non-negotiable)**: The theory must assign a determinate rank to every prospect it considers, including those with unbounded payoffs. It may decline to consider some prospects (by disqualifying them) but for those it considers, the ranking must be complete and transitive. 
     *Motivation*: The agent must decide and cannot say "I don't know" for every prospect. Without a complete ordering, the agent cannot choose between two prospects. This is non-negotiable because the system must guide action.

  2. **Dominance (Non-negotiable)**: If prospect A pays at least as much as prospect B in every possible state of the world and strictly more in at least one state, then A must be ranked at least as high as B. 
     *Motivation*: Violating dominance leads to sure losses and is widely considered irrational. This is non-negotiable.

  3. **Computational Feasibility for Bounded Agents (Non-negotiable)**: The ranking must be computable by a bounded agent (with finite computational resources and memory) in finite time. 
     *Motivation*: The agent is bounded. If the theory requires unbounded computation (like summing an infinite series to arbitrary precision) then it is not practical. This is non-negotiable.

  4. **Robustness to Rearrangement (Conditional)**: For a prospect whose expectation is conditionally convergent (like the Pasadena game), the theory must assign a value that does not depend on the order of enumeration of the outcomes. 
     *Motivation*: The value of a prospect should not depend on how we list the outcomes. This is a commitment of those who reject the idea that the order of summation should matter (e.g., bounded utility and risk-weighting camps). However, some theories (like those that truncate) might assign a value that is order-dependent and then fix an order (e.g., by probability or payoff size). We mark this as conditional: it is non-negotiable if we require order-invariance, but some camps may relax it.

  5. **Avoiding Exploitation by Pascal's Mugging (Non-negotiable)**: The theory must not be vulnerable to Pascal's mugging, in which an arbitrarily small probability of an arbitrarily large payoff can dominate the decision. 
     *Motivation*: Real agents are bounded and cannot be forced to accept a bet that requires them to pay attention to minuscule probabilities of astronomical payoffs. The theory must not allow a prospect that is constructed by an adversary (like in prospect 5) to always be ranked higher than any fixed prospect. This is non-negotiable because otherwise the agent can be mugged.

  6. **Convergence of the Evaluation Method (Non-negotiable)**: The method used to evaluate a prospect must converge in finite time (or in the limit in a way that a bounded agent can approximate) for every prospect that the theory considers. 
     *Motivation*: Without convergence, the agent cannot compute the rank. This is non-negotiable.

  7. **Continuity with Bounded Cases (Conditional)**: The theory should approach the expected value for prospects with bounded payoffs and finite support as a special case. 
     *Motivation*: We want the theory to generalize expected value for ordinary cases. This is a commitment of bounded utility and truncation camps. However, some theories (like growth-rate maximization) might not satisfy this and instead use a different criterion.

  8. **Sensitivity to Probabilities and Payoffs (Conditional)**: The theory should be sensitive to changes in probabilities and payoffs. For example, if two prospects are identical except in one outcome, then changing the payoff in that outcome should change the evaluation. 
     *Motivation*: We want the theory to be responsive to the details of the prospect. This is non-negotiable in the sense that we don't want a theory that ignores differences, but the form of sensitivity might vary (e.g., logarithmic vs linear). It is a commitment of most camps.

  9. **Explanation of Observed Behavior (Conditional)**: The theory should explain what real agents actually pay for such prospects. 
     *Motivation*: This is a commitment of descriptive theories (like those that use risk-weighting) but not necessarily of normative ones. We mark it as conditional because the system might be intended as normative and not descriptive.

  ## Handling the Five Prospects

  We now state what the theory must do for each prospect:

  1. **Classic St. Petersburg**: The theory must assign a finite value (or a finite rank) to the prospect. It cannot say the expectation is infinite and then fail to rank it. It may assign a finite value by one of the methods (e.g., bounded utility, truncation, etc.).

  2. **Scaled Harmonic**: Similarly, the theory must assign a finite value. The divergence is slower but still present. The theory must handle it.

  3. **Pasadena Game**: The theory must assign a determinate value that does not depend on rearrangement. If the theory cannot handle conditionally convergent series, it must disqualify the prospect. But if it does disqualify, then we must check the next prospect. 

  4. **Modified Pasadena (first toss pays $3)**: By dominance (desideratum 2), this must be ranked at least as high as prospect 3. If the theory disqualifies prospect 3, then it must either (a) also disqualify prospect 4 (but then we lose dominance because prospect 4 dominates prospect 3) or (b) assign a value to prospect 4. If it assigns a value to prospect 4, then why not to prospect 3? This tension suggests that disqualifying prospect 3 is problematic. Therefore, the theory should handle prospect 3 without disqualification.

  5. **Pascal's Mugging**: The theory must not allow the mugging prospect to always be ranked above any fixed alternative. It must assign a finite value (or rank) that does not depend on the proposer's ability to name arbitrarily large payoffs with arbitrarily small probabilities.

  ## Further Matters

  ### Distinctions to Keep or Collapse

  - **Value vs. Price**: The theory must distinguish the value of a prospect (which is used for ranking) from the price an agent should pay to enter it. The price might depend on the agent's wealth and risk aversion. The ranking should be based on the prospect's inherent properties, but the buying price might be derived from the ranking and the agent's situation. We must keep these distinct.

  - **Other Distinctions**: The theory may collapse the distinction between a prospect and a slightly perturbed version if the difference is below a threshold of practical significance (due to bounded computation). But it must not collapse distinctions that are significant (e.g., between two prospects that differ by a dominance relation).

  ### Admissibility of "No Determinate Value"

  The output "no determinate value" is admissible only for prospects that the theory disqualifies. However, if the theory disqualifies a prospect that it must handle (like the classic St. Petersburg) then it fails. For the Pasadena game, if the theory cannot assign an order-invariant value, then disqualification might be acceptable. But note the tension with prospect 4: if prospect 4 is assigned a value and prospect 3 is not, then we cannot apply dominance. Therefore, disqualification of prospect 3 must also lead to disqualification of prospect 4? But then we cannot compare them? This violates dominance. Hence, the theory should avoid disqualification for these cases. 

  We conclude that the output "no determinate value" is admissible only in rare cases (if at all) because it can conflict with dominance. It is not admissible for the classic St. Petersburg or for the Pasadena game if we require dominance.

  ### Explanation of Observed Behavior

  It is not a desideratum that the theory explain what real agents actually pay. The system is for an automated allocation system, which is normative. Real agents might underpay due to risk aversion or bounded rationality, but the system should base its ranking on rational principles. However, if the theory is to be descriptive, then it would be a desideratum. We mark it as conditional and not required for this system.

  ## Tensions and Impossibilities

  We believe there is a tension between:

  - **Dominance** (desideratum 2) and **Robustness to Rearrangement** (desideratum 4) for the Pasadena game and its modification. If we require that the Pasadena game (prospect 3) has a determinate value that is order-invariant, then we must assign a value. But the alternating series can be rearranged to any real number. How can we assign an order-invariant value? The common solution is to fix the order by the natural order of the tosses (n=1,2,3,...). But then the value is ln(2). However, that is order-dependent? Actually, the natural order is part of the prospect definition. So we might say the prospect specifies the order. But then the theory must respect that order? That would violate robustness to rearrangement. 

    Resolution: We might require that the value of a prospect is independent of the order of summation only if the prospect is absolutely convergent? Then the Pasadena game is not absolutely convergent and we fix the order by the natural order of the coin tosses. Then we assign ln(2) and avoid rearrangement. This is a common approach. Then we don't require robustness for conditionally convergent series? We adjust desideratum 4 to: "For a prospect whose expectation is absolutely convergent, the value must be order-invariant. For conditionally convergent prospects, the theory may use the natural order (the order in which states arise in the experiment) to assign a value." Then we avoid the tension.

    However, if we do that, then we are not truly order-invariant. But the natural order is part of the prospect. So it's acceptable.

  - Another tension is between **Computational Feasibility** and **Convergence of the Evaluation Method** for the classic St. Petersburg. The expectation is infinite, but any finite truncation might not converge to a finite value? The common bounded utility approach (like log utility) converges quickly. Truncation methods also converge in finite steps (by ignoring tails). So this tension is resolved by the method.

  The most eliminative desideratum is **Avoiding Pascal's Mugging**. It rules out any theory that uses linear expected utility without bounds (because then the mugging prospect always wins). It forces the theory to discount small probabilities or bound utility.

  ## Scoring Main Families

  We briefly score the main families against the desiderata:

  - **Bounded Utility (e.g., log utility)**: 
    - Pros: Satisfies determinacy (1), dominance (2), computational feasibility (3) if the utility function is chosen appropriately, avoids Pascal's mugging (5) by diminishing marginal utility, convergence (6), continuity (7), sensitivity (8). 
    - Cons: For the Pasadena game (3), it might assign a value by taking the expectation of utility, but the utility of the Pasadena payoffs might lead to a conditionally convergent series? If we use log utility on the Pasadena payoffs, the series might still be conditionally convergent. So it might fail robustness (4) unless we fix the natural order.

  - **Truncation (ignoring small probabilities)**:
    - Pros: Determinacy (1), dominance (2) if truncation is done statewise and consistently, computational (3), avoids mugging (5), convergence (6). 
    - Cons: Truncation might violate dominance if not done carefully (e.g., if we truncate at a fixed probability, then a prospect that has a very large payoff below the threshold might be truncated and then a prospect that dominates it might be truncated differently). Also, for Pasadena, truncation with a fixed cutoff might assign a value that is approximately the partial sum in natural order, so it handles 3 and 4. However, it may not be robust to rearrangement because the truncation is order-dependent? But if we fix the order (natural order) then it's okay.

  - **Risk-Weighting (e.g., rank-dependent utility)**:
    - Pros: Can handle the classic and Pasadena by transforming probabilities. Can avoid mugging by underweighting small probabilities. 
    - Cons: The weighting function might be arbitrary. Computational feasibility might be an issue if the prospect has infinitely many outcomes. Dominance might be violated if the weighting function is not monotonic? (But usually it is.)

  - **Growth-Rate Maximization (Kelly criterion)**:
    - Pros: For repeated games, it gives a clear criterion. 
    - Cons: For one-shot, it might not apply. Also, for the Pasadena game, it might not be defined.

  - **Denial of Expectation (e.g., using median or other quantiles)**:
    - Pros: Avoids the infinite expectation. 
    - Cons: May violate dominance (e.g., a prospect that always pays more might have the same median) and sensitivity.

  Given the tensions, we see that bounded utility and truncation are the leading candidates. They must be implemented carefully to handle the Pasadena game.

  ## Revised Desiderata with Adjustments

  We adjust desideratum 4 based on the above:

  4. **Order-Invariance for Absolutely Convergent Series; Natural Order Otherwise**: For a prospect whose expectation is absolutely convergent, the value must be independent of the order of summation. For a prospect that is conditionally convergent, the theory must use the natural order of the states (as given by the experiment) to assign a value. This value then must be robust to the natural order (i.e., the order is fixed by the prospect). 
     *Motivation*: The natural order is part of the prospect definition. We require that the value does not change if we rearrange the states arbitrarily only when the series is absolutely convergent. For conditional convergence, we fix the order to the natural one. This is a commitment of many camps.

  We then require that the theory assign a value to the Pasadena game using the natural order (so ln(2) for the original). Then prospect 4 must be valued at least that (by dominance) and we can compute it similarly.

  With this adjustment, we avoid the tension between dominance and rearrangement.

  ## Final List of Desiderata

  1. **Determinacy of Ranking (Non-negotiable)**
  2. **Strict Dominance (Non-negotiable)**
  3. **Computational Feasibility (Non-negotiable)**
  4. **Order Handling**: 
     - (a) For absolutely convergent expectation, order-invariance. 
     - (b) For conditionally convergent, use natural order. (Conditional, but necessary for handling Pasadena without violating dominance.)
  5. **Avoid Pascal's Mugging (Non-negotiable)**
  6. **Convergence of Evaluation Method (Non-negotiable)**
  7. **Continuity with Bounded Cases (Conditional, but desirable)**
  8. **Sensitivity (Non-negotiable in weak form: must not ignore changes)**
  9. **Explanation of Observed Behavior (Conditional, not required for normative system)**

  This list should be able to handle the five prospects:

  1. Classic: Any method (bounded utility, truncation) gives a finite value.
  2. Scaled Harmonic: Similarly.
  3. Pasadena: Use natural order -> ln(2).
  4. Modified Pasadena: Use natural order -> value = (3/2) + sum_{n=2}^∞ (-1)^{n-1} * 2^n / (n * 2^n) = 3/2 + (1/2) * (ln(2) - 1) [if I did the math right, but at least we compute it] and then by dominance it is higher than 3.
  5. Pascal's Mugging: Discounted by bounded utility or truncation.

  We believe these desiderata can be jointly satisfied by, for example, a bounded utility function (like log) and using natural order for conditionally convergent series. Truncation methods also work if they respect natural order.

  The most eliminative desideratum is **Avoiding Pascal's Mugging** because it forces the theory to have a way to downweight extreme payoffs with tiny probabilities.
answer: |-
  Below is a specification of desiderata for a theory of choice under unbounded payoffs, designed to solve the St. Petersburg problem and related prospects for a bounded agent. The desiderata are grounded in normative rationality, computational feasibility, and consistency requirements. Each is labeled as **non-negotiable** (essential for any candidate theory) or **camp-specific** (reflecting commitments of particular approaches, e.g., bounded utility, probability truncation, risk-weighting). Motivations and tensions are explicitly addressed. The list is validated against your five prospects and resolves the two additional matters.

  ---

  ### **Desiderata for a Theory of Choice Under Unbounded Payoffs**

  1. **Determinate Ranking (Non-negotiable)**  
     - **Motivation**: The agent cannot decline to decide; the system must produce a complete, transitive ordering of prospects to guide action. Undefined comparisons create paralyzing gaps.  
     - **Prospect implications**: Disqualifies theories that fail to rank prospects 1–5 or leave comparisons ambiguous (e.g., prospect 4 vs. 3).  

  2. **Dominance Compliance (Non-negotiable)**  
     - **Motivation**: If prospect A pays ≥ prospect B in all states and > B in at least one state, A must rank ≥ B. Violations permit dominated choices, violating rationality.  
     - **Prospect implications**: Prospect 4 must rank ≥ prospect 3. Failure violates this desideratum.  

  3. **Computational Tractability (Non-negotiable)**  
     - **Motivation**: A bounded agent cannot compute infinite series, handle arbitrarily small probabilities, or store unbounded numbers. The theory must yield a verdict in finite time/space.  
     - **Prospect implications**: Must handle prospects 1–5 without requiring exact convergence of divergent series (e.g., prospects 1 and 2) or precise evaluation of astronomically unlikely outcomes (e.g., prospect 5).  

  4. **Scale Insensitivity (Camp-specific: Bounded Utility/Growth-Rate Maximization)**  
     - **Motivation**: Linear utility permits Pascal’s mugging (prospect 5). Scaling payoffs via a concave function (e.g., log utility) or growth-rate criterion (e.g., Kelly betting) avoids this by bounding effective utility.  
     - **Prospect implications**: Ranks prospects 1, 2, and 5 finitely; mutes sensitivity to extreme payoffs. Not required by truncation/risk-weighting camps.  

  5. **Probability-Weight Convergence (Camp-specific: Truncation/Risk-Weighting)**  
     - **Motivation**: Bounded agents cannot distinguish very small probabilities (e.g., < 10^−100). Theories may truncate negligible probabilities or apply a probability-weighting function (e.g., rank-dependent utility) to ensure sums converge.  
     - **Prospect implications**: Resolves prospects 1, 2, and 5 by ignoring tail events or reweighting probabilities. Not required by bounded utility camps.  

  6. **Order Invariance (Non-negotiable for Conditionally Convergent Prospects)**  
     - **Motivation**: For conditionally convergent expectations (e.g., prospect 3), the value must not depend on outcome enumeration. Order-dependent rankings are arbitrary and manipulable.  
     - **Prospect implications**: Prospect 3 must yield a unique value independent of summation order. Theories that fail this must disqualify prospect 3 (but see prospect 4 tension).  

  7. **Pascal’s Mugging Immunity (Non-negotiable)**  
     - **Motivation**: Adversarial prospects (e.g., prospect 5) cannot always outrank all fixed alternatives by promising arbitrary payoffs. The theory must bound sensitivity to tiny probabilities.  
     - **Prospect implications**: Prospect 5 must have finite rank; cannot dominate, e.g., a sure $1,000. Eliminates linear expectation.  

  8. **Continuity in the Limit (Camp-specific: Bounded Utility/Truncation)**  
     - **Motivation**: For prospects with bounded payoffs, the theory should approach standard expected value. Avoids radical discontinuities (e.g., a prospect paying $2^n for n ≤ 1000 vs. the classic St. Petersburg).  
     - **Prospect implications**: Prospects 1 and 2 should be ranked similarly to their truncated analogs. Not required by risk-weighting camps (which may overweight tails).  

  ---

  ### **Handling the Five Prospects**
  - **Prospect 1 (Classic)**: Must have finite rank (via desiderata 4, 5, or 7). Disqualification violates 1.  
  - **Prospect 2 (Scaled Harmonic)**: Same as 1; divergence is slower but still unbounded.  
  - **Prospect 3 (Pasadena)**: Must assign a unique value (desideratum 6). If order invariance fails, disqualification violates 1 and creates a gap (problematic for prospect 4).  
  - **Prospect 4 (Modified Pasadena)**: Must rank ≥ prospect 3 (desideratum 2). If prospect 3 is disqualified, prospect 4 cannot be ranked, violating 1. Thus, disqualification is inadmissible here.  
  - **Prospect 5 (Pascal’s Mugging)**: Must have finite rank (desideratum 7) and not be exploitable.  

  ---

  ### **Distinctions an Adequate Solution Must Preserve**
  - **Value vs. Price**: Must distinguish the *value* (a cardinal score for ranking) from the *price* (what an agent should pay to enter the prospect). Price depends on wealth, risk aversion, and outside options; value is invariant. *Rationale*: Conflating them (as in some descriptive models) obscures normative guidance.  
  - **Risk vs. Ambiguity**: May collapse if both reduce to a single decision weight, but must distinguish known probabilities (e.g., coin flips) from true uncertainty (e.g., unquantifiable events).  
  - **Ordinal Ranking vs. Cardinal Strength**: Must produce a ranking (ordinal), but cardinal strength (e.g., how much better A is than B) is optional unless required for allocation.  

  ---

  ### **Admissibility of "No Determinate Value"**
  - **Admissible only if disqualification is consistent and gap-tolerant**.  
    - If a theory disqualifies prospect 3 (Pasadena) due to order-invariance failures, it must also disqualify prospect 4 (modified Pasadena) to avoid violating dominance (desideratum 2). This creates a gap in the ranking.  
    - **Verdict**: Gaps are **fatal** for prospects 1, 2, 4, and 5 (they must be ranked). For prospect 3, a gap is **honest only if** the theory explicitly defines disqualification criteria (e.g., "non-absolutely convergent expectations are inadmissible"). However, the tension with prospect 4 makes disqualification undesirable. A unified solution (e.g., natural order enforcement) is preferable.  

  ---

  ### **Explaining Real Agent Behavior**
  - **Not a desideratum**. The system is **normative**, guiding how agents *should* choose, not describing how they *do* choose. Real agents underpay for St. Petersburg prospects due to risk aversion, credit constraints, or disbelief—factors irrelevant to rational choice under the given constraints. Including descriptive fit would conflate rationality with behavioral biases.  

  ---

  ### **Tensions and Impossibilities**
  - **Tension 1: Dominance vs. Order Invariance (Prospects 3 & 4)**  
    - If prospect 3 is disqualified to avoid order dependence, prospect 4 cannot be ranked without violating dominance (desideratum 2). If prospect 3 is assigned a value (e.g., via natural order), prospect 4 must be ≥ it.  
    - **Resolution**: Enforce **natural order** (order of tosses) for conditionally convergent prospects. Satisfies order invariance operationally and resolves dominance.  

  - **Tension 2: Computability vs. Completeness**  
    - Bounded agents cannot compute limits of infinite series (desideratum 3), yet determinacy (desideratum 1) requires a complete ranking.  
    - **Resolution**: Approximations (e.g., truncation, asymptotic bounds) are acceptable if they guarantee a ranking in finite steps.  

  - **Most Eliminative Desideratum**: **Pascal’s Mugging Immunity (desideratum 7)**.  
    - Eliminates linear expectation, naive maximax, and any theory without probability/utility damping. Forces discounting of extreme tail payoffs.  

  - **Substantive Impossibility**: **Full continuity with standard expectation + immunity to mugging + unbounded payoffs**.  
    - Linear expectation satisfies continuity (desideratum 8) but fails mugging immunity (7). Bounded utility satisfies 7 and 8 but breaks linearity. *No theory satisfies all three*.  

  ---

  ### **Brief Scoring of Solution Families**
  | **Family**              | **Key Desiderata Satisfied**                                       | **Key Failures**                                     |  
  |--------------------------|-------------------------------------------------------------------|-----------------------------------------------------|  
  | **Bounded Utility**      | 1, 2, 4, 6 (natural order), 7, 8                                 | May violate 5 (no explicit probability damping)     |  
  | **Probability Truncation**| 1, 2, 3, 5, 7, 8                                                 | Fails 6 if order-dependent; weak on continuity      |  
  | **Risk-Weighting**       | 1, 2, 3, 5, 7                                                    | May violate 6 (order dependence); ignores 8         |  
  | **Growth-Rate (Kelly)**  | 1, 2, 4, 7                                                       | Fails 3 (requires repeated plays); ignores 5, 6, 8 |  
  | **Expectation Denial**   | 3, 5, 7                                                          | Fails 1, 2 (e.g., median violates dominance)        |  

  **Strongest Candidates**: Bounded utility (e.g., log or exponential) and truncation (with natural order for Pasadena). Both satisfy all non-negotiables and handle all five prospects.  

  ---

  This specification defines the requirements for an automated allocation system, prioritizing determinacy, dominance, computability, and mugging immunity. Tensions are resolved via natural order enforcement and explicit disqualification criteria. A theory satisfying these will robustly rank unbounded prospects for bounded agents.
