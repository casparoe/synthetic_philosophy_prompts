answer: |-
  ## Frequently Asked Questions: Underwriting Methodology

  **Introduction**
  At The Prudent Underwriter (TPU), we believe in confronting uncertainty with intellectual rigour and transparency. Traditional insurers rely on single probability figures, which we consider an unwarranted oversimplification of complex risks. Instead, we model our beliefs about potential events using our proprietary Committee Methodology™. This approach provides a more comprehensive picture of uncertainty by capturing a *range* of plausible probabilities, rather than a single, potentially misleading point estimate. While this methodology reflects our commitment to precision in representing uncertainty, it naturally informs our underwriting decisions, which are governed by strict unanimity protocols. Below, we address common queries regarding our approach.

  **1. Why does TPU only publish a range of probabilities for an event, like the chance my warehouse floods, instead of a single number like other insurers?**
  Our Committee Methodology™ represents our belief state as a committee of expert probability assessors. Each committee member holds a complete, coherent view of all relevant uncertainties. The range we publish reflects the spectrum of views held by this committee. A single number could only represent one committee member's view, ignoring the legitimate diversity of opinion present in a sophisticated analysis. Publishing the range acknowledges the inherent ambiguity in complex risk assessment. Competitors' single figures mask this necessary ambiguity.

  **2. What does this range actually mean for me? Can I get a quote based on it?**
  Each committee member assigns a specific degree of belief, interpretable as the fair price at which they would buy or sell a £1 stake on the event occurring. The published range defines the band of odds within which TPU takes *no position*. We will neither buy (offer insurance) nor sell (accept a premium to assume the risk) at odds falling strictly within this band. A quote requires a specific premium derived from a specific probability. Our unanimity decision rule (explained further in Question 5) determines when such a specific premium is acceptable to TPU.

  **3. You say you’ve never actually issued a policy. How is that possible if you’re an insurer?**
  Our commitment to the Committee Methodology™ and the unanimity rule dictates this outcome. To issue a policy offering £X coverage for premium £Y is equivalent to selling a stake on the *non-occurrence* of the insured event at implied odds defined by Y/X. For the policy to be written, *every* member of our committee must find these implied odds acceptable – meaning the premium £Y must be favourable relative to *every* committee member's individual probability assessment for the event. Given the inherent diversity of views represented by a non-trivial range (a hallmark of complex risks), achieving unanimity on any specific premium offer has proven exceptionally rare. This reflects the genuine depth of uncertainty we acknowledge, not a failure to underwrite.

  **4. If other insurers give me a clear price, why should I prefer TPU’s approach?**
  Competitors present you with a single probability figure, implying a certainty we believe is epistemically unjustified. Clients often exhibit a preference for known risks (like an urn with a known proportion of red balls), even when the actual probability is identical or less favourable, purely to avoid ambiguity. This preference, while understandable, cannot be captured by any single coherent probability assignment. We believe transparency about the *extent* of uncertainty is ultimately more valuable than the false comfort of a precise, but potentially arbitrary or incomplete, single figure. We offer intellectual honesty.

  **5. You mention a ‘unanimity rule’. What is that, and why do you use it?**
  The committee’s range defines the band of odds where TPU remains inactive. To act – such as accepting a premium to issue a policy – requires translating the committee’s diverse views into a single decision. Our chosen rule is unanimity: we act only if *every* committee member agrees the action is acceptable under their individual coherent probability assessment. While other decision rules are logically possible, unanimity aligns perfectly with our commitment to acting only when the evidence compels every perspective we consider plausible. The choice of rule is a fundamental aspect of our corporate policy, distinct from the probabilistic beliefs themselves (see Methodology Note 7: Decision Protocols and Credal Committees).

  **6. I read that sometimes your range for an event gets *wider* after you learn new information, even if that information seems irrelevant. How is that rational? (Dilation)**
  This phenomenon, known within our methodology as "robustness expansion," is a consequence of rigorously maintaining coherence across *all* uncertainties. New information, even if intuitively irrelevant to a specific hypothesis, can constrain the *relationships* between that hypothesis and other events in complex ways. This constraint can reveal previously unrecognised incompatibilities between the hypothesis and the views of *some* committee members, causing those members to revise their probability for the hypothesis *away* from the centre. The result is a wider range. This reflects increased awareness of the *structural* sensitivity of our belief, not irrationality. It is a mark of epistemic humility, demonstrating how learning can deepen our appreciation of uncertainty.

  **7. Isn’t your range really just expressing your precise belief *about what the correct probability range is*? Why not give us that single probability?**
  This suggestion proposes a "reduction" of our model to a single, precise meta-probability distribution over possible probability values. We reject this reduction. Our committee represents fundamental, first-order uncertainty about the world itself. Assigning a single sharp probability *to the committee's composition* presupposes a level of knowledge about the correct model of uncertainty that we explicitly disavow. The committee *is* our belief state; compressing it into a single meta-distribution obscures the genuine, unresolved conflict in plausible perspectives that the range captures (Methodology Note 2: The Ontology of the Committee). It replaces imprecision with a different kind of precision we cannot justify.

  **8. How is your ‘imprecise probability’ different from just being vague?**
  Vagueness implies there is no fact of the matter about what we believe. Imprecision, as practised at TPU, is fundamentally different. Each committee member holds a *perfectly precise* and coherent belief about every proposition. The imprecision arises solely because TPU has *not committed* to which single committee member represents "our" belief. There *is* a precise fact of the matter about the committee's composition and each member's views; the range is a direct consequence of these precise facts. We are not vague; we are meticulously precise about the boundaries of our own unresolved judgement.

  **9. Couldn’t you just average your committee members’ views to get a single probability?**
  Averaging presupposes a specific partition of the state space and a specific weighting over committee members – effectively creating a *new*, single probability function. This violates the core principle of our methodology. Different ways of partitioning the possibilities or weighting the members lead to different averages, none of which has a privileged claim to represent the committee's collective view. The committee's range is invariant under such arbitrary choices and captures the *essential disagreement* among plausible perspectives. Averaging artificially collapses that disagreement.

  **10. As a homeowner, I just want to know if my house will flood this year and what it costs to insure it. How does your method help me?**
  TPU provides the most epistemically responsible representation of the uncertainty surrounding events like your house flooding. Our published range for such an event accurately reflects the genuine divergence in plausible expert assessments, untainted by artificial precision. While this level of transparency may not yield a specific insurance quote under our current unanimity rule, it offers unparalleled insight into the *structure* of the risk. Understanding the full breadth of plausible probabilities – the band within which even experts fundamentally disagree – is crucial for informed risk management decisions, even if the immediate outcome is the recognition that no single premium currently satisfies our stringent requirement for unanimous committee acceptance.
