  First, I need to unpack this evolutionary debunking argument (EDA). As I recall, the core idea is that if our moral beliefs evolved for survival rather than truth-tracking, they might be unreliable. But the book's presentation seems to oversimplify it into a knockout punch against moral realism. 

  Let me break down what's accurate in that paragraph. Defenders of EDA would indeed agree that natural selection shaped moral intuitions based on fitness, not truth-tracking. They'd also accept that this challenges moral realism by questioning the reliability of moral beliefs. But where does it go too far? Saying the content is "best explained" solely by evolution ignores how other factors might contribute. And claiming realism is "false" jumps from epistemic doubt to ontological conclusion—EDA questions our access to moral truths, not necessarily their existence. 

  The user seems non-expert but perceptive—they sensed something was off about the "settled" claim. I should emphasize that philosophers still debate this vigorously. Realists have counterarguments: maybe evolution could coincidentally track truths, or maybe rational reflection corrects for biases. The book's dismissal of these nuances is a big problem.

  For the "settled" claim—that's just false. Even prominent EDA defenders like Sharon Street don't claim it settles realism; they see it as shifting the burden. And the leap from unreliability to realism's falsity conflates two separate issues: whether we can know moral facts versus whether they exist at all. 

