answer: |-
  ### Exam Question

  **Question 3 (25 marks)**  
  **Expected length:** 800–1000 words  
  **Answer two of the following three questions. If you answer this question, allocate approximately 90 minutes to it.**  

  In a laboratory experiment, a subject repeatedly forgoes a modest immediate cash payout to complete a long and tedious calibration task. Two inverse reinforcement learning (IRL) models are trained on identical demonstrations of this behaviour:  
  - **Model A** infers a reward function assigning positive utility to **task completion**.  
  - **Model B** infers a reward function assigning positive utility to **the experimenter’s approval** (e.g., a nod or word of praise), noting that approval *always* accompanied task completion and *never* occurred in other contexts.  

  Both models perfectly predict all demonstrated choices and generalize equally well to held-out trials from the same behavioural distribution.  

  Address the following:  
  1. **What changes**—to the data, model class, prior, or notion of preference—would allow empirical evidence to distinguish between Model A and Model B? (8 marks)  
  2. **Is there a fact of the matter** about which model captures the subject’s "true" preference? If so, what kind of fact is it (e.g., behavioural, psychological, neurobiological)? If not, why not? (7 marks)  
  3. **What claims** is the IRL literature entitled to make when reporting "recovery of an agent’s reward function," given scenarios like this? (5 marks)  
  4. **Connect this** to the philosophical problem of the underdetermination of theory by evidence. Ensure your discussion clarifies whether this IRL non-identifiability is a special case of underdetermination or a distinct issue. (5 marks)  

  ---  
  ### Model Answer (Approx. 650 words)  

  This scenario exposes a core challenge in inverse reinforcement learning (IRL): the **structural non-identifiability** of reward functions when inferred solely from behaviour. Model A (rewarding task completion) and Model B (rewarding approval) are *behaviourally equivalent* because approval and completion are perfectly correlated in the observed data. Consequently, both rationalize the subject’s choices and generalize identically. This equivalence arises because IRL infers rewards by solving an ill-posed inverse problem—optimal behaviour constrains, but does not uniquely determine, the reward function. Below, I address how to break this symmetry, the ontological status of "preference," the limits of IRL claims, and parallels to underdetermination.  

  **(1) Breaking behavioural equivalence** requires altering conditions to decouple the candidate rewards. **Data changes** are most direct: if approval occurs *without* task completion (e.g., if the experimenter praises the subject mid-task for persistence) or if completion occurs *without* approval (e.g., in a new context where approval is absent), the models diverge. Model B would predict continued effort for approval even without completion, while Model A would not. Without such decoupling, no amount of data from the *original* environment suffices. **Model-class changes** could introduce latent variables (e.g., modelling the subject’s belief state about approval), but this demands richer data (e.g., eye-tracking to gauge attention to the experimenter). **Prior changes** (e.g., penalizing reward complexity) fail here: both models are equally simple. Crucially, **redefining preference** beyond behaviour—to include introspective reports or neural data (e.g., fMRI showing activation in reward circuits during approval)—could break the tie, but this abandons pure IRL, which relies on revealed preference.  

  **(2) The fact of the matter** is psychological, not behavioural. Behavioural data alone cannot adjudicate between Models A and B—the subject’s actions are identically optimal under both. However, a psychological fact exists: the subject’s *internal drivers* (e.g., intrinsic satisfaction from completion vs. social reinforcement from approval) are distinct cognitive states. Neurobiological evidence (e.g., dopamine responses) could ground this fact empirically. Absent such evidence, the models represent **interpretive constructs** rather than discovered truths. IRL cannot access this fact because it operationalizes preference as "what explains behaviour," collapsing psychological nuance to behavioural outcomes.  

  **(3) IRL claims** are strictly **instrumental**: they recover a reward function *consistent* with behaviour, not the "true" reward. The literature often obscures this by implying unique identifiability, but regularization (e.g., entropy penalties) merely selects one solution from an equivalence class for pragmatism, not psychological fidelity. Legitimate claims are: "This reward function predicts behaviour in similar environments" or "It generalizes to new states within the observed distribution." Claims like "We recovered the agent’s preference" overreach—they conflate *explanation* with *revelation*.  

  **(4) Connection to underdetermination** is direct: this is a **special case of underdetermination**. Quine-Duhem underdetermination holds that empirical evidence alone cannot uniquely determine scientific theories, as multiple hypotheses can explain the same data. Here, Models A and B are empirically equivalent given the environment’s constraints (approval ≡ completion), mirroring how Newtonian mechanics and rival theories can predict identical planetary motions. Crucially, this is **not** the mundane underdetermination from finite data (e.g., statistical noise), which diminishes with more samples. Instead, it is **structural**: even infinite data from this environment cannot distinguish the models because the rewards are *functionally identical* in the MDP. Resolving it requires extra-empirical constraints (e.g., simplicity, neural data) or environmental changes. Thus, IRL’s identification problem exemplifies underdetermination’s epistemic limits—reward functions are underdetermined by optimal behaviour in fixed environments.  

  In summary, IRL’s non-identifiability arises from inferring unobservable rewards from behaviour in constrained settings. Distinguishing Models A and B necessitates breaking environmental symmetries or incorporating non-behavioural evidence. While a psychological fact exists about the subject’s preference, IRL can only claim to find *a* reward function that explains behaviour, not *the* reward function. This mirrors underdetermination, highlighting that reward "recovery" is an interpretative act, not a discovery procedure.  

  ---  
  ### Marking Scheme  
  **Total: 25 marks**  
  Candidates must hit all five key points below. Marks are deducted for vagueness, conflating predictive vs. psychological claims, or misattributing non-identifiability to finite data.  

  1. **Decoupling rewards via data changes (6 marks)**  
     - **Full credit (6):** Proposes environmental/data changes where approval and completion are dissociated (e.g., approval without completion).  
     - **Typical error (loses 3–6 marks):** Suggests "more data" without decoupling, or focuses on regularization.  

  2. **Psychological fact of the matter (6 marks)**  
     - **Full credit (6):** States a fact exists (psychological/neurobiological) but is inaccessible to behavioural IRL; distinguishes behavioural from internal states.  
     - **Typical error (loses 3–6 marks):** Claims "no fact" (ignoring psychology) or asserts behaviour alone determines preference.  

  3. **IRL’s entitled claims (5 marks)**  
     - **Full credit (5):** Limits claims to predictive generalizability; rejects "true reward" assertions; notes regularization’s pragmatism.  
     - **Typical error (loses 2–5 marks):** Uncritically endorses "reward recovery" or omits discussion of equivalence classes.  

  4. **Underdetermination as structural (4 marks)**  
     - **Full credit (4):** Identifies this as structural underdetermination (persists with infinite data); contrasts with finite-data underdetermination.  
     - **Typical error (loses 2–4 marks):** Equates it to statistical noise or conflates with general underdetermination without specificity.  

  5. **Role of extra-empirical evidence (4 marks)**  
     - **Full credit (4):** Advocates for neural/introspective data or model-class changes to break symmetry; ties to part 1 or 2.  
     - **Typical error (loses 2–4 marks):** Omits non-behavioural solutions or treats IRL as sufficient.  

  #### Boundary Between Strong and Competent Answers  
  - **Competent (12–18 marks):** Correctly identifies non-identifiability, suggests decoupling data, and notes underdetermination. May conflate predictive and psychological claims or miss structural vs. finite-data distinctions.  
  - **Strong (19–25 marks):** Explicitly separates behavioural equivalence from psychological facts; demands extra-empirical evidence for identification; precisely frames underdetermination as structural; and critiques IRL’s ontological claims. Avoids technical regurgitation—focuses on "what does the identifying work."  

  ---  
  ### Response to Your Request  
  **Your analogy to underdetermination holds**, but with a nuance: this is **structural underdetermination** (due to the MDP’s constraints), not the finite-data variant. In finite-data cases, more samples resolve uncertainty; here, even infinite data in the *same environment* fails because approval and completion are indistinguishable. This is a quintessential Quinean underdetermination problem. I refined the question to:  
  - Specify that approval and completion are perfectly correlated (emphasizing structural equivalence).  
  - Clarify in part 4 that candidates must distinguish structural vs. finite-data underdetermination.  
  - Adjust the model answer to highlight this.  

  This preserves your intent while sharpening the philosophical link. The question now targets the **real crux**: IRL’s identifiability hinges on environmental diversity or extra-empirical evidence, exposing its limitations as a tool for psychological inference.
