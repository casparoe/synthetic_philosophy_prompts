  2. There may be a fact of the matter about the subject's preference. The fact would be psychological: it concerns the subject's internal cognitive and affective states. For example, the subject might be motivated by a desire for approval (a social reward) or by a sense of duty (completing the task). These are distinct psychological states. However, without additional non-behavioural evidence (e.g., self-reports, neural correlates), we cannot determine which it is. Behaviourally, there is no fact because the behaviours are identical. Thus, the fact is not behavioural but psychological (or neurobiological). IRL, as typically defined, only infers reward functions from behaviour, so it cannot by itself access these psychological facts.

