prompt: |-
  I keep running into a specific pattern in political argument, and I can't tell whether there is an established term for it. Take the phrase "Western values." When one speaker deploys it — say, in defense of immigration restrictions — the content they have in mind is roughly Christian cultural heritage, the traditional family, national sovereignty, and public order. When a different speaker deploys the very same phrase — say, in defense of a court ruling or a piece of foreign policy — the content is individual rights, secular government, the rule of law, and gender equality. And when a third, more critical speaker invokes it, it often means something like the reverse: a universalist package that historically masked European imperialism and the export of a particular economic order.

  What strikes me is not simply that people disagree about what the phrase means, but that each user seems to treat it as having a single, stable, knowable referent, and to treat the others as the ones misusing it. The phrase behaves less like a description and more like a container that gets refilled with different commitments depending on who is arguing and what the speaker needs it to do, while still being wielded as if it pointed at one fixed thing.

  Is there a name for this configuration? I have a sense it is near ideas like equivocation, moving the goalposts, or an umbrella term, but I don't think any of those quite captures it — the issue is not that one person is being careless or shifting a standard, but that the category itself has no settled extension and is doing strategic argumentative work in several incompatible directions at once. If there is an established concept, which of the near ones fits best, and where does it stop applying? And if there isn't, what would you call it, and what are the boundary cases — specifically, where does this kind of shifting reference end and ordinary, good-faith disagreement about a term's meaning begin?
reasoning: |-
  Okay, this user is describing a fascinating linguistic phenomenon in political discourse. They've noticed how "Western values" gets filled with completely different meanings depending on who's speaking - traditionalists, liberals, and critics all use the same phrase to mean opposing things, while acting like their definition is the obvious one. 

  Hmm, they're clearly well-versed in political theory and philosophy given how precisely they delineate the three usages. What they're really digging for isn't just terminology but a framework to understand why this keeps happening. The frustration comes through - they've already rejected surface-level explanations like equivocation because the issue runs deeper.

  Let me unpack their core observations: First, the term functions as an empty vessel for ideological commitments. Second, all users perform this weird cognitive move where they treat their particular filling as self-evident. Third, this isn't accidental but strategic - the ambiguity itself is weaponized. 

  The closest established concepts would be floating signifiers (from semiotics) or essentially contested concepts (from political philosophy). But neither fully captures the performative aspect they described - how speakers actively deny the term's ambiguity while exploiting it. That's where Weitzman's "ideological chameleon" concept fits best. 

  Interesting boundary they want: When does this become bad faith? Key distinctions would be whether speakers acknowledge ambiguity when pressed, whether their usage correlates with fixed principles, and whether they allow for coexistence of meanings. The critical speaker's usage actually seems most consistent - at least they're transparent about seeing it as an oppressive construct.

  User might appreciate knowing this connects to larger debates about political language. Laclau's work on empty signifiers in hegemony theory could be relevant, though maybe too abstract. The real value is helping them recognize this as a feature rather than a bug of ideological discourse - the vagueness is what makes such terms powerful coalition-building tools, even as it breeds frustration.
answer: |-
  This is a brilliantly observed phenomenon in political discourse, and you're right to recognize it as more than simple equivocation or disagreement. There are several established concepts that capture different aspects of this pattern, but the most relevant are:

  1.  **Essentially Contested Concept (W.B. Gallie):**
      *   **Definition:** Concepts whose very meaning is inherently disputed because they embody complex, evaluative ideals that different groups define according to their core values and priorities. There is no single "correct" definition agreed upon by all reasonable parties.
      *   **Fit:** "Western values" is a prime example. The core elements you identified (tradition/order vs. rights/equality vs. critical deconstruction) represent fundamentally different interpretations of what constitutes the *essence* of the concept. Each side genuinely believes their interpretation captures the "true" meaning, rooted in different aspects of the historical and philosophical tradition.
      *   **Limitation:** While it perfectly explains the *existence* of competing definitions, it doesn't fully capture the **strategic deployment and performative denial of ambiguity** you observed – the way users act as if *their* definition is the only stable, obvious one and others are misusing the term.

  2.  **Floating Signifier (Linguistics/Semiotics - Saussure/Laclau):**
      *   **Definition:** A sign (word or phrase) that lacks a fixed, stable meaning. Its specific content is determined contextually, often through political struggle. Different groups compete to "fill" the signifier with their preferred meaning because it holds significant cultural power or resonance.
      *   **Fit:** This directly describes "Western values" as an empty container ("signifier") that different ideological groups ("discourses") pour their own specific meanings ("signifieds") into. Its power comes from its vagueness and positive connotations, allowing diverse groups to claim it.
      *   **Limitation:** While accurate for the *structure*, it might underemphasize the *sincerity* with which users believe their definition is the fixed one. Laclau specifically addresses this in his theory of hegemony, where groups strive to *fix* the meaning of floating signifiers.

  3.  **Ideological Chameleon / Ideograph (Michael Calvin McGee / Rhetorical Studies):**
      *   **Definition (Ideograph):** A high-level abstraction (like "freedom," "equality," "democracy") that functions as a foundational, unquestioned value term within a political culture. Its meaning is condensed and constantly renegotiated through rhetoric and struggle. Different groups invoke the ideograph to legitimize their specific policy positions by linking them to this core value.
      *   **Fit:** "Western values" functions as an ideograph. Each group uses it to *sanction* their specific agenda ("we must restrict immigration to *protect* Western values"; "this court ruling *embodies* Western values"; "this policy *exports* oppressive Western values"). The term itself carries legitimizing power, and its ambiguity is essential for its broad appeal and strategic use.
      *   **Definition (Ideological Chameleon - Eric Weitzman):** A term or phrase whose meaning shifts dramatically depending on the ideological context of its use, while maintaining an appearance of stability and naturalness. Its flexibility is key to its rhetorical power.
      *   **Fit:** This term directly captures the "refilling" and strategic deployment you describe, emphasizing how the *same* phrase seamlessly adopts different, even contradictory meanings within different ideological arguments, all while pretending to refer to one fixed thing.

  **The Best Fit & What to Call It:**

  *   **"Ideological Chameleon"** is the most evocative and precise term for the *specific strategic behavior* you observed: the same phrase changing its substantive meaning dramatically based on the speaker and argumentative goal, while being wielded *as if* it had a single, stable referent, and dismissing competing uses as illegitimate.
  *   **"Essentially Contested Concept"** explains *why* this is possible – because the concept's core is inherently disputable.
  *   **"Floating Signifier"** describes the *structural mechanism* – the lack of inherent fixed meaning.
  *   **"Ideograph"** highlights its *function* as a legitimizing symbol within political rhetoric.

  **Therefore, you could accurately call this configuration:**

  *   **"Western values" functioning as an Ideological Chameleon.**
  *   **The strategic deployment of an Essentially Contested Concept / Floating Signifier / Ideograph.**

  **Where Does This End and Good-Faith Disagreement Begin?**

  The boundary lies in **transparency, consistency, and acknowledgment of ambiguity:**

  1.  **Acknowledgment of Ambiguity:** In good-faith disagreement, participants might recognize that a term like "freedom" or "justice" is complex and admits of different interpretations. They might say, "I define Western values primarily as X, emphasizing Y, while you focus on Z. Let's discuss which aspects we prioritize and why." The bad-faith move is **insisting there is only one obvious, stable meaning and others are simply wrong or dishonest.**
  2.  **Consistency of Application:** Does a speaker use the term consistently with their own stated principles across different contexts? Or does the meaning shift conveniently depending on the argument being made *against a specific opponent*? Strategic chameleons often shift definitions to attack different foes.
  3.  **Transparency of Argument:** Is the speaker using the term primarily as a vague, emotionally resonant banner to rally support ("We must defend Western values!") without clearly defining what specific policies or principles that entails *in this context*? Or are they grounding their use in specific historical events, legal principles, or philosophical arguments, even if others disagree with their interpretation?
  4.  **Purpose:** Is the term being used as a genuine attempt to describe a complex reality (even if contested), or is it primarily being wielded as a rhetorical club to delegitimize opponents ("Your policy is anti-Western values!") or to avoid substantive debate by invoking an unquestionable good?
  5.  **Openness to Nuance:** Does the speaker allow for the concept to have multiple facets, some potentially in tension? Or is it presented as a monolithic, unambiguous package?

  **Boundary Cases:**

  *   **Ordinary Disagreement:** Two historians debate whether "Western values" during the Enlightenment emphasized individual rights *more* than communal obligations, both acknowledging the tension exists and grounding their arguments in specific texts and contexts. They disagree on emphasis, not the fundamental nature of the concept's ambiguity.
  *   **Strategic Chameleon/Contested Concept at Work:** Speaker A insists restricting immigration is "defending Western values" (meaning tradition/order), while simultaneously condemning a court ruling protecting minority rights as "an attack on Western values" (ignoring the rights/equality dimension). Speaker B invokes "Western values" (rights/equality) to support the court ruling but dismisses concerns about social cohesion raised by immigration as "xenophobia," refusing to acknowledge any potential tension within the concept. Speaker C uses "Western values" solely as a synonym for "imperialism" or "capitalist exploitation," denying any positive historical association with rights or democracy.
  *   **Edge Case:** A politician uses "Western values" vaguely in a rallying cry ("We stand for Western values!"). Is this bad faith? It leans towards the strategic use of ambiguity for mobilization, but if pressed, they *might* define it consistently. The refusal to define it when challenged, or defining it differently in different audiences, pushes it firmly into chameleon territory.

  **In essence:** The "chameleon" behavior arises when a term's inherent ambiguity (as an essentially contested concept/floating signifier/ideograph) is exploited **strategically**, with the user **denying the ambiguity exists** and treating their specific, context-driven definition as the only legitimate one, often to delegitimize opponents or avoid substantive debate. Good-faith disagreement acknowledges the complexity and allows for multiple interpretations, even while arguing for one's own.
