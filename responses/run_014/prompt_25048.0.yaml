  So inclusive positivism without a clarity requirement in the rule of recognition would say the new statute is law. But then she would have to revise her judgment in case 4 and 5? No, because those are different. However, she might not have a reason to reject the vague statute. But note that in case 5, she rejected the contradictory statute. Contradiction is a form of incoherence, and vagueness is a form of imprecision. They are both defects but of different kinds.

  Therefore, without a clarity requirement, inclusive positivism might accept the vague statute as law. But then she would have to say the new statute is law. That would be inconsistent with the pattern she has set? Not necessarily. But it would be surprising given her rejection of the other two defects.

  However, we note that Fuller's theory provides a unified explanation for cases 4, 5, and the new case: they all fail one of the eight principles. So it is more parsimonious.

  Therefore, I think the prediction is that she will say the new statute is not law, and she is committed to Fuller's theory.

  Final answer:

  **Prediction:** She will say that the criminal statute in the new case is **not law**.

  **Theory:** Her pattern of verdicts commits her to **Lon Fuller's theory of the inner morality of law (procedural natural law)**.
answer: |-
  Based on the pattern of your colleague's judgments across the six hypothetical cases, we can predict her verdict on the new case and identify the theory of law that best explains her overall approach. Her verdicts suggest a commitment to **Lon Fuller's theory of procedural natural law** (also known as the "inner morality of law"), which emphasizes that law must satisfy certain procedural principles to qualify as valid law. Below, I explain the prediction, the theory, and address potential underdetermination.

  ### Prediction for the New Case
  The new case involves a criminal statute that:
  - Is enacted through flawless legislative procedure.
  - Is duly published (so promulgation is satisfied).
  - Defines the offense as "conduct contrary to the moral order of the community" without further definition or guidance.

  **Predicted verdict:** She will say this is **not law**.  
  **Reasoning:**  
  - Fuller's theory requires laws to be clear and non-arbitrary to guide behavior effectively (the "clarity" principle). A statute that uses vague, open-ended language like "moral order of the community" fails this requirement because it does not provide citizens with fair notice of what is prohibited, potentially leading to arbitrary enforcement. This aligns with her prior rejection of cases that violate procedural principles:
    - In case (4), she rejected an unpublished statute, emphasizing the need for promulgation (a Fullerian principle).
    - In case (5), she rejected a self-contradictory statute, reflecting Fuller's principle of non-contradiction.
  - The new case's vagueness is analogous to case (5)'s contradiction and case (4)'s lack of accessibility: all create uncertainty that undermines law's function. While the statute is promulgated, its vagueness violates clarity, making it incapable of functioning as law. Her acceptance of judicial rulings that avoid absurdity in case (6) does not save this statute, as case (6) involves judicial correction of a specific defect in application, whereas this statute is inherently defective at its core due to vagueness.

  ### Theory of Law: Fuller's Procedural Natural Law
  Her verdicts consistently align with **Lon Fuller's theory**, which posits that law must satisfy eight procedural principles (the "inner morality of law") to be valid:
  1. **Generality**: Laws must be general rules (not ad hoc).
  2. **Promulgation**: Laws must be publicized.
  3. **Non-retroactivity**: Laws should not punish past conduct.
  4. **Clarity**: Laws must be understandable.
  5. **Non-contradiction**: Laws must not contradict each other.
  6. **Possibility of compliance**: Laws must not demand the impossible.
  7. **Constancy**: Laws should not change too frequently.
  8. **Congruence**: Official action must align with announced rules.

  Her verdicts map to these principles:
  - Case (1): Immoral statute is **law** because it meets procedural criteria (generality, promulgation, clarity, etc.), even if judges have a moral duty to resist it. Fuller distinguishes procedural validity from substantive justice.
  - Case (2): Unfair tax statute is **law** as it procedurally satisfies all principles.
  - Case (3): Customary norm is **law** because consistent practice establishes congruence and constancy (Fuller accepts custom as law if it meets procedural standards).
  - Case (4): Unpromulgated statute is **not law** (violates promulgation).
  - Case (5): Self-contradictory statute is **not law** (violates non-contradiction).
  - Case (6): Judicial ruling departing from text is **law** because it upholds congruence (by avoiding absurd outcomes) and may clarify ambiguity, aligning with Fuller's view that judges maintain law's inner morality.

  This theory explains her rejections of cases (4) and (5) and her acceptance of (6) and (3), while allowing immoral laws like (1) to be procedurally valid. Fuller's focus on law's function—guiding behavior through clear, consistent rules—fits her emphasis on accessibility, coherence, and enforceability.

  ### Addressing Underdetermination: Alternative Theories
  If her verdicts underdetermine the theory, two other candidates could fit: **inclusive legal positivism** and **exclusive legal positivism**. Both are positivist theories (separating law from morality) but differ on whether moral criteria can be part of a legal system's rule of recognition. Below, I outline how each theory would handle the new case and what revisions to prior verdicts would be needed for consistency.

  #### 1. **Inclusive Legal Positivism**
  - **Core idea**: A legal system's rule of recognition (the social rule for identifying valid law) *may* incorporate moral criteria, but this is not necessary. Law is source-based, but sources can include moral tests.
  - **Prediction for new case**: **Not law** if the rule of recognition includes a clarity requirement. This would treat vagueness as a validity-defeating defect. However, if the rule of recognition lacks clarity as a criterion, it would be **law** (since the statute has a proper source and promulgation).
  - **Fit with prior verdicts**:  
    - Cases (1) and (2) fit, as positivists accept procedurally valid immoral/unfair laws.  
    - Case (3) fits if custom is recognized by the rule of recognition.  
    - Case (4) fits if promulgation is a source-based requirement.  
    - Case (5) fits if non-contradiction is part of the rule of recognition.  
    - Case (6) fits if judicial rulings are valid sources.  
  - **Revisions needed for consistency**:  
    - If the rule of recognition does *not* require clarity, she must accept the new case as **law**. This would *not* force revision of prior verdicts but might seem inconsistent with her rejection of cases (4) and (5), which also involved procedural defects. To maintain coherence, she would need to argue that vagueness (unlike promulgation or contradiction) is not validity-defeating.  
    - If she wants the new case to be **not law**, she must explicitly include clarity in the rule of recognition, which is not contradicted by prior cases.

  #### 2. **Exclusive Legal Positivism**
  - **Core idea**: The rule of recognition must be based *solely* on social sources (e.g., enactment, custom) without moral criteria. Validity depends only on factual sources, not content.
  - **Prediction for new case**: **Law**, as the statute has a proper source (flawless enactment) and promulgation. Vagueness is a moral/political defect, not a validity issue.
  - **Fit with prior verdicts**:  
    - Cases (1) and (2) fit perfectly (source-based validity).  
    - Case (3) fits if custom is a source.  
    - Case (6) fits if judicial rulings are sources.  
    - **Inconsistencies**:  
      - Case (4): Exclusive positivists might accept an unpublished statute as valid if the rule of recognition does not require promulgation. She said **not law**, so she must revise this to **law** or argue promulgation is a source-based requirement (which some exclusive positivists accept).  
      - Case (5): Exclusive positivists typically accept contradictory laws as valid (though unenforceable). She said **not law**, so she must revise this to **law** or argue that non-contradiction is a source-based rule (which is strained).  
  - **Revisions needed for consistency**: To accept the new case as **law** under exclusive positivism, she must:  
    - Revise case (5) to **law** (contradictory statutes are still law).  
    - Clarify that case (4) is rejected *only* if promulgation is part of the rule of recognition (which exclusive positivists can accept).  
    - Case (6) remains **law** as a valid judicial source.

  ### Conclusion
  - **Primary prediction and theory**: Her verdicts best fit **Fuller's procedural natural law**, which predicts the new statute is **not law** due to vagueness violating the clarity principle. This requires no revisions and explains all cases consistently.
  - **Underdetermination**: If we consider positivism, her verdicts are more compatible with **inclusive positivism** (where moral criteria like clarity *could* be part of the rule of recognition). For inclusive positivism to predict **not law** in the new case, no revisions are needed, but she must assume the rule of recognition includes clarity. For **exclusive positivism** to work, she must revise case (5) to **law** and possibly case (4) if promulgation is not source-based.
  - **Overall**: Fuller's theory provides the most parsimonious fit without revisions. Her pattern shows a commitment to procedural validity beyond mere sources, emphasizing law's role in providing guidance—a hallmark of Fuller's view. Thus, we predict she will reject the vague statute as **not law**.
