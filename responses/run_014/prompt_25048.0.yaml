  We are given a series of judgments by a colleague on hypothetical cases about what qualifies as law. We must predict her judgment on a new case and identify the theory of law that best fits her pattern. If her prior judgments underdetermine the answer, we must consider multiple theories and what each would predict for the new case, as well as any revisions needed for consistency.

