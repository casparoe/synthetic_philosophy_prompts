  This pattern suggests she is not a pure legal positivist (who might accept even the un-promulgated law) but also not a natural law theorist in the strong sense (because she accepts the immoral law as law in case 1). However, note that she does impose some conditions: promulgation (case 4) and non-contradiction (case 5). Also, she accepts judicial rulings that depart from the text as law (case 6) and customary law (case 3).

  Theories to consider:

  1. **Legal Positivism**: Law is a social fact, separated from morality. However, within positivism, there are variations:
     - **Inclusive (Soft) Positivism**: Allows that moral criteria can be incorporated by the rule of recognition, but not necessarily. The rule of recognition is a social rule that sets out criteria for valid law.
     - **Exclusive (Hard) Positivism**: The rule of recognition must be based solely on social sources, without moral criteria.

  2. **Natural Law Theory**: There is a necessary connection between law and morality. An unjust law is not a law (lex injusta non est lex). But note: in case 1, she says the immoral statute is law (though judges have a moral obligation not to enforce it). This seems to go against natural law.

  3. **Lon Fuller's Procedural Natural Law**: Fuller argued that law must satisfy eight principles of legality (the "inner morality of law"). These are:
     - (1) generality (laws should be general rules),
     - (2) promulgation,
     - (3) non-retroactivity (or at least mostly prospective),
     - (4) clarity,
     - (5) non-contradiction,
     - (6) possibility of compliance,
     - (7) constancy through time (so that they don't change too frequently), and
