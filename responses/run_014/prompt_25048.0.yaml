  But in case 6, she accepted a judicial ruling that fixed an absurdity, which might imply that she believes that the law must be capable of being applied in a non-absurd way. This might extend to requiring clarity.

  So without a prior case on vagueness, we can't be sure. But the closest is case 5 (contradiction) which is about incoherence, and case 4 (promulgation) about accessibility. Vagueness is about accessibility in the sense that people cannot know what is required. Therefore, it is analogous to case 4 and 5.

  Therefore, we predict she will say: **not law**.

  And her theory is best described as Fuller's procedural natural law.

  But note: in case 1, she accepted the extermination law as law. That law, if it clearly states the requirement, does not violate Fuller's principles. But the new case does.

  Let me recap:

  - Case 1: Clear but immoral: law.
  - Case 4: Not promulgated: not law.
  - Case 5: Contradictory: not law.
  - Case 6: Judicial ruling that departs from text to avoid absurdity: law (which might be an attempt to make the law more congruent and clear?).

  So the new case: vague statute. It fails the clarity requirement. Hence, we predict not law.

  Answer:

  We predict she will say that the statute in the new case is **not law**.

  The theory of law that best fits her pattern of verdicts is **Lon Fuller's procedural natural law (the internal morality of law)**.

  If we must consider underdetermination:

