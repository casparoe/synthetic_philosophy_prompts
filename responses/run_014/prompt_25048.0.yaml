     Failure in any of these principles, according to Fuller, makes the rule not law.

  Let's map her judgments to Fuller's principles:

  - Case 1: Extermination statute. She says it is law. But note: Fuller would argue that a statute requiring extermination might not be clear (if it targets a group without clear definition) or might fail the requirement of generality? However, her judgment does not reject it on procedural grounds. But note: Fuller's principles are procedural, not substantive. So a law that is clear, promulgated, etc., but morally bad could still be law under Fuller? Actually, Fuller's principles are about the form and process, so it might pass. But then she says it is law, which is consistent. However, she also adds that judges have a moral obligation not to enforce it, which is a separate moral point.

  - Case 2: Unfair tax. She says law. This does not violate any of Fuller's principles.

  - Case 3: Customary law. Fuller's principles are more about enacted rules, but he did recognize that law can come from custom? His focus was on the inner morality of the process of making and administering rules. However, customary law might be seen as satisfying the requirement of constancy and congruence (if consistently followed). So it might be acceptable.

  - Case 4: Unpromulgated statute. Fuller's principle (2) is promulgation, so it fails. She says not law: consistent with Fuller.

  - Case 5: Contradictory statute. Fuller's principle (5) is non-contradiction. She says not law: consistent.

  - Case 6: Judicial ruling departing from text to avoid absurdity. This might relate to Fuller's principle of congruence (between the announced law and its administration) if the literal application would lead to an absurdity that the legislature did not intend. Also, it might relate to the principle of clarity (if the text is ambiguous or leads to absurdity, then the ruling is trying to give it a clear meaning). So she says it is law, which might be consistent with Fuller because the ruling is an attempt to achieve congruence.

  Now, the new case: a criminal statute that is vague ("conduct contrary to the moral order of the community") but properly enacted and published.

  This statute fails on Fuller's principle of clarity (4) and possibly generality (1). It also fails on the principle of non-retroactivity if it is applied to conduct that was not clearly prohibited? But the case does not say anything about retroactivity. The main issue is vagueness.

  Therefore, under Fuller's theory, this statute would not be law because it lacks clarity.

  But note: she has already accepted a judicial ruling that departs from the plain text to avoid absurdity (case 6). That might suggest that she believes that judicial interpretation can cure some defects? However, in the new case, the statute is so vague that it provides no guidance. It is not about an absurdity in a specific application but about the entire definition of the crime being left to subjective moral judgment.

  Her judgment in case 4 (unpromulgated) and case 5 (contradictory) show that she requires the statute to meet certain formal requirements. Also, in case 1, the statute was clear (it required extermination of a disfavored minority) but morally repugnant. The new case is about vagueness.

  Therefore, if she follows Fuller, she would say that the vague statute is not law.

