  - Inclusive positivism: The rule of recognition may incorporate moral criteria. So if the rule of recognition requires that criminal laws must be sufficiently clear, then this vague statute would not be law. But we don't know if her rule of recognition includes such a requirement.

  Given her prior judgments, she has already rejected a statute for lack of promulgation and for contradiction. Also, she accepted the judicial ruling that departs from the text to avoid absurdity. This suggests that she might also reject a statute for vagueness because it fails the requirement of clarity.

  Therefore, the pattern fits with Fuller's procedural natural law.

  Moreover, in the new case, the statute is so vague that it does not provide a clear standard. This violates the principle of clarity and may also violate the principle of non-retroactivity (if people are punished for conduct they could not have known was prohibited).

  So we predict she will say: **not law**.

  But what about case 6? In case 6, the judicial ruling is law even though it departs from the text. How does that fit? That ruling might be seen as an attempt to provide the clarity that the statute lacks? Or to avoid an absurd result that would arise from a literal reading? But note: in the new case, the statute itself is the problem. There is no clear text to even depart from. The entire statute is vague.

  Therefore, her pattern of judgments is most consistent with Lon Fuller's theory of law. The new case would be rejected because it fails the requirement of clarity.

