prompt: |-
  I'm the QA lead at a small company that sells a packaged-food allergen database. About 12,000 rows a quarter, each row saying whether a specific product contains or may contain one of the major allergens. School districts and two hospital systems run their menus off it. I get six hours of senior reviewer time per release, two junior contractors who are fast but have no stats background at all, and a compliance guy who signs the release note and only trusts things that are written as numbers.

  Here's the problem I can't get out of. Every single row we ship, I could defend on its own. Most are way above any threshold you'd want — call it 99.5% that the row is right, from the supplier spec sheet plus our scrape plus how often that particular source has burned us before. Our written rule right now is basically "if every row clears 99%, ship it." But I also know, with total confidence, that a 12,000-row release contains errors, probably dozens. Last year one bad sesame row ended up on a kid's tray. So me, same person, same afternoon, believe each row is correct and believe the release is wrong somewhere. Somebody once told me there's names for this, something about a lottery and something about a book preface, but I never read it and I don't want a lecture about it.

  What I want is a procedure. Something my juniors can run per row in a couple of minutes and that I can hand to compliance without him panicking. It needs to do these things:

  1. Sort rows into classes by what kind of evidence is behind them — I suspect "we have a base rate for this source and nothing specific about this item" is a different animal from "we looked at this label," and that they shouldn't get treated with the same threshold. Tell me if I'm wrong about that.
  2. Say, per class, when a junior is allowed to mark a row accepted, when they have to kick it up, and when the honest move is to not ship the row at all.
  3. Tell me where the six hours go. Right now we spend them wherever something looked weird, which I think is mostly luck.
  4. Tell me what the release note can honestly claim about the set as a whole, given that we already know it has errors in it. The current wording implies otherwise and I'm tired of it.
  5. Mark every place where the procedure is really just a judgment call wearing a number as a costume. I'd rather know which steps are fake-precise.

  And test this hunch, because it's the one thing I actually think I've figured out and nobody here agrees with me: whether this is a problem at all depends on where the cost lands. If a bad row costs us a refund and an apology, per-row thresholds are fine and I should stop losing sleep. But if the cost lands on the collection — the whole release gets pulled, a customer's automated menu system chokes, a parent stops trusting any of it, two wrong rows compound into one bad meal — then per-row thresholds are the wrong instrument entirely and no amount of individual 99.5% adds up to anything. Is that a real distinction or am I just making it up to feel better?

  Then run it on three things we actually have:

  - 3,100 rows auto-imported from a distributor feed. We've measured that feed at about a 0.3% historical error rate. Nothing about those individual rows has ever been looked at by a human.
  - A new ingredient-list parser that's genuinely excellent except it quietly mangles rows where the label uses a French or Spanish term. The errors are clustered, not spread out, and we can't tell you which rows are affected — only roughly how many.
  - Our flagship "verified" tier: 400 rows, each hand-checked twice by a senior person. Sales advertises it as defect-free. This one's my baby and I know you're going to say something about it I don't want to hear. Don't soften it, just tell me, and tell me what to do about the contract language if the answer is that we can't promise that either.

  Finish with a short list of what the procedure can't settle — where it bottoms out and a human has to just decide and own it. Flowchart-in-words and numbered steps, please, no bibliography, I'm never going to read one.
reasoning: |-
  Okay, let me start by really understanding the user's situation. They're a QA lead at a company that sells an allergen database, which is crucial for schools and hospitals. Their main pain point is the paradox of individual row accuracy versus overall release errors. Even though each row is 99.5% accurate, with 12,000 rows, errors are inevitable. They had an incident where a bad sesame row affected a kid, so the stakes are high. 

  The user wants a practical procedure that their junior staff can follow, addresses compliance needs, and optimizes their limited senior review time. They also need clarity on how to classify evidence types, set thresholds for escalation, allocate resources, and honestly report release quality. Plus, they’re questioning whether the real issue is the aggregated risk rather than per-row errors.

  First, I need to validate their hunch about aggregated risk. They’re right—when errors compound or cause systemic failures, per-row thresholds aren't enough. For example, a single error might cost a refund, but multiple errors could break customer trust or systems. That’s a critical distinction. I should emphasize that in the response.

  Next, classifying evidence types makes sense. Auto-imported rows from a distributor feed with a known error rate are different from hand-verified rows. The parser with language-specific errors introduces clustering, which increases the risk of multiple related errors. Each class needs different handling. 

  For thresholds, using confidence levels based on evidence strength is key. Juniors can handle high-confidence rows, escalate medium ones, and reject or deeply review low-confidence ones. Senior time should focus on high-risk areas, like the new parser or ambiguous cases, rather than random checks. 

  Compliance needs numbers, but the release note must be honest. Instead of claiming "zero errors," they can state the expected error range and confidence intervals. That’s transparent and defensible. 

  The "verified" tier is tricky. Sales claims it's defect-free, but statistically, that’s impossible. They need to adjust marketing language to "near-zero" or set a stringent threshold like 99.99%, but even then, there’s residual risk. Contract language should reflect that, maybe with SLA credits instead of perfection promises.

  For the three specific cases: the distributor feed can be accepted based on historical error rates. The parser issue requires sampling and maybe delaying rows with non-English terms. The verified tier needs a third reviewer for discrepancies and clearer contract terms.

  Finally, the procedure must highlight where judgment calls happen, like setting severity weights or deciding sample sizes. Transparency here prevents false precision. The user’s team needs to own those decisions, especially since real-world costs can’t be fully quantified.
answer: |-
  Here's a practical procedure addressing your requirements. It's built on **Evidence-Based Confidence Classes** and **Aggregated Risk Management**, acknowledging that *systemic consequences* (lost trust, system failures) are the real threat, not isolated errors.

  **Core Principle:** Per-row thresholds are necessary but insufficient. You must manage *total expected errors* and *clustered risk*. Your hunch is correct: **If errors cause systemic failure (trust collapse, menu system crash), per-row confidence is irrelevant.** The procedure targets *both* individual accuracy and release-level integrity.

  ---

  ### Step 1: Classify Rows by Evidence Type (Your Point 1)
  Assign each row to one class based on evidence reliability. Higher classes demand stricter thresholds.

  | Class | Description | Example | Confidence Basis |
  |-------|-------------|---------|------------------|
  | **A** | Direct Source Verification | Scanned label PDF, supplier-signed spec sheet | Human/automated verification of primary source |
  | **B** | Trusted Automated Parsing (Low-Risk) | Ingredient parser on English-only label | Historical parser accuracy (specific context) |
  | **C** | Base Rate / Unverified Feed | Distributor bulk feed, no item-specific check | Historical error rate of the feed/source |
  | **D** | High-Risk Parsing / Ambiguous Evidence | Parser on multi-language label; conflicting sources | Known failure modes (e.g., non-English terms) |
  | **V** | "Verified" Tier | Hand-checked twice by seniors | Process rigor (but *not* infallible) |

  **Judgment Call:** Assigning a row to Class B vs. D depends on contextual clues (e.g., presence of French terms). Document this as "Context Assessment Required."

  ---

  ### Step 2: Set Acceptance/Escalation Thresholds (Your Point 2)
  **Per-Row Thresholds (Juniors Apply):**  
  - **Accept:** Calculated Confidence ≥ Threshold (See table below)  
  - **Escalate to Senior:** Confidence < Threshold OR ambiguity flag (e.g., non-English term in parser input)  
  - **Do Not Ship:** Insufficient/unverifiable source data (e.g., broken link, illegible scan) OR Class D row failing escalation review.

  | Class | Accept Threshold | Escalate Threshold | Notes for Juniors |
  |-------|------------------|--------------------|-------------------|
  | **A** | ≥ 99.9% | < 99.9% | "Check source doc is clear & matches data." |
  | **B** | ≥ 99.5% | < 99.5% | "Confirm label is English-only & well-formatted." |
  | **C** | ≥ 99.7% | < 99.7% | "Verify feed format matches historical error baseline." |
  | **D** | **N/A** | **ALL** | "FLAG ALL. Do not accept without senior review." |
  | **V** | ≥ 99.99% | < 99.99% | "Confirm both senior checks agree." |

  **Judgment Call:** Thresholds are informed by history but ultimately set by QA Lead based on risk tolerance. Document this as "Threshold Policy Decision."

  ---

  ### Step 3: Allocate Senior Time (6 Hours) (Your Point 3)
  1. **Priority 1 (50% Time):** Review **ALL Class D Rows** (High-Risk Parsing). Focus on identifying language triggers or ambiguous phrasing.
  2. **Priority 2 (30% Time):** Spot-check **Escalated Rows** from Classes A, B, C. Sample based on:
     - Highest potential impact (e.g., allergens in common foods).
     - Sources with recent accuracy dips.
  3. **Priority 3 (20% Time):** **"Directed Risk Sweep"** - Target clusters:
     - Products from a single supplier with past issues.
     - Rows where parser input had non-English terms.
     - High-volume menu items (e.g., milk in school lunches).

  **Rationale:** Targets known failure modes (Class D) and systemic risks (suppliers, parsers) instead of random "weirdness."

  ---

  ### Step 4: Release Note Language (Your Point 4)
  **Stop claiming perfection.** Use statistically honest phrasing:

  > "This release contains 12,000 allergen assertions. Based on our evidence-based classification and historical validation:  
  > - Expected accuracy exceeds 99.5% for all rows.  
  > - Expected total errors in this release: **1-15 rows** (95% confidence interval).  
  > - 400 'Verified' rows exceed 99.99% confidence individually.  
  > *Total errors reflect unavoidable residual risk from source data limitations. Critical errors can be reported via [Process].*"

  **Judgment Call:** The confidence interval width depends on sample sizes and class distribution. Document: "Error Estimate Based on Class Aggregation."

  ---

  ### Step 5: Your Specific Cases Tested
  1. **Distributor Feed (3,100 Rows - Class C):**  
     - **Action:** Accept all (99.7% > 99.7% threshold).  
     - **Risk:** Expect ~9 errors (3,100 * 0.003). Low per-row impact, but scattered.  
     - **Systemic Mitigation:** Flag these rows in the API as "Unverified Bulk Source." Customers can filter them out if needed.

  2. **New Parser (Class D):**  
     - **Action:** **DO NOT AUTO-ACCEPT.** All rows go to seniors.  
     - **Senior Review:** Reject rows with non-English terms *or* ambiguous phrasing. For accepted rows, add a system flag: "Parser used; non-English terms not detected."  
     - **Systemic Mitigation:** Cluster risk is high. If >1% of parser rows are flagged/rejected, delay the entire parser batch for recalibration.

  3. **"Verified" Tier (400 Rows - Class V):**  
     - **Hard Truth:** **You cannot guarantee defect-free.** Two humans have a ~1% error rate *each*. Combined ~99.99% confidence means **1 error every 2-3 releases is statistically expected.**  
     - **Action:**  
       - Add a **third senior reviewer** for any row where initial two reviewers disagree.  
       - **Contract Fix:** Change language to: *"Verified rows undergo multi-stage human review targeting >99.99% accuracy. Defect-free operation is not guaranteed. Critical errors qualify for SLA credits per [schedule]."*  
     - **Systemic Mitigation:** These errors hurt most. Isolate them in the database; prioritize their correction.

  ---

  ### What the Procedure CAN'T Settle (Human Judgment Required)
  1. **Setting Initial Confidence Values:** Your 99.5% for a label scrape is an estimate. Document: *"Baseline confidence per class set by QA Lead based on historical audit."*
  2. **Severity Weighting:** A peanut error is riskier than sesame. The procedure doesn't weight this. Document: *"QA Lead may prioritize review based on allergen severity."*
  3. **"Insufficient Evidence" Calls:** When to reject vs. escalate a murky row. Document: *"Junior must escalate ambiguous 'Do Not Ship' decisions to Senior."*
  4. **Defining "Systemic Impact":** Is 10 scattered errors equal to 1 cluster? Document: *"QA Lead assesses cluster risk post-review; may withhold batches."*
  5. **Public Risk Communication:** How bluntly to tell hospitals about expected errors. Document: *"Compliance & Sales finalize external messaging."*

  ---

  ### Flowchart-in-Words
  1. **CLASSIFY** each row (A, B, C, D, V) based on evidence source.
  2. **JUNIOR:** Apply class threshold. ACCEPT (≥Thresh), ESCALATE (<Thresh or flag), REJECT (no source).
  3. **SENIOR:** Review ALL Class D + escalated rows. Use 6 hours per priorities.
  4. **AGGREGATE:** Calculate expected total errors (Sum[ (1-Confidence) * Rows per Class ]).
  5. **FLAG CLUSTERS:** Supplier, parser, high-impact item batches.
  6. **WRITE RELEASE NOTE:** State expected accuracy per class & total expected errors.
  7. **HOLD/RELEASE:** Withhold clusters if systemic risk is high (QA Lead decision). Ship the rest.

  **Your Final Defense:** "We ship no row below its evidence threshold, we target systemic risks with senior time, and we transparently report expected residual error. Perfection is unattainable; managed risk is our mandate." Stop losing sleep over single errors; focus your vigilance on the clusters and trust collapse.
