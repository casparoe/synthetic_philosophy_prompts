prompt: |-
  Okay so I've been thinking about the inefficacy objection to individual action on collective harms, and I want to nail down where I actually stand. Here's the setup: I'm a meat eater in a market where demand exceeds supply. The marginal consumer's purchase makes a difference (if they don't buy, total demand drops by one unit), but non-marginal consumers' purchases don't (if they don't buy, someone else does, and total demand is unchanged). I'm not the marginal consumer. So my individual purchase makes no difference to total meat demand.

  Given that, what's your actual credence that I have no moral obligation to reduce my meat consumption? I don't want "it depends on your view of causation" — I want a number and the decompositon. Specifically, I want you to break it down into:

  - The probability that difference-making (counterfactual dependence) is necessary for moral responsibilty in these cases — i.e., if your act makes no difference to the outcome, you're not responsible for it.
  - The probability that causal contribution (being a genuine cause of the harm, even if not a difference-maker) is not a sufficient basis for moral responsibility, independent of difference-making.
  - The probability that no other basis for the obligation exists — e.g., the "if everyone like me did this" test, the "complicity" or "joint enterprise" view, the "expected value" view.

  Then combine them into a final number, and tell me which sub-question your final number is most sensitive to, and what evidence or argument would move it most.

  Think very carefully before answering. Respond in the style of an expert in moral philosophy and decision theory.
