prompt: |-
  So my school's philosophy club is doing a guest Q&A next month and the speaker is a philosopher who defends the joint commitment account of collective intentionality, which is basically the idea that when a group of people intend to do something together, there's this extra social bond on top of each person's individual intention, and that bond is what makes it a "we" intention rather than just two people who happen to each intend the same thing. I'm in charge of the Q&A part and I really dont want to just have him restate the view for twenty minutes, so could you help me draft like eight to ten questions?

  I've been reading up on it on my own and I keep getting stuck on a few things, so I want the questions to press on those. First, I don't get how a joint commitment gets formed in the first place — it feels kind of circular to me, like you'd already need a joint commitment to form a joint commitment, and I want a question that really pushes on that. Second, I'm confused about what happens when one person in the group just changes their mind or objects, like does the whole joint commitment dissolve or can it survive, and I want a question about that too. And I definitely want at least one question about the difference between a genuine "we-intention" and just two people who mutually believe that the other intends to do the thing, because I think that's supposed to be the whole point of the theory but I'm not sure I could explain why it matters if someone asked me. For each question, can you also give me a follow-up that's keyed to the answer he's most likely to give, so I'm not caught flat footed when he gives me the standard reply?
