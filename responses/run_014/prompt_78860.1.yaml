prompt: |-
  I teach a ninety-minute session next week in a graduate applied ethics seminar, and the topic is consequentialist cluelessness. There are about fifteen students; they are comfortable with expected-value reasoning and have enough ethics behind them to be quick and a little overconfident. Several do effective-altruism-adjacent work, so they arrive believing uncertainty is essentially solved: assign credences, multiply, compare, proceed. Do not explain cluelessness to me. Plan the explanation.

  The session has to be built around a distinction I want to draw, and I need the plan to test it rather than assume it. The first half is causal cluelessness: we cannot trace the path from act to outcome because the chain is long, chaotic, or open-ended, so we cannot assign probabilities to outcomes in the first place. The second half is evaluative cluelessness: suppose the outcome distribution were handed to us, and we still could not compare the outcomes, because the comparison needs a common measure we do not have — the values at stake are not commensurable, or the moral status of the beings in the relevant outcomes is itself unsettled. I want students to leave able to say why cluelessness threatens the action-guidingness of consequentialism rather than its truth, and able to distinguish it from three neighbours they will inevitably collapse it into: ordinary empirical risk, moral uncertainty, and plain ignorance that better research would cure.

  If my distinction does not survive contact with a ninety-minute session — if one half collapses into the other, or into moral uncertainty, or if the two halves need the same examples and the same defusing moves — then say so plainly, tell me which half to drop, and tell me what to teach in its place.

  Structure the response under these headings, in this order, with roughly these lengths.

  **Starting point** (about 150 words). The one premise that must be in place before cluelessness is even visible to this audience as a problem, and why nothing later in the session works if this premise is not accepted first.

  **Order of construction** (about 500 words). The sequence in which the components must be introduced, with the dependency made explicit at each step: what has to be understood before the next thing can be stated, and why the obvious alternative order fails. Include where the two halves of my distinction enter, and where — if anywhere — the standard replies should appear. I want the problem to have bitten before any reply is offered; tell me if that is a mistake at this level.

  **The carrying example** (about 350 words). My candidate is a grantmaker choosing between a deworming programme with well-measured near-term effects and a campaign to shape AI policy whose effects run through decades of political contingency. Give me a verdict on it: can it carry both halves of the distinction or only the causal half? What must the carrying example have, and what must it lack, for the whole session to hang on it? If it fails, tell me what to replace it with and why the replacement works better.

  **Misconception map** (about 400 words). The misconceptions this audience will bring or form, each with the point in the sequence where it should be headed off and the specific move that defuses it. I am expecting at least these: that cluelessness amounts to knowing nothing and therefore to paralysis; that expected value absorbs it, since one can always widen the credences; that cluelessness just is moral uncertainty; that it is an objection to consequentialism specifically rather than to any act-based view; and the overcorrection that we should therefore stick to near-term measurable interventions. Add any I have missed. Say which single misconception, left unaddressed, poisons the rest of the session.

  **Check for understanding** (about 200 words). One question to put to the room at the end, what a good answer contains, and what an answer that sounds right but has not understood the distinction contains. Also one thing to watch for during discussion that would tell me the idea has not landed even if nobody objects.

  **Deliberate omissions** (about 150 words). What to leave out at this level and how to say so without seeming evasive — I would rather name the thing I am skipping and give the reason than have someone raise it and derail the last ten minutes.
reasoning: |-
  Okay, the user is preparing a graduate seminar on consequentialist cluelessness and needs a detailed lesson plan. They've outlined a clear structure and specific concerns about their causal-evaluative distinction holding up. Let me unpack their core needs.

  First, their audience: applied ethics grad students comfortable with expected value calculations, some EA-adjacent, likely overconfident about handling uncertainty. The key challenge is making cluelessness feel like a distinct problem rather than something solvable by standard probabilistic approaches.

  The central task is testing their proposed distinction between causal cluelessness (can't trace act-outcome chains) and evaluative cluelessness (can't compare outcomes even with distributions). The session must prevent students from collapsing this into moral uncertainty, ordinary risk, or research solvable ignorance. 

  Hmm, their grantmaker example seems strong for causal cluelessness but weak for evaluative. The AI policy intervention involves long causal chains with political contingencies, but doesn't clearly present incommensurable values. For evaluative cluelessness, I'd suggest adding a population ethics example like creating new beings versus helping existing ones - that forces confrontation with fundamentally different value bases.

  Biggest pitfalls: students thinking expected value can absorb all uncertainty, or that cluelessness implies paralysis. Need to emphasize that it's about the impossibility of meaningful probability assignments, not just low confidence. Also crucial to separate from moral uncertainty - cluelessness attacks the consequentialist decision procedure itself.

  The "action-guidingness" point is vital. Should reinforce that cluelessness doesn't make consequentialism false, just unable to direct action in certain domains. Might use a framing like: "It's not that there's no right answer, but that the consequentialist toolkit can't find it."

  For misconceptions, the most poisonous is probably the "just widen credences" view. If students leave thinking they can assign subjective probabilities to everything, they've missed the core argument. Need concrete examples where probability assignments would be arbitrary (like predicting AI governance impacts 50 years out).

  Should probably omit discussions of decision rules beyond EV (minimax etc.) and avoid getting sidetracked by "cluelessness in practice" solutions. Focus stays on the theoretical distinction threatening consequentialist action-guidance.
answer: |-
  Here’s the session plan structured as requested, with candid evaluation of your distinction and adjustments where needed:

  ---

  **Starting Point**  
  The essential premise: **Consequentialism requires comparing the *actual overall value* of outcomes to guide action**. Students must accept that consequentialism isn’t satisfied by comparing *proxies* (e.g., short-term welfare) if long-term/intrinsic value remains unresolved. Without this, cluelessness appears as mere "noise" solvable by better data or broader credences. If they believe expected value (EV) *always* captures moral relevance (e.g., by monetizing/averaging all effects), causal/evaluative gaps collapse into tractable uncertainty. Anchor this with: "If we can’t assign *meaningful* probabilities or values to *final* outcomes—not intermediate indicators—consequentialism loses its action-guiding force."

  ---

  **Order of Construction**  
  *(Sequence critical; deviations risk conflating cluelessness with uncertainty)*  
  1. **Review EV reasoning**: Quick case (e.g., vaccine allocation) to affirm their comfort with probabilistic moral math.  
  2. **Introduce causal cluelessness**: Use your grantmaker example (deworming vs. AI policy). *Dependency*: Students must grasp EV’s mechanics *before* seeing its breakdown. Show that for AI policy, we lack even *subjective* probabilities for key outcomes (e.g., "probability of AI governance stabilizing democracy by 2100") because causal chains are non-ergodic/open-ended.  
  3. **Pause for problem-bite**: *Before* solutions, highlight that EV fails—not due to lack of data, but *no coherent way to assign probabilities*.  
  4. **Introduce evaluative cluelessness**: *After* causal half is stable. Use a *new* example (e.g., creating new beings vs. aiding existing ones). *Dependency*: If introduced earlier, students will misdiagnose it as causal ("we just can’t predict their welfare"). After causal cluelessness, they see evaluative issues persist *even with fixed outcomes*.  
  5. **Contrast moral uncertainty**: Briefly define it (uncertainty about *which* values matter) only *after* both cluelessness types. *Why last?* If raised earlier, students will reduce cluelessness to "we’re unsure how to value outcomes."  
  6. **Standard replies** (e.g., "use best available probabilities") appear *after both halves*—too early and students dismiss the problem.  

  *Verdict on your distinction*: It holds if evaluative cluelessness uses **distinct examples** (see below). Same examples *will* cause collapse.

  ---

  **The Carrying Example**  
  **Verdict**: Your grantmaker example works *only for causal cluelessness*. Deworming vs. AI policy illustrates unpredictable causal chains but not evaluative incommensurability (both aim for welfare).  
  **Replacement for evaluative half**: Use **population ethics** (e.g., creating 1M additional happy-but-simple lives vs. greatly enriching 100K existing complex lives). Here:  
  - *Causal cluelessness*: Minimal (outcomes describable).  
  - *Evaluative cluelessness*: Acute (no common measure for "happy-simple" vs. "enriched-complex" lives; moral status of new beings unsettled).  
  **Why it works**: Cleanly separates the halves. The example must:  
  - Lack chaotic causal chains for evaluative half.  
  - Involve *fundamentally distinct value bases* (e.g., hedonic vs. capability metrics).  

  ---

  **Misconception Map**  
  | **Misconception**                  | **When to Defuse**               | **Defusing Move**                                                                 |
  |------------------------------------|-----------------------------------|-----------------------------------------------------------------------------------|
  | "Cluelessness = total ignorance → paralysis" | After introducing causal cluelessness | "It’s not that we know *nothing*, but that we can’t construct *action-guiding probabilities/values*. Consequentialism falters, not agency." |
  | "EV absorbs it via wider credences" | Post-causal cluelessness          | "Widening credences doesn’t help if probabilities are *arbitrary* (e.g., P(AI policy saves civilization) = 0.0001? 0.2?)" |
  | "Cluelessness = moral uncertainty" | Post-evaluative cluelessness      | Contrast: Moral uncertainty assumes comparability *under* each theory; evaluative cluelessness denies comparability *across* outcomes. |
  | "Only hurts consequentialism"      | During recap                     | "Any theory requiring outcome comparison (e.g., rule-consequentialism) faces this. Deontology avoids it by ignoring outcomes." |
  | "Stick to near-term interventions" | During replies discussion        | "This concedes cluelessness’s bite! But is ‘measurable’ always ‘morally optimal’? (e.g., near-term vs. existential risk tradeoffs)" |
  | **Missing**: "Better research solves it" | Post-standard replies            | "Research fixes ignorance; it can’t resolve *in-principle* indeterminacy (e.g., chaotic systems, value incommensurability)." |

  **Most poisonous misconception**: If students leave believing cluelessness is just "high uncertainty" solvable by EV, the entire distinction collapses.

  ---

  **Check for Understanding**  
  **Question**: *"Why can’t we treat the evaluative problem as another form of moral uncertainty?"*  
  - **Good answer**: Distinguishes uncertainty about *which values apply* (moral uncertainty) vs. inability to *compare realized outcomes* even under one value system (evaluative cluelessness). Uses examples.  
  - **Misleading answer**: Equates them ("Both involve not knowing values") or reduces to causal issues ("We just need to measure welfare better").  

  **Silent failure sign**: Students using "probability" and "value" interchangeably during discussion (e.g., "We assign probabilities to different value theories").

  ---

  **Deliberate Omissions**  
  1. **Decision rules beyond EV** (e.g., minimax): "We’re focusing on EV because it’s EA’s default tool, but cluelessness also challenges alternate rules when probabilities/values are indeterminate."  
  2. **Meta-uncertainty** (uncertainty about uncertainty): "That’s crucial for research but distinct from cluelessness’s *structural* barriers to assigning probabilities/values."  
  3. **"Cluelessness in practice" solutions** (e.g., institutional division of labor): "These are vital responses, but today we’re diagnosing the problem’s depth to see *why* they’re necessary."  

  *Rationale*: Including these blurs the core distinction; students would pivot to "fixes" before grasping the challenge’s uniqueness.

  ---

  **Final Note on Your Distinction**  
  It survives if:  
  1. You use **separate examples** (grantmaker for causal, population ethics for evaluative).  
  2. You **strictly enforce the sequence** (evaluative cluelessness *after* causal is secure).  
  If time runs short, **drop evaluative cluelessness**—causal is more accessible and still devastating. Replace it with:  
  - **"Why not just maximize indirect expected value (e.g., virtue, precedent)?"**  
  This exposes cluelessness’s threat to *all* consequentialist guidance, not just direct EV.
