  The teacher said, "Next week's test will catch you unaware,"
  A promise hanging in the autumn air so keen.
  We scanned the five bright days with logic's blade laid bare.

  "If Friday dawns examless, then we'll know it's there,"
  A classmate mused, "That certainty would intervene."
  The teacher said, "Next week's test will catch you unaware."

  Then Thursday fell: if free 'til then, we'd know, prepare.
  No shock could bloom where expectation held the scene.
  We scanned the five bright days with logic's blade laid bare.

  So Wednesday too was crossed off, deemed no longer fair,
  For precedent would strip its secret clean.
  The teacher said, "Next week's test will catch you unaware."

  Then Tuesday's chance dissolved beyond repair,
  Our reasoning left no gap unforeseen.
  We scanned the five bright days with logic's blade laid bare.

  Monday alone? But known, it held no snare.
  Thus logic proved the test could not be seen!
  The teacher said, "Next week's test will catch you unaware."
  We scanned the five bright days with logic's blade laid bare.

  Yet Tuesday dawned, the test was set and squared,
  A shock that cut through all that thought machine.
  The teacher said, "Next week's test will catch you unaware,"
  We scanned the five bright days with logic's blade laid bare.
