answer: |-
  Below is a probabilistic decomposition of the argument from divine hiddenness (ADH), following your request. I'll assign rough credences with justifications, combine them, identify the dominant term, and contrast with your theist friend's view.

  ### Core Structure of ADH
  The argument’s soundness depends on three key premises:
  1. **Theological Premise (T):** A perfectly loving God would ensure no *nonresistant nonbeliever* (NN) exists.  
     *(Probability: P(T))*
  2. **Empirical Premise (E):** Nonresistant nonbelievers *do* exist.  
     *(Probability: P(E | T fails), but for simplicity, we'll use P(E) as independent)*
  3. **Defeater Failure (D):** All major theistic defenses against ADH fail.  
     *(Probability: P(D))*

  **Overall Soundness:** P(ADH Sound) = P(T) × P(E) × P(D)

  ---

  ### Decomposition with Probabilities & Justification
  1. **P(T) = 0.40**  
     *Probability that a perfectly loving God would guarantee nonresistant belief for all.*  
     **Justification:**  
     - Schellenberg’s core intuition (that perfect love entails relational openness) is plausible but not decisive.  
     - Theists argue God may value *free inquiry*, *epistemic humility*, or *non-coercive relationships* (e.g., if divine revelation forced belief, it might undermine authentic love or moral growth).  
     - Alternatives like "propositional belief isn’t essential" (e.g., Marilyn Adams) or "God’s presence is non-propositional" (e.g., apophatic theism) weaken T.  
     *Thus, significant but non-overwhelming support.*

  2. **P(E) = 0.65**  
     *Probability that genuine nonresistant nonbelievers exist.*  
     **Justification:**  
     - Cases like honest lifelong seekers (e.g., J.L. Schellenberg himself) or those in non-theistic cultures seem credible.  
     - However, disentangling "nonresistance" from subconscious resistance, cultural shaping, or insufficient seeking is deeply challenging (e.g., Paul Moser’s "cognitive idolatry" critique).  
     - The *sheer number* of thoughtful nonbelievers suggests NNs are likely, but not all are equally clear-cut.  
     *Moderate-to-high probability, but with epistemic friction.*

  3. **P(D) = 0.35**  
     *Probability that all major theistic defenses fail.*  
     **Justification:** Defenses include:  
     - **Skeptical Theism (ST):** "We can’t know God’s reasons for hiddenness" (e.g., unknown greater goods).  
       *Weakest defense here—ST better addresses evil than hiddenness, but still injects uncertainty.*  
     - **Free Will / Autonomy (FW):** "Forced belief would violate human freedom."  
       *Plausible but contested—does *revelation* undermine freedom? Unclear.*  
     - **Moral Transformation (MT):** "Hiddenness fosters virtues like seeking or humility" (e.g., Kierkegaard).  
       *Strong for some cases but less so for lifelong seekers.*  
     - **Epistemic Distance (ED):** "Belief must be earned to avoid fanaticism" (e.g., John Hick).  
       *Empirically dubious—many believers lack deep reflection.*  
     **Net:** No single defense is knockout, but their *cumulative* force (especially ST + FW) lowers P(D).

  ---

  ### Overall Probability & Dominant Term
  - **P(ADH Sound)** = P(T) × P(E) × P(D) = **0.40 × 0.65 × 0.35 ≈ 0.09**  
    (*My credence: ~9%, or 1 in 11*)

  - **Dominant Term:** **P(D) = 0.35** (Defeater Failure)  
    This is the largest drag on the argument. Even if God *should* prevent NN (P(T)=0.4) and NNs exist (P(E)=0.65), plausible defenses (especially ST + FW) retain significant traction. Assigning P(D) < 0.5 reflects skepticism that *all* defenses fail simultaneously.

  ---

  ### Comparison with Your Theist Friend (Credence: 0.05)
  Her 5% likely stems from **stronger confidence in theistic defenses (higher P(D)) and/or lower P(T)**. Specifically:  
  - **P(D):** She might rate defenses like *skeptical theism* or *free will* much higher (e.g., P(D) ≈ 0.2).  
  - **P(T):** She likely rejects Schellenberg’s love→belief link (e.g., P(T) ≤ 0.3), emphasizing God’s "transcendent reasons" or the value of faith without evidence.  
  - **P(E):** Less likely—even many theists grant NN *could* exist (e.g., Vatican II on "invincible ignorance").

  **Where Disagreement Lives:**  
  Your friend’s 0.05 vs. my 0.09 diverges most sharply on **P(D)** (defeater failure). Theists often see hiddenness defenses as *robust* (e.g., "God respects freedom") or *mysterious* (ST), whereas you may see them as post-hoc. Secondarily, she likely disputes **P(T)** by redefining "perfect love" (e.g., love ≠ constant accessibility).

  ---

  ### Why ADH Feels Weaker Than the Problem of Evil (PoE)
  1. **Psychological Weight:** PoE centers on *suffering*—visceral, universal, and morally urgent. Hiddenness is abstract and intellectual.  
  2. **Epistemic Asymmetry:** PoE’s "gratuitous evil" is empirically tangible (e.g., child cancer). Hiddenness relies on harder-to-assess mental states (nonresistance).  
  3. **Defensive Overlap:** Theistic replies to PoE (e.g., ST) often *also* rebut ADH, but PoE has unique emotional force.  

  **Your "Priced In" Hypothesis:** Likely valid. If you already hold low theism credence (2%), ADH—which targets *perfect love* specifically—may not lower it further, whereas PoE challenges *any* benevolent deity more broadly.

  ### Key Takeaway
  ADH is potent but highly sensitive to prior assumptions about divine love and epistemic access. Its soundness probability collapses rapidly if one grants even modest plausibility to theistic defenses (P(D)) or questions the link between love and belief (P(T)). Your friend’s 0.05 credence is thus defensible if she weights these factors heavily—though my decomposition suggests 0.09 is more natural for a neutral evaluator.
