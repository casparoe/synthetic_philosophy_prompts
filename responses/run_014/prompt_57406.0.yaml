answer: |-
  Below is the diagnostic decision tree designed to sort participants into specific foundational positions based on concrete mathematical practices. The tree consists of 12 branching questions, each phrased to be answerable by classically trained mathematicians without prior exposure to proof theory. The structure prioritizes practical commitments over self-identified labels. Leaves are assigned to the 12 mandatory positions, with shared leaves where the space does not permit separation. Each leaf includes a name, the most reliable identifying question, and a one-sentence description of its most awkward commitment.  

  ### **Decision Tree**  
  Start at Question 1. Answer "Yes" or "No" based on your mathematical practice.  

  1. **Unbounded Search Witness**: When a proof shows that an unbounded search (for a natural number satisfying a decidable property) cannot always fail, does the proof *necessarily* hand you a specific value at which it succeeds?  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q3.  

  2. **Feasible Numbers**: Do you consider natural numbers so large that they cannot be physically written down or computed (e.g., beyond \(10^{100}\)) to be mathematically illegitimate?  
     - **Yes** → **Leaf: Ultrafinitism**.  
     - **No** → **Leaf: Unrepentant Classical Practice**.  

  3. **Free Choice Sequences**: May a function on the continuum (e.g., \(\mathbb{R} \to \mathbb{R}\)) be defined by a freely proceeding sequence of choices (e.g., arbitrary selections of values), rather than by a fixed rule or algorithm?  
     - **Yes** → Go to Q4.  
     - **No** → Go to Q5.  

  4. **Uniform Continuity**: Must every total real-valued function on a closed bounded interval (e.g., \([0,1]\)) be uniformly continuous? If someone describes a rule that appears to define a total function violating this, do you reject the rule as non-constructive?  
     - **Yes** → **Leaf: Brouwerian Intuitionism**.  
     - **No** → *Unoccupied (incoherent)*.  

  5. **Computable Totality**: Is every total function from natural numbers to natural numbers necessarily computable?  
     - **Yes** → Go to Q6.  
     - **No** → Go to Q7.  

  6. **Markov's Principle**: If a decidable property \(P(n)\) is not false for all \(n\) (i.e., \(\neg \forall n \neg P(n)\)), does it follow that there exists an \(n\) such that \(P(n)\), even if you lack an algorithm to find it?  
     - **Yes** → **Leaf: Russian School**.  
     - **No** → **Leaf: Recursive Realisability**.  

  7. **Countable Choice**: Is the principle of countable choice (for natural numbers) already implicit in the meaning of the universal quantifier over \(\mathbb{N}\), or is it a separate substantive assumption requiring independent justification?  
     - **Implicit** → Go to Q8.  
     - **Separate** → Go to Q11.  

  8. **Impredicative Comprehension**: May a set be defined by quantifying over a totality that includes the set itself (e.g., defining a set \(S\) as \(\{x \mid \forall Y \subseteq \mathbb{N}, \phi(x,Y)\}\))?  
     - **Yes** → Go to Q9.  
     - **No** → Go to Q10.  

  9. **Full Powerset**: Does the power set of \(\mathbb{N}\) exist as a completed totality?  
     - **Yes** → **Leaf: Intuitionistic ZF (IZF)**.  
     - **No** → **Leaf: Constructive Set Theory (CZF)**.  

  10. **Propositions-as-Types**: In your practice, is a proposition identical to the type (or set) of its proofs?  
      - **Yes** → **Leaf: Martin-Löf Type Theory**.  
      - **No** → Go to Q12.  

  11. **Predicative Definitions**: When defining mathematical objects (e.g., reals or sets), must you avoid circularity by never quantifying over a totality containing the object being defined?  
      - **Yes** → **Leaf: Predicativism**.  
      - **No** → *Unoccupied (unexplored)*.  

  12. **Model Relativity**: Is the truth of mathematical statements relative to a model (e.g., a topos or category) rather than absolute?  
      - **Yes** → **Leaf: Internalism (Topos/Smooth Infinitesimal)**.  
      - **No** → **Leaf: Bishop-Style or Semantic Anti-Realism** (shared).  

  ---

  ### **Leaf Descriptions**  
  - **Ultrafinitism**:  
    - **Identifying Question**: Feasible Numbers (Q2).  
    - **Awkward Commitment**: Rejecting the existence of large natural numbers (e.g., \(10^{100}\)) even when well-defined classically.  
  - **Unrepentant Classical Practice**:  
    - **Identifying Question**: Unbounded Search Witness (Q1).  
    - **Awkward Commitment**: Accepting non-constructive existence proofs (e.g., via contradiction) without algorithmic witnesses.  
  - **Brouwerian Intuitionism**:  
    - **Identifying Question**: Uniform Continuity (Q4).  
    - **Awkward Commitment**: The continuity principle, which forces all total functions on \([0,1]\) to be uniformly continuous, contradicting classical discontinuities.  
  - **Russian School**:  
    - **Identifying Question**: Markov's Principle (Q6).  
    - **Awkward Commitment**: Church's Thesis, which implies every total function \(\mathbb{N} \to \mathbb{N}\) is computable, trivializing non-computable reals.  
  - **Recursive Realisability**:  
    - **Identifying Question**: Markov's Principle (Q6).  
    - **Awkward Commitment**: The interpretation of disjunction (\(A \lor B\)) requiring a computable choice between proofs of \(A\) or \(B\), even for undecidable statements.  
  - **Intuitionistic ZF (IZF)**:  
    - **Identifying Question**: Full Powerset (Q9).  
    - **Awkward Commitment**: Impredicative separation, allowing sets defined by quantification over the universe, including themselves.  
  - **Constructive Set Theory (CZF)**:  
    - **Identifying Question**: Full Powerset (Q9).  
    - **Awkward Commitment**: The lack of a power set axiom, complicating classical results (e.g., the real number line).  
  - **Martin-Löf Type Theory**:  
    - **Identifying Question**: Propositions-as-Types (Q10).  
    - **Awkward Commitment**: Proof irrelevance failure—carrying proof terms in computations for tautological statements.  
  - **Predicativism**:  
    - **Identifying Question**: Predicative Definitions (Q11).  
    - **Awkward Commitment**: Inability to define the least upper bound of a bounded set of reals using standard impredicative methods.  
  - **Internalism (Topos/Smooth Infinitesimal)**:  
    - **Identifying Question**: Model Relativity (Q12).  
    - **Awkward Commitment**: The existence of nilsquare infinitesimals (e.g., in smooth analysis), which violate the Archimedean property.  
  - **Bishop-Style or Semantic Anti-Realism** (shared leaf):  
    - **Identifying Question**: Model Relativity (Q12).  
    - **Awkward Commitment**: For Bishop, the uncritical use of countable choice; for anti-realism, the refusal to fix *any* formal system for proof conditions.  

  ---

  ### **Unoccupied Cells and Diagnoses**  
  The tree permits combinations that no major position defends. Diagnoses:  
  1. **Choice Sequences + Uniform Continuity Rejected (Q4 → No)**: *Incoherent*. Brouwerian intuitionism derives uniform continuity from choice sequences and bar induction; rejecting it contradicts the core framework.  
  2. **Choice Sequences + Computable Totality (Q3 → Yes, Q5 → Yes)**: *Incoherent*. Choice sequences permit non-computable functions (e.g., free-choice reals), directly conflicting with the Russian school's computability thesis.  
  3. **Free Choice Sequences + Impredicative Comprehension (Q3 → Yes, Q8 → Yes)**: *Unattractive and unexplored*. Brouwer opposed formal set theory, while IZF-style impredicativity assumes a fixed universe, undermining the open-endedness of choice sequences.  
  4. **Countable Choice Rejected + Impredicative Comprehension (Q7 → Separate, Q8 → Yes)**: *Unexplored*. Predicativism rejects impredicativity, while IZF embraces choice; no school combines rejection of choice with full impredicativity.  
  5. **Computable Totality Rejected + Markov's Principle Accepted (Q5 → No, Q6 → Yes)**: *Coherent but unattractive*. This would allow non-computable functions but accept non-constructive existence (via Markov’s principle), lacking a clear foundation.  

  **Collapsed Leaves**:  
  - **Bishop-Style and Semantic Anti-Realism** share a leaf (Q12 → No). They are inseparable by practice: both demand witness extraction, reject choice sequences, and avoid formal system commitments. Distinction is philosophical (Bishop emphasizes informal rigor; anti-realism focuses on proof-conditional meaning).  
  - **Russian School and Recursive Realisability** are separated only by Markov’s principle (Q6). Realisability *as a connective interpretation* often includes Markov’s principle, but Q6 isolates their divergence: the Russian school enforces it as an axiom, while realisability treats it as a semantic constraint.  

  ---

  ### **Confidence Assessment and Failure Points**  
  **Weakest Branch Point**:  
  - **Markov’s Principle (Q6)** is the shakiest separator. The Russian school enforces it axiomatically, but realisability may validate it in models without explicit adoption. A separation argument (e.g., a realisability model falsifying Markov’s principle) could collapse the distinction.  

  **Most Likely Fictional Leaf**:  
  - **Semantic Anti-Realism** may be a philosophical fiction. No working mathematician or logian occupies it without collapsing into Bishop-style practice (e.g., using informal constructive set theory). Anti-realism’s refusal to nominate *any* formal system is rarely reflected in actual mathematical work.  

  **What Would Change the Tree**:  
  1. **Metamathematical Result**: If an independence theorem showed that Markov’s principle is unnecessary for realisability (e.g., a realisability topos where it fails), the Russian/Realisability split (Q6) would collapse into one leaf.  
  2. **Separation Argument**: A proof that Bishop-style mathematics *requires* countable choice (e.g., for basic analysis), while anti-realism permits choice-free systems, would split the shared leaf. Current practice does not support this.  
  3. **Formal System Development**: If someone defended a system combining Brouwerian choice sequences with IZF-style impredicativity, Q8 would need a new branch. Currently, Brouwer’s opposition to formal sets makes this incoherent.  
  4. **Contested Reading**: The tree assumes Brouwerian intuitionism *entails* uniform continuity (Q4). If a heterodox reading (e.g., "non-continuous choice sequences") gained traction, Q4 would misdirect. I follow the standard reading (Troelstra, van Dalen) that continuity is non-negotiable.  

  **Conclusion**:  
  This tree balances fidelity to practice with philosophical categorization. It will reliably sort attendees into 10-12 positions, with shared leaves where distinctions are not practically meaningful. Use it to spark discussion, emphasizing that foundational commitments arise from mathematical actions, not preferred labels.
