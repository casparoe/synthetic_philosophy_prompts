prompt: |-
  I cover science and ideas for a magazine, and I am preparing a piece on why small organizations keep choosing voting rules that look fair but are manipulable. At a board meeting I recently covered, the chair proposed plurality, the treasurer proposed Borda scoring, and an editor wanted approval voting; everyone invoked fairness, but nobody said what fairness was supposed to deliver. I want to get past the usual shorthand that the Gibbard–Satterthwaite theorem settles everything by asking what a voting rule would actually have to do to be adequate in a concrete setting, and I do not need a survey of the literature, only a design judgment.

  Imagine a five-person editorial board that must select exactly one of three standing project proposals in a given cycle. Each member may hold any complete ranking of the three proposals, the rule must be deterministic rather than a lottery, and the board wants a rule that can be explained to contributors in a single short paragraph. Write the desiderata such a rule should meet: which outcomes it must be able to select, which preference patterns it must handle, which features of the decision it must respect, and which virtues are genuine requirements rather than the aesthetic preferences of one camp. For each requirement, give the case behind it, and mark which are non-negotiable for a rule that is to count as a serious selection mechanism and which are negotiable. Then identify the subset of requirements that cannot be jointly satisfied under these assumptions, and say why that subset is the real obstruction.

  Finally, do not end with a balanced menu. I want you to choose the single requirement this board should abandon first, commit to that choice, and defend it against the objection that the resulting rule is either too crude or too manipulable. If weakening the unrestricted-domain assumption, for example by restricting to single-peaked preferences, would rescue most of the list, say whether that is a practical escape route for this board or merely a theoretical consolation.
reasoning: |-
  We are designing a voting rule for a five-person editorial board choosing one of three proposals (A, B, C). The rule must be deterministic and easy to explain. We need to specify the desiderata (requirements) for the rule, mark which are non-negotiable and which are negotiable, identify an inconsistent subset, and then choose which requirement to abandon.

  **Desiderata (Requirements):**

  1. **Universal Domain (UD):** The rule must be able to handle any possible complete and transitive ranking (i.e., any strict or weak order) of the three proposals by each of the five voters. 
     - *Case:* The board members have diverse views and we cannot restrict their opinions. We must be prepared for any configuration of preferences. 
     - *Non-negotiable?* Yes. Without UD, the rule might fail for some preference profiles, which is unacceptable for a general-purpose rule.

  2. **Unanimity (U):** If every voter ranks a particular proposal as their first choice, then that proposal must be selected.
     - *Case:* If there is complete agreement, the rule must respect it.
     - *Non-negotiable?* Yes. This is a basic requirement of respecting consensus.

  3. **Pareto Efficiency (PE):** If every voter prefers proposal X over proposal Y, then Y should not be selected. (This is weaker than unanimity but still important.)
     - *Case:* We should avoid selecting an option that is universally worse than another available option.
     - *Non-negotiable?* Yes. It would be perverse to choose an option that everyone agrees is worse than another.

  4. **Non-dictatorship (ND):** There is no single voter whose top choice is always selected, regardless of others' preferences.
     - *Case:* The board is a group of equals; no one person should dominate.
     - *Non-negotiable?* Yes. This is fundamental to collective decision-making.

  5. **Anonymity (A):** The outcome should depend only on the vote counts (i.e., the pattern of preferences) and not on which voter has which ranking.
     - *Case:* The rule should treat all voters equally; no voter should have more power just because of their identity.
     - *Negotiable?* Maybe. In practice, some boards might assign different weights, but for a small board of equals, this is non-negotiable? Let's mark it as non-negotiable for this context.

  6. **Neutrality (N):** The outcome should not depend on the labeling of the alternatives. If we permute the names of the proposals in every voter's ranking, the outcome should be permuted accordingly.
     - *Case:* The rule should not be biased toward any proposal in advance.
     - *Non-negotiable?* Yes. Fairness requires that the rule is symmetric to the alternatives.

  7. **Condorcet Winner (CW):** If there is a proposal that beats every other proposal in pairwise majority comparisons, then that proposal should be selected.
     - *Case:* This is a strong form of majority preference. It seems fair that a candidate preferred by a majority over each other should win.
     - *Negotiable?* This is a desirable property but not absolutely necessary. There are well-regarded rules (like Borda) that don't always pick the Condorcet winner. So, negotiable.

  8. **Monotonicity (M):** If a voter raises the position of the winning proposal in their ranking (without changing the relative order of others), then that proposal should still win.
     - *Case:* It would be perverse if a candidate lost because it got more support. This prevents "punishment" for being liked.
     - *Non-negotiable?* We might consider it non-negotiable because non-monotonic rules can lead to strategic voting and are counterintuitive.

  9. **Strategy-proofness (SP):** Voters should not be able to achieve a better outcome by misrepresenting their preferences.
     - *Case:* We want the rule to be immune to manipulation so that voters have an incentive to report truthfully.
     - *Non-negotiable?* We know from Gibbard-Satterthwaite that with three or more alternatives, no rule satisfies UD, PE, ND, and SP. So we have to compromise. But ideally, we want it. However, we must mark it as negotiable because we cannot have it without violating other non-negotiable requirements.

  10. **Simplicity (S):** The rule must be explainable in a single short paragraph to contributors.
      - *Case:* Transparency and ease of understanding are important for legitimacy and trust.
      - *Non-negotiable?* Yes, because it's a stated constraint.

  Now, note that the Gibbard-Satterthwaite theorem tells us that there is no rule that satisfies UD, PE, ND, and SP (for three or more alternatives). We also know that the Condorcet paradox (a cycle in pairwise majority voting) may prevent a Condorcet winner from existing.

  **Inconsistent Subset:**

  The following set of requirements cannot be simultaneously satisfied:

  - Universal Domain (UD)
  - Pareto Efficiency (PE)
  - Non-dictatorship (ND)
  - Strategy-proofness (SP)

  This is the core of the Gibbard-Satterthwaite theorem. Moreover, we have the constraint of determinism and the requirement to choose one alternative.

  Additionally, note that if we require the Condorcet Winner (CW) property, we may run into problems because sometimes a Condorcet winner does not exist (as in the Condorcet paradox). In such cases, we need a rule that can still make a choice. So if we require that the rule must always pick the Condorcet winner when it exists (CW), then we must also have a way to break cycles. But even without CW, the above four (UD, PE, ND, SP) are inconsistent.

  **Choosing a Requirement to Abandon:**

  Since SP is the one that we know we cannot have without sacrificing others, and because manipulation is a concern but not always exploitable in practice (especially in small groups with low stakes), we might consider abandoning the strict requirement of strategy-proofness.

  However, the problem asks for a design judgment and to abandon one requirement. We must also consider the practical context. The board is small (5 people) and they are colleagues. They are likely to be honest and the stakes are not extremely high (project proposals). Moreover, even if the rule is manipulable, the members might not manipulate because of norms of collegiality. Therefore, we can relax SP.

  But note: the problem says "do not end with a balanced menu" and we must choose one to abandon and defend it.

  **Our Choice: Abandon Strategy-Proofness (SP)**

  We choose to abandon the requirement of strategy-proofness. This is because:

  1. It is impossible to achieve with the other non-negotiable requirements (UD, PE, ND) and three alternatives.
  2. In a small board of colleagues, the incentive to manipulate might be low. They are likely to vote sincerely.
  3. Even if manipulation is possible, it might be complex and risky (if others also manipulate). In a small group, they can discuss and use norms to discourage manipulation.

  We then adopt a rule that meets the other requirements as much as possible. For instance, we might choose Approval Voting, which is simple and satisfies UD, PE, ND, A, N, and M. It does not satisfy CW or SP, but it is known to be relatively resistant to manipulation and encourages sincere voting in many cases.

  **Objection:** The resulting rule (without SP) is too manipulable.

  **Defense:** 
  - We are using Approval Voting, which is less manipulable than, say, plurality. In Approval, voters can strategically decide how many candidates to approve, but in practice, the "sincere" strategy (approving all candidates above a certain threshold) is often followed, especially in small groups. 
  - Moreover, the board can agree to use the rule sincerely and trust each other. If they are concerned about manipulation, they can discuss and adopt a code of conduct.
  - The simplicity of Approval Voting (each voter approves any number of candidates, and the candidate with the most approvals wins) makes it easy to understand and implement. It also satisfies most of our non-negotiable requirements: UD, PE, ND, A, N, M (monotonicity), and S. 
  - It does not guarantee a Condorcet winner, but in practice, it often does. And the Condorcet requirement was negotiable.

  **What about restricting the domain (like single-peaked preferences)?**

  The problem asks whether weakening UD (by assuming single-peaked preferences) is a practical escape.

  - In a small board of five, it might be reasonable to assume that their preferences are single-peaked if they share a common dimension (e.g., left-right spectrum). However, for project proposals, it may not be clear what that dimension is. 
  - Moreover, the board might not naturally align on a single dimension. Therefore, imposing single-peakedness may not be practical. It requires that the board members structure their preferences along a pre-agreed dimension, which might not be feasible. 
  - Thus, we consider this a theoretical consolation rather than a practical escape route.

  **Conclusion:**

  We abandon strategy-proofness. We choose Approval Voting because it is simple, meets the essential requirements (except SP and CW), and is relatively robust. We defend that in the context of a small, collegial board, the risk of manipulation is low and the benefits of simplicity and other fairness properties outweigh the lack of strategy-proofness.

  **Final Rule Description (for the magazine):**

  "Each board member votes by approving any number of the three proposals they find acceptable. The proposal with the most approvals wins. In case of a tie, the chair breaks the tie by voting again (or by a predetermined rule)."

  This is one paragraph and easy to explain.
answer: |-
  ### Desiderata for an Editorial Board Voting Rule  
  The editorial board must select one of three proposals (A, B, C) using a deterministic rule explainable in a short paragraph. Below, I define the requirements such a rule should meet, categorized by outcome coverage, preference handling, decision features, and core virtues. I mark each as **non-negotiable** (essential for a serious mechanism) or **negotiable** (aesthetic or context-dependent). For each, I provide the justifying case.  

  #### Requirements  
  1. **Universal Domain (UD)**  
     - **Desideratum**: The rule must produce a valid outcome for any combination of complete, transitive rankings from the five voters.  
     - **Case**: Board members have diverse, unpredictable views (e.g., one ranks A>B>C, another C>A>B). A rule failing for certain preferences would collapse in real-world use, undermining trust.  
     - **Status**: **Non-negotiable**. A serious mechanism cannot arbitrarily fail.  

  2. **Unanimity (U)**  
     - **Desideratum**: If all voters rank a proposal first, it must win.  
     - **Case**: When consensus exists (e.g., all prefer A), overriding it would violate collective rationality and invite dissent.  
     - **Status**: **Non-negotiable**. Core to group legitimacy.  

  3. **Pareto Efficiency (PE)**  
     - **Desideratum**: If every voter prefers X over Y, Y must not win.  
     - **Case**: If all rank A>B, selecting B would be indefensible, as it ignores unanimous improvement.  
     - **Status**: **Non-negotiable**. Basic coherence.  

  4. **Non-Dictatorship (ND)**  
     - **Desideratum**: No single voter’s top choice always wins.  
     - **Case**: The board is egalitarian; a de facto dictator (e.g., the chair always deciding) would demoralize members.  
     - **Status**: **Non-negotiable**. Fundamental to fairness.  

  5. **Anonymity (A)**  
     - **Desideratum**: Outcomes depend only on vote counts, not voter identities.  
     - **Case**: Swapping votes between members should not change the result, ensuring equal influence (e.g., two voters with A>B>C should contribute equally).  
     - **Status**: **Non-negotiable**. Equality is non-negotiable in small teams.  

  6. **Neutrality (N)**  
     - **Desideratum**: Outcomes are unaffected by relabeling proposals (symmetry).  
     - **Case**: If all rankings are swapped (A↔B), the winner must swap accordingly. Prevents bias toward incumbents or default options.  
     - **Status**: **Non-negotiable**. Proposals must compete on merits.  

  7. **Monotonicity (M)**  
     - **Desideratum**: Improving a winning proposal’s rank in any ballot cannot cause it to lose.  
     - **Case**: If A wins and a voter elevates A in their ranking (e.g., B>A>C to A>B>C), A must still win. Prevents perverse incentives (e.g., voters "burying" favorites to aid them).  
     - **Status**: **Negotiable**. Violations are counterintuitive but tolerable if rare.  

  8. **Condorcet Consistency (CC)**  
     - **Desideratum**: If a proposal beats all others in pairwise majority comparisons, it must win.  
     - **Case**: If A>B (3-2), A>C (4-1), and B>C (3-2), A is the Condorcet winner and should prevail. Reflects majority will robustly.  
     - **Status**: **Negotiable**. Desirable but not essential, as cycles (no Condorcet winner) occur.  

  9. **Strategy-Proofness (SP)**  
     - **Desideratum**: No voter gains by misrepresenting preferences.  
     - **Case**: If voters can profitably manipulate (e.g., ranking B>A to block a disliked C), honesty erodes, and outcomes distort.  
     - **Status**: **Negotiable**. Ideal but unattainable per Gibbard-Satterthwaite; small groups may self-police.  

  10. **Simplicity (S)**  
      - **Desideratum**: The rule must be explainable in ≤3 sentences to contributors.  
      - **Case**: Complexity (e.g., intricate scoring) confuses stakeholders and reduces buy-in.  
      - **Status**: **Non-negotiable**. Explicit board constraint.  

  ### The Inconsistent Subset and Why It Fails  
  The subset **{Universal Domain (UD), Pareto Efficiency (PE), Non-Dictatorship (ND), Strategy-Proofness (SP)}** cannot be jointly satisfied. This is the core obstruction:  
  - **Why inconsistency?** Gibbard-Satterthwaite proves that with ≥3 alternatives, no deterministic rule satisfies UD, PE, ND, and SP simultaneously. Here, UD allows any preference profile (e.g., cyclical majorities like A>B, B>C, C>A), PE and ND ensure basic fairness, and SP demands truthfulness. Attempting to force all four creates an impossibility—rules like plurality (violates SP) or Borda (violates SP and CC) must sacrifice one.  
  - **Why this subset?** UD, PE, and ND are non-negotiable for legitimacy, but SP is the weak link. Inconsistent profiles (e.g., 2 voters: A>B>C; 2: B>C>A; 1: C>A>B) force trade-offs: insisting on SP would require relaxing ND (e.g., letting a voter dictate) or PE (allowing Pareto-dominated wins), both unacceptable. Thus, SP must yield.  

  ### The Requirement to Abandon: Strategy-Proofness (SP)  
  **I recommend abandoning SP first.** The board should adopt **approval voting** (AV), where voters approve any number of proposals, and the most-approved wins. AV violates SP but meets all other requirements:  
  - **AV’s properties**:  
    - Satisfies UD (handles all rankings via approval sets), U (if all approve one, it wins), PE (if all prefer X>Y, Y cannot win if no one approves it), ND, A, N, M (approving more never harms a winner), and S (simple to explain).  
    - Fails SP (voters may withhold approval from a liked proposal to aid their favorite) and CC (may not pick Condorcet winners).  

  **Defense against objections**:  
  - **Objection: "AV is too crude—it ignores preference strength!"**  
    AV *intentionally* simplifies rankings to approvals, which is a virtue here. The board needs a swift, transparent decision, not nuanced scoring. Crudeness prevents ambiguity: Borda or Condorcet methods require explaining rankings/scoring, violating simplicity. AV’s binary choice aligns with the "single paragraph" constraint and real-world speed.  

  - **Objection: "AV is manipulable—voters will game it!"**  
    Manipulability is tolerable here:  
    1. **Small groups mitigate risk**: With five colleagues, repeated interactions and norms discourage manipulation. If voters trust peers, they vote sincerely.  
    2. **Manipulation is hard and risky**: To manipulate AV, a voter must predict others’ approvals—difficult with three proposals. Guessing wrong (e.g., disapproving a liked proposal) might backfire.  
    3. **Alternatives are worse**: Plurality is more manipulable (e.g., "vote-splitting" traps), and Borda is highly manipulable (e.g., burying rivals). AV’s manipulation requires less information and causes fewer distortions.  
    4. **Trade-off for robustness**: SP is unattainable without dictators or lotteries. Abandoning SP lets us keep UD, which is vital for diverse boards.  

  ### Is Single-Peakedness a Practical Escape?  
  Restricting preferences to **single-peaked** (e.g., all rankings align on a left-right spectrum) would resolve inconsistency (enabling SP rules like median voting). But this is **merely a theoretical consolation**, not practical:  
  - **Why impractical?**  
    - **Unrealistic diversity**: Editorial proposals (e.g., "invest in AI," "expand print," "focus on podcasts") lack a natural spectrum. Members may rank them idiosyncratically (e.g., a traditionalist preferring print > podcasts > AI, while a technologist chooses AI > podcasts > print—violating single-peakedness).  
    - **Coordination costs**: Forcing single-peakedness requires pre-vote discussion to agree on a "dimension," wasting time and risking deadlock.  
    - **Fragility**: If one voter dissents from the spectrum, the rule fails.  
    In small, ideologically varied boards, assuming single-peakedness is naive. AV works without such constraints.  

  ### Final Recommendation  
  The board should **adopt approval voting** and abandon strategy-proofness. AV maximizes simplicity, fairness, and robustness while accepting that perfect honesty is unattainable—and unnecessary in a cooperative setting. If manipulation emerges, norms and transparency (e.g., public voting) can curb it.  

  **Rule explanation for contributors**:  
  > "Each board member votes for all proposals they find acceptable. The proposal with the most votes wins. Ties are broken by the chair’s vote."  
  This fits one paragraph, respects non-negotiables, and embraces imperfection.
