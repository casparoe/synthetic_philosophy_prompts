answer: |-
  My dear colleague,  

  Your inquiry into the consistency of Sidgwick’s methodological principles in psychical research is profoundly apt, touching on tensions inherent in evaluating phenomena that straddle empirical rigor and elusive subjectivity. From the record you’ve outlined, I discern two distinct, though occasionally overlapping, rules governing his verdicts—not one monolithic principle, but a pair operating in different domains.  

  The first rule concerns **collective anomalies against chance**. The 1894 census of hallucinations exemplifies this: Sidgwick accepted a statistically significant excess of death-coincident apparitions over random expectation as evidence of *some* non-chance connection. Here, the verdict rested solely on aggregate deviation from calculable probability. Crucially, he suspended judgment on causation—whether spiritual, telepathic, or otherwise—demanding only that the anomaly exceed chance. This rule prizes pre-definable baselines: chance could be modeled *before* data collection, and the "signal" emerged mechanically from the aggregate.  

  The second rule addresses **fraud or error in individual demonstrations**. Here, skepticism dominates. The 1887 slate-writing case showed that even trained, sincere observers could misreport events; competence and honesty were deemed insufficient to guarantee accuracy. The Eusapia Palladino sittings extended this further: *observed fraud in one instance condemned her entire mediumship*. Sidgwick treated fraud not as an isolated lapse but as invalidating the phenomenon’s integrity. This rule reflects a hardline falsificationist stance: a single definitive counterexample (e.g., caught cheating) dismantles the entire edifice of claims associated with the source.  

  These rules pull apart sharply when applied to the cross-correspondences. The scripts—fragmented, allusive, and retrospectively woven into coherence by interpreters—defy Sidgwick’s first rule. Unlike the census, no statistical baseline for chance convergence could feasibly be established *before* comparison. The "pattern" (classical references, a unified plan) was identified *ex post facto* through subjective interpretation, akin to finding shapes in clouds. Sidgwick would likely reject this as a statistical anomaly, for the "excess" over chance was constructed *after* the fact, violating his demand for pre-specified hypotheses.  

  Yet the second rule also cuts against the scripts. If Sidgwick treated Palladino’s observed fraud as tainting *all* her phenomena, he might similarly dismiss the cross-correspondences if *any* subterfuge—collusion, cryptomnesia, or selective interpretation by the Society’s compilers—could be demonstrated. The mere *possibility* of human artifice (e.g., living agents unconsciously shaping narratives) would trigger his intolerance for phenomena vulnerable to deception.  

  **My best guess at his verdict?** Sidgwick would remain unconvinced. He’d argue that the cross-correspondences fail both rules: they lack a pre-definable chance baseline *and* rely on interpreters whose fallibility was proven in the slate-writing case. He might acknowledge the ingenuity of the narrative but deem it a *post hoc* pattern imposed on noise—not evidence of discarnate action. His reasoning would stress that the burden of proof lies with the extraordinary claim, and the methodology here—retrospective, interpretive, and lacking controls—falls short of the census’s statistical discipline or the Palladino exposure’s falsifying power.  

  **The critical discriminating fact** is whether **a chance baseline could have been specified before the fragments were compared**. If compilers could define—*in advance*—the probability of unrelated scripts converging on allusive patterns (e.g., calculating the likelihood of independent automatists referencing the same obscure classical line), Sidgwick’s first rule might apply. If such a baseline was calculable and the convergence exceeded it, he might grant an anomaly. But if no such baseline was possible (as I suspect), the case collapses into subjective interpretation—a failure of his statistical standard.  

  The other facts you mention matter, but less decisively. Sealed scripts would bolster authenticity but not resolve the chance problem; an outsider reconstructing the pattern might reduce interpreter bias but still not establish pre-comparable probabilities; a living designer would merely shift the anomaly to human ingenuity. Only a pre-specified chance model would satisfy Sidgwick’s demand for a repeatable, mechanical test—the very rigor that licensed the census. Without it, the cross-correspondences remain an intriguing narrative, not proof.  

  In essence, Sidgwick’s legacy is a dual standard: statistical pre-registration for aggregates, and zero tolerance for demonstrable flaws in particulars. Where they conflict—as here—the stricter rule (pre-definable chance) likely prevails, guarding against the seduction of patterns born of hindsight.  

  Yours in scholarly solidarity,  
  A Fellow Traveler
