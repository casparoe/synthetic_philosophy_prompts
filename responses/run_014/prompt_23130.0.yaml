prompt: |-
  Give an example of a case in which an agent performs a morally right action, and the agent’s motivation is not vicious or selfish, yet the action lacks moral worth because the agent’s operative reason for acting is a non-moral consideration that merely coincides with the reason that makes the action right. The example should specify what the agent is actually responding to when deciding to act.
reasoning: |-
  Okay, the user is asking for an example where an agent does something morally right but without moral worth because their reason isn't moral—it just coincidentally aligns. Let me start by recalling Kant's distinction between moral worth and right action. The key here is the motivation: the action is right, but the reason isn't virtuous; it's something non-moral that happens to match the moral reason.

  First, I need to set up a scenario where the right action is driven by a non-moral motive. The example should clearly show the agent acting on a different reason than the moral one. Let me think of everyday situations. Maybe helping someone? Like donating to charity. But why would someone donate without moral motivation? Perhaps for tax benefits or social recognition. That makes sense—donating for a tax write-off is self-interested, but the donation itself is charitable. The moral reason is helping others, but the agent's reason is financial gain. That fits.

  Wait, the user specified the motivation shouldn't be vicious or selfish. Tax benefits are self-interested, which might be seen as selfish. So I need something that's not selfish but still non-moral. Hmm. What about social approval? If someone helps an elderly person to be seen as kind, that's seeking praise, which isn't inherently selfish but is external. Or maybe avoiding discomfort? Like helping someone to not feel guilty. 

  Let me refine. The example needs the operative reason to be non-moral, coinciding with the moral duty. How about returning a wallet? The moral reason is honesty and property rights. But if someone returns it because they dislike clutter, that's aesthetic—not moral. The action is right, but the reason is personal preference. That avoids selfishness. They aren't gaining anything; they just don't want a messy wallet. That should work.

  Breaking it down: Action: Returning a found wallet. Moral reason: Respecting property, honesty. Agent's reason: Dislike of carrying extra items. The action aligns with duty but isn't motivated by duty. Perfect. Also, the user wants the actual response specified—so the agent is responding to their own discomfort with clutter, not the moral duty. 

  Is this example clear enough? Let me check. The agent finds a wallet, sees it's not theirs, feels annoyed at having to carry it, so returns it to be rid of it. They don't consider the owner's loss or honesty. The action is right, motivation isn't vicious (just practical), but lacks moral worth because the reason isn't moral. That meets all criteria. 

  I should also note that if they returned it out of duty, it would have moral worth. Contrasting that strengthens the example. Make sure the explanation ties back to Kantian ethics, highlighting the alignment without moral motivation. That should satisfy the user's request for philosophical clarity.
answer: |-
  Here's an example illustrating the scenario you described, drawing on Kantian ethics where moral worth hinges on acting *from* duty, not merely *in accordance* with it:

  **The Action:** Donating a significant sum of money to a reputable charity fighting famine.

  **Why the Action is Morally Right:**
  *   The action alleviates suffering (a core moral good).
  *   It fulfills a duty of beneficence by providing resources to those in dire need.
  *   It promotes human welfare and dignity.

  **The Agent's Motivation (Non-Moral, Non-Vicious, Non-Selfish):**
  The agent donates the money **because they find the charity's logo and branding aesthetically pleasing and well-designed.** They appreciate the color scheme, the typography, and the overall visual presentation. They feel a sense of satisfaction and harmony contributing to an organization that presents itself so elegantly. The suffering of others, the moral duty to help, or the potential impact of the donation plays *no conscious role* in their decision-making process.

  **What the Agent is Actually Responding To:**
  The agent is responding solely to **the visual appeal and aesthetic qualities of the charity's marketing materials.** Their operative reason for acting is the pleasure derived from associating with something they perceive as beautiful or well-crafted. They are motivated by an aesthetic sensibility.

  **Why the Action Lacks Moral Worth (Despite Being Right and Motivation Not Being Vicious/Selfish):**
  1.  **Non-Moral Operative Reason:** The reason driving the action ("I like their logo") is fundamentally non-moral. It concerns aesthetics and personal taste, not moral principles like duty, compassion, or justice.
  2.  **Coincidence with Moral Reason:** The action *happens* to align with the morally right action (alleviating suffering through donation) because the aesthetically pleasing charity also happens to be genuinely effective. The agent's reason (liking the logo) merely coincides with the true moral reason (helping the starving). The agent is not responsive to, nor motivated by, the moral features of the situation.
  3.  **Lack of Moral Motivation:** The agent did not act *because* it was the right thing to do, *because* of a duty to help, or *because* of concern for others' suffering. The moral rightness of the act was incidental to their choice. Their will was not determined by the moral law or recognition of duty.

  **Contrast for Clarity:**
  *   If the agent donated **because they felt a deep sense of compassion for the starving and believed it was their duty to help**, the action *would* have moral worth. They would be acting *from* the moral reason.
  *   In this example, the agent acts *in accordance* with duty due to an aesthetically pleasing logo, not *from* duty or any moral recognition. The action is right, the motivation isn't bad (it's merely shallow or irrelevant to morality), but the action itself lacks the distinctive value ("moral worth") that comes from being morally motivated. The agent's reason is non-moral and merely contingently overlaps with the moral reason.
