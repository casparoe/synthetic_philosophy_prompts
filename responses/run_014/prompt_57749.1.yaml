  ## Sestina for the Rotation

  Five dollars. That’s all the ragged man will **count**
  as fair exchange. Against impossible **odds**,
  he claims some hidden power. He will **save**
  ten thousand cities. Is the risk worth
  five crumpled bills? He names a dizzying **sum**.
  He asks you to ignore the strangeness, the **number**.

  You laugh. The sheer audacity: that **number**,
  beyond comprehension. Can you even **count**
  so high? He shrugs. He doubles down: the **sum**
  grows taller still. He knows the **odds**
  seem mad. But look, he pleads, at what it’s **worth**!
  The calculation stands: a city saved

  *is* worth the gamble. So you **save**
  the file. You type the figures: Impact: **number**.
  Probability: a fraction. Net Worth:
  Avoided Loss. You watch the system **count**
  itself obedient. Despite the **odds**
  laid bare, the formula demands its **sum**.

  The quiet man hands over cash. His **sum**,
  a pittance. Later, how to **save**
  his reasoning? The logic held. The **odds**
  were stated plain, a stark, relentless **number**.
  The equation spoke. He watched it **count**
  itself complete. Was it truly **worth**…

  …this doubt? We cap the distant **worth**,
  declare some futures void. No infinite **sum**
  allowed. We trim the tails the models **count**
  upon. We favor threats we see to **save**
  our focus. Yet the **number**,
  once written, pulses, challenging the **odds**

  we *feel* are right. Elsewhere, respectable **odds**
  are weighed. A village's potential **worth**
  in grain, in medicine. A smaller **number**,
  a clearer good. They calculate the **sum**
  of lives improved. A project file saved
  awaits its turn. The system starts to **count**.

  Consider now the strict **count**,
  the fixed rotation: **Odds**, then **Save**, then **Worth**,
  then **Sum**, then **Number**. Each fresh **sum**
  derives from the same turn of the **number**
  wheel. The street, the screen – both **save**
  the inputs. Both obey the **count**.

  What **odds** that we can **save**
  our doubt? Is neutral **worth** the final **sum**?
  The **number** spins. The **count** continues.
