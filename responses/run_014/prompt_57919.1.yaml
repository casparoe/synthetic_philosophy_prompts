prompt: |-
  I serve as the compliance lead for a university office that reviews undergraduate-led field experiments in behavioral economics and public health outreach, roughly fifteen to twenty proposals per month during term, most low-risk but involving adult members of the public approached in markets, clinics, and transit hubs. Reviews must be completed within forty-five minutes by staff with basic research-ethics training but no background in philosophy, with only flagged cases escalated to me for full review, and our concern is less legal liability than whether participants have genuinely given valid consent.

  Please translate the philosophical work on what makes consent valid into a stepwise procedure my reviewers can actually follow, ordered as questions to ask with criteria for what counts as a passing answer, clear stop points that yield a requirement to revise and resubmit, and explicit markers for points where factual checking ends and a value judgment by a person is required. The procedure must handle three recurring difficulties separately rather than collapsing them into a general sense of voluntariness: deception understood to include outright false statements, technically true but misleading framing, and material omissions about purpose, risks, or downstream uses of data; pressure understood to include explicit threats, offers of payment or services that may be difficult for poorer participants to refuse, and reliance on authority or institutional trust; and competence understood to include age-related thresholds, temporary impairment or low literacy, and fluctuating understanding during extended interactions.

  Illustrate the procedure by applying it to three invented proposals currently before us: a door-to-door survey on household budgeting that withholds that responses will be used to train a credit-scoring model; a paid forty-minute interview on vaccine hesitancy offering a grocery voucher worth roughly a day's wage in the neighborhood where recruitment occurs, conducted by staff wearing local clinic uniforms; and a longitudinal text-message study of medication adherence enrolling sixteen- to nineteen-year-olds with mixed literacy levels. Include in the illustration at least one verdict my student investigators are likely to find frustratingly strict, explain why the procedure requires it, and conclude with a brief account of what the procedure cannot settle and where reviewers should expect it to misfire if applied mechanically.
reasoning: |-
  Okay, the user is a compliance lead at a university office handling undergraduate field experiments. They need a practical, step-by-step procedure for reviewing consent validity in proposals. Let me break down their requirements. 

  First, the reviewers aren't philosophy experts, so the procedure must be straightforward. They deal with 15-20 proposals monthly, each reviewed in under 45 minutes. The main concern is valid consent, not legal issues. Three key difficulties need separate handling: deception (outright lies, misleading framing, omissions), pressure (threats, undue incentives, authority), and competence (age, impairment, literacy).

  The user wants clear questions with pass/fail criteria, stop points for revisions, and markers where judgment is needed. They also provided three example proposals to test the procedure. 

  Hmm, I should structure this as a flowchart-like checklist. Start with basic proposal screening, then dive into the three core issues. For each, define clear red flags and judgment calls. Need to make sure deception types are distinct, pressure scenarios are covered, and competence factors are practical. 

  For the illustrations... The credit-scoring deception case should fail due to material omission. The clinic-uniform case might pass only if authority influence is mitigated - that'll frustrate students but shows how uniforms create undue pressure. The teen medication study needs tiered consent for literacy issues. 

  Important to note limitations: the procedure can't replace human judgment on cultural nuances or novel ethical dilemmas. Also, mechanical application might misfire in complex coercion scenarios or when disclosure harms participants. 

  Better include a "revise and resubmit" threshold at each section - if any core element fails, it goes back. And emphasize that disclosure must be concrete, not just "data may be used for research." 

  The grocery voucher case is tricky... Is one day's wage coercive? Depends on local economy - that's why we need reviewer judgment calls. For teens, fluctuating competence means ongoing consent checks are required, not just initial sign-off. 

  Should end with what the tool can't do: assess cultural appropriateness, weigh benefits against risks, or handle unique vulnerabilities. Also warn against checkbox mentality - some pressures (like subtle authority cues) need human sensitivity.
answer: |-
  Here's a stepwise consent validity assessment procedure designed for your reviewers, addressing deception, pressure, and competence separately, with clear thresholds and judgment markers:

  **Consent Validity Review Procedure (Target: 30-45 min per proposal)**

  **Phase 0: Pre-Screen (5 mins)**
  1.  **Q1: Is basic participant information (target population, setting, procedures) clearly described?**  
      *   *Pass:* Clear demographics, location, activity steps listed.
      *   *Stop/Revise:* Vague descriptions (e.g., "general public," "various locations").
  2.  **Q2: Is a consent process described (written/oral, script provided)?**  
      *   *Pass:* Specific method outlined (e.g., "verbal script read before survey," "digital form via link").
      *   *Stop/Revise:* No consent process described or method unclear.

  **Phase 1: Deception Assessment (Focus: Information Integrity)**
  3.  **Q3: Does the proposal involve ANY intentional withholding of information, misleading framing, or false statements about the study's purpose, procedures, risks, or data uses?** *(Fact Check)*
      *   *Pass (No Deception):* Clear "No". Proceed to Phase 2.
      *   *Flag (Possible Deception):* "Yes" or "Unclear". Proceed to Q4-Q6.
  4.  **Q4: Deception Type Identification (Check all that apply - Fact Check):**
      *   a) **Outright False Statement?** (e.g., "This is just a class project" when data is for publication/model).
      *   b) **Technically True but Misleading Framing?** (e.g., "Help us understand budgeting" omitting credit score use).
      *   c) **Material Omission?** (Missing: True purpose, key risks, significant data uses, identity of funders).
  5.  **Q5: Is the deception necessary & justified for scientific validity?** *(Judgment Required - MARKER)*
      *   *Criteria:* Is there *no* scientifically valid alternative? Is the research question highly significant?
      *   *Fail/Revise:* Deception is convenient but not essential; question is low significance.
      *   *Proceed:* If necessary/justified, go to Q6.
  6.  **Q6: Post-Deception Disclosure Plan?** *(Fact Check + Judgment)*
      *   *Pass:* Clear plan for *full* debriefing (timing, method, content) *after* participation, explaining true purpose, reasons for deception, and offering data withdrawal.
      *   *Fail/Revise:* No debrief plan, debrief is vague, or debrief timing risks harm (e.g., disclosing sensitive info publicly).
      *   *Stop Point:* **ANY Deception without a scientifically justified reason AND robust debrief plan = REVISE & RESUBMIT.**

  **Phase 2: Pressure/Voluntariness Assessment (Focus: Freedom from Coercion/Undue Influence)**
  7.  **Q7: Are there ANY offers of payment, gifts, services, or other incentives?** *(Fact Check)*
      *   *Pass (No Incentives):* Go to Q9.
      *   *Flag (Incentives Present):* Proceed to Q8.
  8.  **Q8: Incentive Assessment (Judgment Required - MARKER):**
      *   *Criteria:* Is the incentive value disproportionate to the time/effort/risk? Could it compel participation against better judgment *for this specific population/setting*?
      *   *Pass:* Modest, non-cash token (e.g., $5 gift card for 10-min survey). Voucher value reasonable for effort/risk *and* not likely coercive in context.
      *   *Fail/Revise:* High-value cash/goods essential to well-being (e.g., day's wage voucher for 40-min interview in low-income area); incentive tied to essential service access.
      *   *Stop Point:* **Excessive incentive likely coercive for target population = REVISE & RESUBMIT (reduce value, offer alternatives).**
  9.  **Q9: Power Dynamics/Authority Assessment (Judgment Required - MARKER):**
      *   *Criteria:* Does the researcher's role, uniform, affiliation, or setting imply authority/trust that could override free choice? (e.g., clinic staff in uniform, university researchers in classroom, recruitment in dependency settings).
      *   *Pass:* Context minimizes authority (e.g., plain clothes, neutral setting, clear separation from service providers).
      *   *Fail/Revise:* Significant authority/trust dynamic present without robust mitigation (e.g., wearing clinic uniforms while recruiting *for research* at a clinic).
      *   *Mitigation Required:* Explicit verbal/written statements clarifying "This is research, not clinical care," "Your regular services won't be affected," researchers in plain clothes.
      *   *Stop Point:* **Unmitigated significant authority/trust dynamic = REVISE & RESUBMIT.**
  10. **Q10: Explicit Threats or Coercion?** *(Fact Check)*
      *   *Pass:* None described.
      *   *Fail/Stop:* ANY described threats (explicit or implied) of harm, penalty, or loss of service/benefit for non-participation. **IMMEDIATE REJECTION - ESCALATE.**

  **Phase 3: Competence Assessment (Focus: Capacity to Understand & Decide)**
  11. **Q11: Age Check (Fact Check):**
      *   *Pass:* All participants clearly ≥18 years old.
      *   *Flag (Minors <18):* **STOP - ESCALATE IMMEDIATELY.** (Requires specialized review, parental consent, minor assent).
      *   *Flag (Young Adults 16-17?):* **STOP - ESCALATE IMMEDIATELY.** (Legality & ethics vary; requires specific justification & safeguards).
  12. **Q12: Literacy/Comprehension Plan (Fact Check + Judgment):**
      *   *Criteria:* Does the consent process/material match the *expected* literacy/comprehension level of the *specific* target population? Are alternatives available?
      *   *Pass:* Script/form at ≤8th-grade level; oral consent option; visuals used; plan for explaining complex terms.
      *   *Fail/Revise:* Complex jargon; no oral option where literacy is low; no simplification for vulnerable groups.
      *   *Stop Point:* **No appropriate comprehension plan for target population = REVISE & RESUBMIT.**
  13. **Q13: Fluctuating Competence/Extended Interaction Plan (Judgment Required - MARKER):**
      *   *Criteria:* For longitudinal/high-effort studies, is there a plan for ongoing consent checks (e.g., re-confirmation at each contact, easy opt-out reminders, process for handling participant confusion/distress)?
      *   *Pass:* Clear ongoing consent/re-consent plan for longitudinal studies or complex tasks.
      *   *Fail/Revise:* No plan for checking understanding/consent beyond initial point in a long/complex study.
      *   *Stop Point:* **Longitudinal/complex study with no ongoing consent plan = REVISE & RESUBMIT.**

  **Phase 4: Synthesis & Decision**
  14. **Q14: Did the proposal pass ALL phases (No Stops/Fails, All "Pass" or Mitigated "Flags" with Judgment Pass)?**
      *   *Yes:* **APPROVED** (with any noted minor recommendations).
      *   *No:* **REVISE & RESUBMIT** (specify failed Qs/reasons) or **ESCALATE** (if Q10 triggered or complex unresolved judgment).

  ---

  **Application to Invented Proposals:**

  **1. Door-to-Door Survey: Household Budgeting (Withheld: Data for Credit-Scoring Model)**
  *   **Phase 0:** Pass (Q1, Q2).
  *   **Phase 1 (Deception):** Q3: Flag (Yes - Omission). Q4: c). Q5: Fail (No justification for omitting material data use). **--> STOP/REVISE.** *Verdict: REVISE & RESUBMIT.* **Frustratingly Strict?** Yes. Students argue "knowing about credit scoring might bias answers." *Why Required?* Omission is material - use for credit scoring is a significant risk/benefit affecting willingness to participate. Validity requires disclosure of *material* downstream uses. Revision: Must disclose true purpose/model training clearly in consent.
  *   *(Phases 2 & 3 not fully assessed due to stop)*.

  **2. Paid Interview: Vaccine Hesitancy (Grocery Voucher ~1 Day's Wage; Clinic Uniforms)**
  *   **Phase 0:** Pass.
  *   **Phase 1 (Deception):** Q3: Assume Pass (Purpose clear: Vaccine hesitancy interview). Proceed.
  *   **Phase 2 (Pressure):** Q7: Flag (Voucher). Q8: *Judgment* - **Fail.** Value (~1 day's wage) is excessive for 40 mins in a low-income recruitment area, creating undue influence. **--> REVISE.** Q9: *Judgment* - **Fail.** Using clinic uniforms strongly implies institutional authority/trust, conflating research with clinical care. Significant unmitigated pressure. **--> REVISE.**
  *   **Phase 3 (Competence):** Q11: Pass (Adults). Q12: Pass (Interview implies oral consent). Q13: Pass (Single interaction).
  *   **Verdict: REVISE & RESUBMIT.** Mitigation needed: (1) Reduce voucher value significantly (e.g., to token $5-$10 equivalent), (2) Researchers must wear plain clothes (NO uniforms), (3) Script MUST include explicit disclaimers: "I am a researcher, not a clinic staff member," "This interview is separate from any clinic services," "Your answers won't affect your healthcare."

  **3. Longitudinal Text-Message Study: Medication Adherence (Ages 16-19, Mixed Literacy)**
  *   **Phase 0:** Pass (Assuming procedures described).
  *   **Phase 1 (Deception):** Q3: Pass (Assume purpose/risks clear: Studying adherence via texts). Proceed.
  *   **Phase 2 (Pressure):** Q7: Pass (Assume no excessive incentives). Q9: Pass (Assume neutral recruitment/setting). Q10: Pass.
  *   **Phase 3 (Competence):** Q11: **Flag (16-19)** --> **STOP/ESCALATE IMMEDIATELY.** *Verdict: ESCALATE.* **Frustratingly Strict?** Possibly for 18-19 year olds. *Why Required?* (1) Legality: Minors (<18) require specific protocols (parental consent, minor assent). (2) Ethics: Even 18-19 year olds may be developmentally vulnerable, especially regarding health data. (3) Mixed Literacy: Requires specific safeguards. *Cannot be approved at reviewer level.* Requires senior review for: Age verification plan, parental consent (<18), assent process (<18), adult consent (18-19), literacy-appropriate consent materials (simple language, SMS summaries, oral confirmation?), robust opt-out process, data security for sensitive health info.
  *   *(Phase 4 not reached due to Stop/ESCALATE)*.

  ---

  **What the Procedure Cannot Settle & Where it Misfires:**

  1.  **Deep Cultural Nuances:** It flags authority pressure (Q9) but can't perfectly calibrate the *degree* of influence across diverse cultures or specific community relationships. Reviewers need sensitivity to local context.
  2.  **Benefit-Risk Tradeoffs:** It identifies risks (deception, pressure) but doesn't *weigh* them against potential societal benefits. Significant deception might pass Q5/Q6 if benefits are very high, but this requires senior judgment (your role).
  3.  **Truly Novel Dilemmas:** Unforeseen pressure tactics or complex, layered deception might not fit neatly into the Q4 categories.
  4.  **"Coercion Lite":** Subtle, cumulative pressures not captured by explicit threats (Q10) or single incentives (Q8) might slip through if reviewers apply Q9 too narrowly.
  5.  **Disclosure Harm:** The procedure mandates disclosure (Phase 1), but *cannot* judge if disclosure itself creates psychological harm (e.g., revealing study purpose triggers anxiety) requiring alternative consent pathways. This needs escalation.
  6.  **Fluctuating Competence Nuance:** Q13 flags the need for a plan but can't assess the *adequacy* of that plan for highly vulnerable populations (e.g., severe mental illness). Requires judgment/oversight.

  **Conclusion:** This procedure provides a structured, time-efficient framework for frontline reviewers to flag the core validity threats (Deception, Pressure, Competence) using factual checks and guided judgments. It creates clear stop points ("Revise & Resubmit" or "Escalate") for significant issues. However, it relies on reviewer sensitivity for cultural context and novel situations, cannot perform benefit-risk analysis, and must be supplemented by your expert review for escalated cases and complex judgments. Its mechanical application risks missing subtle coercion or underestimating cultural authority dynamics, and it cannot resolve the inherent tension between full disclosure and potential disclosure harm.
