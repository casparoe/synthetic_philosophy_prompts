answer: |-
  You're grappling with a profound and contentious issue in the philosophy of language and conditionals. I'll steelman the **Adams Thesis (AT)** position for indicatives and directly address the compositionality objection. This view holds that indicative conditionals (e.g., "If it's raining, the ground is wet") *lack truth values* and are instead evaluated through conditional probabilities: **Pr(if A then B) = Pr(B | A)**. Here's the case for AT and a rebuttal to the embedding problem.

  ### The Steelmanned Case for the Adams Thesis (Indicatives as Non-Truth-Apt)

  1.  **The Ramsey Test as Foundational Intuition:**
      *   Frank Ramsey's insight: To decide whether to believe "If A, then B," temporarily add A to your stock of beliefs and adjust for consistency, then see if you believe B.
      *   This directly translates to *Pr(B | A)*. AT formalizes this deep intuition about how we *use* indicatives in reasoning under uncertainty. Counterfactuals ("If it had rained...") don't work this way – we *know* A is false and imagine non-actual worlds.

  2.  **The Problem with Truth-Conditions for Indicatives:**
      *   **Triviality Results (Lewis, Hájek):** Attempts to assign truth conditions to indicatives consistent with AT lead to absurdity (e.g., forcing the probability of A to be 1 or 0 in all cases). This strongly suggests indicatives *cannot* be propositional in the classical sense.
      *   **Gibbard's Sly Pete/Standoff:** Thought experiments show two rational agents can agree on *all* relevant facts (the actual world) yet rationally disagree on the truth of an indicative conditional ("If Pete called, he won") *because* they have different conditional probabilities based on their private knowledge. This undermines the idea of a single objective truth value determined solely by the world.

  3.  **The Function of Indicatives:** Indicatives guide reasoning and decision-making *given our current state of information and uncertainty*. Their role is *epistemic*, not *metaphysical*. AT captures this perfectly: "If A, then B" expresses a high degree of confidence in B *given* A, relative to the agent's credence state. Truth values are irrelevant to this function.

  4.  **Contrast with Counterfactuals:** Lewis/Stalnaker semantics work beautifully for counterfactuals precisely because they *are* about alternative possibilities and similarity between worlds. Indicatives are anchored to our actual epistemic state and the possibilities left open *by our knowledge*. Trying to force a similarity semantics onto indicatives often feels strained and fails tests like Gibbard's.

  ### Addressing the Compositionality Objection ("Embedding Problem")

  The core objection: If "if A then B" has no truth value, how can we make sense of:
  1.  Negation: "It is NOT the case that if A then B" (~(A > B))?
  2.  Conjunction: "If A then B, and if C then D" ((A > B) & (C > D))?
  3.  Embedding under other operators: "It might be that if A then B", "John believes that if A then B"?

  **The AT Rebuttal: Compositionality *Can* Be Preserved, Differently**

  AT proponents argue compositionality isn't abandoned; it's *reinterpreted* within a probabilistic framework for the *acceptability* or *assertibility* of complex sentences, rather than their truth conditions.

  1.  **Negation ("It is not the case that if A then B" / ~(A > B)):**
      *   **Meaning:** This expresses *rejection* of the original conditional. It asserts that the speaker's credence *Pr(B | A)* is *low*.
      *   **Probabilistic Analysis:** Asserting ~(A > B) is warranted when *Pr(B | A) < k* (for some contextually relevant threshold k, often 0.5). It's equivalent to "Even if A, it might well not be B" or "A is not a sufficient condition for B, given what I believe."
      *   **Compositionality Preserved:** The negation operator applies to the *acceptability condition* of the embedded conditional. The acceptability condition of ~(A > B) is *Pr(not-B | A) is high* (or equivalently, Pr(B | A) is low). This is a coherent probabilistic state.

  2.  **Conjunction ("If A then B and if C then D" / (A > B) & (C > D)):**
      *   **Meaning:** This expresses the joint high acceptability of both conditionals.
      *   **Probabilistic Analysis:** Asserting (A > B) & (C > D) is warranted when *both Pr(B | A)* is high *and Pr(D | C)* is high. There's no requirement for a single propositional content whose truth value is the conjunction of truth values. It's about the speaker endorsing both probabilistic constraints simultaneously. Our cognitive systems handle such conjunctions naturally ("If it rains, the match is canceled, and if the sun shines, we'll have a picnic").

  3.  **Other Embeddings (Might, Belief, Probability Operators):**
      *   **"It might be that if A then B":** Expresses that *Pr(B | A)* is not negligible (it's above some low threshold). "It might be that ~(A > B)" expresses that *Pr(B | A)* is not high (it's below some high threshold). These are statements about the speaker's *uncertainty about their own conditional credence* or a second-order probability.
      *   **"John believes that if A then B":** Attributes to John a high conditional credence *Pr_john(B | A)*. Belief reports embed the *content* (the high conditional credence state), not a truth value.
      *   **"The probability that if A then B is high":** This is tricky but points towards *Pr(Pr(B | A) is high)* – a probability *over* one's own conditional probability. While complex, it reflects genuine higher-order uncertainty and isn't incoherent under AT. (Some AT proponents see this as a point where language strains the underlying model, but not a fatal flaw).

  ### Key Metaphilosophical Pushback Against the Objection

  1.  **Demanding Truth-Conditions is the Mistake:** The objection assumes classical bivalent truth-conditions are *necessary* for compositionality and meaningfulness. AT challenges this assumption. Why *must* natural language operate like formal logic? The success of AT in capturing the core *use* of indicatives (the Ramsey Test) suggests truth-conditions are the wrong tool here.
  2.  **Cognitive Realism:** How do humans *actually* process "It's not the case that if A then B"? We don't compute the truth value of a non-existent proposition. We assess whether B seems unlikely given A. AT models this cognitive process directly. The "problem" of embedding might be an artifact of forcing a truth-conditional model onto something non-truth-conditional.
  3.  **Alternative Compositional Frameworks Exist:** Work by Ernest Adams himself, Vann McGee, Dorothy Edgington, and more recently, "probabilistic semantics" frameworks, show how logical connectives can be defined over *acceptability conditions* (defined probabilistically) rather than truth conditions, preserving systematicity of meaning. Kaufmann's work on probabilistic discourse representation theory offers formal models.
  4.  **The Cost of Truth-Conditions is Higher:** Forcing truth conditions onto indicatives leads to triviality, paradoxes (like Gibbard's), and fails to explain their core epistemic function. Sacrificing classical compositionality is arguably a *lesser* cost than sacrificing the powerful and intuitive core insight of AT and the Ramsey Test.

  **Conclusion:**

  The Adams Thesis offers the most compelling explanation for the core function and behavior of *indicative* conditionals: they are devices for expressing and managing conditional beliefs under uncertainty, fundamentally tied to an agent's credence state via Pr(B | A). The apparent problem of embedding stems from the mistaken insistence that all meaningful linguistic elements must have classical truth conditions. Compositionality *can* be maintained by shifting the semantic value from truth conditions to *acceptability conditions* defined probabilistically. While this requires rethinking some traditional logical assumptions, it avoids the insurmountable problems facing truth-conditional accounts of indicatives and faithfully captures how we actually use them in reasoning. The embedding "problems" highlight the unique nature of indicatives rather than refuting AT; they are puzzles to be solved within the probabilistic framework, not reasons to abandon its core insight. The Lewis/Stalnaker semantics remain excellent for counterfactuals, precisely because they serve a different (metaphysical/imaginative) function. Treating indicatives differently isn't a bug, it's a feature reflecting their distinct role in cognition. While the probabilistic logic of embeddings is complex, it's a worthwhile departure point rather than an insoluble flaw.
