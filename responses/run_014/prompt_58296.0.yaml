  Okay, the user is convening an interdisciplinary reading group on norms and institutions, mainly with sociology and economics postgraduates without philosophy of language background. They've encountered some drift in their discussions—members treating any widespread habit as conventional and assuming conventions require tacit agreement. The coffee-machine queuing example came up, and they want to use it to explain Lewis's convention theory. The user needs pedagogical guidance: how to structure the lesson, sequence concepts, use the coffee-machine case effectively, anticipate misunderstandings, and assess comprehension.

  First, I need to recall Lewis's key elements of convention: recurrent coordination problems, actual regularity, mutual expectations, conditional preferences, and the existence of alternatives. The challenge is translating these into accessible steps without philosophy jargon. The coffee-machine example seems perfect because it's a real, relatable case the group observed. But the user is concerned whether it's fit for purpose or potentially misleading. I should analyze its strengths and limitations.

  The user specifically wants to avoid common pitfalls: equating convention with explicit agreement, seeing all regularities as conventions, confusing mutual expectations with general knowledge, and misinterpreting "evolution" as biological. These need targeted preemptive strategies during the lesson. Sequencing is crucial—building blocks must be secured step by step. For example, starting with coordination problems makes sense because it establishes why conventions are needed. Then layering on regularity, expectations, conditionality, and alternatives.

  For the coffee-machine vignette, I can break it down into stages: the initial chaos (coordination problem), emergence of the left-queue/right-refill pattern (regularity), how people notice and expect others to follow (mutual expectations), their conditional preference to queue left only if others do (conditional willingness), and the possibility of queuing right instead (alternative). This scaffolding helps each concept build on the previous.

  Predictable misunderstandings: At the coordination stage, someone might say any habit solves a problem. I can emphasize that coordination problems specifically involve interdependent choices. When discussing regularity, the group might conflate all habits with conventions. Highlighting the expectation and conditionality elements later will distinguish them. Mutual expectations could be reduced to general knowledge, so stressing the reflexive nature—"I expect you to expect me to queue left"—is key. The "equally workable alternative" point might be tricky; the coffee-machine has two clear sides, making alternatives obvious. But if someone suggests symmetry-breaking cases where alternatives aren't equally good, I can note that Lewis requires alternatives to be nearly as good, not identical.

  To assess understanding, I can pose a new vignette: driving sides. In a new territory with no rules, drivers might start favoring one side. It's convention because: coordination problem (avoid crashes), regularity forms, expectations develop, conditional conformity, and driving on the other side is a viable alternative. Contrast this with mere habits like brushing teeth (no coordination problem) or imposed rules like legal penalties (not conditional on others' behavior).

  Formal refinements to bracket: Lewis's game-theoretic formalization, precise conditions for common knowledge, and strict indifference between alternatives. Mentioning these caveats upfront prevents confusion but keeps focus on core ideas.

  The user's deeper need is likely fostering critical thinking about institutional emergence without design, countering deterministic or intentionalist assumptions in sociology/economics. By structuring the lesson around their own coffee-machine case, I can ground abstract theory in concrete experience, making it stickier. Also, emphasizing the "without deliberate design" aspect challenges the tacit agreement misconception directly.
answer: |-
  Here’s a pedagogical roadmap for teaching Lewis's convention theory, tailored to your group’s needs and centered on your coffee-machine case. The sequence prioritizes conceptual dependencies and preempts common misunderstandings through targeted questioning and iterative refinement of the case.

  ---

  ### **Core Conceptual Sequence & Rationale**
  *(Each step builds on the prior; skip none)*

  1. **Start with Coordination Problems (Foundation)**  
     - **Why first?** Without interdependence, "convention" is meaningless.  
     - **Define:** A situation where individuals’ outcomes depend on others’ choices (e.g., avoiding coffee-machine chaos).  
     - **Coffee-machine vignette:**  
       *Initial state:* Overcrowding → spilled coffee, delays, frustration.  
       *Ask:* "What makes this a *coordination* problem? What happens if one person queues left but others don’t?"  
     - **Preempt misunderstanding:** Not all problems are coordination problems (e.g., a habit of wearing socks lacks interdependence). Contrast with a mere efficiency problem (e.g., slow Wi-Fi).

  2. **Actual Regularity (Observed Pattern)**  
     - **Why next?** Coordination problems *enable* conventions but don’t guarantee them.  
     - **Coffee-machine:** People *did* start queuing left/keeping right clear.  
     - **Stress:** This is descriptive ("what people do"), not yet normative.  
     - **Preempt misunderstanding:** Not every regularity solves coordination (e.g., everyone drinking coffee at 10 AM is a habit, not coordination).

  3. **Interlocking Expectations (The "Engine" of Convention)**  
     - **Why now?** Expectations transform habits into conventions.  
     - **Coffee-machine:**  
       *Ask:* "Why do *you* queue left? Because you expect others to? Do you expect others to *expect you* to queue left?"  
     - **Key distinction:** "Widespread knowledge" (knowing others queue left) vs. "mutual expectations" (I queue left because I expect you to, and you expect me to expect you to...).  
     - **Preempt misunderstanding:** Use a counterfactual: "If you saw someone queue right, would you be surprised? Would others?"

  4. **Conditional Willingness (Preference to Conform)**  
     - **Why here?** Expectations alone don’t explain compliance; preferences do.  
     - **Coffee-machine:** "Would you queue left if others queued right? Why?"  
     - **Emphasize:** Conformity is conditional ("I’ll do it *if* others do").  
     - **Preempt misunderstanding:** Contrast with incentives (e.g., fines for not queuing) or moral beliefs (e.g., "queuing is fair").

  5. **Equally Workable Alternative (The "Arbitrariness" Criterion)**  
     - **Why last?** This distinguishes conventions from functional necessities.  
     - **Coffee-machine:** Queuing right/keeping left clear would work *equally well*.  
     - **Ask:** "Could a mirror-image pattern solve the problem? Why did left win?"  
     - **Preempt misunderstanding:** "Equally workable" ≠ identical. Queuing left vs. right are *alternatives*, not upgrades (unlike a faster coffee machine).

  ---

  ### **Why the Coffee-Machine Case Works (and How to Use It)**
  - **Fitness for role:**  
    - ✅ Embodies all 5 Lewis criteria.  
    - ✅ Familiar, non-moralized, and evolved spontaneously.  
    - ✅ Alternatives are intuitive (left vs. right).  
  - **Limitations to address:**  
    - ⚠️ *Not all conventions solve physical crowding:* Distinguish later (e.g., linguistic conventions).  
    - ⚠️ *Small scale vs. societal norms:* Note that scale doesn’t change the logic, but may weaken common knowledge.  
  - **How to deploy:**  
    - Return to the case at each conceptual step (above).  
    - End with: "Is this a Lewis convention? Walk me through the 5 criteria."

  ---

  ### **Predictable Misunderstandings & Preemption Strategies**
  | **Stage**          | **Misunderstanding**                          | **How to Preempt**                                                                 |
  |---------------------|-----------------------------------------------|------------------------------------------------------------------------------------|
  | Coordination        | "Any habit solves a problem."                 | Contrast with non-coordination habits (e.g., morning routines).                    |
  | Regularity          | "All widespread behaviors are conventions."   | Show regularities without interdependence (e.g., regional accents).                |
  | Expectations        | "Knowing others do X = mutual expectation."   | Ask: "Do you brush your teeth because you expect others to?" → Highlight conditionality. |
  | Conditional Willingness | "Conformity is always preference-based."    | Contrast with enforced rules (e.g., "Queue or be fired").                          |
  | Alternatives        | "If it works, it’s not arbitrary."            | Ask: "Would a right-side queue work? Why is left *better*?" → Stress functional equivalence. |
  | **General**         | "Convention = tacit agreement."               | Point out: No negotiation occurred; it emerged.                                    |
  | **General**         | "Evolution = biological."                     | Clarify: "Cultural evolution = stable solutions to recurrent problems."            |

  ---

  ### **Assessing Comprehension: The "Test" Vignette**
  - **Pose a new case:** Driving on the left/right side of the road.  
    - *Ask:* "Is this a Lewis convention? Why?"  
    - **Correct grasp:**  
      ✅ Coordination problem (avoid crashes).  
      ✅ Regularity (e.g., all drive right).  
      ✅ Expectations (I drive right because I expect you to).  
      ✅ Conditional preference (I’d drive left if others did).  
      ✅ Alternative (driving left works equally well).  
    - **Missteps to flag:**  
      ❌ "It’s a law, not convention!" → *Reply:* "But why did the law emerge? What if laws vanished?"  
      ❌ "It’s necessary for safety!" → *Reply:* "Is left inherently safer than right?"  

  ---

  ### **Formal Refinements to Bracket (With Caveats)**
  1. **Common Knowledge:**  
     - *Bracket:* Lewis’s infinite regress ("I know that you know that I know...").  
     - *Caveat:* "We’re simplifying to ‘mutual expectations’—Lewis adds precision we’ll skip."  
  2. **Indifference Between Alternatives:**  
     - *Bracket:* Strict preference parity.  
     - *Caveat:* "Alternatives need only be *sufficiently good*, not perfectly equal."  
  3. **Game-Theoretic Payoffs:**  
     - *Bracket:* Matrices/payoff structures.  
     - *Caveat:* "Lewis uses game theory, but we’re focusing on intuitive logic."

  ---

  ### **Pedagogical Principles**
  - **Anchor in their example:** The coffee-machine is their discovery; leverage ownership.  
  - **Socratic questioning:** "What would happen if...?" at each step.  
  - **Counterfactuals:** Test criteria by altering the vignette (e.g., "Suppose a sign enforced queuing left?").  
  - **Interrupt "tacit agreement" talk:** "Did anyone propose this? Did you vote? If not, why call it agreement?"  

  This structure ensures each concept scaffolds the next, uses a single case deeply, and transforms their observed pattern into a tool for theory-building. End by revisiting the coffee-machine: "Now explain why this *is* a convention, but your morning coffee ritual is not."
