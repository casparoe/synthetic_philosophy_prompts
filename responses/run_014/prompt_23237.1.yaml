prompt: |-
  I chair the IRB at a mid-size research university, and we have to decide by Friday whether a 7-member committee votes by simple majority on a contested animal-protocol case or defers to the chair's recommendation as tiebreaker. The chair has been quoting the Condorcet jury theorem at every meeting — the result that if each voter is individually better than a coin flip and votes are independent, the probability the majority is correct rises with group size — and wants us to adopt majority voting on that ground. I don't think the theorem actually licenses the conclusion he's drawing, but I can't quite put my finger on why. Can you draft a short memo for the committee that (a) recommends majority voting or deferral to the chair, (b) engages honestly with the strongest case for the chair's position, and (c) says concretely what the theorem does and doesn't establish for us, with a proposed timeline for the vote?
reasoning: |-
  Okay, the user chairs an IRB at a university and needs to decide by Friday whether to use majority voting or let the chair break ties. The chair keeps citing the Condorcet jury theorem to support majority voting, but the user feels that's not quite right and wants a memo for the committee. 

  First, I need to unpack why the user is skeptical. The chair's argument hinges on the theorem's "better than coin flip" assumption, but real committees aren't idealized probability models. The user's hidden concern might be about group dynamics—like herding or dominance—that the theorem ignores. They're likely worried about rubber-stamping flawed decisions under a veneer of mathematical legitimacy. 

  Hmm, the memo must balance three goals: recommend a position (deferral, in this case), engage charitably with the chair's argument, and demystify the theorem. The user's authority as chair means the tone should be collaborative, not confrontational. Phrases like "shared commitment to rigor" will soften the pushback. 

  For part (c), clarity is key. The theorem *does* show majority accuracy improves with size under strict conditions—but those conditions (independence, equal competence) are unrealistic here. I should highlight concrete gaps: expertise variance (the lab tech vs. ethicist aren't equally informed), deliberation's contaminating effect on independence, and the chair's actual expertise advantage. 

  The proposed timeline tightropes urgency and diligence. "Friday deadline" suggests bureaucratic pressure, so I'll structure steps to validate concerns (e.g., Wednesday deliberation) without rushing. Recommending deferral isn't anti-democratic; it's pragmatic triage for deadlocks when the chair has superior context. 

  ...Wait, should I address the elephant in the room? The chair might be overconfident. But the memo can't imply that. Instead, I'll reframe their stance as "well-intentioned" while noting the theorem's limits. The conclusion emphasizes unity—"collective wisdom" isn't discarded, just supplemented by delegation when needed. 

  Finally, the appendix distills the theorem into bullet points. No jargon. "Coin flip" stays as shorthand because the committee aren't statisticians. Concrete > abstract always.
answer: |-
  ## MEMORANDUM  
  **TO:** Institutional Review Board (IRB) Committee Members  
  **FROM:** [Your Name], IRB Committee Member  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Voting Procedure for Contested Animal Protocol & Condorcet Jury Theorem Clarification  

  ### I. RECOMMENDATION: DEFER TO CHAIR AS TIEBREAKER  
  After careful consideration, I recommend **deferring to the Chair’s recommendation in the event of a tie (3-3 split)**, rather than relying solely on simple majority voting. This approach leverages the Chair’s expertise while preserving the committee’s collective judgment. Majority voting remains valuable for clear decisions (4+ votes), but ties warrant the Chair’s decisive input given their procedural and ethical oversight role.  

  ### II. ENGAGING WITH THE CHAIR’S POSITION  
  The Chair rightly highlights the **Condorcet Jury Theorem (CJT)** as a foundational argument for majority voting. The CJT states that if:  
  1. Each voter has independent judgment,  
  2. Each voter has competence *p* > 0.5 (i.e., better than a coin flip),  
  3. Voters vote sincerely on the same binary question,  
  then the probability of a correct majority decision increases toward 1 as the group size grows.  

  **Strengths of this argument:**  
  - For large, diverse groups with high individual competence, majority voting is statistically robust.  
  - It democratizes decision-making and mitigates individual biases.  
  - If our committee perfectly met the CJT’s assumptions, majority voting would be optimal.  

  ### III. WHAT THE CJT DOES AND DOES NOT ESTABLISH FOR US  
  **What it supports:**  
  The CJT mathematically validates that under *idealized conditions*, larger groups outperform individuals or small subgroups. This supports valuing diverse input.  

  **Why it may not apply here:**  
  1. **Competence (*p* > 0.5) is not uniform or assured:**  
     - CJT assumes all voters have identical *p* > 0.5. In practice, expertise varies significantly across members (e.g., veterinary medicine vs. statistics vs. ethics). If some members *p* < 0.5 (due to knowledge gaps or conflicts), the theorem’s guarantee collapses.  
     - The Chair, as an experienced arbiter, likely has higher *p* than the committee median.  

  2. **Independence is compromised in deliberative bodies:**  
     - CJT requires votes to be statistically independent. Our discussions create social influence, herding, or dominance by vocal members, violating this core assumption.  
     - Pre-meeting communications (e.g., emails) further erode independence.  

  3. **Small groups amplify error:**  
     - With only 7 voters, a single member’s sub-0.5 competence disproportionately impacts outcomes. CJT’s “large group” protection doesn’t yet apply.  
     - Example: If average *p* = 0.6, CJT gives majority accuracy ~71% for *n*=7. If one member’s *p* drops to 0.4, accuracy falls to ~65%.  

  4. **Ties are uniquely vulnerable:**  
     - A 3-3 tie represents maximum uncertainty. CJT offers no guidance here, as majority is undefined. Deferring to the highest-competence member (Chair) is a rational supplement.  

  ### IV. PROPOSED TIMELINE  
  | **Date**       | **Action**                                                |  
  |----------------|----------------------------------------------------------|  
  | **Wed, Oct 25** | Distribute this memo; circulate protocol documents       |  
  | **Thu, Oct 26** | Discuss voting procedure at IRB meeting (30 mins)        |  
  | **Fri, Oct 27** | Final vote on procedure by 12 PM; implement for case vote |  

  ### V. CONCLUSION  
  While the CJT provides a compelling argument for collective wisdom, its assumptions do not fully align with our committee’s context. Deferring to the Chair during ties balances statistical rigor with pragmatic expertise, ensuring decisions are both democratically informed and decisively resolved. I urge the committee to adopt this hybrid model.  

  **APPENDIX:** Condorcet Jury Theorem (Simplified)  
  - *Premise*: Voters independently choose between two options, one "correct."  
  - *If* each voter has >50% chance of being correct (*p* > 0.5),  
  - *Then*: The probability the majority votes correctly:  
    - Increases as group size increases,  
    - Exceeds any single voter’s *p*,  
    - Approaches 100% as voters → ∞.  

  ---  
  Respectfully submitted,  
  [Your Name]  
  IRB Committee Member
