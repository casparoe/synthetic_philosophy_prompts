answer: |-
  Based on your detailed description – the gradual, competitive escalation driven by individual rationality leading to collective detriment, without clear defection and where unilateral restraint is punished – the concept you're grappling with is most precisely captured by a **Race to the Bottom**, particularly when understood within a broader framework of **Positional Competition** and **Escalation Traps**.

  Here's why these terms fit and how they relate to the nuances you've identified:

  1.  **Race to the Bottom:** This is likely the most direct label. It explicitly describes a competitive dynamic where actors, seeking individual advantage within a system (markets, geopolitics, status hierarchies), engage in successive rounds of lowering standards, increasing investment, or taking detrimental actions (lowering environmental regulations, cutting wages, lowering academic publishing standards, increasing engagement algorithms). Each actor feels compelled to do this *because others are doing it*, fearing they will fall behind or lose competitiveness if they don't. Crucially, the "bottom" isn't necessarily absolute ruin, but a collectively suboptimal state significantly worse than a hypothetical cooperative equilibrium. The key elements are:
      *   *Competition as Driver:* The logic stems directly from the competitive structure itself.
      *   *Step-by-Step Escalation:* It happens incrementally, driven by adaptation to the current competitive environment set by others' actions.
      *   *Collective Harm:* The end state is worse for all (or almost all) involved.
      *   *Impossibility of Unilateral Withdrawal:* Stopping first puts you at an immediate disadvantage relative to competitors who continue, making it irrational for any single actor to do so, even if all prefer the higher equilibrium. This distinguishes it from simple PDs where defection *is* the profitable move; here, "defection" (continuing the race) is the *only* rational move *given* the state of the race others have created.
      *   *Degradation:* The competitive process actively degrades the very thing being competed over (e.g., the quality of scholarship, the health of the information environment, genuine athletic performance, natural appearance standards).

  2.  **Positional Competition / Zero-Sum Competition:** This concept, heavily emphasized by thinkers like Fred Hirsch (*Social Limits to Growth*), highlights that the *relative* position of actors matters more than absolute gains. In your examples:
      *   Publishing more papers matters primarily *relative* to what others publish for jobs/grants.
      *   Cosmetic surgery or doping provides an advantage primarily *relative* to those who don't do it.
      *   More engaging algorithms capture attention *relative* to competing platforms.
      *   More advanced weapons provide security *relative* to adversaries' capabilities.
      This positional aspect is crucial. It explains why individual efforts to gain an edge (Action X) are rational, but when everyone does it, the *relative* advantage disappears, leaving only the absolute costs (time, money, degraded quality, increased risk). The competition becomes self-defeating because it seeks relative gains that cancel out at the collective level while incurring real collective costs.

  3.  **Escalation Trap / Commitment Trap:** This emphasizes the dynamic, path-dependent nature of the process. Once the competition starts, each step creates a new baseline. Actors become "trapped" by their previous investments and the expectations of others. Withdrawing becomes increasingly costly, both materially (sunk costs in R&D, infrastructure) and strategically (loss of relative position, credibility). The trap is self-reinforcing: each escalation necessitates further escalation by others, locking everyone into the destructive pattern. Thomas Schelling's work on arms races and conflict dynamics is foundational here.

  **Why this differs from standard Prisoner's Dilemma (PD) or Tragedy of the Commons (ToC):**

  *   **PD:** While sharing the "individually rational/collectively harmful" core, a classic PD is typically static and binary (cooperate/defect). Your examples are dynamic, incremental, and multi-actor. Crucially, in your pattern, there is often *no initial cooperative equilibrium to defect from*. The harmful state arises *through* the competitive process itself. The "defection" analogy doesn't quite fit because continuing the escalation isn't a betrayal of an agreement; it's the *only* rational response within the competitive logic *as it currently exists* due to prior actions by others. The inability to unilaterally stop without severe penalty is more central here than the temptation to cheat on an existing cooperative deal.
  *   **ToC:** ToC focuses on the overuse/depletion of a shared resource due to lack of property rights or regulation (e.g., overfishing). While your examples *can* involve resource degradation (e.g., the "resource" of academic quality or a healthy information environment), the core driver is different. ToC is about subtractability (my use diminishes what's left for you). Your pattern is more about *competitive escalation in standards or investments within a system*, driven by relative positioning and fear of falling behind, degrading the *quality* or *nature* of the activity/outcome itself, not necessarily depleting a finite stock. The logic is "I must do X to keep up/win," not "I must grab the resource before others do."

  **Core Mechanism & Boundaries:**

  The core mechanism is: **A competitive system structured such that actors gain relative advantage through actions (X) that impose absolute costs on themselves and the collective system. When multiple actors engage in X to gain or maintain position, the relative advantages cancel out, leaving only the accumulated absolute costs and a degraded system. The logic of competition makes unilateral restraint irrational, locking all actors into a path of escalating harmful actions.**

  **Boundaries:**

  *   **Requires Competition:** The dynamic relies on actors being in a competitive relationship where relative position matters significantly.
  *   **Requires Negative Externalities:** Action X must impose costs beyond the actor themselves, degrading the shared environment, standards, or object of competition.
  *   **Requires Incremental Escalation & Path Dependence:** It's not a one-shot decision but a process where each step sets a new competitive baseline.
  *   **Requires Punishment for Unilateral Restraint:** If an actor could unilaterally stop X and be better off (or no worse off), even if others continue, it's not this pattern. The first-mover disadvantage is critical.
  *   **Distinguished from Simple "Bad Competition":** Not all harmful competition is this pattern. If competition simply reveals inefficiencies or weeds out weak actors without the systemic degradation and inescapable logic of escalating harmful actions, it's different.

  **Conclusion:**

  Your pattern is best understood as a **Race to the Bottom driven by Positional Competition, resulting in an Escalation Trap.** It's a specific sub-type of collective action problem focused on competitive systems where the pursuit of relative advantage through incremental, costly actions leads to collective deterioration, with no actor able to rationally exit the cycle unilaterally. While adjacent to PD and ToC, its distinctiveness lies in the competitive escalation dynamic, the centrality of relative positioning, the absence of an initial cooperative state to defect from, and the severe penalty for being the first to stop the harmful action. This framework powerfully explains the dynamics you observe in arms races, academic publishing, social media, doping, and cosmetic norms.
