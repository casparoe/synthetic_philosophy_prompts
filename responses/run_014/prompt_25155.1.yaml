  I recall Schelling's work on multi-person prisoner's dilemmas and escalatory dynamics - that seems relevant. Also Hirsch's positional goods concept where relative advantage matters. The ratchet effect metaphor captures the irreversibility aspect too. 

  The academic publishing example is particularly nuanced - it's not just about quantity over quality but how the competition redefines what "enough" is. That connects to Veblen's idea of invidious comparison. The social media case shows how engagement metrics corrupt the information ecosystem - very modern application. 

  For the core mechanism, we should emphasize the feedback loop: individual adaptation to competitive pressure → systemic degradation → new baseline requiring further adaptation. The boundary might be when the competition is about absolute rather than relative gains, or when unilateral action could improve outcomes. 

