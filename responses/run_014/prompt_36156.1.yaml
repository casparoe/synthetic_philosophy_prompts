  A robust account of **Term 4 (Scalability)**. If care ethics can address obligations to strangers without impartialism (e.g., via networked relationality or political care ethics), raising that credence to 0.7 would increase my final credence to 0.49. Noddings’ distinction feels like a concession; Daniel Engster’s institutional approach ("The Heart of Justice") comes closer but still hybridizes.  

