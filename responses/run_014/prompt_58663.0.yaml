prompt: |-
  So my engineer friend has asked me to do a half hour whiteboard thing for his little lunchtime decison club next week on the Ellsberg paradox and ambiguity aversion, they are all smart but none of them have done any philosophy or decision theory and they all think it is just the same as not liking risk. I was chatting with my flatmates about it and we got stuck on why the classic two urns with red and black balls feels so artificial, so I want something more everyday to carry it, maybe to do with freelance work or harvests or hospital rotas, something where the unknown unknowns actually matter.

  Don't explain the paradox to me directly, I kind of get it, plan how I should teach it instead. Tell me what order to introduce things in and why each bit needs the previous bit, what one example I should build the whole session around and what it has to have and what it has to leave out to actually show ambiguity rather than risk or just bad maths, what misconceptions this crowd will predictably bring in or form halfway through and exactly where in the sequence I should head each one off, plus a quick check question at the end that would show me they have got the difference between risk and ambiguity rather than just repeating it back, and what I should openly skip at this level. Please write the whole plan in British English, they will tease me if I turn up with teh American spellings.
reasoning: |-
  Okay, the user wants me to create a lesson plan for teaching the Ellsberg paradox and ambiguity aversion to engineers in a lunchtime decision club. They specifically want an everyday example that feels less artificial than the classic two-urns setup, and they need to address the common misconception that ambiguity aversion is just risk aversion. 

  First, I need to understand the core challenge here. These are smart engineers who think probabilistically but haven't studied decision theory. Their default assumption will be that all uncertainty is quantifiable risk. The classic urn example feels "artificial" to them precisely because in controlled engineering contexts, probabilities are usually known or estimable. So I must find an example where unknown unknowns genuinely exist - where the lack of data isn't just laziness but fundamental unknowability.

  Freelance work hits the mark perfectly. It's relatable (most engineers know contractors), features real ambiguity (project stability, client reliability), and has concrete payoffs. Crucially, it allows showing how ambiguity differs from risk: you could have two gigs with identical estimated payoffs where one has known client volatility (risk) while the other involves a completely new industry (ambiguity). 

  For structure, I'll avoid front-loading theory. Start with their existing "risk-only" framework using a simple freelancer choice (Job A vs Job B with known probabilities), then introduce ambiguity via a third option involving an opaque new platform. The key is making them feel the discomfort of Option C before labeling it as "ambiguity." 

  Biggest pitfalls to preempt: 
  1) The "just calculate it" reflex. Must emphasize that with Option C, any probability assignment is arbitrary - no amount of research helps. 
  2) Confusing ambiguity with high variance. I'll show Option C could have identical variance to Option B but still feel worse.
  3) Assuming ambiguity aversion is irrational. Should validate it as psychologically real before explaining why economists find it problematic.

  The check question is vital. Asking them to design a freelancer's choice that would make ambiguity aversion disappear forces them to identify the core condition: when unknowns become knowable. If they suggest "more market research," they've missed the point; the right answer is finding a scenario where the uncertainty is fundamentally resolvable.

  I'll use British spelling throughout as requested - "programme" not "program," "labour" not "labor." And keep it conversational; these are lunchtime learners, not students. The flatmates' struggle with the urn example tells me this group needs concrete stakes, not balls in jars. Freelancing makes the payoff human: paying rent versus financial ruin, not abstract lottery tickets.
answer: |-
  Here’s a structured 30-minute lesson plan tailored for engineers, using a **freelance work scenario** to ground ambiguity aversion in real-world stakes. Focuses on making "unknown unknowns" visceral and pre-empting key misconceptions.

  **Lesson Title:** *Unknown Unknowns: When "Maybe" Feels Worse Than "Probably"*  
  **Key Jargon Pre-empted:** "Ambiguity" (use "deep uncertainty" until defined), "Risk" (use "known odds" initially).  
  **Core Example:** **A Freelancer’s Choice Between Gigs**  

  ---

  ### **Order & Structure (25 mins teaching + 5 mins Q&A)**  
  **1. Hook: The Freelancer’s Dilemma (3 mins)**  
     - *Set-up:* "You’re a freelance data engineer. Rent’s due, and you need £1k this month. You’ve two offers:  
       **Job A:** Fixed £1k for debugging legacy code (boring, but guaranteed).  
       **Job B:** £2k for a high-risk AI prototype—but you know from past projects **exactly 50% succeed**.  
       Which do you take? Why?"  
     - *Why:* Establishes baseline comfort with **risk** (known probabilities). Engineers will relate to known failure rates. Forces a choice: safety vs. quantifiable risk.  

  **2. Introduce the "Mystery Gig" (Ambiguity) (5 mins)**  
     - *The twist:* "A recruiter calls: **Job C** pays £2k for a cutting-edge quantum computing gig. But it’s a brand-new client, no reviews, no similar projects exist. You have *no data* to estimate success odds. What’s your gut feel: A, B, or C?"  
     - *Poll the room:* Most engineers will prefer B over C. *Ask why:* "Is it just that C feels riskier? What if I told you Job C’s *true* success rate might be 60%?"  
     - *Crucial distinction:* **Risk (Job B)** = Known 50% odds. **Ambiguity (Job C)** = Unknown odds (could be 10% or 90%—no way to tell).  

  **3. Head Off Misconception 1: "Just Do More Research!" (3 mins)**  
     - *Predictable objection:* "But I’d google the client/ask for specs/run tests!"  
     - *Shut it down:* "Assume you’ve done all that. The tech is unpublished, the client’s a stealth startup, no market history. This is **fundamental uncertainty**—no amount of research gives you reliable odds. Like betting on an entirely new type of engine."  
     - *Why here:* Engineers fix problems. Must establish that ambiguity isn’t fixable with effort.  

  **4. Formalise the Paradox (Ellsberg in Freelancer Terms) (7 mins)**  
     - *The choice pair:*  
       **Choice 1:** Pick between Job A (£1k guaranteed) or Job C (£2k, unknown odds).  
       *Most pick A (safety).*  
       **Choice 2:** Pick between Job B (£2k, 50% known odds) or Job C (£2k, unknown odds).  
       *Most pick B (known risk).*  
     - *Reveal the paradox:* "If you avoided Job C because its odds felt 'low', why reject it when Job B’s odds are just 50%? If you thought Job C’s odds were high, you’d have taken it over Job A. This inconsistency is **ambiguity aversion**."  
     - *Visual:* Whiteboard table showing choices. Highlight the logical contradiction.  

  **5. Head Off Misconception 2: "It’s Just High Variance!" (4 mins)**  
     - *Predictable objection:* "Job C feels worse because uncertainty is wider!"  
     - *Counter:* "Imagine Job D: £2k, 50% odds, but payout is all-or-nothing (high variance). Job B pays £1.50 per hour worked (same expected value, lower variance). People still prefer Job B over Job D? Why?"  
     - *Key point:* Ambiguity aversion ≠ variance aversion. It’s **aversion to not knowing the rules of the game**.  

  **6. Why Ambiguity Aversion "Matters" (Beyond Logic) (3 mins)**  
     - *Real stakes:*  
       - Freelancers avoiding innovative fields (sticking to familiar tech).  
       - Hospitals under-staffing for novel diseases (vs. known seasonal flu).  
       - Engineers over-relying on legacy systems despite promising new tools.  
     - *Takeaway:* Avoiding ambiguity stifles innovation + exploits (e.g., predatory contracts).  

  ---

  ### **Check Question (Final 2 mins)**  
  *"Imagine two freelance gigs:  
  - Gig X: Uses a new AI framework. 100 past gigs show 60% success.  
  - Gig Y: Uses a brand-new 'crypto-AI' fusion tech. No past data exists.  
  Both pay the same if successful. Which feels riskier? Why isn’t that the full story?"*  

  **What you want to hear:**  
  - "Gig Y has ambiguity—no data vs. Gig X’s known 60% risk."  
  - *Not* just "Y is riskier" or "Y has higher variance."  

  **If they say:** "Y is riskier because odds could be lower" → **Good!** They’re articulating ambiguity.  
  **If they say:** "Y is riskier because uncertainty is higher" → **Probe:** "Is it the *amount* of uncertainty or the *unknowability*?"  

  ---

  ### **What to Skip**  
  - **Maths of probability intervals:** No ranges or confidence intervals. Keep it binary (known vs. unknown odds).  
  - **Utility functions:** Don’t mention EU vs. max-min. Say "people behave as if ambiguous odds are stacked against them."  
  - **Neuroeconomics:** No brain scans. Stick to observable choices.  
  - **Philosophy of probability:** Don’t debate frequentist vs. Bayesian. Say "no data exists to form any estimate."  

  ---

  ### **Why This Works for Engineers**  
  - **Everyday stakes:** Freelancing (income instability) > urns (abstract). Engineers know tech volatility.  
  - **Pre-empts "solve-it-ism":** Forces acceptance of genuinely unquantifiable uncertainty.  
  - **Logical contradiction:** Engineers hate inconsistency—making the paradox feel "bug-like".  
  - **British touchpoints:** "Rent’s due," "skint," "gigs," "recruiter cold call," "stealth startup".  

  **Tease-proofing:** "Programme" not "program", "labour" not "labor", and casually drop "maths" not "math". If they heckle, lean in: "Right, this is so artificial—*unlike* your last sprint retrospective, Dave?"  

  Focus on the **feeling** of ambiguity—ask them when they’ve held off on a tool/tech because "there’s no playbook". That’s the gut punch.
