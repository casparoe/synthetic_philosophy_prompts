prompt: |-
  I'm a novelist working on a draft about Lena, a 58-year-old architecture critic who signs a really explicit advance directive early in the book. If she gets moderately demented, no antibiotics for something like pneumonia, no tube feeding, no heroic stuff. And she adds a weird extra clause that says even if I seem content and cheerful when demented, ignore that — I saw that coming and I still refuse.

  Writing her has sorta talked me into the strong earlier-self-wins position, like the competent earlier self gets to author the shape of the whole life, and a later happy-but-demented self doesn't get a veto just because she's content in the moment. I definetly find that compelling right now.

  Can you map where I'm exposed? I want the cases and arguements and gut intuitions that should count against that strong precedent view, sorted by how much trouble they realy cause — the ones that would sink it versus the ones that are just embarrassing. Tell me which ones even people who defend the earlier-self view would admit sting, and which they'd just brush off, and whether the view only survives by adding so many qualifications that it stops saying much. And I'm especially curious about Lena's extra clause — does predicting her own future contentment and pre-rejecting it make her case stronger, or does it make it stranger?

  And be straight with me about your own verdict here: where is your reasoning most likely to fail, and what single consideration would most make you flip to the other side?
