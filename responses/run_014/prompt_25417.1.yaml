answer: |-
  This is a brilliant pedagogical challenge, and your instinct to avoid lecturing and prioritize *experiential destabilization* is spot-on. Your understanding of anatta as a "burden-of-proof-shifter" is also insightful. While the Buddhist doctrine is nuanced (more on that later), the activity you envision is achievable and powerful within 90 minutes for a dozen participants.

  Here’s a structured 90-minute activity designed to create that "self-dissolving" experience, followed by a Buddhist mapping debrief:

  **Activity Title:** "The Identity Continuity Conundrum: Where Does the Character (Really) Reside?"

  **Goal:** To experientially demonstrate the difficulty of locating a stable, essential "self" by forcing participants to confront the failure of common criteria (body, memory, consciousness, personality) under pressure in hypothetical scenarios. The debrief maps this frustration onto the five skandhas (without naming them initially).

  **Structure:** Guided Inquiry through Sequential Scenarios + Small Group Discussion + Whole Group Debrief.

  **Materials:** Handouts with the scenarios (one per participant), pens, flip chart/whiteboard for facilitator notes during debrief.

  **Time Breakdown (90 min total):**

  1.  **Introduction & Framing (10 min):**
      *   **Avoid Buddhist Terms:** Frame it purely as a *craft exercise* in exploring identity continuity for character depth. "We often write characters as having a core, unchanging 'self'. Today, we'll play with scenarios designed to stress-test that idea. Our goal is to see what happens to our sense of *who* a character is when we push common assumptions about identity to their limits. This isn't about finding 'right' answers, but noticing *where* and *why* we struggle."
      *   **Set the Stakes:** "Imagine you're writing a pivotal scene involving a profound change for your protagonist. Understanding where their 'selfhood' resides – or doesn't – could radically change how you portray their transformation, motivation, and continuity."
      *   **Instructions:** "You'll work through 3 scenarios individually first. For each, decide: **Is the person at the end the *same* person as the one at the beginning? Why or why not? What criteria are you using to decide?** Jot down your thoughts. Then we'll discuss in small groups before a whole group debrief."

  2.  **Individual Work: The Three Scenarios (15 min):**
      *   Hand out the scenario sheet. Participants work silently.
      *   **Scenario 1: The Gradual Replacement (Targeting *Rupa* - Form & *Vedana* - Feeling)**
          > *Alex is a renowned pianist. Due to a rare condition, Alex's cells are slowly dying. A revolutionary medical procedure replaces Alex's failing cells, one by one, with perfect synthetic replicas over several years. The replicas function identically to biological cells. After 5 years, every single cell in Alex's body is synthetic. Alex looks, feels, sounds, and plays piano exactly the same. Alex has all of the original Alex's memories and personality traits.*
          > *Is this still Alex? Why/why not? What criteria matter most?*
      *   **Scenario 2: The Memory Transfer & Fission (Targeting *Samjna* - Perception, *Samskara* - Mental Formations, *Vijnana* - Consciousness)**
          > *Dr. Chen is a brilliant, compassionate scientist facing terminal illness. She undergoes an experimental procedure: a complete, perfect copy of all her memories, personality traits, skills, and subjective consciousness is transferred into two brand-new, identical synthetic bodies (Body A and Body B). The original Dr. Chen's biological body dies peacefully during the procedure.*
          > *Body A wakes up first. It has all of Dr. Chen's memories up to the moment of transfer, feels like Dr. Chen, and passionately wants to continue her research on curing the disease she just died from.*
          > *Minutes later, Body B wakes up. It *also* has all of Dr. Chen's memories up to the transfer, feels like Dr. Chen, and is equally passionate about continuing the research.*
          > *Are Body A and/or Body B Dr. Chen? Why/why not? What criteria matter most? If both are Dr. Chen, what does that imply about identity?*
      *   **Scenario 3: The Radical Personality Rewrite (Targeting *Samskara* - Mental Formations, *Vijnana* - Consciousness)**
          > *Jamal is known for being fiercely independent, skeptical, and ambitious. After a severe neurological event, Jamal undergoes an experimental treatment. The treatment repairs the damage but also inadvertently "resets" Jamal's core personality. Jamal emerges deeply dependent on loved ones, trusting to a fault, and completely lacking ambition, content with simple routines. Jamal has all of Jamal's pre-event memories but views past ambitions with detached curiosity, as if they belonged to someone else.*
          > *Is this still Jamal? Why/why not? What criteria matter most? Does it matter *how* the change happened (brain damage vs. treatment side-effect)?*

  3.  **Small Group Discussion (20 min):**
      *   Divide into groups of 3-4.
      *   Task: "Share your answers and reasoning for each scenario. Don't try to convince each other, but **listen for points of agreement, disagreement, and especially moments of uncertainty or frustration.** Note down: *Where did defining 'sameness' become difficult or impossible? What criteria kept failing you? What assumptions about identity were challenged?*"

  4.  **Whole Group Harvesting & Facilitated Discussion (20 min):**
      *   **Focus on the Frustration:** Ask groups to report back *not* on their conclusions, but on:
          *   Where did they feel most uncertain? (e.g., "In Scenario 2, deciding between A and B was impossible," "In Scenario 3, the memory/personality clash was jarring")
          *   What criteria did they try to use that kept failing? (List these visibly: Body? Memory? Consciousness? Personality? Feelings? Continuity? Agency? Soul/essence?)
          *   Did any criteria seem reliable? Did anyone feel like *none* were reliable?
          *   Did the "burden of proof" shift? Did it become harder to justify saying "this IS the same person" than saying "this seems mostly the same, but..."?

  5.  **The Buddhist Mapping Debrief (25 min):**
      *   **Introduce the Lens:** "What you just experienced – that profound sense of instability when you try to pin down *what* makes a person fundamentally *them* across change – is remarkably similar to a core insight in Buddhist philosophy called *anatta* (not-self)."
      *   **Avoid Straw Man:** "It's crucial to understand anatta isn't nihilism ('I don't exist!'). It's a critique of the *kind* of self we instinctively believe in: a permanent, unchanging, independent, essential core that owns our experiences. Buddhism argues this kind of self is an illusion because we can't actually find it when we look closely, *exactly as you just did*."
      *   **Map the Skandhas to the Frustration:**
          *   Point to the list of failed criteria generated earlier.
          *   "Buddhism breaks down our experience of 'self' into five constantly changing aggregates (*skandhas*), each of which, when examined, proves unstable and not a suitable basis for a permanent self."
          *   **Rupa (Form/Body):** "Like in Scenario 1 (Gradual Replacement) – if every cell changes, is the body 'you'? If not, where *in* the body is the essential self? If it *is*, how much change is too much? Buddhism: The body is just material form, constantly changing, dependent on conditions (food, environment, age). It can't be a stable 'self'."
          *   **Vedana (Feeling/Sensation):** "We often identify with our feelings ('I *am* angry'). But feelings are fleeting – they arise and pass based on causes (like Scenario 3's brain change). Are *you* the feeling, or does the feeling just happen *to* whatever you are? Buddhism: Feelings are temporary, conditioned phenomena, not the self."
          *   **Samjna (Perception/Recognition):** "We rely on memory and recognition (Scenarios 1 & 2). But memories fade, can be false, or implanted. Dr. Chen's copies *have* the memories, but does that make them *her*? Buddhism: Perception is interpretation, labeling, and memory – all fallible and changing, not a stable self."
          *   **Samskara (Mental Formations/Volitions):** "This includes personality traits, habits, impulses, intentions, beliefs – Jamal's ambition/dependence. Are *you* your personality? What if it radically changes overnight (Scenario 3)? Are *you* your choices? What causes those choices? Buddhism: These are conditioned tendencies, shaped by past actions and present circumstances. They are patterns, not a commander."
          *   **Vijnana (Consciousness/Awareness):** "The hardest one! Is 'awareness itself' the self? But consciousness depends on objects (you see *something*), senses, and brain states. It shifts (waking/dreaming). In Scenario 2, *two* consciousnesses claim to be Dr. Chen. Which one is the 'real' consciousness? Buddhism: Consciousness is a process, a stream of cognizing moments, dependent on other factors. It's not a single, unified, permanent 'self'."
      *   **Re-state the Shift:** "Anatta shifts the burden of proof. After looking closely, the idea of a fixed, essential self becomes the claim that needs justification. The default becomes seeing persons as dynamic, interdependent processes – constantly changing bodies, sensations, perceptions, mental patterns, and moments of consciousness arising and passing based on causes and conditions. *That* is a rich, unstable ground for writing characters!"

  **Why This Works for Your Purpose:**

  1.  **Experiential First:** Participants *feel* the instability before hearing the theory.
  2.  **Scenarios Target Skandhas:** Each scenario implicitly stresses different aggregates, priming the debrief.
  3.  **Focus on Failure:** The activity highlights the *failure* of common criteria, making the Buddhist critique feel like a description of their own experience, not dogma.
  4.  **Shifts Burden of Proof:** The group discussion naturally surfaces how hard it is to *defend* a fixed self, making "process" the more plausible default.
  5.  **Connects to Craft:** Framing it as a craft exercise from the start makes the destabilization relevant. The debrief explicitly connects the frustration to tools for character writing: *"If there's no fixed core, how do you portray motivation, change, continuity? What emerges from the flux of the five aggregates?"*

  **Addressing Your Concerns & Nuances:**

  1.  **Anatta Nuance:** You're right, anatta is subtler than "no self." It's the rejection of *attā* (Pali)/*ātman* (Sanskrit) – a permanent, unchanging, independent, essential self/soul. Buddhism *does* acknowledge conventional, functional identity ("I walk," "Jamal feels sad") based on the interdependent flow of the aggregates. Your activity brilliantly targets the *attā/ātman* concept. The debrief clarifies this nuance: "It's not that nothing exists; it's that what exists isn't the kind of solid, separate, permanent 'self' we instinctively believe in."
  2.  **Is a Parlor Game Valid?** While simplified, these thought experiments are powerful pedagogical tools to expose the intuition of a fixed self and demonstrate its fragility. They align well with the *spirit* of the Buddhist analytical meditation on the skandhas ("Where is the self in this body? In this feeling?"). The key is the debrief connecting the game's friction to the specific Buddhist analysis.
  3.  **90 Minutes & Group Size:** This is tight but achievable with strict timekeeping. A dozen is manageable for small groups (3 groups of 4). The key is keeping the individual work focused and the group discussions task-specific (harvesting confusion, not debating solutions). Facilitator must be firm on timing.
  4.  **Alternatives?** Hume's Bundle Theory is similar. Parfit's work on personal identity (especially fission) is very relevant. However, the Buddhist framework (especially the five skandhas) provides a uniquely rich and structured vocabulary for writers to dissect character *processes*. It offers concrete handles (body, feeling, perception, volition, consciousness) that map directly onto character elements. It's a strong choice for your goal.

  **Key Facilitation Tips:**

  *   **Neutral Stance:** As facilitator, remain genuinely curious. Don't steer towards "no self." Your role is to surface the instability inherent in their own reasoning.
  *   **Embrace Uncertainty:** Reinforce that confusion and lack of consensus are *successes* of the activity. "If you felt certain, the scenario didn't push hard enough!"
  *   **Focus on the "Why":** In discussions, constantly ask "What criteria are you using *here*? Why does that feel essential?" and "What makes that criterion fail *here*?"
  *   **Link to Writing:** Explicitly connect moments in the debrief to character writing: "So if personality traits (Samskara) aren't a fixed core, how might you show a character's motivations evolving? If consciousness (Vijnana) is a stream, how does that affect point-of-view narration?"

  This activity should provide the visceral experience of the "self" dissolving under scrutiny, create genuine puzzlement about identity criteria, and prime your writers to see characters not as fixed entities but as dynamic, contingent processes – perfectly setting up the Buddhist lens as a powerful tool for their craft. Good luck!
