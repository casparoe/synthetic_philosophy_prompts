prompt: |-
  I am the research lead for a small independent production company making a six-part documentary on the Late Bronze Age collapse. Our presenter, a historian with a taste for methodological slogans, has asked us to assess every factual claim in the series using a principle she calls the asymmetry of survival. As she states it, the principle says that for any claim about the distant past the first question is not whether the surviving source could be lying, but what the record would have looked like if the claim were false, and whether that counter-record would have been likely to survive. If the same processes that destroyed the counter-evidence—fire, the recycling of metal, the bias of archives towards royal and administrative centres, the accidents of excavation—would also have destroyed the evidence we do have, then the survival of the claim is weak evidence for it. If the claim's truth would have generated traces in several independent media that ought to have survived, and those traces are absent, then the absence is evidence against. She also insists on distinguishing three kinds of silence: expected silence, surprising silence, and silence manufactured by later selection. At the moment this is a slogan, not a method. I need you to turn it into a procedure my researchers can actually run.

  The procedure will be used dozens of times per episode, under time pressure, by people with good history degrees but no training in formal epistemology or statistics. The stakes are not academic: whatever survives the procedure will be narrated in the presenter's voice, may be clipped and circulated online, and could end up in schools. The procedure has to fit on one side of A4, be expressible as a checklist or a set of tests to run in order, and be usable without any specialist literature to hand. Please state the questions in the order they should be asked, what would count as a sufficient answer to each, where the procedure should stop and return a verdict of unusable or usable only with qualification, and where it must hand the decision to the presenter because the remaining question is one of interpretation or editorial judgement rather than evidence. Be explicit about which steps are genuine tests and which are judgement calls dressed up as procedure, and about what the procedure cannot do. No citations or reading lists, please; I need the method itself.

  Then run the procedure on three claims we expect to face. First, a claim that a particular coastal city in the eastern Mediterranean was sacked by the Sea Peoples around 1200 BC, where the evidence is a destruction layer, a later Greek tradition, and an Egyptian inscription that may or may not refer to the same event. Second, a claim that a royal inscription's account of a victory is substantially inflated, where the evidence is the inscription itself, the absence of any mention of the campaign in the defeated power's own records, and the fact that the inscription was composed decades after the event. Third, a claim that a specific queen led a coalition against an invading army, which the presenter loves because it makes a dramatic opening sequence, but which rests on a single ambiguous text and no independent corroboration. I want to see the procedure give an answer the presenter will not like in at least one of these cases, and I want the write-up to say plainly where the procedure runs out and a human being has to decide.
reasoning: |-
  We are creating a procedure based on the "asymmetry of survival" principle. The goal is to assess the reliability of a historical claim by considering what the record would look like if the claim were false, and whether that counter-record would have survived the same destructive processes that have shaped our actual evidence.

  The procedure should be a step-by-step checklist that can be used quickly by researchers with history degrees but without formal training in epistemology or statistics. It must fit on one side of A4 and be expressed as a set of questions to run in order.

  We will design the procedure to return one of the following verdicts for each claim:
  - **Usable without qualification**: The claim is well-supported by the evidence as per the asymmetry principle.
  - **Usable with qualification**: The claim has some support but there are significant concerns; it can be used but must be presented with caveats.
  - **Unusable**: The claim does not pass the tests and should not be presented as fact.
  - **Hand to presenter**: The remaining questions require interpretation or editorial judgment beyond the scope of the procedure.

  The procedure must also be clear about which steps are objective tests and which are judgment calls.

  ### Steps of the Procedure

  **Step 1: Define the Claim Precisely**
     - What exactly is being claimed? (e.g., "City X was sacked by the Sea Peoples in 1200 BC.")
     - **Sufficient Answer**: A clear, unambiguous statement of the claim. If the claim is vague, the researcher must clarify it until it is specific.
     - **If not sufficient**: Stop and return "Unusable" because the claim is too vague to test.

  **Step 2: Identify the Surviving Evidence**
     - List all the evidence that currently supports the claim. This includes any physical artifacts, texts, inscriptions, traditions, etc.
     - **Sufficient Answer**: A list of the evidence that is directly cited for the claim. If there is no evidence, the claim is unusable.
     - **If no evidence is provided**: Stop and return "Unusable".

  **Step 3: Assess the Expected Traces**
     - If the claim were true, what traces would we expect to find? Consider multiple independent media (e.g., written records, archaeological layers, iconography, traditions).
     - **Sufficient Answer**: A list of expected traces and the media they would be in. This is a judgment call because it requires imagining what would have been generated. The researcher should think about what is typical for the context (e.g., for a military victory, we might expect a victory inscription, enemy records, destruction layers, etc.).
     - **If no traces are expected**: Then the claim might not leave evidence, so the absence of evidence is not a problem. Proceed to Step 4.

  **Step 4: Check for Absence of Expected Traces**
     - Are any of the expected traces (from Step 3) absent? Focus on traces that should have survived if they existed (i.e., in media that typically survive and in contexts that are well-excavated or documented).
     - **Test**: This is a test if the expected traces are known to be in media that typically survive (e.g., stone inscriptions, destruction layers in well-excavated sites). If the expected traces are in media that rarely survive (e.g., perishable materials) then their absence is expected and not a problem.
     - **Sufficient Answer**: If any expected trace is absent and that absence is surprising (i.e., the trace should have survived if it existed), then this is evidence against the claim. If all expected traces are present or their absence is not surprising (because of destructive processes), then proceed to Step 5.

  **Step 5: Construct the Counter-Record**
     - If the claim were false, what would the record look like? What evidence would we expect to have survived?
     - **Judgment Call**: The researcher must imagine the counter-factual scenario and the evidence it would generate. For example, if the claim is that a city was sacked, the counter-record might show no destruction layer, or a peaceful transition.

  **Step 6: Assess Survival of the Counter-Record**
     - Would the counter-record (from Step 5) have been destroyed by the same processes that destroyed other evidence (e.g., fire, recycling, bias, excavation accidents)?
     - **Test**: Compare the counter-record to the actual surviving evidence. If the processes that destroyed evidence would have also destroyed the counter-record, then the actual evidence's survival is weak support. If the counter-record would have survived (but we don't have it), then the actual evidence is stronger.
     - **Sufficient Answer**: If the counter-record would have been destroyed by the same processes, then the survival of the current evidence is weak and the claim must be treated with caution. If the counter-record would have survived (and we don't have it), then the claim is undermined. If the counter-record is exactly what we have, then the claim is false.

  **Step 7: Classify the Silence**
     - If there is a lack of evidence (an absence) that might be expected, classify it as:
       - **Expected silence**: The absence is due to normal destructive processes (e.g., perishable materials).
       - **Surprising silence**: The absence is in a medium that usually survives and the context is well-documented (e.g., no victory inscription in the capital when we have many from that period).
       - **Manufactured silence**: The absence is due to later selection (e.g., a later ruler destroyed records of a predecessor).
     - **Judgment Call**: This step requires historical knowledge of the context and typical preservation.

  **Step 8: Integrate Findings**
     - Combine the results of Steps 4, 6, and 7 to make a verdict:
       - If Step 4 found a surprising absence of expected traces, and Step 6 indicates the counter-record would have survived, then the claim is **Unusable**.
       - If Step 6 shows that the counter-record would have been destroyed, then the claim is **Usable with qualification** (because the evidence is weak but not contradicted).
       - If Step 4 found no surprising absences and Step 6 shows the counter-record would not have survived, then the claim is **Usable without qualification**.
       - If there is manufactured silence (Step 7) that complicates the picture, then **Hand to presenter** for interpretation.

  **Step 9: Final Verdict**
     - Based on the integration in Step 8, assign one of the verdicts. Also, if at any step the procedure requires a judgment that cannot be made without deeper historical interpretation (e.g., assessing typical survival in a specific context), then **Hand to presenter**.

  ### What the Procedure Cannot Do
  - It cannot create evidence where none exists.
  - It cannot resolve ambiguities in the evidence; that requires expert interpretation.
  - It cannot account for every possible destructive process; it relies on the researcher's general knowledge.

  ### Applying the Procedure to the Three Claims

  #### Claim 1: A coastal city was sacked by the Sea Peoples around 1200 BC.
     - **Evidence**: Destruction layer, later Greek tradition, Egyptian inscription (may or may not refer to the event).

     **Step 1: Define the Claim**
     - Claim: City X was sacked by the Sea Peoples in 1200 BC.

     **Step 2: Identify Surviving Evidence**
     - Destruction layer at the site (archaeological evidence), later Greek tradition (textual), Egyptian inscription (textual).

     **Step 3: Assess Expected Traces**
     - If true, we would expect: destruction layer (which we have), contemporary texts from the city or nearby (e.g., letters, administrative records), possibly enemy records (like the Egyptian inscription, which we have but may not refer to this event), and maybe iconographic evidence (e.g., reliefs showing battles). However, texts from the city might be on perishable materials and not survive.

     **Step 4: Check Absence of Expected Traces**
     - Absence of contemporary texts from the city: This might be expected because they were written on perishable materials and the city was destroyed. So, not a surprising absence.
     - The Egyptian inscription exists but may not refer to this event. We have the destruction layer, so the key expected trace (destruction) is present.

     **Step 5: Construct Counter-Record**
     - If false: no destruction layer (or a destruction layer from a different cause), no Greek tradition about a Sea Peoples sack, and the Egyptian inscription not referring to this city.

     **Step 6: Assess Survival of Counter-Record**
     - The counter-record (no destruction layer) would have survived because destruction layers are durable. But we do have a destruction layer, so the counter-record is not what we have. However, the cause of the destruction is not certain. The counter-record (if the city was not sacked by Sea Peoples) might have left a destruction layer from an earthquake or other cause. The destruction layer would survive regardless, so the presence of a destruction layer does not strongly support the Sea Peoples as the cause.

     **Step 7: Classify Silence**
     - Silence of contemporary texts from the city: expected because of perishable materials and destruction.
     - Silence of other contemporary sources about this specific event: might be expected if the event was not considered exceptional at the time.

     **Step 8: Integrate**
     - The destruction layer is present as expected, but it doesn't prove the agent. The Greek tradition is late and the Egyptian inscription may not refer to the event. The counter-record (a destruction layer from another cause) would have survived the same way. Therefore, the evidence is weak for attributing the destruction to the Sea Peoples.

     **Step 9: Verdict**
     - **Usable with qualification**: We can say the city was destroyed around 1200 BC, but attributing it to the Sea Peoples is not strong. The procedure flags that the same destruction layer could exist even if the claim were false (because destruction layers don't specify the agent). The presenter must decide whether to include the Sea Peoples attribution with caveats.

  #### Claim 2: A royal inscription's account of a victory is substantially inflated.
     - **Evidence**: The inscription itself, absence of mention in the defeated power's records, and the inscription was composed decades after the event.

     **Step 1: Define the Claim**
     - Claim: The victory described in the royal inscription is exaggerated.

     **Step 2: Identify Surviving Evidence**
     - The inscription (which claims victory), absence of any record from the defeated power about this campaign, and the inscription was written decades later.

     **Step 3: Assess Expected Traces**
     - If true (i.e., the victory was inflated), we would expect: the inscription (which we have), and we might expect the defeated power to have records of the event (if it happened) or if it was a minor event, they might not record it. Also, if the victory was real but inflated, we might expect independent records (e.g., from allies) that give a different account.

     **Step 4: Check Absence of Expected Traces**
     - Absence of records from the defeated power: This could be expected if the event was minor or if their records were lost. But if the event was as major as the inscription claims, the defeated power should have recorded it (unless their records were destroyed). So, this absence is potentially surprising.

     **Step 5: Construct Counter-Record**
     - If false (i.e., the victory was not inflated, it was as described): we would expect the inscription (which we have) and records from the defeated power (if they survived) that might confirm the event (even if they downplay the loss) or at least mention it.

     **Step 6: Assess Survival of Counter-Record**
     - The counter-record (records from the defeated power) might have been destroyed by the same processes (e.g., time, destruction of archives). However, if the defeated power was a major state with good record-keeping and we have other records from them for that period, then the absence is surprising and the counter-record would have survived. If we don't have any records from the defeated power for that period, then the absence is expected.

     **Step 7: Classify Silence**
     - The silence (absence of defeated power's records) is **expected** if we know their records for that period are lost. If we have other records from them for that period but no mention of this event, then it is **surprising silence**.

     **Step 8: Integrate**
     - The key is whether we have other records from the defeated power for the relevant period. If we do and this event is not mentioned, that's surprising and supports the claim of inflation. If we don't have any records, the silence is expected and doesn't support the claim. Also, the inscription being composed decades later might indicate it was embellished, but that's not direct evidence.

     **Step 9: Verdict**
     - This depends on the state of the defeated power's archives. If we have other records from them and they don't mention the event, then **Usable without qualification** (the claim is supported). If we don't have their records, then the claim is **Usable with qualification** (because the absence is expected and doesn't prove inflation, but the late composition is suggestive). However, without knowing the state of the archives, we might have to **Hand to presenter** for judgment about the defeated power's record survival.

     In this case, let's assume we know that the defeated power's records for the period are fragmentary and we don't have many. Then the silence is expected and the claim is **Usable with qualification** (because the late composition is a red flag). The presenter must decide.

  #### Claim 3: A specific queen led a coalition against an invading army.
     - **Evidence**: Single ambiguous text, no independent corroboration.

     **Step 1: Define the Claim**
     - Claim: Queen Y led a coalition against an invading army.

     **Step 2: Identify Surviving Evidence**
     - One ambiguous text.

     **Step 3: Assess Expected Traces**
     - If true, we would expect: multiple texts (from the queen's side, from the invaders, from allies), monuments, inscriptions, maybe archaeological evidence (e.g., destruction layers, weapons). Leading a coalition is a major event.

     **Step 4: Check Absence of Expected Traces**
     - Absence of any other texts, monuments, or archaeological evidence is a surprising silence because such an event should have left multiple traces.

     **Step 5: Construct Counter-Record**
     - If false: the text might not exist (or be about something else). We might have no evidence of the event, which is what we have.

     **Step 6: Assess Survival of Counter-Record**
     - The counter-record (no evidence of the event) would have survived because if the event didn't happen, there would be no traces. But we do have one ambiguous text, so the counter-record is not exactly what we have. However, the text might be about something else.

     **Step 7: Classify Silence**
     - The absence of other evidence is **surprising silence** because we would expect multiple traces.

     **Step 8: Integrate**
     - The surprising silence (Step 4) and the fact that the counter-record (no evidence) would have survived (Step 6) without the ambiguous text, but we have one ambiguous text. This is weak evidence. The procedure suggests that the claim is not well-supported.

     **Step 9: Verdict**
     - **Unusable**: The claim relies on a single ambiguous text and the absence of corroborating evidence is surprising. The presenter will not like this because it makes a dramatic opening. But the procedure flags that without more evidence, the claim is too weak.

  ### Summary of Verdicts
     - Claim 1: Usable with qualification (can say destruction but not necessarily by Sea Peoples).
     - Claim 2: Depending on the archives, but likely Usable with qualification (inflation is plausible but not proven).
     - Claim 3: Unusable.

  The procedure runs out when we need to know the state of the defeated power's archives in Claim 2 (Step 7) and that becomes a judgment call for the presenter. In Claim 1, the attribution to Sea Peoples is a judgment call. In Claim 3, the procedure gives a clear "Unusable" which the presenter won't like.

  The procedure is now ready for use.
answer: |-
  ### Asymmetry of Survival Assessment Procedure  
  **Purpose**: To evaluate historical claims by testing whether the survival of evidence is meaningfully asymmetrical to what we'd expect if the claim were false. Use in order—stop early if a verdict is reached.  

  ---

  #### **Step-by-Step Checklist**  
  1. **Define the Claim Precisely**  
     - *Question*: What is the specific event, action, or state being claimed?  
     - *Sufficient Answer*: A clear, unambiguous statement (e.g., "City X was sacked in 1200 BC by Group Y").  
     - *Stop if*: Claim is vague (e.g., "may have been attacked") → **Unusable**.  

  2. **List All Surviving Evidence**  
     - *Question*: What direct evidence supports the claim? Include sources (texts, artifacts, traditions) and their medium (e.g., clay tablet, destruction layer).  
     - *Sufficient Answer*: Explicit list (e.g., "Egyptian inscription, destruction layer, Greek tradition").  
     - *Stop if*: No evidence → **Unusable**.  

  3. **Identify Expected Traces** (Judgment Call)  
     - *Question*: If the claim were true, what evidence *should* exist? Consider:  
       - Multiple independent media (e.g., texts, archaeology, iconography).  
       - Context (e.g., royal events → inscriptions; battles → destruction layers).  
     - *Sufficient Answer*: 1–3 plausible traces in distinct media (e.g., "victory monument, enemy records, mass graves").  
     - *Hand to Presenter if*: Traces are unclear (e.g., "would oral tradition survive?").  

  4. **Test for Surprising Absence**  
     - *Question*: Are any expected traces (Step 3) missing?  
     - *Test Criteria*:  
       - **Expected Silence**: Absence due to normal destruction (e.g., perishable materials).  
       - **Surprising Silence**: Absence in durable media (e.g., stone inscriptions) or well-preserved contexts.  
       - **Manufactured Silence**: Absence suggests deliberate suppression (e.g., erasure by successors).  
     - *Sufficient Answer*: Classify absences using the above categories.  
     - *Stop if*: **Surprising Silence** → **Unusable** (evidence against claim).  
     - *Hand to Presenter if*: **Manufactured Silence** (requires interpretation of intent).  

  5. **Simulate the Counter-Record** (Judgment Call)  
     - *Question*: If the claim were *false*, what evidence would we expect?  
     - *Sufficient Answer*: Describe 1–2 plausible counter-traces (e.g., "no destruction layer if unsacked").  

  6. **Test Survival Asymmetry**  
     - *Question*: Would the counter-record (Step 5) have been destroyed by the same processes that preserved our evidence?  
     - *Test Criteria*:  
       - If **yes** (e.g., fire destroys both pro- and counter-evidence) → Survival of evidence is weak support.  
       - If **no** (e.g., counter-evidence in stone should survive) → Absence undermines the claim.  
     - *Sufficient Answer*: "Yes/no" with reason (e.g., "recycling would destroy metal counter-evidence").  
     - *Verdict*:  
       - Asymmetry absent (counter-record destroyed like evidence) → **Usable with qualification** (weak support).  
       - Asymmetry present (counter-record should survive but doesn’t) → **Unusable** (strong evidence against).  

  7. **Final Integration**  
     - *Combine Results*:  
       - No surprising absence (Step 4) + asymmetry absent (Step 6) → **Usable without qualification**.  
       - Surprising absence (Step 4) or asymmetry present (Step 6) → **Unusable**.  
       - Only expected/manufactured silence → **Usable with qualification** (caution needed).  
     - *Hand to Presenter if*: Ambiguity in evidence (e.g., "does this inscription refer to that event?").  

  ---

  #### **What the Procedure Cannot Do**  
  - Resolve ambiguous evidence (e.g., interpreting a damaged text).  
  - Account for undiscovered/lost evidence (assesses only known record).  
  - Replace context expertise (judgment calls rely on researcher’s historical knowledge).  

  ---

  ### **Application to Example Claims**  
  #### **Claim 1: Coastal city sacked by Sea Peoples (1200 BC)**  
  - **Evidence**: Destruction layer, Greek tradition, Egyptian inscription (possibly referencing event).  
  - **Step 1**: Claim defined: "City X sacked by Sea Peoples c. 1200 BC."  
  - **Step 2**: Evidence listed: Archaeological layer, Greek text (written centuries later), Egyptian text.  
  - **Step 3**: **Expected Traces**: Contemporary texts from City X, enemy records, corroborating destruction layers at nearby sites.  
  - **Step 4**: **Surprising Silence**: No contemporary texts from City X (expected if archives burned). **Expected Silence**: Absence of enemy records (if not preserved).  
  - **Step 5**: **Counter-Record**: No destruction layer (if unsacked), or layer with different cause (e.g., earthquake).  
  - **Step 6**: **Asymmetry Test**: Counter-record (no layer) would survive if true—but we *have* a layer. However, layer alone doesn’t prove *who* sacked it. Asymmetry absent for "sack" but present for "by Sea Peoples" (no direct evidence).  
  - **Step 7**: **Verdict**: **Usable with qualification** for "sack" (layer supports destruction). **Unusable for "by Sea Peoples"**—asymmetry present (Sea Peoples raids should appear in multiple texts, but only one ambiguous inscription exists).  
  - **Presenter Handoff**: Attribution to Sea Peoples requires editorial judgment.  

  #### **Claim 2: Royal victory inscription is inflated**  
  - **Evidence**: The inscription (composed decades later), no mention in defeated power’s records.  
  - **Step 1**: Claim defined: "Inscription exaggerates the scale of the victory."  
  - **Step 2**: Evidence listed: Inscription itself, defeated power’s silence.  
  - **Step 3**: **Expected Traces**: Enemy records of the conflict, independent accounts, archaeological evidence (e.g., battle sites).  
  - **Step 4**: **Surprising Silence**: No mention in defeated power’s records (if archives exist for the period).  
  - **Step 5**: **Counter-Record**: Defeated power’s records describing the event (even if downplayed).  
  - **Step 6**: **Asymmetry Test**: Counter-record should survive if it existed (stone/clay archives), but it’s absent. **Asymmetry present**—undermines claim of a major victory.  
  - **Step 7**: **Verdict**: **Unusable** as stated. Silence is surprising and asymmetry indicates the claim is weak.  
  - **Presenter Handoff**: None—procedure concludes claim is unsupported.  

  #### **Claim 3: Queen led coalition against invaders**  
  - **Evidence**: Single ambiguous text, no corroboration.  
  - **Step 1**: Claim defined: "Queen Y led a military coalition c. 1200 BC."  
  - **Step 2**: Evidence listed: One text (e.g., fragmentary tablet).  
  - **Step 3**: **Expected Traces**: Multiple texts (allies/enemies), monuments, diplomatic letters.  
  - **Step 4**: **Surprising Silence**: No other texts or archaeological evidence (e.g., no statues, no enemy mentions).  
  - **Step 5**: **Counter-Record**: Texts naming other leaders, or no texts at all.  
  - **Step 6**: **Asymmetry Test**: Counter-record (no text) would survive easily, but we have one text. However, asymmetry *present*—coalition leadership should leave multiple traces.  
  - **Step 7**: **Verdict**: **Unusable**. Surprising silence and asymmetry indicate the single source is insufficient.  
  - **Presenter Handoff**: None—procedure rejects the claim.  

  **Outcome**: Claim 3 (queen-led coalition) is rejected—presenter will dislike this. Claim 2 (inflated victory) is also unusable. The procedure halts early for both due to **surprising silence** (Step 4) and **asymmetry** (Step 6). For Claim 1, attribution to Sea Peoples fails, but the destruction event is usable with qualification.
