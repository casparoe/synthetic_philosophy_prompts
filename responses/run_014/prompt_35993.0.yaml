     Group 2 (women):
       Drug X: 2/8 = 25%
       Control: 5/10 = 50%

     Then aggregate:
       Drug X: 6/16 = 37.5%
       Control: 6/12 = 50% -> so overall control is better.

     But in each group, control is at least as good? We want Drug X to be better in each group? 

     We need:

     Group 1 (men):
       Drug X: 4/8 = 50%
       Control: 1/4 = 25% -> Drug X better

     Group 2 (women):
       Drug X: 2/8 = 25%
       Control: 1/4 = 25% -> same? 

     Then aggregate:
       Drug X: 6/16 = 37.5%
       Control: 2/8 = 25% -> now Drug X is better overall? 

     Not working.

     Let me use the numbers from the Berkeley example but for drug:

     Two groups: Group A and Group B.

     Group A (large group, low acceptance rate in control?):

     We want:

     Group A (say, severe):
       Drug X: 30/60 = 50%
       Control: 20/40 = 50% -> same

     Group B (mild):
       Drug X: 90/100 = 90%
       Control: 30/50 = 60% -> Drug X better

     Then aggregate:
       Drug X: 120/160 = 75%
       Control: 50/90 ≈ 55.6% -> Drug X better overall. 

     We need the reversal: we want control to look better overall.

     How about:

     Group A (severe, large sample in control?):
       Drug X: 30/100 = 30%
       Control: 10/20 = 50% -> control better

     Group B (mild, large sample in drug?):
       Drug X: 90/100 = 90%
       Control: 5/10 = 50% -> Drug X better

     Then aggregate:
       Drug X: 120/200 = 60%
       Control: 15/30 = 50% -> Drug X better overall? 

     Still not.

     The trick: the group that has a high success rate (mild) is more likely to be in the control group? 

     Let me reverse the sample sizes:

     Group A (severe) has 200 patients: 
          Drug X: 30/100 = 30% (100 patients)
          Control: 50/100 = 50% (100 patients) -> control better

     Group B (mild) has 100 patients:
          Drug X: 90/100 = 90% (100 patients? but we have only 100 patients in mild? Actually, we need to split the mild group between drug and control)

     How about:

     Group A (severe): 200 patients
          Drug X: 10/100 = 10% (assigned to 100 patients)
          Control: 100/100 = 100% (assigned to 100 patients) -> but 100% is too high.

     Let me try with:

     Group A (severe): 100 patients
          Drug X: 20/50 = 40%
          Control: 30/50 = 60% -> control better

     Group B (mild): 200 patients
          Drug X: 60/100 = 60%
          Control: 20/100 = 20% -> Drug X better

     Now aggregate:
          Drug X: 20+60 = 80 successes out of 150 -> 80/150 ≈ 53.3%
          Control: 30+20 = 50 successes out of 150 -> 50/150 ≈ 33.3%

     So overall Drug X is better, but in the severe group control is better.

     We want the opposite: overall control better, but in each group Drug X better? 

     How about:

     Group A (severe): 100 patients
          Drug X: 30/90 ≈ 33.3% (90 patients)
          Control: 10/10 = 100% (10 patients) -> but that's a very small control group.

     This is tricky.

     Let me use a known example:

     From Julious & Mullee (1994) - A case study of Simpson's paradox in kidney stone treatment:

     Treatment A (open surgery) and Treatment B (percutaneous nephrolithotomy) for kidney stones.

     Small stones:
          Treatment A: 81/87 (93%)
          Treatment B: 234/270 (87%) -> so A better for small stones.

     Large stones:
          Treatment A: 192/263 (73%)
          Treatment B: 55/80 (69%) -> A better for large stones.

     But overall:
          Treatment A: (81+192)=273 out of (87+263)=350 -> 78%
          Treatment B: (234+55)=289 out of (270+80)=350 -> 82.6% -> so B better overall.

     So the reversal: overall B is better, but in each subgroup A is better.

     We can use these numbers:

     For our Drug X (let it be Treatment A) vs Control (Treatment B):

     Aggregate:
          Drug X (A): 273/350 ≈ 78%
          Control (B): 289/350 ≈ 82.6% -> so control (B) is better.

     Subgroup Small stones:
          Drug X (A): 81/87 ≈ 93%
          Control (B): 234/270 ≈ 87% -> Drug X better.

     Subgroup Large stones:
          Drug X (A): 192/263 ≈ 73%
          Control (B): 55/80 ≈ 69% -> Drug X better.

     So we have the paradox.

     But note: the subgroup is by stone size (pre-treatment). So conditioning is appropriate.

     We'll use:

     Aggregate Table:
          |          | Success | Total | Success Rate |
          |----------|---------|-------|--------------|
          | Drug X   | 273     | 350   | 78%          |
          | Control  | 289     | 350   | 82.6%        |

     Handout for Small stones:
          |          | Success | Total | Success Rate |
          |----------|---------|-------|--------------|
          | Drug X   | 81      | 87    | 93%          |
          | Control  | 234     | 270   | 87%          |

     Handout for Large stones:
          |          | Success | Total | Success Rate |
          |----------|---------|-------|--------------|
          | Drug X   | 192     | 263   | 73%          |
          | Control  | 55      | 80    | 69%          |

     However, note that the total for Drug X in small is 87, and in large 263 -> 350. Control: 270+80=350.

     We'll call the subgroups: "Small Stones" and "Large Stones".

     But we are going to have two cases. In the first case, stone size is pre-treatment. In the second case, we want the same numbers but the subgroup variable is post-treatment.

     So we'll keep the same numbers and just change the interpretation.

  **Timeline for the first case (kidney stone treatment):**

  1. **Introduction (5 min):** 
     - The board must decide whether to approve Drug X (which is Treatment A) for kidney stones. 
     - The aggregate data is presented: it shows that the control (Treatment B) has a higher success rate.

  2. **Aggregate Data (5 min):** 
     - Handout 1: Aggregate table (as above).

  3. **Leak of Subgroup Data (15 min):** 
     - Distribute two handouts: one for small stones and one for large stones. 
     - The handouts might be presented as "internal memos" from two different research teams (one focusing on small stones, the other on large stones). 
     - Students will see that in both subgroups, Drug X (Treatment A) is better.

  4. **Discussion and Vote (15 min):** 
     - Allow discussion. The tension: aggregate says control is better, but each subgroup says Drug X is better. 
     - Force a vote: approve or reject Drug X? 
     - The correct answer (for the first case) is to approve because stone size is a pre-treatment variable and we should condition on it. 
     - After the vote, reveal the "outcome": 
          - If they approved Drug X: then the simulated patient population does better (they get points). 
          - If they rejected, then they lose points (because in reality, Drug X is better in each subgroup).

     Scoring: 
          Each student starts with 0 points. 
          If the committee approves the drug (correctly for case 1), each gets +10. 
          If they reject, they get -10 (or 0, but we want stakes).

     But note: we are going to have a second case that reverses the lesson.

  5. **Reveal the Twist (15 min):** 
     - Now present a second case: same disease (kidney stones) but a different drug (Drug Y) and same numbers. But now the subgroup variable is a post-treatment variable: say, "whether the patient developed a fever in the first 24 hours". 
     - In this case, the same tables: 
          Aggregate: Control (Treatment B) has 82.6% vs Drug Y (Treatment A) 78% -> so control is better. 
          Subgroup: 
            - Patients who developed fever: 
                Drug Y: 81/87 ≈ 93% 
                Control: 234/270 ≈ 87% -> Drug Y better in this subgroup.
            - Patients who did not develop fever:
                Drug Y: 192/263 ≈ 73%
                Control: 55/80 ≈ 69% -> Drug Y better in this subgroup.

     - But now, because fever is a post-treatment variable (it happens after treatment and might be caused by it), conditioning on it is inappropriate. The aggregate table is the one that gives the correct causal effect. 
     - So the correct decision is to trust the aggregate and reject Drug Y.

     - Run the same process: 
          Handout 1: Aggregate table (same numbers as before).
          Then leak of subgroups: by fever status (same numbers as small/large stones, but now labeled "fever" and "no fever").
          Then vote.

     - Scoring for second case:
          If they reject Drug Y: +10
          If they approve: -10

     - After the second vote, reveal the outcome and then debrief.

  **Debrief (15 min):**
     - Map the two cases:
          Case 1: Stone size (pre-treatment) -> condition on it -> disaggregate is correct.
          Case 2: Fever (post-treatment) -> do not condition -> aggregate is correct.
     - Explain why: 
          In Case 1, stone size is a confounder: it affects both the treatment assignment and the outcome. Therefore, to get the causal effect, we must condition on it.
          In Case 2, fever is a mediator or a collider? Actually, it's more likely a mediator (treatment might cause fever, and fever might affect outcome) or possibly a collider if we are stratifying by fever (which is a common mistake). But in any case, conditioning on a post-treatment variable can block part of the causal effect of the treatment. We want the total effect, so we should not condition.

     - Formal machinery: 
          Marginal association (aggregate) vs conditional association (subgroups).
          Collapsibility: when is the marginal association equal to the conditional association? Only when the variable we condition on is not a confounder and we are not introducing selection bias (like in the post-treatment case).
          The data alone cannot tell you whether to condition or not. You need causal knowledge (the causal graph).

     - The lesson: Simpson's paradox is resolved by causal knowledge, not by a blanket rule.

  **Predictable Problems:**

  1. **Students freezing on arithmetic:** 
     - They might get confused by the numbers and not see the reversal. 
     - **Solution:** Provide clear tables with success rates already calculated. Also, in the handouts, make the tables very clear and highlight the success rates. Do the math for them.

  2. **Treating it as a gotcha about lying with statistics:** 
     - Some students might think the point is that you can manipulate by aggregating or disaggregating. 
     - **Solution:** In the debrief, emphasize that both tables are mathematically correct. The issue is which one answers the causal question of interest. The paradox is real and requires causal reasoning.

  3. **Time pressure causing rushed decisions:** 
     - The time pressure might lead to superficial decisions. 
     - **Solution:** Allow enough time for discussion. The 15 minutes for subgroup data should be sufficient. Also, you can moderate the discussion to ensure key points are raised.

  4. **Difficulty understanding why the second case is different:** 
     - They might not grasp why conditioning on a post-treatment variable is bad. 
     - **Solution:** In the debrief, draw a causal diagram (on the board) for both cases. For the second case: 
          Treatment -> Fever -> Outcome, and also Treatment -> Outcome (direct). 
          Conditioning on fever (a mediator) would block the indirect path and leave only the direct effect, but we want the total effect (which includes both direct and indirect). 
          Alternatively, if we consider fever as a collider (if both treatment and outcome can cause fever, which is less likely) then conditioning on it would open a backdoor path. 
          But the key is: we are interested in the effect of the treatment on the outcome, and conditioning on a post-treatment variable can distort that.

  **What the classroom staging cannot reproduce:**
     - The actual causal structure of the data-generating process. In the real world, we don't know the causal graph by fiat. We have to use domain knowledge or causal discovery techniques. In the game, we are telling them the causal structure (pre vs post) by fiat. 
     - **How to handle:** Emphasize in the debrief that in practice, we must bring in subject-matter knowledge to decide which variables are confounders and which are mediators. The numbers alone cannot tell us.

  **Logistics:**
     - Total time: 
          5 min intro
          5 min aggregate data (case 1)
          15 min subgroup leak and discussion (case 1)
          15 min vote and reveal outcome (case 1) and then introduce case 2
          5 min aggregate data (case 2)
          10 min subgroup leak and discussion (case 2)
          5 min vote and reveal outcome (case 2)
          15 min debrief

     Total: 75 minutes.

     But note: the vote in case 1 and the transition to case 2 might take a bit more. We can adjust.

     Alternatively, run case 1 and then immediately after the vote and outcome, present case 2 as a "new drug" with the same data structure but different context.

  **Handouts:**
     For case 1:
        Handout 1: Aggregate Data for Drug X (Kidney Stones)
          | Treatment | Success | Total | Success Rate |
          |-----------|---------|-------|--------------|
          | Drug X    | 273     | 350   | 78%          |
          | Control   | 289     | 350   | 82.6%        |

        Handout 2: Subgroup Analysis - Small Stones
          | Treatment | Success | Total | Success Rate |
          |-----------|---------|-------|--------------|
          | Drug X    | 81      | 87    | 93%          |
          | Control   | 234     | 270   | 87%          |

        Handout 3: Subgroup Analysis - Large Stones
          | Treatment | Success | Total | Success Rate |
          |-----------|---------|-------|--------------|
          | Drug X    | 192     | 263   | 73%          |
          | Control   | 55      | 80    | 69%          |

     For case 2 (Drug Y for kidney stones):
        Handout 4: Aggregate Data for Drug Y
          (same as Handout 1, but for Drug Y)

        Handout 5: Subgroup Analysis - Patients with Fever
          (same as Handout 2, but label: "Fever")

        Handout 6: Subgroup Analysis - Patients without Fever
          (same as Handout 3, but label: "No Fever")

  **Note:** The numbers in the handouts for case 2 are identical to case 1, only the subgroup labels change.

  **Debrief Outline:**
     - Recap the two decisions: what did they do in case 1 and case 2?
     - Show that the numbers were identical but the causal context changed the correct decision.
     - Explain:
          In case 1, stone size is a confounder: it affects both treatment assignment (doctors might assign severe cases to the more invasive treatment) and outcome. Therefore, the association in the aggregate is confounded. We condition to remove the confounding.
          In case 2, fever is a post-treatment variable. Conditioning on it would condition on a mediator (if fever is on the causal pathway) or a collider (if both treatment and outcome affect fever). Either way, it biases the estimate of the total effect.
     - Key takeaway: We must use causal knowledge (e.g., from the subject matter or the design) to decide which variables to condition on.

  By the end, students should understand that the resolution of Simpson's paradox depends on causal structure, not just data patterns.
answer: |-
  ### **Simpson's Paradox Drug Approval Game: Classroom Activity**

  #### **Learning Objectives**
  - Challenge the heuristic "always disaggregate data" by exposing students to cases where aggregation vs. conditioning is context-dependent.
  - Highlight that **causal structure** (e.g., pre-treatment vs. post-treatment variables) dictates whether to trust aggregate or subgroup data.
  - Emphasize that data alone cannot resolve Simpson's paradox—external causal knowledge is essential.

  ---

  ### **Game Design: Two Rounds with Identical Data, Opposing Lessons**
  **Setup**: Students act as a 14-member Drug Review Board evaluating a new drug (Drug X). They must decide whether to approve it for a simulated kidney stone patient population. Points represent patient outcomes:  
  - **+10 points** per student if the decision improves population health.  
  - **-10 points** if it worsens health.  
  Total points determine committee performance (e.g., "Excellent," "Poor").  

  **Materials** (print in advance):  
  1. **Handout 1**: Aggregate contingency table (shows harm).  
  2. **Handout 2 & 3**: Subgroup reports (show benefit).  
  3. **Handout 4 & 5**: Identical tables for Round 2 with new context.  
  4. **Voting cards** (Approve/Reject).  

  ---

  ### **Round 1: Pre-Treatment Variable (Stone Size)**  
  *Lesson: Disaggregate! Conditioning is correct.*  
  **Scenario**: Stone size (*pre-treatment confounder*) influences treatment choice and outcome.  
  **Data** (based on real kidney stone study):  

  | **Aggregate Data (Handout 1)** | Success | Total | Success Rate |  
  |-------------------------------|---------|-------|--------------|  
  | Drug X                        | 273     | 350   | 78%          |  
  | Control                       | 289     | 350   | 82.6%        |  
  👉 *Control is better overall!*  

  | **Subgroup: Small Stones (Handout 2)** | Success | Total | Success Rate |  
  |---------------------------------------|---------|-------|--------------|  
  | Drug X                                | 81      | 87    | 93%          |  
  | Control                               | 234     | 270   | 87%          |  

  | **Subgroup: Large Stones (Handout 3)** | Success | Total | Success Rate |  
  |---------------------------------------|---------|-------|--------------|  
  | Drug X                                | 192     | 263   | 73%          |  
  | Control                               | 55      | 80    | 69%          |  
  👉 *Drug X is better in both subgroups!*  

  #### **Timeline (25 minutes)**  
  1. **0–5 min**: Distribute **Handout 1**. Explain: *"The board has 5 minutes to review aggregate data. Drug X appears harmful. Vote: Approve or Reject?"*  
     - *Most will vote REJECT (trusting aggregate)*.  
  2. **5–10 min**: "Leak" **Handouts 2 & 3** as "confidential reports from urology teams." *"New evidence! Re-vote in 10 minutes."*  
     - Students debate: *Why does aggregate mislead? Should we trust subgroups?*  
  3. **10–20 min**: Facilitate discussion. Push key questions:  
     - *"Stone size affects treatment choice—could this explain the reversal?"*  
     - *"If we disaggregate, is Drug X better for all patients?"*  
  4. **20–25 min**: **FINAL VOTE** (students submit cards).  
     - **Reveal outcome**: *"Approving Drug X improves outcomes (correct decision). +10 points!"*  
     - **Why?** Stone size is a pre-treatment confounder. Conditioning resolves confounding.  

  ---

  ### **Round 2: Post-Treatment Variable (Early Fever)**  
  *Lesson: Aggregate! Conditioning is incorrect.*  
  **Scenario**: Fever (*post-treatment outcome*) is affected by Drug X and influences survival.  
  **Data**: *Same numbers as Round 1, but subgroups relabeled*:  
  - **Handout 4**: Aggregate table (identical to Handout 1).  
  - **Handout 5**: "Fever" subgroup (identical to Small Stones).  
  - **Handout 6**: "No Fever" subgroup (identical to Large Stones).  

  #### **Timeline (25 minutes)**  
  1. **25–30 min**: Distribute **Handout 4**. *"New drug (Drug Y) for kidney stones. Same aggregate data. Vote now!"*  
     - *Most will REJECT (same numbers → same decision?)*.  
  2. **30–35 min**: "Leak" **Handouts 5 & 6** as "adverse event reports." *"Re-vote in 10 minutes!"*  
     - Students panic: *"But disaggregation worked last time!"*  
  3. **35–45 min**: Discussion. Ask:  
     - *"Fever occurs AFTER treatment—could conditioning hide Drug Y’s effect?"*  
     - *"Does fever cause death, or is it a side effect?"*  
  4. **45–50 min**: **FINAL VOTE**.  
     - **Reveal outcome**: *"Rejecting Drug Y improves outcomes (correct decision). +10 points!"*  
     - **Why?** Fever is post-treatment. Conditioning blocks the drug’s effect → spurious subgroup benefit.  

  ---

  ### **Debrief (25 minutes)**  
  1. **Map paradox to formal concepts**:  
     - **Marginal vs. conditional association**: Aggregate (marginal) and subgroup (conditional) associations conflict.  
     - **Collapsibility**: Fails here due to non-ignorable confounding (Round 1) and mediator bias (Round 2).  
     - **Data isn’t enough**: Same numbers, opposite decisions. External knowledge (e.g., *timing* of stone size vs. fever) resolves the paradox.  

  2. **Key lesson**:  
     - Simpson’s paradox isn’t about "lying with statistics." It’s about **causal structure**:  
       - **Pre-treatment variables (e.g., stone size)**: Condition to block confounding.  
       - **Post-treatment variables (e.g., fever)**: Do NOT condition—it introduces bias.  
     - Blanket rules ("always disaggregate") fail. Use causal diagrams (draw examples) to decide.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Students freeze on arithmetic**:  
     - **Why**: Percentages mask reversals.  
     - **Fix**: Pre-calculate success rates. Emphasize: *"Focus on the direction of effects, not calculations."*  

  2. **Treating it as a "gotcha"**:  
     - **Why**: Students think the paradox is about manipulation.  
     - **Fix**: Stress that both tables are *mathematically correct*. The conflict arises from causal structure, not deception.  

  3. **Over-indexing on Round 1**:  
     - **Why**: Students force disaggregation in Round 2.  
     - **Fix**: Ask: *"What changed? Stone size was known pre-treatment—is fever?"* Highlight temporal order.  

  4. **Time pressure chaos**:  
     - **Fix**: Use a visible timer. Assign roles: 2 "patient advocates" argue for aggregation, 2 "researchers" push disaggregation.  

  ---

  ### **What the Game Can’t Replicate**  
  - **Real-world uncertainty**: In class, you define variables as pre/post-treatment by fiat. In practice, this requires domain expertise.  
    - **How to bridge the gap**: Post-game, show a **causal diagram** (whiteboard). Stress:  
      > *"Without knowing if Z is pre-treatment or post-treatment, the tables alone can’t tell you what to do. You need theory, experiments, or subject-matter knowledge."*  

  ---

  ### **Instructor Prep Checklist**  
  - **Print**: 6 handouts (aggregate + subgroups ×2 rounds).  
  - **Bring**: Voting cards, timer, whiteboard markers.  
  - **Pre-brief**: *"Today, you’ll see why causal inference is more than math. Stay open—your intuition will be tested!"*  
  - **Post-game**: Share the real kidney stone study (Julius & Mullee, 1994) to underscore authenticity.  

  This game forces students to confront Simpson’s paradox as a **causal puzzle**, not a statistical trick. By making the stakes tangible (points = patient outcomes), it crystallizes why "disaggregate!" fails—and why causality reigns.
