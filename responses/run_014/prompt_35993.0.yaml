prompt: |-
  I teach an upper-level seminar on causality and causal inference for a mixed group of philosophy and statistics students — 14 students, one 75-minute session. Most of them already know Simpson's paradox as the Berkeley-admissions chestnut and think the lesson is "disaggregate your data," and I want an in-class activity that breaks that overcorrection while making them feel the paradox's force for real.

  Design a game in which the students act as a drug-review board deciding, under time pressure, whether to approve a treatment for a simulated patient population. Set it up so that the aggregate data and the disaggregated data point in opposite directions, and give the decision real stakes within the game — points standing for patient outcomes in a simulated population, committee members' scores tied to how the population fares, no actual money. Materials and handouts should be things I can print in advance (contingency tables, subgroup reports that different "stakeholders" circulate at different moments), and you should give me a timeline: when the aggregate table arrives, when the subgroup analyses leak out, when the vote is forced.

  Then build in the twist that carries the real lesson: at the end, reveal a second, structurally identical case — same numbers exactly — in which the partitioning variable is a post-treatment variable rather than a pre-treatment one, so that the correct decision reverses and the aggregation the students had just learned to distrust is the one they should have trusted. The debrief should map specific moments in the game onto the formal machinery (marginal vs. conditional association, collapsibility, why the data alone cannot tell you which partition to condition on), and should make the point that Simpson's paradox is resolved by causal knowledge imported from outside the tables, not by a blanket disaggregation rule.

  Also tell me, concretely: what will predictably go wrong the first time I run this (students treating it as a gotcha about lying with statistics, or just freezing on the arithmetic), how to handle each failure mode, and which feature of the actual paradox no classroom staging can reproduce — what I will have to supply by fiat or lecture, however well the game runs.
reasoning: |-
  We are designing a classroom game to teach Simpson's paradox in a way that challenges the "always disaggregate" heuristic. The game will involve two rounds (two cases) with the same numerical data but different causal structures. In the first case, disaggregation is correct; in the second, aggregation is correct because the partitioning variable is post-treatment.

  **Game Structure:**
  - **Setting:** Students are members of a drug-review board for a simulated patient population. They must decide whether to approve a drug (Drug X) based on data. The population is divided into two subgroups (e.g., by severity of disease, or by a pre-treatment variable in the first case, and by a post-treatment variable in the second).
  - **Stakes:** Points representing patient outcomes. Each student's score (as a committee member) is tied to the outcome of the simulated population. For example, if they make the right decision, they get a high score; if wrong, low. We can also have a "patient outcome" metric that accumulates based on the drug's actual effect.

  **Materials to prepare (printed in advance):**
  1. **Initial Aggregate Data Table:** Shows the overall success rates for Drug X vs. Control.
     - Setup: The aggregate table shows that Drug X is harmful overall (e.g., lower success rate than control).
  2. **Subgroup Data Reports (for two subgroups):** Leaked later, showing that in each subgroup, Drug X is beneficial.
     - Note: The two subgroups must be non-overlapping and cover the entire population (e.g., Group A and Group B).

  **First Case (Pre-treatment variable):**
  - Partitioning variable: A pre-treatment covariate (e.g., disease severity: mild and severe). Conditioning is appropriate.

  **Second Case (Post-treatment variable):**
  - Same numbers, but now the partitioning variable is a post-treatment consequence (e.g., whether the patient experienced an early side effect). Conditioning is inappropriate.

  **Timeline for the first case (Drug X approval for Disease Y):**
  1. **Introduction (5 minutes):** Explain the scenario: 
     - A new drug (Drug X) is being considered for a serious disease. The board has to decide whether to approve it for the entire population. 
     - The decision must be made under time pressure (simulated by a countdown). 
     - They are given the overall (aggregate) data.

  2. **Initial Aggregate Data (5 minutes):** 
     - Handout 1: Aggregate contingency table.
     - Example table (with numbers to create Simpson's paradox):

          |          | Success | Failure | Total | Success Rate |
          |----------|---------|---------|-------|--------------|
          | Drug X   | 30      | 70      | 100   | 30%          |
          | Control  | 20      | 30      | 50    | 40%          |

     - Aggregate shows: Control is better (40% vs 30%).

  3. **Leak of Subgroup Data (15 minutes):**
     - After a few minutes of discussion, "leak" two subgroup reports (Handout 2 and 3) to the committee. 
     - These might be "confidential" reports from two different research teams (or two advocacy groups) that break down the data by disease severity (mild and severe). 
     - Example for two subgroups (same numbers as above, but split):

       **Subgroup Mild:**
       |          | Success | Failure | Total | Success Rate |
       |----------|---------|---------|-------|--------------|
       | Drug X   | 20      | 20      | 40    | 50%          |
       | Control  | 15      | 15      | 30    | 50%          |

       **Subgroup Severe:**
       |          | Success | Failure | Total | Success Rate |
       |----------|---------|---------|-------|--------------|
       | Drug X   | 10      | 50      | 60    | 16.7%        |
       | Control  | 5       | 15      | 20    | 25%          |

     - But note: the above doesn't show the paradox because in both subgroups, control is better. We need to set the numbers so that in each subgroup Drug X is better.

     **Correct Simpson's paradox setup (for the first case):**

     Let's design the numbers so that:
     - Aggregate: Control has higher success rate.
     - In each subgroup, Drug X has higher success rate.

     Example:

     Aggregate:
       |          | Success | Failure | Total | Success Rate |
       |----------|---------|---------|-------|--------------|
       | Drug X   | 90      | 110     | 200   | 45%          |
       | Control  | 60      | 60      | 120   | 50%          |

     Then split into two subgroups (say, by disease severity):

     Subgroup Mild (n=200):
       |          | Success | Failure | Total | Success Rate |
       |----------|---------|---------|-------|--------------|
       | Drug X   | 60      | 60      | 120   | 50%          |
       | Control  | 40      | 40      | 80    | 50%          |

     Subgroup Severe (n=120):
       |          | Success | Failure | Total | Success Rate |
       |----------|---------|---------|-------|--------------|
       | Drug X   | 30      | 50      | 80    | 37.5%        |
       | Control  | 20      | 20      | 40    | 50%          |

     Wait, in the severe group, control is better. This isn't the paradox we want.

     Let me create a classic Simpson reversal:

     We want:
       Aggregate: Drug X worse than control.
       In each subgroup: Drug X better.

     Example from the Berkeley case: 

     But let's make up:

     Overall:
       Drug X: 120 successes out of 200 (60% success rate)
       Control: 60 successes out of 100 (60% success rate) -> same? We want a reversal.

     We need:

     Option:

     Group A (say, large group with high baseline risk):
       Drug X: 80/100 = 80%
       Control: 10/20 = 50%

     Group B (small group with low baseline risk):
       Drug X: 10/20 = 50%
       Control: 40/80 = 50%

     Then aggregate for Drug X: 90/120 = 75%
     Control: 50/100 = 50% -> so Drug X is better overall? 

     We want the opposite.

     Let me try:

     Group A (high risk, large control group, small treatment group?):

     Group A (high risk):
       Drug X: 2/10 = 20%
       Control: 50/100 = 50% -> so control better.

     Group B (low risk):
       Drug X: 98/100 = 98%
       Control: 10/20 = 50% -> Drug X better.

     Now aggregate:
       Drug X: (2+98)=100 successes out of 110 -> 100/110 ≈ 90.9%
       Control: 50+10=60 successes out of 120 -> 60/120=50%

     Wait, that doesn't show the reversal because aggregate shows Drug X is better.

     We want aggregate to show control better and within each group Drug X better? How?

     Classic example:

     Let me use:

     Group 1 (e.g., men):
       Drug X: 4/8 = 50%
