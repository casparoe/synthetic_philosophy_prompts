prompt: |-
  I teach an upper-level seminar in practical rationality, 18 undergraduates, one 75-minute session next Tuesday. We have just finished dominance reasoning in one-shot social dilemmas, and my students can reproduce the argument for defection perfectly while remaining untouched by the rival intuition at the heart of superrationality, namely that when you know the other party is reasoning in exactly the same way from exactly the same instructions, your expectation about what they will do cannot be treated as independent of your own deliberation. A recent hallway conversation with colleagues in economics left me convinced that a lecture will not move them, and I would like them to face a live choice where that symmetry does real work before any label is introduced.

  Design a complete runnable game around a novel case I can present cold, for instance two isolated campus food cooperatives deciding independently whether to pool surplus for a joint weekend market or hold it back for members only, where each group is told in advance that the other group received identical instructions and discussion prompts and knows this symmetry holds. Provide rules, grouping, materials that need no preparation beyond printing, a token-based payoff scheme requiring no money, and a minute-by-minute timeline that fits the session. Participants should first make private predictions and then binding choices, discover the pattern of outcomes, and only afterward hear the name for the reasoning that would have led them to cooperate. Include a debrief that maps specific moments in play onto the conceptual distinction between evidential symmetry and causal independence, a candid account of what will predictably go wrong on a first run and how to recover, and an honest note on which aspect of the view your simulation cannot reproduce and must be supplied by discussion. Take a committed pedagogical stand in the debrief on whether symmetric reasoning genuinely warrants cooperation here, defending that verdict with reasons rather than surveying options for me to choose among. Limit your entire response to at most 750 words.
reasoning: |-
  Okay, the user is teaching an upper-level seminar on practical rationality and needs a classroom activity to help students grasp superrationality. They've covered dominance reasoning in social dilemmas, but students aren't connecting with the intuition that symmetric reasoning should lead to cooperation. 

  Hmm, the key challenge is creating an experiential learning moment where symmetry becomes tangible before introducing terminology. The user explicitly rejects lecturing - they want students to feel the cognitive tension first. 

  The cafeteria surplus scenario seems promising because:
  - It mirrors classic prisoner's dilemma but with relatable context
  - The symmetry instruction ("identical materials given to both groups") forces interdependence
  - Token payouts avoid real money complications

  I notice the user emphasizes strict time constraints (75 mins) and zero prep beyond printing. That means materials must be dead simple - probably just instruction sheets and tokens. 

  Ah, and they want complete honesty about flaws. The big limitation is that real-world cooperatives have ongoing relationships, while this is one-shot. Must flag that in the debrief. 

  For the pedagogical stance... yeah, I'll take a firm position that cooperation is rationally warranted here. The symmetry creates a new logical constraint that dominance reasoning ignores. But must acknowledge reasonable dissent too. 

  Timing is tight. Need to allocate:
  - 5 min setup
  - 10 min prediction/choice
  - 5 min reveal
  - 15 min outcome analysis
  - 25 min debrief
  - 5 min buffer

  The "aha" moment should come when groups see both cooperated despite predicting defection. That dissonance primes them for the superrationality explanation. 

  Biggest risk is groups defecting anyway and "proving" dominance reasoning right. Contingency plan: if that happens, contrast their predictions vs actual choices to show they didn't truly believe others would defect. 

  User's clearly experienced - they know students will resist. The activity forces them to confront that resistance bodily rather than intellectually. Smart pedagogy.
answer: |-
  Here’s a complete runnable game for your seminar, designed to force confrontation with symmetrical reasoning:

  **Game Title:** Surplus Swap  
  **Premise:** Two campus food co-ops (Group A/B) each have 10 surplus meal tokens. Independently, they choose:  
  - **POOL:** Send all 10 tokens to a joint market. If both POOL, each gets 18 tokens back from combined surplus.  
  - **HOLD:** Keep tokens internal. If one HOLDS while the other POOLS, the HOLDER keeps 10 tokens + gets 5 from the other’s pool (total 15). The POOLer gets 0.  
  - If both HOLD, each keeps 10.  

  **Rules & Materials (Print per Group):**  
  - 10 physical tokens (e.g., printed card circles) per group  
  - Instruction sheet: "Your group decides POOL or HOLD. The other co-op received identical instructions. Both groups decide simultaneously. Payoffs are final."  
  - Secret ballot slips: "PREDICT what the other group will do: POOL/HOLD" and "YOUR GROUP’S CHOICE: POOL/HOLD".  
  - Payoff matrix (included on sheet):  

  | **Group A \ Group B** | POOL     | HOLD     |  
  |------------------------|----------|----------|  
  | **POOL**               | 18, 18   | 0, 15    |  
  | **HOLD**               | 15, 0    | 10, 10   |  

  **Grouping:** Split class into 2 groups (A/B). Send to separate corners. Assign one moderator per group to collect ballots/tokens.  

  **Minute-by-Minute Timeline:**  
  **0:00** (5 min): Distribute materials. Read instructions aloud. Emphasize: "The other group has identical info; they know you know this."  
  **0:05** (5 min): Groups privately discuss strategy.  
  **0:10** (3 min): Each student writes PREDICTION and GROUP CHOICE on ballots. Moderators collect ballots/tokens.  
  **0:13** (2 min): Moderators bring choices to you. Announce outcomes publicly (e.g., "Both POOLED! A:18, B:18").  
  **0:15** (15 min): Reveal prediction slips. Display aggregate predictions (e.g., "80% predicted HOLD by others"). Highlight conflict: *They predicted defection yet cooperated?*  
  **0:30** (25 min): **Debrief:**  
  - **Pattern:** Most predict HOLD but choose POOL (if they do). Ask: "Why cooperate if you expected defection?"  
  - **Symmetry Trap:** "You knew the other group faced *identical* reasoning. How could you assume they’d defect while you cooperated? Your deliberation constrained their choice."  
  - **Key Distinction:**  
    - *Causal Independence:* "Dominance says: your choice doesn’t *cause* theirs. True! But..."  
    - *Evidential Symmetry:* "Your rationality *is evidence* for theirs. Choosing POOL is evidence they do too."  
  - **Pedagogical Verdict:** "Cooperating is rational here. Symmetry means ‘I POOL’ only makes sense if they do too. It’s not altruism—it’s consistency. Defecting assumes they’re irrational *despite identical conditions*, violating symmetry."  
  - **Predictable Flaw:** Groups often defect first round (nerves/cynicism). **Recovery:** Rerun with same groups, showing initial outcome. Most switch to POOL once symmetry "clicks."  
  **0:55** (5 min): Name "superrationality," linking it to the moment they felt forced to align choices.  
  **0:60** (15 min reserve): Discuss limitations.  

  **Honest Limitations:**  
  - **No Repeated Interaction:** Real co-ops build trust over time. This one-shot setup can’t replicate that.  
  - **Common Knowledge Depth:** Students may not fully internalize that *both* know symmetry holds. Discuss post-game.  

  **Why Cooperation is Warranted:**  
  Defecting assumes the other group will irrationally ignore symmetry (i.e., they’ll cooperate while you defect). But if both are identically rational, the only consistent solutions are mutual POOL or mutual HOLD. Mutual POOL is Pareto-superior, making it the uniquely rational outcome under symmetry. Dominance fails because it ignores that your choice *reveals* what identical reasoners do.  

  **Materials to Print:**  
  - Group instructions + payoff matrix (x2)  
  - 20 tokens (e.g., cardstock circles)  
  - Ballots (prediction + choice per student)  

  This forces a lived tension: their predictions (HOLD) clash with their symmetric choice (POOL), creating cognitive dissonance that primes conceptual insight.
