prompt: |-
  I teach a first-year seminar, 24 students, 75 minutes, and they've only known each other a few weeks so the social stakes are still weirdly high. This week's theme is whether we can tell if someone arguing against us is playing straight. I don't want a discussion — I want a game they play first and name afterwards.

  The thing I actually want them to feel: in public argument people collapse two seperate questions into one. Is this argument any good? And is this person sincere? Those come apart in both directions — an honest person can argue terribly, and someone playing for keeps can make a genuinely good point. And I think something worse happens once you start motive-hunting: you get worse at reading the argument itself, and the hunt becomes unfalsifiable, because whatever the other person says next gets re-read as further evidence of bad faith, including their denial. I want them inside that loop, ideally once as the hunter and once as the hunted.

  One mechanic I already like, which you can build on or throw out: split the room in half, hand both halves the same set of written arguments, tell one half that every author is sincere and the other half that some fixed number of them are secretly arguing against their own views, then have each half steelman the arguments in writing and compare. My hunch is the suspicious half writes worse steelmen. If that's a bad hunch, say so and give me a better version of the same idea.

  Then I need: full rules and roles, a minute-by-minute timeline, a payoff scheme that costs me nothing (no money, no candy budget — social stakes are fine), a materials list including whatever I have to prep the night before, and a debrief that maps specific moments from the run onto the argument-quality/arguer-sincerity split and onto the unfalsifiability loop.

  Also tell me what will predictably break the first time I run it, including what to do if a student gets genuinely stung at being accused of bad faith, and whether I should keep the debate topics anodyne (parking, campus funding) or let them pick something they actually care about. And be frank about which part of real-world good-faith judgment the game can't reproduce and I'll have to supply myself. It should scale down to 14 if people are absent.
reasoning: |-
  Okay, let me start by unpacking the user's request. They teach a first-year seminar with 24 students, and the theme is about discerning sincerity in arguments. They want a game that helps students experience the separation between argument quality and the arguer's sincerity, and the pitfalls of motive-hunting. 

  First, I need to understand the core goals: students should feel how collapsing sincerity and argument quality leads to problems. The user mentioned an unfalsifiable loop where once you suspect bad faith, everything reinforces that. They also have a mechanic idea with splitting the room and assigning sincerity labels to arguments. Their hunch is that the suspicious group will write worse steelmen.

  I should validate their hunch. Research on confirmation bias and the fundamental attribution error supports this. When people suspect insincerity, they might not engage deeply. But maybe the effect is subtle, so the game needs to highlight it. 

  Next, designing the game. Their mechanic is a good base. Splitting into two groups: one Trusting, one Skeptical. The Skeptical group thinks some arguments are insincere. Using anodyne topics makes sense to avoid emotional reactions. Prep work involves preparing argument cards and steelmanning templates. 

  Timeline is crucial. 75 minutes total. Introduction (10 mins), group work (25 mins), debate prep (10 mins), debate (20 mins), debrief (10 mins). Need buffers for delays. 

  Payoff should use social stakes. Maybe voting on best steelman, public reading, or group applause. Avoid prizes; recognition is enough. 

  Debrief is key. Map moments like how Skeptical groups might list reasons for insincerity instead of steelmanning. Highlight the unfalsifiable loop when a "suspect" denies bad faith but isn't believed. 

  Predictable breaks: Students might not engage, or the effect isn't visible. Need backup questions. If someone gets stung, have a protocol: pause, validate feelings, redirect to the game's purpose. Anodyne topics are safer to prevent real conflicts. 

  Scalability to 14: Adjust group sizes, maybe three smaller groups with mixed roles. 

  What the game can't capture: Real-world sincerity involves history and non-verbal cues. The game simplifies, so the instructor must mention these factors. 

  Materials: Argument cards, instruction sheets, timers, templates. Prep the night before: choose topics, write arguments, print materials. 

  I think this covers the user's needs. Making sure the game is structured, safe, and drives the lesson home through experience rather than discussion. Anticipating problems and having solutions ready is crucial for a smooth run.
answer: |-
  Here’s a complete game plan designed for your constraints and learning goals, building on your steelmanning mechanic while adding role-play to trap students in the "motive-hunting loop." It’s called **The Sincerity Trap**.

  **Core Insight:**  
  Your hunch is correct—research on the "fundamental attribution error" and "confirmation bias" supports it. Suspicion degrades engagement. This game exaggerates that effect and adds the "loop" via accusations.

  ---

  ### **GAME: THE SINCERITY TRAP**
  **Objective:** Experience how suspicion of bad faith corrupts argument analysis and becomes self-reinforcing.

  #### **MATERIALS & PREP (Night Before)**
  1.  **Argument Cards (Prep 16-20):** 
      *   **Topics:** Use **ANODYNE** issues (campus parking, dining hall hours, library noise rules). *Why:* Prevents emotional escalation while allowing cognitive engagement.
      *   **Content:** Write 16-20 short (1-2 sentence) arguments. Make them deliberately **mediocre** – partially logical but with flaws (e.g., oversimplification, weak evidence). *Example:* "Extending library hours to 2 AM will improve grades because students clearly study better late at night."
      *   **Format:** Print arguments on individual cards/strips of paper. Number them.
  2.  **Role Sheets (Prep 2 types):**
      *   **Trusting Steelmen (T):** *"Your Task: Steelman each argument. Assume every author is sincere and believes their view. Find the strongest possible version of their point, even if the written argument is weak. Focus ONLY on the argument's logic and potential merits."*
      *   **Suspicious Steelmen (S):** *"Your Task: Steelman each argument. However, you KNOW that **AT LEAST 4** of these authors are arguing *against* their own true beliefs (they are insincere). Try to steelman anyway. Note: You won't know WHICH 4 are insincere."*
  3.  **Debate Role Cards (Prep 4-6):** Simple cards: "ACCUSER" or "ACCUSED".
  4.  **Steelman Worksheet (Prep 1 per student):** Template with columns: *Argument # | Original Argument | My Steelmanned Version*.
  5.  **Timer:** Visible to all.
  6.  **Whiteboard/Post-It Notes:** For debrief mapping.

  #### **RULES & ROLES**
  *   **Phase 1: Steelmanning (25 mins)**
      *   Split class into **Group T (Trusting)** and **Group S (Suspicious)**. Aim for ~12 each (scales down easily).
      *   Give each group the *identical* set of Argument Cards and their specific Role Sheet (T or S).
      *   Give every student a Steelman Worksheet.
      *   **Task:** Groups work *together* to discuss and individually write a steelmanned version for each argument on their worksheet. Circulate to ensure they follow their role. *Group S will struggle/focus on "fakeness."*
  *   **Phase 2: Accusation Engine (20 mins)**
      *   **Pair Up:** Each student pairs with someone from the *other* group (T with S).
      *   **Assign Debate Roles (Secretly):** Randomly give one in each pair an "ACCUSER" card, the other an "ACCUSED" card. *They DO NOT reveal these roles yet.*
      *   **Prep (5 mins):** Pairs pick *ONE* argument they *both* steelmanned. Each student privately preps to:
          *   **ACCUSER:** Explain *why* you suspect the AUTHOR of the *original argument* might be arguing in bad faith (based on flaws, wording, your S group role). *Do NOT accuse your partner yet.*
          *   **ACCUSED:** Prepare to DEFEND the sincerity of the AUTHOR of the original argument. *You are NOT defending the argument's quality, just the author's possible honesty.*
      *   **The Trap (15 mins):**
          1.  Partner A (doesn't matter who starts) presents their **steelmanned version** of the chosen argument. (1 min)
          2.  Partner B presents their **steelmanned version**. (1 min)
          3.  Partner A shares their *thoughts on the **author's sincerity*** (drawing from their T or S group experience). (2 mins)
          4.  **THE REVEAL & LOOP:** Partner B **reveals their "ACCUSER" or "ACCUSED" card.**
              *   **If B is ACCUSER:** They now formally accuse Partner A *of being insincere themselves* in their analysis/presentation ("You only gave a weak steelman because you don't care!" or "You sound like you agree with this bad argument!"). A must respond.
              *   **If B is ACCUSED:** Partner A *now* formally accuses the *author* (not B) of bad faith. B must defend the author's sincerity. A pushes back.
          5.  **LOOPING:** The Accuser must reinterpret the Accused's next response (denial, defense, explanation) as *further proof* of insincerity (either the author's or the partner's). (3-4 mins per pair total debate). *This feels awkward and frustrating by design.*
  *   **Phase 3: Cross-Group Comparison (10 mins)**
      *   Regroup as T and S. Each group selects **2-3 example arguments** where they noticed the *biggest difference* in how T vs S approached the steelman.
      *   Volunteers share an original argument, then a T steelman, then an S steelman. Discuss differences briefly.

  #### **PAYOFF SCHEME (Social Stakes)**
  *   **"Most Convincing Steelman" (Phase 1):** Each group nominates 1-2 "best" steelmans (based on effort/logic, not agreement). Read aloud. Applause/recognition.
  *   **"Most Meta Moment" (Phase 2):** Ask pairs to share the *weirdest* or *most frustrating* part of the accusation loop. Recognition for insightful sharing.
  *   **Debrief is the real payoff:** Understanding the trap is the win.

  #### **MINUTE-BY-MINUTE TIMELINE (75 min total)**
  *   **0-5 min:** Intro & Set-up. Explain *only* Phase 1 rules & roles (T & S). Distribute materials. *Do NOT reveal Phases 2/3 or the core lesson yet.*
  *   **5-30 min:** **PHASE 1 - Steelmanning.** Groups work. (25 min)
  *   **30-35 min:** Transition. Collect argument cards. Explain Phase 2 pairing and *prep* task (analyze author sincerity for one argument). Hand out secret Accuser/Accused cards. (5 min)
  *   **35-55 min:** **PHASE 2 - Accusation Engine.** Pairs do steps 1-5 (20 min). *Crucially:* Keep time strictly. Use audible timer for steps.
  *   **55-60 min:** Transition. Regroup into T & S. Explain Phase 3 task (find contrasting examples). (5 min)
  *   **60-70 min:** **PHASE 3 - Cross-Group Comparison & Start Debrief.** Share examples. (10 min)
  *   **70-75 min:** **CORE DEBRIEF.** (5 min start, continue if needed)

  #### **DEBRIEF (Map the Experience to Theory)**
  **Use the whiteboard: Draw two circles: "Argument Quality" and "Arguer Sincerity". Draw arrows between them labeled "We confuse these".**

  1.  **Phase 1 Experience (Suspicion Corrupts Analysis):**
      *   *"Group S, what was harder about steelmanning knowing some authors were 'insincere'?"* (Likely: Focused on finding "fakeness," dismissed weak arguments faster, less creative in finding merit, spent time speculating on motives).
      *   *"Group T, did assuming sincerity help you engage with the argument itself, even if it was bad?"* (Likely: Yes, they worked harder to find merit).
      *   **Map:** "Suspicion (Sincerity Question) made Group S **worse at answering the Argument Quality question** (producing a good steelman)."
  2.  **Phase 2 Experience (The Unfalsifiable Loop):**
      *   *"Accusers, when you made your accusation, how did you interpret your partner's defense/denial? Did it change your mind or confirm your suspicion?"* (Likely: Confirmed suspicion - "Their denial felt defensive!").
      *   *"Accused, how did it feel to be accused (or have your author accused)? Could anything you said actually disprove the bad faith claim to the accuser?"* (Likely: Frustrating, futile. Denial used as evidence).
      *   *"Did anyone feel the loop kick in? Where the response just fed the accusation?"*
      *   **Map:** "Once suspicion starts, it creates a **self-sealing loop**. Motive-hunting becomes **unfalsifiable**. Responses are reinterpreted as *more* evidence, making it impossible to 'prove' sincerity. This kills productive argument."
  3.  **The Core Split:**
      *   *"When have you seen online/real-world debates collapse 'Is this point good?' and 'Is this person honest?' into one messy fight?"*
      *   *"Why is it crucial, but difficult, to separate these questions? How can a terrible argument be sincere? How can a brilliant point come from someone 'playing games'?"*
      *   **Reinforce:** "Sincerity ≠ Good Argument. Insincerity ≠ Bad Argument. Judging the argument requires focusing on the *argument*, not the *arguer*'s imagined motives. Motive-hunting usually backfires."

  #### **PREDICTABLE BREAKS & SOLUTIONS**
  1.  **"Group S Doesn't Engage/Effect is Subtle":**
      *   *Why:* Students might still try hard, or suspicion manifests as disengagement.
      *   *Fix:* Your prompts in debrief are key. Ask S group: *"Did you spend time discussing *which* arguments might be the 'fake' ones? Did that distract from steelmanning?"* Highlight any observed differences in depth or tone.
  2.  **Student Gets Genuinely Stung:**
      *   *Why:* Phase 2 accusations, even role-played, can hit a nerve.
      *   *Fix:*
          *   **Pre-empt:** Before Phase 2, emphasize: *"This is about exploring a dynamic, not personal attacks. You're role-playing reactions to arguments, not judging each other."*
          *   **During:** If a student looks upset, intervene gently: *"Pause. Remember, we're exploring how this *feels* and *works*, not making real judgments. Take a breath. [To class] This friction is exactly the dynamic we're studying."*
          *   **Post-Game:** Check in briefly with the student privately: *"That got intense by design. Are you okay? It was about the game dynamic, not you personally."*
  3.  **Awkward Silence in Pairs:**
      *   *Why:* Role-playing accusations feels unnatural.
      *   *Fix:* Circulate during Phase 2! Model the loop: *"Accuser, if they deny it, say 'That denial sounds rehearsed!' Accused, try 'Why won't you believe I might actually think this?'"* Give sentence starters.
  4.  **Running Short/Long:**
      *   *Buffer:* Phase 3 Comparison is most flexible. Shorten it to 5 mins if needed. If Phase 1 runs long, shorten Phase 2 prep slightly.
  5.  **Skepticism Creep:** Group T might get suspicious despite instructions.
      *   *Why:* The premise is inherently interesting.
      *   *Fix:* Not a major problem! Acknowledge it in debrief: *"Did anyone in Group T start wondering anyway? See how hard it is to suppress that instinct?"*

  #### **WHAT THE GAME CAN'T CAPTURE (You Supply This)**
  *   **Nuance & History:** Real-world judgments of sincerity rely on prior interactions, reputation, body language, tone (absent in text-based Phase 1), and complex context. The game simplifies this into a binary ("sincere" / "insincere").
  *   **Genuine Bad Faith Exists:** The game risks implying bad faith *never* happens. Emphasize: *"Bad faith arguers absolutely exist! The problem is that *assuming* bad faith too quickly, or hunting for motives *instead* of engaging the argument, destroys our ability to think clearly and find truth. It makes us dismiss good points and entrench ourselves."*
  *   **The Burden of Proof:** In real life, the *accuser* often bears the burden of proving bad faith. The game inverts this slightly to create the loop. Mention this asymmetry.

  #### **SCALING DOWN (14 Students)**
  *   **Groups:** Make Group T = 7, Group S = 7.
  *   **Argument Cards:** Use 12-14 cards.
  *   **Phase 2:** Still pair T with S (7 pairs). No other changes needed.

  This design traps students in both sides of the motive-hunting loop, exposes how suspicion degrades analysis, uses social friction effectively (but safely with anodyne topics), and provides concrete moments for your crucial debrief mapping. Good luck!
