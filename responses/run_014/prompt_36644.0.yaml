prompt: |-
  My friend and I spent most of last night arguing about where the line between science and non-science actually falls, and midway through I realized that although I know all of her past verdicts, I cannot predict her on the new cases. Her track record, as best I can reconstruct it: she counts Newtonian gravitation after the Mercury perihelion anomaly as science, even though the anomaly was tolerated for decades before the theory fell; she counts pre-1960s plate tectonics — no mechanism, largely rejected by the establishment of its day — as science; she counts modern macroeconomics, despite its forecasting record, as science; and she refuses to count homeopathy, Freudian psychoanalysis, and intelligent design, in each case on the ground that the theory accommodates any possible outcome and its community never concedes anything. Where we got stuck last night was on three new cases: string theory, which generates no risky empirical predictions but lives inside physics departments under constant, harsh internal criticism; a university parapsychology unit that runs preregistered, methodologically impeccable Ganzfeld replications and faithfully publishes its null results; and a self-taught maverick with no credentials and no research community who issues dated, risky earthquake forecasts and, on the evidence so far, has been right more often than chance would allow. Predict her verdict on each of the three, say which rule she seems to be running — exposure to refutation and refusal to immunize, novel prediction and progressive problem shifts, institutional embeddedness in an organized skeptical community, or something else entirely — note where the rules that fit her record equally well come apart on these cases, and tell me which further case would best discriminate between them. I am less interested in who is right about the demarcation problem than in what her track record commits her to.
reasoning: |-
  Okay, the user is presenting a fascinating demarcation puzzle based on his friend's pattern of judgments. He's clearly thought deeply about this – the examples are carefully chosen to probe boundaries between science/non-science. I notice he's not asking for philosophical truth but for predictive modeling of her implicit criteria. Smart framing.

  First, reconstructing her established pattern:
  - Newtonian gravitation (post-anomaly): counts as science → tolerating anomalies is acceptable if community engages critically
  - Pre-1960s plate tectonics: science despite no mechanism/rejection → lack of consensus/mechanism isn't fatal if predictive framework exists
  - Modern macroeconomics: science despite poor forecasting → empirical weakness tolerated if theoretical structure maintained
  - Homeopathy/Freud/ID: non-science → key rejection due to immunization strategies and dogmatic communities

  Her operational rules seem to be: 
  1) Institutional skepticism: must have active critical community (physics departments for string theory) 
  2) Empirical accountability: must engage with evidence even if weakly predictive (macroeconomics) 
  3) Non-immunization: theories must risk falsification (hence rejecting homeopathy etc.)

  Now the three test cases:
  1) String theory – Strong institutional embeddedness in critical physics community, but near-zero empirical risk. Her tolerance for macroeconomics suggests institutional factors may trump empirical weakness. Prediction: SCIENCE

  2) Ganzfeld parapsychology – Methodologically rigorous and publishes null results, but lacks skeptical community (likely true believers). Parallel to pre-plate tectonics rebels, but key difference is institutional isolation. Her plate tectonics acceptance required eventual community engagement pathway. Prediction: NON-SCIENCE

  3) Earthquake maverick – Makes risky predictions with success, but no community or credentials. This directly challenges whether empirical success alone suffices. Her rejection of isolated "genius" narratives in other domains suggests institutionalization is non-negotiable. Prediction: NON-SCIENCE

  The fault line emerges between:
  - Rule A: Institutional skepticism as necessary/sufficient (fits string theory acceptance)
  - Rule B: Empirical risk-taking as core (favors earthquake predictor)

  Discriminator case: A credentialed geologist making identical earthquake predictions within USGS but facing departmental skepticism. If she accepts this but rejects the lone maverick, institutionalism is her true north star.

  User's meta-cognition is impressive – he's identified precisely where competing philosophical accounts (Lakatos vs. Popper vs. Merton) would diverge in application. His restraint in not demanding "correct" answers shows intellectual maturity. The earthquake predictor case is beautifully designed to force a choice between empirical performance and social structure.
answer: |-
  Based on your friend's track record, her verdicts on the three new cases would likely be:

  1.  **String Theory:** **SCIENCE**  
      *   *Why:* Its deep institutional embeddedness in physics departments under "constant, harsh internal criticism" mirrors the critical scrutiny she values. Like Newtonian gravitation tolerating anomalies or plate tectonics facing initial rejection, string theory operates within a rigorous community actively trying to refute or improve it, despite lacking current empirical predictions. This fits her acceptance of established fields with internal skepticism, even with weaknesses.

  2.  **Parapsychology Unit:** **NON-SCIENCE**  
      *   *Why:* While methodologically sound and publishing null results (showing empirical accountability), the key factor is likely the *lack of a genuinely skeptical community*. Her rejection of homeopathy/Freud/ID hinges on communities that "never concede anything." A parapsychology unit, even rigorous, likely operates within a community biased *towards* belief in psi, not actively seeking to falsify its core tenets. It lacks the institutionalized, organized skepticism she requires. Pre-plate tectonics differed because its advocates *were* actively challenging the establishment within the *same* geological community.

  3.  **Earthquake Maverick:** **NON-SCIENCE**  
      *   *Why:* The complete lack of institutional embeddedness and research community is fatal. Her track record shows she requires a theory to exist within an organized, skeptical community capable of sustained criticism and evaluation, regardless of individual empirical success or predictive risk-taking. The maverick's isolation parallels the dogmatic communities she rejects, even if he's not dogmatic himself – the *structure* for critical discourse and potential concession is absent. Novel predictions alone aren't sufficient without the institutional framework.

  **The Rule She Seems to Be Running:**

  Her primary criterion appears to be **Institutional Embeddedness in an Organized Skeptical Community**. This explains her verdicts:

  *   **Newtonian Gravitation (post-anomaly):** Deeply embedded, critical physics community tolerated anomalies while working on solutions.
  *   **Pre-1960s Plate Tectonics:** Operated within (though opposed by) the geological establishment, engaging its critical mechanisms.
  *   **Modern Macroeconomics:** Embedded within academic economics departments engaged in constant internal debate and criticism.
  *   **Homeopathy/Freud/ID:** Rejected because their communities are seen as dogmatic, refusing to concede core tenets despite evidence/criticism (lack of genuine skepticism).
  *   **String Theory:** Accepted due to its physics department home and harsh internal criticism.
  *   **Parapsychology Unit:** Rejected due to lack of genuine skeptical community (likely operates in an echo chamber).
  *   **Earthquake Maverick:** Rejected due to complete lack of institutional community for critical evaluation.

  **Where Competing Rules Diverge on These Cases:**

  1.  **Exposure to Refutation & Refusal to Immunize (Popperian Falsifiability):**
      *   Fits: Rejects Homeopathy/Freud/ID (immunized), accepts Earthquake Maverick (makes risky predictions).
      *   **Divergence:** *Falsifiability would likely ACCEPT the Earthquake Maverick* (risky predictions) and *REJECT String Theory* (no current risky predictions). Your friend rejects the Maverick and accepts String Theory.

  2.  **Novel Prediction & Progressive Problem Shifts (Lakatosian Methodology):**
      *   Fits: Accepts Newtonian gravitation (progressive phase), Plate Tectonics (eventually progressive), possibly String Theory (if theoretical progress is argued).
      *   **Divergence:** *Lakatos might ACCEPT the Earthquake Maverick* if his predictions are seen as novel and progressive (though "progressive" is hard for a lone actor). He might be more *AMBIVALENT about Parapsychology* – null results could be seen as a degenerating programme, but methodological rigor might buy time. Your friend rejects both the Maverick and Parapsychology decisively based on community structure.

  3.  **Institutional Embeddedness/Skeptical Community (Mertonian Norms/Social Epistemology):**
      *   Fits: **All** of her verdicts. The presence or absence of a functioning, critical institutional community is the consistent factor. Anomalies (Newton), lack of mechanism/rejection (Plate Tectonics), weak forecasting (Macro), lack of predictions (String Theory) are tolerated *if* the institutional community is actively critical. Methodological rigor alone (Parapsychology) or empirical success alone (Maverick) are insufficient *without* that community.

  **The Discriminating Further Case:**

  To definitively distinguish **Institutional Embeddedness** from **Novel Prediction/Progressive Shifts (Lakatos)**, propose:

  *   **"The Isolated Progressive":** A lone researcher, completely outside any academic institution or established research community (no publications, no conferences, no collaborators), develops a novel theory in a field like fundamental physics. They make a series of *dated, highly specific, and novel predictions* over 10 years that are *consistently confirmed* by experiments conducted by mainstream scientists (who were testing other things). The predictions are risky, solve significant outstanding problems, and open new lines of inquiry (progressive). However, the mainstream community largely ignores or dismisses the researcher due to their isolation and lack of credentials/formal publications.

      *   **Institutional Embeddedness Rule (Your Friend):** Would **REJECT** this as non-science. No institutional community exists for critical evaluation, discourse, or potential concession, regardless of predictive success or theoretical progress.
      *   **Lakatosian Rule:** Would **ACCEPT** this as science (or at least a scientific research programme). The core factor is the progressive nature of the predictions and problem shifts, demonstrably leading to novel empirical discoveries, irrespective of the social context or institutional acceptance. The empirical track record *is* the key.

  This case pits the *empirical/theoretical progress* criterion (Lakatos) directly against the *institutional community* criterion. Your friend's track record strongly suggests she would prioritize the community structure, rejecting the "Isolated Progressive" despite their success. Her acceptance of String Theory (theoretical focus, institutional home) and rejection of the Earthquake Maverick (empirical success, no institution) point decisively towards institutional embeddedness as her core demarcation line.
