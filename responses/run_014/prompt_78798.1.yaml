answer: |-
  ## Handout: Dissecting the "Is-Ought Gap" Slogan

  **1. The Menu: Six Precise Readings**

  1.  **Logical Entailment (Non-Circular):** *No purely descriptive ("is") premise set, however large and complex, can logically entail a substantive normative ("ought") conclusion without employing a normative premise or rule.* **Verdict:** Trivial. This is a basic point about deductive logic and the definition of "descriptive." Any valid deduction of an "ought" requires *some* normative input in the premises or inference rules.
  2.  **Semantic Irreducibility:** *The meaning of normative terms ("ought," "good," "right") cannot be fully defined or analyzed using only non-normative, descriptive terms ("is" terms).* **Verdict:** Substantive (and widely accepted, though debated by naturalists). This is the core of Moore's Open Question Argument.
  3.  **Inferential Barrier (Strong):** *There is no valid, non-question-begging inferential rule (e.g., a synthetic bridge principle) that permits deriving a substantive normative ("ought") conclusion solely from descriptive ("is") premises.* **Verdict:** Substantive (The core "Humean" claim). It denies the existence of a universally applicable, contentful bridge principle linking facts to norms.
  4.  **Metaphysical Irreducibility:** *Normative facts, properties, or truths (oughts) are not identical to, constituted by, or reducible to natural facts, properties, or truths (ises) in the world.* **Verdict:** Substantive (A core non-naturalist thesis). This claims normativity is a distinct *kind* of thing in reality.
  5.  **Motivational Internalism (Strong):** *Genuinely accepting a normative judgment (e.g., "I ought to φ") necessarily provides, or is intrinsically linked to, a motivating reason for action for the agent, which no purely descriptive ("is") judgment can do.* **Verdict:** Substantive (A contested thesis about moral psychology).
  6.  **Justificatory Gap (External):** *Descriptive facts ("ises") alone cannot provide ultimate, practice-*external* justification for the norms (*oughts*) of a practice itself. They cannot tell you why you *should* follow the norms of *this* practice rather than another, or none at all.* **Verdict:** Substantive (Often the underlying concern in metaethical debates).

  **2. What Each Reading Would License**

  | Reading # | Name                          | Blocks Evolved Wants → Ought? | Blocks Practice-Internal Ought? | Supports Colleague's Dismissal? |
  | :-------- | :---------------------------- | :---------------------------- | :------------------------------ | :------------------------------ |
  | **1**     | Logical Entailment            | **Yes** (Trivially)           | **No** (Internal norms *are* the normative input) | **No** (Doesn't address internal derivation) |
  | **2**     | Semantic Irreducibility       | **Yes** (If "ought" means irreducible) | **No** (Internal "ought" may have distinct meaning) | **No** (Compatible with internal norms) |
  | **3**     | Inferential Barrier (Strong) | **Yes** (Denies necessary bridge) | **Potentially** (If internal derivation relies on an external bridge) | **Yes** (If he sees internal norm as needing external validation) |
  | **4**     | Metaphysical Irreducibility   | **Yes** (Denies reduction)    | **No** (Internal norms exist as institutional facts) | **No** (Internal norms aren't claimed as fundamental natural facts) |
  | **5**     | Motivational Internalism      | **Maybe** (Depends on link)   | **No** (Irrelevant to internal logic) | **No** (Off-topic for derivation) |
  | **6**     | Justificatory Gap (External)  | **Yes** (For ultimate ought)  | **Yes** (For *ultimate* justification of practice) | **Yes** (If he demands external justification for the practice norms) |

  *   **Key for Student's Project:** Readings 1, 2, 4, and 5 are fully *compatible* with practice-internal oughts. Internal norms provide the necessary normative input (1), have a distinct semantic role (2), exist as institutional entities (4), and their motivational force is a separate issue (5). **The threat comes from Readings 3 and 6.** Reading 3 *might* block internal derivation if the colleague insists the inference *from* "We're playing chess" + "This is a bishop" *to* "You ought to move it diagonally" requires an unjustified external bridge principle. Reading 6 *definitely* blocks the internal norm from being an *ultimate* "ought" – it can't tell you why you *should* play chess or follow *its* rules rather than flipping the board. This is likely what your colleague means by "changing the subject."

  **3. The Naturalistic-Fallacy Detour**

  "Naturalistic fallacy" is often used sloppily as synonymous with the is-ought gap. However, properly understood (following Moore), it primarily denotes **Semantic Irreducibility (Reading #2)**: the mistake of *defining* "good" (or other basic normative terms) using *only* natural properties (e.g., "pleasure," "evolutionary fitness"). It's an error about meaning and definition. While inferring an "ought" from an "is" *could* involve committing the naturalistic fallacy (if one tries to derive "ought" by *defining* it naturalistically), they are distinct concepts:
  *   **Naturalistic Fallacy:** Primarily a claim about **definability/semantics** (Reading #2).
  *   **Is-Ought Gap:** Primarily a claim about **inference/metaphysics** (Readings 1, 3, 4, 6).
  Your colleague likely conflates them, using "naturalistic fallacy" to mean *any* invalid inference from descriptive to normative (Readings 1 & 3), or the demand for external justification (Reading 6).

  **4. Which Reading is Doing the Work**

  Your colleague almost certainly relies on a **blend of Reading #3 (Inferential Barrier - Strong) and Reading #6 (Justificatory Gap - External)**. When he says "changing the subject," he's indicating that the student's internal "ought" fails to address what *he* cares about: an "ought" grounded *outside* and *justifying* the practice itself, derived from purely descriptive facts. He likely sees the inference from practice facts to internal norms as either trivial (because the norm is stipulated, Reading #1) or as implicitly relying on an unjustified bridge principle (Reading #3). **If he genuinely meant the stronger Reading #4 (Metaphysical Irreducibility),** he would have to accept that practice-internal norms *do* exist as a kind of institutional "ought," distinct from fundamental natural facts, but he would still deny they are the morally/ultimately significant "ought" he seeks.

  **5. Confidence and the Soft Spot**

  *   **High Confidence:** The distinctions between the readings are well-founded. Readings 1 & 2 are largely platitudes or widely accepted substantive theses. Readings 4 & 6 are clearly substantive. Reading 5 is separable. The compatibility of Readings 1, 2, 4, and 5 with internal norms is robust. Reading 6 is the primary blocker for the student's "ought" being ultimate.
  *   **Lower Confidence / Soft Spot:** The precise status of **Reading #3 (Inferential Barrier - Strong)** is the trickiest. *Could* the constitutive rules of a practice *themselves* function as a legitimate "bridge principle" *internal* to the practice, making the derivation valid *within that framework* without needing external justification? If so, the student's inference might satisfy a *practice-relative* version of Reading #3, but your colleague would still invoke Reading #6 to dismiss its ultimate significance. Pinpointing the exact force of "internal" derivation against the strong inferential barrier claim remains philosophically delicate.
