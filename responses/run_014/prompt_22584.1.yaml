prompt: |-
  I'm prepping a section of my decision theory seminar on the Pasadena game and I've hit a wall that I cant get past on my own, so I'd really value a second pair of eyes. The setup is the standard Nover and Hájek one: you flip a fair coin until it lands heads, and if that happens on flip n you win 2 to the n divided by n dollars when n is odd and lose that same amount when n is even. When I actually crunch the expected value the straightforward way — (1/2^n) times the payoff, summed over n — I get 1 minus 1/2 plus 1/3 minus 1/4 and so on, which is just the alternating harmonic series, i.e. ln 2, about sixty-nine cents. And that's exactly what's bugging me, because if the expected value is only a bit under a dollar then the whole "paradox" seems to dissolve: sure, I'm not going to pay a fortune to play it, I'd cap my entry fee at a few cents and move on. St. Petersburg is easy to see as a problem since its expected value is literally infinite, but Pasadena just looks like a perfectly ordinary game with a small positive expected value.

  To be fair I'm not oblivious to the fact that the series is conditionally convergent, and I can even see why a mathematician would flag that. But I keep feeling like that's a technical footnote rather than a real threat to the game's value, and I can't quite articulate why my intuition is wrong. I've bounced this off a couple of grad students and they just kept telling me the expected value is "undefined," which didnt help at all, because from where I'm sitting the calculation clearly hands me a number. So I guess my question is: is the "undefined expected value" refrain in the literature an overblown way of noting a convergence subtlety, or is there something I'm actually missing about why that ln 2 isn't the real value of the game?
reasoning: |-
  Okay, let me start by understanding the user's problem. They're teaching a decision theory seminar and focusing on the Pasadena game. The user calculated the expected value as ln(2), around 69 cents, which makes the paradox seem to dissolve. But the literature says the expected value is undefined, and they're confused because their calculation gives a clear number. 

  First, I need to recall why the alternating harmonic series is conditionally convergent. Absolute convergence requires summing the absolute values of terms to converge, but here the absolute values are the harmonic series, which diverges. Conditional convergence means the sum depends on the order of terms. Riemann's rearrangement theorem shows rearranging terms can make the series converge to any real number or diverge. 

  For the Pasadena game, each payoff corresponds to a term in the series. The natural order of n=1,2,3,... gives ln(2). But if we rearrange the terms—say, group positive payoffs first—the partial sums would be larger. For example, taking all positive terms (n odd) first would make the sum go to infinity. Since the game doesn't specify an order, the expected value isn't well-defined. 

  The user's intuition might be that the natural order is logical because it follows the coin flips. But in decision theory, the value should be order-invariant. If rearranging payoffs changes the expected value, it's problematic. The St. Petersburg paradox has infinite expectation, but here it's undefined, which is different. 

  I should explain why conditional convergence is a real issue, not just a technicality. For instance, in the Altadena game, where payoffs are doubled, the expectation becomes divergent. This shows sensitivity to payoff magnitudes. Also, different decision rules (like using the Cauchy product) can yield different values, highlighting the ambiguity. 

  The user mentioned students saying "undefined" without explanation. Emphasizing Riemann's theorem and practical examples like rearranged sums could help. Maybe use a simple analogy: if adding payoffs in different orders changes the result, the game's value isn't fixed. 

  Also, the user might be missing that decision theories require a consistent expected value to apply principles like maximization. If it's undefined, standard decision rules fail. Pointing out real-world implications, like how a casino could structure payment order to exploit this, might clarify the practical significance. 

  In conclusion, the key is that conditional convergence makes the expected value sensitive to the order of summation, which isn't specified in the game setup. Hence, it's truly undefined, and ln(2) is just one possible value depending on the order.
answer: |-
  You've hit on the core tension beautifully, and your intuition that the conditional convergence isn't *just* a technical footnote is spot on—it fundamentally undermines the assignment of *any* single value as "the" expected value, including ln(2). Here's why the literature insists the expected value is undefined, and why ln(2) is not a robust answer:

  1.  **Riemann's Rearrangement Theorem is the Crux:** This theorem states that for a conditionally convergent series (convergent, but not absolutely convergent), the terms can be rearranged to converge to *any* real number, or to diverge to positive/negative infinity, or to oscillate without converging.

  2.  **The Payoffs are the Terms:** In the Pasadena game calculation, the series `Σ [(-1)^{n+1} / n]` arises directly from the payoffs: `(1/2^n) * (±2^n / n) = ±1/n`. Each term `±1/n` corresponds to the *contribution* of the outcome "first head on flip `n`" to the expected value sum.

  3.  **Order Matters Intrinsically:** The standard calculation implicitly assumes summing the contributions in the natural order of `n = 1, 2, 3, 4,...`. This gives ln(2). But what justifies this order? The game itself only defines the probabilities and payoffs for each outcome `n`; it says *nothing* about the *order* in which we must add them up when calculating the expectation.

  4.  **Rearrangement = Reordering the Payoffs:** Riemann's theorem means we can reorder the sequence of outcomes (or rather, the sequence in which we consider their contributions) and get a *different* sum for the series. This isn't just a mathematical trick; it corresponds to grouping or sequencing the potential payoffs differently before summing them. Crucially, *no particular order is dictated by the game description itself*.
      *   **Want an expected value of $100?** Rearrange the terms to sum to 100.
      *   **Want -$1000?** Rearrange to sum to -1000.
      *   **Want infinity?** Sum all the positive contributions (`1/n` for odd `n`) first. This sum diverges to +∞. Then add the negative terms later. The partial sums go to +∞.
      *   **Want -infinity?** Sum all the negative contributions (`-1/n` for even `n`) first. This diverges to -∞. Then add the positive terms. Partial sums go to -∞.
      *   **Want oscillation?** Sum positive terms until the partial sum is >100, then sum negative terms until it's < -100, then positive until >200, etc. The series never converges.

  5.  **Why the Natural Order Isn't Privileged:** Your intuition that following `n=1,2,3,...` is "logical" is understandable – it follows the temporal order of the flips. *However*, the definition of expected value `E[X] = Σ [P(outcome_i) * X(outcome_i)]` only requires summing over *all possible outcomes*. It does not specify an order. The outcomes `n=1, n=2, n=3,...` are mutually exclusive and collectively exhaustive, but they are *unordered* in the sample space. Ordering them by `n` is a choice we make for calculation convenience. Riemann's theorem shows this choice *radically* changes the result.

  6.  **Decision-Theoretic Implications:** This is where the paradox bites. If you believe the value is ln(2) ≈ $0.69, you might be willing to pay up to ~$0.69 to play. But consider:
      *   A casino could, in principle (though perhaps not practically), structure how they *account* for or *present* the potential payoffs in a way that corresponds to a rearrangement favoring large positive sums. Should this change what *you* pay?
      *   More fundamentally, two rational agents could use *different*, equally valid summation orders and arrive at *radically different* valuations of the game (one willing to pay $100, the other demanding $1000 just to *take* it). This violates the idea that expected value provides an objective, unique fair price.
      *   The standard axioms of decision theory (like Savage's or von Neumann-Morgenstern) require the expectation to be well-defined (finite or infinite) for the theory to deliver a unambiguous ranking of choices. An *undefined* expectation means the standard machinery breaks down for this game. You cannot consistently apply "maximize expected utility" here.

  7.  **Contrast with St. Petersburg:** St. Petersburg has infinite expectation unconditionally. Any rearrangement of its positive terms still sums to infinity. The "problem" is the lack of a finite fair price. Pasadena's problem is deeper: it has *no* well-defined expectation at all, finite or infinite. There is *no* consistent fair price.

  8.  **Other Calculations Highlight the Problem:**
      *   **The Altadena Game (Nover & Hájek):** Double all the Pasadena payoffs. The series becomes `Σ [(-1)^{n+1} * 2 / n]`. This series *diverges* (harmonic series magnitude). Yet, intuitively, doubling payoffs should double the value. How can doubling take you from a defined finite value (ln(2)) to an undefined divergent one? This inconsistency vanishes when you recognize *neither* has a defined expectation under summation without a privileged order.
      *   **Cauchy Product / Pairing:** If you try to calculate the expectation by grouping outcomes in pairs `(n=1 & n=2)`, `(n=3 & n=4)`, etc., you get:
          `(P(n=1)Payoff(n=1) + P(n=2)Payoff(n=2)) = (1/2 * 2) + (1/4 * -2) = 1 - 1/2 = 1/2`
          `(P(n=3)Payoff(n=3) + P(n=4)Payoff(n=4)) = (1/8 * 8/3) + (1/16 * -4) = 1/3 - 1/4 = 1/12`
          `(P(n=5)Payoff(n=5) + P(n=6)Payoff(n=6)) = (1/32 * 32/5) + (1/64 * -32/6) = 1/5 - 1/12 = 7/60` (etc.)
          The series of these paired sums is `Σ_{k=1}^∞ [1/(2k-1) - 1/(2k)] = Σ_{k=1}^∞ [1/(2k(2k-1))]`. This series *converges absolutely* to... `(1/2) * ln(2) ≈ $0.345`! A different grouping yields a different finite value. Which grouping is "correct"? The game doesn't say.

  **Conclusion:**

  You are *not* missing something simple. The conditional convergence is the heart of the paradox. **The "undefined expected value" refrain is not overblown.** While summing in the natural order `n=1,2,3,...` gives ln(2), this value is **arbitrary** because the outcome space provides no inherent order for summation. Riemann's rearrangement theorem proves that other equally valid summation orders yield *any* real number, or ±∞, or oscillation. There is no reason to privilege the natural order `n` over any other possible ordering of the outcome contributions.

  Therefore, the expected utility of the Pasadena game is **genuinely undefined**. It doesn't have "a small positive value"; it doesn't have *a* value at all. This is a profound challenge to standard decision theory, as it presents a well-defined gamble where the core tool (expected utility maximization) simply cannot be applied. The paradox lies in this **fundamental indeterminacy**, not in the size of the ln(2) number.

  **How to Present This:**

  1.  Clearly show the natural order sum converging to ln(2). Acknowledge the intuition that this *seems* like the value.
  2.  State emphatically that the series is conditionally convergent. Remind them what that means (converges, but `Σ |Payoff_n| * P(n)` diverges).
  3.  Explain Riemann's Rearrangement Theorem conceptually: "Changing the order of adding up the possible outcomes' contributions changes the total sum dramatically."
  4.  Give clear examples: Rearrangements leading to +∞, -∞, 100, -1000. Emphasize the game description provides no basis for choosing one ordering over another.
  5.  Discuss the Altadena game and the pairing calculation to show inconsistency.
  6.  Hammer home the decision-theoretic consequence: Without a unique expectation, standard EU maximization cannot rank this gamble against others or determine a fair price. *That* is the paradox. It exposes a limitation in the standard framework when faced with conditionally convergent expectations.

  This deep connection between the mathematical property of the series and the foundational indeterminacy of the game's value is what makes the Pasadena game a fascinating and important puzzle in decision theory. Your struggle is precisely what makes it worth teaching!
