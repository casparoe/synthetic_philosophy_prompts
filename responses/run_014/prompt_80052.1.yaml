  I'm in the middle of my epistemology module and I've been assigned a term paper (about 4000 words, one semester) and I need to turn my half formed idea into an actual proposal first. My idea is basically that its been going round in circles for like 140 years, the whole James vs Clifford thing about the ethics of belief, because both of them are using 'evidence' in a way that quietly assumes the evidence is already sitting there, fixed and available, before you form the belief. But I definately think James's real move in 'The Will to Believe' is different from that — in his religious cases, the belief is what makes the evidence available (like the self fulfilling thing where you have to trust the person before they show you they're trustworthy, or you have to be in the relationship before the data shows up). So I want the paper to ask: can there be such a thing as belief dependent evidence, and if so, does Clifford's principle about believing on insufficient evidence even apply to those cases, or is he just talking past James?

  Can you turn this into a proper proposal? I want a precise statement of the question, why the standard 'evidence vs passion' framing of the debate leaves it open (or actually hides it), the approach I'd take to make progress (and why that approach rather than just re-reading the two essays), what a successful result would look like and what would count as the project failing, and an honest sense of whether this is too big for one semester. Don't bother with citations or a reading list, I'll sort those out myself.
