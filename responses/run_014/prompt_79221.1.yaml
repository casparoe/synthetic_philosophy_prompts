answer: |-
  ## Practice Direction No. 4: The Moral Assessment of Historical Conduct
  **Issued by the Office for Temporal Standards under Section 18(2)(c) of the Historical Integrity Act 2011**

  **Commencement:** 1st October 2024

  **1. Preamble**
  The Office for Temporal Standards (hereinafter "the Office"), acting pursuant to its duty under Section 3(1)(a) of the Historical Integrity Act 2011 to safeguard the chronological integrity of historical scholarship and pedagogy, hereby issues this Practice Direction. It addresses the persistent and deleterious tendency within certain sectors of historiography to impose anachronistic moral frameworks upon the conduct of past actors. Such imposition constitutes a Category 3 Temporal Infraction ("Presentist Judgement") under Schedule 2 of the Act. This Direction provides definitive regulatory parameters for the moral assessment of historical conduct within Regulated Scholarly Activities (as defined in Clause 3.1).

  **2. Definitions**
  For the purposes of this Direction:
  *   **"Actor"**: Any individual, group, or institution whose conduct is the subject of historical study or representation.
  *   **"Contemporaneous Standards"**: The normative ethical, legal, and social frameworks pertaining to conduct that were demonstrably operative and enforceable within the specific geographical and temporal locus of the Actor at the time of the conduct under assessment.
  *   **"Enforceable Standard"**: A Contemporaneous Standard that was upheld, applied, or capable of being applied by a recognised authority possessing de facto or de jure power within the relevant jurisdiction and period. This includes, but is not limited to, statutory law, customary law, ecclesiastical decree, royal proclamation, and the rulings of constituted judicial or quasi-judicial bodies.
  *   **"Historically Situated Assessment"**: The mandatory methodology requiring that the moral valence of an Actor's conduct be determined exclusively by comparison with the relevant Contemporaneous Standards.
  *   **"Regulated Scholarly Activity"**: Any activity involving the research, writing, publication, teaching, or public dissemination of historical narratives or analyses intended for present-day audiences, undertaken by persons subject to the Office's jurisdiction.
  *   **"Temporally Displaced Person" (TDP)**: An Actor whose personal ethical framework demonstrably anticipated principles not widely recognised or enforceable within their own Contemporaneous Standards.

  **3. Governing Principle**
  **3.1** In all Regulated Scholarly Activities, Historians **must** employ a Historically Situated Assessment when evaluating the moral dimension of an Actor's conduct.
  **3.2** It is strictly prohibited to assess an Actor's conduct by reference to:
      (a) Ethical, legal, or social standards prevailing in the Historian's own time period; or
      (b) Any hypothetical, aspirational, or non-enforceable ethical principle not constituting a Contemporaneous Standard at the relevant time and place.

  **4. Determination of Contemporaneous Standards**
  **4.1** Where multiple normative frameworks coexisted within a specific temporal and geographical locus, the relevant Contemporaneous Standard for the purposes of Clause 3 shall be the Enforceable Standard applicable to the Actor in the specific context of their conduct.
  **4.2** The Actor's own self-conceptualisation, including their professed affiliations, beliefs, and social categories (e.g., "loyal subject," "faithful communicant," "member of the Guild"), shall be the primary determinant of which Enforceable Standard(s) apply. Historians must not impose alien categorical frameworks (e.g., modern political, social, or identity classifications) upon the Actor for the purpose of moral assessment.
  **4.3** Evidence for Enforceable Standards shall be drawn from documented sources of authority and enforcement, including legal codes, court records, administrative decrees, ecclesiastical rulings, and records of customary practice demonstrably upheld by prevailing powers.

  **5. Assessment of Actors Possessing Anomalous Standards (Temporally Displaced Persons)**
  **5.1** Where credible evidence demonstrates that an Actor (designated a TDP) adhered to a personal ethical framework significantly more restrictive or progressive than the prevailing Enforceable Standard, the Historically Situated Assessment shall **not** be modified to accommodate this anomaly.
  **5.2** The conduct of a TDP shall be assessed solely against the Enforceable Standard applicable under Clause 4. The Actor's internal moral conflict or alignment with later standards is deemed immaterial to the historical assessment of the permissibility of their conduct *at the time*.
  **5.3** Historians may *note* the existence of such anomalous personal standards, but any implied commendation or censure based upon them relative to the Actor's contemporaries constitutes Presentist Judgement and is prohibited.

  **6. Permissible Severity of Retrospective Judgement**
  **6.1** Recognising the potential for emotional resonance to distort temporal perspective, the vigour with which moral censure or approbation may be expressed within a Historically Situated Assessment shall be modulated according to the temporal distance separating the Historian from the conduct.
  **6.2** The permissible severity of judgement shall be determined by reference to Schedule 1 (Graded Permissibility of Expressive Judgement by Temporal Distance) annexed to this Direction.

  **7. Application to Teaching and Contemporary Dissemination**
  **7.1** This Direction applies with full force to the pedagogical presentation of historical conduct and to all written historical narratives intended for contemporary readers.
  **7.2** Historians must ensure that teaching materials, lectures, seminars, and public communications rigorously implement the Historically Situated Assessment methodology. Simplifications aimed at pedagogical clarity must not contravene Clauses 3, 4, or 5.

  **8. Licensing Procedure for Potential TDP References**
  **8.1** Historians intending to prominently feature an Actor who may qualify as a TDP (as defined in Clause 2) in published work or core teaching modules must apply to the Office for a Temporal Displacement Assessment Certificate (TDAC) using Form TDP-1.
  **8.2** The Office will review the submitted evidence concerning the Actor's personal standards and the prevailing Enforceable Standard. If the TDP designation is confirmed, the Certificate will stipulate the precise wording permitted under Clause 5.3 for noting the anomaly, precluding any implicit moral elevation or diminution relative to contemporaries.

  **9. Enforcement**
  **9.1** Compliance with this Direction will be monitored by the Office through its standard audit procedures for publications, teaching syllabi, and public engagements.
  **9.2** Breaches constitute Presentist Judgement under the Historical Integrity Act 2011 and will be subject to the sanctions regime outlined therein, including Retraining Orders, Publication Suspensions, and, for repeated or egregious violations, Licence Revocation.

  **10. Transitional Provisions**
  **10.1** This Direction applies to all Regulated Scholarly Activities commenced on or after the Commencement Date.
  **10.2** Materials created before the Commencement Date may remain in use for a period not exceeding 24 months, after which they must be revised to comply or withdrawn from use in Regulated Scholarly Activities.

  **Signed,**
  **Hilary W. Throckmorton**
  **Deputy Director, Compliance & Temporal Alignment**
  **Office for Temporal Standards**
  **Date: 15th September 2024**

  ---

  **Schedule 1: Graded Permissibility of Expressive Judgement by Temporal Distance**

  | Elapsed Time (Years) | Permissible Severity of Moral Judgement Expression |
  | :------------------- | :------------------------------------------------- |
  | 0 - 50               | Neutral description only. Explicit moral labels (e.g., "unjust", "virtuous") strictly prohibited. Focus on factual adherence to Enforceable Standard. |
  | 51 - 150             | Limited use of mild evaluative terms permitted (e.g., "customary", "permissible under the statutes", "contravened established norms"). Avoid strong pejorative or laudatory language. |
  | 151 - 300            | Moderate evaluation permitted (e.g., "harsh by later measures, but legal then", "conformed to expected duties", "breached contemporary ethical codes"). Contextualisation mandatory. |
  | 301 - 500            | Stronger evaluation permitted (e.g., "acted cruelly according to their own laws", "demonstrated exceptional loyalty within their societal framework"). Must be explicitly anchored in Enforceable Standard. |
  | 501+                 | Fuller moral evaluation permitted, provided it remains demonstrably grounded *only* in Contemporaneous/Enforceable Standards and avoids any comparative reference to subsequent periods. |

  ---

  **Annexe A: Worked Examples**

  *   **Example 1 (Multiple Standards):** An Actor in the 14th Century Kingdom of Alderford is accused of heresy. The Enforceable Standard is the doctrine enforced by the Crown and Ecclesiastical Courts. Assessments must not condemn the *Actor* using modern principles of religious freedom, nor commend them as a "proto-humanist" if such views were proscribed. The Actor's self-identification as a "true believer" (per Clause 4.2) binds the assessment to the Enforceable Standard they defied. Historians may state: "The Actor's views contravened the Enforceable Standard of Crown and Church doctrine, rendering their actions heretical and punishable under Alderford law circa 1347."
  *   **Example 2 (TDP):** A 17th Century merchant-prince in the Principality of Veridia personally opposed chattel slavery, yet continued to profit from investments in the trans-oceanic slave trade, which was legally sanctioned and constituted an Enforceable Standard. Historians *cannot* condemn him as "hypocritical" by modern ethical benchmarks. Reference to his personal views requires a TDAC (Clause 8). If obtained, permissible wording might be: "While surviving correspondence indicates the Merchant-Prince expressed personal reservations about the institution of slavery, his commercial conduct fully complied with the Enforceable Standard of Veridian law and practice. His investments were legally and morally permissible within that framework." (Note the deflationary effect per Clause 5.2).
  *   **Example 3 (Temporal Distance):** Assessing the conduct of a 19th-century factory owner (Elapsed time: 175 years - Schedule 1, Band 151-300). Permissible: "The factory owner's employment of young children for 14-hour shifts, while generating significant criticism from contemporary reformers like the fictional 'Society for Amelioration', complied with the minimal Enforceable Standards set by the Factories Act of [Fictional Year]. Consequently, his actions, though deemed exploitative by later standards, were legally and customarily permissible at the time." Impermissible: "This cruel exploitation of vulnerable children was morally reprehensible, even if legal."

  ---
  **Analytical Note**

  This satire targets the strict prohibition against *any* presentist moral judgement in history, arguing that consistent application leads to logical absurdities and ethical abdication. By mandating assessment solely by "Enforceable Standards" (effectively the standards of the powerful), the Direction implicitly endorses past power structures and silences dissent (Example 1, Clause 4.1). Prioritising the actor's self-categorisation (Clause 4.2) ignores how imposed identities shaped experience. The Schedule 1 grading (Clause 6) exposes the impossibility of a non-arbitrary cut-off for moral concern. The handling of "Temporally Displaced Persons" (Clauses 5, 8, Example 2) deliberately deflates moral courage by subsuming it under prevailing norms. The core irony is the Office's self-exemption (Clause 9.1-9.2), applying present standards to judge historians – highlighting the rule's impossibility when regulating *present* discourse about the past for *present* audiences (Clause 7).

  The strongest reply from proponents of strict non-judgement is that presentism distorts understanding by imposing alien categories and values, preventing historians from grasping historical actors' own motivations and worldviews ("actor's categories"). This guards against Whig history and moral superiority. The satire overstates by making enforcement bureaucratic and absurdly precise, and leans on a contested reading by implying that *any* moral evaluation is inherently presentist. Critics argue historians *can* engage critically with past ethics using reasoned argument grounded in evidence and humanistic values, without simplistic condemnation, fostering understanding without endorsement. The Direction collapses the distinction between *understanding* context and *endorsing* its norms.
