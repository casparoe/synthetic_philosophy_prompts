prompt: |-
  I just spent an hour arguing with a friend about whether a ring species is one species or several, and we went in circles because, without realizing it, we were answering different questions — I kept saying "but the neighbors interbreed" while he kept saying "but the ends have separate evolutionary histories." I teach an intro evolution course (about 25 undergraduates, one 50-minute session), and I'd like an in-class activity that makes students hit that disagreement themselves instead of having me assert it.

  Set it up as a taxonomic vote: give them a case file on a ring of related populations (adjacent populations interbreed, but the two ends meet and don't — think of a ring species like the herring gull complex) with data on morphology, mating behavior, and genetic divergence, and have them vote on whether it's one species or two. The rules should force each group to commit to a single criterion for its vote, and the vote should carry real stakes so it matters (e.g., the outcome determines whether the population gets its own legal protection or is folded into a broader, already-protected category). Arrange the data so that whichever criterion a group picks, some other fact in the file would flip the verdict under a different criterion — so the groups should split and discover the conflict on their own before I name it.

  Please give me the rules, the case file, the payoff scheme, a minute-by-minute timeline, and a debrief that maps each criterion the groups used onto the competing species concepts (biological, phylogenetic, morphological) and lands the deeper point: that "interbreeds with" isn't transitive, so it can't carve species into clean categories, and that the "right" concept partly depends on your purpose. Also tell me what will predictably go wrong the first time I run it, and be frank about which feature of the species problem the activity can't reproduce and I'll have to supply.
reasoning: |-
  We are creating an in-class activity to illustrate the species problem using a ring species scenario. The goal is for students to experience the conflict between different species concepts (biological, morphological, phylogenetic) by having to vote on whether a ring of populations is one species or two, with the outcome having real stakes (e.g., conservation protection). The activity should force groups to commit to one criterion, and the data in the case file should be arranged so that no single criterion gives a clear-cut answer without conflicting with another.

  **Activity Design**

  **Title:** The Ring Species Dilemma: One Species or Two?

  **Learning Objectives:**
  1. Students will recognize that different species concepts can lead to different conclusions about species boundaries.
  2. Students will understand the limitations of the biological species concept, especially the non-transitivity of interbreeding in ring species.
  3. Students will appreciate that the choice of species concept can have real-world implications (e.g., conservation).

  **Setup:**
  - Divide the class into small groups (4-5 students per group). 
  - Each group will get a "case file" with data on a fictional ring species (let's call it the "Sierra Finch") that inhabits a ring of mountains around a central valley. The populations are arranged in a ring: A-B-C-D-E-F-A, but note that the two ends (A and F) meet and do not interbreed, while adjacent populations (e.g., A-B, B-C, ..., F-A) do interbreed.

  **Case File Contents:**

  1. **Map:** A circular arrangement of 6 populations (A to F) around a central valley. The two ends (A and F) are adjacent at the northernmost point.

  2. **Mating Data:**
     - Adjacent populations interbreed freely in the wild (e.g., A with B, B with C, ... , F with A).
     - Non-adjacent populations do not interbreed when brought together (e.g., A and C, A and D, etc.).
     - Specifically, when A and F are brought together (they are adjacent in the ring but represent the two ends), they do not interbreed: no hybrids are observed in the wild or in captivity.

  3. **Morphological Data:**
     - Populations A, B, and C: have dark brown plumage and a small beak.
     - Population D: intermediate plumage (brown with some lighter streaks) and medium beak.
     - Populations E and F: light tan plumage and a large beak.
     - The change is gradual from A to F, but when comparing A and F, they look very different.

  4. **Genetic Data (presented as genetic distances):**
     - Genetic distance between adjacent populations: 0.01 (very similar).
     - Genetic distance between A and F: 0.05 (which is above the typical threshold for conspecific populations in many bird species, but note: the genetic distance between A and C is 0.02, A and D is 0.03, A and E is 0.04, and A and F is 0.05).
     - Genetic distance between A and D: 0.03 (which might be considered borderline for same species in some groups, but note that in this case, A and D do not interbreed).

  5. **Ecological and Behavioral Data:**
     - The song of the finch: A, B, and C have a similar song; D has a song that is intermediate; E and F have a distinctly different song.
     - Habitat: All populations live in similar montane forest habitats.

  6. **Conservation Context:**
     - Population A is abundant and not threatened.
     - Population F is endangered due to habitat loss in its small range.
     - If the entire ring is considered one species, then the entire group is already protected (because the species as a whole is common). But if F is a separate species, then it would qualify for endangered species protection.

  **Rules for the Activity:**

  1. **Group Formation:** Divide students into groups (about 5 groups for 25 students). Each group must choose one and only one criterion on which to base their decision. They can choose from:
     - **Interbreeding Criterion:** Focuses on whether populations can and do interbreed in nature.
     - **Morphological Criterion:** Focuses on physical similarities and differences.
     - **Genetic Criterion:** Focuses on genetic divergence (with a threshold: if genetic distance > 0.04, then different species; if <= 0.04, same species? But note: we set A-F at 0.05, so above threshold).

     Alternatively, you might let them choose any criterion they want, but then you have to map it later. To force the conflict, we can limit to these three.

  2. **Voting:**
     - Each group must reach a consensus and vote either "One Species" or "Two Species" (with the two species being A-B-C-D as one and E-F as the other? Or A-B-C and D-E-F? But note the ring: we want the conflict to be that A and F are the endpoints and don't interbreed, but they are connected through intermediates. So the two species would be: one species for the entire ring? Or split at the point where they don't interbreed? Actually, the groups are free to interpret, but the key is that if they split, then F becomes a separate species.

     We can structure the vote as: "Should population F be considered a separate species from population A (and the rest of the ring)?"

     But note: the entire ring is connected by gene flow except at A and F. So the question is: is the ring one species or two? We can frame it as:

     "Based on the data, should we classify the Sierra Finch as one species (Sierra finch, *Finchus sierraensis*) or two species (Western Sierra finch, *Finchus occidentalis* for populations A-D and Eastern Sierra finch, *Finchus orientalis* for populations E and F)?"

     The conservation stakes: if two species, then the Eastern Sierra finch (which includes F) becomes endangered and gets protection. If one species, then no additional protection because the overall species is common.

  3. **Stakes:** 
     - If the class votes "two species", then the endangered population F gets protection (and the class has saved a species from extinction).
     - If the class votes "one species", then the population F does not get special protection and may go extinct (but the class has prevented unnecessary spending on a non-distinct population?).

     We can frame the stakes as a conservation agency that will act based on the class's vote.

  **Minute-by-Minute Timeline (50 minutes total):**

  - **0-5 min:** Introduction to the activity. Present the scenario: We are a panel of experts advising the Sierra Conservation Agency. They have asked us to determine the species status of the Sierra Finch. The decision will determine whether the endangered population (F) gets protection. Hand out the case file (one per group). Explain the rules: each group must choose one criterion (interbreeding, morphology, genetics) and base their vote solely on that criterion. Then they must vote as a group.

  - **5-20 min:** Group deliberation. Each group discusses the data and chooses a criterion. They must then decide their vote (one species or two) based on that criterion. They should record their criterion and their vote. The instructor circulates to answer clarifying questions but does not guide the decision.

  - **20-25 min:** Each group reports: (a) the criterion they used, (b) their vote, and (c) a one-sentence justification. The instructor records the votes and justifications on the board.

  - **25-35 min:** Open discussion: The instructor points out that the class is split. Ask: "Why did we get different answers? What happens if we change the criterion?" Highlight the conflicts in the data.

  - **35-50 min:** Debrief and lecturette.

  **Debrief Structure:**

  1. **Map the criteria to species concepts:**
     - Groups that used **interbreeding**: Biological Species Concept (BSC). They note that adjacent populations interbreed, so the whole ring is one species? But then they see that A and F don't interbreed. So they might split at A and F? However, the BSC would typically consider the entire ring as one species because gene flow occurs through the ring. But the non-interbreeding at the ends is a problem. The key point: interbreeding is not transitive. A breeds with B, B with C, ... E with F, but A does not breed with F. So the BSC doesn't give a clear answer.

     - Groups that used **morphology**: Morphological Species Concept. They see that A and F look very different (and are as different as other recognized species in the same family). So they vote for two species. But then they must ignore the gradual change and the intermediates.

     - Groups that used **genetics**: Phylogenetic Species Concept (or genetic divergence). We set a threshold: if the genetic distance between two populations is above 0.04, they are different species. A and F: 0.05 -> two species. But note: A and D are 0.03 (same species) and D and F are 0.02 (same species) -> but then A and F are connected through D? Again, non-transitivity. The genetic criterion also shows a continuum.

  2. **The deeper point:** 
     - The problem is that "interbreeds with" is not transitive. So it doesn't partition the populations into discrete categories. The same applies for genetic and morphological continuity in a ring. 
     - The "right" concept depends on the purpose: for conservation, we might want to protect unique evolutionary lineages (so split at F), but for understanding gene flow, we might see the ring as one species.

  3. **What the activity can't show and you must supply:**
     - In real ring species, the ring might be broken (e.g., by geography) and the two ends might not actually meet. Also, ring species are rare and often break down over time. The activity simplifies the genetic and morphological data. 
     - The activity doesn't cover all species concepts (e.g., ecological). 
     - Also, the activity uses a threshold for genetic data, which is arbitrary and not always used in practice.

  **Predictable Problems:**

  1. **Groups might try to use multiple criteria:** Enforce the rule: one criterion per group. If they try to combine, remind them that the agency requires a clear, singular criterion for consistency.

  2. **Confusion about the ring structure:** Provide a clear map and explain the connections. Use a diagram on the board.

  3. **Time pressure:** 15 minutes might be tight for discussion. Be ready to adjust.

  4. **Consensus not reached in groups:** Encourage them to vote within the group if necessary.

  5. **Students might question the arbitrary genetic threshold:** Acknowledge that thresholds are arbitrary and in real life there is debate. The point is to illustrate how using a threshold leads to a different conclusion.

  **Case File Example (Sierra Finch):**

  **Background:** The Sierra Finch (*Finchus sierraensis*) is a bird species found in the Sierra Nevada mountains. There are six known populations (A to F) arranged in a ring around the Central Valley. The populations are connected by gene flow between adjacent populations, except at one point: where populations A and F meet in the north, they do not interbreed.

  **Data:**

  1. **Interbreeding:**
     - Adjacent populations (A-B, B-C, C-D, D-E, E-F, F-A) have been observed to interbreed in the wild and produce fertile offspring, except for the pair F-A. 
     - In captivity, when non-adjacent populations are paired (e.g., A and C, A and D, A and E, A and F), no interbreeding occurs. Specifically, A and F show aggressive behavior and no mating.

  2. **Morphology:**
     - Plumage color:
       - Populations A, B: dark brown
       - Population C: brown with some light streaks
       - Population D: intermediate brown and tan
       - Population E: tan with some brown streaks
       - Population F: light tan
     - Beak size (relative to body size):
       - A, B: small (average 8 mm)
       - C: small-medium (9 mm)
       - D: medium (10 mm)
       - E: medium-large (11 mm)
       - F: large (12 mm)
     - Note: The differences between A and F are as great as those between recognized species in the same genus.

  3. **Genetic Data:**
     - Genetic distance matrix (using mitochondrial DNA, average pairwise distance):
       - Adjacent pairs (A-B, B-C, C-D, D-E, E-F, F-A): 0.01
       - A-C: 0.02, A-D: 0.03, A-E: 0.04, A-F: 0.05
       - B-D: 0.02, B-E: 0.03, B-F: 0.04
       - C-E: 0.02, C-F: 0.03
       - D-F: 0.02
     - Typical within-species variation in finches: genetic distance < 0.04. Above 0.04 suggests different species.

  4. **Behavior:**
     - Song: Populations A and B have a song with 3-4 notes; C and D have 4-5 notes; E and F have 5-6 notes with a distinct ending.

  5. **Conservation Status:**
     - Population F is endangered due to a recent wildfire that destroyed much of its habitat. It now has fewer than 200 individuals. The other populations are stable (A: 10,000; B: 8,000; C: 7,000; D: 6,000; E: 1,500).
     - If the Sierra Finch is considered one species, then it is not eligible for endangered status because the overall population is large. If population F (and E, if they are considered the same species) is a separate species, then it would qualify for endangered species protection.

  **Task for Groups:** 
  - Choose one criterion: Interbreeding, Morphology, or Genetics.
  - Apply that criterion to decide: Is the Sierra Finch one species or two? (Specifically, should population F be considered part of the same species as population A?)
  - Vote: One species or two.

  **Voting Tally:**

  After groups report, the instructor tallies the votes and notes which criterion each group used.

  **Debrief Points:**

  - Highlight the groups that used interbreeding: They might have argued that the entire ring is connected by interbreeding (except A and F) but then the non-interbreeding at the ends might cause a split. The BSC doesn't have a clear rule for this. 

  - Morphology groups: They see two distinct forms (dark vs. light) and vote for two species.

  - Genetics groups: They see A-F distance is 0.05 (>0.04) so two species.

  - Then ask: "What if we used a different genetic threshold? What if we used a different species concept?"

  - The key: The ring species shows that species are not always discrete. The concept we choose depends on what we care about: gene flow (BSC), evolutionary history (PSC), or morphology (for identification). And for conservation, we might prioritize preserving unique lineages (so split at F).

  **Conclusion:** 
  There is no universal answer. The species problem is a human attempt to categorize a continuous and dynamic process of evolution. The activity should leave students with an appreciation for the complexity and the importance of clearly defining criteria in scientific and conservation contexts.
answer: |-
  ### **In-Class Activity: The Ring Species Dilemma**  
  **Goal:** Force students to confront the ambiguity of species concepts by voting on a ring species case, revealing that criteria conflict and "species" is context-dependent.  

  ---

  ### **Rules & Setup**  
  **Time:** 50 minutes  
  **Group Size:** 5 groups of 5 students each.  
  **Stakes:**  
  - If class votes "**ONE** species", the entire population is classified under an existing protected species (*Sierra finch*), so **no new conservation action** is taken for the endangered endpoint.  
  - If class votes "**TWO** species", the endpoint population is classified as a new species (*Highland finch*), granting it **endangered species protections** (funding, habitat restoration).  

  **Rules for Groups:**  
  1. Each group **must pick ONE criterion** to base their vote on:  
     - **Reproductive Compatibility**: Can populations interbreed and produce fertile offspring?  
     - **Morphology**: Are populations physically similar?  
     - **Genetic Divergence**: Is DNA similarity above/below a species threshold?  
  2. Groups **cannot combine criteria**—they must commit to one.  
  3. Groups must reach a **unanimous vote** (ONE species or TWO species).  
  4. After voting, groups must **justify their choice** using only their chosen criterion.  

  ---

  ### **Case File: Sierra Finch Complex**  
  *(Distribute this handout)*  

  #### **Background**  
  The Sierra finch (*Finchus montanus*) consists of 6 populations arranged in a ring around the Central Valley. Populations interbreed with neighbors but **not** with distant populations. Population **A (West)** and **F (East)** meet at the northern end of the ring but do not interbreed. Population **F is endangered** (habitat loss; <200 birds left).  

  #### **Data**  
  1. **Interbreeding Tests**:  
     - ✅ **Adjacent pairs** (A-B, B-C, C-D, D-E, E-F) interbreed freely in the wild and produce fertile offspring.  
     - ❌ **Endpoint pair (A-F)**: No interbreeding in wild or captivity (no hybrids observed).  
     - ❌ **Non-adjacent pairs** (e.g., A-C, A-D): No interbreeding.  

  2. **Morphology**:  
     - **Plumage color**:  
       - A, B: Dark brown  
       - C, D: Medium brown  
       - E, F: Light tan  
     - **Beak size** (critical for seed-eating):  
       - A: Small beak (avg. 8 mm)  
       - D: Medium beak (avg. 10 mm)  
       - F: Large beak (avg. 12 mm)  
     - **Comparison**: A and F differ as much as known *separate* finch species (e.g., *Finchus aridensis*).  

  3. **Genetic Divergence** (mitochondrial DNA):  
     - **Genetic distance** (0.00 = identical; >0.04 = typically separate species in birds):  
       - Adjacent pairs: 0.01 (e.g., A-B, E-F)  
       - A-D: 0.03  
       - **A-F: 0.05**  
       - D-F: 0.02  
     - **Threshold**: Local conservation laws define species as genetically distinct if distance **>0.04**.  

  4. **Conservation Status**:  
     - **F is endangered** (habitat loss; 90% decline).  
     - A-D are stable (>5,000 birds each).  
     - **Legal implication**:  
       - If **ONE species**, F gets **no protection** (folded into common *Sierra finch*).  
       - If **TWO species**, F is listed as **endangered** (*Highland finch*), triggering conservation funds.  

  ---

  ### **Timeline**  
  **Total: 50 minutes**  
  - **0–5 min**: Introduce activity and stakes.  
    - *Instructor*: "You’re a wildlife committee voting on whether to protect Population F. Your vote has real consequences—extinction or conservation."  
    - Hand out case files. Assign groups.  
  - **5–20 min**: **Group Deliberation**.  
    - Groups pick **one criterion** (reproductive, morphology, genetics).  
    - Debate and vote (ONE species or TWO).  
    - *Instructor circulates*: Enforce "one criterion only"; ask probing questions (e.g., "What about the endpoints?").  
  - **20–30 min**: **Vote & Justification**.  
    - Each group reports:  
      1. Chosen criterion.  
      2. Vote (ONE or TWO).  
      3. 1-sentence justification.  
    - *Instructor records votes on board*:  
      | Group | Criterion          | Vote | Justification                      |  
      |-------|--------------------|------|-----------------------------------|  
      | 1     | Reproductive       | ONE  | "Neighbors interbreed; gene flow."|  
      | 2     | Morphology         | TWO  | "A and F look too different."     |  
      | 3     | Genetics           | TWO  | "A-F genetic distance >0.04."     |  
      | ...   | ...                | ...  | ...                               |  
  - **30–40 min**: **Reveal the Conflict**.  
    - Point out split votes. Ask:  
      - "Group 1 voted ONE species using interbreeding, but Group 2 voted TWO using morphology. Why the disagreement?"  
      - "What happens if Group 3 (genetics) switches to morphology?"  
    - Highlight contradictions:  
      - Reproductive groups see "ONE species" (ring connected).  
      - Morphology/genetics groups see "TWO species" (endpoints diverge).  
  - **40–50 min**: **Debrief & Lecturette**.  

  ---

  ### **Debrief**  
  **Map Criteria to Species Concepts & Conflicts:**  
  1. **Reproductive Compatibility → Biological Species Concept (BSC)**:  
     - *Student justification*: "All adjacent populations interbreed—it’s one connected gene pool."  
     - **Conflict**: But A and F *don’t* interbreed! **BSC fails** because "interbreeds with" isn’t transitive: A→B→C→D→E→F doesn’t mean A→F.  

  2. **Morphology → Morphological Species Concept (MSC)**:  
     - *Student justification*: "A and F look different—like separate species."  
     - **Conflict**: Ignores gradual variation (A→F changes slowly). MSC is arbitrary: Where do you split the ring?  

  3. **Genetic Divergence → Phylogenetic Species Concept (PSC)**:  
     - *Student justification*: "A-F distance >0.04—they’ve diverged."  
     - **Conflict**: Genetic distance is gradual (A-D=0.03, D-F=0.02). Thresholds are subjective!  

  **Land the Bigger Points:**  
  - **Non-transitivity**: "Interbreeds with" isn’t like math (if A=B and B=C, then A≠C here!). Evolution doesn’t create clean categories.  
  - **Purpose matters**:  
    - Conservation? Protect F as a unique lineage (use PSC/MSC).  
    - Studying gene flow? Treat as one species (BSC).  
  - **No "right" answer**: Ring species expose how species concepts break. Reality is a continuum; we impose categories.  

  ---

  ### **Predictable Problems & Limitations**  
  **What Will Go Wrong:**  
  1. **Groups resist picking one criterion**: Enforce strictly. Intervene if they try to hedge.  
  2. **Students fixate on endpoints**: They may ignore intermediates (ask: "But what about Populations C and D?").  
  3. **Time crunch**: Deliberation may run over. Cut votes short at 20 min if needed.  
  4. **Frustration with ambiguity**: Some will demand a "correct" answer. Stress that discomfort is the point!  

  **What the Activity *Can’t* Show (Requires Instructor Input):**  
  - **Evolutionary dynamics**: Ring species are rare *because* they collapse. Gene flow between endpoints usually breaks the ring (e.g., herring gulls now hybridize with lesser black-backed gulls).  
  - **Other concepts**: Ecological/lineage concepts aren’t covered. Add: "In reality, we might prioritize evolutionary independence (PSC) for conservation."  
  - **Threshold arbitrariness**: Genetic/morphological thresholds are human constructs—emphasize this in debrief.  

  **Instructor Script for Closing:**  
  *"Today’s vote wasn’t about winning—it was about realizing why we argued. My friend and I were both ‘right’ because we used different lenses. In evolution, the ‘species’ you see depends on the question you ask. Next week, we’ll see how this plays out in conservation and speciation research."*  

  ---
  **Materials Needed**: Case file handouts, whiteboard for votes, timer.  
  **Why This Works**: Students experience the conflict firsthand—no lecture needed. The stakes make it visceral, and the debrief turns frustration into insight.
