prompt: |-
  spent the last three hours arguing with a friend about advance directives and I still feel like I'm the one who's wrong even though I can't say why. Her position is basically that honoring a living will is just respecting the person, full stop — the competent them wrote it down, so the incapacitated them has to follow it, and anyone who hesitates is really just letting a doctor take over. And I get it, I do, it sounds airtight. But the case that keeps bugging me: the person with late-stage Alzheimer's who's actually not suffering, who's calm and even kind of settled, but whose directive from ten years ago says 'do not keep me alive if I can't recognize my own family.' What exactly gives the sharp ten-years-ago version of them the right to veto the content version of them? And here's the part that really throws me — we don't let a person do this anywhere else. A competent adult can't sign a contract now that binds their future self to, say, work for a year at a pittance, or to never quit a job, or to be their kid's guardian no matter what; the future self gets to change their mind about pretty much everything, a promise can be broken, a preference can be revised. So why is the one domain where the past self gets iron-clad, enforceable authority over the present self the one where the present self is least capable of objecting? I think the whole practice of advance directives quietly presupposes some particular theory of what makes a person the the same person over time, and that the theory it needs isn't the one we actually use for contracts or promises or just changing your mind. Can you reconstruct what view of personal identity and self-continuity the advance-directive practice strictly requires, seperate that from what it merely fits well with, point out where it contradicts how we treat the same person's commitments in every other context, and tell me what would have to change if we forced ourselves to use one consistent view of the self across all of it?
reasoning: |-
  Okay, the user spent three hours debating advance directives with a friend and feels unsettled despite their friend's seemingly airtight position. The core tension is between respecting past competent wishes versus present incapacitated experiences, especially in cases like late-stage Alzheimer's patients who appear content but have directives refusing life-sustaining treatment if they can't recognize family. 

  The user's frustration centers on a philosophical inconsistency: why do advance directives grant past selves absolute authority when no other domain (contracts, promises) allows such binding future constraints? They suspect this exposes an unexamined theory of personal identity. 

  Hmm, this is actually an incredibly sophisticated observation. Most people debate advance directives on autonomy vs beneficence grounds, but the user has pinpointed a deeper metaphysical conflict. Their example of the non-suffering Alzheimer's patient is ethically thorny precisely because it challenges our implicit assumptions about "who" the patient is. 

  Let me unpack the implied personal identity theories. The friend's position relies on a "Lockean psychological continuity" view - the competent mind that wrote the directive is the "real" person. But the user intuitively recognizes the present self as morally significant through their exhibited well-being. That's closer to a "Parfitian reductionist" view where identity isn't binary. 

  The contradiction they noticed is spot-on: contract law assumes present selves can override past commitments because interests change, yet advance directives freeze identity at peak competence. We'd never let 25-year-old me bind 40-year-old me to a career choice - so why bind dementia patients? 

  What's really brilliant is their final question: what if we applied one consistent personal identity theory across all domains? If we used the contract law model ("present self sovereignty"), advance directives would become non-binding preferences. If we used the directive model ("past self sovereignty"), we'd allow lifelong unbreakable contracts. Both outcomes feel ethically monstrous in opposite ways. 

  ...Ah. That's why this debate matters. The inconsistency exists because each approach serves different values: directives protect against suffering we fear but can't articulate, while contract flexibility preserves liberty. Forcing consistency would sacrifice one set of values for the other. The user's discomfort might stem from realizing there's no perfect solution - just tradeoffs between respecting different versions of a person.
answer: |-
  You've hit on one of the deepest philosophical tensions in bioethics. Your intuition is correct: Advance directives rely on a specific, often unstated, theory of personal identity and autonomy that *does* conflict with how we treat the self in other legal and social contexts. Let's break this down systematically.

  ### 1. **The View of Personal Identity Strictly Required by Advance Directives**
     *   **The "Competent Self as Sovereign" Model:** This view holds that the *competent, autonomous person* is the only "true" or "authoritative" self. The incapacitated state is seen not as a *different self* with its own interests, but as a *loss* or *absence* of the self.
     *   **Identity Anchored in Past Values:** The directive represents the person's "authentic" wishes, values, and fears (e.g., fear of indignity, loss of cognition, being a burden). The incapacitated state is viewed as a violation of those core values, regardless of present experience.
     *   **Psychological Continuity as Identity:** Identity is defined primarily by *psychological continuity* (memories, plans, relationships, rational agency). When severe dementia breaks this continuity (as in your Alzheimer's example), the directive implies the *person* who existed when it was written *no longer exists* in any meaningful way. The directive is seen as instructions for the care of their biological remains or a "living remnant," not as binding a *different* present person.
     *   **The "Anticipatory Autonomy" Principle:** Autonomy isn't just about *current* choices; it includes the right to make binding decisions *now* about *future* states where autonomy is lost. Honoring the directive is respecting the *past* exercise of that anticipatory autonomy.

  ### 2. **Views it Fits Well With (But Doesn't Strictly Require)**
     *   **Best Interests Standard:** If the directive accurately reflects what the person *would likely want now* based on their past values, honoring it fits the best interests standard (acting as the person *would* act if competent). However, directives are binding even if present experience *might* suggest different interests.
     *   **Avoiding Family Burden:** Directives prevent families from imposing their own values or burdens onto difficult decisions.
     *   **Preventing Overtreatment:** They guard against medical paternalism where doctors might prolong life contrary to known wishes due to discomfort with withdrawal or institutional inertia.

  ### 3. **The Contradiction with Other Contexts (Your Core Insight)**
     *   **Rejection of Irrevocable Future-Binding Contracts:** As you noted, contract law generally rejects irrevocable commitments that bind future selves against their future will or interests. We allow contracts to be broken (with penalties) because we recognize interests and circumstances change, and the *present self* has sovereignty.
     *   **Revocable Wills:** Even wills distributing property after death can be *changed* up until death. The *present* competent self always has the final say.
     *   **Changing Preferences:** We accept that people change their minds about careers, relationships, residences, and deeply held beliefs. The past self doesn't have veto power.
     *   **Guardianship:** If a person becomes incompetent *without* a directive, we appoint a guardian to make decisions based on *current* best interests and *inferred* preferences, *not* based on rigid adherence to past hypothetical statements.
     *   **The Crucial Difference:** In all other contexts, the *present competent self* holds ultimate authority and can override past commitments. In advance directives, the *past competent self* holds ultimate authority over the *future incapacitated self*, precisely when that future self cannot protest or change the directive. This prioritizes *anticipated future incapacity* over *actual present experience*.

  ### 4. **What a Truly Consistent View of the Self Would Require**
     Applying the same logic used elsewhere (present self sovereignty) to advance directives would necessitate fundamental changes:

     *   **Directives as Strong Preferences, Not Commands:** Advance directives would lose their absolute, binding force. They would become powerful evidence of *likely* wishes, but not determinative.
     *   **Ongoing Best Interests Assessment Required:** Decision-makers (surrogates, courts) would be *required* to consider the *current* state, well-being, and observable interests of the incapacitated person, alongside the directive. If the current state suggests peace, comfort, or simple pleasures exist *contrary* to the anticipated suffering feared in the directive, this could override the directive.
     *   **Focus on Suffering vs. Identity:** Decisions would pivot from "Does this match the *identity* described in the directive?" to "Is this person *currently suffering* or experiencing a life they would likely find intolerable *if* they could comprehend it?" The calm Alzheimer's patient in your example might be sustained, even if they don't recognize family.
     *   **Burden of Proof Shift:** The presumption might shift. Instead of needing a strong reason *not* to follow the directive, one might need a strong reason (like clear current suffering) *to* override the directive if the present state seems tolerable.
     *   **Potential for More Intrusive Judgments:** This could open the door to more subjective judgments by surrogates or doctors about "quality of life," potentially reintroducing paternalism the directive was meant to prevent.

  ### The Unavoidable Tension & Why We Tolerate the Inconsistency
  *   **The Horror of the Anticipated State:** The force of directives stems from our profound fear of *becoming* the demented, unaware, or suffering person. We prioritize preventing that state *for our future self* over the potential for a peaceful unawareness we cannot currently imagine. We fear *losing* ourselves more than we value the potential contentment of the "remnant."
  *   **Practicality and Avoiding Worse Paternalism:** Absolute directives provide clarity and prevent potentially agonizing debates or well-meaning but misguided decisions by families or doctors who might impose *their* view of a "life worth living" onto an unaware patient. The "past self sovereignty" model is a clear, albeit philosophically inconsistent, bulwark against that.
  *   **The Impossibility of Consent:** The incapacitated self *cannot* consent to *anything*. We have to choose *whose* voice speaks for them: the voice of their past competent self (via the directive) or the voice of a surrogate interpreting current interests.

  **Conclusion:** You are absolutely right. Advance directives implicitly rely on a "past competent self as sovereign" model of identity and autonomy that contradicts how we treat the binding nature of past commitments on present selves in virtually every other domain (contracts, wills, preferences). This model prioritizes psychological continuity and feared future states over present experience and well-being in cases of profound incapacity.

  Forcing consistency would mean either:
  1.  **Making advance directives non-binding preferences** (applying "present self sovereignty" to future incapacity), requiring ongoing best interests judgments that risk paternalism.
  2.  **Making other commitments irrevocable** (applying "past self sovereignty" widely), allowing people to bind their future selves in harmful or exploitative ways (like unbreakable exploitative contracts).

  Society has chosen the inconsistency because the horror of being trapped in an unwanted, diminished state *against our past explicit wishes* is deemed a greater evil than potentially prolonging a life of unaware contentment *contrary* to past wishes. Your discomfort reveals the profound philosophical and ethical cost of that choice. Your argument isn't wrong; it exposes a deep, perhaps unresolvable, tension in how we define the self across time, especially at its margins.
