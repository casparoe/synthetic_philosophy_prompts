answer: |-
  Your quest for a precise principle to systematize your historical verdicts is insightful. The tension between Newton-to-GR (survival) and caloric-to-kinetic (non-survival) highlights a key challenge: **mathematical continuity alone is insufficient for ontological survival**. Below is a principle designed to capture your intuitions, followed by its application and implications.

  ---

  ### **Proposed Principle: Structural Retention + Reference Continuity**
  An unobservable posit *P* of theory *T₁* **survives** in successor theory *T₂* iff:
  1.  **Structural Retention:** *T₂* recovers the empirically successful mathematical *structure* of *T₁* (e.g., equations, symmetries) in a well-defined limiting case or approximation.
  2.  **Reference Continuity:** *P* retains its core *ontological referent* in *T₂*, even if reinterpreted. *T₂* does not attribute *T₁*'s success to a *different* entity/mechanism that renders *P* obsolete or fictional.

  ---

  ### **Application to Your Cases**
  | Case                          | Structural Retention? | Reference Continuity? | Verdict (Principle → Yours) |
  |-------------------------------|------------------------|------------------------|-----------------------------|
  | **Newtonian gravitation → GR** | Yes (Newtonian limit) | Yes ("Mass" → stress-energy tensor; spacetime curvature ≈ force) | **Survival** → Matches |
  | **Phlogiston → Oxygen**        | No (no mathematical continuity) | No (combustion explained by oxygen, not phlogiston-release) | **No Survival** → Matches |
  | **Caloric → Kinetic**          | Partial (thermodynamic equations survive; "caloric flow" ≈ heat transfer) | **No** (Caloric: material fluid; Kinetic: molecular motion. *Different referents*) | **No Survival** → *Contradicts your "partial"* |
  | **Aether → Special Relativity** | Partial (Maxwell's equations survive) | **No** (Aether: absolute medium; EM fields: property of spacetime. *No medium needed*) | **No Survival** → Matches |
  | **Miasma → Germ Theory**       | Weak (disease spreads via air → airborne pathogens) | **No** (Miasma: poisonous vapor; Germs: biological agents. *No shared mechanism*) | **No Survival** → Matches your doubt |
  | **Newtonian Mass → GR**        | Yes (low-energy limit) | **Debatable** (Inertial mass ≈ curvature source? Yes. *But mass as property vs. energy?*) | *Survival* (by your verdict) |

  **Resolution of Newton/Caloric Contrast**:  
  - Newton: Mass/spacetime **retain referents** (mass → stress-energy; force → curvature).  
  - Caloric: **No referent continuity** (material fluid → kinetic energy of particles).  
  → *Structural retention without reference continuity is insufficient for survival*.

  ---

  ### **New Case: Classical Electron → Quantum Field Theory (QED)**
  - **Structural Retention?**  
    Yes: Classical EM equations (Maxwell's) emerge as the low-energy limit of QED. The electron's charge/mass parameters persist.
  - **Reference Continuity?**  
    **No:**  
    - Classical: Electron is a point particle with definite trajectory.  
    - QED: Electron is an excitation of a quantum field; no trajectory, probabilistic, subject to pair creation/annihilation.  
    → **Verdict: No Survival** (by the principle). The electron's *role* (charge carrier) survives, but its *nature* is fundamentally reinterpreted.

  ---

  ### **Which Verdict Must Be Given Up?**
  You must abandon your "**partial survival**" verdict for **caloric theory**. The principle demands *reference continuity* for survival, and caloric fluid has no referent in kinetic theory—only the *phenomenon* (heat flow) is preserved structurally. Calling it "partial" conflates structural approximation with ontological survival.

  ---

  ### **Implications for Scientific Realism**
  1.  **Defends No-Miracles, but Narrowly:**  
      The principle shows *some* posits (mass/spacetime in Newton→GR) survive robustly, making their success non-miraculous. But it restricts "roughly true" to cases where *both structure and reference persist*.  
  2.  **"Roughly True" is Contextually Precise, Not Vague:**  
      The principle replaces vagueness with **two clear criteria**. If a posit satisfies both, it is "roughly true" in a defensible sense. Failures (phlogiston, caloric, aether) are explainable without undermining realism about successful *retained* posits.  
  3.  **Limits of Realism Exposed:**  
      - Entities like the classical electron *do not survive*, showing realism cannot extend to *all* posits of successful theories.  
      - Survival is *selective*: we can be realists about structural/ontological "cores" that persist (e.g., spacetime, electromagnetic fields), but not discarded entities (e.g., aether).  

  ---

  ### **Conclusion**
  The **Structural Retention + Reference Continuity** principle:  
  - Captures all your verdicts *except* caloric (where it rejects "partial survival").  
  - Handles new cases (electron → QED: no survival).  
  - Strengthens the no-miracles argument by clarifying "roughly true" as *dual continuity*, avoiding vagueness.  
  - Forces realism to be *selective*: we commit only to posits that survive *both* tests across theory change.  

  This makes scientific realism defensible but humble: it cannot protect all successful posits, only those demonstrating robust referential stability through structural refinement. The pessimist is right that "roughly true" *is* vague without such criteria—but wrong that it cannot be made precise.
