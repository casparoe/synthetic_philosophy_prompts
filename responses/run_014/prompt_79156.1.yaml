answer: |-
  Here's the diagnosis:

  1.  **Not purely verbal:** The dispute isn't *only* about notation because it involves differing ontological commitments - does spacetime itself exist as an entity independent of matter/fields (substantivalism), or is it merely a codification of relations between material objects/events (relationism)?
  2.  **Hidden formal question:** The core disagreement revolves around whether spacetime points possess primitive identity - can the same physical event occur at different spacetime points even if all relational structures (distances, causal connections) are identical? (Substantivalism says yes, relationism says no).
  3.  **Two questions sharing one name:** The debate conflates (a) the *physical content* of theories (the observable, relational facts both sides agree on) with (b) the preferred *ontological interpretation* of the mathematical structures used to represent that content.
  4.  **Bedrock intuitions:** The impasse stems from irreconcilable fundamental intuitions: substantivalists prioritize the independence and reality of the background arena, while relationists insist physical reality must be exhausted by relations between material constituents.
  5.  **Progress requires:** Resolving the primitive identity question via new physics (e.g., quantum gravity revealing fundamental spacetime structure) or demonstrating empirically that one interpretation leads to testable predictions the other cannot.
