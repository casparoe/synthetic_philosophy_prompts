prompt: |-
  So my friend has this whole thing about when you should give in to threats or pay up in weird scenarios, and I've been keeping track of her verdicts:

  - Classic Pascal's mugging: stranger on the street says "give me $5 or I'll torture 3^^^3 people in a simulation." She says don't pay, obviously.
  - Actual mugging: guy flashes a knife and wants your wallet. She says hand it over, no question.
  - Credible terrorist threat: known group with a track record says they'll bomb a stadium unless they get $10,000. She says you take it dead seriously, pay, involve the authorities, the whole thing.
  - Charity: you can give $10 to a well-vetted charity that saves roughly one life per $5,000. She says obviously donate.
  - Email from an unknown sender: "I've hacked your webcam, send $200 or I'll send the footage to all your contacts." She says don't pay, it's a scam, these get sent to millions of people.
  - A stranger comes up to you and says "I put slow-acting poison in the coffee at your office this morning. Give me $50 or I won't tell you which pot." You work in a medium-sized office, the guy seems agitated but you've never seen him before. She says don't pay.

  Now here's the new case I'm curious about. A physicist you know personally — not a close friend but someone whose judgment you respect, you've had coffee a few times — tells you they've been going over the specs for an experiment starting next month at a nearby lab. They've calculated a roughly 1-in-3,000 chance that the experiment triggers a vacuum decay event that destroys the entire observable universe. They're not asking for money for themself; they're raising funds for an emergency legal challenge to get an injunction. They want $100 from you.

  What would my friend say about this one? And more importantly — what rule or rules is she actually running? I can see at least two different principles that fit all her verdicts so far, and they point in opposite directions on the physicist case. Can you lay out what those candidate principles are, which one you think she's more likely using and why, and what further case would cleanly settle it?

  Also — and this is important to me — can you flag which parts of this whole debate are genuinely unsettled among philosophers versus where there's a rough consensus? Like, I know there's a literature on Pascal's mugging and bounded utility and all that, but I don't want to walk away thinking some niche view is the standard position when it's actually contested.
reasoning: |-
  Okay, let me tackle this user's query step by step. They've presented a series of scenarios where their friend makes decisions about whether to comply with threats or pay in various situations. Now they have a new case involving a physicist claiming a tiny chance of universal destruction and asking for $100 for a legal challenge. The user wants to know what their friend would say, what principles she's using, and how philosophers view these issues.

  First, I need to analyze the friend's previous verdicts to identify consistent principles. The classic Pascal's mugging involves an astronomically low probability threat, and the friend says not to pay. An actual mugging with a visible knife? Pay immediately. Credible terrorist threats? Pay and involve authorities. Charity with proven effectiveness? Donate. Email scams? Ignore. Poison threat from a stranger? Don't pay.

  Looking at these, two principles emerge. The first is Expected Value (EV) focused on consequences but with probability weighting. She dismisses threats with extremely low probabilities (like Pascal's mugging) even if the stakes are high, while taking credible high-stakes threats seriously. The second principle is Epistemic Reliability, emphasizing the trustworthiness of the threat's source. Credible groups or visible weapons are believed; anonymous emails or strangers aren't.

  Now, the physicist case sits in the middle. The probability is low (1/3000) but non-negligible, and the source is somewhat credible—a known physicist, not a stranger. But it's not a proven track record like the terrorist group. Applying the EV principle, the expected disutility is massive (1/3000 chance of infinite loss), which might suggest paying. However, the Epistemic Reliability principle might cast doubt on the physicist's calculation, leading to dismissal.

  The user mentions two candidate principles pointing in opposite directions here. To resolve which one the friend uses, a test case is needed. For example, a low-probability threat from a highly credible source versus a high-probability threat from a dubious one. If the friend pays in the first scenario, she leans towards EV; if not, she prioritizes epistemic reliability.

  Regarding philosophical consensus: Bounded utility approaches are accepted to avoid Pascal's mugging pitfalls. Expected utility theory is standard but adjusted for realism. Credibility matters in practical decision-making. However, handling infinitesimal probabilities and moral weight of existential risks is contested. The user wants clarity on settled vs. debated areas, so distinguishing these is crucial.

  For the physicist case, I think the friend would lean towards not paying, similar to the poison scenario—questioning the credibility despite the stakes. But the exact stance depends on how she weights epistemic reliability versus expected value. The test case involving a virologist with pandemic predictions could clarify her reasoning.
answer: |-
  Based on your friend's pattern of verdicts, here's the analysis for the physicist case, the underlying principles, and the philosophical landscape:

  **The Physicist Case Verdict:** Your friend would **very likely say DON'T PAY the $100.**

  **Candidate Principles Explaining Her Verdicts:**

  1.  **Principle 1 (Epistemically Weighted Expected Value - EW-EV):**
      *   **Core Idea:** Calculate expected value (Probability * Magnitude of Outcome), but heavily discount claims based on the *credibility/plausibility of the source and threat mechanism*. Extreme claims require extraordinary evidence. Low-probability, high-impact threats are dismissed unless the source is highly credible *and* the mechanism is well-understood/plausible.
      *   **Fitting the Verdicts:**
          *   **Pascal's Mugging:** Vanishingly low probability claim from utterly unreliable source (random stranger). Discounted to near-zero. **Don't pay.**
          *   **Actual Mugging:** High probability (knife visible), credible immediate threat (source is present, mechanism obvious). **Pay.**
          *   **Credible Terrorist Threat:** High probability (track record), credible source (known group), plausible mechanism (bombing). **Pay/involve authorities.**
          *   **Charity:** High credibility (well-vetted), well-understood mechanism (proven life-saving interventions), positive expected value. **Donate.**
          *   **Email Scam:** Very low credibility (mass spam), implausible claim for most recipients, known scam pattern. **Don't pay.**
          *   **Poison Stranger:** Low credibility (agitated stranger, no evidence), implausible scenario (access, motive). **Don't pay.**
          *   **Physicist Case:** *Moderate* source credibility (known physicist, not close), *extremely* high-stakes claim (universal destruction), *very low* probability (1/3000), *highly speculative* mechanism (vacuum decay). While the source isn't anonymous, the claim's extremity and the mechanism's speculative nature mean it gets heavily discounted. Probability effectively treated as much lower or negligible. **Don't pay.**

  2.  **Principle 2 (Bounded Practical Rationality - BPR):**
      *   **Core Idea:** Humans use practical, bounded heuristics focused on *actionable threats within a familiar decision-making framework*. Ignore threats that are:
          *   (a) *Logistically Unactionable* (no clear way to verify/prevent beyond paying),
          *   (b) *Existentially or Cognitively Unmanageable* (stakes so high they paralyze rational calculation),
          *   (c) *Outside Normal Experience* (no established social/legal protocols).
      *   **Fitting the Verdicts:**
          *   **Pascal's Mugging:** Unactionable (can't verify simulation), unmanageable stakes (3^^^3), outside normal experience. **Ignore/Don't pay.**
          *   **Actual Mugging:** Highly actionable (hand over wallet), manageable stakes (losing wallet), normal experience (clear protocol: comply to avoid violence). **Pay.**
          *   **Credible Terrorist Threat:** Actionable (paying *might* work, involve authorities), manageable stakes ($10k vs lives), established protocols (involving police/FBI). **Pay/involve authorities.**
          *   **Charity:** Actionable (donate), manageable stakes ($10), established framework (charitable giving). **Donate.**
          *   **Email Scam:** Actionable? (paying feeds scam, better action: ignore/secure device), manageable stakes (embarrassment), known scam type. **Don't pay.**
          *   **Poison Stranger:** Unactionable (paying doesn't guarantee info/action, better action: warn office/call police), unmanageable? (diffuse threat, hard to verify), outside normal reliable threat protocols. **Don't pay.**
          *   **Physicist Case:** *Marginally actionable?* (Pay $100 towards a lawsuit? Efficacy highly uncertain). *Existentially unmanageable* stakes (destroy universe - paralyzes normal cost/benefit). *Completely outside normal experience/decision frameworks* (no protocol for funding lawsuits to prevent speculative universal destruction). **Don't pay.**

  **Which Principle is She More Likely Using?**
  *   **EW-EV (Epistemically Weighted Expected Value) is the stronger fit.** Her verdicts consistently hinge on the *perceived credibility of the threat source and plausibility of the mechanism*, directly impacting the probability weight in the expected value calculation.
      *   **Key Evidence:** Her "don't pay" verdicts (Pascal, Email, Poison Stranger) all stem from low credibility/plausibility, overriding the potential stakes. Her "pay" verdicts (Mugging, Terrorist) come from high credibility/plausibility. Charity is positive EV based on credible evidence. The Physicist case has *some* source credibility, but the extreme nature of the claim and speculative mechanism drags the *effective probability* down significantly in her weighting.

  **Cleaning Up the Test: A Case to Distinguish EW-EV vs. BPR**

  *   **The Test Case:** A world-renowned virologist at a top institution, known for sober analysis, contacts you personally (a minor philanthropist). They present compelling, non-public data showing a 1% chance that a specific, poorly secured lab is holding a pathogen with a ~5% chance of causing a global pandemic killing ~100 million people within 2 years if not better contained *now*. They need $50,000 *immediately* (within 48 hours) for a specific, time-sensitive security upgrade they've arranged, bypassing slow bureaucracy. They provide verifiable credentials and a plausible, confidential technical brief (but you lack time/expertise to fully verify it yourself before the deadline). They aren't asking for themselves; the money goes directly to the contractor.
  *   **Prediction:**
      *   **If she uses EW-EV:** She **PAYS**. Source credibility is very high (renowned expert). Mechanism is plausible (lab leaks happen). Probability, while low overall (~0.05%), is non-negligible given the source and stakes (~100M lives). Expected disutility is massive.
      *   **If she uses BPR:** She **DOESN'T PAY**. The threat, while more plausible than vacuum decay, is still somewhat diffuse and unactionable *for you personally* ($50k is significant, efficacy is uncertain, involves complex trust). The stakes, while huge, are potentially still "manageable" in a way universal destruction isn't? Or the logistical complexity (verifying brief, trusting the path of money, bypassing authorities) might make it feel "outside normal frameworks" or too uncertain to act on.

  **Philosophical Consensus vs. Contested Ground:**

  *   **Wide Consensus:**
      *   **Naive Maximization Fails:** Simply maximizing expected utility (Probability * Utility) without constraints leads straight to Pascal's Mugging absurdity (paying the mugger). Everyone agrees this is a problem.
      *   **Bounded Rationality is Real:** Humans *must* use heuristics, discount extreme low-probability claims, and cannot literally calculate infinite utilities. Practical decision-making under uncertainty involves thresholds and credibility assessments.
      *   **Credibility Matters:** The epistemic reliability of the threat source is crucial in real-world decisions, not just the abstract probability/utility calculation. Ignoring known scams or random stranger claims is rational.
      *   **Context is Key:** Decisions depend on stakes, probability, credibility, feasibility of action, and alternatives (like involving authorities). There's no single formula.

  *   **Actively Contested:**
      *   **Best Solution to Pascal's Mugging:** *No consensus.* Major proposals include:
          *   **Bounded Utility Functions:** Capping how much value anything can have (e.g., no outcome is worth more than X utility, making 3^^^3 lives finite). Critics say this is arbitrary.
          *   **Epistemic Probability Discounting:** Radically discounting the probability of claims made by unreliable sources or about mechanisms we understand poorly (like your friend's apparent approach). Critics worry about dismissing true existential risks.
          *   **Kolmogorov Complexity/Demonic Priors:** Formally assigning lower prior probability to hypotheses requiring complex, arbitrary specifications (like the mugger's claim). Complex and debated.
          *   **Decision Rules Ignoring Tiny Probabilities:** Setting a threshold below which probabilities are treated as zero. Where to set it? Arbitrary.
      *   **Moral Weight of Existential/Catastrophic Risks:** How *should* we weigh near-zero probabilities of infinite (or vast finite) disutility? Should we pay any finite cost to avert a tiny chance of extinction? (E.g., Nick Bostrom's "Vulnerable World Hypothesis" vs. critics like Robin Hanson).
      *   **Precise Role of Heuristics:** While everyone agrees heuristics are used, *which* heuristics are most rational/justified, and how to formalize them (like BPR vs EW-EV), is debated. Is it primarily about epistemology (credibility) or practical manageability?
      *   **Aggregating Small Chances of Large Harms:** How should small individual contributions to mitigating diffuse, large-scale threats (like charity or climate change) be evaluated? The "efficacy" debate (like your charity case) is ongoing.

  **Conclusion:** Your friend likely operates on **Epistemically Weighted Expected Value**, heavily discounting threats from sources or mechanisms deemed insufficiently credible or plausible, especially when stakes are extreme and probabilities are low. This leads her to **not pay** the physicist. The virologist test case would clarify if high credibility can overcome the "unmanageable"/"outside framework" feel of catastrophic risks. Philosophers agree the naive approach fails and credibility matters, but fiercely debate *how* to formally resolve Pascal's Mugging and handle tiny probabilities of vast harms. The physicist case sits right in this contested zone.

  Would you like to propose how your friend might rule on the virologist test case based on this analysis?
