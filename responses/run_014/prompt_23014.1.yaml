  Okay, the user is moderating a student paper series next week with a philosopher who defends Williams-style internalism about practical reasons. They need six to eight interview questions with follow-ups that go beyond restating the view. Specific requirements include pressing on identification of the subjective motivational set without circularity, the rational extension clause's role, cases of ignorance, and criticism/moral progress.

  Hmm, this is clearly an academic philosophy context. The user wants substantive questions that challenge the internalist position. They're probably a grad student or junior faculty member preparing for a rigorous discussion. The mention of "student paper series" suggests an audience familiar with philosophical concepts but needing clear explanations. 

  I notice they specifically want four targeted pressure points: circularity in identifying motivations, over/underwork by rational extension, ignorance cases, and normative critique/moral progress. That's helpful structure. The follow-ups need to anticipate standard internalist replies and counter-challenge them - that's the hardest part. 

  For circularity: The core issue is how to define the motivational set without already assuming reasons. Internalists usually say it's descriptive (desires, commitments etc.), but then the question becomes what counts as "part of" the set. Follow-up should press on whether "dispositions" risk collapsing into circularity if defined normatively. 

  Rational extension clause: Here the tension is between making it strong enough to handle recalcitrant cases but weak enough to preserve internalism. Follow-up could target whether the "no error" requirement smuggles in external standards. 

  Ignorance cases: Williams bites the bullet here (no reason without actual motivation), but that seems counterintuitive. Follow-up should highlight how this clashes with ordinary attributions of reasons. 

  Criticism/progress: Big challenge for internalism. Standard reply is to appeal to shared frameworks or instrumental irrationality. Follow-up needs to question whether this reduces morality to group consensus or efficiency. 

  I'll structure 6 core questions hitting these plus two extras: one on alienation (classic Williams topic) and one on blame, since the user mentioned criticizing others. Each follow-up will mirror Williams' likely responses then apply pressure - e.g., for ignorance cases, granting the "no reason" position but then asking why we feel compelled to say otherwise. 

  Key is keeping questions accessible but sharp. Since it's student-focused, avoid jargon where possible. The tone should be critical but charitable - after all, we're engaging a living philosopher!
answer: |-
  Here are eight interview questions with follow-ups designed to challenge Williams-style internalism on the specific points you requested, anticipating likely replies and applying pressure:

  1.  **Question (Identification/Circularity):** Professor, you ground reasons in the agent's "subjective motivational set" (SMS). But how do we *identify* what's *in* that set without presupposing the very reasons we're trying to ground? Isn't there a risk of circularity if we say, for instance, that an agent *must* have some latent desire or commitment that *would* be triggered by the relevant facts, because that seems to define the SMS by what *would* give them a reason?
      *   *Likely Reply:* The SMS is constituted by the agent's actual, occurrent *or* dispositional desires, commitments, loyalties, projects, etc., as revealed by their patterns of action, deliberation, and emotional responses. It's a descriptive psychological fact, not defined normatively.
      *   **Follow-Up:** But doesn't identifying "dispositional" elements become problematic? If we say an agent has a dispositional desire for X *only if* they *would* be motivated to pursue X under conditions of full information and rational deliberation, haven't we just defined the disposition using the very notion of a "rational extension" that the SMS is supposed to ground? Doesn't this collapse the descriptive SMS into a normative construct?

  2.  **Question (Rational Extension - Too Much/Little Work):** The "rational extension" clause is crucial for handling cases where an agent doesn't *currently* desire the means to their end, or seems unaware of relevant facts. Could you clarify the *scope* and *limits* of this rational extension? Specifically, what kinds of reasoning or information processing does it encompass (e.g., instrumental, logical, prudential)? And crucially, does it *generate* fundamentally new motivations, or merely reveal latent ones?
      *   *Likely Reply:* Rational extension involves sound deliberation from the agent's existing S – uncovering necessary means (instrumental), avoiding logical contradictions, correcting factual errors, understanding constitutive elements of projects, and perhaps appreciating relevant similarities. It *uncovers* motivations already implicit or latent in the S, it doesn't create genuinely new, external motivations.
      *   **Follow-Up:** Doesn't this pose a dilemma? If rational extension is *too weak* (only strict instrumental/means-end), it seems inadequate for explaining many reasons we intuitively recognize (e.g., reasons stemming from moral consistency or recognizing others' plight). But if it's *too strong* (e.g., including perceiving "objective" values or universalizable principles), doesn't it risk smuggling in external reasons through the back door, violating the core internalist commitment? Where is the non-arbitrary line?

  3.  **Question (Ignorance):** Consider an agent deeply ignorant of a crucial fact: a father neglects his child's severe illness because he doesn't understand medicine and falsely believes the symptoms are trivial. He has no current desire (even dispositionally) related to seeking medical care. Intuitively, we want to say he *has a reason* to take the child to the doctor, precisely *because* he would be motivated if he knew the facts. How does internalism accommodate this intuition without appealing to an external reason?
      *   *Likely Reply:* Internalism must bite the bullet here. *Strictly speaking*, the father has no reason *until* the relevant facts connect (or could connect via rational extension) to something *already* in his S (e.g., his love for the child, his desire for the child's well-being). If his ignorance is so complete that *no* existing element of his S is even latently connected to the child's medical needs, then *he currently has no reason*. The intuition might reflect *our* perspective or what reason he *would* have *if* informed.
      *   **Follow-Up:** Doesn't this consequence severely limit the action-guiding and critical force of reasons? If the father has *no reason whatsoever* to help his dying child due to sheer ignorance, how can we meaningfully criticize his neglect as unreasonable *from his own perspective*? Doesn't this make internalism unable to capture the normative "ought" in cases of profound, non-culpable ignorance?

  4.  **Question (Criticizing Others):** Internalism grounds reasons in an agent's own S. How, then, can we legitimately criticize *another person's* motivations or actions as unreasonable or wrong *for them*? If their action flows from *their* S via sound deliberation (even if flawed by *our* lights), isn't it, by definition, reasonable *for them*? Doesn't this preclude substantive interpersonal normative criticism?
      *   *Likely Reply:* Criticism can still be internal. We can point out: 1) *Instrumental irrationality*: They are failing to take the necessary means to *their own* ends. 2) *Factual error*: Their deliberation is based on false beliefs. 3) *Inconsistency*: Their action contradicts other elements of *their own* S. 4) *Failure of rational extension*: They haven't properly deliberated from *their own* commitments (e.g., failing to see that a commitment implies another).
      *   **Follow-Up:** But doesn't this reduce moral criticism to pointing out inefficiency or cognitive error? What if someone holds deeply repugnant values *consistently* and *informed* within their S (e.g., a dedicated, well-informed racist acting on their commitment)? Internalism seems forced to say their actions *are* reasonable *for them* and we can only criticize them externally ("We don't like that"). Doesn't this undermine the idea of *objective wrongness* or *categorical* moral criticism?

  5.  **Question (Moral Progress):** Can internalism make sense of historical *moral progress*? For example, societies abandoning slavery. If reasons are always relative to the S of historical agents, wasn't slavery reasonable *for* slave owners whose S included racial superiority and economic gain? How does progress occur without appealing to reasons that *transcended* the motivational sets of past agents but were somehow "discovered"?
      *   *Likely Reply:* Progress occurs through changes *within* the S of agents and societies over time. New experiences, arguments, social movements, and rational deliberation *from existing elements* (like latent desires for consistency, empathy, or recognition of shared humanity) can trigger shifts. The reason to abolish slavery became internal *as* the S of enough people evolved. There were no "external" reasons waiting to be found.
      *   **Follow-Up:** But doesn't this imply that moral reformers (like early abolitionists) were *unreasonable* by the standards of their *own* society's dominant S? If their S contained the nascent motivations that drove them, wasn't it *also* part of the S of their opponents? Why did *their* rational extension lead to abolitionism while others' didn't? Doesn't this view risk making progress seem arbitrary or merely a shift in contingent desires, rather than a recognition of something genuinely, universally wrong with the prior state?

  6.  **Question (The "No Error" Requirement):** Williams emphasizes that the rational extension must proceed from the agent's S *in a way that involves no error*. How stringent is this "no error" requirement? Does it only rule out factual errors and logical mistakes, or does it also rule out failures to appreciate the "weight" or "importance" of certain elements within the S? If the latter, doesn't judging "importance" reintroduce an external standard?
      *   *Likely Reply:* The "no error" requirement primarily targets factual errors and logical flaws within deliberation. Judging the "weight" or "importance" must *also* be relative to the agent's S – it's about what they *actually* care about most deeply, as revealed in their patterns of concern, action, and emotion. Sound deliberation involves correctly understanding the *relative significance* of elements *within* one's own S.
      *   **Follow-Up:** Doesn't this lead to a regress? To determine the "relative significance" of elements A and B in my S, don't I need to deliberate from some *further* element C in my S that values A over B? But what determines the significance of C? If there's no foundational element or external standard, how do we avoid either an infinite regress or an arbitrary stopping point ("I just care more about A") that seems immune to rational criticism?

  7.  **Question (Alienation & External Demands):** Internalism seems to protect the agent from being subject to demands utterly alien to their identity (their S). But doesn't this also potentially shield them from *legitimate* external demands? Consider societal obligations or urgent moral imperatives (e.g., preventing a catastrophe) that don't connect to anything in a particular agent's S, even via extension. Doesn't internalism imply such agents have *no reason* to act, making collective action or holding people responsible in such cases problematic?
      *   *Likely Reply:* Internalism acknowledges this is a possible outcome. If an agent truly has *nothing* in their S that could ground a reason to respond to the demand, even through the most thorough rational deliberation, then yes, they have no internal reason to act. Coercion or persuasion might be necessary, but not an appeal to *their* reasons. This reflects the personal nature of reasons.
      *   **Follow-Up:** Doesn't this create a significant gap between what we might call the "moral landscape" (e.g., the catastrophe needs preventing) and the reasons any individual agent might have? If no single agent has a motivational set that connects to the need, does the need generate *no reasons at all*? How does internalism account for the strong intuition that some situations *objectively demand* a response, irrespective of individual psychologies?

  8.  **Question (Blame & the "Could Have Done Otherwise" Intuition):** When we blame someone, we often think they *could have acted otherwise* because they *had a reason* to do so. Internalism, however, ties reasons tightly to the agent's actual motivational structure. If an agent acts badly because their S lacks the relevant elements (even after rational extension), does it follow that they *could not have acted otherwise* (in the relevant normative sense), and thus blame is inappropriate? How does internalism reconcile with practices of blame?
      *   *Likely Reply:* Internalism complicates blame. Blame might still be appropriate if the agent *failed* in rational deliberation from their *own* S (e.g., akrasia, factual error). But if the bad action genuinely stemmed from their S via sound deliberation, then blame, understood as holding them responsible for failing to respond to a reason *they actually had*, might be misplaced. Blame might need reinterpreting (e.g., as a tool of social regulation or an expression of our own reactive attitudes based on *our* S).
      *   **Follow-Up:** Doesn't this significantly weaken the force of blame? If blame is only appropriate for failures of instrumental rationality or factual error, but *not* for acting on deeply held, consistent, but morally abhorrent values, does internalism undermine a core function of blame – namely, holding people accountable for failing to meet *moral* demands that we believe apply to them *regardless* of their contingent motivations?

  These questions are designed to push the philosopher beyond exposition and into defending the view against common and powerful objections. The follow-ups explicitly target potential weaknesses in the standard internalist responses. Good luck with the moderation!
