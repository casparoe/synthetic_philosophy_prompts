prompt: |-
  I'm in the second half of a graduate seminar in metaethics, and we have spent the past three weeks on evolutionary debunking arguments — the family of arguments that run roughly as follows: our moral judgments are produced by psychological dispositions that were selected because they made our ancestors better at cooperating, coordinating, and competing within groups; nothing in that selection story has any essential connection to the moral facts; therefore our moral judgments are unjustified, or at least we are not entitled to treat them as tracking anything real. I can rehearse the standard moves in my sleep, which is precisely what worries me. I have written a short position piece for Thursday's meeting that tries to take the debate somewhere less trodden, and I cannot tell whether it is a genuinely new move or a familiar one in new clothes. I would like you to comment on it. Specifically, I want four things: first, whether the evolutionary and psychological claims it leans on are stated in a way a careful biologist or psychologist would accept, or whether I have overclaimed what selection can be said to have done; second, whether the central distinction I draw is doing real work or merely relabeling a familiar response to debunking arguments; third, whether the conclusion actually follows from the premises as I have stated them; and fourth, whether there is an obvious objection I have failed to anticipate that would sink the whole thing. Please criticize the argument as written rather than summarizing the literature back to me — I know the literature; I want to know where this particular argument breaks.

  Here is the piece, more or less as I intend to circulate it. It opens with a distinction between shallow and deep debunking. A shallow debunking explains why some particular person or culture happens to hold some particular moral belief — why a Roman found slavery unremarkable, or why I feel a pang about a promise I broke to a friend. Shallow debunkings are everywhere and mostly harmless, because they explain the occasion of a belief rather than its content. A deep debunking claims something far stronger: that the entire faculty of moral judgment was selected for its effects on fitness, and that the selection process was indifferent to whether the judgments it produced were true. I argue that the deep version requires a premise its proponents often slide past — call it the indifference premise — namely that the moral beliefs we in fact hold would have been the same even if the moral facts had been different. I then propose what I call the counterfactual range test. Instead of asking whether our moral faculty was selected for truth-tracking, which neither side can settle, we should ask how the moral code that would have been selected varies across the space of plausible ancestral environments. If, across a very wide range of selection pressures, the code that would have been favoured still includes some form of reciprocity, some prohibition on gratuitous cruelty toward those one lives among, and some special obligation to one's dependents, then those elements are not artifacts of one contingent history, and the indifference premise is not established for them. I anticipate the reply that a fitness-tracking process would also predict convergence across environments, so that the test proves nothing; my answer is that this reply only lands if one already assumes that the fitness-relevant features of ancestral life and the truth-relevant features of morality come apart, which is the very assumption at issue. My conclusion is that debunking arguments succeed, if at all, against the thick and parochial parts of morality — purity codes, sexual mores, the moral standing of outsiders — while a thin core survives, and that the interesting philosophical question is how much a realist can do with a core that thin.

  Two things I will flag myself so that you do not have to. I do not know whether the counterfactual range test is a genuine test or just a vivid restatement of the claim that certain moral beliefs are evolutionarily inevitable. And I do not know whether the thin core I am left with is enough to sustain the position I want to end up in, or whether it quietly collapses into a reductive naturalism that surrenders everything the realist was after. Our convenor keeps insisting that we state our conclusion in a single sentence, so if you think I cannot, I would rather find that out now than on Thursday.
reasoning: |-
  Okay, let me approach this systematically. The user is presenting a sophisticated metaethics argument developed for a graduate seminar, clearly deeply engaged with evolutionary debunking literature. They're seeking targeted critique on four specific aspects: scientific accuracy of evolutionary claims, originality of their core distinction, logical validity, and unanticipated objections. 

  First, I need to parse their argument's structure carefully. The shallow/deep debunking distinction seems serviceable, but the real innovation is the "counterfactual range test" - this shifts the burden from truth-tracking to environmental robustness. Smart move, as it bypasses the circularity problem in standard debates. 

  On scientific grounding: Their phrasing about selection pressures shaping "reciprocity, cruelty prohibitions, etc." holds up. Modern evolutionary game theory (e.g., Nowak's work on cooperation) and cross-cultural anthropology (e.g., Curry's atlas of moral values) support convergence claims. But I should flag the nuance that "gratuitous cruelty" prohibitions may not extend beyond in-groups - that's a vulnerability. 

  The distinction question is thorny. While "indifference premise" isn't wholly new (Joyce touches on similar territory), packaging it with the range test creates fresh dialectical leverage. It reframes the debate from "were we selected to track truth?" to "how environmentally contingent are our core norms?" That's meaningfully different from Street's adaptive link account. 

  Logical flow seems sound until the thin/thick morality split. The jump from "some norms are robust" to "therefore not artifacts" needs more support - what if robust false beliefs exist? And the convenor's demand for a single-sentence conclusion highlights this: "Certain minimally contentful moral norms resist evolutionary debunking due to their environmental robustness" captures it, but risks overclaiming. 

  Major unanticipated objection: What if moral realism requires mind-independent truth conditions, but the "thin core" only demonstrates functional universality? This could collapse into Blackburn-style quasi-realism. Also, cultural group selection models might explain convergence without truth-tracking - Richerson's work could torpedo the argument. 

  The user's self-flags are astute. The range test isn't a silver bullet - it shows resistance to debunking, not positive justification. And yes, the thin core (reciprocity, in-group welfare) may be too meager for robust realism. They might need to bite the bullet and admit this leads to "relaxed" naturalism, not full-strength realism. 

  For Thursday, I'd suggest two tactical moves: 1) Preempt the universality/truth conflation objection by distinguishing convergence from correspondence upfront. 2) Own the naturalistic implications but argue that even a biologically constrained realism beats anti-realism. The argument's value is in shifting what needs debunking rather than vanquishing debunking entirely.
answer: |-
  Your argument is sophisticated and pushes the debate in a promising direction. Below is a targeted critique addressing your four requested points, followed by structural observations and an attempted single-sentence conclusion.

  ### 1. **Scientific Plausibility of Evolutionary Claims**  
     **Problem:** You slightly overclaim the *specificity* of what selection can predict.  
     - Evolutionary psychology supports the *general* claim that cooperation-enhancing traits (e.g., reciprocity, in-group loyalty) would converge across many environments. However, **"some prohibition on gratuitous cruelty toward those one lives among"** is ambiguous:  
       - **Accepted:** Inhibitions against *random* violence toward in-group members are robust (e.g., de Waal's work on empathy in primates).  
       - **Overclaimed:** "Gratuitous cruelty" prohibitions often exclude out-groups, slaves, or "subhumans" in ancestral contexts. Selection might favor *context-sensitive* cruelty (e.g., toward rivals).  
     - **Recommendation:** Replace "gratuitous cruelty" with **"random or counterproductive in-group violence"** to align with evidence (e.g., traits penalizing unrestrained aggression that destabilizes coalitions).

  ### 2. **Shallow/Deep Distinction & Counterfactual Range Test**  
     - **Distinction:** This is **real work**, not relabeling. Framing "indifference" as the lynchpin isolates a premise often implied but rarely dissected. It forces debunkers to engage with modal robustness.  
     - **Counterfactual Test:** This is novel in *application* to debunking. The test successfully shifts focus from *actual* truth-tracking to *modal fragility*. However:  
       - **Risk:** It *could* be mistaken for "inevitability = truth," but your reply (that convergence ≠ truth-tracking) preempts this. The test’s power is in **defeating indifference**, not proving truth.  
       - **Limitation:** It only secures **resistance to debunking**, not positive justification. This is a feature, not a bug—it’s a defensive move.

  ### 3. **Logical Validity**  
     The core argument holds if premises are granted:  
     > **P1:** Deep debunking requires the indifference premise (moral beliefs are invariant under changes in moral facts).  
     > **P2:** Counterfactual range test: If moral belief *X* is evolutionarily robust across a wide range of ancestral environments, then indifference is false for *X*.  
     > **P3:** Certain thin norms (reciprocity, restricted in-group harm norms) pass this test.  
     > **C:** Therefore, deep debunking fails for these thin norms.  
     - **Gap:** **Robustness ≠ Non-accidental Truth-Conduciveness**. Even if norms converge, they *could* be universally false (e.g., adaptive self-deception). Your reply addresses this by noting it assumes the debunker’s conclusion. *This is valid but dialectically fragile*—it risks stalemate. Strengthen by emphasizing: The test undermines the *specific* indifference required for debunking (i.e., beliefs are *unresponsive* to facts), even if it doesn’t prove truth-tracking.

  ### 4. **Unanticipated Objections**  
     **The Universal False Belief (UFB) Objection:**  
     - **How it sinks you:** Suppose moral facts are nihilistic (no moral truths exist). Your "thin core" beliefs (reciprocity, etc.) would *still* evolve because they enhance fitness. The counterfactual range test shows robustness *even if moral facts were different*—but if facts are *necessarily* empty, robustness proves nothing. Your test cannot rule out the possibility that *all* moral beliefs are adaptive falsehoods.  
     - **Why it’s lethal:** It severs the link between robustness and truth-sensitivity you need. If moral facts *could* be empty or inverted, convergence across environments is compatible with global error.  
     - **Mitigation Strategy:** Narrow the scope. Argue that *if* there are moral facts, the thin core is *candidates* for tracking them, and debunking hasn’t shown otherwise. But this retreats to a weaker position.

  ---

  ### Overall Structural Notes  
  - **Thin Core’s Viability:** Your thin core (*reciprocity + restricted in-group harm norms*) likely **collapses into reductive naturalism**. These norms align with evolutionary biology/primatology (e.g., kin selection, reciprocal altruism). A realist might struggle to ground their *normativity* in mind-independent facts—they look like adaptive behavioral guides.  
  - **"Evolutionarily Inevitable" vs. "Test":** Your test *is* substantive. It uses evolutionary theory’s own models (e.g., varying parameters in cooperation games) to assess modal fragility. This is more than restating inevitability—it’s a falsifiability criterion for debunking.  

  ### Single-Sentence Conclusion  
  > **"While evolutionary debunking arguments successfully undermine parochial moral norms, they fail against a thin core of robustly convergent norms (e.g., reciprocity and context-sensitive prohibitions on in-group harm) because their cross-environmental stability defeats the indifference premise required for deep debunking."**  

  **Why this works:** It encapsulates your modal argument, specifies the thin core’s content, and accepts debunking’s partial success—making it defensible yet ambitious.

  **Final Advice:** Preempt the UFB objection by conceding that the test only secures *deflationary* realism (the thin core reflects objective *agential reasons* in social mammals), not robust moral facts. This retains originality while dodging the fatal blow.
