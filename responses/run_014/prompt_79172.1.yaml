  Hi, I'm a senior in high school and I run the philosophy club (it's five of us plus Mr. Delgado, who teaches chem and mostly just sits there, we meet Thursdays in the back of the library). We just did Aristotle's ethics and then in psych class we did the Milgram obedience thing, and now I can't stop thinking about how those two are supposed to fit together. Last week our club president Priya said the whole situationist attack on virtue ethics only works if you already thought a virtue was a thing you'd do no matter what situation you're in, and Dan said no, it shows we should quit talking about character and start talking about situations and institutions instead, and then we argued for like an hour and got nowhere. So I want to build a decision tree (flowchart, whatever you want to call it) we can actually use at a meeting, where you start from questions a normal person can just answer honestly and end up at a position that has a name.

  Here's what I'm after. The first nodes should be questions you can answer without knowing any of the -isms, and each answer sends you down a different branch, and the leaves should be the actual positions people hold in this fight. The questions I keep circling are things like: when the studies say people act differently depending on the situation, is the claim about how often people do the thing, or about what's going on in their heads when they do it? And is the thing we're arguing about a property of a person, or of a person-in-a-situation, or of a whole group or practice or institution? And if you think a virtue has to hold steady across situations, does the evidence kill it, or does it just tell you virtue is rare? And if you think the evidence doesn't kill it, is that because the psychology is bad, or because virtue was never about behaviour rates in the first place? I'd like around 8-10 branch nodes and 6-9 leaves, and I don't want the tree to be a list of names with questions stapled on top, I want it to actually fall out of the questions.

  Please use these cases somewhere, since they're the ones we know: the obedience one; the one where people in a hurry walked past a guy slumped in a doorway on their way to give a talk; the old study where schoolkids got tested for cheating in a bunch of different ways and the same kid cheated in some and not others; and the payphone one where finding a dime in the coin return made people more likely to help someone who dropped their papers. Also add at least one case I haven't mentioned if it does a job the others can't. For each leaf, give me the name of the position (if it's usually known by a person's name that's fine, I just don't need citations or a reading list, I'm not writing a paper), one sentence on what its most awkward commitment is, and tell me when two leaves are really the same position wearing different hats, or when a combination nobody holds is sitting there empty -- and if there's an empty branch, say whether it's empty because it's incoherent, or because nobody likes it, or because nobody's tried it yet. And if your tree definately can't tell two positions apart, please just say so instead of fudging it. It's for a club of teenagers, so keep the node questions in plain language, no jargon without a quick explanation.
