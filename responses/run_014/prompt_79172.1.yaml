  Below is a decision tree that addresses the tension between virtue ethics and situationist psychology using your specified cases. It starts with accessible questions, avoids jargon, and ends at named philosophical positions. The tree has **9 branching nodes** and **7 terminal positions** (leaves), with embedded references to Milgram, Good Samaritan (Darley & Batson), child cheating studies (Hartshorne & May), and the dime study (Isen & Levin), plus the **Stanford Prison Experiment** (Zimbardo) to illustrate institutional power.

  ---

  ### **Decision Tree: Virtue vs. Situation**

  **Start Here**  
  **Node 1:** When people act cruelly (like in Milgram) or ignore someone in need (like the Good Samaritan study), is it mostly because:  
  - **(A)** They’re "bad people" who lack moral character?  
  - **(B)** Their environment/situation forced it?  
  - **(C)** It’s complicated—both matter.  

  ---

  #### **Branch A: "They’re bad people"**  
  **Node 2:** But in the child cheating studies, the same kid cheated on some tests but not others. Does this mean:  
  - **(A)** Virtues like honesty are unstable—people aren’t consistently "good" or "bad"?  
  - **(B)** The kid is still "honest" if they usually resist cheating?  

  **Node 3 (from 2A):** If virtues aren’t stable, do the obedience/helping studies prove character doesn’t exist?  
  - **(A)** Yes—behavior is too inconsistent across situations.  
  - **(B)** No—virtues exist but are easily overridden by situations.  

  **Node 4 (from 2B):** In Milgram, 65% obeyed fully. Does this mean most people lack virtue?  
  - **(A)** Yes—true virtue is rare.  
  - **(B)** No—Milgram’s situation was uniquely extreme.  

  ---

  #### **Branch B: "The situation forced it"**  
  **Node 5:** When a tiny change (like finding a dime) boosts helping, does this mean:  
  - **(A)** Situations control us in scary, unpredictable ways?  
  - **(B)** It just shows external factors nudge us, but we still have agency?  

  **Node 6 (from 5A):** Should we stop judging people and focus on fixing situations/institutions?  
  - **(A)** Yes—institutions shape behavior (e.g., Stanford Prison).  
  - **(B)** No—we can’t ignore personal responsibility.  

  ---

  #### **Branch C: "It’s complicated"**  
  **Node 7:** In the Good Samaritan study, even "compassionate" people walked past. Is virtue:  
  - **(A)** About intentions, not just actions?  
  - **(B)** A trait that only works in supportive environments?  
  - **(C)** A social practice, not a personal trait?  

  **Node 8 (from 7A):** If someone obeys in Milgram but regrets it later, are they still virtuous?  
  - **(A)** Yes—what matters is their moral reasoning, not just acts.  
  - **(B)** No—virtue requires action, not just good intentions.  

  **Node 9 (from 7B):** Does the child cheating study imply virtue needs the "right" situations to function?  
  - **(A)** Yes—virtue is person-situation interaction.  
  - **(B)** No—it shows virtue is fragile, not situational.  

  ---

  ### **Terminal Positions (Leaves)**  
  1. **Situationism (e.g., Ross & Nisbett)**  
     - *Path:* 1B → 5A → 6A  
     - **Awkward commitment:** "Character" is an illusion—your behavior is determined by external forces (e.g., dime study).  
     - *Cases used:* Milgram, Good Samaritan, Dime, Stanford Prison.  

  2. **Institutionalism**  
     - *Path:* 1B → 5A → 6A (same path as Situationism, but distinct focus)  
     - **Awkward commitment:** Fixing systems (e.g., prisons, schools) matters more than fixing people.  
     - *Note:* Shares Situationism’s path but diverges in emphasis—institutions over situations.  

  3. **Virtue as Rare (Aristotelian "fragility")**  
     - *Path:* 1A → 2B → 4A  
     - **Awkward commitment:** Most people lack real virtue—it’s for saints and heroes (e.g., Milgram "proves" widespread weakness).  

  4. **Traditional Virtue Ethics (Aristotelian)**  
     - *Path:* 1A → 2B → 4B  
     - **Awkward commitment:** Extreme situations (e.g., Milgram) don’t refute virtue—they’re unfair tests.  

  5. **Skepticism of Experiments**  
     - *Path:* 1A → 2A → 3B  
     - **Awkward commitment:** Psych studies are artificial—real virtue shows in everyday life, not labs.  

  6. **Interactionism**  
     - *Path:* 1C → 7B → 9A  
     - **Awkward commitment:** Virtue can’t be measured alone—it’s a person-situation blend (e.g., child cheating studies).  

  7. **Internalist Virtue Ethics**  
     - *Path:* 1C → 7A → 8A  
     - **Awkward commitment:** A person can be virtuous while failing to act virtuously (e.g., obeying in Milgram but feeling guilty).  

  ---

  ### **Key Notes**  
  - **Shared Positions:**  
    - *Situationism* and *Institutionalism* share a branch (1B → 5A → 6A) but differ: Situationism denies character exists; Institutionalism says institutions supersede character.  
    - *Virtue as Rare* and *Traditional Virtue* share a path until Node 4—both defend character but disagree on how common it is.  

  - **Empty Branches:**  
    - *1C → 7C → [Nothing]*: "Virtue as social practice" lacks a clear position here. It’s coherent (e.g., MacIntyre), but no major school ties it to the situationist debate.  
    - *Why empty?* Unpopular in this context—psychology focuses on individuals, not communities.  

  - **Ambiguity Alert:**  
    - The tree *can’t cleanly separate* "Virtue as Rare" from "Traditional Virtue"—both defend character but interpret empirical weakness differently.  

  - **Added Case:**  
    - **Stanford Prison Experiment** illustrates Node 6A (Institutionalism): Guards became cruel due to institutional roles, not inherent "evil."  

  ---

  ### **How to Use in Your Club**  
  1. **Print the tree** or draw it on a whiteboard.  
  2. **Start at Node 1** and have each member answer honestly.  
  3. **Follow branches** while discussing the cases.  
  4. **Debate the leaves:** Is the "awkward commitment" a dealbreaker?  
  5. **Spot overlaps:** E.g., why do Situationism and Institutionalism share a branch but feel different?  

  This framework turns abstract debates into concrete choices—no philosophy degree needed!
