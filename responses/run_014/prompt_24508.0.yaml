  I've come around to the view that fink cases and masked cases don't really threaten conditional analyses of dispostions — I think the whole thing is just an artifact of sloppy conditionals, and the fix is to tack on a ceteris paribus clause or restrict to normal conditions. So the fragile glass that someone quietly reinforces right before it hits the ground is still fragile (the fink doesn't remove the disposition), and a steel-coated glass is masked, not dispositionless. My story is that the object genuinely has the disposition throughout, and the counterfactual just needs the right qualifictions. What would count against that? I want the objections that should actually move me, ranked from fatal to merely awkward, what a committed conditionalist would concede versus dismiss, and an honest read on whether I've just made the analysis unfalsifiable. Give me exactly five points, each a sentence or two, no intro or conclusion.
