  Starting with the most fatal objection: If the ceteris paribus clause is defined as "conditions where the disposition would manifest," that's circular. The analysis then defines disposition in terms of itself, which is fatal. Next, the vacuity problem: Without clear boundaries, the clause can be adjusted to fit any outcome, making the analysis untestable. That's also a major issue.

