  We are faced with a decision procedure inspired by the "torture vs. dust specks" problem. The core issue is how to compare a large number of very small harms against a small number of very large harms. The procedure must be practical for a team of engineers to run in an afternoon and must clearly indicate when to ship, not ship, or defer to human judgment.

  The procedure will have the following steps:

  1. **Identify the alternatives**: Clearly define the two (or more) options we are comparing. Usually, we are comparing shipping a new feature (with its benefits and risks) versus not shipping (the status quo or an alternative).

  2. **Quantify the harms and benefits**: For each alternative, quantify:
     - The magnitude and probability of any harm (negative impact).
     - The magnitude and probability of any benefit (positive impact).
     - The affected population.

     We are particularly interested in two types of events:
     - **Type A**: A large number of very small harms (e.g., dust specks, small delays).
     - **Type B**: A small chance of a severe harm (e.g., medical harm, loss of workday).

  3. **Check for triviality**: 
     - For Type A (small harms): Is the harm per individual so small that it is negligible (i.e., does it fall below a "just noticeable difference" or is it something that a user would not reasonably care about)? If yes, then we can ignore that harm in the aggregate. Otherwise, we must aggregate.
     - For Type B (severe harms): We must consider the expected harm (probability * severity) and compare it to the aggregate of Type A.

  4. **Aggregate the small harms**: If the small harms are non-trivial, we aggregate them by summing over the affected population. This step assumes that the harm is additive (monotonicity) and that we can linearly sum the harm.

  5. **Compare alternatives**: Compare the total expected harm (and benefits) of the two alternatives. We require:
     - The alternative we choose must have a lower total expected harm (or higher net benefit) than the others.
     - If the harms are incommensurable (e.g., one is a delay and the other is a risk of physical harm), we must convert to a common scale (e.g., dollars, QALYs) if possible. If not, we defer to human judgment.

  6. **Check transitivity and thresholds**: 
     - We must decide whether we accept that a sufficiently large number of small harms can outweigh a severe harm (which requires accepting the premise that small harms add up without bound) or if we set a threshold beyond which we do not let small harms add up (e.g., a maximum tolerable aggregate harm for minor annoyances). This is the core philosophical choice.

  7. **Defer to human if values conflict**: If the comparison involves a trade-off between fundamentally different kinds of values (e.g., inconvenience vs. life-threatening harm) and we cannot agree on a common metric, we defer to human judgment (which might involve ethical review, management, etc.).

