  Below is a decision procedure designed for your team, followed by verdicts for your three cases. The procedure addresses the torture-vs-dust-specks dilemma by **explicitly rejecting monotonic aggregation of minor harms** (i.e., refusing to treat a vast number of trivial harms as worse than a severe harm). It prioritizes avoiding severe harms and includes conservative thresholds to prevent philosophical deadlocks. The procedure can be run in an afternoon by engineers.

  ---

  ### **Decision Procedure for AI Safety Reviews**  
  **Goal**: Decide whether to ship a feature by comparing distributed minor harms (e.g., latency, annoyances) against concentrated severe harms (e.g., medical errors, critical failures).  

  #### **Step 1: Define Harm Types**  
  - **Question**: For the release, categorize all harms as:  
    - **Minor Harm**: Inconveniences with no lasting impact (e.g., delays <5 seconds, non-disruptive errors).  
    - **Severe Harm**: Impacts with serious consequences (e.g., safety risks, significant financial/reputational damage, >1 hour of lost productivity).  
  - **Good Enough Answer**: Clear classification based on predefined thresholds (e.g., "medical advice error = severe"; "200ms latency = minor").  
  - **Stop/Handoff**: If harms can’t be classified (e.g., ambiguous severity), **defer to human**.  

  #### **Step 2: Quantify Harms**  
  - **Question**: For each harm, estimate:  
    - *Per-event probability* (if probabilistic).  
    - *Magnitude* (e.g., seconds lost, dollars lost).  
    - *Affected users/day*.  
  - **Good Enough Answer**: Use historical data, benchmarks, or conservative engineering estimates (e.g., "latency: 200ms/user/query"). Fuzzy estimates (e.g., "1-in-X chance") are acceptable if bounded.  
  - **Stop/Handoff**: If estimates lack credible bounds (e.g., "risk is between 1-in-10k and 1-in-1M"), **defer to human**.  

  #### **Step 3: Apply Triviality Threshold**  
  - **Question**: Is the *per-user* impact of each minor harm below a triviality threshold?  
    - **Thresholds**:  
      - Latency: **<1 second per user per day**.  
      - Productivity loss: **<10 seconds per user per day**.  
      - Other: **Below a "reasonable person wouldn’t care" level** (calibrate per product).  
  - **Good Enough Answer**: If below threshold, treat minor harm as **0** (i.e., **ignore in aggregation**). If above, proceed to Step 4.  
  - **Premise**: Rejects the "pile of dust specks" argument. Minor harms below this threshold **do not add up** to outweigh severe harms.  
  - **Stop/Handoff**: If harms straddle the threshold (e.g., 15 seconds/user/day), **defer to human**.  

  #### **Step 4: Calculate Net Harm**  
  - **Question**: Compute:  
    - **Total Minor Harm**: Sum of non-trivial minor harms (from Step 3) across all users.  
      - E.g., `(seconds lost/user/day) × (users)`.  
    - **Total Severe Harm**: Expected number of severe harm events.  
      - E.g., `(probability) × (users)`.  
  - **Good Enough Answer**: Use point estimates. No need for distributions.  

  #### **Step 5: Compare Alternatives**  
  - **Question**: Compare the release (A) vs. baseline (B):  
    - **Rule 1**: If A introduces **any new severe harm** (even tiny probabilities), **don’t ship** unless:  
      - The severe harm is **offset** by an equal/more severe harm reduction elsewhere (e.g., replacing a 1-in-50k risk with a 1-in-100k risk).  
    - **Rule 2**: If A only trades minor harms (e.g., latency vs. productivity), ship if **net minor harm is negative** (i.e., overall benefit).  
    - **Rule 3**: If A trades minor harm reduction for severe harm increase, **don’t ship** (conservative priority).  
  - **Premise**: Rejects **transitivity** for minor-vs-severe tradeoffs. A billion dust specks are **not worse than torture** in this model.  
  - **Stop/Handoff**: If tradeoffs violate Rules 1–3 (e.g., severe harm increase with massive minor benefits), **defer to human**.  

  #### **Step 6: Final Check**  
  - **Question**: Is there **residual uncertainty**? If uncertainty could flip the verdict, **don’t ship**.  
  - **Good Enough Answer**: Sensitivity analysis on estimates (e.g., "even if risk is 10× higher, Rule 1 still holds").  

  #### **What the Procedure Can’t Do**  
  - Handle cases where minor harms **cumulatively cause systemic risk** (e.g., eroding trust).  
  - Resolve **value conflicts** (e.g., "Is 1 severe harm = 1M minor harms?"). These are deferred to humans.  
  - Replace **domain expertise** (e.g., medical vs. financial harms).  

  ---

  ### **Verdicts for Your Cases**  
  Assumptions:  
  - 5M users/day.  
  - 10 AI interactions/user/day (for latency calculations).  
  - 8-hour workday = 28,800 seconds (for productivity loss).  
  - Triviality threshold: Latency <1s/user/day, productivity <10s/user/day.  

  | Case | Short Name               | Step Where Stopped         | Verdict       | Premise Rested On | Flip Condition (What Would Have to Be True)                                                                 |
  |------|--------------------------|----------------------------|---------------|--------------------|------------------------------------------------------------------------------------------------------------|
  | 1    | Latency Feature          | Step 3 (Triviality Threshold) | Ship         | Triviality         | If per-user latency impact exceeded threshold (e.g., >1s/user/day).                                       |
  | 2    | Fast vs. Safe Model      | Step 5 (Rule 1)            | Don’t Ship   | Conservative Priority | If the fast model reduced other severe harms (e.g., it fixed a 1-in-10k medical risk).                   |
  | 3    | Productivity Feature     | Step 5 (Rule 3)            | Don’t Ship   | Conservative Priority | If the severe harm was reclassified as minor (e.g., "costs 1 hour" not "1 day") or offset by severe harm reduction. |

  ---

  ### **Explanation for Case 3 (Productivity Feature)**  
  **Why the procedure says "don’t ship"**:  
  - Severe harm increase (5 expected workday losses/day) vs. minor benefit (30s/user/day saved).  
  - Rule 3 blocks this: **severe harms cannot be traded for minor benefits**, regardless of scale.  

  **Why you might override it**:  
  - **Business context**: If the 30s/user/day benefit translates to massive revenue (e.g., $1M/day) and the "workday loss" is easily mitigated (e.g., automatic compensation), you could argue the severe harm is overestimated.  
  - **Override process**:  
    1. Reclassify the "workday loss" as minor (if it’s a temporary hiccup, not catastrophic).  
    2. Quantify benefits in severe-harm units (e.g., "this feature prevents 10 severe harms/day elsewhere").  
    3. Escalate to leadership to approve the tradeoff (documenting the ethical rationale).  

  **Core tension**: The procedure errs on the side of caution for severe harms, but real-world decisions may require accepting small risks for large rewards. Document overrides rigorously.
