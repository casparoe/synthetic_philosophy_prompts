  | 2    | Step 5d (Comparison: severe harm increase) | Don't ship (the faster model) | Conservative rule: no increase in severe harm allowed for minor benefits | If the safer model had a severe harm risk too, or if the faster model's risk was zero, or if we didn't consider the medical harm as severe. |
  | 3    | Step 5d (Comparison: severe harm increase) | Don't ship | Conservative rule: no increase in severe harm allowed for minor benefits | If we used a conversion factor and found the benefit sufficiently large, or if the severe harm was not present. |

  For Case 3, the reviewer might override the procedure if they believe the conversion factor is valid and the net benefit is large enough. The procedure cannot make that call because it is a value judgment about the commensurability of severe harm and distributed minor benefits.

  The procedure is limited by:

     - The arbitrary choice of the triviality threshold.
     - The conservative stance on severe harm (which avoids the dust speck dilemma by not allowing minor benefits to offset severe harms).
     - The lack of consideration of benefits in Case 1 (if the harm is non-trivial, we need the benefit to offset).

  We must ensure that benefits are always quantified and included in the future.

  Finally, note that the procedure stops at Step 5d for Case 2 and Case 3 because of the conservative rule. The premise is that we do not trade severe harm for minor benefits (a threshold on the type of harm). This avoids having to accept that a big enough pile of dust specks is worse than torture.

  The procedure cannot handle:

     - Trade-offs between two different types of severe harm.
     - Benefits that are not easily quantifiable in terms of harm reduction.
     - Uncertainties in the estimates of harm.
