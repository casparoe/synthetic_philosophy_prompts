prompt: |-
  Had a four hour argument with my friend last night about national character and I'm still not over it, so I want a real answer rather than a diplomatic one. You're a philosopher who works on social ontology and on how general statements about kinds actually work — think carefully, and don't give me the balanced both-sides summary.

  The setup: my friend's line is that generalizations about peoples are all one kind of thing, differing only in how accurate they are and whether someone's using them to hurt people, and that my refusal to say some of them is squeamishness dressed up as principle. My line is that some of them aren't even candidates for being accurate. Instead of arguing abstractly, here's what I actually committed to during the night, case by case:

  1. Survey data on trust — the finding that way more people in the Nordic countries answer yes when asked whether most people can be trusted, compared with much of Latin America — I'm completely happy to assert, and I'd use it in an argument about institutions. No hesitation.
  2. "Swedes are more trusting than Brazilians." I balked, and when he said that's just (1) with the numbers deleted, I couldn't say what had gone missing. This is the one that kept me awake.
  3. "The Swiss are punctual" — fine, and I've heard Swiss people say it about themselves with real pleasure.
  4. "Germans have no sense of humour" — not fine. Except my German friends say it about themselves constantly, self-deprecatingly. So self-ascription can't be the switch, since I leaned on it in (3).
  5. He brought up the Law of Jante — the ten-rule code from a 1933 satirical novel by a Danish-Norwegian author, set in an invented small town, written as a dig at small-town conformism — and said it proves Danes have a genuine conformist streak, since they keep claiming it as their own. I said fine, they claim it, so treat it as self-description. Then I noticed that if it's evidence only because they endorse it, it isn't evidence about their character at all, and he said I'd just conceded.
  6. "Italians can't organise anything" — not fine, and not because it's more false than (3). Because of what it does in a room where someone is deciding whether to promote an Italian.
  7. Same content, different room: a Japanese colleague telling me that clients from Tokyo won't push back in a negotiation — fine, useful, we planned around it. A sales manager saying the identical thing to explain why the Tokyo office never objects — made me angry. I have no account of that difference and he says that's because there isn't one.
  8. "Milanesi are cold", regional stuff inside my own country: totally relaxed, I say it all the time, I'd defend it in public. But I'd never say the equivalent about a country. Which makes my objection look like it's about borders rather than about the form of the claim, and borders seem arbitrary here, since Milanese and Neapolitans are supposed to differ in exactly the way Swedes and Brazilians supposedly do.
  9. "The French are cynical about institutions" — I said this is fine and I'd defend it as a real explanatory fact, and he said I'd just admitted national character is coherent, only badly behaved.
  10. A claim about a group defined by migration rather than territory — say, Turks in Germany — I froze and didn't know which side I was on.

  So: is there a principle, or a small set of clauses, that captures this pattern? I want it stated precisely enough that I could apply it to a sentence I've never seen before. Brainstorm at least four candidate principles first, kill the weak ones in a line each, and keep the survivors with the case that motivates each clause. No bibliography and no citations, refer to positions and arguments and I'll chase down the reading myself.

  Please use exactly these sections, in this order:
  - **Sorting my cases** (~150 words): group the ten into kinds, and say which groupings are load-bearing.
  - **Candidate principles** (~500 words): the shortlist, the kills, and the survivor(s) stated clause by clause.
  - **The pair that breaks it** (~250 words): statistic vs. generic in (1)/(2), and self-ascription in (3)/(4) — whether any principle saves both, and what it costs to save them.
  - **New cases** (~300 words): verdicts on four I didn't list — a tourism ad built on a national trait; "the British are terrible at cooking" said by a British MP; a claim about a country's courts rather than about its people's dispositions, and whether that's a character claim in disguise; and a hedged average ("on average, tend to"). Then one case you invent that you think the winning principle gets embarassingly wrong.
  - **What I have to give up** (~200 words): which of my verdicts the survivor forces me to drop, and the single sentence I should say to him next time.
reasoning: |-
  Hmm, the user is clearly worked up about a four-hour argument on national character generalizations and wants a rigorous philosophical analysis. They've laid out ten specific cases where their intuitions clash with their friend's position, and they're demanding a principled distinction - not diplomatic platitudes. 

  First impression: this is someone who thinks deeply about social ontology but got tangled in their own intuitions. Their frustration with case 2 (Swedes/Brazilians) and the self-ascription paradox in 3/4 suggests they sense a real philosophical puzzle beneath the surface. The demand for "no bibliography" signals they want the thinking process, not academic name-dropping.

  Key tensions I notice:
  - Statistical claims (case 1) feel kosher while generics (case 2) trigger alarm bells, but they can't articulate why
  - Self-ascription validates some claims (Swiss punctuality) but not others (German humorlessness)
  - Contextual power dynamics matter (case 6 vs 7) but aren't part of the semantic content
  - Regional generalizations (Milanese) feel unproblematic while national ones don't, despite similar logic

  Their underlying ask is for a decision procedure - something they can "apply to a sentence I've never seen before." That's ambitious! Most social ontology debates don't yield neat algorithms. But the case-based method they propose (grouping → principles → stress tests) is smart.

  Biggest philosophical traps:
  1. The statistical/generic divide (cases 1-2) isn't just about numbers - it's about what licenses the generalization
  2. Self-ascription (cases 3-4) might work differently for positive vs negative traits due to cultural signaling
  3. The Jante Law case exposes how self-description can be performative rather than descriptive
  4. The migration case (Turks in Germany) blows up territorial definitions entirely

  What they might not realize they're asking: a theory of how group predicates acquire binding force. That's what separates "useful heuristic" (Tokyo negotiation styles) from "oppressive stereotype" (Italians can't organize). The winning principle will likely turn on discursive function rather than truth-conditions.

  Their friend's "all generalizations are equal" position is philosophically lazy - it ignores how predicates crystallize into social facts. But the user's own distinctions need systematizing. I'll need to murder some of their darlings (probably the French cynicism claim) to achieve consistency.

  Most delicate part: explaining why their regional/national distinction (case 8) is unsustainable without making them feel foolish. The answer might lie in scale-dependent emergence - but that could sound like hand-waving. Concrete stress tests will help.
answer: |-
  ### Sorting my cases  
  Your verdicts cluster around three axes: **form** (statistical vs. generic claims), **function** (explanatory utility vs. reductive harm), and **ownership** (self-ascription vs. external imposition). Load-bearing groupings:  
  - **Unproblematic**: (1) survey data (statistical), (3) Swiss punctuality (self-owned + institutional anchor), (7a) Japanese negotiation style (context-specific function), (8) Milanese coldness (regional scale + cultural artifact).  
  - **Rejected**: (2) Swedes > Brazilians trust (generic without mechanism), (4) Germans lack humor (negative valence + external imposition), (6) Italians disorganized (reductive + harmful function), (7b) Tokyo office (same content, harmful function), (9) French cynicism (generic national character).  
  - **Ambivalent**: (5) Jante Law (self-description as cultural performance, not evidence), (10) Turks in Germany (migration-defined groups resist territorial essentialism).  
  The critical divide is whether the claim **binds individuals to group essence** or serves as **contextual shorthand**.

  ### Candidate principles  
  **Candidate 1 (Weak Essentialism):**  
  *A generalization is valid iff it cites empirical averages and disclaims deterministic application.*  
  **Kill**: Fails (2)/(4) – averages don’t rescue generic form; ignores harm in (6).  

  **Candidate 2 (Functional Pragmatism):**  
  *A generalization is valid iff it is deployed for local coordination, not fixed attribution.*  
  **Kill**: Too permissive; allows (7b) if manager claims "coordination."  

  **Candidate 3 (Contextual Ownership):**  
  *A generalization is valid iff (a) speakers belong to the group referenced, or (b) it is statistically grounded *and* non-evaluative.*  
  **Kill**: Contradicts (3)/(4) – self-ascription validates harmful stereotypes; statistics alone insufficient for (2).  

  **Survivor: Discursive Constraint Principle (DCP)**  
  A generalization is coherent *as a character claim* iff:  
  - **Clause 1**: It **avoids generic form** (e.g., "Swedes are") unless anchored to specific institutions/practices (*motivated by (1) vs. (2)*).  
  - **Clause 2**: It is **non-detachable from its context of use** – e.g., explanatory in planning (7a) but oppressive in promotion decisions (6) (*motivated by (6)/(7)*).  
  - **Clause 3**: It **admits negation without group-defiance** – e.g., "unpunctual Swiss" isn’t oxymoronic, but "humorous German" is treated as exceptional (*motivated by (3) vs. (4)*).  
  - **Clause 4**: It **rejects territorial nationalism** for migration-defined groups (*motivated by (10)*).  

  ### The pair that breaks it  
  **(1) vs. (2)**: (1) survives (DCP Clause 1) as a statistic, not a generic. (2) violates Clause 1 – "Swedes are trusting" implies dispositional essence, divorcing trust from institutions (e.g., welfare states). **Cost**: You must deny (2) is merely "deleted numbers"; it smuggles in essentialism.  
  **(3) vs. (4)**: (3) survives (DCP Clause 3) – Swiss punctuality is tied to trains/clocks, so "unpunctual Swiss" isn’t paradoxical. (4) violates Clause 3 – "Germans have no humor" makes humor defiance of identity. Self-ascription isn’t decisive; German friends *perform* self-deprecation, reinforcing the trope. **Cost**: You must reject self-ascription as validation if it entrenches essentialism (killing (5)’s "evidence" status).

  ### New cases  
  - **Tourism ad**: "Visit passionate Spain!" → *Violates DCP Clause 2*. Detached from context; reduces to brand.  
  - **British MP**: "We British are terrible cooks!" → *Valid per DCP*. Self-ascription + institutional context (culinary history), Clause 3 allows "good British cook" without paradox.  
  - **Court claim**: "Swedish courts are efficient" → *Valid*. Describes institutions, not character (avoids Clause 1 generic trap).  
  - **Hedged average**: "Brazilians tend to distrust institutions" → *Invalid*. "Tend to" implies disposition; violates Clause 1 without institutional anchor (cf. (1)).  
  - **Embarassing case**: "Quebecers are distinct within Canada." *DCP fails*: Regional identity claims (like (8)) pass Clause 1, but risk essentialism. If a Montrealer says this proudly, DCP validates it – but it could exclude immigrants. **Flaw**: DCP struggles with *positive* essentialism.

  ### What I have to give up  
  **Survivor forces surrender of**:  
  - (9) ("French are cynical") – Violates Clause 1 (generic national character).  
  - (5) (Jante Law as evidence) – Self-ascription alone doesn’t justify character claims (Clause 3).  
  - Regional double-standard in (8) – If "Milanesi are cold" is valid, similar claims about nations *could* be if they meet DCP (e.g., "Italians value family" tied to housing patterns). But you’d likely reject it, exposing tension.  

  **Sentence for your friend**:  
  "Generalizations aren’t ‘true or false’ simpliciter; they’re tools that calcify into social facts when stripped of context – and *that* is why form and function aren’t decorative."  

  ---  
  **Core insight**: The harm isn't in inaccuracy; it's in **erasing the gap between pattern and person**. DCP forces generalizations to point beyond the group to structures, practices, or contexts that resist reification.
