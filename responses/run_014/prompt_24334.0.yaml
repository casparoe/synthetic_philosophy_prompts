answer: |-
  Here's a structured breakdown of my credence that a mutual-gains moral compromise (like your budget-splitting example) is available in **>50% of real moral disagreements** between two people with genuinely different values. I'll follow your requested decomposition, then discuss sensitivity.

  ---

  ### **Core Estimate & Decomposition**
  | **Disagreement Type** | **My Estimated Prevalence** | **Probability Mutual Gains Exist** | **Weighted Contribution** |
  |-----------------------|-----------------------------|-----------------------------------|----------------------------|
  | **Weighting Disagreement** (Same values, different weights) | 60% | 90% | (0.60 × 0.90) = **0.54** |
  | **Existence Disagreement** (One values something the other does not) | 30% | 25% | (0.30 × 0.25) = **0.075** |
  | **Lexicographic/Sacred Values** (No trade-offs allowed) | 10% | 5% | (0.10 × 0.05) = **0.005** |
  | **TOTAL** | 100% | — | **Σ = 0.620** |

  **Final Credence: 62%**  
  *(Probability that a mutual-gains compromise exists in a randomly selected moral disagreement)*.  
  → **But your question is about the *majority* of disagreements.** Assuming disagreements are independent, the probability that mutual gains are available in >50% of cases is **~95%** given the per-case probability of 62% (via binomial distribution). For simplicity, I'll use **62%** as the direct answer to your query.

  ---

  ### **Key Assumptions & Reasoning**
  1. **Weighting Disagreements (60% prevalence, 90% mutual gains)**:  
     - *Examples*: Your budget split, "How much taxes fund healthcare vs. defense?", "Charity A vs. Charity B".  
     - *Why mutual gains likely*: Both parties share the same "currency" (e.g., welfare, utility). Compromise shifts weights toward the mean, improving both perspectives (like the split-the-difference effect).  
     - *Prevalence*: I assume most everyday moral conflicts (e.g., politics, resource allocation) fall here.

  2. **Existence Disagreements (30% prevalence, 25% mutual gains)**:  
     - *Examples*: "Animal rights vs. human jobs in a factory", "Preserving a sacred site vs. building housing".  
     - *Why mutual gains rare*: If one party assigns **zero value** to the other's core concern (e.g., "Animal suffering doesn't matter"), compromise often requires conceding on something they see as morally irrelevant. Gains arise *only* if trade-offs exist *within* their value system (e.g., "I’ll accept some animal welfare if you fund job retraining").  

  3. **Lexicographic/Sacred Values (10% prevalence, 5% mutual gains)**:  
     - *Examples*: "Never kill an innocent", "Ban all abortions", "No price on human dignity".  
     - *Why mutual gains vanishingly rare*: These values are **infinitely weighted**—no material trade-offs are acceptable. Compromise is seen as betrayal (e.g., "Any abortion access is evil"). Gains only possible if the *implementation* allows face-saving (e.g., "Exemptions for rape"), but this rarely satisfies both.  

  ---

  ### **Sensitivity Analysis**
  **Most Sensitive Factor: Prevalence of Existence Disagreements**  
  - Your final credence is **highly sensitive to how common existence disagreements are**.  
  - **Why?**  
    - Weighting disagreements overwhelmingly support mutual gains (90% chance).  
    - Lexicographic disagreements are rare and inflexible (low impact).  
    - Existence disagreements are both common *and* hostile to compromise (25% chance).  

  **Quantifying the Sensitivity**:  
  - **Baseline**: 30% prevalence for existence → **62%** overall mutual gains probability.  
  - **If existence disagreements rise to 50% prevalence** (and weighting drops to 40%):  
    `(0.40 × 0.90) + (0.50 × 0.25) + (0.10 × 0.05) = 0.36 + 0.125 + 0.005 = **0.49**`  
    → **Credence drops to 49%** (below majority).  
  - **If existence disagreements fall to 10% prevalence** (weighting rises to 70%):  
    `(0.70 × 0.90) + (0.10 × 0.25) + (0.10 × 0.05) = 0.63 + 0.025 + 0.005 = **0.66**`  

  **Key Movers**:  
  1. **Evidence on disagreement types**:  
     - If studies show >40% of moral conflicts involve existence disagreements (e.g., surveys on abortion, animal rights, religious freedoms), my credence drops below 50%.  
     - If most "existence" cases are actually weighting disagreements in disguise (e.g., "I value animals less, not zero"), credence rises to ~70%.  
  2. **Mutual gains in existence disagreements**:  
     - If real cases show compromise is possible >35% of the time (e.g., bargaining theory experiments), credence could reach 65–70%.  

  ---

  ### **Caveats**
  - This assumes honest, non-strategic actors. In practice, polarization or spite lowers mutual gains.  
  - "Genuine values difference" excludes factual/coordination errors (e.g., "I thought you wanted X").  
  - **62% is optimistic** if you focus on high-stakes conflicts (e.g., war, rights), but **pessimistic** for everyday compromises (e.g., family budgets).  

  If you provide data on the distribution of disagreement types, I can refine this estimate!
