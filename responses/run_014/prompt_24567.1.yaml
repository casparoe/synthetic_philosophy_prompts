prompt: |-
  The scalable-oversight-via-debate approach is often introduced by analogy with the legal system: two trained advocates argue about some fact, a judge who does not understand the domain listens to both sides, and the better argument wins — which is said to be why debate can elicit reliable judgments even when the judge cannot independently verify the facts. The analogy is usually doing work for two claims: (1) adversarial pressure between the advocates substitutes for the judge's own understanding, and (2) the procedure is stable so long as the advocates are sufficiently capable and the judge is reasonably good at detecting which argument is stronger. How far does the analogy actually hold? Think very carefully before answering, and respond in the style of an expert in argumentation theory and AI safety. Do not cite papers or give references; work from your own understanding of the adversarial legal system and of debate-style oversight proposals.

  Return a single JSON object with exactly these fields:
  - "correspondence_table": an array of at least six objects, each with "legal_institution" (a role or feature of the adversarial legal system — you must cover at least advocate, judge, evidence, burden of proof, and appeals), "debate_role" (the corresponding element in the debate oversight setup, e.g., debater, judge model, the actual state of the world), and "intended_function" (one sentence on what the correspondence is supposed to show);
  - "breaks": an array of objects, one per disanalogy that matters for the two claims, each with "legal_institution", "disanalogy" (how the real legal system differs from the oversight setup in a way the analogy hides), and "consequence" (what that difference implies for whether debate can do the work the analogy assigns it);
  - "verdicts": an object with fields "claim_1" and "claim_2", each set to one of "survives", "partially", or "fails", plus "explanation": two to four sentences on which disanalogies do the work and what the setup would need to change for the claim to hold;
  - "better_analogy": one or two sentences on what a better analogy would be, if anything, and why it fits the oversight setup more closely.
