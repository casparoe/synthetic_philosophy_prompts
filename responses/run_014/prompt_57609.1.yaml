prompt: |-
  For eleven years I wrote the explanatory memoranda that accompany proposed rules at a state agency — the documents that tell a legislative committee what a regulation will cost, whom it will reach, and which alternatives were considered and rejected — and for the past three I have done comparable work for an organization that files comments on those rules from the outside. Last spring a book group of mine took up Orwell's 1946 essay on politics and the English language, and I found myself in the odd position of agreeing with every sentence of it while thinking that it described something adjacent to, rather than identical with, the thing I actually encounter all day. Orwell's diagnosis, as I read it, is fundamentally about texture: vagueness, worn-out imagery, diction inflated to sound impartial, the refusal to call a thing by its name, and the insincerity that generates all of these. What I keep running into has almost none of that texture. The documents I wrote and the ones I now criticize are clean, precise, and largely free of pretentious diction; their authors are competent and honest people who could define any term they use, and most of them would pass every one of Orwell's stylistic tests. And yet positions that ought to be stateable in that language turn out either not to be stateable in it at all or to be stateable only in a form that misrepresents them.

  Two instances. First: in our memoranda every countable noun denoted an intervention the agency could administer — a bed-night, a placement, a service unit, an enrollment, an episode of care — and every axis of comparison ran between such things: cost per unit, utilization, rate of completion. At a hearing on rules governing emergency shelter, a commenter argued that the people in question should be given money outright, with no program attached and nothing administered. She said this in plain English, it went into the transcript, and nobody interrupted her. But the memorandum summarizing the comment could only represent it as a request for a new program category, a form of direct financial assistance, which was then scored against the incumbent programs on the incumbent axes and lost badly. Nothing had been suppressed and no word had been smeared; the proposal had simply been absorbed by being translated into the only distinctions the framework marked. The question she was actually raising — whether a program was the right unit of analysis to begin with — had nowhere to be recorded, and any attempt to raise it inside the framework came out sounding like an argument for one more program. Second: I now sit on a hospital committee that reviews patient-safety reports. The reporting form's categories are all indexed to what the institution does — an event counts if it occurs after admission, a harm counts if it traces to an identifiable act or omission by an identifiable staff member, and anything left over goes in a residual box labeled 'other.' The consequence is that a familiar kind of bad outcome cannot be entered at all: the one produced by nobody's error and by nothing done inside our walls, but by the fact that a patient was discharged into circumstances in which the care plan could not be followed. Everyone uses the form fluently and in good faith, every box is neutrally defined, and there is not a euphemism anywhere on the page.

  So I want to know whether this has a name. People I have described it to reach for neighbors that do not seem to fit. It is not the case of a group lacking words for its own experience, because here the vocabulary is rich rather than deficient and everyone is fluent in it. It is not euphemism or doublespeak, because the terms are accurate as far as they go and are not doing any concealment. It is not the strong thesis that language bounds what can be thought, because the woman at the hearing thought and said the thing perfectly well; what she could not do was make it register as the kind of claim it was. It is not framing in the ordinary sense either, since framing is something a speaker does to an audience, whereas this is a standing property of the medium that binds the person doing the framing just as tightly as it binds everyone else — I wrote those memoranda, and the framework foreclosed my own alternatives before it foreclosed anyone else's. Orwell's invented language of total surveillance in his last novel comes closest in spirit, but as I understand the design, it works by deleting words and by welding approval and disapproval onto the ones that remain; here nothing is deleted and nothing is slanted, and the entire effect comes from where the joints of the classification fall, which distinctions are marked and which are not, and what the residual box does to whatever lands in it.

  Tell me whether an established concept covers this, and if there are two or three candidates in the neighborhood, tell me which of them the description actually falls under and precisely where it falls outside each — I want the boundaries much more than I want the label. If nothing fits, coin a term, define it so that it cannot collapse back into ideology, framing, or some slogan about media and messages, and specify the edges of the phenomenon for me. In particular: are the hearing and the hospital form the same thing, or does one involve a distortion that the other merely omits? Does a case in which the missing distinction is only awkward to express — you can say it, but it takes a paragraph and reads as a digression — count as an instance, or does the concept require that the attempt to state the position actively turn it into a different position? And is the phenomenon properly located in the vocabulary, in the forms and metrics built on top of it, or in the habits of the people using them?
reasoning: |-
  Hmm, the user has presented a fascinating linguistic conundrum rooted in their professional experience with bureaucratic language. They've spent years writing regulatory memoranda and now critique them from outside, observing a peculiar phenomenon where precise, honest language still fails to capture certain essential distinctions.

  The core issue seems to be about structural limitations rather than Orwellian linguistic flaws. The user describes two clear cases: one where a direct cash assistance proposal got funneled into "program" categories it deliberately rejected, and another where hospital safety reports can't capture systemic failures occurring post-discharge. Both involve clean language with problematic conceptual boundaries.

  What's striking is how the user meticulously distinguishes this from adjacent concepts:
  - Not vocabulary poverty (terms are plentiful)
  - Not euphemism (definitions are accurate)
  - Not linguistic determinism (people can think outside the box)
  - Not intentional framing (the system constrains even its operators)

  They're essentially describing an epistemological cage - a taxonomy so rigid that it reshapes reality to fit its categories. The hospital's "other" box and the regulatory scoring system both act as conceptual trash bins for anything that challenges the predefined ontology.

  The most precise fit appears to be "ontological gerrymandering" (borrowed from Woolgar & Pawluch) - where classification boundaries systematically exclude certain phenomena by design. The regulatory case shows active distortion (assistance becomes "program"), while the hospital form demonstrates passive omission (systemic issues become "other"). Both share the same core mechanism: reality must contort to fit the grid.

  What makes this especially pernicious is its invisibility. Unlike Orwell's "pretentious diction," this system wears the armor of precision and neutrality. The memoranda writer and hospital staff aren't dishonest - they're trapped in what the anthropologist might call a "bureaucratic episteme."

  For the coinage option, "taxonomic foreclosure" captures how categories predetermine what's legible. The key differentiator from framing is that it's structural rather than strategic - the form controls the form-filler as much as the audience.
answer: |-
  Your phenomenon has a name: **ontological gerrymandering**. It describes how **classification systems actively distort reality by their structure of inclusion/exclusion, not through dishonest language, but through the boundaries they impose on what can be recognized as a valid category or claim**. Your cases fall under this concept, but require careful boundary-drawing against neighbors:

  ### Core Concept: Ontological Gerrymandering
  1.  **Definition:** The strategic (though often unintentional) drawing of conceptual boundaries in a classification system (forms, metrics, frameworks) such that:
      *   Certain phenomena or arguments **cannot be meaningfully expressed** within the predefined categories.
      *   Attempts to express them are **forced into existing, ill-fitting categories**, fundamentally altering their nature (as in the cash assistance→program distortion).
      *   Phenomena falling outside the boundaries are rendered **invisible or "residual"** (like the hospital's 'other' box for systemic discharge failures).
  2.  **Mechanism:** The effect arises solely from **which distinctions are marked vs. unmarked** and **how residual categories function**, not from vagueness, bias, or bad faith. The language *within* the marked categories is precise and accurate.

  ### Boundaries Against Neighboring Concepts
  1.  **Orwellian Language (Vagueness/Dishonesty):**
      *   **Boundary:** Orwell targets *texture* (imprecise words, euphemism, inflated diction, insincerity). Your phenomenon has *precise* texture but a *distorting structure*. Orwell's problem is the fog; yours is the map's projection distorting the territory. The hearing commenter *could* speak plainly *outside* the system; Orwell's concern is that such plain speech *itself* becomes impossible.
      *   **Where it Fits:** Orwell's Newspeak *aims* for ontological gerrymandering by deleting words/concepts, but achieves it through linguistic violence. Your system achieves a similar *effect* (suppressing certain concepts) through structural exclusion, using precise language for the *included* concepts. Newspeak is a weaponized subset.
  2.  **Framing:**
      *   **Boundary:** Framing is typically *rhetorical* and *audience-directed* (e.g., emphasizing "estate tax" vs. "death tax"). Your phenomenon is *structural* and *constrains the speaker/framer equally*. You couldn't write the memo differently because the *framework itself* lacked the category. Framing persuades within a shared ontology; ontological gerrymandering defines what *counts* as part of the ontology for discussion.
      *   **Where it Fits:** Framing operates *on* a field of possible concepts. Ontological gerrymandering *defines the boundaries* of that field. The memorandum's translation of cash assistance into a "program" is a consequence of the gerrymandered field, not a deliberate rhetorical frame applied to an otherwise expressible idea.
  3.  **Sapir-Whorf (Linguistic Determinism - Strong Thesis):**
      *   **Boundary:** The strong thesis claims language *limits thought*. You explicitly refute this: the commenter *thought* and *stated* her position clearly. The failure was in *registering it within the institutional system*. Sapir-Whorf is about cognition; your phenomenon is about *institutional recognition and actionability*.
      *   **Where it Fits:** Weak Sapir-Whorf (language influences thought) is adjacent. The framework *shapes how participants habitually conceptualize their domain* (shelter = programs, safety = intra-institutional acts). However, the core failure is systemic registration, not individual cognition.
  4.  **Euphemism/Doublespeak:**
      *   **Boundary:** These involve *misnaming* or *obscuring* reality (e.g., "collateral damage" for civilian deaths). Your terms are *accurate for what they denote* ("direct financial assistance" *is* accurate for cash). The problem is what they *cannot* denote or how they *reconfigure* attempts to denote the excluded ("no program" becomes a type of program).
      *   **Where it Fits:** The "residual box" effect ('other') functions *like* a euphemism by making the systemic discharge problem seem like a miscellaneous anomaly, but it does this through exclusion, not misnaming. It's a euphemism *by omission* rather than commission.
  5.  **Lack of Vocabulary:**
      *   **Boundary:** This implies simple *absence* of words. You stress the vocabulary is *rich* and users are *fluent*. The issue isn't missing words for *experiences*, but missing *institutional categories* for *certain types of claims or phenomena* within the operational framework.
      *   **Where it Fits:** It *is* a lack, but a lack of *recognized conceptual slots within the system*, not a lack of linguistic tools to describe the idea abstractly.

  ### Addressing Your Specific Questions
  1.  **Are the hearing and hospital form the same phenomenon?**
      *   **Yes, with different manifestations.** Both are ontological gerrymandering.
      *   **Hearing (Cash Assistance):** Demonstrates **Active Distortion**. The excluded concept ("no program") is forcibly translated into an existing, ill-fitting category ("type of program"), fundamentally changing its meaning and making it fail on the system's metrics.
      *   **Hospital Form (Discharge Failure):** Demonstrates **Passive Exclusion/Omission**. The excluded concept (systemic failure) has *no relevant category* and gets dumped into a residual box ('other'), rendering it invisible for the intended purpose (identifying institutional safety issues). It's not distorted *into* something else; it's simply not counted *as* the thing it is.
  2.  **Does requiring a paragraph/digression count?**
      *   **Yes, it's a lesser instance, but still within the concept.** The core issue is the *structural resistance* of the system to recognizing certain distinctions as valid operational categories. If expressing the distinction requires breaking the framework's flow, labeling it awkward/digressive, and prevents it from being processed as a *central category* within the system (like "program" or "staff error"), then ontological gerrymandering is at work. The concept doesn't require the statement to be *actively transformed* (like the cash assistance case); it includes **marginalization** and **lack of operational recognition**.
  3.  **Where is the phenomenon located?**
      *   **Primarily in the structure of the forms, metrics, and frameworks built on the vocabulary.** The vocabulary itself might be neutral and rich, but the *operational system* built upon it defines which distinctions are marked as primary categories for action, measurement, and response.
      *   **Secondarily in the habits of the users.** Fluency with the system reinforces its boundaries. Users internalize "what counts" and what must be phrased within the existing boxes, making alternatives seem unnatural or irrelevant *within the institutional context*. The habit is a *consequence* and *reinforcer* of the structural gerrymandering, not its primary source.

  ### Why "Ontological Gerrymandering" Fits
  *   **Ontological:** Concerns what *exists* or *counts* within the system (programs, staff errors) vs. what is excluded or residual (non-program assistance, systemic failures).
  *   **Gerrymandering:** Implies the boundaries are drawn (often to serve a purpose, like manageability or focusing on agency actions) in a way that systematically advantages certain types of information/action and disadvantages or excludes others, similar to how electoral districts are manipulated. The boundaries are "unnatural" relative to the full reality needing representation.
  *   It captures the **structural distortion** (like gerrymandering distorts representation) caused by the **classification system's architecture**, distinct from problems of language quality (Orwell) or deliberate rhetoric (framing).

  **In essence:** You've identified a system where the map is drawn with such specific, precise boundaries that entire regions of the territory simply vanish or are forcibly relocated onto the map, not because the cartographers are lying, but because their grid wasn't designed to encompass that kind of terrain. That's ontological gerrymandering.
