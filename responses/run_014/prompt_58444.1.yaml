prompt: |-
  hey so im a junior and im running for student council president and voting is literally this friday and i need to know if im being shady or if this is just normal campain stuff

  so im running against this senior guy and my older sister saw what ive been doing and said its manipulative and i should just argue my ideas straight up. but like heres what ive been doing:

  first i posted on my story that if regular kids dont vote then only his friend group will and we will definately end up with lame stuff like longer study hall or no off-campus lunch. i dont actually know he wants that but he might, his friends are like that.

  second ive been dming a ton of freshmen like hey i remember you from orientation you were super nice, even tho i honestly barely remember anyone, just so they feel special and say theyll vote for me. it works tho.

  third i posted a screenshot of a poll where im winning like 70-30 but tbh i only sent it to my friends and my sisters friends so of course i was winning.

  the thing is i actually think id be way better, i want to keep the vending machines and make prom tickets cheaper and he doesnt care about any of that. does that make it okay?

  like which of this stuff is actually wrong and what should i change before friday?
reasoning: |-
  Okay, let me unpack this user's situation. They're a junior running for student council president against a senior, with voting happening soon. They've used three campaign tactics that their sister called manipulative: (1) framing the opponent as wanting unpopular policies like longer study hall/no off-campus lunch, (2) DMing freshmen with false personal compliments to gain votes, and (3) sharing a misleading poll showing them winning 70-30. They believe they'd be better at the role because they support popular issues like keeping vending machines and cheaper prom tickets.

  Hmm, the core tension here is between campaign effectiveness and ethical boundaries. The user seems to genuinely want validation that their tactics are normal, but also shows self-awareness by asking "which stuff is actually wrong." That's promising - they're not fully defensive. Their sister's criticism clearly stuck with them.

  Breaking down each tactic: The first one (framing opponent's policies) is spin - common in politics but ethically shaky without evidence. The second (fake DMs) is outright deception by manufacturing false personal connections. The third (skewed poll) is misinformation through selective data presentation. 

  The user's justification ("I'd be better anyway") echoes real-world political rationalizations. But student council should model better behavior. Their goals (vending machines, cheaper prom) are legit, but the methods undermine credibility. If exposed, this could backfire spectacularly before Friday's vote.

  What they really need is damage control and quick ethical pivots. The freshmen DM issue is most urgent since those conversations are recent. A public apology for the poll could turn weakness into strength. And reframing policies positively ("I'll fight to keep off-campus lunch") avoids attacking the opponent directly. 

  The user's deeper need isn't just tactical advice - they want to win without feeling like a bad person. So the solution must preserve their self-image while changing behavior. Emphasizing that ethical campaigns actually work better long-term (trust matters!) might resonate. Also, their underdog status (junior vs senior) makes authenticity a powerful card to play.
answer: |-
  Based on your description, **some of your tactics are crossing into ethically questionable territory, even if they're technically "common" in some campaigns.** Here's a breakdown of what's problematic and what you can fix before Friday:

  1.  **"Only his friends will vote..." Post:**
      *   **The Issue:** This is **fear-mongering and misrepresentation.** You're attributing policies to him (longer study hall, no off-campus lunch) that you admit you have *no evidence* he supports. You're also implying his friends are somehow illegitimate voters ("only his friend group"), which is divisive.
      *   **Why it's Shady:** You're lying about his platform to scare people into voting for you. It's manipulative.
      *   **Fix Before Friday:**
          *   **DELETE THIS POST/STORY immediately.**
          *   **Replace it with a positive message:** Focus on *your* vision! Post something like: "Hey everyone! Voting is Friday! I believe we need to protect off-campus lunch privileges and keep our vending machines. I'll also fight to make prom more affordable. Your vote for [Your Name] is a vote for these priorities!" This states *your* goals without attacking or lying about your opponent.

  2.  **DMing Freshmen with Fake Compliments:**
      *   **The Issue:** This is **disingenuous and transactional.** You're manipulating their feelings to get a vote by pretending a connection that doesn't exist ("I remember you from orientation you were super nice").
      *   **Why it's Shady:** It's using insincere flattery purely for personal gain. It exploits their desire to feel recognized. If they find out you did this to *everyone* (which they likely will), it will severely damage your credibility and make you look fake.
      *   **Fix Before Friday:**
          *   **STOP doing this immediately.** Don't send any more fake-compliment DMs.
          *   **If you DM freshmen again, be HONEST:** "Hey [Name], it's [Your Name], running for Student Council President! Voting is this Friday, and I wanted to reach out directly. My big priorities are keeping our vending machines and lowering prom ticket costs. I'd really appreciate your support! Feel free to message me back if you have any questions about my ideas." This is direct, states your platform, and asks for support honestly.

  3.  **Posting the Misleading Poll Screenshot:**
      *   **The Issue:** This is **deliberately misleading.** Presenting a poll result from *only your supporters* as if it represents the whole school is deceptive. It's an attempt to create false momentum ("bandwagon effect") and discourage his supporters.
      *   **Why it's Shady:** It's spreading misinformation to manipulate voters' perceptions of who is likely to win.
      *   **Fix Before Friday:**
          *   **DELETE THIS POST/STORY immediately.**
          *   **Replace it (Optional but Recommended):** Consider posting a brief, honest message: "Hey everyone, I shared a poll result earlier that only reflected a small group of my friends. It wasn't representative of the whole school. My apologies for any confusion. What matters most is YOUR vote this Friday! I'm working hard to earn it based on my ideas: protecting vending machines and lowering prom costs." **This shows integrity and maturity.** If you don't want to address it directly, just delete it and move on.

  **Why "I'd be better anyway" doesn't make it okay:**

  *   **Trust is Paramount:** Even if your goals are good, using shady tactics destroys trust. If people find out you lied about your opponent, sent fake compliments, or posted fake polls, they won't believe your promises about vending machines or prom either. Why should they?
  *   **The Ends Don't Justify the Means:** Winning by manipulation sets a terrible precedent and undermines the legitimacy of the student council and the election process itself.
  *   **Integrity Matters:** How you campaign reflects the kind of leader you'll be. Do you want to be known as the president who won by tricking people?

  **What to Do Before Friday (The Ethical Campaign Sprint):**

  1.  **Delete the Problematic Content:** Remove the fear-mongering post and the misleading poll immediately.
  2.  **Focus on YOUR Platform:** Flood your stories and social media with clear, positive messages about *what YOU will do*:
      *   "Vote [Your Name] to Keep Our Vending Machines!"
      *   "Prom Too Expensive? I'll Fight to Lower Ticket Costs!" (Be realistic about *how* - can you fundraise? Negotiate with vendors?)
      *   "Want Your Voice Heard? I'll Make Sure Student Council Listens!"
  3.  **Be Honest in Outreach:** If you talk to people (including freshmen), introduce yourself, state your key goals clearly, and ask for their vote honestly. No fake memories, no false promises.
  4.  **Highlight Your Perspective as a Junior:** You *can* legitimately argue that as a junior, you'll be around next year to see your plans through, unlike a senior. Frame this positively: "As a junior, I'm invested in making next year amazing for *all* of us!"
  5.  **Get Visible:** Talk to people in person (respectfully, between classes, at lunch). Wear a simple campaign button or t-shirt. Have friends do the same.
  6.  **Emphasize Participation:** Instead of scaring people about the opponent's friends, inspire people: "Your vote matters! Make sure your voice is heard on vending machines, prom tickets, and more! Vote this Friday!"

  **Conclusion:** Your sister is right that the tactics you described are manipulative. The good news is you recognized something felt off enough to ask. **Delete the shady posts, stop the fake DMs, and pivot hard to a positive, honest campaign focused squarely on your ideas.** You have popular goals (vending machines, prom costs) – sell those enthusiastically and ethically! Good luck on Friday – run a campaign you can be proud of win or lose.
