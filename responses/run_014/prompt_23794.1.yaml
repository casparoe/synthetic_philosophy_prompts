  My friend Priya is marrying Marcus and I'm giving the toast. She's a fisheries econ phd and a total Ostrom devotee -- thinks a commons governs itself fine with the right local rules. He's also an economist, wrote his whole dissertation arguing Hardin had it right, that without privatization or a real regulator a shared resource is doomed. They've been arguing about this since grad school. Half the room is their department, half is family who's never heard of a common-pool resource in their life. Write me a five-minute wedding toast that uses their years of bickering over the tragedy of the commons as the actual love story, with at least one solid joke about how splitting chores or sharing a fridge is basically a tiny commons problem -- it has to land as affection not a lecture, and it can't secretly side with either of them on who's right.
