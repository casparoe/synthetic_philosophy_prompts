  Okay, the user wants a wedding toast for Priya and Marcus. Let me start by understanding their background. Priya is a fisheries econ PhD and an Ostrom devotee, believing commons can self-govern with local rules. Marcus, also an economist, argues Hardin was right—commons need privatization or regulation. They've been debating this since grad school. The audience is split between their department colleagues who know the topic and family who don't. The toast needs to frame their argument as a love story, include a relatable joke about household commons (like chores or fridge sharing), stay neutral, and be affectionate, not lecture-y.

