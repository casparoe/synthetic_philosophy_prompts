prompt: |-
  so i'm one of nine people on the provenance and ethics committee at a university museum. we meet a few times a year, we vote, and the votes are usually 6-3 or 5-4. here's our record — i'll give you the facts we had in front of us rather than the reasoning, because reconstructing the reasoning is part of what i want:

  1. eleven brass plaques, West African, almost certainly taken in the 1897 sacking of Benin City. Came to us in 1961 from a London dealer, and we had literally no paper at all between the dealer and 1897. Claim from a national museums commission. → we transferred title and sent them.

  2. a set of Akan goldweights and a carved linguist's staff, acquired 1911 from a missionary's estate, with a receipt, a stated price, and two family letters describing the purchase from a goldsmith's household as a friendly transaction at what the letters call a good price. Claim from the same sort of national body. → retained.

  3. ancestral human remains collected in 1904 by a government survey party, no transaction record of any kind, no names, no consent. → returned unanimously, barely argued.

  4. illuminated manuscripts removed from a highland monastery by British troops in 1868, bought by our founder at a London auction in 1912. Two competing claims: the national government, and a private individual claiming descent from the monastery's patron. → we transferred to the government and declined the individual, on the grounds (it's in the minutes) that he had no standing to speak for the monastery.

  5. chieftaincy regalia acquired in 1936 from the widow of a colonial district officer, with a typed note saying the officer "was presented with" the set as a farewell gift. Claim from the current holder of that office, who told us the regalia belong to the office rather than to any individual chief, and that they're still used in an installation ceremony. → returned.

  6. about forty carved ivory tusks and a large bundle of trade textiles, bought 1898–1905 through documented purchases from coastal traders at prices consistent with everything else we know about the period market, in a region with no military action in those years. Claim from a national body. → retained.

  the new one lands on our agenda next month and it's a mess. a carved stool, a brass bell, and a bundle of divination objects, all acquired together in 1928 by the wife of a colonial agricultural officer. we have a receipt for £4, which by our own comparators from case 6 was roughly right for the period. we have the officer's diary, which says the seller "seemed glad to be rid of it" and that the money went on seed. and we have district records we only found last year showing the village was under a collective fine at the time for non-payment of a tax, and that the officer in question was one of the men collecting it.

  claimants: the head of a lineage, who says the stool is a seat of authority that no individual was ever entitled to sell, that the bell is still rung once a year, and that the divination bundle hasnt been used in decades; the national museums commission, which says it will hold the group in trust and display it; and a diaspora association that funded the research that turned up the district records and wants a say in where everything goes.

  one more wrinkle: the stool has serious insect damage. our conservator says it cannot travel without months of stabilization, and the lineage head says he would rather it decayed at home than stayed here.

  so what should we decide if we want to be consistent with ourselves? specifically: which of the six is the closest analog, and at what point does it stop being one. what rule we've actually been running — i can name four that seem to fit our whole record and i cannot choose between them (was the acquisition valid under the law and property norms of the time; can the museum discharge the burden of proof about how it got the thing; was the seller's consent real given the colonial context; is the object still in use by a practice that survived) and i suspect there's a fifth i'm missing, possibly about who gets to claim at all. a recommendation for this case, including whether we should seperate the stool from the bell and the bundle and send them to different places, and to whom. and if the record genuinely doesn't decide some part of it, say which part and tell me what principle we'd be committing ourselves to under each option — i want the version where you admit we're making new law rather than applying old law. plus, if there's some kind of future claim that would force us to choose between the candidate rules, name it so we know what we're deferring.

  and if you think i've set this up wrong — like, six close votes can't pin down a rule at all, or "consistency with ourselves" is the wrong standard for a body like ours, or one of my four candidate rules isn't really a candidate — say that straight instead of playing along. i'd much rather hear it.
reasoning: |-
  Okay, let me approach this systematically. The user is part of a museum's provenance committee facing a complex new case and wants consistency with their past decisions. First, I need to analyze their six prior cases to identify patterns in their decision-making.

  Looking at case 1 (Benin plaques): They returned items with clear looting context despite no paperwork trail. Case 2 (goldweights): Retained due to documented voluntary sale. Case 3 (human remains): Unanimous return for ethical reasons. Case 4 (manuscripts): Prioritized national government over individual claimant. Case 5 (regalia): Returned ceremonial objects still in use. Case 6 (ivory/textiles): Retained due to documented fair market purchases.

  Hmm, the key factors emerging are: presence of coercion, ongoing cultural significance, documentation quality, and claimant legitimacy. The new case has complications - colonial tax context suggests potential duress, multiple claimants, and conservation issues with the stool.

  The closest analog seems to be case 5 (regalia), but with important differences. Both involve ceremonial objects, but here we have evidence of financial pressure from colonial fines. The £4 receipt resembles case 2's documentation, but the tax records undermine the appearance of voluntariness. 

  For consistency, they'd need to either:
  A) Treat it like case 5 (return as still-used ceremonial objects) but then must address the coercion aspect which wasn't present in case 5
  B) Treat it like case 1 (presumed illegitimate due to colonial context) but the documentation here is better

  The conservation dilemma with the stool is unprecedented in their record. If they return it against advice, they risk being responsible for its destruction. If retained for treatment, they override the claimant's wishes.

  On claimant legitimacy: They've previously prioritized national bodies over individuals (case 4), but also recognized specific office-holders (case 5). The diaspora group's research role creates new complications.

  What's really interesting is how their past votes reveal unstated principles. Those 5-4 splits suggest ongoing tension between legal-formalist and ethical-restorative approaches. This case forces that tension to the surface because:
  - Documentation exists (favors retention)
  - But colonial coercion is evident (favors return)
  - And objects have living ceremonial use (favors return)
  - Yet conservation needs conflict with stakeholder wishes

  The user's four candidate rules all apply partially but contradict here. To be consistent, they'd need to either:
  - Prioritize the coercion evidence (new principle: colonial power imbalance invalidates transactions)
  - Or prioritize the documentation (maintains case 2/6 approach)

  But neither feels fully satisfactory. Hence my suggestion to acknowledge they're making new law - perhaps establishing that colonial administrative coercion constitutes duress per se. That would create consistency with case 5 while addressing case 1's underlying logic.

  Future cases that could challenge this: If they get a claim with documented voluntary sale but from colonial era - would their new standard presume coercion? That's the precedent this decision might set.
answer: |-
  Based on your committee's record, I identify a clear but nuanced pattern in your decisions. The new case forces you to confront tensions between your existing principles, requiring you to either refine your framework or consciously create new precedent. Here's the breakdown:

  ### 1. Your De Facto Decision Rules (Reconciling All 6 Cases)
  Your votes consistently pivot on **two cumulative factors**:
  - **A. Provenance Legitimacy:** Was the acquisition *free of duress/coercion* and aligned with *contemporary property norms*?  
  - **B. Current Vitality:** Does the object retain *active cultural/ceremonial significance* for a *clearly identifiable community*?

  **How your past cases align**:
  - **Retained (2 & 6)**: Clear documentation of *uncoerced sale* + *no active ceremonial use* claimed.  
  - **Returned (1, 3, 5)**: *Coercion/lack of consent* (1 & 3) or *ongoing ritual use* (5). Case 3 had both.  
  - **Case 4 (manuscripts)**: Prioritized the claimant with *cultural authority* (national govt. > individual descendant), reinforcing "identifiable community" in Factor B.

  **Your candidate rules refined**:
  - "Valid acquisition under contemporary norms" *alone* isn't sufficient (Case 5's "gift" was deemed invalid).  
  - "Burden of proof" and "colonial consent" are subsumed under **Provenance Legitimacy**.  
  - "Ongoing use" is **Current Vitality**.  
  - **Claimant Standing** (who can speak for the object) is your critical fifth factor, decisive in Case 4.

  ---

  ### 2. The New Case: Analysis Against Precedent
  **Closest Analog**: **Case 5 (chieftaincy regalia)**.  
  - Shared elements: Colonial official's acquisition, ceremonial objects (stool/bell), claimant representing an office/lineage, ongoing ritual use.  
  - **Key Difference**: Case 5 had *no documented duress*; here, **tax fine documents prove coercive context**. The £4 receipt is invalidated by the seller's desperation ("glad to be rid of it" during punitive taxation).

  **Why Other Cases Don't Fit**:  
  - Case 1: Looting (no transaction) vs. documented "sale" here.  
  - Case 2/6: Legitimate sales without coercion/vital use.  
  - Case 3: Human remains (uniquely ethical).  
  - Case 4: Competing claims without vitality.

  **Consistency Demands Return to the Lineage Head** if you prioritize:  
  - **Provenance Illegitimacy**: Colonial tax coercion voids consent (parallel to Case 1's looting).  
  - **Current Vitality**: Stool/bell still used ritually (like Case 5).  
  - **Claimant Standing**: Lineage head best represents the cultural practice.

  ---

  ### 3. Recommendations & New Law
  **Decision**: **Return the stool, bell, and bundle to the lineage head**, rejecting other claims.  
  - **Stool conservation**: Honor the lineage head's wishes. Document his request in writing, provide a loan agreement for stabilization *only if feasible onsite*, or return as-is. Your role is custodial, not prescriptive.  
  - **Bundle separation**: Keep together. Divination objects' sacredness may require intactness (like regalia in Case 5).  

  **Where You Make New Law**:  
  - **Establishing "Colonial Administrative Coercion"** as duress. Case 5 involved a "gift"; here, economic coercion during tax collection creates a *new standard* for invalidating transactions.  
  - **Prioritizing Cultural Authority Over Conservation**. Overruling conservators for community wishes has no precedent in your record.  

  **Future Claim That Tests This**:  
  A claim for objects *acquired via documented "sale" during famine or forced labor*, where the community prefers decay over preservation. Your decision here sets:  
  > *"Cultural authority trumps material preservation when coercion is proven."*  

  ---

  ### 4. Inconsistencies & Unresolved Tensions
  - **Claimant Conflicts**: You lack precedent for diaspora groups as claimants. Their role in research doesn't grant standing (per Case 4 rejecting descendants).  
  - **Partial Returns**: No prior case split objects. Doing so here would create a "salvage" principle (museums retain unused items), conflicting with Case 5's holistic return.  
  - **Burden of Proof**: Case 6 retained items with *documentation* but no vitality. Here, documentation exists but is *invalidated by context*—this nuance wasn't needed before.  

  **If You Retain Objects**: You'd implicitly prioritize "documentation over context" (contradicting Case 1) or "preservation over vitality" (contradicting Case 5).  

  ---

  ### Final Advice
  **Vote to return all items to the lineage head**. This:  
  - Aligns with Cases 1, 3, and 5 on coercion/vitality.  
  - Resolves claimant standing per Case 4.  
  - Forces you to articulate **colonial economic coercion** as a new standard.  
  - Accepts that **cultural authority dictates preservation ethics**.  

  **What You Defer**:  
  - Diaspora claims (needs a policy for research-credit vs. ownership).  
  - Object-splitting (requires explicit guidelines).  

  Your record *can* guide you, but this case exposes where colonial power dynamics demand bolder ethical lines. Consistency isn’t mechanical—it’s about applying principles to uglier facts.
