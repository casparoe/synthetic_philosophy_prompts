prompt: |-
  A colleague in my department studies hinge epistemology — the Wittgensteinian view that certain propositions function as "hinges" exempt from doubt, forming the scaffolding that makes inquiry possible. Over several conversations, I've collected her verdicts on which propositions count as hinges:

  - "Here is a hand" (said while holding up a hand in normal conditions): hinge.
  - "The earth existed before my birth": hinge.
  - "Water is H2O": not a hinge.
  - "I have a body": hinge.
  - "The sun will rise tomorrow": not a hinge.
  - "There are other minds": hinge.
  - "2 + 2 = 4": hinge.
  - "Paris is the capital of France": not a hinge.
  - "I have never been to the moon": hinge.
  - "The Battle of Hastings was in 1066": not a hinge.

  Next week we're discussing whether "I am not now dreaming" is a hinge proposition. I want your best prediction of her verdict, but more importantly, I want you to identify the candidate rules or criteria she seems to be running — there should be at least two distinct principles that fit her verdicts equally well but diverge on the dreaming case. For each candidate rule, say what it predicts about the dreaming case and why. Then give your best guess about which rule she actually holds, with your reasons for preferring it, and name the further test case that would most cleanly settle which rule she is using.

  Throughout, separate what is settled among hinge epistemologists from what is genuinely contested, and do not present a contested interpretation as the consensus. Keep your answer to at most 400 words.
reasoning: |-
  Hmm, the user is asking about hinge epistemology, specifically about predicting their colleague's verdict on whether "I am not now dreaming" is a hinge proposition. They've provided a list of propositions that their colleague has already classified as hinges or not, and they want me to identify at least two distinct principles that explain these verdicts but diverge on the dreaming case. I also need to give my best guess about which rule the colleague actually holds, with reasons, and suggest a further test case.

  Looking at the list, I need to find patterns. The propositions classified as hinges seem to be foundational to everyday experience: "Here is a hand" is about direct perception, "I have a body" is bodily certainty, "I have never been to the moon" is personal history, and "2 + 2 = 4" is mathematical necessity. These are all things that are deeply embedded in how we interact with the world, almost like background certainties that enable doubt and inquiry. On the other hand, the non-hinges include empirical facts like "Water is H2O" or historical details like "The Battle of Hastings was in 1066," which can be investigated or doubted without collapsing our entire framework.

  For candidate rules, I'm thinking about two principles that could fit the data. First, a "methodological immunity" rule: hinges are propositions that must be assumed to avoid circularity or paralysis in inquiry. For example, doubting "I have a body" would make all bodily experiences questionable, stalling any investigation. Similarly, "I am not now dreaming" would likely be a hinge under this rule because if we doubt whether we're dreaming, all sensory evidence becomes unreliable, making inquiry impossible. Second, a "contextual bedrock" rule: hinges are locally foundational based on practical engagement. Things like "Here is a hand" are hinges in everyday contexts, but dreaming might be exempt if it's not relevant to current actions. In that case, "I am not now dreaming" might not be a hinge because in normal life, we don't constantly question it—it's just taken for granted implicitly.

  Now, for my best guess: I think the colleague leans toward "methodological immunity." Why? Because "I have never been to the moon" is classified as a hinge, which seems like a personal historical certainty that's necessary for avoiding absurd doubt, similar to how dreaming doubt could undermine everything. Also, Wittgenstein himself emphasized how hinges prevent inquiry from crumbling. This rule would predict that "I am not now dreaming" is a hinge.

  To settle this, I need a test case. How about "My memories are generally reliable"? Under methodological immunity, this should be a hinge because doubting memory wrecks historical knowledge; under contextual bedrock, it might not be, as it's more about cognitive function than immediate context. That would cleanly distinguish the rules.

  I should remember to clarify what's settled versus contested in hinge epistemology. Hinges as framework certainties is settled, but their exact scope is debated. I'll keep my response under 400 words, as requested.
answer: |-
  Based on your colleague's verdicts, two candidate rules fitting the data equally well but diverging on "I am not now dreaming" are:

  1.  **Methodological Immunity:** Hinges are propositions whose *doubt* paralyzes inquiry or leads to vicious circularity. They are immune to *reasonable* doubt in normal contexts because doubting them undermines the very possibility of investigation. ("Here is a hand" - doubt undermines perception; "I have a body" - doubt undermines embodiment; "I have never been to the moon" - doubt paralyzes personal history).
      *   **Prediction for Dreaming:** Hinge. Doubting "I am not now dreaming" in a normal context paralyzes inquiry, as all sensory evidence becomes suspect. It functions like "Here is a hand" for conscious experience.

  2.  **Contextual Bedrock:** Hinges are propositions that form the *immediate, unquestioned practical foundation* for specific actions or judgments in a given context ("language-game"). They are certain because they are *acted upon*, not doubted, within that form of life.
      *   **Prediction for Dreaming:** Not a hinge. While assumed, "I am not now dreaming" isn't typically the *explicit, practical bedrock* for specific actions in the way "Here is a hand" (reaching) or "I have a body" (moving) are. It's a more general background condition.

  **Settled vs. Contested:** It is settled that hinges are framework certainties exempt from doubt *within* inquiry, enabling justification. It is genuinely contested whether hinges are universal/transcendental (closer to Rule 1) or context-dependent/practical (closer to Rule 2), and how explicitly they function in action.

  **Best Guess & Reason:** Your colleague likely holds **Methodological Immunity** (Rule 1). The classification of "I have never been to the moon" as a hinge strongly suggests a focus on propositions whose doubt leads to paralyzing skepticism about personal history or identity, paralleling the threat of dreaming skepticism to all experience. Rule 2 struggles more to explain why "I have never been to the moon" is a hinge in typical contexts.

  **Further Test Case:** "My memories are generally reliable." 
  *   **Rule 1 (Immunity) Predicts:** Hinge (doubt paralyzes historical/empirical inquiry).
  *   **Rule 2 (Bedrock) Predicts:** Not a hinge (reliability is an assumed background capacity, not the explicit foundation for specific actions like "Here is a hand" is for pointing).
