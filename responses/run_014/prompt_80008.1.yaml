  The biggest issue is framing the revenge sentence as refuting Kripke. That's misleading - it's a limitation showing no solution escapes revenge problems, not that Kripke failed. The author's conclusion that "we must accept defective sentences" is fair, but presents it as defeat rather than an ongoing research area.

