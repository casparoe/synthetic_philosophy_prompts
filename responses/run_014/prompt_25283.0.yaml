answer: |-
  Based on your detailed description and the specific philosophical puzzles you're grappling with, you're absolutely right that the standard labels ("verbal dispute," "dispute about definitions") often feel inadequate. The distinction you're seeking is central to philosophy of language, metaphysics, and methodology. Here's a breakdown of the best-established frameworks and ongoing debates:

  **1. The Closest Established Framework: Chalmers' Account of Verbal Disputes**

  David Chalmers' paper "[**Verbal Disputes**](https://philpapers.org/rec/CHAVD)" (2011) is widely considered the most sophisticated and directly relevant treatment of *exactly* the phenomenon you describe. It builds on the LessWrong taboo technique but provides a rigorous framework for diagnosis.

  *   **Core Idea:** A dispute is **substantive** if and only if it involves a disagreement that survives *conceptual clarification* and *meaning precisification* for both parties. If the disagreement *disappears* after this process, it's **merely verbal**.
  *   **The Process (Diagnostic Test):**
      1.  **Clarify Concepts:** Each side explicitly states their understanding of the key concepts/terms (`understanding`, `fair`, `belief`, `exists`). What are the necessary and sufficient conditions? What are the core criteria?
      2.  **Precisify Meanings:** For vague terms, both sides agree on precisified meanings (e.g., "By 'exists', I mean: is part of the fundamental furniture of reality independent of minds" vs. "By 'exists', I mean: is referred to successfully in our best scientific theories").
      3.  **Resolve Ambiguity:** Eliminate any ambiguity in the terms.
      4.  **Check for Residual Disagreement:** After steps 1-3, do the parties *still* disagree about some *non-linguistic* state of affairs? Do they make conflicting predictions about observable outcomes, recommend different actions, or assign different credences to the same events under the *same* conceptual scheme? If **yes**, the dispute is substantive. If **no**, it's merely verbal.
  *   **Diagnostic Signs (Pre-Taboo/Clarification):**
      *   **Central Term Dependence:** The disagreement revolves intensely around the application of *one or a few key terms* to borderline/vague cases.
      *   **Agreement on "Facts":** The parties seem to agree on all the underlying non-linguistic phenomena (e.g., how the LLM functions, the policy's effects, the mathematical proofs, the subjective feel of the mental state).
      *   **Lack of Conflicting Predictions:** Neither side predicts different observable outcomes *except* those directly tied to the application of the disputed term (e.g., they agree on what the LLM will output, but disagree on whether to *call* that "understanding").
      *   **Focus on Intuitions & Examples:** Arguments rely heavily on intuitions about whether X *counts as* Y, or finding counterexamples where the term "feels" misapplied, rather than pointing to new data.
      *   **Metalinguistic Vibes:** One party might say things like "That's not *really* belief" or "Numbers don't *literally* exist," hinting at a metalinguistic negotiation.
  *   **Your "Surviving Disagreement" Case - What's Left?** According to Chalmers, if the disagreement survives *his* process of clarification/precisification, then it **must** involve a disagreement about the non-linguistic world. Even in the math ontology case, if both sides truly agree on *all* mathematical facts, cognitive facts, and truth-values of sentences *after* precisifying what "exists" means, then the dispute *should* collapse. The persistence suggests they *haven't* fully aligned their conceptual schemes or that there *is* a deeper non-linguistic disagreement (e.g., about the nature of reality, fundamentality, or the criteria for successful reference).

  **2. When Disagreements *Survive* Clarification: What Could Be Happening?**

  Chalmers argues that a *genuine* survival means a substantive disagreement. But why might it *feel* like a survival even when Chalmers would say it shouldn't? Or what *kind* of substantive disagreement could it be?

  *   **Metalinguistic Negotiation (Plunkett, Sundell):** The dispute isn't about the world *directly*, but about **which concept is most useful, important, or appropriate to deploy** in a given context. Saying "Numbers exist!" might be advocating for prioritizing a framework where mathematical objects are treated as real entities because it's pragmatically or theoretically fruitful for science/philosophy. Saying "Numbers don't exist!" might be advocating for a more austere ontology. This is substantive *in a way* – it's about conceptual strategy, not just word meanings – but it's not about brute facts. It explains the persistence *and* the lack of conflicting empirical predictions.
  *   **Deep Conceptual/Foundational Disagreement:** The parties might agree on surface-level predictions but disagree on **fundamental explanatory frameworks or metaphysical commitments**. In the math case, one side might be committed to a Platonic realm as the ultimate explanation for mathematical truth, while the other sees it as a useful fiction grounded in human cognition. Their disagreement is about the *best explanation* or *fundamental structure* of reality, even if their predictions about theorem-proving align. This feels substantive because it touches on core philosophical commitments.
  *   **Quasi-Realism & Attitudinal Disagreements (Blackburn, Gibbard):** For evaluative terms like `fair`, the disagreement might persist as a conflict in **non-cognitive attitudes** (plans, commitments, emotions) rather than beliefs about descriptive facts. After agreeing on all the policy's effects (`policy P helps group A but burdens group B`), one side says "That's fair!" expressing acceptance of that trade-off, while the other says "Unfair!" expressing rejection. The disagreement is substantive in the sense of conflicting practical stances, even if descriptive beliefs are aligned. This applies less to `exists` but strongly to `fair`.
  *   **Carnapian Framework Relativity (Carnap):** The choice between frameworks (e.g., one including abstract objects, one excluding them) is not a matter of factual truth but of **practical expediency** ("Which framework is most fruitful/efficient for our purposes?"). The dispute survives as a disagreement about which linguistic/conceptual framework to adopt, not about facts *within* a framework (which they agree on). This is similar to metalinguistic negotiation but framed more systematically.
  *   **Disagreement about the *Nature* of the Term:** Sometimes the dispute is about **whether the term itself is descriptive or evaluative/thick**. Is `belief` purely a functional/causal state, or does it inherently involve a normative component ("ought to be responsive to evidence")? Clarifying this *is* part of the substantive debate about the nature of mind.

  **3. Where Frameworks Disagree & Why Diagnostics Fail Sometimes**

  *   **Chalmers vs. Metalinguistic Negotiation/Quasi-Realism:** Chalmers would classify purely metalinguistic or attitudinal disagreements as *not* substantive in the core sense (about the world). Advocates of metalinguistic negotiation argue these *are* substantive disagreements, just of a different kind (pragmatic/normative). This explains why some disputes *feel* substantive even after apparent clarification – they *are* substantive, just not about descriptive facts.
  *   **Diagnostic Failures: Why "Signs" Aren't Foolproof:**
      *   **"Verbal" Disputes with Practical Stakes:** Disagreeing on whether a state is "belief" might *seem* verbal, but if "belief" carries legal or moral weight (e.g., competence, responsibility), the metalinguistic negotiation *is* practically important. This makes it *feel* substantive.
      *   **"Substantive" Disputes with Linguistic Components:** A debate about quantum mechanics involves key terms (`particle`, `wave`), but clarifying them reveals deep empirical/theoretical disagreements. The linguistic element is intertwined with the substance.
      *   **Vagueness Masking Deeper Issues:** A dispute over a "vague" term might *reveal* a substantive disagreement about where the boundary *should* be drawn based on underlying principles (e.g., fairness debates often hinge on competing values revealed by borderline cases).
      *   **False Agreement on "Facts":** Parties might *think* they agree on all the underlying facts, but closer examination reveals subtle differences in their understanding of the phenomena that only surface during rigorous clarification.

  **Conclusion & Key Takeaways:**

  1.  **Chalmers' Framework is the Gold Standard:** His procedure (conceptual clarification + meaning precisification → check for residual non-linguistic disagreement) is the most precise diagnostic tool we have. If the disagreement vanishes, it was merely verbal. If it persists, it's substantive *by his definition*.
  2.  **"Surviving" Disagreements Can Be Complex:** When disagreements persist *post-clarification*, they are substantive for Chalmers. However, they may involve:
      *   **Metalinguistic Negotiation:** Disagreeing about which concept/word to use.
      *   **Foundational Metaphysical/Explanatory Commitments:** Disagreeing about the deepest structure of reality.
      *   **Non-Cognitive Attitudinal Differences:** Disagreeing in plans/emotions/commitments (especially for evaluative terms).
      *   **Framework Choice:** Disagreeing about which conceptual scheme is most pragmatically useful.
  3.  **Diagnostic Signs are Heuristic, Not Definitive:** Agreement on predictions/vagueness/lack of concrete conflicts are *indicators* of potential verbalness, but not guarantees. A dispute can be substantive *despite* these features if clarification reveals underlying non-linguistic disagreement. Conversely, a dispute can be verbal *despite* lacking some features if clarification resolves it.
  4.  **The Math Ontology Case is Paradigmatic:** If both sides *truly* agree on all mathematical facts, cognitive facts, and sentence truths *after* rigorously defining "exists," Chalmers would insist the dispute *must* collapse. Its persistence suggests either:
      *   **Incomplete Clarification:** They haven't fully aligned on what "exists" means or the implications of their definitions.
      *   **Metalinguistic Negotiation:** They are arguing about whether the term "exists" *should* be applied to abstracta, based on pragmatic/theoretical virtues of different frameworks.
      *   **Foundational Disagreement:** They disagree on what *grounds* mathematical truth (Platonic realm vs. human convention), even if they agree on *which* truths hold.

  **In essence, the line is drawn by the outcome of rigorous conceptual clarification and meaning precisification (tabooing+). If no non-linguistic disagreement survives, it was verbal. If one does, it's substantive. The "best available account" is Chalmers', though the *nature* of the residual substantive disagreement can be multifaceted (metaphysical, explanatory, pragmatic, normative, or attitudinal).** The feeling that some substantive disagreements are "about words" often stems from them being metalinguistic negotiations, which are substantive in a different sense than disagreements about brute empirical facts.
