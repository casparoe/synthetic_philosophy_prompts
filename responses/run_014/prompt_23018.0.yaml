prompt: |-
  I chair a small graduate reading group on Madhyamaka, and we've invited a visiting scholar to close out our spring series. He is best known for a recent book arguing that Nāgārjuna's catuṣkoṭi — the fourfold negation in which a thing is said to be neither existent, nor non-existent, nor both, nor neither — is not merely a reductio that leaves no positive residue, but a genuine, non-reifying doctrine of the middle way, with "emptiness" functioning as a real (if itself empty) conventional dharma rather than a mere absence. I want to prepare a Q&A that gets past the standard "emptiness is not nihilism" reassurances and presses where his position is actually vulnerable. Could you draft eight to ten questions that do that, each turning on the content of the view rather than inviting a restatement of it?

  I'd like at least one question pressing the self-referential worry — if all four horns fail, is "emptiness" a fifth, and how does the "emptiness of emptiness" passage in the thirteenth chapter stop the resulting regress without smuggling in a positive ground — and at least one on why the "both" and "neither" horns are rejected on their own merits rather than as mere logical consequences of rejecting the first two; in particular, I want to test whether rejecting "both" really entails rejecting "neither," since a thing could be neither existent nor non-existent and yet not be "both." Please also include one question on the criterion that makes a conventional truth merely conventional rather than ultimately false, given that all four horns are denied. For each question, give a short follow-up keyed to the answer he is most likely to give, so I can keep the exchange moving if he deflects.
reasoning: |-
  Okay, the user chairs a Madhyamaka reading group and is preparing for a Q&A with a visiting scholar who has a unique interpretation of Nāgārjuna's catuṣkoṭi. The scholar argues that emptiness isn't just a negating tool but a genuine, non-reifying doctrine where emptiness functions as a real conventional dharma. The user wants incisive questions that probe vulnerabilities without letting the scholar retreat into standard "emptiness isn't nihilism" defenses.  

  First, I need to unpack the scholar's position clearly. He rejects the typical reductio reading where catuṣkoṭi leaves no positive residue. Instead, he sees emptiness as a positive conventional truth—real yet empty. The user specifically wants questions targeting: (1) self-referential problems (how emptiness avoids being a fifth horn), (2) independent rejection of "both" and "neither" horns (why "neither" isn't just a consequence of rejecting the first two), and (3) criteria for conventional truth given all four horns are denied.  

  For self-reference: The regress worry is central. If emptiness is a fifth position beyond the four negations, how does "emptiness of emptiness" not imply infinite regress or a hidden ground? The scholar might invoke non-conceptual realization, so the follow-up should press how language avoids reification here.  

  For "both/neither": The user suspects rejecting "both" doesn't logically force rejecting "neither." The scholar must show why "neither" is independently incoherent (e.g., as covert substantialism). Follow-up could challenge if this overextends to deny everyday "neither" usages.  

  For conventional truth criterion: Since all four horns fail, how does conventional truth escape being "ultimately false"? The scholar might appeal to pragmatic function, so follow-up should ask how functionality prevents collapse into relativism.  

  Other angles:  
  - How this view differs from Yogācāra's mind-only (to test crypto-idealism).  
  - Whether "merely conventional" implies epistemic limitation (risking a subtle ground).  
  - If Madhyamaka is now a positive system, why Nāgārjuna denies all philosophical views.  
  - How dependent origination avoids becoming a foundational principle.  

  User's deeper needs: They want to expose tensions in the scholar's "positive conventional emptiness"—likely feeling it risks smuggling in substance. The questions must force the scholar off script, avoiding doctrinal platitudes. Tone should be collegial but relentless.  

  Structuring: Lead with self-reference (most critical), then "both/neither," then conventional truth. Follow-ups should anticipate deflection and pivot to implications (e.g., "If you say X, doesn't that imply Y?").  

  Finally, ensure questions stand alone—no jargon dumps—and each has a surgical follow-up. The goal isn't gotcha but to clarify if this interpretation holds under pressure.
answer: |-
  Here are eight targeted questions designed to probe the vulnerabilities in your visiting scholar's "positive conventional emptiness" interpretation, each with a concise follow-up to counter deflection. They focus on internal coherence, logical necessity, and practical implications, avoiding restatement invitations:

  1.  **Self-Referential Regress & the Fifth Horn:**
      *   **Question:** If the catuṣkoṭi exhaustively negates *all* possible ontological positions regarding any entity (existent, non-existent, both, neither), how does "emptiness" itself avoid becoming a *fifth* ontological category? Specifically, how does your reading of Chapter XIII ("Examination of Phenomena") resolve the regress initiated by "emptiness is empty" without implicitly relying on a non-empty ground (e.g., the negation process itself, or conventional functionality)?
      *   *Likely Deflection/Answer:* "Emptiness is not a *thing* or position; it's the *mode* of being of dependently arisen phenomena, or the non-findability under analysis." / "The emptiness of emptiness prevents reification."
      *   **Follow-Up:** If emptiness *is* a genuine conventional dharma (as you argue), isn't its *own* emptiness then a property requiring the same exhaustive negation? Doesn't saying "emptiness is empty" *initiate* a regress (emptiness₁ is empty₂, emptiness₂ is empty₃...), and how does Chapter XIII's negation definitively *stop* this without positing a terminus (like the conventional world's functional reality) that itself escapes the fourfold negation?

  2.  **Independent Rejection of "Neither":**
      *   **Question:** You argue that rejecting "both existent and non-existent" *entails* rejecting "neither existent nor non-existent." Could you clarify the *independent* logical flaw in the "neither" horn itself? Why couldn't "neither" represent a simple rejection of the available categories (like the position of a skeptic or mysterian), rather than being necessarily incoherent *solely* because "both" is rejected? Isn't rejecting "both" and "neither" simultaneously a consequence of the mutual exclusivity of "existent" and "non-existent," not a separate flaw in "neither"?
      *   *Likely Deflection/Answer:* "The 'neither' horn implies a substratum or ineffable essence beyond the dichotomy, which is still reification." / "'Neither' is parasitic on affirming the dichotomy as exhaustive; rejecting the dichotomy dissolves 'neither'."
      *   **Follow-Up:** Doesn't this critique risk making the *dichotomy itself* ("existent/non-existent") an unassailable ultimate framework? If "neither" is flawed *because* it tries to be outside this dichotomy, doesn't that presuppose the dichotomy's ultimate validity? How does Madhyamaka, which undermines all dichotomies, avoid this trap without making the rejection of "neither" purely derivative of rejecting "existent" and "non-existent"?

  3.  **Criterion for Merely Conventional (vs. Utterly False):**
      *   **Question:** Given that *all four* positions of the catuṣkoṭi regarding inherent existence are negated for any putative entity, what specific *criterion* distinguishes a "merely conventional truth" (like emptiness, on your view) from something that is simply *false* or incoherent at all levels? If all ontological claims are equally denied, what positive mark identifies a dependently arisen conventional as *valid* convention rather than sheer error?
      *   *Likely Deflection/Answer:* "Conventional truth is defined by unimpeded worldly function (*vyavahāra*) and non-contradiction by conventional cognition (*lokaprasiddha*)."
      *   **Follow-Up:** Doesn't this criterion risk being either circular (we validate conventions by... convention) or vulnerable to relativism (any functioning worldview is 'true')? More crucially, *why* does dependent origination, which also implies lack of inherent existence and thus falls under the catuṣkoṭi negation, *itself* provide the basis for validating conventions? Isn't it also subject to the same negation?

  4.  **Emptiness as Positive Dharma vs. Reification Risk:**
      *   **Question:** If emptiness is posited as a genuine, non-reifying conventional dharma, how does this *pragmatically* differ from subtly reifying it? What concrete methodological or experiential safeguard does this view offer against practitioners (or the tradition itself) treating "emptiness" as a subtle ground or essence, compared to the reductio reading which explicitly leaves no residue?
      *   *Likely Deflection/Answer:* "The emptiness of emptiness actively prevents reification. It's understood as the *quality* of dependently arisen things, not a separate entity."
      *   **Follow-Up:** If emptiness is a *conventional dharma* with real functional efficacy (as you posit), doesn't this inevitably grant it a degree of conceptual solidity in practice? How does emphasizing its conventional reality *better* prevent the subtle clinging Nāgārjuna warns against than the reductio approach, which relentlessly undermines *any* position, including 'emptiness'?

  5.  **The Necessity of Negating "Both":**
      *   **Question:** Beyond the logical consequence of rejecting existence and non-existence individually, what is the *independent* incoherence Nāgārjuna identifies in the "both existent and non-existent" horn? Why couldn't something be existent in one respect/context and non-existent in another, coherently falling under "both," without implying inherent existence?
      *   *Likely Deflection/Answer:* "The 'both' horn implies inherent existence in contradictory modes simultaneously, which is absurd. 'Respects' imply inherent characteristics."
      *   **Follow-Up:** Doesn't conventional reality *depend* on precisely this kind of "in one respect... in another respect" reasoning (e.g., parts/whole, cause/effect)? If "both" is incoherent *because* it requires inherent characteristics, doesn't that render conventional reality incoherent *by your own logic*, unless you grant conventional characteristics a different, non-inherent status? How does this differ from the reductio view?

  6.  **Distinction from Yogācāra:**
      *   **Question:** How does your view, where emptiness functions as a real (though empty) conventional principle grounding the coherence of phenomena, materially differ from Yogācāra's *pariniṣpanna* (consummate nature) or *ālayavijñāna* (storehouse consciousness), which also attempt to provide a non-substantial yet real basis for conventional reality?
      *   *Likely Deflection/Answer:* "Madhyamaka rejects any substrate, even a mental one. Emptiness is the *absence* of inherent existence *in* phenomena, not a basis *for* phenomena."
      *   **Follow-Up:** If emptiness is a *conventional dharma* with genuine functional reality (as you argue), doesn't it *de facto* become a basis for phenomena's coherence and function in a way analogous to *pariniṣpanna*, even if formally defined as an absence? Isn't the functional role the crucial point of similarity?

  7.  **Practical Implications of "Merely Conventional":**
      *   **Question:** If emptiness itself is "merely conventional," what does "merely" signify here? Does it imply an *epistemic limitation* (we can't grasp the ultimate, only conventions) or an *ontological status* (there is nothing beyond dependent arising)? How does your view avoid collapsing into a form of conventionalism where "emptiness" is just a useful fiction?
      *   *Likely Deflection/Answer:* "'Merely' signifies that it lacks inherent existence and is dependently designated. It's not fictional because it functions reliably within interdependence."
      *   **Follow-Up:** If its validity rests *solely* on reliable function within interdependence, doesn't this make emptiness's status contingent and potentially variable across contexts, undermining its role as the fundamental characteristic of *all* phenomena? How is this not relativism?

  8.  **Madhyamaka as a Philosophical Position:**
      *   **Question:** Nāgārjuna states he has "no thesis" (*pratijñā*). If emptiness is a genuine, non-reifying conventional dharma constituting a positive doctrine of the Middle Way, how is this *not* a philosophical thesis that Madhyamaka asserts, contradicting Nāgārjuna's claim?
      *   *Likely Deflection/Answer:* "It's not asserted as an ultimate truth or independent entity. It's a corrective insight into the nature of conventions, not a metaphysical claim."
      *   **Follow-Up:** But you *do* assert it as a *conventional truth* with specific, positive content ("genuine doctrine," "real conventional dharma"). Doesn't claiming *any* doctrine, even a conventional one about the nature of reality, constitute a "thesis" (*pratijñā*) that Nāgārjuna explicitly disavows? How does labeling it "conventional" absolve it of being an asserted position?

  **Key Principles Used:**
  *   **Focus on Internal Tension:** Questions force confrontation between the "positive conventional" aspect and core Madhyamaka tenets (no thesis, no inherent existence, emptiness of emptiness, avoidance of extremes).
  *   **Demand Logical Specificity:** Pressing on *why* specific horns are rejected independently, and the *criterion* for conventional validity.
  *   **Highlight Practical/Existential Risk:** Probing how the view avoids subtle reification in practice.
  *   **Comparative Challenge:** Using Yogācāra as a foil to expose potential similarities to rejected positions.
  *   **Follow-Ups Target Common Deflections:** Anticipating answers like "it's conventional," "it functions," "emptiness of emptiness prevents reification," and pushing on their implications immediately.
  *   **Respectful Collegiality:** The phrasing assumes scholarly competence but presses for clarity on contentious points.

  Use these to steer the Q&A beyond exposition and into a productive critical engagement with the unique aspects of the scholar's interpretation. Good luck with the session!
