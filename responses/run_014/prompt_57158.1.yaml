answer: |-
  ### Participant Handout: Decision Tree Exercise

  **Instructions:** Answer each question based on your beliefs about the "ladder" life-evaluation measure. Choose the option that best reflects your view. Record your answers (e.g., 1A, 2B, etc.).

  1.  **Wording Effect:** A pilot study tested two versions of the ladder question. Version A: "Imagine a ladder with steps numbered from 0 at the bottom to 10 at the top. Suppose the **best possible life for you** is at the top. Where on the ladder do you feel you personally stand?" Version B: "...Suppose the **best life you could personally hope for** is at the top..." The same sample scored an average 1.4 points higher with Version B. Which interpretation is *more concerning* for using the ladder score?
      *   A) The large wording effect shows the question is too unstable to measure anything meaningful reliably.
      *   B) Version A ("best possible life") is the correct standard; Version B lowers the bar, inflating scores artificially. The effect reveals a sensitivity problem.
      *   C) The effect is expected; both versions measure valid but subtly different judgments (e.g., aspiration vs. ideal). Neither is inherently "wrong."
      *   D) The effect highlights that people anchor to personal hopes, not abstract ideals. This makes the score *more* meaningful as a gauge of perceived life quality.

  2.  **Self-Report Authority - Recession Case:** Country X endured a severe recession. A decade later, its economy recovered fully (GDP, unemployment back to pre-recession levels). However, its average ladder score remains significantly lower than Country Y, which never suffered such a shock. Country X's citizens report persistent anxiety about future shocks. Is this lower score a valid reason to conclude Country X's residents are *worse off* overall, even economically equal?
      *   A) No. The economic facts are objective. The lower score only reflects subjective feelings, perhaps irrational anxiety, not actual well-being.
      *   B) Yes. If people consistently report lower evaluations of their lives, even amidst recovery, that *is* a crucial aspect of their well-being being compromised.
      *   C) Partly. It signals worse psychological adaptation or trust, which matters, but shouldn't override objective economic parity as the primary indicator of welfare.
      *   D) It highlights a limitation: The score captures psychological states (like anxiety) well, but "well-being" includes more (like economic security itself).

  3.  **Comparability - Survey Mode Effect:** Country Z moves its survey from expensive face-to-face interviews to cheaper telephone interviews. Its average ladder score increases slightly, moving it up two places in the international ranking. No other known changes in lives or policies occurred. Does this mean Country Z's citizens genuinely became happier relative to others?
      *   A) No. The mode change likely introduced a systematic bias (e.g., social desirability differences). The ranking shift is artifactual and invalid for comparison.
      *   B) Probably not. While *within*-country trends might still be useful if mode is consistent, comparisons *across* countries using different modes are unreliable.
      *   C) It's unclear, but likely not. This shows the measure is too sensitive to non-life factors to trust cross-national comparisons meaningfully.
      *   D) Yes, if the mode change is now standard. Comparisons require methodological parity; this shift breaks it, making the ranking change meaningless.

  4.  **Aim: Raise Happiness? - Target Case:** A district office is given a specific target: raise its average annual ladder score by 0.5 points within 3 years. They focus intensely on this: launching PR campaigns about appreciating small joys, offering free mindfulness apps, organizing more community festivals. After 3 years, their measured score increases by 0.6 points. Is this outcome inherently *good*?
      *   A) No. This is classic Goodhart's Law ("When a measure becomes a target, it ceases to be a good measure"). The increase likely reflects coaching, changed framing, or reporting bias, not deeper well-being gains.
      *   B) Possibly, but risky. If the activities genuinely improved aspects of life (e.g., community connection), it's good. But targeting the *score* directly invites distortion and misses the point.
      *   C) Yes. The score rose, and the interventions (like community events) sound positive. This shows the target focused effort on improving lived experience.
      *   D) Irrelevant. The state shouldn't be "raising happiness" like this at all. It should focus on justice, rights, and opportunity, not subjective states.

  5.  **Aim: Climb Rankings? - Motivation:** Ministers argue that aiming to top the international happiness ranking is worthwhile, even if the ranking is imperfect. Their primary stated reason is: "Being high on this visible, public scoreboard signals national success globally and motivates positive internal civic engagement and pride." Is this a *valid and sufficient* reason to prioritize climbing the ranking?
      *   A) No. If the ranking is flawed or measures something debatable, climbing it through PR or measurement changes is misleading and potentially harmful, regardless of motivation.
      *   B) No. The motivation is superficial. The state's duty is improving actual lives based on sound welfare concepts, not chasing symbolic victories on a questionable leaderboard.
      *   C) Yes, partly. The motivational and signaling value is real, and the ranking uses *some* relevant data. It's a pragmatic, if imperfect, focal point for policy discourse.
      *   D) Yes, strongly. Public, contestable metrics like this, even if noisy, are crucial for democratic accountability and benchmarking progress. Opacity is worse than distortion.

  ---

  ### Key: Mapping Answers to Named Positions

  **Logical Axes & Independence:**
  1.  **Nature of Happiness (H):** (1) Hedonic (Occurrent Feelings), (2) Evaluative (Life Judgment), (3) Preference Satisfaction, (4) Objective List. *(Largely independent of others)*
  2.  **Self-Report Authority (S):** Does a self-report ladder score have privileged authority over measuring the relevant aspect of H? *(Depends partly on H)*
  3.  **Cross-Population Comparability (C):** Can ladder scores be meaningfully compared across different populations (cultures, languages, times)? Ordinal? Cardinal? *(Depends heavily on S and specifics of measure)*
  4.  **State Aim: Raise Happiness (R):** Should the state actively try to increase citizens' happiness (as measured or defined)? *(Depends on H, S, C, and political philosophy)*
  5.  **State Aim: Climb Rankings (CR):** Should the state actively try to improve its position on the international happiness ranking? *(Depends on C, R, and views on the ranking's value/purpose)*
  *Axes are interconnected but distinct. S depends significantly on H. C depends critically on S and measurement properties. R and CR depend on prior axes but represent distinct policy aims (improving welfare vs. improving rank).*

  **Decision Tree Paths to Named Positions:**

  *   **1A OR 1B + 2A + 3A OR 3C + (4A OR 4D) + (5A OR 5B) → "Instrument Skeptic / Meaningless Metric":** Believes the ladder fails as a reliable or valid measure of any coherent concept of well-being (H). Wording effects (1A/B), rejection of self-report authority especially against objective facts (2A), and mode effects (3A/C) demonstrate fundamental flaws. Targeting (4A/D) and chasing rankings (5A/B) are therefore misguided or dangerous. *(H: Any, but S: Low/None, C: None)*
  *   **1B + 2B + 3B + 4C + 5C → "Pragmatic Diagnostic (Rankings Skeptic)":** Believes the ladder measures a meaningful global life evaluation (H: Evaluative/Judgment). Self-reports have authority (2B). Comparisons *require* strict methodological parity (3B) – mode changes break this. Can be a useful diagnostic tool within-country (4C) but chasing the *ranking* (5C) is only weakly justifiable for its discourse value, not taken literally. *(H: Evaluative, S: High, C: Conditional, R: Cautious Yes, CR: Weak Yes)*
  *   **1D + 2B + 3A OR 3C + 4B + 5A → "Tolerable Diagnostic, Corrupting Target":** Believes the ladder measures perceived life quality anchored to personal hopes (H: Preference/Adapted Judgment) with self-report authority (2B, 1D). However, it's highly vulnerable to bias and non-comparable (3A/C). Useful as a broad diagnostic signal (4B) but targeting it directly (4B) or chasing rankings (5A) inevitably corrupts the measure and distorts policy. *(H: Preference/Adapted Eval, S: High, C: Low/None, R: Indirect, CR: No)*
  *   **1C + 2D + 3B + 4D + 5? → "Captures Affect Proxy, Not Happiness":** Believes the ladder responses are heavily influenced by recent mood/affect (H: Hedonic component) (2D), not a stable evaluation. Different wordings probe related but distinct feelings (1C). Requires method parity for comparability (3B). The state shouldn't target this subjective state (4D) – focus on objective goods. Ranking aim (5?) depends on view of its objectivity signal. *(H: Hedonic influence strong, S: Limited (captures affect), C: Conditional, R: No, CR: ?)*
  *   **1? (Not A) + 2B + 3D + 4A OR 4B + 5D → "Rankings as Accountability Tool":** Believes the ladder measures a meaningful evaluative judgment (H: Evaluative) with self-report authority (2B). Method changes invalidate comparisons *only if* not standardized (3D - sees the mode effect as a *fixable* comparability break, not inherent flaw). While wary of targeting the score directly (4A/B - Goodhart risk), sees immense value in the *public ranking* itself (5D) as a driver of accountability and transparent benchmarking, even if imperfect. *(H: Evaluative, S: High, C: Achievable with Standards, R: Ambivalent/Cautious, CR: Strong Yes - for transparency)*
  *   **(1B OR 1C) + 2C + 3B + 4D + 5? → "Objective List Advocate":** Believes well-being (H: Objective List) includes factors beyond subjective states. The ladder score reflects subjective judgment/affect (2C), useful as *one* indicator alongside others. Requires method parity for comparability (3B). The state's primary aim should *not* be raising subjective scores (4D) but ensuring objective conditions (justice, health, opportunity) are met. Chasing rankings (5?) is secondary to ensuring objective welfare. *(H: Objective List, S: Moderate (measures subjective component), C: Conditional, R: No, CR: ?)*
  *   **1? (Not A) + 2B + 3A OR 3C + 4D + 5B → "Anti-Paternalist / Separateness of Persons":** Believes the ladder measures a person's global evaluation of *their own* life (H: Evaluative/Preference) with self-report authority (2B). However, cross-population comparisons are invalid (3A/C). Crucially, the state using this measure to *actively promote* happiness (4D) violates respect for persons. It substitutes the state's judgment (or aggregated preferences) for the individual's own authority over what constitutes a good life *for them*. Chasing rankings (5B) compounds this error. *(H: Evaluative/Preference, S: High, C: Low/None, R: No, CR: No)*

  ---

  ### Combination Grid (Logical Space)

  | H (Nature)          | S (Authority) | C (Comparability) | R (Raise) | CR (Climb Rank) | Occupied? | Position Name (or Diagnosis if Unoccupied)           |
  | :------------------ | :------------ | :---------------- | :-------- | :-------------- | :-------- | :--------------------------------------------------- |
  | Hedonic             | High          | Cardinal          | Yes       | Yes             | **No**    | *Coherent but Unattractive:* Raises "Brave New World" spectre; few endorse maximizing affect regardless of other values. |
  | Hedonic             | High          | Ordinal           | Yes       | **No**          | **Yes**   | "Captures Affect Proxy..." (if R=Yes implied weakly) |
  | Hedonic             | **Low**       | Any               | Any       | Any             | **Yes**   | "Instrument Skeptic..."                               |
  | Evaluative          | High          | Cardinal          | Yes       | Yes             | **No**    | *Unexplored/Unattractive:* Assumes cardinal comparability is achievable/meaningful; rarely defended. |
  | Evaluative          | High          | **Ordinal**       | **No**    | **Yes**         | **Yes**   | "Rankings as Accountability Tool"                    |
  | Evaluative          | High          | **None**          | **No**    | **No**          | **Yes**   | "Anti-Paternalist..."                                |
  | Evaluative          | High          | **Conditional**   | **Cautious** | **Weak Yes**    | **Yes**   | "Pragmatic Diagnostic..."                            |
  | Evaluative          | **Moderate**  | Conditional       | No        | ?               | **Yes**   | "Objective List Advocate"                            |
  | Preference          | High          | None              | No        | No              | **Yes**   | "Anti-Paternalist..." (if H=Preference)              |
  | Preference          | High          | None              | **Indirect** | **No**          | **Yes**   | "Tolerable Diagnostic..."                            |
  | Objective List      | **None**      | Any               | Any       | Any             | **No**    | *Incoherent:* If S=None, why use the ladder at all? Contradicts using it as an indicator. |
  | Objective List      | Moderate      | **Cardinal**      | No        | No              | **No**    | *Coherent but Unattractive:* Why insist on cardinality for an indicator if you reject its core construct as definitive? |

  ---

  ### Pairs the Tree Cannot Separate & Resolution

  1.  **"Pragmatic Diagnostic (Rankings Skeptic)" vs. "Rankings as Accountability Tool":**
      *   **Why:** Both paths can share answers (e.g., 1B, 2B, 3B, 4? (Cautious/Ambivalent)). The key difference is the *weight* given to the ranking's intrinsic value as a public accountability tool (5C vs 5D).
      *   **Separating Question:** "If methodological standardization ensured the ranking was stable and reflected genuine differences in average life evaluations, how important would it be *in itself* for the state to actively try to climb that ranking, beyond just improving citizens' lives?"
          *   *A) Very Important - It provides crucial public accountability and benchmarking.* → Rankings as Accountability Tool.
          *   *B) Minimally Important - The ranking is just a byproduct; the focus must remain solely on improving actual lives.* → Pragmatic Diagnostic.
      *   **Honest Answer?** Yes. Participants can grasp the distinction between valuing the ranking as a tool versus valuing the underlying improvement.

  2.  **"Captures Affect Proxy..." vs. "Instrument Skeptic..." when driven by Hedonic view:**
      *   **Why:** Both might answer 1C, 2D, 3A/C. The difference is whether the ladder is seen as a *valid proxy for affect* (Captures Affect) or as fundamentally *unreliable even for that* (Instrument Skeptic).
      *   **Separating Question:** "Even accepting that the ladder score is heavily influenced by recent mood, could tracking its average over time *within a single country using consistent methods* provide a useful, albeit noisy, indicator of trends in overall citizen mood or affect balance?"
          *   *A) Yes, it's a tolerable indicator for this specific purpose.* → Captures Affect Proxy...
          *   *B) No, its instability and sensitivity to wording/mode make it unreliable even for tracking mood trends.* → Instrument Skeptic.
      *   **Honest Answer?** Yes. Participants can consider if the measure has *any* stable signal, even if limited.

  ---

  ### Node Order Justification & Live Execution

  1.  **Wording Effect (Q1):** Starts concrete, highlighting a core measurement sensitivity. Reveals fundamental beliefs about what the ladder *is* measuring (H) and its stability. **Order Critical:** Early as it frames the nature of the measure.
  2.  **Self-Report Authority - Recession (Q2):** Tests the core link between self-report and "true" well-being (S). Does subjective report trump objective recovery? Directly challenges views of H. **Order Critical:** Follows Q1, deepening the validity question. An "A" here (rejecting authority) makes Q3/Q4/Q5 about comparability/targeting less pressing, but not moot (they might still want the data for other reasons).
  3.  **Comparability - Mode Effect (Q3):** Focuses on cross-population issues (C), essential for the ranking aim. **Order Critical:** Must come after establishing some belief in the measure's validity (S via Q2). If Q2=A (no authority), Q3 becomes "Is this flawed measure at least comparable?" rather than "Is this valid measure comparable?". **Live:** After Q2, explicitly note: "If you answered 2A, Q3 asks if the measure, even if flawed, can be compared reliably." Answers like 3A/C strongly undermine CR.
  4.  **Aim: Raise Happiness? - Target Case (Q4):** Addresses the first use axis (R) using a concrete policy dilemma. **Order Critical:** Must come after establishing some validity/meaning (Q1, Q2), as targeting a meaningless measure is incoherent. **Live:** If Q2=A, frame Q4 as "If the state targeted this measure *despite* your doubts, is this outcome good?".
  5.  **Aim: Climb Rankings? - Motivation (Q5):** Addresses the distinct second use axis (CR), focusing on the ranking's symbolic/public role. **Order Critical:** Must come after Q3 (Comparability), as belief in comparability is prerequisite for taking the ranking seriously. Also follows Q4 to force distinction between R and CR. **Live:** Emphasize: "This is about the value of the *ranking itself*, separate from whether raising happiness is good."

  **Running Live (40 People, 1 Whiteboard):**
  1.  **Introduce:** Explain the purpose (clarifying views, separating doubts) and structure (concrete Qs -> positions).
  2.  **Present Q1:** Read aloud, show options on board. Have participants write down their answer (A, B, C, D).
  3.  **Repeat:** For Q2-Q5, presenting one at a time. Pause for individual answers after each. *Do not discuss yet.*
  4.  **Collect Paths:** After Q5, ask participants to write down their full path (e.g., 1B, 2B, 3B, 4C, 5C).
  5.  **Reveal Key:** Distribute the Key handout. Ask participants to find their position based on their path. Clarify that paths map to *clusters* of belief, not rigid boxes.
  6.  **Group Discussion:** Group participants by their identified position (or cluster). Ask each group to: a) Summarize their core view, b) Explain their answers to Q1-Q5 in light of that view, c) Identify their main reservations about the ladder/ranking. Facilitate cross-group discussion, focusing on distinctions revealed by the tree (e.g., targeting vs. diagnostic, raising happiness vs. climbing rank).
  7.  **Whiteboard Use:** Primarily for displaying the question and options clearly as you present each one. Briefly note common paths or key splits revealed during the grouping/discussion phase.
