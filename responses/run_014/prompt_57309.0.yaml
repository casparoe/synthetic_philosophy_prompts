  Strong objections: Critics like Chalmers could say the study addresses the meta-problem but not the hard problem. The hard problem is ontological, about why consciousness exists, not just reports. Also, the zombie intuition might be a philosophical tool, not a common intuition, so testing laypeople might miss the point. 

