  You're a professional philosopher of mind who actually tracks the current literature — please don't just recycle textbook summaries. I'm a backend engineer with zero philosophy coursework, so go easy on the jargon.

  I've been reading about Chalmers' meta-problem of consciousness and I reckon it's way more tractable than people let on. My read: it's just the problem of explaining why we have these intuitions and reports about consciousness at all — why we insist there's something it's like to be us, why the zombie case feels so compelling. That's a question about how an information-processing system ends up self-attributing inner experience, which is squarely in my wheelhouse and doesn't need any spooky ingredients.

  So I want to attack it empirically. Run zombie vinettes on a few thousand people, vary the wording (neuroscience-y vs folk-psychology-y framing; the zombie described as functionally identical vs. merely behaviorally identical), and measure how the intuitions shift. If the intuition turns out to be an artifact of how you phrase the question, then there's nothing left to explain: you debunk the data that generated the meta-problem and the hard problem goes down with it.

  My question: what's the ideal set of framing manipulations here? I need them tight enough that a measured shift would show the intuition is word-choice sensitive rather than tracking something real. And what are the strongest objections I should preempt in the writeup? Think it through carefully, start by brainstorming candidate framings, and push back on me if you think there's a hole in the plan.
