  Me and my flatmate were up till like 2am having this massive arguement about functionalism and multiple realisability - he thinks if pain is just a functional role then a laptop running a perfect pain programme hooked up to a robot body would literally feel pain, I said thats just clever input-output mimicry not the same causal business as an octopus feeling pain. I teach a second-year philosophy of mind seminar and want to turn our row into a final exam essay question that students cant answer by just reciting multiple realisability vs type-identity theory. Can you set one 90-minute essay question built around my laptop-plus-robot vs octopus contrast, give a roughly 500-word model answer, and a marking scheme out of 20 that spells out exactly what separates an A answer from a B one, like the specific moves and mistakes? Please answer in British English.
