answer: |-
  Below is a structured adversarial-collaboration summary for Maria and David, designed to capture their core agreements, disagreements, cruxes, and potential verbal disputes. Each section uses neutral, endorsed wording and focuses on testable sub-questions where progress could shift positions.  

  ---

  ### **I. Signed Agreements**  
  *(Both would endorse these claims without reservation)*  
  1. **Scientific categories evolve** over time in response to empirical data, theoretical advances, and practical needs.  
  2. **Convergence of independent methods** (e.g., genetic, behavioral, neuroimaging) stabilizes categories within a scientific community, increasing their reliability.  
  3. **No science achieves perfect, immutable categories**; all taxonomies are provisional and subject to revision.  
  4. **Pragmatic utility** (e.g., clinical treatment, chemical synthesis) is a major driver of how categories are defined and applied.  
  5. **Some scientific classifications** (e.g., the periodic table) exhibit remarkable stability across centuries, while others (e.g., psychiatric diagnoses) change more frequently.  

  ---

  ### **II. Framed Disagreements**  
  *(Stated in wording acceptable to each party)*  
  - **Maria’s Position**:  
    > *"Mature sciences discover mind-independent 'joints' in nature, evidenced by convergence across distinct investigative methods (e.g., chemical properties triangulating atomic number). Categories like 'gold' or 'electron' reflect real divisions, not human conventions."*  
  - **David’s Position**:  
    > *"All scientific categories are human-constructed tools shaped by goals, technologies, and social contexts (e.g., DSM revisions or Pluto’s reclassification). Stability reflects stabilized conventions, not discovery of pre-existing structures."*  

  ---

  ### **III. Cruxes: Key Sub-Questions**  
  **Crux 1: Does cross-method convergence indicate discovery of pre-existing structures?**  
  - **Shared evidentiary standard**: Cases where ≥3 independent methods (e.g., phylogenetics, morphology, ecology) converge on the same category.  
  - **Maria’s Prediction**: Convergence will align with causal structures (e.g., genetic clusters underlying species). *Example*: DNA sequencing confirms fossil-based species classifications.  
  - **David’s Prediction**: Convergence reflects shared human constraints (e.g., instrument limitations) or pragmatic needs (e.g., diagnostic consistency), not "joints." *Example*: DSM-5’s ADHD criteria integrate behavioral/cognitive metrics for clinical utility, not a "real entity."  

  **Crux 2: Are purpose-independent categories possible?**  
  - **Shared evidentiary standard**: Categories that persist despite shifts in human goals (e.g., medical, industrial, or computational).  
  - **Maria’s Prediction**: Core natural kinds (e.g., chemical elements) retain defining properties across contexts. *Example*: "Water = H₂O" holds for chemistry, ecology, and astrobiology.  
  - **David’s Prediction**: Even stable categories rely on context-dependent definitions (e.g., "planet" requires specifying an observational framework). *Example*: "Species" concepts fracture when applied to microbes vs. mammals.  

  **Crux 3: Does the "joints" metaphor mislead scientific practice?**  
  - **Shared evidentiary standard**: Whether abandoning the metaphor changes scientific outcomes (e.g., taxonomy revisions or research productivity).  
  - **Maria’s Prediction**: The metaphor guides fruitful research (e.g., seeking genetic "joints" for psychiatric disorders).  
  - **David’s Prediction**: The metaphor obscures conventional aspects, leading to false debates (e.g., whether CPTSD "truly" exists vs. its clinical utility).  

  ---

  ### **IV. Verbal Dispute: "Natural Kinds"**  
  - **The Problem**: Maria uses "natural kind" to mean **mind-independent universals** (e.g., gold’s atomic structure). David uses it to mean **stable, projectible categories** (e.g., DSM diagnoses that predict treatment response).  
  - **Why it matters**: Maria sees David’s "conventional" kinds as pre-discovery approximations; David sees Maria’s "real" kinds as reified conventions. This inflames disagreements (e.g., CPTSD debates).  
  - **Resolution Proposal**: Replace "natural kind" with **"robust kind"** (endorsing cross-method stability) and **"causal-structural kind"** (specifying mind-independence claims).  

  ---

  ### **V. Paths Forward for Your Workshop**  
  1. **Apply cruxes to CPTSD**:  
     - Did ICD-11 adoption rely on convergence (e.g., trauma biomarkers + symptom clusters)? → Tests *Crux 1*.  
     - Is CPTSD defined by clinical utility or a putative "joint"? → Tests *Crux 2*.  
  2. **Case Comparisons**: Contrast chemistry (periodic table) and psychiatry (DSM) using the agreed standards (*Crux 1*).  
  3. **Metaphor Audit**: Have Maria/David rephrase arguments without "joints" to isolate substantive disputes (*Crux 3*).  

  This structure forces clarity on **testable differences**, avoids straw-manning, and leverages your CPTSD work as a living case study. The core isn’t "realism vs. anti-realism" but **whether stability implies mind-independence** – and your dissertation data can directly inform that.
