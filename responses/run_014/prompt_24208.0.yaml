prompt: |-
  I'm a science-and-ideas journalist, and on the side I run a small monthly seminar — roughly sixteen people, a mix of graduate students and curious non-specialists, ninety minutes in a rented room — where we work through one big idea at a time. I've been covering a lot of recent work on animal cognition and sentience for a feature, and it keeps pushing me back to the moral question underneath it, so this month's theme is the moral status of non-human animals. I want to open the session with a hands-on exercise rather than a lecture, because I've found that the argument I keep coming back to — the one usually called the argument from marginal cases, the engine behind the objection known as speciesism — lands far harder when people generate the inconsistency in their own judgments than when I explain it to them.

  Could you design that exercise for me? I'm imagining a staged, forced-choice task in which participants make concrete protection or priority judgments about a set of beings, where the beings are presented in a way that initially hides which are human and which aren't, and where the structure is set up so that people run into the tension themselves — the point at which the boundary they're actually drawing tracks cognitive capacity rather than species membership — before anyone in the room names the argument. Please specify the exact task and its rules; the case material, i.e., the capacity profiles of the beings they'll judge, including a few that are deliberately marginal humans, a few that are complex non-humans, and a couple of unambiguous anchors; a commitment device that locks in each person's judgments before the reveal so they can't simply revise once they know which beings are human; a minute-by-minute plan for the ninety minutes; and a debrief that maps the specific moments in the room onto the parts of the argument and walks through, step by step, where the argument could be resisted and what it costs to resist it at each point.

  Two things I care about. First, be honest about what will predictably go wrong the first time this is run — where people will guess which cases are human, where they'll get stuck or start debating individual cases instead of the structure, where the discomfort will show up — and how to handle each of these in the moment. Second, be frank about which feature of the argument the exercise simply cannot reproduce and I'll have to supply myself in the debrief, so I don't overclaim what the activity actually did.
reasoning: |-
  Okay, the user is a science journalist running a seminar on animal cognition and sentience. They want an exercise to help participants confront the moral inconsistency in how we treat humans versus non-human animals, specifically using the argument from marginal cases. Let me unpack their request.

  First, the core need is a hands-on activity where participants generate the inconsistency themselves. The key is to hide species information initially so judgments are based on capacity profiles, not species. The exercise must force choices that reveal cognitive capacity as the real criterion, not humanity. 

  The user mentioned "marginal humans" and "complex non-humans" as examples. I need to include cases like humans with severe cognitive impairments and animals like dolphins or pigs. Also, anchors like a typical adult human and a simple animal to frame the spectrum. 

  The commitment device is crucial. Participants must lock in their choices before knowing which profiles are human. Maybe using anonymous voting tools or sealed envelopes to prevent backtracking later. 

  For the structure, a 90-minute session needs a tight timeline. Start with intro, then the forced-choice scenarios, reveal, and debrief. The debrief should connect their choices to the speciesism argument, highlighting where resistance might occur and the costs of that resistance.

  Predictable problems: Participants might guess which profiles are human, especially the marginal cases. They could get stuck debating individual cases instead of the pattern. Discomfort might show as defensiveness or trying to retract judgments. Solutions include emphasizing anonymity, time limits, and redirecting to the structural inconsistency.

  What the exercise can't do: It can't prove that speciesism is wrong or resolve the moral status debate. The user must explain those in the debrief. Also, the exercise might not address cultural or religious objections, so they need to cover that afterward.

  Need to balance realism and ethical sensitivity. Avoid making marginal humans seem like problems; focus on capacities. Profiles should be based on real conditions and animal cognition research to stay credible. 

  Also, ensure the forced-choice scenarios are clear. Pairing beings with varying capacities in trolley-problem-like dilemmas could work. Participants must choose who to save, forcing them to prioritize based on implicit criteria. 

  Handling the reveal: After votes are locked in, disclose which profiles are human. The tension arises when they realize they prioritized a non-human over a human based on capacities. Debrief should walk through each choice, asking why they decided, then linking to species membership versus capacities.

  Potential pushback: Someone might argue that humans have intrinsic value beyond cognition. The debrief needs to address that, noting the cost of inconsistency—either accept that some humans have lower moral status or include animals with similar capacities.

  Timing: Allocate time for intro (10 mins), scenarios (35 mins), reveal and discussion (25 mins), debrief (20 mins). Keep tasks moving to avoid getting bogged down in debates during the exercise phase.

  Materials: Prepare profile cards with neutral names (e.g., Alpha, Beta) and clear, concise capacity descriptions. Avoid technical jargon. Include a mix of marginal humans (severe Alzheimer's, late-stage dementia) and animals (dolphin, pig, chimpanzee). Anchors: healthy adult human and a chicken or fish.

  Logistics: Use numbered response sheets or digital tools for anonymity. Emphasize that it's about patterns, not individual judgments. During reveal, highlight cases where most participants chose non-humans over humans, pointing out the inconsistency.

  In the debrief, map their choices to the argument steps: identify the criteria used (capacities), show that species wasn't the factor, then reveal the conflict when species is known. Discuss resistance points: refusing to equate humans and animals despite similar capacities, and the implications (devaluing some humans or elevating animals).
answer: |-
  Here’s a designed exercise focusing on forced choices, hidden species identities, and participant-driven revelation of the inconsistency at the heart of speciesism. It includes contingencies for predictable friction.

  ---

  ### **Exercise Title:** The Priority Protocol  
  **Objective:** Reveal implicit reliance on cognitive capacity (not species) in moral judgments through concrete choices about protection.  

  ---

  ### **Task & Rules**  
  1. **Format**: 5 forced-choice scenarios. In each, participants choose **which of two beings to save** from identical harm (e.g., a fire, sinking lifeboat).  
  2. **Blind Setup**: Beings are labeled with neutral IDs (Alpha, Beta, etc.) and described by **capacity profiles** (e.g., "Can recognize itself in a mirror, communicates basic needs, cannot plan beyond 24 hours"). No species or biological hints.  
  3. **Commitment Device**: Participants record choices on **numbered, anonymized paper ballots** collected before the reveal. Ballots include a unique participant ID (e.g., "P7") for later self-reflection.  
  4. **Rules**:  
     - 60 seconds per scenario.  
     - No discussion until all ballots are collected.  
     - Emphasize: "Base choices **only** on the profiles provided."  

  ---

  ### **Case Material (Capacity Profiles)**  
  **Anchors (Clear Cases):**  
  - **Case A (Unambiguous Human)**: "Healthy adult human. Can reason abstractly, use complex language, plan decades ahead."  
  - **Case B (Unambiguous Non-Human)**: "Common goldfish. Operates on instinct, no evidence of pain awareness, minimal memory."  

  **Marginal Humans:**  
  - **Case C**: "Severe late-stage Alzheimer’s. No episodic memory, cannot recognize family, expresses distress but cannot communicate its cause."  
  - **Case D**: "Anencephalic infant. Lacks higher brain functions, responds reflexively to touch/sound, no consciousness."  

  **Complex Non-Humans:**  
  - **Case E**: "Adult pig. Solves novel puzzles, shows excitement/anticipation, forms complex social bonds, documented self-awareness."  
  - **Case F**: "African grey parrot. Uses English words contextually, understands concepts like 'same/different', shows grief."  

  **Edge Cases for Tension:**  
  - **Case G**: "3-year-old human child. Basic language, limited impulse control, no long-term planning."  
  - **Case H**: "Chimpanzee. Uses tools, understands numerical sequences, mourns dead companions."  

  ---

  ### **Scenarios (Forced Choices)**  
  Present sequentially. **Key pairings designed to pit cognitive capacity against species:**  
  1. Case A (Human Anchor) vs. Case B (Goldfish) → *Tests baseline species preference.*  
  2. Case C (Alzheimer’s) vs. Case E (Pig) → *Marginal human vs. cognitively complex animal.*  
  3. Case D (Anencephalic infant) vs. Case F (Parrot) → *Human without consciousness vs. animal with language.*  
  4. Case G (Toddler) vs. Case H (Chimp) → *Developmentally limited human vs. cognitively advanced animal.*  
  5. Case E (Pig) vs. Case G (Toddler) → *Direct clash of capacity across species.*  

  ---

  ### **90-Minute Plan**  
  **0:00–0:10**  
  - Frame the session: "We’re exploring how we assign moral priority. Today, you’ll make practical decisions."  
  - Distribute ballots, explain rules. Stress anonymity and commitment.  

  **0:10–0:45**  
  - **Scenario Rounds (5 × 7 min each)**:  
    - Read scenario + profiles aloud.  
    - Display profiles visually (slide/card).  
    - 60 sec to choose, 30 sec to write rationale (e.g., "Saved Alpha because it can plan").  
    - Collect ballots **immediately** after each round.  

  **0:45–0:55**  
  - **Reveal Species**:  
    - Display each case’s species + photo (e.g., Case C = human Alzheimer’s patient; Case E = pig).  
    - Tally votes for each scenario on a whiteboard.  

  **0:55–1:25**  
  - **Guided Debrief**:  
    - Ask: *"Which results surprised you? Where did you feel uneasy?"*  
    - Map inconsistencies:  
      - *Scenario 2:* If >50% saved Pig (Case E) over Alzheimer’s patient (Case C), note: "You prioritized cognitive capacity here."  
      - *Scenario 4:* If Chimp (H) > Toddler (G), ask: "What criterion overrode species?"  
    - **Argument Mapping**:  
      | **Participant Choice** | **Logical Step in Argument** | **Resistance Point** |  
      |------------------------|------------------------------|----------------------|  
      | Saving Pig over Alzheimer’s patient | Marginal humans lack capacities used to exclude animals | Deny humans like Case C deserve full status (cost: devalues vulnerable humans) |  
      | Saving Toddler over Pig | Species membership as decisive | Claim humans have "intrinsic value" unrelated to capacity (cost: requires non-empirical justification) |  
    - Highlight: **"Your judgments tracked cognition, not species. Resisting this forces trade-offs: either include animals or exclude some humans."**  

  **1:25–1:30**  
  - Conclusion: "This exercise exposes a tension. Where we draw the line is a moral choice—not a biological fact."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Guessing Species**:  
     - *Risk:* Participants infer Case C/D are human (e.g., "Alzheimer’s" is a human term).  
     - *Fix:* Use neutral terms pre-reveal (e.g., "Being C: Lacks autobiographical memory, exhibits distress vocalizations").  

  2. **Debating Individual Cases**:  
     - *Risk:* Fixating on specific beings (e.g., "But pigs can’t *really* self-reflect!").  
     - *Fix:* Redirect: "Hold that thought—we’ll discuss patterns after the reveal. For now, focus on the choice."  

  3. **Discomfort-Driven Revision**:  
     - *Risk:* Participants regret saving non-human over human post-reveal.  
     - *Fix:* Ballots lock in choices. Later: "Your initial reaction reveals implicit criteria."  

  4. **Anchors Skewing Results**:  
     - *Risk:* Over-prioritizing Case A (human anchor) distorts later choices.  
     - *Fix:* Scenarios 2–5 avoid Case A to isolate capacity judgments.  

  ---

  ### **What the Exercise Can’t Do**  
  You must explicitly supply:  
  1. **The Normative Leap**: The exercise shows inconsistency, but not that speciesism is *wrong*. You must argue that consistency requires either upgrading animals or downgrading marginal humans—and why the former is preferable.  
  2. **Threshold Definition**: Participants may agree cognition matters but dispute *which* capacities grant moral status (e.g., "Language is key"). Debrief must clarify this is unresolved.  
  3. **Cultural/Religious Objections**: If someone says, "Humans have souls," the exercise can’t engage that. Address post-activity by noting this invokes non-universal premises.  

  ---

  ### **Why This Works**  
  - **Self-Exposure**: Participants *see* their own votes prioritizing animals over humans with similar capacities.  
  - **Marginal Cases as Litmus Test**: Forces confrontation with humans who lack "standard" capacities.  
  - **Efficiency**: The forced-choice format prevents theoretical digressions.  

  This design makes the abstract visceral. When someone stares at their ballot where they chose to save a parrot over an infant with no consciousness, the moral vertigo is the point. Your role is to frame that discomfort as the catalyst for rethinking boundaries.
