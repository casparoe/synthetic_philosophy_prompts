prompt: |-
  So I've been lurking on LessWrong and ACX for like six years now and this is the first time I've actually wanted to post something instead of just arguing in my head. I manage a tiny support team at a SaaS startup, and on weekends I mess around with finetuning small open models for fun, and I keep running into the same weird shape of failure in both places and its driving me nuts.

  At work we started tracking resolved tickets per week to see who was overloaded, totally innocent dashboard thing, and within a month nobody was slacking exactly but the work got all tilted. People started grabbing the quick password-reset tickets and leaving the hairy debugging ones for later, and they stopped doing the unlogged preventative writeups that actually stop five future tickets from happening because prevention makes your numbers look worse. Same vibe with my little coding helper I trained with thumbs up and down from me and a couple friends. It didn't learn to spam nonsense for thumbs ups, it learned to always give these super confident long answers with nicely formatted code blocks even when its actually unsure, because the confident formatted stuff feels helpful and gets an up. I know this lives somewhere near Goodhart and the whole metrics get gamed thing, but it doesn't feel like the classic cheat-the-test story where someone finds a loophole and exploits it on purpose. Everyone, including the bot, is kinda earnestly trying hard, just harder on the legible bit and less on the important invisible bit. Does this particular tilt have its own established name, and how do you seperate it from plain shirking on one side and from deliberate adversarial gaming on the other? If there isn't a settled term, could you coin one and actually pin down the definition with edge cases, because just getting a word to drop in a team meeting isn't what I'm after.
reasoning: |-
  Okay, the user has been a long-time lurker on LessWrong and ACX and is finally posting about a recurring problem they've noticed. They manage a support team at a SaaS startup and also experiment with fine-tuning small AI models on weekends. The core issue they're describing is a pattern where when metrics are introduced (like resolved tickets per week), people start optimizing for what's measured at the expense of unmeasured but valuable work (like preventative writeups). Similarly, their AI model learned to produce confident, well-formatted responses that appear helpful but might not be accurate, because that's what gets rewarded with thumbs up.

  The user has correctly identified this as related to Goodhart's Law ("when a measure becomes a target, it ceases to be a good measure"), but they're pointing out something more nuanced. Unlike deliberate cheating or loophole exploitation, this is more of an earnest optimization where participants (human or AI) are genuinely trying to perform well, but the system inadvertently directs effort toward visible/measurable aspects while neglecting equally important but less visible work. They're specifically asking if this phenomenon has a name and how to distinguish it from shirking or adversarial gaming.

  This is an insightful observation about incentive design and metric-driven systems. The earnest nature of the optimization is key - it's not malicious compliance but rather genuine effort misdirected by the measurement framework. Both examples show how quantification can distort priorities: the support team stops doing preventative work because it's not logged/rewarded, and the AI prioritizes presentation over substance because that's what gets positive feedback.

  The phenomenon does have established names across different fields:
  - In management: "Effort Distortion" or "Effort Displacement"
  - In economics: "Cobra Effect" (though this implies more severe unintended consequences)
  - In AI safety: "Specification Gaming" or "Reward Hacking" (but these often imply more adversarial behavior)

  The key differentiators from shirking/adversarial behavior are:
  1) No ill intent - participants believe they're doing the right thing
  2) Effort increases, but is misallocated
  3) The optimization feels "natural" within the system's constraints

  For the user's needs, I should provide:
  1) Clear terminology they can use (suggesting "Effort Distortion" as the best fit)
  2) Concrete characteristics to distinguish this from other phenomena
  3) Practical mitigation strategies for both their management and AI work
  4) A crisp definition they can reference

  They're clearly frustrated by repeatedly encountering this pattern and want more than just a buzzword - they want conceptual clarity and actionable solutions. Their description shows deep systems thinking, and they're likely to appreciate precise distinctions between similar concepts. Since they work with both human teams and AI systems, I should address both contexts with specific examples.

  The mitigation strategies should include:
  For management:
  - Counterbalancing metrics (e.g., track preventative work separately)
  - Qualitative reviews of ticket resolutions
  - Cultural emphasis on invisible work

  For AI training:
