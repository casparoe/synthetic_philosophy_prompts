  **Guard-Rail Section:**

  The guard-rail is in step 5: we do not allow interventions that cause death without current suffering. This prevents us from endorsing, say, a charity that painlessly euthanizes healthy beings to prevent them from suffering in the future. Such a charity would be automatically deprioritized.

