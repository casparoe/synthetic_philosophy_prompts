prompt: |-
  My labmate — a virologist by training and very opinionated — has been issuing verdicts all year on what counts as alive, and I've started keeping a ledger. Her rulings so far: bacteria and archaea, alive; humans, mules, and sterile worker bees, alive; viruses of every kind she's been asked about, not alive; Bacillus endospores sitting dry and metabolically inert for decades, alive; desiccated tardigrades, alive; prions, not alive; self-catalyzing clay surfaces of the Cairns-Smith sort, not alive; candle flames and hurricanes, not alive; mitochondria inside a cell, alive as parts of an organism but not organisms themselves — she insists on separating the question of being alive from the question of being an organism, and I think she's right to.

  Next month she's sitting in on a talk I have to introduce, so I want to be able to anticipate her objections. Three new cases will come up:

  1. Digital organisms — self-replicating programs in an Avida-style environment that mutate, compete for CPU time, and have evolved elaborate foraging behavior, with nothing chemical anywhere in the system.
  2. A bottom-up protocell: a lipid vesicle enclosing a replicating RNA genome and a rudimentary light-driven metabolism that repairs the membrane, maintains its own gradients, and grows and divides — but whose replication is so error-prone that there is no stable heredity across generations, hence no cumulative evolution and no lineage at all.
  3. A mimivirus-type giant virus carrying metabolic and translation-related genes, which it expresses only after commandeering a host's ribosomes.

  Predict her verdict on each, then do the part I actually care about. Lay out the candidate rules that fit her track record equally well — something autopoiesis-shaped, something like the NASA working definition with its self-sustaining and Darwinian clauses, perhaps something substrate-neutral about evolution or something cladistic about descent, and note honestly which of these her virus verdict already strains. Say which of the three cases does the most to separate the surviving rules, what each rule predicts there, and, where the rules still agree, what further case would force them apart — she would enjoy a hard one, and the gradient from captured endogenous retroviruses to placenta-making genes occurred to me. Give me your best guess at her actual verdicts with your reasons for preferring one rule over its rivals, calibrated to how underdetermined her ledger really leaves them.

  And one request in her spirit: if you think the ledger is internally incoherent, or that a single rule can't be extracted from it because "alive" is doing several jobs at once across her rulings — alive versus being an organism versus being a life-form versus matter of degree — say so plainly instead of manufacturing a principle to keep the prediction game going. She'd much rather be told her concept is overloaded than be fitted to a rule she'd reject on sight.
reasoning: |-
  Okay, let me tackle this fascinating challenge. The user presents a complex puzzle about defining life based on their labmate's previous rulings, with three new test cases to analyze. 

  First, I need to carefully examine the labmate's established pattern. Her rulings show a clear pattern: she accepts metabolically active entities (even dormant ones like endospores and tardigrades) as alive, but rejects viruses and prions despite their replicative abilities. The key distinction seems to be independent metabolic activity - viruses lack it while dormant cells retain the capacity. 

  For the new cases:
  1) Digital organisms: Given her rejection of non-chemical systems (clay surfaces, flames), she'll likely dismiss these despite evolutionary complexity. Her "nothing chemical" comment is telling.
  2) Protocell: This has metabolism and self-maintenance but no heredity. Since she accepted mitochondria (which also lack independent heredity), this might qualify as "alive" though not an organism.
  3) Giant virus: Though complex, it still lacks independent metabolism - like all viruses, it depends on host machinery. Her consistent virus stance suggests rejection.

  The real challenge is extracting consistent principles. The NASA definition (self-sustaining + evolving) fits imperfectly - she accepts non-evolving dormant cells but rejects evolving viruses. Autopoiesis (self-production) fits better but struggles with the protocell's lack of heredity. 

  The giant virus case is most revealing. Any definition requiring metabolism would reject it (aligning with her likely verdict), while evolutionary definitions might accept it. Further cases like endogenous retroviruses could strain these definitions further.

  Ultimately, her concept seems to prioritize metabolic autonomy over replication or evolution. But tensions exist - especially regarding whether "alive" requires potential for evolution. I should acknowledge this rather than force coherence where her intuitions may be multifaceted.
answer: |-
  Based on your labmate's established rulings and philosophical stance (separating "alive" from "organism"), here's the analysis you requested:

  **Predicted Verdicts for New Cases:**
  1.  **Digital Organisms:** **Not Alive.** Her rejection of non-chemical systems (clay, flames, hurricanes) and insistence on viruses needing chemistry strongly implies that she sees life as fundamentally grounded in *chemistry*. CPU cycles aren't metabolic chemistry.
  2.  **Bottom-Up Protocell:** **Alive (but not an organism).** This hits key points: chemical basis, metabolic activity (light-driven repair, gradient maintenance), growth, division, and self-maintenance within its boundary (autopoiesis). The lack of heredity/evolution prevents it from being an "organism" (similar to mitochondria), but its metabolic self-sustenance likely qualifies it as "alive" under her criteria (cf. endospores, tardigrades).
  3.  **Giant Mimivirus:** **Not Alive.** Despite its complexity and metabolic genes, it still fundamentally lacks *independent* metabolism. It requires hijacking the host's entire replication/translation/energy machinery. Its genes are inert instructions without the host's chemical factory. This aligns perfectly with her consistent virus verdict.

  **Candidate Rules Fitting the Ledger:**
  Her rulings strain simplistic definitions. Several nuanced rules fit *most* of her verdicts:

  1.  **Autopoietic System with Chemical Metabolism:** "An entity is alive if it maintains itself as a distinct, bounded system through ongoing, internally driven *chemical* metabolic processes, even if those processes are temporarily suspended in a dormant state." *Fits:* Bacteria, Archaea, Humans/Mules/Bees (obviously), Endospores (potential metabolism), Tardigrades (potential metabolism), Mitochondria (within cell, doing metabolism), Protocell (metabolism present). *Rejects:* Viruses (no independent metabolism), Prions (no metabolism, no system), Clay (no metabolism), Flames/Hurricanes (no bounded system, no metabolic *chemistry*?), Digital (no chemistry). *Strains:* The "chemical" requirement is explicit from her rejections. Defining "metabolism" precisely is key (is the protocell's light-driven repair sufficient? She likely says yes).

  2.  **NASA Definition + Chemical Fidelity:** "Life is a *chemical* system capable of Darwinian evolution and self-sustaining by extracting energy from the environment to maintain internal order and replicate." *Fits:* Bacteria, Archaea, Humans/Mules/Bees, Endospores (capable of restarting metabolism/replication), Tardigrades (same). *Rejects:* Viruses (no independent self-sustenance/evolution), Prions (no evolution, no metabolism), Clay (no evolution), Flames/Hurricanes (no evolution, no heredity), Digital (no chemistry), Protocell (no heredity/evolution), Giant Virus (no independent self-sustenance). *Strains:* **This is where her virus verdict strains the ledger MOST.** Endospores and tardigrades *also* lack "self-sustaining" metabolic activity *while dormant*. She accepts them as alive *despite* this temporary lack, focusing on their inherent *capability*. Viruses inherently *lack the capability for independent self-sustenance* – they are obligate parasites *of the metabolic process itself*. Her rulings suggest she prioritizes the *possession of the metabolic machinery* (even dormant) over *current activity*. The NASA definition struggles with dormant states without modification.

  3.  **Metabolic Lineage (Cladistic Descent + Metabolism):** "An entity is alive if it belongs to a lineage descended from other living entities *and* possesses (or is in a state derived from possessing) the inherent metabolic machinery characteristic of that lineage." *Fits:* Bacteria, Archaea, Humans/Mules/Bees (lineage + metabolism), Endospores/Tardigrades (lineage + derived metabolic machinery), Mitochondria (lineage within eukaryotes + metabolism). *Rejects:* Viruses (no descent from *metabolically* alive entities? Controversial, but she rejects them), Prions (no lineage, no metabolism), Clay/Flames/Hurricanes/Digital (no lineage), Protocell (no lineage). *Strains:* Requires defining "characteristic metabolic machinery" and handling abiogenesis (the first protocell wouldn't qualify initially). Her acceptance of the protocell (predicted) would break this rule, as it has no lineage.

  **The Decisive Case & Rule Separation:**
  *   **The Protocell (Case 2) is the Key Differentiator:** It has metabolism but no heredity/lineage.
      *   **Autopoiesis Rule:** Predicts **Alive** (self-maintaining chemical system).
      *   **NASA + Chem Rule:** Predicts **Not Alive** (fails Darwinian evolution clause).
      *   **Metabolic Lineage Rule:** Predicts **Not Alive** (no lineage).
  *   **Your prediction (and her likely ruling: Alive)** strongly supports the **Autopoiesis Rule** and invalidates the strict NASA and Metabolic Lineage rules for her ledger.

  **Where Rules Agree & A Harder Case:**
  The Autopoiesis and NASA rules *agree* on rejecting the Giant Mimivirus (no independent metabolism). To force *them* apart:
  *   **The Case: An "Activated" Endogenous Retrovirus (ERV) Gene Complex.** Imagine a mammalian gene complex derived from an ancient retrovirus. It's fully integrated into the host genome, inherited vertically, *and* its expressed proteins perform an *essential, sustained metabolic maintenance function* within the host cell (e.g., regulating a crucial ion channel assembly required for basic cellular homeostasis), beyond just replicating itself. It has no independent existence or replication outside the host genome/cell.
      *   **Autopoiesis Rule:** Likely **Not Alive**. The *system* maintaining itself is the host cell. The ERV complex is a component, like a ribosome or mitochondrial gene. It lacks its own distinct boundary and self-driven metabolic processes.
      *   **NASA + Chem Rule:** **Not Alive.** It cannot replicate independently *as a system*; it replicates only as part of the host genome. While it contributes to self-sustenance, it is not the *system* doing the sustaining.
      *   **Metabolic Lineage Rule:** **Not Alive.** It's a gene, not a lineage possessing metabolic machinery. Its origin is viral (non-living lineage by her standards).
      *   **Her Likely Verdict?** **Not Alive.** It remains fundamentally a gene *within* a living system, not a living entity itself, despite its metabolic role and evolutionary origin. This reinforces metabolism needing to be *self-contained* within a distinct system.

  **Your Best Guess at Her Actual Rule & Why:**
  *   **Rule:** "An entity is **alive** if it is a distinct, physically bounded *chemical* system that possesses the inherent *organized metabolic capability* to maintain itself, grow, and potentially reproduce, even if that capability is not currently active. Being an **organism** requires, additionally, the capacity for hereditary variation enabling Darwinian evolution over generations."
  *   **Why this fits best:**
      1.  **Chemistry is Fundamental:** Explicitly accounts for rejecting digital, clay, flames.
      2.  **Metabolic Capability is Core:** Explains acceptance of dormant spores/tardigrades (capability inherent) vs. rejection of viruses (no inherent metabolic machinery *at all*). The protocell has active, organized metabolism for self-maintenance.
      3.  **Distinct Bounded System:** Rejects prions (no system), mitochondria as independent organisms (part of a larger system), and likely the ERV complex.
      4.  **Separates "Alive" from "Organism":** Clearly distinguishes metabolically active but non-evolving entities (protocell, mitochondria) from evolving lineages (bacteria, animals). Sterile bees are still organisms by descent/capability, even if sterile.
      5.  **Handles the Virus Strain:** Viruses lack the *inherent organized metabolic capability*. They are instructions *for* a metabolism, not possessors *of* one. Endospores *are* possessors in a paused state. This captures the crucial distinction she consistently makes.

  **Calibration & Honesty:**
  Her ledger *is* coherent around **metabolic capability within a bounded chemical system** as the core of "alive," with evolution adding "organism" status. However, **tensions exist**:
  *   **"Capability" vs. "Activity":** How dormant is "dormant but capable"? Deeply frozen tardigrades vs. fossilized spores? Her rulings suggest a generous view of capability.
  *   **"Organized" Metabolism:** How complex must metabolism be? The protocell tests this lower bound.
  *   **"Inherent" Machinery:** Does the Giant Virus's metabolic genes count? Her verdict (predicted: No) suggests "inherent" means machinery *that can function independently of another living system's core processes*. Viruses depend entirely on the host's core machinery.

  **Conclusion:**
  You can confidently predict **Not Alive, Alive (not organism), Not Alive** for the three cases. Her underlying principle prioritizes **inherent metabolic capability within a distinct chemical boundary** for being "alive." The protocell case is the most revealing, favoring an autopoiesis-like rule over NASA or lineage-based ones. The activated ERV case further refines the boundary between complex biological parts and living entities. While coherent, the edges of "metabolic capability," "organization," and "inherent" remain fuzzy – fertile ground for discussion after your talk!
