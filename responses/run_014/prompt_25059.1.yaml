prompt: |-
  I'm a PhD student in programming languages — I work on type systems, formal semantics, denotational semantics, that kind of thing — and I've been trying to wrap my head around this thing in metaethics called the Frege–Geach problem. From where I'm sitting it sounds like a compositionality problem: you've got a semantics that works fine for atomic sentences in root position but breaks the moment you embed them under conditionals or negation. But I want to know if I'm flattening it too much.

  Here's what I think I understand. Expressivists say moral sentences like "lying is wrong" don't express propositions that can be true or false — they express non-cognitive attitudes, like disapproval. So the meaning of "lying is wrong" is something like BOO(LYING). The Frege–Geach problem is that "lying is wrong" also shows up embedded: "If lying is wrong, then getting your little brother to lie is wrong." In the antecedent, the speaker isn't disapproving of lying — they might even think lying is fine. But modus ponens still goes through: from that conditional plus "lying is wrong," you validly infer "getting your little brother to lie is wrong." So the semantics has to assign the same meaning to "lying is wrong" whether it's asserted or embedded, but BOO(LYING) doesn't compose under the conditional — what does BOO(LYING) → BOO(GETTING-YOUR-BROTHER-TO-LIE) even mean?

  What I want: restate this whole dialectic — the expressivist starting point, the embedding challenge, and the main attempts to fix it (Gibbard's hyperplan semantics, Blackburn's attitudinal logic, whatever else is central) — in the vocabulary I actually use. Types, evaluation contexts, denotations, compositionality, monadic lifting, continuations, whatever maps best. Be precise about correspondences.

  Then the residue report. What translates cleanly, what you had to fudge, and what in the philosophers' debate has no counterpart in my vocabulary at all. The thing I really want to know: is the Frege–Geach problem just the observation that expressivists need a compositional semantics and spent a few decades not having one — which is a totally familiar kind of problem to me, we deal with non-referential expressions that change force under embedding all the time — or is there something specifically metaethical going on that doesn't reduce to "their denotations don't compose"? If the latter, tell me what I'm missing.

  Respond in the style of an expert. Think very carefully before answering — I want the translation to be honest, not forced, and the residue is the part I actually care about.
reasoning: |-
  We are going to translate the Frege-Geach problem and expressivist responses into the vocabulary of programming languages and formal semantics.

  ## The Expressivist Starting Point

  In expressivism (a metaethical view), moral sentences do not express propositions (i.e., truth-conditions) but rather express non-cognitive attitudes (like approval, disapproval, etc.). 

  - Let `Prop` be the type of propositions (which we can think of as sets of possible worlds, or truth values in a given world).
  - Let `Attitude` be a type representing mental states (e.g., `BOO`, `HURRAY`).

  The expressivist gives the meaning of a moral sentence like "lying is wrong" not as a proposition but as an attitude:

  ```
  denotation("lying is wrong") : Attitude   // specifically, BOO(LYING)
  ```

  But note: in a compositional semantics, we expect that the meaning of a complex sentence is built from the meanings of its parts. The problem arises when we embed moral sentences.

  ## The Embedding Challenge: Frege-Geach Problem

  Consider the conditional: "If lying is wrong, then getting your little brother to lie is wrong."

  This has the form: `P → Q`, where `P = "lying is wrong"` and `Q = "getting your little brother to lie is wrong"`.

  In a standard truth-conditional semantics, we have:
  - `denotation(P) : Prop`
  - `denotation(Q) : Prop`
  - `denotation(→) : Prop → Prop → Prop` (e.g., the material implication function)

  But for the expressivist, `denotation(P)` and `denotation(Q)` are of type `Attitude`, which does not match the input type of `→`. Hence, composition fails.

  Moreover, the inference by modus ponens:
  1. `P → Q`
  2. `P`
  Therefore, `Q`

  is valid. But if `P` in the conditional doesn't express an attitude (because it's in the antecedent), then how can it be the same as the `P` that is asserted (which does express an attitude)? And how does the inference work?

  ## Translation to PL Semantics Vocabulary

  We can think of the expressivist as initially assigning a non-standard type to moral sentences. Let:

  - `MoralAtom` : type of atomic moral sentences.
  - `FactAtom` : type of atomic factual sentences (which denote `Prop`).

  The expressivist wants:
  ```
  denotation : FactAtom -> Prop
  denotation : MoralAtom -> Attitude   // but this breaks composition
  ```

  The problem is that when we embed a `MoralAtom` in a conditional, we need it to be of type `Prop` (or something that can combine with `→`). So the expressivist must find a way to assign a uniform type to all sentences that can be embedded.

  ### Proposed Solutions in PL Terms

  1. **Gibbard's Hyperplan Semantics** (in "Thinking How to Live"):
     - Gibbard introduces "hyperplans" (which are complete contingency plans for action) and models the meaning of a moral sentence as the set of hyperplan-world pairs in which the sentence is accepted.
     - In our terms: he lifts the type of the denotation of any sentence (whether moral or factual) to a set of hyperplan-world pairs. So:
       - `Hyperplan = ...` (a type representing a complete plan)
       - `World = ...` (a type representing a possible world)
       - `Denotation = Powerset(Hyperplan × World)`
     - Then, both factual and moral sentences denote the same type. For a factual sentence `P`, we have:
          `denotation(P) = { (h, w) | w ⊧ P }`
     - For a moral sentence `"A is wrong"`, we have:
          `denotation("A is wrong") = { (h, w) | h prescribes disapproval of A in w }`
     - Now, logical connectives are defined set-theoretically (e.g., `denotation(P→Q) = { (h,w) | if (h,w) ∈ denotation(P) then (h,w) ∈ denotation(Q) }`).
     - Modus ponens is then valid because the conditional is defined classically on these sets.

     This is a form of **monadic lifting**: we lift the denotation from `Prop` (which was `World -> Bool`) to `Hyperplan x World -> Bool` (or sets thereof). The hyperplan acts as an extra parameter (like a reader monad) that we carry along.

  2. **Blackburn's Quasi-Realism and Attitudinal Logic**:
     - Blackburn proposes a logic of attitudes. The idea is to have complex attitudes built from simpler ones.
     - For example, the conditional `P→Q` (where `P` and `Q` are moral) might express a conditional attitude: if one has the attitude expressed by `P`, then one must have the attitude expressed by `Q`.
     - In programming terms, we might think of this as a form of **continuation-passing style (CPS)**. The meaning of a sentence is not its content but its context (i.e., what it does to the current set of attitudes). 
     - Let `Ctx` be a type representing a context (a set of attitudes). Then:
          - An atomic moral sentence `"A is wrong"` might denote a function that takes a context and returns a new context with the attitude `BOO(A)` added: `Ctx -> Ctx`.
          - But then how do we embed? We want the meaning of `P→Q` to be a function that transforms a context such that if the context already has the attitude for `P`, then after adding `P→Q` it will also have the attitude for `Q` when `P` is present.
     - Alternatively, we might model the meaning of a sentence as a function from contexts to contexts (a context transformer). Then:
          - `denotation(P→Q) = λc. ...` would be a function that ensures that in any context where `P` is accepted, then `Q` must also be accepted.

     This is more complex and requires a non-standard logic for attitudes. It has been criticized for not validating all the same inferences as classical logic.

  3. **Other Approaches: Biforcated Attitude Semantics (Schroeder)**:
     - Schroeder in "Being For" proposes that all sentences (moral and non-moral) express a complex attitude of "being for". 
     - For a non-moral fact `P`, the attitude is `FOR(P)`.
     - For a moral sentence "A is wrong", it is `FOR(blaming for A)`.
     - Then, the logical connectives are defined in terms of operations on what one is for.
     - In type terms: we have a uniform type `Attitude` (being for something) and then:
          - `denotation(P) = FOR(^P)`   (where ^P is the proposition P for non-moral, and for moral it's a different kind of object)
     - The challenge is to define the operators so that modus ponens holds.

  ## Residue Report: What Translates, What Doesn't, and What's Specific

  ### What Translates Cleanly

  1. **Compositionality Requirement**: The core problem is that we require a compositional semantics. The meaning of a complex expression must be a function of the meanings of its parts. Expressivists initially failed to provide one for embedded contexts. This is exactly the kind of problem we face when designing a language with side-effects or non-standard evaluation: we need to lift or transform our denotations to fit the compositional structure.

  2. **Type Mismatch**: The initial expressivist semantics assigns a type `Attitude` to moral atoms, but the connectives (like `→`) require type `Prop` (or a function `Prop -> Prop -> Prop`). This is a type error in the compositional semantics. The solutions involve finding a uniform type (like `Hyperplan×World -> Bool` in Gibbard) or redefining the connectives to work on `Attitude` (which is what Blackburn and Schroeder attempt).

  3. **Monadic Lifting**: Gibbard's solution is analogous to using a reader monad that threads through the hyperplan. We lift the denotations to functions from hyperplans and worlds to truth values. This is a standard technique in PL for handling extra parameters.

  4. **Continuations**: Blackburn's approach can be seen as a context-passing style (a form of continuation) where the meaning of a sentence is a context transformer. This is also a known technique.

  ### What Had to be Fudged

  1. **Hyperplans**: The notion of a hyperplan is specific to Gibbard's theory and is tied to his metaethical view. It's not a standard computational effect. We can model it as an extra parameter, but the philosophical interpretation (as a contingency plan) doesn't have a direct counterpart in PL.

  2. **Attitudes as Primitives**: In PL, we usually model effects (like state, exceptions) in terms of how they affect computation. But attitudes are mental states and their logic (how they combine) is not given by a standard monad. We had to assume operations on contexts (for Blackburn) which might not be as well-behaved as, say, the state monad.

  3. **Validity of Inferences**: In classical logic, modus ponens is valid. In the expressivist semantics, we have to prove that their reconstructed logic validates modus ponens. This is a meta-theoretic property that must be checked for each proposal. In PL, we would have to prove that the denotational semantics is sound with respect to a given proof system.

  ### What Doesn't Translate (The Specifically Metaethical Part)

  1. **The Nature of Moral Disagreement**: Metaethics is concerned with explaining the nature of moral discourse, including why moral arguments feel like they are about the truth and how we can disagree. The expressivist must explain why modus ponens feels compelling in moral arguments if the meanings are attitudes. This explanatory burden is beyond just having a compositional semantics.

  2. **The Objectivity Challenge**: Even if we have a compositional semantics, the expressivist must explain why moral sentences behave as if they are objective (e.g., we say "It is true that lying is wrong"). The PL semantics might assign a denotation that allows for embedding, but it doesn't automatically account for the phenomenology of moral discourse.

  3. **The Specificity of Moral Attitudes**: The attitudes expressed by moral sentences are supposed to be distinct from preferences or desires. They are normative and involve a kind of universality. For instance, "lying is wrong" is not just about the speaker's disapproval but about what ought to be done by anyone. This normative force is hard to capture in the PL terms without adding more structure.

  ## Conclusion

  The Frege-Geach problem is, at its core, a compositionality problem. It is analogous to problems we face when designing the semantics for a language with non-referential expressions (like imperatives, questions, or expressions with side effects). The expressivist must provide a uniform type for the denotations of sentences that can be both asserted and embedded. 

  However, there is a metaethical residue: the expressivist must also explain why the resulting semantics counts as an account of moral language (which is supposed to involve normative force, objectivity, and disagreement) and not just a formal trick. The PL tools can help with the compositionality, but they don't automatically resolve the philosophical challenges that motivated expressivism in the first place.

  In short: the problem is "their denotations don't compose", but the solution must also satisfy metaethical constraints (like explaining the practicality of moral judgments and the nature of moral disagreement) that go beyond compositionality.
answer: |-
  ### Restatement in Programming Languages Semantics Vocabulary

  #### **Expressivist Starting Point**
  - **Core Idea**: Moral sentences (e.g., "lying is wrong") denote non-propositional, attitude-expressing entities.  
  - **Formalization**:  
    - Let `Prop` be the type of propositions (worlds → `Bool`).  
    - Let `Attitude` be a type of mental states (e.g., approval, disapproval).  
    - Atomic moral sentence `S_moral` (e.g., "lying is wrong") has denotation:  
      `⟦S_moral⟧ : Attitude ≈ BOO(lying)`  
    - Atomic factual sentence `S_fact` (e.g., "snow is white") has denotation:  
      `⟦S_fact⟧ : Prop`  
    - **Issue**: `Attitude` ≠ `Prop`, yet both can embed identically in conditionals/negation.  

  #### **Frege-Geach Embedding Challenge**
  - **Problem**: Moral sentences in embedded positions (e.g., antecedents of conditionals) lose their illocutionary force but retain logical role.  
  - **Example**:  
    - Sentence: `If lying is wrong, then getting your brother to lie is wrong`  
      Logical form: `P → Q`, where `P = ⟦"lying is wrong"⟧`, `Q = ⟦"brother lying is wrong"⟧`.  
    - **Compositionality failure**:  
      - If `P : Attitude`, but `→` expects inputs of type `Prop` (e.g., `→ : Prop → Prop → Prop`), type mismatch occurs.  
      - `BOO(lying) → BOO(brother_lying)` is nonsensical; `→` cannot compose with `Attitude`.  
    - **Inference failure**: Modus ponens requires uniform semantic treatment of `P` in asserted/embedded positions.  

  ---

  ### **Expressivist Solutions Translated**  
  #### **1. Gibbard’s Hyperplan Semantics (Monadic Lifting)**  
  - **Core Idea**: Lift all denotations to a unified type `Hyperplan × World → Bool`.  
    - `Hyperplan` = a function mapping situations to actions (normative plans).  
    - `World` = factual state of affairs.  
  - **Formalization**:  
    - Define a monad `M` encapsulating hyperplan/world state:  
      `M α = Hyperplan → World → α`  
    - Redefine denotations:  
      - `⟦S_fact⟧ : M Prop = λh w. truth_value_in_w`  
      - `⟦S_moral⟧ : M Prop = λh w. h(w) prescribes disapproval of lying`  
    - Connectives operate on lifted types:  
      `⟦P → Q⟧ = λh w. ⟦P⟧(h)(w) ⇒ ⟦Q⟧(h)(w)`  
    - **Result**: Uniform type `M Prop` enables composition. Modus ponens holds via classical implication.  

  #### **2. Blackburn’s Attitudinal Logic (Continuation-Passing Style)**  
  - **Core Idea**: Treat attitudes as context transformers.  
    - Let `Ctx` = current set of attitudes (e.g., a belief base).  
    - Denotations are functions updating `Ctx`: `Denotation = Ctx → Ctx`.  
  - **Formalization**:  
    - Atomic moral sentence:  
      `⟦"lying is wrong"⟧ = λctx. ctx ∪ {BOO(lying)}`  
    - Connectives via CPS:  
      - `⟦P → Q⟧ = λk ctx. k(⟦Q⟧(⟦P⟧(ctx)))`  
      - Negation: `⟦¬P⟧ = λk ctx. k(ctx \ {attitude_of_P})`  
    - **Result**: Embeds attitudes in higher-order functions. Conditional expresses: *"If current context + BOO(lying) entails BOO(brother_lying), update context."*  

  #### **3. Schroeder’s Biforcated Attitude Semantics (Combinator Reinterpretation)**  
  - **Core Idea**: All sentences express attitudes of "being for" (`FOR`).  
    - Moral: `⟦"lying is wrong"⟧ = FOR(blaming_for_lying)`  
    - Factual: `⟦"snow is white"⟧ = FOR(believing_snow_white)`  
  - **Formalization**:  
    - Logical operators as attitude combinators:  
      `⟦P → Q⟧ = λatt. FOR(¬P) ∨ FOR(Q)`  
      where `∨` combines attitudes.  
    - **Result**: Uniform type `Attitude` composes, but requires redefining logic.  

  ---

  ### **Residue Report**  
  #### **What Translates Cleanly**  
  1. **Compositionality as Type Unification**:  
     - Frege-Geach reduces to: *"Need uniform semantic type for all sentential positions."*  
     - Solutions mirror PL techniques:  
       - Gibbard ≈ **Reader Monad** (`M α = Hyperplan → World → α`).  
       - Blackburn ≈ **Continuation-Passing Style** (denotations as `Ctx → Ctx`).  
       - Schroeder ≈ **Algebraic Effects** (attitudes as composable effectful ops).  

  2. **Embedding via Lifting/Transformers**:  
     - Atomic moral terms require lifting (Gibbard) or CPS (Blackburn) to behave like `Prop` under embedding.  
     - Analogous to lifting `IO a` into a monad to compose with pure functions.  

  3. **Validity via Semantic Constraints**:  
     - Modus ponens preservation ≈ proving the semantics satisfies `⟦P⟧, ⟦P→Q⟧ ⊨ ⟦Q⟧` in the model.  

  #### **What Required Fudging**  
  1. **Hyperplans as Ad Hoc State**:  
     - Gibbard’s `Hyperplan` lacks a direct PL analog—it’s a domain-specific state.  
     - Similar to threading custom `Config` in a reader monad, but with normative content.  

  2. **Attitude Combinators Are Under-Specified**:  
     - Blackburn’s `Ctx → Ctx` and Schroeder’s `FOR` combinators lack clear operational semantics.  
     - Unlike monads, their "algebra" isn’t proven to obey standard laws (e.g., associativity).  

  3. **Truth-Preservation vs. Attitude Coherence**:  
     - In PL, we prove program equivalence; in metaethics, they prove *logical validity*.  
     - Expressivists must show their semantics validates *classical* inferences (e.g., modus ponens), which constrains designs.  

  #### **What Doesn’t Reduce to PL: The Metaethical Residue**  
  1. **Non-Descriptivism’s Explanatory Burden**:  
     - Expressivists must explain why moral sentences *seem truth-apt* (e.g., embed in conditionals) despite not denoting propositions.  
     - PL says: *"Lift types to compose."* Metaethics asks: *"Why does this lifting reflect how humans use moral language?"*  

  2. **The "Moral Attitude" Specificity**:  
     - `BOO`/`HURRAY` aren’t arbitrary effects—they’re *normative* attitudes meant to explain motivation, disagreement, etc.  
     - E.g., Gibbard’s hyperplans encode *reasons for action*, not just state. This intentionality has no PL counterpart.  

  3. **The Phenomenology of Logic**:  
     - Why do we *feel* modus ponens is compelling with moral conditionals?  
     - PL ensures compositionality; metaethics must explain the *cognitive experience* of moral reasoning.  

  ---

  ### **Conclusion**  
  The Frege-Geach problem **is**, at its core, a compositional semantics challenge: *"Attitude-based denotations don’t compose under embedding, so unify the type or redefine connectives."* Gibbard (monadic lifting), Blackburn (CPS), and Schroeder (combinator algebras) directly mirror PL solutions to similar problems (e.g., monads for side effects).  

  **However**, the metaethical residue is **non-trivial**:  
  1. Expressivists must preserve classical logic *while denying propositions*—a constraint foreign to PL.  
  2. Attitudes must explain *normative force* (e.g., why moral beliefs motivate action), which lacks a PL analog.  
  3. Solutions are judged by *phenomenological adequacy* (e.g., "Does this reflect how we experience moral debate?"), not just formal elegance.  

  **Your Insight is Apt**: Frege-Geach exposes decades of expressivists lacking compositional semantics. But the metaethical stakes—explaining the *nature* of moral language—add unique constraints beyond "make the types work." The residue is about *why* we demand compositionality for moral terms in the first place.
