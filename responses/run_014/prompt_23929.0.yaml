  Question 2's tension is fascinating. The resolution likely hinges on distinguishing identity from authenticity. The statue persists formally, but authenticity derives from material history. I note this isn't incoherent—it mirrors how we value inherited objects like family heirlooms. 

  Moving to question 3's scenarios: Case (a) is standard practice—partial replacement with marking. Case (b) (melting/recasting) would violate conservation norms; it's matter-destructive. Case (c) (reassembly) is acceptable but reveals that arrangement matters more than material continuity. 

  For question 4's underdetermination, I realize many theories could justify the practice—endurantism, perdurantism, even some stage theories—as long as they accept flexible criteria for persistence. The irreplaceable core is more practical than metaphysical. 

  Finally, for question 5's counterfactuals: If museums adopted strict matter-identity (i), they'd need to label replaced objects as replicas. If they embraced pure formalism (ii), they'd stop marking replacements and value perfect reconstructions equally. 

  Throughout, I flag philosophical disagreements—e.g., whether authenticity is intrinsic or relational. The user seems to want these nuances highlighted. Their project likely aims to expose how implicit metaphysics shapes conservation ethics, so I'll emphasize where practice reveals unspoken commitments.
answer: |-
  Your inquiry dissects a profound interplay between metaphysical commitments and institutional practice. Below is a meticulous reconstruction, distinguishing conceptual necessities from contingent features. I proceed stepwise, adhering to your constraints.

  ### 1. **Presupposed Theory of Material Constitution**  
  The practice presupposes a **constitution-without-identity** framework (akin to Baker/Lowe) where:  
  - The statue (*S*) is a distinct object from the original matter (*M*).  
  - *M* constitutes *S* at *t₁*, but *S* persists through partial replacement of *M* by new matter (*M'*) at *t₂*.  
  - **Persistence conditions**: Identity requires *formal and causal continuity*, not strict *material continuity*. *S* persists iff:  
    (i) Its core structural/functional profile is maintained (e.g., the statue’s shape and artistic intent);  
    (ii) There is causal-historical continuity linking pre- and post-restoration states (e.g., conservation adheres to the artist’s original design).  

  Material continuity is permitted "slack" (e.g., adhesive fills gaps but doesn’t replace load-bearing elements). *Conceptual note*: This rejects mereological essentialism. A reasonable philosopher might dispute whether constitution suffices without identity (e.g., a mereological universalist could argue *S* is a temporal part of a larger four-dimensional object).

  ### 2. **Reconciling Persistence and Authenticity Value**  
  The tension dissolves by distinguishing two axes of value:  
  - **Identity conditions**: Tied to formal/causal continuity (permitting material replacement).  
  - **Authenticity conditions**: Grounded in *the historical relation* between *S* and *M*. Original matter has value as:  
    (i) A causal trace of the artist’s creative act (e.g., tool marks);  
    (ii) A physical witness to the object’s temporal journey (e.g., corrosion patterns from centuries underground).  

  This implies a **relational theory of authenticity**: *M* is not identical to *S*, but *S*’s historical essence includes *having been constituted by M at its creation*. Thus, even if *S* persists with new matter, its *authenticity* diminishes as original material decreases.  
  - **Coherence**: Yes, provided authenticity is extrinsic to identity. A statue with 90% replacement is *the same work* but *less authentic*. Disagreement may arise if one views authenticity as essential to identity (e.g., a hard-line materialist might argue authenticity *is* identity).

  ### 3. **Application to Cases**  
  **(a) Arm replaced with resin**  
  - *Practice*: Permitted. Resin is visually distinct; object retains original label.  
  - *Theory compatibility*: Handled easily. Formal integrity and causal history intact; authenticity marginally reduced.  

  **(b) Melted and recast**  
  - *Practice*: Rejected. Museums classify this as a replica, not the original. Labels would note "reproduction after original."  
  - *Theory compatibility*: Violates causal-formal continuity. Melting destroys *S*’s structural history (e.g., cold-worked surface texture) and severs causal links to the artist’s hand. Original matter is reconstituted but not preserved.  

  **(c) Disassembly and reassembly (anastylosis)**  
  - *Practice*: Accepted without reservation. Label unchanged; no distinction markers needed.  
  - *Theory compatibility*: Unproblematic. Material continuity is fully preserved; form and causal history are undisturbed.  

  ### 4. **Presuppositions vs. Compatibility & Underdetermination**  
  - **Strict presuppositions** (practice collapses without these):  
    (i) *S* ≠ *M* (non-identity);  
    (ii) Persistence requires formal/causal continuity, not matter;  
    (iii) Original matter bears irreplaceable historical value.  
  - **Compatible but not required**:  
    - Endurantism (wholly present at each time) *or* perdurantism (persisting through temporal parts).  
    - Theories of artifacts as mind-dependent (e.g., Thomasson) vs. mind-independent (e.g., Elder).  
  - **Philosophical underdetermination**: The practice is equally licensed by:  
    - **Moderate hylomorphism** (statue as compound of form + original matter, allowing gradual matter replacement).  
    - **Stage theory with immanent causation** (the pre-restoration statue causes the post-restoration stage).  
    - **Artifactual functionalism** (identity tied to continued recognition of function).  
  *Contested boundary*: The "irreplaceable core" (e.g., a bronze statue’s core vs. patina) is a practical heuristic, not a metaphysical commitment.  

  ### 5. **Alternative Foundations for Conservation**  
  **(i) Statue identical to original matter (mereological essentialism)**  
  - **Changes to practice**:  
    - Any replacement = destruction. Replaced objects labeled replicas (e.g., "Reconstruction of *David*, 2024, after Michelangelo").  
    - No distinction markers (irrelevant; all non-original matter is replica).  
    - Original fragments displayed as "authentic remains," never "the statue."  
  - **Consequence**: Conservation becomes impossible; museums are relic-archives.  

  **(ii) Statue as pure form/pattern**  
  - **Changes to practice**:  
    - Replacements need not be distinguishable (matter is incidental).  
    - Labels could include restoration dates (form persists across instantiations).  
    - Perfect replicas equal in value to originals; "authenticity" shifts to documentary evidence.  
    - Anastylosis irrelevant; disassembled pieces lose status until rearrangement.  
  - **Consequence**: Conservation merges with replication; material history is aesthetic, not constitutive.  

  ### Key Philosophical Openings  
  - **Disagreement space**:  
    - Whether authenticity is scalar (as practice assumes) or binary (e.g., Kripkean origin essentialism).  
    - Whether causal continuity requires physical contact (e.g., is a laser-scanned replica "continuous" with the original?).  
  - **Underdetermined metaphysics**: The practice’s "causal continuity" is operationalized through artist’s intent and structural role—philosophers debate what causal relations suffice for persistence.  

  This reconstruction reveals conservation as a pragmatic negotiation between metaphysical persistence (allowing repair) and historical phenomenology (prizing material traces). Its coherence lies in separating the *work* (a historically situated formal entity) from its *authenticating matter*.
