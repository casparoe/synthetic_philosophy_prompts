answer: |-
  ### I. Reconstructing the Implicit Theory of the Criminal Jury

  **Feature 1: Random selection, exclusion of expertise, challenges based on sympathy**  
  - *Strictly requires*: A **representative legitimacy** theory. The jury must mirror the community to confer democratic authority on the verdict. Expertise is excluded as it might undermine the "common sense" ideal.  
  - *Sits comfortably with*: Process-based fairness (diverse perspectives ensure impartiality).  
  - *Underdetermined*: Aggregative truth-tracking could accept randomness if competence is assumed universal, but filtering for sympathy actively undermines competence-based selection.  

  **Feature 2: Decision based solely on court evidence; prohibition on external research**  
  - *Strictly requires*: **Procedural fairness**. Verdict legitimacy depends on adherence to controlled, adversarial process. External inputs risk contamination.  
  - *Sits comfortably with*: Truth-tracking (by filtering "noise") and representational theories (ensuring equal access to information).  
  - *Underdetermined*: Aggregative justification could permit research if it improved competence, but the prohibition assumes court evidence is sufficient.  

  **Feature 3: Secrecy of deliberations; criminalisation of disclosure**  
  - *Strictly requires*: **Deliberative autonomy**. The verdict’s authority derives from the sacrosanct nature of collective reasoning, shielded from external scrutiny.  
  - *Sits comfortably with*: Process-based fairness (protecting jurors from coercion).  
  - *Underdetermined*: Truth-tracking is actively undermined, as secrecy prevents verification of reliability.  

  **Feature 4: Secret deliberations; unanimity/majority requirement; hung jury as void**  
  - *Strictly requires*: **Collective authority**. The verdict must embody a unified community voice. Unanimity signifies moral certainty; discarding hung juries treats the outcome as non-epistemic (no "partial truth" recognised).  
  - *Sits comfortably with*: Process-based legitimacy (finality requires closure).  
  - *Underdetermined*: Aggregation requires independence, but enforced convergence manufactures dependence. Majority verdicts after deadlock imply a threshold of acceptability, not optimal accuracy.  

  **Feature 5: Bare general verdict; no need for juror consensus on reasoning**  
  - *Strictly requires*: **Verdict as communal fiat**. The output is a binary moral judgment ("guilty/not guilty"), not a factual finding. Authority lies in the collective act, not the rationale.  
  - *Sits comfortably with*: Representational theory (the community condemns/absolves as a whole).  
  - *Underdetermined*: Aggregative truth-tracking requires consensus on premises to avoid doctrinal paradoxes (e.g., where jurors agree on guilt but disagree on elements).  

  **Feature 6: Appellate courts publish reasons/dissents**  
  - *Strictly requires*: **Epistemic accountability**. Appellate legitimacy rests on transparent, reasoned evaluation of law/fact.  
  - *Sits comfortably with*: Truth-tracking (error correction via scrutiny).  
  - *Underdetermined*: Highlights that juries serve a distinct non-epistemic function.  

  **Implicit Theory Synthesis**: The jury is primarily a **representative and deliberative body**, deriving authority from embodying community judgment through a fair process. Truth-tracking is secondary: its rules presuppose that legitimacy flows from participation, procedural purity, and collective will, not demonstrable reliability.  

  ---

  ### II. Tension with Aggregative Justification  
  The aggregative model (e.g., Condorcet’s Jury Theorem) requires:  
  - **Independence**: Jurors form views separately.  
  - **Competence**: Each juror >50% likely correct.  
  - **No systematic bias**: Errors are random.  

  **Institutional contradictions**:  
  - **Dependence manufactured**: Deliberation, unanimity mandates, and peer pressure erode independence.  
  - **Competence ignored**: Selection filters for neutrality, not skill; research bans prevent competence-building.  
  - **Secrecy prevents verification**: No data exists to confirm competence or independence.  

  **Reformulation attempt**: *Deliberation boosts individual competence*. If debate corrects errors, pooled competence might offset lost independence.  
  - **Assumptions required**: Deliberation must be rational, not coercive; jurors must be open to revision; "truth" must emerge from discourse.  
  - **Plausibility**: Unverifiable due to Feature 3. Empirical studies (where possible) suggest deliberation often amplifies bias or creates groupthink. Opposing view (deliberation improves accuracy) is speculative.  
  - **Conclusion**: The tension is fatal to *classical* aggregation. The system privileges convergence over independence, suggesting it prioritises collective authority over truth-tracking.  

  ---

  ### III. Coherence of Feature 3 (Secrecy of Deliberations)  
  - **Presupposition**: Legitimacy is **procedural and intrinsic**, not contingent on reliability. The verdict’s authority stems from the ritual of secret deliberation itself—a "black box" whose output is binding *because* it is the system’s designated oracle.  
  - **Relationship to reliability**: The prohibition implies that **legitimacy would be undermined if deliberation were scrutinised**, either because:  
    - Flaws (bias, irrationality) might become visible, eroding public trust.  
    - External pressure might distort future deliberations.  
  - **Not a mere side-constraint**: It is foundational to a **ritualistic theory of authority**, where the jury’s power resides in its symbolic role as the community’s voice. Transparency might reveal it as fallible humans, not an oracle.  
  - **Coherence**: Internally coherent within a non-epistemic framework but incoherent if truth-tracking were primary (which demands scrutiny).  

  ---

  ### IV. Feature 4: Epistemic Weight of Hung Juries and Majority Verdicts  
  - **Discharged juries as epistemically weightless**: Treating a hung jury as void implies the jury has **no epistemic agency outside delivering a verdict**. The outcome is an institutional event, not evidence about reliability. If aggregation were central, a hung jury might signal reasonable doubt or evidence ambiguity.  
  - **Unanimity to majority shift**:  
    - Unanimity imposes a **high threshold for guilt** (minimising false convictions).  
    - Permitting majority verdicts after deadlock prioritises **finality over certainty**, accepting a higher risk of error (either false conviction or acquittal).  
  - **Consistency with competence-based defence?** Only weakly: Unanimity assumes pooled competence produces near-certainty; majority verdicts retreat from this, admitting that process costs sometimes outweigh accuracy gains.  

  ---

  ### V. Feature 5: The Bare General Verdict  
  - **Presupposed view of output**: The verdict is a **communal act of condemnation or absolution**, not a factual conclusion. Jurors need not agree on *why* the defendant is guilty because the question is "Do *we* hold them answerable?"  
  - **Ruled out**: Doctrinal accountability. Aggregation requires consistent premises to avoid paradoxes (e.g., all jurors find guilt, but via incompatible paths). Here, the "black box" output is all that matters.  
  - **Compatibility with aggregation?** No. Aggregation needs disaggregated findings to ensure logical coherence. The general verdict treats guilt as holistic and moral, not computational.  

  ---

  ### VI. Contrasting Juries and Appellate Courts (Features 5 & 6)  
  - **Juries**: Secret, reason-free, consensus-driven → **symbolic community judgment**.  
  - **Appellate courts**: Transparent, reasoned, dissent-tolerant → **epistemic error-correction**.  
  - **Can one theory underwrite both?** Only a **pluralist theory of adjudication**:  
    - Juries provide **democratic legitimation** through lay participation and communal verdicts.  
    - Courts provide **expert oversight** through specialised reasoning.  
  - **The contrast’s implication**: Juries are **not primarily epistemic devices**. Their value is in their representative and ritualistic role, not cognitive accuracy.  

  ---

  ### Concrete Changes Under Alternative Justifications  
  **If aggregative truth-tracking were adopted**:  
  1. **Selection**: Prioritise jurors with relevant skills; minimise challenges for sympathy.  
  2. **Deliberation**: Allow research/experts; require jurors to submit private votes pre-deliberation.  
  3. **Secrecy**: Publish deliberation records for study; allow appeals based on flawed reasoning.  
  4. **Verdict**: Require special verdicts (answers to specific factual questions); abandon unanimity for probabilistic thresholds.  
  5. **Hung juries**: Treat as evidence of reasonable doubt (e.g., bar retrials).  

  **If purely representative/process-based**:  
  1. **Embrace randomness**: Widen eligibility; remove all competence-based exclusions.  
  2. **Reinforce secrecy**: Strengthen penalties for deliberation leaks.  
  3. **Unanimity**: Treat as essential for legitimacy (no majority verdicts).  
  4. **Verdict**: Defend the general verdict as the community’s inscrutable will.  
  5. **Transparency**: Focus scrutiny solely on procedural inputs (evidence, instructions), not deliberative outputs.  

  ### Conclusion  
  The criminal jury in England and Wales is best understood as a **ritual of community judgment**, where authority flows from representativeness, procedural purity, and collective endorsement—not measurable reliability. The aggregative defence is philosophically unsupported by its rules; it serves as a useful myth but collapses under scrutiny of the institution’s design. The tension is resolved only by recognising that the jury’s power is performative, not epistemic.
