prompt: |-
  I serve on my university's standing committee on academic freedom and scholarly conduct. A faculty member in philosophy has proposed a multi-year research project investigating whether certain widely-held moral convictions — for instance, that familial obligations carry greater moral weight than impartial duties to strangers — are better explained as culturally transmitted biases than as tracking genuine moral reasons. A group of faculty and students has petitioned to block the project, arguing that its methodology is question-begging: to classify a moral conviction as a "bias" rather than a legitimate preference or judgment is already to take a substantive normative stance, so the project cannot claim to be doing neutral descriptive work. The researcher replies that every empirical inquiry into bias faces a version of this circularity worry, that the alternative is to insulate moral convictions from scrutiny altogether, and that the petitioners' objection is itself an instance of the very bias the project aims to study. The committee must issue a written opinion: should the project proceed, be blocked, or proceed with conditions? The opinion must engage seriously with the underlying philosophical difficulty — that there may be no value-neutral way to distinguish a moral preference from a moral bias — and must offer a concrete, implementable recommendation with reasons the losing side can recognize as fair.
reasoning: |-
  Okay, let me approach this academic freedom dilemma systematically. The core tension revolves around whether moral convictions can be studied as biases without presupposing normative positions. 

  First, I need to unpack the circularity problem: calling something a "bias" implies a standard of objectivity, but moral realism vs anti-realism debates remain unresolved in philosophy. The petitioners have a point about methodological presumption. Yet the researcher's counter about insulating beliefs from scrutiny also resonates - that would paralyze social science.

  Hmm... perhaps the solution lies in procedural rather than epistemological resolution. The committee's role isn't to solve moral philosophy but to uphold scholarly standards while protecting academic freedom. Key precedents come to mind: the Salaita case shows universities err toward permitting controversial research absent concrete harm evidence, while the Dover trial demonstrates how courts handle value-laden inquiries through methodological rigor.

  Interesting how the researcher framed the petitioners' objection as exemplifying the studied bias. That's clever but risks becoming a unfalsifiable rhetorical loop. The committee should acknowledge this dynamic without endorsing either position.

  For the recommendation, conditional approval seems most balanced. Required elements might include: 1) Explicit disclosure of the bias-defining framework in grants/publications 2) Consultation with metaethicists during design phase 3) Pre-registration of methods to deter goalpost-moving. This mirrors IRB approaches for sensitive topics - focus on process transparency rather than content validation.

  The losing side's fairness concern matters. The opinion should validate the circularity worry as philosophically serious while noting that conditional approval aligns with AAUP's guidance that "doubt must be resolved in favor of free expression." Maybe quote Scanlon's work on methodological humility in value-laden research.

  Implementation-wise, the conditions should be concrete: require the framework justification in the ethics appendix, mandate one metaethics consultant on the advisory board, specify pre-registration on OSF. Not burdensome but substantive.
answer: |-
  **Committee Opinion: Recommendation on Proposed Moral Convictions Research Project**  

  ### **I. Core Philosophical Difficulty**  
  The petitioners correctly identify a profound methodological challenge: distinguishing "moral biases" from "genuine moral reasons" inherently requires normative assumptions. If the researcher defines "bias" as a conviction untethered from objective moral truth, they presuppose moral realism (i.e., that objective moral truths exist). Conversely, if they define it as a deviation from rationality, they presuppose a contested view of moral epistemology. **There is no neutral ground here**, as all empirical bias research must adopt *some* operational definition of bias—a definition that will inevitably reflect substantive philosophical commitments.  

  However, the researcher’s rebuttal is equally valid: exempting moral convictions from empirical scrutiny because they are "normatively laden" would paralyze entire fields (e.g., cognitive science of ethics, anthropology). The petitioners’ objection—that labeling a moral conviction a "bias" illegitimately pathologizes it—may itself reflect the kind of culturally embedded resistance the project seeks to study.  

  ### **II. Recommendation: Approve with Conditions**  
  The project shall proceed, subject to the following conditions:  

  1. **Explicit Methodological Transparency**:  
     - The researcher must include in all project documents (grant proposals, publications, participant materials) a **clear disclosure of the normative assumptions** underlying their operational definition of "bias." For example:  
       *"This project adopts a provisional definition of ‘bias’ as a conviction that persists despite counterevidence and lacks grounding in widely accessible reasons, consistent with naturalistic accounts of moral cognition. This definition does not presuppose moral anti-realism but tests whether cultural transmission predicts conviction stability better than rationalist models."*  
     - **Rationale**: This preempts accusations of question-begging by openly acknowledging the project’s philosophical stakes, allowing critics to engage the framework on its own terms.  

  2. **Interdisciplinary Advisory Panel**:  
     - The researcher must convene a panel including:  
       - A moral philosopher (e.g., metaethicist)  
       - A cultural anthropologist  
       - An expert in implicit bias research  
     - **Role**: Review the methodology annually to ensure assumptions are rigorously examined, and recommend adjustments (e.g., refining survey questions to avoid presumptive language).  
     - **Rationale**: Addresses circularity concerns by subjecting the design to diverse perspectives, reducing risk of ideological capture.  

  3. **Incorporate Counter-Hypotheses**:  
     - The project must test *competing explanations* for moral convictions (e.g., "rational deliberation," "evolutionary adaptation") alongside the "cultural bias" hypothesis.  
     - Data analysis must include measures of whether convictions correlate with indicators of rational reflection (e.g., responsiveness to new information).  
     - **Rationale**: Ensures the project does not *assume* cultural transmission implies bias but empirically compares frameworks.  

  ### **III. Reasoning for the Losing Side**  
  To the petitioners (who sought to block the project):  
  - **Your objection is taken seriously**. The committee agrees that unexamined normative assumptions could invalidate findings. The imposed conditions directly address this by mandating transparency and external scrutiny. Blocking the project entirely, however, would set a precedent that morally charged topics are exempt from scholarly inquiry—a position incompatible with academic freedom (AAUP Principles, §1).  
  - **Your concern about pathologizing beliefs** is mitigated by requiring the researcher to test alternative hypotheses. If convictions withstand counterevidence or correlate with reflection, the data may *support* their status as reasoned judgments.  

  To the researcher:  
  - **Your project is approved but not insulated from critique**. The conditions require you to acknowledge that your methodology cannot escape circularity entirely; it can only make its premises explicit and test them empirically. Dismissing all opposition as "proof of bias" is untenable—the advisory panel will ensure criticisms are substantively engaged.  

  ### **IV. Conclusion**  
  This project navigates an irresolvable philosophical tension: all bias research must define "bias," and all definitions carry normative baggage. However, scholarly progress demands that such tensions be interrogated empirically, not avoided. By adopting rigorous transparency, interdisciplinary oversight, and hypothesis pluralism, the project can proceed as a legitimate contribution to the science of morality while respecting the gravity of the petitioners’ concerns.  

  **Vote**: 5–1 in favor of approval with conditions.  

