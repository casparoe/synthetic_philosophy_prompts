prompt: |-
  Had a four hour argument with my friend last night about national character and I'm still not over it, so I want a real answer rather than a diplomatic one. You're a philosopher who works on social ontology and on how general statements about kinds actually work — think carefully, and don't give me the balanced both-sides summary.

  The setup: my friend's line is that generalizations about peoples are all one kind of thing, differing only in how accurate they are and whether someone's using them to hurt people, and that my refusal to say some of them is squeamishness dressed up as principle. My line is that some of them aren't even candidates for being accurate. Instead of arguing abstractly, here's what I actually committed to during the night, case by case:

  1. Survey data on trust — the finding that way more people in the Nordic countries answer yes when asked whether most people can be trusted, compared with much of Latin America — I'm completely happy to assert, and I'd use it in an argument about institutions. No hesitation.
  2. "Swedes are more trusting than Brazilians." I balked, and when he said that's just (1) with the numbers deleted, I couldn't say what had gone missing. This is the one that kept me awake.
  3. "The Swiss are punctual" — fine, and I've heard Swiss people say it about themselves with real pleasure.
  4. "Germans have no sense of humour" — not fine. Except my German friends say it about themselves constantly, self-deprecatingly. So self-ascription can't be the switch, since I leaned on it in (3).
  5. He brought up the Law of Jante — the ten-rule code from a 1933 satirical novel by a Danish-Norwegian author, set in an invented small town, written as a dig at small-town conformism — and said it proves Danes have a genuine conformist streak, since they keep claiming it as their own. I said fine, they claim it, so treat it as self-description. Then I noticed that if it's evidence only because they endorse it, it isn't evidence about their character at all, and he said I'd just conceded.
  6. "Italians can't organise anything" — not fine, and not because it's more false than (3). Because of what it does in a room where someone is deciding whether to promote an Italian.
  7. Same content, different room: a Japanese colleague telling me that clients from Tokyo won't push back in a negotiation — fine, useful, we planned around it. A sales manager saying the identical thing to explain why the Tokyo office never objects — made me angry. I have no account of that difference and he says that's because there isn't one.
  8. "Milanesi are cold", regional stuff inside my own country: totally relaxed, I say it all the time, I'd defend it in public. But I'd never say the equivalent about a country. Which makes my objection look like it's about borders rather than about the form of the claim, and borders seem arbitrary here, since Milanese and Neapolitans are supposed to differ in exactly the way Swedes and Brazilians supposedly do.
  9. "The French are cynical about institutions" — I said this is fine and I'd defend it as a real explanatory fact, and he said I'd just admitted national character is coherent, only badly behaved.
  10. A claim about a group defined by migration rather than territory — say, Turks in Germany — I froze and didn't know which side I was on.

  So: is there a principle, or a small set of clauses, that captures this pattern? I want it stated precisely enough that I could apply it to a sentence I've never seen before. Brainstorm at least four candidate principles first, kill the weak ones in a line each, and keep the survivors with the case that motivates each clause. No bibliography and no citations, refer to positions and arguments and I'll chase down the reading myself.

  Please use exactly these sections, in this order:
  - **Sorting my cases** (~150 words): group the ten into kinds, and say which groupings are load-bearing.
  - **Candidate principles** (~500 words): the shortlist, the kills, and the survivor(s) stated clause by clause.
  - **The pair that breaks it** (~250 words): statistic vs. generic in (1)/(2), and self-ascription in (3)/(4) — whether any principle saves both, and what it costs to save them.
  - **New cases** (~300 words): verdicts on four I didn't list — a tourism ad built on a national trait; "the British are terrible at cooking" said by a British MP; a claim about a country's courts rather than about its people's dispositions, and whether that's a character claim in disguise; and a hedged average ("on average, tend to"). Then one case you invent that you think the winning principle gets embarassingly wrong.
  - **What I have to give up** (~200 words): which of my verdicts the survivor forces me to drop, and the single sentence I should say to him next time.
reasoning: |-
  Okay, the user had a four-hour argument about national character generalizations and wants a rigorous philosophical analysis without diplomatic hedging. They provided ten specific cases where they accept or reject such generalizations, revealing apparent inconsistencies in their judgments. 

  First, I need to understand the core tension in their examples. Cases 1/2 show statistical data vs. generic claims, 3/4 contrast self-ascriptions that are accepted vs rejected, 7 demonstrates context-dependent acceptability, and 8 reveals a regional/national double standard. The user seems to intuitively distinguish between descriptive accuracy and social function but can't articulate it.

  The key challenge is reconciling their acceptance of Swiss punctuality (case 3) with rejection of German humorlessness (case 4) when both involve self-ascription. Their discomfort with "Swedes are more trusting" (case 2) despite accepting survey data (case 1) suggests the generic form itself is problematic regardless of accuracy. 

  For candidate principles, I consider:
  - Statistical vs universal claims (fails case 3 where generic is accepted)
  - Harm potential (too broad, ignores cases like 5 where self-description is harmless)
  - Institutional vs dispositional attribution (breaks on case 9 where "French cynicism" is accepted)
  - Discursive function (best fit - asks what work the statement does socially)

  The discursive function principle survives because it explains why identical content ("Tokyo clients won't push back") is acceptable in strategic planning (case 7a) but not when used to excuse managerial failure (case 7b). It also handles self-deprecation (case 4) by noting that Germans saying they lack humor reinforces positive identity through irony.

  The hardest pair is 1 vs 2. The survey data (1) functions as evidence, while the generic claim (2) performs cultural positioning. This principle forces the user to admit their acceptance of "Milanesi are cold" (case 8) is inconsistent unless they can show it avoids essentializing. 

  For new cases, a tourism ad using national traits would be acceptable (promotional function), while a British MP critiquing British cooking would be problematic (internal critique function). Claims about courts rather than people fail if they imply inherent dispositions. Hedged averages still essentialize if used prescriptively.

  The user must give up their comfort with "Milanesi are cold" and recognize all their accepted cases either serve non-essentializing functions or should be rejected. Their closing line to their friend should focus on how such statements construct social reality rather than describe it.
answer: |-
  Here is a principled account derived from your cases, prioritizing coherence over diplomacy. The survivor principle is **Discursive Function**.

  **Sorting my cases**
  Your judgments hinge on *what the generalization is doing*, not primarily accuracy, harm, or self-ascription. Group A (Acceptable): (1) Statistical fact used evidentially; (3) Self-ascription functioning as cultural *coordination* (reinforcing a shared, valued norm); (7a) Context-specific *strategic advice*; (8) Regional *internal differentiation* (contrastive identity work). Group B (Rejected): (2) Generic attribution implying inherent disposition; (4) Self-deprecation functioning as *essentializing trope* (even if "true", it reinforces a reductive stereotype); (5) Endorsed stereotype masquerading as evidence; (7b) Attribution used for *excusing systemic failure*; (6) Attribution used for *discrimination*. Group C (Ambiguous/Structural): (9) Borderline - acceptable if about institutional *interaction*, rejected if about inherent disposition; (10) Highlights the incoherence of territorial essentialism when applied to diaspora. Load-bearing: The distinction between *evidential/strategic/coordinative function* vs. *dispositional attribution/excuse/discrimination*.

  **Candidate Principles (Kills & Survivor)**
  1.  **Accuracy Principle:** "Generalizations are acceptable iff empirically well-supported." *KILL:* Fails (3), (4), (8) – you accept some potentially shaky self-/regional-ascriptions and reject some potentially "true" ones (4, German humor).
  2.  **Harm Principle:** "Generalizations are acceptable iff they cause no significant harm." *KILL:* Too broad/vague. Harm isn't always immediate or clear (e.g., 2, seemingly harmless but implies disposition). Also, "harm" isn't your primary stated objection in (2) or (9).
  3.  **Institutional Proxy Principle:** "Generalizations are acceptable iff they refer *only* to institutional behaviors or outcomes, not inherent dispositions." *KILL:* Fails (3), (8) – "Swiss are punctual" & "Milanesi are cold" clearly imply dispositions, yet you accept them. Also struggles with (9).
  4.  **Discursive Function Principle (SURVIVOR):** "The acceptability of a generalization depends on its *function within a specific discursive context*. It is acceptable when its primary function is: (a) Evidential (citing specific data/mechanisms), (b) Strategic Coordination (enabling practical action within a specific context), or (c) Internal Identity Coordination (reinforcing or contrasting group norms *within* the group). It is unacceptable when its primary function is: (d) Dispositional Attribution (implying inherent, stable traits explain behavior), (e) Systemic Excuse (explaining away failures of process or structure), or (f) Discriminatory Gatekeeping (justifying differential treatment)."

  *   **Clause (a) Evidential:** Motivates (1) Survey data.
  *   **Clause (b) Strategic Coordination:** Motivates (7a) Tokyo negotiation planning.
  *   **Clause (c) Internal Identity Coordination:** Motivates (3) Swiss punctuality (self-reinforcing norm), (8) Milanese/Neapolitan contrast (internal differentiation).
  *   **Clause (d) Dispositional Attribution:** Motivates rejection of (2) "Swedes are more trusting" (deletes data, implies inherent trait), (4) "Germans have no humour" (even self-deprecatingly, it essentializes).
  *   **Clause (e) Systemic Excuse:** Motivates rejection of (7b) Sales manager explaining office failure.
  *   **Clause (f) Discriminatory Gatekeeping:** Motivates rejection of (6) Promotion context.

  **The pair that breaks it: (1) vs (2) & (3) vs (4)**
  *   **(1) vs (2):** Principle saves both. (1) functions evidentially (Clause a). (2) functions as dispositional attribution (Clause d) by stripping away the statistical context, implying "Swedishness" inherently *means* trust. What's missing is the *mode of presentation* shifting from evidence to essence. Cost: It forces you to admit (2) *is* a candidate for accuracy *in principle* (it could be empirically true as a statistical tendency), but rejects it *in practice* because of its *function*.
  *   **(3) vs (4):** Principle saves both. (3) functions as internal identity coordination (Clause c) – Swiss saying it reinforces a valued social norm they actively maintain. (4) functions as dispositional attribution (Clause d) – even self-deprecatingly, it reinforces a reductive, essentializing trope about Germans ("We *are* humorless"), often used externally. Self-ascription isn't the switch; the *function* of the self-ascription is. Cost: It requires accepting that seemingly similar claims ("Group X is Y") can have wildly different functions based on context and intent, making simple rules impossible.

  **New Cases & Invented Embarrassment**
  1.  **Tourism Ad ("Experience Brazilian Joy!"):** *Acceptable (barely)*. Function: Strategic Coordination (b) – inviting engagement based on a perceived cultural *offering* (like food, landscape). Borderline with Dispositional Attribution (d) if it implies "joy" is inherent rather than a promoted experience.
  2.  **British MP: "The British are terrible at cooking."** *Unacceptable.* Function: Likely Dispositional Attribution (d) (reinforcing a national stereotype, even self-critically) or potentially Systemic Excuse (e) (if deflecting blame for policy failures in food education/supply). Internal Identity Coordination (c) fails as it's not reinforcing a valued norm.
  3.  **"Country X's courts are highly efficient."** *Acceptable ONLY* if describing institutional structure/processes (e.g., case backlog times, digital systems). Unacceptable if implying inherent national character (e.g., "Because X-ians are orderly"). Function determines: Evidential (a) if data-backed, Dispositional Attribution (d) in disguise if implying people's nature causes efficiency.
  4.  **Hedged Average ("On average, Italians tend to value family meals highly"):** *Acceptable IF* used evidentially (a) (citing surveys/time-use studies). *Unacceptable IF* used as Dispositional Attribution (d) (implying this tendency *defines* "Italianness" or explains specific behaviors beyond the data) or Discriminatory Gatekeeping (f) (e.g., denying an Italian a job because "they won't work late").
  5.  **Invented Embarrassment:** "Research shows Canadians are exceptionally polite; therefore, we can safely assume this Canadian defendant didn't intend the insult." Principle *requires rejection* (Function: Discriminatory Gatekeeping (f) / Dispositional Attribution (d) in a legal context, overriding individual evidence). This is correct philosophically but might *feel* harsh if the data is strong. The principle prioritizes the discursive harm of applying group averages to individuals in high-stakes contexts over potential statistical likelihood.

  **What I have to give up**
  The Discursive Function Principle forces you to drop or heavily qualify your acceptance of:
  *   **(8) "Milanesi are cold":** If said publicly to outsiders or used prescriptively, it likely functions as Dispositional Attribution (d) or even Discriminatory Gatekeeping (f) in social contexts, not pure Internal Identity Coordination (c). Your comfort stems from being *inside* the relevant cultural discourse; externally, it performs differently. You cannot claim this is fundamentally different from national claims like (2).
  *   **(3) "Swiss are punctual":** You must rigorously confine it to Internal Identity Coordination (c) or Strategic Coordination (b) (e.g., advising tourists). Using it to *explain* why a Swiss person was late (Dispositional Attribution (d)) or to deny them a flexible work arrangement (Discriminatory Gatekeeping (f)) becomes unacceptable under the principle.

  **Your single sentence to him next time:** "Generalizations about peoples aren't true or false in a vacuum; their acceptability hinges entirely on *what we're using them to do* in a specific conversation – building strategy or identity is one thing, explaining failure or limiting opportunity by invoking inherent traits is another."
