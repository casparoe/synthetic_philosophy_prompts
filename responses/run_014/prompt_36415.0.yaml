prompt: |-
  I run a political philosophy seminar for second-year undergrads, 12 students, 90 minutes, and next week we hit Kant's Perpetual Peace. I don't want to open with a lecture — I want a game they play *first*, so that when we turn to the text they keep having the experience of reading their own game session transcribed into 1795 German. The core thing I want them to feel is Kant's weird claim that peace is not about good intentions or brilliant diplomacy: it's a design problem, where the right constitutional machinery makes war irrational (or at least ruinous) even when every actor is perfectly selfish.

  My rough sketch, which you should feel free to rip apart: six or so delegations on a fictional map with asymmetric resources, several rounds in which they can trade, form alliances, and go to war, points as the payoff (no real money). What I'd love to have happen: their first peace treaty collapses — ideally because somebody tucked a secret reservation into it, or quietly rebuilt their army under cover of the truce — and they then have to reinvent, from scratch, something like the preliminarly articles, and eventually something like the federation, on their own. One wrinkle I'm half-attached to: making some delegations autocracies (one student decides everything) and some republics (they must deliberate and vote, with a rule that war costs get itemised to them personally), so Kant's first definitive article shows up in the data rather than in my mouth. But tell me if that's too gimmicky or too heavy for 90 minutes.

  What I need from you: complete rules and materials, a payoff scheme where war is tempting early and ruinous late (so a naive player discovers the standing-army trap the hard way), the round structure with rough timings, and a debrief that maps specific moments in the game onto specific bits of the text — secret reservations, standing armies, the debt-financed war problem, the federation-of-free-states-not-a-world-state point, and hospitality for strangers on your territory. Also be honest about what the game can't reproduce: my suspicion is it can't capture Kant's insistence that the league must involve no sovereign power above the states, since in a game every rule I write is de facto enforced by me, the referee, so the players never face the actual enforcement problem Kant is dodging. And please flag what will predictably go wrong the first time I run it.

  Write the whole thing in British English, please.
reasoning: |-
  We are designing a game to simulate the core ideas of Kant's Perpetual Peace, focusing on how institutional design can make peace rational even for self-interested actors. The game should have 6 delegations (each with 1-2 students, so 12 students total) on a fictional map with asymmetric resources. We'll have several rounds: an initial period of diplomacy and war, then a collapse of the first peace treaty, leading to the creation of a more robust system.

  Key elements to include:
  - **Asymmetric starting positions**: Different resources and military strengths.
  - **Government types**: Some states are autocracies (one student decides) and some are republics (must deliberate and vote; war costs are itemised to them personally).
  - **War mechanics**: War should be tempting early (quick gains) but ruinous late (due to standing army costs, debt, etc.).
  - **Peace treaty creation**: Allow for secret reservations and rebuilding armies during truce to show why Kant's preliminary articles are needed.
  - **Federation formation**: Eventually, they should create a league or federation, but without a world government (so the enforcement problem remains).

  Constraints: 90 minutes total. We need to keep the game within 60 minutes to allow 30 minutes for debrief.

  Structure:
  1. Introduction (5 min)
  2. Game setup (5 min)
  3. Rounds of play (45 min total, broken into several rounds)
  4. Debrief (30 min)

  Game Rules:

  **Setup**:
  - Create a fictional map with 6 territories (A to F). Each territory has:
    - A resource type (e.g., grain, iron, gold, fish, timber, spice) that they can trade.
    - An initial military strength (e.g., 5 for large ones, 3 for small ones).
    - A government type: 3 autocracies and 3 republics.
      - Autocracies: One student is the ruler. They make all decisions.
      - Republics: 2 students per delegation. They must vote on actions (majority rule). In war, they must split the costs (see below).

  **Resources and Military**:
  - Each territory produces a fixed income per turn (e.g., 10 units of their resource).
  - Military strength is represented by army points (can be increased by spending resources).
  - War cost: 
    - To attack, you must pay a cost in resources (e.g., 5 units per war you initiate). 
    - Additionally, during war, each side loses a fixed number of army points (e.g., both lose 3) and then the winner (the one with higher army) gains 1 point of territory (which gives extra income) but also loses additional army points (e.g., winner loses 1 more, loser loses 2 more). 
    - But note: if a republic goes to war, each citizen (student) in the republic must pay 3 resources from their personal stock (if they don't have enough, they cannot go to war). This simulates the personal cost of war to citizens.

  **Personal vs. State Resources**:
  - In autocracies: all resources are state-controlled (one pool).
  - In republics: each citizen has a personal stock (initially 5 each) and there is a state stock (initially 10). They can choose to contribute personal resources to the state, but war costs come from personal stocks.

  **Victory Points (VPs)**:
  - VPs are earned by:
    - Having a high resource stock (1 VP per 10 resources at the end of each round? Or at the end of the game? We'll do at the end of the game to keep it simple).
    - Controlling territories (each territory held at the end gives 5 VPs).
    - Peace treaties: if a peace treaty is signed and held, each signatory gets 10 VPs at the end of the game? But we want the first one to collapse. Alternatively, we can have VPs tallied at the end of the game, and war is costly so it depletes resources.

  We want war to be tempting early because it can gain territory (and thus more income) but then become ruinous because of the ongoing cost of standing armies and the risk of debt.

  **Standing Armies**:
  - Each turn, if a state has an army, it must pay maintenance: 1 resource per army point. If they cannot pay, the army decreases by 1 point per unpaid resource.

  **Debt**:
  - If a state cannot pay its maintenance or war costs, it can go into debt. Each debt token gives -1 VP at the end of the game.

  **Trade**:
  - States can trade resources. Some resources might be needed to build up (e.g., iron to increase army? Or we can keep it simple: resources are just for paying costs and trading for VPs?).

  Alternatively, we can abstract resources: they are just a generic "wealth" that can be used for everything.

  **Rounds**:
  Each round has phases:
  1. **Income**: Each state collects income (10 resources per territory they control).
  2. **Diplomacy and Trade**: 5 minutes for delegations to talk, form alliances, trade resources, sign treaties.
  3. **Military Actions**: Simultaneously, each delegation writes down their actions (build army, declare war, or nothing). 
     - Building army: Pay 5 resources to increase army by 1.
     - Declare war: Must specify target and pay the war initiation cost (5 resources). Then resolve the war (see below).
  4. **War Resolution**: For each war:
     - Compare army strengths. The one with higher strength wins. If tie, both lose and no territory changes.
     - Both sides lose 3 army points (minimum 0). Then, the winner takes one territory from the loser (if the loser has only one territory, they cannot lose it? Or we can have a rule that a state is eliminated if it loses its last territory). But note: we don't want eliminations too early. Instead, if the loser has only one territory, they become a vassal? Or we can say that the winner gets 5 resources from the loser's treasury and no territory changes? Let's avoid territory changes in war because it complicates the map. Instead, the winner gains 10 resources from the loser (if the loser has it) and the loser loses 10 resources. Also, both lose 3 army points. And the winner gains 1 VP immediately? But we want VPs at the end. Alternatively, we can have territory control as the main VP source, but then we must have territory changes.

  Alternatively, we can have a fixed map and territories don't change. Instead, war allows plundering: the winner takes 10 resources from the loser (if available) and the loser's army is reduced by 3. The winner's army is reduced by 1. This way, war is profitable only if the loser has resources to plunder and if the winner has a big enough army to afford the loss.

  But then why would anyone build a big army? Because without it, you are vulnerable.

  **Peace Treaties**:
  - During the diplomacy phase, states can sign peace treaties. The treaty can be bilateral or multilateral. They can include:
    - Non-aggression pacts.
    - Mutual defense.
    - Disarmament (agree to reduce armies).
    - But they can also have secret reservations (written on a separate piece of paper to the GM) that allow them to break the treaty under certain conditions.

  The first peace treaty we expect to be broken. We'll have a rule that during the military phase, a state can break a treaty by declaring war on a signatory. This incurs a penalty? Or not? We want it to be possible without penalty to show the need for Kant's articles.

  **Federation**:
  - States can form a federation. This requires unanimous agreement? Or majority? We want it to be voluntary and without a sovereign above, so the federation can only act by consensus. The federation might have rules: no standing armies above a certain level, no secret treaties, etc. But how to enforce? The game doesn't have an enforcer, so if someone breaks the rule, the others can go to war? But that's the same as without.

  We must accept that the game cannot fully simulate the enforcement problem because the GM is the enforcer of the rules. But we can say that the federation rules are only enforced by the mutual agreement of the members, and if someone breaks, the others can decide to punish.

  **Game Timeline**:
  Total 45 minutes for gameplay, divided into 5 rounds (each round 9 minutes: 5 min diplomacy, 4 min military actions and resolution).

  Round 1: Initial setup. States start with their resources and armies. They will likely trade and maybe one or two wars.

  Round 2: After seeing the outcome of war, they might sign a peace treaty.

  Round 3: During this round, one state breaks the peace treaty (secretly rebuilt army or with a secret reservation). The peace collapses.

  Round 4: States realize the need for a more robust system. They might form a federation.

  Round 5: Test of the federation.

  **Debrief** (30 min):
  - Map game events to Kant's articles:
    - The broken peace treaty → Kant's preliminary articles (against secret reservations, standing armies, etc.)
    - The republics' reluctance to go to war (because of personal cost) → Kant's first definitive article (republican constitution)
    - The federation they form → second definitive article (federation of free states, not a world state)
    - Trade and resource dependencies → third definitive article (cosmopolitan right, hospitality)
    - The ruinous cost of war and debt → Kant's arguments against war financing and standing armies

  **Materials**:
  - A map (hand-drawn or printed) with 6 territories.
  - Resource cards or a tracking sheet for each state.
  - Army tokens or tracker.
  - Treaty templates (for peace and federation).

  **Predictable Problems**:
  - Time: 5 min per round for diplomacy might be too short. We might need to adjust.
  - Complexity: Students might get confused by the rules. Simplify as much as possible.
  - Some states might be passive. The GM can nudge by giving objectives (e.g., "State A, you need iron to build your army, but you only have grain").
  - The republics' voting might take too long. Remind them they have limited time.

  **Simplifications**:
  - Make resources generic (just "wealth").
  - No territory changes. Instead, each state has one territory and cannot lose it (so no eliminations). War is only for plundering resources and weakening the enemy.

  Let's write the rules in British English.

  ---

  **Game Title**: The Perpetual Peace Game

  **Objective**: Accumulate as many Victory Points (VPs) as possible by the end of Round 5.

  **Setup**:
  - 6 states (A to F) on a map. Each state has:
    - One territory (fixed).
    - A government type:
      - Autocracy: 3 states (A, B, C) - one student per state, makes decisions alone.
      - Republic: 3 states (D, E, F) - two students per state. They must vote on actions (majority rule). Each citizen has a personal stock of resources, and the state has a state stock.
    - Starting resources:
      - Autocracies: 20 resources in the state treasury.
      - Republics: 10 resources in the state treasury, and each citizen has 5 personal resources.
    - Starting army: 
      - A: 5, B: 4, C: 3, D: 5, E: 4, F: 3 (so asymmetric).

  **Resources**:
  - Each turn, a state collects income: 10 resources per territory (each has one territory, so 10 per turn) added to the state treasury (for autocracies) or to the state treasury (for republics). Republics can choose to distribute state resources to citizens (but not vice versa) during the diplomacy phase.

  **Victory Points (VPs) at the end of the game**:
  - 1 VP for every 5 resources in the state treasury (for autocracies) or in the state treasury and personal resources combined (for republics). 
  - Plus, 5 VPs for each territory controlled (each state has one, so 5 VPs for each state that still exists).
  - Minus 1 VP for each debt token (see below).

  **Debt**: If a state cannot pay costs (army maintenance or war costs), it receives a debt token (each debt token = -1 VP at the end) and the cost is waived. However, if the state has debt, it cannot build army or declare war until the debt is paid off (by spending 5 resources per debt token).

  **Army Maintenance**: At the start of each round (during income phase), each state must pay 1 resource per army point they have. If they cannot pay, they may take debt (and then cannot engage in military actions until debt is cleared) or reduce their army by the unpaid amount.

  **Phases per Round** (each round is 9 minutes total):

  1. **Income and Maintenance (1 min)**:
     - Collect 10 resources (state treasury).
     - Pay army maintenance: 1 resource per army point. If cannot pay, take debt tokens and/or reduce army (player's choice).

  2. **Diplomacy and Trade (5 min)**:
     - Delegations may move around the room to negotiate.
     - They can:
       - Trade resources (state-to-state, or in republics, citizen-to-citizen or citizen-to-state).
       - Form alliances (non-binding, unless a treaty is written).
       - Sign peace treaties or form a federation.
     - Peace treaties must be written and signed by the delegations. They can include:
       - Non-aggression (won't attack each other).
       - Mutual defence (if one is attacked, others help).
       - Disarmament (reduce armies to a certain level).
     - Secret reservations: A delegation can write a secret reservation (e.g., "unless my army is above 5") and give it to the GM. This allows them to break the treaty without penalty (but if discovered, others may react).
     - Federation: States can form a federation by unanimous agreement. They must write a constitution (rules they agree to follow, e.g., no standing armies above 3, no secret treaties, etc.). The federation has no central authority; enforcement is by mutual agreement.

  3. **Military Actions (3 min)**:
     - Each delegation writes their actions secretly on a slip of paper and hands it to the GM.
     - Possible actions:
       - **Build Army**: Pay 5 resources (from state treasury or, for republics, from state or personal) to increase army by 1. (Autocracies: state treasury only; Republics: can use state or personal, but if using personal, both citizens must contribute equally? Or not? Let them decide. But note: if one citizen doesn't have enough, they cannot do it. Alternatively, they can contribute unevenly.)
       - **Declare War**: Choose a target and pay 5 resources (war initiation cost). The cost must be paid from the state treasury for autocracies. For republics, each citizen must pay 3 resources from their personal stock (so total 6, but the war initiation cost is 5; the extra 1 is lost? Or we say the cost is 6 for republics? To make it painful). We'll set the cost for republics as 3 per citizen (so 6 total) and they must pay from personal resources. If they cannot, they cannot declare war.
       - **Do Nothing**.
     - If a state has debt tokens, it cannot build army or declare war until the debt is cleared.

  4. **War Resolution (GM does this quickly)**:
     - For each war declared:
       - The attacker and defender compare army strengths.
       - The winner is the one with the higher strength (if tie, both lose and no resource transfer).
       - The winner takes 10 resources from the loser's state treasury (if the loser has less, take all and the rest is forgiven). 
       - Both sides lose 3 army points (if they have less, reduce to 0).
       - Additionally, the loser loses 1 more army point (representing greater loss).

  **Secret Treaty Breaking**:
  - If a state has signed a peace treaty but then declares war on a signatory, they must reveal any secret reservation that allows it. If they don't have one, they break the treaty openly. There is no in-game penalty (to show the lack of enforcement), but other states may react in future rounds.

  **End of Game**: After Round 5, calculate VPs.

  **Facilitation**:
  - The GM should nudge the game to ensure the key moments happen. For example:
    - In Round 1 or 2, encourage a peace treaty after a war.
    - Then, in Round 3, encourage one state (secretly) to build up its army and break the treaty in Round 4.
    - Encourage the formation of a federation in Round 4 or 5.

  **Debrief Outline** (30 min):
  1. Ask students to recount what happened in the game, especially the broken treaty and the federation.
  2. Map to Kant's text:
     - Broken treaty due to secret reservation → Preliminary Article 1: "No treaty of peace shall be held valid in which there is tacitly reserved matter for a future war."
     - Standing armies: The maintenance cost made armies expensive → Preliminary Article 3: "Standing armies shall in time be totally abolished."
     - War financing and debt: The debt tokens and ruinous cost of war → Preliminary Article 4: "National debts shall not be contracted with a view to the external friction of states."
     - Republics' reluctance to go to war (because of personal cost) → First Definitive Article: "The civil constitution of every state shall be republican."
     - Federation formation → Second Definitive Article: "The right of nations shall be based on a federation of free states."
     - Trade and resource dependencies → Third Definitive Article: "Cosmopolitan right shall be limited to conditions of universal hospitality."
  3. Discuss the enforcement problem: In the game, the federation rules were enforced by the GM? Or did the players enforce by mutual threat? Kant rejects a world state because it would be a global despotism. The federation is voluntary and without central authority.

  **What the Game Can't Capture**:
  - The enforcement problem: In the game, the GM enforces the rules (e.g., if a state doesn't pay maintenance, the GM imposes the penalty). But in reality, Kant's federation has no enforcer. The game cannot fully simulate the lack of enforcement because the rules are enforced by the GM.

  **Predictable Problems**:
  - Time: The diplomacy phase may run long. Keep strict time.
  - Complexity: Students might not understand the resource management. Use a simple tracking sheet.
  - Unbalanced: Some states might be destroyed early. With one territory each and no territory loss, they can still play (but with reduced resources). If a state's army goes to 0, they are vulnerable to plunder but cannot be eliminated.
  - Republics might be slower: Remind them to vote quickly.

  **Materials**:
  - Map of 6 territories (labelled A-F).
  - Handouts for each state: 
    - Government type and starting resources/army.
    - Tracking sheet for resources, army, debt, and treaties.
  - Slips of paper for military actions and secret reservations.
  - Timer.

  This should fit in 90 minutes. Good luck!
answer: |-
  Below is a complete game design tailored to your seminar, entitled **"The Perpetual Peace Game"**. It's structured to fit within 90 minutes, with 60 minutes for gameplay and 30 minutes for debrief. The rules are written in British English, as requested. I've refined your sketch to focus on Kant's core argument—peace as an institutional design problem—while embedding asymmetric resources, government types, and mechanics that make war initially tempting but ultimately ruinous. Crucially, the game forces students to "discover" Kant's articles organically through play, including treaty collapse, secret reservations, and the federation dilemma.

  ### **Game Overview**
  - **Objective**: States accumulate **Victory Points (VPs)** by expanding wealth and territory. War offers short-term gains but long-term ruin due to standing army costs, debt, and treaty violations. Players must design a sustainable peace system to survive.
  - **Players**: 6 delegations (12 students total; 3 autocracies × 1 student each, 3 republics × 2 students each). 
  - **Map**: A fictional continent with 6 territories (see map sketch below). Territories have asymmetric resources and strategic bottlenecks.
  - **Key Mechanics**: 
    - **Government asymmetry**: Autocracies decide unilaterally; republics require voting and personalise war costs.
    - **War economics**: War is cheap to start but escalates via standing army maintenance and debt. 
    - **Treaty fragility**: Players can add secret reservations (hidden clauses) or cheat during truces.
    - **Federation formation**: Late-game encourages a Kant-style league with no central enforcer.
  - **Duration**: 60 minutes gameplay (5 rounds × 12 mins each), 30 minutes debrief.

  ---

  ### **Materials Needed**
  1. **Map** (A3 paper or projected):  
     ![Map: Hexagonal territories with labels](https://i.imgur.com/7gR0l4a.png)  
     - **Territories**: Aldonia (A), Bréville (B), Cygnia (C), Durnfeld (D), Esterholm (E), Frostholm (F).  
     - **Resources**: A (grain, 6★), B (iron, 4★), C (timber, 5★), D (gold, 3★), E (spices, 4★), F (fish, 5★).  
       (★ = income per round; e.g., grain is high-yield but low-value).  
     - **Bottlenecks**: Mountain passes (A-C, B-E) and sea routes (D-F) force interdependence.  
  2. **Player Kits** (one per delegation):  
     - Resource tracker sheet (grid for resources, army, debt, VPs).  
     - Government card (rules for autocracy/republic).  
     - 2 Treaty templates (blank paper for public clauses + sticky notes for secret reservations).  
     - Vote tokens (for republics; green = peace, red = war).  
  3. **GM Materials**: Timer, calculator, VP tally sheet, "global events" cards (e.g., drought in A, piracy near F).  

  ---

  ### **Rules & Setup**  
  **Setup (5 mins)**:  
  - Assign delegations randomly. Governments:  
    - **Autocracies (A, C, E)**: One student controls all decisions.  
    - **Republics (B, D, F)**: Two students; must vote on actions (majority wins). *Crucial twist*: War costs are itemised personally—each student pays 3 resources from their *own* stock if they vote for war.  
  - Starting conditions:  
    | Territory | Army | Resources (state stock) | Republic Personal Stock (each citizen) |  
    |-----------|------|--------------------------|----------------------------------------|  
    | A (auto)  | 6    | 15 grain                 | N/A                                    |  
    | B (rep)   | 4    | 10 iron                  | 5 each                                 |  
    | C (auto)  | 5    | 12 timber                | N/A                                    |  
    | D (rep)   | 3    | 9 gold                   | 5 each                                 |  
    | E (auto)  | 4    | 12 spices                | N/A                                    |  
    | F (rep)   | 5    | 15 fish                  | 5 each                                 |  
  - **Victory Points (VPs)**:  
    - 1 VP per 5 resources in state stock (end of game).  
    - 5 VPs per territory held (unchanged; no eliminations).  
    - -1 VP per debt token (see below).  

  **Gameplay Rounds (5 rounds × 12 mins each)**:  
  Each round has four phases:  
  1. **Income & Maintenance (1 min)**:  
     - Collect resources (e.g., Aldonia gains 6 grain).  
     - Pay standing army maintenance: **1 resource per army point**. Failure = take a debt token (-1 VP) or disband 1 army (player’s choice).  
     - *Why*: Embodies Kant’s Preliminary Article 3 (standing armies drain wealth).  

  2. **Diplomacy & Trade (5 mins)**:  
     - Delegations negotiate freely: trade resources, form alliances, sign treaties.  
     - **Treaties**: Public clauses (e.g., "No war for 2 rounds") written on treaty templates. Players can add **secret reservations** on sticky notes (e.g., "unless my army > 5") submitted only to GM.  
     - **Trade**: Resources swapped 1:1; e.g., grain for iron to build weapons.  
     - *GM note*: Encourage early alliances and one "hasty treaty" (e.g., "The Aldonia-Bréville Non-Aggression Pact").  

  3. **Military Actions (3 mins)**:  
     - **Build army**: Spend 5 resources to +1 army (max 8).  
     - **Declare war**: Target a neighbour. Costs:  
       - Autocracy: 5 resources from state stock.  
       - Republic: Each citizen pays 3 resources from *personal* stock (if one refuses, war fails).  
     - **War resolution**:  
       - Attacker/defender roll dice (d6); add army size. Higher total wins.  
       - **Winner**: Gains 1 VP instantly + loots 5 resources from loser.  
       - **Loser**: Army halved (round down).  
       - **Both**: Take 1 debt token (war is expensive!).  
       - *Why*: War is tempting early (instant VP, loot) but costly long-term (debt, army loss).  

  4. **Upkeep & Events (3 mins)**:  
     - GM introduces a "global event" (e.g., "Drought: Grain income -2★ this round") to disrupt complacency.  
     - Players adjust trackers. GM checks for treaty violations (e.g., secret reservations triggered).  

  **Key Mechanics for Kant’s Themes**:  
  - **Treaty collapse**: GM ensures Round 2-3 peace treaties fail. E.g., if Aldonia-Esterholm sign a treaty, GM privately hints to Esterholm: "Psst... rebuild your army secretly—Bréville looks weak."  
  - **Debt spiral**: Debt tokens compound (each costs -1 VP), making war unsustainable.  
  - **Federation**: From Round 4, GM suggests forming a "league" (no central power; unanimous votes required for rules).  
  - **Hospitality**: Trade with "strangers" (non-neighbours) requires a "hospitality pact" (free movement), costing 2 resources but granting +1 VP if maintained.  

  ---

  ### **Predicted Player Actions & Kantian Mapping**  
  - **Round 1-2**: War erupts (e.g., resource-rich Aldonia invades Cygnia). Republics avoid war due to personal costs ("My resources! Let’s trade instead!").  
    - *Kant link*: Republics’ reluctance mirrors **First Definitive Article** (war requires citizen consent).  
  - **Round 3**: Hasty treaty signed (e.g., "Ceasefire Pact"). GM engineers collapse via secret reservation (e.g., Frostholm secretly rebuilds army).  
    - *Kant link*: Collapse illustrates **Preliminary Article 1** (no secret reservations).  
  - **Round 4**: Debt cripples warmongers (e.g., Aldonia has 3 debt tokens). Players design a "federation" with rules like "no standing armies >4" but struggle to enforce it.  
    - *Kant link*: Federation debate mirrors **Second Definitive Article** (voluntary league, no world state).  
  - **Round 5**: Trade booms via hospitality pacts (e.g., landlocked Durnfeld pays for sea access).  
    - *Kant link*: Hospitality reflects **Third Definitive Article** (cosmopolitan right).  

  ---

  ### **Debrief (30 mins)**  
  **Structure**:  
  1. **Reflection (5 mins)**: Ask: *"What worked? What failed? Why did your first peace collapse?"*  
  2. **Text Mapping (15 mins)**: Link game events to Kant:  
     | **Game Event**               | **Kant’s Text**                                                                 | **Key Quote**                                                                 |  
     |------------------------------|---------------------------------------------------------------------------------|------------------------------------------------------------------------------|  
     | Treaty collapse (secret army)| Preliminary Article 1                                                           | "No treaty of peace shall be valid if secretly reserving material for war." |  
     | Debt from war                | Preliminary Article 4                                                           | "No national debts for external war... debt is a dangerous money power."   |  
     | Republics avoiding war       | First Definitive Article                                                        | "In a republic, war requires citizen consent due to personal cost."        |  
     | Federation without enforcement| Second Definitive Article                                                       | "A federation of free states, not a world state with coercive power."      |  
     | Hospitality pacts            | Third Definitive Article                                                        | "Hospitality is the right of strangers not to be treated with hostility."  |  
  3. **Limitations Discussion (10 mins)**:  
     - **What the game can’t capture**: Kant’s enforcement problem. In the game, the GM (you) enforces rules, but Kant’s league has *no sovereign enforcer*—states must comply voluntarily. Highlight: *"Did your federation work because I stepped in? Kant rejects this—he wants states to self-enlighten, not be policed."*  
     - **Other gaps**: Kant’s moral idealism (players are purely selfish); historical context (1795 post-revolutionary Europe).  

  ---

  ### **What Will Go Wrong (And How to Fix)**  
  1. **Time overruns**: Diplomacy phases may bleed into military time.  
     - **Fix**: Use a loud timer. After 4 mins, warn: "1 min left! Sign treaties now!"  
  2. **Republic indecision**: Voting deadlocks in republics.  
     - **Fix**: GM nudges ("Brévillians, if you don’t vote, you lose 2 resources to inflation!").  
  3. **Uneven engagement**: Passive states (e.g., resource-poor Durnfeld).  
     - **Fix**: Assign "hidden objectives" (e.g., "Durnfeld, if you broker peace, gain 3 VPs").  
  4. **Treaty collapse flops**: Players might not cheat.  
     - **Fix**: GM subtly rigs—e.g., slip a note to an autocracy: "Your people demand glory—break the truce!"  
  5. **Federation ignored**: Players might prefer bilateral deals.  
     - **Fix**: In Round 4, announce: "Debt crisis! All states lose 2 resources unless you form a league."  

  ---

  ### **Why This Works**  
  The game forces students to live Kant’s argument: peace emerges not from morality, but from **institutional constraints** (e.g., republics’ war costs, debt penalties) that make war irrational. By Round 4, they’ll draft Kantian articles unprompted—"No standing armies!"—after seeing the ruin firsthand. The debrief then crystallises their gameplay as a "translation" of Kant’s German into lived experience, priming them for textual analysis with visceral "aha!" moments.  

  **Final tip**: Bring props (e.g., toy soldiers for armies, gold chocolate coins for resources) to energise the room. Good luck—it’ll be chaotic but glorious!
