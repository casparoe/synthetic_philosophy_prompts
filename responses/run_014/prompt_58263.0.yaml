  So I'm a retired physics professor, did fluids and weather modeling for 30-odd years, and since retiring I've gotten into philosophy just for fun. Now I volunteer doing tours at our town's old textile mill museum and I'm kinda stuck on something. I love telling school groups that if the night foreman hadn't been home sick with flu that one night back in winter 73 when the river rose, he'd have opened the sluice in time, the mill wouldn't have flooded and shut for six months, the Ohio company wouldn't have pulled its contract, and our town wouldn't have lost half its jobs in the 70s. My co-guide says that's silly, the mill was doomed anyway with cheap imports and bad management, and you can't pin decades of decline on one sick day. My gut from my old lab work says tiny nudges can realy blow up like in weather, but maybe history is different and my co-guide has a point. Who's got the stronger arguement and what should I actually tell the kids?

  Please organize your reply in this order: Bottom Line in 2-3 sentences, Why My Sick-Day Story Feels Right in a short paragraph, Why My Co-Guide Might Be Right in a short paragraph, What To Say On Future Tours in 4-5 sentences.
