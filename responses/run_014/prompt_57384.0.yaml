  ### Game Plan for Determinism and Predictability Discussion Section

  **Objective:** Help students experience two key insights in one session:
  1. **Deterministic Unpredictability:** A rule with zero randomness can be unpredictable beyond a horizon due to sensitivity to initial conditions.
  2. **Random Predictability:** Genuinely random events are predictable in the aggregate (law of large numbers).

  **Structure:** 24 students in 6 groups of 4. Two-part game with paper, pencils, and handouts. No computers or real money. Points convert to a grade kicker (e.g., 0.1% extra credit per 10 points, max 1.5%).

  ---

  ### **Part 1: Deterministic but Unpredictable (Doubling Map)**
  **Rules:**  
  - Each group starts with a 5-digit decimal (e.g., "54321" for Group 1).  
  - **Rule:** Double the current 5-digit number, then keep only the last 5 digits (ignore any leading 1).  
    - *Example:* Start: 54321 → Double: 108642 → Keep last 5 digits: 08642.  
  - Groups predict the next 5 states (Steps 1–5) **based only on their starting number** (they don’t know hidden digits).  
  - **Betting:** Allocate 50 points across Steps 1–5 (0–10 points per step).  
    - If prediction matches the "true" value **exactly** (all 5 digits), gain the bet points.  
    - If wrong, lose the bet points.  

  **Handout Numbers (Precomputed):**  
  Each group gets a unique starting number (first 5 digits) and later receives the true values (revealed after predictions).  
  - **Group 1:** Start: `54321` → True Steps:  
    `Step1: 08642`, `Step2: 17284`, `Step3: 34568`, `Step4: 69136`, `Step5: 38272`  
  - **Group 2:** Start: `54321` → True Steps:  
    `Step1: 08643`, `Step2: 17286`, `Step3: 34572`, `Step4: 69144`, `Step5: 38288`  
  - **Group 3:** Start: `54321` → True Steps:  
    `Step1: 08642`, `Step2: 17285`, `Step3: 34570`, `Step4: 69140`, `Step5: 38280`  
  - **Group 4:** Start: `54321` → True Steps:  
    `Step1: 08642`, `Step2: 17284`, `Step3: 34569`, `Step4: 69138`, `Step5: 38276`  
  - **Group 5:** Start: `54321` → True Steps:  
    `Step1: 08642`, `Step2: 17284`, `Step3: 34568`, `Step4: 69137`, `Step5: 38274`  
  - **Group 6:** Start: `54321` → True Steps:  
    `Step1: 08642`, `Step2: 17284`, `Step3: 34568`, `Step4: 69136`, `Step5: 38273`  

  **Why it works:**  
  - The true computation uses a hidden 5-digit suffix (e.g., Group 1: `00001`; Group 2: `50000`).  
  - Groups assume the suffix is `00000`, so errors compound (e.g., hidden carry-overs after doubling).  
  - **Horizon effect:** Predictions are accurate for 1–3 steps but diverge by Steps 4–5 as hidden digits amplify. Students bet confidently early on but lose points later.  

  ---

  ### **Part 2: Random but Predictable (Coin Flips)**
  **Rules:**  
  - Each group gets 20 random digits (0–9) from a handout. Treat as coin flips:  
    - **Heads (H):** 0–4 | **Tails (T):** 5–9.  
  - **Part 2a (Unpredictable Individual):**  
    - Predict exact number of heads in their 20 flips. Bet 0–50 points.  
    - If exact, gain bet points; if not, lose bet points.  
  - **Part 2b (Predictable Aggregate):**  
    - Predict class-wide total heads (sum of all 6 groups). Bet 0–50 points.  
    - If within ±5 of true total, gain bet points; else lose.  

  **Handout Numbers (Pre-generated Random Digits):**  
  Each row is for one group:  
  ```
  Group1: 4 2 8 7 1 6 3 9 0 5 2 7 4 1 8 3 6 2 9 5  → Heads: 10 (0-4 count)  
  Group2: 9 1 5 0 3 7 2 4 8 6 1 0 4 5 9 2 7 3 1 8  → Heads: 11  
  Group3: 0 4 6 2 9 3 1 5 8 7 4 0 2 6 3 1 5 9 7 0  → Heads: 10  
  Group4: 3 7 0 1 8 4 2 5 6 9 1 3 0 2 7 4 8 5 2 6  → Heads: 9  
  Group5: 2 5 1 9 4 8 0 3 6 2 7 1 5 0 9 3 4 8 1 7  → Heads: 8  
  Group6: 1 0 7 4 2 8 5 3 6 9 0 1 4 7 2 5 3 8 1 6  → Heads: 9  
  ```
  - **Class Total Heads:** 10 + 11 + 10 + 9 + 8 + 9 = **57**  
    - *Prediction for Part 2b is "within ±5 of 57" (52–62).*  

  **Why it works:**  
  - Individual predictions (Part 2a) usually fail (exact heads is hard), showing randomness.  
  - Aggregate predictions (Part 2b) usually succeed (57 is near expected 60), showing law of large numbers.  

  ---

  ### **Minute-by-Minute Timeline (Total: 75 min)**  
  1. **Introduction (5 min):**  
     - Frame the game: "We’re exploring predictability. No warnings—learn by doing!"  
     - Split into groups, hand out Part 1 worksheets.  

  2. **Part 1: Deterministic Game (25 min):**  
     - **0–5 min:** Explain rules + demo (e.g., "54321 → 08642").  
     - **5–10 min:** Groups predict Steps 1–5 and allocate bets (50 points total).  
     - **10–15 min:** Reveal true values (hand out precomputed sheets).  
     - **15–20 min:** Groups calculate scores (gain/loss per step).  
     - **20–25 min:** Quick share: "Which step did predictions first fail?" (Groups 2–6: Steps 1–5; Group 1: may get all).  

  3. **Part 2: Random Game (25 min):**  
     - **25–30 min:** Explain rules + hand out random digit sheets.  
     - **30–32 min:** Part 2a—Predict own heads count + bet (0–50 pts).  
     - **32–35 min:** Convert digits to heads/tails and record actual heads.  
     - **35–37 min:** Calculate Part 2a scores.  
     - **37–39 min:** Part 2b—Predict class total heads + bet (0–50 pts).  
     - **39–42 min:** Collect group heads, reveal class total (57).  
     - **42–45 min:** Calculate Part 2b scores.  

  4. **Debrief (20 min):**  
     - **Part 1 Mapping:**  
       - *Deterministic unpredictability:* Rule had no randomness, but hidden digits caused errors to double each step. Predictions failed after 1-5 steps (the "horizon"). Like weather forecasting—small initial errors grow.  
       - *Student experience:* Bet confidently early (easy math), lost later (unpredictable).  
     - **Part 2 Mapping:**  
       - *Random predictability:* Individual flips are chaotic, but 120 flips averaged ~0.475 heads (expected 0.5). Law of large numbers wins.  
       - *Student experience:* Lost individual bets (randomness), won aggregate (predictability).  
     - **Contrast:**  
       - "Determinism ≠ predictable beyond horizon; randomness ≠ unpredictable in aggregate."  
       - Real-world: Chaos theory (e.g., double pendulum) vs. insurance/casinos (aggregate risk).  

  ---

  ### **What Goes Wrong + Fixes**  
  1. **Arithmetic eats time (Part 1):**  
     - *Problem:* Groups slow on doubling/modulo math (e.g., 97520 × 2 = 195040 → 95040).  
     - *Fix:* Demo with calculators allowed (focus on concepts, not math). Pre-print calculation aids if needed.  

  2. **Group 1 gets all predictions right:**  
     - *Problem:* Their hidden digits (`00001`) caused no carry-over, so predictions matched.  
     - *Fix:* In debrief, clarify: "Sometimes the horizon is longer, but most hit it by Step 5."  

  3. **Part 2b class total outside ±5:**  
     - *Problem:* 57 is expected, but extreme luck could push it to 50 or 64.  
     - *Fix:* Use ±5 (covers 75% of cases) and note: "Predictable doesn’t mean perfect—variance happens."  

  ---

  ### **Limitations of Paper-Pencil Game**  
  - **Can’t replicate true chaos:**  
    - Students see unpredictability from hidden state, not inherent chaos. Real systems (e.g., weather) amplify tiny measurement errors, not just unknowns.  
    - *What you supply:* Clarify that "finite precision in real observations creates similar horizons—even with 'full' data."  
  - **Randomness feels artificial:**  
    - Pre-generated digits lack tactile randomness (e.g., coin-flip anxiety).  
    - *What you supply:* Emphasize aggregate predictability mathematically: "120 flips have SD ≈ 5.5, so ±5 is reasonable."  

  ---

  **Grade Kicker:**  
  - Points = Part 1 score (-50 to 50) + Part 2a (-50 to 50) + Part 2b (-50 to 50).  
  - Extra credit = max(0, total points) × 0.01% (e.g., 100 points = 1% bonus). Affordable and motivating!  

  **Materials to Prep:**  
  - Group handouts (starting numbers, true values, random digits).  
  - Worksheets for predictions/bets.  
  - Calculator access (optional).  
  - Master sheet with true values/aggregate math.  

  This plan fits 75 min, forces "confident bets → losses" for the horizon effect, and contrasts both concepts vividly.
