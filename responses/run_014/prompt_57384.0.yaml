    What the game can't reproduce:

      - In the deterministic system, we are missing part of the state. In a real deterministic system, we might have the full state, but the system is chaotic so any small error (like measurement error) will grow. In our game, the hidden part is the analogue of the unmeasured part. But in a real chaotic system, even if you have the full state to a finite precision, the error from the finite precision will grow. Our game with fixed precision (5 visible digits) and 5 hidden digits is a model of that.

      - The game might not convey that in a chaotic system, the unpredictability is due to the system's dynamics, not because of hidden information. But in our case, we introduced hidden information to simulate the effect of limited precision.

      - For the random system, the game might not convey that the predictability in the aggregate is due to the law of large numbers. We will explain in debrief.

  Debrief:

    - Part 1: 
          Ask groups: 
            - How many of you got all 5 steps correct? (probably group1)
            - How many got the first step wrong? (group2) 
            - How many got step2 wrong? (group3) and so on.
          Then ask: even though the system is completely deterministic, why did most of you start to get predictions wrong after a few steps?
          Answer: because you didn't have the full initial state. The part you didn't see (the last 5 digits) affected the carry, and then the error doubled each step. This is sensitivity to initial conditions. The horizon of predictability was about the number of digits you could see? Because the error doubles every step, after about 5 steps the error is 32 times the initial hidden error, and that becomes visible in the first 5 digits.

          In a real chaotic system (like weather), we have limited precision in measuring the initial state, so beyond a horizon (which depends on the precision and the rate of error growth) we cannot predict.

    - Part 2:
          Ask: 
            - How many of you predicted your own group's number of heads exactly? (probably very few, since the probability is low)
            - How many of you won on the class total prediction? (probably most, because the class total is more predictable)

          So even though each coin flip is random, the average is predictable. This is the law of large numbers.

    - Contrast: 
          In the deterministic system, we saw that beyond a horizon, prediction is impossible because of sensitivity to initial conditions.
          In the random system, we saw that individual outcomes are unpredictable, but aggregates are predictable.

    - Real-world examples: 
          Deterministic chaotic systems: weather (beyond about 10 days, prediction is impossible), double pendulum.
          Random systems: casino games (the house wins in the aggregate), insurance.

    - Finally, note that sometimes deterministic systems can be modeled as random if we don't know the initial state exactly, and sometimes random systems can be predicted in the aggregate.

