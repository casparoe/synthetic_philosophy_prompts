  ### Translation of the Hitchhiker Case into POMDP Vocabulary
  **POMDP Setup:**  
  - **Hidden state** \(s \in \mathcal{S}\): Hitchhiker's trustworthiness (\(s_T\) = trustworthy, \(s_U\) = untrustworthy).  
  - **Observations** \(o \in \mathcal{O}\): Evidence about trustworthiness (e.g., \(o_b\) = bad appearance, \(o_g\) = good appearance).  
  - **Actions** \(a \in \mathcal{A}\): {wave, not_wave}.  
  - **Transition dynamics**: Trustworthiness is static (no state change).  
  - **Observation function**: \(P(o_b \mid s_U) \approx 1\) (bad appearance if untrustworthy).  
  - **Reward function**:  
    - \(R(\text{wave}, s_T) = +R_{\text{high}}\) (ride obtained).  
    - \(R(\text{wave}, s_U) = -R_{\text{penalty}}\) (penalty, e.g., driver retaliation).  
    - \(R(\text{not\_wave}, \cdot) = 0\).  
  - **Driver's behavior**: Stops iff hitcher waves. Driver infers trustworthiness from waving (signaling equilibrium: only trustworthy hitchers wave).  

  **Agent's Belief and Policy:**  
  - **Belief state** \(b(s)\): Bayesian posterior over \(s\) given history. Initial \(b(s_U) \approx 1\) after \(o_b\).  
  - **Policy** \(\pi(b)\): Maps belief to action. If \(b(s_U) > \theta\) (threshold), \(\pi(b) = \text{not\_wave}\) (due to penalty risk).  
  - **Value function** \(V^\pi(b)\): Expected reward under \(\pi\).  

  **Hitchhiker's "Irrational" Belief:**  
  The agent adopts an *instrumental belief* \(\tilde{b}\) where \(\tilde{b}(s_T) = 1\) (false), despite \(b(s_U) \approx 1\). Under \(\tilde{b}\), \(\pi(\tilde{b}) = \text{wave}\). This triggers driver stopping, yielding \(R_{\text{high}}\) even if \(s = s_U\) (no penalty occurs in the story).  

  **Claim in RL Terms:**  
  Holding a belief \(\tilde{b} \neq b\) (epistemically suboptimal) can maximize expected reward when:  
  1. \(\tilde{b}\) causes an action \(a = \pi(\tilde{b})\) with high causal efficacy.  
  2. \(a\) induces a favorable outcome not achievable under \(b\).  

