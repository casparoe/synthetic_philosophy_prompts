     Alternatively, if we consider that the agent can perform an internal action (like self-hypnosis) to change the belief, then that internal action is part of the action space. Then the agent's policy chooses the internal action (which sets the belief) and then the external action (wave or not). The internal action has a cost. This is more in line with the philosophical claim: the agent doesn't directly set the belief, but performs an action (self-hypnosis) that causes the belief. But self-hypnosis is not in the original action space.

  3. **Single-shot vs iterated.**
     - In a single-shot, the motivated belief might be rational. In iterated settings, if the agent repeatedly distorts his beliefs, he might make systematically poor decisions. However, the hitchhiker case is single-shot. The structure is load-bearing because in iterated settings, the agent might learn that distorting beliefs is costly or that the driver adapts and learns that the wave is not a reliable signal.

  ## Residue Report

  ### Point 1: Belief State as Posterior vs. False Belief
     - **Verdict:** Distortion.
     - **Reasoning:** In the standard POMDP, the belief state is the posterior and cannot be false. To model the hitchhiker, we had to extend the framework to allow for strategically chosen belief states that deviate from the posterior. This extension is not part of the standard formalism and represents a distortion. The cost of this extension is that it breaks the Bayesian foundation of the belief state and introduces an extra layer of optimization (choosing beliefs).

  ### Point 2: Voluntary Control of Beliefs
     - **Verdict: Distortion.**
     - **Reasoning:** The philosophical case says you cannot directly choose to believe, but you can arrange circumstances. In the POMDP extension, we allowed direct choice of belief state (or an internal action that causes the belief). This is a distortion. A meta-policy over information gathering doesn't work here because there is no further information to gather. The only available knob is to distort the belief. The gap is that the philosophical case wants the belief to be caused by actions, but in the one-shot setting, there are no such actions. So we had to introduce internal actions.

  ### Point 3: Single-shot vs. Iterated
     - **Verdict: Clean for single-shot, but not for iterated.**
     - **Reasoning:** In the single-shot case, the motivated belief can be rational in the extended model. In iterated settings, it might not be, because the agent may learn from experience or the environment may adapt. The single-shot structure is therefore essential to the paradox.

  ### Overall Residue Analysis
  The residue points to a genuine lack in the standard RL formalism: the inability to represent non-Bayesian belief states that are strategically chosen for their instrumental value. However, part of the issue is also in the philosophical claim: the hitchhiker case (as typically told) does not clearly specify why the state matters for the reward. When we tried to make the state matter, we had to introduce a penalty for being untrustworthy and waving, which is not in the original story. Without that penalty, the state is irrelevant and the false belief is not needed. This suggests that the philosophical claim might rely on an implicit penalty or a confusion between belief and action. 

  The hunch that the formalism lacks the ability to have a "wrong" belief state holds up. The belief state in a POMDP is by construction the posterior and cannot be wrong. The other part of the hunch is that philosophers treat belief as something you can do. In the extended model, we had to introduce belief as an action. This also holds up. 

  However, we also found that the philosophical case is underspecified. The state must have a causal impact on the reward to make the belief matter. In the standard telling, it doesn't. This is a confusion in the philosophical claim.

  ## Conclusion
  The standard POMDP formalism cannot faithfully represent the hitchhiker case because it requires the agent to hold a belief that is not the Bayesian posterior. An extension that allows for strategically chosen belief states (at a cost) can capture the case, but this extension is a significant departure from the standard framework. The residue includes both a gap in the formalism (inability to represent non-Bayesian beliefs) and an ambiguity in the philosophical case (why the state matters for the reward). The latter suggests that the philosophical claim might be less clear than it appears.
