prompt: |-
  I'm in a philosophy of mind seminar and we've been going over Chalmers' meta-problem of consciousness, but honsetly I keep sliding back into thinking it's just the hard problem rebranded. My professor keeps saying the meta-problem isn't why is there something it is like to process information, but something about how we should think about consciousness and what explanatory targets are available to us, and that it's a problem about the conceptual space around consciousness rather than a direct problem about the feel. But then I get stuck: if the meta-problem is asking why our cognitive systems come with this kind of awareness or self modeling, isn't that just another version of the easy/hard problem mess, or at least a very strange way to avoid the hard problem?

  Could you explain the actual conceptual issue here, like what exactly the meta-problem is supposed to do, why Chalmers thinks it's a distinct problem, and where the common objection that it's circular or question-begging comes from? I don't need a full summary of the paper, more like the knot in the middle of the debate.
