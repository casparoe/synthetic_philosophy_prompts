prompt: |-
  I am taking an introductory module in moral philosophy and have been puzzled by the idea of supererogation, understood roughly as acting well beyond what duty requires in a way that is praiseworthy when performed but not blameworthy when omitted. At a recent family dinner, two of my cousins who are both medical trainees fell into a sustained disagreement about the case of a junior doctor colleague who had volunteered for repeated extra night shifts during a winter staffing crisis at significant cost to her own health and exam preparation, and I listened throughout as a neutral bystander without taking sides.

  Their exchange went roughly as follows. First, one cousin said the colleague had acted beyond duty precisely because her rota and contract did not require the extra shifts and declining them would not have been fair to criticize, which seemed to fit the definition of praiseworthy but optional. Second, the other cousin replied that contractual minima are the wrong baseline for role-based obligations, arguing that by becoming a doctor one assumes a broader duty of care that intensifies in emergencies, so the extra shifts, while admirable and demanding, were still the fulfillment of a professional duty rather than something merely optional. Third, the first cousin answered that if duty expands to absorb every admirable response to need, then people with demanding roles such as doctors or parents could almost never act beyond duty, which would make the category empty for exactly those lives where it seems most relevant, and insisted there must be some limit grounded in personal cost beyond which duty ends. Fourth, the second cousin rejoined that the absence of blame upon omission is an unreliable test for optionality, since we often withhold blame from people who fail to do what is genuinely required when failure is understandable, as with exhaustion or competing obligations, so being excused is not the same as being permitted, and added that if the extra shifts were genuinely the morally best course it is puzzling why morality would merely allow rather than require them.

  Could you adjudicate their disagreement point by point, explaining for each of the four moves where the reasoning succeeds and where it goes wrong, identifying any crucial distinction or consideration that neither cousin noticed, and concluding with a judgment about who is more right overall and why.
reasoning: |-
  Okay, let me approach this supererogation debate systematically. The user presents a nuanced philosophical disagreement between two medical trainees about a junior doctor's voluntary extra shifts, framed within moral philosophy concepts. 

  First, I need to unpack the core tension: whether heroic actions in professional roles constitute duty or supererogation. The cousins' arguments represent classic tensions in role morality - contractualism vs virtue ethics, with undercurrents of burnout culture in medicine. 

  For the first cousin's argument about contractual minima, I should acknowledge the legal distinction but note how professional ethics often transcend contracts. The Hippocratic Oath reference might strengthen the second cousin's position. But the first cousin makes a vital point about moral limits - if duty expands infinitely, we risk normalizing self-sacrifice to harmful degrees, especially in care professions.

  When evaluating the second cousin's duty intensification claim, I recall W.D. Ross's prima facie duties. Emergency situations do heighten obligations, but the "ought implies can" principle must apply. The doctor's exam preparation represents another professional duty - this creates a conflict of duties rather than simple supererogation.

  The first cousin's "empty category" warning resonates with Susan Wolf's critiques of moral sainthood. If every good act becomes obligatory, we lose the vocabulary to praise extraordinary virtue. The personal cost threshold idea connects to Bernard Williams's moral luck arguments - but we need to distinguish absolute incapacity from difficult trade-offs.

  The second cousin's blame/excuse distinction is philosophically astute. Aristotle's Nicomachean Ethics discusses how we praise heroic virtue while excusing ordinary people who fall short. However, applying this to healthcare workers risks creating unrealistic expectations. The "morally best course" point touches on act utilitarianism, but must be tempered by rule-utilitarian concerns about systemic exploitation.

  Neither cousin considered institutional responsibilities - the hospital's duty to prevent burnout. Also missing is discussion of positive vs negative duties: the doctor's positive duty to help versus her negative duty not to self-harm. 

  Ultimately, the second cousin's position is more defensible philosophically, but requires qualification: duties have reasonable limits, and society must reciprocate professionals' sacrifices. The case illustrates why supererogation remains contested - it exists in the space between moral minimums and sainthood, but role obligations complicate this space significantly.
answer: |-
  Your cousins' debate captures profound tensions in moral philosophy, particularly regarding role-based obligations and the boundaries of duty. Let's adjudicate each point:

  **First Move (Cousin 1: Contractual minima define duty; extra shifts are supererogatory)**  
  - **Strength:** Correctly identifies that supererogation requires actions to be *optional* (not obligatory). Contractual terms provide a clear, objective baseline.  
  - **Weakness:** Overlooks that professional roles often carry *implicit moral duties* exceeding legal contracts. A doctor's duty of care isn't reducible to rota obligations—especially in emergencies (e.g., a doctor stopping at a roadside accident isn't contractually required but is professionally expected).  
  - **Key Distinction Missed:** *Formal vs. Moral Obligations.* Contractual duties are necessary but not sufficient for defining moral duty in professions with fiduciary responsibilities.

  **Second Move (Cousin 2: Duty expands in emergencies; actions are obligatory, not optional)**  
  - **Strength:** Recognizes that role-based duties *intensify under crisis* (e.g., disaster triage imposes greater burdens than routine care). The Hippocratic tradition emphasizes "patient welfare above self-interest."  
  - **Weakness:** Risks *moral overload*. If duty absorbs all extreme sacrifices, professionals face limitless obligations—threatening autonomy and well-being.  
  - **Key Distinction Missed:** *Scope of Duty vs. Limits of Sacrifice.* While duties expand in emergencies, they are bounded by *reasonable personal cost* (e.g., risking one’s life isn’t obligatory for a doctor unless in specific contexts like pandemic response).

  **Third Move (Cousin 1: Expanding duty erases supererogation for demanding roles)**  
  - **Strength:** Highlights a critical flaw: if every admirable act becomes duty, supererogation vanishes for those most likely to perform it (e.g., healthcare workers). This undermines moral psychology—praise loses meaning if actions are merely obligatory.  
  - **Weakness:** Underestimates how role-specific virtues (e.g., medical altruism) *redefine* duty’s limits. What seems supererogatory to outsiders may be role-internal duty.  
  - **Key Distinction Missed:** *Role-Relative vs. General Morality.* Supererogation may exist *outside* professional duties (e.g., a doctor donating a kidney to a patient) but not necessarily *within* core role obligations during crises.

  **Fourth Move (Cousin 2: Blame exemption ≠ optionality; best actions should be required)**  
  - **Strength:** Correctly notes that *blameworthiness* and *obligation* can diverge. We excuse failures due to incapacity (e.g., exhaustion) without negating the duty itself (e.g., a firefighter collapsing mid-rescue isn’t blamed but rescue remains obligatory).  
  - **Weakness:** Assumes "morally best" actions must be obligatory. This conflates *optimific* (maximally good) with *obligatory* acts—a utilitarian pitfall. Morality often permits self-regard (e.g., not donating all income to charity).  
  - **Key Distinction Missed:** *Excuse vs. Justification.* Omitting a duty may be *excused* (no blame due to context) but not *justified* (morally permissible). True supererogation is *justified omission*.

  **Crucial Overlooked Considerations:**  
  1. **Reciprocity & Institutional Failure:** The hospital’s duty to protect staff well-being. Sacrifices shouldn’t compensate for systemic neglect.  
  2. **Thresholds of Reasonable Cost:** Duty plausibly ends where personal cost becomes *disproportionate* (e.g., severe health harm or derailed career).  
  3. **Moral Latitude:** Some obligations specify *minima* (e.g., "work 40hr/week") but allow *maxima* (volunteering extra shifts)—the latter being supererogatory.  
  4. **Virtue vs. Duty:** The colleague’s actions may reflect *virtuous character* (commendable) without being *strictly obligatory*.

  **Overall Judgment:**  
  **Cousin 2 is more persuasive on the specific case but overextends duty; Cousin 1 better defends supererogation’s necessity.**  
  - Why Cousin 2 wins *this case*: In life-threatening emergencies, healthcare roles demand significant sacrifice *as duty* (e.g., pandemic triage). The colleague’s shifts likely fell within medicine’s "social contract"—but her *repeated* sacrifice amid exam prep neared the threshold of supererogation.  
  - Why Cousin 1 wins *the broader point*: If all extreme efforts become duty, we lose the language to praise exceptional virtue and enable exploitation. Supererogation must exist to protect agents from moral exhaustion.  

  **Synthesis:** The colleague’s *initial* extra shifts were obligatory given the crisis severity, but *repeated* sacrifices at high personal cost became supererogatory. Institutions, not individuals, should bear the burden of systemic gaps. Supererogation isn’t erased by professional roles—it begins where reasonable duty ends, and its preservation is vital for a humane morality.
