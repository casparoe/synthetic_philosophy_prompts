answer: |-
  Here’s a systematic analysis of the 1277 Condemnations through the lens of omnipotence paradoxes and their resolutions, structured around your queries. I’ll avoid historical debates and focus on the conceptual interplay.

  ### I. Mapping Standard Resolutions to Tempier’s Condemned Articles  
  *(Re: "God cannot move the heavens rectilinearly" and "God cannot make multiple worlds")*

  1. **Contradiction-Limit View (Omnipotence = all *logically possible* acts)**  
     - Both condemned articles are **false**, but **for physical, not theological, reasons**.  
       - Claiming God "cannot" create multiple worlds or rectilinear motion presupposes *physical* necessity (e.g., "a vacuum must follow," "worlds require unique centers"). But these constraints are contingent features of *this* world, not logical limits.  
       - **Verdict**: Tempier rightly condemns them because they mistake physical impossibility for divine limitation. Omnipotence is untouched; the error is Aristotelian physics masquerading as theology.  

  2. **Semantic Dissolution ("Incoherent tasks" view)**  
     - The stone paradox fails because it describes an incoherent task. **But Tempier’s articles are different**:  
       - "Moving heavens rectilinearly" or "creating multiple worlds" *are* coherently describable tasks (unlike "creating a square circle").  
       - **Verdict**: The condemnation implicitly relies on their coherence. If they *were* incoherent, condemning them as false would be redundant. Tempier assumes God *could* do these things, making the articles false *and* theologically dangerous.  

  3. **Maximal Power Across Possible Worlds**  
     - God’s omnipotence = maximal power consistent with His nature across all possible worlds.  
       - Creating multiple worlds is logically possible → God can do it.  
       - Rectilinear celestial motion (without a vacuum) may be logically possible in some worlds → God can do it.  
     - **Verdict**: Tempier’s stance aligns with this view. Condemning the articles affirms God’s power to actualize non-contradictory possibilities beyond our world’s physics.  

  4. **Voluntarism (Descartes’ "eternal truths are contingent")**  
     - If God authored logical/metaphysical necessities, He could make voids impossible *or* possible, multiple worlds necessary *or* forbidden.  
       - Tempier’s articles would be **contingently false** (God *chose* not to make them true) but **possibly true**.  
     - **Verdict**: Tempier opposes the articles but doesn’t go this far. He assumes Aristotelian physics is mutable by God, but not that logic itself is contingent. Descartes radicalizes Tempier’s intuition.  

  ---

  ### II. Structural Mismatch: Why No Stone Paradox?  
  *(The 219 articles concern physics/metaphysics, not semantic paradoxes)*  

  - **Deflationary Diagnosis Confirmed**: The stone paradox *is* a semantic artifact with little theological utility.  
    - Real debates about divine power center on **which non-contradictory possibilities God can actualize** (e.g., multiple worlds, void-free motion). Tempier’s condemnations target claims that **mistake physical limits for divine limits**—precisely where "omnipotence" does theological work.  
  - **The Paradox Literature’s Blind Spot**: It ignores the **epistemic authority struggle** underlying omnipotence disputes. Tempier’s preamble attacks the idea that philosophy can "limit" God while theology "denies" it—a clash over who defines the *scope* of possibility.  

  ---

  ### III. *Potentia Absoluta* vs. *Potentia Ordinata*: Resolving or Relocating?  
  - **What the Distinction Does**:  
    - *Potentia absoluta* (absolute power): God’s capacity to do anything non-contradictory, including suspending natural order.  
    - *Potentia ordinata* (ordained power): What God *actually wills* within the established order.  
  - **Effect on the Paradox**:  
    - **Relocates, but doesn’t resolve**. The stone paradox remains incoherent under *potentia absoluta*. But for Tempier’s articles:  
      - Claims like "God cannot make multiple worlds" confuse *potentia ordinata* (He didn’t) with *potentia absoluta* (He could).  
    - **Tempier’s Use**: He invokes *potentia absoluta* to assert that nature’s current order **imposes no constraints on divine power**. The condemned articles err by conflating the two powers.  

  ---

  ### IV. Descartes vs. Tempier: Radicalization or Violation?  
  - **Descartes as Radical Extension**:  
    - Tempier: God can override *physical* necessities (e.g., voids, multiple worlds).  
    - Descartes: God can override *logical* necessities (e.g., 2+2≠4).  
  - **Violation? Yes, in method**:  
    - Tempier condemns those who let philosophy constrain theology. Descartes **makes philosophy (rationalism) the vehicle for divine freedom**, claiming reason reveals God’s power over logic. Tempier would see this as another philosophical overreach.  
  - **Omnipotence’s "Two Jobs"**:  
    - **Tempier**: Protecting God’s freedom from *extrinsic* limits (Aristotelian physics).  
    - **Descartes**: Asserting God’s freedom from *intrinsic* limits (logic itself).  
    → Omnipotence defends divine sovereignty, but Descartes shifts the battlefield from nature to reason.  

  ---

  ### V. Verdict: Category Mistakes and Theoretical Silence  
  - **Category Mistake? Partially**.  
    - Treating condemnations *only* as test cases for "can" ignores their **pastoral/juridical purpose**: regulating teaching to prevent faith being subordinated to philosophy.  
    - **But**: The articles’ content *does* engage divine power’s scope, making them relevant to omnipotence theory.  
  - **Theoretical Impact**:  
    - **Confirmation**: Tempier’s stance aligns with the contradiction-limit and possible-worlds views.  
    - **Anomaly**: His focus on *physical* (not logical) impossibilities exposes how omnipotence debates often mask **competing metaphysics of nature**.  
    - **Unanticipated Case**: The episode centers on **epistemic authority**—can philosophers declare what God "cannot" do?—a question absent from paradox literature.  

  ---

  ### The Sharpest Question for Your Students:  
  > **"If the contradiction-limit view renders claims like 'God cannot move the heavens rectilinearly' *meaningful but false* (due to physics), not *incoherent* (like the stone paradox), does this imply that 'omnipotence' is not about power per se, but about *who gets to define the boundaries of the possible*—theologians, philosophers, or natural scientists?"**  

  This forces confrontation with the **political dimension** of omnipotence: Tempier’s condemnation was an assertion of theological authority over Aristotelian physics. The paradox literature, by contrast, treats "can" as a neutral logical operator. The disconnect suggests that "omnipotence" functions less as a technical attribute and more as a **theological safeguard against any system (philosophy, science) claiming veto power over divine freedom**.
