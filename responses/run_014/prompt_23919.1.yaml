  First, I need to understand their examples. They list several: chess engine, thermostat, nightingale, GPS, termite mound, parrot, tumor-detecting neural network, dog, and the driving home example. Their gut reactions differ—they grant comprehension to the dog and the neural network but not to the parrot or chess engine. The inconsistency bothers them, and they want a principle to unify these cases.

