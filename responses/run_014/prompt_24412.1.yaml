  - **For your article:** Adapt this into a flowchart. Readers answer branch nodes based on their beliefs; routing skips irrelevant forks (e.g., non-proof justifiers skip Nodes 2–3).
  - **For interviewing researchers:** Use the branch nodes to categorize their views. The leaves map to named positions, but focus on their answers to the forks to avoid label bias.
  - **Key insight:** Positions diverge on whether the Löbian obstacle is about proof (Nodes 1–3), practical reliability (Node 4), or logic (Node 5). The tree forces clarity on these splits.
