prompt: |-
  My friend Maya and I have been arguing about this stuff on and off for years (she's in my ethics reading group, I'm the hanger-on). Her track record on the cases we've run past her, as best I can reconstruct it:

  - Within one life: someone accepting a couple of rough years now for a much better few decades after — obviously worth it, she says. Trade-offs inside a single life are just arithmetic to her.
  - Rescue: you can pull five strangers from a burning building or one stranger — same risk, same effort, no difference except the count. She'd pull the five without hesitation.
  - One person will suffer a year of severe pain unless we trigger a one-second mild itch in a million people. She said yes, itch the million, though she made a face about it.
  - The mirror of that: a million people will each get a one-second itch unless we make one person suffer a year of severe pain. Hard no. Let them itch.
  - Utility monster (the classic one who converts any extra resources into vastly more wellbeing than anyone else would get from them): she flat out refuses to feed it.

  Her go-to line for all of this is that you can't pour seperate people's gains and losses into one pot as if it were all a single life — but she's never spelled out what actually follows from that, and I suspect more than one principle is hiding behind her verdicts.

  Next week we're bringing three new cases to her and I want to walk in with actual predictions:

  New case 1: one person will suffer 9/10 pain for a full year. We can redirect it — instead, 300 people each suffer 4/10 pain for a full year, and the first person is fine. Stipulate the totals come out the same on any scale you like.

  New case 2: one vaccine dose. Either it immunizes 1,000 people against a day of mild flu, or it immunizes one person against a year of severe pain. Equal totals again, stipulated.

  New case 3: the check case — same setup as new case 1, except it all happens inside one life: one person either has a single terrible year or 300 bad days spread across their decades. Does it being one life change her answer?

  Please structure your reply like this:

  1. "Predictions" — her call on each of the three, one line apiece.
  2. "The rules that fit" — the candidate principles her track record is consistent with, and what each one predicts on the three new cases. This is the part I care most about, so take some room here, maybe 250 words. If two rules agree on all three, say so instead of pretending they differ.
  3. "Best guess" — which rule you'd bet she's actually running, and why, around 100 words.
  4. "The tiebreaker" — one further case, not among the three, that would best split the surviving candidate rules, plus what each rule says on it, around 100 words.

  And don't just hand me rule names — I want to see where the rules come apart and which of the new cases is doing the separating. If her record genuinely underdetermines one of the predictions, just say that rather than forcing a call.
reasoning: |-
  Hmm, the user is presenting an intriguing ethical puzzle about their friend Maya's decision patterns. They've outlined five established cases where Maya made specific judgments, and now they're introducing three new scenarios to test her consistency. The core question seems to be about identifying the underlying ethical principles governing Maya's seemingly contradictory positions on aggregation.

  Looking at Maya's track record: she accepts intra-personal tradeoffs but rejects inter-personal aggregation in certain cases. The utility monster rejection is particularly telling - she won't prioritize extreme gains for one over modest losses for many. Her "can't pour into one pot" comment suggests a threshold-based or distribution-sensitive approach rather than pure utilitarianism.

  For the new cases, I need to consider how different ethical frameworks would play out. Prioritarianism would focus on the worst-off individuals, while contractualism emphasizes justification to affected parties. The "separateness of persons" concept from Rawls seems relevant too. Each framework yields different predictions for the three new scenarios.

  Notably, the "one life" case (new case 3) should be straightforward based on her initial position - she'll clearly accept the distributed suffering. The vaccine case (new case 2) might reveal whether she distinguishes between preventing suffering and providing comfort. The pain redirection case (new case 1) will test her tolerance for dispersing concentrated suffering.

  The tiebreaker case needs to create tension between competing principles - perhaps a scenario where we can either prevent one person's catastrophic suffering or many people's moderate suffering, with equal total utility. This would force a choice between prioritarian and contractualist approaches.
answer: |-
  Here's the breakdown based on Maya's established pattern:

  **1. Predictions**
  *   **New Case 1 (Redirect 1yr 9/10 pain to 300yr@4/10):** No, do NOT redirect.
  *   **New Case 2 (Vaccine: 1,000 mild flu days vs 1 severe pain year):** Save the one from severe pain year.
  *   **New Case 3 (One Life: 1 terrible year vs 300 bad days):** Yes, spread the bad days.

  **2. The Rules That Fit**

  Maya's record strongly rejects *pure, unconstrained aggregation* (classical utilitarianism). The key conflict is between rules that allow *some* aggregation but impose limits, specifically rejecting *dispersed minor harms aggregating to outweigh concentrated severe harms* and *utility monsters*. These rules are consistent with her past verdicts and predict the above:

  1.  **Prioritarianism (with Diminishing Marginal Utility & Threshold):** Focuses on benefiting the worst-off. Gains/losses matter more the worse off someone is. Severe suffering creates a very high priority claim. *Predictions:*
      *   Case 1: No redirect. The one person facing 9/10 pain is catastrophically worse off than the 300 facing 4/10. Preventing their severe suffering takes absolute priority over preventing the larger *aggregate* of moderate suffering.
      *   Case 2: Save from severe pain year. Preventing a year of severe pain for the one worst-off individual vastly outweighs preventing dispersed mild discomfort (flu days) for 1000 better-off individuals.
      *   Case 3: Spread the bad days. Within one life, there's no "worst-off person" conflict. The aggregated moderate pain over time is less bad overall for that single individual than the concentrated severe year (due to diminishing marginal utility of suffering/disutility).

  2.  **Contractualism (Scanlon-style):** An act is wrong if disallowed by principles no one could reasonably reject. Concentrated severe harm is typically harder to justify imposing/reasonably reject *not* preventing than dispersed minor harms. *Predictions:*
      *   Case 1: No redirect. Redirecting creates a severe, life-wrecking harm for one person. A principle allowing this *for the sake of aggregating moderate harms for others* could reasonably be rejected by the one made catastrophically worse off ("Why must *I* suffer immensely just to spare each of *them* a moderate burden?"). Preventing the original severe harm cannot be reasonably rejected.
      *   Case 2: Save from severe pain year. A principle allowing one person to suffer a year of severe pain to prevent 1000 mild flu days could reasonably be rejected by that one person ("My year of agony is being sacrificed for trivial gains to each of many others"). A principle requiring preventing the severe pain cannot be reasonably rejected by the flu sufferers ("We only lose a mild day, while they lose a year").
      *   Case 3: Spread the bad days. Within one life, a single person assessing their own life wouldn't reasonably reject spreading out the suffering to avoid a concentrated catastrophe. There's no "other person" whose burden makes the principle rejectable.

  *Both Prioritarianism and Contractualism agree on all predictions for the three new cases and are consistent with Maya's entire track record.* They both explain her rejection of pure aggregation, utility monsters, and the asymmetry in the "itch vs pain" cases, while accepting intra-personal trade-offs and straightforward rescue cases.

  **3. Best Guess**

  I'd bet Maya is running **Contractualism**. Her explicit statement "you can't pour separate people's gains and losses into one pot as if it were all a single life" directly echoes the core Contractualist objection to utilitarianism – the "separateness of persons." Her focus seems to be on the *justifiability to each individual affected* ("Could the person bearing the worst burden reasonably reject this?"), rather than just the abstract weight of benefits/burdens regardless of distribution (Prioritarianism). The "face she made" about itching the million, while doing it, hints at the tension Contractualism acknowledges in imposing even minor harms on many to prevent severe harm to one, but finding it ultimately justifiable *in that specific asymmetric case*.

  **4. The Tiebreaker**

  *   **Case:** A device can either: a) Prevent *one* stranger from suffering 10 years of moderate (4/10) chronic pain, *or* b) Prevent *ten* strangers from each suffering *one* year of excruciating (9/10) pain (totals equal: 40 vs 40 pain-years?).
  *   **Rule Predictions:**
      *   **Prioritarianism:** Save the *ten* from excruciating pain. Preventing 10 instances of *severe* suffering (each person at 9/10 is catastrophically worse off during their year) takes absolute priority over preventing one instance of *moderate* suffering, even though the moderate suffering lasts longer. The aggregated severity for the ten outweighs the concentrated duration for the one.
      *   **Contractualism:** Save the *one* from 10 years of moderate pain. A principle allowing one person to suffer 10 years of significant burden to prevent ten others from suffering one year of excruciating pain each *could reasonably be rejected by that one person*: "Why must *I* bear a decade of significant hardship just so *each of those ten* avoids one terrible year?". Conversely, the ten facing one terrible year might find it harder to reject a principle focused on preventing the longer-term moderate suffering of one ("We each suffer intensely, but only for one year, while they suffer for ten").

  This case forces a choice between prioritizing the *peak severity* (Prioritarianism) vs. the *individual's total burden and justifiability* (Contractualism) when concentrated moderate suffering opposes dispersed severe suffering.
