prompt: |-
  I'm TAing for an intro cognitive science section (about 20 students, one 50-minute session) and I keep trying to get across the difference between access consciousness and phenomenal consciousness, plus the global workspace idea, and every time I just end up reading Block and Baars at the room and watching their eyes glaze over. I want an in-class activity that makes them actually feel the dissociation instead of just hearing about it — specifically the blindsight-style case where someone can point at a stimulus they genuinely report not seeing, so information is driving their body without any conscious experience of it. Can you design a runnable game for this: the setup, the materials (keep them cheap, Ive got a projector and some index cards and no budget), and the exact rules and timing for a subliminal flash condition where nobody is supposed to consciously see the stimulus but the group's guesses still come out above chance.

  Then I want a second broadcast condition where the same stimulus is presented in a way the whole room can actually report on, so they can feel the contrast the the view is supposed to capture, between content that stays locked in one private processing stream and content that gets written out where everything can grab it at once. I need a debrief that maps what actually happened in the room onto the access-vs-phenomenal distinction and onto the global workspace, an honest list of what will predictably go wrong the first time I run it (I already suspect some students will claim they sort of saw a blur and that the above-chance effect might be too weak to show in a single trial), and a frank note on which part of the view the activity simply cannot reproduce and I will have to supply myself. Start with the activity itself, no preface, no restating what I asked, and no great question.
reasoning: |-
  We are going to design an in-class activity that simulates a blindsight-like phenomenon and then contrasts it with a global broadcast condition. The goal is to have students experience the dissociation between access consciousness (information that is available for report and reasoning) and phenomenal consciousness (the subjective experience) without complex equipment.

  Activity: "Blindsight Guessing Game"

  Materials:
  - Projector (for displaying instructions and collecting responses)
  - Index cards (one per student, for writing guesses)
  - A computer to run the projector and a presentation (e.g., PowerPoint)
  - A stopwatch or timer (can be on phone or computer)
  - A set of pre-prepared images (simple shapes: circle, square, triangle, star) for the subliminal condition and the broadcast condition.

  Setup:
  1. Before class, create two sets of slides:
     a. Subliminal condition: Each slide has a fixation cross in the center for 2 seconds, followed by a very brief flash (e.g., 10-20 milliseconds) of a shape (circle, square, triangle, star) at a random location on the screen. Then a mask (a random pattern or overlapping shapes) for 500 ms to disrupt afterimages. Then a blank screen until the next trial. Note: The flash must be too fast for conscious perception. You may need to adjust the timing based on the projector's refresh rate (aim for 1-2 frames at 60Hz, so 16-33ms). Test in the room beforehand to ensure it's subliminal.
     b. Broadcast condition: Same sequence but with the shape presented for 500 ms (clearly visible) and without the mask.

  Rules and Timing:

  Part 1: Subliminal Condition (Blindsight Simulation)
  1. Introduce the activity: "We are going to play a guessing game. I will flash a very brief image on the screen. It will be so fast that you probably won't see it. But I want you to try to guess what shape it was. Don't overthink it; just go with your gut feeling. Write your guess on the index card and hold it up when I ask."
  2. Run 10 trials of subliminal presentation. For each trial:
     a. Display the fixation cross (2 seconds).
     b. Flash the shape (10-20 ms).
     c. Display the mask (500 ms).
     d. Then a blank screen. Ask students to write their guess (circle, square, triangle, star) on the index card and hold it up. They must guess even if they think they saw nothing.
  3. Collect the data: After each trial, quickly note down the correct answer and then tally the number of correct guesses for that trial. Alternatively, you can have students hold up their cards and you can quickly count. Since there are 20 students, you can have 20 guesses per trial. Do 10 trials so that you have 200 guesses in total.

  Part 2: Broadcast Condition
  1. Now explain: "We are going to do the same thing again, but this time the image will be shown for a longer time so you can clearly see it."
  2. Run the same 10 trials (using the same sequence of shapes) but with the shape presented for 500 ms and without the mask. Again, have students write their guess on the index card and hold it up. Note: In this condition, they should be able to see the shape clearly.

  Debrief:
  - After the activity, show the results. For the subliminal condition, you should have a total number of correct guesses across all trials and students. With 4 choices, chance is 25%. If the group's accuracy is above 25%, that indicates that some information was processed without conscious awareness (simulating blindsight).
  - For the broadcast condition, accuracy should be near 100%.

  Mapping to Concepts:
  1. Subliminal condition: The stimulus was processed (as evidenced by above-chance accuracy) but without conscious experience (phenomenal consciousness). Most students will report they didn't see anything or just a flash. This is like blindsight: information is driving behavior (guessing) without being subjectively experienced. The information was not broadcast to the global workspace (so not in access consciousness) but was still available in a specialized module (visual processing) that could guide the guess.
  2. Broadcast condition: The stimulus was consciously seen (phenomenal consciousness) and also available for report and reasoning (access consciousness). This is like the global workspace: the information was broadcast and available to multiple systems (verbal report, memory, etc.).

  What will go wrong:
  1. Some students might claim they saw a blur or had a feeling about the shape in the subliminal condition. Acknowledge that this is a common report in real blindsight patients too (they often say they are just guessing). Emphasize that the key is the dissociation: they can perform above chance without feeling they saw it.
  2. The above-chance effect might be weak. With only 10 trials per student, individual accuracy might not be impressive, but the group aggregate (200 guesses) should show a signal. If it doesn't, discuss why: maybe the flash was too fast? Or maybe the mask wasn't effective? But it's a simulation and we are looking for a trend.
  3. Technical issues: The projector might not handle the brief flash correctly. Test beforehand to ensure the flash is subliminal but still processed (you might need to adjust the duration). Also, room lighting might affect visibility.

  What the activity cannot reproduce:
  1. The activity is a simulation of blindsight in healthy individuals. In real blindsight, there is a lesion in the visual cortex. Here, we are just using a brief presentation. We are not reproducing the neurological condition but the functional dissociation.
  2. The global workspace analogy: The broadcast condition is a simplification. In the brain, broadcasting involves widespread neural availability. Here, we are just making the stimulus visible to everyone at the same time, which is a metaphor.

  Alternative if projector timing is unreliable:
  If you cannot set up the subliminal flash with the projector, use a physical alternative: 
  - For subliminal: Use a deck of cards with the shapes drawn on them. Have a student volunteer as the "presenter". The presenter holds up a card for a split second (as fast as they can) and then immediately covers it with a mask card (a card with a complex pattern). The students then guess. This might be less controlled but can work.

  Timing for the entire activity:
  - Introduction: 5 minutes
  - Subliminal condition (10 trials): 10-15 minutes (each trial: 2.5 sec presentation + 30 sec for writing and collecting guesses? -> 30 sec per trial might be too long; aim for 10-15 seconds per trial: 2.5 sec presentation, then 10 sec for writing and holding up cards. So 10 trials: 2.5*10 = 25 sec for presentation, plus 100 sec for responses -> about 2 minutes for presentation and 1.5 minutes for responses? Actually, let's break it down: 
     - Fixation: 2 sec
     - Flash: 0.02 sec
     - Mask: 0.5 sec
     -> Total presentation per trial: ~2.52 seconds. Then you say "write your guess" and they write and hold up. This might take 10-15 seconds per trial. So 10 trials: 150 seconds = 2.5 minutes for the response part, plus 25 seconds for the presentations -> about 3 minutes for the subliminal part. But including transitions, let's say 5 minutes.

  - Broadcast condition: same structure but without mask and longer presentation (0.5 sec). So each trial: 2 sec fixation + 0.5 sec shape + 0.5 sec blank? Then response. So 3 seconds per trial presentation, and then 10 seconds for responses per trial? So 10 trials: 30 sec presentation + 100 sec responses -> 2 minutes. But again, with transitions, 5 minutes.

  Total activity time: 5 (intro) + 5 (subliminal) + 5 (broadcast) + 10 (debrief) = 25 minutes. This leaves time for discussion.

  Exact Steps:

  Subliminal Condition:
  1. Tell students: "We are starting with the first part. Remember, the image will be very fast. Just guess if you have to."
  2. Run the 10 trials. After each trial, say: "Write down your guess: circle, square, triangle, or star. Then hold up your card." 
  3. After they hold up, quickly note the correct answer and then count the number of correct guesses for that trial. Then move to the next trial.

  Broadcast Condition:
  1. Tell students: "Now, the images will be shown for longer. You should be able to see them clearly."
  2. Run the 10 trials (same order of shapes). After each trial, have them write and hold up their guesses. Note: They should get nearly all correct.

  Debrief:
  1. Present the results: 
     - Subliminal: Total correct / total guesses (200). Compare to 25% (chance). 
     - Broadcast: Total correct (should be near 200).
  2. Explain:
     - In the subliminal condition, the information about the shape was processed by your visual system (enough to guide your guess above chance) but it did not become conscious. This is like phenomenal consciousness without access? Actually, in this case, there might be no phenomenal consciousness either. The point is: the information was not accessible for report (you had to guess and didn't feel confident) but it was there. In Block's terms, this is a case of access without phenomenal? Not exactly. We have to be careful.

  Actually, in the subliminal condition, we are simulating a situation where there is no (or minimal) phenomenal consciousness and no access consciousness (because they can't report it confidently) but the information is still processed and can influence behavior. This is similar to blindsight: the patient can point but does not have the experience. So we have a dissociation: the information is processed (and can be accessed by the motor system for pointing/guessing) but not by the systems that support report and not accompanied by experience.

  In the broadcast condition, we have both phenomenal and access.

  So the debrief should highlight:
  - Subliminal: Information is processed (so it exists in the brain) but not consciously experienced (no phenomenal consciousness) and not available for global report (no access consciousness). However, it can still guide behavior (guessing). This is like the blindsight patient who can point but not see.
  - Broadcast: Both phenomenal and access consciousness are present.

  Note: The activity might not perfectly capture the absence of phenomenal consciousness because some students might have a vague experience. But that's true in blindsight too! Patients sometimes report a feeling. The key is the dissociation between the ability to guess and the lack of clear experience.

  Finally, the activity cannot reproduce the neural basis of global workspace. You will have to explain that in the brain, the global workspace theory posits that when information is broadcast to many areas (like in the broadcast condition), it becomes conscious and accessible. In the subliminal condition, the information was only in a local module (visual area) and wasn't broadcast.

  Good luck!
answer: |-
  ### Subliminal Flash Condition (Blindsight Simulation)

  **Materials:**
  - Projector
  - 20 index cards (one per student)
  - Stopwatch/timer (phone or computer)
  - Pre-made slides (PowerPoint/Google Slides):
    - Slide 1: Fixation cross (+) for 2 seconds
    - Slide 2: **Stimulus slide**: Solid red circle (3cm diameter) in a random quadrant (top-left, top-right, bottom-left, bottom-right), flashed for **16 milliseconds** (1 frame at 60Hz refresh rate). *Background: Solid black.*
    - Slide 3: **Mask slide**: Overlapping multicolored shapes (squares, circles, triangles) covering the entire screen for 500ms.
    - Slide 4: Blank slide (for response)
  - **Critical setup**: Test projector timing in advance. Use "on click" transitions to control duration. Set slide 2 to advance automatically after 0.016s. *Darken the room*.

  **Rules & Timing (10 mins total):**  
  1. **Instructions (1 min)**:  
     - "Write 'TOP-L', 'TOP-R', 'BOT-L', or 'BOT-R' on your card based on where you *think* a hidden shape *might* be. If you saw nothing, force a guess. No talking."  
     - Emphasize: "This is about intuition—don’t overthink."  

  2. **Trial (Repeat 5x, 6 mins total)**:  
     - Fixation cross: 2s (students focus on center).  
     - Flash stimulus: 16ms (too fast for conscious perception).  
     - Mask: 500ms (disrupts visual persistence).  
     - Blank screen: "Write your guess *now*." (Give 5s).  
     - Collect cards, shuffle, and note correct quadrant.  

  3. **Group Tally (3 mins)**:  
     - After all trials, calculate group accuracy.  
     - *Expected result*: ~30-40% correct (above 25% chance).  

  ---

  ### Broadcast Condition (Global Workspace Simulation)  

  **Materials:**  
  Same slides, but modify:  
  - **Stimulus slide**: Red circle displayed for **500ms** (clearly visible).  
  - **No mask slide**.  

  **Rules & Timing (5 mins total):**  
  1. **Instructions (30s)**:  
     - "This time, you’ll see the shape clearly. Report its location accurately."  

  2. **Trial (Repeat 1x, 3 mins)**:  
     - Fixation cross: 2s.  
     - Stimulus: 500ms (conscious perception).  
     - Blank screen: "Write your guess." (5s).  
     - Collect cards.  

  3. **Group Tally (1.5 mins)**:  
     - Calculate accuracy (expect ~100% correct).  

  ---

  ### Debrief & Concept Mapping (10 mins)  
  - **Subliminal Results**:  
    - "You guessed above chance (~X%) but reported no experience. This is *access without phenomenology*:  
      - **Phenomenal consciousness**: Absent (no 'red circle' experience).  
      - **Access consciousness**: Limited (info guided guesses but wasn’t 'globally available').  
      - **Global workspace**: The stimulus was processed locally (visual system) but *not broadcast*—so it couldn’t be used for reasoning, speech, or memory."  

  - **Broadcast Results**:  
    - "You saw the circle and reported accurately. This is *full access + phenomenology*:  
      - The stimulus entered the **global workspace**—broadcast to memory, language, and attention systems. Everything 'grabbed' it at once."  

  - **Contrast**:  
    - "Blindsight patients 'guess' like your subliminal condition: their visual system processes data (access for action), but it’s not conscious (no phenomenology). Broadcasting makes the difference."  

  ---

  ### Predictable Problems & Mitigation  
  1. **"I saw a blur!"** in subliminal trials:  
     - **Response**: "Acknowledge the partial awareness. But stress: Could you describe the shape/color? No? Then it’s not *phenomenal* consciousness—it’s a vague signal not integrated into the workspace."  
     - *Mitigation*: Use a 16ms flash (not 30ms) and a dark room to minimize afterimages.  

  2. **Weak above-chance effect**:  
     - **Response**: "One trial is noisy—we use group data to see the signal. In real blindsight, patients need dozens of trials too."  
     - *Mitigation*: Run 5 trials. With 20 students, 100 guesses amplify the effect.  

  3. **Projector timing issues**:  
     - **Test first**: Verify 16ms flash with a high-speed camera (phone slo-mo) or a student volunteer. If inconsistent, use a physical alternative:  
       - *Plan B*: Hold up an index card with a red circle in one quadrant, immediately cover it with a "mask card" (chaotic scribbles). Flash for <50ms.  

  ---

  ### What the Activity Can’t Reproduce  
  - **Phenomenal experience itself**: Students must *infer* the absence of "red circle" qualia from their inability to describe it. Explicitly say:  
    > "You’ve felt the *dissociation* (information without experience), but the 'what it’s like' gap requires introspection. Blindsight patients *truly* lack visual qualia—we simulate it via forced guessing."  

  - **Neurological basis**: Highlight that blindsight requires V1 damage; here, timing replaces lesions.  

  **Total Time**: 25 mins (10 subliminal + 5 broadcast + 10 debrief).  
  **Key**: Use rapid, no-nonsense transitions. Project instructions to avoid verbal overload.
