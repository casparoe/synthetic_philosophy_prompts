  ### Condorcet Jury Theorem in Replica Vocabulary

  **Competence Assumption (Each node is more likely correct than wrong)**  
  *Theorem*: Each voter has probability \( p > 0.5 \) of being correct.  
  *Replica analog*: Each replica has independent failure probability \( f < 0.5 \) (i.e., availability \( q = 1 - f > 0.5 \)).  
  - **Lands cleanly**: Yes. We assume replicas have high availability (\( q > 0.5 \)). Non-faulty replicas are deterministic and always correct; faults (crashes/Byzantine) cause errors.  

  **Independence Assumption (Votes are independent)**  
  *Theorem*: Voters’ decisions are statistically independent.  
  *Replica analog*: Replica failures are independent (no shared failure domains).  
  - **Lands cleanly**: Yes. We explicitly engineer independent failure domains (racks, AZs) to avoid correlated failures.  
  - **Bend**: Replicas execute identical deterministic state machines, so non-faulty replicas always agree—unlike jurors who might independently arrive at the same truth. This doesn’t break the math but makes "correct" outcomes perfectly correlated for non-faulty nodes.  

  **Majority Rule (Group majority is more reliable than any individual)**  
  *Theorem*: Majority vote amplifies reliability.  
  *Replica analog*: Quorums (e.g., majority of \( 3 \) or \( 5 \) replicas) ensure correctness with fewer vulnerabilities than a single replica.  
  - **Lands cleanly**: Yes. A majority quorum with \( n = 2f+1 \) tolerates \( f \) failures. If \( q > 0.5 \), \( P(\text{majority non-faulty}) > q \) and increases with \( n \).  

  **Convergence (Certainty as group size grows)**  
  *Theorem*: As \( n \to \infty \), majority correctness \( \to 1 \).  
  *Replica analog*: As replica count \( n \) increases, \( P(\text{majority non-faulty}) \to 1 \) (by law of large numbers, assuming \( q > 0.5 \) and independence).  
  - **Lands cleanly**: Yes. Used to justify why larger quorums (e.g., \( n=5 \)) reduce blast radius.  

  ---

  ### Residue Report: Where the Analogy Fails

  1. **Competence assumption bend**:  
     - *Where it bends*: Jurors can be "competent but wrong" (e.g., \( p = 0.6 \)). Replicas are either **always correct** (non-faulty) or **always wrong** (faulty).  
     - *Why it works anyway*: The math reduces to Bernoulli trials with success rate \( q \), so the theorem holds if \( q > 0.5 \).  

  2. **No counterpart: Byzantine faults break competence/independence**  
     - *Gap*: Byzantine nodes can maliciously collude, violating independence. The jury theorem assumes voters err *randomly*, but Byzantine faults are adversarial.  
     - *Why your vocab is sufficient*: You already handle this with \( n \geq 3f+1 \) for Byzantine resilience—a concept **outside** the theorem’s scope. The theorem lacks an analog for coordinated attacks.  

  3. **No counterpart: Strategic voting objection**  
     - *Objection*: "If jurors believe the theorem, they vote strategically, breaking independence."  
     - *Replica analog*: **None**. Replicas lack agency; they execute code. Strategic voting assumes rational actors—irrelevant for deterministic state machines.  

  4. **Deliberation killing independence → Correlated failures**  
     - *Objection*: "Jurors who deliberate become correlated."  
     - *Replica analog*: **Perfect match**. If replicas share failure domains (e.g., same power supply), failures correlate. This violates independence, reducing system reliability—exactly like deliberation eroding jury gains.  

  ---

  ### Why the Pitch Almost Works (But Doesn’t Fully Hold)  
  - **Clean lands**: Competence (\( q > 0.5 \)), independence (failure domains), majority quorums, and convergence all map directly.  
  - **Critical break**: The theorem **assumes failures are non-adversarial**. It cannot model Byzantine behavior, where coordinated faults intentionally violate independence. Your \( n \geq 3f+1 \) rule addresses this, but it’s outside the theorem’s math.  
  - **Theorem’s limits**: It claims less than it sounds like—it ignores adversarial settings and assumes purely random errors. Real-world systems must handle correlated and Byzantine faults, which require stronger mechanisms (quorum overlaps, attestations).  

  ---

  ### Verdict: theorem-is-weaker-than-it-sounds — Byzantine faults break its non-adversarial independence assumption.
