  - Entailment: Whatever is entailed by a positive property is positive.
  - Non-triviality: For well-behaved properties, a property and its complement cannot both be positive (to avoid trivialization).
  - Conjunction: The conjunction of two positive properties is positive.
  - Necessity: If a property is positive, it is necessarily positive.

  Then, define "God-like" as possessing every positive property. Two additional stipulations:
