prompt: |-
  I have been asked to set out my position on the problem of cluelessness for a workshop, and before I do so I would like an audit of whether my package hangs together. Here is what I hold.

  1. Act consequentialism with an objective criterion: whether an act is right is settled by its actual consequences, all of them, however remote in time or space. Temporal and causal distance makes no axiological difference whatsoever.
  2. There is only one ought. I reject the view that there is an objective ought alongside a separate evidence-relative one; talk of what an agent ought to do given her evidence is either a loose way of stating the objective claim or a confusion.
  3. The cluelessness problem, in Lenman's sense, is correct and deep: for virtually every real-world act the remote consequences are not merely unknown but unknowable in principle, and the figures we assign to expected far-future effects bear no informative relation to the truth.
  4. It follows that cluelessness is a genuine objection to act consequentialism, one its proponents must answer — not a mere implementation difficulty.
  5. I reject the standard repairs: rule consequentialism, satisficing versions of the theory, and proposals to bound the morally relevant consequences to a near-term horizon, on the ground that an arbitrary truncation of the causal chain cannot be principled.
  6. Nevertheless I hold that once the evidence runs out — which on (3) is nearly always — the agent should fall back on the ordinary rules of commonsense morality as her decision procedure, and that doing so is no failure of consequentialist commitment.
  7. On blame: unavoidable ignorance excuses. Nobody is blameworthy for bad consequences she could not reasonably have foreseen. But a driver who swerves to avoid a dog and thereby kills a pedestrian who would otherwise have gone on to start a pandemic has done the wrong thing, even though she is not blameworthy for it.
  8. In practice, when choosing between a well-evidenced global health donation and a speculative intervention aimed at the far future, I insist the decision be made by expected value, and that someone who knowingly takes the lower-expected-value option is criticisable — notwithstanding that on (3) the far-future term in that calculation is uninformative.

  Please audit the set rather than survey the literature at me. Tell me which commitments genuinely pull against one another and which only appear to, and rank the genuine tensions by severity instead of listing them all as equally bad. For each, say precisely what would have to be given up or weakened, and what the resulting view looks like once it is. Then take a definite position: tell me which single revision you would make if you had to defend this package at the workshop, and why. I want your recommendation and your reasons, not a menu of options left for me to choose between. Please write in British English.
reasoning: |-
  Okay, let me approach this systematically. The user presents a tightly argued consequentialist position grappling with cluelessness and wants a coherence audit. Key elements include: strict objective consequentialism (1), rejection of multiple oughts (2), acceptance of deep cluelessness (3-4), dismissal of standard workarounds (5), pragmatic fallback to commonsense morality (6), and a nuanced blame stance (7) that seems at odds with the expected value commitment (8).

  Hmm, the core tension screams at me from points 3 and 8. When the user insists in (3) that far-future EV calculations are uninformative but then demands in (8) that we must follow expected value anyway - that feels like trying to have one's epistemic cake while normatively eating it too. The driver example (7) actually exposes this: if cluelessness is as deep as claimed, how can we ever calculate expected value meaningfully? 

  The blame framework seems surprisingly resilient though. Distinguishing objective wrongness from blameworthiness (7) elegantly handles cases like the pandemic-causing driver - she did wrong objectively but isn't culpable. This could survive intact if we tweak the EV stance. 

  For the workshop defense, I'd recommend sacrificing the universal EV mandate (8). Keep it for evidence-rich domains like global health donations, but admit that when cluelessness bites, commonsense rules aren't just pragmatic fallbacks - they become our best shot at approximating consequentialist goals. This turns (6) from a concession into a principled move. The resulting position says: "Where evidence exists, maximize EV; where darkness reigns, default to norms that historically produced good outcomes." 

  The user's rejection of bounded consequentialism (5) remains untouched here - we're not truncating consequences axiology, just acknowledging epistemic limits. And crucially, this doesn't resurrect evidence-relative oughts (2); we're still talking about what best serves the one true objective ought under crippling uncertainty. 

  If pressed during Q&A, I'd have the user say: "My calculation's 'expected value' isn't some subjective probability weighting - it's the objective EV given our ignorance. And when that ignorance is total, following commonsense morality simply is the option with highest objective expected value." That's cheeky but coherent.
answer: |-
  Your package is rigorously argued but contains one profound tension that requires revision to achieve full coherence. Below is an audit of tensions, ranked by severity, followed by a targeted recommendation for revision. I write as a sympathetic critic aiming to strengthen your position.

  ### Genuine Tensions (Ranked)
  1.  **Severe: (3) + (8) are incompatible**  
      -   **Conflict:** (3) states that expected-value (EV) calculations for far-future consequences are *uninformative* and bear *no relation to truth*. (8) insists agents must *maximise* this very EV and are *blameworthy* for not doing so. This is contradictory. If the EV is uninformative, maximising it cannot be a reliable (or even rational) strategy for fulfilling the objective ought in (1). Criticising an agent for not maximising an uninformative EV is incoherent – it holds them to a standard demonstrably disconnected from actual consequences.
      -   **Revision Required:** Abandon the universal prescriptive force of EV maximisation in (8). Retain it *only* where evidence is sufficiently robust (e.g., near-term global health). Where cluelessness bites (per 3), explicitly deny that maximising the *calculated* EV has any necessary connection to fulfilling the objective ought. The commonsense rules in (6) become the fallback *precisely because* EV is uninformative, not alongside it.
      -   **Resulting View:** Consequentialism demands we use the *best available decision procedure* relative to our epistemic state. Where evidence supports it, EV maximisation *is* that procedure. Where evidence fails utterly (cluelessness), commonsense morality *is* the best available procedure (as its rules are social heuristics shaped by consequences). Blame applies only for failing the *applicable* decision procedure (e.g., ignoring good evidence for EV *or* violating commonsense rules without justification). The *objective* rightness/wrongness (1,7) remains determined by actual consequences.

  2.  **Moderate: (6) & (7) need stronger grounding under (1) & (2)**  
      -   **Conflict:** (6) recommends commonsense rules as a fallback procedure, and (7) excuses ignorance. But (1) and (2) insist there is *only one* ought – the objective one. Why *should* an agent follow commonsense rules (6) when clueless, if there's only the objective ought, and following commonsense rules *might* (unknowably) lead to disaster? The normative force of (6) feels external to the strict objective consequentialism of (1-2).
      -   **Resolution (Possible without abandoning core):** Ground (6) and (7) *within* objective consequentialism via *epistemic constraints on agency*. Argue that *given human cognitive limitations* (epistemically inaccessible consequences), the *only rational way* for an agent *to aim at* fulfilling the objective ought is to follow the best available decision procedure (EV or commonsense rules). Blame (7) is then tied to failing this *aiming* under the circumstances. This makes (6) a *consequentialist imperative* under cluelessness, not an external add-on.
      -   **Resulting View:** Objective consequentialism (1,2) *requires* agents to use context-appropriate decision procedures (EV where possible, commonsense rules under cluelessness) *because* this is the only feasible way to *pursue* the objective good. Blame attaches to failures of this pursuit.

  3.  **Minor: (7) & (1) - The "Wrong but Blameless" Driver**  
      -   **Apparent Conflict:** (1) says rightness is *solely* determined by actual consequences. The driver's act objectively caused a pandemic, so it's wrong. (7) says she's blameless. This seems consistent on its face.
      -   **Potential Tension (Conceptual):** If the *only* thing that matters morally is actual consequences (1), and blame is a moral concept, how can someone who *objectively did wrong* (by causing bad consequences) be *morally blameless*? This pushes towards separating moral wrongness from blameworthiness very sharply, as you do. It's logically consistent but might feel unstable to some – why *isn't* causing objectively bad consequences (even unforeseeably) blameworthy *if consequences are all that matter*? Your answer (unavoidable ignorance excuses) is correct, but the driver case starkly highlights the counter-intuitive implication of pure objective consequentialism.
      -   **Resolution:** Maintain the distinction. Strengthen by arguing blameworthiness requires *fault* (which includes avoidable ignorance or recklessness), not just bad outcomes. The driver lacked fault. This is consistent with (1) – consequences determine *what was right/wrong*, but *blame* requires an additional agential element (fault).

  ### The Essential Revision: Addressing the Severe Tension
  **Recommendation:** **Revise (8) significantly.** Abandon the claim that agents are *always* required to maximise calculated EV and are blameworthy for not doing so *when cluelessness renders that EV uninformative*.

  *   **Revised (8):** "In practice, when choosing between interventions, agents must use the *best available decision procedure*. Where reasonably robust evidence exists (e.g., near-term global health impacts), this *is* expected value maximisation. *However, where consequences are profoundly clueless (3), the calculated expected value is uninformative and maximising it offers no reliable guidance towards the objective good.* In these cases, falling back on the rules of commonsense morality (6) *constitutes* the best available decision procedure. An agent is criticisable for failing to use the *appropriate* decision procedure for the context: for ignoring good evidence where it exists *or* for arbitrarily abandoning commonsense rules without justification under cluelessness."

  **Why this Revision is Necessary & Beneficial:**

  1.  **Coherence:** It resolves the core contradiction between your deep epistemic pessimism about long-term EV (3) and the normative demand to maximise it anyway (8). You cannot coherently call something uninformative *and* demand its maximisation as the criterion for blame.
  2.  **Strengthens (3) & (6):** It gives real teeth to cluelessness (3). If cluelessness genuinely nullifies the value of EV calculations, then prescribing EV maximisation *in those contexts* is irrational. Revising (8) makes (6) the *positive consequentialist response* to cluelessness, not just a fallback. Commonsense rules *become* the rational way to pursue the objective good when EV is useless.
  3.  **Preserves Core:** It fully retains objective consequentialism (1), the single ought (2), the depth of cluelessness (3,4), rejection of alternatives (5), and the blame framework (7). It grounds (6) and the revised (8) within the objective framework via the *epistemic rationality of the agent* pursuing the objective good.
  4.  **Practical Defensibility:** At the workshop, this position is stronger. It avoids the charge of prescribing a ritual (maximising uninformative numbers). You can say: "Consequentialism demands we use the best tools we have. Sometimes that's EV. When it isn't, we use the next best tool: the accumulated wisdom embedded in commonsense morality. Failing to use the *right tool for the epistemic context* is what warrants criticism."
  5.  **Addresses Driver Case Coherently:** The driver used a commonsense rule (avoid immediate harm to sentient beings). Under cluelessness (she couldn't foresee the pandemic), this *was* the best available decision procedure. She used the right tool. Therefore, while her act was objectively wrong (1), she is not blameworthy (7) because she used the appropriate procedure (revised 8/6) given her profound ignorance.

  **Resulting Package Summary:** Act consequentialism is true objectively (1). There is only one ought (2). Cluelessness is deep and fatal to long-term EV (3), posing a serious challenge (4). Standard fixes are illegitimate (5). Agents must use the *best available decision procedure*: robust EV where possible, commonsense morality under cluelessness (6, revised 8). Actual consequences determine objective rightness/wrongness; blamelessness requires unavoidable ignorance (7). Blame/criticism attaches to failures of agency: not using the *appropriate* decision procedure for the epistemic context (revised 8).

  This position is coherent, retains the power of your core insights (especially the depth of cluelessness), and offers a principled consequentialist path through the epistemic minefield. Defend this revised (8) at the workshop – it’s the keystone holding your structure together under pressure.
