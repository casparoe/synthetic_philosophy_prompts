  Alpha claims: **"CPR-7 is a target-locked signal."**  
  Beta claims: **"CPR-7 is a systemic modulator."**  

  They share instruments (e.g., neural tracers, hormone assays) and standards: A rise in adrenal cortisol after hypothalamic stimulation counts as evidence for TLS if localized to direct synapses; for SM, if it shifts network-wide hormone ratios. Both can predict and replicate each other’s results: Alpha knows Beta will detect network-wide effects; Beta knows Alpha will map synaptic paths. Experiments show CPR-7 binds to direct synapses in 60% of cases (supporting Alpha) but also shifts global cortisol/aldosterone ratios in 70% of trials (supporting Beta). A shared "knockout" test emerges: Delete neurons synapsing with glands. If CPR-7’s effects persist, it’s SM; if abolished, TLS. Results show effects persist when direct synapses are removed, forcing Alpha to abandon its claim. The shift is rational—no conversion needed.

  ---

  ### Audit: Separating Semantic Incommensurability from Strong Incommensurability

  #### 1. **Key Claims and Failed Translations**
  - **Alpha’s claim in its vocabulary**: "CPR-7 is a target-locked signal (TLS)"  
    *Meaning*: CPR-7’s action requires direct synaptic connections to glands.  
  - **Beta’s claim in its vocabulary**: "CPR-7 is a systemic modulator (SM)"  
    *Meaning*: CPR-7’s action alters endocrine network balances irrespective of synaptic proximity.  

  **Attempted Translation Alpha → Beta**:  
  - "CPR-7 is a systemic modulator" does *not* capture Alpha’s claim. Beta’s "SM" includes CPRs that bypass synapses entirely, while Alpha’s "TLS" *excludes* these. The translation **smuggles in a distinction** Alpha rejects: CPR-7 could be SM (by network effects) without being TLS (if synapse-independent).  

  **Attempted Translation Beta → Alpha**:  
  - "CPR-7 is a target-locked signal" fails. Alpha’s "TLS" requires synaptic binding, but Beta’s "SM" includes CPRs that *lack* direct synapses (e.g., diffuse hormonal cascades). Translation **loses the distinction** of network-level outcomes and **mis-sorts** CPR-7: It is TLS in 60% of cases but SM in 70%.  

  **Why extensions cross**:  
  - Some CPRs are TLS-only (bind synapses but no network shift), some SM-only (network shift without synapses), some both (CPR-7), some neither.  
  - **Failure symmetry**: Neither vocabulary is more expressive. Alpha’s terms ignore network functions; Beta’s ignore synaptic mechanisms.  

  ---

  #### 2. **Kuhn vs. Davidson: Adjudicating the Exchange**
  - **Kuhn-style defender of semantic incommensurability**:  
    Argues the central terms ("TLS"/"SM") are taxonomically disjoint: Each framework sorts CPRs by incommensurable criteria (synaptic binding vs. network function). No sentence in Alpha’s vocabulary expresses Beta’s network-focused claim, and vice versa. The shift isn’t just new facts—it redefines what counts as a "signal."  

  - **Davidsonian objection ("partial failure presupposes success")**:  
    Contends the shared standards (e.g., cortisol assays, knockout tests) and predictive success show most language *transfers* (e.g., "receptor," "cortisol"). Incommensurability is local, not total: They debate rationally *because* background concepts (e.g., evidence, glands) are translatable.  

  **Adjudication**:  
  Davidson wins on comparability (shared standards enable rational shift), but Kuhn wins on semantics. The **central classificatory terms** resist translation due to cross-cutting extensions, yet the **shared periphery** (instruments, evidence rules) allows resolution. This is semantic incommensurability *without* perceptual or methodological barriers—precisely your target.  

  ---

  #### 3. **Isolating the Variable: What Generates Incommensurability?**
  - **Key feature**: The **taxonomic divergence in central kind-terms** ("TLS" vs. "SM"). Each term carves CPR-kinds along orthogonal axes (synaptic binding vs. network function), causing extensions to cross.  
  - **If removed**:  
    - If both traditions used identical kind-criteria (e.g., both focus on synapses), it collapses into **ordinary factual disagreement** (e.g., "Does CPR-7 bind synapses?").  
    - If the criteria were reconcilable (e.g., "TLS" redefined as a subtype of "SM"), it becomes **verbal dispute** (arguing definitions, not phenomena).  
  - **Attack by "incommensurability-as-verbal" opponent**:  
    They’d argue: "Alpha means ‘synapse-dependent,’ Beta means ‘network-altering.’ These are compatible predicates, not rival kinds. Calling CPR-7 ‘TLS’ or ‘SM’ is just labeling—like calling water ‘H₂O’ or ‘polar solvent.’ The knockout test resolves ambiguity, not incommensurability."  
    **Rebuttal**: The dispute isn’t about predicates but *explanatory primacy*. Alpha uses TLS to predict synaptic pathways; Beta uses SM to predict network stability. CPR-7’s dual behavior exposes a **categorical mismatch**: It fits both kinds imperfectly, forcing framework revision. This is substantive, not verbal—it reshapes research questions (e.g., "How do synapses matter?" → "How do networks integrate signals?").  

  ---

  ### Why This Case Works
  The **semantic incommensurability** arises from divergent kind-taxonomies ("TLS" vs. "SM"), while **shared standards** (observation rules, instruments) enable comparison and rational shift. All constraints hold:  
  1. **Shared evidence standards** (e.g., cortisol rise, knockout test).  
  2. **No perception/gestalt issues** (both predict and operate instruments).  
  3. **Extensions cross** (CPR-7 is TLS in synaptic contexts, SM in network contexts).  
  4. **Rational shift** (knockout test forces framework abandonment).  

  The machinery is clear: **Kind-terms with incommensurable criteria** generate untranslatability, but **peripheral concept-sharing** allows progress. This isolates semantic incommensurability from stronger claims.
