answer: |-
  Here's the translation of pragmatic encroachment into statistical decision theory, followed by a residue report on conceptual mappings:

  ### Core Translation to Statistical Vocabulary
  1.  **"Knowledge" as a Decision to Act:** Treat "S knows that p" as equivalent to **accepting the hypothesis H: p is true** as a basis for action under a specific decision rule.
  2.  **Evidence Strength:** The subject's *evidence* (e.g., past bank visits, website info) corresponds to the **test statistic** or **observed data** yielding a specific **p-value** or **likelihood ratio** supporting H: "Bank is open Saturday."
  3.  **Fixed Evidence, Variable Stakes:** Pragmatic encroachment's core scenario is identical evidence strength (same **p-value**, same **likelihood ratio**) but radically different **loss functions**.
  4.  **Stakes as Loss Functions:** The practical consequences define the **loss matrix**:
      *   *Low Stakes (Deposit Check):*
          *   Loss(Type I Error - Reject H₀ [H₀: Bank Open] when true): Low (Minor inconvenience: wait until Monday).
          *   Loss(Type II Error - Accept H₀ when false [Bank Closed]): Low (Same minor inconvenience).
          *   **Implied Decision Rule:** A relatively high **significance level (α)** or low **Bayesian posterior probability threshold** is acceptable. Act (go to bank) based on moderate evidence.
      *   *High Stakes (Avoid Eviction):*
          *   Loss(Type I Error): Catastrophic (Eviction, financial ruin).
          *   Loss(Type II Error): Very High (Eviction, financial ruin - *if* going was the only option).
          *   **Implied Decision Rule:** An extremely low **significance level (α)** or very high **Bayesian posterior probability threshold** is required. Withhold action (don't go, or verify further) unless evidence is overwhelmingly strong.
  5.  **The "Encroachment":** Pragmatic encroachment claims that whether we *attribute knowledge* ("S knows p") depends on the **implicit decision rule** justified by the **loss function**. High stakes necessitate a stricter rule (lower α, higher posterior threshold) for acceptance. Identical evidence might meet the low-stakes rule threshold ("knowledge") but fail the high-stakes threshold ("not knowledge").
  6.  **Rational Ignorance Claim:** The claim that it's *rational* to require more evidence under high stakes maps directly to the Neyman-Pearson lemma: the optimal test (minimizing expected loss or maximizing power for a given α) **depends on the relative costs of errors**. Ignoring stakes leads to suboptimal decisions.

  ### Residue Report: Mapping Fidelity & Gaps

  | **Pragmatic Encroachment Concept**         | **Statistical Translation**                                      | **Mapping Fidelity**                                                                 | **Residue/Stretch**                                                                                                                                                                  |
  | :----------------------------------------- | :--------------------------------------------------------------- | :----------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **"Knowledge" Attribution**                | Decision to **Accept H** under a specific decision rule.         | **Good.** Captures the functional role: accepting "p" as true enough for action.     | Statisticians rarely equate "accept H" with *knowing* H is true. It's a pragmatic choice under uncertainty. Philosophers debate the metaphysical/epistemic status of "knowledge".    |
  | **Varying Stakes**                         | **Varying Loss Function** (specifically, relative cost of Type I/II errors). | **Excellent.** Direct, uncontroversial mapping. Core insight is identical.           | None. This is the strongest mapping.                                                                                                                                                 |
  | **Requiring More Evidence Under High Stakes** | **Lowering α** or **Requiring Higher Posterior Probability** for acceptance. | **Very Good.** Direct consequence of changing loss functions in decision theory.     | Minor Stretch: Philosophers often frame this as needing "stronger evidence" *simpliciter*. Statisticians see it as needing evidence strong enough to justify the *risk* under high costs. |
  | **Fixed Evidential Strength**              | Fixed **p-value**, **likelihood ratio**, or **posterior** under a fixed prior. | **Good.** Captures the core scenario of identical statistical evidence.              | Philosophers often mean "same justificatory status" subjectively. Statistical measures are more objective/formalized.                                                                |
  | **Rationality of Stakes-Sensitivity**      | **Optimality of the Neyman-Pearson Decision Rule** given loss function. | **Excellent.** NP lemma *proves* the optimal test depends on error costs.            | None. This is the core statistical justification.                                                                                                                                     |
  | **"Knowledge" Disappearing Under High Stakes** | **Decision Rule Failing to Accept H** due to stricter thresholds. | **Adequate.** Describes the *outcome*: not acting on H.                              | **Significant Residue:** Statisticians wouldn't say the *evidence itself* changed or that H became "less true." Philosophers debate whether "knowledge" itself is lost or just prudently not acted upon. |
  | **Subject's Awareness of Stakes**          | **Incorporating Loss Function into the Decision Rule.**          | **Good.** Rational agents *should* incorporate stakes (losses).                      | Statisticians model the *ideal* rational agent. Philosophy debates how explicit/conscious this is for real agents.                                                                   |

  ### Is This Just Dressed-Up Decision Theory?
  **Mostly Yes, but with Nuanced Residue:**

  1.  **The Core is Standard:** The central claim – that **the rational threshold for acting on a belief depends critically on the costs of being wrong** – is fundamental, well-established decision theory (Neyman-Pearson being the clearest frequentist expression, Bayesian expected loss minimization being the general framework). Philosophers are largely rediscovering this wheel concerning belief attribution ("knowledge").
  2.  **The Genuinely Philosophical Residue:** Where it diverges is the *interpretation* of what "knowledge" *is*:
      *   **The "Knowledge" Attribute:** Statisticians focus on decisions (accept/reject, act/abstain). Philosophers focus on whether an agent possesses a specific epistemic state ("knowledge") *prior* to, or *independent* of, a specific action decision. Pragmatic encroachment argues this state *itself* depends on practical stakes. **There's no direct statistical counterpart to this pre-decisional epistemic state** labeled "knowledge." Statisticians deal with evidence strength and decision rules. "Knowledge" as a binary factive mental state isn't in the standard vocabulary.
      *   **The "Disappearing Knowledge" Intuition:** The stark intuition that "you *don't know*" in the high-stakes case, *despite identical evidence*, is philosophically loaded. A statistician would say: "Your evidence hasn't changed, but the risk of acting on it is now unacceptably high, so you rationally withhold action and perhaps seek more data." Denying "knowledge" sounds stronger; it suggests the evidence *was never sufficient* for *any* context, which contradicts the low-stakes judgment. **This metaphysical/epistemic claim about the nature of knowledge lacks a clean statistical analog.** It's a philosophical interpretation grafted onto the decision-theoretic structure.
      *   **Scope of Encroachment:** Some philosophers argue stakes affect *justification* or *warrant* itself, not just the decision threshold. This blurs the line between the strength of evidence and the risk tolerance. Statisticians generally keep evidence assessment (likelihood, posterior) separate from the loss function applied for decision-making. **Mapping this stronger claim requires stretching the statistical framework.**

  ### Conclusion
  Pragmatic encroachment's **core normative insight** – that rational action thresholds depend on error costs – **is pure, standard statistical decision theory** (Neyman-Pearson, Wald, Bayesian decision theory). The philosophical jargon about "knowledge" is primarily dressing this established point in epistemic terminology.

  The **genuine residue** lies in the **philosophical interpretation** of what "knowledge" signifies:
  1.  The claim is that stakes don't *just* affect what we *do*, but what we can truly be said to *know*, even before action.
  2.  The strong intuition that "knowledge vanishes" under high stakes, despite unchanged evidence strength.

  **Your framework captures *why* it's rational to behave differently and demand more evidence under high stakes. It doesn't inherently require, nor does it perfectly model, the philosophical claim that the agent's fundamental *epistemic state* ("knowledge") itself changes due to practical context.** The debate hinges on the nature of that state – something decision theory deliberately avoids defining, focusing instead on rational action under uncertainty. Pragmatic encroachment injects pragmatics into the *definition* of an epistemic state, which goes beyond the statistician's focus on evidence assessment and optimal action.
