prompt: |-
  I do foresight work at a mid-sized consultancy — mostly scenario planning for clients in energy and shipping. A big chunk of my job is building "what if" histories: we tell a client, suppose X hadn't happened in 1973, here's the plausible world that follows, and we use that to stress-test whatever strategy they're about to commit money to. My problem is my colleaugues' counterfactuals keep smuggling in inevitability. Somebody writes "even without the oil shock, the energy picture would look basically the same today," and you can just tell they ran history forward to whatever answer they already believed and called it a counterfactual. The whole point of the exercise is to locate where contingency actually lived, and we're using it as decoration.

  I vaguely remember from college that philosophers of history have actual tools for this — something like a "minimal rewrite" rule (change the least you can to get the divergence), and distinguishing causes that were necessary from ones that just happened to be sufficient in that setting. But I only half-remember it and can't reconstruct it. Can you turn whatever is actually usable from that way of thinking into a procedure I can run when vetting a draft scenario? To be concrete about my situation: we produce maybe three or four of these a quarter, each goes into a report with the client's name on it, the partner signs off, and I usually have a day at most to review a draft before it goes up the chain. So what I need is:

  - a checklist I can run on a draft in under an hour, with the questions in order
  - for each question, what counts as a pass and what counts as a fail
  - the places where the checklist has to stop and hand it back to the author, because the question is really about deep structure or values and no procedure can settle it
  - an honest note about where the procedure will misfire — I get that historical counterfactuals can't be tested the way they can in physics, so tell me what the procedure is actually doing in that case, even if the answer is "mostly keeping the author honest"

  Then run it on three scenarios from recent drafts:

  1. "If the shipping container had been invented ten years earlier, global manufacturing would still have ended up concentrated in East Asia." A junior swears by this one. I think it's inevitability in disguise — the second half of the sentence is doing no work, it's just today's world with a different start date — but I can't proove that with anything except my own irritation.
  2. "If the 1973 embargo had lasted six more months, Japan would have decarbonized by 1990." Client loves this one, it fits their story about energy transitions being shock-driven.
  3. "If Britain had never joined the EEC, its manufacturing decline would have looked the same, because deindustrialization was global." — actually make it two scenarios, one where the counterfactual change is small and one where it's enormous, so I can see whether the procedure treats them differently.

  And please be straight with me about at least one case where the procedure yields a verdict I won't like (probably #2, given who's paying us), and about what the whole exercise can't do — if the checklist ends up just laundering my intuitions with extra steps, I'd rather know that now.
reasoning: |-
  Okay, the user is doing foresight work with scenario planning, specifically counterfactual histories. Their main issue is colleagues creating counterfactuals that smuggle in inevitability, defeating the purpose of stress-testing strategies. They need a practical checklist to vet drafts quickly.

  First, I recall philosophers like David Lewis and his possible worlds theory. The minimal rewrite rule is key—only change necessary events. Also, distinguishing necessary vs. sufficient causes. The user mentioned those concepts but needs them operationalized.

  The checklist must be efficient—under an hour per draft. Questions should be ordered logically: start with divergence, then necessity/sufficiency, path dependency, contingency points, and end with plausibility checks. Each question needs clear pass/fail criteria. 

  For the divergence question, the counterfactual must alter a specific event without assuming outcomes. Example: Scenario 1 fails because it doesn't explain how the earlier invention changes decisions. Scenario 3 passes by focusing on the EEC decision.

  Necessary causes check if the altered event was truly pivotal. Scenario 2 fails here—six more months of embargo isn't necessary for Japan's decarbonization; other factors mattered. Sufficiency questions ensure multiple pathways are considered. Scenario 2 assumes the shock alone suffices, ignoring other barriers.

  Path dependency and contingency points prevent linear projections. Scenario 1 ignores feedback loops from earlier container adoption. Applying the checklist to the user's examples shows where each fails or passes. 

  The user also needs honesty about limitations. The checklist can't resolve deep historical debates but forces authors to justify assumptions. It highlights where intuition plays a role, especially in assessing compounding effects. 

  Scenario 2 is tricky because the client loves it, but the checklist flags it for multiple issues. The user must push back, using the checklist as evidence. Emphasize that it's about rigor, not blocking narratives. 

  Finally, the checklist systematizes scrutiny but can't eliminate subjectivity. It makes biases explicit, turning gut feelings into structured critique. That's valuable even if imperfect.
answer: |-
  Here's a practical checklist derived from counterfactual historiography (Lewis, Tetlock, Ferguson) tailored to your constraints. It focuses on **identifying smuggled inevitability** and **forcing contingency recognition**. The core principle is **"Minimum Rewrite of History" (MRH)** – change only the necessary event(s) and trace *plausible downstream consequences* without assuming predetermined outcomes.

  ---

  ### Counterfactual Scenario Vetting Checklist (20-45 mins/draft)
  **Run these questions IN ORDER. Stop and flag if any fail.**

  1.  **The Divergence Point:**
      *   *Question:* Is the altered event **specifically identified and isolated**? Does the draft explicitly state what *didn't* happen (or happened differently) and *why* this change is plausible within the pre-counterfactual context?
      *   *Pass:* Clear, singular (or tightly coupled) event/decision change described (e.g., "OPEC votes *against* embargo on Oct 16, 1973" or "Malcom McLean's 1955 patent application *is rejected*").
      *   *Fail:* Vague premise ("without the oil shock"), multiple unrelated changes bundled, change lacks plausibility context ("suddenly everyone loved nuclear power").
      *   *Stop & Hand Back:* If the divergence point itself is fundamentally implausible or requires rewriting deep structural factors (e.g., "if feudalism never existed").

  2.  **Necessity Check (Was THIS the Linchpin?):**
      *   *Question:* Does the draft demonstrate that the altered event was **truly necessary** for the *actual historical outcome* being discussed? Could the outcome likely have happened *anyway* via other pathways?
      *   *Pass:* Argues why *this specific event* was the crucial catalyst/blocker, considering alternatives (e.g., "The *specific timing and severity* of the '73 shock was unique; milder price rises earlier/later lacked the geopolitical shock effect needed for Japan's *immediate* crisis response").
      *   *Fail:* Assumes the event was the *only possible* cause without justification (e.g., "Deindustrialization *required* EEC membership" ignores global trends).
      *   *Stop & Hand Back:* If challenging the necessity requires re-litigating fundamental historical causation debates beyond the scope.

  3.  **Sufficiency Check (Did THIS Guarantee the Outcome?):**
      *   *Question:* Does the draft avoid treating the altered event as **sufficient by itself** to cause the *counterfactual outcome*? Does it identify other necessary enabling factors that might *still* be absent/different?
      *   *Pass:* Explicitly considers other required conditions (e.g., "Even with the shock lasting longer, Japanese decarbonization *also* required available tech (e.g., mature nuclear), political will *sustained beyond the crisis*, and capital availability").
      *   *Fail:* Implies the change directly and inevitably leads to the outcome ("Six more months of embargo -> Panicked Japan goes full renewable by 1990").
      *   *Stop & Hand Back:* If identifying enabling factors requires speculative reconstruction of deep cultural/political/economic structures.

  4.  **Path Dependency & Feedback Loops:**
      *   *Question:* Does the draft trace **mechanisms of change** beyond simple linear cause/effect? Does it consider how the initial change might alter incentives, institutions, technologies, or decisions *along the way*, creating new path dependencies?
      *   *Pass:* Identifies plausible intermediate decisions, policy shifts, or market reactions *triggered by the divergence* that lead to the outcome (e.g., "Earlier containers -> Cheaper Asian exports 10 yrs sooner -> *Accelerated* Western offshoring decisions in the *1960s* -> Potential for *even greater* Asian concentration by the 1980s, *or* possible protectionist backlash altering the path").
      *   *Fail:* Assumes the endpoint is reached via the same historical path, just shifted in time ("Everything happens the same, just 10 years earlier").
      *   *Procedure Limitation:* Judging the *plausibility* of proposed mechanisms is inherently subjective. The checklist forces them to be *stated*, not guarantees they're perfect.

  5.  **Contingency Recognition (The 'Butterfly Net'):**
      *   *Question:* Does the draft identify **specific points of high contingency** *within* the counterfactual timeline? Places where relatively small subsequent events/decisions could significantly alter the path *away* from the proposed outcome?
      *   *Pass:* Highlights forks in the road (e.g., "However, without the EEC pressure for CAP reform, UK agriculture policy could have diverged significantly, *potentially altering* rural political economy and its impact on manufacturing regions").
      *   *Fail:* Presents the counterfactual timeline as smooth and deterministic towards the stated outcome. Uses words like "inevitably," "naturally," "would still have."
      *   *Honest Note:* This is the hardest step. The reviewer must judge if *sufficient* contingency is acknowledged. The checklist flags its *absence*.

  6.  **Plausibility Anchor:**
      *   *Question:* Is the counterfactual outcome **grounded in known historical forces, actors, and constraints**? Does it avoid relying on implausible actions or outcomes wildly outside contemporary norms/capabilities?
      *   *Pass:* Uses historical actors' known motivations, technological capabilities of the era, and institutional constraints realistically (e.g., "Japan's 1990 decarbonization would require *unprecedented* sustained political unity and capital allocation, exceeding even its historical crisis response capacity").
      *   *Fail:* Relies on actors behaving completely "out of character" or technologies/material capabilities magically appearing faster than historically possible ("Britain spontaneously adopts Singaporean industrial policy").
      *   *Stop & Hand Back:* If the entire scenario hinges on fundamentally rewriting human nature or physical laws.

  ---

  ### Applying the Checklist to Your Scenarios

  1.  **"If the shipping container had been invented ten years earlier, global manufacturing would still have ended up concentrated in East Asia."**
      *   **Divergence:** Pass (Specific change: invention date).
      *   **Necessity:** **FAIL.** Doesn't argue why the *timing* was crucial for the *concentration location*. Could cheaper shipping *earlier* have accelerated *other* regions (e.g., Mexico for US, Eastern Europe for W. Europe)? Was East Asia *ready* 10 yrs earlier?
      *   **Sufficiency:** **FAIL.** Implies the earlier invention is sufficient to guarantee the *same* outcome, ignoring how earlier changes alter the path (e.g., different infrastructure investments, trade policies, political reactions in the West/Asia).
      *   **Path Dependency:** **FAIL.** Assumes identical path ("still ended up"). No mechanisms for how earlier containers *lead* to the same endpoint despite changing the 1960s landscape.
      *   **Contingency:** **FAIL.** No recognition that earlier containers could lead to different intermediate outcomes altering the final state.
      *   **Plausibility:** Pass (Outcome is historically consistent, but path isn't justified).
      *   **Verdict:** **Reject.** Smuggles inevitability. The claim about the endpoint is unsupported by the counterfactual premise. It illustrates path *independence*, not contingency.

  2.  **"If the 1973 embargo had lasted six more months, Japan would have decarbonized by 1990."** (Client Favorite)
      *   **Divergence:** Pass (Specific change: duration).
      *   **Necessity:** **AMBER FLAG.** Does it argue *why* 6 more months was the *necessary* tipping point beyond the actual severe shock? Was the *actual* shock insufficient *only* due to duration? (Likely fails - other factors like tech, politics were key barriers).
      *   **Sufficiency:** **FAIL.** Treats the longer shock as sufficient by itself for complete decarbonization in 17 years. Ignores massive technological, economic, and political hurdles that existed *regardless* of shock duration (nuclear timelines, grid constraints, vested interests, cost).
      *   **Path Dependency:** **FAIL.** Jumps straight from cause to distant effect without plausible intermediate steps (policy changes, tech deployment rates, public acceptance shifts *caused specifically by the extra 6 months*).
      *   **Contingency:** **FAIL.** No recognition that even with a longer shock, subsequent political shifts, economic downturns, or technical setbacks could derail a 1990 target.
      *   **Plausibility:** **FAIL.** 1990 decarbonization was technologically and economically implausible for Japan, even with immense political will. Requires unrealistic deployment speeds and cost assumptions.
      *   **Verdict:** **Reject.** This is the verdict you might not like. The checklist exposes it as wishful thinking disguised as counterfactual. It fails multiple checks spectacularly, especially Sufficiency and Plausibility. **This is where the procedure earns its keep – blocking a client-pleasing but analytically weak scenario.**

  3.  **"If Britain had never joined the EEC, its manufacturing decline would have looked the same, because deindustrialization was global."**
      *   **Divergence:** Pass (Specific change: No EEC membership).
      *   **Necessity:** **AMBER FLAG/PASS.** Argues EEC membership wasn't *necessary* for UK deindustrialization, citing the global trend. This is defensible *if* supported (Pass). But needs to address *specific* EEC impacts (e.g., CAP, regional funding).
      *   **Sufficiency:** **PASS.** Doesn't claim non-membership *caused* deindustrialization, just that it wouldn't have *prevented* it. Focuses on the global trend being sufficient.
      *   **Path Dependency:** **AMBER FLAG.** Could do more, but acknowledges the global force ("because deindustrialization was global") implies similar pressures would exist. Could note *how* non-membership might slightly alter the *pace* or *regional pattern* without changing the overall decline.
      *   **Contingency:** **FAIL (Mild).** Doesn't explore if non-membership could have led to *different* UK policies (e.g., more protectionist, different industrial strategy) that *might* have mitigated *some* aspects *temporarily*, even if the global trend dominated.
      *   **Plausibility:** **PASS.** Global deindustrialization was a powerful force. Arguing UK couldn't completely escape it is plausible.
      *   **Verdict:** **Revise & Strengthen.** This is a *small* change scenario treated differently. It passes core MRH checks (Divergence, Sufficiency, Plausibility) but stumbles on Contingency. Revision should: a) Briefly note *why* global forces dominate EEC-specific ones, b) Acknowledge *potential* for minor differences in the *path* (pace, regional impacts) even if the *outcome* (significant decline) is similar.

  ---

  ### Honest Notes on Limitations & What the Procedure Actually Does

  1.  **It Launders Intuitions (A Bit):** Yes, it systematizes your critical thinking. It forces *explicit* articulation of *why* a scenario feels inevitable, turning gut feeling ("this is decoration") into specific, challengeable points (fails Necessity/Sufficiency/Path Dependency). It makes your review defensible.
  2.  **It Can't Resolve Deep Historical Disputes:** The checklist flags where deep structural arguments are needed (Stop & Hand Back points). It can't *settle* whether the EEC was truly necessary for UK decline; it forces the author to *justify* their position within the scenario.
  3.  **Plausibility is Subjective:** Judging "plausible mechanisms" (Path Dependency) or "realistic constraints" (Plausibility) involves historical interpretation. The checklist forces the argument to be made, not that it's flawless. Use consensus historical knowledge as a benchmark.
  4.  **It Underweights Compounding Uncertainty:** While Contingency Recognition is a step, truly rigorous counterfactuals get exponentially uncertain. The checklist promotes *acknowledging* contingency, not perfectly modeling it. 1 hour isn't enough for deep stochastic modeling.
  5.  **What It Actually Does:** It **enforces counterfactual discipline** based on MRH. It prevents:
      *   **Starting from the Endpoint:** (Checks 1, 2, 3, 4).
      *   **Ignoring Mechanisms:** (Check 4).
      *   **Treating Events as Magic Bullets:** (Checks 2, 3, 6).
      *   **Forgetting History Unfolds Step-by-Step:** (Checks 4, 5).
      *   **Wishful Thinking:** (Check 6 - especially in #2).
  6.  **Misfires:** It might flag a genuinely novel but well-argued scenario as needing revision on Contingency/Path Dependency if the author hasn't articulated their reasoning clearly enough. It prioritizes avoiding inevitability over encouraging radical (but plausible) re-imaginings. Use your judgment on revisions.

  **Conclusion:** This checklist won't create perfect counterfactuals, but it will systematically expose "smuggled inevitability" and force authors to engage with contingency and mechanisms. It turns your valid irritation into actionable, defensible feedback. Use it as a scalpel, not a sledgehammer, especially on revisions (like Scenario 3). Be prepared to defend the Sufficiency/Plausibility failure on Scenario 2 – the procedure gives you the ammunition. Good luck!
