prompt: |-
  I direct the Office of Performance and Innovation for a city of roughly 340,000. My staff is five people, none of them economists; our one analyst is a part-time data person who mostly maintains dashboards. In the spring our city manager attended a conference session on governance by prediction markets and came back convinced we should pilot something he is calling futarchy on a handful of decisions this fiscal year. The version of the idea that persuaded him was roughly the one its originator popularized: let elected officials settle what we are trying to achieve, then let speculators bet on which of the candidate policies will achieve more of it, and adopt whichever branch the market prices higher. He has asked me to produce a written procedure that any program manager in any department can run on an incoming proposal before we commit public money to opening a market. He does not want another essay on whether prediction markets are wise in general; he wants steps, in order, with a stopping condition at each one.

  The constraints are these. The pilot has $60,000 in total, most of which is earmarked for seeding liquidity, because the platform vendor assures us the contracts themselves are trivial to write. Proposals arrive continuously — we field fifteen to twenty serious ones a year and expect four or five to reach the pilot — and each one gets a single afternoon of analysis before our monthly review board, at which the city attorney and one council member must sign off before anything goes live. The decisions at issue range from about $1 million to $15 million and affect anywhere from a few hundred households to most of the city; a couple of them are effectively irreversible for a decade. One department head insists any market must be written on a single dollar figure, and another insists that a dollar figure is exactly the wrong thing to write it on and wants a composite index instead. Please write the procedure so that this disagreement is resolved by the procedure rather than by whoever talks longest.

  Specifically, I need it to tell a non-specialist, step by step: what makes a decision eligible at all, and whether repeatability matters; how to tell a measurable outcome apart from a value, and who is permitted to choose the outcome the contract pays on; how to condition a contract on the policy actually being adopted, and who gets to declare that the condition was met; how thick a market has to be before its price is evidence rather than noise, and what to do when the honest answer is that we cannot get a number; how we would ever know the price was right, given that we only observe the branch we took and the losing branch is never resolved; how we keep a trader from buying the outcome he wants, in the market, in the world, or both, especially when the best-informed potential traders are also interested parties; what the losing side of the bet is entitled to do afterwards; and at which step the procedure must stop and hand the question back to elected officials because it is about what we should want rather than what will happen. Mark clearly which steps are genuinely mechanical and which are judgment calls wearing a procedural costume.

  Then run the procedure on three proposals we actually have on the table. First, whether to convert four low-ridership bus routes into a higher-frequency network, where the transit department wants the contract written on total boardings and the equity office wants it written on total rider-minutes, and where implementation would be partial and phased. Second, whether to sign a ten-year exclusive contract with one waste hauler or keep the collection zones out to competitive bid, where the parties with the best information about the answer are the bidders themselves. Third — and this is the city manager's flagship, the one he has already mentioned to the council — whether to open an overnight shelter at a specific vacant site, with the market written on assessed property values within a half mile over eighteen months. If the procedure kills the flagship, say so plainly and explain what specifically fails; if it lets all three through, tell me it is not a procedure but a rubber stamp. Finally, give me the limits: what classes of decision this will systematically get wrong, what a bad outcome would look like, and what we should be watching in month six that would tell us the pilot is failing before the failure is expensive.
reasoning: |-
  We are designing a step-by-step procedure for the Office of Performance and Innovation to evaluate whether a proposed decision is suitable for a prediction market (futarchy) pilot. The procedure must be mechanical where possible and flag judgment calls. It must resolve the disagreement between the department heads (one wanting a single dollar figure, the other a composite index) by the procedure.

   Constraints:
   - Total pilot budget: $60,000 (mostly for liquidity)
   - Each proposal gets one afternoon of analysis
   - Monthly review board with city attorney and one council member
   - Decisions range from $1M to $15M, affecting hundreds to most of the city, some irreversible for a decade

   The procedure must address:
   1. Eligibility (and whether repeatability matters)
   2. Distinguishing measurable outcome from value, and who chooses the outcome
   3. Conditioning on policy adoption and who declares the condition met
   4. Market thickness: when is the price evidence vs. noise? What if we can't get a number?
   5. How to know the price was right (since we only observe one branch)?
   6. Preventing a trader from buying the outcome he wants (especially when best-informed are interested parties)
   7. What the losing side can do afterwards
   8. At which step to stop and hand back to elected officials (when it's about what we want, not what will happen)

   We are to run the procedure on three proposals:

   Proposal 1: Convert four low-ridership bus routes into a higher-frequency network.
     - Transit dept: contract on total boardings
     - Equity office: contract on total rider-minutes
     - Implementation: partial and phased

   Proposal 2: Sign a ten-year exclusive contract with one waste hauler vs. competitive bidding.
     - Best-informed: the bidders themselves

   Proposal 3: Open an overnight shelter at a specific vacant site.
     - Market written on assessed property values within a half mile over 18 months (city manager's flagship)

   We must also provide:
   - Limits: what classes of decision this will systematically get wrong?
   - What a bad outcome would look like?
   - What to watch in month six to detect early failure?

   Let's design the procedure step by step.

   Procedure: Evaluating a Decision for Futarchy Pilot

   Step 0: Pre-Screen for Eligibility
     - The decision must involve at least two distinct, mutually exclusive policy options (branches). If only one option, stop: not eligible.
     - The decision must be pending and not yet implemented. If already implemented, stop.
     - The decision must have a clear timeline for adoption (if chosen) and for outcome measurement. If the timeline is not defined, stop.
     - The decision must be reversible in less than a decade? (No, because one of the constraints says some are irreversible for a decade.) Instead: note that irreversibility increases risk but does not automatically disqualify. However, if the decision is irreversible, the market must be particularly well-designed to capture long-term effects. (Judgment call: if irreversible and the outcome measurement period is too short to capture major effects, it may be ineligible. But we don't stop here for irreversibility alone.)
     - Repeatability: Not required because we are only concerned with the specific decision at hand. However, if the decision is one of a series of similar decisions, that might help with market participation (but not required for eligibility).

     Mechanical: Check for two distinct branches, pending status, and defined timeline for adoption and measurement.

     If not met, stop: decision is ineligible.

   Step 1: Define the Outcome Metric
     - The outcome must be measurable and verifiable after the fact. It must be an objective indicator, not a subjective value.
     - How to distinguish measurable outcome from value: 
          - A measurable outcome is a quantity that can be objectively measured (e.g., number of boardings, property values, cost savings) without requiring subjective interpretation (e.g., "community satisfaction" would require a survey and index construction, which may be acceptable if predefined and objective, but it's more complex).
          - The outcome must be defined so that it can be independently verified by a third party (e.g., using city data, public records, or a predefined audit).
     - Who chooses the outcome? The elected officials (via the review board) must approve the outcome metric. However, the proposer (department) and any stakeholders (like the equity office) can propose metrics. The review board will decide in case of disagreement.

     - Resolving the department head disagreement: The procedure does not mandate either a single dollar figure or a composite index. Instead, it requires that the metric must be:
          (a) Measurable and verifiable (as above)
          (b) Unambiguous (the contract must resolve to a single number without discretion)
          (c) Timely (the result must be available within a predefined and reasonable time after policy implementation, considering the decision's impact)
          (d) Reflective of the intended goal (as set by elected officials)

     - If a composite index is proposed, it must be predefined and calculated by a transparent formula using objective inputs. However, a single dollar figure is preferred for simplicity and to avoid ambiguity.

     - Judgment call: The review board must decide if the proposed metric (whether single dollar or composite) meets the criteria and reflects the goal. They must also consider if the metric can be gamed independently of the policy's true success.

     - If no metric can be agreed upon that meets these criteria, stop: the decision is ineligible for a prediction market.

   Step 2: Condition the Contract on Policy Adoption
     - The contract must be conditioned on the policy being adopted and implemented as described. Otherwise, the market would be betting on the chance of adoption as well as the outcome, which is not the intent.
     - How to condition: The contract will pay based on the outcome metric only if the policy is implemented. If not implemented, the contract is void (or returns the initial investment, depending on the platform). 
     - Who declares the condition met? The city manager (or a designated official) must certify that the policy was adopted and implemented as described in the market contract. This certification must be done within a defined period after the policy decision.

     - Mechanical: The contract terms must include a clause that the outcome payment is contingent on implementation. The procedure for certification must be predefined and included in the market description.

   Step 3: Assess Market Feasibility (Liquidity and Noise)
     - We need to estimate whether the market will be thick enough to produce a reliable price. The platform vendor may help, but we must have a stopping condition.
     - We have $60,000 total for the pilot, to be spread across 4-5 markets. So we can allocate about $12,000-$15,000 per market for liquidity seeding (but we must reserve some for setup and unexpected costs; let's say $10,000 per market for liquidity).
     - The platform vendor should provide an estimate of the expected bid-ask spread and market depth given the liquidity seed. We require that the expected bid-ask spread (as a percentage of the contract value) is below a threshold (e.g., 5%? This is a judgment call) and that there is a minimum number of distinct traders (e.g., at least 20? again judgment) expected to participate. 
     - How to get the estimate? We can ask the vendor and also consider:
          - The number of potential traders (city employees? public? experts?) and their incentives to participate.
          - The complexity of the question (if too complex, even with liquidity, the market may not attract informed traders).
     - What if we cannot get a number? If the vendor cannot provide an estimate, or if the estimate shows the spread would be too high even with the liquidity seed, then stop: the market is too thin.

     - Judgment call: Setting the thresholds for spread and number of traders. The review board must approve the vendor's estimates and the feasibility.

   Step 4: Addressing the "Only One Branch" Problem (Counterfactual)
     - We never observe the outcome of the rejected branch. Therefore, the market for the rejected branch cannot be resolved. This is inherent.
     - How to handle: The market must be designed as a comparative market. We can have two contracts:
          Contract A: Pays $1 if the chosen policy (say Policy X) achieves an outcome above a predefined threshold (or relative to the alternative, but we can't observe the alternative). 
          Alternatively, we can structure the market as:
          Market for Policy X: Pays based on the outcome of X if X is implemented.
          Market for Policy Y: Pays based on the outcome of Y if Y is implemented.

     - But we only implement one. So we would run two markets? That doubles the cost and liquidity requirements. Alternatively, we can have a single market that compares the two policies by having traders bet on which one will have a better outcome. However, that market would require both to be implemented to resolve, which is impossible.

     - Proposed solution: We run separate markets for each policy, but the contracts are structured as:
          "If Policy X is implemented, this contract pays $[outcome of X]." 
          "If Policy X is not implemented, this contract pays $0 (or a fixed amount, but typically it becomes worthless)."

     - Then, we compare the market prices for the two policies. The price of the contract for Policy X represents the market's expectation of the outcome if Policy X is implemented. Similarly for Policy Y. We then choose the policy with the higher expected outcome (as per the market price).

     - However, note: the prices are in different units? Not if the outcome is the same metric (e.g., both on total boardings). So if we have:
          Market for Policy X: Price = expected boardings under X
          Market for Policy Y: Price = expected boardings under Y

     - Then we can compare the two prices.

     - But what if we only implement one? The market for the non-implemented policy will expire worthless? Yes. So traders in the non-implemented policy lose their investment.

     - The problem: We only observe one outcome, so the market for the non-implemented policy is never resolved against reality. This might deter trading in the non-implemented policy? And traders might not have incentive to gather information about the non-implemented policy.

     - Alternative structure: Use a combinatorial market where one contract pays off if Policy X is implemented and then the outcome is good, and another for Policy Y. But then we are combining the adoption and outcome.

     - The procedure: We must have separate markets for each policy, and the outcome metric must be the same for both. The review board must approve that the outcome metric is comparable across policies.

     - If the outcome metric is not comparable (e.g., if the two policies aim for different outcomes), then stop: the decision is ineligible.

     - How to know the price was right? We can't for the non-implemented branch. We have to trust the market mechanism. We can only validate the implemented branch after the fact. This is a fundamental limitation.

   Step 5: Prevent Manipulation and Conflict of Interest
     - Problem: Traders might try to manipulate the market by trading to influence the policy choice (because they want the policy to be adopted for reasons other than the outcome) or by trading to profit from a world outcome they can influence.
     - How to mitigate:
          a. Restrict trading to disinterested parties? But then we lose the best-informed (e.g., bidders in the waste contract). Alternatively, allow everyone but monitor for manipulation.
          b. The platform should have the ability to flag suspicious trading patterns (but we don't have the staff to monitor continuously). 
          c. Use a market maker to provide liquidity and dampen volatility.
          d. Limit the maximum position a trader can take? (But this might reduce liquidity.)
          e. Delay the resolution of the market until after the policy decision? No, because the market is to inform the decision.

     - The procedure: 
          - The review board must identify potential conflicts of interest. If a party has a direct financial stake in the policy decision (e.g., a bidder in the waste contract) and that party is likely to be a major trader, then the market design must include safeguards:
               - Disclosure: Require traders to disclose conflicts (but anonymous trading might conflict with this).
               - Limit trading by city employees or contractors? (But we want their information.)
               - Use a small-stakes market: the amount at stake in the market is small compared to the real-world stakes, so manipulation for financial gain is unprofitable. However, if the policy decision itself has high stakes, a trader might try to manipulate the market to get the policy adopted.

          - Judgment call: If the review board determines that the risk of manipulation is too high (e.g., if the best-informed parties have a strong conflict and the market is thin), then stop: the market is too vulnerable to manipulation.

   Step 6: The Losing Side's Recourse
     - After the policy is chosen based on the market, the losing side (those who bet on the non-implemented policy) have no recourse because their contracts expire worthless. 
     - However, if there is evidence of market manipulation, there should be a process to investigate. The city attorney should review any complaints of manipulation and, if found, the market result may be voided (but this would be after the policy decision? and might be too late). 
     - The procedure: 
          - Before the market opens, the rules must state that all trading is at the trader's own risk and that the city is not liable for losses.
          - Any complaints about market manipulation must be filed with the city attorney within 24 hours of the market closing. The city attorney may then investigate and, if manipulation is found, the market result may be discarded. In that case, the policy decision must be revisited by elected officials.

   Step 7: Handing Back to Elected Officials
     - This happens at several potential stopping points (as above). But also, if at any step the decision involves a value judgment (what we should want) rather than a prediction (what will happen), we must stop.
     - Specifically, in Step 1, when defining the outcome metric, if the discussion reveals that the disagreement is about what the city should value (e.g., total boardings vs. rider-minutes might reflect a value choice between ridership and rider convenience) then this is a value question and must be decided by elected officials. The procedure should not proceed until the elected officials set the metric.

     - Therefore, the procedure must stop and hand back to elected officials when:
          - The choice of outcome metric is inherently a value judgment and not a technical matter. (Judgment call: if the department heads disagree on the metric because they prioritize different values, the review board must elevate the issue to the full council for a decision on the metric.)

     - Also, if the market design fails at any step (e.g., no feasible market, too risky, etc.), then the decision is handed back to the normal process.

   Step 8: Final Approval
     - If the decision passes all steps, the review board (city attorney and council member) signs off and the market is opened.

   Now, we run the three proposals through this procedure.

   Proposal 1: Bus Route Conversion
     - Step 0: Eligible? Two branches: convert or not. Pending. Timeline: implementation phased? We need a clear implementation date and outcome measurement period. The outcome must be measured after full implementation? But phased: we might measure after each phase? The contract must specify the measurement period. Let's assume they define a period (e.g., one year after full implementation). Eligible.

     - Step 1: Define outcome metric. 
          - Transit department: total boardings (measurable from fare data).
          - Equity office: total rider-minutes (requires data on travel time, which is also measurable via GPS? but more complex). 
          - Both are measurable and verifiable. But they are different. This is a value conflict: do we want to maximize ridership or rider convenience? 

          Therefore, judgment call: the review board must decide if one metric is the agreed goal. If not, they must elevate to elected officials (full council) to choose the metric. The procedure stops until the council sets the metric.

          If the council chooses one metric, then we proceed. Otherwise, if they cannot agree, the decision is ineligible.

     - Step 2: Condition on adoption. The city manager can certify that the conversion was implemented (or not). Okay.

     - Step 3: Liquidity. Vendor estimates needed. But we have $10,000 for liquidity? Probably feasible. But we must get the vendor's estimate.

     - Step 4: We have two branches: "convert" and "do not convert". We need two markets. The outcome metric must be the same for both. So whichever metric is chosen (boardings or rider-minutes) will be the outcome for both branches. We can compare the expected outcome under conversion vs. no conversion.

     - Step 5: Conflict of interest? The transit department and equity office might trade? But they are city employees and might be restricted. The main traders might be bus riders, citizens, or experts. Low risk of manipulation? Probably acceptable.

     - Step 6: Recourse: normal.

     - Step 7: We already identified a value conflict in Step 1. Unless resolved by council, we stop.

     - Conclusion: This proposal is stopped at Step 1 until the council chooses between boardings and rider-minutes.

   Proposal 2: Waste Hauler Contract
     - Step 0: Eligible? Two branches: exclusive contract vs. competitive bidding. Pending. Timeline: the contract would start at a defined date. Outcome metric? We need to define one.

          - What goal? Cost savings? Service quality? The proposal doesn't specify. We must define an outcome.

          - The department head who wants a single dollar figure: might propose "total cost to the city over the ten years" (but note: the exclusive contract might have a fixed price, while competitive bidding would be variable). Also, service quality might suffer. The other department head wants a composite index (e.g., cost and quality). 

          - Step 1: We need an outcome. If we choose cost, it's a dollar figure and measurable. But what about quality? We might need to include something. 

          - This is a value question: is cost the only goal? Or do we care about quality? The elected officials must set the goal.

          - Alternatively, we could have a composite index (e.g., cost per ton collected plus number of complaints). But it must be predefined.

          - Without an outcome defined, we stop at Step 1 until the council sets the goal and approves a metric.

     - Step 2: Condition on adoption: okay.

     - Step 3: Liquidity: feasible with seeding.

     - Step 4: Two branches, same metric: feasible.

     - Step 5: Conflict of interest: the bidders are the best-informed. They have a huge financial stake (the contract) and might trade to manipulate. For example, a bidder wanting the exclusive contract might bet heavily in the market to make it appear that the exclusive contract will have a better outcome. This is high risk.

          - The procedure: the review board must assess the manipulation risk. Given that the bidders are highly motivated and the market might be thin, the risk is too high. We stop at Step 5.

     - Conclusion: Stopped at Step 5 due to high manipulation risk.

   Proposal 3: Overnight Shelter (City Manager's Flagship)
     - Step 0: Eligible? Two branches: open the shelter or not. Pending. Timeline: outcome measured over 18 months. Irreversible for a decade? The decision to open might be reversible (we can close it), but the impact on property values might last. Eligible.

     - Step 1: Outcome metric: assessed property values within a half mile over 18 months. 
          - Measurable? Yes, from property assessments. 
          - But note: property assessments are done annually? So we must define the baseline and the 18-month point. Also, the shelter might affect property values in complex ways (positive or negative). 
          - Is this the goal? The city manager might want to help the homeless, but the metric is property values. This is a value conflict: is the goal to improve property values? Or to reduce homelessness? The market is on property values, but the council might care more about homelessness. 

          - Therefore, Step 1 requires that the elected officials must confirm that the outcome metric (property values) is the goal. If the goal is to help the homeless, then property values might be a proxy. But it's a weak proxy? And property values might be affected by many other factors.

          - The procedure stops at Step 1: the review board must decide if property values are an acceptable metric for the goal. If the goal is actually about homelessness, then we need a different metric (e.g., number of homeless served, reduction in street homelessness). But the market is written on property values. The city manager might have chosen property values because it's easy to measure, but it might not align with the goal.

          - Judgment: if the council agrees that the shelter's impact on property values is the primary concern, then proceed. But if the goal is humanitarian, then we need a different metric. So we must elevate to the council to set the goal and metric.

     - Step 2: Condition on adoption: okay.

     - Step 3: Liquidity: feasible.

     - Step 4: Two branches, same metric (property values) for both: what if we don't open the shelter? We still measure property values. So we can compare the expected property values under both branches. But note: the market for the non-implemented branch is on property values without the shelter. That's fine.

     - Step 5: Conflict of interest? Property owners within half a mile might trade to protect their interests. They might try to manipulate the market to prevent the shelter from being built (if they fear it lowers property values). Also, advocates for the homeless might trade to get the shelter built. But the financial stakes in the market are small compared to property values? So manipulation might be profitable? 

          - For example, a property owner could spend $10,000 in the market to prevent the shelter (if they believe it would lower their property value by $100,000). 

          - The review board must assess: the market is vulnerable to manipulation by a small group of property owners. Risk is high. Stop at Step 5.

     - Alternatively, if we change the metric to something less directly tied to property owners (like homeless counts), then manipulation might be harder. But then we are back to Step 1.

     - Conclusion: 
          - Without a change in metric, we stop at Step 1 (if the council doesn't approve property values as the goal) or Step 5 (if they do, but then we see manipulation risk). 
          - Specifically, if the council sets the metric as property values, then we proceed to Step 5 and find high risk. So either way, the flagship fails.

     - Therefore, the procedure kills the flagship.

   Overall: 
     - Proposal 1: Stopped at Step 1 (unless council resolves metric)
     - Proposal 2: Stopped at Step 5 (manipulation risk)
     - Proposal 3: Stopped at Step 1 or Step 5 (so fails)

   So the procedure is not a rubber stamp.

   Limits of the method:

   1. Value-laden decisions: Prediction markets are for predicting outcomes, not for setting values. If the disagreement is about what to value, the market cannot resolve it.

   2. Long-term and irreversible decisions: The market might be poor at predicting long-term effects because traders discount the future and because the outcome might not be resolved for years.

   3. Thin markets: For decisions that are highly technical or with few potential traders, the market may be thin and noisy.

   4. Manipulation: When interested parties have a lot at stake and the market is small, manipulation is a risk.

   5. Counterfactual: We never know if the market was right about the rejected branch.

   6. Gaming the metric: Traders might bet based on how they think the metric will be gamed, not the true goal.

   What a bad outcome looks like:
     - The market recommends a policy that turns out to be disastrous because the outcome metric was gamed (e.g., the waste contract goes to a low-quality hauler because the market only considered cost and the hauler cut corners, leading to service failures).
     - Or the market is manipulated (e.g., property owners drive up the price of the "no shelter" contract to prevent the shelter, even though the shelter would have been beneficial).

   What to watch in month six (if any markets have run):
     - Liquidity: Are the markets thin? (High bid-ask spreads, low trading volume.)
     - Trader diversity: Are there only a few traders? Are they concentrated in one group (e.g., city employees, or a particular neighborhood)?
     - Price volatility: Are prices swinging wildly without news? That might indicate manipulation or thinness.
     - Timeliness: Are we able to get the markets set up and resolved in time for decisions?
     - Stakeholder trust: Are department heads and the council losing confidence in the pilot because of delays or complexity?

   If any of these occur, the pilot might be failing and we should reconsider before committing more funds.

   Final note: The procedure is designed to catch problems early. It is not a rubber stamp.
answer: |-
  ### Procedure for Evaluating Futarchy Pilot Eligibility

  #### Step 0: Policy Branch Definition  
  **Purpose**: Ensure the decision has clear, mutually exclusive policy branches.  
  **Action**:  
  1. Identify exactly two policy options (e.g., "Adopt Policy A" vs. "Status Quo" or "Adopt Policy A" vs. "Adopt Policy B").  
  2. Verify branches are actionable and distinct (e.g., "convert bus routes" vs. "keep current routes").  
  **Stopping Condition**: Stop if there are not exactly two branches. *Rationale: Markets require binary comparisons.*  
  **Judgment Call?** Mechanical.  

  #### Step 1: Outcome Metric Selection  
  **Purpose**: Define a measurable, value-neutral outcome tied to elected officials' goals.  
  **Action**:  
  1. Elected officials (via council resolution) must define the *goal* (e.g., "increase transit access").  
  2. Staff propose 1–3 measurable *outcome metrics* (e.g., "total boardings," "rider-minutes").  
     - Metric must be:  
       - Quantifiable (continuous or index; e.g., dollars, counts, or predefined composite).  
       - Verifiable by city data (no subjective judgments).  
       - Timely (measurable within 2x the policy implementation period, max 3 years).  
  3. Review board (city attorney + council member) selects the metric.  
     - *Resolving Disagreement*: If parties advocate dollar vs. index, the board chooses based on:  
       - Which aligns with the goal?  
       - Which is less gameable?  
       - Which has cleaner data?  
  **Stopping Condition**: Stop if no metric is objective, timely, and verifiable. *Rationale: Prevents betting on values, not outcomes.*  
  **Judgment Call?** Board’s selection is judgment; metric criteria are mechanical.  

  #### Step 2: Policy Adoption Conditioning  
  **Purpose**: Ensure the market only pays out if the policy is implemented as described.  
  **Action**:  
  1. Contract includes a "Policy Trigger Clause":  
     - "This contract pays out only if [Policy Branch] is fully implemented per [implementation document] by [date]."  
  2. City manager certifies implementation within 30 days of the deadline.  
     - Certification based on pre-defined criteria (e.g., "all bus routes converted by MM/YYYY").  
  **Stopping Condition**: Stop if policy implementation cannot be objectively verified. *Rationale: Avoids market noise from adoption uncertainty.*  
  **Judgment Call?** Mechanical.  

  #### Step 3: Market Liquidity Assessment  
  **Purpose**: Ensure price signals are reliable.  
  **Action**:  
  1. Vendor estimates liquidity needs (ideal: 100+ traders, <5% bid-ask spread).  
  2. Allocate max $12,000 per market from the $60,000 liquidity pool.  
  3. If vendor estimates spread >10% or traders <50 after seeding, reject.  
  **Stopping Condition**: Stop if liquidity is unattainable within budget. *Rationale: Thin markets produce noise, not evidence.*  
  **Judgment Call?** Vendor input is mechanical; spread/trader thresholds are judgment.  

  #### Step 4: Conflict of Interest Controls  
  **Purpose**: Prevent traders from manipulating outcomes.  
  **Action**:  
  1. Identify "high-risk" traders (e.g., policy beneficiaries, contractors, bidders).  
  2. Apply:  
     - Trading caps: Max $500 stake per trader.  
     - Anonymity: Mask trader identities.  
     - Delayed resolution: Hide market prices until decision deadline.  
  3. If >30% of likely traders are high-risk, reject.  
  **Stopping Condition**: Stop if high-risk traders dominate and controls are insufficient. *Rationale: Markets fail if biased actors distort prices.*  
  **Judgment Call?** Risk assessment is judgment; controls are mechanical.  

  #### Step 5: Losing Trader Recourse  
  **Purpose**: Mitigate post-market challenges.  
  **Action**:  
  1. All traders agree: "Market prices are advisory; no recourse if policy is adopted."  
  2. City attorney reviews trades for manipulation pre-decision.  
     - If manipulation found, market voided.  
  **Judgment Call?** Mechanical.  

  #### Step 6: Final Eligibility Check  
  **Purpose**: Confirm the decision is about prediction, not values.  
  **Action**:  
  1. Ask: "If we knew Policy A would achieve [metric] = X and Policy B = Y, would officials agree to choose the higher value?"  
     - If yes → Proceed.  
     - If no → Stop. *Rationale: The metric doesn’t capture the goal.*  
  **Stopping Condition**: Stop if metric doesn’t fully resolve the decision.  
  **Judgment Call?** Judgment.  

  ---

  ### Evaluation of Proposals  
  **Key**: ✗ = Stop, ✓ = Proceed  

  #### Proposal 1: Bus Route Conversion  
  - **Step 0**: ✓ (Branches: Convert routes vs. status quo).  
  - **Step 1**: ✗ *Stopping Condition*.  
    - Conflict: Transit (boardings) vs. Equity (rider-minutes).  
    - Outcome: Boardings favors ridership volume; rider-minutes favors convenience. Elected officials must resolve.  
  - **Result**: Stop. Hand to council to choose metric.  

  #### Proposal 2: Waste Hauler Contract  
  - **Step 0**: ✓ (Exclusive contract vs. competitive bids).  
  - **Step 1**: ✓ (Metric: "Cost per ton collected" + "service complaints"; composite index accepted).  
  - **Step 2**: ✓ (Adoption verifiable by contract execution).  
  - **Step 3**: ✓ (Liquidity feasible).  
  - **Step 4**: ✗ *Stopping Condition*.  
    - High-risk traders: Bidders have insider knowledge and financial stakes.  
    - Risk >30%; caps insufficient (stakes too high).  
  - **Result**: Stop. Unmanageable conflict of interest.  

  #### Proposal 3: Overnight Shelter (Flagship)  
  - **Step 0**: ✓ (Open shelter vs. status quo).  
  - **Step 1**: ✗ *Stopping Condition*.  
    - Metric: Property values within 0.5 miles.  
    - Problem: Elected officials’ goal is likely "reduce homelessness," not "property values." Property values are a weak proxy (confounded by market trends, insensitive to shelter impact).  
  - **Step 6**: ✗ *Confirmatory Stop*.  
    - If shelter raised property values but increased crime, would officials still adopt? Unclear.  
  - **Result**: Stop. Metric fails Step 1 and Step 6. **Flagship killed**.  

  ---

  ### Limits and Risks  
  **Systematic Failures**:  
  1. **Value-Proxy Gaps**: Markets fail if the metric doesn’t fully capture societal values (e.g., property values vs. homelessness impact).  
  2. **Long-Term Decisions**: Irreversible policies (e.g., 10-year contracts) risk locking in errors; traders discount long-term outcomes.  
  3. **Small Populations**: Policies affecting <1,000 people lack data for reliable prediction.  
  4. **Context-Dependent Outcomes**: Policies with effects contingent on external factors (e.g., economy, weather) introduce noise.  

  **Bad Outcomes Look Like**:  
  - A policy chosen by the market that "wins" on the metric but harms unmeasured values (e.g., shelter raises property values but increases crime).  
  - Manipulation by insiders (e.g., a waste hauler bets against their own bid to sabotage competition).  

  **Month 6 Pilot Warning Signs**:  
  1. **Liquidity Collapse**: Bid-ask spreads >15% in live markets.  
  2. **Trader Homogeneity**: >70% of trades from city employees/bidders.  
  3. **Metric Distortion**: Departments "gaming" proposals to fit eligible metrics.  
  4. **Board Delays**: >50% of proposals stuck at Step 1 (council indecision on metrics).  

  **Final Note**: This is not a rubber stamp. Three proposals entered; all three stopped. The procedure prioritizes evidence over enthusiasm.
