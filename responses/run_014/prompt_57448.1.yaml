  ### Notes on Unreproducible Element  
  The game cannot replicate the *phenomenology of doubt* inherent in assertion dilemmas (e.g., the psychological weight of asserting "Ticket 0001 loses" when failure means catastrophe). Students might intellectually grasp the statistics but not viscerally feel the risk. In debrief, you must bridge this gap:  
  *"Imagine a surgeon saying, 'I know this surgery works 99% of the time' to a patient. The gap between statistical confidence and lived certainty is where norms of assertion live. Rules try to codify this gap—but can they?"*
