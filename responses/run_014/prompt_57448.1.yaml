  ### Activity Plan: Assertion Under Scrutiny

  **Setup**  
  Arrange movable tables into six clusters. Assign students to groups of three. Each group receives a pack containing:  
  - One set of role cards (Speaker, Hearer 1, Hearer 2)  
  - One set of action tokens (green "Adopt", red "Reject")  
  - One blame token (a red counter)  
  - One stakes dial card (showing 🌢 for low, ⚡ for high)  
  - Printable rules sheet (double-sided A4)  

  Facilitator holds the card deck and truth ledger (hidden world state). Briefly explain:  
  *"You'll face scenarios where a Speaker must decide whether to assert a claim. Hearers act on that claim. Your choices affect scores in three ways: outcome success, Speaker's evidence-handling, and whether the group blames the Speaker. Stakes (🌢/⚡) show how much the outcome matters."*  

  **Materials**  
  - **Printable A4 Sheet** (double-sided):  
    - *Side 1*: Rules and scoring.  
    - *Side 2*: Scenario examples (non-playable).  
  - **Index Cards** (24): 4 scenarios × 2 stakes levels × 3 truth variants (see table).  
  - **Counters**: 12 green (Adopt), 12 red (Reject), 6 red blame tokens.  
  - **Role Cards**: 6 × Speaker, 12 × Hearer.  
  - **Stakes Dial Cards**: 6 cards showing 🌢 (low) and ⚡ (high).  

  **Roles**  
  - **Speaker**: Reads scenario card, decides whether to assert the proposition aloud.  
  - **Hearers**: Decide jointly to Adopt/Reject the proposition if asserted; if unasserted, they take the default action (🌢: no penalty; ⚡: -5).  
  - **All three** jointly assign blame after truth revelation.  

  **Round Sequence** (100 minutes total)  
  1. **Setup & Rules** (10 mins): Distribute materials. Explain roles, scoring streams, and stakes dial.  
  2. **Round 1: Lottery Scenario** ⚡ (High Stakes) (20 mins):  
     - *0-5 mins*: Groups read Card 1 (all groups same card). Speaker decides to assert or not.  
     - *5-10 mins*: Hearers act (Adopt/Reject or default).  
     - *10-15 mins*: Facilitator reveals truth (ticket loses). Groups record outcome score.  
     - *15-20 mins*: Group discusses and assigns blame (hand blame token to Speaker if deemed at fault).  
  3. **Round 2: Lottery Scenario** 🌢 (Low Stakes) (15 mins):  
     - Repeat Round 1 with Card 2 (same proposition/evidence, stakes dial set to 🌢).  
  4. **Round 3: Medical Hunch Scenario** ⚡ (High Stakes) (20 mins):  
     - Groups 1-3 receive Card 3 (true hunch); Groups 4-6 receive Card 4 (false hunch).  
     - Same procedure: Assert → Act → Reveal truth → Blame.  
  5. **Round 4: Fake Barn Scenario** ⚡ (High Stakes) (20 mins):  
     - All groups receive Card 5. Same procedure.  
  6. **Scoring & Debrief** (15 mins): Groups tally scores. Facilitator-led discussion.  

  **Scoring**  
  - **Stream 1: Outcome Success** (Hearers' truth-conduciveness):  
    - Adopt + true: +10 (⚡), +2 (🌢)  
    - Adopt + false: -10 (⚡), -2 (🌢)  
    - Reject + true: -10 (⚡), -2 (🌢)  
    - Reject + false: +10 (⚡), +2 (🌢)  
    - Default (no assertion): 0 (🌢), -5 (⚡)  
  - **Stream 2: Speaker’s Evidence-Handling** (Epistemic diligence):  
    - Strong evidence (e.g., lottery, fake barn): +3  
    - Weak evidence (e.g., hunch): +1  
    (Awarded regardless of assertion/blame)  
  - **Stream 3: Blame Allocation**:  
    - Blame token given to Speaker: -2 (group score)  
    - No blame: 0  

  **Debrief**  
  - **Phase 1 (5 mins)**: Groups share scores. Ask: *"When did high stakes change your Speaker’s willingness to assert?"*  
  - **Phase 2 (10 mins)**: Pose:  
    1. *"Should Speakers assert claims they can't guarantee are true? When does caution help or harm?"*  
    2. *"Can a 'blameless' assertion still be improper? Did groups blame Speakers for bad outcomes even with good evidence?"*  
    3. *"If a rule forbids asserting things you don’t 'know', but you can’t be sure what you know, is it a useful rule?"*  
  - Surface vocabulary: Replace "warrant cards" with *justification*, "tribunal’s rule" with *norms of assertion*, "credibility chits" with *epistemic diligence*.  

  **Predictable Failures**  
  - **Law students fixate on admissibility**: They may treat assertion as a courtroom testimony. *Fix*: Remind them this is about "everyday propriety, not legal rules."  
  - **Gaming hidden truths**: Students might infer patterns (e.g., "lottery always loses"). *Fix*: Use diverse scenarios and preempt: "Truths are randomised per card; no pattern exists."  
  - **Hearers ignore assertion**: Some may reject well-supported claims. *Fix*: Emphasise: "Hearers must act *only* on the assertion if made; no external knowledge."  

  ---

  ### Card Deck Table  

  | Card ID | Proposition asserted          | What the asserter has (evidence package)                              | Stakes | Hidden truth | Belief rule? | Justified-belief rule? | Knowledge rule? | Truth rule? | Where rules diverge (one sentence)                                                                 |
  |---------|-------------------------------|-----------------------------------------------------------------------|--------|--------------|--------------|------------------------|-----------------|-------------|----------------------------------------------------------------------------------------------------|
  | 1      | Ticket 0001 will not win.     | 10,000 tickets; one winner; you hold ticket 0001.                    | ⚡ High | True         | Yes          | Yes                    | No              | Yes         | Knowledge rule forbids asserting statistical probabilities as certainties, others permit.          |
  | 2      | Ticket 0001 will not win.     | Identical to Card 1.                                                 | 🌢 Low  | True         | Yes          | Yes                    | No              | Yes         | Same as Card 1, but stakes dial down the cost of not asserting.                                    |
  | 3      | Patient has Condition X.      | A strong hunch (no tests or symptoms).                               | ⚡ High | True         | Yes          | No                     | No              | Yes         | Truth rule permits lucky guesses; others require evidence.                                         |
  | 4      | Patient has Condition X.      | Identical to Card 3.                                                 | ⚡ High | False        | Yes          | No                     | No              | No          | Truth rule forbids falsehoods; belief rule allows sincere errors; justification/knowledge forbid.  |
  | 5      | That structure is a barn.     | Visual inspection (looks like a barn); unaware of "Fake Barn County".| ⚡ High | True         | Yes          | Yes                    | No              | Yes         | Knowledge rule forbids assertions in deceptive environments; others permit.                        |

