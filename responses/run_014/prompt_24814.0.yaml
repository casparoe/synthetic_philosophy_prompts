prompt: |-
  Longtime LessWrong reader here. In a thread about wheter to vote tactically in a 3-candidate race, someone kept repeating 'Gibbard--Satterthwaite proves no voting system is strategy proof, so tactical voting is pointless, just vote sincerely' as if that one line settled the whole debate. I've read the theorem enough times to know the sentence is doing way more work than the result actually does, but I can't cleanly seperate the readings. Could you lay out the different precise claims that 'no voting system is strategy proof' (or 'you can always game the vote') could be making — varying the quantifiers (every rule? every preference profile? every voter, or just some voter?), the standing assumptions (unrestricted domain, Pareto efficiency, non-dictatorship), what counts as 'gaming' (strictly better outcome vs. merely a different one), and the gap between an existence claim and the practical question of whether I should vote tactically in a specific election I'm actually in? For each reading, say whether it's a trivial platitude, a substantive true claim, or actually false, and give a counterexample for the false ones. Then tell me which reading the forum poster was most likely invoking, and whether that reading actually supports their conclusion that I should just vote sincerely. Think very carefully before answering; respond in the style of an expert in social choice theory who is allergic to sloppy quantifier use. Don't just restate the theorem — the disambiguation is the whole point.
reasoning: |-
  Okay, the user is a Longtime LessWrong reader, so they're familiar with rationalist discourse and technical concepts. They're dealing with someone on a forum who's oversimplifying the Gibbard-Satterthwaite theorem to shut down discussion about tactical voting. The user understands the theorem superficially but wants a precise breakdown to counter this oversimplification.

  Hmm, the core issue here is quantifier ambiguity. The phrase "no voting system is strategy-proof" is being thrown around as if it's universally applicable, but the theorem has very specific conditions. The user needs ammunition to show that the theorem doesn't automatically make tactical voting pointless in practice.

  First, I need to dissect every possible interpretation of "strategy-proof." Let me consider: 
  - Scope of voting systems (all systems? only ranked ones?)
  - Quantifier over preference profiles (for all profiles? or just some?)
  - Who can strategize (all voters? at least one?)
  - What constitutes "gaming" (strict improvement or just change?)
  - The gap between theoretical possibility and practical incentive

  The user's opponent is probably invoking Interpretation 5 (some system/profile/voter can benefit), which is technically true but practically useless. But in real elections, many factors make sincere voting optimal: your ballot might be pivotal, you might misjudge others' preferences, or the system might have robustness like approval voting.

  Ah! The critical point is about pivotal probability. If the chance of your vote changing the outcome is near zero (like in large elections), then even if manipulation is theoretically possible, the expected utility gain is negligible. Meanwhile, misestimating others' preferences could backfire. 

  Also worth noting: some systems like approval voting are strategy-proof in the weak sense if voters have dichotomous preferences. And the theorem assumes unrestricted domain - real voters often have single-peaked preferences where majority rule becomes strategy-proof.

  The conclusion should emphasize that GS theorem is about logical possibility, not practical advice. For their specific election, the user should consider: electorate size, polling data, voting system mechanics, and their own risk tolerance. Blanket "always vote sincerely" is as reductive as "always manipulate."
answer: |-
  Let's dissect the quantifier soup with surgical precision. The Gibbard-Satterthwaite (GS) theorem is often misapplied as a conversation-ender, but its implications are highly sensitive to how we phrase the claim. Below is a systematic disambiguation, evaluating each interpretation's truth value and relevance to tactical voting advice. (Assumptions: ≥3 candidates, ≥1 voter, deterministic voting rules mapping preference profiles to winners.)

  ### Disambiguation of "No voting system is strategy-proof" / "You can always game the vote"

  1. **Interpretation 1: "For every voting system, every voter, and every preference profile, that voter can get a strictly better outcome by misreporting."**  
     - **Truth Value**: **False.**  
     - **Counterexample**: Under Plurality voting, if a voter's sincere favorite is polling at 40% (leading) and their second choice at 30%, voting sincerely is strictly dominant—no gain from defection.  
     - **Why Misleading?**: Requires universal quantification over all voters and profiles. Most systems have "safe" profiles where no voter can manipulate.

  2. **Interpretation 2: "For every voting system, there exists some preference profile where at least one voter can get a strictly better outcome by misreporting."**  
     - **Truth Value**: **True, but vacuous under GS assumptions.**  
     - **Support**: GS proves this *only* for voting rules satisfying:  
       - Unrestricted Domain (any preference ordering allowed),  
       - Non-Dictatorship,  
       - Pareto Efficiency (if everyone prefers A > B, B can't win).  
     - **Counterexample if assumptions dropped**: Random Dictatorship (random voter picks winner) is strategy-proof but dictatorial. Majority Judgment (cardinal scores) escapes GS by violating unrestricted domain.  
     - **Practical Relevance**: Low. A single pathological profile doesn't imply manipulability in *your specific election*.

  3. **Interpretation 3: "For every voting system and every preference profile, there exists at least one voter who can get a strictly better outcome by misreporting."**  
     - **Truth Value**: **False.**  
     - **Counterexample**: In Approval Voting with sincere voters all approving only their top choice, no voter can benefit by approving additional candidates if they prefer their top choice alone.  
     - **Why It Matters**: GS doesn't claim omnipresent manipulation—it allows for "honest" profiles.

  4. **Interpretation 4: "For every voting system, there exists some voter and some preference profile where that voter can get a strictly better outcome."**  
     - **Truth Value**: **True, and nontrivial** (core of GS theorem).  
     - **Scope**: Only holds for nondictatorial, Pareto-efficient rules with unrestricted domain (e.g., Condorcet methods, IRV, Plurality).  
     - **Gap to Practice**: An *existential* claim—it doesn't specify *which* profiles or voters. Your election may not be one of them.

  5. **Interpretation 5 (Common Oversimplification): "For every voting system, every voter can always get a better outcome by misreporting, in every election."**  
     - **Truth Value**: **False.** See #1 and #3.  
     - **Perpetuated Myth**: This is likely what the forum poster invoked. It overstates GS by implying universal manipulability.

  ---

  ### The Gap Between Theory and Tactical Voting Advice
  Even if a system is manipulable *somewhere*, **your decision to vote tactically depends on**:  
  - **Pivotal Probability**: The likelihood your ballot changes the outcome. In large electorates, this is astronomically low.  
  - **Information Requirements**: Tactical voting assumes precise knowledge of others' preferences. Misjudgment can backfire (e.g., "Nader effect" in Plurality).  
  - **System-Specific Mechanics**:  
    - In Approval Voting, sincere voting is often optimal under uncertainty.  
    - In IRV, manipulation strategies are complex and risky.  
  - **Normative Costs**: Misreporting preferences may violate expressive or ethical values.

  ---

  ### Which Reading Was Invoked and Does It Support "Vote Sincerely"?
  - **Likely Invoked**: Interpretation #5 (universal, unconditional manipulability).  
  - **Why It Fails as Argument**:  
    1. **Quantifier Error**: GS proves an existential claim (#4), not universal (#5).  
    2. **Ignored Constraints**: GS assumes unrestricted domain, but real preferences are often single-peaked (e.g., left-right spectrum), making systems like Majority Rule strategy-proof.  
    3. **Practical Irrelevance**: Proving *some* profile is manipulable doesn't imply *your* profile is manipulable *for you* in *this* election.  
    4. **Risk of Error**: Sincere voting is dominant when the pivotal probability is near zero or information is imperfect.  

  **Conclusion**: The forum poster's inference ("GS → always vote sincerely") is **non sequitur**. GS proves that no "ideal" system exists, but it doesn't dictate strategy in finite elections. In many real-world cases (large electorate, low information), sincere voting *is* the robust Bayesian choice. To advise tactical voting, one must demonstrate that:  
  - The voter is pivotal with non-negligible probability,  
  - A beneficial manipulation exists *given current polling data*,  
  - The voter can reliably execute this strategy.  
  Absent these, "vote sincerely" remains sound pragmatism—not because GS demands it, but because game theory often does.  

  *Final note: If your voting rule is Borda or Plurality in a polarized election, tactical voting may be rational. Run the numbers before discarding sincerity.*
