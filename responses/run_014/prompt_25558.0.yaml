prompt: |-
  I'm a PhD student in decision theory, and I've become convinced that the correct response to counterfactual mugging scenarios is to pay up — that is, one should act on the basis of what one would have done in a counterfactual branch, even when the causal consequences of paying are strictly negative in the actual branch. The standard case: a highly reliable predictor tells you it flipped a fair coin. Had the coin come up heads, the predictor would have given you a large reward if and only if you would pay it a smaller sum had the coin come up tails. The coin came up tails. The predictor asks for the smaller sum. On my view, you should pay, and the same reasoning extends to XOR blackmail and related cases.

  I want to know what would count against this position. Not just the standard causal decision theorist's objection — I know that one — but a systematic map of the position's exposure. What empirical findings, formal results, or further thought experiments would undermine it? For instance: at what level of predictor reliability does the obligation to pay disappear, and does the view give a principled answer or does it turn on vague intuitions about stakes and probabilities? Does the view collapse into requiring one to pay in Pascal's mugging, or can it draw a stable line? Are there results in logic or computability — say, about the impossibility of a predictor that reasons about your decision procedure while running it — that would make the whole setup incoherent? What would a defender of the position concede as a genuine cost, and what would they dismiss as question-begging? I'd like the defeaters ranked from fatal to merely awkward, and an honest assessment of whether the position has been qualified into unfalsifiability — and if so, whether that's a problem for a normative view of this kind.
reasoning: |-
  Okay, let me unpack this PhD student's query. They're deep in decision theory, specifically advocating for paying in counterfactual mugging scenarios—a position that goes against standard causal decision theory (CDT). They want to know what could undermine their view, beyond the obvious CDT objection. 

  First, I need to map their position clearly. They argue you should pay the mugger in the tails scenario because your decision affects the counterfactual head outcome. The core tension is between causal consequences (paying loses money in actual world) and acausal influence (reward in counterfactual branch). 

  Now, the student is asking for systematic weaknesses. Not just "CDT disagrees," but existential threats to the coherence of their position. They mention predictor reliability thresholds, Pascal's Mugging slippery slopes, and computability limits. Also, they want to know if their view is unfalsifiable—and whether that's acceptable for normative theories.

  Hmm, the key challenges seem to fall into categories:  
  - **Predictor reliability**: At what failure rate does paying become irrational? Their view likely requires high but imperfect reliability, but how high? If they say "it depends on stakes," that feels ad hoc.  
  - **Pascal's Mugging**: If tiny probabilities of huge payoffs justify paying, does their logic demand paying any mugger claiming cosmic stakes? Avoiding this might force arbitrary thresholds.  
  - **Computability**: Can a predictor simulate your decision process while you're deciding? Logical paradoxes (like Halting Problem analogs) might make the setup impossible.  
  - **Self-referential traps**: What if paying changes the predictor's past simulation? (Like a "psychedelic rock" scenario where your decision retroactively corrupts the prediction.)  
  - **Normative costs**: Does rejecting CDT require abandoning *all* causal intuitions? E.g., should you avoid saving a drowning child if a predictor might have rewarded inaction elsewhere?  

  The student also wants concessions—what a defender would admit as real costs vs. dismiss as begging the question. For example:  
  - *Concede*: Handling unreliable predictors is messy.  
  - *Dismiss*: "CDT says no" isn't an argument; it assumes CDT is correct.  

  Lastly, the unfalsifiability worry: If they can always adjust auxiliary assumptions (like predictor reliability requirements), does the theory become vacuous? For normative views, that might be tolerable if it still guides ideal cases, but it weakens practical applicability.  

  I should structure the weaknesses by fatality:  
  1. **Fatal**: Computability limits showing predictors are impossible. (If predictors can't exist, the dilemma dissolves.)  
  2. **Severe**: Slippery slopes to Pascal's Mugging or infinite regress.  
  3. **Awkward**: Reliability thresholds relying on vague stakes/probability trade-offs.  

  The student seems rigorous—they're preempting objections. Their meta-question about unfalsifiability is sharp. I’ll need to argue that normative theories can survive some unfalsifiability if they systematize intuitions better than rivals, but operationalizability matters.
answer: |-
  Your position—rooted in functional decision theory (FDT), updatelessness, or logical counterfactuals—faces profound challenges beyond causal decision theory (CDT). Below, I systematically map defeaters, ranked by severity (fatal → awkward), with assessments of whether they undermine the coherence, applicability, or normative appeal of your view. I distinguish empirical, formal, and conceptual problems, and note where defenders might concede costs or dismiss objections.

  ---

  ### **1. Fatal Defeaters: Coherence and Impossibility**
  #### **a. Predictor Impossibility (Formal/Computability)**
     - **Problem**: If the predictor must simulate *your exact decision process* while you’re deciding, this creates a *recursive self-reference* paradox. Formal results (e.g., from **computability theory**) show this is impossible in general:
       - Analogous to the **Halting Problem**: A predictor simulating your brain/algorithm during its execution cannot output a definite prediction if your decision depends on its output (e.g., "If I predict you pay, you don’t; if I predict you don’t, you pay").
       - **Result**: For agents with sufficient complexity (e.g., capable of understanding the prediction), a perfect predictor cannot exist. Real predictors must be approximations (e.g., simulating simplified models), introducing reliability thresholds.
     - **Undermines**: The *very setup* of counterfactual mugging. If predictors are impossible, your "correct response" lacks a real-world anchor.
     - **Defender Response**: Concede that *perfect* predictors are impossible but argue that *high-fidelity* predictors (e.g., simulating your past self) suffice. However, this retreats to empirical reliability debates (see §2).

  #### **b. Logical Counterfactual Collapse**
     - **Problem**: In **XOR Blackmail** or **Newcomb’s Paradox with multiple agents**, your view might require *inconsistent* actions. Example:
       - Two agents (A and B) face a joint XOR Blackmail: A pays iff B doesn’t, and vice versa. The blackmailer rewards both only if they coordinate. Your theory demands each act "as if" their choice controls the counterfactual, but their optimal moves conflict.
     - **Result**: **No consistent equilibrium** exists without causal coupling. This violates the **principle of rational compatibility** (rational agents shouldn’t be forced into mutual frustration).
     - **Undermines**: The universality of your view. It fails in multi-agent settings without causal links.
     - **Defender Response**: Dismiss as a "toy problem" with no real-world analog. Concede that acausal coordination requires shared knowledge of rationality—a fragile assumption.

  ---

  ### **2. Severe Defeaters: Empirical and Practical Applicability**
  #### **a. Predictor Reliability Thresholds**
     - **Problem**: Your view requires paying iff the predictor’s reliability \( r \) exceeds a threshold \( r^* \). But:
       - **No principled threshold**: Is \( r^* = 0.99? \) \( 0.51? \) CDT easily handles low \( r \) (never pay). Your view must justify \( r^* \) relative to stakes (e.g., loss \( L \) vs. gain \( G \)):
         - Pay if \( r \cdot G > (1 - r) \cdot L \). But if \( G \) is counterfactual, how do we *empirically* measure \( r \) for acausal influence?
       - **Empirical vulnerability**: Experiments could show humans lose money under your strategy when \( r < r^* \). If \( r^* \) is vague, your view is unfalsifiable.
     - **Undermines**: Practical relevance. Real predictors (e.g., AI, psychological heuristics) are imperfect; your strategy could be exploitable.
     - **Defender Concession**: Thresholds *are* stakes-dependent (e.g., pay if \( r > L/(L + G) \)). But this assumes known \( G \), which is counterfactual and unobservable.

  #### **b. Slippery Slope to Pascal’s Mugging**
     - **Problem**: If you pay because a counterfactual branch *might* exist, why not pay a **Pascal’s Mugger** who claims: *"If you pay me $5, a simulation of you in another universe gets $10⁶⁰"?*
       - Your view lacks a **probability discounting mechanism**: The mugger’s claim has near-zero credibility, but your logic ("act as if the counterfactual is real") ignores this.
       - **Result**: You could be exploited by any agent making extravagant counterfactual claims.
     - **Undermines**: Instrumental rationality. Your view collapses into **fanaticism** (infinite stakes dominate finite probabilities).
     - **Defender Response**: Insist counterfactuals must be **predictor-verified**. But if predictors are fallible, this doesn’t resolve the exploit risk.

  ---

  ### **3. Awkward Defeaters: Normative Costs and Intuitions**
  #### **a. CDT Alignment in Non-Predictive Worlds**
     - **Problem**: In worlds without predictors (or with \( r \approx 0 \)), your view might still prescribe paying "as if" a predictor exists. But:
       - **Empirical cost**: Agents lose money with no counterfactual gain.
       - **Normative cost**: Violates **causal dominance** (if action A causes worse outcomes than B in *all* epistemically possible worlds, don’t choose A).
     - **Defender Response**: Dismiss as question-begging—it assumes CDT’s correctness. Concede that in predictor-less worlds, FDT reduces to CDT. But this demands agents *detect predictors*, which is often impossible.

  #### **b. Temporal and Anthropic Paradoxes**
     - **Problem**: In **"Psychadelic Rock"** (Wei Dai’s thought experiment):
       - A predictor simulates you on *drugs* that alter rationality. If it predicts "pay," it drugs you to change your decision. Paying "as if" counterfactuals matter leads to self-defeating choices.
     - **Result**: Your view can demand actions that **cause predictors to mischaracterize you**. This fractures the "logical identity" between you and your simulation.
     - **Defender Response**: Reject the setup as incoherent (a "true" predictor wouldn’t simulate distorted versions). But this seems ad hoc.

  ---

  ### **Assessment: Is the Position Unfalsifiable?**
  - **Risk**: Yes, if defenders retreat to **idealizations** (perfect predictors, rational agents, known stakes). For example:
    - If experiments show losses, argue the predictor wasn’t "sufficiently reliable."
    - If multi-agent cases fail, claim they require "tighter logical coupling."
  - **Is this fatal for a normative view?** Not necessarily. Normative theories (e.g., utilitarianism) often idealize. But it **weakens applicability**:
    - **Cost**: Your view becomes prescriptive only for **edge cases** (near-perfect predictors, high-stakes counterfactuals). In real decisions, CDT or EDT (evidential) may dominate.
    - **Defense**: Argue that *all* decision theories idealize (CDT ignores logical ties; EDT ignores causality). What matters is which idealization best **systematizes intuitions**.

  ---

  ### **Conclusion: Ranked Defeaters**
  | Rank | Defeater                          | Severity     | Key Vulnerability                     |
  |------|------------------------------------|--------------|---------------------------------------|
  | 1    | Predictor Impossibility           | **Fatal**    | Setup incoherent without perfect predictors. |
  | 2    | Slippery Slope to Pascal’s Mugging| **Severe**   | Exploitability; fanaticism.           |
  | 3    | Predictor Reliability Thresholds  | **Severe**   | Unfalsifiable thresholds; empirical losses. |
  | 4    | Logical Inconsistency (e.g., XOR) | **Severe**   | Multi-agent failures.                 |
  | 5    | CDT Alignment in Non-Predictive Worlds | **Awkward** | Normative cost in realistic cases.    |
  | 6    | Temporal/Anthropic Paradoxes      | **Awkward**  | Edge-case contradictions.             |

  **Final Verdict**: Your position is **coherent but fragile**. It excels in idealized predictor-based problems but struggles with computability, multi-agent coordination, and real-world reliability. Its strength is upholding intuitions about "doing what's rational across branches"; its cost is potential fanaticism and unfalsifiable retreats. To harden it:  
  - **Formal work**: Define computable predictors (e.g., **logical induction**).  
  - **Empirical work**: Test reliability thresholds experimentally.  
  - **Normative work**: Justify why acausal duties override causal losses.  

  If you accept that normative theories can be *domain-specific* (e.g., FDT for cosmic predictors, CDT for everyday choices), your view survives—but as a niche tool, not a universal theory.
