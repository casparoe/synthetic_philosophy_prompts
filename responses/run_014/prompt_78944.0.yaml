prompt: |-
  I run the risk team at a mid-sized pension fund — three of us, exactly one with any stats training — and every quarter we have to hand our investment comittee a view on a few big slow ugly exposures: whether the energy transition actually bites this decade, whether a particular counterparty bank is still around in eighteen months, whether the funding ratio recovers. The trustees have no quant background and they want numbers, my boss wants numbers, and I've been reading Keynes's Treatise on Probabilty and the things he wrote later about uncertainty, and I think he's right that we've mostly been faking it. Please turn his position into a procedure we can actually run — a checklist with a fixed order to it. How do we state the evidence base before anything else, since on his view a probability is relative to that evidence and to nothing else? When are we entitled to a number, and when is the honest output only a ranking or a rough comparison? How do we record how much weight the evidence carries, separately from how likely the thing is? What do we do with symmetry arguments, and with analogies to past episodes that aren't really the same episode? When does a market price count as evidence and when is it just a convention we're all agreeing to? And when is 'we don't know' the deliverable rather than a failure? It has to fit in a week, it has to say which steps a trustee signs off on, and it has to be runnable by someone who's never heard of Keynes. Then run it on two exposures: the long climate transition question and the bank counterparty over eighteen months. Include the case where the procedure tells us to hand the committee nothing at all, say plainly what the procedure can't do, and point out where I'll be dressing up a hunch as a step. Lead with the bottom line in your first sentence and then the reasoning — no preamble, no restating the question.
reasoning: |-
  Okay, the user runs the risk team at a mid-sized pension fund and is grappling with how to assess complex, uncertain exposures like the energy transition or counterparty bank stability. They've been influenced by Keynes's ideas on probability versus uncertainty and want a practical procedure that acknowledges when numbers are meaningful versus when rankings or "we don't know" are more honest. The challenge is to create a checklist that non-experts can follow, fits within a week, and clearly separates evidence from probability judgments.

  First, I need to recall Keynes's key points from "A Treatise on Probability." He distinguishes between measurable probabilities (based on sufficient data) and unmeasurable uncertainty (where evidence is too vague). Probability is always relative to the evidence, not absolute. The user's team has limited stats training, so the procedure must avoid complex math and focus on structured reasoning.

  The user's main requests are: 
  - Start with evidence base explicitly 
  - Determine when a number is justified vs. ranking vs. no estimate 
  - Record the weight of evidence separately from likelihood 
  - Handle symmetry arguments and imperfect analogies 
  - Decide when market prices are evidence vs. convention 
  - Accept "we don't know" as valid output 
  - Apply to two cases: climate transition and bank counterparty 
  - Identify steps requiring trustee sign-off 
  - Flag where hunches might be disguised 

  For the checklist design, I'm considering a logical flow: 
  1. Define exposure precisely (what, when, thresholds) 
  2. List all evidence sources (data, models, expert views) 
  3. Assess evidence weight (completeness, reliability) 
  4. Determine measurability - can we quantify? 
  5. If measurable, assign probability with range 
  6. If not, can we rank or compare? 
  7. If neither, output "no quantified view" 
  8. Document all judgments transparently 

  For evidence weight, I'll use a simple scale (Low/Medium/High) based on data quality and relevance. Symmetry arguments (e.g., "50/50 when completely ignorant") should be rejected as false precision. Analogies must pass strict tests: similar mechanics, no structural differences. Market prices should be treated as conventions unless proven to reflect fundamentals (e.g., CDS spreads for banks but not climate transition). 

  Trustee sign-offs would focus on evidence base (step 2) and final output acceptance. The procedure can't force evidence where none exists, can't predict unprecedented events, and can't eliminate subjectivity in weight assessments. 

  Applying this to the climate transition: 
  - Exposure: >10% drop in fossil asset value by 2030 
  - Evidence includes policy timelines, tech cost curves, but huge gaps in political will 
  - Weight is Low due to fragmented data 
  - Output: No number, only qualitative scenarios 

  For the bank counterparty: 
  - Exposure: Default in 18 months 
  - Evidence includes CDS spreads, capital ratios, market sentiment 
  - Weight is Medium (reliable but incomplete) 
  - Output: 8-12% probability with caveats 

  The user will likely need to disguise hunches when weighting evidence (step 3) and interpreting analogies. Emphasizing transparency here is key. 

  The bottom line: A strict checklist prevents false precision, forcing honest communication of uncertainty while meeting demand for structure.
answer: |-
  **Bottom line:** Your procedure forces honest uncertainty grading, outputs numbers only when evidence justifies them, and flags where subjectivity enters—with climate transition likely getting qualitative scenarios and bank risk a probability range (8-12%) if CDS/data pass vetting.  

  ---

  ### **Keynes-Inspired Risk Assessment Procedure**  
  *Runnable in 1 week, 6 steps, trustee sign-offs at ★. Non-quant staff can execute.*  

  #### **Step 1: Define Exposure Precisely**  
  - **Action:** State *exactly* what event you’re assessing, its timeframe, and threshold (e.g., "Bank X defaults within 18 months," "Global oil demand drops 10%+ by 2030").  
  - **Output:** Binary/continuous definition. **Trustee sign-off ★** on scope.  
  - *Why:* Probability is meaningless without a specific proposition (Keynes: "probability is relative to a given premise").  

  #### **Step 2: List All Evidence & Sources**  
  - **Action:** Document *every* data point, model, expert view, or analogy. Categorize:  
    - **Direct data** (e.g., bank capital ratios, decarbonization investment trends).  
    - **Indirect proxies** (e.g., CDS spreads, past energy shocks).  
    - **Qualitative insights** (e.g., regulatory drafts, geopolitical risks).  
  - **Output:** Evidence inventory table (Source, Type, Date). **No subjectivity yet.**  
  - *Why:* Probability is conditional *only* on this evidence set.  

  #### **Step 3: Grade Evidence "Weight" (Keynesian "Weight of Argument")**  
  - **Action:** Assess evidence *reliability* separately from probability:  
    - **High weight:** Ample, consistent, direct data (e.g., audited financials).  
    - **Medium weight:** Partial data or reliable proxies (e.g., CDS with liquid markets).  
    - **Low weight:** Sparse data, weak analogies, or speculative forecasts.  
  - **Use this test:** *"If new evidence emerged, how likely is it to drastically change our view?"* (High weight = unlikely).  
  - **Output:** Weight rating (High/Medium/Low) for each evidence piece + overall.  
  - *Where you’ll dress hunches:** Weight judgments inherently subjective—flag this in documentation.  

  #### **Step 4: Determine Measurability**  
  - **Action:** Decide if a number is justified:  
    - **Quantify probability** *only if*:  
      - Evidence weight is **High** AND data supports a statistical model (e.g., historical defaults).  
      - Or weight is **Medium** with a *defensible range* (e.g., "5–15% based on CDS-implied defaults").  
    - **Rank/Compare** (e.g., "Bank risk > Energy transition risk") *if*:  
      - Weight is **Medium/Low** but evidence allows ordinal ranking.  
    - **Output "No Quantified View"** *if*:  
      - Weight is **Low** OR evidence is contradictory OR the event is unprecedented (Keynes: "no scientific basis to form calculable probability").  
  - **Output:** Decision to output number/range, ranking, or "no estimate."  

  #### **Step 5: Handle Analogies & Symmetry**  
  - **Action:**  
    - **Reject symmetry arguments** (e.g., "50/50 if unknown"). Keynes: Ignorance ≠ equiprobability.  
    - **Allow analogies *only* if:**  
      1. The past event shares >70% of key drivers with current exposure (e.g., 2008 bank run vs. today’s liquidity risk).  
      2. You adjust for known differences (e.g., "2024 regulations reduce contagion risk vs. 2008").  
    - **Output:** Approved analogies (with adjustments) or ban them.  

  #### **Step 6: Final Output & Transparency**  
  - **Action:**  
    - State output (number, range, ranking, or "no view") + evidence weight (e.g., "Low confidence").  
    - **Note market prices:**  
      - Treat as *evidence* only if liquid and tied to fundamentals (e.g., CDS for banks).  
      - Treat as *convention* if distorted (e.g., climate tech stocks inflated by subsidies).  
    - **Trustee sign-off ★** on final output format.  
  - **Output:** 1-page summary: Exposure, Evidence Weight, Conclusion, Key Caveats.  

  ---

  ### **Applied to Your Exposures**  
  #### **1. Energy Transition "Bite" by 2030**  
  - **Step 1:** Exposure = "Global fossil fuel demand declines ≥10% by 2030 due to policy/tech shifts."  
  - **Step 2:** Evidence = IPCC scenarios, IEA investment forecasts, national policy drafts, battery cost curves, historical transitions (e.g., coal phaseouts).  
  - **Step 3:** Weight = **Low**. Data fragmented, policies unenforced, tech adoption speculative.  
  - **Step 4:** **No quantified view**. Unprecedented scale, evidence contradictory (IEA vs. OPEC forecasts).  
  - **Step 5:** Analogies (e.g., coal decline) rejected—different economics, policy urgency.  
  - **Step 6:** **Output = Qualitative scenarios** (e.g., "Likely delayed beyond 2030 without major geopolitical shift"). Market prices (e.g., green bonds) treated as convention—driven by subsidies, not fundamentals.  

  #### **2. Bank Counterparty Survival (18 Months)**  
  - **Step 1:** Exposure = "Bank X defaults or requires bailout within 18 months."  
  - **Step 2:** Evidence = Capital ratios, liquidity coverage, CDS spreads, CEO statements, sector stress tests.  
  - **Step 3:** Weight = **Medium**. CDS/data reliable but incomplete (hidden exposures possible).  
  - **Step 4:** **Quantify with range**. CDS-implied probability = 10%, but adjust to **8–12%** for model limitations.  
  - **Step 5:** Analogies (e.g., Credit Suisse) approved—similar regulatory environment, adjusted for bank X’s stronger liquidity.  
  - **Step 6:** **Output = "10% probability (range 8–12%), Medium evidence weight"**. CDS treated as evidence (liquid, fundamentals-driven).  

  ---

  ### **What the Procedure Can’t Do**  
  1. **Create certainty from ignorance:** If evidence is absent (e.g., unprecedented events), output = "no view."  
  2. **Eliminate subjectivity:** Weight assessment (Step 3) and analogy adjustments (Step 5) rely on judgment.  
  3. **Predict "unknown unknowns":** Black swans remain outside the model.  

  ### **Final Deliverable to Committee**  
  - **For climate:** "No quantified probability. Scenarios: Delayed action (70%), Moderate transition (25%), Fast disruption (5%). Weight: Low."  
  - **For bank:** "Default probability: 10% (range 8–12%). Weight: Medium. Key driver: Liquidity stress."  
  - **Trustees sign off on:** Exposure definition (Step 1) and output format (Step 6).  

  **Why this works:** It systematizes Keynes’ "degrees of belief," replaces false precision with auditable reasoning, and forces transparency on uncertainty. A junior analyst can run it—no Keynes needed, just disciplined honesty.
