  Below is a decision procedure for your foundation, designed to handle moral uncertainty efficiently while respecting the constraints you outlined. It balances philosophical rigor with practicality, focusing on steps that can be executed mechanically and flagging unavoidable judgment calls. The procedure assumes a fixed budget and independent proposals.

  ---

  ### **Decision Procedure for Moral Uncertainty**
  **Time Requirement:** ≤4 hours for 20 proposals (averaging 12 minutes/proposal).  
  **Tools Needed:** Spreadsheet (e.g., Excel) or simple code.  
  **Key Principles:**  
  - **Theories as Board Views:** Limit theories to the board’s core perspectives (UE, DC, CL, FG). No additions to avoid ballooning.  
  - **Veto First:** Absolute constraints (lexical prohibitions) override other considerations.  
  - **Normalization:** Use range-based scaling (0–1) for commensurability.  
  - **Aggregation:** Average normalized scores as the default.  
  - **Fallback:** Return close/tied decisions or veto conflicts to the board.  

  #### **Step 1: Enumerate Theories (Judgment Call)**  
  - **Input:** Board’s moral views (UE, DC, CL, FG).  
  - **Process:**  
    1. Define each theory’s core principles:  
      - **UE (Utilitarian Economist):** Maximize aggregate welfare (human/animal).  
      - **DC (Devout Catholic):** Prioritize human dignity, common good, and absolute prohibitions (e.g., intrinsic evils).  
      - **CL (Contractualist Lawyer):** Permissible acts are those no one could reasonably reject.  
      - **FG (Future Generations Advocate):** Maximize long-term prospects (rights or welfare of future beings).  
    2. **Avoid ballooning:** Do not add sub-theories or new views. If a board member’s view is hybrid, assign it to the closest core theory.  
  - **Output:** Fixed list of 4 theories.  
  - **Time:** 10 minutes (one-time setup per board cycle).  

  #### **Step 2: Assign Scores and Vetoes (Judgment Call)**  
  - **Input:** Proposals + theories.  
  - **Process:**  
    1. **Per proposal-theory pair:**  
       - **Cardinal Score (if possible):** Estimate the proposal’s impact on a scale (e.g., −100 to +100). Use rough heuristics:  
         - UE/FG: Welfare gains (e.g., lives saved × quality).  
         - DC/CL: Binary thresholds (e.g., violates dignity? → negative score).  
       - **Ordinal Score (if cardinal intractable):** Rank proposals relative to others.  
       - **Veto (Lexical Constraint):** Assign if the proposal violates an absolute rule (e.g., DC on intentional killing). Veto = automatic rejection.  
    2. **Identify disagreements:** Theories "agree" only if their rankings align *and* their justifications imply similar robustness (e.g., both UE and FG favoring a vaccine due to lives saved). If justifications diverge fundamentally (e.g., UE supports cage-free farming for animal welfare, DC for "stewardship"), treat as fragile agreement.  
  - **Output:** Raw scores (or ranks) + veto flags per theory.  
  - **Time:** 5–10 minutes/proposal (judgment-heavy).  

  #### **Step 3: Resolve Vetoes (Mechanical)**  
  - **Input:** Veto flags.  
  - **Process:**  
    1. Reject any proposal with ≥1 veto.  
    2. **Exception:** If all vetoing theories approve an alternative with identical benefits, retain the non-vetoed version (rare; otherwise, rejection is final).  
  - **Output:** Filtered list of non-vetoed proposals.  
  - **Time:** 1 minute/proposal.  

  #### **Step 4: Normalize Scores (Mechanical)**  
  - **Input:** Non-vetoed proposals + raw scores.  
  - **Process:**  
    1. **Per theory:** Convert raw scores to 0–1 scale:  
       - Cardinal: `(score − min_score) / (max_score − min_score)` across all proposals.  
       - Ordinal: Assign 1.0 (best rank), 0.0 (worst), and interpolate linearly for intermediates.  
    2. **Incommensurability:** If theories lack common units (e.g., UE uses QALYs, CL uses "reasonableness"), normalization *is* the solution—it forces comparability via relative positioning.  
  - **Output:** Normalized scores (0–1) per proposal-theory pair.  
  - **Time:** 2 minutes/proposal (automated via spreadsheet).  

  #### **Step 5: Aggregate Scores (Mechanical)**  
  - **Input:** Normalized scores.  
  - **Process:**  
    - Calculate **average normalized score** per proposal.  
    - Why average? It:  
      1. Weights all theories equally (avoids bargaining complexities).  
      2. Is robust to ordinal data.  
      3. Outperforms majority rule in cases with >2 options.  
  - **Output:** Proposal rankings (highest average → best).  
  - **Time:** 1 minute/proposal (automated).  

  #### **Step 6: Finalize Decisions (Judgment Call)**  
  - **Input:** Rankings + average scores.  
  - **Process:**  
    1. **Auto-approve:** Fund top-ranked proposals until the budget is exhausted.  
    2. **Flag for board review if:**  
       - Scores differ by <0.1 (close call).  
       - Vetoes conflict (e.g., one theory vetoes A, another vetoes B).  
       - Normalization is unreliable (e.g., min=max for a theory).  
    3. **Do not second-guess:** The procedure’s output is final unless flagged.  
  - **Output:** Funding decisions + flagged proposals.  
  - **Time:** 2 minutes/proposal.  

  ---

  ### **Application to Your Cases**
  **Assumptions:**  
  - Theories: UE, DC, CL, FG.  
  - Baseline: "Do nothing" = score 0.  
  - Vetoes override all else.  

  #### **Case 1: Cage-Free Campaign (A) vs. Crisis Intervention (B)**  
  - **Background:** Theories agree A < B but for different reasons (UE: animal welfare; DC: human dignity).  
  - **Procedure:**  
    1. **Scores:**  
       - UE: A = 30 (moderate animal welfare gain), B = 100 (lives saved).  
       - DC: A = 40 (stewardship), B = 90 (human dignity).  
       - CL: A = 20 (no urgent need), B = 80 (prevent harm).  
       - FG: A = 10 (short-term), B = 50 (medium-term stability).  
       - **No vetoes.**  
    2. **Normalize:**  
       - UE: A = (30−30)/(100−30) = 0.0, B = 1.0.  
       - DC: A = (40−40)/(90−40) = 0.0, B = 1.0.  
       - CL: A = 0.0, B = 1.0.  
       - FG: A = 0.0, B = 1.0.  
    3. **Aggregate:** A = 0.0, B = 1.0.  
    4. **Decision:** Fund B. Agreement is treated as **robust** because normalization only considers rankings, not justifications.  
  - **Result:** Crisis intervention funded. No flag.  

  #### **Case 2: Wildlife Culling (C) vs. Baseline (D)**  
  - **Background:** C kills some animals to save others. UE/FG support; DC/CL veto.  
  - **Procedure:**  
    1. **Scores and Vetoes:**  
       - UE: C = 100 (net lives saved), D = 0 → **no veto.**  
       - DC: C = **VETO** (intentional killing).  
       - CL: C = **VETO** (unreasonable harm to individuals).  
       - FG: C = 80 (ecosystem stability), D = 0 → **no veto.**  
    2. **Veto Check:** C has 2 vetoes → **rejected.**  
    3. **Decision:** Only option is D (do nothing).  
    4. **Flag:** Veto conflict (C rejected, but UE/FG strongly support). Board must revisit if D is unacceptable.  
  - **Result:** Proposal rejected. Board review recommended.  

  #### **Case 3: Catastrophic Risk Reduction (E) vs. Baseline (F)**  
  - **Background:** E benefits future generations. UE/DC/FG support; CL skeptical (future people can’t be harmed now).  
  - **Procedure:**  
    1. **Scores:**  
       - UE: E = 100 (huge long-term welfare), F = 0.  
       - DC: E = 90 (stewardship), F = 0.  
       - CL: E = 10 (no obligation to non-existent people), F = 50 (status quo acceptable).  
       - FG: E = 100, F = 0.  
       - **No vetoes.**  
    2. **Normalize (CL: E=10, F=50 → min=10, max=50):**  
       - UE: E = 1.0, F = 0.0.  
       - DC: E = 1.0, F = 0.0.  
       - CL: E = (10−10)/(50−10) = 0.0, F = (50−10)/40 = 1.0.  
       - FG: E = 1.0, F = 0.0.  
    3. **Aggregate:** E = (1.0+1.0+0.0+1.0)/4 = 0.75, F = 0.25.  
    4. **Decision:** Fund E.  
    5. **Bias Check:** Your long-termist bias is **not shared** by the procedure—CL’s dissent is incorporated, but outweighed.  
  - **Result:** Fund catastrophic risk reduction. No flag.  

  ---

  ### **Critical Review**  
  - **Strengths:**  
    - Handles vetoes decisively.  
    - Normalization mitigates incommensurability.  
    - Averages preserve minority views (e.g., CL in Case 3).  
    - Fast (<4 hours/cycle).  
  - **Limitations:**  
    - **Judgment-heavy steps:** Score assignment (Step 2) is subjective but necessary. Mitigate by:  
      - Using historical board decisions to calibrate scores.  
      - Having the officer justify scores in writing.  
    - **Veto power:** One theory can sink a proposal (Case 2). Board may need an override rule (e.g., ¾ majority).  
    - **Normalization fragility:** Depends on proposal set. If all proposals are "bad," poor scores become 1.0.  
  - **When to Hand Back to Board:**  
    1. Close scores (<0.1 difference).  
    2. Veto conflicts (Case 2).  
    3. If new moral views emerge mid-cycle.  

  This procedure systematizes shouting matches into auditable steps, balances theories fairly, and flags irreconcilable disputes—while respecting your time constraints. Run it as-is, and refine based on board feedback.
