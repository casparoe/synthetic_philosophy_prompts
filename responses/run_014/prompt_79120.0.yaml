prompt: |-
  I chair a committee at my university that's meant to replace our annual research-output and teaching-quality numbers with a proper outcomes dashboard, and I keep having the same fight with the provosts office: they treat Goodhart's law as a slogan you nod at and then get on with it. I want to hand them a procedure instead. Write me an ordered checklist the committee can run on each proposed indicator before we adopt it — five or six tests, in order, with what counts as a clear fail on each and which failure mode that test is there to catch. Use the four-way split that's kicking around in the alignment literature (Garrabrant's, written up by Manheim) as the spine — the proxy degrading as you push on it, the tail behaving unlike the middle, the proxy being causally downstream of what you actually care about, and people gaming the number on purpose — not just the measure-becomes-target line. Mark which steps are genuine technical checks and which are really judgements about what kind of department we want to be, and say where a test is inconclusive and a person has to decide. Then run it on three candidates: publications weighted by journal prestige, mean student evaluation scores, and a peer classroom-observation scheme. At least one of them should come out fine by the procedure even though I won't like the answer, and tell me straight what the procedure can't settle. Two weeks, half the committee are humanists who distrust numbers, and the provost has to sign off. And be explicit about which bits here are settled among people who study measurement and gaming and which are genuinely contested — don't hand me one camp's line as the consensus.
reasoning: |-
  We are creating an ordered checklist for evaluating proposed indicators, based on the four failure modes from Garrabrant/Manheim:
   1. Proxy Degradation: When you optimize for the proxy, it becomes less correlated with the true goal.
   2. Tail Disagreement: The proxy behaves differently in the tails (extreme cases) than in the middle.
   3. Causal Downstream: The proxy is an effect, not a cause, of what we care about, so optimizing it doesn't necessarily improve the underlying reality.
   4. Active Gaming: People deliberately manipulate the measure without improving the underlying reality.

   We'll design five or six tests in order, with clear fail conditions and the failure mode they are meant to catch.

   Additionally, we note:
   - Which tests are technical checks and which require value judgments.
   - Where a test is inconclusive and requires human decision.

   Then we will run three candidate indicators through the checklist:
     A. Publications weighted by journal prestige
     B. Mean student evaluation scores
     C. Peer classroom-observation scheme

   We are to be explicit about which parts are settled and which are contested.

   Ordered Checklist:

   1. Test: Correlation Stability Check
      - What it checks: Proxy Degradation (Failure Mode 1)
      - How: Ask: "If we start to push hard on this indicator (i.e., optimize it), is there strong evidence that the correlation between the indicator and the true goal will weaken or reverse?"
      - Clear fail: Evidence from existing literature or our own data that in similar contexts, pushing on the indicator has led to degradation (e.g., the indicator becomes less correlated with the true goal).
      - Technical or Judgment? Mostly technical (relying on research and data) but requires judgment in interpreting the evidence.
      - Inconclusive if: There is no direct evidence and we have to rely on theoretical reasoning.

   2. Test: Tail Behavior Check
      - What it checks: Tail Disagreement (Failure Mode 2)
      - How: Ask: "In extreme cases (very high or very low values of the indicator), does the indicator still correlate with the true goal? Are there known cases where the indicator and the goal diverge in the tails?"
      - Clear fail: Evidence that in the tails, the indicator does not reflect the true goal (e.g., a department with top scores on the indicator but poor actual outcomes, or vice versa).
      - Technical or Judgment? Technical if data exists, but otherwise requires judgment (e.g., based on case studies or expert opinion).
      - Inconclusive if: We lack data on extreme cases.

   3. Test: Causal Direction Check
      - What it checks: Causal Downstream (Failure Mode 3)
      - How: Ask: "Is the indicator causally downstream of the true goal? That is, does improving the true goal cause the indicator to improve, or does improving the indicator cause the true goal to improve? Or are they both effects of a common cause?"
      - Clear fail: The indicator is clearly an effect (downstream) of the true goal and not a cause, and there is no evidence that manipulating the indicator leads to improvement in the true goal (it might be a symptom, not a lever).
      - Technical or Judgment? Both: requires understanding of causal mechanisms (technical) but also judgment about what we consider the true goal and the pathways.
      - Inconclusive if: The causal relationship is complex or bidirectional.

   4. Test: Gaming Vulnerability Check
      - What it checks: Active Gaming (Failure Mode 4)
      - How: Ask: "How easy is it to improve the indicator without improving the true goal? Are there known methods of gaming this indicator?"
      - Clear fail: There are well-documented, low-cost ways to manipulate the indicator without affecting the true goal (or even harming it).
      - Technical or Judgment? Technical (based on literature and past experience) but also requires judgment about what counts as "gaming" and what is acceptable effort.
      - Inconclusive if: No clear evidence but theoretical vulnerability.

   5. Test: Alignment with Institutional Values Check
      - What it checks: Whether the indicator aligns with the kind of department we want to be (this goes beyond the four failure modes and addresses the humanistic concern).
      - How: Ask: "Does this indicator promote behaviors and outcomes that are in line with our institutional mission and values? Could it incentivize actions that are contrary to our values?"
      - Clear fail: The indicator clearly incentivizes behavior that is against the institution's stated values (e.g., sacrificing deep learning for short-term scores, encouraging unethical research practices).
      - Technical or Judgment? Judgment: requires discussion about values and mission.

   6. Test: Feasibility and Cost Check
      - How: Ask: "Is the cost of collecting and maintaining this indicator (in time, money, and morale) justified by its benefits? Are there unintended negative consequences on morale or other activities?"
      - Clear fail: The cost is prohibitively high, or the indicator causes significant negative side effects (like high faculty burnout) that are not acceptable.
      - Technical or Judgment? Both: cost estimation is technical, but weighing costs vs benefits is a judgment.

   Now, note: The first four tests are directly from the four failure modes. The last two are added to address the broader context.

   We note that the first four tests are more settled in the measurement literature (though causal inference is always tricky). The last two are more about institutional values and practical constraints.

   Now, run the three candidates:

   Candidate A: Publications weighted by journal prestige (e.g., using impact factors or tiered journal lists)

   1. Correlation Stability Check:
      - Evidence: There is substantial evidence (e.g., in bibliometrics) that when journal impact factors are used as a target, researchers may engage in behaviors that do not necessarily lead to high-quality research (e.g., salami-slicing, chasing hot topics, avoiding high-risk/high-reward work). The correlation between journal prestige and paper quality is known to be imperfect and can degrade under pressure.
      - Clear fail? Yes. Fail.

   2. Tail Behavior Check:
      - Evidence: In the tails, it's known that some highly cited and influential papers appear in lower-tier journals, and some papers in top journals may have little impact. There are also field differences: a top journal in a small field may have lower impact than a mid-tier journal in a large field.
      - Clear fail? Yes, because in the extreme (very high journal prestige) the paper might not be the most impactful, and vice versa. Fail.

   3. Causal Direction Check:
      - Evidence: Journal prestige is assigned to a venue and is largely a result of the papers it publishes (which are in turn a result of the research quality). So research quality causes journal prestige (in the long run) but not directly for a given paper. However, targeting journal prestige does not necessarily cause research quality to improve; it might cause authors to aim for journals with high prestige without improving the science.
      - Clear fail? The indicator is downstream of the true goal (research quality) but also influenced by other factors. Moreover, manipulating the indicator (by submitting to high-prestige journals) doesn't guarantee better research. This is a fail because the causal link from the indicator to the true goal is weak.

   4. Gaming Vulnerability Check:
      - Evidence: There are known ways to game: targeting journals with high impact factors but low relevance to the field, self-citation rings, or even citation cartels. Also, authors might add honorary authors to increase the chance of acceptance in a high-prestige journal.
      - Clear fail? Yes. Well-documented gaming. Fail.

   5. Alignment with Institutional Values:
      - Judgment: If the institution values innovation, interdisciplinary work, or applied research that might not fit in top journals, then this indicator might discourage such work. It may also disadvantage fields where journal prestige is not the primary outlet (e.g., humanities, some engineering fields). Likely misaligned with a broad university mission. Fail.

   6. Feasibility and Cost:
      - Cost: Relatively low to collect (if using existing databases) but may have high morale cost if faculty feel their work is reduced to a number. Also, the debate over journal lists and field differences can be divisive.
      - Judgment: The cost in morale and potential division might be too high. Inconclusive, but leaning towards fail.

   Overall: Fails multiple tests.

   Candidate B: Mean student evaluation scores

   1. Correlation Stability Check:
      - Evidence: There is evidence that when evaluations are high-stakes, instructors may pander to students (e.g., by reducing workload, inflating grades) which can actually reduce learning. The correlation between student evaluations and learning outcomes is weak and sometimes negative (especially when controlling for grades and other factors). Also, biases (gender, race, etc.) are well-documented.
      - Clear fail? Yes. Fail.

   2. Tail Behavior Check:
      - Evidence: In the tails, very high evaluations might be achieved by instructors who are entertaining but not rigorous, and very low evaluations might occur for rigorous instructors who challenge students. Also, in small classes, one disgruntled student can skew the mean.
      - Clear fail? Yes, because the tails (especially the high end) do not necessarily reflect teaching quality. Fail.

   3. Causal Direction Check:
      - Evidence: Student evaluations are an outcome of the teaching and learning experience. However, they are influenced by many factors beyond teaching quality (e.g., course difficulty, student expectations, instructor charisma). There is little evidence that trying to improve evaluations (without improving teaching) leads to better learning. In fact, it might lead to lower standards.
      - Clear fail? The indicator is downstream of the true goal (learning) but also of many confounders. It is not a lever for improvement. Fail.

   4. Gaming Vulnerability Check:
      - Evidence: Gaming is easy: instructors can lower standards, give higher grades, avoid difficult topics, or even provide treats. There is ample documentation of these responses.
      - Clear fail? Yes. Fail.

   5. Alignment with Institutional Values:
      - Judgment: If the institution values rigor and deep learning, this indicator might push against that. It may also perpetuate biases (against women, minorities, etc.). Thus, it might conflict with values of equity and academic rigor. Fail.

   6. Feasibility and Cost:
      - Cost: Collecting evaluations is already done and low cost. However, the negative consequences (in terms of bias and reduced rigor) might be high.
      - Judgment: The low collection cost is outweighed by the risks. But the procedure might not fail on cost alone? However, the overall picture is negative.

   Overall: Fails multiple tests.

   Candidate C: Peer classroom-observation scheme

   Note: This typically involves trained peers observing classes and providing structured feedback. We are considering using the scores from such observations as an indicator.

   1. Correlation Stability Check:
      - Evidence: There is some evidence (though not as much as for the others) that peer observations can correlate with teaching quality, especially when done by well-trained peers. However, if made high-stakes, there is a risk that instructors might "perform" for the observation rather than teach naturally. The correlation might degrade if the observation is announced and the instructor prepares a "show" lesson.
      - Clear fail? Inconclusive. There isn't strong evidence of degradation, but it's a known risk. We might pass this test with caution, but note the risk.

   2. Tail Behavior Check:
      - Evidence: In the tails, it's less clear. An instructor might have one bad day during an observation but otherwise be excellent. Conversely, an instructor might prepare one excellent observed lesson but be otherwise poor. However, if the scheme involves multiple observations and trained observers, this risk might be mitigated.
      - Clear fail? Inconclusive. It depends on the design (number of observations, training). We might pass with the condition that the scheme must be robust (multiple observations, unannounced?).

   3. Causal Direction Check:
      - Evidence: Peer observation scores are intended to be a direct measure of teaching practices. Moreover, the process of peer observation (if formative) can cause improvement. However, the causal link from the score to teaching quality is not automatic. It requires that the feedback is acted upon. But as an indicator, the score itself is a proxy for teaching quality, and teaching quality causes the score. However, if the score is used for improvement, it might be part of a causal chain. 
      - Judgment: This test is about whether the indicator is downstream. It is, but it's also close to the actual teaching act. We might not fail this test because the indicator is not clearly downstream in a way that breaks the link. Instead, it's a direct measure. Pass.

   4. Gaming Vulnerability Check:
      - Evidence: Gaming is possible: an instructor might prepare a special lesson for the observation. However, if observations are frequent and unannounced, this becomes harder. Also, peers might be influenced by personal relationships. But with proper training and anonymization (if possible), this can be mitigated.
      - Clear fail? Not necessarily. It is vulnerable to one-off gaming, but the risk can be reduced by design. Pass with caution.

   5. Alignment with Institutional Values:
      - Judgment: Peer observation aligns with values of collegiality, continuous improvement, and professional respect. It encourages reflection and collaboration. It might be seen as more fair and less biased than student evaluations. This is a strong pass.

   6. Feasibility and Cost:
      - Cost: This is expensive in terms of faculty time (for both the observed and the observer). It requires training and coordination. However, if the institution values teaching quality and is willing to invest, it might be justified.
      - Judgment: This is a judgment call. The cost is non-trivial, but the benefits (improved teaching, alignment with values) might be worth it. Inconclusive: it depends on the resources.

   Overall: Passes most tests with some caveats. We note that the procedure cannot settle the cost-benefit trade-off (step 6) and the details of implementation (which might affect steps 1, 2, and 4). The committee must decide on the investment.

   What the procedure can't settle:
   - The cost-benefit trade-off (step 6) is inherently a judgment.
   - The exact design of the peer observation scheme (e.g., frequency, training, announced vs. unannounced) can affect the results of the tests. The procedure flags that without a good design, the indicator might be vulnerable, but it doesn't specify the design.

   Conclusion on the procedure:
   - The first four tests (based on the four failure modes) are grounded in the literature on Goodhart and metrics. They are relatively settled, though causal inference (step 3) is always challenging and requires careful thinking.
   - Steps 5 and 6 are about institutional values and practical constraints, which are not settled by the literature and require deliberation.

   We must note that even for peer observation, the procedure does not guarantee success. It only reduces the risk. And the provost must understand that no measure is perfect, but the procedure helps to avoid the worst pitfalls.

   Finally, we must present the procedure as a living document that can be refined as we learn more.

   Given the two-week timeline and the humanist committee members, we recommend:
     - Focusing on the values alignment (step 5) to engage the humanists.
     - Being transparent about the limitations and the need for judgment.
     - For the peer observation scheme, we note the caveats and the need for a well-designed implementation plan.

   We also note that the procedure might lead to the rejection of A and B, and conditional acceptance of C (with a good design). The provost might be disappointed that the easy metrics are rejected, but the procedure provides a reasoned basis.

   And we must be honest: the literature on peer observation is not as extensive as on student evaluations or publication metrics, so some of the evidence is weaker. But the procedure helps to structure the discussion.
answer: |-
  ### Ordered Checklist for Evaluating Indicators  
  Based on the four failure modes from Garrabrant/Manheim, plus two practical tests. **Bold** = critical fail.  
  **Settled consensus** in measurement literature is noted where it exists; causal steps are contested.  

  ---

  #### Checklist (Run in Order)  
  1. **Test: Degradation Under Pressure (Proxy Degradation)**  
     - **Check**: If we optimize this metric, will it decouple from the true goal?  
     - **Clear Fail**: Evidence that similar metrics became less correlated with true outcomes when incentivized (e.g., empirical studies showing divergence).  
     - **Failure Mode**: Proxy becomes target → proxy degrades.  
     - **Nature**: Technical (data/literature review).  
     - **Inconclusive?** Yes, if no prior data; requires judgment.  

  2. **Test: Tail Robustness (Tail Disagreement)**  
     - **Check**: Does the metric align with true outcomes in extreme cases (e.g., top/bottom 10%)?  
     - **Clear Fail**: Documented cases where metric extremes misrepresent reality (e.g., "outlier blindness").  
     - **Failure Mode**: Proxy behaves differently in tails vs. median.  
     - **Nature**: Technical (data analysis).  
     - **Inconclusive?** Yes, if tail data is scarce; committee judgment needed.  

  3. **Test: Causal Alignment (Causal Downstream)**  
     - **Check**: Is the metric causally *upstream* of the goal (i.e., improving it directly improves outcomes)?  
     - **Clear Fail**: Metric is a downstream *effect* (e.g., measuring symptoms, not causes) with no lever for improvement.  
     - **Failure Mode**: Proxy is a side effect, not a driver.  
     - **Nature**: Mixed. Technical (causal inference) but requires value judgments about "levers."  
     - **Contested**: Causal models are theoretically debated; relies on committee’s theory of change.  

  4. **Test: Gaming Resistance (Active Gaming)**  
     - **Check**: How easily can actors improve the metric *without* improving the underlying goal?  
     - **Clear Fail**: Low-cost/high-impact gaming tactics exist (e.g., manipulation, loopholes).  
     - **Failure Mode**: Deliberate distortion.  
     - **Nature**: Technical (gaming case studies).  
     - **Inconclusive?** No clear evidence → stress-test scenarios.  

  5. **Test: Values Congruence**  
     - **Check**: Does incentivizing this metric align with our institutional mission (e.g., equity, rigor, innovation)?  
     - **Clear Fail**: Metric encourages harmful trade-offs (e.g., sacrificing ethics for efficiency).  
     - **Nature**: Judgment (no technical test).  
     - **Inconclusive?** No—requires committee consensus on values.  

  6. **Test: Implementation Risk**  
     - **Check**: Can we afford the costs (time, money, morale)? Will it create perverse incentives?  
     - **Clear Fail**: High cost with low benefit, or incentivizes counterproductive behavior (e.g., competition over collaboration).  
     - **Nature**: Mixed. Cost estimation (technical) + incentive analysis (judgment).  

  ---

  ### Evaluation of Candidate Indicators  
  **Key**:  
  - ✅ = Passes test  
  - ⚠️ = Inconclusive/conditional pass  
  - **❌** = Clear fail  

  #### A. Publications Weighted by Journal Prestige  
  1. **Degradation Under Pressure**: **❌**  
     - *Why*: Extensive evidence (e.g., Ioannidis 2018) that incentivizing prestige metrics reduces risk-taking, inflates salami-slicing, and decouples from real-world impact.  
  2. **Tail Robustness**: **❌**  
     - *Why*: Prestige poorly correlates with impact in breakthrough work (e.g., Nobel-winning papers often in mid-tier journals).  
  3. **Causal Alignment**: ⚠️  
     - *Why*: Prestige is downstream of field-specific norms, not a lever for quality. But contested—some argue prestige incentivizes rigor.  
  4. **Gaming Resistance**: **❌**  
     - *Why*: Tactics exist: citation rings, honorary authorships, targeting low-impact/high-prestige journals.  
  5. **Values Congruence**: **❌**  
     - *Why*: Conflicts with equity (favors established fields) and innovation (punishes interdisciplinary work).  
  6. **Implementation Risk**: ⚠️  
     - *Why*: Low collection cost but high morale/equity costs.  
  **Verdict**: **Reject**—fails core tests.  

  #### B. Mean Student Evaluation Scores  
  1. **Degradation Under Pressure**: **❌**  
     - *Why*: Meta-analyses (e.g., Uttl et al. 2017) show correlation with learning drops when scores are incentivized; leads to grade inflation and reduced rigor.  
  2. **Tail Robustness**: **❌**  
     - *Why**: Scores are biased against women/POC in extreme highs/lows (Mengel et al. 2019).  
  3. **Causal Alignment**: **❌**  
     - *Why*: Scores are downstream of charisma/gender bias, not teaching quality. No causal link to learning.  
  4. **Gaming Resistance**: **❌**  
     - *Why*: Easy gaming: grade inflation, "entertaining" over rigorous teaching.  
  5. **Values Congruence**: **❌**  
     - *Why*: Amplifies biases; incentivizes popularity over intellectual challenge.  
  6. **Implementation Risk**: ✅  
     - *Why*: Cheap to collect, but high equity/rigor costs.  
  **Verdict**: **Reject**—fails all but implementation.  

  #### C. Peer Classroom-Observation Scheme  
  1. **Degradation Under Pressure**: ⚠️  
     - *Why*: *If* observations are infrequent, instructors may "perform" for observers. Mitigated by regular, unannounced visits. No strong evidence of degradation.  
  2. **Tail Robustness**: ✅  
     - *Why*: Trained peers detect extremes (e.g., toxic classrooms) better than surveys.  
  3. **Causal Alignment**: ✅  
     - *Why*: Observations directly measure teaching behaviors (e.g., clarity, engagement), which are upstream levers for learning.  
  4. **Gaming Resistance**: ⚠️  
     - *Why*: Gaming possible if observers are untrained or collude. Mitigated by blind audits and rater training.  
  5. **Values Congruence**: ✅  
     - *Why*: Promotes collaboration, mentorship, and pedagogical growth—aligns with developmental values.  
  6. **Implementation Risk**: ⚠️  
     - *Why*: High time cost (observers + training), but builds community.  
  **Verdict**: **Conditional Pass**—fails only if poorly implemented. Requires investment in rater training and frequency.  

  ---

  ### What the Procedure Can’t Settle  
  - **Values Conflicts**: Step 5 (Values Congruence) is purely judgment-based. Humanists may still reject *any* metric as reductive.  
  - **Causal Uncertainty**: Step 3 relies on contested theories of causality (e.g., can peer observations *cause* better teaching?).  
  - **Cost-Benefit Trade-offs**: Step 6 requires subjective weighing of costs vs. benefits (e.g., is peer observation worth the workload?).  
  - **Your Discomfort with Peer Observations**: The procedure approves this *if well-designed*, but you may dislike the resource drain. This is a values call for the committee.  

  ### Consensus vs. Contested  
  - **Settled**: Degradation (Step 1) and Gaming (Step 4) have strong empirical support (e.g., gaming studies in economics/education).  
  - **Contested**: Causal Alignment (Step 3) is theory-dependent; tail behavior (Step 2) lacks field studies in education.  
  - **Humanist Leverage**: Emphasize Steps 5–6 (values/costs)—they’re immune to technical critiques and let humanists drive the conversation.  

  ### Recommendation for Provost  
  Present the checklist as a **due diligence tool**. Peer observation passes *if* resourced properly. Acknowledge that **no metric is perfect**, but this minimizes Goodhart risks. For buy-in:  
  - Have humanists co-lead Steps 5–6.  
  - Pilot peer observations in one department first.  
  - Re-run tests annually—metrics degrade over time!  

  ---  
  **Time Commitment**: The checklist can be run in 2–3 meetings (2 weeks). Focus literature reviews on Steps 1–4; use committee discussion for 5–6.
