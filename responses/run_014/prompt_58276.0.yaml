answer: |-
  ## The Contractualist Conundrum: Aggregation, Individualism, and Allocation Under Scanlon's Shadow

  T. M. Scanlon's contractualism offers a compelling foundation for morality: an act is wrong if it violates principles that no one could reasonably reject, given their desire to justify their conduct to others on grounds they could not reasonably reject. Crucially, this assessment involves evaluating the objections individuals might raise *to a principle* governing the act, and these objections are assessed *individually*, not aggregated across persons. This individualist restriction protects against utilitarianism's potential to sacrifice individuals for the greater good. However, it generates the notorious aggregation problem: can a multitude of small benefits ever outweigh a single large harm? The three allocation problems – a one-off rescue, a repeated policy, and a risk-imposition scenario – starkly pose this challenge. This essay argues that while contractualists deploy sophisticated strategies to resist aggregation, they ultimately struggle to handle these cases without either compromising their core commitment to the separateness of persons or endorsing verdicts that clash deeply with widely held moral intuitions. A modest concession to limited aggregation, particularly in contexts of risk and repeated exposure, is necessary to avoid counterintuitive results.

  **The Contractualist Framework and the Aggregation Challenge**

  Scanlon's core insight is that morality stems from mutual recognition and justifiability. We must justify our actions to others by appealing to principles no one could reasonably reject. The force of an individual's objection depends on the *strength* of their personal reason for rejecting a principle that would permit an act affecting them negatively. Crucially, we cannot add together the weaker objections of many individuals to outweigh the stronger objection of one individual. For example, a principle allowing the killing of one innocent person to save five others could reasonably be rejected by the one, whose objection (loss of life) is paramount, even if the combined objections of the five (also loss of life) seem numerically greater. This embodies the "separateness of persons": individuals are distinct moral entities; burdens and benefits cannot be freely transferred or aggregated across them without violating their status as ends-in-themselves.

  The aggregation controversy arises when we consider harms and benefits of vastly different magnitudes affecting vastly different numbers. Intuitively, preventing two million people from suffering even a minor two-day flu seems morally weightier than saving one life – the aggregate suffering is immense. Yet, contractualism's individualist restriction appears to forbid this: the one person facing death has an overwhelmingly strong objection to any principle prioritizing the flu sufferers over them. No single flu sufferer has a remotely comparable objection to a principle prioritizing the life. Since objections aren't aggregated, the life-saving principle seems invulnerable to reasonable rejection.

  **Contractualist Strategies Against Aggregation**

  Contractualists employ several strategies to navigate this tension while preserving individualism:

  1.  **Emphasizing the Separateness of Persons:** This is foundational. Contractualism prioritizes protecting individuals from being used merely as a means to collective benefit. Sacrificing one for the "greater good" disrespects their distinct moral standing. The strength of the single victim's objection is decisive against being abandoned for aggregated minor gains.
  2.  **Distinguishing Ex Post and Ex Ante Reasonable Rejection:** This is crucial for risk cases. While assessing a principle *ex post* (after the outcome is known) might lead the victim of the large harm to reasonably reject a principle that sacrificed them for minor gains, assessing it *ex ante* (before knowing one's position) might yield a different result. Behind a "veil of ignorance" regarding who will be affected, individuals might find a principle imposing a tiny risk of a large harm (in exchange for significant aggregate minor benefits or reduced risks for others) *less* rejectable than a principle imposing a near-certainty of a moderate harm on a specific group, even if the *ex post* outcome for the unlucky individual is worse. The ex ante perspective focuses on the *risk burden* faced by each individual under the principle.
  3.  **Intrapersonal Aggregation Over a Lifetime:** Contractualism allows aggregating benefits and burdens *within* a single person's life. A principle inflicting many small harms on the *same* person over time could be reasonably rejected by them based on the cumulative burden. This distinguishes it from interpersonal aggregation. This becomes relevant for repeated policy choices.

  **The Moral Case for (Limited) Aggregation**

  Despite these strategies, strong arguments suggest some interpersonal aggregation is morally indispensable:

  1.  **The Sheer Scale of Suffering:** Morality seems sensitive to the total amount of suffering prevented. Ignoring the aggregated misery of millions suffering minor flu, even if no single case is severe, feels morally blind. It prioritizes an abstract principle (non-aggregation) over concrete, massive human distress.
  2.  **The Imperative of Rescue in Asymmetric Cases:** When one faces certain catastrophe and many face minor setbacks, the moral urgency shifts towards preventing the catastrophe *only if* the aggregated minor setbacks don't constitute a catastrophe themselves. Intuitions strongly suggest that at a certain scale (millions suffering), the aggregated minor harms *do* constitute a morally significant catastrophe that must be weighed against the single large harm.
  3.  **Practicality and Fairness in Repeated Exposure:** A strict non-aggregation rule applied to repeated policies can lead to systematic unfairness. If an agency *always* prioritizes preventing one severe impairment over preventing thousands of minor ailments across many decisions, the cumulative burden of the minor ailments *borne by different individuals each time* might become immense, while the policy systematically neglects widespread low-level suffering. This seems unfair and inefficient.

  **Applying the Framework: The Three Allocation Problems**

  1.  **The One-Off Rescue:**
      *   **Scenario:** Save one young adult from death OR prevent 2 million cases of moderate 2-day flu.
      *   **Strict Contractualist Verdict:** Save the one life. The individual facing death has an overwhelmingly strong, non-rejectable objection to any principle prioritizing flu prevention. No single flu sufferer has an objection remotely strong enough to outweigh this. Aggregation of the flu objections is forbidden.
      *   **Contractualist Strategy:** Solely appeal to the separateness of persons and the decisive strength of the death objection. The aggregate flu suffering, however large, is morally irrelevant.
      *   **Counterintuitive Result?** Highly. The intuition that preventing widespread, significant (though individually minor) suffering on this scale outweighs saving one life is powerful. The contractualist verdict seems to prioritize theoretical individualism over a vast reduction in real human misery. While saving a life is paramount in smaller trade-offs, the scale here overwhelms the individualist restriction for many.
      *   **Verdict:** This case represents the hardest challenge for pure contractualism. Its verdict is arguably the most counterintuitive and difficult to defend without conceding that, at extreme scales, interpersonal aggregation becomes morally necessary.

  2.  **The Repeated Policy Choice:**
      *   **Scenario:** An agency makes 1000 decisions over a decade. Each time: prevent one severe impairment (e.g., permanent paralysis) OR prevent 100,000 minor ailments (e.g., one-day migraines).
      *   **Strict Contractualist Verdict (per decision):** Prevent the one severe impairment each time. The individual facing paralysis in each instance has a decisive objection.
      *   **Contractualist Strategy (Intrapersonal Aggregation):** Assess the principle governing the *entire policy*. Could an individual reasonably reject a principle that, over their lifetime, exposes them to a high cumulative risk of suffering many minor ailments because the policy *always* prioritizes preventing severe impairments elsewhere? If the policy leads to each person suffering, say, 10 extra migraines over the decade due to systematic neglect of minor ailment prevention, that cumulative burden might give each person a reasonable ground for rejecting the strict "always prioritize the severe impairment" principle. They might reasonably prefer a principle that allows *some* aggregation, permitting the prevention of minor ailments in a sufficient number of cases to reduce this cumulative burden, even if it means sometimes not preventing a single severe impairment. This leverages intrapersonal aggregation over time.
      *   **Counterintuitive Result Avoided?** Partially. The intrapersonal strategy offers a contractualist path to a more intuitively plausible policy – one that doesn't systematically ignore widespread low-level suffering. It acknowledges that the cumulative effect of *repeated* non-aggregation *on individuals* can generate a significant burden justifying rejection.
      *   **Verdict:** This case showcases contractualism's most promising strategy. By focusing on the lifetime burden a principle imposes on each person (intrapersonal aggregation), it can justify policies that look like interpersonal aggregation across different decision instances but are grounded in preventing significant cumulative burdens *within* individual lives. This avoids the stark counterintuitiveness of the one-off case.

  3.  **The Risk-Imposition Choice:**
      *   **Scenario:** Choose between Rule A (imposes a 1 in 1,000,000 increased risk of death on each of 1 billion people) or Rule B (imposes a 1 in 1,000 risk of a 1-week hospital stay on each of 10,000 people). Aggregate expected harm is equivalent (e.g., 1000 expected deaths vs. 10 expected hospital stays * 100 severity units? = 1000 units).
      *   **Strict Contractualist Verdict (Ex Post):** If someone dies under Rule A, they could reasonably reject it in favor of Rule B. Their objection (death) is paramount. No one suffering a hospital stay under Rule B has an objection strong enough to outweigh this death if assessed ex post.
      *   **Contractualist Strategy (Ex Ante):** Assess the principles *ex ante*, before knowing who is affected. Under Rule A, *each* individual faces a vanishingly small increased risk of death. Under Rule B, a specific group (though unknown) faces a significant (0.1%) risk of a substantial harm (hospitalization). Individuals behind an ex ante veil might reasonably reject Rule B: it subjects a clearly identifiable (ex ante) small group to a much higher *magnitude* of risk per person than Rule A, even though the *badness* of the worst outcome under A is greater. The *risk burden* – the imposition of a significant probability of a significant harm concentrated on a few – under Rule B might be seen as more objectionable per person than the minuscule, diffuse risk under Rule A. Rule A treats everyone more equally with a barely perceptible risk increase.
      *   **Counterintuitive Result Avoided?** Mostly. The ex ante perspective allows contractualism to favor Rule A (the tiny death risk spread widely) over Rule B (the larger risk of serious harm concentrated on a few), aligning with the intuition that concentrating significant risks is worse than dispersing tiny ones, even if the worst-case outcome under the dispersed risk is worse. It avoids the ex post trap by focusing on the acceptability of the risk *profile* under each principle from the standpoint of each individual before the lottery is run.
      *   **Verdict:** The ex ante strategy is powerful and largely successful here. It handles risk imposition without abandoning individualism or endorsing counterintuitive results. It shows contractualism can incorporate probabilistic reasoning and concerns about fairness in risk distribution.

  **Conclusion: Towards a Conciliatory Revision**

  Scanlon's contractualism provides a profound account of morality centered on individual justifiability and the separateness of persons. Its resistance to simple interpersonal aggregation is a core strength, protecting against the tyranny of the majority or the utilitarian calculus. However, the analysis of the three allocation problems reveals tensions.

  The **One-Off Rescue** case exposes the limits of strict non-aggregation. The verdict to save one life over preventing millions of cases of moderate flu, while logically consistent within contractualism, clashes too violently with the moral intuition that such vast aggregated suffering *must* matter. The **Repeated Policy** case demonstrates contractualism's most ingenious solution: leveraging intrapersonal aggregation over a lifetime to justify policies that prevent the systematic accumulation of minor burdens, effectively mimicking limited interpersonal aggregation across instances but grounding it in individual lifetime burdens. The **Risk-Imposition** case showcases the power of the ex ante perspective, allowing contractualism to handle probabilistic scenarios and concerns about concentrated risk burdens without compromising individualism.

  The opposing position – strict utilitarianism or strong aggregation – fails because it fundamentally violates the separateness of persons, allowing individuals to be sacrificed for the collective without sufficient regard for the unique moral claim of the individual facing catastrophe. Contractualism rightly identifies this as a profound moral wrong.

  However, the **overall verdict** must be revisionary and conciliatory. Contractualism needs a principled concession to limited interpersonal aggregation in specific, extreme contexts like the one-off rescue case. The sheer scale of suffering creates a moral imperative that transcends the individualist restriction, not by simple summation, but by recognizing that the collective burden reaches a threshold of moral significance comparable to the individual catastrophe. This doesn't abandon individualism; it acknowledges that the moral reality of *massive* distributed suffering demands recognition alongside the moral reality of individual catastrophe. The strategies of ex ante evaluation and intrapersonal lifetime aggregation provide crucial tools within the framework for handling other aggregation challenges effectively, but they are insufficient alone for the extreme one-off case. Therefore, contractualism can retain its core commitment to the separateness of persons and individual justifiability while incorporating a threshold-based concession to aggregation when the number of affected individuals and the aggregate burden become overwhelmingly large, preventing its most counterintuitive implications without collapsing into utilitarianism.
