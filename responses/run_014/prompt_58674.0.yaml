  ## Contrasting Assertion Norms: Knowledge vs. Justified Belief

  The debate centres on what makes an assertion **proper** – that is, when a speaker is epistemically entitled to make a claim, and when they might be **blameworthy** for doing so.

  1.  **Knowledge Norm (KN):** Assertion is proper only if the speaker **knows** the proposition asserted.
      *   **Core Idea:** Asserting "P" presents P *as known*. Doing so without actually knowing it is intrinsically flawed, even if P turns out true by luck. Knowledge requires truth, justification, and the absence of "gettierising" luck (where justification connects to truth accidentally).
      *   **Blameworthiness:** An assertion violating KN is always improper and the speaker is blameworthy for making it, regardless of outcome (truth or falsity), because they presented something unknown as known.
      *   **Connection to Truth:** Truth is a *necessary* component of knowledge, so KN inherently requires truth for proper assertion. It prioritises the speaker's *epistemic achievement* (knowing) over mere evidential support.

  2.  **Justified Belief Norm (JBN):** Assertion is proper if the speaker **justifiably believes** the proposition asserted on the basis of reasonable evidence.
      *   **Core Idea:** Asserting "P" presents P *as reasonably believed*. The speaker's duty is to base their assertion on good evidence available to them. Whether the belief is true, or even constitutes knowledge, is secondary to the quality of the justification.
      *   **Blameworthiness:** An assertion violating JBN (made without sufficient justification) is improper and blameworthy. However, if the speaker *was* justified but wrong, the assertion might still be improper (because false), but the speaker is often *less blameworthy* or even blameless, as they fulfilled their epistemic duty. A justified true assertion is proper.
      *   **Connection to Truth:** Truth is *not* a requirement for propriety under JBN. A justified false assertion can be proper (though unfortunate). JBN prioritises *responsible inquiry* and *evidence-based assertion* over the actual truth-value or knowledge status.

  ## Analysing the Cases

  ### Case 1: Maya (The Station Announcer)

  *   **Situation:** Maya asserts the train departs Platform 4 based on the official roster. The roster is wrong (due to error), but coincidental engineering works mean the train *is* on Platform 4. Her assertion is true, but she doesn't *know* it (it's a Gettier case – justified true belief without knowledge).
  *   **KN Verdict:**
      *   **Propriety:** **Improper.** Maya does not *know* the train is on Platform 4. Her true belief is accidental relative to her evidence (the flawed roster).
      *   **Blameworthiness:** **Blameworthy.** She asserted something she didn't know, presenting it as known. The lucky truth doesn't absolve her of the epistemic failure inherent in asserting without knowledge.
      *   *Plausibility:* This verdict seems unduly harsh. Maya followed procedure perfectly using the best available evidence. While she didn't *know*, her assertion was correct and responsibly made. Blaming her feels counterintuitive.
  *   **JBN Verdict:**
      *   **Propriety:** **Proper.** Maya's belief was extremely well-justified; she relied on the official, normally reliable roster. She fulfilled her duty to base her assertion on the best reasonable evidence.
      *   **Blameworthiness:** **Blameless.** She did everything reasonably expected of her. The falsity of the roster and the coincidental truth are outside her control and not due to any negligence.
      *   *Plausibility:* This verdict aligns better with intuition. Maya performed her role responsibly and correctly informed passengers. There's no reasonable basis to blame her.

  ### Case 2: Leo (The Junior Doctor)

  *   **Situation:** Leo asserts the standard dose is safe after carefully checking the current formulary (the official drug reference). Unbeknownst to him, a very recent, critical safety update (not yet disseminated) renders the dose unsafe. His assertion is false, despite being well-supported by his evidence.
  *   **KN Verdict:**
      *   **Propriety:** **Improper.** Leo's assertion is false. Since knowledge requires truth, he clearly does not know the dose is safe. Therefore, he violates KN.
      *   **Blameworthiness:** **Blameworthy.** He asserted a falsehood as if he knew it. The undisseminated update doesn't change the fact that he presented an unknown proposition as known. The potential harm of a false safety claim in medicine amplifies the blame.
      *   *Plausibility:* This verdict captures the core problem: Leo's assertion was dangerously false. The KN explains the *seriousness* of the impropriety, especially in a high-stakes context like medicine. The outcome matters.
  *   **JBN Verdict:**
      *   **Propriety:** **Problematic.** JBN focuses on justification. Leo's belief was *highly* justified; he consulted the standard, authoritative formulary. Strictly speaking, JBN suggests the assertion was **proper** *epistemically* because his justification was impeccable.
      *   **Blameworthiness:** **Blameless (Epistemically).** JBN suggests Leo acted entirely responsibly given his evidence. Any fault lies with the system for the undisseminated update, not with Leo's inquiry or assertion based on the best evidence *he* had.
      *   *Plausibility:* This verdict is deeply uncomfortable. While Leo wasn't negligent, his assertion was false and potentially harmful. Declaring his assertion "proper" and him "blameless" *epistemically* feels inadequate, even if we acknowledge he wasn't personally negligent. The norm seems to ignore the crucial fact that assertions have consequences, especially false medical ones. We'd likely still hold him accountable for the *act* of asserting falsely, even if we mitigate blame based on his justification.

  ## Which Norm is Favoured?

  *   **Maya's Case:** Strongly favours the **Justified Belief Norm (JBN)**. KN's verdict of impropriety and blameworthiness is implausibly harsh for a responsible agent who made a correct assertion based on the best standard evidence.
  *   **Leo's Case:** Favours the **Knowledge Norm (KN)**. While JBN correctly identifies Leo's justification as impeccable, its verdict that the assertion was epistemically proper and Leo blameless feels seriously deficient given the false and harmful outcome. KN captures the intuition that asserting something false as true (especially on a critical matter) is inherently improper, regardless of the speaker's justification. The speaker bears responsibility for the *truth* of what they assert.

  ## What the Pair Reveals about Assertion, Truth, and Inquiry

  The two cases together demonstrate that neither norm perfectly captures our intuitions across all contexts, but they highlight a crucial tension:

  1.  **Truth Matters:** Leo's case shows that the *truth* of an assertion is not epiphenomenal. When assertions are false, especially with significant consequences, we feel asserting them was wrong *even if justified*. KN captures this by making truth a necessary component of propriety.
  2.  **Responsible Inquiry Matters:** Maya's case shows that we value responsible inquiry and evidence-based assertion highly. Punishing a speaker who did everything right but was thwarted by external factors (like an undetected error in the roster) feels unjust. JBN captures this by prioritising justification.
  3.  **The Tension:** The pair reveals a fundamental tension between **speaker responsibility** (did they do their epistemic duty?) and **assertion responsibility** (is what they said actually true?). JBN prioritises the former, KN the latter.
  4.  **Favouring KN?** While Maya's case makes KN seem too strict, Leo's case shows JBN as potentially too lax, particularly in high-stakes contexts. The catastrophic potential of false assertions (like Leo's) arguably makes the requirement for *truth* (as embedded in knowledge) a more essential feature of proper assertion than JBN acknowledges. Inquiry aims at truth, and assertion purports to convey it. KN takes this "purporting to convey truth" seriously by requiring the speaker to actually possess it (as knowledge) before asserting. JBN, by allowing justified false assertions to be proper, severs the direct link between assertion's function and truth, focusing solely on the process of justification.

  **Conclusion:** While the Justified Belief Norm (JBN) gives the more plausible verdict in Maya's low-stakes, luckily-true case, the Knowledge Norm (KN) gives the more plausible verdict in Leo's high-stakes, dangerously false case. Taken together, the cases suggest that the **Knowledge Norm** better captures the intrinsic connection between assertion and *truth*, which is the ultimate goal of inquiry. Assertion isn't just about presenting well-supported guesses; it's about presenting what one takes to be *known* fact. KN upholds this standard, even if it sometimes judges harshly in cases of epistemic misfortune like Maya's. JBN's allowance for proper justified false assertions, as seen in Leo's case, weakens the vital link between assertion and truth that underpins its role in communication and rational inquiry.
