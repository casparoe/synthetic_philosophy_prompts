  Below is a decision tree designed to help students navigate the logical space of responses to the lottery paradox. It starts from the premise that the paradox poses a genuine problem for the idea that high probability justifies belief, then branches through key principles and distinctions pressured by the paradox. Each node is phrased as a question a student can answer without knowing the outcome. The leaves cover six named positions, including the five you specified plus a paraconsistentist option. Combinations of answers that lead to no leaf are explained, and indistinguishable leaves are flagged.

  ---

  ### **Decision Tree: Responses to the Lottery Paradox**  
  *Start here:* **I find the lottery paradox a genuine problem for the idea that high probability justifies belief.**

  #### **Question 1: Can rational belief ever be justified by probability <1?**  
  - **Yes** → Go to Question 2.  
  - **No** → **Leaf: Infallibilism** (Rejects the lottery principle; only probability 1 justifies belief).  

  #### **Question 2: Must rational belief be closed under conjunction?**  
  *(If you rationally believe P and rationally believe Q, must you rationally believe P∧Q?)*  
  - **No** → **Leaf: Closure Rejection** (Accepts high probability justifies belief but rejects closure).  
  - **Yes** → Go to Question 3.  

  #### **Question 3: In the lottery case, does the agent *believe* each ticket will lose?**  
  *(Or are they merely in a state of high confidence?)*  
  - **No** → Go to Question 4.  
  - **Yes** → Go to Question 5.  

  #### **Question 4: Why doesn't the agent *believe* each ticket loses?**  
  - **Because high confidence ≠ belief** → **Leaf: Belief-Acceptance Separation** (Distinguishes belief from probabilistic acceptance).  
  - **Because probability is below a threshold** → **Leaf: Threshold View** (Belief requires a fixed/contextual probability threshold, e.g., >0.99).  

  #### **Question 5: Does the evidence support the conjunction (all tickets lose)?**  
  *(Even if it supports each conjunct individually?)*  
  - **No** → **Leaf: The Paradox Dissolves** (Evidence for individuals doesn't aggregate; conjunction is unsupported).  
  - **Yes** → Go to Question 6.  

  #### **Question 6: Can rational belief tolerate contradictions?**  
  - **No** → *No leaf — Incoherent path* (Answers conflict: evidence supports the contradiction).  
  - **Yes** → **Leaf: Paraconsistentist** (Accepts rational but inconsistent beliefs).  

  ---

  ### **Unoccupied Combinations & Explanations**  
  - **Path: Q1=Yes → Q2=Yes → Q3=Yes → Q5=Yes → Q6=No**  
    - *Why unoccupied?* Incoherent. Affirms evidence supports a contradiction but denies contradictions can be rational.  
  - **Path: Q1=Yes → Q2=Yes → Q3=No → Q4="Probability below threshold"**  
    - *Why unoccupied?* Unattractive. Threshold views typically answer Q3 with "No" due to thresholds, but this path is covered under the Threshold View leaf.  
  - **Path: Q1=No → [Any]**  
    - *Why unoccupied?* Infallibilism (Q1=No) is terminal; no further branches needed.  

  ### **Indistinguishable Leaves**  
  - **Threshold View (Q4) and Belief-Acceptance Separation (Q4)** can overlap in practice. Some threshold theorists implicitly separate belief from confidence, and some separationists appeal to thresholds. The tree distinguishes them based on *primary rationale*, but real-world positions may blend both.  
  - **The Paradox Dissolves (Q5) and Closure Rejection (Q2)** address similar intuitions (non-aggregation of evidence), but the tree separates them:  
    - *Closure Rejection* denies conjunction closure as a universal principle.  
    - *The Paradox Dissolves* accepts closure but denies evidence transmits to the conjunction *in this specific case*.  

  ---

  ### **Key for Leaves**  
  1. **Infallibilism**: Rejects high probability justification entirely (e.g., Descartes-inspired views).  
  2. **Closure Rejection**: Accepts high probability justification but denies closure (e.g., Kyburg).  
  3. **Threshold View**: Belief requires probability above a threshold (e.g., 0.95); avoids paradox by adjusting thresholds.  
  4. **Belief-Acceptance Separation**: Belief ≠ high confidence; lottery warrants only the latter (e.g., Cohen).  
  5. **The Paradox Dissolves**: Evidence doesn’t support the conjunction (e.g., "no-justification" approaches).  
  6. **Paraconsistentist**: Rational belief can be inconsistent (e.g., dialetheism or pragmatic permissivism).  

  ---

  ### **Notes for the Handout**  
  - **Why this tree?** It isolates pressures unique to the lottery paradox (e.g., thresholds, evidence aggregation) and shows why preface paradox responses (e.g., doxastic humility) diverge.  
  - **Tree Limits**: Forces binary choices; real positions may hybridize. Distinctions like Threshold vs. Belief-Acceptance are heuristic.  
  - **Pedagogical Tip**: Have students defend answers at each node before revealing leaves. Re-run the tree for the preface paradox to contrast responses.  

  This tree maps the logic, not the history—students locate their intuitions before labeling them. For deeper exploration, pair with classic texts (e.g., Kyburg for closure rejection, Foley for thresholds).
