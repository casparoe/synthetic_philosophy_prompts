  The lottery paradox (Kyburg, 1961) is generated by three principles:
  1. (Belief from high probability) If the probability of P is sufficiently high (and above a threshold t), then it is rational to believe P.
  2. (Conjunction principle) If it is rational to believe P and it is rational to believe Q, then it is rational to believe (P ∧ Q).
  3. (No contradiction) It is not rational to believe a contradiction.

  In a fair lottery with many tickets (say, 1000) and exactly one winner, for each ticket i, the probability that ticket i loses is very high (0.999). So by (1), we believe each proposition of the form "ticket i loses". Then by (2), we believe the conjunction: every ticket loses. But this conjunction is false because one ticket must win. Moreover, we also know that one ticket wins, so we have a contradiction. This violates (3).

  The preface paradox (Makinson, 1965) is similar: an author believes each claim in her book, but in the preface she says that she knows there is probably an error somewhere (so she believes the negation of the conjunction of all the claims). But note: the preface paradox doesn't require a probabilistic threshold in the same way. The author has independent reasons for each claim and for the belief that at least one is false.

