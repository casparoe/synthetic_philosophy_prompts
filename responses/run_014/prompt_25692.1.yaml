prompt: |-
  I'm a science journalist at a weekly, and I need a decision procedure for something I face every coupla days: when is a scientific finding solid enough that I should report it as true — or true enough — rather than burying it in hedges or killing the story entirely? I've read enough philosophy to know the pragmatists had two very different pictures of truth that might actually help here. Peirce said truth is what the community of inquirers would converge on in the long run, given enough investigation — so the question is whether the finding is on a trajectory toward consensus, whether the methods are sound, whether the people who should be skeptical are skeptical. James said truth is what works, what has cash value in experience — so the question is whether acting as if the finding is true would lead to better outcomes, whether the belief pays its way. These pull in different directions and I want a procedure that uses both.

  I need a checklist I can run in a few hours max. It should walk me through: what to check first, what counts as good enough on each question, where I should spike the story, where I should run it with specific caveats, and — crucially — where the procedure is really just me making a judgment call dressed up as a checklist item. I don't need it to tell me what's true. I need it to tell me what's responsible to print.

  Run it on three findings I've actually had to deal with: (1) a large observational study finding moderate coffee drinking associated with lower all-cause mortality — big sample, decent controls, but you can't randomize people to a lifetime of espresso; (2) a replication of a famous social priming study that found the effect in one of three conditions with a much smaller effect size; (3) a physics collaboration announcing a 3.5-sigma excess that could be a new particle, in a field where 5-sigma is the discovery threshold. For each, tell me what the procedure says, where it's silent, and whether I should lose sleep over the call.
reasoning: |-
  Okay, the user is a science journalist who needs a practical decision procedure for when to report scientific findings as true versus hedging or killing the story. They mention Peirce's and James's theories of truth as frameworks. Peirce focuses on convergence toward consensus through sound methods and community scrutiny, while James emphasizes practical outcomes—what "works" in real life. 

  The user wants a checklist that integrates both philosophies, applicable within hours. They also want it tested on three real cases: coffee and mortality, social priming replication, and a physics anomaly. 

  First, I need to design a dual-axis procedure. The Peircean axis would assess methodological robustness and trajectory toward consensus. The Jamesian axis would evaluate practical consequences and "cash value." Each axis needs clear thresholds for action: publish confidently, publish with caveats, or spike. 

  For the coffee study: Large observational data with decent controls suggests strong Peircean trajectory (high Consensus Potential), but randomization limits are worth flagging. Jamesian assessment is medium—coffee habits are modifiable, but mortality isn't immediate. Verdict: Publish with caveats about observational limits. 

  For the social priming replication: Weak Peircean score—failed replications and tiny effect size suggest no consensus trajectory. Jamesian impact is low; social priming has little real-world application. Verdict: Spike or bury as a null result. 

  For the physics signal: Peircean score is medium—3.5-sigma is intriguing but below gold standard. Jamesian impact is high (new particle = paradigm shift), but premature belief risks public confusion. Verdict: Report as a "hint" with heavy caveats. 

  The user's deeper need is avoiding reputational damage from overhyping or underreporting. They want intellectual rigor masked as practicality—hence admitting where the checklist is just "judgment calls dressed up." Key tension: Peirce slows down, James speeds up. Balancing them requires honesty about uncertainty. 

  Notable friction points: When methods are solid but implications trivial (James overrules), or when implications are huge but evidence shaky (Peirce overrules). The checklist must force confronting this. 

  Sleep-losing moments: Physics case. High Jamesian payoff tempts hype, but Peircean rigor demands restraint. Flag this explicitly in the procedure. 

  Final structure: Two parallel tracks (Peirce/James), each with scored sub-questions, plus conflict-resolution rules. Emphasize that middling scores = caveats, and low on either axis = spike. Stress that "judgment call" zones (e.g., "would skeptics stay quiet?") are unavoidable but must be documented.
answer: |-
  Here’s a **dual-axis decision procedure** integrating Peircean "convergence" and Jamesian "cash value," designed for speed and transparency. Use it as a flowchart, scoring each axis separately (Low/Medium/High), then combine for a verdict. **Bold** = concrete checks; *italics* = judgment zones.

  ---

  ### **The Checklist: Two Axes, 90 Minutes Max**
  **PEIRCE AXIS (Convergence Trajectory)**  
  *Is this finding on a path to scientific consensus?*  
  1. **Methods:** Are methods open, standard for the field, and robust to known flaws? (✔️ preprint/data available; ✔️ controls for major confounders; ✔️ avoids p-hacking)  
  2. **Replicability:** Has it survived attempts to falsify it? (✔️ pre-registered replication; ✔️ multi-lab collaboration; ✔️ independent analysis)  
  3. **Skeptic Engagement:** Are experts who *should* be critical (rivals, methodologists) *not* dismissing it outright? (✔️ peer-reviewed in rigorous journal; ✔️ skeptics acknowledge it’s worthy of discussion; ❌ major unresolved technical criticisms)  
  4. **Field Consensus:** Does it align with established knowledge? (✔️ extends existing models; ❌ contradicts well-verified theories without extraordinary evidence)  
  *Thresholds:* **High** = Passes all 4 solidly. **Medium** = Minor gaps in 1-3 but no fatal flaws. **Low** = Major fail on ≥2 items.  

  **JAMES AXIS (Cash Value)**  
  *Would treating this as true improve practical outcomes?*  
  1. **Actionability:** Can people *do* something useful with this? (✔️ informs health/behavior/policy; ❌ purely descriptive)  
  2. **Stakes of Error:** Harm if false? (✔️ low-risk actions; ❌ high-risk medical/policy changes)  
  3. **Urgency:** Delay costs more than caution? (✔️ emerging public health threat; ❌ incremental basic science)  
  4. **Alternatives:** Is this the *only* basis for action? (✔️ confirms/disconfirms key options; ❌ one of many weak studies)  
  *Thresholds:* **High** = Clear, low-risk utility. **Medium** = Potential value but alternatives exist. **Low** = Trivial or speculative impact.  

  **DECISION MATRIX**  
  |                    | **James HIGH**       | **James MEDIUM**     | **James LOW**        |
  |--------------------|----------------------|----------------------|----------------------|
  | **Peirce HIGH**    | PUBLISH (Lead story) | PUBLISH (Feature, w/caveats) | SPIKE or DEEP DIVE (Why no impact?) |
  | **Peirce MEDIUM**  | PUBLISH (Feature, w/caveats) | PUBLISH (Hedged, "emerging evidence") | SPIKE |
  | **Peirce LOW**     | PUBLISH (Explainer, "controversial claim") | SPIKE or KILL | SPIKE |

  **Where It’s a Judgment Call:**  
  - *Skeptic engagement:* You must gauge if critics are credible or biased.  
  - *Cash value:* Requires predicting real-world consequences (e.g., will coffee drinkers overreact?).  
  - *Urgency:* Balancing public interest vs. hype.  

  ---

  ### **Applied to Your Cases**
  **1. Coffee & Mortality (Observational Study)**  
  - **Peirce:**  
    - ✔️ Methods: Large sample, decent controls (age, smoking).  
    - ❌ Replicability: Observational limitation unavoidable.  
    - ✔️ Skeptics: Nutrition epidemiologists accept this as best-available evidence.  
    - ✔️ Consensus: Fits broader diet/lifestyle research.  
    *→ MEDIUM (Due to inherent limits)*  
  - **James:**  
    - ✔️ Actionability: People can adjust coffee intake.  
    - ✔️ Stakes: Low risk (moderate coffee is safe).  
    - ❌ Urgency: Not urgent.  
    - ❌ Alternatives: Many longevity factors exist.  
    *→ MEDIUM*  
  **Verdict:** **Publish with caveats** ("Observational data suggests... but cannot prove causation"). *Sleep well*: Hedging is responsible.  

  **2. Social Priming Replication (1/3 conditions, small effect)**  
  - **Peirce:**  
    - ❌ Methods: Underpowered? Why did 2/3 conditions fail?  
    - ❌ Replicability: Failed replications plague this field.  
    - ❌ Skeptics: Critics argue effect is artifactual.  
    - ❌ Consensus: Field is in crisis.  
    *→ LOW*  
  - **James:**  
    - ❌ Actionability: No practical use for tiny, unreliable effects.  
    - ✔️ Stakes: Low (no harm in ignoring).  
    - ❌ Urgency: None.  
    - ❌ Alternatives: Better-studied behavioral factors exist.  
    *→ LOW*  
  **Verdict:** **Spike or bury** (e.g., "Replication attempt fails to revive fading theory"). *Sleep well*: Evidence is too weak.  

  **3. Physics 3.5-sigma "Hint"**  
  - **Peirce:**  
    - ✔️ Methods: State-of-the-art detectors, rigorous stats.  
    - ❌ Replicability: Not yet replicated; below gold standard (5σ).  
    - ✔️ Skeptics: Taken seriously but demand more data.  
    - ❌ Consensus: Anomalous, not converging yet.  
    *→ MEDIUM*  
  - **James:**  
    - ✔️ Actionability: None immediately, but *massive* implications if real.  
    - ❌ Stakes: High harm if false (public distrust in science).  
    - ✔️ Urgency: Competitive field; readers expect coverage.  
    - ❌ Alternatives: Wait for 5σ data.  
    *→ MEDIUM*  
  **Verdict:** **Publish with heavy caveats** ("Hints of a particle... but far from confirmed"). *Lose sleep? Briefly*: High Jamesian stakes, but Peirce demands restraint. Frame as "scientists investigating," not "discovery."  

  ---

  ### **Why This Works**  
  - **Balances rigor & relevance:** Peirce prevents hype; James justifies reporting on early-but-important signals.  
  - **Exposes uncertainty:** Forces you to articulate *why* a hedge is needed (e.g., "Methods MEDIUM due to X").  
  - **Speed:** Focuses on make-or-break factors (methods, stakes, consensus cues).  
  - **Accountability:** Documents your reasoning for editors/readers.  

  **When to Override the Matrix:** If a Peirce-LOW finding has *extreme* Jamesian value (e.g., a plausible pandemic early-warning), run it as a "contested alert" with named critics quoted. But this is rare — your cases don’t qualify.
