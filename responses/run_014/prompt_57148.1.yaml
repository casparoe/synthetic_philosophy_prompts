  The Irish famine point is subtle - subsistence farmers starving when their own crops fail makes entitlement collapse tautological, undermining its political crime narrative. For the Great Leap, I'll emphasize provincial death rate variations and grain hoarding as evidence of systemic failure rather than central intent. Bengal's wartime complexity shows (B) without clear (C). 

