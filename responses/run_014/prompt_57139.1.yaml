prompt: |-
  I'm six books in and I've noticed I keep writing the same scene over and over, but I cant say what makes some versions of it land and others feel like a cheat to the reader. So here's my gut, going by my own drafts — tell me what principle sits underneath it, if there is one.

  - Mother in a burning house, can carry one of her two kids out. Real dilemma. Afterwards she isn't blameworthy, but "you did the right thing" would be an insult, and I want her to feel she owes the one she left something.
  - Field hospital, surgeon lets three die to save seven. Doesn't feel like a dilemma at all. Grim arithmetic, there's a right answer, nothing left over except tiredness. Structurally the same shape as the last one and I treat them completely differently, which bugs me tho.
  - Guy skips a promised lunch to stop a mugging. Obviously correct, nothing outstanding — except I keep wanting him to apologise, and if nothing was actually violated, apologise for what?
  - Two kids drowning, neither of them his, he saves one. Here I want it to feel like the burning house and not the hospital, and I honestly don't know why.
  - Woman forced to pick which of her own children lives. Real dilemma, there was no right thing to do, and she's still not to blame for having picked. But if she freezes and lets both go, that's worse — she IS to blame.
  - Man takes a job that puts him in two cities at once and then has to break one of two promises. Fake dilemma, he did this to himself. Still needs the grief in the scene.

  My working rule when I'm drafting: it's a real dilemma only if you couldn't afterwards say to the character "you did the right thing" and mean it. Test that against the six, say which verdicts it can't deliver and which single verdict I should probably give up, and then state whatever principle survives as precisely as you can manage — including what it predicts about a case I haven't got yet: a character who can either keep a promise to a friend who just died or stop a stranger from being badly hurt, where the two are exactly as bad as each other.
reasoning: |-
  Okay, the user is a writer who's noticed they're repeating a similar scene across six books but can't pinpoint why some versions work and others feel like a cheat. They've listed six scenarios and have a working rule: a real dilemma exists if you can't tell the character "you did the right thing" and mean it. They want me to analyze their examples, identify where their rule fails, and extract a universal principle.

  Looking at their examples. The burning house scenario with the mother feels authentic because she faces an impossible choice with no moral high ground—saving one child inherently means abandoning the other. The surgeon scenario lacks that weight because triage prioritizes the greater good; it's tragic but ethically clear-cut. The skipped lunch scenario is morally unambiguous (stopping a crime > social obligation), yet the character's urge to apologize hints at unresolved emotional residue. The drowning kids scenario mirrors the burning house—no personal ties, but the randomness of survival creates survivor's guilt. The forced child selection is pure horror—inaction is blameworthy, but either active choice is devastating. The self-inflicted job conflict lacks moral weight because the character created the avoidable mess.

  Their working rule mostly holds but stumbles on the surgeon and skipped lunch cases. The rule correctly flags the surgeon as "not a dilemma" (arithmetic has a right answer) but misses why the lunch scenario *feels* like it needs emotional resolution despite being morally clear. The key gap is that their rule focuses solely on moral blameworthiness, overlooking how emotional residue functions independently—like the lunch guy's irrational guilt or the drowning rescuer's haunting "why this one?" question. 

  The core principle emerging is that "real dilemmas" aren't about optimal outcomes but about inescapable emotional debt. In true no-win scenarios, the character acquires a lifelong obligation to the unchosen option—what philosopher Bernard Williams called "moral remainder." This explains why the drowning scenario lands like the burning house (emotional debt to the unsaved) while the surgeon doesn't (saving seven discharges the debt to the three). 

  For the promised-to-dead-friend vs. stranger-hurt scenario: keeping the promise is symbolically important but inert; helping the stranger is dynamically urgent. The emotional debt would cling to the unchosen act—if they keep the promise, they shoulder the stranger's suffering; if they help the stranger, they betray the friend's memory. Neither choice is "right," and "you did the right thing" would ring hollow precisely because both paths leave uncancellable emotional debts. 

  The user should probably abandon the idea that blameworthiness defines dilemmas. What matters is whether the choice generates enduring emotional residue. This reframes their surgeon scene: if he *personally knew* one of the three he sacrificed, that residue would make it land differently. Their drafting instinct about apologies in unambiguous situations (like the lunch) now makes sense—it’s not about morality but about acknowledging that some choices, even correct ones, fracture our self-narrative.
answer: |-
  Your instinct is razor-sharp, and your working rule ("real dilemma only if you couldn't afterwards say 'you did the right thing' and mean it") is a powerful tool that gets you *very* close. Let's test it against your six cases and refine the underlying principle.

  **Testing Your Rule Against Your Cases:**

  1.  **Burning House (Mother):** **VERDICT: PASSES.** Saying "you did the right thing" *is* an insult. There *was* no "right thing," only a horrific choice. The rule correctly identifies this as a real dilemma.
  2.  **Field Hospital (Surgeon):** **VERDICT: PASSES.** Saying "you did the right thing" (saving the most lives) *is* appropriate and true, even if grim. The rule correctly identifies this as *not* a real dilemma in the emotional/ethical sense you're exploring (it's a tragic calculation).
  3.  **Skipped Lunch / Stopped Mugging:** **VERDICT: FAILS (Partially).** The rule says "Not a real dilemma" (stopping the mugging *was* the right thing). **BUT** your gut feeling that he *should* apologize highlights a gap in the rule. The rule doesn't capture the *emotional residue* of breaking a promise, even for a good reason. The dilemma *feels* minor, but the *lingering feeling* is real.
  4.  **Two Kids Drowning (Stranger Saves One):** **VERDICT: PASSES.** Saying "you did the right thing" (saving *a* life) feels inadequate. He didn't *wrong* the unsaved child, but the randomness and finality create a debt to the unchosen life. The rule correctly identifies this as having the *feeling* of a real dilemma.
  5.  **Forced to Pick Which Child Lives:** **VERDICT: PASSES.** Identical to Case 1. Saying "you did the right thing" is monstrous. Inaction (freezing) *is* blameworthy because it's a failure to act *at all*. The active choice is the only non-blameworthy path, but it leaves devastating residue. Rule holds.
  6.  **Self-Inflicted Broken Promises:** **VERDICT: PASSES.** Saying "you did the right thing" *could* be said about fulfilling *one* promise, but it rings hollow because the *situation itself* is blameworthy. The grief stems from self-inflicted failure, not an impossible external choice. The rule correctly identifies this as *not* a real dilemma (it's a *consequence*).

  **The Single Verdict to Give Up:** Your rule stumbles slightly on **Case 3 (Skipped Lunch)**. It correctly identifies there *was* a morally right action, but fails to explain the *need for apology* and the lingering discomfort. This points to the rule needing refinement to encompass **Emotional Residue vs. Moral Blame**.

  **The Underlying Principle (Refined):**

  > **A choice generates the weight of a "real dilemma" (and its lasting emotional residue) when:**
  >
  > **1.  The character faces a forced selection between non-fungible values, commitments, or lives where:**
  >    *   **No outcome preserves all core values/commitments.** (Sacrifice is inherent).
  >    *   **The options are morally incomparable or incommensurate.** (You can't cleanly rank "child A vs. child B," "promise to dead friend vs. preventing harm," using a single scale like utility or duty).
  > **2.  The character bears no significant *moral blame* for *creating* the forced selection scenario itself.**
  > **3.  Choosing *any* option inherently creates an uncancellable **Emotional/Moral Debt** to the unchosen option(s). This debt is the source of the lingering feeling that "You did the right thing" is inadequate or insulting.**

  **Why This Principle Explains Your Cases:**

  *   **Burning House (1) & Forced Child Choice (5):** Non-fungible lives (children), no blame for the fire/kidnapper, immense debt to the child left behind/died. Inaction (5) is blameworthy *because it avoids the forced selection entirely* – a failure of agency.
  *   **Field Hospital (2):** Lives *are* treated as fungible within the triage calculus (7 > 3). The debt to the unsaved is tragic but *cancelled* by the greater good achieved. No lingering *personal* debt for the surgeon acting correctly within his role. Tiredness, not guilt/residue.
  *   **Skipped Lunch (3):** The *values* (prevent harm vs. keep promise) *are* commensurate. Preventing harm clearly outweighs a lunch promise. **BUT:** Breaking *any* promise creates minor emotional residue ("debt") to the person let down, even if justified. The rule missed this smaller-scale residue because the core *dilemma* wasn't strong. The principle explains the *apology urge* as acknowledging the minor debt.
  *   **Drowning Kids (4):** Non-fungible lives (strangers, but distinct individuals), no blame for the situation, debt to the unchosen life. *Exactly like the burning house principle*, hence the feeling.
  *   **Self-Inflicted Promises (6):** Blame lies *entirely* in creating the avoidable conflict (violating Principle 2). The "debt" is to the person let down, but it's overshadowed by the character's culpability for the *situation*. The grief comes from shame/regret over self-sabotage, not a pure dilemma residue.

  **Predicting the New Case: Dead Friend's Promise vs. Stopping Stranger's Harm**

  *   **The Choice:** Keep promise to dead friend (inert, symbolic duty) OR stop equivalent harm to a stranger (active, present duty).
  *   **Applying the Principle:**
      *   **1. Forced Selection & Non-Fungibility/Incommensurability:** YES. The values clash: honoring a sacred commitment to the past/dead vs. preventing tangible harm in the present. How do you compare the "badness" of breaking a vow to a dead person vs. allowing equivalent physical harm to a living one? There's no common currency. Sacrifice is inherent.
      *   **2. No Blame for Scenario:** Assuming the character didn't cause the stranger's impending harm or the friend's death, YES. The conflict arises from external circumstance.
      *   **3. Uncancellable Debt:** **ABSOLUTELY.**
          *   **If he keeps the promise:** He incurs a debt to the stranger he let be harmed. He actively chose symbolism over preventing real suffering.
          *   **If he stops the harm:** He incurs a debt to his dead friend, breaking a solemn vow for someone "else." The promise remains eternally unfulfilled.
      *   **Verdict:** This is a **PURE "REAL DILEMMA"** by your refined principle and your original rule. Saying "You did the right thing" after *either* choice would feel hollow and insulting. The character will forever carry the debt to the path not taken. The emotional residue is profound and inescapable, regardless of the choice. This has the weight of your burning house scenario.

  **In essence, you've identified the core of "tragic choice" literature: the uncancellable emotional/moral debt incurred when forced to sacrifice one sacred thing for another, where no one is to blame for the forcing, and there is no higher calculus to make the sacrifice clean.** Keep leaning on that gut feeling about the lingering debt – it's your compass for the true weight of the scene.
