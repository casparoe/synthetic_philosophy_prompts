  First, I need to test their working hypothesis against the others. Looking at the arguments from participants: proponents of different concepts often talk past each other. For example, the Biological Species Concept (BSC) focuses on reproductive isolation, while the Phylogenetic Species Concept (PSC) emphasizes monophyly. They use the same term "species" but with different criteria. That suggests a verbal dispute, but the user thinks it's deeper.

