prompt: |-
  quick question for my reading group. i've been chewing on the idea that you lose standing to blame someone if you've committed the same kind of wrong yourself (the whole hypocrisy angle). what are the most important implications of that view for public moral criticism, like a politician who got caught in a scandal but keeps lecturing about a totally unrelated moral issue? i'm especially curious whether the view can dodge the problem where moral experts end up with no standing to say anything at all.
reasoning: |-
  Okay, the user is asking about the implications of the idea that hypocrites lose standing to blame others for the same wrongs they've committed. They're focusing on public moral criticism, like a politician caught in a scandal who still lectures on unrelated moral issues. They also want to know if this view prevents moral experts from having any standing to speak.

  First, I need to break down the core concept: the standing to blame. Hypocrisy undermines a person's moral authority because their own actions contradict their words. But in public discourse, especially politics, this gets messy. The politician example is perfect—someone like a corrupt official preaching about family values. Does their past scandal mean they can't comment on unrelated issues?

  The user's deeper concern seems to be about moral experts. If experts have made past mistakes, does that silence them? That's a problem because society needs ethical guidance. The user might be worried that this view could lead to a situation where only the morally perfect can speak, which isn't practical.

  I should address the nuances. Not all criticism from hypocrites is invalid. The substance of their argument might still be correct. Also, the distinction between same and different moral failures matters. A financial scandal might not undermine their stance on environmental issues. 

  Another angle is the purpose of public criticism. Is it about accountability or moral posturing? If the goal is societal good, maybe the hypocrite's message, if valid, should still be considered. But their credibility is shot, so effectiveness is reduced.

  For moral experts, the key is whether their expertise remains despite personal failings. A recovering addict might still be a credible addiction counselor. Their past doesn't negate their knowledge. However, transparency about their failures is crucial to maintain trust.

  The user might also be interested in how to navigate these issues in their reading group. They might need discussion points or counterarguments to present. Ensuring that the view doesn't lead to silencing voices but encourages accountability without perfectionism is essential.
answer: |-
  That's a sharp question hitting at a core tension in moral philosophy and public discourse. The "hypocrisy undermines standing" view (often called the **"No Standing" or "Hypocrisy" objection to blame**) has profound implications for public moral criticism, especially in politics. Let's break down the key implications and see how the view might navigate the "moral expert" problem:

  **Core Implications for Public Moral Criticism (Like Your Politician Example):**

  1.  **Selective Silencing & Reduced Accountability:** The most direct implication is that the politician *loses the standing* to effectively blame others for the *specific type* of wrong they committed. If caught embezzling funds, their lectures on fiscal responsibility ring hollow and carry little moral weight. This can paradoxically *protect* other wrongdoers in that specific domain from legitimate criticism *from that particular hypocrite*, potentially reducing overall accountability for that specific issue.
  2.  **Erosion of Credibility on *Unrelated* Issues:** While the core view often focuses on the *same kind* of wrong, hypocrisy inevitably spills over. Even if lecturing on an *unrelated* moral issue (e.g., environmental policy after a sex scandal), the politician's general credibility and perceived moral authority are severely damaged. The public reasonably questions: "Why should we listen to *you* on *any* moral matter?" This undermines the effectiveness of *all* their moral pronouncements.
  3.  **Shift from Substance to Character:** Public discourse becomes dominated by discussions of the critic's hypocrisy rather than the substance of the issue they raised. This deflects attention from the actual moral problem they (perhaps rightly) identified. The politician's valid point about, say, poverty, gets lost in the noise about their own scandal.
  4.  **Weaponization & Bad Faith Engagement:** Opponents can exploit the "no standing" view strategically. Accusations of hypocrisy (even tangential or past) become a primary tool to *dismiss* any criticism, regardless of its merit, without engaging with the substance. This fosters a culture of deflection and "whataboutism."
  5.  **Undermining the Act of Blame Itself:** Blame serves functions beyond retribution: it affirms shared values, signals disapproval, and motivates reform. Hypocritical blame corrupts this process. It signals not shared values, but self-serving posturing or distraction. It risks making the *act* of public moral criticism itself seem cynical and manipulative.
  6.  **Potential for Positive Change (Rare):** Ironically, acknowledging hypocrisy *can* sometimes *increase* standing. If the politician publicly repents, makes amends, and *then* speaks out against the *same* wrong they committed, their past failure might lend authenticity and urgency to their message (e.g., "I know this trap; avoid it"). But this requires genuine contrition and action, not just continuing to lecture while ignoring one's own failings.

  **Dodging the "Moral Expert Muzzle" Problem:**

  This is the crucial challenge: If having committed a moral wrong (or *any* moral wrong?) removes standing, then arguably *no one* could ever legitimately blame anyone else – we've all messed up. This would silence moral criticism entirely, which is absurd and undesirable. The view *can* dodge this, but it requires careful qualification:

  1.  **Distinguishing "Standing" from "Truth" or "Permission":** The "no standing" view typically argues that the hypocrite lacks the *particular moral authority* or *position* to issue blame *effectively* or *without objection*. It **does not** mean:
      *   Their criticism is factually *false*.
      *   They are *prohibited* from speaking.
      *   Others (without that specific hypocrisy) lack standing to blame the same wrong.
      *   The target of their blame isn't actually blameworthy.
  2.  **Scope Limitation (Same Kind of Wrong):** The strongest versions limit the loss of standing to blame for the *same general type* of wrong. Committing adultery might undermine standing to blame others for infidelity, but not necessarily for environmental destruction or financial fraud (though credibility spillover remains a practical issue). Moral experts who have failed in *one* area retain standing in areas where they haven't been hypocritical.
  3.  **Repentance, Reform, and Transparency:** Standing can be regained. A moral expert who acknowledges their past wrong, demonstrates genuine repentance, takes steps to reform, and is transparent about their failures *can* regain standing, especially if their expertise lies elsewhere. Their past struggle might even inform their expertise (e.g., a recovered addict counseling others). The unrepentant, ongoing hypocrite is the primary problem.
  4.  **Focus on Current Posture & Sincerity:** Standing is undermined not merely by *past* wrongs, but by the *present* attitude of hypocrisy – blaming others while refusing to acknowledge or address similar faults in oneself, or worse, actively engaging in them. The moral expert who consistently strives for integrity and acknowledges their imperfections avoids this charge.
  5.  **Expertise vs. Moral Perfection:** Moral expertise is about understanding moral principles, reasoning, and complexities, *not* about being morally flawless. An ethicist can understand and articulate why dishonesty is wrong, even if they struggle with it personally. Their *expertise* gives them standing to explain the principles; their personal struggles might undermine their standing to *condemn others* for dishonesty *in a self-righteous way*, but not necessarily to *discuss* or *critique* it intellectually or on behalf of shared norms.
  6.  **The "Clean Hands" Requirement is Unreasonable:** Most proponents of the "no standing" view reject the idea that one must be morally perfect ("clean hands") to blame *at all*. The point is specifically about *hypocrisy* – holding others to a standard one openly flouts oneself *in the relevant domain*. Moral experts implicitly hold *themselves* to the standards they teach, even if they sometimes fail. The unrepentant hypocrite explicitly *exempts* themselves.

  **Conclusion:**

  The hypocrisy view powerfully critiques the moral authority of public figures like your scandal-plagued politician. It highlights how their own failures sabotage their credibility and effectiveness, especially on related issues, and risks deflecting from substantive debate. It forces us to consider the speaker's character alongside their message.

  Crucially, **it does *not* necessarily muzzle moral experts.** By focusing on the *specific type* of wrong, allowing for repentance and reform, distinguishing expertise from perfection, and emphasizing that "standing" is about the *position/authority* to blame effectively rather than the truth of the claim or the general right to speak, the view can avoid the absurdity of silencing all moral criticism. The moral expert's standing rests on their knowledge, commitment to principles, and integrity in *applying those principles to themselves*, not on an impossible state of sinlessness. The hypocritical politician, in contrast, reveals a fundamental lack of that integrity, stripping their moral pronouncements of genuine authority.
