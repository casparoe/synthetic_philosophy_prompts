answer: |-
  Here is a draft joint statement reflecting a good-faith adversarial collaboration between a Compatibilist (C) and a Hard Incompatibilist (HI), assuming shared acceptance of determinism. It identifies agreements, precisely frames disagreements, outlines key cruxes with test cases, and notes verbal elements.

  **Joint Statement: Compatibilist & Hard Incompatibilist Agreement Under Determinism**

  **Preamble:** We agree that causal determinism (the thesis that the state of the universe at any given time, conjoined with the laws of nature, entails every subsequent state) is true. This shared metaphysical foundation is not in dispute. Our debate concerns whether "free will" and "genuine moral responsibility" can exist within this deterministic framework.

  **Section 1: Agreed Claims (Common Ground)**

  1.  **Determinism & Action:** Human decisions and actions are causally determined outcomes of prior states (genetic, environmental, neurobiological, psychological). No event, including human choices, is causally disconnected from this chain.
  2.  **The Illusion of "Otherwise":** The robust, *categorical* "ability to have done otherwise *in the exact same circumstances*" (Libertarian Free Will) is incompatible with determinism and does not exist.
  3.  **Reality of Agency & Psychology:** Humans experience deliberation, weigh reasons, form intentions, and act upon them. These psychological processes are real, causally efficacious features of our cognitive architecture, even if determined.
  4.  **Distinction Between Compulsion & Coercion vs. "Normal" Determination:** There is a meaningful difference between actions caused by internal compulsions (e.g., severe addiction, psychosis) or external coercion (e.g., direct threat of violence) and actions stemming from an agent's unimpeded deliberation and settled desires/values, even when both are determined. This difference is sociologically and psychologically significant.
  5.  **Pragmatic Necessity of Concepts:** Concepts like "choice," "intention," "reason-responsiveness," "blame," and "praise" are pragmatically indispensable for social interaction, legal systems, moral education, and personal development. These concepts function regardless of the truth of determinism.
  6.  **"Ultimate Sourcehood" (Metaphysical) is Absent:** No human is the *metaphysically ultimate*, uncaused cause (causa sui) of their own character, desires, or choices. Our initial conditions and formative influences are beyond our control.

  **Section 2: Disagreements & Their Cruxes**

  | Feature                     | Compatibilist (C) Position                                                                                                                                 | Hard Incompatibilist (HI) Position                                                                                                                                                                                               |
  | :-------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Definition of Free Will** | "Free will" refers to the **psychological capacities** for reflective self-governance: the ability to act in accordance with one's *own* (sufficiently reasons-responsive) desires, values, and deliberations, **absent internal compulsions or external coercion.** It is compatible with determinism. | "Free will" fundamentally requires **metaphysical ultimacy** or **causal origination**: being the ultimate, non-determined source of one's choices. Without this "buck-stopping" origin, control is merely derivative and insufficient for true freedom. Incompatible with determinism. |
  | **2. Grounds Moral Responsibility?** | **Yes.** Genuine moral responsibility (making praise/blame *fair* and *deserved*) is grounded in the **agent's psychological capacities and the quality of their practical reasoning** (as defined above). Determinism does not undermine this. | **No.** Genuine moral responsibility (making praise/blame *fair* and *deserved*) requires **ultimate responsibility** for being the kind of person who makes those choices. Without ultimacy, blame/praise is merely causal assessment or behavioral modification, not *deserved* in a deep, non-instrumental sense. |
  | **3. Ability to Do Otherwise (Crux 1)** | **Not Required** for free will/responsibility *in the categorical sense*. What matters is the **actual causal pathway** of the action (reasons-responsive, uncoerced). A **conditional** "could have done otherwise" (e.g., *if* they had wanted to, *if* reasons were different) is sufficient and compatible with determinism. | **Required** for free will/responsibility. The *categorical* "ability to do otherwise in the exact same circumstances" is essential for genuine alternative possibilities and ultimate control. Its absence under determinism is fatal. The conditional sense is irrelevant to freedom/responsibility. |
  | **4. Purpose of Free Will (Crux 2)** | Free will is the capacity that makes an agent **a fitting subject for moral appraisal and reactive attitudes (resentment, gratitude)** based on the quality of their will and reasoning. It makes praise/blame *fair* in the context of human social life and agency. | Free will is the capacity that makes an agent the **ultimate author and originator of their life's path**, ensuring their choices and life are *truly up to them* in a way that grounds non-instrumental desert. It makes life genuinely "ours." |

  **Section 3: Cruxes – Concrete Cases & Predictions**

  *   **Crux 1: Is the Categorical Ability to Do Otherwise Necessary?**
      *   **Case: Jones Decides to Steal.** Jones, a person with normal psychological capacities (no compulsion/coercion), carefully considers stealing a wallet. He desires the money, outweighs the moral reasons against it, and steals. Determinism is true; given the exact prior state of the universe and laws, only this outcome was possible.
      *   **C Prediction/Conclusion:** Jones acted freely and is morally responsible. His action flowed from *his* desires/reasoning via a reasons-responsive mechanism. The *categorical* inability to do otherwise is irrelevant; the *conditional* ability (he *could have* refrained *if* his desires/reasons had been different) captures what matters for responsibility.
      *   **HI Prediction/Conclusion:** Jones did *not* act freely and is not morally responsible in the ultimate desert sense. The fact that he *could not have done otherwise* in those exact circumstances means he lacked true control. He was merely playing out the inevitable script. Blame might be pragmatically useful but is not *fairly deserved*.

  *   **Crux 2: What is Free Will *For*? (Grounding Responsibility vs. Ultimate Authorship)**
      *   **Case: Frank Jackson's "Moral Saint & Sinner."** Imagine two agents raised in identical deterministic environments. "Saint" develops a strong, stable character leading to consistently virtuous choices. "Sinner" develops a strong, stable character leading to consistently vicious choices. Neither could have developed differently given their starting conditions and determinism. Both possess robust C-style free will (reasons-responsive, uncoerced actions).
      *   **C Conclusion:** Both Saint and Sinner are morally responsible for their actions. Praising Saint and blaming Sinner is fair and justified *based on the quality of their will and actions* they actually express, regardless of the deterministic origins of their characters. This is what responsibility *is*.
      *   **HI Conclusion:** Neither Saint nor Sinner is *ultimately* morally responsible. They are merely fortunate or unfortunate products of forces beyond their ultimate control. While we might instrumentally praise Saint (to encourage virtue) and blame Sinner (to deter vice), neither *deserves* these reactions in a deep, non-instrumental sense. Their lives were not *truly up to them* in the way required for ultimate authorship and desert. Praise/blame reflects their causal history, not ultimate self-creation.

  **Section 4: Verbal Disagreement**

  We acknowledge a significant **verbal** element in the dispute over the term "free will" itself:
  *   **C** uses "free will" to denote **a high-level psychological capacity of agents** that has evolved and is recognizably distinct from compulsion/coercion.
  *   **HI** uses "free will" to denote **a specific, metaphysically robust type of causal power** (ultimate sourcehood).
  *   **Why it's Verbal:** Both sides can agree that the *psychological capacities* C describes exist and are important. The disagreement is whether labeling this complex of capacities "free will" is appropriate *given the historical and intuitive connotations* of that term, which HI argues are inextricably tied to ultimacy and categorical alternative possibilities. C argues these connotations are misplaced and the term is best applied to the psychological capacities relevant to moral life within a determined world. **The core *substantive* disagreement lies in the nature and grounds of *genuine moral responsibility/desert* (Section 2.2, 2.4, Crux 2), not just in the label.**

  **Conclusion:** Our collaboration reveals that while we share significant common ground under determinism (Section 1), the core disagreements hinge on two fundamental, interlinked cruxes: the necessity of the categorical ability to do otherwise (Crux 1) and the *purpose* or *defining function* of free will – whether it grounds fair appraisal based on expressed agency (C) or ultimate authorship grounding non-instrumental desert (HI) (Crux 2). Resolving the debate would require either: 1) Convincing arguments that one conception of moral responsibility/desert is fundamentally incoherent or misaligned with core moral intuitions, or 2) A decisive argument showing that the psychological capacities described by C either do, or do not, satisfy the conditions for the kind of authorship HI deems essential. The verbal dispute over "free will" persists but is secondary to these deeper issues concerning responsibility and desert.
