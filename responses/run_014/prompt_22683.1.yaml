  Another idea: autonomous systems. A self-driving car causes an accident. Is the car the agent or the instrument? If it's an instrument, the manufacturer or programmer might be liable. If it's an agent, maybe not. But that's still about responsibility attribution.

  Wait, the user mentioned wanting a case where reasoning changes, not just wording. So perhaps a scientific example. In determinism vs. indeterminism. If particles are instruments, their behavior is determined by laws, which are instruments of God. But if particles are agents, they have inherent causality. But does that change scientific reasoning? Not really, since science operates on observable causality.

  Back to law. The Nuremberg Trials. Following orders: soldiers as instruments vs. agents. The defense was "I was just following orders," implying they were instruments. But the tribunal established that individuals are moral agents, so they can't evade responsibility. The distinction changed legal outcomes.

  That's solid. The soldier's defense claims they're an instrument of superiors. Rejecting that makes them agents, thus responsible. The distinction isn't just semantic; it affects guilt and punishment. Marcus might say it's still about who caused the action. The key is that considering the soldier as an agent attributes responsibility to them, whereas seeing them as an instrument shifts it to the commander.

  In Ghazali's terms, if the commander is the agent and the soldier an instrument, the commander bears responsibility. But if both are instruments of God, then responsibility is divine. However, in secular law, recognizing human agency is crucial for justice. So the distinction prevents diffusing responsibility.

