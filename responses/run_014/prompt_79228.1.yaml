answer: |-
  ### Exam Question  
  **PHIL 499: Advanced Topics in Free Will**  
  *Answer ONE question. Time allowed: 90 minutes.*  

  **Question 2.**  
  Galen Strawson’s Basic Argument concludes that moral responsibility is impossible. It is widely accepted that the argument does not depend on determinism and that introducing indeterminacy or agent-causation fails to resolve its regress. Yet some philosophers insist the argument only undermines a highly specific—and rarely held—conception of responsibility.  

  Suppose a person, throughout her adult life, deliberately reshapes her core values using a reflective procedure she designed, with each change fully endorsed by her values at that time. She is, intuitively, the "author" of who she becomes.  

  Does the Basic Argument show that *no agent in any possible world* could be morally responsible, or does it only demonstrate the incoherence of demanding that agents be "causa sui"? In your answer, address:  
  - Why the argument’s force is independent of determinism, and what this implies for responsibility under indeterminism;  
  - Whether agent-causation or undetermined choices could genuinely terminate the regress, or merely disguise it;  
  - Why the case of cumulative self-revision described above either escapes the regress or confirms its inevitability;  
  - Whether the argument proves responsibility is *impossible* or reveals a *conceptual flaw* in one model of responsibility, and why this distinction matters;  
  - What a defender of moral responsibility must establish about the type of responsibility threatened by the argument, given that it would rule out responsibility for any conceivable agent, human or otherwise.  

  ---

  ### Model Answer (Strong Student Response, ~700 words)  
  Strawson’s Basic Argument claims moral responsibility requires being *ultimately responsible* for one’s character—but since one’s character is always shaped by factors beyond one’s control (genetics, upbringing, prior choices), an infinite regress ensues. Crucially, this regress arises *regardless* of determinism’s truth. If determinism holds, all actions trace to unchosen causes; if indeterminism holds, random events (e.g., quantum fluctuations in decision-making) intrude, making outcomes partly arbitrary rather than self-authored. Thus, determinism-independence shows the problem isn’t causal necessity but *sourcehood*: responsibility demands self-creation no agent can achieve. This voids *all* responsibility if self-creation is essential—but perhaps it is not.  

  Introducing agent-causation or indeterminacy fails. Agent-causation posits a "self" causing choices independently of prior states. Yet this self must itself have features (reasons, dispositions) it did not choose, restarting the regress. If the agent-cause is featureless, its "choices" are inexplicable, collapsing into randomness. Indeterminacy fares worse: an undetermined neural event might break causal chains, but it does not supply *authorship*. If my choice indeterministically deviates from my values, it reflects luck, not control. Relocating the regress (e.g., "the self causes undetermined acts") still demands the self be self-made.  

  The cumulative self-reviser appears to break the regress. She designs her value-revision procedure (e.g., deliberate exposure to new experiences guided by current values), and each step is endorsed by her then-present self. Yet Strawson’s regress persists: *why* did she initially possess values that motivated self-revision? Her "original" values (e.g., openness to growth) were given, not chosen. Later revisions depend on earlier unchosen traits. Even if she remade herself "from scratch" at each stage, she did so using tools she inherited. True self-creation—creating the creator—remains illusory. The regress isn’t temporal but metaphysical: authorship requires a starting point exempt from prior influence, which is impossible.  

  This reveals the argument’s core ambiguity. It *proves* that "causa sui" responsibility (total self-creation) is incoherent. But it only *assumes* that all responsibility requires causa sui. If responsibility merely requires reasons-responsiveness (e.g., acting for motives one accepts *now*), the regress is irrelevant. The distinction matters because conflating impossibility with incoherence misdiagnoses the threat. If responsibility requires causa sui, the argument shows it cannot exist. But if it requires weaker conditions (e.g., identification with one’s motives), the argument merely cautions against overreaching demands for ultimacy.  

  Consequently, responsibility’s defender must deny that causa sui is necessary. The argument threatens *all* agents (even gods—who must have uncreated natures) only if self-creation is non-negotiable. To resist this, one must ground responsibility in non-ultimate conditions: e.g., the capacity to act on reflectively endorsed desires, regardless of their origins. This concedes that we are not "authors of ourselves" but insists we are *agents* who own our actions through contemporary psychology. The Basic Argument then becomes a critique of hubris, not agency—exposing a flawed ideal, not a universal impossibility.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **Marks** | **Required Move** | **Characteristic Error (Costs Marks)**  
  ---|---|---  
  **3** | **Explains determinism-independence correctly:** Clarifies that the regress arises from *source incompleteness*, not causal necessity, making responsibility impossible under both determinism and indeterminism. | Treating the argument as primarily about determinism (e.g., "indeterminism solves it") or conflating it with the Consequence Argument. (-2)  
  **4** | **Analyzes agent-causation/indeterminacy:** Shows these relocate but cannot resolve the regress, as they still require the *agent/self* to be self-created. | Claiming undetermined choices supply authorship (e.g., "randomness = control") or treating agent-causation as exempt from the regress without justification. (-2)  
  **4** | **Engages self-revision case:** Explains why incremental self-change fails—each step relies on unchosen prior traits—confirming the regress is about *original sources*, not effort. | Asserting that cumulative choice terminates the regress without addressing the origin of initial values/revision motives. (-3)  
  **4** | **Distinguishes impossibility vs. incoherence:** Notes the argument proves causa sui incoherence but *assumes* it is essential to responsibility; distinguishes this from denying responsibility exists. | Conflating conceptual incoherence with empirical impossibility (e.g., "it proves we aren’t responsible"). (-3)  
  **5** | **Defends responsibility plausibly:** Argues that rejecting causa sui allows non-ultimate responsibility (e.g., based on current endorsement), and explains why this isn’t refuted by the argument. | Ignoring universality (e.g., "humans are special") or failing to specify an alternative model. (-3)  
  **3** | **Structure & Clarity:** Logical flow, precise terminology, addresses all sub-questions. | Disjointed reasoning, undefined terms (e.g., "authorship"), or omitted sub-questions. (-2)  
  **2** | **Originality/Insight:** Synthesizes points (e.g., linking self-revision to universality) or notes implications (e.g., "the argument sets an impossible standard"). | Purely descriptive summary of Strawson. (-1)  

  **Note:** Top answers (21–25) must reject recitation by *interrogating premises* (e.g., "Does responsibility *really* require causa sui?") and *offer positive alternatives*. Mid-range answers (11–20) often correctly diagnose the regress but miss its contingent target. Weak answers (<10) recite the argument or fixate on determinism/randomness.
