prompt: |-
  I'm putting together a two-page proposal for a one-year postdoc fellowship in philosophy of science, and I have a half-formed idea I need help turning into something I can actually defend in an application. I was re-reading the structural realism literature last week and it just clicked for me: the "disastrous defeat" argument — the one where scientific realism keeps losing its objects (ether, caloric, phlogiston) but the equations and relations seem to survive — is doing a lot of quiet, unexamined work on the notion of "preservation" across theory change, and nobodys really pinned down what that notion is. My working suspicion is that once you make it explicit, the argument either collapses into something trivial (just "some content survives," which isn't a substantive metaphysical claim at all) or it quietly requires a theory of intertheoretic correspondence that the structural realists never actually provide.

  So I want the proposal to do three things. First, state the "preservation" assumption precisely and show that both the epistemic structural realists (the "we can only know structure, not objects" camp) and the ontic structural realists (the "the world is fundamentally structure" camp) rely on it without ever defending it. Second, argue for a specific account of preservation — my hunch is that the preserved structure is the part that does the explanatory work in the successor theory, not just the part that has the same formal shape — and show that this account either answers the standard deflationary objection or at least relocates it somewhere more interesting. Third, be honest about the scope: a precise statement of the question, why the existing positions leave it open, a month-by-month method for the year, and what would actually count as the project failing. Don't bother with citations or a reading list, I'll add those myself once I have the shape of the thing.
