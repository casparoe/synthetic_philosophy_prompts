answer: |-
  Below is a rigorous, practice-tethered analysis of the metaphysics implicit in Ulysses contracts, designed for your physician and law student audience. I’ll proceed as requested: reconstructing the implicit theory of self, evaluating Dennett’s model, diagnosing the refusal/request asymmetry, and proposing alternatives if needed.

  ---

  ### **1. The Implicit Theory of Self in Ulysses Contracts**  
  The enforcement of Ulysses contracts presupposes a **diachronic, hierarchical model of the self** grounded in **psychological continuity** and **narrative authority**, but it is philosophically underdetermined in key ways.  

  - **Core Commitment**: The practice requires that the *lucid past self* and the *psychotic current self* are numerically identical (the "same person") **if** there exists a robust causal and qualitative connection between their mental states. This leans on a Lockean/Parfitian psychological continuity view: identity persists through psychosis because the earlier self’s values, fears, and rational judgments *cause and explain* the directive, and the current self’s refusal is seen as a *temporary discontinuity* in an otherwise intact chain.  
    - *Concrete Anchor*: Clinicians assess whether the patient’s refusal stems from psychosis-induced distortions (e.g., paranoia overriding known values), implying that the "real" self persists beneath symptoms.  

  - **Underdetermined Elements**:  
    - **Minimal vs. Rich Continuity**: The practice works with *either* a minimal Parfitian view (continuity of connected mental states) *or* a Schechtman-style narrative view (the directive preserves the life story). What matters is that psychosis is framed as an *interruption*, not a cessation, of identity.  
    - **Hierarchy of Selves**: The past self is privileged not merely because it is continuous, but because it is **competent**. This smuggles in a normative claim: the rational self has authority over the irrational self, as the latter cannot access its "true" interests.  
    - **What’s NOT Required**: The practice does *not* require a Cartesian enduring ego. It can accommodate a bundle theory if one bundle (the rational self) is deemed authoritative.  

  **Philosophical Tension Point**: Enforcement becomes arbitrary if psychological continuity is *severed* (e.g., late-stage dementia). Here, the practice implicitly relies on a threshold: continuity must be sufficiently preserved to treat the directive as an expression of the *same* agent’s will.  

  ---

  ### **2. Dennett’s "Center of Narrative Gravity" Test**  
  Dennett’s model *initially* supports Ulysses contracts but ultimately destabilizes the privileging of the past self.  

  - **Pro-Directive Reading**: The "center of narrative gravity" is the locus of self-interpretation. The lucid self, as the primary narrator, structures the story by anticipating psychosis as a "plot twist" to be managed. Honoring the directive maintains narrative coherence across time, treating the psychotic self as a *character* whose lines are scripted by the narrator.  
    - *Clinical Correlate*: The directive is a "metanarrative" that contextualizes refusal as part of a larger arc (e.g., *"When I scream not to medicate me, that’s the illness talking — my true self wrote this directive for that moment"*).  

  - **Anti-Privileging Problem**: If both moments are equally "chapters," why favor Chapter 1 over Chapter 5? The psychotic self *also* generates a narrative (e.g., *"They’re poisoning me"*), and Dennett offers no metric to rank narratives. **The asymmetry looks arbitrary** because:  
    - The past self’s "authority" relies on competence, not narrative primacy.  
    - Dennett’s theory dissolves a stable self, making it unclear *whose* narrative matters when the center shifts.  

  **Verdict**: Dennett’s model *describes* why we use directives (to preserve narrative unity) but cannot *justify* overriding current refusal without importing competence-based hierarchies.  

  ---

  ### **3. The Asymmetry Problem: Can It Be Resolved?**  
  The preferential enforcement of advance refusals (e.g., in dementia) over advance requests (e.g., in psychosis) **cannot be justified by a consistent theory of personal identity**. It rests on unexamined intuitions about suffering, agency, and "loss of self."  

  - **The Inconsistency Exposed**:  
    | **Scenario** | **Advance Directive Type** | **Current State** | **Typical Enforcement** | **Implied View of Self** |  
    |--------------|----------------------------|------------------|-------------------------|--------------------------|  
    | **Dementia** | Refusal (e.g., no feeding tube) | Contentedly requests food | Honored | "Biographical self" is gone; current self is a non-agent |  
    | **Psychosis** | Request (e.g., administer antipsychotics) | Refuses treatment | Often ignored | Current self is a "distorted but present" agent |  

  - **Why Theories Fail**:  
    - **Psychological Continuity**: If continuity is *more* disrupted in late dementia than in acute psychosis, why honor the past self’s refusal *more* robustly? This contradicts the theory’s own logic.  
    - **Narrative Views**: If dementia "ends" the narrative, why bind the current self to the past? If psychosis is a "chapter," why not bind it to the past?  
    - **Hidden Normative Commitments**: The asymmetry reveals clinical intuitions about **harm prevention** and **irreversibility**:  
      - *Force-feeding a contented dementia patient* feels like violating a harmless existence.  
      *Overriding refusal in psychosis* feels like violating a "present" agent, even if irrational.  
    - **Capacity Doctrine’s Shadow**: Competent refusals are sacrosanct in law. In psychosis, refusal *appears* competent (internally consistent, emotional); in dementia, it often doesn’t. But this confuses *appearance* with *underlying capacity*.  

  **Conclusion**: The asymmetry is not philosophically coherent. It reflects pragmatic discomfort with inflicting *felt* harm on a resisting agent versus *abstract* harm on a passive one.  

  ---

  ### **4. If Personal Identity Fails: Toward a Coherent Policy**  
  No theory of personal identity can fully ground these practices. Instead, a defensible policy must:  

  - **Abandon Identity as the Justification**: Shift focus to **best interests**, **harm reduction**, and **regret minimization**.  
    - *For Ulysses Contracts*: Enforce directives only if:  
      (a) The treatment *has high likelihood of restoring competence* (e.g., antipsychotics in bipolar mania).  
      (b) The past self *anticipated specific scenarios* (e.g., "If I claim the CIA implanted chips, medicate me").  
      (c) The current refusal *directly contradicts stable, pre-illness values* (e.g., a lifelong pacifist violent in psychosis).  
    - *For Advance Refusals*: Uphold them only when current wishes *cannot be authenticated* (e.g., no evidence of new values in dementia).  

  - **Address the Asymmetry via Agency**:  
    - **Psychosis**: Current refusal is resisted because the patient retains *moral agency* (e.g., capacity for suffering, relational engagement).  
    - **Dementia**: Enforcing refusal respects the *irreversible loss of agency*, avoiding futile interventions.  
    - *Policy Fix*: Treat advance requests as *rebuttable* (current dissent weighs heavily) and advance refusals as *conclusive* (unless current self shows new competently formed preferences).  

  - **Clinical Translation**:  
    - Train clinicians to map past values to current crises (e.g., "Would her lucid self see this refusal as illness-driven?").  
    - Require specificity in directives: *"When I refuse medication during mania, it’s not me"* is metaphysical; *"When my speech is pressured and I sleep <2 hours/night, override refusal"* is clinical.  

  ---

  **Final Summary for Your Lecture**:  
  Ulysses contracts covertly assume a psychological continuity view where the rational self "owns" future irrational selves. Dennett’s narrative model describes but cannot justify this. The refusal/request asymmetry exposes clinical intuitions about agency, not philosophical coherence. Policy should prioritize harm prevention and value consistency over metaphysical claims. **Tell your students**: "We’re not deciding who the ‘real self’ is. We’re preventing the person from betraying what they care about most—when they’re too ill to protect it themselves."  

  Would you like tailored case examples or slides on the capacity-assessment protocols?
