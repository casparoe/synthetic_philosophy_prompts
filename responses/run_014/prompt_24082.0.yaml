  ## The Hollow Core? Rorty's Antirepresentationalism and the Specter of Circular Progress

  Richard Rorty’s neopragmatism offers a bracing vision: liberating philosophy from the quest for foundations by abandoning the “mirror of nature” metaphor. Truth becomes what is “good for *us* to believe,” justification a matter of social solidarity, and moral-political progress a contingent achievement through persuasive redescription within evolving communities. Yet, at the heart of this project lies a persistent and troubling internal tension: Can Rorty consistently account for moral progress when the very vocabulary justifying existing practices is itself the source of profound harm? If justification rests solely on solidarity and the success defined *by the community currently in power*, and truth lacks any grounding beyond what that community finds useful, how can critiques aimed at dismantling oppressive structures avoid merely reflecting a new form of rhetorical dominance or subjective preference? This essay argues that while Rorty possesses resources to deflect some criticisms, his rigorous antirepresentationalism ultimately renders a *non-circular* account of progress impossible, particularly in the face of deeply embedded harmful norms, demanding a revision of his framework to incorporate a minimal, non-metaphysical grounding for normative critique.

  **The Worry: Progress Trapped in the Vocabulary of Power**

  The core objection is stark. Rorty dissolves truth into justification, and justification into social practices achieving solidarity through redescriptive “conversation.” Progress occurs when a new vocabulary “catches on,” solving problems the old vocabulary couldn’t handle, leading to more successful (e.g., peaceful, prosperous) practices. But when the harm *stems* from the community’s foundational moral vocabulary – its conception of who counts as fully human, what constitutes legitimate suffering, or what forms of life are valuable – the circularity becomes vicious.

  1.  **Normative Force of Redescription:** How can redescription possess normative force beyond rhetorical effectiveness? If the old vocabulary defines what counts as "harm" or "success," a new redescription (e.g., framing slavery as a violation of universal personhood rather than a natural hierarchy) only gains traction if it resonates with *some* latent value or dissatisfaction *within the existing framework*, or simply overwhelms through rhetorical power. If it succeeds, it appears progressive; if it fails, it seems misguided. But without an independent criterion, we cannot distinguish a genuinely liberating redescription (expanding the "us" in solidarity) from one that merely manipulates emotions or entrenches a different form of exclusion under a new banner (e.g., replacing overt racism with subtler systemic bias justified by "meritocracy"). Rorty’s appeal to reducing "suffering" seems key, but what defines suffering? The old vocabulary might exclude certain pains (e.g., the humiliation of subordination) from recognition. Redescription makes us *see* new sufferings, but its justification seems parasitic on the new vocabulary taking hold, not on an independent reality of harm.
  2.  **Smuggling in Standards?** Rorty frequently invokes reduced suffering, expanded agency, or broader sympathy as hallmarks of progress. The critic argues these *are* smuggled-in naturalistic or representationalist standards. "Suffering" appears to name a mind-independent experiential reality; "agency" implies a capacity inherent to beings that should be respected; "sympathy" suggests an objective moral sentiment we *ought* to cultivate. If these terms merely reflect *our current* contingent preferences within liberal culture (as Rorty sometimes suggests), they lose critical bite against illiberal communities. If they are meant to be trans-vocabulary touchstones, they reintroduce precisely the kind of representationalist anchor Rorty rejects. Can "suffering" be both a brute experiential fact *and* only recognizable/justifiable within a specific vocabulary? Rorty seems to want it both ways.
  3.  **The Irony of Irony:** Rorty’s "liberal ironist" recognizes the contingency of their own vocabulary while hoping for less cruelty. But does this irony provide critical leverage? Irony only destabilizes if the audience already shares the ironist's doubt about final vocabularies and values the reduction of cruelty. To the deeply committed traditionalist, irony is mere frivolity or blasphemy. Hope is not an argument. Anti-foundationalism explains *why* foundations are unavailable, but it doesn't provide a tool to dismantle a functioning (albeit oppressive) vocabulary *from the outside*. The critique only seems persuasive *within* communities already predisposed to Rortyan liberalism. Against a community whose solidarity is built on rigid hierarchy and sees suffering as purification or deserved, the ironist has no non-circular ground to stand on. Their appeal to "our" hope for less suffering simply begs the question against "their" definition of what suffering matters and whose suffering counts.
  4.  **Redescription vs. Recognition:** This leads to the crucial distinction. Can Rorty differentiate between a redescription that merely *alters feelings* about a practice (e.g., framing colonialism as a "civilizing mission" to assuage guilt) and one that fundamentally *changes what we recognize as harm* (e.g., redescribing colonialism as violent exploitation and cultural destruction)? The latter seems like genuine progress. But Rorty’s framework struggles to mark this distinction normatively. Both are shifts in vocabulary achieving solidarity. The "recognition of harm" only happens *within* and *because of* the new vocabulary. There is no "harm-in-itself" prior to description that the new language "gets right" and the old one "gets wrong." The best Rorty can say is that the new description leads to practices *we* (now) find less cruel and more inclusive. But this "we" is the product of the change, not its independent judge.

  **Rorty's Defenses: Contingency, Consequences, and Conversation**

  Rorty's defenders can mount robust counterarguments:

  1.  **Progress as Problem-Solving Immanence:** Progress isn't judged against an external standard, but immanently, by solving problems *generated by the old vocabulary's own failures*. Slavery became a "problem" for societies professing equality before the law or Christian brotherhood. The contradictions and practical failures (resistance, economic inefficiencies) within the existing framework create the space for persuasive redescription. The new vocabulary isn't justified by correspondence but by its ability to resolve these immanent tensions and produce more stable, less conflicted, and more expansive forms of solidarity. The "normative force" comes from the practical failure of the old and the perceived promise of the new.
  2.  **Suffering as Pragmatic, Not Metaphysical:** Appeals to suffering aren't smuggled metaphysics but pragmatic tools *within our form of life*. While "suffering" isn't a mind-independent moral fact, the *capacity* for suffering is a pervasive biological fact about humans and other sentient beings. Redescriptions that make us aware of previously ignored suffering and motivate its reduction are "better" because they align with a deep, shared human aversion to pain – not as a foundation, but as a pervasive feature of our existence that shapes what we find persuasive. Reducing recognizably *brute* suffering (physical agony, starvation) provides a minimal, non-representationalist criterion that transcends specific vocabularies, even if interpretations of complex harms remain contingent.
  3.  **Solidarity as Expansive, Not Static:** The "success" of a community's practices isn't defined solely by the powerful. Rorty’s vision of redescription aims precisely at expanding the "we" of solidarity. The persuasive force of redescribing marginalized groups as fellow sufferers, capable of agency and deserving of sympathy, works by *creating* wider solidarity, not just reflecting it. The normative force lies in the *direction* of the change – towards greater inclusivity and less avoidable pain – even if the justification remains internal to the evolving conversation.
  4.  **Irony as Critical Leverage:** Irony *can* be critical leverage, not by appealing to foundations, but by exposing the *contingency* of the dominant vocabulary. Faced with a rigid hierarchy, the ironist doesn't cite natural rights but asks, "Why *this* hierarchy? What work does it do? Could we imagine a different way that causes less pain?" This doesn't guarantee persuasion but offers a destabilizing perspective rooted in the possibility of alternative descriptions and the observable consequences of the status quo. Hope fuels the search for less cruel alternatives.

  **The Verdict: The Inescapable Need for Grounding**

  While Rorty's defenses highlight the dynamic, problem-solving nature of his pragmatism and offer a plausible account of how progress *happens* historically, they ultimately fail to resolve the circularity problem in a way consistent with *rigorous* antirepresentationalism when confronting foundational harm.

  1.  **Immanence Hits a Wall:** Relying on immanent contradictions assumes the oppressive vocabulary *contains* the seeds of its own critique (e.g., ideals of equality). But many oppressive systems are remarkably stable and self-justifying, defining equality narrowly or valuing hierarchy intrinsically. Where is the immanent critique for a caste system viewed as divinely ordained and essential for cosmic order? Rorty's appeal to "brute suffering" as a pragmatic lever becomes essential here, but it strains his antirepresentationalism. If the capacity for suffering compels recognition *across* vocabularies in a way that isn't merely rhetorical, it functions as a minimal experiential grounding – a weak form of representation or naturalism.
  2.  **The "We" Problem Persists:** The expansion of solidarity is central, but *why* is this expansion "progress"? Rorty can only answer: because it leads to less cruelty, as defined by the *expanded* community. But this is circular. The progress consists in creating a community that calls it progress. Without an independent reason why inclusivity and suffering-reduction are *better* than exclusivity and inflicted suffering (beyond our current preference for them), the charge of merely flattering the new audience stands. Appeals to "what works better for more people" presuppose that inclusivity and reduced suffering are the goals, which is precisely what needs justifying against communities with different goals.
  3.  **Distinguishing Harm Remains Elusive:** Rorty cannot provide a non-circular, normative distinction between redescriptions that merely shift feelings and those that reveal "true" harm, because "true harm" has no place in his ontology. Both are just more or less successful linguistic moves. The sense that recognizing colonial exploitation as harm is fundamentally different morally from redescribing it as benign paternalism relies on an intuition that some sufferings *demand* recognition – an intuition that points towards a minimal realism about human experience that Rorty rejects.

  **Conclusion: Revising the Antirepresentationalist Stance**

  Therefore, Rorty's rigorously consistent antirepresentationalism cannot provide a non-circular account of moral progress when the existing moral vocabulary is itself the source of harm. The resources of irony, redescription, and appeals to suffering are powerful tools for *achieving* change within receptive or unstable contexts, but they cannot *normatively ground* that change as progress without implicitly relying on standards – like the inherent disvalue of avoidable suffering or the inherent worth of expanding agency – that function as weak naturalistic or experiential anchors. These anchors are not "representations" of mind-independent moral facts in a strong Platonic sense, but they are more than mere preferences; they are deep-seated features of the human condition that constrain what can count as successful justification, even within contingent vocabularies.

  The best response is not to abandon pragmatism or the vital insights of contingency and social justification, but to revise Rorty's antirepresentationalism. A coherent neopragmatist account of moral progress requires acknowledging a minimal, non-metaphysical grounding in the shared vulnerabilities and capacities of human experience (suffering, agency, the need for recognition). This grounding doesn't provide infallible foundations or dictate specific moral rules, but it offers a necessary constraint and a source of normative traction. It explains *why* redescriptions that expand solidarity and reduce recognizably brute suffering possess a different *kind* of normative force than mere rhetorical flourishes or shifts in preference – a force rooted in something deeper than the current conversation, even if our understanding of it remains fallible and contingent. Without this anchor, Rorty's vision of progress risks collapsing into a potentially endless, normatively hollow conversation where the only measure of "better" is who won the last round of redescription. We can retain Rorty’s powerful critique of metaphysics and his focus on social practice while recognizing that the struggle against cruelty draws strength from more than just the persuasive power of our latest vocabulary. It draws on the shared, palpable reality of the pain we seek to alleviate.
