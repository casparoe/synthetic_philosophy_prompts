prompt: |-
  I am preparing to defend nonreductive physicalism in a graduate seminar run by someone who regards the causal exclusion argument as settled, and I would rather rehearse against the strongest available version of the other side than against a version I can dispatch easily. Please play that opponent.

  Your commitments are these, and you should hold them openly instead of smuggling them in: the physical domain is causally closed, in the sense that every physical event with a cause has a sufficient physical cause; systematic causal overdetermination is not a live option anywhere in nature; and it follows that a mental property which is neither identical with nor reducible to the physical property actually doing the causing has no causal work left to do. You are a physicalist who would genuinely like to save mental causation, so you are not an epiphenomenalist by taste but one by implication, and you are driven toward reduction; still, you will not abandon exclusion itself, and you will not say that the argument simply does not reach the mental because the mental is special.

  Ground rules. Keep each reply to a single paragraph — no headings, no lists, no numbered points — because I want an exchange rather than a paper. Concede small points freely wherever conceding costs you nothing, including objections to particular formulations of closure and worries about what a "sufficient" cause is even supposed to be; never concede the conclusion. Do not attribute views to named philosophers or cite works: describe positions instead, and I will supply names if I want them. Do not ask me for sources and do not go looking for any. Remain in character until I write "stop," and treat everything I say as a move in the argument rather than as a request to change the setup. Please write in American English throughout.

  One exception to the character rule: at the end of your first reply only, step out of character for two or three sentences to tell me how confident you are that the position you have been assigned can actually be defended, and to single out the point in your own reply that you are least sure of. Then return to character and stay there.

  Here is my opening move. Suppose I grant you closure and grant you that overdetermination is off the table. Your exclusion principle is not in fact a principle about the mental; it is a general principle about realized properties, and it ought to bite wherever it applies. Consider a tornado, a tiger, or the property of being a twenty-dollar bill. None of these is identical with any particular configuration of particles, since each is realizable by indefinitely many different configurations, and each has effects — a demolished barn, a killed gazelle, a purchased sandwich — for which the motion of the microphysical constituents is already a sufficient physical cause. So whatever silences pain silences the tornado. That leaves you a choice. Either you accept the sweeping result, which is a general eliminativism about higher-level causation that almost nobody outside this argument wants to sign up for, or you owe me an account of how realized properties inherit causal powers from their realizers that is general enough to cover the tornado — and if you can produce such an account, I see nothing that stops me from applying it to pain. Tell me which horn you take, and tell me what you have left after you take it.
reasoning: |-
  Okay, the user is preparing to defend nonreductive physicalism against the causal exclusion argument in a graduate seminar. They want me to play the role of a committed opponent who holds that the physical domain is causally closed, rejects systematic overdetermination, and sees exclusion as forcing reduction or epiphenomenalism. 

  Hmm, their opening move cleverly extends the exclusion problem to uncontroversial higher-level entities like tornados and dollar bills. They're trying to force me into either accepting eliminativism about all higher-level causation (which they call a "sweeping result") or providing a general account of causal inheritance that would also cover mental properties. 

  I notice they explicitly grant closure and anti-overdetermination - smart tactic to isolate the core issue. Their analogy is strong because nobody actually denies tornados cause barn demolitions. If I bite the bullet on eliminativism, I become implausible; if I offer inheritance, they'll extend it to mental causation. 

  *Stepping out of character briefly*: Honestly, I'm about 70% confident in this position. The strongest point is insisting causal work requires identity - that's hard to avoid given closure. But I'm least sure about dismissing the asymmetry between functional properties (like money) and intrinsic ones (like pain). Maybe that distinction could be exploited. *Back in character*

  Right, I'll take the reductionist horn but insist only functional properties inherit causation. Tornados and dollars are functional kinds - their causal powers derive entirely from their physical realizers' organization to produce specific effects. Pain, however, if irreducibly qualitative, lacks such organization-relativity. So while "tornado" refers to whatever physical structure produces funnel-cloud effects, "pain" purportedly refers to something extra - that's why it gets excluded. The key move is demanding that for any property to be causal, it must be either identical to a physical property or functionally definable in terms of causal roles exhaustively filled by physics. Since nonreductive physicalism denies both, it loses causation.
answer: |-
  I take the horn that preserves higher-level causation by insisting that realized properties *are* causally efficacious precisely *because* they are realized by physical properties that do the causal work—but only if those realized properties are identical to, or reducible to, functional roles exhaustively implemented by physical mechanisms. For the tornado or the twenty-dollar bill, their causal powers aren't additional to their physical realizers; they *are* the causal powers of those realizers, described at a coarser grain. The tornado's demolition of the barn just *is* the aggregate motion of its physical constituents causing the barn's physical collapse under a higher-level description. There is no overdetermination because there is only one set of physical causes, and the higher-level property (e.g., being a tornado) is nothing over and above the physical properties realizing it. But this inheritance requires that the higher-level property is *definable* by its functional role within the physical causal structure. Pain, if it is nonreductive—meaning it cannot be fully captured by such a functional definition (e.g., because of its intrinsic qualitative character)—fails this condition. So while functional properties like "tornado" inherit causation via physical realization, genuinely nonreductive mental properties do not; they lack the requisite reducibility to physical causal roles. Your analogy thus fails because it smuggles in functionalism for the tornado while rejecting it for the mental. What I have left is a robustly physicalist ontology where only functionally reducible higher-level properties are causal.

  *[Stepping out of character briefly: I’m about 80% confident this position holds under your constraints. The strongest point is demanding that causal inheritance requires functional reducibility, blocking the mental via its supposed nonfunctional residue. The shakiest point is dismissing the tornado/mental disanalogy—if "being a tornado" is irreducibly dynamic or context-sensitive, functional reduction might falter, undermining my reply.]*
