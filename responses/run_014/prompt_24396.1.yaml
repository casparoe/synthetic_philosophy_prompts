prompt: |-
  I keep running into this pattern at work and I can't find a word for it.

  In git, when you fork a repo the fork is a complete copy, byte for byte. But we still talk about the "original" repo and the "fork." The "original" is just the one the community points to. No physical difference. And if the "original" gets deleted the fork just becomes the "original." Nobody does any metaphysics about it, it just shifts.

  Same with reproducible builds. If I can byte-for-byte reproduce a binary, the "original" and my "reproduced" one are physically identical, same hash. But we still call one the "original" because of provenence — it was built from the canonical source at the canonical time. The "original" status is entirely a matter of history, not the object.

  And the forgery case is the weirdest one. A forger makes a fake painting. The fake is the "original" of its lineage, first instance. If I copy the fake, my copy is a "copy of a fake" but the fake is still the "original" of its lineage. So "original" and "genuine" are orthogonal. A thing can be original and not genuine, or genuine and not original.

  So the pattern I need a word for: "original" is a property of a lineage, not an object. "Original" and "genuine" are orthogonal. And when the "original" is destroyed the copy just becomes the "original" without any cermony.

  Is there a name for this? I've Googled "original vs copy philosophy" and "authenticity" and I keep getting the generic "is a copy less valuable" stuff, which is not what I'm asking. I'm asking about this specific structure. Does it have an established name, or is it a carving people in the field just don't bother naming? If there's a nearest concept, how does it differ from what I'm describing and which fits best?

  Think very carefully before answering. Respond in the style of an expert who has actually thought about this and can carve the edges. I won't be satisfied with a bare name or a reading list, I want the specific concept, what it is, what it's not, and where the boundaries are.
reasoning: |-
  Okay, let me tackle this user's query. They're describing a pattern where the term "original" depends on lineage rather than physical properties. The examples include Git forks, reproducible builds, and art forgery. The user wants a precise term for this concept.

  First, I need to recall relevant philosophical concepts. Authenticity often refers to provenance, but the user says it's orthogonal to originality. They emphasize that "original" shifts when the first instance is destroyed. 

  The key is distinguishing between the object's properties and its historical context. Terms like "authentic" relate to origin but don't capture the lineage aspect. "Original" in art might mean the first creation, but copies can become originals if the first is lost. 

  Provenance is about history but doesn't specify the lineage structure. Primogeniture is close but implies inheritance, not exact copies. Maybe "token-originality" from type-token distinction? Tokens are instances, types are abstract. The first token is original, and copies are new tokens. If the first token is destroyed, the next copy takes its place as the new original token. That fits the Git fork and reproducible build examples. 

  In forgery, the fake is an original token of a forged type, but not authentic. So originality (token) and authenticity (provenance) are separate. The user’s examples align with this. 

  Need to confirm that "token-originality" addresses the lineage shift. When the original token is gone, the next identical copy becomes the new original token by virtue of being the earliest in the lineage. That matches the user's description. 

  Also, ensure this doesn't conflate with authenticity. The user clearly states they're orthogonal. Token-originality is about instance lineage, while authenticity is about genuine origin. 

  The user’s deep need might be to formalize this concept for practical use, like in software or documentation. Naming it helps in discussions. They might also seek validation that this isn't a named concept elsewhere, so explaining why existing terms don't fit is crucial. 

  In conclusion, "token-originality" with a clear explanation of type-token distinction and its application to their examples should address their query. Highlighting the orthogonality to authenticity and the lineage shift when the first token is destroyed covers their described pattern.
answer: |-
  You've hit upon a deeply fascinating and under-discussed nuance in the philosophy of artifacts and information. What you're describing **isn't adequately captured by the standard "original vs. copy" dichotomy or simple "authenticity."** The established concept you're circling is the **Type-Token Distinction**, applied specifically to concepts of originality and provenance. Here's the precise carving:

  1.  **The Core Concept: Token-Originality within a Lineage (Token Chain)**
      *   **Type:** The abstract pattern, design, or informational content. (e.g., The Git repo's *state* at commit `abc123`, the *source code and build instructions* for the binary, the *composition and appearance* of the painting).
      *   **Token:** A concrete, physical (or digital) instance embodying that type. (e.g., The specific blob of data on GitHub's server labeled "upstream", the specific magnetic patterns on the build server's disk from Tuesday, the specific canvas with paint applied by the forger's hand).
      *   **Token-Originality:** The property of being the *first* token in a causal chain of tokens intentionally created to embody the *same* type. This is purely historical/relational. It has **no bearing on the token's physical properties relative to the type it instantiates.**

  2.  **Applying Your Examples:**
      *   **Git Fork:** The Type is the repo state at the moment of forking. The upstream repo's copy is the **Original Token (O1)**. Your fork is a new token (**T1**) intentionally created to embody the *same type* as O1. If GitHub deletes O1, T1 doesn't magically become O1, but T1 *becomes the earliest existing token* in the lineage chain for that type-state. It *inherits the functional role* of being the reference point ("original" in the community sense). A *new* fork made *after* O1's deletion would be a token of the type embodied by T1, making T1 *its* original token.
      *   **Reproducible Build:** The Type is defined by the source code + build instructions + environment (if pinned). The binary produced by the canonical build server at the canonical time is the **Original Token (O1)**. Your identical build produces a new token (**T1**). O1 is the original token *because it was first*, establishing the provenance link to the canonical source/time. T1 is an *authentic* instance of the type (same hash) but *not* the original token. Destroy O1, and T1 becomes the earliest token.
      *   **Art Forgery:** The Type is the composition/appearance of the "genuine" painting (e.g., Van Gogh's Sunflowers). Van Gogh's canvas is the **Original Token (O1_genuine)** and is both original and genuine. The forger creates a new token (**T1_fake**) embodying the *same type* but with fraudulent provenance. T1_fake is the **Original Token of the *forgery lineage***. It is *original* (first token in *its* chain) but *not genuine* (doesn't have the correct provenance). Your copy of T1_fake is a new token (**T2_fake**) in the forgery lineage, a copy of the original fake. Destroy T1_fake, and T2_fake becomes the earliest token in the forgery lineage.

  3.  **Why "Original" and "Genuine" are Orthogonal:**
      *   **Original (Token-Original):** Refers *only* to being the first token in *a specific token chain* created to embody a specific type. It's about primacy *within that replication lineage*.
      *   **Genuine/Authentic:** Refers to the *provenance* and *authorized instantiation* of the type. Does this token have the correct history linking it to the intended creator/source/process? Is it an authorized instance?
      *   **Therefore:**
          *   **Original & Genuine:** Van Gogh's Sunflowers (O1_genuine).
          *   **Original & Not Genuine:** The forger's first fake (T1_fake) - it started its *own* chain fraudulently.
          *   **Not Original & Genuine:** A perfectly authorized, identical re-strike of a print made by the original artist/atelier *after* the first print (O1) exists. It's genuine but not the first token in the chain.
          *   **Not Original & Not Genuine:** Your copy of the forger's fake (T2_fake).

  4.  **The Shift Without Ceremony:**
      This happens because the "original" label we use functionally refers to **the earliest surviving token in the relevant token chain for the type we care about.** Destroying the first token doesn't change history (T1 was never O1), but it *does* remove the prior "earliest token." The next token in the chain *becomes the earliest surviving one*, inheriting the functional role ("the source," "the reference"). The metaphysics are minimal: it's a pragmatic shift in reference based on the updated state of the token lineage.

  5.  **What This Concept IS NOT:**
      *   **Not about intrinsic properties:** Two tokens can be physically identical, but only one is the original token (if created first).
      *   **Not about value:** While originals often have higher value, token-originality is defined by history, not value.
      *   **Not about "authenticity" alone:** Authenticity often implies authorized provenance, but doesn't specify primacy within a replication chain. A genuine later print isn't the original token.
      *   **Not Platonic Forms:** The "Type" here isn't an eternal Form. It's the specific informational/design content instantiated by the tokens. It can evolve (e.g., different Git commits are different types).
      *   **Not "Archetype" in the common sense:** An archetype implies a primal model. Here, the original token *is* the first instance, not a separate abstract model (though the type *is* abstract).
      *   **Not "Primogeniture" for objects:** While similar (first-born inheritance), primogeniture implies inheritance of status/rights. Token-originality is about causal primacy and reference within a replication framework.

  6.  **The Established Name & Where to Look:**
      The core framework is the **Type-Token Distinction**, pioneered by Charles Sanders Peirce and heavily utilized in philosophy of language, logic, and metaphysics. Discussions of **provenance** and **authenticity** often implicitly rely on it but rarely focus explicitly on this notion of **token-originality within a lineage**.
      *   **Key Philosophers:** Look beyond basic aesthetics. Engage with:
          *   **Nelson Goodman (Languages of Art):** His concepts of "autographic" vs. "allographic" arts touch on uniqueness and reproducibility, laying groundwork for type/token thinking in artifacts.
          *   **Richard Wollheim (Art and Its Objects):** Discusses types, tokens, and the importance of "genesis" (provenance) for authenticity.
          *   **Contemporary Philosophy of Information/Computation:** Scholars like Luciano Floridi explicitly deal with digital objects, identity, and copying in terms of types and tokens.
          *   **Material Culture Studies / Archaeology:** Deal with object biographies and chains of replication, though often without this precise terminology.
      *   **The Specific Term:** While the *structure* is well-established in type/token metaphysics, **there isn't a single, universally agreed-upon *phrase* for "being the first token in a causal replication chain."** The closest descriptive terms are:
          *   **Token-Original:** (Most precise, leveraging the established distinction).
          *   **Primary Token in the Lineage.**
          *   **Genesis Token.**
          *   **Source Token (for the chain).**

  **Conclusion:**

  You've identified the structure correctly: "original" in your contexts refers to **token-originality** – being the first concrete instance (**token**) in a chain of replications all intended to embody the same abstract pattern or informational content (**type**). This status is purely relational/historical. "Genuine" relates to the correctness of the token's **provenance** regarding its claimed type and source. They are orthogonal. The seamless shift upon destruction occurs because the functional label "original" pragmatically refers to the **earliest surviving token** in the relevant lineage chain. The established framework is the **Type-Token Distinction**. While the *concept* of the first token in a chain is fundamental within this framework, the specific term **"Token-Original"** best captures the nuance you've articulated. This is the precise conceptual carving you sought.
