answer: |-
  Below is a complete, classroom-tested simulation protocol designed to make Hume's price-specie flow mechanism tangible. It emphasizes **self-discovery of the self-correcting trade imbalance** while exposing mercantilist fallacies. The simulation runs in **45-50 minutes** (leaving 25-30 mins for debrief), uses minimal materials, and forces price adjustments through gameplay mechanics.

  ---

  ### **Simulation Rules: "The Hume Exchange"**
  **Materials Needed**:  
  - Two colors of poker chips (e.g., **yellow** for gold, **red** for Nation A's goods, **blue** for Nation B's goods)  
  - 2 baskets ("ports") for cross-border trade  
  - Whiteboard to track prices/gold flows  

  **Starting Conditions** (rigged for imbalance):  
  - **Nation A (Gold-Rich/Goods-Poor)**:  
    - Gold: 80 chips  
    - Goods: 10 red chips (*fixed production per round*)  
    - *Goal: Maximize consumption (red + blue chips)*.  
  - **Nation B (Gold-Poor/Goods-Rich)**:  
    - Gold: 20 chips  
    - Goods: 30 blue chips (*fixed production per round*)  
    - *Goal: Maximize consumption (red + blue chips)*.  

  **Key Rule: No hoarding incentives**  
  - Gold has **no intrinsic value**—only consumed goods (red/blue chips) count for scoring.  
  - Unspent goods/gold **vanish** after trade (simulates perishability/labor mobility).  

  ---

  ### **Round Structure** (4 rounds, 7 mins each)
  1. **Production (1 min)**:  
     - Nation A adds 10 red chips to its basket.  
     - Nation B adds 10 blue chips to its basket.  
     - *No new gold is created*.  

  2. **Price-Setting (2 mins)**:  
     - Each nation **sets ONE price**:  
       - A sets price of **red goods** (in gold chips).  
       - B sets price of **blue goods** (in gold chips).  
     - Prices must be integers (e.g., 1 gold per good, 2 gold per good).  
     - *Prices can change each round*.  

  3. **Trading (3 mins)**:  
     - Nations send 2 "merchants" to the border with their goods basket.  
     - Merchants negotiate trades:  
       - A can buy blue goods from B using gold.  
       - B can buy red goods from A using gold.  
     - **Critical constraint**: Nations can only buy if they have enough gold.  
     - After deals, gold and goods physically move between baskets.  

  4. **Consumption & Scoring (1 min)**:  
     - Nations count:  
       - **Goods consumed** = red + blue chips in possession.  
       - **Wealth score** = goods consumed (recorded publicly).  
     - Unused goods/gold vanish (reset for next round).  

  ---

  ### **Payoff Scheme (No Real Money Needed)**  
  - **Scoring**: Each consumed good = 1 point.  
  - **Winner**: Nation with highest cumulative points after 4 rounds.  
  - **Incentives**:  
    - If teams focus on gold, they score low (e.g., saving gold = 0 points).  
    - Consuming *both* goods is optimal (diversification beats autarky).  

  ---

  ### **Predicted Dynamics & Pitfalls**  
  **What Will Happen**:  
  1. **Round 1**:  
     - A (gold-rich) buys many blue goods from B (e.g., 10 blues for 10 gold).  
     - B (gold-poor) buys few red goods (e.g., 5 reds for 10 gold).  
     - **Result**: Gold flows to B. A has high consumption (e.g., 10 blues) but shrinking gold.  

  2. **Round 2**:  
     - B, now gold-rich, **raises blue goods price** (e.g., from 1→2 gold).  
     - A, now gold-poor, **lowers red goods price** (e.g., from 2→1 gold).  
     - Trade rebalances: A buys fewer blues (too expensive), B buys more reds (cheap).  

  3. **Rounds 3-4**:  
     - Prices diverge further → trade imbalance reverses. B may even run a "deficit."  

  **Pitfalls & Mitigation**:  
  - **Prices never move?** → Force it: Require price changes if gold stocks shift >20%.  
  - **Deficit nation refuses to spend?** → Highlight scoring: Hoarding gold = 0 points.  
  - **Collusion to fix prices?** → Assign "merchant" subgroups with competing interests.  
  - **Border merchants freeze?** → Set a 3-min timer; no deal = no trade (real-world consequence).  

  ---

  ### **Debrief Framework** (25-30 mins)  
  **Map Simulation to Hume**:  
  | **Simulation Phase**      | **Hume's Mechanism**                         | **Anti-Mercantilist Insight**                          |  
  |---------------------------|----------------------------------------------|--------------------------------------------------------|  
  | Initial gold imbalance    | Arbitrary specie distribution                | Gold ≠ wealth; it’s a medium with no intrinsic value.  |  
  | Gold flows to B           | Specie flow from deficit to surplus nation   | Deficit isn’t "bleeding"—it’s enabling consumption.    |  
  | B’s prices rise, A’s fall | Domestic price inflation/deflation           | Prices self-correct via money supply changes.          |  
  | Trade rebalances          | Shift in competitiveness                     | No policy needed; markets reverse imbalance.           |  
  | Goods vanish if unconsumed| Labor/goods are perishable                   | Real wealth is goods/labor, not gold hoards.           |  

  **Unsimulatable Aspects (Require Lecture Supplements)**:  
  1. **Time Lags**:  
     - Simulation: Rebalance in 2-3 rounds.  
     - Reality: Price adjustments take months/years (Hume’s "gradual descent").  
  2. **Specie Mobility**:  
     - Simulation: Gold moves instantly.  
     - Reality: Shipping costs, legal barriers (explain why mercantilists overestimated these).  
  3. **Velocity of Money**:  
     - Simulation: Money supply = prices.  
     - Reality: Hume ignored credit/velocity (note Adam Smith’s later refinements).  

  **Discussion Prompts**:  
  - "When did you realize the deficit wasn’t a disaster? What changed?"  
  - "Why did Nation B’s ‘wealth’ (gold) feel hollow when prices rose?"  
  - "How does this explain why Spain’s gold influx from the Americas caused inflation?"  

  ---

  ### **Instructor Cheat Sheet**  
  - **Prep**: Pre-fill baskets with chips. Draw scoreboard on whiteboard.  
  - **Critical Intervention**: In Round 2, warn gold-rich teams: "Your goods are piling up—why not raise prices?"  
  - **Tweak If Stuck**: Shorten rounds or allow "trade treaties" (multi-round contracts) to expose rigidity risks.  
  - **Final Hook**: Contrast with mercantilism: "Hume showed that hoarding gold *causes* inflation—the very poverty nations feared!"  

  This simulation forces students into the logic of the system: They’ll initially panic at "deficits," then discover self-correction through price changes. The debrief cements why Hume called specie "the oil of the machine," not the machine itself.
