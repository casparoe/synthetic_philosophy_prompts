          P_A = 2 (set by A)
          P_B = 1 (set by B)

     Then for A:
          They want to maximize 10 - X + 2Y, subject to 100 + 2X - 1Y >=0.
          They can choose X and Y. Note that Y cannot exceed 20 (B's supply), and X cannot exceed 10.

          Rearrange the constraint: Y <= 100 + 2X.
          Since Y<=20, they can buy up to 20 Bananas. Then they want to minimize X (because -X) but they need to cover the cost? The cost for Y=20 is 20 gold. They have 100 gold, so they don't need to sell any Apples. So they set X=0, Y=20. Utility = 10 -0 + 2*20 = 50.

     For B:
          They want to maximize 20 - Z + 2W, subject to 20 + 1*Z - 2*W >=0.
          They can buy up to 10 Apples (A's supply). 
          They want to maximize W and minimize Z. 
          If they buy W Apples, they need 2W gold. They have 20 gold, and they can get more by selling Bananas. 
          The constraint: 20 + Z >= 2W.
          They also can sell at most 20 Bananas.

          They want to get as many Apples as possible. Let W=10, then they need 20 gold. They have 20, so they don't need to sell any Bananas. Then utility = 20 - 0 + 2*10 = 40.

          Or if they want to save gold, they can sell Bananas to get gold to buy more? But they can already buy 10 without selling. And they can't buy more than 10.

     Then trade: 
          A buys 20 Bananas from B for 20 gold.
          B buys 10 Apples from A for 20 gold.
          Net gold flow 0.

     Still no deficit.

     To create a deficit, we can have asymmetric desires. Nation A's demand for Bananas is high, so they might want to buy more than B's entire production. But B only has 20. 

     Or we can have B's demand for Apples limited by their gold? But in this case, B can afford 10 Apples.

     Let's change the initial gold of B to 0.

     Nation B: gold=0.

     Then for B to buy Apples, they must sell Bananas first.

     Round 1:
          - A buys Bananas from B: A can buy up to 20 at P_B=1, paying 20 gold.
          - B sells, say, 20 Bananas to A for 20 gold. Now B has 20 gold.
          - Then B buys Apples from A: they can buy up to 10 at P_A=2, costing 20 gold. So they buy 10.
          - Net gold flow 0.

     Still balanced.

     Unless A buys more than B's production? But B only has 20.

     We can allow trade to happen in sequence and allow the gold to circulate within the round. Then it's hard to have a deficit.

     Perhaps the deficit is created by the fact that A's imports (Bananas) cost more than B's imports (Apples) in value? But in this case, they are equal.

     I think the only way is to have one nation import more than the other nation imports from them. In the first round, if Nation A buys 20 Bananas (20 gold) and Nation B buys only 5 Apples (10 gold), then net gold flow 10 from A to B.

