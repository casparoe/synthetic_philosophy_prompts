          - A sets P_A=4.
          - B sets P_B=1.
          - A buys 20 Bananas for 20 gold.
          - B has 0 gold initially. After selling, they have 20 gold. Then they can buy 5 Apples for 20 gold.
          - Net gold flow: 20 (A to B) - 20 (B to A) = 0? No, because when B buys, they pay 20 gold to A. So A pays 20 to B for Bananas, and then B pays 20 to A for Apples. Net 0.

     If B only buys 5 Apples, then they pay 20 gold for 5 Apples? That doesn't match the price. The price is 4 per Apple, so 5 Apples cost 20 gold.

     So they buy 5. Net gold flow 0.

     I see the difficulty. In this setup, the trade is always balanced because each transaction is settled immediately.

     To have a deficit, we need to allow one nation to buy without the other nation buying in the same round. But then the gold flows.

     We can change the rules: 
          - The nations first report how much they want to import from the other nation, and then the net gold flow is calculated.

     Example round 1:
          - Nation A announces: we want to import 20 Bananas from B.
          - Nation B announces: we want to import 5 Apples from A.
          - The net gold flow is (20 * P_B) - (5 * P_A) = 20*1 - 5*2 = 20 - 10 = 10 from A to B.
          - Then the trades happen: A gets 20 Bananas, B gets 5 Apples, and 10 gold moves from A to B.

     This creates a trade deficit for A (imports > exports) and a surplus for B.

     Then we can have this happen.

     But why would B only import 5? In this case, with P_A=2, they could import more. We can explain that maybe they are cautious or have limited immediate need. In reality, the adjustment happens because of the gold flow affecting prices in the future.

     So in the simulation, we rely on them setting import volumes that create an imbalance initially.

     To encourage that, we can have different utility functions or different initial needs. But given time, we might simply prime the students: tell Nation B that in the first round, they are not yet aware of the benefits of Apples, so they only buy a few.

     Alternatively, we can impose an initial trade pattern for round 1 to create the imbalance, and then let them decide from round 2 onward.

     Given the time, I suggest:

     - Round 1: The instructor sets the initial trade volumes to create a deficit.
          - Nation A imports 15 Bananas from B.
          - Nation B imports 5 Apples from A.
          - Prices are set by the nations, but the instructor can suggest initial prices: P_A=2, P_B=1.
          - Net gold flow: 15*1 - 5*2 = 15 - 10 = 5 from A to B.

     Then in subsequent rounds, the nations set their own prices and trade volumes.

  ### Final Simulation Design with Forced Initial Deficit
  .0. Initial Setup:
     - Nation A: 
          - Gold: 100
          - Apple production: 10 per round
     - Nation B:
          - Gold: 20
          - Banana production: 20 per round

  1. Round 1 (Instructor Guided):
     - Instructor sets: 
          P_A = 2 (Apples)
          P_B = 1 (Bananas)
     - Instructor sets trade volumes:
          Q_AB = 15 (A imports 15 Bananas from B)
          Q_BA = 5 (B imports 5 Apples from A)
     - Net gold flow = (15 * 1) - (5 * 2) = 15 - 10 = 5 from A to B.
     - Update:
          A: 
              Apples = 10 - 5 = 5
              Bananas = 15
              Gold = 100 - 5 = 95
              Utility = 5 + 15 = 20
          B:
              Bananas = 20 - 15 = 5
              Apples = 5
              Gold = 20 + 5 = 25
              Utility = 5 + 5 = 10

     Then consume.

  2. Round 2 onward:
     - Let the nations set their own prices and negotiate trade volumes.
     - They may change prices based on their gold holdings and desire for goods.

     We hope to see:
          - Nation B, with more gold, might set a higher price for Bananas (P_B increases) because they feel wealthier.
          - Nation A, with less gold, might lower the price of Apples (P_A decreases) to attract buyers.
          - Then B will buy more Apples (because they are cheaper) and A will buy fewer Bananas (because they are more expensive and A has less gold), thus reducing the deficit.

  ### Number of Rounds
     - Run for 3-4 rounds. That should be enough to see the beginning of the adjustment.

  ### What the Simulation Can't Reproduce
     - **Time Lags**: The adjustment in the simulation happens in discrete rounds quickly, while in reality, it takes time for prices to adjust.
     - **Free Flow of Specie**: We assume gold moves instantly and without cost. In reality, there might be transaction costs or barriers.
     - **Price Stickiness**: In the simulation, prices are set round by round. In reality, prices might be sticky and not adjust immediately.
     - **Capital Flows and Other Factors**: Hume's mechanism operates in a world without capital flows other than for trade. The simulation doesn't account for investment or loans.
     - **Velocity of Money**: We assume that the money supply is the only factor affecting prices, but velocity matters too.

  ### Debrief
     - After the simulation, discuss:
          1. What happened to the trade imbalance over time? Did it narrow or reverse?
          2. How did prices change? Why?
          3. What happened to the gold stocks? 
          4. How did the changes in gold stocks affect prices and trade?
          5. Relate to Hume: 
               - The outflow of gold from the deficit country (A) reduces its money supply, causing prices to fall.
               - The inflow of gold to the surplus country (B) increases its money supply, causing prices to rise.
               - This makes exports from the deficit country cheaper and exports from the surplus country more expensive, thus self-correcting the trade imbalance.
          6. Against mercantilism: 
               - The simulation shows that gold outflows are not a permanent loss but lead to conditions that naturally boost exports and reduce imports.
               - The real wealth is in the goods and the productive capacity, not in hoarding gold.

     - Also discuss the limitations of the simulation and how the real-world mechanisms might be more complex.

  ### What Might Go Wrong
     - **Nation A might refuse to run a deficit in subsequent rounds**: They might try to balance trade immediately by cutting imports. Emphasize that their goal is to maximize utility, so they should continue to import if the utility from imports is high.
     - **Prices might not adjust**: If they don't change prices, the imbalance might persist. Encourage them to experiment with prices.
     - **Nation B might not increase their imports**: Even if Apples become cheaper, B might not buy more. Remind them that their citizens enjoy Apples and they get utility from consuming them.

  Despite these, the simulation should illustrate the core mechanism.

