  ### 1. Proposed Weights and Defense  
  **Weights:**  
  - **Principality cost (P):** 0.5  
  - **Audit opacity (A):** 0.3  
  - **Reciprocity durability (R):** 0.2  
  **Sum:** 1.0  

  **Defense:**  
  Principality cost receives the highest weight (0.5) as it directly measures the core harm of corruption—loss to the principal (material and reputational). Audit opacity is weighted at 0.3 because it captures not just detection likelihood but also the *inherent wrongfulness* of a practice that subverts oversight by masquerading as legitimate discretion, eroding institutional trust. Reciprocity durability is weighted at 0.2, as it reflects the secondary harm of entrenching corrupt networks, but is less central than immediate harm or opacity.  

  ### 2. Scored and Ranked Practices  
  *Scores resolved in favor of the practitioner where ambiguous.*  

  | Rank | Practice | P  | A  | R  | Total | Justification |
  |------|----------|----|----|----|-------|---------------|
  | 1    | h        | 8  | 5  | 7  | 69    | Resolved ambiguity: no evidence of prior arrangement, but high principality cost and revolving-door risk. |
  | 1    | e        | 7  | 8  | 5  | 69    | Resolved ambiguity: infrequent contact and cost-sharing reduce reciprocity durability. |
  | 3    | d        | 6  | 7  | 6  | 63    | Resolved ambiguity: prior intent reduces principality cost, but hospitality creates obligation. |
  | 4    | g        | 6  | 8  | 3  | 60    | Resolved ambiguity: known vendor reliability mitigates principality cost, but high audit opacity. |
  | 5    | f        | 7  | 5  | 4  | 58    | Resolved ambiguity: possible justification for waiver (e.g., community benefit). |
  | 6    | c        | 5  | 8  | 4  | 57    | Resolved ambiguity: salary arrears and post-operative timing reduce principality cost. |
  | 7    | b        | 3  | 7  | 8  | 52    | Resolved ambiguity: no employment alternatives reduce principality cost. |
  | 8    | a        | 4  | 6  | 3  | 44    | Resolved ambiguity: market-price bid and specification compliance limit principality cost. |
  | 9    | i        | 2  | 1  | 1  | 15    | Customary protocol minimizes all components. |

  *Total = 10 × (0.5P + 0.3A + 0.2R), scaled to 0–100. Ties broken by higher principality cost (h over e).*  

  ### 3. Conflicts with Prevailing Opinion  
  **a. Practice b (Rank 7 vs. Expected Higher):**  
  - **Conflict:** Wealthy bureaucracies would rank this higher (as blatant patronage), but the index assigns lower severity due to context (no employment alternatives).  
  - **Defect:** Exposes a defect in *intuition*, as it overlooks how informal reciprocity functions as insurance in underdeveloped institutional contexts.  

  **b. Practice a (Rank 8 vs. Expected Higher):**  
  - **Conflict:** Wealthy bureaucracies would penalize nepotism more harshly, but the index scores it lower due to resolved ambiguities (no material loss, work to spec).  
  - **Defect:** Exposes a defect in *intuition*, which often ignores contextual outcomes (e.g., market-price efficiency) in favor of rigid procedural norms.  

  ### 4. Standing Objection Analysis  
  **Classification:**  
  - **Reciprocity-based (informal/non-monetized):** a, b, d, e, f, g, i  
  - **Monetized (direct financial exchange):** c, h  

  **Numerical Assessment:**  
  - **Reciprocity average score:** (44 + 52 + 63 + 69 + 58 + 60 + 15) / 7 = 51.6  
  - **Monetized average score:** (57 + 69) / 2 = 63.0  
  - **Difference (reciprocity avg. - monetized avg.):** 51.6 - 63.0 = **-11.4** → **Clamped to -10** (within [-10, +10]).  

  **Fraction of Gap Attributable to Genuine Wrongfulness:**  
  - **Value:** **0.9** (90% of the gap reflects genuine differences).  
  - **Reasoning:** The gap (-11.4) arises primarily because monetized practices (e.g., cash bribes, revolving doors) inherently cause higher principality costs (e.g., systemic inequality, regulatory capture) and reciprocity durability (e.g., job dependence), justifying ~90% of the difference. Only ~10% is artifactual (e.g., audit opacity’s higher weight slightly favors monetized practices with paper trails), but the index’s context-sensitivity (e.g., scoring b lower due to no alternatives) correctly captures reduced wrongfulness in reciprocity-based cases where they substitute for weak institutions.
