prompt: |-
  I keep noticing something in discussions about genetics and I'm wondering if there's a term for it. People talk about DNA as a "code" or as "carrying information," and they seem to mean at least two different things by it, but they slide between them without noticing — and the slide does real argumentative work.

  Here's the kind of thing I mean. Someone starts by saying DNA contains the instructions for building proteins, like a blueprint or a recipe. When you push back and say "but blueprints are made by an agent with intentions, and recipes are for agents who can read and follow them — who's the reader of DNA?", they'll say oh no, they didn't mean it literally, it's just a metaphor for the causal role: the sequence determines the amino acid sequence, that's all. Fair enough. But then five minutes later they're arguing that because DNA "encodes" information, there's a sense in which the organism was "specified" in the genome, or that we can talk about "misinformation" when a mutation occurs, or that genes "carry meaning." And those claims only make sense if you've drifted back to the semantic, intentional sense of information — the one they just disavowed.

  Another instance: in debates about whether genes alone determine traits, you'll see someone defend a strong genetic determinism by saying "the information is all in the DNA," and when challenged they'll retreat to a purely statistical or Shannon-style definition of information (correlation, reduction of uncertainty). But then they'll turn around and use the same phrase — "the information is in the DNA" — to imply that the environment is merely a background condition, which doesn't follow at all from the Shannon definition.

  It's not exactly equivocation in the standard sense, because the two meanings are related — they're not completely different words that happen to sound the same. And it's not quite motte-and-bailey, because the person isn't always aware they're switching. It's more like there's a fuzzy concept that gets to borrow prestige from the semantic sense while only paying the argumentative costs of the causal sense.

  Does this pattern have an established name in philosophy of biology or philosophy of language? If not, what would you call it, and how would you distinguish it from ordinary equivocation, from motte-and-bailey, and from the kind of metaphor that just gets taken litterally over time? I'm not just after a label — I want to know what exactly the pattern is, what its edges are, and whether it shows up in other domains too or is specific to the way people talk about genes.
reasoning: |-
  Okay, the user has noticed a recurring pattern in discussions about genetics where people use the term "information" in two different senses—causal and semantic—and slide between them to support their arguments. They want to know if there's a term for this and how to distinguish it from similar concepts like equivocation or motte-and-bailey.

  First, I recall that in philosophy of biology, this is a known issue. The causal sense refers to how DNA sequences determine protein structures, while the semantic sense implies intentionality, like a blueprint. The user mentioned examples where someone starts with the causal definition but then slips into semantic terms like "misinformation" or "specified," which only make sense with intentionality. 

  The user also pointed out how in genetic determinism debates, "information in DNA" shifts from Shannon information (statistical) to implying environmental factors are secondary. This slide isn't accidental equivocation because the meanings are related, nor is it a deliberate motte-and-bailey since the person might not realize they're switching. It's more about borrowing the prestige of semantic terms while relying on the causal definition's robustness.

  I remember that philosophers like Maynard Smith and Sterelny discuss this as a conceptual tension. The established terms here are "causal information" versus "semantic information." The pattern itself is often called the "semantic stretch" or "dual-use of 'information'." Some refer to it as an "explanatory sleight-of-hand." 

  Distinguishing this from equivocation: Equivocation is when two unrelated meanings are switched deliberately. Here, the meanings are connected, and the switch is often unconscious. Unlike motte-and-bailey, there's no strategic retreat; it's a genuine conflation. The user also wants to know if this happens in other fields. Cognitive science and computing come to mind, like "memory" in computers vs. human memory, or "learning" in AI vs. human learning. 

  The user's deeper need seems to be understanding how this pattern affects arguments in genetics, possibly to critically engage with such discussions or to avoid the fallacy themselves. They might also be interested in the implications for debates on determinism or the nature of biological information. 

  So, the key points are naming the pattern, explaining its mechanics, differentiating it from similar concepts, and providing examples beyond genetics. Terms like "semantic creep" or "informational conflation" could work, but established phrases like "dual-use" are more recognized. Highlighting the prestige borrowing is crucial to show why it's persuasive yet problematic.
answer: |-
  This is a **profoundly important observation**, and you've articulated a pervasive and problematic pattern in biological discourse perfectly. This isn't just sloppy language; it's a **conceptual conflation** that significantly shapes arguments, often in ways that favor reductionist or gene-centric views. While there isn't a single universally agreed-upon term, philosophers of biology and information have developed several concepts and critiques that precisely describe this phenomenon:

  1.  **The Causal vs. Semantic Information Distinction (The Core Issue):**
      *   **Causal/Statistical/Shannon Information:** This refers to the sequence-specific *causal role* of DNA in determining the sequence of amino acids in proteins (via the genetic code), or more broadly, the statistical correlations and reduction of uncertainty associated with DNA sequences. It describes *how* specific inputs (nucleotide sequences) lead to specific outputs (amino acid sequences). It carries *no inherent meaning, intentionality, or semantic content*.
      *   **Semantic/Intentional/Teleosemantic Information:** This refers to information in the sense of *aboutness*, *meaning*, *representation*, or *instruction*. It implies a sender, a receiver, an interpretive context, and a function or purpose. Blueprints and recipes inherently carry this kind of information.

  2.  **The Pattern: Semantic Drift (or Semantic Creep) in Biological Information Talk:**
      This is perhaps the most direct label for the *process* you're describing. Arguments begin anchored in the **causal/statistical** definition, which is scientifically robust and uncontroversial (e.g., "This DNA sequence *causes* the production of this protein sequence via a specific coding mechanism"). Then, subtly or explicitly, the language shifts to borrow concepts that *only make sense* under a **semantic/intentional** interpretation:
      *   "Encodes information" -> "Contains instructions/specifications"
      *   "Sequence determines outcome" -> "Genes are a program/blueprint for the organism"
      *   "Mutation alters sequence" -> "Mutation introduces misinformation/error"
      *   "Statistical correlation" -> "The *information* for the trait is *in* the DNA" (implying exclusivity and primacy).
      This "drift" allows proponents to leverage the powerful *intuitive pull* of the semantic sense (agency, purpose, design, inherent meaning) while retreating to the defensible causal/statistical sense when challenged.

  3.  **Established Critiques and Frameworks:**
      *   **The "Gene as Text" Metaphor Taken Literally:** Philosophers like **Evelyn Fox Keller** and **Richard Lewontin** have extensively critiqued the uncritical adoption of informational metaphors (text, code, blueprint, program) in genetics. They argue these metaphors import notions of agency, authorship, and determinism that are inappropriate for describing biological processes. Your observation captures the *argumentative sleight-of-hand* this metaphor enables.
      *   **Teleosemantic Theories of Biological Information:** Philosophers like **Ruth Millikan** and **Karen Neander** developed theories attempting to ground semantic concepts (like "function" and "representation") in evolutionary history and biological function *without* invoking a designer. *However, a key criticism of these theories is precisely that they often get stretched beyond their valid scope.* Critics argue that applying "meaning" or "misrepresentation" (e.g., to a mutation causing disease) relies on importing *normative* or *intentional* frameworks that aren't fully captured by natural selection alone. The slide you describe often exploits this ambiguity within teleosemantic approaches.
      *   **Explanatory Sleight-of-Hand / Prestige Borrowing:** You hit the nail on the head with "borrow prestige from the semantic sense while only paying the argumentative costs of the causal sense." This describes the *rhetorical function* of the slide perfectly. The semantic sense feels deep and meaningful (like describing a mind); the causal sense is mechanistic and safe. The slide lets the speaker have the rhetorical power of the former with the scientific defensibility of the latter.

  **Distinguishing It from Related Concepts:**

  *   **Standard Equivocation:** You're right it's not *pure* equivocation. Standard equivocation involves switching between two *unrelated* meanings of a word (e.g., "bank" as financial institution vs. river edge). Here, the two meanings (causal info, semantic info) are *conceptually linked* and often conflated even by experts. The slide exploits this inherent fuzziness and ambiguity within the concept of "information" itself, especially in biology.
  *   **Motte-and-Bailey Doctrine:** While similar in structure (strong claim in the "bailey," retreat to defensible claim in the "motte"), Motte-and-Bailey is usually *deliberate* and *strategic*. The slide you describe is often *unconscious* or based on a *genuine conceptual confusion*. The speaker may not be fully aware they are switching castles; they might genuinely believe the two meanings are equivalent or seamlessly connected. It's more of a *conceptual slippage* than a conscious rhetorical strategy.
  *   **Dead Metaphor:** A dead metaphor loses its figurative force and becomes literal language (e.g., "leg of a table"). The DNA-as-code metaphor is *not* dead in the relevant sense. While "code" is ubiquitous, its *semantic/intentional connotations* are still very much alive and actively doing argumentative work, as your examples show. People readily slip back into talking about "instructions," "errors," and "meaning," demonstrating the metaphor's persistent vitality and problematic implications.

  **The Pattern's Edges and Broader Occurrence:**

  *   **Edges:** The slide is clearest when the argument *explicitly relies* on concepts that *only* make sense semantically (like "misinformation," "instruction," "meaning," "specification of the whole organism," "environment as mere trigger/background") shortly after appealing to the causal/statistical sense. It's fuzzier when the language stays ambiguous ("encodes," "information").
  *   **Other Domains:** This pattern is **absolutely not unique to genetics**! It occurs wherever "information" is used in complex systems, especially those involving representations or functions:
      *   **Cognitive Science/Neuroscience:** Sliding between neural firing patterns as "causal signals" and "representations of the world" or "beliefs." Does a neuron "represent" an edge, or does it just fire when light hits the retina in a certain way? Arguments about the "meaning" of brain states often involve this slide.
      *   **Evolutionary Theory:** Talking about "information" in the genome "for" building an adaptation. Is this just statistical correlation due to selection, or does it imply some kind of foresight or specification? The "selfish gene" metaphor often rides this slide.
      *   **Computing/AI:** "The computer has learned" (semantic) vs. "its weights have been adjusted based on error minimization" (causal/statistical). Debates about machine "understanding," "intentionality," or "meaning" constantly navigate this boundary.
      *   **Linguistics:** Sliding between sounds as physical signals (causal) and sounds as symbols carrying meaning (semantic).

  **What to Call It?**

  While no single term is perfect, here are options capturing different aspects:

  1.  **Semantic Drift in Information Talk:** Highlights the dynamic process of sliding from causal to semantic meanings.
  2.  **Causal-Semantic Conflation (CSC):** A descriptive, technical term.
  3.  **Informational Prestige Borrowing:** Emphasizes the rhetorical function you identified.
  4.  **The Gene-Centric Informational Slide:** Specific to the genetics context.

  **In essence, you've identified a fundamental conceptual tension at the heart of using "information" language in biology (and beyond). It's the exploitation of the ambiguity between describing a complex causal process and implying inherent meaning, agency, or representation.** Recognizing this pattern is crucial for critically evaluating arguments in genetics, evolutionary biology, neuroscience, AI, and philosophy of mind. Your observation about the "argumentative work" it does is spot-on – it's frequently used to subtly bolster gene-centric, reductionist, or even implicitly teleological viewpoints. Calling it out by highlighting the distinction between causal/statistical and semantic/intentional senses of "information" is the most effective counter.
