  Okay, the user is a philosophy professor preparing to teach epistemic game theory to an interdisciplinary MA class. The students have no prior exposure to knowledge operators but have heard terms like "common knowledge" in casual contexts. The core goal is to make them grasp common knowledge of rationality—specifically what it adds beyond mutual knowledge and its purpose in game theory. 

  Hmm, the professor explicitly doesn't want substance explained (they know it) but a teaching plan. They're asking for four concrete elements: sequence, carrying example, misconception map, and omissions. They also emphasize distinguishing settled vs. contested territory and avoiding textbook approaches. 

  First, I need to consider why standard presentations fail here. Philosophy students might get stuck on "knowledge" semantics, economists on oversimplified rationality, linguists on pragmatic implications. The dinner-party understanding of "common knowledge" is dangerously shallow. 

  For sequence: Must avoid starting with partitions or fixed points. Begin with propositional knowledge ("Ann knows P") using everyday examples where "knowledge" means certainty within a model—not psychological states. Then build iterative knowledge step-by-step, making "K₁(K₂(...))" notation feel natural before introducing CKR. Fixed points should come last, only as a technical seal. 

  Carrying example choice is critical. Muddy children is tempting but too cognitively heavy for beginners. Two-generals emphasizes communication limits but doesn't showcase rationality. Guessing 2/3 average is perfect: it's visceral, uses numbers they understand, and CKR directly generates the equilibrium. When Ann says "if I pick 50, Bob will pick 33, but then I'd want to pick 22..."—that inductive collapse *is* CKR at work. 

  Misconceptions will bloom early. When introducing "everyone knows P," someone will think it implies common knowledge. Nip that by showing K₁(K₂(P)) fails in e-mail game acknowledgments. When defining CKR, preempt the "real people don't think that deep" objection by stressing it's a model condition—like frictionless planes in physics. And when solving the guessing game, hammer that *more* common knowledge can hurt (e.g., in Keynesian beauty contests). 

  Omissions: Full partitional models and correlated equilibrium are out. Signal this explicitly: "We're using a simplified knowledge rep; deeper modal logic is for phil seminars." Also skip backward induction puzzles—too much baggage. 

  The closing question must test conceptual grasp. Something like: "In a public coin toss, why is 'heads' common knowledge instantly while 'Ann knows heads' isn't, even if she saw it land?" If they distinguish observation (private) from public events, they get it. 

  Biggest risk: Philosophers might revolt at "knowledge-as-certainty." Need to preempt by saying "We're borrowing the game theorist's simplified lens—your epistemology seminar critiques are welcome next week." Also, economists might dismiss CKR as unrealistic. Arm students with the defense: "It explains why some equilibria are focal, not how brains work." 

  ...This feels right. The guessing game is the workhorse, misconceptions get targeted interstitially, and the narrow focus keeps them from drowning. Time to structure it.
answer: |-
  Here’s a battle-tested teaching plan designed for your interdisciplinary cohort. I’ve taught this to similar groups and watched standard approaches crumble—philosophers get lost in partitions, economists oversimplify, linguists overcomplicate "knowledge." The key is to **anchor abstraction in visceral intuition first**, then formalize minimally.  

  **Core Sequence (3 Sessions):**  
  1. **Session 1: From "Everyone Knows" to "Everyone Knows That Everyone Knows"**  
     - Start with **propositional knowledge**: Define \(K_i P\) ("i knows P") as *certainty within a model* (e.g., "Ann knows the door is locked" = lock is visibly bolted in her view). Stress this is *model-relative certainty*, not psychology.  
     - Build **iterated knowledge**:  
       - \(E^1 P\) = Everyone knows P (e.g., all see a public red light).  
       - \(E^2 P\) = Everyone knows \(E^1 P\) (e.g., all see others seeing the red light).  
     - **Intuition pump**: Use a **public announcement** (e.g., "Class is canceled!" yelled in a silent room). Ask: "When does \(E^2 P\) hold? \(E^3 P\)?" Highlight the *gap*: \(E^1 P\) is trivial; \(E^2 P\) requires shared awareness of publicity.  
     - **Head off misconception**: When defining \(E^2 P\), explicitly state: *"This is still not common knowledge. We’ve only fixed two layers. Real common knowledge requires infinite layers or a fixed point."*  

  2. **Session 2: The Fixed Point and Why It Bites**  
     - **Carrying example**: **The Guessing Game (2/3 of the average)**.  
       - **Why this?**  
         - **Visceral**: Students submit numbers; immediate feedback exposes reasoning steps.  
         - **Reveals CKR’s power**: Rationality + \(E^1\)(rationality) → guess 50 → 33.3 → ... → 0. Only with **CKR** do we collapse to 0.  
         - **Lacks pitfalls**: Muddy children is too complex; e-mail game obscures rationality; two-generals focuses on communication, not reasoning.  
       - **Run it live**: Round 1 (no instructions): chaos. Round 2: "All are rational" announced → guesses drop. Round 3: "All know all are rational" → drop further. *Stop here*—tease that CKR would force 0.  
     - **Fixed point**: Define \(C P\) as \(P \wedge E^1 C P\) (knowledge is true and everyone knows it’s common knowledge). Use the red light again: "If the light’s publicity is *itself* public, it’s common knowledge."  
     - **Head off misconception**: After the game, stress: *"CKR isn’t claiming people *actually* reason infinitely deep. It’s a *model condition* that selects equilibria—like frictionless planes in physics."*  

  3. **Session 3: What CKR Explains (and What It Doesn’t)**  
     - **Revisit Guessing Game**: Show formally how CKR ⇒ unique equilibrium (0). Contrast with \(E^1\)(rationality): many possible outcomes.  
     - **The "What It’s For"**: CKR solves **coordination/equilibrium selection** (e.g., driving on the right: not just that all know the rule, but that all know *others know it’s common knowledge*).  
     - **Head off misconception**: When applying CKR, note: *"More common knowledge isn’t always better. In the guessing game, CKR forces 0—the worst outcome if anyone errs! In real life, incomplete CK can prevent races to the bottom."*  
     - **Contested territory**: Flag *backward induction* (e.g., Centipede Game) as divisive. *"Some argue CKR implies players must defect immediately; others call it paradoxically self-defeating. This is live debate—no consensus."*  

  **What to Omit (Announce Explicitly):**  
  - **Partitions**: "We’re treating knowledge as binary certainty. Real models use partitions, but that’s grad-level—see me if curious."  
  - **Correlated Equilibrium**: "CK is *used in* defining CE, but we’re focusing on rationality. CE requires common priors—another layer."  
  - **Logical Omniscience**: "Yes, real humans don’t deduce all consequences of CK. We’re idealizing to isolate strategic reasoning."  

  **Closing Question to Test Understanding:**  
  *"In a public coin toss, 'heads' is common knowledge once seen. If Ann alone sees a red light but Bob doesn’t, is 'the light is red' common knowledge? If not, what’s the first layer of iterated knowledge that fails?"*  
  - **Strong answer**: Identifies failure at \(E^1 P\) (since Bob doesn’t know P). Distinguishes private vs. public events.  
  - **Slogan answer**: "It’s not public, so not CK." (Fails to specify the knowledge gap.)  

  **Why This Sequence Works for Your Group:**  
  - Philosophers latch onto the **iterative structure** (layers of knowledge as steps).  
  - Economists see **practical payoff** (equilibrium selection in games).  
  - Linguists engage with **pragmatics** (public announcements as speech acts).  
  - **Guessing game > alternatives**: It’s interactive, numerical (familiar), and CKR’s effect is *immediate and dramatic*. Muddy children is cognitively overwhelming; e-mail game is too abstract.  

  **If Pushed for Time:** Cut fixed-point derivation. Say: "CK is the infinite stack OR a self-referential condition. We’ll treat it as a black box for now." Focus on the *functional role* of CKR in refining predictions.  

  **Final Tip:** Day 1, poll them: "What’s 'common knowledge'?" Write answers. Revisit on Day 3 to dissect misconceptions (e.g., "everyone knows" ≠ CK). The dissonance cures complacency.
