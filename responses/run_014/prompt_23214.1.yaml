  On the function debate, Millikan argues that dispositional accounts (what a system does) collapse into historical accounts (what it was selected for). The user wants this distinction clarified. The follow-up could challenge if selection history is necessary by presenting a hypothetical where a trait arises without selection but still seems functional. The philosopher might counter that functions require selection, so the follow-up should press on why history is essential.

  Regarding how selection fixes content, the user feels unsettled. The question should ask why selection determines content instead of current dispositions. The follow-up could involve a trait that's repurposed, like feathers for flight vs. insulation, questioning if content changes with new functions. The philosopher might invoke derived proper functions, but the follow-up should challenge if this creates ambiguity in content.

  The user's deeper needs: They want to engage critically with teleosemantics, using their biology expertise. They need questions that bridge philosophy and biology, exposing potential weaknesses. They also want the interview to be rigorous, prompting the philosopher to defend against tough objections, making it educational for their peers. Ensuring questions aren't easily deflectable is key, hence the cornering follow-ups. They’re not a philosopher but need precise terminology, so explanations must be concise yet accurate. Including terms like "Normal conditions" or "derived proper function" with brief context will help without dumbing down.

  Need to frame each question to target the core issues and anticipate responses. For example, on misrepresentation, use the toad example to challenge the distinction between malfunction and proper function. For the function debate, contrast historical with ahistorical examples to test necessity. For content fixation, use exaptation cases to test stability of content. Each follow-up should pinpoint potential contradictions or unresolved points, forcing the philosopher to clarify and defend, which aligns with the user's goal of a probing discussion.
answer: |-
  Here are eight focused questions with cornering follow-ups, designed for a rigorous discussion with a Millikan-style teleosemantics defender. Each question targets a core tension, uses precise terminology, and anticipates common replies to push the philosopher into deeper defense.

  ### Core Questions & Cornering Follow-Ups

  1.  **Question on Misrepresentation & Mechanism Failure:** "Millikan famously uses the example of a frog's fly-detector mechanism snapping at a BB to illustrate misrepresentation: the mechanism 'falsely' represents the BB as food. But if the *mechanism itself* is malfunctioning (e.g., firing erratically due to a developmental defect), doesn't it lose its *proper function* (and hence its representational content) altogether? How does teleosemantics distinguish a genuine case of *misrepresentation* (content intact, function failed) from a case where the mechanism is simply *broken* and has *no determinate content*?"
      *   **Anticipated Answer:** "Proper function is defined by the mechanism's *Normal* explanation – the conditions under which it historically contributed to fitness. A malfunctioning mechanism *retains* its proper function/content; it's just failing to perform it correctly under current, non-Normal conditions."
      *   **Cornering Follow-Up:** "But doesn't this make misrepresentation parasitic on the mechanism operating *correctly* in *Normal* conditions? If we take a mechanism that *never* operated correctly in its lineage (say, a congenital defect present since the trait's origin, but selectively neutral), does it have *any* representational content for teleosemantics? If not, how is this different from it being 'broken'? If so, what fixes its content if there's *no history of successful performance*?"

  2.  **Question on Selection History vs. Dispositional Function:** "Millikan argues forcefully that ahistorical 'causal role' or 'dispositional' accounts of function collapse, primarily because they cannot distinguish proper function from mere accidental effects. She insists selection history is essential. Could you elaborate on why she thinks *only* history can provide the needed normative 'should' for function and content? Specifically, why couldn't a sophisticated *dispositional* account, incorporating system goals and complex causal roles *right now*, ground normativity without history?"
      *   **Anticipated Answer:** "Dispositional accounts lack normativity. Any effect a system *can* produce is a disposition. Selection history provides the 'should' – what the trait was *supposed* to do, what it was *selected for*. Accidental beneficial effects aren't functions. Only history can pick out the specific effect that explains the trait's persistence."
      *   **Cornering Follow-Up:** "Consider a complex, newly engineered AI system designed *de novo* to represent its environment. It has clear representational content and can misrepresent *before* any selection history has acted upon it (it hasn't even been deployed). Doesn't this show that selection history *isn't necessary* for grounding content and the possibility of misrepresentation? If teleosemantics denies this AI has genuine content, isn't that deeply counterintuitive? If it *does* grant it content, how does this avoid collapsing into a dispositional account?"

  3.  **Question on Fixing Specific Content:** "Teleosemantics posits that selection fixes content via the mechanism's 'proper function.' But selection is often coarse-grained. A visual edge-detector neuron might have been selected for detecting predator outlines, prey movement, *and* navigational landmarks – all contributing to fitness. How does selection history pick out *one specific content* (e.g., 'predator here') for a particular tokening of the representation, rather than the disjunction ('predator or prey or landmark') or something even more general ('salient moving edge')?"
      *   **Anticipated Answer:** "Content is fixed by the *most specific* Normal condition required for the performance of the *consuming* system. The content isn't 'predator,' but the condition required for the *flight* mechanism (consuming the representation) to succeed *in the way it was selected for*. Content is relational."
      *   **Cornering Follow-Up:** "This seems to push the problem upstream. How does selection history fix the content of the *consuming* mechanism? Doesn't the consuming mechanism (e.g., the flight system) likely also have a coarse-grained selective history (selected for fleeing predators, escaping collapsing terrain, chasing mates...)? Won't the 'most specific Normal condition' for *its* success also be disjunctive? How do we avoid an infinite regress or pervasive indeterminacy of content?"

  4.  **Question on Novelty & "Derived" Proper Functions:** "Teleosemantics grounds content in *evolutionary* selection history. How does it handle novel representations – thoughts about things utterly absent from our evolutionary past, like 'boson' or 'bitcoin'? Millikan talks about 'derived proper functions' based on learning or cultural evolution. How does the selection history of the *learning mechanism itself* confer a *specific* content (e.g., 'boson') onto a novel representational state, rather than something more general like 'thing reliably co-occurring with teacher's approval' or 'concept invoked in successful physics predictions'?"
      *   **Anticipated Answer:** "Derived proper functions arise from the functioning of learning mechanisms *themselves* having evolutionary proper functions (e.g., to acquire useful information). The specific content 'boson' is fixed by the Normal conditions under which the learning process (e.g., testimony, experimentation) produces states that successfully guide actions *in accordance with the learning mechanism's function*."
      *   **Cornering Follow-Up:** "But isn't the success condition for the learning mechanism often *proximal*? A child learns 'boson' correlates with teacher nods and good grades. An adult scientist associates it with successful predictions and publications. The teleosemantic content seems to be 'thing satisfying these proximal success conditions,' not the distal physical entity itself. How does selection history bridge this gap and anchor content to the *distal object* ('boson') rather than the *proximal reinforcer*?"

  5.  **Question on Malfunction & Content Stability:** "You've explained that a malfunctioning mechanism retains its proper function/content. But consider a persistent environmental shift. Imagine a species of Arctic bird whose plumage color was selected for camouflage against snow. Due to rapid warming, snow cover is now rare. The plumage is constantly mismatched (misrepresenting the background). Over generations, the color gene becomes selectively neutral, then perhaps slightly deleterious due to predation, but hasn't changed yet. After 1000 years of constant misrepresentation in this new environment, does the plumage *still* represent 'snowy background'? If so, how is this content justified given the complete absence of the Normal condition? If not, at what point does the content change *without* a change in the mechanism or its selection history?"
      *   **Anticipated Answer:** "As long as the mechanism itself hasn't changed, and its *original* selection history (for snowy camouflage) remains the explanation for its presence, its proper function and content remain 'snowy background.' Misrepresentation persists. Content change requires a new selection history acting on the trait."
      *   **Cornering Follow-Up:** "This seems deeply problematic. The trait is now *systematically* failing the function that supposedly defines its content, and this failure is the *stable norm*. Isn't teleosemantics committed to the counterintuitive claim that the bird is perpetually misrepresenting its environment, even though the 'misrepresentation' is now the reliable, stable state? Doesn't this highlight a tension between content being fixed by *past* success conditions and the *current* causal/dispositional profile?"

  6.  **Question on the "Normal" Explanation & Indeterminacy:** "Millikan defines proper function via the 'Normal' explanation – the explanation referencing how the trait *historically* performed its function under conditions that were statistically Normal *for the ancestors*. How specific are these 'Normal conditions'? Aren't ancestral environments incredibly varied? Doesn't this inherent variability in the historical record inevitably lead to indeterminacy in specifying the *exact* content, making it difficult to rule out alternative, slightly different interpretations (e.g., 'fly' vs. 'small dark moving speck')?"
      *   **Anticipated Answer:** "The Normal explanation abstracts over the variation. It identifies the *specific effect* that was reproductively relevant across those varied conditions. The content is fixed by the condition required for the consuming system to perform *its* function. Indeterminacy is bounded by what mattered for fitness."
      *   **Cornering Follow-Up:** "But in complex cognitive systems, many subtly different conditions might have been sufficient for the consuming system to succeed in fitness-enhancing ways across different ancestral scenarios. How does selection history *precisely* pick out one specific condition (e.g., 'rabbit') over a closely related alternative (e.g., 'small furry herbivore') as *the* content? Doesn't the grain of selection often seem coarser than the grain of our perceptual and cognitive contents?"

  7.  **Question on Swampman & Accidentally Functional Systems:** "The Swampman thought experiment (a molecule-for-molecule duplicate of a human arising by chance in a swamp) challenges historical theories. Teleosemantics seems committed to Swampman having *no* mental states initially, as he lacks selection history. Yet, he behaves identically to a human. If Swampman successfully avoids a predator using his 'visual system,' isn't his visual state *doing the same job* (avoiding predation) that gives my visual state its content? Why isn't this *current* successful function sufficient for content? Doesn't privileging history over current causal role seem arbitrary here?"
      *   **Anticipated Answer:** "Teleosemantics is unapologetically historical. Swampman's states lack proper functions derived from selection history. They may have causal roles mimicking intentionality, but they lack genuine content. The 'job' being done is accidental, not a 'proper function'. Only history provides the normativity."
      *   **Cornering Follow-Up:** "But if Swampman survives and reproduces, building a lineage, his descendants *will* eventually have states with teleosemantic content derived from *their* selection history. At what precise point does content 'switch on'? Is there a critical mass of descendants? Doesn't this discontinuity (identical structure/behavior, radically different ontological status) between Swampman and his great-grandchild seem like a major bullet to bite, suggesting the historical requirement might be metaphysically excessive?"

  8.  **Question on Causal Asymmetry & Error:** "One appeal of teleosemantics is explaining the asymmetry of representation: why does a horse percept represent *horse* and not *horse-or-cow-on-a-dark-night*, even though both cause it? The answer given is that the mechanism was selected for responding to horses, not disjunctions. But how does selection *preclude* the disjunctive content? Couldn't the mechanism's selection history be accurately described as selection for responding to *anything that looks sufficiently horse-like under Normal conditions*, which *includes* the possibility of misrepresenting cows-on-dark-nights? Why isn't the disjunction *part* of the selected-for function?"
      *   **Anticipated Answer:** "Selection is for responding to the condition that was *reliably present* when the mechanism fired in a fitness-enhancing way in the *ancestral environment*. The disjunctive condition (cows-on-dark-nights) wasn't reliably present or relevant; it was an *abnormal* cause leading to error. Content is fixed by the Normal cause."
      *   **Cornering Follow-Up:** "This relies heavily on the statistical 'Normality' of the ancestral environment. If, in the ancestral environment, deceptive instances (cow-on-dark-night triggering horse response) occurred with a low but non-zero frequency, and the mechanism was *never* selected to discriminate further (perhaps discrimination was too costly), doesn't the disjunction *actually become part of the selected-for function*? The mechanism was selected *to fire under these perceptually similar conditions*, even if it sometimes led to error, because the cost of missing a horse was higher. Doesn't this *force* the disjunctive content?"

  ### Key for Delivery

  *   **Clarity is Key:** Phrase the questions clearly and deliberately. Don't rush. Ensure the specific tension being probed is evident.
  *   **Listen Carefully:** The cornering power comes from directly engaging with *their specific formulation* of the anticipated answer. Adapt the follow-up slightly if their answer differs from the anticipation, but maintain the core challenge.
  *   **Don't Be Afraid of Silence:** After asking the follow-up, let the philosopher grapple. Don't fill the silence immediately.
  *   **Terminology:** You used terms like "proper function," "Normal explanation," "consuming system," "derived proper function" – all core Millikanese. The philosophers in the room will recognize them. Brief contextual phrases ("the Normal explanation, referencing historical conditions...") within the questions are sufficient.
  *   **Goal:** The aim isn't to "win" or embarrass, but to have the philosopher articulate the *best defenses* of teleosemantics against its most persistent criticisms, pushing the discussion beyond exposition into deep justification. Your biology background gives you a unique perspective on the plausibility of the historical claims; use that intuition to guide your listening and any spontaneous further questions that arise.

  This set should provoke a substantial and illuminating discussion, moving well beyond a simple restatement of the theory into its critical evaluation. Good luck with the interview!
