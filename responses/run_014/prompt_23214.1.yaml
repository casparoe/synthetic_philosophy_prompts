  First, I need to recall Millikan's teleosemantics: it grounds mental content in evolutionary functions. A representation's content is what it was selected to represent, and misrepresentation happens when it fails to do so. The user mentioned three key areas: misrepresentation, the function debate (dispositional vs. historical), and how selection fixes content.

