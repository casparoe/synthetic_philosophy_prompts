  ### In-Class Game: Truth Pursuit Challenge  
  **Goal:** Make students intuitively grasp why incoherent credences (e.g., 0.7 in a claim and 0.7 in its negation) are worse for accuracy than coherent ones, using a hands-on scoring game.  

  **Materials Needed:**  
  - Whiteboard or poster paper  
  - Markers  
  - 4 sets of red/blue index cards (1 red + 1 blue per team)  
  - Candy (e.g., Starbursts) for prizes—20 pieces total  
  - Timer  
  - Pre-made outcome slips (3 sealed envelopes labeled "Day 1," "Day 2," "Day 3")  

  **Claims (posted on board):**  
  - **Claim A (red card):** "The campus shuttle will be late tomorrow."  
  - **Claim B (blue card):** "The campus shuttle will be **on time** tomorrow."  
  *(Note: B is A’s negation—simpler than "10+ min late" to highlight the core conflict.)*  

  **Rules:**  
  1. **Teams:** Split into 4 teams of 4 students. Each team gets 1 red card (for Claim A) and 1 blue card (for Claim B).  
  2. **Credence Input:**  
     - Teams assign a number between 0 and 1 to **each claim** (e.g., "0.7" for A, "0.3" for B).  
     - They write these on their cards (red for A, blue for B) and hand them to you.  
  3. **Scoring (per round):**  
     - **Truth-value:** After all submissions, reveal the day’s outcome (e.g., "Shuttle was late → A=**1**, B=**0**").  
     - **Points Formula:**  
       - Score per claim = **100 − [100 × (truth − guess)²]**  
       - **Team’s round score = Score_A + Score_B**  
     *(Example: If truth=1 and guess=0.7, score = 100 − [100 × (0.3)²] = 100 − 9 = 91.)*  
  4. **Rounds (3 total, 10 min each):**  
     - **Day 1 (on time):** Truth = A=0, B=1 *(sealed envelope: "Shuttle arrived on time")*  
     - **Day 2 (late):** Truth = A=1, B=0 *(envelope: "Shuttle was 8 min late")*  
     - **Day 3 (on time):** Truth = A=0, B=1 *(envelope: "Shuttle arrived on time")*  
  5. **Prizes:** Total scores across 3 rounds determine ranking. 1st place: 10 candies, 2nd: 6, 3rd/4th: 2 each (participation).  

  **Timing (75 min total):**  
  - **0–10 min:** Divide teams, explain rules, and demo scoring (use examples on the board).  
  - **10–40 min:** Run 3 rounds (10 min/round):  
    - *Each round:* Teams discuss → write credences → submit → reveal outcome → calculate scores → post totals.  
  - **40–50 min:** Tally final scores, award candy.  
  - **50–75 min:** Debrief (script below).  

  ---

  ### Debrief Script (25 min)  
  **Step 1: React (5 min)**  
  *Ask:* "Which strategies felt successful? Did any team stick out? Let’s see why."  
  - Highlight a team that used **coherent credences** (e.g., A=0.3, B=0.7). Show their scores:  
    - **Day 1 (on time):** A=0.3→64, B=0.7→91 → **155**  
    - **Day 2 (late):** A=0.3→51, B=0.7→51 → **102**  
    - **Day 3 (on time):** Same as Day 1 → **155**  
    - **Total: 412**  
  - Now contrast with a team that used **incoherent credences** (e.g., A=0.7, B=0.7):  
    - **Day 1:** A=0.7→51, B=0.7→91 → **142**  
    - **Day 2:** A=0.7→91, B=0.7→51 → **142**  
    - **Day 3:** Same as Day 1 → **142**  
    - **Total: 426** (lower than 412!)  

  **Step 2: Reveal the Dominance (10 min)**  
  *Say:* "Notice something weird? The 0.7/0.7 team got **142 every round**—even when truth changed! But look at this…"  
  - Show a **coherent alternative** (e.g., A=0.5, B=0.5):  
    - **Day 1:** A=0.5→75, B=0.5→75 → **150**  
    - **Day 2:** Same → **150**  
    - **Day 3:** Same → **150**  
    - **Total: 450** (beats 0.7/0.7 in **every round**).  
  *Ask:* "Why is 0.5/0.5 *always* better than 0.7/0.7, no matter if the shuttle is late or on time?" *(Let students discuss.)*  

  **Step 3: Connect to Accuracy-First Epistemology (10 min)**  
  *Explain:*  
  - "Your goal was to minimize *inaccuracy*—how far your guesses were from truth. Squared distance (like (truth − guess)²) measures this. **Smaller squared distance = more accurate.**  
  - The 0.7/0.7 team was **incoherent**: Their credences didn’t 'add up' (0.7 + 0.7 = 1.4 ≠ 1). This made them *vulnerable*:  
    - **Incoherent credences are always beatable.** There’s *always* a coherent alternative (like 0.5/0.5) that’s **closer to truth in every possible world**—whether A is true or false.  
  - This is **dominance avoidance**: If you care *only* about accuracy, you *must* avoid incoherent credences. Otherwise, you’re leaving 'free accuracy' on the table!"  

  **Step 4: Link to Probabilism (5 min)**  
  *Wrap-up:*  
  - "In accuracy-first epistemology, **probabilism** (having credences that add to 1) isn’t arbitrary math—it’s the only way to avoid being *strictly dominated* on accuracy.  
  - The math we used (*squared distance*) is one way to measure inaccuracy, but the core idea holds for *any* reasonable measure: **Incoherence → guaranteed inaccuracy waste.**  
  - Real-world takeaway: If you want your beliefs 'closer to truth,' keep them coherent!"  

  ---

  ### Predictable Problems & Fixes  
  1. **"Why squared distance? It feels random."**  
     - *Fix:* Pre-empt this in the demo. Show a quick example: "If truth=1, guess=0.9 → error=0.1 → squared=0.01. Guess=0.5 → error=0.5 → squared=0.25. Squared penalizes big errors harder."  

  2. **Teams "game" the system** by copying the winners.  
     - *Fix:* After Round 1, say: "Truth changes daily—yesterday’s winner might lose tomorrow!" (Outcomes vary enough to punish blind copying.)  

  3. **Math slows things down.**  
     - *Fix:* Use a calculator app to score publicly. Pre-calculate common credences (0.3, 0.5, 0.7) for speed.  

  4. **"Why not use probabilities for real events?"**  
     - *Fix:* In debrief, clarify: "We simplified to focus on coherence. Real beliefs have evidence—but even then, *given your evidence*, incoherence still hurts accuracy."  

  ---

  ### What the Game *Can’t* Reproduce (Need to Explain)  
  **The "Expected" Part:**  
  - The game shows dominance **after truth is revealed**, but accuracy-first uses **expected inaccuracy** *before* truth is known.  
  - *Explain post-game:* "In real life, you minimize *expected* inaccuracy using your *current* credences. Coherence ensures no matter how evidence shifts, you won’t be *guaranteed* to do worse. The game’s 'guaranteed beatability' is a simplified version of this."  

  **Jargon to Avoid Until Debrief:** "dominance," "proper scoring rule," "probabilism."  
  **Use Instead:** "always beatable," "accuracy penalty," "credences adding to 1."  

  This game makes incoherence feel *risky* and coherence *rewarding*—letting students "discover" the dominance intuition before you name it. By Round 3, teams racing to adjust credences will *feel* why 0.7/0.7 is a bad bet!
