prompt: |-
  I am the technical staff lead for a model fire and life-safety code maintained by a nonprofit standards developer. Every three years we open a revision cycle, and in each cycle we receive three to four hundred public proposals to delete or simplify an existing provision. They almost all run the same argument: no recorded rationale can be found, the requirement is redundant with something newer, it costs money, and nobody has shown it prevents anything. The committee that votes is roughly twenty volunteer engineers, fire marshals, and builders who get about four minutes per proposal on the floor; I get about thirty minutes per provision to prepare the half-page dossier they see. There is an external appeals route for anyone aggrieved by a decision to retain, and a provision we delete is not fully recoverable at the next cycle, because our code applies prospectively and construction completed in the intervening three years stays permanently grandfathered under the deleted text.

  What I want to encode is Chesterton's fence — the parable, usually credited to Chesterton, about the reformer who declares a fence across the road useless and the traditionalist who replies that until the reformer can say what the fence is doing, he has no standing to tear it down — fused with the Burkean thought that a long-standing requirement is a deposit of knowledge nobody wrote down. I do not want the slogan. I want a procedure my staff can run and hand to a volunteer who has four minutes.

  Write that procedure. It must satisfy the following.

  1. Open with the ordered questions a staffer asks of a deletion proposal, and for each one state what counts as a sufficient answer, what counts as a failure, and what to do when the answer cannot be obtained in the time available. Include an explicit stopping rule for the search itself: when the audit has cost more than the deletion is worth, the procedure should say so and return a verdict.

  2. Return one of four verdicts — delete, retain as written, re-found (keep the requirement but replace its stated rationale and possibly its scope), or hold to the next cycle — and say what each commits us to and when the fourth is merely an evasion.

  3. Handle the problems that make this domain hard, without my having to name them all: that the outcome a safety provision is meant to produce is a non-event, so absence of incident data is not evidence of absence of function; that the reason a provision was adopted and the work it does now can come apart in both directions; that provisions are cited by other provisions, inspection checklists, training curricula, insurance underwriting, and licensing exams, so a deletion can silently orphan things nobody tracks; and that reversibility here is weaker than it looks, given the grandfathering rule above.

  4. Treat the case of a provision whose origin is documented and ugly — adopted at the urging of a trade association whose stated aim was to exclude a class of workers from the trade — as a distinct branch, not a footnote. Tell me whether an illegitimate origin is decisive, and if it is not, say precisely what work it still does in the reasoning.

  5. Mark every step that is a judgment call wearing procedure's clothes.

  Then run it on three proposals.

  A. A requirement, dating from the 1950s, for a manually operated alarm pull station at each exit of a class of storage occupancy. Sprinklers and automatic detection are now mandated throughout the same buildings by a newer chapter. The original committee report is missing; the requirement is cross-referenced by three other sections, appears on a widely used inspection checklist and a state licensing exam; and no adopting jurisdiction reports a single fire in twenty years in which a pull station alerted occupants — though none tracks that either.

  B. A requirement that a particular exterior wall joint be sealed with material of a specified fire-resistance rating. The proposer is a manufacturer whose product does not qualify. The entire file is a one-line 1978 rationale reading that it was recommended by the committee, no incident data, and a letter from one retired inspector asserting that it matters.

  C. The exclusionary-origin provision described in point 4, which is still doing real safety work and for which the qualified workforce is thin.

  For at least one of these, the procedure must return a verdict I will not like, and it must not soften it. In case B, show what the dossier says when the audit stalls rather than inventing findings.

  Close with the failure modes: where the procedure will misfire, its built-in tilt toward retention and what to do about a code that has accreted hundreds of dead provisions, and which of the four verdicts is most likely to be abused.

  Begin with a single sentence stating the operative decision rule — what makes a provision stay and what makes it go — then give the procedure, then the three worked cases, then the failure modes. No preamble, no restatement of my situation, no closing summary, and no citations or bibliography; invoke distinctions in prose if you need them.
reasoning: |-
  We are given a scenario where we must develop a procedure for evaluating proposals to delete or simplify provisions in a fire and life-safety code. The procedure must be based on Chesterton's fence and Burkean conservatism, meaning we should not remove a provision until we understand why it was put there and what function it serves, even if that function is not immediately obvious.

  The procedure must return one of four verdicts: delete, retain as written, re-found (keep the requirement but replace its stated rationale and possibly its scope), or hold to the next cycle.

  We are also given three proposals to test the procedure.

  The core decision rule: 
  **A provision must be retained unless it is proven to be either (1) non-functional (i.e., it serves no current purpose and never served a purpose that remains relevant) or (2) functionally redundant (i.e., its current purpose is entirely and adequately served by another provision). If the provision has an illegitimate origin, that does not automatically invalidate it; we must still examine whether it currently serves a legitimate safety purpose.**

  Now, the procedure:

  **Procedure for Evaluating a Deletion Proposal**

  1. **Identify the provision's current functional purpose.**
     - *What to look for*: What specific hazard does this provision address? What outcome is it designed to achieve? How does it interact with other provisions and systems?
     - *Sufficient answer*: A clear description of the safety function, even if inferred from context, and evidence that the function is still relevant (e.g., the hazard still exists, the system it interacts with is still in place).
     - *Failure*: No identifiable function or a function that is obsolete (e.g., the hazard no longer exists because of other changes).
     - *Timeout handling*: If the function cannot be determined within the time limit, move to step 2 to look for historical purpose. If step 2 also fails, then hold (verdict 4) unless the cost of the search exceeds the cost of keeping the provision (see stopping rule).
     - *Stopping rule for the audit*: If the cumulative time spent on this provision (including staff and committee time) exceeds the estimated annual compliance cost of the provision multiplied by three (representing the three-year cycle), then stop and return "retain as written" by default. (Rationale: If we cannot determine the function in the time it would take to pay for the cost of keeping it for one cycle, then we leave it until more resources are available.)

  2. **Identify the provision's historical origin and original purpose.**
     - *What to look for*: Why was this provision adopted? What problem was it meant to solve? Was it a response to a specific incident? Are there records of the committee's deliberations?
     - *Sufficient answer*: Documentation (e.g., committee reports, meeting minutes) or reliable testimony (e.g., from long-standing members) that explains the adoption. If the origin is illegitimate (e.g., adopted for exclusionary reasons), note that but proceed to step 3.
     - *Failure*: No record and no credible account of the origin.
     - *Timeout handling*: If the historical purpose cannot be found, but the current function (from step 1) is clear and still relevant, then we can proceed. If both are missing, then the case for deletion becomes stronger, but we must still check for external dependencies (step 3).

  3. **Check for external dependencies.**
     - *What to look for*: Does any other provision in the code reference this one? Is it included in inspection checklists, training materials, insurance requirements, or licensing exams? Would deletion break any of these?
     - *Sufficient answer*: A list of dependencies and an assessment of the impact of deletion on these systems. If dependencies exist, they must be addressed (e.g., by updating the referencing documents or by re-founding the provision so that the dependency is maintained).
     - *Failure*: No dependencies found, or dependencies that are easily updated without compromising safety.
     - *Timeout handling*: Allocate a fixed time (e.g., 10 minutes) for this step. If the search is incomplete, assume dependencies exist and are critical (because we cannot prove otherwise) and thus return "hold" or "retain" until the next cycle.

  4. **Assess redundancy.**
     - *What to look for*: Is the function of this provision entirely and adequately covered by another provision (or set of provisions) that will remain? Consider both explicit and implicit coverage.
     - *Sufficient answer*: Clear mapping of the function to one or more other provisions, and evidence that those provisions are at least as effective and as consistently applied.
     - *Failure*: The provision addresses a unique aspect not covered elsewhere, or the coverage by other provisions is partial or uncertain.
     - *Timeout handling*: If the redundancy analysis is inconclusive, then the provision is not redundant and we must retain.

  5. **Evaluate the provision's effectiveness and incident history.**
     - *What to look for*: Are there any incidents (fire, injury, death) that this provision might have prevented? Are there any near misses? Absence of incident data is not evidence of ineffectiveness because the provision might be working. However, if there are incidents that occurred despite the provision, that might indicate ineffectiveness.
     - *Sufficient answer*: Data showing either (a) the provision has been effective (e.g., incidents decreased after adoption) or (b) the lack of incidents in a context where the hazard is present and the provision is in place (though this is weak). Also, consider expert testimony (e.g., from fire marshals) about the provision's role.
     - *Failure*: Evidence that the provision is ineffective (e.g., incidents occur even with the provision) or that it addresses a hazard that never materializes. But note: absence of evidence is not evidence of absence.
     - *Timeout handling*: If no data can be found, rely on the functional analysis from step 1 and 2. If the function is clear and the hazard is real, then the absence of incident data does not justify deletion.

  6. **Handle illegitimate origin (if discovered in step 2).**
     - *What to do*: Even if the origin was illegitimate (e.g., adopted to exclude a class of workers), we must still evaluate the provision on its current merits. Ask: Does the provision currently serve a legitimate safety function? Is that function necessary? If yes, then the provision should be retained or re-founded (to remove the taint of the original rationale). If no, then it should be deleted.
     - *Note*: The origin is a mark against the provision and may motivate re-founding, but it is not decisive.

  7. **Determine the verdict:**
     - **Delete**: If the provision is non-functional (step 1 and 5) or functionally redundant (step 4) and there are no critical external dependencies (step 3) that cannot be resolved by updating the references. Also, if the provision has an illegitimate origin and no current function, delete.
     - **Retain as written**: If the provision has a clear and necessary function, is not redundant, and there are no compelling reasons to change it (e.g., illegitimate origin). Also, if the audit times out (stopping rule) and we cannot determine the function, we retain by default.
     - **Re-found**: If the provision serves a necessary function but the original rationale is flawed (e.g., illegitimate origin) or outdated, or the scope needs adjustment (e.g., because of redundancy with a newer provision but only in part). Re-founding means rewriting the rationale and possibly the provision's scope while keeping its core requirement. This verdict requires that we also update external dependencies (step 3) to reflect the new rationale.
     - **Hold to the next cycle**: If the audit is inconclusive (e.g., we cannot determine the function or redundancy within the time and resources) and there is a risk of unintended consequences. Also, if external dependencies are found but cannot be resolved in this cycle. This verdict is an evasion if the issue is merely difficult and we have the resources to resolve it; it is appropriate if we lack critical information that could be obtained by the next cycle.

  **Worked Examples**

  **Proposal A**: Delete the requirement for a manually operated alarm pull station at each exit in a class of storage occupancy.

  1. **Current function**: To allow manual activation of the fire alarm by occupants in case automatic detection fails. (Even with sprinklers and automatic detection, manual pull stations provide a backup and allow activation before automatic systems trigger, e.g., in a smoldering fire.) *Sufficient answer*.
  2. **Historical origin**: Missing. *Failure*.
  3. **External dependencies**: Cross-referenced by three other sections; on an inspection checklist and a state licensing exam. *Dependencies exist*.
  4. **Redundancy**: Sprinklers and automatic detection are mandated, but they are not entirely redundant because they serve different functions (automatic vs. manual) and may activate at different times. Also, manual pull stations are a backup if automatic systems fail. *Not redundant*.
  5. **Effectiveness**: No incident data showing they alerted occupants, but absence of data is not evidence of absence of function. They might have been used in unreported near misses. *Inconclusive*.
  6. **Illegitimate origin**: None known.

  Verdict: **Retain as written**. The function is clear and necessary, dependencies exist, and it is not redundant. The lack of incident data does not override the functional need.

  **Proposal B**: Delete the requirement for a particular exterior wall joint to be sealed with material of a specified fire-resistance rating. The proposer is a manufacturer whose product does not qualify.

  1. **Current function**: To prevent fire spread through the joint. *Sufficient answer* (inferred from the requirement itself and the nature of fire safety).
  2. **Historical origin**: One-line rationale from 1978: "recommended by the committee." No incident data. *Failure* (no clear reason).
  3. **External dependencies**: None mentioned. Assume none found in the time allocated.
  4. **Redundancy**: We must check if other provisions (e.g., overall wall rating) cover this joint. The dossier does not show any redundancy analysis. *Inconclusive* (timeout: we assume no redundancy found).
  5. **Effectiveness**: Only a letter from a retired inspector saying it matters. No incident data. *Inconclusive*.
  6. **Illegitimate origin**: None indicated.

  But note: the proposer has a conflict of interest. The procedure does not treat that as a reason to reject, but it does require extra scrutiny.

  The audit stalled: we cannot find the origin, and we have no incident data. However, the current function (step 1) is clear: fire containment. Without evidence of redundancy (step 4) and without evidence that the requirement is ineffective (step 5), we must retain.

  Verdict: **Retain as written**. The dossier would say: "Function: fire containment at wall joint. Origin: unknown. Dependencies: none found. Redundancy: not established. Effectiveness: unknown. Given the potential risk, retain."

  **Proposal C**: A provision with an illegitimate origin (adopted to exclude a class of workers) but which is still doing real safety work and for which the qualified workforce is thin.

  1. **Current function**: The provision requires a specific qualification for a safety-critical task. The function is to ensure that only qualified personnel perform the task. *Sufficient answer*.
  2. **Historical origin**: Illegitimate (exclusionary). *Noted*.
  3. **External dependencies**: Likely exists (e.g., training, licensing). *Assume found*.
  4. **Redundancy**: No other provision ensures the same qualification. *Not redundant*.
  5. **Effectiveness**: The safety work is being done, but the qualified workforce is thin. This might indicate that the provision is too restrictive, but it does not negate the function.
  6. **Illegitimate origin**: Present, but the provision is currently serving a legitimate safety function.

  Verdict: **Re-found**. We keep the requirement but change the rationale to reflect the current safety purpose and possibly adjust the scope (e.g., broaden the qualifications) if the thin workforce is a problem. However, note that the thin workforce might be a separate issue that requires a different proposal (e.g., to expand the qualifications). The re-founding would remove the taint of the original rationale and update the provision to focus on safety.

  **Failure Modes**

  1. **Misfires**: 
     - The procedure may retain provisions that are truly obsolete because the function is hard to determine or because the cost of the audit times out and we retain by default.
     - It may be gamed by those who want to retain a provision by overstating dependencies or understating redundancy.
     - It may be too conservative, leading to code bloat.

  2. **Built-in tilt toward retention**: 
     - The procedure is designed to err on the side of safety. This is intentional but may lead to a code that accretes dead provisions over time. To combat this, the committee should periodically review held provisions and allocate more resources to auditing high-cost provisions. Also, use the "re-found" verdict to modernize and streamline.

  3. **Abuse of verdicts**:
     - **Hold** is most likely to be abused as a way to avoid making a tough decision. It should only be used when critical information is missing and obtainable in the next cycle. To prevent abuse, require that a plan for resolving the hold be documented (e.g., what data to collect by next cycle).
     - **Re-found** might be used to mask an illegitimate provision with a new rationale, but the procedure requires that the current function be legitimate.

  The procedure will not be perfect, but it provides a structured way to apply Chesterton's fence in a time-constrained, safety-critical environment.
answer: |-
  **Operative decision rule:** A provision must be retained unless it is conclusively shown to be non-functional (serves no current or historical purpose relevant to safety) or functionally redundant (its purpose is entirely and adequately served by one or more other provisions), and its deletion would not disrupt critical external dependencies; otherwise, it is retained, re-founded, or held.

  **Procedure: Deletion Proposal Audit**

  1. **Question 1: What is the explicit and implicit current function?**  
     - *Sufficient answer:* Description of a specific safety outcome (e.g., "prevents flame spread at joints") supported by technical logic, incident near-misses, or expert testimony.  
     - *Failure:* No identifiable hazard addressed, or function is obsolete (e.g., hazard eliminated by newer technology).  
     - *Timeout (15 mins):* If function unclear, proceed to Question 2. If audit time exceeds 3× annual compliance cost (estimate from industry data), return **retain as written** and halt.  
     - *Judgment call:* Interpreting "implicit function" (e.g., backup systems, human factors).

  2. **Question 2: What is the historical origin and original purpose?**  
     - *Sufficient answer:* Committee reports, meeting minutes, or credible oral history explaining adoption (e.g., "response to 1947 warehouse fire").  
     - *Failure:* No records found, or records show no safety basis (e.g., "adopted for trade protection").  
     - *Timeout (10 mins):* If origin unknown, proceed to Question 3.  
     - *Illegitimate origin branch:* If origin was exclusionary/anti-competitive but current function exists (Question 1), it does not invalidate the provision; proceed to Question 5. If no current function, proceed to Question 3.  

  3. **Question 3: What external dependencies exist?**  
     - *Sufficient answer:* List of cross-references in code, inspection checklists, exams, or underwriting standards, with impact assessment (e.g., "Section 5.2 cites this; deletion voids 5.2 enforcement").  
     - *Failure:* No dependencies found, or dependencies are trivial to update (e.g., checklist item easily removed).  
     - *Timeout (5 mins):* If dependencies suspected but unconfirmed, assume they exist and are critical.  

  4. **Question 4: Is the provision functionally redundant?**  
     - *Sufficient answer:* Mapping showing another provision(s) achieves identical safety outcome under all scenarios (e.g., "automatic detection covers all pull-station use cases").  
     - *Failure:* Partial overlap, or redundancy unproven (e.g., "sprinklers address fire suppression but not early manual alarm").  
     - *Timeout (10 mins):* If redundancy analysis incomplete, assume non-redundant.  

  5. **Question 5: Does incident history support deletion?**  
     - *Sufficient answer:* Data showing the provision failed to prevent incidents despite compliance, or evidence the hazard never materialized (e.g., "10-year incident logs show no joint-seal fires").  
     - *Failure:* Absence of incident data, or near-miss reports.  
     - *Timeout (5 mins):* Treat absence of data as neutral (non-evidence).  

  **Verdicts:**  
  - **Delete:** If provision is non-functional (Q1/Q5 failure) or redundant (Q4 sufficient) with no critical dependencies (Q3 failure). Commits to immediate removal; grandfathering applies.  
  - **Retain as written:** If function is confirmed (Q1 sufficient), not redundant (Q4 failure), and dependencies manageable. Commits to no changes.  
  - **Re-found:** If function is valid but rationale/origin is flawed (Q2 failure) or scope misaligned (e.g., partial redundancy). Commits to rewriting rationale/scope and updating dependencies in this cycle.  
  - **Hold to next cycle:** If Q1–Q5 inconclusive due to missing data obtainable later (e.g., pending incident study), or dependencies require multi-cycle coordination. Evasion if resources existed to resolve now.  

  ---

  **Worked Examples**  

  **Proposal A: Delete manual alarm pull stations in sprinklered storage occupancies.**  
  1. **Q1:** Current function: Backup alarm activation if automatic systems fail. Sufficient (technical logic: redundancy in life-safety systems).  
  2. **Q2:** Historical purpose: Unknown (records missing). Failure.  
  3. **Q3:** Dependencies: Cross-referenced in 3 sections, on inspection checklist and exam. Sufficient (critical impact).  
  4. **Q4:** Redundancy: Automatic detection covers fire initiation but not manual human intervention (e.g., smoldering fire pre-detection). Failure.  
  5. **Q5:** Incident history: No data, but absence not evidence of non-function. Failure.  
  **Verdict: Retain as written.**  
  *Why you won’t like it:* Dependencies and lack of proven redundancy override cost arguments.  

  **Proposal B: Delete fire-resistance rating for exterior wall joint (proposer: manufacturer with non-compliant product).**  
  1. **Q1:** Current function: Prevent fire spread through joints. Sufficient (inferred from fire science).  
  2. **Q2:** Historical purpose: "Recommended by committee" (1978). Failure (no safety rationale).  
  3. **Q3:** Dependencies: None found in time. Failure.  
  4. **Q4:** Redundancy: Unknown if wall assembly requirements cover joints. Timeout → assume non-redundant.  
  5. **Q5:** Incident history: No data; retired inspector asserts importance. Timeout → neutral.  
  **Dossier entry (audit stalled):** "Function: Fire containment at joints (inferred). Origin: Unknown. Dependencies: None found. Redundancy: Unconfirmed. Incidents: No data. Audit incomplete; cost threshold not reached."  
  **Verdict: Retain as written.**  

  **Proposal C: Delete exclusionary-origin provision (still functional, thin workforce).**  
  1. **Q1:** Current function: Ensures safety-critical task performed by qualified workers. Sufficient (prevents errors).  
  2. **Q2:** Historical purpose: Adopted to exclude worker class (documented). Illegitimate, but current function exists → proceed.  
  3. **Q3:** Dependencies: Likely in licensing exams. Sufficient (assumed critical).  
  4. **Q4:** Redundancy: No equivalent qualification requirement. Failure.  
  5. **Q5:** Incident history: Does real safety work; thin workforce irrelevant to function. Failure.  
  **Verdict: Re-found.** Rewrite rationale to focus on competency (e.g., "minimum skill standard for hazard mitigation"), adjust scope if workforce scarcity is a safety risk.  
  *Why you won’t like it:* Illegitimate origin doesn’t erase current function, but forces re-founding.  

  ---

  **Failure Modes**  
  - **Misfires:**  
    - Over-retention: Procedure tilts toward retaining "mystery functions" when evidence is scarce, increasing code bloat.  
    - Timeout abuse: Stopping rule may retain costly provisions if cost estimation is inaccurate.  
    - Dependency blindness: External systems (e.g., exams) may retain references despite deletion, causing enforcement gaps.  
  - **Tilt toward retention:** Built-in assumptions (e.g., "absence of incident data ≠ non-function") favor status quo. Mitigation: Prioritize audits for high-cost provisions, batch similar proposals for efficiency.  
  - **Verdict abuse:**  
    - **Hold** most likely evasive; limit to verifiable data gaps (e.g., "state agency incident study due next year").  
    - **Re-found** may mask unjustifiable provisions with new rationale; require explicit function mapping.  
  - **Accretion risk:** Dead provisions persist due to inconclusive audits. Counter: Sunset clauses for held items, or multi-cycle "delete if still unsupported" flags.
