     Solution: In the debrief, use concrete examples: "In round one, we found that the number of I's mod 3 never changed. That was our 'outside view'. But in round two, the new rule broke that pattern. So we had to find a new way."

  5. Problem: Time management. 
     Solution: Keep strict timings. Have a timer visible. For the debrief, plan the points to cover and stick to them.

  What the activity cannot stage:
  - We cannot stage the full idea of Gödel's theorem or self-reference. We are only showing the idea of an invariant and how it can break when the system changes. We are not showing how a system can refer to its own statements.

  Final debrief points:

