          - It is not a Gödel sentence: Gödel's theorem involves self-reference and a formal system proving its own consistency, which we haven't touched.
          - A formal system doesn't "hop outside itself" — we, as reasoners, are the ones stepping outside to notice patterns.
          - And to the question: "Does this show minds aren't machines?" — We can say: "This activity shows that sometimes we need to step outside the system to see patterns, but that doesn't mean machines can't do the same. Machines can also be programmed to look for invariants. So it doesn't prove minds aren't machines."

  Materials:
  - For each group: a whiteboard or large sheet of paper and markers, or worksheets where they can write the strings and rules used.
  - Handout with the rules for each round (or project them).
  - A timer to keep track.

  Potential problems and solutions:

  1. Problem: Groups may get stuck in round one and not get to the point of thinking about impossibility. 
