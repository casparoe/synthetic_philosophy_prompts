  Structure:

  Total time: 110 minutes, with a break in the middle. So we can split into two halves: about 50 minutes each, with a 10-minute break in between? But we have two rounds and a debrief. We need to include group work, prediction, and debrief.

  Proposed timeline:

  1. Introduction (5 minutes): Explain the rules of the first system (without the extra rule). Show the starting string MI and the goal MU. Explain the four rules. Form groups (six groups of three). Each group has a worksheet or a whiteboard to write down their steps.

