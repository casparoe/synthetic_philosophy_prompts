  2. Problem: In round two, some groups might not find the derivation. 
     Solution: Have a hint ready: "Remember you can use the extra rule to turn a U into two I's. How can you get a U?" If still stuck, after 20 minutes, show the solution.

  3. Problem: The GEB readers might dominate their group and say "it's impossible" in round two without trying. 
