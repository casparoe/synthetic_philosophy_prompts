prompt: |-
  ok so I'm in this cross-listed philosophy of biology / evolutionary psych seminar and we spent a whole section on "is evo psych science or just-so stories" and it was honestly kind of a mess — the defender just kept saying "converging evidence!" and the critic just kept saying "adaptationism!" and nobody actually pinned down what the disagreement even was. Our prof wants us to hand in something that gets at the real crux, and I'd definately rather do a dialogue than an essay.

  So: you're a philosopher of biology who knows both the evo psych literature and the philosophy of science stuff on historical explanation cold. Before you start writing, spend a beat working out what the strongest version of each side actually is — I don't want a strawman on either side, and I don't want them trading jargon past each other.

  Two characters, both smart, both worth taking seriously:

  - One is an adaptationist evolutionary psychologist: the mind is a bundle of domain-specific mechanisms shaped by selection in ancestral environments, recoverable by reverse engineering from behavior plus comparative and cross-cultural data.
  - The other accepts evolution and selection but thinks the adaptationist inference pattern is too weak to carry the weight, and has a real alternative positive program — cultural evolution, developmental plasticity, niche construction, whatever you think is strongest.

  Three cruxes I want them to actually fight about, not gloss:

  1. Historical sciences can't run experiments. Paleontologists get by on evidence that's hard to explain except by the hypothesis in question, and on the thought that the alternative would require a lot of independent coincidences. Does evo psych get that same license? The critic's line: the fossil record is independent of the hypothesis in a way that "people act like X today" isn't, since the hypothesis was built to fit X in the first place. The defender's line: convergent evidence from development, cross-species comparison, and small-scale societies is exactly the paleontologist's move. Let them press each other on whether that analogy holds up.

  2. The mismatch / adaptive lag assumption — that our psychology is adapted to ancestral conditions rather than present ones — and the related idea that culture is itself generated by evolved mechanisms, so cultural variation can't refute adaptation. Critic: that makes it unfalsifiable. Defender: has to say what would actually refute it.

  3. Have them negotiate a standard by the end: what would a hypothesis in this field have to predict, ahead of time, to count as supported? Each should concede one thing and hold one line, and each should say what finding would make them drop their view.

  No citations, no reading list, I don't need names or dates — I just want the argument. And if the way I've set this up is confused — like if my "critic" isn't actually a coherent alternative, or if these two wouldn't really disagree about anything empirical — just say so up front instead of writing me a polite fake dialogue.

  Hard cap: 800 words for the whole thing. American English, casual register is fine, they're grad students.
