answer: |-
  ## Evo Psych Dialogue: The Core Grind

  **Setting:** Grad student lounge after seminar. Coffee cups, laptops open. **ADA** (adaptationist) and **DEV** (critic) are still buzzing.

  **ADA:** Okay, look. We keep circling. My core strength: the mind *is* complex machinery. Natural selection is the *only* known process that builds functional complexity over time. So, for psychological traits that look functional – like jealousy guarding mates, or fear of snakes – the *default* inference is adaptation. And we *do* test it! We look for convergence: the trait appears across cultures, even small-scale ones. We see precursors in other primates. We look for developmental canalization – it emerges reliably. *That’s* our fossil record. Like finding Tiktaalik – fishy bits, tetrapod bits, exactly where geology predicts. Here, the prediction is: functional design for ancestral problems.

  **DEV:** But that’s the rub, Ada. Your "fossil record" isn't independent like Tiktaalik's bones or the iridium layer. We *build* the hypothesis *from* the modern behavior and *then* say "Look, it shows up elsewhere!" It’s circular risk. Paleontology uses *independent* dating (radiometric), *independent* geochemistry (iridium isn't *about* dinosaurs). What’s your truly independent constraint? You *infer* the ancestral problem *from* the modern trait you’re trying to explain. Where’s *your* iridium layer?

  **ADA:** Fair push. But it’s not *just* behavior! We use physiology – specific brain areas lighting up, hormonal responses. We use genetics – finding alleles linked to traits plausibly under selection. We use evolutionary game theory models showing a trait *could* be stable. It’s the *consilience* – multiple lines pointing to the same functional explanation. If jealousy involves specific neurochemical pathways *and* shows cross-cultural patterns *and* fits mating investment theory... that’s converging evidence, not just fitting a story.

  **DEV:** Consilience feels good, but it can be post-hoc harmony. My positive alternative: the Developmental Systems approach. Genes aren't blueprints; they're participants in complex, plastic systems interacting with environments over time. Niche construction! We actively reshape our environments, creating new selection pressures *and* new developmental contexts. Culture isn't *just* output from universal modules; it’s a dynamic system co-evolving with biology, transmitting information laterally, rapidly. A trait like, say, complex tool use might emerge from accumulated cultural learning ratcheting up, leveraging general plasticity, *without* a dedicated "tool module" shaped by Pleistocene selection.

  **ADA:** Okay, but then **Crux Two**: the mismatch problem. *If* a trait *is* an adaptation, it was shaped for past environments. Present weirdness – like fear of public speaking – might be a misfire. And culture *itself* arises from evolved capacities for learning, imitation, norm-psychology. So cultural variation doesn't *refute* adaptationism; it *uses* it. Finding a culture without jealousy wouldn't necessarily refute its adaptive origins; maybe their specific ecology or social structure suppresses the expression, or they channel it differently. The underlying mechanism could still be there.

  **DEV:** And there’s the unfalsifiability! If every time a prediction fails, you say "mismatch!" or "suppressed expression!" or "channeled differently!", what *could* falsify the adaptationist hypothesis for a *specific* trait? What observation would make you say, "Okay, maybe jealousy *isn't* a direct mate-guarding adaptation shaped by selection"?

  **ADA:** Good challenge. Here’s what would refute it for a *specific* hypothesis: 1) Finding the trait is *not* functional in *any* plausible ancestral context we can reconstruct. 2) Showing it’s a direct byproduct of a clearly non-adaptive mechanism (e.g., a developmental glitch with no conceivable selective advantage). 3) Demonstrating *superior* explanation via non-adaptive processes – like strong genetic drift *plus* clear evidence it wasn't under selection, or your cultural ratcheting model making *better*, *falsifiable* predictions about the trait's distribution and development than the adaptationist one. I need a *better* historical explanation.

  **DEV:** Okay, that’s progress. So **Crux Three: the standard**. What makes a *supported* evo psych hypothesis? What does it need to *do*?

  **ADA:** It needs to predict *novel* findings beyond the initial observation. Not just explain jealousy, but predict *who* gets most jealous, under *what specific triggers*, based on adaptive logic (e.g., cues to partner's reproductive value or infidelity risk). It needs consilience: behavioral data + physiological markers + cross-cultural occurrence + fit with evolutionary models. And crucially, it should make sense of *seemingly* irrational aspects as rational in the EEA.

  **DEV:** I can concede that *some* psychological traits *are* likely adaptations – basic fear responses, suckling reflexes. But for complex social cognition? The bar must be *much* higher. A supported hypothesis needs: 1) **Robust independent evidence for the *specific* ancestral selective pressure** – not just plausible storytelling. Archaeology, detailed paleoecology, maybe ancient DNA insights into social structure. 2) **Rigorous testing against strong alternatives**: Can drift+plasticity explain it? Can cultural evolution explain its distribution *better*? Can we model its emergence *without* invoking dedicated adaptation? 3) **Evidence of *design*** – not just function, but specificity and efficiency that screams "selected for *this*," ruling out it being a byproduct or general plasticity. Show me the cognitive equivalent of the panda's thumb, not just "it kinda works."

  **ADA:** I’ll concede we need *much* better anchors for the EEA than we often have. More archeology, better models. And we need to *actively model and test* alternatives like drift or plasticity, not just gesture at them. But I hold the line: for traits showing apparent complex functional design, adaptation *is* the best starting point. Finding a complex, reliably developing, cross-culturally present psychological mechanism with no conceivable adaptive benefit in *any* plausible past environment – *that* would shake me. Like a universal, costly, complex fear of... fluffy clouds.

  **DEV:** And I’ll concede that *if* you meet that high bar – truly independent EEA evidence, ruling out plasticity/culture, showing specific design – then adaptation becomes compelling. What would sink *my* skepticism? Finding a complex, universal human psychological trait that demonstrably *reduced* fitness in documented ancestral-like small-scale societies, *and* shows no signs of being a byproduct, *and* resists explanation by cultural transmission or plasticity. Proving maladaptation *despite* selection’s power. That’d be your smoking gun.

  **ADA:** Deal. Now... more coffee? This is exhausting.
  **DEV:** Please. But we're finally getting somewhere.
