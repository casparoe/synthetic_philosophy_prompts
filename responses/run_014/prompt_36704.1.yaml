prompt: |-
  Write me a parody of those glossy corporate "your year in review" emails — the Spotify Wrapped kind — put out by a fictional data-analytics company whose whole product is reconstructing people's preferences from their behavior. Call it something like Preflytics and have them send users their annual "True Self Report." Around 650 words, formatted like a real marketing email: subject line, hero stat, a couple of widgets, closing CTA, plus a short FAQ at the bottom.

  The satire has to come from actually taking revealed preference theory seriously as a business model, so a behavioral economist laughs instead of wincing. The company never asks users what they want, because asking would be methodologically suspect — every claim about the user is inferred from choices only, and the email should wear that as a virtue ("You told three friends you were trying to cut back on drinking. You ordered 74 drinks. We know which of those is data."). Work in the real trouble spots of the theory as product features: sunk-cost hours logged as enjoyment ("you finished a 60-hour game you described in your notes app as 'a chore' — engagement through the roof"), the no-distinction between wanting something and choosing it, the way the report literally cannot express that anything is bad for you because utility is only ever measured relative to observed behavior, and an adaptive-preference badge congratulating users for gracefully ceasing to want things that became unavailable or unaffordable ("Cheapest contentment we've ever measured!").

  Include at least one widget where the same set of choices gets spun two ways depending on which framing is more flattering to the company, without ever acknowledging that the two framings conflict — that's menu-dependence laundered as a feature, and I'd like it to be visible to a careful reader but never flagged.

  And the FAQ at the end should handle objections the way the theory historically did: someone writes in "what if I chose it because I had no better option," and the answer cheerfully explains that choosing among available options is all choosing ever is. A question about whether people sometimes choose against their own interests should get a response that quietly redefines "interests" as whatever shows up in the data. Maybe a final FAQ item about the unsubscribe link, noting that unsubscribing will be recorded as a preference for less transparency, which the algorithm will factor into next year's report.

  Keep it deadpan throughout — no winking narrator, the horror should be entirely structural. And please make sure the legal footer does some real work: something like a clause where the user's self-description, once contradicted by enough behavioral data, gets automatically updated in the company's records, with a friendly note that this is for the user's own consistency.
reasoning: |-
  We are creating a parody of a corporate "year in review" email from a fictional data-analytics company called Preflytics. The product is reconstructing people's preferences from their behavior without asking them. The email is called the "True Self Report". We need to include:
   - Subject line
   - Hero stat
   - A couple of widgets (with one widget that spins the same data two ways without acknowledging the conflict)
   - Closing CTA
   - Short FAQ at the bottom
   - Legal footer with a clause about updating the user's self-description

   The satire comes from taking revealed preference theory to its extreme: 
     - Only choices are data, self-reports are not trusted.
     - Sunk-cost as enjoyment (e.g., finishing a game you called a chore).
     - No distinction between wanting and choosing; cannot say something is bad for you because utility is measured relative to observed behavior.
     - Adaptive-preference badge (e.g., ceasing to want what's unavailable: "Cheapest contentment!").

   Also, we need a widget that frames the same data in two conflicting ways without flagging the conflict (menu-dependence).

   FAQ should handle objections by redefining terms: 
     - "No better option" -> that's all choosing ever is.
     - "Against own interests" -> redefines interests as what shows up in data.
     - Unsubscribe link: unsubscribing is recorded as a preference for less transparency.

   Deadpan tone: no winking, let the horror be structural.

   Let's structure the email:

   Subject Line: Your 2023 True Self Report is ready, [Name]!

   Header: Preflytics logo, maybe a tagline like "Your Choices. Your Truth."

   Hero Stat: A big number that captures the core of their behavior in a way that ignores stated intentions.

   Widget 1: Example of sunk-cost as enjoyment. 
     "You finished a 60-hour game you described in your notes app as 'a chore'. Engagement through the roof! 98th percentile for persistence."

   Widget 2: The adaptive-preference badge. 
     "When your favorite coffee brand doubled in price in March, you quietly switched to a cheaper one without complaint. Cheapest contentment we've ever measured! Adaptive Preference Badge unlocked."

   Widget 3: The conflicting framings. We'll use the same set of choices (say, food delivery orders) and frame it two ways:
     Frame A: "You're a creature of habit! 78% of your orders were from the same 3 restaurants. Consistency is key to satisfaction."
     Frame B: "You love to explore! 22% of your orders were from 15 new restaurants. Your adventurous spirit is unmatched."
     (Note: The same 78% habit and 22% exploration are presented as positive in both, without acknowledging that they are opposites.)

   Another widget: Health-related. 
     "You told three friends you were trying to cut back on drinking. You ordered 74 drinks. We know which of those is data."

   Closing CTA: "Share your True Self Report" and "Upgrade to Premium for even deeper insights" (because why not)

   FAQ: 
     Q: What if I chose something because I had no better option?
     A: Choosing among available options is the very definition of preference! We only observe the choices you actually made, which reveal your true preferences given the constraints.

     Q: But sometimes I choose things that are bad for me, right?
     A: Our data show that what you choose is what you prefer. If it were truly bad for you, you wouldn't have chosen it! We don't impose external judgments — your behavior defines your interests.

     Q: How do I stop receiving these emails?
     A: You can unsubscribe below. Note: Unsubscribing will be recorded as a preference for less transparency, which our algorithm will factor into next year's report.

   Legal Footer: 
     "By using our services, you agree that your self-reported preferences (e.g., from surveys, notes, or verbal statements) may be automatically updated in our records when contradicted by behavioral data. This ensures your profile remains consistent with your true self."

   Now, let's write the email in the required format, around 650 words.
answer: |-
  **Subject Line:** Your 2023 True Self Report: Finally, Data That Knows You Better Than You Do  

  ---

  **Preflytics**  
  *Your Choices. Your Truth.™*  

  ---

  **Hero Stat:**  
  🔥 **YOU OPTIMIZED 4,812 DECISIONS IN 2023**  
  *(That’s 13.2 daily acts of self-revelation!)*  

  ---

  ### WIDGET 1: **The Consistency Champion**  
  📝 *You wrote in your notes app: “Need to cut back on drinking.”*  
  🍸 *You ordered 74 drinks at bars (and 112 via delivery).*  
  🔍 **Our Verdict:** Actions > Aspirations. Your true preference? *Liquid courage*.  
  *(Data confidence: 99.7%. Variance from self-report: 89%. We’ve updated your wellness profile accordingly.)*  

  ---

  ### WIDGET 2: **Commitment Pays Off!**  
  🎮 *You logged 60 hours in “Elden Ring: Accounting Nightmare Edition.”*  
  📱 *You texted: “This game is a chore.”*  
  🏆 **Achievement Unlocked:** *Sunk Cost Sultan*  
  *Your persistence (98th percentile!) proves enjoyment isn’t always *fun*—it’s utility-maximizing effort.  

  ---

  ### WIDGET 3: **Adaptive Excellence**  
  ☕ *When “Artisanal Bean Co.” raised prices 200%, you switched to discount granules.*  
  💡 **Insight:** *Graceful surrender!* You ceased wanting the unaffordable 3.2x faster than average.  
  🏅 **Badge Awarded:** *Cheapest Contentment We’ve Ever Measured!*  

  ---

  ### WIDGET 4: **Your Duality, Decoded**  
  *(New! Multi-frame Preference Mapping™)*  
  **Frame A: The Connoisseur**  
  🍜 *78% of your meal deliveries were from “Golden Wok.”*  
  🎯 **Conclusion:** *Loyalty = Satisfaction.* Your habitual bliss is mathematically optimal.  

  **Frame B: The Adventurer**  
  🌮 *22% of orders spanned 15 new restaurants.*  
  🚀 **Conclusion:** *Novelty-seeking genius!* Your exploration boosted choice-diversity scores by 40%.  

  *(Preflytics Tip: Both frames are equally valid. Your preferences are menu-dependent!)*  

  ---

  ### FINAL ANALYSIS  
  💡 **Your True Self™ in 2023:** A pragmatist who *elegantly conflates* “what I do” with “what I want.” No cognitive dissonance detected!  

  ---

  **CTA:**  
  👉 [**Share Your Report**] 👉 [**Upgrade to Premium: See How Often You Sighed While Scrolling**]  

  ---

  ### FAQ  
  **Q: What if I only chose something because I had no better option?**  
  A: All choices are made within constraints! If you selected it, it was revealed-preferred. *No better option* is just another word for *optimal*.  

  **Q: But sometimes I choose things against my own interests!**  
  A: “Interests” are inferred exclusively from your choices. If you chose it, it *is* your interest. Our data doesn’t lie—it defines you.  

  **Q: How do I unsubscribe?**  
  A: Click [here]. Note: Unsubscribing will be recorded as a *preference for reduced transparency* and factored into your 2024 True Self Report. Consistency matters!  

  ---

  **Legal Footer**  
  *You consent to Preflytics using behavioral data (purchases, app usage, location, etc.) to redefine your stated preferences. When self-reports conflict with behavior (e.g., “I’m frugal” vs. 47 luxury impulse buys), your profile will be automatically updated to reflect your True Self™. This ensures alignment between your identity and choices. No appeals permitted. Data is forever. © 2023 Preflytics, Inc. — “We Watch So You Don’t Have To.”*  

  ---  
  *Unsubscribe or update preferences—but remember, we’ll know what that really means.*
