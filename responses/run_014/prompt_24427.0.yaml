prompt: |-
  I'm presenting at a philosophy of physics workshop next week my view that Lewis's Best System Account of laws of nature fails on a circularity problem: the laws are the theorems of the best system, the best system is the system that best systematizes the regularities, but the laws are supposed to explain the regularities, so the explanation is circular — and I argue this circularity is fatal, not minor, and that the only way out is an anti-Humean "governing" account on which laws bring about the regularities rather than merely describing them. The audience is a group of philosophers of physics, two of whom are committed Lewisians who know the BSA inside out, plus several agnostics. Prepare me for the question period: the objections I'll actually get from this audience, in roughly the order they'll come, phrased the way a Lewisian would phrase them, each with a two-minute reply and a note on where the reply is soft. Include the objection I'm hoping nobody asks.
reasoning: |-
  Okay, the user is presenting at a philosophy of physics workshop next week. Their main argument is that Lewis's Best System Account (BSA) of laws suffers from a fatal circularity problem. They claim that laws are defined as theorems of the best system, which systematizes regularities, but laws are supposed to explain those regularities. This creates a circular dependency. They suggest the only solution is an anti-Humean governing account where laws actively bring about regularities.

  The audience includes two committed Lewisians who are experts on BSA and several agnostics. The user wants to prepare for the Q&A by anticipating objections, especially from the Lewisians. They need objections phrased as a Lewisian would, with two-minute replies and notes on where those replies might be weak. They also want the "objection I'm hoping nobody asks."

  First, I need to recall the core of Lewis's BSA. Lewis defines laws as the axioms of the best system—the one that balances simplicity, strength, and fit. Regularities are patterns in the Humean mosaic. The circularity charge is that laws explain regularities, but the best system is chosen based on those regularities. So, the explanation seems circular.

  Common defenses include distinguishing between metaphysical and epistemic roles. Lewisians might argue that the BSA isn't providing an epistemic explanation but a metaphysical grounding. The laws supervene on the mosaic, so the regularities determine the laws, but once established, laws explain the regularities. This is supposed to avoid circularity by being a non-explanatory grounding relation.

  The user thinks this circularity is fatal. Their replies should counter these defenses, pointing out that even metaphysical dependence can't escape explanatory circularity. They need to argue that the laws can't genuinely explain the regularities because they're constituted by them. This is where the anti-Humean governing view comes in—laws as ontologically prior to regularities.

  Key objections from Lewisians:

  1. **Misunderstanding Supervenience**: Lewisians might say the user confuses epistemic and metaphysical issues. The BSA is about what laws are, not how we discover them. The reply should emphasize that explanatory roles require more than supervenience; laws need to be ontologically distinct to explain.

  2. **Explanatory Role Compatible with Supervenience**: They might argue that supervenience bases can explain their supervenients, using examples like moral facts supervening on natural facts. The reply could counter that laws are supposed to explain why regularities hold, which requires asymmetry, but in BSA, regularities ground laws, so asymmetry is reversed.

  3. **No Circularity in Asymmetry**: Lewisians might claim that the explanatory direction is opposite to the grounding direction. The reply should question how laws can explain their own grounds, which seems incoherent.

  4. **Function of Laws in Science**: Lewisians might say that in scientific practice, laws are descriptive and still explanatory. The reply can argue that scientific explanations often assume governing laws, and BSA's descriptive laws can't underpin such explanations.

  5. **Anti-Humean Problems**: They might challenge the user's alternative, pointing out issues with governing accounts, like mysterious modal forces. The reply should concede challenges but argue that governing accounts avoid circularity, which is a fundamental flaw in BSA.

  The "hoped nobody asks" objection might be that the user's governing account also has circularity if laws are posited to explain regularities but are justified by those regularities. This is tricky because it questions their solution. The reply needs to distinguish epistemic justification from metaphysical explanation, emphasizing that governing laws are ontologically prior, so no metaphysical circularity.

  Soft spots in replies: When the user distinguishes grounding from explanation, Lewisians might insist that BSA's laws can still explain. Also, claiming governing accounts avoid circularity might be challenged if the laws' content depends on regularities. The user must maintain that governing laws are not constituted by regularities but bring them about, which avoids circularity.

  User's deeper needs: They want to defend their critique rigorously against experts. They need to anticipate nuanced objections and have strong, concise replies. They might also want to persuade the agnostics by showing BSA's fatal flaw and their solution's viability despite its challenges.
answer: |-
  Below is a comprehensive preparation for your Q&A session, structured around the most likely objections from a Lewisian perspective. I've ordered the objections based on typical workshop dynamics—starting with foundational/supervenience challenges, moving to explanatory role defenses, then to pragmatic/anti-Humean counterarguments, and ending with the "nightmare" objection. Each objection is phrased as a Lewisian would (concise, technically precise, and grounded in Lewis's framework), followed by a **two-minute reply script** (calibrated for clarity and brevity) and a **Soft Spot Note** highlighting where your reply might be vulnerable. 

  ---

  ### **Objection 1: Misunderstanding Supervenience**  
  *Phrased Lewisian-style:*  
  "You’re conflating metaphysical and explanatory dependencies. The BSA is clear: laws *supervene* on the Humean mosaic—they’re nothing over and above the patterns of particular facts. Regularities ground the laws, but once fixed, laws explain those regularities. This isn’t circular; it’s a non-symmetric dependence structure. Circularity only arises if you equivocate between grounding and explanation."  

  **Your Two-Minute Reply:**  
  "Thank you—I agree supervenience is key here, but my concern is precisely that supervenience *creates* the circularity. Lewis claims laws *explain why* regularities hold. Yet if laws are metaphysically constituted by those very regularities (via the best system), the explanation is vacuous: it reduces to 'regularities exist because regularities exist.' Supervenience avoids ontological inflation but doesn’t resolve explanatory circularity. For instance, if I 'explain' a pattern in data by labeling it a 'law,' but the label just summarizes the data, I haven’t explained the pattern’s *occurrence*—I’ve just redescribed it. Lewis needs laws to do more than mirror the mosaic; they must ground why the mosaic is regular at all. But if the laws are *fixed by* the mosaic, they can’t play that role without circularity. The asymmetry Lewis aims for collapses because the explanans (laws) ontologically depends on the explanandum (regularities)."  

  **Soft Spot Note:**  
  Your reply assumes explanation requires ontological independence. A Lewisian could retort that *all* Humean explanations (e.g., mental states supervening on physical states) allow supervenient properties to explain their bases. You’ll need to insist that *laws* are unique because they’re meant to explain *causal or nomological* structure, not just patterns.  

  ---

  ### **Objection 2: Explanatory Role is Compatible with Supervenience**  
  *Phrased Lewisian-style:*  
  "BSA doesn’t require laws to 'bring about' regularities to explain them. Explanation here is about unification and compression, not causation. The best system’s theorems *explain* regularities by showing how they follow from a few simple axioms—just as Newton’s laws explain planetary orbits without governing them. This is standard deductive-nomological explanation, and it’s not circular because the system’s virtues (simplicity, strength, fit) break the symmetry. The laws aren’t defined *by* the regularities alone but by their role in an optimal summary."  

  **Your Two-Minute Reply:**  
  "I appreciate the appeal to DN explanation, but this mislocates the circularity. The problem isn’t deduction—it’s that the *status* of the axioms *as laws* depends on systematizing the regularities they’re meant to explain. Take 'F = ma': in DN, it explains observed motions. But in BSA, whether 'F = ma' is a law hinges on whether it optimizes simplicity/strength relative to *this world’s* motions. So when we say 'F = ma explains the motions,' we’re really saying 'the motions make F = ma a law, which then explains the motions.' This *is* circular: the explanandum (motions) is prior in the metaphysical hierarchy, making the explanans (law) derivative. Unification doesn’t escape this—it just disguises it. The system’s virtues are evaluative criteria for summaries, not grounds for genuine explanation. If laws are just efficient descriptions, they can’t explain *why* the world is regular; they can only catalog that it is."  

  **Soft Spot Note:**  
  Lewisians could argue that you’re demanding a “governing” explanation BSA never promised. Your reply leans on intuition (laws should explain *why* regularities exist), but Lewis explicitly rejects this as non-Humean. Strengthen by stressing that even *descriptive* explanations require asymmetry, which BSA undermines.  

  ---

  ### **Objection 3: No Circularity—Grounding and Explanation Run in Opposite Directions**  
  *Phrased Lewisian-style:*  
  "You’re ignoring the directionality in Lewis. The mosaic *metaphysically grounds* the laws (laws depend on mosaic), but laws *explain* the mosaic (mosaic depends counterfactually on laws). This is no more circular than saying 'the brain state grounds the pain, and the pain explains the screaming.' Grounding isn’t explanation, so there’s no loop."  

  **Your Two-Minute Reply:**  
  "Directionality doesn’t resolve this. For pain to explain screaming, pain must have distinct identity—it can’t be *constituted by* the screaming. But in BSA, laws are wholly constituted by the mosaic: the best system is selected *by* the mosaic’s patterns. So when laws 'explain' the mosaic, they’re just re-projecting those patterns. Counterfactuals don’t help: 'If the laws were different, the mosaic would differ' is true in BSA, but only because the laws are *defined by* the mosaic. This makes counterfactuals trivially true, not explanatory. Lewis himself admitted laws can’t explain *why* the mosaic is regular (see *Philosophical Papers, Vol. II*)—they can only systematize it. But if laws can’t explain the regularity’s existence, they fail a core job of laws. The pain/screaming analogy fails because pain has intrinsic properties; BSA laws are purely relational."  

  **Soft Spot Note:**  
  This reply risks conflating constitution with grounding. A Lewisian might argue that laws, once fixed, have modal profiles that transcend the actual mosaic. Be ready to clarify that *constitution* implies no excess content beyond the mosaic.  

  ---

  ### **Objection 4: BSA Captures Scientific Practice Better Than Governing Accounts**  
  *Phrased Lewisian-style:*  
  "Science treats laws as descriptive—think of symmetries in quantum field theory or the principle of least action. Physicists don’t invoke 'governance'; they systematize data. BSA mirrors this, while your governing view adds mysterious modal forces. If circularity were fatal, science would be circular too. Isn’t your critique demanding an unscientific metaphysics?"  

  **Your Two-Minute Reply:**  
  "Science *uses* laws descriptively, but it *presupposes* they explain. When a physicist says 'electrons repel because of Coulomb’s law,' they’re not just summarizing past data—they’re implying the law constrains future behavior. BSA can’t underwrite this: if Coulomb’s 'law' is just a pattern in past electron behavior, it doesn’t explain why future electrons *must* repel; it just hopes they will. Governing accounts avoid this by positing laws as irreducible constraints. Yes, they’re metaphysically heavier, but they avoid the circularity of using regularities to define the very thing that explains them. Science’s success with description doesn’t prove circularity is harmless—it shows we’re pragmatic about explanation. But for a *metaphysics* of laws, we need rigor, and BSA’s circularity is a structural flaw, not a scientific virtue."  

  **Soft Spot Note:**  
  This concedes that science is pragmatic, which a Lewisian could exploit: “If science works with descriptivism, why insist on governance?” Emphasize that your target is *metaphysical* explanation, not epistemology.  

  ---

  ### **Objection 5: Anti-Humean Accounts Have Their Own Fatal Problems**  
  *Phrased Lewisian-style:*  
  "Governing laws don’t solve your problem—they regress or inflate ontology. How do laws 'bring about' regularities? If they’re contingent, you need meta-laws (Carroll’s regress). If necessary, they’re unexplained brute facts. Worse, your view can’t handle probabilistic laws without ad-hoc additions. BSA’s 'circularity' is a minor cost compared to your anti-Humean baggage."  

  **Your Two-Minute Reply:**  
  "I agree governing accounts face challenges—but they’re not *circular* in the way BSA is. Carroll’s regress, for example, assumes a Humean framework; anti-Humeans can treat laws as primitive or grounded in dispositions. Crucially, governing laws *break* the circularity: laws are ontologically prior to regularities, so they can genuinely explain them. BSA’s circularity isn’t 'minor'; it voids laws of explanatory power. For probabilities, anti-Humeans can appeal to propensities or primitives. Yes, it’s metaphysically costly, but if the choice is between costly coherence and frugal circularity, coherence wins. Circularity isn’t a 'cost'—it’s a deal-breaker for any account of laws as explanatory."  

  **Soft Spot Note:**  
  This reply doesn’t *solve* anti-Humean issues—it just contrasts them. Lewisians will pounce if you can’t sketch a viable alternative. Prep a one-liner: “I’m defending primitivism or dispositionalism—details aside, they avoid the circle.”  

  ---

  ### **The Objection You're Hoping Nobody Asks**  
  *Phrased Lewisian-style:*  
  "Your governing account is *also* circular. If laws 'bring about' regularities, but we identify laws *from* regularities (via inference to best explanation), then your laws depend epistemically on regularities to justify them. But epistemic dependence *is* circular under your critique: you reject BSA because laws metaphysically depend on regularities, yet your view has laws epistemically depending on them. Either both are circular, or neither is—so your 'fatal flaw' applies to your own view."  

  **Your Two-Minute Reply:**  
  "This confuses metaphysics with epistemology. My critique targets *metaphysical* circularity: in BSA, laws are *constituted by* regularities, making explanation vacuous. In a governing account, laws *metaphysically ground* regularities but are *epistemically inferred* from them. This is no more circular than inferring a cause from its effect. The circularity I attack is ontological: if the law just *is* the regularity (as in BSA), it can’t explain it. Governing laws are distinct entities—they exist independently and impose order. Epistemic inference isn’t circular; it’s asymmetrical (we reason from effects to causes). BSA’s problem is that it lacks this asymmetry at the metaphysical level."  

  **Soft Spot Note:**  
  This is your weakest spot. Lewisians will argue that if epistemic access relies on regularities, and laws explain regularities, it’s still a loop (even if not metaphysical). Stress that *metaphysical* priority breaks the circle, but be prepared for follow-ups on how we could ever know governing laws without regress.  

  ---

  ### **General Q&A Strategy**  
  - **For Lewisians:** Focus on the *metaphysical asymmetry* problem. They’ll defend BSA’s coherence—don’t let them reframe it as merely epistemic.  
  - **For Agnostics:** Highlight that circularity makes laws explanatorily inert. Contrast with scientific intuition: “Do laws *make* the world regular, or just *reflect* it?”  
  - **Pacing:** Keep replies tight. Use the two-minute limit to avoid tangents. If pressed, say: “That’s beyond our scope, but I’d argue [one-sentence rebuttal].”  
  - **Delivery:** Start replies with “Thank you—that’s important, but…” to model engagement. Avoid “Lewis is wrong”; say “BSA struggles here.”  

  This prep balances technical rigor with rhetorical clarity. The nightmare objection (#6) is the steepest hurdle—drill your distinction between metaphysical/epistemic dependence until it’s instinctive. Good luck!
