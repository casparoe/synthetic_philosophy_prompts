  Finks involve a change in the disposition itself right when the stimulus is applied. The classic example is Martin's sorcerer who removes fragility just as the glass is about to hit the ground. The disposition disappears before manifestation. So the glass was fragile but doesn't break because the disposition is finks away.

  Masks are different. The disposition is still there, but something external blocks the manifestation. Like the vase packed in styrofoam. It's still fragile, but the styrofoam absorbs the impact. The mask prevents the breaking even though the disposition exists.

  The host said they're "basically the same," but that's not accurate. The key difference is whether the disposition itself is removed (fink) or the disposition remains but is interfered with (mask). The chemist user picked up on this because in chemistry, a catalyst that's consumed (which might be like a fink if it changes the substance) versus an inhibitor (mask blocking the reaction) are distinct mechanisms. Their analogy makes sense.

