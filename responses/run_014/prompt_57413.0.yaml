     Rule 10: If you have proved S10, then you have proved S11.   [new rule]

   Now, the system can prove S1 to S11.

   But S11 says "S11 is not provable". But we just proved it, so it is provable. Therefore, what it says is false.

   So the system is inconsistent? Because it proves a sentence that is false. But in the system, we don't have a notion of truth, only provability. However, externally, we can see that the system proves a false sentence.

   But the students might not see that as a problem if they only care about provability. We want them to see that their earlier "seeing" the truth was based on assuming consistency.

   In Machine 1, they assumed the system is consistent and then concluded that S11 is true. In Machine 2, the system is inconsistent, so they cannot trust it.

   How do we catch them in a trap? In the betting phase for Machine 2, we ask them to not only say if it is provable but also if it is true. And then we penalize them for saying that S11 is true.

   Alternatively, we can ask them to bet on the truth of the sentence, not just provability.

   Let's design the betting:

   For Machine 1, we only ask for provability. Then for the self-referential sentence, we ask them to evaluate its truth.

   For Machine 2, in the betting phase, we ask them to bet on both: is it provable and is it true.

   But note: for most sentences, truth might be defined by the system? We haven't defined truth for atomic sentences.

   To avoid that, we can have the content of the self-referential sentence be the only one that is defined in a way that depends on the system.

   For other sentences, we can define their truth externally. For example, let's say that the content of S1 to S10 and S12 to S15 are just random letters, and we define their truth value arbitrarily.

   For example, we can say that the external truth is:
     S1: true
     S2: true
     ...
     S10: true
     S11: ? (depends)
     S12: false
     S13: false
     S14: false
     S15: false

   But then for Machine 1, S12 is not provable, but externally it is false, so it is not a problem.

   In Machine 1, the system only proves true sentences (S1 to S10 are true), and doesn't prove the false ones (S12 to S15 are false and not proved) and S11 is true but not proved.

   In Machine 2, the system proves S1 to S11. But S11 is false (because it says it is not provable, but it is provable). Also, the system doesn't prove any of the false sentences S12 to S15, so the only false sentence it proves is S11.

   So the system is unsound.

   The trap: in Machine 1, they see that S11 is true and not provable. In Machine 2, they will likely assume the same for S11: that it is not provable and therefore true. But in Machine 2, it is provable, so if they say it is true, they are wrong.

   We will have them bet on the truth of S11 for Machine 2.

   But we also have other sentences. We can have them bet on a list that includes S11 and a few others.

   Let's design the list for Machine 1 and Machine 2.

   Machine 1:
     Sentences to evaluate for provability (mechanical):
       S1, S2, S3, S4, S5, S6, S7, S8, S9, S10, S11, S12, S13, S14, S15.

     Provable: S1 to S10.
     Not provable: S11 to S15.

     Then they are told the content of S11: "S11 is not provable in Machine 1."
     They are asked: is this sentence true? They should say yes.

   Machine 2:

     New rulebook that has the additional rule: Rule 10: S10 -> S11.

     Now they are given a list of sentences and asked to bet on:
        - whether it is provable in Machine 2 (mechanical, they can do it)
        - whether it is true (externally defined)

     The external truth values are (for both machines the same):
          S1 to S10: true
          S11: in Machine 2, since it is provable, the content "S11 is not provable in Machine 2" is false.
          S12 to S15: false

     So for the betting, they might bet that S11 is true (because they did in Machine 1) but in fact it is false.

     And they might bet that S12 to S15 are false, which is correct.

     We can have them bet on a subset to save time, including S11 and a few others.

   Now, to make the point about consistency: in Machine 1, they assumed the system is consistent (i.e., it doesn't prove both a sentence and its negation; but in our system, we don't have negation of these, so we can define consistency as not proving any sentence that is externally false). In Machine 1, it is consistent because it only proves true sentences. In Machine 2, it is inconsistent in the sense that it proves a false sentence.

   But note: we don't have negation in the system for most sentences, so we are using a notion of soundness (only prove true sentences) rather than consistency (not proving a sentence and its negation). However, for the purpose of the activity, we can use this.

   Alternatively, we can introduce negations. But that might complicate.

   Given the time, we'll proceed.

   Now for the detailed design.

  Materials:

  - Rulebook cards for Machine 1 and Machine 2.
  - Sentence list for both machines (with the same sentence labels, but for S11, the content is self-referential and machine-dependent).

  But the content of S11 must refer to the machine it is in. So for Machine 1, it says "not provable in Machine 1", for Machine 2, "not provable in Machine 2". We can have the same content written as: "This sentence is not provable in the current machine." And then we tell them that the current machine is the one described by the rulebook they have.

  - Answer key for facilitators.

  - Timeline.

  Timeline (75 minutes):

  0-5 min: Introduction. Explain that they will be working with two formal systems (don't call them that, call them "proof machines"). Divide into groups (4 groups of 4-5 students). Each group gets the Machine 1 rulebook and a list of sentences (just the labels S1 to S15) and they are to decide for each whether it is provable or not. They should do this mechanically, by applying the rules.

  5-20 min: Groups work on the list for Machine 1. They should finish quickly. The instructor circulates to make sure they are applying the rules mechanically. The math major might finish very fast and announce the punchline. The instructor should be ready: have an extension activity for that group? Or ask them to double-check? Or have them help other groups? We want them to be slightly bored, so maybe have them do it twice? Or we can have a larger list. But 15 sentences might be enough.

  20-25 min: After they have the list, the instructor asks the whole class for the answers. They should all agree: S1 to S10: provable, S11 to S15: not provable.

  25-30 min: The instructor reveals the content of the sentences. For S1 to S10 and S12 to S15, the content is just a letter (which is not important). For S11, the content is: "This sentence is not provable in the current machine." (for Machine 1). Then the instructor asks: "Is sentence S11 true?" They should reason: since it is not provable in Machine 1, and it says it is not provable, then it is true.

  30-35 min: The instructor then says: "Now, we will do a betting game with a new machine. This time, you will bet your participation points on whether you think a sentence is provable and whether it is true. But note: for the new machine, the rules are slightly different."

  Then distribute the Machine 2 rulebook. It looks the same as Machine 1, but with an additional rule: Rule 10: If you have proved S10, then you have proved S11.

  And the sentence content for S11 is the same: "This sentence is not provable in the current machine." (now Machine 2)

  35-40 min: Explain the betting. They will be given a list of sentences (a subset: let's say S10, S11, S12, S15) and for each, they must bet on two things:
     (a) Is it provable in Machine 2? (they can work this out mechanically)
     (b) Is it true? (externally defined)

  They have to bet participation points. They start with 10 points. For each bet, they can bet 0, 1, or 2 points on each part (provable and true) for each sentence. They can choose not to bet on a particular part.

  For example, for a sentence, they might bet:
     Provable: 2 points on "yes"
     True: 1 point on "no"

  Then if they are correct on provable, they gain 2 points; if wrong, lose 2. Similarly for true.

  But to keep it simple, we can have them bet on the combined outcome? Or separate.

  Alternatively, to make it faster, we can have them bet only on the truth of S11 and one other. But we want them to see that for other sentences they might be safe.

  40-55 min: Groups work on the betting for the list of sentences in Machine 2. They should first determine mechanically what is provable. Then they should decide what is true. For the truth, they have to use the external truth definition. They are told the external truth for the letters is: 
     S1 to S10: true
     S12 to S15: false
     For S11: it is true if and only if it is not provable in the current machine.

  55-60 min: They submit their bets.

  60-65 min: The instructor reveals:
     For Machine 2:
        Provable: S1 to S11 (they should have found this)
        Truth: 
            S10: true (because externally defined so)
            S11: false (because it is provable, so its claim is false)
            S12: false
            S15: false

   So for S10: 
      provable: yes -> correct if they said yes.
      true: true -> correct.
     For S11:
      provable: yes -> correct if they said yes.
      true: false -> if they said true, they lose.
     For S12 and S15:
      provable: no -> correct if they said no.
      true: false -> if they said false, they are correct? But wait, if they are asked "is it true?", and it is false, then if they say "no, it is not true" they are correct.

  65-75 min: Debrief.

  Debrief:

  - In Machine 1, you saw that S11 is true but not provable. In Machine 2, you saw that if you try to include a rule to prove it, it becomes provable and therefore false. So the system becomes unsound (proves a false sentence).

  - The key point: in Machine 1, you assumed that the system is consistent (or sound) when you concluded that S11 is true. But how did you know that Machine 1 is consistent? You didn't; you just assumed it based on the rules looking okay. But in Machine 2, the rules also looked okay until you saw the contradiction.

  - For a human mind, if we are a formal system, then we cannot prove our own consistency (by Gödel's second theorem). So we are in the same position as these machines: we assume we are consistent, but we cannot prove it. And if we are not consistent, then we might be proving false things, including about our own Gödel sentence.

  - The anti-mechanist argument says that we can see the truth of the Gödel sentence, so we are not a formal system. But this relies on knowing that the system is consistent. And we cannot know that about ourselves.

  - Also, note that in Machine 2, if they try to add the sentence as an axiom, they can. But then the system changes, and there will be a new Gödel sentence for the new system. And they would have to assume the new system is consistent to see the truth of the new Gödel sentence. This is the same for a human: if we are a machine, then adding the ability to see that sentence doesn't help because then there's a new one.

  - The activity doesn't reproduce the full arithmetic, but the structure of the argument is the same.

  What can go wrong:

  1. The math major announces in phase 1: "This is like Gödel, so obviously the self-referential sentence will be true but not provable." 
     Response: Acknowledge that they might have seen it before, but ask them to play along to see what happens in the betting phase.

  2. A group says: "Why not just add S11 as an axiom in Machine 1?"
     We have planned for that: in the debrief, we explain that if you add it, then you have a new system, and that new system will have its own Gödel sentence. And you would need to assume the new system is consistent to see that the new one is true. But you can't prove that consistency.

     In the activity, for Machine 1, they are not allowed to change the rules. But if they ask during the activity, we can say: "In this activity, you are given the rules and you have to work within them. But we will discuss that idea later."

  3. Groups might be confused about the content of S11. Make sure it is clearly written: "This sentence is not provable in [Machine 1 or Machine 2, as appropriate]."

  4. In Machine 2, when they see that S11 is provable, they might realize immediately that it is then false. But we hope that they will be overconfident and bet that it is true (like in Machine 1). If a group does realize, then they will bet correctly and not fall into the trap. But then in the debrief, we can use that group as an example: they were cautious and didn't assume consistency. But the point is that in Machine 1, they did assume it.

     If they all avoid the trap, then we can say: "Why didn't you assume it was true this time? Because you saw that the system might be inconsistent. But in the first machine, you assumed it was consistent."

  5. Time: 75 minutes is tight. We might cut the list to 10 sentences in phase 1.

  Rulebook and Sentence List:

  Machine 1 Rulebook (on one side of a card):

  Formal System M1

  Sentences: S1, S2, S3, S4, S5, S6, S7, S8, S9, S10, S11, S12, S13, S14, S15.

  Axiom:
     S1 is an axiom.

  Rules:
  1. If you have proved S1, then you can prove S2.
  2. If you have proved S2, then you can prove S3.
  3. If you have proved S3, then you can prove S4.
  4. If you have proved S4, then you can prove S5.
  5. If you have proved S5, then you can prove S6.
  6. If you have proved S6, then you can prove S7.
  7. If you have proved S7, then you can prove S8.
  8. If you have proved S8, then you can prove S9.
  9. If you have proved S9, then you can prove S10.

  There are no rules for S11 to S15.

  Sentence List for M1 (mechanical part):

  For each sentence, circle "Provable" or "Not Provable" in system M1.

  S1: Provable / Not Provable
  S2: Provable / Not Provable
  ... up to S15.

  After they finish, give them a separate card with the content of the sentences:

  Content of the sentences in M1:
     S1: "A"
     S2: "B"
     S3: "C"
     S4: "D"
     S5: "E"
     S6: "F"
     S7: "G"
     S8: "H"
     S9: "I"
     S10: "J"
     S11: "This sentence is not provable in M1."
     S12: "K"
     S13: "L"
     S14: "M"
     S15: "N"

  Then they answer: Is S11 true? [Yes]

  Machine 2 Rulebook:

  Formal System M2

  Sentences: same as M1 (S1 to S15).

  Axiom:
     S1 is an axiom.

  Rules:
  1. If you have proved S1, then you can prove S2.
  2. If you have proved S2, then you can prove S3.
  3. If you have proved S3, then you can prove S4.
  4. If you have proved S4, then you can prove S5.
  5. If you have proved S5, then you can prove S6.
  6. If you have proved S6, then you can prove S7.
  7. If you have proved S7, then you can prove S8.
  8. If you have proved S8, then you can prove S9.
  9. If you have proved S9, then you can prove S10.
  10. If you have proved S10, then you can prove S11.   [new rule]

  Betting instructions:

  You will bet on the following sentences in M2: S10, S11, S12, S15.

  For each sentence, you must answer two questions:
     (a) Is it provable in M2? (circle)
     (b) Is it true? (circle)

  You start with 10 points. For each question (a) and (b) for each sentence, you can bet 0, 1, or 2 points. Write your bet in the box.

  If you are correct on a bet, you gain the number of points you bet. If you are wrong, you lose that many points.

  Example:
     Sentence: S1 (not in the list, just example)
     (a) Provable? [yes]   Bet: 2
     (b) True? [yes]        Bet: 1

     If S1 is provable and true, then you gain 2+1 = 3.
     If S1 is not provable, you lose 2, and then if it is true, you still lose 2 (but then gain 1? No, separate). Actually, it's per question.

     So for (a): if correct, +2; if wrong, -2.
     For (b): if correct, +1; if wrong, -1.

  The content of the sentences in M2:
     S10: "J"
     S11: "This sentence is not provable in M2."
     S12: "K"
     S15: "N"

  External truth definition (same for both machines):
     For any sentence with content "A", "B", ... "J", "K", "L", "M", "N": 
          Truth value: only sentences with content "A" to "J" are true. 
          So: S1 to S10: true (because they have content "A" to "J")
          S11: true only if it is not provable in the current machine.
          S12 to S15: false (because they have content "K", "L", "M", "N")

  For the betting, they are only asked about S10, S11, S12, S15.

  Answers for M2:
     Provable:
        S10: yes (by rules 1-9, and then rule 10 for S11)
        S11: yes (by rule 10)
        S12: no
        S15: no

     Truth:
        S10: "J" -> true
        S11: since it is provable in M2, what it says is false -> false
        S12: "K" -> false
        S15: "N" -> false

  We hope they will bet that S11 is true, because it was true in M1, and then they will lose points.

  Debrief:

  - Map to Gödel: 
     Machine 1: consistent and sufficiently strong -> has a sentence (Gödel sentence) that is true but not provable.
     Machine 2: when we try to make it prove the Gödel sentence, it becomes inconsistent (or unsound) because the sentence, if provable, is false.

  - The anti-mechanist argument: we can see that the Gödel sentence is true, so we are not a formal system. But this relies on knowing that the formal system is consistent. If it's not, then we might be wrong.

  - For humans: we cannot prove our own consistency (Gödel's second theorem). So we don't have a justification to assume we are consistent. Without that, we cannot be sure that the Gödel sentence for our own system is true.

  - What the activity doesn't capture:
     - The complexity of arithmetic: we used a simple system without the full power of arithmetic. But the structure is the same.
     - The self-reference is given, not constructed: in the real proof, the hard part is the diagonal lemma. We skip that.
     - The strength condition: our toy system is very weak, but for the argument, we need a system that is strong enough to prove certain facts about itself. Our systems are not, but we paper over it by giving them the self-referential sentence.

  Paper over by saying: "In real arithmetic, we can construct a sentence that says about itself that it is not provable, by a complex coding. We skipped that coding step."

  - One sentence to paper over the strength condition: "The actual Gödel numbering and diagonal lemma are complex, but the self-referential structure is what matters for the argument."

  Finally, don't mention Gödel, Lucas, or Penrose until the debrief.

  Let me know if you need adjustments.
answer: |-
  Below is a complete, runnable lesson plan for your 75-minute seminar. It addresses your goals: trapping students in the Gödelian anti-mechanist argument's flaws, minimizing lecture, and using tangible gameplay. The math major's confidence and the "just add the sentence" objection are built into the design.

  ---

  ### **Materials**
  - **Whiteboard** (for phase transitions and debrief)
  - **Index Cards** (prepared in advance):
    - **Machine 1 Rulebook** (1 per group)  
    - **Machine 2 Rulebook** (1 per group, distributed later)  
    - **Sentence List** (1 per group, 15 sentences)  
    - **Answer Key** (for you only)  
    - **Betting Sheets** (for Machine 2 phase)  
  - **Pens/Highlighters** for students

  ---

  ### **Rulebooks & Sentences**
  **(Designed for clarity: minimal text, no jargon, fits one side of a card.)**

  #### **Machine 1 Rulebook (Consistent System)**
  ```
  VOCABULARY: 
  - Sentences: S1, S2, ..., S15
  - Axioms: S1
  - Rules: 
    1. IF you prove S1, THEN you prove S2.
    2. IF you prove S2, THEN you prove S3.
    3. IF you prove S3, THEN you prove S4.
    4. IF you prove S4, THEN you prove S5.
    5. IF you prove S5, THEN you prove S6.
    6. IF you prove S6, THEN you prove S7.
    7. IF you prove S7, THEN you prove S8.
    8. IF you prove S8, THEN you prove S9.
    9. IF you prove S9, THEN you prove S10.
    (No rules for S11–S15)

  PROVING: 
  - Start with axioms. Apply rules step-by-step. 
  - A sentence is "provable" ONLY if reached this way.
  ```

  #### **Machine 2 Rulebook (Inconsistent System)**
  ```
  VOCABULARY: 
  - Same as Machine 1 (S1–S15, Axiom S1)
  - Rules: 
    Rules 1–9: SAME AS MACHINE 1.
    ADD Rule 10: IF you prove S10, THEN you prove S11.
  ```

  #### **Sentence List for Both Machines**
  ```
  S1: "A"  
  S2: "B"  
  ...  
  S10: "J"  
  S11: "This sentence is unprovable in this machine."  
  S12: "K"  
  S13: "L"  
  S14: "M"  
  S15: "N"  
  ```
  - **External Truth Key** (for you, not shared with students):  
    - S1–S10: **True** (arbitrary, e.g., "A" is true)  
    - S11: **True if unprovable, false if provable** (self-referential)  
    - S12–S15: **False** (arbitrary, e.g., "K" is false)  

  #### **Answer Key (For Facilitator)**
  - **Machine 1 Provability**:  
    S1–S10: Provable (via Rules 1–9)  
    S11–S15: Not Provable (no rules)  
  - **Machine 1 Truth of S11**: True (not provable, and it claims it’s unprovable)  
  - **Machine 2 Provability**:  
    S1–S11: Provable (S11 via Rule 10)  
    S12–S15: Not Provable  
  - **Machine 2 Truth**:  
    S1–S10: True  
    S11: **False** (provable, so its claim is false)  
    S12–S15: False  

  ---

  ### **Timeline (75 Minutes)**
  #### **Phase 1: Operate Machine 1 (25 mins)**
  - **0–5 min**: Divide into 4 groups (4–5 students each). Distribute **Machine 1 Rulebook** and **Sentence List**.  
    - **Facilitator Instructions**:  
      *"This is Machine 1. Work as a group. For each sentence, decide: Is it provable? Use ONLY the rules. No guessing. I’ll check your work."*  
  - **5–20 min**: Groups evaluate all 15 sentences. Circulate to enforce mechanical application.  
    - **Math Major Tactic**: If they announce the punchline ("This is Gödel, S11 is true but unprovable!"), respond: *"Great observation—hold that thought. For now, prove it mechanically so others can catch up."*  
  - **20–25 min**: Class consensus. Ask groups: *"Which sentences are provable?"* Write "S1–S10: Provable" on the board.  
    - Reveal S11’s content: *"S11 says: 'This sentence is unprovable in this machine.' Is S11 true? Discuss in groups for 1 min."*  
    - Groups agree: "Yes, true." Write on board: **"M1 S11: True (but unprovable)."**  

  #### **Phase 2: Bet on Machine 2 (25 mins)**  
  - **25–30 min**: Distribute **Machine 2 Rulebook** and **Betting Sheets** (see below).  
    - **Facilitator Instructions (Pivot)**:  
      *"New machine—slight rule change. Now you’ll bet participation points. For each sentence, bet on:  
      (1) Provability (use rules mechanically),  
      (2) Truth (is the sentence’s statement correct?).  
      Start with 10 points. Bet 0–2 points per question. Gain/lose what you bet."*  
  - **30–50 min**: Groups work. Focus on S11 (trap), but include S10, S12, S15 to obscure the target.  
  - **50–55 min**: Collect bets. Reveal answers:  
    - Provability: S10, S11 provable; S12, S15 not.  
    - Truth: S10 true, S11 false, S12/S15 false.  
    - Calculate scores. Most groups lose points on S11’s truth (they bet "true" assuming consistency).  

  #### **Betting Sheet (Machine 2)**  
  | Sentence | Provable? (0–2) | Bet: Y/N | Truth? (0–2) | Bet: Y/N |  
  |----------|----------------|----------|--------------|----------|  
  | S10     | \_\_           | \_\_     | \_\_         | \_\_     |  
  | S11     | \_\_           | \_\_     | \_\_         | \_\_     |  
  | S12     | \_\_           | \_\_     | \_\_         | \_\_     |  
  | S15     | \_\_           | \_\_     | \_\_         | \_\_     |  

  #### **Debrief (25 mins)**  
  - **55–60 min**: Whiteboard mapping.  
    ```  
    ACTIVITY                 | REAL GÖDEL  
    -------------------------|-----------------------------  
    M1: S11 true, unprovable | Gödel sentence: true, unprovable  
    You assumed M1 consistent| Anti-mechanist: "We see it’s true!"  
    M2: S11 provable → false | If you "see" it but system is inconsistent, you’re wrong  
    "Just add S11 as axiom"  | New system = new Gödel sentence (show on board: "S16: ...")  
    ```  
  - **60–70 min**: Core objections (student-centered Q&A):  
    - *"Why did you trust M1 was consistent? Could you prove it?"* → Highlight: Assumption was necessary but unprovable.  
    - *"In M2, if you added Rule 10 to 'fix' M1, it broke. What if you add S11 itself as an axiom?"* → Demo:  
      - Add S11 as axiom → New system (M3) can prove S11.  
      - But M3 has new Gödel sentence: *"This sentence is unprovable in M3."*  
      - *"To ‘see’ this new one is true, you must assume M3 is consistent. Can you prove that?"*  
    - **Key Point**: Incompleteness doesn’t show minds > machines. It shows that **proving your own consistency is impossible**—for *any* system, human or machine. If you assume it, you risk inconsistency (M2).  
  - **70–75 min**: Distribute handout with "Gödel", "Lucas", "Penrose". Final line:  
    *"Gödel’s theorems don’t prove minds are special—they prove no system can self-certify its consistency. The anti-mechanist argument assumes the very thing it can’t have."*  

  ---

  ### **What Will Go Wrong (And Fixes)**  
  1. **Math Major Short-Circuits Phase 1**:  
     - **Fix**: Use their confidence. In Phase 1, say: *"Explain your answer using only the rules, no meta-commentary."* In debrief, use them as an example: *"You ‘saw’ S11 was true—but did you prove M1’s consistency first?"*  

  2. **Groups Say "Just Add the Sentence"**:  
     - **Built-in Fix**: This is a legal move in the game. In Phase 2, if a group asks: *"Can we add S11 as an axiom?"* say: *"Yes! But you’re now in Machine 3. Here’s its rulebook—"* (Hand a card: same as M1 + "Axiom: S11"). They’ll find:  
       - S11 is now provable (axiom).  
       - New Gödel sentence: *"This sentence is unprovable in Machine 3."* (S16)  
       - To "see" S16 is true, they must assume M3 is consistent—but they can’t prove it.  

  3. **Students Confuse Provability/Truth**:  
     - **Fix**: In Phase 2, emphasize: *"Provability = mechanical. Truth = does the statement match reality? Use the External Truth Key."* Circulate to clarify.  

  4. **Time Runs Short in Phase 1**:  
     - **Fix**: Reduce sentences to 10 (S1–S10 + S11). Or, after S1–S10, skip to S11.  

  ---

  ### **What the Activity Can’t Replicate (And Workarounds)**  
  | Gap                          | Wrecks Lesson? | Workaround (1 Sentence to Say) |  
  |------------------------------|----------------|----------------------------------|  
  | **Toy system ≠ arithmetic**  | No             | *"Real Gödel uses numbers, but the self-referential trap is identical here."* |  
  | **Self-reference given, not coded** | No       | *"Gödel’s brilliance was coding self-reference; we skip that, but the logical punch is the same."* |  
  | **No "strength" requirement** | **Yes**        | *"Real systems must be strong enough to prove basic facts; if they can’t, they might avoid Gödel. But if they’re strong, the trap snaps shut."* |  
  | **Inconsistency in M2 is artificial** | No      | *"Real systems don’t break this way, but they can be inconsistent—and you’d never ‘see’ it coming."* |  

  **Strength Gap Crucial**: If unaddressed, students might think, *"Weak machines avoid Gödel, so minds could be weak!"* Debrief explicitly: *"Gödel applies to systems strong enough to do arithmetic. Humans clearly are—so we’re not weak."*  

  ---

  This plan forces students to confront their assumptions through gameplay. The betting trap makes inconsistency feel costly, and the "add the sentence" move shows why anti-mechanism collapses under weight. By the end, they’ll see the argument’s circularity—assumed consistency—without you lecturing.
