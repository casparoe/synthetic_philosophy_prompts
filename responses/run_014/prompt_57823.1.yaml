prompt: |-
  You are a professional philosopher specialising in consent and sexual ethics, please work through this slowly and carefully, start with a bit of brainstorming about the options before you settle on a diagnosis.

  Had a late kitchen-table debate with my flatmate and now I am stuck with his arguement that seems to prove too much. (1) If someone says yes to sex only because you lied, and they would have said no if they knew the truth, then their consent is not valid. (2) This has to include secret deal-breakers, not just big stuff like stealthing or lying about STIs. If she only sleeps with fellow vegans and you lie about loving bacon, your lie made the difference just as much. (3) And deliberately not mentioning something is the same as lying here, if you know it would have made them say no. (4) But no one can mind-read all the secret deal-breakers a new partner might have. (5) So loads of ordinary, fairly blameless hook-ups end up counting as non-consensual, on a par with stealthing. (6) That cannot be right, it trivialises serious wrongs and makes consent useless for morals and law. So which step do I reject, and what does rejecting it cost? I really want to keep something that explains why stealthing ruins consent, but I do not want every white lie to do that.
reasoning: |-
  Okay, the user is presenting a complex ethical dilemma about consent, deception, and sexual ethics. They're clearly engaged in deep philosophical thinking after a debate with their flatmate, and seem genuinely troubled by the implications of the argument. 

  First, I need to unpack the logical structure they've outlined. The argument progresses through six clear steps that create a troubling paradox: if we accept that any deception invalidates consent (like in stealthing cases), and that omissions are equivalent to lies, and that people have undisclosed deal-breakers - then suddenly many ordinary sexual encounters become non-consensual. This clearly feels wrong to the user, and I agree - it would make consent impossibly fragile in practice.

  The user's core tension is interesting: they want to maintain strong protections against serious violations like stealthing, while avoiding making every minor deception or omission catastrophic. There's also an unspoken concern here about practical reality - how can people navigate intimacy if they're expected to anticipate all possible deal-breakers?

  Hmm... I recall several philosophical approaches that might help. The materiality framework from contract law seems promising - distinguishing between lies that actually impact the decision versus trivial ones. But sexual consent isn't exactly like signing a contract. There's also the "sexual fraud" distinction used in some legal systems, though that varies by jurisdiction.

  What's really tricky here is the omission issue. The user's flatmate is right that sometimes not telling something is as bad as lying - but where do we draw the line? If someone doesn't mention they voted Conservative last election, is that invalidating consent? That seems absurd. 

  I'm thinking the solution might lie in distinguishing between different types of facts: core sexual acts versus peripheral personal details. But even that gets messy - for some people, political affiliation or dietary choices might genuinely be central to their sexual decisions. Still, we have to balance idealism with practicality.

  The user seems analytically sharp - they've already identified the problematic steps (probably 3 and 4). They're looking for a way to reject parts of the argument without weakening protections against real harms. There's an ethical sophistication here - they recognize that rejecting step 1 would undermine legitimate sexual assault claims, which they clearly don't want.

  Perhaps the strongest approach is to challenge step 2's equivalence between major deceptions (STIs) and minor ones (bacon preferences). We need a principled way to say why some lies destroy consent while others don't. The concept of "reasonable expectations" might work - we reasonably expect partners to be honest about STIs, but not necessarily about their breakfast preferences.

  Also worth noting: the user's language ("secret deal-breakers", "blameless hook-ups") suggests they're thinking about casual encounters where deep mutual disclosure isn't expected. This context matters - expectations of honesty differ between one-night stands and committed relationships.

  Ultimately, the solution probably involves recognizing that consent exists on a spectrum of validity, not a binary. Some deceptions completely invalidate consent (stealthing), some make it questionable but not criminal (white lies), and some are irrelevant. This preserves the seriousness of major violations while avoiding absurd overreach.
answer: |-
  This is a profound challenge in consent ethics, and your flatmate's argument highlights a genuine tension. Let's break it down systematically, examining each step and potential solutions. The core dilemma is preserving consent's moral force *without* making it impossibly fragile or trivializing serious violations.

  **Brainstorming the Options & Potential Solutions:**

  1.  **Reject Step 1 ("Lies Invalidate Consent"):** The simplest solution, but it's deeply problematic. Rejecting Step 1 undermines the core wrong of *stealthing* and *lying about STIs*. If deception doesn't invalidate consent, then these acts become mere breaches of etiquette, not violations of bodily autonomy. This cost is likely too high, as it sacrifices the ethical foundation for condemning the most egregious deceptions. *Cost: Severely weakens protection against intentional, harmful deception.*
  2.  **Reject Step 2 ("Includes Secret Deal-Breakers"):** This targets the "bacon lie" example. We could argue that only deception about **certain categories** of facts invalidates consent. But what categories? STIs? Fertility? Identity? Actively performed acts (like condom removal)? The challenge is defining these categories *principledly* without arbitrariness. *Cost: Needs a robust, non-arbitrary principle to distinguish "consent-relevant" lies from trivial or unexpected ones.*
  3.  **Reject Step 3 ("Omission = Lying" in this context):** Argue that while *active deception* (e.g., "I'm vegan!") invalidates consent, mere *non-disclosure* of a potential deal-breaker you *knew* about (e.g., not mentioning your love of bacon when asked "Are you vegan?") does not necessarily invalidate consent. This creates a significant loophole for bad actors ("I didn't lie, I just didn't tell her..."). *Cost: Allows intentional withholding of crucial information to circumvent consent, potentially excusing predatory behavior.*
  4.  **Reject Step 4 ("No One Can Mind-Read"):** Argue that individuals *do* have some responsibility to disclose known major deal-breakers *if* the context reasonably suggests they might be relevant, or to actively inquire about potential deal-breakers important to them. This burdens individuals with more communicative responsibility. *Cost: Shifts significant burden onto individuals to anticipate or disclose, which can be impractical or unfair in casual encounters; hard to define "reasonable" expectation of disclosure.*
  5.  **Reject Step 5 ("Makes Ordinary Hook-ups Non-Consensual"):** Accept the logic of Steps 1-4 but deny the conclusion that this trivializes serious wrongs. Argue that consent *is* genuinely fragile and many encounters *are* morally compromised by deception, even if not legally actionable like assault. This preserves the seriousness of consent violations but makes the ethical landscape very bleak and potentially paralyzing. *Cost: Creates an overly broad category of "non-consensual" sex that includes minor deceptions, potentially diluting the term's gravity and making normative guidance difficult.*
  6.  **Reject Step 6 ("That Cannot Be Right"):** Accept the conclusion that many encounters *are* non-consensual by this strict standard, but argue that the law/ethics needs a *threshold of materiality/harm*. Stealthing causes direct physical/psychological harm and fundamental betrayal; a bacon lie might cause disappointment or anger, but not necessarily harm equivalent to a violation of bodily autonomy. *Cost: Requires a clear definition of "material harm" or "fundamental betrayal" specific to sexual consent.*

  **Diagnosis: A Refined Solution (Rejecting Step 2 & 4, Refining Steps 1 & 3)**

  The most defensible path forward, preserving the core wrong of egregious deception while avoiding the overbreadth problem, involves:

  1.  **Affirming Step 1 (Core Principle):** Yes, consent obtained through **material deception** is invalid. Lying about fundamental aspects of the **sexual act itself or immediate, serious risks** (like condom use, STI status, identity, or fertility where relevant) directly violates the conditions under which consent was granted and constitutes a fundamental betrayal. *This covers stealthing, STI lies, and identity fraud.*
  2.  **Rejecting Step 2's Equivalence (The Key Move):** Not all "deal-breakers" are created equal. We need a **principled distinction between deception/material omission that fundamentally alters the nature of the act or imposes serious risks, versus deception about background preferences, beliefs, or characteristics.** The "bacon lie" falls into the latter category.
      *   **Principle:** Consent is invalidated by deception/material omission **only when it concerns facts that:**
          *   **(a)** Directly pertain to the **physical sexual act being agreed to** (e.g., condom use, recording the act, nature of the act); OR
          *   **(b)** Involve **serious, immediate physical or psychological health risks** known to the deceiver (e.g., STI status, serious contagious disease); OR
          *   **(c)** Concern the **fundamental identity of the person** in a way central to the partner's decision *and* where identity is reasonably assumed (e.g., impersonating a specific person); OR
          *   **(d)** Involve **fraudulent inducement** where sex is offered conditional on a specific future outcome *known* to be false (e.g., "I'll give you this job/promote you if you sleep with me," when no such power/offer exists).
      *   **Why the Bacon Lie Doesn't Qualify:** Dietary preference, while potentially important to the person, does not fundamentally alter the physical nature of the sex act itself, impose a serious health risk, involve core identity fraud, or constitute fraudulent inducement. It's a preference about the *person*, not a defining characteristic *of the act* or a *direct risk*. Discovering the lie might make the person feel misled or used, but it doesn't retroactively make the *sexual act* something they didn't agree to *in its fundamental nature and risks*.
  3.  **Refining Step 3 (Omission vs. Lie):** Active lying about a material fact (as defined above) clearly invalidates consent. *Material omission* (knowingly withholding a material fact you know would cause refusal) also invalidates consent **if there was a reasonable expectation or duty of disclosure in the context.** There is a strong reasonable expectation of disclosure for facts under (a), (b), (c), and (d) above. There generally *isn't* a reasonable expectation to proactively disclose every possible personal preference (like loving bacon) unless directly asked and you lie in response. *This avoids the loophole for omissions on crucial matters while acknowledging that partners aren't psychic.*
  4.  **Refining Step 4 (Mind-Reading Burden):** The rejection of Step 2 and the refinement of Step 3 significantly reduce the "mind-reading" burden. Individuals are expected to be honest (and disclose by omission) **only** regarding the *material* categories (a-d). They are *not* expected to anticipate or proactively disclose every idiosyncratic preference or "secret deal-breaker" a partner might have that falls outside these categories (like dietary habits, political views, taste in music, past relationships - unless they constitute a serious health risk or identity fraud).
  5.  **Resolving Steps 5 & 6:** Ordinary hook-ups involving minor deceptions or non-disclosures about non-material facts (like the bacon preference) do **not** rise to the level of non-consensual sex on par with stealthing. The harm, while potentially real (hurt feelings, anger, feeling deceived), is different in kind and severity from the fundamental betrayal and potential physical/psychological harm caused by material deception about the act itself or serious risks. Consent remains a robust concept focused on the core nature and risks of the sexual act agreed upon. This avoids trivializing serious wrongs while acknowledging that lesser deceptions can still be morally objectionable (dishonest, disrespectful) without invalidating consent in the strong, autonomy-violating sense.

  **Conclusion:**

  Reject the **unqualified equivalence in Step 2**. The cost is developing a **principled distinction between material and non-material facts/deceptions** concerning consent. The distinction hinges on **whether the deception pertains to the fundamental nature of the agreed-upon sexual act, imposes serious immediate risks, involves core identity fraud, or constitutes fraudulent inducement.**

  This approach:
  *   **Preserves** the core wrong of stealthing, STI lies, identity fraud, etc. (invalid consent).
  *   **Explains why** the "bacon lie" is problematic (dishonest, disrespectful) but **does not invalidate consent** in the strong, autonomy-violating sense. It's a breach of trust, not a fundamental violation of the agreement about the sexual act itself.
  *   **Avoids** the absurdity and impracticality of requiring partners to anticipate all possible secret deal-breakers. The duty focuses on material facts central to the sexual encounter.
  *   **Maintains** consent as a meaningful concept for ethics and law, focused on bodily autonomy and protection from fundamental harm/betrayal within the sexual act.

  The "bacon lie" is morally bad (dishonesty, disregard for partner's values), but it doesn't transform consensual sex into its non-consensual counterpart. Stealthing does. This distinction is crucial and defensible.
