prompt: |-
  I'm a science and ideas journalist, and I'm putting together a long-form piece on logical uncertainty — the problem of how a reasoner should assign probabilities to mathematical statements (say, "the 87,653rd digit of π is a 7") that it has not yet had the computational resources to settle. I've been working through the introduction and abstract of Garrabrant, Benson-Tilsen, Critch, Soares, and Taylor's "Logical Induction" (arXiv:1609.03543), and I keep getting stuck on the precise sense in which their core criterion is supposed to generalize the old "Dutch book" argument from probability theory. The key passage I'm circling is this:

  "These properties and many others all follow from a single logical induction criterion, which is motivated by a series of stock trading analogies. Roughly speaking, each logical sentence φ is associated with a stock that is worth $1 per share if φ is true and nothing otherwise, and we interpret the belief-state of a logically uncertain reasoner as a set of market prices, where P_d(φ) = 0.5 means that on day d, shares of φ may be bought or sold from the reasoner for 50¢. The logical induction criterion says (very roughly) that there should not be any polynomial-time computable trading strategy with finite risk tolerance that earns unbounded profits in that market over time."

  Two things in that last sentence are doing more work than I can currently make sense of, and I'd be grateful for help untangling them. First, why does the criterion single out polynomial-time computable trading strategies rather than just any computable strategy — what would go wrong if you dropped the efficiency restriction? Second, why is the target "unbounded profits over time" rather than a one-shot guaranteed loss, as in the classic Dutch book setup? I suspect these two restrictions are load-bearing for making the criterion both non-vacuous and actually satisfiable by a real algorithm, but I can't quite see the argument, and I'd like to understand it well enough to explain it accurately to a general (but numerate) readership.
reasoning: |-
  Okay, the user is a science journalist working on a piece about logical uncertainty, specifically focusing on the Logical Induction paper. They're stuck on how the logical induction criterion generalizes the Dutch book argument. Two main points are confusing them: why polynomial-time computable trading strategies are specified and why the criterion targets unbounded profits over time instead of a one-shot guaranteed loss.

  First, I need to recall the classic Dutch book argument. In standard probability, a Dutch book is a set of bets that guarantees a loss no matter what happens. If an agent's probabilities are inconsistent (like not summing to 1 for mutually exclusive events), someone can exploit them with such bets. So coherent probabilities prevent this.

  Now, the Logical Induction paper applies this to mathematical statements. Here, truths are deductively settled over time as the agent computes more. The market prices represent the agent's credences in unproven mathematical statements. The paper uses a stock market analogy where each logical sentence is a stock that pays $1 if true, $0 otherwise. The agent sets prices, and traders can buy/sell shares.

  The key is the logical induction criterion: no polynomial-time computable trading strategy with finite risk tolerance can make unbounded profits over time. The user's questions are about the polynomial-time restriction and the unbounded profits aspect.

  Why polynomial-time? If they allowed any computable strategy, that might include traders who can deduce the truth faster than the agent. The agent is limited computationally, so it can't handle traders that outpace it. For example, a trader could exploit by knowing when the agent will compute something. Polynomial-time ensures traders operate within feasible computational limits, making the criterion achievable. Without this, no computable agent could satisfy it because hypercomputational traders could always exploit.

  Why unbounded profits over time? Unlike the one-shot Dutch book, the agent updates as it proves theorems. They can't avoid all losses initially because truths aren't known yet. The key is that no trader can keep profiting indefinitely. The agent's prices should improve, becoming calibrated and not easily exploitable in the long run. This allows the agent to learn and adjust, which is more realistic than demanding no possible loss at any point.

  Putting it together: The polynomial-time constraint ensures that the agent can defend against feasible traders. Unbounded profits focus on asymptotic behavior, allowing initial inaccuracies but requiring that the agent learns and can't be exploited infinitely. This makes the logical inductor computable and non-vacuous. Examples could help: a trader that buys shares when the price is too low, but if the agent updates, the trader can't keep doing this forever. The user needs to convey these nuances to a general audience, so simplicity and analogies are key.
answer: |-
  As a science journalist grappling with logical uncertainty, you've pinpointed the two most conceptually dense elements of the Logical Induction criterion. Let's unpack why the **polynomial-time computable** restriction and the **unbounded profits over time** target are essential for making the framework both non-vacuous and achievable. Think of this as a "computational Dutch book" for bounded reasoners in the realm of undecided mathematics.

  ### 1. Why Polynomial-Time Computable Trading Strategies?
  *(The "Feasible Exploiters" Constraint)*

  **The Core Issue:** In the classic Dutch book argument, *any* inconsistent probability assignment can be exploited by *some* clever bookie—no computational limits apply. But logical uncertainty involves statements like "Goldbach’s conjecture is true" or "Digit *n* of π is 7," where truth is *objectively determined* but *unknown* to the computationally bounded reasoner. If we allowed *arbitrary* computable traders (even uncomputably powerful ones!), **no algorithm could satisfy the criterion.** Here’s why:

  - **Hypercomputational Exploiters:** A trader could "precompute" all mathematical truths (e.g., by solving the Halting Problem) and instantly buy/shares at prices ≠ $0 or $1. Since no algorithm can *know* all mathematical truths, it would be vacuously impossible to avoid exploitation.
    
  - **Oracle Traders:** Even if traders are computable, a strategy might say: "Buy 1 share of φ if φ is provable in ZFC within *d* days." But the reasoner itself doesn’t *know* if φ is provable by day *d*—its computational limits prevent this. Requiring traders to run in **polynomial-time** ensures they operate under *similar computational constraints* as the reasoner. They can’t "look into the future" or access uncomputable knowledge.

  **Why Polynomial-Time?** It’s a pragmatic stand-in for "feasibly computable." The framework needs a class of traders that:
  - Can be simulated efficiently (critical for the existence proof).
  - Represent "realistic adversaries" a reasoner might face (e.g., other algorithms, automated arbitrageurs).
  - Prevent asymptotic exploits *without* demanding omniscience.

  **Analogy for General Readers:**  
  > *Imagine a chess-playing AI. We judge its skill not against a hypothetical god-like player that sees all future moves, but against opponents with similar computational resources. Allowing only polynomial-time traders ensures we’re assessing the logical inductor against "fair" exploiters playing by the same rules of computation.*

  ### 2. Why Unbounded Profits Over Time?
  *(The "Asymptotic Calibration" Target)*

  **The Core Issue:** In classic Dutch books, inconsistency guarantees a *single, immediate* loss. But a reasoner facing *logical uncertainty* **cannot avoid all short-term losses.** Early on, with minimal evidence, it might assign P("Digit *n* of π is 7") = 0.5. If the digit is later revealed as 7, a trader could have bought shares for $0.50 and gained $0.50. A one-shot guaranteed loss is impossible to avoid—and demanding it would make the criterion unsatisfiable.

  The key insight is that as the reasoner computes more (proves theorems, checks digits), its prices should *improve*. The criterion ensures no trader can exploit its ignorance *indefinitely*:

  - **Unbounded Profits:** A trader shouldn’t be able to design a strategy that, say, earns $1 on day 10, $2 on day 100, $3 on day 1000, etc., *forever*. The logical inductor must "learn" fast enough to close off persistent arbitrage opportunities.
    
  - **Finite Risk Tolerance:** Traders can’t take infinite leveraged bets (e.g., "mortgage everything to buy φ-shares"). This mirrors real markets and prevents unrealistic exploits.

  **Why Asymptotics?** It allows the reasoner to:
  - Start with "reasonable guesses" (even if wrong).
  - Gradually refine beliefs *as it acquires more logical evidence*.
  - Achieve long-term properties like **calibration** (e.g., when P(φ) = 0.6 over many statements, ~60% turn out true) and **accuracy** (prices converge to truth for *decidable* statements).

  **Analogy for General Readers:**  
  > *Consider a weather forecaster. On day 1, they predict a 50% chance of rain tomorrow—but it’s sunny. They lose "money" to a bettor. Over time, though, they incorporate data and improve. We don’t demand perfect day-1 accuracy (impossible!), but we expect them to avoid *systematic, never-ending* exploitability. If a gambler could reliably extract growing profits year after year, we’d question the forecaster’s model.*

  ### How These Restrictions Make It Work
  The two constraints resolve a tension:
  - **Polynomial-time:** Ensures exploiters are "feasible" (non-vacuous criterion).
  - **Unbounded profits:** Allows for initial ignorance while demanding eventual reliability (achievable by algorithm).

  The Logical Induction paper **constructs an algorithm** (the "LI algorithm") satisfying this. It works by:
  1. Maintaining a "trading ledger" tracking all transactions.
  2. Adjusting prices to penalize strategies that would profit *if continued indefinitely*.
  3. Updating beliefs as new theorems are proved (e.g., if "φ is true" is proved, P(φ) jumps to $1).

  **Key Takeaway for Your Piece:**  
  Logical induction replaces the Dutch book’s *static consistency* with *dynamic, computational consistency*. It’s a framework for how a bounded reasoner should assign "probabilities" to mathematical facts *while it’s still learning*, ensuring it isn’t asymptotically exploitable by adversaries playing the same computational game. The polynomial-time and unbounded-profit conditions are the guardrails making this possible in our finite, computable universe.

  *Further reading for depth: See Garrabrant et al.’s Section 5 ("Properties of Logical Inductors") for how this criterion implies timely convergence for efficiently computable truths, non-dogmatism, etc. — all emergent from the market analogy.*
