          - After Round 2: Branch count now is 3. If they allocated equally, they lost about 5 points. Why? Because the high-weight branch A (0.6) was allocated only 1/3, which is too low.

          - After Round 3: The disaster: branch counting gives a very low score. Why? Because the branch with the high weight (A, 0.9) was allocated only 1/101, which is way too low. The quadratic penalty was huge. Meanwhile, the many low-weight branches were allocated too much, but because they are low weight, the high scores there don't compensate for the disaster in the high-weight branch.

          - The point: the branch count is arbitrary because we can split a branch arbitrarily. The weights are fixed. Therefore, the allocation must depend on the weights, not the branch count.

          - Connection to Everett: the weights (amplitudes squared) are the only stable quantities. They are the ones that cannot be arbitrarily changed by splitting. Therefore, any rational betting strategy must use the weights.

          - But what is the meaning of "probability" in this setting? It is not a probability of occurrence (since every outcome occurs) but a measure of importance for the branch. We care more about branches with high weight because they contribute more to the average.

          - Finally, note that in the Deutsch-Wallace argument, they derive the Born rule by showing that a rational agent who cares about the welfare of their future copies must use the weights in a way that satisfies the probability axioms. Our game is a simple illustration of why branch counting fails and why we need something else.

       Concrete rules:

          - Each player is given a budget of 100 points to allocate across the branches. The allocations must be nonnegative and sum to 100.

          - The branch structure (number of branches and their weights) is announced before the allocation.

          - After allocation, the splits occur (if any) and then the scores are computed for each branch.

          - For a branch with weight w and where the player allocated f points (so fraction f/100), the score for the copy in that branch is:

                 score = 100 * [ 1 - ( (f/100) - w )^2 ]

            Note: we use the fraction f/100 to be between 0 and 1.

          - The player's overall score for the round is the weighted average of the scores in each branch, weighted by the branch weights.

          - We then compare the scores: if they allocated perfectly (f/100 = w for every branch) they get 100.

       Alternatively, we can have them allocate fractions that sum to 1. Then the allocation to a branch is f_i (a fraction). Then the score in branch i is 100 * [1 - (f_i - w_i)^2]. And the overall score is the weighted average.

       We'll do the fraction method: they allocate fractions f_i (between 0 and 1) that sum to 1.

       Steps for each round:

          1. Announce the branches and their weights.
          2. Players write down their allocations (fractions for each branch) on a slip.
          3. Collect and compute the scores for each player.
          4. Display the scores.

       To save time, we might have them work in groups or do one example player.

       Alternatively, we can have a few representative strategies (branch count, weight, equal weight per branch, etc.) and compute for the whole class.

       Given 10 students, we can have them each play individually and then we compute one round in 5 minutes? We can do the computations quickly with a spreadsheet.

       But if we do three rounds, and each round takes 10 minutes (including explanation and computation), that's 30 minutes. Then we have 60 minutes for intro and debrief.

       Alternatively, we can have the class vote on a strategy and then compute the score for that strategy.

       We'll do: for each round, the class is divided into groups of 2-3. Each group decides an allocation. Then we compute the score for that allocation and compare.

       Then we need about 5 groups. We can do:

          Round 1: 5 minutes for discussion and allocation.
          Then 5 minutes to compute and discuss.

          Round 2: 5 minutes for discussion and allocation, then 5 minutes to compute.

          Round 3: 5 minutes for discussion and allocation, then 5 minutes to compute.

       That's 30 minutes.

       Then 10 min intro, 50 min for the rest.

       Let's outline:

          0-10: Intro and rules.
          10-20: Round 1.
          20-30: Round 2.
          30-40: Round 3.
          40-90: Discussion and debrief.

       But we might need more time for discussion.

       Alternatively, we can do:

          0-10: Intro
          10-15: Round 1 allocation
          15-20: Round 1 scoring and quick reactions
          20-25: Round 2 allocation
          25-30: Round 2 scoring
          30-35: Round 3 allocation
          35-40: Round 3 scoring
          40-90: Debrief

       That leaves 50 minutes for debrief, which is good.

       However, the allocations might take longer. We can pre-define the states and splits.

       States:

          Round 1: 
              Branch A: weight = 0.6
              Branch B: weight = 0.4

          Round 2:
              Branch A: weight = 0.6
              Branch B1: weight = 0.2
              Branch B2: weight = 0.2   (so B was split into two)

          Round 3:
              Branch A: weight = 0.9
              Then we split B into 100 branches: we don't want to write 100, so we say:
                  Branch B1 to B100: each weight = 0.001

              We can represent it as:
                  Branch A: weight 0.9
                  Branch B: total weight 0.1, but split into 100 branches of 0.001 each.

              We tell the groups: there are 101 branches: A and B1,...,B100.

       We provide a worksheet for them to write their allocations.

       We'll have a spreadsheet ready to compute the scores.

       How to compute for a group:

          Allocation: they give f_A, f_B1, ..., f_B100 (for round 3). We require that the sum of all f's is 1.

          For branch A: 
              score_A = 100 * [1 - (f_A - 0.9)^2]

          For branch Bi:
              score_Bi = 100 * [1 - (f_Bi - 0.001)^2]

          Overall score = 0.9 * score_A + 100 * (0.001 * score_Bi)   [because each Bi has weight 0.001, and there are 100 of them, but note: the weighted average is the sum over branches of (weight * score). For the Bi branches: 0.001 * score_Bi for each, so total for B: 0.001 * (score_B1+...+score_B100). But if they allocated equally to all Bi, then f_Bi = f_B/100, where f_B is the total for B.

       We can compute:

          Let f_B = sum_{i=1}^{100} f_Bi, then the average f_Bi = f_B/100.

          Then the average score for the B branches: 
              = (1/100) * sum_i score_Bi 
              = (1/100) * sum_i [1 - (f_Bi - 0.001)^2] 
              ≈ 1 - ( (1/100) * sum_i (f_Bi - 0.001)^2 )

          But note: the overall score for the group is:
              = 0.9 * score_A + 0.1 * [ (1/100) * sum_i score_Bi ]   ??? 

          No, the overall score is:
              score = w_A * score_A + w_{B1} * score_{B1} + ... + w_{B100} * score_{B100}
                    = 0.9 * score_A + 0.001 * score_B1 + ... + 0.001 * score_B100
                    = 0.9 * score_A + 0.001 * (score_B1 + ... + score_B100)

          So we need the individual f_Bi.

       To simplify, we can ask the groups to specify:

          f_A: fraction for A
          f_B: total fraction for all B branches, and then they can choose how to distribute f_B among the 100 branches.

       But we want them to see that if they distribute equally, then each f_Bi is small. And if they put all f_B on one branch, then that branch gets f_B and the others 0.

       We'll let them choose any distribution. But to make the point, we expect they will either:

          - Allocate f_A = 0.9, and then distribute f_B=0.1 equally: each Bi gets 0.001.

          - Allocate equally: f_A = 1/101, each Bi=1/101.

          - Or, they might put everything on one Bi? But that would be perverse.

       We'll compute for the two main strategies.

       We can have a volunteer to compute the branch-counting strategy and another for the weight strategy.

       Given time, we might just compute the branch-counting strategy and the weight strategy and compare.

       Alternatively, we can have each group report their overall score, and then we see the spread.

       But the computation for 100 branches is tedious. We can pre-compute the branch-counting and weight strategies for Round 3 and show the results.

       Or, we can note:

          For branch-counting: 
              f_A = 1/101
              each f_Bi = 1/101

              score_A = 100 * [1 - (1/101 - 0.9)^2] 
                       = 100 * [1 - ( (1 - 90.9)/101 )^2] 
                       = 100 * [1 - ( (-89.9)/101 )^2] 
                       = 100 * [1 - (89.9/101)^2]
                       89.9/101 ≈ 0.89, so (0.89)^2≈0.792, then 1-0.792=0.208 -> 20.8

              For a Bi branch: 
                  score_Bi = 100 * [1 - (1/101 - 0.001)^2]
                           = 100 * [1 - (0.0099 - 0.001)^2] 
                           = 100 * [1 - (0.0089)^2] 
                           = 100 * [1 - 0.00007921] 
                           = 100 * 0.99992079 ≈ 99.992

              Then overall score = 0.9 * 20.8 + 0.001 * (sum over i of 99.992) 
                                = 0.9*20.8 + 0.001 * (100 * 99.992)
                                = 18.72 + 0.1 * 99.992   [because 0.001 * 100 = 0.1]
                                = 18.72 + 9.9992 = 28.7192

          Weight strategy:
              f_A = 0.9
              each f_Bi = 0.001

              score_A = 100 * [1 - (0.9-0.9)^2] = 100
              each score_Bi = 100 * [1 - (0.001-0.001)^2] = 100

              overall score = 0.9*100 + 0.001 * (100 * 100) = 90 + 0.001*10000 = 90 + 10 = 100

       So we can present these two.

       For Round 3, we might not require the groups to do the full allocation for 100 branches, but just ask: what total fraction f_A and f_B would you allocate? And then for the B branches, how would you distribute? And then we compute for two cases: equal distribution or weight distribution.

       But note: the score for the B branches depends on the distribution. If they put all 0.1 on one branch and 0 on the others, then:

          For the branch that got 0.1: score = 100 * [1 - (0.1-0.001)^2] = 100 * [1 - (0.099)^2] = 100 * [1 - 0.009801] = 100 * 0.990199 = 99.0199
          For the other 99 branches: score = 100 * [1 - (0 - 0.001)^2] = 100 * [1 - 0.000001] = 99.9999

          Then overall score = 0.9 * (score for A) + ... 
              But what is f_A? They have to allocate f_A and then the rest to B. Let f_A be a, then f_B=1-a, and they put the entire f_B on one branch.

              score_A = 100 * [1 - (a - 0.9)^2]
              Then for the one B branch that got 1-a: score = 100 * [1 - ((1-a) - 0.001)^2] = 100 * [1 - (0.999 - a)^2]   [if a is the allocation to A, then 1-a to that B branch]
              For the other 99 B branches: 0 allocation, so score = 100 * [1 - (0 - 0.001)^2] = 99.9999

              Then overall score = 0.9 * [100*(1-(a-0.9)^2)] 
                                 + 0.001 * [100 * (1 - (0.999 - a)^2)] 
                                 + 0.001 * 99 * 99.9999

          This is messy, and we don't expect groups to do this.

       We will therefore, for Round 3, only consider two strategies: branch-counting (equal per branch) and weight (f_i = w_i). We compute these for the class.

       So the plan:

          Round 1: 
              Branches: A (0.6), B (0.4)
              Strategies to compare: 
                  S1: equal allocation: f_A=0.5, f_B=0.5 -> score = 0.6*[100*(1-(0.5-0.6)^2)] + 0.4*[100*(1-(0.5-0.4)^2)]
                           = 0.6*100*(1-0.01) + 0.4*100*(1-0.01) = 0.6*99 + 0.4*99 = 99
                  S2: weight allocation: f_A=0.6, f_B=0.4 -> score=100

          Round 2:
              Branches: A (0.6), B1 (0.2), B2 (0.2)
              S1: equal per branch: f_A=1/3, f_B1=1/3, f_B2=1/3
                  score_A = 100*(1-(1/3-0.6)^2) = 100*(1-(0.333-0.6)^2)=100*(1-(-0.267)^2)=100*(1-0.0712)=92.88
                  score_B1 = 100*(1-(1/3-0.2)^2)=100*(1-(0.333-0.2)^2)=100*(1-0.133^2)=100*(1-0.0177)=82.3? Wait, let me recalculate:
                      0.333-0.2 = 0.133, (0.133)^2=0.017689, so 1-0.017689=0.982311 -> 98.2311
                  Similarly for B2: 98.2311
                  overall = 0.6*92.88 + 0.2*98.2311 + 0.2*98.2311 = 55.728 + 19.64622 + 19.64622 = 94.02 (approx)

              S2: weight allocation: f_A=0.6, f_B1=0.2, f_B2=0.2 -> score=100 for all -> overall=100.

          Round 3:
              S1: branch-counting: f_A=1/101, f_Bi=1/101 for each i (100 times)
                  score_A = 100*(1-(1/101-0.9)^2) = 100*(1- (0.0099-0.9)^2)=100*(1- (-0.8901)^2)=100*(1-0.79217801)=100*0.20782199=20.782
                  each score_Bi = 100*(1-(1/101-0.001)^2)=100*(1-(0.0099-0.001)^2)=100*(1-0.0089^2)=100*(1-0.00007921)=100*0.99992079=99.992
                  overall = 0.9*20.782 + 0.001 * (99.992 * 100) = 18.7038 + 0.001 * 9999.2 = 18.7038 + 9.9992 = 28.703

              S2: weight allocation: f_A=0.9, each f_Bi=0.001 -> score=100 for every branch -> overall=100.

       We'll present these in a table.

       Finally, we note that the branch-counting strategy does progressively worse.

       Debrief outline:

          - Start by asking: In Round 1, was there uncertainty about which branch you would end up in? (No, because you end up in both.) So why did you bet?

          - How did you decide how to allocate? What seemed reasonable?

          - In Round 3, what happened to the branch-counting strategy? Why?

          - What is the stable quantity that cannot be changed by splitting? (The weights.)

          - Therefore, the Born rule (using the amplitude squared) provides the only stable way to assign weights to branches.

          - In the Everett interpretation, probability is not about what will happen (because everything happens) but about how to weight the branches for rational decision making.

          - The decision-theoretic approach (Deutsch and Wallace) makes this rigorous by showing that if you care about your future copies in a few specific ways, you must use the Born rule.

       What we had to supply: the use of the weights in the scoring rule. In reality, why should we weight by the amplitude squared? The decision-theory program tries to derive it from non-probabilistic axioms. We didn't do that; we assumed it. But the game shows that without it, branch counting fails.

       So the game illustrates the problem and points to the solution, but does not derive the solution.

       Let's write the full rules.
answer: |-
  ### Structured In-Class Game: The Branch Weight Dilemma

  #### **Learning Goal**
  To experientially confront the Born-rule problem in the Everett interpretation: when all outcomes occur across branches, "probability" loses its classical meaning. Branch-counting fails because it can be manipulated, while amplitude-squared weights remain stable. Students will discover why rational agents must use weights, not branch counts.

  #### **Game Rules & Payoff Scheme**
  1. **Setup**:
     - **Players**: 10 graduate students.
     - **Tokens**: Each player starts with 100 tokens per round. Tokens represent welfare points for their future copies.
     - **Branches**: Defined by a quantum state (announced each round). Branches have weights (amplitudes squared).
     - **Allocation**: Players allocate tokens across branches before splitting. Sum must equal 100.
     - **Splitting Mechanic**: After allocation, a designated "Splitting Player" (see roles) may subdivide one branch into sub-branches with identical outcomes but divided weight (e.g., a branch of weight 0.1 split into 10 sub-branches of weight 0.01 each).
     - **Scoring**:
       - Post-split, each copy in a branch receives a score:  
         **Score = (Tokens allocated to branch) × (1 / Branch weight)**  
       - **Overall Player Score**: Weighted average across branches:  
         **Overall = Σ [Branch weight × Score in branch]**  
       - Players aim to maximize their overall score. Higher = better (max 100).

  2. **Why This Scoring?**  
     - Low-weight branches yield high scores per token (compensating for rarity), while high-weight branches require more tokens to avoid penalties. Rational play rewards aligning allocations with weights.

  #### **Quantum States & Branch Structures**
  - **Round 1 (15 mins)**:  
    - State: \( \sqrt{0.6} |A\rangle + \sqrt{0.4} |B\rangle \) → **Branches**: A (weight 0.6), B (weight 0.4).  
    - **Goal**: Players experience pre-branching allocation. Most allocate equally (50-50) by branch count.

  - **Round 2 (20 mins)**:  
    - State: \( \sqrt{0.6} |A\rangle + \sqrt{0.2} |B_1\rangle + \sqrt{0.2} |B_2\rangle \) → **Branches**: A (weight 0.6), B₁ (0.2), B₂ (0.2).  
    - **Splitting**: B is split into B₁ and B₂ (same outcome "B").  
    - **Goal**: Players see branch count increase (3 branches). Many allocate equally (33-33-33), assuming majority wins.

  - **Round 3 (25 mins)**:  
    - State: \( \sqrt{0.9} |A\rangle + \sqrt{0.1} |B\rangle \) → **Splitting**: B split into 100 sub-branches (B₁ to B₁₀₀, each weight 0.001).  
    - **Branches**: A (weight 0.9), B₁ (0.001), ..., B₁₀₀ (0.001).  
    - **Goal**: Low-weight B dominates branch count (101 branches). Players allocating equally (≈1 token/branch) face disaster.

  #### **Roles**
  1. **Splitting Player (1 student)**:  
     - Chooses whether/where to split branches (pre-defined: splits B in Round 2 and Round 3).  
     - Must split as announced (no improvisation).  
  2. **Bookmaker (Instructor)**:  
     - Announces states, weights, and rules; enforces allocations.  
     - Computes scores using a spreadsheet (pre-loaded formulas).  
  3. **Registrar (1 student)**:  
     - Collects allocation slips and enters data into spreadsheet.  
  4. **Regret Auditor (1 student)**:  
     - After scoring, calculates "regret": Difference between player’s score and optimal score (100).  
     - Reports how much players lost by not using weights.

  #### **Timeline (90 mins)**
  - **0–10 mins**: Introduction  
    - Explain rules, scoring, and roles. Emphasize: "Every outcome happens—you will have a copy in every branch. Your goal is to maximize your overall score, averaged over branches."
  - **10–25 mins**: Round 1  
    - State: A (0.6), B (0.4). Players allocate tokens.  
    - **Splitting**: None. Compute scores.  
    - Sample result: Equal allocation (50A, 50B) → Score = 83.3 (optimal: 100).
  - **25–45 mins**: Round 2  
    - State: A (0.6), B₁ (0.2), B₂ (0.2). Splitting Player splits B.  
    - Players allocate. Compute scores.  
    - Sample result: Equal allocation (33A, 33B₁, 34B₂) → Score ≈ 88.6 (optimal: 100).
  - **45–70 mins**: Round 3  
    - State: A (0.9), B₁–B₁₀₀ (each 0.001). Splitting Player splits B.  
    - Players allocate. Compute scores.  
    - Sample result: Equal allocation (1A, 1 per Bᵢ) → Score ≈ 28.7. Weight allocation (90A, 0.1 per Bᵢ) → Score = 100.
  - **70–90 mins**: Debrief  
    - Guide reflection using questions (see below). No lecture—draw insights from gameplay.

  #### **Debrief: Mapping Gameplay to Concepts**
  1. **Betting Without Uncertainty (Round 1)**:  
     - Ask: *"You knew you’d have a copy in every branch. Why allocate tokens at all? What were you optimizing for?"*  
     - Point: Allocation isn’t about uncertainty—it’s about distributing welfare across certain futures. In Everett, "probability" is about care/weighting, not possibility.

  2. **Branch-Counting Failure (Rounds 2–3)**:  
     - Ask: *"In Round 2, why did some allocate equally to 3 branches? In Round 3, what happened when you did this?"*  
     - Highlight:  
       - Round 2: Equal allocation (33-33-33) → A (weight 0.6) was underfunded, dragging down the score.  
       - Round 3: Disaster (score ≈28.7) because A (weight 0.9) got only 1 token.  
     - Point: Branch-counting is manipulable. Splitting Player made B "win" by count, but weights are invariant.

  3. **Weights as the Stable Quantity (Scoring System)**:  
     - Ask: *"What strategy maximized your score? Why did tokens × (1/weight) work?"*  
     - Reveal: Optimal play is **allocation = branch weight**.  
       - If allocated tokens = weight in a branch:  
         Score = (Weight) × (1 / Weight) = 1 in every branch → Overall = 100.  
       - **Non-gameable**: Weights are fixed by amplitudes (unlike branch counts).  
     - Connect: Born rule (amplitude²) isn’t arbitrary—it’s the unique weighting immune to splitting.

  4. **Everettian Probability**:  
     - Ask: *"If ‘probability’ isn’t about what happens (everything does), what is it for?"*  
     - Conclude: It’s a measure of **caring** (how much we weight a branch) or **rational anticipation** (how a copy should expect to experience the world).  
     - Gesture to Deutsch-Wallace: "Decision theory shows rational agents *must* use Born weights—but today, you felt why."

  #### **Predictable Problems & Solutions**
  - **Problem 1**: Students ignore copying, play classically.  
    - *Solution*: Stress pre-branching ignorance: "You’re about to split—you don’t know which future ‘you’ will feel like the ‘real’ one. Allocate tokens to protect all futures." Use tokens, not abstract points.
  - **Problem 2**: Arithmetic overwhelms concepts.  
    - *Solution*: Use a spreadsheet for scores. Provide calculators. For Round 3, only compute 1–2 strategies (e.g., equal vs. weight allocation).
  - **Problem 3**: Splitting feels artificial.  
    - *Solution*: Argue: "In quantum mechanics, decomposing a branch is always possible. The game forces you to see that only weights are invariant."

  #### **What the Game Can’t Reproduce**
  - **The Origin of Weights**:  
    The game assumes amplitude² weights as given. It doesn’t derive *why* rational agents must use them (only that branch-counting fails).  
    - *Supply in Debrief*: "Deutsch-Wallace prove agents who value all futures equally are *forced* by decision theory to use Born weights. Today’s game shows why alternatives fail."
  - **Subjective Uncertainty**:  
    Game copies are distinct post-split, but pre-split agents know branching is certain.  
    - *Supply in Debrief*: "In Everett, probability arises from pre-measurement ignorance of *which future self* you’ll subjectively experience—a betting stance, not ontic uncertainty."

  #### **Materials**
  - Spreadsheet with formulas (for insta-scoring).  
  - Allocation slips (paper or digital).  
  - Role cards (Splitting Player, Registrar, Auditor).  
  - Cheat sheet: "Weights = Amplitudes². Optimal allocation: Tokens in branch = Branch weight."

  By confronting branch-counting’s instability, students will viscerally grasp why Everettians need the Born rule—and why probability becomes "caring measure." The game doesn’t solve the problem but makes it unforgettable.
