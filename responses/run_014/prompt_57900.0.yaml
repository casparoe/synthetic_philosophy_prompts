prompt: |-
  hey so my reading group got stuck on teh equality-of-what thing — you know, should we equalize how happy/satisfied people are, vs equalize the identical stuff they get, vs equalize their real ability to live a decent life — and i want to mess with them a bit.

  can you write me deadpan minutes from three successive meetings of a housing co-op called Sunflower House that's trying to be perfectly fair, like 550-650 words total, in the voice of an exhausted secretary who's trying to stay neutral?

  meeting 1 they try to equalize happiness. meeting 2 they get annoyed and switch to giving everyone exactly the same bundle of resources. meeting 3 they switch again to equalizing real opportunities to function well. use the same three residents across all three to show why each crashes: Maya who only gets any joy from super expensive vintage vinyl pressings, Luis who needs way more heating and food money because of a medical condition, and Priya who has trained herself to be content with almost nothing so she keeps making everyone else look greedy.

  the jokes should come from the actual problems — expensive tastes blowing up the happiness rule, different needs blowing up the same-stuff rule, adaptive preferences blowing up both — not from making the residents random jerks. stay straight-faced the whole time, no winking lecture about philosophy, but a person who knows the debate should be able to tell what you're skewering and think it's fair, and a normal reader should still find it funny.
