prompt: |-
  I just spent an hour arguing with a friend about whether a ring species is one species or several, and we went in circles because, without realizing it, we were answering different questions — I kept saying "but the neighbors interbreed" while he kept saying "but the ends have separate evolutionary histories." I teach an intro evolution course (about 25 undergraduates, one 50-minute session), and I'd like an in-class activity that makes students hit that disagreement themselves instead of having me assert it.

  Set it up as a taxonomic vote: give them a case file on a ring of related populations (adjacent populations interbreed, but the two ends meet and don't — think of a ring species like the herring gull complex) with data on morphology, mating behavior, and genetic divergence, and have them vote on whether it's one species or two. The rules should force each group to commit to a single criterion for its vote, and the vote should carry real stakes so it matters (e.g., the outcome determines whether the population gets its own legal protection or is folded into a broader, already-protected category). Arrange the data so that whichever criterion a group picks, some other fact in the file would flip the verdict under a different criterion — so the groups should split and discover the conflict on their own before I name it.

  Please give me the rules, the case file, the payoff scheme, a minute-by-minute timeline, and a debrief that maps each criterion the groups used onto the competing species concepts (biological, phylogenetic, morphological) and lands the deeper point: that "interbreeds with" isn't transitive, so it can't carve species into clean categories, and that the "right" concept partly depends on your purpose. Also tell me what will predictably go wrong the first time I run it, and be frank about which feature of the species problem the activity can't reproduce and I'll have to supply.
reasoning: |-
  We are designing an in-class activity for an introductory evolution course. The goal is to have students experience the species concept conflict firsthand by having them vote on whether a ring species is one species or two, using different criteria. The activity will be structured around a "taxonomic vote" with real stakes (e.g., conservation status). 

  Key elements:
  - Case file: Describes a ring species complex with multiple populations arranged in a ring. Adjacent populations interbreed, but the two ends (when they meet) do not interbreed and are reproductively isolated. Data on morphology, mating behavior, and genetic divergence will be provided.
  - Groups must commit to a single criterion for their vote.
  - The vote outcome will have consequences (e.g., conservation protection).
  - We want groups to split and then realize that the verdict flips if they use a different criterion.
  - Debrief: Map their criteria to species concepts (biological, phylogenetic, morphological) and discuss the non-transitivity of interbreeding and that the "right" concept depends on purpose.

  Structure:
  1. Introduction (5 min)
  2. Group formation and case file review (15 min)
  3. Group discussion and commitment to a criterion (15 min)
  4. Vote and reveal (5 min)
  5. Debrief (10 min)

  Total: 50 minutes

  Case File Design:
  We'll create a fictional ring species to avoid preconceptions. Let's call it the "Green-backed Sparrow" (to parallel the herring gull complex). The populations are arranged in a ring around a mountain range (or an ocean, but let's use mountains for simplicity). The ring has 5 populations: A, B, C, D, E, arranged so that A is adjacent to B and E, B to A and C, C to B and D, D to C and E, and E to D and A. However, note that in a ring species, the ends (A and E) are adjacent but do not interbreed. We can say that the ring is broken at the point where A and E meet (they are sympatric but do not interbreed). 

  Data provided:
  - **Morphology**: Measurements of beak size, wing length, and plumage color. Populations A and E are morphologically distinct (e.g., A has a larger beak and different plumage color than E). Populations A and B are similar, B and C are similar, etc., but the change is gradual (clinal) except between A and E which are distinct.
  - **Mating behavior**: Field observations show that adjacent populations interbreed freely (A-B, B-C, C-D, D-E) and produce fertile offspring. However, at the contact zone between A and E, no interbreeding is observed (they have different mating songs and rituals). 
  - **Genetic divergence**: Genetic data (e.g., from mitochondrial DNA or microsatellites) show that the genetic distance is small between adjacent populations but accumulates around the ring. The genetic distance between A and E is as large as that between two well-accepted separate species in the same genus.

  Conservation stakes: 
  - The entire complex is currently not protected. 
  - If the complex is considered one species, then it does not qualify for protection because it is widespread and not threatened. 
  - If the two ends (A and E) are considered two separate species, then each has a small range and is threatened (by habitat loss in their respective areas) and would qualify for endangered species protection.

  Voting rules:
  - The class will be divided into small groups (3-5 students each). 
  - Each group must choose one criterion from the following to base their vote on:
    1. Reproductive compatibility (biological species concept): If two populations can interbreed and produce fertile offspring, they are the same species.
    2. Morphological distinctness (morphological species concept): If two populations are morphologically distinct (beyond a threshold, which we set as the difference between A and E being above the threshold and adjacent ones below), they are separate species.
    3. Genetic divergence (phylogenetic species concept): If two populations have a genetic distance above a certain threshold (which we set as the typical distance between recognized species in the same genus), they are separate species.

  - Each group must vote either "one species" (the entire complex) or "two species" (A and E are separate, and the rest are intermediates that we assign arbitrarily to one or the other? But note: in a ring species, the intermediates are connected. We can say that if they vote for two species, then the entire complex is split into two: one species including A, B, C and the other including D, E? But note that C and D are adjacent and interbreed. Alternatively, we can avoid that complexity by having the vote be: is the complex one species or two (meaning A and E are two distinct species, and the intermediates are considered part of a continuum and not assigned to either? But that might be messy). 

  To simplify the vote, we frame it as:
  - Option 1: The entire ring is one species.
  - Option 2: The ring is split into two species: Species X (populations A and B) and Species Y (populations D and E), with population C being a hybrid zone? But that complicates it.

  Alternatively, we can frame the vote as:
  - Should populations A and E be considered the same species? (But then what about the intermediates?)

  But the conservation stakes are about the entire complex. So let's reframe:

  The question: "Should the entire Green-backed Sparrow complex be considered as one species (and thus not granted protection) or as two species (in which case the two species, one in the east (A and B) and one in the west (D and E), each with a small population, would be protected)?"

  But note: if we split, what about population C? It is in the middle. We can say that if they vote for two species, then the complex is split into two species: 
  - Species 1: populations A, B, and C (because they interbreed and are connected to A)
  - Species 2: populations D and E (because they interbreed and are connected to E)

  But then population C is assigned to species 1, even though it interbreeds with D? This breaks the ring. So we must be careful.

  Alternatively, we can avoid assigning the intermediates by having the vote focus on the endpoints and the conservation status only applies to the endpoints. However, the case file says that the endpoints are in danger and the intermediates are not. So:

  - If the complex is one species, then the entire range is considered, and because the total population is large, it does not get protection.
  - If the complex is two species (A and E are two distinct species), then each of A and E is a separate species with a small population and restricted range, so they both get protection. The intermediates (B, C, D) are not considered threatened and are not protected.

  But note that A and E are connected through intermediates? The protection would then be for A and E, but not for the intermediates. This is a bit forced but acceptable for the activity.

  So the vote question: "Vote for one of two options:
  Option 1: The entire complex is one species (no protection).
  Option 2: Populations A and E are two distinct species (each gets protection)."

  But then what about the intermediates? We can say that the intermediates are not under threat and are not part of the protection decision. The conservation concern is only for the endpoints because they are in a specific threatened habitat (e.g., coastal areas) while the intermediates are in the mountains and not threatened.

  Case File:

  **The Green-backed Sparrow Complex**

  Background: The Green-backed Sparrow is found in a ring of habitats around the Central Mountains. There are five main populations: A (East Coast), B (Eastern Foothills), C (Mountain Pass), D (Western Foothills), and E (West Coast). The populations form a ring: A is adjacent to B and E (coastlines meet at the north), B to A and C, C to B and D, D to C and E, and E to D and A. However, at the northern point, populations A and E come into contact and do not interbreed.

  Data:
  1. **Morphology**: 
     - Beak size (mean in mm): A: 12.0, B: 11.8, C: 11.5, D: 11.3, E: 10.5.
     - Plumage color (on a scale from 1=dark to 10=light): A: 2.0, B: 2.5, C: 3.0, D: 6.0, E: 8.0.
     - Note: The difference in beak size between A and E is 1.5 mm, which exceeds the typical within-species variation (0.5 mm) and is comparable to differences between known sister species (1.2-2.0 mm). The plumage difference between A and E is 6.0, which is also large (within a species usually <2.0, between species >5.0). Adjacent populations differ by less than 0.5 in beak size and 1.0 in plumage.

  2. **Mating Behavior**:
     - Adjacent populations (A-B, B-C, C-D, D-E) interbreed frequently in contact zones and produce fertile offspring. Hybrids show no reduced fitness.
     - In the contact zone between A and E (Northern Peninsula), no interbreeding occurs. They have different mating songs: A has a two-note song, E has a three-note song. In experiments, females of A do not respond to the song of E, and vice versa.

  3. **Genetic Divergence**:
     - Mitochondrial DNA sequence divergence (percent):
          A-B: 0.5%
          B-C: 0.6%
          C-D: 0.7%
          D-E: 0.8%
          A-E: 4.5%
     - Note: Divergence between A and E is 4.5%, which is above the typical threshold for species distinction in birds (2-3%). Adjacent populations are below 1%, which is typical within species.

  Conservation Status:
  - The East Coast (A) and West Coast (E) populations are threatened by coastal development. Their habitats are being destroyed. The other populations (B, C, D) are in the mountains and are not currently threatened.
  - Current policy: If the complex is considered one species, then the entire population is large and not eligible for protection. If populations A and E are considered two distinct species, then each has a small population and limited range and qualifies as endangered, so they would receive protection.

  Voting:
  - Each group must choose one criterion to base their vote on: 
    1. Reproductive compatibility: Focus on whether populations can interbreed.
    2. Morphological distinctness: Focus on the morphological differences.
    3. Genetic divergence: Focus on the genetic distance.

  - Then, using that criterion, the group votes for either:
    - Option 1: One species (no protection)
    - Option 2: Two species (A and E are distinct, so they get protection)

  Note: The criterion must be applied consistently. The group must commit to one criterion and explain their reasoning.

  How the criteria lead to different outcomes:
  - **Reproductive compatibility (BSC)**: Since adjacent populations interbreed, the whole ring is connected by gene flow. Therefore, they are one species. Vote for Option 1.
  - **Morphological distinctness (MSC)**: A and E are morphologically distinct (exceeding thresholds). Therefore, they are two species. Vote for Option 2.
  - **Genetic divergence (PSC)**: A and E have a genetic divergence above the species threshold. Therefore, they are two species. Vote for Option 2.

  But note: The reproductive compatibility group will vote for one species, while the other two groups will vote for two species.

  However, we can make it so that if a group picks the biological species concept, they might argue that A and E are not directly reproductively compatible and so could be considered two species? But the classic ring species argument is that the intermediates connect them. So the BSC would typically consider them one species. But to be safe, we can set the data so that the BSC clearly points to one species because the intermediates interbreed.

  But note: the problem is that A and E do not interbreed. So if we apply the BSC strictly to A and E, they are two species. However, the BSC is usually applied to the entire complex. The definition: "A species is a group of interbreeding natural populations that are reproductively isolated from other such groups." So the entire complex is a group of interbreeding populations? But A and E are not interbreeding. However, they are connected by intermediates. The traditional view is that ring species are one species under the BSC. So we'll stick with that.

  Activity Timeline (50 minutes):

  1. **Introduction (5 minutes)**:
     - Explain the scenario: They are a conservation committee that must decide the taxonomic status of the Green-backed Sparrow complex. The decision will determine whether the coastal populations get protection.
     - Explain the voting procedure: In small groups, they will review the case file and choose one criterion to base their vote on. They must commit to that criterion.

  2. **Group Formation and Case File Review (15 minutes)**:
     - Divide students into groups of 3-5.
     - Hand out the case file (one per group) and give them 10 minutes to read and discuss the data.
     - Then, each group must choose one criterion (reproductive compatibility, morphology, or genetics) and write it down.

  3. **Group Discussion and Commitment (15 minutes)**:
     - Groups discuss and come to a consensus on how to vote based on their chosen criterion.
     - They must write down:
          - Their chosen criterion
          - Their vote (Option 1 or 2)
          - A one-sentence justification
     - Collect the group decisions.

  4. **Vote and Reveal (5 minutes)**:
     - Tally the votes on the board, grouping by criterion.
     - Show how each criterion led to a particular vote.

  5. **Debrief (10 minutes)**:
     - Point out the conflict: Groups using reproductive compatibility voted for one species, while groups using morphology or genetics voted for two species.
     - Map to species concepts:
          - Reproductive compatibility → Biological Species Concept (BSC)
          - Morphological distinctness → Morphological Species Concept (MSC)
          - Genetic divergence → Phylogenetic Species Concept (PSC)
     - Discuss the non-transitivity of interbreeding: 
          - A can breed with B, B with C, C with D, D with E, but A cannot breed with E. So "interbreeds with" is not transitive. Therefore, the BSC cannot always divide species into non-overlapping groups.
     - The deeper point: The "right" species concept depends on the purpose. For conservation, we might care about distinct evolutionary trajectories (hence PSC or MSC) and thus protect A and E. For understanding gene flow, we might care about reproductive compatibility and see the ring as one species.
     - Note: In reality, ring species are rare and unstable, often breaking into multiple species over time.

  What will go wrong the first time?
  - Some groups might try to combine criteria or not commit to one. Be clear that they must pick one and stick to it.
  - The conservation stakes might be confusing (why only protect the endpoints?). Emphasize that the endpoints are the ones threatened and that the intermediates are not at risk.
  - Students might question why population C is not protected if they vote for two species. Explain that the conservation concern is specific to the coastal habitats of A and E.
  - Some students might argue that the entire ring should be split into two species, but then what about the intermediates? Our setup avoids that by only having the endpoints as candidates for protection and the vote being about the endpoints being two species or not (and the rest being part of the continuum).

  What the activity can't reproduce and you'll have to supply:
  - Ring species are a transient state. They usually either fuse into one species or split into multiple. The activity doesn't capture the dynamic aspect.
  - The activity simplifies the criteria. In reality, scientists often use multiple lines of evidence and there are more species concepts (e.g., ecological). 
  - The non-transitivity is clear in the ring, but in real life, the boundaries are often fuzzy even without a ring. The activity might give the impression that the problem only occurs in ring species.

  Debrief Script:

  "Today we saw that different groups, using different criteria, came to different conclusions about whether the Green-backed Sparrow complex is one species or two. 

  Groups that focused on reproductive compatibility (BSC) noted that adjacent populations interbreed, so they saw the entire ring as one connected species. Therefore, they voted for one species (no protection).

  Groups that focused on morphology (MSC) or genetics (PSC) saw that the endpoints (A and E) are as different as other recognized species, so they voted for two species (protection for A and E).

  This illustrates the species problem: there is no single, universally applicable definition of a species. 

  Why? Because the biological species concept relies on interbreeding, but as we see in the ring, 'interbreeds with' is not transitive. A interbreeds with B, and B with C, and so on, but A does not interbreed with E. So we can't have both: 
    - A and B are the same species (they interbreed)
    - B and C are the same species (they interbreed)
    - ... 
    - D and E are the same species (they interbreed)
  But then by transitivity, A and E should be the same, but they are not. So the BSC fails to classify them unambiguously.

  The MSC and PSC don't have this problem, but they might split a continuum into arbitrary groups.

  Which concept is right? It depends on what we care about. For conservation, we might want to protect distinct evolutionary lineages (like A and E) even if they are connected by gene flow through intermediates. For studying gene flow, we might care about the entire ring.

  In reality, ring species are rare and often break apart. But the same problem occurs in many cases: species boundaries are fuzzy. 

  So, the take-home: Species are human constructs to help us understand and organize biodiversity. The concept we choose depends on our question."

  Case File Handout:

  [Handout]

  **Case File: Green-backed Sparrow Complex**

  **Background**: The Green-backed Sparrow is found in a ring around the Central Mountains. There are five populations: A (East Coast), B (Eastern Foothills), C (Mountain Pass), D (Western Foothills), and E (West Coast). The populations form a ring: A is next to B and E (at the northern coast), B next to A and C, C next to B and D, D next to C and E, and E next to D and A. However, at the northern point, A and E are in contact but do not interbreed.

  **Data**:

  1. **Morphology**:
     - Beak size (mean in mm): 
          A: 12.0, B: 11.8, C: 11.5, D: 11.3, E: 10.5
     - Plumage color (1=dark, 10=light): 
          A: 2.0, B: 2.5, C: 3.0, D: 6.0, E: 8.0
     - Note: The typical variation within a bird species is: beak size ≤0.5 mm, plumage color ≤2.0. Differences between sister species: beak size 1.2-2.0 mm, plumage color >5.0.

  2. **Mating Behavior**:
     - Adjacent populations (A-B, B-C, C-D, D-E) interbreed in the wild and produce fertile offspring. 
     - In the contact zone between A and E (Northern Peninsula), no interbreeding occurs. They have different songs: A has a two-note song, E has a three-note song. In experiments, females of A and E do not respond to the other's song.

  3. **Genetic Divergence**:
     - Mitochondrial DNA sequence divergence (% difference):
          A-B: 0.5%
          B-C: 0.6%
          C-D: 0.7%
          D-E: 0.8%
          A-E: 4.5%
     - Note: Within bird species, divergence is usually <2%. Between sister species, it is typically 2-5%.

  **Conservation Status**:
  - Populations A and E are threatened by coastal development. Their habitats are being destroyed. Populations B, C, and D are in the mountains and are not threatened.
  - Current policy: 
     - If the entire complex is considered one species, it is widespread and not eligible for protection.
     - If A and E are two distinct species, then each is endangered (small population and range) and qualifies for protection.

  **Your Task**:
  - In your group, choose ONE criterion to base your decision on:
     1. **Reproductive Compatibility**: Are the populations able to interbreed and produce fertile offspring?
     2. **Morphological Distinctness**: Are the populations morphologically distinct beyond the threshold of within-species variation?
     3. **Genetic Divergence**: Is the genetic divergence between populations above the threshold for species distinction?

  - Then, vote for one option:
     - **Option 1**: The entire complex is one species. (No protection for A and E.)
     - **Option 2**: Populations A and E are two distinct species. (Each gets protection.)

  - Justify your vote in one sentence based on your chosen criterion.

  [End of Handout]

  This should create the desired conflict and lead to a productive debrief.
answer: |-
  ### Ring Species Taxonomy Activity: "The Crested Finch Dilemma"

  **Objective:** Students experience the species concept conflict firsthand by voting on whether a ring species complex is one species or two, using different criteria. They discover that "interbreeds with" isn't transitive and that the choice of species concept depends on purpose.

  ---

  ### **Rules for Students**
  1. **Group Formation (3-5 students/group):**  
     - Groups act as a "Conservation Taxonomy Committee."  
     - Each group must commit to **one** criterion for their vote (reproductive compatibility, morphology, or genetics). No combining criteria.  

  2. **Voting Stakes:**  
     - **Option 1 (One Species):** Entire complex is classified as *Crested finch montanus*. Loses legal protection (habitat destruction proceeds).  
     - **Option 2 (Two Species):** Eastern population (*Crested finch orientalis*) and Western population (*Crested finch occidentalis*) gain endangered status. Protects their habitats.  

  3. **Vote Requirements:**  
     - Groups must submit:  
       - Chosen criterion (written on voting card).  
       - Vote (Option 1 or 2).  
       - One-sentence justification using their criterion.  

  ---

  ### **Case File: The Crested Finch Complex**  
  *(Handout for students)*  

  **Background:**  
  The crested finch inhabits a ring of mountain valleys around the arid Serpentine Desert. Five populations form the ring:  
  - **A (East Valley)**  
  - **B (Northeast Slope)**  
  - **C (Northern Pass)**  
  - **D (Northwest Slope)**  
  - **E (West Valley)**  

  Populations interbreed where adjacent (A↔B, B↔C, C↔D, D↔E), but **A and E** (East and West) meet at the southern desert edge and **do not interbreed**.  

  **Data:**  
  1. **Reproductive Compatibility:**  
     - **A-B, B-C, C-D, D-E:** Hybridize freely; offspring fertile.  
     - **A-E:** No hybridization observed. Experiments show:  
       - A females ignore E male courtship songs (and vice versa).  
       - A and E have divergent mating seasons (A: early spring; E: late spring).  

  2. **Morphology (Key Traits):**  
     - *Crest size* (mm): A: 15.2, B: 14.8, C: 14.1, D: 12.3, E: 10.1  
     - *Plumage color* (hue score 1–10): A: 2.1, B: 2.3, C: 3.0, D: 7.2, E: 8.9  
     - **Threshold:** Differences >1.5 mm (crest) or >5.0 (plumage) indicate separate species in related birds.  
       - *A vs. E difference:* 5.1 mm (crest), 6.8 (plumage).  
       - Adjacent populations differ by ≤0.9 mm (crest) and ≤1.1 (plumage).  

  3. **Genetic Divergence (mtDNA):**  
     - **Genetic distance (%):**  
       - A-B: 0.3% | B-C: 0.4% | C-D: 0.6% | D-E: 0.7% | **A-E: 4.8%**  
     - **Threshold:** >3.0% = separate species (based on standard bird genetics).  

  **Conservation Stakes:**  
  - **A and E** are threatened by desert expansion (habitat loss imminent).  
  - **B, C, D** are stable (no threat).  
  - **Policy:** If A and E are one species with B/C/D, the complex is "non-threatened" (no protection). If A and E are two species, each qualifies as endangered (habitat protected).  

  ---

  ### **Timeline (50 Minutes Total)**  
  1. **Introduction (5 min):**  
     - Frame the activity: "You’re a conservation committee deciding the fate of the crested finch. Your vote determines if A and E get legal protection."  
     - Emphasize: **Groups must pick ONE criterion** (reproduction, morphology, or genetics) and stick to it.  

  2. **Group Work: Review & Commit (15 min):**  
     - Distribute case files. Groups:  
       - Review data (5 min).  
       - **Commit to one criterion** and draft vote + justification (10 min).  
     - *Instructor circulates:* Challenge groups that waver (e.g., "You picked morphology—ignore genetics for now!").  

  3. **Vote & Tally (5 min):**  
     - Groups submit voting cards. Tally votes on the board by criterion:  
       | Criterion          | Vote Option 1 (One Species) | Vote Option 2 (Two Species) |  
       |--------------------|-----------------------------|-----------------------------|  
       | Reproduction       |             ✓              |                             |  
       | Morphology         |                             |             ✓              |  
       | Genetics           |                             |             ✓              |  

  4. **Reveal Conflict (5 min):**  
     - Show tally. Point out:  
       - Reproduction groups voted **One Species** (adjacent interbreeding).  
       - Morphology/Genetics groups voted **Two Species** (A/E are distinct).  
     - Ask: *"Why did we get different outcomes? Did everyone see the same data?"*  

  5. **Debrief (20 min):**  
     - **Map Criteria to Species Concepts:**  
       | Group’s Criterion     | Species Concept           | Verdict          | Why?                                                                 |  
       |-----------------------|---------------------------|------------------|----------------------------------------------------------------------|  
       | Reproduction          | Biological (BSC)          | One Species      | Adjacent populations interbreed → gene flow connects the ring.       |  
       | Morphology            | Morphological (MSC)       | Two Species      | A and E exceed morphological thresholds → distinct "forms."          |  
       | Genetics              | Phylogenetic (PSC)        | Two Species      | A-E genetic distance >3% → separate evolutionary lineages.          |  

     - **Key Conflict:**  
       - BSC: "A interbreeds with B, B with C, C with D, D with E... so A *should* interbreed with E. But it doesn’t!"  
       - **Non-transitivity:** "Interbreeds with" isn’t transitive (like "friends with" – your friend’s friend isn’t necessarily yours). A and E are connected by gene flow but not directly compatible.  

     - **Deeper Point:**  
       - **No "right" answer:** The "species" you see depends on your lens:  
         - BSC: Gene flow and reproduction.  
         - MSC/PSC: Evolutionary history and divergence.  
       - **Purpose matters:**  
         - Conservation? Protect unique lineages (PSC/MSC).  
         - Ecology? Study gene flow (BSC).  

     - **Real-World Context:**  
       - Ring species (like herring gulls) expose how "species" are human constructs for organizing nature.  
       - **Limitation:** In reality, species concepts often *overlap* (e.g., genetic + morphology). This activity isolates criteria to show conflict.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem:** Groups combine criteria or refuse to commit.  
     - **Solution:** Enforce "one criterion" rule strictly. Ask: "Which lens are you using *first*?"  

  2. **Problem:** Students argue intermediates (B, C, D) should be protected.  
     - **Solution:** Redirect: "The policy only protects A/E if they’re split. Intermediates aren’t threatened—focus on A and E."  

  3. **Problem:** Confusion about why A and E are "two species" but intermediates exist.  
     - **Solution:** In debrief, clarify: "Ring species are a continuum. We’re forcing a binary choice to expose the conflict."  

  ---

  ### **What the Activity Can’t Reproduce (Instructor Must Supply)**  
  - **Dynamic Nature of Ring Species:**  
    - Rings are unstable "snapshots." In time, they often fragment into multiple species. This activity freezes the system to highlight the conceptual conflict but omits evolutionary dynamics.  
    - *Add in debrief:* "In nature, A and E may become fully isolated species, but today we’re examining the *process* of how we define them mid-journey."  

  - **Hybrid Zone Complexity:**  
    - Real ring species have messy hybrid zones (e.g., variable fitness in intermediates). This case file simplifies to "fertile hybrids" between adjacents.  
    - *Add in debrief:* "In reality, gene flow might be reduced in some intermediates, adding more ambiguity."  

  ---

  **Instructor Notes:**  
  - **Materials:** Voting cards, case file handouts, whiteboard for tally.  
  - **Tip:** Pre-assign criteria if groups stall (e.g., "Group 1: Genetics, Group 2: Morphology...").  
  - **Final Takeaway:** "Species boundaries are fuzzy because evolution is a gradient. The 'right' concept depends on what question you’re asking!"
