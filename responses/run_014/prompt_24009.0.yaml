  First, I need to unpack their thesis: they argue that Maimonides' instrumentalist view of sacrifice (as a weaning tool from idolatry) is central to the entire Guide, not just a side note. They also propose that this approach persists into the messianic age because human cognition doesn't radically change, even if conditions improve. 

