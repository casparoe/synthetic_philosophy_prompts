answer: |-
  ### Gricean Pragmatics Translated into Literary Craft Vocabulary  
  *(With rigorous fidelity to your domain)*  

  **Core Translation:**  
  1. **Cooperative Principle → Subtextual Contract**  
     Characters (like real speakers) operate under an unspoken pact: dialogue should advance the scene’s dramatic purpose. When a character speaks, they tacitly agree to make their contributions *narratively functional*—revealing motive, escalating conflict, or deepening theme—even when lying or evading.  

  2. **Maxims & Flouting → Subtext Engineering**  
     - **Quantity (Informativeness)**  
       *Craft Equivalent:* **Strategic Omission (Iceberg Technique)**  
       Flouting = Withholding key details to provoke reader inference.  
       *Example:* A character says *"Fine."* when asked about their divorce. The omission *shows* emotional devastation without *telling*.  

     - **Quality (Truthfulness)**  
       *Craft Equivalent:* **Unreliable Narration/Dramatic Irony**  
       Flouting = A character lies or the narrator distorts, signaling gap between stated and actual truth.  
       *Example:* "Of course I trust you," she said, tightening her grip on the knife. The gesture *shows* deceit the words deny.  

     - **Relation (Relevance)**  
       *Craft Equivalent:* **Dramatic Irony via Contextual Misalignment**  
       Flouting = A character’s irrelevant remark highlights what they *avoid* addressing.  
       *Example:* In a funeral scene: "Lovely weather today." The mismatch *shows* grief too paralyzing to acknowledge death.  

     - **Manner (Clarity)**  
       *Craft Equivalent:* **Register/Idiolect as Characterization**  
       Flouting = Obfuscation through jargon, euphemism, or fragmented syntax to *show* evasion, anxiety, or social positioning.  
       *Example:* A politician’s convoluted non-answer: "It’s a fluid paradigm of stakeholder reengagement." → *Shows* cowardice.  

  3. **Implicature → Subtextual Payload**  
     *Speaker Meaning* = What the character *truly communicates* (intentionally or not) through gaps between literal utterance and context.  
     *Craft Mechanism:* **Attribution + Contextual Pressure**  
     - *"She said"* → Neutral; reader infers meaning from scene.  
     - *"She said, staring at the locked door"* → Action implies suspicion.  
     - *"She lied"* → Narrator directs interpretation, overriding utterance.  

  4. **Exploitation vs. Flouting → Authorial Control of Inference**  
     - *Exploitation*: Character deliberately manipulates maxims to mislead (in-universe deceit).  
     - *Flouting*: Author makes character violate maxims to guide *reader* inference (metaliterary signal).  

  ---

  ### Residue Report: Mapping Fidelity & Gaps  
  **Clean Mappings (Direct Equivalents):**  
  | Gricean Concept          | Literary Craft Equivalent          |  
  |--------------------------|------------------------------------|  
  | Conversational Implicature | Subtext                            |  
  | Flouting Maxims          | "Showing" via omission/mismatch    |  
  | Speaker Meaning          | Character's true intent (via context) |  
  | Cooperative Principle    | Dialogue’s narrative purpose       |  

  **Stretched Mappings (Partial Overlaps):**  
  1. **Grice’s "Rational Cooperation"**  
     - *Stretch:* Translated as *dramatic purpose*, but Grice assumes good-faith communication. Fiction *relies* on bad faith (deceit, self-deception).  
     - *Why It Fits Anyway:* Even deceit "cooperates" narratively—it advances plot/theme. The "contract" is with the *reader*, not between characters.  

  2. **Generalized vs. Particularized Implicature**  
     - *Stretch:* Grice’s "generalized" (context-free inferences) map to archetypal subtext (e.g., "I’m fine" always implies distress). But literary subtext is hyper-contextual.  
     - *Why It Fits:* Archetypal implicatures exist ("Nice weather" at a funeral), but craft nuances them through specific characterizations.  

  **Unmapped Gricean Elements (Residue):**  
  1. **The Presumption of Truth-Seeking**  
     - Grice assumes speakers *intend* to communicate truthfully. Fiction thrives on *unintended* subtext (e.g., a character revealing trauma through verbal tics).  
     - *Craft Supersedes This:* Interiority and free indirect discourse expose gaps between intent and implication. Grice has no equivalent for *unconscious* revelation.  

  2. **Non-Conversational Implicature**  
     - Grice focuses on dialogue. He ignores narration, description, or metaphorical language as "implicature" sources.  
     - *Craft Handles This:* Unreliable narration or symbolic imagery (e.g., a storm during an argument) generates implicature beyond speech acts.  

  3. **The Role of Power Dynamics**  
     - Grice’s model treats speakers as equals. Craft explicitly weaponizes implicature in power imbalances (e.g., passive-aggression in hierarchies).  
     - *Example:* A servant’s excessively polite dialogue implicating fear → Craft analyzes this through *register* and *context*; Grice overlooks sociolinguistic coercion.  

  ---

  ### Critical Gaps: What Grice Misses That Craft Captures  
  1. **The Author-Reader Channel**  
     Grice analyzes speaker-listener dynamics. Craft adds a *second layer*: the author embedding implicature for the reader, separate from character intent.  
     - *Example:* Dramatic irony (character says X, reader knows Y) exploits Gricean flouting *metaliterarily*. Grice’s framework can’t describe this triangulation.  

  2. **The Unreliable Narrator as Maxims Saboteur**  
     When a narrator *chronically* violates Quality/Quantity, Grice’s "cooperation" breaks. Craft frames this as *aesthetic strategy* (e.g., Humbert Humbert’s manipulations).  
     - *Residue Insight:* Grice assumes maxim violations are exceptions. For unreliable narrators, violation *is* the rule.  

  3. **Interiority as Anti-Implicature**  
     Free indirect discourse ("Of course he trusted her. Absolutely.") can *explicitize* implicature Grice would leave inferred. Craft controls revelation speed; Grice focuses on inference generation.  

  ---

  ### Conclusion: Grice as Subtext’s Grammar, Craft as Its Art  
  Grice provides a *descriptive framework* for how implications arise from utterance-context gaps. Your craft vocabulary *deploys* these gaps with surgical intentionality. The residue arises because:  
  - **Grice is speaker-centric;** craft is *author, character, and reader*-centric.  
  - **Grice assumes cooperation;** craft *weaponizes* non-cooperation.  
  - **Grice analyzes isolated utterances;** craft choreographs implicature across narrative arcs.  

  **Final Insight:** Grice’s "limitation" in handling unreliability/irony isn’t a flaw—it’s a boundary. His framework explains *how* subtext works in a line; your craft explains *why* it resonates in the whole. Where Grice stops at "this implies deceit," craft asks, "How does this deceit *transform* the character, reader, and story?" That’s where philosophy yields to art.  

  Would you like extended examples dissecting a dialogue passage through both frameworks?
