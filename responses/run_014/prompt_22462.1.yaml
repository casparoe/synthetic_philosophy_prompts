  Better structure this carefully: first show why Chamberlain depends on initial justice, then explain how the proviso sabotages that foundation. The moral residue point can come after as a contrast. Should use concrete examples - like Chamberlain's fans being worse off after his monopoly, or how baseline compensation gets murky with things like pollution. 

