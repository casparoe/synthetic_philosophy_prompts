  The memorial scenario is perfect. For covering-law, I'll show how clinical it feels: reducing a person's death to statistical probabilities and abstract factors. The language should be detached, passive, with medical/sociological jargon. It should read like an autopsy report. 

  For narrative, I need to build a living portrait - sensory details, personal quirks, the specific texture of a life. The "plot" isn't just events but how they cohere into identity. The library scene with the student will be pivotal - showing how he shaped others. 

  Crucially, the historian protagonist should embody the tension. When she writes the covering-law section, she feels it's "wrong" but can't articulate why until she shifts to narrative. The reader should feel that discomfort too - how the scientific explanation erases the person even when factually accurate. 

  Biggest risk is making the contrast too didactic. Must resist explaining the theory - let the memorial drafts' tones do the work. The covering-law part should be technically flawless but hollow; the narrative messy but alive. Ending on her throwing away the first draft symbolizes rejecting that framework for human stories. 

  ...And avoid White/Hempel name-drops. The theories must emerge from the writing's texture. If I do this right, the PhD student will viscerally feel why narrative explanation isn't just "storytelling" but essential to historical understanding of singular lives.
