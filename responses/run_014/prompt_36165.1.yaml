answer: |-
  Your defense counsel stands at the crucible of legal philosophy, where abstract principles collide with unprecedented evil and raw power. Here’s a layered analysis, respecting the complexity you seek:

  ### I. Victor’s Justice: Theory Applied to Nuremberg/Tokyo
  **Where the Theory Fits:**
  1.  **Structural Asymmetry:** The *exclusive* prosecution of Axis leaders by the victors is the core evidence. No Allied leader faced scrutiny for strategic bombing (Dresden, Tokyo firebombing, Hiroshima/Nagasaki) or Soviet atrocities (Katyn, mass deportations). Tokyo amplifies this with Judge Pal’s dissent explicitly condemning victor’s justice.
  2.  **Ex Post Facto Charges:** Crimes Against Peace (aggressive war) *was* legally novel for *individual* responsibility. While Kellogg-Briand (1928) outlawed war *between states*, pinning criminal liability on individuals was unprecedented. Crimes Against Humanity (especially peacetime persecution) also lacked clear precedent for *international* prosecution.
  3.  **Tu Quoque Rejection:** The Tribunal’s rigid exclusion of "you did it too" arguments (e.g., unrestricted submarine warfare by the US, Soviet aggression in Poland) is central to the victor’s justice critique. It denied defendants legal symmetry.
  4.  **Creation by Fiat:** The London Charter *was* drafted unilaterally by the victors. Defendants were judged under rules written specifically to prosecute them after the fact.

  **Where the Theory Overreaches or is Blind:**
  1.  **Procedural Substance:** The trials offered robust *procedural* fairness by the standards of the time (and arguably beyond):
      *   Indictments with specific charges.
      *   Right to counsel (including German lawyers).
      *   Cross-examination of prosecution witnesses.
      *   Presentation of defense evidence/witnesses (logistical difficulties notwithstanding).
      *   Public proceedings.
      *   Lengthy, detailed judgments explaining verdicts.
  2.  **Partial Acquittals & Count Dismissals:** Schacht, von Papen, and Fritzsche acquitted entirely at Nuremberg; many others acquitted on specific counts (e.g., conspiracy to wage aggressive war). Tokyo saw acquittals on some charges. This demonstrates legal adjudication, not predetermined vengeance.
  3.  **Defense Successes:** Defense counsel *did* win significant legal arguments:
      *   Limiting the scope of "conspiracy" charges.
      *   Excluding certain types of evidence (e.g., affidavits lacking cross-examination, though inconsistently applied).
      *   Obtaining acquittals/dismissals (see above).
  4.  **Core War Crimes:** Traditional violations of the Hague/Geneva Conventions (murder/mistreatment of POWs, civilians in occupied territory) *were* clearly established law pre-1945. The victor's justice lens struggles to taint these convictions.
  5.  **The Moral Imperative:** The theory struggles to account for the *catastrophic scale and nature* of the crimes. The alternative—summary executions or no justice—felt morally and historically untenable. The trials *created* a process where none existed.

  **Where the Theory is Silent:**
  *   The internal psychological struggle of the *prosecutors and judges* to reconcile their roles with victor's justice concerns.
  *   The impact of *documenting atrocities* systematically – a process driven by law, even flawed law.
  *   The potential *future deterrent effect* the trials aimed to establish, regardless of origins.

  ### II. The Trials & Retroactive Law: Episode Testing Theory
  **Challenging the Strict View (No Ex Post Facto Law):**
  1.  **The "No Law or Retroactive Law" Dilemma:** Nuremberg exposed a gaping hole in the strict view: What do you do when faced with acts of such monstrous novelty and scale that *no existing law* anticipates them? Strict positivism offers no answer beyond impunity. Nuremberg argues that fundamental morality *can* be the basis for new law, even retrospectively applied, when confronting unprecedented evil.
  2.  **"Recorded, Not Created" - Where it Holds Water:**
      *   **War Crimes:** Easily applied. Prohibitions against murdering POWs, plunder, etc., were treaty law.
      *   **Crimes Against Humanity (in connection with war):** Could be seen as an extension of existing prohibitions against atrocities in occupied territory and the laws of war protecting civilians, pushed to their logical extreme by the Holocaust.
  3.  **"Recorded, Not Created" - Where it Falters:**
      *   **Crimes Against Peace (Individual Liability):** Kellogg-Briand bound *states*, not *individuals*. The leap to criminalizing heads of state and military planners was genuinely new. The Tribunal's reliance on "common sense" morality here strained legal formalism.
      *   **Crimes Against Humanity (Pre-War/Isolated Acts):** The Charter limited these to acts "in execution of or in connection with" war crimes or crimes against peace. Truly *peacetime* persecution lacked clear international precedent for criminal liability before Nuremberg.

  **Nuremberg's Legacy for Retroactivity Theory:**
  *   It revealed the **insufficiency of strict positivism** in the face of systemic, industrialized evil. Law must sometimes evolve to confront new horrors.
  *   It established that **"manifest illegality" matters.** Acts so profoundly shocking to the conscience *should* be punishable, even if the specific legal pathway didn't exist.
  *   It created a **dangerous precedent.** The victor's justice taint and ex post facto elements remain potent criticisms, highlighting the risk of retroactivity being abused for political ends. Tokyo's dissent underscores this.

  ### III. Your Defense Counsel's Interiority: The "In-Between"
  He **cannot** experience it purely as "fair trial" or purely as "power's costume." The "in-between" is the only plausible, honest space. Here's its texture:

  1.  **A Lawyer's Resolve Amidst Tainted Foundations:** He believes fiercely in the *principle* of defense, the *process* itself, as the necessary counterpoint to vengeance. He throws himself into **crafting rigorous legal arguments** (challenging evidence, jurisdictional overreach, specific intent requirements) because *this is the law available to him*, and testing its limits is his duty. Winning a point on evidence exclusion or securing an acquittal on *one* count feels like a genuine, hard-won **victory for the principle of due process**.
  2.  **Constant Friction Against Asymmetry:** Every time a tu quoque argument is shut down ("The Tribunal does not find it relevant that the Allies..."), he feels the sting of **procedural unfairness**. When he sees defendants who were mid-level functionaries while Allied leaders responsible for mass civilian deaths sit in judgment, he grapples with **profound moral dissonance**. The shadow of victor's justice is *inescapable*.
  3.  **Nuanced View of Legality:** He likely sees a **spectrum within the charges**:
      *   *War Crimes:* Defensible under established law. Defending these feels like traditional lawyering against potentially exaggerated or misattributed acts.
      *   *Crimes Against Humanity:* Legally shaky pre-war, morally undeniable. Defending requires arguing intent, scale, or chain of command – a grim task amidst the horror, but one where legal arguments (like retroactivity) have bite.
      *   *Crimes Against Peace:* Feels most like ex post facto law. His arguments here might carry an undertone of "This isn't fair law," even as he makes them rigorously.
  4.  **The Crushing Weight of the Alternative:** He knows the alternative – summary execution or no trial – is worse. He sees the **value in the record**, in forcing the regime's crimes into the light through a legal process, however imperfect. This provides a **fragile moral justification** for participating, even while condemning aspects of the framework.
  5.  **Profession as Refuge:** The **mechanics of lawyering** – drafting motions, examining witnesses, parsing testimony – become a refuge. Focusing on the **technical aspects** (Is this affidavit admissible? Did the prosecution prove *this* element for *this* defendant?) allows temporary escape from the overwhelming moral and political context. Here, he *can* feel like a lawyer practicing his craft.
  6.  **Existential Dissonance:** The core feeling is **profound cognitive and moral dissonance**. He is simultaneously:
      *   Upholding the rule of law *against* tyranny.
      *   Participating in a process tainted by the victor's power.
      *   Defending men whose actions he likely finds abhorrent.
      *   Seeking justice through a system whose creation was arguably unjust.
      *   Finding moments of genuine legal principle amidst structural unfairness.

  **The Feeling:** It's practicing law on a precipice. It's a constant, low-grade hum of unease punctuated by spikes of professional satisfaction (a point won) and profound despair (the overwhelming evidence, the inherent asymmetry). It's a commitment to **form over absolute purity of origin**, believing the form itself – adversarial testing, evidence rules, reasoned judgment – is the last, best barrier against chaos, even when wielded by flawed hands under a contested law. It’s exhausting, morally draining, yet driven by a conviction that *someone must do this*, that abandoning the forms entirely leads somewhere worse. He feels the costume's seams but believes in the necessity of wearing it.

  **Conclusion:** There is no single answer, only the tension. Your character can *moments* feel like he's participating in a genuine, albeit imperfect, legal process when he wins a procedural point or forces the prosecution to prove its case. He will *constantly* feel the weight of victor's justice in the tribunal's structure and the retroactive charges. His experience is defined by this unresolvable friction – the lawyer's commitment to form wrestling with the philosopher's critique of substance. **That friction is your sentence.** Capture the exhaustion, the professional pride in a well-made argument, the bitterness at a rejected tu quoque, the grim satisfaction of forcing the process to follow *some* rules, and the haunting knowledge of the scaffold waiting outside the courtroom door. The dishonesty would lie in resolving the tension; the honesty lies in its sustained, agonizing presence.
