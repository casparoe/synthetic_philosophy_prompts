prompt: |-
  I'm building a reading list on populism and I keep hitting the same wall: everyone invokes "the will of the people" as if it's a thing you can point at, but I can't tell what a theory of it would actually have to deliver. So before I read more populism, can you write the desiderata? I want the full spec of what an adequate theory of the will of the people has to be able to do. Fix the purpose first -- I'll say its good enough for me to decide, case by case, when a populist's claim that "the people have spoken" is actually true rather than a rhetorical move. Give me the requirements list: the cases it has to get right (a law passed by a 51% majority on a procedural technicality, a referendum where most of the electorate stayed home, a "will" that flips between two referendums a year apart), the distinctions it can't collapse (will vs. interest, the peoples will vs. the sum of each person's will, a temporary mood vs. something that binds over time), and the results from social choice theory it has to sit with (Condorcet's cycle, Arrow's theorem) -- and for each requirement, the case or consideration that makes it a requirement and not just a preference of one camp. Then tell me which of the things people usually demand of these theories are genuine desiderata and which are just a camp's prejudice, flag any pair you suspect can't be jointly satisfied, and take a definite line: which single requirement knocks out the most popular theories, and is there a subset of the list that's jointly unsatisfiable -- if so, that's the result I most want to see, don't just lay out the options. A table is fine. Then, briefly, how Rousseau's general will, Schumpeter's view of democracy as competition for office, and a plain preference-aggregation theory do against the list -- keep it short, the criteria are the point.
reasoning: |-
  Okay, the user is building a reading list on populism and keeps encountering the problem of defining "the will of the people." They want a clear set of requirements for a theory that can determine when a populist's claim is valid versus just rhetoric. This is a complex philosophical and political science question that requires careful unpacking.

  The user seems frustrated with vague invocations of "the people's will" in populist discourse. They want analytical rigor - specifically desiderata that can objectively evaluate claims about popular sovereignty. Their request shows they understand the conceptual minefield (social choice theory paradoxes, interest vs will distinctions, temporal instability of preferences) but want it systematized.

  I need to approach this methodically. First, the core function: evaluating specific claims about "the people have spoken" in real cases. The requirements should cover empirical detection (is this really the people's will?), normative validity (should it bind?), and conceptual clarity (what distinguishes it from other concepts?).

  Key cases to address:
  - Thin majorities (51% procedural win)
  - Low-turnout referendums
  - Fluctuating referendum outcomes
  These test robustness, legitimacy, and stability.

  Critical distinctions:
  - Will vs interest (what people want vs what benefits them)
  - Aggregate vs collective will (sum of preferences vs emergent group view)
  - Transient mood vs binding decision
  These prevent conceptual slippage.

  Social choice constraints:
  - Arrow's theorem (no perfect voting system)
  - Condorcet cycles (preference inconsistencies)
  These force humility about democratic measurement.

  Now for pitfalls: Some common demands are actually partisan. For example, insisting the will must align with progressive values isn't a neutral requirement but a liberal bias. Or populists might demand the will is always unambiguous - which ignores Arrow. Need to flag these.

  Biggest tension: Requirement 1 (detectability) vs Requirement 9 (stability). Empirical measurement requires concrete expressions (votes, polls), but these fluctuate, while stability implies something constant - creating a paradox. Most theories sacrifice one for the other.

  For existing theories:
  - Rousseau's general will fails detectability (it's hypothetical)
  - Schumpeter rejects the concept entirely (just electoral competition)
  - Aggregation theories flunk stability (preferences change)

  The user wants definitive conclusions, not just options. So I'll emphasize that stability+detectability is the killer combo that eliminates most theories. And the will vs interest distinction is where normative biases creep in - which they wanted exposed.

  This frames their reading list perfectly: They'll see which authors confront these constraints head-on versus handwave them.
answer: |-
  Here's the full specification for an adequate theory of "the will of the people" (WoP), designed to evaluate populist claims. The core purpose is **enabling case-by-case adjudication of whether a claim that "the people have spoken" is empirically/legitimately true or merely rhetorical**. Requirements are derived from real-world democratic dilemmas, not normative preferences.

  ---

  ### **Desiderata for an Adequate Theory of "The Will of the People"**
  | # | Requirement                                    | Why It's Necessary (Real-World Case/Problem)                                                                 | Avoids Collapsing...                              |
  |---|-----------------------------------------------|-------------------------------------------------------------------------------------------------------------|--------------------------------------------------|
  | **1** | **Detectability**                             | Must identify *how* WoP is measured (e.g., referendum, election, protest). Case: Brexit referendum (52%) vs. a 51% legislative vote on obscure procedural rules. | Measurement method ≠ legitimacy. |
  | **2** | **Threshold Legitimacy**                      | Must distinguish legitimate mandates from unrepresentative outcomes. Case: Referendum with 30% turnout where 51% of voters support a policy. | Low participation ≠ "silent majority". |
  | **3** | **Temporal Stability**                        | Must address whether WoP can change abruptly. Case: Ireland's abortion referendums (1983 ban vs. 2018 repeal). | Temporary mood ≠ enduring will. |
  | **4** | **Distinguish Will vs. Interest**             | WoP must not be reducible to objective interests. Case: Poor voters supporting tax cuts for the wealthy based on cultural appeals. | Paternalism ("we know better") ≠ democracy. |
  | **5** | **Aggregate vs. Collective Will**             | Must clarify if WoP is the sum of individual wills or an emergent collective view. Case: A 60% majority imposing policies harmful to a minority. | Tyranny of the majority ≠ general will. |
  | **6** | **Binding Force**                             | Must specify when WoP creates obligations (e.g., for future governments). Case: A landslide mandate for healthcare reform vs. a narrow win on a minor issue. | Campaign promise ≠ perpetual mandate. |
  | **7** | **Respect Social Choice Constraints**         | Must acknowledge Arrow's Theorem (no perfect aggregation) and Condorcet cycles. Case: A 3-way split vote producing a "winner" opposed by 65%. | Mathematical impossibility ≠ "betrayal of the people". |
  | **8** | **Inclusiveness**                             | Must define "the people" (e.g., citizens, residents, voters). Case: Non-citizen residents or disenfranchised groups excluded from "the people". | Demos ≠ ethnos. |
  | **9** | **Robustness to Manipulation**                | Must flag when WoP is manufactured (e.g., via gerrymandering, misinformation). Case: A referendum won through targeted disinformation campaigns. | Manufactured consent ≠ authentic will. |

  ---

  ### **Critical Analysis**
  1. **Genuine Desiderata vs. Partisan Prejudices**:
     - **Genuine**: Requirements 1, 2, 3, 6, 7, 8, 9 (rooted in empirical/logical problems).
     - **Partisan**: 
       - *"WoP must align with liberal values"* (normative bias).
       - *"WoP is always unified and unambiguous"* (ignores pluralism and social choice).

  2. **Impossible Pairs**:
     - **Temporal Stability (#3) + Detectability (#1)**: If WoP is stable, how do we detect it via volatile expressions (e.g., elections)? If it’s detectable only via snapshots, how can it be stable?  
     - **Aggregate vs. Collective Will (#5) + Social Choice Constraints (#7)**: If WoP is an aggregate, Arrow’s Theorem makes it incoherent; if collective, how is it measured?  
     *→ These tensions are why most theories fail.*

  3. **Most Damaging Requirement**:
     - **#7 (Social Choice Constraints)**. Arrow’s Theorem proves *no voting system* can reliably translate individual preferences into a coherent "will" without violating basic fairness rules. This alone dismantles theories treating WoP as a straightforward aggregation of preferences.

  4. **Jointly Unsatisfiable Subset**:
     - **{#1 (Detectability), #3 (Stability), #7 (Social Choice)}**.  
       You *cannot* have a WoP that is:  
       (a) Empirically measurable (via votes/polls),  
       (b) Stable over time, *and*  
       (c) Mathematically coherent (per Arrow/Condorcet).  
       → **This triad is logically impossible.** Any theory claiming otherwise is either ignorant or dishonest.

  ---

  ### **Evaluation of Existing Theories**
  | Theory                     | Key Failure(s) Against Requirements                          | Verdict                               |
  |----------------------------|-------------------------------------------------------------|---------------------------------------|
  | **Rousseau's General Will** | Fails #1 (undetectable – requires "omniscient observer"), #7 (ignores aggregation problems), #9 (assumes no manipulation). | Mystical ideal; useless for adjudication. |
  | **Schumpeterian Competition** | Rejects WoP entirely (#1, #2, #3, #6 irrelevant). Democracy = elite competition for votes. | Dodges the problem; populism’s antithesis. |
  | **Preference Aggregation** | Fails #3 (volatile), #4 (ignores will/interest gap), #5 (reduces to sum), #7 (Arrow’s Theorem). | Naïve; collapses under real-world cases. |

  ---

  ### **Conclusion**
  Your core insight is correct: **no theory satisfies all desiderata because key requirements (Detectability + Stability + Social Choice Coherence) are jointly unsatisfiable**. Populists exploit this by selectively invoking requirements that suit their claim (#1 for narrow wins, #3 for ignoring reversals, #5 for masking minority suppression). The most defensible approach is a **minimalist threshold view**: WoP exists *only* when a supermajority (e.g., >60%) of a broadly inclusive electorate approves a clear proposal under verified conditions, acknowledging its temporal limits. Anything weaker is rhetoric.  

  **Next Readings**: Focus on theorists grappling with these limits:  
  - William Riker (*Liberalism Against Populism*) on social choice vs. populism.  
  - Nadia Urbinati (*Democracy Disfigured*) on populism’s rhetorical abuse of "the people".  
  - Ian Shapiro’s (*The State of Democratic Theory*) pragmatic thresholds.  
  Avoid theorists who ignore Arrow (e.g., classic populists) or dismiss WoP entirely (e.g., Schmittians).
