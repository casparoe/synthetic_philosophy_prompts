  The tension I see is between Burkean caution (don't tear down without understanding hidden purposes) vs. the real fiscal/technological pressures. The user's skepticism about "standing veto on reform" is key here. I should examine how nationalization itself - an earlier reform - complicates Burkean deference to inheritance.

