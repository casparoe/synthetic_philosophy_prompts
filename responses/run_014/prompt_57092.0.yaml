answer: |-
  Below is a reasoned analysis of your historical junctures, followed by the requested structured outputs.

  ### Analysis
  Your cases reveal three necessary conditions for a "hinge-of-history" pivot:  
  1. **Irreversible Ratchet**: The change must permanently alter the state space of human possibility (physical, epistemic, or institutional), making prior states inaccessible.  
  2. **Non-Substitutability**: The *specific irreversible effect* could not have been replicated by later actors or alternative paths. Substitutability of the *event* (e.g., "someone else would have done it") is irrelevant if the irreversible effect is unique to its timing or agent.  
  3. **Ceiling Shift**: It must alter the *attainable best long-run future*, not merely accelerate or smooth progress toward an unchanged ceiling.  

  Conflicts resolve via **ordering**:  
  - **Irreversibility dominates**. If an effect is truly irreversible (e.g., extinction of knowledge systems), substitutability arguments fail because later actors cannot access what was lost.  
  - **Ceiling shift filters recoverable events**. If the ceiling is unchanged (e.g., post-catastrophe recovery to prior trajectory), it fails.  

  **Clauses derived from your cases**:  
  - **C1 (Irreversible Ratchet)**: *Driven by Case 3 (Americas' collapse)*. Permanent loss of unique knowledge/pathways cannot be undone. Without this, Case 6 (Black Death) would be misjudged as pivotal.  
  - **C2 (Non-Substitutability of Effect)**: *Driven by Case 2 (nuclear weapons)*. The irreversible effect (weaponizing physics) was non-substitutable *in its timing*: being first created a unique geopolitical reality (e.g., US hegemony, arms race dynamics). Later programs would not have identical effects. Without this, Case 8 (Meiji) would be misjudged as pivotal.  
  - **C3 (Ceiling Shift)**: *Driven by Case 5 (Montreal Protocol)*. It averted a permanently degraded ceiling (biosphere collapse), not just delayed progress. Without this, Case 7 (Cuban Missile Crisis) would be misjudged as pivotal.  

  **Unsalvageable verdict**: Case 4 (smallpox eradication) fails C3. While irreversible, it subtracts a hazard without altering humanity’s ceiling (other diseases/pandemics fill the "niche"). It accelerates progress toward an unchanged ceiling (disease-free world).  

  **Printing press (Case 10)**: Not pivotal. Satisfies C1 (knowledge diffusion ratchet) but fails C2 and C3. Movable type was substitutable (block printing, lithography could achieve mass literacy within decades) and accelerated—not created—the ceiling (scientific/religious revolutions were emerging via universities and sermons).  

  ### Prospective Junctures  
  - **Single-lab frontier AI**: Pivotal (C1, C2, C3). Irreversible deployment by one actor creates path-dependent risks/benefits; different timing/agent alters outcomes (e.g., unilateral control vs. race).  
  - **Open-weight release**: Not pivotal (fails C2, C3). Accelerates access but doesn’t irreversibly shift ceiling (capabilities would emerge via other labs).  
  - **Genome editing agreement**: Pivotal only if *binding and irreversible* (C1, C3). A durable ban alters humanity’s evolutionary ceiling; weak agreements fail.  
  *Design sensitivity*: Genome editing verdict flips if agreement lacks enforcement (e.g., no verification).  

  **Hinge-of-history today**: The principle implies *potential* pivots (AI, biotech) but requires evidence of **actual irreversible choices being locked in** (e.g., uncontrolled AI deployment, ratified treaties). Against: substitutable actors (e.g., multiple labs near AI breakthroughs).  

