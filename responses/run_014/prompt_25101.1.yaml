answer: |-
  Your observation taps into a rich and complex area of moral philosophy, primarily centered on the concepts of **moral standing**, **hypocrisy**, and the **tu quoque fallacy**. There is indeed established literature that maps this territory, with several competing frameworks. Here's a breakdown:

  ### Core Concepts & Frameworks
  1.  **Standing to Blame (or Rebuke):**
      *   **The Core Idea:** Moral criticism isn't just about stating a true proposition ("X is wrong"). It involves a normative *act* – blaming, rebuking, or holding accountable. Philosophers argue that performing this act effectively requires the critic to have the appropriate *standing* or *authority*.
      *   **What is Lost?** When standing is undermined, the critic loses the *moral authority* or *right* to perform the specific act of blaming *in this context*, even if the underlying moral judgment *about the target's action* is correct. The criticism becomes "idle" or ineffective as an act of blame, though its propositional content remains true.
      *   **Key Theorists:** R. Jay Wallace ("Hypocrisy, Moral Address, and the Equal Standing of Persons"), Gary Watson ("Standing in Judgment"), Pamela Hieronymi ("Articulating an Uncompromising Forgiveness"), Macalester Bell ("Standing to Blame: A Critique").

  2.  **Hypocrisy:**
      *   **The Core Problem:** Hypocrisy involves a lack of alignment between one's expressed moral commitments and one's own actions. This misalignment can undermine the force of the criticism.
      *   **Why it Matters:** Hypocrisy can signal insincerity, unfairness (holding others to standards you flout), or a failure of self-knowledge. It can make the criticism seem like an exercise in power, superiority, or bad faith rather than a genuine moral appeal.
      *   **Distinction:** Crucially, philosophers distinguish *being a hypocrite* (a character flaw) from *losing standing to blame in a specific instance* (a relational normative status). One can be a hypocrite in general but still have standing to blame in a particular case where they aren't implicated (e.g., a thief condemning murder).

  3.  **Tu Quoque ("You Also"):**
      *   **The Fallacy:** This is the classic "ad hominem" fallacy where one rejects a claim *solely* because the claimant is guilty of inconsistency or hypocrisy. It's fallacious because the *truth* of the criticism about the *target's* action is logically independent of the critic's flaws. "You did it too" doesn't make "what I did is wrong" false.
      *   **The Legitimate Move:** However, pointing out hypocrisy or lack of standing isn't *always* fallacious. It becomes legitimate when it successfully challenges the *critic's authority to perform the act of blaming in this specific context*, rather than denying the truth of the underlying moral proposition. The target is saying, "Even if what I did was wrong, *you* are not the right person to blame *me* for it right now."

  ### Principles Sorting Legitimate vs. Illegitimate Deflections
  The key principle differentiating legitimate challenges to standing from illegitimate *tu quoque* fallacies is **relevance and connection to the specific blame act**. Here's how philosophers analyze it:

  1.  **Symmetry or Shared Complicity (The Strong Case for Lost Standing):**
      *   **When Legitimate:** The critic is *currently implicated* in the *very same* type of wrongdoing they are condemning *in the target*, or their blame *specifically relies* on a principle they are simultaneously violating *in a relevantly similar way*.
      *   **Why:** The critic lacks the moral high ground. Blaming the target while engaging in the same conduct creates unfairness and undermines the reciprocal nature of moral norms. It suggests the critic doesn't *sincerely* hold the norm they invoke, at least not universally.
      *   **Example:** A politician *currently* taking bribes condemning another politician for taking bribes. Their standing is severely undermined. (Bell, Wallace).

  2.  **Benefit from the Wrong (Complicity & Dirty Hands):**
      *   **When Legitimate:** The critic is *actively benefiting* from the *ongoing* practice or system that produces the specific wrong they are condemning *and* they have a realistic alternative to avoid benefiting or actively oppose it. Their criticism, while potentially true, rings hollow because they are part of the problem.
      *   **Why:** Their position involves complicity. Blaming the target without acknowledging or addressing their own role in sustaining the harmful system appears disingenuous and avoids their own responsibility. It shifts blame entirely.
      *   **Example (Hard Case):** Someone living comfortably in the Global North, benefiting from cheap goods produced by exploitative labor in the Global South, harshly condemning *only* the factory owner *without* acknowledging their own consumer complicity or advocating for systemic change. Their standing to blame *the factory owner alone* might be weakened, though their standing to criticize the *system* or even the owner *while acknowledging their own role* might remain. (Discussed in context of structural injustice, e.g., Iris Marion Young).

  3.  **Past Transgressions (Relevance & Reform):**
      *   **When Legitimate (Weakens Standing):** If the critic's past transgression is *identical* (or highly relevantly similar) to the one they are condemning *and* they have *not* demonstrated genuine reform or reckoning (apology, restitution, changed behavior). The criticism seems hypocritical.
      *   **When Legitimate (Strengthens Standing):** If the critic has genuinely repented, taken responsibility, and reformed ("the repentant sinner"). Their past wrong can actually *strengthen* their standing, as they speak from experience and demonstrate the possibility of change. Their criticism embodies the norm they now uphold.
      *   **When Illegitimate (Tu Quoque):** If the past transgression is *unrelated* or minimally relevant ("You criticize my dishonesty? But you jaywalked last week!"). This is pure deflection.
      *   **Why:** Standing depends on the critic's current relationship to the norm they invoke and the relevance of their past to the specific present blame act. (Hieronymi on forgiveness and standing; Todd on repentance).

  4.  **Acknowledgment and Sincerity:**
      *   A critic who acknowledges their own past failings, current complicities, or benefits *before* or *while* leveling criticism often *retains* standing. This demonstrates sincerity and avoids the charge of hypocrisy or self-righteousness. They blame *from within* the moral community, acknowledging shared fallibility. (Scanlon, Wallace).

  ### Key Debates Among Philosophers
  1.  **Is Blamelessness Required for Standing?**
      *   **Todd's Challenge (Parity Argument):** Patrick Todd argues that if *anyone* has standing to blame, then *everyone* (including hypocrites) has standing, unless their hypocrisy makes them *worse* than the wrongdoer. He suggests focusing on the *content* of the blame, not the blamer. ("A Unified Account of the Moral Standing to Blame")
      *   **Bell's Response (Answerability & Clarity):** Macalester Bell counters that hypocritical blame fails because the hypocrite lacks the *clarity* or *commitment* needed for the target to be *answerable* to *them*. The hypocrite's own violation creates a "noise" that drowns out the moral message. The target cannot properly *hear* the moral demand from someone flouting it. ("Standing to Blame: A Critique")

  2.  **What Exactly is Lost? Authority or Effectiveness?**
      *   **Authority View (Wallace, Watson):** Losing standing means the critic lacks the *moral right* to blame, often due to violating norms of reciprocity or fairness inherent in moral address.
      *   **Effectiveness View (Coates, Tognazzini):** The criticism loses its *practical force* or *effectiveness* as a form of moral communication because the hypocrite undermines their own credibility or the target's ability to take the criticism seriously. The proposition may be true, but the *act* of blaming misfires.

  3.  **Structural Injustice & Complicity:**
      *   How does standing operate when we are all complicit in complex, systemic wrongs (e.g., climate change, exploitative capitalism)? Does this create a general problem of standing, or can we still blame specific actors *while acknowledging our own role*? This is an active area of discussion, often drawing on work by Young and others.

  ### Cases that Force the Disagreement
  1.  **The Unrepentant, Non-Current Hypocrite:** Someone who cheated on taxes years ago (never caught, never repented) condemns someone else for cheating *now*. Does she have standing? Todd might say yes (if the criticism is correct); Bell/Wallace would likely say no (lack of commitment/clarity, unfairness).
  2.  **The Beneficiary Critic:** The sweatshop consumer example. Is their standing to blame the factory owner *undermined*? If so, completely or partially? Does acknowledging complicity restore it? This tests the limits of the complicity principle.
  3.  **Blaming Worse Wrongs:** Does a thief have standing to blame a murderer? Most agree yes (different domain, lesser wrong). But what about a petty thief blaming a grand thief? Relevancy and proportionality become key.

  ### Conclusion
  The framework you're seeking is primarily the **"standing to blame" literature** within moral philosophy, grappling with **hypocrisy** and the legitimate/illegitimate use of **tu quoque** arguments. The core principle is that while the *truth* of a moral criticism is independent of the critic's character, the critic's *authority to perform the act of blaming* can be undermined by their own inconsistency, complicity, or unacknowledged benefit *relative to the specific wrong they are condemning*. The debates center on *why* this happens (authority vs. effectiveness), *how much* inconsistency matters, and the conditions under which standing can be retained (e.g., through acknowledgment and reform) or is categorically lost.

  **Key Starting Points in the Literature:**
  *   R. Jay Wallace: "Hypocrisy, Moral Address, and the Equal Standing of Persons" (in *Reason and Recognition: Essays on the Philosophy of T.M. Scanlon*)
  *   Macalester Bell: "Standing to Blame: A Critique" (in *Blame: Its Nature and Norms*, Coates & Tognazzini eds.)
  *   Patrick Todd: "A Unified Account of the Moral Standing to Blame" (*Nous*)
  *   Gary Watson: "Standing in Judgment" (in *Blame: Its Nature and Norms*)
  *   Pamela Hieronymi: "Articulating an Uncompromising Forgiveness" (*Philosophy and Phenomenological Research*) - touches on related themes.
  *   The collection *Blame: Its Nature and Norms* (Coates & Tognazzini, eds.) is an excellent resource.

  This literature provides sophisticated tools to analyze the pattern you've observed and understand why some deflections feel legitimate while others feel like cheap evasions.
