  1. Trusting flatmate on factory farming - feels right 
  2. Pub guy on whistleblowing - feels wrong 
  3. GP on life support - feels right 
  4. Same GP on CV lying - feels wrong 

  Plus the AI garden donation case they're unsure about. 

  Hmm... the key seems to lie in the intersection of three factors: expertise relevance, stakes, and moral agency. The flatmate has specific knowledge about animal welfare (relevant expertise), the life support decision involves medical ethics (doctor's core competence), while CV honesty is outside medical scope. 

  The pub guy fails on both expertise and stakes - high-risk whistleblowing deserves careful deliberation, not barstool advice. Interesting how the user intuitively recognizes this despite lower concrete stakes in the CV case. 

  For the AI case... tricky. The ethicist training gives relevant knowledge, but the community garden context demands human judgment about local values. Plus the delegation feels like avoiding responsibility. Their flip-flopping makes sense - it's borderline on the criteria. 

  The unifying framework might be: Defer only when (1) the domain matches advisor's proven competence, (2) the stakes warrant delegation, and (3) you retain ultimate accountability. 

