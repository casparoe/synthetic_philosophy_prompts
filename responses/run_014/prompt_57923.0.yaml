answer: |-
  Your gut reactions reveal a coherent ethical principle at work: **Defer to others when they possess *relevant, trustworthy expertise* on a *domain-specific moral question* that *aligns with the stakes and context*, but maintain personal responsibility for core moral agency.** 

  Here's how it explains all four cases:

  1. **Flatmate on Factory Farming (Feels Right)**  
     - **Expertise:** Flatmate has *domain-specific knowledge* (animal welfare research).  
     - **Stakes/Context:** Personal dietary choice; her expertise directly applies.  
     - **Agency:** You retain choice (you could research too), but delegation is efficient and justified.

  2. **Pub Bloke on Whistleblowing (Feels Wrong)**  
     - **Expertise:** Random "confident" person lacks *relevant knowledge* (law, workplace ethics, consequences).  
     - **Stakes/Context:** High stakes (career, legal risks); generic confidence ≠ trustworthy expertise.  
     - **Agency:** Delegating core moral judgment here is reckless self-abdication.

  3. **GP on Life Support (Feels Right)**  
     - **Expertise:** GP has *domain-specific expertise* (medical ethics, prognosis, patient welfare).  
     - **Stakes/Context:** Extreme stakes; her role *includes* ethical guidance in healthcare.  
     - **Agency:** You’re not outsourcing grief—you’re trusting relevant professional judgment.

  4. **GP on CV Lying (Feels Wrong)**  
     - **Expertise:** GP has *no special competence* in employment ethics or honesty norms.  
     - **Stakes/Context:** Lower stakes, but core personal integrity issue.  
     - **Agency:** Delegating basic honesty (a universal virtue) erodes moral responsibility.

  ---

  ### The Principle Broken Down:
  1. **Relevant Expertise:**  
     Is the person’s knowledge *specific to the moral domain*? (Animal welfare, medical ethics, etc.)  
  2. **Trustworthiness:**  
     Is their judgment impartial, evidence-based, and free of conflicts?  
  3. **Stakes-Context Alignment:**  
     High-stakes/complex domains (e.g., end-of-life care) justify reliance on experts. Low-stakes/core virtues (e.g., honesty) do not.  
  4. **Preserved Moral Agency:**  
     Never delegate *fundamental moral responsibilities* (e.g., integrity, harm-prevention) to others without scrutiny.

  ---

  ### Applying the Principle to the AI Ethicist Garden Case:
  Your flip-flopping is understandable—it sits at the edge of the criteria:  
  - **✅ Relevant Expertise?**  
    *Partly.* The AI is trained on ethicists’ views, but lacks:  
    - Contextual understanding of *your community*’s needs.  
    - Ability to weigh real-world trade-offs (e.g., "Should we prioritize food banks or school gardens?").  
  - **⚠️ Trustworthiness?**  
    *Unclear.* AI may reflect biases in training data or oversimplify dilemmas.  
  - **⚠️ Stakes-Context Alignment?**  
    Moderate stakes (community impact) justify *consulting* expertise, but not full abdication.  
  - **❌ Agency Risk?**  
    **Critical flaw:** Delegating *all* decisions to AI may dissolve the community’s collective moral engagement.  

  **Verdict:** Using the AI as a *tool* (e.g., "Generate options based on ethical principles") is fine. Blindly following its verdict violates the principle—it lacks contextual expertise, and the community must own its choices.  

  **Solution:** Have the AI propose donation frameworks, then *discuss and adapt* them democratically. This preserves agency while leveraging ethical insights.

  ---

  ### Why This Works:
  Your intuition rejects outsourcing when:  
  - Expertise is irrelevant (pub bloke on whistleblowing).  
  - The issue is foundational to character (lying, even trivially).  
  - Delegation becomes avoidance (AI replacing communal debate).  

  **TL;DR:** Defer for *specialized knowledge* in *complex/high-stakes domains*, but never on *core virtues* or to *dodge responsibility*. The garden AI? Use it as an advisor, not a priest.
