prompt: |-
  I cover science and ideas and need a standard for evaluating accuracy-first epistemology, the view that accuracy is the fundamental epistemic value. Write the desiderata an adequate epistemic utility theory must satisfy if it is to adjudicate that view, with particular attention to imprecise credences, incommensurable propositions, and the absence of practical stakes. For each item, state the requirement, the case or consideration that motivates it, and whether it is non-negotiable or contestable. Return exactly five numbered items, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Okay, the user is asking me to create a set of desiderata for evaluating accuracy-first epistemology, focusing on imprecise credences, incommensurable propositions, and the absence of practical stakes. They need exactly five numbered items, each with a requirement, motivation, and negotiability status, in one or two sentences without introduction or conclusion.

  Accuracy-first epistemology centers on accuracy as the core epistemic value, and the user specifically mentions three tricky areas: imprecise credences (where beliefs aren't precise probabilities), incommensurable propositions (that can't be easily compared), and contexts without practical stakes (pure truth-seeking). I need to ensure these are addressed in the desiderata.

  For the desiderata, I'm thinking about structure: each item should clearly state what's required, why it matters, and whether it's firm or debatable. The user is a science and ideas writer, so this needs to be academically rigorous but accessible—they're likely building a framework for analysis or writing an article.

  Deep down, the user might be probing how accuracy-first theory handles real-world complexities. They could be worried that standard models oversimplify epistemology, so I should emphasize how the desiderata address gaps, like handling uncertainty without precision or ignoring practical influences. This could help them argue for or against the view in their work.

  Now, brainstorming the five items:
  1. One on imprecise credences—requiring the theory to handle sets of credences without collapsing to precision.
  2. Another for incommensurability—ensuring propositions can be evaluated even when not directly comparable.
  3. Something on pure epistemic contexts—demanding that accuracy assessments ignore non-epistemic factors.
  4. A desideratum for coherence—tying accuracy to rational constraints like probability rules.
  5. Finally, a normativity requirement—linking accuracy to epistemic duties to avoid arbitrariness.

  I'll make sure each is concise: one or two sentences max, numbered as specified. For negotiability, I'll mark some as non-negotiable for core principles, like coherence, while others might be contestable, like how to handle imprecision. This reflects ongoing debates in epistemology.

  Finally, I'll ensure the response is neutral and informative, helping the user adjudicate the view without bias. Once done, I'll review: five items, no extras, and straight to the point.
answer: |-
  1. **Must accommodate imprecise credences:** The theory should provide a rational assessment of agents with sets of credences (representing deep uncertainty) without requiring precise probabilities, motivated by cases like ambiguous evidence where a single precise credal state seems unjustified. This requirement is contestable regarding *how* imprecision should be modeled and evaluated.  
  2. **Must handle incommensurable propositions:** It must define accuracy and epistemic utility for propositions whose truth-values cannot be meaningfully compared on a single scale (e.g., distinct scientific theories), motivated by the need to evaluate diverse beliefs coherently. This requirement is contestable, as some argue all propositions are commensurable via truth.  
  3. **Must be stakes-invariant:** Epistemic utility assessments must depend solely on credal state and truth-value, independent of practical consequences, motivated by the need to isolate purely epistemic value in "pure inquiry" contexts. This non-negotiable requirement defines accuracy-first epistemology's core commitment.  
  4. **Must entail coherence norms:** The theory must normatively require adherence to probability axioms (e.g., non-negativity, additivity) as a consequence of accuracy optimization, motivated by the incoherence (and dominance vulnerability) of credences violating these axioms. This is non-negotiable for coherence-based accuracy-first approaches.  
  5. **Must provide normative guidance:** The theory must generate concrete, action-guiding epistemic norms (e.g., conditionalization, reflection) directly from accuracy maximization, avoiding arbitrary rules, motivated by the need to explain rational belief update. This is contestable regarding the strength and scope of the norms derivable.
