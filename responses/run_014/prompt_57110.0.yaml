  ### 6. Debrief
  - Start by noting the market results: in round 1, most doubled H (to about 16.7%), and in round 2, they set S to about 14.3%. Why the difference? Because the testimony in round 1 ("if not H then R") turned out to be equivalent to "the card is red", so it excluded all black cards. In round 2, the testimony ("if not S then R") is not equivalent to "red": it allows the ace of spades (which is black) and all red cards. So we only exclude the black non-aces.

  - Map to policies:
     - Policy (a): conditioning on the material conditional. This is what they did. It worked for both rounds.
     - Policy (b): holding the probability of the antecedent fixed and setting the conditional probability to 1. In round 1, this would leave H at 8.3% and set R to 100%. But that would be wrong because if the card is red, then the probability of H is 1/6. In round 2, it would leave S at 8.3% and set R to 91.7%. But the testimony rules out the black non-aces, so the card is either red or the ace of spades. The probability of S given that should be 1/7.

  - Press on what each policy gives up:
     - Policy (a) is the standard for categorical conditionals. It respects the truth of the testimony.
     - Policy (b) might be defended if the testimony is about a conditional probability (like in Judy Benjamin) and not a categorical conditional. But here, since the testimony is reliable and categorical, policy (b) is not appropriate.

  - Bring to real world:
     - A doctor says: "If the patient doesn't have disease A, then the symptom B will occur." This is a categorical conditional. We should condition on the material conditional, i.e., the patient either has A or has symptom B.
     - But if the doctor says: "Given that the patient doesn't have disease A, the probability of symptom B is 90%", then we are in Judy Benjamin territory, and the update is not straightforward.

  - Name the problem: Judy Benjamin problem (for the conditional probability case) and contrast with the categorical conditional.

  ### 7. Wreckage report
  - What goes wrong:
    - Some students might not understand the scoring rule and set extreme prices (0 or 100). This can lead to big losses. We can mitigate by providing examples.
    - The non-mathy students might set prices arbitrarily and then be confused by the scores. We can help by having TAs or group work.
    - The group using policy (b) (if any) might have won in round 1 if the ace of hearts was not drawn? For example, in round 1, if the card drawn is a red non-ace, then under policy (b) they would have set H=8.3% and R=100%. The true H is false, so their score for H (after) is 100 - (8.3)^2/100 ≈ 100-7=93. For R, they set 100, and it's true: 100 - (0)^2/100 = 100. 
      Under policy (a), they set H=16.7% and R=100%. Score for H: 100 - (16.7)^2/100≈100-28=72 (since false). For R: 100.
      So policy (b) wins in this case for H. But overall, if the card is the ace of hearts, policy (a) wins for H. 
      So in a single instance, the worse policy might win. We explain that the scoring rule rewards calibration over the long run, and in the long run, policy (a) is better for categorical conditionals.

    - If no one notices the difference between the rounds, we point it out explicitly: "Look at the after-prices for H in round1 and for S in round2. Why are they different? The form of the testimony is the same."

  ### 8. What the market can't show
  - The market forces an update on a categorical conditional. But the Judy Benjamin problem is about updating on a conditional probability (not a categorical statement). The game cannot reproduce the open-endedness of a probabilistic conditional. We will have to explain that in the debrief: "In the Judy Benjamin problem, the testimony is not that a particular conditional is true, but that a conditional probability holds. That leads to a different challenge: how to update when you learn P(B|A)=q, not that A→B is true."

  ### Final note on the deck
  - The deck is simplified and has only two suits. In the original Judy Benjamin problem, the partition is more complex. But for the purpose of the activity, it is a good analogy for the categorical conditional. The only break is that in round1, the conditional reduced to R, which might be seen as trivial. But it's a feature to show that conditionals can have different logical strengths.

  We design the activity accordingly.
answer: |-
  ### 1. **The Kit**  
  - **Deck**: 12 cards: hearts (red, ace–6) and spades (black, ace–6). One card drawn face down per round.  
  - **Props**: Traded as contracts paying 100 if true:  
    - **H**: "Card is ace of hearts"  
    - **R**: "Card is red"  
    - **S** (Round 2 only): "Card is ace of spades"  
  - **Handout**: Deck composition, props, scoring rule (simplified quadratic: *Score = 100 − (truth − price/100)² × 10,000*, rounded).  
  - **Points**: Each student starts with 400 points (100 per priced prop: H, R pre/post in Round 1; S, R pre/post in Round 2).  
  - **Informant Prep**: Brief one student secretly. Round 1: Say *"If it’s not the ace of hearts, then it’s red."* Round 2: Say *"If it’s not the ace of spades, then it’s red."* Stress: They are 100% reliable.  

  ### 2. **Market Rules**  
  - **Pricing**: Students set a price (0–100) for each prop, representing points paid for a contract paying 100 if true.  
  - **Scoring**: For each prop, score = `100 − (actual_value − price)² / 100` (actual_value: 100 if true, 0 if false). Rounded to whole numbers.  
    - *Example*: Price 20 for H. If H true: `100 − (100−20)²/100 = 100 − 64 = 36`. If false: `100 − (0−20)²/100 = 100 − 4 = 96`.  
  - **Anti-Gaming**:  
    - Prices must be set for all props (no skipping).  
    - 2-minute time limit per pricing phase.  
    - Prices submitted privately (no copying).  
  - **Payout**: Total score = sum of scores for all priced props across both rounds. Reveal card after testimony to resolve payouts.  

  ### 3. **Timeline** (75 min total)  
  - **0:00–0:05**: Intro. Explain deck, props, and scoring (demo with example prices). Hand out sheets.  
  - **Round 1**:  
    - **0:05–0:10**: Set *before-testimony* prices for H and R. Collect prices, display on board.  
    - **0:10–0:12**: Informant: *"If not ace of hearts, then red."*  
    - **0:12–0:17**: Set *after-testimony* prices for H and R. Collect, display.  
    - **0:17–0:22**: Reveal card. Calculate scores.  
  - **Round 2**:  
    - **0:22–0:27**: New card. Set *before-testimony* prices for S and R.  
    - **0:27–0:29**: Informant: *"If not ace of spades, then red."*  
    - **0:29–0:34**: Set *after-testimony* prices for S and R.  
    - **0:34–0:39**: Reveal card. Calculate scores.  
  - **0:39–0:44**: Display all prices. Highlight: H doubled? S barely changed? Ask: *"Why did H jump more than S?"*  
  - **0:44–0:59**: Debrief (link to policies, real-world cases).  
  - **0:59–1:05**: Wreckage report and conclusions.  
  - **1:05–1:15**: Q&A.  

  ### 4. **Where It Should Land**  
  At **0:39–0:44**, when prices are displayed:  
  - **Beat**: Students see median price for H rose from ~8 to ~16 (doubled), but S only from ~8 to ~14.  
  - **Your Move**: Point silently at the H/S columns. If no one notices, ask: *"Why did H jump more than S for the same testimony form?"*  
  - **Action**: If stuck, nudge: *"What did the testimony rule out in each round?"*  

  ### 5. **The Policies, in Numbers**  
  | Policy          | Round 1 (H, R)         | Round 2 (S, R)         |  
  |-----------------|------------------------|------------------------|  
  | **Prior**       | H: 1/12≈8.3%, R: 6/12=50% | S: 1/12≈8.3%, R: 6/12=50% |  
  | **(a) Condition on material conditional** | H: 1/6≈16.7% (doubled), R: 100% | S: 1/7≈14.3%, R: 6/7≈85.7% |  
  | **(b) Fix P(antecedent), set P(consequent|antecedent)=1** | H: 8.3% (unchanged), R: 100% | S: 8.3% (unchanged), R: 91.7% |  
  | **(c) Fix P(antecedent), minimal change** | *Same as (b)* | *Same as (b)* |  

  - **Round 1 Coincidence**: (a) and (b) both make R certain (100%) because "¬H → R" is *logically equivalent to R* (due to H being red).  
  - **Round 2 Divergence**: "¬S → R" is *not* equivalent to R (S is black, so it leaves S possible). Thus (a) increases S to 1/7≈14.3%, while (b)/(c) leave S at 8.3%.  

  ### 6. **Debrief**  
  - **0:44–0:50**: Link market to policies:  
    - Most students used (a) (conditioning on material conditional), doubling H in Round 1 and lifting S slightly in Round 2.  
  - **0:50–0:55**: Press trade-offs:  
    - (a) Respects testimony as a true proposition but can feel unintuitive (S barely changes).  
    - (b)/(c) Keep the antecedent’s probability fixed but ignore that testimony rules out worlds (e.g., black non-aces in Round 2).  
  - **0:55–0:59**: Real-world examples:  
    - Doctor: *"If the tumor isn’t malignant, the scan is clean."* → Rules out "malignant & clean"?  
    - Reviewer: *"If the method isn’t flawed, the result holds."* → How much doubt remains?  
    - **Name drop**: This is van Fraassen’s *Judy Benjamin problem*—updating on conditionals isn’t always straightforward.  

  ### 7. **Wreckage Report**  
  - **Predictable issues**:  
    - **Math-averse students panic**: Some set random prices. *Fix*: Use simple scoring examples; reassure that "gut feel" is OK.  
    - **Outcome luck**: The "wrong" policy (e.g., (b) in Round 1) may win if a black card is drawn. *Handle*: Point out scoring rules reward *long-run* accuracy, not one-off luck.  
    - **Noisy resolution**: Card reveals cause chaos. *Fix*: Pause to calculate scores calmly; use a scorekeeper.  
    - **Smug winner**: If a (b) user wins, say: *"Great! But if we repeated this 100 times, would (b) still win?"*  

  ### 8. **What the Market Can’t Show**  
  The market forces a *categorical* update ("the conditional is true"), but Judy Benjamin’s core is updating on a *conditional probability* ("*if* A, *then probably* B"). You must note: *"In real life, testimony is often probabilistic (e.g., ‘likely’ or ‘75% chance’). Our game can’t model that—it’s why Judy Benjamin is harder."*  

  ### Deck Break vs. Original Judy Benjamin  
  - **Break**: Your deck has *no "mixed" properties* (all hearts are red, spades black). In Round 1, "¬H → R" collapses to "R" (trivializing the conditional). Van Fraassen’s original has independent attributes (e.g., territory color and HQ status), making the update non-collapsible.  
  - **Why it’s OK**: The collapse *creates the contrast* between Rounds 1 and 2 (H doubles, S doesn’t), priming the debate. Admit: *"Real conditionals don’t always simplify—this is a toy case."*
