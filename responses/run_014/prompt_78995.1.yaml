prompt: |-
  I'm in my third year of a philosophy degree and I'm writing an essay for a course on practical reason, and last week a visiting lecturer gave a talk on Williams and the distinction between internal and external reasons. I took fairly full notes, but the more I look at them the more I suspect I've written down a cartoon. What he said, as near as I can reconstruct it, was this: 'Williams holds that a reason statement is true only if the agent has a desire that the action in question would satisfy, so for him all reasons are instrumental and deliberation can only ever be about means; he calls the set of an agent's desires the subjective motivational set and treats it as a fixed given. It follows that nobody can be wrong about what they have reason to do, and that moral criticism of anyone is impossible — the man who is serially unfaithful and untroubled by it simply has no reason to be otherwise, and Williams accepts that with a shrug. He also thinks the very idea of deliberating about ends is incoherent, which is why what he ends up with is a dressed-up version of the Humean doctrine that reason serves the passions. The view is now generally regarded as refuted: the standard objection — that it can't account for someone who is simply indifferent to his own future — is usually taken to be decisive, and Williams himself later qualified the thesis in response to critics, which most people read as a concession.' I have a vague memory of a handout that distinguished something called the sub-Humean model from Williams's own position, and I wonder whether that is precisely the line the lecture erased.

  I suspect the talk was unfair to Williams, but I can't say precisely where the unfairness lies, and I'd rather not build an essay on a caricature. So I'd like you to go through the summary claim by claim and tell me which parts a careful reader of Williams would accept, which are defensible simplifications a lecturer might make on a first pass, and which Williams would have rejected outright — and where he would reject something, what a defender of the view would want put in its place. I'm especially unsure about the slide from 'a reason statement is true only if it connects up with the agent's existing motives' to 'nobody can be wrong about their reasons' and then to 'nobody can be criticised'; those look to me like two quite different steps and I don't see that either one follows, but I may be missing something about how he thinks of the motivational set and about what he is willing to let deliberation do. On that last point, a friend of mine who plays in an orchestra described something I've been trying to fit into the picture: she says she used to want to play because she loved the music, and over a couple of years, without any new desire appearing and without discovering any new fact, she came to hear her own wanting as vanity rather than love and stopped wanting it. That doesn't look like means-end deliberation at all, and I'd like to know how Williams's account handles it, and whether the lecturer's version of the view leaves any room for it.

  Please write your answer as continuous prose, the way you'd write a long email to someone who asked you a complicated question — no headings, no numbered lists, no bullet points, no bold text, no tables. I want an audit I can actually act on, so be concrete about which sentences in the summary survive as they stand, which need rewriting, and which have to go; and if the lecturer's closing claims about the state of the debate are ones I shouldn't rely on in an essay, say so plainly rather than hedging.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy student who needs to audit a lecture summary about Bernard Williams' internal reasons theory. They suspect oversimplification and want precise corrections for their essay. 

  First, I need to verify the accuracy of each claim in their notes. The core tension seems to be between the lecture's portrayal of Williams as a strict instrumentalist and Williams' actual nuanced position. The user has already spotted problems with the "nobody can be wrong" and "no moral criticism" inferences, which suggests they're engaging deeply with the material.

  The musician example is particularly interesting - it demonstrates evaluative deliberation that doesn't fit means-end models. Williams' concept of "sound deliberation" could explain this as the agent refining her subjective motivational set through reflection. This directly counters the lecture's claim that deliberation is only about means.

  Regarding the lecture's closing claims: The "indifference to future" objection (Parfit's case) isn't decisive for Williams. His later qualifications about objective goods weren't concessions but clarifications against misreadings. The "sub-Humean model" handout likely distinguished crude desire-instrumentalism from Williams' richer view involving character and identity.

  I should emphasize where the summary goes wrong: 
  - Oversimplifying the subjective motivational set (not just desires, includes commitments)
  - Missing how deliberation can transform motivations
  - Mistaking Williams' anti-moralism for amoralism
  - Overstating the academic consensus against him

  The user needs concrete writing advice: They should retain the basic internal reasons framework but revise the claims about deliberation's scope, moral criticism, and alleged refutations. The musician example can anchor their critique of instrumentalist readings.
answer: |-
  You're right to be suspicious — that summary contains significant distortions and oversimplifications that flatten Williams' nuanced position into something almost unrecognizable. Let's walk through it step by step, separating what's defensible from what's misleading or flatly wrong, and then we'll tackle your musician example, which is illuminating.

  Starting with the core claim: "Williams holds that a reason statement is true only if the agent has a desire that the action in question would satisfy." This is *technically* salvageable but deeply misleading as stated. Williams *does* argue that for a reason to be *internal* (i.e., genuinely *for that agent*), it must be capable of motivating the agent through a *sound deliberative route* from their existing "subjective motivational set" (S-mot set). Crucially, the S-mot set **is not limited to desires** in the crude, occurrent sense. Williams explicitly includes "dispositions of evaluation, patterns of emotional reaction, personal loyalties, and various projects... embodying commitments" (*Internal and External Reasons*, 1981). So, the lecturer's reduction to "desire" and the implication that reasons are merely instrumental is the first major distortion. Williams allows for deliberation that isn't just about means; it can involve **understanding and refining** elements of the S-mot set itself. The lecturer's claim that "deliberation can only ever be about means" is **rejected outright** by Williams. He explicitly discusses deliberation that involves "finding constitutive solutions" (e.g., deciding *how* to express loyalty, which shapes what loyalty *means* for you) and "deliberating about what one wants" in a broader evaluative sense.

  The claim that the S-mot set is treated as a "fixed given" is also a **significant oversimplification**. While the S-mot set provides the starting point for deliberation, Williams is clear that deliberation *can* transform it. New motivations can arise *through* deliberation (e.g., realizing a course of action would be dishonorable might generate a new motivational element *against* it). It's not static; it's the evolving basis *from which* we deliberate.

  This leads directly to the problematic inferences: "It follows that nobody can be wrong about what they have reason to do" and "moral criticism of anyone is impossible." **Neither follows on Williams' account, and he explicitly denies them.** Here's why:
  1.  **Being Wrong:** An agent *can* be wrong about their reasons *relative to their own S-mot set*. This happens through faulty deliberation. They might be unaware of a relevant element in their own set (e.g., their deep commitment to fairness), misjudge how an action serves (or undermines) an element (e.g., thinking infidelity won't hurt their loyalty to their partner), or fail to deliberate soundly (e.g., ignoring relevant facts, being inconsistent). Williams' point is that the *truth* of a reason claim *for them* depends on a sound deliberative route *from their S-mot set*, not on their *belief* about it. They can certainly be mistaken about whether such a route exists. The serial adulterer *might* have no internal reason to be faithful *if* his S-mot set truly lacks any element (like care, commitment, a value for honesty, or even a desire for a certain kind of self-image) that faithfulness connects to via sound deliberation. But Williams doesn't say this is always the case. He *does* say that merely asserting an *external* reason ("You have a reason to be faithful!") is pointless if no internal connection can be made.
  2.  **Moral Criticism:** Williams absolutely allows for criticism. It just takes a different form. Criticizing someone involves showing how their action conflicts with elements *within their own* S-mot set ("Doesn't this betray your own value for X?") or pointing out faulty deliberation ("Did you consider how this would impact Y, which you claim to care about?"). If the person genuinely lacks any motivational element that the criticism hooks onto (like the "amoralist" who truly lacks any moral sentiments), Williams *does* think external moral criticism ("You *ought* to feel bad!") is ultimately incoherent or impotent as a *reason-giving* statement *for that agent*. But this is a far cry from saying "moral criticism of anyone is impossible." Criticism rooted in the agent's own commitments is possible and potent. The "shrug" characterization is unfair; Williams is making a point about the *logic* of reasons, not endorsing indifference.

  The claim "he also thinks the very idea of deliberating about ends is incoherent" is **flatly wrong**. Williams explicitly discusses deliberating about ends, particularly in the context of constitutive projects and understanding one's values. What he *denies* is that such deliberation starts from a motivational vacuum or reaches conclusions that are entirely independent of the agent's existing motivational structure. Deliberating about ends involves working with and refining the materials *in* the S-mot set.

  The "dressed-up Hume" label is a common oversimplification that Williams himself rejected. While he shares Hume's core insight that motivation must stem from the "passions" broadly construed (the S-mot set), Williams' conception of the S-mot set and the scope of deliberation (especially its self-reflective, constitutive aspects) is significantly richer and more sophisticated than a simple "reason is the slave of the passions" model. The "sub-Humean model" on the handout likely referred to a crude desire-instrumentalism, which Williams was explicitly distancing himself from.

  Now, the state-of-the-debate claims:
  *   **"Refuted by the indifference to future objection":** This (often attributed to Parfit) argues that Williams' view implies someone indifferent to their own future suffering has no reason to avoid it, which seems counterintuitive. Williams' defenders argue this misapplies his view. If the person genuinely has *no* element in their S-mot set (not even aversion to pain, desire for survival, self-concern, etc.) that avoiding future suffering would serve, *then*, Williams would say, they have no internal reason to avoid it. The counterintuitiveness stems from our deep assumption that self-concern is near-universal, not a flaw in Williams' logic. This objection is influential but **not universally considered decisive**; it highlights a counterintuitive consequence many find unacceptable, but it doesn't refute the internalist *logic*. Many internalists bite the bullet here.
  *   **Williams "qualified the thesis" as a "concession":** Williams did refine his position (e.g., clarifying the nature of "sound deliberation," emphasizing the richness of the S-mot set against "desire" reductions). However, describing this as a "concession" implying retreat is **misleading**. It was more a clarification against misinterpretations (like the ones in this lecture summary!) than a fundamental change. His core internalist thesis remained intact.

  **Your Musician Example:** This is a brilliant counter to the lecturer's caricature. On Williams' actual view, this fits perfectly. Your friend engaged in **deliberative refinement** of her S-mot set. Her initial motivation (let's call it "love of music/performance") was part of her set. Through reflection and experience (a form of deliberation!), she came to **reinterpret the nature and grounding** of that motivation. She didn't discover a *new* desire; she came to understand her *existing* desire differently – seeing it not as stemming from a genuine appreciation (which might connect to deeper values like beauty or expression), but as stemming from "vanity" (which she presumably devalues or sees as conflicting with other elements like authenticity or humility). This reinterpretation *changed* the motivational force of the desire within her set; what was once a positive motivator became seen as something alien or negative, leading to its motivational erosion. This is precisely the kind of non-means-end deliberation Williams emphasizes – deliberation that shapes *what we take our motivations to be* and how we understand them in relation to our broader character and values. The lecturer's "instrumental means-only" version has no room for this; Williams' actual view does.

  **Summary Audit - What to Keep, Rewrite, Ditch:**
  *   **Keep (with minor rewording):** "Williams holds that a reason statement is true only if..." --> Rewrite to: *"Williams argues that for a reason statement to be true (i.e., to be an internal reason for a specific agent), there must exist a sound deliberative route connecting the action to that agent's subjective motivational set."* (Crucially, define S-mot set broadly!).
  *   **Keep (but contextualize):** "...he calls the set of an agent's desires the subjective motivational set..." --> Rewrite to: *"He terms the agent's existing motivations (including desires, commitments, values, and projects) the 'subjective motivational set' (S-mot set)."*
  *   **Ditch Completely:** "...so for him all reasons are instrumental and deliberation can only ever be about means..." & "...he also thinks the very idea of deliberating about ends is incoherent..." & "...the view is now generally regarded as refuted..."
  *   **Rewrite Significantly:** "...treats it as a fixed given." --> Rewrite to: *"While the S-mot set provides the starting point, Williams acknowledges it can be clarified and transformed through deliberation."*
  *   **Rewrite Significantly:** "It follows that nobody can be wrong about what they have reason to do..." --> Rewrite to: *"Williams maintains that the truth of an internal reason claim depends on the agent's actual S-mot set and sound deliberation, not their beliefs. Consequently, an agent *can* be wrong about their reasons if their deliberation is faulty (e.g., ignores relevant facts or elements of their own set)."*
  *   **Rewrite Significantly:** "...and that moral criticism of anyone is impossible — the man who is serially unfaithful and untroubled by it simply has no reason to be otherwise, and Williams accepts that with a shrug." --> Rewrite to: *"Williams argues that effective moral criticism must connect to the agent's own S-mot set, showing a conflict with their existing commitments or faulty deliberation. If an agent *genuinely* lacks any motivation to which fidelity is connected (like care, loyalty, or valuing the relationship), then asserting an *external* reason for fidelity is, on his view, ineffective. This doesn't preclude criticism based on the agent's own values or imply Williams is indifferent."*
  *   **Rewrite Significantly:** "...He also thinks... dressed-up version of the Humean doctrine..." --> Rewrite to: *"While sharing Hume's foundational insight that reason requires motivational input, Williams' richer conception of the S-mot set and broader view of deliberation moves significantly beyond a simple instrumentalist 'reason is the slave of the passions' model."*
  *   **Handle with Extreme Caution/Contextualize Heavily:** "...the standard objection — that it can't account for someone who is simply indifferent to his own future — is usually taken to be decisive, and Williams himself later qualified the thesis in response to critics, which most people read as a concession." --> If you mention the objection, frame it as highlighting a *counterintuitive consequence* that many find problematic for internalism, not a refutation. Note Williams' defenders argue it stems from conflating internalism with universal self-concern. Describe his later clarifications as refinements against misinterpretation, not fundamental concessions.

  Your instinct about the slide from internalism to "no one can be wrong/no criticism" was spot on. The lecturer erased the crucial space Williams creates for deliberative error and criticism grounded in the agent's own perspective. Your friend's experience is a powerful example of how Williams' actual view, unlike the caricature, accommodates deep, non-instrumental practical reasoning. Build your essay on *that* richer understanding. Good luck!
