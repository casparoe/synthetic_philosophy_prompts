prompt: |-
  As facilitator of an 80-minute university extension workshop on collective reasoning for 16 non-specialist adults, I need a structured voting exercise in which participants produce an inconsistent group verdict from consistent individual votes before the phenomenon is named or explained. Base the exercise on this admissions case: a candidate is to be admitted only if judged both qualified on merit and admissible given capacity, with privately assigned viewpoints distributed so that majorities favor each criterion separately while a majority opposes admission. Specify the step-by-step procedure, ballot materials and tabulation method, followed by a debrief that connects each stage of what happened to premise-based versus conclusion-based aggregation. Include likely facilitation problems with remedies, and identify one central aspect of the general impossibility results that the exercise necessarily simplifies and must be stated explicitly.
reasoning: |-
  We are going to design a workshop exercise that illustrates the discursive dilemma (or doctrinal paradox) in collective reasoning. The goal is for the group to reach an inconsistent verdict (i.e., majority vote for each premise but majority against the conclusion) without being told about the phenomenon until the debrief.

  Scenario: A candidate is to be admitted only if judged both qualified on merit and admissible given capacity. So, the rule is: Admit if and only if (Qualified AND Admissible).

  We need to distribute viewpoints so that:
  - Majority thinks the candidate is Qualified.
  - Majority thinks the candidate is Admissible.
  - But majority thinks the candidate should NOT be Admitted.

  We'll have 16 participants. We can assign individual views to create the paradox.

  A possible distribution (one of many) that leads to the paradox:

  Let:
  - Q: Qualified (Yes/No)
  - A: Admissible (Yes/No)
  - Conclusion: Admit (Yes/No) which is Q AND A.

  We want:
  - At least 9 say Q=Yes (so majority for Qualified)
  - At least 9 say A=Yes (so majority for Admissible)
  - But at least 9 say Admit=No.

  How can we assign? We need a set of ballots that individually are consistent (each participant votes according to the rule: if they vote Q=Yes and A=Yes, then Admit=Yes; if they vote Q=No then Admit=No regardless of A; similarly if A=No then Admit=No regardless of Q).

  We can break the group into three types:

  Type 1: Q=Yes, A=No -> Admit=No (say, 5 people)
  Type 2: Q=No, A=Yes -> Admit=No (say, 5 people)
  Type 3: Q=Yes, A=Yes -> Admit=Yes (say, 6 people)

  But then:
  - Q=Yes: Type1 (5) + Type3 (6) = 11 -> majority
  - A=Yes: Type2 (5) + Type3 (6) = 11 -> majority
  - Admit=Yes: Type3 (6) -> only 6, so Admit=No: Type1 (5) + Type2 (5) = 10 -> majority against admission.

  But note: 16 people. So we have 5+5+6=16. This works.

  Alternatively, we might have:
  Type 1: Q=Yes, A=No -> Admit=No (4 people)
  Type 2: Q=No, A=Yes -> Admit=No (4 people)
  Type 3: Q=No, A=No -> Admit=No (2 people)
  Type 4: Q=Yes, A=Yes -> Admit=Yes (6 people)

  Then:
  - Q=Yes: Type1 (4) + Type4 (6) = 10 -> majority
  - A=Yes: Type2 (4) + Type4 (6) = 10 -> majority
  - Admit=Yes: Type4 (6) -> 6, so Admit=No: 4+4+2=10 -> majority.

  This also works.

  But to keep it simple, we can use the first distribution: 5, 5, 6.

  We'll assign each participant one of these three types.

  However, note that we don't want the participants to know the distribution. We will assign the viewpoints privately.

  Step-by-Step Procedure:

  1. Introduction (5 minutes)
     - Explain the context: We are an admissions committee for a prestigious program. We have one candidate to consider.
     - The rule: The candidate must be both qualified on merit and admissible given capacity constraints to be admitted. So, two conditions must be met.
     - Each committee member will receive a private assessment of the candidate on these two criteria. They must then vote individually on:
          a) Is the candidate qualified? (Yes/No)
          b) Is the candidate admissible? (Yes/No)
          c) Should the candidate be admitted? (Yes/No)
     - Emphasize that for (c), they must follow the rule: Admit only if both (a) and (b) are Yes.

  2. Assign Viewpoints (5 minutes)
     - Hand out ballots (see below for ballot design) that are pre-filled with the individual's assigned viewpoint. But note: we don't want them to see the pattern. So we assign randomly the three types (5 of type1, 5 of type2, 6 of type3) without revealing the distribution.

     Ballot Design:

     We'll have a slip of paper for each participant that says:

     "Your private assessment:
      - The candidate is Qualified: [ ]
      - The candidate is Admissible: [ ]

      Based on the rule, you must decide whether to admit the candidate.

      Please mark your votes on the following:

      a) Qualified? (Yes or No)  [pre-filled with their assigned Q]
      b) Admissible? (Yes or No) [pre-filled with their assigned A]
      c) Admit? (Yes or No)      [they must fill this in themselves, but we expect consistency]

      However, note: We want them to vote consistently. So we can pre-fill (c) as well? But we want them to think. Alternatively, we can leave (c) blank and have them compute it. But we must ensure they follow the rule.

     We can do:

     "Based on your assessment above, and the rule that the candidate is admitted only if both qualified and admissible, please mark your vote for (c)."

     But to avoid mistakes, we can pre-fill (c) and tell them that their assessment is fixed and they must vote accordingly. However, we want them to engage. So let them compute (c).

     Alternatively, we can give them the two premises and then they must vote on the conclusion according to the rule. We can have a worksheet that says:

     "Given your votes on (a) and (b), what is your vote on (c)? Remember: Admit only if both are Yes."

     So we can have:

     Ballot:

     Your assigned view:
       - Qualified: [ ] Yes   [ ] No    (pre-filled by circling or checking one)
       - Admissible: [ ] Yes   [ ] No   (pre-filled by circling or checking one)

     Then, based on the rule, your vote on admission is:
          Admit? [ ] Yes   [ ] No

     They have to mark the Admit part. We will collect the ballots.

     How to pre-fill without them seeing others? We can prepare 16 ballots:

     For Type1 (5 ballots): 
          Qualified: Yes (circled)
          Admissible: No (circled)
          (They should mark Admit: No)

     For Type2 (5 ballots):
          Qualified: No (circled)
          Admissible: Yes (circled)
          (They should mark Admit: No)

     For Type3 (6 ballots):
          Qualified: Yes (circled)
          Admissible: Yes (circled)
          (They should mark Admit: Yes)

     We hand these out randomly.

  3. Individual Voting (5 minutes)
     - Participants receive their ballot with the pre-filled Qualified and Admissible.
     - They then must mark their vote for Admit based on the rule.
     - Collect the ballots.

  4. Tabulation (15 minutes)
     - We will tabulate in three stages:

       Stage 1: Tabulate the votes on Qualified.
          - Count the number of Yes and No for Qualified.

       Stage 2: Tabulate the votes on Admissible.
          - Count the number of Yes and No for Admissible.

       Stage 3: Tabulate the votes on Admit.
          - Count the number of Yes and No for Admit.

     - Also, we want to see if the group followed the rule? But note: the group as a whole might not.

     We will do this publicly (e.g., on a whiteboard).

     Expected results:

          Qualified: 
              Yes: 11 (5 from Type1 + 6 from Type3) 
              No: 5 (Type2)

          Admissible:
              Yes: 11 (5 from Type2 + 6 from Type3)
              No: 5 (Type1)

          Admit:
              Yes: 6 (Type3)
              No: 10 (Type1 and Type2: 5+5)

     So we have:
          Majority for Qualified: 11>5
          Majority for Admissible: 11>5
          Majority against Admit: 10>6

     This is inconsistent because if we follow the rule, having both premises true should lead to Admit, but the group vote on Admit is negative.

  5. Reveal the Inconsistency and Debrief (50 minutes remaining? Let's break it down)

     Total time: 80 minutes. We've used 5 (intro) + 5 (assign and vote) + 15 (tabulation) = 25 minutes. So 55 minutes left.

     Debrief Structure:

     a) Present the results (5 minutes): Show the three tallies and note the majorities.

     b) Ask the group: What do they notice? (5 minutes) 
          - They should see that individually they all followed the rule (if they did) but collectively the group has both premises true but the conclusion false.

     c) Explain the two aggregation methods (20 minutes):

          - Premise-based: We aggregate the premises (Qualified and Admissible) and then apply the rule to the group-aggregated premises.
            In this case: 
                Group says Qualified? Majority says Yes -> so Qualified.
                Group says Admissible? Majority says Yes -> so Admissible.
            Then by the rule: Admit = Qualified AND Admissible -> so Admit.

          - Conclusion-based: We aggregate the conclusion (Admit) directly. 
            In this case: Majority says No -> so do not admit.

          In our exercise, we did both. We aggregated the premises and also aggregated the conclusion. And we got different results.

     d) Discuss the paradox (10 minutes): 
          - This is known as the discursive dilemma (or doctrinal paradox). 
          - It shows that even when every individual is perfectly consistent, the group as a whole might be inconsistent if we try to aggregate both ways.

     e) Connect to the impossibility results (10 minutes):
          - We can mention that this is a simplified version of a more general problem in social choice. 
          - One central aspect that we simplified: We assumed that everyone follows the rule without error. In reality, there might be errors. Also, we are using majority rule which is a specific aggregation method. 
          - The general impossibility results (like Arrow's theorem) show that there is no perfect way to aggregate individual preferences or judgments that always satisfies a set of desirable properties. 
          - But note: here we are not aggregating preferences but judgments on propositions. The specific problem we see is that the group might violate the logical constraint (the rule) even when every individual satisfies it.

          The central aspect we must state explicitly: The exercise illustrates that collective rationality (in the sense of satisfying the logical rule) can be in conflict with the use of majority voting on each proposition independently. In particular, the group may fail to satisfy the rule even when every individual does.

     f) Open discussion (5 minutes): Any questions or comments.

  Likely Facilitation Problems and Remedies:

  1. Problem: Participants might not understand the rule for admission.
     Remedy: Explain clearly at the beginning and provide an example. Also, have the rule written on the board and on the ballot.

  2. Problem: Participants might make mistakes in computing their Admit vote.
     Remedy: Walk around during the individual voting and offer help. Alternatively, provide a clear instruction: "If you marked Qualified as Yes and Admissible as Yes, then Admit must be Yes. Otherwise, Admit must be No." Also, in the ballot, we can have that instruction.

  3. Problem: During tabulation, participants might question the pre-assigned viewpoints.
     Remedy: Explain that the viewpoints were assigned to simulate a real scenario where committee members have different assessments. Emphasize that the focus is on the collective outcome.

  4. Problem: The debrief might become too abstract.
     Remedy: Use the concrete example and the numbers from the exercise. Keep referring back to the tallies.

  5. Problem: Time management.
     Remedy: Allocate time strictly. Use a timer. The tabulation might take less than 15 minutes? But we have to write and count. So 15 minutes is safe.

  6. Problem: Some participants might have seen similar paradoxes and could spoil the surprise.
     Remedy: In the introduction, don't reveal the paradox. Just say we are exploring group decision making.

  One central aspect simplified and must be stated explicitly:

     We simplified the general problem by using a specific rule (conjunction) and a specific aggregation method (majority). In reality, the impossibility results hold for a wide range of aggregation rules and for more complex logical constraints. We must state that the exercise illustrates a conflict between two methods of aggregation (premise-based vs. conclusion-based) and that this conflict is inherent in collective decision-making when there are logical dependencies among the issues. Moreover, we assumed that every individual was perfectly rational (followed the rule) and that the group is using majority rule on each proposition independently. The general results show that no aggregation rule can always guarantee consistent group outcomes while also satisfying other democratic principles (like respecting unanimity and being non-dictatorial) for all possible configurations of individual judgments.

  But note: We are focusing on the doctrinal paradox. We are not covering the full scope of Arrow's theorem (which is for preferences) or List and Pettit's impossibility theorem (for judgment aggregation). We must state that this exercise is a simplified illustration of a more general impossibility.

  Therefore, in the debrief we state:

     "This exercise illustrates a specific paradox that arises in collective reasoning. There is a more general result in social choice theory: it is impossible to design an aggregation rule that always produces consistent group judgments (like satisfying the logical rule) while also satisfying a set of minimal democratic conditions (such as majority rule on each proposition, or more generally, respecting unanimity and being non-dictatorial) for every possible set of individual judgments. Our exercise shows one instance of this conflict."

  This should be sufficient.

  Let me now write a detailed step-by-step plan with time allocations and materials.

  Total Time: 80 minutes

  Materials:
  - 16 pre-filled ballots (5 of Type1, 5 of Type2, 6 of Type3)
  - Whiteboard or flip chart for tabulation
  - Markers

  Procedure:

  1. Introduction (5 min)
     - Welcome and context: admissions committee for a university program.
     - Rule: Admit if and only if both Qualified and Admissible.
     - Each member gets a private assessment (two facts: Qualified? and Admissible?).
     - They must vote on three questions: two premises (Qualified, Admissible) and the conclusion (Admit). For the conclusion, they must follow the rule.
     - We will collect and tabulate the votes.

  2. Assign Viewpoints and Vote (5 min)
     - Distribute the pre-filled ballots randomly.
     - Participants mark their Admit vote based on their premises and the rule.
     - Collect the ballots.

  3. Tabulation (15 min)
     - Step 1: Count votes for Qualified. Write the tally: Yes: 11, No: 5.
     - Step 2: Count votes for Admissible. Write: Yes: 11, No: 5.
     - Step 3: Count votes for Admit. Write: Yes: 6, No: 10.
     - Note: Write the tallies side by side for comparison.

  4. Debrief (55 min)

     a) Present the results (5 min): Point out the tallies.

     b) Group reflection (5 min): Ask: "What do you notice about these results? Does anything surprise you?"

     c) Explain the two aggregation methods (15 min):
          - Premise-based: 
              Group's Qualified: Yes (11>5)
              Group's Admissible: Yes (11>5)
              Therefore, by the rule, the group should admit: Yes.
          - Conclusion-based:
              Group's Admit: No (10>6) -> so do not admit.
          - We have two different group decisions.

     d) The paradox (10 min):
          - This is known as the doctrinal paradox (or discursive dilemma).
          - Even though every individual followed the rule (so each person's Admit vote was consistent with their premises), when we aggregate by majority on each question independently, the group's set of judgments becomes inconsistent: the premises lead to admit but the conclusion vote is against.

     e) Connection to impossibility results (15 min):
          - This paradox is an example of a more general problem in collective decision making.
          - We must explicitly state: The exercise simplifies by using majority rule and a specific rule (conjunction). In reality, there are general impossibility results that show that no aggregation rule can always produce consistent group judgments (for any set of logical constraints) while also satisfying basic democratic conditions (like non-dictatorship, unanimity, and independence of irrelevant alternatives) for every possible set of individual judgments.
          - The central aspect we simplified: We used majority rule and a specific logical constraint (AND). The impossibility results are broader and apply to many aggregation rules and logical constraints.

     f) Discussion (5 min): Open floor for questions and comments.

  5. Wrap-up (5 min): Thank participants and summarize the key takeaway: collective decision-making on multiple interconnected issues can lead to paradoxes, and this has implications for how we design decision-making procedures in groups.

  Note: The time allocations are approximate and the facilitator should adjust as needed.

  This plan should work within 80 minutes and achieve the learning objective.
answer: |-
  ### Structured Voting Exercise: Admissions Committee Dilemma  
  **Objective:** Illustrate how consistent individual judgments can lead to an inconsistent group verdict via the doctrinal paradox (premise-based vs. conclusion-based aggregation), without naming the phenomenon until debrief.  

  ---

  ### **Step-by-Step Procedure**  
  **Total Time:** 80 minutes  
  **Participants:** 16 non-specialist adults  

  #### **Phase 1: Introduction & Setup** (15 min)  
  1. **Context Setting (5 min)**  
     - Explain the scenario:  
       > "We are an admissions committee deciding on a candidate. Our policy states:  
       > **Admit if and only if the candidate is BOTH Qualified on merit AND Admissible given capacity constraints.**  
       > Each of you will privately assess the candidate’s qualifications and admissibility, then vote on three questions."  
     - Clarify terms:  
       - **Qualified**: Meets academic/experience standards.  
       - **Admissible**: Fits within capacity limits (e.g., budget, space).  
       - **Admit**: Final decision (must follow the policy: `Admit = Qualified AND Admissible`).  

  2. **Distribute Ballots & Assign Viewpoints (10 min)**  
     - Hand out pre-filled ballots (see *Ballot Materials* below) with assigned viewpoints. Use a 5-5-6 distribution:  
       - **Group A (5 participants)**: Qualified = Yes, Admissible = **No** → Admit = No.  
       - **Group B (5 participants)**: Qualified = **No**, Admissible = Yes → Admit = No.  
       - **Group C (6 participants)**: Qualified = Yes, Admissible = Yes → Admit = Yes.  
     - **Key**: Emphasize that participants **must vote individually** based on their assigned assessment.  

  ---

  #### **Phase 2: Individual Voting** (10 min)  
  1. **Instructions:**  
     > "Mark your ballot based on your assigned assessment. For Question 3 (Admit?), apply the policy: *Only vote ‘Yes’ if BOTH Questions 1 and 2 are ‘Yes’*."  
  2. **Collect ballots** privately to avoid influence.  

  ---

  #### **Phase 3: Public Tabulation** (15 min)  
  1. **Tabulate Votes on a Whiteboard:**  
     - **Question 1 (Qualified?)**  
       - Count "Yes" and "No" votes.  
       - *Expected*: Yes = 11 (Group A: 5 + Group C: 6), No = 5 (Group B).  
     - **Question 2 (Admissible?)**  
       - Count votes.  
       - *Expected*: Yes = 11 (Group B: 5 + Group C: 6), No = 5 (Group A).  
     - **Question 3 (Admit?)**  
       - Count votes.  
       - *Expected*: Yes = 6 (Group C), No = 10 (Group A + Group B: 5+5).  

  2. **Display Results Clearly:**  
     | Question          | Yes | No | Majority |  
     |-------------------|-----|----|----------|  
     | 1. Qualified?     | 11  | 5  | Yes      |  
     | 2. Admissible?    | 11  | 5  | Yes      |  
     | 3. **Admit?**     | 6   | 10 | **No**   |  

  ---

  #### **Phase 4: Debrief & Concept Connection** (40 min)  
  **Goal:** Link observations to premise-based vs. conclusion-based aggregation.  

  1. **Reveal Inconsistency (5 min)**  
     - Point out the whiteboard:  
       > "Individually, everyone followed the policy (e.g., if you voted ‘No’ for Qualified/Admissible, you voted ‘No’ for Admit).  
       > But as a group:  
       > - Majority says the candidate **is** Qualified.  
       > - Majority says the candidate **is** Admissible.  
       > - Majority says **do NOT Admit**.  
       > **This violates the policy**. How?"  

  2. **Introduce Aggregation Methods (15 min)**  
     - **Premise-Based Aggregation**:  
       > "If we aggregate **premises first** (Qualified? + Admissible?), then apply the policy:  
       > - Group says Qualified = Yes (11/16).  
       > - Group says Admissible = Yes (11/16).  
       > - Policy: `Admit = Qualified AND Admissible` → **Admit = Yes**.  
       > *But this conflicts with the direct vote on Admit (No).*"  
     - **Conclusion-Based Aggregation**:  
       > "If we aggregate the **conclusion directly** (Admit?):  
       > - Majority says Admit = No (10/16).  
       > *This ignores the premises, so the policy is bypassed.*"  

  3. **Name the Phenomenon (5 min)**  
     - Reveal:  
       > "This is the **doctrinal paradox**. It shows that group decisions can be **logically inconsistent** even when every member is consistent. No voting system avoids this if we vote separately on premises + conclusion."  

  4. **Connect to Broader Theory (10 min)**  
     - **Key Conflict**:  
       > "Premise-based aggregation respects the **policy/logic** (but may ignore members’ final verdicts). Conclusion-based aggregation respects the **final verdict** (but may violate the policy). In real committees, you must **choose one method**—neither is perfect."  
     - **Link to Impossibility Results**:  
       > "This paradox is a simplified example of a **general impossibility**:  
       > - Arrow’s Theorem (for preferences) and the **List-Pettit Theorem** (for judgments) prove that no aggregation rule can *always* be logical, democratic, and decisive.  
       > - **Central simplification here**: We assumed everyone follows the policy perfectly. In reality, disagreements on rules or errors complicate this further."  

  5. **Discussion Q&A (5 min)**  
     - Prompt: "When should committees use premise-based vs. conclusion-based voting? What risks arise?"  

  ---

  ### **Ballot Materials**  
  **Pre-Filled Ballot Template** (Hand out 16 unique ballots):  
  ```  
  ADMISSIONS COMMITTEE BALLOT  

  Your private assessment (circle one):  
  1. Qualified on merit?    Yes / No  
  2. Admissible given capacity?   Yes / No  

  Based on the policy (Admit ONLY if BOTH are Yes), vote:  
  3. Admit?   Yes / No  
  ```  
  - **Group A (5 ballots)**: Pre-circle "Yes" for Q1, **"No"** for Q2.  
  - **Group B (5 ballots)**: Pre-circle **"No"** for Q1, "Yes" for Q2.  
  - **Group C (6 ballots)**: Pre-circle "Yes" for Q1, "Yes" for Q2.  

  ---

  ### **Facilitation Problems & Remedies**  
  1. **Problem**: Participants question assigned viewpoints ("Why am I voting this way?").  
     - **Remedy**: Stress anonymity and realism:  
       > "In real committees, members bring different perspectives. Your assignment reflects confidential expert assessments."  

  2. **Problem**: Errors in applying the policy (e.g., voting "Admit=Yes" despite one "No").  
     - **Remedy**: Use a **practice example** before voting:  
       > "If your ballot says Qualified=No and Admissible=Yes, what should Admit be? (Answer: No)."  

  3. **Problem**: Dominant participants swaying discussion during tabulation.  
     - **Remedy**: Use **silent reflection** before revealing tallies:  
       > "Write down your predictions privately. We’ll compare after results."  

  4. **Problem**: Time crunch during debrief.  
     - **Remedy**: Prioritize clarity:  
       - Use the whiteboard to map aggregation methods visually.  
       - Skip Q&A if needed; provide handout summaries.  

  ---

  ### **Simplified Aspect of Impossibility Results**  
  The exercise **simplifies the assumption of complete voter competence**. Participants are assumed to:  
  - Understand and perfectly apply the policy (`Admit = Qualified AND Admissible`).  
  - Vote truthfully without strategic behavior.  
  - Hold judgments free of ambiguity.  

  **Explicit Statement for Debrief**:  
  > "In reality, voters may misapply rules, act strategically, or interpret criteria differently. General impossibility theorems (e.g., List-Pettit) show that **even with perfectly competent voters**, no aggregation method guarantees consistent group outcomes while respecting democracy and logical constraints. Our exercise isolates the core conflict: premise-based vs. conclusion-based voting."  

  ---

  ### **Timeline Summary**  
  - **Phase 1**: 15 min (Setup)  
  - **Phase 2**: 10 min (Voting)  
  - **Phase 3**: 15 min (Tabulation)  
  - **Phase 4**: 40 min (Debrief)  
  **Total**: 80 minutes
