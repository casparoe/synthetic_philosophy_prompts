  **Question:** 

  Galen Strawson's Basic Argument contends that to be truly morally responsible for one's actions, one must be truly responsible for how one is (in the relevant mental respects). This leads to an infinite regress that only ends with the impossible demand for self-creation. Consider an agent, Vesper, who has existed for an infinite past. At each of infinitely many earlier stages, Vesper deliberately reshaped her own character in ways for which she was, by hypothesis, responsible. Thus, for every state of her character, there is an earlier state that she formed responsibly. There is no first act and no moment at which she brought herself into being.

  (a) Does Strawson's argument require that the chain of responsibility terminate in a first act of self-formation (so that without such a termination, Vesper cannot be responsible)? Or does the argument require origination (so that even an infinite chain of self-formations fails because Vesper did not create herself)? Explain which reading the argument requires and what follows for Vesper's case in each interpretation.

  (b) Is true moral responsibility, as the argument conceives it, a property that comes in degrees (so that even a finite agent who is partially self-formed might have some responsibility) or a threshold property (so that if one fails to meet the condition of self-creation, one has none at all)? What does this choice imply for how we should understand ordinary practices of blame?

  (c) Suppose a theorist rejects the demand for self-creation and instead holds that moral responsibility only requires being responsive to reasons. What must such a theorist concede about the notion of desert?

  **Instructions:** Your answer must be based solely on the argument and the case described. Do not cite any authors or texts. Address all parts (a), (b), and (c). 

