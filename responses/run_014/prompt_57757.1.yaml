answer: |-
  ### 1. Examination Question  
  **Question:** Galen Strawson's Basic Argument contends that genuine moral responsibility for one's actions requires being genuinely responsible for one's mental character (e.g., values, desires). This demand generates a regress: to be responsible for how one is now, one must have been responsible for one's prior character, and so on indefinitely, terminating only in self-creation—an impossible feat. Now consider **Vesper**, an agent who has existed for an infinite past. At each of infinitely many earlier stages, Vesper deliberately reshaped her own character in ways for which she was, by hypothesis, responsible. Thus, for every state of her character, there is an earlier state she formed responsibly, but there is no first act and no moment of self-creation.  

  (a) Does Strawson’s argument require that the chain of responsibility **terminate** in a first act (so Vesper might satisfy it), or does it require **origination** (so Vesper’s infinite chain still fails)? Explain which reading the argument compels and what follows for Vesper in each case.  
  (b) Is true moral responsibility, per the argument, a **quantity admitting degrees** (so finite agents retain partial responsibility) or a **threshold property** (so failure at any point voids all responsibility)? What does this imply for ordinary blame?  
  (c) If a theorist grounds responsibility in **responsiveness to reasons** (not origination), what must they concede about **desert**?  

  **Instructions:** Answer all parts. Base responses solely on the argument and Vesper’s case. **Do not cite any authors or texts.**  

  ---

  ### 2. Model Answer (710 words)  
  Strawson’s Basic Argument asserts that true moral responsibility demands self-creation: one must be the ultimate source of one’s character. The impossibility of self-creation renders responsibility incoherent. Vesper’s case—an infinite chain of responsible self-formations without a first act—tests whether the argument’s failure condition is the absence of termination (a finite chain) or the absence of origination (self-causation).  

  **(a)** The argument requires **origination**, not merely termination. If termination were the demand—a finite sequence ending in a self-forming act—Vesper’s infinite regress might seem to avoid the problem. Her character is endlessly shaped by prior responsible choices, so no stage lacks a responsible precursor. Yet Strawson’s regress does not object to infiniteness but to the lack of an *uncaused cause*. Every act in Vesper’s past depends on a prior state she did not create; she merely transforms given material. Origination demands self-creation *ex nihilo*, making one the author of one’s existence. Vesper, despite her infinite history, never originates her initial self. Thus, on the termination reading, she escapes the regress but fails on origination. The argument compels the latter: responsibility requires being a *causa sui*, which Vesper (like all agents) cannot achieve.  

  **(b)** Responsibility, per the argument, is a **threshold property**, not gradable. The regress shows that responsibility is binary: either one meets the condition of self-creation (threshold crossed) or one does not (threshold failed). If Vesper fails at origination, no link in her infinite chain is truly responsible, as each act inherits its authority from an uncreated source. This holds for finite agents too. If I reshape my character today, my capacity to do so depends on an earlier self I did not create. Since self-creation is impossible, *no one* is truly responsible. Consequently, ordinary blame—which assumes agents *deserve* retribution or reward for actions—is undermined. Blame might serve practical aims (e.g., deterrence), but it cannot rest on claims of ultimate desert. If responsibility were gradable, we might assign "partial" desert for partial self-formation. But the argument’s structure—collapse without self-creation—precludes degrees. Threshold failure voids desert entirely.  

  **(c)** A theorist substituting reason-responsiveness for origination must concede that **desert is not ultimate** but **conditional**. If responsibility requires only that agents recognize and act on reasons (e.g., moral facts), Vesper and finite agents may qualify. However, without origination, an agent’s reason-responsive faculties (e.g., rationality, conscience) derive from unchosen causes (biology, upbringing). Thus, while the agent may "deserve" blame for failing reasons they *could* grasp, this desert is shallow: it traces to factors beyond their control. Desert becomes instrumental—a tool for social regulation—not a deep moral fact about the self as first cause. The theorist preserves accountability but abandons the idea that anyone *ultimately* deserves anything for their character.  

  In sum, Strawson’s argument, by demanding origination, makes true responsibility impossible for Vesper and humans alike. It is threshold-based, nullifying desert in ordinary blame. Shifting to reason-responsiveness salvages practice but concedes that desert is provisional, not foundational.  

  ---

