    - Step 2: No self-reference.  
    - Step 3: `B` doesn’t exist → Analyst chooses permanent unverified? **Yes** → Admit A as `UNVERIFIED` (level 1,000,000).  
  - **Triage B**:  
    - Step 1: References `A`.  
    - Step 2: No self-reference.  
    - Step 3: `A` exists → Proceed.  
    - Step 4: `B.level = 1,000,000 + 1 = 1,000,001`.  
    - Step 5: Admit B.  
  - **Outcome**: Both admitted. A is permanently `UNVERIFIED`, breaking the cycle. Engine evaluates B using A’s unverified status (e.g., "A is false" → false if unverified ≠ false).  

  **Case 2: Self-Referential Claim**  
  - Claim: "This claim is unverified." (References itself)  
  - **Triage**:  
    - Step 1: References own future ID.  
    - Step 2: Self-reference → **REJECT**.  
  - **Outcome**: Rejected (self-reference violates hierarchy).  

  **Case 3: Regulatory Bulletin**  
  - Bulletin: 100 claims. Claim 100: "All claims in this bulletin (1-100) are true." (References 1-100, including itself).  
  - **Triage for Claim 100**:  
    - Step 1: References 1-100.  
