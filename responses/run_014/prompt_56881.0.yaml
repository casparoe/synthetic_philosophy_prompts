  - **Why?** Self-reference is irreducible and violates the hierarchy. The engine will deadlock if admitted.  
  - **Least-Bad Workaround**:  
    1. **Mangle Claim 100**: Change it to "Claims 1-99 in this bulletin are true." (Remove self-reference).  
    2. **Admit Mangled Claim**:  
