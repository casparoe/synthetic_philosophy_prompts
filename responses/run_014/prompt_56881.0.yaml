  ### Procedure for Claim Triage: Preventing Circular Deadlocks  
  **Grounding in Theory**: We use Tarski’s hierarchy (claims about claims must be "higher-level" than their targets) and fixed-point logic (circular references default to "unverified"). Paraconsistency is ignored—contradictions break the system. Key distinctions:  
  - **Must keep**: Reference direction (A → B = A is "higher-level" than B), acyclicity (no loops), and permanent unverifiability (breaks cycles).  
  - **Can drop**: Truth-value nuances (e.g., "partially true")—statuses are binary (`true`/`false`) or `unverified`.  

  **Procedure** (run for each new claim `C_new`):  
  1. **Extract References**:  
     - *Question*: "List all claim IDs referenced in `C_new`."  
     - *Sufficient Answer*: Comma-separated IDs (e.g., `4711, 8848`). If none, skip to step 5.  
     - *Confidence*: Engineering rule (prevents ambiguity).  

  2. **Self-Reference Check**:  
     - *Question*: "Does `C_new` reference its **own future ID**?"  
     - *Sufficient Answer*: Yes/no.  
     - *Termination*: If **yes**, **REJECT**.  
     - *Confidence*: Theory-backed (self-reference violates Tarski’s hierarchy).  

  3. **Reference Existence Check**:  
     - *Question*: "Do all referenced claims **already exist** in the database?"  
     - *Sufficient Answer*:  
       - **Yes**: Proceed to step 4.  
       - **No**: Ask: "Can `C_new` be **permanently unverified**?"  
         - If **yes**, admit as `UNVERIFIED` (level = `MAX_LEVEL + 1`).  
         - If **no**, **REJECT**.  
     - *Termination*: Admit as `UNVERIFIED` or reject.  
     - *Confidence*: Engineering rule (missing references risk future cycles).  

  4. **Level Assignment**:  
     - *Action*: Fetch levels of referenced claims. Set `C_new.level = max(referenced_levels) + 1`.  
     - *Escalation*: If referenced claims have no levels (database error), **ESCALATE TO SUPERVISOR**.  
     - *Confidence*: Theory-backed (Tarski’s hierarchy prevents loops).  

  5. **Admit Claim**:  
     - *Action*: Insert `C_new` with status `unverified` (engine evaluates later).  
     - *Termination*: Admit.  

  **Decision Points Wearing Procedure Costume**:  
  - Step 3 ("permanently unverified?"): Policy choice trading usefulness for safety.  
  - Step 4 (level assignment): Assumes existing graph is acyclic—escalate if corrupted.  

  **Expected Misfires**:  
  - False negatives: Rejects non-circular claims with missing references (if analyst declines unverified status).  
  - Complexity: Long reference chains inflate levels (safe but inelegant).  

