  - **Decision**:
    - The narrow class has a small sample (10) and the broad class is heterogeneous (due to trend) and gives a lower probability. We cannot ignore the trend. We might use the broad class but only recent data: then 5/15=33.3%. The narrow class is 5/10=50%. They are still different (33% vs 50%).
    - We are forced to a judgment call: We might weight the two estimates? Or we can use a model that accounts for the current conditions and the trend. But the procedure says: if they are inconsistent and we cannot resolve, then we might not issue a number? Or we issue a number with a note.

    Given the discrepancy and the small sample in the narrow class, and the trend in the broad class, we might decide to issue a number but with a wide interval? Or we might say: "based on current conditions, the probability is elevated, but the exact number is uncertain". 

    However, the procedure should be strict: if the two acceptable classes (after accounting for trends) are giving probabilities that differ by more than a tolerance (say 15 percentage points) and we have no way to reconcile, then we do not issue a single number. We might issue a range (like 30-50%) and explain the discrepancy.

    Alternatively, we might use the narrow class and note the small sample size. But the procedure says: if the sample size is below N_min and we cannot use a broader class without introducing heterogeneity, then it's a judgment call.

    **Conclusion for Case 1:**
    - We have two estimates: 50% (narrow, small sample) and 33% (broad, adjusted for trend). The difference is 17 percentage points, which is above our tolerance (say 10%). So we cannot issue a single number. We might issue an interval [33%, 50%] and explain, or we might say "we are not confident in a single number, but the probability is between 33% and 50%". Alternatively, we might use an average (like 40%) but that's a judgment call.

    Given the procedure, we might reach the judgment call step. We note that the narrow class is more relevant but small, and the broad class is adjusted and has a moderate sample. We decide to issue 40% and note: "based on a combination of recent historical data and current conditions".

  **Case 2: "1 in 50 year flood" probability for a river where a dam upstream got built 20 years ago and totally changed the flow regime.**

  - **Step 1: Define the event.**
    - Event: a flood with an annual exceedance probability of 0.02 (1 in 50 years). We are estimating the probability that such a flood occurs in the next year.

  - **Step 2: Candidate reference classes.**
    - Narrow: The period after the dam was built (last 20 years).
    - Broad: The entire historical record (say 100 years, but note the dam changed the regime).

  - **Step 3: Data availability.**
    - Narrow: 20 years of data (post-dam).
    - Broad: 100 years (pre-dam and post-dam).

  - **Step 4: Homogeneity in broad class.**
    - The broad class is not homogeneous because the dam changed the flow. So we must split into pre-dam and post-dam.

  - **Step 5: Trade-off.**
    - Narrow (post-dam): 20 years of data. We haven't observed any flood of that magnitude? Or we have observed one? We need to estimate a 1-in-50-year event from 20 years. This is challenging because we might not have any exceedance. We can use extreme value theory to fit a distribution, but with 20 points, the uncertainty is huge.
    - Pre-dam: 80 years of data. We might have a few large floods. But the dam changed the system so that pre-dam data is not representative.

  - **Step 6: Structural changes.**
    - The dam was built 20 years ago and changed the flow. We cannot use pre-dam data without adjustment. Can we adjust? We might use a hydrological model to simulate what the flows would have been without the dam? Or we can adjust the pre-dam data to post-dam conditions? This is complex and requires modeling. If we have a reliable model, we can adjust the pre-dam data and then combine with post-dam. But if we don't, then we can only use the post-dam data.

  - **Step 7: Compare probabilities.**
    - If we use only post-dam data: we have 20 years. We can fit an extreme value distribution (e.g., Gumbel) to the annual maxima and estimate the 50-year event. But with 20 years, the confidence interval for the 0.02 quantile is very wide. 
    - If we use adjusted pre-dam data: we might get an estimate, but the adjustment is uncertain.

    Without adjustment, we cannot use the pre-dam data. So the only class is the post-dam period.

  - **Decision:**
    - The narrow class (post-dam) has only 20 years. To estimate a 1-in-50-year event, we require at least 50 years? Actually, we can estimate with 20 years, but the estimate is highly uncertain. The standard practice is to use the available data but report the uncertainty. However, the procedure might set a requirement: for a T-year event, we need at least T years of data? That would require 50 years. But we have only 20. 

    Alternatively, we can use a regional approach (borrowing strength from similar rivers) but that's beyond the reference class.

    **Conclusion for Case 2:**
    - We cannot use the broad class without adjustment. The narrow class has too small a sample (20 years) to reliably estimate a 50-year event. The procedure should say: **do not issue a number** without adjustment via a hydrological model. If we have a model, then we can use the adjusted data (both pre and post) and then we have 100 years. Then we can estimate. But without that, we cannot issue a number.

    The procedure might note: if we have to issue a number, we must use the post-dam data and note the high uncertainty (e.g., the 95% confidence interval for the 50-year flood might be from a 10-year to a 200-year event). But the procedure's strict interpretation: without a model to adjust the pre-dam data, we do not have an acceptable reference class (the narrow class is too short, the broad class is heterogeneous and unadjustable). So we do not issue a number.

  **Final Decision Procedure in Steps:**

  1. **Define the event.**
     - If not well-defined, stop and redefine.

  2. **List candidate reference classes (at least one narrow and one broad).**

  3. **For each candidate class:**
     - Check sample size and data quality.
     - If sample size < N_min (default 30 for common events, but for rare events we require at least the return period if possible or use extreme value methods with caution), mark as "small sample".
     - Check for structural changes (e.g., changes in the system). If present, can we adjust? If adjustment is not possible and the change is significant, then exclude the non-representative data and reevaluate sample size.

