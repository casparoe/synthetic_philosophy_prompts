  5. **If a candidate class has sample size >= N_min and is homogeneous (or adjusted for changes), then it is acceptable. Calculate the probability.**

  6. **If multiple acceptable classes:**
     - Compare the probabilities. If the absolute difference is <= tolerance (e.g., 5% for probabilities near 50%, or a relative difference of 10% for extreme probabilities), then choose one (or average) and report.
