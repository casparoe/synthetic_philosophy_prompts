    - Narrow class: sample size of 5 heat waves. For a rare event, 5 events might be acceptable if we are using a Poisson model? But for a probability of a heat wave in the next week, we are not directly counting heat waves per pattern. We might need the number of times the pattern led to a heat wave. Let's say we have 10 occurrences of the pattern and 5 of them had a heat wave. Then we have 5/10 = 0.5. But 10 is small. We might set N_min=30 for the pattern occurrences? But we only have 30 years. This might be a problem.

    Alternatively, we can model the probability using a logistic regression with predictors (like temperature anomalies, pressure patterns) and then we can use the entire dataset. But the procedure is for reference classes, so we stick to that.

    - Broad class: We have 20 heat waves in 2700 days? That's not the same event. We are forecasting a heat wave in the next 3 days? Actually, we are forecasting the occurrence of a heat wave in a specific period. 

