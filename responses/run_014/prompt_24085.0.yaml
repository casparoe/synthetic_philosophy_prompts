prompt: |-
  ok so I'm a junior in philosophy and I'm in a formal ep seminar right now where we just covered the reference class problem, and I'm also interning part time at our state weather service where every shift I have to put out a probability forecast with an interval (like "65% chance of precip in the next 24h, 80% interval for the high is 71 to 83") and my lead keeps going "which reference class did you use for that number?" and I have no principled way to answer. I know the textbook stuff about the specificity principle and how you can nest reference classes as finely as you like, but none of that tells me what to actually do at my desk at 5am.

  Can you write a decision procedure I can run before I sign off on a number: the questions to ask in order, what counts as a good enough answer to each, where the procedure stops and says "don't issue a number," and where it just has to hand off to a human because the question is one of judgment not fact. The thing I really want handled honestly is the tradeoff between a narrow, relevant class (like "days in April when the upper air pattern looks like this") and a broad, data-rich one (like "all April days") — the narrow one is more on point but I might have like 9 examples, the broad one has plenty but is full of junk. I want the procedure to say explicitly when a small sample in a narrow class is a dealbreaker and when it isn't, and to flag which steps are basically judgment calls dressed up as procedure.

  Then run it on two cases: (1) a 3-day heat wave probability for a city that only has 30 years of records, and (2) a "1 in 50 year flood" probability for a river where a dam upstream got built 20 years ago and totally changed the flow regime. I'd expect one of those to come out as "you cant responsibly issue that number" and that's fine, I want to see the procedure actually say that when it applies.
reasoning: |-
  We are designing a decision procedure for handling the reference class problem in probability forecasting, particularly for weather and climate-related events. The goal is to balance between narrow (specific but small sample) and broad (less specific but large sample) reference classes. The procedure should guide the user step-by-step until a decision is made to either issue a number, not issue a number, or make a judgment call.

  The procedure will have a series of questions and criteria. We'll design it as a flowchart in text.

  **Decision Procedure for Choosing a Reference Class**

  1. **Define the event precisely.**
     - What exactly are we forecasting? (e.g., "precipitation in the next 24 hours", "high temperature", "flood exceeding a certain level")
     - What is the time and location? What are the relevant conditions?
     - *Good enough*: The event is defined unambiguously in terms of measurable outcomes and conditions.

  2. **Identify the set of candidate reference classes.**
     - Consider both narrow classes (with high specificity) and broad classes (with more data).
     - Narrow classes: defined by current conditions (e.g., same month, similar atmospheric patterns, time of day, etc.).
     - Broad classes: defined by fewer conditions (e.g., all days in April, all days in the historical record).
     - *Good enough*: At least one narrow and one broad class are identified. If not, go back and think of more.

  3. **Assess data availability for each candidate class.**
     - For each candidate reference class, determine the sample size (number of past instances) and the quality of the data (e.g., are the measurements reliable?).
     - *Good enough*: We have at least an estimate of the sample size and any known data limitations.

  4. **Check for homogeneity within each broad class.**
     - For broad classes: is there evidence that the event probability is constant across the entire class? If not, the broad class might be too heterogeneous (contains "junk").
     - Look for systematic variations (e.g., trends over time, subgroups with different probabilities). Use statistical tests if available, or expert knowledge.
     - *Good enough*: If the broad class appears homogeneous by expert judgment or by a statistical test (if data allows), then proceed. Otherwise, break it into subgroups and go back to step 2.

  5. **Evaluate the trade-off between specificity and sample size.**
     - For each narrow class:
       - If the sample size is at least N_min (a predetermined minimum, say 30 for continuous variables or at least 10 events for rare events), then this narrow class might be acceptable.
       - If the sample size is below N_min, then we must consider whether the class is so specific that we cannot generalize. We might then look for a slightly broader class (but still more specific than the broadest) that has at least N_min.
     - For the broad class: if it passes the homogeneity check and has a large sample (>= N_min), then it is acceptable.

  6. **Check for known structural changes.**
     - Are there known changes in the system that would make the past data non-representative? (e.g., a dam was built, a change in measurement technique, urbanization, climate change trends).
     - If yes, then:
       - Can we adjust the data to account for the change? (e.g., using a model to simulate pre-dam conditions, or detrending)
       - If adjustment is possible and reliable, then apply it and use the adjusted data.
       - If not, then we might have to exclude data before the change. Then we must reevaluate the sample size in the reference class (go back to step 5). If the sample size becomes too small, we might not be able to issue a number.

  7. **Compare probabilities from different classes.**
     - If we have at least one candidate class that meets the criteria (adequate sample and homogeneity or adjusted for changes), calculate the probability for each.
     - If the probabilities from different acceptable classes are similar (within a tolerance, say 5 percentage points for probabilities around 50%, or relative difference of 10% for rare events), then we can choose any (or average) and issue the number.
     - If they are not similar, then we must consider:
       - Which class is more relevant? (e.g., the narrow class might be more relevant if the conditions are very specific and the broad class is too heterogeneous.)
       - If the narrow class is too small and the broad class is too heterogeneous, we might not be able to issue a number.

  8. **Decision points:**
     - **Issue a number**: if at least one reference class meets the criteria (adequate sample, homogeneity, and no unresolved structural changes) and the probabilities from acceptable classes are consistent, then issue the number (with the interval if applicable) and note the reference class used.
     - **Do not issue a number**: if no reference class meets the criteria, or if the probabilities from acceptable classes are inconsistent and we cannot resolve the discrepancy by judgment or adjustment.
     - **Judgment call**: if we are forced to choose between a very small sample in a narrow class and a broad class with known heterogeneity, then we must use expert judgment. In this case, we can issue a number but must note the uncertainty and the judgment made.

  **Predetermined Parameters:**
  - N_min: minimum sample size. This might depend on the event. For common events (like daily temperature) N_min=30 (a rule of thumb for the Central Limit Theorem). For rare events (like a 1 in 50 year flood), we might require at least 50 years of data (so we have about one event) but note that for rare events we often use extreme value distributions and fit with whatever data we have. For rare events, we might relax the sample size requirement and rely more on modeling.

  **Now, run the procedure on two cases.**

