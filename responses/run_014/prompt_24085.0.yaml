          - Else, do not issue a number.

  8. **If structural changes prevent using historical data without adjustment and adjustment is not feasible, then do not issue a number without a model-based adjustment.**

  **Note:** Judgment calls are required in steps 4 (homogeneity), 6 (choosing between inconsistent classes), and 7 (deciding when a small sample is acceptable). The procedure should flag these as judgment steps.
answer: |-
  Below is a decision procedure for handling the reference class problem in your probability forecasts. It's designed as a step-by-step checklist with explicit thresholds for when to proceed, when to reject a number, and where judgment is unavoidable. The procedure prioritizes **relevance** (narrower classes) but enforces **reliability** (sample size/data quality) constraints. Key parameters:
  - **N_min**: Minimum sample size for a reliable estimate (default = 30, adjustable per context).
  - **Tolerance**: Maximum acceptable difference between broad/narrow class probabilities (default = 5 percentage points for common events, 10% relative difference for extremes).

  ---

  ### **Reference Class Selection Procedure**
  **Goal**: Choose a reference class for probability estimation or reject the estimate.

  1. **Define the Target Event**  
     Ask: *"Is the event precisely defined (what, where, when, conditions)?"*  
     - ✅ **Proceed if**: Event is unambiguous (e.g., "rainfall > 1mm in next 24h at Station X").  
     - ❌ **Reject if**: Vague (e.g., "bad weather").  
     - *Judgment call*: Defining "similar conditions" (e.g., "similar pressure patterns").

  2. **Generate Candidate Reference Classes**  
     Ask: *"What are the narrowest plausible classes (specific) and broadest reliable classes (data-rich)?"*  
     - **Narrow class**: Current conditions + key factors (e.g., "April days with 500mb ridge < 560dm").  
     - **Broad class**: Minimal factors (e.g., "all April days" or "all days since 1990").  
     - *Judgment call*: Which factors are relevant (e.g., humidity vs. wind direction).  
     - ❌ **Reject if**: No broad class has N_min samples.

  3. **Assess Data Quality**  
     Ask: *"Is data for each class complete, consistent, and representative?"*  
     - ✅ **Proceed if**: Data covers >80% of cases, no known measurement biases.  
     - ❌ **Reject if**: Gaps >20% or systematic errors (e.g., sensor changes).  
     - *Judgment call*: Whether gaps introduce bias.

  4. **Test for Structural Breaks**  
     Ask: *"Are there known changes making past data non-representative (e.g., new dam, urbanization)?"*  
     - ✅ **Proceed if**: No breaks, or adjustments exist (e.g., statistical normalization).  
     - ❌ **Reject if**: Breaks exist and can’t be adjusted (e.g., no model for dam impacts).  
     - *Judgment call*: Severity of breaks.

  5. **Evaluate Narrow Class**  
     Ask: *"Does the narrow class have ≥ N_min samples? If not, is the probability stable with < N_min?"*  
     - ✅ **Proceed if**: Samples ≥ N_min.  
     - ⚠️ **Conditional accept if**: Samples < N_min but:  
       - Probability is stable (e.g., binomial 95% CI width ≤ tolerance), OR  
       - External evidence supports generalizability (e.g., physics-based models).  
     - ❌ **Reject if**: Samples < 5, or variance is high (CI width > tolerance).

  6. **Compare Broad vs. Narrow Probabilities**  
     Ask: *"Do broad and narrow class probabilities agree within tolerance?"*  
     - ✅ **Proceed if**: |P_broad - P_narrow| ≤ tolerance. Use narrow class.  
     - ⚠️ **Judgment call if**: |P_broad - P_narrow| > tolerance:  
       - Prefer narrow class if conditions are "highly specific" (e.g., rare atmospheric setup).  
       - Prefer broad class if narrow sample is tiny or conditions are common.  
     - ❌ **Reject if**: Disagreement > tolerance and no defensible choice.

  7. **Final Sanity Check**  
     Ask: *"Does the estimate align with physical constraints or expert intuition?"*  
     - ✅ **Issue number** with reference class noted.  
     - ❌ **Reject if**: Estimate contradicts established knowledge (e.g., 0% chance during a hurricane).  
     - *Judgment call*: When to override statistical estimates.

  ---

  ### **Case Applications**
  #### **Case 1: 3-Day Heat Wave Probability (City, 30-Year Records)**  
  - **Event**: 3 consecutive days > 35°C in next week.  
  - **Narrow class**: "April days with similar upper-air patterns" (n=9).  
  - **Broad class**: "All April days" (n=900).  
  - **Data**: Homogeneous, no structural breaks.  

  1. **Narrow class**: n=9 < N_min (30).  
     - Check stability: Binomial 95% CI for (e.g.) 2/9 events → CI ≈ 5%–50% (width 45% > 5% tolerance). **Unstable**.  
  2. **Broad class**: P_broad = 3% (27 heat waves in 900 days).  
  3. **Compare**: P_narrow ≈ 22% (2/9). |22% – 3%| = 19% > tolerance (5%).  
  4. **Judgment**: Narrow class unstable and disagrees with broad class.  
     - *Option A*: Use broad class (3%) but note lower relevance.  
     - *Option B*: Use model-based adjustment (e.g., logistic regression with covariates).  
  5. **Procedure Outcome**: ⚠️ **Judgment call required**. Small sample in narrow class is a dealbreaker for direct frequency estimate. If no model exists, issue broad class estimate with disclaimer: *"Based on all April days; current patterns increase uncertainty."*

  #### **Case 2: "1-in-50-Year Flood" Probability (River with Dam Built 20 Years Ago)**  
  - **Event**: Annual flood ≥ 0.98 quantile of historical discharges.  
  - **Narrow class**: "Post-dam era" (n=20 years).  
  - **Broad class**: "Full historical record" (n=100 years).  
  - **Structural break**: Dam altered flow regime; pre-dam data non-representative.  

  1. **Broad class**: Rejected (Step 4) – pre-dam data invalid without adjustment.  
  2. **Narrow class**: n=20 years < 50 (needed for 1-in-50-year event).  
     - Stability: Extreme-value CI for 0.98 quantile ≈ ±40% relative (>>10% tolerance). **Unstable**.  
  3. **Adjustment possible?**: Hydrological model could simulate pre-dam flows, but none available.  
  4. **Judgment**: No reliable class. Narrow sample too small; broad class invalid.  
  5. **Procedure Outcome**: ❌ **Reject estimate**. Issue statement: *"Insufficient data for reliable 1-in-50-year flood estimate due to dam-induced regime change. Use model-based approaches if available."*

  ---

  ### **Key Takeaways**
  - **When small samples are acceptable**: Only if probabilities are stable (tight CIs) or corroborated by models/expertise.  
  - **Where judgment dominates**: Defining "relevant" factors, weighing disagreements, and overriding stats with physics.  
  - **Red flags**: Structural breaks without adjustments, unstable small samples, large broad/narrow discrepancies.  
  - **Practical tip**: For borderline cases, issue intervals (e.g., "40–60% chance") or confidence ratings (e.g., "low/medium/high confidence").  

  This procedure forces explicit tradeoffs between specificity and reliability, ensuring you only issue numbers when statistically defensible—or flag when it’s not. At 5 a.m., when in doubt, **default to transparency**: state your reference class and uncertainty.
