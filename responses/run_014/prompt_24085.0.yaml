    The sample size for the narrow class is 10 (which is below N_min=30) and for the broad class 30 (which meets N_min).

  - **Step 6: Structural changes.** 
    - We know there is climate change. The last 10 years might be warmer. We should check if the heat waves are increasing. If so, we might use only the last 15 years? Then the broad class becomes 15 years: 5 events? Then 5/15. But the narrow class would then be even smaller.

    Without adjusting, we have to note that the broad class might be non-stationary.

  - **Step 7: Compare probabilities.**
    - Narrow: 50% (5/10)
