  - **Step 3: Data availability.**
    - Narrow: We have 30 years of data. But how many instances of the specific upper air pattern? Let's say we have about 10 such patterns (so 10 events? Actually, each event might cover several days, but we are counting heat waves which are multi-day). Alternatively, we might count the number of heat waves that occurred under similar patterns. Let's assume we have 5 heat waves in the narrow class (from 10 occurrences of the pattern).
    - Broad: 30 years * 90 summer days = 2700 days. We have, say, 20 heat waves (3-day events) in the historical record.

  - **Step 4: Homogeneity in broad class.**
