answer: |-
  Here’s a structured teaching plan to achieve your goal, with dependencies, a carrying example, misconceptions, a closing check, and deliberate omissions:

  ---

  ### **Teaching Plan: Unpacking Hume’s Monetary Tension**  
  **Core Objective:** *Disrupt proto-monetarist readings by staging the neutrality/transition paradox as unresolved.*  
  **Time:** 75 minutes  

  #### **Sequence & Dependencies**  
  *(Ordered to build logical tension; each step enables the next)*  
  1. **Money as Instrument vs. Wealth (10 min)**  
     - *Why start here:* Establishes Hume’s foundational distinction.  
     - *Key move:* Contrast "oil" (Essay III) with mercantilist "wheel" metaphors.  
     - *Dependency:* Without this, neutrality seems arbitrary.  

  2. **Closed-Economy Neutrality (10 min)**  
     - *Why now:* Follows directly from "instrument" view.  
     - *Key move:* "Double prices, same real output" – emphasize *after prices settle*.  
     - *Dependency:* Sets up the neutrality baseline to later contrast with transition.  

  3. **Open-Economy Redistribution (15 min)**  
     - *Why now:* Neutrality requires explaining *how* money redistributes globally.  
     - *Key move:* Trace gold flow via trade imbalances (Essay V), **not** physical shipment.  
     - *Dependency:* Explains why inflows/outflows happen *before* price adjustments.  

  4. **The Transition Interval (20 min)**  
     - *Why now:* Reveals the tension – neutrality assumes settled prices, but redistribution *requires* disequilibrium.  
     - *Key move:* Pose the paradox: *How can money be neutral yet stimulate industry mid-flow?*  
     - *Dependency:* Relies on understanding redistribution mechanics.  

  5. **Interest Rate Mechanism (10 min)**  
     - *Why last:* Hume’s interest argument (Essay IV) reinforces neutrality *outside* transition.  
     - *Key move:* Link interest to profits/demand, **not** money stock.  
     - *Dependency:* Isolates transition as the *only* space for non-neutrality.  

  ---

  ### **The Carrying Example: "The Portuguese Gold Discovery"**  
  *(Run twice: first in equilibrium, then mid-transition)*  
  **Setup:** Portugal discovers gold (1750s). Two regions: Portugal (mining) and England (trading partner).  
  **Must have:**  
  - Gradual, uneven spending (miners spend first on local goods/services).  
  - Trade imbalance (Portugal buys English cloth with gold).  
  - Time lag between spending and price adjustments.  
  **Must lack:**  
  - Banking/credit (pure specie).  
  - Simultaneous distribution (gold enters via miners/merchants, not helicopters).  

  **Run 1: Equilibrium (Post-Adjustment)**  
  - Portugal has more gold, English prices rose.  
  - Real output/trade unchanged. Illustrates **neutrality**.  

  **Run 2: Mid-Transition (1–2 years post-discovery)**  
  - Miners hire laborers → local wages rise → demand for English cloth surges.  
  - English producers boost output *before* prices fully adjust → **real industrial stimulus**.  
  - *Crucial:* Show gold flowing to England via trade *during* this period.  

  **Why shipwrecks/mines work:** They avoid presupposing neutrality if inflows are *asymmetric and gradual*. Avoid "lump-sum" framing.  

  ---

  ### **Misconceptions to Preempt**  
  *(Timed to counter as concepts arise)*  
  1. **"Hume = Quantity Theorist"**  
     - *When:* After Step 2 (Neutrality).  
     - *Counter:* Highlight his rejection of direct money-output links outside transition.  

  2. **"Transition = Recommendation for Debasement"**  
     - *When:* During Step 4 (Transition).  
     - *Counter:* Note Hume calls inflation "violent" – transition is observational, not prescriptive.  

  3. **"Physical Gold Shipments"**  
     - *When:* During Step 3 (Redistribution).  
     - *Counter:* Emphasize price-induced trade adjustments (no ships needed!).  

  4. **"Interest Argument = Naive Empiricism"**  
     - *When:* During Step 5 (Interest).  
     - *Counter:* Stress Hume’s causal chain: profits → borrowing demand → interest rates.  

  5. **"Money Doesn’t Matter"**  
     - *When:* After Step 4 (Transition).  
     - *Counter:* Ask: "If money is neutral, why does Hume detail its redistributive *power*?"  

  **Late-Stage Misconception (likely post-Step 4):**  
  - **"Transition effects undermine neutrality"**: Clarify Hume sees transition as *temporary* but structurally necessary for redistribution.  

  ---

  ### **Closing Check Question**  
  **"If Hume witnessed a modern central bank printing money during a recession, would he expect:  
  (a) No long-term effect (neutrality), or  
  (b) Short-term industrial stimulus (transition)?  
  *Justify using his mechanics, not his quotes.*"**  

  - *Why it works:* Forces application of transition logic beyond the text. Neutrality-only answers miss the inflow’s asymmetry.  

  ---

  ### **Omissions to Declare Upfront**  
  **State explicitly:**  
  > *"Today, we omit:  
  > - Hume’s later essays on banks/paper credit (to avoid conflating specie with credit).  
  > - Bullionist debates (19th-century applications distract from Hume’s core tension).  
  > - Mathematical formalizations (Hume’s arguments are causal, not quantitative).  
  > This keeps us focused on the neutrality-transition paradox."*  

  **Coherence Check:** The plan stands without these. Adding banking or equations would dilute the specie/redistribution focus.  

  ---

  ### **Why This Sequence Works**  
  1. Builds from intuitive distinction (oil vs. wheel) to abstract neutrality.  
  2. Uses open-economy mechanics to *necessitate* transition.  
  3. Isolates interest rates as a separate neutrality argument.  
  4. The example’s dual run makes transition *visible*, not theoretical.  
  5. Ends on the unresolved tension – exactly where Hume leaves it.  

  **Final Tip:** Assign 1–2 participants to track the Portuguese example at each stage. Their real-time confusion/clarity will gauge comprehension.
