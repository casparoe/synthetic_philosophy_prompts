  ### Classroom Activity: **The Centered World Betting Game**

  #### **Overview**
  This activity simulates the Sleeping Beauty problem by creating a scenario where students must place bets under conditions of self-locating uncertainty. The core innovation replaces "memory wipes" with **information isolation** and **role randomization** to mimic the disorientation of not knowing "which awakening" one is in. Students act as "Beauties" who awaken in a scenario where the number of active participants depends on a hidden coin flip. By betting on the coin outcome under different conditions (pre-experiment vs. during "awakening"), they confront the halfer-thirder divide through tangible stakes. The debrief explicitly ties their choices to formal arguments (Elga, Lewis, Dutch books).

  ---

  ### **Rules and Setup**  
  **Materials**:  
  - 1 coin (real or simulated).  
  - 15 index cards (5 red, 5 blue, 5 yellow).  
  - Betting slips (pre-printed: "Heads" or "Tails").  
  - Play money ($1 bills, 30 total).  
  - 3 opaque bags (labeled "Pre-Experiment," "Awakening," "Payoffs").  
  - Whiteboard for tracking bets and outcomes.  

  **Roles**:  
  - **"Beauties" (3 students)**: Experience the "awakening." Isolated during key phases.  
  - **"Coin Team" (3 students)**: Flip coin, manage randomization.  
  - **"Bookies" (9 students)**: Facilitate bets, record choices, enforce isolation.  
  - **Instructor**: Narrates, times phases, debriefs.  

  **Timing**: 60 minutes (25 activity, 35 debrief).  

  ---

  ### **Activity Phases**  
  #### **Phase 1: Pre-Experiment Betting (5 min)**  
  *Instructor Script*:  
  > "We’re running an experiment. A fair coin will be flipped. If *heads*, only 1 of 3 Beauties will be ‘awakened.’ If *tails*, all 3 will awaken. Beauties, you’ll be isolated during the flip. First, place a pre-experiment bet on the coin outcome. Bet $1 to win $2 if correct (net +$1), lose $1 if wrong."  

  **Steps**:  
  1. Beauties each receive $2 in play money.  
  2. Each secretly writes "Heads" or "Tails" on a slip, puts it in the "Pre-Experiment" bag with $1.  
  3. Coin Team flips coin (hidden), records result (e.g., "Heads").  
  4. Beauties leave the room (isolated with Bookies).  

  *Why this works*:  
  - Mimics Beauty’s "Sunday knowledge" (P(Heads)=1/2).  
  - Stakes create investment.  

  #### **Phase 2: "Awakening" and Self-Locating Bets (10 min)**  
  *Instructor Script*:  
  > "Beauties, you’re now ‘awakened’ but don’t know the coin result or how many are active. Bookies, if the coin was *heads*, randomly select 1 Beauty using the red cards. If *tails*, select all 3. Give each active Beauty $1 and a betting slip."  

  **Steps**:  
  1. **Randomization**:  
     - Coin Team privately tells Bookies the result.  
     - If heads: Bookies shuffle red cards, draw one to pick a random Beauty.  
     If tails: all Beauties activated.  
  2. **Betting Under Uncertainty**:  
     - Active Beauties receive $1 and a slip. They choose:  
       - **Option A**: Bet $1 on Heads to win $3 (net +$2).  
       - **Option B**: Bet $1 on Tails to win $1.50 (net +$0.50).  
     - Bets placed secretly in the "Awakening" bag.  
  3. **Isolation Enforcement**:  
     - Beauties cannot see each other (Bookies shield interactions).  
     - No communication about who is active.  

  *Why this works*:  
  - **Option A** favors halfers (P(Heads)=1/2 needs >$2 payout to profit).  
  - **Option B** favors thirders (P(Tails)=2/3 needs >$1.50 payout to profit).  
  - Students *feel* uncertainty: "Am I the only one? Why was *I* chosen?"  

  #### **Phase 3: Reveal and Payout (10 min)**  
  1. Coin result revealed.  
  2. **Pre-experiment bets**:  
     - Beauties recover slips from the first bag. Winners get $2.  
  3. **Awakening bets**:  
     - All active Beauties’ slips revealed. Winners paid (Option A: $3, B: $1.50).  
  4. **Whiteboard Tracking**:  
     | Coin | Pre-Exp Bets (Heads:Tails) | Awakening Bets (A:B) | Profit (Halfer/Thirder) |  
     |------|----------------------------|----------------------|--------------------------|  
     | Heads | 2:1                        | 1:0 (if only one active) | Halfer: +$2, Thirder: -$1 |  
     | Tails | 1:2                        | 0:3                  | Halfer: -$3, Thirder: +$1.50 |  

  ---

  ### **Debrief Plan (35 min)**  
  **Goal**: Map student actions to philosophical arguments.  

  #### **Step 1: Surface the Divide (10 min)**  
  - Poll students: "Who profited? Who lost? Why?"  
  - **Halfer logic**: "I bet on Heads during awakening—the coin is fair!"  
  - **Thirder logic**: "I bet on Tails—more awakenings mean it’s likely Tails!"  
  - **Key moment**: Highlight how pre-experiment bets were ~50/50, but awakening bets split the group.  

  #### **Step 2: Formal Arguments (15 min)**  
  | **Moment in Activity** | **Philosophical Link** | **Instructor Script** |  
  |-------------------------|------------------------|------------------------|  
  | Pre-Experiment Bet | Lewis’ "no new evidence" | "Pre-bets had P(Heads)=1/2. Like Lewis, halfers say awakening adds no evidence—just ‘you are awake.’" |  
  | Awakening Bet | Elga’s "centered worlds" | "Thirders see 3 possible awakenings: 1 for Heads, 2 for Tails. Your choice reflected which centered world you thought you were in." |  
  | Payout Discrepancy | Dutch Books | "Halfers lost money if Tails (they overbet Heads). Thirders lost if Heads (underbet Heads). Dutch books exploit inconsistent credences!" |  
  | Role Randomization | Many-Awakenings Variant | "With 3 Beauties, Tails has 3x awakenings—like Elga’s 100-wakings version. Did that pull you toward thirdism?" |  

  #### **Step 3: Limitations and Meta-Lesson (10 min)**  
  - **Memory Wipe Gap**:  
    > "We simulated isolation, but real Sleeping Beauty forgets past awakenings. Here, Beauties *know* they might not be alone—this makes Tails feel likelier. Still, the ‘vertigo’ of not knowing your role is what we aimed for."  
  - **Pedagogical Line**:  
    > "This activity forces you to *act* on credences. Halfers focus on the coin’s fairness; thirders on the awakening structure. The tension isn’t resolvable by logic alone—it’s about how we handle self-locating evidence."  

  ---

  ### **Predicted Issues and Fixes**  
  - **Problem**: Beauties peek/communicate during isolation.  
    **Fix**: Bookies enforce physical separation (e.g., facing corners).  
  - **Problem**: Students don’t grasp payout math.  
    **Fix**: Pre-activity quiz on expected value (e.g., "Bet $1 on X to win $Y: profit?").  
  - **Problem**: Halfer/Thirder split is lopsided.  
    **Fix**: Seed the group—ask a confident halfer/thirder to justify choices first.  
  - **Problem**: Time runs short.  
    **Fix**: Skip pre-experiment bets; focus on awakening stakes.  

  ---

  ### **Why This Design?**  
  1. **Inescapable Uncertainty**:  
     - Random role assignment + isolation mirrors Beauty’s disorientation.  
     - Real money (even play money) makes credences actionable.  
  2. **Halfer-Thirder Tension**:  
     - Asymmetric payouts (Option A vs. B) ensure thirders and halfers *want* different bets.  
  3. **Formal Mapping**:  
     - Dutch books emerge organically from payout disparities.  
     - Coin flip + randomization mirrors the many-awakenings variant.  
  4. **Memory Wipe Workaround**:  
     - Isolation + partial information simulates "not knowing which awakening" without needing amnesia.  

  **Final Tip**: Run the activity twice (e.g., "Round 1: Heads, Round 2: Tails") to gather more data for the debrief. The visceral surprise when payouts hinge on coin results cements the puzzle.
