      Why 3 Sleepers? We want to simulate multiple awakenings without having the same person being woken multiple times (which would require memory wipe). Instead, we can have multiple Sleepers and the coin flip result will determine how many of them are "awakened" (i.e., included in the betting round). Specifically:
        - If the coin is heads: only one Sleeper is randomly chosen to be awakened.
        - If the coin is tails: all three Sleepers are awakened.

      This setup mimics the original problem: when the coin is heads, there is only one awakening; when tails, there are three awakenings. Note: In the original, tails leads to two awakenings, but we are using three Sleepers to make the ratio 1:3 (which is similar to 1:2 in that both are uneven). We can adjust the payoffs accordingly to reflect the 1:2 ratio? However, for simplicity and to avoid fractions, we'll stick with 3 Sleepers and adjust the betting to reflect the 1:3 ratio? But note: the original problem has 1 awakening for heads and 2 for tails. We can instead have 2 Sleepers and then if tails, both are awakened; if heads, one is awakened (randomly). However, with 2 Sleepers, the ratio is 1:2, which is the same as the original. So let's use 2 Sleepers.

      Revised: We'll use 2 Sleepers to match the 1:2 ratio.

      How it maps:
        - Coin lands heads: one awakening -> we randomly choose one Sleeper to be the only one who participates in the betting round.
        - Coin lands tails: two awakenings -> both Sleepers participate in the betting round.

      But note: We cannot have the same person being woken twice because we can't erase memory. So we use two different people to represent the two awakenings in the tails case.

