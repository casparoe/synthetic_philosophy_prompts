               Pre-experiment: she bets $1 on tails at even money (so if tails, she wins $2; if heads, she loses $1).

               Then upon awakening (each time) she is offered a bet on heads at 2:1 odds (so if heads, she wins $2; if tails, she loses $1). She takes it because she thinks P(heads)=1/2 and the payout is 2:1 (so expected value positive? Actually, 1/2 * 2 + 1/2 * (-1) = 0.5, so yes).

