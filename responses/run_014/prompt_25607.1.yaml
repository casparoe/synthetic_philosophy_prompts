  We are designing a classroom activity to help students experience the Sleeping Beauty problem. The key elements we want to capture are:
   - Beauty doesn't know which awakening she is in (if the coin was tails, there are two awakenings; if heads, one).
   - The self-locating uncertainty: upon awakening, what should her credence be that the coin landed heads?
   - We want students to confront the difference between betting at the start (before the memory wipe) and upon awakening.

   We cannot simulate a true memory wipe, so we will have to use a workaround. One common method is to have multiple participants and a structure that mimics the memory wipe by withholding information about which "awakening" (or trial) they are in.

   Proposed activity: "The Sleeping Student Game"

