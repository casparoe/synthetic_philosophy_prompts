  Crucially, the user wants at least one outcome to feel morally wrong to both narrator and reader - no softening. They're seeking authentic institutional cruelty baked into the system.

  For the procedure structure, I need to mirror actual UK asylum decision-making (while keeping it generic). The key reference points are the Refugee Convention, Qualification Directive, and Home Office policy. The flow should be: 
  1) Credibility threshold
  2) Risk assessment (persecution vs. hardship)
