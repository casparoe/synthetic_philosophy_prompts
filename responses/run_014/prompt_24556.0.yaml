  The exclusion argument (as per Jaegwon Kim) can be summarized as follows:

  1. **Causal Completeness (Closure) of the Physical (CCP)**: Every physical event that has a cause has a physical cause (at the time at which it occurs).
  2. **Distinctness of Mental Properties (DMP)**: Mental properties are not identical to physical properties (non-reductive physicalism).
  3. **Exclusion Principle (EP)**: No event has more than one sufficient cause at a given time unless it is a case of overdetermination.
  4. Therefore, mental properties are either causally inefficacious (epiphenomenalism) or we must accept widespread overdetermination.

  The argument is meant to pressure non-reductive physicalists. The procedure must sort known replies and flag when a paper is not engaging the actual argument.

  The procedure will be a sequence of questions. We design it to be run after an initial read. It will have a fixed order and will return one of the following verdicts:

  - **Genuine Reply**: The paper offers a substantive response to the exclusion argument by engaging at least one premise in a recognized way.
  - **Restatement**: The paper merely restates non-reductive physicalism without addressing the argument.
  - **Straw Man**: The paper attacks a misrepresentation of the exclusion argument.
  - **Different Argument**: The paper is addressing a different problem (e.g., mental causation in general, not the exclusion problem).
  - **Unclear**: The paper's response is not clear enough to categorize.

  Additionally, we will classify the type of reply if it is a genuine reply.

  Known reply types:

  A. Denies CCP (causal closure).
  B. Accepts CCP but argues mental properties have non-derivative causal relevance (e.g., via difference-making, causal powers, etc.).
  C. Accepts overdetermination (widespread but non-problematic).
  D. Accepts epiphenomenalism (or property epiphenomenalism).
  E. Blocks the inference with a priority view (e.g., grounding, realization, etc.).
  F. Appeals to downward causation or agent causation.

  The procedure must flag when a step requires a judgment call (metaphysical values rather than logic).

