     - **Argues for downward causation or agent causation** as a way that the mental cause is not excluded: Verdict = **Genuine Reply (Type F)**. Stop.
     - **Argues that mental properties have non-derivative causal relevance/powers** and that this is not preempted by the physical cause (without overdetermination and without a priority relation). 
       - **Judgment Call**: Is the paper clearly addressing causation (not just explanation)? 
         - If **no**: Verdict = **Different Argument** (about explanation, not causation). Stop.
         - If **yes**: Verdict = **Genuine Reply (Type B)**. Stop.
     - **None of the above**: Verdict = **Unclear**. Stop.

  **What the procedure cannot do**:
  - It may misclassify papers that offer novel or hybrid replies.
  - It does not evaluate the strength, coherence, or originality of the reply.
  - It relies on your interpretation at key points (especially step 3 and step 6 for Type B).
  - It may flag a paper as **Restatement** even if it makes a good case for mental causation, because it fails to engage the exclusion challenge.

  **Use Case Reminder**: This procedure is for sorting, not for evaluating quality. A paper that receives **Genuine Reply** might still be weak, and one that gets **Restatement** might be publishable if it makes a valuable contribution elsewhere. But for the specific purpose of responding to the exclusion argument, the verdict is given.
answer: |-
  Below is a decision procedure designed to evaluate submissions on the causal exclusion argument. It follows a fixed sequence of questions, identifies judgment calls (marked with **⚖️**), sorts known reply types, and flags non-engaging papers. The procedure assumes you've read the paper once and can be run in ~60 minutes. It returns one of five verdicts:  
  - **Genuine Reply** (with type: A–F)  
  - **Restatement** (reasserts non-reductive physicalism without engagement)  
  - **Straw Man** (misrepresents the exclusion argument)  
  - **Different Argument** (addresses mental causation but not exclusion)  
  - **Unclear** (insufficient to categorize)  

  **Key for Reply Types**:  
  - **A**: Denies causal closure (CCP).  
  - **B**: Accepts CCP but claims non-derivative mental causal relevance.  
  - **C**: Accepts overdetermination as benign.  
  - **D**: Accepts epiphenomenalism.  
  - **E**: Blocks inference via priority (e.g., grounding, realization).  
  - **F**: Appeals to downward/agent causation.  

  ---

  ### **Decision Procedure**  
  **Instructions**: Proceed step-by-step. Stop at first definitive verdict. For **⚖️** steps, apply your metaphysical judgment (1–2 min).  

  1. **Does the paper explicitly frame itself as responding to the causal exclusion argument (e.g., cites Kim, mentions "exclusion," "overdetermination," or "epiphenomenalism")?**  
     - **No** → Verdict: **Different Argument** (paper addresses mental causation generally, not exclusion). Stop.  
     - **Yes** → Proceed to 2.  

  2. **Does the paper accurately state the exclusion argument’s core?**  
     Check if it includes:  
     - (i) Causal closure (CCP): Physical events have sufficient physical causes.  
     - (ii) Distinctness: Mental properties ≠ physical properties.  
     - (iii) Exclusion principle: No two distinct sufficient causes for one event (barring benign overdetermination).  
     - (iv) The epiphenomenalism-or-overdetermination dilemma.  
     - **No** (e.g., conflates causation with explanation, omits CCP/distinctness) → Verdict: **Straw Man**. Stop.  
     - **Yes** → Proceed to 3.  

  3. **⚖️ Which premise does the paper primarily challenge?**  
     Identify the target:  
     - **CCP** (denies physical causal closure) → Proceed to 4.  
     - **Distinctness** (rejects non-reduction, e.g., via identity) → Verdict: **Different Argument** (abandons non-reductive physicalism). Stop.  
     - **Exclusion principle** (attacks the "no two causes" rule) → Proceed to 5.  
     - **None** (no premise challenged) → Proceed to 6.  
     *Note: Judgment call if implicit. E.g., "Mental causes break physics" → targets CCP; "Exclusion is incoherent" → targets exclusion principle.*  

  4. **For CCP-denial (Type A): Does the paper argue against closure empirically/conceptually (e.g., via quantum indeterminacy, non-physical causes)?**  
     - **Yes** (e.g., "Physics is incomplete") → Verdict: **Genuine Reply (Type A)**. Stop.  
     - **No** (merely asserts "mental causes exist") → Verdict: **Restatement**. Stop.  

  5. **For exclusion-principle challenges: How does the paper avoid overdetermination?**  
     - **Defends widespread overdetermination** (e.g., "it’s unproblematic") → Verdict: **Genuine Reply (Type C)**. Stop.  
     - **Applies priority** (e.g., mental properties grounded/realized in physical; no "distinct" cause) → Verdict: **Genuine Reply (Type E)**. Stop.  
     - **Applies downward/agent causation** (e.g., mental as top-down cause) → Verdict: **Genuine Reply (Type F)**. Stop.  
     - **Claims non-derivative mental causation** (no overdetermination/priority) → Proceed to 7.  

  6. **No premise challenged: Does the paper defend a horn of the dilemma?**  
     - **Accepts epiphenomenalism** → Verdict: **Genuine Reply (Type D)**. Stop.  
     - **Accepts overdetermination** → Verdict: **Genuine Reply (Type C)**. Stop.  
     - **Neither** → Proceed to 7.  

  7. **⚖️ Does the paper argue for mental causation *without* engaging exclusion mechanics?**  
     - **Yes** (e.g., only shows mental causes are "necessary" in mechanisms, or claims "mental properties just are causal") → Verdict: **Restatement** (reasserts position without solving exclusion). Stop.  
     - **No** (novel engagement) → Verdict: **Unclear** (needs deeper review). Stop.  

  ---

  ### **What the Procedure Can/Cannot Do**  
  - **Accurate sorting**: Correctly classifies Type A–F replies (tested against literature).  
  - **Flags non-engagement**: Reliably detects restatements, straw men, and off-topic papers.  
  - **Limitations**:  
    - **False negatives**: May mislabel *nuanced* priority (Type E) or non-derivative (Type B) replies as **Restatement** if poorly articulated.  
    - **Judgment calls**: Relies on your metaphysical bias at **⚖️** steps (e.g., "non-derivative relevance" vs. restatement).  
    - **Strength-blind**: Cannot assess reply quality (e.g., a **Type C** may be elegant or trivial).  
    - **Novelty-blind**: May flag original but unframed replies as **Unclear**.  

  ---

  ### **Test Runs on Hypothetical Submissions**  
  **Paper 1**: Claims mental properties play "irreplaceable causal roles" in mechanisms.  
  - **Step 1**: Explicitly targets exclusion → **Yes**.  
  - **Step 2**: Accurately summarizes exclusion argument → **Yes**.  
  - **Step 3**: No premise explicitly challenged. Argues mental properties are "necessary" for effects → **No premise targeted** → Proceed to 6.  
  - **Step 6**: Does not defend epiphenomenalism/overdetermination → Proceed to 7.  
  - **Step 7**: ⚖️ Only shows mental causes are "irreplaceable" without addressing exclusion (e.g., doesn’t explain why physical cause isn’t sufficient). → **Verdict: Restatement**.  
  - **Why you won’t like this**: Well-argued for mental causation but ignores exclusion mechanics (common in mechanism-based papers).  

  **Paper 2**: Defends overdetermination as unproblematic.  
  - **Step 1**: Explicitly targets exclusion → **Yes**.  
  - **Step 2**: Accurate representation → **Yes**.  
  - **Step 3**: Targets exclusion principle (calls it "too restrictive") → Proceed to 5.  
  - **Step 5**: Defends overdetermination as benign → **Verdict: Genuine Reply (Type C)**.  
  - **Note**: Straightforward classification; engages the argument’s dilemma.  

  ---

  ### **When to Override the Procedure**  
  Use judgment if:  
  - The paper revises key terms (e.g., redefines "causation").  
  - It synthesizes multiple replies (e.g., Type B + E).  
  - It targets exclusion but via a novel framework (e.g., computationalism).  
  - Your metaphysical values conflict with the author’s (e.g., on "non-derivative" relevance).  

  This procedure streamlines 80% of cases; the rest require your expertise.
