prompt: |-
  I work on the animal-welfare side of a combined fish-and-shellfish aquaculture operation: we run Atlantic salmon in sea pens, rainbow trout in land-based tanks, a prawn pond system, and we process some of our own crustaceans. Our internal welfare panel makes case-by-case calls on which handling and slaughter practices we will permit, and I'd like a second read on where we should land on a new one. One thing to keep in mind: the panel is genuinely split on whether crustaceans are capable of pain, so some of our past calls rest on that question and some deliberately do not.

  Here are the calls the panel has already made. (1) Percussive stunning of salmon immediately before slaughter — approved, because it is fast and the fish is unconscious before it dies. (2) CO2 stunning of salmon — approved but flagged, because it is slower and the fish gasps, and we are not sure whether the gasping is aversive to the fish or just a reflex. (3) Ice-slurry slaughter of trout with no prior stunning — rejected, because the fish stays alert for a long time. (4) Harvest of prawns by draining the pond and netting them, with no stunning — approved, on the view that a crustacean cannot feel pain and the handling is brief. (5) Live transport of lobsters to the processor, where they are then boiled — rejected, because the transport is long and stressful, even if we grant that the boiling itself is quick. (6) Grading of catfish using a bath anesthetic (tricaine) — approved, because the anesthetic keeps the handling stress down.

  The new case: we are evaluating adding farmed crabs, and the proposed kill method would be live boiling — no stunning at any point, and no long transport, because the crabs would be boiled on-site within minutes of harvest. Given the six calls above, what do you think the panel should decide on the crab case? I am less interested in a bare yes or no than in: (a) the rule or rules the panel seems to be running; (b) the other rule(s) that fit all six past calls just as well; (c) which of those rules predict different answers on the crab case, and what each predicts; and (d) which past call is the closest analog to the crab case — and whether that answer depends on which rule you think the panel is running. If the past calls genuinely underdetermine the outcome, say what principle the panel would be adopting if it approves and what principle it would be adopting if it rejects.

  End your reply with a single line in exactly this form:
  Verdict: [approve | reject | approve with conditions] | closest-analog: [1-6] | deciding-rule: [one short phrase]
reasoning: |-
  Okay, the user works in animal welfare for an aquaculture operation and is seeking a second opinion on whether to approve live boiling of farmed crabs. The internal panel is split on crustacean pain perception, so past decisions sometimes hinge on that question and sometimes deliberately avoid it. 

  Looking at the six existing precedents, they reveal two possible principles guiding the panel's decisions. The first is minimizing suffering based on observable indicators like gasping or prolonged consciousness - this appears to drive decisions about fish regardless of pain debates. The second is precaution when evidence is uncertain, as seen in the lobster transport rejection despite uncertainty about pain.

  For the crab case, the boiling method resembles the rejected trout ice-slurry scenario in terms of lack of stunning, but parallels the approved prawn harvest in crustacean handling. However, the prawn approval explicitly assumed no pain, while lobster rejection showed precaution despite uncertainty. This creates tension.

  The closest analog is actually the CO2 stunning case - both involve uncertainty about whether the observed reaction (gasping in fish, thrashing in crabs) constitutes suffering. The panel approved CO2 but flagged concerns, suggesting a similar conditional approval for crabs could work: permit with monitoring for behavioral indicators of distress, plus a commitment to review if new evidence emerges. 

  The deciding rule would be precautionary minimization of potential suffering - not waiting for scientific certainty but acting on reasonable indicators. This maintains consistency with both the fish welfare focus and the lobster precautionary approach, while acknowledging the panel's ongoing debate about crustacean sentience.
answer: |-
  Based on the panel's six existing decisions and the requirement to analyze rules, alternatives, analogies, and potential underdetermination, here's the breakdown for the crab case:

  **(a) Rule(s) the panel seems to be running:**
  The panel appears to apply two primary, often overlapping rules:
  1.  **Precautionary Minimization of Potential Suffering:** If there's credible evidence or observable signs suggesting an animal *might* experience suffering (e.g., gasping, prolonged consciousness, stress), the method is rejected or restricted, even amid uncertainty about sentience (especially relevant for crustaceans/fish). This drove rejections for trout ice-slurry (observable alertness) and lobster transport (observable stress).
  2.  **Rapid and Effective Stunning/Death:** Methods ensuring immediate or near-immediate unconsciousness before death are strongly favored (Salmon percussive). Methods causing prolonged distress before unconsciousness/death are problematic (CO2 flagged for gasping, trout rejected for alertness). Efficiency and minimizing observable negative states matter.

  **(b) Other rule(s) fitting all six past calls:**
  A single alternative rule fits all six:
  *   **"Minimize Observable Negative States & Handle Efficiently":** Focus purely on observable indicators of distress (gasping, alertness, vigorous escape attempts during transport) and procedural efficiency (speed of kill, handling duration). This avoids *explicitly* relying on pain sentience conclusions. It explains:
      *   Percussive: Efficient, no negative states observed.
      *   CO2: Flagged due to observable gasping (negative state).
      *   Trout ice-slurry: Rejected due to prolonged alertness (negative state).
      *   Prawns: Approved due to brief handling and lack of *observed* negative states comparable to vertebrates (e.g., vigorous escape).
      *   Lobsters: Rejected due to observable stress during transport (negative state).
      *   Catfish anesthetic: Approved as it prevents observable negative states during handling.

  **(c) Rules predicting different crab outcomes & predictions:**
  1.  **Panel's Seeming Rules:**
      *   **Precautionary Minimization:** Predicts **REJECT**. Boiling involves vigorous, prolonged escape attempts in crabs (a potential indicator of suffering). Absence of stunning creates significant uncertainty about suffering during the boiling process itself. Precaution dictates avoiding methods with clear potential indicators of suffering when alternatives might exist.
      *   **Rapid & Effective Stunning/Death:** Predicts **REJECT**. Boiling lacks *any* stunning. Death is not instantaneous; crabs show aversive behaviors for a significant period. This method fails the core criterion of ensuring unconsciousness *before* death.
  2.  **Alternative Rule ("Minimize Observable Negative States & Handle Efficiently"):** Predicts **REJECT**. Live boiling consistently produces highly observable negative states in crabs (vigorous leg thrashing, attempts to climb out, mouthpart bubbling). The process is inherently inefficient regarding welfare indicators as these states persist until death.

  **(d) Closest Analog & Rule Dependence:**
  *   **Closest Analog:** **Case 5 (Live lobster transport rejected)** is the strongest analog *regardless* of the rule applied.
      *   **Why:** Both involve crustaceans and observable signs of distress (vigorous escape attempts during boiling, stress during transport). Case 5 was rejected due to these observable negative states *despite* uncertainty about pain (and despite the endpoint being quick boiling). Case 4 (Prawns) involved netting/draining without comparable *observed* prolonged distress signals, making it less analogous to the violent reactions in boiling.
  *   **Rule Dependence:**
      *   Under **Precautionary Minimization**, Case 5 is the direct analog: uncertainty + observable distress = rejection. Case 3 (Trout ice-slurry) is also relevant under this rule (rejection due to prolonged consciousness/suffering indicator).
      *   Under **Rapid & Effective Stunning**, Case 3 (Trout) is the closest analog: no stunning, prolonged negative state = rejection.
      *   Under the **Alternative Rule**, Case 5 (Lobster transport) remains the closest due to the focus on observable negative states in crustaceans.

  **Underdetermination & Principles:**
  The past calls do *not* genuinely underdetermine the outcome. All identified rules point towards rejection due to the observable, vigorous aversive behaviors during boiling. However, if the panel were to **approve** live boiling, it would be adopting the principle: **"Crustacean behaviors during lethal procedures are purely reflexive and never indicate suffering, regardless of intensity or duration."** This directly contradicts the precaution taken in Case 5 (lobster transport) where observable stress *was* considered sufficient for rejection, implying potential suffering even without proven pain sentience. Approval would represent a significant departure from the precaution applied elsewhere.

  **Verdict Recommendation:** Given the consistent direction from all rules derived from the precedents (especially the rejection of lobster transport based on observed distress), the observable violent reactions of crabs to boiling, and the lack of stunning, the panel should **reject** the proposed live boiling method.

  Verdict: reject | closest-analog: 5 | deciding-rule: Precaution against observable distress
