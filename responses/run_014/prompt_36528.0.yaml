  Alright, the user is teaching a second-year bioethics seminar on speciesism and wants an in-class activity where students confront the issue experientially. They've outlined a specific structure: two committees reviewing medical cases with/without species labels, forcing ethical dilemmas when cognitive capacities cross species lines. 

  Hmm, the challenge here is balancing realism with pedagogical clarity. The cases need enough clinical/behavioural detail to feel authentic but avoid triggering excessive emotional bias (e.g., the PVS human could overshadow other cases). I'll use conditions like locked-in syndrome to create nuanced cognitive overlaps without exploitation tropes.

  For the budget mechanism, fixed grants per treatment avoid monetary calculations but require scarcity. Six cases with only three funded creates tension. The £500,000 total with £150k grants means committees must deprioritise three lives—brutal but necessary for the dilemma.

  *Double-checking cognitive mappings*: 
  - Chimpanzee must clearly exceed PVS human in cognition but fall below typical adult. 
  - Dog should parallel the cognitively impaired child in sentience but lack human-specific traits. 
  - Locked-in patient establishes that severe physical disability ≠ cognitive impairment.

  Ah, the reveal phase is crucial. Side-by-side comparison should highlight how Committee 1's allocations cluster by species while Committee 2's follow capacity gradients. The "decoding" moment where Case C (chimpanzee) outranks Case A (PVS human) will land hard.

  For debrief, I'll scaffold questions to expose:
  - How marginal cases (PVS human vs. chimp) destabilise species boundaries.
  - Whether Committee 2's "principled" approach ignores relational duties.
  - The emotional unease when anonymisation forces uncomfortable prioritisation.

  *Predictable pitfalls*:
  - Students guessing species from clues (e.g., "tool use" = chimp). Mitigation: use red herrings (mention dogs' problem-solving) and emphasise codes are arbitrary.
  - Emotive biases (e.g., favouring the dog over the disabled child). Solution: cold-start with individual review before discussion.

  *Structural limitations*: 
  The activity can't simulate kinship obligations (why we prioritise humans in our "tribe"). I'll note this in debrief and suggest discussing how real-world triage includes relational factors.

  *Final tweak*: Use British English spellings ("behaviour", "prioritise") and NHS-style terminology ("permanent vegetative state" not "PVS" in handouts).
answer: |-
  Here is a full activity design for your 80-minute seminar on speciesism, tailored for your requirements and written in British English.

  ---

  **In-Class Activity: The Fairhill Trust Allocation Dilemma**

  **Objective:** To force students to confront the justifiability of using species membership as a criterion for allocating scarce medical resources, by comparing decisions made with versus without species labels.

  **Materials:**  
  - Printed case files (6 cases) for two committees (Committee A: *With Species Labels*; Committee B: *Anonymised with Codes*)  
  - Committee briefings and trust charter  
  - Whiteboard/flip chart for allocations  
  - Timer  

  **Total Time:** 80 minutes  
  **Group Size:** 2 committees of 9 students each.  

  ---

  ### **Activity Structure & Timeline**  
  *(80 minutes total)*  

  1. **Introduction & Setup (10 mins)**  
     - Briefly introduce the Fairhill Charitable Trust: a fictional fund with £500,000 to allocate to medical cases. The charter: *"Distribute funds to maximise good, prioritising urgent, life-saving interventions where possible."*  
     - Split class into **Committee A** (receives cases *with species labels*) and **Committee B** (receives *anonymised cases*, labelled Case 1–6).  
     - Assign roles per committee (3 mins):  
       - **Chair** (leads discussion, ensures consensus)  
       - **Recorder** (notes justifications, final decisions)  
       - **Ethics Advisor** (flags moral tensions, ensures charter adherence)  
       - Others: **Committee Members** (analyse cases, debate priorities).  

  2. **Committee Deliberation (35 mins)**  
     - Committees review 6 cases. **Only 3 can be funded** (each treatment costs £150,000; trust cannot partial-fund).  
     - **Committee A** sees species labels; **Committee B** sees identical clinical/behavioural profiles but with codes (e.g., "Case 3") and **no species or human/animal hints**.  
     - Task: Agree on which 3 cases receive funding. Recorder notes justifications.  

  ---

  ### **Case Files**  
  *Budget constraint: £500,000 total; each treatment costs £150,000 → only 3 funded.*  

  #### **Committee A (With Species Labels)**  
  1. **Healthy Adult Chimpanzee**  
     - *Condition:* Advanced cardiomyopathy. Requires experimental cardiac surgery (70% success rate).  
     - *Capacities:* Highly sentient; uses tools, recognises self in mirror, forms complex social bonds, anticipates future events (e.g., saves tools for later), exhibits grief. Life expectancy post-surgery: 15+ years.  

  2. **Dog (Mixed Breed)**  
     - *Condition:* Aggressive bone cancer (osteosarcoma). Requires limb amputation + chemotherapy (80% success rate).  
     - *Capacities:* Sentient; recognises familiar humans, experiences anxiety (e.g., during separation), forms strong attachments, capable of learning complex commands. Life expectancy: 3–5 years.  

  3. **Human (Permanent Vegetative State)**  
     - *Condition:* Traumatic brain injury (3 years ago). No awareness, sleep-wake cycles only. Requires life-sustaining care (ventilator support).  
     - *Capacities:* No evidence of sentience, consciousness, or pain perception. Medically assessed as irreversible.  

  4. **Human (Severely Cognitively Impaired Child)**  
     - *Condition:* 8-year-old with Rett syndrome. Non-verbal, limited motor control, recurrent life-threatening seizures. Requires specialised neurosurgery (60% success rate).  
     - *Capacities:* Displays distress/comfort reactions; recognises caregivers; minimal anticipatory behaviour; no evidence of complex cognition. Life expectancy post-surgery: 10–15 years.  

  5. **Human (Typical Adult)**  
     - *Condition:* 45-year-old with treatable leukaemia. Requires chemotherapy (85% success rate).  
     - *Capacities:* Fully sentient; plans long-term; complex social bonds (partner, children); self-aware. Life expectancy: 20+ years.  

  6. **Human (Locked-in Syndrome Patient)**  
     - *Condition:* Brainstem stroke survivor. Fully conscious but paralysed except for eye movement. Requires advanced communication implant.  
     - *Capacities:* Fully sentient; retains memory, emotional bonds, capacity for suffering/joy; can communicate preferences via assistive tech.  

  ---

  #### **Committee B (Anonymised Cases)**  
  *Identical clinical/behavioural details, but species-neutral language and coded IDs. No labels (e.g., "chimpanzee" becomes "large non-human primate").*  

  - **Case 1:** Advanced cardiomyopathy. Experimental cardiac surgery (70% success). Capacities: High sentience, tool use, self-recognition, complex social bonds, future planning. Life expectancy: 15+ years.  
  - **Case 2:** Aggressive bone cancer. Amputation + chemo (80% success). Capacities: Sentient; recognises familiar individuals, separation anxiety, strong attachments, complex learning. Life expectancy: 3–5 years.  
  - **Case 3:** Traumatic brain injury (irreversible). Life-sustaining care only. Capacities: No evidence of sentience, consciousness, or pain.  
  - **Case 4:** 8-year-old with severe neurodevelopmental disorder. Neurosurgery for seizures (60% success). Capacities: Distress/comfort reactions; recognises caregivers; minimal anticipation. Life expectancy: 10–15 years.  
  - **Case 5:** 45-year-old with treatable leukaemia. Chemotherapy (85% success). Capacities: Full sentience, long-term planning, complex social bonds, self-awareness. Life expectancy: 20+ years.  
  - **Case 6:** Paralysis with full cognition. Communication implant required. Capacities: Full sentience, memory, emotional bonds, ability to communicate preferences.  

  ---

  ### **Reveal & Comparison (15 mins)**  
  1. Committees share their 3 funded cases + justifications.  
  2. **Side-by-side display:**  
     - Committee A’s allocations (with species) vs. Committee B’s (anonymised).  
     - **Reveal the species/code matches:**  
       - Case 1 / Chimp | Case 2 / Dog | Case 3 / PVS Human  
       - Case 4 / Impaired Child | Case 5 / Typical Adult | Case 6 / Locked-in Human  
  3. Highlight discrepancies (e.g., Committee B funds Case 1/Chimp over Case 3/PVS Human; Committee A may deprioritise animals).  

  ---

  ### **Debrief & Philosophical Mapping (20 mins)**  
  *Use questions to guide students to articulate key insights:*  

  1. **The Argument from Marginal Cases:**  
     - *"Committee B funded Case 1 (Chimp) over Case 3 (PVS Human). Does this imply cognitive capacity, not species, is morally decisive? How does this challenge the idea that all humans are 'special'?"*  
     - Map: PVS human (marginal human) vs. chimp (cognitively complex non-human) forces a clash between species membership and capacities.  

  2. **Capacity Distributions & Overlap:**  
     - *"Case 2 (Dog) and Case 4 (Impaired Child) share similar capacities (sentience, attachment, no complex cognition). Did one committee prioritise the child? Why/why not?"*  
     - Map: Emphasise that capacities overlap across species – favouring humans here may be speciesism unless justified.  

  3. **Species as Proxy vs. Direct Moral Significance:**  
     - *"Committee A saw species labels. Did you use them as a shortcut for capacities (e.g., ‘humans are typically smarter’) or as morally significant *per se* (e.g., ‘humans matter more because they’re human’)?"*  
     - Map: Distinguish *descriptive* overlap (species predicts capacities) from *normative* claims (species confers intrinsic value).  

  4. **Anonymisation: Principled or Ignorant?**  
     - *"Committee B ignored species. Is this more impartial? Or does it omit morally relevant context (e.g., relational duties to humans)?"*  
     - Map: Peter Singer’s "veil of ignorance" vs. relational critiques (e.g., we owe more to humans in our community).  

  5. **Potential vs. Relations (Structural Limits):**  
     - *"Even if a PVS human lacks capacities, might we fund them because of their *potential* (if recovered) or obligations to their family? Could the anonymised format capture this?"*  
     - Map: Activity cannot simulate relational duties (families, social contracts) – these require contextual knowledge beyond capacities.  

  ---

  ### **Two Honest Notes**  
  **1. Predictable Problems & Mitigation:**  
     - **Problem:** Students guess species from clues (e.g., "tool use = chimp").  
       - *Fix:* Pre-emptively warn: *"Codes are arbitrary. Focus strictly on described capacities."* Use red herrings (e.g., note dogs’ problem-solving skills).  
     - **Problem:** Emotional bias (e.g., favouring the dog because "pets are loyal" or the child due to "innocence").  
       - *Fix:* Charter requires focus on "maximising good" (define: reducing suffering/extending life). Ethics Advisors should challenge sentimentalism.  

  **2. Structural Limitations of the Activity:**  
     - **Relational Duties:** The activity cannot replicate obligations to kin/community (e.g., prioritising a human because their family depends on them).  
     - **Potentiality:** Anonymisation hides developmental potential (e.g., an impaired child *might* develop capacities).  
     - **Systemic Context:** Real-world triage considers societal roles (e.g., a parent’s dependants) – omitted here.  
     - *Debrief Supply:* Explicitly discuss these gaps: *"In real life, we might prioritise humans due to relational ties – does that justify speciesism, or is it a separate argument?"*  

  ---

  **Instructor Script Snippet for Reveal:**  
  *"Committee A funded the typical adult, the locked-in patient, and the impaired child – all humans. Committee B funded Case 1 (the chimpanzee), Case 5 (typical adult), and Case 6 (locked-in human). Notice Case 1, a chimpanzee, was prioritised over Case 3, a human in a vegetative state. Did Committee B make a *more rational* choice... or did Committee A have moral reasons to prioritise humans that the codes hid?"*  

  This activity creates experiential tension between species loyalty and capacity-based impartiality, setting up a rich debate on whether speciesism is defensible – or a prejudice in need of justification.  

  --- 
  *Let me know if you need editable handouts or slides for this session.*
