     - ML lacks tools to assess if a feature represents true agency. Features used in models (e.g., occupation) may be influenced by structural factors, but models treat them as neutral inputs. Counterfactual fairness might approach this by considering alternative scenarios, but it's not about moral responsibility.

  4. **Abandoning those with bad option luck**: 
     - ML fairness doesn’t address this. For instance, a model penalizing someone for risky choices aligns with luck egalitarianism but might conflict with fairness metrics that demand equal outcomes regardless of past decisions. 

