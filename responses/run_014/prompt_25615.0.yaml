  - **Demographic parity**: Focuses on proportional outcomes across groups. Doesn't consider individual choices or responsibility.
  - **Equalized odds/opportunity**: Ensures similar error rates across groups. More about predictive fairness than moral responsibility.
  - **Calibration**: Probabilities should reflect actual outcomes. Doesn't address why disparities exist.
  - **Counterfactual fairness**: Considers what would happen if a sensitive attribute changed. Closest to individual fairness but in a causal sense.
  - **Impossibility theorems**: Show trade-offs between metrics, but don't engage with the source of disparities.

