  - **Potential changes**: Researchers might design metrics that condition on responsibility-sensitive variables, but this requires normative input on what constitutes choice. It could lead to new trade-offs, e.g., between equality of outcome and respecting agency.

  - **Operationalization challenges**: Philosophical distinctions blur when applied. Data rarely captures true agency, and societal biases complicate attributing outcomes to choice. The existing ML framework might already handle the tractable parts, leaving the philosophical residue as non-actionable without further normative input.

