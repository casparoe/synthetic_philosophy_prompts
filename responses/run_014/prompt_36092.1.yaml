  - **Scholarly Disputes:**  
    - All leaves involving the Canon's denial of a subject (B branches) are **disputed**. Scholars like Sue Hamilton and Peter Harvey argue the Buddha only denied a soul (A branches); others like Ñāṇananda argue he denied any subject (B branches).  
