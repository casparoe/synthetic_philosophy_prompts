  ### Key Notes on the Tree
  - **Indistinguishable Leaves:**  
    - **Parfit, Siderits, and Madhyamaka** all map to **A1X + P** (reductionism). The tree cannot split them because it lacks a node for "inherent existence" (a Sanskrit-dependent concept). Madhyamaka conventionally accepts persons but denies inherent existence—subtle metaphysics students miss.  
