  Below is a decision tree designed to map the bare commitment "there is no self" to specific, named positions. It prioritizes your requested branch points, reorganizing slightly for logical flow (starting with the core metaphysical split, then the nature of the claim, then introspective evidence, and finally conventional language). Each node is phrased neutrally, requiring no prior knowledge of Pali/Sanskrit or philosophical labels. Leaves note scholarly disputes and contemporary attributions honestly. Empty cells are diagnosed, and indistinguishable leaves are flagged.

  ### Decision Tree: From "There Is No Self" to Specific Positions

  **Start:** You assert: "There is no self."

  1. **Question 1 (What is denied?)**  
     When you say "no self," are you denying the existence of:  
     - **A.** Only a permanent, unchanging soul (like an immortal essence that survives death), but you think there is still a temporary subject of experience (e.g., a minimal "I" that feels present right now)?  
     - **B.** Any subject of experience whatsoever—including a temporary, momentary, or minimal one (i.e., no "I" at all, not even as a fleeting feeler of feelings)?

  ---

  #### Branch A (Deny only permanent soul; affirm temporary subject)
     **Question 2 (Nature of denial)**  
     Is the point of this denial mainly:  
     - **1.** A claim about what **exists** (e.g., "souls are unreal, but temporary subjects are real")?  
     - **2.** A strategy to change **attitudes** (e.g., "stop clinging to any idea of self, even temporary, to reduce suffering")?  

     ##### Sub-branch A1 (Metaphysical claim)  
     **Question 3 (Introspective search)**  
     When someone says, "I looked for a self and found nothing," you interpret this as:  
     - **X.** Evidence that there is no self (like failing to find a unicorn proves its absence).  
     - **Y.** A misleading result (like an eye failing to see itself—the self might exist but evade detection).  
     - **Z.** A psychological technique (not about evidence; meant to shift perspective).  

     - *For A1X:*  
       **Question 4 (Conventional person)**  
       Should everyday personal language (e.g., "I," promises, blame) be used:  
       - **P.** Without reservation—it's fully legitimate in ordinary life?  
       - **Q.** Only as a useful tool, not to be taken literally (like a ladder to kick away)?  
       - **→ Leaf: Reductionism (Parfit, Siderits)**  
         - Parfit and Siderits are indistinguishable in this tree. Both hold persons are real conventionally but reducible to impersonal parts.  
         - **Canon interpretation:** Disputed. Scholars debate if the Buddha denied only a soul (Collins, Gombrich) or also a minimal subject (Ñāṇananda).  
         - **Contemporary:** Parfit and Siderits explicitly hold this.  

     - *For A1Y:*  
       **→ Leaf: Minimal Self (Zahavi)**  
         - This is an exit: you affirm a self (contradicting "no self"). Zahavi argues a minimal subject is given in experience.  
         - **Canon interpretation:** Heavily disputed. Zahavi's view opposes mainstream Buddhist readings.  
         - **Contemporary:** Zahavi explicitly holds this.  

     - *For A1Z:*  
       → *Empty cell* (Incoherent: metaphysical claims can't treat introspection as non-evidential).  

     ##### Sub-branch A2 (Therapeutic strategy)  
     **Question 3 (Introspective search)**  
     When someone says, "I looked for a self and found nothing," you interpret this as:  
     - **X.** Evidence that there is no self.  
     - **Y.** A misleading result.  
     - **Z.** A psychological technique.  

