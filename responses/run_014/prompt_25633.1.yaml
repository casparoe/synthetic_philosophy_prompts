  The user's explicit request is for a bottom-line diagnosis upfront, followed by reasoning. They want clarity on whether this is a verbal dispute, a substantive modal epistemology disagreement, a clash of intuitions, or fundamentally different questions. They're also asking what would count as progress—whether experiments, formal results, or conceptual distinctions could help, or if it's ultimately intractable.

  I need to analyze the core of the zombie argument. Chalmers uses conceivability to argue for metaphysical possibility: if we can conceive of zombies without contradiction, they must be metaphysically possible, which would refute physicalism. Physicalists typically attack the bridge from conceivability to possibility. This points to the disagreement being primarily about modal epistemology—the study of how we know what is possible or necessary.

  The user's hypothesis about two different questions (conceptual vs. metaphysical) is insightful. Chalmers intentionally connects them through his two-dimensional semantics, while physicalists reject this link. So while the questions are distinct, the debate centers on whether conceivability can bridge them.

  As for progress, this isn't something resolvable by experiments since it's about metaphysical possibilities. Conceptual distinctions like phenomenal concepts or formal models might refine positions, but they haven't broken the stalemate. The disagreement might stem from deep intuitions about consciousness that are hard to shift. However, developments in neuroscience or AI could indirectly influence the debate by changing our understanding of physical systems' capabilities.

