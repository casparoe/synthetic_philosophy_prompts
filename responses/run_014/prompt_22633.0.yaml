  ## The Sticky Glue Problem: Bradley's Regress and the Fate of Structured Propositions

  Propositions – the things we believe, assert, and that are true or false – are fundamental to our understanding of thought and language. A dominant view, championed by figures like Bertrand Russell and Gottlob Frege, holds that propositions are **structured complexes**. On this view, the proposition *that Brutus killed Caesar* is a complex entity composed of simpler constituents: the concept `Brutus`, the concept `Caesar`, and the relation `kills`, combined in a specific structure (Brutus-killing-Caesar, not Caesar-killing-Brutus). The unity of the proposition – what binds these constituents together into a single, meaningful whole capable of being true or false, rather than just a list of concepts – is explained by the *relation itself* playing a dual role: it is both a constituent *and* the structural principle organizing the others.

  Enter F.H. Bradley, the formidable British Idealist. In his *Appearance and Reality* (1893), Bradley launched a devastating critique against this analysis, arguing it leads to an infinite and vicious regress, thereby undermining the very possibility of genuinely unified, structured propositions. This is **Bradley's Regress**. Its target is the heart of the structured complex view: the nature of propositional unity.

  **The Regress Laid Bare:**

  Bradley's argument is deceptively simple. Suppose we have the proposition *that aRb* (e.g., Brutus kills Caesar). According to the structured complex view, this requires:
  1. The particular object/concept `a` (Brutus).
  2. The particular object/concept `b` (Caesar).
  3. The relation `R` (kills).
  4. These being combined such that `R` *relates* `a` to `b`.

  The problem arises with step 4. How does `R` actually *relate* `a` to `b`? What *makes* these three elements stick together in the specific relational configuration *aRb* rather than just being three separate items (a, R, b) or configured differently (bRa)?

  *   **Step 1:** We have `a`, `R`, and `b` as distinct constituents.
  *   **Step 2:** To form the complex *aRb*, `R` must *relate* `a` to `b`. But `R` is just another constituent, like `a` and `b`.
  *   **Step 3:** Merely adding `R` to the list alongside `a` and `b` doesn't establish that `R` *does* the relating; we just have three items: `a`, `R`, `b`. We need something *else* to connect `R` to `a` and `R` to `b` – a further relation, say `R1` (e.g., "instantiates" or "applies-to"), such that `R1`(R, a) and `R1`(R, b). But now we have the complex [R1(R, a) and R1(R, b)].
  *   **Step 4:** How does *this* new complex achieve unity? What relates `R1` to `R` and `a`? We need yet another relation, `R2`, to relate `R1` to `R` and to `a` (so `R2`(R1, R) and `R2`(R1, a)), and so on, ad infinitum.

  The regress is triggered because the initial relation `R` is treated merely as another *constituent*. Its supposed role as the *unifier* is not inherent to it as a constituent; it requires something *further* to activate that role. But that "something further" (a new relation) will suffer the same problem, leading to an infinite sequence of ever-higher-order relations, none of which ever actually succeeds in unifying the original constituents into a single proposition.

  **Is the Regress Vicious? Objections and Replies**

  The crucial question is whether this regress is *vicious* – does it prevent the structured complex view from genuinely explaining propositional unity? Or is it merely *inert* – an infinite chain that exists but doesn't undermine the existence of the unified proposition?

  1.  **Objection 1: The Regress is Benign (Inert).**
      *   *Argument:* Proponents like David Armstrong argue that the regress doesn't prevent the *existence* of the original complex *aRb*. The unity is primitive. The regress simply describes the *internal structure* of that unity, revealing the hierarchy of how constituents relate. It's like unpacking a definition; the truth of *aRb* doesn't depend on the completion of the infinite chain, it's foundational. The regress is horizontal, not vertical – it elaborates, but doesn't threaten the base fact.
      *   *Reply:* Bradleyans counter that this misses the point. The regress shows the structured complex view *fails to explain* the unity at *any* level. If the unity of the original complex *aRb* is primitive and brute, then the analysis in terms of constituents plus a relation has failed. Appealing to primitive unity concedes that the relation `R` *alone* is insufficient, which was Bradley's core claim. The regress highlights this insufficiency repeatedly at every level. The view promises an analysis but ultimately relies on an unanalyzed unity.

  2.  **Objection 2: Confusion of Unity Types (Mereological vs. Propositional).**
      *   *Argument:* Scott Soames and others argue Bradley confuses different kinds of unity. The structured complex view concerns *mereological* unity – how parts compose a whole. The unity of the proposition *as a truth-bearer* is a different kind of unity (propositional unity), which might be primitive or explained differently (e.g., by mental acts or linguistic conventions). The regress threatens the mereological composition, but not the proposition's existence or function as a truth-bearer. We can have structured wholes without needing to reduce their "aboutness" or truth-aptness to that structure.
      *   *Reply:* Bradleyans insist the unity is inseparable. For the complex *aRb* to represent the state of affairs *Brutus killing Caesar* and be truth-evaluable, its constituents *must* be unified in the *right way*. Mere mereological aggregation (like a pile of sand) doesn't suffice for intentionality or truth. The structured view aims to explain representational unity *via* mereological structure plus the special role of the relation. The regress shows this explanation fails: the relation cannot play its unifying role without external help, leaving the representational unity unexplained. The objection risks divorcing structure from meaning.

  3.  **Objection 3: Relations Don't Need Relating (Bergmann).**
      *   *Argument:* Gustav Bergmann argued that relations are fundamentally *unsaturated* or *tied* to their relata. A relation like `kills` isn't just another brick; it inherently has "hooks" or a nature that demands connection to entities like Brutus and Caesar. When `kills` is combined with `Brutus` and `Caesar` in the right structure, its unsaturated nature *automatically* provides the connection. No further relation `R1` is needed. The regress mistakenly treats relations as self-subsistent entities like particulars.
      *   *Reply:* This seems like a step towards Bradley's conclusion. If relations have an "unsaturated" nature that *intrinsically* provides the "glue," then this "unsaturatedness" or "tied-ness" is the *real principle of unity*. It's distinct from the relation conceived as a constituent (`kills` as an abstract entity). The structured complex view still needs to explain *how* this unsaturated nature operates to unify the relata. Simply positing it feels like renaming the problem rather than solving it within the framework of relations-as-constituents. Bradley might argue this unsaturatedness points towards a more fundamental, non-relational unity underlying the apparent complexity.

  **Verdict: The Stubborn Glue**

  Bradley’s regress remains a powerful and **genuine objection** to the standard structured complex view of propositions. While objections highlight nuances and possible ways to mitigate the *implications*, they struggle to fully dissolve the regress or provide a satisfying explanation of unity *within the strictures of the view itself*.

  *   The "inert regress" reply concedes the core failure: the fundamental unity remains brute and unanalyzed, contradicting the view's reductive ambitions.
  *   Distinguishing unity types risks making the propositional structure explanatorily idle for the very unity (intentional, truth-apt) that defines a proposition.
  *   Appealing to the unsaturated nature of relations moves towards recognizing a unifying principle *other than* the relation conceived as just another constituent, hinting at Bradley's monistic intuition of a prior, non-relational unity.

  The regress is vicious because it exposes a **categorical gap**. Relations-as-constituents are entities *within* the proposition. Unity is the *form* or *principle* that organizes them. Treating the principle of organization as just another entity *within* the complex it's supposed to organize is inherently problematic. It attempts to pull the ground of unity up into the level of what needs unifying, creating an explanatory void filled only by an infinite deferral.

  **Conclusion:**

  Bradley's regress doesn't necessarily prove propositions *aren't* structured (though it motivated his own monism). Rather, it shows that **the standard analysis of propositions as structured complexes *composed solely of* concepts and relations cannot account for their essential unity.** The "glue" binding constituents into a truth-evaluable whole cannot itself be reduced to just another constituent without triggering the regress. A viable theory of propositions must either:

  1.  **Posit a primitive, non-relational principle of unity** (acknowledging brute fact), or
  2.  **Re-conceive the nature of relations** or propositional constituents radically (e.g., as inherently unsaturated, dynamic, or mind-dependent), or
  3.  **Abandon the structured complex model** for propositions altogether (e.g., moving towards Russellian singular propositions, possible worlds, or deflationary views).

  For the science and ideas reader, Bradley's insight endures: explaining how meaning emerges from combining symbols – whether in thought, language, or even complex data structures – confronts a fundamental challenge. True unity, the kind that makes a whole more than the sum of its parts and capable of representing the world, resists reduction to a mere list of components, however sophisticated. The glue, it seems, remains stubbornly irreducible.
