  On the consistency versus soundness issue: the theorem only requires consistency, but for humans to "see" the truth of the Gödel sentence, they need to know the system is consistent - and more than that, they need to trust that consistency implies soundness for this particular sentence. This is where soundness comes in, which is stronger than mere consistency.

  I should structure this clearly. First explain the weak conclusion (human reasoning isn't captured by any single formal system). Then show the gap to the strong conclusion (human reasoning is non-computational). For the gap, emphasize that the key additional assumptions are: (1) humans can always consistently extend their systems, and (2) this entire process can't be captured by any computational procedure. Both are controversial.

  For the consistency/soundness part, I'll clarify that while consistency suffices for the theorem, recognizing truth requires believing in consistency plus accepting that consistency implies truth for the Gödel sentence - which depends on a soundness assumption. This is a genuine extra burden.

