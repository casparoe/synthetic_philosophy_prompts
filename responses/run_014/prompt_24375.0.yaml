prompt: |-
  I am assembling, before I evaluate any particular proposal, the specification that an adequate theory of rational betting under uncertainty must meet. The setting is repeated betting against fixed or slowly drifting odds, where wealth compounds multiplicatively and the bettor may be uncertain about the true win probability — the domain in which the relevant average is geometric rather than arithmetic, and the question is what makes a stake rational rather than the recitation of a formula. Write out the desiderata: the list of things such a theory must deliver to count as an account of rational staking, with the motivating case behind each — the concrete betting situation, or the specific dispute between staking rules, that the requirement is meant to adjudicate — and a mark on whether each is non-negotiable (a theory that fails it is simply wrong) or a preference of a particular camp (the log-optimalists, the expected-utility maximizers who fix a utility function, or the risk-averse camp that stakes a fixed fraction of the log-optimal amount). At minimum it must handle the one-shot bet, the long run of repeated bets, the bettor who is uncertain about the win probability and updates from the outcomes, correlated rather than independent outcomes, the boundary at ruin, and the question of whether borrowing is in scope. It must respect, and not collapse, the following distinctions: the long-run growth rate of the wealth process versus the expected terminal wealth; the ensemble average over many parallel gamblers versus the time average along a single trajectory; a stake that is optimal at each step given current information versus one that is optimal for the horizon as a whole; and a property of the strategy's asymptotic behavior versus a property of the bettor's utility function. It must be consistent with the standard asymptotic results — that the log-optimal stake maximizes the almost-sure long-run growth rate of wealth and that no admissible stake achieves a strictly higher growth rate, and that the stake maximizing expected terminal wealth, on any positive edge, is either the maximum allowed stake or, if borrowing is unbounded, has no finite optimum at all — and it must say how the optimal stake depends on the uncertainty in the win probability, rather than pretending the posterior mean can simply be substituted into the one-shot formula. Then flag any subset of the desiderata you suspect is jointly unsatisfiable — watching in particular for tensions among the demands that the theory be utility-neutral, sensitive to the bettor's risk tolerance, robust to misspecification of the odds, and sharp about the precise estimate — and say whether the list is satisfiable at all, and which single requirement does the most work excluding candidates. Close with a short scorecard: in one or two lines each, how the full log-optimal stake, a fixed fraction of it, the expected-wealth maximizer, and a generic expected-utility maximizer fare against the list.
reasoning: |-
  Okay, let me unpack this user's query. They're asking for a comprehensive specification for a theory of rational betting under uncertainty, with repeated bets and multiplicative wealth growth. The user clearly has deep knowledge in decision theory and wants a structured framework to evaluate different staking strategies.

  First, I need to identify all the key elements they mentioned: multiplicative compounding, uncertainty in win probability, geometric averages, and various scenarios like one-shot bets vs long runs. The user wants desiderata that cover these aspects, each with a motivating case and classification as non-negotiable or camp-specific.

  The user emphasizes several critical distinctions: long-run growth vs expected terminal wealth, ensemble vs time averages, myopic vs horizon-optimal strategies, and asymptotic behavior vs utility properties. These distinctions are crucial because collapsing them would invalidate the theory. 

  Standard asymptotic results must be respected, like log-optimality maximizing almost-sure growth rate. Also, how uncertainty affects the stake is vital - substituting the posterior mean isn't sufficient. The user also wants potential conflicts flagged, especially between utility-neutrality, risk tolerance, misspecification robustness, and precision.

  For the scorecard, I need to briefly assess how different strategies (full log-optimal, fractional, expected-wealth max, generic EU) fare against the desiderata. Each has strengths and weaknesses; for example, full log-optimal fails ruin avoidance while fractional log might compromise growth.

  The user's unspoken need might be a framework to resolve debates between staking philosophies. They might be developing or comparing theories and need rigorous criteria. Ensuring clarity on non-negotiables versus preferences is key, as is highlighting where tensions arise, like between utility-neutrality and sensitivity to risk tolerance.

  I'll structure the response with desiderata grouped by themes: core rationality, uncertainty handling, asymptotic properties, and distinctions. Each desideratum will have a motivation and negotiability mark. Then, I'll discuss tensions and conflicts, noting especially the joint unsatisfiability of utility-neutrality, sensitivity, robustness, and precision. The scorecard will concisely compare strategies, pointing out where each succeeds or fails.
answer: |-
  Here is a specification for a theory of rational multiplicative staking under uncertainty, derived from your requirements. Each desideratum includes its motivating case and negotiability status.

  **Core Rationality & Domain Coverage (Non-Negotiable):**
  1.  **Handle One-Shot Bets:** Must prescribe a stake for a single bet with uncertain edge. *Motivation:* A bettor offered a unique opportunity with estimated 60% win chance on a fair 1:1 payout. What is rational? (Non-Negotiable)
  2.  **Handle Repeated Bets w/ Compounding:** Must prescribe a staking *strategy* for a sequence of bets where wealth grows multiplicatively. *Motivation:* Repeated bets on biased coins or drifting sports markets. (Non-Negotiable)
  3.  **Handle Uncertain & Updating Win Probability:** Must incorporate prior beliefs/knowledge state about win probability `p` and update it based on observed outcomes to inform future stakes. *Motivation:* Betting on a new asset class or a team with a new coach; initial uncertainty reduces with data. (Non-Negotiable)
  4.  **Handle Correlated Outcomes:** Must not assume independence; stakes must adapt to covariance between bet outcomes. *Motivation:* Betting on multiple stocks in the same sector, or multiple games influenced by a common factor (e.g., weather). (Non-Negotiable)
  5.  **Handle Ruin Boundary:** Must explicitly account for the fact that wealth cannot go negative ("ruin") and stakes must be constrained to prevent ruin with certainty where possible. *Motivation:* Avoiding bankruptcy when betting a fixed fraction on a sequence with a non-zero ruin probability. (Non-Negotiable)
  6.  **Address Borrowing Scope:** Must explicitly state whether borrowing (staking more than current wealth) is permitted or forbidden within the theory. *Motivation:* Can a bettor rationally go into debt to place a bet perceived as highly favorable? (Non-Negotiable - Theory must take a stance)

  **Respecting Critical Distinctions (Non-Negotiable):**
  7.  **Distinguish Long-Run Growth Rate (`G`) vs. Expected Terminal Wealth (`E[W_T]`):** Cannot conflate maximizing `G = lim_{T->∞} (1/T) log(W_T / W_0)` with maximizing `E[W_T]`. *Motivation:* On a positive edge bet, max `E[W_T]` often requires maximal stake (risking ruin), while max `G` (Kelly) avoids ruin but grows slower in expectation for finite `T`. (Non-Negotiable)
  8.  **Distinguish Ensemble Average (Many Bettors) vs. Time Average (Single Bettor):** Must acknowledge that properties like "median terminal wealth" or "probability of beating a benchmark" (ensemble) can differ significantly from "long-run growth rate along one path" (time). *Motivation:* A strategy might have high median wealth (ensemble) but also a high ruin probability, making its typical *path* disastrous. (Non-Negotiable)
  9.  **Distinguish Myopic Optimality (Given Current Belief) vs. Horizon-Optimality:** Must recognize that the stake optimal for the next bet given current beliefs (myopic) may differ from the stake optimal for achieving the best outcome at a specific finite horizon `T`. *Motivation:* Hedging future learning or avoiding paths leading to ruin might justify deviating from the myopically optimal stake. (Non-Negotiable)
  10. **Distinguish Asymptotic Strategy Property vs. Utility Function Property:** Must not conflate properties arising purely from the multiplicative dynamics and long-run limits (like `G`) with properties defined by a specific utility function (`U(W)`). *Motivation:* Log-optimality maximizes `G` asymptotically *regardless* of `U(W)`; conversely, optimizing `E[U(W_T)]` for finite `T` depends critically on the choice of `U`. (Non-Negotiable)

  **Consistency & Specificity (Non-Negotiable):**
  11. **Recover Standard Asymptotics:**
      *   **Max Long-Run Growth:** Must entail that the log-optimal stake (Kelly criterion), when known `p` and odds are constant, maximizes the *almost-sure* long-run growth rate `G`. *Motivation:* The foundational result of capital growth theory. (Non-Negotiable)
      *   **No Strictly Dominant Strategy:** Must entail that no other admissible strategy achieves a strictly higher `G`. (Non-Negotiable)
      *   **Expected Wealth Maximization Pathology:** Must entail that maximizing `E[W_T]` for fixed `T` (with borrowing allowed) either leads to staking everything (or max allowed) on each bet, or has no finite optimum if borrowing is unbounded. *Motivation:* The absurdity of maximizing expected wealth without regard to risk/ruin. (Non-Negotiable)
  12. **Explicit Dependence on Uncertainty:** Must prescribe how the optimal stake depends on the *distribution* of the posterior belief over `p` (e.g., variance, entropy, quantiles), not just the posterior mean. *Motivation:* A sharply estimated `p=0.55` vs. a diffuse posterior with `E[p]=0.55` should rationally lead to different stakes. Simply plugging `E[p]` into Kelly is insufficient and often too aggressive. (Non-Negotiable)

  **Risk Sensitivity & Robustness (Camp Preferences / Tensions):**
  13. **Accommodate Risk Tolerance (Preference - Risk-Averse Camp):** Should provide a mechanism to adjust stakes downward from the point estimate-driven Kelly stake to reflect a bettor's specific aversion to volatility or drawdowns. *Motivation:* Two bettors with identical beliefs about `p` might rationally stake different amounts based on personal risk tolerance. (Preference - Satisfied by fractional Kelly/risk-averse EU)
  14. **Robustness to Misspecification (Preference - Robustness Camp):** Should perform reasonably well (avoid catastrophic ruin, maintain acceptable growth) even if the bettor's model of the world (prior, likelihood) is slightly wrong or the odds drift unexpectedly. *Motivation:* Real-world probability estimation is noisy; odds change; models are imperfect. (Preference - Satisfied by fractional Kelly, certain robust optimizations)
  15. **Utility Neutrality (Preference - Log-Optimalist Camp):** Should not presuppose a specific utility function `U(W)` beyond the multiplicative dynamics; optimality should be defined intrinsically via the wealth process (`G` or survival). *Motivation:* Argues that `G` is the natural objective for multiplicative growth, independent of hard-to-specify `U(W)`. (Preference - Core tenet of pure capital growth theory)

  **Tensions and Joint Unsatisfiability:**

  *   **The Core Tension:** Desiderata **13 (Risk Tolerance)**, **14 (Robustness)**, and **15 (Utility Neutrality)** are in fundamental tension with **12 (Explicit Dependence on Uncertainty)** and the desire for sharpness.
      *   **Utility Neutrality (15)** aims to avoid `U(W)`, but accommodating **Risk Tolerance (13)** inherently requires *some* parameterization of risk aversion, often linked to `U(W)` (e.g., CRRA utility). Pure log-optimality ignores this.
      *   **Robustness (14)** often requires simplifying assumptions (e.g., using a fractional Kelly stake `f*Kelly`, min-max optimization) that blunt the **Explicit Dependence on Uncertainty (12)**. A robust rule might use the posterior mean with a large haircut, ignoring finer posterior details.
      *   Achieving sharp **Explicit Dependence on Uncertainty (12)** typically requires precise posterior distributions and complex dynamic programming (e.g., Bayes-optimal play), which conflicts with **Robustness (14)** – the solution is fragile if the model is wrong. It also usually assumes either **Utility Neutrality (15)** (max `G`) or a specific `U(W)`, conflicting with **13**.
  *   **The Most Excluding Requirement:** **Desideratum 12 (Explicit Dependence on Uncertainty)** does the most work excluding candidates. Simple substitution of `E[p]` into Kelly fails it dramatically. Most closed-form solutions (like fractional Kelly based on `E[p]`) fail to capture the full impact of posterior uncertainty (variance, skew). Fully satisfying it requires computationally intensive methods like dynamic programming with Bayesian updating or sophisticated approximations, making simple, intuitive rules elusive. It forces the theory beyond plug-in estimation.

  **Is the List Satisfiable?** Yes, *in principle*, but likely not by a *single, simple, closed-form rule* satisfying *all* preferences **(13-15)** simultaneously. A theory satisfying the **Non-Negotiable (1-12)** requirements is achievable:
  1.  **Foundational Core:** The theory must be based on optimizing some functional of the wealth process (`W_t`), respecting ruin and updating.
  2.  **Handling Uncertainty:** For finite horizons, this typically involves dynamic programming using the posterior distribution. For asymptotics, maximizing the expected *log* of future wealth or a robust analogue under the posterior.
  3.  **Recovering Asymptotics:** Under known, constant `p` and odds, this DP should reduce to constant fractional Kelly (which is full Kelly for log utility). Under uncertainty, it should lead to stakes dependent on the posterior shape.
  4.  **Accommodating Preferences:** Risk tolerance **(13)** can be incorporated by optimizing `E[U(W_T)]` for finite `T` with a chosen `U` (e.g., CRRA). Robustness **(14)** can be incorporated by optimizing under a worst-case prior/model within an uncertainty set. Utility Neutrality **(15)** is maintained by focusing purely on maximizing `G` asymptotically via expected log optimization under the posterior.

  **Scorecard (Against Non-Negotiable Desiderata 1-12):**

  1.  **Full Log-Optimal (Kelly based on point estimate, e.g., `E[p]`):**
      *   *Fails:* 5 (Ruin - positive risk of ruin), 6 (Scope - usually forbids borrowing implicitly via ruin), 12 (Uncertainty - treats `E[p]` as true `p`, often overstaking), partially fails 9 (Myopic only, not horizon-optimal under uncertainty). *Excels:* 7 (Max `G` if `p` known), 11 (Asymptotics), 15 (Utility Neutral).
  2.  **Fixed Fraction of Log-Optimal (e.g., Half-Kelly):**
      *   *Fails:* 12 (Uncertainty - crude adjustment, doesn't adapt to posterior shape), 9 (Myopic only). *Mitigates:* 5 (Reduces ruin risk), 14 (Improves robustness). *Satisfies:* 1,2,3 (if point estimate updated),4 (stake adapts),6 (usually),7,8,10,11 (asymptotically optimal only if fraction=1).
  3.  **Expected Terminal Wealth Maximizer:**
      *   *Fails Spectacularly:* 5 (Seeks ruin with positive edge), 7 (Conflates with `E[W_T]`), 11b (Pathological - bets max or infinite). *Satisfies:* 1 (Stakes max), 2 (Stakes max repeatedly), 6 (Borrows infinitely if allowed). *Irrelevant:* 3,4,8,9,10,12,14,15.
  4.  **Generic Expected-Utility Maximizer (Finite `T`, chosen `U` e.g., CRRA):**
      *   *Satisfies:* 1,2,3,4,5 (if `U` defined for ruin/constraints),6,7 (Distinguishes via `U`),8,9 (Can be horizon-optimal),10 (Properties defined by `U`),12 (Can incorporate posterior fully via DP),13 (Risk tolerance via `U`). *Fails:* 11a (Max `G` only if `U=log`), 15 (Requires specific `U`), 14 (Robustness depends on `U` choice/model). *Challenge:* Computational complexity for 3,4,9,12.

  In essence, no single approach perfectly satisfies all desiderata and preferences simultaneously. Pure Kelly fails critical non-negotiables under uncertainty. Fractional Kelly improves robustness but crudely handles uncertainty. Expected Utility can satisfy most non-negotiables but abandons utility neutrality and faces computational hurdles. The core challenge lies in rigorously and tractably satisfying **12 (Explicit Dependence on Uncertainty)** while balancing robustness and risk sensitivity.
