answer: |-
  Below is a decision-tree handout that categorizes views on the badness of pain, starting from **pain asymbolia** (where patients feel pain's sensory qualities but lack suffering, withdrawal, or aversion). Each branch addresses key philosophical disagreements, and each leaf names the position (or marks it unnamed), states its most awkward commitment, and fulfills your requirements. Unoccupied combinations and indistinguishable leaves are noted.

  ---

  ### **Decision Tree: What Makes Pain Bad?**
  **Starting Point:** Pain asymbolia patients report sharp/burning sensations in their limb but feel **no awfulness, no withdrawal, and no suffering**.

  1. **Is the sensory quality (e.g., sharpness/burning) inherently bad?**  
     - **Yes** → Go to 2  
     - **No** → Go to 3  

  2. **Is the affective component (suffering/awfulness) necessary for the badness?**  
     - **Yes** → **Hybrid View**  
       - *Awkward commitment*: Pain asymbolia involves a bad sensory quality that is inert (like a "zombie badness") because it lacks affective force, making the experience non-bad despite containing a bad element.  
     - **No** → **Sensory-Dominant View**  
       - *Awkward commitment*: Pain asymbolia is *still bad* for the patient because the sensory quality itself is intrinsically bad, even though they feel no suffering or motivation to avoid it.  

  3. **Is the affective/evaluative component the sole bearer of badness?**  
     - **Yes** → **Affective View**  
       - *Awkward commitment*: Pain asymbolia is **not bad at all** because the suffering/awfulness is absent, so the patient is unharmed by the experience (even with tissue damage).  
     - **No** → Go to 4  

  4. **Is the badness relational (requiring ownership + negative evaluation)?**  
     - **Yes** → **Evaluativist View**  
       - *Awkward commitment*: If a patient disowns their body (e.g., severe depersonalization), even intense suffering might not be bad, as badness depends on the subject seeing the pain as "theirs" and evaluating it negatively.  
     - **No** → Go to 5  

  5. **Do motivational/behavioral consequences (e.g., avoidance) define the badness?**  
     - **Yes** → **Motivational View**  
       - *Awkward commitment*: A fully paralyzed person with intact suffering might not experience "bad pain" if avoidance is impossible, as badness is defined by functional consequences.  
     - **No** → Go to 6  

  6. **Is the patient still harmed in pain asymbolia?**  
     - **Yes** → **Extrinsic Harm View**  
       - *Awkward commitment*: Pain asymbolia patients are **harmed in a different way**—via tissue damage—but the *experience itself* is neutral, turning pain into a mere indicator (like a fever).  
     - **No** → **Unnamed View** (unoccupied, see diagnosis below)  

  ---

  ### **Leaf Summaries**
  | Position             | Key Commitment in Pain Asymbolia                                                                 | Fulfills Your Requirement              |
  |----------------------|--------------------------------------------------------------------------------------------------|----------------------------------------|
  | **Sensory-Dominant** | The sensory quality is intrinsically bad → patient **harmed by experience** (even without suffering). | Patient still harmed.                |
  | **Hybrid**           | Sensory quality is bad but inert without affect → experience **not bad**.                         | —                                     |
  | **Affective**        | Suffering absent → **not bad at all**; patient unharmed by experience.                             | Shows pain isn’t bad without affect. |
  | **Evaluativist**     | Badness requires ownership + evaluation → asymbolia **not bad** (no evaluation).                   | —                                     |
  | **Motivational**     | Avoidance absent → **not bad**; pain badness reduced to behavioral outcomes.                       | —                                     |
  | **Extrinsic Harm**   | Patient **harmed via tissue damage**, but experience is neutral → **different kind of harm**.      | Harmed in a different way.           |
  | *Unnamed*            | *Unoccupied* (see diagnosis).                                                                     | —                                     |

  ---

  ### **Special Notes**
  1. **Unoccupied Combination (Leaf 6 → No)**:  
     - Diagnosis: If one answers "No" to all questions (sensory not bad, affect not sole bearer, relationality irrelevant, motivation irrelevant, and no extrinsic harm), no coherent position exists. *Why?* Pain must be bad *somewhere*—if not in experience, motivation, relations, or consequences, there’s no logical "hook" for badness. No major theory denies all these.  

  2. **Indistinguishable Leaves**:  
     - The **Affective** and **Motivational** views *both conclude pain asymbolia is "not bad,"* but for different reasons (missing affect vs. missing avoidance). The tree separates them cleanly, but they share the same practical outcome for asymbolia.  
     - The **Sensory-Dominant** and **Extrinsic Harm** views *both say the patient is harmed*, but differ on *how* (intrinsic experience vs. bodily damage). The tree distinguishes them via the sensory-badness question (Q1).  

  3. **Key Distinctions Captured**:  
     - **Pain not bad at all**: Affective, Motivational, Evaluativist.  
     - **Patient still harmed**: Sensory-Dominant (by experience), Extrinsic Harm (by damage).  
     - **Harmed in a different way**: Extrinsic Harm (bodily harm ≠ experiential harm).  

