answer: |-
  You've hit on a profound and widely debated objection in meta-ethics: the **self-referential problem** (or "companions in guilt" objection) for evolutionary debunking arguments (EDAs). Your reasoning is spot-on and reflects critiques from philosophers like Thomas Nagel, Alvin Plantinga, and David Enoch. Here's a breakdown:

  ### The Core Problem
  1. **EDAs Claim**: Evolution selected moral intuitions for fitness (e.g., cooperation boosts survival), not for tracking objective moral truths.  
     ∴ We shouldn’t trust moral intuitions as evidence for moral realism.  
  2. **Self-Undermining**:  
     - Beliefs *about evolution itself* (e.g., "natural selection shapes cognition") also rely on cognitive faculties shaped by evolution.  
     - If evolution is unreliable for moral beliefs, why trust it for scientific/metaphysical beliefs?  
     - This risks **global skepticism**: doubting *all* human cognition, including the EDA.

  ### Why This Isn't Necessarily Fatal (The Anti-Realist Replies)
  Anti-realists like Sharon Street offer nuanced responses:

  1. **Selective Skepticism**:  
     Evolution *does* select for truth-tracking in domains where accuracy enhances survival (e.g., "This tiger is dangerous"). But moral truths (e.g., "torture is objectively wrong") don’t clearly impact reproductive fitness. Thus:  
     - **Empirical beliefs**: Likely truth-tracking (evolution rewards accuracy about the physical world).  
     - **Moral beliefs**: Likely fitness-tracking (e.g., "care for offspring" aids survival, regardless of moral truth).  

  2. **The Darwinian Dilemma** (Street’s Defense):  
     - Either our cognitive faculties *are* reliable about evolution → then EDAs undermine moral realism.  
     - Or our faculties *aren’t* reliable → then we can’t trust EDAs (or any belief).  
     - Since we must rely on our faculties to reason at all, the first horn is preferable. Anti-realists argue this doesn’t rescue moral realism—it just shows EDAs apply *specifically* to domains where truth and fitness come apart.

  3. **Distinguishing Belief Types**:  
     - Moral beliefs may lack a "tracking relationship" with truth (unlike perceptual beliefs).  
     - We can use evolutionary science *after* assuming our cognitive faculties are reliable for empirical claims. EDAs then target only moral beliefs as "outliers" in their disconnect from truth.

  ### Why Your Conclusion Isn’t Inevitable
  While the self-referential problem is serious, rejecting EDAs entirely isn’t the only option:
  - **Anti-realists** bite the bullet: They accept that science (including evolution) is the best tool we have, even if contingent. Moral beliefs, however, lack similar empirical anchors.  
  - **Realists** (e.g., Enoch) argue evolution *could* select for moral truth-tracking if moral facts influence survival (e.g., cooperation is adaptive *because* it’s objectively good).  
  - **Pragmatists** abandon the "tracking truth" framework: Moral intuitions are useful social tools, not truth-claims.

  ### Where You're Right
  - The objection **exposes a vulnerability** in EDAs: They must explain why evolution is trustworthy for science but not ethics.  
  - If global skepticism follows, **EDAs lose their force** (we can’t debunk morality without debunking the debunking).  
  - Many philosophers agree this pushes EDAs toward **non-realist alternatives** (e.g., moral anti-realism expressivism) rather than nihilism.

  ### Practical Takeaway
  You don’t need to "just trust moral intuitions." Instead:  
  1. Recognize EDAs as part of a broader dialectic—**not knockout arguments**.  
  2. Moral realism/anti-realism debates hinge on **epistemic foundations** (how we justify beliefs).  
  3. Your intuition points to a deeper truth: **All human reasoning rests on assumptions** (e.g., that cognition is broadly reliable). EDAs exploit this to target morality specifically.

  **In short**: Your objection is valid and potent, but anti-realists argue evolution *differentially* undermines moral beliefs. Whether that defense succeeds remains hotly contested—philosophers haven’t settled it, and your engineering lens brings valuable rigor to the problem!
