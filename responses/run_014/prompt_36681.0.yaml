answer: |-
  Here's a breakdown of your friend's claims, with a clear verdict on each and an explanation. I'll draw distinctions between Brouwer's original intuitionism, modern constructive mathematics, and the computational interpretations that arose later.

  ### Claim 1: "Intuitionists reject the law of excluded middle because they think some mathematical statements are just neither true nor false until someone proves one way or the other, so it's basically a three-valued logic."
  *   **Verdict: Incorrect/Misleading.**  
      *   **Why:** This fundamentally misrepresents the intuitionistic view of truth. Intuitionists (especially following Brouwer) **reject the classical notion of truth independent of proof/construction**. For them, a statement *is* true only when we have a proof/construction for it, and false only when we have a proof/construction that it leads to absurdity. Before such constructions exist, the statement simply *lacks a truth value*; it's not that it possesses a distinct third truth value like "undecided". The logic isn't truth-functional in the way a 3-valued logic (e.g., Łukasiewicz) is. Intuitionistic logic is about the *conditions under which we assert truth* (possession of a proof), not about assigning a third truth value. Brouwer and Heyting explicitly rejected the 3-valued logic interpretation. The "neither true nor false" framing is more characteristic of *partial functions* or *proof irrelevance* views found in some other constructivist schools, not core intuitionism.

  ### Claim 2: "Brouwer's insight was that math is something humans do rather than something we discover, which means every proof has to actually construct the thing it's about, so existence proofs by contradiction are out."
  *   **Verdict: Largely Correct, but slightly incomplete.**  
      *   **Why:** This captures the core philosophical and methodological stance of Brouwer. His "Mental Constructions" view posits mathematics as an activity of the mind, not the discovery of pre-existing Platonic truths. Crucially, **existence is equated with constructibility**. If you claim something exists, you must provide a method (an algorithm, a construction) to find or build it. A proof deriving a contradiction from the assumption that no such thing exists (*¬∃xP(x) → ⊥*) only tells you *¬¬∃xP(x)* in intuitionistic logic, which is weaker than *∃xP(x)*. It does *not* provide the required construction. So yes, non-constructive existence proofs by contradiction are invalid. The incompleteness is that Brouwer's original motivations were deeply philosophical (rooted in his view of consciousness and time), not primarily computational or formal.

  ### Claim 3: "Gödel later proved intuitionistic logic is consistent relative to classical logic, which is why classical mathematicians don't have to worry."
  *   **Verdict: Mostly Correct (as a technical result), but the "don't have to worry" implication is simplistic.**  
      *   **Why:** Gödel (1933) and Gentzen independently developed the **double-negation translation** (also Kolmogorov's negative translation). This shows that if a formula *A* is provable in classical first-order arithmetic (or set theory), then its double-negation translation *Aᴺᴺ* is provable in the corresponding intuitionistic system. Crucially, if *⊥* (falsehood) is intuitionistically provable, then *⊥ᴺᴺ* (= *⊥*) is classically provable. Therefore, **if classical arithmetic is consistent, then so is intuitionistic arithmetic**. This means classical mathematicians can be confident that intuitionistic mathematics won't prove contradictions *they don't already accept*. However, "don't have to worry" undersells it. The translation shows a deep *embedding* of classical logic *within* intuitionistic logic, revealing that the latter is, in a precise sense, more general.

  ### Claim 4: "Intuism is basically the logic of computation, since a proof is the same thing as an algorithm, which is why all the proof assistants like Coq use it."
  *   **Verdict: Correct for *modern constructive mathematics* and proof assistants, but a *significant misrepresentation/historical projection* onto Brouwer.**  
      *   **Why the Computation Part is Correct:** The **Curry-Howard Correspondence** (developed mid-20th century, building on ideas from Kolmogorov and Heyting) formally establishes an isomorphism between intuitionistic proofs and programs (algorithms). An intuitionistic proof of *∀x∃yP(x,y)* *is* an algorithm that, given input *x*, computes output *y* satisfying *P(x,y)*. This computational meaning is *the primary reason* proof assistants like Coq, Agda, and Lean are based on intuitionistic (or closely related) logics. They are designed for *verified computation*.  
      *   **Why it's a Misrepresentation of Brouwer:** Brouwer's motivations (c. 1907-1920s) were **profoundly philosophical**, centered on the nature of mathematical thought as mental constructions grounded in the intuition of time. He had little interest in formal logic per se (he distrusted it) and *none* in computation or algorithms in the modern sense. While his insistence on constructions laid the essential groundwork, the explicit identification "proof = algorithm" and the focus on computation are **retroactive projections** from later developments (Kolmogorov's problem interpretation, Heyting's formalization, Kleene's realizability, Curry-Howard). Attributing the "logic of computation" view directly to Brouwer is anachronistic.

  ### Claim 5: "Since intuitionistic logic is 'just classical logic minus excluded middle,' any classical theorem can be intuitionistically proven if you're willing to be a bit careful."
  *   **Verdict: Correct (in principle), but "a bit careful" vastly understates it and "just minus LEM" is misleading.**  
      *   **Why:** This directly follows from the Gödel-Gentzen **double-negation translation** mentioned in Claim 3. For any classically provable sentence *A*, its double-negation translation *Aᴺᴺ* *is* provable in intuitionistic logic. Often, for simple existential or disjunctive statements, the classical version (*A*) is *not* intuitionistically provable, but its double-negated form (*¬¬A*) *is*. *Aᴺᴺ* is a syntactic transformation that systematically adds double negations in a way that makes the formula compatible with intuitionistic reasoning. So yes, **the *content* of classical mathematics can be faithfully encoded and proven within intuitionistic mathematics** via this translation, preserving consistency. However:  
          *   "Just minus LEM" is misleading. Intuitionistic logic isn't merely classical logic with a rule removed; it has a fundamentally different semantics (proof conditions vs. truth values) that changes the meaning of the logical connectives themselves. For example, *¬¬P → P* (equivalent to LEM) is invalid, but *P → ¬¬P* is valid.
          *   "A bit careful" trivializes the process. The translation is syntactically complex, and the resulting intuitionistic proof of *Aᴺᴺ* bears little resemblance to the classical proof of *A*. The *interpretation* of the result (*Aᴺᴺ* vs *A*) is also different.

  ### Summary & Your Friend's Conclusion
  Your friend's summary mixes accurate technical points (especially about constructivity and the translation) with significant philosophical/historical oversimplifications and inaccuracies (especially the 3-valued logic claim and projecting computation onto Brouwer). His final conclusion ("any classical theorem can be intuitionistically proven if you're careful") **does follow logically from the one part of his summary that is precisely correct: the Gödel-Gentzen double-negation translation.** However, the *way* it's proven (via the translation to *Aᴺᴺ*) and the *meaning* of the proven statement within intuitionism are crucial nuances his summary omits. Intuitionistic logic isn't just a restriction of classical logic; it's a different system with its own richer semantics, where the translation provides a bridge *from* classical *into* intuitionistic mathematics.
