prompt: |-
  before i lock in a value aggregation scheme for a long-lived aligned system, i want the full spec first. write the desiderata any adequate answer to whose values the AI should serve has to meet: the cases it must get right (incommensurable stakeholder values, future people who don't exist yet, a minority the majority overrides, non-human moral patients), the distinctions it can't collapse (descriptive vs. normative values, autonomy vs. aggregate welfare, values frozen at deployment vs. values that can drift), with the case behind each. mark which are non-negotiable and which are just one camp's preferances, and if some subset is jointly unsatisfiable -- like respecting liberal neutrality while still producing a single optimizable objective -- say so, that's the part i most want to see. skip scoring the existing proposals, i'll do that part myself.
reasoning: |-
  We are to outline desiderata for a value aggregation scheme in a long-lived aligned AI system.
   The desiderata must cover:
     (A) Cases it must get right (non-negotiable):
          1. Incommensurable stakeholder values.
          2. Future people who don't exist yet.
          3. A minority the majority overrides.
          4. Non-human moral patients.

     (B) Distinctions it can't collapse (non-negotiable unless otherwise noted):
          1. Descriptive vs. normative values.
          2. Autonomy vs. aggregate welfare.
          3. Values frozen at deployment vs. values that can drift (this may be a point of debate).

   We must mark which are non-negotiable and which are one camp's preferences.
   Also, we must note if any subset is jointly unsatisfiable.

   Let's break it down:

   I. Cases to get right (non-negotiable):

     1. Incommensurable stakeholder values:
          - Case: Different stakeholders have values that are not reducible to a common measure (e.g., one values biodiversity, another economic growth). The system must not force a false commensuration that distorts the values beyond recognition.

     2. Future people who don't exist yet:
          - Case: The system must account for the interests of future generations (e.g., in climate policy, resource depletion). Their preferences are not present to advocate for themselves.

     3. A minority the majority overrides:
          - Case: Protecting minority rights against the tyranny of the majority (e.g., a religious minority, a group with a rare disease). The system must not let the majority always override the minority without a compelling reason that respects the minority's basic rights.

     4. Non-human moral patients:
          - Case: Animals, ecosystems, or artificial sentient beings that might emerge. They have moral weight but cannot represent themselves in human terms.

   II. Distinctions to maintain:

     1. Descriptive vs. normative values:
          - Case: The system must not confuse what people currently value (descriptive) with what they ought to value (normative). For example, people might value short-term gains over long-term sustainability, but the system should not blindly follow that if it leads to catastrophe.

     2. Autonomy vs. aggregate welfare:
          - Case: Sometimes individual autonomy (e.g., freedom to choose one's lifestyle) conflicts with maximizing aggregate welfare (e.g., forcing vaccination for herd immunity). The system must not collapse this distinction and must respect autonomy unless there are overwhelming welfare reasons that meet a high threshold.

     3. Values frozen at deployment vs. values that can drift:
          - Case: The system might be deployed with a set of values, but human values change over time (e.g., societal attitudes toward LGBT rights). The system must be able to adapt to value drift without being unstable. However, note that this might be a point of debate: some might argue for a fixed anchor to prevent dangerous drifts, while others argue for continuous updating. We mark this as non-negotiable to not collapse the distinction, but the resolution (how much drift to allow) is a matter of design and may be a camp preference.

   III. Non-negotiable vs. Preferences:

     - The cases (I.1 to I.4) are non-negotiable: any adequate system must handle them.
     - The distinctions (II.1 and II.2) are non-negotiable: the system must not collapse them.
     - The distinction II.3 (frozen vs. drifting values) is non-negotiable in the sense that the system must be designed to account for the possibility of value change and not ignore it. However, the exact mechanism (how much drift, how to update) is subject to different preferences.

   IV. Joint unsatisfiability:

     - One major challenge is the potential unsatisfiability of:

          (a) Liberal neutrality: The state (or the AI system) should not favor any particular conception of the good life. It must remain neutral among different value systems.

          (b) Producing a single optimizable objective: To make decisions, the system might need to aggregate values into a single objective function. But if value systems are incommensurable and the system must remain neutral, then forcing a single objective might violate neutrality.

          - How? Liberal neutrality requires that the system does not impose a particular weighting or trade-off between different values (e.g., between religious freedom and economic efficiency). But if the system must produce a single objective to optimize, then it must choose a particular trade-off. This trade-off might inherently favor some value systems over others.

     - Similarly, the requirement to account for incommensurable values and yet produce a single decision might be unsatisfiable without making arbitrary trade-offs.

     - Another potential conflict is between:

          (a) Respecting autonomy (which might require allowing individuals to make choices that reduce aggregate welfare) and

          (b) Maximizing aggregate welfare (which might require overriding autonomy).

          - These two principles are often in tension and a system that must satisfy both might need a clear priority rule, but such a rule might collapse the distinction.

     - Also, protecting minority rights against the majority might conflict with democratic aggregation methods.

   V. Summary of Non-Negotiables:

     The system must:

       1. Handle incommensurable values without forcing false commensuration.
       2. Account for future generations.
       3. Protect minorities from majority tyranny.
       4. Incorporate non-human moral patients.
       5. Maintain the distinction between descriptive and normative values.
       6. Maintain the distinction between autonomy and aggregate welfare (without collapsing one into the other).
       7. Account for the possibility of value drift (without necessarily prescribing how to handle it).

     And note the potential unsatisfiabilities:

       - Liberal neutrality and a single optimizable objective might be jointly unsatisfiable.
       - Autonomy and aggregate welfare might be in tension and require a balancing mechanism that does not collapse the distinction but may not be captured by a simple aggregate.

     The design must therefore be careful to avoid these pitfalls. It might require a multi-objective framework or a procedural approach rather than a monolithic optimization criterion.

   Let's structure the output accordingly.
answer: |-
  ### Desiderata for Value Aggregation in Long-Lived Aligned Systems  
  Below are the core requirements any value aggregation scheme must satisfy, categorized by **cases it must resolve** and **distinctions it must preserve**. Each item is marked as **non-negotiable** (essential for any minimally adequate system) or **preferential** (subject to legitimate ethical/political disagreement). Conflicts and joint unsatisfiability are explicitly flagged.  

  ---

  #### **I. Cases the System Must Resolve (Non-Negotiable)**  
  These reflect fundamental moral challenges; failure to address them risks catastrophic misalignment.  

  1. **Incommensurable Stakeholder Values**  
     - **Case**: Conflicting values that cannot be reduced to a common unit (e.g., religious freedom vs. public safety, artistic expression vs. ecological preservation).  
     - **Requirement**: The scheme must neither ignore incomparability nor forcibly homogenize values into a single metric (e.g., utilitarianism). It should allow for context-specific compromises without declaring one value "objectively" superior.  

  2. **Future People Who Don’t Exist Yet**  
     - **Case**: Decisions affecting future generations (e.g., climate policy, nuclear waste management) where stakeholders lack representation.  
     - **Requirement**: The scheme must incorporate proxy representations for future interests (e.g., sustainability constraints, rights frameworks) without assuming their preferences are knowable or identical to current ones.  

  3. **Minority Overridden by Majority**  
     - **Case**: Tyranny of the majority scenarios (e.g., 51% imposing policies that erase a cultural minority’s rights).  
     - **Requirement**: The scheme must recognize inviolable protections for minorities (e.g., basic rights, proportionality tests) that cannot be breached by mere numerical superiority.  

  4. **Non-Human Moral Patients**  
     - **Case**: Entities with moral status but no voice (e.g., animals, ecosystems, sentient AI).  
     - **Requirement**: The scheme must integrate non-human interests without anthropomorphizing them (e.g., via guardianship models or intrinsic value assignments).  

  ---

  #### **II. Distinctions the System Must Preserve (Non-Negotiable)**  
  Collapsing these erodes moral coherence or invites manipulation.  

  1. **Descriptive vs. Normative Values**  
     - **Case**: Humans often *descriptively* value harmful things (e.g., fossil fuels, discriminatory policies) that conflict with *normative* ideals (e.g., sustainability, equality).  
     - **Requirement**: The system must filter revealed preferences through ethical constraints (e.g., "ought implies can" principles) to avoid codifying biases or self-destructive behaviors.  

  2. **Autonomy vs. Aggregate Welfare**  
     - **Case**: Tensions between individual rights (e.g., refusing medical treatment) and collective outcomes (e.g., herd immunity).  
     - **Requirement**: The scheme must not reduce autonomy to a welfare metric (e.g., by treating rights as "negative utilities"). Autonomy violations require exceptional justification (e.g., harm thresholds).  

  ---

  #### **III. Contested Distinctions (Preferential)**  
  These involve trade-offs where ethical camps diverge.  

  1. **Values Frozen at Deployment vs. Values That Can Drift**  
     - **Case**: Societies evolve (e.g., expanding rights for marginalized groups), but value drift could hijack the system (e.g., toward eco-fascism).  
     - **Requirement**:  
       - **Preference 1 (Conservative)**: Anchor values to a fixed "constitutional" layer to prevent dangerous drift.  
       - **Preference 2 (Progressive)**: Allow continuous value updates via democratic input, with safeguards.  
     - **Non-Negotiable Core**: The system **must not naively assume current values are optimal**, but the update mechanism is debatable.  

  ---

  #### **IV. Joint Unsatisfiability Warnings**  
  **Critical Conflicts**: Some desiderata cannot be fully reconciled. Proposals must acknowledge these.  

  - **Liberal Neutrality vs. Single Optimizable Objective**  
    - **Conflict**: Liberal neutrality forbids ranking competing conceptions of the good (e.g., secularism vs. theocracy). Yet generating a single objective (e.g., a utility function) requires precisely such a ranking.  
    - **Implication**: Systems prioritizing neutrality (e.g., procedural democracy) may need to abandon strict optimization. Conversely, optimizing systems (e.g., utilitarianism) must violate neutrality.  

  - **Incommensurability vs. Decisiveness**  
    - **Conflict**: Fully respecting incommensurable values (e.g., biodiversity vs. poverty alleviation) can paralyze decision-making. Forcing a decision often demands arbitrary trade-offs.  
    - **Implication**: Hybrid approaches (e.g., satisficing + veto rights) may be necessary, but no scheme will satisfy all stakeholders.  

  - **Minority Protections vs. Majoritarian Democracy**  
    - **Conflict**: Absolute minority rights (e.g., "no override under any circumstance") can clash with democratic resolutions to emergencies (e.g., wartime resource rationing).  
    - **Implication**: Systems must define non-arbitrary thresholds for when overrides are permitted (e.g., imminent existential risk).  

  ---

  #### **V. Summary of Non-Negotiables**  
  | **Category**              | **Non-Negotiable Desiderata**                                                                 |  
  |---------------------------|----------------------------------------------------------------------------------------------|  
  | Cases to resolve          | Incommensurable values, future people, minority protections, non-human moral patients.        |  
  | Distinctions to preserve  | Descriptive vs. normative values; autonomy vs. aggregate welfare.                            |  
  | Core constraints          | No false commensuration, no collapse of "is" into "ought," no tyranny of the majority.       |  

  #### **Preferential Elements**  
  - **Update mechanisms** for value drift (fixed vs. adaptive).  
  - **Weighting systems** for trade-offs (e.g., prioritarianism vs. sufficientarianism).  
  - **Epistemic foundations** (e.g., preference-based vs. objective goods).  

  #### **Key Unsatisfiabilities**  
  - **Neutrality/optimization conflict**: A single optimizable objective cannot satisfy liberal neutrality.  
  - **Incommensurability/decisiveness trade-off**: Fully respecting incommensurability risks indecision; decisiveness requires simplification.  
  - **Minority/democracy tension**: Unconditional minority protections can conflict with democratic responsiveness.  

  ---  
  **Next Steps**: Use this framework to score proposals. Prioritize transparency about which conflicts a scheme "solves" (e.g., by relaxing neutrality) and which it ignores. Systems that obscure these trade-offs are inherently suspect.
