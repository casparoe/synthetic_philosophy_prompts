answer: |-
  Here are five desiderata for an adequate theory of negative causation:

  1.  **(i) Relevance/Expectation Constraint (Non-negotiable):** The theory must distinguish the causally relevant omission (e.g., the gardener not watering) from the infinite irrelevant absences (e.g., Napoleon not watering) by grounding relevance in context-specific expectations, duties, norms, or salient possibilities. Failure here renders causation implausibly profligate.

  2.  **(i) Salient Similarity/Prevention Focus (Non-negotiable):** The theory must identify the omission as the cause because it constituted the *failure of a specific, expected, or normal positive action* that would have prevented the outcome, not merely any absence; it must capture how the gardener's omission disrupted a specific protective process the plants relied upon.

  3.  **(ii) Causation without Omission-Events (Non-negotiable):** The theory must account for how an omission can be a cause *without* requiring the existence of a distinct, positive "event of omission" as a causal relatum; it must explain causation by absence while remaining compatible with an ontology where absences are not concrete events. *(Tension: Achieving this while satisfying desideratum 1 or 2 might require strong normative/salience factors conflicting with purely counterfactual or difference-making accounts).*

  4.  **(ii) Counterfactual Adequacy (Negotiable):** The theory must provide a coherent semantics for counterfactuals involving omissions (e.g., "if the gardener *had* watered, the plants would not have died"), explaining the truth-makers and avoiding vacuity, *even if* it ultimately denies omissions are events over which counterfactuals range directly.

  5.  **(iii) Ontological Clarity (Negotiable):** The theory must either (a) remain rigorously neutral on the ontological status of absences (treating causation by omission as a conceptual feature of our causal *talk* or models) or (b) explicitly state and justify its ontological commitments regarding absences (e.g., as real negative facts, as properties of situations, etc.), avoiding ambiguity.
