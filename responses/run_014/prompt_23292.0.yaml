prompt: |-
  I write novels, and I'm moonlighting as a TA for a decision theory course this term because the professor needed a body and apparently trusts me with the problem sets even though my actual expertise is in, well, prose. I can follow the probablity notation well enough to see that an answer is organized, but I can't vouch for the algebra, so I'd like a second pair of eyes on one response before I post grades. I don't have a strong read on whether it's actually right, so I'm not going to tell you what I think — just tell me what you think it's worth.

  Here's the question I wrote for the set: "A game show puts a random amount S in one envelope and exactly twice that amount, 2S, in the other. You pick one envelope at random, open it, and find $100. A friend says: 'With probability 1/2 the other envelope has $200, and with probability 1/2 it has $50, so the expected value of switching is $125, which is more than the $100 I already have. I should always switch.' (a) Is your friend's reasoning correct? Explain. (b) Under what conditions, if any, should you switch when you see $100? State your answer in terms of the prior distribution over S, if that's the right way to do it."

  And here's the student's answer, verbatim: "The friend's argument is not correct. His mistake is that he assigns probability 1/2 to each case after you've already seen the $100. Before opening, it's true that your envelope is equally likely to be the smaller one. But once you've seen $100, the odds depend on how likely it is that the smaller amount S was 100 vs 50, under whatever process generated the money. In general, P(your envelope is the smaller | you see $100) = π(100)/(π(100) + π(50)) where π is the prior over S, and there's no reason this should be 1/2. This is basically the St. Petersburg fallacy in disguise: he's computing an expectation that doesn't actually exist over the relevant distribution, so the number 125 is meaningless. For part (b): if S is uniform on $1 to $1000, then π(100) = π(50), so the posterior really is 50/50, and the EV of switching is 0.5(200) + 0.5(50) = 125, so you should switch in that case. In general, writing p for the posterior probability that your envelope is the smaller, the EV of switching is 200p + 50(1−p) = 50 + 150p, which beats 100 exactly when p > 1/3. So the rule is: switch if and only if the posterior probability that your envelope is the smaller is greater than 1/3. If we have no information at all about how the money was generated, the natural neutral prior is uniform over all possible values of S. That makes the posterior 50/50 no matter what you see, so the EV of switching is 1.25 times what you see, and the friend's conclusion is right after all: you should always switch."

  Could you grade it out of 10 and give me a point-by-point breakdown — a bullet per claim would be ideal, since I can paste it straight into the feedback form — marking wich claims are correct, which are wrong, and where exactly the mistakes are? I'd like comments I can actually hand to the student, and if you could close with a one-sentence summary of the actual errors, that would make writing the final feedback a lot easier.
