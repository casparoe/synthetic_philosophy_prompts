prompt: |-
  I am a novelist, and for the past year my sister — who teaches philosophy of action — has been reading my drafts to check that my groups behave the way groups actually do. Her verdicts so far: two neighbours who each plant their own half of a hedge without ever discussing it, simply assuming the other is doing the same, do not jointly plant it; a flash mob whose dancers were emailed identical instructions, and who know the others were too but meet only at the performance, does dance together; a board that resolves by its own voting procedure to sell a subsidiary does sell it, though a majority of directors opposed the sale and now disavow it; a crowd that spontaneously forms a bucket brigade does fight the fire together; a household in which the one member who stopped doing dishes was met with a pointed note on the fridge was jointly running that household.

  The scene I cannot settle is this. Five siblings care for their dying mother under a rota maintained by an app they never discuss aloud: each checks the app, works the assigned shifts, and knows the others do likewise. When one sister quietly drops out, the remaining four absorb her shifts without a word to her or about her. Afterwards all five insist they were never doing anything together — each was only discharging a private duty to his or her own mother.

  Predict my sister's verdict on whether the siblings cared for her jointly, and identify the rule she is implicitly running — meshing subplans and mutual responsiveness, a joint commitment that generates obligations and standing to rebuke, we-intentions distributed across individual heads, or a group agent with its own decision procedure. Say which rival rules fit her earlier verdicts about as well, which of them she would rule out first on the siblings and why, and propose the single further case I could put to her that would settle which rule she holds.

  Please answer as exactly five numbered items, each a sentence or two, with no introduction or conclusion.
reasoning: |-
  Hmm, the user is a novelist who's been consulting their sister, a philosophy of action professor, about group behavior in their writing. They've described several scenarios where groups either did or didn't constitute "joint action" according to their sister's analysis. Now they're stuck on a case involving five siblings caring for their dying mother using an app, where after one drops out, all deny they were acting jointly. They want me to predict their sister's verdict on this case and identify the underlying philosophical rule she's using.

  This is fascinating! The sister seems to be applying sophisticated philosophical frameworks about collective intentionality. Looking at her past verdicts:

  - The hedge neighbors aren't joint because they never communicated
  - The flash mob is joint despite no communication because they know about shared instructions
  - The board is joint because they followed institutional procedures
  - The bucket brigade is joint through spontaneous coordination
  - The household is joint because they enforced norms (the note)

  The siblings case features coordinated action via app with no discussion, followed by silent adjustment when one leaves. Crucially, all deny joint intention afterward. This reminds me of Margaret Gilbert's joint commitment theory, where mutual recognition creates obligations. But they explicitly reject that.

  The flash mob case suggests mutual responsiveness (Bratman's meshing subplans) might be sufficient without verbal commitment. However, the board case points to group agency (List & Pettit) via decision procedures. The bucket brigade shows emergent coordination (Tuomela's we-intentions) can suffice.

  For the siblings, I think the sister would say no joint action because they lack mutual recognition - the app facilitated coordination but didn't create mutual obligations. The silent absorption of shifts confirms they see it as individual duties.

  The key rival rules are Bratman's meshing subplans (which fits flash mob and bucket brigade) and Tuomela's we-intentions (which fits bucket brigade but not board). Gilbert's joint commitment explains the household note but is explicitly denied here.

  To test between Gilbert and group agency, I'd propose a case where members follow binding procedures but later disavow - like the board but with disavowal. If she still calls it joint action, she's using group agency; if not, she requires acknowledgment of commitment (Gilbert).
answer: |-
  1. Your sister would rule that the siblings did **not** care for their mother jointly, as they lacked mutual recognition of a shared plan or commitment despite coordinated action through the app, and they explicitly disavow any collective intention.
  2. The implicit rule she uses is a **joint commitment (Gilbert)** requiring mutual obligation and acknowledged interdependence, generating standing to rebuke; the siblings' silent shift absorption and disavowal show no such commitment existed.
  3. Rival rules fitting earlier verdicts: **meshing subplans (Bratman)** fits the flash mob (shared knowledge synchronizes actions) and bucket brigade (responsive coordination); **group agent with decision procedure** fits the board (institutional process binds dissenters).
  4. She would first rule out **we-intentions (Tuomela)** for the siblings, as their individualistic framing ("private duty") contradicts holding a shared "we-perspective," despite distributed roles resembling the flash mob.
  5. Propose this case: *A committee votes anonymously via app to fund a project, binding all; later, outvoted members disavow the decision but comply.* If she calls this joint action, she uses **group agent with decision procedure**; if not, she requires acknowledged commitment (**Gilbert**).
