answer: |-
  Here's a breakdown of the desiderata, conflicts, and key commitments in the theory of higher-order evidence (HOE), structured to address your specific requests:

  ---

  ### **Core Desiderata for a Theory of Higher-Order Evidence**
  *(With motivation and consensus status)*

  1. **Handle Peer Disagreement**  
     - **Case**: You and an equally rational peer, with access to the same first-order evidence (FOE), reach opposite conclusions (e.g., "Is this defendant guilty?"). Later, you learn of your peer's disagreement.  
     - **Requirement**: The theory must explain how (or whether) this HOE (your peer's dissent) affects your rational first-order belief.  
     - **Consensus**: Universally accepted as central. *Contention*: **Conciliationists** (e.g., Christensen, Elga) insist it *must* force belief revision; **steadfasters** (e.g., Kelly, Titelbaum) deny this.

  2. **Resolve Rational Akrasia Puzzles**  
     - **Case**: A drug ("Irrationality Drug") causes 90% of users to misevaluate FOE. You take it and receive strong FOE for belief P, but also know the drug impairs reasoning.  
     - **Requirement**: Can it be rational to believe P *while* believing your belief in P is irrational?  
     - **Consensus**: Most agree the theory must address this. *Contention*: **Enkratists** (e.g., Titelbaum) reject rational akrasia; **anti-enkratists** (e.g., Lasonen-Aarnio, Weatherson) permit it.

  3. **Preserve the Independence Principle**  
     - **Motivation**: HOE should not be reducible to FOE; it provides evidence *about* your reasoning process, not directly about the world.  
     - **Requirement**: HOE must exert rational influence distinct from FOE (e.g., disagreeing peers don’t just add FOE; they challenge your competence).  
     - **Consensus**: Widely accepted. *Contention*: **Reductionists** (e.g., some Bayesian approaches) try to absorb HOE into FOE; others insist on irreducibility.

  4. **Avoid Epistemic Circularity/Regress**  
     - **Case**: If HOE about your reasoning (e.g., "I might be biased") requires suspending judgment, how do you evaluate *that* HOE without further HOE?  
     - **Requirement**: The theory shouldn’t generate infinite regresses or paralyze reasoning.  
     - **Consensus**: Universally accepted as a constraint.

  5. **Respect Underlying Rationality**  
     - **Case**: You reason flawlessly with FOE to believe P, but misleading HOE (e.g., false evidence of impairment) suggests your reasoning was faulty.  
     - **Requirement**: The theory shouldn’t imply you were *actually* irrational before receiving HOE.  
     - **Consensus**: Accepted by most. *Contention*: Some (e.g., Williamson) argue HOE can *reveal* past irrationality.

  6. **Cohere with Epistemic Norms**  
     - **Requirement**: Consistency with broader norms (e.g., probabilism, updating rules, justification transmission).  
     - **Examples**: If FOE justifies P, can HOE "defeat" this justification? Can rational credences violate the Enkratic Principle?  
     - **Consensus**: Required, but interpretations vary.

  ---

  ### **Key Conflicts & Tradeoffs**
  1. **Enkratic Principle vs. Peer Disagreement + Independence**  
     - **Conflict**: If HOE (peer disagreement) *must* lower confidence in your belief (Independence), and you must align beliefs with beliefs about rationality (Enkratic Principle), then disagreement forces conciliationism → regress threat.  
     - **Resolution**:  
       - **Option 1**: Reject Enkratic Principle (e.g., Lasonen-Aarnio). Allows steadfastness but permits rational akrasia.  
       - **Option 2**: Reject Independence (e.g., Kelly). Treat peer disagreement as FOE about the disputed fact.  
       - **Option 3**: Accept limited conciliationism + regress-management (e.g., Christensen).

  2. **Independence vs. Underlying Rationality**  
     - **Conflict**: Flawless reasoning + misleading HOE (e.g., false peer disagreement) *shouldn’t* imply past irrationality, but strong Independence suggests HOE overrides FOE.  
     - **Resolution**: Distinguish *current* rationality (influenced by HOE) from *past* rationality (based on FOE alone).

  3. **Enkratic Principle vs. Akrasia Cases**  
     - **Conflict**: Anti-enkratists use cases like the Irrationality Drug to show akrasia is sometimes rational. Enkratists (e.g., Titelbaum) argue such cases misdescribe the epistemic state.  
     - **Tradeoff**: Rejecting Enkrasia avoids "double-counting" problems but clashes with intuitions about epistemic coherence.

  ---

  ### **The Pivotal Desideratum: The Independence Principle**
  - **Why it’s pivotal**: Accepting strong Independence forces conciliationism in peer disagreement, risking regress and conflict with Enkrasia. Rejecting it (e.g., treating HOE as FOE) avoids these but may collapse the FOE/HOE distinction.  
  - **Effect**: Your stance here dictates whether HOE is a *unique* epistemic force or reducible. It shapes responses to disagreement, akrasia, and regress.

  ---

  ### **What’s Settled vs. Contested**
  - **Settled**:  
    - HOE is distinct from FOE in its *target* (reasoning vs. world).  
    - Peer disagreement and akrasia cases are central.  
    - Regress must be avoided or managed.  
  - **Contested**:  
    - **Enkratic Principle**: Rejection is a live option (e.g., Lasonen-Aarnio, Weatherson). Titelbaum defends it as non-negotiable.  
    - **Independence**: Conciliationists uphold it; steadfasters/reductionists challenge it.  
    - **Peer Disagreement**: No consensus on whether equal-weight conciliation is required.  
  - **The "No-Distinction" Camp**:  
    - **Position**: HOE/FOE distinction is illusory; all evidence bears on both the world and our reliability (e.g., Williamson, some Bayesians).  
    - **Status**: Influential but minority. It functions as a **meta-desideratum**: a theory *must justify* why HOE is special or explain why it isn’t.

  ---

  ### **Key Takeaways**
  1. **Core Conflict**: **Enkratic Principle vs. Independence** is the crux. Commit to one, and your theory’s handling of disagreement/akrasia/regress follows.  
  2. **Live Options**: Rejecting the Enkratic Principle or Independence are both serious positions. The former permits rational akrasia; the latter deflates HOE’s novelty.  
  3. **Regress is Real**: If HOE can override FOE *and* you need HOE to assess HOE, infinite regress looms. Theories *must* address this (e.g., via foundationalism or defeaters).  
  4. **Centrality of Peer Disagreement**: It remains the primary test case that forces commitments on other desiderata.  

  **Where to start reading**:  
  - **Pro-Enkrasia/Conciliationism**: David Christensen (*Disagreement as a Philosopher’s Archimedes*)  
  - **Anti-Enkrasia/Steadfast**: Maria Lasonen-Aarnio (*Higher-Order Evidence and the Limits of Defeat*)  
  - **Critique of the Distinction**: Timothy Williamson (*Very Improbable Knowing*)  

  This map should help you navigate papers by identifying which desiderata they treat as fixed and which they negotiate—saving you from reinventing the wheel with each new article.
