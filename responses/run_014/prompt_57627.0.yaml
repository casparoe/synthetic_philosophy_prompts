answer: |-
  Here’s a targeted Q&A prep sheet prioritizing the likeliest and most damaging objections from your audience, with concise replies and vulnerability assessments. I’ve ordered them by potential damage to your core argument:

  ### **Top 8 Objections (Ordered by Destructive Potential)**
  1. **The State Capacity/Objection (Irish Historian)**  
     *Likely phrasing:* "You treat 'the authority' as a unified actor with clear capacity, but in Ireland/Bengal/China, the state was fragmented, under-resourced, or ideologically constrained. How can your tests apply when local agents sabotaged relief (Ireland), colonial priorities overrode Bengal, or Mao-era decentralization created chaos? Isn’t this just blaming 'the state' for structural constraints?"  
     *Reply:* "The test specifies *ruling authority* at the relevant jurisdictional level. For Ireland, Westminster controlled fiscal policy and shipping; for Bengal, the War Cabinet controlled transport; for China, the Center set quotas and purged critics. The test asks if *that* authority had options *within its actual capacity*—e.g., suspending grain exports (Bengal), revising poor-law financing (Ireland), or halving procurement (China). Structural constraints matter, but don’t absolve specific, feasible choices."  
     *Soft spot:* Conflating *de jure* control with *de facto* capacity. If provincial cadres hid data from Mao, was Beijing truly the "authority"?  

  2. **The Epistemic Counterfactual (China Specialists)**  
     *Likely phrasing:* "You claim authorities 'culpably failed to know,' but in China’s case, local cadres falsified reports upward. If the Center received inflated yield data, how could it know the true deficit? Isn’t your 'culpable opacity' just hindsight bias?"  
     *Reply:* "The epistemic test isn’t 'did they know?' but 'did they *culpably fail* to know?'. The Center dismantled statistical bureaus (1958), purged critics (Peng Dehuai, 1959), and mandated reporting through incentivized channels. When you systematically destroy feedback mechanisms, ignorance isn’t passive—it’s manufactured. The test fails if they *couldn’t* have known; it holds if they ensured they *wouldn’t*."  
     *Soft spot:* Proving intent to *create* ignorance vs. bureaucratic incompetence. Hard to disprove "they believed their own propaganda."  

  3. **The Avertability Counterfactual (Economists)**  
     *Likely phrasing:* "Your 'realistically bearable costs' are vague. Can you quantify the trade-offs? If Churchill diverted ships from Burma, might more have died in the war? If China imported grain in 1960, would it have triggered a debt crisis? Without a CBA, isn’t this moral judgment masquerading as analysis?"  
     *Reply:* "The test uses *contemporaneous* alternatives: e.g., Ireland could have suspended the Corn Laws earlier (as Peel privately urged); Bengal could have released hoarded military rice stocks (as provincial officials begged); China could have cut procurement *after* 1959 harvest data (albeit flawed) showed collapse. We need only show *some* feasible action existed—not that it was optimal."  
     *Soft spot:* Demands for precise counterfactual mortality estimates. Best to cite historical alternatives proposed *at the time*.  

  4. **Agency vs. Structure (Legal Scholar)**  
     *Likely phrasing:* "'Crime' implies mens rea by a person. How can a bureaucracy have intent? If Churchill ignored Bengal but his cabinet was misinformed, who is guilty? You risk anthropomorphizing the state."  
     *Reply:* "Legally, *organizational* culpability exists (e.g., corporate manslaughter). The test identifies *systemic* criminal negligence: patterns of choices (censorship, purges) that predictably caused blindness to harm. We needn’t pin it on one person—though in these cases, key decision-makers (Churchill, Trevelyan, Mao) overrode warnings."  
     *Soft spot:* Legal scholar may counter that ICL requires individual culpability (Art. 25 ICC Statute). Concede this is *moral* crime, not strictly legal.  

  5. **The Irish Poor Law Dodge (Irish Historian)**  
     *Likely phrasing:* "You blame Westminster for relief eligibility rules, but the Poor Law was designed for local funding—and Irish landlords were bankrupt. Wasn’t strict eligibility fiscally necessary to avoid total collapse?"  
     *Reply:* "The test asks if alternatives existed *at bearable cost*. Treasury reserves in 1846–47 were healthy; Peel had funded relief without strict eligibility in 1845. The choice to prioritize laissez-faire ideology over flexibility (e.g., temporary Treasury grants) was political, not fiscal. Trevelyan’s letters prove awareness of the death toll."  
     *Soft spot:* If audience accepts "fiscal necessity," avertability fails. Stress *Peel’s* earlier policy as feasible.  

  6. **Sen Straw Man? (Economists)**  
     *Likely phrasing:* "Sen’s 'democracy + press' claim is institutional, not moral. Isn’t your 'culpable opacity' just Sen with different labels? Why reframe it?"  
     *Reply:* "Sen’s formulation implies democracies *automatically* prevent famine. But opacity can exist in democracies (e.g., Bengal’s censorship) and be absent in autocracies (e.g., post-1978 China). My frame isolates the *mechanism* (information suppression) and generalizes it. This explains why some democracies fail (if opacity exists) and some autocracies succeed (if it doesn’t)."  
     *Soft spot:* Sen might agree—your critique is more semantic than substantive.  

  7. **Bengal’s Wartime Exception (Economic Historians)**  
     *Likely phrasing:* "Given Japan’s 1942 Bengal invasion, wasn’t boat denial rational? And with Burma rice gone and SE Asia blockaded, what 'available measures' existed beyond Allied aid Churchill requested?"  
     *Reply:* "Boat denial *was* rational—but not its *indefinite extension* after the invasion threat receded. Measures: release military rice stockpiles (500k tons in Calcutta), halt exports to Ceylon/Sri Lanka, end hoarding by punishing speculators (as Amartya Lahiri showed was feasible). Famine Commission documents show London knew these options by mid-1943."  
     *Soft spot:* Proving Churchill’s inaction wasn’t strategic trade-off. His racist memos ("Indians breeding like rabbits") undermine that defense.  

  8. **Weather vs. Policy in China (China Specialists)**  
     *Likely phrasing:* "Even revisionist econometrics (e.g., Meng et al. 2015) attributes 30–50% of the output collapse to bad weather. If nature caused half the deficit, how can you claim avertability?"  
     *Reply:* "Avertability isn’t binary. My test asks if measures could have held mortality *near baseline*—not prevented all suffering. China’s procurement *doubled* in 1959 despite falling yields. If procurement stayed at 1958 levels, deaths would have plummeted (as risked in 1962). Weather explains scarcity; policy explains lethality."  
     *Soft spot:* If weather caused >70% of deficit, your case weakens. Stress *procurement vs. yield* divergence.  

  ---

  ### **Preemptive Concessions (First 5 Minutes)**  
  Disarm two key objections upfront:  
  > *"Before proceeding, two clarifications: First, this framework does not assume omnipotent states. State capacity constraints matter—but we must ask whether feasible alternatives existed within those constraints (e.g., revising Ireland’s Poor Law financing without requiring local funds). Second, I am not claiming weather or structural factors played no role—only that *policy choices* determined whether scarcity became mass mortality."*  

  ---

  ### **The Must-Land Reply**  
  If challenged on **epistemic culpability** (Objection #2):  
  > *"The critical point: Ignorance is not exculpatory if the authority designed the system that made ignorance inevitable. When London required Bengal’s famine reports to be filtered by profit-driven procurement officers, or Mao purged critics who cited field surveys, they chose blindness. That is culpable opacity—not unavoidable uncertainty."*  
  *Why it’s critical:* If this fails, your "third category" collapses into "disaster."  

  ---

  ### **The Nightmare Question**  
  *"Can you prove that *any* of your proposed interventions would have reduced mortality at bearable cost without triggering worse consequences? Show us your counterfactual estimates for Ireland/Bengal/China using period-specific constraints."*  

  **Why it’s dangerous:**  
  - Forces you into unprovable hypotheticals.  
  - Economists demand quantifiable identification strategies.  

  **Best available answer:**  
  > *"Precise quantification is impossible—as with all historical policy analysis. But we can infer feasibility from contemporaneous alternatives: When China *did* cut procurement in 1962, deaths fell despite similar weather. When Ireland *was* given Treasury grants in 1845, workhouses functioned. The burden should be on critics: If authorities had plausible alternatives *they* discussed at the time (e.g., Bengal’s rice stocks), why assume they were infeasible?"*  
  *Then pivot:* "The deeper point is institutional: All three regimes constructed systems that hid their own failures. That pattern—not perfect foresight—is my target."  

  ---

  **Final Tip:** Anchor replies in **documented policy debates from your cases** (e.g., Churchill’s refusal to release ships, Mao’s rejection of Peng’s report). This grounds abstract tests in historical evidence your audience respects. Avoid moral terms—frame "crime" as *systematic negligence traceable to institutional design*. Good luck!
