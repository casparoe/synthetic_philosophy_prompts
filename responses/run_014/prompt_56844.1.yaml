prompt: |-
  So I'm on the third draft of a historical novel set in the year after a really big tropical eruption — the mountain itself never appears on the page, it's only ever felt downstream: a wheat harvest that doesn't come in, red sunsets that a ship's captain bothers to log, a fever that walks off a brig and into a port town, a summer where people keep their winter coats on in July. My agent read it last week and said the jacket copy basically writes itself — the volcano is the real protagonist, and she'd love it if I gave the mountain a chapter in its own voice. My sister-in-law, who's an environmental historian, read the same pages and said the opposite thing: the moment you call a climate event a character you've smuggled in a will, and then all the human decisions about who had grain stored, who was allowed to leave, and who was already half-starved before the sky changed just evaporate into scenery. She says it's determinism wearing a costume.

  Can you audit the analogy for me — "the eruption is a character in the novel," or its cousin, "the mountain is the antagonist"? I want to know what actually maps onto what (desire or motive, the character arc, the entrance and the exit, whose point of view we're in, the thing the protagonists struggle against), where each of those correspondences snaps, and what the comparison quietly imports that a volcanic winter doesn't have — agency, intention, a single will standing behind effects that were really just distributed and impersonal, and especially the comfort of a villain nobody can put on trial. Then tell me straight whether the jacket line survives the audit or whether it was only ever being carried by something else, like the fact that ash makes great imagery. And if you think the analogy is rotten, I'd rather hear what I should be reaching for instead — is there a better comparison for a non-human cause that a novel can make felt without making it a person? My own worry is that alot of climate novels solve this by giving the weather moods, which is the exact move she's objecting to.

  Format: give it to me as exactly five numbered items, one or two sentences each, no preamble and no summary paragraph at the end. Each item should hand me one correspondence and then immediately say where it breaks — so item five can be the verdict on the jacket copy or the replacement analogy, whichever you think matters more. Don't worry about being nice to me, I need to know before I send it back to my editor.
reasoning: |-
  Okay, the user is working on a historical novel set after a major volcanic eruption. Their agent suggested treating the volcano as a character, even giving it its own chapter. But their sister-in-law, an environmental historian, argues that personifying the volcano implies intentionality and undermines human agency in the crisis. The user wants me to audit the analogy of the eruption as a character or antagonist.

  I need to break this down into exactly five numbered items as requested. Each item should map a correspondence and then show where it breaks. The last item should address whether the jacket copy survives or offer an alternative.

  First, let's consider what makes a character in a story. Characters have desires, motives, arcs, and perspectives. But a volcano doesn't have these - it's a geological event. Personifying it could make the disaster feel intentional, which historically isn't accurate. This risks determinism, where human choices seem irrelevant against this "villain."

  The user mentions climate novels giving weather moods, which is exactly what the sister-in-law objects to. So I need to suggest alternatives. Maybe think of the eruption as a context or condition rather than a character. Like a stage or an impersonal force - something that sets the scene without will or motive.

  Looking at the jacket copy: "the volcano is the real protagonist." If the analogy is flawed, this might not hold. But ash imagery is powerful, so perhaps the line can be rephrased to emphasize impact without personification. The user needs clarity before sending to their editor, so honesty is key.

  Breaking it down: Item one could cover motive/desire - volcanoes don't have them. Item two: character arc - eruptions don't change. Item three: POV - can't have a mountain's perspective without invention. Item four: antagonist role - conflict requires intent, which isn't there. Item five: verdict - the jacket copy doesn't survive, and suggest "condition" as a better frame.

  I should ensure each point contrasts the literary device with reality. Emphasize that personification smuggles in agency, diverting from human decisions. The alternative should highlight impersonal forces while keeping the eruption central to the story. Avoid "moods" since that's what the critique opposes. Instead, terms like catalyst or environmental constant might work.
answer: |-
  1.  **Motive/Desire Correspondence:** Assigning the eruption/mountain "character" status maps *human motive/desire* (e.g., wanting to destroy, acting with purpose) onto its geological processes. **It snaps** because the eruption inherently lacks intent or desire; it's an impersonal earth process, not a willful actor driving events.
  2.  **Character Arc Correspondence:** Treating the mountain as a character suggests a *development arc* (e.g., building tension, climaxing, resolving). **It snaps** because the eruption is a singular, catastrophic *event* with geological aftermath; it doesn't "grow," "learn," or "resolve" like a character, its impact unfolds passively over time.
  3.  **Point of View Correspondence:** Giving the mountain its "own voice" implies a *singular, knowable perspective or consciousness*. **It snaps** because the eruption's effects are vast, distributed, and fundamentally *unknowable* from a single, internal viewpoint; it has no consciousness to voice.
  4.  **Antagonist/Struggle Correspondence:** Framing the mountain as the antagonist maps *intentional opposition* (a will actively thwarting the protagonists) onto the environmental crisis. **It snaps** because the protagonists struggle against the eruption's *impersonal consequences* (famine, cold, disease), not a targeted malice, obscuring the human choices shaping survival amidst disaster.
  5.  **Verdict & Replacement:** The jacket line ("volcano is the real protagonist") **doesn't survive** the audit; personification smuggles in harmful agency. Reach instead for **"The eruption is the inescapable condition"** – an impersonal, ambient force shaping possibilities, not a character dictating fate.
