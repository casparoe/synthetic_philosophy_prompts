answer: |-
  ### Decision Tree for Mapping Positions in Distributive Justice  
  **Introduction**  
  This instrument helps clarify your stance on distributive justice by starting with the core question of *what* should be distributed justly (the "currency"), then making explicit two often-overlooked dimensions: (1) whether justice evaluates *prospects* (ex ante) or *outcomes* (ex post), and (2) whether the goal is strict *equality*, universal *sufficiency*, or *prioritarian* weighting toward the worst off. By answering these three questions, you can locate your view within the logical space of theories. Some combinations are empty—marked as such—because they are incoherent, unattractive, or unexplored.  

  ---

  #### **Question 1: What is the fundamental "currency" justice should address?**  
  *(What must be distributed fairly?)*  
  - **A. Welfare**: Well-being, happiness, or preference satisfaction.  
  - **B. Resources**: Material goods (wealth, income) or access to them.  
  - **C. Capabilities**: Real freedoms to achieve valued functionings (e.g., health, education).  
  - **D. Opportunity**: The range of choices available to pursue welfare, resources, or capabilities.  
  - **E. Relational**: Social relationships (e.g., power, respect), not a quantifiable good.  

  **If you chose E (Relational)**: → **Relational Egalitarianism** (e.g., Anderson, Scheffler).  
  *Justice requires dismantling hierarchies so people relate as equals, regardless of material distribution.*  

  **If you chose A, B, C, or D**: Proceed to Question 2.  

  ---  

  #### **Question 2: When should justice be evaluated?**  
  *(Does fairness apply to initial prospects or final outcomes?)*  
  - **Ex ante**: Based on *expected prospects* before risks unfold (e.g., equal chances).  
  - **Ex post**: Based on *actual outcomes* after risks resolve (e.g., compensating bad luck).  

  **If you chose D (Opportunity)**: Skip to Question 3 (opportunity is inherently ex ante).  
  **If you chose A, B, or C**: Answer above, then proceed to Question 3.  

  ---  

  #### **Question 3: What distribution pattern best achieves justice?**  
  - **Equality**: Strict parity in the chosen currency (ex ante or ex post).  
  - **Sufficiency**: Everyone must reach a "good enough" threshold.  
  - **Prioritarian**: Weighted benefits to the worst off (even if unequal).  

  ---  

  ### Mapping Answers to Positions  
  *(Leaves marked "Empty" are incoherent, unattractive, or unexplored.)*  

  - **A. Welfare + Ex ante**:  
    - **Equality**: *Empty*. *Unexplored—equal expected welfare ignores outcomes of choice.*  
    - **Sufficiency**: **Ex Ante Welfare Sufficientarianism** (e.g., Frankfurt-inspired).  
    - **Prioritarian**: **Prioritarianism** (e.g., Parfit). *Applies weights to expected welfare.*  

  - **A. Welfare + Ex post**:  
    - **Equality**: **Welfarist Egalitarianism** (e.g., classical utilitarians).  
    - **Sufficiency**: **Welfare Sufficientarianism** (e.g., Frankfurt).  
    - **Prioritarian**: **Ex Post Prioritarianism** (rare; weights actual welfare).  

  - **B. Resources + Ex ante**:  
    - **Equality**: **Resource Egalitarianism** (e.g., Dworkin-Cohen). *Luck-egalitarian.*  
    - **Sufficiency**: **Ex Ante Resource Sufficientarianism** (e.g., basic income guarantees).  
    - **Prioritarian**: *Empty*. *Unattractive—priority to expected resources undermines choice.*  

  - **B. Resources + Ex post**:  
    - **Equality**: *Empty*. *Incoherent with choice—compensates for bad gambles (e.g., Dworkin rejects).*  
    - **Sufficiency**: **Ex Post Resource Sufficientarianism** (e.g., poverty-threshold approaches).  
    - **Prioritarian**: **Resource Prioritarianism** (weights actual resource deficits).  

  - **C. Capabilities + Ex ante**:  
    - **Equality**: *Empty*. *Unexplored—nobody defends equal expected capabilities.*  
    - **Sufficiency**: **Ex Ante Capability Sufficientarianism** (e.g., universal opportunity floors).  
    - **Prioritarian**: *Empty*. *Unexplored—priority to expected capability deficits.*  

  - **C. Capabilities + Ex post**:  
    - **Equality**: **Capability Approach** (e.g., Sen). *Focuses on equal freedom, not strict equality.*  
    - **Sufficiency**: **Capability Sufficientarianism** (e.g., Nussbaum). *Thresholds for core capabilities.*  
    - **Prioritarian**: **Capability Prioritarianism** (weights actual capability deprivation).  

  - **D. Opportunity (ex ante)**:  
    - **Equality**: **Luck Egalitarianism** (e.g., Arneson). *Equal opportunity for welfare/resources.*  
    - **Sufficiency**: **Opportunity Sufficientarianism** (e.g., basic opportunity guarantees).  
    - **Prioritarian**: **Opportunity Prioritarianism** (priority to worst-off opportunity sets).  

  ---

  ### Key Notes on the Tree  
  1. **Empty Cells**: Marked due to:  
     - *Incoherence*: Ex post resource equality undermines personal responsibility.  
     - *Unattractiveness*: Ex ante resource prioritarianism ignores actual outcomes.  
     - *Unexplored*: Ex ante capability equality lacks theoretical advocates.  

  2. **Indistinguishable Leaves**:  
     - **Resource Egalitarianism (B/ex ante/equality) vs. Capability Approach (C/ex post/sufficiency)** are closer than textbooks suggest. Both focus on *what people can do* (resources through insurance markets; capabilities through functionings), blurring the currency divide. The tree separates them due to ex ante/ex post and pattern differences, but their core aims overlap.  
     - **Luck Egalitarianism (D/equality) and Resource Egalitarianism (B/ex ante/equality)** share a focus on neutralizing brute luck but diverge on currency (opportunity vs. resources).  

  3. **How Branches Sort Views**:  
     - The **currency branch (Q1)** isolates *what* is valued (e.g., welfare vs. social relations).  
     - The **ex ante/ex post branch (Q2)** reveals disagreements about *temporal responsibility* (e.g., Dworkin’s ex ante resources vs. Sen’s ex post capabilities).  
     - The **pattern branch (Q3)** separates *redistributive principles* (e.g., equality’s rigidity vs. prioritarianism’s flexibility).  

  This tree isolates your disagreement with your friend: If two people agree on currency (e.g., resources) but clash on ex ante/ex post or pattern, they land in divergent leaves (e.g., Dworkin vs. ex post sufficientarianism). Implementations aren’t automatic—they require these independent choices.  

