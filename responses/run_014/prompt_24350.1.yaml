answer: |-
  Your intuitions reveal a coherent ethical structure! They can be captured by **two core principles**, working together:

  ### Principle 1: The Active Guilt Nullification Principle
  > **A person actively engaged in the *same specific wrongdoing* they are criticizing in another lacks the standing to issue that criticism.** This nullifies their *moral authority* to condemn the act *at the time of criticism*.

  *   **Covers:** Your tax-evading friend. He is *actively* under-reporting (same specific wrongdoing: tax fraud) while criticizing his colleague. His criticism is hypocritical and lacks standing.
  *   **Doesn't Cover/Allows:** The ex-smoker (not active), the reformed coach (not active), the parent (different kind of lying), the rent-complaining friend (different domain). Their past actions, *because they are not ongoing*, do not nullify their standing.

  ### Principle 2: The Reform & Expertise Enhancement Principle
  > **A person who has *reformed* from a past wrongdoing and possesses demonstrable *insight* gained from that experience may have *enhanced* (or at least, *not diminished*) standing to criticize others for that *same specific wrongdoing*, compared to someone who never committed it.** This enhanced standing stems from unique experiential credibility.

  *   **Covers:** The coach. He *reformed* (admitted, stopped), gained *insight* (temptation, costs), and criticizes the *same specific wrongdoing* (doping). His experience gives him *more* authority than a never-doper.
  *   **Doesn't Cover/Allows:** The ex-smoker. He reformed, but criticizing smoking doesn't necessarily require unique experiential insight ("it's unhealthy/addictive" suffices). He has standing (thanks to Principle 1 not nullifying it), but not *enhanced* standing compared to a never-smoker. The parent and rent-complaining friend are criticizing *different* wrongs, so this principle doesn't apply.

  ### Applying the Principles to Your Cases

  1.  **Ex-Smoker:** **Fine.**
      *   Principle 1: Not *actively* smoking → Standing *not nullified*.
      *   Principle 2: Reformed but criticizing doesn't require unique experiential insight → Standing *not enhanced* (equal to never-smoker).
  2.  **Tax-Evading Friend:** **Not Fine.**
      *   Principle 1: *Actively* evading (same wrongdoing) → Standing **nullified**.
      *   Principle 2: Not reformed → No enhancement possible.
  3.  **Reformed Coach:** **Fine (Enhanced Standing).**
      *   Principle 1: Not *actively* doping → Standing *not nullified*.
      *   Principle 2: *Reformed* + Gained *insight* + Criticizing *same wrongdoing* → Standing **enhanced**.
  4.  **Parent (Different Lies):** **Fine.**
      *   Principle 1: Criticizing a *different kind* of wrongdoing (child's lie vs. protective lie) → Standing *not nullified* (as "same wrongdoing" isn't met).
      *   Principle 2: Criticizing a *different wrongdoing* → Doesn't apply.
  5.  **Friend (Rent vs. Loan):** **Fine.**
      *   Principle 1: Criticizing *different domain* of financial obligation (timely rent vs. repaying a loan) → Standing *not nullified* (as "same wrongdoing" isn't met).
      *   Principle 2: Criticizing a *different wrongdoing* → Doesn't apply.

  ### Predicting the New Case: The Never-Tempted Critic

  *   **Scenario:** A person who has never done the thing (e.g., smoked, doped, evaded taxes) *and* has never been tempted to, criticizes someone who has.
  *   **Prediction:** **Fine (Standard Standing).**
      *   Principle 1: Not *actively* engaged → Standing **not nullified**.
      *   Principle 2: Never committed/tempted → No reform or unique experiential insight → Standing **not enhanced**. They have the *basic right* to criticize the wrongdoing based on general moral principles, but lack the *enhanced credibility* that comes from overcoming the specific temptation.

  ### Addressing Consistency & Potential Conflicts

  *   **Accommodation:** These two principles successfully accommodate *all* your specific verdicts without forcing you to drop any. They explain the nullification in the tax case, the enhancement in the coach case, the permissibility in the ex-smoker/parent/rent cases, and predict the standard standing of the never-tempted critic.
  *   **Why They Work:** They distinguish the critical factors:
      1.  **Simultaneous Guilt:** Active commission of the *identical* wrong destroys moral authority to condemn it (hypocrisy).
      2.  **Temporal Separation:** Past commission alone does *not* destroy standing.
      3.  **Specificity:** The wrongdoing criticized must be *identical* to the one actively committed for nullification to apply (hence parent/rent cases are ok).
      4.  **Reform + Insight:** Overcoming the *same specific* wrong and gaining wisdom from it creates unique, credible authority *regarding that specific wrong*.
  *   **Precision:** The key terms ("*same specific wrongdoing*", "*actively engaged*", "*reformed*", "*insight*") are sufficiently precise to apply to your cases:
      *   "Same specific wrongdoing": Tax evasion vs. tax evasion = same. Protective lie vs. self-serving lie = different. Borrowing money vs. paying rent = different domains.
      *   "Actively engaged": Currently doing it = active. Stopped = not active.
      *   "Reformed": Stopped *and* acknowledges wrongdoing (like the coach admitting it).
      *   "Insight": Ability to articulate the internal struggle, costs, or reasons *specific* to the wrongdoing beyond general knowledge.

  **Conclusion:** Your intuitions align with a principle that **active, unrepentant commission of the same specific wrongdoing nullifies the standing to criticize it**, while **reform from that specific wrongdoing combined with gained insight can enhance standing to criticize it**. Past actions, if not active and identical, generally do not diminish (and can sometimes strengthen) the right to criticize. This framework validates all your judgments and predicts the standard standing of the never-tempted critic.
