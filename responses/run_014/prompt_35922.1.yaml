prompt: |-
  I'm a software engineer with no formal training in philosophy, and there's a pattern in my own field that I've never been able to justify to myself in clean terms. I'd like you to reconstruct what view of knowledge it presupposes.

  Here is the pattern. On one hand, applied cryptography rests on a doctrine, usually attributed to Kerckhoffs, that a system should remain secure even if everything about its design is public. Treating secrecy of the algorithm itself as protection — "security through obscurity" — is regarded as a rookie mistake, almost a moral failing, and we design on the assumption that the adversary has the full specification in hand. On the other hand, the public-key cryptography that secures nearly all internet commerce — RSA, Diffie–Hellman, elliptic curve schemes — rests on assumptions like "there is no efficient algorithm for factoring large integers," and nobody has ever proven any such thing. P versus NP is open, the hardness of factoring is open, the discrete logarithm problem is open. In effect, the world's payment infrastructure runs on unproven conjectures, and the profession treats this as prudent engineering.

  So the field trusts one kind of "no one has found a way in" and distrusts another. Thousands of people have failed for decades to break RSA, and we take that as strong evidence of safety; equally many people have failed to discover some vendor's secret design, and we take that as no evidence at all. What theory of evidence, or of knowledge, does that split presuppose?

  My own first stab at it, for what it's worth: the asymmetry may have something to do with facts that already exist versus facts that must be created. A secret design exists somewhere — in a head, a repository, a filing cabinet — so its not being known is a contingent state that one act of espionage can reverse, whereas an efficient factoring algorithm, if there is one, exists nowhere until someone invents it, so decades of not finding it track the difficulty of creation rather than the integrity of storage. But I can see the objection to my own story: mathematical discoveries do happen abruptly, at the hands of single individuals, and when one happens the hardness assumption collapses overnight, just as a leak collapses a secret. Perhaps the practice rests on something else entirely, or is quietly incoherent, or the two stances are underwritten by different views that only look like the same kind of trust.

  Please do the following. Reconstruct, in plain language, the implicit epistemology of the practice: what it presupposes about mathematical knowledge as opposed to knowledge of secrets, and about what a long history of failed attempts is evidence of. Then say whether that presupposition is coherent, or whether the practice is actually relying on something it doesn't acknowledge — for instance, a bet on the rarity of mathematical invention, which is a sociological or psychological wager rather than a fact about knowledge. Next, identify where the practice is genuinely underdetermined, that is, where several quite different theories of evidence would license exactly the same behavior, so that the practice cannot be said to presuppose any one of them. Finally, tell me what would have to change in engineering if the implicit view were replaced by a demand for proof: would we be left with nothing but information-theoretically secure schemes like one-time pads and honest few-time authenticators, or does the current migration to post-quantum algorithms — which merely swaps one set of unproven hardness assumptions for another — show that the profession has already concluded the presupposition is all it has, and has decided to live with it? Keep the philosophy accessible; I can follow the mathematics, but I have never read a page of epistemology.
reasoning: |-
  Okay, let me tackle this fascinating question from a software engineer about the epistemology behind cryptographic practices. The core tension is between rejecting "security through obscurity" while relying on unproven mathematical assumptions - both involving absence of discovery, but treated very differently.

  First, I need to unpack why cryptographers treat these two "no one has found a way" scenarios so asymmetrically. The Kerckhoffs principle makes perfect sense - secrets can be stolen, so systems must withstand full disclosure. But then we have RSA based on unproven assumptions like factoring hardness. What makes failed attacks on RSA "evidence" while failed reverse-engineering isn't?

  Hmm, the user's own theory about existing secrets vs. to-be-created algorithms is insightful. A secret design exists physically and can leak, while a math solution might not exist at all. But as they note, math breakthroughs do happen suddenly too. So why the difference in trust?

  I recall that in epistemology, mathematical knowledge is often seen as discoverable but not invented - the truths are eternal. Failed proofs accumulate negative evidence about feasibility. Whereas secrets are contingent - their protection depends on human systems that always have vulnerabilities. 

  The key distinction seems to be about the nature of the search space. For math problems, the space of possible attacks is constrained by logic. Decades of experts failing to find shortcuts suggests none exist. For secret designs, the "search space" is physical security - and we know locks get picked. This makes historical failure more meaningful for math.

  But is this coherent? Well, it assumes mathematical discovery follows predictable difficulty gradients. We know from history that some proofs took centuries while others came quickly. Still, the community consensus seems to be that sustained failure across many approaches does indicate hardness.

  For underdetermination - yes, different theories could lead to same practice. A pragmatist might say "it works" while a Platonist believes in intrinsic difficulty. Both would still use RSA.

  On demanding proof - that would indeed collapse most practical crypto. Even post-quantum algorithms rely on new unproven assumptions. The field has clearly chosen to live with this epistemological gap rather than retreat to information-theoretic security.

  The migration to post-quantum crypto is particularly telling - it's an explicit bet that the epistemological framework (long failure = security evidence) remains valid even when swapping assumptions. That's a strong endorsement of their implicit theory.

  I should emphasize that cryptographers aren't being inconsistent - they're applying different standards to different kinds of knowledge. Physical secrets are fragile; mathematical intractability is robust based on collective verification. The practice reflects this nuanced view.
answer: |-
  Your observation cuts to the heart of how cryptography balances epistemology and engineering. Let's reconstruct the implicit view of knowledge, test its coherence, and explore its implications.

  ### The Implicit Epistemology
  1.  **Mathematical Hardness vs. Contingent Secrecy:**
      *   **Secrets (Obscurity):** Knowledge of a secret design is treated as *contingent physical information*. Its security depends on *control over access* (locked cabinets, NDAs, access controls). Failure to discover it isn't evidence of inherent complexity; it's evidence that specific security procedures *haven't failed yet*. The space of possible ways to discover it (espionage, leaks, reverse engineering) is vast, unpredictable, and relies on human/organizational fallibility. Each passing day adds minimal evidence because the critical flaw might exist but simply hasn't been exploited *or even found* by an adversary.
      *   **Mathematical Hardness (Assumptions):** Knowledge of an efficient algorithm (like factoring) is treated as a *mathematical truth* existing within a *constrained logical landscape*. Failure to discover it after decades of intense, global, adversarial scrutiny by brilliant minds is seen as strong evidence that:
          *   **The problem is intrinsically hard:** The solution space is vast and barren; efficient paths are either non-existent or extraordinarily rare and difficult to find.
          *   **The search is exhaustive:** The mathematical community has explored the most promising avenues (known algorithmic techniques, reductions to other problems) and found no efficient solution. The *collective failure* itself becomes data.
          *   **Discovery is likely gradual:** While breakthroughs *can* be sudden, significant progress usually builds incrementally. Decades without *any* fundamental progress (beyond incremental optimizations) suggest a fundamental barrier. The absence of even partial breakthroughs or strong evidence *for* an efficient algorithm is telling.

  2.  **What Long Failure Signifies:**
      *   **For Secrets:** Failure to discover signifies *nothing reliable* about the *inherent security* or *quality* of the secret. It only signifies that the *current protection mechanisms* haven't been breached. It's evidence about the effectiveness of locks and lawyers, not about the lock-picking resistance of the algorithm itself.
      *   **For Math Problems:** Failure to discover signifies evidence of *inherent intractability* within the current mathematical paradigm. It suggests the problem possesses a deep structural hardness that resists known and foreseeable techniques. The duration and intensity of the failed search become proxies for the difficulty of creation/invention.

  ### Coherence and the Unacknowledged Bet
  *   **Is it Coherent?** Yes, but with a crucial caveat. The core distinction – contingent physical access control vs. inherent mathematical complexity – is valid and coherent. Treating evidence differently based on the *nature of the thing being unknown* makes sense.
  *   **The Unacknowledged Bet:** The practice relies heavily on a **sociological/psychological wager about mathematical discovery**, not just pure logic:
      *   **Bet 1: Collective Exhaustion:** The field bets that decades of intense, global, expert scrutiny represent a *reasonably exhaustive exploration* of the plausible mathematical approaches within the current paradigm. It assumes no brilliant individual is likely to find a devastatingly simple shortcut that everyone else missed for decades (though history *does* show this happens occasionally).
      *   **Bet 2: Paradigm Shifts are Rare & Visible:** It bets that fundamental mathematical breakthroughs (like quantum computing, or entirely new complexity classes) that could break assumptions will be rare, develop gradually with visible warning signs (new algorithms for subproblems, theoretical advances), and won't materialize overnight in a single, secret, devastating paper. The transition to post-quantum cryptography exemplifies this bet – the paradigm shift (quantum computing) *was* identified early, and migration started long before a practical quantum computer exists.
      *   **Bet 3: Difficulty Gradient:** It bets that truly efficient algorithms wouldn't hide for decades without *any* significant intermediate progress or theoretical hints suggesting their possibility. The sheer absence of progress is seen as evidence of a steep difficulty cliff.
      *   **This is a Wager:** This bet is fundamentally sociological – it's based on the observed *behavior* and *productivity* of the mathematical community over time. It's not a guaranteed law of nature. A single, unforeseen, non-quantum mathematical breakthrough *could* still shatter an assumption abruptly.

  ### Where the Practice is Underdetermined
  The *behavior* (rejecting obscurity, trusting hardness assumptions) could be licensed by different philosophical justifications:
  1.  **Pragmatism:** "It works. Systems built this way haven't been broken (except via implementation flaws or side-channels, not core math), while systems relying solely on obscurity fail constantly. Historical evidence justifies the approach."
  2.  **Fallibilism & Evidence:** "All knowledge is tentative. Decades of failed attacks on a public algorithm constitute overwhelming empirical evidence for its current security, comparable to the evidence supporting well-tested physical theories. Secrecy offers no comparable testable evidence."
  3.  **Computational Complexity Platonism:** "There *is* an objective, intrinsic difficulty to mathematical problems, independent of human knowledge. Sustained failure by the best minds is our best indicator of this Platonic hardness. Secrets have no such Platonic existence; they are merely hidden facts."
  4.  **Sociological Trust:** "We trust the process of open academic scrutiny. If thousands of experts trying to break it (and gain fame) haven't succeeded, it's likely secure. Secret designs lack this transparent verification mechanism."
  All these different theories lead to the same practical engineering decisions.

  ### What Would Change with a Demand for Proof?
  A strict demand for *proven* security (beyond information-theoretic perfect secrecy) would be catastrophic for practical computing:
  1.  **Collapse of Practical Cryptography:** Virtually all efficient, widely-used cryptography (public-key encryption, digital signatures, efficient symmetric ciphers like AES, cryptographic hashes) relies on unproven assumptions. Only information-theoretically secure primitives like One-Time Pads (OTPs) and Wegman-Carter authenticators would remain "provably secure".
  2.  **Impossibility:** For core problems like public-key encryption (PKE), we know that **secure PKE cannot exist if P=NP**. Since P vs. NP is unresolved, demanding a proof of security for *any* PKE scheme is currently impossible. We *must* rely on hardness assumptions.
  3.  **The Meaning of Post-Quantum Migration:** The shift to post-quantum cryptography **powerfully confirms that the profession accepts the epistemology you described.** It explicitly acknowledges:
      *   Current assumptions *might* fall (to quantum computers).
      *   The response is **not** to abandon assumptions altogether, but to **swap one set of well-scrutinized, 'apparently hard' mathematical problems** (factoring, discrete log) **for another set** (lattice problems, hash-based signatures, etc.) believed resistant to *both* classical *and* quantum attacks.
      *   The criteria for choosing new assumptions remain the same: public designs, years of intense cryptanalysis failure, perceived intrinsic mathematical difficulty, and the hope that the sociological bet (collective exhaustion, visible paradigm shifts) holds true for these new problems.

  **In Plain Language Summary:**

  Cryptography treats secrets and math problems differently because:
  *   **A secret leak is like finding a hidden key.** It depends on physical security failing, which happens often. Not finding the key yet doesn't mean it's well-hidden; it just means the thief hasn't gotten lucky *yet*.
  *   **Decades of failing to crack a math-based system is like thousands of top locksmiths failing to pick a lock despite having its blueprint.** This suggests the lock has a *fundamental, internal complexity* making it incredibly hard to pick, not just that no one has stumbled on the trick. The failure itself is strong evidence the lock is good.

  **It's a coherent view, but it relies on a gamble:** The gamble is that the combined efforts of all mathematicians and cryptographers are a good way to measure how truly hard a math problem is, and that earth-shattering breakthroughs giving easy solutions won't happen silently and suddenly. The profession knows this gamble is necessary. Demanding absolute proof would leave us with only wildly impractical crypto like one-time pads. That's why moving to "post-quantum crypto" – swapping one set of hard math problems for another – shows the field fully embraces this gamble as the best we can do. It's not inconsistency; it's a pragmatic epistemology born of necessity.
