  Where does moral luck do work that safety jargon can't? Safety language turns moral luck into system failures, ignoring the agent's blameworthiness. Philosophers focus on individual responsibility despite luck, whereas engineers focus on systemic fixes. The engineer's framing might mislead philosophers by reducing responsibility to design flaws, missing the moral agency aspect.

