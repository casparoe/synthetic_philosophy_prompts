answer: |-
  Here's your Q&A prep sheet, designed for quick reference. Objections are ordered by likely aggressiveness and grouped by opponent type. Replies are concise for delivery within 2 minutes.

  ---

  **Q&A PREP SHEET: DEFENDING THE RESIDUE THEORY OF GENUINE DILEMMAS**

  **Key Early Concession (OPENING REMARK):**  
  *"Before we start, I fully agree: Most so-called 'hard choices' are tractable with better reasoning or clearer values. I also grant that moral systems *should* strive for coherence. My claim is narrower: a specific subset of conflicts—where *all* viable options inflict significant, non-arbitrary harm on distinct, valid claims—generate lasting duties *beyond* the act itself, regardless of which choice was 'best.'"*  
  *(This buys goodwill by narrowing scope & affirming normative coherence as ideal.)*

  ---

  **ANTICIPATED OBJECTIONS & REPLIES**  
  *(Ordered by likely sequence/intensity)*

  1.  **THE SENIOR KANTIAN:**  
      *"You're smuggling in a contradiction. 'Ought implies can' means only one course is truly obligatory. If you did the right act, any 'residue' is just subjective guilt or a *prudential* repair for damaged relationships—not a *moral debt*. Your 'dilemma' is just imperfect duty conflict resolved by judgment."*  
      **Reply:** "Respectfully, this isn't about my guilt. It's about the *victim's standing to demand* apology/compensation. If you harm someone unavoidably while fulfilling duty X, their claim against being harmed isn't erased by X's validity. 'Ought implies can' governs *action*, not the *extinguishing of valid claims* by acting. The residue is owed *to them*, not to my conscience."  
      **Force:** High (core challenge). **Soft Spot:** Needs clear victim-standing focus. Avoid conflating "duty to act" with "duty arising from acting."

  2.  **THE CONSEQUENTIALIST / EXPECTED-VALUE ADVOCATE:**  
      *"Incommensurability is epistemic weakness. With perfect information & cardinal scaling, there's always a best option. 'Residue' is just emotional fallout or risk-aversion. Calling it a 'duty' confuses psychology with normativity."*  
      **Reply:** "This persists even *post*-calculation. Suppose we *know* saving five kills one unavoidably. The one's family can legitimately demand apology/compensation *from you*, even knowing you chose best. If residue were merely sentimental, refusing it wouldn't be a *further wrong to them*. But it is. The harm itself creates a directed duty, proportional to the *actual harm caused*, not prior uncertainty."  
      **Force:** High. **Soft Spot:** Must distinguish *ex post* owed duties from *ex ante* calculation. Emphasize proportional to *actual harm*.

  3.  **METAETHICIST GRAD STUDENT (Terminology):**  
      *"Aren't you just redefining 'dilemma'? Deniers agree hard choices leave emotional scars or repair work. You call this 'residue' a *duty*, they call it *regrettable fallout*. Is this substantive disagreement or semantics?"*  
      **Reply:** "Substantive. Deniers see apology/compensation in these cases as supererogatory or therapeutic. I argue they are *owed and demandable*. If you skip the apology to the unavoidably harmed party, you wrong *them* specifically. That’s not semantics; it’s a claim about the persistence of directed obligations despite blameless action."  
      **Force:** Critical (Must Land). **Soft Spot:** Must insist on **demandability** and **wronging** as the litmus test.

  4.  **LEGAL THEORIST (Doctrinal Redundancy):**  
      *"Necessity/duress doctrines already absolve agents of blame/punishment for justified harms. Why invent 'residue duties'? Reparation or apology here is just good policy or compassion, not a deep moral truth."*  
      **Reply:** "Doctrine focuses on *culpability of the agent*. Residue focuses on the *claim of the victim*. Even if the agent is excused/justified *from punishment*, the victim retains a moral standing to seek redress *from the agent* ("You harmed me, acknowledge it"). The law may not *enforce* this duty, but its existence explains why victims feel owed something beyond 'tough luck, it was necessary.'"  
      **Force:** Medium-High. **Soft Spot:** Must show residue does work *beyond* exculpation – explains victim's moral claim *against the actor*.

  5.  **CULTURAL RELATIVIST / ANTI-TRAGIC:**  
      *"Isn't 'agent-regret' and 'residue' just a Western, individualist obsession? Some cultures prioritize communal harmony where public apology for necessary acts might be disruptive, not owed. Does your theory impose culturally specific demands?"*  
      **Reply:** "The core is *standing to complain*. If a specific culture dictates *how* acknowledgment happens (or that it's communal, not individual), that's compatible. But if someone is unavoidably harmed by your necessary choice, and they *have no culturally recognized avenue* to seek even acknowledgment of their loss from you, that seems like a moral failing – the suppression of a valid claim. The *form* is cultural; the *underlying claim* might be fundamental."  
      **Force:** Medium. **Soft Spot:** Risk of overreach. Concede cultural variation in *expression* but hold the line on the victim's moral standing generating *some* owed acknowledgment.

  6.  **KANTIAN (Maxim Conflict Disguise):**  
      *"Your 'residue' sounds like the imperfect duty to aid/promote welfare conflicting with a perfect duty, resolved by judgment. The 'duty' afterward is just the continuing imperfect duty applied to this new state of affairs."*  
      **Reply:** "The residue isn't a general duty to promote welfare; it's a *specific, directed duty owed to the particular person harmed* by your choice. It arises directly *from* having unavoidably set back *their* legitimate interests while acting permissibly. It's relational and reparative, not a continuation of a general maxim."  
      **Force:** Medium. **Soft Spot:** Needs sharp distinction between general imperfect duties and specific, harm-generated directed duties.

  ---

  **THE ABSOLUTE MUST-LAND REPLY:**  
  The reply to the **Metaethicist (Objection 3)** is paramount. If the room accepts that the residue is merely semantic or psychological, the thesis collapses. **Hammer home:** "The key is *demandability*. If the harmed party can legitimately complain *to you* that you failed *them* by not apologizing/compensating *even after* you did the best thing, then this is a distinct, persisting moral demand – a *duty owed specifically to them*. That's not just regret; it's an ongoing normative relationship."

  ---

  **THE NIGHTMARE QUESTION (Pray Nobody Asks):**  
  *"If the 'residue' (apology, compensation) is a *duty* genuinely owed, doesn't that imply you *should* have done something different to avoid *owing* it? But you said the original choice was best. How can you have a duty to compensate for an act that entailed no failure of duty? Isn't this incoherent?"*  

  *   **Why it's brutal:** Directly challenges the coherence of blameless action generating new duties.
  *   **Potential Reply (Use Sparingly):** "Duties can arise from *states of affairs* we cause, not just from *wrongdoing*. Think of duties of beneficence triggered by accidentally causing harm, even non-negligently. The residue is similar: causing significant harm (even permissibly) triggers reparative duties *to the harmed party*. The original 'ought' governed the *act choice*; this new 'ought' governs the *relational aftermath* of the chosen act's unavoidable consequence."  
  *   **Softness:** This is philosophically contentious. Emphasize the *relational, directed nature* of the residue duty vs. the act-choice duty. Concede it's a distinctive feature of these cases.

  ---

  **SUMMARY STRATEGY:**  
  1.  **Open with Concession:** Narrow scope, affirm coherence.  
  2.  **Anchor on Victim Standing:** Constantly pivot to "The harmed party can demand X."  
  3.  **Distinguish Forcefully:** Residue vs. sentiment, vs. uncertainty, vs. general duties, vs. legal excuse.  
  4.  **Go for the Jugular on Demandability (Metaethics Objection).**  
  5.  **Acknowledge Soft Spots:** Especially with Legal & Nightmare Qs – show you see the tension but argue the relational duty persists.  
  6.  **Don't Defend "Dilemmas" Defend "Residue":** Frame the debate on *your* core innovation.

  Good luck! Your core argument is sharp – focus on defending the **reality and demandability of the residue** as the irreducible normative fact.
