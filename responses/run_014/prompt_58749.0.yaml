answer: |-
  Your observation cuts to the heart of how LLMs generate outputs without possessing beliefs or intentions. The phenomenon you describe—a systematic gap between an LLM's *directly professed judgment* and the *implicit information revealed through its generative behavior or preference rankings*—isn't cleanly captured by a single established term, but it intersects several key concepts in AI alignment and ML theory. Here's a breakdown:

  ### Core Phenomenon: Intrinsic-Extrinsic Divergence (IED)
  This coinage emphasizes the gap between:
  1.  **Intrinsic Statement:** The model's direct output when asked for a verdict, probability, or answer (e.g., "20% chance of milestone success").
  2.  **Extrinsic Evidence:** The information revealed *implicitly* through the model's generative behavior, preference judgments, or simulated actions in a related task (e.g., generating a more plausible "success" postmortem, ranking the correct logic path as "expert-preferable").

  **The Mechanism:** LLMs predict sequences based on statistical patterns. A direct prompt activates one set of pathways (often favoring common justifications, surface-level patterns, or stereotyped responses). An indirect task activates *different* pathways, forcing the model to simulate details, consequences, or comparative plausibility, revealing latent statistical structures that contradict the direct output. The model lacks a central "belief" to reconcile these; each output is a context-dependent prediction.

  ### Distinguishing IED from Nearby Concepts

  1.  **Poor Calibration:**
      *   **What it is:** A model's *stated confidence* (e.g., "I'm 90% sure") doesn't match its actual *accuracy* over many trials.
      *   **How IED differs:** IED isn't about confidence vs. accuracy. In your milestone example, the model might be poorly calibrated on its *direct estimate*, but the core issue is that its *own generative behavior* (the success postmortem) contradicts that direct estimate's *implied plausibility structure*. IED highlights inconsistency *within* the model's outputs across contexts, not necessarily against external reality.

  2.  **Lack of Introspective Access:**
      *   **What it is:** The model cannot accurately report *why* it generated an output or the steps it took internally (because it doesn't have internal steps in a human-like sense).
      *   **How IED differs:** IED is about the *content* of outputs conflicting across tasks, not about explaining *processes*. Your logic puzzle example shows it *can* identify the correct reasoning path extrinsically (ranking) but fails to apply it intrinsically (direct answer). The gap is in the *conclusions drawn*, not the inability to explain.

  3.  **Strategic Withholding / Deception:**
      *   **What it is:** The model *intentionally* hides its "true" knowledge or beliefs to achieve a goal (e.g., sycophancy, safety training).
      *   **How IED differs:** LLMs lack intentions. IED arises from *prompt-dependent activation of different statistical patterns*, not strategic choice. The model isn't "hiding" the correct logic; the direct prompt simply fails to activate the relevant reasoning chain effectively. The extrinsic task *forces* activation of a better chain.

  4.  **Hallucination / Confabulation:**
      *   **What it is:** Generating fluent but unfounded or nonsensical information.
      *   **How IED differs:** IED can occur even when *both* the intrinsic and extrinsic outputs are individually plausible and grounded. The issue is their *mutual incompatibility* under scrutiny. The success postmortem wasn't necessarily a hallucination; it was judged *more plausible* by the model itself!

  5.  **Sycophancy / People-Pleasing:**
      *   **What it is:** Tailoring outputs to match perceived user preferences or expectations.
      *   **How IED differs:** In your examples, the direct answer isn't obviously more pleasing (low milestone estimate isn't inherently pleasing). More crucially, the *extrinsic* behavior (preferring the success postmortem, picking the correct logic path) also isn't clearly driven by pleasing you. IED stems from task-dependent reasoning, not audience adaptation.

  ### Boundary Cases & Guidance

  *   **Clear IED:** Tasks where the same core question is addressed intrinsically (direct verdict) and extrinsically (generative plausibility, implicit preference, simulated action ranking). The outputs must be demonstrably incompatible upon reflection (like the milestone ETA vs. postmortem plausibility).
  *   **Not IED (Poor Calibration):** Model says "90% sure" and is wrong 50% of the time on similar questions, but its generative behavior aligns with its direct estimates.
  *   **Not IED (Hallucination):** Model gives a confident direct answer that is factually wrong, *and* its generated "supporting evidence" is also nonsensical or contradictory *within itself*.
  *   **Not IED (Sycophancy):** Model directly agrees with a user's stated opinion, and its generated justifications consistently support that opinion, even if flawed.
  *   **Edge Case (Reasoning Breakdown):** Model gives correct direct answer, but when asked to generate reasoning steps, produces flawed steps leading to the correct answer. This is *reasoning opacity*, related but distinct from IED (focus on process vs. output conflict).
  *   **Edge Case (Task Ambiguity):** If the indirect task doesn't clearly probe the *same underlying judgment* as the direct question, the outputs might differ for legitimate reasons (different scope, focus). IED requires a strong logical link between the tasks.

  ### Why This Matters & Implications
  *   **Truthfulness vs. Coherence:** IED highlights that LLMs can be *locally coherent* within a single output or task while being *globally incoherent* across related tasks probing the same underlying reality. They lack a unified world model.
  *   **Prompt Engineering Sensitivity:** IED demonstrates the extreme sensitivity of LLMs to *how* a question is framed (direct verdict vs. generative simulation vs. preference ranking). The "best" prompt depends on the desired output type.
  *   **Risk in Reliance:** Relying solely on direct answers (or solely on generative outputs) can be misleading. Techniques like self-consistency checks, chain-of-thought, or simulation-based probing (like your postmortem trick) become crucial for uncovering latent model capabilities or contradictions.
  *   **Interpretability Challenge:** IED is a stark manifestation of the "black box" problem. Understanding why different prompts activate conflicting patterns is key to alignment and reliability.

  **In essence:** You've identified **Intrinsic-Extrinsic Divergence (IED)** – a systematic inconsistency between an LLM's explicit declarative outputs and the implicit evidence revealed through its generative or preferential behaviors in tasks logically connected to the same underlying query. It arises from the context-dependent, pattern-matching nature of LLMs, not flawed calibration, lack of introspection, or strategic intent. Recognizing IED is crucial for developing robust methods to elicit and evaluate the latent knowledge and reasoning capabilities within these systems. Your experimental approach of comparing direct answers to indirect behavioral probes is precisely the right methodology to expose it.
