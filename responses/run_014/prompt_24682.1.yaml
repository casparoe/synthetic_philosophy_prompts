  We are going to construct a scenario involving two agents, Alice (logically omniscient) and Bob (not logically omniscient). They are both presented with a logical puzzle that has a time constraint. The puzzle is such that the solution is a logical consequence of the given evidence, but it is computationally expensive to derive. The key is that the non-omniscient agent, Bob, does not have the computational resources to derive the solution in time, but he is aware of a heuristic that is often correct and quick. The omniscient agent, Alice, being closed under logical consequence, must consider the solution as already known and thus cannot use the heuristic. The twist is that in this particular instance, the heuristic leads to a better outcome because the time constraint prevents the full logical derivation from being completed by anyone (even though Alice "knows" the answer, she must spend time to write it down or communicate it, and that time exceeds the constraint). However, note that the problem of logical omniscience typically does not require that the agent can instantly output the consequences, so we must be careful.

  Alternative approach: Instead of a time constraint, let's use a scenario where the logical consequence is so complex that computing it is practically impossible, but the non-omniscient agent can use a probabilistic heuristic that sometimes fails but in this case leads to the correct action faster and with less cost. However, the problem requires that the non-omniscient agent is strictly better off. We must avoid the non-omniscient agent being lazy or uninformed — so Bob must be using a rational alternative method.

  Let me propose the following scenario:

  **Scenario: The Predictor's Puzzle**

  A predictor has set up a game. The game consists of two stages:

  1. The predictor flips a fair coin. If it lands heads, he writes down the solution to a very hard logical puzzle (say, a specific instance of the halting problem for a particular Turing machine that is known to be hard) on a piece of paper. If tails, he writes down a false solution. The predictor then shows the agent the written solution without revealing the coin flip.

  2. The agent must then choose one of two boxes: Box A always contains $1000. Box B contains $1000000 only if the written solution is correct; otherwise, it contains nothing.

  The catch: the agent has only 10 seconds to make a choice. The hard logical puzzle is such that even the best computers would take years to solve it. However, the agent is allowed to use any method to decide.

  Now, the agents Alice (logically omniscient) and Bob (not) are both given the same evidence: they see the written solution and know the setup. They also know that the coin is fair.

  What happens:

  - Alice, being logically omniscient, immediately knows whether the written solution is correct or not because she knows all logical consequences. So if the solution is correct, she knows Box B is safe and chooses B; if incorrect, she chooses A. But note: the written solution is either correct or incorrect, and she knows which. However, there's a problem: the predictor wrote the solution only if the coin was heads? Actually, the coin flip determines whether he writes the correct solution or a false one. So if the coin was heads, the solution is correct; if tails, it's false. But Alice doesn't know the coin flip? She knows the written solution and she knows the puzzle. Since she is logically omniscient, she can immediately see if the written solution is correct for the puzzle. So she knows the coin flip outcome because the written solution's correctness determines the coin flip: if the solution is correct then the coin was heads, otherwise tails. Therefore, she knows the state of the coin. So she can choose optimally: if the solution is correct, Box B will pay $1,000,000 and she chooses B; if incorrect, she chooses A and gets $1000.

  - Bob, not being logically omniscient, cannot determine the correctness of the solution in 10 seconds. But he knows that the coin is fair, so there is a 50% chance that the solution is correct. He also knows that if he chooses Box A he gets $1000 for sure. If he chooses Box B, he gets $1,000,000 with 50% probability. The expected value of Box B is $500,000, which is greater than $1000. So Bob chooses Box B.

  Now, what if the written solution is actually false? Then:

  - Alice, knowing it's false, chooses A and gets $1000.

  - Bob chooses B and gets $0.

  But if the written solution is true:

  - Alice chooses B and gets $1,000,000.

  - Bob chooses B and gets $1,000,000.

  So in the case of a false solution, Bob does worse. But we want Bob to be strictly better off in some cases. This scenario doesn't achieve that because when the solution is false, Bob does worse. Also, on average, Bob's expected winnings are $500,000 while Alice's are $500,500 (because she gets $1,000,000 half the time and $1000 half the time: (1000000+1000)/2 = 500500). So Bob actually has a slightly lower expected value? Wait, let me recalculate:

  - Bob: always chooses B -> 0.5 * 1000000 + 0.5 * 0 = $500,000.

  - Alice: if solution correct (50%) -> $1,000,000; if incorrect (50%) -> $1000 -> expected $500,500.

  So Alice does better on average. Not what we want.

  We need a scenario where the non-omniscient agent's lack of closure leads to a better outcome in a particular instance. And we want that in that instance, the non-omniscient agent is better off, and the omniscient agent is worse off.

  Revised scenario:

  **Scenario: The Predictor's Challenge**

  A predictor sets up a game with two boxes. The agent must choose one box. The contents of the boxes depend on a very hard mathematical problem P (which is fixed and known in advance) and on the agent's choice. The rules:

  - Box A contains $1000 always.

  - Box B contains $1,000,000 only if the agent chooses it AND the agent does *not* know the answer to P at the time of choice. Otherwise, Box B is empty.

  The agent is given 10 seconds to choose. The problem P is such that it is a logical consequence of the agent's evidence (which includes the entire description of P and the rules of the game) what the answer to P is. However, the problem P is extremely hard and cannot be solved by any human or computer in 10 seconds.

  Now, we have two agents:

  - Alice is logically omniscient: she is closed under logical consequence and knows that she knows the answer to P (because the answer is a logical consequence of her evidence). Therefore, she knows that if she chooses Box B, it will be empty because the condition fails (she knows the answer). So she chooses Box A and gets $1000.

  - Bob is not logically omniscient. He does not know the answer to P (because he hasn't computed it and cannot in 10 seconds). Moreover, he does not know that the answer is a logical consequence of his evidence. So he believes that he does not know the answer to P. Therefore, he chooses Box B and gets $1,000,000.

  In this case, Bob gets $1,000,000 while Alice gets $1000. So Bob is strictly better off.

  But note: the condition for Box B is that the agent does *not* know the answer to P. For Bob, it is true that he does not know the answer to P. For Alice, she does know the answer to P. So the rules are correctly applied.

  Is the answer to P really a logical consequence of the evidence? The evidence includes the problem P and the rules. But the problem P itself might be independent of the axioms? We must assume that P has a definite answer that is logically determined by the evidence (for example, P might be a tautology or a contradiction, or a problem that is in principle solvable by a finite proof from the axioms). However, if P is independent of the axioms, then the answer is not a logical consequence. We must assume that P is a problem that has a definite truth value and that the evidence (which includes the axioms of mathematics) entails the answer. But then Alice, being logically omniscient, would know that the answer is entailed and hence she knows the answer? Not necessarily: logical omniscience means that if the evidence entails a proposition, then the agent believes it. But in the case of P, if it is entailed, then Alice believes the answer. However, note that the condition in the game is "the agent knows the answer", which we interpret as the agent having the belief in the correct answer. But in the case of Bob, he doesn't have that belief.

  The key point is that the condition for Box B is defined in terms of the agent's epistemic state: whether the agent *knows* the answer. For Alice, she does know (because she is omniscient). For Bob, he does not. Therefore, Bob gets the money and Alice does not.

  This scenario avoids the issues of time for computation because the condition is defined at the moment of choice and depends on the agent's internal state of knowledge.

  Now, let's walk through:

  **Agents' Reasoning:**

  - Alice: 
    - She has evidence E, which includes the problem P and the rules of the game.
    - The answer to P is a logical consequence of E. Therefore, by logical omniscience, she knows the answer to P.
    - The rules say: Box B pays only if she chooses it and she does not know the answer to P at the time of choice.
    - Since she knows the answer, Box B will be empty if she chooses it.
    - Therefore, she chooses Box A and gets $1000.

  - Bob:
    - He has the same evidence E.
    - The answer to P is a logical consequence of E, but Bob is not logically omniscient. He has not derived the answer and does not believe it. Therefore, he does not know the answer to P.
    - He believes (correctly) that he does not know the answer to P.
    - Therefore, he chooses Box B and gets $1,000,000.

  **Which feature is doing the work?**

  The key feature is that the payoff condition depends on the agent's epistemic state (whether the agent knows the answer to P). The logically omniscient agent is forced into a state of knowledge that makes the condition for the high payoff fail, while the non-omniscient agent, lacking that knowledge, satisfies the condition.

  **What if we remove that feature?**

  If the payoff condition does not depend on the agent's epistemic state (for example, if it depended only on the objective truth of P), then both agents would have the same outcome. For instance, if Box B paid if and only if P is true, then:

  - Alice would know the truth value of P and choose accordingly (if P true, choose B; else A) and get the maximum available.
  - Bob, not knowing P, would have to base his choice on his beliefs. If he assigns 50% to P being true, then the expected value of B is $500,000 (if he believes P true with 50%) which is more than $1000, so he would choose B. But then if P is false, he gets nothing and Alice gets $1000 (by choosing A). If P is true, both get $1,000,000. So on average, Alice does better because she avoids the loss when P is false.

  **How a defender of logical omniscience would attack the case:**

  1. **The definition of "knows" in the game rules is ambiguous.** The defender might argue that the condition "the agent does not know the answer to P" should be interpreted as the agent not having a justified true belief about P. For Alice, she does have a justified true belief (by logical omniscience). For Bob, he does not. But the defender might question whether Alice's belief is justified. The justification for Alice is that the evidence entails P. But if the entailment is not computationally feasible, then perhaps the justification is not accessible, and so Alice does not have justification in an accessible form. This challenges the idea that logical omniscience grants knowledge in the usual sense.

  2. **The scenario might be cheating by stipulating that the answer is a logical consequence of the evidence.** The defender might argue that if the problem P is so hard, then it is not a logical consequence *for the agent* until the agent has actually derived it. They might reject the idea that logical omniscience requires knowing all consequences that are in principle derivable, especially if the derivation is infeasible. They might argue that logical omniscience is an idealization that only applies to feasible deductions.

  3. **The condition in the game is self-referential and leads to paradox.** Specifically, the condition for Box B depends on the agent's knowledge, which in turn depends on the agent's reasoning about the game. For Alice, if she is omniscient, she knows the answer to P independently, but the condition in the game is about her knowledge at the time of choice. The defender might argue that the very setup of the game is inconsistent or that it requires the agent to have a kind of knowledge that is impossible even for an ideal agent. For example, if the problem P is about the agent's own knowledge state, that might lead to a Gödelian problem.

  4. **The scenario is not fair because it uses a condition that is defined in terms of the agent's internal state, which is not an objective feature of the world.** The defender might argue that rational decision theory should be about objective states, and that the game designer cannot possibly know the agent's internal state. Therefore, the scenario is contrived and does not reflect realistic decision problems.

  Despite these attacks, the scenario does seem to highlight a tension between logical omniscience and decision-making in contexts where the payoff depends on the agent's ignorance. This is a genuine challenge and has been discussed in the literature (e.g., in the context of "Newcomb-like" problems or the "paradox of predictability").
