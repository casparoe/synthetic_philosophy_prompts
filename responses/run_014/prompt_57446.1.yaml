prompt: |-
  So next month I'm giving a departmental colloquium — 45 minutes plus a long Q&A — at a place that's very strong in metaphysics and only okay in ethics, and the organiser has warned me that maybe a third of the room won't work in value theory at all. My paper defends an account of the procreation asymmetry that I've been calling the custodial view, and I need a prep sheet for the question period rather than another defense of the paper. Sketch of the argument so you know what the objections should be aimed at:

  1. Reasons of beneficence aren't freestanding. They only arise inside an actual relation of custody over a subject — a relation in which that subject's welfare is *yours to look after*. Call this the custody condition.
  2. A merely possible person stands in no such relation to anyone, so there's no welfare that is anyone's to promote. Hence no reason to bring about a happy life. Not because happy lives aren't good — I'll grant in the talk that they're good impersonally — but because a good that isn't anybody's to look after doesn't generate a reason for anybody in particular to produce it.
  3. Procreating is the act of *entering* a custody relation, and you can't permissibly enter a relation you already know you won't be able to discharge. A life of severe, unrelievable suffering is exactly that, so there's a decisive reason against creating it.
  4. The asymmetry then falls out with no person-affecting restriction on value, and without having to claim that misery is bad-for-someone while happiness is somehow not good-for-anyone.

  The thing that keeps me up is that the machinery in (1) and (3) is mine and there's no existing defence of it I can lean on, so unlike the standard asymmetry views I can't gesture at somebody else's replies when I get stuck.

  Give me the eight or nine objections I'll actually get from *this* room, in roughly the order they'll come, and phrase each one the way that subgroup would phrase it — the metaphysicians are not going to put it the way the population ethicists would. I specifically expect a necessitist to go after step 2: if possible people exist as non-concrete objects, isn't there already a subject for the custody relation to latch onto, and doesn't my view smuggle in contingentism as an undefended premise? Tell me how bad that actually is as opposed to how bad it sounds at the podium. There's also a health economist in the department who models climate damages and will want to know whether I've just given people a licence to discount the wellbeing of anyone who doesn't exist yet, plus someone in reproductive policy who'll ask about existing children — adoption, fostering — and whether my view makes procreation merely permissible or actively second-best, which is a political fight I do not want to have in a colloquium. And somebody will try to collapse me into Benatar while somebody else tries to collapse me into the older person-affecting asymmetry; say which of those two collapses is the real threat and give me the cleanest wedge.

  For each objection: how damaging it is, on a scale from "I have nothing" to "two sentences and we move on"; the two-or-three-sentence reply I should give in the room; and a blunt note on where that reply is soft. Flag which ones I should concede up front in the talk to buy goodwill, and tell me the single reply that has to land for the paper to survive the afternoon. Finish with the question I'm praying nobody asks. Please don't send me a reading list or citations — I know the literature, its my sense of which of these actually bites that I dont trust.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're preparing for a departmental colloquium where the audience is strong in metaphysics but only okay in ethics, and a third might not work in value theory at all. Their paper defends the "custodial view" of the procreation asymmetry. They need a prep sheet for Q&A, not another defense of the paper. 

  First, I need to break down their argument to anticipate objections. The key points are: beneficence requires a custody relation (1), possible persons don't have that relation so no reason to create happy lives (2), procreating enters a custody relation which can't be entered if you can't fulfill it (3), leading to the asymmetry without person-affecting restrictions (4).

  The user is worried because their machinery in (1) and (3) is original, so they can't rely on existing defenses. They expect objections from metaphysicians, especially a necessitist challenging step 2. There's also a health economist concerned about discounting future wellbeing, a reproductive policy person asking about adoption, and attempts to conflate their view with Benatar or person-affecting views.

  I should prioritize objections likely to come up in that room. Metaphysicians will focus on possible objects and relations. The necessitist objection about non-concrete objects is critical. If possible people exist abstractly, does that create a custody relation? That could undermine step 2. The user needs a solid reply without getting bogged down in metaphysics.

  The health economist's worry about discounting future generations is another big one. If custody only applies to existing beings, does that mean no obligations to future people? That could have implications for climate policy. The reply should clarify that future people become custodial subjects once they exist, but planning for them is based on current obligations.

  For adoption vs. procreation, the policy person might argue that adoption should be prioritized. The user wants to avoid political debates. The key is to state that the custodial view doesn't rank procreation against adoption; both are permissible if custody is fulfilled. 

  Comparing to Benatar and person-affecting views: Benatar says coming into existence is always harmful, but the custodial view doesn't claim that. The person-affecting objection is trickier because it might seem similar, but the user avoids claiming that happiness isn't good for the person. Emphasizing that the custody condition is about reasons, not value, is crucial here.

  The most damaging objection is likely the necessitist one. If possible people exist, the custody relation might already apply. The reply needs to separate abstract existence from the concrete relation requiring action. The user should concede that their view assumes contingentism but argue that custody requires actual, not possible, subjects for responsibility.

  The user should preempt some objections in the talk. Mentioning that they're not denying impersonal goodness in step 2 could prevent misunderstandings. Also, clarifying that future people's interests matter once they exist can address the economist's concern early.

  The reply that must land is distinguishing between impersonal goodness and custodial reasons. If the audience accepts that reasons of beneficence require a custody relation, the argument holds. If not, the whole view might collapse.

  The question they fear most is about the ontology of custody relations. If metaphysicians press on what constitutes a custody relation—its nature, how it's established—it could expose unexamined premises. The user needs a concise answer focusing on the normative aspect rather than metaphysical details.
answer: |-
  Here's your prep sheet, calibrated for *this* audience. Objections are ordered by likely sequence and phrased as they'll hear them. Focus is on survival, not perfection.

  **The 9 Objections & Replies:**

  1.  **The Metaphysician's Possibility Bomb (Necessitist):**
      *   *Phrased:* "If possible people exist (as non-concrete objects/abstracta), doesn't the 'subject' *already exist* for a potential custody relation? Your 'no relation' claim in (2) seems to presuppose contingentism – that they only exist when actual. Isn't that smuggling in a highly contested metaphysical premise without defense?"
      *   **Damage Level:** High (7/10). Sounds devastating in the room. It *is* a real metaphysical commitment.
      *   **Reply:** "My account operates within the *practical normative* domain of *actual* responsibilities arising from *actions we take*. Even if possible persons exist abstractly, *we* don't stand in a concrete, action-guiding relation of *custodial responsibility* towards them *until we actualize them*. The custody relation is fundamentally about *actual* dependence and *actual* capacity for care, not modal properties." (2 sentences)
      *   **Where it's Soft:** It doesn't *refute* necessitism; it stakes a claim that normative relations like custody require *concrete actuality* for practical reasons to bite, regardless of abstract existence. You're defining the relation normatively to require concreteness. This might not satisfy a hardcore necessitist.
      *   **Pre-emption:** Briefly flag in the talk: "My account assumes that *normative custody relations* require an *actual, concrete* subject."

  2.  **The Health Economist's Discount Rate Panic:**
      *   *Phrased:* "If there's no reason to promote the good of *merely possible* future people, doesn't this imply we can discount or ignore the well-being of future generations entirely when making policy decisions *now* (like climate action)? That seems catastrophically irresponsible and licenses terrible intergenerational injustice."
      *   **Damage Level:** Medium-High (6/10). Sounds politically dangerous and misunderstands scope.
      *   **Reply:** "Crucially, the custody condition applies to *bringing subjects into existence*, not to our duties *towards subjects who will exist*. Future people who *will* exist (barring catastrophe) *are* subjects we *will* have custodial duties towards. We have powerful *forward-looking* reasons *now* to ensure the world they *will* inhabit allows us (or others) to discharge those *future* duties adequately. Ignoring future suffering isn't licensed; it directly violates our anticipated custodial role." (3 sentences)
      *   **Where it's Soft:** Requires accepting "anticipated custody" as generating reasons *now*. Needs clarity that "will exist" means high probability/certainty based on current actions.

  3.  **The Person-Affecting Collapse Attempt (Ethicist/Bioethicist):**
      *   *Phrased:* "This just seems like a dressed-up Person-Affecting Restriction (PAR). You deny a reason to create happy people because there's 'no one' for whom the good exists *yet*, just like the PAR says creating happy people doesn't benefit *anyone*. Aren't you smuggling the core PAR intuition in through the back door?"
      *   **Damage Level:** High (8/10). The *real* threat. It challenges the core novelty claim.
      *   **Reply (The Wedge):** "No. The PAR claims creating a happy person isn't *good for them*. I *explicitly grant* that a happy life *is* impersonally good and *is* good *for the person* once they exist. The lack of reason stems *solely* from the absence of a pre-existing *custodial relationship* imposing a *duty on a specific agent* to bring that good about. It's about the source of *duties*, not the nature or location of *value*." (3 sentences - **MUST LAND**)
      *   **Where it's Soft:** Requires the audience to grasp the distinction between "value/goodness" and "reasons/duties generated *for specific agents*". Some will resist this separation.

  4.  **The Benatar Collapse Attempt (Probably a Grad Student):**
      *   *Phrased:* "Isn't this just Benatar-lite? You both agree there's no reason to create happy people (even if for different reasons), and a strong reason not to create unhappy ones. Doesn't that lead to the same anti-natalist conclusions?"
      *   **Damage Level:** Low-Medium (4/10). Easier to deflect.
      *   **Reply:** "Crucially different. Benatar argues *coming into existence* is *always* a net harm. I make *no such claim*. Happy lives are good! My view permits procreation; it just denies a *duty* to procreate *for the sake of the possible person*. It's neutral on whether procreation is good for parents/society. The asymmetry arises solely from the *structure of custodial duties*, not from a claim about existence being inherently harmful or non-beneficial." (3 sentences)
      *   **Where it's Soft:** Doesn't engage with whether Benatar *needs* his stronger claim if your view achieves asymmetry without it. But sufficient for Q&A.

  5.  **The "What About Adoption?" Challenge (Reproductive Policy Scholar):**
      *   *Phrased:* "If procreation is merely *permissible* (no duty to do it) but involves *taking on* a custody relation, doesn't adopting an existing child who *already needs care* generate a *stronger positive duty*? Doesn't this imply procreation is morally *inferior* to adoption?"
      *   **Damage Level:** Medium (5/10). Political landmine. Requires careful stepping.
      *   **Reply:** "My view focuses on the conditions for *creating* new custodial subjects. It doesn't directly rank *modes of acquiring custody*. Both procreating and adopting involve *entering* a custody relation. The duty to adopt arises primarily from the *existing child's urgent need* and *our general capacity* to help (potentially grounded in broader beneficence or rescue), *not* from the custody condition itself applied to procreation. My account is silent on whether one is 'better' than the other; it addresses the specific permissibility conditions for *creating* new dependents." (4 sentences - be concise)
      *   **Where it's Soft:** Sidesteps the direct comparison. Implicitly relies on a separate account of duties to existing needy children, which you haven't provided. Concede you're not addressing the full ethics of adoption vs. procreation *here*.

  6.  **The "Bootstrapping" Objection (Metaphysician/Ethicist):**
      *   *Phrased:* "How can the custody relation *itself* be the source of the duty? When you procreate, you *create* the relation *and* the dependent subject simultaneously. Doesn't this let you 'bootstrap' the duty into existence only *after* the act requiring justification is done? How can the relation you *create by acting* justify *that very act*?"
      *   **Damage Level:** High (7/10). Attacks the coherence of step (3).
      *   **Reply:** "The justification isn't retrospective. It's *prospective* based on *foreseeable consequences*. You know *before acting* (procreating) that *if* you perform this act, you *will* immediately enter a custody relation with a subject whose welfare you *know* you cannot adequately secure (in the case of severe suffering) or *can* secure (in the case of potential happiness). The impermissibility stems from *knowingly undertaking* an obligation you *foresee* you cannot fulfill. The relation isn't justifying the act *ex post*; the *knowledge* of the inescapable future relation *ex ante* constrains the permissibility of initiating it." (4 sentences)
      *   **Where it's Soft:** Requires accepting that knowledge of future inevitable relations generates reasons now. Some might argue you have no duties *until* the relation is instantiated.

  7.  **The "Scope of Custody" Question (Ethicist/Political Philosopher):**
      *   *Phrased:* "Your 'custody' sounds very private/parental. Does this view imply we have *no* general duties of beneficence towards strangers, or future people who *will* exist? Only duties to those we're in some special 'custody' relation with? That seems radically restrictive."
      *   **Damage Level:** Medium (5/10). Important clarification.
      *   **Reply:** "The custody condition specifically applies to *reasons to bring new subjects into existence*. It *does not* exhaust all duties of beneficence! I fully recognize duties towards strangers and future people based on other grounds – general beneficence, justice, prevention of harm, etc. The custody condition explains why *creating a new subject* is normatively distinct from *acting towards existing or future subjects*." (3 sentences - **Concede this upfront in the talk** when introducing step (1))
      *   **Where it's Soft:** Needs a clear demarcation between "custody" (creation/upbringing) and other beneficent relations, which might be fuzzy at the edges.

  8.  **The "Why Custody?" Challenge (Metaphysician/Value Theorist):**
      *   *Phrased:* "Why pick 'custody' as the magic relation? Why not some other special relation (like promising or friendship) or just general beneficence? This seems arbitrary. What's the *metaphysical* or *normative bedrock* for privileging custody?"
      *   **Damage Level:** Medium (6/10). Attacks the foundation of (1).
      *   **Reply:** "Custody captures the unique, non-voluntary, asymmetric dependence involved in *creating and sustaining* a new sentient being. Unlike promising, it's not chosen *by the dependent*. Unlike friendship, it's fundamentally about basic needs and vulnerability. It's the paradigmatic relation where one agent assumes primary, inescapable responsibility for *another's very existence and welfare*. General beneficence, while important, lacks this specific nexus of creation and dependence that generates the distinctive reasons around procreation." (4 sentences)
      *   **Where it's Soft:** "Paradigmatic" invites questions about edge cases (e.g., deep friendship, extreme vulnerability). Grounding the *normative force* of the custody relation itself remains foundational.

  9.  **The "Suffering Threshold" Problem (Ethicist/Practical Philosopher):**
      *   *Phrased:* "Your decisive reason against procreation kicks in only for 'severe, unrelievable suffering'. But most lives aren't that bad. Doesn't this leave a huge grey zone? How bad must the *risk* of a life be, or the *expected value*, to make procreation impermissible? Doesn't your view need a much more developed account of the threshold?"
      *   **Damage Level:** Medium (5/10). Highlights incompleteness, not core refutation.
      *   **Reply:** "You're right, this is a crucial area needing more work. The core asymmetry argument holds: *no* positive duty to create *any* happy life (due to no prior custody), but a decisive duty *not* to create lives where we *know* custodial duties *cannot* be discharged (extreme suffering). For lives above that threshold, procreation is permissible *if* we believe we can adequately discharge the custodial duties. Defining the precise threshold and handling risk are complex follow-up questions." (4 sentences - Concede the point readily)
      *   **Where it's Soft:** It's a major unresolved issue for practical application.

  **Concessions for Goodwill:** Explicitly concede **#7 (Scope of Custody)** early in the talk when introducing (1). Briefly acknowledge **#9 (Suffering Threshold)** as a significant area for future work during the core argument.

  **The Reply That MUST Land:** Your wedge against the Person-Affecting Collapse **(#3)**. If the audience doesn't grasp the distinction between *"No duty because no one exists for you to have a duty *to*"* (Custody) vs. *"No benefit because creating them isn't good *for them*"* (PAR), your core innovation collapses. Hammer this distinction clearly and repeatedly if needed.

  **The Question You're Praying Nobody Asks:** "**What *is* the ontological status and essential normative properties of this 'custody relation'? How does it metaphysically ground reasons, and how does it differ fundamentally in its reason-giving force from other asymmetric dependence relations (e.g., caring for a severely demented parent or an AI you accidentally create)?**"
  *   *Why it's terrifying:* It forces you into foundational meta-ethics/metaphysics you haven't developed, demanding an account of how this specific relation creates *sui generis* normative facts. It exposes the least defended core of your machinery (1) & (3). Your best bet is a very short, deflationary answer focusing on the *practical normative role* ("It's the relation constitutive of the special responsibilities arising from creating a dependent being") and quickly pivoting back to the procreative implications, but it risks sounding hand-wavy.

  **Survival Strategy:** Stay calm. Focus on **distinguishing value from agent-relative reasons** (#3 is key). Emphasize the **prospective, knowledge-based nature** of the duty in procreation (#6). **Concede scope limitations** (#7) early. Acknowledge the **metaphysical commitment** (#1) but frame it as essential for the *normative* model. Good luck!
