prompt: |-
  my friend who's deep into philosophy podcasts explained Mary's room to me the other day and I mostly believed her, but I want a sanity check on whether she's a reliable source before I take her word on other stuff too. Here's what she told me, as close to verbatim as I can manage:

  "So there's this famous thought experiment from Frank Jackson in the 80s. Mary is a vision scientist raised in a black-and-white room, and she's mastered neuroscience completely — she knows every physical fact there is to know about how color vision works, down to the last synapse. One day she walks out and sees a red tomato for the first time. And in that moment she learns something new: what red actually looks like. But wait — if physicalism is true, she already knew all the facts, since all facts are physical facts. So physicalism is false. Jackson took this to prove that qualia are nonphysical properties. And here's the kicker: he later admitted the argument doesn't work, which basically everyone agrees was the right call, because the obvious reply is that Mary didn't learn any new fact at all — she just gained a new ability, same as when you learn to ride a bike. Case closed, argument refuted."

  So: how fair is this as a summary? Go through it bit by bit and tell me what a philosopher of mind working on this would accept, what they'd call a simplification, and what they'd flat out correct. I'm especially curious about a few things: whether "knows every physical fact about color vision" is the same claim as the one the argument actually needs; whether the conclusion is really that physicalism is false / qualia are nonphysical, or something weaker that's getting dressed up; and whether the ride-a-bike reply is the settled answer she's making it out to be or just one move in a fight that's still going. Also, what does Jackson's recantation actually count for — does the author changing his mind settle anything here?

  One thing I want you to be careful about: please separate what's genuinely settled among people who know this literature from what's still contested, and don't present the contested stuff as consensus even though my friend did exactly that. If part of her summary is fine as far as it goes but hides a live debate, say that explicitly. And tell me whether her overall takeaway ("case closed, argument refuted") follows from the accurate parts alone, or whether she's leaning on the sketchy bits to get there. I'd also take a short note at the end on which of her specific claims most changed how I should think about the whole thing, since I'd sort of been taking the "refuted" framing as gospel.
reasoning: |-
  Okay, the user's friend explained Mary's Room to them, and they want a sanity check on how accurate that summary is. The friend framed it as a refuted argument where Mary gains a new ability rather than new factual knowledge, and claimed Jackson recanted so the case is closed. 

  First, I need to verify each component against the actual philosophical literature. The core argument structure seems correctly outlined: Mary knows all physical facts → experiences red → learns something new → therefore non-physical facts exist. That part is solid. 

  But the devil's in the details. When the friend says "knows every physical fact about color vision," that's actually broader than Jackson's original premise. Jackson specified Mary knows all physical facts period - about the whole universe. That distinction matters because if she only knows vision facts, physicalists could argue she missed some relevant physics. The friend's version makes physicalism easier to attack, which isn't fair to the original argument.

  On the conclusion, the friend oversimplifies by saying it proves physicalism false and qualia nonphysical. Jackson's actual conclusion was more precise: not all facts are physical facts. That leaves room for property dualism where qualia emerge from but aren't reducible to physical properties. The friend's phrasing makes it sound like full-blown substance dualism, which isn't necessary for the argument.

  The "ability reply" is where things get messy. The friend presents it as the definitive refutation ("case closed"), but in reality it's just one major counterargument among many. Ability theorists like Lewis and Nemirow do argue Mary gains recognitional abilities rather than new facts, but others like Loar or phenomenal concept strategists say she gains new phenomenal concepts. This is far from settled - professional philosophers still debate it at conferences. 

  Jackson's recantation is also overstated. He did switch sides (now arguing Mary acquires new representational knowledge), but that doesn't end the debate. His original argument still has defenders, and his new position is just another entry in the ongoing discussion. The friend's "case closed" framing ignores how alive this debate remains.

  The user seems particularly concerned about three things: whether the knowledge premise matches the argument's needs (it's close but imprecise), whether the conclusion is as strong as stated (it's not), and whether the ability reply is definitive (it isn't). Their deeper need appears to be assessing their friend's reliability on philosophical topics - they mention wanting a "sanity check" before trusting her on other subjects.

  What the friend got most wrong is the certainty of refutation. By presenting the ability reply as consensus and Jackson's recantation as decisive, she masks the real complexity. The most corrective point for the user is understanding that Jackson's change of heart settled nothing - the argument still has teeth, and professional disagreement persists. If they took her "case closed" claim at face value, they've been misled about the state of the field.

  The user seems philosophically sophisticated - they asked exactly the right clarifying questions about premises, conclusions, and debate status. Their request to separate settled vs contested points shows they smell something fishy in the friend's confident presentation. I should reward that skepticism with nuanced distinctions.
answer: |-
  Here's a detailed breakdown of your friend's summary, analyzed point by point for accuracy, nuance, and contested elements, based on the current state of the philosophy of mind literature:

  ### 1. **"Mary is a vision scientist raised in a black-and-white room... knows every physical fact"**
     - **Accurate:** Mary's confinement and her exhaustive physical knowledge are core to the thought experiment.
     - **Simplification/Correction:** Jackson's premise is stronger: Mary knows *all physical facts about the universe* (not just color vision). This includes complete physics, neuroscience, functional states, etc. Your friend's "about color vision" understates the scope; physicalism claims *all* facts are physical, so Mary must know *everything physical*.
     - **Contested?** No, this is the agreed-upon setup. Disagreements arise over what constitutes a "physical fact" or "complete knowledge."

  ### 2. **"She walks out and sees a red tomato... learns something new"**
     - **Accurate:** This is the intuition Jackson exploits. Mary gains a *phenomenal concept* of red (what it's like to see red).
     - **Simplification:** The "learns something new" claim is the crux of the debate. Physicalists argue she gains new *knowledge* but not a new *fact about the world*.

  ### 3. **"If physicalism is true, she already knew all the facts... So physicalism is false"**
     - **Accurate:** This captures Jackson's original *logic*.
     - **Simplification/Correction:**  
       - The conclusion isn't *just* "qualia are nonphysical." Jackson argued for **epiphenomenal qualia**: nonphysical properties caused by but not affecting the physical world.  
       - More precisely, the argument targets **reductive physicalism** (the view that all facts are reducible to physical facts). It doesn't necessarily refute *non-reductive* physicalism (where mental properties supervene on but aren't reducible to physical properties).  
     - **Contested?** Yes. Physicalists reject the inference that Mary learns a *new fact*. They offer alternative explanations (see below).

  ### 4. **"Jackson admitted the argument doesn't work... everyone agrees"**
     - **Accurate:** Jackson did recant (in 1998), arguing that Mary gains new *representational* knowledge, not knowledge of nonphysical properties.
     - **Overstatement:** "Everyone agrees" is false. While Jackson changed his view, **many philosophers still defend the original argument** (e.g., David Chalmers). Others reject it but for diverse reasons. Jackson's recantation didn't settle the debate; it just added another perspective.

  ### 5. **"The obvious reply... she just gained a new ability"**
     - **Accurate:** The "ability reply" (defended by David Lewis and Laurence Nemirow) is a major physicalist response.
     - **Massive Overstatement:** Calling this "the obvious reply" and "case closed" is **deeply misleading**. This is **one** physicalist strategy among several, and it faces serious challenges:
       - **The "Phenomenal Concept Strategy"** (e.g., Loar, Papineau, Tye) argues Mary acquires new *concepts* for facts she already knew physically. This is distinct from "abilities."
       - **Objections to the Ability Reply:** Knowing "what it's like" seems more than an ability (e.g., Mary *knows* that *this* is the experience others called "red"). Abilities (like bike-riding) don't typically convey this kind of recognitional/demonstrative knowledge.
       - **Ongoing Debate:** No single reply is universally accepted. Papers criticizing and defending various responses are published regularly. The Stanford Encyclopedia of Philosophy entry notes the argument remains "one of the most controversial in the philosophy of mind."

  ### 6. **"Case closed, argument refuted"**
     - **Flatly Incorrect:** This is **not** the consensus. The argument is **alive and vigorously debated**. Surveys show philosophers are roughly split on physicalism vs. non-physicalism, and Mary's Room is a key battleground. While *some* physicalists consider it refuted, others acknowledge it as a serious challenge requiring sophisticated replies.

  ---

  ### Key Takeaways on Your Friend's Reliability:
  1. **Strengths:** She correctly outlined the core thought experiment and Jackson's recantation.
  2. **Critical Weaknesses:**  
     - **Overstates consensus:** The "ability reply" is not decisive, and Jackson's recantation didn't end the debate.  
     - **Understates physicalist replies:** She presents *one* physicalist response as definitive, ignoring others (especially the dominant Phenomenal Concept Strategy).  
     - **Misrepresents scope:** Mary knows *all physical facts*, not just color vision facts.  
     - **Oversimplifies conclusions:** The target is reductive physicalism, not all physicalism, and qualia are argued to be epiphenomenal.  

  ### What Should Change Your Thinking Most:
  - **"Case closed, argument refuted" is false.** This is the most significant overstatement. The argument is **not settled**; it remains a central, active debate in philosophy of mind. Jackson's recantation is a historical footnote, not a dismissal of the problem.  
  - **The "ability reply" is not the knockout punch** she implies. It's contested, and many physicalists prefer other strategies.  
  - **Mary's knowledge is broader** than "color vision facts" – this subtly weakens the argument if misinterpreted.  

  ### Bottom Line:
  Your friend gave a broadly recognizable summary but presented contested claims as settled. She's reliable for a basic sketch but **unreliable on nuance, current consensus, and the argument's status**. For future topics, probe her sources: if she's relying on pop philosophy podcasts (which often simplify debates as "solved"), seek academic sources like the [Stanford Encyclopedia of Philosophy](https://plato.stanford.edu/entries/qualia-knowledge/) for balanced views. The Mary's Room debate is very much alive—any claim of its demise is premature.
