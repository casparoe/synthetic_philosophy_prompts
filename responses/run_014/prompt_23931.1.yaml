    - *Outcome*: Pass.  
  *Why?* The loser-pays rule amplifies the trap. Without it, REC still applies above $1.00 due to uncertainty, but losses are less severe.

  #### (c) Accounting of Un saved Verdicts
  SUT saves all verdicts except **verdict 3 (raise from 50¢ to 55¢)**. Here’s why:
  - **Verdict 3 conflict**: At 50¢, raising to 60¢ is rational per SUT (60¢ ≤ 100¢). However, backward induction reveals a contradiction:  
