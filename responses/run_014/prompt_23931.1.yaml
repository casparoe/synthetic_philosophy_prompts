    - Low confidence in three-bidder edge cases (e.g., if two players are above $1.00); SUT might need refinement for N>2.

  ### Final Summary
  The principle **SUT** explains your verdicts by separating rational bidding (≤ $1.00) from rational exiting (> $1.00) under strategic uncertainty. It revises verdict 3 under idealized rationality but preserves it empirically. The dollar auction’s "trap" stems from mutual escalation, not sunk costs—your gut rejects the two-line calculation past $1.00 because it ignores the opponent’s identical incentives. SUT encodes this, isolating the loser-pay rule’s toxic contribution. If you have tweaks to cases or thresholds, I’ll refine this.
