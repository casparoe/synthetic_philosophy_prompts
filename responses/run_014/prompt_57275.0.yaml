  #### **2. Is there a rule we could adopt now, with everyone's full rankings known, that avoids the arbitrariness the ordering displayed? If every candidate rule has a defect, identify the defect and say which is least objectionable.**

  No voting rule is perfect, as all have defects in cyclical or fragmented preferences like this. However, a rule can be chosen to minimize arbitrariness. Below are common rules, their defects, and a recommendation for your board.

  - **Sequential head-to-head (status quo):**  
    - **Defect:** Highly sensitive to agenda setting (as seen). Chair's order can manipulate the outcome.  
    - **Suitability:** Poor, as it invites strategic ordering.

  - **Borda count (assign points based on ranks):**  
    - For 3 candidates: 2 points for 1st, 1 for 2nd, 0 for 3rd.  
      - Alder: (6 × 2) + (2 × 1) = 14  
      - Brightwater: (5 × 2) + (6 × 1) + (2 × 1) = 18  
      - Cascade: (5 × 1) + (2 × 2) + (2 × 2) = 13  
      **Winner: Brightwater.**  
    - **Defect:** Violates independence of irrelevant alternatives (IIA). Adding a losing candidate (e.g., Dovetail) can change the winner (e.g., in 4-candidate Borda, Alder and Brightwater tie).  
    - **Suitability:** High. It uses full rankings and reduces agenda manipulation. Simple to compute.

  - **Instant runoff voting (IRV):**  
    - Eliminate the candidate with fewest 1st-place votes and redistribute.  
      - 1st choices: Alder 6, Brightwater 5, Cascade 4.  
      - Eliminate Cascade; redistribute to Alder (Group 3) and Brightwater (Group 4).  
      - New totals: Alder 8, Brightwater 7.  
      **Winner: Alder.**  
    - **Defect:** Non-monotonic (ranking a candidate higher can hurt them). Ignores lower rankings until later rounds.  
    - **Suitability:** Moderate. Familiar and resists vote-splitting, but can eliminate broadly acceptable candidates early.

  - **Condorcet methods (e.g., ranked pairs, Schulze):**  
    - Resolve cycles by strength of victories or other rules.  
    - For example, ranked pairs: Lock strongest pairwise wins (B > C by 7 votes, then C > A by 3 votes, but skip A > B to avoid cycle).  
      **Winner: Brightwater.**  
    - **Defect:** Complex to explain and compute. May not produce a winner in all cycles.  
    - **Suitability:** Low for your board. Complexity could cause distrust or errors in a small group.

  - **Plurality voting (current method with Dovetail):**  
    - **Defect:** Spoiler effect (e.g., Dovetail splits Alder's vote, handing win to Brightwater). Fails majority criterion (Brightwater won with 5/15 = 33%).  
    - **Suitability:** Poor, as it ignores rankings and amplifies fragmentation.

  **Recommendation:** Adopt the **Borda count** for the original three firms. It is the least objectionable:  
  - **Why:** It uses full rankings, avoids agenda manipulation, and is transparent. The defect (IIA) is manageable in a small board where preferences are known and fixed.  
  - **Result:** Brightwater wins (18 points) without ambiguity.  
  - **For future votes:** Use Borda count with points adjusted for the number of candidates (e.g., for \(n\) candidates, assign \(n-1, n-2, \dots, 0\) points).

