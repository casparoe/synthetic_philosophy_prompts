  First, I need to recall Morris's core beliefs. He despised industrial mass production that alienated workers and valued craftsmanship where the maker finds joy in creation. He believed art should be accessible but not at the cost of dehumanizing labor. So, for scenario A, the app churning out wallpaper would likely represent everything he hated—mechanized, impersonal, turning art into a commodity. It commodifies his style without human involvement, which he'd see as degrading art to factory output.

