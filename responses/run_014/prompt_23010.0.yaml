prompt: |-
  I cover science and ideas for a weekly magazine — lately mostly forecasting and decision science — and I also sit on the board of a small annual forecasting tournament: about 40 serious forecasters, a $12,000 prize, and forecasts scored on calibration (Brier score, for those keeping score). This year we have a problem. The tournament just closed, the winner and the runner-up are at each other's throats, and the runner-up has filed a formal protest asking us to disqualify the winner on epistemic grounds.

  Here's the concrete case. The disputed event was whether a certain infrastructure bill would pass the Senate before January 1, and it did, on December 18. The winner had put 87% on yes; the runner-up, 41%. We've checked the records, and neither of them had a private-information edge — both were working from the public record, wich is what the tournament expects for this category of event. The protest is not about the score, which is mechanical; it's about our own rulebook, which says forecasts must be "made in good faith and in accordance with the rules of rational updating." Her claim is that 87% was simply not a rational response to the public evidence — that no rational person could have assigned that probability, so the winner's forecast shouldn't count. I read somewhere, in a decision-science paper I can't now remember, a result to the effect that two perfectly rational people who start from the same prior assumptions can't rationally keep disagreeing once they know each other's beliefs — and if that's right, one of the two of them must be irrational, which is exactly what the protest is claiming. I don't remember the details, and I'm not sure all the assumptions actually hold in our case.

  So: I'd like you to draft the board's decision memo to circulate before Friday's vote. It should take a clear position — uphold the result or grant the protest — and it should give the reasoning in terms the two forecasters, who are both sharp and will read it, can actually respond to. I want the strongest version of the protest treated honestly, because two of my five board colleagues are on that side, and if the memo doesn't steelman their view, they'll just vote no. And if you recommend any rule changes for next year, say what they'd be and why they'd be fair to both sides. I'll be honest, I definately lean uphold, but I keep thinking that if we never police rationality, the tournament might reward lucky-but-unprincipled overconfidence, and I can't tell if that worry is real or just a post-hoc rationalization.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're on the board of a forecasting tournament where the winner and runner-up are in dispute. The runner-up claims the winner's 87% probability on the infrastructure bill passing was irrational, even though both used public information. The user needs a memo that decides whether to uphold or disqualify, with solid reasoning.

  First, I need to recall that decision-science paper they mentioned about rational disagreement. The key concept is Aumann's Agreement Theorem. It says that if two rational people have the same prior and their beliefs are common knowledge, they can't agree to disagree. But in this case, do the forecasters have the same prior? The user said both worked from public records, but priors might differ. So maybe the theorem doesn't strictly apply here.

  The runner-up argues that 87% is too high based on public evidence. But rationality in forecasting doesn't require a single correct probability. Different interpretations of the same data can lead to different probabilities. For example, one forecaster might weigh certain factors more heavily. That's not irrational; it's a judgment call.

  The user is worried about rewarding overconfidence. But the scoring system (Brier score) already penalizes overconfidence. The winner had a high score because they were well-calibrated. Disqualifying them for a subjective reason could undermine the tournament's credibility. Plus, without clear guidelines on what's "rational," it's messy to police.

  For the memo, I should present both sides but conclude to uphold the result. Steelmanning the protest: if probabilities are too extreme without justification, it might be irrational. But here, the bill did pass, and the winner had reasons. The key is that rationality allows a range of opinions.

  Rule changes for next year could include requiring justification notes or post-mortems. That way, forecasters explain their reasoning without subjective disqualifications. This promotes transparency without unfairness.

  The user's deeper need is maintaining the tournament's integrity. They don't want to discourage skill but also prevent luck from winning. By upholding and adding rules for documentation, they balance both. The memo needs clear reasoning so the forecasters accept the decision.
answer: |-
  ## MEMORANDUM  
  TO: Forecasting Tournament Board Members  
  FROM: Board Secretary  
  SUBJECT: Ruling on Protest Regarding Event #47 (Senate Infrastructure Bill Passage)  
  DATE: October 26, 2023  

  **I. Decision:**  
  The Board **upholds the original results** and **denies the protest** to disqualify the winner. The winning forecast of 87% probability for the bill's passage before January 1 stands as valid and compliant with tournament rules.  

  **II. Core Reasoning:**  
  After thorough review, the Board finds no grounds for disqualification under Rule 4 ("forecasts must be made in good faith and in accordance with the rules of rational updating"). Our reasoning addresses the protest’s core argument and the underlying principles of forecasting rationality:  

  1.  **The Protest’s Steelmanned Argument (Aumann's Agreement Theorem):**  
      The protest correctly invokes a fundamental idea (Aumann's Agreement Theorem) stating that two *perfectly rational* agents with *identical prior beliefs* and *common knowledge of each other's beliefs* cannot persistently disagree. The implication is that one forecaster *must* be irrational.  

  2.  **Why This Does Not Apply Here:**  
      *   **Different Priors/Interpretations Are Permissible:** The theorem assumes identical prior beliefs. Our rules *do not* require forecasters to hold identical priors or interpret public evidence identically. Rational agents can legitimately:  
          *   Weight conflicting evidence differently (e.g., partisan statements vs. procedural momentum).  
          *   Apply distinct heuristic models (e.g., betting market trends vs. whip count analysis).  
          *   Have different risk assessments regarding last-minute obstacles.  
          The public record on this bill (procedural votes, public statements, whip counts, historical precedent, external pressures) was complex and open to multiple defensible interpretations. A 41% assessment (focusing on hurdles) and an 87% assessment (focusing on momentum and low historical failure rates for similar bills) can *both* be rational interpretations of the same public data.  
      *   **Common Knowledge Was Absent:** Forecasters submitted final probabilities privately. They did not engage in a repeated, transparent exchange of reasoning required by the theorem to force convergence. The tournament structure inherently prevents the "common knowledge" condition from being met at the point of submission.  
      *   **Rationality ≠ Correctness:** Rationality is about sound reasoning given one's information and model. An 87% probability implies a 13% chance of failure – an outcome well within the realm of possibility for a rational forecast. The bill's passage *confirms the outcome*, not the *irrationality* of a dissenting probability assessment. A 41% probability was simply incorrect *ex post*, not inherently irrational *ex ante*.  

  3.  **"Good Faith" Requirement is Met:**  
      There is zero evidence the winner acted in bad faith. They used public information, as required, and submitted a single, timely forecast. The protest disputes the *conclusion* of the winner's reasoning, not the sincerity of the process.  

  4.  **The Scoring System is the Primary Arbiter:**  
      The Brier score explicitly rewards both calibration and confidence. The winner's well-calibrated high confidence (87% on an event that happened) earned them a superior score. Introducing subjective board adjudication of "allowable probability ranges" post-hoc undermines the objectivity of the scoring metric and the tournament itself.  

  **III. Addressing Board Concerns:**  
  The worry that the tournament might reward "lucky-but-unprincipled overconfidence" is valid. However:  

  1.  **Brier Score Penalizes Overconfidence:** Luck cannot sustain tournament success. An overconfident forecaster (e.g., constantly assigning 90%+ to events that only happen 70% of the time) will be severely penalized by the Brier score over multiple events. This winner excelled *overall* based on consistent performance.  
  2.  **The Cure is Worse Than the Disease:** Establishing an *ex post* board review to determine "rational probability ranges" for complex events is:  
      *   **Subjective:** Boards lack objective criteria to define the "one true rational probability."  
      *   **Chilling:** It discourages forecasters from making bold, well-reasoned predictions for fear of disqualification.  
      *   **Unmanageable:** Opens endless disputes ("My 75% was rational, theirs was not!").  
      *   **Unfair:** Punishes skill (correct high confidence) based on an opponent's differing interpretation.  

  **IV. Recommended Rule Changes for Next Year (Promoting Rationality Objectively):**  
  To strengthen the tournament's emphasis on principled forecasting without subjective disqualifications, we propose:  

  1.  **Mandatory Brief Reasoning Notes (Max 100 words):**  
      *   **Why:** Requires forecasters to succinctly articulate their key evidence/model *at the time of submission*.  
      *   **Fairness:** Applies equally to all. Provides transparency into *why* a probability was assigned, allowing the scoring system (and post-tournament analysis) to naturally reward sound reasoning over time. Does *not* subjectively invalidate forecasts.  
  2.  **Post-Event "Post-Mortem" Option (Non-Scored):**  
      *   **Why:** Allows forecasters (especially those with divergent views) to voluntarily submit a short analysis *after resolution* explaining why their assessment was right/wrong in hindsight or why others might have erred.  
      *   **Fairness:** Optional, non-punitive. Fosters a culture of learning and critical discussion about evidence interpretation and model application. Provides rich qualitative data for tournament analysis.  
  3.  **Clarify Rule 4 Language:**  
      *   **Change:** "Forecasts must be made in good faith based solely on public information available at the time of submission, reflecting the forecaster’s genuine probabilistic assessment derived from reasoned interpretation of that information."  
      *   **Why:** Removes ambiguous "rules of rational updating" while emphasizing good faith, public information, and reasoned interpretation. Focuses on *process* over *outcome*.  

  **V. Conclusion:**  
  Disqualifying a winner based on a competitor's disagreement with their probability assessment – absent bad faith or private information – sets a dangerous precedent. It substitutes subjective judgment for our objective scoring system and fails to account for the legitimate diversity of rational interpretation inherent in forecasting complex events. The winner's 87% forecast was a high-confidence, well-calibrated judgment based on public information, submitted in good faith. It is valid. Upholding the result maintains the integrity and objectivity of the tournament.  

  The recommended rule changes will enhance transparency, promote documented reasoning, and foster learning, addressing the core concern about principled forecasting without resorting to subjective vetoes of probability assignments.  

  **VI. Vote:**  
  Please indicate your vote on upholding the result (denying the protest) by replying to this memo by 5 PM Friday.  

  ---
  **This memo provides:**  
  1.  A clear decision upholding the result.  
  2.  Honest engagement with the protest's strongest argument (Aumann) and why it doesn't apply.  
  3.  Explanation of why differing rational interpretations are possible.  
  4.  Rejection of subjective "rational probability" policing.  
  5.  Concrete, fair rule changes to improve rationality documentation.  
  6.  Reasoning focused on tournament integrity and objective scoring.  

  It addresses the sharp forecasters by focusing on the epistemology of disagreement under public information and the practical dangers of the proposed disqualification.
