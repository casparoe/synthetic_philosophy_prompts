prompt: |-
  Give an example of a binary collective decision problem in which the Condorcet jury theorem’s usual conclusion—that majority accuracy increases with group size—does not follow because the voters’ signals are correlated through a shared epistemic source, even though each voter is individually more likely than not to be correct; specify the correlation structure, explain how the probability that the majority is correct behaves as the group size increases, and say what this implies for using forecast aggregation as an epistemic device.
reasoning: |-
  We are going to construct an example where the Condorcet jury theorem fails due to correlated signals.
   The Condorcet jury theorem assumes that voters are independent and each has a competence p>0.5. Then, as the group size increases, the probability that the majority is correct goes to 1.

   However, if the voters' signals are correlated, this might not hold.

   Example setup:
     - There is a binary state of the world: S in {0, 1}. Let P(S=1) = 0.5.
     - There is a shared epistemic source: a single random variable X that affects all voters.
     - Specifically, let X be such that:
          X | S=1 ~ Uniform[0,1]
          X | S=0 ~ Uniform[0,1]   [We can actually use the same distribution because we will condition on S appropriately.]

     But we need to create dependence. Here's a common way:

     Idea: 
        We have a common signal X that is generated from the state. Then, each voter's signal is a function of X and some independent noise? 
        However, we want to show that even without independent noise, if they all share the same signal, then they all vote the same and the majority doesn't improve.

     Alternatively, we can have a model where the voters observe the same noisy version of the state.

     Let's try a simpler model:

     - The state S is either 0 or 1, equally likely.
     - There is a latent variable X that is standard normal and independent of S? Not necessarily.

     Instead, consider:

     - Given the state S, we generate a common signal X that is binary. 
          P(X=1 | S=1) = p, P(X=0 | S=1) = 1-p.
          P(X=1 | S=0) = 1-p, P(X=0 | S=0) = p.

     Then, each voter i observes X (the same for all). So each voter gets the same signal. Then, each voter votes according to X: 
          They vote for the state that is more likely given X.

     But note: if they all observe the same X, then they all vote the same. Therefore, the majority vote is just the same as the individual vote.

     The probability that an individual is correct is:
          P(correct) = P(S=1, X=1) + P(S=0, X=0)
                    = 0.5 * p + 0.5 * p = p.

     So if p>0.5, each voter is more likely to be correct than not. But when the group size increases, since they all vote the same, the majority vote (which is unanimous) is still correct with probability p. Therefore, the probability that the majority is correct remains p, and does not go to 1.

     This is a simple example. However, note that in this example the voters are not using independent information. They are all using the same signal.

     But the problem asks for correlation through a shared epistemic source. This example fits.

     Let's formalize:

       State: S ~ Bernoulli(0.5)
       Common signal: 
          if S=1: X ~ Bernoulli(p)
          if S=0: X ~ Bernoulli(1-p)   [which is the same as X ~ Bernoulli(p) flipped? Actually, we define so that when S=0, X=0 with probability p and X=1 with probability 1-p.]

       Actually, we can define:
          X | S=1: P(X=1)=p, P(X=0)=1-p
          X | S=0: P(X=1)=1-p, P(X=0)=p

       Then each voter i observes X and votes V_i = X. Why? Because if X=1, then the state is more likely to be 1 (if p>0.5). Similarly, if X=0, then the state is more likely 0.

       Then the vote of every voter is the same: either all 1 or all 0.

       The probability that the vote is correct is:
          P(correct) = P(S=1, X=1) + P(S=0, X=0)
                     = 0.5 * p + 0.5 * p
                     = p.

       And for any group size n (odd or even), the majority is always unanimous, so the probability that the majority is correct is p, which is constant and does not change with n.

     Therefore, the conclusion of the Condorcet jury theorem does not hold.

     What does this imply for forecast aggregation?
       This shows that if the voters share a common source of information and do not have independent sources, then increasing the group size does not improve the accuracy of the majority vote. 
       In fact, if the shared source is flawed, the entire group will be wrong together.

     Hence, for forecast aggregation to benefit from the "wisdom of crowds", it is crucial that the individuals have access to independent information. Otherwise, aggregation (like majority vote) may not improve beyond the shared signal.

     However, note that even in this case, if we had a mix of independent and common signals, we might get some improvement but not to the extent of the independent case. But in the extreme case of perfect correlation, there is no improvement.

     So the key is independence. The Condorcet jury theorem relies on independence.

     This example also highlights the importance of diversity in information sources for collective decision-making.

     We can also consider a slightly more complex model with both common and idiosyncratic noise, but the above is the simplest to illustrate the point.
answer: |-
  In the following binary collective decision problem, the Condorcet jury theorem's conclusion fails due to correlated voter signals from a shared epistemic source, despite each voter being individually competent.

  ### Problem Specification
  - **State of the world**: Binary state \(S \in \{0, 1\}\), with \(\mathbb{P}(S = 1) = \mathbb{P}(S = 0) = 0.5\).
  - **Shared epistemic source**: A single noisy signal \(X\) generated as follows:
    - If \(S = 1\), then \(X \sim \text{Bernoulli}(p)\) with \(p > 0.5\).
    - If \(S = 0\), then \(X \sim \text{Bernoulli}(1 - p)\) (so \(\mathbb{P}(X = 0 \mid S = 0) = p\)).
  - **Voters**: For a group of size \(n\), each voter \(i\) observes \(X\) (the **same** signal for all voters) and votes identically:  
    \(V_i = X\) for all \(i\).  
    Thus, all voters cast the same vote: either all \(1\) or all \(0\).

  ### Correlation Structure
  - **Dependence on \(X\)**: All voters' signals are perfectly correlated because they **share the identical signal \(X\)**.  
  - **Conditional independence**: Given \(X\) (or given \(S\)), voters' votes are deterministic and identical. There is **no independence** across voters.  
  - **Correlation magnitude**: The correlation between any two voters \(i\) and \(j\) is \(\rho_{ij} = 1\) (perfect positive correlation).

  ### Voter Competence
  Each voter is individually competent:  
  \[
  \mathbb{P}(V_i = S) = \mathbb{P}(X = S) = \mathbb{P}(X=1, S=1) + \mathbb{P}(X=0, S=0) = (0.5 \cdot p) + (0.5 \cdot p) = p > 0.5.
  \]
  Thus, each voter is more likely correct than not.

  ### Majority Accuracy
  - Since all voters vote identically, the majority vote is always unanimous:  
    - If \(X = 1\), all vote \(1\).  
    - If \(X = 0\), all vote \(0\).  
  - The probability that the majority (unanimous) vote is correct simplifies to:  
  \[
  \mathbb{P}(\text{majority correct}) = \mathbb{P}(X = S) = p.
  \]
  - **Behavior with group size**: This probability **remains constant at \(p\)** for all \(n\) (odd or even). It **does not increase** with \(n\) and **does not converge to 1**.  

  ### Numerical Example
  Let \(p = 0.7\):  
  - **Individual accuracy**: \(0.7\).  
  - **Majority accuracy for any \(n\)**: Always \(0.7\).  
  - For \(n = 1, 3, 101\), accuracy is unchanged at \(70\%\), violating the Condorcet conclusion.

  ### Implications for Forecast Aggregation
  1. **Failure of wisdom of crowds**: When signals are correlated through a shared source, aggregating votes (e.g., via majority) **does not improve accuracy** with group size. The shared epistemic bottleneck limits collective performance to individual-level accuracy.  
  2. **Importance of signal diversity**: Forecast aggregation is only effective as an epistemic device when voters have **independent information** (or sufficiently diverse signals). Here, correlation nullifies the benefit of adding more voters.  
  3. **Practical considerations**: In real-world settings (e.g., expert panels, prediction markets), shared biases, common data sources, or groupthink can induce such correlation. Ensuring **independent information gathering** is crucial for harnessing collective intelligence.  
  4. **Robust aggregation methods**: Techniques like weighting independent voters more heavily or modeling correlation structures (e.g., Bayesian networks) may mitigate this issue, but uncritical reliance on simple majority voting is flawed under correlation.

  This example illustrates that **correlation in epistemic sources can undermine the core mechanism of the Condorcet jury theorem**, highlighting that aggregation benefits arise from signal diversity, not merely group size.
