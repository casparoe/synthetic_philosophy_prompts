  First, the young adult becomes vegetarian based on a mentor's advice without engaging with reasons. User finds this deficient. Second, the physician follows ethics protocol without independent thought. User sees this as responsible. Third, voter relies on an activist's account and votes without recalling details. User thinks it's permissible. Fourth, visitor defers to a local guide about photography. Unobjectionable. Fifth, person uses an AI for everyday moral decisions without thinking. Troubling. Sixth, non-moral deference like weather models is fine.

  The user's tentative hypothesis mentions role-based responsibilities, time pressure, or local ignorance as acceptable, but standing substitution for moral agency as objectionable. They're unsure how this distinguishes the physician from the AI subscriber, or the voter from the vegetarian.

  Hmm, the key differences might be about context. The physician has time pressure and institutional trust, while the AI user opts out entirely. The voter is engaging with a detailed account, even if they don't remember later, whereas the vegetarian doesn't engage at all. Maybe the depth of engagement or the presence of a trusted system matters.

  Now, for the principles. The first principle could be about non-substitution: deference is okay if it doesn't replace the agent's moral engagement. The physician is in a role with protocols, so it's a tool, not a replacement. The AI subscriber uses it as a standing substitute, which is bad. But the voter case—they read the detailed account, which is engagement, even if they forget. The vegetarian didn't engage at all, so that's why it's deficient. 

  For the undecided cases: retrospective deference about past guilt. Using a mentor to assess past actions—if it's a one-time thing due to confusion, maybe okay, but habitual use might be substitution. Forgiveness deference could be tricky because forgiveness is personal. Relying on someone else to tell you to forgive might bypass emotional processing, so probably objectionable.

  Second principle: scope-limited reliability. Deference is acceptable if the source is reliable and the situation is within their expertise. Physician: ethics committee is expert in hospital protocols. Visitor: local guide knows cultural norms. AI advisor might be reliable, but moral decisions are holistic and personal, so even reliable AI isn't appropriate. Voter: activist has experiential expertise, so okay. Vegetarian mentor is reliable, but why is it deficient? Maybe because moral understanding requires personal reasoning, not just correctness. But the user finds it deficient beyond lack of curiosity. So Principle 1 handles the vegetarian case better because it's about substitution of agency.

  In the physician case, they're following a protocol due to role constraints, not avoiding moral thinking. The AI user has no such constraints and uses it for everyday decisions, substituting entirely. The voter engages with the material, so not substitution. The vegetarian doesn't engage, which is similar to substitution. 

  For the undecided cases under Principle 1: retrospective deference might be okay if it's occasional, not habitual. But forgiveness should involve personal engagement. Under Principle 2, forgiveness might be outside the advisor's scope unless they're a therapist, but even then, it's personal.

  Tension with verdicts: Principle 1 might struggle with the voter case because the voter doesn't reconstruct the argument later, but the principle requires engagement at the time. The user thinks the voter case is exemplary, so Principle 1 might need to allow that initial engagement suffices even without retention. Principle 2 might have issues with the vegetarian case—why is it deficient if the mentor is reliable? The user's intuition is about the lack of engagement, not reliability, so Principle 2 might not capture that well.

  So Principle 1 better explains the vegetarian and AI cases as substitution, while Principle 2 explains physician and visitor as expert sources. But Principle 1 aligns more with the deeper concern about moral agency. The user needs to decide if engagement is key or reliability in context. Also, for the undecided cases, both principles would caution against deference in forgiveness as it requires personal processing.
answer: |-
  Here are two candidate principles designed to systematize your judgments, each addressing the nuances in your cases and highlighting key distinctions:

  ### **Principle 1: The Moral Agency Preservation Principle**
  > **Deference to another’s moral judgment is permissible if and only if:**
  > (a) It does not function as a **standing substitute** for the agent’s moral engagement in their life;  
  > (b) **AND** it is constrained by **role-specific duties, time-sensitive necessity, or localized epistemic limitations**;  
  > (c) **UNLESS** the act of deference itself constitutes a minimal exercise of moral agency (e.g., selecting a trustworthy source, contextual understanding).  

  #### **Motivation by Cases:**
  - **Clause (a)**: Explains the *vegetarian* (reliance as habitual bypass) and *AI subscriber* (systematic substitution) cases as objectionable.  
  - **Clause (b)**: Justifies the *physician* (role/time constraints), *visitor* (local ignorance), and *nonmoral deference* (technical necessity).  
  - **Clause (c)**: Captures the *voter* (selecting source + grasping "gist" as agency) and *visitor* (sensitivity to context) as permissible.  

  #### **Predictions for Undecided Cases:**
  1. **Retrospective deference** (e.g., asking a mentor if past guilt was warranted):  
     - **Permissible** if episodic and motivated by confusion (aligned with "localized epistemic limitation").  
     - **Objectionable** if habitual, as it substitutes personal reckoning with external verdicts (violates (a)).  
  2. **Prospective deference on forgiveness**:  
     - **Objectionable**: Forgiveness requires first-personal emotional and moral processing; outsourcing it violates (a) and lacks the excusing conditions in (b).  

  #### **Tension with Verdicts:**
  - **Accommodates all six cases** with nuance:  
    - Vegetarian/AI cases fail (a)/(c); physician/visitor/voter/nonmoral satisfy (b)/(c).  
  - **Possible revision**: The *voter*’s inability to reconstruct arguments might challenge (c), but you accept "grasping the gist" as sufficient agency.  

  ---

  ### **Principle 2: The Scope-Limited Reliability Principle**
  > **Deference is permissible when:**  
  > (a) The source is **reliable within a bounded domain**;  
  > (b) **AND** the agent’s reliance is **justified by domain-specific expertise, institutional role, or contextual urgency**;  
  > (c) **BUT impermissible** if the domain requires **first-personal moral commitment** (e.g., core values, lifelong agency).  

  #### **Motivation by Cases:**
  - **Clause (a)**: Grounds *nonmoral deference* (technical reliability) and *physician* (institutional reliability).  
  - **Clause (b)**: Explains *visitor* (cultural expertise) and *physician* (urgency).  
  - **Clause (c)**: Forbids *AI subscriber* (holistic agency replaced) and *vegetarian* (core values unexamined), while allowing *voter* (single-issue reliance on experiential expertise).  

  #### **Predictions for Undecided Cases:**
  1. **Retrospective deference**:  
     - **Permissible** if the source (e.g., therapist) has domain expertise on guilt, but **cautioned** if it avoids personal growth (risks violating (c)).  
  2. **Forgiveness deference**:  
     - **Objectionable**: Forgiveness inherently demands first-personal commitment (violates (c)); no expertise can fully substitute this.  

  #### **Tension with Verdicts:**
  - **Struggles with the vegetarian case**: If the mentor is domain-reliable (animal ethics), why is it deficient? Your intuition suggests Clause (c) must prioritize "first-personal commitment" over reliability.  
  - **AI subscriber case**: Reliability is stipulated, but you reject it—reinforcing that moral agency domains (c) trump reliability.  
  - **Voter case**: Fits if the activist’s testimony is seen as domain-expertise.  

  ---

  ### **Key Distinctions Achieved**
  - **Physician vs. AI Subscriber**:  
    - Both principles distinguish via **role-urgency** (P1b/P2b) vs. **standing substitution** (P1a) or **domain-commitment** (P2c).  
  - **Voter vs. Vegetarian**:  
    - Voter’s deference is **episodic + agential** (grasping gist/P1c; issue-specific/P2b), while vegetarian’s is **habitual + agentially passive**.  

  ### **Recommendation**
  **Principle 1** best captures your emphasis on *moral agency* across cases, cleanly accommodating your vegetarian verdict and offering clear guidance for forgiveness/guilt. **Principle 2** usefully highlights reliability but risks undervaluing agency in the vegetarian case. Refine Principle 1 by clarifying that "minimal agency" (clause c) includes *source selection* and *contextual sensitivity* (as in voter/visitor), while "standing substitution" (clause a) implies a pattern of avoiding engagement.  

  This systematization suggests revisiting the **vegetarian case**: If the mentor is trusted and the outcome correct, is the deficiency truly *moral* (vs. epistemic)? If your intuition holds, Principle 1’s agency-focused framing stands.
