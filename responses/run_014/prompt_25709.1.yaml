prompt: |-
  I was listening to a philosophy podcast and the host summarized deflationary theories of truth like this:

  "Deflationists think truth isn't a real property. Saying 'snow is white is true' is just a long-winded way of saying 'snow is white.' The word 'true' doesn't describe anything about the world — it's just a linguistic device for convenience, like when we say 'everything the Pope says is true' without listing every statement. So truth is basically a redundant concept, and all the traditional debates about truth — correspondence vs. coherence, etc. — are really just pseudo-problems that come from treating a grammatical predicate as if it named a deep property."

  This sounded clean but maybe too clean? I've heard there are different kinds of deflationism and I'm wondering whether this summary lumps them together in a way that someone like Horwich or Field would push back on. Can you go through it and tell me what's accurate, what's a simplification a careful deflationist would qualify, and what (if anything) is just wrong? And does the "pseudo-problems" conclusion actually follow from the accurate parts?
