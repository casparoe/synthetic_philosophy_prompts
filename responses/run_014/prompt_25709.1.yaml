  First, I need to break down the podcast's claims and compare them to actual deflationary theories. The key points are truth not being a substantive property, redundancy, and dismissal of traditional debates. I remember that Horwich's minimalism and Field's disquotationalism are two major strands. Horwich focuses on the equivalence schema, while Field emphasizes the disquotational nature and might have concerns about propositions.

  The user mentions if the summary lumps different deflationists together. That's a valid concern. Field, for example, is stricter about the role of propositions and might think truth applies only to sentences, not propositions. Also, Field is more cautious about generalizations, suggesting that "all Fs are true" might need a stronger logical framework. Horwich, on the other hand, accepts propositions as truth-bearers. So the summary's oversimplification here could misrepresent their differences.

  Another point is whether truth is entirely redundant. The equivalence schema is central, but deflationists don't deny that "true" has a function—it's useful for generalizations. Calling it "redundant" might imply it's unnecessary, but they argue it's pragmatically useful. The user might be confused here, thinking deflationists see no use for "true," which isn't the case.

  The claim about traditional debates being pseudo-problems needs examination. Deflationists do reject correspondence as a substantive relation but might still accommodate coherence in a deflated sense. So dismissing all debates as pseudo-problems might be too strong. The user is probably wondering if this conclusion logically follows, and I need to clarify that while deflationists downplay these debates, they don't necessarily see them as entirely meaningless, just based on a misunderstanding of truth's nature.

  The user's deeper need seems to be understanding whether deflationism is as straightforward as the podcast presented. They might be encountering conflicting information and want a nuanced view. They also might be interested in how deflationists handle objections, like the generalization problem or the success argument. Addressing these points could provide a more comprehensive answer, even if they weren't explicitly asked.

  I should also check if the summary's statement about "true" not describing anything is correct. Deflationists do deny it describes a property, but they acknowledge its logical function. Emphasizing the difference between substantive properties and logical functions here is important to avoid confusion.

