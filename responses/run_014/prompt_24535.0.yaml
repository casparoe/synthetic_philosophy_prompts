answer: |-
  Based on the five verdicts provided, the implicit rule your colleague applies for rational deference to a group's choice can be reverse-engineered as follows:

  **Rule:** It is rational to defer to a group's choice against one's own private lean if and only if:
  1. **The group's decision is likely based on informational advantages** (e.g., superior expertise, access to better or independent information, or network effects that convey practical benefits), and
  2. **The individual's private evidence is weak or inconclusive** (i.e., not strongly held, based on limited analysis, or insufficient to outweigh the group's collective wisdom).

  If either condition fails—especially if the group's decision is driven by non-informational factors (e.g., social trends, peer pressure) or the individual has strong, well-founded evidence—deference is irrational.

  ### Analysis of Verdicts Using the Rule:
  1. **Restaurant queue (rational):**  
     - The group (queue) signals informational advantage (e.g., the restaurant's quality).  
     - Individual's evidence is weak (mild hunger, no strong preference).  
     → *Rational to defer*.

  2. **Junior doctor (rational):**  
     - Group (senior colleagues) has informational advantage (greater expertise/experience).  
     - Individual's evidence is weak (only weakly favors old protocol).  
     → *Rational to defer*.

  3. **Startup founder (rational):**  
     - Group (competitors) signals informational advantage (network effects, market wisdom).  
     - Individual's evidence is weak (small performance disadvantage).  
     → *Rational to defer*.

  4. **Juror (not rational):**  
     - Group (other jurors) may have informational advantage, but...  
     - Individual's evidence is strong (fairly confident in acquittal).  
     → *Not rational to defer* (condition 2 fails).

  5. **Coffee brand (not rational):**  
     - Group's decision (social media trend) is non-informational (driven by popularity, not quality).  
     - Individual's evidence is strong (clear private preference).  
     → *Not rational to defer* (both conditions fail, but non-informational factor is decisive).

  **Other Candidate Rules and Fit:**  
  - **Candidate Rule A:** Defer if the group is more expert/informed *and* the individual's evidence is weak.  
    - *Fits all verdicts*: Matches cases 1–5 (expertise/information advantage is implied in cases 1–3; strong evidence or non-informational factors negate in 4–5).  
  - **Candidate Rule B:** Defer only if the group's decision is based on independent information aggregation (e.g., diverse perspectives) and not on cascades/herding.  
    - *Fits all verdicts*: Cases 1–3 imply information aggregation; cases 4–5 involve potential herding/trends.  
  - **Candidate Rule C:** Defer if the cost of individual error is high and the group is more accurate.  
    - *Does not fit*: Fails case 4 (jury errors are high-cost, yet deference is irrational) and case 1 (queue has low cost of error).  
  - **Candidate Rule D:** Defer if network effects are present (e.g., industry standards).  
    - *Does not fit*: Fails case 5 (social trends are network-like, but deference is irrational).  

  Only **Candidate Rules A and B fit all five verdicts equally well**.  
  - **Rule A** emphasizes expertise/information asymmetry.  
  - **Rule B** emphasizes independent information (e.g., avoiding herd behavior).  

  ### Prediction for the New Case:  
  - **Scenario:** Mid-level engineer is strongly convinced (based on careful analysis) that approach Y is superior, but senior leadership (more experienced, better business context) chose X.  
  - **Analysis using the primary rule:**  
    - Condition 1 (informational advantage): Likely satisfied (leadership has superior business context/experience).  
    - Condition 2 (evidence strength): **Fails**—individual has strong, careful evidence for Y.  
    → *Not rational to defer* (similar to juror case).  
  - **Prediction with Candidate Rule A:** Same outcome (strong evidence → not rational).  
  - **Prediction with Candidate Rule B:** Strong evidence suggests Y might be correct; leadership's decision could reflect independent info, but strength of private evidence dominates → not rational.  

  **Most Likely Verdict:** **Not rational to defer**.  
  - **Why?** The strength of the engineer's evidence (strong conviction from careful analysis) is analogous to the juror (case 4), where strong private evidence overrides group advantage. Leadership's expertise is relevant but does not automatically negate well-founded individual analysis. The colleague's pattern prioritizes evidence strength over group authority when private conviction is robust.  

  ### Case to Distinguish Candidate Rules:  
  **Case Proposal:**  
  *A climate scientist is privately skeptical of a new policy (based on preliminary data), but 95% of expert peers—including leading authorities—endorse it. However, it is later revealed that the experts' consensus emerged from a small influential group, and dissenting voices were suppressed.*  

  - **Primary Rule Prediction:**  
    - Group has informational advantage (experts), but individual's evidence is weak (preliminary data) → **rational to defer** (if suppression is unknown).  
  - **Candidate Rule A (expertise + weak evidence):** Same → **rational to defer**.  
  - **Candidate Rule B (independent information):**  
    - If consensus is not independent (suppressed dissent → herding), deference is irrational → **not rational to defer**.  
  - **How it distinguishes:** Only Rule B would deem deference irrational due to non-independent information aggregation. This tests whether the colleague prioritizes informational independence over mere expertise.  

  This case isolates the difference between Rule A/B, as the expert group's informational validity is compromised.
