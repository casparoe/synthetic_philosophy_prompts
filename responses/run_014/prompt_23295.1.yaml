  So I was reading this essay by this philosopher, Elizabeth Anscombe, where she basically argues that Truman was like a war criminal for ordering the atomic bombs, and it got me thinking. Her main point was something about how bombing civilian populations turns a country into a murderer rather than just a belligerent, and that the whole just war framework doesnt really save you if what you're doing is mass murder. I found it super convincing but also kinda intense, and then I started wondering how it applies to stuff that didnt exist when she was writing.

  Like, what do you think she'd say about modern drone strikes, especially the covert CIA kind where they kill specific named targets, sometimes even US citizens, and there's this thing called signature strikes where they kill people just based on their behavior patterns without even knowing who they are? Do you think she'd see a precise drone strike on a specific terrorist as more legitmate than the atomic bomb, since it's discriminate and doesnt kill thousands of civilians, or would she say the secret, extra-judicial way it's done makes it basically state sponsored murder no matter how precise it is? I'd love your take on how her war vs. murder distinction actually works out here, and I'm not sure she ever got to deal with any of this.
