  ### Relationship to Löb's Theorem and Gödel
  - **Löb's Theorem in GL**:  
    \(\square(\square \varphi \to \varphi) \to \square \varphi\) (all validities are provable).  
  - **Fitch vs. Löb**:  
    - **Similarity**: Both reveal limitations. Löb shows provability implies truth only for provable sentences; Fitch shows knowability implies knowledge only if all truths are known.  
    - **Difference**:  
      - Fitch’s result is a **conditional** (knowability \(\to\) omniscience), not a theorem.  
      - Löb’s is an **unconditional theorem** of GL.  
    - **Is Fitch Just Löb?**: **No**.  
      Löb governs self-referential provability; Fitch relies on factivity and knowability. The T axiom (crucial for Fitch) is antithetical to GL (due to Gödel).  
  - **Epistemic Residue**:  
    The paradox hinges on **factivity and the cognitive interpretation of knowability**. Provability logic lacks resources to express these, making the epistemic content **irreducible**. Gödel’s theorems constrain provability, but Fitch reveals an **epistemic tension** independent of formalism.

