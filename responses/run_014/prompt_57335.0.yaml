answer: |-
  Here is the poem, structured as requested:

  **The Standing Order**

  Six o'clock light on the water, flat and grey.  
  The captain points: that low smudge far ahead.  
  He speaks it calmly, just part of the day:  
  Keep the ship's heading fixed until landfall is made.  
  The crew nods. Wax is passed down the long line.  
  Fingers press it deep. The air tastes of pine.

  He stands straight against the mast, rope coiled neat.  
  "Tie it tight," he says. "No matter my cry."  
  The knots are made firm at his hands and feet.  
  Keep the ship's heading fixed until landfall is made.  
  He breathes easy. The shore grows. A thin sound  
  Begins, felt first in the teeth, not the ground.

  Now the singing lifts. Not melody, but need.  
  It claws at the air. His calm face is gone.  
  Eyes wild, he strains where the bindings bite deep.  
  Keep the ship's heading fixed until landfall is made.  
  His mouth works, shapes words they cannot receive.  
  They see pleading shoulders, but only believe

  The wax in their ears. They pull harder, blind  
  To the voice, only the order holds clear.  
  *Is it him or the song that fights the bind?*  
  Keep the ship's heading fixed until landfall is made.  
  They row past the rocks. They see his chest heave.  
  They obey the shape, not the sound, they perceive.

  Years later, a new ship, a new captain stands.  
  A younger mate points to a charted coast.  
  He quotes the old words with uncertain hands:  
  "Keep the ship's heading fixed until landfall is made."  
  The crew shifts; some mutter of reefs unseen,  
  Of currents that shift where the old shoals had been.

  The rope bound *action*, not the song in the air.  
  It held choices fast, not blocked a single word.  
  That autumn delay? A chance to prepare,  
  To count votes in calm, when the shouting is blurred.  
  Keep the ship's heading fixed until landfall is made.  
  It slows the turn, does not build a stockade.  
  We chose the distance. We set the delay.

  ---

  **Introduction Notes (Adapt for your speaking):**

  1.  **The Recurring Line:** "Keep the ship's heading fixed until landfall is made." It's one rigid command, unchanged throughout. Starts as the captain's clear order, ends as a debated rule quoted by a new crew.
  2.  **The Turn:** Listen for the *fifth* stanza. That's when a new sailor quotes the exact same line. That's the moment the "dead hand" objection hits – someone bound by a rule they didn't make, questioning if it still fits.
  3.  **Wax vs. Rope:** The poem shows the crucial difference. The wax *blocks sound* (like silencing debate). The rope *restrains action* (like requiring a higher vote and delay before changing the rule). Article XI is the rope, not the wax – it doesn't silence anyone, it just makes changing course harder and slower.
  4.  **The Claim for Delay:** The final stanza admits the rope isn't forever. But it argues that distance (the autumn) and the high vote (two-thirds) create vital space. They force us to be sure before turning, to debate in calm after the initial storm. We designed that pause deliberately.
