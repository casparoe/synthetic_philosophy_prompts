answer: |-
  Here's the breakdown as requested:

  ### What he got right
  Your roommate accurately describes the core empirical finding of the Knobe effect (also called the "side-effect effect"). Studies consistently show that people are significantly more likely to describe a foreseen negative side-effect (like harming the environment) as "intentional" compared to an identical foreseen positive side-effect (like helping the environment). He's also correct that this asymmetry is driven by moral evaluation – specifically, the desire to assign praise or blame based on the outcome's valence. The basic asymmetry itself is a robust and well-replicated finding in experimental philosophy/cog sci.

  ### What he stretched
  Your roommate makes a significant leap by concluding that *all* attributions of intentionality boil down *only* to the desire to blame (or praise), and that this renders philosophical analysis of "intention" merely post-hoc justification for gut moral reactions. This overgeneralizes the effect in several key ways. Firstly, the Knobe effect specifically highlights how **moral valence influences judgments about *foreseen side-effects***. It doesn't negate that for the *primary* goal of an action (e.g., the boss *intending* to increase profit), intentionality judgments are reliably based on standard factors like desire, belief, and skill, regardless of morality. Secondly, the effect doesn't show that blame/praise *creates* the concept of intention; it shows that moral evaluation powerfully *modulates* how we *apply* that concept in complex cases involving side-effects. Thirdly, his claim implies philosophers are *only* rationalizing gut feelings, ignoring that robust philosophical theories of intention (like Anscombe's or Bratman's) are built on analyzing a vast array of intentional actions, reasoning patterns, and conceptual connections far beyond this one effect. They strive for normative accounts of what intention *is* or *should be*, not just descriptive accounts of folk judgments. Finally, his dismissal doesn't account for the very point your robot example raises: in scenarios *without* a clear moral agent or morally charged outcome (like a robot foreseeing noise vs. lulling a baby), the Knobe asymmetry often **weakens or disappears**. This demonstrates that while moral evaluation *can* strongly influence intentionality judgments in specific contexts involving human agents and significant side-effects, it isn't the *sole* or *defining* factor of the concept "intentional" across all possible applications.

  ### So what for armchair philosophy
  The Knobe effect is a powerful challenge to purely *descriptive*, armchair accounts of folk concepts like "intention" that ignore the influence of moral judgment. It forces philosophers to engage with empirical data on how concepts are *actually used* and to refine their theories accordingly. However, it doesn't invalidate the armchair project of *normative* conceptual analysis – figuring out what intention *ought* to mean based on reason, coherence, and the role it plays in explaining action – but highlights the need to be aware of potential biases and the descriptive complexities revealed by experiments.
