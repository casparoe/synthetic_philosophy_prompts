  - Timer

  **Project Proposals (Trade-off: Speed vs. Reliability):**  
  *For software engineers, frame as system design choices:*
  - **Project Alpha**:  
    `Speed: 900 ms (avg response time)`  
    `Reliability: 92% (uptime)`  
  - **Project Beta**:  
    `Speed: 750 ms`  
    `Reliability: 85%`  
  - **Project Gamma**:  
    `Speed: 800 ms`  
    `Reliability: 97%`  

  **Rationale for Intransitivity:**  
  - Alpha vs. Beta: Beta’s speed advantage (150ms) > Alpha’s reliability edge (7%) → Many prefer Beta  
  - Beta vs. Gamma: Gamma’s reliability jump (12%) > Beta’s speed edge (50ms) → Many prefer Gamma  
  - Gamma vs. Alpha: Alpha’s speed gain (100ms) > Gamma’s reliability loss (5%) → Many prefer Alpha  
  *Cycle: Beta > Alpha, Gamma > Beta, Alpha > Gamma*  

  **Initial Instructions to Participants (0–5 min):**  
  *"We're simulating a tech startup portfolio market. Each of you will:  
  1. Receive one random project (A/B/C) and 100 tokens.  
  2. State your preferences between project pairs.  
  3. Trade projects with me (the market maker) to optimize your portfolio.  
  Your goal: Maximize tokens. Trades cost a 1-token fee. I’ll approach you with offers."*  

  **Preference Elicitation (5–15 min):**  
  - Participants privately answer:  
    *"If you could only hold ONE, which would you choose?"*  
    ▶ Alpha vs. Beta: ______  
    ▶ Beta vs. Gamma: ______  
    ▶ Gamma vs. Alpha: ______  
  - Collect responses. Identify cyclic participants (Beta>Alpha, Gamma>Beta, Alpha>Gamma).

  ---

  #### (2) Market Phase Rules (15–45 min)
  **Trading Protocol:**  
  - Each trade: Swap current project for another + pay 1 token fee to market maker.  
  - Market maker (you) approaches participants in fixed order (e.g., by seat number).  
  - **Offer logic**:  
    - If participant holds **Alpha** and prefers **Beta > Alpha** → Offer: *"Swap Alpha for Beta for 1 token?"*  
    - If holds **Beta** and prefers **Gamma > Beta** → Offer: *"Swap Beta for Gamma for 1 token?"*  
    - If holds **Gamma** and prefers **Alpha > Gamma** → Offer: *"Swap Gamma for Alpha for 1 token?"*  
  - Non-cyclic participants: Offer one beneficial trade (if any) to their stated "top choice," then stop.  
  - Cyclic participants: Offer trades in cycle order *every time* they’re approached.  

  **What to Say When Questioned:**  
  *"I’m offering trades based on your stated preferences earlier. Accepting is optional, but remember: tokens determine your final score."*  
  *(If pressed: "My algorithm matches trades to preferences.")*  

  **Incentive Structure:**  
  - Cyclic participants lose 3 tokens/cycle (Alpha→Beta→Gamma→Alpha).  
  - After 5 full cycles: ~15 tokens lost (15% of start).  
  - Non-cyclic lose ≤1 token (if they trade once to their top choice).  

  ---

  #### (3) Timeline (90 min total)
  - **0–5 min**: Intro + project assignment  
  - **5–15 min**: Preference elicitation  
  - **15–45 min**: **Market Phase** (6 rounds; 5 min/round)  
    - *Each round*: Market maker completes one full circuit of the room.  
  - **45–55 min**: Calculate final tokens. Show leaderboard.  
  - **55–80 min**: Debrief (script below)  
  - **80–90 min**: Q&A + conclusions  

  ---

  #### (4) Debrief Script
  **Step 1: Data Harvesting (55–60 min)**  
  *"Raise your hand if you lost >10 tokens. Now, share your preferences if you’re comfortable."*  
  → Plot preferences on board:  
  ```
  Participant 7: Beta > Alpha, Gamma > Beta, Alpha > Gamma → CYCLE  
  Participant 3: Alpha > Beta, Beta > Gamma → TRANSITIVE (Alpha top)  
  ```  
  *"Notice: Cyclic traders lost tokens; transitive traders didn’t."*  

  **Step 2: Name the Phenomenon (60–65 min)**  
  *"What happened to cyclic participants? They traded Alpha for Beta, then Beta for Gamma, then Gamma for Alpha... back to start, minus tokens. This is called a **money pump**."*  
  *(Write "MONEY PUMP" on board)*  

  **Step 3: Philosophical Architecture (65–75 min)**  
  - **Synchronic vs. Diachronic**:  
    *"Each trade was rational *at that moment* (you got a ‘better’ project). But *over time*, you were exploited. Synchronic preferences ≠ diachronic rationality."*  
  - **Vulnerability from Intransitivity**:  
    *"Transitivity isn’t math pedantry—it’s armor. Intransitivity lets a trader who knows your prefs drain you. The pump works because you evaluate pairs *myopically*."*  
  - **Foresight Response**:  
    *"Some of you stopped trading mid-cycle. Wise! But now you’re stuck with Beta while preferring Alpha. With intransitivity, *any* choice leaves you envying another option."*  
  - **Normative Conclusion**:  
    *"We should refine intransitive preferences. If you refuse to trade, you’re leaving value on the table. If you trade, you’re pumped. Transitivity avoids this trap."*  

  **Step 4: Relate to Broader DT (75–80 min)**  
  *"In decision theory, money pumps show that *dynamic consistency* requires transitivity. Real-world examples: stock traders exploiting retail investors, or addictive behaviors (e.g., ‘one more scroll’ loops)."*  

  ---

  #### (5) Predictable Problems & Solutions
  **Problem 1: Suspicious participants refuse trades.**  
  - *In moment*: *"You’re free to decline, but your preferences suggest this trade benefits you."*  
  - *In debrief*: Highlight this as the "foresight response." Note: Suspicion stops exploitation but admits the vulnerability.  

  **Problem 2: Participants revise preferences mid-game.**  
  - *In moment*: *"Stick to your initial preferences—real traders wouldn’t let you backtrack!"*  
  - *In debrief*: *"Revising prefs when you spot the cycle? That’s the point! Intransitivity is unstable under reflection."*  

  **Problem 3: No intransitivity in some participants.**  
  - *In debrief*: Contrast token balances. *"Non-pumped participants had transitive preferences. Their choices are ‘exploit-proof’—this is the goal."*  

  **Problem 4: Participants try to arbitrage the market maker.**  
  - *In moment*: *"I only accept tokens for trades, not projects. No reselling!"*  
  - *In debrief*: *"Attempts to ‘beat the market’? Clever! But in standard pumps, the exploiter doesn’t trade back—they’re an infinite sink."*  

  ---

  #### (6) Philosophical Gap & Bridge
  **The Gap:** The activity assumes the market maker is an *external exploiter*. Real money pumps can be *self-inflicted* (e.g., inconsistent choices without a trader).  

  **How to Bridge in Debrief:**  
  *"In this game, I extracted value. But imagine *you* are alone with these projects. If you pay a ‘mental transaction cost’ (e.g., time, regret) each time you rethink your choice, you’d pump yourself. Transitivity prevents this internal drain too."*  
  → **Key point**: The vulnerability exists even without an exploiter.
