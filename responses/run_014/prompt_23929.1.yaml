  First, I need to identify the core tension: persistence through material change versus value placed on original matter. The conservation norms are clear - partial replacements are acceptable while maintaining identity, yet original material carries special significance. 

  For question 1, the practice clearly doesn't treat the statue as identical to the original matter, since matter gets replaced while identity persists. But it also doesn't treat it as a purely formal object, since original matter retains value. This suggests a constitution view where the statue is a distinct object constituted by but not identical to the matter.

  Question 2's tension is key. The implicit theory must reconcile material replacement with original matter's value. I see it as a "chain of constitution" model: each material stage constitutes the enduring statue, but the original matter has privileged status as the initial physical link to the artist's act. This isn't logically incoherent if we separate identity conditions from value conditions.

  For the scenarios in question 3:
  (a) Arm replacement is standard practice - handled easily
  (b) Melting and recasting would likely be seen as destruction and recreation, not persistence
  (c) Disassembly/reassembly (anastylosis) should be acceptable if all original parts are retained

  Question 4 requires separating strict presuppositions from compatible theories. The practice strictly requires that identity isn't tied to specific matter, but is compatible with various persistence conditions (e.g., functional continuity vs. causal history). 

  Finally, for question 5, alternative metaphysical bases would radically change practice:
  (i) If statue=original matter, any replacement would create a new object requiring new labeling
  (ii) If statue=pure form, replacements could be seamless and original material's value would diminish

  Throughout, I'll note where philosophical disagreements might occur (e.g., whether anastylosis preserves identity, or how to value reassembled objects with replaced parts). The challenge is maintaining precision while avoiding academic jargon.
answer: |-
  Your inquiry dissects a profound interplay between metaphysical commitments and institutional practice. I'll reconstruct the implicit metaphysics step by step, marking conceptual judgments clearly. The conservation practice described presupposes a **constitution theory with historical privileging**, distinct from both mereological essentialism and pure formalism.

  ### 1. Presupposed Theory of Material Constitution
  - **Statue ≠ Lump**: Conservation practice treats the statue as a *distinct object* constituted by, but not identical to, the original matter. Replacing parts while preserving identity shows that the statue can survive *some* material change.  
  - **Persistence Conditions**: Identity requires *causal-historical continuity* and *formal/functional integrity*, not material continuity per se. There is "slack" in material composition, but it is bounded (as per the intuition of replacement limits).  
  - **Key Commitment**: The statue is a *historically grounded artifact* whose identity depends on its causal origin (the artist's creative act) and ongoing structural role, not its matter alone.  

  *Conceptual Judgment*: This rejects mereological essentialism (statue=original matter) but also rejects radical anti-realism about artifacts. A reasonable philosopher could argue this is inconsistent slack, but practice shows it's a *fuzzy boundary with normative force*.

  ### 2. Reconciling Persistence and Authenticity Value
  - **Implicit Reconciliation**: Original matter is privileged as the *initial physical realization* of the artist's intention. It bears unique causal-historical weight as the "first embodiment."  
  - **Coherence**: This is coherent as a hybrid theory:  
    - Identity is maintained via *constitutional succession* (new matter comes to constitute the same statue under institutional and art-historical practices).  
    - Authenticity value attaches to *provenance*: Original matter is a direct *trace* of the creative act. Like a saint’s relic, its value is historical-indexical ("*this* clay was touched by Rodin"), not essential for identity.  
    - **Tension Resolved**: The statue persists *numerically* through replacement (identity isn’t material), but its *authenticity* (a value property) diminishes as original matter decreases.  

  *Disagreement Note*: Purists might argue authenticity *constitutes* identity, but practice decouples them. The reconciliation is pragmatic, not logically airtight.

  ### 3. Application to Scenarios
  - **(a) Arm replaced with resin**:  
    - **Practice**: Acceptable. Labeled as "5th c. BCE Greek statue, arm restored 2023." Original parts visually distinguished.  
    - **Theory Handling**: Successful. Constitution persists via formal/causal continuity. Authenticity value decreases slightly but remains.
    
  - **(b) Melted down and recast**:  
    - **Practice**: *Not* accepted as the same statue. Likely labeled "20th c. reproduction after original."  
    - **Theory Handling**: Constitution broken. No causal continuity; the original creative act is not "carried forward." Pure matter reuse without formal continuity is resetting identity.  

  - **(c) Disassembled/reassembled (anastylosis)**:  
    - **Practice**: Accepted as original (e.g., ancient temples). Labeled with original date.  
    - **Theory Handling**: Successful. All original parts retained; reassembly restores functional/form continuity. Authenticity remains high.  

  *Conceptual Judgment*: (b) tests the causal-historical requirement. Practice implies *no temporal gap* and *no total matter reset* are crucial.

  ### 4. Presuppositions vs. Compatibility
  - **Strict Presuppositions** (practice nonsensical without):  
    - Statues are *mind-dependent artifacts* (not natural kinds).  
    - Identity requires *unbroken institutional/causal lineage* from creation.  
    - Material continuity is *not necessary* for persistence.  
  - **Compatible but Not Required**:  
    - Four-dimensionalism (statue as spacetime worm).  
    - Hylomorphic theory (statue as compound of form + matter).  
    - Conventionalism about persistence conditions.  
  - **Underdetermination**: These rival theories license identical practice:  
    - **Constitution Theory** (Baker): Original matter constitutes statue; replacement is new constitution.  
    - **Sortal-Relative Identity**: Statue persists under "artwork" but not "material aggregate" sortal.  
    - **Causal-Historical Theories**: Focus on uninterrupted chain of conservation intentionality.  

  *Key Point*: All must accommodate *gradual replacement without identity death* and *privileged original matter*.

  ### 5. Alternative Foundations: Changed Practices
  - **(i) Statue = Original Matter** (Mereological Essentialism):  
    - Replacements create new objects.  
    - **Changes**:  
      - Any replaced part requires relabeling (e.g., "Fragment of 5th c. statue; restored arm 2023").  
      - No display as a unified whole post-replacement.  
      - Distinguishing replacements irrelevant (new object already).  
      - Dating would split (original part dates vs. restoration dates).  

  - **(ii) Statue = Pure Form/Pattern**:  
    - Matter is incidental; identity is formal.  
    - **Changes**:  
      - Replacements need *no visual distinction* (form is preserved).  
      - Original matter loses special value; "authenticity" shifts to formal fidelity.  
      - Dating could include major restorations (e.g., "Form designed 5th c. BCE; material instance 2023").  
      - Melting/recasting (scenario b) *might* preserve identity if form is identical.  

  *Philosophical Risk*: (i) makes conservation incoherent (repair = destruction). (ii) erases the "aura" of original material, conflicting with artworld values.

  ---

  **Conclusion**: Conservation practice rests on a *moderate realism* about artifacts: statues persist through "controlled" matter replacement while grounding authenticity in historical particularity. The metaphysics is broadly Aristotelian (hylomorphic leanings) but deeply conventionalist in its tolerance thresholds. It navigates the statue/lump problem by treating the statue as a *persistent cultural entity* constituted by matter but resilient to its changes. The unresolved tension—how much replacement is "too much"—reflects metaphysics in practice: a boundary negotiated by tradition, not logic. A philosopher might demand sharper principles, but the museum’s implicit theory functions precisely *because* its vagueness mirrors our relational stance toward artifacts.
