prompt: |-
  So I'm TAing our department's formal epistemology discussion section this term, about 16 second- and third-year undergrads, and we've got 75 minutes next Thursday. They just did the unit on accuracy-first epistemology where the whole point is that beliefs should minimize expected inaccuracy and that gives you norms like probabilism, but to them it just sounds like mathy hand-waving and my roommate and I were arguing about whether anyone would actually feel why having like 0.7 credence in both a claim and its negation is probly a bad idea if all you care about is getting close to the truth.

  Could you design a runnable in-class game that makes them feel that dominance idea from the inside, without lecturing or naming it upfront? Like have small teams pick credences in two linked claims, say the campus shuttle will be late tomorrow and the shuttle will be more than ten minutes late tomorrow, score them with something simple like start at 100 points and subtract squared distance from the truth-values once we reveal what happened, use poker chips or candy for stakes, and let them discover on their own that some pairs of guesses are guaranteed worse no matter what happens. I need rules, materials, timing across the 75 minutes, and a payoff that works without real money.

  Then give me a debrief script that maps what happened back onto expected inaccuracy and coherence, tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which part of the accuracy-first picture the game can't reproduce and I'll have to just explain. Please answer in American English, keep it concrete and untill the debrief don't use jargon like proper scoring rule.
reasoning: |-
  Okay, the user is a teaching assistant for a formal epistemology discussion section with about 16 undergrads. They've just covered accuracy-first epistemology, but the students aren't connecting the math to why incoherent credences are problematic. The TA wants a game to make the concept tangible without upfront jargon. 

  Hmm, the core challenge is making abstract dominance arguments visceral. Students need to feel why having 0.7 credence in both P and not-P is self-sabotage when truth-seeking is the goal. Poker chips and candy stakes could work—concrete rewards beat hypotheticals. 

  The shuttle example is smart: P = "late", Q = ">10 min late" naturally links to coherence (since Q implies P). But I should flag that Q isn't just P's negation—that’ll matter in debrief. 

  *Game structure idea*:  
  - Teams of 2, 8 groups total.  
  - Two claims: Shuttle Late (P), Very Late (Q).  
  - Each team submits credences as decimals for both.  
  - Truth revealed via pre-recorded shuttle tracker screenshot (avoid real-time chaos).  
  - Scoring: Start with 100 points, subtract (1 - credence)^2 if true, credence^2 if false. Brier score simplified.  
  - Play 3 rounds: first unguided, second after seeing others' scores, third with "insider tip" that dominance exists.  

  *Predictable snags*:  
  - Groups might spread credences thin (e.g., P=0.5, Q=0.5) and accidentally score okay. Need extreme truth cases to punish this.  
  - Some may treat it like betting, not accuracy. Debrief must emphasize: "This is about closeness to truth, not gambling."  
  - Q’s dependency on P might confuse. Clarify scoring with examples before starting.  

  *Debrief script keys*:  
  1. Show winning teams likely had P ≥ Q and avoided P+not-P >1.  
  2. Map to coherence: "Why did Susie’s P=0.3, not-P=0.8 always lose? Let’s plot it…"  
  3. Confess the simplification: Real expected inaccuracy uses probabilities of outcomes, not just actual outcomes. But the game shows guaranteed loss—that’s the hook.  

  *Materials*: Just paper, poker chips, candy jar. Keep it lean—department budgets are tight. 

  *Timing*:  
  - Intro (10 min)  
  - 3 rounds × 15 min = 45 min  
  - Debrief (20 min)  

  The gap? The game proves dominance but not why probabilism follows from *expectations*. That’s lecture territory. Still, the visceral "aha" moment is worth it.
answer: |-
  Here’s a complete, jargon-free game plan for your 75-minute section—**"The Shuttle Credence Challenge"**—using candy stakes and designed to make incoherent credences *feel* self-destructive. Students will discover dominance through play.

  ---

  ### **Game Setup**  
  **Materials Needed**:  
  - 8 sets of red/blue poker chips (4 red + 4 blue per set)  
  - Whiteboard + markers  
  - Jar of candy (e.g., Starburst, 1 piece = 1 point)  
  - Pre-made "Shuttle Tracker" screenshot (revealed mid-game)  
  - Printed scorecards (one per team):  

  | Round | Your P credence | Your Q credence | Score | Total |  
  |-------|-----------------|-----------------|-------|-------|  
  | 1     | \_\_\_          | \_\_\_          | \_\_\_ | \_\_\_ |  
  | 2     | \_\_\_          | \_\_\_          | \_\_\_ | \_\_\_ |  
  | 3     | \_\_\_          | \_\_\_          | \_\_\_ | \_\_\_ |  

  **Claims** (write on board):  
  - **P**: "Shuttle arrives >2 min late tomorrow"  
  - **Q**: "Shuttle arrives >10 min late tomorrow"  

  *(Note: Q implies P, but don’t highlight this yet.)*  

  **Teams**: 8 teams of 2 students each.  

  ---

  ### **Rules & Scoring**  
  1. **Goal**: Get as close to the truth as possible. You start with **100 points** each round.  
  2. **Submit**: Each team picks credences for **P** and **Q** (0 to 1, decimals ok).  
     - *Example*: P=0.8, Q=0.3 means "we’re 80% sure it’s late, 30% sure it’s *very* late."  
  3. **Truth Reveal**: Show a "Shuttle Tracker" screenshot (pre-made) with outcomes:  
     - **Round 1**: P=True, Q=False  
     - **Round 2**: P=False, Q=False  
     - **Round 3**: P=True, Q=True  
  4. **Scoring**:  
     - Lose points based on "how wrong" your credences were.  
     - **If TRUE**: Lose (1 - credence)² × 100 points  
       - *Example*: If P=True and you said P=0.8, lose (1-0.8)² × 100 = 4 points.  
     - **If FALSE**: Lose (credence)² × 100 points  
       - *Example*: If Q=False and you said Q=0.3, lose (0.3)² × 100 = 9 points.  
  5. **Points → Candy**: Total points across 3 rounds = pieces of candy. 1st place gets extra 5 pieces.  

  ---

  ### **Timeline (75 min)**  
  - **0:00–0:10** - Intro & Rules:  
    > "You’re shuttle predictors! Pick how confident you are in P and Q. We’ll see what *actually* happened tomorrow (wink) and score you on closeness to truth. Closer guesses = fewer points lost = more candy. Play 3 rounds."  
    Demo scoring with examples (e.g., "If P is true and you said 0.9, you lose 1 point. If you said 0.4, you lose 36 points!").  

  - **0:10–0:25** - **Round 1**: Teams submit P/Q credences. Reveal **P=True, Q=False**. Teams calculate scores.  

  - **0:25–0:40** - **Round 2**: Teams see others’ scores (post team totals anonymously). Reveal **P=False, Q=False**.  

  - **0:40–0:55** - **Round 3**: Whisper: *"Psst... some strategies always lose more points, no matter what happens."* Reveal **P=True, Q=True**.  

  - **0:55–1:05** - Scoring & Candy: Tally totals, award candy.  

  - **1:05–1:15** - Debrief (script below).  

  ---

  ### **Predictable Problems & Fixes**  
  - 🚨 **"Why squared loss?"** → Avoid math. Say: *"Bigger mistakes hurt more. If you’re 90% wrong, you lose more than if you’re 10% wrong."*  
  - 🚨 **Students pick 0.5 for everything** → After Round 1, show a team with P=0.7/Q=0.7 lost heavy points when Q=False (lost 49 points for Q alone!).  
  - 🚨 **"Q implies P, so shouldn’t P always be higher?"** → Praise the insight! But clarify the game is about *incoherence* (P + not-P >1), not dependencies.  
  - 🚨 **One team dominates early** → Use anonymous scoring to keep others engaged.  

  ---

  ### **Debrief Script (10 min)**  
  > "Great job! Let’s see why some teams crushed it..."  
  > *(Plot credences on board: X=P, Y=Q. Mark teams’ choices)*  
  > **Q1:** "Team 3, in Round 1 you picked P=0.3, Q=0.8. When P was true and Q false, you lost 36 + 64 = 100 points! What happened?"  
  > *[Let them react: "We were way too sure about Q!"].*  
  > **Q2:** "Now look at Team 5: P=0.7, Q=0.2. They lost only 9 + 4 = 13 points. Why beat Team 3 by 87 points?"  
  > *[Key: Highlight that 0.3 + 0.8 = 1.1 > 1]*  
  > **Q3:** "What if P and Q were both false? Team 3 would lose (0.3)² + (0.8)² = 73 points. Team 5? (0.7)² + (0.2)² = 53 points. Still worse!"  
  > **The Punchline**:  
  > "Some choices *guarantee* you’ll lose more points—no matter the truth. If your ‘late’ + ‘not late’ confidence adds to more than 100%, you’re setting yourself up to fail. That’s not mathy hand-waving; it’s a trap!"  
  > **Connect to Class**:  
  > "Remember ‘accuracy-first’? This is why coherence matters. If your beliefs aren’t probabilities (like P + not-P > 1), you’re *dominated*—there’s always a better set of guesses. You just felt it!"  

  ---

  ### **What the Game CAN’T Teach (Just Explain This)**  
  > "One caveat: In real life, we minimize *expected* inaccuracy *before* knowing the truth. Today we saw actual outcomes, but the deeper lesson holds: incoherent credences have higher *expected* loss too. That’s the math behind your gut feeling!"  

  This requires zero jargon, uses $5 of candy, and makes dominance visceral. Students will argue Q implies P—**lean into it**. That’s how they internalize coherence. Run it verbatim, and you’ll see lightbulbs 💡.
