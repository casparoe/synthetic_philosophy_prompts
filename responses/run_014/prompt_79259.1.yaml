answer: |-
  ### Mapping Escalation Concepts to Poker Vocabulary  
  Poker theory *should* make you immune to escalation errors via concepts like pot odds. But human psychology often overrides this. Below, I break down the key escalation ideas through poker's lens, highlighting where the mapping works, where it's strained, and what poker can't explain.  

  #### Translation Table  
  | poker_term      | escalation_idea                                      | fit     | rationality_verdict | residue                                                                 |
  |-----------------|------------------------------------------------------|---------|---------------------|-------------------------------------------------------------------------|
  | **Pot Odds**    | *Rational cost/benefit for continuing investment.* Ignores past losses; only weighs current call vs. potential win. | Clean   | Reasonable          | Escalation often ignores pot odds entirely (e.g., dollar auction bids exceed the prize). |
  | **Tilt**        | *Emotional response to losses driving irrational escalation.* Chasing to "get even" or avoid admitting defeat. | Clean   | Mistake             | Tilt explains psychological urgency, not structural traps like the dollar auction. |
  | **Pot Commitment** | *"Priced in" to call due to future actions,* not past bets. If folding costs more EV than calling, you're committed. | Forced  | Reasonable          | Often misapplied to justify sunk costs ("I’m pot-committed" when you’re not). |
  | **Chasing**     | *Investing more to avoid realizing a loss,* e.g., calling with weak draws due to loss aversion. | Clean   | Mistake             | Chasing can be rational with implied odds; irrational when odds are poor. |
  | **Implied Odds**| *Future gains justifying current losses.* E.g., calling a bad bet expecting to extract value later if you hit. | Forced  | Reasonable          | Only applies to probabilistic wins; no equivalent in deterministic traps like the dollar auction. |
  | **Bankroll Management** | *Avoiding ruin by quitting losers.* Walking away when variance or losses threaten your stake. | Clean   | Reasonable          | Escalation often ignores bankroll limits (e.g., "throwing good money after bad"). |
  | **Variance**    | *Short-term losses masking long-term EV.* Sticking with +EV plays despite downswings. | None    | Reasonable          | Escalation (e.g., dollar auction) has no variance—losses are guaranteed past $1 bids. |
  | **None**        | *Structural traps forcing losses on 2nd place* (e.g., dollar auction’s runner-up pays). | None    | Mistake             | Poker has no equivalent; folding always limits losses to sunk costs. |  

  #### Key Insights from the Mapping  
  1. **Poker Theory vs. Human Psychology**:  
     - Pot odds explicitly **reject sunk costs**: Only future investment vs. future gains matter. If you need 25% equity to call a $50 bet into a $150 pot, it doesn’t matter if you’ve already put $500 in the pot.  
     - **Why players escalate anyway**: Tilt and loss aversion override math. E.g., "I’ve put $200 in this pot, I *have* to call!" mirrors the dollar auction’s "I’ve bid $0.90, I *have* to bid $1.10 to avoid losing my $0.90."  

  2. **What Poker Misses**:  
     - **Structural traps**: In poker, folding caps losses. In the dollar auction, *both* top bidders lose money, creating a game-theoretic trap with no poker equivalent.  
     - **Social pressure**: Poker’s vocabulary doesn’t capture "face-saving" escalation (e.g., bidding to avoid looking weak). Tilt gets close but is more emotional than social.  

  3. **The Rationality Divide**:  
     - **Poker is right**: Escalation *is* a mistake when it violates pot odds. If you call a bet without the correct equity, you’re burning money.  
     - **Escalation literature adds nuance**: Loss aversion (a core driver of escalation) isn’t in poker’s lexicon. It explains *why* people override pot odds—e.g., the pain of losing $100 feels worse than the joy of winning $100.  

  **bottom_line**: Poker theory correctly dismisses sunk costs via pot odds, but misses the psychological/structural drivers of escalation that tilt and loss aversion exploit.
