  We are going to map concepts from the escalation literature (like the dollar auction) to poker concepts.
   The user wants to understand the escalation of commitment (sunk cost fallacy, etc.) in poker terms.

   Steps:
   1. We note that in poker, the sunk cost fallacy is often addressed by the concept of pot odds and the idea that money in the pot is dead.
   2. However, the escalation in the dollar auction and similar situations seems to contradict that cold rationality.

   Let's break down the main ideas in escalation and map them to poker:

   Common escalation ideas:
     - Sunk cost fallacy: Continuing an endeavor because of previously invested resources (time, money, effort).
     - Competitive escalation: In auctions or bidding wars, the desire to win or avoid loss can drive overbidding.
     - Loss aversion: People prefer avoiding losses to acquiring equivalent gains (losing $100 feels worse than gaining $100 feels good).

   Poker concepts we'll use:
     - Pot odds: The ratio of the current size of the pot to the cost of a contemplated call. It tells you the required win probability to break even.
     - Pot commitment: When a player has invested so much that folding would be a bigger mistake than calling even with marginal odds (but note: this should be based on future action, not past investment).
     - Being priced in: Similar to pot commitment, when the pot odds are so favorable that you must call even with a weak hand.
     - Implied odds: The potential future bets you can win if you hit your hand, beyond the current pot.
     - Chasing: Continuing to play a hand that is currently behind in hopes of improving (e.g., drawing to a flush).
     - Tilt: Emotional frustration leading to poor decision-making.
     - Bankroll: The total amount of money a player has set aside for poker.
     - Variance: The statistical measure of how results can vary from expected value in the short term.

   Now, let's map:

   Idea 1: Sunk cost fallacy in the dollar auction -> In poker, this might be seen when a player calls a bet because they've already put a lot of money in the pot (even when the pot odds don't justify it).

     Poker term: Pot commitment (but note: pot commitment is often misused to justify sunk cost fallacy, while it should only be about future bets and fold equity).

     However, in poker, the correct concept is that you should base your decision on the current pot and the cost to call (pot odds) and future bets (implied odds). The sunk cost should not factor in.

     But sometimes players mistakenly think of the money they put in as "their" money and feel they must see the hand through. This is the fallacy.

   Idea 2: Competitive escalation (in auctions, two bidders driving the price up) -> In poker, this might occur in a heads-up pot where both players are determined to win and keep raising each other, even when one or both have weak hands.

     Poker term: Tilt (if driven by emotion) or perhaps "overplaying" a hand.

     But note: in poker, sometimes aggressive plays are correct (e.g., bluffing, value betting). However, if driven by the desire to win at all costs, it becomes irrational.

   Idea 3: Loss aversion -> In poker, this might manifest as being overly cautious to avoid a loss (e.g., folding too often when facing a bet) or conversely, being unable to fold because the loss would be too painful (leading to chasing).

     Poker term: Chasing (when you are trying to avoid a loss by hitting a draw even when the odds aren't there) or tight play (for the cautious side).

     Also, bankroll considerations: a player with a small bankroll might be more loss averse and play too tight.

   Now, the user's specific confusion: poker teaches that sunk costs are irrelevant (only future costs and gains matter), but in escalation people seem to be driven by sunk costs.

   Resolution:
     - In theory, poker players should be making decisions based on expected value (EV) which considers only future actions and the current pot (which is now up for grabs, not a sunk cost?).
     - However, note that the pot is a collective sunk cost. The money you put in is gone, but the entire pot is now the prize. So the pot size is relevant because it is the prize you are fighting for.

     The dollar auction is different: both the winner and the runner-up pay. In poker, the runner-up (the one who folds) only loses what they put in (and doesn't get the pot). But the auction has two losers: the winner pays more than the dollar and the runner-up pays their bid and gets nothing.

     The key difference: in poker, when you fold, you lose only what you have already put in (and you don't have to pay more). In the dollar auction, the runner-up must pay their bid even if they lose. That creates a trap: once you are the second-highest bidder, you have an incentive to bid again to avoid losing your bid without winning the dollar.

     How to map that to poker? It's not exactly the same because in poker you can fold and avoid further losses. But consider a hand where you have put in a lot of money and are facing an all-in. If you fold, you lose your investment. If you call, you might win the pot. The pot odds tell you the break-even probability. However, note that the money you put in is gone regardless. So the decision should be based on the additional money you have to put in versus the total pot you stand to win (including the money you already put in, because if you win you get it back plus the opponents' money).

     But wait: that's exactly pot odds. So why do people make the mistake? Because they feel the pain of the loss of the money they put in and think that by calling they are saving that investment. But in reality, that money is gone. The call is a new decision: put in X to win a pot of Y. The sunk cost should not factor.

     However, there is a concept in poker that is similar to the dollar auction: the pot is so big relative to the bet you have to call that you are "priced in". But that's rational if the pot odds are favorable. The mistake is when the pot odds are unfavorable but you call anyway because of the money you put in.

     The escalation in the dollar auction is irrational because the winner ends up paying more than the dollar is worth, and the runner-up loses their bid. In poker, if you call a bet when the pot odds don't justify it, that's a mistake. But note: sometimes in poker, you might call even when the immediate odds are bad because of implied odds (future bets). The dollar auction doesn't have that.

     So, the poker vocabulary does capture the idea that sunk costs are irrelevant (via pot odds and expected value). The escalation in the dollar auction is a mistake that poker theory explicitly warns against.

     But why do poker players still fall into the same trap? Because of psychological factors (tilt, loss aversion) that override rational calculation.

     Therefore, we can map:

     - Sunk cost fallacy -> Mistakenly treating the money you put in as a reason to call even when pot odds are bad. This is a form of tilt (emotional) or a misunderstanding of pot commitment.

     - Dollar auction style escalation -> In poker, it's rare because you can fold and avoid additional payment. But consider a multi-way pot where two players are in a raising war and both end up with losing hands? That's more about misjudging hand strength and pot odds. However, there is a concept in tournament poker: the "bubble" or pay jumps, where players might be forced to play suboptimally to avoid being the next one eliminated. But that's a different kind of escalation.

