prompt: |-
  Analyze the UK's 2016 referendum on EU membership as a test case for the boundary problem in democratic theory: who should have composed the demos for a decision of this kind? The referendum used the ordinary parliamentary franchise -- British, Irish, and qualifying Commonwealth citizens aged 18 and over resident in the UK, plus British citizens who had lived abroad for under fifteen years. Other long-term resident EU nationals could not vote, nor could sixteen- and seventeen-year-olds, though both groups could vote in Scotland's 2014 independence referendum. Gibraltar alone among Britain's overseas territories took part, because it alone lay inside the EU. Apply the all-affected-interests principle and the all-subjected (or coercion) principle in turn: say concretely who each would enfranchise, and where each diverges from the rules actually used and from the other. Then give an honest verdict: does either principle deliver a non-arbitrary answer here, or does the case instead confirm that any procedure for fixing the boundary already presupposes an answer to who belongs -- a circularity no actual electoral design can escape?
reasoning: |-
  Okay, let's tackle this user's query about the Brexit referendum as a test case for democratic boundary problems. First, I need to recall the key theoretical principles: the all-affected interests principle and the all-subjected principle. The user wants a concrete application to the 2016 referendum, comparing both principles against the actual franchise used. 

  Hmm, the user mentions specific groups excluded in the referendum but included in Scotland's 2014 vote—like 16-year-olds and EU nationals. That's crucial. Also, Gibraltar's inclusion because it's in the EU. I should map each principle to these groups systematically. 

  For the all-affected principle, anyone impacted by Brexit should vote. That's broad—EU residents in the UK, UK citizens abroad long-term, even other EU countries' citizens. But the user notes this gets messy. How far does "affected" stretch? Does it include French farmers? That's the problem with this principle: over-inclusiveness. 

  Then the all-subjected principle: only those under the UK state's authority. That's narrower—resident citizens and maybe some territories like Gibraltar. But it excludes EU nationals in the UK and young people, even though they're subject to UK laws. The actual franchise was close to this, but not quite (e.g., Commonwealth citizens could vote). 

  Wait, the circularity question is the real kicker. The user is hinting that no principle escapes arbitrariness. For example, defining "affected" or "subjected" already assumes who counts. Gibraltar included due to EU membership? That's a political choice, not a neutral rule. 

  The user might be skeptical of both principles. They want an honest verdict, not just theory. So I should acknowledge that while the principles highlight flaws in the actual rules, neither is perfect. The all-affected is too vague; all-subjected is cleaner but still excludes impacted groups. 

  Also, the user's deeper need might be understanding if democracy can solve boundary issues without bias. The answer? Probably not. The referendum shows boundary-setting is always political. Scotland's different rules prove context matters. 

  I’ll structure this by first explaining each principle's application, then contrasting them and the actual rules. Finally, confront the circularity problem head-on. Admit that principles help critique but can't resolve the arbitrariness—because defining the demos is inherently a first-order democratic conflict.
answer: |-
  The 2016 Brexit referendum serves as a powerful case study for the "boundary problem" in democratic theory – the challenge of defining *who* constitutes the legitimate demos for a specific decision. Applying the two major principles reveals significant tensions and limitations:

  **1. All-Affected Interests Principle:**  
  *   **Core Idea:** Everyone whose interests are significantly affected by a decision should have a vote.
  *   **Concrete Franchise for Brexit:**  
      *   **Included:**  
          *   UK residents (as per actual franchise).  
          *   UK citizens resident in other EU states (affected by loss of free movement/residency rights).  
          *   **Long-term resident EU nationals in the UK** (profoundly affected by residency rights, employment, family life).  
          *   **16- and 17-year-olds in the UK** (facing lifetime consequences).  
          *   **Residents of Gibraltar** (included in actual vote, correctly under this principle).  
          *   Potentially **citizens of other EU member states** (affected economically, politically, and in areas like security cooperation).  
          *   Potentially **UK citizens resident long-term *outside* the EU** (affected by global UK influence, consular services, travel rules).  
      *   **Divergence from Actual Rules:**  
          *   Explicitly includes long-term resident EU nationals and 16/17-year-olds.  
          *   *May* include citizens of other EU states and UK citizens abroad beyond 15 years, significantly expanding the franchise beyond the parliamentary model.  
      *   **Problems:**  
          *   **Over-inclusiveness/Unworkability:** Where does "significantly affected" end? French farmers reliant on UK trade? Global financial markets? Defining a threshold is inherently contestable and arbitrary.  
          *   **Intensity vs. Franchise:** It grants equal votes to those mildly affected (e.g., an Irish citizen minimally impacted by trade shifts) and those devastated (e.g., a Spanish national losing UK residency).  
          *   **Knowledge Gap:** Many "affected" individuals (e.g., citizens of other EU states) lack detailed knowledge of UK politics necessary for an informed vote.

  **2. All-Subjected/Coercion Principle:**  
  *   **Core Idea:** Everyone subject to the binding laws and coercive power of the political entity making the decision should have a vote.
  *   **Concrete Franchise for Brexit:**  
      *   **Included:**  
          *   UK citizens resident in the UK (core subjected group).  
          *   **Long-term resident EU nationals in the UK** (subject to UK laws, taxation, and the direct consequences of Brexit on their legal status).  
          *   **Residents of Gibraltar** (subject to UK sovereignty/EU laws via UK, correctly included).  
          *   *Potentially* 16/17-year-olds (subject to UK laws, though age of franchise is a separate normative debate often settled at 18).  
      *   **Excluded:**  
          *   UK citizens residing long-term abroad (generally not subject to daily UK law enforcement/taxation *as residents*).  
          *   Citizens of other EU states not resident in the UK (not subject to UK sovereign power).  
          *   Commonwealth citizens not meeting residency requirements (unless resident and thus subjected).  
      *   **Divergence from Actual Rules:**  
          *   Explicitly includes long-term resident EU nationals (as subjected).  
          *   Likely excludes non-resident UK citizens (after a shorter period than 15 years) and Commonwealth citizens not resident in the UK.  
          *   May include 16/17-year-olds (depending on interpretation of "subjected").  
      *   **Problems:**  
          *   **Temporal Limitation:** Excludes UK citizens abroad who *will* be subject to new Brexit-related laws upon return or in dealings with the UK state.  
          *   **"Subjected" Scope:** Does it only cover *current* residents, or anyone whose future rights/obligations vis-à-vis the UK state are fundamentally altered by the decision? Brexit changed the future relationship profoundly for expats.  
          *   **Gibraltar Nuance:** While included (correctly), its unique status highlights that "subjected" can be complex in non-sovereign territories.

  **Divergence Between Principles:**  
  *   **All-Affected** is vastly broader, potentially including millions across the EU and globally who are impacted but not subject to UK sovereignty.  
  *   **All-Subjected** is narrower, focusing on those experiencing the *direct coercive authority* of the UK state, primarily resident citizens *and* non-citizens. Its key divergence from the actual franchise is the inclusion of long-term resident EU nationals.  
  *   **Key Conflict Groups:**  
      *   *Long-term resident EU nationals:* Included by both principles, excluded by actual rules.  
      *   *UK citizens abroad long-term:* Included by Affected (due to impact), likely excluded by Subjected (not currently residing), ambiguously included (15-year rule) in actual rules.  
      *   *16/17-year-olds:* Included by Affected (impact), *potentially* by Subjected (subject to laws), excluded by actual rules.  
      *   *Citizens of other EU states (not in UK):* Included by Affected, excluded by Subjected and actual rules.  
      *   *Commonwealth citizens (not resident):* Excluded by Subjected, potentially included by Affected (depending on ties), excluded by actual rules unless resident.

  **The Verdict: Circularity and the Inescapable Arbitrariness**  

  Neither principle delivers a truly **non-arbitrary** answer, and the Brexit case strongly confirms the **circularity** inherent in the boundary problem:

  1.  **Defining the Terms is Circular:** Applying either principle requires prior normative and political judgments about what constitutes "significantly affected" or "subjected to coercion" in *this specific context*. These definitions themselves presuppose a view about who *matters* or who *belongs* within the relevant political community for this decision.
      *   Does "affected" mean immediate legal impact, economic consequence, or broader political/cultural influence?  
      *   Does "subjected" mean only current residents, or those bound by the state's future decisions? Does it include minors fully?  
      *   **Answering these questions *is* the act of defining the demos.** There is no neutral, pre-political ground.

  2.  **Brexit Highlights Contextual Arbitrariness:** The actual franchise (parliamentary) reflected existing UK constitutional conventions, but its exclusions were demonstrably arbitrary in the context of a decision uniquely impacting specific groups:
      *   Excluding long-term EU residents (deeply subjected and affected) while including Commonwealth citizens with potentially minimal ties or impact exposed a citizenship/nationality-based boundary that didn't align neatly with either principle.
      *   Gibraltar's inclusion (due to its EU status) was a pragmatic political fix acknowledging its unique affectedness/subjection, further highlighting the ad-hoc nature of the boundary.
      *   Scotland's 2014 franchise (including 16+ and resident EU nationals) demonstrates that the "demos" is constructed differently even within the same state based on the perceived nature of the decision – proving the boundary is inherently contestable and political.

  3.  **Neither Principle Escapes Politics:** The all-affected principle collapses into impracticality or requires arbitrary thresholds. The all-subjected principle, while cleaner and more institutionally feasible (focusing on jurisdiction), still requires defining the relevant jurisdiction and the nature of "coercion" or "binding" power – decisions inevitably shaped by existing constitutional arrangements and political power.

  **Conclusion:** The Brexit referendum powerfully illustrates that **any procedure for defining the demos is fundamentally political and circular**. While the all-affected and all-subjected principles provide valuable critical lenses to expose the limitations and potential injustices of existing franchise rules (like the exclusion of long-term EU residents), they cannot provide a neutral, objective, non-arbitrary answer. Defining the "people" for a decision like EU membership *is* the core political conflict itself. The boundary is drawn through political contestation based on competing conceptions of community, belonging, rights, and the nature of the decision, inevitably reflecting existing power structures and normative commitments. The circularity is inescapable in practice; electoral design always presupposes an answer to the question of who belongs.
