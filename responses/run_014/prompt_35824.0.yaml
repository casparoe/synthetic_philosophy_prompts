  ### Question Text (for students)

  Consider an urn with 100 balls, each either red or black. The number of red balls is unknown—it could be any integer from 0 to 100. A second urn has exactly 50 red and 50 black balls. An agent evaluates bets as follows:  
  - For the ambiguous urn, they assign a uniform prior over all possible numbers of red balls (each integer proportion from 0 to 100 is equally likely). They compute the expected utility of a bet by taking the minimum over all possible proportions.  
  - For the known urn, they use the fixed 50% probability.  
  Utility is linear in money: \(U(\$100) = 1\), \(U(\$0) = 0\).  

  Bets:  
  - **Bet A**: Win $100 if a red ball is drawn from the ambiguous urn.  
  - **Bet B**: Win $100 if a red ball is drawn from the known urn.  

  1. Compute the worst-case expected utility for Bet A and compare it to the expected utility for Bet B. (3 points)  
  2. A student claims this agent is a standard expected utility maximizer over a richer state space (including the urn composition). Evaluate this claim: Is the agent compatible with standard expected utility theory? Explain why or why not. (6 points)  
  3. Describe a dynamic choice scenario (e.g., involving multiple draws or observations) where this agent exhibits dynamically inconsistent behavior. State which principle of rational choice this violates. (6 points)  
  4. Does this model reduce "ambiguity aversion" to risk aversion over second-order probabilities? Explain. (5 points)  

  ### Model Answer (for instructor)

  **Part 1: Computation and Comparison**  
  The worst-case expected utility for Bet A is computed by minimizing the expected utility over all possible proportions of red balls. For a given proportion \(r\) (number of red balls), the expected utility is \(r/100\). The minimum occurs at \(r = 0\), yielding \(\min(r/100) = 0\). For Bet B, the expected utility is fixed at \(50/100 = 0.5\). Thus, the agent assigns Bet A a value of 0 and Bet B a value of 0.5, strictly preferring Bet B.  

  **Part 2: Compatibility with Standard Expected Utility Theory**  
  The claim is incorrect. While the agent uses a richer state space (states defined by urn composition and ball draw), they violate standard expected utility theory (EUT). Standard EUT requires a single prior over states and linearity in probabilities. Here, the agent uses a *set* of priors (all point masses on \(r\)) and minimizes expected utility over this set, which is inconsistent with maximizing expected utility under any single prior. If the agent used the uniform prior as a single belief, Bet A would have expected utility \(\mathbb{E}[r/100] = (1/101)\sum_{r=0}^{100} r/100 = 0.5\). Instead, by minimizing, they assign it 0. This represents maxmin expected utility, not standard EUT.  

  **Part 3: Dynamic Inconsistency Example**  
  Consider two bets on the same ambiguous urn:  
  - **Bet I**: Win $100 if the first ball drawn (without replacement) is red.  
  - **Bet II**: Win $100 if the second ball drawn (without replacement) is red.  

  At time \(t=0\), the agent is indifferent: Both have worst-case EU = 0 (achieved when \(r=0\)). Suppose the agent chooses Bet II. A first ball is drawn and revealed as red. Now, at \(t=1\), the agent is offered to switch to Bet I. Bet I is resolved: Since the first ball was red, it pays $100. Bet II now depends on the second draw from an urn with 99 balls and \(r-1\) red balls (where \(r \geq 1\)). The worst-case EU for Bet II is \(\min_{s}(s/99)\) over \(s = 0\) to \(99\), which is 0. Thus, the agent strictly prefers to switch to Bet I ($100) over Bet II (EU=0). This violates dynamic consistency: At \(t=0\), the agent was indifferent, but at \(t=1\), they strictly prefer Bet I. The principle violated is the requirement that preferences over plans remain stable after partial resolution of uncertainty.  

  **Part 4: Ambiguity Aversion vs. Risk Aversion**  
  No, this model does not reduce ambiguity aversion to risk aversion over second-order probabilities. Risk aversion requires concave utility over outcomes, but here utility is linear. The agent’s behavior stems from minimizing over a set of priors, not integrating under a single prior. For instance, if the agent used the uniform prior as a second-order belief, Bet A would have EU=0.5. Instead, they assign it 0, revealing extreme pessimism. This is distinct from risk aversion: A risk-averse EU maximizer under the uniform prior might assign a certainty equivalent <0.5 due to nonlinear utility, but not 0. Further, the agent’s prior (uniform) contradicts their decisions—e.g., they would reject a bet on \(r=50\) at worst-case EU=0, despite the uniform prior implying a 1/101 chance of winning. Thus, "ambiguity aversion" here is a distinct mechanism: worst-case optimization, not second-order risk aversion.  

  ### Marking Scheme (20 points total)

  1. **Part 1 (3 points)**:  
     - Correct computation of Bet A's worst-case EU = 0 (2 points).  
     - Correct comparison to Bet B's EU = 0.5 (1 point).  
     *Common mistake: Computing EU under the uniform prior (yielding 0.5) instead of the minimum.*  

  2. **Part 2 (6 points)**:  
     - States that the agent is not a standard EU maximizer (1 point).  
     - Explains that standard EUT requires a single prior, but the agent uses a set of priors and minimizes (3 points).  
     - Notes that the uniform prior is not used for decisions (e.g., Bet A would be 0.5 under EU) (2 points).  
     *Common mistake: Claiming the uniform prior is the agent’s belief, ignoring the minimization.*  

  3. **Part 3 (6 points)**:  
     - Describes a dynamic scenario with bets across draws (e.g., Bet I vs. Bet II) (2 points).  
     - Shows initial indifference and strict preference after observation (2 points).  
     - Identifies the violation of dynamic consistency (e.g., stable preferences over plans) (2 points).  
     *Common mistake: Describing a scenario without a clear preference reversal (e.g., only showing updated beliefs).*  

  4. **Part 4 (5 points)**:  
     - Rejects reduction to risk aversion, noting linear utility (1 point).  
     - Contrasts minimization with integration under the uniform prior (2 points).  
     - Explains why the uniform prior contradicts betting behavior (e.g., on urn composition) (2 points).  
     *Common mistake: Arguing that minimization is "like" risk aversion without addressing second-order probabilities.*
