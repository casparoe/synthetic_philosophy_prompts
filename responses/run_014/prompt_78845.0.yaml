prompt: |-
  I teach a paradoxes seminar for upper-level undergrads, 14 of them, one 75-minute block, and next week I want to do the two-envelope problem as something they play rather than a puzzle I explain from the front. What I'm after is the moment where the swap argument feels obviously right while you're actually holding the envelope, and then the moment it collapses when you notice that the person holding the other envelope can run exactly the same argument back at you. I want them to feel that collapse in their hands, not hear me describe it.

  Here's what I've been kicking around, though throw it out if youve got something better. Each pair gets two sealed envelopes, one holding twice what the other holds, and nobody opens anything until the very end. I act as a broker who will swap their envelopes for a small fee, and who pitches the swap the obvious way: whatever's in your hand, the other envelope holds either double or half, you've got no reason to think one is likelier than the other, so the other one is worth 1.25 times yours on average, and the fee is nothing next to that. I want the fee to do the real work here -- someone who buys the argument will keep trading and keep bleeding, which lands harder than being told the argument is bad. I'm also tempted to require that a swap only happen if both partners independently agree to pay for it, since then they can both talk themselves into it at the same instant, which should be impossible if the reasoning were sound. Its the symmetry I want them to bump into.

  So design the whole thing. Rules, what goes in the envelopes, what the stakes are (play money only, and I want the amounts set so the double-or-half arithmetic stays easy in their heads), the size of the fee, how the broker phrases the pitch without tipping the answer, a timeline for the 75 minutes including setup, and something workable for tracking who's swapping. I'd also like a second phase where I reveal the distribution I actually drew the smaller amount from and have them redo the calculation knowing it, because I want them to see that a flat "it's fifty-fifty either way" can't survive contact with a real prior -- and I want them to find the boundary cases themselves, the highest and lowest amounts where the fifty-fifty assumption visibly gives out. Then a debrief that walks back through the game and lines up what happened with the actual structure of the puzzle: where the expected-value reasoning smuggles in an assumption, why the symmetry between the two players settles it, and what precisely goes wrong with the claim that the other envelope is equally likely to be double or half no matter what you see.

  Also tell me what will predictably go wrong the first time I run it. I'm worried about pairs who refuse to trade on principle and never feel the pull, students who've seen the puzzle before and blurt the answer, and the awkward chance that the fee makes them suspicious of me instead of suspicious of the argument -- but I'd rather hear what you think the real failure modes are and how to handle them mid-session. And be honest about what the game can't reproduce, the part I'll have to just tell them because no arrangement of envelopes will show it.

  Write it as continuous prose, no headings, no bullet points, no bold, no tables -- just paragraphs I can read straight through like an email. American English please.
reasoning: |-
  Okay, the user is teaching a paradoxes seminar for upper-level undergrads and wants an interactive activity for the two-envelope problem. They want students to experience the swap argument firsthand and feel its collapse through symmetry. Let me unpack their requirements.

  The core goal is to create that visceral "aha" moment when students realize the symmetric argument leads to mutual loss. The user mentioned using a fee mechanism to make the irrationality tangible—students who keep swapping bleed money. They also want partners to both agree on swapping, highlighting the impossibility if the reasoning were sound. 

  I need to design the envelopes' contents. Using multiples of $10 keeps math easy. A range from $10 to $640 ensures doubles stay within play money limits. The fee should be small enough to seem negligible (e.g., $1) but accumulate visibly. 

  The broker pitch is crucial. It should parrot the classic argument without revealing flaws: "Whatever you’re holding, the other envelope has either double or half, equally likely, so expected value is 1.25x." Neutral phrasing avoids tipping off. 

  For the session flow: Setup (5 min), trading phase (25 min), distribution reveal (15 min), recalculation (10 min), debrief (20 min). Tracking swaps via a public ledger adds transparency. 

  Failure modes to anticipate: 
  1. Cautious students refusing to trade—solution: frame initial trades as "testing" the broker’s math. 
  2. Spoilers blurting answers—redirect them to "play along" as devil’s advocates. 
  3. Distrust of fees—emphasize the broker’s fixed cut is irrelevant to the paradox. 

  What the game can’t replicate: The abstract probability flaw (treating unobserved values as variables). Debrief must explicitly dissect how the 50/50 assumption smuggles in contradictory priors. 

  Second phase: Reveal the uniform distribution of smaller amounts ($10-$320). Students recalculate expected gains, noticing extremes where "half" is impossible (e.g., holding $640). This kills the 50/50 pretense. 

  Debrief should walk through: 
  - Why symmetry forces a net loss 
  - How the prior distribution invalidates uniform likelihood 
  - The variable fallacy in expected value math 

  This structure should make the paradox collapse feel earned, not explained.
answer: |-
  Here’s how I’d design the session to hit all your goals, focusing on tactile discovery and the symmetry collapse. Use crisp white letter-sized envelopes, two per pair, sealed tightly so contents aren’t guessable. Inside each pair’s envelopes: one contains amount *X*, the other *2X*. The smaller amount *X* is drawn uniformly from {10, 20, 40, 80, 160, 320} dollars (play money you provide). This keeps arithmetic easy (doubling/halving stays integer) and creates clear boundary cases later. Stakes are symbolic play money—no real value, but track it seriously to make losses/gains tangible. Print "certificates" for $1000 play money per student to start; they’ll pay fees and receive winnings from this fund later.

  Start by handing out materials: one pair of envelopes and $1000 certificate to each of the 14 students (7 pairs). Briefly explain: "You and your partner hold two envelopes. One has twice as much cash as the other. You’ll make decisions about swapping them, paying a small broker fee if you do. Later, you’ll open them and cash out." Don’t explain the paradox yet—preserve the discovery.

  Now become the broker. Announce the rules: "I’m your broker. If you and your partner *both independently agree* to pay me a $1 fee right now, I’ll swap your envelopes. You decide silently, then simultaneously show me thumbs-up (agree to swap + pay fee) or thumbs-down (no swap). Only if both thumbs-up do I take $1 from each of you and swap your envelopes. You can do this as many times as you want during the trading phase." Emphasize the independence—no discussing decisions with partners. The fee is critical: small enough to seem trivial against potential gains ($1 vs. $10+), but large enough to accumulate visibly. Pitch the swap argument neutrally when students hesitate or ask why they’d swap: "Just remember, whatever you’re holding, the other envelope either doubles it or halves it. If you think both are equally likely, the other one’s worth 1.25 times yours on average. A buck is peanuts next to that kind of edge." Use that exact phrasing—it mirrors the faulty reasoning without adding interpretation. Keep your tone pragmatic, like a market mechanic stating probabilities.

  Run trading for 20 minutes. Roam the room, collect thumbs, enforce silence between partners, swap envelopes, and deduct fees. Track everything publicly on a board: note each swap (e.g., "Pair 3 swapped, fees paid") and tally total fees per pair. This visibility builds tension—pairs see others trading repeatedly, fees piling up. Some pairs will swap eagerly, paying multiple fees. Others will be cautious. The magic happens when a pair swaps multiple times: they’re bleeding $2 per swap but the envelopes are unchanged, forcing a dawning unease. The symmetry collapse emerges when partners realize they *both* paid to swap *simultaneously*—each thought they were gaining an edge on the other, yet neither actually changed their position. It’s financially irrational, yet they did it. Nudge hesitant pairs gently: "No pressure, but mathematically, if it’s 50-50, you’re leaving money on the table." This often triggers the first swap.

  After trading, pause but don’t open envelopes yet. Reveal the distribution: "I drew the *smaller* amount for each pair uniformly from {$10, $20, $40, $80, $160, $320}. Your smaller envelope has one of these; the larger is double." Have pairs calculate expected values *given their current envelope*. Tell them: "Suppose you’re holding $Y. What’s the expected value of the other envelope? Assume for now it’s equally likely to be half or double." Give them 10 minutes to compute this for their Y, sharing values only with partners. They’ll quickly hit boundaries: if holding $10, "half" is impossible—other must be $20. If holding $320, "double" is impossible (since max smaller was $320; larger would be $640, but no envelope holds $640 as the smaller amount—smaller max is $320). Only mid-range amounts (e.g., $40) seem ambiguous. Have them report discoveries: "Who found cases where ‘equally likely’ breaks?" Discuss how the prior constrains possibilities—the 50/50 assumption fails at extremes and distorts mid-range probabilities.

  Now open envelopes (5 mins). Students redeem contents from you using their certificates. Settle balances: those who swapped a lot have high fees but unchanged winnings. A pair that swapped 5 times paid $10 in fees but maybe only found $40 total—a brutal loss. Others who swapped once or never saved fees. Debrief immediately (20 mins). Start with their experience: "Who felt confident swapping? What changed when you did it repeatedly?" Focus on the symmetry. Ask: "You both paid to swap. How could you *both* think you were gaining on the other?" Tease out that the argument treats the other envelope’s contents as undefined, ignoring that its value is fixed. Then dissect the math: "Why did ‘equally likely’ feel natural? But what did the prior distribution do to it?" Show how the expected value calculation [(2Y)/2 + (Y/2)/2 = 1.25Y] assumes Y is fixed while the other envelope varies—but actually, Y is a variable too, tied to the prior. Finally, generalize: "The paradox smuggles in a contradiction—it assumes no information about the distribution, then treats your observed Y as absolute when calculating probabilities for the other envelope."

  Predictable failures first time: Some pairs won’t swap at all, fearing a trick. Mitigate by suggesting early: "Try one swap to test the broker’s math." Often, seeing others trade breaks resistance. A few students will know the puzzle. Brief them beforehand: "Your role is to feel the argument’s pull anyway—trade eagerly, then help debrief why it fooled you." If they blurt, say: "Yes, but let’s see why it’s persuasive in practice." The fee might breed distrust. Preempt it: "My fee is fixed, small, and transparent—I profit only if you trade, regardless of your outcome." Stress that the fee’s purpose is to make inaction costly, pressuring them to engage the argument. Logistically, tracking swaps can get messy. Use a simple public tally sheet per pair—hash marks for swaps. Call out "Pair 2 swapping!" when it happens to keep attention.

  What the game can’t show: The infinite expectation variant or continuous distributions. You’ll need to say: "In our game, bounds saved us. But if *all* positive dollar amounts were possible with a ‘scale-free’ prior, the paradox deepens—expected value becomes infinite for both envelopes, making swapping rational infinitely often!" This extends the lesson: sometimes the structure of possibility itself defies intuition. The hands-on collapse, though, will make them ready to hear it.
