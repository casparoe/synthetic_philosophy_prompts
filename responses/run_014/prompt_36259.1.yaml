  Then give me the residue report, because that's what I actually care about. My working view is a dissolution: once you have de Finetti in hand, "objective chance" just names the predictive role of a parameter in an exchangeable model, the Principal Principle becomes something like a theorem about conditional predictive distributions, and the philosophers are fighting over how to interpret a modeling device. But I gather they also argue that certain kinds of evidence about future chances are inadmissible in a way that makes simple deference incoherent -- something about hypotheses about total histories undermining the chances that those same hypotheses assign -- and I honestly cannot tell from their slides whether this is just familiar non-conjugacy or coherence trouble with my priors, or something exchangeable modeling genuinely cannot express. So tell me what survives the translation cleanly, what has to be distorted to fit, and what has no counterpart in my vocabulary at all, and then take a stance: does the residue show that my vocabulary is missing something real, or that the original claims were less clear than they looked? Don't spare my dissolution out of politeness; if the undermining problem or the propensity intuitions point at something a de Finettian statistician cannot state, say so plainly. Please answer in continuous prose only, no headings, bullet points, bold text, or tables, as you would write to a colleague.
