  The proposal structure they requested is clear: precise question, gap analysis, method, deliverables, risks. For the method, I'm thinking they need to: 1) define the two explanation types rigorously, 2) pick a historical puzzle, 3) apply longue durée variables, 4) see what they can/can't account for, 5) compare with event-based accounts.

  Biggest risk? Scope creep. One chapter can't cover multiple regions or time periods. Need to warn them about that. Also, the analysis could get too abstract if not tied to concrete evidence.

