  A popular philosophy book I'm reading runs Ayer's argument against personal immortality like this: "The claim that a person survives their own death is one that no observation could ever confirm or disprove, and for Ayer that means the claim is not merely unsupported but actually false. The soul, conceived as a simple unobservable substance that carries your identity through death, has no detectable properties, so the concept is empty. Once you see this, all religious talk about the afterlife is simply nonsense, and a rational person should just drop it." I keep hearing that Ayer's real position was more careful then this, but I can't tell which parts the book gets right and which it distorts. Can you go through it and tell me what Ayer would actually accept, what's a subtle misrepresentation, and what's just plain wrong, and whether the book's conclusion that this settles the debate about the afterlife follows from anything true in the summary? Also, please separate what's actually settled among people who work on this from what's genuinely contested — like whether the verification principle is a defensible theory of meaning in the first place, or whether Ayer's argument survives if you reject it — and don't just present a contested point as the consensus.
