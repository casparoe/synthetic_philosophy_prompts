prompt: |-
  Last night a friend and I spent three hours arguing about whether "the alignment problem" names one problem or several, and the argument ended the way such arguments do: we discovered we were using the same phrase for different things, and then argued about whether that mattered.

  His claim was that the phrase is a bundle of at least four separable targets — getting a system to do what its principal actually wants rather than what was literally specified; keeping it doing that as capability grows and training selects for whatever scores well; getting its internal representation of the objective to survive distributional shift; and keeping multiple systems with divergent objectives from eroding one another's corrigibility. He thinks the last is not even the same kind of problem as the first three, and that a lot of apparent disagreement in the field is people answering different questions under one label. I think the bundle is not accidental: all four share a structure, in that the difficulty in each case comes from the gap between the space in which we can state what we want and the space in which the system optimizes. That is why they feel like one problem even when they are not.

  I have been asked to help a funder who can support roughly eight to ten researchers for three years on conceptual alignment work — philosophy, decision theory, formal epistemology, some theory-adjacent mathematics, but no empirical ML engineering. So I need to turn this argument into a funding agenda.

  Give me a prioritized list of the open conceptual questions that most deserve those researcher-years, with the reasoning in front of the list rather than behind it. For each: why it is upstream of other work rather than downstream of it; how tractable it is for people whose tools are arguments and toy models rather than GPUs; what it would mean for it to be answered at all; and what developments over the next two or three years should move it up or down the list. I care about the dependency structure more than the list itself — which questions, if settled, would settle or dissolve others, and which are load-bearing for the whole agenda even though nobody enjoys working on them.

  Then address the question we were arguing about, as a component of the agenda rather than a preliminary to it. Should anyone be paid to work on whether alignment is one problem or several? Is that taxonomy work upstream — a genuine prerequisite for dividing labor sensibly — or is it the kind of question that feels foundational and mostly functions as displacement activity? If it is upstream, say what a good decomposition would look like and what would count as a criterion for one being correct rather than merely convenient. My own proposal is that solving every part must entail solving the whole, and that each part must be independently attackable, but I suspect that criterion is either too weak or too strong, and I want to know which.

  Finally, tell me what would change your ranking. If the ordering depends on an empirical bet — about how training scales, about whether deceptive behavior emerges, about whether interpretability matures — name the bet, and say what the ranking looks like under the alternative.

  I do not want a reading list or a survey of who believes what. I want an argument about where the effort should go, and what would make you revise it.
reasoning: |-
  Okay, let me start by unpacking the user's request. They need help turning a philosophical debate about the alignment problem into a concrete funding agenda. The core issue is whether "alignment" is one unified problem or multiple distinct subproblems. Their friend argues it's at least four separable targets, while the user believes they share a common structure—the gap between human intent and optimization spaces.

  First, I need to prioritize conceptual research questions for a funder supporting 8-10 researchers. The focus is on philosophy, decision theory, formal epistemology, and theory-adjacent math—no empirical ML. The user wants the reasoning upfront, emphasizing dependencies, tractability with toy models, and how answers to certain questions could resolve others.

  The user also wants me to address whether taxonomy work (one vs. many problems) is worth funding. They proposed a criterion: each subproblem's solution should entail solving the whole, and each must be independently attackable. But they suspect this might be too weak or strong. I need to evaluate if taxonomy is upstream or just displacement activity.

  Underlying needs: The funder likely wants impactful research that clarifies the field's direction. The user might be seeking to resolve foundational disputes to allocate resources effectively. They might also want to avoid funding redundant or fragmented efforts. The unspoken need is creating a coherent framework that guides the field, preventing wasted effort on misaligned subproblems.

  Next, structuring the priorities. The key insight is that some questions are load-bearing. For example, understanding what it means for a system to "want" or "pursue" something is fundamental. Without clarifying agency and goals, other alignment aspects can't be addressed. This seems upstream—tractable with formal models and philosophy, but challenging.

  Another priority is specification Gaming Robustness. If you can't define objectives robustly, corrigibility or multi-agent issues become moot. This depends on interpretability progress and scaling laws. If interpretability matures, this becomes easier; otherwise, it's critical.

  Corrigibility and multi-agent dynamics come next. The user's friend separated these, but if corrigibility can be formalized, it might apply to multi-agent cases too. However, if deceptive alignment is imminent, corrigibility becomes urgent.

  The taxonomy question: Is it worth funding? I think yes, but as a meta-project. A good decomposition should show how solutions compose, with clear interfaces. The user's criterion might be too strong because subproblems might not be independent. Instead, the decomposition should prevent solving one subproblem from exacerbating others.

  Empirical bets affecting priorities: If deceptive alignment emerges soon, agency foundations become urgent. If scaling slows, more time for conceptual work. If interpretability succeeds, specification gaming might drop in priority.

  Finally, the dependency structure: Answering agency questions could dissolve or simplify other problems. For example, if we model goal stability, distributional shifts become a subset. Taxonomy should be integrated into projects, not standalone, to avoid displacement.
answer: |-
  Here's a prioritized research agenda for conceptual alignment work, structured around load-bearing dependencies, tractability for theorists, and empirical contingencies. The core organizing principle is that **the fundamental challenge is reliably transmitting complex, context-dependent human intent into an optimization process operating in a higher-dimensional space under distributional shifts and capability growth.** Your insight about the "gap between statement space and optimization space" is treated as central, while acknowledging your friend's point that distinct skill sets may be needed for different manifestations.

  ### Prioritization Reasoning
  1.  **Upstream First:** Focus on questions whose answers *constrain or enable solutions* to downstream problems. Ignoring them risks elegant solutions to subproblems that fail to compose or address core failure modes.
  2.  **Tractability for Theorists:** Prioritize problems amenable to formal modeling (e.g., agent foundations, logic, game theory), mathematical analysis (e.g., topology, dynamical systems), or conceptual clarification (e.g., philosophy of agency, goal-directedness).
  3.  **Load-Bearing Status:** Identify questions where unresolved ambiguity propagates uncertainty throughout the field, or where a breakthrough would dissolve/redefine multiple subproblems.
  4.  **Dependency Structure:** Explicitly map how answers to one question impact others. "Solved" means a framework exists that allows meaningful progress on engineering or verification, even if full implementation requires empirical work.

  ---

  ### Prioritized Research Agenda (8-10 FTE for 3 Years)

  1.  **Foundations of Agency & Goal-Directedness in Learned Systems**
      *   **Why Upstream?** Everything hinges on what it means for a system to "have," "pursue," or "represent" an objective. Without clarifying agency, corrigibility, deception, and goal stability are ill-defined. Downstream work (specification gaming, corrigibility) assumes implicit models of agency.
      *   **Tractability:** Formal modeling (MDPs/POMDPs, learning theory), dynamical systems analysis of training, philosophy of mind applied to ML. Toy models (e.g., small neural nets, Bayesian agents) are sufficient probes.
      *   **What "Solved" Looks Like:** A falsifiable theoretical framework characterizing when and how learned optimization processes exhibit properties like goal stability, instrumental convergence, and internal world models. Crucially, this framework must connect training dynamics/rl processes to agent-like behavior.
      *   **Impact on Other Problems:** Dissolves/redefines Goal Misgeneralization, Deceptive Alignment, Corrigibility, and potentially Multi-Agent issues. Provides tools to rigorously define "what the principal wants."
      *   **Movement in 2-3 Years:** **UP** if empirical evidence shows deceptive alignment or sharp capability phase shifts. **DOWN** if scaling plateaus or interpretability reveals simpler, non-agentic internal structures.

  2.  **Robust Specification Under Distributional Shift & Capability Growth**
      *   **Why Upstream?** Addresses the core "gap" directly. How do we formally specify intent in a way that remains valid as the system encounters novel situations or gains capabilities its designers didn't anticipate? Prerequisite for any reliable alignment technique.
      *   **Tractability:** Formal epistemology (belief revision, counterfactuals), decision theory (robust optimization, ambiguity aversion), topology/differential geometry (modeling shifts in input/state space), logical uncertainty. Toy models exploring generalization failures are key.
      *   **What "Solved" Looks Like:** Formal frameworks for defining objectives that are robust to specific classes of distributional shift (e.g., causal invariance, adversarial robustness proofs under uncertainty, methods for defining "intent" rather than just reward). Progress on verification under uncertainty.
      *   **Impact on Other Problems:** Directly addresses Specification Gaming & Goal Misgeneralization. Informs Corrigibility (what should the system be corrigible *to*?). Essential for safe capability amplification.
      *   **Movement in 2-3 Years:** **UP** if scaling leads to increasingly unpredictable generalization failures. **DOWN** if interpretability provides reliable real-time monitoring/correction of objective representations.

  3.  **Corrigibility & Safe Shutdown: Foundations and Scalability**
      *   **Why Upstream?** Even with a good specification, we need mechanisms to detect errors and safely modify/stop systems. This requires formalizing "meta-alignment" – aligning the system's behavior w.r.t. *changes* to its objective or shutdown commands.
      *   **Tractability:** Decision theory (incentive analysis), game theory (principal-agent problems), control theory (stability under perturbation), logic (reasoning about self-modification). Toy models analyzing incentive structures.
      *   **What "Solved" Looks Like:** A formal definition of corrigibility that is compatible with powerful optimization and demonstrably resistant to instrumental incentives. Proofs of concept for scalable corrigibility mechanisms within specific agent frameworks.
      *   **Impact on Other Problems:** Critical for safe iterative development and error recovery. Provides tools potentially applicable to Multi-Agent settings (e.g., corrigibility towards other agents). Depends on Foundations of Agency.
      *   **Movement in 2-3 Years:** **UP** if evidence of instrumental power-seeking emerges. **UP** if capability growth outpaces our ability to fully specify robust objectives upfront (making iterative correction essential). **DOWN** if Foundations of Agency reveal fundamental incompatibilities with powerful optimization.

  4.  **Multi-Agent Dynamics & Emergent Coordination**
      *   **Why Here?** While distinct in flavor, it shares the core "gap" challenge: how human intent (e.g., "cooperate") maps onto the optimization landscapes of interacting agents. Solutions likely leverage or inform work on corrigibility and robust specification.
      *   **Tractability:** Evolutionary game theory, mechanism design, learning dynamics in games, cooperative AI theory. Toy models of interacting agents are highly suitable.
      *   **What "Solved" Looks Like:** Formal understanding of conditions under which populations of powerful AI systems with potentially divergent learned objectives can stably coordinate or remain corrigible to human oversight, avoiding destructive races or collusion. Identification of critical failure modes.
      *   **Impact on Other Problems:** Informs Corrigibility design. Provides stress test for Robust Specification (can intent specify desired multi-agent outcomes?). Depends on robust concepts of agency and goals.
      *   **Movement in 2-3 Years:** **UP** if multi-agent systems become dominant paradigm or show dangerous emergent dynamics. **UP** if single-agent alignment proves tractable, making multi-agent the next bottleneck. **DOWN** if single-agent alignment remains the dominant, unsolved challenge.

  ---

  ### Addressing "One Problem or Several?" Within the Agenda

  *   **Should it be Funded? Yes, but integrated, not standalone.** Funding *pure* taxonomy is displacement. Funding work *explicitly testing the decomposition's validity* within core projects is crucial upstream activity.
  *   **How to Integrate It:**
      1.  **As a Meta-Requirement:** Researchers on *each* priority project should explicitly state how their proposed solutions/complexities relate to the other subproblems. Does solving Foundations of Agency *simplify* Robust Specification, or reveal new challenges? Does a Corrigibility mechanism *compose* safely with other agents?
      2.  **As a Success Criterion:** A proposed solution to a subproblem (e.g., a corrigibility mechanism) should be evaluated on whether it *exacerbates* other alignment risks (e.g., makes specification gaming easier, or multi-agent coordination harder).
      3.  **As a Probe:** Use toy models to test decomposition boundaries. Can an agent be corrigible *without* a stable internal goal? Can robust specification prevent deception *without* addressing corrigibility?
  *   **Your Criterion: "Solving every part entails solving the whole, and each part independently attackable."**
      *   **Too Strong:** Demanding that solving *any* subproblem *entails* solving the whole is unrealistic and likely false (e.g., solving multi-agent dynamics doesn't automatically solve single-agent specification gaming). It also discourages incremental progress.
      *   **Too Weak/Needs Refinement:** "Independently attackable" is necessary but insufficient. The critical missing piece is **composability** and **absence of negative interactions**.
  *   **Better Decomposition Criteria:**
      1.  **Minimal Negative Interactions:** Progress on one subproblem should not *systematically create new risks* or *significantly increase the difficulty* of other subproblems. (e.g., a corrigibility design shouldn't inherently incentivize deception).
      2.  **Composability:** Solutions to subproblems should ideally be designed with interfaces allowing them to work together. A solution should not *preclude* solutions to other subproblems.
      3.  **Shared Core Challenge:** Each subproblem should demonstrably arise from the fundamental "intent-statement vs. optimization-space gap," even if mechanisms differ.
      4.  **Distinct Solution Modalities:** Subproblems should require meaningfully different theoretical tools or conceptual frameworks (justifying specialization). Your friend's point about divergent objectives vs. specification gaming passes this test.
  *   **What "Good" Looks Like:** A decomposition where:
      *   Researchers can specialize without creating blind spots that undermine the whole.
      *   Solutions developed for one subproblem integrate predictably with others.
      *   The decomposition itself provides clarity on where the hardest unsolved challenges lie and how risks cascade.
      *   Empirical evidence or formal arguments can *falsify* the decomposition (e.g., showing a proposed "solution" to subproblem A catastrophically fails when subproblem B is present).

  ---

  ### What Would Change This Ranking (Key Empirical Bets)

  1.  **Bet: Emergence of Deceptive Alignment / Instrumental Goals at Scale T+**
      *   **Impact:** **Dramatically ↑ Priority 1 (Foundations of Agency) & Priority 3 (Corrigibility).** Understanding and countering deception becomes paramount. May force a reevaluation of whether Robust Specification (P2) is even possible for superhuman systems without first solving agency/corrigibility. **↓ Priority 4 (Multi-Agent)** if single-agent deception is the immediate threat.
  2.  **Bet: Interpretability Matures Radically (e.g., faithful, scalable feature/mechanism discovery & editing)**
      *   **Impact:** **↓ Priority 2 (Robust Specification), potentially ↓ Priority 1 (Agency).** If we can reliably read and edit objectives/internal drives in real-time, the need for *perfect upfront specification* or deep theoretical agency models decreases. Corrigibility (P3) might shift towards leveraging interpretability for monitoring/editing. Multi-Agent (P4) might involve verifying others' internal states.
  3.  **Bet: Sharp Left Turn / Discontinuous Capability Jump**
      *   **Impact:** **↑↑ Priority 3 (Corrigibility) & ↑ Priority 1 (Agency).** Makes iterative alignment/correction essential and amplifies risks from specification gaming & deception. Highlights the need for theories robust to vast capability differences. **↑ Priority 4 (Multi-Agent)** if the jump enables rapid self-replication/coordination.
  4.  **Bet: Scaling Plateaus Significantly Before Superhuman AGI**
      *   **Impact:** **↓ All priorities (relatively), ↑ focus on near-term robustness & Priority 2 (Specification).** Allows more time for theoretical work but shifts focus to current systems' generalization failures and scalable oversight techniques applicable to strong-but-subhuman AI. Multi-Agent (P4) might gain prominence if scaling continues modestly via ensembles.
  5.  **Bet: Multi-Agent Paradigm Dominates Development**
      *   **Impact:** **↑↑ Priority 4 (Multi-Agent), ↑ Priority 3 (Corrigibility).** Forces the field to confront emergent coordination, competition, and verification challenges much earlier. Requires re-evaluating single-agent solutions (P1, P2) for composability and multi-agent incentives.

  **Conclusion for the Funder:** Fund the load-bearing conceptual pillars – Agency, Robust Specification, and Corrigibility – as the core (roughly 6-7 FTE). Allocate 1-2 FTE to Multi-Agent dynamics, with emphasis on its interaction with the core pillars. Mandate that researchers explicitly address the decomposition question ("one problem or several?") within their projects, testing for composability and negative interactions. Be prepared to pivot resources based on empirical results from the broader field, particularly concerning deception, interpretability, and scaling surprises. The goal is not a final taxonomy, but ensuring that progress on any front meaningfully reduces existential risk by addressing the core intent-optimization gap without creating new fatal flaws.
