prompt: |-
  A friend of mine is drafting an op-ed for a Scottish broadsheet, timed to the recurring speculation about a second independence referendum, and the spine of his argument is an analogy he says he absorbed from a decade of commentary: a state is a marriage, and independence is a divorce. His version runs like this. No-fault divorce exists precisely because we came to think it wrong to hold two people in a union one of them has left; the marriage may be perfectly valid and the vows sincerely made, and yet the fact that one party no longer wants to be in it is reason enough to dissolve it. So, he argues, if a majority in Scotland votes to leave, Westminster's insistence on the legality of the Union and on undertakings made in 1707 has the same shape as a husband's insistence that his wife is bound by vows she no longer endorses: technically correct, morally bankrupt. He draws a second conclusion from it, that the rump state has no standing to set conditions and only a duty to negotiate the terms of separation, because a court granting a decree does not get to decide whether the marriage should have existed in the first place. The unionist side, he notes, runs the same analogy backwards: divorce means dividing the home and the debts, the children's interests are paramount and they did not choose this, and nobody walks away with the whole house. He wants to keep the analogy because his editor thinks it is the most vivid thing in the draft, and he has asked me whether it can bear the weight he is putting on it. My instinct is that it cannot, but I cannot say precisely where it fails or how much of the argument fails with it.

  So please audit it. First, give me the mapping explicitly — a table of correspondences is fine — filling in the slots the draft leaves vague: who are the two spouses (the peoples, the parliaments, the states as corporate persons?), what plays the part of the vows and of the matrimonial home, what corresponds to the children, to the pre-nuptial agreement, to the no-fault regime, to the court that issues the decree, and what, if anything, corresponds to the fact that a marriage is entered voluntarily while citizenship is acquired by birth and by territory. Second, separate the disanalogies that actually bear on his conclusion from the merely decorative ones. I can already see that a divorce is private between its parties while secession redraws the jurisdiction other people live under, that a divorce does not move a boundary that third parties stand on, that a departing spouse takes a share fixed by contribution and need rather than the geography she happens to be standing on, and that only one side of a secession can invoke exit while either spouse can file. Tell me which of these is load-bearing and which he is entitled to shrug off, and why. Third, say what the analogy quietly imports that the target lacks — in particular whether it smuggles in an answer to the boundary problem, since a divorce presupposes that the parties are already fixed and identifiable whereas the contested question in Scotland, Catalonia and Quebec is exactly who constitutes the unit entitled to decide (and hence whether the vote belongs to Scotland alone or to the whole United Kingdom), and whether it also smuggles in an agreed exit procedure and a tribunal above both parties that in most of these cases simply do not exist.

  Then assess whether the conclusions survive. Does the no-fault line show that a majority vote confers a right to leave, or only that it confers a right to be taken seriously in negotiation — a far weaker claim, and roughly what the Supreme Court of Canada's 1998 secession reference arrived at, namely no unilateral right to secede but an obligation on the rest of the country to negotiate following a clear majority on a clear question? Does the unionist counter-use fare any better, or does it too depend on features of marriage that do not carry over, such as a pre-existing body of rules for splitting assets and a judge with authority over both parties? Finally, tell me whether there is a better analogy in this neighbourhood — a co-owned building whose owners cannot take a wing with them, a club membership, a tenant breaking a shared lease, a corporate spin-off, a redrawing of municipal boundaries — and rank the two or three candidates by how much of the real structure they preserve, saying for the best of them which feature of secession it still cannot reproduce and the analyst has to supply by argument. Two constraints on your reply: please do not send me citations, cases, or a reading list, since I am working without access to sources and want only your own reasoning; and please do not be diplomatic for its own sake. If the analogy turns out to be doing nothing but supplying vividness, say so, and if one of its imports is in fact a genuine insight that both sides in these debates have been ignoring, say that too.
reasoning: |-
  Okay, let me tackle this analogy audit systematically. The user wants a forensic breakdown of the marriage-divorce/secession analogy, so I'll start by mapping all the elements explicitly. 

  First, the correspondences: The spouses seem clearly intended as Scotland and England (representing the UK state), but this immediately raises issues - states aren't conscious entities like spouses, and "England" here awkwardly represents the whole UK. The vows map to the Acts of Union 1707, but those were parliamentary statutes, not personal promises. The marital home is Scotland's territory, but that's problematic because territory isn't jointly acquired property. Children correspond to Scottish citizens, but citizenship isn't equivalent to parental responsibility. 

  The disanalogies are where it gets interesting. The boundary problem is fundamental: in divorce, the parties are predefined, but in secession, defining "who gets to vote" is the core dispute. The lack of neutral arbiter matters too - there's no equivalent of a divorce court in international law. And crucially, divorce dissolves a private relationship, while secession alters constitutional order affecting millions who didn't consent to the analogy's framework.

  On the conclusions: The no-fault comparison fails because it assumes the vote itself legitimizes exit, whereas in reality (as per Canada's Clarity Act) a vote only triggers negotiations. The unionist counter-argument about asset division also stumbles - there's no preexisting formula for state dissolution like in matrimonial law.

  Alternative analogies might work better. A joint business venture captures ongoing economic ties but still assumes predefined partners. Condominium ownership illustrates shared sovereignty but can't handle democratic will. Corporate restructuring comes closest by accommodating negotiated separation terms, though it still can't resolve the boundary question.

  Ultimately, the marriage analogy's vividness comes at high conceptual cost. It smuggles in contested premises about voter eligibility and presupposes institutions that don't exist. While emotionally resonant, it obscures more than it clarifies about sovereignty disputes.
answer: |-
  Here's a structural audit of the marriage-divorce analogy as applied to Scottish independence, addressing your queries point by point:

  ### 1. Mapping the Analogy (Correspondences)
  | **Marriage/Divorce Element** | **Secession Equivalent**              | **Ambiguities/Problems**                                                                 |
  |------------------------------|---------------------------------------|------------------------------------------------------------------------------------------|
  | **Two Spouses**              | Scotland vs. England (or UK state)    | States ≠ individuals; "England" represents UK government; Scotland's agency is collective, not individual. |
  | **Vows**                     | Acts of Union 1707                    | Treaties between states ≠ personal vows; renegotiated over centuries via devolution.     |
  | **Matrimonial Home**         | Territory of Scotland                 | Territory not "jointly acquired"; geographic continuity differs from shared property.    |
  | **Children**                 | Scottish citizens/residents           | Citizens are parties to the decision, not passive dependents.                            |
  | **Pre-nuptial Agreement**    | No clear equivalent                   | No prior written terms for dissolution; UK constitution is uncodified.                   |
  | **No-Fault Regime**          | Democratic principle of self-determination | Int'l law lacks universal "no-fault" secession rules; process depends on domestic law. |
  | **Court**                    | No equivalent                         | No neutral arbiter; UK Supreme Court serves the state, not both parties equally.         |
  | **Voluntary Union**          | Original Union (debated)              | Modern Scots inherited union; citizenship is territorial, not contractual.               |

  ---

  ### 2. Critical Disanalogies: Load-Bearing vs. Decorative
  | **Disanalogy**                                    | **Load-Bearing?** | **Why**                                                                 |
  |---------------------------------------------------|-------------------|-------------------------------------------------------------------------|
  | **Secession redraws jurisdiction for third parties** | YES              | Affects all UK citizens (e.g., pensions, trade), not just "spouses."    |
  | **No pre-existing exit procedure**                | YES              | Marriage has legal dissolution machinery; secession relies on contested constitutional principles. |
  | **Boundary problem: Who votes?**                  | YES              | Marriage assumes defined parties; Scotland's electorate excludes Scots outside Scotland/UK citizens in Scotland. |
  | **Asymmetric exit rights**                        | YES              | Only sub-state can secede; England can't "divorce" Scotland unilaterally. |
  | **Assets divided by geography, not contribution** | PARTIALLY        | Weaker: Asset division *could* be negotiated, but geography is fixed (unlike marital property). |
  | **"Children" (citizens) are stakeholders**        | NO (Decorative)  | Both sides invoke citizens' interests; doesn't inherently favor either argument. |

  ---

  ### 3. Smuggled Assumptions
  - **Boundary Problem:** The analogy **presupposes Scotland is the "spouse"**, sidestepping whether Scotland alone constitutes the unit of decision. This is the core dispute in secession debates (e.g., UK-wide vs. Scotland-only vote).  
  - **Neutral Arbiter:** Implies a "divorce court" (e.g., international body) that doesn’t exist. The UK Supreme Court is not neutral—it upholds the state’s constitutional order.  
  - **Agreed Exit Procedure:** Assumes secession is a standardized legal process like divorce, ignoring that unilateral secession lacks clear legal frameworks in most democracies.  

  ---

  ### 4. Do the Conclusions Survive?
  - **"No-fault = Right to Leave":** **No.** The analogy suggests a majority vote *must* dissolve the union, but real-world secession requires negotiation (per Canada’s *Clarity Act*). A vote confers a mandate to negotiate, not an automatic right to exit.  
  - **"Rump state can’t set conditions":** **Fails.** The UK (as the continuing state) controls legal processes, assets, and international recognition—unlike a divorce court, it is a party to the dispute.  
  - **Unionist Counter-Analogy:** **Also fails.** "Children’s interests" (UK citizens) and "asset division" rely on marriage’s fixed rules. Secession has no default formulas—everything requires political negotiation without predefined weights.  

  ---

  ### 5. Better Analogies (Ranked)
  1. **Corporate Restructuring (Spin-Off):**  
     - **Strengths:** Asset/liability division, negotiated terms, shared post-separation interests (e.g., trade), clear process.  
     - **Gap:** Doesn’t resolve the "shareholder problem" (who votes: Scotland or UK?).  
  2. **Condominium Association:**  
     - **Strengths:** Co-owners negotiating separation; shared infrastructure; exit terms bind all parties.  
     - **Gap:** Overlooks national identity/sovereignty; reduces territory to property.  
  3. **Tenant Breaking a Shared Lease:**  
     - **Strengths:** Liability for obligations; landlord’s (UK) consent often required.  
     - **Gap:** Casts Scotland as subordinate (tenant), not equal partner.  

  **Best Fit: Corporate Spin-Off**  
  - **Preserves:** Negotiated separation, ongoing interdependencies, asset division.  
  - **Missing:** Democratic legitimacy ("shareholders" ambiguity) and emotional weight.  

  ---

  ### Final Assessment
  - **The Analogy’s Value:** Purely **emotive/vivid**. It smuggles in untenable assumptions (fixed parties, neutral arbiter) and obscures core constitutional issues.  
  - **Hidden Insight:** It unintentionally highlights the **asymmetry of power**: Scotland cannot unilaterally access a "divorce court," exposing the lack of agreed secession mechanisms in liberal democracies.  
  - **Recommendation:** Use the **corporate spin-off analogy** for structural clarity, but explicitly argue the democratic principles (e.g., "Shareholders must be defined by shared identity, not geography"). The marriage analogy should be discarded—it’s rhetorically potent but analytically bankrupt.
