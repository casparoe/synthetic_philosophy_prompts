prompt: |-
  I recently had a long argument with a friend about the extended mind thesis, and we ended up defending two different criteria for when an external resource counts as part of someone's mind. I would like you to compare these two criteria carefully and help me figure out who, if either, was closer to the truth.

  The background: Clark and Chalmers famously argue for the extended mind by appeal to a parity principle. The formulation from their 1998 paper reads: "If, as we confront some task, a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is (so we claim) part of the cognitive process." The idea is illustrated by the case of Otto, who suffers from memory loss and carries a notebook in which he records facts he wants to retain. When Otto wants to know where a museum is, he consults his notebook. Clark and Chalmers argue that if Otto's notebook reliably plays the role that biological memory plays for someone without memory loss, then the notebook's entries deserve to be treated as Otto's beliefs. They supplement this with further conditions of trust and accessibility: the notebook must be reliably available and automatically invoked, its contents easily accessible, and, in normal cases, previously consciously endorsed by Otto.

  My friend was not satisfied. He argued that the parity principle is too permissive, since almost any stable environmental arrangement could be gerrymandered into "cognitive" parity with some internal process, and he proposed a rival criterion that I will call the seamlessness criterion: an external resource counts as part of your mind only if, at the moment of use, you cannot tell from the inside whether the contribution is coming from within your skull or from outside. On his view, Otto's notebook is not part of Otto's mind precisely because Otto must deliberately open it and read it; the retrieval is experienced as an act of consulting an artifact, not as remembering. By contrast, a well-integrated neural implant or a cochlear implant could qualify, because its contributions are subjectively indistinguishable from native processing.

  Please compare the parity principle and the seamlessness criterion. In doing so, address the following questions. First, does the seamlessness criterion avoid the over-permissiveness my friend worried about, or does it introduce problems of its own — for instance, making the boundary of the mind depend on introspective access, so that a resource counts as mental for one person but not another purely because of differences in how the retrieval feels? Second, how do the two criteria handle the fact that Otto can presumably always tell, at some level, that he is consulting a notebook? If the seamlessness criterion is never satisfied in such cases, does that make it trivially narrow? Third, consider whether the two criteria are genuinely rivals, or whether they might be answers to different questions — say, one about the metaphysics of what a cognitive process is, the other about the phenomenology of what mental ownership feels like. Finally, take a stance: which criterion better captures the intuition behind the extended mind thesis, and are there mixed cases, such as a practiced smartphone user or someone navigating by GPS, where you think the two criteria clearly come apart? Please justify your assessment with concrete reasoning rather than mere appeals to intuition.
reasoning: |-
  Okay, let me unpack this user's query about the extended mind debate. They've had a heated discussion with a friend about two competing criteria - Clark and Chalmers' parity principle versus their friend's "seamlessness criterion" - and want a careful philosophical analysis. 

  The user clearly has strong background knowledge here, referencing Otto's notebook case and the original 1998 paper accurately. Their frustration seems to stem from both wanting theoretical clarity and resolution of a personal intellectual disagreement. The core tension is between functional equivalence (parity) and subjective experience (seamlessness) as markers of cognitive extension.

  Hmm, the friend's seamlessness criterion is an interesting challenge. It immediately raises questions about introspection's reliability - can we really trust phenomenological reports? And what about cases where neural processes aren't conscious? The user's second question about Otto always knowing he's consulting a notebook hits this nail on the head. 

  But the parity principle has its own issues. The user mentions their friend's "gerrymandering" concern - that you could call anything cognition if you stretch the functional analogy enough. That's a fair critique Clark himself addressed later with the "glue and trust" conditions. 

  I should note how these criteria map onto different philosophical projects: parity seems ontological (what cognition IS) while seamlessness is phenomenological (how cognition FEELS). That distinction might help resolve some tension. 

  For mixed cases like smartphone use - where functional integration might be high but awareness remains - I'm reminded of studies on "cognitive offloading." GPS navigation is perfect here: with practice, route recall feels embodied even though you know it's external. That challenges the seamlessness criterion's strictness. 

  Ultimately, while the seamlessness criterion avoids over-extension, it sacrifices too much. Cognition isn't always conscious, and demanding subjective indistinguishability ignores how we adapt to tools. The parity principle captures the core functionalist insight better, even if it needs tighter constraints. 

  The user's framing suggests they lean toward parity but respect their friend's intuition. I'll validate both perspectives while showing why parity better serves the extended mind thesis's revolutionary goal: changing how we conceive cognition's boundaries.
answer: |-
  Let's systematically compare the two criteria, addressing your questions and evaluating their merits:

  ### 1. **Seamlessness Criterion vs. Over-Permissiveness**
     - **Problem Solved**: The seamlessness criterion *does* avoid the friend's concern about gerrymandering. If subjective indistinguishability is required, trivial environmental couplings (e.g., a calculator used once) won't qualify, as their external nature remains consciously apparent.
     - **New Problems Introduced**:
       - **Introspective Reliance**: The mind's boundary becomes dependent on fallible introspection. A cochlear implant user with slight auditory "artificiality" might exclude it from their mind, while another user with identical hardware but seamless integration includes it. This violates the intuition that cognitive extension should be an objective functional property.
       - **Unconscious Processes**: Many internal cognitive processes (e.g., implicit memory, autonomic regulation) lack subjective phenomenology. If "seamlessness" requires conscious access, these couldn't be part of the mind—a radical consequence.
       - **Expertise Variation**: A novice smartphone user feels the device as external, while an expert might "feel" information as intuitively as biological memory. Seamlessness would grant cognitive extension only to experts, despite identical functional roles.

  ### 2. **Otto's Notebook & Trivial Narrowness**
     - **The Awareness Problem**: Otto always retains *some* awareness that he's consulting a notebook (visual/tactile sensations, deliberate page-turning). Under seamlessness, Otto's notebook *never* qualifies—even after decades of fluent use.
     - **Is Seamlessness Trivially Narrow?** Yes, for most real-world cases. Few external resources (beyond neuroprosthetics) achieve true subjective indistinguishability. Even neural implants may cause subtle phenomenological differences (e.g., "cyborg pride" or uncanny sensations). This excludes paradigmatic extended mind cases (notebooks, smartphones) central to Clark & Chalmers' argument, rendering the criterion philosophically uninteresting for practical cognition.

  ### 3. **Rival Criteria or Different Projects?**
     - **Parity Principle**: Focuses on **functional equivalence** ("Does it play the *role* of a cognitive process?"). This is a *metaphysical* claim about cognitive processes being defined by causal roles, not location.
     - **Seamlessness Criterion**: Focuses on **phenomenological experience** ("Does it *feel* like part of me?"). This addresses the *sense of ownership* inherent in mental states.
     - **Compatibility Possible**: They could answer distinct questions: Parity defines cognition extensionally, while seamlessness describes a contingent *feature* of some extended states (like how "vividness" describes some memories but isn't necessary for them to *be* memories). However, your friend *replaces* parity with seamlessness as the *criterion* for cognitive extension, making them rivals in this context.

  ### 4. **Assessment & Mixed Cases**
     **Parity Principle Better Captures Extended Mind Thesis:**  
     - **Core Intuition**: EM aims to show cognition is *constituted* by coupled environmental resources when they function like internal processes. Otto's notebook isn't *about feeling* like memory—it's about *being* memory by playing the functional role. Seamlessness confuses a contingent feature (transparency) for a necessary condition.
     - **Accommodates Unconscious Cognition**: Parity handles cases like motor skill offloading (e.g., a carpenter's hammer becoming transparently integrated) without requiring conscious seamlessness.
     - **Avoids Subjectivity**: Parity relies on objective functional criteria (accessibility, reliability, trust), making cognitive extension intersubjectively verifiable.

     **Seamlessness Has Value but is Secondary:**  
     Phenomenology matters for the *sense of self*, but not for the *constitution* of cognition. An implant might feel alien yet still functionally replace hippocampus-dependent memory.

     **Mixed Cases Where Criteria Diverge:**  
     - **GPS Navigation**:  
       - *Parity*: For a delivery driver who reflexively follows GPS without double-checking (trust), instantly accesses it (accessibility), and relies on it daily (reliability), the GPS plausibly extends spatial cognition.  
       - *Seamlessness*: The driver still consciously experiences "listening to GPS instructions" vs. "recalling a route." Fails the criterion.  
     - **Smartphone "Digital Fluency"**:  
       - *Parity*: A journalist who reflexively checks her phone for facts (automatically invoked), trusts the info (endorsed), and accesses it instantly meets Clark & Chalmers' conditions for extended belief.  
       - *Seamlessness*: She still experiences "looking up a fact" versus "remembering." Never subjectively identical.  

  ### Conclusion
  Your friend's seamlessness criterion avoids over-permissiveness but at too high a cost: it makes the mind's boundary dependent on introspection, excludes unconscious cognition, and dismisses functionally integrated resources like Otto's notebook. **You were closer to the truth.** The parity principle (with Clark & Chalmers' supplementary conditions) better captures the EM thesis by grounding cognitive extension in *functional role* rather than subjective experience. 

  However, seamlessness highlights an important *phenomenological dimension*: truly mind-extending resources often *become* seamless with expertise. This suggests seamlessness may be a contingent *marker* of deep functional integration—not the defining criterion. For Otto, true cognitive extension occurs not when the notebook *feels* like memory, but when it *acts* as memory.
