answer: |-
  Here's a concise argument focusing on the group-theoretic obstruction as the core issue:

  **The Core Argument:**

  Banach-Tarski (BT) demonstrates the impossibility of defining a finitely additive, rotation-invariant measure on *all* subsets of the sphere \(S^2\). This impossibility is a direct consequence of the **non-amenability** of the rotation group \(SO(3)\), manifested concretely by the presence of a free subgroup \(F_2 \cong \langle a, b \rangle\) within it.

  1.  **The Measure-Theoretic Ideal:** Suppose a measure \(m\) existed on *all* subsets of \(S^2\) that was:
      *   **Finitely Additive:** \(m(A \cup B) = m(A) + m(B)\) for disjoint \(A, B\).
      *   **Rotation-Invariant:** \(m(\rho A) = m(A)\) for any rotation \(\rho \in SO(3)\).
      *   **Normalized:** \(m(S^2) = 1\).
      This measure would directly rule out any paradoxical decomposition. A paradox requires partitioning \(S^2\) into finitely many pieces \(A_1, ..., A_n\) and finding rotations \(\rho_1, ..., \rho_n\) such that the rotated pieces form *two* disjoint copies of \(S^2\). Finite additivity and invariance force:
      \[
      1 = m(S^2) = \sum_{i=1}^n m(A_i) = \sum_{i=1}^n m(\rho_i A_i) = m(\text{copy 1}) + m(\text{copy 2}) = 1 + 1 = 2
      \]
      a clear contradiction. BT shows no such measure exists.

  2.  **The Group-Theoretic Obstruction (Non-Amenability):** Why does this measure fail? The standard proof crucially uses a free subgroup \(F_2 \cong \langle a, b \rangle\) of rotations. \(F_2\) is **non-amenable**. Amenability means the group admits a finitely additive, invariant probability measure on *all* its subsets. Non-amenability means it does *not*. This group-theoretic pathology translates directly to the sphere:
      *   The orbits of the \(F_2\) action on \(S^2\) partition the sphere.
      *   Non-amenability of \(F_2\) implies the **orbit equivalence relation** itself lacks a certain "measurability". It forces the paradoxical decomposition: you can partition the orbits (and thus the sphere) into sets \(A, B, C, D\) such that \(aA \cup bC\) and \(aB \cup bD\) *each* reconstruct essentially another full set of orbits, forming two copies of the sphere.
      *   **Connection:** The inherent "paradoxicality" of the *group* \(F_2\) (its inability to be measured nicely) is *lifted* to the sphere via its action. If \(F_2\) were amenable, this lifting would be compatible with an invariant measure on the sphere. Its non-amenability makes the invariant measure impossible and the paradox inevitable.

  3.  **The Role of Axiom of Choice (AC):** AC's primary role here is set-theoretic "bookkeeping":
      *   It guarantees a choice function exists to select a single point (an "orbit representative") from each orbit of the \(F_2\) action. This is essential for rigorously defining the pieces \(A, B, C, D\) in the decomposition by grouping orbits together based on the "words" in \(F_2\) needed to reach the representative.
      *   While necessary for the *standard construction*, AC doesn't *cause* the paradox. It merely facilitates the formal demonstration of the paradoxical decomposition inherent in the structure defined by the non-amenable group action.

  4.  **The Local Cost - Restricting the Measure:** The genuine mathematical "cost" revealed by BT is not the use of AC, but the **impossibility** of extending the "nice" (countably additive, rotation-invariant) Lebesgue measure on the Borel sets to a finitely additive measure on *all* subsets. We avoid the paradox not by rejecting AC, but by accepting that our measure domain must be restricted (e.g., to the Borel or Lebesgue-measurable sets), precisely because the full power set contains sets whose paradoxical nature is mandated by the non-amenability of \(SO(3)\).

  **Conclusion:** Banach-Tarski is fundamentally a theorem about the structure of the rotation group \(SO(3)\). Its paradoxical decomposition is a direct consequence of \(SO(3)\) containing a non-amenable subgroup (\(F_2\)). This non-amenability *forces* the nonexistence of a finitely additive, rotation-invariant measure on all subsets of the sphere. AC is a tool used to rigorously construct the decomposition from the group action, but the core phenomenon is the group-theoretic property of non-amenability and its measure-theoretic implication. The lesson is that the natural domain for a "geometric" measure on the sphere cannot be all subsets – a restriction necessitated by the group's structure, not by set theory's axioms alone.
