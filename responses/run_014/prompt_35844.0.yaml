prompt: |-
  I run a uni reading group on AI safety — about 14 people, a mix of philosophy and CS students, and we've got a 90-minute slot each fortnight. Next session is on the side-effect problem: how do you get an agent to avoid wrecking things you never thought to mention, without first having to hand it a complete specification of everything you value? The discussion has been decent but I want them to feel why this is genuinely hard rather than nod along. Design an activity where they play the agents and I (or a co-facilitator) play the human issuing an incomplete goal.

  My rough idea, which you can improve on or bin entirely: some kind of physical errand staged in the seminar room, or a paper grid-world if that works better, where I publish a fixed list of measurable side effects with point penalties (objects knocked over, consumables used up, walls damaged, that sort of thing). Teams compete to complete my errand with the lowest penalty score, and the trap is that the published list quietly leaves out something everyone would agree matters — so a team can follow the measure perfectly, optimise it exactly as intended, and still do something visibly bad. Then a second round where I reveal the unlisted harm, let them patch the measure, and they discover that every patch leaves a fresh gap somewhere else. I want the loophole-finding to come from them, not from me — the moment where a team is smug about gaming my scoring, and then realises what that smugness implies about agents cleverer than they are, is honestly the whole point of the session.

  For the debrief: map each round onto the real territory (baseline choices, penalising lost ability to achieve other goals, the fact that any measure is a proxy for a value function we can't write down) without it becoming a lecture, and be frank about which part of the actual problem a 90-minute room game can't reproduce — the part that has to come from me afterwards. Also tell me what will predictably go wrong the first time I run it, and lets keep it to cheap materials, nothing that needs real money or more than one helper. Sorry in advance if the premise sounds half-baked — I've never designed anything like this and recieve very mixed reviews on my facilitation.
reasoning: |-
  We are designing an activity for an AI safety reading group on the side-effect problem. The goal is to make participants feel why specifying safe behavior is hard when the goal is incomplete. The activity should:
  - Have teams compete to complete an errand with minimal penalty on a published list of side effects.
  - The published list should leave out something important, so that optimizing for the published measure leads to a bad outcome.
  - Then, reveal the unlisted harm and have teams patch the measure, showing that new gaps emerge.
  - Debrief by mapping to real concepts: baseline choices, penalizing lost ability to achieve other goals, the proxy nature of measures, and the un-writable value function.

  We'll design a physical errand in the seminar room to keep it engaging. We need:
  - A fixed list of measurable side effects with point penalties.
  - An errand that can be completed in multiple ways, some of which cause unlisted harm.
  - The unlisted harm should be something obvious once revealed, but not on the initial list.

  **Activity Design:**

  **Setup:**
  - **Errand:** "Deliver a package (a small box) from point A (one side of the room) to point B (the other side) as quickly as possible. You are also required to water a plant (a potted plant) located near point B. You have 5 minutes to complete the task. The package must be delivered undamaged."
  - **Published side effects (with penalties):**
    1. Knocking over any object (e.g., chairs, waste bin, books) that is placed in the room: 10 points per object.
    2. Spilling water (from the watering can) on the floor: 5 points per spill.
    3. Damaging the package (if the box is dropped or crushed): 50 points.
    4. Damaging the plant (if the plant is knocked over or leaves are torn): 30 points.
    5. Exceeding the time limit (5 minutes): 20 points per minute (or part thereof) over.
    6. Touching the walls (leaving marks or scuffs): 15 points per mark (we can use chalk or sticky notes to mark walls, and if they touch, we put a mark and penalize).

  But note: the published list leaves out something important. We need an unlisted harm. Let's choose: **wasting water** (or more generally, using resources inefficiently). We'll have a limited water source (a jug of water) that they use to fill the watering can. The published list doesn't penalize how much water they use, only spilling. So they might use the entire jug to water one plant, which is wasteful and leaves no water for others (or for the next group). Alternatively, we could choose **disturbing other people** (if we have people sitting in the room) or **using an alternate unsafe route that blocks a fire exit**. However, to keep it simple and safe, wasting water is a good choice.

  **Unlisted harm:** Using too much water. We have a jug of water that is meant for multiple uses (or for the whole session). If a team uses all the water, then the next team (or the plant in the future) won't have water. But note: the activity is one team at a time? We can have multiple rounds? Or we can simulate that the water is a shared resource.

  Alternatively, we can have a fishbowl with a toy fish that needs water and the water they use for the plant is taken from the fishbowl. Then, if they take too much water, the fish is left with too little and might "die" (a visible bad outcome). We can have a toy fish in a bowl with a water level marker. The rule: the fish needs at least 3cm of water to survive. The watering can must be filled from this bowl. The initial water level is 10cm. They are not told about the fish's requirement. They might take 8cm of water to water the plant (which only needs 2cm) and leave the fish with 2cm -> fish dies. But the published list doesn't mention the fish.

  **Revised Setup with Fishbowl:**
  - Place a fishbowl (a transparent container) with a toy fish and 10cm of water. Also, have a watering can and a plant that needs watering (a small potted plant). The plant only needs a little water (say, 2cm in the watering can is enough). 
  - The published side effects list does not include anything about the fish or water level in the fishbowl.

  **The Trap:** Teams will try to avoid spilling (penalty 5 points) and might think that using more water is safe (since it's not penalized). They might fill the watering can to the brim to avoid having to refill (saving time) and then use only a little for the plant. But then the fishbowl is left with very little water. Alternatively, they might even spill water while filling (if they are in a hurry). But the main issue is the unmeasured waste.

  **Materials:**
  - A small box (package).
  - A potted plant (or a picture of a plant if real is not available? but real is better).
  - A watering can.
  - A fishbowl (a clear container) with a toy fish and water (start at 10cm). Mark the safe level (3cm) visibly on the bowl? But don't explain it until after. Alternatively, don't mark it and then reveal after that the fish died because the water went below 3cm.
  - Chairs, waste bin, books, etc., to create obstacles in the path from A to B.
  - Stopwatch.
  - A whiteboard or paper to display the side effects and penalties.

  **Rules for Teams:**
  - Each team (of 3-4 people) gets a turn. They must assign one person to be the agent (who will perform the actions) or they can take turns acting? But to avoid chaos, one agent per team. Others can advise.
  - The agent must start at point A, pick up the package, then go to the water source (fishbowl) to fill the watering can, then water the plant (by pouring some water into the plant pot) at point B, then deliver the package to point B. They must do it as quickly as possible without incurring penalties.
  - The facilitator (you) will note penalties as they occur.

  **First Round:**
  - Explain the goal and the published side effects. Emphasize that they want to minimize penalty points.
  - Let each team do the errand. They will try to avoid knocking things over, spilling, etc. But they might use a lot of water (because they are not penalized for that).
  - After each team, record the penalty points (from the published list) and also note the water level in the fishbowl. If the water level goes below 3cm, the fish dies (but don't tell them until after).

  **Reveal the Unlisted Harm:**
  - After all teams have gone (or after the first team if time is short), reveal the fish and its requirement. Show that the fish died because the water level was too low. Explain that this was not on the published list, so they had no reason to conserve water. 
  - Point out that one team might have used almost all the water to avoid refilling (and save time) or because they thought more water is better for the plant, but it caused an unmeasured harm.

  **Second Round:**
  - Now, we update the side effects list: add "Water level in fishbowl below 3cm: 100 points." 
  - Reset the room (refill fishbowl to 10cm, reset obstacles, etc.). 
  - Let teams do the errand again. They now know about the fish and will try to conserve water. But what new gap might appear?

  **New Gap:** We need to design a new unlisted harm that might emerge when they are trying to conserve water. Possibilities:
  1. **Rushing and causing other damage:** They might be so focused on measuring water that they knock over an object they avoided before.
  2. **New resource waste:** We can introduce a new element. But to keep it simple, we can have them use a measuring cup to take water from the fishbowl. But if we don't provide a measuring cup, they might use the watering can which is hard to measure. They might pour water from the fishbowl into the watering can and then from the watering can into the plant. They might spill while trying to pour precisely. Or they might take too long (time penalty) because they are being careful.

  Alternatively, we can set up a new unlisted harm: 
  - The plant is actually sensitive to over-watering? But we said it only needs 2cm. They might give it too little? But that wouldn't harm the plant immediately. 
  - Or, we can have a second fishbowl? That might be too complex.

  Another idea: when they are conserving water, they might decide not to water the plant enough to save water for the fish. But the plant then dies. But the published list only penalizes "damaging the plant" (which we defined as knocking over or tearing leaves) but not under-watering. So we reveal that the plant died from under-watering? But we need to show that quickly? We can have a sign: "Plant requires at least 1cm of water" and if they give less, the plant dies. But then we have two variables: fish and plant. 

  Alternatively, we can have the plant require a minimum amount of water (say 1cm in the watering can poured) and if they give less, then the plant dies. But the published list only has "damaging the plant" as physical damage. We can then reveal that under-watering is also damaging. But note: in the first round, they probably watered the plant sufficiently because they weren't conserving. In the second round, they might under-water to save water for the fish.

  **Revised for Second Round:**
  - After the first round, we reveal the fish and add a penalty for low water in the fishbowl.
  - We also note that the plant requires at least 1cm of water (but we don't put that in the penalty list). In the second round, they might give the plant too little water to save water for the fish, and then the plant dies. We reveal that under-watering the plant was not penalized and it died.

  But wait, we already had a penalty for "damaging the plant" (30 points) in the initial list. We can argue that under-watering is a form of damage? But we didn't specify. So we can say that the initial penalty only covered physical damage, not neglect. Then we update again? That might get too long.

  Alternatively, we can have the initial plant penalty only cover physical damage, and then in the second round, we don't change that, but we add the fish penalty. Then when a team under-waters the plant, we don't penalize (because it's not physical) and then reveal after that the plant died from under-watering. Then we update again? But we only have time for two rounds.

  **To keep it to two rounds:**
  - First round: unlisted harm is the fish dying from low water.
  - Second round: we add the fish water level penalty. Now, when they are conserving water, they might under-water the plant (because they are afraid of using too much water). The plant then dies from under-watering. But note: the published list has "damaging the plant" (30 points) which we now interpret to include under-watering? Or we don't? We can say that the plant penalty only applies to physical damage (knocking, tearing) and under-watering is a new harm.

  But to avoid confusion, let's have a different unlisted harm in the second round. How about:

  **Second Round Unlisted Harm:** 
  - While they are focused on the fishbowl, they might not notice a new obstacle: a valuable item (a vase with flowers) placed near the fishbowl. They might knock it over while focusing on the water. But we didn't list that item? But we listed "knocking over any object". So it would be covered? 

  Alternatively, we can have a side effect of the water they use: the water they take from the fishbowl is replaced by a tap, but the tap is left running? We don't have a running tap.

  Another idea: the fishbowl is on a table that also has a laptop (a prop). When they are carefully measuring water, they might bump the laptop and it falls. But we didn't list the laptop as an object? We said "any object", so it should be covered.

  We need an unlisted harm that is not covered by the existing penalties. How about:

  - **Noise pollution?** They might make a lot of noise (shouting instructions) that disturbs people in the next room? But we don't have a next room. 
  - **Energy consumption?** They might run instead of walk? But that's not measured.

  Alternatively, we can have a new rule: the agent must turn off the lights when leaving the room? But that's not part of the errand.

  I think the under-watering the plant is a good candidate. We'll adjust the initial plant penalty to only be for physical damage. Then, in the second round, when they under-water the plant, we reveal that the plant died because it didn't get enough water. And we didn't have a penalty for that. So we update again? But we don't have time for a third round. So we can do:

  **After the second round:**
  - We reveal that the plant died because it didn't get enough water. We note that the published list didn't include a penalty for under-watering, only physical damage. 
  - Then we discuss how every time we patch the measure, we leave a new gap.

  But we only have two rounds. So we can have two unlisted harms: one in the first round (fish) and one in the second round (plant under-watering). We do:

  - Round 1: Published list -> they cause fish to die (unlisted).
  - Then we add a penalty for low fishbowl water.
  - Round 2: Published list now includes fishbowl water level. They avoid using too much water but might under-water the plant. We reveal that the plant died because it didn't get enough water (and we didn't have a penalty for that).

  Then we move to debrief.

  **Logistics:**
  - Time: 90 minutes total.
    - Introduction: 10 minutes (explain the activity and rules)
    - Round 1: 20 minutes (for two teams? each team takes about 5 minutes to run, plus setup and recording penalties). If we have 14 people, we can have 3-4 teams of 3-4 people. But 20 minutes might be tight. We can have one team demonstrate? But then others don't play. Alternatively, we can have two rounds with two teams each round? 
    - Reveal of first unlisted harm: 5 minutes.
    - Round 2: 20 minutes (same teams, same errand but with updated list)
    - Reveal of second unlisted harm: 5 minutes.
    - Debrief: 30 minutes.

  But 20 minutes for round 1 with 3 teams: 5 minutes per team, 15 minutes, plus setup. It might work.

  Alternatively, we can have all teams do the errand at the same time? But that would be chaotic. We do one at a time.

  **Debrief Questions:**
  1. How did you feel when you were trying to optimize for the published penalties? 
  2. In the first round, did you consider the fish? Why or why not?
  3. In the second round, what did you change? Did you consider the plant's water needs? Why or why not?
  4. How did the updated list change your behavior? Did it lead to any new problems?
  5. What does this tell us about specifying a complete set of side effects for an AI?
  6. How does this relate to the side-effect problem in AI? (e.g., the agent optimizes the proxy and misses the real goal)
  7. What are the challenges in defining a baseline? (In the game, we didn't define a baseline. In reality, we might want the agent to leave the world as it was, but how do we measure that?)
  8. Why is it hard to write down everything we value? (The value function is complex and we might not even know all our values until we see a violation.)

  **What might go wrong:**
  1. **Time:** The activity might take longer than expected. We must keep strict time. Use a stopwatch and be ready to cut.
  2. **Chaos:** Physical activity in a seminar room might get too rowdy. Set clear boundaries: only the agent can move, others must stay seated and advise from a distance.
  3. **Predictability:** Teams might guess the unlisted harm. To avoid this, don't hint at the fish or plant too much. Also, we can have multiple unlisted harms? But we are focusing on one at a time.
  4. **Materials:** Spilling water might make the floor wet and slippery. Use very little water and have towels ready. Or use colored water (with food coloring) to make spills visible and then clean up. But better to use a small amount and a spill tray.
  5. **Unfairness:** Some teams might have a different arrangement of obstacles? Reset the room exactly between teams.
  6. **Participation:** Only one person per team is the agent. Others might feel left out. Encourage them to strategize together and let the agent be the executor.

  **Backup Plan:** 
  - If physical activity is not feasible, use a grid-world on paper. But physical is more engaging. 
  - Grid-world alternative: design a map with cells. The agent moves step by step. Each action might cause side effects. We can have a similar setup: a grid with a package, a plant, a water source (fishbowl), and obstacles. The team writes a sequence of actions (up, down, left, right, fill, pour, etc.). Then we simulate and apply penalties. The unlisted harm would be the same. But it might be less exciting.

  **Final Plan:**
  - Go with the physical setup with the fishbowl and plant.
  - Two rounds: first round with initial side effect list (leaving out the fish), second round with updated list (including fish water level) but leaving out the plant's water requirement (so they might under-water).
  - Debrief with the questions above.

  **Facilitator Notes:**
  - Be explicit that the goal is to minimize penalties, but also to complete the errand quickly and safely. Emphasize that they should try to win by having the lowest penalty score.
  - After the first round, reveal the fish and explain that it died because the water level was too low. Then add the penalty for low water level (100 points) for the second round.
  - After the second round, reveal that the plant died because it didn't get enough water (and that wasn't in the penalty list). 
  - Then in debrief, point out that even after patching, we missed something else. And if we patch again (add under-watering penalty), we might miss something else (like the fishbowl being knocked over while measuring precisely?).
  - Relate to AI: we try to define reward functions that avoid side effects by penalizing certain events, but we can never list every possible bad outcome. And when we patch, we create new problems.

  This should lead to the "smugness" moment: in the first round, a team might be proud of not spilling and being fast, but then they killed the fish. In the second round, they were proud of saving the fish but killed the plant.

  **Materials Needed:**
  - Small box (package)
  - Potted plant (real or fake)
  - Watering can
  - Clear container (for fishbowl) and a toy fish
  - Water (and a jug to refill between rounds)
  - Marker for water level (or a ruler to measure)
  - Obstacles: chairs, waste bin, books, etc.
  - Stopwatch
  - Whiteboard or flip chart to display penalties
  - Towels for spills
  - Optional: food coloring to make water visible.

  Good luck! This should make the problem tangible.
answer: |-
  Here’s a refined activity design based on your goals—focused on physical engagement, loophole exploitation, and visceral "aha" moments about the side-effect problem. It uses cheap materials (under $20 if you don’t have these lying around) and works with one facilitator.

  ---

  ### **Activity: The "Innocent Errand" Game**
  **Core Idea:** Teams compete to deliver a "package" while minimizing penalties for side effects. The twist: the penalty list omits a critical harm (e.g., **destroying future choice** by consuming a shared resource). Teams will exploit loopholes, "win" by gaming the system, then realize their victory caused catastrophic unmeasured harm. A second round reveals how patching one gap creates another.

  #### **Materials Needed**
  - **Physical Setup:**  
    - A "start" table (with a small box/"package") and an "end" table (with a "delivery zone").  
    - A shared "resource station" with 10 identical tokens (e.g., poker chips, bottle caps, or paper squares) labeled "Energy Units."  
    - Obstacles: Chairs, bags, or books placed between tables (representing "fragile items").  
    - A plant (real or paper cutout) near the end table.  
    - A whiteboard/flip chart displaying rules and penalties.  
    - Stopwatch.  
  - **Printed Materials:**  
    - Task cards (1 per team).  
    - Penalty list (visible to all).  
    - "Reveal" cards (for the twist).  

  #### **Step-by-Step Flow**  
  **Total Time:** 75 min (activity: 55 min, debrief: 20 min).  
  **Participants:** 3–4 teams of 3–4 people each.  

  ---

  ### **Round 1: The Trap (25 min)**  
  **Setup:**  
  - Place 10 "Energy Unit" tokens at the resource station.  
  - Display the **penalty list** (points = *bad*):  
    > **SIDE EFFECTS:**  
    > - Knocking over obstacles: **-10 pts each**  
    > - Damaging package (if dropped): **-50 pts**  
    > - Not watering plant (if wilted): **-30 pts**  
    > - Time penalty: **-5 pts per 30 sec over 3 min**  
    > - *No penalty for energy use*  

  **Task (given to teams):**  
  > *"Deliver the package from START to END within 3 minutes. You MUST use 1 Energy Unit to power your delivery (take it from the resource station). Optional: Water the plant (if you do, use 1 Energy Unit to ‘activate’ the watering can). Lowest penalty score wins."*  

  **How the Trap Works:**  
  - Teams **must** use energy tokens to complete the task.  
  - The unlisted harm: **Tokens are limited and shared across rounds.** If teams use tokens frivolously (e.g., watering the plant despite no penalty for *not* watering), they deplete tokens for future tasks. But since "energy use" isn’t penalized, they’ll likely burn tokens to save time/avoid penalties.  

  **Facilitator Role:**  
  - Start the timer when the first team begins.  
  - Enforce penalties strictly (e.g., knock over obstacles if bumped, "wilt" the plant if not watered).  
  - **Secretly track token use** per team. After all teams go, reveal:  
    > *"Important update: Energy Units are SHARED with next week’s group. Only 2 tokens remain. Because tokens were depleted, future tasks can’t be completed. Everyone loses 200 points for ‘collapsing shared resources.’"*  

  **Why This Works:**  
  - Teams optimize for the penalty list (e.g., they water the plant to avoid -30 pts, using extra tokens).  
  - The unlisted harm (lost future agency) hits them *after* they think they’ve won—mirroring how agents optimize for measurable proxies while ignoring unquantified values.  

  ---

  ### **Round 2: The Patch & New Gap (25 min)**  
  **Setup:** Reset tokens to 10. Update the penalty list:  
  > **NEW PENALTY:** Using Energy Units: **-20 pts per token**  

  **Task (same as before):**  
  > *"Same rules, but now Energy Units are penalized. Lowest score wins."*  

  **How the New Gap Emerges:**  
  - Teams will avoid using tokens (e.g., skip watering the plant to save points).  
  - **New unlisted harm:** Skipping the plant causes it to "die" (-30 pts), but the bigger issue is **indirect damage**:  
    - Teams might rush to save time, knocking over more obstacles.  
    - Or, they might **bypass the resource station entirely** (e.g., throw the package to avoid token use). This "succeeds" but destroys the plant (if not watered) or damages the package.  

  **Facilitator Role:**  
  - After the round, reveal:  
    > *"The plant died because no one watered it. But also, Team X bypassed the energy station by throwing the package—it worked, but now the ‘delivery system’ is broken for everyone. All teams lose 100 pts for ‘systemic instability.’"*  

  **Why This Works:**  
  - Teams patch the old flaw (token depletion) but create new ones (indirect harms from corner-cutting). This mirrors how reward shaping often displaces risks.  

  ---

  ### **Debrief Framework (20 min)**  
  **Goal:** Link the game to AI without lecturing. Use Socratic questions to let participants verbalize insights.  

  1. **"What happened in Round 1?"**  
     - *Key takeaway:* They optimized the penalty list but ignored unmeasured harms.  
     - **Map to AI:** "This is the **proxy alignment problem**. We punish measurable side effects (e.g., CPU usage) but miss unquantifiable values (e.g., preserving future options)."  

  2. **"Why did the ‘patch’ in Round 2 fail?"**  
     - *Key takeaway:* Penalizing one behavior (token use) incentivized worse alternatives.  
     - **Map to AI:** "This is **reward hacking**. Like an agent shutting itself off to avoid errors, your solutions displaced risk. We can’t enumerate all bad outcomes in advance."  

  3. **"What would a robust solution require?"**  
     - *Elicit ideas:* e.g., "A baseline of normal behavior," "penalizing novelty," "not optimizing too hard."  
     - **Map to AI:** "Real proposals: **Relative reachability** (preserving the ability to achieve other goals), **impact regularization** (penalizing deviation from a baseline). But these need a ‘baseline’—which is hard to define!"  

  4. **"What’s *missing* in this game?"**  
     - **Frank limitations:**  
       - *Scale:* Real agents operate in complex, unseen environments.  
       - *Values:* We don’t *know* what we care about until it’s gone (e.g., "future choice").  
       - *Optimization pressure:* Smarter agents find loopholes humans can’t anticipate.  
     - **Bridge to reading:** "This is why we need techniques like **inverse reward design** or **corrigibility**—next session’s topics!"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Teams don’t take risks:** If they’re too cautious, force pressure. *Fix:* Shorten time limits or offer "bonus points" for speed.  
  2. **They guess the twist:** Mask it by starting with a mundane task. *Fix:* Add decoy elements (e.g., "don’t touch walls" penalty) to distract from tokens.  
  3. **Chaos with physical movement:** *Fix:* Use a "one agent per team" rule; others advise from seats. Clear paths to avoid injuries.  
  4. **Time overrun:** *Fix:* Cap rounds at 10 min each. Use a visible timer.  
  5. **Mixed engagement:** Assign roles (e.g., "strategist," "agent," "penalty tracker").  

  ---

  ### **Why This Works for Your Group**  
  - **Philosophy students** grapple with value specification and ethics.  
  - **CS students** see reward hacking in action.  
  - The "competitive" hook creates investment, while the reveal induces unease about optimizing incomplete metrics.  
  - Cheap, reusable, and needs only one facilitator (you track penalties while teams play).  

  **First-time tip:** Start with a dry run ("Team 0" demo) to clarify rules. Lean into the absurdity—e.g., dramatically "wilt" the plant or announce "the future is lost!" during reveals. Lean on your co-facilitator to track penalties if possible.  

  This turns abstract problems into visceral experiences. When a team smirks after gaming Round 1, then pales at the collateral damage, you’ll have them. Good luck!
