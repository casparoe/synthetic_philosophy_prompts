  | Requirement                          | Why it matters                                                                 | Test case                           | Status              |
  |--------------------------------------|--------------------------------------------------------------------------------|-------------------------------------|---------------------|
  | **Statewise Pareto Improvement**     | Ensures no one is harmed ex post, even with bad luck. "Improvement" must hold in all possible states, not just in expectation. | Rescheduling: Blocks if any state leaves someone worse off. | Non-negotiable     |
  | **Informed Preference Satisfaction** | Preferences must align with full knowledge (not myopia/misjudgment). Bot must model what individuals *would* want if informed. | Trade: Blocks if consent relies on misjudged future behavior. | Non-negotiable     |
  | **Baseline Non-Manipulation**        | Prevents bot from inventing threats to "solve." Baseline must be the true status quo without bot interference. | Helpful threat: Blocks invented baselines. | Non-negotiable     |
  | **Ex Ante Consent**                  | Respects autonomy: Changes require unanimous agreement *beforehand* based on available information. | All cases: Ensures voluntary participation. | Non-negotiable     |
  | **No Ex Post Regret**                | Avoids irreversible harm. If an action risks ex post harm (even with ex ante consent), it must be compensatable or reversible. | Rescheduling: Forces compensation for bad luck (e.g., insurance). | Negotiable         |
  | **Preference Consistency Over Time** | Preferences must be dynamically consistent (no time-based contradictions). Bot must reject changes exploiting temporary irrationality. | Trade: Blocks if preference reversal is predictable. | Non-negotiable     |
  | **Decision-Theoretic Coherence**     | Must align with stochastic dominance: If option A is better in all states than B, it’s strictly preferred. Rules out intransitive or self-contradictory choices. | Rescheduling: Ensures statewise improvements dominate. | Non-negotiable     |
  | **Non-Circular Welfare Definitions** | Welfare must be defined via revealed preferences (observable choices), not bot’s subjective judgment. Prevents bot from "defining" harms into existence. | Helpful threat: Baseline must be observable, not theoretical. | Non-negotiable     |
