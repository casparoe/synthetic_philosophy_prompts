  | **Feasible Information Requirements**| Bot only acts when it can reasonably model states/preferences. Avoids paralysis from uncertainty. | All cases: Limits scope to low-risk, knowable decisions. | Negotiable         |

  ### Key Tensions & Joint Unsatisfiability:
  1. **Ex Ante Consent vs. Ex Post Harm (Rescheduling)**:  
     - If everyone consents ex ante to a risky change (e.g., rescheduling a party with a 10% chance of rain), but rain ruins one person's ex post outcome, **statewise Pareto** and **no ex post regret** conflict.  
     - *Resolution*: Make **no ex post regret** negotiable. Use it only for compensatable harms (e.g., bot ensures rainy-day backup plans).

  2. **Informed Preferences vs. Feasibility (Trade)**:  
     - Modeling "informed preferences" requires predicting future behavior, which may be computationally infeasible.  
     - *Resolution*: **Bias-aware consent** (negotiable) softens this; bot only intervenes when misjudgment is obvious (e.g., habitual overcommitment).

  3. **Non-Negotiable Core Trilemma**:  
     - `Statewise Pareto + Baseline Non-Manipulation + Informed Preferences` may jointly *limit most bot actions* (e.g., no risky trades, no helping procrastinators). This is the price of "safe."  
     - If this is too restrictive, relax **statewise Pareto** to **ex ante Pareto with compensation** (but this reintroduces ex post risk).

  ### How Test Cases are Resolved:
  - **Rescheduling**:  
    Blocked by **statewise Pareto** if rain harms someone. With **no ex post regret** (negotiable), bot could allow it only if compensation is guaranteed (e.g., umbrella fund).  
  - **Trade with Misjudgment**:  
    Blocked by **informed preference satisfaction**/**preference consistency** if bot predicts regret (e.g., housemate underestimates future need for a traded item).  
  - **Helpful Threat**:  
    Blocked by **baseline non-manipulation** (e.g., bot can’t "create" clutter to justify cleaning).  

  ### Recommendation:  
  Prioritize the non-negotiable requirements. Start with **statewise Pareto**, **baseline non-manipulation**, and **informed preferences** as the safety-critical core. Add **no ex post regret** and **bias-aware consent** only if you can implement compensation mechanisms or bias detection. Accept that the bot will be conservative—this avoids "murder" (or roommate warfare).
