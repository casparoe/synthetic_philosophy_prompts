  ### The Principle Behind Your Verdicts

  Your verdicts stem from a unified principle that maximizes the probability of achieving your **true objective** in each scenario, with the objective varying based on context. This principle incorporates three distinct clauses, each addressing a specific type of scenario. The key insight is that your behavior optimizes for different *goals* (e.g., long-term growth, avoiding ruin, hitting a target) rather than adhering to a single mathematical rule like expected log wealth. Below, I state the principle precisely, map it to your cases, identify any mismatches, and apply it to a new test case.

  ---

  ### The Core Principle
  **Act to maximize the probability of achieving your dominant objective, where:**
  1. **For open-ended repetition (indefinite future bets):**  
     The objective is *survival and long-term growth*. Maximize the expected logarithm of wealth. This ensures no risk of ruin and optimal growth over time.  
     *Why?* In repeated bets, maximizing expected log wealth (growth rate) guarantees the highest probability of long-term success by avoiding strategies that risk depletion.

  2. **For single or finite bets with no explicit goal:**  
     The objective is *robust capital preservation*. Limit the maximum loss to a fixed fraction (e.g., 10%) of current wealth, and within that constraint, maximize expected value.  
     *Why?* Single bets lack the "averaging" effect of repetition. To prevent catastrophic losses that could impair future opportunities, you cap risk exposure and then seek upside.

  3. **For goal-specific scenarios (e.g., clearing a debt):**  
     The objective is *hitting a predefined wealth target*. Maximize the probability of reaching that exact target by the deadline, ignoring growth rates or expected values.  
     *Why?* When a goal is binary (e.g., pay a debt or face ruin), optimal growth strategies may overexpose you to short-term failure.

  ---

  ### Mapping to Your Verdicts
  | Case | Your Verdict | Principle Clause | Match? | Why It Works |
  |------|--------------|------------------|--------|-------------|
  | **1** (60-40 coin, infinite flips, even money, any fraction) | Stake 20% | Clause 1 (maximize expected log wealth) | ✅ | 20% is the Kelly fraction: it maximizes long-term growth rate. |
  | **2** (Same coin, exactly 3 flips) | Stake 20% | Clause 1 (maximize expected log wealth) | ✅ | Kelly betting is myopic: optimal fraction is horizon-invariant for independent, identical bets. |
  | **3** (New coin: +50% on heads, -40% on tails, infinite flips, entire bankroll) | Refuse | Clause 1 (maximize expected log wealth) | ✅ | Expected log wealth is negative: 0.5·log(1.5) + 0.5·log(0.6) ≈ -0.052. Ruin is certain long-term. |
  | **4** (Same as Case 3, one flip only) | Take it | Clause 2 (maximize EV, but only with loss ≤10%? **Mismatch** → see below) | ❗ | Clause 2 allows it (expected value >1: 0.5·1.5 + 0.5·0.6 = 1.05), but your loss cap (10%) is violated (40% loss possible). This is the outlier. |
  | **5** (One-shot bet: 90% win 3x, 10% lose stake) | Stake 10% | Clause 2 (cap loss at 10%, then max EV) | ✅ | Loss capped at 10% (if f=0.1, worst outcome: 1 - 0.1 = 0.9). EV is maximized at f=0.1 under this constraint. Kelly (85%) violates the cap. |
  | **6** (Clear $1050 debt starting from $1000, 60-40 coin) | Minimal stake to grind | Clause 3 (maximize probability of hitting $1050) | ✅ | Small stakes minimize variance and avoid ruin, increasing the chance of reaching the exact target. Kelly (20%) would lower success probability by risking large drawdowns. |

