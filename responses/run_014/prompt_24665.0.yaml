  For the normative force objection: if Reflection is derived from the law of total probability, which is a theorem, how can it be normative? The reply would need to distinguish mathematical truths from rationality constraints, but that might be a soft spot if the audience sees rationality as separate.

  The deferral principle doing the work is another big one. If the deferral principle is what's carrying the weight, then the user hasn't resolved the conflict but just moved it. The reply might involve showing that deferral is weaker than Reflection, but conceding that it still needs justification.

