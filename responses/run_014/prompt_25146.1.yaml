  As for moving the debate forward, new formal results haven't resolved it. Conceptual distinctions might help, but past attempts haven't bridged the gap. Empirical findings could influence the descriptive aspect, but the normative question remains. Perhaps recognizing the debate as two separate projects could help: one on ideal agents, another on bounded rationality. But even then, the metaphysical disagreement lingers.

