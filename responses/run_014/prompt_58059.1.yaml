prompt: |-
  As a journalist covering science and ideas, I have repeatedly noticed a particular shift in how people respond to harmful or helpful actions once the explanation of those actions changes, and I lack precise language for it.

  While reporting on patients who received alarming guidance from a medical advice system, I saw family members react with anger and demands for acknowledgment when they took the output to reflect disregard for their concerns, then switch within minutes to cool, diagnostic talk about data pipelines and repair once engineers explained the result came from a cutoff and a formatting failure, even though the scare and the delay were unchanged. While reporting on a school scheduling system that generated a wave of unfair detentions, I saw parents direct personal reproach toward the vendor team, then divide after learning no individual had reviewed any case and the pattern emerged from interacting constraints: some continued reproach toward the organization itself, others began to treat the system as faulty infrastructure to be contained and redesigned.

  What interests me is the oscillation itself, between engaging a target as an agent toward whom anger, gratitude, or reproach feel apt and stepping back to regard the same target as a condition to be managed or worked around, with the outcome held constant. Is there an established concept or literature for this exact oscillation, and if so what are the nearest concepts, how does the pattern I describe differ from each, and which fits best, or if not how should it be named and defined with its boundary cases? A bare label will not suffice; I need a clear carving of what the phenomenon is, what it is not, and where its edges lie.

  Please provide your answer as a numbered list of exactly five items, each one or two sentences, with no introduction or conclusion.
reasoning: |-
  Okay, the user is a science journalist who's observed a fascinating psychological shift in responses to harmful events based on how they're explained. They describe cases where people switch from emotional reactions (anger, reproach) to detached analysis when the cause shifts from perceived intent to systemic failure - even when outcomes remain identical. 

  Hmm, this seems deeply rooted in attribution theory and moral psychology. The key is how explanation changes perceived agency. When people think an agent intentionally caused harm, they engage in "character condemnation" - but when it's framed as system failure, it becomes "system analysis" instead. 

  The user needs precise terminology, not just labels. They want boundaries: this isn't mere "dehumanization" (which removes agency entirely) or "rationalization" (which excuses intent). The core is the toggle between holding someone morally accountable versus treating it as a technical problem. 

  I should map this to existing concepts while highlighting gaps. The "moral disengagement" literature comes close but usually describes avoiding blame, whereas here the shift is triggered by new information. "Deontic shift" might work but isn't established. 

  Most fitting is the "agent-system pivot" - that captures how the same event gets reinterpreted. Need to stress it's not about excusing harm but reframing causality. The boundary is whether the explanation suggests choice versus constraint. 

  For the response format: five crisp points contrasting it with nearest concepts (attribution errors, dehumanization etc.), defining the pivot, and marking its edges. Must avoid academic jargon since it's for journalism.
answer: |-
  Here is the numbered list as requested:

  1.  The phenomenon is an **"Agent-System Pivot"**, a cognitive and emotional shift triggered by causal explanation, where a target's perceived agency toggles between being a blameworthy/creditable *intentional actor* (eliciting social/moral emotions like anger/gratitude) and being a *constrained systemic component* (eliciting instrumental/technical responses like diagnosis or redesign), despite unchanged outcomes.
  2.  This differs from **fundamental attribution error**, which is a bias *over*-attributing behavior to disposition rather than situation; the pivot is the *active, rapid switching* between these frames driven by explicit explanation, not a persistent bias.
  3.  This differs from **dehumanization/objectification**, which involves a *persistent* denial of agency/mind; the pivot allows agency perception to *fluctuate contextually* based on causal framing, without necessarily denying the target's fundamental capacity for agency in other contexts.
  4.  This differs from **rationalization** or **moral disengagement**, which are mechanisms to *avoid* moral responsibility; the pivot is a *neutral reframing* of causality prompted by new information, making moral engagement *inappropriate* under the system frame, not avoided.
  5.  Its boundary lies in the *causal explanation*: the pivot occurs when explanation shifts from implying *intentional choice or negligence* (activating the agent frame) to revealing *emergent properties, deterministic constraints, or passive system failures* (activating the system frame); outcomes remain constant, but the perceived locus of control changes.
