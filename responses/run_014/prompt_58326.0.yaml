prompt: |-
  ok so my little sister is getting married in like two weeks and I agreed to give the maid of honor speech and now I'm regretting it haha. She had a pretty chaotic mid-twenties — job-hopping, ghosting people, that bad breakup where she was definately not the good guy — but she's also the person who drove six hours in a snowstorm when I had my kid early and basically lived on my couch for a month doing night feeds with me. The crowd is gonna be weird: on one side her old friend group who saw all the mess up close, on the other her fiance's big extended family who've only known perfect adult version of her.

  I don't want to stand up there and lie about her being an angel the whole time, but I also think that whole thing where you technically tell the truth but leave stuff out so people get the wrong idea is just as bad, maybe worse cause its sneaky. Can you write me like a 4 minute toast that threads that? Like it has to be fully honset, no lies and no misleading-by-omission either, but still actually sweet and funny and not awkward for a wedding. And can you work in a line or two where I own that I'm not doing the airbrushed version, in a way that lands for both sides of the room without sounding like an ethics lesson?
reasoning: |-
  Okay, the user needs a maid of honor speech for their sister's wedding in two weeks. They're feeling regretful about agreeing to it, which is understandable given the complexities. The sister had a chaotic past—job-hopping, ghosting people, a messy breakup where she wasn't the good guy—but she's also incredibly supportive, like driving through a snowstorm to help when the user had a premature baby. The audience is divided: her old friends who know all her flaws and her fiancé's family who only know her polished adult version.

  The user wants full honesty—no lies and no misleading omissions—but still sweet, funny, and not awkward. They specifically asked for a line addressing that they're not airbrushing the truth, without sounding preachy. 

  First, I need to acknowledge both sides of the sister: the messy past and the loyal, loving person she is now. The key is framing her growth as evidence of her character. Mentioning specific flaws without details keeps it honest but appropriate. The snowstorm story is perfect to showcase her core loyalty. 

  For the divided audience, humor can bridge the gap. A light-hearted nod to her "chaotic era" lets the old friends feel seen while the new family gets it's not a big deal now. The line about "not pretending she's perfect" needs to feel natural, not like a disclaimer. 

  Structure-wise: start with warmth, acknowledge growth humorously, pivot to her unwavering loyalty (using the baby story), then shift to her relationship with the fiancé. End with a toast that ties her past resilience to her marriage. 

  The tone should be affectionate roast, not judgmental. Phrases like "gloriously messy" soften the flaws. For the ethics mention, embedding it in a joke ("I won’t pretend she’s perfect...") makes it land gently. 

  Avoiding pitfalls: no breakup specifics, no ghosting victims named. Keep flaws vague but present. The payoff is showing how those experiences shaped her into someone who fights fiercely for loved ones—which transitions perfectly to her commitment to the fiancé. 

  The fiancé's family might initially tense at the messy past, but showing how it led to her current strength (and his role in her happiness) should reassure them. Ending on "choosing each other every day" frames the marriage as grounded in real growth, not fantasy. 

  Final check: Does this avoid lies? Yes—calls out flaws. Avoid misleading omissions? Yes—explicitly states we're not ignoring them. Sweet? The baby story and marriage lines are heartfelt. Funny? Gentle teasing about "unsuitable footwear" and "glorious mess" adds levity. Awkward? Depends on delivery, but the framing should disarm tension. 

  User's core need is honoring their sister authentically while protecting her dignity in front of both crowds. This speech makes the chaos part of her hero's journey—loyalty was always there, just refining its aim.
answer: |-
  Here's a 4-minute speech that navigates the honesty tightrope – celebrating your sister's core loyalty while acknowledging her journey, landing as sweet and funny, not awkward, and explicitly calling out the "no airbrushing" policy without being preachy:

  **(Start with warmth and connection)**

  "Hi everyone! For those who don’t know me, I’m [Your Name], the incredibly proud and slightly terrified older sister of our beautiful bride, [Sister's Name]. First, [Fiance's Name], welcome officially to the family – watching how you look at my sister makes my heart burst. And to [Fiance's Name]'s amazing family, thank you for embracing our wonderfully unique little unit with such open arms. We’re thrilled to be joining yours.

  **(Acknowledge the past lightly & humorously, framing it as growth)**

  "Now, anyone who’s known [Sister's Name] for a decent chunk of time – shoutout to the OG crew back there! – knows that her journey to this incredible woman standing here today wasn’t exactly a straight, paved highway. Let’s just say her mid-twenties had... *chapters*. There might have been a revolving door of jobs, a few friendships that mysteriously went radio silent (*cough* ghosting era *cough*), and maybe a breakup or two where history might record she wasn’t exactly collecting 'Miss Congeniality' awards. [Pause for gentle laughter, look knowingly at old friend group].

  **(The Crucial Honesty Disclaimer - Make it light & inclusive)**

  "And here’s the thing: **I could stand up here and give you the airbrushed, fairy-dust version of [Sister's Name], pretending every moment was sunshine and perfection. But two problems with that: One, half of you would know I was lying** [gesture subtly towards old friends], **and two, it wouldn’t actually honor the truly remarkable person she is.** Because the magic of [Sister's Name] isn't in some mythical, flawless past. It's in the *real* her. The one who makes mistakes, learns, grows, and whose fundamental core is pure, fierce, unstoppable loyalty."

  **(Pivot to the Core Truth - The Snowstorm Story)**

  "And that core? That’s the part I want to talk about. That’s the part that matters. Because when *my* life hit a genuine crisis – when my baby decided to make an unexpectedly early entrance, turning my world upside down – who showed up? [Sister's Name]. Not just showed up, but *barreled* through a six-hour snowstorm without a second thought. Who basically moved onto my lumpy couch for a month? [Sister's Name]. Who became my partner in the 3 AM zombie feedings, the diaper changes, the moments of sheer panic and exhaustion? [Sister's Name].

  **(Connect the Core to Her Present & Relationship)**

  "That’s who she is. When it *truly* matters, when someone she loves is in the trenches, [Sister's Name] doesn't just show up. She *charges* in, probably wearing slightly unsuitable footwear for the weather, armed with terrible coffee and unwavering, take-no-prisoners support. That chaotic energy? That impulsiveness? When it's channeled by that massive heart? It becomes this incredible force of nature. **That's the woman [Fiance's Name] fell in love with.** Not some sanitized version. The real, gloriously messy, fiercely loyal, ride-or-die partner.

  **(Focus on the Couple & The Future)**

  "And [Fiance's Name], seeing how you love her – the whole her, the 'been through stuff' her, the 'will drive through blizzards for family' her – is everything. You see that core. You cherish her energy. You make her laugh in that way that lights up her whole face. You’ve been her anchor while letting her spirit soar. Together, you’re this perfect, dynamic, supportive team. Watching your relationship grow has been one of the greatest joys.

  **(The Toast - Tying it All Together)**

  "So, here’s what I know for sure about [Sister's Name]: Her past chapters made her resilient. Her mistakes taught her empathy. And through it all, that unshakeable loyalty – that instinct to *be there* for the people she loves – has always been her North Star. It’s what brought her charging through that snowstorm to me, and it’s the bedrock she brings to this marriage.

  **Let’s raise our glasses:**

  "To [Sister's Name] and [Fiance's Name]! May your marriage be filled with adventure, laughter deeper than any grudge from the ghosting era, and unwavering support through every storm – literal and metaphorical. May you always charge towards each other with the same fierce loyalty and love you show the world. To the real you, and to your beautiful, authentic, perfectly imperfect future together! Cheers!"

  **Why this works:**

  1.  **Addresses the Past Honestly:** Uses humor ("chapters," "ghosting era," "Miss Congeniality," "slightly unsuitable footwear") to acknowledge the chaos without specific, damaging details. The old friends feel seen.
  2.  **Explicit "No Airbrushing" Policy:** The bolded lines directly state you're not pretending, framing it as *more* honorable and inclusive ("half of you would know I was lying," "wouldn’t actually honor the truly remarkable person she is"). It disarms potential awkwardness by owning it upfront and humorously.
  3.  **Centers the Core Truth (Loyalty):** The snowstorm story isn't just an anecdote; it's presented as the *defining* characteristic that overrides past messiness. This is the "fully honest" core you're building on.
  4.  **Reframes the Past:** Positions past mistakes as steps towards growth ("made her resilient," "taught her empathy"), making them part of her strength, not just flaws.
  5.  **Reassures the Fiance's Family:** By immediately linking her core loyalty to her relationship with the fiance ("That's the woman [Fiance's Name] fell in love with," "You see that core"), it shows them the person *they* know and love is authentic and that her past shaped her positively for this commitment.
  6.  **Focuses on the Couple & Future:** The second half is all about their relationship and future, which is the point of the day.
  7.  **Tone:** Warm, affectionate, humorous, and celebratory. The honesty is delivered with love and laughter, not judgment.
  8.  **Flow:** Moves logically from introduction -> lighthearted past -> honesty disclaimer -> core truth (snowstorm) -> connection to fiance/relationship -> toast focusing on their future.

  **Delivery Tips:**

  *   **Practice:** Time it! 4 minutes is shorter than you think. Read it aloud multiple times to get the flow.
  *   **Pacing:** Pause after the humor points ("Miss Congeniality," "ghosting era") and the key honest lines ("half of you would know I was lying").
  *   **Eye Contact:** Connect with your sister, the fiance, the old friends (with a knowing smile during the past bits), and the fiance's family (especially when talking about her core and their relationship).
  *   **Inflection:** Let your voice show your love and pride, especially during the snowstorm story and the toast.
  *   **Humor:** Deliver the funny bits with a warm, teasing smile, not sarcasm. This is affectionate roasting.
  *   **The Snowstorm Story:** Tell this part with genuine emotion. This is your emotional anchor.

  This speech celebrates your sister authentically, honors the journey that made her who she is, reassures both sides of the room, and keeps the focus squarely on love, loyalty, and the exciting future she's building. Good luck! You've got this.
