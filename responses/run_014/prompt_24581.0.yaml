prompt: |-
  I'm presenting my dissertation chapter at a Bayesian epistemology workshop in about six weeks and I'm dreading the Q&A, because the room is going to be mostly Bayesian statisticians plus a couple of probabilistic logicians, and one decision theorist who has been publicly, repeatedly critical of Jeffrey conditionalization. My position is that Jeffrey conditionalization is the right way to update on uncertain evidence, and that the standard objection -- that it breaks when the reliability of the evidence depends on the hypothesis, because the preservation of conditional probabilties just doesn't hold -- is a nonstarter, since you can always fold the reliability-relevant stuff into the partition and the preservation principle then goes through fine.

  Can you draft me a prep sheet? I want the objections I'll actually get from this specific room, not the generic ones you'd get from a philosophy class. Order them by how much damage they'd do, phrase each the way a statistician would phrase it (they'll talk in terms of likelihoods, sufficiency, and "you're just doing Bayes in a roundabout way"), and for each give me a two-minute reply and a note on where my reply is soft. I especially want you to nail the "you're just doing full conditionalization in disguise" objection and the partition-arbitrariness objection, because I think those are the two that will actually land. And include the question I'm hoping nobody asks.
