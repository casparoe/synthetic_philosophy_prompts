prompt: |-
  I own and run a twenty-two-person home remodeling company in central Ohio — kitchens, baths, the occasional whole-house job — and every December since I bought the business I have carved a share of the year's profit into a bonus pool and divided it by instinct: a large check for my lead carpenter, something for the woman who schedules and orders everything, smaller amounts for the apprentices, nothing for the two guys I was quietly unhappy with. Last December two men quit within a month of each other. Neither named the bonus as the reason, but one of them told a coworker afterward that he had put in ninety-hour weeks in August on a job that went badly sideways and came out with less than a man who had coasted all fall. That got me reading and thinking at night about what someone at a company actually deserves, and I have not gotten far. What I want from you is a procedure I can run once a year in a single afternoon, with no economics or philosophy training behind me: an ordered list of questions to ask about the pool and then about each employee, what counts as a sufficient answer to each question, the points at which the procedure runs out and hands the decision back to me because it is a matter of values rather than facts, and a frank note wherever a step is really a judgment call dressed up as a step. At the end I want it in a form I could hand to my crew as a one-page statement of the rules before the year starts.

  There are four things I got stuck on by myself, and I want the procedure to face them rather than route around them. First, the work is joint. Nobody builds a kitchen alone, and I do not believe there is any fact of the matter about how many dollars of a finished project each person produced, so a rule that says pay people what they contributed is a rule I cannot execute and would be lying if I pretended to. Second, a good deal of what looks like contribution is luck: the man who drew the easy addition on a level lot instead of the 1920s house with the rot behind the plaster; my salesperson, who happens to have been sitting here when the local market turned; the apprentice who was trained by my best carpenter instead of the one who was not. Third, effort seems fairer until you notice that the capacity to grind is itself not something anyone chose, and that I have a fifth-year carpenter with a ruined back and two small children who simply cannot work the way he did at twenty-five. Fourth, we are small enough that everyone learns roughly what everyone else got, so whatever rule I adopt has to survive being read aloud in the break room in January. And underneath all of it there is a worry I cannot quite articulate: I suspect there is a difference between owing a man something because I promised it or contracted for it, and a man deserving something whether or not anyone promised it — and I suspect the bonus pool has been the second kind. So writing the rules down may convert it into the first kind, and I do not know whether that would be a loss or the entire point. Please tell me which it is, because if the sheet itself starts deciding who deserves what, I want to know what I am signing.

  Here is what I can and cannot supply. My bookkeeper can give me, for each job, the contract price, materials, subcontractor invoices, and the hours each person billed to it; job-level profit falls out of that. I have no time-tracking software, no customer-satisfaction scoring beyond a handful of online reviews, and no HR department — it is me and my bookkeeper and the owner of the building supply house who gives me credit terms. The pool is fixed as a percentage of profit before I begin, so the procedure cannot recommend changing its size except to tell me it should be zero in a given year, and if it ever does say that, say it plainly. Do not tell me to pay market wages instead, do not tell me to hire a compensation consultant, and do not send me a reading list or name any philosophers or books — I want the reasoning in ordinary language, and if a step depends on a distinction I have to understand to run it correctly, explain that distinction in two sentences without naming anyone who held it.

  Then run the procedure on three of my people, using these descriptions. Ray, fifty-five, lead carpenter, the best hands in the county, who trains every apprentice whether he admits it or not and who refuses to touch punch-list work; two of my three quits in six years were on his crews, and I have heard him tell a homeowner that her husband picked the wrong tile. Marisol, forty-one, office manager and scheduler, who has never swung a hammer on a job site and whose work appears in no job-cost report, though I am fairly confident that if she left in March the company would stop functioning by May. Tomas, thirty-eight, fifth year with me, formerly the fastest framer I ever had, now with a bad back, doing layout and on-site supervision of apprentices and billing perhaps a third of the hours he used to. Give me a number or a range for each and show which question in the procedure produced it. At least one of the three should come out in a way I will not like, and I would much rather you say so bluntly than soften it — if the procedure tells me the scheduler outranks the best carpenter in the county, or that the man who billed the fewest hours takes a full share, say it, explain why the procedure cannot say anything else, and tell me what it will cost me in the break room when I do.
reasoning: |-
  Okay, let me approach this carefully. The user runs a remodeling business and needs a fair, transparent bonus system that addresses inherent complexities of joint work, luck, effort disparities, and small-team dynamics. He specifically rejects theoretical approaches and demands a practical, executable procedure.

  Hmm, his core tensions are fascinating: he recognizes bonuses as moral debts rather than contractual obligations, wants transparency but fears resentment, and needs to quantify unquantifiable contributions. The four sticking points he raised are crucial - especially the impossibility of isolating individual contributions in collaborative work.

  I think we should design this as a flow chart rather than a formula. First, we establish the pool size (fixed percentage of profit). Then we determine individual shares through four weighted factors: Core Responsibility (fixed base share), Critical Function (value to operations), Documented Contribution (hours/profit), and Mitigation Factors (adjustments for luck/effort/circumstance). 

  For the test cases: Ray's brilliance but poor teamwork reduces his critical function score, Marisol's operational indispensability boosts hers, Tomas' physical limitations trigger mitigation adjustments. The weights (50% core, 30% critical, 15% documented, 5% mitigation) intentionally prioritize role stability over performance metrics to avoid false precision.

  The breakroom risk is real - we should flag that Tomas getting near Ray's bonus might cause grumbling, but the procedure would show it's because his core role weight and mitigation outweigh his lower hours. Transparency here is both the solution and the vulnerability.

  On his philosophical worry: by writing rules, we're transforming desert into entitlement - which is exactly what his crew needs. The "loss" of moral discretion is the price of stopping resentment-driven quits. The sheet doesn't decide desert; it converts his judgment into legible standards.

  For implementation: we'll use his available data (hours, job costs) for the documented portion, but rely on his qualitative assessment for critical function. The mitigation step is deliberately small (5%) - it can't override performance but acknowledges life circumstances. 

  Crucially, we'll build in off-ramps where his judgment is irreplaceable: setting the initial weights, assessing "critical function," and applying mitigation. The procedure structures but doesn't replace his decisions.
answer: |-
  Here’s a one-page procedure designed for your constraints. It converts "deservedness" into **verifiable contributions + critical function**, acknowledges luck/mitigation, and survives break-room scrutiny. The bonus becomes a **conditional entitlement** (owed if rules are met), not pure desert—retaining fairness while reducing resentment.

  ---

  **HomeCraft Remodeling Bonus Allocation Rules**  
  *(Effective January 1, [Year])*  

  **Step 1: Set the Pool**  
  - Q: *Was annual profit positive?*  
    - **Yes:** Pool = [X]% of profit (pre-set by owner). Proceed.  
    - **No:** No bonuses. Stop.  

  **Step 2: Assign Base Shares (50% of Pool)**  
  - Q: *Did this person work >1,000 hours for us this year?*  
    - **Yes:** 1 full base share.  
    - **No:** 0.5 share (pro-rated for part-timers).  
    - *Why?* Recognizes loyalty/availability. Adjust threshold as needed.  

  **Step 3: Weight by Critical Function (30% of Pool)**  
  - Q: *How hard would it be to replace this person’s core function within 3 months?*  
    - **Tier 1 (1.5x):** Near-impossible (e.g., unique expertise, operational glue).  
    - **Tier 2 (1.0x):** Challenging but doable (skilled roles).  
    - **Tier 3 (0.8x):** Replaceable with training (entry-level).  
    - *Owner judgment required. Document reasons (e.g., "Only Ray trains apprentices").*  

  **Step 4: Adjust for Documented Contribution (15% of Pool)**  
  - Q: *How did their measurable output compare to role expectations?*  
    - **Exceeded (1.2x):** Consistently beat efficiency targets, solved major problems.  
    - **Met (1.0x):** Solid, reliable work.  
    - **Fell short (0.8x):** Missed deadlines, rework needed, low hours without excuse.  
    - *Use: Job-cost hours, project delays, material waste. Ignore absolute profit—it’s joint.*  

  **Step 5: Mitigation/Luck Adjustment (5% of Pool)**  
  - Q: *Did uncontrollable factors significantly help/hurt their year?*  
    - **+0.1x:** Severe bad luck (e.g., assigned worst jobs, injury).  
    - **-0.1x:** Unearned advantage (e.g., easiest projects, inherited best team).  
    - **0x:** Neutral.  
    - *Cap at ±0.1x. Owner discretion with bookkeeper input.*  

  **Step 6: Calculate Final Share**  
  - `Total Share = (Base × Critical × Contribution) + Mitigation`  
  - Distribute pool proportionally. Example: If total shares = 25, and pool = $50k, each share = $2k.  

  **Step 7: Owner Override (If Values Clash)**  
  - *After calculating, ask: "Will paying this damage trust or ethics?"*  
    - If yes, adjust ±10% max. Document reason.  
    - *This is judgment dressed as step—own it.*  

  ---  
  **Why This Works for Your Sticking Points:**  
  1. **Joint Work:** Doesn’t fake individual profit. Uses role-based metrics + criticality.  
  2. **Luck:** Mitigation step acknowledges it without overcorrecting.  
  3. **Effort vs. Capacity:** Bases "contribution" on *output within role*, not raw hours.  
  4. **Transparency:** Rules are explainable ("Marisol’s irreplaceable"; "Tomas got mitigation").  

  **The Philosophical Shift:**  
  Bonuses become **owed if rules are met**—not "deserved" abstractly. This *prevents resentment* (clear rules > instincts) while keeping moral weight (you set fair criteria). The "loss" of pure desert is the *price of trust*.  

  ---  
  **Test Cases (Assuming $100k Pool):**  
  *(Hypothetical weights; your inputs may vary)*  

  1. **Ray (Lead Carpenter)**  
     - Base: 1 share (full-time).  
     - Critical: **1.5x** (Only trains apprentices; top skill).  
     - Contribution: **0.8x** (Refuses punch lists; caused 2 quits; rude to client).  
     - Mitigation: **0x** (Assigned tough jobs, but skill offsets).  
     - **Total Share = (1 × 1.5 × 0.8) + 0 = 1.2**  
     - *You won’t like this: His toxicity reduces his share despite skill. If you pay more, override and note: "Retention risk." Break-room cost: Grumbling, but justifies holding him accountable.*  

  2. **Marisol (Scheduler)**  
     - Base: 1 share.  
     - Critical: **1.5x** (Company fails without her).  
     - Contribution: **1.2x** (Flawless ordering; no project delays).  
     - Mitigation: **0x**.  
     - **Total Share = (1 × 1.5 × 1.2) + 0 = 1.8**  
     - *Highest share. Why: Her role prevents chaos. Break-room cost: Field crew may scoff—explain, "No Marisol = no paychecks."*  

  3. **Tomas (Supervisor)**  
     - Base: 1 share.  
     - Critical: **1.0x** (Skilled but replaceable).  
     - Contribution: **0.9x** (Low hours, but effective supervision).  
     - Mitigation: **+0.1x** (Back injury; can’t work like before).  
     - **Total Share = (1 × 1.0 × 0.9) + 0.1 = 1.0**  
     - *Near-full share despite low hours. Mitigation acknowledges his past sacrifice. Break-room cost: Minimal—team knows his back story.*  

  ---  
  **To Hand to Your Crew:**  
  > *"Bonuses reward shared success. Each year, we calculate your share by:  
  > 1. **Base (50%):** Full-time = 1 share.  
  > 2. **Critical Role (30%:** How vital your function is (1.0–1.5x).  
  > 3. **Contribution (15%):** Did you hit goals? (0.8–1.2x).  
  > 4. **Luck Adjustment (5%):** +/- for unfair advantages/hardships.  
  > I set Critical/Luck factors—ask me why. Final shares add up to 100% of the pool."*  

  **Final Note:** This won’t feel perfect—life isn’t. But it replaces instinct with **defensible logic**, cuts resentment, and lets you sleep at night. When in doubt, **override and explain**. That’s the job.
