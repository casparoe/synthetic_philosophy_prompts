prompt: |-
  I was going back and forth with a friend last night about whether I'm even being coherent about voting, and I realized I can't really articulate what I'm going by. So I've writen down my gut verdicts and I'd like to know if there's a principle behind them, or if I'm just making it up as I go.

  Here's where I land. I vote in local school board races where I think my vote has a real shot at actually mattering, and I vote in close presidential elections. But I skip state legislature races I'm pretty sure is safe, and I'll skip even a close race if I'm out of town and getting back to the polls would be a genuine hassle. And yet I vote in a presidential election I'm confident is a foregone conclusion, mostly out of some vague sense of duty, even though I know my single vote can't possibly change the outcome. But I don't feel any pull at all to vote in an election I genuinely don't care about the result of, and I skip those without a flicker of guilt.

  The case I keep going back and forth on is a close race between two candidates I basically like equally — my vote might genuinely tip it, but since I have no strong preference I'm not sure it's worth the effort. Is there a principle that captures all of this, or at least most of it? And if not, which verdict do I have to give up, and what would the resulting principle say about a case I haven't mentioned, like a close referendum on something I care a lot about where I'm pretty sure my vote won't be the one that breaks the tie?
reasoning: |-
  Okay, the user is trying to figure out the principles behind their voting habits. They’ve listed specific scenarios: voting in local school board races where their vote might matter, skipping safe state legislature races, and even voting in presidential elections that are foregone conclusions out of a sense of duty. But they skip races they don’t care about, even if they’re close. They’re conflicted about a close race where they like both candidates equally—their vote could tip it, but they don’t feel strongly. Plus, they mentioned a referendum they care about but think their vote won’t be decisive.

  First, I need to identify the underlying factors in their decisions. It seems like they’re weighing several things: the probability their vote matters, the effort required, the importance of the outcome to them, and a sense of civic duty. But these factors aren’t consistent across all cases. For example, in the presidential race, duty overrides low probability, but in the equal-preference case, effort might outweigh the high probability of impact.

  The user might be looking for a coherent framework to justify their choices, possibly to feel more confident in their decisions or to explain them to their friend. They might also want to resolve the internal conflict about the equal-preference scenario. There’s an unspoken need for validation—they want to know if their approach is rational or if they need to adjust their principles.

  I should consider existing theories like rational choice, expressive voting, or game theory. Rational choice says voting is irrational unless the chance of being decisive outweighs the cost. But the user votes in foregone presidential elections, which contradicts that. Expressive voting focuses on personal expression rather than impact, which explains the duty-driven votes. The multi-factor model combining probability, cost, preference strength, and duty seems to fit best. 

  The equal-preference case is tricky. If both candidates are equally good, the difference in utility is zero. Even if the probability of being decisive is high, the expected utility is zero, so effort might not be justified. But what if one candidate is slightly better? The user might not realize that even a small preference could tip the scales. Also, in a referendum they care about, even if their vote isn’t decisive, expressing their stance has value. 

  The user needs to decide which factors they prioritize. If they value civic duty, voting in the equal-preference case makes sense as participation. If they’re more pragmatic, skipping it is fine. They might need to accept that their model isn’t perfectly rational but is human. Highlighting that their approach is common and practical could reassure them. Emphasizing that the equal-preference scenario’s effort cost might be the deciding factor there, which aligns with their other choices where high effort leads to skipping.
answer: |-
  Your voting patterns reveal a surprisingly coherent, multi-factor decision framework – you're **balancing Expected Utility, Effort Cost, Preference Strength, and Civic Duty**. Here's how it maps to your scenarios:

  **The Core Principles:**

  1.  **Expected Impact (P * ΔU):** This combines:
      *   **Probability (P):** How likely is it your vote is decisive? (High for close local/small elections, low for safe/large ones).
      *   **Utility Difference (ΔU):** How much *better* is one outcome than the other *for you*? (High when you care deeply, low when indifferent, zero when equal).

  2.  **Effort Cost (C):** The hassle/time/opportunity cost of voting.

  3.  **Civic Duty (D):** The intrinsic value you place on participating in the democratic process, regardless of impact.

  **Your Verdicts Explained:**

  *   **Vote in Close Local Races (School Board):** `High P` (small electorate, potentially close) `*` `Moderate/High ΔU` (direct impact on your community/kids) `>` `Moderate C`. Expected Impact wins.
  *   **Vote in Close Presidential Races:** `Very Low P` (massive electorate) `*` `Very High ΔU` (huge perceived difference) `>` `Moderate C`. The massive `ΔU` compensates for the tiny `P`.
  *   **Skip Safe State Legislature Races:** `Very Low P` (safe seat) `*` `Moderate ΔU` `<=` `Moderate C`. Low chance outweighs the potential benefit.
  *   **Skip Even Close Race if High Hassle:** `High P` `*` `ΔU` `<=` `Very High C`. Effort cost outweighs the expected benefit *in that specific instance*.
  *   **Vote in Foregone Presidential Race:** `Very Low P` `*` `Very High ΔU` is low, BUT `D` (Civic Duty) is high. **Duty overrides low Expected Impact.** Expressing your choice/values matters.
  *   **Skip Races You Don't Care About:** `ΔU ≈ 0`. Even if `P` is high, `P * 0 = 0`. Expected Impact is zero, and `D` isn't strong enough to overcome `C`.
  *   **Skipping Without Guilt:** Aligns perfectly with `ΔU ≈ 0` leading to negligible Expected Impact.

  **The Sticking Point: Close Race, Equal Preference (ΔU = 0)**

  *   **Your Conflict:** `High P` `*` `ΔU = 0` `= 0` (Expected Impact). `D` (Duty) pushes you to vote, but `C` (Effort) pushes you to skip. The factors are in direct conflict.
  *   **Principle Says:** **Skipping is logically consistent.** If `ΔU` is truly zero, the *expected benefit* of voting is zero (`P * 0`), even with high `P`. Voting only makes rational sense if:
      1.  `C` is very low (minimal effort), OR
      2.  `D` is exceptionally high for you in this specific context.
  *   **Resolution:** You might need to **accept skipping** this case based on `C > (P * ΔU) + D` (Effort > Zero Expected Impact + Weak Civic Duty pull). *Alternatively*, dig deeper – is `ΔU` *truly* zero? Even a slight preference makes `ΔU > 0`.

  **The Referendum Case: Close, Care Deeply, Vote Won't Be Decisive**

  *   `High P?` (Close race, but massive electorate? Usually `P` is still astronomically low).
  *   `Very High ΔU` (You care deeply).
  *   `Moderate C` (Standard effort).
  *   **Principle Says:** `Very Low P * Very High ΔU = Very Small Expected Impact` (positive, but tiny). `D` (Civic Duty) is likely high *because* you care deeply. **Vote.** This mirrors your "foregone presidential" vote: `D` compensates for the very low (though non-zero) Expected Impact. Expressing your strong preference has value beyond the minuscule chance of being decisive.

  **Conclusion & Refinement:**

  1.  **You're Not Making It Up:** Your decisions follow a **rational (though not purely economic) cost-benefit analysis** incorporating probability, preference strength, effort, *and* civic duty.
  2.  **The Principle:** **Vote if either:**
      *   **(P * ΔU) > C** (Expected Impact outweighs Effort), *OR*
      *   **D > C** (Civic Duty outweighs Effort, especially when ΔU is high even if P is low).
  3.  **Giving Up a Verdict?** To be fully consistent:
      *   **The "Equal Preference" Dilemma:** You likely need to **accept skipping** if effort is non-trivial and duty isn't overwhelming, *or* acknowledge that a slight preference makes `ΔU > 0`.
      *   **The "Foregone Conclusion" Vote:** This relies heavily on `D`. If you demand pure instrumental rationality (only `P * ΔU > C`), you'd have to give this up. But your sense of duty (`D`) is a valid and common component.
  4.  **Resulting Principle for the Referendum:** As above – `D` (amplified by high `ΔU`) justifies voting despite the very low `P`. You *care*, so expressing that matters to you intrinsically.

  **In short: You weigh the tiny chance of making a difference against how much you care about the difference, the hassle involved, and a sense of obligation to participate. This is a very common and understandable framework for real-world voting decisions.** Your "gut" is applying these factors intuitively. The equal preference case is genuinely tricky because the core instrumental reason vanishes, leaving duty and effort in direct opposition.
