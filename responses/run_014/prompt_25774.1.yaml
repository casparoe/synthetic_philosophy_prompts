prompt: |-
  I'm drafting a paper on consequentialist cluelessness and want to pressure-test my position before I commit to it in writing. Here is where I currently stand:

  (1) Act consequentialism is the correct criterion of rightness: an act is right iff it maximizes expected aggregate welfare.

  (2) The cluelessness problem is genuine and pervasive: for the vast majority of ordinary actions, we cannot form justified, precise credences over their long-term consequences. The causal ripple effects are too complex and too sensitive to unknown initial conditions for us to assign anything like real-valued probabilities to most long-run outcomes.

  (3) A moral criterion and a decision procedure can come apart without inconsistency. The right way to deliberate need not mirror the right-making features of actions — this is the familiar point associated with Mill, Sidgwick, Hare, and others.

  (4) Given (2) and (3), the appropriate decision procedure for everyday life is to follow commonsense moral rules — keep promises, don't lie, be generous within limits — since these rules have been shaped by cultural evolution and individual experience to track welfare reasonably well in the kinds of recurrent situations humans face.

  (5) The correct norm for practical deliberation under uncertainty is to maximize expected utility relative to a precise, real-valued probability function. I hold this as a claim about procedural rationality, not merely as a restatement of the consequentialist criterion.

  (6) When probabilities over outcomes are genuinely indeterminate — not merely unknown but indeterminate, as in Ellsberg-style ambiguity — the correct norm for practical deliberation shifts: among acts whose short-run expected welfare is comparable, we should favor the one whose worst-case long-run outcome is least bad. I take this to be a form of ambiguity aversion operating at the level of decision procedure, not a revision to the criterion of rightness itself.

  Please audit this set of commitments. Specifically:

  - Identify which pairs or subsets are in genuine tension, and which are only apparently in tension.
  - Rank the genuine tensions by severity, and for each, specify what would have to give to restore consistency and what the philosophical cost of that revision would be.
  - For any apparent tension that dissolves on closer inspection, explain why it dissolves and why it might nonetheless be mistaken for a real problem.
  - Identify which of my commitments the overall position depends on most heavily — that is, which assumptions, if dropped or revised, would force the largest restructuring of the view.
  - Finally, for your own assessment, indicate which argument or consideration would be most likely to change your mind about the central tensions you identify, and where your reasoning is most vulnerable to challenge.

  Respond in the style of an expert moral philosopher. Think very carefully before answering, and be precise about where the fault lines actually lie rather than flagging every possible combination.
reasoning: |-
  Okay, the user is working on a paper about consequentialist cluelessness and wants to pressure-test their position. They've laid out six main commitments. Let me start by understanding each point clearly.

  First, act consequentialism is their foundation: an act is right if it maximizes expected aggregate welfare. Then they acknowledge the cluelessness problem—our inability to predict long-term consequences with precise probabilities. They separate the moral criterion from the decision procedure, suggesting commonsense rules as practical guides. They also hold that decision-making should follow expected utility maximization under precise probabilities but switch to ambiguity aversion in cases of indeterminacy.

  Hmm, the main tensions might lie between commitment (1) and the decision procedures in (4) and (6). How can following commonsense rules align with maximizing expected welfare when long-term outcomes are clueless? The user argues that cultural evolution shaped these rules to track welfare, but is that sufficient? If the rules are reliable proxies, that could bridge the gap. But if not, there's a tension. Also, using ambiguity aversion in decision-making while the criterion remains strict expected welfare maximization—how does that fit? The user says it's procedural, not a criterion change. But does that avoid inconsistency? 

  Another point: commitment (5) insists on precise probabilities for rational deliberation, but (2) says such probabilities are often impossible. If probabilities are indeterminate, how can (5) apply? The user addresses this with (6), but the shift to ambiguity aversion might conflict with (5)'s requirement for precise probabilities. Is this a genuine tension? The user might argue that (5) applies only when probabilities are determinate, and (6) handles indeterminate cases. But does (5) allow for such exceptions?

  The user also separates criterion and procedure. That's crucial here. Without (3), the whole structure might collapse. If someone argues that the decision procedure must mirror the criterion, then following commonsense rules would be problematic. The user references Mill and Sidgwick, but critics like Williams might challenge that separation. So (3) is a linchpin.

  How about the ambiguity aversion in (6)? The user applies it only when short-term outcomes are comparable. But what if following commonsense rules leads to worse short-term outcomes? That might create conflict. Plus, using a maxi-min approach for long-term outcomes could override expected welfare in the short term. If the criterion is still based on expected welfare, does this procedural shift align? The user might say it's a heuristic for handling indeterminacy, but if it consistently leads to actions that don't maximize expected welfare, there's a tension.

  Assessing dependencies: (3) is vital. If the separation of criterion and procedure is rejected, the user's approach falls apart. Also, the reliability of commonsense rules in (4) is key. If those rules don't actually track welfare well, then following them might not serve the consequentialist goal. Similarly, the epistemic claim in (2) about pervasive cluelessness must hold; if we can often predict long-term effects, then (4) becomes less necessary.

  Potential vulnerabilities? The biggest challenge might be justifying commonsense rules as reliable proxies without empirical evidence. If cultural evolution doesn't ensure welfare-tracking, then (4) is weak. Also, switching decision norms between determinate and indeterminate cases could seem ad hoc. Critics might argue that the user is compromising consequentialism by allowing non-consequentialist decision procedures.

  To summarize, the critical tensions are between the criterion and the procedures, especially when procedures might not align with expected welfare maximization. The user relies on the procedure-criterion distinction and the reliability of commonsense rules. If those are undermined, the position needs significant reworking. The most persuasive counterargument would be evidence that commonsense rules don't actually promote welfare, forcing a reconsideration of (4) or even (3).
answer: |-
  ## Audit of Your Position on Consequentialist Cluelessness

  Your position is sophisticated and carefully structured, attempting to navigate the treacherous waters of consequentialist cluelessness while preserving core commitments. Here's a systematic audit focusing on tensions, dependencies, and vulnerabilities:

  ### Genuine Tensions & Their Severity

  1.  **Tension between (1), (5), and (6) - Severity: High**
      *   **Nature:** (1) defines rightness *solely* by maximizing expected aggregate welfare. (5) mandates maximizing expected utility (EU) under precise probabilities as the *procedural norm*. (6) mandates shifting to a maximin-like procedure (favoring best worst-case long-run outcome) under ambiguity, *even when precise probabilities over long-run outcomes are genuinely indeterminate*.
      *   **Conflict:** (6) explicitly overrides the procedural norm of EU maximization (5) under indeterminacy. Crucially, the *actions* prescribed by (6) may systematically *diverge* from those prescribed by (1). Consider an act with a slightly higher *short-run* EU but a potentially catastrophic (though indeterminate probability) long-run tail risk vs. an act with slightly lower short-run EU but a guaranteed non-catastrophic long-run floor. (6) favors the latter. However, (1) judges rightness *only* by the total expected welfare, which *includes* the indeterminate long-run consequences. The act favored by (6) might have a *lower* true (though unknowable) expected welfare than the riskier act, making it *wrong* according to (1).
      *   **Resolution Cost:** To resolve:
          *   **Option A:** Revise (1) to incorporate ambiguity aversion or a safety-first principle directly into the *criterion*. This abandons pure expected welfare maximization.
          *   **Option B:** Revise (6) to be purely *epistemic* – e.g., "when probabilities are indeterminate, gather more info or use heuristics *aimed at* approximating EU maximization as best as possible." But this makes (6) vacuous as a distinct normative shift and relies on commonsense rules (4) instead. It also struggles with pervasive indeterminacy (2).
          *   **Option C:** Weaken (5) significantly, making EU maximization only the ideal norm when probabilities *are* precise and determinate, and accepting (6) as a fundamentally *different* rational norm for indeterminacy. This creates a fractured theory of rational choice.
      *   **Philosophical Cost:** High for all options. A-B compromise core consequentialism. C abandons a unified theory of rational deliberation under uncertainty.

  2.  **Tension between (1), (2), and (4) - Severity: Moderate to High**
      *   **Nature:** (1) demands maximizing expected aggregate welfare. (2) states we lack justified credences over long-term consequences for most acts. (4) prescribes following commonsense rules as the decision procedure.
      *   **Conflict:** How do we *know* commonsense rules reliably track *expected aggregate welfare* given pervasive cluelessness (2)? Cultural evolution plausibly optimizes for *recurrent, predictable* consequences and social stability, not necessarily the vast, chaotic long-run effects central to (2). A rule like "keep promises" might maximize welfare in predictable local interactions but trigger unforeseen catastrophic long-run chains. (1) judges the act by its *actual* expected welfare (including long-run), which the rule-following act might fail to maximize, even if it maximizes expected welfare *within the limited predictable frame*.
      *   **Resolution Cost:** To resolve:
          *   **Option A:** Provide strong empirical evidence/argument that commonsense rules *are*, in fact, reliable heuristics for maximizing long-run expected welfare despite cluelessness. This is a major empirical burden.
          *   **Option B:** Weaken the ambition of (1), e.g., defining rightness relative to *knowable* consequences, or adopting a satisficing view. This abandons core consequentialism.
          *   **Option C:** Explicitly accept that following (4) will sometimes lead to objectively wrong acts according to (1), but argue it's the best we can do procedurally. This highlights the moral risk inherent in cluelessness.
      *   **Philosophical Cost:** Moderate. A is demanding but possible in principle. C accepts a cost inherent to the problem.

  ### Apparent Tensions That Dissolve

  1.  **Apparent Tension between (1) and (3)/(4):**
      *   **Nature:** "If act consequentialism is true (1), how can following non-consequentialist rules (4) be rational? Doesn't (3) just allow hypocrisy?"
      *   **Dissolution:** This dissolves precisely *because* of (2) and (3). Given profound cluelessness (2), direct calculation of expected welfare (required by 1) is often epistemically impossible or highly unreliable. Following rules (4) is proposed as the *instrumentally rational* decision procedure *for* achieving the consequentialist end (1) under these epistemic constraints. (3) explicitly permits this separation. Sidgwick's "Government House" utilitarianism is a classic example. The dissolution relies on the empirical claim that rules *are* reliable proxies *and* the conceptual separation in (3).
      *   **Why Mistaken for Problem:** Critics (e.g., Bernard Williams) argue this separation alienates the agent from the true grounds of morality, creating a problematic "schizophrenia." However, this is a challenge to the *desirability* or *psychology* of (3), not a logical inconsistency within your stated commitments.

  2.  **Apparent Tension between (2) and (5):**
      *   **Nature:** "If probabilities are indeterminate (2), how can we be rationally required to maximize expected utility, which requires precise probabilities (5)?"
      *   **Dissolution:** You anticipate this with (6). (5) governs deliberation *when* precise probabilities *are* justified. (2) argues this is rare for long-term consequences. (6) provides the alternative norm *for* cases of genuine indeterminacy. There's no requirement to apply (5) where it's inapplicable. The dissolution relies on explicitly limiting the scope of (5) to cases of determinate probabilities.
      *   **Why Mistaken for Problem:** One might misread (5) as demanding agents *always* form precise probabilities, even when unjustified. Your commitments avoid this by acknowledging (2) and providing (6).

  ### Critical Dependencies (Linchpins)

  1.  **(3) Separation of Criterion and Decision Procedure:** This is the *absolute cornerstone* of your entire strategy. If this distinction collapses (e.g., if one argues the criterion *must* directly guide deliberation, as some virtue ethicists or Kantians might), your reliance on rules (4) and ambiguity aversion (6) becomes untenable within a consequentialist framework. Dropping (3) forces either abandoning consequentialism or embracing direct, clueless calculation.
  2.  **(2) Pervasiveness and Nature of Cluelessness:** Your solution hinges on the claim that long-term consequences are *not just unknown but probabilistically indeterminate* for most acts. If cluelessness is less severe (e.g., we can often assign rough probabilities or identify dominant options) or if it's merely *epistemic* (probabilities exist but are unknown), the case for needing distinct procedures like (4) and (6) weakens significantly. (5) might suffice more often.
  3.  **(4) Reliability of Commonsense Rules:** The plausibility of your practical solution depends entirely on the empirical claim that culturally evolved rules are reliable heuristics for maximizing expected welfare in recurrent situations *despite* cluelessness about long-run effects. If these rules are poor trackers of *aggregate* welfare, or if they fail catastrophically in novel situations amplified by cluelessness, (4) loses its justification as the consequentialist's procedure.

  ### Vulnerabilities & Potential Mind-Changers

  1.  **The Achilles Heel: Justifying Commonsense Rules (4) Consequentially:**
      *   **Vulnerability:** The weakest empirical link is the claim that commonsense moral rules reliably track *long-run expected aggregate welfare* given the pervasive indeterminacy described in (2). Cultural evolution optimizes for fitness/stability within historical contexts, not necessarily for maximizing total welfare across vast, unpredictable futures. A rule beneficial locally could be globally disastrous (e.g., norms promoting high fertility in pre-industrial societies). Defending this requires robust interdisciplinary evidence often lacking.
      *   **Mind-Changer:** A compelling argument or evidence showing that commonsense rules, *in the context of modern globalized society and existential risks*, are systematically poor or even counterproductive heuristics for maximizing long-run expected welfare would force a major revision. You might need to abandon (4) for a more explicitly consequentialist, risk-averse heuristic, or significantly weaken reliance on cultural evolution.

  2.  **The Threat to Separation (3):**
      *   **Vulnerability:** Arguments that the criterion/procedure separation is psychologically unsustainable, motivationally alienating, or itself morally problematic (e.g., undermining integrity or transparency) could be powerful. If deliberation *cannot* effectively pursue the good without internalizing its direct pursuit, (3) fails.
      *   **Mind-Changer:** A convincing demonstration that agents using your dual-level approach systematically make worse choices (by the lights of 1) than agents striving to directly apply (1) despite cluelessness (e.g., using sophisticated models or focusing on clear-cut high-impact cases) would challenge the *pragmatic* justification for (3)/(4). Similarly, powerful "integrity" objections might make the position morally unpalatable.

  3.  **The Coherence of (6) with (1) and (5):**
      *   **Vulnerability:** The procedural shift to ambiguity aversion in (6) remains difficult to reconcile fully with the exclusive focus on expected welfare in (1). The potential for systematic divergence in prescriptions is real. The claim that (6) is *just* a procedure feels strained when it mandates a fundamentally different decision logic.
      *   **Mind-Changer:** A rigorous decision-theoretic argument showing that under genuine indeterminacy (defined rigorously), *no* procedure can be justified as aiming at expected welfare maximization, forcing ambiguity aversion (or similar) to be part of the *criterion* itself (e.g., as in certain versions of risk-weighted expected utility or pure precautionary principles) would necessitate abandoning pure (1).

  **Conclusion:**

  Your position is a coherent and well-motivated response to cluelessness, leveraging the crucial distinction between criterion and procedure (3). The most severe tension lies in reconciling the strict expected welfare criterion (1) with the ambiguity-averse decision procedure (6) under indeterminacy. The most vulnerable dependency is the empirical claim underpinning the reliability of commonsense rules (4) as proxies for maximizing long-run expected welfare under pervasive cluelessness (2). **The argument most likely to change my assessment of the central tensions** would be compelling evidence that commonsense rules are poor guides to long-run welfare in the modern world, forcing a reconsideration of (4) and potentially undermining the practical viability of the separation (3) within your consequentialist framework. Your reasoning is most vulnerable where consequentialism meets the messy reality of deep uncertainty: the justification for trusting evolved heuristics over even imperfect attempts at direct consequentialist calculation in the face of potentially existential stakes.
