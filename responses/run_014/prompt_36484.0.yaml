  Future developments could reshuffle this. If someone proves obfuscated falsehoods are unavoidable (Question 1), it might jump to #1 overnight. Or if labs start deploying identical-model debaters, the copy risk (new Question 7) becomes urgent. The agenda must stay responsive like the user wants.

