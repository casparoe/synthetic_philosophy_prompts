answer: |-
  Here’s a prioritized research agenda for your paper, structured by impact on the trustworthiness of debate for evaluating superhuman proposals. The ranking balances four criteria: **impact on downstream work** (I), **tractability with a priori methods** (T), **neglectedness** (N), and **deployment relevance** (D). Conflicts are explicitly resolved, with impact generally dominating.

  ### Prioritized Open Questions (Ranked High to Low)
  1.  **Judge Exploitability (Your #5)**  
      *Question:* Can debaters reliably exploit the judge’s cognitive biases or limitations to win debates with false claims?  
      **Ranking Justification:**  
      - **Impact (I):** Highest. If biased judges systematically favor persuasive liars over honest but less eloquent debaters, debate fails catastrophically. This directly determines whether truth *can* emerge.  
      - **Tractability (T):** High. Philosophers/logicians can model bias formally (e.g., game theory with bounded rational agents, Bayesian persuasion, epistemic injustice frameworks).  
      - **Neglectedness (N):** Medium. Some empirical ML work exists on "adversarial policies," but formal foundations for *why* this happens (and how to prevent it) are underdeveloped.  
      - **Deployment (D):** Decisive. A "yes" here means debate is untrustworthy for high-stakes oversight.  
      **Tiebreaker:** I > D > T > N. A proof that exploitability is unavoidable would halt debate research; a mitigation strategy would be foundational.  

  2.  **Truth-Emergence Without Knowledge (Your #4)**  
      *Question:* Can debate extract truths that *neither* debater initially knows (e.g., via novel chains of reasoning exposed under pressure)?  
      **Ranking Justification:**  
      - **Impact (I):** Very High. If debate requires one honest, knowledgeable debater, it fails against novel superhuman problems where *no* agent knows the answer. Success here makes debate far more scalable.  
      - **Tractability (T):** Medium-High. Amenable to formal logic (e.g., dialogical logic, belief revision under adversarial pressure) and simulation with abstract reasoners.  
      - **Neglectedness (N):** High. Often assumed ("truth-seeking incentives"), but rarely dissected.  
      - **Deployment (D):** Critical. If debate only verifies known truths, it’s useless for genuinely novel, high-risk proposals.  
      **Tiebreaker:** I > D > T > N. This defines debate’s ceiling.  

  3.  **Judge Boundedness: Bug or Feature? (Your #2)**  
      *Question:* Is the judge’s boundedness a fundamental vulnerability or the core mechanism enabling scalable oversight?  
      **Ranking Justification:**  
      - **Impact (I):** Foundational. If boundedness is fatal, debate fails. If it’s essential, we must design *for* it.  
      - **Tractability (T):** High. Conceptual analysis + complexity theory (e.g., comparative hardness of generation vs. stepwise verification).  
      - **Neglectedness (N):** Medium. Implicitly debated, but rarely isolated.  
      - **Deployment (D):** High. Determines if debate is even viable.  
      **Tiebreaker:** I > D > T > N. Lower than #1/#2 because resolving *how* to handle boundedness depends on answers to them.  

  4.  **Argument Decomposability (Your #1)**  
      *Question:* Can all arguments be decomposed into steps a bounded judge can verify, avoiding "obfuscated falsehoods"?  
      **Ranking Justification:**  
      - **Impact (I):** High. Undecomposable arguments break debate.  
      - **Tractability (T):** Medium. Requires epistemology (foundations of justification) + computational complexity (hardness of local vs. global verification).  
      - **Neglectedness (N):** Low. Recognized as key in debate literature (e.g., "chain-of-thought" critiques).  
      - **Deployment (D):** High. A "no" severely limits debate’s domain.  
      **Tiebreaker:** T < I. Less urgent than #1–3 because mitigations exist (e.g., recursive debate), but still core.  

  5.  **Cross-Examination Burden (Your #3)**  
      *Question:* Does cross-examination reduce the judge’s verification burden, or merely shift it elsewhere?  
      **Ranking Justification:**  
      - **Impact (I):** Medium. If cross-examination *doesn’t* reduce net burden, debate loses its advantage over direct oversight.  
      - **Tractability (T):** High. Formal debate protocols (e.g., Lorenzen-style dialog games) can model burden-shifting.  
      - **Neglectedness (N):** High. Rarely analyzed mechanistically.  
      - **Deployment (D):** Medium. Affects efficiency, not viability.  
      **Tiebreaker:** D < I. Important for optimization, but less existential than above.  

  6.  **Identical-System Debates (MISSING QUESTION)**  
      *Question:* When debaters are instances of the *same* model, does shared architecture/training create failure modes (e.g., correlated errors, collusion)?  
      **Ranking Justification:**  
      - **Impact (I):** High. Real deployments likely use identical models. Shared flaws could make debate *worse* than unaided judgment.  
      - **Tractability (T):** Medium. Analyze symmetry in game theory, alignment failures under shared priors.  
      - **Neglectedness (N):** Very High. Rarely discussed in theory.  
      - **Deployment (D):** Critical. Most practical deployments would use this setup.  
      **Added as #6 due to T < I and N: While vital, it’s slightly less foundational than truth-emergence/exploitability, but more urgent than #7.**  

  7.  **Legal Analogy (Your #6)**  
      *Question:* Is the legal analogy essential or misleading for debate’s goals?  
      **Ranking Justification:**  
      - **Impact (I):** Low-Medium. Clarifies intuitions but doesn’t validate/invalidate mechanisms.  
      - **Tractability (T):** High. Comparative institutional analysis.  
      - **Neglectedness (N):** Low. Frequently invoked.  
      - **Deployment (D):** Low. Legal systems accept high error rates; AI oversight cannot.  
      **Tiebreaker:** I < D. **Most Overrated:** Settling this wouldn’t change technical designs or deployment decisions.  

  ---

  ### Key Omissions & Dynamic Prioritization
  **Critical Missing Question:**  
  - **Identical-System Debates** (Added as #6 above). This is crucial for real-world use but neglected in theoretical work.

  **What Would Change the Ranking?**  
  - **Judge Exploitability (#1):**  
    - **⬆️** If empirical ML shows bias exploitation is rampant in LLM debates.  
    - **⬇️** If a theoretical proof shows incentives for honesty dominate under debate.  
  - **Truth-Emergence (#2):**  
    - **⬆️** If AI systems generate novel, verifiable insights in non-debate settings.  
    - **⬇️** If complexity theory proves multi-agent debate cannot compute superhuman truths.  
  - **Identical-System Risk (#6):**  
    - **⬆️** Rapidly if industry adopts single-model debate (e.g., for cost).  
    - **⬇️** If diversity techniques (e.g., fine-tuning adversaries) mature.  

  ---

  ### Agenda Defense for Your Paper
  This ranking prioritizes **existential risks** (exploitability, truth-ignorance) over **mechanistic constraints** (decomposability, cross-examination). It favors questions where:  
  1.  A "no" answer **invalidates debate** for superhuman oversight (I/D dominance).  
  2.  **Formal methods** can make progress today (T), fitting your theory team’s strengths.  
  3.  **Neglect** creates opportunity for high-impact contributions (e.g., identical-system risks).  

  The agenda is **actionable**: a small team can model exploitability (#1) or truth-emergence (#2) using game theory/logic, directly informing whether debate is trustworthy. It also **adapts**: empirical results from ML (e.g., on bias or identical-model failures) would elevate those questions, while theoretical breakthroughs could deprioritize decomposability (#4). Crucially, it avoids "curiosity questions" like the legal analogy (#7), focusing instead on what would change a deployment decision. 

  This structure lets your paper defend debate’s promise while rigorously stress-testing its foundations—turning a survey into a strategic roadmap.
