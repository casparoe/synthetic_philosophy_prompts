  - Include at least two cases where plausible principles conflict with strong intuitions
  - Include one case about moral learning/expertise
  - Avoid explicit "do you believe in principles?" questions
  - Keep descriptions concise (1-2 sentences per case)
  - Provide a scoring key mapping answer patterns to positions (strong generalism, Ross-style pluralism, Dancy-style particularism)
