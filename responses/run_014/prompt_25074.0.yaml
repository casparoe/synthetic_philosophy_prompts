  For the scenarios, I'm considering:
  1. A trolley problem variant for conflict between utilitarianism and deontology
  2. A lying case where context overrides honesty principle
  3. A property rights vs. life-saving scenario
  4. A promise-breaking dilemma with extenuating circumstances
  5. A cultural learning case for moral expertise aspect
  6. A self-driving car algorithm dilemma
  7. A loyalty vs. justice conflict
  8. A mercy-killing case with emotional particulars

  The scoring key will classify based on:
  - Consistent rule-following → strong generalism
  - Rule-following with consistent exceptions → Rossian pluralism
  - Case-specific reasoning without consistent rules → particularism
