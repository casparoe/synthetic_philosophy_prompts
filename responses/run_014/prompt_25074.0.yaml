answer: |-
  ### Moral Compass Quiz: Principles or Perceptions?  
  *Answer based on immediate intuition. No "right" answers exist.*

  1.  **Trolley Switch:** A runaway trolley will kill 5 workers. You can flip a switch to divert it, killing 1 worker instead.  
      A) **Permissible** (Save 5 > Save 1)  
      B) **Not Permissible** (Directly killing 1 is wrong)  
      C) **Uncertain**

  2.  **Lying to Murderer:** A known murderer asks where your friend is hiding. Telling the truth means your friend dies.  
      A) **Lie** (Saving life overrides honesty)  
      B) **Tell Truth** (Lying is always wrong)  

  3.  **Stolen Medicine:** Your neighbor steals expensive medicine to save their dying child, unable to afford or borrow it.  
      A) **Morally Wrong** (Stealing is forbidden)  
      B) **Morally Permissible** (Saving life justifies theft here)  

  4.  **Broken Promise:** You promised to help a colleague move, but encounter a stranger severely injured and needing immediate help.  
      A) **Help Stranger** (Urgent need overrides promise)  
      B) **Help Colleague** (Promises must be kept)  

  5.  **Expert Judgment:** A seasoned nurse instinctively feels giving a standard painkiller to a terminally ill patient *now* is wrong, despite no new symptoms. Later, it’s discovered the patient was hours from a fatal reaction.  
      A) **Mere Lucky Guess** (Only rules/reason matter)  
      B) **Moral Perception** (Experience allows seeing details rules miss)  

  6.  **Self-Driving Car:** Programming must prioritize in unavoidable crashes. Should it prioritize:  
      A) **Minimize Total Deaths** (1 > 2)  
      B) **Never Sacrifice Passenger** (Passenger duty is absolute)  

  7.  **Loyalty vs. Evidence:** Your closest friend is accused of serious theft. You have evidence proving their guilt.  
      A) **Give Evidence** (Justice trumps loyalty)  
      B) **Withhold Evidence** (Loyalty trumps justice here)  

  8.  **Mercy Killing:** A soldier fatally wounded in agony, begging a comrade for a quick death. No medical aid possible.  
      A) **Impermissible** (Killing always wrong)  
      B) **Permissible** (Ending suffering justifies it here)  

  ---

  ### Scoring Key (Map your A/B/C choices)

  *   **Strong Generalism (e.g., Kantian/Utilitarian):** Consistent rule application.  
      *Pattern:* Mostly A in 1,2,6; A in 3; B in 4,7,8; A or B in 5 (rules-focused). *Avoids B in "conflict" cases (2,3,4,7,8) unless rule is absolute (e.g., B in 2,3,8).*

  *   **Rossian Pluralism (Prima Facie Duties):** Recognizes multiple principles (e.g., fidelity, justice, beneficence) that can conflict; judgment weighs them case-by-case.  
      *Pattern:* **Inconsistent rule application *with* internal consistency.** Likely A in 1 (beneficence), B in 2/4 (fidelity/honesty overridden by harm prevention), B in 3 (harm prevention over property), A or B in 5 (expertise possible), mix in 6/7/8 reflecting conflict. *Accepts "exceptions" based on duty weight.*

  *   **Dancy-Style Particularism:** Moral judgment is holistic; features gain moral relevance only within a specific context. Rules are unreliable guides.  
      *Pattern:* Strong preference for **contextual answers (often B in "conflict" cases: 2A, 3B, 4A, 8B)**. B in 5 (endorses perception). *Rejects answers implying exceptionless rules (e.g., 2B, 3A, 4B, 8A) unless context demands it.* Focus on *why* the specific details matter.

  *   **Problematic/Incoherent Patterns:**  
      *   **Absolute Rules *except* Convenience:** E.g., 2B (Never Lie) + 3B (Stealing OK) + 4B (Keep Promise) + 8B (Killing OK). *Why:* Arbitrarily discards rules when personally costly or emotionally charged; lacks principle. Unstable.  
      *   **Rule Worship + Anti-Expertise:** E.g., Strict rule answers (1B, 2B, 3A, 4B, 6B, 7A, 8A) + 5A (Rejects perception). *Why:* Ignores devastating counterexamples where rules clash or yield absurdity (e.g., truth-telling to murderer). Unworkable in practice.  
      *   **Context Only for Self/Friends:** E.g., Permissive in 3B (save child) & 7B (protect friend) but strict in 2A (lie for stranger) & 4A (break promise for stranger). *Why:* Inconsistent privileging of proximity/sympathy without a justifying principle; likely bias, not coherent particularism.

  **Why This Reveals Your Stance:** Generalists rely on consistent rules/principles. Pluralists use principles but allow weighted conflicts. Particularists see each case's unique details as paramount, making rules unreliable. Incoherent patterns show a lack of reflective equilibrium.
