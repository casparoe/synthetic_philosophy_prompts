prompt: |-
  I teach a 200-level "evidence and inference" course that's cross-listed between philosophy and stats — 18 students, mixed majors, and I get exactly one 75-minute session to do Simpson's paradox with them. Last year I put the Berkeley admissions table on a slide and it died on contact: half of them had already seen the trick in some stats YouTube video, so they could recite "the trend reverses when you disaggregate" without feeling a thing, and when I asked which table they'd actually act on they just picked whichever one they thought I wanted. This year I want them to manufacture a reversal out of their own decisions, argue about it while it's still live, and only get the name at the very end, in the debrief, after they've already staked out positions they have to walk back. No lecture up front, no slides of someone else's data, no computers — printing and index cards only.

  Here's the half-baked mechanic I sketched in a notebook, and I'd like you to build the real thing around it (fix the numbers if mine are off, but keep the shape). Everyone is a gladiator in a two-tier league: in each round you choose whether to fight a Novice or a Champion. Each gladiator has a hidden form card giving their personal win rates against each tier, and instead of coin flips you hand them a physical deck of 10 cards per matchup type, shuffled and drawn, so the rates come out exact and the arithmetic is clean on the board. A win over a Novice is 1 point, over a Champion is 3. The scoreboard tracks wins, losses, and points. My suggested cards: a strong gladiator wins 8 of 10 against Novices and 4 of 10 against Champions; a weak one wins 5 of 10 and 1 of 10. Do the expected-value arithmetic and the strong gladiator rationally hunts Champions (0.4 × 3 beats 0.8 × 1) while the weak one farms Novices (0.5 beats 0.3) — so the strong gladiator's pooled win rate comes out at 40% and the weak one's at 50%, even though the strong one beats the weak one in both tiers. I want the room to first crown a champion by win rate, then have to defend it, and then have to say what they think "better" means here and why the question they were asked wasn't the question they answered. I'd also like a second phase that reuses the exact same table under different stories: the tier is picked by the gladiator (as in the game), the tier is assigned by a matchmaker after a fitness check the gladiator can't influence, and the tier is partly a consequence of how the gladiator did in earlier rounds — same numbers, three different right answers, and nothing in the table to tell them which story they're in.

  So what I need from you is the full runnable design: rules and scoring, the materials and what gets printed, a minute-by-minute timeline for 75 minutes, any roles (I like the idea of a Commissioner who has to declare a champion, and a couple of Scouts who only ever see the pooled table), what the facilitator says and when, and a debrief that maps specific moments in the game onto the idea — composition, confounding, and the fact that whether to aggregate is a causal question, not a statistical one. Two more things I care about. First, tell me what will predictably go wrong the first time I run this and how to handle it — I can already imagine the strong gladiator's first pick being so obviously right that the choice feels trivial, someone shouting that it's rigged once they see the decks, and a stubborn student insisting the points leader is the best fighter and refusing to budge. Second, be straight with me about what this activity can't reproduce and that I'll have to supply myself: a friend of mine does epidemiology and keeps insisting that with odds ratios you can get a reversal with no confounding at all, something about non-collapsibility, and I don't understand it well enough to stage it or to explain it — if that's right, say so and tell me how to fold it in as a caveat rather than a demo. I also want an honest note on the version of the lesson I'm losing by building the reversal into the incentives, since a sharp student will eventually notice that I arranged for the composition difference rather than discovering it.
reasoning: |-
  We are going to design an in-class activity for Simpson's paradox that is hands-on and uses physical materials (index cards and printed materials). The goal is for students to experience the paradox by making choices and then seeing the reversal. The activity will have two main phases: the gladiator game and then a reinterpretation of the same data under different causal stories.

  ### Overview of the Activity
  1. **Setup**: Students are gladiators in a two-tier league (Novice and Champion). Each has a hidden "form card" that determines their win rate against each tier. 
  2. **Gameplay**: In each round, each gladiator chooses to fight a Novice or a Champion. The outcome of each fight is determined by drawing from a pre-shuffled deck of 10 cards (representing the win rate). 
  3. **Scoring**: 
     - Win against Novice: 1 point
     - Win against Champion: 3 points
  4. **Hidden Information**: Each student (gladiator) knows their own form card (win rates) but not others'. 
  5. **Scoreboard**: Publicly tracks for each gladiator: total wins, total losses, total points, and overall win rate (wins/total fights). 
  6. **Roles**:
     - **Commissioner**: At the end of the game, declares the champion based on the pooled win rate. 
     - **Scouts (2-3 students)**: Only see the pooled table (total wins and total fights per gladiator) and must advise the Commissioner. 
  7. **Paradox Setup**: 
     - Strong gladiator: wins 8/10 against Novices, 4/10 against Champions.
     - Weak gladiator: wins 5/10 against Novices, 1/10 against Champions.
     - Expected value (EV) for strong: 
          - Novice: 0.8 * 1 = 0.8 points per fight
          - Champion: 0.4 * 3 = 1.2 points per fight -> so they should choose Champions.
     - EV for weak:
          - Novice: 0.5 * 1 = 0.5 points per fight
          - Champion: 0.1 * 3 = 0.3 points per fight -> so they should choose Novices.
     - Over time, the strong gladiator will fight mostly Champions (and win 40% of the time) and the weak gladiator will fight mostly Novices (and win 50% of the time). Thus, the weak gladiator has a higher overall win rate (50% vs 40%) even though the strong gladiator has a higher win rate against both Novices and Champions.

  ### Materials
  1. **Form Cards** (one per student, hidden from others):
     - Strong Gladiator (for half the class): 
          - Against Novice: 8 wins, 2 losses (so 8/10)
          - Against Champion: 4 wins, 6 losses (so 4/10)
     - Weak Gladiator (for the other half):
          - Against Novice: 5 wins, 5 losses (5/10)
          - Against Champion: 1 win, 9 losses (1/10)

  2. **Deck of Cards for Each Gladiator and Each Tier** (prepared in advance):
     - For a Strong Gladiator:
          - Novice deck: 8 "Win" cards and 2 "Loss" cards.
          - Champion deck: 4 "Win" cards and 6 "Loss" cards.
     - For a Weak Gladiator:
          - Novice deck: 5 "Win" and 5 "Loss"
          - Champion deck: 1 "Win" and 9 "Loss"

     Note: Each deck is specific to the gladiator and the tier they are facing.

  3. **Scoreboard**: A large poster or whiteboard with columns for:
     - Gladiator name
     - Total Wins
     - Total Losses
     - Total Points
     - Win Rate (Wins / (Wins+Losses))

  4. **Index Cards** for each fight: 
     - Each gladiator will have two decks (Novice and Champion) in front of them. When they choose an opponent tier, they draw one card from the corresponding deck.

  5. **Round Tracker**: To track the round number.

  ### Roles
  - **Commissioner (1 student)**: At the end of the game, they must declare a champion based on the pooled win rate. They can consult the Scouts.
  - **Scouts (2-3 students)**: They are only shown the pooled win rates (the overall table) and must advise the Commissioner. They do not see the breakdown by tier.

  ### Timeline (75 minutes)

  #### Phase 1: The Gladiator Game (45 minutes)
  1. **Introduction (5 minutes)**: 
     - Explain the rules: "You are gladiators in a two-tier league. Each of you has a hidden form that tells you how good you are against Novices and Champions. In each round, you choose to fight a Novice (1 point for a win) or a Champion (3 points for a win). Your goal is to maximize your points. We will play 10 rounds."
     - Assign roles: Commissioner and Scouts (they don't play as gladiators). The rest are gladiators. Assign half the gladiators as strong and half as weak (randomly). Hand out form cards and decks.

  2. **Rounds 1-10 (30 minutes)**:
     - Each round: 
          - Gladiators secretly choose to fight a Novice or a Champion (write on a slip or use a card to indicate choice).
          - Once everyone has chosen, they draw from the appropriate deck (shuffled at the start) and record the outcome (win or loss) and points.
          - Update the public scoreboard: add the win/loss and points for each gladiator and recalc win rate.
     - Facilitator walks around to help with the drawing and recording.

  3. **Declaration of Champion (10 minutes)**:
     - After 10 rounds, the Scouts are given the pooled table (total wins and total fights per gladiator) and compute the win rates. They advise the Commissioner.
     - The Commissioner declares the champion (the one with the highest win rate). 
     - Note: The strong gladiators should have lower win rates because they fought more Champions (harder opponents). The weak gladiators fought Novices (easier) and thus have higher win rates.

  #### Phase 2: Reinterpretation (15 minutes)
  - The facilitator reveals the same data (the final scoreboard) but under three different stories:
    1. **Choice**: The tier was chosen by the gladiator (as in the game). In this case, the pooled win rate is misleading because the choice of opponent is confounded by the gladiator's strength.
    2. **Assigned**: The tier was assigned by a matchmaker after a fitness check. The matchmaker assigns the strong gladiators to fight Champions and the weak to fight Novices. This is also confounded, but now the assignment is based on an external factor.
    3. **Consequential**: The tier is partly a consequence of how the gladiator did in earlier rounds. For example, if you win a lot, you get promoted to fight Champions. This is a form of collider bias or endogenous selection.

  - For each story, ask: "Who is the best gladiator?" and have a quick vote. Then discuss why the answer might change.

  #### Debrief (15 minutes)
  - Reveal the name: Simpson's paradox. 
  - Map the game to the concepts:
    - **Composition**: The groups (strong vs weak) have different compositions of opponents. The strong fight more Champions, the weak fight more Novices.
    - **Confounding**: The gladiator's strength confounds the relationship between opponent tier and win rate. It affects both the choice of opponent and the outcome.
    - **Causal Question**: The decision to aggregate or not depends on the causal story. In the first two stories, we should disaggregate. In the third, it might be more complex because of the feedback loop.
  - Connect to the Berkeley admissions case: the departments were like the tiers, and the choice of which department to apply to was confounded by the applicant's gender and strength.

  ### What Might Go Wrong and How to Handle It
  1. **Strong gladiator's first pick seems trivial**:
     - The strong gladiator has a clear incentive to pick Champions (EV: 1.2 vs 0.8). But the weak gladiator also has a clear incentive to pick Novices (0.5 vs 0.3). So the choices are rational and predictable. 
     - If a student says "it's obvious", note that in real life we don't know our own form. In the game, they know their form. The point is that the aggregated table hides the form and the opponent choice.

  2. **"It's rigged!" when they see the decks**:
     - Acknowledge: "Yes, we set up the win rates to create a paradox. But the point is to show how the paradox happens and why aggregated data can be misleading. In real life, the 'rigging' is the confounding factor we don't see."

  3. **Stubborn student insists the points leader (or win rate leader) is the best**:
     - This is the point of the paradox. Have the class discuss: 
          - "If you were a betting person, and you had to bet on a fight between the strong gladiator and the weak gladiator (in the same tier), who would you bet on?" 
          - Reveal the form cards to show that the strong gladiator has a higher win rate against both Novices and Champions. Then ask why the aggregated win rate is reversed. 
          - Emphasize that the aggregated win rate is not a fair comparison because they fought different opponents.

  4. **Time constraints**:
     - 10 rounds might be too long. Consider 5-7 rounds if needed. The key is to have enough fights so that the pattern emerges. Alternatively, pre-calculate the expected outcomes and run fewer rounds, but the drawing is part of the fun.

  ### What the Activity Can't Reproduce and Caveats
  - **Non-collapsibility without confounding**: In epidemiology, it's possible to have a reversal (or change in effect direction) in logistic regression when using odds ratios even without confounding, due to non-collapsibility. This is a more advanced point and not necessary for an introductory activity. 
    - **How to handle**: Mention during debrief: "Sometimes, even without confounding, aggregation can change the effect due to mathematical properties of the measure (like odds ratios). That's called non-collapsibility. But in our case, the reversal was due to confounding by player strength and opponent choice. In your future studies, you'll learn when reversals are due to confounding and when they are due to other factors."

  ### Losing the Element of Discovery by Building the Reversal
  - In this setup, the reversal is engineered by the instructor. A sharp student might notice that the win rates were chosen to create a reversal, and that the opponent choice is driven by the form. 
    - **Mitigation**: 
          - During debrief, acknowledge: "We set up the win rates and incentives to create the paradox. But in real life, the data doesn't come labeled. We have to think about the causal structure to decide whether to aggregate or not."
          - Emphasize that the point is to show how the paradox arises and to think critically about aggregated data.

  ### Revised Numbers to Ensure the Paradox
  - Let's verify the expected win rates after 10 rounds, assuming each gladiator follows the EV-optimal strategy:
     - Strong gladiator: fights only Champions -> 10 fights, wins 4 -> win rate 40%
     - Weak gladiator: fights only Novices -> 10 fights, wins 5 -> win rate 50%
  - But what if they don't fight 10 times? We have 10 rounds, so each gladiator fights 10 times.

  ### Final Adjustments
  - To make the paradox more striking, we can adjust the numbers slightly. The current setup works. Alternatively, we can have:
     - Strong: Novices: 7/10, Champions: 5/10 -> EV: Novice=0.7, Champion=1.5 -> still choose Champions.
     - Weak: Novices: 6/10, Champions: 2/10 -> EV: Novice=0.6, Champion=0.6 -> they are indifferent. But we want them to choose Novices. So we adjust to 1/10 for Champions? Then EV=0.3. So weak: Novices=0.6, Champions=0.3 -> choose Novices.
     - Then strong: 50% win rate (if they fight Champions) and weak: 60% win rate (if they fight Novices). The reversal is even stronger.

  But the original numbers are fine. We stick with:
  - Strong: Novice 8/10 (80%), Champion 4/10 (40%)
  - Weak: Novice 5/10 (50%), Champion 1/10 (10%)

  ### Running the Activity: Step-by-Step

  1. **Preparation**:
     - Print form cards and decks for each gladiator (strong and weak).
     - Prepare the scoreboard (large poster or whiteboard).
     - Assign roles: Commissioner, Scouts (2-3), and gladiators (the rest).

  2. **Start of Class**:
     - Introduce the game and rules (5 minutes).
     - Hand out materials: each gladiator gets a form card and two decks (Novice and Champion) for their type.

  3. **Rounds 1-10**:
     - For each round:
          - Announce the round.
          - Gladiators choose opponent tier (write on a small card or hold up a colored index card: blue for Novice, red for Champion).
          - Once all choices are made, each gladiator draws one card from the deck corresponding to their choice and records the outcome (win/loss) and points (1 for Novice win, 3 for Champion win).
          - Update the public scoreboard.

  4. **Declaration**:
     - After 10 rounds, the Scouts are given the pooled table (which is the scoreboard without the breakdown by tier). They compute the win rate for each gladiator and advise the Commissioner.
     - The Commissioner declares the champion (the gladiator with the highest win rate).

  5. **Reveal and Phase 2**:
     - Ask the class: "Do you agree with the Commissioner's choice? Why or why not?"
     - Reveal the form cards and the breakdown of fights: show that the strong gladiators mostly fought Champions and the weak ones Novices.
     - Then, present the three stories and ask who the best gladiator is in each.

  6. **Debrief**:
     - Introduce Simpson's paradox by name.
     - Discuss the concepts: composition, confounding, causal structure.
     - Connect to real examples (Berkeley admissions, medical studies, etc.).
     - Address the caveat about non-collapsibility.

  This should fit within 75 minutes. The key is to keep the rounds moving quickly.

  Would you like any part expanded or adjusted?
answer: |-
  ### **Full Activity Design: Gladiator League Simulator**  
  **Goal:** Manufacture Simpson's paradox through student choices, then dissect why aggregated data misleads. Focus on causal reasoning, not just arithmetic.  

  ---

  ### **Key Mechanics & Materials**  
  **Core Setup:**  
  - **18 students:** 12 act as gladiators (6 strong, 6 weak), 1 Commissioner, 2 Scouts, 3 observers (track causal stories).  
  - **Form Cards (hidden):**  
    - **Strong Gladiator:**  
      - `Novices: Win 8/10` → 1 point per win  
      - `Champions: Win 4/10` → 3 points per win  
    - **Weak Gladiator:**  
      - `Novices: Win 5/10` → 1 point per win  
      - `Champions: Win 1/10` → 3 points per win  
  - **Decks per Gladiator (pre-shuffled):**  
    - Strong: Novice deck (8✅, 2❌), Champion deck (4✅, 6❌)  
    - Weak: Novice deck (5✅, 5❌), Champion deck (1✅, 9❌)  
  - **Scoreboard (public poster):**  
    | Gladiator | Wins | Losses | Points | Win Rate |  
    |-----------|------|--------|--------|----------|  
    | ...      | ...  | ...    | ...    | ...      |  

  ---

  ### **Rules & Roles**  
  1. **Gladiators:**  
     - Each round, secretly choose to fight **Novice** or **Champion**.  
     - Draw 1 card from the chosen deck to determine win/loss.  
     - Goal: Maximize personal points (not win rate!).  
  2. **Commissioner:**  
     - Declares the "League Champion" after Round 10 based solely on **pooled win rate** (Wins/Total Fights).  
  3. **Scouts:**  
     - Can only see the **pooled scoreboard** (no tier breakdown). Advise the Commissioner.  
  4. **Observers (3 students):**  
     - Silently note *why* gladiators choose tiers (e.g., "Strong picked Champion for points").  

  ---

  ### **Timeline (75 Minutes)**  
  #### **Phase 1: The Game (45 min)**  
  - **0–5 min: Setup**  
    - Assign roles: Gladiators (randomly assign strong/weak forms), Commissioner, Scouts, Observers.  
    - Hand out materials: Form cards (kept secret), decks, scoreboard pens.  
    - Facilitator: *"You’re gladiators. Each round, pick your opponent: Novice (1 point per win) or Champion (3 points). Your goal is to maximize points. The Commissioner will crown a champion based on win rate."*  

  - **6–35 min: Rounds 1–10**  
    - **Each round (3 min/round):**  
      1. Gladiators secretly write opponent choice on index cards.  
      2. All reveal choices simultaneously.  
      3. Draw cards → record win/loss/points on personal logs.  
      4. Update public scoreboard.  
    - **Key facilitator prompts:**  
      - After Round 3: *"Why did you pick that tier? Was it for points or safety?"*  
      - After Round 6: *"Who’s leading in points? In win rate? Are they the same?"*  

  - **36–45 min: Crown the Champion**  
    - Scouts review pooled scoreboard (win rates only), advise Commissioner.  
    - Commissioner declares champion.  
    - Facilitator: *"Applause for [Name]! Why do they deserve it? Scouts, defend your advice."*  
    - **Expected paradox:** Weak gladiators dominate win rates (e.g., 50% vs. strong at 40%).  

  #### **Phase 2: Reinterpretation (15 min)**  
  - **Same scoreboard, three stories:**  
    1. **Choice:** *"You picked your opponents freely (as in the game). Who’s best?"*  
    2. **Assigned:** *"A matchmaker assigned tiers after a fitness test. Strong gladiators fought Champions; weak fought Novices. Who’s best?"*  
    3. **Consequential:** *"Tiers were based on performance: win 2+ fights? Promote to Champion tier. Who’s best?"*  
  - **Vote & argue:** Students vote for each story. Observers share notes.  

  #### **Debrief (15 min)**  
  - **Reveal the trick:** *"This is Simpson’s paradox. The ‘best’ gladiator reversed when we aggregated data."*  
  - **Map to concepts:**  
    | **Game Moment** | **Concept** | **Real-World Example** |  
    |-----------------|-------------|------------------------|  
    | Hidden form cards | **Confounding:** Strength affects choice and outcome | Berkeley admissions: Women applied to competitive departments. |  
    | "Who’s best?" debates | **Composition:** Pooled data ignores tier differences | Medical trials: Drug effectiveness varies by patient subgroups. |  
    | Story-based voting | **Causal question:** Aggregation depends on *why* tiers were chosen | Policy decisions: Should we fund schools based on overall or subgroup performance? |  
  - **Final prompt:** *"Was the Commissioner’s question (‘best win rate’) the same as ‘best fighter’? Why not?"*  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"Strong gladiators obviously pick Champions!"**  
     - **Why it happens:** Early rounds make optimal choices feel intuitive.  
     - **Fix:** After Round 2, ask: *"Weak gladiators—why might you avoid Champions?"* Highlight points incentives.  

  2. **"It’s rigged!" when decks are revealed.**  
     - **Fix:** Preempt it: *"Yes, we engineered win rates to mirror real-world dynamics. Your job is to find why the paradox happens."*  

  3. **Stubborn student: "Points leader is the real champion!"**  
     - **Fix:** Challenge: *"Bet on a fight: Strong vs. Weak gladiator, both against a Champion. Who wins more? Now check their form cards."*  

  4. **Time crunch:**  
     - **Fix:** Reduce to 8 rounds; pre-fill scoreboard with dummy data for rounds 1–4.  

  ---

  ### **What This Activity Can’t Do**  
  1. **Non-Collapsibility (Odds Ratios):**  
     - **The gap:** This demo relies on **confounding** (strength → tier choice). Simpson’s paradox can also occur via **non-collapsibility**—a mathematical artifact in logistic regression where odds ratios change upon aggregation, even without confounding.  
     - **How to address:** Post-activity note:  
       > *"Sometimes reversals happen without confounding (e.g., in odds ratios). This is called non-collapsibility. We focused on the confounder-driven paradox today, but advanced stats courses will explore the math behind both."*  
     - **Resource:** Share a 2-minute video (e.g., *"StatQuest: Non-Collapsibility"*) as homework.  

  2. **Losing the "Discovery" Element:**  
     - **The trade-off:** By building the reversal into incentives, students don’t "discover" composition bias organically.  
     - **Mitigation:**  
       - In debrief, ask: *"How could you spot this paradox in wild data?"* → Highlight red flags (e.g., subgroup variances, missing covariates).  
       - Contrast with Berkeley: *"We knew the confounder here (strength). Real-world cases require detective work!"*  

  ---

  ### **Printables & Logistics**  
  - **For gladiators:**  
    - **Form card** (index card):  
      ```  
      STRONG GLADIATOR  
      vs. Novice: 8 wins, 2 losses → 1 pt/win  
      vs. Champion: 4 wins, 6 losses → 3 pts/win  
      ```  
    - **Choice cards** (2/index card): "Novice" / "Champion" (hold up during reveals).  
  - **For facilitator:**  
    - Pre-filled scoreboard with gladiator names.  
    - Observer cheat sheet: *"Track: Why did strong/weak gladiators choose their tiers?"*  
  - **Room setup:** Desks in a U-shape for easy card reveals/scoreboard viewing.  

  --- 

  ### **Why This Works**  
  - **Manufactured conflict:** Students *create* the paradox via rational choices, making it visceral.  
  - **Causal emphasis:** The "three stories" phase forces them to see that data alone doesn’t dictate answers.  
  - **Low tech, high engagement:** Physical cards make probabilities tangible; arguments erupt organically.  

  **Final tip:** End by asking: *"If you could ask one question about the data to avoid this paradox, what would it be?"* (Answer: *"What’s the tier-specific win rate?"*). This primes them for stratification in future cases.
