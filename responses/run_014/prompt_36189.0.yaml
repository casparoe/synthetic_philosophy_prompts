  We are given a situation where we have a prior probability distribution over some events, and then we receive conditional information of the form: given that some antecedent event A occurs, the ratio of the probabilities of two events B and C (which are mutually exclusive and exhaustive in the world where A occurs) is fixed. However, we have no information about the probability of A itself. The problem is how to update our prior to incorporate this conditional information.

  Let me formalize the problem:

  We have three events (or more generally, we can think in terms of a partition of the sample space):
  - A: the antecedent event (e.g., "attacker has admin access", or "the fault is active")
  - B: one of the outcomes given A (e.g., "breach came through vendor portal" given A, but note that B might be defined only within A? Actually, we can define B and C as events that are disjoint and such that B∪C = A? Or more generally, we might have a partition of the entire space that includes A and not-A, and then within A we have a partition of B and C. But note the problem says: "three-way partitions (antecedent; one way the antecedent-world could go; another way)". So we can think of the sample space as partitioned by:
    1. A ∩ B
    2. A ∩ C
    3. not A (which we might call D)

  But note that the conditional information is only about the ratio of the probabilities of B and C given A. Specifically, we are told that P(B|A) / P(C|A) = k (for example, k=3 in the first case). However, we are not given any update about P(A).

  The prior distribution is defined over the entire space (so we have prior probabilities for A∩B, A∩C, and not A). The conditional information does not directly tell us about the probability of A. Therefore, without additional information, we cannot uniquely determine the posterior.

  The problem is that we are given a constraint on the posterior distribution:

    P'(B|A) / P'(C|A) = k

  and we are to update the prior to a posterior that satisfies this constraint. But note that the constraint does not specify how the probability of A (or the probabilities of events outside A) should change. Hence, there are many posterior distributions that satisfy the constraint.

  The question is: how do we update the prior to a posterior that satisfies the constraint?

  We are told about four different approaches:

  1. Refuse to update: This person says that without information about the antecedent, we cannot update. So the prior remains unchanged. But note that the constraint might not be satisfied by the prior. If the prior already satisfies the constraint, then this is fine. But if not, then we are not incorporating the new information.

  2. Keep the probability of A fixed and only update inside A: This approach sets P'(A) = P(A) and then sets P'(B|A) and P'(C|A) to satisfy the ratio constraint. However, we must also adjust the probabilities of the events within A to respect the ratio and the fact that P'(B|A) + P'(C|A) = 1. So we can solve:

     P'(B|A) = k * P'(C|A)
     P'(B|A) + P'(C|A) = 1

     => k * P'(C|A) + P'(C|A) = 1
     => P'(C|A) = 1/(k+1)
     => P'(B|A) = k/(k+1)

     Then, the posterior probabilities for the events A∩B and A∩C are:

     P'(A∩B) = P'(B|A) * P'(A) = [k/(k+1)] * P(A)
     P'(A∩C) = P'(C|A) * P'(A) = [1/(k+1)] * P(A)

     And for the event not A, we leave it unchanged: P'(not A) = P(not A). But note that the total probability of A∩B and A∩C together is P(A), so we are not changing the total probability of A. However, we have redistributed the probability within A.

  3. Pick the posterior that is closest to the prior: This is a minimum relative entropy (or minimum Kullback-Leibler divergence) approach, or perhaps another measure of distance. The idea is to choose the posterior that satisfies the constraint and is as close as possible to the prior.

  4. Ask for the full joint distribution: This is not always possible, and we are in a situation where we cannot get more.

  Now, the question is: which of these is the "correct" update? And is there a standard approach in the literature?

  In the Bayesian literature, the problem of updating with conditional information without information on the conditioning event is known and has been discussed. One of the most common approaches is to use the "minimum relative entropy" (MinEnt) principle. The relative entropy (or Kullback-Leibler divergence) from the prior Q to the posterior P is defined as:

    D(P || Q) = sum_{i} P(i) log(P(i)/Q(i))

  We minimize D(P || Q) subject to the constraint that P satisfies the given condition (and also that P is a probability distribution, i.e., non-negative and sums to 1). This method is also known as the principle of minimum discrimination information.

  Another approach is to use Jeffrey's rule of conditioning, but note that Jeffrey's rule is for when we have a new probability distribution over a partition and we update by keeping the conditionals given the partition elements constant. In our case, we are given a constraint only on the conditional probabilities within A, and we are not given a new probability for A.

  However, note that the constraint we have is a linear constraint on the probabilities? Actually, the constraint that P(B|A) / P(C|A) = k can be rewritten as:

    P(A∩B) / P(A∩C) = k

  which is equivalent to:

    P(A∩B) = k * P(A∩C)

  This is a linear constraint. Also, we have the normalization constraint: P(A∩B) + P(A∩C) + P(not A) = 1.

  So we have a linear constraint and we are minimizing the relative entropy. This is a convex optimization problem and has a unique solution.

  But note: we have two free variables: P(A∩B), P(A∩C), and P(not A) is also free? Actually, the entire distribution over the three events is being adjusted. We have three probabilities that sum to 1. The constraint gives one equation. So we have two degrees of freedom. The MinEnt principle will give a unique update.

