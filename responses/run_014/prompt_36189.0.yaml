  - Diaconis, P., & Zabell, S. L. (1982). Updating Subjective Probability. Journal of the American Statistical Association, 77(380), 822–830.
  - Cover, T. M., & Thomas, J. A. (2006). Elements of Information Theory. (discusses minimum relative entropy)
  - Jeffrey, R. (1965). The Logic of Decision. (for Jeffrey conditionalization)

