answer: |-
  Your scenario is a classic instance of **updating probabilities with purely conditional information**, a well-recognized challenge in Bayesian epistemology, decision theory, and probabilistic reasoning. The core issue is that conditional constraints (e.g., likelihood ratios given an antecedent) don't specify how to update the **joint** or **marginal** probabilities, leading to underdetermination. Below, I break down the named concepts, proposed solutions, what's settled (math), and what's contested (philosophy/rationality).

  ---

  ### **1. Named Problem & Canonical Frameworks**
  Your problem is most directly addressed in two interconnected literatures:
  - **The Problem of "Uninformative Antecedents" in Conditional Information**:  
    When you receive a constraint like \(P(B \mid A) / P(C \mid A) = k\) but no information about \(P(A)\) or \(P(\neg A)\), the joint distribution is underdetermined. This is a subcase of **updating with incomplete constraints**.

  - **Key Frameworks**:
    - **Jeffrey Conditionalization**: Generalizes Bayesian updating to cases where you revise probabilities over a *partition* (e.g., \(A\) and \(\neg A\)). However, it *requires* new marginal probabilities for the partition, which you lack.
    - **Minimum Cross-Entropy (MinEnt) / Kullback-Leibler (KL) Minimization**: The information-theoretic approach for updating under partial constraints by minimizing "divergence" from the prior.
    - **Constant Odds Conditionalization**: A special case where only conditional probabilities within a partition element are updated, leaving marginals unchanged (similar to your colleague's "shuffle inside branches" approach).
    - **Diaconis & Zabell's "Updating on Conditional Information"**: Seminal work (1982) formalizing how to handle constraints like \(E[g(X) \mid Y] = c\) when \(Y\) is unobserved. Your case fits here.

  The canonical version of your problem is often called **updating with a conditional likelihood ratio constraint** and is a toy example in debates about **partial constraints**.

  ---

  ### **2. Proposed Update Rules & Their Justifications**
  Here are the four approaches you described, mapped to formal methods:

  | Approach                  | Formal Rule                                                                 | Mathematical Expression                                                                 |
  |---------------------------|-----------------------------------------------------------------------------|----------------------------------------------------------------------------------------|
  | **1. Refuse to update**   | *Strict Bayesianism* (inapplicable)                                         | No update: \(P_{\text{new}} = P_{\text{prior}}\)                                       |
  | **2. Fix \(P(A)\), update conditionals** | *Constant Odds Conditionalization* (a.k.a. *conditionalization*)         | \(P_{\text{new}}(B \mid A) = \frac{k}{k+1}\), \(P_{\text{new}}(C \mid A) = \frac{1}{k+1}\),<br>\(P_{\text{new}}(A) = P_{\text{prior}}(A)\),<br>\(P_{\text{new}}(\neg A, \cdot) = P_{\text{prior}}(\neg A, \cdot)\) |
  | **3. Minimize divergence** | *Minimum Cross-Entropy (MinEnt)* / *KL Minimization*                     | Minimize \(D_{KL}(P_{\text{new}} \parallel P_{\text{prior}})\) subject to \(P_{\text{new}}(B \mid A) / P_{\text{new}}(C \mid A) = k\) |
  | **4. Demand full joint**  | *Elicitation failure* (not a solution)                                      | N/A                                                                                    |

  ---

  ### **3. Settled Math vs. Contested Rationality**
  #### **Settled Math** (Agreed upon in the literature)
  - **Underdetermination**: All agree that *without additional assumptions*, the constraint \(P(B \mid A) / P(C \mid A) = k\) defines a **family of valid posteriors**, not a unique one. This is a linear constraint on the joint distribution, but it leaves \(P(A)\) and \(P(\neg A, \cdot)\) free.
  - **MinEnt has a unique solution**: Minimizing \(D_{KL}(P_{\text{new}} \parallel P_{\text{prior}})\) subject to linear constraints yields a unique posterior (exponential family solution).  
    - For your example: If the prior is \(P_\text{prior}(A, B) = p\), \(P_\text{prior}(A, C) = q\), \(P_\text{prior}(\neg A) = r\), the MinEnt posterior satisfies:
      \[
      P_{\text{new}}(A, B) = \frac{k}{k+1} \cdot \lambda, \quad P_{\text{new}}(A, C) = \frac{1}{k+1} \cdot \lambda, \quad P_{\text{new}}(\neg A) = r \cdot \lambda'
      \]
      where \(\lambda, \lambda'\) are normalization factors depending on \(p, q, r, k\).
  - **Constant Odds is a special case of MinEnt**: If you *add* the constraint \(P_{\text{new}}(A) = P_{\text{prior}}(A)\), MinEnt reduces to Constant Odds Conditionalization.

  #### **Contested Rationality** (Where disagreement kicks in)
  - **Is any update *required*?**  
    - **Refusing to update** is indefensible if you accept the constraint as information. Rationality requires consistency with *all* information, so the prior must be updated (Savage, 1954; Jaynes, 2003).
    - **Contested**: Whether conditional information *alone* mandates an update. Hardliners (e.g., strict Bayesians) say no; others say yes.
    
  - **Which divergence to minimize?**  
    - MinEnt uses \(D_{KL}(P_{\text{new}} \parallel P_{\text{prior}})\) ("information gain"). Some argue for \(D_{KL}(P_{\text{prior}} \parallel P_{\text{new}})\) ("inaccuracy"), or other \(f\)-divergences.  
    - **Contested**: Whether KL-minimization is *uniquely rational* or just *convenient*. Proponents (e.g., Shore & Johnson, 1980) prove it's the only consistent rule; critics say it's application-dependent.

  - **Should \(P(A)\) stay fixed?**  
    - **Constant Odds Conditionalization** assumes the expert's silence on \(A\) means \(P(A)\) shouldn't change.  
    - **MinEnt** allows \(P(A)\) to change if it reduces divergence.  
    - **Contested**: Whether conditional information "implies" marginal invariance. Philosophers (e.g., Jeffrey, 1983) vs. information theorists (e.g., Cheeseman, 1988) clash here.

  - **Is MinEnt "rational"?**  
    - Pro: MinEnt satisfies **path independence**, **locality**, and avoids bias (Diaconis & Zabell, 1982).  
    - Con: MinEnt can alter \(P(A)\) even when the expert "says nothing" about it, which feels like overreach (van Fraassen, 1981).

  ---

  ### **4. Key Controversies & Recommendations for Your Work**
  - **The Core Disagreement**:  
    > **Is conditional information alone sufficient to demand *any* update? If yes, is there a *uniquely rational* way to update, or is it context-dependent?**  
    - **MinEnt camp**: Yes, and MinEnt is uniquely rational (axiomatic foundations).  
    - **Conditionalizers**: Update, but only within \(A\) (to avoid "inventing" information about \(P(A)\)).  
    - **Subjective Bayesians**: Any update is valid if consistent; it's a modeler's choice.

  - **Practical Recommendations**:  
    - **Default to MinEnt** if you prioritize information-theoretic optimality and have computational tools (e.g., convex optimization). It's standard in ML for probabilistic constraints.  
    - **Use Constant Odds** if the expert's silence on \(A\) is interpretable as "no marginal update" (common in risk assessment).  
    - **Sensitivity analysis**: Test how conclusions vary across updates. If results are robust, the choice matters less.

  - **Literature to Explore**:  
    - **Canonical debates**: Diaconis & Zabell (1982) vs. van Fraassen (1981) on updating rules.  
    - **MinEnt foundations**: Shore & Johnson (1980); Caticha (2012).  
    - **Philosophy of conditional info**: Jeffrey (1983), Hájek (2003).  
    - **ML applications**: Barron & Sheu (1991) for MinEnt in constrained learning; probabilistic graphical models with soft constraints.

  ---

  ### **Final Word**
  Your puzzle exposes a deep rift: **MinEnt is mathematically elegant but not universally accepted as "rational"**—it's a *normative choice*. In ML practice, MinEnt is common (especially in probabilistic programming), but philosophers argue it smuggles in assumptions about \(P(A)\). The "correct" choice depends on whether you view probability as primarily *epistemic* (MinEnt) or *testimonial* (Constant Odds). Always clarify your update rule's assumptions in your methodology. If you pursue this theoretically, Diaconis & Zabell (1982) is your entry point.
