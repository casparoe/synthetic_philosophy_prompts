  Is the second approach the same as the MinEnt approach? Let's see.

  In the MinEnt approach, we minimize D(P || Q) subject to the constraint P(A∩B) = k * P(A∩C) and the normalization. We also have the constraint that the probabilities are non-negative.

  We can write the Lagrangian. But note: if we also impose the constraint that P(not A) remains the same, then we are effectively reducing the problem to updating within A. Without that constraint, the MinEnt solution might change P(not A) as well.

  But wait: the constraint does not involve P(not A). Therefore, the MinEnt update might change P(not A) to make the posterior closer to the prior? Let me do a simple example.

  Example:

  Prior:
    P(A∩B) = 0.2
    P(A∩C) = 0.2
