    D(P||Q) = P(A∩B) log(P(A∩B)/0.2) + P(A∩C) log(P(A∩C)/0.2) + P(not A) log(P(not A)/0.6)

  subject to:
    P(A∩B) = 3 * P(A∩C)
    P(A∩B) + P(A∩C) + P(not A) = 1

