  The domain: x>=0, 1-4x>=0 -> x in [0,1/4].

  So we minimize:

    f(x) = 3x * log(3x/0.2) + x * log(x/0.2) + (1-4x)*log((1-4x)/0.6)

  Take derivative and set to zero.

  Alternatively, we can use the method of Lagrange multipliers. The constraint is linear, so the solution should be of the form that the ratios of the probabilities for events that are not constrained are preserved? Actually, the principle of minimum relative entropy for linear constraints leads to an exponential family.

  But note: the constraint only affects the two events A∩B and A∩C. We have:

    P(A∩B) = 3 * P(A∩C)

  and we are free to adjust all three. The unconstrained event is not A.

  The general solution for minimum relative entropy under linear constraints is that the posterior is proportional to the prior times an exponential of the Lagrange multipliers times the constraints. But here we have one constraint. Alternatively, we can use the fact that the minimum relative entropy update for constraints on conditional probabilities can be more complex.

  However, note that the constraint equation is linear. We can write:

    P(A∩B) - 3 * P(A∩C) = 0.

  We can set up the Lagrangian:

    L = sum P_i log(P_i/Q_i) + λ (P(A∩B) - 3 P(A∩C)) + μ (sum P_i - 1)

  Taking the derivative with respect to P(A∩B), P(A∩C), and P(not A):

    For P(A∩B): 1 + log(P(A∩B)/Q(A∩B)) + λ + μ = 0
    For P(A∩C): 1 + log(P(A∩C)/Q(A∩C)) - 3λ + μ = 0
    For P(not A): 1 + log(P(not A)/Q(not A)) + μ = 0

  This is messy, but note that we can express:

    log(P(A∩B)) = -1 - μ - λ + log(Q(A∩B))
    log(P(A∩C)) = -1 - μ + 3λ + log(Q(A∩C))
    log(P(not A)) = -1 - μ + log(Q(not A))

  Exponentiating:

    P(A∩B) = exp(-1-μ) * Q(A∩B) * exp(-λ)
    P(A∩C) = exp(-1-μ) * Q(A∩C) * exp(3λ)
    P(not A) = exp(-1-μ) * Q(not A)

  Now, we have the constraint:

    P(A∩B) = 3 * P(A∩C) 
    => Q(A∩B) * exp(-λ) = 3 * Q(A∩C) * exp(3λ)
    => exp(-λ) / exp(3λ) = 3 * Q(A∩C) / Q(A∩B)
    => exp(-4λ) = 3 * (Q(A∩C)/Q(A∩B))

  So:

    exp(-4λ) = 3 * (0.2/0.2) = 3 * 1 = 3
    => -4λ = ln(3)
    => λ = -ln(3)/4

  Then, we also have the normalization:

    exp(-1-μ) [ Q(A∩B)*exp(-λ) + Q(A∩C)*exp(3λ) + Q(not A) ] = 1

  Plugging in the numbers:

    exp(-1-μ) [ 0.2 * exp(-λ) + 0.2 * exp(3λ) + 0.6 ] = 1

  We know λ = -ln(3)/4, so:

    exp(-λ) = exp( ln(3)/4 ) = 3^{1/4}
    exp(3λ) = exp(-3 ln(3)/4) = 3^{-3/4}

  So:

    S = 0.2 * 3^{1/4} + 0.2 * 3^{-3/4} + 0.6

  Then:

    exp(-1-μ) = 1 / S

  Then we can compute the probabilities.

  But note: in this solution, P(not A) is not equal to the prior Q(not A)=0.6. It is:

    P(not A) = exp(-1-μ) * Q(not A) = (0.6) / S

  and similarly for the others. Since S is not 1, P(not A) is not 0.6.

  Therefore, the MinEnt update does change the probability of A (and hence of not A). It is not the same as the second approach.

  So now we have two different updates: the second approach (fixing P(A)) and the MinEnt approach (which changes P(A)). Which one is correct?

  The problem is that without further constraints (like the principle we adopt), both are valid. The literature has discussed several principles.

  This kind of update is sometimes called "updating on conditional information" or "updating with a conditional constraint". One of the key references is by Diaconis and Zabell (1982) titled "Updating Subjective Probability" (JASA). They discuss several methods, including:

  1. Jeffrey's rule: which is for when we get a new distribution over a partition. But in our case, we are not given a new distribution over the partition {A, not A}, but rather a conditional constraint within A.

  2. The minimum relative entropy method.

  3. Other methods.

  Another important concept is "log-odds" updating or other forms.

  But note: the second approach (fixing P(A)) is actually a special case of what is sometimes called "conditionalization" but only on the condition that A occurs? However, we are not learning that A occurs. We are learning a constraint about what happens if A occurs.

  There is a principle called the "principle of minimal change": we change the prior as little as possible to incorporate the new constraint. But what is "little"? The second approach changes the conditional distribution within A to exactly satisfy the constraint and leaves the rest unchanged. The MinEnt approach changes the entire distribution to satisfy the constraint and minimizes the relative entropy.

  Both are minimal change in different senses. The second approach is minimal in the sense of only changing the conditional distribution given A (and thus leaves the marginal of A and the distribution given not A unchanged). The MinEnt approach is minimal in the sense of relative entropy, which is a global measure.

  In the literature, both approaches have been proposed. The second approach is sometimes called "conditional updating" or "updating by conditionalization" for the part of the space A. The MinEnt approach is more general and is often used in information theory and statistical physics.

  Which one is standard? It depends on the context. In the Bayesian epistemology literature, there is a principle called "Jeffrey conditionalization" which updates the probability of the partition elements. However, we don't have a new probability for A, so we cannot apply Jeffrey conditionalization directly.

  Another approach is to use the concept of "imaging" from Lewis, but that is more for counterfactuals.

  So, to summarize:

  - The problem is known, and there are different update rules.
  - The two most common rules in this context seem to be:
     a) The one that keeps the marginal probability of A fixed and updates the conditionals within A to satisfy the constraint (which we'll call the "fixed marginals" update).
     b) The minimum relative entropy update.

  - These rules are different and lead to different posteriors.

  Which one should we use? That is a philosophical question. The fixed marginal update might be justified if we believe that the expert's statement does not provide any information about the probability of A. The MinEnt update might be justified by the principle of minimum change of information.

  In practice, the fixed marginal update is simpler and more intuitive. However, the MinEnt update is more flexible and can accommodate multiple constraints.

  But note: the fixed marginal update can be seen as a constrained version of the MinEnt update: we are adding an extra constraint that P'(A) = P(A). Without that constraint, the MinEnt update might change P(A). If we have no reason to change P(A), then the fixed marginal update might be preferred. On the other hand, if we want to minimize the overall change in the distribution, the MinEnt update is more appropriate.

  In the literature, both are used. However, the fixed marginal update is more common in simple applications because it is straightforward and does not require optimization. The MinEnt update is common in information theory and machine learning.

  Conclusion:

  - The problem is known as updating with conditional constraints or updating on conditional information.
  - There is no single "canonical" solution. The two main approaches are:
     1. Fixed marginal update (keep P(A) unchanged and update the conditional within A).
     2. Minimum relative entropy update.

  - The fixed marginal update is a special case of the MinEnt update with the additional constraint that P(A) is fixed.

  - The choice between these methods is not settled by mathematics alone; it depends on the interpretation of the information and the principles of minimal change we adopt.

  For your work, you might consider:

