prompt: |-
  I'm a PhD student in metaphysics, and I've been tracking a pattern in our departmental seminars that I can't find a precise label for. It's somewhere in the neighborhood of verbal disputes and metaontological deflationism, but none of the standard categories seems to fit it exactly, and I'd like help carving it at the joints.

  Here are three instances. First: two of our faculty spent most of a colloquium arguing about whether holes exist. After forty minutes, it emerged that they agree on every underlying fact — they agree the cheese has a perforation, that you can put your finger through it, that the perforation isn't made of anything, that "there's a hole in the cheese" is a perfectly acceptable thing to say in ordinary English. What they disagree about is whether, given all those facts, the sentence "holes exist" — read as an ontological claim, not a loose manner of speaking — is true. Neither thinks the other has made a factual error about the cheese; each thinks the other is applying an incorrect standard for what it takes to exist. Second: a structurally identical dispute about whether numbers exist. Both parties agree on all the mathematical facts — they agree that "2 + 2 = 4" is true, that there is no largest prime, that mathematical practice doesn't require us to locate numbers in spacetime. They disagree only about whether, given all that, "numbers exist" is true. Again, neither thinks the other is mistaken about mathematics; they think the other is using the wrong criterion of existence. Third: a dispute about whether a statue is identical to the lump of clay that constitutes it. Both agree on all the modal facts (the lump could survive being squashed; the statue couldn't), all the temporal facts (the lump existed before the statue was formed), and all the material facts (they're made of the same stuff). They disagree only about whether the statue is a distinct object from the lump. And again, neither thinks the other has misdescribed the modal, temporal, or material situation.

  In all three cases, the disagreement survives full agreement on every first-order fact that can be stated without the contested vocabulary. And yet the participants don't treat the dispute as merely verbal — they think something substantive is at stake, something about which standard is correct, not just which words are convenient. I know Chalmers's framework of verbal disputes and the method of elimination, I know Hirsch's quantifier variance where the two sides mean different things by the quantifier and so both speak truly by their own lights, and I know the deflationist line that these disputes are shallow. But what I'm seeing doesn't match any of these perfectly. It's not a Chalmers-style verbal dispute, because the disagreement persists after all terms are disambiguated — they're not using "exist" in different senses, they're using it in the same sense but with different stringency thresholds. It's not quantifier variance, because they don't seem to mean different things by "there is" — they mean the same thing but disagree about where the line gets drawn. And it's not straightforward deflationism, because the disputants themselves don't experience the dispute as shallow, and they seem to be disagreeing about something normative — which standard one ought to apply — rather than something factual.

  Is there an established term for this specific configuration: agreement on all non-ontological facts, shared meaning of the ontological vocabulary, but disagreement about the standard of application? If there is, what are its boundaries, and how exactly does it differ from verbal disputes, quantifier variance, and deflationism? If there isn't, what would you call it, and how would you define it so that it doesn't collapse into one of those neighboring categories?
reasoning: |-
  Okay, this is a fascinating and nuanced question from a PhD student in metaphysics. They're describing a very specific pattern in ontological disputes that doesn't neatly fit into existing categories like verbal disputes, quantifier variance, or deflationism. Let me unpack what they're seeing.

  First, the pattern: three clear cases where philosophers agree on all first-order facts but still disagree about ontological claims. The holes example is classic - both agree about the cheese's properties but debate whether "holes exist" is true. Same with numbers - full agreement on math, disagreement on whether numbers exist. And the statue/clay case - consensus on modal/temporal facts but not on identity. 

  What makes this interesting is what it's NOT. It's not Chalmers-style verbal dispute because disambiguation doesn't resolve it - they're using "exist" in the same sense. Not Hirsch's quantifier variance because they share the concept of existence but draw boundaries differently. Not deflationism because they treat it as substantive, not shallow. The key is they're disagreeing about normative standards for applying ontological concepts despite shared meanings and factual agreement.

  Hmm... this reminds me of Carnap's internal/external distinction but pushed further. The disputants seem to be having a meta-level disagreement about which ontological framework to adopt. They're not arguing about facts within a framework, but about which framework's standards to use. That's why it feels substantive to them - they're debating conceptual norms.

  I recall Sider's metaphysical realism could be relevant here - he'd say one side is objectively wrong about the structure of reality. But that might be too strong. Maybe Jenkins' conceptual ethics fits better - they're disagreeing about which concepts we should employ, which is ultimately a normative choice.

  The closest established term might be "framework negotiation" or "ontological stance disagreement." But we should be precise. This isn't just choosing convenient language; it's about what counts as real in our best theory. The normative dimension is crucial - they think there's a correct answer about which standard to apply.

  To distinguish it: unlike verbal disputes, meaning is fixed but application criteria differ. Unlike quantifier variance, the meaning of quantification isn't varying. Unlike deflationism, they see real normative stakes in which framework we commit to.

  If coining a new term, "criterial divergence in ontological commitment" might work, emphasizing the shared concept but different thresholds. Or "normative ontology selection" to highlight the choice aspect. The definition would need to stress: fixed semantics, exhaustive factual agreement, and disagreement about correct application standards for ontological concepts.

  This actually connects to Carnap's principle of tolerance - but interestingly, the disputants don't seem tolerant! They think their standard is objectively correct. That tension between pluralism and realism about frameworks is exactly what makes this philosophically rich.
answer: |-
  What you're describing is a **metaontological disagreement about criteria of existence** that persists despite shared meanings and exhaustive agreement on non-ontological facts. This pattern doesn't collapse into existing categories due to its unique features:

  ### Core Characteristics:
  1. **Exhaustive first-order agreement**: All descriptive facts (physical, mathematical, modal, etc.) are uncontested.
  2. **Shared semantic content**: Key terms (e.g., "exist," "object") have identical meanings.
  3. **Divergent application thresholds**: Disagreement centers on *what satisfies* the criteria for existence/identity.
  4. **Normative dimension**: Participants treat it as substantive disagreement about *correct standards* for ontological commitment.

  ### Established Conceptual Neighbors & Distinctions:
  | **Framework**          | **Key Difference from Your Cases**                          |
  |------------------------|-------------------------------------------------------------|
  | **Chalmers' Verbal Disputes** | Disambiguation *resolves* verbal disputes; here it *reveals* deeper normative disagreement about application conditions. |
  | **Hirsch's Quantifier Variance** | Assumes semantic divergence (different quantifier meanings); here quantifier meaning is shared but *extension* is contested. |
  | **Deflationism**        | Deflationists see disputes as shallow; your participants treat them as normatively substantive. |
  | **Carnapian Frameworks** | Closer, but Carnap views framework choice as pragmatic; your disputants treat it as objectively correct/incorrect. |

  ### The Closest Existing Term: **Ontological Minimalism vs. Inflationism**
  - **Minimalism**: Holds that existence claims are true if entities play roles in our best theories (e.g., "holes exist" is true if hole-talk is indispensable).
  - **Inflationism**: Requires additional criteria (e.g., causal powers, mind-independence) for existence.
    *Your cases fit this tension:* The hole-dispute minimalist accepts existence based on linguistic/conceptual utility; the inflationist demands physical substantiveness. Similarly for mathematical Platonism vs. fictionalism.

  ### Proposed New Terminology: **Criterial Divergence in Ontological Commitment**
  **Definition**: A metaontological disagreement where:
  - All parties share concepts of existence/identity and agree on base facts.
  - Disagreement concerns *which conditions* must obtain for an entity to satisfy "exists" or "is identical to."
  - The dispute is normative: about *correct standards* for ontological commitment.

  **Boundaries**:
  - **Lower bound**: Excluded if disambiguation resolves dispute (Chalmers).
  - **Upper bound**: Excluded if disagreement involves first-order facts or semantic variance (Hirsch).
  - **Lateral bound**: Excluded if parties deem the dispute non-substantive (deflationism).

  ### Why This Avoids Collapse:
  1. **Against verbal disputes**: Shared meanings prevent resolution through disambiguation (§3 above).
  2. **Against quantifier variance**: Same quantifier meaning, but divergent *truth-conditions* for its application.
  3. **Against deflationism**: Normative stakes ("ought we apply Standard A or B?") preserve substance.

  ### Key References:
  1. **Sider's Metaontology** (2011): Distinguishes "disagreement about what exists" vs. "disagreement about the meaning of 'exists'." Your cases fit his "substantive ontological disagreement" category.
  2. **Eklund's "Deep Disagreement"** (2017): Addresses disputes where disagreement "persists all the way up" through conceptual hierarchies.
  3. **Jenkins' Conceptual Ethics** (2014): Frames ontological disputes as choices about which concepts *ought* to be used.

  ### Practical Test for Identification:
  When parties agree that:
  - "If Standard S is correct, then X exists"  
  - But disagree on "Standard S *is* correct"  
  - While sharing all non-S facts...  
  → You have criterial divergence.

  This pattern reveals ontology's normative undercurrent: what we *ought to count as real* isn't settled by facts or semantics alone. It's a live frontier in metaontology—your observation suggests a need for finer-grained taxonomy. If coining a new term, **"normative ontology selection"** could capture the active choice between competing standards.
