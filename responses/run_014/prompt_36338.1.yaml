prompt: |-
  So our CTO keeps saying we're "falling prey to the sunk cost fallacy" whenever we keep going on anything that's taken more than a few months, and honestly it's become a conversation stopper. Like we have this in-house ORM replacement we're 8 months into, it's maybe 60% done, morale around it is bad, and every planning meeting someone (sometimes me tbh) says "sunk costs, kill it" like that settles the thing. But I've been reading a bit and it seems like the textbook version -- "rational agents ignore sunk costs, period" -- is maybe too clean? Like, the money already spent doesn't *logically* compel finishing, but it can still be *evidence*: nobody spends 8 months on something without learning things about the codebase that a fresh decision made today would incorporate. The fact that we were willing to invest that much might mean the people closest to it know something. Also there's the team-reputation / commitments-to-other-teams angle, which feels like it shouldn't count but our platform team genuinely plans their quarter around us delivering this thing, and killing it has real costs that aren't "sunk" at all, they're future ones.

  So here's what I want. I'm going to run a retro on the ORM project and I want to propose an actual decision procedure, not vibes. Turn whatever the real philosophy of this says into a checklist or ordered set of questions that a bunch of engineers (zero philosophy background, one of them will 100% make a joke about "sunk cost fallacy fallacy") could actually run in a 45-minute meeting. Requirements:

  1. It has to make the distinction between "sunk costs are biasing us" and "sunk costs gave us information that a cold restart would throw away" operational -- like, actual questions you ask and what answers point which way.

  2. It has to catch the sneaky inverse bias too, where people invoke the fallacy as a rhetorical move to kill projects they never liked, and where "we already paid for it" is doing legitimate work as a coordination device (with other teams, or with our own past selves who made commitments).

  3. Where the procedure can't decide -- because it's actually a values question about what we owe each other or how much risk the team should carry -- it should say so and punt to a human, not pretend the checklist settled it.

  Then run it on two cases so I can see it work: (a) the ORM, which as I said is 60% done, despised, but already integrated into two of our services, and (b) a hypothetical second one -- we're being asked to decide whether to keep paying for a multi-year cloud contract that's underused but where the alternative is a migration effort nobody has scoped. One of these should come out with an answer I won't like, and I want the procedure to commit anyway, so I can see it's not just a machine for ratifying whatever I already believe.

  Also please be honest about where the procedure will misfire -- the failure modes of using a checklist for this at all. And keep the philosophy light-touch in the writeup, like a paragraph of "here's the actual principle" is fine, but the deliverable is the thing we run in the meeting. Casual tone if you can, the doc's going in our internal wiki next to stuff called "why our deploy pipeline is haunted."
reasoning: |-
  We are designing a decision procedure for project continuation that avoids the pitfalls of the sunk cost fallacy while acknowledging that past investments can provide valuable information and that there are legitimate future costs to consider.

  The core idea: 
  - Sunk costs (money, time) are gone and should not be the reason to continue. But:
    1. The experience gained during the project is valuable information. We can ask: What have we learned that we didn't know at the start? How does that change the cost/benefit?
    2. There are often future costs (e.g., reputational, coordination with other teams, migration costs) that are not sunk and must be considered.

  The procedure will be a checklist of questions to be answered in a meeting. We aim for 45 minutes, so we must be concise.

  Structure:
  1. **State the current status and sunk costs** (for context, but we don't use this as a reason to continue).
  2. **Evaluate the project based on current and future costs and benefits** (ignoring sunk costs).
  3. **Explicitly consider the information gained from the sunk investment** (what we know now that we didn't then).
  4. **Consider coordination and commitment costs** (if we stop, what breaks? what promises are broken?).
  5. **Make a decision or flag for human judgment**.

  Checklist Questions:

  **0. Project Summary (5 minutes)**
     - What is the project? (e.g., ORM replacement)
     - What is the current state? (e.g., 60% done, integrated into two services)
     - What are the sunk costs? (e.g., 8 months of engineering time, but we don't dwell on this)

  **1. Future Costs and Benefits (10 minutes)**
     - **1a. Future Costs to Complete**: If we continue, what is the estimated time/cost to finish? (Be realistic, include testing, migration, etc.)
     - **1b. Future Costs if We Stop**: What are the costs of stopping? (e.g., migration back? lost coordination with other teams? reputational damage? contractual penalties? time to decommission?)
     - **1c. Future Benefits if We Continue**: What are the expected benefits (tangible and intangible) if we complete the project? (e.g., performance, maintainability, developer joy, reduced bugs)
     - **1d. Future Benefits if We Stop**: What are the benefits of stopping? (e.g., redeploying engineers to higher-value projects, avoiding future costs, morale improvement)

  **2. Information from Sunk Investment (10 minutes)**
     - **2a. What have we learned?** (e.g., "We now know the existing ORM is even worse than we thought" or "We found unexpected hurdles that make the project harder")
     - **2b. How does this new information change the original cost/benefit analysis?** (e.g., "The benefits are now higher because we know the current system is more fragile" OR "The costs are now higher because we discovered hidden complexity")
     - **2c. If we restarted today from scratch, would we begin this project?** (Why or why not? This helps separate sunk costs from current information.)

  **3. Coordination and Commitments (5 minutes)**
     - **3a. What commitments have we made to other teams or stakeholders?** (e.g., "Platform team is waiting for this to launch feature X")
     - **3b. What are the costs (reputational, operational, etc.) of breaking those commitments?** (e.g., "Platform team will have to replan Q3, which delays their project by 2 months")
     - **3c. Are there any contractual obligations?** (e.g., cloud contract example: if we break the contract, what are the penalties?)

  **4. Decision Time (10 minutes)**
     - **4a. Recalculate Net Value**: Based on the above, what's the net value of continuing (future benefits - future costs) and the net value of stopping (benefits of stopping - costs of stopping)? (This can be qualitative: high/medium/low.)
     - **4b. Flag for Human Judgment**: If there's a tie, or if the decision hinges on unquantifiable values (e.g., "we promised, so we must deliver even if it's slightly negative"), then flag it for a human (e.g., CTO, VP) to make a judgment call based on company values.
     - **4c. Make the Call**: 
          - If the net value of continuing is clearly positive and higher than stopping, continue.
          - If the net value of stopping is clearly positive and higher than continuing, stop.
          - If unclear, go to 4b.

  **5. Document and Communicate (5 minutes)**
     - Record the answers and the decision.
     - If continuing, set a checkpoint (e.g., in 3 months) to reevaluate if new information arises.
     - If stopping, plan the wind-down (including communicating to other teams).

  Now, let's run two examples:

  **Example A: ORM Replacement (current project)**
  - **0. Project Summary**: ORM replacement, 60% done, integrated into two services. Sunk: 8 months.
  - **1. Future Costs and Benefits**:
    - 1a. Future costs: 5 months to finish (estimate).
    - 1b. Costs if stop: have to remove from two services (2 weeks?), and platform team has to replan (1 month delay for them?).
    - 1c. Benefits if continue: better performance, easier to maintain, but team morale might not recover until done.
    - 1d. Benefits if stop: free up engineers for other projects, morale boost from stopping a hated project.
  - **2. Information from Sunk Investment**:
    - 2a. Learned: the existing ORM is indeed terrible, but the new one is harder to implement than expected.
    - 2b. Change: original benefits still hold, but costs are higher. However, we also know that not replacing will cause more pain (from 2a).
    - 2c. Restart today? Probably yes, because we now know the existing ORM is worse than we thought, but we'd approach it differently (maybe use an off-the-shelf solution?).
  - **3. Coordination and Commitments**:
    - 3a. Platform team is counting on this for their next quarter.
    - 3b. Costs of breaking: platform team delay, loss of trust.
    - 3c. No contractual.
  - **4. Decision**:
    - Net value of continuing: medium (high long-term benefits but high future costs and morale hit). Net value of stopping: short-term morale boost and freeing resources, but long-term pain and coordination costs. 
    - This is close. The sunk cost fallacy might be at play in wanting to continue, but the coordination costs and the new information (existing ORM is terrible) push to continue. However, the morale issue is a real future cost. Flag for human judgment? Let's say we decide: **Continue, but with a morale intervention (e.g., add more people, set a hard deadline, or pair to share pain).**

  **Example B: Cloud Contract (hypothetical)**
  - **0. Project Summary**: Multi-year cloud contract, underused. Sunk: the money already paid is gone, but we're paying annually so future payments are future costs.
  - **1. Future Costs and Benefits**:
    - 1a. Future costs to complete (if we keep): the remaining contract payments (say $X per year for 2 more years). Also, opportunity cost of underused resources.
    - 1b. Costs if stop: migration effort (to a cheaper provider or to optimize usage) - but we haven't scoped it. Penalty for early termination? Let's assume 20% of remaining.
    - 1c. Benefits if continue: no migration hassle, stability, maybe we'll use it more later?
    - 1d. Benefits if stop: reduce costs, force optimization, might save money long-term.
  - **2. Information from Sunk Investment**:
    - 2a. Learned: we don't use as much as we thought, and the market has cheaper options now.
    - 2b. Change: original assumptions about usage were wrong, so benefits of continuing are lower. Costs of continuing are now clearer (we see the underuse).
    - 2c. Restart today? We wouldn't sign this contract again because we know our usage is lower and there are cheaper options.
  - **3. Coordination and Commitments**:
    - 3a. None to other teams? (Maybe internal accounting if budget is blown, but not blocking others.)
    - 3b. Little reputational cost? (It's a vendor contract.)
    - 3c. Contractual: penalty for early termination.
  - **4. Decision**:
    - Net value of continuing: low (we keep paying for something we don't use much). Net value of stopping: high (if migration cost is less than the savings). But we haven't scoped migration! So we can't decide until we scope it. **Punt to a human with a recommendation: Scope the migration effort within 2 weeks, then decide. But if forced: the contract is a money pit, so stop (if penalty + migration cost < remaining payments).**

  Failure Modes of the Checklist:
  - **Rushed Answers**: In 45 minutes, teams might skip deep thinking. Mitigation: Assign pre-work (e.g., fill out a template before the meeting).
  - **Biased Facilitator**: The person running the meeting might steer. Mitigation: Rotate facilitators or have a neutral party.
  - **Overlooking Hidden Costs**: Teams might underestimate future costs (especially in 1b). Mitigation: Include someone from finance or adjacent teams.
  - **False Precision**: Trying to put numbers on everything can be misleading. We use qualitative (high/med/low) to avoid this.
  - **Ignoring the Human Element**: Sometimes morale or trust isn't captured. That's why we have step 4b.

  Casual Tone: 
  "Look, we've all been in meetings where someone drops the 'sunk cost fallacy' bomb and everyone shuts up. This checklist is here to actually break down what's going on so we can make a call without the buzzwords. Sometimes the fact we've spent time on something _does_ matter, but not because we have to 'get our money's worth' — because we learned stuff. And sometimes killing a project has real costs that aren't sunk at all (like other teams calling us flaky). So let's run through this and either decide or admit we need a human to make a tough call."

  Deliverable: A Confluence page with the checklist and examples.
answer: |-
  ### Project Continuation Decision Framework: "Sunk Cost or Smart Context?"  
  *(For when someone yells "sunk cost fallacy" and everyone freezes like they saw a ghost)*  

  **Philosophy in 60 Seconds**:  
  Yeah, sunk costs (time/money already spent) *shouldn’t* force you to finish something. But! That doesn’t mean you ignore everything the project taught you. Past effort creates **new information** (e.g., "turns out our codebase is a haunted mansion"). It also creates **real future costs** if you quit (e.g., other teams faceplant because they relied on you). This checklist forces us to separate "we’re biased" from "we’re informed." If it’s a tie? We flag it for a human to gamble.  

  ---

  ### The Checklist: Run This in Your 45-Min Meeting  
  **Prep (5 mins)**:  
  - Assign a facilitator (you, probably).  
  - Fill in the "Current State" box below. Stick to facts—no feelings yet.  

  | Current State |  |
  |---------------|--|
  | **Project**: | *e.g., ORM Replacement* |
  | **Sunk Costs (time/money)**: | *e.g., 8 months, $0 (in-house)* |
  | **Progress**: | *e.g., 60% done, integrated into 2 services* |
  | **Team Sentiment**: | *e.g., "We’d rather fight raccoons than this code"* |

  #### ⚙️ Step 1: Future Costs & Benefits (15 mins)  
  *Ignore sunk costs. Focus on what happens **from today onward**.*  

  1. **"If we FINISH, what’s left?"**  
     - Cost: *Est. time/cash to complete?*  
     - Benefit: *What do we gain? (e.g., speed, savings, joy)*  
     - Risk: *Could this still fail? How?*  

  2. **"If we KILL it, what happens?"**  
     - Cost: *Migration/cleanup effort? Penalties?*  
     - Benefit: *What could we do instead? (e.g., work on Thing X)*  
     - Risk: *Will chaos erupt? (e.g., other teams blocked)*  

  3. **"Compared to STARTING FRESH today, which path is cheaper/faster?"**  
     - *e.g., "Building from scratch now would cost 5 months vs. 4 to finish."*  

  #### 🧠 Step 2: Sunk Costs as Intel (10 mins)  
  *Did past effort give us **evidence**? Or are we just traumatized?*  

  4. **"What did we learn that we didn’t know at the start?"**  
     - *e.g., "We now know the old ORM causes 40% of our bugs."*  

  5. **"Does this new info change the original goal?"**  
     - If YES: *Does finishing STILL make sense?*  
     - If NO: *Are we continuing just to avoid feeling dumb?*  

  6. **"If we restarted today, would we pick this project again?"**  
     - *Why/why not? (Forces “cold start” thinking)*  

  #### 🤝 Step 3: Commitments & Sneaky Biases (10 mins)  
  *Is “sunk cost” being weaponized? Are we blowing up trust?*  

  7. **"Who’s relying on us (teams, clients, contracts)?"**  
     - *Cost of bailing: e.g., "Platform team’s Q3 plan implodes."*  

  8. **"Is ‘sunk cost’ being used to kill this for non-financial reasons?"**  
     - *e.g., "Does the person yelling ‘fallacy’ just hate this project?"*  

  9. **"What’s the morale hit if we continue? Or if we quit?"**  
     - *e.g., "Finishing might burn us out. Killing it might make us feel like losers."*  

  #### ⚖️ Step 4: Decision or Dilemma (5 mins)  

  10. **Tally the signals:**  
      - **CONTINUE** if: Future benefits > future costs AND sunk intel makes it wiser.  
      - **KILL** if: Future costs > benefits OR sunk intel reveals failure is inevitable.  
      - **HUMAN JUDGMENT NEEDED** if: It’s a tie, or it hinges on values (e.g., "We owe Team X").  

  11. **Set a checkpoint** (either way):  
      - *e.g., "Revisit in 6 weeks if we continue," or "Plan wind-down by Friday."*  

  ---

  ### Test Run: Two Examples  
  **Case A: The ORM Replacement (Your Project)**  
  - **Step 1 (Future)**:  
    - Finish: 4 months left. Benefit: Faster queries, fewer bugs. Risk: Morale nosedive.  
    - Kill: 1 month to rip out. Benefit: Work on AI feature. Risk: Platform team’s Q3 wrecked.  
    - Restart: Fresh build would take 6 months (we learned our code is spooky).  
  - **Step 2 (Intel)**:  
    - Learned: Old ORM is worse than we thought (evidence!).  
    - Restart today? Yes—but we’d do it differently.  
  - **Step 3 (Biases/Commitments)**:  
    - Platform team will lose 2 months if we quit. "Sunk cost" is used earnestly (not weaponized).  
  - **Step 4**: **CONTINUE** (barely). Why? Future benefits > costs, sunk intel validates the goal, and bailing screws Platform Team. But: Flag morale risk for CTO to address.  

  **Case B: Underused Cloud Contract (Hypothetical)**  
  - **Step 1 (Future)**:  
    - Finish: $200k/year for 2 years. Benefit: Stability. Risk: Wasted cash.  
    - Kill: $50k penalty + unscoped migration (est. 3 months). Benefit: Save $150k/year.  
    - Restart: Today, we’d pick a cheaper provider.  
  - **Step 2 (Intel)**:  
    - Learned: We use 40% less than projected.  
    - Restart today? No—we’d switch providers.  
  - **Step 3 (Biases/Commitments)**:  
    - No teams relying on this. "Sunk cost" might be used to kill it by someone who hates vendor lock-in.  
  - **Step 4**: **KILL**. Why? Future costs of staying ($400k) >> penalty + migration ($150k). Sunk intel confirms it’s a bad deal.  

  *(You didn’t like this one, right? Procedure overruled vibes.)*  

  ---

  ### When This Checklist Explodes  
  **Failure Modes**:  
  - **"We’re just checking boxes"**: If answers are shallow, you’ll get garbage. Mitigation: Assign pre-work (e.g., "Come with FUTURE COSTS estimates").  
  - **"The loudest person wins"**: Facilitator must enforce "no philosophy hot takes."  
  - **"We ignored the human"**: If morale/trust dominates the decision but the checklist says "kill," you’ll mutiny. That’s why Step 4 has an escape hatch.  
  - **"False precision"**: Estimates are guesses. Focus on orders of magnitude (e.g., "Months vs. weeks").  

  **Final Note**:  
  This isn’t a robot overlord—it’s a bias-check. If the team groans "this feels like therapy," you’re doing it right. Now go forth, and may your retros be less awkward.  

  *(Template ready for your wiki. Sidebar idea: Add a "Sunk Cost Fallacy Bingo" card for levity.)*
