prompt: |-
  I sit on the animal welfare board of a regional rescue that takes in everything from dogs to parrots to the occasional reptile, and next week we vote on our surge-capacity policy for mass-intake events like last year's wildfire evacuations. The draft says that when ICU beds run out, patients get ranked first by severity of injury and then, as a tiebreaker, by "estimated brain size as a proxy for cognitive complexity." The commitee is split — half of us think the tiebreaker is crude but defensible, the other half thinks it's morally incoherent — and people keep failing to seperate at least three different questions in the argument: whether a mouse's pain matters less than a dog's, what a parrot actually needs for its life to go well, and whether brain size is a good measure of anything relevant in the first place. Please draft the short decision memo I'll circulate before Thursday's vote: it should recommend adopting, rejecting, or revising the criterion (with a concrete replacement if you're revising) and a timeline, and it should engage the strongest case for the side you don't end up on rather than just dismissing it. Formatting: give me exactly five numbered points, each a sentence or two, no intro or conclusion. The five points should cover the decision, the main reason, the strongest case on the losing side and why it loses, what's settled among people who actually work on this versus what's genuinely contested (don't present the contested parts as consensus), and what would change the recommendation.
reasoning: |-
  Okay, the user is on an animal welfare board dealing with a surge-capacity policy for mass-intake events like wildfires. They need a decision memo for an upcoming vote about using "estimated brain size as a proxy for cognitive complexity" as a tiebreaker when ICU beds are full. The committee is split, and there's confusion around three key questions: whether a mouse's pain matters less than a dog's, what a parrot needs for a good life, and if brain size is even a good measure. 

  Hmm, the user specifically wants five numbered points without intro/conclusion. They need clear recommendations—adopt, reject, or revise—with a replacement if revising. The memo must engage the strongest opposing argument, distinguish settled vs contested issues, and note what could change the recommendation. 

  First, I should acknowledge that brain size as a tiebreaker is problematic. Neuroscience experts agree brain size correlates poorly with sentience or welfare needs—it's an outdated metric. But outright rejecting it without a replacement might leave the policy with no tiebreaker, which could lead to arbitrary decisions during crises. 

  The strongest case for keeping it is probably pragmatic: it's simple and objective in emergencies when staff are overwhelmed. But "objective" doesn't mean "ethically valid," and simplicity shouldn't override moral coherence. Plus, staff aren't actually equipped to estimate brain size accurately—imagine trying to eyeball a parrot vs. a lizard mid-crisis! 

  Revising seems best. Replace with "species-typical capacity for suffering," defined by behavioral indicators (vocalization, avoidance) and physiology (pain receptor density). This focuses on welfare impact, not cognition. It's still imperfect—measuring suffering is hard—but better than brain size. 

  For settled vs contested: Experts agree brain size is bad proxy (settled), but disagree on how to compare cross-species suffering (contested). The memo should avoid implying consensus on the latter. 

  Timeline: Adopt revision now for upcoming wildfire season, with a 2025 review clause if new science emerges. 

  User's deeper need? They want to unify a divided committee by addressing concerns rigorously, not just pushing a side. The memo must model nuance—hence engaging the "pragmatism" argument honestly but showing why it fails ethically. Also, subtly guiding away from unanswerable philosophical traps ("does mouse pain matter less?") toward actionable metrics.
answer: |-
  **Surge Capacity Policy Tiebreaker Decision Memo**  

  1. **Recommendation:** Revise the tiebreaker criterion from "estimated brain size as a proxy for cognitive complexity" to **"species-typical behavioral and physiological indicators of distress, pain sensitivity, and recovery potential"** (e.g., documented pain responses, stress vocalizations, convalescence needs), with implementation by Q3 2024 and a 12-month review cycle.  

  2. **Primary Reason:** Brain size is a poor proxy for welfare-relevant traits (e.g., a parrot’s neurological pain processing differs from a rodent’s despite similar brain mass), while behavioral/physiological metrics are more clinically verifiable and directly tied to suffering mitigation—aligning with our ethical mandate to prioritize urgent relief of observable harm.  

  3. **Strongest Counterargument Addressed:** Proponents rightly argue brain size offers an objective, rapid triage tool during chaos, avoiding paralyzing moral debates—but it loses because objectivity ≠ ethical validity (e.g., reptiles may have small brains yet complex pain experiences), and misapplied metrics risk systemic injustice toward neurologically atypical species.  

  4. **Settled vs. Contested:** Experts broadly agree brain size correlates weakly with cognition/sentience across taxa (*settled*), but disagree on whether interspecies welfare comparisons are feasible (*contested*). Our policy must not conflate contested philosophical hierarchies (e.g., "mouse vs. dog pain") with settled clinical facts about species-specific suffering.  

  5. **Revision Trigger:** The recommendation reverses if peer-reviewed evidence emerges before 2025 linking brain size *directly* to triage outcomes (e.g., mortality rates) in mass-intake settings—absent this, we adopt the revised metric while funding staff training on species-specific distress recognition.
