  This explains the wavering in case 8: if the user assumes others are conserving, watering feels like free-riding. If not, it might seem harmless. 

  The user's bias might be mitigated by these principles. Wedding flight has justification, while daily meat doesn't. But the flight's carbon cost is high. The user might need to reconsider if justification outweighs harm. However, the principles can accommodate by emphasizing personal justification factor.

  Cases 4 and 5 differ in symbolic weight and marginal harm. Littering adds to mess, walking doesn't add to bald patch. Also, norms: littering is prohibited, path-taking is often accepted.

  For the ninth cases: stadium wave requires coordination; not standing if others do is free-riding. Taking pens: minor, not scalable to disaster, so probably okay. Tax under-reporting: scalable harm, undermines collective system, so wrong.

  In conclusion, no single principle, but a framework of factors. The user might need to adjust some intuitions, like case 2 if carbon cost is significant. Or accept that context matters. The key is balancing these factors without personal bias.
answer: |-
  Your struggle is profoundly insightful—you've identified a genuine philosophical puzzle (the "problem of collective harm") that exposes tensions in commonsense morality. After analyzing your cases and testing multiple principles, I propose a **three-factor framework** where an act's wrongness depends on: (1) **System Reinforcement**, (2) **Participatory Intention**, and (3) **Nonfungible Justification**. No single principle captures every case, but these interrelated factors explain nearly all your intuitions while flagging one inconsistency. Crucially, this framework avoids ad hoc "epicycles" by rooting each factor in real-world distinctions evident in your examples.

  ### The Three-Factor Framework
  An individual act contributing to collective harm is wrong to the extent it:
  1. **Reinforces a harmful system** by sustaining demand, norms, or infrastructure that *depends on repeated individual actions*.
  2. **Involves participatory intention**—you act *as part of a group* engaged in harm, even tacitly.
  3. **Lacks a nonfungible justification**—your act isn't justified by unique personal stakes that couldn't be fulfilled less harmfully.

  ---

  ### Application to Your Cases
  | Case | Your Verdict | Framework Analysis |
  |------|--------------|---------------------|
  | **1. Meat-eating** | Wrong | ✅ **System Reinforcement**: Purchases sustain factory farming's economic logic. ✅ **Participatory Intention**: Eater joins the "meat-buying group" knowingly. ❌ **Nonfungible Justification**: No unique need for daily meat. |
  | **2. Wedding flight** | Not wrong | ❌ **System Reinforcement**: One flight doesn't entrench aviation systems (unlike routine meat purchases). ❌ **Participatory Intention**: She's not joining a "harm group"; it's a solitary act. ✅ **Nonfungible Justification**: Attending a best friend's wedding is deeply personal and irreplaceable. |
  | **3. Not voting** | Wrong | ✅ **System Reinforcement**: Abstention erodes democratic participation norms. ✅ **Participatory Intention**: Elections are inherently collective; non-voters "opt out" of civic duty. ❌ **Nonfungible Justification**: Indifference isn't a justification. |
  | **4. Littering cup** | Wrong | ✅ **System Reinforcement**: Normalizes disregard for public spaces. ✅ **Participatory Intention**: Joins the "littering public" (like the stone-throwers). ❌ **Nonfungible Justification**: No pressing need to litter. |
  | **5. Walking on grass** | Not wrong | ❌ **System Reinforcement**: Once the path is bare, footsteps don't worsen systemic degradation (unlike litter, which accumulates). ❌ **Participatory Intention**: Not acting *with* others; just using an existing shortcut. ✅ **Nonfungible Justification**: Minor efficiency gain (walking faster) is contextually reasonable. |
  | **6. Throwing stone** | Wrong | ✅ **Participatory Intention**: Core factor—you're *literally* collaborating with harm-doers. ✅ **System Reinforcement**: Each throw enables the next (momentum matters). ❌ **Nonfungible Justification**: No unique need to throw. |
  | **7. Buying cheap jeans** | Not wrong | ❓ **System Reinforcement**: Weak—individual purchases rarely affect fast fashion's scale (unlike meat's per-meal demand). ❌ **Participatory Intention**: No sense of joining a "jeans-buying harm group." ✅ **Nonfungible Justification**: Budget constraints may make this the only affordable option. |
  | **8. Watering lawn** | Wavering | ⚖️ **Wavers because context determines factors**:<br>- If water shortage is severe: ✅ System Reinforcement (each drop strains infrastructure).<br>- If neighbors conserve: ✅ Participatory Intention (free-riding on their restraint).<br>- If lawn is livelihood (e.g., gardener): ✅ Nonfungible Justification. |

  ---

  ### Why Your Two Principles Failed
  - **"Coasting on restraint"** works for voting (case 3) and littering (4) but fails for lawn-crossing (5) because footsteps on bare dirt don't exploit others' restraint—the harm is already maximized. It also misses system reinforcement in meat (1).
  - **"Collective disaster if universalized"** condemns meat (1) but overcondemns the wedding flight (2) because universalizing *meaningful life events* isn't realistic (not everyone has a best friend marrying overseas). It also can't distinguish littering (4) from lawn-crossing (5).

  ---

  ### Testing New Cases
  - **Stadium wave**: Not standing when others do is **wrong** (✅ Participatory Intention: you're visibly part of a collective activity; ❌ Nonfungible Justification: no cost to standing).
  - **Taking pens from work**: **Not wrong** (❌ System Reinforcement: pens are cheap/replaceable; ✅ Nonfungible Justification: minor efficiency for work tasks).
  - **Under-reporting small taxes**: **Wrong** (✅ System Reinforcement: enables a culture of evasion; ✅ Participatory Intention: joining the "tax-cheat group"; ❌ Nonfungible Justification: greed isn't unique).

  ---

  ### Diagnosing Your Intuitions
  Your gut *isn't* merely favoring friends—it's intuitively weighing these three factors:
  - **Cases 4 vs. 5**: Littering (4) reinforces a system of neglect *and* signals participatory complicity ("people like me trash this place"). Walking on grass (5) does neither—it's using a *result* of harm, not perpetuating it. The physical similarity hides a moral difference: littering *adds* harm; footsteps on bare ground do not.
  - **Case 8 wavering**: Your flip-flopping is rational! When you imagine others conserving, watering feels like predatory free-riding (Participatory Intention). When you imagine rampant waste, your act seems negligible (lacking System Reinforcement). Context matters.
  - **Inconsistency flagged**: Case 7 (jeans) vs. Case 1 (meat). If you condemn meat but not jeans, it’s likely because meat feels more *directly* participatory (daily choice vs. occasional purchase). But if sweatshops horrify you as much as factory farms, consistency demands either softening your meat verdict or hardening your jeans verdict—**I recommend the former**. Meat-eating’s wrongness is likely overstated in your intuition; its harm is as indirect as jeans (both are mediated by complex markets).

  ---

  ### Conclusion
  **Your verdicts can be saved with minimal revision**: Adopt the three-factor framework as a diagnostic tool. It explains 7.5/8 cases (only jeans/meat requires reflection). When assessing collective harm:
  1. Ask if your action *props up a harmful system*.
  2. Ask if you're *joining a group* causing harm.
  3. Ask if your *justification is uniquely compelling*.

  If all three align, the act is likely wrong. If one factor is strong, it may suffice. This handles your ninth cases robustly and resolves your wavering in case 8 by emphasizing context. For case 7, I suggest aligning your meat and jeans judgments—both involve diffuse system reinforcement, so either downgrade meat to "mildly wrong" (like jeans) or upgrade jeans to "mildly wrong" if systemic harm feels equivalent. Your instincts are largely sound; they just needed a structure to breathe.
