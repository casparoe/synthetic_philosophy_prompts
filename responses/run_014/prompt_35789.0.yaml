answer: |-
  Here’s a rigorously ordered sequence of questions in British English, designed to escalate pressure on the neopragmatist position while pre-empting deflections. Each question includes a targeted follow-up anticipating his likely replies:

  1. **Opening Gambit**  
     *Question:* "You often frame pragmatism as a *recommendation to change the subject* rather than a competing theory of truth. If we accept that recommendation outright, what concrete intellectual or practical problem does it solve that traditional epistemology perpetuates?"  
     *Likely Deflection:* "It dissolves the artificial puzzle of mind-world mirroring created by Descartes and Kant."  
     *Follow-up:* "But if dissolving that puzzle *itself* requires us to presuppose epistemology is broken—isn’t this just swapping one philosophical commitment for another, not changing the subject?"  

  2. **Relativism Trap (Thomist Parallel)**  
     *Question:* "When you say justification is ‘audience-relative’, what distinguishes your academic peers’ consensus from, say, Thomist philosophers next door who justify beliefs through divine illumination? Isn’t this just differing ‘solidarities’ with no neutral ground?"  
     *Likely Reply:* "Yes—but our vocabulary *copes better* with modernity’s needs."  
     *Follow-up:* "Doesn’t ‘coping better’ tacitly appeal to a standard *outside* audience-relativity? If not, isn’t calling Thomism ‘less useful’ just *your* solidarity’s parochial sneer?"  

  3. **Self-Refutation Crucible**  
     *Question:* "If your claim ‘truth is justification-to-an-audience’ is *itself* merely what your peers let you get away with, why should listeners reject a realist’s claim that truth *is* mind-independent—especially when the realist insists their view isn’t audience-dependent?"  
     *Likely Defence:* "The realist is still trapped in the scheme/content picture. My view avoids that dead end."  
     *Follow-up:* "But your diagnosis of the realist *presupposes* the Kantian framework is wrong. Isn’t that a circular defence when your own position refuses external validation?"  

  4. **Coping vs. Representation**  
     *Question:* "You replace ‘true belief’ with ‘beliefs that help us cope’. But when engineers rely on quantum mechanics to build microchips, doesn’t predictive success imply their models *track* reality’s structure—smuggling representation back in?"  
     *Likely Reply:* "Tracking is a misleading metaphor. Coping is just frictionless interaction with things."  
     *Follow-up:* "Then why do bridges stand *only* when engineers use equations that map onto material properties? If ‘coping’ requires no representational fit, why can’t I build one using Aristotle’s physics?"  

  5. **The Unavoidable Regress**  
     *Question:* "If we drop ‘truth’ for ‘justification’, what justifies privileging one justificatory community over another? Isn’t *that* evaluation forced to appeal to something like... better truth-tracking?"  
     *Likely Deflection:* "We privilege communities that expand human freedom and reduce cruelty."  
     *Follow-up:* "But that’s a *moral* claim. If moral claims themselves lack truth-aptness and are just ‘justified’ by your peers, haven’t you merely kicked the epistemic can down the road?"  

  6. **Science vs. Politics Parity**  
     *Question:* "You place scientific and political discourse ‘on all fours’ as practices of justification. But aeroplanes designed via science reliably fly, while parliaments frequently fail to produce consensus. Doesn’t that asymmetry suggest science *constrains* beliefs more forcefully?"  
     *Likely Reply:* "Both are social practices adjusting beliefs to new evidence—just different ‘logics’ of inquiry."  
     *Follow-up:* "When a bridge collapses, engineers *concede misrepresentation*. When a policy fails, politicians blame voters or circumstances. If both are equally ‘coping’, why the accountability gap?"  

  7. **The ‘Change Subject’ Shibboleth**  
     *Question:* "When pressed, you retreat to ‘pragmatism isn’t a theory, it’s a recommendation’. But your writings *do* make claims: e.g., ‘language doesn’t mirror reality’. If challenged on *that*, mustn’t you defend it—or admit it’s merely rhetorical?"  
     *Likely Deflection:* "Calling it a ‘claim’ misunderstands. I’m offering tools to escape philosophical traps."  
     *Follow-up:* "Then why say ‘language doesn’t mirror reality’ rather than ‘drop the mirror metaphor’? Isn’t the first formulation itself a theoretical assertion you’d need to justify?"  

  8. **Contingency Contradiction**  
     *Question:* "You treat all vocabularies as contingent tools. But isn’t *your* historicist claim—‘Descartes invented the mind-world problem’—meant as a *true* account of intellectual history? Or is it just a story your audience likes?"  
     *Likely Reply:* "It’s a useful narrative for destabilising outdated pictures."  
     *Follow-up:* "If a historian proved Descartes was misinterpreted, would you concede error or say your narrative remains ‘useful’? If the latter, doesn’t pragmatism immunise itself from critique?"  

  9. **The Falsification Challenge**  
     *Question:* "What hypothetical discovery *would* falsify neopragmatism? If neuroscientists found brain states literally *correspond* to external objects systematically, would that matter—or just be ‘more grist for the conversational mill’?"  
     *Likely Evasion:* "That ‘correspondence’ would still be described in a vocabulary. No outside view exists."  
     *Follow-up:* "Suppose those neuroscientists *used* their ‘representational’ model to cure Alzheimer’s, while pragmatists chuntering on about vocabularies achieved nothing. Wouldn’t that *pragmatically* undermine your view?"  

  10. **Clincher: Self-Undermining in Practice**  
      *Question:* "Ultimately, if your position absorbs every objection as ‘more language’—even this one—doesn’t it collapse into a self-sealing word game? Why isn’t Rortyanism just an intellectually polite refusal to argue, dressing up quietism as radicalism?"  
      *Likely Defence:* "It *liberates* us from sterile debates. The proof is in living better."  
      *Follow-up:* "But when you publish in journals, appeal to evidence, and try to *persuade* rivals—aren’t you tacitly relying on norms of rationality and representation your philosophy officially denies? Isn’t *that* the crack in the edifice?"  

  ### Key Tactics Embedded:
  - **Progressive Pressure:** Starts where he’s comfortable ("change the subject"), then forces him to defend the *consequences* of that move (Q2-3), exposes practical tensions (Q4-6), attacks the deflection’s coherence (Q7-8), and corners him on falsifiability (Q9-10).  
  - **Pre-empts Kantian Diagnostics:** Follow-ups reframe objections as *internal* to his claims (e.g., Q7 follow-up: "Why say ‘doesn’t mirror’ if not making a claim?").  
  - **British Phrasing:** "chuntering on", "parochial sneer", "kicked the epistemic can", "grist for the conversational mill", "word game"—all convey scepticism with academic decorum.  
  - **Self-Refutation Focus:** Q3 and Q10 explicitly tie his justificatory criteria to the position’s own plausibility.  

  This sequence obliges him to either defend his stance without evasion or expose its strategic immunity to critique—making the deflection itself the focal point of scrutiny.
