          The exercise cannot enact the full meta-reasoning of how we know that the invariant is preserved in all possible derivations. We must explain that we are using a mathematical argument that covers every possible application of the rules, which is a form of reasoning outside the system that cannot be done within the system.

          We might say:

              "Note: within the system, we can only apply the rules step by step. We cannot see the global property of the entire system. But by stepping outside, we can use mathematics to prove that no matter how many steps we take, we will never get a string with 0 mod3 I's (unless we start with one) and since we start at 1 mod3, we never get 0 mod3. This kind of global reasoning is not available inside the system."

     This should be covered in the debrief.

     We are ready.
answer: |-
  ### Lesson Plan: Stepping Outside the Formal System with the MU Puzzle

  **Context:** First-year university seminar on reasoning, 22 students, 60-minute session.  
  **Pedagogical Goal:** Students experience the frustration of exhaustive search within a formal system, then discover the need to "step outside" to prove impossibility via invariant reasoning. The inside/outside contrast is explicitly named only in the debrief.

  ---

  #### **Grouping & Materials**
  - **Grouping:** 4 teams of 5–6 students each (adjust for 22 students).  
  - **Materials:**  
    - Whiteboard/paper per team for writing strings.  
    - Rules handout (see below).  
    - Timer visible to all.  
    - Scoreboard for symbolic points (e.g., gold stars).  
  - **Rules Handout:**  
    > Start: `MI`  
    > Target: `MU`  
    > **Rules:**  
    > 1. Add `U` after a final `I` (e.g., `MI` → `MIU`).  
    > 2. Duplicate the block after `M` (e.g., `MI` → `MII`).  
    > 3. Replace any `III` with `U` (e.g., `MIII` → `MU`).  
    > 4. Delete any `UU` (e.g., `MUUU` → `MU`).  

  ---

  #### **Sequence, Timing, and Scoring**  
  **Total: 60 minutes**  

  1. **Introduction (5 min)**  
     - Explain rules, goal (`MI` → `MU`), and team challenge.  
     - **Scoring:**  
       - 1 point per **unique string** derived (capped at 10 points).  
       - 5-point bonus for **first team to reach `MU`** (impossible, so unclaimed).  
       - 10-point bonus for **best impossibility proof** (awarded later).  
     - *Symbolic stakes:* Winning team earns "Reasoning Champions" title + small prize (e.g., candy).  

  2. **Team Challenge: Exhaustive Search (25 min)**  
     - Teams race to derive `MU` from `MI` using the rules.  
     - **Instructor Role:** Circulate, remind teams to record all strings/rules used.  
     - *Expected Struggle:* Teams generate strings (e.g., `MIU`, `MII`, `MIUIU`) but hit dead ends.  

  3. **Midway Check & Pivot (5 min)**  
     - Pause at 25 min. Ask: *"Any team reached MU? Why is this frustrating?"*  
     - Hint: *"What if I told you it’s impossible? How could we prove that?"*  
     - **Shift focus:** Teams now collaborate to argue why `MU` cannot be derived.  

  4. **Proof Sprint (15 min)**  
     - Teams brainstorm an impossibility proof using properties of the system.  
     - **Prompt:** *"Find a property true for all derivable strings from `MI` but false for `MU`."*  
     - *Clue (if stuck):* *"Count the number of `I`s. What happens when you apply rules?"*  

  5. **Presentations & Scoring (7 min)**  
     - Each team shares their best argument.  
     - Award points:  
       - 1 pt/team for unique strings (e.g., Team A has 8 strings → 8 pts).  
       - 10 pts for the team with the clearest invariant-based proof (even if incomplete).  

  6. **Debrief & Concept Synthesis (8 min)**  
     - Reveal the invariant:  
       > Let \( n \) = number of `I`s in a string.  
       > - Start: `MI` has \( n = 1 \) → \( 1 \mod 3 = 1 \).  
       > - Rules 1 & 4: \( n \) unchanged → invariant preserved.  
       > - Rule 2: \( n \rightarrow 2n \) → \( 2n \mod 3 \) cycles between \( 1 \mod 3 \) and \( 2 \mod 3 \) (never 0).  
       > - Rule 3: \( n \rightarrow n-3 \) → \( (n-3) \mod 3 = n \mod 3 \).  
       > - Target `MU` has \( n = 0 \) → \( 0 \mod 3 = 0 \) (impossible!).  
     - **Link to Inside/Outside Contrast:**  
       | **Pivotal Moment** | **Inside the System** | **Outside the System** |  
       |---------------------|------------------------|------------------------|  
       | **Exhaustive Search (25 min)** | Applying rules mechanically; lost in expanding possibilities. | *Not yet—trapped in the rules.* |  
       | **Proof Sprint (15 min)** | Stuck looping through strings. | Noticing *patterns* (e.g., "`I`-count never ÷3"); abstracting properties. |  
       | **Invariant Proof** | Irrelevant—rules can’t "see" modular arithmetic. | Using *external tools* (math) to reason *about* the system’s limits. |  
     - **Key Insight:**  
       > "Inside the system, we’re like computers following syntax. Stepping outside lets us use semantics (e.g., invariants) to see what the system *cannot* do."  

  ---

  #### **Facilitation Advice**  
  - **Likely Struggles & Interventions:**  
    - **Stuck in loops:** Teams derive `MI` → `MIU` → `MIUIU` → ... without progress.  
      *Intervention:* Ask: *"What happens if you focus on growing the number of `I`s? Try Rule 2 repeatedly."*  
    - **Overlooking Rule 3/4:** Teams hoard `I`s but avoid replacing/deleting.  
      *Intervention:* Prompt: *"Rule 3 removes three `I`s. How could that help you reach 0 `I`s?"*  
    - **Proof tunnel vision:** Teams fixate on syntax (e.g., "`M` must be first") instead of numerical patterns.  
      *Intervention:* Suggest: *"Ignore letters; model the system mathematically. What transforms does the `I`-count undergo?"*  
    - **Incomplete invariants:** Teams notice \( n \mod 3 \) but miss Rule 2’s doubling effect.  
      *Intervention:* Ask: *"If you start with 1 `I`, what happens after duplication? Can 2, 4, 8... ever be divisible by 3?"*  

  - **Critical Note: What the Exercise *Cannot* Enact**  
    > **The exercise cannot enact *why* stepping outside is necessary for undecidability.**  
    > - **Why:** Students experience frustration and heuristic insight but may not grasp that some systems *require* external reasoning (e.g., Gödel’s incompleteness).  
    > - **Direct Explanation Needed:**  
    >   *"In complex systems (like arithmetic), no internal derivation can prove their own consistency. We *must* step outside—just like you did—to see limits. This puzzle is decidable via invariants, but others aren’t!"*  

  ---

  **Outcome:** Students viscerally experience the limits of syntactic rule-following and the power of semantic meta-reasoning. The debrief crystallizes the inside/outside distinction, using their frustration and insight as anchors.
