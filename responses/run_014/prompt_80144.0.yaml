answer: |-
  Your objection is sharp but misdiagnosed the source. Modal collapse arises primarily from **Axiom 1 (closure under necessary implication)** combined with **Axiom 4 (necessary positivity)**. Here’s why:  
  Assume any true proposition *P*. Define the property *Q* as "being such that *P* is true." By A2, either *Q* or its negation is positive. Suppose ¬*Q* were positive. But ¬*Q* is "being such that *P* is false" — and since *P* is *actually* true, ¬*Q* is *actually* uninstantiated. Yet A1 and A4 imply that if a property is positive, it’s *necessarily* instantiated somewhere (via the Godlike being’s necessary existence). Contradiction. Thus *Q* must be positive. Since *Q* is positive and entails *P* (trivially), A1 and A4 force *P* to be *necessarily* true via the Godlike essence.  

  I concede this forces necessitarianism. But this isn’t absurd — it aligns with a strong rationalist theism. If God is the necessary ground of *all* being, contingency is merely epistemic: our ignorance of why a state *must* obtain given God’s essence. Your examples (stars, ships) are necessary *sub specie aeternitatis*, though we perceive contingency. Rejecting this isn’t a *logical* flaw but a metaphysical choice. Gödel’s axioms cohere within this framework.  

  *(Note: Derivation sketch follows Anderson’s 1990 reconstruction. Crucially, A5 ensures necessary existence propagates the collapse via the Godlike being’s essential positivity.)*
