  Long-time cosmologist here, recently retired, and finally getting around to reading philosophy properly instead of skimming it at conferences, so bear with me if I fumble the lingo. I've been chewing on Gödel's rotating universe stuff from around 1949 -- the exact solution to Einstein's field equations where the whole spacetime swirls, there's no global time function, and you can travel on a closed timelike curve and end up in your own past. As I follow it, Gödel didn't just offer it as a curiosity: he argued that since a world physically just like ours (at least in its local features) could lack objective temporal passage entirely, passage must not be an objective feature of our world either -- time, in his idealist-flavored conclusion, gets contributed by the observer. My gut as a physicist says the math is unimpeachable but the metaphysical leap is too big; I'd put maybe 0.25 on the claim that Gödel's argument, taken on its own terms, actually establishes that objective temporal passage is not a feature of physical reality.

  I want your number on that same claim, and not a shrug -- decompose it into the sub-credences the total hangs on and show the wiring. To my mind the load-bearing joints are things like: whether the Gödel spacetime counts as physically possible in the relevant sense (it doesn't expand, needs a nonzero cosmological constant with the wrong sign, is generically taken to be an idealization -- does that matter?); whether "a physically possible world lacking passage" even threatens "our actual world lacks passage," i.e. whether that modal step is sound or smuggles in an assumption that passage is detectable from local physical facts; whether the argument conflates the unreality of passage with the mere relativity of simultaneity, which is old news after special relativity; and whether the conclusion is even stable given how contested "passage" is as a concept. If you think other sub-questions belong in the decomposition, swap them in or note them.

