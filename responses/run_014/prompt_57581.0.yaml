prompt: |-
  I'm not a lawyer or a professor, I fix small engines for a living and somehow ended up treasurer of the winter shelter in our town (northern Michigan, about 8,000 people). We've got to decide something Thursday and I'm supposed to send the board a written recommendation ahead of it. Can you write that for me? Here's the situation, as straight as I can lay it out.

  We run 22 cots, November through March, in a donated Legion hall. All volunteers except a part-time coordinator. Money comes about half from the county, half from church collections and one grocery chain. The fire marshal set our occupancy at 30 total including the two volunteers on shift, so 28 sleepers is the legal ceiling and we don't even reach that.

  Last winter we were full 41 nights out of roughly 120 open. Six nights we turned people away at the door. In February a man we'd turned away was found dead of exposure in a stairwell about 400 yards from the building. I was the one who signed the log that night.

  What changed: in June the county shut its 40-bed facility two towns over, budget reasons, and now there's a regional bus route that stops here. So the people who used to go there come to us, plus some from further out. Word travels. I expect us to be full most nights this winter, not six.

  Three board members, three positions, and I dont think any of them is dumb:

  - Hard cap at 22, doors at six, first come first served, everybody else gets the address of the mission 30 miles south. Honest, simple, we know what we're choosing.
  - Never turn anybody away. Mats on the day room floor, and if the marshal shows up we deal with it then, because the alternative is that stairwell.
  - Cap, but with a residency preference — county residents first, and the county that dumped its problem on us should be paying for the overflow.

  One of the cap people keeps saying "we're a lifeboat, not a ferry," and I can't tell if that's a real distinction or just a way of feeling better.

  Then there's the voucher thing and I don't know what to do with it. Two churches pool money for $25 motel vouchers for people we turn away; there's maybe eight nights' worth of money left for the whole season. One board member swears people show up late on purpose because a motel beats a cot. I don't think it's widespread but I can't disprove it, and if it's true we're paying people to not come in.

  So: draft the memo. It goes to six people with strong feelings and no time to read. Put the recommendation at the very top — what the actual rule is, who gets in, what happens to the ones who don't, who pays for what, and when we reopen the question. Then the reasons, including the strongest honest case for whichever position you're arguing against, because if you strawman the never-turn-anybody-away crowd they'll just dig in. Say what to do with the vouchers. My own gut is cap-plus-vouchers, but I don't fully trust my gut given that I signed the log.

  Under 450 words, hard, I mean it. And don't cite any laws, court cases or studies — I can't check them and neither can they. If something in the recommendation depends on a fact we'd have to go look up, just say so in plain words.
reasoning: |-
  Okay, the user is a small engine repair technician who's now the treasurer of a winter shelter in a small Michigan town. They need help drafting a memo with a recommendation for their board meeting about shelter capacity policies. 

  First, let's unpack the core dilemma: they're torn between safety regulations and moral responsibility after a tragic death last winter. The context is urgent - county shelter closures and new bus routes have increased demand, and they anticipate being full most nights. 

  Notable tensions in their description:
  - The vivid "lifeboat vs ferry" metaphor shows how emotionally charged this is
  - Their personal guilt over signing the log when someone died
  - Practical constraints (fire marshal rules, voucher misuse concerns)
  - Political dynamics (county funding inequities)

  The memo needs to balance:
  » Regulatory compliance (fire codes)
  » Moral imperatives (preventing deaths)
  » Operational reality (volunteer capacity)
  » Financial sustainability (voucher limits)
  » Community politics (county responsibility)

  Key insights from their position:
  - They lean toward capped capacity with vouchers but doubt themselves
  - They want honest arguments presented fairly
  - They need concrete action points (who gets in, overflow solutions)
  - The audience has strong opinions but limited time

  The recommendation should probably endorse Option 1 (hard cap) since it's the only legally safe choice, but must address the moral weight of Option 2. The voucher system needs guardrails against abuse while preserving emergency options. 

  Biggest challenge: making the "lifeboat" metaphor work for rather than against the recommendation. Could reframe it as "being an effective lifeboat requires not sinking ourselves."

  Word count discipline is crucial - every sentence must pull weight. Opening should be punchy with recommendation first. Need to acknowledge the tragedy without letting it paralyze decision-making.
answer: |-
  ## MEMO: WINTER SHELTER CAPACITY POLICY RECOMMENDATION  
  **To:** Shelter Board Members  
  **From:** [Your Name], Treasurer  
  **Date:** October 31, 2023  
  **Subject:** Recommendation on Winter Occupancy Policy & Vouchers  

  **RECOMMENDATION (Top Line):**  
  Implement a **hard cap of 22 guests + 2 volunteers (24 total)**. Doors close at 6 PM sharp, first-come, first-served. Use remaining church voucher funds ***only*** for verified extreme weather emergencies (-15°F wind chill or heavy snow warning) when turning someone away, administered by the coordinator. Immediately request the County fund dedicated overflow solutions (e.g., motel partnerships) due to their shelter closure. Reassess policy at the January board meeting based on actual demand and county response.

  **Who Gets In:** First 22 eligible guests arriving by 6 PM.  
  **Who Doesn't:** Guests #23 onward after 6 PM.  
  **What Happens to Overflow:** Provided address/map to 30-mile south mission. Coordinator uses emergency voucher *only* if extreme weather criteria are met (see above).  
  **Who Pays:** County must fund sustainable overflow. Current church voucher funds are for dire emergencies only.  
  **Reopen Question:** January Board Meeting.

  **REASONS:**  

  1.  **Safety & Viability First:** Exceeding the Fire Marshal's 30-person absolute limit (28 sleepers) risks immediate shutdown. A closed shelter helps no one. Our volunteers and building aren't equipped for floor sleeping (sanitation, safety, supervision). "Dealing with it if the Marshal shows" could end operations entirely.
  2.  **Fairness & Predictability:** First-come, first-served with a clear cap is transparent. Guests and volunteers know the rules. Residency preference sounds fair but is unworkable – verifying addresses at the door in freezing dark creates delays, conflict, and errors. The County’s responsibility must be addressed, but not via our door policy.
  3.  **Voucher Guardrails:** Limiting vouchers to extreme weather prevents misuse ("motel beats cot") and stretches limited funds. A clear, objective trigger (verified forecast) removes discretion and suspicion. This targets help where the risk of exposure is highest, honoring the intent without encouraging late arrivals. *If funds run out, they run out.*
  4.  **The "Never Turn Away" Argument (Honest Case):** The tragedy last February weighs heavily. Turning people away into severe cold feels morally wrong, and the risk of death is real. The impulse is compassionate and rooted in our mission to save lives.
  5.  **Why Not "Never Turn Away"?** Compassion cannot override the reality that violating occupancy rules risks *everyone* – guests and volunteers. An immediate shutdown leaves 22+ people out in the cold, not just overflow. Floor sleeping unsafely crowds exits, creates trip hazards, and strains our limited volunteer capacity for supervision and hygiene. We are not equipped to be an uncapped facility.
  6.  **County Responsibility:** The closure of the nearby shelter directly increased our burden. Our recommendation *requires* demanding the County fund the solution – motel vouchers, transport to other shelters, or a dedicated overflow space. This is the sustainable path, not risking our permit or volunteers.

  **"Lifeboat" Reality:** We *are* a lifeboat. A lifeboat has a safe capacity. Overloading it risks drowning everyone aboard. We must operate within our safe capacity while demanding more resources (a bigger boat or another lifeboat) from the County.

  **VOTING REQUEST:** Please review. We must decide Thursday.
