prompt: |-
  I'm trying to get my head around a thing that keeps getting glossed over in game theory courses. We all learn iterated elimination of strictly dominated strategies, and it's nice because the order you eliminate in doesnt matter — you always end up with the same set of strategies left. But then someone mentions iterated elimination of weakly dominated strategies and says 'oh, that one's not order independant' and just moves on. Can you actually explain, in a way that really lands, why strict dominance is order independent but weak dominance isn't? I want the intuition behind it, not just the formal proof, and if you can, a small concrete game (2x2 or 3x3, small integer payoffs, no ties doing the work) where I can literally watch two different elimination orders leave different survivors would be great. And here's where I want you to commit rather than just lay out the options: given that the weak version is order dependent, what do you actually think — is iterated elimination of weakly dominated strategies a legitimate rationality procedure at all, or is it basically a red herring? Take a definite position and defend it, don't just give me the standard 'it depends.' Also, while you're at it, touch on the mixed-strategy wrinkle: a strategy can be strictly dominated by a mixture even when no pure strategy dominates it, and I want to know whether that changes the order-independence story or not.
