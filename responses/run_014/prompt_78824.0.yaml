answer: |-
  Below is a 10-case diagnostic quiz designed to sort respondents by their commitments on higher-order evidence and epistemic akrasia. Each case presents an agent with first-order evidence supporting a belief, followed by higher-order evidence challenging the reliability of that belief. Answers focus on doxastic obligations, rationality, and criticizability—**not** theoretical labels. The scoring key maps answer patterns to positions, flags limitations, and includes awkward commitments.

  ---

  ### **Quiz: Higher-Order Evidence Scenarios**
  **Instructions:** For each scenario, select the answer that best reflects your judgment. Focus on what the agent *may/must* believe, whether their belief is rational, and whether they are criticizable. Do not reference philosophical theories.

  #### **Case 1: Calibration Test**  
  Alex believes a coin is fair (50% heads) after flipping it 100 times (52 heads, 48 tails). Alex then takes a calibration test revealing systematic overconfidence in probability judgments.  
  **Answers:**  
  (A) Alex must reduce confidence in the "fair coin" belief.  
  (B) Alex may retain full confidence; the test doesn’t change the first-order data.  
  (C) Alex may believe the coin is fair but must also believe this belief is irrational.  

  #### **Case 2: Peer Disagreement**  
  Taylor believes a rare fungus is toxic after examining it under a microscope. Jordan (an equally skilled mycologist) examines the same fungus and disagrees.  
  **Answers:**  
  (A) Taylor must reduce confidence due to peer disagreement.  
  (B) Taylor may retain full confidence; their original analysis stands.  
  (C) Taylor may believe it’s toxic but must also believe this is irrational.  

  #### **Case 3: Cognitive Fatigue**  
  Riley calculates that a policy will reduce emissions by 20% after hours of focused work. Riley then learns they were severely sleep-deprived during the analysis.  
  **Answers:**  
  (A) Riley must reduce confidence; fatigue impairs reasoning.  
  (B) Riley may retain full confidence; the calculations remain valid.  
  (C) Riley may believe the 20% claim but must also believe this is irrational.  

  #### **Case 4: Drug Impairment**  
  Morgan deduces that "If P then Q; P; therefore Q" is valid while unknowingly taking a drug that causes logical errors. Morgan later learns about the drug.  
  **Answers:**  
  (A) Morgan must reduce confidence in the deduction’s validity.  
  (B) Morgan may retain full confidence; logic is independent of impairment.  
  (C) Morgan may believe it’s valid but must also believe this is irrational.  

  #### **Case 5: Inference Track Record**  
  Jamie infers "Investing in Company X is wise" from market data. Jamie then recalls repeatedly misjudging similar data in the past.  
  **Answers:**  
  (A) Jamie must reduce confidence; their inference history is unreliable.  
  (B) Jamie may retain full confidence; past errors don’t invalidate this inference.  
  (C) Jamie may believe investing is wise but must also believe this is irrational.  

  #### **Case 6: Expert Disagreement**  
  Casey (a novice astronomer) believes a comet will pass Earth in 2025 after telescopic observations. Expert astronomers, citing better equipment, unanimously disagree.  
  **Answers:**  
  (A) Casey must reduce confidence; the experts’ reliability outweighs theirs.  
  (B) Casey may retain full confidence; their observations are unchanged.  
  (C) *[Omitted to force binary choice; see scoring limitations]*  

  #### **Case 7: Bias Diagnosis**  
  Sam believes a job candidate is unqualified after reviewing their CV. Sam then learns they scored high on an implicit bias test for ageism.  
  **Answers:**  
  (A) Sam must reduce confidence; bias likely distorted their assessment.  
  (B) Sam may retain full confidence; the CV evidence stands independently.  
  (C) Sam may believe the candidate is unqualified but must also believe this is irrational.  

  #### **Case 8: Contradictory Peer**  
  Avery believes a historical event occurred in 1492 after archival research. Blake (a peer) disagrees, but Avery then learns Blake was sleep-deprived.  
  **Answers:**  
  (A) Avery must still reduce confidence; peer disagreement is evidence.  
  (B) Avery may ignore Blake’s view; fatigue undermines Blake’s reliability.  

  #### **Case 9: Positive Calibration**  
  Jordan believes a stock will rise 10% after analyzing financial reports. Jordan then recalls their past predictions in this domain were 90% accurate.  
  **Answers:**  
  (A) Jordan may increase confidence; the track record supports reliability.  
  (B) Jordan’s confidence should stay fixed; only first-order evidence matters.  

  #### **Case 10: Combined Evidence**  
  Pat believes a defendant is guilty after reviewing case files. Pat then learns: (1) they took a reason-impairing drug unknowingly, and (2) a peer disagrees.  
  **Answers:**  
  (A) Pat must reduce confidence; both factors challenge reliability.  
  (B) Pat may retain full confidence; the files’ evidence is unchanged.  
  (C) Pat may believe the defendant is guilty but must also believe this is irrational.  

  ---

  ### **Scoring Key**  
  **How to score:** Tally selections for A/B/C across all cases. Use the patterns below to identify positions.  

  #### **Core Positions**  
  1. **Conciliationism**  
     - **Commitment:** Higher-order evidence is genuine and must reduce confidence (e.g., peer disagreement always counts).  
     - **Answer pattern:** Mostly A (≥7/10).  
     - **Awkward commitment:** Forces confidence reduction even when first-order evidence is overwhelming (e.g., Case 6 experts vs. novice).  

  2. **Steadfast**  
     - **Commitment:** Peer disagreement doesn’t diminish first-order evidence’s force; confidence need not drop.  
     - **Answer pattern:** Mostly B (≥7/10), especially in peer cases (2, 8).  
     - **Awkward commitment:** Permits unwavering confidence despite uncontroversial higher-order evidence (e.g., Case 3 fatigue).  

  3. **Right Reasons**  
     - **Commitment:** First-order evidence alone fixes what one *ought* to believe; higher-order evidence only affects blameworthiness.  
     - **Answer pattern:** Mostly B (≥7/10), *and* A/B in Case 4 (drug impairment).  
     - **Awkward commitment:** Beliefs can be "correct" but unjustified (e.g., Case 4: Morgan’s deduction is valid, but holding it is criticizable).  
     - **Limitation:** Collapsed with Steadfast if quiz ignores blameworthiness (Cases 4/7 flag this but not perfectly).  

  4. **Total Evidence**  
     - **Commitment:** Both orders of evidence contribute to rationality; neither overrides the other.  
     - **Answer pattern:** Mix of A and B; prioritizes strength/context (e.g., A in Case 1, B in Case 9).  
     - **Awkward commitment:** Requires balancing incommensurable evidence (e.g., Case 10’s drug + peer).  

  5. **Level-Splitting**  
     - **Commitment:** Epistemic akrasia is rational (believe P while believing "P is irrational").  
     - **Answer pattern:** Mostly C (≥5/7 in Cases 1–5,7,10).  
     - **Awkward commitment:** Endorses self-defeating beliefs (e.g., Case 2: "It’s toxic, but I shouldn’t believe that").  

  6. **No-Level-Splitting**  
     - **Commitment:** Epistemic akrasia is inherently irrational.  
     - **Answer pattern:** Avoids C entirely (0/7).  
     - **Awkward commitment:** Demands coherence even when evidence conflicts (e.g., Case 5: Jamie must abandon belief or self-trust).  

  #### **Incoherent/Unattractive Combinations**  
  - **A/C Mix (e.g., 5 A, 3 C):** Incoherent. Conciliationism (A) rejects akrasia (C).  
  - **B/C Mix (e.g., 6 B, 3 C):** Unattractive. Steadfast (B) treats first-order evidence as decisive, clashing with akrasia (C).  
  - **All A except Case 9B:** Unexplored. Suggests higher-order evidence only counts when negative.  

  #### **Limitations and Unresolved Distinctions**  
  - **Cannot separate:**  
    - **Steadfast vs. Right Reasons:** The quiz does not distinguish *propositional* justification (what evidence supports) from *doxastic* justification (how the belief is held). Right Reasons accepts A in Case 4 (blameworthy) but B elsewhere; Steadfast accepts B universally.  
    - **Conciliationism vs. Total Evidence:** Total Evidence may sometimes permit steadfastness (e.g., weak higher-order evidence), but all cases here present strong challenges.  
  - **Proposed additional cases to separate positions:**  
    - **For Steadfast vs. Right Reasons:**  
      > *Doxastic Justification Case:* Lee believes a math proof is sound after deriving it. Lee then learns they were emotionally distressed during the work.  
      > (A) Lee’s belief is rational (the proof *is* sound), but they are criticizable for holding it.  
      > (B) Lee’s belief is rational and they are not criticizable.  
      > *Right Reasons picks A; Steadfast picks B.*  
    - **For Conciliationism vs. Total Evidence:**  
      > *Weak Higher-Order Evidence Case:* Sam believes a theory is true after 10 experiments. One peer (with equal skill but no new data) disagrees.  
      > (A) Sam must reduce confidence slightly.  
      > (B) Sam may retain full confidence; the peer’s input is negligible against strong evidence.  
      > *Conciliationism picks A; Total Evidence picks B.*  

  This quiz isolates structural commitments while avoiding theory names and published works. Use the scoring patterns to prompt seminar discussion on tensions (e.g., "If you picked C in Case 4, how do you defend rational akrasia?").
