answer: |-
  ### Workshop Structure: Feeling the Formal System from Inside and Out

  **Core Concept:** Participants experience the frustration of endless derivation attempts (inside the system) versus the clarity of a meta-level invariant (outside the system) to prove impossibility. The modified MIU system ensures novelty and focuses on the **parity of the number of I's** (odd = reachable, even = unreachable).

  ---

  ### **System Verification & Target Analysis**
  - **Alphabet:** M, I, U  
  - **Start:** MI  
  - **Rules:**  
    - R1: Append U to any string ending in I.  
    - R2: Replace **any** occurrence of "II" with U.  
    - R3: Delete **any** occurrence of "UU".  
    - R4: Append "II" to the end of any string.  

  - **Invariant:** **Parity of the number of I's** (odd/even).  
    - Start: "MI" has 1 I (odd).  
    - R1: Appends U → I-count unchanged (parity preserved).  
    - R2: Replaces "II" (2 I's) with U → I-count decreases by 2 (parity preserved).  
    - R3: Deletes "UU" → I-count unchanged (parity preserved).  
    - R4: Appends "II" (2 I's) → I-count increases by 2 (parity preserved).  
    → *All reachable strings have an **odd number of I's**.*  

  - **Target Reachability:**  
    - **MUIU:** 1 I (odd) → **reachable** (e.g., MI → MIII (R4) → MUI (R2 on first "II") → MUIU (R1)).  
    - **MIII:** 3 I's (odd) → **reachable** (MI → MIII (R4)).  
    - **MU:** 0 I's (even) → **unreachable**.  
    - **MUII:** 2 I's (even) → **unreachable**.  

  ---

  ### **Workshop Timeline (75 min total)**  
  #### **Phase 1: Inside the System (15 min)**  
  - **Goal:** Derive a **reachable** target to practice rules and build confidence.  
  - **Task:** "Derive **MIII** from **MI** using the rules."  
  - **Roles:**  
    - Participants work in **teams of 3–4** (4 teams total).  
    - Each team uses index cards to write derivation steps (e.g., `MI → MIII (R4)`).  
  - **Timing:**  
    - 0–5 min: Explain rules, split teams, start derivations.  
    - 5–10 min: Teams derive MIII (trivial: one step via R4).  
    - 10–15 min: **Quick share-out:** 1 team shows derivation. Emphasize guaranteed success when working inside.  

  #### **Phase 2: The Impossible Quest (40 min)**  
  - **Goal:** Struggle with an **unreachable** target; discover the need to "jump out."  
  - **Task:** "Derive **your target** or **prove it's impossible**. You don’t know which it is!"  
    - Assign targets: 2 teams get **MU** (0 I's), 2 teams get **MUII** (2 I's).  
  - **Rules for Challenges:**  
    - If a team claims "impossible," they must:  
      1. State a **property** (e.g., "number of I's is odd").  
      2. Prove it holds for **MI** and **all rules preserve it**.  
      3. Show the **target lacks it**.  
    - Another team acts as **referee**: checks proofs for logical holes.  
  - **Timing:**  
    - 15–20 min: Teams attempt derivations (expect frustration).  
    - 20–35 min: Circulate and **nudge** stuck teams:  
      - *"What properties never change? Count something!"*  
      - *"Does your derivation feel infinite? Why?"*  
    - 35–50 min: Teams with proofs present; referees critique.  
    - **Predictable Outcomes:**  
      - Most teams grind endlessly inside the system.  
      - 1–2 teams discover the I-parity invariant and prove impossibility.  

  #### **Debrief: Meta-Level Reflection (20 min)**  
  - **Key Contrast:**  
    | **Inside the System** | **Outside the System** |  
    |------------------------|------------------------|  
    | Finite/infinite derivations | Single invariant property |  
    | "I haven’t found it yet" | "It’s impossible because..." |  
    | Rules as opaque steps | Rules as preservers of structure |  
  - **Discussion Prompts:**  
    1. *"How did Phase 2 feel vs. Phase 1? What changed?"*  
       - *(Expected: Frustration → insight; tactics → strategy)*  
    2. *"Why does counting I's feel like 'cheating'? Is it?"*  
       - *(Answer: It’s meta-reasoning—uses arithmetic outside the string rules.)*  
    3. *"Could we encode the invariant *inside* the system? Why not here?"*  
       - *(Answer: This system lacks symbols for numbers/meta-claims.)*  
  - **Limit of the Activity:**  
    - **Can:** Show invariant-based impossibility proofs.  
    - **Cannot:** Simulate **undecidability** (Gödel’s incompleteness).  
      - *Clarify:* "Here, jumping out **always works**—but in complex systems (e.g., arithmetic), some truths **have no proof inside OR outside** the system. Invariants aren’t omnipotent!"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Teams conflate *"I haven’t found it"* with *"impossible."*  
     - **Fix:** Ask: *"Could there be a derivation you missed? How do you **know**?"* Push for proof.  
  2. **Problem:** Teams find **useless invariants** (e.g., "starts with M").  
     - **Fix:** Referee challenge: *"Does this prove MU is impossible?"* (No—both start with M.)  
  3. **Problem:** Teams brute-force without meta-insight.  
     - **Fix:** Nudge: *"List all strings you can derive in 1–2 steps. What do they have in common?"*  
  4. **Problem:** Incorrect invariant (e.g., "total symbols even").  
     - **Fix:** Peer review: *"Show how R2 preserves this property."* (R2: "II"→"U" changes symbol count by -1 → not preserved!)  

  ---

  ### **Materials & Notes**  
  - **Whiteboard:** Write rules + targets. Track team progress.  
  - **Index Cards:** Teams write derivations/proofs.  
  - **Emphasis:** Avoid the words "invariant" or "meta" until debrief. Let frustration motivate insight.  
  - **Gödelian Gap:** Explicitly state post-activity: *"Real systems can be **incomplete**—no invariant might capture every truth. This workshop shows a **best-case scenario**."*  

  This design forces engagement with the system’s boundaries, making the meta-level leap feel earned. The modified rules ensure novelty, while the peer-referee system grounds claims in evidence.
