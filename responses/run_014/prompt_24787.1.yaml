  After presenting these scenarios, I need to provide analysis. I should identify the key feature creating the judgment gap - which is likely the physical movement or bodily action in the doing case versus mere inaction in the allowing case. Then I'll show how removing this feature (by making both cases involve inaction) collapses the gap. Finally, I'll explain how a consequentialist would argue that the distinction is psychologically compelling but morally irrelevant, pointing out cognitive biases that make actions seem more salient than omissions.

