answer: |-
  ### Scenario 1 (Doing/Commission)
  Janine, a project manager, holds a grudge against her colleague, Ben. She knows Ben needs to email a critical design file to a major client by 3 PM today to secure their contract. While Ben is away from his desk, Janine sees his unsent email draft open on his unlocked computer, with the file correctly attached. Deliberately wishing to harm Ben’s career, she deletes the attachment from the email and sends it without it. As Janine foresaw, the client receives the incomplete email, loses confidence, cancels the contract, and Ben suffers significant career damage.

  ### Scenario 2 (Allowing/Omission)
  Janine, a project manager, holds a grudge against her colleague, Ben. She knows Ben needs to email a critical design file to a major client by 3 PM today to secure their contract. While walking past Ben’s desk, she sees his unsent email draft open on his unlocked computer. Ben has forgotten to attach the file. Janine recognizes this immediately and knows Ben will be back too late to fix the mistake before the deadline. Deliberately wishing to harm Ben’s career, she chooses not to mention the missing attachment or alert Ben. She walks away. As Janine foresaw, Ben sends the email without the attachment, the client cancels the contract, and Ben suffers significant career damage.

  ---

  ### Analysis

  1.  **The Persuasive Feature:** The core difference is the presence of a *specific bodily movement initiating the causal chain leading directly to harm* in Scenario 1 (deleting the attachment and sending the email), versus the *absence of a bodily movement to interrupt an independently unfolding harmful sequence* in Scenario 2 (failing to speak/warn Ben). The harm in Scenario 1 originates from Janine's direct physical action; in Scenario 2, it originates from Ben's own omission, which Janine merely fails to correct.

  2.  **Collapsing the Judgment Gap (Variant):** Modify both scenarios so Janine is the *only person who can possibly act*. Replace Ben's active role in Scenario 2.
      *   *Variant Scenario 1:* Janine is solely responsible for sending the file. She deliberately attaches the wrong file (or corrupts the right one) before sending.
      *   *Variant Scenario 2:* Janine is solely responsible for sending the file. She knows the correct file is ready in a shared folder. At the deadline, she deliberately *does not click "send"* on the email she has drafted with the correct file name listed (but not attached), knowing the client requires it by 3 PM.
      In these variants, Janine is the sole agent, and the "act" in both is functionally equivalent: an intentional failure to get the correct file to the client. Lay judgments of blameworthiness between the "active sabotage" (wrong file) and the "passive failure" (not sending) are typically much closer, often collapsing entirely, as the initiating bodily movement difference is removed; both are now clear failures of Janine's direct responsibility.

  3.  **Consequentialist Diagnosis of Misleading Influence:** A consequentialist would argue the pump leverages a deep-seated cognitive bias: our psychology perceives *actively initiating* harm (a "doing") as more salient, causally direct, and intuitively "closer" to the outcome than *failing to prevent* harm (an "allowing"), even when the foreseen outcome, intentions, probabilities, relationships, and all result states are identical. This bias stems from evolutionary pressures favoring aversion to direct aggression and efficient causal attribution ("X *made* Y happen" vs. "X *let* Y happen"). However, the consequentialist maintains that *only the consequences matter morally*. Since the harm (client loss, career damage), the intention (wishing harm), the foreseeability (certain), and all other result-oriented factors are identical, there is no *moral* difference. Judging Scenario 1 as worse is an error induced by psychological salience, not moral reality. The pump reveals our flawed intuitions, not a genuine moral distinction. The consequentialist would urge focusing on the net harm caused and the agent's foresight and intentions, which are held constant, rendering the doing/allowing distinction irrelevant to moral blameworthiness in these matched cases.
