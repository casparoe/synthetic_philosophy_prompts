  #### **Overview**
  Participants repeatedly guess a hidden target number (e.g., 42) across four rounds, simulating Dennett's taxonomy. Rules shift each round to mirror Darwinian (blind variation/selection), Skinnerian (learning from outcomes), Popperian (hypothesis testing before action), and Gregorian (installed representational tools) creatures. The activity uses paper, pens, a timer, and a fixed scoring system.

  **Target Number:** 42 (hidden until the final debrief).  
  **Participants:** 16 students.  
  **Duration:** 75 minutes (5-min buffer included).  
  **Materials:**  
  - Paper/pen for each student.  
  - Timer.  
  - Random number generator (for mutations/Gregorian assignment).  
  - Scoreboard (whiteboard or poster).  

  ---

  ### **Rules and Timeline**  
  *(Total: 75 minutes)*  

  #### **Round 1: Darwinian Creatures** (15 minutes)  
  **Rules:**  
  - Students write a guess (1–100) **without feedback**.  
  - Scoring: **Absolute difference from 42** (e.g., 50 → |50-42| = 8 points). Lower = better.  
  - **Selection:** Top 8 guesses (lowest scores) "survive." Bottom 8 are "extinct" (cannot reproduce).  
  - **Reproduction:** Survivors generate 1 "offspring" guess by **mutating their number** ±1–10 (random).  
  - **Final Scoring:** All 16 new guesses scored. Top 8 win the round.  

  **Timeline:**  
  - 0:00–0:03: Guess 1 (blind).  
  - 0:03–0:06: Scoring/selection (instructor ranks guesses).  
  - 0:06–0:09: Survivors mutate to create offspring.  
  - 0:09–0:12: Score offspring + survivors. Announce winners.  
  - 0:12–0:15: Quick transition.  

  **Costly Element:** Bottom 8 lose reproductive rights (simulates extinction). Scores are permanent (no do-overs).  

  ---

  #### **Round 2: Skinnerian Creatures** (15 minutes)  
  **Rules:**  
  - Students make **4 sequential guesses**.  
  - After **each guess**, they receive **feedback** (absolute difference from 42).  
  - **Scoring:** Lowest absolute difference across all 4 guesses (e.g., best = 2 points).  
  - **No pre-testing:** Actions are "committed" upon submission.  

  **Timeline:**  
  - 0:00–0:02: Guess 1 → Feedback.  
  - 0:02–0:04: Guess 2 → Feedback.  
  - 0:04–0:06: Guess 3 → Feedback.  
  - 0:06–0:08: Guess 4 → Feedback.  
  - 0:08–0:12: Scoring (record best score).  
  - 0:12–0:15: Transition.  

  ---

  #### **Round 3: Popperian Creatures** (20 minutes)  
  **Rules:**  
  - Students get **3 test tokens** (hypothetical trials).  
  - For each token, they submit a test guess and receive feedback **without penalty**.  
  - After testing, they submit **1 real guess** (scored).  
  - **Scoring:** Absolute difference of the real guess.  

  **Timeline:**  
  - 0:00–0:03: Use test token 1 → Feedback.  
  - 0:03–0:06: Use test token 2 → Feedback.  
  - 0:06–0:09: Use test token 3 → Feedback.  
  - 0:09–0:12: Submit real guess → Scoring.  
  - 0:12–0:15: Record scores.  
  - 0:15–0:20: Transition.  

  ---

  #### **Round 4: Gregorian Creatures** (20 minutes)  
  **Rules:**  
  - **Phase 1 (pre-tool):** All students submit 1 test guess → Feedback.  
  - **Mid-Round:** Randomly select **8 students** to receive a **representational tool**:  
    > *"The number is between 40 and 60."*  
  - **Phase 2 (post-tool):** All students get 2 test tokens + 1 real guess.  
  - **Scoring:** Absolute difference of the real guess.  
  - **Key:** Compare scores of tool-receivers vs. non-receivers.  

  **Timeline:**  
  - 0:00–0:03: Test guess (no tool) → Feedback.  
  - 0:03–0:05: Distribute tool to 8 random students.  
  - 0:05–0:08: Test token 1 → Feedback.  
  - 0:08–0:11: Test token 2 → Feedback.  
  - 0:11–0:14: Real guess → Scoring.  
  - 0:14–0:18: Record/compare scores.  
  - 0:18–0:20: Transition to debrief.  

  ---

  ### **Debrief** (15 minutes)  
  **Map to Dennett’s Framework:**  
  1. **Darwinian:**  
     - *Generate-and-test:* Random variation (mutations) + environmental selection (extinction).  
     - *Competence without comprehension:* "Survivors" weren’t smarter—they were lucky. Selection filters incompetence blindly.  

  2. **Skinnerian:**  
     - *Generate-and-test:* Actions generate feedback → reinforcement shapes future guesses.  
     - *Competence without comprehension:* Learning from outcomes, but no internal model (e.g., testing hypotheses mentally).  

  3. **Popperian:**  
     - *Generate-and-test:* Hypothetical trials (test tokens) simulate "internal testing" before action.  
     - *Competence via comprehension:* Foresight reduces costly errors (real guess improved by mental rehearsal).  

  4. **Gregorian:**  
     - *Generate-and-test:* Tool reconfigures mental space (e.g., narrowing to 40–60).  
     - *Competence via installed tools:* Representation ("map") beats raw cleverness (non-receivers often score worse).  

  **Key Discussion Points:**  
  - Why Gregorian tools triumph: They compress search spaces (e.g., 100 options → 20).  
  - **Limitation of Darwinian Round:** In nature, extinct creatures don’t return. Here, "extinct" students rejoined later rounds—**highlight this gap**:  
    > *"In real selection, failed trials vanish forever. Our game can’t replicate that loss—extinct lineages don’t get second chances. This biases our simulation toward adaptability."*  

  ---

  ### **Predictable Challenges + Solutions**  
  1. **Darwinian Round Feels "Unfair":**  
     - **Why:** Luck dominates; low-scorers are punished.  
     - **Mitigation:** Pre-frame it: *"This round isn’t about fairness—it’s about blind selection. Notice how competence emerges from luck plus filtering."*  

  2. **Time Crunch in Feedback Rounds:**  
     - **Why:** Scoring 16 guesses takes time.  
     - **Fix:** Use TAs/pre-selected student helpers to expedite scoring. Pre-generate feedback queues.  

  3. **Gregorian Tool Resentment:**  
     - **Why:** Non-receivers may feel disadvantaged.  
     - **Mitigation:** Post-activity, reveal the tool was random (not merit-based) to prove it’s the *representation*—not intelligence—that drove success.  

  4. **Over-Investment in Guessing:**  
     - **Why:** Students may fixate on "winning" vs. the philosophy.  
     - **Fix:** Remind them: *"Focus on how the rules shape your thinking, not the score."*  

  ---

  ### **Honest Limitation**  
  **The Irreproducible Darwinian Element:**  
  > *"In true Darwinian selection, extinction is irreversible—lineages that fail leave no descendants. Our game resets ‘extinct’ students each round for logistical reasons, but this dilutes the stakes. In debrief, we must emphasize that real selection erases failures permanently, making initial variation truly costly."*  

  This activity balances simplicity with experiential learning, using a repeated task to crystallize Dennett’s hierarchy. The Gregorian twist ensures students *feel* how tools transform cognition—not just hear about it.
