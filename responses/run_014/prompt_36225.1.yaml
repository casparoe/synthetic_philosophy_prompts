  1. Agreed claims (including non-obvious ones)
  2. A disagreements table with each side stating their view on the same disagreement
  3. Cruxes section with 3-4 sub-questions that would move at least one party
  4. For each crux, a test or argument both agree bears on it, and each party's prediction
  5. Closing section on substantive vs. verbal disputes

  We must keep the positions sophisticated without conceding more than each side actually would. The retributivist holds that punishment is a duty of justice even without good effects; the consequentialist holds punishment is justified only by its effects.

  Let's break it down:

  **Preamble**: Brief, signed by both.

  **Agreed Claims** (numbered):
  - Both reject torture and grossly disproportionate punishment.
  - Both accept that punishment involves deliberate suffering and needs justification.
  - Both accept some version of negative retributivism (though the consequentialist sees it as defeasible, the retributivist as absolute).
  - Both accept that punishment has an expressive function (disagree on why: intrinsic vs. instrumental).
  - Both agree that reform of the offender counts in favor of leniency (disagree on why).
  - ... and other non-obvious points we can think of.

  **Disagreements Table**:
  We'll have rows for key disagreements. Each row has two columns: one for the retributivist's wording, one for the consequentialist's wording of the same disagreement.

  Example:
  - Row 1: The point of punishment.
    - Retributivist: "The point is to give the offender what justice requires they deserve for their wrongdoing."
    - Consequentialist: "The point is to reduce future offending through deterrence, incapacitation, and rehabilitation."

  But note: the table should make clear these are two formulations of the same core disagreement.

  Other disagreements might include:
  - The permissibility of punishing the innocent in extreme hypotheticals.
  - The role of desert in setting the amount of punishment.
  - The justificatory basis for punishment.

  **Cruxes Section**:
  Identify 3-4 key sub-questions. The user suggested:
  (a) Liability: Have the guilty made themselves liable to suffering? Or is liability solely a function of consequences?
  (b) Means vs. Response: Moral difference between harming as a means and harming in response to wrongdoing?
  (c) The sheriff case: Framing an innocent to prevent a riot, and parallel about punishing an innocent to prevent vast crime.
  (d) Punishing the reformed or dead: Is there still a reason?

  We'll use these and maybe one more? But the user said 3-4.

  **For Each Crux**:
  - A test or case both agree bears on it.
  - Each party's prediction about what the test would show or how it would be resolved.
  - Note if they'd interpret the same outcome differently.

  **Closing Section**:
  Discuss which parts are substantive and which might be verbal. Example: whether "intrinsic desert" is a real metaphysical issue or just a way of describing the same facts.

  **Constraints**:
  - Keep under 1,500 words.
  - Sophisticated: Both sides are aware of standard objections and don't concede their core tenets.

  Let's draft:

  ---

  **Preamble**:
  After a year of collaborative examination, we, a positive retributivist and a consequentialist, jointly affirm the following points of agreement and clarify our remaining disagreements. We offer this document as a map of the terrain, not a resolution, in the hope that it advances understanding.

  **Agreed Claims**:

  1. Punishment involves the deliberate infliction of suffering and therefore requires strong justification.
  2. Both retributivism and consequentialism categorically reject torture and punishments grossly disproportionate to the offense, though for different reasons.
  3. Both perspectives endorse a principle of negative retributivism: that it is unjust to punish the innocent. The consequentialist holds this principle is defeasible in extreme hypothetical scenarios (e.g., where punishing one innocent could save many lives), while the retributivist holds it as absolute.
  4. Both recognize an expressive or censuring function of punishment: it communicates societal condemnation of wrongdoing. The retributivist sees this expression as intrinsically fitting, while the consequentialist sees it as instrumentally valuable for reinforcing norms and deterring crime.
  5. Both agree that genuine reform of an offender counts in favor of leniency in sentencing. The retributivist interprets reform as reducing the offender's desert, while the consequentialist sees it as reducing the need for deterrent or incapacitative measures.
  6. Both acknowledge that the state's authority to punish is constrained by considerations of fairness and proportionality, though these are derived from different foundations (desert vs. optimal social outcomes).
  7. Both accept that the suffering of the punished is a moral cost that must be outweighed by justificatory reasons, though they differ on what reasons can do so.
  8. Both reject pure vengeance as a justification for state punishment.

  **Disagreements Table**:

  | Disagreement                                                                 | Retributivist Statement                                                                                                 | Consequentialist Statement                                                                                               |
  | :--------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------- |
  | **The primary justification for punishment**                                 | Punishment is justified because justice requires that wrongdoers suffer in proportion to what they deserve.             | Punishment is justified only by its consequences, such as deterring future crimes, incapacitating offenders, and rehabilitating them. |
  | **The permissibility of punishing the innocent**                             | It is categorically impermissible to punish an innocent person, regardless of the consequences.                         | While generally abhorrent, the punishment of an innocent person may be permissible in principle if it were the only way to prevent catastrophic harm. |
  | **The role of desert in determining the amount of punishment**               | The amount of punishment must be proportionate to the offender's desert, which is determined by the gravity of the offense and the offender's culpability. | Desert is at best a heuristic for setting punishments that achieve optimal consequences; the ideal punishment is set solely by its expected effects. |
  | **The moral significance of an offender's wrongdoing**                       | Wrongdoing creates a moral debt that must be repaid through suffering; the state has a duty to exact this repayment.    | Wrongdoing is relevant only as a trigger for interventions that prevent future harm; there is no intrinsic moral debt requiring suffering. |

  **Cruxes Section**:

  We identify the following as pivotal questions whose resolution would significantly advance the debate:

  1. **Liability to Suffering**: Have the guilty, by their wrongdoing, made themselves liable to state-imposed suffering in a way that the innocent have not? Or is liability to hard treatment solely a function of the consequences of imposing it?
     - **Test/Case**: Consider a guiltless person (e.g., someone who committed a crime under circumstances that negate moral responsibility, such as a brain tumor causing violent behavior) versus a fully responsible offender. Both parties agree that the case bears on whether desert is grounded in moral responsibility.
       - *Retributivist Prediction*: The guilty are liable because they have culpably wronged others, creating a desert claim. The guiltless are not liable. This distinction is fundamental and not reducible to consequences.
       - *Consequentialist Prediction*: Liability is contingent on the consequences of punishment. If punishing the guiltless person would produce better overall consequences (e.g., deterring others with similar tumors from committing crimes), then they may be liable. The distinction lies in the causal chain, not in desert.

  2. **Harming as Means vs. Response**: Is there a morally significant difference between harming someone as a means to benefit others and harming them in response to what they have done?
     - **Test/Case**: Compare (A) punishing a known offender to deter others, and (B) framing an innocent person to deter others. Both parties agree that the comparison bears on whether the offender's guilt changes the moral permissibility of using suffering as a deterrent.
       - *Retributivist Prediction*: There is a profound moral difference: (A) is permissible (if deserved) while (B) is never permissible. The difference lies in the offender's desert.
       - *Consequentialist Prediction*: The difference is one of degree and reliability: (B) is typically less effective and more risky, but in hypothetical cases where it is equally effective and reliable, the moral difference diminishes. The offender's guilt matters only instrumentally.

  3. **The Sheriff Case and Its Implications**: Does the retributivist's absolute refusal to punish an innocent person (e.g., the sheriff who frames an innocent to prevent a riot) commit them to rejecting consequentialist reasoning even in clear cases of catastrophic harm prevention? And does this imply that the retributivist must oppose any punishment that risks innocent suffering?
     - **Test/Case**: The classic sheriff case and its extension: if a legal system's error rate means that punishing the guilty inevitably risks punishing some innocent, does the retributivist's absolute prohibition extend to rejecting the entire system?
       - *Retributivist Prediction*: The prohibition on punishing the innocent is absolute; thus, the sheriff must not frame the innocent. However, a system that punishes only the guilty (with due process) is permissible even with a small error rate because it does not *deliberately* punish the innocent. The system must aim only at the guilty and minimize errors.
       - *Consequentialist Prediction*: The sheriff case shows that absolutism leads to avoidable catastrophe; thus, retributivism is implausible in extreme cases. Moreover, any real-world system risks punishing innocents, so the retributivist must either accept that their theory requires abandoning punishment altogether (due to inevitable errors) or admit a consequentialist override.

  4. **Punishing the Reformed or Deceased**: If an offender genuinely reforms before sentencing, or dies, is there still a reason to punish? What kind of reason is it?
     - **Test/Case**: An offender who commits a serious crime but then undergoes a genuine moral transformation before arrest, or dies before trial.
       - *Retributivist Prediction*: The reason to punish may still exist but is weakened or negated by reform (if reform reduces desert) and extinguished by death. Desert is tied to the culpable act at the time it was committed, but reform can alter the offender's current desert. Punishing the dead is incoherent because desert requires a subject.
       - *Consequentialist Prediction*: Punishment is unwarranted because it produces no benefits: the reformed offender poses no threat, and the dead cannot be deterred or incapacitated. Any expressive function would be wasteful or counterproductive.

  **Closing on Substantive vs. Verbal Disagreements**:

  We agree that some of our disagreements are substantive, while others may be partially verbal:

  - **Substantive**: The question of whether justice requires suffering for wrongdoing independent of consequences is a deep moral and metaphysical divide. The permissibility of punishing the innocent in extreme cases is a substantive ethical disagreement.
  - **Potentially Verbal**: The expressive function of punishment might be described in compatible terms: the retributivist's "intrinsic fittingness" and the consequentialist's "instrumental value" could be referring to the same social facts but emphasizing different aspects. However, the disagreement about whether desert is a fundamental moral fact or an emergent social property remains substantive.

  We acknowledge that even after this collaboration, our core commitments remain. Yet we have identified clearer points of engagement for future dialogue.

